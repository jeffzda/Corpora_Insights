  what_happened: The evolve Project case study demonstrated that operating envelopes
    enable DER to participate in AEMO markets for energy and ancillary services without
    breaching distribution network physical limits, by ensuring forward bids are constrained
    to the available network capacity published in the operating envelope.
  lesson_learnt: DER aggregators and VPP operators planning market participation should
    align operating envelope time intervals with the relevant market settlement interval
    (5 or 30 minutes) — this alignment is essential to ensure forward bids in energy
    and ancillary services markets are firm and do not risk creating network constraint
    violations at dispatch.
