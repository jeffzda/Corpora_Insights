  publish_date: 2020-10
  project_name: evolve Project
  what_happened: High uptake of unorchestrated residential solar PV was already causing
    over-voltage conditions on ACT distribution network segments during the middle
    of the day in 2018, demonstrating that existing static network management approaches
    were insufficient to accommodate the volume of DER being installed.
  lesson_learnt: Network operators planning for DER integration should treat spring
    and autumn midday periods — when solar generation peaks and demand is low — as
    the primary stress-test scenario for voltage management solutions; voltage measurements
    from real customer connections provide the most reliable evidence base for sizing
    the operating envelope response required.
