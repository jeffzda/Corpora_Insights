  source_title: On the Implementation and Publishing of Operating Envelopes - evolve
    Project M5 Knowledge Sharing Report
  publish_date: '2021'
  project_name: evolve DER Project (ARENA 2018/ARP154)
  what_happened: Aggregators in the evolve project had heterogeneous control capabilities
    — some lacked solar curtailment due to the solar inverter not being under aggregator
    control or absent firmware support, and some lacked reactive power control due
    to firmware limitations or electrical configuration constraints. Not all aggregators
    could support all envelope control modes.
  lesson_learnt: When designing a DER coordination platform, do not assume uniform
    aggregator control capabilities — map each aggregator's actual capabilities (solar
    curtailment, reactive power control, import/export limiting) before finalising
    envelope specifications, as firmware gaps and electrical configuration constraints
    will create a leaky abstraction requiring the utility server to hold more site-level
    detail than anticipated.
