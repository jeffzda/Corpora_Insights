  what_happened: The case study demonstrated that dynamic operating envelopes enable
    larger solar PV systems to be installed at customer premises without breaching
    network limits. With 80% of sites controllable and 10 kW systems, annual energy
    export through transformer 2-985358 reached 927 MWh — approximately 235% more
    than the fixed-curtailment baseline of 352 MWh — without increasing network asset
    sizes.
  lesson_learnt: DNSPs and solar installers should consider DOE-enabled connections
    as an alternative to hard inverter size limits — allowing customers to install
    larger solar systems (up to 10–20 kW) managed under dynamic operating envelopes
    can increase feeder energy throughput by over 200% compared to fixed physical
    curtailment, without requiring network augmentation.
