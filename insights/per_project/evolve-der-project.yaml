- record_id: ARENA-DLV-10603
  source_title: Using the CIM for Electrical Network Model Exchange - Evolve Project
    Knowledge Sharing Report Number 1
  publish_date: 2020-02
  project_name: Evolve Project (ARENA 2018/ARP154)
  what_happened: Enterprise Service Buses (ESBs), used by DNSPs to integrate billing
    and customer systems via CIM standards, were found to be unsuitable for model
    exchange between ADMS and GIS systems. None of the DNSP partners had successfully
    implemented ADMS-GIS model exchange via ESB, and the authors were aware this was
    also the case across the broader industry.
  lesson_learnt: Do not attempt to use an Enterprise Service Bus for CIM-based electrical
    network model exchange between ADMS and GIS — ESBs are designed for small atomic
    transactions and cannot handle CIM XML payloads performantly; use direct integration
    or alternative serialisation mechanisms instead.
