  publish_date: 2021-03
  project_name: Evolve DER Project
  what_happened: DNSP partners had not performed psychometric testing on staff supporting
    operational technology systems, even though such testing was carried out on users
    of those systems — a gap identified as a potential insider threat risk given that
    a cyber-attack that involves taking over OT systems would most likely come from
    an inside job.
  lesson_learnt: DNSPs should consider extending psychometric testing to OT support
    staff, not just OT users — the consequences of an insider-enabled cyber-attack
    that takes over ADMS systems are severe enough (potential system black start)
    to warrant equivalent screening to that applied to OT operators.
