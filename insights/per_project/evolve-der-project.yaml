  what_happened: The IEEE 2030.5 subscription/notification model, which could reduce
    communication overhead for DER devices, was found to be impractical in consumer
    internet environments because home routers commonly block inbound connections
    via firewall rules or NAT, and the model requires additional authentication beyond
    the standard mTLS connection.
  lesson_learnt: Do not rely on IEEE 2030.5 subscription/notification as a primary
    mechanism for reducing bandwidth in residential DER coordination deployments —
    consumer internet NAT and firewall constraints make reliable inbound notification
    delivery infeasible for most residential endpoints; use aggregator-level bulk
    endpoints and group management instead to reduce communications overhead.
