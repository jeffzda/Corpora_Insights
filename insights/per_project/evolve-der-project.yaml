    drives most of the benefit rather than intra-day variation.'
  lesson_learnt: When selecting operating envelope time resolution for solar export
    management, 30-minute intervals provide marginally greater energy throughput than
    monthly intervals, but the dominant driver of benefit is seasonal demand variation
    — deploying monthly operating envelopes as an interim step provides most of the
    available gain and may be easier to implement on networks without high-frequency
    communications infrastructure.
