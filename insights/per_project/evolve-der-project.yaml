  publish_date: 2020-02
  project_name: Evolve Project (ARENA 2018/ARP154)
  what_happened: LV network asset data in DNSP source systems (GIS) was found to be
    incomplete and inaccurate — connectivity, conductor types, and other attributes
    were often missing — creating a foundational challenge for the Evolve Platform's
    operating envelope calculations, which require accurate LV network models.
  lesson_learnt: 'Projects developing DER coordination or operating envelope platforms
    should treat LV network data quality as a primary risk: source system data for
    LV assets is typically poor, and the project design should include explicit strategies
    for data estimation, imputation, and quality flagging from the outset rather than
    discovering this during platform development.'
