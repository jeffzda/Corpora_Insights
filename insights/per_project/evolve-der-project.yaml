  source_title: Using the CIM for Electrical Network Model Exchange - Evolve Project
    Knowledge Sharing Report Number 1
  publish_date: 2020-02
  project_name: Evolve Project (ARENA 2018/ARP154)
  what_happened: The Evolve Project developed a custom CIM profile and open-source
    CIM libraries in multiple programming languages (Java, JavaScript, C#), using
    protobuf as the IDL and gRPC as the transport layer. This approach was found to
    provide significant productivity benefits to application developers by eliminating
    the need to parse XML and providing a developer-friendly in-memory object model.
  lesson_learnt: DER platform projects integrating with multiple DNSP systems should
    invest in building shared CIM libraries with language bindings rather than requiring
    each integration team to implement XML parsing independently — a well-designed
    library abstraction layer reduces uptake costs, enforces consistent data modelling,
    and accelerates partner onboarding.
