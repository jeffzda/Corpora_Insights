  project_name: evolve Project
  what_happened: For customers with both solar PV and batteries, operating envelopes
    implicitly incentivise deferring battery charging until peak solar generation
    periods (midday) rather than charging from the grid, thereby reducing export that
    might breach network voltage or thermal limits without explicitly prescribing
    behind-the-meter behaviour.
  lesson_learnt: When designing DER operating envelope frameworks, proponents should
    communicate to customers with solar-plus-battery systems that operating envelopes
    implicitly signal optimal battery dispatch (charge during high-solar midday periods)
    — this non-prescriptive signalling is a feature, not a limitation, and is unlikely
    to reduce solar ROI while helping the network manage voltage and thermal limits.
