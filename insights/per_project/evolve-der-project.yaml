  source_title: On the Implementation and Publishing of Operating Envelopes - evolve
    Project M5 Knowledge Sharing Report
  publish_date: '2021'
  project_name: evolve DER Project (ARENA 2018/ARP154)
  what_happened: The evolve project found that IEEE 2030.5, while selected as the
    communication standard, was not completely suitable for all use cases related
    to dynamic connection standards — no standard under consideration fully covered
    the required data structures and interpretations, requiring the project to develop
    extensions to the interface.
  lesson_learnt: When implementing emerging DER communication standards for novel
    applications such as dynamic operating envelopes, budget for protocol extensions
    and active participation in working groups from project outset — no existing standard
    will be fully fit-for-purpose and localisation effort (e.g. Australian Implementation
    Guide) is a necessary project deliverable, not an optional add-on.
