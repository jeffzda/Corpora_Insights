  what_happened: At the time of the report, no Australian Standard had been adopted
    covering data exchange or the CIM standards family (IEC 61970, 61968, 62325),
    despite Australia having active representation on the relevant IEC TC57 technical
    committee (via Standards Australia EL-050), and despite data exchange being identified
    as a key area for managing DER in the grid.
  lesson_learnt: Australian DER and grid software projects cannot rely on nationally
    adopted standards for network model data exchange — the absence of any Australian
    standard in this space means projects must define their own data exchange contracts
    and engage directly with international standards bodies or industry working groups
    to fill the gap.
