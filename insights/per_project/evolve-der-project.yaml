  what_happened: None of the five DNSP partners involved in the Evolve Project were
    actively engaged with IEC TC57 working groups, despite being major operators of
    the networks for which CIM standards are being developed. All expressed interest
    in participating in a local Australian working group, and the Evolve Project initiated
    steps to establish one through AEMO.
