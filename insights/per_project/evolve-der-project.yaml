  publish_date: '2021'
  project_name: evolve DER Project (ARENA 2018/ARP154)
  what_happened: IEEE 2030.5 requires TLS 1.2 session management, but horizontal server
    scaling is complicated by the session ID resumption mechanism requiring shared
    memory across load balancers; some cloud IoT hubs (e.g. Azure IoT Hub) that support
    mTLS do not support session resumption, creating additional overhead at scale
    for direct-to-device communications.
  lesson_learnt: For large-scale direct-to-device IEEE 2030.5 deployments, validate
    that the chosen cloud IoT infrastructure supports TLS session resumption before
    committing to the architecture — the absence of session resumption forces full
    TLS renegotiation per device connection, significantly increasing bandwidth and
    compute costs at scale; session tickets offer a stateless alternative where perfect
    forward secrecy is acceptable.
  issue_severity: minor
  project_type: software/data/digital
