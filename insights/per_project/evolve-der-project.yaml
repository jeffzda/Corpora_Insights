  what_happened: Approximately 44–56% of solar customers on both substations were
    observed to generate above the calculated hosting capacity value at least once
    during 2020, with the majority doing so for more than 200 days per year — confirming
    that thermal constraint violations reported by the network operator were systematic,
    not isolated events.
  lesson_learnt: When deploying hosting capacity analysis on high-DER feeders, DNSPs
    should assess both the frequency and the proportion of customers exceeding the
    hosting capacity threshold — a majority of customers exceeding limits for 200+
    days per year signals a systemic network management failure requiring urgent intervention,
    not a marginal edge case.
