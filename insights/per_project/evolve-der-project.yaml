- record_id: ARENA-DLV-10601
  source_title: Using the CIM for Electrical Network Model Exchange - Evolve Project
    Knowledge Sharing Report Number 1
  publish_date: 2020-02
  project_name: Evolve Project (ARENA 2018/ARP154)
  what_happened: The CIM XML/RDF serialisation standards (IEC 61970-501, 61970-552,
    61968-13) were evaluated for use in the Evolve Platform and found to have significant
    performance and usability problems — large payload sizes, slow serialisation/deserialisation,
    and poor developer experience — leading to a decision to replace them with gRPC
    and Google Protocol Buffers.
  lesson_learnt: Do not assume that adopting IEC CIM XML serialisation for electrical
    network model exchange will be fit for purpose in a modern software platform —
    benchmark payload size and serialisation performance early, and evaluate gRPC/protobuf
    as a higher-performance, more developer-friendly alternative before committing
    to the XML-based CIM serialisation standards.
