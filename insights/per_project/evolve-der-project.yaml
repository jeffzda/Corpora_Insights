- record_id: ARENA-DLV-30364
  source_title: On the Implementation and Publishing of Operating Envelopes - evolve
    Project M5 Knowledge Sharing Report
  publish_date: '2021'
  project_name: evolve DER Project (ARENA 2018/ARP154)
  what_happened: The evolve project identified that aggregated envelope approaches
    (where an aggregator manages a group total envelope rather than per-device envelopes)
    could not be safely implemented because DER voltage impacts are non-linear and
    not strictly additive, meaning aggregator-managed redistribution of capacity could
    breach network constraints.
  lesson_learnt: Resist pressure from aggregators to implement fully aggregated envelope
    allocation (where the aggregator redistributes a group total) without robust voltage
    impact modelling — the non-linearity of voltage impacts means that aggregator-level
    redistribution between neighbouring devices with different network locations can
    breach network constraints even when the group total is respected.
  issue_severity: minor
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The project limited calculations to envelopes directly assigned
    to individual sites and devices rather than implementing aggregated envelopes,
    prioritising network constraint compliance over aggregator flexibility.
  transferability: moderate
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id059
  - 18
  - 19
  evidence_excerpt: Envelopes are not strictly additive, as different devices may
    have different voltage impacts on the network. Thus, there is tension between
    allowing an aggregator greater flexibility (aggregating to a larger set of devices),
    and maintaining network constraints (aggregating to smaller sets of neighbouring
    devices)... the project has limited calculations to envelopes directly assigned
    to sites and devices.
