  publish_date: '2021'
  project_name: evolve DER Project (ARENA 2018/ARP154)
  what_happened: Scaling to millions of smart DER devices requires data processing
    orders of magnitude beyond current DNSP practices — the project calculated that
    1 million devices reporting at 5-minute intervals would require processing of
    60,000 data points per second, creating a significant architectural challenge
    not resolved within the project scope.
  lesson_learnt: Quantify the data throughput requirements of a fully-scaled DER coordination
    system before selecting architecture — at 1 million devices reporting 5-minute
    monitoring data, the processing load (60,000 data points/second) demands cloud-native,
    horizontally scalable infrastructure from the outset rather than conventional
    enterprise server deployments.
