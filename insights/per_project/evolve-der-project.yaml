  failure_mode: unvalidated integration
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The evolve project designs operating envelopes over a rolling
    24-hour forward horizon so DER can continue operating within the last published
    envelope during a comms outage; a multi-phase commit mechanism is also under consideration
    to ensure shared understanding of expected DER behaviour.
  transferability: broad
  delay_magnitude: null
  technology_domain: DER
