  what_happened: Workshops with all five DNSP partners revealed that while all expressed
    in-principle support for CIM adoption, none had a clear plan for how to achieve
    it, none were actively engaged with IEC TC57 working groups, and the perceived
    additional cost of requiring CIM compliance from vendors not already supporting
    the standard was a consistent barrier to adoption.
  lesson_learnt: Expecting DNSPs to adopt CIM-based integrations will fail unless
    procurement contracts explicitly require CIM compliance and vendors already support
    it — where vendors do not already have CIM-compliant interfaces, the perceived
    cost premium will block adoption; projects should work with industry bodies to
    establish shared procurement language and standards requirements.
