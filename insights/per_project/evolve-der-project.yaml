  source_title: 'The Role of Dynamic Operating Envelopes in Co-ordinating and Optimising
    DER (evolve Project Knowledge Sharing Report #4)'
  publish_date: 2022-04
  project_name: evolve Project
  what_happened: In two low-voltage network segments in Port Macquarie (Essential
    Energy), solar PV penetration reached close to 100% of households, with total
    installed capacity exceeding the thermal rating of both 315 kVA distribution transformers.
    The DNSP observed multiple instances of LV fuses blowing during peak solar generation
    as reverse power flow exceeded the LV thermal rating.
  lesson_learnt: DNSPs should proactively monitor hosting capacity on high-solar-penetration
    feeders and implement active network management before thermal fuse failures occur
    — waiting until physical failures are observed risks network reliability and customer
    impact on feeders where solar uptake approaches or exceeds transformer thermal
    ratings.
