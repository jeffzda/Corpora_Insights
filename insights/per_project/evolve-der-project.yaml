  source_title: Using the CIM for Electrical Network Model Exchange - Evolve Project
    Knowledge Sharing Report Number 1
  publish_date: 2020-02
  project_name: Evolve Project (ARENA 2018/ARP154)
  what_happened: The CIM standard does not address temporal modelling — it cannot
    describe how network assets change over time. This gap was particularly significant
    for distribution networks, which change at a much higher rate than transmission
    networks and require temporal modelling for DER operating envelope calculations
    over longer planning horizons.
  lesson_learnt: Any project building distribution-level operating envelope or DER
    management platforms should treat temporal modelling as a custom design problem
    — the CIM standard provides no mechanism for tracking network asset evolution
    over time, and this capability must be designed and implemented independently
    of the standard.
