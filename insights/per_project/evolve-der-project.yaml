  what_happened: Operating envelope export benefits from increasing solar system size
    showed diminishing returns — energy export gains reduce as nameplate capacity
    increases from 5 kW toward 20 kW because the operating envelope becomes fully
    'filled', with the envelope itself becoming the binding constraint rather than
    available solar generation.
  lesson_learnt: When sizing solar systems intended to operate under dynamic operating
    envelopes, there is an optimal system size beyond which additional capacity delivers
    diminishing export returns — practitioners should model the saturation point for
    their specific network segment and envelope profile to avoid over-investment in
    solar nameplate capacity that cannot translate to additional export.
