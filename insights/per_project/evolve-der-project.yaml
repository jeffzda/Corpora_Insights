- record_id: ARENA-DLV-10606
  source_title: Using the CIM for Electrical Network Model Exchange - Evolve Project
    Knowledge Sharing Report Number 1
  publish_date: 2020-02
  project_name: Evolve Project (ARENA 2018/ARP154)
  what_happened: The IEC standards development process requires a minimum of 36 months
    from first draft to publication, and the full lifecycle from initial creation
    to publication typically takes three to five years. This pace was found to be
    incompatible with the rate of innovation required for DER integration platforms,
    leading the Evolve Project to develop non-standard serialisation and implementation
    approaches.
  lesson_learnt: Projects building DER or grid-edge platforms should not rely solely
    on emerging IEC CIM standards as a delivery pathway — the 36-month minimum standards
    development cycle means that gaps in the standard (e.g., temporal modelling, LV
    distribution profiles) will not be filled within a typical project timeline; plan
    for custom extensions or alternative implementations from the outset.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
