  what_happened: At high penetration (80% controllable sites) with monthly operating
    envelopes, total energy export through transformer 2-989150 slightly declined
    compared to the 50% controllable scenario (214.2 MWh vs 215.5 MWh) due to congestion
    from highly correlated solar generation, even though more sites were operating
    under the envelope framework.
  lesson_learnt: When designing operating envelope rollouts for high-solar-density
    LV networks, proponents should be aware that increasing the proportion of controllable
    sites beyond a threshold may not yield additional export throughput due to correlated
    generation congestion — battery storage co-deployment is likely necessary to capture
    the remaining headroom by shifting excess solar generation in time.
