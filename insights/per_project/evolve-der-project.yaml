  source_title: On the Calculation and Use of Dynamic Operating Envelopes — evolve
    Project M4 Knowledge Sharing Report
  publish_date: 2020-10
  project_name: evolve Project
  what_happened: Communications infrastructure used to deliver dynamic operating envelopes
    to DER devices is inherently unreliable, creating a risk that DER assets revert
    to unconstrained behaviour when offline and potentially breach network physical
    or operational limits.
  lesson_learnt: Design a default fallback operating envelope — either a conservative
    envelope pre-loaded on DER devices or a progressively tightened envelope published
    well ahead of real time — so that DER assets operate safely during communications
    outages without requiring live connectivity to the operating envelope platform.
  issue_severity: moderate
  project_type: network/grid
  project_scale_band: demonstration
  lifecycle_phase: development/design
