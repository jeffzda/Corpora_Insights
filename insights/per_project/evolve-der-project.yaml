  what_happened: The case study found that peak solar generation breaches physical
    and operational network limits only when underlying demand is simultaneously low
    — specifically, on mild spring and autumn days when heating and cooling loads
    are absent and solar generation is near maximum. This creates highly correlated
    reverse flows from nearby premises.
  lesson_learnt: Network operators deploying operating envelopes should calibrate
    their dispatch algorithms to prioritise spring and autumn mild-weather periods
    as the highest-risk operational windows for solar export breaches — scheduling
    envelope calculations and monitoring resources accordingly, rather than applying
    year-round conservative limits that penalise summer and winter performance.
