  source_title: On the Implementation and Publishing of Operating Envelopes - evolve
    Project M5 Knowledge Sharing Report
  publish_date: '2021'
  project_name: evolve DER Project (ARENA 2018/ARP154)
  what_happened: The shift from an aggregator-managed VPP model (where the DNSP requests
    services from aggregator-managed groupings) to a DNSP-operated utility server
    model represented a significant operating model change for some aggregators, requiring
    them to cede control of device grouping and allocation to an external system.
  lesson_learnt: When introducing a DNSP-operated utility server model for DER coordination,
    engage aggregators early to understand their operating model and identify where
    the inversion of control (from aggregator-initiated to utility-server-initiated)
    conflicts with existing architecture — aggregators with strong VPP management
    models will require substantial re-engineering and should be given lead time.
