  what_happened: LV network topology and connectivity data was frequently not modelled
    or not modelled well in DNSP Geographic Information Systems, because under the
    historical set-and-forget paradigm this information was not needed for operational
    purposes — creating a foundational data gap that blocks DER management system
    development.
  lesson_learnt: DNSPs should prioritise LV network topology modelling in their GIS
    as an immediate data improvement initiative — the absence of this data is a fundamental
    prerequisite gap for any DER orchestration, operating envelope calculation, or
    hosting capacity assessment, and cannot be resolved quickly once a DER management
    project is underway.
