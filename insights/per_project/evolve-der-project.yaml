- record_id: ARENA-DLV-10610
  source_title: Using the CIM for Electrical Network Model Exchange - Evolve Project
    Knowledge Sharing Report Number 1
  publish_date: 2020-02
  project_name: Evolve Project (ARENA 2018/ARP154)
  what_happened: Protocol Buffers (protobuf) does not support inheritance, which is
    a core structural feature of the CIM object model. This required a design decision
    on how to represent the CIM class hierarchy in protobuf messages — an initial
    approach of flattening and duplicating parent fields was trialled, found to produce
    usability issues in the generated libraries, and was replaced with a componentised
    structure embedding parent types as sub-messages.
  lesson_learnt: When implementing a CIM-based model using protobuf/gRPC, anticipate
    that the lack of inheritance support will require a deliberate architectural decision
    on type hierarchy representation — a componentised (composition-based) approach
    where parent types are embedded as sub-messages provides better library usability
    than flattening, but adds field access complexity that must be mitigated through
    library abstraction.
  issue_severity: minor
  project_type: software/data/digital
  project_scale_band: demonstration
