  publish_date: '2021'
  project_name: evolve DER Project (ARENA 2018/ARP154)
  what_happened: IEEE 2030.5 mandates EXI (Efficient XML Interchange) encoding, but
    EXI has very limited library support across programming languages (implementations
    only in C/C++, Java, and incomplete JavaScript), and for bulk aggregator monitoring
    payloads the widely-supported gzip compression actually outperformed EXI — being
    half the size of the equivalent EXI payload for 10-device bulk data.
  lesson_learnt: Do not treat the IEEE 2030.5 EXI encoding requirement as non-negotiable
    for Australian DER deployments — the lack of broad language support for EXI is
    a substantial integration barrier for aggregators, and for common aggregator bulk-data
    scenarios gzip compression is equally or more effective; advocate for EXI to be
    made a non-mandatory option in the Australian Implementation Guide.
