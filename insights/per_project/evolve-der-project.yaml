- record_id: ARENA-DLV-30353
  source_title: On the Implementation and Publishing of Operating Envelopes - evolve
    Project M5 Knowledge Sharing Report
  publish_date: '2021'
  project_name: evolve DER Project (ARENA 2018/ARP154)
  what_happened: The CSIP/IEEE 2030.5 standard specifies device-level behaviour and
    out-of-band registration processes, but Australian DNSPs require site-level management
    (at the connection point/NMI level), creating a mismatch that required custom
    extensions for in-band device and site registration.
  lesson_learnt: Australian DER coordination platforms built on IEEE 2030.5 must plan
    for site-registration extensions from the start — the standard's device-centric
    model does not natively support NMI-based connection point identification required
    by Australian DNSPs, and out-of-band processes introduce manual overhead that
    undermines scalability.
  issue_severity: moderate
  project_type: software/data/digital
