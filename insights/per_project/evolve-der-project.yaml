- record_id: ARENA-DLV-10604
  source_title: Using the CIM for Electrical Network Model Exchange - Evolve Project
    Knowledge Sharing Report Number 1
  publish_date: 2020-02
  project_name: Evolve Project (ARENA 2018/ARP154)
  what_happened: DNSPs implementing new ADMS systems used CIM XML/RDF as an intermediate
    format for data migration from GIS, but analysis found this added complexity without
    clear benefit — in cases where the same vendor supplied both ADMS and GIS, there
    was no interoperability advantage, and the CIM is not a plug-and-play protocol,
    meaning additional custom translation work was required regardless.
  lesson_learnt: When procuring or implementing an ADMS, critically evaluate whether
    using CIM XML as an intermediate migration format actually delivers interoperability
    benefits — where the same vendor supplies source and destination systems, direct
    translation is more efficient; and where different vendors are used, confirm that
    CIM XML expressions from each vendor are compatible before assuming the standard
    provides plug-and-play integration.
