  what_happened: The actual mean LV voltage at both distribution transformers in the
    case study was approximately 245V — significantly above the nominal assumed value
    of 230V. This elevated voltage setpoint meant that one transformer (2-989150)
    became voltage-constrained rather than thermally-constrained for export, reducing
    its calculated hosting capacity.
  lesson_learnt: When calculating hosting capacity or operating envelopes, practitioners
    should use actual measured transformer voltage setpoints rather than nominal values
    — a 15V discrepancy (230V nominal vs 245V actual) changed the binding constraint
    from thermal to voltage for one transformer and reduced hosting capacity, meaning
    analysis based on nominal values would have overestimated available capacity.
