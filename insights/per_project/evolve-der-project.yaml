  source_title: On the Calculation and Use of Dynamic Operating Envelopes — evolve
    Project M4 Knowledge Sharing Report
  publish_date: 2020-10
  project_name: evolve Project
  what_happened: At the time of the evolve project, no rules or regulations existed
    that required or incentivised DNSPs to maintain a minimum DER hosting capacity,
    creating a risk that operating envelopes could be used to restrict DER export
    or connection approvals rather than to transparently allocate all available network
    capacity.
  lesson_learnt: Implementers of dynamic operating envelopes should engage with regulators
    early to establish minimum hosting capacity requirements — without such regulations
    there is no constraint preventing DNSPs from publishing unduly conservative envelopes
    that effectively restrict DER investment rather than enabling it.
