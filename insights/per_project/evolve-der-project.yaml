- record_id: ARENA-DLV-10613
  source_title: Using the CIM for Electrical Network Model Exchange - Evolve Project
    Knowledge Sharing Report Number 1
  publish_date: 2020-02
  project_name: Evolve Project (ARENA 2018/ARP154)
  what_happened: The CIM standard was originally developed to address EMS vendor lock-in
    at the transmission level, and despite 20+ years of development and investment,
    it had not materially disrupted the EMS or ADMS vendor oligopoly. The Evolve Project
    noted the parallel risk that the CIM could be superseded by alternatives such
    as Multispeak, or that only select mature parts would achieve broad adoption.
  lesson_learnt: Before committing to the CIM as a long-term interoperability foundation
    for a platform, assess the realistic adoption trajectory of the specific CIM components
    being used — selectively adopt only the parts with strong maturity and industry
    use (such as the asset ontology in 61970/61968), and avoid deep dependency on
    parts with low adoption or uncertain futures (such as XML serialisation).
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: concept/feasibility
  proponent_type: technology vendor
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: 'Adopted a selective CIM strategy: used the CIM asset ontology
    (61970-301, 61968-11) as the semantic foundation while replacing XML serialisation
    with gRPC/protobuf, and built open-source CIM libraries to reduce future adoption
    barriers.'
  transferability: moderate
  delay_magnitude: null
  technology_domain: grid/system stability
  source_pages: &id013
  - 13
  - 15
  evidence_excerpt: the main conclusions we have drawn is that the adoption of a standard
    that is not currently widely used (such as the CIM set of standards) should only
    occur after careful consideration of the likely future path of that standard.
    In the case of the CIM, there are aspects of the standard that we believe are
    worth pursuing, but others that are either not fit for purpose or involve an ongoing
    development methodology that is not appropriate to current industry needs.
