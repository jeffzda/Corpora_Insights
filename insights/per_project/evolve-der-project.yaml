  what_happened: The Sparx Enterprise Architect (EA) tool used to generate the CIM
    profile HTML documentation produced output only useful for displaying class relationships
    and attribute names — the associated descriptive text for classes and attributes
    was not handled well by the EA export tool, requiring the team to embed documentation
    separately in open-source code comments rather than in a single consolidated profile
    document.
  lesson_learnt: Do not rely on auto-generated documentation from UML modelling tools
    (such as Sparx EA) to produce complete, user-readable CIM profile documentation
    — plan for a separate documentation consolidation effort, or embed documentation
    directly in code and plan a dedicated pass to produce a unified human-readable
    reference before the platform is released for external use.
