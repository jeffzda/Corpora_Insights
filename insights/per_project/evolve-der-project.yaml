  project_name: Evolve DER Project
  what_happened: DNSPs currently have no visibility of or control over DER assets
    connected to their LV networks, as DER is not owned or operated by the DNSP and
    current connection standards contain no provisions allowing DNSPs to control or
    influence DER behaviour — creating voltage and overload issues the networks were
    not designed to handle.
  lesson_learnt: Projects developing DER coordination platforms should plan for the
    absence of any regulatory mechanism giving DNSPs control over DER assets — technical
    solutions such as operating envelopes communicated via aggregators are currently
    the only viable pathway, and policy reform will be needed to formalise this.
