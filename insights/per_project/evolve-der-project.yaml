- record_id: ARENA-DLV-17353
  source_title: 'The Role of Dynamic Operating Envelopes in Co-ordinating and Optimising
    DER (evolve Project Knowledge Sharing Report #4)'
  publish_date: 2022-04
  project_name: evolve Project
  what_happened: Fixed physical inverter curtailment set at the calculated hosting
    capacity value — the approach the DNSP had been using to manage over-voltage and
    thermal breaches — reduced total energy export through the distribution transformers
    by 15–20% compared to uncurtailed generation (62 MWh curtailed from 415 MWh at
    one transformer; 49 MWh from 247 MWh at the other).
  lesson_learnt: Fixed inverter curtailment based on a static hosting capacity value
    is unnecessarily conservative and results in 15–20% energy loss; DNSPs should
    instead implement dynamic operating envelopes which allocate available capacity
    at each time interval and substantially reduce unnecessary curtailment while maintaining
    network limits.
  issue_severity: moderate
  project_type: network/grid
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: The case study demonstrated that both monthly and 30-minute dynamic
    operating envelopes reduced curtailment to 25–57 MWh (from 62 MWh baseline) at
    transformer 2-985358 and 31–39 MWh (from 49 MWh baseline) at transformer 2-989150,
    while maintaining network limits.
  transferability: broad
