  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Added a ConnectionPoint object extension to the API allowing
    aggregators to POST NMI details directly to the utility server, replacing the
    out-of-band manual data collation step.
  transferability: moderate
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id048
