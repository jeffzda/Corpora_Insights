- record_id: ARENA-DLV-10609
  source_title: Using the CIM for Electrical Network Model Exchange - Evolve Project
    Knowledge Sharing Report Number 1
  publish_date: 2020-02
  project_name: Evolve Project (ARENA 2018/ARP154)
  what_happened: The CIM standard provides no guidance on data quality or completeness
    — it does not describe how to flag estimated, derived, or missing data within
    exchanged network models. For LV distribution networks, where data completeness
    is routinely poor, this gap meant there was no standards-based mechanism to indicate
    data confidence levels in exchanged models.
  lesson_learnt: Projects exchanging LV network model data between systems should
    define a custom data quality and completeness annotation scheme from the outset
    — the CIM provides no guidance on this, and without it, consuming systems cannot
    distinguish between accurately surveyed data and estimated or inferred values,
    which undermines model reliability for DER calculations.
