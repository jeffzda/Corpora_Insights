- record_id: ARENA-DLV-10612
  source_title: Using the CIM for Electrical Network Model Exchange - Evolve Project
    Knowledge Sharing Report Number 1
  publish_date: 2020-02
  project_name: Evolve Project (ARENA 2018/ARP154)
  what_happened: Australian distribution systems include Single Wire Earth Return
    (SWER) networks — a configuration not well covered by mainstream CIM profiles
    (CPSM, CGMES) which were designed for transmission systems. Distribution-specific
    CIM profiles were still being developed at the time of the report, requiring the
    Evolve Project to use the CIM100 model with specific PhaseCode attributes as a
    workaround for SWER representation.
  lesson_learnt: Projects modelling Australian distribution networks in CIM should
    not assume that standard vendor CIM profiles will cover SWER configurations —
    explicitly verify SWER support before selecting a CIM profile, and use CIM100
    with s1N/s2N PhaseCode attributes and WindingConnection attributes for SWER transformer
    representation.
