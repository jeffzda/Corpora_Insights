  project_name: ACT Large-scale Solar Feed-in Tariff Auction
  what_happened: All three solar farms awarded feed-in tariff entitlements under the
    ACT solar auction encountered network connection issues during development, providing
    practical experience that increased network owner acceptance of large-scale distributed
    generation.
  lesson_learnt: Early-stage utility-scale solar projects inevitably surface network
    connection issues that, while costly in the short term, build network operator
    familiarity and acceptance — factor in additional time and resources for connection
    resolution on first-of-type projects in a jurisdiction.
