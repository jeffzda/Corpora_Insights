  project_name: ACT Large-scale Solar Feed-in Tariff Auction
  what_happened: The ACT Government ran a feed-in tariff auction for 40MW of large-scale
    solar generation and achieved a weighted feed-in tariff price of $183/MWh, which
    was well below industry expectations, demonstrating that competitive auction design
    can drive down the cost of renewable energy support.
  lesson_learnt: A competitive reverse-auction mechanism for large-scale solar feed-in
    tariffs can deliver prices significantly below industry expectations — project
    developers and policymakers should consider auction design as a primary lever
    for reducing the cost of renewable energy support.
