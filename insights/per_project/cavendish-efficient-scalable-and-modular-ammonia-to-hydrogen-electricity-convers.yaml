  source_title: Cavendish - Efficient, Scalable and Modular Ammonia to H2/Electricity
    Conversion - Core Research Midpoint Update
  publish_date: 2025-06
  project_name: Efficient, Scalable and Modular Ammonia to H2/Electricity Conversion
  what_happened: CRT structured its R&D consortium to distribute technical workstreams
    across four institutions — RMIT (catalyst synthesis and characterisation), ANU
    (reactor modelling and thermodynamic analysis), Northwestern University USA (post-mortem
    SOFC electrochemical analysis), and Emerson Electric (instrumentation planning)
    — alongside CRT's own in-house manufacturing, integration, and testing activities.
  lesson_learnt: Allocating distinct, non-overlapping technical workstreams to partner
    institutions with demonstrated capability in each domain (catalyst synthesis,
    modelling, post-mortem analysis, instrumentation) enables parallel progress and
    reduces integration risk in complex multi-technology R&D projects. Define clear
    deliverable boundaries and ownership per partner at project outset to prevent
    scope overlap or gaps at integration milestones.
