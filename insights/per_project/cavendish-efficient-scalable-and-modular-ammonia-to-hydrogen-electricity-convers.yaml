- record_id: ARENA-DLV-1554
  source_title: Cavendish - Efficient, Scalable and Modular Ammonia to H2/Electricity
    Conversion - Core Research Midpoint Update
  publish_date: 2025-06
  project_name: Efficient, Scalable and Modular Ammonia to H2/Electricity Conversion
  what_happened: 'Ammonia slip (uncracked NH₃) entering the SOFC anode was identified
    as a critical risk: residual ammonia causes endothermic in-situ cracking on the
    nickel anode, creating thermal gradients and cold spots, and during start-up or
    shutdown can cause nickel nitridation, leading to catalyst deactivation or structural
    damage to the anode.'
  lesson_learnt: For ammonia-fed SOFC systems, the upstream cracker must achieve near-complete
    conversion (minimising ammonia slip) to protect the SOFC anode from nitridation
    and thermal stress — particularly during start-up and shutdown transients when
    the anode is at intermediate temperatures. System designers should specify ammonia
    slip limits at the cracker outlet as a hard design constraint, not a stretch goal,
    and validate these limits under start-up and shutdown thermal profiles as well
    as steady-state conditions.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: CRT's cracker operating at ~500°C achieves minimal ammonia slip
    under steady-state, and the micro-engineered substrate further reduces residual
    NH₃ before the SOFC inlet.
  transferability: moderate
  delay_magnitude: null
  technology_domain: hydrogen
  source_pages: &id004
  - 13
  - 14
  evidence_excerpt: If ammonia slip (uncracked NH₃) from the reactor is too high,
    several issues can arise in the SOFC... Nitriding the anode can lead to catalyst
    deactivation or structural damage. Thus, to avoid the formation of metal nitrides
    and associated degradation, it is preferable to keep NH₃ concentrations entering
    the stack as low as possible.
  confidence_note: outcome_class set to knowledge generated despite setback — the
    issue was identified analytically/experimentally and mitigated in design; no operational
    SOFC failure occurred in this project.
