- record_id: ARENA-DLV-1552
  source_title: Cavendish - Efficient, Scalable and Modular Ammonia to H2/Electricity
    Conversion - Core Research Midpoint Update
  publish_date: 2025-06
  project_name: Efficient, Scalable and Modular Ammonia to H2/Electricity Conversion
  what_happened: Ammonia and hydrogen R&D at lab scale required substantial safety
    infrastructure investment before testing could commence, including UPS-backed
    gas safety systems, dedicated canopy exhaust hoods (700 L/s extraction), multiple
    fixed ammonia sensors across laboratory and office spaces, ventilated gas cabinets,
    automated interlock shut-off systems, and a formal hazardous area zoning assessment
    by a specialist firm.
  lesson_learnt: Projects handling ammonia and hydrogen at even modest lab scales
    should budget significant time and capital for safety infrastructure — the regulatory
    and physical requirements (hazardous area classification, multi-layer ventilation,
    UPS-backed interlocks, specialist contractor engagement) are extensive and cannot
    be treated as minor ancillary work. Engage a hazardous area assessment firm early
    to define zoning before procuring gas handling equipment.
