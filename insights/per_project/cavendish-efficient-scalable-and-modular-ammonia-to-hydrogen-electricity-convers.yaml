- record_id: ARENA-DLV-1553
  source_title: Cavendish - Efficient, Scalable and Modular Ammonia to H2/Electricity
    Conversion - Core Research Midpoint Update
  publish_date: 2025-06
  project_name: Efficient, Scalable and Modular Ammonia to H2/Electricity Conversion
  what_happened: The micro-engineered substrate achieved greater than 10% improvement
    in hydrogen concentration from mixed ammonia-cracker output gas at 400°C, maintained
    structural integrity over 100+ hours of continuous operation, and performed a
    dual function as both catalytic support and passive hydrogen separation stage
    — eliminating the need for expensive palladium-based membranes.
  lesson_learnt: Designing substrate components to perform dual functions (catalytic
    support and passive gas separation) can eliminate expensive ancillary components
    such as palladium membranes, reducing system cost and complexity. This approach
    is most viable when operating temperatures allow selective permeation without
    dedicated membrane materials — validate the dual-function hypothesis early in
    the design phase before committing to membrane-dependent architectures.
