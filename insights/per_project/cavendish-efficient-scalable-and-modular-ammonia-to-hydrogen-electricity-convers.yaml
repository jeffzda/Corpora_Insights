  source_title: Cavendish - Efficient, Scalable and Modular Ammonia to H2/Electricity
    Conversion - Core Research Midpoint Update
  publish_date: 2025-06
  project_name: Efficient, Scalable and Modular Ammonia to H2/Electricity Conversion
  what_happened: Three of four novel packed-bed catalyst formulations (CRT-CAT-1,
    CRT-CAT-2, CRT-CAT-3) met or exceeded the project's ≥98% ammonia conversion target
    at 500°C, with CRT-CAT-1 and CRT-CAT-2 reaching 99.9–100% and 99.95% respectively.
    One formulation (CRT-CAT-4) achieved only 91% conversion, falling below the milestone
    target.
  lesson_learnt: Developing multiple parallel catalyst formulations in early-stage
    R&D provides optionality — when one formulation underperforms, validated alternatives
    are ready for integration, avoiding programme delay. Testing a baseline and multiple
    candidates simultaneously against a defined conversion target is an effective
    milestone management strategy for catalytic R&D projects.
