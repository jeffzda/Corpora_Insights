- record_id: ARENA-DLV-1558
  source_title: Cavendish - Efficient, Scalable and Modular Ammonia to H2/Electricity
    Conversion - Core Research Midpoint Update
  publish_date: 2025-06
  project_name: Efficient, Scalable and Modular Ammonia to H2/Electricity Conversion
  what_happened: The ammonia decomposition endothermic reaction requires 10–12 kWh
    per kilogram of hydrogen produced — approximately 35% of hydrogen's usable energy
    content — making thermal integration between the cracker and the fuel cell a critical
    system-level design challenge rather than an ancillary engineering consideration.
  lesson_learnt: System designers of ammonia-to-power platforms must treat thermal
    integration between the cracker and fuel cell as a primary design constraint from
    project inception — the energy penalty of ammonia decomposition (approximately
    35% of hydrogen's usable energy) makes heat recovery from the SOFC exhaust (~800°C
    cathode air) essential to achieving commercially viable system efficiency. Failure
    to design for thermal integration from the outset will result in significant efficiency
    penalties that are difficult to retrofit.
  issue_severity: none
  project_type: industrial decarbonisation
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: CRT designed a heat exchanger to transfer heat from the SOFC
    cathode air exhaust (~800°C) to the cracker, maintaining thermal equilibrium and
    supporting efficient ammonia decomposition.
  transferability: moderate
