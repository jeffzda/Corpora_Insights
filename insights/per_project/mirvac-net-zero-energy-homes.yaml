  what_happened: 91% of purchasers used gas cooktops in their current homes and 66%
    preferred gas cooking, creating a sales barrier for the fully electric all-induction
    specification. Purchasers who had not encountered induction cooking expressed
    hesitation during sales conversations.
  lesson_learnt: When specifying induction cooktops in all-electric residential developments,
    invest in hands-on sales team training — purchasers familiar only with gas cooking
    can be converted through in-person demonstration of a quality induction product,
    but this requires trained sales staff who can credibly address concerns in real
    time.
