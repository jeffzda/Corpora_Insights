  source_title: Mirvac - Net Zero Energy Homes - Milestone 3 Knowledge Sharing Report
  publish_date: 2024-08
  project_name: Net Zero Energy Homes – The Fabric, Altona North
  what_happened: With more than 15 unique floorplans in Stage 1, achieving a consistent
    7-star NatHERS rating across terrace-style housing was challenging — star ratings
    varied significantly across a pod of homes and required an iterative, home-by-home
    design review process using a 'shopping list' of upgrade options.
  lesson_learnt: When delivering high-density terrace-style homes to a uniform energy
    rating target, develop a 'shopping list' of cost-modelled upgrade options in consultation
    with energy consultants, and test simple low-cost inclusions (e.g. ceiling fans)
    before specifying expensive upgrades such as additional insulation — this approach
    is now transferable to achieving NCC 2022 7-star minimum compliance.
