- record_id: ARENA-DLV-36303
  source_title: Mirvac - The Fabric Milestone 2 Knowledge Sharing Report
  publish_date: 2023-05
  project_name: The Fabric - Net Zero Energy Homes
  what_happened: At the time of construction tendering, there were limited suppliers
    able to supply thermally broken windows meeting the required U value and SHGC
    rating for residential housing, resulting in less competitive pricing and supply
    chain risk. The project also specified a recently released Rheem 270L heat pump
    hot water system, creating procurement risk for a new product at scale.
  lesson_learnt: Engage window suppliers at early planning stages to assess their
    capability to meet required U value and SHGC specifications, and procure heat
    pump hot water units early — limited supplier markets for high-performance products
    reduce price competition and create programme risk if supply issues arise.
