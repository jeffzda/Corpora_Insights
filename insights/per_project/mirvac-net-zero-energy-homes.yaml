- record_id: ARENA-DLV-49260
  source_title: Mirvac - Net Zero Energy Homes - Milestone 3 Knowledge Sharing Report
  publish_date: 2024-08
  project_name: Net Zero Energy Homes – The Fabric, Altona North
  what_happened: Solar PV systems sized at 4.2kW (2-bed) and 5.3kW (3- and 4-bed)
    delivered average annual bill savings of $787 attributed to solar alone, while
    10kWh battery systems contributed an average of $577 per year, with combined solar/battery
    savings averaging $1,363 across all homes and individual homes going up to 251
    days without any grid draw.
  lesson_learnt: A 4.2–5.3kW solar PV system combined with a 10kWh battery is sufficient
    to deliver meaningful, quantified bill savings ($800–$1,520 annually depending
    on home size) and significant grid independence for residential net-zero homes
    in Victoria — these sizing parameters provide a validated reference point for
    future comparable projects.
