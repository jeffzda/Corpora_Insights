  what_happened: Purchasers were highly data-driven and cost-driven, requiring quantitative
    evidence of energy savings to support purchase decisions. Mirvac identified this
    gap and partnered with energy technology group Red Grid to provide purchasers
    with tools to understand and control their energy consumption.
  lesson_learnt: When marketing net-zero or high-efficiency homes, lead with simple
