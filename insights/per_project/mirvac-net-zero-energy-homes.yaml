- record_id: ARENA-DLV-36307
  source_title: Mirvac - The Fabric Milestone 2 Knowledge Sharing Report
  publish_date: 2023-05
  project_name: The Fabric - Net Zero Energy Homes
  what_happened: To achieve 7-star NatHERS ratings efficiently, the project adopted
    a higher base specification across all homes — including 140mm stud walls for
    R4 wall types and thermally broken windows — rather than optimising each home
    individually. While this resulted in many homes exceeding the 7-star target, it
    increased construction costs across the board.
  lesson_learnt: Assess each individual home to determine the minimum specification
    needed to achieve 7-star NatHERS rather than applying a uniform high base specification
    — over-specifying homes increases construction costs, though per-home documentation
    and coordination overhead must be weighed against the savings.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: project developer
  delay_category: null
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Mirvac identified through lessons learnt that future stages should
    adopt individual home specifications rather than a uniform elevated base build
    standard.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages:
  - 8
  - 9
  evidence_excerpt: Whilst this resulted in a high proportion of the homes exceeding
    the 7-star target, it also increased the construction cost of the homes... Recommend
    an assessment for each individual home is undertaken to meet 7-stars rather than
    adopting a base specification across all homes and only upgrade underperforming
    homes where required.
