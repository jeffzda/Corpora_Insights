  project_name: The Fabric - Net Zero Energy Homes
  what_happened: Blower door testing identified that glass sliding door systems were
    a key point of air leakage, with internal cavity slider doors and ducted heating/cooling
    systems also weak points. Additional labour and costs were required for caulking
    around these weak points to meet the 8 air changes per hour target.
  lesson_learnt: Request air tightness test results from suppliers before specifying
    products, and adopt the air permeability testing method rather than air changes
    per hour — the former provides more accurate results across different sized homes
    and identifies leakage risks before construction.
