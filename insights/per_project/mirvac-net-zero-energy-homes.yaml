  project_name: Net Zero Energy Homes – The Fabric, Altona North
  what_happened: Post-settlement data collection from residents was hampered by insufficient
    education of project and customer-facing teams on data requirements, legal obligations
    (data clauses), and how to communicate the de-identified, anonymous nature of
    data collection to residents.
  lesson_learnt: Project teams responsible for post-settlement data collection must
    be thoroughly briefed on both the legal requirements (data clauses) and the resident-facing
    rationale for data sharing — team members who cannot clearly explain the anonymity
    and benefits of data collection to residents will struggle to achieve compliance
    and data completeness.
