- record_id: ARENA-DLV-36304
  source_title: Mirvac - The Fabric Milestone 2 Knowledge Sharing Report
  publish_date: 2023-05
  project_name: The Fabric - Net Zero Energy Homes
  what_happened: The fully electric design significantly increased electrical loads
    compared to a standard gas-provisioned home. The electrical authority refused
    to account for the solar PV and battery system when calculating minimum supply
    loads, requiring the electrical substation to be upgraded from 315 kVA to 500
    kVA at additional cost to the project. Extensive consultation was also needed
    to maintain single-phase 40A supply, and future stages have since allowed for
    3-phase power.
  lesson_learnt: Engage electrical engineers and the electrical authority early to
    determine appliance loads and substation requirements for fully electric projects
    — regulatory frameworks do not yet account for solar PV and battery systems in
    load calculations, and this gap can force costly substation upgrades if not identified
    before design is finalised.
