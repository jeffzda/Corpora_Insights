  source_title: Mirvac - Net Zero Energy Homes - Milestone 3 Knowledge Sharing Report
  publish_date: 2024-08
  project_name: Net Zero Energy Homes – The Fabric, Altona North
  what_happened: The energy efficiency assessment process — required before endorsement
    of town planning applications — extended the design and construction program beyond
    typical timelines, as multiple rounds of drawing revisions were needed, and the
    higher base specification plus home-specific upgrades added complexity to construction
    sequencing.
  lesson_learnt: Projects pursuing high energy-efficiency ratings should factor the
    mandatory energy assessments into their planning application timeline and explicitly
    programme the procurement and installation of upgraded specifications — failure
    to do so will lengthen both design and construction stages beyond what is typical
    for standard homes.
