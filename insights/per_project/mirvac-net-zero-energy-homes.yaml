  project_name: The Fabric - Net Zero Energy Homes
  what_happened: At the time of design, Australian Standards requirements for battery
    installation — including clearance zones, protection measures and fire safety
    — were not clearly defined. Batteries installed on habitable walls in dense townhouses
    required non-combustible treatment, incurring additional construction costs, and
    tighter garage spaces created clearance challenges.
  lesson_learnt: Integrate battery system location and clearance requirements at an
    early design stage in high-density townhouse projects — unclear Australian Standards
    at design time can force costly retrofits such as non-combustible wall treatment,
    and insufficient garage sizing discovered late adds cost and complexity.
