- record_id: ARENA-DLV-3202
  source_title: Net Zero Energy Homes Milestone 1
  publish_date: 2021-05
  project_name: The Fabric by Mirvac - Net Zero Energy Homes
  what_happened: Solar PV placement on rooftops was complicated by restricted roof
    space on compact townhome product, overshadowing from antennae and rooftop plant,
    and overshadowing from adjacent taller buildings. Some 2-storey homes required
    upsized PV systems to compensate for shading from adjacent 3-storey townhomes.
  lesson_learnt: For higher-density townhome products, conduct rooftop shadow analysis
    during early design to account for adjacent buildings and rooftop plant — overshadowing
    in mixed-height developments may require upsized PV systems on lower-storey homes,
    increasing cost.
