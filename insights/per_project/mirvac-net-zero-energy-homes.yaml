  project_name: Net Zero Energy Homes – The Fabric, Altona North
  what_happened: The Fabric's delivery of 49 all-electric, 7-star NatHERS net-zero
    energy homes influenced industry policy, contributing to NCC 2022 minimum 7-star
    standards and being referenced as a benchmark project for the Victorian Government's
    Gas Substitution Roadmap, which phases out gas connections to new builds requiring
    planning permits from January 2024.
  lesson_learnt: Early-mover commercial demonstration projects that go beyond minimum
    standards can directly influence regulatory reform — developers willing to invest
    in above-standard delivery at scale generate the evidence base that regulators
    and governments need to justify raising industry-wide requirements.
