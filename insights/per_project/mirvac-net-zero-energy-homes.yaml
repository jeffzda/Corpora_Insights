- record_id: ARENA-DLV-3205
  source_title: Net Zero Energy Homes Milestone 1
  publish_date: 2021-05
  project_name: The Fabric by Mirvac - Net Zero Energy Homes
  what_happened: Customer research conducted via a five-day workshop with Meld Studios
    found that purchasers were not motivated by environmental benefits alone. Customers
    wanted tangible information about comfort, health, and cost savings, presented
    in simple non-technical language with diagrams.
  lesson_learnt: When marketing low-carbon or energy-efficient homes, frame benefits
    around personal comfort, health, and bill savings rather than environmental impact
    — customers respond to tangible personal outcomes and simple language, not technical
    specifications or environmental messaging.
