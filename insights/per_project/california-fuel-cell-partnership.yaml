- record_id: ARENA-DLV-37912
  source_title: Hydrogen Communities & H2City Tool
  publish_date: 2019-06
  project_name: California Fuel Cell Partnership
  what_happened: Early government grant funding from the California Energy Commission
    (first grant solicitation in 2010) stimulated the initial build-out of hydrogen
    refuelling stations, with 35 retail stations opened by 2018; however, achieving
    the target of 200 stations by 2025 requires transitioning from public to private
    capital investment.
  lesson_learnt: Government grant funding is necessary to stimulate initial hydrogen
    refuelling infrastructure build-out, but long-term policy certainty is required
    to attract the private capital investment needed to scale beyond early demonstration
    — plan the transition from public to private funding as an explicit program milestone.
