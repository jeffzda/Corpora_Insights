- record_id: ARENA-DLV-37913
  source_title: Hydrogen Communities & H2City Tool
  publish_date: 2019-06
  project_name: California Fuel Cell Partnership
  what_happened: The California Fuel Cell Partnership planned refuelling stations
    within a 15-minute drive of 94% of the state population and along major freight
    corridors, finding that strategic station placement relative to population density
    and freight routes was a key enabler of FCEV uptake.
  lesson_learnt: Hydrogen refuelling network design should be driven by population
    proximity and freight corridor coverage, not proximity to production sites — locating
    stations within a 15-minute drive of the majority of the target population and
    along key freight corridors is a prerequisite for achieving commercial FCEV uptake.
  issue_severity: none
  project_type: network/grid
  project_scale_band: programmatic/portfolio-level
