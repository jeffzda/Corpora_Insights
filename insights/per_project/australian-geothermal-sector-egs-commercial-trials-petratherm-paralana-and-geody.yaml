- record_id: ARENA-DLV-14956
  source_title: 'Looking Forward: Barriers, Risks and Rewards of the Australian Geothermal
    Sector to 2020 and 2030'
  publish_date: 2014-06
  project_name: Australian Geothermal Sector – EGS Commercial Trials (Petratherm Paralana
    and Geodynamics Innamincka Deeps)
  what_happened: Both Australian EGS commercial trial projects (Petratherm's Paralana
    and Geodynamics' Innamincka Deeps) were struggling to raise the equity contributions
    required to match government REDP grants, with Petratherm having only drilled
    one deep well and both proponents failing to progress beyond early demonstration
    stage.
  lesson_learnt: Commercial demonstration grant structures for high-risk EGS projects
    should be calibrated to the realistic fundraising capacity of small-capitalisation
    geothermal companies; when equity matching is required from companies with limited
    access to capital markets, a mismatch between grant conditions and company financial
    capacity will stall projects.
