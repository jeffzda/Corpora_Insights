  evidence_excerpt: '''high demand in the NEM on very hot days is often blamed on
    air-conditioning, however, counter-intuitively, air-conditioning loads don''t
    work well as a DR resource in the RERT program because they often don''t baseline
    well… In the case the 10-day average in the RERT baseline tends to discount the
    air-conditioning load on the very hot day because the average air-conditioning
    load on the previous 10 days has been much lower.'''
