- record_id: ARENA-DLV-53853
  source_title: Demand Flexibility Portfolio Retrospective Analysis Report
  publish_date: 2023-07
  project_name: ARENA Demand Flexibility Portfolio — Air-Conditioning Projects (AGL
    RERT, Zen Ecosystems)
  what_happened: The AEMO 10-day average baseline systematically undercounted air-conditioning
    demand response because it used consumption from the preceding 10 (lower-temperature)
    days as the counterfactual for a hot-day RERT event, and the same-day adjustment
    was calculated too early to capture air-conditioning load. This reduced financial
    incentives for participation and made air-conditioning a poor fit for RERT.
  lesson_learnt: AEMO baseline methodologies are unsuitable for temperature-sensitive
    loads such as residential air-conditioning; programs targeting these loads via
    RERT or the WDR mechanism should advocate for revised baseline methodologies before
    committing customer portfolios to these value streams.
