- record_id: ARENA-DLV-53860
  source_title: Demand Flexibility Portfolio Retrospective Analysis Report
  publish_date: 2023-07
  project_name: Pooled Energy Demand Management and Modulation
  what_happened: Pooled Energy, which had successfully orchestrated 2,062 pool pump
    systems for wholesale arbitrage and FCAS events, went bankrupt in 2022 alongside
    other small retailers during wholesale market turbulence, terminating the project
    before it could reach its target scale of approximately 1 million pools.
  lesson_learnt: Retail market exposure creates a systemic risk for small demand flexibility
    aggregators; the pool pump orchestration model should be pursued by larger retailers
    or specialist aggregators operating under the Wholesale Demand Response mechanism
    rather than new entrant retailers exposed to spot market volatility.
