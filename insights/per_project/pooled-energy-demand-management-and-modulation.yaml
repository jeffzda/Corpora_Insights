- record_id: ARENA-DLV-53879
  source_title: Demand Flexibility Portfolio Retrospective Analysis Report
  publish_date: 2023-07
  project_name: Pooled Energy Demand Management and Modulation
  what_happened: Under MASS (Market Ancillary Services Specification) regulations,
    FCAS installation requires a licensed electrician; Pooled Energy concluded this
    made FCAS participation unviable for pool pumps wherever installation was required,
    limiting the accessible value streams for an otherwise successfully orchestrated
    portfolio.
  lesson_warnt: FCAS eligibility requirements under MASS impose a licensed-electrician
    installation condition that renders FCAS uneconomic for low-value per-unit residential
    loads such as pool pumps; projects targeting FCAS as a value stream for residential
    devices must factor this compliance cost into their financial models before committing
    to this revenue stream.
  lesson_learnt: FCAS eligibility requirements under MASS impose a licensed-electrician
    installation condition that renders FCAS uneconomic for low-value per-unit residential
    loads such as pool pumps; projects targeting FCAS as a value stream for residential
    devices must factor this compliance cost into their financial models before committing
    to this revenue stream.
