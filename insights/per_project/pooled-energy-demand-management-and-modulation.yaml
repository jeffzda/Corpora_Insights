- record_id: ARENA-DLV-53880
  source_title: Demand Flexibility Portfolio Retrospective Analysis Report
  publish_date: 2023-07
  project_name: Pooled Energy Demand Management and Modulation
  what_happened: Pooled Energy successfully orchestrated 2,062 pool pump systems for
    856 wholesale load-shedding events (including 368 in a single month) and FCAS
    events, demonstrating that pool pumps are a practically viable demand flexibility
    resource due to customers' willingness to cede control over a discretionary background
    load.
  lesson_learnt: Pool pumps represent a practically viable residential demand flexibility
    resource because customers accept remote control without the comfort concerns
    associated with air-conditioning; larger retailers and aggregators should target
    this opportunity via the WDR mechanism, using the Pooled Energy experience as
    a proof-of-concept.
  issue_severity: none
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: no material delay stated
  failure_mode: no major failure stated
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: demand response
  source_pages: &id003
  - 30
  evidence_excerpt: Pool pumps were orchestrated for wholesale arbitrage (856 load
    shedding events when the price was >$150/MWh, including 368 events in a single
    month) and FCAS events… controlling and 'flexing' is comparatively easier compared
    to some other residential loads (e.g. air conditioners) because customers do not
    mind ceding control over their pool pumps (subject to maintenance of water quality)
    – pool pumps are a discretionary load in the background.
