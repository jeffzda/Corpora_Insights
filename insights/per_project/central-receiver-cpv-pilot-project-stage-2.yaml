- record_id: ARENA-DLV-47401
  source_title: Central Receiver CPV Pilot Project – Stage 2
  publish_date: null
  project_name: Central Receiver CPV Pilot Project – Stage 2
  what_happened: RayGen constructed and commissioned a 200kW commercial-scale CSPV pilot plant at Newbridge, Northern Victoria. Stage 2 was delivered on time and on budget, with the grid-connected power
    station becoming operational and supplying a local agriculture business.
  lesson_learnt: Commissioning data-collection infrastructure — including wireless connectivity to individual modules — alongside the main system reduces the time to generate reliable performance and reliability
    data, which is critical for de-risking follow-on scale-up stages.
