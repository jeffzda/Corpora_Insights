- record_id: ARENA-DLV-48406
  source_title: Market & Technology Analysis for Organic Photovoltaics
  publish_date: null
  project_name: New Materials and Architectures for Organic Solar Cells - beyond the
    S-Q limit
  what_happened: Indium tin oxide (ITO), the standard transparent conducting electrode
    material in OPV modules, was identified as a significant cost and performance
    constraint — its high sheet resistance limits monolithic active area size, forcing
    reliance on complex serially connected thin-strip architectures and laser scribing
    processes.
  lesson_learnt: OPV research projects should prioritise replacement of ITO with lower-cost,
    lower-sheet-resistance transparent conducting electrode alternatives — retaining
    ITO constrains module architecture, increases manufacturing complexity, and adds
    interconnection metal costs.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Replacement of ITO with lower-cost transparent conducting electrode
    alternatives was identified as one of four high-priority R&D areas in the OPV
    technology roadmap.
  transferability: narrow
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id006
  - 2
  evidence_excerpt: Reduction of the transparent conducting electrode (TCE) sheet
    resistance will allow larger monolithic active areas – this will reduce manufacturing
    complexity versus the current serially connected thin strip architectures, allow
    greater current-voltage module flexibility, reduce the amount of interconnection
    metal, and improve yield because processes such as laser scribing will not be
    required.
