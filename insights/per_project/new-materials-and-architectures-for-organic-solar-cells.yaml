- record_id: ARENA-DLV-48405
  source_title: Market & Technology Analysis for Organic Photovoltaics
  publish_date: null
  project_name: New Materials and Architectures for Organic Solar Cells - beyond the
    S-Q limit
  what_happened: Solution-processed OPV devices exhibit an exponential scaling of
    defect density with active area, causing loss of fill factor through shorting
    — a fundamental manufacturing yield problem that prevented efficient large-area
    module fabrication.
  lesson_learnt: OPV projects using solution-processing should target junction thicknesses
    of 400–500 nm using materials with higher charge carrier mobilities to reduce
    defect density at scale — thin junctions (under 200 nm) are incompatible with
    large monolithic active areas and undermine manufacturing yield.
