  publish_date: null
  project_name: New Materials and Architectures for Organic Solar Cells - beyond the
    S-Q limit
  what_happened: OPV module cost targets require achieving less than $0.50/watt by
    approximately 2018–2020; analysis found that barrier materials/encapsulants (29%),
    metal electrodes and interconnects (27%), and substrates (19%) are the dominant
    cost drivers at the module level, making the cost target a significant challenge.
  lesson_learnt: OPV research and commercialisation projects should prioritise cost
    reduction in encapsulants/barrier materials, metal electrodes/interconnects, and
    substrates — together these three components represent 75% of module-level cost
    and are the primary barrier to achieving competitive economics.
