- record_id: ARENA-DLV-39251
  source_title: Efficient Solar Hydrogen Generation Final Report
  publish_date: 2022-09
  project_name: Efficient Solar Hydrogen Generation
  what_happened: The ANU-led project successfully demonstrated a record 20% solar-to-hydrogen
    (STH) conversion efficiency at ambient conditions using all low-cost materials
    (perovskite/Si tandem cell and Ni-based catalysts), meeting the US DOE 20% STH
    target set for 2020 and advancing the technology from prior state-of-the-art of
    ~19% STH using expensive materials.
  lesson_learnt: Tandem semiconductor configurations combining perovskite (top absorber)
    and Si (bottom absorber) with earth-abundant Ni-based catalysts can achieve high
    STH efficiency targets at low material cost — future lab-scale solar hydrogen
    projects should prioritise tandem architectures with earth-abundant catalysts
    rather than noble-metal or single-semiconductor approaches to maximise both efficiency
    and commercial viability.
