- record_id: ARENA-DLV-39252
  source_title: Efficient Solar Hydrogen Generation Final Report
  publish_date: 2022-09
  project_name: Efficient Solar Hydrogen Generation
  what_happened: The integrated perovskite/Si tandem PV-electrolysis system demonstrated
    an efficiency degradation of under 7% over 100 hours of continuous operation,
    indicating reasonable but not yet commercially proven short-term stability; the
    report notes that scaling up direct solar hydrogen systems, balance of plant design,
    and pilot-scale demonstration remain unresolved challenges to commercial adoption.
  lesson_learnt: Lab-scale solar hydrogen demonstrations should explicitly include
    longer-duration stability testing and a defined pilot-scale pathway before claiming
    commercial readiness — short-duration stability data (100 h) is insufficient to
    de-risk commercial deployment, and balance-of-plant design for scale-up should
    be scoped into subsequent project phases from the outset.
