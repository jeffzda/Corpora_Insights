- record_id: ARENA-DLV-39253
  source_title: Efficient Solar Hydrogen Generation Final Report
  publish_date: 2022-09
  project_name: Efficient Solar Hydrogen Generation
  what_happened: Technoeconomic analysis conducted during the project estimated that
    a levelised cost of hydrogen (LCOH) below $3/kg is feasible for direct solar hydrogen
    systems designed at 10 tonnes H2/day over a 20-year plant lifetime, with further
    cost reductions expected as manufacturing scales and performance improves.
  lesson_learnt: Embedding technoeconomic feasibility analysis within lab-scale R&D
    projects — benchmarked against alternative hydrogen production routes — provides
    critical go/no-go signals for subsequent scale-up investment decisions; future
    solar hydrogen R&D projects should include LCOH modelling at representative commercial
    plant sizes as a deliverable to inform transition to pilot or commercial phases.
