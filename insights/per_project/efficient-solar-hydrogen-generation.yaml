  publish_date: 2021-03
  project_name: Low-Cost Perovskite/Silicon Semiconductors Integrated with Earth Abundant
    Catalysts for Efficient Solar Hydrogen Generation
  what_happened: The project faced difficulties reproducing device performances due
    to reliance on shared fabrication and synthesis equipment used by multiple research
    groups. Laboratory closedowns caused by hail damage and COVID-19 further disrupted
    equipment states and contributed to experimental non-reproducibility.
  lesson_learnt: Future research projects dependent on shared fabrication equipment
    must better estimate disruption risks upfront and develop rigorous standardisation
    criteria for individual processes to ensure reproducibility across equipment states
    and access interruptions.
