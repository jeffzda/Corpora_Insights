- record_id: ARENA-DLV-5702
  source_title: Efficient Solar Hydrogen Generation Mid-Term Activity March 2021
  publish_date: 2021-03
  project_name: Low-Cost Perovskite/Silicon Semiconductors Integrated with Earth Abundant
    Catalysts for Efficient Solar Hydrogen Generation
  what_happened: At mid-term, the project achieved greater than 16% solar-to-hydrogen
    (STH) efficiency using perovskite/Si tandem cells with low-cost Ni-based catalysts,
    exceeding the stage milestone of 13% STH. However, the ultimate target of 18%
    STH efficiency and required operational stability had not yet been achieved.
  lesson_learnt: Intermediate milestones for research projects targeting breakthrough
    efficiency levels should include stability metrics alongside efficiency thresholds
    — exceeding efficiency targets while falling short on operational stability indicates
    that durability needs to be designed in from the outset, not treated as a later
    optimisation step.
  issue_severity: minor
  project_type: enabling infrastructure
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: partial success
  secondary_failure_mode: poor scoping
  intervention_note: Team undertook investigation of degradation mechanisms for catalysts
    and solar cells, and tuned material properties to pursue stable performance as
    a next step.
  transferability: moderate
  delay_magnitude: null
  technology_domain: hydrogen
  source_pages: &id002
  - 6
  - 7
  evidence_excerpt: While further work is still needed to improve the STH efficiency
    to 18%, as well as achieve the desired operational stability, these results represent
    significant technological advances made in enabling high efficiency stand-alone
    solar water splitting systems.
  confidence_note: issue_severity rated minor because the milestone was exceeded and
    the remaining gap is a known R&D challenge rather than a project failure; failure_mode
    rated technical underperformance as the 18% STH target and stability target were
    not met at mid-term.
