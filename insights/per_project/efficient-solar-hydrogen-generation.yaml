- record_id: ARENA-DLV-39254
  source_title: Efficient Solar Hydrogen Generation Final Report
  publish_date: 2022-09
  project_name: Efficient Solar Hydrogen Generation
  what_happened: IP developed during the project was patented and led to a new research
    partnership with an industry player to advance the technology from lab scale to
    pilot scale; the project explicitly identified that no commercial-scale direct
    solar-to-hydrogen production systems exist anywhere, confirming the technology
    remains pre-commercial globally.
  lesson_learnt: R&D projects generating novel IP should build a commercialisation
    pathway — including patenting and industry partner engagement — as a planned project
    activity rather than an afterthought; securing an industry research partnership
    before project close-out accelerates the transition from lab to pilot scale and
    avoids a capability and momentum gap between funding phases.
