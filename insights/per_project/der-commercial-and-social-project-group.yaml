- record_id: ARENA-DLV-25910
  source_title: Review of ARENA's Reliability Portfolio
  publish_date: 2020-01
  project_name: DER Commercial and Social Project Group
  what_happened: Multiple distributed energy resource commercial and social projects
    — including virtual power plant trials and peer-to-peer trading platforms — were
    unable to achieve full commercialisation due to regulatory barriers around the
    rights and obligations of DER owners and distribution network service providers,
    despite technically positive results from the trials themselves.
  lesson_learnt: DER demonstration projects that achieve technically positive results
    but hit regulatory barriers should explicitly document the specific regulatory
    changes needed; ARENA funding in this area is most valuable when projects are
    structured to clarify the nature of barriers and inform rule changes, rather than
    expecting commercialisation to follow automatically from positive trial results.
