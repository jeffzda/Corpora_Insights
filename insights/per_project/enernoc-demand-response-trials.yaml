- record_id: ARENA-DLV-25918
  source_title: Review of ARENA's Reliability Portfolio
  publish_date: 2020-01
  project_name: EnerNOC Demand Response Trials
  what_happened: EnerNOC's demand response trials found that industries with high
    compliance requirements — such as water services — faced considerable difficulties
    providing demand response at certain times, limiting the breadth of sectors that
    could be recruited to participate in demand response programs.
  lesson_learnt: Demand response programs should screen prospective industrial participants
    for regulatory compliance constraints (e.g. water utilities, hospitals) that may
    prevent load shedding at critical periods; program design should build in sector-specific
    flexibility mechanisms or exclude highly constrained sectors from reliability-critical
    demand response roles.
