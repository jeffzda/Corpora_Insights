- record_id: ARENA-DLV-51464
  source_title: UTS - Flexible Demand State of Play in Australia - Report
  publish_date: 2024-05
  project_name: Origin – Electric Vehicle Smart Charging Trials
  what_happened: Fleet EV charging installation costs in Origin's trial were consistently
    higher than expected — generally over $4,000 and up to $10,000 for more complex
    sites — and identifying the right internal stakeholders within business customers
    was a consistent barrier to fleet participation.
  lesson_learnt: Fleet EV charging programs should budget installation costs well
    above residential benchmarks (allow $4,000–$10,000 per complex site) and invest
    in mapping organisational decision-makers early — failure to reach the right stakeholder
    within a business organisation was as significant a barrier as installation cost.
