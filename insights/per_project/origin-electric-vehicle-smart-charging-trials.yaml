- record_id: ARENA-DLV-51465
  source_title: UTS - Flexible Demand State of Play in Australia - Report
  publish_date: 2024-05
  project_name: Origin – Electric Vehicle Smart Charging Trials
  what_happened: Origin found that its trial participants were early adopters who
    were already shifting approximately 70% of charging outside peak periods at baseline,
    making estimated wholesale savings per charger ($46) a likely underestimate relative
    to the general population; using a convenience-charger profile increased the estimated
    value to $170 per charger.
  lesson_learnt: Early adopter trial populations systematically underestimate the
    value of demand response interventions because their baseline behaviour is already
    partially optimised; use external reference baselines (e.g. CSIRO convenience-charger
    profiles) alongside participant baselines to generate estimates applicable to
    mass-market rollout.
  issue_severity: minor
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: null
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Origin used a 'convenience-charger' load-profile from CSIRO's
    EV projections report as a proxy for a mass uptake baseline to generate a more
    representative estimate of $170 per EV charger.
  transferability: broad
  delay_magnitude: null
  technology_domain: EV
  source_pages: &id002
  - 35
  evidence_excerpt: Origin estimated the wholesale savings relative to trial participants'
    baseline was $46 per charger, but considered this an underestimate, as the participants
    were early adopters who were already managing charging more than an average customer.
    Using a 'convenience-charger' load-profile from CSIRO's EV projections report
    as a proxy for a mass uptake baseline, the wholesale and network value of controlled
    charging was estimated to be $170 per EV charger.
