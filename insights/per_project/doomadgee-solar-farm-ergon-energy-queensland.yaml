- record_id: ARENA-DLV-23928
  source_title: Australia's Off-Grid Clean Energy Market Research Paper
  publish_date: '2014-10-08'
  project_name: Doomadgee Solar Farm (Ergon Energy, Queensland)
  what_happened: 'The 264kW Doomadgee solar farm provided an important reliability benefit beyond fuel savings: during the wet season when vehicle access to the community was cut off for up to six months
    hampering diesel fuel deliveries, the solar system helped ensure reliable power supply.'
  lesson_learnt: In remote communities with seasonal access constraints (e.g. wet season road closures), renewable energy systems provide a fuel supply security benefit independent of cost savings — this
    reliability/supply-security value should be included in the business case as it may be decisive in locations with intermittent diesel supply.
