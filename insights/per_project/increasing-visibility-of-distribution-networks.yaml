  project_name: Solar Enablement Initiative (SEI)
  what_happened: Analysis of the analysis tool case study found that inverter power
    factor has a substantial impact on maximum PV hosting capacity — operating at
    0.85 leading power factor could significantly increase hosting capacity compared
    to unity power factor, but also risked under-voltage issues at low PV penetration
    levels.
  lesson_learnt: PV hosting capacity assessments should include inverter power factor
    as a variable in the analysis, not just installed capacity at unity power factor;
    tools designed to support DNSP connection assessments need to surface the power-factor
    dimension to enable network operators to specify reactive power settings that
    maximise hosting capacity without creating under-voltage risks.
