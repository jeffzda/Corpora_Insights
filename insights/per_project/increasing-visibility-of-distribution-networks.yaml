- record_id: ARENA-DLV-39957
  source_title: Solar Enablement Initiative Project Progress Report
  publish_date: 2019-12
  project_name: Solar Enablement Initiative (SEI)
  what_happened: Adding three new transformer monitors to the very long feeder significantly
    improved state estimation quality, particularly for the voltage profile before
    the recloser where a significant portion of load resides, and reduced the iterations
    required to converge from 9–14 down to 4–6.
  lesson_learnt: On long feeders with sparse measurements, installing transformer
    monitors at the beginning of the feeder (upstream of major load concentrations)
    provides disproportionate quality improvements to state estimation — prioritise
    measurement placement at feeder entry points and at sectionalisation devices rather
    than distributing devices uniformly.
