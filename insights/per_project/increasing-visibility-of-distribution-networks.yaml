  project_name: Solar Enablement Initiative (SEI)
  what_happened: The general discussion section concluded that the state estimator
    performs better with higher measurement penetration but can still produce useful
    results at low coverage when measurements are uniformly distributed, the network
    is sectionalised by flow devices, and measured loads are representative of unmeasured
    loads.
  lesson_learnt: 'When resources constrain the number of measurement devices that
    can be installed for state estimation, prioritise: (1) uniform geographic spread
    rather than clustering, (2) flow measurement devices at sectionalisation points,
    and (3) representativeness of load types — these three factors determine whether
    low-coverage deployments will yield reliable results.'
