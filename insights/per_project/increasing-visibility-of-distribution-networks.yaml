  project_name: Solar Enablement Initiative
  what_happened: Customer energy consumption data — among the most useful auxiliary
    input data — raised privacy concerns under existing regulations. While not a major
    issue at the MV level where only aggregate transformer-level values were needed,
    the team identified this as a significant barrier for future LV network state
    estimation work where individual customer data may be required.
  lesson_learnt: DNSPs should proactively develop data privacy policies covering how
    individual customer consumption data can be made available for development, testing,
    and external service provider access — projects expanding state estimation to
    LV networks or sparse rural areas will otherwise face privacy barriers that cannot
    be resolved at the project level.
