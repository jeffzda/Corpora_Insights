- record_id: ARENA-DLV-39951
  source_title: Solar Enablement Initiative Project Progress Report
  publish_date: 2019-12
  project_name: Solar Enablement Initiative (SEI)
  what_happened: The state estimator's performance was dramatically improved during
    Phase 3, with single solution iterations on the largest test feeder reduced from
    20 minutes down to approximately 400 milliseconds through parallelisation, algorithm
    substitution, Kron reduction, and caching.
  lesson_learnt: Early profiling and targeted algorithmic optimisation (parallelisation
    of Jacobian generation, replacing SVD with hardware-optimised matrix inversion,
    Kron reduction with caching) can yield order-of-magnitude performance improvements
    in power-system state estimation software — prioritise these before scaling to
    larger networks.
  issue_severity: moderate
  project_type: software/data/digital
