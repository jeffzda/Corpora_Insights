- record_id: ARENA-DLV-39955
  source_title: Solar Enablement Initiative Project Progress Report
  publish_date: 2019-12
  project_name: Solar Enablement Initiative (SEI)
  what_happened: Aggregated smart meter P and Q values from United Energy could not
    be split by phase, requiring the three-phase total to be divided equally across
    the three phases — an assumption that introduces error where load is unbalanced
    across phases.
  lesson_learnt: When procuring or requesting measurement data from DNSPs for state
    estimation, specify that P and Q values must be provided as per-phase quantities;
    aggregated three-phase totals force an equal-split assumption that degrades estimation
    accuracy on unbalanced networks.
  issue_severity: minor
