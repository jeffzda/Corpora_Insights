  what_happened: The analysis tool case study noted that thermal ratings of MV/LV
    transformers and distribution feeder conductors — not only voltage constraints
    — would restrict maximum PV hosting capacity, and that concentrating maximum PV
    at a single node would likely preclude further PV connections on the feeder.
  lesson_learnt: PV hosting capacity tools that assess only voltage constraints will
    overstate available capacity; thermal ratings of transformers and conductors must
    be incorporated as binding constraints, and assessments should account for the
    network-wide impact of concentrated PV connections rather than evaluating each
    connection in isolation.
