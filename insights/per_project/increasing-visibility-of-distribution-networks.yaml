  secondary_failure_mode: null
  intervention_note: Applied parallelisation of Jacobian generation, replaced singular
    value decomposition with Intel MKL-optimised matrix inversion, implemented Kron
    reduction with network caching, and enabled parallel processing of time steps
    via a scheduler.
  transferability: moderate
  delay_magnitude: null
