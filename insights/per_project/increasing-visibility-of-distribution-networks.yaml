  source_title: Solar Enablement Initiative Final Report
  publish_date: 2019-12
  project_name: Solar Enablement Initiative (SEI)
  what_happened: Running one year of state estimation consumed over 20 hours of computation
    time, and the subsequent clustering step required more than one additional day
    of processing time before PV analysis could commence, creating a significant practical
    barrier to routine use of the full-year dataset approach.
  lesson_learnt: Full-year state estimation followed by clustering is computationally
    intensive and unsuitable for routine connection assessment without high-performance
    computing infrastructure; projects deploying this approach should plan for multi-node
    computation environments or adopt the clustered critical-cases workflow from the
    outset.
