  source_title: Solar Enablement Initiative Final Report
  publish_date: 2019-12
  project_name: Solar Enablement Initiative (SEI)
  what_happened: Without the SEI state estimator, DNSPs were assessing embedded generation
    (including PV) connections using a generic assumed-type approach due to lack of
    network visibility, resulting in conservative export limits such as zero-export
    conditions being imposed on customers who may have had available capacity.
  lesson_learnt: Generic, conservative PV connection assessment methods impose unnecessary
    zero-export limits on customers; DNSPs with access to state estimation tools can
    identify real available capacity and unlock additional PV connections, improving
    both customer outcomes and network utilisation.
