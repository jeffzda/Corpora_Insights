  source_title: Solar Enablement Initiative Project Progress Report
  publish_date: 2019-12
  project_name: Solar Enablement Initiative (SEI)
  what_happened: The most critical performance bottleneck remaining at the end of
    Phase 3 was identified as writing results from large estimation runs back to the
    database, with a plan to procure a new database server optimised for high read/write
    operations.
  lesson_learnt: When deploying real-time state estimation at scale, database write
    performance — not computation — can become the binding constraint; size and specify
    the database infrastructure for high-frequency read/write throughput before scaling
    up estimation runs.
