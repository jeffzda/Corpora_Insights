  what_happened: The real-time capacity constrained optimisation trial demonstrated
    that available network capacity could be automatically re-assessed every one minute
    and allocated dynamically to PV customers previously subject to zero-export limits,
    operating in a fully automated closed-loop fashion for the first stage using transformer
    monitor data.
  lesson_learnt: Real-time state estimation combined with optimised constraint analysis
    can enable dynamic, minute-by-minute PV export limit management that replaces
    static zero-export limits — this approach is technically proven at demonstration
    scale and represents a viable pathway to unlocking stranded network capacity for
    existing constrained customers.
