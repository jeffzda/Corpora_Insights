    model improvement was identified as a future activity.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id008
  - 45
  evidence_excerpt: This increased residuals (as compared to the results on the Energex
    feeders) is likely introduced by the unknown voltage drop between the LV of the
