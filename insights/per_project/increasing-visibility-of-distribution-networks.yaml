  source_title: Solar Enablement Initiative Final Report
  publish_date: 2019-12
  project_name: Solar Enablement Initiative (SEI)
  what_happened: The PV Analysis Tool in its delivered form does not scale PV power
    output based on cloud cover or other variable renewable energy factors — it assesses
    the same export value for all scenarios — limiting the accuracy of assessments
    for variable generation profiles.
  lesson_learnt: Future versions of distribution-level PV connection assessment tools
    should incorporate variable generation scaling (e.g. cloud cover, irradiance profiles)
    to avoid overstating available export capacity in critical scenarios; projects
    should scope this functionality explicitly rather than leaving it for post-project
    development.
