  source_title: Solar Enablement Initiative Project Progress Report
  publish_date: 2019-12
  project_name: Solar Enablement Initiative (SEI)
  what_happened: The closed-delta voltage regulator model produced results diverging
    from SINCAL benchmarks under heavy load conditions and at or near maximum tap
    positions, with testing still ongoing at the end of Phase 3.
  lesson_learnt: Network element models should be validated across the full operating
    envelope — including extremes of tap position and load — before deployment; regulator
    models that perform well at normal conditions may fail at the operating extremes
    that matter most for hosting capacity assessment.
