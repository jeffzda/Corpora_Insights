  project_name: Solar Enablement Initiative (SEI)
  what_happened: 'A conservative approach to managing uncertainty in the clustered
    critical-cases method was identified: applying an 80% de-rating to the maximum
    PV capacity result provides a margin more than twice the observed maximum error
    of less than 3%, offering a practical risk management method for DNSPs using the
    tool.'
