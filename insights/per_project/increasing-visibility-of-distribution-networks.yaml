- record_id: ARENA-DLV-39958
  source_title: Solar Enablement Initiative Project Progress Report
  publish_date: 2019-12
  project_name: Solar Enablement Initiative (SEI)
  what_happened: On the high-measurement-penetration LV customer meter feeder, the
    state estimator produced larger voltage residuals (up to ±2 V) than on distribution-transformer-monitored
    feeders, attributable to unknown voltage drop between the LV transformer terminals
    and customer connection points where measurements were taken.
  lesson_learnt: When using customer smart meter voltages as state estimation inputs,
    the impedance between the distribution transformer LV terminal and the customer
    metering point must be modelled; ignoring this voltage drop introduces a systematic
    residual bias that degrades estimation quality and should be included in the LV
    network model.
  issue_severity: minor
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: operations
