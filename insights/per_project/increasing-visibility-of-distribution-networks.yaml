- record_id: ARENA-DLV-39954
  source_title: Solar Enablement Initiative Project Progress Report
  publish_date: 2019-12
  project_name: Solar Enablement Initiative (SEI)
  what_happened: Smart meter data from United Energy used a half-hourly sampling period
    for P and Q values while voltage measurements were on a 5-minute cycle and recloser
    measurements were also on a shorter interval, requiring all non-smart-meter inputs
    to be averaged to 30-minute values and reducing the temporal resolution of state
    estimates.
  lesson_learnt: Mismatched measurement sampling periods across devices on the same
    network degrade state estimation quality by forcing down-sampling to the coarsest
    interval; when specifying measurement infrastructure for state estimation, align
    all devices to the same sampling period — 5 or 10 minutes appears sufficiently
    granular, but 30-minute periods are too coarse.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: research organisation/university
  delay_category: data/validation/testing
  failure_mode: data & measurement
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Other measurements were averaged over each half-hour period to
    align with the smart meter P and Q sampling period, producing a 'half hour average
    state' estimate as a workaround.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id004
  - 14
  - 15
  evidence_excerpt: The difference of sampling period between aggregated P and Q values
    and the other measurements in the network requires that the other measurements
    in the network are converted to half hour values. This is achieved by averaging
    each of the measured values over the half hour period.
