  source_title: Solar Enablement Initiative Final Report
  publish_date: 2019-12
  project_name: Solar Enablement Initiative (SEI)
  what_happened: Voltage rise at the LV terminal of the distribution transformer was
    identified as the most frequent binding constraint limiting PV maximum capacity
    across the ten real case PV assessments conducted, with limited network remediation
    options available other than dynamic reactive power capability or export limiting
    schemes.
  lesson_learnt: Voltage rise on distribution transformer LV terminals is the dominant
    technical constraint for MV-connected PV in Australian distribution networks;
    project developers and DNSPs should assess dynamic reactive power capability or
    export limiting as preferred mitigation options rather than relying on costly
    network upgrades.
