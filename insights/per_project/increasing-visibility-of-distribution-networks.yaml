  what_happened: Although the state estimation algorithm could handle incomplete measurement
    data, auxiliary data such as load statistics and mutable network parameters (transformer
    tap positions, switching state) were not systematically stored or accessible,
    requiring manual location and validation throughout the entire project.
  lesson_learnt: DNSPs should systematically store and associate mutable network parameters
    (e.g. transformer tap positions, switching states) with their network models —
    future projects relying on this data will otherwise face persistent manual data-retrieval
