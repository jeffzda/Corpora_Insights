- record_id: ARENA-DLV-50155
  source_title: Solar Enablement Initiative Final Report
  publish_date: 2019-12
  project_name: Solar Enablement Initiative (SEI)
  what_happened: The clustering analysis technique, developed by QUT and integrated
    into the SEI tool, reduced the number of network states requiring PV power flow
    analysis from ~52,560 annual time steps to approximately 20 critical cases, achieving
    computation time reductions of 99.7–99.97% across four tested feeders with less
    than 3% difference in maximum PV capacity results.
  lesson_learnt: State-clustering pre-processing is a highly effective technique for
    making distribution-level PV connection assessments computationally tractable
    — adopting it reduces analysis run-time by orders of magnitude with negligible
    accuracy penalty, enabling routine use in DNSP business-as-usual processes.
