  project_name: Solar Enablement Initiative (SEI)
  what_happened: On the very long feeder test case, two-phase measurement functionality
    had not yet been developed, meaning two-phase transformer monitor readings could
    not be used as estimator inputs; the voltage regulator was also bypassed at the
    time new measurements became available, removing it as a usable input.
  lesson_learnt: Software capability gaps that prevent ingestion of specific measurement
    types should be identified and resolved before new measurement infrastructure
    is deployed; otherwise newly installed monitoring devices cannot contribute to
    the estimation and their value is deferred.
