  what_happened: Histogram analysis of LV voltage residuals revealed that three distribution
    transformers had incorrectly recorded tap positions in the estimator input dataset;
    one transformer also had an incorrect nominal secondary voltage (415 V instead
    of 433 V) recorded in the asset register.
  lesson_learnt: Poor asset data quality — specifically incorrect transformer tap
    positions and nominal secondary voltages — directly degrades state estimation
    accuracy; DNSPs should establish quality asset records for transformers including
    actual tap position and rated secondary voltage before deploying state estimation,
    and can use the estimator's residual diagnostics to identify and correct errors.
