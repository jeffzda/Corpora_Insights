  project_name: Solar Enablement Initiative
  what_happened: DNSP cyber security strategies created separate IT security zones
    that prevented all required data sources from being accessed from the same client,
    leading to additional manual work and increased risk of data inconsistencies during
    the project.
  lesson_learnt: When working with DNSP data across cyber security zones, establish
    data mirroring schemes that allow read-only access across zones while isolating
    primary data sources — this avoids manual workarounds and reduces inconsistency
    risk in future integration projects.
