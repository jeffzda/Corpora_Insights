  source_title: Solar Enablement Initiative Project Progress Report
  publish_date: 2019-12
  project_name: Solar Enablement Initiative (SEI)
  what_happened: Incorrect measurement phasing was identified on three transformer
    units on a feeder, with their voltage residual variance significantly elevated
    under the 'no rotation' phase mapping; correcting these three units reduced residuals
    not only for the affected units but also for other measurements across the network.
  lesson_learnt: Incorrect phase mapping of measurement devices can propagate errors
    across an entire network's state estimation, not just at the misphased device;
    DNSPs should establish and maintain accurate measurement phasing records, and
    state estimation residual variance diagnostics should be used systematically during
    commissioning to detect and correct phasing errors.
