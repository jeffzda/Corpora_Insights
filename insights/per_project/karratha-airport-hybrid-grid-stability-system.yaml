- record_id: ARENA-DLV-14667
  source_title: 'Lessons From the Fringes: Australian Fringe-Of-Grid Projects in ARENA''s Portfolio'
  publish_date: 2018-06
  project_name: Karratha Airport Hybrid Grid Stability System
  what_happened: The Karratha Airport project successfully demonstrated that Cloud Prediction Technology (CPT) can reduce the required BESS size by predicting solar output variability in advance, allowing
    the ramp rate constraint on the NWIS connection to be met with a smaller battery.
  lesson_learnt: Cloud Prediction Technology is a viable approach to reducing BESS capacity requirements at solar-plus-storage projects with strict ramp rate constraints — projects facing similar grid codes
    should evaluate CPT as a cost-reduction measure before sizing storage to worst-case ramp scenarios.
