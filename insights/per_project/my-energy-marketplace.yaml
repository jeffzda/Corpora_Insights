  what_happened: The MEM project's analysis of 251 residential sites found no clear
    trend towards either increased or decreased energy consumption in month 13 compared
    to month 1 after installation of energy monitoring, leaving the 'efficiency paradox'
    (Jevons paradox) question unresolved. The dataset lacked the contextual metadata
    needed to attribute changes to specific interventions.
  lesson_learnt: Energy monitoring datasets alone are insufficient to investigate
    behavioural outcomes such as the efficiency paradox; future programs should collect
    contextual metadata (household size, appliance changes, electrification steps,
    demographics) alongside energy data from the outset to enable causal analysis.
