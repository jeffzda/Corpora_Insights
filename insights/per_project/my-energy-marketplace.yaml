  source_title: My Energy Marketplace Lessons Learnt 5
  publish_date: 2022-11
  project_name: My Energy Marketplace
  what_happened: A marketplace offer launched via the MyEnergy app and email campaign
    achieved a 15% uptake rate — well above industry average — but follow-up emails
    did not produce significantly more signups, indicating 15% represented the saturation
    level of the current audience. Communication to participants via rollout partners
    was also delayed while marketing processes were established.
  lesson_learnt: Email campaign saturation is reached quickly with a highly engaged
    but small audience — plan for a ceiling on initial uptake rates and develop communication
    pathways through rollout partners in parallel with direct campaigns rather than
    sequentially, to avoid delays in reaching the broader participant base.
