  what_happened: Weather events (floods and storms in NSW, Queensland and Victoria),
    global supply chain disruption causing delays and price increases for solar panels
    and inverters, and personnel shortages combined to prevent rollout partners from
    ramping installations to planned levels, putting pressure on meeting the original
    5,000-device deployment target in the project's closing stages.
