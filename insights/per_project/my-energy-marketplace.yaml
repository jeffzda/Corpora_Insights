  project_name: My Energy Marketplace
  what_happened: Workshop participants and the MEM project team identified that personally-identifying
    metadata (names, addresses) is legally distinct from energy usage data but is
    operationally inseparable from it — and that this distinction must be explicitly
    addressed in privacy frameworks, T&Cs, and data governance design.
  lesson_learnt: Consumer energy data projects must explicitly design their privacy
    and data governance frameworks to handle the intersection of usage data and personally-identifying
    metadata — treating these as separable is legally and operationally incorrect,
    and failing to address this distinction in T&Cs and data architecture will create
    compliance risk and undermine consumer trust.
