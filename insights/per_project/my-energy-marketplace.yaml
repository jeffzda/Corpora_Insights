  project_name: My Energy Marketplace
  what_happened: Analysis of 488 residential sites over one year showed that standard
    annual average carbon emissions accounting underestimated emissions by up to 20%
    for some sites and overestimated by up to 80% for others, with the largest errors
    observed in South Australia — the NEM state with the highest share of renewable
    generation.
  lesson_learnt: Carbon accounting for behind-the-meter and DER projects should use
    time-varying, high-resolution emissions intensity data rather than annual state
    averages — estimation errors from annual averages are material (up to 80%) and
    will grow as renewable penetration increases across all NEM states, making this
    increasingly important for accurate project impact reporting.
