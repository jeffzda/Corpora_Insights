- record_id: ARENA-DLV-45102
  source_title: My Energy Marketplace Lessons Learnt 2
  publish_date: 2020-12
  project_name: My Energy Marketplace (MEM)
  what_happened: The project's initial objective of maximising consumer 'ownership'
    of energy data proved legally untenable — copyright law treats the entity generating
    the data (Wattwatchers) as the owner, not the consumer whose assets produce the
    data, requiring a revision of the project's data rights framing.
  lesson_learnt: Do not assume that consumers legally 'own' data generated by devices
    on their premises — under Australian copyright law the data generator (typically
    the platform or device provider) holds ownership; design data rights frameworks
    around consumer 'control' rather than 'ownership' to avoid misleading consumers
    and requiring costly rework of T&Cs and governance documents.
  issue_severity: moderate
