- record_id: ARENA-DLV-42011
  source_title: My Energy Marketplace Lessons Learnt 3
  publish_date: 2021-06
  project_name: My Energy Marketplace (MEM)
  what_happened: Retrofitting Wattwatchers monitoring devices at existing residential
    and small business sites proved significantly more costly than anticipated because
    electrician call-out costs are high relative to device value, and approximately
    half of retrofit sites lacked sufficient switchboard space — requiring an additional
    surface-mount enclosure and increasing total installation cost.
  lesson_learnt: Plan retrofit installations with a contingency for switchboard space
    constraints — roughly half of retrofit sites may require additional enclosures,
    materially increasing per-site cost; co-installation with solar or other major
    electrical upgrades, or new-build integration, substantially reduces cost and
    should be prioritised as the channel strategy.
