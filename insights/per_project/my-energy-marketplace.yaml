  what_happened: A review of 154 feedback trials found that the impact of consumer
    feedback on electricity consumption increases with the number of feedback types
    and channels provided, up to six, and that in-home displays increased customer
    engagement with electricity data compared to online portals.
  lesson_learnt: Design energy data services to use multiple feedback types and channels
    (up to six) and prioritise in-home displays over online-only portals — multi-channel
    approaches with physical in-home devices consistently outperform single-channel
    digital-only delivery.
