  what_happened: The MEM project demonstrated that consumers are willing to share
    anonymised energy data in exchange for zero-cost or discounted hardware and data
    subscriptions. End-user engagement with the MyEnergy app remained sustained over
    the project period, and 15% of users responded to a UNSW in-app survey offer for
    a $50 voucher — well above the typical 2–3% click-rate for general marketing campaigns.
