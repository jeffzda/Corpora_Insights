  what_happened: Consumer trust emerged as an immediate and significant barrier in
    early user testing — even in a small test group of approximately 10 users, concerns
    about spam, data misuse and distrust of comparison/switching services appeared
    as soon as tariff comparison and retailer switching features were demonstrated.
  lesson_learnt: Anticipate a pre-existing trust deficit in consumer energy data applications
    — poor practices by incumbent comparison and switching services have 'polluted
    the field' and users will project those concerns onto new platforms, requiring
    explicit trust-building measures (brand transparency, data minimisation, clear
    T&Cs) before tariff comparison or switching features are introduced.
