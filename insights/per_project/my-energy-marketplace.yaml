- record_id: ARENA-DLV-59154
  source_title: Wattwatchers - My Energy Marketplace - Final Knowledge Sharing Report
  publish_date: 2023-09
  project_name: My Energy Marketplace (MEM)
  what_happened: Installing smart energy monitoring devices as retrofits proved costly
    and operationally difficult, with costs often exceeding consumer willingness to
    pay, particularly when switchboard upgrades were required or atypical site configurations
    were encountered.
  lesson_learnt: Co-ordinate smart monitoring device installation alongside other
    major energy upgrades (especially rooftop solar) to reduce incremental installation
    cost and improve uptake; avoid standalone retrofit visits where possible, as the
    cost burden is a significant adoption barrier.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: construction/installation
  proponent_type: technology vendor
  delay_category: construction/installation
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: execution & logistics
  intervention_note: Shifted to solar-installer channel partners who already had electricians
    on site, making device installation an incremental cost add-on rather than a standalone
    visit.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: DER
  source_pages: &id099
  - 45
  - 47
  evidence_excerpt: The known cost burden and other difficulties of retro-fitting
    smart energy management solutions were further validated and, in keeping with
    this, the practical advantages of installing alongside other major energy upgrades,
    especially rooftop solar, have been further amplified. Directly-managed installers
    have been most effective for retrofit jobs, while indirectly-managed installation
    processes proved better for leveraging other energy upgrades where electricians
    are already onsite.
