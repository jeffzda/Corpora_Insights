  project_name: My Energy Marketplace (MEM)
  what_happened: The MEM project's near-real-time, circuit-level energy dataset from
    5,100+ sites filled a significant gap in the Australian energy data landscape,
    with the previously dominant Smart Grid Smart City dataset now nearly 10 years
    old, containing only net import/export data at 30-minute intervals, and not including
    solar generation or circuit-level loads.
  lesson_learnt: Legacy datasets rapidly become unfit for purpose as the energy system
    evolves; new programs deploying monitoring infrastructure should capture circuit-level,
    near-real-time data (not just net consumption) to ensure the dataset remains useful
    for DER integration, electrification modelling, and grid management for at least
    a decade.
