  project_name: My Energy Marketplace
  what_happened: Wattwatchers identified that the dominant vertical business model
    in the emerging energy data sector — where device, cloud, and user interface layers
    are bundled in a single proprietary stack — exacerbates consumer distrust and
    creates 'technology lock-in' and 'data walled gardens', constraining consumer
    data portability.
  lesson_learnt: Consumer energy data platforms should adopt an open, layered architecture
    that separates device, data, and application layers — proprietary vertical integration
    in this sector actively undermines consumer trust and creates lock-in that limits
    adoption; projects aiming at broad consumer uptake should make data portability
    and open APIs explicit design requirements.
