- record_id: ARENA-DLV-59162
  source_title: Wattwatchers - My Energy Marketplace - Final Knowledge Sharing Report
  publish_date: 2023-09
  project_name: My Energy Marketplace (MEM)
  what_happened: The project's initial conceptual position — that energy users 'own'
    their energy data — turned out to be inconsistent with legal norms; legal advice
    confirmed that the entity generating the data (i.e. Wattwatchers) is generally
    the legal owner, not the consumer, as reflected in GDPR and international data
    frameworks.
  lesson_learnt: Projects designing consumer data platforms should obtain legal advice
    on data ownership before finalising their governance framework and consumer-facing
    terms; framing 'consumer ownership' as effective control and opt-in/opt-out rights,
    rather than strict legal ownership, is more legally accurate and operationally
    defensible.
  issue_severity: minor
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: null
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Wattwatchers reframed the MEM model as an opt-in platform where
    users can revoke data sharing rights at any time, approximating the intent of
    'consumer control' within legal constraints.
  transferability: moderate
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id107
  - 55
  evidence_excerpt: A key learning, quite early in the project, was that our conceptual
    'starting position'—that energy users own their energy data—is actually at odds
    with legal norms. Through our work and legal advice received, we now understand
    that the entity that generates the data is generally considered the 'owner' from
    a legal standpoint.
