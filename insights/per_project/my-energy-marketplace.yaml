  project_name: My Energy Marketplace
  what_happened: During the design phase of a standalone marketplace app for rollout
    partners, it became apparent the app would not be a compelling enough proposition
    for end customers as a standalone product. This led to a strategic repositioning
    of the MyEnergy app away from a standalone marketplace toward an insights-led
    'companion app' model with a 'Flow' feed of insights, tips, and marketplace offers.
  lesson_learnt: A standalone energy marketplace app is unlikely to sustain user engagement
    on its own — reframe the app around actionable insights and position marketplace
    offers within an insight feed rather than as the primary value proposition, reducing
    the risk of low engagement caused by sparse marketplace content and ensuring the
    app remains valuable between offer events.
