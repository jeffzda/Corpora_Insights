  what_happened: Community group channel partners — often volunteer-run — were slow
    to activate, citing limited capacity to make decisions quickly, scepticism from
    prior bad experiences with similar initiatives, and vendor lock-in concerns about
    a single-vendor offer; this slowed participant recruitment below plan during the
    early MEM period.
