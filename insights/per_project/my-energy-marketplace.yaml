  source_title: My Energy Marketplace Lessons Learnt 2
  publish_date: 2020-12
  project_name: My Energy Marketplace (MEM)
  what_happened: Consumer data rights and privacy concerns acted as blockers to data
    acquisition and sharing, while simultaneously consumers wanted data-enabled services
    — creating tension between privacy/security and data access/shareability that
    had to be navigated through plain-language Terms and Conditions.
  lesson_learnt: When building consumer-facing data platforms, treat privacy concerns
    as a structural design constraint from the outset — develop plain-language T&Cs
    and clear data governance frameworks early, as ambiguity around data rights is
    a direct barrier to consumer participation.
