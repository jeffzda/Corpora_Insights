  source_title: My Energy Marketplace Lessons Learnt 3
  publish_date: 2021-06
  project_name: My Energy Marketplace (MEM)
  what_happened: The in-app retail tariff comparison feature generated user interest
    (494 views of the overview screen) but very low conversion — only 3 switching
    requests completed within the app, representing less than 1% of users who reached
    the overview screen.
  lesson_learnt: A panel-based tariff comparison feature limited to participating
    retailers (rather than whole-of-market) generates user scepticism and low conversion;
    projects planning such features should anticipate that users will conduct additional
    research outside the app and that the panel model may deter channel partners with
    existing retail arrangements.
