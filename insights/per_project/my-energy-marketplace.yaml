  project_name: My Energy Marketplace (MEM)
  what_happened: Balancing consumer data security and privacy on one hand against
    access, portability and shareability on the other emerged as a defining and unresolved
    challenge for the MEM, compounded by customers' distrust shaped by experiences
    in financial services and telecommunications.
  lesson_learnt: Consumer energy data platforms must explicitly design for the privacy-versus-shareability
    tension from day one — sector-specific trust deficits (shaped by experiences in
    finance and telco) will manifest early in user testing and require dedicated governance
    mechanisms such as a Data Advisory Panel and plain-language, user-controlled T&Cs.
