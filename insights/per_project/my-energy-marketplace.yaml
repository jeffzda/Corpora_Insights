  what_happened: Early participant recruitment efforts focused on individual consumer
    sales and community-based groups, which proved insufficient to meet rollout targets
    at scale. Offers that provided detailed information about ARENA subsidies and
    data use-cases confused potential participants and diluted the value proposition.
  lesson_learnt: Prioritise channel partners capable of scale deployment from the
    outset of a large device rollout; simplify the customer offer to a clear discount
    rather than explaining the underlying funding and data-sharing program, which
    tends to confuse rather than motivate.
