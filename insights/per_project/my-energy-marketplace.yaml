  source_title: My Energy Marketplace Lessons Learnt 3
  publish_date: 2021-06
  project_name: My Energy Marketplace (MEM)
  what_happened: Community housing occupants proved particularly sensitive to data
    privacy and sharing, citing poor past experiences and a sense of being 'over-researched',
    creating barriers to recruitment into the MEM; community housing service providers
    also raised concerns about the potential for the app Marketplace to present financially
    inappropriate offers to vulnerable users.
  lesson_learnt: When deploying consumer energy data platforms to socially vulnerable
    groups (e.g. community housing), address data privacy concerns explicitly in recruitment
    materials and build Marketplace controls that restrict offer visibility for users
    identified as financially at-risk — a one-size-fits-all approach to data sharing
    will not work across diverse user segments.
