  what_happened: The project identified limited capability — outside of legal controls
    — to prevent data recipients from using shared data for non-intended or non-approved
    purposes, representing a residual governance risk as the MEM data pool grew.
  lesson_learnt: Legal T&Cs alone are insufficient to prevent data misuse by recipients
    — supplement contractual controls with technical measures for data protection
    in sharing scenarios (e.g. access controls, audit logging, OAuth-style authorisation)
    and develop strong T&Cs for data recipients before expanding the data sharing
    programme.
