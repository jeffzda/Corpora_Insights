  what_happened: Tariff switching features in the MyEnergy app were implemented primarily
    to encourage bill uploads but saw low utilisation, driven by consumer distrust
    of comparison services, inertia, limited retail supplier choice, and non-financial
    preferences — findings consistent with Data Advisory Panel warnings given earlier
    in the project.
  lesson_learnt: Do not rely on tariff-switching features as a primary engagement
    or data-collection driver — consumer distrust of comparison services and switching
    inertia are structural barriers; design bill-upload incentives that are decoupled
    from switching prompts to avoid the negative associations of comparison-site tactics.
