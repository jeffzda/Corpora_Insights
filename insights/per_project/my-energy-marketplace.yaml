  project_name: My Energy Marketplace (MEM)
  what_happened: Research institutions and government agencies that requested access
    to MEM datasets frequently had insufficient budget allocated for data acquisition,
    even though the cost per device from the MEM was far lower ($250–$1,000) than
    the cost to deploy new monitoring devices ($1,500–$2,000 per device plus a 1–2
    year lead time).
  lesson_learnt: Research projects must allocate an explicit and adequate budget line
    for data acquisition at the planning stage; the cost and 1–2 year lead time for
    deploying new devices is often overlooked, making existing platforms like the
    MEM strongly preferable on both cost and time grounds.
