  source_title: My Energy Marketplace Lessons Learnt 5
  publish_date: 2022-11
  project_name: My Energy Marketplace
  what_happened: Achieving a self-sustaining data services business model required
    using ARENA grant funding as a proxy for customer payments throughout the project.
    After reaching over 2,850 devices deployed, Wattwatchers identified that additional
    data services customers needed to be secured within 6–12 months to validate commercial
    viability without subsidy support.
  lesson_learnt: When designing a data marketplace, plan early for the transition
    from grant-subsidised to commercially funded participation — validate price points
    with real customers before grant funding expires, and build a pipeline of paying
    data services customers in parallel with device deployment rather than after scale
    is achieved.
