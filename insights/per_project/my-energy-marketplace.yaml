  source_title: My Energy Marketplace Lessons Learnt 4
  publish_date: '2021-11-19'
  project_name: My Energy Marketplace (MEM)
  what_happened: Consumer user research revealed that the value of the energy data
    service was often only apparent to participants after they received a device and
    accessed their real-time data, making it difficult to communicate the value proposition
    pre-purchase and limiting recruitment conversion.
  lesson_earnt: Design pre-purchase communications around experiential proof points
    (e.g. sample data views, peer testimonials) rather than abstract feature descriptions
    — when consumers cannot relate to the value of energy data without prior experience,
    the conversion funnel from awareness to purchase will be structurally weak.
  lesson_learnt: Design pre-purchase communications around experiential proof points
    rather than abstract feature descriptions — when consumers cannot relate to the
    value of energy data without prior experience, conversion from awareness to purchase
    will be structurally weak and standard marketing collateral will be insufficient.
