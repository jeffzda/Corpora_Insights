  source_title: My Energy Marketplace Lessons Learnt 5
  publish_date: 2022-11
  project_name: My Energy Marketplace
  what_happened: Wattwatchers identified that the cost of becoming accredited under
    the Consumer Data Right (CDR) for Energy as a data holder or data recipient is
    potentially $250,000 to $2 million, making full CDR participation financially
    prohibitive for smaller companies and startups seeking to participate in Australia's
    emerging energy data ecosystem.
  lesson_learnt: Smaller energy data businesses and DER platform operators should
    assess CDR accreditation costs ($250k–$2M) before committing to a CDR-based delivery
    model — investigate derived data pathways through accredited participants as a
    lower-cost entry point, and factor regulatory compliance costs into business model
    and funding assumptions from the outset.
