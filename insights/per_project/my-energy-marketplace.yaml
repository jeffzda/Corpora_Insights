  source_title: My Energy Marketplace Lessons Learnt 3
  publish_date: 2021-06
  project_name: My Energy Marketplace (MEM)
  what_happened: By the project mid-point, commercial, government and research organisations
    were requesting access to MEM data, but the dataset was insufficient to respond
    — requests typically required at least 12 months of data from more than 1,000
    sites, whereas MEM was still scaling toward those numbers.
  lesson_learnt: When designing a data-platform project, specify minimum dataset thresholds
    (site count and data duration) required to meet anticipated commercial and government
    data requests at the outset — if deployment targets are back-loaded, external
    data demand may materialise before the dataset is large enough to satisfy it,
    creating a credibility gap with prospective data users.
