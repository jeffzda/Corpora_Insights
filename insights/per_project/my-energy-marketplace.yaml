  publish_date: '2021'
  project_name: My Energy Marketplace (MEM)
  what_happened: De-identified data access for small cohort partners (e.g. community
    groups who co-contributed to installation costs) posed a re-identification risk
    due to small device numbers, and the project had no scalable technical mechanism
    to manage this — the planned Marketplace API was not yet available.
  lesson_learnt: Design re-identification risk thresholds into data governance frameworks
    before accepting community or small-cohort installation partners — when participant
    numbers are low, even de-identified data carries re-identification risk, and manual
    legal arrangements between partner and end customer are not scalable for a platform
    model.
