  what_happened: Schools that installed solar systems without a supporting data and
    education program showed a year-on-year increase in grid consumption of 8–10%
    after solar installation, essentially negating the financial and environmental
    benefit of the solar investment within 3–4 years. Schools that actively participated
    in the Solar Schools education program reduced energy consumption by an average
    of 24% and demonstrated sustained reductions in baseload.
  lesson_learnt: Installing solar at schools without a behaviour change and education
    program is likely to result in net increased grid consumption due to the 'free
    energy' effect; energy monitoring should always be paired with structured education
    and engagement programs to realise the intended benefits.
