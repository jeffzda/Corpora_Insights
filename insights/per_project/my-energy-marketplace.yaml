  project_name: Wattwatchers My Energy Marketplace (MEM)
  what_happened: Smart meter trials found that consumers underestimate electricity
    use of high-consumption appliances and that standard smart meter feedback does
    not provide enough appliance-level detail; a German study showed that adding appliance-level
    feedback delivered a further 5% energy saving beyond what standard smart meter
    feedback achieved.
