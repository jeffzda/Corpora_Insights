  what_happened: Consumer interest in energy monitoring apps and in-home displays
    has been shown by over a decade of Australian and international studies to plateau
    or evaporate after a brief period of engagement, or once a specific problem is
    solved — a finding that directly shaped the MEM's platform design approach.
  lesson_learnt: Consumer energy data projects should design for sustained engagement
    from the outset — a single-purpose app will lose user attention after the initial
    novelty period; a platform model offering multiple apps targeting different motivations
    (financial savings, sustainability, gamification) is more likely to maintain long-term
    consumer participation.
