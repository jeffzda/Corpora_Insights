- record_id: ARENA-DLV-33852
  source_title: 'My Energy Marketplace Lessons Learnt #1'
  publish_date: 2020-04
  project_name: My Energy Marketplace
  what_happened: During T&C drafting in the project's establishment phase, Wattwatchers
    discovered that consumer 'ownership' of energy data is legally complex — an escalating
    series of competing rights to the same data are created at each stage of capture,
    transmission, aggregation, and value-adding, making simple ownership claims unworkable.
  lesson_learnt: Consumer energy data platform projects should not assume that standard
    'data ownership' language in T&Cs is sufficient — engage specialist legal advice
    early to map the full chain of data rights that arise at each processing stage
    before finalising participant agreements, as retrofitting this after design is
    costly.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: approvals/regulatory
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: regulatory & approvals
  intervention_note: Project engaged an expert legal adviser and a Consumer Energy
    Data Advisory Panel (CEDAP) to work through the layered rights framework and revise
    the T&C drafting approach.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: DER
  source_pages: &id058
  - 28
  evidence_excerpt: We've learned very clearly through the initial drafting of the
    MEM T&Cs that 'ownership' of energy data is not as straightforward as it at first
    may seem. An escalating series of rights to energy data and claims on its 'ownership'
    are created as it is captured, transmitted to the cloud, analysed, aggregated,
    integrated with other datasets, value-added, shared and deployed for use by consumers
    themselves, direct service providers and additional authorised third parties.
