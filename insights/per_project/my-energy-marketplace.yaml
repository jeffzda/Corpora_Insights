  project_name: My Energy Marketplace (MEM)
  what_happened: Community-based recruitment groups that were moderately resourced
    and could leverage additional funding performed well as MEM channel partners,
    while smaller or more resource-constrained community groups struggled to sustain
    engagement. This led the MEM team to conclude that fewer, deeper relationships
    with well-resourced community groups outperform broad shallow engagement strategies.
  lesson_learnt: For community-facing device rollout programs, prioritise a small
    number of well-resourced community partner organisations capable of sustained
    engagement over broad shallow outreach; under-resourced community groups absorb
    program coordination effort without delivering proportionate recruitment outcomes.
