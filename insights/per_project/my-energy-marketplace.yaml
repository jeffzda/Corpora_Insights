  source_title: Wattwatchers - My Energy Marketplace - Final Knowledge Sharing Report
  publish_date: 2023-09
  project_name: My Energy Marketplace (MEM)
  what_happened: The tariff comparison feature in the MyEnergy app achieved very low
    conversion rates (i.e. low numbers of users actually switching retailers through
    the app). Consumer distrust of comparison and switching services — shaped by poor
    practices of existing providers — was identified as the primary barrier, with
    users concerned that merely viewing a plan would trigger spam or follow-up calls.
  lesson_learnt: Consumer distrust of energy comparison and switching services is
    deeply ingrained and difficult to overcome through app design alone; projects
    relying on switching functions to demonstrate consumer value should anticipate
    low uptake and design alternative value propositions.
