  project_name: My Energy Marketplace (MEM)
  what_happened: Once the initial pool of 100%-subsidised devices was exhausted and
    packages moved to a 50%-subsidised price point ($399+GST), customer sensitivity
    to upfront cost increased materially, constraining participant recruitment and
    requiring a shift in sales messaging from project identity to product benefits.
  lesson_learnt: Design subsidy drawdown schedules to enable direct-to-customer price
    testing before transitioning from fully subsidised to partially subsidised offers
    — COVID-19 prevented this in the MEM, leaving the team without validated price-point
    data when cost-sensitivity became the primary recruitment barrier.
