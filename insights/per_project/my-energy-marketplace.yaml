  source_title: My Energy Marketplace Lessons Learnt 4
  publish_date: '2021-11-19'
  project_name: My Energy Marketplace (MEM)
  what_happened: The Marketplace was initially conceived as a feature within the MyEnergy
    app, but as channel partners with more feature-rich apps entered the project,
    a standalone MyEnergy app became redundant for those customers, requiring a redesign
    of the Marketplace as a standalone capability.
  lesson_learnt: Design platform features (such as a data marketplace) as modular,
    standalone components from the outset rather than embedding them in a proprietary
    app — channel partners will often have their own preferred app ecosystems, and
    tightly coupled designs will require costly rearchitecting when the channel strategy
    evolves.
