  source_title: My Energy Marketplace Lessons Learnt 3
  publish_date: 2021-06
  project_name: My Energy Marketplace (MEM)
  what_happened: Wattwatchers initially aimed for consumers to 'own' their energy
    data, but legal advice established that copyright law grants ownership to the
    entity that generates the data — in this case Wattwatchers itself — requiring
    a fundamental revision of the project's data rights objective.
  lesson_learnt: Clarify the legal basis of data ownership with specialist legal advice
    before committing to consumer-facing data-rights propositions — copyright law
    may vest ownership in the platform operator rather than the end user, requiring
    a redesign of the value proposition around 'control' rather than 'ownership'.
