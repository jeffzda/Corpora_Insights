  project_name: My Energy Marketplace (MEM)
  what_happened: Consumer research validated four distinct consumer personas ('Solar
    optimiser', 'Bill stress', 'Smart home tinkerer', 'Sustainability warrior') and
    confirmed that consumer motivations for engaging with energy data are not necessarily
    life-cycle or demographic based, giving Wattwatchers increased confidence in targeted
    messaging.
  lesson_learnt: Segment consumer recruitment and messaging by motivation-based personas
    rather than demographic proxies — energy data engagement is driven by attitudinal
    factors that cut across age and life-stage, and persona-targeted messaging is
    more likely to convert participants than generic campaigns.
