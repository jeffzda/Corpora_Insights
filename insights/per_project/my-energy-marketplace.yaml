    'ownership' to maximising consumer 'control' of data, updating governance documents
    accordingly.
  transferability: broad
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id089
  - 5
  evidence_excerpt: While Wattwatchers' objective is to maximise consumer 'ownership'
