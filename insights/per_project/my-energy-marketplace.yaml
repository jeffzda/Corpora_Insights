  what_happened: The existing 'smart meter' minimum specification mandated under the
    AEMC regulatory framework provides only day-behind 5-minute interval data in NEM12
    format, which Wattwatchers found to be an inadequate technical baseline for delivering
    real-time data-driven energy services compared to MEM devices providing near-real-time
    data via API.
  lesson_learnt: Innovators building data services on top of regulated metering infrastructure
    should not assume regulatory minimum specifications will be fit for purpose —
    proactively engage with regulatory reform processes to advocate for data granularity
    and latency requirements that enable advanced services, or design around existing
    constraints using supplementary monitoring devices.
