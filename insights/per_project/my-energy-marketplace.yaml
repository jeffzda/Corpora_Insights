- record_id: ARENA-DLV-24651
  source_title: 'Consumer Engagement in Energy Data Services: Recommendations Moving
    Forward'
  publish_date: null
  project_name: Wattwatchers My Energy Marketplace (MEM)
  what_happened: Smart meter rollouts in Australia and Europe delivered far lower
    household energy savings than anticipated — only 3–5% in Australia and an average
    of 5.4% across 154 European feedback trials — because rollouts lacked comprehensive
    communications campaigns, leaving most consumers unaware they could access their
    data or use in-home energy tools.
  lesson_learnt: Energy data programs must be accompanied by a dedicated communications
    campaign that actively informs consumers of available data access and tools; technology
    deployment alone does not drive behaviour change or energy savings.
