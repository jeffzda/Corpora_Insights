  what_happened: The project's initial permissioning model for third-party app developers
    was designed as an OAuth-style system requiring significant development effort
    from third parties. After discussions with multiple developers, this was replaced
    with a simplified model based on the standard Wattwatchers API implementation,
    greatly reducing the integration barrier for app developers.
