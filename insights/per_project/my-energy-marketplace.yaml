- record_id: ARENA-DLV-59161
  source_title: Wattwatchers - My Energy Marketplace - Final Knowledge Sharing Report
  publish_date: 2023-09
  project_name: My Energy Marketplace (MEM)
  what_happened: Research data users consistently required at least 12 months of historical
    monitoring data before the dataset was useful for trend analysis. Because the
    MEM devices were installed incrementally over time, only 25% of devices had nearly
    two years of data while 75% had fewer than 5 months at the time of reporting,
    limiting the immediacy of data availability for research customers.
  lesson_learnt: At least 12 months of data from a critical mass of sites must be
    available before data services become attractive to research institutions; future
    programs should allow at least 12 months between bulk device deployment and commencement
    of data sales, and stage recruitment to maximise the proportion of long-tenure
    sites.
