  source_title: My Energy Marketplace Lessons Learnt 4
  publish_date: '2021-11-19'
  project_name: My Energy Marketplace (MEM)
  what_happened: Consumer user research found that transparency about why recommendations
    and offers are made is crucial for consumer trust, and that participants were
    open to personalised energy insights leading to commercial offers only when presented
    at an appropriate stage and with clear explanation of the recommendation basis.
  lesson_learnt: Build explicit transparency mechanisms into any energy data marketplace
    or recommendation engine — consumers will accept data-driven commercial offers
    but require clear disclosure of why a recommendation is being made; opaque or
    algorithmically unexplained offers erode trust and reduce conversion.
