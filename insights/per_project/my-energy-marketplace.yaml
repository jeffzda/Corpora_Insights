  source_title: Wattwatchers - My Energy Marketplace - Final Knowledge Sharing Report
  publish_date: 2023-09
  project_name: My Energy Marketplace (MEM)
  what_happened: Consumer trust emerged as a fundamental barrier to uptake of the
    tariff switching and data sharing functions in the MyEnergy app. Even a small
    group of around 10 user testers immediately raised concerns that clicking on a
    plan would trigger spam or follow-up calls, reflecting distrust shaped by poor
    practices of existing comparison services. Social housing tenants additionally
    showed sensitivity about 'big brother' data sharing.
  lesson_learnt: Trust-building must be treated as a first-class design and delivery
    challenge in consumer energy data platforms, not an afterthought; negative experiences
    with existing comparison and switching services create a pre-existing trust deficit
    that app design, plain-language T&Cs, and brand credibility must actively work
    to overcome before users will engage with data sharing features.
