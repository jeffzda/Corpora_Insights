  source_title: My Energy Marketplace Lessons Learnt 3
  publish_date: 2021-06
  project_name: My Energy Marketplace (MEM)
  what_happened: New South Australian solar inverter remote disconnection regulations
    introduced in September 2020 disrupted MEM operations — a key customer who had
    committed to over 100 MEM package installations delayed their initial rollout
    and subsequently did not proceed with the larger volume order, partly because
    the new regulations prompted them to adopt competing features from inverter manufacturers.
  lesson_learnt: Scale up across a broad range of channel partners in multiple jurisdictions
    as early as possible in the project — concentration of deployment volume in a
    single partner exposes the project to significant rollout risk if that partner's
    business strategy is disrupted by regulatory or technology changes.
