  project_name: Wattwatchers My Energy Marketplace (MEM)
  what_happened: The electricity sector channelled inadequate funding towards understanding
    socio-economic and cultural factors affecting smart meter uptake, prioritising
    technological development over human factors, which contributed to underperformance
    of smart meter programs.
  lesson_learnt: Allocate explicit budget and research effort to understanding socio-economic
    and cultural factors before deploying energy data services — technology-first
    approaches that neglect human factors systematically underperform.
