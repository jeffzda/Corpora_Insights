  what_happened: Wattwatchers' first use of machine learning (in partnership with
    Shifted Energy for hot water system insights) revealed that verifying the accuracy
    of ML-generated insights is extremely difficult or impossible without real-world
    feedback from end users, meaning full validation could not occur until the feature
    was live in the app.
  lesson_learnt: Machine learning insight features in consumer energy apps cannot
    be fully validated in a test environment — design for an iterative in-production
    validation loop that collects user feedback once the feature is live, and communicate
    this limitation explicitly in project planning to avoid treating ML features as
    equivalent to deterministic software in testing schedules.
