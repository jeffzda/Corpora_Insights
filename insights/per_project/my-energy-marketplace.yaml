    services they did not use, requiring targeted improvements in training and application
    demonstration to support uptake.
  lesson_learnt: Social housing cohorts require tailored onboarding that explicitly
    demonstrates financial benefit and addresses concerns about being charged for
    unwanted services — standard app onboarding designed for owner-occupiers is insufficient
    for this group, and data sharing consent processes must be designed with this
    heightened privacy sensitivity in mind.
