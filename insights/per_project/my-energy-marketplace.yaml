  project_name: My Energy Marketplace (MEM)
  what_happened: Only approximately 70% of the installed customer base downloaded
    the mydata.energy app, despite the app being a primary component of the customer
    value proposition — a surprise to the MEM team, partly attributed to early installations
    predating the app launch and users not responding to email notifications.
  lesson_learnt: Plan for a material proportion of installed customers not to adopt
    associated digital applications without active follow-up; where devices are installed
    significantly before the app launches, develop a targeted re-engagement campaign
    for that cohort to close the gap between device deployment and app activation.
