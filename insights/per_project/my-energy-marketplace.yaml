  project_name: My Energy Marketplace (MEM)
  what_happened: The project's initial conceptual position — that energy users 'own'
    their energy data — proved inconsistent with legal norms, where the entity generating
    the data is generally considered the legal owner, requiring a rethink of how user
    data rights were framed and implemented.
  lesson_learnt: Do not assume consumer 'data ownership' as a legal starting position
    for energy data projects — obtain legal advice early and frame consumer rights
    in terms of control and permissioning rather than ownership, to avoid having to
    revise foundational governance documents mid-project.
