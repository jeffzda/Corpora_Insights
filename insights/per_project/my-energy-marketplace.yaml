- record_id: ARENA-DLV-28555
  source_title: My Energy Marketplace - Lessons Learnt Report
  publish_date: 2023-09
  project_name: My Energy Marketplace (MEM)
  what_happened: When Wattwatchers attempted to establish data sharing agreements
    with Australian utility customers, the data ownership provisions in Australian
    Electricity Network Distribution Licences — which require utilities to 'own' all
    data associated with their devices — conflicted with consumer law principles (that
    the data controller owns the data), creating a regulatory barrier to the MEM's
    anonymised data sharing model.
  lesson_learnt: Energy data platform projects involving utility-connected devices
    must proactively map and reconcile competing regulatory frameworks — Distribution
    Licence data ownership requirements, consumer law data controller principles,
    and critical infrastructure cybersecurity obligations — before attempting to execute
    data sharing agreements with utility partners.
  issue_severity: major
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: approvals/contracting
  proponent_type: technology vendor
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Careful definition of the data and its intended uses, negotiated
    on a case-by-case basis, allowed beneficial outcomes to be reached for all parties
    including end users.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: DER
  source_pages: &id049
  - 10
  - 11
  evidence_excerpt: The data ownership is complicated by the requirements of the Australian
    Electricity Network Distribution Licences. These Licences generally require the
    utility to 'own' all data associated with their devices and jurisdictional requirements
    also apply that further complicate the situation that varies throughout the Australian
    market.
  confidence_note: Classified as major severity because the regulatory conflict created
