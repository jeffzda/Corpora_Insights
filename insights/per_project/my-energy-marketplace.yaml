  source_title: My Energy Marketplace Lessons Learnt 3
  publish_date: 2021-06
  project_name: My Energy Marketplace (MEM)
  what_happened: The tariff comparison feature — and its associated bill upload requirement
    — acted as a barrier to onboarding commercial and community channel partners who
    had existing retail comparison arrangements or community energy supply agreements
    that were not purely cost-driven.
  lesson_learnt: Features designed for individual consumer benefit (e.g. tariff switching)
    can actively deter channel partners with pre-existing commercial or community
    retail arrangements; build configurability into platform features so they can
    be disabled or customised for specific partner contexts.
