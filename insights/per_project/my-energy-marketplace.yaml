- record_id: ARENA-DLV-42016
  source_title: My Energy Marketplace Lessons Learnt 3
  publish_date: 2021-06
  project_name: My Energy Marketplace (MEM)
  what_happened: Sites where solar systems are installed on a separate structure (e.g.
    garage or shed) with its own sub-board — more common in regional and remote areas
    — require at least two monitoring devices instead of one, materially increasing
    per-site cost and in some cases causing installations not to proceed.
  lesson_learnt: Account for multi-sub-board site configurations in device budgets
    and installation plans for DER monitoring rollouts — particularly for regional/remote
    deployments where detached solar sub-boards are more prevalent — and assess whether
    customer co-funding of additional devices is commercially viable before committing
    to the site.
