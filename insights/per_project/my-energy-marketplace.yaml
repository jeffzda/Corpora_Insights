  source_title: Wattwatchers Interim Knowledge Sharing Report
  publish_date: '2021'
  project_name: My Energy Marketplace (MEM)
  what_happened: Ensuring scale rollout partner T&Cs compliance proved challenging
    — where partners had their own app and onboarding process, there was no guaranteed
    mechanism for ensuring MEM T&Cs were presented to and accepted by the end customer,
    and partner data retention policies sometimes conflicted with MEM T&Cs.
  lesson_learnt: When shifting to a scale-partner rollout model, establish contractual
    and technical mechanisms to enforce consumer T&Cs compliance by partners before
    onboarding them — relying on partners to voluntarily present T&Cs creates compliance
    gaps, and conflicting data retention obligations should be resolved in partner
    agreements before deployment commences.
