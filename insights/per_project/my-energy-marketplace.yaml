- record_id: ARENA-DLV-24656
  source_title: 'Consumer Engagement in Energy Data Services: Recommendations Moving
    Forward'
  publish_date: null
  project_name: Wattwatchers My Energy Marketplace (MEM)
  what_happened: A community-based social marketing trial in Perth (n=40,000) that
    combined extensive ongoing feedback — including letters, phone calls, and delivery
    of educational materials — achieved a 20% peak demand reduction, 10% peak demand
    shifting, and 10% average total energy use reduction, substantially outperforming
    standard smart meter feedback approaches.
  lesson_learnt: Community-based social marketing with sustained multi-touchpoint
    follow-up (letters, phone calls, educational materials) drives substantially larger
    demand reductions than passive data provision alone — this approach should be
    considered for programs targeting peak demand reduction.
