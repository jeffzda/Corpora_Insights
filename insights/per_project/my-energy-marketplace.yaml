    realising any early data services income.
  lesson_learnt: Validate data service pricing and demand assumptions early by soliciting
    non-binding expressions of interest from potential customers — early signals of
    willingness to pay ($10k–$20k per dataset) are useful for business case development,
    but revenue cannot be realised until sufficient device scale and data duration
    are achieved, so rollout pace is the critical path to commercialisation.
