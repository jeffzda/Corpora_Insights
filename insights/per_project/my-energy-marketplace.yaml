- record_id: ARENA-DLV-70263
  source_title: My Energy Marketplace Lessons Learnt 4
  publish_date: '2021-11-19'
  project_name: My Energy Marketplace (MEM)
  what_happened: Research with data-hungry university consortia revealed that energy
    monitoring data commands higher value when accompanied by site-profile survey
    data, but formal ethics requirements for university projects add substantial costs
    for participant recruitment, onboarding and retention — and may require direct
    payments to participants.
  lesson_learnt: When designing data service offerings for the academic research sector,
    budget explicitly for ethics-driven participant engagement costs (surveys, interviews,
    additional data sharing consent) and factor in potential direct participant payments
    — these costs can be substantial and are frequently underestimated in early data
    services pricing models.
  issue_severity: minor
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
