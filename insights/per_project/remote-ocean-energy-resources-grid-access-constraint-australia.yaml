  evidence_excerpt: The best tidal energy resources tend to be located off the more
    remote coastlines along the northern margin of Australia. With the present technology
    constraints, the most suitable harvesting sites combined with good access to the
    electricity grid favour only a few regional centres... The best wave energy resources
    tend to be located off the more remote coastlines along the southern margin of
    Australia.
