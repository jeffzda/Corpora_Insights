- record_id: ARENA-DLV-72032
  source_title: Australian Energy Resource Assessment – Second edition, 2014
  publish_date: '2014'
  project_name: Remote Ocean Energy Resources — Grid Access Constraint (Australia)
  what_happened: Australia's best tidal energy resources are located off remote northern
    coastlines (Kimberley, Pilbara, Darwin, Torres Strait) and best wave energy resources
    along the remote southern margin, both distant from major electricity grid infrastructure.
    This means that despite world-class resource quality, most sites cannot be developed
    economically without major grid extension investment that is not currently justified
    by local electricity demand.
  lesson_learnt: Resource assessments for ocean energy (and analogously for other
    remote renewables) should integrate grid proximity and local/regional load analysis
    alongside resource characterisation — sites should be triaged into near-grid opportunities
    suitable for near-term development and remote-resource opportunities requiring
    grid extension or alternative use cases (e.g. mining load, desalination) before
    investment in detailed feasibility.
