- record_id: ARENA-DLV-4656
  source_title: Bombora Wave Power Cost of Energy Study
  publish_date: 2016-09
  project_name: Bombora Wave Power Cost of Energy Study
  what_happened: Grid connection costs ($49.3M capital plus $15.0M installation) represented
    approximately 25% of total capital costs for the 60MW wave farm, making it the
    second-largest cost category after primary structure. This cost proportion is
    consistent across both design cases.
  lesson_learnt: For offshore wave energy farms, grid connection costs (submarine
    cable and offshore substation) represent a substantial and relatively fixed cost
    fraction (~25% of capex) regardless of device design improvements — LCOE reduction
    strategies that focus solely on device cost will be limited unless grid connection
    costs are also addressed or shared across larger deployed capacity.
