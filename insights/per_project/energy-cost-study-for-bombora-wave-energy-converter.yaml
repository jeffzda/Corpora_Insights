- record_id: ARENA-DLV-4660
  source_title: Bombora Wave Power Cost of Energy Study
  publish_date: 2016-09
  project_name: Bombora Wave Power Cost of Energy Study
  what_happened: Key component reliability data was not yet available at the time
    of the study, which prevented finalisation of the Case 5 (integrated cell) structural
    design and meant maintenance accessibility had to be designed in as a default
    requirement, adding cost to the prototype configuration.
  lesson_learnt: When reliability data for novel subcomponents (membranes, valves)
    is unavailable, designing for maintenance accessibility in the prototype configuration
    is a necessary cost premium — projects should plan an explicit reliability data
    collection phase that triggers the design transition to lower-cost integrated
    configurations.
