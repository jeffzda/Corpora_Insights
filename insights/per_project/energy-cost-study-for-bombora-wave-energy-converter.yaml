- record_id: ARENA-DLV-4654
  source_title: Bombora Wave Power Cost of Energy Study
  publish_date: 2016-09
  project_name: Bombora Wave Power Cost of Energy Study
  what_happened: LCOE estimates for the baseline design (Case 3a) ranged from AUD34.77c/kWhr
    (optimistic, 7% discount rate) to AUD70.32c/kWhr (pessimistic, 14% discount rate),
    well above current commercial electricity market rates. The analysis identified
    that discount rate, capital cost, and availability assumptions were the dominant
    drivers of LCOE.
  lesson_learnt: For pre-commercial wave energy projects, the discount rate assumption
    is as important as capital cost in determining LCOE competitiveness — project
    developers should explicitly model the pathway to achieving lower discount rates
    (e.g. from 14% toward 7%) as part of the commercialisation roadmap, since this
    alone can halve the estimated LCOE.
