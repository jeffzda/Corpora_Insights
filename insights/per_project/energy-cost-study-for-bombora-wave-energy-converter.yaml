  source_title: Bombora Wave Power Cost of Energy Study
  publish_date: 2016-09
  project_name: Bombora Wave Power Cost of Energy Study
  what_happened: The project required a contract variation due to scope change and
    unbudgeted contracting costs, as well as a time extension due to delay during
    contract execution. The total project cost at completion ($429,818) exceeded the
    original budget ($420,573), a variance of approximately 2.2%.
  lesson_learnt: For small enterprises undertaking ARENA-funded feasibility studies,
    grant remittance cycles can create significant cash-flow pressure — time between
    outgoings and grant payments must be explicitly planned for when structuring milestone
    schedules and cash-flow forecasts.
