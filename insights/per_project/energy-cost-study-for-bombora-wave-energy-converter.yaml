- record_id: ARENA-DLV-4659
  source_title: Bombora Wave Power Cost of Energy Study
  publish_date: 2016-09
  project_name: Bombora Wave Power Cost of Energy Study
  what_happened: The performance model (mWave™) was validated through a combination
    of CFD simulations (Curtin University), tank testing (Australian Maritime College),
    and numerical modelling (Applied Renewables Research), enabling MAEP estimates
    with defined optimistic/pessimistic sensitivity bounds of ±100 MWhr/year around
    a 2,100 MWhr/year nominal.
  lesson_learnt: For novel wave energy converters at pre-commercial stage, performance
    model credibility requires multi-method empirical validation (CFD, tank testing,
    and numerical modelling) — reliance on a single modelling approach will not provide
    the confidence bounds needed to support LCOE estimates suitable for investment
    decisions.
