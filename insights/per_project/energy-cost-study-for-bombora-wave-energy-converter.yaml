- record_id: ARENA-DLV-4655
  source_title: Bombora Wave Power Cost of Energy Study
  publish_date: 2016-09
  project_name: Bombora Wave Power Cost of Energy Study
  what_happened: Transitioning from a prototype design with removable cells (Case
    3a) to a product design with integrated cells (Case 5) was projected to reduce
    structure costs by approximately 60% per unit (from ~$3.04M to ~$1.29M per mWave™),
    reducing overall farm capital cost from $253.6M to $183.8M for a 60MW farm — a
    28% reduction.
  lesson_learnt: For subsea wave energy converters, designing for maintainability
    (removable cells) is appropriate at prototype stage but locking in integrated
    construction once reliability data is proven can deliver capital cost reductions
    of ~28% at farm scale — the development roadmap should explicitly include the
    trigger conditions for this design transition.
