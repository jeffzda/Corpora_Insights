- record_id: ARENA-DLV-25917
  source_title: Review of ARENA's Reliability Portfolio
  publish_date: 2020-01
  project_name: Demand Response Portfolio (2017 ARENA Funding Round)
  what_happened: ARENA's 2017 targeted demand response funding round committed $28.6 million across 10 pilot projects, filling a gap in the portfolio and the broader sector. Projects demonstrated meaningful
    demand response capability — including 12 MW from United Energy, 5 MW from Flow Power, and 10 MW from Intercast and Forge — but as at the review date all projects had completed less than 50% of milestones
    and further findings were expected before the future direction could be determined.
  lesson_learnt: Targeted funding rounds for emerging reliability technologies (such as demand response) are an effective mechanism for filling identified portfolio gaps; however, further funding rounds
    in the same area should be deferred until findings from the initial round are established, to avoid locking in approaches before the evidence base is mature.
