- record_id: ARENA-DLV-58806
  source_title: 'DER Customer Insights: The Customer Journey'
  publish_date: 2020-07
  project_name: Synergy Alkimos Beach Solar and Storage Trial
  what_happened: Synergy's Alkimos Beach project found a large number of target customers
    were ineligible because their reversible air conditioning units did not meet the
    required standard for demand response control, reducing the effective customer
    pool despite pre-suitability processes.
  lesson_learnt: Validate specific technical eligibility criteria (such as appliance
    compatibility for demand response) early in the design phase and before customer-facing
    recruitment commences — equipment incompatibilities discovered at the suitability-check
    stage reduce effective pool size and increase acquisition costs.
