- record_id: ARENA-DLV-45010
  source_title: Network Hosting Capacity Projects Progress Report (Year One)
  publish_date: 2020-03
  project_name: 'Solar Analytics: Enhanced Reliability through Short-Time Resolution Data'
  what_happened: Wattwatchers delivered a firmware upgrade enabling regular reporting of voltage statistics; the upgrade was then being rolled out across a fleet of over 20,000 monitoring devices, demonstrating
    that firmware-based capability enhancements to deployed monitoring hardware can be deployed at scale but require a coordinated fleet rollout process.
  lesson_learnt: When deploying firmware upgrades to large fleets of monitoring devices in the field, plan for an extended rollout window and version-management process — the Solar Analytics/Wattwatchers
    deployment across 20,000+ devices illustrates that even technically straightforward firmware changes require significant coordination at fleet scale.
