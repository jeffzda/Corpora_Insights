- record_id: ARENA-DLV-45009
  source_title: Network Hosting Capacity Projects Progress Report (Year One)
  publish_date: 2020-03
  project_name: 'Solar Analytics: Enhanced Reliability through Short-Time Resolution Data'
  what_happened: High-resolution monitoring data provided by Solar Analytics enabled AEMO to identify specific behaviours of small-scale PV systems during frequency and voltage disturbances that were previously
    unknown and critical to predicting network response — a finding that had not been achievable with standard monitoring infrastructure.
  lesson_learnt: High-resolution, short-time interval monitoring data (beyond standard 30-minute smart meter intervals) is necessary to characterise PV system behaviour during grid disturbances — projects
    planning to model or predict DER network impacts should specify sub-minute data capture as a baseline requirement rather than relying on standard monitoring data.
