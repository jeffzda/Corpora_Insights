- record_id: ARENA-DLV-67602
  source_title: Diffuse Energy Lessons Learnt Report 4
  publish_date: 2021-12
  project_name: 'Diffuse Energy: Reliable and resilient wind energy for off-grid telecommunication
    towers'
  what_happened: The global semiconductor shortage severely impacted production of
    the Hyland 920 controller, with component prices increasing by up to 45x, manufacturing
    costs doubling in six months, and lead times extending to 18 months. This delayed
    the current production run to January 2022 and created significant uncertainty
    for future production runs.
  lesson_learnt: Small-scale hardware manufacturers are highly vulnerable to global
    semiconductor supply chain disruptions — forward order critical electronic components
    well in advance and build buffer stock, as large manufacturers stockpile components
    and further exacerbate shortages for smaller buyers. Treat semiconductor availability
    as a material project risk requiring active mitigation.
