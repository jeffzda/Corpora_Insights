- record_id: ARENA-DLV-6651
  source_title: Diffuse Energy Lessons Learnt Report 3
  publish_date: 2021-09
  project_name: 'Diffuse Energy: Reliable and resilient wind energy for off-grid telecommunication
    towers'
  what_happened: During field operation of the test microgrid at Stanhope NSW, the
    wind turbine controller caused system voltage to oscillate between 56 V and 58
    V in strong winds when the battery was near full capacity. The controller repeatedly
    shorted the generator, increasing mechanical and electrical fatigue and reducing
    useful energy stored.
  lesson_learnt: Configure wind turbine controllers to ramp up dump-resistor braking
    (trickle-charge mode) before reaching the maximum voltage threshold — relying
    solely on generator shorting to limit voltage in small battery systems causes
    destructive cycling that increases fatigue and wastes harvestable energy.
  issue_severity: moderate
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: technology vendor
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Updated the Mk II controller firmware to apply the brake earlier
    and ramp dump-resistor current to a maximum of 15 A, enabling trickle charging
    and extending the turbine shutdown period to 15 minutes; updated firmware distributed
    to project partners.
  transferability: moderate
  delay_magnitude: null
  technology_domain: wind
  source_pages: &id001
  - 4
  - 5
  - 6
  evidence_excerpt: What we have seen during field operation of our microgrid test
    system at Stanhope NSW (which has a small AGM battery system with 8 kWh storage),
    is that in strong winds when the battery is approaching full capacity the turbine
    can drive up the system voltage to 58 V, causing the controller to think that
    the battery is full and shut down the wind turbine system through shorting the
    generator.
  confidence_note: lifecycle_phase assigned as commissioning/integration because the
    issue was observed during test/field-trial operation of the prototype microgrid,
    not yet stable commercial operation.
