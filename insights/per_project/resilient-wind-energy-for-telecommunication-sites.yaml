- record_id: ARENA-DLV-63751
  source_title: Diffuse Energy Lessons Learnt Report 2
  publish_date: 2021-06
  project_name: 'Diffuse Energy: Reliable and resilient wind energy for off-grid telecommunication
    towers'
  what_happened: During installation of wind energy systems at two Vertel sites (Mt
    Hyland and Mt Wondurrigah), a field splice of weather station cabling was made
    without proper shielding because the required materials were not on site. The
    unshielded join caused electromagnetic interference that locked up the weather
    station and cascaded to lock up the remote monitoring system, preventing performance
    data from being transmitted to the cloud database.
  lesson_learnt: Ensure all cabling materials — including sufficient lengths and proper
    shielding materials — are available on site before commencing installation. Implement
    a mandatory checklist to fully test the remote monitoring system before leaving
    site, so interference or connectivity faults are identified and corrected without
    requiring a costly return visit to a remote location.
  issue_severity: moderate
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: technology vendor
  delay_category: commissioning/integration
  failure_mode: execution & logistics
  outcome_class: delayed but recoverable
  secondary_failure_mode: data & measurement
  intervention_note: Sapphi remotely investigated and implemented an automatic reset
    function in the monitoring software, pushed over 3G/4G to all units; a site visit
    was planned for late June to replace cabling with correctly shielded cables.
  transferability: moderate
  delay_magnitude: 1-3 months
  technology_domain: wind
  source_pages: &id002
  - 3
  - 4
  - 5
  evidence_excerpt: A field splice of the weather station cabling was undertaken to
    extend the cables to the necessary length but could not be shielded fully as the
    necessary materials were not available on site. It was not anticipated that this
    would be a problem, but it resulted in interference between the weather sensor
    and remote monitoring system.
  confidence_note: null
