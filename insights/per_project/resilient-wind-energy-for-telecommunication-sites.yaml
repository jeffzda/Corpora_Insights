  outcome_class: delayed but recoverable
  secondary_failure_mode: unvalidated integration
  intervention_note: Diffuse Energy raised standardisation of mounting equipment as
    a priority in a knowledge-sharing meeting on 17/03/21 and engaged vendors and
    third-party certifiers to investigate a standardised mounting solution; site visits
    were planned to bring forward planning approvals for the WA installations.
  transferability: moderate
  delay_magnitude: 3-12 months
  technology_domain: wind
