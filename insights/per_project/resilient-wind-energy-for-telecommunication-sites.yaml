- record_id: ARENA-DLV-68602
  source_title: Diffuse Energy Lessons Learnt Report 1
  publish_date: null
  project_name: 'Diffuse Energy: Reliable and resilient wind energy for off-grid telecommunication
    towers'
  what_happened: Attempting to power the same 240 V output from two different battery
    inverters (the new Eaton system and an existing Studer system) caused integration
    faults — the Eaton inverter faulted on detecting an existing supply on its 240
    V output, and frequency-shifting conflicts between inverters caused apparent-power
    faults. Multiple equipment suppliers confirmed there was no simple off-the-shelf
    solution.
  lesson_learnt: Avoid parallel battery inverter configurations on the same AC bus
    in off-grid micro-grid extensions — instead, connect new generation assets directly
    to the DC bus of the existing micro-grid, which eliminates frequency-shifting
    conflicts and fault conditions between battery inverters.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: pilot
  lifecycle_phase: commissioning/integration
  proponent_type: technology vendor
  delay_category: commissioning/integration
  failure_mode: unvalidated integration
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Configured the new Eaton system as a 'grid input' to the existing
    Studer inverter, limited to 480 W, and enabled the Studer's active AC filtering
    setting to resolve the frequency mismatch between the two inverters.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: wind
  source_pages: &id008
  - 4
  - 5
  evidence_excerpt: The Eaton inverter did not like there being any existing supply
    on its 240 V output and went into Fault... several equipment suppliers told us
