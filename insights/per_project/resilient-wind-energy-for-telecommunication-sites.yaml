- record_id: ARENA-DLV-68603
  source_title: Diffuse Energy Lessons Learnt Report 1
  publish_date: null
  project_name: 'Diffuse Energy: Reliable and resilient wind energy for off-grid telecommunication
    towers'
  what_happened: Non-standardisation of turbine mounting systems across different
    tower designs required bespoke structural analysis and third-party certification
    for each installation, causing delays of several months to project commencement
    on installations outside the ARENA project and raising a risk of similar delays
    for planned WA installations.
  lesson_learnt: Standardise turbine mounting systems across tower types before scaling
    installation programmes — bespoke mounting designs for each tower configuration
    require repeated third-party structural certification, adding several months of
    delay per installation; engaging certifiers early to develop a standardised mounting
    approach can streamline this across the portfolio.
