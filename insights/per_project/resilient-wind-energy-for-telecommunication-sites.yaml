  what_happened: COVID-19 travel restrictions prevented Diffuse Energy from visiting
    interstate and WA clients in person, limiting the company's ability to coordinate
    hardware installations and problem-solve on site, and causing a minor approximately
    two-week delay to solar panel installation at the test micro-grid site due to
