  source_title: Diffuse Energy Lessons Learnt Report 2
  publish_date: 2021-06
  project_name: 'Diffuse Energy: Reliable and resilient wind energy for off-grid telecommunication
    towers'
  what_happened: Eight greenfield customer sites with Positive Off Grid Solutions,
    which were to host Diffuse Energy wind turbine installations as part of the ARENA
    project, were dependent on a federal government grant application that was unsuccessful.
    This created uncertainty around whether and when the towers would be built, putting
    at risk the installation of eight of the ten planned turbine deployments and introducing
    potential cost exposure for equipment already purchased.
  lesson_learnt: Before signing up greenfield sites for wind energy system deployment,
    thoroughly understand the funding arrangements and planning maturity of the customer's
    broader infrastructure project. Engage early enough to be included in tender and
    grant applications, and provide value-add support to customers who are inexperienced
    with the planning and funding cycle, reducing the risk that an unsuccessful third-party
    funding application stalls or cancels your own project milestones.
