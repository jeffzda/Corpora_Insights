- record_id: ARENA-DLV-67603
  source_title: Diffuse Energy Lessons Learnt Report 4
  publish_date: 2021-12
  project_name: 'Diffuse Energy: Reliable and resilient wind energy for off-grid telecommunication
    towers'
  what_happened: Wind speed forecasts for sites surrounded by dense Australian bushland
    (Mt Wondurrigah and Mt Hyland) overestimated average wind speeds by approximately
    2 m/s compared to measured values. The forecasting methodology used a terrain
    roughness length (z0) of 0.25 for bushland, whereas measured data aligned with
    a value of 0.4 as published by the Danish Wind Energy Association.
  lesson_learnt: When forecasting wind resources for turbine sites in dense Australian
    bushland, use a terrain roughness length (z0) of 0.4 rather than the commonly
    cited 0.25 — using 0.25 overestimates average wind speed by approximately 2 m/s
    and will inflate predicted energy yield. Open farmland sites are not affected
    by this correction.
  issue_severity: moderate
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Adopted a roughness length value of z0 = 0.4 for dense bushland
    sites, consistent with Danish Wind Energy Association published values, for all
    future site assessments.
  transferability: moderate
  delay_magnitude: null
  technology_domain: wind
  source_pages: &id006
  - 6
  - 7
  evidence_excerpt: For sites with dense surrounding bushland, our forecasts have
    been higher than measured, with both Mt Wondurrigah and Mt Hyland being approximately
    2m/s lower than expected... However, if we modify this to 0.4 we get predictions
    that are in line with measured data.
