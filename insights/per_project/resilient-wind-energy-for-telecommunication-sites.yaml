- record_id: ARENA-DLV-63753
  source_title: Diffuse Energy Lessons Learnt Report 2
  publish_date: 2021-06
  project_name: 'Diffuse Energy: Reliable and resilient wind energy for off-grid telecommunication
    towers'
  what_happened: At a residential site external to the ARENA project, a wind turbine
    was installed incorrectly with only two of three phases connected. The fault was
    not detected at installation because there was no wind to run the turbine, and
    diagnosing the problem consumed considerable time via phone support with the installer
    before the cause was identified.
  lesson_learnt: Develop and mandate an electrical test methodology — using standard
    tools available to telecommunications technicians — that allows installers to
    verify correct wiring of the turbine, controller, and monitoring system before
    leaving site regardless of wind conditions. This avoids costly return visits to
    remote sites to rectify installation faults that could have been caught on the
    day.
  issue_severity: moderate
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: technology vendor
  delay_category: commissioning/integration
  failure_mode: execution & logistics
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: data & measurement
  intervention_note: Diffuse Energy identified the root cause through remote phone
    diagnosis and resolved the specific fault; they committed to developing a simple
    electrical test methodology using readily available standard tools to prevent
    recurrence on future installations.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: wind
  source_pages: &id004
  - 3
  - 7
  evidence_excerpt: A considerable amount of time was spent trying to identify the
    cause of the fault over the phone with the installer, and eventually it was discovered
    that the turbine had not been connected into the turbine correctly, with only
    2 of the 3 phases properly connected… a system of electrically testing the setup
    as a last step if it is not windy would be beneficial to avoid the issue, or one
    like it, occurring on remote sites where a return visit to rectify a fault could
    be very time-consuming and costly.
  confidence_note: failure_mode classified as design assumption failure because the
    installation procedure did not account for zero-wind test conditions; resource/capability
