- record_id: ARENA-DLV-67601
  source_title: Diffuse Energy Lessons Learnt Report 4
  publish_date: 2021-12
  project_name: 'Diffuse Energy: Reliable and resilient wind energy for off-grid telecommunication
    towers'
  what_happened: The Hyland 920 controller's MPPT algorithm used a power curve based
    on design calculations and wind tunnel testing, but field data showed the turbine
    was spinning slower than expected at each wind speed, causing lower voltage output
    and near-stall conditions at low to mid wind speeds. This resulted in the turbine
    producing less power than expected across all wind speeds.
  lesson_learnt: Validate controller power curves against real-world field data before
    wide deployment — design and wind tunnel derived curves may not account for in-situ
    system losses, and at low-to-mid wind speeds the turbine can enter a semi-stalled
    state with significant power loss. A revised power curve incorporating measured
    system losses is expected to improve yield by approximately 20%.
  issue_severity: moderate
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Built and commissioned a test rig to refine the controller, developed
    a new power curve accounting for system losses, and planned validation at the
    Stanhope microgrid test site before wide-scale deployment.
  transferability: moderate
  delay_magnitude: null
  technology_domain: wind
  source_pages: &id005
  - 4
  - 5
  evidence_excerpt: Although the controller is tracking the current power curve exceptionally
    well, the turbine is spinning slower than expected at each wind speed, which means
    it has a lower output Voltage as the two are directly coupled... From our modelling
    and observations this change is expected to improve the turbine yield by approximately
    20%, depending on the site conditions.
  confidence_note: null
  source_url: https://arena.gov.au/knowledge-bank/diffuse-energy-lessons-learnt-report-4/
  project_page_url: https://arena.gov.au/projects/resilient-wind-energy-for-telecommunication-sites/
