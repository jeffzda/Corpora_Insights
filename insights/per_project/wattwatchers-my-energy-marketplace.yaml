  source_title: State of DER Technology Integration Report
  publish_date: 2021-02
  project_name: Wattwatchers My Energy Marketplace
  what_happened: The Wattwatchers My Energy Marketplace project, which officially
    began in October 2019, had its Funding Agreement with ARENA confirmed only on
    19 December 2019, approximately 2 months after project commencement. The project
    was reported as under budget for Milestone 1 partly due to COVID-19 impacts.
  lesson_learnt: Late finalisation of funding agreements after project commencement
    creates budget and governance uncertainty — project teams should not incur significant
    expenditure before formal funding agreement execution, and programme managers
    should work to align funding agreement execution with project start dates to avoid
    this ambiguity.
