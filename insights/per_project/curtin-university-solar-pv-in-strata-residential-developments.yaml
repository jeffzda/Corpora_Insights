- record_id: ARENA-DLV-42787
  source_title: Evaluation of ARENA's VPP Portfolio
  publish_date: 2021-06
  project_name: Curtin University Solar PV in Strata Residential Developments
  what_happened: The Curtin University project was characterised by Curtin as having
    ARENA behave bureaucratically and micromanage the project, with a protracted and
    unnecessarily complex contracting period that delayed the start of technical work
    while project partners were ready to proceed.
  lesson_learnt: Calibrate project oversight intensity to the risk profile and scale
    of the funded project — research university-led demonstration projects with low
    financial risk do not require the same intensity of oversight as large commercial
    deployments, and excessive oversight reduces recipient motivation and efficiency.
