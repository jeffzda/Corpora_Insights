- record_id: ARENA-DLV-42785
  source_title: Evaluation of ARENA's VPP Portfolio
  publish_date: 2021-06
  project_name: Curtin University Solar PV in Strata Residential Developments
  what_happened: The Curtin University White Gum Valley project developed a scalable
    governance model for shared solar and storage in medium density strata developments,
    but grid consumption was high during winter due to insufficient storage capacity
    and subpar building insulation standards, and customer bill reductions were not
    tracked.
  lesson_learnt: When designing strata solar-and-storage trials, account for building
    envelope performance in energy modelling — poor insulation can dominate winter
    energy demand and undermine VPP value, and tracking actual customer bill outcomes
    should be a mandatory trial metric.
