- record_id: ARENA-DLV-42786
  source_title: Evaluation of ARENA's VPP Portfolio
  publish_date: 2021-06
  project_name: Curtin University Solar PV in Strata Residential Developments
  what_happened: The Curtin University project did not resolve how an intermediary
    should determine the fair distribution of energy across homes and how common areas
    should be treated in a strata energy governance framework, leaving these two aspects
    unresolved at project end.
  lesson_learnt: Strata solar-and-storage governance models require explicit resolution
    of energy allocation rules between individual units and common areas before commercial
    deployment; treat these as mandatory deliverables in any follow-on funded work,
    not optional research questions.
