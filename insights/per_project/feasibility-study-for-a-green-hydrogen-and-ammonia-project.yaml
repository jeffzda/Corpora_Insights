- record_id: ARENA-DLV-71651
  source_title: QNP Green Ammonia Project Feasibility Study - Knowledge Sharing Report
  publish_date: 2020-06
  project_name: QNP Green Ammonia Project
  what_happened: The feasibility study determined the green hydrogen to ammonia project
    is technically feasible but commercially viable only with substantial government
    support in the form of grants and concessional loans. Without funding assistance,
    the margin between electricity input costs and the commodity value of ammonia
    output is insufficient to support the project.
  lesson_learnt: At current small-to-mid scale, green ammonia projects cannot achieve
    cost parity with conventional ammonia production without government grants and
    concessional debt. Project developers should build funding support into the business
    case from the outset and engage ARENA and NAIF early, rather than treating subsidies
    as a contingency.
  issue_severity: major
  project_type: industrial decarbonisation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: concept/feasibility
  proponent_type: industrial operator
  delay_category: financing/commercial close
  failure_mode: commercial & market
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: A five-step commercialisation pathway to subsidy-free viability
    was identified, with a 1 million tonne pa greenfields plant found to have a viable
    business case without subsidies.
  transferability: broad
  delay_magnitude: null
  technology_domain: hydrogen
  source_pages: &id001
  - 4
  - 14
  evidence_excerpt: The feasibility study determined that the project is economically
    viable with sufficient funding support in the form of grants (e.g. from ARENA)
    and concessional loans. Without funding assistance, the margin between the cost
    of inputs (primarily energy) and the value of the output (ammonia, a commodity
    with pricing linked to global benchmarks) is insufficient to support the project.
