  what_happened: The feasibility study found that achieving a viable subsidy-free
    business case for green ammonia requires scaling to approximately 1 million tonnes
    per annum, with intermediate scale steps (88 kt brownfield, 88 kt greenfield,
    300 kt greenfield) progressively improving viability as capital costs fall, financing
    improves, and electricity costs decrease.
  lesson_learnt: Green ammonia projects seeking subsidy-free commercial viability
    should plan a staged scale-up pathway to around 1 million tonnes pa — at smaller
    scales, the combination of high specific capital costs and commodity-linked ammonia
    pricing makes unsubsidised operation unviable, and a credible pathway to scale
    improves the investment case even for early subsidised stages.
