  what_happened: The feasibility study found that NPV was similar across a range of
    electrolyser load factors, meaning the highest load factor (80%) with lowest capital
    cost was optimal. Electrolyser units come in standard sizes, leaving scope for
    slightly higher generation at marginally lower efficiency, which was found to
    be preferable to operating at lower load factors.
  lesson_learnt: In green hydrogen projects where NPV is insensitive to load factor
    across a plausible range, select the highest load factor to minimise electrolyser
    and hydrogen storage capital expenditure — the standard sizing of electrolyser
    modules can then be leveraged to operate at slightly higher throughput rather
    than lower load factor.
