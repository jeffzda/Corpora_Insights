- record_id: ARENA-DLV-71656
  source_title: QNP Green Ammonia Project Feasibility Study - Knowledge Sharing Report
  publish_date: 2020-06
  project_name: QNP Green Ammonia Project
  what_happened: Alkaline electrolyser systems were found to be slower in power response
    speed than PEM systems, but many vendors demonstrated units capable of regulatory
    FCAS (>3% load shift per second). Vendors can achieve different response speeds
    through modifications to separation system and rectifier design.
  lesson_learnt: When designing electrolyser systems intended to provide grid frequency
    services, specify the required FCAS response speed in procurement documentation
    and require vendors to demonstrate compliance — the economic value of response
    speed is project-specific and alkaline systems can meet regulatory FCAS requirements
    with appropriate design modifications.
