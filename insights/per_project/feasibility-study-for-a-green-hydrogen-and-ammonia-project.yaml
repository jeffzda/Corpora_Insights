- record_id: ARENA-DLV-71657
  source_title: QNP Green Ammonia Project Feasibility Study - Knowledge Sharing Report
  publish_date: 2020-06
  project_name: QNP Green Ammonia Project
  what_happened: The preferred hydrogen storage technology could not be resolved during
    feasibility. The trade-offs between high-pressure carbon steel vessels (lower
    capital, more maintenance/replacement) and composite overwound pressure vessels
    (COPV, higher pressure cycling capability, more complex emergency blow-down) remained
    open, with up to 6 storage cycles per day anticipated for the electrolyser-based
    system.
  lesson_learnt: Hydrogen storage technology selection for power-responsive electrolysis
    systems should be treated as a FEED-stage decision requiring dedicated safety-in-design
    work — the integration of plant footprint, pressure cycling requirements, and
    emergency blow-down safety cannot be resolved at feasibility level and should
    not be locked in prematurely.
