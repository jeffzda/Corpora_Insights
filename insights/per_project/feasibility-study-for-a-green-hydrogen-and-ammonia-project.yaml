  project_name: QNP Green Ammonia Project
  what_happened: The existing 66 kV transmission line from the Moura substation to
    the QNP plant was found to be incapable of carrying the additional 30 MW electrolyser
    load, requiring construction of a new 132 kV line at a capital cost of $14.2M–$22.87M.
  lesson_learnt: Assess existing grid connection infrastructure capacity early in
    feasibility — the need for a new high-voltage transmission line was a significant
    capital cost item ($14–23M) and a project risk requiring early engagement with
    the network operator (Powerlink) to resolve.
