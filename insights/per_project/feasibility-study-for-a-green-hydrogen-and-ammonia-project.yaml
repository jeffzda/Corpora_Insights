- record_id: ARENA-DLV-71654
  source_title: QNP Green Ammonia Project Feasibility Study - Knowledge Sharing Report
  publish_date: 2020-06
  project_name: QNP Green Ammonia Project
  what_happened: Electrolyser vendors were found to be heavily loaded by the surge
    in hydrogen development interest globally, leading vendors to ration their response
    effort and assess the likelihood of project progression before committing to detailed
    bids. Despite this, the project received eight high-quality bids.
  lesson_learnt: Electrolyser vendor saturation is a real procurement risk for hydrogen
    projects — proponents should demonstrate project credibility and readiness early
    in the vendor engagement process to secure quality responses. Allowing sufficient
    lead time for vendor responses and signalling genuine project progression probability
    improves bid quality.
  issue_severity: minor
  project_type: industrial decarbonisation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: procurement
  proponent_type: industrial operator
  delay_category: procurement/supply chain
  failure_mode: execution & logistics
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: Despite vendor saturation the project received eight high-quality
    bids, suggesting that QNP's demonstrated project credibility and consortium strength
    (Neoen, Worley) secured strong vendor engagement.
  transferability: broad
  delay_magnitude: null
  technology_domain: hydrogen
  source_pages: &id004
  - 18
  evidence_excerpt: Vendors of electrolysers, small ammonia synthesis plants and hydrogen
    storage systems are all straining under the surge in hydrogen development interest
    and therefore are rationalising their response effort. Vendors are assessing project
    outcome likelihoods when evaluating the effort to direct to prospective projects.
    Despite this trend, this project received eight (8) high quality bids.
