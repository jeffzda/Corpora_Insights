  what_happened: The feasibility study identified several key CAPEX/OPEX trade-offs
    in electrolyser vendor offers, including efficiency versus cell life trade-offs
    and rectification system complexity versus response speed trade-offs, which had
    a material impact on the range of capital cost quotes (alkaline/PEM electrolysers
