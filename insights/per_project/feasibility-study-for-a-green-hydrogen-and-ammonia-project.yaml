  source_title: QNP Green Ammonia Project Feasibility Study - Knowledge Sharing Report
  publish_date: 2020-06
  project_name: QNP Green Ammonia Project
  what_happened: The sensitivity analysis showed that increased grant and concessional
    debt terms (17%) and a $25/t CO2e carbon credit (15%) together represent the two
    largest NPV levers for the project, cumulatively contributing 32% of total potential
