- record_id: ARENA-DLV-20726
  source_title: Demand Response Short Notice RERT Trial Year 3 Report
  publish_date: 2021-10
  project_name: DR SN RERT Trial — availability payment as customer retention mechanism
  what_happened: Participants found that availability payments to C&I customers were
    a significant motivator of participation in the trial; however, availability payments
    are not officially available under AEMO's standard Short Notice RERT arrangements,
    raising the risk that customer and participant appetite for continued SN RERT
    participation will decline after the trial-funded payments cease.
  lesson_learnt: Market design for SN RERT should incorporate availability payments
    as a standard feature to maintain C&I customer participation; program designers
    relying on trial-period availability payments to build portfolios should anticipate
    and plan for commercial model changes when subsidy-funded payments are withdrawn,
    as customer retention may be significantly reduced without them.
