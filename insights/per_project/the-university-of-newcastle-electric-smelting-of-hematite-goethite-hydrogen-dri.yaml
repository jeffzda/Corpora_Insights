  publish_date: 2025-08
  project_name: Electric Smelting of Australian Hematite-Goethite Hydrogen DRI
  what_happened: Hydrogen DRI produced from iron ore fines is pyrophoric and required
    careful handling, passivation, and vacuum sealing prior to transport and storage
    for later smelting experiments, presenting a significant materials handling and
    safety challenge for the research programme.
  lesson_learnt: Account for the pyrophoric nature of H-DRI in logistics and storage
    planning from the outset — passivation protocols and vacuum-sealed transport containers
    must be developed and validated before H-DRI is produced in batch quantities,
    as failure to do so creates safety risks and can disrupt downstream smelting experiments.
