- record_id: ARENA-DLV-53659
  source_title: UoN - Electric Smelting of Australian Hematite-Goethite Hydrogen DRI
    - Core Research Interim Report
  publish_date: 2025-08
  project_name: Electric Smelting of Australian Hematite-Goethite Hydrogen DRI
  what_happened: Scale-up from laboratory (6 kg) to pilot ESF was identified as non-trivial
    — the project team explicitly noted that simple scaling on transformer power or
    bath area is unlikely to be correct without testing at intermediate scales, due
    to complex interactions between slag electrical conductivity, FeO reduction micro-foaming,
    buoyancy-driven flows, and electromagnetic and Marangoni flows around electrodes.
  lesson_learnt: ESF scale-up cannot be reliably achieved by simple power or bath-area
    scaling — a staged scale-up programme with testing at each intermediate scale
    is necessary to characterise the active reaction zone and slag flow behaviour
    before committing to pilot plant design parameters.
