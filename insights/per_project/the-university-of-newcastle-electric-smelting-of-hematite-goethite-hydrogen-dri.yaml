  what_happened: The project demonstrated that H-DRI could be produced at 730°C from
    Australian hematite-goethite fines in a fluidised bed without encountering the
    sticking problems commonly found in fluidisation operations at high temperatures,
    achieving 80–90% metallisation in 5 kg batches.
  lesson_learnt: Operating hydrogen fluidised bed reduction of iron ore fines at 730°C
    avoids the sticking phenomenon that limits high-temperature fluidisation — this
    temperature window should be the baseline design point for future H-DRI fluidised
    bed facilities processing Australian hematite-goethite fines.
