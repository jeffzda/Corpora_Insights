- record_id: ARENA-DLV-53654
  source_title: UoN - Electric Smelting of Australian Hematite-Goethite Hydrogen DRI
    - Core Research Interim Report
  publish_date: 2025-08
  project_name: Electric Smelting of Australian Hematite-Goethite Hydrogen DRI
  what_happened: At intermediate scale (>100 kg charge) testing at RWTH Aachen, the
    furnace's supporting systems failed during the test programme, preventing further
    optimisation work from being completed. The hot metal carbon content achieved
    (2.5%) was below the steelmaking target of >3%, and subsequent additions of H-DRI
    and carburiser caused carbon content to decrease rather than increase.
  lesson_learnt: When planning intermediate-scale furnace trials at partner facilities,
    verify the reliability and maintenance status of all supporting systems — not
    just the furnace itself — before committing to an experimental campaign, and build
    contingency time for mechanical failures that halt test sequences before target
    metallurgy is achieved.
