  publish_date: 2025-08
  project_name: Electric Smelting of Australian Hematite-Goethite Hydrogen DRI
  what_happened: Operating a hydrogen fluidised bed reactor in an enclosed research
    laboratory required significant upgrades to safety systems, including hydrogen
    leak detection, automated hydrogen supply isolation, non-essential power isolation
    on leak detection, and hazardous-area-rated ventilation fans, before the facility
    could meet industry and university safety standards.
  lesson_learnt: Plan for significant safety infrastructure investment when locating
    hydrogen research equipment in enclosed workspaces — hydrogen detection, automated
    isolation, and rated ventilation are mandatory and should be scoped and funded
    at the outset, not retrofitted after installation.
