  what_happened: The laboratory-scale ESF was successfully established at an external
    industrial facility (R.L. Maintenance Welding) that provided specialised site
    power, DC transformers, certified welding technicians, baghouse off-gas extraction,
    and workshop infrastructure — capabilities not available within the university.
  lesson_learnt: For laboratory-scale electric smelting research, partnering with
    an external industrial facility that already holds high-amperage power supply,
    off-gas handling, and certified technical expertise is more practical than building
    these capabilities within a university — identify suitable industrial partners
    during facility planning, not after equipment design is locked.
