  publish_date: 2025-08
  project_name: Electric Smelting of Australian Hematite-Goethite Hydrogen DRI
  what_happened: Initial intermediate-scale ESF tests identified that the furnace
    off-gas handling system was inadequate for managing carbon monoxide produced during
    smelting reactions, creating a personnel safety hazard in the furnace workshop
    and requiring a full combustion off-gas system and cooling system to be installed
    before further tests could proceed.
  lesson_learnt: Carbon monoxide generation from ESF smelting reactions is a material
    safety hazard at intermediate and larger scales — off-gas combustion and cooling
    systems must be specified, installed, and commissioned as part of the furnace
    facility design before any smelting trials involving carbonaceous charge materials
    are conducted.
