  source_title: ANU Hydrogen Generation by Electro-Catalytic Systems Final Report
  publish_date: 2022-06
  project_name: ANU and University of Wollongong Hydrogen Generation by Electro-Catalytic
    Systems
  what_happened: The project achieved all milestones and deliverables, successfully
    demonstrating a bio-inspired, bubble-free hydrogen-generating electrolyser prototype
    at TRL 4 using Earth-abundant materials operating at near-neutral pH — confirming
    the core technical hypothesis.
  lesson_learnt: Bio-inspired catalyst design using Earth-abundant materials (MnOx,
    Ca2+, edge-functionalised graphene) can exceed the performance of noble-metal
    (Pt) catalysts for water oxidation at mild pH, offering a viable pathway to lower-cost
    green hydrogen electrolysers — this approach warrants continued investment through
    TRL 5 and beyond.
