  what_happened: At mid-term the project had not yet advanced beyond benchtop laboratory
    scale; the planned transition to prototype pilot development at the University
    of Wollongong was deferred to 2021, meaning the project remained at bench scale
    after two and a half years of a three-year programme.
  lesson_learnt: Multi-institution R&D projects that plan a sequential hand-off from
    one partner site (fundamental research) to another (prototype development) should
    build schedule float around the transition point, particularly when the upstream
    phase is subject to external disruptions; delays in the first phase compress the
    window available for pilot-scale validation.
