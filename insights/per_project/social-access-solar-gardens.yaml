  source_title: Social Access Solar Gardens for Australia
  publish_date: 2018-11
  project_name: Social Access Solar Gardens for Australia
  what_happened: Continued partnership with a committed retailer was cited by multiple
    prototype teams as a necessary condition for proceeding to pilot, indicating that
    retailer dependence is a systemic vulnerability — if the retailer partner withdraws,
    the entire business model collapses regardless of other conditions being met.
  lesson_learnt: Secure a formal retailer commitment (not just a statement of interest)
    before proceeding past concept stage; solar garden business models are structurally
    dependent on a single retail partner for billing, crediting, and customer relationships,
    making retailer withdrawal a project-ending risk.
