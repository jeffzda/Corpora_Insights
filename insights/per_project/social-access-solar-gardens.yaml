    that the technical pathway for delivering on-bill credits via existing metering
    infrastructure had not been fully resolved at project close.
  lesson_learnt: Solar garden proponents should resolve grid connection and metering
    arrangements — including confirmation that the retailer's billing system can deliver
    on-bill credits — before finalising the business model, as unresolved metering
    issues can block implementation even when legal and financial models are otherwise
    workable.
