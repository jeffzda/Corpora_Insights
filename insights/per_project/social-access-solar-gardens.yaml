- record_id: ARENA-DLV-11565
  source_title: Social Access Solar Gardens for Australia
  publish_date: 2018-11
  project_name: Social Access Solar Gardens for Australia
  what_happened: Modelling showed that allocating all solar garden output to customer
    sites (rather than retaining a portion for the management company to cover overheads)
    delivers better financial outcomes for customers, because energy has higher value
    when netted off consumption charges than when exported at wholesale-linked feed-in
    rates.
  lesson_learnt: Structure solar garden revenue models so that customers receive all
    generation output rather than reserving a share for organisational overhead; cover
    overheads through a separate fixed fee or management charge, as the energy value
    to customers consistently exceeds export revenue.
