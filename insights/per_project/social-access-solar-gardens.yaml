- record_id: ARENA-DLV-11551
  source_title: Social Access Solar Gardens for Australia
  publish_date: 2018-11
  project_name: Social Access Solar Gardens for Australia
  what_happened: Financial modelling across five prototype teams found that social
    access solar gardens are not financially viable for customers without subsidy
    — full-cost shares deliver simple paybacks of 10–16 years compared to approximately
    5 years for rooftop solar, making unsubsidised investment unattractive to the
    target market.
  lesson_learnt: Solar garden business models require capital subsidies of $2,400–$4,200
    per household to deliver returns comparable to rooftop solar; future proponents
    should design subsidy mechanisms into the model from the outset rather than treating
    them as optional.
