  publish_date: 2018-11
  project_name: Social Access Solar Gardens for Australia
  what_happened: Market research across five prototype locations found that customers'
    primary motivation for solar gardens was financial — messages emphasising electricity
    bill savings drove significantly more engagement than environmental or community-framing
    messages in initial Facebook campaigns, though community framing performed comparably
    in the second phase.
  lesson_learnt: Lead solar garden marketing communications with financial savings
    messaging (bill reduction in dollar terms); environmental and community framings
    are secondary and should be reserved for audiences already motivated by those
    values, such as higher-income or regionally-based customers.
