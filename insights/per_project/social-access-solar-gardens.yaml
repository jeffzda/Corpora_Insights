- record_id: ARENA-DLV-11555
  source_title: Social Access Solar Gardens for Australia
  publish_date: 2018-11
  project_name: Social Access Solar Gardens for Australia
  what_happened: 'The Queensland prototype team identified a specific regulatory barrier:
    Ergon Retail is currently prohibited from offering discounted electricity products,
    creating uncertainty about whether a bill credit for member shares would constitute
    a discounted rate. Additionally, the Queensland feed-in tariff is only available
    for systems under 30 kW and would require revision to cover solar gardens.'
  lesson_learnt: In Queensland, solar garden proponents must obtain explicit clarification
    from the regulator that bill credits do not constitute discounted rates under
    Ergon Retail's restrictions, and should engage with the QCA to extend FiT eligibility
    beyond 30 kW before committing to project development.
