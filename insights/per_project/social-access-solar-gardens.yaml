  what_happened: The project found that the solar garden business model has a degree
    of complexity — legal structuring, retailer relationships, billing system changes,
    site feasibility, and regulatory compliance — that may be out of reach for smaller
    community organisations without specialist support, suggesting that an aggregation
    or platform co-operative model could increase scalability across the sector.
  lesson_learnt: Establish a platform co-operative or aggregation entity to provide
    shared legal, administrative, and retailer relationship services to local solar
    garden co-operatives; without such a vehicle, the model is unlikely to scale beyond
    well-resourced community organisations, excluding many communities that would
    benefit most.
