- record_id: ARENA-DLV-11554
  source_title: Social Access Solar Gardens for Australia
  publish_date: 2018-11
  project_name: Social Access Solar Gardens for Australia
  what_happened: Legal research by Norton Rose Fulbright found no legal or regulatory
    barriers to social access solar gardens in Australia, and confirmed that a generator
    licence is not required for projects under 5 MW, a retail licence is not required
    (as the participating retailer holds one), and that third-line forcing and AFSL
    requirements are not obstacles in most cases.
  lesson_learnt: Proponents of community solar garden models do not need to obtain
    a generator licence (sub-5 MW), retail licence, or AFSL in most cases; structuring
    the entity as a co-operative with a separate SPV development vehicle is the recommended
    approach to manage liability and simplify regulatory compliance.
