- record_id: ARENA-DLV-11564
  source_title: Social Access Solar Gardens for Australia
  publish_date: 2018-11
  project_name: Social Access Solar Gardens for Australia
  what_happened: Financial modelling demonstrated that solar garden operational costs
    are proportionally very high for small (sub-MW) systems because a significant
    proportion of costs are fixed overheads; this makes small-scale projects economically
    unviable without very high subsidies.
  lesson_learnt: Solar garden projects need to be in the megawatt rather than kilowatt
    scale to spread fixed operational overheads across enough customers; proponents
    should target at minimum 1 MW capacity to achieve viable per-customer economics
    before seeking investment or subsidy commitments.
