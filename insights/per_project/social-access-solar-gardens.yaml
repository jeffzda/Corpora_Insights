  what_happened: Subsidies in the range of $2,400–$4,200 per household were found
    to be sufficient to make solar gardens viable, with upfront purchasers receiving
    a 7-year average payback and lease customers an average 16% bill reduction — outcomes
    broadly comparable to subsidised rooftop solar.
  lesson_learnt: Equivalent subsidies to those provided for rooftop solar (via STCs
    and state rebates) would make solar gardens viable for all locked-out consumers;
    policy designers should explicitly include solar gardens in existing support frameworks
    rather than creating entirely new programs.
