  source_title: Social Access Solar Gardens for Australia
  publish_date: 2018-11
  project_name: Social Access Solar Gardens for Australia
  what_happened: Low-income households were found to be unable to participate in solar
    gardens under an upfront purchase model; they can only engage through a subscription
    or lease model where there is no initial capital cost, and they require a bill
    reduction of approximately 20% to find the product worthwhile.
  lesson_learnt: Design solar garden products for low-income participants exclusively
    around zero-upfront lease or subscription models; any model requiring upfront
    capital will exclude the most vulnerable target customers regardless of the level
    of return.
