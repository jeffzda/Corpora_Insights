  source_title: Social Access Solar Gardens for Australia
  publish_date: 2018-11
  project_name: Social Access Solar Gardens for Australia
  what_happened: Market research found very little appetite among standard solar garden
    customers for paying a small premium to cross-subsidise low-income participation;
    cross-subsidy was of little interest to most research participants when directly
    asked.
  lesson_learnt: Do not rely on voluntary cross-subsidy from standard customers to
    fund low-income access; external subsidy from government or philanthropic sources
    is the only reliable mechanism for funding low-income participation in solar gardens.
