  publish_date: 2014-08
  project_name: PRIME PLC Evaluation (Energex)
  what_happened: Energex trialled PRIME PLC (Power Line Carrier) technology on its LV networks to assess its performance as a communications medium for smart grid edge network applications. Initial results
    showed sufficient performance to merit further testing, including optimisation and testing at additional sites.
  lesson_learnt: Power line carrier technology can serve as a viable edge-network communications medium for smart grid applications on standard LV networks, but requires staged testing — initial performance
    assessment should be followed by optimisation trials and diagnostic tool development before broad deployment.
