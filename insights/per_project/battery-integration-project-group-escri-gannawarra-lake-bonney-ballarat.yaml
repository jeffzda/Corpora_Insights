- record_id: ARENA-DLV-25908
  source_title: Review of ARENA's Reliability Portfolio
  publish_date: 2020-01
  project_name: Battery Integration Project Group (ESCRI, Gannawarra, Lake Bonney,
    Ballarat)
  what_happened: Large-scale battery storage demonstration projects across the portfolio
    collectively identified a set of unresolved regulatory barriers that restricted
    extraction of full commercial value, including hybrid registration of assets as
    generator and load, lack of long-term certainty for marginal loss factors, TUOS
    charge treatment, cost allocation methodology, and grid connection transparency
    for proposed projects.
  lesson_learnt: Large-scale battery storage projects should be scoped to generate
    regulatory precedent as a deliberate project output, not just operational data;
    funders should require proponents to document regulatory barriers encountered
    and engage market rule bodies during the project to progress rule changes in parallel
    with demonstration.
