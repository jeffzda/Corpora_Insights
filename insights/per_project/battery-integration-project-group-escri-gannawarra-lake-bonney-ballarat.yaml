  evidence_excerpt: 'The regulatory barriers that restrict the integration of battery
    storage are significant, indicating that further development of the body of knowledge
    would assist in realising any affordability impacts... many of the regulatory
    issues remain unsolved such as: hybrid registration of assets as a generator and
    a load; lack of long term certainty for Marginal Loss Factors (MLFs); augmentation
    of existing markets to enable services provided by batteries to be monetised.'
