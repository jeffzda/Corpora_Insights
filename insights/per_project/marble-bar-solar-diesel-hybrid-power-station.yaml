- record_id: ARENA-DLV-23908
  source_title: Australia's Off-Grid Clean Energy Market Research Paper
  publish_date: '2014-10-08'
  project_name: Marble Bar Solar-Diesel Hybrid Power Station
  what_happened: Horizon Power commissioned a solar-diesel hybrid power station at Marble Bar in May 2010 at a capital cost of $16 million (including the diesel units), incorporating a 1.28MW diesel plant,
    302kW solar tracking system, and a 500kW flywheel energy storage system. The system successfully supplied 30% of the community's energy from solar, with instantaneous peaks of up to 92% solar penetration.
  lesson_learnt: A flywheel energy storage system is an effective enabling technology in solar-diesel hybrid systems to manage power quality and system stability, allowing high instantaneous solar penetrations
    without compromising reliability — the Marble Bar installation reduced average outage duration from 38 minutes to 8 minutes per year.
