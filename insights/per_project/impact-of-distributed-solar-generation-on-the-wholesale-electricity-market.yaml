  publish_date: '2014'
  project_name: Impact of Distributed Solar Generation on the Wholesale Electricity
    Market
  what_happened: Melbourne Energy Institute built an improved electricity market model
    to better quantify the Merit Order Effect of distributed solar PV, but found the
    improved model did not substantially contribute to or improve upon the initial
    work and still contained the same shortcomings.
  lesson_learnt: Invest in validating model improvements against the original before
    committing to a full research cycle — a more sophisticated model does not automatically
    produce better or more actionable outputs, and may replicate the limitations of
    predecessor work.
