- record_id: ARENA-DLV-14971
  source_title: 'Looking Forward: Barriers, Risks and Rewards of the Australian Geothermal
    Sector to 2020 and 2030'
  publish_date: 2014-06
  project_name: Hijiori EGS Project (Japan)
  what_happened: During the long-term circulation test at Hijiori (2000–2002), production
    well HDR-2a cooled dramatically from 163°C to approximately 100°C — significantly
    more than predicted by numerical modelling — and the test was halted due to the
    temperature drop, which was attributed to thermal short-circuiting between the
    deep and shallow reservoirs.
  lesson_learnt: Thermal drawdown in EGS reservoirs can occur faster than numerical
    models predict, particularly when deep and shallow reservoir zones are inadvertently
    connected; well spacing should be maximised, and operators must be prepared to
    halt production if drawdown rates exceed model predictions rather than assuming
    recovery.
