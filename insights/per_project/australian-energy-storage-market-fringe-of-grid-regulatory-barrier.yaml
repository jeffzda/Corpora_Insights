- record_id: ARENA-DLV-16264
  source_title: Energy Storage Study
  publish_date: 2015-07
  project_name: Australian Energy Storage Market — Fringe-of-Grid Regulatory Barrier
  what_happened: DNSPs in Australia had no regulatory incentive to propose islanding
    or microgrid solutions for consumers located at the end of long, unreliable fringe-of-grid
    lines, even where energy storage combined with embedded generation could provide
    a cheaper and more reliable solution than network maintenance or augmentation.
  lesson_learnt: Regulatory frameworks must provide an explicit pathway and incentive
    for NSPs to propose islanding solutions for fringe-of-grid customers; without
    this, commercially and technically superior storage-enabled microgrid options
    will not be offered regardless of their merit.
