- record_id: ARENA-DLV-15809
  source_title: Evaluation of ARENA's Impact and Effectiveness
  publish_date: 2019-11
  project_name: ARENA Regional Australia's Renewables (RAR) Initiative
  what_happened: Two RAR grant recipients confirmed their projects would not have proceeded without the grant and would not have been financially viable without ARENA funding. One recipient noted the lack
    of private sector willingness to fund projects of this nature; another stated they would have needed to scale back significantly without the funding.
  lesson_learnt: For fringe-of-grid and off-grid renewable projects in regional Australia, ARENA grant funding is often the critical enabling condition for project viability — private capital markets will
    not finance these projects without a government anchor investor, so funding program design should recognise this as a market gap rather than a subsidy.
