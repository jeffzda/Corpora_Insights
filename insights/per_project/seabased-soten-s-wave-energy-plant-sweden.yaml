- record_id: ARENA-DLV-50017
  source_title: Ocean Energy Report by Seanergy and Ernst and Young
  publish_date: 2016-06
  project_name: Seabased Sotenäs Wave Energy Plant, Sweden
  what_happened: Seabased, operator of the Sotenäs Project described as the world's
    largest wave energy plant (10 MW target), faced significant financial issues that
    led to the cancellation of EUR 8.9 m in investment in 2016. The company was simultaneously
    expanding to new markets including Ghana while struggling to raise short-term
    capital.
  lesson_learnt: Wave energy developers should not pursue multi-market expansion while
    their home project remains in a capital-raising phase; the combination of technology
    risk, construction obligations and geographic expansion simultaneously creates
    a capital demand that early-stage companies are unable to service, leading to
    investment cancellation and project delays.
