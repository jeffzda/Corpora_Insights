- record_id: ARENA-DLV-25754
  source_title: Next Generation Electric Bus Depot Lessons Learnt 1
  publish_date: '2022-05-05'
  project_name: Next Generation Electric Bus Depot
  what_happened: During operations, most downtime issues with the electric buses were
    caused by driver error — primarily collisions and improper stowage of charging
    cables after use, which led to charging guns being run over and damaged. A gap
    was identified in that stowage of cables was not covered in training delivered
    by either the bus operators or bus manufacturers.
  lesson_learnt: Driver training for electric bus fleets must explicitly include charging
    cable stowage procedures. Install physical cable hooks on chargers and depot signage
    as engineered controls, and address cable management at the initial design and
    procurement stage rather than retrofitting solutions after operational issues
    emerge.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: research organisation/university
  delay_category: commissioning/integration
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: execution & logistics
  intervention_note: Cable hooks were installed on the back of chargers and signage
    was added to remind drivers to stow charging guns properly after use.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: EV
  source_pages:
  - 7
  - 16
  - 17
  evidence_excerpt: Most downtime issues with electric buses in our experience and
    in relation to this project are caused by user error and insufficient driver training.
    Issues can be caused by several factors the chief amongst are collisions and improper
    stowage of charging cables after use, leading to charging guns being run over
    and getting damaged.
