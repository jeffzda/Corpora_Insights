  source_title: 'Next Generation Electric Bus Depot: Final Report'
  publish_date: '2023-04-30'
  project_name: Next Generation Electric Bus Depot
  what_happened: Contract finalisation took longer than expected because negotiating
    risk allocation between the project recipients, the bus operator, and the transport
    authority — particularly for risks such as grid outages and supply chain constraints
    caused by weather, pandemic or conflict — proved complex and time-consuming.
  lesson_learnt: Allow significantly more time for the Term Sheet phase to agree risk
    allocation between all parties before proceeding to formal documentation. Public
    tenders should clearly specify risk allocation upfront, as different operators
    and jurisdictions have varying appetites for bearing particular risks such as
    grid outages and supply chain disruption.
