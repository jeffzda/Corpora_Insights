- record_id: ARENA-DLV-24963
  source_title: 'Next Generation Electric Bus Depot: Final Report'
  publish_date: '2023-04-30'
  project_name: Next Generation Electric Bus Depot
  what_happened: The electric bus fleet at Leichhardt demonstrated an average net
    energy consumption rate of 1.12 kWh/km over 2,067,368 km, with significant variation
    between 0.86 and 1.54 kWh/km driven by temperature, route, and operational factors
    including seasonal HVAC load.
  lesson_learnt: When sizing charging infrastructure for future electric bus depots,
    model worst-case energy consumption at the top end of the observed range (up to
    ~1.54 kWh/km in Australian conditions) rather than average figures — the range
    between best and worst day is nearly 80% and is driven by temperature, routes
    and driver behaviour.
