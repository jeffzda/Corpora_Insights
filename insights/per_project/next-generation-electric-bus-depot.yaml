  source_title: 'RouteZero: User Guide and Knowledge Sharing Report'
  publish_date: 2022-11
  project_name: Next Generation Electric Bus Depot Project — RouteZero Tool
  what_happened: The case study showed that an on-site depot battery delivered a much
    larger peak grid demand reduction when charging was restricted to nighttime (800
    kW reduction, from 3,730 kW to 2,939 kW) than when charging was unrestricted (191
    kW reduction, from 1,968 kW to 1,768 kW). The larger benefit arose because nighttime-only
    charging allowed sufficient time for the on-site battery to fully recharge, whereas
    unrestricted bus charging left only short windows for on-site battery recharge
    and these were insufficient.
  lesson_learnt: On-site depot batteries should be evaluated in conjunction with charging
    time restrictions — their grid demand reduction benefit is conditional on having
    sufficient time to recharge the stationary battery. Where bus charging is continuous
    or near-continuous, an on-site battery provides limited peak demand benefit and
    may not justify its capital cost; the benefit is maximised when charging windows
    create clear off-peak periods for stationary battery recharge.
