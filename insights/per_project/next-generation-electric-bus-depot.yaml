  what_happened: Regenerative braking on the electric bus fleet recovered approximately
    40% of net energy consumption (average regeneration rate of -0.59 kWh/km), with
    the rate trending upward over time as drivers became more proficient, demonstrating
    that driver competence significantly influences fleet energy efficiency.
  lesson_learnt: Driver proficiency in exploiting regenerative braking has a material
    impact on fleet energy consumption and charging infrastructure requirements; monitoring
    of regeneration rates should be built into fleet management from day one, and
    driver training should specifically focus on smooth deceleration techniques.
