- record_id: ARENA-DLV-25755
  source_title: Next Generation Electric Bus Depot Lessons Learnt 1
  publish_date: '2022-05-05'
  project_name: Next Generation Electric Bus Depot
  what_happened: Across the project, interoperability challenges and production and
    installation delays arose due to low industry maturity and limited shared understanding
    among government bodies, bus operators, and technology suppliers of the operational,
    planning, and environmental differences between an EV depot and a conventional
    bus depot.
  lesson_learnt: Government, operators, and technology suppliers must work collaboratively
    from the outset to address interoperability challenges and manage production and
    installation delays. Industry education — including knowledge-sharing workshops
    and formal lessons-learnt reporting — is needed to accelerate the transition and
    reduce friction on subsequent EV depot projects.
