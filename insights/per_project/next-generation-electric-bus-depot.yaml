  outcome_class: delayed but recoverable
  secondary_failure_mode: poor scoping
  intervention_note: The project team used a collaborative approach and proactively
    sought feedback from stakeholders, keeping everyone informed of progress and challenges
    to manage the impact of weather delays.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: EV
  source_pages:
  - 6
  - 12
  - 16
  evidence_excerpt: Severe wet weather has been a constant issue due during the build
    of the project. Many of the build items are electrical and are outside in the
    elements. Wet weather at these exposed sites can severely limit the ability to
    install and commission electrical equipment which has led to delays.
