  what_happened: The case study of 40 Newcastle bus routes found that restricting
    electric bus charging to nighttime only (6pm–6am) more than doubled peak grid
    power demand (from 1,968 kW to 3,730 kW) and increased the required bus fleet
    from 93 to 150 vehicles compared to unrestricted charging, because buses could
    not be recharged during the day to meet daytime trip energy requirements.
  lesson_learnt: Fleet electrification planners should evaluate the impact of charging
    time restrictions carefully before imposing night-only charging — restricting
    charging windows can substantially increase both peak grid demand and the number
    of buses required, with significant capital cost implications. Off-peak daytime
    charging windows (e.g. 10am–3pm) can resolve otherwise infeasible charging scenarios
    without requiring a larger fleet.
