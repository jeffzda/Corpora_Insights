- record_id: ARENA-DLV-24956
  source_title: 'Next Generation Electric Bus Depot: Final Report'
  publish_date: '2023-04-30'
  project_name: Next Generation Electric Bus Depot
  what_happened: Development approval from Council for the depot electrification works
    required engagement of third-party experts and involved multiple assessments (Environmental
    Impact Assessment, Noise and Vibration Impact Assessment, vegetation offset plans,
    community consultation), making the process time-consuming.
  lesson_learnt: Even for electrification works on private bus depot land, engage
    relevant planning authorities at the earliest stage of project development to
    understand all required studies and assessments and keep them informed of any
    scope, location or design changes that may trigger new requirements — this should
    run in parallel with project scoping and design.
