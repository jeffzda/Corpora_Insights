- record_id: ARENA-DLV-37502
  source_title: 'RouteZero: User Guide and Knowledge Sharing Report'
  publish_date: 2022-11
  project_name: Next Generation Electric Bus Depot Project — RouteZero Tool
  what_happened: Bus telemetry data provided by Zenobe recorded battery state of charge
    in whole integer percentages only. For the buses used, this equated to increments
    of 3.68–4.22 kWh, introducing a measurement uncertainty of ±1.84–2.11 kWh per
    trip. For the majority of short trips that used only 1–5% state of charge, this
    created a relative measurement error of ±10–50%, substantially degrading data
    quality for model training.
  lesson_learnt: When procuring or specifying telemetry data for model development,
    require sub-integer state-of-charge resolution — whole-integer recording is insufficient
    for energy consumption modelling on short urban trips, where the quantisation
    error can exceed 50% of the trip's actual energy use. Specify minimum data resolution
    requirements in data-sharing agreements before bus operations commence.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: data/validation/testing
