  source_title: 'RouteZero: User Guide and Knowledge Sharing Report'
  publish_date: 2022-11
  project_name: Next Generation Electric Bus Depot Project — RouteZero Tool
  what_happened: GTFS data — the publicly available feed used as the basis for RouteZero's
    route analysis — contains no information about which individual bus operates which
    trip or in what sequence. This made it impossible to optimise or even determine
    the charging schedule of individual buses, requiring the team to reformulate the
    depot charging optimisation problem around aggregate fleet battery state rather
    than individual vehicle schedules.
  lesson_learnt: Planning tools for electric bus depot charging should not assume
    availability of individual bus scheduling data — publicly available GTFS feeds
    contain only trip timetables, not vehicle assignments. Design the charging optimisation
    around aggregate fleet capacity from the outset, and validate that this aggregate
    approach remains adequate for the fleet sizes and route configurations of interest
    (it degrades in accuracy for very small fleets).
