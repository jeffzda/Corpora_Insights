- record_id: ARENA-DLV-24952
  source_title: 'Next Generation Electric Bus Depot: Final Report'
  publish_date: '2023-04-30'
  project_name: Next Generation Electric Bus Depot
  what_happened: Severe and prolonged wet weather in NSW — including heavy rain and
    floods — during construction caused significant disruptions to the project timeline
    because many build items involve electrical equipment that cannot be safely installed
    or commissioned in exposed outdoor conditions.
  lesson_learnt: When building at an exposed depot site — which describes most Australian
    bus depots — contracts should include explicit provision for extension of time
    due to severe weather events (floods, thunderstorms, prolonged wet spells) to
    avoid construction and commissioning programme overruns.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: demonstration
  lifecycle_phase: construction/installation
  proponent_type: research organisation/university
