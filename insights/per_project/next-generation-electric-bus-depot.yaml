    multiple controllers needing careful configuration and bespoke software development
    involving significant input from the Zenobē UK team for testing and validation,
    making the process complex and time-consuming — FCAS had not been fully operationalised
    by the end of the reporting period.
  lesson_learnt: Grid ancillary service integration (e.g. FCAS) from a depot BESS
    requires early engagement with network providers and the market operator for approvals
    and licensing, and should be scoped with adequate time for bespoke software development
    and multi-controller configuration — this should not be treated as a simple add-on
    to the charging system.
