- record_id: ARENA-DLV-25751
  source_title: Next Generation Electric Bus Depot Lessons Learnt 1
  publish_date: '2022-05-05'
  project_name: Next Generation Electric Bus Depot
  what_happened: During initial construction at the Leichhardt Bus Depot (a brownfield
    site), unexpected underground services were encountered that had not been detected
    during scanning, including plastic irrigation pipes and sewer lines for which
    drawings were unavailable. This caused unplanned disruptions to civil and electrical
    works.
  lesson_learnt: On brownfield depot sites, comprehensive service scanning must be
    included in the contracting process from the outset and should cover building
    services, lighting, and zones of influence — not just underground utilities. Engage
    an EPC/D&C contractor responsible end-to-end and build in contingency time and
    budget for undetectable services such as plastic pipes.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: demonstration
  lifecycle_phase: construction/installation
  proponent_type: research organisation/university
  delay_category: construction/installation
  failure_mode: poor scoping
  outcome_class: delayed but recoverable
  secondary_failure_mode: execution & logistics
  intervention_note: Close collaboration between the project team and stakeholders
    allowed issues to be resolved; comprehensive scanning was recommended to be embedded
    in the contracting process from the outset for future projects.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: EV
  source_pages:
  - 6
  - 15
  - 16
  evidence_excerpt: 'Service scanning shouldn''t be limited to underground services
    especially for old brownfield sites; it should be comprehensive, consider the
    high-level design and include: building services, lights, consider zones of influence.
    Some services can''t be detected such as irrigation plastic pipes, sewer, these
    need inspections after the high-level designs. Drawings and knowledge of underground
    services are not always available as current depots are usually old.'
  confidence_note: Canonical record merged from 2 source records across 2 document(s).
