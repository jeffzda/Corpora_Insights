  source_title: 'RouteZero: User Guide and Knowledge Sharing Report'
  publish_date: 2022-11
  project_name: Next Generation Electric Bus Depot Project — RouteZero Tool
  what_happened: The energy consumption model was trained exclusively on bus performance
    data from Sydney's inner west (Leichhardt depot), resulting in a dataset with
    narrow operating ranges — temperatures 7–26°C, gradients −1.8% to 1.8%, stop density
    >2/km, and average speeds <30 km/h. Application of the model to routes outside
    these conditions (e.g. Darwin heat, Hobart cold or hills, rural low-density routes)
    constitutes extrapolation with reduced confidence.
  lesson_learnt: When developing a data-driven tool intended for national application,
    ensure training data covers the full range of conditions the tool will encounter
    — a dataset drawn from a single urban depot will systematically underperform for
    routes with different climatic, topographic, or operational characteristics. Future
    deployments should supplement training data with performance records from diverse
    operating environments before claiming broad applicability.
