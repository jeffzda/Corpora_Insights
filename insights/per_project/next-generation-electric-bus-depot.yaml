  what_happened: The RouteZero tool was successfully developed as a publicly accessible
    web application that allows any user — without specialised technical knowledge
    — to assess electric bus route feasibility and depot charging infrastructure requirements
    for routes across Australia, using only publicly available GTFS data and a small
    number of user-specified parameters. The tool was delivered as part of the first
    large-scale electric bus deployment in Australia (40 buses, Leichhardt depot).
  lesson_learnt: Designing modelling tools around publicly available data sources
    (GTFS timetables, NASA elevation data, historical temperature records) rather
    than proprietary operational data enables broad deployment and reuse beyond the
    originating project — future EV fleet electrification studies should assess whether
    similar open-data-anchored design patterns can replace bespoke data collection
    requirements.
