  project_name: Next Generation Electric Bus Depot
  what_happened: During maintenance in August 2022, the team discovered hot joints
    in one of the BYD chargers, caused by loose electrical cable connections resulting
    from a product defect. Loose connections had caused heat damage to the charger.
  lesson_learnt: All electrical cable connections in EV charging infrastructure should
    be torqued to manufacturer specifications and marked once tightened; thermal imaging
    should be used as part of quality assurance during commissioning and routine maintenance
    to detect loose connections before they cause damage — this process should be
    embedded in both installation and maintenance inspection and test plans.
