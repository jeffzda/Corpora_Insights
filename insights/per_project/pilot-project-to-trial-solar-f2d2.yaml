  what_happened: Soiling levels were found to vary from array to array even within
    the same solar farm section at Gatton, indicating that uniform cleaning schedules
    applied across an entire farm would be suboptimal.
  lesson_learnt: Large solar farms should implement array-specific soiling monitoring
    and cleaning schedules rather than uniform whole-farm regimes — spatial variation
    in soiling across adjacent arrays means blanket cleaning wastes resources or leaves
    high-soiling arrays underserved.
