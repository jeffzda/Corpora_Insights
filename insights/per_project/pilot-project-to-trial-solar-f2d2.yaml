  project_name: Pilot Project to Trial Solar F2D2
  what_happened: Solar F2D2 detected that 5–10% of power production at Gatton Solar
    Farm was lost due to soiling, despite the site receiving good annual rainfall
    — meaning rainfall-based cleaning schedules were insufficient to maintain yield.
  lesson_learnt: Solar farm O&M teams should not rely on rainfall as a proxy for panel
    cleanliness; array-specific soiling diagnostics are needed to schedule cleaning
    efficiently, particularly because soiling levels vary between adjacent arrays
    and thin dirt deposits are invisible to visual inspection.
