  what_happened: Solar F2D2 estimated that approximately 25% of strings and 10% of
    panels within each array at Gatton were producing below 50% of their expected
    output — far exceeding the <2% annual reduction specified by panel manufacturers.
  lesson_learnt: Panel underperformance in operational solar farms can be substantially
    higher than manufacturer specifications predict; solar farm operators should establish
    regular array-level diagnostic procedures to detect and remediate hidden underperformance
    that protection devices and visual inspection will not flag.
