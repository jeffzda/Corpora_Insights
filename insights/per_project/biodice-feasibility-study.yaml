- record_id: ARENA-DLV-11508
  source_title: BioDICE Feasibility Study Final Report
  publish_date: 2021-02
  project_name: BioDICE Feasibility Study
  what_happened: At the outset of the project, a 500-hour nozzle wear test using a
    full injector was planned. However, neither Moore SuperHard (China) nor Oxford
    Instruments could manufacture a ceramic nozzle to fit the injector due to commercial
    pressures and rationalisation of services, requiring a redesigned simplified disc-type
    nozzle test program.
  lesson_learnt: Only polycrystalline diamond (PCD) is a viable nozzle material for
    direct-injection carbon engines using biochar slurry fuels — cobalt-bonded tungsten
    carbide and sialon are unsuitable due to rapid wear. PCD nozzles should be specified
    from the outset for any DICE demonstration or commercial engine.
