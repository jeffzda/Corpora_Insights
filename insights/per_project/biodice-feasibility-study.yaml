- record_id: ARENA-DLV-11519
  source_title: BioDICE Feasibility Study Final Report
  publish_date: 2021-02
  project_name: BioDICE Feasibility Study
  what_happened: The dispatchability premium for bioDICE electricity in the NEM was
    assessed using AEMC 2020 data for South Australia, where wind dispatch-weighted
    prices were approximately 70% lower than the firming/dispatchable price. The base
    case used a $119/MWh electricity price ($70/MWh base + 70% dispatchability premium),
    underpinning project viability.
  lesson_learnt: Dispatchable bioenergy projects should explicitly model and capture
    the dispatchability premium in electricity price assumptions — in high-renewable-penetration
    markets like South Australia the premium has averaged 70% and is growing. Projects
    that model only the wholesale spot price will understate revenue and return.
