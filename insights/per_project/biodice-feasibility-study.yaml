- record_id: ARENA-DLV-11516
  source_title: BioDICE Feasibility Study Final Report
  publish_date: 2021-02
  project_name: BioDICE Feasibility Study
  what_happened: Cotton gin waste and whole saltbush were investigated as alternative
    biomass sources for bioDICE but found to be unsuitable due to ash contents of
    10–18% (cotton gin) and 18–29% (whole saltbush). However, the woody stems and
    trunks of saltbush were found to have ash content of only ~3%, making them potentially
    suitable and opening a significant new biomass source for semi-arid marginal land.
  lesson_learnt: Alternative biomass feedstock screening for DICE should separately
    analyse leaf and stem fractions — whole-plant ash content is not representative
    of the usable woody fraction. Saltbush stems are viable for bioDICE while the
    high-ash leaf fraction can be diverted to fodder, enabling a multi-revenue-stream
    business model on marginal land.
