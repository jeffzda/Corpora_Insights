- record_id: ARENA-DLV-11504
  source_title: BioDICE Feasibility Study Final Report
  publish_date: 2021-02
  project_name: BioDICE Feasibility Study
  what_happened: Torrefaction at temperatures of 270–300°C (standard torrefaction
    range) produced poor quality fuel with high grinding energy, and the project was
    unable to source 1 tonne of commercially torrefied material. The planned approach
    was abandoned in favour of low-temperature carbonisation at 320–350°C, which produced
    markedly better fuel properties and grinding characteristics.
  lesson_learnt: 'Bioenergy projects using biomass slurry fuels should target low-temperature
    carbonisation (325–350°C) rather than standard torrefaction (270–300°C): grinding
    energy drops dramatically above 310–320°C, condensibles can be reincorporated
    into the fuel, and overall fuel cycle efficiency is higher. Torrefaction at 270–300°C
    is not a viable pathway for direct-injection engine fuel.'
  issue_severity: major
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: procurement
  proponent_type: research organisation/university
  delay_category: procurement/supply chain
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Procured 700 kg of high-temperature E.cladocalyx char (600°C)
    from Green Man Char NSW as a practical fallback, which was deemed an acceptable
    proxy given experimental evidence that diverse biomass species produce similar
    fuel properties.
  transferability: moderate
