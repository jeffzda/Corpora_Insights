  source_title: BioDICE Feasibility Study Final Report
  publish_date: 2021-02
  project_name: BioDICE Feasibility Study
  what_happened: Combustion testing of eucalyptus biochar MRC (650°C char — the worst
    case for ignition) showed ignition delay and combustion characteristics slightly
    inferior to brown coal MRC, requiring approximately 55°C higher charge temperature.
    However, results confirmed that lower-temperature biochar (recommended at 350°C)
    should perform comparably to brown coal, which has already been demonstrated in
    engine operation.
  lesson_learnt: Biochar produced at high temperatures (600–650°C) requires higher
    cylinder charge temperatures for reliable ignition in DICE; lower-temperature
    chars (320–350°C) are preferred because their higher volatile content gives shorter
    ignition delays. Engine design should target charge temperatures of at least 600°C
    at injection for reliable biochar combustion.
