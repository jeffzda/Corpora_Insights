- record_id: ARENA-DLV-11501
  source_title: BioDICE Feasibility Study Final Report
  publish_date: 2021-02
  project_name: BioDICE Feasibility Study
  what_happened: The forest waste sample provided by Forico from Tasmanian operations
    was unusable for DICE fuel due to excessive dirt, bark, and high leaf content,
    resulting in ash contents up to 22 wt% — far above acceptable limits. This forced
    substitution of the planned feedstock throughout injection and engine tests.
  lesson_learnt: Forest waste intended for DICE must be selectively harvested woody
    residues only — log dump material and bark-heavy harvest residue are unsuitable
    without aggressive pre-processing. Shredding at the fell site and debarking before
    forwarding are essential to limit dirt and ash contamination.
