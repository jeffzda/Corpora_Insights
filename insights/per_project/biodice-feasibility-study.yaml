  source_title: BioDICE Feasibility Study Final Report
  publish_date: 2021-02
  project_name: BioDICE Feasibility Study
  what_happened: Sensitivity analysis of the bioDICE business case across a 9 MWe
    plant showed a base-case discounted cash flow rate of return (DCRR) of 10.1% and
    a cost of electricity of $96/MWh. All sensitivity cases exceeded the 7% hurdle
    rate except the high biomass cost scenario ($5/GJ). The maximum viable biomass
    cost was $4.30/GJ. The business case is most sensitive to electricity price and
    CO₂ value, not capital cost.
  lesson_learnt: BioDICE project economics are most sensitive to electricity selling
    price (including dispatchability premium) and CO₂ abatement value, not capital
    cost — proponents should prioritise securing offtake arrangements with dispatchability
    premiums and CO₂ credits rather than focusing exclusively on reducing capex. Biomass
    feed costs above $4.30/GJ at base conditions are project-breaking.
