  source_title: BioDICE Feasibility Study Final Report
  publish_date: 2021-02
  project_name: BioDICE Feasibility Study
  what_happened: The project had difficulty obtaining accurate cost data for carboniser
    and torrefier plant due to industry fragmentation, limited literature on recent
    torrefaction plants, and technology providers' reluctance to share cost data due
    to IP concerns. Cost estimates were therefore based on published academic sources
    and grey literature, with significant uncertainty.
  lesson_learnt: Cost estimation for novel bioenergy plant (particularly char production
    plant) is hampered by supplier IP sensitivity and limited public data — future
    feasibility studies should budget for direct industry engagement and may need
    to use concept-level engineering estimates rather than relying on literature benchmarks.
    Contingency allowances of at least 10% should be applied.
