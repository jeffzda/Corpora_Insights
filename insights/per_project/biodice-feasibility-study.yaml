  source_title: BioDICE Feasibility Study Final Report
  publish_date: 2021-02
  project_name: BioDICE Feasibility Study
  what_happened: 'The timber/forestry industry showed very negative views of torrefaction
    and biomass power generation in general, citing the lack of a demonstration plant
    as the primary barrier to interest. No committed industry co-development partners
    were secured, creating a classic chicken-and-egg impasse: industry will not invest
    without a demonstration, but a demonstration is difficult to build without industry
    commitment.'
  lesson_learnt: For first-of-a-kind bioenergy technologies like bioDICE, a demonstration
    plant is a prerequisite for securing industry co-developers — broad stakeholder
    engagement and positive feasibility results alone are insufficient to overcome
    industry scepticism. ARENA funding for a demonstration plant is likely required
    to break the impasse.
