  source_title: BioDICE Feasibility Study Final Report
  publish_date: 2021-02
  project_name: BioDICE Feasibility Study
  what_happened: The technology readiness level of bioDICE was assessed at TRL 4–5
    for most technical aspects at project completion. The team identified that demonstrating
    at near-commercial scale (3 MWe) is unusual for an emerging technology — DICE
    has the advantage of being able to conduct a near-commercial scale demonstration
    at a relatively small physical and financial scale.
  lesson_learnt: For piston-engine-based bioenergy technologies, the ability to run
    near-commercial scale demonstration at 3 MW provides a significant de-risking
    advantage compared to boiler or turbine technologies that require much larger
    demonstration scale. ARENA funding strategy should exploit this characteristic
    to progress DICE from TRL 5 to TRL 8 at lower cost than comparable thermal plant
    demonstrations.
