  what_happened: Capital cost estimates for a 9 MWe integrated bioDICE plant were
    derived at $26.7M ($3.0M/MWe), with the char plant (dryer and carboniser) comprising
    54% of total costs and the engines and generators comprising 35%. This compared
    favourably to boiler-steam turbine (~double the capex) and gasifier-gas turbine
    (~triple the capex) alternatives at similar scale.
  lesson_learnt: BioDICE plant economics are dominated by char plant costs (54% of
    capex), not engine costs — cost reduction efforts should focus on modular skid-based
    dryer and carboniser design and localised construction rather than engine procurement.
    The economic advantage over competing biomass technologies is primarily driven
    by the higher thermal efficiency of diesel engines at small scale.
