- record_id: ARENA-DLV-11522
  source_title: BioDICE Feasibility Study Final Report
  publish_date: 2021-02
  project_name: BioDICE Feasibility Study
  what_happened: Simplified LCA showed that each tonne of forest waste processed through
    bioDICE could generate 0.94 MWh of electricity, displacing up to 1,150–1,230 kg
    CO₂/tonne of forest waste when replacing brown coal generation in Victoria. CO₂
    savings were found to be almost entirely dependent on the generation technology
    being displaced rather than the bioDICE process itself.
  lesson_learnt: BioDICE CO₂ abatement value is highly context-dependent and should
    be calculated against the specific displaced generation — the case is strongest
    where coal generation is being replaced (~1,200 kg CO₂/tonne) and weakest where
    NGCC is displaced (~400 kg CO₂/tonne). LCA boundary conditions and displaced-fuel
    assumptions must be clearly stated in project business cases.
