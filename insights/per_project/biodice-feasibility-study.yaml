- record_id: ARENA-DLV-11506
  source_title: BioDICE Feasibility Study Final Report
  publish_date: 2021-02
  project_name: BioDICE Feasibility Study
  what_happened: Biochar slurry fuels produced mould colonies within 2–5 days of preparation.
    A commercial biocide (Grotan) was ineffective, with mould reappearing within 2
    weeks. This presented a significant fuel stability problem and OH&S risk for any
    commercial deployment.
  lesson_learnt: Standard commercial biocides are not effective for controlling microbial
    growth in biochar-based MRC slurries. Adding torrefaction condensibles (at ≥10%
    of dry char weight) back into the slurry completely eliminates microbial activity
    and provides >500 days of stability — this should be the standard approach for
    biochar slurry fuel formulation.
