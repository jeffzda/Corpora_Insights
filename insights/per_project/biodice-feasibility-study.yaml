- record_id: ARENA-DLV-11521
  source_title: BioDICE Feasibility Study Final Report
  publish_date: 2021-02
  project_name: BioDICE Feasibility Study
  what_happened: MRC slurry fuels can form gel-sol (a semi-rigid, plasticine-like
    plug) in fuel handling systems at sharp flow-area contractions and in fuel strainers,
    blocking the system within minutes. This phenomenon had not been previously reported
    in the literature and represents a previously unidentified risk for any MRC-based
    fuel system.
  lesson_learnt: MRC fuel handling and injection systems must be designed without
    sharp area contractions or dead-recirculation zones to prevent gel-sol formation
    — this is a previously unrecognised failure mode that can block an MRC fuel system
    within 3 minutes. A twin-pump circulation system with no conventional pressure-relief
    valves is the recommended design approach.
  issue_severity: moderate
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Developed a twin positive-displacement pump circulation system
    that maintains fuel flow and eliminates stagnant pockets, and a pulse screening
    system to avoid conventional filter blockage.
  transferability: narrow
