  what_happened: Small laboratory mills (gemstone tumbler, Isamill at small scale)
    produced unrealistically long grinding times and extremely high grinding energy
    estimates for torrefied char, leading to unnecessary additional torrefaction and
    milling tests and delaying fuel characterisation progress.
  lesson_learnt: Grinding energy characterisation for bioenergy slurry fuels requires
    representative mill scales — results from very small laboratory mills are not
    predictive of commercial-scale performance and will systematically overestimate
    grinding energy. A Bond Work Index mill or similarly scaled equipment should be
    used from the outset.
