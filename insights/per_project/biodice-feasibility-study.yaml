  source_title: BioDICE Feasibility Study Final Report
  publish_date: 2021-02
  project_name: BioDICE Feasibility Study
  what_happened: Mass and energy balance modelling of three plant integration configurations
    showed that overall thermal efficiency varied from 34.8% (full heat integration,
    Case 1) to 24.8% (no integration, Case 3). The 10 percentage point difference
    is attributable solely to the use of engine waste heat for drying and torrefaction,
    demonstrating that close coupling is critical to economic viability.
  lesson_learnt: BioDICE plants must be closely heat-integrated with the biomass processing
    front end (dryer and carboniser) to achieve competitive thermal efficiency — distributed
    or separated fuel and generation plants reduce efficiency from ~35% to ~25% LHV,
    substantially increasing the cost of electricity.
