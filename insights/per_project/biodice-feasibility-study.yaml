- record_id: ARENA-DLV-11510
  source_title: BioDICE Feasibility Study Final Report
  publish_date: 2021-02
  project_name: BioDICE Feasibility Study
  what_happened: Abrasive wear testing (modified HFRR) demonstrated that biomass char
    ash acts as an anti-scuff lubricant, producing 30% lower metal loss than clean
    lubricating oil and far less wear than Hunter black coal ash (which caused 10×
    higher wear). This finding was counter to initial concern that ash would accelerate
    cylinder wear.
  lesson_learnt: Biomass char ash is anti-scuff rather than abrasive — unlike high-quartz
    black coal ash — because it lacks hard silica minerals. Cylinder wear for bioDICE
    is expected to be low from combustion of clean biomass; the primary wear risk
    is from entrained dirt contamination in the feedstock, not from biomass ash itself.
