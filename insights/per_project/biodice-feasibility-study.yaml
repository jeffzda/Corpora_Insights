- record_id: ARENA-DLV-11509
  source_title: BioDICE Feasibility Study Final Report
  publish_date: 2021-02
  project_name: BioDICE Feasibility Study
  what_happened: A 40-hour engine fouling test using doped diesel fuel (simulating
    biomass ash chemistry) showed only minor fouling with clear evidence of periodic
    deposit sloughing on the piston and head. However, the inlet fumigation method
    caused severe salt encrustation around the inlet valve, causing valve leakage
    and artificially elevated inlet valve temperatures — an artefact of the experimental
    method rather than a true fuel behaviour.
  lesson_learnt: If doped-fuel fouling tests are used to simulate biomass ash combustion
    in DICE, all inorganic additives should be injected directly into the cylinder
    with the fuel rather than via inlet air fumigation — salt fogging into the inlet
    causes unrepresentative encrustation and valve leakage that distorts results.
    Valve rotation is essential to prevent ash from plating onto valve seats.
