- record_id: ARENA-DLV-47902
  source_title: ENGIE - Future Fuels Public Fast Charging - Lessons Learnt 2
  publish_date: 2022-09
  project_name: Future Fuels Public Fast Charging
  what_happened: ENGIE experienced manufacturing delays with EVCS orders caused primarily
    by constrained supply of electronic components such as PCBs sourced from Asia,
    compounded by geopolitical disruption to global supply chains affecting European
    manufacturers.
  lesson_learnt: Diversify EVCS supplier base to include manufacturers with lower
    trade-risk exposure and better access to Asian electronics supply chains, and
    establish long-term call-off agreements with existing suppliers so production
    capacity can be pre-allocated — both measures reduce schedule exposure when a
    single supply chain is disrupted.
