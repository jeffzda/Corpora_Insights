- record_id: ARENA-DLV-56106
  source_title: ENGIE Future Fuels Public Fast Charging Lessons Learnt 1
  publish_date: 2022-05
  project_name: ENGIE Future Fuels Public Fast Charging
  what_happened: ENGIE found that no standardised contactless payment solution existed
    for public EV fast charging in Australia during the project period; most charge
    point operators relied on individualised mobile apps or RFID cards due to limited
    direct OCPP hardware integration with payment platforms.
  lesson_learnt: EV charging network developers should factor the absence of a standardised
    contactless payment solution into their customer experience design and conduct
    a market assessment early to identify available payment integrations — current
    fragmentation (app/RFID-only) represents a barrier to mainstream EV driver adoption
    and operators should plan for this to evolve.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: commercial expansion
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: ENGIE undertook a market assessment to understand customer payment
    preferences and the availability of contactless payment solutions, and applied
    a technology-agnostic approach to identify the best available option for the Australian
    market.
  transferability: moderate
  delay_magnitude: null
  technology_domain: EV
  source_pages: &id006
  - 6
  evidence_excerpt: Due to the early stage of the EV charging market in Australia,
    there is currently no standardised system for contactless payment. Majority of
    payment method for CPOs in Australia is via individualised mobile apps or RFID
    cards. This is primarily due to there being limited payment solution that provides
    direct integration with EV hardware OCPP.
  confidence_note: failure_mode set to regulatory misfit as the gap is a market/standards
    maturity issue rather than a technical underperformance; secondary design assumption
    failure reflects that the project may have assumed more payment standardisation
