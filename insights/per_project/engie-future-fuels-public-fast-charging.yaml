  outcome_class: delayed but recoverable
  secondary_failure_mode: null
  intervention_note: ENGIE engaged its global procurement hub to identify alternative
    manufacturers with lower trade risk and improved access to Asian electronics,
    and established long-term call-off agreements with existing suppliers to pre-allocate
    production capacity.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: EV
