  source_title: ENGIE Future Fuels Public Fast Charging Lessons Learnt 1
  publish_date: 2022-05
  project_name: ENGIE Future Fuels Public Fast Charging
  what_happened: ENGIE identified that sites requiring multiple EV chargers or complex
    electrical loads (e.g. shopping centres) needed integration between OCPP-based
    EV charging systems and Building Management Systems (BMS), and found significant
    technical challenges in achieving this integration, with no standardised solution
    available.
  lesson_learnt: Project developers deploying EV charging at sites with complex loads
    or multiple chargers should conduct early technical assessment of BMS-to-OCPP
    integration requirements and pre-select a load management technology approach
    — proprietary, third-party hardware, or API-based — before committing to hardware,
    as integration complexity is a known barrier and solutions are not standardised.
