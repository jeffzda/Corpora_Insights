- record_id: ARENA-DLV-47903
  source_title: ENGIE - Future Fuels Public Fast Charging - Lessons Learnt 2
  publish_date: 2022-09
  project_name: Future Fuels Public Fast Charging
  what_happened: Installation of DC fast chargers at brownfield CBD car park sites
    was constrained by height, weight, and space limitations, with site hosts reluctant
    to sacrifice parking spaces or permit civil works such as conduit laying in active
    car parks, complicating site selection and installation design.
  lesson_learnt: Advocate for conduit provision to be included during any planned
    renovation or construction works at prospective car park sites — retrofitting
    conduit in active brownfield sites is the primary installation constraint, and
    pre-provisioning largely eliminates it. Charger selection should also be tailored
    site-by-site to minimise civil works requirements.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: commercial expansion
  lifecycle_phase: construction/installation
  proponent_type: project developer
  delay_category: construction/installation
  failure_mode: poor scoping
  outcome_class: delayed but recoverable
  secondary_failure_mode: coordination & stakeholders
  intervention_note: ENGIE resolved constraints on a site-by-site basis through careful
    charger selection to fit within space limits, and is working with site hosts and
    partners to ensure conduit provision is incorporated into future renovation works
    at car park locations.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: EV
  source_pages:
  - 4
  - 28
  evidence_excerpt: Many of these are underground and/or quite restricted in terms
    of layout and spacing... In CBD car park locations where site hosts are reluctant
    to sacrifice car parking spaces to allow for the installation of charging stations.
    Further challenges also arise from site hosts being reluctant to allow civil works
    such as laying conduit in active car park locations.
  confidence_note: Transferability assessed as moderate — the lesson is specific to
    brownfield urban car park deployments but broadly applicable across any EV charging
    rollout targeting existing built infrastructure. Canonical record merged from
    2 source records across 2 document(s).
