- record_id: ARENA-DLV-56101
  source_title: ENGIE Future Fuels Public Fast Charging Lessons Learnt 1
  publish_date: 2022-05
  project_name: ENGIE Future Fuels Public Fast Charging
  what_happened: ENGIE's pre-project commercial modelling assumed modest EV policy
    intervention and constrained supply prioritisation to higher-incentive markets.
    Actual Australian EV adoption exceeded modest forecasts, with wait times for top
    models exceeding 6 months and greater-than-expected market growth driven by Tesla,
    SIAC, and new entrants, creating emerging congestion risk at urban fast-charging
    sites.
  lesson_learnt: Commercial modelling for EV charging networks should build in upside
    EV adoption scenarios and include provision for site expansion capacity from the
    outset — urban sites in particular risk congestion under higher-than-forecast
    adoption, and retrofitting expansion is slower and costlier than designing for
    it initially.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: commercial expansion
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: commercial & market
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: ENGIE identified two mitigation pathways — installing additional
    stations in new regions and expanding capacity at existing high-utilisation sites
    — with a preference for designing future sites with expansion capability built
    in.
  transferability: broad
  delay_magnitude: null
  technology_domain: EV
  source_pages: &id001
  - 2
  - 3
  evidence_excerpt: This increase in model availability combined with increased interest
    in EV's has led to greater than expected growth in the market... urban charging
    networks face the prospect of high levels of congestion over the medium term at
    high utilisation sites.
  confidence_note: issue_severity set to moderate — no schedule delay but material
    commercial assumption failure with operational consequence; outcome_class re-scoped/adapted
    as ENGIE revised its network expansion approach.
