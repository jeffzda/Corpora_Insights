- record_id: ARENA-DLV-47901
  source_title: ENGIE - Future Fuels Public Fast Charging - Lessons Learnt 2
  publish_date: 2022-09
  project_name: Future Fuels Public Fast Charging
  what_happened: No unified Australian standard exists for metering of DC EV charging
    systems, and application of metering has been inconsistently applied across sites
    and site electrical networks. EV charging equipment selected for the program incorporated
    MID metering (a European standard), but NMI pattern metering requirements in Australia
    remained unclear and potentially subject to future regulatory change, creating
    uncertainty about compliance obligations.
  lesson_learnt: Include provision for NMI pattern metering upstream of the EVCS at
    the supply connection point in addition to any metering built into the charger
    itself — this provides flexibility to meet current requirements under embedded
    network rules and positions the installation to comply with any future NMI trade-measurement
    policy without rework.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: commercial expansion
  lifecycle_phase: construction/installation
  proponent_type: project developer
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: ENGIE revised its standard installation design to include NMI
    pattern metering upstream of the EVCS as a default provision, providing a pathway
    to meet both existing and potential future metering requirements.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: EV
  source_pages:
  - 2
  - 25
  evidence_excerpt: ENGIE specifically referred to the lack of a unified charging
    station metering standard in Australia... ENGIE proactively installed their charging
    sites to meet the European measuring instruments directive (MID) metering standards,
    which they expected to guide future NMI standards. The company also installed
    NMI pattern meters upstream of sites to future-proof them if standards change.
  confidence_note: Severity assessed as moderate — regulatory ambiguity required design
    rationalisation and rework of installation standard but no quantified schedule
    or cost impact was stated. Canonical record merged from 2 source records across
    2 document(s).
