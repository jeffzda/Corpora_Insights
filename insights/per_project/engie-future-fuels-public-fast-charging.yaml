  source_title: ENGIE Future Fuels Public Fast Charging Lessons Learnt 1
  publish_date: 2022-05
  project_name: ENGIE Future Fuels Public Fast Charging
  what_happened: Future funding programs for urban EV charging networks did not initially
    include provisions for site expansion at existing stations, limiting the ability
    to rapidly address congestion as utilisation grew beyond forecasts.
  lesson_learnt: Future EV charging funding programs should explicitly include provision
    for site expansion at existing stations — not only new site construction — so
    that operators can rapidly address congestion at high-utilisation urban sites
    without reapplying for separate funding.
