- record_id: ARENA-DLV-56104
  source_title: ENGIE Future Fuels Public Fast Charging Lessons Learnt 1
  publish_date: 2022-05
  project_name: ENGIE Future Fuels Public Fast Charging
  what_happened: COVID-19 restrictions during 2021 and early 2022 disrupted ENGIE's
    planned rollout of 103 charging sites across four regions, causing travel restrictions,
    staff shortages due to mandatory quarantine, and difficulties onboarding new team
    members who joined in a remote-working environment.
  lesson_learnt: Large multi-site EV charging rollouts should build digital workflow
    tools — including digital site audits, remote desktop assessments, and site screening
    tools — from programme inception rather than reactively, as these tools materially
    improve site conversion rates and reduce dependency on physical site access and
    travel.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: commercial expansion
  lifecycle_phase: construction/installation
  proponent_type: utility/energy retailer
  delay_category: stakeholder/land/community
  failure_mode: execution & logistics
  outcome_class: re-scoped/adapted
  secondary_failure_mode: coordination & stakeholders
  intervention_note: ENGIE and delivery partner JET Charge developed a digital site
    audit tool, a site screening and prioritisation tool using public and proprietary
    datasets, and desktop assessment protocols using online collaboration tools —
    achieving a site conversion rate above 80% during lockdown periods.
