  evidence_excerpt: 'our analyses delivered a surprising finding: that perovskite
    cells, even when they are not damaged by reverse bias exposure, could still take
    a long time to return to their normal operating characteristics following reverse
    bias... Even short exposure to non-destructive reverse bias, measuring in minutes,
    can require periods extending to hours to fully recover.'
