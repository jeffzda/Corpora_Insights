- record_id: ARENA-DLV-37753
  source_title: ANU - New Materials - Perovskite modules that are stable under real
    world conditions
  publish_date: 2023-05
  project_name: Perovskite modules that are stable under real-world conditions (2020/RND008)
  what_happened: At project commencement, partial shading and its reverse-bias effects
    on perovskite cells had received little research attention despite being ubiquitous
    in real-world deployments. Existing literature showed perovskite cells were easily
    damaged by reverse bias but the degradation mechanisms were poorly understood,
    leaving no clear design pathway to address the problem.
  lesson_learnt: For early-stage solar materials research to be commercially relevant,
    the research agenda must explicitly target real-world operating stresses — particularly
    partial shading — even when these conditions are under-studied. Gaps in the research
    literature on prevalent field conditions represent a material commercialisation
    risk that should be identified and scoped at project inception.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: lab/bench
  lifecycle_phase: concept/feasibility
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: poor scoping
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Project was specifically scoped to address this gap, resulting
    in design guidelines for reverse-bias-tolerant perovskite cells and a theoretical
    framework for understanding degradation mechanisms.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id003
  - 4
  evidence_excerpt: At the commencement of this project, partial shading – and the
    strong 'reverse bias' voltages it can lead to in perovskite cells, had received
    little attention from the research community, despite its ubiquitous nature in
    the real world... many of the degradation mechanisms were not well understood,
    and there was no clear pathway to address this problem.
