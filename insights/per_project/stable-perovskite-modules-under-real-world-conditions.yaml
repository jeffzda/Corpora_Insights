    complementary findings — EPFL investigated hot spot formation mechanisms while
    ANU focused on recovery behaviour and cell structure solutions — enabling the
    project to address both structural stability and dynamic energy-yield aspects
    of reverse-bias tolerance within the same project scope.
  lesson_learnt: Structuring research collaborations so that partner groups pursue
    distinct but complementary sub-problems — rather than parallel replication — can
    yield broader project outcomes within the same budget and timeline; this requires
    deliberate scoping of each partner's focus at project design.
