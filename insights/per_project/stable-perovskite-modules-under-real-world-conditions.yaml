- record_id: ARENA-DLV-37751
  source_title: ANU - New Materials - Perovskite modules that are stable under real
    world conditions
  publish_date: 2023-05
  project_name: Perovskite modules that are stable under real-world conditions (2020/RND008)
  what_happened: Research into reverse-bias tolerance in perovskite solar cells uncovered
    an unexpected dual problem — beyond structural damage, even non-destructive reverse
    bias exposure caused cells to exhibit slow power recovery lasting minutes to hours,
    significantly reducing energy yield from affected and adjacent cells during recovery
    periods. This finding was not anticipated at project outset.
  lesson_learnt: When characterising perovskite cell stability under real-world stress
    conditions, assess both structural damage resistance and dynamic power recovery
    behaviour independently — cells that survive reverse bias without damage can still
    substantially suppress energy yield during recovery, and optimising for one does
    not guarantee the other.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: lab/bench
  lifecycle_phase: development/design
