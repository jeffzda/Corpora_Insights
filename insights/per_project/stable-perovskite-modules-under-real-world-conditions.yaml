- record_id: ARENA-DLV-37752
  source_title: ANU - New Materials - Perovskite modules that are stable under real
    world conditions
  publish_date: 2023-05
  project_name: Perovskite modules that are stable under real-world conditions (2020/RND008)
  what_happened: EPFL's analysis of reverse-bias degraded perovskite devices found
    that contaminants such as dust particles were frequently responsible for the development
    of destructive hot spots, suggesting that reverse-bias damage in perovskite cells
    is not an inherent material property but a process-control issue.
  lesson_learnt: Process cleanliness and contamination control during perovskite cell
    fabrication are critical to achieving real-world reverse-bias stability — hot
    spot formation driven by contaminants implies that manufacturing quality controls,
    not just cell design, are a key lever for commercial-scale stability.
