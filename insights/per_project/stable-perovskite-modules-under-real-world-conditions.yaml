- record_id: ARENA-DLV-37755
  source_title: ANU - New Materials - Perovskite modules that are stable under real
    world conditions
  publish_date: 2023-05
  project_name: Perovskite modules that are stable under real-world conditions (2020/RND008)
  what_happened: Despite successfully demonstrating reverse-bias-tolerant perovskite
    cell structures and producing design guidelines, the project concluded that further
    work is needed to expand and refine these guidelines before the technology can
    support commercial-scale perovskite module deployment, indicating the research
    outputs alone are insufficient to close the commercialisation gap.
  lesson_learnt: Lab-scale demonstration of a stable perovskite cell design does not
    constitute a complete commercialisation pathway — follow-on work to expand design
    guidelines, validate at module scale, and address remaining stability conditions
    (temperature, humidity) should be scoped and funded concurrently with dissemination
    to avoid momentum loss between research phases.
