- record_id: ARENA-DLV-54806
  source_title: AECOM - Electrifying Road Freight Report
  publish_date: '2024'
  project_name: Electrifying Road Freight - Pathways to Transition
  what_happened: The average freight vehicle age in Australia is over 14 years, with
    large rigid trucks having the longest hold times. Smaller vehicles cycle more
    like the national passenger fleet (around 10 years). Larger operators replace
    fleets roughly every five years, while smaller operators buy used vehicles and
    hold them longer, creating a cascading second-hand market that preserves fleet
    ecosystem competition.
  lesson_learnt: Align electrification incentives and infrastructure rollout with
    fleet replacement cycles rather than mandating premature replacement — a poorly
    coordinated transition could create infrastructure bottlenecks, underutilise new
    technologies, and force operators to replace vehicles before end-of-life, increasing
    costs and market disruption.
