  what_happened: Victoria's generation capacity shows a healthy gap against maximum
    demand up to 2028, contingent on approval of new large-scale renewables projects.
    From 2029, the gap narrows significantly and demand may outstrip in-state generation
    in the early 2030s without additional investment, though NEM interconnection with
    neighbouring states provides partial mitigation.
  lesson_learnt: Infrastructure delivery timelines for freight electrification in
    Victoria must be sequenced against large-scale renewable project approval milestones
    — delays in approving planned generation projects create a credible supply risk
    from 2029 onward, and planners should not assume NEM interconnection will fully
    compensate for in-state generation shortfalls.
