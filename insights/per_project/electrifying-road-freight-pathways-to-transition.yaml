  source_title: AECOM - Electrifying Road Freight Report
  publish_date: '2024'
  project_name: Electrifying Road Freight - Pathways to Transition
  what_happened: Western Australia's generation data in the modelling shows a severe
    drop-off after 2026 because the dataset includes fossil fuel power station closures
    but excludes any future generation projects beyond committed ones. This creates
    a misleading picture of supply adequacy for WA's WEM network when assessing EV
    freight demand impacts.
  lesson_learnt: When conducting grid impact assessments for EV freight in Western
    Australia, explicitly account for the gap between committed and probable/planned
    generation — datasets that only include committed projects while modelling fossil
    fuel retirements will systematically understate future supply and produce unreliable
    capacity adequacy conclusions.
