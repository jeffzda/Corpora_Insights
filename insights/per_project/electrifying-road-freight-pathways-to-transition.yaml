  project_name: Electrifying Road Freight - Pathways to Transition
  what_happened: Light commercial vehicle BEV purchase price parity with ICE equivalents
    was predicted by some analysts as early as 2023, but this had not occurred at
    the time of the study. Prices for BEV LCVs have continued to drop and may reach
    parity in the near future, while larger vehicle classes (rigid trucks, articulated
    trucks) face comparatively greater pricing and availability gaps versus ICE equivalents.
  lesson_learnt: Do not use optimistic vehicle cost parity timelines as the basis
    for freight electrification policy or infrastructure delivery schedules — LCV
    parity has been repeatedly delayed, and heavy vehicle parity remains further away;
    program design should be robust to slower-than-forecast vehicle market development,
    particularly for articulated trucks.
