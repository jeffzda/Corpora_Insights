  evidence_excerpt: The increase in renewable generation creates a difference in the
    capacity and actual generation available. Currently, fossil fuelled generation
    like gas fired power plants can quickly increase in generation up to the total
    capacity value when required. Renewable sources of electricity do not have the
    same ability as they are limited in their generation by the availability of the
    renewable resource. When this occurs in conjunction with maximum demands on the
    network this can cause shortfalls even though the capacity is much higher.
