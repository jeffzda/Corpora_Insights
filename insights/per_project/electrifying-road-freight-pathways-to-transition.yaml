  source_title: AECOM - Electrifying Road Freight Report
  publish_date: '2024'
  project_name: Electrifying Road Freight - Pathways to Transition
  what_happened: National energy generation forecasts show sufficient supply to meet
    electrified freight demand under modelled scenarios, but a degree of capacity
    tightening is projected in the mid-2030s. Available generation data extends only
    to 2034, meaning post-2034 projections are extrapolated with minimal assumed investment
    — an underestimate of likely actual investment.
  lesson_farnt: Do not rely on current generation forecasts beyond 2034 for freight
    electrification infrastructure planning — the data gap creates a misleading picture
    of post-2034 supply adequacy, and infrastructure design should assume continued
    generation investment while planning for grid connection and distribution network
    constraints as the binding variable.
  lesson_learnt: Do not rely on current generation forecasts beyond 2034 for freight
    electrification infrastructure planning — the data gap creates a misleading picture
    of post-2034 supply adequacy, and infrastructure design should assume continued
    generation investment while planning for grid connection and distribution network
    constraints as the binding variable.
