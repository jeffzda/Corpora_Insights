  what_happened: South Australia's proposed charging hubs on northbound and westbound
    highways connecting to Darwin and Perth currently lack connection to any local
    electricity grid. Both routes are targeted for later staging, but the absence
    of grid access means interim solutions will need to be identified and developed
    during the planning period before those stages are reached.
  lesson_learnt: For charging hubs on remote interstate corridors with no existing
    grid connection, initiate planning for off-grid or connection solutions in parallel
    with staging decisions rather than deferring to later phases — the lead time for
    grid extension or off-grid renewable installation on routes like Adelaide–Darwin
    and Adelaide–Perth is long enough that planning must start early.
