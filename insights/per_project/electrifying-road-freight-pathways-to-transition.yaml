- record_id: ARENA-DLV-54803
  source_title: AECOM - Electrifying Road Freight Report
  publish_date: '2024'
  project_name: Electrifying Road Freight - Pathways to Transition
  what_happened: With a median profit margin of only 2% across the road freight industry
    and 98% of operators being SMEs (70% with only one truck), the industry has very
    limited capacity to bear the upfront capital costs of BEV vehicles and associated
    charging infrastructure, despite the operational cost efficiencies BEVs can offer.
  lesson_learnt: Freight electrification programs must include targeted financial
    support mechanisms for small operators — transition plans that rely solely on
    market-led fleet upgrades will fail to reach the dominant SME segment, which cannot
    self-fund the capital cost differential of BEV acquisition.
