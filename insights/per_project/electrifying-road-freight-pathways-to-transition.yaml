  what_happened: The primary freight movement data source used in this study — the
    ABS Survey of Motor Vehicle Use 2020 — was discontinued after 2020, meaning the
    most recent nationally consistent dataset was four years old at the time of the
    study. Other relevant data from ABS, BITRE, and NHVR covers different and overlapping
    aspects of road freight without integration, limiting analytical precision.
  lesson_learnt: Freight electrification planning is materially constrained by data
    gaps — invest in reinstating recurring nationally consistent freight movement
    data collection and aligning ABS, BITRE, and NHVR datasets before committing to
    localised infrastructure programs, as current data limitations undermine the reliability
    of route-level and site-level analysis.
