  what_happened: Secondary freight routes serving inland, regional, or isolated communities
    have minimal existing infrastructure, and facilitating electrical supply to these
    locations is a significant challenge that may require connections to be staged
    for future upgrade waves. Remote charging hubs in Western Australia and the Northern
    Territory are particularly affected, with some sites 150–250 km from existing
    infrastructure.
  lesson_learnt: Remote and secondary route charging hubs should be explicitly staged
    as later-phase infrastructure and paired with local renewable energy generation
    and storage solutions — attempting to extend grid connections to locations 150+
    km from existing infrastructure is cost-prohibitive and should not block early-stage
    network delivery.
