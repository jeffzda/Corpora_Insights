  project_name: Electrifying Road Freight - Pathways to Transition
  what_happened: Freight nodes (intermodal terminals, ports, airports) represent major
    charging opportunities given extended vehicle dwell times, but are operated by
    third parties who do not directly operate freight vehicles and may not see commercial
    benefit from providing BEV charging infrastructure. Client sites where freight
    vehicles spend extended time also present charging opportunities but are often
    leased, requiring landlord engagement.
  lesson_learnt: Charging infrastructure programs at freight nodes and client sites
    must engage third-party site owners and operators with tailored commercial models
    — without direct financial benefit or regulatory obligation, these parties have
    no incentive to invest in charging equipment, and their sites will remain a lost
    charging opportunity.
