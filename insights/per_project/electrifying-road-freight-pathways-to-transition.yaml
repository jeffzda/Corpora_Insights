  publish_date: '2024'
  project_name: Electrifying Road Freight - Pathways to Transition
  what_happened: Most higher-power charging facilities in Australia are physically
    designed to accommodate smaller passenger vehicles, presenting an additional physical
    and design barrier to use by larger freight trucks. Charging infrastructure development
    to date has not adequately accounted for the physical dimensions and power requirements
    of heavy freight vehicles.
  lesson_learnt: Freight charging infrastructure must be designed from the outset
    for heavy vehicle physical dimensions and power requirements — retrofitting or
    co-locating freight chargers at passenger-oriented charging stations is likely
    to be operationally unworkable without significant redesign.
