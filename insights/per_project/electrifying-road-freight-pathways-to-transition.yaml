- record_id: ARENA-DLV-54804
  source_title: AECOM - Electrifying Road Freight Report
  publish_date: '2024'
  project_name: Electrifying Road Freight - Pathways to Transition
  what_happened: Australian Design Rules (ADR) weight limitations do not provide any
    special consideration for the additional weight of onboard batteries in BEVs without
    an extraordinary exemption. As BEV variants often have a greater gross vehicle
    mass than equivalent ICE models, this can require drivers to hold more advanced
    licences, creating operational and regulatory barriers to BEV adoption.
  lesson_learnt: Engage with the National Heavy Vehicle Regulator and relevant state
    licensing authorities before deploying electric freight fleets — ADR weight rules
    and licence class thresholds can unintentionally disqualify BEV models or require
    operator retraining, and regulatory relief should be sought before fleet transition
    begins.
