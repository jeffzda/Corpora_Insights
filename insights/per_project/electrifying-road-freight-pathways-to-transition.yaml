  what_happened: Charging hubs located at seaports, airports, intermodal terminals,
    rail lines, or mine sites often operate private electricity networks. Delivery
    of charging hubs in these locations requires coordination between the charging
    hub operator, the supplying NSP (responsible for capacity upgrades to the point
    of connection), and the site owner (responsible for internal upgrades and load
    management).
