  what_happened: Each network service provider (NSP) in Australia has different rules
    and requirements for EV charger connection, and different methods and speeds for
    managing new technology connections. This diversity presents challenges in providing
    a nationally consistent methodology for fast EV charger connection, adding complexity
    and risk to charging hub delivery programs.
  lesson_learnt: Freight charging hub developers must engage each relevant NSP individually
    and early — there is no nationally consistent connection process for fast EV chargers,
    and assuming a standard approach across states will lead to programme delays as
    varying NSP requirements are discovered after site commitment.
