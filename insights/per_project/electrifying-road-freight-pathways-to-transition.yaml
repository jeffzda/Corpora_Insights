- record_id: ARENA-DLV-54829
  source_title: AECOM - Electrifying Road Freight Report
  publish_date: '2024'
  project_name: Electrifying Road Freight - Pathways to Transition
  what_happened: An estimated 165 dedicated freight charging hubs will be required
    nationally to support an electrified road freight industry, distributed across
    all states and territories. Of these, 10 are in isolated (off-grid) locations
    and 7 are in remote locations, with the greatest concentration of challenging
    sites in Western Australia (4 isolated, 1 remote) and the Northern Territory (3
    isolated, 3 remote).
  lesson_learnt: Infrastructure pipeline planning for freight electrification should
    ring-fence the 17 remote and isolated charging hub locations as requiring fundamentally
    different delivery models — these sites cannot be delivered under standard grid-connected
    hub procurement and will require bespoke off-grid renewable energy solutions,
    with significantly longer planning and delivery lead times.
