- record_id: ARENA-DLV-54826
  source_title: AECOM - Electrifying Road Freight Report
  publish_date: '2024'
  project_name: Electrifying Road Freight - Pathways to Transition
  what_happened: The transition to renewable generation introduces a material difference
    between installed capacity and actual available generation compared to fossil-fuelled
    generation, which can rapidly dispatch to nameplate capacity. When high renewable
    penetration coincides with maximum demand events, shortfalls can occur even when
    total capacity appears sufficient — a risk relevant to grid adequacy assessments
    for EV freight charging.
  lesson_learnt: Grid impact assessments for freight electrification must account
    for renewable generation intermittency, not just installed capacity — apparent
    capacity adequacy under high renewable scenarios can mask real-time supply shortfalls
    during peak demand events, and this risk should be explicitly modelled when siting
    high-demand charging hubs.
