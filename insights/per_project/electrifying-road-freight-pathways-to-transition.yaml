  source_title: AECOM - Electrifying Road Freight Report
  publish_date: '2024'
  project_name: Electrifying Road Freight - Pathways to Transition
  what_happened: Isolated communities not connected to the wider grid currently rely
    on diesel generators. Installing EV charging hubs in these communities could be
    counterproductive to decarbonisation goals until the underlying diesel generation
    dependency is resolved. Several communities in Queensland, Western Australia,
    and the Northern Territory fall into this category.
  lesson_farnt: Do not deploy EV charging infrastructure in grid-isolated communities
    until diesel generation has been replaced with renewable energy — charging EVs
    from diesel-powered microgrids increases rather than reduces emissions, and isolated
    community charging programs must be sequenced after off-grid renewable transition.
  lesson_learnt: Do not deploy EV charging infrastructure in grid-isolated communities
    until diesel generation has been replaced with renewable energy — charging EVs
    from diesel-powered microgrids increases rather than reduces emissions, and isolated
    community charging programs must be sequenced after off-grid renewable transition.
