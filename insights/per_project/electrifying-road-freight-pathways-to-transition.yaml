- record_id: ARENA-DLV-54807
  source_title: AECOM - Electrifying Road Freight Report
  publish_date: '2024'
  project_name: Electrifying Road Freight - Pathways to Transition
  what_happened: Megawatt Charging Systems (MCS) capable of greater than 1 MW charge
    rates have not yet been deployed in Australia, despite being in initial demonstration
    and early deployment phases overseas. Current top-end commercially available output
    in Australia is approximately 350 kW (ultra-fast chargers), with 229 such locations
    nationally — insufficient for heavy articulated truck charging needs on long-haul
    routes.
  lesson_learnt: Australia must develop and deploy megawatt charging infrastructure
    as a prerequisite for interstate and intrastate freight electrification — current
    ultra-fast charging infrastructure is oriented toward passenger vehicles and cannot
    support heavy truck duty cycles at the scale or power level required.
