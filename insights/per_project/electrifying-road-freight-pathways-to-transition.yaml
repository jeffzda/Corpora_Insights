- record_id: ARENA-DLV-54828
  source_title: AECOM - Electrifying Road Freight Report
  publish_date: '2024'
  project_name: Electrifying Road Freight - Pathways to Transition
  what_happened: The ABS light commercial vehicle category includes utility vehicles
    that may be conducting personal rather than freight trips, but the study included
    all LCVs as a single consolidated vehicle class due to difficulty in segmenting
    freight-specific use and to provide a conservative stress test on grid capacity.
    This overstates EV freight energy demand in LCV modelling.
  lesson_learnt: When modelling EV freight energy demand at a national level, be explicit
    about LCV classification limitations and their directional effect on results —
    including personal-use vehicles inflates demand estimates, which is appropriate
    for a stress test but will overstate infrastructure requirements if used directly
    for investment sizing.
