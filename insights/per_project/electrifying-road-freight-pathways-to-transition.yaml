  what_happened: The study was conducted at a national and state level only, with
    vehicle movement data from counters and GPS used at a high level. Exact vehicle
    numbers at selected charging locations were not identified or forecast to 2040,
    and the study explicitly notes that future work will be required to further refine
    and determine localised demand before charging hub delivery can be committed.
  lesson_learnt: A national-level freight electrification assessment is an insufficient
    basis for committing individual charging hub locations — localised demand analysis,
    detailed site investigation, and corridor-level route studies are required before
    infrastructure investment decisions can be made, and these should be explicitly
    funded as a pre-delivery workstream.
