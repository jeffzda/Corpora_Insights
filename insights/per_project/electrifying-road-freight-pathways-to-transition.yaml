  what_happened: The study found that urban shared charging hubs and regional highway
    charging demonstration projects could be delivered within 1–2 years, providing
    an immediate opportunity to develop delivery knowledge, test operational integration,
    and demonstrate viability to the broader market before full-scale rollout.
  lesson_learnt: Prioritise rapidly deployable urban shared charging and regional
    highway demonstration projects as the first wave of freight electrification infrastructure
    investment — early delivery generates the operational and project delivery learnings
    needed to de-risk the larger infrastructure pipeline, and provides visible market
    signals that can accelerate private investment.
