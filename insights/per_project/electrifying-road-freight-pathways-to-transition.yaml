  source_title: AECOM - Electrifying Road Freight Report
  publish_date: '2024'
  project_name: Electrifying Road Freight - Pathways to Transition
  what_happened: Stakeholders identified that even where vehicle and infrastructure
    costs can be reduced, if BEV charging solutions do not align with the operational
    realities of freight operations (charging times, vehicle uptimes, route patterns),
    adoption will remain limited. Operational limitations ranked low in initial stakeholder
    discussions but consistently emerged as a key concern in deeper conversations.
  lesson_learnt: Design freight charging infrastructure around operational requirements
    — charging locations and timing must slot into existing freight schedules rather
    than require operators to adapt workflows. Pilot projects should test operational
    integration before wide deployment to surface alignment gaps early.
