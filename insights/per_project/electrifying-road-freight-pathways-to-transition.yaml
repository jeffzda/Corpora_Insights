- record_id: ARENA-DLV-54830
  source_title: AECOM - Electrifying Road Freight Report
  publish_date: '2024'
  project_name: Electrifying Road Freight - Pathways to Transition
  what_happened: Stakeholder engagement identified that freight customers (shippers
    and retailers) represent an underutilised lever for driving freight electrification
    — a market-led push from freight clients demanding decarbonised supply chains
    could be more effective than top-down government mandates, and could partially
    offset the upfront cost burden on freight operators.
  lesson_learnt: Freight electrification programs should develop targeted mechanisms
    to engage freight customers (shippers, retailers) as demand-side drivers — customer
    sustainability requirements and supply chain reporting obligations can create
    commercial pull for electrification that supplements direct operator incentives
    and reduces the need for regulatory compulsion.
