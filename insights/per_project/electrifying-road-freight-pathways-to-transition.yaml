- record_id: ARENA-DLV-54809
  source_title: AECOM - Electrifying Road Freight Report
  publish_date: '2024'
  project_name: Electrifying Road Freight - Pathways to Transition
  what_happened: 98% of Australian freight operators are SMEs without access to centralised
    depots, meaning a transition plan relying on depot charging conversions would
    miss a large portion of the market. BEVs purchased by larger fleets may not be
    attractive to smaller operators in the used-vehicle market if charging solutions
    are only available at large private depots, potentially impacting residual values.
  lesson_learnt: Develop shared charging hub solutions and access agreements to enable
    small operators without dedicated depots to charge freight vehicles — a depot-conversion-only
    approach will structurally exclude the dominant SME segment and undermine the
