  publish_date: 2015-05
  project_name: 1-UFA005 Improving Translation Models for Predicting the Energy Yield
    of Photovoltaic Power Systems
  what_happened: Research found that accurate PV module temperature prediction requires
    system-specific coefficients to be determined, and that using default coefficient
    values in commercial yield modelling packages (rather than project-specific values)
    can lead to annual yield prediction errors of several percent.
  lesson_learnt: Utility-scale PV developers should pre-determine site- and system-specific
    temperature model coefficients during the planning stage rather than relying on
    default values in commercial yield modelling tools — using defaults can introduce
    annual yield prediction errors of several percent, which materially affects revenue
    forecasting and investor confidence.
