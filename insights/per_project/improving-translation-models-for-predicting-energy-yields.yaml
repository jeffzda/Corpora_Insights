- record_id: ARENA-DLV-31556
  source_title: Improving Translation Models for Predicting the Energy Yield of Photovoltaic
    Power Systems
  publish_date: 2015-05
  project_name: 1-UFA005 Improving Translation Models for Predicting the Energy Yield
    of Photovoltaic Power Systems
  what_happened: Comparison of four PV output translation methods (IEC 60891 Methods
    1–3 and the Sandia Array Performance Model) found that the Sandia model and IEC
    Method 3 clearly outperform IEC Methods 1 and 2 across the full irradiance/temperature
    parameter space, while IEC Method 3 is the most susceptible to propagation of
    measurement uncertainty.
  lesson_learnt: Yield modellers and independent engineers should select the Sandia
    Array Performance Model as the primary translation method for PV energy yield
    predictions — it outperforms IEC Methods 1 and 2 across all conditions and is
    less sensitive to measurement uncertainty than IEC Method 3; IEC Method 2 should
    be avoided as it is the least accurate of the four methods tested.
