  what_happened: CSIRO successfully established Australia's first IEC 17025-accredited
    PV Performance Laboratory, providing an in-country accredited facility for independent
    measurement of PV cell efficiency — a capability previously only available at
    selected labs in the Northern Hemisphere.
  lesson_learnt: Establishing accredited in-country PV testing infrastructure removes
    a gap that had constrained Australian PV research and commercial verification;
    accreditation is increasingly a contractual obligation of research funding agreements,
    so proponents should confirm whether accredited local testing is available or
    budget for offshore testing early in project planning.
