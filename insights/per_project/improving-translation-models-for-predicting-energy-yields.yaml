- record_id: ARENA-DLV-31555
  source_title: Improving Translation Models for Predicting the Energy Yield of Photovoltaic
    Power Systems
  publish_date: 2015-05
  project_name: 1-UFA005 Improving Translation Models for Predicting the Energy Yield
    of Photovoltaic Power Systems
  what_happened: The project determined that the widely used Sandia Array Performance
    Model does not fully account for site-specific spectral offsets, particularly
    for coastal climates — with spectral mismatch offsets at Newcastle reaching −1.9%
    for CIGS modules and +1.5% for cadmium telluride, compared with small offsets
    of −0.1% to −0.5% for the desert climate of Alice Springs.
  lesson_learnt: Utility-scale PV yield assessments for coastal Australian sites should
    not rely solely on the Sandia model for spectral effects — the model fails to
    capture site spectral offsets that can reach nearly 2% for some module technologies
    at coastal locations, which is material for revenue forecasting; the modified
    CREST model provides more accurate spectral prediction for coastal sites.
  issue_severity: moderate
  project_type: generation
  project_scale_band: utility/large-scale
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: CSIRO modified the CREST model to accommodate full spectral response
    curves for most commercially available PV module types, providing a more accurate
    prediction of spectral conditions including site spectral offset.
  transferability: moderate
