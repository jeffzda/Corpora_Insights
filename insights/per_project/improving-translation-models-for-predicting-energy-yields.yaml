- record_id: ARENA-DLV-31558
  source_title: Improving Translation Models for Predicting the Energy Yield of Photovoltaic
    Power Systems
  publish_date: 2015-05
  project_name: 1-UFA005 Improving Translation Models for Predicting the Energy Yield
    of Photovoltaic Power Systems
  what_happened: The project identified that CREST spectral model coefficients determined
    for Newcastle were significantly different from those for Alice Springs, indicating
    that coefficients vary by climate zone and that further work across multiple Australian
    climate zones is required before an accurate national spectral effects map can
    be developed.
  lesson_learnt: Australian PV yield assessors should not extrapolate spectral correction
    model coefficients derived at one climate zone to other Australian sites — coefficients
    vary significantly between coastal and desert climates, and a nationally applicable
    spectral map does not yet exist; this is a known gap that introduces unquantified
    uncertainty into yield assessments for sites outside the calibrated locations.
