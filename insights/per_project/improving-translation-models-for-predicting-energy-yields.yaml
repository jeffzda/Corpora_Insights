- record_id: ARENA-DLV-31554
  source_title: Improving Translation Models for Predicting the Energy Yield of Photovoltaic
    Power Systems
  publish_date: 2015-05
  project_name: 1-UFA005 Improving Translation Models for Predicting the Energy Yield
    of Photovoltaic Power Systems
  what_happened: The project found that PV output translation models break down when
    irradiance contains an appreciable diffuse component (cloudy conditions), with
    translation accuracy scaling inversely with the diffuse fraction — meaning yield
    predictions are systematically less reliable for cloudy periods or cloudy climates.
  lesson_learnt: Energy yield assessors and financiers should apply caution to PV
    yield predictions for cloudy climates or sites with high diffuse irradiance fractions;
    current translation models are not reliable under these conditions, and yield
    forecasts should carry wider uncertainty bands or qualifications for such sites.
