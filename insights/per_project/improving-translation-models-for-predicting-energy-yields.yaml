  source_title: Improving Translation Models for Predicting the Energy Yield of Photovoltaic
    Power Systems
  publish_date: 2015-05
  project_name: 1-UFA005 Improving Translation Models for Predicting the Energy Yield
    of Photovoltaic Power Systems
  what_happened: The project found that module mismatch losses — a system-level loss
    factor often anticipated by designers to be significant — were in practice much
    smaller than expected, ranging from only 0.02% to 0.05%, suggesting that system
    designers are systematically over-estimating this loss component.
  lesson_learnt: PV system designers should not apply conservative mismatch loss assumptions
    drawn from prior industry convention — measured mismatch losses of 0.02–0.05%
    are far smaller than values typically anticipated, meaning that over-conservative
    mismatch assumptions are likely inflating projected system losses and understating
    expected energy yield.
