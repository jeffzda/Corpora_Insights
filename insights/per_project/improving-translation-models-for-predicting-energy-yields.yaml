  what_happened: Analysis of five residential-scale PV systems found Normalised Performance
    Ratios (NPR) ranging from 83.6% to 95.2%, indicating that system-level losses
    differed by more than a factor of three between systems — suggesting significant
    variability in PV system design quality in the field.
  lesson_learnt: System-level losses in PV installations vary widely (by more than
    3×) between designs; project developers and asset owners should use a normalised
    performance ratio metric (rather than the standard Performance Ratio) to compare
    system design quality independent of climate and site conditions, enabling more
    rigorous acceptance testing and fault detection.
