- record_id: ARENA-DLV-40365
  source_title: 'In The Spotlight: Australian Solar Energy R&D Outcomes and Achievements in a Global Context'
  publish_date: 2018-07
  project_name: Integrated Solar Radiation Data Sources over Australia (2013/ERP047)
  what_happened: The Integrated Solar Radiation Data Sources project developed an integrated solar radiation dataset at 30-minute and 10 km resolution (with 1-minute resolution for several sites), which
    subsequently became a key enabling component for AEMO's Australian Solar Energy Forecasting System (ASEFS), AREMI's solar data layers, and multiple follow-on projects including ANU's PV output forecasting
    for DNSPs.
  lesson_learnt: Investment in high-resolution, publicly accessible solar resource data is a high-leverage enabling activity that unlocks multiple downstream benefits across the deployment chain — solar
    resource data improvement should be treated as foundational infrastructure for any major solar deployment program, as it directly reduces financing risk and enables performance forecasting.
