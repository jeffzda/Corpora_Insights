- record_id: ARENA-DLV-64115
  source_title: Summary of ARENA Funded Hydrogen R&D Projects
  publish_date: 2023-04
  project_name: UNSW – PV Electrolysis
  what_happened: The UNSW PV electrolysis project demonstrated record 30.3% solar-to-hydrogen efficiency at up to 1 kW scale but concluded that further scaling from 1 kW to 5 kW is required before the system
    is ready for commercialisation, with this scale-up to be conducted alongside electrolyser manufacturers.
  lesson_learnt: PV electrolysis projects achieving high efficiency at sub-kilowatt scale must plan for a structured scale-up pathway in partnership with electrolyser manufacturers from the outset — treating
    scale-up as an afterthought once laboratory results are achieved delays commercialisation and risks losing partner interest.
