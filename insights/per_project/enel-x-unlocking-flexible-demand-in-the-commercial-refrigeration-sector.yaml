- record_id: ARENA-DLV-51459
  source_title: UTS - Flexible Demand State of Play in Australia - Report
  publish_date: 2024-05
  project_name: Enel X – Unlocking Flexible Demand in the Commercial Refrigeration
    Sector
  what_happened: The 50-millisecond response time requirement for FCAS participation
    creates hardware and integration costs that are prohibitively high for smaller
    commercial refrigeration sites.
  lesson_learnt: The 50 ms FCAS response requirement effectively excludes smaller
    commercial sites from FCAS markets due to cost; program designers targeting small
    C&I loads for FCAS should advocate for tiered response requirements or alternative
    market products with longer response windows.
