- record_id: ARENA-DLV-51458
  source_title: UTS - Flexible Demand State of Play in Australia - Report
  publish_date: 2024-05
  project_name: Enel X – Unlocking Flexible Demand in the Commercial Refrigeration
    Sector
  what_happened: Many smaller commercial refrigeration sites have multiple National
    Meter Identifiers (NMIs) due to lower thermal mass and redundancy requirements,
    which prevents them from participating in flexible demand programs that rely on
    a single NMI per site.
  lesson_learnt: Program eligibility rules that assume a single NMI per site structurally
    exclude a large portion of small commercial refrigeration loads; the CER Flexible
    Trading rule change enabling sub-metering is a prerequisite for unlocking FD from
    this sector.
