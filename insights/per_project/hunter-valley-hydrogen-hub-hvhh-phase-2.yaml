  evidence_excerpt: Capital expenditure remains high for electrolysers and the expected
    reductions in CAPEX costs as the industry scaled up has not materialised as was
    predicted a few years ago. The operating costs for electrolysers is dominated
    by the price of renewable electricity. The ability to source competitively priced
    renewable electricity that allows for higher utilisation rates and lower costs
    of production remains challenging.
  confidence_note: secondary_failure_mode coded as cost overrun because the failure
    of projected CAPEX reductions to materialise constitutes an upward cost variance
    relative to the project's financial assumptions.
