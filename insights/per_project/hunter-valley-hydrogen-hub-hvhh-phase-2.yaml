  evidence_excerpt: Inflationary and supply chain pressures on capital costs are escalating.
    Capital investment in large-scale decarbonisation projects, including renewable
    hydrogen projects will need public funding and further policies which help to
    incentivise local and international demand. Given the early stage of development
    of the renewable hydrogen industry in both Australia and overseas, financial support
    in the form of both OPEX and CAPEX will be required to help bridge the commercial
