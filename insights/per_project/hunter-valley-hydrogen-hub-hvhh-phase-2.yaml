- record_id: ARENA-DLV-61353
  source_title: Lessons learned from renewable hydrogen projects – Orica Knowledge
    Sharing Report Phase 2 – Hunter Valley Hydrogen Hub (HVHH) Hydrogen Headstart
  publish_date: '2025-06-04'
  project_name: Hunter Valley Hydrogen Hub (HVHH) Phase 2
  what_happened: Electrolyser capital costs remained high and the anticipated CAPEX
    reductions that were predicted as the industry scaled did not materialise. Operating
    costs continued to be dominated by the price of renewable electricity, making
    competitive production economics difficult to achieve.
  lesson_learnt: Project financial models for renewable hydrogen must not rely on
    anticipated future CAPEX reductions from electrolyser scale-up — developers should
    use current demonstrated costs and stress-test against renewable electricity price
    scenarios, as neither cost curve deflation nor competitively priced renewable
    electricity has materialised on predicted timelines.
  issue_severity: major
  project_type: industrial decarbonisation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: concept/feasibility
  proponent_type: industrial operator
