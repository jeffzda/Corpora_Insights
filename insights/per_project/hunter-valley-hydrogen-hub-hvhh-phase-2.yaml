- record_id: ARENA-DLV-61354
  source_title: Lessons learned from renewable hydrogen projects – Orica Knowledge
    Sharing Report Phase 2 – Hunter Valley Hydrogen Hub (HVHH) Hydrogen Headstart
  publish_date: '2025-06-04'
  project_name: Hunter Valley Hydrogen Hub (HVHH) Phase 2
  what_happened: Inflationary and supply-chain pressures escalated capital costs across
    the Australian renewable hydrogen sector, compounding the challenge of making
    large-scale decarbonisation projects economically viable without public funding
    support.
  lesson_learnt: Renewable hydrogen projects at scale require both CAPEX and OPEX
    public funding support to bridge the commercial gap — project developers should
    explicitly plan for government co-investment as a prerequisite rather than an
    optional supplement, and engage early with policy mechanisms that incentivise
    domestic and international demand.
