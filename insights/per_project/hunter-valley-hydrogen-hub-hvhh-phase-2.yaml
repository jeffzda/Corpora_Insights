  publish_date: '2025-06-04'
  project_name: Hunter Valley Hydrogen Hub (HVHH) Phase 2
  what_happened: Markets for low-carbon hydrogen did not develop as quickly as expected,
    with demand for hydrogen in the mobility sector failing to materialise. Downstream
    markets for low-carbon derivatives such as ammonia and ammonium nitrate remained
    in their infancy with no established trade.
  lesson_learnt: Do not dimension large-scale renewable hydrogen projects around speculative
    end-markets such as mobility — project developers should secure confirmed offtake
    agreements from near-term, willing buyers before committing to scale-up investment,
    as green premium willingness to pay has not emerged on anticipated timelines.
