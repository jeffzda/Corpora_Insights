- record_id: ARENA-DLV-27009
  source_title: Insights from Smart Charging Trials Data (Update)
  publish_date: '2023-08-02'
  project_name: Dynamic Electric Vehicle Charging Trial (EV Grid)
  what_happened: Around 50% of EV Grid trial participants in each event were recorded
    as offline without having formally opted out, with non-participation likely attributable
    to absent vehicles and technical difficulties rather than deliberate opt-out.
  lesson_learnt: Smart charging trial designs must distinguish between formal opt-outs,
    technical failures, and absent vehicles when measuring participation — lumping
    all non-participation together substantially overstates willingness to opt out
    and understates true technical reliability of the charging system.
