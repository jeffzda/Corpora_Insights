- record_id: ARENA-DLV-27020
  source_title: Insights from Smart Charging Trials Data (Update)
  publish_date: '2023-08-02'
  project_name: Dynamic Electric Vehicle Charging Trial (EV Grid)
  what_happened: In the EV Grid demand response events, the variable charger set-points
    applied by different DNSPs made it difficult to determine whether differences
    in demand response by vehicle price band were driven by customer behaviour or
    by the varying network control signals — limiting the analytical conclusions that
    could be drawn.
  lesson_learnt: Demand response trials involving multiple DNSPs with variable set-points
    should standardise control signals across network participants or explicitly account
    for set-point variation in the analytical framework — without this, participant
    behaviour effects cannot be cleanly isolated from network control effects.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: demonstration
  lifecycle_phase: close-out/post-project review
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: coordination & stakeholders
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: EV
  source_pages: &id004
  - 53
  evidence_excerpt: As demand response charger set-points vary location-to-location,
    it is difficult to determine the cause of varied behaviour by vehicle price time.
