- record_id: ARENA-DLV-27008
  source_title: Insights from Smart Charging Trials Data (Update)
  publish_date: '2023-08-02'
  project_name: Dynamic Electric Vehicle Charging Trial (EV Grid)
  what_happened: In the EV Grid trial, opt-out rates were high in the early events,
    with participants indicating that opt-out notifications were confusing. Opt-out
    rates decreased over time as participants became more familiar with the trial
    process.
  lesson_learnt: Smart charging programs should invest heavily in clear, intuitive
    opt-out notification design before launch — confusing opt-out processes inflate
    early non-compliance rates and misrepresent true customer willingness to participate;
    this distorts trial results and could lead to under-investment in smart charging
    infrastructure.
