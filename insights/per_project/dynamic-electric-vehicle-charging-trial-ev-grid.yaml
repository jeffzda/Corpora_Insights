- record_id: ARENA-DLV-27019
  source_title: Insights from Smart Charging Trials Data (Update)
  publish_date: '2023-08-02'
  project_name: Dynamic Electric Vehicle Charging Trial (EV Grid)
  what_happened: EV Grid's solar soaker events successfully incentivised daytime charging
    across all vehicle price bands, with under-$60k vehicles showing the highest participation,
    demonstrating that smart charging response is not limited to higher-income/higher-price-band
    EV owners.
  lesson_learnt: Solar soaking incentives are effective across all vehicle price bands
    including lower-cost EVs — program designers should not assume that smart charging
    response is concentrated among premium vehicle owners, and mass-market EV charging
    programs can expect meaningful flexibility from lower-priced EV segments.
