- record_id: ARENA-DLV-32602
  source_title: Origin Energy - Backbone Charging Infrastructure Project - Lessons
    Learnt Report 1
  publish_date: '2025-02-28'
  project_name: Backbone Charging Infrastructure Project
  what_happened: Owners' corporates in existing apartment buildings were found to
    be a significant barrier to EV charger installation due to limited information
    on load management risks, infrastructure costs, cost allocation, and approval
    processes — leading to delayed or refused approvals for individual residents seeking
    to install EV chargers.
  lesson_learnt: EV charging deployment in multi-dwelling units requires a turnkey
    package specifically addressing owners' corporate concerns — including load analysis,
    financing options, cost allocation mechanisms, and guided approval processes —
    before individual charger installations can proceed at scale.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: demonstration
  lifecycle_phase: concept/feasibility
  proponent_type: utility/energy retailer
  delay_category: stakeholder/land/community
  failure_mode: coordination & stakeholders
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Origin developed a Backbone as a Service (BaaS) commercial model
    packaging financing, O&M, load management, and an assisted OC approval process
    into a monthly service fee to reduce upfront capital barriers.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: EV
  source_pages: &id002
  - 4
  evidence_excerpt: One of the key barriers to EV adoption is the complexity in installing
    charging infrastructure in existing apartment buildings... owners' corporates
    have limited information on the key considerations in relation to approving these
    requests for charging infrastructure and therefore may likely not approve these
    requests or will take a long time in coming to a decision.
  confidence_note: outcome_class set to re-scoped/adapted as the project response
    was to develop a structured BaaS model to address the identified barrier rather
    than proceeding with simple charger installation.
