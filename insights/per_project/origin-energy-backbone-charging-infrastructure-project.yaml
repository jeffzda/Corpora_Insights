- record_id: ARENA-DLV-32601
  source_title: Origin Energy - Backbone Charging Infrastructure Project - Lessons
    Learnt Report 1
  publish_date: '2025-02-28'
  project_name: Backbone Charging Infrastructure Project
  what_happened: During design of the Origin Load Management System (LMS) for EV charging
    in apartment buildings, both Modbus and OCPP communication protocols were evaluated.
    Modbus was selected over OCPP as the preferred protocol for real-time EVSE control
    due to lower latency, reduced cybersecurity exposure, CSMS-agnostic compatibility,
    and the ability to integrate with other distributed energy resources on-site.
  lesson_learnt: For building-level EV load management systems, Modbus is preferable
    to OCPP as the edge communication protocol — it provides real-time response, operates
    on an isolated network reducing cyber risk, avoids CSMS compatibility conflicts,
    and can integrate with other on-site DER (solar PV, batteries, BMS) in ways OCPP
    cannot.
