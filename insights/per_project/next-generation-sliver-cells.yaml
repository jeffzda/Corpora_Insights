- record_id: ARENA-DLV-15253
  source_title: Next Generation SLIVER Solar Cells
  publish_date: '2014-06-30'
  project_name: Next Generation SLIVER Solar Cells
  what_happened: The project identified that p-type silicon, used in the majority
    of commercial cells and in early SLIVER cells, limited achievable efficiency;
    transitioning to n-type silicon required significant process redesign including
    new surface coatings and laser-based processing to replace expensive photolithography.
  lesson_learnt: When efficiency ceilings are reached with standard material choices,
    switching to higher-quality material types (e.g. n-type vs p-type silicon) is
    a viable path but requires budgeting for substantial process redesign, new coating
    development, and laser process characterisation work.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: Developed new aluminium oxide and titanium dioxide surface coatings
    via atomic layer deposition and characterised laser parameters for selective coating
    removal, achieving n-type SLIVER cells at 19% efficiency with Voc exceeding 700
    mV.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id003
  - 6
  evidence_excerpt: The use of n type rather than p type silicon necessitates significant
    changes in solar cell fabrication processes... This work resulted in the demonstration
    of n type SLIVER cells with high conversion efficiencies of 19%, as well as open
    circuit voltages (VOC) of more than 700mV.
  confidence_note: null
