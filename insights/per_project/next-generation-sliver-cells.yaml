  evidence_excerpt: the laser processes for the selective removal of surface coatings
    have already been applied to other types of silicon solar cells, where efficiencies
    as high as 23.5% have been achieved... The modelling program Quokka is also finding
    widespread use for many other types of silicon solar cells.
