- record_id: ARENA-DLV-15252
  source_title: Next Generation SLIVER Solar Cells
  publish_date: '2014-06-30'
  project_name: Next Generation SLIVER Solar Cells
  what_happened: The commercial partner Transform Solar exited SLIVER technology in
    late 2012 due to unfavourable market conditions, causing all intellectual property
    and know-how to revert to ANU and leaving the technology without a commercialisation
    pathway for the remainder of the project.
  lesson_learnt: Ensure commercialisation pathways and partner commitment are reviewed
    at key project milestones — a commercial partner exit mid-project can strand IP
    and delay market deployment even when the technical programme succeeds.
