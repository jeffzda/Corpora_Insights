- record_id: ARENA-DLV-15251
  source_title: Next Generation SLIVER Solar Cells
  publish_date: '2014-06-30'
  project_name: Next Generation SLIVER Solar Cells
  what_happened: At the start of the project, the SLIVER fabrication process required
    75 process steps including complex aligned patterning steps that were slow, error-prone
    and contributed to low yield and low cell efficiency (~13%).
  lesson_learnt: When entering a process improvement R&D programme, prioritise elimination
    of aligned process steps early — self-aligned technologies can substantially reduce
    process complexity, improve yield, and raise efficiency in a single programme
    phase.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: Introduced self-aligned technologies into the cell fabrication
    process, reducing total process steps from 75 to 53 and boosting small-module
    conversion efficiency from ~13% to 16.1%.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id001
  - 5
  - 6
  evidence_excerpt: the fabrication sequence required so-called aligned steps, where
    patterning steps where required that had to be aligned with previous patterning
    steps. Such aligned process steps are usually slow, complex and prone to error...
    the total number of process steps reduced from 75 to 53.
  confidence_note: null
