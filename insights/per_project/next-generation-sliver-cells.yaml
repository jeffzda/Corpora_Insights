- record_id: ARENA-DLV-15254
  source_title: Next Generation SLIVER Solar Cells
  publish_date: '2014-06-30'
  project_name: Next Generation SLIVER Solar Cells
  what_happened: Laser processes and modelling tools developed during the SLIVER project
    were successfully transferred to other silicon solar cell types, with the laser
    contact opening technique achieving efficiencies of 23.5% on non-SLIVER cells
    and the Quokka simulation program finding widespread use across the PV research
    community.
  lesson_learnt: Process innovations developed for a specific cell architecture (e.g.
    laser contact opening, advanced surface coatings) should be published openly and
    made freely available — broad uptake by the wider research community can multiply
    the impact of a single funded project well beyond its original scope.
  issue_severity: none
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: close-out/post-project review
  proponent_type: research organisation/university
  delay_category: null
