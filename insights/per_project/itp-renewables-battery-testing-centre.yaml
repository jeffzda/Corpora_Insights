- record_id: ARENA-DLV-9951
  source_title: 'Empowered Consumers: Distributed Energy Resources Portfolio Update'
  publish_date: '2018'
  project_name: ITP Renewables Battery Testing Centre
  what_happened: Integration of battery packs with inverters was consistently challenging
    during installation and commissioning, with the communications interface identified
    as the most common issue. Commissioning problems were noted as not uncommon in
    systems where the battery manufacturer had only recently offered integration with
    the inverter.
  lesson_learnt: Ensure battery-inverter communications protocols are standardised
    and verified before deployment — communications interface incompatibilities are
    the most common installation failure point, particularly for recently integrated
    products. Common communications protocols need to be developed across the industry.
  issue_severity: moderate
