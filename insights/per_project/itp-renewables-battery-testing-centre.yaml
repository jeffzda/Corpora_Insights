- record_id: ARENA-DLV-9952
  source_title: 'Empowered Consumers: Distributed Energy Resources Portfolio Update'
  publish_date: '2018'
  project_name: ITP Renewables Battery Testing Centre
  what_happened: Some battery manufacturers exited the market or changed their product
    offering during the testing period, creating market instability that affected
    the testing programme.
  lesson_learnt: Account for supplier market instability when selecting battery technologies
    for long-duration trials — manufacturers may exit or change product offerings
    mid-project, disrupting testing continuity and comparability.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: research organisation/university
