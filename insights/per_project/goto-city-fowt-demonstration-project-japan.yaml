- record_id: ARENA-DLV-50015
  source_title: Ocean Energy Report by Seanergy and Ernst and Young
  publish_date: 2016-06
  project_name: Goto City FOWT Demonstration Project, Japan
  what_happened: A 2 MW floating offshore wind turbine was installed at Goto City,
    Japan and grid-connected, but was operating only at 600 kW capacity — well below
    its 2 MW rated output — due to the small energy demand on the islands and limited
    transmission capacity on the existing undersea cable network.
  lesson_learnt: Floating offshore wind demonstrations in island communities must
    assess transmission infrastructure capacity before finalising turbine sizing;
    where grid capacity is constrained, a device may be commissioned successfully
    but be unable to operate at rated output, undermining performance data and economic
    projections.
