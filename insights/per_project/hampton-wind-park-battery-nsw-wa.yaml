- record_id: ARENA-DLV-16267
  source_title: Energy Storage Study
  publish_date: 2015-07
  project_name: Hampton Wind Park Battery (NSW/WA)
  what_happened: A 1 MW / 1.8 MWh Ultrabattery was deployed at Hampton Wind Park in
    NSW to control the ramp rate of wind turbines and provide smooth output. The batteries
    were subsequently moved to a site in WA and became the property of CSIRO, indicating
    the original deployment was not sustained.
  lesson_learnt: Wind-firming battery pilots should include a long-term operational
    plan and asset ownership structure from the outset — batteries relocated or transferred
    mid-project limit the accumulation of site-specific operational learnings and
    may not deliver the full intended demonstration value.
