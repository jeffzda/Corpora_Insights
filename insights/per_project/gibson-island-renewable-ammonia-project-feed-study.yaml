  publish_date: 2024-07
  project_name: Gibson Island Green Hydrogen and Ammonia Project
  what_happened: The Cost and Schedule Risk Analysis (CSRA) identified that new technology
    was the primary driver of systemic cost risk for the hydrogen scope, followed
    by technical complexity and estimate competitiveness. For the ammonia scope, technical
    complexity, new technology, estimate competitiveness and estimate exclusions drove
    systemic cost risk. The analysis recommended a P50 schedule contingency of 7.8
    months be added to the deterministic schedule.
  lesson_learnt: For FOAK hydrogen and green ammonia projects, cost and schedule risk
    analyses should assign primary risk weighting to new technology and technical
    complexity — not supply chain or approvals alone. A P50 schedule contingency of
    ~8 months above the deterministic schedule should be considered as a baseline
    allowance for comparable projects.
