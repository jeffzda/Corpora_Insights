  source_title: Gibson Island Green Hydrogen and Ammonia Project - Public FEED Summary
    Report
  publish_date: 2024-07
  project_name: Gibson Island Green Hydrogen and Ammonia Project
  what_happened: The Project identified that operational flexibility in ammonia production
    — the ability to ramp production up and down in response to electricity price
    movements — significantly increases design complexity. This is because the response
    times expected at an electrical grid level are much faster than the ramping capability
    of the ammonia synthesis process.
  lesson_learnt: Designing a green ammonia plant for operational flexibility introduces
    significant complexity in ammonia synthesis control and mechanical design — include
    variable speed drives on primary compressors, hydrogen gas storage, and liquid
    ammonia storage from the outset, and engage the ammonia technology licensor early
    on ramping limits to avoid costly redesign.
