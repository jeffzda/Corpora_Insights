- record_id: ARENA-DLV-39401
  source_title: Gibson Island Green Hydrogen and Ammonia Project - Public FEED Summary
    Report
  publish_date: 2024-07
  project_name: Gibson Island Green Hydrogen and Ammonia Project
  what_happened: The regulatory approvals process for the Project involved 37 approvals
    across 19 agencies for the hydrogen facility alone, reflecting a high degree of
    complexity stemming from the combined use of hydrogen electrolysis and ammonia
    synthesis — a combination that exceeded the number of approvals required by other
    renewable energy technologies. The absence of a dedicated legislative framework
    for large-scale green hydrogen projects led to protracted assessment periods.
  lesson_learnt: Proponents of first-of-kind green hydrogen and ammonia projects should
    anticipate a significantly larger and more complex approvals burden than comparable
    renewable energy projects, and engage government advocacy support (such as a state
    treasury department) early to help navigate multi-agency processes where no dedicated
    hydrogen regulatory framework yet exists.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: first commercial/FOAK
