  project_name: Gibson Island Green Hydrogen and Ammonia Project
  what_happened: The Project selected Battery Energy Storage Systems (BESS) over diesel
    generators for standby power supply, driven by emissions reduction objectives
    and avoidance of hydrocarbon storage within the hydrogen facility. The BESS was
    sized for eight hours at 150 KVA/500 kWh per unit. However, unlike diesel generators,
    BESS operation cannot be extended beyond its capacity without a temporary generator
    connection point.
  lesson_learnt: When selecting BESS over diesel generators for standby power in hydrogen
    facilities, account for the operational constraint that BESS capacity cannot be
    extended by adding more fuel — design in a temporary generator connection point
    from the outset to allow extended emergency operation if required.
