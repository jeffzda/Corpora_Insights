  what_happened: Early and frequent engagement with Urban Utilities (UU) was required
    to secure water supply for the Project. UU had competing priorities due to major
    infrastructure investment for the 2032 Brisbane Olympics and rapid population
    growth, meaning the Project had to maintain sustained focus to retain attention
    and resourcing from UU. Plans for water supply evolved considerably from initial
    discussions in late 2022.
  lesson_learnt: Water utilities in rapidly growing urban areas have competing investment
    priorities and finite resourcing — secure early and frequent engagement commitments
    from the outset, and remain adaptable as supply solutions evolve. Do not assume
    initial water supply discussions will convert directly into a finalised agreement.
