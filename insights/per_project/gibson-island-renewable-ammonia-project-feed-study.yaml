  project_name: Gibson Island Green Hydrogen and Ammonia Project
  what_happened: The existing ammonia plant at Gibson Island had been in continuous
    operation for over 50 years, which meant extensive historical geotechnical data
    was already available for the ammonia site. Using site-specific seismic response
    data for the ammonia storage tank design resulted in a lower cost design outcome
    than if typical regional seismic assumptions had been used.
  lesson_learnt: For brownfield projects on long-established industrial sites, leverage
    the available historical geotechnical and structural data to inform site-specific
    design; this can yield material cost savings over conservative regional design
    assumptions, particularly for foundations and storage tank seismic design.
