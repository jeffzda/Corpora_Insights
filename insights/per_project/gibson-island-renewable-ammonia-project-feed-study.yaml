- record_id: ARENA-DLV-39429
  source_title: Gibson Island Green Hydrogen and Ammonia Project - Public FEED Summary
    Report
  publish_date: 2024-07
  project_name: Gibson Island Green Hydrogen and Ammonia Project
  what_happened: The project identified that purified recycled water (PRW) supply
    was subject to variability, and a letter from the Queensland Department of Regional
    Development, Manufacturing and Water (DRDMW) received in November 2023 estimated
    18 months (to May 2025) to establish a pathway for PRW supply to the Project.
    Potable water was retained as backup to manage this variability.
  lesson_learnt: Do not rely solely on purified recycled water supply for a large-scale
    hydrogen project in South East Queensland — infrastructure pathways for PRW can
    take 18+ months to establish and are subject to utility investment prioritisation.
    Retain potable water as a backup supply and design the facility to operate on
    either source.
