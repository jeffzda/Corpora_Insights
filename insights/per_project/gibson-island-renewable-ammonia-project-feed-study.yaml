- record_id: ARENA-DLV-39407
  source_title: Gibson Island Green Hydrogen and Ammonia Project - Public FEED Summary
    Report
  publish_date: 2024-07
  project_name: Gibson Island Green Hydrogen and Ammonia Project
  what_happened: To maintain the overall Project schedule while FEED activities were
    being finalised, Fortescue negotiated a Preliminary Works Agreement (PWA) with
    Powerlink. This allowed critical-path long-lead activities — including geotechnical
    works, land arrangements, cultural heritage agreements, and procurement of some
    long-lead items — to proceed before the Funded Augmentation Agreement (FAA) was
    finalised.
  lesson_learnt: When transmission connection is on the critical path, enter a Preliminary
    Works Agreement or equivalent arrangement with the network operator early — before
    the main connection agreement is finalised — to allow critical-path long-lead
    activities to proceed and avoid schedule slippage.
  issue_severity: none
  project_type: industrial decarbonisation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: approvals/contracting
