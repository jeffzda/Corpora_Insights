  what_happened: The project's EPBC self-assessments by both Fortescue and IPF confirmed
    that the proposed activities would not likely result in significant impacts to
    endangered, vulnerable or migratory species under the EPBC Act, and that federal
    referral was not required. This outcome was achieved for both the hydrogen and
    ammonia components.
