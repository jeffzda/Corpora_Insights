- record_id: ARENA-DLV-39406
  source_title: Gibson Island Green Hydrogen and Ammonia Project - Public FEED Summary
    Report
  publish_date: 2024-07
  project_name: Gibson Island Green Hydrogen and Ammonia Project
  what_happened: Vendor engagement for long lead item procurement during FEED revealed
    signs of market saturation in the green energy sector, with fewer and lower quality
    bid responses received across both the hydrogen and ammonia packages. Price increases
    were seen in several major packages, and lead times on critical path items were
    longer than planned, resulting in an overall increase in Project cost and schedule.
  lesson_learnt: The green energy equipment market shows signs of saturation from
    the volume of projects in development that do not proceed to execution — suppliers
    are cautious about committing to bids. Run market engagement early in FEED to
    obtain realistic lead times and pricing, and build schedule contingency for critical
    path long-lead items accordingly.
