  proponent_type: industrial operator
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: poor scoping
  intervention_note: Fortnightly meetings were established with the Queensland Treasury
    Department, which took an advocacy role with regulatory agencies; common approval
    planning and environmental studies contractors were used across both the hydrogen
    and ammonia approvals programs to coordinate unified agency responses.
