- record_id: ARENA-DLV-39405
  source_title: Gibson Island Green Hydrogen and Ammonia Project - Public FEED Summary
    Report
  publish_date: 2024-07
  project_name: Gibson Island Green Hydrogen and Ammonia Project
  what_happened: A competitive PPA process run by Fortescue revealed that the scale
    and development status of renewable energy projects available in Queensland —
    particularly wind — was lower and later than expected, with most proposals for
    early-stage wind projects with delivery dates in the late 2020s. Sellers were
    also expecting buyers to take increased risks associated with development costs,
    CAPEX escalation, and interest rates ahead of financial close.
  lesson_learnt: Do not assume Queensland's renewable energy supply pipeline is sufficiently
    mature to underpin a large-scale hydrogen project on expected timelines; wind
    generation in particular is less developed than anticipated, and PPA counterparties
    are shifting development and price risk onto buyers — factor this into commercial
    modelling assumptions and procurement strategy.
