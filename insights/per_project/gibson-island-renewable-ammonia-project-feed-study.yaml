  publish_date: 2024-07
  project_name: Gibson Island Green Hydrogen and Ammonia Project
  what_happened: The Project identified that the existing site had no vapour return
    line (VRL) at the wharf, which is required to gas up and cool down 'warm' spot
    ships arriving from dry dock, newbuilds, or after tank cleaning. During FEED,
    no viable VRL design was finalised — the preferred option (VRL to a flare) required
    further investigation of impacts on shipping operations.
  lesson_learnt: For ammonia export projects, assess the availability of a vapour
    return line at the wharf at the earliest design stage — the absence of a VRL creates
    an operational constraint on use of spot vessels, and retrofitting a VRL to connect
    to storage or a flare has safety and operational implications that require early
    engineering resolution.
