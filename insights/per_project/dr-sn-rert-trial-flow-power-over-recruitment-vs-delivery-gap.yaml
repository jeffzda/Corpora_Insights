- record_id: ARENA-DLV-20720
  source_title: Demand Response Short Notice RERT Trial Year 3 Report
  publish_date: 2021-10
  project_name: DR SN RERT Trial — Flow Power over-recruitment vs delivery gap
  what_happened: Flow Power maintained a recruited portfolio of approximately 39.57
    MW throughout Years 2 and 3 against contracted volumes of 15–20 MW, but delivered
    only 19.16 MW in Period 5 and 16.72 MW in Period 6 — approaching but not always
    meeting contracted volumes — demonstrating that even very high over-recruitment
    ratios (approximately 2x) do not guarantee delivery from a small customer base.
  lesson_learnt: High over-recruitment ratios relative to contracted volumes are necessary
    but not sufficient to guarantee delivery in small C&I portfolios; a small number
    of large customers means that the withdrawal of a single major site can threaten
    overall portfolio performance, making customer diversification more important
    than raw over-recruitment ratio.
