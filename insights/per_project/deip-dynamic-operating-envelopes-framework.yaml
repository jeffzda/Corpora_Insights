  source_title: Navigating Dynamic Operating Envelopes
  publish_date: 2025-12
  project_name: DEIP Dynamic Operating Envelopes Framework
  what_happened: Insights from Project EDGE and Project Symphony found that at low
    DER penetration levels and low network constraint, all DOE allocation methods
    (equal, proportional, maximising total generation) produce similar outcomes —
    but as penetration and constraints increase, unequal allocation methods enable
    significantly higher generation and network utilisation.
  lesson_learnt: Select DOE capacity allocation methods with future DER growth in
    mind — at low penetration all methods are equivalent, but early design choices
    that lock in equal allocation may limit network efficiency and consumer benefit
    as DER uptake grows. Plan for a transition to more sophisticated allocation methods
    as part of the staged DOE implementation roadmap.
