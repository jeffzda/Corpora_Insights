- record_id: ARENA-DLV-6813
  source_title: Navigating Dynamic Operating Envelopes
  publish_date: 2025-12
  project_name: DEIP Dynamic Operating Envelopes Framework
  what_happened: Home energy management systems (HEMS), which are required to coordinate
    multiple controllable devices at a site under DOE limits, are an emerging technology
    with unresolved challenges including conflicting device commands, unclear control
    hierarchies, and unstable control behaviours — issues that become more complex
    in multi-aggregator settings.
  lesson_learnt: Do not assume HEMS interoperability and control stability in DOE
    projects involving multiple controllable devices — HEMS remain immature and must
    have clearly defined control hierarchies (with network security taking precedence
    over market signals) embedded by design. Projects involving multi-aggregator scenarios
    at a single site require additional control systems engineering to prevent conflicting
    commands and instabilities.
