  source_title: Navigating Dynamic Operating Envelopes
  publish_date: 2025-12
  project_name: DEIP Dynamic Operating Envelopes Framework
  what_happened: In operational DOE deployments, there is currently no automated process
    to update DOE limits from the DNSP when a new NMI is added to an aggregator's
    portfolio — meaning aggregators may operate without correct DOE limits for new
    sites for a period, creating a conformance gap.
  lesson_learnt: Automate DOE limit provisioning when new NMIs join an aggregator
    portfolio — the current manual or batch-update process creates a window during
    which aggregators lack correct DOE limits for new sites, generating conformance
    breaches that are not the result of intentional non-compliance. This should be
    addressed in DOE platform design before scaling.
