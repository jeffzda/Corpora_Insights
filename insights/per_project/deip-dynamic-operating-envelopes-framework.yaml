- record_id: ARENA-DLV-6804
  source_title: Navigating Dynamic Operating Envelopes
  publish_date: 2025-12
  project_name: DEIP Dynamic Operating Envelopes Framework
  what_happened: Australian DOE trials found that including controllable (active)
    loads and generation in the network-level load profile — rather than separating
    them as allocatable spare capacity — causes DNSPs to underestimate the spare network
    capacity available for DOE allocation, resulting in unnecessarily conservative
    DOE limits for consumers.
  lesson_learnt: When calculating DOE spare capacity, separate controllable (active)
    loads and generation from the passive network load profile — conflating the two
    artificially reduces calculated spare capacity, leading to DOE limits that are
    more conservative than the network actually requires and unnecessarily curtailing
    consumer flexibility and revenue.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: development/design
  proponent_type: network business
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The report recommends constructing a passive-only network-level
    load profile (excluding controllable resources) as the baseline for spare capacity
    calculation, with controllable resources allocated to DOE capacity instead.
  transferability: moderate
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id004
  - 16
  - 17
  evidence_excerpt: Including both non-controllable (passive or opted out) and controllable
    (active) loads/generation in the network load profile can lead to underestimating
    the spare network capacity available for DOEs. This is because the controllable
    loads/generation are considered part of the passive network load profile, when
    it should be apportioned to the spare network capacity allocated to DOEs.
