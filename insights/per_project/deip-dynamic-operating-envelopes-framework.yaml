- record_id: ARENA-DLV-6810
  source_title: Navigating Dynamic Operating Envelopes
  publish_date: 2025-12
  project_name: DEIP Dynamic Operating Envelopes Framework
  what_happened: Current frameworks for DOE calculation split forecasting responsibilities
    between DNSPs and aggregators (aggregators forecast non-controllable loads), which
    trial experience shows can reduce forecast accuracy and create unclear accountability
    when DOE limits are inaccurate.
  lesson_learnt: Clarify and formalise forecasting responsibilities between DNSPs
    and aggregators at project design stage — split forecasting arrangements where
    aggregators forecast non-controllable loads can degrade DOE accuracy and obscure
    accountability. Device-level DOE architectures that assign passive load forecasting
    solely to DNSPs and controllable dispatch to aggregators offer a cleaner accountability
