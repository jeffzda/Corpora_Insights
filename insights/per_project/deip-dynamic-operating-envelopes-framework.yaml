- record_id: ARENA-DLV-6803
  source_title: Navigating Dynamic Operating Envelopes
  publish_date: 2025-12
  project_name: DEIP Dynamic Operating Envelopes Framework
  what_happened: Smart meter coverage varies significantly across Australian jurisdictions
    — Victoria has near-universal coverage while others have limited interval data
    — constraining real-time network visibility and limiting DOE calculation accuracy
    in lower-coverage regions.
  lesson_learnt: Do not assume uniform smart meter coverage when designing DOE systems
    for national deployment — in jurisdictions with limited smart meter penetration,
    DNSPs must use consumer archetypes or state estimation as proxies, which reduce
    DOE precision and may require recalibration as coverage improves. Design DOE architectures
    to accommodate data gaps from the outset.
