  source_title: Navigating Dynamic Operating Envelopes
  publish_date: 2025-12
  project_name: DEIP Dynamic Operating Envelopes Framework
  what_happened: Under NMI-level DOE implementations trialled in Australia, aggregators
    are required to manage the full site power flow including non-controllable devices,
    forcing them to withhold portfolio capacity as a hedge against variability outside
    their control — reducing overall network utilisation efficiency.
  lesson_learnt: When designing NMI-level DOE frameworks, account for the operational
    burden placed on aggregators to manage passive load variability — this forces
    aggregators to maintain larger consumer enrolment reserves than necessary, reducing
    efficient utilisation of available network capacity. Device-level DOEs or better
    behind-the-meter visibility can reduce this inefficiency.
