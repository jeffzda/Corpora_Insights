  what_happened: University of Melbourne research under Project EDGE modelled the
    impact of different DOE update frequencies (day-ahead, intra-day, near real-time)
    and found that near real-time DOEs are the most accurate, especially under high
    DER penetration and network constraints.
  lesson_learnt: Plan for near real-time DOE calculation as DER penetration grows
    — day-ahead and intra-day approaches perform adequately at low DER levels but
    degrade in accuracy as penetration and network constraints increase. Investment
    in the supporting communications and computational infrastructure needed to sustain
    near real-time updates should be scoped early in the design phase.
