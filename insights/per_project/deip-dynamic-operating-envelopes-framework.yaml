  project_name: DEIP Dynamic Operating Envelopes Framework
  what_happened: Desktop analyses referenced in Australian DOE work found that applying
    DOEs only to controllable devices (device-level DOEs), rather than at the NMI
    site level, can enable up to 20% more PV exports by making better use of network
    diversity.
  lesson_learnt: Device-level DOE application should be evaluated as part of the DOE
    architecture design — assigning limits only to controllable devices rather than
    the entire NMI can unlock up to 20% additional PV export capacity, improve network
    utilisation efficiency, and enable multi-aggregator business models, though it
    requires more granular behind-the-meter data and more complex control coordination.
