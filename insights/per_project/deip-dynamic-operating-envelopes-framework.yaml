  what_happened: DOE trials found that if VPPs and aggregators are not required to
    inform DNSPs when and what signals are sent to sites or devices, this creates
    uncertainty around roles and responsibilities for signal coordination and DOE
    compliance — making it difficult to diagnose and attribute conformance breaches.
  lesson_learnt: Require aggregators and VPPs to notify DNSPs of signals sent to sites
    as a condition of participation in DOE programs — without this visibility, DNSPs
    cannot distinguish conformance breaches caused by network events from those caused
    by aggregator instructions, undermining the integrity of monitoring frameworks.
    Policy frameworks must clarify responsibilities before DOE implementation scales.
