  publish_date: 2025-05
  project_name: Low-Cost Integration of On-Site Solar PV for Large-Scale Industrial
    Heat Supply
  what_happened: The project developed a non-isolated multiphase interleaved synchronous
    buck DC-DC converter that eliminates inverters, isolation transformers, and multi-stage
    AC-DC conversion, demonstrating that conventional dual-stage PV power conversion
    architecture is unnecessary for resistive industrial heating loads.
  lesson_learnt: Industrial PV heating projects targeting resistive loads should evaluate
    inverter-free DC-DC converter architectures before defaulting to conventional
    AC inverter-based designs — eliminating the DC-AC conversion stage reduces system
    cost, complexity, and losses while resistive heating elements are inherently compatible
    with DC excitation.
