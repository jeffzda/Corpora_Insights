  publish_date: 2025-05
  project_name: Low-Cost Integration of On-Site Solar PV for Large-Scale Industrial
    Heat Supply
  what_happened: Modelling of fixed-load maximum power point tracking (MPPT) showed
    a capacity factor 0.0273 lower than ideal MPPT, with larger losses at lower-irradiance
    locations (Melbourne vs Newman), meaning a fixed-resistance load results in meaningful
    energy harvest losses under real operating conditions.
  lesson_learnt: For inverter-free PV-DEH systems, a switchable modular resistor configuration
    (3×3 grid minimum) is needed to achieve capacity factors close to ideal MPPT —
    fixed-resistance designs lose disproportionately more energy at lower-irradiance
    sites and should not be assumed adequate without location-specific modelling.
