  source_title: ANU, Low-cost integration of on-site PV for large-scale industrial
    heat supply - R&D Conclusion report
  publish_date: 2025-05
  project_name: Low-Cost Integration of On-Site Solar PV for Large-Scale Industrial
    Heat Supply
  what_happened: Publicly available Australian industrial energy data lacked sufficient
    detail to identify what fraction of each site's energy consumption relates specifically
    to process heat, forcing the project to rely on US EPA GHGRP benchmarks to estimate
    heat-to-emissions ratios for Australian industrial sites.
  lesson_learnt: Projects seeking to quantify Australian industrial process heat demand
    should not rely solely on National Pollutant Inventory or Safeguard Mechanism
    data — these sources lack end-use breakdowns, and researchers will need to use
    US-derived benchmarks as a proxy or pursue direct engagement with industry to
    obtain actual site data.
