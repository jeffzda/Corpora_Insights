  what_happened: Technoeconomic analysis of a 100 MW PV-DEH plant demonstrated that
    the modularised DC direct electrical heating approach can achieve balance-of-system
    (BOS) cost savings of approximately 25% compared to conventional grid-connected
    PV systems supplying industrial heat, by eliminating multi-stage converters, transformers,
    and transmission lines.
  lesson_learnt: For industrial heat applications above 150°C, behind-the-meter PV
    with direct DC electrical heating can reduce balance-of-system costs by approximately
    25% relative to conventional PV integration — project developers should consider
    PV-DEH architecture as a cost-competitive pathway when evaluating industrial decarbonisation
    options.
