  what_happened: During packed-bed thermal energy storage cell design, initial modelling
    showed that a single perforated plate was insufficient to achieve uniform flow
    distribution at higher flow rates, with significant non-uniformities in velocity
    profile that would compromise heat transfer measurement accuracy.
  lesson_learnt: When designing packed-bed thermal storage test cells, use two consecutive
    perforated plates rather than one — numerical simulations showed a single plate
    produces significant velocity non-uniformity at higher flow rates, which adversely
    impacts heat transfer measurement accuracy.
