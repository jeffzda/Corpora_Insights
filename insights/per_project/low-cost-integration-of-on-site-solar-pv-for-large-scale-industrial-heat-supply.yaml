- record_id: ARENA-DLV-30956
  source_title: ANU, Low-cost integration of on-site PV for large-scale industrial
    heat supply - R&D Conclusion report
  publish_date: 2025-05
  project_name: Low-Cost Integration of On-Site Solar PV for Large-Scale Industrial
    Heat Supply
  what_happened: The GIS-based Atlas relied on OpenStreetMap (OSM) for identifying
    rooftop and carpark areas, but OSM was found to incompletely capture available
    land, with the OSM-based lower-bound estimate yielding a median onsite PV supply-demand
    ratio below 1% — substantially underestimating actual feasible potential compared
    to manual satellite image assessment.
  lesson_learnt: Industrial decarbonisation mapping tools that rely on Safeguard Mechanism
    emissions data will systematically underrepresent the opportunity for small and
    mid-sized businesses — project scoping should anticipate this data gap and include
    direct industry engagement or alternative demand estimation methods to avoid skewing
    conclusions toward large emitters.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: pilot
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Manual satellite imagery assessment was conducted for a subset
    of 20 sites, yielding a practical midpoint of approximately 34% of the upper-bound
    potential — substantially higher than the OSM lower bound.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages:
  - 16
  - 18
  - 19
  - 20
  - 21
  evidence_excerpt: The lower-bound scenario produces substantially lower results,
    with a median ratio below 1 percent and almost no facilities reaching above 25
    percent. This shows that relying solely on OSM-identified rooftops and parking
    areas may greatly underestimate the real feasible footprint, especially when OSM
    omits or misclassifies certain sections of industrial parcels.
