  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: The team conducted modelling of power factor at the required
    AC frequencies and, upon finding values around 0.8, redirected development focus
    to DC heating, which offers simpler electronics and more efficient electricity-to-heat
    conversion.
  transferability: moderate
  delay_magnitude: null
  technology_domain: industrial renewables
  source_pages:
  - 3
  - 4
  evidence_excerpt: High frequency AC current (~10,000 Hz) is required for a sufficiently
    strong skin effect to provide the heating effect necessary in the selected heating
    material. However, we found that at the necessary frequencies, power factor dropped
    to unacceptably low values (around 0.8), and thus we decided to focus primarily
    on the DC heating method, which offers benefits in terms of less complexity, simpler
    electronics and more efficient electricity-to-heat conversion.
  confidence_note: issue_severity set to moderate as the pivot redirected a meaningful
