- record_id: ARENA-DLV-57101
  source_title: Low-cost integration of on-site PV for Large-scale Industrial Heat
    Supply - Public Dissemination Report
  publish_date: 2024-02
  project_name: Low-Cost Integration of On-Site Solar PV for Large-Scale Industrial
    Heat Supply
  what_happened: During modelling of AC direct electrical heating, the project team
    found that the high-frequency AC current (~10,000 Hz) required to produce a sufficient
    skin effect for heating reduced the power factor to approximately 0.8 — an unacceptably
    low value — causing the project to pivot from AC to DC heating as the primary
    development pathway.
  lesson_learnt: When designing direct electrical heating systems for industrial PV
    applications, validate power factor implications of AC approaches through modelling
    before committing to hardware development — high-frequency AC heating may produce
    unacceptable power factors that make DC heating the more practical and efficient
    pathway.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: pilot
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
