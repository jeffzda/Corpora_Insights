- record_id: ARENA-DLV-42821
  source_title: Realising Electric Vehicle-to-Grid Services Crossing Sectors Report
  publish_date: 2022-06
  project_name: Realising Electric Vehicle-to-grid Services (REVS)
  what_happened: 'The REVS project operated under a simplified FCAS-only scope, which
    eliminated several V2G system complexities: no driver charging preferences were
    required, enablement signals were not needed from market systems, and the booking
    system did not need to be aware of energy requirements. These simplifications
    reduced delivery risk but left the project short of a fully-fledged V2G offering.'
  lesson_learnt: First-of-kind V2G trials should deliberately scope to the simplest
    grid service (contingency FCAS) and the service with minimal battery energy impact,
    to reduce the number of system interfaces that must be developed simultaneously
    — this reduces delivery risk and generates a working proof of concept, at the
    cost of not demonstrating full V2G capability.
