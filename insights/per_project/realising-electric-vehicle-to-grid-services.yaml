- record_id: ARENA-DLV-42824
  source_title: Realising Electric Vehicle-to-Grid Services Crossing Sectors Report
  publish_date: 2022-06
  project_name: Realising Electric Vehicle-to-grid Services (REVS)
  what_happened: 'In mixed V2G and non-V2G fleet environments, vehicles and chargers
    are physically indistinguishable to drivers, creating operational risks: non-V2G
    vehicles connected to V2G chargers may discharge without manufacturer warranty
    support (voiding warranty or damaging the battery); V2G vehicles connected to
    non-V2G chargers will not provide expected grid services; and V2G vehicles used
    in VPPs they are not approved for (e.g. at employee homes) may create warranty
    and commercial issues.'
  lesson_learnt: Fleet V2G deployments must implement clear physical or digital identification
    systems to ensure correct vehicle-charger matching — administrative controls alone
    (process and signage) are not preferred on the hierarchy of controls and are insufficient
    at scale; vehicle identification to charger systems and in-vehicle technology
    to restrict unapproved bidirectional charging are required for commercial deployment.
