  what_happened: When an EV was plugged into the charger while a FCAS event was already
    in progress, the FCAS control system did not respond to that in-progress event.
    The charger only participated in subsequent FCAS events after plug-in, leaving
    a gap in service delivery for any event already underway at the moment of connection.
  lesson_learnt: FCAS availability calculations for V2G fleets must account for mid-event
    plug-in scenarios — chargers connecting during an active contingency event will
    not contribute to that event, reducing effective fleet capacity; fleet management
    systems should pre-stage charging sessions ahead of anticipated FCAS windows where
    possible.
