  what_happened: The review found that fast charging infrastructure projects in Australia
    (Chargefox, Evie Networks, Ampol, ENGIE) were designed primarily to connect capital
    cities via major highways, without engaging or being shaped by the needs of local
    communities, regional drivers, or disabled users, leaving accessibility gaps unaddressed
    by design.
  lesson_learnt: Fast charging network projects should include local community and
    end-user groups as co-design partners rather than passive beneficiaries — projects
    shaped only by network operators and charger companies produce infrastructure
    optimised for long-distance interstate travel and miss the needs of local and
    disadvantaged users.
