- record_id: ARENA-DLV-64902
  source_title: Modelling V2G Simulation - A Study of the Economic and Technical Value
    Proposition
  publish_date: 2022-12
  project_name: Realising Electric Vehicle to Grid Services (REVS)
  what_happened: FCAS (frequency control ancillary services) revenue accounted for
    half to two-thirds of the total V2G value stack under current market conditions,
    making the overall V2G value proposition highly sensitive to FCAS market dynamics.
    FCAS also provided substantial value under V1G (unidirectional managed charging),
    creating a potential competitive substitute for V2G.
  lesson_learnt: Project developers and market participants planning V2G business
    models should treat FCAS revenue as the dominant but volatile component of the
    value stack. Because FCAS prices are expected to decline as more flexible assets
    enter the market, business cases should be stress-tested against lower FCAS revenue
    scenarios, and V1G's ability to also access FCAS should be factored into investment
    decisions.
