- record_id: ARENA-DLV-57758
  source_title: Creating Value from V2G - Business Model Report
  publish_date: 2022-09
  project_name: Realising Electric Vehicle-to-Grid Services (REVS)
  what_happened: Vehicle manufacturer explicit approval of V2G use cases was required
    for the REVS project (Nissan approved the FCAS use case), and other trial proponents
    reported similar processes; manufacturers play a gatekeeping role to assess whether
    a proposed use case would cause undue battery wear or void the warranty.
  lesson_learnt: Secure vehicle manufacturer approval for the specific V2G use case
    early in project development — manufacturers hold a gatekeeping role on warranty
    and battery wear assessment, and without explicit approval the project cannot
    proceed; this dependency should be treated as a critical path item in project
    planning.
