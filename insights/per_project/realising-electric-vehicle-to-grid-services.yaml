- record_id: ARENA-DLV-13513
  source_title: The A'Z of V2G
  publish_date: 2021-01
  project_name: South Australia hot water coincident switching
  what_happened: In South Australia, large numbers of hot water cylinders had timers
    set to activate at 11:30 PM simultaneously, causing up to 250 MW of load increase
    within 5 minutes. This spike drove market prices higher as additional fast-ramping
    generation was required to meet the sudden demand surge. SA Power Networks subsequently
    introduced randomisation into the timing of new hot water systems.
  lesson_learnt: Coordinated switching of large numbers of demand-response devices
    at a fixed time creates price spikes and grid stress equivalent to losing a generator
    — any V2G or managed charging deployment at scale must implement randomisation
    or staggering of response times to avoid replicating this problem.
