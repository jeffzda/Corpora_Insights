  source_title: REVS Interim Social Report
  publish_date: 2021-05
  project_name: Realising Electric Vehicle-to-grid Services (REVS)
  what_happened: Future private EV users expressed distrust toward V2G service providers
    and software, perceiving a power imbalance between large energy retailers or aggregators
    and individual consumers. Concerns included whether financial benefits would be
    fairly passed on, whether software would malfunction (e.g. draining a vehicle
    battery overnight), and whether contracts would be understandable to a non-expert
    consumer.
  lesson_learnt: V2G offerings for private consumers must prioritise transparency
    in commercial terms, software operation, and benefit-sharing — distrust of providers
    and software is a primary adoption barrier, and offerings that appear to favour
    the aggregator over the consumer will fail to attract mainstream participation.
