- record_id: ARENA-DLV-64909
  source_title: Modelling V2G Simulation - A Study of the Economic and Technical Value
    Proposition
  publish_date: 2022-12
  project_name: Realising Electric Vehicle to Grid Services (REVS)
  what_happened: The model found that the objectives of cost minimisation, emissions
    minimisation, PV self-consumption maximisation, and driving range reservation
    are in structural tension with each other when optimising V2G operation. Pursuing
    any one objective creates trade-offs that reduce performance against others, and
    these trade-offs affect not just the individual EV owner but also other stakeholders
    including grid operators and market participants.
  lesson_learnt: V2G service providers and aggregators must explicitly surface and
    negotiate these objective tensions with all stakeholders before product deployment
    — defaulting to a single optimisation objective (e.g. cost minimisation) without
    customer and grid operator awareness of the consequences risks unintended outcomes
    and stakeholder dissatisfaction.
