    specifies inverters must limit their active power ramp rate (WGra) to 16.67% of
    the rated power output per minute (60 seconds)... Other AS/NZS 4777 compliant
    inverters already participate in FCAS markets, therefore the issue could be in
    the manufacturer's implementation of the AS/NZS 4777 standard rather than the
