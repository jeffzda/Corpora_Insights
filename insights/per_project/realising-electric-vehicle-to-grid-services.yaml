  source_title: Realising Electric Vehicle-to-Grid Services Crossing Sectors Report
  publish_date: 2022-06
  project_name: Realising Electric Vehicle-to-grid Services (REVS)
  what_happened: For fleet vehicles under lease arrangements, the financial impact
    of V2G falls differently than for owned vehicles. V2G may reduce resale value
    of leased vehicles (increasing lease costs), and lessors may not permit V2G use.
    Battery degradation from V2G on unsupported vehicles creates costs sitting with
    the fleet owner. The impact of V2G on resale value remained unclear at the time
    of the project.
  lesson_learnt: Fleet V2G programs must assess vehicle ownership and leasing structures
    before deployment — lease agreements must explicitly permit V2G use, and the resale
    value impact of V2G (which is currently unknown) should be tracked and shared
    by early adopters; maintaining records of V2G events and battery condition may
    help defend resale value claims.
