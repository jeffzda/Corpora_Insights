  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated integration
  intervention_note: The charger was reconfigured to the UK G99 standard, under which
    it responded to all FCAS services within 4.5 seconds — well within the 6-second
    MASS requirement.
