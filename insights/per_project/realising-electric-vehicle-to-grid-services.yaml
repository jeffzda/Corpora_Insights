  what_happened: Distribution network studies found that some networks could host
    up to 80% EV penetration without VGI measures, while other networks encountered
    problems at as low as 20% penetration, with rural networks generally having lower
    capacity — yet project designs applied uniform assumptions about network impact.
  lesson_learnt: EV charging project designs must be preceded by network-specific
    impact modelling — uniform assumptions about grid hosting capacity are invalid
    given the wide variation between networks, and projects in rural or weaker networks
    require VGI measures at much lower EV penetration levels than urban networks.
