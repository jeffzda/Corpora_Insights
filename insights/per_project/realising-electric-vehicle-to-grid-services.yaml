  publish_date: 2022-06
  project_name: Realising Electric Vehicle-to-Grid Services (REVS)
  what_happened: The FCAS controller's MODBUS communication with the bidirectional
    EV charger updated its internal registers only every 1 second, compared to the
    power meter's 20 ms update rate. This 1-second charger communication latency formed
    part of the overall control loop and was a structural constraint on achievable
    response times.
  lesson_learnt: Designers of V2G FCAS control systems should audit all communication
    latencies in the control loop before committing to response time targets — a 1-second
    MODBUS register update interval on the charger side is a hard latency floor that
    adds to firmware response time and must be factored into MASS compliance assessments.
