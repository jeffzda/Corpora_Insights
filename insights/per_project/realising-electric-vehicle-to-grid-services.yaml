- record_id: ARENA-DLV-49904
  source_title: 'Insights Spotlight: International Review of Vehicle to Grid Technology:
    An Interview with ANU'
  publish_date: 2021-02
  project_name: Realising Electric Vehicle-to-Grid Services (REVS)
  what_happened: International review found that battery degradation concerns are
    commonly overstated relative to the actual usage patterns of V2G applications.
    Many V2G applications draw on stored energy rarely, and battery longevity is more
    affected by temperature and charge/discharge rate — both more intense during driving
    — than by the number of V2G cycles.
  lesson_learnt: V2G project teams and customer engagement strategies should proactively
    address battery degradation concerns by communicating that V2G cycling is typically
    less damaging than driving cycles — framing V2G as low-risk to battery life can
    reduce a key barrier to customer participation.
