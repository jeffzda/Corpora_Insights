- record_id: ARENA-DLV-13514
  source_title: The A'Z of V2G
  publish_date: 2021-01
  project_name: V2G global review — aggregator market entry barriers
  what_happened: The review found that most electricity markets in Australia and internationally
    require a minimum capacity threshold (approximately 1 MW, or around 150 V2G EVs)
    before a new aggregator can participate and generate any market revenue. This
    creates a chicken-and-egg problem for new entrants who cannot earn revenue until
    they reach scale. The problem is compounded because residential batteries have
    been found to provide only around 50% of installed capacity as actual response,
    further increasing the effective threshold.
  lesson_learnt: Market regulators and rule-makers should lower minimum participation
    thresholds well below 1 MW to enable new V2G aggregators to enter the market and
    build scale — current thresholds prevent any revenue generation during the fleet-building
    phase and may permanently deter entry by small aggregators.
