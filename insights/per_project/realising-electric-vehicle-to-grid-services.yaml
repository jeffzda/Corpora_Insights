- record_id: ARENA-DLV-57766
  source_title: Creating Value from V2G - Business Model Report
  publish_date: 2022-09
  project_name: Realising Electric Vehicle-to-Grid Services (REVS)
  what_happened: Australian grid operators noted that the country had failed to proactively
    manage the grid impacts of the air conditioning boom in the 1990s and the solar
    PV boom in the 2010s, and expressed determination not to repeat this pattern with
    EVs — but also acknowledged that EV charging load would be highly coincident without
    managed charging, threatening network stability.
  lesson_learnt: Network planning for EV charging must begin well before EV penetration
    reaches critical levels — the coincident load risk from unmanaged EV charging
    is structurally similar to air conditioning and solar booms that caused significant
    network impacts in Australia; V2G and managed charging deployment should be treated
    as proactive infrastructure investments, not reactive responses.
