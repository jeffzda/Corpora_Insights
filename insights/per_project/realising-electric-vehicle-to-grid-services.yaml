  project_name: Realising Electric Vehicle-to-grid Services (REVS)
  what_happened: Consortium members held divergent views on which settings were most
    suitable for V2G — including commercial buildings, light passenger fleets, heavy
    vehicles, buses, and residential settings — with no consensus reached. Multiple
    consortium members found it easier to rationalise V2G applicability for someone
    else's organisation than their own.
  lesson_learnt: Absence of internal consensus on target use cases within a V2G project
    consortium is a signal that socioware and market development work is insufficient
    — resolve use case targeting before commercialisation planning to avoid misaligned
    product-market development efforts.
