- record_id: ARENA-DLV-25154
  source_title: Realising Electric Vehicle-to-Grid Services Lessons Learnt 1
  publish_date: 2021-04
  project_name: Realising Electric Vehicle-to-grid Services (REVS)
  what_happened: Site selection was treated as an early decision but in practice became
    a protracted negotiation process, settling late. Site-specific features — switchboard
    locations, site tenure, and compliance requirements — emerged late and were not
    replicable between sites, driving unexpected technical and approvals complexity.
  lesson_learnt: Treat site selection as a formal, structured process completed early
    in discovery — site-specific electrical, tenure, and compliance characteristics
    are a primary driver of installation complexity and must be known before technical
    design and approvals are commenced.
