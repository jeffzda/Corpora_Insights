- record_id: ARENA-DLV-57760
  source_title: Creating Value from V2G - Business Model Report
  publish_date: 2022-09
  project_name: Realising Electric Vehicle-to-Grid Services (REVS)
  what_happened: The REVS trial and associated interviews identified that V2G charger
    capital costs were high and that investment risk was difficult to allocate — EV
    owners were reluctant to invest in V2G-capable chargers without certain revenue,
    while grid operators were unwilling to commit revenue without existing capacity,
    creating an unresolved investment risk allocation problem.
  lesson_learnt: Address the V2G charger investment risk problem explicitly before
    project launch — options include grid operator or government equipment subsidies,
    intermediary capital investment with revenue recoupment, or financial participant
    co-investment; without a clear risk allocation mechanism, neither EV owners nor
    grid operators will commit and the project will not reach viable scale.
