  project_name: Realising Electric Vehicle-to-Grid Services (REVS)
  what_happened: Interviews found that organisations considering V2G faced significant
    internal coordination challenges because V2G spans fleet management, facilities
    management, energy management, and sustainability functions that do not normally
    interact — multiple internal stakeholders with different expectations of V2G created
    conflicting requirements that were difficult to reconcile before engaging an intermediary.
  lesson_learnt: Before engaging a V2G intermediary, organisations must complete an
    internal alignment process across fleet, energy, sustainability, and facilities
    functions to produce unified, actionable KPIs — underestimating this internal
    negotiation complexity is a common failure mode that results in conflicting constraints
    being passed to the intermediary, degrading both transport and energy service
    performance.
