- record_id: ARENA-DLV-42403
  source_title: Case Study Grid Performance of a V2G Capable EV Charger
  publish_date: '2022'
  project_name: Realising Electric Vehicle-to-Grid Services (REVS)
  what_happened: 'The Wallbox Quasar V2G charger exhibited non-deterministic behaviour
    under 45° phase angle jumps: across 11 test iterations it rode through in some
    cases and disconnected in others, with the outcome dependent on where in the voltage
    waveform cycle the phase jump occurred.'
  lesson_learnt: Phase angle jump compliance for V2G chargers cannot be confirmed
    by a single test pass — the waveform timing at which the jump is applied materially
    affects ride-through behaviour. Test protocols for V2G chargers should include
    multiple iterations at borderline phase angle values and should vary the point-on-wave
    at which the disturbance is applied.
