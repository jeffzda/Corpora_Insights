- record_id: ARENA-DLV-42826
  source_title: Realising Electric Vehicle-to-Grid Services Crossing Sectors Report
  publish_date: 2022-06
  project_name: Realising Electric Vehicle-to-grid Services (REVS)
  what_happened: The REVS bidding platform was developed with simplifying assumptions
    — vehicles always enabled for FCAS regardless of price, price-taker bidding strategy
    — appropriate for the trial's small fleet and single service. The platform lacked
    real-time bidirectional communication with the charger management system and did
    not implement charge optimisation. Future V2G implementations offering energy-based
    services will require substantially more complex bid engines with real-time vehicle
    state communication and optimisation.
  lesson_learnt: V2G trial bid platform design should be deliberately simplified for
    the initial service scope, but developers should document clearly which simplifying
    assumptions must be removed for scale-up to energy-based services — the gap between
    a contingency FCAS bidding engine and one capable of market price response and
    energy dispatch optimisation is substantial and will require significant redevelopment.
