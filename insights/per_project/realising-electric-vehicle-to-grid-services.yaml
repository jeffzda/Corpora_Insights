  project_name: Realising Electric Vehicle-to-Grid Services (REVS)
  what_happened: Distribution network interviewees assessed that aggregator margins
    were too high relative to the value of demand response services delivered, with
    network deferral value estimated at only around 5–6% of total investment cost
    per year, meaning the business case for V2G-based network services through intermediaries
    was marginal at best.
  lesson_learnt: V2G intermediaries targeting distribution network services should
    calibrate revenue expectations carefully — network operators value demand response
    at approximately 5–6% of investment cost per year, which may not support typical
    aggregator margins; diversifying revenue across multiple service types (FCAS,
    retail arbitrage, data) is likely necessary to make the intermediary model commercially
    viable.
