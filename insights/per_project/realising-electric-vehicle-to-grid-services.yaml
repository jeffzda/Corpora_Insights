- record_id: ARENA-DLV-13506
  source_title: The A'Z of V2G
  publish_date: 2021-01
  project_name: AusNet Services / CSIRO Electric Vehicle to Grid Trial
  what_happened: Australia's first V2G trial, conducted by AusNet Services in collaboration
    with CSIRO in summer 2013/14, used a single converted Toyota Prius plug-in hybrid
    with a 11.8 kWh battery and 1.1 kW maximum discharge rate. When the vehicle returned
    home in the evening, coinciding with AusNet's summer peak demand due to residential
    air conditioning, it provided an average of 1.9 kWh to the home and achieved a
    significant reduction in the customer's peak demand, even after approximately
    33 km of driving.
  lesson_learnt: Even small V2G-capable vehicles returning home after a typical commute
    can provide meaningful peak demand reduction on distribution networks during summer
    evenings — fleet-level deployments with larger batteries and higher discharge
    rates would generate substantially greater network benefits.
