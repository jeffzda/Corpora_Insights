- record_id: ARENA-DLV-13525
  source_title: The A'Z of V2G
  publish_date: 2021-01
  project_name: V2G global review — metering and baselining requirements
  what_happened: The review found that metering requirements for V2G market participation
    in Australia present a significant barrier. Frequency control ancillary services
    (FCAS) provision requires frequency and power measured at 50 ms intervals or less.
    Demand response services rely on baselining methodologies that require accurate
    metering data to calculate the payment to service providers. Australia had limited
    smart meter penetration outside Victoria at the time of writing, and standard
    retail meters were insufficient for high-speed grid services.
  lesson_learnt: V2G projects targeting FCAS or other high-speed grid services must
    confirm upfront that metering infrastructure at the site meets the 50 ms measurement
    requirement — standard retail meters are incompatible, and metering upgrades can
    be a significant additional cost and approval step. Regulators should consider
    relaxing metering requirements for trials, as AEMO has done for VPP demonstrations.
