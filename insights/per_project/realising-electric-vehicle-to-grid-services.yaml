- record_id: ARENA-DLV-13507
  source_title: The A'Z of V2G
  publish_date: 2021-01
  project_name: Hornsdale Power Reserve (South Australia)
  what_happened: The Hornsdale Power Reserve, a 100 MW/129 MWh centralised battery
    in South Australia equivalent to approximately 14,300 EVs, reduced total FCAS
    costs by $80 million (contingency) and $36 million (regulation) in 2019. This
    single asset demonstrated that even modest amounts of flexible capacity can dramatically
    reshape FCAS market prices, compressing the price signals that would otherwise
    attract new entrants including V2G aggregators.
  lesson_learnt: FCAS markets are small and thin — a single large battery asset can
    compress market prices by 91%, destroying the revenue basis for other participants
    including V2G aggregators. V2G business cases relying on FCAS revenue must account
    for the risk that future battery storage investment will erode these margins significantly.
