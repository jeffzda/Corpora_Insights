- record_id: ARENA-DLV-13518
  source_title: The A'Z of V2G
  publish_date: 2021-01
  project_name: V2G global review — value stacking and day-ahead/real-time market
    incompatibility
  what_happened: Research found that certain combinations of V2G value streams are
    mutually exclusive because they require different dispatch profiles. One study
    specifically found that day-ahead energy market participation and real-time market
    participation were not compatible for battery storage, as both required bulk energy
    to be shifted in and out of the battery at conflicting times.
  lesson_learnt: V2G and battery storage aggregators planning to stack multiple value
    streams must carefully map the dispatch profiles of each target market before
    committing to a business model — some combinations (e.g. day-ahead and real-time
    energy arbitrage) are mutually exclusive and attempting both will degrade performance
    in each.
