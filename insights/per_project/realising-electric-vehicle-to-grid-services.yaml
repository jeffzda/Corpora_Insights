  source_title: Realising Electric Vehicle-to-Grid Services Crossing Sectors Report
  publish_date: 2022-06
  project_name: Realising Electric Vehicle-to-grid Services (REVS)
  what_happened: The REVS project did not generate any revenue from FCAS market participation
    due to its inability to reach the 1 MW minimum registration threshold. The originally
    scoped simple three-way revenue split between ActewAGL, ACT government, and JET
    Charge was therefore never operationalised. Charger subsidies and trial participation
    value were sufficient to sustain project participation.
  lesson_learnt: V2G demonstration projects that cannot meet minimum market capacity
    thresholds should define alternative value propositions for participants upfront
    — where revenue generation is the primary incentive and market participation proves
    impossible, explicit alternative value (e.g. subsidies, data value, capability
    building) must be secured in advance to maintain participant commitment.
