- record_id: ARENA-DLV-25163
  source_title: Realising Electric Vehicle-to-Grid Services Lessons Learnt 1
  publish_date: 2021-04
  project_name: Realising Electric Vehicle-to-grid Services (REVS)
  what_happened: Consortium members operated at very different speeds due to the differing
    operating environments — from a small flexible SME (JET Charge) to large government
    entities with complex governance, low risk appetite, and many stakeholders. This
    mismatch contributed to timing underestimates throughout the project.
  lesson_learnt: When a consortium spans organisations of very different size and
    governance complexity, explicitly model the slowest decision-making pathway when
    setting timelines — government entities with multiple stakeholders and low risk
    appetite will govern the critical path, not the fastest commercial partner.
