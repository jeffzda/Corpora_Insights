    as a high-potential grid services resource due to vehicle density and proximity
    to load centres, but remained almost entirely unstudied and untrialled in Australia
    as of late 2021.
  lesson_learnt: Fund demonstration projects for destination charging as a grid services
    resource — the combination of high vehicle density, long dwell times, and proximity
    to urban load centres makes commuter car parks and park-and-ride facilities a
    strong candidate for VGI that is analytically justified but empirically unproven
    in Australia.
