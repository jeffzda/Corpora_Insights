- record_id: ARENA-DLV-42823
  source_title: Realising Electric Vehicle-to-Grid Services Crossing Sectors Report
  publish_date: 2022-06
  project_name: Realising Electric Vehicle-to-grid Services (REVS)
  what_happened: 'V2G in fleet contexts introduces multiple unresolved Fringe Benefits
    Tax (FBT) implications under Australian tax law: workplace charging of private
    vehicles, employer-provided home chargers used for personal vehicles, and energy
    transportation between home and workplace via V2G-capable vehicles all potentially
    attract FBT liability. No explicit ATO rulings covered these scenarios at the
    time of the project.'
  lesson_learnt: Fleet V2G projects should seek ATO guidance or private rulings on
    FBT implications before deployment — workplace charging, employer-provided home
    chargers, and energy transportation scenarios all create potential FBT liabilities
    that are not covered by existing rulings, and uncertainty on tax treatment can
    be a barrier to fleet and employee participation.
