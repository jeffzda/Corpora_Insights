  source_title: REVS Interim Social Report
  publish_date: 2021-05
  project_name: Realising Electric Vehicle-to-grid Services (REVS)
  what_happened: A hardware constraint of the V2G charger meant the charging plug
    could not be disconnected while a V2G session was underway. This created a potential
    conflict between V2G operation and vehicle availability for drivers. The proposed
    software-side solution required drivers to use new booking steps in SG Fleet's
    Bookingintelligence system, and changed how trial vehicles were indexed in the
    pool booking system — both changes to driver workflow not applied to other fleet
    vehicles.
  lesson_learnt: Identify hardware constraints that affect vehicle availability before
    deployment and ensure software workarounds do not introduce workflow changes that
    discriminate between trial and non-trial vehicles — differential workflow burdens
    reduce trial vehicle utilisation and undermine V2G commercial viability.
