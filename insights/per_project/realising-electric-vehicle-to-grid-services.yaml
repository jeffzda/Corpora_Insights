  what_happened: The V2G chargers' total capacity exceeded evoenergy's 5 kW/phase
    maximum static connection limit, the existing connection standard did not accommodate
    V2G bidirectional flows, and CEC approval was structurally impossible. Three separate
    rule changes or exemptions were required to connect the chargers to the network,
    managed through trial-condition exemptions and dynamic operating envelopes based
    on ANU's evolve platform.
  lesson_learnt: V2G projects should anticipate that standard network connection rules
    will require multiple exemptions or waivers — early engagement with the distribution
    network operator to map all connection rule barriers (export limits, V2G direction,
    CEC approval) is essential, and existing dynamic operating envelope platforms
    (such as evolve) can be leveraged to partially resolve export limit constraints.
