- record_id: ARENA-DLV-42810
  source_title: Realising Electric Vehicle-to-Grid Services Crossing Sectors Report
  publish_date: 2022-06
  project_name: Realising Electric Vehicle-to-grid Services (REVS)
  what_happened: V2G chargers could not meet Clean Energy Council (CEC) approval requirements
    because the CEC classification of inverters requires compliance with AS/NZS 5139,
    which it is not possible for a vehicle-mounted battery to satisfy. Most distribution
    networks require CEC-approved inverters for grid connection. To allow the trial
    to proceed, Evoenergy granted an exemption to the CEC approval requirement — an
    exemption that may not be accessible for commercial deployments.
  lesson_learnt: V2G charger projects must engage the distribution network operator
    early regarding CEC inverter approval requirements — current Australian standards
    make CEC approval structurally impossible for vehicle-mounted battery systems,
    meaning trial exemptions are the only current pathway, and this regulatory gap
    must be resolved before commercial V2G deployment can proceed.
