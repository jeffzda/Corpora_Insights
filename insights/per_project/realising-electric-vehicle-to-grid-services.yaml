- record_id: ARENA-DLV-13530
  source_title: The A'Z of V2G
  publish_date: 2021-01
  project_name: V2G global review — battery temperature and degradation management
  what_happened: Research synthesised in the review found that battery degradation
    is strongly driven by temperature, charge/discharge rate (C-rate), and state of
    charge (SoC). Increasing operating temperature from 25°C to 35°C reduced battery
    life by nearly half (from 102 months to 58 months when providing frequency regulation
    services). Storing batteries at high SoC accelerated degradation. Frequent charging
    (charging whenever possible) also led to more degradation than morning charging
    before first use.
  lesson_learnt: V2G optimisation algorithms must manage battery temperature, state
    of charge, and charge timing as primary variables — charging in the morning just
    before first use, avoiding storage at high SoC, and keeping operating temperature
    near 25°C can extend battery life by years. V2G schemes that do not incorporate
    these constraints will accelerate battery degradation and erode the asset value
    of participants' vehicles.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: programmatic/portfolio-level
