  what_happened: Fleet managers were not provided with charger handover documentation
    or operational training when the unidirectional chargers were installed; handover
    was deferred until bidirectional chargers were installed. As a result, fleet managers
    were unaware of charger colour-coding meanings and had no clarity on how they
    would be notified of V2G sessions or charger faults.
