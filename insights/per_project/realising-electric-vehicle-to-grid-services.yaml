- record_id: ARENA-DLV-66420
  source_title: Realising Electric Vehicle-to-Grid Services Final Social Report
  publish_date: 2022-06
  project_name: Realising Electric Vehicle-to-Grid Services (REVS)
  what_happened: The availability management system for REVS relied on integration
    between vehicle booking data (Bookingintelligence) and charger status data, but
    some vehicles were not listed in the booking system because they were permanently
    assigned to specific drivers — creating a 'static booking envelope' assumption
    that those vehicles were always unavailable, regardless of actual charger connection
    status.
  lesson_learnt: V2G availability determination systems must accommodate diverse fleet
    booking practices, including vehicles not on centralised booking platforms — a
    static unavailability assumption for unbooked vehicles foregoes V2G revenue opportunities
    and should be replaced with charger-connection-based availability signals where
    booking data is absent.
  issue_severity: minor
  project_type: transport electrification
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
