  what_happened: The availability determination method for bidding REVS vehicles into
    the V2G market required each vehicle to be assigned to a dedicated charger, constraining
    fleet operational flexibility and creating conflicts with standard fleet management
    practice of parking vehicles interchangeably.
  lesson_learnt: V2G availability determination systems that rely on a fixed vehicle-to-charger
    mapping should be flagged to fleet managers at the design stage — the operational
    constraint of one vehicle per charger conflicts with standard fleet flexibility
    and must be compensated for through clear labelling, procedures and fleet manager
    buy-in before deployment.
