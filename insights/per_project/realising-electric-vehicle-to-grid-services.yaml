- record_id: ARENA-DLV-13526
  source_title: The A'Z of V2G
  publish_date: 2021-01
  project_name: V2G global review — distribution network value for congestion deferral
  what_happened: An extensive study by Sandia National Labs found that benefits from
    avoiding or postponing network upgrades using demand response (including V2G)
    can easily equal or exceed those from directly marketed ancillary services. However,
    in Australia most power system operators had no accessible mechanism for valuing
    upgrade deferrals, requiring case-by-case analysis. The RIT-D consultation process
    showed network congestion management revenue of around $268/kVA/year for smaller
    projects, but most larger network investments proceeded to capital solutions rather
    than demand response.
  lesson_learnt: V2G aggregators should target network congestion deferral as a value
    stream, particularly for smaller locational constraints — at ~$268/kVA/year this
    can match or exceed FCAS revenue and is less exposed to market saturation. However,
    the lack of standardised pricing mechanisms in Australia requires aggregators
    to conduct bespoke negotiations with each DNSP.
