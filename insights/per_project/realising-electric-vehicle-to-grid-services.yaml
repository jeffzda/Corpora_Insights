  project_name: Realising Electric Vehicle-to-Grid Services (REVS)
  what_happened: The REVS consortium's V2G niche development was found to have a clear
    long-term vision but no credible short-term pathway, with an absence of economic
    feasibility heuristics leaving technology developers and potential adopters unable
    to assess viability for their specific context.
  lesson_learnt: V2G trial projects should prioritise generating feasibility heuristics
    — simple, context-specific rules of thumb for assessing V2G viability at different
    premises and fleet types — as the absence of such heuristics is a key barrier
    preventing potential adopters from progressing beyond curiosity to commitment.
