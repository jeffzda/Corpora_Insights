- record_id: ARENA-DLV-13522
  source_title: The A'Z of V2G
  publish_date: 2021-01
  project_name: V2G global review — round-trip efficiency losses
  what_happened: Measurements of the full V2G supply chain found that total round-trip
    power losses at low current (10 A) were 17.22% for charging and 36.13% for discharging.
    The power electronic converter (PEC) and transformer were the dominant loss contributors.
    At higher currents (40 A), total losses were lower (12.38% charging, 29.18% discharging)
    but discharging remained significantly less efficient than charging. Commercially
    available chargers with high power ratings achieved 95–98.5% one-way efficiency.
  lesson_learnt: V2G business cases must account for round-trip efficiency losses
    of 30–36% at low power levels — the asymmetry between charging and discharging
    efficiency means V2G energy arbitrage is only viable when the price spread between
    buying and selling energy is sufficient to recover these losses plus a margin.
