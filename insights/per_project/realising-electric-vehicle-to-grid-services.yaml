- record_id: ARENA-DLV-32307
  source_title: REVS Interim Social Report
  publish_date: 2021-05
  project_name: Realising Electric Vehicle-to-grid Services (REVS)
  what_happened: The V2G concept involves three components from the end-user perspective
    — the V2G-enabled vehicle, the V2G-enabled charger, and the dedicated parking
    space — but the consortium's design framework considered only the vehicle and
    charger. Sites were already experiencing unauthorised parking in EV bays by petrol
    vehicles and members of the public, and the V2G charger's compatibility with only
    specific vehicles (Nissan LEAF) created additional parking management complexity.
  lesson_learnt: Design V2G and EV charging installations to include parking space
    management as a third system component — failure to clearly designate, communicate
    and enforce V2G-compatible bays creates utilisation risk and operational friction
    that can compromise trial outcomes.
