- record_id: ARENA-DLV-32310
  source_title: REVS Interim Social Report
  publish_date: 2021-05
  project_name: Realising Electric Vehicle-to-grid Services (REVS)
  what_happened: Future fleet end-users across different government organisations
    had substantially different motivations, fleet compositions, emissions targets,
    and organisational contexts — meaning no single V2G offering would suit all fleet
    customers. Some saw V2G as incompatible with core business (e.g. bus services
    requiring vehicles at short notice); others with power purchase agreements already
    in place saw limited revenue upside.
  lesson_learnt: V2G proponents should not design a single fleet offering — fleet
    customers' diverse goals, fleet compositions, and existing energy arrangements
    mean V2G must be tailored to specific organisational contexts, and the value proposition
    framed around each organisation's primary driver (emissions reduction, cost reduction,
    energy independence, etc.).
