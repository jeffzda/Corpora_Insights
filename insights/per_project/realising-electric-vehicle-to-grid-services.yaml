  source_title: Creating Value from V2G - Business Model Report
  publish_date: 2022-09
  project_name: Realising Electric Vehicle-to-Grid Services (REVS)
  what_happened: The REVS trial found that co-optimising transport and energy service
    needs for the same vehicle was technically complex and commercially uncertain
    — meeting energy system certainty requirements could conflict with transport availability,
    and there was no established methodology for quantifying the trade-off or guaranteeing
    both simultaneously.
  lesson_learnt: V2G intermediaries must develop explicit co-optimisation algorithms
    and contractual frameworks that define how transport energy needs are prioritised
    against grid service delivery — without clear rules for conflict resolution, both
    transport reliability and grid service certainty will be compromised, and no customer
    type will find the proposition acceptable.
