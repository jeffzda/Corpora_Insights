  evidence_excerpt: Site selection, rather than being an early decision, was a negotiation
    process. This led to site selection being settled relatively late in the process
    even though it has proven to be a significant driver of complexity. The features
    of the site, including electrical switchboard locations and layouts, site tenure
    (owner or lessee), and specific requirements of different sites has meant that
    technical requirements and approvals processes have emerged late in the piece
    and haven't always been replicable between sites.
