  source_title: Realising Electric Vehicle-to-Grid Services Final Social Report
  publish_date: 2022-06
  project_name: Realising Electric Vehicle-to-Grid Services (REVS)
  what_happened: Future fleet end-users interviewed held a widespread misconception
    that V2G necessarily drains vehicle batteries, when in fact the REVS implementation
    used V2G only for grid services that did not materially drain the battery. This
    misperception was a significant barrier to fleet adoption of V2G.
  lesson_learnt: V2G proponents must proactively and clearly communicate what their
    specific V2G implementation does and does not do to battery state-of-charge —
    the catch-all use of 'V2G' to describe multiple concepts with very different battery
    impacts creates unnecessary adoption resistance among fleet managers who prioritise
    vehicle availability.
