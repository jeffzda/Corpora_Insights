- record_id: ARENA-DLV-13509
  source_title: The A'Z of V2G
  publish_date: 2021-01
  project_name: Parker Project (Denmark)
  what_happened: Research across Nordic countries including the Parker Project found
    that only 10% of respondents had heard of V2G, and that low awareness — rather
    than strong negative views — was the primary barrier to uptake. Studies found
    that willingness to pay for V2G was only significant in Norway and Finland among
    Nordic countries, and that people applied a heavy 53.5% discount to projected
    V2G revenue in the US context, strongly preferring earn-as-you-go or upfront payment
    over fixed contractual terms.
  lesson_learnt: V2G trials and commercial programs must invest heavily in user awareness
    before expecting uptake — low awareness is the primary barrier, not active resistance.
    Remuneration schemes should offer earn-as-you-go or upfront payment rather than
    fixed contractual terms, as customers apply very high discount rates (50%+) to
    future projected savings.
