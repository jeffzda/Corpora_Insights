- record_id: ARENA-DLV-13519
  source_title: The A'Z of V2G
  publish_date: 2021-01
  project_name: V2G global review — FCAS market value concentration in critical days
  what_happened: Analysis of Queensland energy and FCAS market data from 2009–2020
    found that over one third of total energy arbitrage value in an average year was
    concentrated in the top five trading days. For FCAS, the top single day represented
    12% of annual value, with the next four days contributing a further 7%. This concentration
    means V2G business cases are highly dependent on capturing a small number of extreme
    price events.
  lesson_learnt: V2G and battery storage business cases that rely on energy arbitrage
    or FCAS revenue must explicitly model the dependence on a small number of extreme
    price events — over a third of annual energy arbitrage value can occur in just
    five days, and missing these events due to vehicle unavailability or market positioning
    can devastate project economics.
