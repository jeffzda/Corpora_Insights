  source_title: Realising Electric Vehicle-to-Grid Services Final Social Report
  publish_date: 2022-06
  project_name: Realising Electric Vehicle-to-Grid Services (REVS)
  what_happened: Future fleet end-users indicated that V2G adoption would only be
    acceptable if the intermediary or aggregator bore virtually all operational risk
    — including guaranteeing vehicle availability and battery state for transport
    — and if the system operated autonomously in the background without requiring
    fleet manager intervention.
  lesson_learnt: V2G business models targeting fleet operators must place all availability
    and battery risk on the intermediary and automate the system end-to-end — any
    arrangement that requires fleet managers to actively manage V2G sessions or accept
    residual availability risk will be rejected, as transport operational continuity
    takes absolute precedence.
