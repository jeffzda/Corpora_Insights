- record_id: ARENA-DLV-13516
  source_title: The A'Z of V2G
  publish_date: 2021-01
  project_name: V2G global review — battery degradation concerns
  what_happened: Multiple studies and surveys identified battery degradation concerns
    as a major barrier to V2G adoption among consumers, seemingly disproportionate
    to the actual magnitude of degradation observed. For example, Tesla batteries
    retained around 95.6% of original capacity after 50,000 km. Research showed that
    optimised V2G (managing state of charge between 38% and 21%, with V2G services
    using the 40%–8% range) can actually improve battery state of health by 3–6% over
    three months by keeping the battery at its optimal storage state of charge.
  lesson_learnt: V2G program designers should address battery degradation concerns
    proactively in customer communications, as perceived risk is disproportionate
    to actual impact — and well-optimised V2G can actually extend battery life compared
    to unmanaged charging by maintaining the battery in its optimal state-of-charge
    range.
