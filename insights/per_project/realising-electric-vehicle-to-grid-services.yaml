- record_id: ARENA-DLV-13511
  source_title: The A'Z of V2G
  publish_date: 2021-01
  project_name: Austin Energy EV360 (Texas, USA)
  what_happened: Austin Energy's EV360 time-of-use pricing trial successfully shifted
    virtually all EV charging outside times that would cause transmission pricing
    impacts. The trial used customer segmentation to send personalised marketing materials
    to participants, and found 83% of customers rated satisfaction 8/10 or higher.
    However, the coincident response to a fixed price signal at 7 PM created a sharp
    demand peak as all vehicles began charging simultaneously.
  lesson_learnt: Fixed time-of-use price signals for EV charging are highly effective
    at shifting demand but can create new coincident demand peaks that stress the
    network — staggered or randomised start times, or more dynamic pricing, are needed
    to prevent a new peak from simply replacing the old one.
