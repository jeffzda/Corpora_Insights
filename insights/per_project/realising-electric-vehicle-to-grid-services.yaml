  source_title: Realising Electric Vehicle-to-Grid Services Crossing Sectors Report
  publish_date: 2022-06
  project_name: Realising Electric Vehicle-to-grid Services (REVS)
  what_happened: The REVS project required development of a specialised local control
    box to enable chargers to respond to frequency events, as current-generation V2G
    chargers cannot natively respond to grid frequency in a way that complies with
    FCAS requirements. The control box also manages operating envelopes and orchestrates
    chargers. Satisfying the 50 ms FCAS recording requirement was challenging — only
    one commercially available 3-phase power meter could respond at that speed.
  lesson_learnt: V2G projects requiring FCAS-compliant frequency response must plan
    for custom hardware development (local control box) and should confirm availability
    of sub-50 ms power metering equipment early in procurement — the narrow commercial
    availability of compliant meters creates a procurement risk.
