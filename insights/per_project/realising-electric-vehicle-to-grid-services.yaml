  secondary_failure_mode: null
  intervention_note: Fleet managers identified the need to clearly mark V2G-compatible
    parking bays and ensure staff awareness of which vehicles and spaces were V2G-enabled.
  transferability: moderate
  delay_magnitude: null
  technology_domain: EV
