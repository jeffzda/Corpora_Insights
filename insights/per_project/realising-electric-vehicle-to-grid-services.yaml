  source_title: Realising Electric Vehicle-to-Grid Services Crossing Sectors Report
  publish_date: 2022-06
  project_name: Realising Electric Vehicle-to-grid Services (REVS)
  what_happened: Static connection agreements limited the amount of V2G capacity that
    could be exported to the grid. The REVS project prototyped dynamic operating envelopes
    (using ANU's evolve platform) that allowed chargers to export above the static
    5 kW/phase limit when the network was unconstrained. Envelopes were calculated
    offline (static) rather than in real-time, serving as a proof of concept for the
    technology.
  lesson_learnt: Future V2G deployments should adopt dynamic operating envelope frameworks
    from the outset — static export limits will materially constrain V2G value, and
    platforms such as ANU's evolve provide a proven pathway for deploying time-varying
    envelopes that unlock additional export capacity without requiring full real-time
    calculation in early implementations.
  issue_severity: moderate
