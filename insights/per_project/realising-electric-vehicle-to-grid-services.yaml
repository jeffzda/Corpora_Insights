  source_title: Case Study Grid Performance of a V2G Capable EV Charger
  publish_date: '2022'
  project_name: Realising Electric Vehicle-to-Grid Services (REVS)
  what_happened: The overvoltage 1 passive anti-islanding test (>265 V, 272 V applied)
    did not comply with AS4777.2:2020 — the inverter did not disconnect within the
    required maximum disconnection time of 2 seconds for this protection function,
    representing a specific non-compliance in an otherwise compliant test suite.
  lesson_learnt: V2G charger compliance with AS4777.2:2020 overvoltage protection
    thresholds cannot be assumed from manufacturer certification alone — the overvoltage
    1 (>265 V) disconnection timing should be independently verified in laboratory
    testing before field deployment, as this specific case showed non-compliance in
    an otherwise compliant unit.
