- record_id: ARENA-DLV-62067
  source_title: 'Electric Vehicles and The Grid: Analysis, Gaps and Recommendations'
  publish_date: 2022-01
  project_name: EV and VGI projects (Australia, portfolio-level)
  what_happened: Existing time-of-use EV retail tariffs in Australia were based on
    non-EV-specific network tariffs, meaning that as EV uptake increases static price
    signals will tend to shift demand to new peak periods rather than genuinely flattening
    the load curve — and no distribution networks were offering EV-specific network
    tariffs as of late 2021.
  lesson_learnt: Distribution networks should develop EV-specific dynamic network
    tariffs in parallel with EV uptake growth — static time-of-use signals designed
    for general demand will create new peaks as EV charging concentrates at the same
    'cheap' times, and dynamic signals need to be in place before penetration reaches
    problem levels.
