- record_id: ARENA-DLV-57764
  source_title: Creating Value from V2G - Business Model Report
  publish_date: 2022-09
  project_name: Realising Electric Vehicle-to-Grid Services (REVS)
  what_happened: Distribution network operators expressed concern about the locational
    specificity of network congestion — congestion can occur at any point in the network
    and may affect only a single low-voltage feeder serving as few as one to a few
    hundred customers, meaning V2G resources must be co-located with the congestion
    point, which dramatically reduces the effective market size for any given deployment.
  lesson_learnt: V2G projects targeting distribution network congestion services must
    demonstrate co-location of V2G resources with specific congestion points — the
    highly localised nature of distribution constraints means that fleet or community
    deployments concentrated in relevant geographic areas are more viable for this
    revenue stream than dispersed private vehicle portfolios.
