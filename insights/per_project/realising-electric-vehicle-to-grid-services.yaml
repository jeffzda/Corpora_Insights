  source_title: Realising Electric Vehicle-to-Grid Services Lessons Learnt 1
  publish_date: 2021-04
  project_name: Realising Electric Vehicle-to-grid Services (REVS)
  what_happened: EV charging occupies a novel intersection between electricity and
    transport sectors for which no common language yet exists. Consortium members
    — drawn from both sectors — found themselves continually acting as translators
    across domains, sometimes mistranslating or missing the significance of issues
    at the pertinent time.
  lesson_learnt: In multi-sector EV or V2G consortia, explicitly establish shared
    terminology and cross-sector communication protocols at the outset — the absence
    of a common language between electricity and transport domains causes misunderstandings
    and delayed recognition of critical issues.
