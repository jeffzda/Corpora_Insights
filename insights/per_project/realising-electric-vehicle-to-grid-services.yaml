- record_id: ARENA-DLV-13508
  source_title: The A'Z of V2G
  publish_date: 2021-01
  project_name: Electric Nation (Western Power Distribution, UK)
  what_happened: The Electric Nation project found that, contrary to utility expectations,
    customer satisfaction with EV charging arrangements did not decline when charging
    was managed remotely. Before managed charging, 78% of participants rated satisfaction
    8/10 or higher; after managed charging, this slightly increased to 79%. The project
    also found that EV charging is highly flexible — peak flexibility coincided well
    with evening network peaks, making demand management highly effective.
  lesson_learnt: Utilities should not assume customers will resist remote management
    of EV charging — evidence from the Electric Nation project shows satisfaction
    is maintained or slightly improved, provided the scheme is designed with customer
    convenience in mind. EV charging flexibility peaks during evening hours, making
    it a powerful tool for managing distribution network peaks.
