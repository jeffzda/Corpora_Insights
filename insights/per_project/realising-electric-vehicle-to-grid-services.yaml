- record_id: ARENA-DLV-13505
  source_title: The A'Z of V2G
  publish_date: 2021-01
  project_name: My Electric Avenue (UK)
  what_happened: The My Electric Avenue project involving 200 EVs in southern UK found
    that unmanaged EV charging could double localised peak demand, and projected that
    32% of low-voltage feeders across Britain would require reinforcement by 2050
    if charging remained unmanaged at 40–70% EV penetration. The trial used older-generation
    Nissan Leaf vehicles with 3.3 kW chargers; modern EVs commonly charge at double
    this rate, implying the problem would be worse with newer hardware.
  lesson_learnt: Network planners should assume unmanaged EV charging will approximately
    double localised peak demand at 50%+ EV penetration, necessitating either network
    reinforcement or mandatory smart charging — deploying managed charging alongside
    EV uptake is critical to avoid costly distribution network upgrades.
