  evidence_excerpt: To deliver FCAS, the charger must keep a charge session always
    active. This has an inadvertent impact on usage processes. For safety reasons,
    the vehicle locks the charge connector into the vehicle when a charge session
    is active. This prevents drivers from simply unplugging the vehicle and driving
    it as they would using existing processes.
