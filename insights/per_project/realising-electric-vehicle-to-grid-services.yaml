- record_id: ARENA-DLV-13502
  source_title: The A'Z of V2G
  publish_date: 2021-01
  project_name: Parker Project (Denmark)
  what_happened: The Parker Project in Denmark demonstrated V2G frequency regulation
    services but found that EVs had a 3-second delay in ramping power output, and
    power output errors of 8.7% for charging and 5.2% for discharging. The frequency
    control service was also found to be unprofitable under current Danish taxation
    and tariff rules, at best breaking even even without energy consumption taxes.
  lesson_learnt: V2G frequency control projects must account for response latency
    in charger power electronics and communications (measured at 3 seconds in the
    Parker Project) and must verify that energy taxation and tariff structures do
    not make the service commercially unviable before committing to a market participation
    business model.
