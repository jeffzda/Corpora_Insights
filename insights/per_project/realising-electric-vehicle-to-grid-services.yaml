- record_id: ARENA-DLV-42404
  source_title: Case Study Grid Performance of a V2G Capable EV Charger
  publish_date: '2022'
  project_name: Realising Electric Vehicle-to-Grid Services (REVS)
  what_happened: The Wallbox Quasar charger's firmware did not implement reactive
    power control, meaning the Q-V voltage management mode required by AS4777.2:2020
    and beneficial for constrained distribution grid operation was entirely unavailable,
    despite the underlying hardware being a four-quadrant inverter capable of providing
    reactive power.
  lesson_learnt: Hardware capability alone is insufficient for reactive power grid
    services from V2G chargers — firmware must also implement the control mode. Procurement
    specifications for V2G chargers should explicitly require firmware-level Q-V reactive
    power control, not just four-quadrant hardware, before committing to grid service
    contracts that depend on it.
