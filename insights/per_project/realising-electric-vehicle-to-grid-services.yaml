  project_name: Realising Electric Vehicle-to-grid Services (REVS)
  what_happened: Trial end-users reported insufficient communication about the trial's
    activities, timeline and operations. Fleet and facilities managers did not know
    what reporting would be required of them, how the V2G system would work in practice,
    or when key milestones would occur — making it difficult for them to ask the right
    questions or prepare their teams.
  lesson_learnt: Establish a dedicated communication resource or cadence for trial
    end-users from project outset — without proactive and detailed communication paced
    to the project timeline, trial participants become confused and frustrated, which
    can undermine cooperation and operational readiness.
