  publish_date: 2022-06
  project_name: Realising Electric Vehicle-to-Grid Services (REVS)
  what_happened: Fleet organisations transitioning to zero-emissions transport were
    simultaneously evaluating multiple competing technologies (battery EVs, hydrogen
    fuel cells, different bidirectional charging concepts), creating an opportunity
    cost dynamic that made committing to V2G — a second-step technology after electrification
    — difficult to justify in the near term.
  lesson_learnt: V2G proponents should position V2G as compatible with fleet EV transition
    rather than an additional commitment — organisations that have not yet completed
    basic electrification are unlikely to invest attention in V2G, and the risk of
    technology lock-in means they may not revisit the question soon after investing
    in EVs.
