- record_id: ARENA-DLV-13529
  source_title: The A'Z of V2G
  publish_date: 2021-01
  project_name: V2G global review — NEM two-sided market and demand-side participation
    gaps
  what_happened: The review found that the National Electricity Rules (NER) in Australia
    created significant barriers to grid services from distributed resources including
    V2G. Minimum participation thresholds, metering requirements, rules that penalise
    energy storage (devices that both charge and discharge), and lack of recognition
    of resilience benefits all constrained V2G market participation. Australia was
    undertaking consultation on two-sided market design at the time of writing, but
    no rule changes had yet been implemented.
  lesson_learnt: 'Energy market rule-makers should prioritise removing barriers to
    V2G participation including: lowering the 1 MW participation threshold, removing
    rules that inadvertently penalise bidirectional devices, and creating explicit
    mechanisms for distribution network flexibility services — without these reforms,
    V2G will remain confined to trials and cannot scale commercially.'
