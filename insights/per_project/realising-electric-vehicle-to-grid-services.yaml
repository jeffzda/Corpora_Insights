  source_title: Creating Value from V2G - Business Model Report
  publish_date: 2022-09
  project_name: Realising Electric Vehicle-to-Grid Services (REVS)
  what_happened: Distribution network operators largely viewed bilateral demand response
    contracts with intermediaries as a transitional mechanism, expecting that in the
    long term cost-reflective network pricing and operating envelopes would replace
    intermediaries as the vehicle for managing EV loads, meaning their appetite for
    ongoing intermediary contracts was limited.
  lesson_learnt: V2G intermediaries should not rely on distribution network bilateral
    contracts as a long-term revenue base — DNSPs see these as transitional; sustainable
    intermediary business models need to be built around serving EV owners and financial
    participants who will remain customers after network pricing reform removes the
    DNSP's need for direct intermediary relationships.
