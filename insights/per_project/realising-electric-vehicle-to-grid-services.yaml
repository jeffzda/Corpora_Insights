- record_id: ARENA-DLV-13501
  source_title: The A'Z of V2G
  publish_date: 2021-01
  project_name: Realising Electric Vehicle-to-grid Services (REVS)
  what_happened: The REVS project demonstrated V2G frequency control (FCAS) using
    51 Nissan LEAF EVs in the ACT as part of government and ActewAGL fleets. The project
    found that V2G technology requires compliance with AS/NZS 4777 grid connection
    standards, which were not originally designed for bidirectional distributed resources
    and needed validation for V2G-specific use cases.
  lesson_learnt: Grid connection standards such as AS/NZS 4777 must be explicitly
    validated for V2G use cases before deployment — imported bidirectional chargers
    require testing against Australian/NZ standards, and standards bodies should proactively
    ensure these do not inadvertently block V2G operation.
