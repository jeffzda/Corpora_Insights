- record_id: ARENA-DLV-13504
  source_title: The A'Z of V2G
  publish_date: 2021-01
  project_name: BMW ChargeForward (PG&E, California)
  what_happened: The BMW ChargeForward project demonstrated managed EV charging and
    second-life EV batteries participating in Californian day-ahead and real-time
    energy markets. EV availability during demand response events was highly variable
    — on average only 7 of 100 vehicles were available per event, providing 0.2 kW
    per vehicle against a rated 4.4 kW. A key cause was that 60% of participants were
    on a time-of-use tariff incentivising night charging, while most events were called
    between 8–9 PM.
  lesson_learnt: When designing V2G or managed-charging demand response programs,
    ensure that participant tariff structures align with the timing of grid service
    events — misaligned price signals can reduce effective EV participation to well
    below 10% of the enrolled fleet during events.
