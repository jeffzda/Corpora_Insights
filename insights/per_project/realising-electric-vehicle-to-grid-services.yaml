  source_title: Realising Electric Vehicle-to-Grid Services Lessons Learnt 1
  publish_date: 2021-04
  project_name: Realising Electric Vehicle-to-grid Services (REVS)
  what_happened: The original project timelines proved optimistic across multiple
    fronts. Risk dependencies were insufficiently explored and back-up plans not developed,
    meaning a single delay caused unforeseen roll-on effects throughout the project
    schedule.
  lesson_learnt: Map interdependencies between workstreams explicitly at the outset
    and develop back-up plans for key assumptions — a single delay in a V2G trial
    can cascade across vehicle delivery, charger installation, and site approvals
    simultaneously, compounding schedule slippage.
