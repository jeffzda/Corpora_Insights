    the dominant barriers to V2G participation, with participants concerned about
    whether an intermediary would fairly manage their vehicle, impact their range,
    or share their data without consent — these concerns outweighed financial motivations
    for many potential participants.
  lesson_learnt: V2G products targeting private EV owners must prioritise trust and
    convenience as primary design criteria over financial return — range protection
    guarantees, transparent data governance, opt-out mechanisms, and simple interfaces
    are prerequisites for mainstream adoption, not optional features; early adopters
    motivated by environmental values and curiosity are not representative of the
    broader market.
