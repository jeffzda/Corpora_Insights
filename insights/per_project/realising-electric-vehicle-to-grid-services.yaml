- record_id: ARENA-DLV-13524
  source_title: The A'Z of V2G
  publish_date: 2021-01
  project_name: V2G global review — V2G cost premium barrier
  what_happened: The review found that V2G-capable EVs cost approximately $1,000 more
    than comparable non-V2G vehicles, and that bidirectional chargers were substantially
    more expensive than unidirectional equivalents. Smart charger costs could double
    hardware costs compared to dumb chargers. Few government incentive schemes provided
    additional subsidy for V2G over standard smart chargers (e.g. the UK Electric
    Vehicle Homecharge Scheme required smart charging but provided no additional support
    for V2G). Most V2G projects provided a charger as part of participation, subsidised
    by grant funding.
  lesson_learnt: Government funding programs for EV charging should include targeted
    incentives for V2G-capable chargers beyond the baseline for smart chargers — without
    this cost bridge, the incremental capital cost of V2G capability is unlikely to
    be borne by private buyers, and the technology will remain confined to grant-funded
    trials.
