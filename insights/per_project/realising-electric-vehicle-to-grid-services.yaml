  what_happened: Australian fast charging rollouts as of late 2021 had not explicitly
    focused on grid integration enablers, meaning chargers with large local network
    impacts were being deployed without demand management or operating envelope capability
    — with only one exception (Chargefox Goulburn with battery and dynamic operating
    envelope).
  lesson_learnt: Fast charger deployments should include grid integration measures
    (such as dynamic operating envelopes or local storage) as standard, not as an
    exception — the Chargefox Goulburn site demonstrates this is technically feasible
    and provides a replicable model.
