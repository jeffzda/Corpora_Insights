  project_name: Realising Electric Vehicle-to-grid Services (REVS)
  what_happened: At the time of writing, only Nissan explicitly supported V2G in their
    vehicle warranty. Even this support is conditional on use of approved chargers
    and compliance with usage guidelines (maximum 1 cycle/day, 11 kW power rate limit).
    Most other vehicle manufacturers provided no warranty support for V2G, making
    fleet adoption of V2G on non-Nissan vehicles carry unquantified battery degradation
    and resale value risk.
  lesson_learnt: V2G fleet programs should only be deployed on vehicles where the
    manufacturer explicitly warranties V2G use with approved equipment — deploying
    V2G on vehicles without manufacturer warranty support (such as Mitsubishi Outlander)
    exposes the fleet owner to unindemnified battery degradation and reduced resale
    value, and the cost of any damage sits entirely with the vehicle owner or lessor.
