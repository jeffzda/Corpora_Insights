  source_title: Realising Electric Vehicle-to-Grid Services Crossing Sectors Report
  publish_date: 2022-06
  project_name: Realising Electric Vehicle-to-grid Services (REVS)
  what_happened: Revenue sharing arrangements in the REVS trial were planned as a
    simple equal three-way split between ActewAGL, JET Charge, and ACT Government.
    Given no revenue was generated and the trial scale was small, this arrangement
    was never contentious. However, the report identifies that at scale, revenue sharing
    will require significantly more sophistication — including risk/revenue trade-off
    consideration, benefit distribution transparency, and potential regulatory oversight.
  lesson_learnt: V2G programs beyond trial scale must develop explicit, transparent
    revenue and risk sharing frameworks before commercial launch — the simple equal-split
    approach acceptable in small trials is insufficient when revenues are material,
    multiple value chain participants have different risk exposures, and fleet owners
    and energy retailers need to understand the basis of revenue distribution to commit
    to participation.
