- record_id: ARENA-DLV-42807
  source_title: Realising Electric Vehicle-to-Grid Services Crossing Sectors Report
  publish_date: 2022-06
  project_name: Realising Electric Vehicle-to-grid Services (REVS)
  what_happened: The design assumption that FCAS services could be delivered without
    drivers needing to alter their vehicle usage processes proved incorrect. To maintain
    fast FCAS response, the charger must keep a charge session permanently active,
    which causes the vehicle to lock the charge connector into the socket. This prevented
    drivers from simply unplugging and driving as they normally would.
  lesson_learnt: V2G projects that rely on always-active charge sessions for fast
    FCAS response must account for the vehicle-side implications of connector locking
    — this directly affects driver workflow and requires a charger-release mechanism
    (such as RFID card tap or automated booking system integration) to be designed
    into the system from the outset.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: 'Two workarounds were implemented: booked vehicles were automatically
    unlocked via a connection between JET Charge and SGFleet''s booking system; unbooked
    vehicles were released by the driver tapping an RFID card on the charger after
    Wallbox updated the charger firmware.'
  transferability: moderate
  delay_magnitude: null
  technology_domain: EV
  source_pages: &id093
