  technology_domain: EV
  source_pages: &id205
  - 17
  evidence_excerpt: some vehicles are not listed on Bookingintelligence because they
    are always in use by the same person during their shifts, and listing them would
    add needless overhead... These cars are assumed by the retailer to always be unavailable
    during the regular shift which is typically daytime on weekdays. This approach
    is termed a 'static booking envelope'.
