- record_id: ARENA-DLV-13527
  source_title: The A'Z of V2G
  publish_date: 2021-01
  project_name: V2G global review — cross-sector stakeholder complexity
  what_happened: The review identified that V2G sits at the intersection of the transport
    and energy sectors, which have historically operated as completely separate systems
    with different norms, practices, regulatory requirements, and business relationships.
    Transport sector actors (OEMs, fleet managers, car dealers, fuel companies) had
    no experience generating revenue from vehicle assets beyond mobility services,
    while energy sector actors lacked familiarity with automotive supply chains and
    consumer transport values. This sector coupling created significant coordination
    and communication challenges across V2G trials.
  lesson_learnt: V2G projects should establish structured cross-sector collaboration
    mechanisms from the outset — the energy and transport sectors operate with fundamentally
    different assumptions, and trials that lack explicit bridging between these sectors
    frequently fail to capture the full value chain or encounter unexpected barriers
    at the intersection points.
