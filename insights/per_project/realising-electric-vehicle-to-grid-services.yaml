  publish_date: 2022-12
  project_name: Realising Electric Vehicle to Grid Services (REVS)
  what_happened: The study found that emissions optimisation of V2G caused EV charging
    to coincide with morning and evening electricity demand peaks (when marginal grid
    emissions were lowest in NSW 2019), which is counterproductive to grid management
    objectives and increases peak demand compared to other charging strategies.
  lesson_learnt: Grid operators should be aware that emissions-optimised EV charging
    based on marginal emissions signals can worsen peak demand and conflict with network
    management objectives under current grid conditions. Regulatory frameworks for
    V2G should not assume emissions optimisation and grid optimisation are aligned
    goals.
