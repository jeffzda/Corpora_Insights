  what_happened: The REVS trial operated using 51 Nissan LEAF EVs providing contingency
    FCAS services through the ACT Government and ActewAGL fleet, with the ACT Government
    and ActewAGL fleet structure providing predictable vehicle availability that underpinned
    the FCAS service delivery model — the government/fleet context was critical to
    making the use case work at trial scale.
