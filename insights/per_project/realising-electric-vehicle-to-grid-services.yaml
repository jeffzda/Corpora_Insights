  project_name: Realising Electric Vehicle-to-grid Services (REVS)
  what_happened: The REVS project developed the charger control cloud in-house as
    project partners, rather than procuring a commercial off-the-shelf solution. This
    enabled the cloud system to adapt flexibly to unexpected requirements that emerged
    during the project, including changes to vehicle integration logic, operating
    envelope implementation, and charger release mechanisms.
  lesson_learnt: In first-of-kind V2G trials, developing key control software (such
    as the charger management cloud) within the project consortium — rather than relying
    entirely on commercial platforms — provides critical flexibility to adapt to unforeseen
    requirements; the nature of trials means that not all needs can be known at project
    outset.
