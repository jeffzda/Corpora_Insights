  source_title: REVS Interim Social Report
  publish_date: 2021-05
  project_name: Realising Electric Vehicle-to-grid Services (REVS)
  what_happened: The REVS consortium's approach to V2G involved assimilating the new
    technology into existing knowledge frameworks for solar, batteries, and standard
    EV chargers. While this enabled practical progress, researchers noted the risk
    that this assimilationist approach could prevent V2G from developing into its
    own best-fitting use cases, leaving it vulnerable to competition from existing
    DER and standard charger technologies.
  lesson_learnt: When developing novel energy technologies, project teams should actively
    seek settings and use cases beyond those analogous to familiar technologies —
    relying solely on existing knowledge heuristics risks locking in suboptimal designs
    and foreclosing on use cases that might better serve end-users.
