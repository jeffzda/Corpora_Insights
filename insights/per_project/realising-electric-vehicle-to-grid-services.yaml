  project_name: Realising Electric Vehicle-to-grid Services (REVS)
  what_happened: The ACT Government was treated as a single entity in the project
    structure, but it is functionally composed of multiple Directorates each with
    their own decision-making processes, fleet managers, requirements, and locations.
    This resulted in significant unexpected effort from multiple negotiations and
    made the project structure fundamentally more complex.
  lesson_learnt: When a government body is a consortium partner, identify and engage
    all relevant Directorates or sub-entities individually at the outset — treating
    government as a monolith creates hidden decision-making delays and multiplies
    negotiation overhead across sites and approvals.
