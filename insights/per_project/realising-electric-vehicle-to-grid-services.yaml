  outcome_class: delayed but recoverable
  secondary_failure_mode: null
  intervention_note: Team proposed treating REVS as a portfolio of interdependent
    projects managed by a central PMO to better accommodate different organisational
    speeds.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: EV
  source_pages: &id043
