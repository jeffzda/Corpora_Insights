  source_title: Modelling V2G Simulation - A Study of the Economic and Technical Value
    Proposition
  publish_date: 2022-12
  project_name: Realising Electric Vehicle to Grid Services (REVS)
  what_happened: Optimising V2G to minimise carbon emissions increased overall site
    energy costs significantly compared to price-optimised or convenience charging,
    and counterintuitively reduced PV self-consumption because the marginal generator
    during peak PV generation periods was often a high-emissions coal plant, making
    it preferable to export PV to the grid rather than self-consume.
  lesson_learnt: Organisations intending to sell emissions-optimised V2G services
    should clearly disclose to customers that emissions minimisation targets will
    increase energy costs and reduce PV self-consumption under current grid conditions
    — these outcomes are likely to conflict with customer expectations and could undermine
    trust in the product.
