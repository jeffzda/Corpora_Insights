- record_id: ARENA-DLV-64915
  source_title: Modelling V2G Simulation - A Study of the Economic and Technical Value
    Proposition
  publish_date: 2022-12
  project_name: Realising Electric Vehicle to Grid Services (REVS)
  what_happened: Feed-in credits in the dynamic pricing tariff (a $1.95/kWh export
    rebate during critical peak events) produced minimal and inconsistent demand response
    from V2G-equipped vehicles. Analysis showed that observed response was largely
    coincidental with energy price movements rather than a direct response to the
    feed-in credit itself.
  lesson_learnt: Network businesses should not rely on export rebate or feed-in credit
    mechanisms as a primary tool for dispatching V2G response during critical peak
    events — the demand response is too weak and unreliable. Demand tariffs or direct
    dispatch signals are more effective tools for eliciting controllable V2G grid
    services.
