  source_title: Creating Value from V2G - Business Model Report
  publish_date: 2022-09
  project_name: Realising Electric Vehicle-to-Grid Services (REVS)
  what_happened: Financial participants (energy retailers and aggregators) faced increasing
    price and load volatility as solar PV hollowed out midday demand while EVs threatened
    to intensify evening peaks — V2G was identified as a potential hedging tool but
    its reliability for this purpose remained uncertain, with the transport-energy
    trade-off unresolved.
  lesson_learnt: V2G projects seeking to generate revenue from energy market hedging
    must demonstrate multi-asset portfolio integration — individual V2G fleets are
    unlikely to provide sufficient certainty for hedging instruments alone; financial
    participants will require V2G to complement other asset types (batteries, demand
    response) to achieve the portfolio certainty they need.
