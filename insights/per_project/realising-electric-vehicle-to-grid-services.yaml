  what_happened: 'The REVS trial demonstrated a ''chicken and egg'' problem for V2G
    intermediaries: grid operators and financial participants would not sign service
    agreements unless sufficient V2G-capable vehicle capacity already existed, but
    intermediaries could not procure that capacity without confirmed revenue, creating
    a market formation deadlock.'
  lesson_learnt: V2G intermediaries must develop strategies to resolve the chicken-and-egg
    platform bootstrapping problem before approaching grid operators for contracts
    — options include upfront equipment subsidies from grid operators, partnering
    with financial participants to fund charger capital, or aggregating capacity across
    multiple customer types to reach the threshold needed for grid operator confidence.
