- record_id: ARENA-DLV-42804
  source_title: Realising Electric Vehicle-to-Grid Services Crossing Sectors Report
  publish_date: 2022-06
  project_name: Realising Electric Vehicle-to-grid Services (REVS)
  what_happened: AS/NZS 4777 certification for the Wallbox Quasar V2G charger required
    three separate testing events with rectification work by the charger manufacturer
    between each, because the Australian standard was more onerous than the EU and
    UK standards the charger was originally designed for. The standard's requirement
    for an earthed load was incompatible with the EV's portable battery configuration,
    creating ground loop noise exceeding the standard's limits, requiring electrical
    and mechanical modifications to the charger.
  lesson_learnt: Before selecting V2G charger hardware, confirm that it either already
    holds AS/NZS 4777 certification or that the certification pathway is feasible
    within the project timeline — the Australian standard imposes requirements substantially
    more onerous than EU/UK equivalents, and rectification across multiple test cycles
    can cause significant project delays. If no compliant charger exists, build extended
    certification time into the project schedule or pursue trial-specific approval
    from the network operator.
  issue_severity: major
  project_type: transport electrification
  project_scale_band: demonstration
