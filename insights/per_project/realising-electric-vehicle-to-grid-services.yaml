- record_id: ARENA-DLV-57767
  source_title: Creating Value from V2G - Business Model Report
  publish_date: 2022-09
  project_name: Realising Electric Vehicle-to-Grid Services (REVS)
  what_happened: The REVS project demonstrated that fleet operators are among the
    most viable early adopters of V2G because fleet vehicles have more predictable
    usage patterns, centralised ownership decisions, and existing energy cost reduction
    objectives — but only when V2G value is framed in terms of Total Cost of Ownership
    reduction rather than raw energy or grid revenue.
  lesson_learnt: When targeting fleet operators for V2G, intermediaries should present
    all financial benefits in Total Cost of Ownership terms, including V2G revenue
    as a TCO offset — fleet managers use TCO as their primary procurement metric,
    and framing V2G benefits in other terms (energy cost, grid revenue) will fail
    to connect with their decision-making framework and approval processes.
