  source_title: Realising Electric Vehicle-to-Grid Services Lessons Learnt 2
  publish_date: 2022-05
  project_name: Realising Electric Vehicle-to-Grid Services (REVS)
  what_happened: The REVS project engaged a non-Australian (overseas) hardware vendor
    — Wallbox — as the charger supplier rather than as an active trial participant.
    The vendor's limited familiarity with AS/NZS 4777.2:2020 and the arm's-length
    commercial relationship contributed to the extended certification timeline and
    the difficulty resolving hardware compliance issues under COVID constraints.
  lesson_learnt: For trials involving novel hardware that must be certified against
    Australian standards, engaging a local (preferably Australian) vendor as an active
    trial participant — rather than a remote supplier — substantially reduces the
    risk of certification delays caused by unfamiliarity with Australian requirements
    and limits on vendor responsiveness.
