- record_id: ARENA-DLV-64908
  source_title: Modelling V2G Simulation - A Study of the Economic and Technical Value
    Proposition
  publish_date: 2022-12
  project_name: Realising Electric Vehicle to Grid Services (REVS)
  what_happened: The study used perfect foresight of both future energy prices and
    vehicle trip schedules in its optimisation model, which is not achievable in real-world
    V2G deployments. This means the modelled V2G benefits represent an upper bound
    and actual real-world benefits will be lower, with the magnitude of the gap left
    unquantified.
  lesson_learnt: Future V2G feasibility studies and business cases must account for
    forecast imperfection — for both energy prices and vehicle usage patterns — when
    projecting returns. Results from perfect-foresight models should be explicitly
    discounted, and follow-on work should model realistic forecast accuracy to establish
    a credible lower bound on V2G value.
