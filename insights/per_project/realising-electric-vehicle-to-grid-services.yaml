- record_id: ARENA-DLV-66416
  source_title: Realising Electric Vehicle-to-Grid Services Final Social Report
  publish_date: 2022-06
  project_name: Realising Electric Vehicle-to-Grid Services (REVS)
  what_happened: Fleet organisations retrofitting EV charging infrastructure at existing
    sites encountered significant constraints including limited space, insufficient
    electrical capacity, and the need to accommodate new maintenance skill sets for
    EV servicing that their existing diesel-mechanic workforce could not provide.
  lesson_learnt: Fleet electrification and V2G readiness assessments must include
    a site infrastructure audit (space, electrical capacity) and a workforce capability
    assessment (maintenance skills) at the planning stage — both are commonly overlooked
    and can materially delay or constrain deployment at retrofit sites such as hospitals
    and government depots.
