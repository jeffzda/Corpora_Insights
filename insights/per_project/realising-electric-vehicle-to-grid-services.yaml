- record_id: ARENA-DLV-57768
  source_title: Creating Value from V2G - Business Model Report
  publish_date: 2022-09
  project_name: Realising Electric Vehicle-to-Grid Services (REVS)
  what_happened: The REVS trial and stakeholder interviews revealed that V2G service
    validation and baselining methodology significantly affects how risk is allocated
    between intermediaries and grid operators — the choice of measurement point (vehicle
    charger vs. dwelling connection point) determines who bears the risk of unexpected
    home consumption, vehicle absence, or charger failure.
  lesson_learnt: Negotiate measurement point and baselining methodology explicitly
    in V2G service contracts before deployment — these technical choices have major
    commercial consequences for risk allocation; a dwelling-level measurement point
    transfers site consumption risk to the intermediary, while charger-level measurement
    transfers it to the grid operator, and the choice will materially affect the economics
    and risk profile of the arrangement.
