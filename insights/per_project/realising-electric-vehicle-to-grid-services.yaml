- record_id: ARENA-DLV-32313
  source_title: REVS Interim Social Report
  publish_date: 2021-05
  project_name: Realising Electric Vehicle-to-grid Services (REVS)
  what_happened: Future private EV users expressed a strong preference for vehicle-to-building
    (V2B) over vehicle-to-grid (V2G) configurations, primarily wanting the EV battery
    to serve their home energy needs. Key barriers to V2G included the vehicle not
    always being home, not wanting the car battery drained before a journey, and preferring
    a stationary battery that is always present.
  lesson_learnt: V2G product designers should prioritise V2B functionality and home
    energy security as the primary value proposition for private consumers — offering
    grid services as an opt-in co-benefit rather than the primary use case is more
    likely to align with consumer preferences and drive adoption.
