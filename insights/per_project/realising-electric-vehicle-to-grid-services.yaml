  source_title: Realising Electric Vehicle-to-Grid Services Crossing Sectors Report
  publish_date: 2022-06
  project_name: Realising Electric Vehicle-to-grid Services (REVS)
  what_happened: The project intended to bid REVS V2G chargers into the live FCAS
    market by combining them with other existing resources to meet the 1 MW minimum
    capacity requirement. During the trial it became apparent that the additional
    capacity from other resources would not be available, preventing market registration.
    As a result, the chargers did not provide FCAS in the live market and no revenue
    was generated, though data collection continued.
  lesson_learnt: V2G trials relying on aggregation with third-party resources to meet
    minimum market capacity thresholds (e.g. 1 MW for FCAS) should secure binding
    commitments from aggregation partners before project design is finalised — loss
    of a third-party resource can prevent market participation entirely and eliminate
    the revenue case.
