  source_title: Realising Electric Vehicle-to-Grid Services Crossing Sectors Report
  publish_date: 2022-06
  project_name: Realising Electric Vehicle-to-grid Services (REVS)
  what_happened: The design assumption that V2G chargers would respond quickly to
    FCAS raise events proved incorrect. In early tests, the charger response time
    was 13 seconds for some scenarios due to CHAdeMO communication handshakes between
    the charger and vehicle, far slower than the near-instantaneous inverter response
    expected. This was partially improved to 4 seconds by maintaining a permanent
    active charge session, but this introduced the connector-lock usability issue.
  lesson_learnt: V2G charger response speed must be validated in real hardware integration
    tests before project design is finalised — CHAdeMO protocol handshake latency
    can produce 13-second response times incompatible with FCAS requirements; the
    workaround of maintaining permanent active sessions resolves speed but creates
    other operational constraints that must be designed for.
