- record_id: ARENA-DLV-33259
  source_title: Assessment of FCAS Capabilities of a V2G Capable EV Charger - A Case
    Study
  publish_date: 2022-06
  project_name: Realising Electric Vehicle-to-Grid Services (REVS)
  what_happened: When battery SOC exceeded 90% (the upper limit of the FCAS participation
    range set at 30–90%), the FCAS controller prevented the charger from participating
    in FCAS lower services and instead caused the charger to discharge the battery
    to bring SOC below 90% before re-enabling FCAS participation. SOC limit enforcement
    therefore temporarily removed the asset from the FCAS market.
  lesson_learnt: V2G FCAS fleet operators must actively manage SOC headroom to avoid
    breaching upper participation limits — if a large proportion of the fleet exceeds
    90% SOC simultaneously (e.g. after overnight charging), available FCAS lower capacity
    will be zero until discharge brings units back within range; SOC target setpoints
    should be set conservatively below the upper limit to maintain a buffer.
  issue_severity: minor
  project_type: transport electrification
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The FCAS controller automatically initiated discharge when SOC
    exceeded 90%, reducing SOC below the threshold to restore FCAS eligibility.
