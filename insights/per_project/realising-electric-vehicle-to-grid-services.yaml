- record_id: ARENA-DLV-13521
  source_title: The A'Z of V2G
  publish_date: 2021-01
  project_name: University of Delaware V2G Project (PJM)
  what_happened: The University of Delaware demonstrated that V2G EVs can provide
    frequency regulation services that are more accurate and faster than conventional
    synchronous generators. The project projected a 10-year NPV of $20,000 for regulation
    services and $5,000 for contingency services per 10 kW EV charger in the PJM market.
    However, the project also found that excessive regulation-up demand could drain
    the EV battery, leaving customers without sufficient charge for driving and accelerating
    battery degradation.
  lesson_learnt: V2G frequency regulation can be commercially valuable and technically
    superior to conventional generation in response speed, but state-of-charge management
    constraints must be embedded in control algorithms from the outset — failing to
    reserve sufficient battery charge for the vehicle's transport function risks customer
    dissatisfaction and battery damage.
