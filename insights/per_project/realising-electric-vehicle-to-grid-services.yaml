- record_id: ARENA-DLV-13510
  source_title: The A'Z of V2G
  publish_date: 2021-01
  project_name: V2G global review (synthesised from multiple trials)
  what_happened: An analysis of 50 V2G trials from around the world found that social
    and commercial aspects were usually not considered in trial design. Most trials
    focused narrowly on technical demonstration without examining user values, business
    model viability, or socio-technical adoption pathways.
  lesson_learnt: V2G demonstration projects should be designed to address social,
    commercial, and technical dimensions simultaneously — trials focusing solely on
    technical proof-of-concept leave critical gaps in understanding that prevent subsequent
    scale-up and commercialisation.
