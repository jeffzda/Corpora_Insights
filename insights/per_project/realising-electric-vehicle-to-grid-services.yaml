    one commercially available charger, but is suppressed by AS/NZS 4777.2:2020 ramp
    rate requirements. Future Australian V2G projects can reference this evidence
    to support standards reform arguments, and should consider whether firmware configurations
    compliant with international grid codes could serve as interim technical baselines
    pending Australian standard revision.
