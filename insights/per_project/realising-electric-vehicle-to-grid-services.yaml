    potential because residential V2G adopters would probably plug in more frequently
    than the general Electric Nation population — a behavioural change the study could
    not model due to lack of data.
  lesson_learnt: Future V2G residential trials should collect plug-in behaviour data
    specifically from participants who have V2G-capable chargers and are enrolled
    in a V2G programme, rather than relying on general residential charging data,
    to avoid underestimating residential V2G value potential due to selection bias
    in source data.
