  source_title: REVS Interim Social Report
  publish_date: 2021-05
  project_name: Realising Electric Vehicle-to-grid Services (REVS)
  what_happened: Installing bidirectional EV chargers in existing facilities required
    shutting down site power, which was particularly challenging for 24-hour sites
    and those with swipe card access. Security guards had to be stationed to control
    building access during power outages, and multi-tenant buildings required extra
    coordination for metering and billing approvals.
  lesson_learnt: When planning EV or V2G charger installation in existing facilities
    — especially 24-hour operational or multi-tenanted buildings — account for the
    complexity of temporary power shutdowns and building approval processes well in
    advance; these constraints significantly affect installation scheduling and coordination
    requirements.
