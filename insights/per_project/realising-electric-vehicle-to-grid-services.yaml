- record_id: ARENA-DLV-13512
  source_title: The A'Z of V2G
  publish_date: 2021-01
  project_name: Germany PV 50.2 Hz frequency issue
  what_happened: By 2013, Germany had connected 31 GW of solar PV, over 70% of it
    to the distribution network. Because PV systems were initially required to disconnect
    when system frequency exceeded 50.2 Hz, this created the potential for up to 14
    GW of generation to disconnect simultaneously. Retrofitting existing PV systems
    to mitigate this coincidence risk cost an estimated €175 million. This illustrates
    the systemic risk of deploying large numbers of distributed devices with common
    control setpoints.
  lesson_learnt: Control setpoints and response characteristics for large numbers
    of distributed energy resources — including EV chargers — must be designed with
    diversity from the outset; common setpoints that are harmless at small scale can
    create catastrophic coincident responses at scale, and retrofitting is extremely
    costly.
