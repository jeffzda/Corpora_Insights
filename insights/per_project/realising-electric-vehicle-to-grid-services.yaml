  project_name: EV and VGI projects (Australia, portfolio-level)
  what_happened: Transport sector stakeholders, urban planners, sustainability experts,
    and community groups were largely absent from the partner base of Australian EV
    and VGI projects, meaning the energy sector was defining the electrification transition
    without input from those best placed to anticipate unintended consequences such
    as increased car dependence, urban congestion, and inequality.
  lesson_learnt: Include transport planners, urban planners, sustainability researchers,
    and community groups as partners in EV and VGI projects — the energy sector is
    not equipped to assess second-order effects of electrification such as increased
    car dependency or equity impacts, and these issues will not be addressed unless
    the right expertise is built into project design.
