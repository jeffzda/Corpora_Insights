  project_name: Realising Electric Vehicle-to-Grid Services (REVS)
  what_happened: Remote voltage management via aggregation of multiple V2G chargers
    was not implemented in the JET Charge aggregation platform used in the REVS trial,
    even though individual charger firmware supported active power control and the
    hardware supported reactive power. This meant a complete voltage management grid
    service could not be delivered despite partial component capability existing.
  lesson_learnt: V2G grid service capability requires alignment across three layers
    — hardware, firmware, and aggregation platform — and a gap in any single layer
    prevents service delivery. Project teams should map capability across all three
    layers at project inception and ensure the aggregation platform is in scope for
    development, not assumed to be pre-existing.
