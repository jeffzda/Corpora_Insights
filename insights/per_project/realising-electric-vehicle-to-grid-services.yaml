  what_happened: Fleet managers were not informed in advance that REVS CHAdeMO chargers
    were incompatible with non-CHAdeMO fleet vehicles (e.g. Hyundai Ioniq, Kona using
    CCS), nor that each REVS Leaf required its own dedicated charger, preventing the
    cost-saving strategy of sharing chargers across a mixed fleet.
