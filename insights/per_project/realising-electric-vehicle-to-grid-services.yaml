- record_id: ARENA-DLV-59904
  source_title: Realising Electric Vehicle-to-Grid Services Lessons Learnt 2
  publish_date: 2022-05
  project_name: Realising Electric Vehicle-to-Grid Services (REVS)
  what_happened: Testing in the ANU DERlab revealed that the Wallbox Quasar charger,
    when operating under AS/NZS 4777.2:2020 grid code, ramped discharge power at only
    920 W/minute — taking 6 minutes to reach rated export power of 5.5 kW. AEMO's
    MASS requires contingency FCAS fast raise services to respond within 6 seconds.
    The charger therefore cannot meet FCAS fast raise service requirements under Australian
    grid code configuration.
  lesson_learnt: AS/NZS 4777.2:2020's mandatory active power ramp rate limit (WGra
    = 16.67% rated power per minute) directly conflicts with AEMO FCAS fast response
    requirements. Projects intending to provide V2G frequency services must validate
    charger ramp rate compliance against MASS requirements — not just grid code compliance
    — before committing to a charger platform, and should advocate for AS/NZS 4777.2:2020
    or MASS amendments to resolve the conflict.
  issue_severity: major
  project_type: transport electrification
  project_scale_band: demonstration
