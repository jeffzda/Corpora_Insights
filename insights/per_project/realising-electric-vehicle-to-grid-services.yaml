- record_id: ARENA-DLV-13517
  source_title: The A'Z of V2G
  publish_date: 2021-01
  project_name: V2G global review — V2G charger installation complexity
  what_happened: The review found that V2G chargers are assessed by distribution networks
    as generators, not just loads, which increases the complexity and time required
    for grid connection approval. Utilities may use worst-case deterministic assumptions
    that can result in costly network reinforcement requirements for unlikely system
    configurations. V2G also introduces billing complexity because systems must disentangle
    revenue from V2G grid services from EV charging costs.
  lesson_learnt: V2G charger installation projects should engage DNSPs early and prepare
    for a more complex and time-consuming connection process than for unidirectional
    chargers — a V2G charger is assessed as both a generator and a load, and probabilistic
    rather than worst-case connection assessment should be sought to avoid unnecessary
    reinforcement costs.
