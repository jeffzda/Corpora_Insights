- record_id: ARENA-DLV-33252
  source_title: Assessment of FCAS Capabilities of a V2G Capable EV Charger - A Case
    Study
  publish_date: 2022-06
  project_name: Realising Electric Vehicle-to-Grid Services (REVS)
  what_happened: The AS/NZS 4777.2:2020 ramp rate limitation was traced specifically
    to the vendor's firmware implementation of sections 3.3.4.2, 4.5.3.2.2 and 4.5.3.3.2
    of the standard, which imposes a 16.67% rated power per minute ramp rate within
    the continuous operation frequency band (49.75–50.25 Hz). Because the FCAS raise
    trigger (49.85 Hz) falls within this band, the charger applied the WGra ramp limit
    rather than responding as a contingency FCAS provider. Other AS/NZS 4777-compliant
    inverters already participate in FCAS markets, indicating the issue is manufacturer-specific
    rather than an inherent standard defect.
  lesson_learnt: When procuring V2G or DER equipment for FCAS participation, require
    the manufacturer to demonstrate that their AS/NZS 4777.2:2020 firmware implementation
    does not apply the WGra ramp rate limit during contingency frequency events —
    the conflict between FCAS trigger frequencies and the standard's continuous operation
    band can be resolved at firmware level without non-compliance with the standard
    itself.
  issue_severity: major
  project_type: transport electrification
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: research organisation/university
