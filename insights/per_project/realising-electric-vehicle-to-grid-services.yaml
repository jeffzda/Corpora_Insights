- record_id: ARENA-DLV-25155
  source_title: Realising Electric Vehicle-to-Grid Services Lessons Learnt 1
  publish_date: 2021-04
  project_name: Realising Electric Vehicle-to-grid Services (REVS)
  what_happened: The communication speed requirements of V2G chargers — specifically
    the need for a hard-wired internet connection rather than the wireless connections
    typically used in EV chargers — were not identified during planning. This was
    only discovered later, creating a more complex installation requiring additional
    network reticulation and site internet security work.
  lesson_learnt: Scrutinise V2G charger communication requirements (latency, connection
    type) during early technical planning — the requirement for hard-wired internet
    connections differs from standard EV charger practice and will materially affect
    installation scope and site readiness requirements.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: construction/installation
  failure_mode: unvalidated technical assumptions
  outcome_class: delayed but recoverable
  secondary_failure_mode: null
  intervention_note: Hard-wired connections were installed at sites as a workaround,
    adding complexity to reticulation and site internet security.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: EV
  source_pages: &id035
  - 7
  evidence_excerpt: A good example of this was the communications requirements of
    V2G. Put simply, a hard-wired internet connection will achieve the needed response
    speed, whereas a wireless connection, which is typically used in EV chargers,
    will not. The need to provide a hard-wired connection was unexpected because the
    communication speeds were not given scrutiny early enough. This meant a more complex
    installation both in terms of reticulation and site internet security.
