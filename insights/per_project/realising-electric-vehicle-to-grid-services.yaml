  source_title: 'Electric Vehicles and The Grid: Analysis, Gaps and Recommendations'
  publish_date: 2022-01
  project_name: EV and VGI projects (Australia, portfolio-level)
  what_happened: Australian EV charging infrastructure projects found that installed
    costs for chargers were 3–5 times the hardware costs, with the excess attributable
    to soft costs such as inter-party communications, easement access, complex permitting,
    and multi-stakeholder building ownership — and these soft costs commonly caused
    candidate sites to be abandoned.
  lesson_learnt: Budget for soft costs equal to 2–4 times hardware cost when planning
    EV charging deployments in shared or leased spaces — permitting, easements, and
    multi-stakeholder coordination are the dominant cost driver and the primary reason
    sites are abandoned.
