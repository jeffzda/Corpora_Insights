  source_title: Assessment of FCAS Capabilities of a V2G Capable EV Charger - A Case
    Study
  publish_date: 2022-06
  project_name: Realising Electric Vehicle-to-Grid Services (REVS)
  what_happened: The FCAS lower service (requiring the charger to charge the EV in
    response to high frequency) met the 6-second MASS response time requirement under
    both AS/NZS 4777.2:2020 and UK G99 configurations, achieving a 5-second response
    with AS4777.2:2020 and 4.5 seconds with G99. This asymmetry between raise and
    lower capability under Australian standards represents a practically relevant
    finding for FCAS market participation.
  lesson_learnt: V2G chargers configured to AS/NZS 4777.2:2020 can deliver lower FCAS
    services (charging mode) within MASS requirements even if they cannot deliver
    raise services (discharging mode) — project teams should consider registering
    only lower services for AS4777.2:2020-configured units as an interim revenue pathway
    while firmware issues are resolved.
