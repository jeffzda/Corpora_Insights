  what_happened: Charging standards for V2G were fractured at the time of the trial,
    with CHAdeMO being the only standard explicitly supporting V2G, while CCS2 was
    the likely future default for DC charging in Australia — creating uncertainty
    about which vehicles could provide V2G beyond the immediate term and limiting
    the scalability of the REVS approach.
  lesson_learnt: V2G project designers and policymakers should treat charging standard
    fragmentation as a critical systemic risk — building a trial around a single proprietary
    standard (CHAdeMO) that may not be the long-term default constrains scalability
    and reduces the transferability of trial learnings to mainstream fleet deployments.
