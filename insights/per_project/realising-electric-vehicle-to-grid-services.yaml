- record_id: ARENA-DLV-13523
  source_title: The A'Z of V2G
  publish_date: 2021-01
  project_name: V2G global review — DNSP connection process fragmentation
  what_happened: The review found that DNSP connection processes for V2G and DER in
    Australia were inconsistent across jurisdictions, not transparent to market participants,
    and potentially used worst-case deterministic assessments that generated costly
    unnecessary network reinforcement requirements. Static connection limits (e.g.
    5 kW per phase in Evoenergy's network) were found to significantly constrain V2G
    charger operation, particularly when combined with existing solar PV and stationary
    battery systems at the same connection point.
  lesson_learnt: DNSPs should harmonise and publish clear, transparent connection
    processes for V2G chargers, move from worst-case static limits to dynamic connection
    agreements, and adopt probabilistic rather than deterministic connection assessment
    methods — current approaches create unnecessary costs and deter V2G deployment.
