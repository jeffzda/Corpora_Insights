- record_id: ARENA-DLV-57751
  source_title: Creating Value from V2G - Business Model Report
  publish_date: 2022-09
  project_name: Realising Electric Vehicle-to-Grid Services (REVS)
  what_happened: V2G charger installation during the REVS trial proved significantly
    more complex and time-consuming than anticipated, representing the first time
    V2G chargers had been installed at scale (beyond single examples) in Australia,
    requiring coordination across fleet management, facilities management, technical
    approvals, and IT integration stakeholders.
  lesson_learnt: Plan for V2G hardware installation to be a multi-stakeholder, multi-approval
    process — it will always require engagement with both fleet and facilities management
    because EVs span both responsibilities, and brownfield sites add further technical
    and approval complexity. Budget time and resources accordingly.
  issue_severity: moderate
