- record_id: ARENA-DLV-59901
  source_title: Realising Electric Vehicle-to-Grid Services Lessons Learnt 2
  publish_date: 2022-05
  project_name: Realising Electric Vehicle-to-Grid Services (REVS)
  what_happened: The REVS project assumed the Wallbox Quasar bidirectional charger
    would easily achieve AS/NZS 4777.2:2020 certification because it had already been
    certified against overseas standards considered similar. This assumption proved
    incorrect — compliance required the vendor to make hardware and software changes,
    and the process was further delayed by COVID and vendor workload, causing significant
    project schedule delays.
  lesson_learnt: Do not assume overseas certifications are equivalent to AS/NZS 4777.2:2020
    for novel hardware types. Conduct a rigorous review of the relevant Australian
    standard at project initiation and engage local vendors with experience in that
    standard to surface compliance risks before design is locked in.
