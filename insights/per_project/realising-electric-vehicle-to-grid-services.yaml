- record_id: ARENA-DLV-33251
  source_title: Assessment of FCAS Capabilities of a V2G Capable EV Charger - A Case
    Study
  publish_date: 2022-06
  project_name: Realising Electric Vehicle-to-Grid Services (REVS)
  what_happened: When the Wallbox Quasar V2G charger was configured with the AS/NZS
    4777.2:2020 standard, it took more than 300 seconds to respond to FCAS fast raise
    events — far exceeding the 6-second response time required by the AEMO Market
    Ancillary Service Specification (MASS). The charger was therefore incapable of
    delivering raise FCAS services in the NEM under its Australian standard firmware
    configuration.
  lesson_learnt: V2G charger deployments targeting FCAS participation in the NEM must
    verify that the AS/NZS 4777.2:2020 active power ramp rate limit (WGra = 16.67%
    rated power per minute) does not conflict with AEMO MASS response time requirements
    — the overlap between the FCAS raise trigger frequency (49.85 Hz) and the AS/NZS
    4777.2:2020 continuous operation band lower limit (49.75 Hz) can cause the charger
    to apply the WGra ramp limit instead of responding to the contingency event.
  issue_severity: major
  project_type: transport electrification
