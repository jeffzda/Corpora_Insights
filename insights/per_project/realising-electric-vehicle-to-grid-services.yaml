    rates (20% per year, analogous to PV inverter cost declines), V2G office use cases
    with dynamic pricing and no or 50% conservatism were already economic in 2022,
    while residential V2G use cases do not become economic until 2028 at the earliest
    under high learning rates, and beyond 2030 under low learning rates (3% per year).
  lesson_learnt: ARENA and industry should concentrate near-term V2G investment and
    scale-up in commercial fleet settings with dynamic pricing and low conservatism
    requirements — these are the only near-term economically viable use cases. Residential
    V2G programmes should be designed around a hardware cost reduction trajectory
    and should not be treated as commercially viable at scale until the late 2020s
    at earliest.
