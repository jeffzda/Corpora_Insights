  source_title: REVS Interim Social Report
  publish_date: 2021-05
  project_name: Realising Electric Vehicle-to-grid Services (REVS)
  what_happened: Future fleet end-users (government organisations already transitioning
    light passenger fleets to EVs) indicated that the timing of V2G commercialisation
    may not align with their EV procurement cycles. Light passenger vehicle transitions
    were already underway and nearing completion, meaning V2G availability might coincide
    only with the heavier vehicle transition phase — a phase likely to dominate organisational
    attention and budgets.
  lesson_learnt: V2G proponents must time commercialisation to align with fleet procurement
    cycles — if V2G becomes available only after light passenger EV transitions are
    complete, the opportunity to integrate V2G capability into fleet decisions may
    be missed, with attention and funding shifting to the heavier vehicle transition.
