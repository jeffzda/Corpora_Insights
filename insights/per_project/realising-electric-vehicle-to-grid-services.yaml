- record_id: ARENA-DLV-25159
  source_title: Realising Electric Vehicle-to-Grid Services Lessons Learnt 1
  publish_date: 2021-04
  project_name: Realising Electric Vehicle-to-grid Services (REVS)
  what_happened: The V2G charger vendor underestimated the rigour of AS/NZS 4777 certification,
    partly because of differences from the European equivalent standard. The standard,
    originally developed for solar and stationary battery inverters, categorises V2G
    chargers as multiple mode inverters rather than having a dedicated V2G standard,
    creating unexpected certification complexity and delays.
  lesson_learnt: Do not rely solely on vendor advice for AS/NZS 4777 certification
    scoping — V2G chargers face unique certification challenges under the current
    standard (which lacks a dedicated V2G category), and in-house or independent expertise
    is needed to accurately forecast certification timelines and costs.
  issue_severity: major
  project_type: transport electrification
  project_scale_band: demonstration
  lifecycle_phase: procurement
  proponent_type: research organisation/university
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Team recommended developing in-house experience with AS/NZS 4777
    certification to reduce reliance on vendor advice, and proposed that AS/NZS 4777
    include dedicated test standards for V2G chargers.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: EV
  source_pages: &id039
