    response time validation, deploy a high-fidelity POW meter (not just the site-standard
    power meter) — the standard 20 ms MODBUS update rate of the power meter introduces
    noise that can obscure true charger response characteristics, while the POW meter
    operating at 62 kHz with 1 μs timestamps provides cleaner validation data.
