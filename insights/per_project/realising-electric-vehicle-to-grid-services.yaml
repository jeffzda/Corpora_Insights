  what_happened: Australia's truck width limit of 2,500 mm (unrestricted) is narrower
    than the US (2,600 mm) and Europe (2,550–2,600 mm), creating a regulatory barrier
    to importing internationally developed electric articulated trucks, and contributing
    to zero EV uptake in that vehicle class as of 2021.
  lesson_learnt: Regulatory standards for vehicle dimensions must be harmonised with
    major international markets before heavy vehicle electrification projects are
    funded — the articulated truck width standard is a hard barrier that prevents
    deployment of available international technology regardless of project funding.
