- record_id: ARENA-DLV-64907
  source_title: Modelling V2G Simulation - A Study of the Economic and Technical Value
    Proposition
  publish_date: 2022-12
  project_name: Realising Electric Vehicle to Grid Services (REVS)
  what_happened: 'Economic analysis found that V2G charger payback periods exceeded
    5 years in most scenarios under 2022 conditions. Only three scenarios achieved
    sub-5-year payback: V1G for houses (dynamic pricing, no conservatism) and V2G
    for offices (dynamic pricing, 0% and 50% conservatism). V2G charger incremental
    costs of approximately $9,500 (office) required up to an 80% price reduction to
    become viable in many use cases.'
  lesson_learnt: V2G deployment programmes should currently focus on high plug-in-rate
    commercial or fleet settings where the economics are closest to viability. For
    residential deployment, significant charger hardware cost reductions (estimated
    60–70%+) are needed before V2G can be broadly economic, and programme design should
    plan for this hardware cost trajectory rather than assuming current economics.
