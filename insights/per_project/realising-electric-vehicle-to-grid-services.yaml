- record_id: ARENA-DLV-57752
  source_title: Creating Value from V2G - Business Model Report
  publish_date: 2022-09
  project_name: Realising Electric Vehicle-to-Grid Services (REVS)
  what_happened: Grid operators interviewed expressed high scepticism about V2G's
    ability to meet the reliability thresholds required for grid services — requiring
    80–90% reliability before dispatch — because the vehicle's primary use as transport
    means it may not be plugged in when needed and battery capacity is constrained
    by transport energy reservation.
  lesson_learnt: V2G intermediaries must demonstrate dispatch reliability of 80–90%
    or above to be credible for grid services; managing transport-driven availability
    risk is the central technical challenge and must be addressed through data-driven
    forecasting and optimisation before grid operators will commit to procurement
    contracts.
