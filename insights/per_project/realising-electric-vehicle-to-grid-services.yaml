  project_name: Realising Electric Vehicle-to-Grid Services (REVS)
  what_happened: V2G compliance requirements created tension with existing building
    and electrical standards, as V2G must satisfy standards written for the built
    environment by experts from that industry — future fleet participants reported
    frustration with Standards Australia being overly risk-averse in its approach
    to new EV technologies.
  lesson_learnt: V2G project developers should anticipate mismatches between vehicle-related
    technology and built-environment electrical standards, and engage with standards
    bodies early — standards that were not written with bidirectional vehicle charging
    in mind can add compliance overhead and may need adjustment before commercial
    deployment is feasible.
