  source_title: Realising Electric Vehicle-to-Grid Services Crossing Sectors Report
  publish_date: 2022-06
  project_name: Realising Electric Vehicle-to-grid Services (REVS)
  what_happened: The multi-party REVS consortium spanned the full electricity and
    transport supply chains (vehicle OEM, fleet manager, network operator, retailer,
    charger manufacturer, booking platform provider, and research institution). Managing
    information flows and technical interfaces between these diverse organisations
    — particularly for edge cases such as operating envelope changes during FCAS events
    — required substantial coordination effort not fully anticipated in project design.
  lesson_learnt: V2G projects crossing the transport and energy sectors require explicit
    cross-sector coordination protocols, particularly for edge-case system behaviours
    — all partner systems must have clearly defined behaviour for every scenario (including
    envelope changes mid-event), and communication interfaces between partners must
    be specified and tested before operational deployment.
