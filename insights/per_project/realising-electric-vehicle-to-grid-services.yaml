- record_id: ARENA-DLV-13515
  source_title: The A'Z of V2G
  publish_date: 2021-01
  project_name: V2G global review — charging standards fragmentation
  what_happened: As of the time of writing, only the CHAdeMO charging standard supported
    V2G. In Australia, only Nissan and Mitsubishi used CHAdeMO, and of these only
    Nissan allowed V2G within their warranty. The Renault Zoe, which was popular in
    Europe with V2G capability, was pulled from the Australian market in mid-2020
    due to poor sales and lack of government support for EVs. This left only a single
    vehicle model (Nissan LEAF) as a viable platform for V2G trials in Australia.
  lesson_learnt: V2G trial proponents in Australia must plan for a severely constrained
    hardware supply — at the time of the REVS trial only one vehicle (Nissan LEAF)
    supported V2G within warranty, making fleet assembly challenging and exposing
    projects to single-supplier risk. Advocating for CCS standards to incorporate
    V2G is essential for long-term market development.
