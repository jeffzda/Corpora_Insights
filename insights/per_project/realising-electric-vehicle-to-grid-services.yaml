- record_id: ARENA-DLV-59907
  source_title: Realising Electric Vehicle-to-Grid Services Lessons Learnt 2
  publish_date: 2022-05
  project_name: Realising Electric Vehicle-to-Grid Services (REVS)
  what_happened: AS/NZS 4777.2:2020 requires inverters to ride through phase angle
    jumps (PAJ) but the standard's language is ambiguous — it is unclear whether the
    requirement applies to jumps around 60 degrees, jumps of 0–60 degrees, or jumps
    of 60 degrees and above. The test procedure in Appendix I.5 only contains tests
    for 60° ± 3°. Testing of 40 PAJ events across different magnitudes (60°, 45°,
    30°) and cycle positions revealed the charger could ride through PAJ1 in most
    cases but failed to ride through PAJ2 when it occurred more than 45° from a voltage
    peak or trough.
  lesson_learnt: Ambiguity in AS/NZS 4777.2:2020 regarding phase angle jump requirements
    creates uncertainty about compliance scope and exposes novel hardware to unexpected
    test failures. Future projects should engage standards bodies early to seek clarification
    on PAJ requirements and conduct broader-than-required test matrices to fully characterise
    charger behaviour before formal certification submission.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: demonstration
  lifecycle_phase: approvals/contracting
