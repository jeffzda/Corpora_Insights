- record_id: ARENA-DLV-49905
  source_title: 'Insights Spotlight: International Review of Vehicle to Grid Technology:
    An Interview with ANU'
  publish_date: 2021-02
  project_name: Realising Electric Vehicle-to-Grid Services (REVS)
  what_happened: International review found that existing electricity and transport
    market structures do not adequately value the fast, flexible, on-demand power
    services that V2G can provide, limiting revenue opportunities. Markets for system
    services (frequency control, demand response), network services (voltage and congestion
    management), and financial services (firming, hedging) are insufficiently developed
    in Australia to support a full V2G value stack.
  lesson_learnt: V2G business case development must map available revenue streams
    against current market rules at the time of deployment — projects targeting the
    full value stack should engage with market reform processes and not assume regulatory
    arrangements will be in place by project completion; phased service delivery aligned
    to market readiness is advisable.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: demonstration
  lifecycle_phase: concept/feasibility
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: commercial & market
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: regulatory & approvals
  intervention_note: Report noted Australia's move to 5-minute settlement as a positive
    step, and cited the UK Piclo Flex platform as a model for transparent distribution
    network service markets.
  transferability: moderate
  delay_magnitude: null
  technology_domain: EV
  source_pages: &id119
  - 3
  evidence_excerpt: V2G will benefit from market updates that more fully value the
    increasingly critical roles of energy storage to provide fast, flexible, and on
    demand power supply (and demand). Markets for these services include system services
    such as frequency control and demand response, network services such as voltage
    and congestion management, and financial services such as generation firming and
    hedging.
  confidence_note: secondary_failure_mode of commercial/demand failure added because
