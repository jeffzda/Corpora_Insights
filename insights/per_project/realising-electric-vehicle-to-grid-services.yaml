  source_title: Realising Electric Vehicle-to-Grid Services Crossing Sectors Report
  publish_date: 2022-06
  project_name: Realising Electric Vehicle-to-grid Services (REVS)
  what_happened: 'COVID-19 delayed the REVS project through multiple compounding impacts:
    charger manufacturers were delayed in building and certifying chargers, ACT lockdowns
    (particularly the extended lockdown in late 2021) delayed installation activities,
    and lab testing of chargers was delayed due to inability to access the lab.'
  lesson_learnt: V2G demonstration projects should build substantial schedule contingency
    for external disruptions such as pandemics; equipment certification and physical
    installation activities are particularly vulnerable to access restrictions and
    should have parallel-path mitigation strategies where possible.
