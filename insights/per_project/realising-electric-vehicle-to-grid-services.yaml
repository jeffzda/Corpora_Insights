- record_id: ARENA-DLV-13503
  source_title: The A'Z of V2G
  publish_date: 2021-01
  project_name: Los Angeles Air Force Base V2G Demonstration
  what_happened: A 29-vehicle V2G project at the Los Angeles Air Force Base providing
    grid frequency services found that despite a combined battery capacity of 859
    kWh, only 100–400 kWh was practically available for grid services at any time.
    Low vehicle availability was caused by both vehicles being absent and charger
    faults.
  lesson_learnt: V2G fleet projects should plan for effective availability well below
    nameplate capacity — in this project only 12–47% of installed battery capacity
    was accessible due to vehicle availability and charger faults. Project sizing,
    market bids, and business cases must use realistic availability factors, not nameplate
    fleet capacity.
