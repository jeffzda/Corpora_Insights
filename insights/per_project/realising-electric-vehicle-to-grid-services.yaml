  source_title: Realising Electric Vehicle-to-Grid Services Crossing Sectors Report
  publish_date: 2022-06
  project_name: Realising Electric Vehicle-to-grid Services (REVS)
  what_happened: As V2G scales, the simultaneous charging demand of EV fleets will
    exceed building electrical network capacity unless chargers are integrated with
    building management systems. The REVS project did not implement deep building
    management system integration — chargers were not orchestrated to manage building
    load beyond operating envelope compliance — as a deliberate complexity reduction
    for the trial.
  lesson_learnt: Commercial-scale V2G deployments must integrate charger management
    with building services and demand response systems to avoid overloading site electrical
    infrastructure — the combined charging load of even a modest fleet can exceed
    building capacity, and this integration requirement should be scoped and budgeted
    from project inception.
