  what_happened: Nissan's warranty for V2G use requires that only Nissan-approved
    chargers be used, and for managed V2G programs, a use case simulation of driving
    and charging behaviour must be provided to Nissan so they can assess battery impact.
    Without this process, end users remain covered by standard warranty if approved
    hardware is used within the one-cycle-per-day limit, but Nissan may decline to
    endorse the service provider.
  lesson_learnt: V2G project developers should engage the vehicle manufacturer (e.g.
    Nissan) early in project design to initiate warranty approval — the manufacturer
    requires usage pattern simulation data and explicit contractual encoding of charge/discharge
    profiles; failure to do this early can delay charger selection and program design.
