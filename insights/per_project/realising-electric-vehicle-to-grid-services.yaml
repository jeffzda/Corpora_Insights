- record_id: ARENA-DLV-64901
  source_title: Modelling V2G Simulation - A Study of the Economic and Technical Value
    Proposition
  publish_date: 2022-12
  project_name: Realising Electric Vehicle to Grid Services (REVS)
  what_happened: Modelling of V2G scenarios showed that V2G value is critically dependent
    on plug-in duration. Residential sites with low plug-in rates generated little
    or no net value from V2G, while office sites with high plug-in rates produced
    negative net energy costs (i.e., a net benefit) per EV under both current and
    dynamic pricing.
  lesson_learnt: V2G initiatives must prioritise use cases with high plug-in rates
    — ideally fleet or commercial settings — as plug-in duration is the single most
    important determinant of V2G value. Contracts or programmes encouraging V2G adoption
    should include minimum plug-in time requirements to ensure sufficient value generation.
