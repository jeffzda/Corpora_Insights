- record_id: ARENA-DLV-64903
  source_title: Modelling V2G Simulation - A Study of the Economic and Technical Value
    Proposition
  publish_date: 2022-12
  project_name: Realising Electric Vehicle to Grid Services (REVS)
  what_happened: Modelling showed that reserving 50% of EV battery capacity for driving
    (conservatism level) reduced V2G value for offices under dynamic pricing by only
    20%, while a 90% conservatism level reduced value by 80%. This indicates a viable
    operating zone at moderate conservatism levels that balances driver range anxiety
    against grid service revenue.
  lesson_learnt: V2G product designers should offer a 50% state-of-charge reserve
    as a default setting — it preserves the large majority of V2G economic value while
    substantially addressing driver range anxiety. A 90% reserve should be avoided
    as it eliminates most of the value proposition.
