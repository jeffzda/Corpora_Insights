  what_happened: The REVS project used a hybrid Agile/Waterfall project management
    methodology. In retrospect the team found a gap in accountability that could have
    been narrowed by weighting more heavily towards Agile. The dedicated project manager
    was considered under-resourced, reducing accountability to tasks.
  lesson_learnt: For complex multi-partner V2G or EV trials with many interdependencies
    and emerging unknowns, weight project management methodology towards Agile and
    ensure the project manager role is sufficiently resourced — hybrid Agile/Waterfall
    with a single under-resourced PM creates accountability gaps.
