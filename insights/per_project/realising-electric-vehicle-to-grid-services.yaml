    with predictable vehicle usage patterns and centralised oversight provide the
    most controllable operating environment for demonstrating grid services — the
    combination of usage predictability, centralised decision-making, and mission
    alignment with public benefit reduces key risks that make private EV V2G trials
    harder to manage.
