  what_happened: The bid platform originally assumed all vehicles would be booked
    through SGFleet's booking intelligence platform, providing high-quality forward
    vehicle availability data. When it emerged that most ACT government fleet vehicles
    are not booked through this system, the bid engine had to be modified to incorporate
    conservative and non-conservative bidding logic based on plug-in status and likelihood
    of imminent vehicle use.
  lesson_learnt: V2G bid platform design must account for the full range of fleet
    vehicle management practices, not only those using centralised booking platforms
    — where vehicles are assigned to teams without formal booking, alternative availability
    inference logic (plug-in status, usage patterns) must be developed, requiring
    more detailed pre-project investigation of booking platform coverage.
