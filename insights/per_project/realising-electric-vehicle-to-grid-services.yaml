  source_title: Modelling V2G Simulation - A Study of the Economic and Technical Value
    Proposition
  publish_date: 2022-12
  project_name: Realising Electric Vehicle to Grid Services (REVS)
  what_happened: Scenario modelling demonstrated that V2G and managed charging optimised
    to the same price or emissions signal across many customers simultaneously produces
    large coincident demand peaks and minimum demand troughs, potentially increasing
    peak demand above unmanaged (V0G convenience) charging levels rather than reducing
    it.
  lesson_learnt: Grid operators deploying V2G or managed EV charging at scale must
    implement demand-diversification mechanisms — such as staggered or randomised
    dispatch signals — to prevent coincident response to shared price or emissions
    signals from creating grid instability. Dynamic pricing alone is insufficient
    to moderate aggregate network impacts.
