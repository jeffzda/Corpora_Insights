  source_title: Realising Electric Vehicle-to-Grid Services Lessons Learnt 2
  publish_date: 2022-05
  project_name: Realising Electric Vehicle-to-Grid Services (REVS)
  what_happened: The Clean Energy Council (CEC) inverter classification framework
    classifies bidirectional EV chargers as battery energy storage systems (multiple
    mode inverter — battery only) because EVs contain a battery. This classification
    requires compliance with AS/NZS 5139, which governs electrical installation of
    stationary battery systems. AS/NZS 5139 does not apply to battery systems in electric
    vehicles, creating a compliance impasse that prevents CEC certification for V2G
    chargers.
  lesson_learnt: The CEC inverter classification flow chart does not accommodate bidirectional
    EV chargers as a distinct category, blocking a formal certification pathway for
    V2G hardware. Future V2G projects should engage the CEC and relevant standards
    bodies at the discovery phase to seek reclassification of bidirectional EV chargers
    as 'Other' in the CEC flow chart and to align AS/NZS 4777.2:2020 with AS/NZS 5139
    for EV applications.
