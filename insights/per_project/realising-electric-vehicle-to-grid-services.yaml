  what_happened: The bidirectional EV charger did not have an inherent capability
    to respond to FCAS events; an external control box (the JET Charge FCAS controller)
    had to be developed and integrated to detect frequency disturbances and modulate
    charger output. This added an external hardware and software dependency to the
    FCAS delivery architecture.
  lesson_learnt: V2G FCAS project teams should confirm early whether target charger
    hardware has native FCAS response capability or requires an external control layer
    — the additional integration complexity of an external controller (firmware dependencies,
    communication latency via MODBUS, SOC state management) creates multiple potential
    failure points that must each be tested independently.
