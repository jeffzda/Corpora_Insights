  outcome_class: knowledge generated despite setback
  secondary_failure_mode: data & measurement
  intervention_note: Conducted 11 iterations of the 45° phase angle jump test to characterise
    the point-on-wave dependency, identifying that jumps occurring at zero crossing
    rode through while those near peak/trough were more likely to disconnect.
