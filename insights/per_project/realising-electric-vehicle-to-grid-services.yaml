  source_title: Realising Electric Vehicle-to-Grid Services Lessons Learnt 1
  publish_date: 2021-04
  project_name: Realising Electric Vehicle-to-grid Services (REVS)
  what_happened: The discovery phase budget and timeline assumptions were developed
    in parallel with the ARENA application process, which had defined timelines. This
    meant insufficient time was available for rigorous stress-testing of budget assumptions,
    leading to underestimates that required subsequent variation.
  lesson_learnt: When discovery-phase planning must run in parallel with a funder
    application process, explicitly flag that budget and timeline assumptions are
    based on incomplete information and build in a structured review point post-award
    to revise assumptions before committing to detailed design — or build contingency
    into the initial scope.
