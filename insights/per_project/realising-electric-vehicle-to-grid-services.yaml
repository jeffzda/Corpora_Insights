- record_id: ARENA-DLV-59903
  source_title: Realising Electric Vehicle-to-Grid Services Lessons Learnt 2
  publish_date: 2022-05
  project_name: Realising Electric Vehicle-to-Grid Services (REVS)
  what_happened: After the Wallbox Quasar charger was modified to comply with AS/NZS
    4777.2:2020 earthing requirements, it failed the Electromagnetic Compatibility
    (EMC) test, emitting high-frequency noise in excess of maximum allowable limits.
    The vendor was required to introduce external ferrite inductors on both the input
    and output sides of the charger, adding installation complexity, effort, and reducing
    visual amenity. This EMC issue is specific to the Australian standard and is not
    present under international standards such as UK G99.
  lesson_learnt: Hardware modifications made to satisfy one compliance requirement
    (earthing) can introduce secondary non-compliance issues (EMC emissions) that
    require further physical modifications. Projects certifying novel hardware against
    AS/NZS 4777.2:2020 should budget for iterative hardware change cycles and anticipate
    that Australian-specific requirements may not be surfaced by international certification
    history.
