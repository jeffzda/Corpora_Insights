    far too slowly when operating in the Australian grid code (AS/NZS 4777.2:2020)
    mode... the charger ramped at 920 W/minute for raise services (where the charger
    must export power). This means that the charger takes 6 minutes (360s) to export
    5.5 kW power. As a result, the charger does not meet the response time requirements
    defined in the MASS. To provide all contingency FCAS services, the charger must
    respond within 6s from the contingency frequency event.
