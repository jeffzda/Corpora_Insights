    the most active customers reducing peak electricity consumption by 47% and saving
    an average of £132 ($238 AUD) per year compared to the standard tariff. Analysis
    mapped against Victorian energy prices showed perfect optimisation could achieve
    nearly 50% reduction in total charge cost.
  lesson_learnt: Dynamic real-time pricing is a highly effective tool for shifting
    EV charging to low-cost periods — EV drivers demonstrate greater price sensitivity
    than the general population, and implementing dynamic tariffs specifically for
    EV customers can generate significant bill savings while reducing network peaks.
