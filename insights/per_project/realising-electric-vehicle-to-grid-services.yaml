  project_name: Realising Electric Vehicle-to-grid Services (REVS)
  what_happened: Fleet managers across the ACT government were affected by nearly
    every technical and process issue in the project — from vehicle allocation decisions
    to charger installation approvals, booking system integration, and changes to
    vehicle usage procedures. Despite being central to delivery, fleet managers were
    not engaged to the level they expected or that would be required for widespread
    fleet-based V2G uptake.
  lesson_learnt: Fleet managers must be engaged as full project partners from project
    inception in V2G fleet trials — they are the primary point of contact for most
    operational issues spanning vehicles, chargers, booking systems, and usage processes,
    and insufficient engagement leads to misaligned expectations, process failures,
    and resistance to deployment.
