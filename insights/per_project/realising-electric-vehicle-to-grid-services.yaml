  publish_date: 2022-06
  project_name: Realising Electric Vehicle-to-Grid Services (REVS)
  what_happened: Keeping the EV connector locked and the charger in remote control
    mode (required to maintain constant SOC monitoring and fastest FCAS reaction time)
