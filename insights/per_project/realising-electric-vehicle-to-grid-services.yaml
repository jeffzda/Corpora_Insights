  publish_date: 2021-05
  project_name: Realising Electric Vehicle-to-grid Services (REVS)
  what_happened: The REVS consortium had not sought end-user feedback on the V2G system
    design at the time of interviews, creating a knowledge gap between making V2G
    technically work and making it work within a societal context. Consortium members
    were keen to understand user experience and economic viability but had not yet
    engaged users to inform the design.
  lesson_learnt: Seek end-user feedback on system design before finalising technical
    and operational configuration — waiting until technical delivery is underway before
    engaging users risks design decisions that do not fit user workflows or expectations,
    requiring costly rework.
