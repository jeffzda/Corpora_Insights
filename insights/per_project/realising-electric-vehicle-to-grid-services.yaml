- record_id: ARENA-DLV-13528
  source_title: The A'Z of V2G
  publish_date: 2021-01
  project_name: V2G global review — plug-in time and EV availability for market value
  what_happened: Analysis of Queensland energy prices and FCAS market data found that
    the achievable value from V2G energy arbitrage and frequency services is highly
    sensitive to how long the vehicle is plugged in and when. Vehicles available all
    day captured the maximum value; restricting plug-in to outside business hours
    (9 AM–5 PM) still captured significant value, but shorter windows dramatically
    reduced revenue. The analysis assumed no driving energy consumption and full 40
    kWh availability — real-world driving would reduce available capacity.
  lesson_learnt: V2G business case modelling must use realistic plug-in duration assumptions
    — maximum value requires vehicles to be plugged in during both low-price (midday)
    and high-price (evening) periods, and any charging window that misses peak price
    events can significantly reduce revenue. Fleet deployments at depots where vehicles
    are plugged in overnight and on weekends are better suited to capturing FCAS and
    energy arbitrage value than private vehicles with variable usage patterns.
