  what_happened: The original trial design assumed all fleet vehicles would be managed
    through SGFleet's booking intelligence platform, enabling automated charger unlocking
    before vehicle departure. During the trial it became apparent that 24 of 51 vehicles
    (those assigned to specific teams or on-call use) did not use the booking system,
    requiring a separate RFID card–based charger release mechanism to be developed
    as a workaround.
  lesson_learnt: Before finalising V2G fleet integration design, conduct detailed
    analysis of actual vehicle usage and booking patterns across all participating
    fleets — a significant proportion of fleet vehicles may not use centralised booking
    systems, requiring alternative charger release and availability forecasting mechanisms
    that must be designed and tested before deployment.
