  source_title: 'Looking Forward: Barriers, Risks and Rewards of the Australian Geothermal
    Sector to 2020 and 2030'
  publish_date: 2014-06
  project_name: Australian Geothermal Sector – Geothermal Drilling Program
  what_happened: Government grants directed to the Geothermal Drilling Program did
    not deliver all expected outcomes because companies were unable to meet the matching
    funding requirements, leaving approximately $100 million in allocated grants unspent
    and returned to government.
  lesson_learnt: Grant programs requiring significant private co-investment matching
    should verify that recipient companies have the financial capacity to meet co-funding
    obligations before awarding grants — otherwise public funds may be committed but
    not productively deployed.
