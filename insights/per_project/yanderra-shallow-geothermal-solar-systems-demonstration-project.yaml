- record_id: ARENA-DLV-6605
  source_title: Ground Source Systems - Yanderra Shallow Geothermal-Solar Systems
    Demonstration - Lessons Learnt 3
  publish_date: 2023-08
  project_name: Yanderra Shallow Geothermal-Solar Systems Demonstration
  what_happened: Sensor mislabelling and sensor/transducer malfunctions were identified
    during data reduction and analysis, requiring remediation of the automated datalogging
    system. The project's demonstration instrumentation comprised over 100 logged
    data points every 15 minutes — significantly more than a normal commercial system
    — adding complexity and increasing the likelihood of configuration errors.
  lesson_learnt: Demonstration projects with dense sensor arrays should include a
    dedicated sensor commissioning and calibration phase before commencing performance
    data collection; automated datalogging configurations should be validated early
    to avoid corrupted datasets that delay meaningful performance reporting.
