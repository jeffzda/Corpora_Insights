- record_id: ARENA-DLV-6604
  source_title: Ground Source Systems - Yanderra Shallow Geothermal-Solar Systems
    Demonstration - Lessons Learnt 3
  publish_date: 2023-08
  project_name: Yanderra Shallow Geothermal-Solar Systems Demonstration
  what_happened: Data analysis by the University of Melbourne showed the system achieved
    coefficients of performance (COPs) of up to 5, with averages above approximately
    3.5, exceeding expectations even though ground loops were installed in a more
    compacted configuration than designed due to ground conditions encountered during
    construction. This demonstrated that ground loop size — a significant capital
    cost driver — could potentially be reduced in future designs.
  lesson_learnt: When designing geothermal-solar systems, clients should be presented
    with lifecycle cost trade-offs between ground loop size (capital cost) and long-run
    COP (operating cost); data from this project suggests that even compacted loop
    configurations can deliver strong performance, giving designers flexibility to
    reduce capital costs without severely compromising efficiency.
