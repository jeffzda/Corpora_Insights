- record_id: ARENA-DLV-49853
  source_title: Yanderra Shallow Geothermal-Solar Systems Demonstration Lessons Learnt
    1
  publish_date: 2022-08
  project_name: Ground Source Systems Yanderra Shallow Geothermal-Solar Systems Demonstration
  what_happened: During construction of the GSHP ground loop system, unexpected rock
    floaters, large boulders, and variable ground conditions were encountered on site,
    requiring rapid redesign of ground loop placement. Removal of boulders was assessed
    as too costly, and delays to the construction program added to project costs.
  lesson_learnt: Conduct thorough site characterisation before finalising design and
    commencing installation of substantial GSHP systems — unexpected ground conditions
    (rock floaters, boulders) require rapid on-site decision-making and can cause
    costly construction delays; idle civil equipment on site is expensive.
