- record_id: ARENA-DLV-6601
  source_title: Ground Source Systems - Yanderra Shallow Geothermal-Solar Systems
    Demonstration - Lessons Learnt 3
  publish_date: 2023-08
  project_name: Yanderra Shallow Geothermal-Solar Systems Demonstration
  what_happened: The shallow geothermal-solar market for Australian agriculture remained
    immature, with limited numbers of ground-source heat pump designers and installers
    capable of meeting the specific needs of the poultry industry. Large earthwork
    contractors in rural settings were also scarce, further constrained by competition
    from major metropolitan infrastructure projects.
  lesson_learnt: Future agricultural geothermal-solar projects should anticipate thin
    supply chains for both GSHP designers and rural earthwork contractors; proponents
    should build new partnerships with smaller drilling/civil contractors and industry
    associations (AREEA, IGSHPA, AIRAH) early in project development to avoid procurement
    bottlenecks.
