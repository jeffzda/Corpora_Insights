  publish_date: 2023-02
  project_name: Ground Source Systems Yanderra Shallow Geothermal-Solar Systems Demonstration
  what_happened: The geothermal-solar system was commissioned and operational by September
    2022, ahead of the planned November 2022 start date. Pre-commissioning data from
    the September bird batch captured critical winter-season heating performance data,
    recording gas savings of up to 83% compared to control sheds.
  lesson_learnt: Prioritising early commissioning in heating-system retrofit projects
    — even as a pre-commissioning run — enables capture of seasonal performance data
    that would otherwise require waiting a full year, and validates system performance
    under real operating conditions ahead of full commissioning.
