- record_id: ARENA-DLV-27204
  source_title: Yanderra Shallow Geothermal Solar Systems Demonstration Lessons Learnt
    2
  publish_date: 2023-02
  project_name: Ground Source Systems Yanderra Shallow Geothermal-Solar Systems Demonstration
  what_happened: In this retrofit project, commercial poultry operations continued
    throughout the installation period. Shorter-than-expected turnarounds between
    bird batches compressed available installation windows, forcing fan coil unit
    installation inside sheds to proceed in stages rather than all at once, with strict
    biosecurity measures limiting when workers could enter.
  lesson_learnt: For retrofit installations in operating poultry or similar biosecurity-sensitive
    agricultural facilities, schedule all in-shed work exclusively during cleaning
    periods between batches, build staging into the construction programme from the
    outset, and maintain clear and frequent communication with farm managers to obtain
    early notice of batch scheduling changes — failure to do so risks programme delays
    and cost overruns.
