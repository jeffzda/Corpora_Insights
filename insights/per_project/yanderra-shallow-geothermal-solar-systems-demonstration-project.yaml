  publish_date: 2023-08
  project_name: Yanderra Shallow Geothermal-Solar Systems Demonstration
  what_happened: During the 3rd batch of birds (March–April 2023), the commissioned
    geothermal-solar system demonstrated up to 100% displacement of gas consumption
    for heating compared to control sheds, confirming that LPG heating can be completely
    eliminated using GSHP-solar technology in a commercial poultry setting.
  lesson_learnt: Future geothermal-solar installations in poultry or similar agricultural
    operations can be designed to fully displace gas heating; however, offering partial
    displacement configurations as a lower-capital entry option may improve farmer
    buy-in, particularly for retrofits where existing gas infrastructure can serve
    as backup.
