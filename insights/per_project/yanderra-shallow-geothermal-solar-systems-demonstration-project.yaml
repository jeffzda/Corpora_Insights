- record_id: ARENA-DLV-6602
  source_title: Ground Source Systems - Yanderra Shallow Geothermal-Solar Systems
    Demonstration - Lessons Learnt 3
  publish_date: 2023-08
  project_name: Yanderra Shallow Geothermal-Solar Systems Demonstration
  what_happened: Dust accumulation in the poultry shed rapidly clogged fan coil unit
    filters, reducing and in some cases stopping heat delivery within days of operation.
    When filters blocked, heat could not be dissipated from the coils, triggering
    the GSHP soft lock and leaving chicks without adequate heating. The initial design
    did not include automated cleaning, and resolution required out-of-scope additional
    effort and investment.
  lesson_learnt: Fan coil units deployed in dusty agricultural environments such as
    poultry sheds must be specified with integrated automated filter-cleaning systems
    from the outset — the cleaning solution and its installation cost should be built
    into the design and budget to prevent operational performance degradation and
    cost overruns.
  issue_severity: major
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: project developer
  delay_category: commissioning/integration
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Modifications were made to fan coil units including operational
    programming changes and incorporation of know-how from a project participant,
    resulting in an automated cleaning solution that maintained performance over subsequent
    bird batches.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: other
  source_pages:
