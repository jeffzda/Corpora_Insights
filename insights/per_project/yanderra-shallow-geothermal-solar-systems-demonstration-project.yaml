- record_id: ARENA-DLV-27202
  source_title: Yanderra Shallow Geothermal Solar Systems Demonstration Lessons Learnt
    2
  publish_date: 2023-02
  project_name: Ground Source Systems Yanderra Shallow Geothermal-Solar Systems Demonstration
  what_happened: Experience across multiple poultry farms and multiple sheds at Yanderra
    revealed significant variation in thermal load demand between individual sheds
    on the same farm, driven by differences in farmer operating practices, shed orientation,
    sun and wind exposure, and the condition of shed envelopes.
  lesson_learnt: Do not assume a single thermal load design will suit all sheds on
    a given farm — conduct energy audits and monitor existing energy consumption per
    shed early in the design phase to right-size systems and avoid costly over- or
    under-design; for new-build sheds, use energy modelling based on planned envelope
    and regional operational practices.
  issue_severity: moderate
  project_type: industrial decarbonisation
