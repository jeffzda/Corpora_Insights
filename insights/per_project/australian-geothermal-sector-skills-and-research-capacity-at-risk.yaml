- record_id: ARENA-DLV-14966
  source_title: 'Looking Forward: Barriers, Risks and Rewards of the Australian Geothermal
    Sector to 2020 and 2030'
  publish_date: 2014-06
  project_name: Australian Geothermal Sector – Skills and Research Capacity at Risk
  what_happened: Geothermal research employment peaked in 2010 with the equivalent
    of 77 full-time staff and over 40 post-graduate students; by 2014, with funding
    stalled and projects inactive, this research and engineering expertise was at
    risk of being lost to other industries.
  lesson_learnt: Sector capability — including specialised research and engineering
    personnel — deteriorates rapidly when project activity stalls; funding programs
    should include mechanisms to retain core technical expertise during periods of
    market failure or technology uncertainty, as rebuilding this capability when conditions
    improve is significantly more costly than retaining it.
