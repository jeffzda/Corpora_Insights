- record_id: ARENA-DLV-25925
  source_title: Review of ARENA's Reliability Portfolio
  publish_date: 2020-01
  project_name: ARENA Reliability Portfolio — Solar Thermal Programme
  what_happened: Across nine solar thermal projects in the portfolio — including three
    terminations and two under variation — the consistent finding was that concentrating
    solar thermal plants face excessive capital and deployment costs, and require
    deep cost reductions before becoming economically viable. The ASTRI mid-term review
    in 2016 recommended pivoting to scale-up demonstrations, but no new solar thermal
    demonstration projects were funded by ARENA after that review.
  lesson_learnt: Portfolio funding for a technology sector that consistently fails
    commercial viability tests should be redirected to earlier innovation stages (R&D
    and small pilots) rather than continued large-scale demonstrations until a credible
    cost reduction pathway is demonstrated; funders should act on mid-term review
    recommendations in a timely manner.
