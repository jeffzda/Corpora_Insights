  evidence_excerpt: The solar thermal industry widely acknowledges the need for deep
    cost reductions before the technology becomes economically viable, and that these
    cost reductions will only be achieved through 'a disruptive approach to all of
    the components in the system'... We suggest that limited further investigation
    be dedicated to solar thermal projects above those committed to ASTRI and to Vast
    Solar until findings from these projects have been established.
