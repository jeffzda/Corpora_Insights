- record_id: ARENA-DLV-29904
  source_title: Yadlamalka Energy - Co-located Vanadium Flow Battery Storage and Solar
    - Operations Report 1
  publish_date: '2025-06-30'
  project_name: Yadlamalka Energy Spencer Energy Project
  what_happened: 'In a DC-coupled hybrid configuration, the single 4.6 MVA PCS serving
    both the 6 MW PV array and 2 MW battery created an export bottleneck: when the
    battery was offline or capacity-constrained, solar output had to be curtailed
    to stay within the 4.4 MW AC export limit, causing October 2024 solar generation
    to fall to ~323 MWh against ~529 MWh in September despite improving spring irradiance.'
  lesson_learnt: In DC-coupled hybrid systems, size inverter capacity with headroom
    above the sum of PV and battery peak output, or design operational protocols that
    ensure the battery can always absorb excess PV; a single PCS bottleneck means
    battery downtime directly curtails solar revenue and LGC generation.
  issue_severity: moderate
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
