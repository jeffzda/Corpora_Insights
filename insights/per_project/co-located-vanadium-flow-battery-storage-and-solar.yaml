- record_id: ARENA-DLV-67951
  source_title: Yadlamalka Energy - Spencer Energy Co-located Vanadium Flow Battery
    Storage and Solar Project - Factory Integration Testing Report
  publish_date: 2021-11
  project_name: Yadlamalka Energy Spencer Energy Co-located Vanadium Flow Battery
    Storage and Solar Project
  what_happened: 'During factory integration testing of the Invinity VS3-022 vanadium
    flow battery with the SMA DC-coupled architecture, transitions from charging to
    discharging repeatedly tripped the SMA DC-DC-Converter due to a severe power rating
    mismatch: the SMA DPS-500 is rated for 500 Adc while each VS3-Module is rated
    for approximately 15 Adc (~3% of inverter capacity), meaning even small control
    overshoots exceeded the current limits communicated via the SMA External Interface.'
  lesson_learnt: When integrating a battery system with a DC-coupled inverter, ensure
    the power ratings of the battery modules and inverter DC-DC converters are appropriately
    matched — a mismatch where battery modules represent only ~3% of inverter capacity
    makes reliable charge-to-discharge transitions impossible, as minor control overshoots
    will repeatedly trip the inverter. Parallelising additional battery modules significantly
    mitigates this issue.
  issue_severity: major
  project_type: storage
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: technology vendor
  delay_category: commissioning/integration
  failure_mode: unvalidated integration
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Using two VS3-Modules in parallel at one SMA DC-DC-Converter
    instead of one demonstrated a major improvement in transition reliability, reducing
    but not eliminating tripping events.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id052
  - 4
  - 29
  - 30
  evidence_excerpt: While the SMA DC-DC-Converter is rated for 500Adc and the control
    is optimized for this range, the VS3-Modules connected are rated for ~15Adc each,
    accounting to ~3% of the SMA DC-DC-Converter's capacity. So even small overshoots
    of the SMA DC-DC-Converter control could exceed the limitations provided through
    the SMA External Interface.
