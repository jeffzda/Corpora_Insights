  what_happened: The 8 MWh / 4-hour discharge duration proved sufficient to cover
    all major high-price intervals in South Australia during Q3 2024 (most lasting
    30 minutes, few extending to 2 hours) and allowed a second charge-discharge cycle
    during prolonged volatility events — an outcome that a 2-hour system could not
    have achieved.
