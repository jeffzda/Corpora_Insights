  publish_date: 2024-05
  project_name: Yadlamalka Energy Spencer Energy Co-located Vanadium Flow Battery
    Storage and Solar Project
  what_happened: Several originally distinct test cases in Test Package 3 (cases 3.1,
    3.2, 3.3) could not be executed as standalone solar-only charge tests because
    intermittent PV production made full solar-only charging impractical. These test
    cases were satisfied by referencing evidence from Test Package 2 cycles that incidentally
    included solar-dominant or solar-only charging phases.
  lesson_learnt: For co-located solar-storage test programs, solar-only charging test
    cases should not be designed as standalone tests — the intermittent nature of
    PV makes it unreliable as the sole power source for a controlled full-cycle test.
    Design test cases to capture solar contribution evidence within broader system
    cycles rather than attempting pure solar-only tests.
