  delay_category: commissioning/integration
  failure_mode: execution & logistics
  outcome_class: delayed but recoverable
  secondary_failure_mode: coordination & stakeholders
  intervention_note: Invinity provided dedicated training sessions to NGE, and two
    customer support technicians plus a system engineer attended site for initial
    commissioning; local expertise proved invaluable in resolving minor post-departure
    issues.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: hybrid systems
  source_pages:
  - 10
