  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated integration
  intervention_note: Invinity applied updated BMS stability parameters mid-testing;
    the project team documented the resulting DoD reduction so the operator could
    understand the effective usable capacity versus reported SoC.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
