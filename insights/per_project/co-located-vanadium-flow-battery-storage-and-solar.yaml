  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The two test cases (2.5a active, 2.5b disabled) were designed
    to quantify this difference; results directly inform operator dispatch strategy
    to minimise parasitic losses during idle periods.
  transferability: moderate
  delay_magnitude: null
  technology_domain: battery storage
