  source_title: Yadlamalka Energy Project Commissioning Report
  publish_date: '2024-05-13'
  project_name: Yadlamalka Energy Project
  what_happened: The project was originally planned for a site at Yadlamalka Station
    but had to be relocated to Port Pirie due to planning issues. The MVPS (a 9–10
    month lead-time item) had already been ordered and was consequently delivered
