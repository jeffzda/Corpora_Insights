  what_happened: The factory integration test confirmed that the SMA DC-coupled system
    can perform the VS3-Module initial charge procedure using PV power, with one already-precharged
    module providing the required bus voltage while another module undergoes initial
    precharge — a functionally important capability for site commissioning.
  lesson_learnt: The initial charge of VS3-Modules via PV power in a DC-coupled SMA
    architecture is feasible and should be included in site commissioning procedures;
    at least one pre-charged module must be available to establish the DC bus voltage
    before additional modules can undergo initial precharge.
