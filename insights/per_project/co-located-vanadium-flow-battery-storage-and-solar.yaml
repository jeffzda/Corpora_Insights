  what_happened: Supply constraints meant that the VS3-Modules used in factory integration
    testing were fitted with a different type of DC-DC-Converter (Model A or B variant)
    from the ones specified for the actual Yadlamalka project, meaning test results
    cannot be directly applied to validate the production configuration.
  lesson_learnt: Factory integration testing should use production-equivalent hardware;
    where supply constraints force substitution, the proponent must explicitly assess
    and document the expected differences in system behaviour arising from the substituted
    components before relying on test results for the deployed configuration.
