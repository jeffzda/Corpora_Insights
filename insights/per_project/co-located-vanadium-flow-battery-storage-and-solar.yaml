  what_happened: The FBESM reported a nominal battery capacity of 84 Ah for one active
    VS3-Module, which appears to be approximately twice the actual value. While this
    may have limited impact if the ratio between clusters remains consistent, it would
    cause inaccurate available energy readings in the SMA Modbus interface.
  lesson_learnt: Battery management systems should be verified to report accurate
    nominal capacity values to the inverter's external interface during factory integration
    testing, as incorrect values affect power distribution logic between DC-DC-Converters
    and produce misleading available energy readings that could affect operational
    decisions.
