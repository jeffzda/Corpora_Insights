  source_title: Yadlamalka Energy - Spencer Energy Co-located Vanadium Flow Battery
    Storage and Solar Project - Packages 2 and 3 Testing Report
  publish_date: 2024-05
  project_name: Yadlamalka Energy Spencer Energy Co-located Vanadium Flow Battery
    Storage and Solar Project
  what_happened: 'During the third 2 MW rated-power cycle (Test Case 2.3 #3), Invinity
    implemented updated Battery Management System parameters that introduced a 6%
    depth-of-discharge buffer (3% at low SoC and 3% at high SoC) to improve system
    stability. This reduced the customer-usable DoD to approximately 94%, while the
    BMS continued to report 0–100% SoC to the operator.'
  lesson_learnt: BMS firmware or parameter updates applied during the testing phase
    can alter effective usable capacity without changing reported SoC values — project
    teams should be aware that vendor-applied stability improvements may reduce accessible
    energy and ensure that performance guarantees reference usable DoD rather than
    nominal SoC range.
