    high-price event lengths in the target market; South Australia's Q3 2024 data
    show most high-price intervals lasted 30 minutes with rare extensions to 2 hours,
    meaning 4-hour duration provided full event coverage and second-cycle capability
    unavailable to 2-hour systems.
