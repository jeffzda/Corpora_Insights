  what_happened: 'VFB production was significantly disrupted by COVID-19 supply chain
    constraints: key electronic components for internal battery controls became unavailable,
    requiring some components to be entirely redesigned and replaced with alternatives,
    while global shipping disruptions further delayed delivery. Batteries were delivered
    in batches, with the first batch arriving in December 2022 and the remainder in
    Q1 2023.'
