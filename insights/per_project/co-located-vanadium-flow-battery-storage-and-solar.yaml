- record_id: ARENA-DLV-67959
  source_title: Yadlamalka Energy - Spencer Energy Co-located Vanadium Flow Battery
    Storage and Solar Project - Factory Integration Testing Report
  publish_date: 2021-11
  project_name: Yadlamalka Energy Spencer Energy Co-located Vanadium Flow Battery
    Storage and Solar Project
  what_happened: 'The voltage and current limits configuration for the SMA DC-DC-Converter
    required specific adjustment: the default Port 1 Over Voltage Instantaneous Level
    of 1550 V had to be reduced to 1000 V to match the maximum operating voltage of
    the VS3-Modules, and two-level voltage and current limits (curtail limits and
    trip limits) needed to be set with sufficient offset between them to prevent nuisance
    tripping.'
  lesson_learnt: When commissioning a SMA DC-DC-Converter with Invinity VS3-Modules,
    the default Port 1 Over Voltage Instantaneous Level must be reduced from 1550
    V to match the VS3 maximum operating voltage, and the curtail and trip limits
    for both voltage and current must be set with sufficient margin between them to
    prevent inadvertent converter trips during normal operation.
  issue_severity: minor
  project_type: storage
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: technology vendor
  delay_category: null
  failure_mode: unvalidated integration
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The Port 1 Over Voltage Instantaneous Level was adjusted from
    the default 1550 V to 1000 V for the test, and two-level limits were configured
    with appropriate offsets.
  transferability: narrow
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id060
  - 30
  - 31
  evidence_excerpt: Especially with the given structure of the VS-3-Modules and if
    the maximum operating voltage of the VS-3-modules is not identical with the maximum
    operating voltage of the SMA DC-DC-Converter it is advised to also apply an adjusted
    setting of the Port 1 Over Voltage Instantaneous Level as executed for the testing.
    Default setting of this limits is 1550V within the SMA DC-DC-Converter and was
    adjusted to a setting of 1000V for the presented tests.
  confidence_note: null
