  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: No further operational difference was identified beyond the bus
    voltage perturbation; the system continued to operate without disconnection.
  transferability: narrow
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id059
  - 26
  - 27
  evidence_excerpt: One detailed view on this external influence is given by Figure
    17 which shows how the bus-voltage changes within 500ms by about -13V while there
    is no change in the charging current visible. The change by -13V reflects well
    to the charging current of ~10A of Module 3 in its initial precharge mode.
