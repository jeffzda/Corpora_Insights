  source_title: Yadlamalka Energy Project Lessons Learnt Report Number 2
  publish_date: '2024-03-28'
  project_name: Yadlamalka Energy Project
  what_happened: Because the BESS partner Invinity is based in the UK, deploying technical
    support for battery commissioning required advance training of the local EPC (NGE)
    and attendance by Invinity customer support technicians and a system engineer
    for initial power-up and BMS configuration across 246 battery modules.
  lesson_learnt: Require all foreign-based vendor partners to conduct training sessions
    for local engineers before commissioning begins — this builds local capacity to
    handle common post-commissioning interventions and reduces dependence on costly
    international technical support visits.
