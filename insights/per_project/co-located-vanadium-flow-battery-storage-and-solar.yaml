  what_happened: The site has a grid import power limitation of 1 MW AC at the point
    of connection, which constrained battery charging power to approximately 850 kW
    DC at the battery terminal when only grid power was available (i.e., without solar).
    This limitation made it impossible to conduct 1 MW AC charging tests at the PCS
    terminal and required test procedures to be modified.
  lesson_learnt: Grid import constraints at the point of connection must be accounted
    for in both the system design and the test plan for co-located solar-storage projects
    — import limits that appear adequate at system level can restrict storage charging
    capability to well below rated power when solar is unavailable, affecting both
    testing and operational flexibility.
