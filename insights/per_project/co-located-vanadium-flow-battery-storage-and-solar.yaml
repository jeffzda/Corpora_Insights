  source_title: Yadlamalka Energy - Spencer Energy Co-located Vanadium Flow Battery
    Storage and Solar Project - Packages 2 and 3 Testing Report
  publish_date: 2024-05
  project_name: Yadlamalka Energy Spencer Energy Co-located Vanadium Flow Battery
    Storage and Solar Project
  what_happened: Comparison of Test Cases 2.5a and 2.5b demonstrated that keeping
    the VFB system enabled (active) during a 4-hour hold at 70% SoC resulted in a
    round-trip efficiency of 69%, versus 76.04% when the system was held in disabled
    mode. The enabled state consumed an additional 552 kWh AC in auxiliary power and
    caused a self-discharge loss of approximately 2.3% SoC (equivalent to ~991 kWh
    DC) over the 4-hour hold period.
  lesson_learnt: For vanadium flow battery systems, holding the battery in an enabled/active
    state during idle periods significantly increases auxiliary consumption and self-discharge
    — operators should disable the system during extended idle periods rather than
    keeping it active, to preserve round-trip efficiency and minimise parasitic losses.
  issue_severity: moderate
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: project developer
