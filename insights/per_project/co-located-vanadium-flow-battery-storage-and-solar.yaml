  what_happened: 'During the 2 MW rated-power cycle test (Test Case 2.3 #1), the charge
    profile was disturbed by irregular PV production. The 1 MW grid import limit meant
    the system was dependent on solar to reach 2 MW charging, making the charge rate
    variable and test conditions less controlled than intended.'
  lesson_learnt: For co-located solar-storage systems with grid import restrictions,
    testing at rated battery charge power is only reliably achievable when solar production
    is consistent — schedule high-power charge tests for periods of stable irradiance,
    or design the system with sufficient grid import headroom to charge independently
    of solar.
