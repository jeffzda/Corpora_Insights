  what_happened: The Invinity VFB required ~100–150 kW average auxiliary power (pumps,
    cooling, controls) when held in active standby, totalling an estimated 400–500
    MWh of parasitic consumption over the year and reducing effective round-trip efficiency
    from ~70% (electro-chemical) to ~54% when auxiliary loads are included.
  lesson_learnt: Define and implement an inactive/standby mode for flow batteries
    during periods of non-dispatch to minimise auxiliary parasitic losses; failing
    to do so can consume 400–500 MWh/year in a 2 MW / 8 MWh system and materially
    erode project economics, but the trade-off is a ~1-minute response latency that
    precludes fast-response FCAS participation from that mode.
