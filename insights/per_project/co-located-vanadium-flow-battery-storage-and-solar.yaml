- record_id: ARENA-DLV-6006
  source_title: Yadlamalka Energy Project Lessons Learnt Report Number 2
  publish_date: '2024-03-28'
  project_name: Yadlamalka Energy Project
  what_happened: Early modelling and simulation of battery thermal behaviour in Australian
    climatic conditions determined that shading did not deliver expected return on
    investment, as a significant portion of heat load originates internally, and the
    large electrolyte thermal mass buffers ambient temperature swings.
  lesson_learnt: Commission digital thermal modelling of vanadium flow batteries early
    in design, incorporating internal heat generation and electrolyte thermal mass
    — this analysis showed shading was not cost-effective and identified that only
    the hottest days would cause capacity derating.
  issue_severity: minor
  project_type: multi-technology/hybrid
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: project developer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: Digital thermal modelling by Invinity and Habitat demonstrated
    that shading was not warranted and that batteries would operate nominally most
    of the year with minor derating on the hottest days.
  transferability: narrow
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id006
  - 9
  evidence_excerpt: It was determined that shading did not offer the anticipated return
    on investment nor substantially mitigate heat-related issues, primarily because
    a substantial portion of the heat load originates internally… This demonstrated
    that the batteries would operate nominally most of the year, with some capacity
    derating during the hottest days of the year.
  confidence_note: Technology domain set to battery storage as the finding is specific
    to VFB thermal characteristics.
