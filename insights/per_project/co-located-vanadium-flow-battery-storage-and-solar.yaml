- record_id: ARENA-DLV-67958
  source_title: Yadlamalka Energy - Spencer Energy Co-located Vanadium Flow Battery
    Storage and Solar Project - Factory Integration Testing Report
  publish_date: 2021-11
  project_name: Yadlamalka Energy Spencer Energy Co-located Vanadium Flow Battery
    Storage and Solar Project
  what_happened: During initial precharge of Module 3 via PV power, an external current
    draw of approximately 10 A caused a DC bus voltage drop of approximately 13 V
    within 500 ms, demonstrating that the initial precharge mode of a module in the
    same cluster creates a measurable perturbation on the shared DC bus.
  lesson_learnt: When designing DC-coupled hybrid systems with vanadium flow batteries
    undergoing initial precharge, engineers should account for the voltage perturbation
    caused by precharge current draw on the shared DC bus; bus voltage stability analysis
    should include this operating scenario.
  issue_severity: minor
  project_type: storage
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: technology vendor
