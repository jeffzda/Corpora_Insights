- record_id: ARENA-DLV-16271
  source_title: Energy Storage Study
  publish_date: 2015-07
  project_name: Australia — NSW Solar Bonus Scheme Expiry and Storage Market Trigger
  what_happened: Over 146,000 NSW customers who installed 342 MW of solar PV under the NSW Solar Bonus Scheme were all scheduled to lose their premium gross-metering feed-in tariffs simultaneously on 1
    January 2017. This was expected to create a sudden large cohort of customers with financial incentive to adopt battery storage to maximise behind-the-meter self-consumption.
  lesson_learnt: The simultaneous expiry of a large feed-in tariff scheme creates a predictable and concentrated surge in storage demand — ARENA and industry should use the period prior to scheme expiry
    to ensure storage products, installation standards, and aggregator business models are market-ready to capture this opportunity safely and efficiently.
