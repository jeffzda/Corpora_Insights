- record_id: ARENA-DLV-72313
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects - First Edition Results'
  publish_date: '2014'
  project_name: 'What Happens When We Un-Plug: Exploring the Consumer and Market Implications of Viable Off-Grid Energy Supply'
  what_happened: Research found that stand-alone power solutions for suburban individual homes remain significantly constrained by the availability of adequate roof space for solar PV (requiring systems
    of approximately 8kW) and by difficulty using wood fuel in suburban areas, making off-grid viability unlikely before 2020 for most suburban households without a major step-change in infrastructure costs.
  lesson_learnt: Stand-alone power solutions for suburban households face a binding physical constraint — roof area — rather than cost alone; technology and policy pathways that assume suburban off-grid
    viability in the near term should explicitly test whether available roof space can accommodate the PV system sizes required (around 8kW for a typical house).
