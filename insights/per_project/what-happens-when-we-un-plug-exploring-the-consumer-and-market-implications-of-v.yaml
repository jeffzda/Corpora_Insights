  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects - First Edition Results'
  publish_date: '2014'
  project_name: 'What Happens When We Un-Plug: Exploring the Consumer and Market Implications of Viable Off-Grid Energy Supply'
  what_happened: Research by Energy for the People and ATA found that stand-alone micro-grids for greenfield housing developments are likely to be commercially viable before 2020 where natural gas is available
    and delivered by a specialist energy service provider, and are already viable today in regional areas when assessed over a 25-year period.
  lesson_learnt: Policy makers and network businesses should treat off-grid viability as an imminent commercial reality — not a distant prospect — particularly in regional greenfield and high-load areas
    where energy service provider delivery models are economically superior over a 25-year horizon; network investment planning should account for potential customer defection in these contexts.
