- record_id: ARENA-DLV-52531
  source_title: ARENA's Virtual Power Plant Knowledge Sharing Workshop Summary
  publish_date: 2019-03
  project_name: NSW Smart Energy for Homes and Businesses Program
  what_happened: The NSW Department of Planning and Environment's EOI for a 200 MW VPP program received 39 submissions across a large range of technology and business model solutions, providing valuable
    insights on industry capabilities and market complexities, but also revealing the challenge of managing customer churn versus lock-in, lack of industry standards for communications protocols, and the
    distribution of value between program partners and participants.
  lesson_learnt: Running an EOI before finalising program design for a large VPP program is an effective way to surface industry capability gaps and market complexities — key issues to probe in an EOI include
    communications protocol standards, value distribution between partners and participants, and retrofit versus new-install economics.
