  what_happened: When procuring the GSHP system, Frasers Property evaluated water-cooled
    alternatives to conventional refrigerant gas-filled loop systems and selected
    the water-cooled option, finding it offered reduced refrigerant gas load, shorter
    lead times for loop material, lower cost than copper alternatives, and better
    per-level temperature control via fan coil units.
  lesson_learnt: Evaluate water-cooled GSHP systems as a preferred alternative to
    refrigerant gas-filled systems in dense residential projects — the safety, running-cost,
    and lead-time benefits outweigh the modest premium and larger footprint, though
    space allocation must be confirmed at design stage.
