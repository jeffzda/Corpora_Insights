  source_title: Net Zero Energy Demand Homes Lessons Learnt 1
  publish_date: '2021-11-30'
  project_name: Net Zero Energy Demand Homes
  what_happened: The design of the embedded energy network for the NZED homes benefited
    from the involvement of Real Utilities, Frasers Property's wholly-owned licensed
    energy retailer, which brought property development expertise that typical energy
    retailers lack, enabling a fit-for-purpose solution for the homes' projected energy
    needs.
  lesson_learnt: When designing embedded energy networks for residential developments,
    ensure the energy retailer or network provider has property development expertise
    — or establish a structured collaboration between the developer and retailer —
    as standard energy retail expertise alone is insufficient to design an appropriate
    embedded network solution.
