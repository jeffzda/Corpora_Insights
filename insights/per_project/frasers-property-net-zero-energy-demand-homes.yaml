  publish_date: '2023-12-13'
  project_name: Net Zero Energy Demand Homes
  what_happened: At the time of procurement for the IEQ monitoring study, there were
    few indoor air quality sensors available in Australia meeting the project's requirements,
    leading to selection of an overseas manufacturer. The Australian market has since
    expanded, with more locally available products now accessible.
  lesson_learnt: Projects procuring specialist monitoring equipment should re-assess
    the local market at time of procurement rather than relying on a prior market
    scan — the Australian market for IEQ sensors expanded significantly between project
    inception and delivery, and local procurement would have been feasible if reassessed
    closer to procurement. Future projects should prioritise local procurement assessment
    to reduce supply chain risk and simplify logistics.
