- record_id: ARENA-DLV-32901
  source_title: Frasers Property 'Net Zero Energy Demand Homes' Lessons Learned Report
    3
  publish_date: '2024-02-29'
  project_name: Net Zero Energy Demand Homes (Ed.Square, Edmondson Park)
  what_happened: Placing solar PV panels, electric-boosted solar domestic hot water
    (DHW) units, and associated plant on the roofs of three-storey town homes created
    spatial congestion and safety-access conflicts. The requirement to maintain a
    1.5 m clear zone from live roof edges, combined with multiple roof-level changes
    requiring access steps and ladders, significantly constrained the number of PV
    panels that could be installed and the layout of all roof-mounted equipment.
  lesson_learnt: For medium-density homes with roof-mounted solar and DHW systems,
    conduct early design coordination to establish safe-access setbacks (circa 1.5
    m from live edges) before finalising equipment layouts — prioritise fixed-location
    equipment (DHW above bathrooms) first, then arrange more flexible systems (PV
    panels) around them to maximise solar access and avoid overshadowing. Where a
    1.5 m setback is not achievable, design in a significant parapet (circa 1 m) or
    equivalent safety system at the design stage, not retrospectively.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: project developer
  delay_category: null
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: The team established a 1.5 m clear-zone parameter from the live
    roof edge and arranged PV panels around the more location-constrained DHW units
    to optimise the available space within safety constraints.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages:
  - 8
  - 9
  - 10
  evidence_excerpt: When initial designs were created to incorporate solar hot water
    units, the requirements associated with compliant design weren't fully accounted
    for. The original design considered architectural outcomes, with the wing of each
    of the solar units facing each other. Whilst this design was compliant to class
    1 buildings (single residential homes) and verified by the manufacturer to work
    to capacity, it was not compliant with class 2 buildings (Multi-residential /
    apartments). To ensure it was compliant with class 2 buildings, the solar units
    needed to be orientated to 45 degrees true north.
  confidence_note: project_scale_band set to demonstration as the primary project
    goal is to generate evidence for widespread adoption, though homes are real dwellings
    with occupants. Canonical record merged from 3 source records across 3 document(s).
