- record_id: ARENA-DLV-57463
  source_title: Net Zero Energy Demand Homes Lessons Learnt 1
  publish_date: '2021-11-30'
  project_name: Net Zero Energy Demand Homes
  what_happened: The scale of the Ed.Square masterplanned community (1,884 homes)
    and Frasers Property's size enabled cost efficiencies in services and contractor
    procurement for the 51 NZED homes that supported the project's feasibility, which
    would not have been available to a standalone smaller development.
  lesson_learnt: Embedding a small NZED or net-zero pilot within a larger masterplanned
    community leverages procurement scale to improve feasibility — developers without
    this scale should consider aggregating with other projects or developers to achieve
    comparable procurement leverage.
