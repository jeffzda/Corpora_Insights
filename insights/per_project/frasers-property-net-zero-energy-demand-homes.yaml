    launch; however, the sales campaign coincided with strong market demand and the
    availability of the $25,000 Homebuilder Grant, making it difficult to isolate
    the specific commercial uplift attributable to the NZED features.
  lesson_learnt: When measuring the commercial premium of net-zero home features,
    control for concurrent market stimuli (e.g. government grants, housing market
    upturns) — the Ed.Square sales result cannot yet be disaggregated from the Homebuilder
    Grant effect, and future studies should use comparison cohorts or timing variation
    to isolate the energy-feature premium.
