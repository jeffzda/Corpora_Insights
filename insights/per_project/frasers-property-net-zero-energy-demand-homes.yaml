- record_id: ARENA-DLV-32902
  source_title: Frasers Property 'Net Zero Energy Demand Homes' Lessons Learned Report
    3
  publish_date: '2024-02-29'
  project_name: Net Zero Energy Demand Homes (Ed.Square, Edmondson Park)
  what_happened: Electric-boosted solar DHW systems were specified uniformly across
    all home typologies including one-bedroom ground-floor apartments. This created
    dead-leg plumbing issues due to long pipe runs from the roof to the ground floor,
    higher unit costs compared with simpler electric systems, additional roof-space
    congestion, and disproportionate system size relative to the low hot-water demand
    of a single-bedroom dwelling.
  lesson_learnt: Before committing to a standardised technology specification across
    a mixed-typology development, investigate the suitability of each technology for
    each home type — smaller dwellings with low demand and long pipe runs may achieve
    better energy and cost outcomes from alternative systems (e.g. instantaneous electric
    or heat-pump units) supplemented by additional PV, rather than a one-size-fits-all
    solar DHW specification.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: project developer
  delay_category: null
  failure_mode: poor scoping
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: The project team identified that for future projects the one-bedroom
    ground-floor typology could benefit from an instantaneous electric hot water system
    concealed in a cupboard, supplemented by additional PV panels in the space freed
    on the roof.
  transferability: moderate
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id002
  - 9
  - 10
  - 11
  evidence_excerpt: Dead-leg issues were created due to the substantial pipe-work
    distance between the roof-mounted Electric-Boosted Solar DHW system and the one-bedroom
    apartment on ground floor... the team believes that greater investigation could
    have gone into alternatives particularly for the one-bedroom homes where relative
    energy savings may have been better overcome with the commitment to alternative
    technologies such as heat pump or electric instantaneous hot water units.
