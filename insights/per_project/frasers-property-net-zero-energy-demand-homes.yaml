  what_happened: The embedded energy network structure, which is essential for validating
    net-zero energy consumption data and supplying residents with renewable or carbon-neutral
    energy, was found to be viable for strata-titled medium-density homes but not
    replicable for Class 1 Torrens-titled homes due to the absence of common property
    for solar panels and bulk metering infrastructure.
  lesson_learnt: Do not assume embedded network models applicable to strata housing
    can transfer to Torrens-titled homes — the absence of common property makes bulk
    metering and shared solar infrastructure legally and commercially unviable in
    that context; a fundamentally different delivery approach is needed.
