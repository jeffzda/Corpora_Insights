- record_id: ARENA-DLV-32903
  source_title: Frasers Property 'Net Zero Energy Demand Homes' Lessons Learned Report
    3
  publish_date: '2024-02-29'
  project_name: Net Zero Energy Demand Homes (Ed.Square, Edmondson Park)
  what_happened: Staggered construction and settlement dates across four blocks (Block
    D South settling in October 2021 and Block E South not settling until December
    2023 — over two years later) meant that monitoring contract periods tied to individual
    settlement dates did not overlap by the minimum one year required under the ARENA
    agreement. Blocks D North and D South required contract variations extending monitoring
    by one and two years respectively to achieve the required overlap.
  lesson_learnt: Where a monitoring study requires a minimum period of overlapping
    data across all homes, do not tie individual monitoring contract start dates to
    individual settlement dates in a staggered delivery program — either allow flexibility
    to delay the monitoring start until all homes have settled, or specify a longer
    initial monitoring term (circa three years) in the original contract of sale to
    absorb construction and settlement schedule movement without requiring contract
    variations.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: project developer
  delay_category: construction/installation
  failure_mode: poor scoping
  outcome_class: delayed but recoverable
  secondary_failure_mode: coordination & stakeholders
  intervention_note: The team is pursuing contract variations with owners in Blocks
    D North and D South to extend monitoring periods by one and two years respectively,
    and coordinating across development, sustainability, legal, customer care, and
    IT teams to manage the extensions.
  transferability: moderate
  delay_magnitude: 1-3 years
  technology_domain: DER
  source_pages: &id003
  - 12
  - 13
  - 14
  evidence_excerpt: Block D South settlements occurred earlier in the program (October
    2021) whereas Block E South was the final portion to complete settlements over
    2 years later (December 2023). This resulted in monitoring periods not overlapping...
    The reality of construction delays, due to supply chain disruptions and covid,
    over the project delivery program has hindered the ability to obtain a whole years'
    worth of overlapping data across all homes to date.
  confidence_note: lifecycle_phase assigned as operations because the issue manifested
    during the post-settlement data-collection phase, not during construction. delay_category
    set to construction/installation as the root cause was construction program slippage
    due to supply chain and COVID.
