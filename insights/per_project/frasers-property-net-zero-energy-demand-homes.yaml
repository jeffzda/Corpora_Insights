- record_id: ARENA-DLV-32904
  source_title: Frasers Property 'Net Zero Energy Demand Homes' Lessons Learned Report
    3
  publish_date: '2024-02-29'
  project_name: Net Zero Energy Demand Homes (Ed.Square, Edmondson Park)
  what_happened: Approximately 20% of AWAIR indoor environmental quality monitoring
    devices and approximately 30% of Wattwatchers energy monitoring devices were inactive
    or not consistently transmitting data at the time of reporting. For Block D (earliest
    settlements, October 2021), only four AWAIR devices had been collecting data since
    settlement, with data gaps until March 2023; only three Wattwatchers devices had
    a full two years of data. Causes included power supply disruptions, connectivity
    interference between devices and gateways/routers, and occupants switching devices
    off.
  lesson_learnt: IEQ monitoring devices deployed across occupied residential homes
    should be selected with remote re-activation capability, or a resident-engagement
    protocol for self-recovery should be established — sensors that require on-site
    attendance to recover from power outages will accumulate data gaps across a large
    study cohort. Deploying across many homes (rather than few) partially mitigates
    the risk by reducing the proportional impact of any single sensor failure.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: project developer
  delay_category: data/validation/testing
  failure_mode: data & measurement
  outcome_class: partial success
  secondary_failure_mode: coordination & stakeholders
  intervention_note: The project team developed a remediation plan including a device
    connectivity log, monthly cross-functional meetings (sustainability, development,
    IT, customer care), a regular platform review schedule, and a troubleshooting
    and reconnection protocol.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: DER
  source_pages:
  - 12
  - 13
  - 14
  evidence_excerpt: A review of the AWAIR platform reveals that 13 devices across
    the project are currently inactive. This equates to approximately 80% of all AWAIR
    devices currently being active and receiving data... a review of the Wattwatchers
    platform revealed that approximately 70% of devices are currently active and receiving
    data consistently. Historical records show that only three devices have a full
    2 years' worth of data available.
  confidence_note: 'delay_magnitude reflects the span of data gaps: Block D South
