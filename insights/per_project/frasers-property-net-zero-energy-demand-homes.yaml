- record_id: ARENA-DLV-0802
  source_title: Frasers Property Net Zero Energy Demand Homes - Lessons Learned Report
    2
  publish_date: '2023-12-13'
  project_name: Net Zero Energy Demand Homes
  what_happened: Installation of geothermal air conditioning ground bores required
    drilling rigs to commence on-site significantly earlier than conventional construction
    sequencing allows — each bore hole took approximately 1–2 days to complete, adding
    approximately 40 days to the program per block before normal contract works could
    commence. This extended the overall construction program by 5–10% and increased
    overall project cost by approximately 1%.
  lesson_learnt: Before committing to geothermal air conditioning on a project, assess
    the local contractor pool for capacity, skilled personnel, and access to appropriate
    machinery — the feasibility of scaling this technology is ultimately dictated
    by the size of that contractor pool. If only one contractor is available, the
    project has no fallback and is highly exposed to that contractor's schedule and
    resource constraints.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: procurement
  proponent_type: project developer
  delay_category: procurement/supply chain
  failure_mode: execution & logistics
  outcome_class: delayed but recoverable
  secondary_failure_mode: null
  intervention_note: Early procurement and program input from the geothermal contractor
    was identified as the required mitigation; on this project the additional prelims
    cost was absorbed (~1% of overall project cost).
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: other
  source_pages:
  - 10
  - 11
  - 15
  evidence_excerpt: There is limited availability of geothermal contractors in the
    market and as a result it is important to engage with them early to understand
    their capacity to deliver works to the program as there are often no alternatives.
    Furthermore it is important to factor in their access to manpower/ skilled personnel
    to undertake the works and also their access to appropriate machinery and equipment.
  confidence_note: secondary_failure_mode cost overrun coded because the document
    states a ~1% overall cost increase attributable to additional preliminaries from
    geothermal drilling. delay_magnitude estimated as 1–3 months based on '40 days
    per block' and the 5–10% program extension figure. Canonical record merged from
    3 source records across 2 document(s).
