- record_id: ARENA-DLV-1803
  source_title: ARENA Insights Forum November 2018 DER Summary
  publish_date: 2019-04
  project_name: Solar Analytics
  what_happened: Solar Analytics' detailed monitoring data showed that night-time
    voltages across monitored networks were already so high that there was limited
    headroom to accommodate further voltage increases from daytime solar generation
    without exceeding the 250 V statutory threshold.
  lesson_learnt: Distribution network voltage headroom for solar PV integration should
    be assessed using actual operational data rather than design assumptions — observed
    night-time voltages may already constrain the available capacity for daytime DER
    feed-in, requiring early coordination with network operators.
