- record_id: ARENA-DLV-7405
  source_title: AGL Energy - Liddell Large Scale Battery - Lessons Learnt Report 1
  publish_date: '2025-04-09'
  project_name: Liddell Battery Energy Storage System
  what_happened: Grid connection modelling software settings optimised for network
    performance rather than transformer technical specification resulted in the main
    transformer being sized at 320 MVA — approximately $2M per unit more expensive
    than the 290–295 MVA rating that load flow modelling would have produced. The
    320 MVA transformer was retained due to time constraints and long procurement
    lead times.
  lesson_learnt: Ensure modelling software settings used for grid connection studies
    are appropriate for transformer design specification, not just network performance
    optimisation — incorrect settings on the Liddell BESS project caused a transformer
    to be oversized by ~25 MVA, adding approximately $2M per unit in unnecessary cost.
  issue_severity: major
  project_type: storage
  project_scale_band: utility/large-scale
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: execution & logistics
  intervention_note: After a long-running investigation, the correct software settings
    were identified and validated against comparable projects. AGL updated its standard
    specifications to apply correct settings to future projects; however, the 320
    MVA transformer was retained for Liddell BESS due to procurement lead time constraints.
  transferability: broad
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id005
  - 12
  - 13
  evidence_excerpt: Significantly, the higher 320 MVA capacity resulted in an increased
    cost in the order of $2 M per unit... With a small change to appropriate setting
    selections in the modelling software, the transformer rating requirement was found
    to be 290 to 295 MVA... For the Liddell BESS project, the 320 MVA rating was retained
    due to time constraints and long lead time procurement of the transformer.
  confidence_note: Classified as cost overrun because the incorrect modelling directly
    caused ~$2M of avoidable capital expenditure that could not be recovered.
