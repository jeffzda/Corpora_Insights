- record_id: ARENA-DLV-7401
  source_title: AGL Energy - Liddell Large Scale Battery - Lessons Learnt Report 1
  publish_date: '2025-04-09'
  project_name: Liddell Battery Energy Storage System
  what_happened: The Fire Safety Study (FSS) requirement in the State Significant
    Development approval was linked to commencement of construction, meaning the lengthy
    FSS preparation and approval process held up construction commencement including
    site preparation, foundation works, and ancillary infrastructure installation.
  lesson_learnt: Negotiate appropriate staging of the FSS requirement during development
    approval so it is linked to battery installation (e.g. 'no later than 3 months
    prior to battery installation') rather than construction commencement, thereby
    avoiding unnecessary delays to early civil and site works.
  issue_severity: moderate
  project_type: storage
  project_scale_band: utility/large-scale
  lifecycle_phase: approvals/contracting
  proponent_type: utility/energy retailer
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: null
  intervention_note: AGL submitted a letter to DPHI requesting staging of the FSS
    condition, successfully moving the linkage from 'prior to commencement of construction'
    to 'no later than 3 months prior to installation of batteries'.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id001
  - 9
  evidence_excerpt: AGL learnt that the requirement of FSS is to address the risk
    associated with the battery fires therefore, the SSD condition of requiring FSS
    prior to construction commencement will unnecessarily hold up the construction
    commencement and other activities such as site preparation works, installation
    of erosion and sediment controls, the laying of battery foundation concrete slabs
    and construction of other ancillary infrastructure.
  confidence_note: null
