- record_id: ARENA-DLV-7406
  source_title: AGL Energy - Liddell Large Scale Battery - Lessons Learnt Report 1
  publish_date: '2025-04-09'
  project_name: Liddell Battery Energy Storage System
  what_happened: 'AGL outsourced BESS substation design and construction to the TNSP
    (Transgrid). The TNSP applied its regulated asset standards to the privately owned
    substation, increasing the footprint and cost of the substation. A specific conflict
    arose over current transformer (CT) saturation standards: the TNSP required larger,
    more expensive CTs rather than allowing relay detection algorithms, which caused
    delays in switchboard manufacture.'
  lesson_learnt: Before engaging a TNSP to design and construct a private storage
    system substation, explicitly agree on which standards will apply — TNSPs defaulting
    to regulated asset standards for privately owned assets increases cost, footprint,
    and can cause equipment manufacturing delays.
