- record_id: ARENA-DLV-12102
  source_title: AGL-Liddell BESS-Battery Development and Grid Connection Report
  publish_date: '2025-12-04'
  project_name: Liddell Battery Energy Storage System (LIDBESS)
  what_happened: Selecting synthetic inertia (H) and damping factor (Kd) parameters
    that simultaneously delivered fast active power recovery and well-damped oscillations
    proved difficult during R0 modelling, requiring extensive sensitivity studies
    across multiple configurations.
  lesson_learnt: Treat GFM inverter tuning as a multi-objective optimisation problem
