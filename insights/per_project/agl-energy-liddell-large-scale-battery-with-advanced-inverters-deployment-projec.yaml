  project_name: Liddell Battery Energy Storage System (LIDBESS)
  what_happened: PSS®E simulations exhibited frequency drift and voltage inconsistencies
    in long runs due to numerical limitations in the tool, and the simplified Load
    Drop Compensation (LDC) representation for three-winding transformers in PSS®E
    over- or under-estimated damping and voltage-control behaviour compared to EMT
    tools.
  lesson_learnt: For grid-forming BESS connection studies, PSS®E results should not
    be treated as absolute — cross-verify critical validation cases in PSCAD to confirm
    consistency, and limit interpretation of PSS®E outputs to comparative trends rather
    than absolute performance values, particularly for long-duration runs and three-winding
    transformer configurations.
