- record_id: ARENA-DLV-7407
  source_title: AGL Energy - Liddell Large Scale Battery - Lessons Learnt Report 1
  publish_date: '2025-04-09'
  project_name: Liddell Battery Energy Storage System
  what_happened: The contractor offered to deliver battery cubes earlier than the
    baseline schedule, which would require offsite storage and additional insurance
    costs but would reduce supply chain risk and allow pre-installation checks (health
    checks, glycol filling) to be completed off the critical path.
  lesson_learnt: Consider accepting early delivery of battery cubes to reduce supply
    chain disruption risk and move pre-installation checks off the critical path,
    while explicitly assessing and managing the trade-off against storage temperature
    and battery life degradation impacts on performance.
  issue_severity: minor
  project_type: storage
  project_scale_band: utility/large-scale
  lifecycle_phase: procurement
  proponent_type: utility/energy retailer
  delay_category: procurement/supply chain
  failure_mode: no major failure stated
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: AGL accepted the early delivery proposal, accepting additional
    storage and insurance costs in exchange for reduced supply chain risk and earlier
    completion of pre-installation checks.
  transferability: moderate
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id007
  - 15
  evidence_excerpt: Allowing early delivery of battery cubes would reduce a few risks
    to the project including global supply chain disruptions. Additionally, the early
    delivery of the cube will also allow the contractor to complete most of the preinstallation
    check and tasks including battery module health checks and cooling liquid filling
    (such as glycol). Completing the preinstallation check and tasks will save time
    and reduce the risk of these activities falling into the critical path of the
    construction program. Potential adverse impacts should also be considered particularly
    life and storage temperature-related degradation to the installed battery performance.
  confidence_note: null
