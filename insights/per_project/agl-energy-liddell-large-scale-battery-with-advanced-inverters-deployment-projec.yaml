- record_id: ARENA-DLV-12111
  source_title: AGL-Liddell BESS-Battery Development and Grid Connection Report
  publish_date: '2025-12-04'
  project_name: Liddell Battery Energy Storage System (LIDBESS)
  what_happened: GPS clause S5.2.5.1 (Reactive Power Capability) required a Negotiated
    Access Standard because temperature-based derating of reactive power between 40–50°C,
    combined with VSL logic, prevented the plant from meeting the AAS envelope at
    ambient temperatures below 40°C despite the inverters being physically capable
    of meeting AAS at 40°C.
  lesson_learnt: When designing reactive power capability envelopes for large BESS,
    explicitly model temperature-based derating curves and VSL interactions across
    the full ambient temperature range expected at the site — failure to do so at
    design stage can result in an AAS not being achievable across all operating conditions,
    requiring a NAS even where the plant hardware is capable.
  issue_severity: minor
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: A NAS was negotiated for S5.2.5.1 with derating logic documented
    and validated across PSCAD, SSAT and PSS®E models.
  transferability: moderate
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id022
  - 25
  evidence_excerpt: Although the plant was capable to meet the Automatic Access Standard
    (AAS) (due to reasonable oversizing of the plant), for any ambient temperature
    below 40°C, a NAS has been proposed for this clause. This is due to the way of
    derating the reactive power for ambient temperature between 40 to 50°C due to
    thermal limits and voltage setpoint limiting (VSL) logic.
  confidence_note: null
