- record_id: ARENA-DLV-7410
  source_title: AGL Energy - Liddell Large Scale Battery - Lessons Learnt Report 1
  publish_date: '2025-04-09'
  project_name: Liddell Battery Energy Storage System
  what_happened: Grid Forming (GFM) inverters required the PE inverters to be oversized
    — limited to approximately 86% of maximum capability in all operating conditions
    — in order to reserve current headroom for fast inertial responses during disturbances.
    This is a fundamental departure from grid-following inverter design practice and
    required extensive parametric modelling and tuning studies in conjunction with
    the OEM.
  lesson_learnt: GFM inverter projects must plan for inverter oversizing (operating
    below maximum capability) to reserve current for inertial responses — failure
    to account for this in early design sizing will result in inadequate headroom
    for fault responses and non-compliance with connection requirements.
  issue_severity: moderate
  project_type: storage
  project_scale_band: utility/large-scale
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: AGL and PE conducted oversizing studies and parametric sweeps
    of synthetic inertia and damping constants to determine that inverters should
    be limited to ~86% of maximum capability, providing sufficient current headroom
    for GFM inertial responses.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id010
