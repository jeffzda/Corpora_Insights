  source_title: AGL-Liddell BESS-Battery Development and Grid Connection Report
  publish_date: '2025-12-04'
  project_name: Liddell Battery Energy Storage System (LIDBESS)
  what_happened: Intentional oversizing of inverters — capping each inverter's output
    at 3.784 MVA against a nameplate rating of 4.39 MVA — preserved dynamic current
    headroom that enabled the plant to meet fault ride-through, voltage support and
    system-strength requirements that would have been unachievable at full-rated operation.
  lesson_learnt: For grid-forming BESS, design-in inverter oversizing (capping normal
    output below nameplate rating) from the outset — the upfront cost premium is offset
    by the current headroom that enables GPS compliance for fault current injection
    and voltage control, reduces curtailment in weak grids, and may avoid network
    remediation costs.
