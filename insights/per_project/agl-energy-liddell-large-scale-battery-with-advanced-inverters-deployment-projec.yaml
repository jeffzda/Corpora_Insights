- record_id: ARENA-DLV-12112
  source_title: AGL-Liddell BESS-Battery Development and Grid Connection Report
  publish_date: '2025-12-04'
  project_name: Liddell Battery Energy Storage System (LIDBESS)
  what_happened: GPS clause S5.2.5.13 (Voltage and Reactive Power Control / Power
    System Oscillation Damping) required a NAS because the LIDBESS was not equipped
    with a dedicated power system oscillation damping controller, as the VSM control's
    inherent damping does not constitute a formal oscillation damping function under
    the AAS definition.
  lesson_learnt: For inverter-based BESS projects, GPS clause S5.2.5.13 will typically
    require a NAS because explicit wide-area damping control is not standard in VSM
    systems — prepare this NAS proactively with evidence of inherent VSM damping characteristics
    and wide-area study results showing no adverse impact on system stability.
  issue_severity: minor
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: approvals/contracting
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: regulatory & approvals
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: AEMO and Transgrid accepted the plant's inherent VSM damping
    characteristics as sufficient to meet the intent of the clause under a NAS, supported
    by wide-area study evidence.
  transferability: moderate
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id023
  - 26
  - 27
  evidence_excerpt: The LIDBESS was registered with a NAS for this clause because
    the generating system is not equipped with a dedicated power system oscillation
    damping controller... This outcome is typical for asynchronous (inverter-based)
    generation technologies, as explicit wide area damping control is not generally
    implemented or required for compliance.
