- record_id: ARENA-DLV-7402
  source_title: AGL Energy - Liddell Large Scale Battery - Lessons Learnt Report 1
  publish_date: '2025-04-09'
  project_name: Liddell Battery Energy Storage System
  what_happened: Two unrelated major projects (Liddell BESS and Bayswater Ancillary
    Works) were combined under a single State Significant Development approval, causing
    complexity when modifications were needed. Biodiversity offsets were linked across
    both projects, meaning Liddell BESS could not retire its own offsets independently,
    creating unnecessary financial and administrative burden.
  lesson_learnt: Do not combine multiple unrelated major projects under a single development
    approval — separate approvals allow each project to manage its own conditions,
    timelines, and offset obligations independently, avoiding costly modification
    requests and administrative complexity.
  issue_severity: moderate
  project_type: storage
  project_scale_band: utility/large-scale
  lifecycle_phase: approvals/contracting
  proponent_type: utility/energy retailer
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: coordination & stakeholders
  intervention_note: AGL submitted a modification request to DPHI to separate the
    Liddell BESS project-related biodiversity offsets from Bayswater Ancillary Works,
    which was approved.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id002
  - 10
  evidence_excerpt: Due to having two major projects which are not relevant to each
    other, there are multiple challenges and complexities if a modification in the
    conditions is required or if there are conflicting project timelines... retiring
    those linked biodiversity offsets for Liddell BESS project would also require
    retiring some of the Bayswater Ancillary Works' offsets. This creates a significant
    and unnecessary financial and administrative burden on the Liddell BESS project.
  confidence_note: null
