- record_id: ARENA-DLV-7404
  source_title: AGL Energy - Liddell Large Scale Battery - Lessons Learnt Report 1
  publish_date: '2025-04-09'
  project_name: Liddell Battery Energy Storage System
  what_happened: AGL's specifications required a maximum design soil ambient temperature
    of 34°C, which was causing difficulties in sourcing backfill material with the
    required thermal resistivity. Analysis of Bureau of Meteorology data showed actual
    soil temperature did not exceed 28°C, allowing the specification to be revised,
    significantly easing procurement of suitable fill material.
  lesson_learnt: Use measured site-specific soil temperature data correlated with
    ambient air temperature to determine the maximum ambient soil temperature for
    cable sizing, rather than applying a conservative default — this can rationalise
    backfill specifications and avoid procurement delays for specialised materials.
  issue_severity: minor
  project_type: storage
  project_scale_band: utility/large-scale
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: procurement/supply chain
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: AGL and the contractor reviewed BOM station data to demonstrate
    soil temperatures did not exceed 28°C, enabling agreement on a revised maximum
    soil temperature and a broader range of acceptable backfill materials.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id004
  - 11
  - 12
  evidence_excerpt: AGL and the Contractor, through trending of available Bureau of
    Meteorology (BOM) stations were able to demonstrate that the measured ambient
    soil temperature data follows an annual cyclical cycle that correlates with the
    ambient air temperature, and in this situation did not exceed a maximum of 28°C...
    This broader availability of fill streamlined procurement efforts and reduced
    likely potential delays associated with sourcing the specialised backfill materials.
  confidence_note: null
