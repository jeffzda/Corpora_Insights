- record_id: ARENA-DLV-7403
  source_title: AGL Energy - Liddell Large Scale Battery - Lessons Learnt Report 1
  publish_date: '2025-04-09'
  project_name: Liddell Battery Energy Storage System
  what_happened: During detailed design, an Asset Protection Zone (APZ) of 10 m was
    assumed as a placeholder while the bushfire threat assessment was conducted. The
    assessment ultimately determined APZs of 19–26 m were required, forcing a redesign
    of the concept layout and rework of detailed design activities including civil
    benching.
  lesson_learnt: Commence bushfire threat assessments early in the design phase and
    incorporate the findings into the site constraints map before detailed design
    begins — using an incorrect placeholder APZ resulted in rework of civil benching
    and other detailed design activities.
  issue_severity: moderate
  project_type: storage
  project_scale_band: utility/large-scale
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: data/validation/testing
  failure_mode: poor scoping
  outcome_class: delayed but recoverable
  secondary_failure_mode: data & measurement
  intervention_note: Bushfire threat assessment was completed and the concept layout
    was modified to accommodate the greater APZ requirements, with rework of civil
    benching and related design activities.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id003
  - 11
  evidence_excerpt: The bushfire threat assessment identified that the APZs required
    would be greater than 10 m (between 19 m to 26 m) and as a result, the concept
    layout needed to be modified to accommodate the greater APZ. This resulted in
    reworking of some detailed design activities (such as civil benching).
