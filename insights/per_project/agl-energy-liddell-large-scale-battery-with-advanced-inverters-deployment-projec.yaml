- record_id: ARENA-DLV-12110
  source_title: AGL-Liddell BESS-Battery Development and Grid Connection Report
  publish_date: '2025-12-04'
  project_name: Liddell Battery Energy Storage System (LIDBESS)
  what_happened: GPS clause S5.2.5.5 (Response to Contingency Events) could not meet
    the Automatic Access Standard because the simultaneous requirements for high reactive
    current injection and very rapid active power recovery are dynamically coupled
    in VSM control — the inverter must balance voltage and frequency stability rather
    than prioritise one response. The LIDBESS marginally fell short of AAS thresholds
    for both iq magnitude and active power recovery time.
  lesson_learnt: For grid-forming VSM-based BESS, S5.2.5.5 AAS is inherently unachievable
    without compromising other GPS clauses — negotiate a NAS with AEMO and Transgrid
    on the basis that the plant's performance (strong reactive support and P-recovery
    within ~100 ms) is technically robust, and demonstrate that tightening toward
    AAS would reduce overall system strength contribution.
  issue_severity: moderate
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: approvals/contracting
  proponent_type: utility/energy retailer
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: FCCL was developed and added to meet the MAS for reactive current
    rise time; the NAS for S5.2.5.5 was accepted by AEMO and Transgrid on the basis
    of robust overall performance.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id021
  - 25
  evidence_excerpt: Achieving the AAS for this clause is inherently challenging for
    any inverter-based technology due to the simultaneous requirements for high reactive
    current (iq) injection and very rapid active power recovery... Consequently, the
    LIDBESS marginally falls short of the strict AAS thresholds for both iq magnitude
    and active power recovery time.
