  what_happened: Implementing site-level reactive power derating based on ambient
    temperature introduced risks of single-sensor failure and mismatched inverter-level
    versus plant-level responses, creating a potential compliance vulnerability in
    the VSL logic.
  lesson_learnt: Ambient temperature-based derating logic for large BESS must use
    redundant sensors with aggregation logic implemented through RTAC/PPC — a single
    sensor failure can cause misalignment between inverter-level derating and network-level
    compliance commitments, and the logic must be validated across all relevant simulation
    environments (PSCAD, SSAT, PSS®E).
