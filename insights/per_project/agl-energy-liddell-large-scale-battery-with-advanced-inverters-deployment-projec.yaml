  what_happened: GPS clause S5.2.5.10 (Protection to Trip Plant for Unstable Operation)
    required a NAS because AEMO and Transgrid agreed that the plant should not be
    automatically disconnected in response to instability events, despite the AAS
    requiring automatic disconnection — the VSM control's normal oscillatory behaviour
    would otherwise cause false trips.
  lesson_learnt: For VSM-based grid-forming BESS, the AAS for GPS clause S5.2.5.10
    will likely require a NAS — negotiate early with AEMO and Transgrid to establish
    validated instability thresholds that avoid false trips during normal VSM oscillations
    while still ensuring disconnection for genuinely unstable conditions, and document
    the agreed monitoring and alarm logic.
