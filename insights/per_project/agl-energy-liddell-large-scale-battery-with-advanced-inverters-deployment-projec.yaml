  publish_date: '2025-12-04'
  project_name: Liddell Battery Energy Storage System (LIDBESS)
  what_happened: Achieving Automatic Access Standard (AAS) compliance simultaneously
    across all GPS clauses was infeasible for the LIDBESS because several requirements
    are inherently in tension for VSM-based grid-forming systems — notably, increasing
    reactive current injection speed and active power recovery rate can degrade frequency
    stability or weak-grid margins.
  lesson_learnt: For grid-forming BESS projects, accept from the outset that simultaneous
    AAS compliance across all GPS clauses is unachievable due to intrinsic VSM control
    trade-offs — prioritise S5.2.5.1, S5.2.5.3, S5.2.5.4, S5.2.5.5, S5.2.5.13, S5.2.5.15
    and S5.2.5.16, target 'near-AAS' on these, and prepare justified NAS proposals
    with supporting evidence for clauses where only MAS exists or where tightening
    would compromise higher-priority performance.
  issue_severity: moderate
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: approvals/contracting
  proponent_type: utility/energy retailer
  delay_category: approvals/regulatory
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: regulatory & approvals
  intervention_note: A balanced tuning configuration was developed satisfying all
    MAS/NAS requirements across GPS clauses, supported by AEMO and Transgrid during
    the 5.3.4A approval process.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id020
  - 36
  evidence_excerpt: Achieving AAS across all GPS clauses simultaneously was infeasible
    due to intrinsic trade-offs (e.g., iq-rise speed vs frequency stability). Success
    depends on prioritising critical clauses (S5.2.5.1, S5.2.5.3, S5.2.5.4, S5.2.5.5,
    S5.2.5.13, S5.2.5.15, S5.2.5.16) and tuning for 'near-AAS' performance on them
    while maintaining compliance elsewhere.
