  source_title: AGL Energy - Liddell Large Scale Battery - Lessons Learnt Report 1
  publish_date: '2025-04-09'
  project_name: Liddell Battery Energy Storage System
  what_happened: In the second round connection application, meeting the NER reactive
    current rise time requirement while maintaining stability under normal operating
    conditions became the primary point of contention with Transgrid and AEMO, delaying
    the offer to connect by several months. The trade-off between fault response speed
    and normal operation stability is a fundamental challenge specific to GFM inverters.
  lesson_learnt: GFM inverter projects should engage Transgrid and AEMO early regarding
    the trade-off between inverter fault response speed and normal operating stability
    — the reactive current rise time requirement in NER minimum access standards can
    be difficult to meet simultaneously with GFM stability requirements, and resolution
    may depend on OEM firmware updates that are not within the proponent's control.
  issue_severity: major
  project_type: storage
