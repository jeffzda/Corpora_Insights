- record_id: ARENA-DLV-40370
  source_title: 'In The Spotlight: Australian Solar Energy R&D Outcomes and Achievements
    in a Global Context'
  publish_date: 2018-07
  project_name: Concentrating Solar Fuels (2012/ASI054, 2012/PFD011, 2013/ASI033,
    ASTRI P42)
  what_happened: The solar fuels roadmap study (published 2016) found that concentrating
    solar fuels technologies had no direct industrial partnerships and no established
    market mechanisms at the time of the study, though Australia's existing fuel export
    infrastructure and partnerships with overseas energy customers (particularly Japan)
    provided a credible future commercial pathway.
  lesson_learnt: Pre-commercial solar fuels technologies require early engagement
    with export market partners and commodity market development in parallel with
    R&D — the absence of market mechanisms and industry partners is a primary commercialisation
    barrier that cannot be addressed by technical R&D alone, and should be explicitly
    targeted in program design.
