- record_id: ARENA-DLV-51490
  source_title: UTS - Flexible Demand State of Play in Australia - Report
  publish_date: 2024-05
  project_name: SolarShift – Turning Electric Water Heaters into Megawatt Batteries
  what_happened: The SolarShift project found that in Victoria, DNSPs have the ability
    to use and control smart meters with controlled load but retailers do not, while
    in NSW metering coordinators tend to avoid changing controlled load settings without
    retailer approval — creating jurisdictional coordination barriers to centralised
    hot water orchestration.
  lesson_learnt: Hot water flexible demand programs face jurisdiction-specific access
    and control barriers between DNSPs, retailers and metering coordinators that prevent
    seamless orchestration; program designers must map the specific roles and access
    rights in each jurisdiction and establish coordination agreements before deploying
    load control capabilities.
