- record_id: ARENA-DLV-20725
  source_title: Demand Response Short Notice RERT Trial Year 3 Report
  publish_date: 2021-10
  project_name: DR SN RERT Trial — over-recruitment sizing rule
  what_happened: Trial participants established through experience that over-recruiting
    DR capacity by approximately 20% above contracted volumes is a practical and financial
    minimum, and that the over-recruited buffer must be at least equal to the largest
    single customer's contribution, otherwise a single customer withdrawal can cause
    the aggregator to fail to deliver its aggregate contracted volume.
  lesson_learnt: DR aggregators should over-recruit by at least 20% of contracted
    volumes, and the buffer must individually exceed the largest customer's contracted
    contribution; failure to apply this rule creates a single-point-of-failure risk
    where one customer's unavailability breaches aggregate contracted obligations.
