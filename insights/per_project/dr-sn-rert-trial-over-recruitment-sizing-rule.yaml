  evidence_excerpt: The need to over-recruit DR capacity as compared to the level
    of DR contracted remains a practical and financial consideration for participants.
    Over-recruitment in the range of 20 per cent is generally considered prudent,
    but the over-recruitment must necessarily cover the largest amount of DR provided
    by any single customer in the portfolio otherwise the aggregator risks failing
    to deliver its aggregate contracted volume.
