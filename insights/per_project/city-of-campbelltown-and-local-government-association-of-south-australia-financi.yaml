- record_id: ARENA-DLV-52059
  source_title: ARENA Distributed Energy Resources Projects
  publish_date: 2019-03
  project_name: City of Campbelltown and Local Government Association of South Australia
    Financial model for community-owned solar
  what_happened: Development of a financial model for community-owned solar found
    that changes to SA Power Networks' tariff structure presented a significant challenge
    for model design, as the model was predicated on the SAPN local government tariff
    with no demand component.
  lesson_learnt: Community solar financial models are highly sensitive to network
    tariff structures — engage the distribution network early to understand applicable
    tariff types and stress-test the model against potential tariff reforms before
    finalising the commercial structure.
