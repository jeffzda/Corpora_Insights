- record_id: ARENA-DLV-50004
  source_title: Ocean Energy Report by Seanergy and Ernst and Young
  publish_date: 2016-06
  project_name: Wattmor WaveRoller Project, Brittany, France
  what_happened: The Wattmor WaveRoller wave energy project in Brittany, a consortium
    involving Fortum, DCNS and AW-Energy, progressed through the first stage of development
    (feasibility, impact assessment, community engagement) from 2013 but was placed
    on hold due to lack of funding.
  lesson_learnt: Wave energy projects at feasibility stage are highly vulnerable to
    funding gaps between development phases; developers should secure multi-phase
    funding commitments or identify bridge financing before commencing feasibility
    work to avoid project suspension that may be difficult to restart.
