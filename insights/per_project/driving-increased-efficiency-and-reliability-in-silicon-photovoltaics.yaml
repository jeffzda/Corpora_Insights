  publish_date: '2019-06-22'
  project_name: Driving Increased Efficiency and Reliability in Silicon Photovoltaics
    – From Ingots to Modules
  what_happened: The project team found that maintaining a well-balanced consortium
    of commercial and institutional partners was critical, and that some overlap between
    partners' interests helped avoid excessive reliance on any single partner — but
    had to be balanced against the risk of internal competition within the project.
  lesson_learnt: When structuring a multi-partner R&D consortium, include some overlap
    in partner capabilities to reduce single-partner dependency risk, but carefully
    manage the boundary to avoid internal competition; prioritise partners with whom
    strong prior relationships already exist and whose benefits from the project are
    clear.
