- record_id: ARENA-DLV-7552
  source_title: Driving Increased Efficiency and Reliability in Silicon Photovoltaics
    – From Ingots to Modules
  publish_date: '2019-06-22'
  project_name: Driving Increased Efficiency and Reliability in Silicon Photovoltaics
    – From Ingots to Modules
  what_happened: Annual multi-day workshops bringing together 30+ researchers from
    ANU and UNSW proved to be the most effective mechanism for building inter-institutional
    trust and enabling parallel collaborations across the project.
  lesson_learnt: In multi-institution R&D projects, invest in regular in-person workshops
    as the primary mechanism for building cross-team trust and collaboration; extending
    these workshops to include researchers from related projects at both institutions
    can further strengthen connections and produce better outcomes across the broader
    portfolio.
  issue_severity: none
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: research organisation/university
  delay_category: no material delay stated
  failure_mode: no major failure stated
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: Held an annual 3-day project workshop in March 2019 attended
    by 30 project-related staff and students from ANU and UNSW, which was identified
    as the single most important communication mechanism.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id002
  - 7
  evidence_excerpt: The most important method for establishing and maintaining this
    communication has been our annual project workshop. The latest of these was held
    for 3 days in the Blue Mountains in March, 2019, and was attended by 30 project-related
    staff and students from ANU and UNSW... We have found these workshops to be a
    very powerful way to build deep and trusting connections between researchers,
    which then leads to more meaningful collaborations.
  confidence_note: lifecycle_phase set to operations as the workshops occurred during
    active project execution, not during project design or setup.
