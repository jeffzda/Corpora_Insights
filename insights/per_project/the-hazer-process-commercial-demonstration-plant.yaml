- record_id: ARENA-DLV-28954
  source_title: Hazer - The Hazer Process Demonstration Plant - Maximising the value
    of biogas through low emission hydrogen and graphite products
  publish_date: null
  project_name: Hazer Process Commercial Demonstration Plant (CDP)
  what_happened: Hazer, as a pre-revenue technology company, relied on a combination
    of government grants, R&D tax refunds, venture capital, ASX listing proceeds,
    and engineering services revenues to fund its technology through to TRL7 demonstration.
    No single funding source was sufficient, and the pre-revenue phase extended beyond
    typical institutional investor time horizons.
  lesson_learnt: First-of-a-kind technology developers should pursue a multi-channel
    funding strategy — combining government grants, R&D tax incentives, venture capital,
    and public market capital — rather than relying on a single source, and should
    target investors explicitly prepared for long pre-revenue development phases.
  issue_severity: moderate
  project_type: null
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: financing/commercial close
  failure_mode: commercial & market
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: Hazer adopted a 'capex-lite' licensing and royalty business model
    targeting tier-1 multinational partners with capital to build and operate their
    own plants, minimising Hazer's own capital obligations through the pre-revenue
    phase.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages: &id003
  - 11
  - 21
  evidence_excerpt: Hazer successfully attracted funding from a diverse investor base.
    This included federal and state government grants, R&D tax refunds, venture capital
    series A investment, IPO ASX listing and subsequent capital raising. A multi-channel
    funding strategy is therefore recommended so as not to rely upon a single source
    of financing. The pre-revenue technology development phase in a company's lifecycle
    may be longer than many institutions investment time horizons.
