  source_title: Hazer - The Hazer Process Demonstration Plant - Hazer Lessons Learnt
    Report 4
  publish_date: 2024-12
  project_name: Hazer Process Commercial Demonstration Plant (CDP)
  what_happened: Hazer developed and implemented a comprehensive safety management
    system as the CDP transitioned from construction to operations, including hiring
    a full-time HSE Manager, conducting gap analyses against the new WHS Act 2020,
    implementing safety software for reporting and trend analysis, and establishing
    visible safety leadership through rotating executive attendance at site safety
    sessions. By November 2024 the CDP had recorded approximately 157,500 hours on
    site with zero injuries of any kind.
  lesson_learnt: For a first-of-kind industrial plant transitioning from construction
    to operations, proactively uplift the safety management system ahead of operational
    commissioning — including hiring dedicated HSE resources, conducting a gap analysis
    against current legislation, and shifting from procedural compliance to active
    cultural engagement. The combination of visible leadership, repeated safety practice,
    and good systems is more effective than procedures alone.
