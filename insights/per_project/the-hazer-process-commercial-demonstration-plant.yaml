  what_happened: Existing greenhouse gas accounting methodologies (API compendium
    / NGER Determination) were not applicable to the Hazer Process because it captures
    carbon as solid graphite rather than emitting CO2, creating a need for bespoke
    emissions assessment and independent expert assurance before credible emissions
    claims could be made.
  lesson_learnt: Novel hydrogen production processes that do not fit standard GHG
    accounting frameworks should commission independent expert emissions assessments
    early in the project, as the absence of applicable standard methodologies creates
    regulatory and commercial uncertainty that can delay emissions reporting and carbon
    credit eligibility.
