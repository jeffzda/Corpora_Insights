  publish_date: 2024-12
  project_name: Hazer Process Commercial Demonstration Plant (CDP)
  what_happened: COVID-19 pandemic conditions in China during late 2021 prevented
    Hazer personnel from conducting on-ground quality assurance inspections of the
    reactor fabricator, forcing reliance on a third-party TUV 3.2 certification process.
    Despite quality anomalies being detected, materials passed specified tests. The
    resulting undetected defects only became apparent after fabrication was complete,
    contributing to the full material rejection and re-order.
  lesson_learnt: When procuring technically complex or safety-critical equipment from
    overseas fabricators, physical on-site inspection by company personnel is essential
    — third-party certification processes alone may not detect latent fabrication
    or material defects. Contingency plans must account for scenarios where in-person
    oversight is impossible and adjust procurement risk tolerance accordingly.
