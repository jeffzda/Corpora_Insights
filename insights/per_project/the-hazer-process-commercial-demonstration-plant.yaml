    process, Hazer found that a standard lump-sum EPC contract was unsuitable due
    to design unknowns and complexity. They adopted a hybrid EPC model with Early
    Contractor Involvement (ECI), engaging Primero Group under an open-book rates-for-service
    arrangement before transitioning to a hybrid EPC contract where Hazer directly
    contracted key equipment packages.
  lesson_learnt: For emerging technology or first-of-kind projects, use an ECI contract
    before committing to a full EPC to allow collaborative design definition and establish
    realistic cost and schedule baselines — a lump-sum EPC is unrealistic where significant
    technical unknowns remain. A hybrid EPC model with direct owner procurement of
    key equipment packages can better balance risk, cost transparency, and the technology
    owner's need to be closely involved in design decisions.
