- record_id: ARENA-DLV-47303
  source_title: Hazer - The Hazer Process Demonstration Plant - Hazer Lessons Learnt
    Report 4
  publish_date: 2024-12
  project_name: Hazer Process Commercial Demonstration Plant (CDP)
  what_happened: The CDP fuel cell was ordered in Q3 2020 before Australian fuel cell
    standards existed. During fabrication the inverter was found non-compliant with
    Australian Standards. New AS 62282-3 standards were released in August 2021, requiring
    retrospective compliance. After extensive gap analysis and ongoing costly engagement
    with DMIRS, the process was deemed unachievable in Q3 2023 and the fuel cell had
    to be replaced with a different supplier's unit that had been designed to Australian
    standards.
  lesson_learnt: For equipment requiring regulatory approval in Australian jurisdictions
    — particularly in Queensland and Western Australia — strongly prefer suppliers
    whose products have previously achieved full compliance approval in the same jurisdiction.
    Procuring equipment designed to overseas standards and attempting retrospective
    compliance with evolving Australian Standards is high-risk and potentially unachievable
    at any reasonable cost.
  issue_severity: major
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: approvals/contracting
  proponent_type: technology vendor
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Hazer had engaged a backup fuel cell supplier 12 months before
    the final decision, which had developed an Australian-standards-compliant 'off-the-shelf'
    unit that had already completed the WA approval process — this advance contingency
    work enabled a timely replacement decision.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages:
  - 7
  - 8
  - 11
  - 12
  evidence_excerpt: Most noticeable was meeting WA and national standards regarding
    the hydrogen fuel cell that were being developed and evolving while Hazer was
    installing its fuel cell at the CDP. A lack of consistency between federal and
    state requirements, then a change in standard led to this first fuel cell not
    meeting specifications. Importantly, Hazer had anticipated this outcome may arise
    in its contracting with the original supplier and was able to procure a replacement
    at no additional cost.
  confidence_note: 'delay_magnitude estimated as 1–3 years: fuel cell ordered Q3 2020,
    replacement decision Q3 2023, new unit to be commissioned in 2025 — approximately
    3+ years of delay on this component; classified 1–3 years as the replacement decision
    and procurement spanned that band. Canonical record merged from 3 source records
    across 2 document(s).'
