  what_happened: Inconsistent and jurisdiction-specific government policy frameworks
    for hydrogen — with some programs promoting specific production technologies (e.g.
    electrolysis) rather than targeting emissions reductions — created barriers for
    Hazer's technology despite its comparable or superior emissions profile, and slowed
    commercial uptake in certain markets.
  lesson_learnt: Hydrogen technology developers should engage with policymakers to
    advocate for emissions-outcome-based policy frameworks rather than production-method-specific
    incentives, as technology-specific policies can inadvertently exclude low-emission
    alternatives that achieve equivalent or better abatement outcomes.
