  publish_date: null
  project_name: Hazer Process Commercial Demonstration Plant (CDP)
  what_happened: During construction of the CDP, Hazer experienced significant challenges
    procuring materials and fabricating its first-of-a-kind Mark 1 reactor to the
    required manufacturing standards. COVID-19 travel restrictions prevented quality
    assurance visits to fabricators, resulting in equipment delivered not meeting
    specifications and subsequently failing integrity tests.
  lesson_learnt: For first-of-a-kind reactor fabrication, conduct thorough engineering
    design, rigorous equipment and material specifications, and thorough supplier
    pre-qualification — and maintain high-cadence quality assurance (regular photos
    and frequent physical site visits) throughout fabrication, especially when travel
    restrictions or other barriers prevent in-person oversight.
