- record_id: ARENA-DLV-47307
  source_title: Hazer - The Hazer Process Demonstration Plant - Hazer Lessons Learnt
    Report 4
  publish_date: 2024-12
  project_name: Hazer Process Commercial Demonstration Plant (CDP)
  what_happened: During CDP start-up, conservative safety controls — applied because
    operational behaviour of the novel plant was unknown — repeatedly tripped the
    plant and slowed progress. The team systematically expanded the operating envelope
    using a formal management of change (MOC) procedure, including thermal modelling
    and heat fatigue cycle analysis to safely increase reactor temperature range.
    The first half of 2024 was consumed by multiple short runs and restarts before
    reaching steady state in July 2024.
  lesson_learnt: A robust, tested management of change procedure is essential for
    safely expanding the operating envelope of a novel plant during start-up — it
    enables systematic, incremental increases with safety controls maintained at each
    step and should accelerate the time from first start-up to stable steady-state
    operation. Plan for the start-up phase of a FOAK facility to consume significantly
    more time than a conventional plant.
