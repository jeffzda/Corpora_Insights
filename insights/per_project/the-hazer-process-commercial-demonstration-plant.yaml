  project_name: Hazer Process Commercial Demonstration Plant (CDP)
  what_happened: The reliability of biogas supply from dispersed industrial waste
    sources (dairy, farming, food and beverage processing) was identified as a material
    risk to the commercial viability of Hazer-enabled plants, due to high variability
    in feedstock characteristics and uncertainty over guaranteed longevity of supply
    — in contrast to more reliable municipal wastewater treatment plant and landfill
    sources.
  lesson_learnt: When siting a Hazer-enabled (or similar biogas-fed) hydrogen production
    facility, prioritise municipal wastewater treatment plants or landfill sites as
    feedstock sources over dispersed industrial waste streams, which carry higher
    supply variability and longevity risk that can undermine operating and commercial
    viability.
