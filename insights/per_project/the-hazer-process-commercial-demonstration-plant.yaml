- record_id: ARENA-DLV-47301
  source_title: Hazer - The Hazer Process Demonstration Plant - Hazer Lessons Learnt
    Report 4
  publish_date: 2024-12
  project_name: Hazer Process Commercial Demonstration Plant (CDP)
  what_happened: The CDP reactor was fabricated using Incoloy 617 exotic material
    sourced from a Chinese supplier. An unrecoverable flaw was detected in the reactor
    shell during fabrication in late 2021, requiring a restart. In July 2022, the
    heat exchanger failed final heat treatment due to defective source material. By
    October 2022, all materials from the supplier and its subsidiaries were deemed
    non-compliant, requiring re-order from Tier 1 European and North American suppliers
    and 13 additional months of fabrication — causing significant delay to CDP start-up.
  lesson_learnt: Only engage fabricators with specific, demonstrated experience manufacturing
    the exact exotic alloy required (e.g. Incoloy 617) — general experience with similar
    exotic materials is insufficient. For difficult and highly technical equipment
    procured overseas, direct company representation and physical inspections on-site
    are essential; reliance on third-party certification alone does not adequately
    protect against latent material defects.
  issue_severity: major
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: procurement
  proponent_type: technology vendor
  delay_category: procurement/supply chain
  failure_mode: unvalidated technical assumptions
  outcome_class: delayed but recoverable
  secondary_failure_mode: execution & logistics
  intervention_note: Hazer broke material orders into three components across specialist
    Tier 1 European and North American suppliers, embedded key personnel directly
    with fabricators for 13 months of closely monitored re-fabrication, and awarded
    the local specialist additional scope (site piping) after confirming their capability.
  transferability: moderate
  delay_magnitude: 1-3 years
  technology_domain: hydrogen
  source_pages: &id015
  - 5
  - 6
  evidence_excerpt: In October 2022, after reviewing the information and performing
    new tests on the raw materials, it was deemed that all materials from this supplier
    and its subsidiaries were not compliant, and materials needed to be re-ordered
    from a different supplier... Tier 1 European and North American suppliers were
    chosen and were closely monitored by key Hazer personnel for a further 13 months
    as equipment was remade and fabricated.
  confidence_note: delay_magnitude estimated as 1–3 years based on ~13 months of re-fabrication
    plus prior investigation period from mid-2022 to late 2023.
