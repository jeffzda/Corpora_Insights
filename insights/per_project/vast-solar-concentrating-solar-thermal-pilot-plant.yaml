- record_id: ARENA-DLV-25903
  source_title: Review of ARENA's Reliability Portfolio
  publish_date: 2020-01
  project_name: Vast Solar Concentrating Solar Thermal Pilot Plant
  what_happened: Vast Solar's pilot concentrating solar thermal plant experienced
    a delay of several years before becoming operational, which in turn prevented
    commencement of the sequentially dependent 30 MW Jemalong demonstration project.
    The Jemalong project was placed under variation by ARENA to incorporate updated
    findings and learnings from the delayed pilot.
  lesson_learnt: When demonstration projects are designed in sequence, delays to the
    first project cascade directly to subsequent projects; proponents should build
    independent schedule buffers into sequenced demonstrations and funders should
    assess whether contractual variation mechanisms are adequate before committing
    downstream funding.
  issue_severity: major
  project_type: generation
