  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: ARENA placed the Jemalong project under variation to incorporate
    updated findings from the pilot, effectively re-scoping the second project before
    it commenced.
  transferability: moderate
  delay_magnitude: 1-3 years
  technology_domain: solar thermal
  source_pages:
