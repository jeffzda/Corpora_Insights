  evidence_excerpt: The 30MW plant at Jemalong required the successful deployment
    of the pilot plant, which is only recently operational after a delay of several
    years, before it could commence. The learnings from the delay to the pilot plant
    are directly applicable to the design and implementation of the larger commercial
    deployment. This has led to a re-scoping and re-evaluation of the initial project
    considering the advancements in the market since its inception.
