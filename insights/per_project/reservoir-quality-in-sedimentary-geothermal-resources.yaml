- record_id: ARENA-DLV-32456
  source_title: Reservoir Quality in Sedimentary Geothermal Resources - Program 2
    Summary Report
  publish_date: 2014-12
  project_name: Reservoir Quality in Sedimentary Geothermal Resources
  what_happened: Laboratory experiments showed that reducing drilling fluid (mud)
    particle concentration — contrary to the intuitive assumption that less mud means
    less damage — resulted in longer transition times, higher filtration coefficients,
    deeper particle invasion, and greater irreversible formation damage in Pretty
    Hill Formation sandstone cores.
  lesson_learnt: When drilling HSA geothermal wells, higher drilling fluid particle
    concentrations are preferable to dilute muds — dilute muds allow deeper particle
    invasion into the formation causing irreversible damage, whereas concentrated
    muds form an external cake that can be mechanically removed; drilling fluid design
    should not simply minimise mud concentration.
  issue_severity: major
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: construction/installation
  proponent_type: project developer
