- record_id: ARENA-DLV-32455
  source_title: Reservoir Quality in Sedimentary Geothermal Resources - Program 2
    Summary Report
  publish_date: 2014-12
  project_name: Reservoir Quality in Sedimentary Geothermal Resources
  what_happened: Laboratory experiments on core samples from the Pretty Hill Formation
    demonstrated that reducing the salinity of flowing water from 0.6 M NaCl to near-deionised
    conditions reduced core permeability approximately eight-fold, with particle mobilisation
    concentrations increasing sharply at salinities below 0.05 M NaCl.
  lesson_learnt: In HSA geothermal wells completed in formations containing kaolinite
    and chlorite clays, the salinity of injected or produced water must be carefully
    controlled — introduction of low-salinity fluids (including freshwater-based drilling
    muds or injection water) can trigger severe fines mobilisation and irreversible
    permeability damage.
