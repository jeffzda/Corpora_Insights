  publish_date: 2014-12
  project_name: Reservoir Quality in Sedimentary Geothermal Resources (Salamander-1
    and Celsius-1 failure analysis)
  what_happened: Australian HSA geothermal developers were unable to raise sufficient
    funding to conduct thorough exploration programs, in part because there are no
    working examples of deep sedimentary geothermal resources in Australia to demonstrate
    to potential investors that projects can work.
  lesson_learnt: The absence of demonstrated working examples of HSA geothermal in
    Australia creates a circular funding barrier — developers cannot conduct the exploration
    needed to prove a resource without funding that investors will not provide without
    proof; this systemic gap requires public or co-investment support for early exploration
    phases.
