- record_id: ARENA-DLV-62754
  source_title: Reservoir Quality in Sedimentary Geothermal Resources – Program 1
    Summary Report
  publish_date: 2014-12
  project_name: Reservoir Quality in Sedimentary Geothermal Resources
  what_happened: Laboratory in-situ flow-through reactor experiments demonstrated
    that secondary mineral growth — and associated porosity development — in sandstone
    reservoir materials is highly sensitive to pressure and temperature conditions,
    with reaction rates increasing significantly above 160°C and 450 bar. At lower
    pressure-temperature conditions typical of shallower targets, mineral replacement
    reactions proceeded too slowly to generate meaningful porosity.
  lesson_learnt: When evaluating whether diagenetic processes may create or restore
    permeability in a candidate HSA reservoir, project developers should use experimentally
    validated pressure-temperature thresholds (>160°C, >450 bar) rather than assuming
    mineral replacement reactions will occur at all P-T conditions — targets below
    these thresholds are unlikely to benefit from hydrothermal porosity regeneration.
