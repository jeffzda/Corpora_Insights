  what_happened: Research found that diagenetic reduction of permeability in the Otway
    and Cooper-Eromanga Basins is not uniform across the basins, and that seismic
    attributes (reflection intensity, relative acoustic impedance, quadrature) correlate
    with petrographically measured porosity, enabling prediction of higher-permeability
    zones between wells without additional drilling.
  lesson_learnt: Future HSA geothermal exploration programs should integrate 3D seismic
    attribute analysis with petrographic data prior to selecting drill targets — this
    combined methodology can identify permeable 'sweet spots' ahead of drilling and
    reduce the risk of siting wells in diagenetically degraded reservoir zones.
