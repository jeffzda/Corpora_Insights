- record_id: ARENA-DLV-62753
  source_title: Reservoir Quality in Sedimentary Geothermal Resources – Program 1
    Summary Report
  publish_date: 2014-12
  project_name: Reservoir Quality in Sedimentary Geothermal Resources
  what_happened: The thermal history analysis of both the Otway Basin and Cooper-Eromanga
    Basin revealed that peak paleotemperatures and burial conditions had driven extensive
    diagenesis (quartz cementation, illite growth, kaolinite transformation, calcite
    cementation), substantially reducing primary reservoir quality. The Cooper-Eromanga
    Basin Hutton Sandstone had been exposed to palaeotemperatures as high as 300°C,
    well above present-day conditions, causing irreversible permeability destruction.
  lesson_learnt: HSA geothermal project developers should commission basin-scale thermal
    history reconstruction (using apatite fission track analysis, vitrinite reflectance,
    and zircon fission track data) before committing to drill targets — basins with
    high past burial temperatures are likely to have experienced diagenetic permeability
    destruction regardless of current reservoir temperatures or depth.
