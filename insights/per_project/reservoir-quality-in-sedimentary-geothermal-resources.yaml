- record_id: ARENA-DLV-32457
  source_title: Reservoir Quality in Sedimentary Geothermal Resources - Program 2
    Summary Report
  publish_date: 2014-12
  project_name: Reservoir Quality in Sedimentary Geothermal Resources
  what_happened: Analysis concluded that external cake formation during drilling was
    not the primary cause of the irreversible formation damage observed in Salamander-1;
    instead, low-salinity clay (kaolinite and chlorite) fines migration during production
    was identified as the most probable cause of the well's poor performance.
  lesson_learnt: Drilling-phase formation damage should not be assumed to be the dominant
    cause of HSA well underperformance — production-phase low-salinity fines migration
    can cause more severe and irreversible damage; failure analysis of underperforming
    geothermal wells should specifically investigate production-phase fines migration
    as a primary hypothesis.
