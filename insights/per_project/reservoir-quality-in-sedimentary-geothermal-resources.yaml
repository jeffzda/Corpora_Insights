- record_id: ARENA-DLV-71206
  source_title: Reservoir Quality in Sedimentary Geothermal Resources - Program 3
    Summary Report
  publish_date: 2014-12
  project_name: Reservoir Quality in Sedimentary Geothermal Resources (Salamander-1
    and Celsius-1 failure analysis)
  what_happened: The marginal economics of geothermal energy in Australia prevented
    developers from adopting a portfolio exploration approach — drilling in multiple
    locations to spread risk — meaning individual projects bore concentrated risk
    that a single well failure could not be recovered from.
  lesson_learnt: Australian geothermal exploration economics do not support single-project
    risk profiles; any future HSA development program should be structured as a portfolio
    or with significant public co-investment to allow multiple exploration targets
    to be tested in parallel, reducing the risk that one underperforming well terminates
    the entire program.
