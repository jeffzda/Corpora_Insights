- record_id: ARENA-DLV-32458
  source_title: Reservoir Quality in Sedimentary Geothermal Resources - Program 2
    Summary Report
  publish_date: 2014-12
  project_name: Reservoir Quality in Sedimentary Geothermal Resources
  what_happened: Salamander-1 was completed with a pre-perforated liner that precluded
    hydraulic fracturing as a well productivity enhancement option; to perform fracturing,
    a major recompletion involving liner removal and recementing would be required.
  lesson_learnt: Well completion design for HSA geothermal wells should explicitly
    preserve the option of hydraulic fracturing as a productivity enhancement measure
    — pre-perforated liner completions are incompatible with fracturing and eliminate
    this key remediation pathway if initial production rates are insufficient.
  issue_severity: major
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: construction/installation
  proponent_type: project developer
  delay_category: null
  failure_mode: poor scoping
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Recompletion — removing the liner, cementing a new one, perforating,
    and installing an upper completion capable of withstanding fracturing pressures
    — was identified as the required remediation pathway but had not been executed
    at time of reporting.
  transferability: moderate
  delay_magnitude: null
  technology_domain: other
