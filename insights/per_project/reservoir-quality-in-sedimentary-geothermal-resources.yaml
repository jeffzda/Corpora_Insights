- record_id: ARENA-DLV-32454
  source_title: Reservoir Quality in Sedimentary Geothermal Resources - Program 2
    Summary Report
  publish_date: 2014-12
  project_name: Reservoir Quality in Sedimentary Geothermal Resources
  what_happened: Modelling of Salamander-1 production data showed that higher production
    rates cause greater well impedance growth because increased flow velocity reduces
    the maximum retained particle concentration, detaching more fines from rock surfaces
    and accelerating permeability decline.
  lesson_learnt: Increasing well impedance during production testing in HSA geothermal
    wells is a diagnostic indicator of fines-induced formation damage rather than
    a permanent reservoir permeability limitation; well test analysis should be designed
    to distinguish these mechanisms before concluding that the reservoir is uneconomic.
