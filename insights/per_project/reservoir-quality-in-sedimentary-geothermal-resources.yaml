- record_id: ARENA-DLV-71208
  source_title: Reservoir Quality in Sedimentary Geothermal Resources - Program 3
    Summary Report
  publish_date: 2014-12
  project_name: Reservoir Quality in Sedimentary Geothermal Resources (Salamander-1
    and Celsius-1 failure analysis)
  what_happened: Reservoir permeability — the most important parameter for HSA geothermal
    well performance — could not be reliably predicted ahead of drilling using available
    geophysical methods, and could only be directly measured through drilling, creating
    an unavoidable high-cost decision point with no low-cost pre-validation option.
  lesson_learnt: 'Before committing to deep HSA drilling (cost: tens of millions of
    dollars), all available lower-cost methods for assessing diagenetic history and
    predicting permeability should be exhausted — including diagenetic modelling,
    burial history analysis, and available seismic data interpretation — to maximise
    the information available before incurring irreversible capital expenditure.'
  issue_severity: major
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: concept/feasibility
  proponent_type: project developer
  delay_category: null
  failure_mode: poor scoping
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Program 3 developed a recommended exploration workflow that sequences
    low-cost desktop analysis (diagenetic modelling, burial history) before higher-cost
    activities (3D seismic, drilling) to optimise the cost/uncertainty trade-off.
  transferability: narrow
  delay_magnitude: null
  technology_domain: other
  source_pages: &id013
  - 5
  - 6
  - 7
  evidence_excerpt: Predictions of reservoir petrophysical properties, such as porosity,
    based on models for diagenesis will provide the most information for the minimum
    expenditure when compared with the costs of the acquisition of seismic (millions
    of dollars) and other geophysical data or drilling to reservoir depths (tens of
    millions of dollars)... The critical nature of permeability to the success of
    a geothermal project does mean that all avenues for assessing the diagenetic and
    burial history of the target formations in the basin and the prediction of reservoir
    quality based on these analyses should be exhausted before exploration proceeds
    to more costly activities such as drilling or the acquisition of 3d seismic data.
