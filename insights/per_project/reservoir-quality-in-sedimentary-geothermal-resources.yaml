- record_id: ARENA-DLV-71209
  source_title: Reservoir Quality in Sedimentary Geothermal Resources - Program 3
    Summary Report
  publish_date: 2014-12
  project_name: Reservoir Quality in Sedimentary Geothermal Resources (Salamander-1
    and Celsius-1 failure analysis)
  what_happened: Neither the Salamander-1 nor Celsius-1 well test programs incorporated
    measurement of fines concentration in produced fluid or used the available analytical
    models for fines migration, meaning it was impossible to predict long-term well
    productivity decline or distinguish fines-induced skin from other formation damage
    mechanisms.
  lesson_learnt: Well test programs for HSA geothermal wells should include produced
    fluid sampling for fines concentration combined with mathematical modelling to
    determine fines-migration coefficients; without this, skin factor analysis from
    well tests cannot be disaggregated and long-term well behaviour cannot be reliably
    predicted.
  issue_severity: moderate
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: project developer
  delay_category: data/validation/testing
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: The three-program research study was initiated specifically to
    reconstruct understanding of reservoir controls from available indirect data,
    using laboratory analysis and modelling to compensate for gaps in direct well
    test data.
  transferability: moderate
  delay_magnitude: null
  technology_domain: other
  source_pages:
  - 7
  - 9
  evidence_excerpt: If deep drilling is contemplated, then data collection from the
    first well(s) should be of sufficient quality to allow an analysis of the controls
    on the key reservoir parameters. Insufficient data may lead to decisions being
    made based on incorrect interpretations that are made in the absence of appropriate
    information. Simply conducting a flow test is not enough to allow good understanding
    of the reservoir, particularly if it has performed below expectations.
  confidence_note: 'This record is closely related to ARENA-DLV-71207 but captures
