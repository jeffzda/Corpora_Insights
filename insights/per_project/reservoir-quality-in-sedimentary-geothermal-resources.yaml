- record_id: ARENA-DLV-71210
  source_title: Reservoir Quality in Sedimentary Geothermal Resources - Program 3
    Summary Report
  publish_date: 2014-12
  project_name: Reservoir Quality in Sedimentary Geothermal Resources (Salamander-1
    and Celsius-1 failure analysis)
  what_happened: The exploration programs for both HSA wells did not adequately characterise
    the geological controls (stratigraphy, depositional environment, lithology, diagenetic
    history, burial history) required to reliably predict reservoir quality parameters
    before drilling, resulting in well designs and performance expectations that were
    not validated by actual conditions.
  lesson_learnt: Future HSA geothermal exploration programs must systematically collect
    and analyse the full suite of geological parameters — stratigraphy, depositional
    environment, lithology, diagenetic history, burial history, fluid chemistry, and
    basin structure — before committing to drilling; the data requirements are equivalent
    to oil and gas exploration but the permeability risk is disproportionately greater
    for geothermal projects.
  issue_severity: major
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: concept/feasibility
