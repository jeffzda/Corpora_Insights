- record_id: ARENA-DLV-71207
  source_title: Reservoir Quality in Sedimentary Geothermal Resources - Program 3
    Summary Report
  publish_date: 2014-12
  project_name: Reservoir Quality in Sedimentary Geothermal Resources (Salamander-1
    and Celsius-1 failure analysis)
  what_happened: Fines migration — the mobilisation and migration of small particles
    within the reservoir under production conditions — was identified as a significant
    formation-damaging factor in geothermal wells that was not adequately assessed
    or mitigated in the Salamander-1 and Celsius-1 well tests, contributing to well
    performance degradation.
  lesson_learnt: Fines migration assessment must be explicitly incorporated into geothermal
    well test design; fall-off and build-up tests combined with measurement of fines
    concentration in produced fluid should be standard practice, as geothermal reservoirs
    are more susceptible to fines-migration damage than conventional oil or gas reservoirs.
  issue_severity: major
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: project developer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Research developed analytical models and recommended well test
    protocols (fall-off/build-up tests with fines concentration measurement) that
    would allow fines-migration model coefficients to be determined from well test
    data for long-term production prediction.
  transferability: moderate
  delay_magnitude: null
  technology_domain: other
  source_pages:
  - 7
  - 8
  - 9
  - 15
  evidence_excerpt: Fines migration is significant formation damaging factor particularly
    for geothermal reservoirs. Particle detachment factor of weakening the electrostatic
    DLVO forces under high temperature dominates over the viscosity decrease that
    restricts the fines mobilisation. Therefore, geothermal fields are more susceptible
    for the fines migration formation damage if compared with the conventional aquifers.
