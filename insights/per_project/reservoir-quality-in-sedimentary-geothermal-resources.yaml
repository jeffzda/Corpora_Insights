- record_id: ARENA-DLV-32451
  source_title: Reservoir Quality in Sedimentary Geothermal Resources - Program 2
    Summary Report
  publish_date: 2014-12
  project_name: Reservoir Quality in Sedimentary Geothermal Resources
  what_happened: Both Australian Hot Sedimentary Aquifer (HSA) geothermal wells drilled
    in Australia — Salamander-1 (Otway Basin) and Celsius-1 (Cooper-Eromanga Basin)
    — failed to produce the anticipated fluid flow rates, triggering a multi-program
    failure analysis research project.
  lesson_learnt: HSA geothermal wells that appear promising based on formation core
    analysis may still significantly underperform due to formation damage mechanisms
    not captured by pre-drill reservoir characterisation; a dedicated formation damage
    assessment program should be included in HSA well planning before committing to
    full development.
