- record_id: ARENA-DLV-62751
  source_title: Reservoir Quality in Sedimentary Geothermal Resources – Program 1
    Summary Report
  publish_date: 2014-12
  project_name: Reservoir Quality in Sedimentary Geothermal Resources
  what_happened: Both Australian HSA geothermal wells drilled into sedimentary aquifer
    targets — Salamander-1 (Otway Basin, Pretty Hill Formation) and Celsius-1 (Cooper-Eromanga
    Basin, Hutton Sandstone) — failed to achieve anticipated fluid flow rates. Post-drill
    analysis confirmed that diagenesis driven by deep burial and historical high-temperature
    events had significantly reduced primary reservoir permeability.
  lesson_learnt: Sedimentary aquifer permeability assumptions used to site HSA geothermal
    wells must account for diagenetic history (burial, heating, mineral cementation)
    — natural permeability inferred from shallow or ambient core data can substantially
    overestimate in-situ permeability at depth, leading to flow rate shortfalls that
    cannot be remediated after drilling.
