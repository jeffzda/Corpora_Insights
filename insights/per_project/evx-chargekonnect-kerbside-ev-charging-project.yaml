- record_id: ARENA-DLV-23803
  source_title: EVX - ChargeKonnect Kerbside EV Charging Project - Lessons Learnt
    Report 1
  publish_date: 2025-06
  project_name: ChargeKonnect Kerbside EV Charging Project
  what_happened: Some DNSPs required an externally accessible isolation switch on
    kerbside chargers; however, an external switch posed safety and durability risks
    in a public kerbside environment, creating a conflict between regulatory requirements
    and safe design.
  lesson_learnt: DNSP isolation switch requirements for public kerbside chargers can
    conflict with safety and vandalism-resistance objectives — design the isolation
    function into a secure, lockable internal enclosure accessible only to authorised
    personnel with a universal key, rather than providing an exposed external switch.
  issue_severity: minor
  project_type: transport electrification
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated integration
  intervention_note: EVX incorporated the isolation switch within the steel chassis
    body, accessible via a universal key available to authorised personnel, satisfying
    DNSP requirements while maintaining safety and durability.
  transferability: moderate
  delay_magnitude: null
  technology_domain: EV
  source_pages: &id003
  - 6
  evidence_excerpt: DNSPs in some locations require an isolation switch on kerbside
    chargers. However, there are safety and operational concerns around providing
    an external switch for safety and durability reasons. The EVX charger design incorporates
    the isolation switch within the steel chassis body that can be accessed by a universal
    key available to authorised personnel to isolate the charger when required.
