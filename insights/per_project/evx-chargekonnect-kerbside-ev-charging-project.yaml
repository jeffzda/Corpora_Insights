- record_id: ARENA-DLV-23806
  source_title: EVX - ChargeKonnect Kerbside EV Charging Project - Lessons Learnt
    Report 1
  publish_date: 2025-06
  project_name: ChargeKonnect Kerbside EV Charging Project
  what_happened: 'DNSP approval processes, technical standards, and timelines for
    kerbside charger installation varied significantly across states: installation
    and go-live in NSW takes approximately 4 hours once approvals are in place, while
    the same process can take up to 2 weeks in Victoria, with differences in contestable
    and non-contestable works frameworks affecting the number of agencies involved.'
  lesson_learnt: Multi-jurisdiction EV charging rollouts must account for large DNSP-to-DNSP
    variation in approval processes, technical standards, and installation timelines
    — map each DNSP's requirements and contestable/non-contestable works framework
    before setting deployment schedules, as timeline assumptions valid in one state
    may be significantly wrong in another.
  issue_severity: major
  project_type: transport electrification
  project_scale_band: demonstration
  lifecycle_phase: approvals/contracting
  proponent_type: technology vendor
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: poor scoping
  intervention_note: EVX began mapping approval and installation processes across
    all DNSP jurisdictions to identify risks, benefits, and opportunities to recommend
    a more standardised approach.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: EV
  source_pages: &id006
  - 7
  evidence_excerpt: The average time for installation and going live in NSW (once
    all approvals are in place) is 4 hours. This process can take up to 2 weeks in
    Victoria. There is a difference in approach to contestable and non-contestable
    works in different states, that impacts the number of agencies / contractors involved
    and the time takes for a site to go live.
  confidence_note: issue_severity set to major because a 20–50x variation in installation
    timeline between jurisdictions represents a fundamental planning and schedule
    risk for a 250-unit national rollout, even though the overall project has not
    yet been delayed.
