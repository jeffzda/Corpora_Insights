- record_id: ARENA-DLV-23807
  source_title: EVX - ChargeKonnect Kerbside EV Charging Project - Lessons Learnt
    Report 1
  publish_date: 2025-06
  project_name: ChargeKonnect Kerbside EV Charging Project
  what_happened: A multi-stakeholder project involving five DNSPs, multiple local
    governments, a retail service provider, payments provider, and charge point operator
    required significant upfront effort to establish governance — including a Steering
    Committee, information sessions for local governments, and bilateral meetings
    — before any technical or deployment work could progress.
  lesson_learnt: For complex multi-party EV charging projects involving DNSPs, local
    governments, and commercial service providers, invest in formal governance infrastructure
    (steering committee, structured information sessions, bilateral onboarding meetings)
    as a first-priority activity — without this alignment step, partner expectations
    and roles remain misaligned and deployment cannot proceed efficiently.
  issue_severity: minor
  project_type: transport electrification
  project_scale_band: demonstration
  lifecycle_phase: concept/feasibility
