- record_id: ARENA-DLV-23805
  source_title: EVX - ChargeKonnect Kerbside EV Charging Project - Lessons Learnt
    Report 1
  publish_date: 2025-06
  project_name: ChargeKonnect Kerbside EV Charging Project
  what_happened: EVX found that EV ownership and registration data was not a reliable
    indicator of suitable kerbside charging sites because it is skewed towards drivers
    with access to off-street parking and home charging; instead, localised parking
    mix — particularly the availability of off-street EV parking — proved a better
    site selection indicator.
  lesson_learnt: Do not rely on EV ownership or registration data alone when selecting
    kerbside public charging sites — this data is biased toward drivers who already
    have off-street charging access and will direct installations away from underserved
    areas; use localised parking mix and constraints on off-street parking as the
    primary site suitability criterion.
  issue_severity: minor
  project_type: transport electrification
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: EVX developed an in-house site scouting guide based on localised
    parking mix and pole suitability attributes to systematically narrow down candidate
    sites.
  transferability: broad
  delay_magnitude: null
  technology_domain: EV
  source_pages: &id005
  - 7
  evidence_excerpt: A good indicator of suitability is the localised parking mix.
    Sites where off-street EV parking and charging are constrained are better suited
    to kerbside installations. EV ownership/ registration data is not found to be
    a good source of information for where suitable sites should be located, due to
    being skewed towards drivers who have access to off-street parking / charging
    facilities.
