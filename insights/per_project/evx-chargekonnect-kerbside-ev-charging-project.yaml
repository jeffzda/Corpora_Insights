- record_id: ARENA-DLV-23802
  source_title: EVX - ChargeKonnect Kerbside EV Charging Project - Lessons Learnt
    Report 1
  publish_date: 2025-06
  project_name: ChargeKonnect Kerbside EV Charging Project
  what_happened: Jurisdictional differences in electricity distribution infrastructure
    — specifically the use of Stobie poles (steel I-beam and concrete construction)
    by SAPN in South Australia instead of timber poles used elsewhere — required EVX
    to develop a new clasp mechanism for charger installation, adding design and engineering
    effort not anticipated at project outset.
  lesson_learnt: When planning multi-jurisdiction kerbside EV charger rollouts in
    Australia, audit DNSP pole types across each state before finalising installation
    hardware — Stobie poles in South Australia require different fixings and mechanisms
    than timber poles, and this variation must be designed for in advance to avoid
    costly rework.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: construction/installation
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: EVX developed a bespoke clasp mechanism to enable easy and low-cost
    installation of its pole-chargers on Stobie poles used by SAPN in South Australia.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: EV
  source_pages: &id002
  - 6
  evidence_excerpt: In South Australia, the use of 'Stobie poles' (a power line pole
    made of two steel I-beams, joined by tie-bolts and held apart by a slab of concrete)
    by SAPN instead of timber poles required adapting the process and fixings required
    for charger installations. EVX developed a clasp mechanism to ensure easy and
    low-cost installation for its charger deployment in these cases.
