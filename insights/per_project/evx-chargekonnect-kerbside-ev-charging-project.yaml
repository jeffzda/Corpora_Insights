  project_name: ChargeKonnect Kerbside EV Charging Project
  what_happened: To meet the scaled-up production volumes required for deployment
    under the project, EVX identified that its existing supply chain arrangement —
    with assembly and end-of-line manufacturing partially outsourced — carried quality
    and cost control risks, and initiated a process to bring assembly entirely in-house
    in Sydney, including recruiting additional personnel.
  lesson_learnt: For EV charging hardware projects targeting significant deployment
    volumes, assess manufacturing scale-up capacity and supply chain control requirements
    before deployment commences — tooling up in-house assembly earlier reduces quality
    and cost risks during the production ramp.
