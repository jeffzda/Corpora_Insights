- record_id: ARENA-DLV-48112
  source_title: ARENA-Funded Cutting Edge Research in Photovoltaics
  publish_date: 2019-09
  project_name: Manufacturing of Printed Perovskite PV Modules (2017/RND012)
  what_happened: The project identified that the key knowledge gap blocking industry
    adoption of roll-to-roll perovskite PV manufacturing is the correlation between
    environmental conditions (especially humidity), precursor composition, and processing/deposition
    parameters. Only four research groups globally had demonstrated roll-to-roll perovskite
    fabrication at the time of reporting; the CSIRO team achieved 9% efficiency on
    a 10 cm × 10 cm module.
  lesson_learnt: For perovskite PV manufacturing scale-up, characterising the humidity-composition-process
    interaction is the critical gating knowledge gap — R&D programs targeting printed
    perovskite modules should treat humidity sensitivity as a primary experimental
    variable from the earliest process development stage, not a secondary reliability
    concern.
