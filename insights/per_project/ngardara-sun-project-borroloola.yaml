- record_id: ARENA-DLV-45663
  source_title: Pollination - Community Energy Report
  publish_date: 2024-07
  project_name: Ngardara 'Sun' Project (Borroloola)
  what_happened: Borroloola relies on diesel for 88% of its electricity. An existing
    small solar PV system faces approximately 25% average export curtailment due to
    poor integration with the diesel system. The proposed Ngardara project (2.1 MW
    solar, 6.2 MWh battery) aims to supply over 70% renewable energy but requires
    a control system integration with the diesel generator and a power purchase arrangement
    with the Power and Water Corporation.
  lesson_learnt: In diesel-dependent remote communities, solar export curtailment
    caused by poor integration with existing diesel generation systems is a material
    technical risk — new solar and storage projects must include control system co-design
    with the incumbent power provider from the outset to avoid replicating this constraint.
