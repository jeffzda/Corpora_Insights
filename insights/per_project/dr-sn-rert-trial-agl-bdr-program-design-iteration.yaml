- record_id: ARENA-DLV-20707
  source_title: Demand Response Short Notice RERT Trial Year 3 Report
  publish_date: 2021-10
  project_name: DR SN RERT Trial — AGL BDR program design iteration
  what_happened: AGL discontinued its deep-learning load forecasting method in Year
    3 due to high computation and time requirements, replacing it with a simplified
    three-tier target-setting approach; it also discontinued real-time in-event monitoring
    feedback for new customers after Year 2 data showed poor customer engagement with
    the portal and poor expected financial returns.
  lesson_learnt: Complex data-intensive BDR program features (deep-learning forecasting,
    in-event customer dashboards) may not justify their cost and complexity — simpler
    tiered target approaches can maintain strong performance outcomes while reducing
    operational burden; evaluate customer engagement data before committing to costly
    digital features.
