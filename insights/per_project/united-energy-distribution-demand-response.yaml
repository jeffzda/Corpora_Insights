  outcome_class: delayed but recoverable
  secondary_failure_mode: null
  intervention_note: Data capacity between NAP/OSI PI and MOSAIC SCADA was increased
    and the activation algorithm fine-tuned; retesting on 10 December 2018 confirmed
    the delay was resolved, reducing tapping time from 40 minutes to 10 minutes.
  transferability: moderate
