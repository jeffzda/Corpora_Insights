  project_name: United Energy Demand Response – DVMS Rollout
  what_happened: After DVMS commissioning, the Network Control Centre received a large
    number of over-voltage and under-voltage warning alarms triggered by thresholds
    set as percentages of nominal voltage, which fired spuriously when DVMS was switched
    off or operating during high-demand periods when voltage was boosted above the
    ±5% warning band.
  lesson_learnt: Remove or redesign voltage warning alarms that are calibrated to
    static nominal-voltage thresholds when a dynamic voltage management scheme is
    deployed — such alarms will fire spuriously across a wide range of normal DVMS
    operating conditions and provide no actionable information to controllers.
