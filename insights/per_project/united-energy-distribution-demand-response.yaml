- record_id: ARENA-DLV-3501
  source_title: United Energy Demand Response Project Performance Report - Milestone
    7
  publish_date: '2020-06-10'
  project_name: United Energy Demand Response Project (DVMS)
  what_happened: When the DVMS selected Dynamic Voltage Level 1 (highest set-point)
    at 11kV and 6.6kV zone substations during hot days, bus supervision relays generated
    a large number of nuisance over-voltage alarms due to the combined effects of
    voltage regulation bandwidth, phase unbalance, and measurement accuracy tolerances
    accumulating to exceed the pre-existing over-voltage set-points.
  lesson_learnt: Before deploying a dynamic voltage management system, review and
    recalibrate bus supervision relay over-voltage set-points to account for the full
    range of dynamic voltage levels — pre-existing alarm thresholds based on static
    float voltages will generate nuisance alarms at high dynamic set-points and disrupt
    network control centre operations.
  issue_severity: moderate
  project_type: network/grid
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: network business
