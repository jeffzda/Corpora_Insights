  source_title: United Energy Demand Response – Final Project Performance Report
  publish_date: '2020-12-21'
  project_name: United Energy Demand Response – DVMS Rollout
  what_happened: After DVMS commissioning, bus supervision relays at 11kV and 6.6kV
    zone substations generated large numbers of nuisance over-voltage alarms on hot
    days because the highest dynamic voltage set-point (DV1) approached and exceeded
    the pre-DVMS over-voltage supervision threshold, combining with bandwidth, phase
    unbalance and measurement tolerances.
  lesson_learnt: Before commissioning a dynamic voltage scheme, review and adjust
    bus supervision relay over-voltage thresholds to accommodate the full range of
    intended dynamic set-points — supervision settings calibrated to pre-DVMS float
    voltages will generate nuisance alarms that overload the Network Control Centre
    once higher dynamic set-points are activated.
