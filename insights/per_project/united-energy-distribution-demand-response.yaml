- record_id: ARENA-DLV-58262
  source_title: United Energy Demand Response – Final Project Performance Report
  publish_date: '2020-12-21'
  project_name: United Energy Demand Response – DVMS Rollout
  what_happened: Following installation of A. Eberle REG-D relays at multiple zone
    substations, an excessive number of transformer tap changes and OLTC master-control-failed
    alarms were observed. Root cause analysis identified contaminated OLTC wiper contacts
    compounded by a mismatch between the tap position resistor circuit connection
    used by the previous TPT-194 transducer (3-wire) and the 2-wire connection required
    by the REG-D, with the REG-D also having a lower output voltage (10V vs 20–50V)
    making it more susceptible to contact resistance artefacts.
  lesson_learnt: When replacing voltage regulating relays with a different manufacturer's
    product, verify tap-position transducer connection compatibility and output voltage
    requirements — substituting a relay with lower output voltage and a different
    wiring convention on the tap position resistance chain can cause phantom tap operations
    that flood the NCC with alarms, drive unnecessary mechanical wear on OLTCs, and
    compromise RERT participation.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: utility/large-scale
  lifecycle_phase: commissioning/integration
  proponent_type: network business
  delay_category: commissioning/integration
  failure_mode: unvalidated integration
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: A 3-wire TPT-194 tap position transducer was trialled at Sandringham
    zone substation, confirmed to resolve the issue, and subsequently rolled out to
    all affected REG-D sites to eliminate phantom tap operations.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: demand response
