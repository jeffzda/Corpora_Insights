- record_id: ARENA-DLV-62567
  source_title: United Energy Demand Response Project Performance Report - Milestone
    2
  publish_date: '2018-02-08'
  project_name: United Energy Demand Response Project
  what_happened: A preliminary review of UE's 47 zone substations found that only
    20 had SCADA-controllable emergency voltage set-points, and two of those (Burwood
    and Surrey Hills) had incorrectly applied settings, while one (Keysborough) had
    settings calculated on nominal rather than float voltage — meaning the network's
    actual emergency voltage reduction capability was less than assumed and required
    remediation before demand response trials could begin.
  lesson_learnt: Before committing to a demand response capability based on emergency
