  project_name: United Energy Demand Response Project
  what_happened: During the fourth AEMO demand response test on 27 November 2018,
    UE failed to achieve the required 30MW in the first half-hour interval due to
    a data bandwidth bottleneck between the analytics engine/data warehouse (NAP/OSI
    PI) and the real-time SCADA system (MOSAIC), causing slower-than-normal transformer
    tapping during activation.
  lesson_learnt: Ensure adequate data bandwidth between analytics and SCADA systems
    before live demand response activations — a bottleneck between NAP/OSI PI and
    MOSAIC caused delayed transformer tapping and insufficient demand response in
    the first dispatch interval. Test and validate data pipeline capacity under realistic
    activation conditions prior to contracted events.
