  source_title: United Energy Demand Response Project Performance Report - Milestone
    6
  publish_date: '2019-12-17'
  project_name: United Energy Demand Response Project
  what_happened: On high-demand days (extreme heat or cold), the binding constraint
    on voltage-reduction demand response capability shifted from tap range to voltage
    spread — on the highest demand day recorded (1 March 2019, 1974MW), voltage spread
    limited demand response capability to only 2.9% voltage reduction (approximately
    40MW), well below the available tap range of 6.4%.
  lesson_learnt: On peak demand days, voltage spread — driven by high load through
    network impedances — becomes the tighter constraint on demand response via voltage
    reduction; network operators should model voltage-spread-constrained DR capability
    under peak demand scenarios separately from tap-range-constrained capability to
    avoid overestimating RERT capacity.
