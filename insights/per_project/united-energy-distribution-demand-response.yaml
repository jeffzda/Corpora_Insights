  intervention_note: Data capacity between NAP and MOSAIC was increased and the activation
    algorithm in the analytics engine was fine-tuned; a retest on 10th December 2018
    confirmed the delay issue was resolved, reducing tap-down from three steps over
    40 minutes to two steps over 10 minutes.
