  project_name: United Energy Demand Response Project
  what_happened: The Dromana (DMA) zone substation was found to operate close to its
    end tap on most days, leaving minimal margin for demand response or absorption
    of additional solar PV export on low-demand days. Upstream voltage reduction at
    the supplying Tyabb terminal station was applied as a temporary measure, but this
    was identified as insufficient for a long-term fix.
  lesson_learnt: When deploying network-wide voltage management for demand response,
    identify zone substations operating near their tap limits early in the design
    phase — substations constrained by transformer tap range may require reactive
    power interventions (capacitor bank switching or reactor installation) before
    they can reliably contribute to demand response programmes.
