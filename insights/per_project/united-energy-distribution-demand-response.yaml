  what_happened: Testing revealed that DVMS has no automatic response to network abnormal
    operating conditions such as bus-tie circuit breaker opening — operators must
    manually disable DVMS in these scenarios, but no operating procedures existed
    to guide them, creating a risk of incorrect NAP recommendations being applied
    during abnormal network configurations.
  lesson_learnt: Before deploying automated voltage management systems operationally,
    develop and implement explicit operating procedures for all abnormal switching
    scenarios (e.g. bus-tie open, feeder transfer) that instruct operators when and
    how to disable the system; automated algorithm improvements are a longer-term
    solution and should not be relied upon before they are tested and deployed.
