- record_id: ARENA-DLV-34857
  source_title: United Energy Demand Response Project Performance Report - Milestone
    6
  publish_date: '2019-12-17'
  project_name: United Energy Demand Response Project
  what_happened: On high-demand days, localised under-voltage issues emerged for some
    customers as voltage spread increased, even while DVMS held V99% close to 253V
    — indicating that centralised voltage management alone cannot address all individual
    site compliance failures under peak load conditions.
  lesson_learnt: Centralised voltage management systems should be complemented by
    a process for identifying and addressing localised under-voltage sites on high-demand
    days — DVMS can flag outliers (V1% sites) for targeted remediation such as loose
    connection repair or service line upgrades, but cannot resolve them through system-level
    setpoint adjustments alone.
