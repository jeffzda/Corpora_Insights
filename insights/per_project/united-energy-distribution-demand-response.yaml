    response of up to 42MW, load shedding was still required across multiple tranches
    totalling over 150MW due to extreme overnight temperatures driving demand toward
    a potential new record peak of ~2095MW.
  lesson_learnt: Demand response via voltage reduction, while effective, may be insufficient
    as the sole tool to avoid load shedding during extreme heat events approaching
    historical peak demand records — portfolio planners should treat network-based
    demand response as one layer in a broader reliability stack alongside other RERT
    providers and emergency measures.
