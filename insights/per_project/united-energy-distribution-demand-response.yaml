  secondary_failure_mode: poor scoping
  intervention_note: The report notes that this limitation is not expected to apply
    at high-demand periods when transformers operate higher in their tapping range,
    providing an additional 3.1% voltage margin (3 taps × 1.025% per step) for demand
    response.
  transferability: moderate
  delay_magnitude: null
  technology_domain: demand response
  source_pages: &id025
