  intervention_note: 'Protection settings were modified across all DVMS sites: over-voltage
    supervision raised from 106% of float voltage to 107% of nominal voltage, and
    under-voltage supervision lowered from 94% to 93% of nominal voltage, ensuring
    DVMS operation across the full voltage range did not trigger spurious lockouts.'
  transferability: moderate
