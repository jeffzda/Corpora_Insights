  proponent_type: network business
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: successful demonstration
  secondary_failure_mode: regulatory & approvals
  intervention_note: United Energy developed a data-analytics engine that compares
    the distribution of customer voltages against regulatory limits in real time using
    AMI data, constraining the voltage reduction to maintain compliance — eliminating
    the need for customer consent and the risk of regulatory voltage breach.
  transferability: moderate
  delay_magnitude: null
  technology_domain: demand response
  source_pages: &id035
  - 4
  - 5
  evidence_excerpt: Previous use of this method of demand response always had some
    level of risk in that it could not be guaranteed that customer voltages did not
    fall below the stipulated regulated limits during the voltage reduction period,
