  source_title: United Energy Demand Response – Final Project Performance Report
  publish_date: '2020-12-21'
  project_name: United Energy Demand Response – DVMS Rollout
  what_happened: Default voltage set-points at zone substations had historically been
    set high to manage peak-load voltage drops, resulting in customer over-voltages
    during normal (non-peak) network loading after DVMS was deployed, as DVMS only
    uses default set-points during abnormal operating conditions.
  lesson_learnt: Revise default VRR voltage set-points to align with the most common
    DVMS dynamic set-point when deploying a dynamic voltage management scheme — retaining
    legacy high default set-points leads to over-voltages when the scheme is disabled
    and unnecessary tap changes when switching between normal and abnormal operating
    modes, accelerating OLTC wear.
