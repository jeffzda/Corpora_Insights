  what_happened: For RERT demand response obligations, UE found that SCADA Group Function
    commands needed to be initiated 10 minutes before the AEMO-specified dispatch
    time to ensure all zone substation SCADA commands completed within the required
    window; activating at exactly the AEMO-specified time was insufficient.
  lesson_learnt: When operating under RERT or similar grid services contracts that
    specify a dispatch time, pre-activate SCADA Group Functions for voltage reduction
    approximately 10 minutes before the nominated start time — this accounts for sequential
    SCADA dispatch time across all participating substations (3–5 minutes) and ensures
    full network delivery within the contractual window; however, note that activating
    earlier affects baseline calculations.
