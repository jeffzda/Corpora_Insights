  source_title: United Energy Demand Response Project Performance Report - Milestone
    5
  publish_date: '2019-06-11'
  project_name: United Energy Demand Response Project
  what_happened: Smart meter rollout revealed a legacy steady-state voltage compliance
    issue at maximum demand across UE's LV distribution network that had been invisible
    before AMI deployment — prior to LV remedial works, V1% was 215.78V (below the
    216V regulatory floor) and 67% of zone substations exceeded the allowed 37V voltage
    spread.
  lesson_learnt: Distribution network voltage compliance at maximum demand should
    not be assumed without smart meter visibility — legacy networks may have accumulated
    steady-state under-voltage conditions at the LV fringe that are only detectable
    through AMI data. This issue is likely common across all NEM distribution networks
    and should be investigated as part of any demand response programme relying on
    voltage reduction.
