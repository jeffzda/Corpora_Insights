  what_happened: 'UE developed a demand response capability diagram for the DVMS based
    on tests and live RERT events, identifying two binding constraints: at low demand,
    the limit is the available buck tap positions on zone substation transformers;
    at high demand, the limit is the spread of customer voltages across smart meters
    at each zone substation.'
  lesson_learnt: Characterise the demand response capability envelope of a voltage-reduction
    DVMS across the full demand range before committing to contracted volumes — the
    binding constraint changes from tap-range availability at low demand to customer
    voltage spread at high demand, and both need to be quantified to set reliable
    contracted capability levels.
