  what_happened: During the 4th AEMO test conducted under light-load conditions, zone
    substation transformers were operating near the bottom of their tapping range,
    limiting the voltage reduction — and therefore demand response — available, with
    the East Malvern substation tapping from position 5 down to position 1 (bottom
    tap).
  lesson_learnt: Account for tapping-range constraints when designing demand response
    capability at low-demand periods — the available demand response is limited not
    only by low absolute demand but also by the reduced tap-down headroom that exists
    when transformers are already operating near their lower tap limit; schedule tests
    and size commitments accordingly.
