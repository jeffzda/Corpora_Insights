  publish_date: '2019-12-17'
  project_name: United Energy Demand Response Project
  what_happened: DVMS was designed with two distinct operating modes — normal mode
    (holding V99% below 253V to maintain over-voltage compliance) and demand response
    mode (reducing voltages toward 216V floor) — enabling simultaneous optimisation
    of voltage compliance and demand response reserve without the two objectives conflicting.
  lesson_learnt: Designing a voltage management system with explicit dual operating
    modes — one optimising for voltage compliance, one for demand response — prevents
    the two objectives from trading off against each other; this should be a baseline
    design requirement for any distribution network deploying voltage control for
    RERT services.
