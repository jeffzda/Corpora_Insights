- record_id: ARENA-DLV-33003
  source_title: United Energy Demand Response Project Performance Milestone Report
    1
  publish_date: 2017-11
  project_name: United Energy Demand Response Project
  what_happened: Prior to this project, United Energy's voltage reduction demand response
    method carried unresolved risk that customer voltages could fall below regulated
    limits during an event, exposing the network to potential customer claims from
    appliance damage. This risk had previously prevented full-scale deployment of
    voltage-reduction-based demand response.
  lesson_learnt: Voltage reduction demand response from a distribution network has
    been historically constrained by regulatory voltage compliance risk; this barrier
    can be resolved by using time-lagged smart meter voltage data as a real-time feedback
    loop to bound voltage reductions — enabling network-wide demand response without
    customer opt-in or regulatory voltage breach.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: first commercial/FOAK
