  what_happened: At sites where the existing RTU could not accommodate new VRR points,
    a SEL-3505-3 was installed as a like-for-like replacement of the legacy MD3311
    OLTC RTU, acting as the host interface for the VRRs and communicating directly
    with the SCADA host; at sites previously using a SEL-2032 via MODBUS, the legacy
    connection was retained in parallel for cooling control functions.
  lesson_learnt: Where legacy RTUs are incompatible with new intelligent electronic
    devices, a dedicated relay-gateway device (such as a SEL-3505-3) can act as a
    drop-in RTU replacement for new equipment while retaining the existing RTU for
    legacy functions — this avoids a full RTU replacement and preserves continuity
    of cooling control and other non-DVMS SCADA points.
