  source_title: United Energy Demand Response – Final Project Performance Report
  publish_date: '2020-12-21'
  project_name: United Energy Demand Response – DVMS Rollout
  what_happened: When DVMS switched from power quality mode to demand response mode
    during peak demand, some high-voltage customers contacted UE reporting under-voltages
    and tripped or alarmed protection devices, despite DVMS using adjacent AMI meter
    feedback because no smart meters were installed at HV customer connection points.
  lesson_learnt: Before deploying a voltage-reduction demand response scheme, identify
    all high-voltage customers connected to participating zone substations and advise
    them to recalibrate protection devices to Code voltage limits — the absence of
    smart meters at HV sites means DVMS cannot directly observe their supply voltage,
    creating a risk of protection trips from customers with overly sensitive under-voltage
    settings.
