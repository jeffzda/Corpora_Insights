  what_happened: During the AEMO demand response test, a data bandwidth bottleneck
    between the analytics engine/data warehouse (NAP/OSI PI) and the real-time SCADA
    system (MOSAIC) caused slower-than-normal transformer tap-down, preventing United
    Energy from achieving the required 30MW demand response capability in the first
    half-hour interval.
  lesson_learnt: Ensure adequate data bandwidth between analytics and SCADA systems
    before live demand response activation — a bottleneck between NAP and MOSAIC delayed
    tap changes and diluted delivered demand response in the critical first interval;
    test end-to-end data throughput under activation conditions, not just steady-state.
