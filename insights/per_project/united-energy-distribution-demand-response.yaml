  what_happened: Prior to implementing LV remedial works, approximately 6% of distribution
    substations had sub-optimal transformer tap settings, ~5% of LV circuits had high
    phase unbalance, and <1% had excessively long or loaded LV circuits — localised
    issues that were only identifiable through smart meter data and that prevented
    DVMS from delivering the contracted demand response at those sites.
  lesson_learnt: Use smart meter voltage data to systematically audit LV network condition
    (tap settings, phase balance, circuit loading) before relying on voltage reduction
    for demand response — a small proportion of outlier distribution substations can
    constrain the entire zone substation's demand response capability, and these cannot
    be identified without granular LV visibility.
