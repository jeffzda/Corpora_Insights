- record_id: ARENA-DLV-62572
  source_title: United Energy Demand Response Project Performance Report - Milestone
    2
  publish_date: '2018-02-08'
  project_name: United Energy Demand Response Project
  what_happened: Voltage sensitivity of demand indices calculated during summer field
    tests were found to be unreliable for winter application, as different seasonal
    load compositions (e.g. heating versus cooling) produce materially different demand
    responses to voltage reduction — preventing direct re-use of summer-derived indices
    for year-round demand response planning.
  lesson_learnt: Conduct demand response voltage sensitivity tests in both summer
    and winter conditions before relying on sensitivity indices for year-round demand
    response planning — seasonal differences in load composition (constant power,
    current, and impedance mix) mean that a single set of indices will systematically
    over- or under-estimate demand response in the opposite season.
