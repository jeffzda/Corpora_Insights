- record_id: ARENA-DLV-28006
  source_title: United Energy Demand Response Project Performance Report - Milestone
    4
  publish_date: '2018-12-13'
  project_name: United Energy Demand Response Project (Dynamic Voltage Management
    System)
  what_happened: The existing low-tension bus voltage supervision relay settings (over-voltage
    at 106% of float voltage, under-voltage at 94% of float voltage) were incompatible
    with DVMS because the system uses the full ±6% high-voltage range, which would
    have triggered spurious lockouts of transformer tapping under normal DVMS operation.
  lesson_learnt: When deploying dynamic voltage management systems that use the full
    regulatory voltage range, review and update bus voltage supervision relay settings
    before commissioning — existing protection settings calibrated to normal static
    voltage operation will trigger spurious transformer lockouts if the DVMS is allowed
    to swing voltages across the full ±6% band.
  issue_severity: moderate
  project_type: network/grid
