  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Over-voltage supervision set-points for 11kV zone substations
    were relaxed to +9% of nominal (12kV) and for the 6.6kV zone substation to 10%
    of nominal (7.26kV), eliminating most nuisance alarms on hot days.
