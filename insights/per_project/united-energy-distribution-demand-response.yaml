    (standard LAN, legacy serial fibre, and incompatible RTU types such as MD1000
    and SEL-2032), requiring three distinct communications upgrade pathways to be
    designed and deployed across the 21 sites.
  lesson_learnt: Network-wide SCADA integration programmes across legacy distribution
    substations should anticipate multiple communications architecture variants rather
    than assuming a single standard upgrade path — each legacy architecture type (serial
    fibre, incompatible RTU protocols, standard LAN) requires a distinct design solution,
    and failure to identify this diversity early will add design iterations and procurement
    steps during construction.
