  what_happened: Field tests conducted on 14 November 2017 using emergency voltage
    set-point 1 (−2% or −3%) showed no measurable demand response at the network level
    — the −2% set-point was within the normal dead band of tap changers, resulting
    in only a single tap adjustment at most substations and no noticeable change in
    demand relative to natural variability.
  lesson_learnt: For voltage-reduction demand response, do not rely on the smallest
    emergency set-point (−2% or −3%) for demand management — the voltage change is
    too small relative to normal tap changer dead bands and measurement noise to produce
    a detectable response; deploy set-point 2 (−4% or −5%) directly when demand management
    is required.
