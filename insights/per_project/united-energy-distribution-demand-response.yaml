  source_title: United Energy Demand Response – Final Project Performance Report
  publish_date: '2020-12-21'
  project_name: United Energy Demand Response – DVMS Rollout
  what_happened: The new A. Eberle REG-D voltage regulation scheme did not include
    an OLTC isolation switch (present in the legacy MD3311 scheme), meaning that OLTC
    mechanism boxes at upgraded substations could not be safely isolated for maintenance
    without also switching off the DC supply to the REG-D relay, which caused all
    other REG-D relays at that substation to switch from automatic to manual voltage
    regulation mode.
  lesson_learnt: When replacing legacy OLTC control schemes with new relay technology,
    explicitly map all existing isolation and maintenance switching provisions and
    ensure equivalent functionality is carried across — removing an OLTC isolation
    switch without substituting equivalent safe isolation capability creates an operational
    hazard and forces manual voltage control during transformer maintenance.
