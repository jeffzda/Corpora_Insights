    when escalated — incompatible with the ARENA funding agreement requirement to
    switch to V1% demand response mode within 10 minutes of an AEMO request.
  lesson_learnt: Before committing to response-time obligations in grid services contracts,
    verify that all SCADA/IT systems supporting mode switching can execute the required
    transitions within the contractual timeframe; implement a direct operator-accessible
    switch in SCADA rather than relying on IT service desk processes for time-critical
    operational changes.
