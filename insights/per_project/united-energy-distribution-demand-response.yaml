  what_happened: When the 22 kV circuit breaker of the Master transformer at CDA zone
    substation was opened during abnormal condition testing, a defect in the NAP algorithm
    caused it to fail to update voltage recommendations for the new Master transformer
    — resulting in both transformers reverting to the default voltage set-point and
    DVMS ceasing to operate.
  lesson_learnt: NAP algorithms must be validated and tested for all abnormal switching
    scenarios (including loss of the Master transformer) before network-wide rollout
    of DVMS; until the algorithm defect is resolved, operators should disable DVMS
    prior to any switching that changes the Master transformer configuration.
