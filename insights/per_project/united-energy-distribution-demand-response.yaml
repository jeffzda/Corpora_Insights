  source_title: United Energy Demand Response Project Performance Report - Milestone
    5
  publish_date: '2019-06-11'
  project_name: United Energy Demand Response Project
  what_happened: Of 625 distribution substations targeted for transformer tap changes
    to enable DVMS demand response, only 537 (85.9%) were successfully completed.
    52 substations (8.3%) could not be tapped because the tap screw had seized (galled
    to the lock nut), 8 were already at their limit tap setting, 9 had incorrect tap
    changes applied, and 8 were unsafe due to maintenance defects.
  lesson_learnt: Large-scale distribution transformer tap change programmes should
    budget for a significant proportion of sites (at least 10–15%) being physically
    unworkable due to seized tap screws, limit tap settings, maintenance defects,
    or safety issues — plan the target site list with sufficient over-provisioning
    so that programme objectives can be achieved from completed sites alone without
    requiring rework of failed sites.
