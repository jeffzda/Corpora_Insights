  source_title: United Energy Demand Response Project Performance Report - Milestone
    7
  publish_date: '2020-06-10'
  project_name: United Energy Demand Response Project (DVMS)
  what_happened: Upon commissioning the DVMS, the Network Control Centre received
    a large number of voltage-related warning alarms from some zone substations because
    the SCADA alarm thresholds were configured as percentages above nominal voltage
    rather than based on the dynamic float voltages used by the DVMS, causing alarms
    for voltages well within regulatory limits.
  lesson_learnt: SCADA voltage warning alarm thresholds must be reviewed and updated
    before commissioning a dynamic voltage management system — alarms set as fixed
    percentages of nominal voltage will fire continuously at higher dynamic set-points
    even when voltages are within regulatory limits, overwhelming operators with false
    positives.
