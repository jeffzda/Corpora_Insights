- record_id: ARENA-DLV-3506
  source_title: United Energy Demand Response Project Performance Report - Milestone
    7
  publish_date: '2020-06-10'
  project_name: United Energy Demand Response Project (DVMS)
  what_happened: Following installation of A. Eberle REG-D voltage regulating relays
    at zone substations, an excessive number of tap changes was observed and OLTC
    master control failed alarms flooded the NCC. Investigation identified the root
    cause as contaminated On-Load Tap Changer (OLTC) wiper contacts combined with
    the REG-D relay using a two-wire connection to the tap position resistance chain
    (providing only 10V output), whereas the legacy TPT-194 transducer used a three-wire
    connection and supplied up to 20–50V, making it more immune to contact resistance.
  lesson_learnt: When replacing legacy voltage regulation relays with A. Eberle REG-D
    units, assess the tap position measurement circuit compatibility — the REG-D's
    two-wire connection and lower output voltage (10V max vs 20–50V for the TPT-194)
    renders it susceptible to dirty OLTC wiper contacts, requiring a tap position
    transducer upgrade to maintain reliable tap position measurement and prevent phantom
    tap operations.
  issue_severity: major
  project_type: network/grid
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: network business
  delay_category: commissioning/integration
  failure_mode: unvalidated integration
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: A 3-wire TPT-194 transducer arrangement was trialled and confirmed
    to resolve the issues at Sandringham zone substation; a programme to upgrade tap
    position transducers (to APCS type immune to electrical noise) was proposed across
    all affected zone substations using REG-D relays.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: demand response
  source_pages: &id006
  - 12
  - 13
  evidence_excerpt: Whilst the root cause could be traced to dirty wiper contacts
    at the OLTC to position resistance chain, it was noted that prior to installing
    A. Eberle REG-D relays, in many of the old VRR arrangements, a TPT-194 transducer
    was used to convert tap position resistance into 4-20mA used by the OLTC RTU...
    Another potential issue with the A. Eberle REG-D relay was that the output voltage
    was limited to 10V max, whereas the TPT-194 output voltage was 20V max or 50V
    max.
  confidence_note: null
