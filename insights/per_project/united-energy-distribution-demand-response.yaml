  project_name: United Energy Demand Response Project
  what_happened: During the third AEMO demand response test on 17 May 2018, baseline
    methodology produced widely divergent estimates of delivered demand response —
    ranging from 7MW (AEMO baseline) to 38MW (UE baseline) against a 12MW requirement
    — because the two parties selected different reference days from within the same
    ±4 degree temperature band.
  lesson_learnt: Demand response baselining accuracy is highly sensitive to reference-day
    temperature selection; requiring baseline reference days balanced within ±2 degrees
    of the event day (rather than the current unbalanced ±4 degree window) would materially
    reduce variance in estimated delivered response and improve measurement credibility.
