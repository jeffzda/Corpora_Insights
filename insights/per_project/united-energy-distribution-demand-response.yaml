  what_happened: The failsafe heartbeat timeout for the DVMS at CDA zone substation
    was initially set at 2 minutes; when the NAP system cut over from production to
    disaster recovery, the 2-minute timeout caused the transformers to revert to the
    default voltage set-point more frequently than desired — the timeout was subsequently
    increased to 4–7 minutes to match typical DR cutover duration.
  lesson_learnt: Set DVMS failsafe heartbeat timeouts to exceed the expected duration
    of planned IT failover events (e.g. NAP DR cutover) — a timeout shorter than the
    IT recovery window will cause unnecessary reversion to default voltage set-points
    and repeated system toggling; review and configure timeout values based on operational
    IT recovery benchmarks before going live.
