  - 8
  evidence_excerpt: The magnitude of the demand response available during light load
    periods is limited not only by the magnitude of the low demand itself, but also
    from available tapping range of many zone substation transformers. Under light
    load, transformers typically operate closer to the bottom end of their tapping
    range, which could limit the size of the voltage reduction available. UE has subsequently
    addressed this issue by applying more optimal voltage settings at the upstream
    terminal stations which now offer a wider tapping range for the zone substation
    transformers at light load.
