  what_happened: The existing DRMCC-T3 voltage regulating relays at CDA zone substation
    were found to be unsuitable for DVMS implementation — they had inconsistent firmware,
    a non-intuitive Master-Follower scheme, limited voltage set-point capacity (8
    maximum), and a contrived implementation path that introduced unacceptable project
    risk.
  lesson_learnt: Before designing a dynamic voltage management system, audit existing
    VRR firmware and capability against all system requirements — legacy relay limitations
    (set-point count, firmware consistency, SCADA integration) can invalidate the
    initial design and necessitate full relay replacement, which should be scoped
    as a prerequisite work package rather than discovered mid-project.
