  project_name: United Energy Demand Response – DVMS Rollout
  what_happened: DVMS initially sent NAP voltage recommendations only to Master VRRs.
    When a bus-tie circuit breaker was opened and Follower VRRs switched to Independent
    mode, they reverted to their previously stored set-point rather than the current
    DVMS set-point, creating circulating currents between transformers.
  lesson_learnt: Configure a dynamic voltage management scheme to send voltage set-point
    recommendations to all relays — both Master and Follower — not just the Master;
    Follower relays that do not receive set-point updates will revert to a stale set-point
    on bus-tie opening, creating circulating currents and degrading demand response
    performance at precisely the time network abnormalities occur.
