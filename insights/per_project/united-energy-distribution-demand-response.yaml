  what_happened: To deploy the advanced Dynamic Voltage Management (DVM) capability
    across all 47 zone substations, United Energy identified that the bulk of its
    voltage regulation relays (VRR) required replacement to support multiple float
    voltage settings. This hardware replacement programme needed to be staged over
    two years and was a prerequisite for delivering the full 30MW demand response
    capability.
  lesson_learnt: When designing a network-level demand response service that uses
    voltage manipulation, audit existing relay hardware early — legacy voltage regulating
    relays that support only single float voltage settings will block full deployment
    of dynamic voltage management and require a multi-year replacement programme as
    a prerequisite, which should be scoped and funded before project commencement.
