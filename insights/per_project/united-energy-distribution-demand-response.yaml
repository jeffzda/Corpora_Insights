  project_name: United Energy Demand Response – DVMS Rollout
  what_happened: GIS records of customer-to-distribution-substation connections were
    found to contain errors (customers recorded as supplied by one transformer but
    actually supplied by an adjacent one), causing DVMS to make inappropriate voltage
    set-point decisions for some distribution substations. This was discovered only
    during the LV remediation data analysis phase when voltage spread values >10V
    were found between V1% and V99% for some substations.
  lesson_learnt: Validate the accuracy of GIS network connectivity data against smart
    meter voltage data before deploying a smart-meter-driven voltage management algorithm
    — incorrect customer-to-substation mapping in GIS will propagate as errors in
    voltage recommendations and may result in non-compliant customer voltages; use
    high voltage-spread outliers (>10V) as a flag to trigger GIS data cleansing.
