  secondary_failure_mode: null
  intervention_note: Default voltage set-points were modified based on smart meter
    data analysis to match the most common dynamic voltage set-point, minimising tap
    changes when reverting to default on bus-tie opening.
  transferability: moderate
  delay_magnitude: null
  technology_domain: demand response
