  what_happened: During light-load AEMO test conditions, many zone substation transformers
    were already operating near the bottom of their tapping range, limiting the available
    voltage reduction margin and therefore constraining the achievable demand response
    magnitude during low-demand periods.
  lesson_learnt: When designing and scheduling network-level demand response via voltage
    reduction, account for transformer tapping range limitations under light-load
    conditions — the available demand response headroom is materially lower at low
    demand because transformers sit near their minimum tap position; ensure tests
    and capability commitments reflect this seasonal constraint.
