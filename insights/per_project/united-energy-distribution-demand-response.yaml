  source_title: United Energy Demand Response Project Performance Report - Milestone
    2
  publish_date: '2018-02-08'
  project_name: United Energy Demand Response Project
  what_happened: When the bus-tie circuit breaker at CDA zone substation was opened
    while DVMS was running in Enabled-Auto mode, the Follower transformer reverted
    to its own default voltage set-point (different from the Master's current dynamic
    set-point) because Follower VRRs did not receive NAP voltage recommendations and
    their internally stored set-points were not updated during Master-Follower operation
    — causing voltage non-compliance for some customers.
  lesson_learnt: Configure DVMS to send NAP voltage recommendations to all VRRs (Master
    and Followers) simultaneously, not just the Master, so that Follower relays maintain
    the correct voltage set-point if the bus-tie circuit breaker opens and they switch
    to Independent mode; this prevents divergent tap positions and associated voltage
    non-compliance.
