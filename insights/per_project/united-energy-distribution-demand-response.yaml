  secondary_failure_mode: data & measurement
  intervention_note: UE confirmed customer voltages were within Code limits via monitoring
    device data, advised affected customers to recalibrate protection to Code alarm
    thresholds, and adjusted NAP voltage threshold settings; no further complaints
    were received.
  transferability: moderate
  delay_magnitude: null
  technology_domain: demand response
