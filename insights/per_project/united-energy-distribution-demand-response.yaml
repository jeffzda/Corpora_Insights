  project_name: United Energy Demand Response – DVMS Rollout
  what_happened: The low-tension bus voltage supervision relay settings prescribed
    in UE's protection standard (UE ST 2004 Clause 9.2) were found to be incompatible
    with DVMS operation because they were set to ±6% of the float voltage, which would
    lock out transformer tapping within the normal DVMS operating range.
  lesson_learnt: Review and update all protection and supervision relay standards
    that reference static float voltages before rolling out a dynamic voltage management
    scheme — protection standards written for static voltage regulation will conflict
    with dynamic operation and must be revised (or DVMS-specific settings formally
    approved as deviations) to prevent unintended tapping lockouts across the fleet.
