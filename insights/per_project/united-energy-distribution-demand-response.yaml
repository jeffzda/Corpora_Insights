- record_id: ARENA-DLV-62558
  source_title: United Energy Demand Response Project Performance Report - Milestone
    2
  publish_date: '2018-02-08'
  project_name: United Energy Demand Response Project
  what_happened: Default voltage set-points at zone substations had been configured
    for high network loading conditions and were set relatively high, resulting in
    over-voltages to customers during normal (non-peak) operating conditions even
    when DVMS was in service, because the default set-points are used whenever DVMS
    is disabled or a network abnormality occurs.
  lesson_learnt: Before rolling out DVMS network-wide, update default VRR voltage
    set-points to match the most common dynamic voltage set-points — this minimises
    unnecessary tap changes when switching between DVMS and default operation, reduces
    OLTC wear, and eliminates chronic customer over-voltages that exist under the
    legacy default settings.
