  what_happened: Initial commissioning of DVMS used a 2.5% step between dynamic voltage
    set-points, which produced coarser-than-optimal voltage recommendations from NAP
    and inadequately managed voltage swells and sags caused by switching of terminal
    station and zone substation capacitor banks.
  lesson_learnt: Trial the step size between dynamic voltage set-points on a pilot
    zone substation before network-wide rollout — the initial 2.5% step was found
    through testing to be too coarse and a 2% step delivered materially smoother voltage
    regulation; commissioning assumptions on step size should be verified empirically
    rather than carried forward from initial design.
