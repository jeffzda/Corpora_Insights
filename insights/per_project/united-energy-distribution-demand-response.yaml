- record_id: ARENA-DLV-3505
  source_title: United Energy Demand Response Project Performance Report - Milestone
    7
  publish_date: '2020-06-10'
  project_name: United Energy Demand Response Project (DVMS)
  what_happened: When the DVMS switched from power quality mode to demand response
    mode during peak demand periods, some high-voltage (HV) customers experienced
    under-voltages that caused their protection devices to trip or alarm, despite
    the voltages being within the Victorian Electricity Distribution Code limits.
    The root cause was the absence of smart meters at HV customer sites, leaving the
    DVMS reliant on nearby AMI meters rather than direct measurement at the customer
    connection point.
  lesson_learnt: When deploying a dynamic voltage management system across a network
    with HV customers, identify sites lacking smart metering before go-live and pre-emptively
    review HV customer protection settings — the DVMS cannot directly observe voltages
    at unmetered HV customer sites, and protection devices set to tighter tolerances
    than the regulatory voltage limits will trip during demand response activation.
  issue_severity: moderate
  project_type: network/grid
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: data & measurement
  intervention_note: HV customers were advised to revise their protection settings
    to alarm only when voltages exceed Victorian Electricity Distribution Code limits;
    voltage threshold settings on the network analytics platform were also adjusted
    for impacted customers.
  transferability: moderate
  delay_magnitude: null
  technology_domain: demand response
  source_pages: &id005
  - 11
  - 12
  evidence_excerpt: This occurred due to lack of UE's visibility on the supplying
    voltage levels to these customers given the absence of smart meters at these sites...
    After reviewing the voltage measurements captured by customers' monitoring devices,
    it was found that the received voltages were within the Code limits.
