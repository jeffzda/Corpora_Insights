  what_happened: LV remedial works including distribution transformer tap changes
    and load balancing across the UE network reduced the median voltage spread across
    zone substations from 37.95V to 31.74V (a 16.4% improvement) and increased the
    proportion of zone substations within the allowed 37V spread from 33% to 100%,
    enabling the DVMS to deliver the required 30MW demand response while maintaining
    customer voltages within regulatory limits.
  lesson_learnt: LV network remediation (transformer tap changes and load balancing)
    is a prerequisite for voltage-reduction demand response to be delivered at scale
    while maintaining regulatory voltage compliance — the taller, narrower voltage
    profile created by remedial works provides the voltage margin headroom that makes
    demand response via DVMS technically feasible.
