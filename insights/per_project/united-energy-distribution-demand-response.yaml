- record_id: ARENA-DLV-38055
  source_title: United Energy Demand Response Project Performance Report - Milestone
    5
  publish_date: '2019-06-11'
  project_name: United Energy Demand Response Project
  what_happened: During the first live RERT activation on 24 January 2019, demand
    response delivered by voltage reduction declined over the 4-hour dispatch period
    due to thermostat effects, with the lowest demand response of 30MW delivered at
    the end of the period compared to a peak of 42MW at activation.
  lesson_learnt: Voltage-reduction demand response is subject to thermostat rebound
    effects during extended dispatch periods — the delivered response will decline
    over time from the initial peak as thermostatic loads cycle back on. Plan RERT
    contract capabilities and dispatch durations to account for this decay, ensuring
    the minimum contracted volume (not the peak) can be sustained throughout the full
    dispatch window.
