    observed because the inverse time curve applied to the relays was too fast for
    the parallel transformer configuration, causing transformers to respond and counter-respond
    repeatedly.
  lesson_learnt: When configuring A. Eberle REG-D relays in circulating current parallel
    mode, validate the inverse time curve setting before full deployment — a curve
    that is too fast relative to the permissible circulating current and voltage bandwidth
    settings will cause voltage hunting and significantly increase tap operations
    across the fleet.
