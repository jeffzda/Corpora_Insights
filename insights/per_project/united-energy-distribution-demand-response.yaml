  what_happened: The existing REG-D relay configuration only supported four native
    set-points, which was insufficient for the ten set-points (three standard plus
    seven dynamic) required by DVMS; the constraint was resolved by using the fourth
    set-point as a dynamic target populated by custom H-code relay logic rather than
    adding hardware.
  lesson_learnt: When implementing multi-set-point demand response schemes on legacy
    relays, verify the number of natively configurable set-points against requirements
    before finalising the design — where hardware limits fall short, custom relay
    logic (such as H-code in REG-D relays) can be used to extend set-point capacity
    without hardware replacement, but this requires bespoke logic development and
    site-specific adaptation.
