- record_id: ARENA-DLV-3502
  source_title: United Energy Demand Response Project Performance Report - Milestone
    7
  publish_date: '2020-06-10'
  project_name: United Energy Demand Response Project (DVMS)
  what_happened: During a demand reduction test at North Brighton zone substation,
    the DVMS selecting a low voltage set-point caused both station normal and standby
    supply phase failure relays to trip, taking the entire station ancillary power
    supply off supply. Initial remediation (tapping up station service transformers
    by one tap) did not prevent re-tripping; a subsequent investigation found one
    relay was faulty.
  lesson_learnt: When commissioning a dynamic voltage management system capable of
    significant voltage reduction, test the impact on station ancillary power supplies
    and phase failure relay settings before full rollout — voltage reductions that
    trip station service relays can remove all ancillary power at a zone substation,
    creating a serious operational safety risk.
