- record_id: ARENA-DLV-3507
  source_title: United Energy Demand Response Project Performance Report - Milestone
    7
  publish_date: '2020-06-10'
  project_name: United Energy Demand Response Project (DVMS)
  what_happened: The upgrade from legacy MD3311 OLTC RTUs to A. Eberle REG-D relays
    removed the dedicated OLTC isolation switch that had been present in the previous
    scheme, creating a gap in safe isolation capability. The agreed interim solution
    — switching off the 110V/240VDC MCB supplying the REG-D relay — caused all other
    parallel REG-D relays at the substation to switch from automatic to manual voltage
    regulation mode (ELAN error), requiring NCC staff to perform manual voltage control
    during maintenance.
  lesson_learnt: When replacing legacy voltage regulation relays, verify that equivalent
    safe isolation capability exists in the new scheme before commissioning — the
    removal of the OLTC isolation switch in the REG-D scheme created an unsafe isolation
    gap and a maintenance-induced cascading failure where isolating one transformer
    relay forces manual control of all parallel transformers at the substation.
  issue_severity: major
  project_type: network/grid
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: network business
  delay_category: commissioning/integration
  failure_mode: unvalidated integration
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: An interim procedure of switching off the DC MCB was established
    pending installation of dedicated MCBs and panel-mounted CB maintenance switches
    at all affected zone substations, with a training package to be developed for
    fitters, operators and NCC staff.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: demand response
  source_pages: &id007
  - 13
  - 14
  - 15
  evidence_excerpt: A consequence of switching off the supply to the A. Eberle relay
    was that other A. Eberle relays in the zone substation would switch from automatic
    to manual voltage regulation mode as they would see the A. Eberle REG-D relay
    was no longer communicating (i.e. ELAN error). This means that UE NCC would have
    to perform manual voltage control for other transformers still in service whilst
    maintenance was being carried out on one transformer.
