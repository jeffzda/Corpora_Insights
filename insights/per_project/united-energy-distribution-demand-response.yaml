  project_name: United Energy Demand Response Project
  what_happened: The 2.5% step between dynamic voltage set-points selected for the
    DVMS trial proved too coarse — hot-day testing revealed that a smaller step would
    provide more granular voltage control and better manage voltage swells and sags
    caused by capacitor bank switching at the terminal station.
  lesson_learnt: For DVMS rollout, reduce the step between dynamic voltage set-points
    to approximately 1.5%–2% rather than 2.5%; a smaller step enables smoother NAP
    voltage recommendations and better handles the voltage transients caused by terminal
    station or zone substation capacitor bank switching.
