  source_title: United Energy Demand Response Project Performance Report - Milestone
    5
  publish_date: '2019-06-11'
  project_name: United Energy Demand Response Project
  what_happened: During the fourth AEMO test conducted under light-load conditions,
    the available demand response was constrained not only by low absolute demand
    but also by zone substation transformers already operating near the bottom of
    their tapping range, limiting the voltage reduction available for demand response.
  lesson_learnt: Demand response via voltage reduction is materially constrained during
    light-load periods because zone substation transformers operate near the bottom
    of their tapping range. Apply more optimal voltage settings at upstream terminal
    stations to widen the tapping range available under light-load conditions, and
    account for this constraint in capability assessments and contracted RERT volumes.
