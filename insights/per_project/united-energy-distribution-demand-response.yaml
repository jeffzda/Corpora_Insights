- record_id: ARENA-DLV-62566
  source_title: United Energy Demand Response Project Performance Report - Milestone
    2
  publish_date: '2018-02-08'
  project_name: United Energy Demand Response Project
  what_happened: During field tests, SCADA commands for emergency voltage reduction
    were found to dispatch sequentially to all participating zone substations, completing
    within 3–5 minutes; however, some transformers ran out of taps on average demand
    days (because they were already near the tap limit), and differential tap changer
    speeds within a substation caused out-of-step tap positions, reducing the achieved
    voltage reduction.
  lesson_learnt: When assessing emergency voltage reduction capability, test on days
    representative of target operating conditions (high demand days) rather than average
    days — on average days, transformers may already be near tap limits and the full
    voltage reduction cannot be achieved; also account for inter-transformer tap-change
    timing differences that create out-of-step conditions and limit demand response
    delivery.
