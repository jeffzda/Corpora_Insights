- record_id: ARENA-DLV-58253
  source_title: United Energy Demand Response – Final Project Performance Report
  publish_date: '2020-12-21'
  project_name: United Energy Demand Response – DVMS Rollout
  what_happened: The default AEMO baselining method (Method 1) was found to be inappropriate
    for UE's temperature-sensitive daily demand curve, producing substantial overestimation
    or underestimation of the demand response delivered because baseline days did
    not match the temperature conditions of the event day.
  lesson_learnt: Negotiate a temperature-matched baselining methodology with AEMO
    before committing to demand response contracts — default baselining methods that
    average recent non-event days regardless of temperature can misrepresent actual
    demand response for networks with highly temperature-sensitive loads, leading
    to inaccurate measurement and potential contract non-compliance.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: utility/large-scale
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: data/validation/testing
  failure_mode: data & measurement
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: UE and AEMO negotiated a temperature-matched baseline method
    selecting the 10 most recent non-event, non-holiday weekdays within ±4°C of the
    activation day temperature, which provided a materially better estimate of demand
    response delivered.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: demand response
  source_pages: &id063
