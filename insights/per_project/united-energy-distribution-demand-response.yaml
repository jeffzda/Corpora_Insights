  project_name: United Energy Demand Response – DVMS Rollout
  what_happened: During the 4th AEMO demand response test on 27 November 2018, a data
    bandwidth bottleneck between the Network Analytics Platform/OSI PI data warehouse
    and the real-time MOSAIC SCADA system caused slower-than-normal transformer tapping,
    preventing UE from achieving the full 30MW in the first half-hour interval.
  lesson_learnt: Ensure sufficient data bandwidth and latency headroom between the
    analytics engine and real-time SCADA before activating demand response at scale
    — a bottleneck that reduces tapping speed will dilute delivered demand response
    in the critical first interval of any activation event.
