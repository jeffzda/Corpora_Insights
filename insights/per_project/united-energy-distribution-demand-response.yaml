- record_id: ARENA-DLV-62551
  source_title: United Energy Demand Response Project Performance Report - Milestone
    2
  publish_date: '2018-02-08'
  project_name: United Energy Demand Response Project
  what_happened: During the first AEMO demand response test on 1 December 2017, AEMO's
    default baselining methodology significantly overestimated the demand response
    delivered by United Energy, because the method does not account for the temperature-sensitivity
    of UE's load shape — mild-temperature non-event days used in the baseline produced
    a distorted comparison against a hot event day.
  lesson_learnt: Before committing to a demand response baselining method with AEMO,
    test whether the default method is suitable for your network's load shape — temperature-driven
    load curves require a like-temperature baseline approach; using the default method
    on a temperature-sensitive network can produce overestimates of 2× or more, undermining
    accurate performance verification.
