- record_id: ARENA-DLV-25927
  source_title: Review of ARENA's Reliability Portfolio
  publish_date: 2020-01
  project_name: ARENA Reliability Portfolio — Phase 3 Reliability Needs Coverage
  what_happened: The portfolio evaluation found a lower relative contribution towards Phase 3 reliability needs — dispatchable renewable generation and inertia and system strength support — particularly
    for the period beyond current VRE penetration levels, despite these being the needs most critical to operating a very high VRE system in the medium-to-long term.
  lesson_learnt: Portfolio funders managing a reliability programme should track the distribution of funded projects across current versus future reliability phases and proactively commission projects addressing
    future-phase needs before they become pressing, to allow adequate technology development time — particularly for inertia, system strength and long-duration dispatchable generation.
