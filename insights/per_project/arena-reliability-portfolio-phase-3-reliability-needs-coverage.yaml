  evidence_excerpt: We find that the portfolio has a lower relative contribution in the portfolio towards Phase 3 needs, such as dispatchable renewable generation and inertia and system strength support
    in the future. While these reliability needs can be met with existing technologies, we expect there is potential scope for further efficiencies in the deployment of the technologies that contribute
    to meeting these needs through ARENA funding.
