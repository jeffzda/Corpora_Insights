- record_id: ARENA-DLV-28105
  source_title: Insights from Freight Transport Electrification Across Port, Express
    Parcels & Last-Mile Deliveries
  publish_date: '2025-08-05'
  project_name: Depot of the Future Vehicle Electrification Project (Team Global Express)
  what_happened: AC chargers (7–22 kW) at the TGE depot showed a pronounced evening
    charging peak starting around 4–5 pm as vehicles returned from shifts, with charging
    tapering off in early mornings. This pattern aligns with the broader electricity
    network peak consumption period, placing default fleet charging squarely in the
    highest-cost grid window.
  lesson_learnt: Depot AC charging for freight EVs defaults to the grid peak period
    without active management — fleet electrification projects should implement managed
    or scheduled charging from the outset to shift load away from the 4–8 pm window,
    reducing both network charges and energy costs.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: fleet/logistics operator
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: TGE subsequently implemented a managed charging strategy (not
    shown in the report) designed to shift charging away from the peak window to off-peak
    periods.
  transferability: broad
  delay_magnitude: null
  technology_domain: EV
  source_pages: &id003
  - 17
  - 24
  - 25
  evidence_excerpt: All lower power AC sites (7-22kW) observed a typical workday pattern
    for plug-in behaviour, resulting in most energy consumed from 4-5 pm onwards,
    decreasing in the mornings as vehicles are used... High levels of evening 'after-work'
    plug-in behaviour indicates most charging likely to be in the typical peak energy
    consumption period by default.
