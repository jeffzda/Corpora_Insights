- record_id: ARENA-DLV-28106
  source_title: Insights from Freight Transport Electrification Across Port, Express
    Parcels & Last-Mile Deliveries
  publish_date: '2025-08-05'
  project_name: Depot of the Future Vehicle Electrification Project (Team Global Express)
  what_happened: The 400 kW DC fast chargers at the TGE depot exhibited a dual morning
    and evening peak pattern, corresponding to emergency top-up events just before
    and after shifts for vehicles that were not plugged into AC chargers overnight
    — whether due to charger malfunction or driver oversight.
  lesson_learnt: High-power DC fast chargers at freight depots function primarily
    as an emergency fallback rather than a primary charging source, creating sharp
    demand peaks rather than smooth load profiles. Fleet managers should address root
    causes of missed overnight AC charging (malfunction monitoring, driver compliance)
    to prevent avoidable DCFC peak demand events.
