- record_id: ARENA-DLV-28111
  source_title: Insights from Freight Transport Electrification Across Port, Express
    Parcels & Last-Mile Deliveries
  publish_date: '2025-08-05'
  project_name: Depot of the Future Vehicle Electrification Project (Team Global Express)
  what_happened: Emerging data (noted but not presented in the report) from TGE's
    fleet indicated that driver braking behaviour is one of the biggest factors affecting
    EV truck energy efficiency, with drivers not fully utilising regenerative braking
    features.
  lesson_learnt: EV truck efficiency can be materially improved through driver education
    on regenerative braking — OEMs and fleet operators should include regenerative
    braking training as a standard element of EV driver onboarding to reduce energy
    consumption and extend effective range.
