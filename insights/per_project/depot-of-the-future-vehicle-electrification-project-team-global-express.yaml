- record_id: ARENA-DLV-28102
  source_title: Insights from Freight Transport Electrification Across Port, Express
    Parcels & Last-Mile Deliveries
  publish_date: '2025-08-05'
  project_name: Depot of the Future Vehicle Electrification Project (Team Global Express)
  what_happened: Team Global Express managed EV truck range limitations by optimising
    routes and assigning longer trips to ICE vehicles, effectively constraining the
    operational envelope of the EVs rather than running them on all routes. Drivers
    were instructed to return to depot for a top-up if running low on charge mid-shift.
  lesson_learnt: Route optimisation and ICE vehicle assignment for longer trips is
    a necessary operational adaptation when deploying EV trucks — fleet managers should
    build in explicit dispatch rules that account for EV range before committing to
    full electrification of mixed-length routes.
