- record_id: ARENA-DLV-28101
  source_title: Insights from Freight Transport Electrification Across Port, Express
    Parcels & Last-Mile Deliveries
  publish_date: '2025-08-05'
  project_name: Depot of the Future Vehicle Electrification Project (Team Global Express)
  what_happened: Real-world energy consumption for both the Volvo eFL and FUSO eCanter
    was approximately 5% higher than manufacturer-stated efficiency ratings across
    all seasons, with the FUSO eCanter showing slightly lower efficiency in warmer
    months attributed to air conditioning load.
  lesson_learnt: Transition plans for freight electrification should account for real-world
    energy consumption being higher than supplier specifications — plan for approximately
    5% above manufacturer ratings to avoid range shortfalls and charging infrastructure
    undersizing.
