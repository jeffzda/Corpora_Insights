- record_id: ARENA-DLV-67265
  source_title: 'Smarter Homes for Distributed Energy: Towards home energy management systems that respond to dynamic operating envelopes and unlock distributed energy'
  publish_date: 2022-02
  project_name: Horizon Power Onslow DER Project
  what_happened: The Onslow DER project successfully demonstrated that orchestrating distributed energy resources across 260 households and businesses — using SwitchDin's IEEE 2030.5-compliant Droplet gateway
    and a DERMS — could support high DER penetration, culminating in the microgrid running on 100% solar and battery power for 80 minutes in May 2021.
  lesson_learnt: End-to-end DER orchestration using IEEE 2030.5-compliant gateway devices and a DERMS can support grid stability at high renewable penetrations in isolated networks — replicating this configuration
    requires both standards-compliant hardware at the customer premises and coordinated utility-side management software.
