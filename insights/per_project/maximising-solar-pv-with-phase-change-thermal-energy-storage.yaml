  secondary_failure_mode: null
  intervention_note: An opportunity arose to conduct a second demonstration system
    with additional funding from industry and UniSA, resulting in both an in-house
    controlled laboratory system and an in-field system at The Bends Motorsports Park.
  transferability: broad
  delay_magnitude: null
