- record_id: ARENA-DLV-2251
  source_title: Maximising Solar PV with Phase Change Thermal Energy Storage
  publish_date: '2019-02-13'
  project_name: Maximising Solar PV with Phase Change Thermal Energy Storage
  what_happened: The original project scope planned a single demonstration system
    to serve both technical testing and commercial showcasing purposes. Feedback from
    potential end users revealed that a single system could not convince diverse audiences
    — technical audiences required controlled laboratory experiments while commercial
    audiences required in-field demonstrations matching their specific operational
    context.
  lesson_learnt: Plan for multiple demonstration systems from the outset when targeting
    both technical and commercial audiences — a single system cannot simultaneously
    satisfy the evidence requirements of both groups, and relying on one risks failing
    to convert either audience.
  issue_severity: moderate
  project_type: storage
