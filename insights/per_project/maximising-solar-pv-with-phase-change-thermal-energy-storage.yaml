- record_id: ARENA-DLV-2252
  source_title: Maximising Solar PV with Phase Change Thermal Energy Storage
  publish_date: '2019-02-13'
  project_name: Maximising Solar PV with Phase Change Thermal Energy Storage
  what_happened: The optimal control strategy was initially designed to be evaluated
    through simulation alone. When implemented on the physical thermal storage system,
    the complexity and uniqueness of the control strategy relative to conventional
    control options created practical integration challenges — mode definitions, forecast
    internet feed compatibility, and control reliability required iterative refinement
    before satisfactory operation was achieved.
  lesson_learnt: When developing advanced control strategies for thermal storage or
    similar systems, practical implementation constraints must be evaluated in parallel
    with simulation-based optimisation — complexity that is invisible in simulation
    can become a significant integration barrier when applied to real hardware and
    live forecast data feeds.
  issue_severity: moderate
  project_type: storage
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: research organisation/university
  delay_category: commissioning/integration
  failure_mode: unvalidated integration
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: Mode definitions were iteratively reviewed until satisfactory,
    relevant forecast internet feeds were integrated via software, and reliability,
    speed, and forecast accuracy impacts were systematically tested before finalising
    the control strategy.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id002
  - 9
  evidence_excerpt: The complexity of the control strategy and its uniqueness relative
    to the conventional control options applied to the thermal storage system could
    not be ignored. The output of the control strategy is to provide modes of operation.
    The nature of these modes and how the thermal storage system would respond was
    iteratively reviewed until a satisfactory mode definition was established.
  confidence_note: lifecycle_phase assigned as commissioning/integration because the
    issue arose during physical implementation and integration testing of the control
    system, not during design simulation. technology_domain imprecision noted as per
    record 2251.
