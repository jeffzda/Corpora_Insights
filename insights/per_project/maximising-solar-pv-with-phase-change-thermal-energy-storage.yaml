- record_id: ARENA-DLV-2253
  source_title: Maximising Solar PV with Phase Change Thermal Energy Storage
  publish_date: '2019-02-13'
  project_name: Maximising Solar PV with Phase Change Thermal Energy Storage
  what_happened: The project's original PCM technology was developed for ammonia refrigeration
    systems operating at -11°C, positioned for a market expected to grow under the
    carbon tax. When the carbon tax was removed, ammonia refrigeration lost commercial
    attractiveness, and the existing PCM freeze temperature was incompatible with
    conventional HFC systems. Simultaneously, a market shift toward demand tariffs
    and solar PV uptake reduced the attractiveness of classical load-shifting operation,
    rendering the original technology and business case obsolete before the ARENA
    project commenced.
  lesson_learnt: Research projects built on a specific regulatory or market assumption
    (e.g. carbon pricing, a dominant refrigerant type) should stress-test their commercial
    premise against plausible policy reversals before committing to a technology pathway
    — a single policy change can invalidate both the technology specification and
    the business case simultaneously.
  issue_severity: major
  project_type: storage
  project_scale_band: demonstration
  lifecycle_phase: concept/feasibility
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: commercial & market
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: The team redesigned the PCM to freeze at -6°C (compatible with
    all refrigeration systems) and developed a new optimal control algorithm capable
    of operating across variable solar PV and demand tariff regimes, effectively rebuilding
    the technology for the new market conditions.
  transferability: moderate
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id003
  - 4
  evidence_excerpt: With the removal of the carbon tax, ammonia refrigeration was
    no longer a technology of interest in the market, and the PCM developed froze
    at too low a temperature for conventional HFC systems. Furthermore, a shift towards
    demand tariffs and the uptake of solar PV reduced the attractiveness of PCM thermal
    storage operating in a classical load shifting role. This research project aimed
    to re-develop the PCM storage technology suitable for these new market conditions.
  confidence_note: This event predates the ARENA project but directly shaped its scope
    and objectives; classified as concept/feasibility because the rescope occurred
    before the funded project's technical work began.
