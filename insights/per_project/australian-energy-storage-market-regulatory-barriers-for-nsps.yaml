- record_id: ARENA-DLV-16257
  source_title: Energy Storage Study
  publish_date: 2015-07
  project_name: Australian Energy Storage Market — Regulatory Barriers for NSPs
  what_happened: The Australian National Electricity Rules did not allow network service
    providers (NSPs) to monetise the wholesale energy component of battery installations,
    include behind-the-meter storage in their regulated asset base, propose islanding
    or microgrid solutions for fringe-of-grid customers, or use the full functionality
    of energy storage systems due to market participation restrictions.
  lesson_learnt: Regulatory frameworks that prevent NSPs from capturing the full value
    stack of energy storage (including wholesale energy, RAB inclusion and islanding)
    will structurally limit network-driven storage deployment; rule changes enabling
    these revenue streams are a prerequisite for NSP-led storage rollout at scale.
