- record_id: ARENA-DLV-15803
  source_title: Evaluation of ARENA's Impact and Effectiveness
  publish_date: 2019-11
  project_name: ARENA Large-Scale Solar (LSS) Competitive Round
  what_happened: 10 of 12 LSS Competitive Round projects overestimated their Marginal
    Loss Factors (MLFs), resulting in an average yield deficit of 6 per cent in the
    first year of operations. Proponents found it difficult to predict MLFs because
    of uncertainty about how many and which generators would connect nearby and the
    timing of their construction.
  lesson_learnt: MLF assumptions in large-scale solar business cases should be stress-tested
    against scenarios of high nearby generator penetration — the LSS experience shows
    that proximity clustering of new generators systematically erodes MLFs, producing
    material revenue shortfalls versus forecast.
  issue_severity: moderate
  project_type: multi-technology/hybrid
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: operations
  proponent_type: project developer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: partial success
  secondary_failure_mode: null
  intervention_note: null
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id003
  - 94
  evidence_excerpt: There have been notable challenges to proponents in predicting
    MLFs, specifically the extent to which new generators will connect proximally,
    and the timing of their construction. This is evidenced by an overestimated MLF
    in 10 of 12 LSS Competitive Round projects resulting in average yield deficit
    of 6 per cent in first year of operations.
