- record_id: ARENA-DLV-15802
  source_title: Evaluation of ARENA's Impact and Effectiveness
  publish_date: 2019-11
  project_name: ARENA Large-Scale Solar (LSS) Competitive Round
  what_happened: The grid connection and network access process for large-scale solar
    projects was found to be more demanding than comparable markets overseas, with
    each new generator approval impacting connection requirements for other projects
    in the pipeline, causing many iterations of revised modelling. AEMO also introduced
    more detailed modelling requirements following the South Australian blackout in
    September 2016.
  lesson_learnt: Proponents of large-scale solar projects should anticipate that Australian
    grid connection modelling requirements are materially more demanding than in comparable
    overseas markets, and that each concurrent approval in a pipeline affects others
    — iterative remodelling must be budgeted for in both schedule and cost.
