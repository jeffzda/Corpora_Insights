- record_id: ARENA-DLV-15801
  source_title: Evaluation of ARENA's Impact and Effectiveness
  publish_date: 2019-11
  project_name: ARENA Large-Scale Solar (LSS) Competitive Round
  what_happened: 11 of 12 LSS Competitive Round projects failed to meet expected timeframes
    and were on average 8.5 months behind schedule in reaching commercial operation.
    The Competitive Round saw 12 large-scale projects being progressed simultaneously,
    resulting in a backlog of approvals and commissioning.
  lesson_learnt: When funding multiple utility-scale projects through a simultaneous
    competitive round, build in schedule contingency for approval and commissioning
    backlogs — processing 12 projects concurrently created systemic delays averaging
    8.5 months per project.
