- record_id: ARENA-DLV-31703
  source_title: Transformative Research Accelerating Commercialisation (TRAC) Program
    – Hydrogen and Iron & Steel Funding Round
  publish_date: '2024-06-06'
  project_name: ARENA Hydrogen R&D Portfolio (prior rounds)
  what_happened: Across prior ARENA hydrogen R&D projects, project economics proved
    highly sensitive to forecast uncertainty in key metrics, undermining the reliability
    of business cases and commercialisation assessments.
  lesson_learnt: Build techno-economic models early in hydrogen R&D projects and stress-test
    them against key metric uncertainty — economics that appear viable under base-case
    assumptions can collapse under plausible forecast ranges, and this needs to be
    understood before significant capital is committed.
