- record_id: ARENA-DLV-31705
  source_title: Transformative Research Accelerating Commercialisation (TRAC) Program
    – Hydrogen and Iron & Steel Funding Round
  publish_date: '2024-06-06'
  project_name: ARENA Hydrogen R&D Portfolio (prior rounds)
  what_happened: Prior ARENA hydrogen R&D projects identified that interim technology
    scale-up steps were critical before progressing to pilot plant demonstration,
    and projects that skipped intermediate scale-up stages encountered greater difficulty
    at the pilot stage.
  lesson_learnt: Plan for an explicit interim scale-up stage between laboratory R&D
    and pilot plant demonstration — attempting to leap directly from bench-scale to
    pilot plant in hydrogen technology development is a predictable risk factor for
    technical and schedule failures.
