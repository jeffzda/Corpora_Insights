- record_id: ARENA-DLV-31702
  source_title: Transformative Research Accelerating Commercialisation (TRAC) Program
    – Hydrogen and Iron & Steel Funding Round
  publish_date: '2024-06-06'
  project_name: ARENA Hydrogen R&D Portfolio (prior rounds)
  what_happened: Across prior ARENA hydrogen R&D projects, industry partners showed
    hesitance to engage with academic research teams, creating uncertainty around
    scale-up and limiting the practical application of research outputs.
  lesson_learnt: Hydrogen R&D projects should establish formal industry engagement
    mechanisms from the outset — industry hesitance to engage with academia is a predictable
    barrier that must be actively managed, not assumed to resolve itself.
