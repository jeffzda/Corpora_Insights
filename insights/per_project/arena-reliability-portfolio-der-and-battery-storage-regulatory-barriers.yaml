- record_id: ARENA-DLV-25923
  source_title: Review of ARENA's Reliability Portfolio
  publish_date: 2020-01
  project_name: ARENA Reliability Portfolio — DER and Battery Storage Regulatory Barriers
  what_happened: Multiple projects across the DER and battery storage groups identified
    that the absence of clear regulations specifying rights and responsibilities of
    DER owners and distribution network service providers — particularly regarding
    managing grid impacts of DER installation and real-time control of resources —
    was a systemic barrier preventing projects from delivering their full intended
    outcomes.
  lesson_learnt: Projects aimed at integrating DER commercially should explicitly
    scope regulatory barrier identification and documentation as a required output;
    where regulatory barriers are well-understood but unresolved, ARENA should consider
    deferring further demonstration funding until regulations are clarified, rather
    than funding repeated demonstrations that face the same structural constraints.
