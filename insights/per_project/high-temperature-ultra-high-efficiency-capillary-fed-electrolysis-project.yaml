- record_id: ARENA-DLV-50804
  source_title: Hysata 'High Temperature, Ultra-High Efficiency Capillary-Fed Electrolysis
    Project' Core Research Interim Report
  publish_date: 2025-08
  project_name: High-temperature, ultra-high efficiency capillary-fed electrolysis
    project
  what_happened: Hysata adopted a staged testing strategy that progresses prototype
    separators through successively larger and more sophisticated test cells — starting
    with the smallest cell size to enable rapid prototyping — before advancing to
    full commercial-scale testing. This approach was deliberately designed to maximise
    learning speed and minimise research costs.
  lesson_learnt: Structure R&D validation programmes using the smallest viable cell
    or system size at each stage — beginning with the simplest, most accessible test
    configuration reduces cost and cycle time, and gating progression on demonstrated
    performance milestones prevents premature scale-up of underperforming designs.
  issue_severity: none
  project_type: manufacturing/supply chain
