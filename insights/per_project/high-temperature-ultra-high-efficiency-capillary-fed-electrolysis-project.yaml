  evidence_excerpt: These test cells have the smallest separator diameter among Hysata's
    cells, allowing for rapid prototype production and simplified balance-of-plant
    configurations... This staged testing approach enables Hysata to maximise learnings,
    accelerate development speed, and minimise research costs by employing only the
    necessary cell size and sophistication for each developmental stage.
