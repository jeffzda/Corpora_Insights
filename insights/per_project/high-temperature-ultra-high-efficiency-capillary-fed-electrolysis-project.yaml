  source_title: Hysata 'High Temperature, Ultra-High Efficiency Capillary-Fed Electrolysis
    Project' Core Research Interim Report
  publish_date: 2025-08
  project_name: High-temperature, ultra-high efficiency capillary-fed electrolysis
    project
  what_happened: The project originally planned to discontinue one of two parallel
    research workstreams after Phase 1 based on comparative results. Both workstreams
    demonstrated sufficiently promising results that neither could be eliminated,
    requiring both to continue into Phase 2 — expanding the scope and resource commitment
    beyond the original plan.
  lesson_learnt: When running parallel R&D workstreams with a planned down-select
    gate, build explicit criteria and resource contingency for the scenario where
    both workstreams remain viable — premature elimination of a promising pathway
    can destroy option value, but extending both has cost and schedule implications
    that should be budgeted in advance.
