  what_happened: Hysata structured its R&D priorities directly around regular commercial
    partner feedback, conducting bi-monthly check-ins to identify customer pain points
    and quantify the relative impact of technical improvements on project economics.
    Efficiency consistently emerged as the highest-value improvement area, validating
    the research focus.
  lesson_learnt: Anchor R&D prioritisation to structured, regular customer engagement
    rather than internal technical judgement alone — frequent commercial partner check-ins
    that quantify the economic impact of potential improvements help ensure R&D resources
    are directed toward the highest-value problems and reduce the risk of technically
    excellent but commercially misaligned outcomes.
