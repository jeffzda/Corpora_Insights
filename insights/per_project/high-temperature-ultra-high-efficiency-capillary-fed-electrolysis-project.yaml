  what_happened: Hysata embedded manufacturability assessment as a parallel activity
    to performance R&D from early project stages, investing in small-scale manufacturing
    equipment procurement concurrent with prototype testing rather than deferring
    it to a later phase.
  lesson_learnt: For hardware R&D projects targeting commercial deployment, assess
    manufacturability in parallel with performance development from the earliest feasible
    stage — deferring manufacturability assessment until after performance is proven
    risks discovering insurmountable production cost or scalability barriers late
    in development when redesign is costly.
