- record_id: ARENA-DLV-53894
  source_title: Demand Flexibility Portfolio Retrospective Analysis Report
  publish_date: 2023-07
  project_name: Project Highgarden (Horizon Power)
  what_happened: In a residential development, project developers were reluctant to
    provide updated metering devices to all customers due to high costs, creating
    a polarised participant group of customers with and without upgraded devices —
    a 'haves and have nots' outcome with equity implications.
  lesson_warnt: Program designers should be aware that site-by-site metering upgrade
    costs can create equity disparities within residential communities when budgets
    are insufficient for universal deployment; program design should either plan for
    full coverage funding or use a representative sampling approach that does not
    create visible inequity among neighbours.
  lesson_learnt: Program designers should be aware that site-by-site metering upgrade
    costs can create equity disparities within residential communities when budgets
    are insufficient for universal deployment; program design should either plan for
    full coverage funding or use a representative sampling approach that does not
    create visible inequity among neighbours.
