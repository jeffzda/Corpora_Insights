  source_title: Underground Pumped Hydro Energy Storage Project Final Report
  publish_date: 2022-07
  project_name: Centennial Pumped Hydro Energy Storage Project
  what_happened: Laboratory testing demonstrated that saturation of goaf material
    causes a porosity reduction of approximately 30% compared to values assumed by
    other researchers, and hydraulic conductivity values were typically less than
    0.1 m/s — both significantly worse than prior assumptions underpinning the UPHES
    economic case.
  lesson_learnt: Do not rely on dry-state or literature-derived porosity and hydraulic
    conductivity values for goaf material in UPHES feasibility assessments — saturation-induced
    collapse reduces porosity by ~30% and hydraulic conductivity drops sharply under
    load, fundamentally altering storage and flow rate calculations.
