  what_happened: The coal mining health and safety legislative review found that main
    PHES components (turbines, generators, valves) have not been considered in the
    context of operating in an underground coal mine, requiring a specific bespoke
    engineering design Safety Case with safety systems equal to or better than existing
    equivalent design requirements — adding a significant regulatory development burden
    not present in surface PHES.
