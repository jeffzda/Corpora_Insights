  source_title: Underground Pumped Hydro Energy Storage Project Final Report
  publish_date: 2022-07
  project_name: Centennial Pumped Hydro Energy Storage Project
  what_happened: The Stage 1 safety and regulatory review concluded that retro-fitting
    existing sealed goafs for PHES operation is unviable from safety, cost, legal
    and practical perspectives unless penstock access infrastructure was pre-installed
    during the original mining cycle and coal seam ribs near goaf inlets were lined
    with a durable membrane during mining.
  lesson_learnt: For UPHES to be practically viable, PHES infrastructure (penstock
    access points, inlet lining) must be planned and installed during the active mining
    phase — retrofitting sealed goafs after mine closure is not a workable pathway
    and should not be assumed in project planning.
