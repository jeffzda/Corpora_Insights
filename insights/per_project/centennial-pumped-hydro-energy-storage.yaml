- record_id: ARENA-DLV-11605
  source_title: Underground Pumped Hydro Energy Storage Project Final Report
  publish_date: 2022-07
  project_name: Centennial Pumped Hydro Energy Storage Project
  what_happened: Research into goaf atmosphere interchange found that oscillation
    in reservoir pressure caused by water flowing in and out during pumping cycles
    generates dangerous gas concentrations (including explosive mixtures and spontaneous
    combustion hazards) over the full project life cycle, unless coal seams have very
    low gas contents and very low propensity to spontaneous combustion.
  lesson_learnt: Gas hazard management is a binding site-selection constraint for
    UPHES — only mines with demonstrably low seam gas content and negligible spontaneous
    combustion risk should be considered, and this must be verified before progressing
    beyond concept stage.
