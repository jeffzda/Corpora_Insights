- record_id: ARENA-DLV-11604
  source_title: Underground Pumped Hydro Energy Storage Project Final Report
  publish_date: 2022-07
  project_name: Centennial Pumped Hydro Energy Storage Project
  what_happened: Numerical modelling of goaf hydraulics identified a significant risk
    of cavitation during the pumping cycle, requiring the lower reservoir to be maintained
    at a static head of 27m above the nominal critical level, effectively reducing
    available storage and net head from 250m to 226m and imposing a permanent dead
    storage penalty.
  lesson_learnt: UPHES designs must account for a substantial dead storage requirement
    to prevent cavitation at the turbine inlet during pumping cycles — this permanently
    reduces both available storage capacity and net head, and must be incorporated
    in energy yield and economic models from the outset.
