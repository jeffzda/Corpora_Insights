- record_id: ARENA-DLV-11601
  source_title: Underground Pumped Hydro Energy Storage Project Final Report
  publish_date: 2022-07
  project_name: Centennial Pumped Hydro Energy Storage Project
  what_happened: Stage 1 technical feasibility research found that UPHES requires
    large vertical elevation differences (>400m) to be economically viable, yet the
    research demonstrated that vertical elevation differences greater than 100m destroy
    the porosity and permeability of goafs, creating a fundamental physical incompatibility
    that renders the concept unviable at the required scale.
  lesson_learnt: Before committing to underground pumped hydro using longwall goafs,
    verify that the head requirements for economic viability are compatible with the
    geomechanical tolerance of the goaf material — the two constraints are in direct
    conflict for coal mine geometries, and this should be the first screening criterion.
  issue_severity: critical
