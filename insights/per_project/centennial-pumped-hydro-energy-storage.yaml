  what_happened: The research found that useable void space in longwall goafs is concentrated
    within 30–50m above the extraction horizon and predominantly near panel edges
    rather than in the main body of the goaf, with the immediate layer above the extracted
    horizon (10–20m) needing to be high-strength rock (>50MPa) to minimise fines transfer
    — significantly constraining the effective storage volume available for UPHES.
  lesson_learnt: UPHES site assessments must characterise the spatial distribution
    of goaf void space and the strength of the immediate roof strata, not just total
    extracted volume — the vast majority of extracted volume is unavailable for water
    storage, and only sites with high-strength immediate roof rocks can maintain adequate
    hydraulic conductivity through pumping cycles.
