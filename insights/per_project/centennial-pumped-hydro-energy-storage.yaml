  project_name: Centennial Pumped Hydro Energy Storage Project
  what_happened: The research identified that coal mine roadways in which penstocks
    would be installed require substantial ongoing maintenance (long tendons, bolts,
    mesh), concrete arch lining, or deliberate burial with backfill (precluding future
    access), with no clearly low-cost option available — adding an operational maintenance
    liability to the UPHES concept.
  lesson_learnt: Penstock and inlet roadway maintenance strategy must be determined
    at the design stage for UPHES and costed into the lifecycle economics — the three
    available options (maintain, line with concrete arches, or bury) each carry significant
    cost or access implications, and the choice affects the ability to inspect and
    remediate the system during its operating life.
