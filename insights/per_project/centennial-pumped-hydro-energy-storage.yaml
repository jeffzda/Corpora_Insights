  project_name: Centennial Pumped Hydro Energy Storage Project
  what_happened: The geotechnical analysis found that UPHES cannot be operated concurrently
    with active longwall extraction, and it is unlikely that PHES infrastructure can
    be practically installed during the mining cycle for a later PHES purpose unless
    explicitly planned at mine design stage.
  lesson_learnt: UPHES should not be treated as a post-closure adaptation option for
    operating mines — concurrent operation is not viable, and the window for installing
    PHES infrastructure is during active mining with design intent, not retrospectively;
    this requires extraordinary lead-time planning that is not consistent with typical
    mine development processes.
