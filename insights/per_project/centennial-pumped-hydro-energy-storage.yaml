  what_happened: The Stage 1 legal and planning review found that NSW legislation
    does not currently contemplate an underground coal mine being used as an energy
    generation works; existing mining approvals would require modification, co-existing
    approvals would need to cross-reference each other, and new bespoke legislation
    may be required.
  lesson_learnt: UPHES proponents must engage with state regulators early to confirm
    a permissibility pathway before committing to detailed design — the current NSW
    planning framework has no established mechanism for this land use combination,
    and creating one will require substantial regulatory development effort that should
    not be assumed as a given.
