  what_happened: The research found that for economies of scale to make UPHES financially
    viable, a large surface reservoir providing 20+ hours of storage (operable in
    closed-loop mode) is required, adding a major civil infrastructure component not
    originally prominent in the concept's cost advantage narrative.
  lesson_learnt: UPHES business cases that assume cost advantages from pre-existing
    underground voids must also account for the need for a large complementary surface
    reservoir to achieve viable storage duration — the underground reservoir alone
