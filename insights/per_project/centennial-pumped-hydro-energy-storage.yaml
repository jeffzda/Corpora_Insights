  source_title: Underground Pumped Hydro Energy Storage Project Final Report
  publish_date: 2022-07
  project_name: Centennial Pumped Hydro Energy Storage Project
  what_happened: Water chemistry testing across de-ionised water, tap water and sea
    water showed that circulation through goaf material causes increases in pH (by
    up to ~2 units) and electrical conductivity (~1,350–1,500 µS/cm increase for potable
    waters), with leaching of sodium, chloride and sulphate and capture of calcium
    and magnesium — but pH remained between 7 and 9 in all tests, suggesting water
    quality changes in a closed-loop system are unlikely to pose a problem.
  lesson_learnt: Water quality in a closed-loop UPHES system is unlikely to be a project-ending
    constraint, but designers should plan for ion exchange effects (particularly sodium
    leaching and calcium/magnesium capture) and validate source water chemistry against
    goaf lithology for the specific site before finalising water management plans.
