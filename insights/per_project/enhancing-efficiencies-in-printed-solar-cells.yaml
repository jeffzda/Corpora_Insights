- record_id: ARENA-DLV-68102
  source_title: Enhancing Efficiencies in Printed Solar Cells by Controlling Morphology
    Development
  publish_date: 2014-06
  project_name: Enhancing Efficiencies in Printed Solar Cells by Controlling Morphology
    Development (VICOSC)
  what_happened: Translation of laboratory-developed interface modifier technology
    to large-scale printed solar cell modules remained incomplete at project close,
    with only preliminary printing trials conducted and further optimisation of both
    printing conditions and interface modifier integration still required.
  lesson_learnt: Laboratory research programs targeting scale-up should only pursue
    interface modifier development for materials that have already been demonstrated
    to translate successfully to the printing process — pursuing interface modification
    for materials not yet validated at scale wastes research effort and leaves the
    scale-up pathway incomplete.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: close-out/post-project review
  proponent_type: research organisation/university
  delay_category: null
