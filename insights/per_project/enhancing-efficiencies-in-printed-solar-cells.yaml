- record_id: ARENA-DLV-68101
  source_title: Enhancing Efficiencies in Printed Solar Cells by Controlling Morphology
    Development
  publish_date: 2014-06
  project_name: Enhancing Efficiencies in Printed Solar Cells by Controlling Morphology
    Development (VICOSC)
  what_happened: The integration of interface modifier research with the large-scale
    printing program was less effective than planned because access to printing equipment
    — which was heavily used with a limited pool of trained operators — was difficult
    to schedule, leaving translation to large-scale printed modules incomplete by
    project end.
  lesson_learnt: Secure early, dedicated access to printing equipment and first optimise
    the active layer printing process before introducing interface modifiers — attempting
    both concurrently on contested shared equipment prevents systematic optimisation
    and leaves scale-up incomplete.
