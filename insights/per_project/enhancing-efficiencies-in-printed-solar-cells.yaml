- record_id: ARENA-DLV-68103
  source_title: Enhancing Efficiencies in Printed Solar Cells by Controlling Morphology
    Development
  publish_date: 2014-06
  project_name: Enhancing Efficiencies in Printed Solar Cells by Controlling Morphology
    Development (VICOSC)
  what_happened: The laboratory-based component of the project successfully delivered
    a set of design guidelines for interface modifiers, demonstrated multiple deposition
    methods for interface modification agents in organic photovoltaic cells, and transferred
    3D TEM tomography techniques from KIT to the University of Melbourne — all core
    technical milestones achieved within the project period.
  lesson_learnt: International research collaborations with structured exchange programs
    and clear equipment/technique transfer agreements can accelerate capability development
    — the KIT–University of Melbourne partnership enabled transfer of world-leading
    characterisation techniques (3D TEM tomography) and slot-die printing expertise
    that would not have been accessible domestically.
  issue_severity: none
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: no material delay stated
