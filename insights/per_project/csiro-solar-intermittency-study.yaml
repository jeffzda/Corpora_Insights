- record_id: ARENA-DLV-72229
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: '2014'
  project_name: CSIRO Solar Intermittency Study
  what_happened: A comprehensive literature review and simulation study found that
    existing research on solar intermittency suffered from a lack of quality data
    and consequently often overemphasised anecdotal evidence, and that high-penetration
    solar intermittency must be evaluated on a case-by-case basis rather than through
    generalised rules.
  lesson_learnt: Do not rely on generalised intermittency rules when planning high-penetration
    solar integration — the effect is not uniform and is application-specific; site-specific
    modelling with high-resolution data is required to determine what combination
    of solutions will cost-effectively manage intermittency.
  issue_severity: moderate
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: development/design
