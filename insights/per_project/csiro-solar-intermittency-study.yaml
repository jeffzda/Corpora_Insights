- record_id: ARENA-DLV-72230
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: '2014'
  project_name: CSIRO Solar Intermittency Study
  what_happened: Analysis of high-resolution solar power data from three Australian
    PV installations recorded power output reductions exceeding 66% of plant rating
    within a ten-second period, indicating that ramp rates can be severe and that
    high time-resolution forecasting is essential.
  lesson_learnt: Solar power forecasting systems must operate at high time resolution
    — ramp rates exceeding 66% of rated capacity within ten seconds mean that coarse-resolution
    forecasts are inadequate for managing network stability at high solar penetration.
