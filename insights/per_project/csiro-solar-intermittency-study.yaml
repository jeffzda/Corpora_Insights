  secondary_failure_mode: data & measurement
  intervention_note: CSIRO collected high-resolution solar power data from three Australian
    installations (DKASC, University of Queensland, CSIRO Newcastle) and built a simulation
    model to assess network impacts at different penetration levels.
  transferability: broad
