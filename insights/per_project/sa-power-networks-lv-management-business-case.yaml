- record_id: ARENA-DLV-46620
  source_title: 'DEIP Dynamic Operating Envelopes Workstream: Outcomes Report'
  publish_date: 2022-03
  project_name: SA Power Networks LV Management Business Case
  what_happened: SA Power Networks developed its LV management strategy in 2018 and conducted techno-economic modelling comparing static export limiting, network augmentation, and dynamic export limits
    as options for managing high-DER-penetration constraints; dynamic export limits were shown to deliver the best long-term economic outcome and the business case was approved by the AER as part of SAPN's
    2020–2025 regulatory determination.
  lesson_learnt: A rigorous techno-economic business case comparing static limits, augmentation and dynamic limits — submitted through the standard regulatory determination process — is a viable and successful
    pathway for DNSPs to obtain AER approval and regulatory funding for DOE implementation; other DNSPs facing similar constraint challenges should use this as a replicable model.
