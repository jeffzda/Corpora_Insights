- record_id: ARENA-DLV-52522
  source_title: ARENA's Virtual Power Plant Knowledge Sharing Workshop Summary
  publish_date: 2019-03
  project_name: CONSORT Bruny Island Trial
  what_happened: CONSORT trial customers reported frustration with slow installation
    and tech support processes, and were confused or anxious about the details of
    the technology, trial mechanics, and tariffs — information needs were significantly
    larger than anticipated, requiring far more contact from TasNetworks, Reposit
    Power, and social researchers than planned.
  lesson_learnt: Budget for substantially higher customer information and support
    resourcing than initially planned in DER/VPP trials — information needs are systematically
    underestimated; prefer face-to-face information sessions over one-off communications,
    and plan for ongoing rather than single-touch customer engagement.
