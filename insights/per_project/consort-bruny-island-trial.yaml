- record_id: ARENA-DLV-52524
  source_title: ARENA's Virtual Power Plant Knowledge Sharing Workshop Summary
  publish_date: 2019-03
  project_name: CONSORT Bruny Island Trial
  what_happened: Some CONSORT trial participants were resistant to the idea of their
    batteries being dispatched by TasNetworks, expressing a strong preference to retain
    all stored energy for their own use rather than selling it back to the network
    at low prices, reflecting a fundamental misalignment between prosumer values and
    VPP program design assumptions.
  lesson_learnt: Do not assume prosumer participation in network support is automatic
    — there is a baseline of distrust and a strong value placed on self-sufficiency
    and battery control; VPP programs must explicitly address and compensate for the
    loss of self-consumption, and should offer genuine backup capability to build
    the trust needed for network dispatch consent.
  issue_severity: moderate
  project_type: DER/customer-side
