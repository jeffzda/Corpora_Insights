- record_id: ARENA-DLV-52523
  source_title: ARENA's Virtual Power Plant Knowledge Sharing Workshop Summary
  publish_date: 2019-03
  project_name: CONSORT Bruny Island Trial
  what_happened: CONSORT trial participants who could not access the app to monitor
    system activity reported significant frustration at being unable to know what
    their battery was doing, undermining their sense of agency and making it difficult
    to communicate their experience to others.
  lesson_learnt: Real-time, accessible monitoring for trial participants is not optional
    — customers who cannot see what their system is doing become frustrated and disengaged;
    working monitoring apps and dashboards should be treated as a core deliverable
    in any VPP or battery trial, not a secondary feature.
