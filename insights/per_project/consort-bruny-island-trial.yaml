- record_id: ARENA-DLV-52521
  source_title: ARENA's Virtual Power Plant Knowledge Sharing Workshop Summary
  publish_date: 2019-03
  project_name: CONSORT Bruny Island Trial
  what_happened: The CONSORT Bruny Island trial (ARENA-funded, approximately $7.9M
    total, $2.9M ARENA, 34 customers, ~150 kW battery capacity, April 2016 – March
    2019) found that customers were easily overwhelmed by the complexity of technology
    choice during the installation process, with each installer presenting conflicting
    information and customers unable to evaluate options.
  lesson_learnt: VPP and ESS trial designers should provide standardised, accessible
    information through the program itself — not just through installers — as customers
    are overwhelmed by contradictory installer-driven information and default to trusting
    whoever seems most expert, rather than making informed decisions.
