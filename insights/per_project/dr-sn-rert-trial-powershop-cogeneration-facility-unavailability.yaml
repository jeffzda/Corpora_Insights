- record_id: ARENA-DLV-20719
  source_title: Demand Response Short Notice RERT Trial Year 3 Report
  publish_date: 2021-10
  project_name: DR SN RERT Trial — Powershop cogeneration facility unavailability
  what_happened: Powershop's Monash University 1 MW gas cogeneration facility, which
    was intended to provide additional firm capacity to the residential BDR program,
    was unavailable for use in Year 3 due to ongoing maintenance and system failure.
  lesson_learnt: Capacity contributions from co-generation or other mechanical plant
    that is subject to unplanned maintenance should not be relied upon as firm DR
    capacity within contracted portfolios; such assets should be treated as opportunistic
    supplement capacity, with the contracted volume backed by more reliable DR sources.
