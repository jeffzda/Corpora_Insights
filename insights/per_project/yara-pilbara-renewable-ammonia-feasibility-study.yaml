- record_id: ARENA-DLV-31857
  source_title: 'ENGIE-YARA Renewable Hydrogen and Ammonia Deployment in Pilbara -
    YURI Phase 0: Feasibility Study Public Report'
  publish_date: 2020-10
  project_name: YURI Phase 0 - ENGIE-YARA Renewable Hydrogen and Ammonia
  what_happened: The electrolyser technology type (alkaline vs PEM) was left open
    for EPC bidders to propose, rather than being specified in advance by the project
    owner. This was a deliberate design decision to avoid prematurely eliminating
    competitive solutions and to ensure the most cost- and technology-competitive
    outcome.
  lesson_learnt: For first-of-kind hydrogen projects where both alkaline and PEM electrolysers
    are technically viable, leaving technology selection open to EPC tenderers avoids
    premature lock-in and drives cost competition — this approach is most effective
    when no project-specific requirement favours one technology, and when the allocated
    footprint can accommodate either solution.
  issue_severity: none
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: procurement
  proponent_type: industrial operator
