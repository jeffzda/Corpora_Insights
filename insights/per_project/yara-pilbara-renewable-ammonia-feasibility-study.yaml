  source_title: 'ENGIE-YARA Renewable Hydrogen and Ammonia Deployment in Pilbara -
    YURI Phase 0: Feasibility Study Public Report'
  publish_date: 2020-10
  project_name: YURI Phase 0 - ENGIE-YARA Renewable Hydrogen and Ammonia
  what_happened: The feasibility study confirmed that YURI Phase 0 at the 10 MW scale
    would displace only ~0.4% of YPF's total hydrogen supply. At this fraction, variability
    in renewable hydrogen output has no material impact on ammonia plant process regulation
    and no hydrogen storage is required, simplifying project design and reducing capital
    cost.
  lesson_learnt: Sizing a first-of-kind renewable hydrogen injection demonstration
    at a fraction small enough to be inconsequential to the host process (below ~0.4%
    of supply) eliminates the need for hydrogen storage and process control upgrades,
    materially reducing CAPEX and integration risk — this threshold should be explicitly
    verified with the host plant's technology licensor during feasibility.
