  source_title: 'ENGIE-YARA Renewable Hydrogen and Ammonia Deployment in Pilbara -
    YURI Phase 0: Feasibility Study Public Report'
  publish_date: 2020-10
  project_name: YURI Phase 0 - ENGIE-YARA Renewable Hydrogen and Ammonia
  what_happened: 'No offtake market willing to pay a premium for renewable ammonia
    existed at the time of the feasibility study. The study identified a ''chicken
    and egg'' problem: customer demand requires renewable ammonia product to be physically
    available, but investment in production requires committed customers.'
  lesson_learnt: Renewable hydrogen and ammonia projects face a market-formation 'chicken
    and egg' problem — early demonstration projects should be explicitly framed as
    market-creation investments rather than commercial projects, and proponents should
    plan to use physical product from demonstrations to anchor offtake negotiations
    rather than expecting market demand to precede first production.
