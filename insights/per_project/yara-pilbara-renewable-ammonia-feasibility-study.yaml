- record_id: ARENA-DLV-31856
  source_title: 'ENGIE-YARA Renewable Hydrogen and Ammonia Deployment in Pilbara -
    YURI Phase 0: Feasibility Study Public Report'
  publish_date: 2020-10
  project_name: YURI Phase 0 - ENGIE-YARA Renewable Hydrogen and Ammonia
  what_happened: The feasibility study concluded that wind power should not be added
    to complement the solar PV resource for YURI Phase 0, despite the theoretical
    benefit of improving electrolyser utilisation. The primary reason was that wind
    generation in a cyclone zone introduced disproportionate engineering risk and
    complexity for a project of this scale.
  lesson_learnt: For small-scale hydrogen demonstration projects in cyclone-prone
    regions, the risk and complexity of incorporating wind generation outweighs the
    capacity-factor benefit — technology selection for Phase 0 demonstrations should
    minimise complexity and execution risk even at the cost of reduced utilisation,
    reserving hybrid configurations for later commercial-scale phases.
