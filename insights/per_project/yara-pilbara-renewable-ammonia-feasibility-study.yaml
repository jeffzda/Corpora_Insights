  secondary_failure_mode: regulatory & approvals
  intervention_note: The project was redesigned to fit entirely within YARA's existing
    YPF lease boundary, which guaranteed land access and allowed approvals to focus
    on updating the existing safety case rather than obtaining new land-use approvals.
  transferability: broad
