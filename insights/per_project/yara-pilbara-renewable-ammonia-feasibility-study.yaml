  publish_date: 2020-10
  project_name: YURI Phase 0 - ENGIE-YARA Renewable Hydrogen and Ammonia
  what_happened: The feasibility study identified that the most significant factors
    influencing YURI Phase 0 project economics (levelised cost of hydrogen) were electrolyser
    and balance-of-plant CAPEX, financing conditions (grant funding amount and debt
    terms), and solar PV capital and operating costs. Electrolyser efficiency and
    carbon pricing had comparatively smaller effects on LCOH.
  lesson_learnt: For first-of-kind renewable hydrogen projects, CAPEX reduction and
    financing structure (particularly grant funding proportion and debt conditions)
    dominate project economics — sensitivity analysis should prioritise these factors
    early in feasibility, and EPC tender strategy and grant funding quantum should
    be optimised before finalising the investment case.
