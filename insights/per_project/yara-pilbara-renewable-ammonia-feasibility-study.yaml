  what_happened: The feasibility study found that for YURI Phase I and beyond, moving
    the renewable power generation site further inland (away from the Burrup Peninsula)
    would remove projects from the severe cyclone zone, enabling use of solar tracking
    systems that could increase electricity output by up to 20%, while also opening
    significantly greater land area for renewable development.
  lesson_learnt: Renewable hydrogen scale-up phases in cyclone-prone coastal regions
    should plan for inland renewable power generation sites — the combination of enabling
    solar tracking technology (up to 20% output improvement) and reduced cyclone engineering
    requirements can substantially improve project economics and reduce execution
    risk compared to on-peninsula options constrained by cyclone design loads.
