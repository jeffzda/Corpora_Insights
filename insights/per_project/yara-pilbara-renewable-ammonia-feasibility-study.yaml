  evidence_excerpt: As there are no project specific requirements which drive the
    selection toward one technology, the option has been left open to the Engineering,
    Procurement and Construction (EPC) bidders to allow them to propose the best solution.
    This approach will avoid prematurely eliminating any of the options and will ensure
    that the most cost and technology competitive solution will be selected.
