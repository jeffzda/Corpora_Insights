- record_id: ARENA-DLV-31852
  source_title: 'ENGIE-YARA Renewable Hydrogen and Ammonia Deployment in Pilbara -
    YURI Phase 0: Feasibility Study Public Report'
  publish_date: 2020-10
  project_name: YURI Phase 0 - ENGIE-YARA Renewable Hydrogen and Ammonia
  what_happened: The project team deliberately chose to site YURI Phase 0 within YARA's
    existing YPF lease boundary and off-grid (behind-the-meter), allowing them to
    avoid regulated network connection processes entirely. This eliminated the risk
    of grid connection delays, network constraints, and curtailment risk that would
    otherwise apply.
  lesson_learnt: For small-scale renewable hydrogen demonstrations co-located with
    an industrial host, designing the project as a private behind-the-meter microgrid
    avoids the complexity, delay risk, and curtailment exposure of regulated network
    connection — a significant schedule and commercial risk reduction for early-stage
    projects.
