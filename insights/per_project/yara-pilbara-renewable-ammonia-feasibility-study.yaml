- record_id: ARENA-DLV-31853
  source_title: 'ENGIE-YARA Renewable Hydrogen and Ammonia Deployment in Pilbara -
    YURI Phase 0: Feasibility Study Public Report'
  publish_date: 2020-10
  project_name: YURI Phase 0 - ENGIE-YARA Renewable Hydrogen and Ammonia
  what_happened: Leveraging the existing YPF ammonia plant lease and regulatory approvals
    substantially reduced the number of new permits required for YURI Phase 0. Rather
    than seeking wholly new environmental and planning approvals, the project required
    only amendments to existing approvals (e.g. Ministerial Statement MS586) and updates
    to existing safety licences.
  lesson_learnt: Co-locating a renewable hydrogen demonstration within an existing
    industrial operator's lease boundary can dramatically streamline the approvals
    pathway — proponents should map existing host-site licences and approvals early
    in feasibility to identify which can be amended rather than obtained fresh, reducing
    both cost and development timeline.
