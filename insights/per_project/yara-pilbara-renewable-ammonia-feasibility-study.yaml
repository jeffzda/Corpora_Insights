    in-person community and stakeholder engagement could be conducted. The project
    team adapted by integrating YURI engagement into YARA's existing quarterly Pilbara
    newsletter (distributed to over 200 local families and key stakeholders) and leveraging
    existing YARA staff relationships, maintaining engagement continuity without new
    in-person activities.
