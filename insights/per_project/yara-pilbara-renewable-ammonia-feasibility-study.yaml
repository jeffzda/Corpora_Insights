  source_title: 'ENGIE-YARA Renewable Hydrogen and Ammonia Deployment in Pilbara -
    YURI Phase 0: Feasibility Study Public Report'
  publish_date: 2020-10
  project_name: YURI Phase 0 - ENGIE-YARA Renewable Hydrogen and Ammonia
  what_happened: YURI Phase 0's BESS was sized and designed solely to provide grid-forming
    services (frequency and voltage response) for the off-grid microgrid, not for
    energy shifting. Energy shifting was assessed and rejected as not cost-efficient
    at the project scale, given that electrolyser curtailment during low-solar periods
    was acceptable given the small fraction of YPF hydrogen supply involved.
  lesson_learnt: For small off-grid renewable hydrogen demonstrations where the hydrogen
    output is a minor fraction of total plant demand, BESS should be sized only for
    power quality and grid-forming functions rather than energy shifting — energy
    shifting at small scale is rarely cost-efficient and adds unnecessary CAPEX to
    an already challenging business case.
