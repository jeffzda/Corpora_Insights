  what_happened: The project team identified that the YPF site is located adjacent
    to the Dampier Archipelago National Heritage Listed Place, which contains Aboriginal
    rock art. A heritage survey conducted with the Murujuga Aboriginal Corporation
    (MAC) identified eight heritage places within the project area with revised boundaries.
    One petroglyph could not be located during survey due to low-contrast visibility
    conditions, requiring a follow-up visit.
  lesson_learnt: Heritage surveys near National Heritage Listed Places in the Pilbara
    should be scheduled to account for the possibility that low-contrast petroglyphs
    may not be visible in standard survey conditions — plan for revisit contingency
    with Traditional Owners and ensure heritage survey completion does not sit on
    the critical path for approval submissions.
