- record_id: ARENA-DLV-31851
  source_title: 'ENGIE-YARA Renewable Hydrogen and Ammonia Deployment in Pilbara -
    YURI Phase 0: Feasibility Study Public Report'
  publish_date: 2020-10
  project_name: YURI Phase 0 - ENGIE-YARA Renewable Hydrogen and Ammonia
  what_happened: Land access for YURI Phase 0 proved complex and time-consuming in
    the Pilbara region. Multiple site options were investigated, including across-causeway
    locations and a sub-lease arrangement through the Murujuga Aboriginal Corporation,
    but these were rejected due to land-use zoning, permitting, transmission challenges,
    or government refusal. The project was ultimately downsized to a 10 MW electrolyser
    to fit within YARA's existing YPF lease boundary.
  lesson_learnt: In remote industrial regions, securing land access for greenfield
    hydrogen projects can be the binding constraint on project scale and timeline
    — proponents should prioritise sites within existing lease boundaries or industrial
    estates at the outset, as even seemingly available land may be blocked by zoning,
    permitting, transmission requirements, or government decisions that cannot be
    resolved in an acceptable timeframe.
  issue_severity: major
  project_type: industrial decarbonisation
