  what_happened: Community concern emerged around housing affordability in Karratha
    due to anticipated construction workforce influx from YURI Phase 0 and other projects
    in the region. The City of Karratha proposed a $35 million program to boost housing
    construction in response to these concerns, though this program was subsequently
    withdrawn due to project deferrals, COVID-19, and government stimulus effects.
  lesson_learnt: Proponents of industrial hydrogen projects in regional centres such
    as Karratha should proactively address construction workforce housing impacts
    in community engagement — even for demonstration-scale projects, the cumulative
    effect of multiple concurrent industrial projects can trigger housing affordability
    concerns that become a social licence issue requiring active management and communication
    of workforce accommodation plans.
