- record_id: ARENA-DLV-31854
  source_title: 'ENGIE-YARA Renewable Hydrogen and Ammonia Deployment in Pilbara -
    YURI Phase 0: Feasibility Study Public Report'
  publish_date: 2020-10
  project_name: YURI Phase 0 - ENGIE-YARA Renewable Hydrogen and Ammonia
  what_happened: YURI Phase 0 feasibility confirmed the project is commercially sub-economic
    on a standalone basis and requires grant funding to be viable. The levelised cost
    of hydrogen was found to be highly sensitive to electrolyser and balance-of-plant
    CAPEX, financing conditions, and solar PV costs — none of which are currently
    competitive without subsidy.
  lesson_learnt: First-of-kind renewable hydrogen demonstration projects at the 10
    MW scale should be structured from the outset as grant-supported commercial projects,
    not standalone commercial ventures — commercial feasibility assessments should
    quantify the funding gap explicitly and confirm grant support as a prerequisite
    before committing to EPC tender processes.
