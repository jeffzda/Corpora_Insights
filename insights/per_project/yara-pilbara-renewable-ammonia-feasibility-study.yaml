  source_title: 'ENGIE-YARA Renewable Hydrogen and Ammonia Deployment in Pilbara -
    YURI Phase 0: Feasibility Study Public Report'
  publish_date: 2020-10
  project_name: YURI Phase 0 - ENGIE-YARA Renewable Hydrogen and Ammonia
  what_happened: A hydrogen utilisation study conducted with KBR (YPF's ammonia plant
    technology licensor) found that renewable hydrogen from YURI Phase 0 (at ~0.4%
    of total hydrogen supply) could be injected into YPF's existing ammonia plant
    without modification. However, higher renewable hydrogen injection levels (above
    6% and up to 20%), required for future phases, needed further investigation and
    potentially plant modifications.
  lesson_learnt: Before committing to scale-up phases of brownfield renewable hydrogen
    integration, proponents must commission a formal hydrogen utilisation study with
    the ammonia plant licensor to establish safe injection limits and required plant
    modifications — the 6% threshold identified for YPF demonstrates that integration
    constraints can cap the renewable hydrogen volume that can be absorbed without
    capital investment in the host facility.
