- record_id: ARENA-DLV-31861
  source_title: 'ENGIE-YARA Renewable Hydrogen and Ammonia Deployment in Pilbara -
    YURI Phase 0: Feasibility Study Public Report'
  publish_date: 2020-10
  project_name: YURI Phase 0 - ENGIE-YARA Renewable Hydrogen and Ammonia
  what_happened: A phased roadmap (Phase 0 through III) was designed to progressively
    scale renewable hydrogen and ammonia production from a 10 MW demonstration to
    up to 1,000 MW electrolyser capacity by 2030, with each phase generating operational
    learnings and reducing costs to enable the next phase. The multi-phase structure
    was explicitly designed to match the hydrogen import transition timelines of key
    export markets including Japan.
  lesson_learnt: Structuring large-scale renewable hydrogen ambitions as a multi-phase
    roadmap — with each phase commercially and technically de-risking the next — is
    more likely to attract investment and international off-take interest than attempting
    to build commercial scale in a single step; aligning the demonstration phase timeline
    with importing nations' transition schedules strengthens the strategic case for
    grant support.
