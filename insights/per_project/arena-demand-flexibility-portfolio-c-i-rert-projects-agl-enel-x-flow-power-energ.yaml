- record_id: ARENA-DLV-53863
  source_title: Demand Flexibility Portfolio Retrospective Analysis Report
  publish_date: 2023-07
  project_name: ARENA Demand Flexibility Portfolio — C&I RERT Projects (AGL, Enel
    X, Flow Power, EnergyAustralia)
  what_happened: None of AGL's C&I customers accepted automated remote control of
    loads, and across all RERT providers there was significant customer reluctance,
    primarily driven by cyber-security concerns, health and safety, potential operational
    impacts, and operational complexity (no single-point control).
  lesson_learnt: Automation of demand response at C&I sites cannot be assumed at project
    outset; providers should plan for predominantly manual response capabilities in
    the near term and build toward automation only as customers develop confidence
    through experience, while investing in advanced communications systems to narrow
    the gap between manual and automated performance.
