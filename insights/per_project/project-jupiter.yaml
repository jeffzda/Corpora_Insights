  project_name: Project Jupiter
  what_happened: Feed-in tariffs in the SWIS — including the flat-rate REBS (7.135c/kWh)
    and the peak/off-peak DEBS (10c/2c per kWh) — still do not accurately reflect
    the low or negative value of solar output during midday, nor the high value during
    peak demand periods, blunting the investment signal for batteries and VPP participation.
  lesson_learnt: Feed-in tariff design has direct downstream effects on DER investment
    signals and VPP viability. Programme designers should assess whether export tariff
    structures are sufficiently time-differentiated to make battery storage commercially
    attractive before investing heavily in VPP recruitment; misaligned tariffs will
    suppress participation regardless of programme design quality.
