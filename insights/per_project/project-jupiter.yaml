  source_title: Project Jupiter - National Alignment Report
  publish_date: 2025-06
  project_name: Project Jupiter
  what_happened: Inconsistent technical solutions across aggregators and DNSPs in
    the VPP space make it difficult for consumers to switch providers, as equipment
    may not be compatible with a new aggregator's systems, creating an overly complicated
    transfer process that erodes consumer confidence in VPPs.
  lesson_learnt: VPP provider-switching friction is a social licence risk — consumers
    who feel 'locked in' to a provider due to equipment incompatibility will resist
    joining VPPs in the first place. Consistent use of open communication protocols
    (e.g., CSIP-AUS integrated as a default into inverters) should be mandated before
    broad VPP recruitment to preserve consumer choice and maintain social licence.
