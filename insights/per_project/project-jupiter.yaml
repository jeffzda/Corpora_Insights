  what_happened: Research within the WEM found that consumers strongly prefer 'activation-style
    payments' — where they are paid to take specific actions — over timed rebates,
    even when both approaches offer the same maximum incentive value, a behavioural
    insight that aggregators are now using to design VPP products.
  lesson_learnt: Payment structure design, not just payment quantum, materially affects
    consumer participation rates in DER programmes. Programme designers should conduct
    behavioural research into consumer payment preferences before finalising product
    incentive structures — activation-style payments that reward specific actions
    are likely to outperform equivalent timed rebates across similar consumer cohorts.
