  source_title: Project Jupiter - Vision and Impact Pathway Report
  publish_date: 2025-08
  project_name: Project Jupiter
  what_happened: Project Jupiter identified that achieving MRL 5 for the Development
    and Installation stage requires commercially available DER orchestration products
    to be accessible in all jurisdictions beyond the WEM, a condition that lies outside
    the project's control and is not expected to be met during the project timeframe.
  lesson_learnt: Commercial maturity targets for DER orchestration platforms should
    be scoped to what is achievable within the project's jurisdictional reach — setting
    MRL targets that require cross-jurisdictional commercial availability creates
    unachievable success criteria when the project operates in a single market; targets
    should distinguish between in-jurisdiction achievement and national market maturity.
