- record_id: ARENA-DLV-65609
  source_title: Project Jupiter - Lessons Learnt Report 1
  publish_date: 2025-06
  project_name: Project Jupiter
  what_happened: Analysis conducted in the lead-up to the 2025 Reserve Capacity Mechanism
    (RCM) cycle confirmed that a residential DER-based VPP could not meet the current
    service specifications for the Demand Side Program (DSP) pathway, despite recent
    rule changes intended to enable DER participation. This triggered a strategic
    pivot away from the intended market participation pathway.
  lesson_learnt: Validate market participation pathways for DER against actual service
    specifications early in program design — regulatory changes intended to enable
    DER participation may leave structural and technical barriers (baselining methodology,
    availability windows, telemetry requirements) that prevent viability in practice.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: utility/large-scale
  lifecycle_phase: development/design
  proponent_type: network business
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: 'The Value Working Group and Steering Committee pivoted to short-term
    IRCR-based value capture while scoping two longer-term options: reforming the
    DSP pathway or creating a new purpose-built facility class for DER.'
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: DER
  source_pages: &id055
  - 12
  - 13
  - 14
  evidence_excerpt: It became clear that the Demand Side Program (DSP) pathway is
    currently not viable for residential DER participation in the RCM despite recent
    changes to the rules intended to enable DER to participate. This conclusion reflects
    a shared understanding among partners that key structural and technical barriers
    remain, including baselining, availability windows, and misalignment with DER
    characteristics.
  confidence_note: transferability set to moderate — the specific RCM/DSP context
    is WA SWIS-specific, but the broader lesson about regulatory misfit for DER market
    participation applies across NEM jurisdictions with similar VPP pathways.
