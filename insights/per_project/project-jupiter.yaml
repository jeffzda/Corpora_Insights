  what_happened: The SWIS experienced a record DPV output of 76.3% of total supply
    at noon on 25 September 2023, and AEMO was required to procure supplementary reserve
    capacity for the 2024–25 capacity period and Non-Co-optimised Essential System
    Services for 2025–2027 to manage system security risks arising from uncontrolled
    DPV proliferation.
  lesson_learnt: Network operators and market bodies in high-DER penetration systems
    must move from passive DPV connection policies to active DER orchestration frameworks
    before minimum demand and system security conditions become critical — Emergency
    Solar Management and connection limits are stopgap measures, not a long-term solution,
    and market and network tools to orchestrate DER must be in place ahead of the
    tipping point.
