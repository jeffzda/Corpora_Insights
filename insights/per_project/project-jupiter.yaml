  what_happened: Aggregators working on Project Symphony found that specific language
    choices — using words such as 'access' and 'utilise' instead of 'control' when
    describing interactions with customer assets — were crucial to consumer receptiveness
    and onboarding success, a finding confirmed by Project Symphony's Social Research
    workstream.
  lesson_learnt: Language and framing in consumer communications for VPP and DER orchestration
    programmes materially affect uptake. Programme managers and aggregators should
    test consumer-facing language before launching recruitment campaigns — specifically
    avoiding terminology that suggests loss of control (e.g., 'control', 'dispatch')
    in favour of language that conveys collaboration and consumer agency (e.g., 'access',
    'utilise').
