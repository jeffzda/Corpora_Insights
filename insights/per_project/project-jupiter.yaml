  project_name: Project Jupiter
  what_happened: Project Jupiter identified that achieving MRL 5 for the Value Proposition
    stage depends critically on the establishment of a functioning third-party aggregator
    market in the WEM, which had not yet been established at project commencement.
    Without competitive TPA market participation, the commercial products available
    are limited to those from the single Parent Aggregator (Synergy), constraining
    market competition and commercial viability assessment.
  lesson_learnt: DER orchestration commercialisation projects that rely on third-party
    aggregator market competition to validate commercial viability should treat TPA
    market activation as a critical path item requiring early-stage regulatory and
    commercial framework development — delays in establishing the TPA framework will
    directly constrain market maturity outcomes and should not be deferred to later
    project phases.
