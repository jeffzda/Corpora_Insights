  what_happened: The WEM established a working DER Register with static data by September
    2020 and is now progressing towards a dynamic Data Hub and DER Data Coordinator
    role, while the NEM is simultaneously developing its own DER Register evolution
    and CER Data Exchange — creating a risk of duplicated effort and divergent architectures
    if development proceeds independently.
  lesson_learnt: When multiple jurisdictions are independently developing data infrastructure
    for the same function (DER visibility and orchestration), early coordination on
    data standards, governance frameworks and system architecture can prevent costly
    divergence and enable shared infrastructure where appropriate. Programmes should
    explicitly assess whether a jurisdiction-specific solution or a shared national
    solution better serves their needs before committing to a design path.
