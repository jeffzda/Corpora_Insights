  source_title: Project Jupiter - Vision and Impact Pathway Report
  publish_date: 2025-08
  project_name: Project Jupiter
  what_happened: Project Jupiter identified that achieving Stage 8 (Reflection and
    Retention) TRL 8 target may be challenged if customer protection frameworks are
    insufficient, because inadequate protections could undermine customer willingness
    to opt into DER participation at the point of connection agreement and compromise
    transparency and agency for customers.
  lesson_learnt: DER orchestration commercialisation projects must develop and implement
    customer protection frameworks concurrently with technical build — launching opt-in
    participation mechanisms without adequate transparency, control, and protection
    provisions risks customer rejection and regulatory challenge that can prevent
    target maturity levels from being achieved.
