- record_id: ARENA-DLV-62107
  source_title: Project Jupiter - National Alignment Report
  publish_date: 2025-06
  project_name: Project Jupiter
  what_happened: Inconsistent implementation of interoperability standards — particularly
    CSIP-AUS — across DNSPs in the NEM (e.g., five Victorian DNSPs each implementing
    the standard differently) is causing delays in DER installation, increased compliance
    risk, compatibility and interoperability issues, and market access problems for
    vendors, OEMs and installers.
  lesson_learnt: Adopting a technical standard at a national level is insufficient
    if implementation is left to individual network operators without coordination
    — divergent interpretations create the same fragmentation problems as having no
    standard. National programmes should establish a central coordination mechanism
    to enforce consistent implementation across all network operators before mandatory
    adoption, and should validate implementation consistency before relying on interoperability
    claims.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: approvals/contracting
  proponent_type: network business
  delay_category: approvals/regulatory
  failure_mode: unvalidated integration
  outcome_class: re-scoped/adapted
  secondary_failure_mode: coordination & stakeholders
  intervention_note: 'Project Jupiter identified collaboration opportunity on core
    DER integration standards (ref #8) as a harmonisation priority with the NEM CER
    Roadmap.'
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: DER
  source_pages:
  - 39
  - 44
  evidence_excerpt: For example, stakeholders consulted shared that within Victoria,
    the five DNSPs have each implemented the standard in a different way, impacting
    how equipment can be installed and programmed. This is causing frustration and
    inefficiencies for vendors, OEMs and installers who need to tailor their processes
    and products to cater for different interpretation of standards and testing requirements
    and will likely lead to frustration for consumers as connection durations become
    longer than necessary.
