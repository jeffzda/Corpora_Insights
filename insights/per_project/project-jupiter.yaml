  what_happened: Both NEM stakeholders and WEM stakeholders raised concerns that a
    significant amount of data required to calculate DOEs would need to be recovered
    through network tariffs, with no agreed cost recovery mechanism established ahead
    of DOE deployment planning.
  lesson_learnt: The cost of data processing and system infrastructure required to
    deliver DOEs at scale must be factored into network tariff design and regulatory
    determinations before broad deployment — failing to resolve cost recovery mechanisms
    in advance will create a regulatory barrier to implementation. DOE implementation
    programmes should include a dedicated cost recovery workstream that engages the
    economic regulator early.
