- record_id: ARENA-DLV-62120
  source_title: Project Jupiter - National Alignment Report
  publish_date: 2025-06
  project_name: Project Jupiter
  what_happened: Project Jupiter identified that the need to establish policy positions
    for the DER Data Hub early in the project (to support technical development) may
    limit the ability to incorporate learnings from NEM initiatives on data governance,
    particularly if those NEM initiatives encounter delays.
  lesson_learnt: 'When a programme''s technical workstream depends on policy positions
    being established early, there is a sequencing risk: if those positions are set
    before equivalent programmes in other jurisdictions have produced learnings, an
    opportunity for harmonisation is lost. Programme managers should explicitly map
