  source_title: Project Jupiter - National Alignment Report
  publish_date: 2025-06
  project_name: Project Jupiter
  what_happened: The NEM operates with 13 DNSPs (many privately owned), full retail
    competition and multi-jurisdictional governance, creating a significantly more
    complex change management environment than the WEM, resulting in slower progress
    on DER/CER integration reforms and a risk of the WEM pulling ahead and establishing
    divergent standards.
  lesson_learnt: Multi-party, multi-jurisdictional governance structures impose a
    structural speed penalty on DER integration reform that single-jurisdiction programmes
    do not face. National programmes should explicitly account for this asymmetry
    when designing knowledge-sharing arrangements — the faster-moving jurisdiction
    should actively hold open collaboration windows rather than proceeding to lock-in
    decisions, to avoid creating path dependencies that slow eventual harmonisation.
