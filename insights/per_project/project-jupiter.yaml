  intervention_note: Reforms included the reformed WEM design, the Emergency Solar
    Management (ESM) mechanism for curtailing rooftop solar when needed, and procurement
    by AEMO of a Minimum Demand Service as a Non Co-optimised Essential System Services
    (NCESS).
