  project_name: Project Jupiter
  what_happened: 'Project Jupiter identified that the regulatory bias between capital
    expenditure and operating expenditure for network service providers remains unresolved,
    creating a structural barrier to DER orchestration reaching market readiness level
    5 (Stage 6: Orchestration) because OPEX-based demand-side solutions are not on
    a level playing field with CAPEX-based network augmentation.'
  lesson_learnt: DER orchestration programmes must explicitly engage with regulatory
    bodies on capex/opex treatment early — the absence of a level playing field between
    network capital solutions and DER operating expenditure is a persistent systemic
    barrier that technical demonstrations alone cannot resolve, and requires targeted
    policy intervention to be addressed.
