  publish_date: 2025-08
  project_name: Project Symphony
  what_happened: Project Symphony delivered a DER orchestration pilot in the SWIS
    between July 2021 and December 2023, recruiting over 500 customers and nearly
    1,000 DER assets in a VPP. A key finding was a positive NPV only when all four
    test scenarios were delivered in concert, with net positive value across all participants
    achievable only when value stacking network and market services.
  lesson_learnt: Pilot-scale VPP demonstrations at approximately 500–900 DER sites
    are achievable and sufficient to validate end-to-end orchestration, aggregator
    models, and market dispatch — providing a credible evidence base for subsequent
    commercial-scale programmes. Lessons on aggregator models, customer engagement,
    value stacking, and market rule gaps should be systematically documented and carried
    forward into any successor programme.
