  publish_date: 2025-08
  project_name: Project Jupiter
  what_happened: Project Jupiter's test-and-learn strategy for Stage 7 (Transactions)
    — the mechanism by which end-to-end dispatch, aggregation, and settlement of DER
    will be validated — was still under development at the time of the Vision and
    Impact Pathway report publication, including the recruitment of a test-and-learn
    manager, leaving detailed metrics for that stage unfinished.
  lesson_learnt: End-to-end transaction validation strategies and the governance roles
    to manage them (e.g. a test-and-learn manager) should be defined and resourced
    before the project's preliminary analysis is completed — leaving this to a later
    stage creates gaps in the evaluation framework and risks that transaction-stage
    metrics cannot be confirmed until well into delivery.
