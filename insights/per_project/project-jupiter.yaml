  project_name: Project Jupiter
  what_happened: The NEM lacks a framework within the Rules specifying how DER compliance
    obligations are set, how they are enforced, who monitors compliance, and who must
    comply — a gap identified as particularly acute in relation to DOE limit compliance,
    where a third-party aggregator's actions may breach DOE limits but the obligation
    rests with the customer under current triangular contracting arrangements.
  lesson_learnt: DER compliance frameworks must clearly assign responsibility across
    all actors in the value chain — including third-party aggregators — before commercial-scale
    VPP deployment. Where contracting structures (e.g., triangular versus linear)
    create ambiguity about who is responsible for breaches of technical limits (e.g.,
    DOE limits), this ambiguity should be resolved in the regulatory framework before
    aggregator models are commercialised at scale.
