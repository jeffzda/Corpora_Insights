  outcome_class: re-scoped/adapted
  secondary_failure_mode: regulatory & approvals
  intervention_note: The WA DER Roadmap narrowed its ambition to opt-in tariff offerings
    (e.g., Midday Saver, Sunshine Saver ToU tariffs) to complement the regulated tariffs
    that remain in place for the majority of customers.
  transferability: broad
