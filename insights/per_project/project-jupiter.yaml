  source_title: Project Jupiter - Vision and Impact Pathway Report
  publish_date: 2025-08
  project_name: Rheem Active Hot Water Control
  what_happened: The Rheem Active Hot Water Control project in South Australia faced
    issues with customer recruitment, though it ultimately demonstrated that actively
    controlled hot water systems with 92 customers can increase solar self-consumption
    for the benefit of distribution network service providers.
  lesson_learnt: Flexible demand DER projects using hot water systems as the orchestrated
    asset face customer recruitment challenges — project designers should plan conservative
    recruitment timelines and consider geographic targeting and installer-channel
    recruitment strategies to achieve minimum viable customer numbers for service
    delivery validation.
