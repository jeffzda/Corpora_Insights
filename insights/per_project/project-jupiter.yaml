  what_happened: The market maturity of DER orchestration in the WEM is expected to
    reach only level 4.5–5.5 out of 6 by end of Project Jupiter (January 2028), with
    most stages required to jump two or more maturity levels over approximately three
    years. The inherent uncertainty in such rapid progress was identified as a cross-cutting
    risk.
  lesson_learnt: Programmes targeting multi-level market maturity jumps over short
    timeframes should build in staged go/no-go gates and contingency pathways — the
    ambition of jumping two or more Commercial Readiness Index levels simultaneously
    across most delivery stages is a material schedule and outcome risk that needs
    active risk management, not just programme optimism.
