  publish_date: 2025-08
  project_name: Project Jupiter
  what_happened: Project Jupiter identified that the opt-in/opt-out framework for
    VPP customer participation had not been resolved by the time the Vision and Impact
    Pathway was published, with the policy position on mandatory versus voluntary
    DER participation still requiring development, creating uncertainty for customer-facing
    product design.
  lesson_learnt: Policy positions on VPP participation frameworks (opt-in, opt-out,
    or mandatory) for both contestable and non-contestable customers should be resolved
    before customer product design is finalised — ambiguity in participation obligations
    complicates product structuring, contract development, and customer communication,
    and can delay customer recruitment.
