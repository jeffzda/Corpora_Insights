  project_name: Project Jupiter
  what_happened: 'Project Jupiter identified that data sharing and security arrangements
    — specifically that no customer information would be shared by Synergy including
    to project partners under the IP Management Plan — may prevent the DSO or DMO
    from accessing data required to mainstream DER integration and orchestration,
    constituting a potential barrier to achieving MRL 4 (Stage 1: Opportunity).'
  lesson_learnt: DER orchestration projects must resolve data sharing and governance
    arrangements between project partners before technical build commences — restrictive
    IP or privacy clauses that prevent data flow between the DSO, DMO, and aggregator
    can block key market readiness milestones and should be negotiated as part of
    project setup, not during implementation.
