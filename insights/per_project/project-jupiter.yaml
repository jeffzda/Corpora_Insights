  what_happened: Risks were identified that Project Jupiter may not achieve expected
    technology maturity levels for consumer engagement and acquisition (Stage 3) and
    development and installation (Stage 4), due to insufficient resources for training,
    development, and maintenance of aggregator and DSO/DMO platforms.
  lesson_learnt: DER orchestration programmes should explicitly resource workforce
    training and platform maintenance as distinct budget line items — the technology
    and the technical platform build are insufficient without parallel investment
    in the human and operational capability to deploy and maintain them at scale.
