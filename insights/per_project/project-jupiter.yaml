  what_happened: Research for the National Alignment Report found that installers
    play a critical role in building consumer trust in DER products, but many installers
    lack sufficient knowledge of the systems they install, leading to poor consumer
    engagement at installation, non-compliance risks, and downstream consumer switching
    away from retailers when issues arise.
  lesson_learnt: Installer education programmes are a cost-effective trust-building
    mechanism — consumers who receive thorough installation briefings require fewer
    follow-up interactions and are more confident in their systems. DER programmes
    should include mandatory installer education and certification components alongside
    technical compliance frameworks, and should treat installer engagement as a consumer-facing
    activity, not merely a technical one.
