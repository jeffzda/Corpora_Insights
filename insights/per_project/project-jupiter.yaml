  what_happened: Aggregators operating in both the WEM and NEM found that product
    development and revenue certainty are currently better supported in the WEM due
    to the Reserve Capacity Mechanism providing quantifiable capacity revenue, whereas
    the NEM's reliance on wholesale market arbitrage makes value quantification harder
    and results in less competitive pricing for NEM customers.
  lesson_learnt: Revenue certainty mechanisms (such as capacity payments) directly
    enable VPP product development and competitive consumer pricing. In energy-only
    markets, aggregators face greater difficulty quantifying and monetising VPP value,
    which suppresses product innovation and consumer pricing competitiveness. Programmes
    operating in energy-only markets should identify and create alternative revenue
    certainty pathways (e.g., network support service contracts) to compensate for
    the absence of capacity revenue.
