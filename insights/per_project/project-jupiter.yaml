- record_id: ARENA-DLV-62103
  source_title: Project Jupiter - National Alignment Report
  publish_date: 2025-06
  project_name: Project Jupiter
  what_happened: The WEM's regulated, uniform A1 tariff for non-contestable customers
    does not incentivise acquisition or use of small-scale customer-owned battery
    energy storage, as confirmed by a key lesson from Project Symphony. This creates
    a structural barrier to VPP recruitment and DER participation in the SWIS.
  lesson_learnt: Regulated uniform tariffs that do not reflect the time-varying cost
    of energy will blunt investment signals for battery storage and undermine VPP
    business models. DER integration programmes should assess whether existing retail
    tariff structures are compatible with VPP participation incentives before designing
    recruitment strategies, and should advocate for cost-reflective tariff reform
    in parallel.
