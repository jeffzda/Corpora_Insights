  what_happened: Project Symphony identified that 'value stacking is a must-have for
    VPPs', meaning that VPP products that cannot aggregate value across multiple revenue
    streams (energy, capacity, network support services) are not commercially viable
    enough to attract and retain customer participation at scale.
  lesson_learnt: VPP programmes must be designed from the outset to enable value stacking
    across multiple revenue streams — energy, capacity and network support services.
    A product offering that relies on a single revenue stream is unlikely to be commercially
    viable or attractive enough to customers. Programme designers should map the full
    value chain and establish commercial arrangements between all actors before customer
    recruitment begins.
