- record_id: ARENA-DLV-62101
  source_title: Project Jupiter - National Alignment Report
  publish_date: 2025-06
  project_name: Project Jupiter
  what_happened: The WEM's more centralised market structure — with a single network
    operator (Western Power), a single retailer for non-contestable customers (Synergy),
    and both entities as state-owned corporations — enabled faster clarification of
    DSO/DMO roles and responsibilities compared to the NEM, where 600+ registered
    participants and multi-jurisdictional governance slowed equivalent progress.
  lesson_learnt: Early clarification of roles and responsibilities for DSO and DMO
    functions is fundamental — it enables commercial entities to position themselves
    and allows for better planning, communication and investment. In complex multi-party
    markets, structured cross-agency collaboration (a 'Team SWIS' model) accelerates
    delivery; NEM proponents should seek equivalent coordination mechanisms across
    jurisdictions.
