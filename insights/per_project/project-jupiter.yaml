  failure_mode: coordination & stakeholders
  outcome_class: delayed but recoverable
  secondary_failure_mode: execution & logistics
  intervention_note: Conditions Precedent items were successfully delivered by an
    interim program lead ahead of the Program Director commencing in April.
  transferability: broad
  delay_magnitude: 1-3 months
  technology_domain: DER
