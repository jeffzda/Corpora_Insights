- record_id: ARENA-DLV-62109
  source_title: Project Jupiter - National Alignment Report
  publish_date: 2025-06
  project_name: Project Jupiter
  what_happened: The lack of harmonised technical and regulatory standards across
    NEM and WEM jurisdictions creates a requirement for OEMs and technology vendors
    to undertake separate product design, testing and certification processes for
    each market, increasing costs, delaying time to market, and potentially deterring
    global OEMs from entering Australian markets.
  lesson_learnt: Fragmented technical standards across jurisdictions impose a direct
    cost penalty on equipment manufacturers and reduce the competitive pool of technology
    providers. National programmes should prioritise standards harmonisation as a
    precondition for attracting global OEM participation and competitive pricing;
    this is particularly critical for technology domains (like batteries and inverters)
    where the Australian market is too small to justify bespoke product lines.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: development/design
  proponent_type: network business
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: The National Alignment Report was commissioned to map WEM–NEM
    gaps and identify harmonisation opportunities; recommendations include a national
    harmonisation governance forum and formal collaboration charters.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: DER
  source_pages:
  - 10
  - 31
  - 60
  evidence_excerpt: Without national alignment, the DER/CER rollout risks creating
    a patchwork of isolated solutions that burden customers, increase costs for OEMs
    and hinder innovation and scalability for VPP suppliers. Manufacturers (OEMs)
    would need to design, test and certify products to meet multiple sets of standards
    and regulations which would add costs, delay time to market and potentially deter
    global players from entering the Australian market.
