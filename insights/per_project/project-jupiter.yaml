- record_id: ARENA-DLV-34624
  source_title: Project Jupiter - Vision and Impact Pathway Report
  publish_date: 2025-08
  project_name: Project Jupiter
  what_happened: Project Jupiter is structured as a multi-party consortium project
    with clearly defined actor roles — Western Power as DSO, AEMO as DMO, Synergy
    as Parent Aggregator, and EPWA as Policy and Regulation Partner — with each partner
    committed to implementing foundational capabilities and supporting processes by
    January 2028. This role clarity was identified as a key enabler compared to the
    NEM, where the DNSP landscape increases complexity.
  lesson_learnt: Clearly defined and legislatively supported roles and responsibilities
    for DSO, DMO, and Parent Aggregator are a foundational prerequisite for DER orchestration
    commercialisation — the WEM's simpler market structure (single covered DNSP, single
    residential retailer) enabled role clarity that multi-DNSP markets like the NEM
    have not yet achieved, and NEM-based projects must resolve this governance prerequisite
    before commercialisation can proceed.
