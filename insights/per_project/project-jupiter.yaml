- record_id: ARENA-DLV-62134
  source_title: Project Jupiter - National Alignment Report
  publish_date: 2025-06
  project_name: Project Jupiter
  what_happened: The WEM's high penetration of rooftop solar has reduced operational
    demand, displaced synchronous generation, created distribution voltage management
    challenges, and — together with anticipated EV growth — is pushing distribution
    network capacity limits, requiring multiple system-level reforms including Emergency
    Solar Management and a Minimum Demand Service procurement.
  lesson_learnt: High rooftop solar penetration generates a cascade of system stability
    and network capacity challenges that cannot be resolved by a single intervention
    — programmes must coordinate across inverter standards, voltage management, synchronous
    generation displacement, demand services, and EV load management simultaneously.
    Jurisdictions approaching similar solar penetration levels should examine the
    WEM's reform sequence as a reference class for the breadth of interventions required.
  issue_severity: major
