  project_name: Project Jupiter
  what_happened: Project Jupiter identified that Stage 8 (Reflection and Retention)
    workforce training and development is not addressed by any explicit work package
    in the project, creating a risk that energy sector skills shortages become a barrier
    to achieving MRL 5 and sustaining DER orchestration at scale after project completion.
  lesson_learnt: DER orchestration commercialisation projects should include explicit
    workforce training and development work packages — omitting workforce capability
    building from scope creates a known gap that can prevent market readiness targets
    from being met, as the sector cannot scale operations without trained personnel.
