  what_happened: Project Symphony identified that customer participation models were
    too complex, with too many permutations of product and participation options,
    making it difficult for the aggregator to register new participants and for customers
    to make informed choices.
  lesson_learnt: VPP customer participation models should be simplified to reduce
    the number of product permutations — excessive complexity in participation options
    increases aggregator registration burden and reduces customer uptake; a streamlined
    model with clear opt-in pathways improves enrollment rates.
