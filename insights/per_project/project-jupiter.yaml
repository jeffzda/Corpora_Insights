- record_id: ARENA-DLV-62115
  source_title: Project Jupiter - National Alignment Report
  publish_date: 2025-06
  project_name: Project Jupiter
  what_happened: Social licence emerged as a primary barrier to CER/VPP participation,
    with consumers resisting external control of their assets largely due to mistrust,
    and many consumers purchasing batteries specifically to pursue energy independence
    ('off-grid' mindset) rather than to participate in a collaborative VPP model.
  lesson_learnt: Consumer trust is a prerequisite for VPP recruitment at scale — programmes
    that do not invest in trust-building and education before recruitment will face
    a participation ceiling. The 'off-grid' mindset is particularly prevalent among
    battery purchasers and must be explicitly addressed in engagement strategies;
    framing VPP participation as enhancing rather than compromising energy independence
    is essential.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: stakeholder/land/community
