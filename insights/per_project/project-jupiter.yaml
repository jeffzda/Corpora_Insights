- record_id: ARENA-DLV-34617
  source_title: Project Jupiter - Vision and Impact Pathway Report
  publish_date: 2025-08
  project_name: Project Symphony
  what_happened: Project Encore, a nine-month follow-on to Project Symphony, was required
    to further demonstrate DER orchestration viability and to overcome cost, time,
    and scope trade-offs uncovered in Symphony. A key outcome — Reserve Capacity market
    participation — was not achieved in Project Symphony itself and was only established
    through Encore.
  lesson_learnt: DER orchestration pilots should explicitly plan for a bridge or extension
    phase between demonstration and commercialisation — Project Symphony could not
    achieve Reserve Capacity participation within its original scope, requiring a
    separate nine-month project (Encore) to establish this commercially critical outcome
    before a full commercialisation project could be launched.
