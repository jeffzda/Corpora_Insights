- record_id: ARENA-DLV-63565
  source_title: Australian Hydrogen Centre State-Wide Blending Studies - Summary Report
  publish_date: null
  project_name: Hydrogen Park South Australia (HyP SA)
  what_happened: HyP SA's strong community engagement outcomes — including 95% positive or neutral community appeal, 76% satisfaction with communications, and 3,000+ site visitors — directly enabled an
    expansion decision to supply up to 5% renewable hydrogen to an additional 3,000 customers in Mitchell Park, Clovelly Park and parts of Marion, including households, businesses and schools.
  lesson_learnt: Community engagement investment in a first-of-a-kind hydrogen blending demonstration directly unlocks expansion approvals — projects that invest in transparent, measurable community sentiment
    tracking (longitudinal surveys, public events, visible community assets like artwork) are better positioned to secure expansion decisions than those that rely on assumed acceptance.
  issue_severity: none
  project_type: null
  project_scale_band: utility/large-scale
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: no material delay stated
  failure_mode: no major failure stated
  outcome_class: follow-on scale-up enabled
  secondary_failure_mode: null
  intervention_note: AGIG's longitudinal community research program from October 2020 to June 2022 demonstrated sustained positive sentiment, which provided the evidence base to support the expansion to
    3,000 additional customers.
  transferability: broad
  delay_magnitude: null
  technology_domain: hydrogen
  source_pages: &id004
  - 9
  evidence_excerpt: These strong engagement outcomes have paved the way for HyP SA's expanded delivery of up to 5% renewable hydrogen (by volume) to an additional 3,000 customers in Mitchell Park, Clovelly
