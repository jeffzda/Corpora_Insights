- record_id: ARENA-DLV-63552
  source_title: Australian Hydrogen Centre State-Wide Blending Studies - Summary Report
  publish_date: null
  project_name: Hydrogen Park South Australia (HyP SA)
  what_happened: HyP SA's electrolyser demonstrated real-time response to NEM pricing signals, harnessing negative electricity prices on a mild sunny day (18 October 2022) to produce 218.8 kg of hydrogen
    at a weighted average price of -$195.31/MWh, and automatically shutting off blending during periods of very low network demand.
  lesson_learnt: Designing hydrogen electrolysers to automatically respond to NEM price signals — producing during low or negative price periods and curtailing during peak demand — can materially reduce
    hydrogen production costs and avoid constraining the electricity grid; this operational flexibility should be built into electrolyser control systems from the outset.
