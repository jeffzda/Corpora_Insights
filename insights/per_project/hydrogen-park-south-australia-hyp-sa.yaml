- record_id: ARENA-DLV-63553
  source_title: Australian Hydrogen Centre State-Wide Blending Studies - Summary Report
  publish_date: null
  project_name: Hydrogen Park South Australia (HyP SA)
  what_happened: On a cold winter peak demand day (21 July 2022), HyP SA's electrolyser utilised a short window of low-to-negative midday electricity pricing to produce 41.4 kg of hydrogen at a weighted
    average price of $11/MWh, without further constraining the electricity grid during morning and evening peak periods when spot prices reached $473/MWh.
  lesson_learnt: Electrolysers co-located with gas networks can provide electricity grid services by shifting load away from peak periods — this sector-coupling benefit should be quantified and presented
    to grid operators and regulators as part of the project value case, and control systems should be configured to exploit intra-day price windows even in winter.
