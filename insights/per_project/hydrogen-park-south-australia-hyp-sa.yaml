  source_title: Australian Hydrogen Centre State-Wide Blending Studies - Summary Report
  publish_date: null
  project_name: Hydrogen Park South Australia (HyP SA)
  what_happened: Network testing at HyP SA confirmed that hydrogen blended into natural gas mixes uniformly throughout the existing network and does not cause network leaks, validating the technical feasibility
    of blending in the existing distribution infrastructure.
  lesson_learnt: Physical network testing of hydrogen blending behaviour — including leak testing and mixing uniformity — should be conducted at an operational demonstration site before committing to state-wide
    rollout; HyP SA results provide a replicable evidence base for regulatory approvals in other jurisdictions.
