  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects - First Edition Results'
  publish_date: '2015'
  project_name: Residential Demand Management (Energex)
  what_happened: Energex's residential demand management program evolved from pilots trialling multiple technologies and delivery models into a business-as-usual offering for approximately 40,000 customers,
    achieving planned demand reduction targets using AS4755-compliant air-conditioner control, controlled hot water systems, and energy-efficient pool pumps.
  lesson_learnt: Piloting demand management technologies in selected areas before broad rollout allows offerings to be refined for take-up rates and technical viability — Energex successfully transitioned
    from trial to BAU by iterating on customer research, demographic targeting, and technology selection before scaling.
