- record_id: ARENA-DLV-14983
  source_title: 'Looking Forward: Barriers, Risks and Rewards of the Australian Geothermal
    Sector to 2020 and 2030'
  publish_date: 2014-06
  project_name: Australian Geothermal Sector – International Collaboration Gap
  what_happened: The Australian geothermal sector had limited systematic international
    collaboration for technology transfer and knowledge exchange, despite the existence
    of international frameworks (IPGT, IEA-GIA) and the high relevance of overseas
    EGS experience — particularly on reservoir stimulation — to Australia's technical
    challenges.
  lesson_learnt: For technologies at early demonstration stage, structured secondments
    and knowledge transfer from more advanced overseas programs can accelerate domestic
    capability development at a fraction of the cost of independent R&D; ARENA-funded
    geothermal programs should require international collaboration components and
    fund researcher secondments to active EGS projects overseas.
