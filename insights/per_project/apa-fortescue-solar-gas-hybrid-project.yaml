- record_id: ARENA-DLV-6453
  source_title: 'Fortescue Alinta Solar Gas Hybrid Project: Lessons Learnt: Inception
    to Financial Close'
  publish_date: '2020-04-27'
  project_name: Fortescue Alinta Solar Gas Hybrid Project (Chichester Solar-Gas Hybrid)
  what_happened: The project network is isolated and outside the National Electricity
    Market (NEM), meaning many NEM performance requirements, thresholds and risks
    did not apply. EPC contractors, financiers, funding proponents and due diligence
    providers were not always aware of these differences, creating confusion and additional
    explanation burden.
  lesson_learnt: For off-grid or non-NEM projects, explicitly document in the Principal's
    Project Requirements how network performance standards differ from NEM requirements
    — EPC contractors, financiers and due diligence providers will otherwise apply
    NEM assumptions, causing confusion and rework.
  issue_severity: minor
  project_type: generation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: coordination & stakeholders
  intervention_note: Alinta specified NEM differences explicitly in the PPR and ensured
    they were clearly applied in system studies, and communicated these differences
    directly to EPC contractor, financiers and due diligence providers.
  transferability: moderate
  delay_magnitude: null
  technology_domain: hybrid systems
  source_pages: &id003
  - 11
  evidence_excerpt: In networks outside of the National Electricity Market (NEM),
    which will often be supplying mining loads, many of the performance requirements,
    thresholds and risks related to the NEM do not apply. The EPC contractor, financiers
    and other stakeholders including the funding proponents and due diligence providers
    must be made aware of these differences. The PPR must specify these differences
    and they should be clearly applied in the system studies.
  confidence_note: null
  source_url: https://arena.gov.au/knowledge-bank/report-lessons-learnt-inception-to-financial-close/
