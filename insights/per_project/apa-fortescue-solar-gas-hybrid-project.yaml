- record_id: ARENA-DLV-53003
  source_title: Alinta Fortescue Design and Construction Lessons Learnt
  publish_date: 2022-01
  project_name: Fortescue Alinta Solar Gas Hybrid Project (Chichester Solar Gas Hybrid
    Project)
  what_happened: EPC designers initially failed to appreciate design constraints imposed
    by the brownfield mining environment — particularly infrastructure layout around
    existing operations and land tenure boundaries. In one case the choice between
    overhead and underground lines near the Cloudbreak Power Station was not resolved
    early enough, with overhead lines later identified as restricting future crane
    access.
  lesson_learnt: When constructing new infrastructure in or near operational mining
    assets, ensure all operator requirements and tenure constraints are captured and
    incorporated into the concept design phase — changes at this stage are low-cost,
    whereas changes after design freeze carry significant time and cost penalties.
  issue_severity: moderate
  project_type: generation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Requirements and constraints from the mine operator were subsequently
    embedded in the EPC Principal Project Requirements and validated through staged
    HAZOP and design review processes.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id046
  - 15
  evidence_excerpt: One key challenge faced by the designers was in attaining an appreciation
    of design constraints, particularly the layout of new infrastructure in and around
    existing mining operations and having due regard for tenure constraints... Where
    new infrastructure is in the vicinity of operational assets, understanding the
    operators concerns and requirements from the outset is important so that design
