  what_happened: Fine dust particles from the adjacent mining operations caused excessive
    fouling of the Power Conversion Station (PCS) filters, requiring a weekly filter
    change and extended cleaning at monthly outages — a maintenance burden not accounted
    for in the original forecast. A project to install an improved filtration system
    on the 12 PCS units was approved and scheduled for completion by June 2025.
  lesson_learnt: For solar farms co-located with active mining operations, PCS filter
    specifications and maintenance intervals must be redesigned for high-dust environments;
    standard filter designs and maintenance cycles are inadequate and an improved
    filtration system should be incorporated at the design stage rather than retrofitted
    during operations.
