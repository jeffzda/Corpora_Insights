  source_title: Alinta Fortescue Design and Construction Lessons Learnt
  publish_date: 2022-01
  project_name: Fortescue Alinta Solar Gas Hybrid Project (Chichester Solar Gas Hybrid
    Project)
  what_happened: Alinta's initial approach to supplementing its project management
    team used a third-party consultancy providing project management services at arm's
    length. This model proved sub-optimal due to insufficient integration between
    Alinta's internal team and the consultant representatives, particularly for a
    complex brownfield site with numerous simultaneous interfaces.
  lesson_learnt: For complex brownfield infrastructure projects, directly recruit
    and embed project management personnel as a unified cross-functional team rather
    than engaging external consultants at arm's length — embedded teams share corporate
    culture, responsibilities and physical workspace, resulting in far better collaboration
    and issue resolution than arm's-length consultant models.
