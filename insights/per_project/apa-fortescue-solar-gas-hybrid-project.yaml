  what_happened: Alinta did not initially plan to engage a full-time on-site Health
    and Safety Representative, relying instead on periodic audits and three rotating
    site representatives. Once the number of work fronts and activities expanded,
    it became evident that a full-time on-site H&S Representative was necessary. Incidents,
    hazards and near misses were recorded and investigated across three separate organisations'
    management systems, creating duplication of effort.
  lesson_learnt: For projects undertaken within active mining sites with multiple
    work fronts, engage at least one full-time site-based HSE specialist from first
    mobilisation through to completion of physical works — the complexity of mining
    tenure, legislation and multi-party safety systems creates a workload that cannot
    be adequately covered by rotating or part-time arrangements.
