  what_happened: The 35 MW / 11.4 MWh Newman BESS successfully responded to cloud-induced
    solar generation drops in less than one minute, providing up to 20.7 MW of support
    during events where solar output fell by up to 39 MW (80% of generation) at rates
    exceeding 25 MW/min. The BESS demonstrated clear correlation between clouding
    events at the solar farm and rapid dispatch of stored energy to maintain network
    stability, reducing reliance on thermal spinning reserve.
  lesson_learnt: A co-located BESS can effectively substitute for thermal spinning
    reserve in a remote microgrid with high solar penetration, provided its output
    capacity is sufficient for the dominant range of ramp events — the Chichester
    BESS demonstrated sub-minute response times and materially reduced fuel consumption,
    validating the solar-battery-gas hybrid architecture for remote mining microgrids.
