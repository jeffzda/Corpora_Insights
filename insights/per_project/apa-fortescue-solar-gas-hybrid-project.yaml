- record_id: ARENA-DLV-6457
  source_title: 'Fortescue Alinta Solar Gas Hybrid Project: Lessons Learnt: Inception
    to Financial Close'
  publish_date: '2020-04-27'
  project_name: Fortescue Alinta Solar Gas Hybrid Project (Chichester Solar-Gas Hybrid)
  what_happened: Obtaining all statutory and regulatory approvals (mining licences,
    mining proposal approval, native vegetation clearance permits, integrated regional
    electricity licences, and native title agreement) took over a year after traditional
    owner approvals were received, consuming significant time and resources before
    financial close could be achieved.
  lesson_learnt: Allow over a year after traditional owner approvals are received
    to obtain all statutory and regulatory approvals required for financial close
    on remote renewable energy projects in WA — the process involves multiple overlapping
    tenures (mining lease, pastoral lease, native title) and is resource-intensive.
  issue_severity: major
  project_type: generation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: approvals/contracting
  proponent_type: utility/energy retailer
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: coordination & stakeholders
  intervention_note: Alinta leveraged its existing strong relationship with the Nyiyaparli
    traditional owners to finalise the native title agreement, and conducted detailed
    assessment of tenure types to optimise the approval timeline.
  transferability: moderate
  delay_magnitude: 1-3 years
  technology_domain: solar PV
  source_pages: &id007
  - 13
  - 14
  evidence_excerpt: Significant time and resources are required to obtain the statutory
    and regulatory approvals. It may take over a year, after approvals from traditional
    owners are received, to obtain all necessary regulatory approvals required for
    the financial close of a project.
