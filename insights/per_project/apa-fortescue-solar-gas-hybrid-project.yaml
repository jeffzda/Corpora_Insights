  what_happened: 'The 35 MW BESS was able to fully absorb only approximately 41–43%
    of clouding events exceeding 30 MW across three years of operation (Year 1: 43.3%,
    Year 2: 41.4%, Year 3: 41.2%). The remaining 56–59% of significant clouding events
    required thermal generation dispatch because the BESS capacity (35 MW) was insufficient
    to cover solar losses exceeding 35 MW.'
  lesson_learnt: When sizing a BESS for solar smoothing in a remote microgrid, the
    battery must be sized to cover the full range of expected clouding event magnitudes,
    not just average events; a 10 MW increase to 45 MW would extend BESS coverage
    to approximately 80% of clouding events and substantially reduce thermal spinning
    reserve requirements.
