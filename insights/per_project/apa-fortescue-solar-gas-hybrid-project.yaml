- record_id: ARENA-DLV-6451
  source_title: 'Fortescue Alinta Solar Gas Hybrid Project: Lessons Learnt: Inception
    to Financial Close'
  publish_date: '2020-04-27'
  project_name: Fortescue Alinta Solar Gas Hybrid Project (Chichester Solar-Gas Hybrid)
  what_happened: System studies for the complex isolated Pilbara network required
    extensive iterative modelling across multiple scenarios to verify compliance with
    technical rules and customer PPA requirements. The studies consumed significant
    time and resources and needed to be completed before investment decisions could
    be finalised.
  lesson_learnt: Conduct system studies using an accurate, calibrated model with multiple
    scenarios early in project development — study outputs directly inform investment
    decisions, EPC contract scope, equipment specifications and guaranteed performance
    parameters, and inadequate or delayed studies cause rework across all subsequent
    phases.
  issue_severity: moderate
  project_type: generation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: data/validation/testing
  failure_mode: data & measurement
  outcome_class: delayed but recoverable
  secondary_failure_mode: poor scoping
  intervention_note: Alinta developed a reliable network model augmented with project-specific
    data and ran it iteratively across multiple scenarios including voltage control,
    frequency control, black start, and load rejection before finalising EPC contract
    requirements.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hybrid systems
  source_pages: &id001
  - 9
  - 10
  - 11
  - 12
  evidence_excerpt: System studies should be conducted with an accurate, reliable
    and calibrated system model with simulation of multiple scenarios for understanding
    of the static and transient performance of the system... System studies for a
    complex system requires deployment of skilled resources and may be of prolonged
    duration as multiple scenarios need to be simulated in an iterative process. The
    studies should have adequate budget and allowance for sufficient time for completion
    of the studies.
  confidence_note: delay_category of data/validation/testing used as the studies were
    the primary source of timeline pressure in the development phase.
