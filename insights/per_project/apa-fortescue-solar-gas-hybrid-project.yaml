- record_id: ARENA-DLV-35707
  source_title: Alinta Fortescue Solar Gas Hybrid Project Lessons Learnt Commissioning
    and Testing Phase
  publish_date: 2022-08
  project_name: Chichester Solar Gas Hybrid Project
  what_happened: The trigger point for transfer of control of high voltage electrical
    assets from the contractor to Alinta Operations was clearly defined — control
    transferred as soon as a potential for energisation existed, with air-gaps closed
    as late as possible. This clarity enabled the contractor to work safely under
    their own health and safety systems until the last possible moment.
  lesson_learnt: Define and communicate unambiguously to all parties the exact trigger
