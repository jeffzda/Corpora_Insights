  intervention_note: ARENA and NAIF provided concessional funding and commissioned
    independent benchmarking of Pilbara energy prices and a market analysis of alternative
    off-takers for years 10+, enabling NAIF to take the view that other users would
    take energy from the project infrastructure after the Fortescue PPA.
  transferability: moderate
  delay_magnitude: not quantified
