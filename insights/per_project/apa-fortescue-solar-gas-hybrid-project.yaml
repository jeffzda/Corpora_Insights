- record_id: ARENA-DLV-50653
  source_title: Alinta - Alinta Fortescue Solar Gas Hybrid Project - Annual Performance
    Report
  publish_date: 2023-09
  project_name: Chichester Solar Gas Hybrid Project
  what_happened: The original project forecast did not adequately account for active
    power curtailment of the solar farm during low network loading periods. Thermal
    generators have minimum load requirements and cannot be rapidly cycled, forcing
    the solar farm to reduce output to maintain system stability. Curtailment losses
    ranged from 31 MWh (June) to 2,587 MWh (November) in a single month. Commissioning
    of a new 60 MW gas reciprocating engine at Newman Power Station in late 2022 required
    additional significant solar curtailment not included in the original forecast.
  lesson_learnt: Energy yield forecasts for solar farms integrated into hybrid microgrids
    must model active power curtailment constraints associated with thermal plant
    minimum load requirements, and must account for potential curtailment during commissioning
    of co-located thermal assets — both were omitted from the original forecast and
    resulted in significant generation losses.
