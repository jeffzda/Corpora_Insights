- record_id: ARENA-DLV-53023
  source_title: Alinta Fortescue Design and Construction Lessons Learnt
  publish_date: 2022-01
  project_name: Fortescue Alinta Solar Gas Hybrid Project (Chichester Solar Gas Hybrid
    Project)
  what_happened: Solar panels installed on the single-axis tracking system were left
    in a near-horizontal position for many months while the remainder of the solar
    farm was completed. In the Pilbara — where there is little or no rain from March
    to November — dust from nearby unsealed roads and the Christmas Creek ore processing
    facility (approximately 1km away) accumulated and became thick, caked-on deposits
    on the panels, requiring significant cleaning before capacity testing.
  lesson_learnt: During solar farm construction in arid or dusty environments, angle
    installed panels at a near-vertical orientation rather than horizontal until they
    are operable — horizontal panels accumulate significantly more dust, and without
    regular rain to self-clean, this can create a substantial cleaning burden before
    commissioning capacity tests.
  issue_severity: minor
  project_type: generation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: construction/installation
  proponent_type: utility/energy retailer
  delay_category: commissioning/integration
  failure_mode: execution & logistics
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Panels were cleaned before capacity testing; the EPC Contractor
    was required to perform a capacity test on clean panels to achieve the required
    performance metric.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id066
  - 30
  - 31
  evidence_excerpt: During construction, the panels were Installed at close to a horizontal
    position and this is how they remained for many months while the remainder of
    the solar farm was completed. When in a horizontal position, the panels tend to
    collect a significant amount of dust over time... A practical suggestion to reduce
    the amount of dust collecting on the solar panels during the construction phase,
    is to ensure that they are angled at a near vertical orientation until operable.
