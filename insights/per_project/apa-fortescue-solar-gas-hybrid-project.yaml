  project_name: Chichester Solar Gas Hybrid Project
  what_happened: The 35MW/11.4MWh Newman BESS, sized as a virtual spinning reserve
    rather than for load shifting, was insufficient to handle cloud cover events exceeding
    its 35MW capacity, meaning some thermal generation remained necessary to maintain
    system stability during larger solar reduction events.
  lesson_learnt: Size the BESS to handle at least 95% of cloud cover events by both
    output and energy delivery to completely avoid thermal backup during solar operation
    — a BESS sized only for spinning reserve will require thermal generation for larger
    cloud events and limits the achievable renewable penetration.
