- record_id: ARENA-DLV-53001
  source_title: Alinta Fortescue Design and Construction Lessons Learnt
  publish_date: 2022-01
  project_name: Fortescue Alinta Solar Gas Hybrid Project (Chichester Solar Gas Hybrid
    Project)
  what_happened: All three separable portions of the project were materially delayed.
    Separable Portion 1 (Christmas Creek Mine) was due 1 December 2020 but achieved
    EPC Practical Completion on 18 June 2021 — approximately 6.5 months late. Separable
    Portion 2 (Cloudbreak Mine) was due 10 April 2021 but achieved EPC Practical Completion
    31 August 2021 — approximately 4.5 months late. The Solar Farm was due 14 May
    2021 but achieved EPC Practical Completion 5 December 2021 — approximately 6.5
    months late.
  lesson_learnt: Account for COVID-19 pandemic impacts, inclement weather and unknown-unknown
    risk events when scheduling remote, complex brownfield projects — these contributed
    to material delays across all three separable portions, and a robust contingency
    strategy and 'deeper dive' risk workshops are essential to anticipate cost-at-completion
    trajectory.
