- record_id: ARENA-DLV-50651
  source_title: Alinta - Alinta Fortescue Solar Gas Hybrid Project - Annual Performance
    Report
  publish_date: 2023-09
  project_name: Chichester Solar Gas Hybrid Project
  what_happened: The initial energy yield forecast assumed 99% solar farm availability
    (inverter uptime) for the life of the system, but actual availability during the
    first year ranged from 78% to 99% monthly, with inverter downtime causing losses
    of up to 2,570 MWh in a single month. Routine maintenance, improved safety procedures
    requiring PCS isolation, weekly filter changes due to fine dust, and recurring
    inverter faults all contributed to lower-than-forecast uptime.
  lesson_learnt: Forecast models for remote solar farms in dusty environments must
    use realistic inverter availability figures — accounting for scheduled maintenance
    outages (weekly and monthly), dust-related filter changes, and a fault-repair
    allowance — rather than assuming 99% uptime; a figure closer to 97% is more appropriate
    based on first-year experience at Chichester.
  issue_severity: major
  project_type: generation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: partial success
  secondary_failure_mode: null
  intervention_note: The OEM worked with Alinta Energy to rectify recurring inverter
    faults during the first operating period, and availability trended upward toward
    an expected steady-state of approximately 97%.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages:
  - 7
  - 10
  - 11
  - 23
  - 29
  - 30
  evidence_excerpt: Solar farm uptime was forecast to be 100% for the year zero, and
    99% for years 1 to 25... Operating Year 3 had an annual availability of 95.7%
    compared with year 2's 97.1% and year 1's 87.5%... These routines were not accounted
