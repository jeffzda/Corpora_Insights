  what_happened: The Pilbara summer regularly exceeded 40°C in the shade with high
    humidity and flies, causing a measurable decline in worker productivity. Heat
    and fatigue management required deliberate intervention strategies and a documented
    Hot Working Plan.
  lesson_learnt: For construction in remote, hot-climate environments such as the
    Pilbara, develop and implement a robust Heat Management Plan including early start/early
    finish schedules, regular rest breaks, distributed ice and temporary shading —
    and explicitly allow for the productivity decline that will occur during summer
    regardless of mitigation measures.
