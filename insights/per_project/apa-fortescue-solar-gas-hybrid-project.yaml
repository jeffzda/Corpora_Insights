  publish_date: 2023-09
  project_name: Chichester Solar Gas Hybrid Project
  what_happened: Inverter derating due to high ambient temperatures was a known design
    characteristic accounted for in the original forecast, but the extent of derating
    at Chichester — where average temperatures regularly exceed 35°C for November
    through April — reduced renewable penetration and increased thermal generation
    during peak summer months. Inverters derate progressively above 35°C, with the
    capacity reduction directly affecting solar power production because reactive
    power requirements are fixed.
  lesson_learnt: For solar farms in extremely hot arid climates, inverter thermal
    derating should be modelled conservatively using site-specific temperature profiles
    rather than nominal ratings — the fixed reactive power obligation at the site
    means any thermal derating directly reduces active power output, compounding the
    impact on renewable yield.
