    required during operation of the Chichester Solar Farm. First-year data showed
    that during low-irradiance months with no rainfall, soiling accumulated to levels
    requiring cleaning to maximise production, and the site was not set up with the
    infrastructure to facilitate efficient machinery-based washing.
  lesson_learnt: Even when mechanical panel washing is not expected to be routinely
    necessary, solar farms in arid or dusty environments should be designed and constructed
    with washing infrastructure (access paths, water supply points) in place from
    the outset, so that cleaning can be efficiently deployed if soiling exceeds forecast
    levels.
