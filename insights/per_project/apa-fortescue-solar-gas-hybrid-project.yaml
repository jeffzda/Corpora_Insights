  delay_category: internal governance/resourcing
  failure_mode: coordination & stakeholders
  outcome_class: re-scoped/adapted
  secondary_failure_mode: execution & logistics
  intervention_note: Alinta identified that direct recruitment of personnel on fixed-term
    contracts or labour hire (fully embedded in the team) is the better model for
    complex brownfield projects; this was applied progressively during the project.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id052
  - 19
  - 20
  evidence_excerpt: The engagement model proved to be sub-optimal with insufficient
