- record_id: ARENA-DLV-57403
  source_title: Fortescue APA Solar Gas Hybrid Project Annual Performance Report 2023
  publish_date: 2024-02
  project_name: Chichester Solar Gas Hybrid Project
  what_happened: Inverter availability in Year 1 was 87.5%, significantly below the
    99% forecast used in the energy yield model. The shortfall was caused by technical
    faults requiring OEM intervention, unaccounted-for weekly and monthly maintenance
    shutdowns, and extended cleaning cycles driven by fine dust particles from the
    mining site.
  lesson_learnt: Energy yield forecasts for solar farms in mining environments must
    include realistic inverter downtime assumptions that account for dust-driven maintenance
    frequency — a 99% uptime assumption is unachievable where weekly filter changes
    and extended cleaning cycles are operationally necessary.
