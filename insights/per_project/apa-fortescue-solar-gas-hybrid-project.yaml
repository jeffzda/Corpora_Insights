  publish_date: '2020-04-27'
  project_name: Fortescue Alinta Solar Gas Hybrid Project (Chichester Solar-Gas Hybrid)
  what_happened: Fortescue would only commit to a 10-year PPA for the project, while
    the transmission, substation and solar assets have a design life of 25 years.
    This mismatch meant the commercial return structure could not recover full capital
    investment within the contracted term, making it difficult to obtain commercial
    bank financing.
  lesson_learnt: Mining off-takers typically forecast only 10 years ahead, creating
    a structural mismatch with the 20–25 year life of renewable energy assets — projects
    must either secure concessional funding to bridge the bankability gap or obtain
    independent evidence of alternative off-take prospects for post-PPA years before
    commercial financiers will participate.
