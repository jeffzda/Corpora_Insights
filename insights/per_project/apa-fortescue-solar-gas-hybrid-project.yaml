  project_name: Chichester Solar Gas Hybrid Project
  what_happened: The combined effect of soiling losses, inverter downtime, and active
    power curtailment — none of which were adequately modelled in the original forecast
    — caused the solar farm to consistently underperform against the forecast energy
    yield in most months of Years 1 and 2, despite exceeding forecast in December
    2023 under optimal conditions.
  lesson_learnt: Energy yield forecasting for solar farms in remote industrial environments
    must incorporate realistic combined loss factors — soiling, inverter downtime,
    and curtailment — rather than treating each in isolation or optimistically. Failure
    to do so produces a forecast that systematically overstates expected generation
    and underplans for operational interventions.
