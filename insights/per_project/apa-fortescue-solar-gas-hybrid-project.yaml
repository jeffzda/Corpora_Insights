  what_happened: The project represents the first large-scale renewable energy deployment
    in both a low-inertia grid and a remote mining operation in Australia, integrating
    60MW AC solar PV, lithium-ion batteries, diesel reciprocating engines and gas
    turbines across five physically distributed locations. The extraordinary integration
    and commissioning complexity placed extraordinary demand on the engineering and
    resourcing teams.
