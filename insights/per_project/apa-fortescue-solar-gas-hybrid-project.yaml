- record_id: ARENA-DLV-35705
  source_title: Alinta Fortescue Solar Gas Hybrid Project Lessons Learnt Commissioning
    and Testing Phase
  publish_date: 2022-08
  project_name: Chichester Solar Gas Hybrid Project
  what_happened: During Solar Farm commissioning hold point testing, a minimum level
    of spinning reserve was maintained at the Newman Power Station to manage the risk
    of sudden solar generation loss. This strategy was effective for network security
    but resulted in inefficient gas use — more gas turbines operated at low output
    than would otherwise be the case, with inefficiency increasing as Solar Farm output
    rose.
  lesson_learnt: Plan explicitly for the spinning reserve gas use penalty during solar
    farm hold point testing in remote/island grid contexts — the higher the tested
    solar output, the greater the spinning reserve requirement and associated fuel
    inefficiency; this cost should be budgeted and scheduled accordingly.
  issue_severity: minor
