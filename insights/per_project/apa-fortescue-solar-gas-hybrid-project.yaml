  project_name: Fortescue Alinta Solar Gas Hybrid Project (Chichester Solar Gas Hybrid
    Project)
  what_happened: The EPC Contractor's schedule covered only its own contractual scope.
    Alinta recognised this limitation and built a master schedule incorporating long-lead
    procurement, permit obligations, integration activities, interface milestones
    and commissioning/testing activities outside the EPC scope. However, maintaining
    this master schedule proved challenging due to inaccurate contractor schedule
    data, vast numbers of activities, the resource intensity of updates and inefficiencies
    in transferring site information to off-site schedulers.
  lesson_learnt: Do not rely solely on the EPC contractor's schedule — develop and
    maintain a master schedule that integrates all project activities including procurement,
    approvals, integration and commissioning outside EPC scope; embed schedulers on-site
    or establish reliable real-time data feeds from site to maintain accuracy.
