- record_id: ARENA-DLV-53016
  source_title: Alinta Fortescue Design and Construction Lessons Learnt
  publish_date: 2022-01
  project_name: Fortescue Alinta Solar Gas Hybrid Project (Chichester Solar Gas Hybrid
    Project)
  what_happened: Once construction assets were electrically connected to the Alinta
    network and transferred to operations, all remaining EPC Contractor completion
    works required permits issued by the Operations team. This became a significant
    drain on operations resources and slowed close-out works.
  lesson_learnt: Defer the transfer of assets from construction to operations as late
    as reasonably practicable, and ensure that defects, omissions and incomplete works
    are minimised before handover — once assets are under operations' safe systems
    of work, every outstanding construction task requires an operations-issued permit,
    creating a compounding resource burden on the operations team.
  issue_severity: moderate
  project_type: generation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: commissioning/integration
  proponent_type: utility/energy retailer
  delay_category: commissioning/integration
  failure_mode: coordination & stakeholders
  outcome_class: delayed but recoverable
  secondary_failure_mode: execution & logistics
  intervention_note: The project team used a staged asset-by-asset handover approach
    requiring sign-off by both the Head of Construction and Head of Operations before
    each asset was transferred.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id059
  - 25
  evidence_excerpt: Once Operations took control of an asset, the Operations team
    became responsible to managing and controlling any works under their safe systems
    of works. This means that any completion works required to be done by the EPC
    Contractor required permits issued by the Operation teams, which is a significant
    drain on resources. For this reason, it is beneficial that the transfer to operations
    be done as late as reasonably practicable.
