  what_happened: Quality issues during construction led to rework and remediation,
    which impacted schedule and had a demoralising effect on the workforce. Inadequate
    timeliness in checking and signing off quality documentation also created backlogs
    that delayed energisation approvals.
  lesson_learnt: Ensure a comprehensive Quality Assurance Plan is in place with sufficient
    resources to implement it fully, and establish a systematic process for issuing
    and approving quality documentation as works are completed — delays in compiling
    quality records can directly block energisation approvals and create schedule-critical
    bottlenecks.
