- record_id: ARENA-DLV-6454
  source_title: 'Fortescue Alinta Solar Gas Hybrid Project: Lessons Learnt: Inception
    to Financial Close'
  publish_date: '2020-04-27'
  project_name: Fortescue Alinta Solar Gas Hybrid Project (Chichester Solar-Gas Hybrid)
  what_happened: The project was located on an active mine site in the Pilbara. Most
    Australian EPC contractors with solar farm and high-voltage transmission capability
    lacked direct experience working in active mining areas and were unfamiliar with
    the Mines Safety and Inspection Act (WA), creating capability gaps and compliance
    risk.
  lesson_learnt: For projects on active mine sites, select an EPC contractor with
    demonstrated experience operating under the Mines Safety and Inspection Act (WA)
    and clearly articulate all mining-specific safety requirements in the PPR — contractors
    experienced only in non-mining construction will have different management systems,
    risk profiles and minimum standards.
  issue_severity: moderate
  project_type: generation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: approvals/contracting
  proponent_type: utility/energy retailer
  delay_category: procurement/supply chain
  failure_mode: coordination & stakeholders
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Alinta incorporated Mines Safety and Inspection Act requirements
    explicitly in the PPR and made mining-area experience a key criterion in EPC contractor
    selection.
  transferability: narrow
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id004
  - 10
  - 12
  evidence_excerpt: Many of the Australian EPC contractors with capability in the
    construction of high voltage transmission infrastructure and particularly of large-scale
    solar farms, do not have direct experience working in an active mining area...
    The selection of an EPC contractor experienced in construction under Mines Safety
    and Inspection Act is beneficial to the project. The requirements of the relevant
    safety legislation should be clearly articulated in the PPR.
  confidence_note: null
