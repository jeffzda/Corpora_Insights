  publish_date: 2023-09
  project_name: Chichester Solar Gas Hybrid Project
  what_happened: The EPC contract energy yield test was structured such that all unplanned
    outages were excused from the contractor's performance obligation, meaning the
    contractor bore no risk for unplanned downtime events. This was identified retrospectively
    as a flaw in the contract design that allowed the contractor to meet the guaranteed
    yield metric despite underperformance attributable to equipment reliability.
  lesson_learnt: EPC energy yield performance tests for solar farms should carefully
    distinguish between outages within the contractor's control and those genuinely
    outside it — a blanket exclusion of all unplanned outages removes contractor accountability
    for equipment reliability and renders the performance guarantee ineffective as
    a quality assurance mechanism.
