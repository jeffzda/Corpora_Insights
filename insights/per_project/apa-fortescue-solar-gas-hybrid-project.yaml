- record_id: ARENA-DLV-6464
  source_title: 'Fortescue Alinta Solar Gas Hybrid Project: Lessons Learnt: Inception
    to Financial Close'
  publish_date: '2020-04-27'
  project_name: Fortescue Alinta Solar Gas Hybrid Project (Chichester Solar-Gas Hybrid)
  what_happened: Gas pipeline transportation agreements were structured for predictable
    daily volumes with fixed Maximum Daily Quantities and Maximum Hourly Quantities
    and narrow imbalance tolerance bands. The intermittent nature of solar generation
    introduced variability between nominated and actual gas usage that could trigger
    punitive imbalance charges, a structural incompatibility that standard gas shipper
    contracts did not accommodate.
  lesson_learnt: Identify gas pipeline imbalance provisions early when structuring
    renewable-gas hybrid projects — standard shipper contracts with fixed MDQ/MHQ
    and narrow imbalance bands are incompatible with intermittent solar generation,
    and will need to be modified or supplemented by backup generation arrangements
    to avoid punitive charges.
  issue_severity: moderate
  project_type: generation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: approvals/contracting
  proponent_type: utility/energy retailer
  delay_category: financing/commercial close
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: The parties agreed on arrangements allowing use of existing diesel
    generation at customer facilities to mitigate gas imbalance; Alinta noted that
    standard shipper contracts will need to be modified in future to permit greater
    intermittent renewable penetration into the mining sector.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hybrid systems
  source_pages: &id014
  - 20
  - 21
  evidence_excerpt: Gas pipeline transport agreements are designed for relatively
    predictable daily volumes... Solar impacts – Where actual solar generation is
    markedly different than forecast this can lead to quite large differences between
    nominated and actual gas transportation requirements... If the imbalance is sufficiently
    large it could lead to additional charges being incurred for authorised overruns
    or unauthorised overruns where the charges are quite punitive... the standard
    shipper contracts in the future will need to be modified so as to permit greater
    intermittent renewable penetration into the mining sector.
