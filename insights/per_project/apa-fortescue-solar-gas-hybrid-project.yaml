  what_happened: Many Australian EPC contractors capable of constructing HV transmission
    infrastructure and large-scale solar farms do not have direct experience working
    in an active mining area, where management systems, risk profiles and minimum
    standards are materially different from agricultural or other industrial settings.
  lesson_learnt: When selecting an EPC contractor for renewable energy projects within
    active mine sites, explicitly assess their experience with mining-specific safety
    legislation, management systems and risk profiles — a capable renewables contractor
    without mining experience will require significant additional oversight and compliance
    management by the principal.
