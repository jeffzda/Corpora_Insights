- record_id: ARENA-DLV-53008
  source_title: Alinta Fortescue Design and Construction Lessons Learnt
  publish_date: 2022-01
  project_name: Fortescue Alinta Solar Gas Hybrid Project (Chichester Solar Gas Hybrid
    Project)
  what_happened: Alinta self-procured main transformers and high-voltage switchgear
    (long lead items) ahead of EPC Contract award to take these items off the critical
    path. This strategy proved effective, especially as the primary vendor faced COVID-related
    delays in China. The EPC Contractor similarly front-loaded procurement of all
    major items including tower steelwork, cabling, piles, solar panels and inverters.
  lesson_learnt: For remote energy projects with long supply chains, early procurement
    of long-lead items such as main transformers and HV switchgear is an effective
    strategy for taking critical-path risk off the schedule — particularly where international
    supply disruption is a foreseeable risk.
