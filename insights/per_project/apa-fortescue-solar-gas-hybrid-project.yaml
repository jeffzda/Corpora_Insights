  publish_date: '2020-04-27'
  project_name: Fortescue Alinta Solar Gas Hybrid Project (Chichester Solar-Gas Hybrid)
  what_happened: Generator Performance Requirements (GPR) were not determined early
    enough in the project, creating uncertainty about equipment compliance with technical
    rules and causing rework in network system studies and EPC contract scope and
    pricing.
  lesson_learnt: Determine Generator Performance Requirements early in the project
    — late definition creates uncertainty in EPC scope and pricing, forces rework
    in system studies, and risks selecting equipment that does not comply with technical
    rules.
