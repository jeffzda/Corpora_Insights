- record_id: ARENA-DLV-53025
  source_title: Alinta Fortescue Design and Construction Lessons Learnt
  publish_date: 2022-01
  project_name: Fortescue Alinta Solar Gas Hybrid Project (Chichester Solar Gas Hybrid
    Project)
  what_happened: Construction activities on this project spanned three types of land
    tenure — Alinta-only Crown licence, Fortescue-only Crown licence, and shared Alinta/Fortescue
    Crown licence. The obligations on the EPC Contractor varied by tenure type, with
    Fortescue tenure areas requiring the EPC Contractor to submit work methodologies
    and Team Based Risk Assessments (TBRAs) to Fortescue and conduct walk-downs before
    works could proceed. Clarity on tenure boundaries was not always established before
    works commenced.
  lesson_learnt: For projects spanning multiple tenure types on active mine sites,
    map and communicate all tenure boundaries and the corresponding safety and work-method
    obligations to the EPC Contractor before mobilisation — uncertainty about which
    regime applies at a given location causes delays and compliance risk.
  issue_severity: moderate
  project_type: generation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: construction/installation
  proponent_type: utility/energy retailer
  delay_category: stakeholder/land/community
  failure_mode: coordination & stakeholders
  outcome_class: delayed but recoverable
  secondary_failure_mode: poor scoping
  intervention_note: Alinta added a lesson to obtain clarity on mining interface areas
    and tenure areas before works commence, and embedded compliance monitors at interface
    points.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
