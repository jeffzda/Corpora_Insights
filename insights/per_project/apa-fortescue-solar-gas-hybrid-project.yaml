  what_happened: A Site Services Agreement was negotiated with Fortescue to supply
    accommodation, amenities access, road access, radio communications, potable water,
    wastewater removal, fuel, medical emergency services and road maintenance for
    the solar farm. This arrangement delivered site services at a lower incremental
    cost than Alinta procuring the same services directly, reducing long-term O&M
    costs.
  lesson_learnt: When developing new electricity infrastructure to supply a mine site,
    negotiate a Site Services Agreement with the mine operator covering accommodation,
    utilities, road access and emergency services — the mine operator can typically
    provide these services at a fraction of the standalone cost, materially reducing
    ongoing O&M expenditure.
