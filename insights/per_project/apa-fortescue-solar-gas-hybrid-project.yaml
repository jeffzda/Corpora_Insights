  what_happened: Non-site-based Alinta management received calls and emails from site
    throughout weekends because site works continued seven days per week, providing
    no effective rest days. This resulted in manager fatigue and unsustainable workloads
    at critical periods in the project.
  lesson_learnt: Implement a formal weekend rostering arrangement for non-site-based
    management — for example, rotate one manager onto a weekend shift every four weeks
    with time-in-lieu, or deploy two site-based Construction Managers to absorb weekend
    site queries — so that office-based managers can properly rest.
