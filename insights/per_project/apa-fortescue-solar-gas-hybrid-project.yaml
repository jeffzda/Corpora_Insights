  what_happened: 'Clouding events at the Chichester Solar Farm caused rapid solar
    generation losses of up to 60 MW across all three years of operation (Year 1:
    647 events >30 MW; Year 2: 524 events; Year 3: 608 events), with some events occurring
    at rates exceeding 25 MW/min. This required maintaining continuous thermal spinning
    reserve, preventing the project from achieving its goal of operating solely on
    solar with battery backup.'
  lesson_learnt: When sizing a BESS for solar smoothing in a remote microgrid, the
    BESS output capacity must be matched to the realistic distribution of cloud-induced
    generation ramp events — modelling showed that a 10 MW increase (to 45 MW) would
    raise the proportion of clouding events fully covered by renewables from 43% to
    approximately 80%, reducing thermal spinning reserve requirements substantially.
