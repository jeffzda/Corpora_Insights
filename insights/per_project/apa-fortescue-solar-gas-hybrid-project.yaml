  - 26
  - 27
  evidence_excerpt: It would be useful to have an agreed term sheet detailing all
    terms and conditions for ARENA funding early in the process and to progressively
    develop the detailed funding agreement. Focus should be given to ARENA's standard
    requirements, particularly where they differ to a corporate's typical debt obligations.
