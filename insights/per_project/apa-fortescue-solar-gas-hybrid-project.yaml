- record_id: ARENA-DLV-6463
  source_title: 'Fortescue Alinta Solar Gas Hybrid Project: Lessons Learnt: Inception
    to Financial Close'
  publish_date: '2020-04-27'
  project_name: Fortescue Alinta Solar Gas Hybrid Project (Chichester Solar-Gas Hybrid)
  what_happened: Developing the commercial and contractual structure for the project
    was complex due to the interplay between new solar supply arrangements and existing
    contracts, the intermittent nature of solar, and the requirement for firm dispatchable
    generation from Newman Power Station. A significant amount of effort was required
    to develop a contract structure satisfying all three parties involved.
  lesson_learnt: Agree early in commercial negotiations which party bears the risk
    of solar intermittency — determining whether the generator or customer takes run-of-solar
    risk simplifies subsequent contract structuring and avoids protracted negotiation
    on downstream commercial arrangements.
  issue_severity: moderate
  project_type: generation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: approvals/contracting
  proponent_type: utility/energy retailer
  delay_category: financing/commercial close
  failure_mode: coordination & stakeholders
  outcome_class: delayed but recoverable
  secondary_failure_mode: commercial & market
  intervention_note: Parties agreed that Alinta bears risk on solar field availability
    while Fortescue takes the risk on solar irradiance levels, resolving the intermittency
    risk allocation early in negotiations.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hybrid systems
  source_pages: &id013
  - 19
  - 20
  evidence_excerpt: It proved to be of great benefit for the parties to agree early
    in the negotiations who takes risk on the intermittency of solar generation. Whilst
    an annual solar yield and maximum solar output can be provided with some degree
    of certainty, especially in the Pilbara, the day to day impacts of cloud cover
    can have significant impacts on the amount of gas generation required. In this
    case it was agreed that Alinta bears risk of the availability of the solar field,
    Fortescue took the risk on the solar irradiance levels.
