  what_happened: It would have been beneficial to agree a term sheet detailing all
    ARENA funding terms and conditions early in the process and then progressively
    develop the detailed funding agreement; this did not occur, contributing to a
    challenging period between PPA and EPC contract execution and the required financial
    close date.
  lesson_learnt: Agree an early term sheet covering all ARENA funding terms and conditions
    before or concurrent with the PPA and EPC contracts — progressive development
    of the detailed agreement from an agreed term sheet provides all parties clarity
    on obligations and expectations, enabling more efficient financial close.
