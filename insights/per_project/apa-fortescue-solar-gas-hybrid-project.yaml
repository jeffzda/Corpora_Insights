- record_id: ARENA-DLV-53004
  source_title: Alinta Fortescue Design and Construction Lessons Learnt
  publish_date: 2022-01
  project_name: Fortescue Alinta Solar Gas Hybrid Project (Chichester Solar Gas Hybrid
    Project)
  what_happened: The transmission line design had to ensure that conductors remained
    within Alinta's land tenure even under maximum design wind sway conditions. Transformer
    fire zone extents also had to be checked against tenure boundaries, not just existing
    structures — a fire zone extending beyond tenure could limit future development
    on adjacent land.
  lesson_learnt: Validate that all new infrastructure — including dynamic envelopes
    such as conductor sway under design wind and fire zones around transformer bunded
    areas — sits within the correct tenure under all design conditions; failure to
    do so can require costly redesign or constrain future land use.
  issue_severity: minor
  project_type: generation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Design validation was incorporated into the EPC Principal Project
    Requirements to ensure tenure compliance was checked under all design conditions.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id047
  - 15
  evidence_excerpt: Of critical importance was ensuring that all new infrastructure
