  source_title: Alinta - Alinta Fortescue Solar Gas Hybrid Project - Annual Performance
    Report
  publish_date: 2023-09
  project_name: Chichester Solar Gas Hybrid Project
  what_happened: Inverter availability at CHSF required weekly shutdowns for inspection
    and monthly inspection and cleaning routines that had not been accounted for in
    the initial performance forecast. Fine dust particles on site extended the duration
    of outages — requiring weekly filter changes and extended cleaning at monthly
    intervals — contributing to inverter availability well below the 99% assumption,
    with some months as low as 78–79%.
  lesson_learnt: O&M planning and energy yield forecasting for solar inverters in
    dusty remote environments must explicitly account for the frequency and duration
    of mandatory maintenance routines (weekly, monthly) and the impact of dust on
    filter change intervals — failure to do so will materially overstate expected
    annual generation and understate O&M resource requirements.
