  what_happened: The feasibility study identified that the LGC regime — used as a
    proxy for green credits to ensure grid-sourced electricity maintains low emissions
    intensity — is due to expire in 2030, creating an unresolved green certificate
    availability risk for a project expected to commence operations around 2029–2030.
  lesson_learnt: Green hydrogen projects relying on grid firming must resolve their
    post-2030 green certificate strategy before FID — the scheduled expiry of LGCs
    creates a material gap in the additionality framework, and alternative mechanisms
    must be identified and contracted to maintain the project's green hydrogen credentials
    and compliance with offtake requirements.
