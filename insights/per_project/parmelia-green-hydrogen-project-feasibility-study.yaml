  source_title: Parmelia Green Hydrogen Project Feasibility Study - Summary Report
  publish_date: 2024-10
  project_name: Parmelia Green Hydrogen Project (PGH2)
  what_happened: The cooling system design adopted a 35°C ambient air temperature
    (95th percentile of exceedance for the three hottest months) as the design basis
    for air coolers, in consultation with the Bureau of Meteorology — a decision that
    materially affects capital cost for the electrolyser cooling system.
  lesson_learnt: Air cooler design temperature selection for hydrogen electrolysis
    facilities should be based on verified local meteorological data at the 95th percentile
    exceedance for peak summer months — using a conservative or generic design temperature
    without site-specific validation risks either significant cost over-design or
    cooling performance failures during peak production periods.
