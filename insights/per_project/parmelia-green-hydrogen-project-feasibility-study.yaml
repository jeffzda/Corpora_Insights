- record_id: ARENA-DLV-45755
  source_title: Parmelia Green Hydrogen Project Feasibility Study - Summary Report
  publish_date: 2024-10
  project_name: Parmelia Green Hydrogen Project (PGH2)
  what_happened: The electrical load requirements for the HPF are too large for connection
    to existing 132 kV transmission lines, requiring construction of a new greenfield
    330 kV terminal substation rather than tying into existing 330 kV assets — because
    connecting to existing assets added cost and complexity.
  lesson_learnt: Large-scale electrolytic hydrogen facilities should be sited with
    proximity to 330 kV (or equivalent high-voltage) transmission infrastructure as
    a primary selection criterion; sites reliant only on 132 kV access are likely
    to require costly voltage upgrades, and greenfield substation construction may
    be preferable to cut-in connections to existing high-voltage assets.
