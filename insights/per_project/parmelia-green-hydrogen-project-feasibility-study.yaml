  source_title: Parmelia Green Hydrogen Project Feasibility Study - Summary Report
  publish_date: 2024-10
  project_name: Parmelia Green Hydrogen Project (PGH2)
  what_happened: The study found that economies of scale in the HPF reduce capital
    intensity from $4.87m/MW (base, 200 MWe) to $4.02m/MW (large, 900 MWe), with the
    most significant LCOH cost savings of approximately $1/kg occurring between the
    base and expansion cases rather than between expansion and large cases.
  lesson_learnt: For staged hydrogen projects, the largest unit cost reduction from
    economies of scale occurs at the first expansion step, not at maximum scale —
    business case analysis should model the break-even point between staged and single-stage
    development to determine whether accelerating to the expansion case earlier captures
    sufficient savings to justify the additional upfront capital.
