  publish_date: 2024-10
  project_name: Parmelia Green Hydrogen Project (PGH2)
  what_happened: The study identified that government support through grants, subsidies,
    and tax credits will be required to narrow the cost gap between green hydrogen
    and grey hydrogen, as the LCOH of $9.80–$11/kg at $80/MWh electricity is substantially
    above the cost of existing grey hydrogen supply, making the project commercially
    marginal without policy support.
  lesson_learnt: FOAK green hydrogen projects at current cost levels require government
    support mechanisms to be commercially viable — project business cases should be
    structured to explicitly model the impact of grants, production credits, and tax
    incentives on LCOH, and project sponsors should engage with government funding
    programs in parallel with project development rather than treating them as contingent.
