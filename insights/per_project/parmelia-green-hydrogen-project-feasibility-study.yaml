  source_title: Parmelia Green Hydrogen Project Feasibility Study - Summary Report
  publish_date: 2024-10
  project_name: Parmelia Green Hydrogen Project (PGH2)
  what_happened: Power optimisation modelling found that operating the HPF at 70%
    turndown (variable mode) with hydrogen storage increased LCOH by 18%, because
    lower turndown ratios require increased electrolyser capacity and larger hydrogen
    storage.
  lesson_learnt: Variable/turndown operation of large electrolysers is not inherently
    cost-beneficial — if pursued to capture low-price grid periods, the capital cost
    penalty of oversized electrolysers and storage must be explicitly quantified and
    may outweigh electricity savings, increasing LCOH by up to 18%.
