  source_title: Parmelia Green Hydrogen Project Feasibility Study - Summary Report
  publish_date: 2024-10
  project_name: Parmelia Green Hydrogen Project (PGH2)
  what_happened: One of four candidate HPF sites (Site 3) was eliminated from detailed
    assessment because it overlapped environmentally sensitive areas — native vegetation
    across 25% of the site, 1-in-100 year flood risk across 50% of the site, and a
    conservation-classified geomorphic wetland — making it unsuitable to accommodate
    the HPF.
  lesson_learnt: Environmental and flood constraints can eliminate candidate industrial
    hydrogen facility sites entirely; GIS-based multi-criteria analysis including
    native vegetation, flood zones, and wetland classifications should be applied
    as a pass/fail screen before committing to detailed geotechnical or engineering
    studies on any site.
