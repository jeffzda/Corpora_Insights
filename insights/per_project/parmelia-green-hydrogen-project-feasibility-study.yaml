- record_id: ARENA-DLV-45751
  source_title: Parmelia Green Hydrogen Project Feasibility Study - Summary Report
  publish_date: 2024-10
  project_name: Parmelia Green Hydrogen Project (PGH2)
  what_happened: The feasibility study found that electricity price and HPF capital
    intensity are the two dominant LCOH drivers, together accounting for approximately
    84 per cent of total LCOH (43% and 41% respectively), and that both have increased
    significantly over the 12 months since the pre-feasibility study was completed.
  lesson_learnt: For large-scale green hydrogen projects, electricity price and electrolyser/HPF
    capital cost must be stress-tested continuously throughout development — material
    escalation in either parameter within a single study cycle can shift LCOH from
    bankable to unviable, requiring iterative sensitivity analysis at each project
    gate.
