  what_happened: The study found that the optimal power mix for the base-case HPF
    is 38% wind, 27% solar, and 35% grid firming with green credits, rather than a
    fully renewable off-grid configuration, because reliance on grid firming reduces
    the capital cost of generation overbuild while green certificates maintain additionality
    claims.
  lesson_learnt: Green hydrogen projects in markets with grid firming availability
    should model hybrid generation-plus-grid configurations rather than assuming 100%
    renewable self-supply — a grid-firmed configuration with green credits can be
    lower cost than full renewable overbuild, and the optimal split should be determined
    through dynamic power optimisation modelling.
