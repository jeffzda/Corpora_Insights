- record_id: ARENA-DLV-45752
  source_title: Parmelia Green Hydrogen Project Feasibility Study - Summary Report
  publish_date: 2024-10
  project_name: Parmelia Green Hydrogen Project (PGH2)
  what_happened: The Class 4 HPF cost estimate produced capital intensity of $4.87m/MW
    (base case) to $4.02m/MW (large case), significantly higher than the Gencost benchmark
    of $2m/MW, resulting in LCOH of $9.80–$11/kg at $80/MWh electricity — well above
    levels typically considered commercially viable for green hydrogen offtake into
    existing industrial processes.
  lesson_learnt: Project-specific Class 4 cost estimates for hydrogen production facilities
    are materially higher than published benchmarks such as Gencost; teams should
    not rely on generic benchmarks for investment decisions and must obtain OEM-level
    budgetary pricing early to establish a credible cost basis.
