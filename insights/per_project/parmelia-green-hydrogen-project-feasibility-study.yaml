- record_id: ARENA-DLV-45756
  source_title: Parmelia Green Hydrogen Project Feasibility Study - Summary Report
  publish_date: 2024-10
  project_name: Parmelia Green Hydrogen Project (PGH2)
  what_happened: Power optimisation modelling showed that incorporating battery energy
    storage systems (BESS) into the power mix increases LCOH — by 6% for 1-hour BESS
    and 21% for 4-hour BESS — driven by high associated capital costs, making BESS
    uneconomic in the current cost environment.
  lesson_learnt: BESS should not be assumed as a cost-reducing firming option for
    large green hydrogen projects at current capital costs — modelling should explicitly
    test BESS inclusion and exclusion, as the additional capex is likely to outweigh
    operational savings and increase LCOH materially.
