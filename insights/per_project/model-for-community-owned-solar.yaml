- record_id: ARENA-DLV-7607
  source_title: 'Model for Community-Owned Solar - Lessons Learnt Report: Community
    Owned Solar (Stage 2)'
  publish_date: null
  project_name: City of Campbelltown, A Model for Community Owned Solar
  what_happened: The community solar financial model was found to be highly sensitive
    to self-consumption rate — investor returns dropped from approximately 8% to 3.5%
    when in-house solar usage fell from 100% to 75%, and were further severely compressed
    at lower energy tariffs (16 c/kWh vs 35 c/kWh).
  lesson_learnt: Community solar models must be stress-tested across a range of self-consumption
    rates and tariff scenarios before being presented to investors or councils — the
    difference between 100% and 75% in-house use, or between energy-only and demand
    tariffs, can halve or eliminate investor returns and fundamentally change project
    bankability.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id005
  - 4
  evidence_excerpt: a $500 investor could expect a return of about 8% if 100% of PV
    is used in house and about a 3.5 % return if just 75 % of solar is used in-house
    and the rest exported... with a 16 c/kWh council energy tariff the project would
    need to charge the council about 26 c/kWh for PV electricity in order to get a
    3.5% return for investors with 100 % in-house usage.
