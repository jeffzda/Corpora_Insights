- record_id: ARENA-DLV-7602
  source_title: 'Model for Community-Owned Solar - Lessons Learnt Report: Community
    Owned Solar (Stage 2)'
  publish_date: null
  project_name: City of Campbelltown, A Model for Community Owned Solar
  what_happened: A change in South Australian electricity supply rules (SAPN tariff
    reform requiring demand tariffs for customers installing solar above 100A capacity)
    was not factored into the project plan, forcing a revision to the community solar
    model after final council endorsements were nearly complete. SAPN declined to
    grant exemptions for community projects.
  lesson_learnt: Regulatory and tariff change risk must be explicitly identified and
    planned for in community energy project schedules — engaging the local distributor
    early and seeking exemptions does not guarantee protection, so the model and business
    case should be stress-tested against plausible tariff reform scenarios before
    final documentation is prepared.
