- record_id: ARENA-DLV-7601
  source_title: 'Model for Community-Owned Solar - Lessons Learnt Report: Community
    Owned Solar (Stage 2)'
  publish_date: null
  project_name: City of Campbelltown, A Model for Community Owned Solar
  what_happened: The time required to assess over 70 buildings across nine councils
    to find suitable pilot sites for the community solar model was significantly underestimated,
    leading to the project manager (Monica Oliphant Research) contributing all site
    assessment work on a voluntary basis.
  lesson_learnt: If community solar is to be self-sufficient, professional services
    for site assessment and administration must be explicitly acknowledged and costed
    in the original project budget — underestimating this work forces the project
    team to absorb costs voluntarily or risk project failure.
