- record_id: ARENA-DLV-7604
  source_title: 'Model for Community-Owned Solar - Lessons Learnt Report: Community
    Owned Solar (Stage 2)'
  publish_date: null
  project_name: City of Campbelltown, A Model for Community Owned Solar
  what_happened: A pipeline of at least five sites was required to amortise the set-up
    and ongoing administration costs of the community solar program, making the model
    unviable with fewer sites. This structural dependency was not apparent until Stage
    3 piloting began.
  lesson_learnt: Community solar programs structured around shared set-up and administration
    costs require a minimum pipeline of sites (at least five in this case) to be financially
    viable — project planners should confirm that a sufficient pipeline is available
    and committed before incurring governance, legal, and administration establishment
    costs.
