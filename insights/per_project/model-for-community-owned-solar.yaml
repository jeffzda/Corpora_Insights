  secondary_failure_mode: coordination & stakeholders
  intervention_note: Legal, accounting, and tax advisers were engaged and the Rules
    of a Trading Cooperative and Draft Disclosure documentation were prepared, filling
    knowledge gaps albeit at significant expense.
  transferability: moderate
