  evidence_excerpt: Final Council endorsements were being obtained when a change in
    electricity supply rules in South Australia forced a revision to the model. This
    risk had not been factored into the project plan and while MOR had briefed the
    local Distributor, SAPN, and asked for exemptions from changes for community projects,
    this was not agreed to, leading to further loss of time, a change in building
    criteria and expensive revisions to the model.
