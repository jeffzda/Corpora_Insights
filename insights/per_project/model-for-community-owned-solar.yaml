  intervention_note: MOR prepared a brief to revise the model to accommodate demand
    tariff sites and incorporated energy efficiency initiatives to reduce council
    maximum demand, expanding the potential site pool while adapting to the new tariff
    regime.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages:
