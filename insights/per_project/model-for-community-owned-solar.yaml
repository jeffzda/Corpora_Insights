- record_id: ARENA-DLV-7605
  source_title: 'Model for Community-Owned Solar - Lessons Learnt Report: Community
    Owned Solar (Stage 2)'
  publish_date: null
  project_name: City of Campbelltown, A Model for Community Owned Solar
  what_happened: The complexity of identifying appropriate business and governance
    structures, restrictions around intellectual property, and the lack of understanding
    of community-owned solar among key partners — including councils — required expensive
    engagement of legal, accounting, and tax advisers that exceeded original budget
    assumptions.
  lesson_learnt: Community solar projects should budget explicitly for legal, accounting,
    tax, and governance advisory costs from the outset — these are not trivial line
    items, and the complexity of cooperative structures and IP arrangements in this
    domain will consume professional services budgets that cannot be recovered from
    project revenues alone.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
