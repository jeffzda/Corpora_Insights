- record_id: ARENA-DLV-19908
  source_title: Thermoelectric Generator for Concentrated Solar Thermal Systems
  publish_date: '2015-01-12'
  project_name: Development of a Thermoelectric Generator for Application in a CST
    Topping Cycle (2-A015)
  what_happened: The SASCS used a water-based thermal storage system, which required
    high-pressure safety systems and additional components to manage system pressure.
    The use of thermal salts or other storage media was identified post-build as a
    preferable alternative that could have reduced system complexity, surface area
    losses, and safety requirements.
  lesson_learnt: Solar thermal system designers should evaluate salt-based or alternative
    thermal storage media early in design — water-based storage at high temperatures
    imposes pressure-management complexity and safety requirements that increase cost
    and losses. Salt-based storage can reduce surface area, losses, and pressure-system
    components.
