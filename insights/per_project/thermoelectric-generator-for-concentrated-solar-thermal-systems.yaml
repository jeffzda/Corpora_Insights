  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: The second-generation receiver adopted two rectangular flat hot
    plates in a conventional parallel-plate configuration, enabling use of pre-constructed
    TEG modules and greatly simplifying installation.
  transferability: narrow
  delay_magnitude: null
  technology_domain: solar thermal
  source_pages: &id004
