- record_id: ARENA-DLV-19906
  source_title: Thermoelectric Generator for Concentrated Solar Thermal Systems
  publish_date: '2015-01-12'
  project_name: Development of a Thermoelectric Generator for Application in a CST
    Topping Cycle (2-A015)
  what_happened: The absorption chiller designed for the SASCS operated at a fixed
    temperature of 180°C. This narrow operating range meant the system could not begin
    cooling during startup or periods of lower irradiance when water temperature was
    below 180°C, reducing overall system utilisation.
  lesson_learnt: Absorption chillers for solar thermal cooling systems should be specified
    with a broad operating temperature range (e.g. 120–200°C) with minimal COP variation,
    to enable earlier system startup and better handling of variable solar conditions.
    This is a known knowledge gap that should be addressed in future system procurement.
