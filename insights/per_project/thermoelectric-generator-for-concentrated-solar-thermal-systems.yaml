- record_id: ARENA-DLV-19904
  source_title: Thermoelectric Generator for Concentrated Solar Thermal Systems
  publish_date: '2015-01-12'
  project_name: Development of a Thermoelectric Generator for Application in a CST
    Topping Cycle (2-A015)
  what_happened: The first-generation receiver used a parabolically curved hot plate
    to optimise illumination uniformity, but this geometry made installation of thermoelectric
    generator (TEG) elements laborious — requiring in-situ installation rather than
    modular assembly — and increased manufacturing complexity.
  lesson_learnt: For TEG-integrated solar receivers, a flat-plate hot-face geometry
    is strongly preferable to a curved geometry for practical manufacturability and
    modular TEG installation, even if the curved design offers marginally better illumination
    uniformity. Prioritise assembly practicality over theoretical optical optimisation
    at prototype stage.
