  - 13
  evidence_excerpt: Analysis via ray tracing showed that a parabolically curved solar
    radiation receiving plate (hot plate) provided the most uniform illumination across
    the surface, but created difficulties with respect to installation of thermo-electric
    generators (TEGs) between this and the correspondingly curved cooling plate. This
    necessitated a laborious in-situ installation of the TEG elements, rather than
