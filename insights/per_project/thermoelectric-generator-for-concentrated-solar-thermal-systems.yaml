  what_happened: System heating times were longer than the original design specification
    due to significant thermal losses in the superheated water piping and water storage
    tank. Standard insulation thicknesses were found to be inadequate, allowing an
    unacceptably high proportion of thermal losses.
  lesson_learnt: In solar thermal systems, thermal losses from high-temperature piping
    and storage tanks are a dominant efficiency constraint. Design specifications
    must treat insulation as a primary engineering variable — standard insulation
    thicknesses are insufficient — and system layouts should minimise high-temperature
    line lengths from the outset.
