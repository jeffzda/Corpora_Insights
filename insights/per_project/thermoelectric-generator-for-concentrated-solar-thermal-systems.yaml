- record_id: ARENA-DLV-19903
  source_title: Thermoelectric Generator for Concentrated Solar Thermal Systems
  publish_date: '2015-01-12'
  project_name: Development of a Thermoelectric Generator for Application in a CST
    Topping Cycle (2-A015)
  what_happened: During the design phase, no commercially available pump could meet
    the simultaneous requirements of high pressure (25 bar) and high temperature (200°C).
    Available pumps were either high-pressure/low-temperature or low-pressure/high-temperature,
    forcing a downward revision of process temperatures to 180°C to accommodate a
    suitable pump.
  lesson_learnt: Before finalising process design parameters for high-pressure, high-temperature
    solar thermal systems, verify commercial availability of pumps and other fluid-handling
    components that must operate across the combined pressure-temperature envelope
    — unverified assumptions about component availability can force design compromises
    late in development.
