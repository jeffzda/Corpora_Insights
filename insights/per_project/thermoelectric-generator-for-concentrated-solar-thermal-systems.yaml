  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Process temperatures were revised downward to 180°C to match
    the maximum operating rating of the best available commercial pump at 25 bar.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar thermal
  source_pages: &id003
  - 10
  - 11
  evidence_excerpt: It was found that a pump operating at high pressure and temperature
    (i.e. of the order of 25 Bar, and 200°C) was not commercially available. Standard
    pumps for water were either for high pressure, low temperature systems, or for
    low pressure, high temperature systems. Based on available pumps, the process
    temperatures were altered to allow the incorporation of a pump which operated
    at 25 bar at a maximum temperature of 180°C.
