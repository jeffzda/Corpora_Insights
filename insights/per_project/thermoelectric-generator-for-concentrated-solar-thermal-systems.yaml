  what_happened: The SASCS test bed was deliberately designed with flexibility for
    access and component assessment rather than compactness, resulting in longer high-temperature
    pipework and greater surface area on thermal storage — a deliberate trade-off
    during first-build that reduced system efficiency relative to a commercial configuration.
  lesson_learnt: For prototype solar thermal systems, the efficiency penalty of a
    flexibility-first layout should be explicitly quantified and documented so that
    subsequent commercial designs can revert to compact, short-piping configurations.
    Prototype design trade-offs should not be inherited by commercial successors without
    deliberate re-evaluation.
