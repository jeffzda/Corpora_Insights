- record_id: ARENA-DLV-19901
  source_title: Thermoelectric Generator for Concentrated Solar Thermal Systems
  publish_date: '2015-01-12'
  project_name: Development of a Thermoelectric Generator for Application in a CST
    Topping Cycle (2-A015)
  what_happened: The oxide thermoelectric materials developed during the project achieved
    a maximum thermal-to-electrical efficiency of approximately 3.5%, falling well
    short of the original project target of 5–10% (later stated as 7–10%). This fundamental
    materials performance gap limited the viability of the overall system concept.
  lesson_learnt: Oxide-based thermoelectric materials are reliable but their efficiency
    ceiling (~3.5%) is too low for high-performance solar topping-cycle applications.
    Future projects targeting efficiency-critical applications should evaluate higher-performing
    metalloid thermoelectric materials from the outset, accepting the additional complexity
    of a protective atmosphere.
