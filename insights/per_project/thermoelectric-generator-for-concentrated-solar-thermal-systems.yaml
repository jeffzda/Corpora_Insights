- record_id: ARENA-DLV-19910
  source_title: Thermoelectric Generator for Concentrated Solar Thermal Systems
  publish_date: '2015-01-12'
  project_name: Development of a Thermoelectric Generator for Application in a CST
    Topping Cycle (2-A015)
  what_happened: The project delivered a fully operational SASCS test bed at the CSIRO
    Energy Centre in Newcastle, operated for hundreds of hours, and produced seven
    peer-reviewed journal publications and three PhD candidates. The dish design proved
    robust and reliable for extended operation, and the 10 kW absorption chiller performed
    effectively. However, the system fell short of commercial viability due to thermoelectric
    efficiency limitations and unresolved thermal loss issues.
  lesson_learnt: A research-scale demonstration combining novel thermoelectric materials
    with solar thermal and absorption cooling can be successfully constructed and
    operated, providing a reusable test platform for subsequent technologies. Clearly
    separating research-scale success criteria (proof of concept, platform utility,
    knowledge generation) from commercial viability criteria avoids misrepresenting
    demonstration outcomes.
