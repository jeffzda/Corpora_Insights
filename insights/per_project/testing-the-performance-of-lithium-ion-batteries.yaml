- record_id: ARENA-DLV-10260
  source_title: Battery Test Centre Report 5
  publish_date: 2018-09
  project_name: Battery Test Centre
  what_happened: The Redflow ZCell battery pack suffered an electrolyte leak in May
    2018 caused by micro-cracking of the electrolyte tank during road transport, requiring
    replacement. This was the third replacement of the Redflow pack and the second
    due to an electrolyte leak. The replacement pack was not fully commissioned until
    September 2018 due to an undersized inverter, requiring a second Victron inverter
    to be installed in parallel.
  lesson_learnt: Zinc-bromide flow batteries with liquid electrolytes are vulnerable
    to transport damage — shipping protocols must include adequate lateral support
    for electrolyte trays, and inverter capacity should be confirmed against the required
    cycling rate before commissioning to avoid multi-month delays.
