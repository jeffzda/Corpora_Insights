  source_title: Battery Test Centre Report 5
  publish_date: 2018-09
  project_name: Battery Test Centre
  what_happened: The Sony Fortelion and Samsung Phase 1 packs demonstrated the slowest
    capacity fade of all Phase 1 batteries, having completed over 1,300 cycles with
    generally high reliability. The Powerwall 1 showed that reliable BMS performance
    — evidenced by low variance around the capacity trendline — is a meaningful predictor
    of consistent cycling data quality.
  lesson_learnt: Sony and Samsung NMC and LFP chemistries demonstrated superior longevity
    and reliability in high-cycle residential-scale testing — these products can serve
    as positive benchmarks in future procurement and technology selection assessments.
    High BMS quality, evidenced by low capacity-test variance, is a reliable signal
    of pack health.
