- record_id: ARENA-DLV-10261
  source_title: Battery Test Centre Report 5
  publish_date: 2018-09
  project_name: Battery Test Centre
  what_happened: The Tesla Powerwall 1 could only be controlled via a Solar Edge inverter
    and an online portal, and the charge/discharge rate could not be controlled. As
    a result it cycled at ~C/2 while other packs cycled at ~C/3, giving it less time
    to dissipate heat and contributing to faster capacity fade than other Phase 1
    packs. Cell temperature data was unavailable as Tesla does not expose this functionality.
  lesson_learnt: Battery packs that restrict external control of charge/discharge
    rate and do not expose cell temperature telemetry are unsuitable for rigorous
    performance testing or managed energy services — procurement criteria should require
    open control interfaces and accessible monitoring data.
