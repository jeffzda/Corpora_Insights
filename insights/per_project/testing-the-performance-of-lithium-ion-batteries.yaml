- record_id: ARENA-DLV-10257
  source_title: Battery Test Centre Report 5
  publish_date: 2018-09
  project_name: Battery Test Centre
  what_happened: The GNB Sonnenschein conventional lead-acid pack developed sulfation
    due to inability to achieve full charge under the test centre's accelerated cycling
    regime. SOC estimation by the SMA inverter became unreliable, frequently triggering
    low-voltage protection that prevented full discharge. Multiple equalisation charges
    failed to restore performance.
  lesson_learnt: Conventional lead-acid batteries require regular full charging to
    prevent sulfation, but their poor charge acceptance at high SOC makes this impractical
    in accelerated or high-utilisation cycling regimes — in solar-storage or test
    applications, either avoid lead-acid or significantly over-size the bank to allow
    shallow cycling only.
  issue_severity: major
  project_type: storage
  project_scale_band: demonstration
  lifecycle_phase: operations
