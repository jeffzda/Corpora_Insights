  publish_date: 2019-06
  project_name: Lithium Ion Battery Test Centre
  what_happened: Many battery packs installed in the Test Centre had to be removed
    or replaced prematurely owing to faults across both Phase 1 and Phase 2, with
    failures attributed to BMS deficiencies, cell imbalance, electrolyte leaks, SOC
    algorithm errors, and manufacturer insolvency.
  lesson_learnt: Independent battery testing programs should budget for a substantially
    higher than expected failure and replacement rate — the failure rate in this trial
    far exceeded expectations even accounting for the demanding cycling regime, indicating
    that early-market battery products carry significant reliability risk.
