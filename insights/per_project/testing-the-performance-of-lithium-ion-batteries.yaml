  what_happened: Round-trip efficiency across all battery packs in the trial (both
    lead-acid and lithium-ion) was broadly consistent, observed between 85–95% DC,
    while the Redflow ZCell zinc-bromide flow battery achieved a lower efficiency
    of approximately 78% as expected for that chemistry.
