  what_happened: The GNB nameplate capacity assumption used in Report 6 was found
    to be incorrect — the brochure/manual capacity differed from the actual nameplate
    on the battery, which aligned better with BMS diagnostic data. Correcting this
    assumption in Report 7 produced a lower apparent rate of capacity fade than previously
    reported.
