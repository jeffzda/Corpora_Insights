- record_id: ARENA-DLV-28402
  source_title: Report 6 Lithium Ion Battery Testing
  publish_date: 2019-06
  project_name: Lithium Ion Battery Test Centre
  what_happened: The Kokam StoraXe battery pack failed irreversibly in early November
    2016 when the BMS entered low-voltage protection mode and could not be restarted;
    during the week before ITP arrived to manually charge the pack, the BMS drained
    the remaining energy from the cells, causing them to over-discharge below the
    minimum recoverable voltage.
  lesson_learnt: Battery packs that enter low-voltage protection mode without a path
    to external recharging must be attended to immediately — leaving the BMS energised
    while awaiting manual intervention can drain remaining cell energy below the recovery
    threshold, resulting in irreversible damage.
