- record_id: ARENA-DLV-46815
  source_title: ITP Battery Test Centre Report 4
  publish_date: 2018-03
  project_name: ITP Battery Test Centre
  what_happened: Conventional lead-acid batteries demonstrated unsuitability for high-frequency
    cycling applications during the trial — sulfation accumulated during daily cycling
    that did not allow full daily charges, leading to permanent capacity degradation.
    Historically this shortcoming has been partially overcome by oversizing battery
    banks, which increases transport, installation, and hardware costs.
  lesson_learnt: Conventional lead-acid batteries should not be specified for daily
    cycling stationary storage applications — sulfation from incomplete daily charges
    causes permanent degradation, and the conventional workaround of oversizing adds
    substantial cost without resolving the fundamental technical limitation.
