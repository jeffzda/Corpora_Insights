  project_name: Lithium-Ion Battery Test Centre
  what_happened: The Kokam Storaxe battery pack suffered irreversible damage during
    Phase 1 testing due to improper low-voltage protection provided by the built-in
    Battery Management System (BMS), rendering it unable to be restarted.
  lesson_learnt: BMS low-voltage protection must be verified as adequate before deployment
    — a BMS that fails to protect against undervoltage can cause irreversible battery
    damage and total loss of the unit.
