- record_id: ARENA-DLV-10256
  source_title: Battery Test Centre Report 5
  publish_date: 2018-09
  project_name: Battery Test Centre
  what_happened: The EcoUlt UltraFlex pack was found in September 2017 to have had
    its BMS allowing cells to stray beyond minimum SOC limits for extended periods,
    accelerating capacity fade. EcoUlt replaced all batteries under warranty and updated
    the SOC algorithm. However, the replacement pack again lost capacity from May
    2018 due to over-discharging caused by incorrect SOC estimation under the test
    centre's unusual cycling regime.
  lesson_learnt: Advanced lead-acid batteries with BMS-based SOC estimation are particularly
    vulnerable to algorithmic errors under non-standard or accelerated cycling regimes
    — operators should work with manufacturers to validate SOC algorithms under the
    specific cycling conditions of the application, and should not assume warranty
    replacement resolves an underlying algorithmic fault.
  issue_severity: major
  project_type: storage
  project_scale_band: demonstration
  lifecycle_phase: operations
