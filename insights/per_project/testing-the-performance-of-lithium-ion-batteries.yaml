  publish_date: 2019-09
  project_name: Lithium-Ion Battery Test Centre
  what_happened: The GNB Lithium battery pack returned a 'Battery Internal Voltage
    Too High' error during diagnostic testing with GNB's proprietary software. GNB
    advised these were regular notifications rather than faults, yet capacity data
    showed cycles where available capacity was far above the average, suggesting intermittent
    faults limiting available capacity despite manufacturer reassurance.
