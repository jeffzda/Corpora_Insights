- record_id: ARENA-DLV-70757
  source_title: ITP Battery Test Centre Report 2
  publish_date: 2017-03
  project_name: ITP Battery Test Centre
  what_happened: The LG Chem lithium-ion pack showed the highest capacity fade rate
    of all packs under test. The pack has the highest energy density and no fans or
    coolant loops, causing it to operate at higher cell temperatures than other packs
    under the accelerated cycling regime. High cell temperatures accelerate irreversible
    side reactions that consume active cell materials and reduce capacity.
  lesson_learnt: High energy density lithium-ion packs without active thermal management
    are particularly vulnerable to accelerated capacity fade under high-cycling conditions;
    when selecting batteries for high-cycling applications, prioritise packs with
    active cooling or lower energy density designs, and do not assume that manufacturer
    capacity ratings under standard conditions will be achieved in thermally challenging
    real-world deployments.
