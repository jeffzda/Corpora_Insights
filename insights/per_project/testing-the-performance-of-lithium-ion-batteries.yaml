  source_title: ITP Battery Test Centre Report 4
  publish_date: 2018-03
  project_name: ITP Battery Test Centre
  what_happened: Widespread inconsistencies in state-of-charge (SOC) estimation across
    multiple battery packs from different manufacturers introduced significant variance
    into capacity test results throughout the trial, making it difficult to draw confident
    conclusions from individual data points.
  lesson_learnt: SOC estimation inaccuracy is a systemic issue across battery chemistries
    and BMS implementations; test programs and real-world projects should treat individual
    capacity measurements with caution and rely on long-term trend analysis rather
    than point-in-time results.
