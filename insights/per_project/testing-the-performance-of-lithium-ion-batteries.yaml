  publish_date: 2018-03
  project_name: ITP Battery Test Centre
  what_happened: The Ampetus SuperLithium pack constrained charge rates below the
    test centre's control system setpoints during commissioning in October 2017, attributed
    to BMS-inverter communication issues; the pack was returned to the manufacturer
    in Queensland for assessment and a firmware upgrade resolved the issue, with the
    pack returned mid-November 2017.
  lesson_learnt: BMS firmware compatibility with the site inverter must be confirmed
    before installation — communication mismatches that constrain charge rates can
    require the unit to be returned to the manufacturer for firmware remediation,
    causing multi-week delays.
