  source_title: Report 6 Lithium Ion Battery Testing
  publish_date: 2019-06
  project_name: Lithium Ion Battery Test Centre
  what_happened: At the time of Phase 1 installation, the distribution network and
    electrical installation regulatory service were unfamiliar with battery installations
    and had no standard approach, adopting a risk-averse stance that added friction;
    by Phase 2 they were more accommodating, and an Australian Standard for electrical
    installations with battery systems (AS/NZS 5139) was under development.
  lesson_learnt: Battery storage projects in jurisdictions without established grid
    connection and electrical regulatory frameworks for batteries should allow extra
    time for approvals and engage early with both the distribution network and the
    electrical installation regulator — regulatory familiarity and standards improve
    over time but the first projects in a region will face a non-standard approval
    process.
