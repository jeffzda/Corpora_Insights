  what_happened: The CALB lithium-ion pack exhibited erratic behaviour during commissioning,
    and ITP identified a weak cell with low capacity and high internal resistance
    that had to be replaced under warranty. After replacement, pack behaviour normalised
    through August–September 2016, but issues recurred shortly after, with the pack
    regularly cutting off charge/discharge cycles before maximum and minimum SOC setpoints
    were reached and showing significant current fluctuation in the final third of
    both charge and discharge cycles.
