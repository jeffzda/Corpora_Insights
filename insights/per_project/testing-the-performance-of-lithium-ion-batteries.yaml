- record_id: ARENA-DLV-69316
  source_title: Lithium Ion Battery Testing Public Report 9
  publish_date: 2020-09
  project_name: Lithium-Ion Battery Test Centre
  what_happened: A high number of battery packs installed across Phases 1 and 2 were
    removed or replaced prematurely due to faults, including failures from BMS undervoltage
    protection failures (Kokam), cell imbalance (BYD), SOC algorithm errors, electrolyte
    leaks (Redflow), insolvency of the manufacturer (Aquion, Ampetus), and overtemperature
    issues (Alpha ESS).
  lesson_learnt: In emerging battery storage markets, plan for a materially higher
    rate of premature failure and manufacturer exit than in mature technology markets
    — procurement strategies should include replacement pathways, and contracts should
    address manufacturer insolvency scenarios and ongoing technical support obligations.
