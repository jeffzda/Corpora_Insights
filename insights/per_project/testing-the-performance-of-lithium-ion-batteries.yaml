  publish_date: 2019-06
  project_name: Lithium Ion Battery Test Centre
  what_happened: The level of manufacturer support received during maintenance varied
    widely; in many cases ITP first noticed battery performance issues and raised
    them with the manufacturer, rather than the manufacturer proactively identifying
    and reporting the problems, raising concerns that residential customers without
    close monitoring would not detect issues for extended periods.
  lesson_learnt: Battery deployments — particularly residential — should not rely
    on manufacturer remote monitoring as the primary fault detection mechanism; independent
    monitoring systems that flag anomalies automatically are necessary to detect performance
    degradation before it causes irreversible damage or extended periods of reduced
    output.
