  source_title: Lithium Ion Battery Testing Public Report 3
  publish_date: 2017-11
  project_name: Lithium Ion Battery Test Centre
  what_happened: The Australian battery market experienced significant instability
    during the trial period, with manufacturers exiting the market or substantially
    changing product offerings, contributing to supply issues, integration problems,
    and commissioning failures across multiple battery products.
  lesson_learnt: Projects relying on emerging battery products should build in substantial
    supply-chain contingency and avoid single-source dependency — market instability
    in Australia caused delays, product withdrawals, and support failures across multiple
    vendors simultaneously.
