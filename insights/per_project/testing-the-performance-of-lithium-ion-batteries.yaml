- record_id: ARENA-DLV-28419
  source_title: Report 6 Lithium Ion Battery Testing
  publish_date: 2019-06
  project_name: Lithium Ion Battery Test Centre
  what_happened: Delays in battery availability and delivery were common, particularly
    for products entering the Australian market for the first time, disrupting the
    planned schedule in which all batteries would be installed within the same timeframe;
    battery shelf life and warranty start-date terms (some running from manufacture
    date rather than installation date) added further complexity.
  lesson_learnt: Procurement schedules for battery products entering new markets should
    carry substantial contingency for delivery delays — where multiple batteries must
    be installed together, a rolling commissioning approach with staggered delivery
    slots may be more realistic; always confirm whether warranties run from manufacture
    date or installation date, as manufacture-date warranties may expire before installation
    is complete.
