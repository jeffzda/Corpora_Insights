- record_id: ARENA-DLV-10254
  source_title: Battery Test Centre Report 5
  publish_date: 2018-09
  project_name: Battery Test Centre
  what_happened: The LG Chem RESU battery experienced persistent temperature de-rating
    under the trial's high charge/discharge rates and summer conditions, escalating
    to full battery shutdown with a high-temperature fault error in early 2018. The
    pack also shut down periodically at low SOC due to cell imbalance, slowing cycle
    accumulation and introducing significant variability in results.
  lesson_learnt: Battery packs without active cooling (fans or coolant loops) are
    susceptible to thermal de-rating and shutdown when subjected to high charge/discharge
    rates — system designers should account for thermal management requirements, especially
    in high-cycling or warm-climate applications.
