  publish_date: 2016-09
  project_name: ITP Battery Test Centre
  what_happened: The Sony Fortelion required specific proprietary DC power cables
    and communications cables with unique terminals that could only be ordered from
    Sony; failure to order the correct lengths and quantities at time of module procurement
    would prevent installation, as generic cable lugs could not be substituted.
  lesson_learnt: When procuring Sony Fortelion (or similarly proprietary rack-mounted
    battery systems), order all required proprietary cables — including correct lengths
    for the planned rack layout — at the same time as the battery modules; these cables
    cannot be sourced or fabricated generically and omitting them from the initial
    order will stall installation.
