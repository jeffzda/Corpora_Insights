- record_id: ARENA-DLV-58368
  source_title: Lithium Ion Battery Testing Report 7
  publish_date: 2019-09
  project_name: Lithium-Ion Battery Test Centre
  what_happened: The BYD B-Box battery pack showed a SOH of approximately 64% after
    ~1,740 cycles, with capacity fade appearing to accelerate and then decelerate.
    The deceleration coincided with a firmware update and BMU replacement in June
    and August 2019, suggesting the firmware/hardware change affected measured performance.
  lesson_learnt: Firmware updates and BMS hardware replacements during a battery test
    programme can alter measured capacity fade trajectories — document all such interventions
    precisely so that performance trend changes can be attributed correctly and not
    misinterpreted as intrinsic battery behaviour.
