  project_name: ITP Battery Test Centre
  what_happened: During the test programme period, both Samsung and Sony withdrew
    their residential energy storage products from the Australian market, while Tesla
    and LG Chem introduced second-generation products with significantly different
    specifications to those under test. This rapid market change occurred within approximately
    six months of the test centre commencing operations.
  lesson_learnt: Multi-year battery test programmes face the risk that products under
    test become commercially obsolete before the trial concludes; programme design
    should include provisions for adding new-generation products mid-trial (as ITP
    did by adding ten further batteries) and results should be framed as technology-class
    findings rather than product-specific endorsements to maintain relevance.
