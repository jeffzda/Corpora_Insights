  source_title: Lithium Ion Battery Testing Report 7
  publish_date: 2019-09
  project_name: Lithium-Ion Battery Test Centre
  what_happened: A high proportion of battery packs installed in the test centre were
    removed or replaced prematurely due to faults, including BMS failures, electrolyte
    leaks, cell swelling, commissioning failures, and manufacturer insolvency. These
    issues were attributed to the technology and market being in an early stage of
    maturity.
  lesson_learnt: Early-market battery products carry significantly elevated reliability
    and longevity risks — design test programmes and commercial deployments with contingency
    for premature unit replacement, and set realistic expectations for fault rates
    relative to manufacturer claims.
