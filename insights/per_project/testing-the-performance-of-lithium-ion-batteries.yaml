  what_happened: The Redflow ZCell was replaced four times during the trial — once
    due to contaminated electrolyte, twice due to micro-cracking of the electrolyte
    tank during road transport (insufficient side support), and once due to a manufacturing
    process defect (soap wash causing plastic brittleness).
  lesson_learnt: Flow batteries with liquid electrolyte are highly susceptible to
    transport-induced physical damage — specify and verify adequate packaging and
    transport support for electrolyte containment components, and treat repeated field
    failures from the same root cause as a systemic supply-chain risk requiring manufacturer
    escalation.
