  project_name: Lithium-Ion Battery Test Centre
  what_happened: Battery price reductions stalled in the period leading up to September
    2020, attributed to cell production constraints, increasing raw material costs
    (particularly cobalt), and a weakening Australian dollar, despite broader expectations
    of continuing price decline.
  lesson_learnt: Project cost models for battery storage should not assume continuous
    price decline — supply-side constraints (cell production capacity, raw material
    costs) and currency movements can arrest or reverse price trends, and contingency
    should be maintained in procurement budgets.
