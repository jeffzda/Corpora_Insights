  project_name: Lithium-Ion Battery Test Centre
  what_happened: Cycle life varied significantly between battery products tested,
    with linear extrapolation of capacity fade suggesting between approximately 1,360
    cycles (GNB Lithium) and 5,640 cycles (Sony Fortelion) to reach 60% SOH, representing
    a greater than fourfold difference in projected cycle life across the tested products.
