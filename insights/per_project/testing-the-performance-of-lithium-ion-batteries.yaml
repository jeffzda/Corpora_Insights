  what_happened: The Redflow ZCell was replaced four times during the trial — once
    for contaminated electrolyte and three times for electrolyte leaks, with leaks
    attributed first to micro-cracking during road transport (insufficient side support
    for electrolyte trays) and subsequently to a manufacturing defect involving soap
    residue causing plastic brittleness.
  lesson_learnt: Flow battery products require rigorous transport and manufacturing
    quality controls — electrolyte tank cracking due to inadequate transport support
    and manufacturing residue contamination are failure modes that should be explicitly
    addressed in procurement and logistics planning for flow battery deployments.
