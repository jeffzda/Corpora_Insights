  project_name: Lithium Ion Battery Test Centre
  what_happened: The accelerated cycling regime was found to be inherently disadvantageous
    for lead-acid battery technology compared to lithium-ion technology, as lead-acid
    batteries require slow full-charging to avoid sulfation, which the accelerated
    test regime could not accommodate.
  lesson_learnt: Comparative battery testing regimes should account for technology-specific
    charging requirements — a single regime optimised for lithium-ion cycling will
    inherently disadvantage lead-acid chemistries that require slow full charges to
    avoid sulfation, making like-for-like comparison invalid.
