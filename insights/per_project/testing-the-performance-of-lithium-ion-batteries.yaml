  source_title: Lithium Ion Battery Testing Report 7
  publish_date: 2019-09
  project_name: Lithium-Ion Battery Test Centre
  what_happened: Integration of battery packs with inverters was persistently problematic
    across both Phase 1 and Phase 2, with communications interface compatibility being
    the most common challenge. No standardised approach to battery-inverter communications
    existed at the time.
  lesson_learnt: The absence of standardised battery-inverter communication protocols
    is a systemic integration risk — project teams should anticipate commissioning
    delays and budget for compatibility resolution until interoperability standards
    are established across the market.
