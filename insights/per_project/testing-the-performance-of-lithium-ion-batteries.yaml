  source_title: Report 6 Lithium Ion Battery Testing
  publish_date: 2019-06
  project_name: Lithium Ion Battery Test Centre
  what_happened: The Ecoult UltraFlex battery pack's BMS was found to be allowing
    cells to stray beyond their minimum SOC limits, accelerating capacity fade; after
    replacement under warranty and algorithm update, the new pack again lost capacity
    prematurely due to incorrect SOC estimation and was confirmed by Ecoult to have
    been permanently damaged, requiring a second full replacement.
  lesson_learnt: SOC algorithm accuracy is critical to battery longevity — BMS software
    that cannot accurately estimate SOC will drive cells outside safe operating limits
    and cause irreversible capacity loss; verify SOC algorithm precision under the
    intended cycling regime before deployment.
