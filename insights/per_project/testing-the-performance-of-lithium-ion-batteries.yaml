  what_happened: The communications link between eight inverters and the central control
    hardware proved fragile, requiring protocol conversion across CANbus, Modbus RTU,
    and Modbus TCP/IP with two conversion devices, resulting in multiple unplanned
    communications outages during the first months of the trial.
  lesson_learnt: Minimise protocol conversion layers in battery test or monitoring
    architectures — each conversion device (e.g. CANbus to Modbus RTU to Modbus TCP/IP)
    is an additional failure point, and multi-hop conversion chains connecting many
    inverters will produce recurring communications outages that interrupt data collection.
