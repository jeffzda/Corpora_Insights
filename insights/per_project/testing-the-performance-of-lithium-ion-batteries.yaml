- record_id: ARENA-DLV-70751
  source_title: ITP Battery Test Centre Report 2
  publish_date: 2017-03
  project_name: ITP Battery Test Centre
  what_happened: The StoraXe battery pack (Kokam cells with ADS-TEC BMS) entered low-voltage
    protection mode in early November 2016. The BMS opened its contacts to prevent
    further discharge but also prevented the inverter from recharging the pack. When
    ITP arrived the following week to manually charge it, the pack voltage had fallen
    from 44.6V to 6.8V — below the minimum threshold for lithium-ion cells — rendering
    the pack permanently unrecoverable.
  lesson_learnt: Battery Management Systems must maintain the ability to accept a
    charge even after entering low-voltage protection mode; a BMS design that opens
    all contacts and then allows remote diagnostics to drain residual cell energy
    will cause irreversible cell damage. Verify BMS low-voltage protection and remote-access
    energy draw behaviour before deploying or testing any lithium-ion pack.
  issue_severity: major
  project_type: storage
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: research organisation/university
  delay_category: commissioning/integration
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: execution & logistics
  intervention_note: ITP entered warranty and remedies discussions with Kokam and
    ADS-TEC following the irreversible failure; no recovery of the pack was possible.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id172
  - 13
  evidence_excerpt: When ITP arrived to site to manually charge the pack the following
    week, the pack voltage had fallen from 44.6V to 6.8V. Once lithium-ion cells fall
    below their minimum voltage they cannot be recharged, and to do so risks a short-circuit
    occurring across battery electrodes. Hence, once this occurred, there was no possibility
