- record_id: ARENA-DLV-23080
  source_title: Lithium Ion Battery Testing Public Report 3
  publish_date: 2017-11
  project_name: Lithium Ion Battery Test Centre
  what_happened: The CALB battery pack's externally paired REC BMS had poor cell-balancing
    capability and matched poorly with the cell internal resistance characteristics
    of the pack, reducing effective capacity and charge efficiency; the issue highlights
    the risk of pairing cells with third-party BMS products outside the factory.
  lesson_learnt: Specify only battery products where the BMS is factory-integrated
    with the cells — external BMS pairings create cell-balancing risks that reduce
    effective capacity and are difficult to resolve without direct factory support,
    as demonstrated by the CALB/REC BMS integration.
