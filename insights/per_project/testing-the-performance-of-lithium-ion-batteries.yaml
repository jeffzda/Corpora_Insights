- record_id: ARENA-DLV-58363
  source_title: Lithium Ion Battery Testing Report 7
  publish_date: 2019-09
  project_name: Lithium-Ion Battery Test Centre
  what_happened: Pack-level capacity testing was subject to significant imprecision
    because upper and lower voltage limits were inaccessible at the pack level, requiring
    SOC estimation as a proxy. Erratic SOC estimation by battery BMS units or inverters
    produced significant variability in energy discharged each cycle, complicating
    interpretation of capacity fade trends.
  lesson_learnt: Pack-level battery testing without access to cell-level voltage limits
    introduces SOC estimation errors that substantially increase variability in capacity
    measurements — testing programmes should seek cell-level data access or use BMS-independent
    measurement instrumentation to improve data quality.
  issue_severity: moderate
  project_type: storage
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: research organisation/university
