- record_id: ARENA-DLV-46804
  source_title: ITP Battery Test Centre Report 4
  publish_date: 2018-03
  project_name: ITP Battery Test Centre
  what_happened: The Ecoult UltraFlex advanced lead-acid pack had underperforming
    battery units removed for analysis in September 2017; investigation found that
    the BMS control algorithm specific to the test site allowed cells to stray beyond
    normal cycling limits for extended periods, accelerating deterioration. All batteries
    were replaced under warranty and cycling restarted in January 2018.
  lesson_learnt: Site-specific BMS control algorithms should be reviewed against manufacturer
    cycling limits before deployment — algorithm configurations that permit extended
    out-of-limit cycling can accelerate deterioration and trigger warranty replacement.
  issue_severity: moderate
  project_type: storage
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: research organisation/university
  delay_category: commissioning/integration
  failure_mode: unvalidated integration
  outcome_class: delayed but recoverable
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Ecoult updated their control system algorithm and replaced all
    batteries under warranty; cycling of the new batteries restarted in January 2018.
  transferability: moderate
  delay_magnitude: 3–12 months
  technology_domain: battery storage
  source_pages: &id107
  - 11
  evidence_excerpt: Ecoult removed some underperforming battery units from this test
    for analysis and identified that the BMS' control system algorithm (specific to
    the test site) allowed some cells to stray beyond their normal cycling limit for
    extended periods, accelerating deterioration. Ecoult updated their control and
    replaced all batteries under warranty. Cycling of the new batteries commenced
