  source_title: Battery Test Centre Report 5
  publish_date: 2018-09
  project_name: Battery Test Centre
  what_happened: The Tesla Powerwall 2 experienced prolonged commissioning delays
    because Tesla does not allow third-party direct control of its battery products.
    ITP was eventually able to schedule cycling through Tesla's proprietary Opticaster
    forecasting software, which was only initially developed in early 2018 for utility-scale
    Powerpack units, and monitoring remained limited to a mobile app with no published
    local API.
  lesson_learnt: Battery products with closed, proprietary control architectures create
    significant integration and commissioning risk for third-party operators — require
    open or documented control interfaces as a procurement condition, and verify that
    a local API or direct control pathway exists before purchase.
