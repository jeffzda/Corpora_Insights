  source_title: Lithium Ion Battery Testing Public Report 9
  publish_date: 2020-09
  project_name: Lithium-Ion Battery Test Centre
  what_happened: The PowerPlus Energy LiFe Premium battery system had no BMS-to-inverter
    communications, causing inaccurate SOC estimation by the inverter; at C3 cycling
    rates the inverter's minimum SOC setpoint was reached before the battery's true
    minimum voltage, limiting usable capacity and making warranty compliance (no cycling
    below 20% SOC) uncertain.
  lesson_learnt: Where battery warranty conditions depend on SOC limits, ensure SOC
    data is communicated directly from the BMS to the inverter — relying on inverter-side
    estimation without BMS communications creates warranty compliance risk and restricts
    usable capacity.
