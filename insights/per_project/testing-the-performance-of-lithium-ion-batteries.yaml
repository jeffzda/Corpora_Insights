  what_happened: Monitoring and control of the battery systems was highly challenging
    due to a lack of consistent inverter communications protocols, the need to manage
    multiple inverter types including integrated all-in-one systems, and a change
    of data collection system between Phase 1 and Phase 2 that resulted in two bespoke
    and separately maintained systems.
  lesson_learnt: Battery test facility designers should standardise on a single data
    collection and control platform across all phases — introducing a second bespoke
    system for a later phase doubles infrastructure maintenance burden and complicates
    cross-phase data comparison; the absence of standardised inverter communications
    protocols must be treated as a design constraint rather than an assumption.
