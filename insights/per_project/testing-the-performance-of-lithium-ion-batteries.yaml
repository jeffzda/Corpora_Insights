  source_title: Lithium Ion Battery Testing Report 7
  publish_date: 2019-09
  project_name: Lithium-Ion Battery Test Centre
  what_happened: The market for residential and commercial lithium-ion battery packs
    showed significant product churn, with multiple manufacturers substantially altering
    their product offerings or exiting the market during the three-year trial period.
    Price reductions stalled in recent months due to manufacturing capacity constraints
    and high cobalt prices.
  lesson_learnt: The residential and commercial battery market remains immature and
    volatile — procurement for battery projects should assess manufacturer stability
    and roadmap continuity, and avoid long-term dependency on products from vendors
    with uncertain market commitment.
