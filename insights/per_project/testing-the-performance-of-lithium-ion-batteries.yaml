- record_id: ARENA-DLV-10265
  source_title: Battery Test Centre Report 5
  publish_date: 2018-09
  project_name: Battery Test Centre
  what_happened: The CALB pack required a replacement cell early in Phase 1 and, despite
    the repair, continued to show evidence of either a weak cell or poor battery management
    by the external BMS throughout the trial. The issues created significant variability
    between discharge cycles, compromising the reliability of conclusions about residual
    capacity.
  lesson_learnt: Cell replacement in a battery pack does not guarantee restoration
    of uniform performance — if a replaced cell underperforms or the external BMS
    cannot manage cell imbalance, ongoing variability will persist; consider replacing
    the full pack rather than individual cells when consistent data quality is required.
