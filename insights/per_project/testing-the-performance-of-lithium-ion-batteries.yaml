- record_id: ARENA-DLV-10270
  source_title: Battery Test Centre Report 5
  publish_date: 2018-09
  project_name: Battery Test Centre
  what_happened: Redflow's round-trip efficiency results published in Report 4 were
    found to be unrepresentative of true cycle efficiency because very few full cycles
    were completed due to the electrolyte leak issues, meaning a disproportionate
    fraction of imported energy was consumed by parasitic electrolyte pump loads rather
    than useful cycling.
  lesson_learnt: For flow batteries with parasitic pump loads, round-trip efficiency
    must be calculated over a statistically representative number of full cycles —
    efficiency figures derived from periods of partial or interrupted operation will
    be significantly distorted by fixed parasitic loads and should be clearly flagged
    or excluded.
