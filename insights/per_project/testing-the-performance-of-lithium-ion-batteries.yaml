- record_id: ARENA-DLV-46801
  source_title: ITP Battery Test Centre Report 4
  publish_date: 2018-03
  project_name: ITP Battery Test Centre
  what_happened: Battery Management System (BMS) integration with inverters was the
    most common and recurring commissioning challenge across both Phase 1 and Phase
    2 battery packs, with multiple products failing to commission successfully or
    operating with limited capability because manufacturers had not comprehensively
    tested BMS-inverter compatibility before dispatch.
  lesson_learnt: Manufacturers must comprehensively test their battery pack or BMS
    with the applicable inverter prior to dispatch — when this has not been done,
    commissioning is typically unsuccessful or system capability is limited.
