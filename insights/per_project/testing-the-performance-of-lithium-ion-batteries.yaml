  what_happened: BMS SOC estimation precision varied significantly across battery
    packs under test. Samsung, LG Chem, and Sony packs showed stable SOC resolution
    of 1%, while the Tesla Powerwall showed ±3% resolution with SOC drops under load,
    and the CALB pack with REC BMS showed unstable SOC behaviour. This variability
    distorted capacity and efficiency test results and in some cases required data
    exclusion.
