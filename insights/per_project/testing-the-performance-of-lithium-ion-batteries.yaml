  what_happened: The CALB CA100 battery pack exhibited erratic behaviour and was unable
    to complete cycles from the outset of the trial. IR thermal imaging and individual
    cell monitoring identified a single high-resistance, low-capacity cell (Cell 7)
    that was causing the entire pack to prematurely reach its BMS cut-off voltage.
  lesson_learnt: For battery packs using an external BMS with individual cell monitoring,
    use IR thermal imaging and cell-level data logging during early commissioning
    to detect underperforming cells — a single faulty cell can disable an entire pack,
    and early detection enables prompt supplier replacement before extended downtime.
