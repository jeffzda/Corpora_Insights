- record_id: ARENA-DLV-69301
  source_title: Lithium Ion Battery Testing Public Report 9
  publish_date: 2020-09
  project_name: Lithium-Ion Battery Test Centre
  what_happened: Multiple Phase 3 battery packs (DCS PV 10.0, PowerPlus Energy LiFe
    Premium, Zenaji Aeon) were installed without any communications interface between
    the battery BMS and the inverter, requiring the inverter to estimate SOC from
    voltage and other parameters alone, leading to inaccurate SOC estimation, cycling
    outside design parameters, and difficulty meeting the test methodology.
  lesson_learnt: When integrating battery packs with inverters, verify that BMS-to-inverter
    communications are functional before finalising the system design — absence of
    direct BMS communications forces reliance on inverter-side SOC estimation, which
    has repeatedly proven inaccurate and causes batteries to cycle outside design
    parameters.
