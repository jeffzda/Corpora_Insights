  what_happened: LG Chem HV RESU batteries were arriving to Australian installers
    with insufficient charge for commissioning due to self-discharge during longer-than-expected
    transit from Korea.
  lesson_learnt: For battery products shipped from East Asia to Australia, verify
    state of charge on arrival and have a pre-charge plan ready before scheduling
    commissioning — transit self-discharge can render batteries insufficiently charged
    for standard commissioning procedures, as was widespread with LG Chem HV RESU
    units.
  issue_severity: minor
