- record_id: ARENA-DLV-10255
  source_title: Battery Test Centre Report 5
  publish_date: 2018-09
  project_name: Battery Test Centre
  what_happened: The SimpliPhi PHI 3.4 battery pack was cycled beyond 100% depth of
    discharge throughout the trial because the inverter setpoints provided by SimpliPhi
    technicians at commissioning in mid-2017 were later found to be inconsistent with
    the manufacturer's current operating guidelines. SimpliPhi attributed rapid capacity
    fade to this over-discharging and agreed to replace the pack.
  lesson_learnt: Inverter setpoints and SOC conversion charts provided by manufacturers
    at commissioning should be treated as potentially outdated — confirm with the
    manufacturer that setpoints reflect current guidelines before cycling begins,
    particularly for lithium-based chemistries where over-discharging causes irreversible
    capacity loss.
