- record_id: ARENA-DLV-10263
  source_title: Battery Test Centre Report 5
  publish_date: 2018-09
  project_name: Battery Test Centre
  what_happened: Battery-inverter integration was consistently the most common commissioning
    and operational challenge across the trial, with no standardised communications
    interface protocol between battery packs and inverters. This affected multiple
    packs across both phases and was identified as a systemic market-wide issue.
  lesson_learnt: The absence of a standardised battery-inverter communications protocol
    is a systemic risk for battery storage projects — until standards are adopted,
    project developers should budget for extended commissioning timelines and engage
    manufacturers to pre-test the specific battery-inverter combination before installation
    on site.
