  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: null
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id106
  - 11
  evidence_excerpt: The CALB capacity test cycles continue to show that the BMS is
    regularly cutting off charge/discharge cycles before the maximum and minimum SOC
    setpoints are reached… It is expected that this is the result of either a weak/faulty
    cell, or poor cell management by the REC BMS managing the CALB pack. The CALB
    pack currently still operates acceptably, but the issues impact the variability
    and reliability of the capacity test data collected.
