  evidence_excerpt: The Tesla Powerwall 1 is charged and discharged at a faster rate
    than all other battery packs being tested… While ITP was able to control the Solar
    Edge/Powerwall system via an online portal, the rate of charge and discharge was
    not able to be controlled. Hence, the Powerwall 1 is charging and discharging
    at its maximum rate (~2hr) while other batteries charge and discharge over ~3hrs.
