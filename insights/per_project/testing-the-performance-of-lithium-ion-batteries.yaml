- record_id: ARENA-DLV-46803
  source_title: ITP Battery Test Centre Report 4
  publish_date: 2018-03
  project_name: ITP Battery Test Centre
  what_happened: The CALB lithium iron phosphate pack exhibited persistent BMS issues
    — cutting off charge/discharge cycles before setpoints were reached and showing
    significant fluctuation in charge delivery in the final third of cycles — attributed
    to either a weak/faulty cell or poor cell management by the BMS, which impacted
    the reliability of capacity test data throughout the trial.
  lesson_learnt: BMS cell management quality should be independently validated before
    and during testing; packs with weak cells or poor BMS algorithms will produce
    unreliable capacity test data and compromise the value of long-term performance
    assessments.
  issue_severity: moderate
  project_type: storage
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: research organisation/university
