- record_id: ARENA-DLV-28403
  source_title: Report 6 Lithium Ion Battery Testing
  publish_date: 2019-06
  project_name: Lithium Ion Battery Test Centre
  what_happened: The LG Chem RESU 1 battery pack experienced repeated temperature
    de-rating and shutdown during summer 2018/19, with the BMS reporting over-temperature
    and cell imbalance faults attributed to the pack's high energy density and lack
    of active cooling under the aggressive cycling regime; the pack was ultimately
    returned to the service centre and replaced.
  lesson_learnt: Battery packs with high energy density and passive thermal management
    only are vulnerable to over-temperature failures under high-duty cycling — projects
    specifying high charge/discharge rates must confirm that the battery's thermal
    management system is adequate for the duty cycle, particularly in warm ambient
    conditions.
