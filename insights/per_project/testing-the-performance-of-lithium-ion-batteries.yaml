  project_name: ITP Battery Test Centre
  what_happened: The LG Chem RESU battery consistently ran at higher cell temperatures
    than other batteries under test and de-rated its power output to 800 W when cell
    temperature reached 40°C at an ambient room temperature of only 28°C, because
    the RESU relies on passive cooling only within a compact, high-density enclosure.
  lesson_warnt: Specify active thermal management for battery installations in Australian
    climatic conditions where ambient temperatures regularly exceed 28°C — passively
    cooled batteries in compact enclosures will thermally de-rate under realistic
    summer conditions, compromising available capacity and accelerating long-term
    degradation.
