  source_title: ITP Battery Test Centre Report 4
  publish_date: 2018-03
  project_name: ITP Battery Test Centre
  what_happened: The Tesla Powerwall 1 showed the fastest capacity fade of all Phase
    1 battery packs, which ITP attributed to it being charged and discharged at a
    faster rate (~2hr cycle) than other packs (~3hr cycle) because the Solar Edge
    inverter integration did not allow charge/discharge rate control; ITP was also
    unable to analyse cell temperature data to confirm this hypothesis as Tesla does
    not provide this functionality.
  lesson_learnt: When battery-inverter compatibility limits charge/discharge rate
    control, the resulting higher C-rate operation may accelerate capacity fade; inverter
    selection should preserve rate control capability, and manufacturers should expose
    cell temperature data for independent verification of degradation hypotheses.
