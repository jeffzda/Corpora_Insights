  publish_date: 2018-09
  project_name: Battery Test Centre
  what_happened: Aquion's bankruptcy in March 2017 left the Battery Test Centre without
    manufacturer support to complete commissioning of the Aquion saltwater battery
    pack with the Victron inverter. Although Aquion was acquired in July 2017, the
    new owner did not support existing products and all warranties were voided, leaving
    the pack still uncommissioned at the time of Report 5 (September 2018).
  lesson_learnt: Manufacturer insolvency can permanently strand a battery installation
    without support or warranty — programs procuring batteries from early-stage or
    financially vulnerable companies should establish commissioning documentation
    and parameter sets that do not depend on ongoing manufacturer support, and should
    consider escrow arrangements for technical documentation.
