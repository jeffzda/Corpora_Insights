  publish_date: 2019-06
  project_name: Lithium Ion Battery Test Centre
  what_happened: The accelerated cycling methodology (three cycles per day) caused
    batteries to run hotter and experience greater stress than in typical solar-storage
    applications, leading to de-rating and failures particularly related to heat management
    that would not normally arise in real-world deployments.
  lesson_learnt: Accelerated cycling test regimes introduce thermal and degradation
    stresses beyond real-world conditions — results from such regimes cannot be directly
    extrapolated to field performance, and thermal management adequacy must be assessed
    at the test duty cycle, not just the rated duty cycle.
