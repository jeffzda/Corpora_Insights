  project_name: Lithium-Ion Battery Test Centre
  what_happened: Across the full trial, pack-level testing revealed that SOC estimation
    precision is highly dependent on the BMS or inverter/charger, with erratic SOC
    estimation causing significant variability in energy discharged per cycle and
    making state-of-health estimation difficult.
  lesson_learnt: Independent battery testing programs should collect both per-cycle
    energy data and periodic capacity test data, as erratic SOC estimation creates
    variance that can obscure capacity fade trends — neither dataset alone is sufficient
    to draw reliable conclusions on state of health.
