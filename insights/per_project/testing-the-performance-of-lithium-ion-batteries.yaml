- record_id: ARENA-DLV-46805
  source_title: ITP Battery Test Centre Report 4
  publish_date: 2018-03
  project_name: ITP Battery Test Centre
  what_happened: The GNB Sonnenschein conventional lead-acid battery pack developed
    sulfation and persistent SOC estimation problems during high-frequency cycling,
    causing the SMA inverter to frequently trigger protection modes prematurely and
    rendering the pack degraded despite equalisation charge attempts.
  lesson_learnt: Conventional lead-acid batteries are unsuitable for high-frequency
    daily cycling applications — sulfation caused by incomplete daily charges degrades
    performance and makes SOC estimation unreliable; alternative chemistries should
    be specified where daily cycling is required.
