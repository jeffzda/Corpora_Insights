- record_id: ARENA-DLV-70759
  source_title: ITP Battery Test Centre Report 2
  publish_date: 2017-03
  project_name: ITP Battery Test Centre
  what_happened: Testing demonstrated that lithium-ion and advanced lead-acid battery
    packs have a significantly shorter absorption charge phase compared to conventional
    lead-acid batteries, resulting in faster overall recharge times. Conventional
    lead-acid batteries also require periodic energy-inefficient equalisation charges
    that take the battery out of service, a constraint not shared by lithium-ion packs.
  lesson_learnt: Faster charge acceptance and the absence of mandatory equalisation
    charges are operationally significant advantages of lithium-ion over lead-acid
    in high-cycling applications; system designers should account for equalisation
    charge downtime and energy cost when modelling lead-acid battery availability
    and effective efficiency in solar-storage or mini-grid systems.
