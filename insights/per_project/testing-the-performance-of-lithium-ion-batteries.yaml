- record_id: ARENA-DLV-58370
  source_title: Lithium Ion Battery Testing Report 7
  publish_date: 2019-09
  project_name: Lithium-Ion Battery Test Centre
  what_happened: The battery market was observed to be moving towards either fully
    integrated battery-inverter products or products only compatible with inverters
    from the same manufacturer, reducing the battery-inverter integration challenges
    experienced extensively in Phases 1 and 2 of the trial.
  lesson_learnt: Specifying integrated battery-inverter products from a single manufacturer
    reduces integration risk and provides a single point of accountability for faults
    — for projects where multi-vendor integration is unavoidable, ensure communications
    protocol compatibility is fully validated before procurement.
