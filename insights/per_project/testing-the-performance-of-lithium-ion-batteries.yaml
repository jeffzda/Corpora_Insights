  - 22
  evidence_excerpt: Because ITP is conducting pack-level testing, the upper and lower
    voltage limits are not accessible, and hence the maximum and minimum SOC must
    be used as a proxy. The result is that the precision of a single capacity test
    depends significantly on the SOC estimation, conducted either by the battery inverter/charger
    or the in-built BMS. Throughout the trial, ITP has observed erratic SOC estimation
    resulting in significant variability in the energy discharged each cycle.
