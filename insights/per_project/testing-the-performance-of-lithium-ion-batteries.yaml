- record_id: ARENA-DLV-10253
  source_title: Battery Test Centre Report 5
  publish_date: 2018-09
  project_name: Battery Test Centre
  what_happened: The CALB lithium iron phosphate pack exhibited ongoing BMS issues
    where voltage setpoints — rather than SOC setpoints — terminated charge and discharge
    cycles early, indicating unreliable SOC estimation. A suspected weak cell also
    caused significant variability in charge delivery in the final third of each cycle.
  lesson_learnt: When an external BMS is used to manage a battery pack, verify that
    SOC estimation is accurate and that voltage-based cutoffs are not overriding SOC-based
    controls — unreliable SOC estimation undermines both battery longevity and the
    validity of performance data.
