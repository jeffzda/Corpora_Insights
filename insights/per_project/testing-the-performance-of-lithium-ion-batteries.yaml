  project_name: Lithium-Ion Battery Test Centre
  what_happened: The Tesla Powerwall 1 was only compatible with a SolarEdge inverter
    at the start of Phase 1, while all other packs used the SMA Sunny Island inverter.
    ITP could not control charge/discharge rate via the online portal, forcing the
    Powerwall 1 to cycle at maximum rate (~2-hour full cycle) versus ~3 hours for
    other batteries.
  lesson_learnt: Proprietary inverter lock-in can prevent external control of charge/discharge
    rates in a shared test or aggregation environment — verify that the selected battery
    product allows external rate control before committing to a system design that
    requires standardised cycling.
