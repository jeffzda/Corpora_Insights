- record_id: ARENA-DLV-10264
  source_title: Battery Test Centre Report 5
  publish_date: 2018-09
  project_name: Battery Test Centre
  what_happened: The Australian battery storage market during the trial period was
    characterised by instability, with manufacturers exiting the market or substantially
    changing product offerings. Market leaders Tesla and LG Chem aggressively cut
    wholesale prices and introduced second-generation products, while Tesla experienced
    a battery cell supply shortage that hampered order fulfilment.
  lesson_learnt: Projects procuring battery storage from a rapidly evolving market
    should expect product discontinuations, generation changes, and supply constraints
    — procurement strategies should include flexibility provisions and avoid sole-sourcing
    from vendors with unproven supply chains or thin balance sheets.
