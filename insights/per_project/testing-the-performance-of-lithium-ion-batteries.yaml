- record_id: ARENA-DLV-10258
  source_title: Battery Test Centre Report 5
  publish_date: 2018-09
  project_name: Battery Test Centre
  what_happened: The Ampetus SuperLithium pack constrained charge rates below the
    test system's requested rate due to BMS-inverter communication issues identified
    during commissioning in October 2017. After a firmware upgrade by the manufacturer
    the pack returned in November 2017 but continued to suffer frequent shutdowns
    requiring cell re-balancing. Ampetus subsequently went into receivership in May
    2018 after its supplier Sinlion refused to honour the product warranty.
  lesson_learnt: Battery products from companies with shallow balance sheets and unresolved
    upstream supply chain warranty disputes carry a high risk of vendor insolvency
    — procurement processes should assess manufacturer financial stability and clarify
    warranty liability chains before purchase, particularly for emerging market entrants.
  issue_severity: critical
  project_type: storage
