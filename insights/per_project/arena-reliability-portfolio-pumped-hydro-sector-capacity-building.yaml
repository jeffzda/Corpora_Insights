- record_id: ARENA-DLV-25932
  source_title: Review of ARENA's Reliability Portfolio
  publish_date: 2020-01
  project_name: ARENA Reliability Portfolio — Pumped Hydro Sector Capacity Building
  what_happened: The portfolio evaluation found that while ARENA's funding had contributed
    meaningfully to the body of knowledge around pumped hydro resources and feasibility,
    the sector was likely to face capacity constraints in key areas of expertise —
    including community engagement — as the expected significant growth in pumped
    hydro deployment materialised in the coming years.
  lesson_learnt: For a technology sector approaching a scale-up phase (such as pumped
    hydro), funding should proactively target workforce and capability development
    — particularly in community engagement and social licence — ahead of the capacity
    crunch rather than waiting for shortfalls to manifest during project development.
