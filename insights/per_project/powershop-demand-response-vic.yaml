- record_id: ARENA-DLV-42328
  source_title: Evaluation of ARENA's 2017-2020 Demand Response Portfolio
  publish_date: 2021-06
  project_name: Powershop Demand Response (VIC)
  what_happened: Powershop identified through the trial that the RERT's 2–3 hour activation
    windows were too long for residential customers to sustain behavioural response,
    that the program was better suited to capacity-based rather than behavioural DR,
    and that the opt-in structure made it difficult to forecast available DR volumes
    — leading to a decision not to continue RERT participation after the trial.
  lesson_learnt: For residential behavioural DR in a RERT context, shorten activation
    windows to approximately 30 minutes to improve customer participation rates —
    two-to-three hour events are too long for residential customers and result in
    significant drop-off; alternatively, route residential BDR through non-RERT mechanisms
    more suited to short, frequent events.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: government/public-sector body
