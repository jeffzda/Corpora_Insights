- record_id: ARENA-DLV-42327
  source_title: Evaluation of ARENA's 2017-2020 Demand Response Portfolio
  publish_date: 2021-06
  project_name: Powershop Demand Response (VIC)
  what_happened: 'Powershop''s behavioural DR program delivered significantly inconsistent
    results across four recorded periods: 74% of contracted capacity in Period 1 Year
    1, only 47% in Period 2 Year 1, 97% in Period 1 Year 2, and 148% in Period 2 Year
    2, reflecting the fundamental unpredictability of voluntary residential behavioural
    DR.'
  lesson_learnt: Residential behavioural DR should not be relied upon as firm reserve
    capacity — its opt-in nature and dependence on customer response to notifications
    produces highly variable delivered volumes that make capacity contracting difficult;
    design programs with wide capacity buffers or cap contracted volumes conservatively.
