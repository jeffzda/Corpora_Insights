- record_id: ARENA-DLV-42329
  source_title: Evaluation of ARENA's 2017-2020 Demand Response Portfolio
  publish_date: 2021-06
  project_name: Powershop Demand Response (VIC)
  what_happened: Monash University's cogeneration facility, which was intended to
    provide firm capacity as part of Powershop's DR portfolio, was unavailable during
    the project due to ongoing maintenance issues, reducing the firm capacity available
    to back up the behavioural DR program.
  lesson_learnt: When relying on third-party assets (e.g. university cogeneration,
    backup generation) as firm capacity within a behavioural DR portfolio, validate
    asset availability and maintenance schedules before contracting — Monash's generator
    unavailability during the trial reduced portfolio reliability.
