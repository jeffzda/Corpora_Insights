  source_title: Fast Charging Site Selection Guide
  publish_date: 2020-08
  project_name: Chargefox Ultra-Rapid Charging Network
  what_happened: Sites with existing low-voltage capacity at a main switchboard located
    close to available hardware cabinet space and EV parking bays proved significantly
    faster and cheaper to develop than sites requiring new high-voltage connections
    or major cable runs.
  lesson_learnt: Prioritise sites with existing low-voltage switchboard capacity close
    to potential EV bays — this is the least costly and fastest connection option.
    Screen for this criterion early in scouting to avoid investing in sites that will
    require expensive high-voltage augmentation.
