- record_id: ARENA-DLV-36981
  source_title: Insights from ARENA's Public Charging Projects
  publish_date: 2024-06
  project_name: Chargefox Electric Vehicle Charging Network Project
  what_happened: Chargefox found that EV charging port locations vary significantly
    across vehicle models, charger manufacturers are not governed by any minimum cable
    length standard, and low-ground-clearance EVs have difficulty parking over wheel
    stops. Designing charging bay configurations to accommodate all EV types required
    site-specific solutions for parallel, perpendicular, and angled bay layouts, with
    disability access proving particularly difficult at constrained existing sites.
  lesson_learnt: Design charging bay configurations to accommodate the widest possible
    range of EV charging port positions and ground clearances — use longer cables,
    flexible charger placement relative to bay layout, and where possible designate
    a disability-accessible bay; at constrained existing sites, access for mobility-impaired
    drivers may not be achievable and this should be flagged at the site selection
    stage.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: first commercial/FOAK
  lifecycle_phase: construction/installation
  proponent_type: project developer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Chargefox designed site-specific bay configurations (greenfield
    and retrofit) to provide a combination of charging options accommodating diverse
    EV models and, where possible, disability access.
  transferability: broad
  delay_magnitude: null
  technology_domain: EV
