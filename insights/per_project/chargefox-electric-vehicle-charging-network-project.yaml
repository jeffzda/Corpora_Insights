  source_title: Fast Charging Site Selection Guide
  publish_date: 2020-08
  project_name: Chargefox Ultra-Rapid Charging Network
  what_happened: Installing EV charging stations behind a host site's existing solar
    meter — rather than on a separate meter — allowed the charging station to offset
    solar export, improve the solar asset's economics, and provide a basis for a mutually
    beneficial commercial arrangement with the property owner.
  lesson_learnt: Where a host site already has solar, installing EV charging behind
    its meter can reduce net solar export and strengthen the commercial case for the
    landowner — structure the commercial arrangement explicitly around this shared
    value to improve landowner willingness to host.
