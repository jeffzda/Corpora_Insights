  what_happened: On-site solar generation was found to be cheaper than grid-purchased
    electricity in most Australian locations and its output profile broadly matches
    peak EV charging demand during daytime hours, making it a practical and economically
    attractive inclusion at charging sites.
  lesson_learnt: Evaluate on-site solar at every charging site — solar output broadly
    matches daytime EV charging demand profiles and is typically cheaper than grid
    power, providing both cost and soft-capacity benefits. Installing EV charging
