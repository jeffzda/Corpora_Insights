  source_title: Insights from ARENA's Public Charging Projects
  publish_date: 2024-06
  project_name: Chargefox Electric Vehicle Charging Network Project
  what_happened: After purchasing chargers from a manufacturer with a good reputation
    for reliable electrical equipment, Chargefox found that the new chargers failed
    to deliver the functionality the manufacturer had promised. The introduction of
    new EV models also introduced unforeseen types of charging failures that could
    not be diagnosed via OCPP management systems, requiring intervention from the
    equipment manufacturer.
  lesson_learnt: Do not rely on a supplier's track record with adjacent equipment
    as a proxy for new technology reliability — require access to units operating
    in the field and at least six months of operational stability data before committing
    to charger procurement, as every new technology generation introduces previously
    unseen failure modes.
