- record_id: ARENA-DLV-55557
  source_title: Chargefox Electric Vehicle Charging Network Project - Project Results
    and Lessons Learnt
  publish_date: 2021-02
  project_name: Chargefox Electric Vehicle Charging Network Project
  what_happened: The second charger supplier selected mid-program, despite having
    a strong reliability record with previous DC charger products, introduced an extraordinary
    number of new software-based failure modes in their new high-power offering. Chargers
    failed due to software and fundamental design faults rather than hardware component
    failures, with some sites requiring weekly maintenance visits to clear false alarms.
  lesson_learnt: Software reliability and fundamental design stability — not just
    component quality — are the dominant reliability risk for new-generation EV chargers;
    future procurement should require six months of in-field operational data on the
    specific model being purchased, and ongoing charger assessment should be treated
    as a continuous process rather than a pre-purchase event.
  issue_severity: major
  project_type: transport electrification
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: project developer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: partial success
  secondary_failure_mode: execution & logistics
  intervention_note: Chargefox established a maintenance regime with systematic site
    visit records to identify the most common faults and remedies, building a picture
    of failure patterns across the network.
  transferability: moderate
  delay_magnitude: null
  technology_domain: EV
  source_pages: &id019
  - 13
  - 14
  evidence_excerpt: Every new incarnation of technology introduces new failure modes
    into the equipment, and these chargers have an extraordinary number of new failure
    modes previous equipment did not have... Instead we find chargers failing due
    to software and fundamental design faults. Nothing breaks, but the software fails
    for a wide range of reasons. This decreases confidence in the chargers for customers
    who start using other chargers very quickly. For the charger operator it greatly
    increases maintenance costs, with some sites requiring weekly visits to clear
    false alarms on chargers.
  confidence_note: secondary_failure_mode 'resource/capability shortfall' applied
    to reflect the significant unplanned maintenance burden (weekly site visits) that
