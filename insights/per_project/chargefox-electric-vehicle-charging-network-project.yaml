- record_id: ARENA-DLV-33955
  source_title: Fast Charging Site Selection Guide
  publish_date: 2020-08
  project_name: Chargefox Ultra-Rapid Charging Network
  what_happened: Ultra-rapid EV charging load profiles are highly intermittent and
    peaky, with single chargers drawing up to 350 kW. This results in high maximum
    demand charges that materially affect station economics if not addressed in design.
  lesson_learnt: Account for maximum demand charges explicitly in site financial modelling
    — ultra-rapid EV charging creates very peaky load profiles that can dominate operating
    costs. Mitigation options (diversity limits, behind-meter installation, battery
    buffering) should be evaluated at concept design stage.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: project developer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Applied diversity limits on maximum site draw, installed batteries
    at select sites, and co-located behind existing meters where charger demand was
    unlikely to affect overall site maximum demand.
  transferability: broad
  delay_magnitude: null
  technology_domain: EV
  source_pages: &id005
  - 7
  evidence_excerpt: The load profile for ultra-rapid EV charging tends to be very
    'peaky' due to intermittent use and high power requirements – theoretically up
    to 350 kW, and often above 100kW, at a single charger. This can lead to high maximum
    demand costs reflective of the impact on network capacity.
