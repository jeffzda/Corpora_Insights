  source_title: Insights from ARENA's Public Charging Projects
  publish_date: 2024-06
  project_name: Chargefox Electric Vehicle Charging Network Project
  what_happened: 'Chargefox''s first site connection was fraught with cascading delays:
    an unqualified designer had to be dismissed and replaced (delaying equipment procurement);
    a suitable transformer was difficult to source and its delivery was delayed; a
    scheduled site outage requiring a full crew and out-of-pocket on-site generation
    was then disrupted by poor weather, forcing rescheduling and doubling connection
    costs.'
  lesson_learnt: Verify the qualifications of connection designers before engagement
    and allow substantial contingency for transformer procurement and outage scheduling
    — a single unqualified designer can trigger a chain of procurement and scheduling
    delays that compound rapidly, and external factors such as weather can double
    connection costs when crews are already mobilised.
