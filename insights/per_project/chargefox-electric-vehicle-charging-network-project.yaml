- record_id: ARENA-DLV-33954
  source_title: Fast Charging Site Selection Guide
  publish_date: 2020-08
  project_name: Chargefox Gundagai
  what_happened: At Gundagai, existing network infrastructure was insufficient to
    directly support the charging station without augmentation. Chargefox worked with
    network service provider Essential Energy to design a dynamic connection arrangement
    that monitors real-time substation capacity and limits charger output accordingly,
    avoiding the need for network augmentation entirely.
  lesson_learnt: Where LV capacity is borderline, explore dynamic connection arrangements
    with the network service provider before committing to costly augmentation — real-time
    monitoring of available substation capacity can enable a cost-effective solution
    for both parties and represents an Australian first in this application.
