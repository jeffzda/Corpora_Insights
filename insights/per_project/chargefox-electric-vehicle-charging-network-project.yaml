  project_name: Chargefox Electric Vehicle Charging Network Project
  what_happened: Chargefox dedicated $5.5 million of their $15 million project budget
    to charger procurement, making project success heavily dependent on charger performance.
    The procurement task took three months of full-time-equivalent effort involving
    contributions from all parts of the business and external input from electricity
    distribution networks — far longer than expected.
