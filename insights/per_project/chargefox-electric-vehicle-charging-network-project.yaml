- record_id: ARENA-DLV-33957
  source_title: Fast Charging Site Selection Guide
  publish_date: 2020-08
  project_name: Chargefox Euroa
  what_happened: At Euroa, the existing site switchboard connection was insufficient
    to power the chargers alone. Chargefox installed its own solar system and battery
    alongside a partial switchboard expansion, and co-located equipment behind the
    site main meter. This enabled sufficient power supply while also improving the
    economics of the pre-existing on-site solar by reducing net export.
  lesson_learnt: Where existing LV connection is marginal, a combination of partial
    switchboard expansion, on-site solar, and battery storage can bridge the gap —
    and a commercial arrangement that improves the host site's solar economics can
    facilitate landowner agreement and reduce total project cost.
