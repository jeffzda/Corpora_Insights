  what_happened: Commissioning of EV charging sites was previously constrained by
    the need to book manufacturer commissioning teams in advance; last-minute delays
    to power connection caused flow-on commissioning delays because on-site manufacturer
    staff were unavailable. Chargefox successfully developed and implemented a remote
    commissioning process at the Ballarat site.
