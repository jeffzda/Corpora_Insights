  what_happened: Remote commissioning of EV charging hardware was not possible at
    project outset because procedures and training resources had not been established
    and installation teams lacked experience with the specific equipment. Once the
    charger manufacturer developed these resources and experienced electricians were
    engaged, remote commissioning was successfully implemented.
