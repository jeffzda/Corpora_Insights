  project_name: Chargefox Murray Bridge
  what_happened: Murray Bridge used parallel on-street parking with charger heads
    at the side of the bay. Vehicles with the charging port on the driver's side face
    difficulty reaching the cable. An intended PWD space was also abandoned because
    the extra space required would have obstructed the adjacent footpath.
  lesson_learnt: Parallel on-street parking is the most challenging EV charging configuration
    — driver-side port vehicles may struggle with cable reach, and footpath clearance
    requirements can eliminate PWD provision. Mitigate cable reach by using longer-than-standard
