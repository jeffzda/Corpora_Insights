- record_id: ARENA-DLV-60405
  source_title: Chargefox Electric Vehicle Charging Network Project - Lessons Learnt
    1
  publish_date: 2020-04
  project_name: Chargefox Electric Vehicle Charging Network Project
  what_happened: Engaging design and construction services on a site-by-site basis
    with tightly scoped contracts limited Chargefox's ability to redirect resources
    across sites, tied hardware to specific locations, and slowed delivery of a concurrent
    multi-site program. Chargefox shifted to a consolidated delivery team model in
    the second half of 2019, after which commissioning frequency increased significantly.
  lesson_learnt: For multi-site rollout programs, transition from site-by-site contracting
    to a consolidated national delivery team with flexible resourcing as soon as the
    team has sufficient experience and site volume — this enables hardware pre-procurement,
    flexible resource allocation, and synchronised scheduling that site-by-site contracting
    cannot achieve.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: first commercial/FOAK
  lifecycle_phase: procurement
  proponent_type: project developer
  delay_category: procurement/supply chain
  failure_mode: coordination & stakeholders
  outcome_class: re-scoped/adapted
  secondary_failure_mode: execution & logistics
  intervention_note: Chargefox rebuilt its delivery team mid-program by identifying
    and engaging partners with national presence and cross-jurisdictional experience,
    then operated transparently with high trust, resulting in accelerated site delivery
    through the second half of 2019 and all of 2020.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: EV
  source_pages:
  - 9
  - 10
  evidence_excerpt: Engaging design and construction services on a site-by-site basis
    has benefits but can also slow projects down, for several reasons. Firstly, it
    usually involves more tightly scoped contracts which limits the ability to direct
    resources to areas where the most progress is possible. Another major reason is
    that aspects of design, such as switchboard design, are done per-site which means
    that specific pieces of hardware are tied to particular sites.
  confidence_note: failure_mode classified as governance/coordination failure as the
    root cause was a contracting and organisational structure decision rather than
    a supply chain disruption. Canonical record merged from 3 source records across
