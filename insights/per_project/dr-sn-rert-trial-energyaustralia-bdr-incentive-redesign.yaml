- record_id: ARENA-DLV-20709
  source_title: Demand Response Short Notice RERT Trial Year 3 Report
  publish_date: 2021-10
  project_name: DR SN RERT Trial — EnergyAustralia BDR incentive redesign
  what_happened: EnergyAustralia found that its Year 2 BDR incentive levels ($10–$20
    per event plus survey bonus) were financially unsustainable; in Year 3 it moved
    to a flat $1 for any reduction plus $2/kWh structure, which simplified administration
    and improved program sustainability while maintaining 94% customer intent to re-participate.
  lesson_learnt: BDR incentive structures should be designed for long-run financial
    sustainability from the outset; overly generous launch incentives may achieve
    recruitment but create a cliff-edge redesign problem — a simple, flat incentive
    that customers understand can achieve similar engagement outcomes at lower cost.
