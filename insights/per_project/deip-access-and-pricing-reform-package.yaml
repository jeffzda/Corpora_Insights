  project_name: DEIP Access and Pricing Reform Package
  what_happened: CEPA's aggregated retail pricing model (Option 5), which shifted
    pricing responsibility to retailers, was seen as potentially simplifying customer
    experience but was rejected as too complex to implement without further trials
    due to concerns about loss of consumer transparency, complexity for smaller retailers,
    and impacts on competition.
  lesson_learnt: Novel pricing models that shift responsibilities to retailers require
    dedicated trials before being proposed for system-wide adoption — stakeholder
    concerns about transparency, competition impacts and implementation complexity
    for smaller market participants will block adoption without an evidence base from
    pilots.
