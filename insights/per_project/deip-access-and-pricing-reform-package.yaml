  secondary_failure_mode: poor scoping
  intervention_note: Appendix B recommended comprehensive customer impact analysis
    identifying magnitude of price impacts, case studies of vulnerable households,
    and characteristics of load profiles facing significant impacts, with retailer
    actions and consumer protections co-designed to accompany reform.
