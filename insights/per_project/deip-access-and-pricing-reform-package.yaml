- record_id: ARENA-DLV-1507
  source_title: DEIP Access and Pricing Reform Package Outcomes
  publish_date: 2020-05
  project_name: DEIP Access and Pricing Reform Package
  what_happened: CEPA's full two-way pricing proposal (Option 4), based on dynamic
    short-run marginal cost (SRMC) pricing, was evaluated by approximately 120 workshop
    participants and found to be too complex to implement despite being assessed as
    having the most future potential for efficient, equitable DER integration.
  lesson_learnt: When designing DER market reform options, complexity of implementation
    and customer explainability must be weighted alongside theoretical efficiency
    benefits — proposals based on dynamic SRMC pricing are likely to be rejected by
    stakeholders as too complex regardless of their economic merit, and simpler transitional
    options should be prioritised.
