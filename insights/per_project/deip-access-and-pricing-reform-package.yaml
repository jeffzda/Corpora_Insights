- record_id: ARENA-DLV-1504
  source_title: DEIP Access and Pricing Reform Package Outcomes
  publish_date: 2020-05
  project_name: DEIP Access and Pricing Reform Package
  what_happened: The absence of network pricing signals for DER exports (prohibited
    by clause 6.1.4 of the NER) meant that non-DER households were paying disproportionately
    more for network costs while DER owners exported without contributing to hosting
    capacity costs, creating an equity problem that was expected to worsen as DER
    penetration increased.
  lesson_learnt: Regulatory frameworks should be amended to enable export pricing
    signals before DER penetration reaches levels where cost inequities become entrenched
    — the longer clause 6.1.4-style prohibitions remain in place, the greater the
    cross-subsidy burden on non-DER customers and the harder the transition becomes.
  issue_severity: major
  project_type: network/grid
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: operations
  proponent_type: government/public-sector body
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Working Group Finding 4 recommended enabling network export prices
    by removing or amending clause 6.1.4 of the NER, with a beneficiary-pays approach
    and consultation with customers on cost allocation, subject to AEMC rule change
    process.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: DER
  source_pages: &id004
  - 16
  - 17
  - 18
  - 31
  evidence_excerpt: Without ongoing pricing reforms, existing network cost recovery
    pricing framework will create inequity, where non-DER households pay disproportionately
    more – affecting vulnerable customers or those on low incomes most.
