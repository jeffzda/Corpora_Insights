- record_id: ARENA-DLV-1503
  source_title: DEIP Access and Pricing Reform Package Outcomes
  publish_date: 2020-05
  project_name: DEIP Access and Pricing Reform Package
  what_happened: Cost-reflective consumption tariff reform — initiated by the AEMC's
    2014 rule change requiring network businesses to set prices reflecting efficient
    costs — had progressed at the network level but failed to translate effectively
    to the consumer level, with the pace of reform varying across states and territories
    and full price reform proving difficult to implement.
  lesson_learnt: Network-level tariff reform does not automatically flow through to
    consumers; implementation requires coordinated engagement with retailers, consumer
    groups and vulnerable household protections, and should be accompanied by detailed
    customer impact analysis and clear messaging before mandating cost-reflective
    tariffs at the consumer level.
