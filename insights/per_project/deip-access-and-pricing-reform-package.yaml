  project_name: DEIP Access and Pricing Reform Package
  what_happened: Export charging (Option 3b) received in-principle support from workshop
    stakeholders as an equitable cost-allocation mechanism, but unresolved questions
    about locational vs. universal application, treatment of existing vs. new DER
    owners, and potential competitive neutrality distortions between transmission
    and distribution pricing regimes prevented consensus on implementation design.
  lesson_learnt: Export charging proposals require upfront resolution of grandfathering,
    locational vs. universal design, and transmission-distribution competitive neutrality
    issues before stakeholder consensus can be achieved — attempting to advance export
    charges without these design parameters defined will produce sustained opposition
    and delay rule change processes.
