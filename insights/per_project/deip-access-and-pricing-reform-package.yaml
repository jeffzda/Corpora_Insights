  source_title: DEIP Access and Pricing Reform Package Outcomes
  publish_date: 2020-05
  project_name: DEIP Access and Pricing Reform Package
  what_happened: Networks were constraining DER exports using export limits to manage
    physical infrastructure limits without clearly established principles for doing
    so, resulting in inconsistent approaches across distributors and no transparent
    framework for customers to understand how much capacity could be connected or
    exported.
  lesson_learnt: Regulators should establish clearly defined, publicly accessible
    principles and capacity allocation frameworks for networks to follow when constraining
    DER exports — the absence of such principles leads to inconsistent, opaque decisions
    that erode customer trust and DER investment value.
