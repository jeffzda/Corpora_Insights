  project_name: DEIP Access and Pricing Reform Package
  what_happened: Low voltage (LV) networks historically did not require detailed network
    models or monitoring, leaving distribution businesses with limited visibility
    of where DER hosting capacity constraints existed, making it difficult to plan
    for or communicate constraints to customers or enable market participants to make
    informed DER investment decisions.
  lesson_learnt: Investment in LV network monitoring and modelling tools should be
    treated as foundational infrastructure for DER integration — without visibility
    of actual hosting capacity constraints, networks cannot plan efficiently, and
    customers and investors cannot make informed decisions about DER deployment.
