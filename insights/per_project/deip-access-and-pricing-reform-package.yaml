- record_id: ARENA-DLV-1513
  source_title: DEIP Access and Pricing Reform Package Outcomes
  publish_date: 2020-05
  project_name: DEIP Access and Pricing Reform Package
  what_happened: Stakeholders identified that the current regulatory framework did
    not adequately reward DER owners for the material benefits their assets provide
    to the network (such as peak demand reduction and power quality improvement),
    creating misaligned incentives and reducing the economic case for enabling DER.
  lesson_learnt: DER access and pricing reform packages must include mechanisms to
    reward DER benefits to the network alongside any new cost allocation instruments
    — introducing export charges without corresponding benefit recognition will be
    opposed as inequitable and will likely reduce DER uptake rather than optimise
    it.
