  what_happened: Stakeholders identified that existing reform frameworks and regulatory
    mechanisms (such as the Regulatory Investment Test for Distributors) could be
    adapted to support DER hosting capacity without creating new frameworks, but regulatory
    inertia and the time required to implement rule changes meant near-term non-rule-change
    actions by industry and the AER were also necessary.
  lesson_learnt: When pursuing DER integration reforms, prioritise adapting existing
    regulatory mechanisms before creating new frameworks — this reduces implementation
    lead time and stakeholder friction, while parallel non-rule-change actions (e.g.
    AER guideline amendments) should be expedited to deliver near-term outcomes within
    the timeframe of rule change processes.
