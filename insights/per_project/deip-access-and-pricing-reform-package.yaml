- record_id: ARENA-DLV-1501
  source_title: DEIP Access and Pricing Reform Package Outcomes
  publish_date: 2020-05
  project_name: DEIP Access and Pricing Reform Package
  what_happened: The current regulatory framework for distribution network access
    and pricing was designed for a one-way centralised generation paradigm and does
    not support efficient, equitable integration of DER. Networks began applying export
    limits — including zero export limits in high-solar-penetration areas — to manage
    voltage rise, phase balancing and thermal constraints, reducing the value of customer
    DER investments.
  lesson_learnt: Regulatory frameworks must be updated proactively to accommodate
    two-way energy flows before network constraints become entrenched; delayed reform
    risks locking in inequitable access conditions and destroying value for DER owners,
    particularly early adopters in high-penetration areas.
  issue_severity: major
  project_type: network/grid
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: approvals/contracting
  proponent_type: government/public-sector body
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: DEIP established a multi-stakeholder Access and Pricing Working
    Group to develop consensus reform findings and initiate rule change requests to
    AEMC, with next steps including AEMC initiating a financial incentive study and
    TEC/ACOSS submitting a rule change request by June 2020.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: DER
  source_pages: &id001
