- record_id: ARENA-DLV-1505
  source_title: DEIP Access and Pricing Reform Package Outcomes
  publish_date: 2020-05
  project_name: DEIP Access and Pricing Reform Package
  what_happened: Most DER installed in Australia was passive (not controllable) due
    to limited incentives for customers, third parties or networks to maximise DER
    services, creating a growing legacy of uncontrolled customer-owned DER infrastructure
    that faced increasing network constraints and risked losing value for DER owners
    while creating inequity for future entrants.
  lesson_learnt: DER integration programs should include incentives for controllable,
    dispatchable DER from the outset — passive installation without controllability
    frameworks creates legacy infrastructure problems that become progressively harder
    and more costly to remediate as penetration grows.
  issue_severity: major
  project_type: network/grid
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: operations
  proponent_type: government/public-sector body
  delay_category: approvals/regulatory
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: coordination & stakeholders
  intervention_note: Working Group Findings 11 and 12 recommended promoting regulatory
    innovation to enable DER operation within network technical limits and having
    distribution businesses build low voltage network monitoring and modelling capability
    as a precursor to managing exports.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: DER
  source_pages: &id005
  - 16
  evidence_excerpt: Much of the DER installed is passive (not controllable) and this
    trend is expected to continue given there are limited incentives to customers,
    or third parties on their behalf, and networks to maximise DER services. This
    is expected to create a legacy of customer-owned DER infrastructure which if uncontrolled,
    faces increasing network constraints, resulting in loss of value for DER owners
    and will likely create inequity for new entrants who may face greater constraints.
