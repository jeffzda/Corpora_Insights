  source_title: DEIP Access and Pricing Reform Package Outcomes
  publish_date: 2020-05
  project_name: DEIP Access and Pricing Reform Package
  what_happened: The DEIP Access and Pricing process used a structured three-workshop
    series with approximately 120 participants, an independent 22-member Reference
    Group, and a commissioned CEPA reform options report to build stakeholder consensus,
    achieving broad agreement on a least-regrets reform pathway (Option 3a) within
    nine months.
  lesson_learnt: Complex multi-stakeholder energy market reform processes benefit
    from a structured deliberative sequence — user-centred design principles first,
    then problem definition and objectives, then independently developed options for
    evaluation — with a dedicated reference group providing continuity between workshops;
    this approach can achieve actionable consensus on contentious policy issues within
    a defined timeframe.
