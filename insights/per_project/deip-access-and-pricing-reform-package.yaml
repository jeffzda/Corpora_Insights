- record_id: ARENA-DLV-1512
  source_title: DEIP Access and Pricing Reform Package Outcomes
  publish_date: 2020-05
  project_name: DEIP Access and Pricing Reform Package
  what_happened: Consumer advocacy groups, governments and energy companies resisted
    full cost-reflective tariff reform at the consumer level since the 2014 Power
    of Choice reforms, with a lack of customer impact analysis, unclear retailer pass-through
    mechanisms, and insufficient consumer protections for vulnerable households identified
    as the primary causes of reform stalling.
  lesson_learnt: Cost-reflective tariff reform requires a consumer impact analysis
    program to be designed and completed before or alongside reform rollout — without
    detailed modelling of impacts on different household types (including vulnerable
    consumers), advocacy resistance will block implementation regardless of the efficiency
    merits of the reform.
