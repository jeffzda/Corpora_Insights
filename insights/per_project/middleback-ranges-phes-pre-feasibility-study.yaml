  what_happened: The inclusion of synchronous condenser mode capability in the reversible
    Francis pump-turbine design was identified as providing an additional revenue
    stream through Market Ancillary Services (voltage and power factor correction)
    beyond energy arbitrage and FCAS, but revenues from non-market ancillary services
    such as NSCAS and SRAS were explicitly excluded from the revenue modelling.
  lesson_learnt: PHES revenue assessments should explicitly scope and quantify all
    potential ancillary service revenue streams including synchronous condenser, NSCAS,
    and SRAS — excluding these from modelling may materially understate project value,
    particularly for assets with grid-stabilisation capability in weak grid regions.
