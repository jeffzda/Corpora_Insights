  evidence_excerpt: Price arbitrage and FCAS revenues from a storage facility (such
    as a stand-alone pumped hydro facility) are relatively modest compared to the
    capital cost of such a facility even though such facilities perform a critical
    role in the transition to renewables and can operate for up to fifty years or,
    in some cases, longer.
