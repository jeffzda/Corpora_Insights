- record_id: ARENA-DLV-20809
  source_title: South Middleback Ranges Pumped Hydro Energy Storage Project – Pre-feasibility
    Study Knowledge Sharing Report
  publish_date: '2019-07-10'
  project_name: South Middleback Ranges Pumped Hydro Energy Storage Project (SMRPHES)
  what_happened: The study found that the SMRPHES facility's direct public benefit
    in the form of consumer surplus ($21M/year for the 110 MW option) exceeded the
    net private investor benefit (approximately $16M/year after OPEX), indicating
    a structural misalignment between private returns and social value for large-scale
    PHES assets.
  lesson_learnt: Where a PHES project's social value (consumer surplus from wholesale
    price reduction) materially exceeds its private return, proponents should proactively
    engage with governments and regulators to explore mechanisms — such as capacity
    market contracts, regulated asset base treatment, or direct co-investment — that
    can align investor incentives with the broader market benefit the project delivers.
