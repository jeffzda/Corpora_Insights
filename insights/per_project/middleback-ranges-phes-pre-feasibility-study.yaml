- record_id: ARENA-DLV-20805
  source_title: South Middleback Ranges Pumped Hydro Energy Storage Project – Pre-feasibility
    Study Knowledge Sharing Report
  publish_date: '2019-07-10'
  project_name: South Middleback Ranges Pumped Hydro Energy Storage Project (SMRPHES)
  what_happened: Revenue modelling showed high sensitivity to assumptions about battery
    market penetration and Snowy 2.0 progression — with the model explicitly noting
    that lower battery penetration or Snowy 2.0 delay would increase arbitrage and
    FCAS revenues, and that models 'are clearly incapable of predicting all market
    changes'.
  lesson_learnt: PHES revenue models should be stress-tested against scenarios including
    competing large-scale storage deployment (batteries, other PHES) and policy changes
    — proponents should avoid treating central-case modelled revenues as reliable
    forecasts given the structural uncertainty in long-duration storage market development.
  issue_severity: moderate
  project_type: storage
