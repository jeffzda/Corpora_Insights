- record_id: ARENA-DLV-20811
  source_title: South Middleback Ranges Pumped Hydro Energy Storage Project – Pre-feasibility
    Study Knowledge Sharing Report
  publish_date: '2019-07-10'
  project_name: South Middleback Ranges Pumped Hydro Energy Storage Project (SMRPHES)
  what_happened: The final project configuration, revenue case, and investment decision
    were all contingent on a third-party regulatory outcome — the Australian Energy
    Regulator's decision on ElectraNet's proposed Eyre Peninsula transmission network
    upgrade — which was still pending at the time of the study.
  lesson_learnt: PHES developers in transmission-constrained regions should not advance
    detailed feasibility work or commit capital contingent on a network augmentation
    regulatory decision they cannot influence — project sequencing should either have
    a viable base case within existing network capacity or explicitly stage investment
    gating around the regulatory milestone.
