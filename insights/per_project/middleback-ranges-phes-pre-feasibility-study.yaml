- record_id: ARENA-DLV-20802
  source_title: South Middleback Ranges Pumped Hydro Energy Storage Project – Pre-feasibility
    Study Knowledge Sharing Report
  publish_date: '2019-07-10'
  project_name: South Middleback Ranges Pumped Hydro Energy Storage Project (SMRPHES)
  what_happened: Site identification — often described as one of the most problematic
    aspects of new-build hydropower — was resolved by repurposing the Iron Duchess
    North mine pit and waste rock dumps, with existing mining infrastructure providing
    direct constructability advantages and cost synergies unavailable at greenfield
    sites.
  lesson_learnt: For new PHES projects, actively screening active or post-mining sites
    as candidate locations can eliminate the most difficult site-identification challenge
    and deliver material capital cost reductions through reuse of existing infrastructure
    and topography shaped by ongoing operations.
