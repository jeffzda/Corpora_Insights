- record_id: ARENA-DLV-20803
  source_title: South Middleback Ranges Pumped Hydro Energy Storage Project – Pre-feasibility
    Study Knowledge Sharing Report
  publish_date: '2019-07-10'
  project_name: South Middleback Ranges Pumped Hydro Energy Storage Project (SMRPHES)
  what_happened: The existing Cultana–Yadnarie 132 kV transmission line connecting
    to the nearest substation had a maximum available capacity of only 90–130 MW depending
    on weather conditions, with no scope for capacity increase without substantial
    pole and line replacement — creating a binding constraint on the project's generation
    capacity options.
  lesson_learnt: PHES developers in regional locations should assess existing transmission
    line thermal ratings and upgrade feasibility as an early gate — a constrained
    line with no low-cost upgrade path caps achievable generation capacity and can
    make larger project configurations commercially unviable without a network augmentation
    decision by the relevant NSP.
  issue_severity: major
  project_type: storage
  project_scale_band: demonstration
  lifecycle_phase: concept/feasibility
  proponent_type: industrial operator
  delay_category: grid connection/system studies
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: regulatory & approvals
  intervention_note: Larger capacity options (220 MW, 330 MW) were scoped assuming
    an ElectraNet Eyre Peninsula transmission upgrade then under AER consideration,
    making project viability contingent on a third-party regulatory investment decision.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: pumped hydro
  source_pages: &id003
  - 18
  evidence_excerpt: The Cultana-Yadnarie transmission line has a maximum available
    capacity on hot days of 90 MW, and up to ~130 MW in cooler weather. There is no
    scope for increasing the capacity of the transmission line without substantial
    pole and line replacement.
  confidence_note: issue_severity set to major because the transmission constraint
    directly caps the base-case generation capacity and makes larger configurations
    dependent on a regulatory outcome outside the proponent's control.
