- record_id: ARENA-DLV-20808
  source_title: South Middleback Ranges Pumped Hydro Energy Storage Project – Pre-feasibility
    Study Knowledge Sharing Report
  publish_date: '2019-07-10'
  project_name: South Middleback Ranges Pumped Hydro Energy Storage Project (SMRPHES)
  what_happened: Water supply for the first fill was identified as requiring sourcing
    from SA Water, with ongoing top-up also dependent on existing water supply lines,
    but a detailed forward work plan for water (including transfer system design,
    pumping plan, evaporation management, and water chemistry management) had not
    yet been developed at pre-feasibility stage.
  lesson_learnt: Water supply planning for mine-pit PHES projects should be elevated
    to a formal work stream early in feasibility — first fill volumes, evaporation
    losses, water chemistry management, and regulatory water licences all represent
    potential project-critical constraints that require dedicated investigation before
    committing to detailed design.
  issue_severity: minor
  project_type: storage
