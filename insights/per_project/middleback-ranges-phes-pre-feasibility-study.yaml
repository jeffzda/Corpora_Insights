- record_id: ARENA-DLV-20812
  source_title: South Middleback Ranges Pumped Hydro Energy Storage Project – Pre-feasibility
    Study Knowledge Sharing Report
  publish_date: '2019-07-10'
  project_name: South Middleback Ranges Pumped Hydro Energy Storage Project (SMRPHES)
  what_happened: The pre-feasibility study assumed regulatory approvals and secure
    long-term tenure would ultimately be obtained, without conducting detailed assessment
    of either — these were explicitly listed as assumptions rather than confirmed
    conditions, representing unresolved project risks carried forward into subsequent
    phases.
  lesson_learnt: Regulatory approval pathways and tenure security for mine-site PHES
    projects should be substantively assessed — not assumed — at pre-feasibility stage;
    unresolved tenure and approvals risks carried into feasibility can materialise
    as schedule and cost overruns when regulatory complexity is discovered late.
