- record_id: ARENA-DLV-20804
  source_title: South Middleback Ranges Pumped Hydro Energy Storage Project – Pre-feasibility
    Study Knowledge Sharing Report
  publish_date: '2019-07-10'
  project_name: South Middleback Ranges Pumped Hydro Energy Storage Project (SMRPHES)
  what_happened: Revenue modelling by Jacobs showed that price arbitrage and FCAS
    revenues for the 110 MW base case averaged ~$24M/year against a P50 capital cost
    of $452M (33% contingency included), producing a revenue-to-capex ratio that the
    study itself characterised as 'relatively modest' given the critical grid support
    role of such assets.
  lesson_learnt: PHES project business cases should not be evaluated on merchant energy-arbitrage
    and FCAS revenues alone — the gap between private investor returns and public
    benefit (consumer surplus) is material enough that project proponents should explore
    contract structures, capacity payments, or co-investment models to bridge the
    commercial viability gap.
  issue_severity: moderate
  project_type: storage
  project_scale_band: demonstration
  lifecycle_phase: concept/feasibility
  proponent_type: industrial operator
  delay_category: null
