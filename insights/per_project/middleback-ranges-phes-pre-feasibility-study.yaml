- record_id: ARENA-DLV-20801
  source_title: South Middleback Ranges Pumped Hydro Energy Storage Project – Pre-feasibility
    Study Knowledge Sharing Report
  publish_date: '2019-07-10'
  project_name: South Middleback Ranges Pumped Hydro Energy Storage Project (SMRPHES)
  what_happened: A pre-feasibility study was completed for a 110 MW / 1,500 MWh pumped
    hydro facility using an existing iron ore mine pit as the lower reservoir. The
    study found no fatal engineering flaws but concluded that a preferred single design
    and layout could not yet be selected, with 11 design options still under active
    consideration.
  lesson_learnt: At pre-feasibility stage for mine-pit PHES projects, committing to
    a single design layout prematurely risks costly rework — deferring final configuration
    selection until after full feasibility study, electricity market analysis, and
    confirmation of transmission upgrade decisions is the appropriate sequencing.
