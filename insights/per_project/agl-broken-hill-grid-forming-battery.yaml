  intervention_note: A Working Group including AEMO and Transgrid was established
    to validate methodology, assumptions and models; real-time EMT digital simulation
    with hardware-in-the-loop (HiL) testing was adopted to validate grid-forming controller
    performance in lieu of standard offline EMT simulations.
