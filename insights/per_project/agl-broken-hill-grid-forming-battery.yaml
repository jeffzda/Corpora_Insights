  evidence_excerpt: a higher inertia constant (ie. more megawatts injected into system)
    is not necessarily good for weak grid condition as it would lead to depressed
    voltage levels resulting in fault ride through... in networks with lower system
    strength, increasing inertia is observed to induce greater voltage swings during
    frequency change tests.
