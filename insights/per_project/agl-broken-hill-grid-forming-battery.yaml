  project_name: Broken Hill Battery Energy Storage System (BHBESS)
  what_happened: At project commencement, grid-forming (GFM) inverter technology was
    not well understood by the project team or industry stakeholders. Multiple briefings
    were required to establish a common baseline understanding of GFM inverter capabilities,
    operating principles (power-synchronisation loops vs. phase-locked loops), and
    key differences from grid-following (GFL) inverters before technical discussions
    could proceed effectively.
  lesson_learnt: For projects deploying novel or emerging inverter technologies, conduct
    structured technology education sessions with all key internal and external stakeholders
    at project outset — establishing a shared vocabulary and technical baseline prevents
    misaligned assumptions from compounding into design and approval delays later.
