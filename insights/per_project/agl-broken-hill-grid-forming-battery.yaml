  what_happened: The remote location of the BHBESS site near Broken Hill, combined
    with inconvenient flight schedules and distance from major cities, caused severe
    shortages of competent engineers, tradespeople, and contractors throughout construction
    and commissioning. Contractors frequently flew in resources from interstate (including
    Queensland), and rectification of issues was delayed due to extended mobilisation
    times. Low resource retention was an ongoing problem.
  lesson_learnt: Projects in remote locations should allocate additional time and
    cost contingencies specifically to account for resource scarcity, high turnover,
    and extended mobilisation times — the Broken Hill location severely impacted schedule
    and required interstate resource mobilisation throughout construction and commissioning.
