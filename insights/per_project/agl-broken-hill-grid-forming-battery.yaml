  evidence_excerpt: Due to the extremely low SCR of 1.997, BHBESS inverter current
    controllers were tuned to provide ride through stability which resulted in slow
    reactive current response times during a fault. Compliance was a concern to meet
    the rule requirements of 40ms rise time and 70ms settling time. When considering
    a higher SCR of 4.115, the current controller could be sped up to meet these requirements
    without jeopardising fault ride through stability.
