  project_name: Broken Hill Battery Energy Storage System (BHBESS)
  what_happened: The connection application required submission of numerous critical
    documents — including connection application checklists, R1 submission checklists,
    power system model guidelines, communication failure guidelines, and dynamic model
    acceptance guidelines — many of which needed to be provided by the OEM. Delays
    in obtaining these OEM-supplied documents generated unnecessary queries from AEMO
    and Transgrid and slowed the application process.
  lesson_learnt: Establish regular structured communication channels (weekly meetings)
    with AEMO and the TNSP from the start of the connection application process —
    this cadence materially accelerates issue resolution and approval. Also engage
    the OEM directly with the network operators rather than routing all technical
    queries through the proponent, as direct OEM-TNSP/AEMO engagement can expedite
    the overall process.
