  evidence_excerpt: Power plant controllers (PPC) for existing inverter-based resources
    are most commonly designed to send active and reactive power commands to inverters
    in alignment with grid-following control logic. For BHBESS, due to the grid-forming
    need for a voltage and frequency reference, an additional layer of control is
    required to convert the PPC active and reactive power commands into usable voltage
    and frequency commands... The virtual inertia response of the plant is typically
    slow compared to grid-following devices, in the order of 1s response times, and
    as such a slow active power output from the PPC is required to ensure stability.
