  publish_date: '2024-09-27'
  project_name: Broken Hill Battery Energy Storage System (BHBESS)
  what_happened: The primary plant design was simplified due to space constraints,
    omitting a dedicated incoming switchyard with primary circuit breaker switchgear
    and instead relying on a single isolation point with direct feeds to downstream
    switchgear. This created extensive intertripping and interlocking interdependencies
    across downstream equipment, significantly increasing design coordination complexity,
    construction coordination burden, and commissioning difficulty.
  lesson_learnt: Adopt a standardised primary plant design even when space is constrained
    — a simplified non-standard switchyard design that eliminates primary circuit
    breakers creates complex downstream interdependencies that substantially increase
    commissioning difficulty and ongoing maintenance risk.
