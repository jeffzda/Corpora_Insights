- record_id: ARENA-DLV-35762
  source_title: AGL - AGL Broken Hill Grid-Forming Battery - Lessons Learnt Report
    2
  publish_date: '2024-09-27'
  project_name: Broken Hill Battery Energy Storage System (BHBESS)
  what_happened: 'During wide-area PSCAD studies conducted by Transgrid and AEMO for
    the 5.3.9 process, the BHBESS exhibited multiple technical non-conformances in
    grid-forming mode: reactive current (Iq) did not follow the Iq reference during
    shallow faults; the plant response was inconsistent and unstable during disturbances;
    uncontrolled behaviour was observed for timeframes greater than 200ms; and the
    plant tripped on certain multiple fault ride-through sequences with inter-fault
    intervals less than 250ms. These issues were not fully resolved prior to registration
    and required a post-registration s5.3.9 process.'
  lesson_learnt: Grid-forming BESS projects should plan for a post-registration performance
    improvement process (s5.3.9) from the outset when grid-forming expectations are
    not fully defined at project inception — deferring resolution of GFM performance
    gaps to after registration incurs additional cost, resourcing, and regulatory
    process burden.
  issue_severity: major
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: commissioning/integration
  proponent_type: utility/energy retailer
  delay_category: approvals/regulatory
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: AGL accepted negotiated access standards for multiple FRT fault
    sequences at registration and committed to a post-registration s5.3.9 firmware/software
    update process with Transgrid and AEMO to address the identified GFM performance
    gaps.
  transferability: narrow
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id025
  - 14
  - 15
  - 16
  evidence_excerpt: As discussed earlier, GFM expectations were not well defined at
    the project's outset, which is why the project is proceeding with this change
    at a later stage instead of addressing these issues from the beginning. This highlights
    the need for future projects to have some flexibility in the NER to accommodate
    new technologies and for NSPs or regulatory bodies to treat them differently.
  confidence_note: This record captures the cluster of GFM technical non-conformances
