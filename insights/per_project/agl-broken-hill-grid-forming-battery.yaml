- record_id: ARENA-DLV-1208
  source_title: AGL - Broken Hill Grid-Forming Battery - Lessons Learnt Report 1
  publish_date: 2023-11
  project_name: Broken Hill Battery Energy Storage System (BHBESS)
  what_happened: Grid-forming inverters operate without triggering Transient Reactive
    Current (TRC) support during shallow faults (voltage events remaining within FRT
    thresholds), producing a different response to fault events than grid-following
    inverters. The NER requirement for reactive current injection during faults —
    prescriptive at 2% of maximum continuous current per 1% voltage change — was incompatible
    with voltage source (grid-forming) inverter operation and represented a structural
    regulatory barrier to deploying BHBESS in full grid-forming mode.
  lesson_learnt: Proponents deploying grid-forming BESS under the NER should be aware
    that pre-April 2023 reactive current injection rules were designed for grid-following
    inverters and effectively precluded grid-forming operation during faults. The
    rule change on 20 April 2023 (relaxing the reactive current obligation to 'greater
    than 0%') removes this barrier — but residual work is still required on reactive
    current settling times and unbalanced fault stability before full grid-forming
    FRT functionality can be implemented.
  issue_severity: major
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: approvals/contracting
  proponent_type: utility/energy retailer
