- record_id: ARENA-DLV-19704
  source_title: AGL 'Broken Hill Grid-Forming Battery' System Strength Modelling Knowledge
    Sharing Report
  publish_date: 2023-11
  project_name: Broken Hill Battery Energy Storage System (BHBESS)
  what_happened: Under very low SCR conditions, a large active power change caused
    voltage to rise or drop enough to enter FRT condition, and in some cases the plant
    became stuck at a lower voltage operating point (0.86 pu instead of 1.0 pu) due
    to the dual-solution nature of the AC power transfer equation — unable to exit
    without an external change to grid voltage or plant setpoint.
  lesson_learnt: For grid-forming BESS projects at very weak network locations (SCR
    close to 2), active power changes will cause significant RMS voltage coupling
    effects that do not appear in stronger networks; GPS compliance testing must account
    for this and plant settings must be tuned accordingly rather than using parameters
    optimised for stronger grid locations.
  issue_severity: major
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: commissioning/integration
  proponent_type: utility/energy retailer
  delay_category: grid connection/system studies
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated integration
  intervention_note: Plant operating mode was constrained to voltage control mode
    (which actively damps voltage oscillations) rather than reactive power or power
    factor control modes where no voltage feedback exists.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages:
  - 35
  - 36
  - 37
  - 40
  - 41
  evidence_excerpt: If PoI voltage drops below the asymptote of the curve, a subsequent
    increase in the infinite source voltage magnitude can cause the PoI voltage to
    drop further and settle at lower voltage point (0.86 pu) instead of the intended
    PoI voltage (1.0 pu). The plant then remains stuck in this state and is unable
    to exit it without an external change to the grid voltage and phase angle, or
    plant voltage setpoint change.
