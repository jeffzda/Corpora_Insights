- record_id: ARENA-DLV-35757
  source_title: AGL - AGL Broken Hill Grid-Forming Battery - Lessons Learnt Report
    2
  publish_date: '2024-09-27'
  project_name: Broken Hill Battery Energy Storage System (BHBESS)
  what_happened: During HP1 commissioning testing, the BESS exhibited underdamped
    reactive power oscillations (1–2 cycles) during a voltage reference step test
    with a single inverter online. These oscillations could not initially be replicated
    in either PSCAD or PSSE simulation models, raising questions about model validity
    and blocking progression from HP1 to HP2. AGL and Fluence spent significant time
    creating single-inverter modelling cases to replicate the observed behaviour.
  lesson_learnt: For grid-forming BESS projects at weak-grid nodes, proponents should
    plan from the outset for small-signal stability modelling — the standard SMIB
    PSCAD model cannot capture network-driven oscillations from nearby assets such
    as SVCs and wind farms, and reliance on AEMO/NSP FIA studies to diagnose oscillation
    sources creates significant schedule dependency.
  issue_severity: major
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: commissioning/integration
  proponent_type: utility/energy retailer
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: delayed but recoverable
  secondary_failure_mode: data & measurement
  intervention_note: AGL and Fluence created a single-inverter modelling case in PSCAD
    and PSSE to replicate the oscillations; an extended SMIB model was subsequently
    developed in HP2 to capture upstream network interactions including nearby SVCs,
    solar farms, and wind farms.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages:
  - 11
  - 12
  - 13
  evidence_excerpt: Since AGL does not have a wide-area PSCAD model, it remained unclear
    whether these oscillations result from network interactions. This can only be
    confirmed through limited FIA studies, which can only be performed by AEMO or
    the NSP. However, FIA studies might not always be sufficient to reproduce the
    oscillations, hence a small-signal model analysis may be required to determine
    the source of the oscillations. Therefore, development of a small-signal model
    is a key lesson for future projects.
