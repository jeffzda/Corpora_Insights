  what_happened: Battery cooling systems experienced intermittent leaks at T-joints
    during commissioning, caused by thread damage during cap fit-up using thread sealing
    tape. Each battery cube had been pressure tested in the factory for only five
    minutes, which was insufficient to detect the defect. T-joints required on-site
    replacement and redesign.
