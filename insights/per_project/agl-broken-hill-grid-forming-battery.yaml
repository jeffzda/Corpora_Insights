- record_id: ARENA-DLV-19705
  source_title: AGL 'Broken Hill Grid-Forming Battery' System Strength Modelling Knowledge
    Sharing Report
  publish_date: 2023-11
  project_name: Broken Hill Battery Energy Storage System (BHBESS)
  what_happened: Virtual inertia constants and damping factors were found to behave
    fundamentally differently in a low SCR network compared to stronger grid locations.
    A high inertia constant combined with low SCR active power-voltage sensitivity
    could cause voltage collapse; a very small inertia constant (IC = 0.1) with damping
    factor of 10 or 12 was found to be necessary for stable operation.
  lesson_learnt: Virtual inertia and damping factor settings optimal for a strong
    grid are not transferable to weak grid (low SCR) locations — for BESS projects
    at SCR near 2, use a low inertia constant (e.g. IC = 0.1) and test a range of
    damping factors; do not rely on default or higher inertia settings without site-specific
    sensitivity analysis.
  issue_severity: major
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: commissioning/integration
  proponent_type: utility/energy retailer
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Extensive sensitivity analysis across multiple IC and DF combinations
    was performed; IC = 0.1 with DF = 10 or 12 was confirmed as the optimal setting,
    reducing active power dip on frequency disturbance clearance by up to 50%.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
