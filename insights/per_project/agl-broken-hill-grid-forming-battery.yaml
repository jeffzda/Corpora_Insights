  source_title: AGL 'Broken Hill Grid-Forming Battery' System Strength Modelling Knowledge
    Sharing Report
  publish_date: 2023-11
  project_name: Broken Hill Battery Energy Storage System (BHBESS)
  what_happened: During shallow unbalanced faults in grid-forming mode, the inverter's
    grid-side current estimation (based on a model from converter-side current and
    grid voltage) had finite bandwidth, causing ramp-like rather than instantaneous
    dynamics during fault events; voltage measurement bandwidth limitations further
    contributed to delayed response.
  lesson_learnt: Grid-forming inverter response to shallow unbalanced faults is constrained
    by the bandwidth of grid-side current estimation and voltage measurement — project
    teams should test shallow unbalanced fault performance explicitly and work with
    the OEM to understand estimation accuracy limitations before finalising GPS compliance
    submissions.
