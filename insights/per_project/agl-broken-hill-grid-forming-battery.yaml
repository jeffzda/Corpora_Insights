- record_id: ARENA-DLV-35764
  source_title: AGL - AGL Broken Hill Grid-Forming Battery - Lessons Learnt Report
    2
  publish_date: '2024-09-27'
  project_name: Broken Hill Battery Energy Storage System (BHBESS)
  what_happened: The BHBESS power system models (PSCAD SMIB) were not tuned for single-inverter
    response during the early regulatory study stages (R0, R1), and were developed
    as aggregated models only. When single-inverter behaviour observed during HP1
    commissioning testing diverged from model predictions, this gap in model preparation
    created significant uncertainty and rework, including repeat tests and new modelling
    work during HP2.
  lesson_learnt: Power system study models for BESS should be developed and validated
    at the single-inverter level from the earliest regulatory study stages (R0/R1)
    — aggregated models that are not validated for single-inverter response will create
    model credibility challenges and costly retesting when single-inverter commissioning
    behaviour diverges from predictions.
  issue_severity: major
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: data/validation/testing
  failure_mode: unvalidated integration
  outcome_class: delayed but recoverable
  secondary_failure_mode: data & measurement
  intervention_note: AGL and Fluence created a single-inverter PSCAD/PSSE modelling
    case during HP2 and developed an extended SMIB model to capture upstream network
    asset interactions, enabling progression to commercial operation.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
