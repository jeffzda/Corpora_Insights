- record_id: ARENA-DLV-35761
  source_title: AGL - AGL Broken Hill Grid-Forming Battery - Lessons Learnt Report
    2
  publish_date: '2024-09-27'
  project_name: Broken Hill Battery Energy Storage System (BHBESS)
  what_happened: The NER technical requirements (s5.2.5) for reactive current injection
    changed during the project lifecycle. The settling time requirement was removed
    and a commencement time requirement was introduced; wording for reactive current
    injection during balanced and unbalanced faults was also modified. These changes
    were required because grid-forming inverters operate as voltage sources with no
    direct current control, and the original NER requirements were written for grid-following
    devices. This required significant functional and architectural changes to the
    inverter.
  lesson_learnt: The NER framework was not designed for grid-forming inverters and
    requires flexibility to accommodate voltage-source-type devices — future grid-forming
    BESS projects should advocate early for technology-appropriate GPS requirements
    and engage with NSPs and AEMO during the design phase to understand how evolving
    NER clauses will be applied to novel inverter architectures.
  issue_severity: major
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: approvals/contracting
  proponent_type: utility/energy retailer
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: NER s5.2.5 requirements were modified to accommodate grid-forming
    inverter behaviour; BHBESS inverter architecture was adjusted accordingly and
    the project proceeded to registration under the revised framework.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id024
  - 13
  - 17
  evidence_excerpt: The contemporary NER primarily focuses on grid-following capabilities,
    such as reactive current injection/absorption performance under S5.2.5.5 clauses.
    Since grid-forming BESS does not have direct control over current, meeting this
    GPS requirement necessitated significant functional and architectural changes
    to the project. This highlights the need for future projects to have some flexibility
    in the NER to accommodate new technologies and for NSPs or regulatory bodies to
    treat them differently.
