  what_happened: The Fire Safety Study for the Broken Hill BESS was submitted for
    approval in August 2022 but was not accepted by Fire and Rescue NSW (FRNSW) until
    mid-May 2023 — a process of approximately nine months. The extended duration arose
    because FRNSW was concurrently developing its own technical guidance on large-scale
    lithium-ion BESS fire safety (prompted partly by the 2021 Victorian Big Battery
    thermal event), leaving assessment criteria undefined and requirements open-ended.
    Development consent conditions were modified twice and a third modification was
    refused by DPE, directly impacting project cost and schedule.
  lesson_learnt: BESS projects should expect extended Fire Safety Study approval timelines
    where fire authorities are still developing assessment criteria for large-scale
    lithium-ion storage — the absence of an Australian Standard or legislative guidance
    means requirements can remain open-ended throughout the process. Allow at least
    9–12 months schedule contingency for fire safety approvals, engage FRNSW and the
    relevant fire authority as early as possible, and monitor the development of FRNSW
    technical guidance to anticipate evolving requirements.
