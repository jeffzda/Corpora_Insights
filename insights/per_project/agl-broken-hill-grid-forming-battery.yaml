  project_name: Broken Hill Battery Energy Storage System (BHBESS)
  what_happened: Core grid-forming inverter intellectual property (IP) — including
    functional block diagrams essential for AEMO and Transgrid due diligence — was
    not made available to AGL or its engineering consultant Aurecon. There was no
    direct communication channel between AGL/Aurecon and the OEM vendor, meaning AGL
    relied on indirect feedback via Transgrid. This restricted information flow complicated
    the connection approval process.
  lesson_learnt: When procuring grid-forming inverters, proponents should negotiate
    upfront contractual arrangements that give AEMO and the TNSP timely access to
    functional block diagrams and other IP-protected technical documentation required
    for due diligence — and establish a direct OEM-proponent-TNSP/AEMO communication
    channel. Leaving these arrangements to be resolved during the connection application
    process materially delays approvals.
