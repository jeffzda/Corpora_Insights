  what_happened: During Hold Point 2 (HP2) commissioning testing, AEMO halted testing
    for several days due to a forecasted Lack of Reserve (LOR) condition in NSW and
    concerns about reactive power oscillations observed during HP1. The BESS also
    had its output frequently curtailed below 50 MW by NEMDE during testing under
    N-1 network conditions, based on real-time line loading and thermal limitations.
  lesson_learnt: Commissioning testing schedules for grid-connected BESS at weak-grid
    locations should account for the risk that AEMO may curtail or halt hold point
    testing due to network conditions or LOR events — building schedule contingency
    for testing interruptions beyond the proponent's control is essential.
