  publish_date: '2024-09-27'
  project_name: Broken Hill Battery Energy Storage System (BHBESS)
  what_happened: Under minimum SCR conditions (new minimum of 4.12 at the 22kV POC
    bus), the BHBESS exhibited oscillations in reactive current (Iq) response when
    High Voltage Ride Through (HVRT) was activated, causing early HVRT exit. The cause
    was identified as an overly aggressive voltage response under the new SCR tuning,
    creating oscillation against the system voltage and a false trigger on the HVRT
    exit threshold.
  lesson_learnt: Grid-forming BESS inverter tuning must be validated across the full
    range of SCR conditions anticipated at the connection point, including minimum
    SCR cases — tuning optimised for nominal SCR conditions can produce oscillatory
    instability and false protection triggers under weak grid conditions, requiring
    post-registration remediation.
