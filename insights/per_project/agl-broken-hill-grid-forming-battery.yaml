- record_id: ARENA-DLV-1209
  source_title: AGL - Broken Hill Grid-Forming Battery - Lessons Learnt Report 1
  publish_date: 2023-11
  project_name: Broken Hill Battery Energy Storage System (BHBESS)
  what_happened: Grid-forming inverters switch to grid-following mode during fault
    events that exceed FRT thresholds, at which point the additional grid-forming
    control layers (virtual inertia loop, PI voltage/frequency controller) are disabled
    and the Power Plant Controller (PPC) commands are frozen. This mode-switching
    behaviour required additional bespoke control layer design to translate PPC active/reactive
    power commands into voltage and frequency references compatible with grid-forming
    operation — a layer not required for standard grid-following plants.
  lesson_learnt: Grid-forming BESS projects require an additional control layer between
    the Power Plant Controller and the grid-forming inverter to convert power commands
    into voltage and frequency references. This layer must be specifically designed
    and tuned for grid-forming applications — project teams should not assume existing
    PPC designs developed for grid-following inverters will be compatible, and should
    engage the OEM early on control layer architecture and fault mode transitions.
  issue_severity: moderate
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: commissioning/integration
  failure_mode: unvalidated integration
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: An additional control layer was designed to convert PPC active
    and reactive power commands into voltage and frequency references for the grid-forming
    inverter, bridging the incompatibility between standard PPC logic and grid-forming
    control requirements.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages:
  - 18
  - 19
  - 61
  evidence_excerpt: When the switch in mode occurs, the inverter resets internal states
    to pre-disturbance conditions. If pre-disturbance conditions are the same as post-disturbance,
    then very little switching transient is observed... A transient is then introduced
    as the inverters resettle to the new grid conditions. A transient due to change
    in states is unavoidable for all scenarios, but the transient has been observed
    to be sufficiently small such as to not drive an additional network disturbance.
