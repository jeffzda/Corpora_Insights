  source_title: AGL 'Broken Hill Grid-Forming Battery' System Strength Modelling Knowledge
    Sharing Report
  publish_date: 2023-11
  project_name: Broken Hill Battery Energy Storage System (BHBESS)
  what_happened: The virtual inertia of grid-forming inverters incorporates a slight
    measurement and switching delay (observed as 20–30 ms before the plant begins
    to respond to a frequency change), unlike synchronous generators whose inertia
    response begins instantaneously. The synthetic inertia constant also has a magnitude
    limit at very high rates of change of frequency.
  lesson_learnt: Project teams and network planners should not assume grid-forming
    BESS synthetic inertia is equivalent to physical synchronous inertia — the 20–30
    ms inherent delay and magnitude limits at high RoCoF are important differences;
    this distinction is particularly material for extremely weak grids or microgrids
    where even small response delays can affect stability.
