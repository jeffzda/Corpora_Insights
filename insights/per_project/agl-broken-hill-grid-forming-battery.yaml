    of fault ride-through meant BHBESS did not inject the normal reactive current
    profile for subsequent faults occurring within 250 ms of each other during multiple
    fault ride-through (MFRT) events.
  lesson_learnt: Grid-forming BESS with mode-switching will have an inherent limitation
    in MFRT reactive current response for faults close together in time (within ~250
    ms) due to the restrike mask time needed to prevent spurious retriggers — this
    should be declared in the connection application and tested explicitly; the critical
    MFRT objective is preventing cascaded network tripping, not reactive current injection
    compliance for every fault.
