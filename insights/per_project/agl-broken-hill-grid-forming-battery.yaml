  publish_date: 2023-11
  project_name: Broken Hill Battery Energy Storage System (BHBESS)
  what_happened: BHBESS inverter level AC over-voltage threshold was approximately
    1.3 pu, above which the BESS could lose control or stability — a threshold lower
    than inverter protection settings and one that could be reached at the inverter
    terminals even when connection point voltages nominally comply with NER network
    voltage standards.
  lesson_learnt: Unlike wind or solar farms, BESS inverters may have an AC over-voltage
    stability threshold significantly below protection trip settings — project teams
    must identify this threshold for their specific inverter and confirm through wide-area
    PSCAD modelling that no credible network fault can drive inverter terminal voltage
    above it.
