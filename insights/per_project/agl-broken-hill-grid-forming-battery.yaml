- record_id: ARENA-DLV-1207
  source_title: AGL - Broken Hill Grid-Forming Battery - Lessons Learnt Report 1
  publish_date: 2023-11
  project_name: Broken Hill Battery Energy Storage System (BHBESS)
  what_happened: Sensitivity analysis on virtual inertia constant (IC) and damping
    factor (DF) settings revealed that the initially configured values (IC=2.5, DF=62)
    caused aggressive active power swings under low Short Circuit Ratio (SCR=2) conditions,
    leading to voltage rise/drop and subsequent Fault Ride-Through (FRT) entry and
    re-striking. Higher virtual inertia, generally considered beneficial for frequency
    stability, was counterproductive in the weak Broken Hill network.
  lesson_learnt: In weak-grid environments with low short-circuit ratios, higher virtual
    inertia settings on grid-forming inverters can induce voltage instability rather
    than improve frequency performance — there is an inherent trade-off between inertia
    response and voltage stability. Grid-forming BESS projects in weak networks should
    perform dedicated sensitivity analysis on inertia and damping factor settings
    early in design, with minimised virtual inertia (e.g. IC=0.1, DF=12) likely to
    be more appropriate than default high-inertia configurations.
  issue_severity: moderate
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: grid connection/system studies
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: data & measurement
  intervention_note: AGL and Aurecon performed a four-scenario sensitivity analysis
    of IC and DF combinations; minimised virtual inertia settings (IC=0.1, DF=12)
    were adopted as providing the most stable voltage response across the range of
    frequency disturbance tests.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
