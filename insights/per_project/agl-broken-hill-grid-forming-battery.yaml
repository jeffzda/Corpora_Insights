  what_happened: Adjustments made to inverter tuning to dampen the reactive power
    oscillation response observed during commissioning significantly degraded performance
    on other GPS clauses, particularly frequency disturbance response. This created
    a risk that further tuning would invalidate the GPS study, potentially requiring
    the project to restart from the R0 regulatory stage.
  lesson_learnt: Inverter tuning changes made during commissioning to resolve one
    performance issue (oscillation damping) can adversely affect compliance with other
    GPS clauses — if point-of-connection responses already meet GPS requirements,
    avoid inverter re-tuning during commissioning as the GPS compliance risk and potential
    regulatory re-work outweigh the benefit.
