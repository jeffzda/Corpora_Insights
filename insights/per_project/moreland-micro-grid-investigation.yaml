  what_happened: The project found that network benefit magnitude is highly sensitive
    to the state of the local network — microgrids and virtual power plants provide
    the greatest financial value in areas of network constraint or poor power supply
    quality, where reduced connection fees or service payments are available, while
    the business case is weaker on unconstrained networks.
  lesson_learnt: Residential microgrid projects should prioritise deployment in areas
    of network constraint — the financial viability of in-front-of-the-meter models
    is strongly site-dependent and developers should use network constraint mapping
    to identify locations where network benefits are sufficient to anchor the business
    case before committing to a specific site.
