  project_name: Here Comes the Sun
  what_happened: Modelling showed that solar PV alone achieves only marginal reductions
    in overall peak demand from the network because residential peak demand occurs
    in the evening, outside the solar generation window. Solar reduced energy imported
    from the network by 40% but did not meaningfully shift the peak.
  lesson_learnt: Solar PV without battery storage is ineffective at reducing network
    peak demand in residential settings — batteries are required to shift generation
    to the evening peak period. Project designs targeting network peak reduction should
    not rely on solar-only configurations.
