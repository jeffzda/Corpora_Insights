- record_id: ARENA-DLV-1054
  source_title: Here Comes The Sun
  publish_date: null
  project_name: Here Comes the Sun
  what_happened: The project found that households were under-utilising available
    rooftop solar capacity because declining feed-in tariffs incentivised sizing systems
    to match maximum daily demand rather than rooftop capacity. Modelling showed that
    increasing solar by 40% above business-as-usual sizing and battery storage by
    50% could meet at least 80% of annual net energy needs locally.
  lesson_learnt: Microgrid and shared energy business cases should be designed around
    maximising available rooftop solar capacity rather than individual household demand
    matching — shared configurations can absorb the additional generation that would
    otherwise be uneconomic for individual households under low feed-in tariffs.
