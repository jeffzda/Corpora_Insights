  source_title: Here Comes The Sun
  publish_date: null
  project_name: Here Comes the Sun
  what_happened: Consumer research found that households strongly preferred a third-party
    or body corporate led model for microgrid governance, and were unwilling to recruit
    neighbours themselves or extend mortgages to finance participation. Payment preferences
    favoured financed purchase (42%) or upfront payment (35%), with ongoing fee arrangements
    (16%) significantly less popular.
  lesson_learnt: Residential microgrid projects should be structured with third-party
    governance and financing options — consumer-led models that require households
    to recruit neighbours or take on additional debt are unlikely to attract broad
    participation beyond innovator segments.
