  what_happened: The project found that Australia's existing grid infrastructure was
    designed for unidirectional power flow from central generators to consumers, meaning
    reverse power flow from distributed solar causes voltage regulation issues and
    potential safety risks that network operators must actively manage.
  lesson_learnt: Projects deploying distributed rooftop solar at scale must include
    voltage management strategies in their technical design — reverse power flow from
    distributed solar into networks designed for unidirectional flow creates voltage
    rise and variability issues that can result in solar export being curtailed or
    restricted by network operators, destroying project economics.
