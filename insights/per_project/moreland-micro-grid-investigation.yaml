  project_name: Here Comes the Sun
  what_happened: The project found that without a well-defined upfront legal agreement,
    shared microgrid arrangements among neighbouring households risk conflict over
    entry and exit rights, cost allocation, demand changes, plant replacement, and
    physical access — issues that are specific to the proximity and ongoing relationship
    of microgrid participants.
  lesson_learnt: Residential microgrid projects must establish binding legal agreements
    covering conflict resolution, entry and exit conditions, cost allocation, demand
    management, and physical access before deployment — failure to do so risks participant
    disputes that can undermine the entire arrangement, particularly given participants
    are neighbours with ongoing relationships.
