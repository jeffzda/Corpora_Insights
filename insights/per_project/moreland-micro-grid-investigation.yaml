  what_happened: At approximately $300/kWh installed, battery storage had not reached
    a price point viable for mass residential uptake at the time of the study. Market
    research found that approximately 53% of households intended to 'wait and see'
    on battery costs before purchasing.
  lesson_learnt: Battery cost is a primary barrier to residential microgrid uptake
