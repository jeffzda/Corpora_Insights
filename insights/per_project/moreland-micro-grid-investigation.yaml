  source_title: Here Comes The Sun
  publish_date: null
  project_name: Here Comes the Sun
  what_happened: Modelling found that in an uncoordinated 'shared energy only' scenario
    without demand management, batteries could discharge rapidly without solar generation,
    depleting by mid-evening and forcing the network to supply a late evening peak
    — potentially producing a higher critical peak than the business-as-usual scenario.
  lesson_learnt: Shared battery storage without coordination and demand management
    can worsen network peak events rather than reduce them — active energy management
    systems are essential for shared microgrid configurations to avoid unintended
    peak demand contributions.
