  project_name: Here Comes the Sun
  what_happened: The project identified that a capacity-based billing model (where
    each household is allocated and billed to an agreed maximum daily draw) is preferable
    to variable metered billing for shared microgrid systems, as it preserves privacy,
    aligns ownership proportionally to estimated demand, reduces risk of overconsumption
    of the shared resource, and simplifies system management.
  lesson_learnt: Shared microgrid billing models should be designed around agreed
    capacity limits rather than variable per-kWh metering — capacity-based models
    better manage the 'tragedy of the commons' risk, simplify governance, preserve
    household privacy, and create clearer incentives for energy conservation among
    participants.
