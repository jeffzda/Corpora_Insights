- record_id: ARENA-DLV-1058
  source_title: Here Comes The Sun
  publish_date: null
  project_name: Here Comes the Sun
  what_happened: The project found that shared microgrid arrangements face a significant
    financial viability constraint in 'in front of the meter' configurations because
    the costs and regulations associated with transporting energy across the grid
    can outweigh the benefits of sharing, particularly when network benefits are not
    explicitly recognised and remunerated in the business case.
  lesson_learnt: In-front-of-the-meter microgrid business cases must explicitly quantify
    and capture network benefits — projects that rely only on consumer-side savings
    are unlikely to be financially viable due to grid transport costs and regulatory
    charges. Engage network operators early to assess whether network constraint payments
    or reduced connection fees are available.
  issue_severity: major
  project_type: DER/customer-side
