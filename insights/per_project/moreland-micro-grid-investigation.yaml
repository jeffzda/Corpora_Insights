  source_title: Here Comes The Sun
  publish_date: null
  project_name: Here Comes the Sun
  what_happened: Market research with 107 Victorian households found that while 60%
    expressed interest in sharing arrangements, nearly a third (31%) simply wanted
    cheaper electricity and were indifferent to delivery method, and households generally
    lacked strong understanding of on-grid microgrid concepts. The research identified
    a gap between cited aspirations and likely uptake rates.
  lesson_learnt: Residential microgrid projects should not rely on stated consumer
    interest as a proxy for actual uptake — market assessments must distinguish aspirational
    responses from purchase-ready demand, and project designs must prioritise simplicity
    and cost competitiveness over technical sophistication to cross from innovator
    to early majority markets.
