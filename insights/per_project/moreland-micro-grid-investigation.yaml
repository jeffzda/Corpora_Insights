  source_title: Here Comes The Sun
  publish_date: null
  project_name: Here Comes the Sun
  what_happened: The legal and regulatory review found that existing Australian energy
    law creates significant obstacles for residential microgrid deployment, including
    monopoly distribution rights, licensing requirements to sell electricity, and
    the need for private easements to cross private land titles — none of which were
    designed with neighbourhood sharing arrangements in mind.
  lesson_learnt: Residential microgrid projects must undertake a detailed legal and
    regulatory feasibility assessment before committing to a delivery model — the
    current regulatory framework was not designed for neighbourhood energy sharing
    and multiple approvals, licences, and legal instruments (easements, body corporate
    agreements) are required before any physical deployment.
