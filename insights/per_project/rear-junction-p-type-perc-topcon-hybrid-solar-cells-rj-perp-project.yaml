  project_name: Rear-Junction Back-Contact Silicon Solar Cells (RJ-PERP)
  what_happened: The project achieved its end-goal cell efficiency target of 24% at
    manufacturing scale ahead of schedule, attributed to strong industry engagement
    and rapid translation of technology improvements through collaboration with multiple
    international cell and module manufacturers.
  lesson_learnt: Building a multi-partner industry collaboration spanning the full
    supply chain — from paste manufacture through cell processing to module assembly
    — accelerates research translation and can enable milestone targets to be achieved
    significantly ahead of schedule in solar cell R&D projects.
