  evidence_excerpt: The rate of change of technology development at industrial scale
    is exceeding all expectations. Industry is actively seeking opportunities to test
    the limit of silicon cell technologies. Project 'proof of concept' technologies
    for back-contact, rear-junction technologies are being brought forward in research
    and in pilot scale manufacturing, driven by industry interest and competition
    to stay ahead on cell performance.
  confidence_note: issue_severity set to minor as the faster-than-expected pace was
    an upside surprise rather than a damaging delivery failure; design assumption
    failure used because the original project pace assumptions proved incorrect.
