- record_id: ARENA-DLV-37251
  source_title: UNSW - Rear-Junction p-type PERC/TOPCon Hybrid Solar Cells (RJ-PERP)
    - Interim Public Dissemination Report
  publish_date: 2024-07
  project_name: Rear-Junction Back-Contact Silicon Solar Cells (RJ-PERP)
  what_happened: The pace of industrial-scale technology development in back-contact,
    rear-junction silicon solar cells exceeded project expectations, with industry
    partners advancing proof-of-concept technologies into pilot-scale manufacturing
    faster than anticipated, driven by competitive pressure on cell performance.
  lesson_learnt: Research programs targeting next-generation solar cell technology
    must maintain close, continuous engagement with industry partners to stay aligned
    with the accelerating pace of industrial learning — failure to do so risks research
    becoming obsolete before commercialisation milestones are reached.
  issue_severity: minor
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Team maintained active industry engagement through regular online
    meetings, on-site research exchanges, and attendance at major tradeshows such
    as SNEC 2024, enabling rapid translation of technology improvements.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
