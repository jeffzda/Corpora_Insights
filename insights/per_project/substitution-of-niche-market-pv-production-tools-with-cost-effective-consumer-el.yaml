- record_id: ARENA-DLV-10854
  source_title: Substitution of Niche-Market PV Production Tools with Cost-Effective
    Technology
  publish_date: 2022-01
  project_name: Substitution of niche-market PV production tools with cost-effective
    consumer-electronics technology
  what_happened: Testing of low-cost consumer thermal cameras (operating in the 7–14
    µm wavelength range) for solar cell process monitoring revealed that silicon solar
    cells behave as mirrors and semi-transparent windows at these wavelengths, making
    low-cost thermal cameras unsuitable as direct drop-in replacements for conventional
    production thermal cameras (3–5 µm range) without significant adaptation to account
    for the fundamentally different optical behaviour.
  lesson_learnt: Before deploying low-cost thermal cameras for solar cell inspection,
    verify their operating wavelength range — cameras in the 7–14 µm range cause silicon
    wafers to appear mirror-like or semi-transparent, producing misleading thermal
    images; this optical behaviour must be characterised and compensated for before
    the technology can be used reliably for defect detection or process monitoring.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: lab/bench
  lifecycle_phase: development/design
