  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Engaged industry expert consultants Solinno Pty Ltd to conduct
    detailed cost-benefit modelling across all three technology streams, with flatbed
    scanner technology identified as the priority for phase 2 development.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages:
