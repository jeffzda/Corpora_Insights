- record_id: ARENA-DLV-10852
  source_title: Substitution of Niche-Market PV Production Tools with Cost-Effective
    Technology
  publish_date: 2022-01
  project_name: Substitution of niche-market PV production tools with cost-effective
    consumer-electronics technology
  what_happened: Plasma arcing occurred in the microwave cavity when smaller rectangular
    silicon samples were used, causing non-uniform heating, temperature control difficulties,
    sample cracking, and reduced magnetron lifetime. The issue was resolved by switching
    to circular samples and ensuring full-sized wafers (6 inches and larger) were
    lifted at least 5 cm above the cavity base on a non-absorbing, non-conductive
    support.
  lesson_learnt: When using microwave cavities for silicon processing, use circular
    or full-sized wafers (≥6 inches) and elevate samples at least 5 cm above the cavity
    base on a non-absorbing, non-conductive support to prevent plasma arcing and the
    associated heating non-uniformity, sample damage, and magnetron degradation.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Switched to circular samples and elevated full-sized wafers at
    least 5 cm above the microwave cavity base using a non-absorbing, non-conductive
    support, which eliminated arcing.
  transferability: narrow
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id002
  - 6
  evidence_excerpt: We were able to reduce the arcing by using circular samples. Further,
    we learned that the full-size wafers (6 inches and more) do not have the problem
    of arcing in the microwave, even with the rectangular shape and sharp edges. To
    achieve this, the sample needs to be lifted at least 5 cm above the base of the
    microwave cavity by a non-absorbing and non-conductive material.
