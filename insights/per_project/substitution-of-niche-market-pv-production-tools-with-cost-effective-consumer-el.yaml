- record_id: ARENA-DLV-60357
  source_title: Substitution of Niche-Market PV Production Tools with Cost-Effective
    Consumer-Electronics Report
  publish_date: '2023-02-27'
  project_name: Substitution of Niche-Market PV Production Tools with Cost-Effective
    Consumer-Electronics
  what_happened: The Raspberry Pi Pico microcontroller used in the flatbed scanner
    prototype limited data transfer speed, resulting in prototype measurement throughput
    (25–1,800 samples/hour depending on use case) that was materially slower than
    typical PV production line speeds of 3,600 cells/hour, with luminescence imaging
    at only 25 samples/hour representing the most severe gap.
  lesson_learnt: When designing low-cost measurement tools for integration into high-throughput
    PV production lines, the microcontroller and analogue front-end must be specified
    to match production line speeds from the outset — using a consumer microcontroller
    such as the Raspberry Pi Pico creates a data transfer bottleneck that can make
    in-line deployment impractical; a dedicated high-speed analogue front end (e.g.
    WM8255) and a fast microcontroller (e.g. Teensy 4) are needed and add only approximately
    $50 to the build cost.
