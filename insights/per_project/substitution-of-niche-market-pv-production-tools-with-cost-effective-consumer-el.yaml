  what_happened: Microwave lamination of a single-cell mini module was achieved in
    7 minutes at 400 W — one minute faster than the latest industrial-scale laminator
    — using selective heating of silicon via microwave absorption without arcing,
    leveraging the transparency of glass and EVA/POE laminates to microwaves at room
    temperature.
  lesson_learnt: Microwave absorption enables selective, faster lamination by heating
    silicon directly rather than transferring heat through bulk glass and backsheet
    layers — accurate control of microwave power and resonant cavity design compatible
    with in-line processing are the key engineering requirements for scaling this
    approach.
