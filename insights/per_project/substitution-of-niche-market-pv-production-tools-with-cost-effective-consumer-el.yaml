  evidence_excerpt: The current solar cell production line speed is an average of
    3,600 cells/hour. However, implementing the scanner within sections of other tools
    means having to capture data at the same throughput... Comparing to the measurement
    speed of each use-case of the flatbed scanner prototype listed in Table 1 for
    low-resolution results, the manufacturing speed is faster, indicating that the
    measurement speed of the prototype needs to be increased. The main limit factor
    of the prototype measurement speed lies in the microcontroller. The Raspberry
    Pi Pico microcontroller limits the speed of data transfer between the flatbed
    scanner and the computer.
