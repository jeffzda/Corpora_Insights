  - 4
  evidence_excerpt: The first part of this project found the microwave and flatbed
    scanner streams to be the most technologically promising with both streams offering
    useful PV production capabilities achievable at relatively lost cost compared
    to conventional approaches. However, further economic modelling and analysis determined
    that the flatbed scanner technology was the overall best candidate for further
    development and advancement in technology readiness level within the scope and
    timescales of the project.
