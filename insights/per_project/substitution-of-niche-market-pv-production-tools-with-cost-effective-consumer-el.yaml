  evidence_excerpt: In the 7 to 14 µm range a solar cell behaves as a mirror, and
    so we can see a well-defined reflection of this hot block... Changing from thermal
    cameras that operate in the 3-5 µm range to the 7-14 µm range has significant
    implications for the application of monitoring solar cells.
