- record_id: ARENA-DLV-10851
  source_title: Substitution of Niche-Market PV Production Tools with Cost-Effective
    Technology
  publish_date: 2022-01
  project_name: Substitution of niche-market PV production tools with cost-effective
    consumer-electronics technology
  what_happened: During microwave processing experiments, the project found that infrared
    thermometry systematically underestimates internal sample temperature because
    microwave heating generates heat from the inside out, leaving the surface cooler
    than the interior — the opposite of conventional heating. This led to incorrect
    temperature measurements and has caused other research groups to wrongly report
    'non-thermal effects'.
  lesson_learnt: When designing microwave-based thermal processes for silicon solar
    cells, do not rely on surface IR thermometry alone — develop mathematical models
    or alternative measurement approaches to estimate internal temperature, particularly
    when insulating layers are present, to avoid systematic underestimation and false
    conclusions about non-thermal effects.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: The team developed mathematical models to estimate the transient
    temperature of the cell under a glass plate, enabling more accurate temperature
    measurement during microwave processing.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id001
  - 5
  - 6
  evidence_excerpt: As IR thermometry only captures the temperature at the surface,
    this measurement technique leads to an underestimation of the temperature. This
    problem becomes more severe when there are insulating layers on the sample, e.g.
    glass plates on a silicon solar cell. This is a common problem when working with
    microwaves and has resulted in several research groups wrongly reporting 'non-thermal
    effects' in microwave processing.
  confidence_note: null
