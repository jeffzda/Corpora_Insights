- record_id: ARENA-DLV-10853
  source_title: Substitution of Niche-Market PV Production Tools with Cost-Effective
    Technology
  publish_date: 2022-01
  project_name: Substitution of niche-market PV production tools with cost-effective
    consumer-electronics technology
  what_happened: The project discovered that standard lens-based CCD flatbed scanners
    produce inaccurate measurements of solar cells because their built-in flat-field/vignetting
    correction is optimised for documents and photos, not for the uniform reflectance
    characteristics of solar cells. Contact image sensor (CIS) scanners do not have
    this limitation and provide reliable, consistent data across the full cell area.
  lesson_learnt: Future projects using flatbed scanners for solar cell quality control
    should specify contact image sensor (CIS) type scanners rather than standard CCD
    lens-based models — CIS scanners provide accurate uniform intensity data across
    solar cells, are cheaper, lighter, and smaller, and avoid the vignetting correction
    artefacts that corrupt solar cell measurements.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Switched to contact image sensor-based scanners, which readily
    provided accurate and reliable data without requiring recalibration.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id003
  - 7
  evidence_excerpt: The built-in correction is optimised to work well for documents
    and photos which have very different characteristics to solar cells, so this leads
    to inaccurate data when imaging our devices. While it may be possible to find
    a new calibration procedure for these more standard scanners, the contact image
    sensor-based scanners readily provide more reliable data and they are typically
    lighter, smaller and cheaper.
  confidence_note: null
