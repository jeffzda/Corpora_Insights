  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: The project identified that replacing the Raspberry Pi Pico with
    a WM8255 analogue front end and Teensy 4 microcontroller would improve processing
    speed by a factor of 10 at an additional component cost of approximately $50.
