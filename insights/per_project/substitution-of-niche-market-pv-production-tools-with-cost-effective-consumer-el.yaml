- record_id: ARENA-DLV-10855
  source_title: Substitution of Niche-Market PV Production Tools with Cost-Effective
    Technology
  publish_date: 2022-01
  project_name: Substitution of niche-market PV production tools with cost-effective
    consumer-electronics technology
  what_happened: Cost-benefit analysis conducted with industry consultants Solinno
    Pty Ltd revealed that among the three technology streams investigated (microwave
    processing, flatbed scanning, thermal imaging), flatbed scanner technology was
    the most commercially promising due to its extremely low cost and variety of use
    cases, leading to the decision to focus phase 2 resources on flatbed scanning
    and deprioritise the other two streams.
  lesson_learnt: When pursuing a multi-stream R&D project, conduct cost-benefit modelling
    with industry consultants at the midpoint to enable evidence-based prioritisation
    of resources into the most commercially viable technology streams before committing
    phase 2 funding.
  issue_severity: minor
  project_type: manufacturing/supply chain
