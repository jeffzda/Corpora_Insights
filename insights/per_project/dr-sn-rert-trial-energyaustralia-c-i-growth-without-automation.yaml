- record_id: ARENA-DLV-20716
  source_title: Demand Response Short Notice RERT Trial Year 3 Report
  publish_date: 2021-10
  project_name: DR SN RERT Trial — EnergyAustralia C&I growth without automation
  what_happened: EnergyAustralia grew its RERT C&I portfolio from 50 MW to over 60 MW in Year 3 despite COVID-19 recruitment challenges, achieving this without automated control of customer loads; smaller
    C&I customers were motivated to join partly to offset RERT costs passed through in their bills.
  lesson_learnt: A manual-curtailment-based C&I DR portfolio can meet or exceed contracted volumes and continue to grow without investment in automated control technology, particularly where financial motivation
    (such as offsetting RERT pass-through costs) is strong; automation is beneficial but not a prerequisite for a commercially viable C&I DR program.
