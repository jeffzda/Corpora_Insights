- record_id: ARENA-DLV-16151
  source_title: Accelerating Industrial Solar Cells Efficiency by Development of Plasma-Enhanced
    Chemical Vapour Deposition (PECVD) – based Metal Oxides
  publish_date: '2019-08-28'
  project_name: Accelerating Industrial Solar Cells Efficiency by Development of PECVD-based
    Metal Oxides
  what_happened: The initial home-built precursor delivery system (PDS) installed
    on the AK-800 PECVD tool lacked precise flow control, causing the entire pressure
    to release when valves were opened and producing non-uniform deposition confined
    to one side of the processing chamber. The proof-of-concept phase succeeded in
    depositing TiOx but the process was not reproducible, requiring a redesigned advanced
    bubbler system to be procured from Meyer Burger in Germany.
  lesson_learnt: Validate precursor flow distribution across the full shower head
    before committing to deposition experiments — uneven nozzle delivery produces
    spatially non-uniform films that cannot support reproducible process development,
    and early flow testing (e.g. with an inert tracer) would identify this failure
    mode before consuming precursor material.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: commissioning/integration
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Engaged Meyer Burger (Germany) to design and fabricate an advanced
    bubbler-based precursor delivery system with controlled carrier-gas flow, expected
    to be delivered within 6–8 weeks of the report date.
  transferability: moderate
