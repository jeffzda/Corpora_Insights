- record_id: ARENA-DLV-16154
  source_title: Accelerating Industrial Solar Cells Efficiency by Development of Plasma-Enhanced
    Chemical Vapour Deposition (PECVD) – based Metal Oxides
  publish_date: '2019-08-28'
  project_name: Accelerating Industrial Solar Cells Efficiency by Development of PECVD-based
    Metal Oxides
  what_happened: A knowledge gap emerged regarding how to vaporise the solid tungsten
    oxide (WOx) precursor, in contrast to the liquid TiOx precursor which could be
    heated in a bubbler. No established method had been identified within the project
    team at the time of reporting, placing the WOx workstream at risk.
  lesson_learnt: Before selecting a solid precursor material for PECVD development,
    confirm that a viable vaporisation pathway exists and is compatible with available
    equipment — unresolved precursor handling for solid materials (such as WOx) can
    block an entire workstream and should be resolved at the design stage rather than
    discovered mid-project.
