- record_id: ARENA-DLV-16152
  source_title: Accelerating Industrial Solar Cells Efficiency by Development of Plasma-Enhanced
    Chemical Vapour Deposition (PECVD) – based Metal Oxides
  publish_date: '2019-08-28'
  project_name: Accelerating Industrial Solar Cells Efficiency by Development of PECVD-based
    Metal Oxides
  what_happened: Despite successful TiOx deposition, the project lost access to the
    AK-800 tool due to major maintenance works at UNSW, significantly limiting progress
    beyond the initial proof-of-concept and leaving the process non-reproducible at
    the time of reporting.
  lesson_learnt: When planning research projects around shared or institutionally
    owned equipment, account for the risk of unplanned access loss due to maintenance
    — build contingency time or identify alternative tool access to avoid stalling
    the project at a critical phase.
