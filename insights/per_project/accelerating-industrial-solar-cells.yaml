- record_id: ARENA-DLV-16155
  source_title: Accelerating Industrial Solar Cells Efficiency by Development of Plasma-Enhanced
    Chemical Vapour Deposition (PECVD) – based Metal Oxides
  publish_date: '2019-08-28'
  project_name: Work function study with ANU
  what_happened: A collaborative study between UNSW and ANU characterising the effect
    of metal work function on surface recombination in passivated silicon wafers found
    that metal capping layers can increase or decrease charge carrier recombination
    depending on the metal's work function. The study was ongoing at time of reporting,
    with a second phase planned to examine different passivation schemes.
  lesson_learnt: For thin passivation layers capped by a metal, the metal must be
    selected with reference to its work function to avoid additional recombination
    losses in photovoltaic devices — this selection criterion should be incorporated
    into device design protocols for future silicon solar cell development projects.
  issue_severity: none
  project_type: manufacturing/supply chain
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id003
  - 7
  evidence_excerpt: We learned that depending on the metal work function the presence
    of the metal can indeed influence the recombination statistics, i.e. reducing
    or increasing the number of charge carriers lost to recombination... for very
    thin passivation layers that are capped by a metal layer, it is important to choose
    the metal with respect to its work function in order to avoid additional losses
    in a photovoltaic device.
  confidence_note: outcome_class set to 'knowledge generated despite setback' as the
    study was still ongoing and no device implementation had been achieved; 'successful
    demonstration' was considered but rejected given the incomplete status.
