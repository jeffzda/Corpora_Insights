  project_name: Reduced Solar Module Temperature R&D (UNSW)
  what_happened: Simulations showed that frame-integrated VGs of approximately 10
    cm length could produce 2.2°C cooling for the downstream module and a further
    1.1°C for the next module in the array, indicating a cascade cooling benefit across
    rows.
  lesson_learnt: VG integration into module frames at utility scale can produce meaningful
    cascade cooling across multiple downstream module rows; system-level thermal modelling
    should account for inter-module cooling interactions when evaluating passive cooling
    designs for large arrays.
