- record_id: ARENA-DLV-58507
  source_title: UNSW - Advanced Silicon, Reduced Solar Module Temperature R&D - Final
    Report
  publish_date: '2023-03-24'
  project_name: Reduced Solar Module Temperature R&D (UNSW)
  what_happened: The project concluded without demonstrating that passive cooling
    modifications can be implemented cost-effectively or with a lifetime matching
    the module warranty period, leaving these as unresolved barriers to commercialisation.
  lesson_learnt: Passive cooling R&D projects must address cost-effectiveness and
    long-term durability (including compatibility with module lifetime warranties
    and bifacial cell transitions) before commercialisation is viable; future projects
    should build cost modelling and accelerated lifetime testing into scope from the
    outset rather than treating them as follow-on activities.
  issue_severity: moderate
