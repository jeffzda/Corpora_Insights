  source_title: UNSW - Advanced Silicon, Reduced Solar Module Temperature R&D - Final
    Report
  publish_date: '2023-03-24'
  project_name: Reduced Solar Module Temperature R&D (UNSW)
  what_happened: Of four vortex generator (VG) designs tested on full-size commercial
    modules, only one — the rectangular wing — produced a meaningful cooling effect;
    the other three designs (cube, truncated pyramid, cylinder) did not meaningfully
    reduce temperature.
  lesson_learnt: Not all rear-surface protrusion geometries promote convective heat
    loss from solar modules; future passive cooling designs should validate specific
    VG geometry through physical testing rather than assuming any protrusion will
    be effective.
