- record_id: ARENA-DLV-58504
  source_title: UNSW - Advanced Silicon, Reduced Solar Module Temperature R&D - Final
    Report
  publish_date: '2023-03-24'
  project_name: Reduced Solar Module Temperature R&D (UNSW)
  what_happened: Anti-reflection coating (ARC) approaches to reduce infrared absorption
    were found to be insufficient for meaningful cooling without progressing to many
    layers (8+), and the multi-layer approach faces significant cost-effectiveness
    barriers.
  lesson_learnt: Multi-layer anti-reflection coatings can reduce IR absorption in
    principle but require too many layers to achieve practical cooling benefit, making
    the approach commercially unviable without a breakthrough in cost reduction; projects
    targeting passive cooling should de-prioritise ARC-based approaches in favour
    of convection or conduction solutions.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Eight-layer ARC tests were initiated to validate the approach,
    but the team concluded additional work would be required to make it cost-effective
    before further investment.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id004
  - 5
  evidence_excerpt: The overall assessment of this approach from tests to date, however,
    is that while the original concept works, in that strong narrowband absorption
    can modify glass refractive index and thereby influence reflection, the cooling
    is likely to be insufficient without going to many layers. 8-layer tests are in
    progress to validate, although additional work will be required to make the approach
