  publish_date: '2023-03-24'
  project_name: Reduced Solar Module Temperature R&D (UNSW)
  what_happened: Textured front glass with a small groove geometry outperformed flat
    glass in field tests, delivering 19.4% efficient minimodules versus 18.6% for
    planar minimodules, while also improving dust collection and cooling.
  lesson_learnt: Small-groove front glass texture simultaneously improves light trapping,
    module cooling, and dust management; module designers should evaluate groove-textured
    glass as a cost-effective multi-benefit modification rather than treating optical,
    thermal, and soiling performance as separate optimisation problems.
