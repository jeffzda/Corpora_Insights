  source_title: UNSW - Advanced Silicon, Reduced Solar Module Temperature R&D - Final
    Report
  publish_date: '2023-03-24'
  project_name: Reduced Solar Module Temperature R&D (UNSW)
  what_happened: The project demonstrated passive cooling of solar modules using a
    combined conduction-plus-convection approach (thermally conductive backplate and
    vortex generators), achieving 4.7°C temperature reduction in real-world field
    tests — just short of the 5°C target.
  lesson_learnt: Combining conductive backplate materials with rear-surface vortex
    generators is the most effective passive cooling strategy tested; future module
    designs targeting operating temperature reduction should prioritise this combination
    over reflective coatings or texture alone.
