- record_id: ARENA-DLV-72306
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: '2014'
  project_name: The Impact of the Mass Adoption of Electric Vehicles on the Australian
    Electricity Grid
  what_happened: University of Melbourne simulations demonstrated that controlled
    EV charging algorithms enabled highly unbalanced networks to sustain EV uptake
    rates above 80% while still charging all vehicles within a six-hour window, provided
    consumers ceded charging control to third parties.
  lesson_learnt: Controlled charging by a third-party operator — rather than network
    augmentation — is a viable pathway to accommodating very high EV uptake on existing
    LV networks; policy and commercial frameworks should prioritise consumer consent
    mechanisms to enable this.
  issue_severity: none
  project_type: transport electrification
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: Centralised and distributed (voltage-signal-only) optimisation
    algorithms were developed and tested, enabling high EV uptake without network
    upgrades.
  transferability: broad
  delay_magnitude: null
  technology_domain: EV
  source_pages: &id002
  - 603
  evidence_excerpt: Using controlled charging methods, however, it was possible for
    the highly unbalanced networks to sustain very high EV uptake rates (>80%), and
    still have all vehicles charged within 6 hours. In other words, the existing networks
    are capable of handling large electric vehicle uptake, if consumers can be convinced
    to allow their vehicle charging to be controlled by third parties.
  confidence_note: null
