- record_id: ARENA-DLV-72305
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: '2014'
  project_name: The Impact of the Mass Adoption of Electric Vehicles on the Australian
    Electricity Grid
  what_happened: University of Melbourne simulations using real neighbourhood and
    vehicle travel data found that EV uptake rates of only 10–15% caused network failures
    in some cases, primarily through low voltage rather than thermal overload, with
    issues amplified in highly unbalanced networks.
  lesson_learnt: Network planners should treat low voltage — not thermal overload
    — as the binding constraint when assessing EV uptake impacts; even modest EV penetration
    of 10–15% can trigger failures on unbalanced LV networks, and planning tools should
    reflect this hierarchy.
