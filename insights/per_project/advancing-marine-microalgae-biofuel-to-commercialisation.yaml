- record_id: ARENA-DLV-25553
  source_title: Advancing Marine Microalgae Biofuel to Commercialisation
  publish_date: 2015-02
  project_name: Advancing Established and Integrated Marine Microalgae Biofuel to
    Commercialisation
  what_happened: Sensitivity analysis showed that a 10% decrease in forecast yield
    or a 10% increase in capital expenditure was sufficient to make the 600-hectare
    commercial microalgae-to-green-crude project economically marginal, indicating
    extremely narrow margins for the technology at this stage.
  lesson_learnt: When economic models for novel biofuel technologies show marginal
    returns under base-case assumptions, sponsors should require robust contingency
    in yield and capex forecasts before committing to scale-up — single-digit adverse
    variances can flip project economics.
