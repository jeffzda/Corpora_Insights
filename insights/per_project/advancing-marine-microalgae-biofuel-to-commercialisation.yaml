  source_title: Advancing Marine Microalgae Biofuel to Commercialisation
  publish_date: 2015-02
  project_name: Advancing Established and Integrated Marine Microalgae Biofuel to
    Commercialisation
  what_happened: Scaling biological processes from laboratory and pilot scale (200
    m²) to demonstration scale (4000 m²) introduced continuous environmental and biological
    challenges to open production ponds that required ongoing technical innovation
    and problem-solving throughout operations.
  lesson_learnt: Biological scale-up in open pond systems is inherently unpredictable
    — project plans for microalgae demonstration facilities should budget for extended
    operational troubleshooting periods and maintain a highly skilled multidisciplinary
    team capable of rapid innovation in response to biological variability.
