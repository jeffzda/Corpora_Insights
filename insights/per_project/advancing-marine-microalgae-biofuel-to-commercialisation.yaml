  project_name: Advancing Established and Integrated Marine Microalgae Biofuel to
    Commercialisation
  what_happened: The targeted annual average biomass productivity of >25 g.m⁻².d⁻¹
    was not achieved in the 4000 m² commercial-scale pond at the Muradel Demonstration
    Plant, despite having been demonstrated at smaller scales previously.
  lesson_learnt: Biomass productivity targets validated at small or pilot scale should
    not be assumed to transfer directly to commercial-scale open raceway ponds — plan
    for an extended optimisation period across multiple seasons before stable target
    yields are reached.
