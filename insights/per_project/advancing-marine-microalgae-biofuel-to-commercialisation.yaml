- record_id: ARENA-DLV-25552
  source_title: Advancing Marine Microalgae Biofuel to Commercialisation
  publish_date: 2015-02
  project_name: Advancing Established and Integrated Marine Microalgae Biofuel to
    Commercialisation
  what_happened: Economic modelling completed in November 2014 showed that microalgae-derived
    green crude is commercially unviable at prevailing oil prices, requiring a fossil
    crude price above A$100–120/barrel under optimistic assumptions, while the 2014
    oil price fall pushed prices well below A$80/barrel.
  lesson_learnt: Microalgae biofuel projects are highly sensitive to fossil fuel price
    assumptions — commercial viability thresholds should be stress-tested against
    sustained low oil price scenarios before committing to scale-up, and alternative
    feedstock or revenue streams should be identified to reduce this dependency.
  issue_severity: major
  project_type: null
  project_scale_band: demonstration
  lifecycle_phase: close-out/post-project review
  proponent_type: project developer
  delay_category: null
  failure_mode: commercial & market
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Muradel pivoted to investigate zero-to-negative-cost alternative
    feedstocks (tyres, biosolids) viable at fossil crude above USD55/bbl, and explored
    oleochemical co-product revenue streams to improve economics.
  transferability: moderate
  delay_magnitude: null
  technology_domain: bioenergy
  source_pages: &id002
  - 7
  evidence_excerpt: The 2014 fall in the price of oil and the uncertain medium term
    outlook on pricing, raises the risks for financing a microalgal green crude production
    project in the short term... the economic forecast for commercial production are
    unfavourable. The price of oil is likely to remain less than A$80/barrel for the
    short to medium term.
  confidence_note: lifecycle_phase assigned close-out/post-project review as this
    is an economic finding documented at project end, not a phase-specific delivery
    event.
