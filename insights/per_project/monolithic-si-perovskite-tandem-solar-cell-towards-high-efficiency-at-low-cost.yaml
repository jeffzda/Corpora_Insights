- record_id: ARENA-DLV-47705
  source_title: ANU - Monolithic Si-perovskite Tandem Solar Cell - Public Dissemination
    Report
  publish_date: 2023-10
  project_name: 'Monolithic Si/perovskite Tandem Solar Cell: Advanced Designs towards
    High-efficiency at Low-cost'
  what_happened: The project established that interfacial electrical and optical properties
    between Si and perovskite subcells are the dominant determinant of tandem performance,
    and identified doping density, doping species, and energy levels as the critical
    physical parameters controlling these properties.
  lesson_learnt: Future tandem solar cell programmes should characterise and optimise
    interfacial electrical and optical properties as a primary design objective, not
    a secondary step — knowledge of doping profile and energy level alignment at subcell
    interfaces is essential groundwork before full device integration.
