- record_id: ARENA-DLV-47703
  source_title: ANU - Monolithic Si-perovskite Tandem Solar Cell - Public Dissemination
    Report
  publish_date: 2023-10
  project_name: 'Monolithic Si/perovskite Tandem Solar Cell: Advanced Designs towards
    High-efficiency at Low-cost'
  what_happened: Perovskite stability challenges — including phase segregation, strain
    when perovskite films are applied to textured surfaces, and current-matching constraints
    — persisted throughout the project and were identified as key barriers to commercialisation
    at both cell and module levels.
  lesson_learnt: Tandem solar cell programmes must plan stability testing at both
    cell and module scale under outdoor (not only accelerated indoor) conditions from
    an early stage; long-term stability of at least 10–15 years will need to be demonstrated
    before commercial deployment is feasible.
