  evidence_excerpt: Si/perovskite tandem solar cells inherit stability concerns from
    perovskite cells and are additionally susceptible to tandem-specific degradation
    mechanisms. These challenges encompass issues related to perovskite phase segregation,
    strain unique difficulties when perovskite films are applied to textured surfaces,
    and the constraints imposed by current matching.
