  publish_date: 2023-10
  project_name: 'Monolithic Si/perovskite Tandem Solar Cell: Advanced Designs towards
    High-efficiency at Low-cost'
  what_happened: The project successfully demonstrated a monolithic Si/perovskite
    interconnect-free tandem solar cell exceeding 29% efficiency — the highest reported
    for poly-Si-based tandem cells — by developing a double-sided poly-Si/SiO2 passivating
    contact cell integrated with an n-i-p perovskite top cell, and filed a patent
    application for the innovation.
  lesson_learnt: Eliminating the interconnect layer in Si/perovskite tandem architectures
    can simultaneously improve cost-effectiveness and maintain high efficiency; future
    tandem R&D programmes should prioritise interconnect-free designs as a route to
    commercial viability.
