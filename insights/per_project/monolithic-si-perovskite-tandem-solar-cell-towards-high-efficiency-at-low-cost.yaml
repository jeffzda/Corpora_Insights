  project_name: 'Monolithic Si/perovskite Tandem Solar Cell: Advanced Designs towards
    High-efficiency at Low-cost'
  what_happened: Upscaling Si/perovskite tandem cells from laboratory to industrial
    scale remained an unresolved challenge at project completion, with high efficiency
    and stability difficult to preserve as device area increases and reproducibility
    requirements tighten.
  lesson_learnt: Laboratory-scale efficiency records in tandem solar cells do not
    translate automatically to industrial scale; future programmes must specifically
    design for upscaling from the outset, including large-area deposition processes
    compatible with commercial Si wafer surfaces.
