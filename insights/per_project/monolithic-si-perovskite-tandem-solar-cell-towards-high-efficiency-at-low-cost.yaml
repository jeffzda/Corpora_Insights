- record_id: ARENA-DLV-71901
  source_title: Monolithic Si/Perovskite Tandem Solar Cell Report
  publish_date: 2021-10
  project_name: 'Monolithic Si/perovskite tandem solar cell: advanced designs towards
    high-efficiency at low-cost'
  what_happened: Tandem solar cell development proved significantly more complex than
    single-junction design, requiring simultaneous optimisation of each subcell, interfaces,
    and optical coupling between subcells, which slowed progress and required adapted
    research strategies.
  lesson_learnt: When developing tandem solar cells, test at the interface level before
    the cell level, run simulation and experiment simultaneously, and optimise tandem
    efficiency in parallel with each subcell — this multi-track approach is necessary
    to make fast progress in a system far more complex than single-junction design.
  issue_severity: moderate
  project_type: manufacturing/supply chain
