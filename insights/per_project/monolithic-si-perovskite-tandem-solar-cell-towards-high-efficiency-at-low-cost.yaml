  publish_date: 2023-10
  project_name: 'Monolithic Si/perovskite Tandem Solar Cell: Advanced Designs towards
    High-efficiency at Low-cost'
  what_happened: High-performing Si/perovskite tandem cells continued to rely on expensive
    materials and processes despite the project's cost-reduction goals, with technoeconomic
    analysis identifying indium-containing transparent conductive oxides as a persistent
    cost driver.
  lesson_learnt: Removing the interconnect layer and substituting indium-free transparent
    conductive materials for top contacts are the two highest-leverage cost reduction
    levers in Si/perovskite tandem design — cost analysis should be integrated into
    device development from the outset to direct research effort toward commercially
    viable process and material choices.
