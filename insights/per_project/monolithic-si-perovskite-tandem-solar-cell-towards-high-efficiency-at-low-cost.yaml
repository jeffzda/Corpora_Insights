  what_happened: The project developed and validated a multi-scale optoelectronic
    modelling framework — combining SunSolve ray tracing for optical properties and
    an adapted Quokka simulation extended to perovskite drift-diffusion physics —
    that guided material, process, and device optimisation decisions throughout the
    project.
  lesson_learnt: Establishing a coupled optical-electrical simulation platform before
    beginning device fabrication iterations significantly accelerates tandem cell
    R&D; future programmes should invest in validated modelling infrastructure early
    to steer experimental work and reduce the number of costly fabrication cycles.
