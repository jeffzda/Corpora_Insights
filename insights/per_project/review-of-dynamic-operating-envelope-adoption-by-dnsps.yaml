- record_id: ARENA-DLV-26021
  source_title: Review of Dynamic Operating Envelope Adoption by DNSPs
  publish_date: 2022-08
  project_name: Review of Dynamic Operating Envelope Adoption by DNSPs
  what_happened: DOEs were being applied exclusively to export limits in all current
    trials, with import-side DOEs not being considered. Several DNSPs planned to extend
    to both export and import limits in future, with at least one also considering
    reactive power in its DOE calculation.
  lesson_learnt: Battery storage and flexible load projects that expect to benefit
    from import-side DOE signals should not design around that capability for near-term
    deployment — import DOEs are at planning stage only; business cases relying on
    import signal optimisation should model sensitivity to a scenario where import
    limits are unavailable or applied uniformly.
