  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: One DNSP implemented a 15-minute forecasting window specifically
    for solar-only customers, recognising that a system with no ability to time-shift
    cannot respond to a longer forecast.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
