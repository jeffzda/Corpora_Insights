- record_id: ARENA-DLV-26006
  source_title: Review of Dynamic Operating Envelope Adoption by DNSPs
  publish_date: 2022-08
  project_name: Review of Dynamic Operating Envelope Adoption by DNSPs
  what_happened: There was no consistent approach to capacity allocation for DOEs
    across any of the DNSPs surveyed, either currently or in future plans. Approaches
    in use or under consideration included equal allocation downstream of a constraint,
    equal allocation across all participants, proportional allocation by system size,
    and weighted allocation — with no convergence expected in the near term.
  lesson_learnt: The absence of a standard capacity allocation methodology means DER
    yield forecasting under DOE regimes is DNSP-specific and uncertain — project developers
    must obtain explicit allocation methodology details from each DNSP and model allocation
    scenarios (not just a single allocation assumption) in their financial models.
