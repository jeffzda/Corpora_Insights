- record_id: ARENA-DLV-26008
  source_title: Review of Dynamic Operating Envelope Adoption by DNSPs
  publish_date: 2022-08
  project_name: Review of Dynamic Operating Envelope Adoption by DNSPs
  what_happened: All DNSPs with active DOE contingency procedures applied a fallback
    to a safe or default export level when DOE communications failed. The CSIP-AUS
    standard seeks to standardise this fallback behaviour, though one DNSP uses smart-meter-based
    emergency control as an alternative approach.
  lesson_learnt: DOE-dependent DER projects must design for communication failure
    scenarios — specify the fallback export level in the connection agreement and
    ensure inverter firmware implements the CSIP-AUS fallback behaviour; failure to
    do so may result in either unconstrained export (network risk) or zero export
    (revenue loss).
