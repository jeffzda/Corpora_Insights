- record_id: ARENA-DLV-26002
  source_title: Review of Dynamic Operating Envelope Adoption by DNSPs
  publish_date: 2022-08
  project_name: Review of Dynamic Operating Envelope Adoption by DNSPs
  what_happened: Across all 16 DNSPs, there was a high degree of variability in DOE
    service offerings — tiered pricing, grandfathering, tariff arrangements, MSO obligations,
    and performance guarantees were either absent or inconsistently planned, with
    no DNSP currently offering tiered DOE services.
  lesson_learnt: The absence of standardised DOE service offering terms means DER
    aggregators and project developers face a fragmented regulatory environment; any
    project depending on customer DOE participation must be designed to accommodate
    DNSP-specific service terms rather than assuming national consistency.
