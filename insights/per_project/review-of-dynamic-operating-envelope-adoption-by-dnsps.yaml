  source_title: Review of Dynamic Operating Envelope Adoption by DNSPs
  publish_date: 2022-08
  project_name: Review of Dynamic Operating Envelope Adoption by DNSPs
  what_happened: Most DNSPs agreed that customers should be held accountable for DOE
    compliance, with the option to delegate responsibility to aggregators, VPP operators,
    or retailers. However, compliance enforcement approaches were inconsistent — ranging
    from contractual penalties to real-time automated control — and several DNSPs
    had no view on enforcement at all.
  lesson_learnt: Aggregators and VPP operators deploying DER under DOE regimes should
    negotiate explicit compliance delegation clauses in connection agreements and
    ensure their platform can demonstrate compliance against DOE limits using metering
    data — relying on end-customer accountability without technical automation creates
    regulatory and commercial exposure.
