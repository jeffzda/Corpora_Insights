- record_id: ARENA-DLV-26001
  source_title: Review of Dynamic Operating Envelope Adoption by DNSPs
  publish_date: 2022-08
  project_name: Review of Dynamic Operating Envelope Adoption by DNSPs
  what_happened: As of mid-2022, only 8 of 16 Australian DNSPs were offering DOE services,
    and only in trial capacity to a small subset of customers. The remaining DNSPs
    were in planning or early consideration stages, with most targeting incorporation
    into connection agreements within five years.
  lesson_learnt: DOE deployment is in early-trial phase across the NEM — program designers
    and project developers should not assume operational DOE infrastructure exists
    at connection points; verify each DNSP's current trial status and timeline before
    designing DER projects that depend on DOE capability.
