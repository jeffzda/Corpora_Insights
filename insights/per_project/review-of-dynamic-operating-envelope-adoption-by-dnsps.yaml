- record_id: ARENA-DLV-26003
  source_title: Review of Dynamic Operating Envelope Adoption by DNSPs
  publish_date: 2022-08
  project_name: Review of Dynamic Operating Envelope Adoption by DNSPs
  what_happened: None of the 16 DNSPs currently provided performance guarantees or
    minimum export service standards to customers under DOE arrangements. Most DNSPs
    did not comment on future plans for guarantees, with performance incentive schemes
    (STPIS) not expected until post-2025 rule changes.
  lesson_learnt: DER project business cases that assume a guaranteed minimum export
    level under DOE regimes are not supportable — customers and investors should explicitly
    account for the possibility of zero export limits under network fault or emergency
    conditions when sizing and financing DER assets.
