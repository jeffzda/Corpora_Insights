  source_title: Review of Dynamic Operating Envelope Adoption by DNSPs
  publish_date: 2022-08
  project_name: Review of Dynamic Operating Envelope Adoption by DNSPs
  what_happened: Most active DOE trials were spatially constrained to a single feeder
    or small network area, limiting the ability to test DOE behaviour under diverse
    network conditions (e.g. varying DER penetration levels, urban vs. rural grid
    strength) and reducing the generalisability of trial findings.
  lesson_learnt: DOE trial design should include multiple network zones with contrasting
    characteristics (urban strong grid, fringe-of-grid, high-penetration DER areas)
    to generate results that can inform broader rollout — single-feeder trials generate
    deep but narrow evidence that does not support a national deployment case.
