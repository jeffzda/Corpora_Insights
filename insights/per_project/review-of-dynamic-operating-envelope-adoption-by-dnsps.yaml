  what_happened: One DNSP investing in DOE capability noted that its metering fleet
    would not reach 100% AMI coverage until the end of the next regulatory period
    (approximately 6 years from the time of writing), meaning DOE services dependent
    on real-time metering data would be unable to reach all customers for an extended
    period.
