  project_name: Review of Dynamic Operating Envelope Adoption by DNSPs
  what_happened: Tariff arrangements for DOE customers had not changed in any active
    trial, with DOEs treated as an add-on function separate from tariffs. Future tariff
    integration (including feed-in components, dynamic network pricing, and service-level-linked
    charges) was planned post-2025 by a minority of DNSPs, pending rule changes.
  lesson_learnt: DER business models that assume DOE-linked tariff structures — such
    as tiered export pricing or capacity payments — should be designed for a post-2025
    regulatory environment at the earliest; deploying commercial DER projects before
    2025 that depend on such tariff structures will face a gap between design assumption
    and available regulatory framework.
