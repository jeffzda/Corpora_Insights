  source_title: Review of Dynamic Operating Envelope Adoption by DNSPs
  publish_date: 2022-08
  project_name: Review of Dynamic Operating Envelope Adoption by DNSPs
  what_happened: The IEEE 2030.5 CSIP-AUS standard did not include all the features
    being used in at least one active DOE trial (Project EDGE), meaning one DNSP was
    operating on a deviation from the agreed industry protocol and the standard required
    ongoing updates to keep pace with trial requirements.
  lesson_learnt: When designing DOE trials that push beyond current CSIP-AUS capabilities,
    explicitly plan for protocol gaps — identify required features not yet in the
    standard early in design and engage standards bodies proactively to avoid integration
    delays or the need for non-standard workarounds.
