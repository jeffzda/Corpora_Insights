- record_id: ARENA-DLV-26007
  source_title: Review of Dynamic Operating Envelope Adoption by DNSPs
  publish_date: 2022-08
  project_name: Review of Dynamic Operating Envelope Adoption by DNSPs
  what_happened: Most DNSPs that have active DOE trials calculate envelopes on a 24-hour
    ahead forecast at 5-minute intervals. However, at least one DNSP identified that
    solar-only customers (who cannot time-shift generation) are better served by a
    15-minute forecasting window, and another is testing 30-minute ahead finalisation
    of DOEs.
  lesson_learnt: Forecasting window design should be matched to the controllability
    of the DER being managed — solar-only systems cannot respond to 24-hour forecasts,
    so DOE projects incorporating solar-only customer cohorts should design for shorter
    or real-time forecasting windows to avoid delivering meaningless advance signals.
  issue_severity: minor
  project_type: network/grid
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: development/design
  proponent_type: network business
  delay_category: null
