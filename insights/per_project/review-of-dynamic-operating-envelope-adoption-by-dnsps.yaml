  source_title: Review of Dynamic Operating Envelope Adoption by DNSPs
  publish_date: 2022-08
  project_name: Review of Dynamic Operating Envelope Adoption by DNSPs
  what_happened: One DNSP trialling DOEs offered an aggregator-backed financial 'no
    worse off' guarantee to trial participants as a proxy for a formal performance
    guarantee, in the absence of any DNSP-issued service standard. This was the only
    form of customer financial protection present across the surveyed trial cohort.
  lesson_learnt: Where DNSPs do not provide formal performance guarantees, aggregators
    deploying DER under DOE trials should consider offering 'no worse off' financial
    guarantees to customers to maintain participation rates and manage complaints
    — this also generates data on the actual financial impact of curtailment that
    can support the development of formal STPIS arrangements.
