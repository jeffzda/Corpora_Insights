  source_title: Review of Dynamic Operating Envelope Adoption by DNSPs
  publish_date: 2022-08
  project_name: Review of Dynamic Operating Envelope Adoption by DNSPs
  what_happened: DNSPs mostly agreed that DOEs should be calculated based on localised
    network characteristics (hosting capacity, DER penetration, specific asset constraints)
    rather than applying uniform limits across the whole network, but several current
    trials were still applying DOEs at a single feeder or network zone level due to
    data availability constraints.
  lesson_learnt: Full spatially-differentiated DOE calculation requires investment
    in LV network data, state estimation, and real-time visibility — projects should
    assess the DNSP's actual LV data capability before assuming granular spatial DOE
    differentiation is available, and budget for data infrastructure if it is required
    for the project's network management design.
