  source_title: Review of Dynamic Operating Envelope Adoption by DNSPs
  publish_date: 2022-08
  project_name: Review of Dynamic Operating Envelope Adoption by DNSPs
  what_happened: DNSPs were almost unanimous in adopting or planning to adopt IEEE
    2030.5 CSIP-AUS as the communications protocol for DOEs, representing strong technical
    convergence on this standard across the industry.
  lesson_learnt: IEEE 2030.5 CSIP-AUS is the de facto standard for DOE communications
    in Australia — DER hardware, aggregator platforms, and DERMS solutions should
    be specified to support this standard to ensure interoperability with DNSP DOE
    systems.
