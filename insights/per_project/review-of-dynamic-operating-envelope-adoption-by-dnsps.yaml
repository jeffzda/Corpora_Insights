  project_name: Review of Dynamic Operating Envelope Adoption by DNSPs
  what_happened: DNSP responses on how DOE outcomes should be reported varied widely,
    with no consistent reporting framework in place. Proposed reporting metrics included
    kW/kWh outside DOE limits, curtailment volumes, hosting capacity made accessible,
    and extent of breaches — but no DNSP had implemented a standardised reporting
    regime.
