  project_name: Review of Dynamic Operating Envelope Adoption by DNSPs
  what_happened: One DNSP noted there is no mandate under the rules for DNSPs to invest
    in export capacity until the Access and Pricing rule change comes into effect
    in 2025, creating a structural barrier to proactive DOE investment even where
    DNSPs identified the need.
  lesson_learnt: DOE-dependent DER projects with deployment timelines before 2025
    should not rely on DNSP investment in export capacity infrastructure — the regulatory
    mandate for that investment did not exist at the time of this review, and project
    timelines should reflect the likely lag between rule change enactment and DNSP
    capital deployment.
