  publish_date: 2018-01
  project_name: Advanced Biomass Gasification Technology
  what_happened: The economic assessment conducted as part of the project found that
    biomass gasification power generation requires lower capital investment per kWh
    than wind and solar, and does not require energy storage to provide dispatchable
    baseload electricity, positioning it as economically competitive for dispatchable
    renewable generation.
  lesson_learnt: Economic assessments for novel bioenergy technologies should explicitly
    benchmark capital cost per kWh against wind and solar, and quantify the avoided
    cost of energy storage for dispatchable generation — these comparisons are more
    persuasive to investors and off-takers than levelised cost comparisons alone,
    and should be prepared during the demonstration phase to support commercial fundraising.
