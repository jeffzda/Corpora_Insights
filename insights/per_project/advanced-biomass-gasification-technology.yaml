  publish_date: 2018-01
  project_name: Advanced Biomass Gasification Technology
  what_happened: The demonstration plant successfully processed feedstocks containing
    a wide range of particle sizes — from microns to centimetres — without requiring
    extensive grinding, validating that biomass preparation costs could be significantly
    reduced compared to technologies requiring uniformly fine feedstock.
  lesson_learnt: Biomass gasification technology that tolerates a wide particle size
    range without fine grinding reduces feedstock preparation costs and complexity;
    when selecting or designing gasification technology for commercial projects, feedstock
    flexibility on particle size is a material cost lever that should be explicitly
    evaluated.
