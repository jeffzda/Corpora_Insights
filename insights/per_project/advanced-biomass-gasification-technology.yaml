- record_id: ARENA-DLV-42556
  source_title: An Advanced Biomass Gasification Technology Project Results
  publish_date: 2018-01
  project_name: Advanced Biomass Gasification Technology
  what_happened: The demonstration plant scope excluded the gas engine (power generation
    equipment downstream of the gasifier), as this was considered a commercial technology.
    Product gas was burned in a flare rather than used for power generation, meaning
    the full system integration from gasification through to electricity generation
    was not demonstrated at this stage.
  lesson_learnt: When scoping a gasification demonstration project, explicitly decide
    whether end-to-end power generation integration will be included — excluding the
    gas engine simplifies the demonstration but leaves system integration risk unresolved
    for the commercial plant, which must then be addressed in a subsequent demonstration
    or first commercial deployment.
