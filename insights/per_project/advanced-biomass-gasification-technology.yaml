- record_id: ARENA-DLV-42553
  source_title: An Advanced Biomass Gasification Technology Project Results
  publish_date: 2018-01
  project_name: Advanced Biomass Gasification Technology
  what_happened: Conventional biomass gasification technologies require liquid water-scrubbing
    to remove tar from product gas, generating a wastewater stream requiring expensive
    treatment. The Renergi technology used hot gas cleaning with biochar as a catalyst
    and adsorbent, eliminating the need for liquid scrubbing and the associated wastewater
    treatment cost and complexity.
  lesson_learnt: When designing biomass gasification systems, substituting hot gas
    cleaning with biochar catalyst for conventional liquid scrubbing eliminates a
    costly wastewater treatment requirement and simplifies the plant — this design
    choice should be evaluated in any new biomass gasification project to reduce both
    capital and operating cost.
