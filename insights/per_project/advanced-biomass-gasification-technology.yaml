- record_id: ARENA-DLV-42557
  source_title: An Advanced Biomass Gasification Technology Project Results
  publish_date: 2018-01
  project_name: Advanced Biomass Gasification Technology
  what_happened: The cost of transporting distributed biomass to a centralised gasification
    plant was identified as a significant component of the total cost of electricity
    from biomass gasification, representing a material economic barrier to commercial
    deployment at scale in regional Australia.
  lesson_learnt: Biomass supply chain logistics and transportation cost must be treated
    as a first-order economic design variable in biomass gasification commercial projects
    — co-locating pyrolysis at biomass source to produce transportable bio-oil, then
    centralising only the liquid feedstock, is a viable strategy to reduce this cost
    barrier and should be evaluated at the feasibility stage.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: concept/feasibility
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: Proposed solution involves deploying transportable distributed
    pyrolysers to convert biomass to bio-oil at source, with bio-oil then centralised
    and used as gasification feedstock, drastically reducing transportation cost.
  transferability: moderate
  delay_magnitude: null
  technology_domain: bioenergy
  source_pages: &id007
  - 9
  - 10
  evidence_excerpt: The cost to centralise distributed biomass to achieve relatively
    large scale power generation is a significant part of the overall cost of electricity...
    bio-oil can be transported and centralised for reforming to produce clean gasification
    product gas using this technology. The transportation of liquid bio-oil would
    be much cheaper than the transportation of bulky biomass, greatly improving the
    economic competitiveness of power generation using distributed biomass.
  confidence_note: Classified as design assumption failure because the high biomass
    transport cost is a barrier that requires a design-level response (distributed
    pyrolysis) rather than just a cost-reduction measure.
