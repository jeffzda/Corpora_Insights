- record_id: ARENA-DLV-52519
  source_title: ARENA's Virtual Power Plant Knowledge Sharing Workshop Summary
  publish_date: 2019-03
  project_name: SA Power Networks DER API Project
  what_happened: SA Power Networks developed a DER API reference architecture and
    conducted a multi-stage industry consultation process (three workshops between
    May and October 2018) before launching a pilot in July 2019 as part of an ARENA-funded
    project, with the full trial completion targeted for July 2020.
  lesson_learnt: Early, structured industry consultation — including multiple workshops
    before committing to architecture — is an effective approach for developing DER
    API standards that the industry will adopt; SA Power Networks' phased consultation-to-pilot
    pathway is a replicable model for other networks.
