- record_id: ARENA-DLV-52518
  source_title: ARENA's Virtual Power Plant Knowledge Sharing Workshop Summary
  publish_date: 2019-03
  project_name: SA Power Networks DER API Project
  what_happened: SA Power Networks identified that large VPPs dispatched without regard
    to network constraints could easily exceed the limits of the local network at
    certain times, and that the network had almost no visibility of the low-voltage
    network, meaning inverter trips on overvoltage could affect VPP performance and
    asset overloads could cause widespread outages.
  lesson_learnt: VPP operators and aggregators must have access to dynamic, locational
    network constraint information and common communications standards to avoid overloading
    distribution networks — dispatching VPPs without network constraint awareness
    is a material risk to grid security and VPP performance.
