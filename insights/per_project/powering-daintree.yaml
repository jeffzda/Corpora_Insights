  what_happened: The study found that the Daintree load is highly stratified, with
    a small number of large commercial/resort properties consuming over 100,000 litres
    of diesel per year (one consuming nearly 350,000 litres), while the majority of
    residential customers have much lower consumption. Cape Tribulation's commercial
    load alone is expected to represent nearly 50% of total annual energy consumption
    across the community.
  lesson_learnt: In isolated community energy planning, identify and characterise
    the top-5 commercial consumers individually before finalising any network or generation
    sizing — a small number of large loads can dominate total system energy and demand,
    and underestimating their contribution invalidates the entire system design.
