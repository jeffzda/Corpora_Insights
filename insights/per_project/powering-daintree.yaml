  what_happened: A segmented microgrid (Option 2 — three separate microgrids) was
    assessed and found to require approximately 25% more total synchronous generation
    capacity for N-1 security than a single unified microgrid (Option 1), due to loss
    of load diversity across segments. Three separate generation and control centres
    also increased capital and ongoing maintenance costs.
  lesson_learnt: Segmenting a remote community microgrid to reduce network cable costs
    increases required generation capacity by ~25% for N-1 compliance and requires
    multiple control centres — the apparent network capital saving is typically offset
    by higher generation CAPEX and ongoing maintenance; whole-of-system cost comparison
    must include these effects.
