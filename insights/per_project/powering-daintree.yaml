- record_id: ARENA-DLV-68807
  source_title: Powering Daintree
  publish_date: null
  project_name: Powering Daintree
  what_happened: Ergon Energy's 2013 study of Daintree supply options used standard
    ADMD planning values (4kVA residential, 20kVA commercial) without site-specific
    investigation. Sunverge's subsequent detailed study found the commercial ADMD
    was substantially undersized because large accommodation resorts consuming over
    100,000 litres of diesel annually had not been adequately characterised.
  lesson_learnt: Generic utility planning ADMD values are inadequate for isolated
    community microgrids with atypical customer mixes — detailed customer-class investigation
    (especially for large commercial/resort loads) is essential before network sizing,
    as underestimating commercial demand can invalidate cost estimates by tens of
    millions of dollars.
