- record_id: ARENA-DLV-68827
  source_title: Powering Daintree
  publish_date: null
  project_name: Powering Daintree
  what_happened: Hot water loads (approximately 13% of total Daintree energy) were
    identified as a significant controllable load resource for microgrid frequency
    stability. Most current hot water systems in the Daintree are gas-fuelled, but
    converting them to electric tank systems would create approximately 1.5MW of AUFLS/AOFLS
    capability and allow solar excess to be stored as thermal energy at near-100%
    efficiency.
  lesson_learnt: In remote microgrids planning high PV penetration, converting gas
    hot water to electric tank systems is a low-cost frequency stability measure that
    doubles as economic solar storage — it should be included in the base design rather
    than treated as an optional add-on, as it reduces the required scale and cost
    of fast-response battery storage.
