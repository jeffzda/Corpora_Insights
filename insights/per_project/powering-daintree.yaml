- record_id: ARENA-DLV-68822
  source_title: Powering Daintree
  publish_date: null
  project_name: Powering Daintree
  what_happened: A New Zealand North Island AUFLS (Automatic Under Frequency Load
    Shedding) event in 2011 revealed that only 40% of AUFLS tripped as expected. Had
    the full quantity tripped, frequency would have overshot to 52Hz, tripping large
    gas plant and potentially causing a blackout. The event highlighted that over-tripping
    from AUFLS is as dangerous as under-tripping on weak grids.
  lesson_learnt: AUFLS scheme design for isolated microgrids must use block separation
    and graduated settings to avoid over-frequency rebound after a generation loss
    event — design should verify that full AUFLS actuation does not overshoot to cause
    generation protection trips, as this can produce a worse outcome than the original
    under-frequency event.
  issue_severity: major
  project_type: network/grid
  project_scale_band: utility/large-scale
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: Study recommended applying similar block separation principles
    to the Daintree AUFLS design, with wide frequency operating bands to ensure damped
    rather than oscillatory system response.
  transferability: moderate
  delay_magnitude: null
  technology_domain: grid/system stability
  source_pages: &id022
  - 72
  - 73
  evidence_excerpt: One of the interesting findings from this event was that only
    40% of AUFLS tripped with the system frequency rising to 50 Hz. Had the full quantity
    of AUFLS tripped then the frequency would have gone very high, at 52 Hz the large
    gas fired plant will trip potentially returning the frequency back below 48hz,
    but this time without the protection of an AUFLS scheme to stop it and thus a
    black out on the North Island may have occurred.
