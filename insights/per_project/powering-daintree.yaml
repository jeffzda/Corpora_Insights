  project_name: Powering Daintree
  what_happened: Civil works (underground cable and duct installation) were identified
    as the single most expensive and inflexible component of the microgrid network.
    A rock formation through the Alexander Range required directional drilling, with
    costs and methods uncertain at the time of the study.
  lesson_learnt: For remote underground microgrid projects in difficult terrain, commission
    detailed geotechnical investigation and exact route planning for difficult sections
    (rock formations, river crossings) as early as possible — unknown drilling conditions
    are a major source of capital cost uncertainty and can dominate the overall cost
    envelope.
