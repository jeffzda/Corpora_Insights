  outcome_class: knowledge generated despite setback
  secondary_failure_mode: data & measurement
  intervention_note: Sunverge installed metering equipment at five representative
    sites, combined interval data with geospatial roof-area analysis, and reconciled
    results against Ergon Energy's published ADMD figures to produce credible load
    profiles.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hybrid systems
