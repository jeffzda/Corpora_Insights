- record_id: ARENA-DLV-68816
  source_title: Powering Daintree
  publish_date: null
  project_name: Powering Daintree
  what_happened: Operating diesel generators below 30% load for extended periods causes
    'wet stacking' — oily liquid leakage from the exhaust manifold into the engine
    due to insufficient cylinder temperature. In severe cases this leads to cylinder
    liner polishing requiring full engine rebuilds. Operators in the Daintree were
    already manually optimising generator loading to avoid this, but high PV penetration
    without battery storage would worsen low-load conditions.
  lesson_learnt: When introducing significant PV generation into diesel microgrid
    systems, battery storage or controllable loads must be sized to maintain minimum
    generator loading thresholds — failure to do so will accelerate diesel engine
    wear, increase maintenance costs, and potentially require full engine rebuilds
    within the project's operational life.
  issue_severity: moderate
  project_type: multi-technology/hybrid
  project_scale_band: operations
  lifecycle_phase: operations
  proponent_type: project developer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: Study recommended battery energy storage systems to maintain
