  source_title: Powering Daintree
  publish_date: null
  project_name: Powering Daintree
  what_happened: Analysis of the gas microgrid option (Option 3) found that micro
    combined-heat-and-power (CHP) units were unsuitable for the Daintree because the
    community has minimal heating loads — the waste heat from gas engines could not
    be utilised, making CHP efficiency gains irrelevant. One OEM (Yanmar) proposed
    a CHP aggregator scheme that quickly became operationally complex and was only
    suitable for extensive R&D pilots.
  lesson_learnt: CHP generation is only advantageous where there is a genuine co-located
    heat demand — in tropical climates with minimal space or water heating loads,
    CHP benefits evaporate and simpler single-output generation with appropriate fuel
    selection should be preferred.
