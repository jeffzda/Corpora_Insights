  source_title: Powering Daintree
  publish_date: null
  project_name: Powering Daintree
  what_happened: Hawaii's experience with high PV penetration on small island grids
    showed that uniform inverter protection settings across a large number of distributed
    PV systems created a risk of simultaneous mass disconnection — when grid frequency
    briefly entered protection trip zones, all inverters disconnected at once, potentially
    causing cascading failure. Hawaii addressed this through differentiated frequency-watt
    settings and expanded ride-through requirements.
  lesson_learnt: When deploying high PV penetration on weak island microgrids, mandate
    differentiated frequency and voltage ride-through settings across inverter fleets
    — uniform settings create dangerous simultaneous trip risk that can collapse the
    grid; graduated settings act as a multi-stage damper preventing cascade failure.
