- record_id: ARENA-DLV-68828
  source_title: Powering Daintree
  publish_date: null
  project_name: Powering Daintree
  what_happened: 'The study found that using LNG rather than LPG or diesel for the
    initial synchronous generation plant in the Daintree offered a better safety profile
    for the environment: LNG''s primary component is methane, which in the event of
    a leak will float into the air rather than pool and damage waterways as liquid
    fuels do. LNG upfront CAPEX was assessed as more than offset by fuel cost savings
    at the 3.4MW system scale.'
  lesson_learnt: For remote microgrids in environmentally sensitive areas requiring
    fossil fuel backup generation, LNG is preferable to diesel or LPG on both environmental
    risk and long-run fuel cost grounds — the higher initial CAPEX is outweighed by
    lower fuel costs and lower spill risk to waterways.
