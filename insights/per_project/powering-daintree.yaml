- record_id: ARENA-DLV-68829
  source_title: Powering Daintree
  publish_date: null
  project_name: Powering Daintree
  what_happened: The study found that an oversized MV cable backbone (sized for 7–9MVA
    feeders using standard European urban/suburban construction technique) added only
    a small incremental cost compared to a minimum-sized cable, while providing significant
    headroom for future load growth and distributed generation without requiring expensive
    network augmentation later.
  lesson_learnt: When designing underground MV networks for new remote microgrids,
    specify cable to the next standard size above minimum requirement — the incremental
    civil and cable cost is marginal relative to total project cost, but avoids future
    network augmentation triggered by load growth or DG uptake that would require
    new trenching in difficult terrain.
