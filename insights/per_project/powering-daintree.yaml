  source_title: Powering Daintree
  publish_date: null
  project_name: Powering Daintree
  what_happened: Residents and businesses in the Daintree, though geographically close
    to Cairns, were charged a premium significantly higher than Cairns customers for
    electrical products and services. Solar installation quotes were at least double
    those in Cairns, well above any travel-time surcharge, creating an additional
    equity barrier for energy transition.
  lesson_learnt: In remote or off-grid communities adjacent to urban centres, do not
    assume competitive markets will deliver fair pricing — programme design should
    actively create market conditions (e.g. government-facilitated procurement, aggregated
    tender) to prevent the premium pricing that compounds energy poverty.
