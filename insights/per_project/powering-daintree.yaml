- record_id: ARENA-DLV-68809
  source_title: Powering Daintree
  publish_date: null
  project_name: Powering Daintree
  what_happened: The Daintree experiences strong seasonal solar variability due to
    its wet season (December–April), creating periods of significant solar excess
    followed by deficit. Battery storage alone was found to be uneconomical for seasonal
    (multi-month) energy storage at the scale required for high renewable penetration,
    due to both high MWh costs and internal self-discharge losses.
  lesson_learnt: For tropical off-grid communities with pronounced wet seasons, batteries
    are insufficient as the sole storage technology for high renewable penetration
    — long-duration seasonal storage (e.g. power-to-gas/hydrogen, biofuel) must be
    incorporated in the design from the outset, not added as an afterthought.
  issue_severity: moderate
  project_type: storage
  project_scale_band: concept/feasibility
  lifecycle_phase: development/design
  proponent_type: project developer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: Report recommended a staged approach culminating in a solar-to-gas
    (power-to-gas) fuel cell facility to provide seasonal baseload storage at lower
    cost per kWh than equivalent battery capacity.
  transferability: moderate
  delay_magnitude: null
  technology_domain: battery storage
