  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Hawaii's HECO implemented updated TrOV-2 settings and expanded
    frequency/voltage ride-through requirements from 2015, successfully stabilising
    high-PV island grids; the study recommended similar settings for the Daintree
    microgrid.
  transferability: moderate
  delay_magnitude: null
