- record_id: ARENA-DLV-68803
  source_title: Powering Daintree
  publish_date: null
  project_name: Powering Daintree
  what_happened: Rooftop solar PV potential in the Daintree is severely constrained
    by dense rainforest canopy shading. Aerial photography analysis showed that a
    significant proportion of roof space has heavy shading, making conventional string-inverter
    PV systems unviable on many premises. Cape Tribulation in particular has major
    shading issues.
  lesson_learnt: In heavily forested remote communities, do not assume rooftop solar
    can contribute meaningfully to system supply without a roof-by-roof shading assessment
    — shading can render a large fraction of available roof area unviable and force
    reliance on centralised solar farms or alternative generation on shaded sites.
