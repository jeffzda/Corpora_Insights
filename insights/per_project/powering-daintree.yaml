    community microgrid to increase diversity and maximise solar self-consumption.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id004
  - 9
  evidence_excerpt: Many systems have been in operation since the Queensland Government's
    successive Daintree Remote Area Power Supply Subsidy schemes dating back to 1996
    and 2000 and rely on aged and inefficient technology. However, a big wet season
    and high seasonal variances in solar output, combined with the absence of a grid
    mean that self-consumption potential is low in the current community power supply
