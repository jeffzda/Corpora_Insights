- record_id: ARENA-DLV-68808
  source_title: Powering Daintree
  publish_date: null
  project_name: Powering Daintree
  what_happened: Ergon Energy's 2013 study costed a grid connection option (Option
    A) at approximately $40M for a partial supply area, with a note that an additional
    $16M or more would be needed if a new feeder were required due to load growth.
    The existing network infrastructure feeding the Daintree area was identified as
    requiring significant reinforcement — conductors, poles, cross-arms, transformers,
    switchgear, and reclosers — before it could supply even the Forest Creek and Cape
    Kimberley communities.
  lesson_learnt: When evaluating grid extension versus microgrid options for off-grid
    communities, account for full upstream network reinforcement costs — the headline
    connection cost can significantly understate total investment, and the incremental
    nature of upgrades can make a new microgrid more cost-effective than grid extension.
