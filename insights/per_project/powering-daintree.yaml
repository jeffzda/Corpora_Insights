- record_id: ARENA-DLV-68802
  source_title: Powering Daintree
  publish_date: null
  project_name: Powering Daintree
  what_happened: The Daintree area has no existing electric network and has been excluded
    from Ergon Energy's regulated supply territory. Decades of studies have failed
    to produce an implemented solution, resulting in the community burning over 4
    million litres of diesel per annum and disposing of outdated lead-acid batteries
    into the ecosystem.
  lesson_learnt: Where a remote community has been excluded from the regulated network
    for decades, a pre-construction feasibility study backed by primary data and stakeholder
    alignment on ownership, regulation, and governance is a necessary precursor to
    any investment decision — repeated studies without this foundation perpetuate
    the status quo.
