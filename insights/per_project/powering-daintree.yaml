  what_happened: An indicative financial analysis for the preferred Option 1 single
    microgrid found that, at a 10% required return on investment and a low-case load
    growth scenario, a government subsidy of approximately 50% of the expected capital
    cost (~$65M) would be required to achieve project viability within a 10-year timeframe.
    The analysis did not include load growth, environmental, employment, or social
    co-benefits.
