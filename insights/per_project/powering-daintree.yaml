- record_id: ARENA-DLV-68830
  source_title: Powering Daintree
  publish_date: null
  project_name: Powering Daintree
  what_happened: Sunverge's experience with BESS deployments in remote locations showed
    that systems must be fault-tolerant and designed so that a fault in one module
    disconnects only that module or a small sub-group, rather than the whole system.
    Large, complex equipment with difficult callout logistics and expensive strategic
    spares were identified as causing operational costs to spiral in remote deployments.
  lesson_learnt: For remote microgrid battery storage, specify modular rack-based
    systems where individual module failure is isolatable and replaceable by one or
    two people with near-plug-and-play ease — the callout and spare parts economics
    of complex large-format systems in remote locations make whole-system failure
    modes financially catastrophic.
  issue_severity: moderate
  project_type: storage
  project_scale_band: operations
  lifecycle_phase: operations
  proponent_type: project developer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: execution & logistics
  intervention_note: Study specified modular 19-inch 3U rack battery and PCS systems
    (Poweroad and Sinexcel) that allow individual module replacement and temporary
    deactivation of unused modules for efficiency.
  transferability: moderate
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id030
  - 33
  evidence_excerpt: Sunverge has extensive experience with distributed generation
    systems especially Battery Energy Storage Systems. This experience has shown us
    that in remote locations in particular systems need to be fault tolerant and robust
    to ensure operational costs do not spiral... modular systems which are within
    1 or 2 man lifts and that are virtually plug and play are desirable as callout
    costs and strategic spare are prohibitive for large and complicated equipment.
