- record_id: ARENA-DLV-68817
  source_title: Powering Daintree
  publish_date: null
  project_name: Powering Daintree
  what_happened: Gas engine generators face similar but distinct low-load problems
    to diesel engines — oil can work past O-rings into the combustion chamber causing
    carbon deposits, pre-detonation (knocking), and in severe cases cylinder liner
    glazing requiring rebuilds. Modern ECUs with knock sensors can mitigate this,
    but extended low-load operation remains damaging.
  lesson_learnt: Gas engine minimum load operating limits (typically 50–70% of nameplate)
    must be treated as a hard constraint in microgrid dispatch optimisation — control
    system design must prevent extended low-load operation or the maintenance cost
    and reliability profile of gas generation will exceed design assumptions.
  issue_severity: moderate
