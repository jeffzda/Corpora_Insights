- record_id: ARENA-DLV-68801
  source_title: Powering Daintree
  publish_date: null
  project_name: Powering Daintree
  what_happened: Previous studies of power supply options for the Daintree community
    relied on surveys and speculative data rather than actual metered load profiles.
    One prior study estimated the total system peak at 1.38MW, which was significantly
    lower than the 3.4MW peak derived from Sunverge's actual data modelling — a discrepancy
    that had major implications for sizing and cost estimation.
  lesson_learnt: For isolated community microgrids with no existing network, invest
    in primary metered data collection before developing supply options — reliance
    on standard planning assumptions (ADMD) or secondhand survey data can produce
    peak demand estimates that are less than half of actual, leading to significant
    under-sizing and cost surprises.
  issue_severity: major
  project_type: multi-technology/hybrid
  project_scale_band: demonstration
