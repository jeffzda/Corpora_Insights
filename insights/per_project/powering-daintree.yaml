  project_name: Powering Daintree
  what_happened: The individual RAPS upgrade option (Option 5) was found to require
    significantly more installed generation capacity per customer than grid-connected
    alternatives because individual systems cannot leverage load diversity. The 2016
    Compass Research survey found average generation capacity of ~13kW per site, compared
    to the ~4kVA ADMD expected under a collective MV/LV distribution arrangement.
  lesson_learnt: Individual RAPS systems must be sized for worst-case individual load
    without diversity benefit, resulting in significantly higher installed kW per
    customer than a shared microgrid — the apparent simplicity and low unit cost of
    RAPS hides a much higher total system investment relative to the energy reliably
    delivered.
