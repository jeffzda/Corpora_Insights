- record_id: ARENA-DLV-68804
  source_title: Powering Daintree
  publish_date: null
  project_name: Powering Daintree
  what_happened: Many Daintree residents had aged and inefficient RAPS (Remote Area
    Power Supply) systems installed under Queensland Government subsidy schemes dating
    back to 1996 and 2000. Without a grid to enable load diversity, self-consumption
    of solar was low, forcing continued heavy diesel use even on sites with solar
    panels.
  lesson_learnt: Standalone RAPS systems without a shared network cannot achieve high
    renewable self-consumption due to lack of load diversity — upgrading individual
    systems without connecting them to a microgrid provides only incremental improvement
    and perpetuates inequity and high ongoing fuel costs.
