  project_name: Powering Daintree
  what_happened: Only 60% of Daintree residential roofs were assessed as suitable
    for conventional string-array PV systems. The remainder had shading that would
    periodically knock out an entire string array, and panel fouling from high rainfall
    and dirt roads was identified as an additional performance degradation risk.
  lesson_learnt: In humid tropical environments with high rainfall and dirt roads,
    specify DC-DC optimisers or micro-inverters as standard for RAPS or rooftop PV
    installations rather than conventional string inverters — partial shading and
    panel fouling will otherwise degrade whole-string output and increase maintenance
    burden.
