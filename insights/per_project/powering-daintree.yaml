- record_id: ARENA-DLV-68818
  source_title: Powering Daintree
  publish_date: null
  project_name: Powering Daintree
  what_happened: In existing remote diesel microgrids with limited DG headroom, two
    small machines are run continuously for N-1 security, causing the larger machines
    to become near-redundant and poorly utilised. This pattern prevents scheduled
    maintenance without incurring significant solar spill, and the continuously-run
    machines accumulate wear while larger machines sit idle.
