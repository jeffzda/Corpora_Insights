- record_id: ARENA-DLV-72242
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: '2014'
  project_name: Education Queensland PV Connection - Windorah State School
  what_happened: Customers in Ergon Energy's isolated grid network were being denied
    the right to connect small PV systems due to the absence of technical solutions
    to manage ramp rates, effectively restricting customer choice and limiting PV's
    ability to reduce diesel costs in remote communities.
  lesson_learnt: Isolated grid operators should develop and pre-approve customer-side
    technical solutions (inverter modification plus battery storage for ramp-rate
    limiting) before PV connection requests arrive, rather than defaulting to blanket
    connection refusal — the absence of a pre-approved solution unreasonably restricts
    customer access and delays diesel cost reduction.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: pilot
  lifecycle_phase: approvals/contracting
  proponent_type: network business
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Ergon Energy partnered with Magellan Power to develop a customer-side
    solution combining modified inverters, MPPT, and lithium iron phosphate batteries
    to limit ramp rate to 100%-0% in 10 minutes, enabling connection approval.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
