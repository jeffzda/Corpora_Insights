  publish_date: 2014-06
  project_name: Australian Geothermal Sector (portfolio-level assessment)
  what_happened: The Australian geothermal sector attracted approximately $900 million
    in total funding since the 1990s but by 2014 was facing a funding crisis as many
    private sector investors and partners had decided to exit, with the sector largely
    stalled and very little activity underway.
  lesson_learnt: Early-stage resource and technology risk in geothermal is high enough
    that private investment alone cannot sustain the sector through exploration and
    demonstration phases; without targeted public support structured to reduce resource
    risk before drilling, private capital will exit when early projects underperform.
