- record_id: ARENA-DLV-72003
  source_title: Australian Energy Resource Assessment — Second Edition, 2014
  publish_date: '2014'
  project_name: Panax Geothermal Salamander-1 — Penola Project
  what_happened: The Salamander-1 well at the Penola project reached 4025 m and recorded
    171°C, meeting temperature targets, but achieved flow rates substantially below
    those expected, stalling plans for a rapid 59 MW commercial plant development.
  lesson_learnt: Achieving target temperature in a geothermal appraisal well does
    not guarantee commercial viability — flow rate is an equally critical parameter,
    and insufficient flow rates can render an otherwise thermally successful well
    uneconomic; project development plans should not progress to commercial scale
    before flow rate adequacy is confirmed.
  issue_severity: major
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: project developer
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: A joint research project between CSIRO, University of Adelaide,
    Panax and Geodynamics was initiated to investigate the causes of low flow rates
    in Salamander-1 and Celcius-1, including diagenetic reservoir damage and drilling-induced
    permeability damage.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: other
  source_pages:
  - 228
  - 236
  evidence_excerpt: Panax Geothermal Ltd had plans for the rapid development of a
    59 MW (net) commercial plant at its Penola project in the Limestone Coast area
    of South Australia (Panax Geothermal Ltd 2009), but the failure to attain high
    flow rates from Salamander-1 has delayed activity while the causes are investigated.
  confidence_note: flow rate failure is the primary issue; temperature was met. Technology
    domain 'other' used for geothermal EGS/HSA.
