- record_id: ARENA-DLV-48113
  source_title: ARENA-Funded Cutting Edge Research in Photovoltaics
  publish_date: 2019-09
  project_name: Development of Stable Electrodes for Perovskite Solar Cells (2017/RND019)
  what_happened: 'Standard high-performance perovskite solar cells use gold contacts,
    which are expensive and limit commercial viability. The team investigated two
    cheaper electrode alternatives: a novel metal stack (bismuth barrier layer plus
    silver) and a carbon electrode. The metal stack achieved 19% efficiency versus
    21% for gold-contact cells, with excellent thermal stability. Carbon electrode
    early results were also promising.'
  lesson_learnt: When developing perovskite solar cells for commercialisation, electrode
    cost is a primary barrier — cheaper electrode alternatives (metal stacks with
    barrier layers, carbon electrodes) can approach gold-contact performance while
    substantially reducing material costs, and should be evaluated in parallel from
    early in development rather than after cell architecture is fixed.
