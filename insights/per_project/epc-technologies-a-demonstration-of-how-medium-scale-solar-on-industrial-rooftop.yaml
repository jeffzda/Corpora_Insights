  project_name: EPC Technologies A demonstration of how medium-scale solar on industrial
    rooftops can be effectively integrated into the distribution network
  what_happened: A feasibility study for 11.6 MW of solar across 12 industrial rooftops
    in Brisbane identified specific equipment and control requirements for distribution
    network integration, and also examined regulatory and commercial barriers to such
    installations.
  lesson_learnt: Medium-scale industrial rooftop solar faces distinct regulatory and
    commercial barriers to distribution network integration beyond standard technical
    requirements — these barriers should be mapped and addressed in the feasibility
    phase before committing to detailed design.
