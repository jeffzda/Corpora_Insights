- record_id: ARENA-DLV-32102
  source_title: Printing Solar Cells – A Manufacturing Proposition for Australia
  publish_date: 2014-03
  project_name: Victorian Organic Solar Cell Consortium (VICOSC) – Printing Solar
    Cells
  what_happened: The stage-gate parameters for materials development were iteratively
    updated using feedback from the parallel large-scale printing program, so that
    materials and device architectures passed for further development were assessed
    not only on lab performance but also on suitability for transfer to the printing
    process.
  lesson_learnt: When running parallel R&D streams (materials development and scale-up/printing),
    establish a formal feedback loop so that downstream process constraints actively
    update upstream selection criteria — otherwise high-performing lab materials may
    fail to translate to the manufacturing process.
