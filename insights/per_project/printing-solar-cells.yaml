- record_id: ARENA-DLV-32105
  source_title: Printing Solar Cells – A Manufacturing Proposition for Australia
  publish_date: 2014-03
  project_name: Victorian Organic Solar Cell Consortium (VICOSC) – Printing Solar
    Cells
  what_happened: The technology and detailed manufacturing know-how were developed
    on commercially available printing equipment, rather than bespoke research machinery,
    with the explicit goal of de-risking technology transfer to industry partners.
  lesson_learnt: Conduct scale-up R&D on commercially available manufacturing equipment
    wherever possible — this directly lowers the barrier for industry partners to
    adopt the technology and reduces the integration risk at handover, compared to
    transferring know-how from bespoke laboratory equipment.
