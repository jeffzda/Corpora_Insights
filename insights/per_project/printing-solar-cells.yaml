- record_id: ARENA-DLV-32103
  source_title: Printing Solar Cells – A Manufacturing Proposition for Australia
  publish_date: 2014-03
  project_name: Victorian Organic Solar Cell Consortium (VICOSC) – Printing Solar
    Cells
  what_happened: The consortium deliberately pursued two competing OPV technology
    platforms (BHJ and DSSC/perovskite) in parallel throughout the project because
    neither had demonstrated sufficient superiority to justify eliminating the other.
    Both achieved their efficiency milestones by project end.
  lesson_learnt: Where two competing technology platforms each have distinct advantages
    and neither has demonstrated decisive superiority, maintaining parallel development
    tracks — rather than selecting prematurely — preserves optionality and reduces
    the risk of backing an ultimately inferior path; this is viable when a stage-gate
    process constrains resource spend on each track.
