- record_id: ARENA-DLV-32104
  source_title: Printing Solar Cells – A Manufacturing Proposition for Australia
  publish_date: 2014-03
  project_name: Victorian Organic Solar Cell Consortium (VICOSC) – Printing Solar
    Cells
  what_happened: At project completion, the technology had progressed from approximately
    TRL 1 to TRL 5–6 over the project period, meaning it remained in early-stage commercial
    readiness. The consortium identified near-term niche applications (portable power
    for short-duration uses) as necessary stepping stones before the longer-term target
    of building-integrated PV (BIPV) deployment could be realised, and required a
    commercial partner and further funding to proceed.
  lesson_learnt: 'Deep-technology R&D projects should plan explicitly for the TRL
    5–7 gap: even after achieving ambitious efficiency milestones, significant further
    investment and a committed commercial partner are required before manufactured
    product reaches market. Identifying bridging niche applications early can help
    structure a credible pathway to commercialisation.'
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: close-out/post-project review
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: commercial & market
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: Consortium identified near-term portable-power applications as
    stepping stones and sought a commercial partner and additional government/commercial
    funding to bridge to BIPV deployment.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id004
  - 7
  - 8
  evidence_excerpt: According to the Technology Development Chain sourced from ARENA...
    we estimate that the VICOSC program of work has shifted our technology from ca
    TRL1 to ca TRL5-6, which is still in the early – yet useful – stages of commercial
    readiness... The consortium stands ready to take the technology to the next stage
    of manufacturing with a commercial partner and suitable government/commercial
    funding.
  confidence_note: failure_mode set to commercial/demand failure to reflect the absence
    of a commercial pathway at project end despite technical success; issue_severity
    moderate because the technology gap to commercialisation is substantial but the
    project delivered its intended R&D outputs.
