- record_id: ARENA-DLV-32101
  source_title: Printing Solar Cells – A Manufacturing Proposition for Australia
  publish_date: 2014-03
  project_name: Victorian Organic Solar Cell Consortium (VICOSC) – Printing Solar
    Cells
  what_happened: The consortium implemented a stringent stage-gating process to screen
    materials and device architectures against pre-set parameters (solubility, molecular
    weight, energy levels, light absorption, synthesis, optoelectronic, and device
    performance gates) before committing development resources. Of 85 new materials
    synthesised, 61 were rejected at various gates, focusing effort on the highest-potential
    candidates.
  lesson_learnt: In R&D programs with large candidate material sets, pre-defining
    quantitative stage-gate criteria before screening begins — and linking them directly
    to downstream process requirements (e.g. printability) — concentrates effort on
    viable candidates and enables all milestones to be met within the program period.
  issue_severity: none
