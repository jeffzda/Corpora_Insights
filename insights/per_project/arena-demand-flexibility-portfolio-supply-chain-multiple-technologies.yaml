- record_id: ARENA-DLV-53887
  source_title: Demand Flexibility Portfolio Retrospective Analysis Report
  publish_date: 2023-07
  project_name: ARENA Demand Flexibility Portfolio — Supply Chain (multiple technologies)
  what_happened: Supply chain issues were a recurring obstacle across multiple ARENA-funded
    demand flexibility projects and technologies, including semiconductor shortages
    (hot water systems), smart EV charger delays, skill gaps in EV grid integration
    and data science, and the influential role of hot water installers in shaping
    consumer choices at point of system replacement.
  lesson_learnt: Demand flexibility programs must treat supply chain dynamics as a
    strategic design consideration, not just a logistical risk; programs should identify
    which supply chain actors are 'blockers' or 'enablers' of adoption (e.g. hot water
    installers, EV charging vendors) and invest in their engagement, training, and
    incentive alignment alongside regulatory and market reform.
