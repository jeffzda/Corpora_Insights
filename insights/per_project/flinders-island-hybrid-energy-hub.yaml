- record_id: ARENA-DLV-13554
  source_title: Flinders Island Hybrid Energy Hub - Final Public Report and Lessons
    Learnt
  publish_date: '2018-12-20'
  project_name: Flinders Island Hybrid Energy Hub
  what_happened: On the predecessor King Island Renewable Energy Integration Project
    (KIREIP), construction of power station building extensions to house enabling
    equipment took 8 months and was highly intrusive into the operational power station,
    requiring transfer of existing operational generators and customer feeders without
    interrupting supply. This lengthy on-site intrusion was identified as a major
    challenge to be solved on the subsequent Flinders Island project.
  lesson_learnt: Avoid integrating new enabling equipment into existing operational
    power station buildings where possible — on-site construction in operational stations
    is slow, costly, and poses safety risks to operators and commissioning crews.
    Containerised off-site pre-assembled solutions can reduce station intrusion from
    months to weeks.
  issue_severity: major
  project_type: multi-technology/hybrid
  project_scale_band: demonstration
