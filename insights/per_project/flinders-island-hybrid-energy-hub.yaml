  source_title: Flinders Island Hybrid Energy Hub - Final Public Report and Lessons
    Learnt
  publish_date: '2018-12-20'
  project_name: Flinders Island Hybrid Energy Hub
  what_happened: Containerised battery and enabling equipment was subject to FAT before
    shipment to the remote Flinders Island site. Problems discovered during FAT were
    resolved in the factory, avoiding what would have been very difficult and costly
    on-site rectification work in a remote location with limited facilities.
  lesson_learnt: Containerise battery and power system equipment to enable FAT prior
    to shipment to remote sites — resolving non-compliance in a factory environment
    is far faster and cheaper than on a remote site, and passing FAT provides a clear
    commercial payment milestone that protects the principal.
