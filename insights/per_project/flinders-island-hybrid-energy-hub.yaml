- record_id: ARENA-DLV-13566
  source_title: Flinders Island Hybrid Energy Hub - Final Public Report and Lessons
    Learnt
  publish_date: '2018-12-20'
  project_name: Flinders Island Hybrid Energy Hub
  what_happened: Increasing behind-the-meter solar installation on Flinders Island
    — driven partly by tariff structures that inadvertently incentivised uptake —
    created technical challenges for the utility including voltage and frequency management,
    and threatened to undermine the economics of the hybrid system by reducing volume-based
    revenue while fixed infrastructure costs remained unchanged.
  lesson_learnt: Design hybrid energy systems and associated tariff structures with
    future behind-the-meter growth explicitly modelled — uncontrolled distributed
    solar growth can destabilise small grids, reduce utility revenue, and interact
    adversely with hybrid system controls, and these effects should be addressed through
    tariff reform, technical requirements for new connections, and distributed control
    schemes rather than reacted to after the fact.
