- record_id: ARENA-DLV-13572
  source_title: Flinders Island Hybrid Energy Hub - Final Public Report and Lessons
    Learnt
  publish_date: '2018-12-20'
  project_name: Flinders Island Hybrid Energy Hub
  what_happened: Containerised switchgear for the Flinders Island project was standardised
    at 690 V (lower voltage than the 11 kV or 22 kV distribution standard) to fit
    within the space constraints of a 20-foot shipping container. This required connection
    transformers and increased cable sizes but allowed the switchgear to be safely
    containerised at relatively low cost.
  lesson_learnt: When containerising power system switchgear for remote deployment,
    standardise on lower voltages (e.g. 690 V) rather than distribution voltages (11
    kV/22 kV) to meet container space constraints — the cost of connection transformers
    and larger cables is offset by the significantly reduced cost and complexity of
    low-voltage switchgear in a container compared with high-voltage cubicles.
