- record_id: ARENA-DLV-13568
  source_title: Flinders Island Hybrid Energy Hub - Final Public Report and Lessons
    Learnt
  publish_date: '2018-12-20'
  project_name: Flinders Island Hybrid Energy Hub
  what_happened: Batteries used in the Flinders Island hybrid system primarily provided
    short-term power regulation (frequency control) rather than energy time-shifting,
    because the continuous energy throughput required for frequency regulation would
    have caused short cell life if large energy storage was used — a limitation that
    affected system design economics.
  lesson_learnt: In megawatt-scale high-penetration hybrid systems, budget for the
    battery as a power regulation device rather than an energy storage device — continuous
    frequency control throughput significantly reduces battery cell life and must
    be accounted for in whole-of-life cost calculations. Model the expected cycle
    count and state-of-charge behaviour carefully before sizing and specifying the
    battery.
  issue_severity: minor
  project_type: multi-technology/hybrid
