  intervention_note: Hydro Tasmania's advanced control system and enabling technologies
    (including the dynamic resistor and battery) were used to manage frequency and
    voltage; the report recommended tariff reform, technical connection requirements,
    and distributed control schemes to limit solar export as longer-term responses.
  transferability: broad
