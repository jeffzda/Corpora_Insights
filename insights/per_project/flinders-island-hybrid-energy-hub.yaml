  what_happened: Issues were identified during commissioning regarding inadequate
    switching arrangements to support maintenance practices and the inability to energise
    Hub systems in the absence of station services, requiring process improvements
    that would be valuable to future deployments.
  lesson_learnt: Before finalising design, test the proposed integration methodology
    alongside existing station operations and ensure adequate switching arrangements
    for maintenance are included — discovering these deficiencies during commissioning
    adds rework and creates operational risk during the transition period.
