- record_id: ARENA-DLV-13573
  source_title: Flinders Island Hybrid Energy Hub - Final Public Report and Lessons
    Learnt
  publish_date: '2018-12-20'
  project_name: Flinders Island Hybrid Energy Hub
  what_happened: The Flinders Island Hybrid Energy Hub bore the development costs
    and risks of the containerised modular approach as Hydro Tasmania's own asset,
    which enabled the designs and processes to be immediately and profitably applied
    on a commercial basis to the Coober Pedy Hybrid Power Project (a third-party contract),
    with that project using the same elements but at larger scale.
  lesson_learnt: Structuring a first-of-kind deployment on an own-asset project to
    absorb development risk allows the validated designs and processes to be commercialised
    rapidly on subsequent third-party contracts — proponents building new capability
    should consider whether an own-asset first deployment can serve as the development
    vehicle rather than bearing development costs on a client project.
