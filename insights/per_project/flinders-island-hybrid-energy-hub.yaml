  source_title: Flinders Island Hybrid Energy Hub - Final Public Report and Lessons
    Learnt
  publish_date: '2018-12-20'
  project_name: Flinders Island Hybrid Energy Hub
  what_happened: Power purchase agreement (PPA) arrangements for the third-party 300
    kW wind turbine on Flinders Island were not designed to handle system constraints
    that arise when embedded generation capacity exceeds customer load, creating commercial
    ambiguity about how constrained generation would be treated.
  lesson_learnt: PPAs for embedded generators in small hybrid networks must explicitly
    address all potential constraint scenarios — including how constrained generation
    is valued and what happens when the operator needs to curtail generation — and
    include the ability for the system operator to control or constrain the embedded
    generation as a technical requirement.
  issue_severity: moderate
  project_type: multi-technology/hybrid
