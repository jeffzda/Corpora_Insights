  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Hydro Tasmania paired the battery with a dynamic resistor to
    share frequency regulation duties, reducing the throughput burden on the battery
    and extending its effective operational life.
  transferability: moderate
