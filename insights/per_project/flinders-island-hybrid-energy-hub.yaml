  project_name: Flinders Island Hybrid Energy Hub
  what_happened: Metering arrangements for the Flinders Island system needed to be
    reviewed and augmented to support the commercial power purchase agreement for
    the third-party 300 kW wind turbine and the Renewable Energy Certificate (REC)
    accreditation arrangements for all renewable assets, because hybrid systems where
    not all generated energy reaches customers require multiple metering points or
    a complex time-series logic approach.
  lesson_learnt: Design metering arrangements from the outset to cover all commercial
    and regulatory requirements — including PPAs, RECs, and operational requirements
    — because hybrid systems with batteries and enablers require multiple metering
    points or complex time-series calculations that cannot be easily retrofitted and
    may create additional regulatory complexity with the Clean Energy Regulator.
