- record_id: ARENA-DLV-13559
  source_title: Flinders Island Hybrid Energy Hub - Final Public Report and Lessons
    Learnt
  publish_date: '2018-12-20'
  project_name: Flinders Island Hybrid Energy Hub
  what_happened: Standard shipping containers altered for use as equipment housings
    risk having their CSC compliance plate invalidated by modifications such as additional
    access doors or cable entry points. Hydro Tasmania's containers were designed
    by an experienced designer and inspected by Lloyd's Register but were not load-tested
    and therefore did not carry a CSC plate, relying instead on a transport plate
    certified by a structural engineer.
  lesson_learnt: Ensure modified shipping containers used as equipment housings are
    checked by a licensed container surveyor to certify they meet transport requirements
    — failure to do so can result in reputable transport companies refusing to transport
    the containers and may breach transport and lifting regulations.
