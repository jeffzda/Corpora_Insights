- record_id: ARENA-DLV-13565
  source_title: Flinders Island Hybrid Energy Hub - Final Public Report and Lessons
    Learnt
  publish_date: '2018-12-20'
  project_name: Flinders Island Hybrid Energy Hub
  what_happened: Federal government requirements for IT/OT network security in Australia's
    critical infrastructure sector were tightening at the time of the project, making
    the established practice of providing separate direct internet connections (via
    3G modem/router) to OEM equipment no longer acceptable, yet no common industry
    solution had been developed to replace it.
  lesson_learnt: Address OEM remote access requirements within a compliant IT/OT security
