- record_id: ARENA-DLV-13569
  source_title: Flinders Island Hybrid Energy Hub - Final Public Report and Lessons
    Learnt
  publish_date: '2018-12-20'
  project_name: Flinders Island Hybrid Energy Hub
  what_happened: Inverter-based battery and solar solutions available in the market
    at the time of the project were generally unable to achieve system security (minimisation
    of outages) and safety (adequate fault current) at megawatt scale in off-grid
    hybrid systems, because they could not detect, identify and locally isolate network
    faults.
  lesson_learnt: For high-penetration off-grid hybrid systems above a few hundred
    kilowatts, do not rely solely on inverter-based solutions from battery or inverter
    suppliers — verify that the proposed solution can provide adequate fault current
    and local fault isolation capability, as standard inverter-based integration typically
    cannot maintain system security at megawatt scale without additional enabling
    technologies.
