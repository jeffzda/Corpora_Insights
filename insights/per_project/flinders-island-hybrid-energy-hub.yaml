  publish_date: '2018-12-20'
  project_name: Flinders Island Hybrid Energy Hub
  what_happened: The modular containerisation approach developed on the Flinders Island
    Hybrid Energy Hub project was immediately applied to the subsequent Coober Pedy
    Hybrid Power Project, delivering cost reductions of approximately 30% on the flywheel
    system and 40% on the dynamic resistor, and reducing on-site commissioning time
    from months (Flinders Island) to weeks (Coober Pedy) compared with years on King
    Island.
  lesson_learnt: Invest in developing standard containerised product designs on a
    first project even if it bears development costs — the standardisation enables
    rapid deployment and significant cost reductions (30–40% on key components) on
    subsequent projects, removing development risk from commercial contracts.
