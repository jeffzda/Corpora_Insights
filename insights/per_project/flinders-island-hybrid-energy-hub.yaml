  what_happened: Containerisation of enabling equipment (diesel-UPS, dynamic resistor,
    switchgear, control room) as standard 20-foot shipping containers enabled manufacture
    and testing to occur in factory conditions, significantly reducing on-site time,
    costs, and safety risk compared with the previous King Island approach of constructing
    permanent buildings on site.
  lesson_learnt: Adopt containerised standard designs for power system enabling equipment
    deployed to remote locations — the price per square metre of bespoke containers
    is similar to permanent buildings in remote areas, but containers are more compact,
    enable FAT, allow end-of-life removal, and can reduce on-site commissioning time
    by up to 85% compared with permanent building approaches.
