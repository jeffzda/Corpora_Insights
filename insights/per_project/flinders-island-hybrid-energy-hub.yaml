- record_id: ARENA-DLV-13552
  source_title: Flinders Island Hybrid Energy Hub - Final Public Report and Lessons
    Learnt
  publish_date: '2018-12-20'
  project_name: Flinders Island Hybrid Energy Hub
  what_happened: Battery suppliers engaged for the project lacked a full grasp of
    the unique performance criteria required in high-renewable-penetration hybrid
    systems — specifically the speed of response, fault current provision, and charge/discharge
    behaviour — meaning standard battery solutions required customisation that was
    not fully appreciated by the supplier at the outset.
  lesson_learnt: Clearly state all battery performance requirements in full in the
    contract specification — including fault current provision, response speed, and
    operating envelope — and select suppliers with proven relevant project experience.
    Assess the track record of both the head contractor and subcontractors before
    award, as knowledge gaps in this area remain significant across the industry.
  issue_severity: moderate
  project_type: multi-technology/hybrid
  project_scale_band: demonstration
  lifecycle_phase: procurement
  proponent_type: utility/energy retailer
  delay_category: procurement/supply chain
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: coordination & stakeholders
  intervention_note: Hydro Tasmania generated a detailed specification including a
    typical one-year usage profile at 10-second intervals, conducted design reviews
    prior to manufacture, and included FAT as a contractual requirement — mitigating
    the risk of undiscovered non-compliance on a remote site.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id002
  - 17
  - 18
  evidence_excerpt: Along with many other players in hybrid off-grid systems, not
    all suppliers (and/or their subcontractors) will have a full grasp of the unique
    performance criteria required in high-renewable-penetration hybrid systems...
    it is important to set out all the requirements in full in the specification as
    part of the contractual documentation and discuss them with the preferred supplier
    to measure their understanding.
