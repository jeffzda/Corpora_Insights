  project_name: Flinders Island Hybrid Energy Hub
  what_happened: Due to overall cost pressures on the project and higher-than-expected
    feeder construction costs, the project team revised the design to connect the
    900 kW wind turbine directly into an existing customer feeder rather than on a
    dedicated feeder, introducing complications including protection scheme changes,
    load-shedding scheme amendments, anti-islanding requirements, and additional protection
    equipment.
  lesson_learnt: Connecting large embedded generators into existing customer feeders
    in small isolated networks requires significant additional protection, load-shedding
    scheme, and anti-islanding studies that should be scoped and budgeted at design
    stage — the cost saving on feeder construction may be offset by the complexity
    of additional protection works and ongoing operational constraints.
