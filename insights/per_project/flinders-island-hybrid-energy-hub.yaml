- record_id: ARENA-DLV-13551
  source_title: Flinders Island Hybrid Energy Hub - Final Public Report and Lessons
    Learnt
  publish_date: '2018-12-20'
  project_name: Flinders Island Hybrid Energy Hub
  what_happened: During battery procurement for the Flinders Island Hybrid Energy
    Hub, the battery supplier failed to meet all aspects of the specification at the
    first Factory Acceptance Test (FAT). A second FAT visit was required some weeks
    later before the battery passed, causing a delay in equipment arriving on site
    and affecting Hydro Tasmania's construction schedule and associated contracts.
  lesson_learnt: Require contractual FAT with a detailed test plan and schedule, and
    ensure the principal's own experienced engineer attends and independently assesses
    results — do not rely solely on the supplier's report. The principal should also
    ensure the contract specifies liquidated damages for failing FAT and for late
    delivery to site, as non-compliance discovered post-shipment to a remote site
    would have been far more costly to rectify.
  issue_severity: moderate
  project_type: multi-technology/hybrid
  project_scale_band: demonstration
  lifecycle_phase: procurement
  proponent_type: utility/energy retailer
  delay_category: procurement/supply chain
  failure_mode: execution & logistics
  outcome_class: delayed but recoverable
  secondary_failure_mode: null
  intervention_note: Hydro Tasmania's engineer attended the FAT, independently assessed
    test data against the ITP, identified non-compliance, and required the supplier
    to address the issue before a second FAT visit — the battery successfully passed
    on the second visit prior to shipment.
  transferability: broad
  delay_magnitude: 1-3 months
  technology_domain: battery storage
  source_pages: &id001
