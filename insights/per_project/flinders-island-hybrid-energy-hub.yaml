- record_id: ARENA-DLV-13556
  source_title: Flinders Island Hybrid Energy Hub - Final Public Report and Lessons
    Learnt
  publish_date: '2018-12-20'
  project_name: Flinders Island Hybrid Energy Hub
  what_happened: The 'balance of plant' costs at the Flinders Island site were higher
    than expected, partly because the system — as an integral part of a working utility
    station — required connection to fuel, oil, water and fire detection systems,
    buried drainage, long-life cable management including shielded cabling, and concrete
    foundations and steel platforms. These utility-grade requirements were more complex
    than the initial concept of a rapidly deployable standalone system anticipated.
  lesson_learnt: Assess customer-specific utility requirements for safety, operations,
    and long-term efficiency early in the design phase — the level of installation
    complexity will largely be determined by the specific application and customer
    requirements, and underestimating these 'balance of plant' costs can significantly
    affect project economics.
  issue_severity: moderate
  project_type: multi-technology/hybrid
  project_scale_band: demonstration
