  project_name: Flinders Island Hybrid Energy Hub
  what_happened: The high capital cost of the 900 kW wind turbine generator on Flinders
    Island, combined with the non-modular nature of wind technology compared with
    solar PV, reinforced that wind generation sizing is a major issue in hybrid off-grid
    systems. The limited availability of wind turbines below 1 MW also severely constrained
    supplier choice for projects of this scale.
  lesson_learnt: When selecting generation mix for off-grid hybrid projects, account
    for the non-modular nature of wind generation and the constrained supplier market
    for sub-1 MW turbines — the high capital cost and logistics complexity of wind
    may favour solar PV for smaller systems, and proponents should model the full
    cost implications of wind turbine sizing and logistics before design freeze.
