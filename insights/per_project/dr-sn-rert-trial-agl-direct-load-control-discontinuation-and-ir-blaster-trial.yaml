- record_id: ARENA-DLV-20711
  source_title: Demand Response Short Notice RERT Trial Year 3 Report
  publish_date: 2021-10
  project_name: DR SN RERT Trial — AGL direct load control discontinuation and IR
    blaster trial
  what_happened: AGL discontinued its original direct load control program for residential
    air conditioners due to technology incompatibility with many brands and models,
    high rectification costs, and performance shortfalls; in Year 3 it trialled internet-connected
    infrared (IR) blasters as a lower-cost, self-installable alternative.
  lesson_learnt: Hardware-based direct load control for residential air conditioners
    faces significant deployment barriers from appliance incompatibility and installation
    cost; self-installable, appliance-agnostic technologies such as IR blasters offer
    a more scalable and cost-effective path, though they also have limitations and
    should be piloted before broad deployment.
