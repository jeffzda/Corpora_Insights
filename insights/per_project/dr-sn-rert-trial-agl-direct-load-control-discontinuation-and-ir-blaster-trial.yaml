  evidence_excerpt: AGL discontinued its original direct load control program due
    to a relative lack of interest from customers and significant problems with the
    load control technology itself, including incompatibility of the control technology
    with many brands and models of air conditioners, the high costs of rectifying
    these problems, and performance shortfalls even where the controllers were able
    to be installed.
