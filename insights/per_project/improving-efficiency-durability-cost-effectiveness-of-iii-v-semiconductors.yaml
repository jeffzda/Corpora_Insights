  what_happened: COVID-19 travel and gathering restrictions prevented the research
    team from attending conferences and conducting face-to-face meetings with project
    partners and collaborators, limiting knowledge-sharing and the ability to fill
    identified technical knowledge gaps (e.g. in reciprocal space mapping and dislocation
