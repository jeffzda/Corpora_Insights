- record_id: ARENA-DLV-71301
  source_title: Direct Water Electrolysis Midterm Activity March 2021
  publish_date: 2021-03
  project_name: Direct Water Electrolysis [2018/RND006]
  what_happened: The project experienced approximately ten months of lost access to
    MOCVD reactors in 2020, plus several months of restricted access to chemical and
    characterisation laboratories, due to the compounding effects of bushfire smoke
    (summer 2019–2020), hailstorm damage to ANU facilities (January 2020), and COVID-19
    lockdowns. Repair work was further delayed by lengthy procurement times and contractor
    travel restrictions.
  lesson_learnt: Growth plans for quaternary alloy development must explicitly account
    for the risk of prolonged reactor unavailability; iterative processes that depend
    on a single piece of infrastructure are highly vulnerable to compounding facility
    disruptions. Future projects should establish contingency plans — including identifying
    alternative facilities or modifying milestone sequencing — before commencing growth
    campaigns.
