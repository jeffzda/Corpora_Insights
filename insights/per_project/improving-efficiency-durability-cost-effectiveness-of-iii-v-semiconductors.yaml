- record_id: ARENA-DLV-71302
  source_title: Direct Water Electrolysis Midterm Activity March 2021
  publish_date: 2021-03
  project_name: Direct Water Electrolysis [2018/RND006]
  what_happened: Optimisation of the metamorphic buffer for the double-junction photovoltaic
    cell was significantly hampered by the absence of in-situ characterisation tools
    (e.g. multiple optical beam stress sensor for MOCVD or RHEED for MBE). The team
    was forced to rely exclusively on ex-situ post-growth techniques such as X-ray
    diffraction and electron microscopy, which slowed iteration cycles and delayed
    progress.
  lesson_learnt: Before committing to a metamorphic buffer growth plan, identify and
    confirm availability of in-situ characterisation tools; relying solely on ex-situ
    techniques for complex graded structures significantly extends optimisation time.
    Future projects should estimate time delays attributable to absent specific equipment
    and secure access to in-situ tools or collaborators who have them before the growth
    campaign begins.
  issue_severity: moderate
  project_type: enabling infrastructure
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: data/validation/testing
  failure_mode: data & measurement
  outcome_class: delayed but recoverable
  secondary_failure_mode: poor scoping
  intervention_note: The team established a growth strategy by combining multiple
    ex-situ characterisation techniques and engaging peer interactions to progress
    despite the absence of in-situ tools.
  transferability: narrow
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages: &id009
