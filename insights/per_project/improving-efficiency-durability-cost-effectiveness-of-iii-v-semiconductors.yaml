- record_id: ARENA-DLV-46853
  source_title: ANU - Direct Water Electrolysis - Public dissemination report
  publish_date: 2023-08
  project_name: Direct Water Electrolysis
  what_happened: 'The metamorphic buffer development for the ideal 1.7/1.0 eV tandem
    cell encountered a fundamental trade-off: improving material quality (lower threading
    dislocation density) required measures that substantially increased fabrication
    cost through greater reactor usage time, materials consumption, and additional
    processing steps.'
  lesson_learnt: In III-V semiconductor R&D for hydrogen applications, researchers
    should explicitly model the cost-quality trade-off of buffer layer optimisation
    early — the marginal efficiency gain from further dislocation density reduction
    may not justify the disproportionate increase in fabrication cost, and this should
    trigger a go/no-go decision on the primary pathway before consuming the majority
    of project resources.
