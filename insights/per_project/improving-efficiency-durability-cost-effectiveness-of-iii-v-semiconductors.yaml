    define a clear scale-up roadmap and, where possible, include a pilot-scale workstream
    or establish a funded follow-on pathway before close-out; without this, even technically
    successful lab demonstrations risk stalling at the lab-to-pilot transition, which
    is the most common point of attrition in energy technology development.
