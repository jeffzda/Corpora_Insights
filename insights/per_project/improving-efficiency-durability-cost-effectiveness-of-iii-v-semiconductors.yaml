- record_id: ARENA-DLV-46855
  source_title: ANU - Direct Water Electrolysis - Public dissemination report
  publish_date: 2023-08
  project_name: Direct Water Electrolysis
  what_happened: The techno-economic assessment conducted at project close-out estimated
    the current levelised cost of hydrogen (LCOH) from the demonstrated system at
    8.3 USD/kgH2 — substantially above competitive benchmarks — with a modelled long-term
    pathway to 1.8 USD/kgH2 contingent on further advances in STH efficiency, lift-off,
    passivation, and catalyst cost.
  lesson_learnt: R&D projects targeting novel hydrogen production pathways should
    conduct techno-economic assessments early enough to shape the research agenda
    — not only at close-out — so that cost-reduction levers (efficiency, substrate
    recycling, catalyst substitution) can be prioritised iteratively rather than identified
    only after the technical programme is fixed.
