- record_id: ARENA-DLV-46854
  source_title: ANU - Direct Water Electrolysis - Public dissemination report
  publish_date: 2023-08
  project_name: Direct Water Electrolysis
  what_happened: The project successfully demonstrated a prototype III-V PEC water
    splitting system achieving 20.7% solar-to-hydrogen efficiency under 1-sun illumination
    and 40-hour stability, meeting both key performance targets, by combining three
    commercial triple-junction photoanodes with four earth-abundant co-catalyst electrolysers.
  lesson_learnt: Decoupling the photoactive and electrocatalytic components of a PEC
    system — rather than integrating them monolithically — enables independent optimisation
    of each subsystem, simplifies encapsulation, and can unlock both efficiency and
    stability targets simultaneously; this architectural choice should be considered
    early in PEC system design.
