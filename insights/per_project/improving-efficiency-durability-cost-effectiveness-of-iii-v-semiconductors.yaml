- record_id: ARENA-DLV-46858
  source_title: ANU - Direct Water Electrolysis - Public dissemination report
  publish_date: 2023-08
  project_name: Direct Water Electrolysis
  what_happened: Prior to this project, III-V-based PEC systems had rarely demonstrated
    operation for more than a few hours due to photocorrosion, making them commercially
    non-viable; the project addressed this by developing sulphide passivation layers
    and a decoupled/encapsulated photoelectrode configuration, extending stable operation
    to over 200 hours.
  lesson_learnt: Stability — not efficiency — is the binding constraint for III-V
    PEC commercialisation; any programme targeting III-V PEC systems should treat
    passivation or physical decoupling of the photoactive and catalytic components
    as a mandatory workstream from project inception, not an afterthought, given that
    prior systems failed within hours.
