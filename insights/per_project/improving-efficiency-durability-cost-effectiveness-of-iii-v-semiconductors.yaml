- record_id: ARENA-DLV-46857
  source_title: ANU - Direct Water Electrolysis - Public dissemination report
  publish_date: 2023-08
  project_name: Direct Water Electrolysis
  what_happened: Earth-abundant Ni-based co-catalyst foils (NiFe(OH)x for OER, NiMox
    for HER) were developed and integrated with III-V solar cells, achieving record
    performance for a single-junction GaAs photoanode and the highest STH efficiency
    for a single-junction PEC device with earth-abundant electrocatalysts, with stability
    maintained for over nine days.
  lesson_learnt: Earth-abundant Ni-foil-supported co-catalysts are a technically credible
    substitute for platinum-group metals in III-V PEC systems and should be the default
    starting point for new PEC catalyst design — they deliver record-level catalytic
    performance while removing a key cost barrier, and their substrate-agnostic fabrication
    makes them transferable to alkaline electrolysers and other photoelectrode types.
