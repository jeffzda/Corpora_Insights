- record_id: ARENA-DLV-46852
  source_title: ANU - Direct Water Electrolysis - Public dissemination report
  publish_date: 2023-08
  project_name: Direct Water Electrolysis
  what_happened: In the second half of the project, the team abandoned the primary
    technical pathway — fabricating ideal metamorphic tandem cells with 1.7/1.0 eV
    bandgaps — due to prohibitive fabrication cost and quality trade-offs, and pivoted
    to series-connecting commercially available triple-junction cells combined with
    custom electrolysers to achieve the STH efficiency target.
  lesson_learnt: When the primary technical pathway encounters a cost-quality deadlock
    that cannot be resolved within project resources, proactively pivoting to a more
    mature alternative technology that can still meet performance targets is preferable
    to persisting — this project achieved >20% STH efficiency by substituting commercial
    triple-junction cells for the bespoke metamorphic design.
