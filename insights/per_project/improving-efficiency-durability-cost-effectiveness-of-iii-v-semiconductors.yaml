  what_happened: The spalling technique for III-V substrate recycling was successfully
    demonstrated on large-area InP films, producing high-quality thin films (<20 µm)
    over multiple recycling cycles, with tunable surface texture for anti-reflection
    — advancing a key cost-reduction lever for III-V PEC systems.
  lesson_learnt: Substrate recycling via spalling is a viable alternative to chemical
    lift-off for III-V materials and should be evaluated in any R&D programme targeting
    cost-competitive III-V PEC or PV systems; the technique also transfers broadly
    to flexible electronics, expanding its justification beyond hydrogen applications.
