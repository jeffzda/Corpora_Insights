  what_happened: 'Despite achieving >20% STH efficiency and >200 h stability at lab
    scale, the project conclusion identified that significant technological challenges
    remain before commercial adoption, specifically: scaling up the technology, balance-of-plant
    design, and pilot-scale demonstration — none of which were addressed within the
    project scope.'
