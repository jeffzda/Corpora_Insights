  what_happened: The constraint engine experienced a short outage caused by an erroneous
    weather input reading. Because the system calculates export limits up to one hour
    ahead, sites reverted to the default 1.5kW export limit approximately one hour
    after the error occurred.
  lesson_learnt: DER constraint engine failures result in all managed sites defaulting
    to minimum export limits, causing customer impact within the engine's scheduling
    horizon — implement robust input data validation, monitoring of calculation outputs,
    and consider extending the default timeout period to reduce unnecessary curtailment
    during transient failures.
