- record_id: ARENA-DLV-52903
  source_title: SA Power Networks - Flexible Exports for Solar PV Trial - Final Report
  publish_date: '2023-10-19'
  project_name: Flexible Exports for Solar PV
  what_happened: AusNet initially asked customers to pay for the SwitchDin Droplet
    gateway device upfront, predicting the cost could be recouped through feed-in
    tariffs. It was found that the upfront cost was perceived as incomparable with
    the benefits realised during a limited trial period, and customer uptake was suppressed.
  lesson_learnt: In a limited trial context, requiring customers to pay upfront for
    additional hardware creates a participation barrier disproportionate to the perceived
    benefit — consider subsidising hardware costs during the trial phase to generate
    sufficient participation data, particularly when the trial period is short relative
    to the payback period.
