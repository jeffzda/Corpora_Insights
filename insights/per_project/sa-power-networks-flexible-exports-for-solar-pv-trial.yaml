    Rule 21 work) proved insufficient to achieve interoperability between the multiple
    CSIP-AUS clients and utility servers involved, requiring significant additional
    integration testing before communications could be established.
  lesson_learnt: Do not assume that existing international CSIP test tools will be
    sufficient for Australian interoperability testing — use a live development and
    integration server (connecting the client to a live server implementation rather
    than a test harness) from the start of the certification process to identify and
    resolve interoperability issues early rather than at commissioning.
