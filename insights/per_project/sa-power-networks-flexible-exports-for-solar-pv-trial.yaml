  project_name: Flexible Exports for Solar PV
  what_happened: AusNet Services found it very difficult to communicate effectively
    with large solar retailers who use contracted installers, resulting in a high
    proportion of compliance issues — in contrast with small solar retailers who are
    also the installer, with whom communication was effective.
  lesson_learnt: When a DNSP's primary communication channel is the solar retailer
    but installations are executed by subcontracted installers, critical technical
    and compliance information frequently fails to reach the person doing the work.
    Establish direct communication pathways with on-site subcontractors — not just
    the retailer — for any trial requiring specific hardware or commissioning steps.
