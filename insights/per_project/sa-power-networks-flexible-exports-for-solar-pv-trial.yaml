  what_happened: AusNet's trial evidence and policy engagement, combined with SA Power
    Networks' experience, contributed to the AER's Flexible Exports regulatory framework
    review (finalised July 2023), which proposed that from 1 July 2026 DNSPs that
    can offer Flexible Exports instead of a zero export limit must do so, and established
    governance expectations for static and flexible export limits.
  lesson_learnt: Trial evidence gathered through a well-structured field trial can
    directly shape national regulatory frameworks — DNSPs and project proponents should
    plan for structured policy engagement as a deliberate project output, not an afterthought,
    and document quantitative performance evidence in a form that is directly usable
    in regulatory submissions.
