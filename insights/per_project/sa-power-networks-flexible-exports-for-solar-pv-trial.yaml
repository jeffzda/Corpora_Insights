    are suitable for small trial-scale deployments but hit scalability limits at higher
    customer penetration — DNSPs planning to scale Flexible Exports beyond ~30% customer
    penetration must budget and plan for more sophisticated power flow models (e.g.,
    DPF or OPF), which carry significant additional cost and complexity.
