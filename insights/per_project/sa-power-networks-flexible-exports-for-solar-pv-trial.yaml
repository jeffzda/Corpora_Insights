  project_name: Flexible Exports for Solar PV
  what_happened: Roles and responsibilities for product certification, compliance
    hardware testing, national PKI (certificate authority), commissioning, customer
    support, and communication aggregation were all carried by trial partners (primarily
    SA Power Networks and SwitchDin) during the trial, without a national framework
    to assign these responsibilities at scale.
  lesson_learnt: A national framework for product certification (CEC), compliance
    hardware testing (accredited test houses), PKI management (AEMO), installer accreditation,
    and communication aggregation must be established before Flexible Exports can
    scale nationally — DNSPs should not carry these functions indefinitely as it is
    inefficient and creates jurisdictional inconsistency that imposes cost and complexity
    on OEMs and installers operating nationally.
