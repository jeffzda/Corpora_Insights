- record_id: ARENA-DLV-8201
  source_title: SA Power Networks – Flexible Exports for Solar PV – Lessons Learnt
    Report 4
  publish_date: '2022-06-23'
  project_name: Flexible Exports for Solar PV
  what_happened: Approximately half of all connection approvals in SA Power Networks
    congested areas chose fixed exports over Flexible Exports, with a benchmark survey
    finding that 7 out of 10 customers who chose fixed exports were unaware of the
    Flexible Exports offering, and a further two lacked sufficient information to
    choose it.
  lesson_learnt: Do not rely solely on solar retailers as the channel for communicating
    a new connection offer to customers — lack of retailer awareness directly suppresses
    uptake. Supplement retailer engagement with direct-to-customer outreach (digital
    campaigns, letterbox drops) from the outset of a trial to ensure customers can
    make an informed choice before engaging a retailer.
  issue_severity: moderate
