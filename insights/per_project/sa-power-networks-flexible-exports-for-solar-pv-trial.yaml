  secondary_failure_mode: null
  intervention_note: AusNet identified this as a limitation of the trial system and
    recommended that more advanced deployments leverage more real-time data or voltage
    feedback from inverters via IEEE 2030.5 monitoring interfaces.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
