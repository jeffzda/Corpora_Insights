- record_id: ARENA-DLV-52901
  source_title: SA Power Networks - Flexible Exports for Solar PV Trial - Final Report
  publish_date: '2023-10-19'
  project_name: Flexible Exports for Solar PV
  what_happened: Limited compatible inverter equipment was available at trial launch,
    with all systems requiring a SwitchDin Droplet gateway device. This meant many
    solar retailers could not or would not offer Flexible Exports to customers, resulting
    in only 36% of eligible customers choosing the flexible option during the trial.
  lesson_learnt: Equipment availability is a critical prerequisite for customer uptake
    of a new connection offer — ensure a broad range of compatible native inverter
    options are available before or concurrent with launch, or uptake will be constrained
    by retailer product suites rather than customer demand. Regulatory mandates on
    equipment compatibility (as introduced in SA from July 2023) are highly effective
    in resolving this barrier.
