  source_title: Flexible Exports for Solar PV Lessons Learnt Report 1
  publish_date: 2021-01
  project_name: Flexible Exports for Solar PV
  what_happened: The introduction of the South Australian Government's Smarter Homes
    Regulations in September 2020 — requiring remote disconnect/reconnect capability
    for all new solar inverters — diverted the software development resources of inverter
    manufacturer partners away from the flexible exports project, delaying the commencement
    of technology development activities until Q4 2020.
  lesson_learnt: In rapidly evolving DER policy environments, projects relying on
    commercial technology partners should actively monitor regulatory changes affecting
    those partners' product lines — a new regulation can immediately shift a partner's
    internal resourcing priorities away from the project and delay development activities.
    Maintain open dialogue with partners' broader businesses to detect and plan around
    such constraints early.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: network business
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: coordination & stakeholders
  intervention_note: The project team shifted focus to planning and design activities
    that did not involve the constrained software development resources while partners
    fulfilled their Smarter Homes Regulations compliance obligations; partners also
    aligned their compliance approach with the planned flexible exports model to avoid
    duplicated effort.
  transferability: moderate
  delay_magnitude: 3-12 months
  technology_domain: DER
  source_pages: &id030
