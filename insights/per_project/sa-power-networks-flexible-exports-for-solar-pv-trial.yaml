    because many installers operated across multiple network territories and were
    not motivated to upskill for a single distributor's trial technology.
  lesson_learnt: Installer engagement and training for a new DER connection offer
    is most effective when coordinated across all distributors in a jurisdiction —
    a single DNSP offering a small-scale trial faces a structural disadvantage in
    achieving installer cut-through compared to a multi-DNSP or jurisdiction-wide
    coordinated rollout.
