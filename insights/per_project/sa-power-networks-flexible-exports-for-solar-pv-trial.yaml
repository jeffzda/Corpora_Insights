    customers as a restriction rather than as a way to generate more exports, leading
    to inaccurate customer understanding and potentially suppressing uptake of the
    flexible option.
  lesson_learnt: DNSPs cannot rely on solar retailers to accurately frame and communicate
    a new flexible connection offer — provide retailers with specific, area-level
    evidence of the benefits achieved (e.g., average additional exports by suburb)
    and develop targeted communications that retailers can use verbatim to reduce
    the risk of the offer being misrepresented.
