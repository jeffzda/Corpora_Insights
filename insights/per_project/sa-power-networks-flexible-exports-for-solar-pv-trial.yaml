- record_id: ARENA-DLV-9307
  source_title: Flexible Exports for Solar PV Lessons Learnt Report 2
  publish_date: 2021-04
  project_name: Flexible Exports for Solar PV
  what_happened: The project found that the CSIP (Common Smart Inverter Profile) implementation
    guide, originally developed for California Rule 21, contained ambiguities in the
    specification of certain interactions, meaning that two CSIP-certified devices
    could both be compliant yet fail to interoperate correctly. The test procedure
    also did not validate physical inverter response or verify that meter readings
    and statuses reflected the true operating state.
  lesson_learnt: Projects implementing IEEE 2030.5 / CSIP-based DER communication
    protocols should not assume CSIP certification guarantees end-to-end interoperability
    — the protocol contains specification ambiguities and the test procedure does
    not cover physical inverter response. Develop a detailed interface specification
    ('utility interconnection handbook') and bring real hardware into the testing
    loop as early as possible with a functional end-to-end integration test plan.
