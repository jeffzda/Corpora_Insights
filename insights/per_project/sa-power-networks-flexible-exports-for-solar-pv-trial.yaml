  source_title: SA Power Networks - Flexible Exports for Solar PV Trial - Final Report
  publish_date: '2023-10-19'
  project_name: Flexible Exports for Solar PV
  what_happened: AusNet's operating envelope algorithm updates were calculated weekly
    based on historical AMI data, meaning that if a customer made a significant change
    in behaviour in a short period, there would be a delay between the network impact
    and its reflection in the flexible export operating envelope, posing a potential
    risk to safe operational boundaries.
  lesson_learnt: Weekly operating envelope update rates based on historical data introduce
    a lag risk when customer behaviour changes rapidly — future Flexible Exports systems
    should incorporate more real-time data inputs (e.g., voltage feedback from inverters
    via IEEE 2030.5 monitoring interfaces) to support near-live export limit calculation,
    balanced against the complexity and cost of the solution.
  issue_severity: moderate
  project_type: network/grid
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: null
