  project_name: Flexible Exports for Solar PV
  what_happened: For new customer applicants in Victoria, the additional upfront cost
    of a compatible inverter and the 12-month trial duration created a low perceived
    value proposition — one customer paid $1,100 more than originally quoted to participate,
    acknowledging they would not recoup this through feed-in tariff earnings during
    the trial period.
  lesson_learnt: Short trial durations combined with mandatory hardware upgrade costs
    create a poor value proposition for new customers — either subsidise the hardware
    cost or design the offer duration to align with the customer's expected payback
    period to make participation financially rational.
