    identified as non-compliant (incorrectly installed or configured), requiring manual
    compliance management. Initial awareness and education efforts did not sufficiently
    shift compliance rates — at the time the automated compliance program was introduced,
    only 16.5% of solar retailers had a compliance rating above 90%.
