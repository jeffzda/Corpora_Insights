- record_id: ARENA-DLV-52921
  source_title: SA Power Networks - Flexible Exports for Solar PV Trial - Final Report
  publish_date: '2023-10-19'
  project_name: Flexible Exports for Solar PV
  what_happened: SA Power Networks' Flexible Exports system delivered export limits
    at 10kW or system capacity for 99.4% of the time, exceeding the pre-trial hypothesis
    of 98%, and the flexible option enabled approximately 500 MWh of additional solar
    energy to be exported to the network compared to a fixed 1.5kW export limit over
    the trial period.
  lesson_learnt: Flexible export limits can provide substantially higher network capacity
    utilisation than static export limits in constrained areas — constraint-based
    dynamic envelopes that only curtail during actual congestion events allow customers
    to export at or near their inverter capacity nearly all of the time, making the
    flexible option significantly more valuable to customers than a conservative fixed
    limit.
  issue_severity: none
  project_type: network/grid
