  secondary_failure_mode: coordination & stakeholders
  intervention_note: SA Government regulations mandated CSIP-AUS capability for all
    new installations from 1 July 2023, resulting in >95% of SA market share being
    Flexible Exports capable and uptake jumping from 36% to more than 85%.
  transferability: broad
  delay_magnitude: null
  technology_domain: DER
