- record_id: ARENA-DLV-9306
  source_title: Flexible Exports for Solar PV Lessons Learnt Report 2
  publish_date: 2021-04
  project_name: Flexible Exports for Solar PV
  what_happened: Non-technical project workstreams (customer offer development, stakeholder
    management, business change) had been planned using a waterfall approach, which
    proved impractical given the high uncertainty, changing interdependencies, and
    emerging information characteristic of a first-of-kind DER integration project.
    Adherence to detailed upfront plans resulted in rework and inefficiency.
  lesson_learnt: For novel DER integration or network innovation projects with high
    uncertainty and multiple interdependencies, adopt a hybrid-agile delivery methodology
    for non-technical workstreams — a waterfall approach based on detailed upfront
    planning is likely to generate rework as context changes; agile sprint-style increments
    allow the team to adapt iteratively and reduce waste.
  issue_severity: moderate
  project_type: network/grid
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: network business
  delay_category: internal governance/resourcing
  failure_mode: coordination & stakeholders
  outcome_class: re-scoped/adapted
