  source_title: SA Power Networks - Flexible Exports for Solar PV Trial - Final Report
  publish_date: '2023-10-19'
  project_name: Flexible Exports for Solar PV
  what_happened: Reliable internet connectivity at customer sites was identified as
    a critical dependency for Flexible Exports participation — devices without communications
    fall back to the minimum (1.5kW) export limit, creating a financial incentive
    for customers to invest in reliable connectivity but also an ongoing support burden
    for installers and DNSPs.
  lesson_learnt: Internet connectivity is a critical operational dependency for customer-side
    DER control — set the fallback export limit at a level that is genuinely acceptable
    to the customer (not punishingly low) to avoid complaints during outages, and
    provide customers with clear guidance on the trade-offs between Wi-Fi, hardwired,
    and 4G/5G connectivity options at installation time.
