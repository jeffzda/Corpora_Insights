  what_happened: Contracting with multiple project partners — including international
    inverter vendors with overseas legal counsel — took approximately 8–9 months,
    around 2 months longer than anticipated, delaying project commencement. Legal
    teams were not engaged in earnest until after the ARENA funding agreement was
    signed, and it was only then that misinterpretations and irrelevant clauses in
    the standard contract became apparent.
  lesson_learnt: Engage legal teams from all partner organisations before finalising
    the funding agreement, not after — using a standard contract template with international
    partners without early legal review caused misinterpretations that extended contracting
    by approximately 2 months. For multi-partner projects involving overseas entities,
    develop bespoke contracts early and allow 9+ months for the contracting process.
