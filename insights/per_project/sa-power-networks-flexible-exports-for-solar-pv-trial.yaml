  what_happened: In some AusNet installations, the solar retailer completed the SwitchDin
    Droplet training and accreditation registration on behalf of the installer, meaning
    the on-site installer had not completed the mandatory training and did not know
    how to connect the device properly. In other cases, retailers failed to communicate
    training requirements to subcontractors at all.
