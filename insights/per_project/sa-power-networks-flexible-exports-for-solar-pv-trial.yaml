  what_happened: Installers found that commissioning a Flexible Exports site — connecting
    the Droplet device to the inverter and internet and registering with the AusNet
    server — could double the time required on site for a first installation. Many
    installers adopted a wait-and-see approach and did not undertake multiple installations,
    limiting skill development.
  lesson_learnt: First-time commissioning of DER integration technology (gateway devices,
    CSIP-AUS registration) significantly increases on-site time for installers; provide
    clear step-by-step commissioning guides, offer live support during the first installation,
    and develop an on-site capability test to allow installers to verify correct registration
    before leaving site.
