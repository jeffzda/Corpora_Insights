  project_name: Flexible Exports for Solar PV
  what_happened: COVID-19 restrictions prevented in-person stakeholder and customer
    engagement, forcing the entire customer research and industry consultation process
    to be conducted virtually. This made the process significantly more resource-intensive
    and time-consuming, requiring more frequent but shorter interactions and substantially
    more internal preparation effort.
  lesson_learnt: Virtual stakeholder engagement requires significantly more internal
    resourcing than in-person engagement — project plans should explicitly budget
    for this overhead. However, virtual formats also offer an advantage for geographically
    dispersed stakeholders, enabling interstate participation that would otherwise
    be impractical.
