- record_id: ARENA-DLV-9309
  source_title: Flexible Exports for Solar PV Lessons Learnt Report 2
  publish_date: 2021-04
  project_name: Flexible Exports for Solar PV
  what_happened: The CSIP test procedure, which originated in California and had seen
    limited practical deployment at scale, did not test the physical response of inverters
    to control signals or validate that meter readings and inverter status reports
    reflected the true operating state of the system — leaving a material gap in end-to-end
    validation before field deployment.
  lesson_learnt: Inverter communication protocol certification processes derived from
    overseas standards (e.g. California Rule 21 CSIP) should not be assumed to cover
    functional hardware validation — future Australian deployments should require
    functional testing including physical inverter response and status verification
    in a test laboratory as part of the CSIP-AUS compliance and certification process
    before field trial commencement.
