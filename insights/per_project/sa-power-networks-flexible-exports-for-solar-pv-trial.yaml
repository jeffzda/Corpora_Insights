  source_title: SA Power Networks - Flexible Exports for Solar PV Trial - Final Report
  publish_date: '2023-10-19'
  project_name: Flexible Exports for Solar PV
  what_happened: In some AusNet trial cases, the solar retailer contact provided with
    installation instructions was not the solar installer who performed the work,
    so there was no way for AusNet to confirm that the commissioning instructions
    were passed on to the installer. In other cases, installations were completed
    without successfully commissioning the customer's inverter to the Flexible Exports
    platform.
  lesson_learnt: The solar retailer and solar installer are often different parties
    — DNSPs must find a way to communicate commissioning requirements directly to
    the installer (not just the retailer), or build verification steps into the installer-facing
    digital process, to ensure Flexible Exports sites are correctly commissioned.
