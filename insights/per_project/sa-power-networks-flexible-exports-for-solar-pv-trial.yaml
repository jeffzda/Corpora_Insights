  publish_date: '2022-06-23'
  project_name: Flexible Exports for Solar PV
  what_happened: Customers with unauthorised exports on the AusNet network both invalidated
    the hosting capacity algorithm's results and, once Flexible Exports customers
    were enrolled, reduced available network capacity for those trial participants
    — directly lowering the export limits assigned to compliant trial customers.
  lesson_learnt: Unauthorised exports on a constrained network can undermine the integrity
    of a flexible export trial by corrupting hosting capacity data and crowding out
    compliant trial participants — a pre-trial compliance audit of the targeted network
    area should be conducted to identify and remediate unauthorised exports before
    enrolling customers.
