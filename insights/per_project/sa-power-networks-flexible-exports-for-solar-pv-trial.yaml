  what_happened: AusNet Services' Flexible Exports trial enabled an additional 54.4
    MWh of exports across enrolled systems, with the export limit algorithm gradually
    increasing a customer's export allowance over time as confidence grows that their
    exports are not detrimental to the network. The average export limit for 5kW customers
    was 3.31kW — 66% of the maximum unconstrained business-rules limit.
  lesson_learnt: A graduated, confidence-building approach to increasing export limits
    (rather than immediately assigning maximum capacity) can provide a conservative
    but effective mechanism for safely expanding DER hosting on constrained networks,
    and the export limit trajectory data provides evidence to support future network
    investment decisions.
