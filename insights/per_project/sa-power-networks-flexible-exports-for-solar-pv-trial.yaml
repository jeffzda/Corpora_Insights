- record_id: ARENA-DLV-9304
  source_title: Flexible Exports for Solar PV Lessons Learnt Report 2
  publish_date: 2021-04
  project_name: Flexible Exports for Solar PV
  what_happened: The existing AER-approved Model Standing Offer (MSO) for basic connection
    services did not accommodate geographically variable export limits or the technical
    and security specifications required for smart inverter/DER flexible export schemes.
    SA Power Networks had to undertake a lengthy internal and external legal process
    to modify the MSO before the trial could proceed.
  lesson_learnt: When developing flexible export connection offers, DNSPs should clearly
    delineate which requirements sit in the MSO (functional, high-level) versus in
    associated technical standards (detailed parameters, protocol specifications)
    — and should consider national alignment of technical parameters such as fail-safe
    behaviour to reduce compliance burden for inverter manufacturers operating across
    multiple states.
