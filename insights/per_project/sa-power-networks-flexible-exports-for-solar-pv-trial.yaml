- record_id: ARENA-DLV-53610
  source_title: Flexible Exports for Solar PV Lessons Learnt Report 3
  publish_date: 2021-09
  project_name: Flexible Exports for Solar PV
  what_happened: Fronius had to substantially modify an existing aggregator platform
    originally built for California Rule 21 deployment to meet Australian flexible
    exports requirements, resulting in 3,000 additional lines of code and 4,000 amended
    lines of code, driven by new functions required in Australia, different interpretations
    of the standard, and the fact that the Rule 21 aggregator had not previously been
    integrated with a utility server.
  lesson_learnt: OEMs should not assume that an aggregator platform certified for
    one jurisdiction (e.g. Rule 21 in California) can be reused with minor modification
    for another jurisdiction — differences in standard interpretation, required functions,
    and utility integration points may require substantial rework; platform flexibility
    and configurable feature toggles should be built in from the start.
  issue_severity: moderate
