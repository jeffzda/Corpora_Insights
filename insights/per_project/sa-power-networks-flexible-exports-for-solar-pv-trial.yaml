  source_title: SA Power Networks - Flexible Exports for Solar PV Trial - Final Report
  publish_date: '2023-10-19'
  project_name: Flexible Exports for Solar PV
  what_happened: Approximately 15% of SA Power Networks trial sites experienced spurious
    export limit breaches greater than 250W, almost all of which were caused by measurement
    averaging windows not perfectly aligning with device polling for export limits,
    rather than genuine non-compliance. For AusNet, one customer with an incorrectly
    functioning installation skewed the fleet-wide exceedance rate from 0.04% to 1.43%.
  lesson_learnt: Export limit breach monitoring must account for measurement artefacts
    (averaging window misalignment, polling timing) to distinguish genuine non-compliance
    from measurement noise; a single non-functioning installation can dominate fleet-level
    statistics — assess compliance on a per-customer basis and investigate outlier
    sites individually rather than relying on fleet averages.
