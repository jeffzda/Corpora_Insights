    2 FTE) to +$40m (scaled option, 10+ FTE) depending on the scope of deployment.
  lesson_learnt: DNSPs planning Flexible Exports implementation should expect significant
    upfront systems development costs ($1.5m–$5.5m for a single DNSP at trial/initial
    scale) but can materially reduce costs by leveraging existing infrastructure —
    AusNet's use of AMI data and its existing Smart Networks analytics platform avoided
    significant network monitoring hardware expenditure; identify existing system
    components that can be re-used before scoping new build.
