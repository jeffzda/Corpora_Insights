- record_id: ARENA-DLV-52904
  source_title: SA Power Networks - Flexible Exports for Solar PV Trial - Final Report
  publish_date: '2023-10-19'
  project_name: Flexible Exports for Solar PV
  what_happened: AusNet attempted to recruit customers through solar installers but
    found most Victorian installers had already developed their own workarounds for
    export-constrained customers (recommending paid technical assessments, upselling
    batteries, downsizing systems, or ignoring export limits in breach of connection
    agreements) and were not motivated to promote the Flexible Exports offer.
  lesson_learnt: A new DER connection offer that depends on specific compatible hardware
    will have its market reach constrained by the installed base and stocking preferences
    of solar retailers. Engage inverter manufacturers early to expand the compatible
    equipment range before trial launch, and plan for regulatory requirements (e.g.
    mandatory dynamic export capability) to enforce broad compatibility at scale.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: stakeholder/land/community
  failure_mode: coordination & stakeholders
  outcome_class: partial success
  secondary_failure_mode: commercial & market
  intervention_note: SA Power Networks was working with the majority of technology
    providers to ensure a broad selection of compatible equipment was available ahead
    of SA's December 2022 Dynamic Export regulation deadline, which would require
    all new or upgraded solar installations to be compatible.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: DER
  source_pages:
  - 9
  - 37
  - 38
  evidence_excerpt: 'Most installers working on the AusNet network who had experience
    of customer connections with constrained export limits had already developed their
    own strategies for managing these connections and were not motivated to promote
    the Flexible Exports offer. We learnt that their workarounds for export constrained
    customers including: recommending their customer pay for a technical assessment
    of their connection; using the export constraint to up-sell their customer with
    a battery or down-size an installation size to just cover customer consumption
    needs; or ignore the contractual export limit and allow full export, in breach
    of the customer''s connection agreement with AusNet.'
