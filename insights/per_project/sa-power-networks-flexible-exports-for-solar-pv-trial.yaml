  project_name: Flexible Exports for Solar PV
  what_happened: Using an aggregator integration model for IEEE 2030.5 communication
    in a flexible exports scheme requires OEMs to deploy and maintain separate platform
    instances for each DNSP/network region due to the need to segregate customers,
    potentially resulting in 10 or more instances across Australia if all jurisdictions
    implement similar schemes.
  lesson_learnt: OEMs choosing an aggregator integration model for flexible exports
    should design their system architecture to natively support multi-instance deployment
    and customer segregation across network regions from the outset — retrofitting
    this capability after the fact requires significant regression testing effort
    for every code change across all instances.
