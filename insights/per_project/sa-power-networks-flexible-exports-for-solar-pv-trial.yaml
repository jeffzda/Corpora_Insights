  source_title: Flexible Exports for Solar PV Lessons Learnt Report 3
  publish_date: 2021-09
  project_name: Flexible Exports for Solar PV
  what_happened: Field testing at 9 real customer sites (7 SA Power Networks, 2 AusNet
    Services) revealed wiring configurations not covered by installer guidance material,
    including complexity introduced by the SA Smarter Homes Smart Meter Minimum Technical
    Standard requiring separate solar generation metering elements. Metering coordinators
    subsequently attending sites to replace revenue meters could invalidate the inverter
    energy meter installation, causing over or under curtailment.
  lesson_learnt: Test installation and commissioning materials on a diverse sample
    of real customer sites before broader rollout — laboratory or controlled-environment
    testing alone will not surface the site-specific wiring and metering configurations
    that installers encounter in the field, and undiscovered issues risk unsuccessful
    commissioning at scale.
