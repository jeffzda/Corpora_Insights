- record_id: ARENA-DLV-52930
  source_title: SA Power Networks - Flexible Exports for Solar PV Trial - Final Report
  publish_date: '2023-10-19'
  project_name: Flexible Exports for Solar PV
  what_happened: SA Power Networks' hosting capacity modelling found that the previously
    standard 5kW per phase fixed export limit was no longer sustainable given increasing
    solar PV penetration, with the network able to accommodate only 1.5kW of export
    per customer on average under fixed export limit arrangements in congested areas.
  lesson_learnt: DNSPs should proactively model LV hosting capacity and the long-run
    sustainable fixed export limit to anticipate when current export limit settings
    will become untenable — waiting until network constraints are experienced before
    acting will result in reactive imposition of zero export limits and customer backlash;
    planning ahead allows a managed transition to flexible connections with better
    customer outcomes.
