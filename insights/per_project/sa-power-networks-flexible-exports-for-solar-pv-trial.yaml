  evidence_excerpt: Any flexible export system will fall back to the 1.5kW export
    limit in the event of a communication outage, which incentivises customers to
    utilise reliable internet connectivity to maximise their ability to export. There
    is a trade-off between a simple, no-cost Wi-Fi connection to the inverter, compared
    to hardwiring the system to the home internet connection or establishing a dedicated
    4G/5G connection at additional cost... In cases where an extended outage has occurred,
