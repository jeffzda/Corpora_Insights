- record_id: ARENA-DLV-8223
  source_title: SA Power Networks – Flexible Exports for Solar PV – Lessons Learnt
    Report 4
  publish_date: '2022-06-23'
  project_name: Flexible Exports for Solar PV
  what_happened: Despite SA Power Networks pre-trial outbound calls to the top 40
    installers finding more than 80% had medium-or-higher knowledge of Flexible Exports,
    a portion of installers in congested areas were still not passing the offer on
    to customers or checking the SmartApply options tool prior to sale, resulting
    in customers remaining unaware of their export options.
  lesson_learnt: Pre-trial installer education surveys can overstate readiness — high
    self-reported knowledge does not reliably translate to changed sales behaviour.
    Supplement training with embedded process controls (e.g. mandatory options-check
    steps in the connection application tool) that make the correct behaviour the
