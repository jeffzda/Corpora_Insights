  intervention_note: SA Power Networks introduced flexible export limits as a new
    connection option (1.5–10kW) for congested areas instead of imposing a blanket
    1.5kW fixed limit, unlocking substantially more network capacity for solar customers.
  transferability: broad
  delay_magnitude: null
