- record_id: ARENA-DLV-7955
  source_title: Wyndham City Council - Local Council BEV Integration Project - Lessons
    Learnt Report 2
  publish_date: 2025-07
  project_name: Local Council EV Integration Project
  what_happened: To install EV chargers and underground conduits at a 24/7 operational
    council depot without disrupting fleet operations, the project employed directional
    boring instead of open trenching, scheduled electrical shutdowns over weekends,
    and phased conduit installation across the site, successfully maintaining operational
    continuity throughout construction.
  lesson_learnt: When installing EV charging infrastructure at live operational depot
    sites, use directional boring and phased weekend electrical shutdowns to maintain
    fleet access and continuity — however, directional boring introduces greater subsurface
    risk than open trenching, so this trade-off must be explicitly assessed and priced
    during planning.
