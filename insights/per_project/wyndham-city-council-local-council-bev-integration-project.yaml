- record_id: ARENA-DLV-20505
  source_title: Wyndham City Council - Local Council BEV Integration Project - Lessons
    Learnt Report 1
  publish_date: 2025-01
  project_name: Local Council EV Integration Project
  what_happened: Charging infrastructure assessments conducted by consultants were
    based on average daily kilometres travelled, which overlooked worst-case operational
    scenarios such as extended hours during emergency responses (e.g. severe storm
    cleanup) when simultaneous high vehicle utilisation and cold-weather building
    energy demand reduce available charging power.
  lesson_learnt: Embed worst-case scenario analysis into EV charging infrastructure
    design by modelling council-specific peak demand scenarios (including emergency
    response and extreme weather events) in consultation with key operational stakeholders
    — average-use-based designs risk leaving EVs unable to recharge and deploy during
    critical operations.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: government/public-sector body
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Discussions with operational staff prompted a re-analysis of
    the design for one council, confirming sufficient capacity but identifying the
    need for a future electrical supply upgrade as the fleet electrifies.
  transferability: moderate
  delay_magnitude: null
  technology_domain: EV
  source_pages: &id010
  - 7
  evidence_excerpt: during a severe winter storm cleanup, council vehicles, such as
    trucks, may need to operate for extended hours and cover longer distances. Simultaneously,
    cold weather increases energy demand for heating and lighting in nearby buildings,
    reducing the power available for EV charging. If the charging system is not designed
    to accommodate such scenarios, it can significantly disrupt council operations,
    leaving EVs unable to recharge and deploy during emergencies.
  confidence_note: null
