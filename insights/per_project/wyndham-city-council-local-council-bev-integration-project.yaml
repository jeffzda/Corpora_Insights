- record_id: ARENA-DLV-7951
  source_title: Wyndham City Council - Local Council BEV Integration Project - Lessons
    Learnt Report 2
  publish_date: 2025-07
  project_name: Local Council EV Integration Project
  what_happened: Sustainability teams across the three participating councils were
    positioned as primary implementers of the EV fleet transition without clear executive
    sponsorship or structured change management, exposing them to unrealistic technical
    expectations, disproportionate risk responsibility, limited operational authority,
    and reduced strategic weight within their organisations.
  lesson_learnt: Sustainability teams should act as enablers, not sole drivers, of
    EV fleet transitions — secure visible executive sponsorship and a formal change
    management plan with defined roles before implementation begins, and actively
    involve Fleet, Facilities, and Finance from the outset to embed shared ownership
    across the organisation.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: government/public-sector body
  delay_category: internal governance/resourcing
  failure_mode: coordination & stakeholders
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Delivery was coordinated through a multi-council Project Working
    Group and supported by intra-council working groups with key stakeholders to distribute
    responsibility and reduce pressure on Sustainability teams.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: EV
  source_pages: &id001
