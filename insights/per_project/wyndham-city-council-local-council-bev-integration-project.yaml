  project_name: Local Council EV Integration Project
  what_happened: Fleet teams' natural risk aversion and negative past experiences
    — including an early breakdown of a heavy EV in the Brimbank fleet — created low
    acceptance rates among council staff, deepening scepticism toward introducing
    and trialling new EVs.
  lesson_learnt: Showcase recent positive council EV implementations to staff early
