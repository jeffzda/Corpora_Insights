- record_id: ARENA-DLV-7953
  source_title: Wyndham City Council - Local Council BEV Integration Project - Lessons
    Learnt Report 2
  publish_date: 2025-07
  project_name: Local Council EV Integration Project
  what_happened: During installation of EV charging infrastructure at a council depot,
    underground service detection revealed deeper-than-expected existing utilities,
    requiring conduit paths to be drilled through rock rather than clay. This increased
    drilling costs beyond the 10% contingency budget, necessitating an internal budget
    variation, although the project timeline included sufficient contingency to absorb
    the delay and works were completed within the original schedule.
  lesson_learnt: For EV charging infrastructure installations at live depot sites,
    conduct thorough early utility investigations — particularly on older or poorly
    documented sites — and set contingency budgets that reflect actual site complexity
    rather than a flat percentage of project value, as subsurface surprises can readily
    exceed standard contingency allowances even when schedule is preserved.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: demonstration
  lifecycle_phase: construction/installation
  proponent_type: government/public-sector body
  delay_category: construction/installation
  failure_mode: poor scoping
  outcome_class: delayed but recoverable
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: An internal budget variation was raised to cover the rock-drilling
    cost overrun; the project's pre-built schedule contingency absorbed the resulting
    progress slowdown, and works were completed within the original timeline.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: EV
  source_pages: &id003
  - 7
  - 8
  evidence_excerpt: Underground service detection revealed deeper-than-expected existing
    utilities, requiring conduit paths to go through rock rather than clay. This increased
    drilling costs and slowed progress. While the 10% cost contingency was not enough
    to absorb the budget overrun for rock-drilling (necessitating an internal variation),
    the project timeline included sufficient contingency. As a result, despite the
    challenges, works were completed within the original schedule.
  confidence_note: issue_severity rated moderate — cost overrun required a formal
    internal variation but final schedule was preserved; secondary_failure_mode of
    design assumption failure reflects that the conduit routing assumed clay rather
    than rock conditions.
