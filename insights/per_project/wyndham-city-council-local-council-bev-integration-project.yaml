- record_id: ARENA-DLV-7952
  source_title: Wyndham City Council - Local Council BEV Integration Project - Lessons
    Learnt Report 2
  publish_date: 2025-07
  project_name: Local Council EV Integration Project
  what_happened: Council staff across participating organisations, including those
    generally supportive of the EV transition, held significant concerns about EV
    fire risks (battery thermal runaway, charger faults, toxic fumes, fire spread
    to assets), often amplified by misinformation, leading to reduced internal support,
    hesitancy among potential users, financial caution from management, and excessively
    conservative charger placement decisions.
  lesson_learnt: Address EV fire safety concerns proactively and early by engaging
    independent technical experts to counter misinformation and applying recognised
    best-practice frameworks (such as EV FireSafe standards) for charger placement,
    emergency response planning, and staff communications — relying on credible third-party
    input adds objectivity that internal teams alone cannot provide.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: government/public-sector body
  delay_category: stakeholder/land/community
  failure_mode: coordination & stakeholders
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: The project engaged independent technical experts and adopted
    EV FireSafe best-practice standards to guide charger placement, thermal runaway
    risk management procedures, and emergency response planning, building staff confidence
    and organisational support.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: EV
  source_pages: &id002
