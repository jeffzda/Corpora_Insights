  what_happened: At a second depot site, concept design for EV charging infrastructure
    required adjustment after inground services were detected that conflicted with
    the proposed layout, indicating that subsurface utility conflicts affecting design
    were not a one-off but a recurring pattern across multiple sites.
  lesson_learnt: Treat subsurface utility detection as a mandatory early-stage activity
    across all depot sites before finalising charging infrastructure concept designs
    — detecting conflicts post-design forces costly redesign iterations that could
    be avoided with upfront investigation.
