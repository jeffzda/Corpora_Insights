  - 6
  evidence_excerpt: 'Sustainability teams are often seen as the champions of the EV
    transition given their role in driving organisational emissions reduction... their
    leadership role in implementation can be a mixed blessing. It places them at the
    centre of the transition but also exposes them to risks and challenges: Unrealistic
    expectations to provide technical expertise outside their remit... Disproportionate
    responsibility for project risks... Limited authority over operational decisions.'
