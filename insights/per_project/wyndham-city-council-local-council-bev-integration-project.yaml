- record_id: ARENA-DLV-20504
  source_title: Wyndham City Council - Local Council BEV Integration Project - Lessons
    Learnt Report 1
  publish_date: 2025-01
  project_name: Local Council EV Integration Project
  what_happened: Cost estimates for vehicles and charging infrastructure prepared
    during planning phases — some less than 12 months old — were already outdated
    by the time project implementation began, due to rapid market changes including
    new suppliers entering and exiting the heavy EV space in Australia.
  lesson_learnt: Allow for flexibility in vehicle models, charger products, and budgets
    when planning fleet electrification projects — cost analyses in rapidly evolving
    markets have a short shelf life and rigid specifications will require costly revision
    within a single planning cycle.
