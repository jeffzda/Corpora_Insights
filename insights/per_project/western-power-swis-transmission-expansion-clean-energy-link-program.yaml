- record_id: ARENA-DLV-40606
  source_title: ARENA Electrical Infrastructure Roundtable
  publish_date: '2025-06-25'
  project_name: Western Power SWIS Transmission Expansion (Clean Energy Link Program)
  what_happened: A surge in new connection enquiries in 2022 — driven by state decarbonisation
    commitments and WEM rule changes — revealed that existing transmission infrastructure
    was insufficient to accommodate the scale of anticipated industrial and renewable
    load growth, necessitating a major transmission expansion program.
  lesson_learnt: Policy-driven demand surges for grid connections can outpace existing
    transmission capacity in ways not visible until large-scale enquiries are lodged;
    network businesses and governments should conduct prospective demand assessments
    and pre-approve transmission expansion scoping before the surge arrives, rather
    than reacting after the queue forms.
