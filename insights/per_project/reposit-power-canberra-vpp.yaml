- record_id: ARENA-DLV-45504
  source_title: ARENA Insights Forum Presentation Summaries & Key Points – DER Stream
  publish_date: 2019-06
  project_name: Reposit Power Canberra VPP
  what_happened: Forecasted dispatch did not accurately reflect actual dispatch on
    the Reposit Canberra VPP due to inconsistent installation processes, variability
    in technology capabilities between proprietary systems, and limited grid visibility.
  lesson_learnt: Standardise installation processes and improve real-time grid visibility
    before relying on VPP dispatch forecasts — inconsistent installations and proprietary
    capability gaps cause material divergence between forecast and actual dispatch,
    undermining grid service reliability.
