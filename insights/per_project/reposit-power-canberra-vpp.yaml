- record_id: ARENA-DLV-45505
  source_title: ARENA Insights Forum Presentation Summaries & Key Points – DER Stream
  publish_date: 2019-06
  project_name: Reposit Power Canberra VPP
  what_happened: Unorchestrated small-scale batteries and PV systems on the Reposit
    VPP were found to act against grid needs, with self-serving pricing algorithms
    causing systems to import power during load shedding events.
  lesson_learnt: Ensure VPP systems are orchestrated before deployment — unorchestrated
    DER with self-serving algorithms can actively harm grid stability during critical
    events, negating the value proposition of the VPP.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: null
  failure_mode: unvalidated integration
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: Reposit implemented coordinated orchestration to enable the VPP
    to provide ancillary services such as grid frequency stabilisation.
  transferability: broad
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id002
