- record_id: ARENA-DLV-45506
  source_title: ARENA Insights Forum Presentation Summaries & Key Points – DER Stream
  publish_date: 2019-06
  project_name: Reposit Power Canberra VPP
  what_happened: Coordinated VPP systems on the Reposit project could provide frequency
    stabilisation ancillary services, but current AEMO market processes prevented
    participation in FCAS raise markets, limiting the commercial value realised.
  lesson_learnt: Identify AEMO market participation constraints — specifically FCAS
    raise market eligibility — before designing VPP revenue models, as regulatory
    barriers can prevent coordinated DER fleets from accessing expected value streams.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: null
