- record_id: ARENA-DLV-20730
  source_title: Demand Response Short Notice RERT Trial Year 3 Report
  publish_date: 2021-10
  project_name: DR SN RERT Trial — RERT contracting timeline as barrier to recruitment
  what_happened: At least one participant identified that AEMO's contracting and empanelment
    timeframe for the RERT was too short to allow adequate customer prospecting and
    recruitment, and that a six-month prospecting window would produce significantly
    better outcomes.
  lesson_learnt: AEMO's RERT contracting process should allow at least six months
    of lead time for aggregators to prospect and recruit customers; insufficient lead
    time for recruitment reduces portfolio size and quality and may prevent aggregators
    from reaching contracted capacity targets, particularly for C&I customers who
    require longer sales and onboarding cycles.
