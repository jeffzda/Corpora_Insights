  project_name: Project Highgarden
  what_happened: Horizon Power's Project Highgarden final milestone (Milestone 4 —
    reporting and knowledge sharing) was delayed from its original estimated date
    due to COVID-19 impacts, with the new estimated completion pushed to March 2021.
  lesson_learnt: Knowledge sharing and reporting milestones dependent on aggregating
    field data and conducting analysis are particularly vulnerable to COVID-19 delays
    in remote or regional project locations — programme managers should allow extended
    timelines for reporting milestones and avoid scheduling them immediately after
    field data collection completes.
