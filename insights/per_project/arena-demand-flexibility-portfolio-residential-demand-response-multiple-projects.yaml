- record_id: ARENA-DLV-53893
  source_title: Demand Flexibility Portfolio Retrospective Analysis Report
  publish_date: 2023-07
  project_name: ARENA Demand Flexibility Portfolio — Residential Demand Response (multiple
    projects)
  what_happened: Multiple residential demand flexibility projects found that the growth
    of DER assets (solar PV, batteries, EVs) made accurate measurement of demand response
    increasingly difficult, as these assets affect the baseline and create confounding
    variations (cloud cover reducing solar output, remote battery dispatch) that are
    difficult to disentangle from deliberate demand response.
  lesson_learnt: As DER penetration increases, household-level demand response measurement
    using standard baseline approaches will become progressively less reliable; programs
    should design for deeming-based or technology-averaged measurement methodologies
    from the outset rather than attempting precise household-level quantification,
    which will become less feasible and more expensive over time.
