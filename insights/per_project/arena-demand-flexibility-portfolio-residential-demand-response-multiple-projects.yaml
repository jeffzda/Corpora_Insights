  evidence_excerpt: These measurement issues are exacerbated by the growth of DER
    assets such as solar PV, batteries and electric vehicles. DER assets impact on
    the establishment of an accurate baseline for behavioural demand response – and
    make it very difficult to disentangle demand flexibility from other factors creating
    variations e.g. cloud cover reducing solar PV generation, disconnection to maintain
    network stability, remote controlled dispatch of batteries.
