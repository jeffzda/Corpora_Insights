  project_name: deX South Australia Project
  what_happened: The deX South Australia Project co-design and industry engagement
    phase was conducted entirely via video conference and survey during March–April
    2020 due to COVID-19 restrictions. Fourteen one-on-one consultations, a vendor
    webinar, and a follow-up survey were completed, covering retailers, aggregators,
    installers, vendors, consumer advocates, government, SAPN, and AEMO.
  lesson_learnt: A structured remote engagement methodology (one-on-one video consultations
    with targeted stakeholder groups, followed by a webinar and survey) can deliver
    meaningful co-design findings for a DER platform project even under pandemic restrictions
    — design the engagement sequencing to move from qualitative depth interviews to
    broader quantitative validation rather than relying on large in-person forums.
