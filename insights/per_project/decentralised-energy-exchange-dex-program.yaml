  source_title: deX Program Final Report
  publish_date: '2021-09-30'
  project_name: deX Program
  what_happened: On 14 March 2021, South Australia's operational demand dropped approximately
    300 MW below forecast, triggering a grid security event. deX was called upon to
    remotely disconnect its portfolio of solar devices registered under Smarter Homes
    regulations; disconnection was executed in under five minutes and reconnection
    was also completed in under five minutes, with the full portfolio participating
    for two hours without issue.
  lesson_learnt: API-based DER remote disconnect capability, when pre-integrated with
    network operator systems and supported by compliance regulation, can execute grid
    emergency backstop actions at scale within minutes — this demonstrates that software-based
    DER management is technically viable as a real-time grid security tool.
