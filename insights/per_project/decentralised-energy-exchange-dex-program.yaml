  project_name: DER Visibility & Monitoring Best Practice Guide
  what_happened: Technology vendors faced a risk that external parties would define
    DER data standards on their behalf without their input. GreenSync and Solar Analytics
    proactively convened ten leading companies to collaboratively develop a Best Practice
    Guide for DER visibility and monitoring data standards, published in May 2020.
  lesson_learnt: Technology vendors should proactively lead the development of DER
    data standards rather than waiting for regulators or others to define requirements
    — a vendor-led collaborative process engaging a critical mass of industry participants
    produces a workable, agreed data set faster and reduces the risk of being bound
    by standards that do not reflect technical realities.
