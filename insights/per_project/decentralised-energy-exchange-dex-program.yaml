  what_happened: During development of the UKPN ANM bid withdrawal functionality,
    the team adopted a finite state machine approach for bid state transitions, enabling
    strict validation protocols to govern how bids move through the tendering process.
  lesson_learnt: Use a finite state machine pattern to manage bid state transitions
    in energy service tendering platforms; this enforces strict validation and provides
    a verifiable governance trail for bidding and contracting processes.
