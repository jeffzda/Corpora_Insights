  project_name: deX Consumer Insights (Enphase Pilot)
  what_happened: Testing two email send times (6pm Wednesday vs 8am Sunday) revealed
    that 8am Sunday generated approximately 40% registration completion compared to
    22–25% for 6pm Wednesday, despite Wednesday having higher unique open rates (~71%
    vs 50–68%).
  lesson_learnt: For DER registration campaigns requiring customers to enter system
    information, send timing materially affects completion rates — a time when customers
    are uninterrupted and can access documents such as electricity bills (e.g. Sunday
    morning) outperforms higher-traffic weekday times. Test send times empirically
    rather than optimising only for open rates.
