- record_id: ARENA-DLV-30506
  source_title: deX Project Progress January 2021
  publish_date: 2021-01
  project_name: deX – DER Integration and Automation project (Evoenergy/GreenSync)
  what_happened: The project identified that current industry practice for network
    capacity allocation uses individual equal/equitable allocation limits, which requires
    network management systems to efficiently determine limit values for all DER according
    to an allocation policy — a capability not universally present.
  lesson_learnt: When designing DER network capacity allocation, ensure the network
    management system can efficiently compute limit values for all DER under a defined
    allocation policy; without this capability, dynamic limit allocation strategies
    cannot be operationalised at scale.
