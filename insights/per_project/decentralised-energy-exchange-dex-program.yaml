  what_happened: For the first release of deX Markets, GreenSync focused development
    on the early parts of the end-to-end process flow (registration, tendering, contracting)
    rather than attempting to deliver complete functionality in one release. This
    enabled the first production release to UKPN in April 2020 on schedule.
  lesson_learnt: For complex multi-party DER platform software, sequence releases
    around the front end of the process flow first — delivering early-stage functionality
    (registration, tendering, contracting) allows the client to begin real-world use
