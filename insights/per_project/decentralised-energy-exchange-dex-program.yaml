  project_name: deX Program
  what_happened: Third-party DER vendors made undisclosed changes to their APIs without
    prior notification, causing repeated technical and operational disruptions both
    during integration development and after integrations went into production.
  lesson_learnt: When integrating with third-party DER vendor APIs, establish formal
    change-notification agreements and recurring technical liaison cadences before
    integration commences — undisclosed API changes create unpredictable production
    failures that are difficult to remediate reactively.
