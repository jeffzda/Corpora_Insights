  source_title: deX Project Progress January 2021
  publish_date: 2021-01
  project_name: deX – DER Integration and Automation project (Evoenergy/GreenSync)
  what_happened: The DER Integration and Automation project found that for DER to
    provide dynamic network support functions, a set of minimum technical capabilities
    must be met, including internet connectivity, frequent telemetry provision, controllable
    setpoints, safe fallback behaviour, and scheduled flexibility — capabilities not
    universally present across installed DER.
  lesson_learnt: Before designing a DER orchestration platform, confirm that the target
    DER population meets minimum technical capability requirements (internet connectivity,
    5-minute telemetry, remote setpoint control, safe fallback on comms loss); if
    these capabilities are not widespread, the business case depends on regulatory
    or incentive mechanisms to increase DER compliance.
