- record_id: ARENA-DLV-30510
  source_title: deX Project Progress January 2021
  publish_date: 2021-01
  project_name: deX Command – VPPx project
  what_happened: During integration with the AEMO VPP demonstration API, it was found
    that many VPP operators and demand response vendors do not collect or transmit
    the majority of data points specified in the VPP API specification, providing
    only the data points directly relevant to realising customer and aggregator value.
  lesson_learnt: Do not assume VPP operators and DR vendors will provide complete
    telemetry as specified in API standards; design platform ingestion to be tolerant
    of partial data and separately advocate for minimum mandatory data standards or
    incentives to drive broader telemetry collection.
