  project_name: deX Platform – deX Vision / Evoenergy DER Integration and Automation
    Project
  what_happened: The deX Vision evaluation engine was specifically designed to be
    extensible so that dispatch criteria (e.g. diversity, fairness, cost minimisation)
    could be applied or changed without rebuilding the engine, addressing the risk
    that future network operator requirements would diverge from the initial cost-minimisation
    objective.
  lesson_learnt: Build dispatch and optimisation engines for DER platform software
    with explicit extensibility from the outset — early-market deployments will evolve
    their optimisation objectives as network needs mature, and retrofitting extensibility
    is significantly more costly than designing for it initially.
