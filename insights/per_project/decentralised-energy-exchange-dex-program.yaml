  publish_date: 2021-01
  project_name: deX Project (ARENA)
  what_happened: Technology vendor APIs for DER devices were found to have varying
    levels of maturity, with many vendors requiring significant support to understand
    the capabilities needed to enable their customers to participate in a VPP via
    deX.
  lesson_learnt: When onboarding technology vendors to a DER platform, do not assume
    API readiness — assess vendor API maturity early and provide targeted support
    to help vendors understand integration requirements before expecting customer-facing
    functionality to be available.
