- record_id: ARENA-DLV-30512
  source_title: deX Project Progress January 2021
  publish_date: 2021-01
  project_name: deX Command – VPPx project
  what_happened: The VPPx project experience identified that distributing VPP forecasting
    responsibilities across multiple third parties produces arbitrary aggregated outputs
    because different methodologies cannot be meaningfully combined, and third parties
    without forecasting incentives are unlikely to apply sufficient rigour.
  lesson_learnt: Centralise DER forecasting capability rather than distributing it
    across third parties; forecast quality degrades when multiple parties apply different
    methodologies without incentives for accuracy, and rolling out updated forecasting
    standards to distributed parties is not practically achievable with modern machine
    learning approaches.
  issue_severity: moderate
