- record_id: ARENA-DLV-30505
  source_title: deX Project Progress January 2021
  publish_date: 2021-01
  project_name: deX – DER Integration and Automation project (Evoenergy/GreenSync)
  what_happened: The project identified that static DER group membership in network
    management systems is inadequate because DER can move between network areas through
    reconfiguration, requiring dynamic updating of group membership to reflect current
    network topology.
  lesson_learnt: Network management systems must support dynamic DER group membership
    that is updated periodically to reflect network reconfiguration; failure to do
    so means dispatch instructions will be directed at DER that can no longer address
    the relevant constraint.
