  publish_date: 2021-01
  project_name: deX – DER Integration and Automation project (Evoenergy/GreenSync)
  what_happened: The project found that existing network management systems typically
    assign DER to a single group, preventing the same DER from simultaneously contributing
    to resolution of multiple network issues such as thermal overload on a zone substation,
    thermal overload on a feeder, and overvoltage on a distribution substation.
  lesson_learnt: Network management systems should support non-exclusive DER group
    membership so that a single resource can be assigned to and dispatched across
    multiple network constraint contexts simultaneously, maximising DER utilisation
    and value.
