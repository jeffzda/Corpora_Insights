- record_id: ARENA-DLV-30511
  source_title: deX Project Progress January 2021
  publish_date: 2021-01
  project_name: deX Command – VPPx project
  what_happened: The VPPx project experience revealed that collecting, storing and
    validating all telemetry data points specified in the VPP API imposes costs that
    cannot be justified without a direct benefit to customers or the creation of portfolio
    revenue, leading operators to collect only commercially relevant data.
  lesson_learnt: VPP API specifications that require broad telemetry collection must
    be paired with clear commercial or regulatory incentives; absent these incentives,
    operators will collect only the minimum commercially useful data, creating persistent
    gaps in system-level data availability.
