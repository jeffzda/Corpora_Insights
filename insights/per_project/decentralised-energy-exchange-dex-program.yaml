  project_name: deX Program
  what_happened: As deX gained market profile, competing platforms with similar value
    propositions emerged, threatening the key partnerships needed to catalyse the
    platform business model and requiring defensive effort that had not been anticipated.
  lesson_learnt: First-mover DER platform programs should anticipate competitive entry
    and build platform lock-in (through integrations, partnerships, and standards
    participation) before competitors emerge — waiting until competition materialises
    makes it significantly harder to consolidate the ecosystem partnerships on which
    a multi-sided platform depends.
