  what_happened: The pilot omitted a campaign landing page and instead sent customers
    directly from the email call-to-action to their Enphase Enlighten portal login,
    reducing the number of steps in the registration journey. Despite this being contrary
    to standard email marketing best practice, the approach yielded high registration
    rates and 40% of recipients clicked through to the FAQ document.
  lesson_learnt: Reducing the number of steps in a DER registration customer journey
    — even at the cost of departing from standard marketing best practice — can improve
    conversion rates. Where a landing page is omitted, compensate by including sufficient
    information in the email itself and providing a prominent FAQ link.
