  source_title: deX Industry & Vendor Training January 2021
  publish_date: 2021-01
  project_name: deX Project (ARENA)
  what_happened: Installers were confused about the role of the new South Australia
    Relevant Agent entity in the registration process, causing disruption to training
    sessions and slowing uptake of the compliance workflow.
  lesson_learnt: When a new regulatory actor (such as a Relevant Agent) is introduced
    alongside a new digital registration platform, explicitly introduce that entity
    at the start of training before any platform demonstration — do not assume participants
    will be familiar with new regulatory constructs.
