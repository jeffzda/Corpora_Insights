- record_id: ARENA-DLV-38556
  source_title: deX Program Final Report
  publish_date: '2021-09-30'
  project_name: deX Program
  what_happened: Vendor API rate limits created performance constraints during dispatch
    scenarios; without active testing and management of each vendor's rate limits,
    the platform risked dispatch failures at scale.
  lesson_learnt: During both integration and operational phases of a DER platform,
    actively profile each vendor API's rate limits through realistic dispatch scenario
    testing — failure to understand these limits in advance leads to unexpected performance
    failures during real-world dispatch events.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: pilot
  lifecycle_phase: commissioning/integration
  proponent_type: technology vendor
  delay_category: commissioning/integration
  failure_mode: unvalidated integration
  outcome_class: delayed but recoverable
  secondary_failure_mode: null
  intervention_note: Monitoring systems quickly identified the API limit breach; affected
    customers were sent an apology email asking them to retry, and over half subsequently
    completed registration. An error in the way API calls were being made was also
    resolved to improve system efficiency.
  transferability: moderate
  delay_magnitude: <1 month
  technology_domain: DER
  source_pages:
  - 9
  - 14
  evidence_excerpt: On one Sunday during the second phase, the API call limits for
    Enphase system maxed out, resulting in customers receiving an error message after
    attempting to register their system. Due to the monitoring we had put in place,
    we quickly identified the issue. Consumers affected were sent an email follow-up
    apologising and asking them to retry, with over half of them subsequently completing
    the registration process for a second time.
