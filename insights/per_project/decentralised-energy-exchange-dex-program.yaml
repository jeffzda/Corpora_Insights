  project_name: deX Program
  what_happened: Early technology partnership opportunities for deX were constrained
    by difficulty aligning combined technology development timelines with customer
    readiness and market access, exemplified by VPP FCAS response being technically
    feasible but commercially unviable at scale due to insufficient aggregated DER
    volume and market access.
  lesson_learnt: Multi-sided DER platform programs should sequence commercial use
    cases to match the maturity of the ecosystem — technically feasible applications
    like VPP FCAS will not generate commercial value until sufficient DER volume,
    aggregator participation, and durable market access co-exist, so near-term focus
    should be on foundational compliance functions that build the registry base.
