  source_title: deX Project Progress January 2021
  publish_date: 2021-01
  project_name: deX Markets – UK Power Networks ANM project
  what_happened: When developing unavailability submission handling for the UKPN ANM
    platform, the team chose synchronous API processing rather than asynchronous queuing,
    deliberately avoiding premature optimisation given the relatively small expected
    data volume.
  lesson_learnt: For low-volume data submission workflows in DER market platforms,
    prefer simple synchronous API designs over complex asynchronous architectures;
    premature optimisation adds unnecessary complexity without material performance
    benefit at modest data volumes.
