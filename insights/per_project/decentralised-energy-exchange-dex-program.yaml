  source_title: deX Project Progress January 2021
  publish_date: 2021-01
  project_name: deX – DER Integration and Automation project (Evoenergy/GreenSync)
  what_happened: The project identified that the inability for network management
    systems to receive and associate schedules with a unique identifier introduces
    race conditions, potentially resulting in non-deterministic dispatch outcomes
    where instructions received by the network could be out of date.
  lesson_learnt: Network systems integrated with DER orchestration platforms must
    be capable of receiving and transmitting unique identifiers with schedules; without
    this, dispatches may be based on stale instructions, leading to under- or over-delivery
    of network services.
