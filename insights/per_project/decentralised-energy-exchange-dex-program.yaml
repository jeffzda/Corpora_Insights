- record_id: ARENA-DLV-55008
  source_title: deX Project Progress Report July 2020
  publish_date: 2020-07
  project_name: deX South Australia Project
  what_happened: Industry engagement for the deX South Australia co-design phase found
    that customers face significant inconsistency and friction when purchasing and
    installing DER — they must interact with multiple separate parties (product seller,
    technology vendor, retailer, metering provider, installer, and potentially the
    network) with no unified registration or coordination mechanism.
  lesson_learnt: DER platform design should treat the fragmented multi-party customer
    onboarding journey as a primary design problem — customers interacting with five
    or more separate organisations during DER purchase and installation represents
    a clear market gap that a unified digital registration and services exchange can
    address, and this should be treated as a central value proposition in platform
    scoping.
