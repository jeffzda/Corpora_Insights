  source_title: deX Project Progress January 2021
  publish_date: 2021-01
  project_name: deX Markets – UK Power Networks ANM project
  what_happened: Experience with the UKPN ANM project revealed that Australia's network
    regulatory framework is less conducive to DSO contracting for flexible DER services
    than the UK framework, making flexible contracting slower and harder to deliver
    in the Australian market.
  lesson_learnt: When planning DER flexibility market platforms for Australia, account
    for the regulatory gap relative to more directive frameworks like the UK's; expect
    slower commercial uptake and factor in the time required for market reform before
    full deployment of DSO contracting capability is viable.
