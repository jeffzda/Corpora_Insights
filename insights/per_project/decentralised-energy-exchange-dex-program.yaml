- record_id: ARENA-DLV-9407
  source_title: deX Industry & Vendor Training January 2021
  publish_date: 2021-01
  project_name: deX Project (ARENA)
  what_happened: Installers were confused about which vendor devices were accepted
    by the deX Device Registration App versus those that required a vendor-specific
    app, leading to misuse of the registration pathway.
  lesson_learnt: Where a registration platform supports only a subset of device brands
    and others require a separate vendor-specific pathway, clearly delineate accepted
    and non-accepted vendors in both training content and within the app itself —
    ambiguity at this point causes registration errors and installer frustration.
  issue_severity: minor
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: null
  failure_mode: unvalidated integration
  outcome_class: re-scoped/adapted
  secondary_failure_mode: data & measurement
  intervention_note: Implemented specific sections in training sessions and user guide
    listing accepted vendors versus those requiring a vendor-specific app, and added
    an in-app note to guide users at the point of use.
  transferability: moderate
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id004
  - 11
  evidence_excerpt: Confusion between registration platform for different Vendors
    — Implemented specific sections in both the training sessions and user guide with
    instructions on which vendors are accepted by the Registration App, and which
    must go through a vendor specific App, along with a note in the App itself to
    guide the User.
  confidence_note: null
