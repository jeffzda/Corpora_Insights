  proponent_type: technology vendor
  delay_category: null
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Development focused on functionality to streamline the registration
    process, reduce administrative burden, and minimise manual data input; the App
    was designed with structured input fields and image upload for verification.
  transferability: broad
  delay_magnitude: null
  technology_domain: DER
  source_pages:
  - 10
  - 16
  evidence_excerpt: During the development of the Device Registration App and Portal,
    it became apparent that data quality and manual processing were ongoing issues
    for both installers and retailers. As a result, development of these features
