- record_id: ARENA-DLV-55006
  source_title: deX Project Progress Report July 2020
  publish_date: 2020-07
  project_name: deX Platform – Developer Centre Authentication
  what_happened: The deX Developer Centre originally required each internal system
    to implement its own authentication and authorisation logic independently, causing
    user-facing inconsistency and system-level issues. Off-the-shelf solutions were
    trialled but found unfit for purpose.
  lesson_learnt: When multiple internal systems require authentication and authorisation,
    avoid per-system implementations — the resulting inconsistency creates both user
    experience problems and system integrity risks. If off-the-shelf identity solutions
    do not fit, build a lightweight in-house system that does a small subset of functions
    well and leverages existing testing and delivery infrastructure.
