  source_title: deX Industry & Vendor Training January 2021
  publish_date: 2021-01
  project_name: deX Project (ARENA)
  what_happened: During installer training sessions, participants asked questions
    about NMI and NMI checksum fields that were not adequately covered in the initial
    training content, causing confusion and extending sessions beyond schedule.
  lesson_learnt: When training field installers on digital registration platforms,
    allocate dedicated time to explain technical identifier fields (such as NMI and
    NMI checksum) with worked examples, and tailor content to jurisdiction-specific
    formats — in South Australia the checksum is commonly appended to the NMI, requiring
    explicit explanation.
