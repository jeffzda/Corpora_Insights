- record_id: ARENA-DLV-24151
  source_title: deX Consumer Insights
  publish_date: 2019-12
  project_name: deX Consumer Insights (Enphase Pilot)
  what_happened: A technology vendor-led DER registration pilot with Enphase achieved
    a 20% opt-in rate across four states (South Australia, Victoria, Tasmania, Western
    Australia) without offering any immediate financial incentive to participants.
  lesson_learnt: DER owners are willing to register their assets on a platform and
    support grid reliability without immediate financial reward — consumer motivation
    includes grid support, community benefit, and transparency about data use. Campaigns
    should not assume financial incentives are necessary to achieve meaningful participation
    rates.
