  project_name: deX Consumer Insights (Enphase Pilot)
  what_happened: Leading all consumer-facing communications with the Enphase brand
    rather than the deX brand reduced customer confusion and increased registration
    rates, but increased the complexity of managing data securely across two companies'
    systems, including personally identifiable information (PII) and analytics tracking.
  lesson_learnt: When running a co-branded DER registration campaign, leading with
    the established partner brand improves consumer conversion, but project teams
    must plan explicitly for secure PII transfer and cross-system analytics management
    — these are not trivial overhead and become more complex at scale.
