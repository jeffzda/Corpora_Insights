- record_id: ARENA-DLV-55002
  source_title: deX Project Progress Report July 2020
  publish_date: 2020-07
  project_name: deX Platform – deX Vision / Evoenergy DER Integration and Automation
    Project
  what_happened: Two competing dispatch evaluation engine architectures were assessed
    for the deX Vision application — a forward option contract dispatch evaluation
    and a day-ahead bid evaluation — before a selection was made. The day-ahead bid
    approach was found to require high DER market liquidity estimated to be 5+ years
    away, incompatibility with RIT-D processes, and significantly increased operational
    complexity for aggregators.
  lesson_learnt: 'When selecting a market platform architecture for DER orchestration,
    prefer forward option contract mechanisms over day-ahead bid models in early-market
    contexts: forward contracts do not require high DER volumes, align with RIT-D
    regulatory timing, reduce network risk through non-compliance clauses, and lower
    operational complexity for aggregators who otherwise must bid in real-time operational
    windows.'
  issue_severity: minor
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: A structured options assessment was conducted comparing the two
    approaches across six criteria (market liquidity, network risk, RIT-D alignment,
    procurement cost, service provider outcomes, and complexity); the forward option
    contract engine was selected and built accordingly.
  transferability: moderate
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id061
  - 5
  - 6
  - 7
  evidence_excerpt: 'Ultimately the forward option contract dispatch evaluation engine
    option was selected. The reasons for this are: 1. It meets the requirements for
    the Evoenergy project. 2. It will deliver more value for Evoenergy in the next
    5 years, while the penetration of aggregated DER is still in its growth phase.'
  confidence_note: issue_severity set to minor — the design choice was resolved through
    analysis before development was locked in; no schedule or cost impact stated.
