- record_id: ARENA-DLV-30514
  source_title: deX Project Progress January 2021
  publish_date: 2021-01
  project_name: deX Connect – Device Registration App and Portal (deX South Australia)
  what_happened: During development of the Device Registration App and Portal, it
    became apparent that data quality issues and manual processing were ongoing problems
    for both installers and retailers in the DER registration process, creating administrative
    burden and human error risk.
  lesson_learnt: DER registration platforms should prioritise structured input fields,
    reduced manual data entry, and automated validation to address chronic data quality
    and administrative burden issues experienced by installers and retailers; co-designing
    with industry partners during prototyping helps surface these requirements early.
