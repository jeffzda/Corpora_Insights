  project_name: ENE-Farm
  what_happened: Japan's ENE-Farm project installed over 230,000 residential fuel cells through a public-private partnership between the Japanese government and fuel cell manufacturers, demonstrating that
    distributed residential hydrogen fuel cells could be deployed at scale through this partnership model.
  lesson_learnt: Public-private partnerships between government and technology manufacturers are an effective mechanism for stimulating mass deployment of distributed energy technologies such as residential
    fuel cells — government co-investment de-risks early adoption and builds the manufacturer supply chain simultaneously.
