  evidence_excerpt: Attempts at commercial demonstration of geothermal energy production
    from these two resource types have preceded the demonstration of the required
    technologies even at pilot scale. This has led to commercial propositions by proponents
    and a treatment of geothermal energy in Australia that may not be appropriate
    for the level of technology readiness, or the resource risk associated with these
    resources.
