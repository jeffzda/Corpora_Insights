- record_id: ARENA-DLV-14961
  source_title: 'Looking Forward: Barriers, Risks and Rewards of the Australian Geothermal
    Sector to 2020 and 2030'
  publish_date: 2014-06
  project_name: Australian Geothermal Sector – Commercial Demonstration Before Technology
    Readiness
  what_happened: Multiple geothermal commercial demonstration projects in Australia
    proceeded before the underlying enabling technologies — particularly resource
    characterisation methods and reservoir stimulation techniques — had been proven
    at pilot scale, resulting in commercial propositions that were not appropriate
    for the technology readiness level.
  lesson_learnt: Funding programs should explicitly match grant type and scale to
    Technology Readiness Level; committing commercial-scale demonstration funding
    to technologies at TRL 2–5 accelerates cost exposure without proportionate reduction
    in technical risk, and typically leads to commercial failure even when individual
    technical milestones are met.
