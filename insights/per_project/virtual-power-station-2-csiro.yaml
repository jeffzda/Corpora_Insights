- record_id: ARENA-DLV-64432
  source_title: Distributed Energy Resources (DER) Integration Project Contribution Assessment
  publish_date: 2019-03
  project_name: Virtual Power Station 2 (CSIRO)
  what_happened: CSIRO's Virtual Power Station 2 project demonstrated the capability to remotely control household loads and align local solar PV supply with household demand, simultaneously optimising
    network benefits and customer utility from DER. This was one of only a small number of completed projects with demonstrated outcomes toward multiple DER strategic outcomes.
  lesson_learnt: Co-ordinated load control that aligns solar PV output with household demand can simultaneously deliver network and customer benefits — this dual-optimisation capability should be a design
    requirement for future DER orchestration projects rather than an incidental finding, and should be measured and reported as a headline outcome metric.
