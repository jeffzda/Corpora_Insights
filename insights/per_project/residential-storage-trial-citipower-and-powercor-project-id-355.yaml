- record_id: ARENA-DLV-72285
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects - First Edition Results'
  publish_date: '2015'
  project_name: Residential Storage Trial – CitiPower and Powercor (Project ID 355)
  what_happened: CitiPower and Powercor initiated a residential battery storage trial (AUD 0.5M) installing 20 residential batteries with solar PV to understand network and customer benefits. The project
    was at an early stage with no results yet reported at time of database compilation.
  lesson_learnt: Network businesses trialling residential storage should design trials to capture both customer-side and network-side benefit data at sufficient resolution — early-stage trials that identify
    optimal use cases (peak shifting, PV self-consumption, export management) will inform connection policy and avoid costly network augmentation as residential storage scales.
