- record_id: ARENA-DLV-1325
  source_title: ARENA Insights Forum Presentation Summaries & Key Points – Large-Scale
    Projects Stream
  publish_date: '2019-06-25'
  project_name: AEMO Intra-Day Forecasting
  what_happened: AEMO identified a forecasting accuracy gap in the 4–6 hour ahead
    period for both wind and solar generation, noting that forecast accuracy at 4
    hours ahead was no better than at 2 days ahead for wind farms. This gap was attributed
    to insufficient granular meteorological sensor coverage across the NEM.
  lesson_learnt: Renewable energy project developers and operators should consider
    contributing site-specific meteorological data to AEMO — the current forecasting
    gap in the 4–6 hour period is a system-level risk that better local weather observations
    from plant sites could help close, with potential benefits for dispatch efficiency
    and Causer Pays outcomes.
