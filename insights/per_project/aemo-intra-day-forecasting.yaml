  evidence_excerpt: For wind farms, AEMO notes a similar level of accuracy in its
    4 hours ahead forecast to its 2 days ahead forecast. Many meteorological sensors
    are not very close together (locationally) which makes it difficult for AEMO to
    create accurate forecasts – in particular for the 4-6 hour forecasting period.
