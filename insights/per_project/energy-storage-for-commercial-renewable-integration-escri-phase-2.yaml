- record_id: ARENA-DLV-41859
  source_title: 'ESCRI-SA Battery Energy Storage Project Operational Report #1'
  publish_date: 2019-07
  project_name: ESCRI-SA Battery Energy Storage Project
  what_happened: The BESS, configured as a 'power battery' held in continuous readiness
    for grid events, consumed 1,370 MWh over the first six months while only exporting
    160 MWh. Average auxiliary load and losses were 2.19% of rated capacity, meaning
    parasitic energy costs significantly exceeded market revenue from energy discharge
    ($120,000 charging cost vs $116,000 discharge revenue).
  lesson_learnt: For BESS designed as power batteries held in standby for network
    services, auxiliary load losses (inverters, transformers, air conditioning, BMS)
    can dominate energy throughput and erode arbitrage economics — commercial arrangements
    and business cases must explicitly model and allocate these losses before project
    financial close.
