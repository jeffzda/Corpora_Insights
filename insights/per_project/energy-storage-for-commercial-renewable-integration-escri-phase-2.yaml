  evidence_excerpt: The energy consumed by the BESS is significantly higher than the
    energy exported to the grid. The high energy use is because the BESS is designed
    as a power battery, rather than an energy battery, and therefore needs to be available
    all the time to be able to respond to system events. This means higher auxiliary
    load losses from transformers, inverters and the battery management system...
    A key learning from this project is that it is important to consider how the battery
    is intended to be used and consider the various aspects that comprise the auxiliary
    loads and losses. This information is a key input to inform how the commercial
    arrangements then need to be setup.
