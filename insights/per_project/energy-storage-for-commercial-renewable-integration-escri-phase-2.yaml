- record_id: ARENA-DLV-13104
  source_title: ESCRI-SA Battery Energy Storage Project Operational Report 2
  publish_date: 2020-02
  project_name: ESCRI-SA Battery Energy Storage Project
  what_happened: Excess heat generated by battery modules during maximum charge and
    discharge, combined with high ambient temperatures, caused ongoing temperature
    exceedances above the 26°C operational target in battery rooms. The original 10
    × 150 kW air-conditioning units were insufficient; two additional units were installed
    in February 2019 and a further two in August 2019, with ductwork modifications
    also required.
  lesson_learnt: Thermal management design for large-scale BESS in hot climates should
    include margin above nominal cooling capacity; the original specification of 10
    × 150 kW units proved inadequate and required four additional units plus ductwork
    changes — cooling requirements should be validated against worst-case ambient
    and maximum discharge scenarios before EPC practical completion.
