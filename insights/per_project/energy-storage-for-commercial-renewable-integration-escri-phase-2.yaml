  project_name: ESCRI-SA Battery Energy Storage Project
  what_happened: During the first six months of operation, analogue values in the
    BESS system occasionally exceeded 100% due to floating-point conversion errors,
    causing the RTU to flag BESS availability data as 'over-range' (suspect data)
    in the DNP3 protocol. The issue was resolved by ABB updating the PLC software
    to cap values at 100%.
  lesson_learnt: BESS control system software should be validated for floating-point
    boundary conditions before commercial operation; uncapped floating-point conversions
    can corrupt telemetry data flagged to the system operator, affecting availability
    monitoring and potentially NER compliance reporting.
