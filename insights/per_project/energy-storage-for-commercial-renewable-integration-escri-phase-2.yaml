  project_name: ESCRI-SA Battery Energy Storage Project
  what_happened: Excess heat generated during maximum charge and discharge cycles,
    combined with high ambient temperatures, remained an unresolved defect from commercial
    handover in December 2018. The BESS was unable to maintain full 30 MW discharge
    without temperature de-rating, though maximum output was within 1 MW of design
    at the time of writing.
  lesson_learnt: Thermal management system design for large-scale BESS in hot climates
    should be validated under simultaneous maximum charge/discharge and worst-case
    ambient conditions before handover — retrofitting ducting and additional air conditioning
    to inverters is costly and leaves performance defects open for years.
