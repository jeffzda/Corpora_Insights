  what_happened: The AEMC Primary Frequency Response (PFR) rule change required all
    NEM generators to provide automatic frequency response, but implementing PFR on
    the Dalrymple BESS required significant changes to finely tuned internal control
    loops, creating an unanticipated regulatory compliance burden.
  lesson_learnt: Regulatory changes to frequency response obligations (such as the
    PFR rule) can impose significant post-commissioning control system rework on existing
    BESS assets — operators and owners should actively monitor rule change processes
    and assess control system flexibility early, as retrofitting PFR to a tightly
    configured multi-service BESS is substantially more complex than designing it
    in from the outset.
