  what_happened: The BESS Remote Terminal Unit intermittently flagged availability
    data as 'suspect' because analogue values occasionally slightly exceeded 100%,
    likely due to floating point conversion artefacts, causing the DNP3 protocol to
    register them as over-range.
  lesson_learnt: BESS SCADA and RTU configurations should include value-capping logic
    at source to prevent floating-point conversion artefacts from triggering data
    quality flags in the EMS — data quality issues of this type, if unresolved, can
    undermine confidence in availability reporting and market compliance monitoring.
