  source_title: ESCRI-SA Battery Energy Storage Final Knowledge Sharing Report
  publish_date: 2021-03
  project_name: ESCRI-SA Battery Energy Storage Project
  what_happened: Network analysis and fault current assessments were needed to address
    the BESS's inability to provide enough fault current to support protection mechanisms
    during an islanding event if two or more of its six transformers were lost, and
    to distinguish high load current from fault current. On weak electricity networks,
    power swings could simulate islanding, requiring a topology-based methodology
    to identify genuine islanding.
  lesson_learnt: Network analysis and investigation of fault current requirements
    — including islanding scenarios — should be undertaken early in project development.
    On weak networks, standard islanding detection methods may not be reliable; a
    topology-based approach should be evaluated as an alternative.
