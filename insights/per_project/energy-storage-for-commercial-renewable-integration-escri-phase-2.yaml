- record_id: ARENA-DLV-41862
  source_title: 'ESCRI-SA Battery Energy Storage Project Operational Report #1'
  publish_date: 2019-07
  project_name: ESCRI-SA Battery Energy Storage Project
  what_happened: During a 7.5-hour planned outage on 7 April 2019, the BESS successfully
    supplied the lower Yorke Peninsula 33 kV network for approximately seven hours.
    However, a switching operation during load restoration caused the vector shift
    relay to trip the BESS, resulting in approximately 30 minutes of unplanned load
    loss. The BESS had sufficient state of charge to have supplied load for the full
    outage duration.
  lesson_learnt: Island detection relay settings must be validated for all planned
    switching operations that will occur during and at the end of a BESS-supported
    planned outage — a false trip during load restoration can undermine an otherwise
    successful islanding event and cause unnecessary customer impact.
