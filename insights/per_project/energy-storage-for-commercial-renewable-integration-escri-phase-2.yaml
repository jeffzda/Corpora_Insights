  what_happened: FCAS revenue for the second six-month period was approximately $3.73
    million — a 180% increase on the first six months — while energy arbitrage revenue
    remained very low at $97,000 discharge revenue against $101,000 charging cost.
    Total Year 1 FCAS revenue was approximately $5.06 million, significantly exceeding
    the business case forecast.
