  source_title: ESCRI-SA Battery Energy Storage Project Operational Report 4
  publish_date: 2021-02
  project_name: ESCRI-SA Battery Energy Storage Project
  what_happened: 'The BESS was designed as a power battery (high MW, low MWh ratio:
    30 MW / 8 MWh), resulting in energy consumed being consistently and significantly
    higher than energy exported across all four operational periods. Auxiliary load
    and losses averaged 2.19–2.35% of rated capacity continuously.'
  lesson_learnt: Power batteries designed for network services have materially different
    energy consumption profiles from energy batteries; operational reporting and performance
    benchmarking frameworks should distinguish between power and energy battery archetypes
    to avoid misinterpreting high auxiliary losses as inefficiency.
