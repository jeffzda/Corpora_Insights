  project_name: ESCRI-SA Battery Energy Storage Project
  what_happened: During the SA system separation event on 16 November 2019, when the
    500 kV Heywood double circuit tripped and SA islanded from the NEM while exporting
    ~300 MW, the Dalrymple BESS responded to the resulting frequency rise by reducing
    discharge from 6 MW to 0 MW almost instantly, demonstrating correct FFR and FCAS
    response consistent with NER technical requirements.
  lesson_learnt: A grid-scale BESS providing FFR can respond within milliseconds to
    a major system separation event and deliver the correct frequency response, confirming
    that FFR from battery storage is a viable substitute for synchronous inertia in
    constraining interconnector RoCoF limits.
