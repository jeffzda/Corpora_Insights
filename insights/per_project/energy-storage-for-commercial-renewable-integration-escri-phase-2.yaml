  publish_date: 2019-07
  project_name: ESCRI-SA Battery Energy Storage Project
  what_happened: The BESS successfully transitioned to islanded operation and supplied
    the Dalrymple 33 kV local load for 30 minutes during an unplanned outage on 29
    March 2019 caused by IDS maloperation at Ardrossan West, preventing a customer
    outage. This was the first real-world confirmation that the BESS operated correctly
    under unplanned islanding conditions.
  lesson_learnt: A grid-scale BESS with a topology-based island detection scheme can
    successfully prevent customer outages during unplanned 132 kV supply interruptions
    — real-world operational events provide the strongest evidence that the islanding
    design is fit for purpose and should be documented in detail for replication in
    future network BESS deployments.
