  what_happened: Energy arbitrage consistently provided less value than estimated
    in the business case. In the first six months, contractual limitations caused
    by delayed WPWF islanding integration testing reduced arbitrage value; in the
    second six months, even after the constraint was lifted, AGL continued to favour
    FCAS availability over arbitrage, keeping energy discharge revenue at only $97,000.
  lesson_learnt: When a power battery is optimised for contingency FCAS, energy arbitrage
    value will be structurally subordinated; business case modelling should reflect
    this trade-off explicitly rather than treating arbitrage and FCAS as independently
    stackable revenue streams.
