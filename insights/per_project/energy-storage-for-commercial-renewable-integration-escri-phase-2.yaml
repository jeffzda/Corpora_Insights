  source_title: ESCRI-SA Battery Energy Storage Project Operational Report 3
  publish_date: 2020-08
  project_name: ESCRI-SA Battery Energy Storage Project
  what_happened: The BESS operates as a power battery rather than an energy battery,
    resulting in energy consumed being substantially higher than energy exported (1,499
    MWh consumed vs 198 MWh exported in the third reporting period) due to high auxiliary
    losses from transformers, inverters and the battery management system.
  lesson_learnt: Power batteries designed for fast-response network services carry
    significantly higher auxiliary load losses than energy batteries — project energy
    accounting and financial models must separately model auxiliary consumption (approximately
    2.35% of rated capacity continuously) to avoid overstating net revenue from energy
    arbitrage.
