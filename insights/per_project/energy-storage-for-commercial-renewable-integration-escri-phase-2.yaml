  what_happened: On 29 April 2020, a second islanding event at Dalrymple occurred
    due to loss of fibre optic communication between Dalrymple and the Wattle Point
    Wind Farm; the BESS successfully supplied all local load for 2 hours and 22 minutes
    with no load lost.
  lesson_learnt: Grid-scale BESS with islanding capability can fully substitute for
    grid supply during extended communication-related outages lasting several hours
    — this demonstrates the value of robust islanding design and sufficient energy
    capacity for the expected load duration, and confirms that communication infrastructure
    reliability should be treated as a critical dependency in islanding design.
