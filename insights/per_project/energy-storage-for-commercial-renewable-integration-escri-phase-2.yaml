  what_happened: In February and April 2020, inverters tripped due to a charge imbalance
    issue, requiring ABB to dial in remotely and reboot them individually; in May
    2020 a software watchdog timer fault also required a restart, and a step-up transformer
    subsequently tripped due to a malfunction in an insulation protection relay during
    reset.
  lesson_learnt: Grid-scale BESS assets using power electronics with complex control
    systems are susceptible to cascading faults during maintenance and restart sequences
    — operators should ensure OEM remote access protocols are pre-established, that
    restart procedures account for secondary protection interactions, and that spare
    components for known failure-prone items are held on-site.
