  what_happened: Unplanned islanding tests with the Wattle Point Wind Farm (WPWF)
    output set above 5 MW were unsuccessful because WPWF turbines tripped on their
    over-frequency protection when the islanded network frequency rose above 51 Hz.
    This represented a Generator Performance Standards non-compliance at the wind
    farm and prevented completion of full ITR 39 commissioning tests at the time commercial
    operation commenced.
  lesson_learnt: Before designing an islanding solution that relies on co-located
    wind generation, verify that the wind farm's over-frequency protection settings
    are consistent with the islanded frequency envelope the BESS will create — GPS
    non-compliance at the wind farm can block completion of commissioning and limit
    islanding capability.
