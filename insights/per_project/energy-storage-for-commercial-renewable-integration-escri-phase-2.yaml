- record_id: ARENA-DLV-41863
  source_title: 'ESCRI-SA Battery Energy Storage Project Operational Report #1'
  publish_date: 2019-07
  project_name: ESCRI-SA Battery Energy Storage Project
  what_happened: The BESS demonstrated Fast Frequency Response equivalent to 200 MWs
    of synchronous inertia, which was incorporated into the Heywood Interconnector
    RoCoF constraint equation, reducing the synchronous inertia requirement in SA
    from 5,417 MWs to 5,217 MWs. During the first six months of operation, the RoCoF
    constraint bound for only 20 minutes, compared to an estimated 4.5 hours without
    the BESS.
  lesson_learnt: A grid-scale BESS providing FFR can be formally recognised as an
    inertia equivalent in NEM constraint equations, directly increasing interconnector
    transfer capability — quantifying and formalising this contribution early in the
    project provides immediate and measurable network benefit and should be pursued
    as a priority for similar deployments.
