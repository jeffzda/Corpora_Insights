  what_happened: The complexity of developing an integrated grid and island BESS solution
    was underestimated in time, effort, and cost, resulting in setting very ambitious
    expectations for the project. Issues included multiple model revisions to meet
    NER requirements, deeper network changes on the planned island distribution network,
    and problematic integration with the Wattle Point Wind Farm due to its age and
    lack of available models.
  lesson_learnt: Do not underestimate the time, effort, and cost of integrating a
    multi-function BESS with existing grid and island infrastructure — especially
    when integrating with aged wind farms lacking validated models. Build in contingency
    for multiple modelling iterations when seeking NER compliance for novel configurations.
