  what_happened: Temperature de-rating due to insufficient cooling reduced the BESS
    maximum discharge capacity from the rated 30 MW to approximately 28 MW by the
    end of a 15-minute discharge under onerous conditions (high ambient temperatures
    or high prior usage).
  lesson_learnt: Cooling system adequacy directly affects rated power delivery — BESS
    projects should verify that the cooling specification sustains full rated output
    continuously under worst-case ambient and usage conditions, not just under average
    operating conditions.
