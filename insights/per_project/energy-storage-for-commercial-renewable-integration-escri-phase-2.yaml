  what_happened: The BESS spare parts inventory under the facility maintenance contract
    did not initially include SCADA system spares or spare battery modules. ElectraNet
    separately purchased SCADA spare parts from ABB through CPP, while battery module
    spare parts arrangements were still being finalised with Samsung at the time of
    reporting.
  lesson_learnt: BESS facility maintenance contracts should explicitly require complete
    spare parts coverage including SCADA system components and battery modules from
    contract commencement; gaps in spares coverage discovered during operations require
    separate procurement actions and leave critical single-point-of-failure components
    unprotected.
