  source_title: 'ESCRI-SA Battery Energy Storage Project Operational Report #1'
  publish_date: 2019-07
  project_name: ESCRI-SA Battery Energy Storage Project
  what_happened: The vendor-supplied vector shift relay intended as a redundant island
    detection system produced both false positive operations (indicating island creation
    when not required) and false negatives (failing to detect islanding when it should).
    During a planned outage on 7 April 2019, the relay tripped the BESS unnecessarily
    after approximately seven hours of successful island operation, causing 30 minutes
    of load loss.
  lesson_learnt: Vector shift relays are not reliable for island detection in BESS
    applications with co-located wind generation — a topology-based Island Detection
    Scheme operated by the network service provider provides more reliable detection
    and should be the primary (or sole) detection mechanism, with the BESS taken out
    of service whenever the IDS is unavailable.
