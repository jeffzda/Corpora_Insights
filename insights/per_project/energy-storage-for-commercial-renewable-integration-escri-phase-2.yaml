  what_happened: The ESCRI-SA BESS successfully rode through five separate transmission
    network fault events between June and December 2019 (including the SA system separation
    on 16 November 2019), injecting active and reactive power to support network voltage
    recovery almost instantly in each case, with all responses confirmed as within
    design and technical performance expectations.
