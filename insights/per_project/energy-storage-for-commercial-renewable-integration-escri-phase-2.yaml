  source_title: ESCRI-SA Battery Energy Storage Project Operational Report 2
  publish_date: 2020-02
  project_name: ESCRI-SA Battery Energy Storage Project
  what_happened: The ESCRI-SA BESS demonstrated that a 30 MW / 8 MWh battery providing
    200 MWs of equivalent inertia contribution via FFR can be incorporated into the
    RoCoF constraint equation for the Heywood Interconnector, reducing the synchronous
    inertia requirement in SA from 5,417 MWs to 5,217 MWs and providing approximately
    1 hour 25 minutes of additional interconnector headroom during the second six-month
    period.
  lesson_learnt: Battery FFR can be formally quantified and embedded in interconnector
    constraint equations as an equivalent inertia offset, demonstrating a replicable
    regulatory pathway by which BESS can substitute for synchronous inertia and increase
    interconnector transfer capability in low-inertia systems.
