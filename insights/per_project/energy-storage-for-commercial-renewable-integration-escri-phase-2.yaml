- record_id: ARENA-DLV-21668
  source_title: ESCRI-SA Battery Energy Storage Final Knowledge Sharing Report
  publish_date: 2021-03
  project_name: ESCRI-SA Battery Energy Storage Project
  what_happened: The BESS successfully demonstrated Fast Frequency Response (FFR)
    capability, with power system analysis confirming it contributed the equivalent
    of 200 MWs of inertia, reducing the SA inertia requirement for a 3 Hz/s RoCoF
    from 5,417 MWs to 5,217 MWs and increasing Heywood Interconnector transfer capability.
    Over two years the RoCoF constraint bound for only 8.5 hours with the BESS in
    service versus an estimated 30.5 hours without.
  lesson_learnt: A relatively small BESS (30 MW/8 MWh) can provide a measurable and
    regulatorily accepted inertia equivalent contribution that relaxes interconnector
    transfer constraints — FFR capability should be included in interconnector constraint
    modelling and BESS business cases where system inertia is a binding constraint.
