  what_happened: Energy arbitrage revenue declined steadily across all four six-month
    operational periods, reaching only $4,820 in the final period compared to $116,000
    in the first. The BESS operator prioritised availability for contingency FCAS
    services over energy arbitrage, and the rebidding software lacked an optimisation
    module.
