  publish_date: 2020-02
  project_name: ESCRI-SA Battery Energy Storage Project
  what_happened: The BESS achieved 97.35% average availability during the second six-month
    operational period (June–December 2019), exceeding the 96% Guaranteed Annual Availability
    required under the Battery Operating Agreement. The slight reduction from 98.01%
    in the first period was due to a planned outage of a few days to resolve teething
    issues.
  lesson_learnt: A power battery designed for network services can sustain availability
    above contractual minimums during early commercial operation, but a short planned
    outage to resolve first-period teething issues should be budgeted into year-one
    availability expectations.
