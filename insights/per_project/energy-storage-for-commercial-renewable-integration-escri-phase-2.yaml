  project_name: ESCRI-SA Battery Energy Storage Project
  what_happened: Early in the knowledge sharing period it was observed that batteries
    remained difficult to justify as a standalone investment. Key challenges for future
    battery projects were expected to include reduced FCAS value as more batteries
    entered the market. Factors expected to improve battery value over time included
    increasing network constraints, potential price volatility increases from reduced
    dispatchable supply, and introduction of five-minute settlement.
  lesson_learnt: Future battery storage business cases should not rely solely on current
    FCAS revenue levels — market saturation as more batteries enter the NEM will compress
    FCAS margins. Business cases should model a portfolio of value streams (network
    services, arbitrage, SIPS, cap products) to withstand FCAS revenue decline.
