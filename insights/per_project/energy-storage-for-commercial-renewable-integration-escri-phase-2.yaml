  source_title: ESCRI-SA Battery Energy Storage Project Operational Report 2
  publish_date: 2020-02
  project_name: ESCRI-SA Battery Energy Storage Project
  what_happened: The energy consumed by the BESS (2,006 MWh in the second six months)
    was substantially higher than energy exported to the grid (768 MWh), reflecting
    the high auxiliary load losses from transformers, inverters and the battery management
    system inherent in operating as a power battery that must remain continuously
    available.
  lesson_learnt: Power battery projects designed for continuous network availability
    should explicitly model and communicate the high ratio of energy consumed to energy
    exported; the auxiliary load profile of a standby power battery is fundamentally
    different from an energy arbitrage battery and will affect both cost modelling
    and grid connection assessments.
