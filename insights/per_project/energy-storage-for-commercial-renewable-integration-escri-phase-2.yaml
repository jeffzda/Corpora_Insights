- record_id: ARENA-DLV-13108
  source_title: ESCRI-SA Battery Energy Storage Project Operational Report 2
  publish_date: 2020-02
  project_name: ESCRI-SA Battery Energy Storage Project
  what_happened: Battery spare module lead times were confirmed to be at least 7–8
    weeks because modules are sourced from South Korea via sea freight and cannot
    be air-freighted for safety reasons. At the time of reporting, CPP and ElectraNet
    were still working through arrangements with Samsung and the Australian distributor
    to establish a viable spare parts strategy, including possible hot-spare rotation
    on-site.
  lesson_learnt: Long international supply chains for battery modules (7–8 weeks minimum
    from South Korea by sea) create significant operational risk; BESS projects should
    establish domestic or in-country spare module holdings before commercial operation
    commences, and incorporate the lead time constraint into maintenance and availability
    risk modelling.
