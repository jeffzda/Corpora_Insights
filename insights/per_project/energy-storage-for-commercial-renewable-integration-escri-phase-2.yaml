  project_name: ESCRI-SA Battery Energy Storage Project
  what_happened: The BESS successfully rode through seven transmission network fault
    events during the fourth six-month period, injecting active and reactive power
    to support network voltage recovery almost instantaneously in each case. High-speed
    PSPM data confirmed responses were within design and technical performance expectations
    across all events.
  lesson_learnt: Grid-scale BESS with properly configured voltage support functions
    can reliably ride through transmission network faults and provide near-instantaneous
    active and reactive power injection; capturing and publishing high-speed performance
    data for each event is essential for validating design compliance and building
    the evidence base for future projects.
