- record_id: ARENA-DLV-57863
  source_title: ESCRI-SA Battery Energy Storage Project Operational Report 4
  publish_date: 2021-02
  project_name: ESCRI-SA Battery Energy Storage Project
  what_happened: The ESCRI-SA BESS Fast Frequency Response (FFR) capability was demonstrated
    to provide an equivalent inertia contribution of 200 MWs, reducing the synchronous
    inertia required in South Australia for a 3 Hz/s RoCoF constraint on the Heywood
    Interconnector from 5,417 MWs to 5,217 MWs. During the fourth reporting period
    the RoCoF constraint bound for 4 hours with the BESS in service versus an estimated
    6 hours 5 minutes without it.
  lesson_learnt: Grid-scale BESS providing Fast Frequency Response can deliver quantifiable,
    regulatory-recognised inertia equivalent contributions that relax interconnector
    transfer constraints; this network value stream should be modelled in BESS business
    cases and incorporated into network constraint equations where evidence supports
    it.
