  what_happened: The BESS experienced persistent over-temperature issues under maximum
    charge/discharge and high ambient conditions. The original ten 150 kW air conditioning
    units were insufficient; two additional units installed in February 2019 still
    did not fully resolve the problem, and a further two units were ordered for August
    2019 installation along with duct work improvements.
