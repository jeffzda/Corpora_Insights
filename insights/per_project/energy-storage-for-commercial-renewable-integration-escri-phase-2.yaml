- record_id: ARENA-DLV-13106
  source_title: ESCRI-SA Battery Energy Storage Project Operational Report 2
  publish_date: 2020-02
  project_name: ESCRI-SA Battery Energy Storage Project
  what_happened: The vector shift relay specified as a redundant local island detection
    system produced both false positives (indicating islanding when not required)
    and false negatives (failing to detect islanding when it occurred). The relay
    was disabled and the system now relies solely on the topology-based Island Detection
    Scheme (IDS); when the IDS is out of service, the BESS must also be taken out
    of service.
  lesson_learnt: Vector shift relays are unreliable for island detection in grid-connected
    BESS applications — specify and test alternative island detection technologies
    before commercial handover; redundancy designs that depend on unreliable sensing
    technology reduce, rather than improve, overall system availability.
  issue_severity: moderate
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated integration
  intervention_note: The vector shift relay was disabled; the topology-based IDS was
    retained as the sole island detection mechanism, with an operational rule that
    the BESS must be taken out of service whenever the IDS is out of service.
  transferability: moderate
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id006
  - 37
  evidence_excerpt: The vector shift relay system used for this has not proved to
    be successful as there are both conditions where there is false operation (indicating
    the creation of an island when it is not required) and areas where islanding is
