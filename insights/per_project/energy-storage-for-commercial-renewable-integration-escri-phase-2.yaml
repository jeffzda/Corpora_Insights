  source_title: 'ESCRI-SA Battery Energy Storage Project Operational Report #1'
  publish_date: 2019-07
  project_name: ESCRI-SA Battery Energy Storage Project
  what_happened: Under certain operating conditions, when the BESS was performing
    a 30 MW fast charge and was simultaneously called upon to provide Fast Frequency
    Response, the system risked being driven into overload and tripping to protect
    itself. A self-imposed charge limit of less than 7.5 MW was applied by AGL until
    the issue was resolved.
  lesson_learnt: BESS designs must be tested and parameterised for the simultaneous
    occurrence of maximum charge and grid frequency response events — inverter and
    protection settings should be validated against this combined worst-case scenario
    before commercial operation commences.
  issue_severity: moderate
  project_type: storage
  project_scale_band: first commercial/FOAK
