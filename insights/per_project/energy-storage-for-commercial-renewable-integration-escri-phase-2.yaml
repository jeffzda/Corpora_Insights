  project_name: ESCRI-SA Battery Energy Storage Project
  what_happened: Due to temperature de-rating caused by insufficient cooling, the
    BESS could only sustain approximately 28 MW during a 15-minute full discharge
    under onerous conditions (high ambient temperature or prior usage), rather than
    the rated 30 MW.
  lesson_learnt: Temperature de-rating under maximum discharge conditions can materially
    reduce effective capacity below nameplate rating; BESS projects should test full-capacity
    discharge performance under worst-case thermal conditions during commissioning
    and confirm contractual capacity obligations can be met before commercial handover.
