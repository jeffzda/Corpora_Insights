- record_id: ARENA-DLV-41868
  source_title: 'ESCRI-SA Battery Energy Storage Project Operational Report #1'
  publish_date: 2019-07
  project_name: ESCRI-SA Battery Energy Storage Project
  what_happened: The active power trading optimisation software deployed at commercial
    operation was a Minimum Viable Product (MVP) that did not optimise between energy
    arbitrage and FCAS — value trade-offs were managed manually by AGL. A comprehensive
    optimisation module was identified as necessary before the introduction of five-minute
    settlement in July 2021.
  lesson_learnt: BESS market optimisation software should be scoped and budgeted as
    a full capability from the outset — deploying only an MVP creates ongoing manual
    intervention burdens and leaves arbitrage value on the table; the timeline to
    five-minute settlement creates a hard deadline for optimisation capability that
    should be built into project delivery plans.
