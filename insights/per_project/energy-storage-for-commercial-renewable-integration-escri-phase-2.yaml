  project_name: ESCRI-SA Battery Energy Storage Project
  what_happened: The auxiliary loads and losses of the BESS — averaging 2.25% of 30
    MW rated capacity across two years — were a significant operational consideration.
    The BESS consumed 6,191 MWh over two years compared to only 1,225 MWh exported,
    because it operates as a power battery requiring constant availability rather
    than an energy battery focused on arbitrage.
  lesson_learnt: The intended operating mode of a battery (power vs. energy) must
    be clearly understood and factored into commercial arrangements from the outset,
    as auxiliary load and standby losses for a power battery are significantly higher
    than for an energy-optimised battery and will materially affect net revenue.
