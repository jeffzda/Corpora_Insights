  project_name: ESCRI-SA Battery Energy Storage Project
  what_happened: During the SA islanding event on 31 January 2020, the automated rebidding
    system used to dispatch FCAS services required multiple manual interventions (rebids)
    and a software update to manage state of charge optimally, exposing limitations
    of the Minimum Viable Product (MVP) bidding system under extreme operating conditions.
  lesson_learnt: A Minimum Viable Product automated bidding system may be adequate
    for normal NER compliance but will require manual intervention and rapid software
    updates during rare but high-impact system separation events — operators should
    plan for accelerated software development and dedicated trading resources to manage
    such events, and should not rely on MVP software for optimal SOC management under
    stress conditions.
