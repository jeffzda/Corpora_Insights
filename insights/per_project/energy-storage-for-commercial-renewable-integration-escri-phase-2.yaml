  what_happened: The spare parts inventory under the facility maintenance contract
    did not initially include spare battery modules or SCADA system spares. This left
    the project exposed to the 7–8 week sea freight lead time for battery modules
    and the risk of extended SCADA downtime in the event of a failure.
  lesson_learnt: Facility maintenance contracts for BESS should explicitly include
    provision for spare battery modules and SCADA system spares from contract commencement
    — excluding these items creates unacceptable lead-time exposure given that battery
    modules cannot be air freighted and SCADA failures can render the system unavailable.
