  project_name: ESCRI-SA Battery Energy Storage Project
  what_happened: The non-credible loss of both Moorabool–Mortlake and Moorabool–Haunted
    Gully 500 kV lines on 31 January 2020 (due to transmission tower collapse in a
    thunderstorm) effectively islanded South Australia from the NEM, creating a system
    security configuration never previously experienced that required AEMO to issue
    an unprecedented number of system security directions.
  lesson_learnt: BESS operators should ensure their trading and control systems are
    tested against extreme and novel system configurations — the SA islanding event
    created unprecedented AEMO directions and multi-week FCAS market stress that the
    MVP automated bidding system was not equipped to handle autonomously, requiring
    rapid manual and software interventions.
