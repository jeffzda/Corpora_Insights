  source_title: ESCRI-SA Battery Energy Storage Project Operational Report 3
  publish_date: 2020-08
  project_name: ESCRI-SA Battery Energy Storage Project
  what_happened: On 29 April 2020, an Island Detection Scheme (IDS) logic fault caused
    the BESS to trip during an islanding event triggered by testing at the Wattle
    Point Wind Farm, leaving approximately 3.3 MW of local load unsupplied for about
    2 minutes before normal supply was restored.
  lesson_learnt: Protection logic interactions between a BESS and co-located generation
    assets (e.g. wind farms) must be fully tested under all possible intertrip and
    testing scenarios — an active intertrip signal from the wind farm was not cleared
    before BESS re-synchronisation, exposing an IDS logic gap that caused an inadvertent
    trip and brief supply interruption.
