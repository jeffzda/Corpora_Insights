  source_title: 'ESCRI-SA Battery Energy Storage Project Operational Report #1'
  publish_date: 2019-07
  project_name: ESCRI-SA Battery Energy Storage Project
  what_happened: FCAS revenue over the first six months of operation was approximately
    $1.33 million, forming over 90% of total competitive market revenue and significantly
    exceeding the business case forecast, while energy arbitrage revenue of $116,000
    was approximately half of what was forecast. The dominance of FCAS revenue was
    in part driven by contractual limitations on available capacity for energy arbitrage
    caused by the incomplete WPWF islanding integration.
  lesson_learnt: FCAS is likely to be the dominant revenue stream for grid-scale power
    batteries in the early NEM market, but future projects should not rely on this
    — FCAS value is expected to erode as more batteries and fast-response technologies
    enter the market, and business cases should stress-test revenue models against
    declining FCAS prices.
