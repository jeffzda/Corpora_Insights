  what_happened: A battery module failed during commissioning and a replacement was
    not received until April 2019 — approximately three months after the failure —
    due to the long lead time for modules sourced from South Korea via sea freight.
    Modules could not be air freighted for safety reasons.
  lesson_learnt: Battery module lead times of 7–8 weeks or more (sea freight from
    South Korea) should be factored into spare parts planning for BESS projects —
    consider pre-positioning modules with a domestic distributor or holding hot spares
    on-site to avoid extended partial de-rating during the operational phase.
