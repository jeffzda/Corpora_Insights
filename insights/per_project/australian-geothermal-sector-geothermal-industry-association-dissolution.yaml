  source_title: 'Looking Forward: Barriers, Risks and Rewards of the Australian Geothermal
    Sector to 2020 and 2030'
  publish_date: 2014-06
  project_name: Australian Geothermal Sector – Geothermal Industry Association Dissolution
  what_happened: In November 2013, the Australian Geothermal Energy Association (AGEA)
    changed from an industry body to a professional association, leaving individual
    project proponents without collective industry representation or engagement from
    established energy players, reducing company maturity assessment for EGS projects
    to CRI Level 1.
  lesson_learnt: A functioning industry body is a material factor in sector commercial
    readiness; when the industry association converts to a professional body, the
    collective bargaining capacity, policy advocacy, and standards-setting function
    disappear — this loss of institutional infrastructure compounds the difficulties
    of attracting capital and engaging with regulators and offtakers.
