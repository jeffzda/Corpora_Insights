  technology_domain: solar thermal
  source_pages: &id001
  - 13
  evidence_excerpt: During warm days, when cooling is required in a given building,
    the relatively low grade heat generated by the current BIPVT technology is not
    of a sufficiently high temperature to drive other processes. However, if the outlet
    temperature of the air from a BIPVT system could be increased to approximately
    60-80⁰C then it could be used in innovative, heat-driven cooling technologies
    such as desiccant cooling, absorption and adsorption cooling as a heat source.
  confidence_note: issue_severity set to moderate — the thermal limitation is a meaningful
    constraint on the value proposition but the demonstration objectives were substantially
    met.
