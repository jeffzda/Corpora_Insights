  what_happened: Implementation and testing of BIPVT systems on the Illawarra Flame
    House and SBRC building revealed that advanced real-time control strategies —
    including dynamic fan speed optimisation as a function of weather conditions and
    occupant scheduling — had not been developed for air-based BIPVT systems, limiting
    the ability to maximise system performance.
  lesson_learnt: Future BIPVT projects, particularly for multiple residential and
    commercial building types, should prioritise development and validation of advanced
    control and optimisation strategies including dynamic fan speed scheduling, as
    the absence of such strategies leaves significant performance on the table.
