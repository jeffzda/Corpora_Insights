  publish_date: 2015-03
  project_name: Optimising Thin-Film Building Integrated Photovoltaic Thermal Systems
    for Retrofitting Existing Buildings
  what_happened: Integration of phase change materials (PCMs) with BIPVT was shown
    through simulation and prototype testing to improve heating and cooling delivery
    and potentially lower life-cycle costs, but overall system performance was found
    to be strongly dependent on PCM type, phase-change temperature, storage design,
    energy flow control, and climatic conditions — variables not yet fully optimised.
  lesson_learnt: BIPVT-PCM integrated systems require detailed economic analysis,
    design optimisation, and control optimisation before commercialisation; future
    projects must treat PCM type selection, phase-change temperature, and control
    strategy as tightly coupled design variables rather than independent choices.
