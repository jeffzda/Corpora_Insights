  project_name: Optimising Thin-Film Building Integrated Photovoltaic Thermal Systems
    for Retrofitting Existing Buildings
  what_happened: During implementation and testing of air-based BIPVT systems on demonstration
    buildings, leakage associated with BIPVT components — specifically dampers — was
    identified as a significant factor affecting overall system performance.
  lesson_learnt: Damper leakage in air-based BIPVT systems must be explicitly addressed
    during design, installation, and commissioning; specification of damper airtightness
    standards and commissioning leak-testing protocols should be built into project
    plans to prevent performance degradation in deployed systems.
