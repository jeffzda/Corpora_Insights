    based on NatHERS star ratings rather than detailed matching of BIPVT output to
    actual building heat demand profiles, leaving the accuracy of payback period estimates
    uncertain.
  lesson_learnt: Future techno-economic assessments of BIPVT should use detailed demand-matching
    analysis (BIPVT thermal output vs. actual building heat demand time-series) rather
    than generalised NatHERS ratings, as coarser demand assumptions introduce significant
    uncertainty into payback period estimates and could lead to over- or under-investment
    decisions.
