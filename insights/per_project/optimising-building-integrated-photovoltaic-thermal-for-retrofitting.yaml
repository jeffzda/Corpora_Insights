- record_id: ARENA-DLV-67501
  source_title: Optimising Thin-Film Building Integrated Photovoltaic Thermal for
    Retrofitting
  publish_date: 2015-03
  project_name: Optimising Thin-Film Building Integrated Photovoltaic Thermal Systems
    for Retrofitting Existing Buildings
  what_happened: Air-based BIPVT systems were demonstrated to be effective at supplying
    heat and electricity during cooler weather, but the cooling capacity available
    from night-time radiative cooling during warm nights was found to be limited.
    On warm days, the heat generated was not at a sufficiently high temperature (below
    ~60–80°C) to drive heat-driven cooling technologies such as desiccant or absorption
    cooling.
  lesson_learnt: Future BIPVT development should target outlet air temperatures of
    approximately 60–80°C to enable integration with heat-driven cooling technologies
    (desiccant, absorption, adsorption cooling), which would allow the technology
    to address peak cooling demand and reduce stress on electricity networks — the
    current low-grade thermal output limits warm-weather value.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: industrial operator
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
