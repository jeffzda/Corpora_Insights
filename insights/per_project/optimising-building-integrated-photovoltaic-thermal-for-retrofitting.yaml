  publish_date: 2015-03
  project_name: Optimising Thin-Film Building Integrated Photovoltaic Thermal Systems
    for Retrofitting Existing Buildings
  what_happened: Testing and theoretical analysis confirmed that BIPVT systems can
    be retrofitted to existing buildings and are both practicable and economically
    feasible, validating the retrofit deployment concept across two demonstration
    buildings (Illawarra Flame House and SBRC rooftop).
  lesson_learnt: BIPVT retrofit to existing buildings is technically feasible; future
    projects should proceed with confidence on the retrofit installation pathway,
    using the validated design methodology and decision support tool developed in
    this project to size and configure systems for specific building types and climates.
