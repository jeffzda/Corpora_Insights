  source_title: Summary of ARENA Funded Hydrogen R&D Projects
  publish_date: 2023-04
  project_name: Queensland University of Technology – Hydrogen Process
  what_happened: The QUT hydrogen precinct micro-laboratory project identified that
    a digital monitoring system for remote management and control of a pilot plant
    is a necessary requirement for future project success — this was not incorporated
    at the outset of the facility design.
  lesson_learnt: Hydrogen testing facility designs should include digital monitoring
    and remote control capability from the initial design phase — retrofitting these
    systems post-construction creates delays and additional cost, and is a foreseeable
    requirement for operating at pilot-scale and beyond.
