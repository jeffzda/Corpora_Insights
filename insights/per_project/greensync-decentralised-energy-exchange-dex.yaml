  project_name: Greensync Decentralised Energy Exchange (deX)
  what_happened: The deX project trialled an online marketplace for buying and selling power from DER and tested how customers and energy technology businesses would use such a platform, with the platform
    subsequently matured through further industry deployments including the Simply Energy VPP project.
  lesson_learnt: DER marketplace platforms require iterative real-world trialling across multiple project contexts to mature — plan for follow-on deployments at the design stage rather than treating a single
    trial as sufficient evidence for commercial readiness.
