- record_id: ARENA-DLV-14963
  source_title: 'Looking Forward: Barriers, Risks and Rewards of the Australian Geothermal
    Sector to 2020 and 2030'
  publish_date: 2014-06
  project_name: Australian Geothermal Sector – Policy Inconsistency Risk
  what_happened: Policy inconsistency in relation to the renewable energy sector —
    including uncertainty over the Renewable Energy Target review and carbon pricing
    — contributed to geothermal investors and partners exiting the sector, compounding
    the already high resource and technology risk.
  lesson_learnt: Long-lived, capital-intensive renewable energy technologies such
    as EGS geothermal require stable, long-horizon policy settings to attract investment;
    policy uncertainty that shortens investors' effective planning horizon adds risk
    premiums that can make otherwise marginal technologies non-fundable.
