- record_id: ARENA-DLV-16256
  source_title: Energy Storage Study
  publish_date: 2015-07
  project_name: Australian Energy Storage Market — Battery Safety Standards Gap
  what_happened: As of mid-2015, Australia lacked common industry-wide installation
    and housing standards for battery energy storage systems. This was identified
    across the international market review, domestic review, industry survey and stakeholder
    consultations as a significant barrier to safe, repeatable deployment, with unconfirmed
    accounts of house fires in Germany linked to residential batteries installed under
    the KfW 275 program.
  lesson_learnt: Establish installation and housing safety standards for battery storage
    before any large-scale residential or commercial rollout — the absence of standards
    creates safety risks, reduces consumer confidence, and can expose the broader
    industry to reputational damage from poor-quality installations.
  issue_severity: major
