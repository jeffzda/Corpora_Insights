  evidence_excerpt: Currently, Australia is at the early stage of standards or code
    development for energy storage systems with the current focus on grid connection
    (AS4777) but with lesser focus on the design, installation, testing, maintenance
    or safe housing of battery systems. This represents a significant barrier for
    the safe, reliable and repeatable installation of battery systems.
