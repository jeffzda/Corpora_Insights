- record_id: ARENA-DLV-20729
  source_title: Demand Response Short Notice RERT Trial Year 3 Report
  publish_date: 2021-10
  project_name: DR SN RERT Trial — 60-minute notification period performance improvement
  what_happened: In Year 3, portfolios using a 60-minute notification period met their
    aggregate contracted DR volume in both test periods for the first time in the
    trial's history; portfolios with a 10-minute notification period had met contracted
    volumes in all three years, but 60-minute portfolios had not previously achieved
    this.
  lesson_learnt: Longer notification periods (60 minutes vs 10 minutes) for DR dispatch
    took more trial iterations to achieve reliable delivery to contracted volumes,
    suggesting that C&I customer and aggregator capability for rapid response matures
    over multiple trial years; new DR programs using 60-minute notice should plan
    for a capability ramp-up period before relying on full contracted delivery.
