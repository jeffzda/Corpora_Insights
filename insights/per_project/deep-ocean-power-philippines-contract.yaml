- record_id: ARENA-DLV-50008
  source_title: Ocean Energy Report by Seanergy and Ernst and Young
  publish_date: 2016-06
  project_name: Deep Ocean Power Philippines Contract
  what_happened: Deep Ocean Power Philippines' ocean energy service contract, awarded
    by the Philippine Department of Energy in 2011, was terminated by the Department
    of Energy due to a lack of progress.
  lesson_learnt: Ocean energy developers entering new markets via government service
    contracts must have a clear and credible implementation plan with demonstrable
    early-stage progress; failure to show progress against contract milestones risks
    contract termination and reputational damage in the target market.
