  project_name: NEM Large-Scale Solar Farms (44-farm portfolio study)
  what_happened: The commercial structure of battery tolling agreements used at some
    solar farms limited the control existing solar farm owners had over the operation
    of co-located storage, constraining the ability to optimise battery dispatch to
    capture curtailed energy.
  lesson_learnt: Solar farm owners considering co-located storage should scrutinise
    battery tolling agreement terms before execution — provisions that transfer operational
    control to a third-party battery operator may prevent the solar farm owner from
    directing the battery to capture curtailed energy, directly reducing the value
    of the retrofit.
