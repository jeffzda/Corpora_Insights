- record_id: ARENA-DLV-57352
  source_title: 'The Generator Operations Series Report Six: Unlocking Curtailed Solar
    Energy on the NEM through Storage'
  publish_date: 2022-11
  project_name: NEM Large-Scale Solar Farms (44-farm portfolio study)
  what_happened: Across 44 large-scale solar farms on the NEM over three years (June
    2019–May 2022), an average of 13.7% of available energy was curtailed, totalling
    approximately 980 GWh per year — equivalent to the annual generation of seven
    average large-scale solar farms — representing a $119M per year revenue opportunity
    if stored and dispatched at evening peak prices.
  lesson_learnt: Project developers evaluating co-located storage retrofits at existing
    solar farms should quantify site-specific curtailment volumes before sizing the
    battery — across the NEM, curtailment typically occurs at 20–30% of AC farm capacity
    per constrained interval, suggesting a battery sized to 3 hours of storage at
    that power level can capture the bulk of daily curtailment.
