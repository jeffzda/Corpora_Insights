  what_happened: Existing storage facilities that had already negotiated connection
    agreements with NSPs under the pre-IRP framework were subject to a transitory
    provision under the new IRP rules stating that the new rules would not affect
    existing agreements — meaning they could not automatically benefit from the new
    aggregate conformance and registration simplification provisions.
