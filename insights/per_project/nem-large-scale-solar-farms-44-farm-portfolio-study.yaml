- record_id: ARENA-DLV-57355
  source_title: 'The Generator Operations Series Report Six: Unlocking Curtailed Solar
    Energy on the NEM through Storage'
  publish_date: 2022-11
  project_name: NEM Large-Scale Solar Farms (44-farm portfolio study)
  what_happened: Under the pre-IRP NER framework, the application of TUOS and DUOS
    charges to storage and hybrid facilities was unclear, with different network service
    providers interpreting the rules differently — meaning a developer could not determine
    operating costs with certainty until completing case-by-case negotiations with
    each NSP after design and commercial close.
  lesson_learnt: Developers of co-located solar-plus-storage projects must initiate
    early, specific negotiations with the relevant NSP on Use of System charges before
    finalising the financial model — under the pre-IRP framework, charges varied by
    NSP interpretation and were not deterministic, creating material financial uncertainty
    that could undermine investment decisions.
  issue_severity: moderate
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: project developer
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: The IRP rule change gave storage participants the option to select
    their service level and negotiate a prescribed or negotiated transmission service
    with TNSPs on a comparable basis to other transmission customers, providing greater
    cost certainty.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id004
  - 9
  evidence_excerpt: The AEMC recognised that there was a lack of clarity as to how
    TUOS and DUOS charges apply to storage and hybrid facilities under the current
    rules, and they are therefore treated differently depending on how the NSP interprets
    the NER. So when a developer is considering the feasibility of a storage or hybrid
    project, there is uncertainty on the quantum of its operating costs… until it
    has finalised negotiations with the NSP on a case-by-case basis.
