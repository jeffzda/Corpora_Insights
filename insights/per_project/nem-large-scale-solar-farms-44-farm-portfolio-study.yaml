  what_happened: Retrofitting a battery to an existing solar farm on the NEM risked
    triggering a requirement for the generator to renegotiate generator performance
    standards and connection agreements with AEMO and NSPs for the existing solar
    asset, creating material financial risk to existing investors in the solar farm.
  lesson_learnt: Before committing to a BESS retrofit at an existing solar farm, developers
    must seek legal and technical advice on whether the modification will trigger
    renegotiation of existing connection agreements and generator performance standards
    — the financial exposure of reopening these agreements can materially affect the
    retrofit's business case and should be treated as a project risk in the feasibility
    assessment.
