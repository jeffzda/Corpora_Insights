- record_id: ARENA-DLV-57369
  source_title: 'The Generator Operations Series Report Six: Unlocking Curtailed Solar
    Energy on the NEM through Storage'
  publish_date: 2022-11
  project_name: NEM Large-Scale Solar Farms (44-farm portfolio study)
  what_happened: Marginal loss factors were not included in the study's revenue calculations,
    and the document explicitly notes that MLFs could significantly reduce the available
    revenue from curtailment arbitrage depending on the solar farm's location — implying
    that farms in congested or electrically remote regions may see substantially less
    arbitrage revenue than headline figures suggest.
  lesson_learnt: Developers modelling the value of co-located storage at a specific
    solar farm must apply site-specific marginal loss factors to revenue calculations
    — ignoring MLFs can significantly overstate arbitrage revenue, particularly for
    farms in regions with high network losses, and may lead to incorrect investment
    decisions.
