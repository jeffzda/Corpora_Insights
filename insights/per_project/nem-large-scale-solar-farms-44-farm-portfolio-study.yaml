- record_id: ARENA-DLV-57368
  source_title: 'The Generator Operations Series Report Six: Unlocking Curtailed Solar
    Energy on the NEM through Storage'
  publish_date: 2022-11
  project_name: NEM Large-Scale Solar Farms (44-farm portfolio study)
  what_happened: The IRP rule change introduced aggregate conformance at the connection
    point, meaning that where a solar farm and battery form part of the same IRP behind
    a single connection point, compliance with dispatch instructions is measured in
    aggregate — enabling the battery to discharge less than scheduled while the solar
    farm generates above its curtailment cap, provided the combined output equals
    the sum of dispatch targets.
  lesson_learnt: Developers of new co-located solar-plus-storage projects should register
    as an IRP under the post-June 2024 rules to access aggregate conformance — this
    is the enabling regulatory mechanism that allows the battery to absorb curtailed
    solar energy during network constraint events without the overall IRP breaching
    its connection point obligations.
