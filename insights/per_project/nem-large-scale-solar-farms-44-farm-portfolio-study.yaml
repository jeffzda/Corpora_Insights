  source_title: 'The Generator Operations Series Report Six: Unlocking Curtailed Solar
    Energy on the NEM through Storage'
  publish_date: 2022-11
  project_name: NEM Large-Scale Solar Farms (44-farm portfolio study)
  what_happened: The average daily curtailment across all 44 farms was 68 MWh, and
    the typical magnitude of curtailment during constrained intervals was approximately
    20–30% of the farm's AC capacity, providing an empirical basis for sizing co-located
    battery storage.
  lesson_learnt: Use the rule of thumb that a battery sized at 20–30% of the solar
    farm's AC capacity with approximately 3 hours of storage duration will capture
    the bulk of daily curtailment at a typical NEM solar farm — for a 50 MWAC farm
    this translates to 10–15 MW / 30–45 MWh, which can serve as a starting point for
    pre-feasibility sizing before a site-specific curtailment study is completed.
