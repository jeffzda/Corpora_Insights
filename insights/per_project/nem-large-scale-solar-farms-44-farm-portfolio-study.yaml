  lifecycle_phase: operations
  proponent_type: project developer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: AEMO subsequently largely resolved the system strength issue
    in the West Murray region, though individual farms across all regions continued
    to experience local limit curtailment for other reasons.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id002
