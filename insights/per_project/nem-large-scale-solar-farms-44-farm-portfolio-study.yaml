  evidence_excerpt: The greatest level of local limit curtailment was seen at four
    Victorian solar farms in the West Murray region in late 2019 and early 2020, due
    to 50 per cent caps on capacity placed by AEMO in response to low system strength.
    While this specific issue has been largely resolved, solar farms in Victoria have
    seen even higher levels of curtailment in late 2021 from economic curtailment
    and network constraints.
