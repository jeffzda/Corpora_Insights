- record_id: ARENA-DLV-57353
  source_title: 'The Generator Operations Series Report Six: Unlocking Curtailed Solar
    Energy on the NEM through Storage'
  publish_date: 2022-11
  project_name: NEM Large-Scale Solar Farms (44-farm portfolio study)
  what_happened: Four Victorian solar farms in the West Murray region experienced
    the highest local limit curtailment in the study — AEMO imposed 50% capacity caps
    in late 2019 and early 2020 due to low system strength in a region geographically
    distant from synchronous generation, causing material generation loss at those
    sites.
  lesson_learnt: Developers siting solar farms in regions with low system strength
    and limited synchronous generation (such as the West Murray zone) should account
    for the risk of AEMO-imposed local limit caps in yield assessments and revenue
    projections, and consider system strength services or co-located storage as mitigants.
