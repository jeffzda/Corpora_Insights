  evidence_excerpt: The total volume of curtailed energy is approximately 980 GWh
    per year, which is 16 per cent of the total annual generation across the solar
    farms in the study… The installation of storage assets either co-located with
    solar farms or at congested points on the network to shift this curtailed energy
    to be dispatched during the period of peak evening demand represents a $119M per
    year revenue stream.
