- record_id: ARENA-DLV-57354
  source_title: 'The Generator Operations Series Report Six: Unlocking Curtailed Solar
    Energy on the NEM through Storage'
  publish_date: 2022-11
  project_name: NEM Large-Scale Solar Farms (44-farm portfolio study)
  what_happened: Under the pre-IRP National Electricity Rules, storage participants
    with nameplate capacity of 5 MW or more were required to register as both a Market
    Generator and a Market Customer, submit separate bids for generation and consumption,
    and receive separate dispatch objectives from AEMO — creating significant administrative
    and regulatory complexity with no recognition of the interaction between co-located
    battery and solar assets.
  lesson_learnt: Project developers planning co-located solar-plus-storage projects
    under the pre-June 2024 rules should assess whether the added administrative burden
    of dual registration (Market Generator and Market Customer) has been factored
    into operations costs and staffing — and plan for re-registration as an IRP once
    the new rules take effect to simplify ongoing compliance.
  issue_severity: moderate
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: The AEMC's IRP rule change (effective June 2024) introduced the
    Bidirectional Unit category and simplified registration, bidding and dispatch
    for co-located assets, resolving the dual-registration requirement.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id003
  - 9
  evidence_excerpt: Currently the NER require storage unit participants that have
    a nameplate rating of 5 MW or more to register and participate in the NEM as both
    a Market Generator and a Market Customer (Scheduled Load)… there is significant
    administrative and regulatory complexity, and a co-located battery receives no
    recognition for the way it interacts with the adjacent solar or wind farm.
  confidence_note: 'This record captures the pre-IRP regulatory barrier as a delivery
    insight for projects currently in development or recently commissioned under the
    old framework.; project_type reconciled to ''storage'' from: storage (7/19), multi-technology/hybrid
    (6/19), generation (6/19)'
