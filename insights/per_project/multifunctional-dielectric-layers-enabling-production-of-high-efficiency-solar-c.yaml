- record_id: ARENA-DLV-8405
  source_title: Multifunctional Dielectric Layers Enabling Production of High-Efficiency
    Solar Cells Final Report
  publish_date: 2023-01
  project_name: Advanced multifunctional dielectric layers enabling simplified production
    of high-efficiency silicon solar cells
  what_happened: Laser-doped formation of n+ regions from POx/Al2O3 stacks was demonstrated
    as readily achievable, but formation of p+ regions from the same stacks was found
    to be challenging, limiting the technology's applicability to certain cell integration
    pathways.
  lesson_learnt: When evaluating POx/Al2O3-based laser contact formation for solar
    cell architectures requiring both n-type and p-type contacts (e.g. IBC cells),
    account for the asymmetry — n+ contact formation is viable but p+ formation requires
    an alternative solution, and this constraint should be incorporated into integration
    pathway planning from the outset.
