- record_id: ARENA-DLV-8406
  source_title: Multifunctional Dielectric Layers Enabling Production of High-Efficiency
    Solar Cells Final Report
  publish_date: 2023-01
  project_name: Advanced multifunctional dielectric layers enabling simplified production
    of high-efficiency silicon solar cells
  what_happened: Early work on laser-processed contact formation focused on large-area
    regions (~1 cm × 1 cm), but when scaled down to device-relevant small-area point
    contacts (~20 μm × 20 μm), edge recombination losses from laser-induced defects
    became a significant problem that had not been apparent at large area and required
    a dedicated investigation to resolve.
  lesson_learnt: When developing laser contact formation processes, results from large-area
    test structures do not predict small-area point-contact behaviour — edge recombination
    effects become dominant at small contact sizes and must be specifically characterised
    and mitigated before device-level viability can be assessed.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: A systematic investigation of annealing treatments identified
    a novel low-temperature (200°C) annealing process capable of passivating the majority
    of laser-induced defects at point-contact edges, resolving the recombination loss
    issue.
  transferability: narrow
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id005
  - 9
  - 10
  evidence_excerpt: Unlike for large-area laser-processed regions, edge recombination
    losses due to laser-induced defects become important for small point contacts
    and significantly increase overall recombination losses. Therefore a systematic
    investigation of different annealing treatments was performed, which successfully
    identified a novel low-temperature annealing process capable of passivating the
    majority of laser-induced defects.
  confidence_note: null
