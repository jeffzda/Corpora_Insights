  source_title: Multifunctional Dielectric Layers Enabling Production of High-Efficiency
    Solar Cells Interim Report
  publish_date: 2021-10
  project_name: Advanced multifunctional dielectric layers enabling simplified production
    of high-efficiency silicon solar cells
  what_happened: On a short 2-year R&D project commencing during COVID-19, international
    border closures and constrained supply chains impeded recruitment of personnel
    and procurement of equipment and materials, reducing effective project time at
    the start of the project.
  lesson_learnt: Ensure all personnel are recruited and all facilities and equipment
    are fully operational before a short-duration R&D project commences — on a 2-year
    timeline there is no slack to absorb delays caused by recruitment difficulties,
    shipping constraints, or supply chain disruptions, which were severely amplified
    during the COVID-19 period.
