- record_id: ARENA-DLV-8404
  source_title: Multifunctional Dielectric Layers Enabling Production of High-Efficiency
    Solar Cells Final Report
  publish_date: 2023-01
  project_name: Advanced multifunctional dielectric layers enabling simplified production
    of high-efficiency silicon solar cells
  what_happened: Investigation revealed that the Al2O3 capping layer in POx/Al2O3
    stacks plays a more complex and multi-faceted role than originally assumed — intermixing
    between POx and Al2O3 during annealing was found to be critical to the stack's
    passivation properties, not merely a moisture barrier and hydrogenation source.
  lesson_learnt: Initial design assumptions about the role of individual layers in
    multi-layer dielectric stacks can be incorrect; detailed materials characterisation
    during R&D is essential to correctly attribute functional roles and avoid optimising
    against a flawed model.
  issue_severity: minor
  project_type: manufacturing/supply chain
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Systematic investigation of alternative capping layers and POx-based
    ternary compounds clarified the actual functional role of the Al2O3 layer and
    the chemical origin of positive charge in POx.
  transferability: narrow
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id003
  - 10
  evidence_excerpt: The role of the Al2O3 capping layer is not limited to that of
    a moisture barrier and hydrogenation source as previously thought. In fact, intermixing
    of POx and Al2O3 occurs in POx/Al2O3 stacks during annealing, and appears to be
    critical to the excellent passivation properties of the stack.
