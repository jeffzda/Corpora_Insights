- record_id: ARENA-DLV-51491
  source_title: UTS - Flexible Demand State of Play in Australia - Report
  publish_date: 2024-05
  project_name: Strategic Electric Vehicle Integration
  what_happened: Market landscaping for the SEVI project found that major barriers
    to fleet EV uptake relate to the cost and complexity of upgrading local electricity
    infrastructure at work sites and establishing financial and organisational arrangements
    for employees who garage vehicles at home.
  lesson_learnt: Fleet EV electrification programs should treat site electrical infrastructure
    upgrades and home-garaging charging arrangements as primary barriers requiring
    dedicated solutions — these are consistently the largest friction points for fleet
    managers, and programs that do not address them at design stage will have low
    conversion rates among eligible fleets.
