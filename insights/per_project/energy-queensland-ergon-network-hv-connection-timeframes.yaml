  source_title: ARENA Electrical Infrastructure Roundtable
  publish_date: '2025-06-25'
  project_name: Energy Queensland / Ergon Network – HV Connection Timeframes
  what_happened: Large-scale HV connection projects (greater than 1 MVA) managed by Energy Queensland's Major Customers team have typical timeframes ranging from 18 months to 48 months from enquiry to commissioning.
  lesson_learnt: Proponents planning industrial or generation connections above 1 MVA in Queensland should budget 18–48 months for the full connection process from enquiry to commissioning; relying on shorter
    timelines risks project schedule failure and should be treated as a reference-class anchor for program planning.
