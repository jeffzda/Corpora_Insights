- record_id: ARENA-DLV-72267
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects - First Edition Results'
  publish_date: '2014'
  project_name: Mackay Sugar Cogeneration Plant (Project ID 353)
  what_happened: Mackay Sugar constructed a 38MW bagasse cogeneration plant (AUD 120M) exporting approximately 27MW into the grid, successfully providing renewable base-load electricity for approximately
    30% of Mackay. The project demonstrated year-round operation using bagasse transferred from multiple mills, but all similar sugar mill cogeneration projects were noted to be entirely dependent on the
    20% RET scheme for viability.
  lesson_learnt: Industrial biomass cogeneration projects at sugar mills are commercially viable and replicable, but complete dependence on the RET scheme for financial viability represents a material policy
    risk — project proponents should stress-test business cases against RET changes before committing to capital investment.
