- record_id: ARENA-DLV-14968
  source_title: 'Looking Forward: Barriers, Risks and Rewards of the Australian Geothermal Sector to 2020 and 2030'
  publish_date: 2014-06
  project_name: Landau EGS Project (Germany)
  what_happened: The Landau commercial EGS project became operational in 2007 within three years of project initiation, demonstrating that commercial EGS power production is achievable with sufficiently
    high feed-in tariffs, and that managing induced seismicity through pumping rather than high-pressure injection can reduce both seismicity and public concern while increasing fluid recovery rates.
  lesson_learnt: Commercial EGS is feasible when generous and stable feed-in tariffs reduce revenue risk; and at higher flow rates, pumping the production well at lower injection pressures — rather than
    injecting at high pressure — reduces induced seismicity while improving fluid recovery, a finding directly applicable to Australian EGS operational design.
