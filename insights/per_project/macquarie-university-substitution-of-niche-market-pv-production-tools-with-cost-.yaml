  source_title: Addressing Solar PV End-of-Life Issues and Lowering Solar PV Cost
    – Summary Report
  publish_date: 2024-05
  project_name: Macquarie University – Substitution of Niche-Market PV Production
    Tools with Cost-Effective Consumer-Electronics Technology (2020 RND007)
  what_happened: Of three consumer technologies investigated (microwave thermal treatments,
    flatbed scanners, thermal image scanners), only the flatbed scanner approach proved
    sufficiently promising economically and technically, requiring the project to
    concentrate resources on a single pathway rather than delivering across all three
    originally scoped technologies.
  lesson_learnt: Multi-pathway R&D projects at TRL 2–4 should be scoped with explicit
    down-selection criteria and milestones so that promising pathways receive adequate
    resource depth; spreading effort across multiple technologies risks delivering
    shallow results across all rather than a strong result on the best candidate.
