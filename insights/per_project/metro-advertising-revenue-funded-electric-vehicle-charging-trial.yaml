  source_title: Insights from ARENA's Public Charging Projects
  publish_date: 2024-06
  project_name: Metro Advertising Revenue Funded Electric Vehicle Charging Trial
  what_happened: JOLT found that ICE vehicles parking in designated EV charging bays
    ('ICEing') was a recurring problem at their sites. Brightly coloured bay markings
    resolved the issue while also delivering secondary benefits including improved
    user experience, company name visibility, safety, and enforcement of parking regulations.
  lesson_learnt: Install distinctive, high-visibility bay markings at all EV charging
    sites to deter ICEing — this is a low-cost intervention that simultaneously improves
    user experience, brand visibility, and regulatory compliance and should be included
    in every site design from the outset.
