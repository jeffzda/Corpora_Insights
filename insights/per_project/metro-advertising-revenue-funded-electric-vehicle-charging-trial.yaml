- record_id: ARENA-DLV-36980
  source_title: Insights from ARENA's Public Charging Projects
  publish_date: 2024-06
  project_name: Metro Advertising Revenue Funded Electric Vehicle Charging Trial
  what_happened: JOLT found that supplied charging cables (4 metres) were too short
    to reach the charging ports of many EV models due to the inconsistent placement
    of charging ports across different vehicle manufacturers. Switching from 4-metre
    to 7-metre cables resolved the problem but required increasing the slack between
    charging separators to prevent cables from becoming a tripping hazard when not
    in use.
  lesson_learnt: Specify charging cable lengths of at least 7 metres (with adequate
    retraction slack) when procuring EV charging hardware — the 4-metre OEM default
    is insufficient to serve the full range of EV models in the Australian market,
    and retrofitting cable upgrades post-installation adds cost and operational disruption.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: commercial expansion
  lifecycle_phase: commissioning/integration
  proponent_type: project developer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: JOLT Charge upgraded all charging cables from 4 metres to 7 metres
    with an internal spirator mechanism to ensure safe deployment and retraction without
    creating trip hazards.
  transferability: broad
  delay_magnitude: null
  technology_domain: EV
  source_pages:
  - 4
  - 31
  evidence_excerpt: For the first round of installations, the charging cable provided
    by the OEM were too short to reach many of the configurations of vehicle ports.
    JOLT Charge subsequently released an upgrade from 4 metre cables to 7 metre cables
    to ensure all customers could charge easily and safely.
