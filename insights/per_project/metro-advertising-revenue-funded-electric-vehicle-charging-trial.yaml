- record_id: ARENA-DLV-63801
  source_title: Metro Advertising Revenue Funded Electric Vehicle Charging Trial Lessons
    Learnt 2
  publish_date: 2022-01
  project_name: Metro Advertising Revenue Funded Electric Vehicle Charging Trial
  what_happened: Grid connection approvals with SA Power Networks (SAPN) took approximately
    3 months per site for scoping, followed by an additional 3 months for connection
    bookings, causing unforeseen delays to the installation of EV charging units across
    the network.
  lesson_learnt: Engage the DNSP (SA Power Networks) at the earliest possible stage
    of site planning — the scoping and booking process takes up to 6 months per site
    and network augmentation requirements (road-crossings, new pits, planned outages)
    can delay installation if not anticipated in the program schedule.
  issue_severity: moderate
