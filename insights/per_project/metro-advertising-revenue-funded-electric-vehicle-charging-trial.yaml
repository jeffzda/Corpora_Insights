- record_id: ARENA-DLV-19051
  source_title: Lessons Learnt Metro Advertising Revenue Funded Electric Vehicle Charging
    Trial
  publish_date: 2021-01
  project_name: Metro Advertising Revenue Funded Electric Vehicle Charging Trial
  what_happened: Site selection for EV chargers with advertising screens proved more
    complex than anticipated, as demand dynamics tied to demographic shifts (e.g.
    apartment densification, new traffic corridors) meant that commercially viable
    locations could change significantly over the project lifecycle, requiring ongoing
    monitoring rather than a fixed selection process.
  lesson_learnt: Site selection criteria for advertiser-funded EV charging infrastructure
    must treat demand and demographic factors as dynamic variables, not fixed inputs
    — build in periodic reassessment of site viability to account for urban densification
    and infrastructure-driven traffic changes.
