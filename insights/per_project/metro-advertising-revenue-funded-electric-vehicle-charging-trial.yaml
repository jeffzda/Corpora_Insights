- record_id: ARENA-DLV-63802
  source_title: Metro Advertising Revenue Funded Electric Vehicle Charging Trial Lessons
    Learnt 2
  publish_date: 2022-01
  project_name: Metro Advertising Revenue Funded Electric Vehicle Charging Trial
  what_happened: Desktop underground service investigations (Dial Before You Dig and
    council/utility data) proved inaccurate at multiple sites, with major services
    including gas and stormwater not identified, causing on-site delays when excavation
    commenced for EV charger installations.
  lesson_learnt: Do not rely solely on desktop underground service data for EV charger
    civil works — commission physical vacuum/hydro excavation investigations prior
    to installation to accurately locate unmapped services and avoid costly damage,
    remediation delays, and site stoppages.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: demonstration
  lifecycle_phase: construction/installation
  proponent_type: technology vendor
  delay_category: construction/installation
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: JOLT Charge adopted high-pressure hose/vacuum sucker truck excavation
    as standard practice, which simultaneously located services and dug trenches without
    damaging unmapped utilities, enabling all 21 units to be installed without remediation
    incidents.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: EV
  source_pages: &id006
  - 2
  - 3
  evidence_excerpt: In a number of instances, major public inground services such
    as gas and stormwater were not identified on the desktop analysis, creating delays
    on site when installation was underway.
