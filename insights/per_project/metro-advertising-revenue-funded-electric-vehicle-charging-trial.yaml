- record_id: ARENA-DLV-36984
  source_title: Insights from ARENA's Public Charging Projects
  publish_date: 2024-06
  project_name: Metro Advertising Revenue Funded Electric Vehicle Charging Trial
  what_happened: JOLT found that safety regulations created operational constraints
    in site design, specifically requiring kerb setbacks, side street sightlines,
    and pedestrian clearances. Engaging with public safety stakeholders (roading authorities,
    councils, electricity networks) in parallel with the standard development approval
    process saved time and resources compared with addressing their requirements sequentially.
  lesson_learnt: Engage roading authorities, councils, and electricity networks simultaneously
    with — not after — the development approval process; addressing safety authority
    requirements (kerb setbacks, sightlines, pedestrian clearances) in parallel rather
    than sequentially avoids late-stage redesign and reduces total approvals time.
