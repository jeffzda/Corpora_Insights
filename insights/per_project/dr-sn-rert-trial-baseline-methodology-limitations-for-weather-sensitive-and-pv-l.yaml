- record_id: ARENA-DLV-20721
  source_title: Demand Response Short Notice RERT Trial Year 3 Report
  publish_date: 2021-10
  project_name: DR SN RERT Trial — baseline methodology limitations for weather-sensitive
    and PV loads
  what_happened: The standard '10 of 10' baseline methodology used to calculate DR
    delivery was found to be unreliable for weather-sensitive loads and loads materially
    impacted by rooftop PV systems, producing both false positives and false negatives
    in measuring residential customer load reductions, affecting the accuracy of DR
    settlement.
  lesson_learnt: DR programs that include residential customers with rooftop PV or
    weather-sensitive loads should not rely on the standard '10 of 10' baseline method;
    a similar-day or temperature-adjusted baseline approach is necessary to produce
    accurate measurement, and this should be resolved before contracting residential
    DR capacity into RERT or wholesale markets where measurement accuracy is borne
    by all electricity users.
  issue_severity: moderate
  project_type: DER/customer-side
