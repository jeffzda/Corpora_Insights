- record_id: ARENA-DLV-25602
  source_title: Fortescue - Scale up of Next Gen CSIRO Axial Flow Electrolyser for
    Green Hydrogen - Core research interim report
  publish_date: '2025-07-28'
  project_name: Scale-up and demonstration of next-generation CSIRO axial flow electrolyser
    for green hydrogen production
  what_happened: CFD analysis identified a mismatch between flow profiles in the cathode
    and anode compartments of the axial flow electrolyser, which impairs ion transfer
    across the membrane and reduces reactor performance. This prompted design improvements
    focused on the cathode side.
  lesson_learnt: When designing membrane-separated electrochemical reactors, explicitly
    model and match flow profiles and velocities in both electrode compartments —
    mismatched profiles create concentration polarisation and reduce ion transfer
    efficiency, and this mismatch is not detectable without flow visualisation tools
    such as CFD.
