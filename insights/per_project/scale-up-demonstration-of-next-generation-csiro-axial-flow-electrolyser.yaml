  source_title: Fortescue - Scale up of Next Gen CSIRO Axial Flow Electrolyser for
    Green Hydrogen - Core research interim report
  publish_date: '2025-07-28'
  project_name: Scale-up and demonstration of next-generation CSIRO axial flow electrolyser
    for green hydrogen production
  what_happened: CFD simulations of the first-version electrolyser revealed that a
    significant portion of fluid in the cathode was short-circuiting into a limited
    number of branches, resulting in poor mixing throughout the reactor. Anticipated
    performance improvements had failed to materialise before CFD diagnosed the root
    cause.
  lesson_learnt: Integrate CFD simulation into electrolyser R&D from the outset —
    simulation can diagnose non-obvious flow distribution failures (such as cathode
    short-circuiting) that would otherwise require costly physical iteration to identify,
    enabling targeted design modifications before further fabrication.
