- record_id: ARENA-DLV-25603
  source_title: Fortescue - Scale up of Next Gen CSIRO Axial Flow Electrolyser for
    Green Hydrogen - Core research interim report
  publish_date: '2025-07-28'
  project_name: Scale-up and demonstration of next-generation CSIRO axial flow electrolyser
    for green hydrogen production
  what_happened: CFD simulations established that flow rates of 5 L min⁻¹ or higher
    enable efficient bubble removal in both anode and cathode channels, but increasing
    flow rate further raises pressure drop proportional to the square of velocity,
    increasing pumping energy requirements. A flow rate of 10 L min⁻¹ was selected
    as the experimental baseline to balance these competing factors.
  lesson_learnt: In porous-electrode electrolyser design, bubble removal and pumping
    energy efficiency are directly competing objectives — use CFD to quantify the
    trade-off and establish a specific flow rate setpoint before committing to experimental
    testing programmes, avoiding iterative empirical discovery of this trade-off at
    larger scale.
