- record_id: ARENA-DLV-25605
  source_title: Fortescue - Scale up of Next Gen CSIRO Axial Flow Electrolyser for
    Green Hydrogen - Core research interim report
  publish_date: '2025-07-28'
  project_name: Scale-up and demonstration of next-generation CSIRO axial flow electrolyser
    for green hydrogen production
  what_happened: Catalyst screening across four nickel-based HER formulations and
    four OER formulations identified HER 4 and OER 2 as the best-performing combination
    in the axial flow electrolyser, achieving onset potential of 1.00 V and current
    greater than 100 A at -3 V at 90°C — significantly outperforming uncoated stainless
    steel electrodes (onset 1.92 V, 43.3 A at -3 V).
  lesson_learnt: Conduct systematic multi-candidate catalyst screening in small electrochemical
    cells before committing to full electrolyser assembly — the performance gap between
    the best and worst Ni-based catalyst combinations was large enough (>2× current
    at -3 V) to materially affect subsequent scale-up decisions, and small-cell screening
    is far cheaper than discovering this at stack level.
