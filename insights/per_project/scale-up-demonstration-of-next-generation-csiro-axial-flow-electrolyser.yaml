  source_title: Fortescue - Scale up of Next Gen CSIRO Axial Flow Electrolyser for
    Green Hydrogen - Core research interim report
  publish_date: '2025-07-28'
  project_name: Scale-up and demonstration of next-generation CSIRO axial flow electrolyser
    for green hydrogen production
  what_happened: The project developed and validated a medium-scale electrodeposition
    setup specifically designed to ensure consistent, high-quality catalytic coating
    on porous, high-surface-area electrodes — a step identified as necessary before
    the catalyst performance validated in small flat electrodes could be reliably
    replicated on the three-dimensional porous electrode geometry used in the actual
    electrolyser.
  lesson_learnt: Do not assume that catalyst coatings optimised on flat electrodes
    in small cells will transfer directly to porous three-dimensional electrodes —
    develop and validate a dedicated medium-scale deposition setup for the actual
    electrode geometry before relying on coating uniformity for full electrolyser
    performance testing.
