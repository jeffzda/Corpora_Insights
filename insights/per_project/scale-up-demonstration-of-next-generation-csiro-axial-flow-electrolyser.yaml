  source_title: Fortescue - Scale up of Next Gen CSIRO Axial Flow Electrolyser for
    Green Hydrogen - Core research interim report
  publish_date: '2025-07-28'
  project_name: Scale-up and demonstration of next-generation CSIRO axial flow electrolyser
    for green hydrogen production
  what_happened: 'The project adopted a phased CFD modelling approach: early design
    iterations used simplified single-bubble-diameter simulations to enable rapid
    iteration, with plans to incorporate higher-fidelity simulations (bubble size
    distributions, nucleation rates, coalescence, breakup) only after the optimal
    configuration is identified.'
  lesson_learnt: Structure CFD modelling in R&D-stage electrolyser development as
    a phased programme — use simplified models for rapid early-stage design iteration
    to identify promising candidates, then apply computationally intensive high-fidelity
    simulations only to validate the shortlisted design. This approach avoids premature
    investment in complex simulation before the design space is narrowed.
