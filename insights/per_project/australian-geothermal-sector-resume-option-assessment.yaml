- record_id: ARENA-DLV-14982
  source_title: 'Looking Forward: Barriers, Risks and Rewards of the Australian Geothermal
    Sector to 2020 and 2030'
  publish_date: 2014-06
  project_name: Australian Geothermal Sector – Resume Option Assessment
  what_happened: The IGEG assessed the 'Resume' option — continuing existing ARENA
    geothermal funding programs — and concluded it was highly unlikely to move the
    geothermal sector toward commercialisation or cost-competitive energy by 2030,
    as critical barriers (resource characterisation, flow rate improvement, and drilling
    cost reduction) would remain unaddressed.
  lesson_learnt: Continuing existing grant program structures without redesigning
    the underlying funding logic — when those structures have demonstrably not placed
    the sector on a path to commercialisation — is unlikely to produce different outcomes;
    funders should periodically assess whether program design is addressing the actual
    critical barriers rather than simply continuing prior commitments.
