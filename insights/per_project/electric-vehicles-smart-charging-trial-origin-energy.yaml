  project_name: Electric Vehicles Smart Charging Trial (Origin Energy)
  what_happened: Trial participants with rooftop solar panels actively coordinated
    their EV charging during solar production hours (daytime), creating a distinct
    midday charging profile absent in non-solar households.
  lesson_learnt: Design smart charging programs and network tariffs to account for
    the solar-correlated charging behaviour of prosumer EV owners — this cohort will
    self-shift to midday without price incentives, reducing the incremental value
    of solar-soaking programs for this segment but also reducing peak network stress.
