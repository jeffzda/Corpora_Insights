- record_id: ARENA-DLV-27010
  source_title: Insights from Smart Charging Trials Data (Update)
  publish_date: '2023-08-02'
  project_name: Electric Vehicles Smart Charging Trial (Origin Energy)
  what_happened: Origin's trial found that voluntary incentive-based charging (Experiment
    1, 10c/kWh off-peak discount) was effective in shifting EV load to off-peak periods,
    and that adding mandatory controlled charging (Experiment 2) on top of the incentive
    produced limited additional shift — the incentive alone drove most of the behavioural
    change.
  lesson_learnt: Voluntary price incentives can deliver most of the smart charging
    benefit without mandatory control — trials should test the incremental value of
    controlled charging above incentive-only baselines before committing to the complexity
    and customer friction of mandatory control systems.
