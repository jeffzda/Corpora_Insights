  source_title: Insights from Smart Charging Trials Data (Update)
  publish_date: '2023-08-02'
  project_name: Electric Vehicles Smart Charging Trial (Origin Energy)
  what_happened: Origin's fixed incentive trial design, which required ongoing participation
    for customers to receive the reward, showed that incentive-period charging grew
    progressively over the trial, but the fixed daily participation requirement risked
    adverse consequences if scaled to mass-market conditions where not all customers
    would consistently engage.
  lesson_learnt: Fixed participation-based incentives that require customers to actively
    engage each day to receive rewards may not scale safely to mass-market EV programs
    — design incentives that reward outcomes (off-peak charging achieved) rather than
    ongoing daily participation to avoid perverse load effects at scale.
