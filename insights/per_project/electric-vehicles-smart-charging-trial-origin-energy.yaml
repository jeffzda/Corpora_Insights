- record_id: ARENA-DLV-27001
  source_title: Insights from Smart Charging Trials Data (Update)
  publish_date: '2023-08-02'
  project_name: Electric Vehicles Smart Charging Trial (Origin Energy)
  what_happened: Trial participants' unmanaged BEV charging profiles differed substantially
    from AEMO's assumed load profiles — BEV customers typically charged overnight
    and showed flat load between 10am–9pm, with peak load from 11pm–1am, and no observable
    increase during the traditional system peak period of 3–9pm.
  lesson_learnt: Do not rely on AEMO's assumed EV load profiles for network planning
    — real residential BEV charging is more evenly distributed across the day, with
    overnight peaking and no meaningful demand spike during the 3–9pm system peak,
    which has material implications for network investment and tariff design.
