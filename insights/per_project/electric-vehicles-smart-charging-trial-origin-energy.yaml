  source_title: Insights from Smart Charging Trials Data (Update)
  publish_date: '2023-08-02'
  project_name: Electric Vehicles Smart Charging Trial (Origin Energy)
  what_happened: Origin's trial found that having both morning and evening smart charging
    control periods still left customers with sufficient time to charge their EVs
    during network off-peak periods, and morning control did not adversely impact
    evening control compliance.
  lesson_learnt: Dual morning-and-evening smart charging control windows can be implemented
    without degrading customer willingness to participate — customers adapt by shifting
    to overnight charging, and the two control periods operate largely independently
    of each other.
