  source_title: Insights from Smart Charging Trials Data (Update)
  publish_date: '2023-08-02'
  project_name: Electric Vehicles Smart Charging Trial (Origin Energy)
  what_happened: Business customers in Origin's trial were far less responsive to
    voluntary charging incentives than residential customers, and upfront opt-out
    requirements under Experiment 2 contributed to low business customer participation
    in controlled charging.
  lesson_learnt: Smart charging program designs that work well for residential customers
    are unlikely to be directly transferable to business customers — business customers
    require distinct program structures that avoid interrupting workflow, and opt-in
    rather than opt-out defaults may be needed for controlled charging at commercial
    premises.
