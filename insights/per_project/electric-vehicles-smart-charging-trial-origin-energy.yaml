  publish_date: '2023-08-02'
  project_name: Electric Vehicles Smart Charging Trial (Origin Energy)
  what_happened: PHEV owners in Origin's trial were highly responsive to smart charging
    incentives despite typically charging during the evening peak, while BEV charging
    shifted away from overnight but showed limited uptake of midday incentives, suggesting
    possible saturation from solar PV self-consumption.
  lesson_learnt: PHEV and BEV owners respond differently to smart charging incentives
    — PHEVs offer greater peak-shifting flexibility despite default evening charging
    behaviour, while BEV flexibility may already be partially absorbed by solar PV
    self-consumption; program targeting should account for vehicle type and likely
    solar ownership when estimating available flexibility.
