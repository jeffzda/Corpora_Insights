- record_id: ARENA-DLV-50010
  source_title: Ocean Energy Report by Seanergy and Ernst and Young
  publish_date: 2016-06
  project_name: Carnegie Wave Energy CETO 6 — CEFC Debt Finance
  what_happened: Carnegie Wave Energy became the first ocean wave energy company to secure a pure debt finance deal, obtaining a EUR 17.9 m five-year loan facility from the Clean Energy Finance Corporation
    (CEFC) after ARENA grants and equity from shareholders had been secured. The CFO described it as a watershed moment for the company.
  lesson_learnt: For first-of-kind ocean energy technologies, grant and equity funding from public agencies such as ARENA is a prerequisite to unlocking institutional debt finance; developers should sequence
    their funding approach — grants and equity first, then use these to de-risk the project sufficiently for debt providers to participate.
