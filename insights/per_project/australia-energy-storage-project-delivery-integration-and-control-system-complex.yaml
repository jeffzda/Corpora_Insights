- record_id: ARENA-DLV-16273
  source_title: Energy Storage Study
  publish_date: 2015-07
  project_name: 'Australia — Energy Storage Project Delivery: Integration and Control
    System Complexity'
  what_happened: Stakeholder consultation (C36) revealed that previous battery storage
    trial programs in Australia had encountered issues with poor battery performance
    and problems with protection settings. Control systems were also identified as
    complex, expensive, and often requiring bespoke tailoring to individual projects.
  lesson_learnt: Control systems and protection settings must be treated as a primary
    project risk in battery storage deployments — standardising integration design
    and sharing protection-setting learnings across projects reduces the need for
    project-specific bespoke engineering and lowers overall delivery cost and risk.
