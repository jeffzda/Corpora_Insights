  evidence_excerpt: The geothermal industry is relatively new to Australia; only limited
    research has been conducted to date. Several research centres have been established,
    but some have already run their term and others have a short remaining life.
  confidence_note: This is a systemic observation about the sector's research infrastructure
    rather than a single project event, but has clear delivery implications for portfolio-level
    program design.
