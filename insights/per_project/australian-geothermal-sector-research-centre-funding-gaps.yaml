- record_id: ARENA-DLV-72010
  source_title: Australian Energy Resource Assessment — Second Edition, 2014
  publish_date: '2014'
  project_name: Australian Geothermal Sector — Research Centre Funding Gaps
  what_happened: Several Australian geothermal research centres established to support
    the sector had funding terms expire between 2011 and 2014 (Western Australian
    Centre completed 2011; South Australian Centre expired 2013; Queensland Centre
    expiring 2014), creating gaps in the research support infrastructure at a critical
    stage of sector development.
  lesson_learnt: Time-limited research centre funding creates structural discontinuity
    risks in nascent technology sectors — geothermal RD&D programs should plan for
    research continuity beyond initial funding terms, particularly during the demonstration
    phase when technical knowledge is most urgently needed to guide commercial development
    decisions.
