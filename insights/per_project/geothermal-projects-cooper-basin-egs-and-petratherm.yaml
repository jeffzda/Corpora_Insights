- record_id: ARENA-DLV-25906
  source_title: Review of ARENA's Reliability Portfolio
  publish_date: 2020-01
  project_name: Geothermal Projects (Cooper Basin EGS and Petratherm)
  what_happened: Two large-scale geothermal demonstration projects — the Geodynamics
    Cooper Basin Enhanced Geothermal Systems project ($32.75 million) and the Petratherm
    Paralana/sedimentary rock demonstration ($4.2 million) — were terminated by mutual
    agreement after the lack of financial benefit became evident. Key barriers included
    identifying suitable resources, extracting hot fluid at adequate flow rates, and
    the capital and transmission costs associated with remote locations.
  lesson_learnt: Deep geothermal electricity generation faces compounding barriers
    of resource identification, extraction rate and transmission cost from remote
    locations; future geothermal investment should focus on pre-drilling characterisation
    methods rather than jumping to large-scale demonstration before resource viability
    is confirmed.
