  project_name: Port Gregory Microgrid
  what_happened: The grid export limit of 1 MW imposed by the network operator, combined
    with load events and battery state-of-charge constraints, made renewable curtailment
    inevitable for a system capable of generating well in excess of local demand.
    Curtailment optimisation required ongoing algorithm development balancing response
    times, mechanical stress on wind turbines, and system stability.
  lesson_learnt: Export limits imposed by network operators on fringe-of-grid microgrids
    will drive significant renewable curtailment — negotiate export limits as part
    of connection design and develop sophisticated curtailment algorithms that minimise
    mechanical fatigue on wind turbines while maximising generation, ideally with
    per-turbine power setpoint optimisation.
