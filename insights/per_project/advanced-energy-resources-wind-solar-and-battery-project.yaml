  source_title: Advanced Energy Resources Lessons Learnt
  publish_date: 2020-07
  project_name: PGWF Advanced Energy Resources Wind, Solar and Battery Project at
    Port Gregory
  what_happened: Recommissioning 18-year-old refurbished Enercon E40 wind turbines
    imported from Germany proved significantly more complex than anticipated — the
    OEM provided no support, qualified staff were scarce in Australia, parts had been
    discontinued, documentation was incomplete, and each recommissioning step uncovered
    additional faults including moisture in generator windings and failed power electronics.
  lesson_learnt: 'When deploying refurbished wind turbines, plan for substantially
    more time and resource than for new machines — expect zero OEM support, plan to
    develop all recommissioning procedures internally, and budget for iterative fault-finding
    at each step. The process cannot be rushed: a single intermittent contactor fault
    occupied experienced technicians for nearly four days.'
