- record_id: ARENA-DLV-11804
  source_title: Advanced Energy Resources Lessons Learnt
  publish_date: 2020-07
  project_name: PGWF Advanced Energy Resources Wind, Solar and Battery Project at
    Port Gregory
  what_happened: Land-use agreements were not finalised prior to execution of the
    PPA, heightening financier perception of project risk even though they did not
    ultimately cause delays.
  lesson_learnt: Complete land-use negotiations and secure agreements before executing
    the PPA — having unresolved land tenure at PPA execution increases perceived project
    risk for financiers and can cause significant delays if landowner support is not
    secured.
  issue_severity: minor
  project_type: multi-technology/hybrid
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: project developer
  delay_category: stakeholder/land/community
  failure_mode: coordination & stakeholders
  outcome_class: delayed but recoverable
  secondary_failure_mode: null
  intervention_note: AER committed to conducting land-use negotiations prior to PPA
    execution on future projects.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: hybrid systems
  source_pages: &id002
  - 6
  evidence_excerpt: Early consultation and stakeholder engagement are crucial to gain
    the support necessary to acquire land-use agreements. While land-use agreements
    did not contribute to any delays, land-use agreements were not yet finalised prior
    to execution of the projects PPA which heightens a potential financier's perception
    of project risk. In future, AER intends to conduct land-use negotiations prior
    to PPA execution.
  confidence_note: Issue severity rated minor as no actual delay resulted, but the
    financing risk implications warranted capture.
