  source_title: Port Gregory Microgrid Knowledge Sharing Final Report
  publish_date: 2022-08
  project_name: Port Gregory Microgrid
  what_happened: The EPC contractor's BESS was not handed over until the second half
    of 2020, despite the wind and solar farm being practically complete and ready
    to commission in June 2019, causing over 12 months delay to overall commissioning.
  lesson_learnt: Assess the financial strength, resourcing capacity, and communication
    practices of EPC contractors before appointment — non-performance by a key BESS
    EPC contractor was the primary cause of a 6-month commissioning delay. Strengthen
    due diligence processes to include financial capacity checks and require open
    communication protocols in the contract.
