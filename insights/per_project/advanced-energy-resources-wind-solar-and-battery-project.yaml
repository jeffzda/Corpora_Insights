  project_type: multi-technology/hybrid
  project_scale_band: first commercial/FOAK
  lifecycle_phase: commissioning/integration
  proponent_type: project developer
  delay_category: grid connection/system studies
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: coordination & stakeholders
  intervention_note: AER now prepares all necessary documentation internally and plans
    for longer approval timelines in future projects to reduce reliance on EPC contractors
    and network operator responsiveness.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: hybrid systems
  source_pages:
  - 5
  - 18
  evidence_excerpt: Despite the successful commissioning of the Project in July 2020,
    AER is still awaiting 'approval to operate' from the network operator – Western
    Power. This is due to harmonic disturbances outside the designated parameters.
