- record_id: ARENA-DLV-24601
  source_title: Port Gregory Microgrid Knowledge Sharing Final Report
  publish_date: 2022-08
  project_name: Port Gregory Microgrid
  what_happened: Network operator (Western Power) Approval to Operate was delayed
    by 20 months after successful commissioning of the project, resulting in significant
    revenue loss. Reasons included cyclone recovery priorities, network operator being
    understaffed, internal staff changes, lack of documentation from the EPC contractor,
    and regulatory/policy changes in 2022.
  lesson_learnt: Design and test for harmonic compliance against network operator
    thresholds before commissioning — harmonic disturbances are reportedly a common
    cause of post-commissioning approval delays by network operators across Australia,
    and discovering non-compliance after commissioning can leave a project unable
    to operate commercially.
