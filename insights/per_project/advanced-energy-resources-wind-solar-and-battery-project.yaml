    in specific design improvements including optimised BESS inverter/battery layout,
    simplified high-speed communications, improved HV switching flexibility, improved
    remote monitoring redundancy, and a revised control philosophy.
  lesson_learnt: Structured application of lessons from a first-of-kind microgrid
    deployment to the next project is feasible and valuable — document specific design
    deficiencies during construction and operations and translate them into concrete
    design specifications for the follow-on project rather than relying on informal
    knowledge transfer.
