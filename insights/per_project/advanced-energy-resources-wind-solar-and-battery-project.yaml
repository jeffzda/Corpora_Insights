- record_id: ARENA-DLV-24603
  source_title: Port Gregory Microgrid Knowledge Sharing Final Report
  publish_date: 2022-08
  project_name: Port Gregory Microgrid
  what_happened: The EPC contractor delivered a BESS control system with insufficient
    operational visibility, preventing AER from diagnosing or resolving BESS faults.
    Following Tropical Cyclone Seroja, the lack of access to the control system prevented
    charging the battery by alternative means, causing battery damage. BESS availability
    was approximately 60% under the EPC contractor's control system.
  lesson_learnt: Contracts for BESS and microgrid control systems must explicitly
    require full operational visibility and access to control system source code and
    parameters — a control system delivered as a black box prevents fault diagnosis,
    inhibits performance improvement, and can cause physical asset damage during emergency
    events.
  issue_severity: major
  project_type: multi-technology/hybrid
  project_scale_band: first commercial/FOAK
  lifecycle_phase: commissioning/integration
  proponent_type: project developer
  delay_category: commissioning/integration
  failure_mode: unvalidated integration
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: AER's in-house engineering team developed a replacement control
