  what_happened: COVID-19 caused access restrictions to the customer's site, unavailability
    of subcontractors, and regional travel restrictions, compounding existing schedule
    delays during commissioning.
  lesson_learnt: Include robust force majeure provisions and schedule contingency
    in PPAs and sub-contracts to accommodate force majeure events — COVID-19 demonstrated
    that site access, subcontractor availability, and regional travel can all be disrupted
    simultaneously, and contracts without adequate provisions increase counterparty
    risk exposure.
