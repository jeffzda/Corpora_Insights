  what_happened: Renewable energy penetration dropped to 0% for three consecutive
    months (May, June, and August 2021) coinciding with the period following Tropical
    Cyclone Seroja and the contractual dispute with the EPC contractor, when the wind
    farm contributed zero MWh to the system.
