- record_id: ARENA-DLV-24611
  source_title: Port Gregory Microgrid Knowledge Sharing Final Report
  publish_date: 2022-08
  project_name: Port Gregory Microgrid
  what_happened: Using multiple solar string inverters in a fringe-of-grid microgrid
    (12–36 devices for a 1–3 MW system) required complex communications management;
    use of communications gateways to reduce connection points significantly increased
    control response times, creating a trade-off between communications simplicity
    and control speed.
  lesson_learnt: For microgrids requiring high renewable penetration and fast control
    response, design a high-speed distributed communications architecture (preferably
    fibre-optic) with separate farm-level controllers rather than relying on communications
    gateways — aggregation gateways reduce connection complexity but increase response
    latency at the cost of renewable optimisation.
