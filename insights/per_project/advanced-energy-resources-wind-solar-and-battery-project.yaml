  source_title: Advanced Energy Resources Lessons Learnt
  publish_date: 2020-07
  project_name: PGWF Advanced Energy Resources Wind, Solar and Battery Project at
    Port Gregory
  what_happened: The remote project location (110km from Geraldton) severely restricted
    access to labour and materials; the local concrete batching plant lacked capacity
    for foundation pours, requiring on-site concrete batching at significant additional
    cost.
  lesson_learnt: For remote or fringe-of-grid projects, audit the supply capacity
    of local material suppliers before committing to a construction programme — inadequate
    local concrete batching capacity forced on-site batching, adding significant cost
    to the civil construction scope.
