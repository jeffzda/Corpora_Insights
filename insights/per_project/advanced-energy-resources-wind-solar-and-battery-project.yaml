  what_happened: Third-party debt financing was extremely difficult to secure from
    banks, which regarded the back-to-back inverter topology, refurbished wind turbines,
    and non-OEM EPC/O&M arrangements as high-risk, making standard due diligence costs
    commercially unviable for a small project.
  lesson_learnt: Projects combining novel technology, non-standard components (e.g.
    refurbished turbines), and non-OEM service arrangements will face significant
    barriers to bank debt financing — developers should plan alternative financing
    structures (e.g. private consortia, developer-provided debt, specialist international
    investors) from the outset rather than treating bank debt as the default.
