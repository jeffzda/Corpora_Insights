- record_id: ARENA-DLV-56551
  source_title: Enel X - Commercial Refrigeration Flexible Demand Project - Lessons
    Learnt Report 2
  publish_date: null
  project_name: Commercial Refrigeration Flexible Demand Project
  what_happened: Site configurations varied widely across retail refrigeration locations,
    with equipment controllers often located in difficult-to-access positions such
    as rooftops, externally, or at opposite ends of buildings — far from incoming
    electrical supply or metering points. This variability prevented development of
    a single standardised installation solution and increased per-site installation
    costs.
  lesson_learnt: When aggregating small commercial sites for a demand response program,
    assess control infrastructure readiness at the outset and segment participants
    by control maturity; sites with limited infrastructure require individual installation
    works and additional equipment, significantly affecting deployment cost and timeline
    estimates.
