- record_id: ARENA-DLV-4708
  source_title: Enel X - Commercial Refrigeration Flexible Demand - Lessons Learnt
    Report 1
  publish_date: null
  project_name: Commercial Refrigeration Flexible Demand Project
  what_happened: The commercial sector had been slow to adopt flexible demand programs
    despite being well suited to them, due to prohibitive upfront metering and control
    costs, lack of economies of scale relative to larger industrial participants,
    requirements to upgrade and centralise control systems, and absence of prior demonstration
    projects showing operational viability.
  lesson_learnt: 'When targeting small commercial sites for demand response aggregation,
    address the four structural barriers explicitly in program design: upfront cost
    of metering/controls, limited economies of scale, control system upgrade requirements,
    and absence of proof-of-concept — failure to address any one of these is sufficient
    to prevent uptake.'
