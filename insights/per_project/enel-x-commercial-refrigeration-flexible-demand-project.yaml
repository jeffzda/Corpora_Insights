  publish_date: null
  project_name: Commercial Refrigeration Flexible Demand Project
  what_happened: WDRM eligibility was hampered by restrictive criteria, particularly
    for sites where on-site solar generation capacity exceeded approximately 75% of
    regular site electricity demand, causing load variability that failed AEMO's strict
    Probability of Load (PoL) and RRMSE assessments.
  lesson_learnt: Sites with high behind-the-meter solar relative to load should obtain
    export approval from their DNSP before enrolling in WDRM, to avoid revenue being
    limited when flexible demand is activated during periods of solar generation;
    conduct load profile analysis early to confirm eligibility before customer commitment.
