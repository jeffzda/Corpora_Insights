  what_happened: Initial Load Drop Tests at small-capacity retail refrigeration sites
    confirmed that flexible demand activations could be conducted while remaining
    within the operational thermal limits of the refrigeration equipment, demonstrating
    that participation does not compromise food safety or asset integrity.
