  publish_date: null
  project_name: Commercial Refrigeration Flexible Demand Project
  what_happened: Enel X identified that existing commercial-scale (C&I) metering solutions
    were too expensive for small-capacity retail refrigeration sites, creating a barrier
    to participation. A lower-cost metering alternative was found but came with technical
