  evidence_excerpt: The commercial sector has been an early adopter of distributed
    energy resources such as energy efficiency and rooftop solar. Despite this, the
    sector has been slow to embrace flexible demand due to prohibitive costs, relatively
    less economies of scale (compared with the larger industrial sector), the requirement
    to upgrade and centralise control systems and lack of demonstration projects showing
    that participation is possible without compromising operations.
