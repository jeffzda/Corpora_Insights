  publish_date: null
  project_name: Commercial Refrigeration Flexible Demand Project
  what_happened: Customer engagement timelines were longer than anticipated because
    the retail sector had no prior experience with demand response. Each customer
    organisation required its own process of education, solution development, and
    risk management, with differing levels of energy maturity requiring bespoke approaches
    even within a single customer's portfolio.
  lesson_learnt: When deploying demand response in sectors with no prior participation
    history, budget for materially longer customer engagement timelines than anticipated;
    early engagement with the customer's refrigeration and controls contractors and
    a tailored risk matrix addressing store operations, temperature management, and
    installation impacts are essential to advance the program.
