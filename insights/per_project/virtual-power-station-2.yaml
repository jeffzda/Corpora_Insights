- record_id: ARENA-DLV-27510
  source_title: Virtual Power Station 2.0 - Project Results and Lessons Learnt
  publish_date: 2018-01
  project_name: Virtual Power Station 2.0 (VPS2)
  what_happened: VPS2 demonstrated that coordinated control of distributed PV, batteries,
    and loads provides a viable third alternative to network upgrades or PV export
    restrictions, but the commercial viability of the approach could not be established
    because no market mechanism exists for distributed energy resources to provide
    locational distribution network services.
  lesson_learnt: Technical demonstration of a VPS/DER coordination approach alone
    is insufficient to progress to commercial deployment — future pilots should be
    co-designed with a path to commercial viability, including identification of regulatory
    mechanisms or market structures (e.g. Distribution System Operator arrangements
    or demand management incentive schemes) that would allow DERs to be rewarded for
    providing distribution network services.
