- record_id: ARENA-DLV-27507
  source_title: Virtual Power Station 2.0 - Project Results and Lessons Learnt
  publish_date: 2018-01
  project_name: Virtual Power Station 2.0 (VPS2)
  what_happened: Allocating all 53 trial air-conditioners to a single Energex AFLC
    communication channel enabled control of a large aggregate load block but prevented
    individual or sub-group control, limiting the granularity of demand response that
    could be demonstrated in the pilot.
  lesson_learnt: Allocate demand response loads across multiple independent communication
    channels from the outset — a single channel enables coarse aggregate control but
    prevents finer load segmentation; CSIRO modelling demonstrated that three channels
    would deliver up to 94% reduction in PV output fluctuations, comparable to individual
    thermostat control.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: pilot
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: CSIRO conducted simulation studies to model the impact of using
    multiple communication channels, demonstrating that three clusters of 20 air-conditioners
    each on independent channels would achieve 94% reduction in PV output fluctuations.
  transferability: moderate
  delay_magnitude: null
  technology_domain: demand response
  source_pages: &id007
  - 5
  - 6
  - 18
  evidence_excerpt: Having all units on one channel had the advantage of being able
    to control a large block of energy without being interfered by (or interfering
    with) other Energex control signals. On the other hand, allocating all air-conditioners
    to the same channel disables the control of individual air-conditioning loads,
    or even the control of groups smaller than 53.
  confidence_note: null
