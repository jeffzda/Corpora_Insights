- record_id: ARENA-DLV-27504
  source_title: Virtual Power Station 2.0 - Project Results and Lessons Learnt
  publish_date: 2018-01
  project_name: Virtual Power Station 2.0 (VPS2)
  what_happened: In sky-camera demand response tests, DRM commands were activated
    via verbal phone requests from CSIRO in Newcastle to Energex staff in Brisbane,
    who then manually transmitted AFLC signals. This human-in-the-loop communication
    process introduced significant delays between cloud detection and load curtailment,
    reducing the effectiveness of fast demand response.
  lesson_learnt: Automate the communication path between forecasting systems and demand
    response dispatch — manual verbal relay between control centres introduces delays
    that make fast demand response (e.g. cloud-driven PV fluctuation mitigation) ineffective;
    forecasting computers should transmit DRM commands directly without human intermediation.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: pilot
  lifecycle_phase: commissioning/integration
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated integration
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: execution & logistics
  intervention_note: The document identifies direct automated linkage of sky imaging
    feeds to Energex's Load Control System as the required solution for future implementations.
  transferability: moderate
  delay_magnitude: null
  technology_domain: demand response
  source_pages: &id004
  - 10
  evidence_excerpt: Note, however, the delay in the drops in aggregate air conditioning
    load, which should be expected given that the activation of DRMs was by verbal
    request on the phone to Energex staff at the Load Control Centre. Besides the
    impact of a human in the communication loop, there appeared to be intrinsic delays
    in transmitting the AFLC signals through the network and in the air-conditioners
    to respond. This appears as a clear area for improvement in future trials.
  confidence_note: null
