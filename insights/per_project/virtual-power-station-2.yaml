- record_id: ARENA-DLV-27509
  source_title: Virtual Power Station 2.0 - Project Results and Lessons Learnt
  publish_date: 2018-01
  project_name: Virtual Power Station 2.0 (VPS2)
  what_happened: The VPS2 pilot successfully demonstrated full coordination of air-conditioning
    load, PV generation, and battery storage to mitigate network power and voltage
    swings with minimal impact on end-use comfort, using 5-minute-ahead sky imaging
    forecasts. All four planned work streams were delivered and 67 households were
    enrolled, exceeding the 50-household target.
  lesson_learnt: Co-locating a sky imaging solar forecasting system with a VPS pilot
    enables effective 5-minute-ahead cloud event prediction sufficient to pre-emptively
    coordinate air-conditioner loads, PV curtailment and battery dispatch — this integrated
    approach is mature enough for automated implementation linked to a DNSP Load Control
    System.
