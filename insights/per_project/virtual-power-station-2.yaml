- record_id: ARENA-DLV-27501
  source_title: Virtual Power Station 2.0 - Project Results and Lessons Learnt
  publish_date: 2018-01
  project_name: Virtual Power Station 2.0 (VPS2)
  what_happened: During Yarrabilba trials, some air-conditioning units responded to
    DRM3 commands (75% rated power) as if they were DRM1 commands (compressor off),
    due to an ambiguous wiring diagram in the installation manual. This resulted in
    spurious demand response test results.
  lesson_learnt: Verify air-conditioner wiring and DRM implementation against the
    correct standard version before relying on demand response functionality — ambiguous
    installation manual wiring diagrams can cause units to respond to DRM3 as DRM1,
    invalidating trial results and undermining grid control reliability.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: pilot
  lifecycle_phase: commissioning/integration
  proponent_type: research organisation/university
  delay_category: data/validation/testing
  failure_mode: unvalidated integration
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: execution & logistics
  intervention_note: The wiring fault was identified, brought to the attention of
    Energex, and the wiring was fixed to restore correct DRM response behaviour.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: demand response
  source_pages: &id001
  - 8
  - 16
  evidence_excerpt: One significantly interesting result was the disparity in response
    to demand response modes by specific air-conditioner models. In some cases, the
    air-conditioner responded to a DRM3 (75% rated power) as if it was a DRM1 (compressor
    off- that is, don't heat or cool). The cause of the problem appears to be an ambiguous
    wiring diagram in the installation manual.
  confidence_note: lifecycle_phase assigned as commissioning/integration as the fault
