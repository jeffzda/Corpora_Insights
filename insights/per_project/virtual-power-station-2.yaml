  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Default ramp rates were reset from 16% capacity per minute to
    10% capacity per second in SMA inverters prior to the November 2017 combined control
    tests, enabling fast responses required for cloud-event mitigation.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
