  secondary_failure_mode: poor scoping
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: demand response
  source_pages: &id005
  - 10
  - 11
  evidence_excerpt: It is also observed that the 15-minute randomised release period
    programmed in the DREDs following the release of DRMs, while convenient in slow
    demand response applications (such as peak demand shaving) to prevent undesired
    surges in demand following a prolonged period of air conditioning curtailment,
    is an obstacle to fast demand response applications (such as load balancing of
    PV fluctuations).
