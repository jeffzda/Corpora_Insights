- record_id: ARENA-DLV-27502
  source_title: Virtual Power Station 2.0 - Project Results and Lessons Learnt
  publish_date: 2018-01
  project_name: Virtual Power Station 2.0 (VPS2)
  what_happened: Air-conditioners installed in Yarrabilba households built after 2015
    did not consistently respond to DRM2 and DRM3 commands in accordance with the
    2014 version of AS/NZS 4755, indicating that at least some manufacturers implemented
    the 2012 version's behaviour — or failed to implement the updated standard at
    all.
  lesson_learnt: Do not assume that air-conditioners installed after a standard update
    comply with the updated version — confirm the specific standard version implemented
    by each manufacturer before designing demand response trials, as non-mandatory
    DRM modes (DRM2 and DRM3) may not be implemented or may follow superseded definitions.
