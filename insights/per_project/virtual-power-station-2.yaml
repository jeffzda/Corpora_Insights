- record_id: ARENA-DLV-27505
  source_title: Virtual Power Station 2.0 - Project Results and Lessons Learnt
  publish_date: 2018-01
  project_name: Virtual Power Station 2.0 (VPS2)
  what_happened: Energex pre-programmed a 15-minute randomised release period into
    the DREDs following each DRM release. While appropriate for slow demand response
    applications (peak demand shaving), this pre-programmed delay prevented the system
    from being used effectively for fast demand response applications such as mitigating
    PV generation fluctuations caused by passing clouds.
  lesson_learnt: Configure DRED release parameters to match the target demand response
    application — the 15-minute randomised release period suited for peak demand shaving
    is an obstacle to fast cloud-following PV fluctuation mitigation; fast DR applications
    require configurable or minimal release delays.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: pilot
  lifecycle_phase: commissioning/integration
  proponent_type: research organisation/university
  delay_category: null
