  project_name: Virtual Power Station 2.0 (VPS2)
  what_happened: Battery energy storage systems experienced minor issues around charge
    cycles after initial setup, principally related to time zone settings that determined
    when the batteries charged on off-peak power in the absence of solar generation.
    The issues were resolved in a timely manner without materially affecting the trial.
  lesson_learnt: Verify time zone configuration of battery management systems during
    commissioning — incorrect time zone settings can disrupt off-peak charging schedules
    and may not be immediately apparent, particularly when solar availability masks
    the issue during daytime operation.
