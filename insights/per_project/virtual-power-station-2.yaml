- record_id: ARENA-DLV-27506
  source_title: Virtual Power Station 2.0 - Project Results and Lessons Learnt
  publish_date: 2018-01
  project_name: Virtual Power Station 2.0 (VPS2)
  what_happened: SMA PV inverters were found to have a default power ramp rate of
    16% of rated capacity per minute, which was discovered only during on-site testing.
    This rate was too slow for fast demand response applications requiring rapid reductions
    in PV output to mitigate cloud-driven fluctuations.
  lesson_learnt: Check and reconfigure default inverter ramp rates before field trials
    requiring fast response — the SMA default of 16% per minute is adequate for slow
    applications but must be reset (e.g. to 10% per second) for fast demand response
    or cloud-following PV control.
  issue_severity: minor
  project_type: DER/customer-side
  project_scale_band: pilot
