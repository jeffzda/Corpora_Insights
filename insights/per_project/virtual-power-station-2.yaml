- record_id: ARENA-DLV-27503
  source_title: Virtual Power Station 2.0 - Project Results and Lessons Learnt
  publish_date: 2018-01
  project_name: Virtual Power Station 2.0 (VPS2)
  what_happened: Oversized air-conditioning units (e.g. 12kW units in homes requiring
    only 5kW) do not respond to DRM2 or DRM3 commands under the 2012 version of AS/NZS
    4755 because their actual load never exceeds the 50% or 75% rated capacity threshold
    required to trigger a response, effectively making demand response unavailable
    for a significant portion of the installed base.
  lesson_learnt: Account for air-conditioner sizing relative to actual load when designing
    demand response programmes — units significantly oversized for their application
    will not respond to DRM2/DRM3 under the 2012 standard, materially reducing the
    controllable load pool and programme effectiveness.
