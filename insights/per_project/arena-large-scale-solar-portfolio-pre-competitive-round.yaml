- record_id: ARENA-DLV-33657
  source_title: Large Scale Solar Portfolio Evaluation
  publish_date: '2019-12-20'
  project_name: ARENA Large-Scale Solar portfolio (pre-Competitive Round)
  what_happened: NSP personnel were often unavailable during commissioning and testing
    because they were simultaneously needed on other projects in remote locations,
    causing proponents to wait weeks for commissioning activities to proceed. Limited
    NSP experience with solar commissioning (which is modular and involves different
    control requirements to conventional generation) compounded delays.
  lesson_learnt: Establish NSP availability and testing timeframes in the commissioning
    plan before mobilising to site — NSP resourcing constraints caused multi-week
    commissioning delays across multiple projects and must be locked in early, particularly
    for remote-location projects.
  issue_severity: moderate
  project_type: generation
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: commissioning/integration
  proponent_type: project developer
  delay_category: commissioning/integration
  failure_mode: coordination & stakeholders
  outcome_class: delayed but recoverable
  secondary_failure_mode: unvalidated integration
  intervention_note: Projects that proactively established timeframes in commissioning
    plans and testing procedures with the NSP mitigated delays from limited NSP availability.
  transferability: broad
  delay_magnitude: 1-3 months
  technology_domain: solar PV
  source_pages: &id004
  - 41
  evidence_excerpt: 'Active engagement with NSP, establishing timeframes in the commissioning
    plan and testing procedures with NSP is recommended to mitigate time delay due
    to: limited availability of NSP personnel; and lack of experience with solar between
    parties, which is different to other forms of technology as commissioning is modular
    and control requirements are different given the variable output.'
  confidence_note: 'project_scale_band reconciled to ''programmatic/portfolio-level''
    from: programmatic/portfolio-level (19/40), utility/large-scale (14/40), first
    commercial/FOAK (7/40)'
