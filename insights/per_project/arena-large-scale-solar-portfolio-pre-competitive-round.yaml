- record_id: ARENA-DLV-33690
  source_title: Large Scale Solar Portfolio Evaluation
  publish_date: '2019-12-20'
  project_name: ARENA Large-Scale Solar portfolio (pre-Competitive Round)
  what_happened: Coordination and early planning with NSPs was identified as critical
    to smooth SCADA and communications commissioning across early large-scale solar
    projects. Lack of standardised requirements for meteorological data and plant
    output created inconsistency in commissioning processes between projects.
  lesson_learnt: Engage NSPs early on SCADA and communications design and advocate
    for AEMO to develop standardised guidelines for solar power plant control requirements
    — absence of a standard equivalent to guidelines for semi-scheduled generators
    forces each project to reinvent the wheel and creates unnecessary commissioning
    variation and risk.
