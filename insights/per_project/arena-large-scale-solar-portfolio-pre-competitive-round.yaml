- record_id: ARENA-DLV-33676
  source_title: Large Scale Solar Portfolio Evaluation
  publish_date: '2019-12-20'
  project_name: ARENA Large-Scale Solar portfolio (pre-Competitive Round)
  what_happened: Prior to the AGL Solar Project and Moree Solar Farm reaching commercial
    operations in early 2016, Australian commercial banks had no prior experience
    financing utility-scale solar and would not provide debt. ARENA funding bridged
    the initial gap, and the transparent commercial and financing structures of those
    projects gave banks the period of time needed to develop the experience and confidence
    to finance subsequent projects without government support.
  lesson_learnt: In nascent generation technology markets, grant funding that is structured
    transparently — with commercially acceptable terms and non-discretionary drawdown
    conditions — acts as a catalyst for commercial bank entry, creating a self-sustaining
    financing market for subsequent projects that do not require grant support.
