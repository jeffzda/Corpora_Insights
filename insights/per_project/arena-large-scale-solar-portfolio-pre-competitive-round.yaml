  source_title: Large Scale Solar Portfolio Evaluation
  publish_date: '2019-12-20'
  project_name: ARENA Large-Scale Solar portfolio (pre-Competitive Round)
  what_happened: Harmonic current distortion — which can be amplified in rural network
    environments — was not assessed adequately at design stage for some early projects,
    creating NSP compliance issues that required redesign.
  lesson_learnt: Establish early in design that harmonic current distortion does not
    exceed NSP requirements through adequate solar farm design — in rural/fringe-of-grid
    locations harmonic amplification is a material risk and must be addressed before
    detailed design is finalised.
