- record_id: ARENA-DLV-33682
  source_title: Large Scale Solar Portfolio Evaluation
  publish_date: '2019-12-20'
  project_name: ARENA Large-Scale Solar portfolio (pre-Competitive Round)
  what_happened: Reductions in MLFs of over 10% in three years (2015–2018) were common
    for solar farms in fringe-of-grid regions due to the rapid influx of large-scale
    solar, directly reducing project revenues beyond initial forecasts.
  lesson_learnt: Assess fringe-of-grid MLF risk dynamically and conservatively when
    sizing and siting solar projects — rapid capacity additions from other generators
    in the same grid region can cause MLF reductions exceeding 10% within three years,
    materially reducing revenue and eroding project economics.
