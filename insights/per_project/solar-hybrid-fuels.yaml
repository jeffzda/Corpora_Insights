    steam methane reforming, raising the question of whether a partial-reduction technology
    can access the same policy support mechanisms as zero-emission alternatives.
  lesson_learnt: Technology developers pursuing partial-decarbonisation pathways should
    explicitly model emissions intensity relative to policy thresholds before committing
    to commercial development; a 30% reduction may qualify for some support schemes
    but not others, and regulatory fragmentation between high-emission and zero-emission
    support schemes can strand partially-decarbonised technologies in a policy gap.
