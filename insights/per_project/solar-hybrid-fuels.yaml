- record_id: ARENA-DLV-19655
  source_title: Concentrating Solar Fuels Roadmap Final Report
  publish_date: 2016-01
  project_name: Concentrating Solar Fuels Roadmap (ARENA Project Solar Hybrid Fuels
    3-A018)
  what_happened: Conventional Fischer–Tropsch (GTL) fuel synthesis technology was
    found to be fundamentally mismatched to solar syngas supply because it requires
    continuous operation at stable feed conditions; adapting it to solar variability
    required turning down to 25% of design capacity and adding 19 hours of syngas
    storage, substantially increasing capital cost and levelised cost of fuel.
  lesson_learnt: When coupling variable renewable energy sources to downstream chemical
    synthesis, the variability profile must be a primary design input for the synthesis
    plant, not an afterthought — F-T plants designed for continuous large-scale fossil
    feedstock operation cannot be straightforwardly adapted to solar, and microchannel
    or modular reactor architectures should be evaluated from the outset.
  issue_severity: major
  project_type: industrial decarbonisation
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: The roadmap identifies microchannel Fischer–Tropsch reactors
    as potentially capable of achieving the required turndown ratio and recommends
    their development as a priority alongside cost-effective syngas storage solutions.
  transferability: moderate
  delay_magnitude: null
  technology_domain: hydrogen
  source_pages: &id004
  - 95
  - 111
  evidence_excerpt: Conventional GTL processes run continuously on very stable syngas
    supplies, at very large scale. This technology is ill-suited to adapt to the variability
    likely to be inherent in a solar syngas... a significant reduction in feed rate
    (to 25% of design capacity) and the addition of substantial amounts of syngas
    storage (19 hours) was needed to adapt to seasonal variability.
