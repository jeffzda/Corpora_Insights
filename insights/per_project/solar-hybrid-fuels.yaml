    with key unsolved challenges in materials handling — specifically feeding solids
    or slurries into the gasification zone and removing ash and unconverted carbon
    — preventing scale-up despite their low feedstock cost advantage.
  lesson_learnt: Solids-handling in solar gasification represents a critical engineering
    bottleneck that must be resolved at pilot scale before demonstration-scale investment
    is warranted; project proponents should not advance gasification-based CSF projects
    to commercial scale until robust solutions for slurry feeding, bed material handling,
    and ash removal have been demonstrated at sustained on-sun operation.
