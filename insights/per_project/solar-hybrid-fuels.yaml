  project_name: Concentrating Solar Fuels Roadmap (ARENA Project Solar Hybrid Fuels
    3-A018)
  what_happened: The Fitzroy region of Queensland was identified as having over 5,250
    kt/year of available lignocellulosic biomass and high DNI, sufficient to support
    at least 131 solar hybrid BTL conversion facilities producing 1.3 GL/year of hydrocarbon
    fuels — yet no such industry existed, indicating that resource co-location alone
    does not create a commercial outcome without enabling infrastructure and policy.
  lesson_learnt: Regions with co-located high-quality solar resources and low-cost
    biomass feedstock represent priority candidates for first-commercial CSF projects;
    however, proponents should conduct early feasibility on enabling infrastructure
    (port access, gas supply, workforce) in parallel with resource assessment, as
    Gladstone's port and industrial infrastructure was identified as decisive in making
    the region commercially viable.
