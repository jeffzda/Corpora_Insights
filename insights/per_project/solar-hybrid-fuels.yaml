- record_id: ARENA-DLV-19657
  source_title: Concentrating Solar Fuels Roadmap Final Report
  publish_date: 2016-01
  project_name: Concentrating Solar Fuels Roadmap (ARENA Project Solar Hybrid Fuels
    3-A018)
  what_happened: Highly variable oil prices (ranging from under $60/bbl to over $100/bbl
    within the project period) made it difficult for CSF investors to commit capital,
    because the expected revenue stream was insufficiently certain even when production
    costs were projected to be competitive over the long run.
  lesson_learnt: Projects commercialising renewable fuels should not be designed to
    compete directly with volatile spot oil prices; instead, targeting commodity markets
    with more stable price signals (e.g. ammonia, methanol) or securing off-take agreements
    with industrial buyers insulates projects from crude oil volatility and improves
    financibility.
  issue_severity: major
  project_type: industrial decarbonisation
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: financing/commercial close
  failure_mode: commercial & market
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The roadmap recommends targeting products (ammonia, methanol)
    that have existing commodity markets and more stable price trajectories relative
    to crude oil, and advocates for government contract-for-difference mechanisms
    to provide revenue certainty for early-stage CSF plants.
  transferability: broad
  delay_magnitude: null
  technology_domain: hydrogen
