- record_id: ARENA-DLV-33403
  source_title: '3-A018 Solar Hybrid Fuels (Stream 2) - Summary report: project results
    and lessons learnt'
  publish_date: 2016-05
  project_name: Solar Hybrid Fuels (Stream 2) - Concentrated Solar Fuels Roadmap
  what_happened: The roadmap study found that commercial-scale financing for concentrated
    solar fuels projects will only be available after sustained pilot and pre-commercial
    demonstration at essentially the same engineering scale as the eventual commercial
    plant, requiring continuous operation over 5–10 years.
  lesson_learnt: Project pipelines for novel solar fuel technologies should plan for
    5–10 years of sustained pre-commercial demonstration investment before bankability
    is achievable — staging plans that assume faster pathways to commercial finance
    are likely to be over-optimistic.
