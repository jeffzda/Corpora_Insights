  what_happened: The addition of battery storage to PV-electrolysis hydrogen production
    was found to increase hydrogen cost in all scenarios relative to the no-storage
    base case; even though storage improved electrolyser utilisation, current battery
    costs ($540/kWh in 2015) made any amount of Li-ion storage counterproductive to
    the overall system LCOH.
  lesson_learnt: Adding storage to increase electrolyser utilisation in PV-hydrogen
    systems is not inherently cost-beneficial; system designers should conduct sensitivity
    analysis on storage size before assuming that higher capacity factors will reduce
    LCOH — at current and near-term battery costs, intermittent operation without
    storage produces lower LCOH than storage-enabled continuous operation.
