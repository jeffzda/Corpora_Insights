  what_happened: The case study financial analysis for a 50 MWth solar steam methane
    reforming facility in Gladstone found that under the base case scenario all four
    fuel products (liquid hydrogen, ammonia, diesel, methanol) returned positive equity
    internal rates of return (1.2–4.0%) but negative equity net present values (–$34M
    to –$117M), meaning investors would receive a return but below the 8.8% equity
    cost threshold, without any subsidy.
  lesson_learnt: First-commercial CSF plants are unlikely to attract purely private
    investment at standard equity return thresholds without subsidy or concessional
    finance; project developers should engage CEFC-style low-cost finance and government
    grant co-funding from the outset and explicitly model the subsidy quantum needed
    to bridge the return gap in business cases presented to ARENA.
