- record_id: ARENA-DLV-19663
  source_title: Concentrating Solar Fuels Roadmap Final Report
  publish_date: 2016-01
  project_name: Concentrating Solar Fuels Roadmap (ARENA Project Solar Hybrid Fuels
    3-A018)
  what_happened: The techno-economic screening of 85 solar process combinations found
    that the key driver differentiating cost effectiveness between options was not
    capital cost per se but solar-to-chemical conversion efficiency, which was strongly
    determined by operating temperature, excess mass flows, incomplete conversion,
    and quality of heat recuperation — efficiency ranged from ~30% to ~70% across
    options.
  lesson_learnt: For solar thermochemical fuel projects, efficiency improvement investments
    (particularly in recuperation heat exchangers and minimising inert mass flows
    through the reactor) deliver greater cost reduction than equivalent capital cost
    reductions; R&D and engineering effort should prioritise thermal recuperation
    and reactor operating temperature as primary levers on LCOF.
