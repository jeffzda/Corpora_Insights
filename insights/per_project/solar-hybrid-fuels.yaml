  source_title: Concentrating Solar Fuels Roadmap Final Report
  publish_date: 2016-01
  project_name: Concentrating Solar Fuels Roadmap (ARENA Project Solar Hybrid Fuels
    3-A018)
  what_happened: Solar steam methane reforming (the most technically mature CSF technology
    at TRL 6) still required long-term operational experience before it could be considered
    bankable by investors, constituting a non-technical barrier even after successful
    pilot-scale demonstration at 600 kWth with hundreds of hours on-sun.
  lesson_learnt: Technical demonstration alone is insufficient for bankability; projects
    advancing from pilot to commercial scale must plan for extended demonstration-scale
    operation specifically to accumulate the operational track record that financiers
    require — this needs dedicated budget and timeline allocation beyond the initial
    construction phase.
