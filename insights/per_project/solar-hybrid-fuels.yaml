  what_happened: The non-volatile metal oxide (ceria) redox cycle achieved TRL 3–5
    with promising theoretical efficiency above 40%, but actual system efficiencies
    remained well below 10% due to low reversible oxygen storage capacity, high inert
    material loads, and unsolved heat recuperation challenges between the high-temperature
    reduction step and the lower-temperature oxidation step.
  lesson_learnt: The gap between theoretical and achieved system efficiency is particularly
    large for cyclic thermochemical processes; project developers evaluating redox-cycle
    technologies should base investment decisions on demonstrated system-level efficiency
    with full recuperation, not on theoretical or reactor-only efficiency figures,
    as the integration losses frequently dominate the energy balance.
