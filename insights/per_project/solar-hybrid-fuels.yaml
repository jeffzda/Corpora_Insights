- record_id: ARENA-DLV-19656
  source_title: Concentrating Solar Fuels Roadmap Final Report
  publish_date: 2016-01
  project_name: Concentrating Solar Fuels Roadmap (ARENA Project Solar Hybrid Fuels
    3-A018)
  what_happened: The absence of Australian CSP deployment meant that heliostat and
    solar field supply chains were not established domestically, preventing cost reduction
    through learning-by-doing and leaving CSF technology dependent on internationally
    mature but still expensive components, raising the LCOF above competitive thresholds.
  lesson_learnt: A domestic pipeline of CSP deployment is a prerequisite for a future
    CSF industry — without it, Australian-specific implementation costs remain elevated
    and supply chains for solar concentrator components cannot be de-risked; ARENA
    and government should support early CSP deployment explicitly as infrastructure
    investment for future solar fuels.
