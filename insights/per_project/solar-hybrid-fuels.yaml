- record_id: ARENA-DLV-33401
  source_title: '3-A018 Solar Hybrid Fuels (Stream 2) - Summary report: project results
    and lessons learnt'
  publish_date: 2016-05
  project_name: Solar Hybrid Fuels (Stream 2) - Concentrated Solar Fuels Roadmap
  what_happened: Stakeholder workshops revealed that the project team (primarily engineers
    and scientists) had focused on technical risk, but industry participants emphasised
    that non-technical externalities — carbon pricing, environmental credentials,
    incentives, mandates, and public perception — were equally or more important barriers
    to investment than technical risk.
  lesson_learnt: When developing technology roadmaps or seeking industry investment,
    address non-technical risks (policy, market, social licence) explicitly and with
    the same rigour as technical risks — industry is highly risk averse and will not
    invest without clear drivers across all risk dimensions.
