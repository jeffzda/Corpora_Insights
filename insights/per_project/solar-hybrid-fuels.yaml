  source_title: Concentrating Solar Fuels Roadmap Final Report
  publish_date: 2016-01
  project_name: Concentrating Solar Fuels Roadmap (ARENA Project Solar Hybrid Fuels
    3-A018)
  what_happened: The IEA CSP roadmap and broader CST sector experience showed that
    the industry's greatest value proposition — thermally based energy storage enabling
    dispatchable generation — was not being effectively communicated to key government
    and market stakeholders, threatening continued policy support despite strong deployment
    growth.
  lesson_learnt: Technology industries dependent on government policy support must
    invest continuously in stakeholder education about the specific value proposition
    of their technology (e.g. dispatchability for CSP, fuel density for CSF) rather
    than assuming decision-makers understand it; failure to communicate differentiated
    value risks policy support being withdrawn or redirected to lower-cost but less
    capable alternatives.
