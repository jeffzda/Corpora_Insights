  what_happened: The Australian Liquid Fuels Technology Assessment used a 12.2% weighted
    average cost of capital for emerging technologies, substantially above the 6.4%
    used in this roadmap and recent CO2CRC studies; this assumption difference alone
    was sufficient to make CSF appear uncompetitive in that earlier assessment, illustrating
    how financing cost assumptions can determine apparent technology viability.
  lesson_learnt: Technology cost assessments for emerging energy technologies are
    highly sensitive to discount rate and WACC assumptions; comparing LCOF or LCOE
    results across studies requires explicit reconciliation of financing assumptions,
    and project proponents should model multiple discount rate scenarios to understand
    at what financing cost their technology becomes investable.
