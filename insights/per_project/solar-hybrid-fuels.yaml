  what_happened: Direct methane cracking remained at laboratory scale (1–10 kWth)
    due to control of unwanted polycyclic aromatic hydrocarbon (PAH) by-products —
    carcinogenic and mutagenic compounds — and challenges with high-temperature thermal
    cycling and carbon removal from reactor surfaces; scale-up was assessed as unlikely
    without a fundamental breakthrough.
