  source_title: Concentrating Solar Fuels Roadmap Final Report
  publish_date: 2016-01
  project_name: Concentrating Solar Fuels Roadmap (ARENA Project Solar Hybrid Fuels
    3-A018)
  what_happened: R&D funding agencies repeatedly scoped out the final fuel synthesis
    step from pilot and demonstration projects to reduce budgets, resulting in demonstrations
    that could not show the full production chain and thereby limiting investor confidence,
    public understanding, and policy engagement.
  lesson_learnt: RD&D funders should resist pressure to scope out the final fuel synthesis
    step; including a complete sun-to-fuel demonstration in a single project maximises
    bankability evidence, investor confidence, community acceptance, and political
    visibility — the incremental cost is justified by the disproportionate value for
    technology uptake.
