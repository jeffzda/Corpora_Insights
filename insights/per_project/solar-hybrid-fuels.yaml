  what_happened: The deployment trajectory for CSP in Australia was assessed as negligible
    at the time of the roadmap (approximately 140 MWth installed by end of 2016),
    whereas global CSP had sustained 30–40% compound annual growth for years; the
    gap between Australian and global deployment meant Australia was not capturing
    learning-curve cost reductions and was not building the supply chain needed for
    a future CSF industry.
  lesson_learnt: Technology deployment policy must be viewed as a long-term supply
    chain investment, not just an energy production measure; a country that delays
    domestic deployment of a technology misses learning-curve cost reductions and
    must eventually pay a capability premium when it does deploy — for CSF, every
    year of CSP deployment deferral extends the cost gap that must be closed before
    CSF is competitive.
