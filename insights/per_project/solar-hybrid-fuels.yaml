  what_happened: The state-based biofuels mandate framework in Australia (with New
    South Wales and Queensland having or considering individual mandates) was identified
    as a fragmented policy architecture that created inconsistent market signals across
    jurisdictions and could not be straightforwardly extended to cover all renewable
    fuel types including CSF.
  lesson_learnt: A national technology-neutral Renewable Fuels Target (analogous to
    the Renewable Energy Target) would provide more consistent and extensible market
    signals for renewable fuel investment than state-by-state biofuel mandates; project
    proponents should advocate for national frameworks in pre-investment policy engagement
    rather than designing projects around individual state mandates that may change
    independently.
