  source_title: Concentrating Solar Fuels Roadmap Final Report
  publish_date: 2016-01
  project_name: Concentrating Solar Fuels Roadmap (ARENA Project Solar Hybrid Fuels
    3-A018)
  what_happened: Pilot and demonstration systems for CSF technologies frequently ran
    out of operating resources after construction, because initial budget and schedule
    overruns consumed contingency, leaving insufficient funds for the extended operation
    needed to extract maximum learning value.
  lesson_learnt: Demonstration project budgets must explicitly include multi-year
    operating costs after construction; ideally, demonstration systems should be sized
    large enough to generate revenue from saleable end-products sufficient to cover
    ongoing O&M, thereby sustaining operation without additional grant funding.
