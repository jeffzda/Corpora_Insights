- record_id: ARENA-DLV-19651
  source_title: Concentrating Solar Fuels Roadmap Final Report
  publish_date: 2016-01
  project_name: Concentrating Solar Fuels Roadmap (ARENA Project Solar Hybrid Fuels
    3-A018)
  what_happened: The project's initial scope focused on concentrating solar thermal
    technologies with limited market analysis. As the project progressed, the oil
    price dropped unexpectedly from over $100/bbl, significantly altering the market
    context and requiring additional activities including domestic and export market
    assessments and a companion study on hydrogen from PV and electrolysis.
  lesson_learnt: Roadmap projects for emerging energy technologies should build in
    explicit scope for market analysis from the outset and anticipate commodity price
    volatility; relying on a single price scenario at project initiation risks the
    entire commercial case becoming misaligned with market conditions before the roadmap
    is complete.
