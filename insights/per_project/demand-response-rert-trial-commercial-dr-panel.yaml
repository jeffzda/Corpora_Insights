- record_id: ARENA-DLV-45520
  source_title: ARENA Insights Forum Presentation Summaries & Key Points – DER Stream
  publish_date: 2019-06
  project_name: Demand Response RERT Trial – Commercial DR Panel
  what_happened: The commercial DR panel found that distribution networks are currently
    limited to charging customers for load and not export, preventing networks from
    capturing the full value of DR participation and requiring significant regulatory
    change to unlock network benefits.
  lesson_learnt: Anticipate regulatory constraints on network DR value capture — current
    rules limiting network charges to load (not export) mean that network DR business
    cases are structurally incomplete until regulatory reform occurs; do not rely
    on network DR revenue streams without confirming the regulatory framework supports
    them.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: government/public-sector body
  delay_category: null
  failure_mode: regulatory & approvals
  outcome_class: policy/market influence only
  secondary_failure_mode: commercial & market
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: demand response
  source_pages: &id002
  - 6
  evidence_excerpt: DR can deliver value for networks service providers – the most
    obvious being increased capacity – however, as networks are currently limited
    to charging customers for load (and not export), significant regulatory changes
    are needed to unlock the value for networks.
