- record_id: ARENA-DLV-45521
  source_title: ARENA Insights Forum Presentation Summaries & Key Points – DER Stream
  publish_date: 2019-06
  project_name: Demand Response RERT Trial – Commercial DR Panel
  what_happened: Voltage reduction trials presented at the commercial DR panel identified
    that permanently and uniformly reducing network voltage creates new operational
    problems, including increased current and areas falling outside operational envelopes,
    making it unsuitable as a permanent DR measure.
  lesson_learnt: Design voltage reduction DR as an intermittent and situational tool
    only — permanent uniform voltage reduction across a network introduces new technical
    risks including increased current and out-of-envelope voltage conditions that
    can damage network assets and undermine reliability.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: government/public-sector body
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: Trial outcomes informed the recommendation to limit voltage reduction
    to intermittent and situational applications.
  transferability: moderate
  delay_magnitude: null
  technology_domain: grid/system stability
  source_pages: &id003
  - 6
  evidence_excerpt: Voltage reduction trials are best suited for intermittent and
    situational use, as permanently and equally reducing the voltage across the network
    can create new difficulties, such as increased current that impacts network assets
    and areas falling below the operational envelopes.
