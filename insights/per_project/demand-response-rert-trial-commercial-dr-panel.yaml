- record_id: ARENA-DLV-45519
  source_title: ARENA Insights Forum Presentation Summaries & Key Points – DER Stream
  publish_date: 2019-06
  project_name: Demand Response RERT Trial – Commercial DR Panel
  what_happened: The commercial DR panel identified that a common disconnect between
    executive-level and operations-level incentives within C&I businesses caused DR
    participation commitments made at senior level to fail at the operational level.
  lesson_learnt: Secure buy-in along the full management chain — from CFO through
    procurement and sales to on-site operations managers — before finalising C&I DR
    participation agreements; executive commitment without operational alignment consistently
    leads to failed activations.
