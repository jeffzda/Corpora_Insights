- record_id: ARENA-DLV-54053
  source_title: UNSW - Daytime Inspection Solutions for Advanced Operation and Maintenance
    of Solar Farms - R&D Interim Report
  publish_date: '2024'
  project_name: Daytime Inspection Solutions for Advanced Operation and Maintenance
    of Solar Farms
  what_happened: Drone operation emerged as a significant new technical and regulatory
    challenge for the UNSW team, whose core expertise was in luminescence measurement.
    Staff required substantial training to understand drone hardware, software, and
    CASA regulatory requirements, and two team members obtained Remote Pilot Licences
    (RePL) during the project.
  lesson_learnt: When integrating drone-based deployment into a sensor/imaging R&D
    project, treat drone technology and aviation regulatory compliance as a distinct
    workstream requiring dedicated upskilling — underestimating this domain can constrain
    field trial timelines. Ensure at least two licensed RePL operators are on staff
    before scheduling drone field work.
