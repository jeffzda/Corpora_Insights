  - 9
  evidence_excerpt: The quantitative analysis of DPL images in the context of module
    degradation, as described above, emerged during the project as an extremely powerful
    and highly relevant practical application. The further development of this project
    aspect will be of high priority in the project going forward. As a result, specific
    technical milestones were added to the programme, to reflect the importance of
    this technical aspect.
