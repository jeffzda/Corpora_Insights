  evidence_excerpt: Drone technology and regulatory hurdles associated with drone
    operation, on the other hand, are relatively new territory for our technical staff.
    Over the course of the first half of the project we have made substantial progress
    in this space. Two of our staff members have undergone the relevant training,
    and are now approved drone operators, holding a remote pilot licence (RePL) accredited
    by Australia's Civil Aviation Safety Authority (CASA).
