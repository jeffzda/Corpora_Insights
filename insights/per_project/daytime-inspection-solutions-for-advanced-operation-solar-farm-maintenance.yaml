  what_happened: Image registration algorithms were developed and demonstrated to
    correct severe artefacts caused by camera shake during drone-based DPL image acquisition.
    Without registration, raw images were unusable for defect detection; with registration,
    microcracks of centimetre scale were clearly identifiable.
  lesson_learnt: For airborne or handheld imaging systems susceptible to vibration,
    invest in image registration as a core software component alongside hardware development
    — camera shake rendered raw DPL images unfit for defect detection, and registration
    was the enabling technology for achieving centimetre-scale defect resolution in
    field conditions.
