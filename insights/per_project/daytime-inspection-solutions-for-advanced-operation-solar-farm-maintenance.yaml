- record_id: ARENA-DLV-54052
  source_title: UNSW - Daytime Inspection Solutions for Advanced Operation and Maintenance
    of Solar Farms - R&D Interim Report
  publish_date: '2024'
  project_name: Daytime Inspection Solutions for Advanced Operation and Maintenance
    of Solar Farms
  what_happened: UV fluorescence imaging, which had been included in the original
    project proposal as a daytime inspection capability, was de-emphasised during
    the project because rapid industry adoption of glass-glass modules rendered UV
    fluorescence of limited value. Associated milestones were replaced with degradation-focused
    milestones.
  lesson_learnt: When designing PV inspection R&D programs, explicitly assess the
    expected module technology mix over the project horizon — UV fluorescence milestones
    became redundant mid-project as glass-glass modules displaced glass-backsheet
    modules, requiring milestone substitution. Build in a technology-trend review
    gate before locking inspection modalities.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: close-out/post-project review
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: UV fluorescence milestones were replaced with technical milestones
    on quantitative module degradation analysis, preserving project momentum and value.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id002
  - 9
  evidence_excerpt: UV fluorescence, a powerful method for glass-back sheet modules,
    has only rather limited value for glass-glass modules. As a result it was decided
    to de-emphasise this project aspect. Associated milestones in the original project
    plan were replaced with technical milestones on the much more practically relevant
    topic of module degradation described above.
  confidence_note: issue_severity rated moderate as a defined set of original milestones
    was abandoned and replaced, representing meaningful rework of the project plan
    even if no schedule delay is stated.
