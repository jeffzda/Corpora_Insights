- record_id: ARENA-DLV-54051
  source_title: UNSW - Daytime Inspection Solutions for Advanced Operation and Maintenance
    of Solar Farms - R&D Interim Report
  publish_date: '2024'
  project_name: Daytime Inspection Solutions for Advanced Operation and Maintenance
    of Solar Farms
  what_happened: During the project, the team discovered that Daytime Photoluminescence
    (DPL) imaging was far more powerful for quantitative module degradation analysis
    than originally anticipated; the original scope had focused primarily on defect
    detection (e.g. crack detection). New technical milestones were added to reflect
    this expanded application.
  lesson_learnt: When scoping PV inspection R&D projects, build in flexibility to
    pivot toward quantitative degradation analysis — field evidence showed DPL's voltage-degradation
    quantification capability was more commercially valuable than the originally planned
    defect-detection focus, warranting a scope expansion mid-project.
  issue_severity: minor
  project_type: software/data/digital
