  source_title: UNSW - Daytime Inspection Solutions for Advanced Operation and Maintenance
    of Solar Farms - R&D Interim Report
  publish_date: '2024'
  project_name: Daytime Inspection Solutions for Advanced Operation and Maintenance
    of Solar Farms
  what_happened: The project demonstrated that a comprehensive solar farm quality
    assessment requires multiple complementary inspection modalities (DPL, thermal,
    and visual/rear-of-panel inspection), and that no single method is sufficient.
    Ground-based robotic solutions were identified as necessary to enable rear-of-panel
    visual inspection, which drones and boom lifts cannot provide.
  lesson_learnt: When designing an O&M inspection solution for utility-scale solar
    farms, scope for multi-modal inspection from the outset — DPL, thermal, and rear-of-panel
    visual inspection address distinct fault classes that are non-overlapping, and
    a single-modality approach will leave significant fault categories undetected.
