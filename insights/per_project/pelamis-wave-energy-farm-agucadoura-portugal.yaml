- record_id: ARENA-DLV-50002
  source_title: Ocean Energy Report by Seanergy and Ernst and Young
  publish_date: 2016-06
  project_name: Pelamis Wave Energy Farm, Agucadoura, Portugal
  what_happened: The world's first wave energy power plant, a 2.25 MW Pelamis device
    farm at Agucadoura, Portugal, opened in September 2008 but had to be brought back
    to harbour after only two months of operation due to technical incidents.
  lesson_learnt: Wave energy devices deployed at commercial scale may encounter unforeseen
    technical failures in open-sea conditions that are not captured during tank or
    nearshore testing; project plans should include contingency for early retrieval,
    repair cycles, and extended commissioning periods before assuming stable operation.
