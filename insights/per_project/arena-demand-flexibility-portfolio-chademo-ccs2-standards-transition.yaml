- record_id: ARENA-DLV-53898
  source_title: Demand Flexibility Portfolio Retrospective Analysis Report
  publish_date: 2023-07
  project_name: ARENA Demand Flexibility Portfolio — CHAdeMO/CCS2 Standards Transition
  what_happened: CHAdeMO is the only current standard supporting V2G in Australia,
    but CCS2 is expected to become the default Australian standard post-2025. Research
    questions answered under CHAdeMO will need to be revisited under CCS2, potentially
    duplicating trial costs and delaying the evidence base for V2G deployment.
  lesson_learnt: V2G research programs should plan for standards transition risk;
    trial designs dependent on CHAdeMO should be structured to generate transferable
    methodology and behavioural insights rather than hardware-specific results, and
    should explicitly incorporate plans to revalidate findings under CCS2 once it
    becomes the prevailing standard.
