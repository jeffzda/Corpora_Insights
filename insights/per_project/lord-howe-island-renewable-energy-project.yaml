- record_id: ARENA-DLV-4758
  source_title: Insights From The Portfolio of Projects Funded Under The Regional
    Australia's Renewables Program
  publish_date: 2017-03
  project_name: Lord Howe Island Renewable Energy Project
  what_happened: Physical space on Lord Howe Island was a binding constraint on the
    renewable energy system design, limiting the scale and type of technologies that
    could be deployed due to the island's small size, conservation requirements, and
    tourism considerations.
  lesson_learnt: For island or geographically constrained off-grid sites, physical
    space availability must be established as a primary design constraint before technology
    selection — conservation overlays and tourism land use can significantly limit
    the renewable capacity achievable and should be assessed at feasibility stage.
