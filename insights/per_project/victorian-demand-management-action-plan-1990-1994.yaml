  source_title: Demand Management Incentives Review
  publish_date: 2017-06
  project_name: Victorian Demand Management Action Plan (1990–1994)
  what_happened: The State Electricity Commission of Victoria's Demand Management Action Plan ran from 1990 to 1993, spending $27.5 million to deliver an estimated net economic benefit of $44.5 million
    — a benefit-cost ratio of approximately 1.6:1. This was the largest and most comprehensive DM programme undertaken in Australia at that time.
  lesson_learnt: Government-funded DM programmes with well-defined deliverables and adequate budget can deliver strong positive benefit-cost ratios; the Victorian experience demonstrates that even early-stage
    DM programmes, before modern smart technologies, can be highly cost-effective when properly resourced and targeted.
