- record_id: ARENA-DLV-28108
  source_title: Insights from Freight Transport Electrification Across Port, Express Parcels & Last-Mile Deliveries
  publish_date: '2025-08-05'
  project_name: Patrick Terminals – BEV Terminal Trucks at the Port of Fremantle
  what_happened: Patrick Terminals' terminal trucks maintained an average battery state of charge of approximately 75% throughout the day, with the minimum SOC not dropping below approximately 25%. While
    this high SOC theoretically represents V2G potential, the vehicles' continuous 24/7 operation makes battery discharge for grid services operationally unsuitable.
  lesson_learnt: High average battery SOC does not automatically translate to viable V2G opportunity — 24/7 operational requirements can preclude discharging, regardless of available stored energy. V2G
    feasibility assessments must consider operational availability windows, not just battery SOC levels.
  issue_severity: none
  project_type: transport electrification
  project_scale_band: demonstration
  lifecycle_phase: operations
