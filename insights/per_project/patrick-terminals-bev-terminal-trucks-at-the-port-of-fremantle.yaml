- record_id: ARENA-DLV-28104
  source_title: Insights from Freight Transport Electrification Across Port, Express Parcels & Last-Mile Deliveries
  publish_date: '2025-08-05'
  project_name: Patrick Terminals – BEV Terminal Trucks at the Port of Fremantle
  what_happened: Patrick Terminals demonstrated that BEV terminal trucks can support 24/7 port operations by programming vehicles to charge on a rotating basis — directing the vehicle with the lowest state
    of charge to a charger as soon as one becomes available. Charger load profiles showed no distinct periods of zero energy consumption across either charger.
  lesson_learnt: A priority-based rotating charging strategy — directing the lowest-SOC vehicle to the next available charger — is an effective method for maintaining high vehicle availability in 24/7 operations,
    smoothing load profiles and avoiding peak demand spikes. Port and terminal operators should adopt this approach rather than batch or shift-end charging.
