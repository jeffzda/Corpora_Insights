  what_happened: No accredited training existed for hydrogen production facility operators
    or hydrogen FCET maintenance and operation in Australia, requiring Ark Energy
    to partner with TAFE Queensland under a MOU to develop bespoke accredited and
    non-accredited training packages from scratch.
  lesson_learnt: Hydrogen project proponents should engage a registered training organisation
    early to develop operator training curricula — no off-the-shelf accredited training
    exists in Australia for hydrogen production or fuel cell heavy vehicle operation,
    and developing it takes significant lead time.
