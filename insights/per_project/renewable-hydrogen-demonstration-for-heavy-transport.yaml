- record_id: ARENA-DLV-51851
  source_title: 'Ark Energy Corporation – Lessons Learnt Report #2 (SunHQ Hydrogen
    Hub)'
  publish_date: 2023-03
  project_name: SunHQ Hydrogen Hub
  what_happened: Equipment for the SunHQ project was manufactured across multiple
    overseas locations (Vietnam, USA, Europe) and required compliance with Australian
    Standards (AS3000 and AS60079). Factory acceptance tests and in-person inspections
    by qualified engineers were necessary to identify non-compliant components before
    delivery to site, proving costly and time-consuming. Two factory acceptance tests
    had been conducted at the time of reporting.
  lesson_learnt: Allow for additional and longer review cycles for engineering documentation
    when using overseas vendors, and conduct a thorough clarification and alignment
    session during tender review to demonstrate how vendors will comply with Australian
    standards — this reduces the risk of non-compliance being discovered late in the
    design process.
  issue_severity: major
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: procurement
  proponent_type: project developer
  delay_category: procurement/supply chain
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: execution & logistics
  intervention_note: Ark Energy, in partnership with their Owner's Engineer, made
    a concerted effort to inform international vendors of Australian standards and
    how to address them, working through additional design revision cycles.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages:
  - 5
  - 17
  - 19
  evidence_excerpt: The need to use external resources to inspect project components
    is costly and can also challenge the project schedule. External entities must
    also have time to understand the intricacies of the project and attend the testing
    before they can provide their sign off on the quality of work. Ark Energy recommends
    that the inspection of equipment, particularly items manufactured abroad, is considered
    in the development of budgets and schedules at an early stage of the project.
  confidence_note: issue_severity assessed as moderate — no explicit schedule duration
