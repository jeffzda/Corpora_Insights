- record_id: ARENA-DLV-23607
  source_title: SunHQ Market and Technology Report
  publish_date: 2022-09
  project_name: SunHQ Hydrogen Hub
  what_happened: No existing Australian or international safety standards governed
    the operation of hydrogen fuel cell electric trucks (FCETs) at the scale deployed
    by SunHQ, requiring Ark Energy and Hyzon Motors to collaborate with Resources
    Safety & Health Queensland to develop a draft hydrogen safety code of practice
    from the ground up.
  lesson_learnt: Ensure that vendor lead or supervising engineers have RPEQ status,
    or can obtain it, early in the design process — international chartered engineers
    compliant with certain accords can obtain RPEQ status in 4–6 weeks via an online
    process, so this should be addressed at contract award or earlier to prevent schedule
    creep.
