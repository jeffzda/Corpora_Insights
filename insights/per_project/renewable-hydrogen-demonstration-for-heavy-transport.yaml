  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: It was found that international chartered engineers compliant
    with certain accords can obtain RPEQ status through an online application and
    review process within 4 to 6 weeks, enabling vendors to resolve the gap without
    impacting the critical path.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages:
  - 6
  - 17
  - 18
  evidence_excerpt: Given SunHQ is located in Townsville, Queensland, Registered Professional
    Engineer of Queensland (RPEQ) sign-off is required on all engineering deliverables.
    This requirement is specific to Queensland and is not required for Hydrogen projects
    that are being constructed in other states or territories. Ark Energy has found
    it beneficial to raise this requirement early with suppliers.
