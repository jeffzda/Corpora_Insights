  project_name: SunHQ Hydrogen Hub
  what_happened: Poor water quality feeding the electrolyser stack was identified
    as a risk capable of damaging the stack and decreasing its operational life. At
    the time of the report, Ark Energy was still finalising water purity requirements
    with Plug Power.
  lesson_learnt: Water quality specifications for the electrolyser feed should be
    defined and agreed with the electrolyser supplier before detailed design is finalised
    — late definition of water purity requirements risks designing an inadequate treatment
    system that could shorten electrolyser stack life.
