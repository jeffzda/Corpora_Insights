  what_happened: COVID-19 and the Russia/Ukraine conflict disrupted the multinational
    supply chains of both Plug Power and Hyzon Motors, impacting the manufacturing
    and procurement processes for SunHQ's hydrogen equipment.
  lesson_learnt: Hydrogen equipment supply chains are multinational and highly exposed
    to macroeconomic disruptions — project schedules should incorporate contingency
    for geopolitical and pandemic-related procurement delays, and proponents should
    assess supply chain concentration risk during the procurement stage.
