- record_id: ARENA-DLV-23613
  source_title: SunHQ Market and Technology Report
  publish_date: 2022-09
  project_name: SunHQ Hydrogen Hub
  what_happened: The SunHQ project adopted a Safety in Design approach from the outset,
    conducting a safety-in-design assessment review at project commencement to identify
    high-level risks, followed by a structured programme of engineering assurance
    reviews (HAZOP, SIL, LOPA, CHAZOP etc.) across the design and build phases.
  lesson_learnt: Hydrogen projects should embed Safety in Design from the earliest
    project stage — initiating a formal SiD assessment at project commencement, before
    detailed engineering, enables high-level hazards to be identified and mitigated
    in design rather than through costly late-stage changes or operational controls.
