  source_title: SunHQ Market Lessons Learnt 1
  publish_date: 2022-06
  project_name: SunHQ Hydrogen Hub
  what_happened: Ark Energy engaged GPA Engineering as Owner's Engineer early in the
    project; GPA's prior hydrogen project experience enabled identification of vendor
    non-compliance at the design review stage, before equipment procurement, reducing
    risk of accepting non-compliant equipment.
  lesson_learnt: Engage a capable Owner's Engineer with hydrogen industry experience
    early in project delivery — their ability to identify non-compliance at the vendor
    package design review stage, prior to equipment procurement, materially reduces
    the risk of costly remediation and commissioning delays.
