- record_id: ARENA-DLV-23606
  source_title: SunHQ Market and Technology Report
  publish_date: 2022-09
  project_name: SunHQ Hydrogen Hub
  what_happened: PEM electrolyser technology was selected over alkaline in order to
    handle the intermittent nature of BTM renewable energy supply and to enable demand
    response by ramping down production when wholesale electricity prices spike —
    a design requirement that alkaline technology could not adequately meet.
  lesson_learnt: For hydrogen projects co-located with variable renewable generation
    or requiring demand-response capability, PEM electrolysers are the preferred technology
    over alkaline — alkaline systems favour continuous operation and are poorly suited
    to intermittent energy supply and price-responsive dispatch.
  issue_severity: none
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: project developer
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: hydrogen
  source_pages: &id003
  - 11
  evidence_excerpt: Ark Energy favoured the use of PEM electrolyser technology due
    to its superior ability to handle the intermittent nature of renewable energy
    supply. Alkaline electrolysers tend to favour continual and consistent operation,
    which did not suit this particular use case. In addition to being more suited
    to the intermittency of renewable energy, a PEM electrolyser will also be more
    suited to ramping down at short notice when the wholesale electricity price spikes.
