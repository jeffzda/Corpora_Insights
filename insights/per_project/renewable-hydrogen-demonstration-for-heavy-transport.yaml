  what_happened: There are currently no Australian manufacturers or suppliers of electrolysers,
    meaning all electrolyser and most CSD components must be sourced internationally
    from Europe, the US, or Asia, with components originating from Vietnam, the USA,
    Germany, and Italy.
  lesson_learnt: Australian hydrogen projects cannot rely on domestic electrolyser
    supply — procurement plans must account for international sourcing lead times,
    import logistics, currency risk, and the compliance redesign required to meet
    Australian standards, all of which add time and cost compared to domestic procurement.
