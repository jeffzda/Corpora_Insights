  source_title: SunHQ Market and Technology Report
  publish_date: 2022-09
  project_name: SunHQ Hydrogen Hub
  what_happened: At the pilot scale, the five hydrogen FCETs are not intended to fully
    replace equivalent diesel trucks on a one-for-one capacity basis, as the refuelling
    schedule means trucks can complete approximately 6 round trips per refuel rather
    than the 20 trips per 12-hour shift that diesel trucks achieve, limiting operational
    throughput equivalence.
  lesson_learnt: First-generation hydrogen FCET deployments should be scoped as operational
    demonstrations rather than full diesel replacements — throughput limitations from
    refuelling frequency and hydrogen production capacity mean pilot-scale projects
    will not achieve full fleet substitution until scale-up occurs.
