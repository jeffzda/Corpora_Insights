- record_id: ARENA-DLV-69013
  source_title: ARENA Insights Forum Session Summaries and Key Points
  publish_date: 2022-11
  project_name: Australia's LNG industry (analogue lesson for green hydrogen)
  what_happened: Australia's LNG industry took 10 years from the WA government underwriting
    the first project (Woodside) to the first LNG export shipment, and 25 years to
    become the world's largest LNG exporter. Separately, large plans and investments
    in LNG for trucking failed due to rising gas prices and lack of truck and OEM
    support domestically.
  lesson_learnt: Plan for a decade-scale development timeline when building a new
    energy export industry — Australia's LNG precedent shows 10 years from government
    commitment to first export, and 25 years to market leadership; and avoid investing
    in niche domestic use cases (e.g. LNG trucks) before OEM and supply chain support
    is confirmed.
