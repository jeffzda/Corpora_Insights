  evidence_excerpt: It was 10 years from when the WA government decided to under-write
    the first LNG project, by Woodside, to the point of the first LNG export shipment.
    Twenty five years later and Australia has become the world's biggest LNG exporter...
    Big plans and investments were made for LNG to be used for trucks in Australia,
    but this eventually failed due to gas prices rising, and lack of trucks and OEM
    support locally.
