- record_id: ARENA-DLV-53883
  source_title: Demand Flexibility Portfolio Retrospective Analysis Report
  publish_date: 2023-07
  project_name: AIRAH Affordable Heating and Cooling Innovation Hub (i-Hub)
  what_happened: The i-Hub project found that energy bills represent a relatively
    minor operating cost in commercial buildings (approximately 3 units versus rent
    of 30 and staff costs of 300), making energy cost savings an insufficient motivator
    for building owners to invest in demand flexibility; COVID-19 also affected baseline
    estimation for the trial.
  lesson_learnt: Demand flexibility programs targeting commercial building owners
    must frame the value proposition around non-energy co-benefits (tenant comfort,
    building rating, regulatory compliance) rather than energy bill savings alone,
    as energy costs are too small a fraction of total operating costs to drive investment
    decisions without a broader value stack.
