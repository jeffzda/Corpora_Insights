- record_id: ARENA-DLV-71604
  source_title: Australian Biomass for Bioenergy Assessment Final Report
  publish_date: 2021-04
  project_name: Australian Biomass for Bioenergy Assessment (ABBA)
  what_happened: Industry organisations held most fine-scale biomass data but were
    unwilling to share it due to confidentiality concerns, meaning the majority of
    data uploaded to AREMI had to be extrapolated from coarser publicly available
    sources such as ABS commodities data.
  lesson_learnt: Where industry data confidentiality prevents direct sharing, design
    data collection around agreed aggregation strategies (e.g. LGA-level reporting,
    SA4 aggregation) from the start — attempting to obtain fine-scale industry data
    retrospectively is unlikely to succeed and forces reliance on lower-quality extrapolated
    datasets.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: programmatic/portfolio-level
