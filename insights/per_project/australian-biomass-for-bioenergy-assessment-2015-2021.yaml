- record_id: ARENA-DLV-71601
  source_title: Australian Biomass for Bioenergy Assessment Final Report
  publish_date: 2021-04
  project_name: Australian Biomass for Bioenergy Assessment (ABBA)
  what_happened: Prior to the ABBA project, biomass resource mapping across Australia
    was incomplete, fragmented across state departments, and not publicly accessible,
    representing a significant barrier to bioenergy project development.
  lesson_learnt: Centralising dispersed public-sector datasets into a single accessible
    platform (such as AREMI) is a prerequisite for catalysing private investment in
    emerging energy sectors where feedstock confidence is a key investor concern —
    undertake this aggregation work before expecting commercial project pipelines
    to develop.
  issue_severity: major
  project_type: software/data/digital
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: concept/feasibility
  proponent_type: government/public-sector body
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: follow-on scale-up enabled
  secondary_failure_mode: null
  intervention_note: A consortium of state government departments and universities,
    led by AgriFutures Australia, collected and centralised biomass resource data
    onto the AREMI platform over the 2015–2021 project period.
  transferability: broad
  delay_magnitude: null
  technology_domain: bioenergy
  source_pages: &id001
  - 8
  evidence_excerpt: Prior to the ABBA project, there was little data publicly available
    to support the development of bioenergy industries in Australia. Biomass resource
    mapping had been undertaken at a regional scale, but the mapping was incomplete,
    with large areas across Australia never having been mapped. Data was stored in
    various locations across state departments, and the lack of reliable information
    on biomass feedstocks has been a significant barrier to the development of bioenergy
    projects across Australia.
