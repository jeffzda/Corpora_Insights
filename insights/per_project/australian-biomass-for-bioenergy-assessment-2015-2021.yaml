- record_id: ARENA-DLV-71602
  source_title: Australian Biomass for Bioenergy Assessment Final Report
  publish_date: 2021-04
  project_name: Australian Biomass for Bioenergy Assessment (ABBA)
  what_happened: A national data schema was not developed until 18 months into the
    project, requiring numerous datasets collected before that point to be retroactively
    reformatted to align with the schema requirements.
  lesson_learnt: Develop and agree a national data schema at the outset of any multi-partner
    data collection program — schema developed 18 months late required substantial
    rework of already-collected datasets and created ongoing inconsistency across
    the national dataset.
