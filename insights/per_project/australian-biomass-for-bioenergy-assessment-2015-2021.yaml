  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: A separate data portal was created for Queensland and Victoria
    to enable their data to be accessed by the analytics tool, resolving the dataset
    tagging issue.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: bioenergy
  source_pages: &id006
  - 26
  evidence_excerpt: 'The development of the analytics tool was more complex than originally
    anticipated. This was a result of needing to: 1. Develop a method for users to
    interact with the AREMI platform. 2. Develop a cloud-based service to interrogate
    multiple state-based datasets. 3. Undertake calculations and redisplay graphical
    and tabular data back into the AREMI system.'
