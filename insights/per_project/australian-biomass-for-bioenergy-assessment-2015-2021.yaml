  delay_category: data/validation/testing
  failure_mode: data & measurement
  outcome_class: partial success
  secondary_failure_mode: coordination & stakeholders
  intervention_note: The project adopted strategies such as data aggregation to protect
    commercially sensitive information while still enabling publication; sensitive
    data was displayed at coarser spatial levels (e.g. SA4) rather than omitted entirely.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: bioenergy
  source_pages: &id004
  - 25
  evidence_excerpt: Industry organisations tend to hold most finer-scale raw data,
    and confidentiality issues can mean they are unwilling to share the data. As a
    result, much of the data uploaded to the AREMI platform was extrapolated from
    publicly available information, (e.g. ABS commodities data).
