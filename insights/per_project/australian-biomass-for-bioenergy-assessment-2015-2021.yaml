- record_id: ARENA-DLV-71606
  source_title: Australian Biomass for Bioenergy Assessment Final Report
  publish_date: 2021-04
  project_name: Australian Biomass for Bioenergy Assessment (ABBA)
  what_happened: Development of the AREMI analytics tool proved substantially more
    complex than originally anticipated, requiring cloud-based service infrastructure,
    multi-state dataset interrogation, real-time calculation, and re-display of results
    within the AREMI interface.
  lesson_learnt: When scoping analytics tools that must interact with distributed
    third-party data platforms, factor in the full technical stack — cloud service
    development, multi-format data interrogation, and real-time performance constraints
    — as these are routinely underestimated and can materially affect project timelines
    and budgets.
  issue_severity: moderate
  project_type: software/data/digital
