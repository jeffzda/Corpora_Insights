  project_name: Australian Biomass for Bioenergy Assessment (ABBA)
  what_happened: Protecting data supplier confidentiality required aggregating sensitive
    data (e.g. piggery and poultry farm locations) to coarser spatial levels (e.g.
    SA4), which reduced the richness and utility of the published data for project
    developers who needed fine-scale feedstock location information.
  lesson_learnt: Design data confidentiality strategies before data collection begins
    — the trade-off between protecting supplier identity and providing actionable
    spatial resolution should be resolved in consultation with data suppliers at the
    outset, as post-hoc aggregation permanently reduces dataset utility.
