- record_id: ARENA-DLV-71605
  source_title: Australian Biomass for Bioenergy Assessment Final Report
  publish_date: 2021-04
  project_name: Australian Biomass for Bioenergy Assessment (ABBA)
  what_happened: ABS agricultural survey data — the most reliable publicly available
    annual source — changed its collection scope in 2015-16 (raising the EVAO threshold
    from $5,000 to $40,000), requiring previously collected data to be recalculated
    and preventing full automation of biomass residue calculations.
  lesson_learnt: When building data pipelines dependent on government statistical
    collections, plan for methodology changes in source datasets — scope changes to
    ABS survey thresholds mid-project forced recalculation of multi-year datasets
    and blocked automation, consuming significant project effort.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: operations
  proponent_type: government/public-sector body
  delay_category: data/validation/testing
  failure_mode: data & measurement
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Years 2013–15 were recalculated using the new EVAO threshold
    to ensure a consistent five-year average; the issues were raised with the ABS,
    which committed to creating more stable datasets in future.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: bioenergy
  source_pages: &id005
  - 25
  evidence_excerpt: The biggest change was in the 2015-16 Census year, when ABS changed
    their collection scope from agricultural businesses with an estimated value of
    agricultural operations (EVAO) of $5000 or more to agricultural businesses with
    an EVAO of $40,000 or more. Initial cropping and livestock data (2010-15) was
    produced using the old EVAO. When updating to 2013-18, the years 2013-15 were
    recalculated to the new EVAO, ensuring the data was consistent for the five-year
    average. This resulted in outdated datasets, and complete automation by coding
    for calculating residues was not achievable.
