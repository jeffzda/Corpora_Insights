- record_id: ARENA-DLV-71603
  source_title: Australian Biomass for Bioenergy Assessment Final Report
  publish_date: 2021-04
  project_name: Australian Biomass for Bioenergy Assessment (ABBA)
  what_happened: Partner states used different data upload formats (CSV vs ArcGIS
    WMS), resulting in non-uniform file formats that required Data61 to intervene
    and manually reconcile before data could be published to the AREMI platform.
  lesson_learnt: Multi-partner data programs should mandate a single minimum file
    format standard from the outset — divergent upload formats across states required
    third-party intervention for every data upload cycle and created unnecessary processing
    overhead.
