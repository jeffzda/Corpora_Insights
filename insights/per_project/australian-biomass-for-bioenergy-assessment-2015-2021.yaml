    restructure, and Queensland's data updates were flagged as dependent on available
    resourcing, creating risk of data becoming stale and reducing platform utility
    over time.
  lesson_learnt: Multi-partner data infrastructure programs should secure formal,
    funded data maintenance commitments from all partners before project close — voluntary
    or resource-contingent maintenance commitments create a significant risk of data
    decay that undermines the long-term value of the platform investment.
