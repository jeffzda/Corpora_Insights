  what_happened: Differing data formats used by state governments meant that some
    datasets could not be tagged appropriately for recognition by the analytics tool,
    limiting its geographic coverage and requiring a workaround.
  lesson_learnt: Interoperability between analytics tools and distributed state-based
    datasets requires a common tagging and format convention agreed before tool development
    begins — retrofitting tagging to non-conformant datasets requires workarounds
    (such as separate state data portals) that add cost and complexity.
