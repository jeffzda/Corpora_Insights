- record_id: ARENA-DLV-42784
  source_title: Evaluation of ARENA's VPP Portfolio
  publish_date: 2021-06
  project_name: LO3 Energy Latrobe Valley Microgrid Feasibility Study
  what_happened: LO3 Energy, as a start-up, found the ARENA contracting process a
    considerable cost burden, though ARENA was accommodating around IP concerns.
  lesson_learnt: For start-up technology vendors, the ARENA contracting process represents
    a disproportionate cost relative to project size; consider simplified contracting
    pathways for small feasibility studies and ensure IP ownership provisions are
    clearly communicated early to reduce negotiation overhead.
