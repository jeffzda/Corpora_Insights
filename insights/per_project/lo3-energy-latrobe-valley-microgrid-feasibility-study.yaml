- record_id: ARENA-DLV-42782
  source_title: Evaluation of ARENA's VPP Portfolio
  publish_date: 2021-06
  project_name: LO3 Energy Latrobe Valley Microgrid Feasibility Study
  what_happened: The LO3 Energy peer-to-peer trading feasibility study found insufficient
    commercial benefits for retailers (3-year payback considered too long) and only
    marginal benefits for prosumers, with costs outweighing benefits; the technology
    was not proven commercially viable and LO3 reduced its Australian presence to
    a single part-time employee post-project.
  lesson_learnt: Before funding a peer-to-peer energy trading platform trial, validate
    that the business case is viable for all required participant types (retailers,
    prosumers, networks); if retailer payback periods are structurally too long relative
    to normal commercial thresholds, this is unlikely to be resolved through a trial
    alone.
