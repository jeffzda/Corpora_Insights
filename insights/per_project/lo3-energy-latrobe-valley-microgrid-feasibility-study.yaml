- record_id: ARENA-DLV-42783
  source_title: Evaluation of ARENA's VPP Portfolio
  publish_date: 2021-06
  project_name: LO3 Energy Latrobe Valley Microgrid Feasibility Study
  what_happened: The LO3 project encountered challenges with achieving interoperability
    between the LO3 platform and other technology components, aspects of which remained
    unresolved at evaluation.
  lesson_learnt: Interoperability between blockchain-based energy trading platforms
    and existing grid/DER hardware is a significant unresolved technical challenge;
    future funding in this space should require explicit interoperability testing
    protocols and standards alignment as a milestone condition.
