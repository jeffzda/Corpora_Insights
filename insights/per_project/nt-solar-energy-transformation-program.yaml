  source_title: NT SETuP Performance Report 3
  publish_date: 2022-06
  project_name: Solar Energy Transformation Program (SETuP)
  what_happened: Several SETuP communities experienced significantly lower actual
    PV yield relative to their PVSYST modelled uncurtailed yield, with the gap varying
    widely across sites. For example, Bulman achieved only 15.3% of modelled yield
    and Atitjere only 50.9%, while some sites exceeded their modelled yield. PVSYST
    estimates did not account for curtailment, and in some cases were based on pre-redistribution
    array configurations.
  lesson_learnt: PVSYST uncurtailed yield estimates should not be used as the primary
    performance benchmark for solar-diesel hybrid systems where curtailment is expected
    — a post-curtailment yield target derived from system-specific modelling (such
    as HOMER or ASIM) is required for meaningful performance assessment. Sites with
    large gaps between PVSYST and actual yield warrant investigation to distinguish
    curtailment from underperformance.
