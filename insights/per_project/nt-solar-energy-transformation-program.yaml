  source_title: SETuP Knowledge Sharing – Daly River Lessons Learnt
  publish_date: 2019-09
  project_name: Daly River High Contribution Project
  what_happened: A proactive community engagement strategy — including quarterly newsletters,
    Local Authority meeting presentations, explanatory outage notices, and employment
    of local community organisations — built goodwill that proved critical when project
    delays and technical problems arose during delivery of a new-technology project
    on a live power system.
  lesson_learnt: For new-technology projects on live community power systems, invest
    in a structured community engagement strategy from the outset — including transparent
    communication about project challenges and reasons for outages — as the goodwill
    built becomes essential when inevitable technical problems occur; under-communicating
    is far greater a risk than over-communicating.
