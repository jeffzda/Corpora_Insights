  source_title: SETuP Knowledge Sharing – Daly River Lessons Learnt
  publish_date: 2019-09
  project_name: Daly River High Contribution Project
  what_happened: The station emergency stop system was extended to include the BESS,
    but the recommendation to test the full-power emergency stop as part of site acceptance
    testing — to verify the system can safely interrupt high inductive currents without
    damage — was only identified through project experience rather than being planned
    from the outset.
  lesson_learnt: Include a full-power emergency stop test as a mandatory item in the
    site acceptance test plan before the BESS enters operational service — sudden
    current interruption under full load creates inductive voltage transients that
    the system must survive repeatedly; also ensure ESTOP signal circuits are designed
    with galvanic isolation and fail-safe logic (loss of contact voltage should trigger
    the ESTOP function).
