- record_id: ARENA-DLV-17786
  source_title: SETuP Knowledge Sharing – Daly River Lessons Learnt
  publish_date: 2019-09
  project_name: Daly River High Contribution Project
  what_happened: Digital fault recorders (DFR) and remote power quality meters were
    installed at the Daly River power station at commissioning as an 'insurance' measure
    given the novelty of the BESS technology; these instruments proved valuable during
    commissioning and debugging, contributing to analysis of ferroresonance, PV integration
    instability, and lightning strike events, and enabling expedited issue resolution.
  lesson_learnt: For first-of-kind BESS integration projects, install high-resolution
    digital fault recorders and power quality instruments at the power station as
    standard commissioning tools — the data they provide during integration testing
    and fault diagnosis is invaluable for expediting resolution of novel technical
    issues and building stakeholder confidence, and the cost is justified even if
    the equipment is removed once stable operation is achieved.
