  source_title: SETuP Knowledge Sharing – Daly River Lessons Learnt
  publish_date: 2019-09
  project_name: Daly River High Contribution Project
  what_happened: Operational trials demonstrated that stopping the BESS inverter overnight
    (when not actively charging or discharging) saved approximately 10 kWh/day by
    eliminating idle switching losses and reducing HVAC load, equivalent to an estimated
    15–20 MWh/year (4,000–5,000 litres of additional fuel savings annually); delayed
    discharge to low-load early-morning hours also added an estimated 2–4 additional
    diesel-off hours per day.
  lesson_learnt: Implement control system logic to automatically shut down the BESS
    inverter during idle periods (after evening discharge is complete and before morning
    charging begins) and delay discharge to overnight low-load periods — these control
    optimisations can deliver significant additional fuel savings over a 10-year asset
    life without hardware changes, and should be incorporated into the initial control
    system design.
