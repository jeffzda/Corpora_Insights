  source_title: NT SETuP Performance Report 4
  publish_date: 2022-11
  project_name: Solar Energy Transformation Program (SETuP)
  what_happened: The conclusion of the SETuP program identified that further investment
    in the diesel fleet for incremental yield improvements must be weighed against
    the likely timing and cost of adding BESS and additional PV, as a retrofit BESS
    enabling diesel-off operation would deliver significantly greater yield improvement
    than diesel engine modifications alone.
  lesson_learnt: For existing remote solar-diesel portfolios approaching the limit
    of diesel fleet optimisation, the investment decision framework should explicitly
    compare the marginal cost of incremental diesel fleet improvements against the
    step-change yield gain from a BESS retrofit — the Daly River and Titjikala results
    demonstrate that BESS addition is likely to deliver superior yield improvement
    per dollar at current technology costs.
