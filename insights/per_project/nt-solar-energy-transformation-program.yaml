- record_id: ARENA-DLV-61122
  source_title: Solar/Diesel Mini-Grid Handbook 2nd Edition
  publish_date: '2019'
  project_name: Solar/Diesel Mini-Grid Handbook – general legacy infrastructure guidance
  what_happened: In solar/diesel hybrid mini-grids, uncontrolled customer-owned rooftop
    solar (DER) that is not subject to feed-in management can act as a negative load
    that is uncontrolled and uncommunicated to the power station. In small remote
    communities, a cloud event can cause simultaneous loss of all DER output without
    geographical diversity to buffer the impact, risking system instability.
  lesson_learnt: Quantify and account for existing and projected customer-owned rooftop
    solar as part of the spinning reserve budget when designing a solar/diesel hybrid
    system — uncontrolled DER reduces the effective headroom available for utility
    solar without additional smoothing mechanisms.
  issue_severity: moderate
  project_type: generation
