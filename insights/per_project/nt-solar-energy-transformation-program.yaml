  project_name: Solar Energy Transformation Program (SETuP) – Tranche One
  what_happened: System loads and diesel engine sizes had changed in some communities
    since initial modelling was conducted, resulting in some Tranche One arrays being
    sized sub-optimally for actual conditions at the time of commissioning.
  lesson_learnt: Refresh technical and economic modelling close to the construction
    date for each site in multi-year programs — community load profiles and engine
    characteristics can change materially between initial design and delivery, causing
    array sizes to be sub-optimal.
