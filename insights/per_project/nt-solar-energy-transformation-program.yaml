- record_id: ARENA-DLV-17761
  source_title: SETuP Knowledge Sharing – Daly River Lessons Learnt
  publish_date: 2019-09
  project_name: Daly River High Contribution Project
  what_happened: Ferroresonance was discovered accidentally during protection testing
    when a feeder circuit breaker was manually closed onto an unenergised transformer
    while the BESS was in diesel-off mode, producing transient overvoltages of up
    to 800V peak at ~1200 Hz that were potentially damaging to system equipment.
  lesson_learnt: For BESS projects using inverter-formed grids with radial LV distribution,
    test for ferroresonance risk during commissioning in a controlled manner before
    the system enters service — remove vulnerable loads before testing, use high-resolution
    power quality recording, and specify in future BESS tenders that vendors must
    confirm their inverter can suppress resonances or provide the natural resonant
    frequency data; implement feeder-close interlocks in diesel-off mode as a minimum
    mitigation.
  issue_severity: major
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: commissioning/integration
