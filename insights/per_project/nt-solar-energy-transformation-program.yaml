  project_name: Solar Energy Transformation Program (SETuP)
  what_happened: The cloud forecasting trial found that the best-performing vendor
    achieved effectively 100% clouding event prediction but at only ~30% efficiency
    (high false positive rate), meaning integration into diesel dispatch control would
    result in frequent unnecessary generator standby — the trade-off between effectiveness
    and efficiency was unresolved at the time of reporting.
  lesson_learnt: Cloud prediction technology for isolated solar-diesel grids should
    be evaluated against both sensitivity (detection rate) and specificity (false
    positive rate) in the specific climatic context of deployment; high-sensitivity
    low-specificity forecasting may not improve economic outcomes in diesel dispatch
    if excessive false positives negate the spinning reserve savings.
