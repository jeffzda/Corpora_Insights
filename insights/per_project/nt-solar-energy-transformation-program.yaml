  failure_mode: unvalidated integration
  outcome_class: delayed but recoverable
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: 'Multi-stage mitigation implemented: tweaked inverter current
    control parameters, increased inverter LC filter capacitance (supplied by Qinous),
    configured high-speed overvoltage protection to trip in <15ms, inhibited automated
    feeder reclosing in diesel-off mode, and added hardware interlock preventing manual
    feeder closure in diesel-off mode.'
