- record_id: ARENA-DLV-61126
  source_title: Solar/Diesel Mini-Grid Handbook 2nd Edition
  publish_date: '2019'
  project_name: Solar/Diesel Mini-Grid Handbook – inverter selection for remote applications
  what_happened: In remote solar/diesel mini-grid deployments, single or few large
    inverters create a disproportionate impact on system output when a failure occurs,
    and replacement parts may be difficult to store on site; response by qualified
    technicians can be significantly delayed due to remoteness.
  lesson_learnt: For remote solar mini-grids, favour a larger number of smaller string
    inverters over fewer large central inverters — this enables on-site spare parts
    storage, faster swap-out, and limits the output impact of any single inverter
    failure, offsetting the efficiency and coordination disadvantages of a more distributed
    inverter architecture.
