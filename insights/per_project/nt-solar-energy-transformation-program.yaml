- record_id: ARENA-DLV-17103
  source_title: 'NT SETuP: A First Look at The Integration of PV and Diesel Power
    Stations in Remote Communities'
  publish_date: 2018-12
  project_name: Northern Territory Solar Energy Transformation Program (NT SETuP)
    — Ramingining
  what_happened: At Ramingining, a mid-day demand spike caused a higher-capacity generator
    to come online, which had a higher minimum loading threshold, triggering increased
    PV curtailment and reducing total PV energy yield — illustrating a trade-off between
    system stability and renewable output.
  lesson_learnt: Operators and project designers should explicitly model and communicate
    the relationship between generator dispatch logic and PV curtailment levels; demand-driven
    generator switching can unexpectedly reduce renewable energy fractions and this
    cost-benefit trade-off must be documented in advance.
  issue_severity: minor
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: Power and Water, as owner-operator of both PV and diesel assets,
    accepted the curtailment within a broader system stability and cost-benefit framework.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id021
  - 5
  evidence_excerpt: From a PV operator's perspective, such a curtailment is undesirable
    as it reduces the total energy produced by the system. However, as Power and Water
    owns and operates both the PV and the diesel generation, the decision to curtail
    the PV fits within a broader framework of system stability and risk mitigation,
    and a cost-benefit (or benefit-risk) evaluation.
