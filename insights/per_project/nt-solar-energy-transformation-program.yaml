  source_title: NT SETuP Performance Report 2
  publish_date: 2020-10
  project_name: Solar Energy Transformation Program (SETuP)
  what_happened: The solar array at Yuendumu achieved only 10.3% REF against the 15%
    program target, with estimated active curtailment of 45% — the highest among Tranche
    1 sites. The community was identified as undersized for 15% REF but also suffering
    from high diesel minimum load requirements (40% minimum load setting on the primary
    engine).
  lesson_learnt: Where communities have both undersized arrays and high diesel minimum
    load requirements, neither increasing array size alone nor reducing minimum load
    alone will achieve target REF — a combined intervention addressing both constraints
    is required, and this should be identified at design stage rather than discovered
    during operations.
