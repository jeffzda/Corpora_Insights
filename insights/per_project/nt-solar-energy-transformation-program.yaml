  what_happened: In multiple remote mini-grid deployments, the expected cycle life
    of BESS units did not extend to the full period used to calculate payback on the
    solar system, and the harsh Northern Territory operating conditions meant the
    manufacturer's stated design life for energy storage devices was not always achieved.
  lesson_learnt: Always include BESS replacement costs within the economic analysis
    and payback calculation for solar/diesel hybrid systems — in harsh remote climates,
    BESS design life is unlikely to be achieved and the device will need replacement
