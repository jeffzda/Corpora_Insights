  source_title: NT SETuP Performance Report 2
  publish_date: 2020-10
  project_name: Solar Energy Transformation Program (SETuP)
  what_happened: The original SETuP design modelling used diesel engine capacities
    and minimum load requirements from 2014/15. During delivery, arrays were relocated
    or their capacity redistributed between communities in response to construction
    and other challenges, and remodelling was not completed in all cases — the prior
    yield estimates were retained or proxies used. This meant some arrays were sized
    for different load and diesel conditions than those actually in place.
  lesson_learnt: When programme-level array redeployments or community substitutions
    occur during delivery, remodel each affected site against current load data and
    diesel fleet parameters before finalising design — retaining stale model outputs
    introduces systematic bias into performance targets and may result in arrays that
    are persistently over- or under-sized for the actual system.
