  source_title: NT SETuP Performance Report 1
  publish_date: 2020-10
  project_name: Solar Energy Transformation Program (SETuP)
  what_happened: Remoteness of sites (up to 12-hour drive or requiring chartered aircraft)
    meant that mobilisation costs of approximately $3,000 per visit substantially
    exceeded the daily diesel savings (~$150/day for a 100 kW array at $1/litre diesel),
    causing rational delays in repair and rectification that resulted in extended
    array outages and data loss.
  lesson_learnt: For remote solar-diesel hybrid programs, the economic threshold for
    mobilising repair crews should be explicitly modelled and built into operations
    plans; maintenance strategies should prioritise components that can be replaced
    by on-site operators (ESOs) and minimise reliance on specialist mobilisation for
    high-frequency failure modes.
