  outcome_class: delayed but recoverable
  secondary_failure_mode: poor scoping
  intervention_note: Interposing CAT5 surge protection devices were installed on all
    communications daisy chains; improved grading of Type 1/2/3 SPDs applied to all
    equipment including ancillary device power supplies; Atonometrics irradiance sensor
    surge protection also upgraded.
