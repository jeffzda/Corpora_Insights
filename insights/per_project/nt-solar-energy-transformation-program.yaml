- record_id: ARENA-DLV-17767
  source_title: SETuP Knowledge Sharing – Daly River Lessons Learnt
  publish_date: 2019-09
  project_name: Daly River High Contribution Project
  what_happened: Loss of communications between the station controller and the BESS,
    or between the station controller and the PV cluster controller, posed a risk
    of system instability; Power and Water defined specific safe-state fallback behaviours
    for each failure mode including automatic droop-mode transitions for the BESS
    and graduated PV output ramp-down for the cluster controller.
  lesson_learnt: When designing control systems for multi-source hybrid energy systems,
    explicitly define and test all loss-of-communications fallback behaviours before
    commissioning — every communication channel should have a documented safe-state
    response (e.g. transition to droop, gradual ramp-down) to ensure system stability
    if any channel fails; staggered PV inverter fallback delays should be configured
    to avoid simultaneous disconnection.
