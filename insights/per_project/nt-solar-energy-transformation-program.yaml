  what_happened: The SETuP program standardised on 25 kW string inverters (SMA Tripower)
    across all 25 communities, deploying 397 units. This decision was made early in
    the design phase specifically to allow field replacement without heavy-lifting
    equipment, which is difficult and expensive to source in remote communities.
  lesson_learnt: For remote community solar programs, standardise on inverter sizes
    that can be physically replaced on-site without heavy-lifting equipment — this
