- record_id: ARENA-DLV-24053
  source_title: NT SETuP Performance Report 4
  publish_date: 2022-11
  project_name: Solar Energy Transformation Program (SETuP)
  what_happened: Active curtailment — driven by diesel generator minimum load requirements
    — was the most significant factor limiting PV yield across the SETuP portfolio,
    with curtailment estimated at around 30% of uncurtailed potential yield by design,
    and varying considerably between communities depending on load profile and engine
    fleet characteristics.
  lesson_learnt: In solar-diesel hybrid mini-grids, the diesel fleet's minimum load
    set points are a primary determinant of PV yield; projects should assess and,
    where feasible, reduce minimum load requirements early in the design phase, as
    incremental improvements through low-load-rated engine deployments delivered meaningful
    yield gains during operations.
  issue_severity: moderate
  project_type: generation
  project_scale_band: utility/large-scale
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: partial success
  secondary_failure_mode: poor scoping
  intervention_note: During 2019 and 2020, a number of reductions in approved minimum
    load settings were made along with deployment of several lower minimum load capable
    generators, contributing to improved yield.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id083
  - 19
  evidence_excerpt: Decreasing the minimum load requirements of the diesel engines
    is the most effective tool to reduce active curtailment. The cost of achieving
    this can be low if the existing engine can, with little or minor modifications,
    support operation at lower loads, or if the existing engine is due for replacement
    and can be replaced with a low load rated engine for a similar cost.
