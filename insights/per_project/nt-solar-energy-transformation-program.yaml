  source_title: NT SETuP Performance Report 1
  publish_date: 2020-10
  project_name: Solar Energy Transformation Program (SETuP)
  what_happened: Non-optimal diesel generator sizes at several communities — where
    installed capacities were poorly matched to actual seasonal loads due to anticipated
    housing-program load growth not eventuating or load shrinkage from changes in
    residency — constrained the solar window available for PV contribution, limiting
    REF performance.
  lesson_learnt: In solar-diesel hybrid programs, the diesel generator fleet sizing
    relative to actual load is a fundamental constraint on PV yield; program designers
    should model REF sensitivity to generator minimum loading requirements and flag
    communities where engine replacement or resizing would unlock materially higher
    renewable fractions, to inform the broader asset replacement schedule.
