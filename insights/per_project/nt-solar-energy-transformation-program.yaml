  source_title: NT SETuP Performance Report 1
  publish_date: 2020-10
  project_name: Solar Energy Transformation Program (SETuP)
  what_happened: Diesel fuel consumption data was available only at weekly aggregate
    resolution from manually read fuel meters, limiting finer-resolution analysis
    of actual diesel savings and preventing per-event attribution of fuel savings
    to solar generation.
  lesson_learnt: Remote solar-diesel hybrid programs should implement automated fuel
    metering with data historian integration from the outset; reliance on manually
