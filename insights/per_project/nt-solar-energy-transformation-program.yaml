- record_id: ARENA-DLV-70673
  source_title: NT SETuP Performance Report 2
  publish_date: 2020-10
  project_name: Solar Energy Transformation Program (SETuP)
  what_happened: Continuous logging of diesel generator minimum load set-point parameters
    into the Pi Historian was only implemented in late 2019, and manual records of
    parameter changes prior to that implementation were limited. This meant that historical
    curtailment analysis could only infer prior minimum load settings from engine
    performance data rather than direct records.
  lesson_learnt: Log diesel engine minimum load set-points as SCADA historian tags
    from the start of solar-diesel hybrid operation — this parameter is the primary
    driver of active curtailment and is essential for retrospective performance analysis;
    absence of the data forces indirect inference that introduces uncertainty into
    yield attribution.
