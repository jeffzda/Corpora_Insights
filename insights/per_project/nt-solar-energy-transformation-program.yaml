  source_title: NT SETuP Performance Report 4
  publish_date: 2022-11
  project_name: Solar Energy Transformation Program (SETuP)
  what_happened: Seasonal and diurnal variation in community load relative to available
    solar yield caused significant curtailment at medium-contribution sites — arrays
    sized to achieve higher contribution in high-load summer months experienced substantial
    curtailment in low-load months, limiting annual average yield.
  lesson_learnt: 'When sizing solar arrays for remote diesel mini-grids, account explicitly
    for seasonal load variation and its interaction with solar availability: arrays
    optimised for high-load months will experience disproportionate curtailment in
    low-load periods, and this trade-off should be modelled and communicated as an
    intrinsic design outcome rather than a performance shortfall.'
