  secondary_failure_mode: poor scoping
  intervention_note: A subset of sites (Daly River and Bulman) were fitted with dual-input
    Atonometrics devices including a self-washing independent reference cell, enabling
    soiling loss measurement at those sites.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id093
  - 9
  evidence_excerpt: While this is an effective means of estimating 'real-world' curtailment
