  source_title: SETuP – Lessons Learnt Report – Remote Community Engagement
  publish_date: 2019-09
  project_name: Solar Energy Transformation Program (SETuP)
  what_happened: Two external contractors were engaged to deliver community engagement
    across northern and southern regions, but both failed to meet deliverables due
    to insufficient human resources and inconsistent service quality. Contracts were
    not renewed.
  lesson_learnt: When outsourcing community engagement in remote or specialist contexts,
    require detailed CVs for committed personnel at contract award and include a clause
    requiring approval of any key personnel changes — especially for contracts longer
    than six months.
