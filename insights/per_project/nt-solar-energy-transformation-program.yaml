- record_id: ARENA-DLV-17104
  source_title: 'NT SETuP: A First Look at The Integration of PV and Diesel Power
    Stations in Remote Communities'
  publish_date: 2018-12
  project_name: Northern Territory Solar Energy Transformation Program (NT SETuP)
  what_happened: Renewable Energy Fractions for simple PV-diesel integration without
    enabling technologies were historically limited to less than 5%; NT SETuP demonstrated
    that achieving approximately 15% REF and up to 60% peak Renewable Power Fraction
    is feasible without batteries or other enabling technologies.
  lesson_learnt: Simple PV-diesel integration without batteries or other enabling
    technologies can achieve REFs significantly higher than the historically assumed
    5% ceiling — project designers should not default to battery inclusion for modest
    REF targets, as well-designed curtailment strategies alone can reach 15% REF and
    60% peak RPF.
