- record_id: ARENA-DLV-18357
  source_title: NT SETuP Performance Report 3
  publish_date: 2022-06
  project_name: Solar Energy Transformation Program (SETuP)
  what_happened: Active curtailment of PV output was a significant and designed-in
    feature of the SETuP medium-contribution arrays. Modelling at design stage anticipated
    approximately 30% curtailment. Actual curtailment varied substantially between
    communities, driven by diesel engine minimum load requirements and the mismatch
    between seasonal PV availability and seasonal community load patterns.
  lesson_learnt: In remote solar-diesel hybrid systems, diesel engine minimum load
    settings are the primary lever for reducing active curtailment and improving PV
    yield. Program designers should explicitly model curtailment sensitivity to minimum
    load settings for each site and prioritise early deployment of low-minimum-load
    engines or settings adjustments at sites where curtailment materially undermines
    the REF target.
  issue_severity: moderate
