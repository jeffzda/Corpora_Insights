  project_name: Solar Energy Transformation Program (SETuP)
  what_happened: SETuP arrays were designed using load and diesel fleet data from
    2014/15; over the following years, community loads increased (Tranche 1 +3.0%,
    Tranche 2 +6.6%, Daly River +3.5% in 2021–22 alone), meaning array sizes selected
    against the original load assumptions became progressively less well-matched to
    actual load conditions.
  lesson_learnt: Remote community solar-diesel programs should build in periodic review
    of load growth assumptions during the design horizon — load increases of 3–7%
    per year compound quickly and can erode REF targets or increase curtailment levels,
    warranting reassessment of array sizing and the case for BESS addition.
