- record_id: ARENA-DLV-1857
  source_title: SETuP – Lessons Learnt Report – Rollout Challenges
  publish_date: 2019-09
  project_name: Solar Energy Transformation Program (SETuP)
  what_happened: Power and Water managed electrical interconnection using its own
    existing electrical contracts rather than bundling this scope into the EPC contractor's
    works. A point of common coupling cabinet was provided within each solar compound
    as the handover point. This allowed interconnect design and rollout to proceed
    in parallel with EPC works.
  lesson_learnt: Retaining electrical interconnection under the asset owner's own
    contracts — rather than bundling it into the EPC — can allow interconnect design
    and construction to proceed in parallel with EPC works, reducing overall programme
    duration.
