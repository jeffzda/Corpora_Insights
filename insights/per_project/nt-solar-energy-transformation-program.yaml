  what_happened: Power and Water developed the ASIM modelling tool in 2013 with ARENA
    support to address a gap in available hybrid mini-grid simulation tools — existing
    tools lacked one-second time-step capability needed to detect system stability
    issues and transient behaviour relevant to solar/diesel hybrid design.
  lesson_learnt: Use one-second time-step simulation tools (such as ASIM) to validate
    solar/diesel hybrid system designs before construction — coarser time-step tools
    will not detect grid stability issues, spinning reserve conflicts, or station
    blackout risks that emerge during rapid solar output changes.
