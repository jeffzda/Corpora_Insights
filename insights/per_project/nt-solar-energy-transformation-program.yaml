- record_id: ARENA-DLV-1854
  source_title: SETuP – Lessons Learnt Report – Rollout Challenges
  publish_date: 2019-09
  project_name: Solar Energy Transformation Program (SETuP)
  what_happened: Buried rubbish and buried car bodies were discovered at multiple
    sites only after clearing had commenced, disrupting construction works. At Nyirripi,
    ground penetrating radar was deployed to map underground contamination; the EPC
    contractor ultimately managed screw pile construction without full excavation.
  lesson_learnt: Acknowledge and plan explicitly for unidentified subsurface contamination
    in remote community settings — buried waste was a significant programme-wide issue
    discovered only after clearing began; pre-construction ground-penetrating radar
    surveys should be considered for community sites.
