- record_id: ARENA-DLV-70668
  source_title: NT SETuP Performance Report 2
  publish_date: 2020-10
  project_name: Solar Energy Transformation Program (SETuP)
  what_happened: Because solar arrays are not essential to power station operation
    in the SETuP diesel-hybrid design, array outages could go undetected by the Essential
    Services Operator and by centralised technical coordinators until picked up by
    daily and weekly manual checks — a structural gap in real-time fault detection.
  lesson_learnt: In remote solar-diesel hybrid systems where PV is non-essential,
    automated alarm notifications for array non-communication should be implemented
    from commissioning — relying on manual daily and weekly checks creates a systematic
    detection lag that compounds cumulative yield loss at remote sites.
