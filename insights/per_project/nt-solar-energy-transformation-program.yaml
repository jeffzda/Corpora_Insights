  source_title: SETuP Knowledge Sharing – Daly River Lessons Learnt
  publish_date: 2019-09
  project_name: Daly River High Contribution Project
  what_happened: Battery installation involved manually unpacking and lifting 288
    battery trays (each 55 kg, requiring two persons) in hot, humid build-up season
    conditions; the physical installation was completed safely through controlled
    work method statements, task rotation, and temporary environmental controls (marquees,
    pedestal fans, work benches), but generated a large volume of packaging waste
    that was expensive to recycle remotely.
  lesson_learnt: For remote BESS battery installation in hot climates, plan physical
    installation during cooler months where possible; implement formal safe work method
    statements with task rotation and environmental controls before work begins; pre-plan
    packaging waste disposal by engaging local employment agencies — this converts
    a logistics problem into a community engagement opportunity while avoiding costly
    waste removal.
