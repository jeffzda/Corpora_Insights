  source_title: Solar/Diesel Mini-Grid Handbook and Mini-Grid Power System Modelling
    Tool
  publish_date: 2018-12
  project_name: NT SETuP (Northern Territory Solar Energy Transformation Program)
  what_happened: Integration of grid-following PV into autonomous diesel mini-grids
    proved difficult because rapid cloud-induced changes in PV output could not be
    absorbed fast enough by diesel generators, risking operation below minimum load,
    increased engine wear, or network blackout.
  lesson_learnt: When integrating grid-following PV into diesel mini-grids, dynamic
    PV curtailment tied to the currently selected generator's minimum loading threshold
    — rather than a fixed curtailment level — is necessary to maintain system stability
    and prevent engine damage or blackouts during cloud events.
