- record_id: ARENA-DLV-63402
  source_title: SETuP – Lessons Learnt Report – Remoteness Challenges
  publish_date: 2019-09
  project_name: Solar Energy Transformation Program (SETuP)
  what_happened: Bulk material delivery to many remote communities was only possible
    by barge, which was considerably more expensive than road transport, and roads
    were frequently not constructed for all-weather access, introducing schedule risk
    during the wet season.
  lesson_learnt: Design project schedules with wet-season float and cost plans that
    account for barge-only delivery premiums in remote communities — road-based delivery
    assumptions will produce unrealistic cost and schedule estimates for many Northern
    Territory sites.
