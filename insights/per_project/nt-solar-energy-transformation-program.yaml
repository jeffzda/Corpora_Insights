- record_id: ARENA-DLV-17782
  source_title: SETuP Knowledge Sharing – Daly River Lessons Learnt
  publish_date: 2019-09
  project_name: Daly River High Contribution Project
  what_happened: A high-impedance phase-to-phase organic fault (green tree branch
    between HV phases) was identified during protection testing that neither the diesel
    nor the BESS inverter grid protection schemes could reliably isolate — the variable
    fault impedance caused intermittent current spikes insufficient to trip OC or
    EF relays, and the voltage collapse duty cycle was less than the UV relay delay
    period.
  lesson_learnt: When commissioning protection systems for remote distribution networks,
    test for high-impedance organic fault scenarios — existing OC and EF protection
    may be unable to clear this fault type regardless of whether a diesel or BESS
    grid is used; plan a trial of advanced IED relays with high-impedance fault detection
    functions at sites where overhead lines pass through vegetation.
