    at the time and limited industry experience in managing cloud-event supply reliability
    — constraining the sector's ability to reduce diesel dependence.
  lesson_learnt: The historical industry barrier of <5% REF in remote diesel mini-grids
    was driven by both cost and knowledge gaps, not fundamental technical limits;
    NT SETuP demonstrated that ~15% REF is achievable with standard grid-following
    PV and minimal changes to existing diesel control systems, providing a new reference
    class for future remote power projects.
