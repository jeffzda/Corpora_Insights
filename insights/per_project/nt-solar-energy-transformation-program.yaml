  intervention_note: Voltage unbalance (AS4777.2 Section 6.3.2.4) and frequency monitoring
    (AS4777.2 Section 7.3) anti-islanding functions were disabled on all 40 SMA PV
    inverters; full-rated PV output was then achieved without instability.
