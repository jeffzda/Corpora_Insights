  source_title: Solar/Diesel Mini-Grid Handbook 2nd Edition
  publish_date: '2019'
  project_name: Solar Energy Transformation Program (SETuP) – remoteness challenges
  what_happened: The SETuP program encountered extensive remoteness-related delivery
    challenges across its 24 remote Northern Territory community sites, including
    limited Regular Passenger Transport (RPT) with baggage restrictions, wet-season
    road closures, high barge costs, no mobile coverage or internet, limited local
    specialist labour, and high mobilisation costs for site inspections and defect
    rectifications.
  lesson_learnt: Remote solar mini-grid programs require dedicated experienced logistics
    personnel, additional cost contingencies and schedule float, sufficient on-site
    spare parts, satellite communications, and careful packaging for rough road and
    barge transport — remoteness costs must be explicitly quantified and budgeted,
    not treated as standard project risk.
