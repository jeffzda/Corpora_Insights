- record_id: ARENA-DLV-17764
  source_title: SETuP Knowledge Sharing – Daly River Lessons Learnt
  publish_date: 2019-09
  project_name: Daly River High Contribution Project
  what_happened: On Australia Day 2018, a severe lightning storm caused 29 of 40 PV
    inverters to require replacement and communications cards to fail in a further
    4, despite an extensive lightning protection system having been designed and reviewed
    by the EPC, Power and Water, and a third-party consultant — the protection scheme
    had focused on the PV array but did not include surge protection on CAT6 communications
    cables linking the inverters.
  lesson_learnt: Lightning protection for PV systems in high-strike regions must explicitly
    cover all communications pathways, not just power circuits — specify interposing
    surge protection devices on all communications daisy chains (inverters, irradiance
    sensors, weather stations) and graded Type 1/2/3 SPDs on all ancillary equipment
    power supplies; do not rely on general AS/NZS 1768 compliance without prescribing
    explicit communication surge protection requirements in the contract.
  issue_severity: major
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: commissioning/integration
