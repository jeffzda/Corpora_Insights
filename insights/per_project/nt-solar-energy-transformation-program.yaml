  source_title: SETuP – Lessons Learnt Report – Remoteness Challenges
  publish_date: 2019-09
  project_name: Solar Energy Transformation Program (SETuP)
  what_happened: Safety risks across the SETuP program were substantially elevated
    by the remoteness of sites — limited health services, complex medical evacuation
    logistics, unpredictable community unrest due to infrequent police presence, and
    significant animal hazards (camp dogs, camels, crocodiles, snakes, buffalos) all
    presented risks not present on urban or regional sites.
  lesson_learnt: Develop remote-specific health, safety, and environmental plans that
    explicitly address medical evacuation logistics, community safety protocols, and
    animal hazard management — standard urban or regional HSE plans are inadequate
    for remote Northern Territory deployments and will underestimate the severity
    and variety of safety risks.
