- record_id: ARENA-DLV-1853
  source_title: SETuP – Lessons Learnt Report – Rollout Challenges
  publish_date: 2019-09
  project_name: Solar Energy Transformation Program (SETuP)
  what_happened: Geotechnical studies used only four or five sample points per lease
    area, which was insufficient to identify localised hard rock zones within otherwise
    easier ground conditions, leading to unforeseen construction difficulties.
  lesson_learnt: Increase geotechnical sampling density for remote multi-site programmes
    — four to five sample points per site is insufficient to capture localised subsurface
    variability; plan and budget for more comprehensive pre-construction investigation.
