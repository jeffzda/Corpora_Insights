- record_id: ARENA-DLV-61120
  source_title: Solar/Diesel Mini-Grid Handbook 2nd Edition
  publish_date: '2019'
  project_name: Solar/Diesel Mini-Grid Handbook – general diesel minimum loading guidance
  what_happened: In remote solar/diesel hybrid systems, the minimum load factor of
    diesel generators (historically 40–60% of nameplate rating) limits the proportion
    of community load that solar can serve because the diesel generator must remain
    online and above its minimum load at all times. Oversized generators relative
    to the load can reduce solar penetration to zero.
  lesson_learnt: Engine size and solar array capacity decisions must be made together
    — a generator sized too large for the community load eliminates solar hosting
    capacity entirely, and the relationship must be analysed on a case-by-case basis
    before finalising either the solar array size or any generator upgrade.
