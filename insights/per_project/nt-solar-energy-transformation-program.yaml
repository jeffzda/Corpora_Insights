- record_id: ARENA-DLV-70665
  source_title: NT SETuP Performance Report 2
  publish_date: 2020-10
  project_name: Solar Energy Transformation Program (SETuP)
  what_happened: The Nyirripi community achieved 29% REF from a 200 kW fixed-tilt
    array — nearly double the program target — by using a high-pressure common-rail
    diesel generator capable of 10% minimum loading. However, this came with approximately
    50% curtailment of potential yield during cooler low-demand months, with the community
    load varying by a factor of three between seasonal peaks and troughs.
  lesson_learnt: A high-flexibility (low minimum load) diesel generator enables a
    fixed-tilt solar array to achieve well above the nominal 15% REF target without
    storage, but only at the cost of significant seasonal curtailment — this trade-off
    is economically valid where diesel fuel costs are high and storage investment
    is not yet justified, and should be modelled explicitly at design stage.
