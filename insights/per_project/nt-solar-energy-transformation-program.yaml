  what_happened: Operations staff had an initial tendency to isolate the solar array
    whenever engine or grid instability issues were identified, sometimes leading
    to longer-than-intended array outages rather than adjusting diesel minimum load
    settings to manage the instability.
  lesson_learnt: Operations training for solar-diesel hybrid systems should explicitly
    instruct coordinators to adjust diesel generator minimum load settings in response
    to engine or grid instability events, rather than defaulting to solar array isolation
    — the latter is a blunt instrument that unnecessarily sacrifices renewable yield.
