  what_happened: Local stores in remote communities had limited construction tools
    and equipment in stock, local specialist labour skills were scarce, and local
    plant and machinery were very limited, often non-functional or unreliable, creating
    schedule risk and constraining defect rectification.
  lesson_learnt: Plan for full self-sufficiency in tools, equipment, and specialist
    labour when working in remote communities — local procurement and subcontracting
    assumptions that apply on urban or regional sites will not hold, and defect rectification
    may require expensive fly-in specialists if local capacity is not pre-confirmed.
