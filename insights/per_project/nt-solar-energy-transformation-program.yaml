  what_happened: Continuous logging of diesel generator minimum load set-point parameters
    into the Pi Historian was not implemented until late 2019, meaning that for the
    2018/19 analysis period these critical curtailment-driver parameters had to be
    inferred from engine performance analysis rather than directly observed.
  lesson_learnt: Key diesel generator operating parameters — particularly minimum
    load set points that directly determine the solar window — should be logged continuously
    in the central data historian from program commissioning; absence of this data
    prevents rigorous attribution of curtailment to specific operational causes and
    delays optimisation decisions.
