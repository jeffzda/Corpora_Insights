  source_title: NT SETuP Performance Report 3
  publish_date: 2022-06
  project_name: Solar Energy Transformation Program (SETuP)
  what_happened: Weather station maintenance and data validation proved challenging
    across the 10 SETuP sites where stations were installed, with array operational
    performance prioritised over weather station upkeep. As a result, the performance
    report relied primarily on Atonometrics device data rather than dedicated meteorological
    reference cells, limiting the accuracy of soiling loss and module degradation
    analysis.
