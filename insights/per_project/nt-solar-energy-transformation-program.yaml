  project_name: Solar Energy Transformation Program (SETuP)
  what_happened: The mobilisation cost for maintenance visits to remote communities
    such as Maningrida — an 8–10 hour drive from Darwin on largely unsealed roads,
    subject to tidal river crossings and wet season closures — adds at least two additional
    labour days plus accommodation costs, or a charter flight cost of approximately
    $4,000 for a day trip, making individual minor rectification works economically
    difficult to justify.
  lesson_learnt: For remote off-grid solar programs, the high cost of mobilisation
    to site should be a primary driver of system design choices — prioritise equipment
    reliability, on-site spare parts holdings, and local operator capability to perform
    minor repairs, and batch maintenance interventions to maximise cost-effectiveness
    of each mobilisation.
