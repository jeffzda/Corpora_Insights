  what_happened: Electrical surge damage was the second largest cause of PV array
    downtime, accounting for 36% of inverter-days lost (2,309 inverter-days) across
    the portfolio. Surges caused damage to communications modules, control modules
    and entire inverters, and were the primary driver of elevated downtime at Daly
    River and Minyerri.
  lesson_learnt: In-line surge arrestors protecting inverter communications and control
    modules represent high-value, low-cost points of failure in remote solar arrays
    exposed to lightning. Ensuring adequate surge protection is installed and that
    replacement surge arrestors are stocked at regional centres for rapid deployment
    by trained operators is a practical and cost-effective availability improvement
    measure.
