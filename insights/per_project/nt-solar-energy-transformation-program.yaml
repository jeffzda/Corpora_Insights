- record_id: ARENA-DLV-46734
  source_title: NT SETuP Performance Report 1
  publish_date: 2020-10
  project_name: Solar Energy Transformation Program (SETuP)
  what_happened: The SETuP design philosophy deliberately chose not to specify module
    cleaning as a regular maintenance activity, instead siting the Atonometrics reference
    module within the array to capture soiling effects representative of the whole
    array — accepted as part of the performance monitoring approach given remote location
    constraints and bore water quality limitations.
  lesson_learnt: For remote off-grid solar programs where module cleaning is logistically
    impractical, monitoring instrument design should account for soiling as part of
    the performance baseline rather than treating it as an abnormal loss; embedding
    the reference cell within the array (rather than as a free-standing clean reference)
    provides a more operationally representative estimate of available power but precludes
    separate quantification of soiling losses.
