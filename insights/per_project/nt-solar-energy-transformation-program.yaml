  what_happened: Horizon Power's analysis found that a utility-controlled feed-in
    management device (rather than mandatory batteries for smoothing) was the lowest
    total cost approach to enabling medium solar contribution levels on its remote
    diesel mini-grids in the Kimberley. The device incorporated a 3G SCADA connection
    and used two curtailment algorithms.
  lesson_learnt: Before specifying batteries for solar output smoothing on small remote
    diesel mini-grids, evaluate whether a utility-controlled feed-in management device
    with curtailment algorithms can achieve the same stability outcome at lower total
    cost — Horizon Power found this approach eliminated the need for batteries while
    achieving up to 50% peak solar contribution.
