- record_id: ARENA-DLV-61134
  source_title: Solar/Diesel Mini-Grid Handbook 2nd Edition
  publish_date: '2019'
  project_name: Solar/Diesel Mini-Grid Handbook – diesel low load operation risks
  what_happened: In remote mini-grids operating solar/diesel hybrid systems, sustained
    low loading of diesel generators caused cylinder glazing and wet stacking issues
    in some deployments, requiring premature maintenance or engine rebuilding. Some
    deleterious effects such as cylinder glazing cannot be recovered from if corrective
    action is taken too late.
  lesson_learnt: Implement active monitoring for low-load engine damage (oil testing,
    oil consumption records, borescope inspection) and establish a proactive periodic
    high-loading cleaning cycle before deploying low-load diesel engine configurations
    — waiting for visible symptoms risks irreversible cylinder damage.
