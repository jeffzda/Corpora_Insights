- record_id: ARENA-DLV-70652
  source_title: NT SETuP Performance Report 2
  publish_date: 2020-10
  project_name: Solar Energy Transformation Program (SETuP)
  what_happened: Cluster controller (plant controller) software failures were the
    single largest cause of array downtime in 2019/20, accounting for 48% of all inverter-days
    lost (2,409 inverter-days). The device is no longer in production and the latest
    firmware has not resolved the issue; replacement units do not guarantee resolution.
  lesson_learnt: For remote off-grid solar programs, plant controllers represent a
    critical single point of failure — specify equipment with a supported upgrade
    path and ensure replacement solutions are compatible with the SCADA network architecture
    before deployment, as retrofitting an incompatible replacement (requiring individual
    IP addressing not supported by the existing network scheme) can leave the issue
    unresolved for years.
