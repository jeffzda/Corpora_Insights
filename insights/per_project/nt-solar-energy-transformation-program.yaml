  outcome_class: re-scoped/adapted
  secondary_failure_mode: execution & logistics
  intervention_note: The array intended for Umbakumba was redeployed to spare land
    at Maningrida, which the EPC added to the end of its North East communities schedule.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id005
  - 2
  evidence_excerpt: Buried asbestos waste was identified at the community of Umbakumba
