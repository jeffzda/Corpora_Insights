  source_title: 'NT SETuP: A First Look at The Integration of PV and Diesel Power
    Stations in Remote Communities'
  publish_date: 2018-12
  project_name: Northern Territory Solar Energy Transformation Program (NT SETuP)
    — Nauiyu (Daly River)
  what_happened: At Nauiyu (Daly River), the combination of a 1 MW PV array, 2 MWh
    lithium-ion battery, and grid-forming inverter enabled 100% Renewable Power Fraction
    during daylight hours and up to 50% diesel fuel displacement overall — substantially
    exceeding what PV-only integration can achieve.
  lesson_learnt: To achieve very high renewable energy fractions (up to 50% annual
    diesel displacement and 100% daytime RPF) in remote diesel-dependent communities,
    a suitably sized battery paired with a grid-forming inverter is required; without
    the battery, system constraints cap RPF well below 100%.
