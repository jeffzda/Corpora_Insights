  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: BESS configured to transition to droop mode on heartbeat failure;
    PV cluster controller configured to ramp down over 10 minutes on comms loss; individual
    PV inverters assigned unique fallback delays from 1 to 40 minutes to prevent simultaneous
    disconnection.
  transferability: moderate
  delay_magnitude: null
  technology_domain: hybrid systems
  source_pages: &id045
