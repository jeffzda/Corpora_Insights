  project_name: Northern Territory Solar Energy Transformation Program (NT SETuP)
  what_happened: The NT SETuP program identified that achieving renewable fractions
    above the simple PV-diesel integration ceiling requires 'enabling technologies'
    such as cloud forecasting, low-load diesel generators, dynamic resistors, grid-forming
    inverters, and battery storage — standard grid-following PV inverters cannot independently
    form a grid.
  lesson_learnt: Project designers targeting high renewable energy fractions (substantially
    above 15%) in remote diesel microgrids should plan for enabling technologies from
    the outset — cloud forecasting, grid-forming inverters, and battery storage are
    all required to unlock fractions beyond what simple grid-following PV can achieve.
