  what_happened: The Tranche One program successfully installed 3,325 kW of solar
    capacity across 10 remote Aboriginal communities in the Northern Territory, with
    all sites operating within the overall design target of 15 per cent diesel savings
    in the first 12 months of operation and a very low incidence of vandalism and
    early equipment failures.
  lesson_learnt: A fleet-wide rollout of solar-diesel hybrid mini-grids for remote
