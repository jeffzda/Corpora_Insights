  what_happened: Where arrays were redistributed from their originally planned communities
    during Tranche 2, full remodelling was not completed in all cases; the previous
    after-curtailment yield estimate was retained or a proxy estimate used, meaning
    the modelled yield figures presented in performance tables are indicative rather
    than precise reference points for those sites.
  lesson_learnt: Any redistribution of array capacity during a solar rollout program
    should trigger mandatory remodelling at both the donor and recipient sites before
    performance targets are confirmed; using legacy or proxy model outputs as performance
    benchmarks for redesigned arrays undermines accountability and makes post-project
    evaluation unreliable.
