  source_title: SETuP – Lessons Learnt Report – Remoteness Challenges
  publish_date: 2019-09
  project_name: Solar Energy Transformation Program (SETuP)
  what_happened: Site inspections and defect rectifications across remote Northern
    Territory communities proved expensive due to high mobilisation costs, and regular
    passenger transport was often non-existent, infrequent, or subject to strict baggage
    limits, complicating crew and equipment movement.
  lesson_learnt: Build explicit mobilisation cost allowances into remote project budgets
    and engage logistics personnel with remote-area experience from the planning stage
    — the combination of limited RPT services and high charter costs makes unplanned
    site visits disproportionately expensive.
