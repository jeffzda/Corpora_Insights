  what_happened: After one year of continuous operation, battery state of health (SoH)
    remained at approximately 100% — better than the OEM estimate — due to favourable
    operating conditions including low C-rate cycling (modal value ≤0.25C), low average
    SoC, and cell temperatures within the OEM's recommended 23±5°C range for most
    of the year.
