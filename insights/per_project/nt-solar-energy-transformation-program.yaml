  what_happened: The BESS control system was designed to make PV and BESS operation
    feel as familiar as possible to Essential Services Operators trained only on diesel
    power stations — including preserving the same automatic start/stop behaviour,
    similar manual controls and HMI conventions — reducing the training burden for
    a role filled by people with varying backgrounds and education levels.
  lesson_learnt: Design BESS and PV control interfaces to mimic familiar diesel engine
    operating conventions (Auto/Manual, Start/Stop) wherever technically feasible
    — this significantly reduces ESO training time, improves acceptance of new technology,
    and enables routine servicing contractors unfamiliar with BESS/PV to safely operate
    the station in diesel-only mode without specialist retraining.
