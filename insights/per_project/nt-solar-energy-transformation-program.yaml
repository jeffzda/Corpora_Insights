  project_name: Daly River High Contribution Project
  what_happened: Power and Water required vendors to supply a comprehensive 10-year
    spare parts list as part of the tender and procured the vendor-recommended quantity
    of each spare part (including PLC controller, BMS spares, HVAC fans and pump spares)
    at the time of BESS commissioning — a practice aimed at ensuring operational life
    could be maintained regardless of future supply chain availability.
  lesson_learnt: Include a mandatory 10-year spare parts requirement in BESS tender
    documents and procure the vendor-recommended quantities at project commissioning
    — given the relative immaturity of the BESS industry and risk of component obsolescence,
    early procurement of critical spares is a cost-effective insurance measure for
    remote assets with long operational lives.
