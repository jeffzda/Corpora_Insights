- record_id: ARENA-DLV-17762
  source_title: SETuP Knowledge Sharing – Daly River Lessons Learnt
  publish_date: 2019-09
  project_name: Daly River High Contribution Project
  what_happened: Protection settings proven adequate for diesel-generator grids were
    insufficient when the system operated in diesel-off inverter mode, because the
    BESS had significantly lower fault current capability (1.7 kA vs 5 kA for diesel);
    three revisions of the protection strategy were required before a working adaptive
    scheme was proven.
  lesson_learnt: For BESS hybrid systems, design an adaptive protection scheme from
    the outset that automatically switches between higher OC limits for diesel-grid
    operation and lower limits for inverter-grid operation — engage a protection consultant
    to model fault current capabilities of both the BESS and diesel generators, and
    validate the scheme via both secondary injection testing and primary HV fault
    testing.
