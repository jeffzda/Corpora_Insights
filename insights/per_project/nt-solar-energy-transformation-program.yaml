  source_title: Solar/Diesel Mini-Grid Handbook 2nd Edition
  publish_date: '2019'
  project_name: Borroloola and Timber Creek Solar Arrays
  what_happened: Power and Water commissioned solar arrays at Borroloola and Timber
    Creek in 2018 using an east-west concertina configuration with a 1.4:1 DC to AC
    ratio, deployed on pre-fabricated arrays. Despite not achieving maximum yield
    per module, the configuration was space-efficient, produced higher annual output
    than optimal alignment, generated a flatter daily output profile, and significantly
    reduced time on site for construction.
  lesson_learnt: East-west concertina array configurations with high DC:AC ratios
    can deliver better annual yield and flatter daily output profiles than conventionally
    oriented arrays on constrained sites, and pre-fabrication significantly reduces
    on-site construction time and cost — both approaches should be considered for
    remote sites where construction time is a major cost driver.
