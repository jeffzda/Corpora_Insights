  source_title: SETuP – Lessons Learnt Report – Rollout Challenges
  publish_date: 2019-09
  project_name: Solar Energy Transformation Program (SETuP)
  what_happened: Site sequencing during construction was disrupted by road closures
    and rain, forcing construction teams to backtrack between sites and reducing programme
    efficiency across the remote NT network.
  lesson_learnt: Build explicit contingency into site sequencing plans for remote
    programmes to accommodate road closures and wet season rain — static site sequences
    will be disrupted in remote NT conditions and backtracking wastes significant
    time and cost.
