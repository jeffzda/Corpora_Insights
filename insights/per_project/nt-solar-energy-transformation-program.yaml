  project_name: Solar Energy Transformation Program (SETuP)
  what_happened: The Titjikala solar array had been oversized relative to community
    load because it received capacity redistributed from Numbulwar, where the proposed
    site was found unsuitable for a lease due to future inundation risk from rising
    sea levels. Without a BESS, the oversized array achieved only 11–16% REF in previous
    years.
  lesson_learnt: When array capacity is redistributed mid-program to a replacement
    community, the receiving site should be assessed for battery readiness and load
    matching — an oversized array without storage wastes the majority of its additional
    capacity, and identifying the community as 'battery-ready' at the time of redistribution
    accelerates the path to a subsequent BESS investment.
