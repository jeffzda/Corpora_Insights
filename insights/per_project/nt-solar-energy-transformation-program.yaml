- record_id: ARENA-DLV-17752
  source_title: SETuP Knowledge Sharing – Daly River Lessons Learnt
  publish_date: 2019-09
  project_name: Daly River High Contribution Project
  what_happened: Battery performance datasheets contained 'specmanship' — performance
    specifications did not apply across all expected operating conditions and states,
    making it difficult to obtain reliable battery life and degradation estimates
    from tender responses without a structured methodology.
  lesson_learnt: Require vendors to model battery degradation using the project's
    own charge/discharge duty cycle data (exported from techno-economic models at
    10-minute resolution), and verify that OEM degradation estimates correlate with
    the economic model's battery life assumptions — this is critical to ensuring the
    financial case rests on a sound battery renewal interval.
  issue_severity: moderate
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: Tender documents supplied vendors with Homer Pro charge/discharge
    data at 10-minute resolution and required OEM battery life estimates; the Homer
    model was then adjusted so its degradation curve correlated with OEM estimates
    to validate the economic model.
  transferability: broad
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id030
  - 15
  evidence_excerpt: There can be much 'specmanship' in battery datasheets, performance
