  source_title: NT SETuP Performance Report 2
  publish_date: 2020-10
  project_name: Solar Energy Transformation Program (SETuP)
  what_happened: The Daly River BESS and solar hybrid demonstrated that the investment
    required to further improve PV yield at medium-contribution sites through diesel
    fleet upgrades must be weighed against the likely near-term deployment of battery
    storage — installing a BESS enabling diesel-off operation would significantly
    improve yield from existing SETuP arrays without requiring any changes to the
    diesel fleet.
  lesson_learnt: When evaluating incremental diesel fleet upgrades to improve solar
    yield at remote hybrid sites, consider the investment timing against the expected
    BESS deployment horizon — if battery storage is likely within the asset lifecycle,
    deferring costly diesel modifications and investing in BESS earlier may deliver
    greater yield improvement at lower whole-of-life cost.
