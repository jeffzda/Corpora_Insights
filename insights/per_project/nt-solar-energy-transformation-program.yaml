  project_name: Solar Energy Transformation Program (SETuP)
  what_happened: Diesel engine maintenance accounted for 14% of all inverter-days
    of downtime (685 days), either through full PV curtailment driven by high minimum
    loading requirements of larger generators during engine run-in, or by coordinators
    disabling the PV array altogether during engine or grid instability events, sometimes
    resulting in longer-than-intended outages.
  lesson_learnt: Operational procedures for remote solar-diesel hybrids should instruct
    coordinators to adjust diesel engine minimum load settings rather than isolating
    the solar array when engine or grid instability is detected — isolation creates
    unnecessary and prolonged array downtime without addressing the underlying engine
    issue.
