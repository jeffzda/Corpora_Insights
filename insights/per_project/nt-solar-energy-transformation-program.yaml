  project_name: TKLN Solar Project (Ti Tree, Kalkarindji, Lake Nash)
  what_happened: The TKLN PPA required accurate solar system performance monitoring
    including irradiance measurement, but the project identified that it is very difficult
    to perfectly model solar output from a single irradiance variable, creating risk
    of performance measurement disputes under the PPA.
  lesson_learnt: In PPA contracts for solar/diesel mini-grids, the performance monitoring
    solution including irradiance measurement must be tightly specified with defined
    acceptable error tolerances — a single irradiance variable is insufficient to
    perfectly model solar output and creates commercial risk.
