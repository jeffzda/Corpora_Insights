- record_id: ARENA-DLV-70658
  source_title: NT SETuP Performance Report 2
  publish_date: 2020-10
  project_name: Solar Energy Transformation Program (SETuP)
  what_happened: Significant soiling effects were identified at multiple SETuP communities,
    particularly at northern sites with high humidity and adjacent unsealed roads.
    Maningrida's original array showed heavy dust accumulation on the front row of
    cells by June 2020 with no deliberate cleaning since commissioning, while comparison
    with the newer Tranche 2 array at the same site showed the potential for compounding
    accumulation over time.
  lesson_learnt: In remote communities with unpaved roads and high humidity, panel
    soiling can significantly exceed the standard 4% assumption used in modelling
    — establish a soiling monitoring protocol and schedule need-based cleaning using
    appropriate equipment, factoring in the cost and risk of mobilisation to remote
    sites and the potential for mineral-rich bore water to cause permanent damage
    to module coatings.
