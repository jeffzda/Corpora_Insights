  source_title: SETuP – Lessons Learnt Report – Remoteness Challenges
  publish_date: 2019-09
  project_name: Solar Energy Transformation Program (SETuP)
  what_happened: Lack of mobile phone coverage in many remote areas — and intermittent,
    unreliable service where coverage nominally existed — impaired project communications,
    compounded by minimal access to office equipment such as printers and scanners
    that were often not internet-connected.
  lesson_learnt: Provision satellite phones and offline-capable documentation workflows
    for all remote site deployments — mobile phone coverage and internet connectivity
    cannot be assumed in remote Northern Territory communities and communication failures
    will impair safety, coordination, and approvals processes.
