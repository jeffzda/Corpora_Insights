- record_id: ARENA-DLV-1851
  source_title: SETuP – Lessons Learnt Report – Rollout Challenges
  publish_date: 2019-09
  project_name: Solar Energy Transformation Program (SETuP)
  what_happened: Land acquisition across 26 remote Northern Territory communities
    averaged 18 months per lease after initial request, encompassing government processes
    and land council consultations. The lengthy and variable timing of lease approvals
    drove site bundling decisions rather than logistically optimal groupings.
  lesson_learnt: Identify and progress more community lease options than required
    from the outset — average lease timeframes of 18 months mean that delays at individual
    sites will disrupt programme sequencing unless a buffer of options is maintained.
  issue_severity: major
  project_type: generation
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: approvals/contracting
  proponent_type: utility/energy retailer
  delay_category: stakeholder/land/community
  failure_mode: regulatory & approvals
  outcome_class: re-scoped/adapted
  secondary_failure_mode: coordination & stakeholders
  intervention_note: Some smaller sites were removed from scope in exchange for a
    smaller number of larger sites, which also proved more economical for equivalent
    diesel savings.
  transferability: moderate
  delay_magnitude: 1-3 years
  technology_domain: solar PV
  source_pages: &id001
  - 2
  evidence_excerpt: The average timeframe for obtaining a lease after submitting an
    initial request was eighteen months, including Government processes as well as
    land council consultations and processes.
