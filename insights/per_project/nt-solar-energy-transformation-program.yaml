- record_id: ARENA-DLV-18351
  source_title: NT SETuP Performance Report 3
  publish_date: 2022-06
  project_name: Solar Energy Transformation Program (SETuP)
  what_happened: Daly River failed to achieve its 50% Renewable Energy Fraction (REF)
    target for 2020-21, achieving only 39.3% (45% excluding unavailability periods).
    PV system unavailability rose sharply to 15.3% from 1.6% in the prior period,
    driven by electrical surges from lightning damaging communications systems and
    cluster controller failures, compounded by a 13% increase in community load.
  lesson_learnt: In remote off-grid solar-BESS hybrid systems, lightning protection
    and surge arrestor design for communications and control systems are critical
    reliability factors — a single period of elevated lightning activity can drive
    PV unavailability from under 2% to over 15% and cause the system to miss its REF
    target by a wide margin. Redundant surge protection and rapid-replacement spares
    protocols should be designed in from the outset.
