  project_name: Daly River High Contribution Project
  what_happened: The Daly River project achieved 3,693 avoided diesel engine run hours
    (42% reduction) in the first year, reducing operational and maintenance costs
    and deferring diesel engine capital replacement — but this benefit was not included
    in the original project business case and was only quantified retrospectively
    using historical $/hr engine operational costs.
  lesson_learnt: Include avoided diesel engine run-hour savings as a distinct value
    stream in BESS project business cases — calculate a site-specific $/hr operational
    cost from historical records (covering service contracts, consumables, ESO labour),
    enter it into the techno-economic model as an hourly cost, and include capital
    replacement deferral based on slowed hour accumulation; these savings can be significant
    relative to fuel savings alone.
