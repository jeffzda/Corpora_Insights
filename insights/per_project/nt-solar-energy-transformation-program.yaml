  what_happened: The PVSyst P50 yield estimate provided by the PV EPC was approximately
    10% higher than actual available PV yield (PVAvail), and even in months when all
    inverters were working correctly, actual yield never equalled the monthly PVSyst
    estimate; the original Homer Pro model used for the BESS tender was more conservative
    and more accurately predicted actual performance.
  lesson_learnt: Treat EPC-supplied PVSyst yield estimates with caution and cross-check
    against independent Homer Pro or other modelling — PVSyst P50 estimates may embed
    optimism bias; ensure irradiance and soiling monitoring equipment is operational
    from day one and protected against lightning surge to enable accurate ongoing
    yield tracking and spill quantification.
