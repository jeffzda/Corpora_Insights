  what_happened: Power and Water opted to self-perform BESS system integration rather
    than purchase a vendor-supplied 'out of the box' integrated control system, recognising
    the strategic importance of developing in-house BESS expertise to avoid vendor
    lock-in and enable best-of-breed technology selection for future projects — accepting
    that this approach would be more challenging and costly for the first project.
  lesson_learnt: Utilities deploying their first BESS project should consider the
    strategic value of in-house system integration capability over vendor-supplied
    turnkey solutions — accepting higher first-project delivery risk and cost builds
    organisational capability that enables vendor independence, technology flexibility,
    and significantly lower costs on subsequent projects; this approach requires a
    learning culture and executive support to work through inevitable challenges.
