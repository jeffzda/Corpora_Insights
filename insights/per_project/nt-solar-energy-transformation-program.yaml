  source_title: NT SETuP Performance Report 3
  publish_date: 2022-06
  project_name: Solar Energy Transformation Program (SETuP)
  what_happened: Cluster controller failures were the single largest cause of PV array
    downtime across the SETuP portfolio in 2020-21, accounting for 46% of all inverter-days
    lost (2,889 inverter-days). The failures were predominantly software-related seize-ups
    requiring a power cycle to restore functionality. The controller is no longer
    in production and the latest firmware has not resolved the issue.
  lesson_learnt: When deploying solar arrays at remote sites, avoid specifying control
    equipment that is approaching end-of-life or likely to go out of production during
    the asset's operational life. When a cluster controller becomes unsupported, a
    funded replacement pathway should be pre-planned — relying on remaining spare
    units of the same obsolete device does not resolve underlying software instability.
