  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Engaged a protection consultant; upgraded station LV circuit
    breakers to IDMT relays; added UV trip delay devices; upgraded feeder relays to
    SPAJ141C with dual Group A/B settings; validated via secondary injection and primary
    HV fault testing in both diesel and BESS grid modes.
  transferability: moderate
  delay_magnitude: 3-12 months
  technology_domain: battery storage
