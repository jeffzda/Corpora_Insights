- record_id: ARENA-DLV-24063
  source_title: NT SETuP Performance Report 4
  publish_date: 2022-11
  project_name: Solar Energy Transformation Program (SETuP)
  what_happened: The Atonometrics reference module is not cleaned (other than at initial
    calibration), meaning its measurements reflect the soiling state of the module
    — assumed consistent with the entire array — but the device cannot independently
    measure module degradation because a separate calibrated irradiance reference
    cell is required for that purpose; independent reference cells were not included
    at every site.
  lesson_learnt: Programs deploying solar arrays at remote sites over multi-year periods
    should include an independent calibrated reference cell (separate from the monitoring
    module) at all sites — not just a subset — to enable degradation measurement;
    the SETuP approach of deploying dual-input Atonometrics only at Daly River and
    Bulman limited degradation analysis across the broader portfolio.
  issue_severity: minor
  project_type: generation
