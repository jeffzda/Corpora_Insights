  what_happened: The HVAC system accounted for approximately 4.8 kW average auxiliary
    load (of 5.2 kW total BESS auxiliary load), representing ~3% of energy stored
    in the BESS; BESS net efficiency (including HVAC and local loads) was 80–87% monthly,
    compared to 85–90% gross efficiency, indicating that HVAC auxiliary consumption
    is a significant efficiency penalty in hot tropical climates.
  lesson_learnt: In hot tropical climates, BESS HVAC auxiliary loads are a material
    efficiency penalty that must be factored into techno-economic modelling; strategies
    to reduce HVAC operating hours — including shutting down the BESS inverter during
    idle periods — can meaningfully improve net system efficiency and should be incorporated
    into the control strategy.
