  project_name: Daly River High Contribution Project
  what_happened: After an automated Novec 1230 fire suppression system was installed
    in the remote BESS, it was discovered that Australian Standard AS1851 requires
    monthly testing of all automatic fire protection systems — at remote Northern
    Territory communities accessible only by charter flight (>$5,000 per round trip),
    monthly compliance would severely compromise project economics.
  lesson_learnt: Before installing an automated fire protection system in a remote
    BESS, assess AS1851 testing obligations and their travel cost implications in
    the project business case — entities that self-insure may be able to adopt a risk-based
    approach with a reduced test interval, but insurers will expect full AS1851 compliance;
    if monthly travel costs are prohibitive, consider whether a fire protection system
    is warranted given the battery system's inherent multi-layer safety hierarchy.
