  project_name: Daly River High Contribution Project
  what_happened: During site acceptance testing at ambient temperatures exceeding
    40°C and humidity of 50–90%, the BESS HVAC thermal protection tripped during full-power
    discharge testing because the vendor's Germany-based steam-bath simulation could
    not replicate actual Daly River climatic conditions; the system failed its thermal
    test and required vendor modification.
  lesson_learnt: Specify in tender documents that full-power thermal testing must
    be conducted under worst-case environmental conditions (high ambient temperature
    and humidity) — equipment pre-tested in a cool-climate factory may not perform
    to specification under tropical operating conditions; if seasonal timing prevents
    this at commissioning, include contractual retesting provisions with financial
    claw-back mechanisms.
