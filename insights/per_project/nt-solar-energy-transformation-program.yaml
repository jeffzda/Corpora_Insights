- record_id: ARENA-DLV-1855
  source_title: SETuP – Lessons Learnt Report – Rollout Challenges
  publish_date: 2019-09
  project_name: Solar Energy Transformation Program (SETuP)
  what_happened: Buried asbestos waste was discovered at the Umbakumba community during
    clearing, rendering the site uneconomical to continue due to the cost of remediation
    required to make it safe for construction. The solar array intended for Umbakumba
    was redeployed to spare land at Maningrida.
  lesson_learnt: Maintain programme flexibility to redeploy assets when a site must
    be abandoned due to contamination — having a pre-identified alternative location
    (as at Maningrida) allowed the Umbakumba array to be absorbed without programme
    loss.
  issue_severity: major
  project_type: generation
  project_scale_band: programmatic/portfolio-level
