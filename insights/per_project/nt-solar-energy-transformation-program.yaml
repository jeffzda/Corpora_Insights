- record_id: ARENA-DLV-17766
  source_title: SETuP Knowledge Sharing – Daly River Lessons Learnt
  publish_date: 2019-09
  project_name: Daly River High Contribution Project
  what_happened: The power station control system, including BESS and PV integration,
    was developed and modified in-house using a code base derived from the existing
    diesel control system, without a dedicated test facility or formal state-machine
    design; the scope of changes was more profound than any previous diesel control
    system modifications and led to integration challenges and delays.
  lesson_learnt: Before undertaking major control system integration for a hybrid
    BESS-PV-diesel system, refactor the control software into a state machine design,
    develop a simulation environment for offline testing, and adopt formal change
    management methods — these improvements can be achieved without a physical test
    facility and will substantially reduce integration time and on-site rental costs.
  issue_severity: major
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: commissioning/integration
