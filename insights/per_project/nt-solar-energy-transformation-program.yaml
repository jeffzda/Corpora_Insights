- record_id: ARENA-DLV-61129
  source_title: Solar/Diesel Mini-Grid Handbook 2nd Edition
  publish_date: '2019'
  project_name: Solar/Diesel Mini-Grid Handbook – VAr sharing guidance
  what_happened: In solar/diesel hybrid mini-grids, adding solar at unity power factor
    reduced the effective power factor seen by the diesel generator's alternator voltage
    regulator (AVR), because the solar generator does not contribute reactive power.
    At high solar penetrations, a fixed lagging inverter power factor setting can
    force the generator into a leading power factor condition that the AVR cannot
    regulate, risking system instability.
  lesson_learnt: Configure solar inverters to operate at unity power factor in solar/diesel
    hybrid mini-grids unless VAr sharing with the diesel generator is explicitly designed
    and validated — fixed lagging inverter power factor at high penetration can cause
    generator AVR instability and system collapse.
  issue_severity: moderate
