  project_name: NT SETuP (Northern Territory Solar Energy Transformation Program)
  what_happened: At Ramingining, a demand threshold near midday triggered a generator
    switch to a unit with a higher minimum loading setting, forcing a corresponding
    increase in PV curtailment — demonstrating that changes in generator dispatch,
    not just weather, can reduce renewable energy yield.
  lesson_learnt: Variable renewable generation yield in diesel hybrid systems is not
    solely determined by weather — changes in generator dispatch patterns (e.g. switching
    to a unit with a higher minimum load) will also force PV curtailment; this trade-off
    between system stability and fuel savings must be explicitly evaluated and communicated
    to all stakeholders.
