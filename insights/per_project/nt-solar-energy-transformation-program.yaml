- record_id: ARENA-DLV-1852
  source_title: SETuP – Lessons Learnt Report – Rollout Challenges
  publish_date: 2019-09
  project_name: Solar Energy Transformation Program (SETuP)
  what_happened: Site bundling into construction packages was dictated by the timing
    of when individual leases were secured rather than by logistically sensible groupings,
    increasing travel and coordination complexity across a programme spanning over
    one million square kilometres.
  lesson_learnt: Plan site sequencing and bundling around logistical efficiency from
    the start; if lease timing forces non-optimal groupings, build in explicit logistics
    management resources to absorb the resulting coordination complexity.
