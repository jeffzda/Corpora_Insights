  what_happened: The BESS concrete footing slab — designed with six raised plinths
    and integrated cable pits — consumed approximately 5% of total project expenditure
    because remote construction required an on-site concrete batching plant and local
    excavation; alternative lower-cost methods were not investigated prior to construction.
  lesson_learnt: For remote BESS projects, evaluate precast concrete plinths with
    shims as an alternative to poured in-situ slabs before finalising the footing
    design — significant cost savings are achievable while remaining compatible with
    side-lifter delivery of the BESS container.
