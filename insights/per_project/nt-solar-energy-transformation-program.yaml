  what_happened: At Titjikala, 10 of 16 inverters were disabled to remove the risk
    of reverse-powering the station, reducing available capacity by 62.5% and resulting
    in only 21% of Atonometrics potential yield being captured despite a 17.6% REF
    being achieved. The community was awaiting a planned BESS project to resolve the
    underlying system design constraint.
  lesson_learnt: Where array oversizing relative to diesel minimum load creates reverse-power
    risk, the interim operational fix of disabling inverters is costly in lost yield
    — plan for battery storage from the outset at high-REF sites to avoid this constraint,
    rather than retrofitting storage after inverter disabling has become the workaround.
