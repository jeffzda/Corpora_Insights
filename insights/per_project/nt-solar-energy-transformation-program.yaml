- record_id: ARENA-DLV-61133
  source_title: Solar/Diesel Mini-Grid Handbook 2nd Edition
  publish_date: '2019'
  project_name: Distributed Generation – Alice Springs Investigation
  what_happened: An ARENA-supported research project in 2013–2014 measured solar irradiance
    variability across nine geographically dispersed sites in the Alice Springs region.
    It found that on highly variable days, a single site could experience step changes
    in PV generation of up to 50–60%, while aggregating nine dispersed sites reduced
    the largest step change to below 150 W/m² — demonstrating significant grid stability
    benefit from geographic diversity.
  lesson_learnt: Geographic dispersion of distributed solar generation across a grid
    network significantly reduces net irradiance variability and step-change risk
    — this finding should inform the placement strategy for utility-scale solar arrays
    and the management of customer DER in remote and regional grids.
