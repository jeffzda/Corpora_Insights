  source_title: NT SETuP Performance Report 1
  publish_date: 2020-10
  project_name: Solar Energy Transformation Program (SETuP)
  what_happened: The SETuP arrays were sized based on 2013–14 load data and diesel
    fleet parameters; by 2018/19 community loads had shifted materially — for example,
    Mt Liebig system load grew 46% from 2013/14 to 2018/19 — meaning array sizes were
    no longer optimal for the actual operating context at several sites.
  lesson_learnt: Solar-diesel hybrid array sizing modelling should incorporate sensitivity
    analysis around load growth and contraction scenarios, and design assumptions
    should be reviewed at key programme decision points rather than locked in from
    initial modelling; a four-to-five year gap between modelling and commissioning
    is sufficient for community loads to shift by 40%+ in remote NT contexts.
