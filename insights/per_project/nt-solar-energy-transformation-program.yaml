  what_happened: Continuous logging of diesel generator minimum load set points into
    the central PI Historian was only implemented in late 2019 — well after the first
    arrays were commissioned in 2017 — meaning that manual records of parameter changes
    prior to that date were limited and could only be inferred from engine performance
    analysis.
  lesson_learnt: Operational control parameters that directly affect renewable yield
    — such as diesel generator minimum load set points — should be logged in the central
    data historian from the start of commissioning, not added retrospectively; the
    gap in Historian coverage prevented precise retrospective analysis of curtailment
    drivers for the first two years of operation.
