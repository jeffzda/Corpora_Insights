- record_id: ARENA-DLV-17784
  source_title: SETuP Knowledge Sharing – Daly River Lessons Learnt
  publish_date: 2019-09
  project_name: Daly River High Contribution Project
  what_happened: The Daly River project total capital expenditure was $6.59M (GST
    exclusive), with PV accounting for 60% ($3.98M) and BESS and commissioning 40%
    ($2.68M); after a 50% capital grant, simple payback was 8.5 years. The document
    notes significant cost reductions in BESS technology since the 2016 tender award,
    and identifies that future projects should be designed for least-cost energy supply
    rather than a fixed fuel savings target.
  lesson_learnt: Design future remote BESS-PV projects for least-cost energy supply
    (minimising net present cost) rather than a fixed percentage fuel savings target
    — the Daly River 50% target required additional battery capacity beyond the economic
    optimum (~45% savings); with falling PV and BESS costs, the economics of high-contribution
    sites are improving rapidly and each project should be modelled on current costs.
