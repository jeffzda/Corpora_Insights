  source_title: SETuP – Lessons Learnt Report – Rollout Challenges
  publish_date: 2019-09
  project_name: Solar Energy Transformation Program (SETuP)
  what_happened: EPC work was split into separate Civil, Framing, and Electrical teams
    each moving between sites independently. This increased logistical complexity
    but minimised downtime for each trade and reduced pressure on limited accommodation
    in remote communities.
  lesson_learnt: In remote multi-site programmes with constrained accommodation, splitting
    EPC work into trade-specific teams that leapfrog between sites reduces idle time
    and accommodation pressure, despite the additional coordination overhead.
