  publish_date: 2019-09
  project_name: Solar Energy Transformation Program (SETuP) – Tranche One
  what_happened: Multiple practical completion (PC) dates with associated liquidated
    damages per site created contractual complexity without achieving better schedule
    outcomes; the NTP-linked end dates also failed to produce a clear overall contract
    completion date.
  lesson_learnt: Link liquidated damages to an overall percentage of kW capacity completed
    rather than per-site PC dates, and specify a firm overall completion date independent
    of NTP issuance dates — per-site PC/LD structures added complexity without improving
    schedule adherence in a multi-site program.
