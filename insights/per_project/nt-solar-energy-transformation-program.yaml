  what_happened: The SETuP program rolled out 10 MW of solar across 25 remote Northern
    Territory communities and was completed in 2019 at a total cost of $59 million.
    Across the 24 sites without battery storage, average diesel displacement was 15%,
    while the flagship battery-equipped site at Daly River (1 MW solar / 2 MWh battery)
    achieved 50% diesel savings.
