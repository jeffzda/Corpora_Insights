- record_id: ARENA-DLV-70656
  source_title: NT SETuP Performance Report 2
  publish_date: 2020-10
  project_name: Solar Energy Transformation Program (SETuP)
  what_happened: Active curtailment of PV output by diesel engine minimum load requirements
    was the primary limiter of yield across the program, with estimated curtailment
    ranging from near zero at optimal sites to 79% at Titjikala. The program was deliberately
    designed with approximately 30% curtailment expected, but several communities
    experienced substantially higher losses due to oversized arrays relative to load
    or high diesel minimum load settings.
  lesson_learnt: When sizing solar arrays for remote diesel-hybrid systems, model
    curtailment explicitly against the actual minimum load settings and seasonal load
    profile of each community — mismatches between array size and diesel fleet flexibility
    can result in curtailment far exceeding design assumptions, and the most cost-effective
    mitigation is procuring low-minimum-load diesel generators at end-of-life replacement
    rather than oversizing the solar array.
