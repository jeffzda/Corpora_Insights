  what_happened: The Daly River BESS suffered an unplanned outage when an air filter
    became blocked during a local controlled land-clearing burn, causing a temporary
    HVAC shutdown. This contributed to reduced PV yield from the array during the
    outage period.
  lesson_learnt: BESS installations in areas subject to controlled burns or dust events
    require enhanced air filtration maintenance protocols — increase filter inspection
    frequency during fire season and ensure rapid on-site response capability, as
    a single blocked filter can take down the entire storage system.
