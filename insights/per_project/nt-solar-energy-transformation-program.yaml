- record_id: ARENA-DLV-17760
  source_title: SETuP Knowledge Sharing – Daly River Lessons Learnt
  publish_date: 2019-09
  project_name: Daly River High Contribution Project
  what_happened: PV inverters configured to comply with AS4777.2 became unstable at
    mid-range power levels (400–500 kW) when operating in parallel with the BESS in
    diesel-off mode, due to the voltage unbalance detection function triggering in
    the higher-impedance inverter-formed grid — an issue not observed when operating
    with diesel generators.
  lesson_learnt: When integrating PV inverters into an inverter-formed microgrid (BESS
    diesel-off mode), disable the AS4777.2 voltage unbalance and frequency monitoring
    anti-islanding functions on the PV inverters — these functions are designed for
    stiff distribution networks and cause instability in high-impedance inverter-based
    grids; AS4777.2:2015 itself advises these should be off by default when the inverter
    supports it.
  issue_severity: major
