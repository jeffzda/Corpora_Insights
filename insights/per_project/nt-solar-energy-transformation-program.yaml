- record_id: ARENA-DLV-17102
  source_title: 'NT SETuP: A First Look at The Integration of PV and Diesel Power
    Stations in Remote Communities'
  publish_date: 2018-12
  project_name: Northern Territory Solar Energy Transformation Program (NT SETuP)
  what_happened: Fixed-level PV curtailment approaches common in hybrid power systems
    were found to be suboptimal for remote diesel-PV stations; the NT SETuP design
    instead used dynamic curtailment linked to engine selection, maximising PV utilisation
    while maintaining system security.
  lesson_learnt: In remote diesel-PV hybrid stations, use dynamic curtailment linked
    to the active generator's operating envelope rather than fixed curtailment levels
    — this maximises diesel fuel savings while preserving system security guarantees
    across varying demand profiles.
  issue_severity: minor
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id020
  - 4
  evidence_excerpt: While the technique of curtailing the output power of a PV system
    is common in hybrid power systems, it is typically employed at a fixed power level,
    or at a fixed percentage of the overall demand. By selecting the engine that would
    run, if PV were not available (or present), and then curtailing the PV to the
    engine's allowable minimum loading, the SETuP power stations are able to maximise
    the utilisation of PV power for the existing pattern of generator usage, while
    still providing strong system security guarantees.
