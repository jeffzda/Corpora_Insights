  project_name: Solar/Diesel Mini-Grid Handbook – general quality of supply guidance
  what_happened: In remote solar/diesel hybrid mini-grids, rapid changes in solar
    output beyond the spinning reserve or control system response capability can cause
    total system blackouts (power station black start events). Uncontrolled PV output
    that exceeds available load can also reverse-power the diesel generator, risking
    equipment damage and repeated system outage cycles after restoration.
  lesson_learnt: Carefully configure the control system to manage rapid solar output
    changes and protect against reverse powering of diesel generators — quality of
    supply constraints substantially determine the allowable solar penetration level
    and the cost of the control architecture required.
