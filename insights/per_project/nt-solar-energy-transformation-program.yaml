  publish_date: 2022-06
  project_name: Solar Energy Transformation Program (SETuP)
  what_happened: The SETuP program originally targeted 34 communities but was reduced
    to 24 medium-contribution sites. Several arrays were relocated or had their capacity
    redistributed during construction in response to challenges including unsuitable
    land, and in some cases remodelling was not completed after redistribution — the
    previous after-curtailment yield estimate was simply retained.
  lesson_learnt: When community lists or array sizes change during program delivery,
    remodelling of the affected sites should be treated as mandatory rather than optional
    — retaining pre-change yield estimates for relocated or resized arrays undermines
    the accuracy of performance benchmarking and can mask underperformance or mask
    genuine success.
