  failure_mode: unvalidated integration
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Implemented dynamic PV curtailment that adjusts maximum PV output
    in response to the currently selected diesel generator's allowable minimum loading,
    preserving system security without modifying the existing diesel control system.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
