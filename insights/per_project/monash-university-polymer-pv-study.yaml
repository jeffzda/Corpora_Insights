  publish_date: '2019-08-28'
  project_name: Bringing All-Polymer Solar Cells Closer to Commercialization
  what_happened: TRMC was validated as a rapid screening technique for all-polymer
    solar cell materials, showing good correlation between the TRMC figure of merit
    and short-circuit current. However, fill factor — a key efficiency parameter —
    did not correlate well with TRMC results, limiting the predictive completeness
    of the technique.
  lesson_learnt: TRMC is a reliable rapid screen for short-circuit current potential
    in all-polymer photovoltaic systems, but should not be used as a sole predictor
    of full device efficiency — fill factor prediction remains a gap and device fabrication
    will still be needed to fully characterise candidate materials.
