- record_id: ARENA-DLV-1703
  source_title: Bringing All-Polymer Solar Cells Closer to Commercialization - Lessons
    Learnt 2
  publish_date: 2021-09
  project_name: Bringing All-Polymer Solar Cells Closer to Commercialization
  what_happened: Standard laboratory spin-coating fabrication techniques used to produce
    sub-0.1 cm² cells cannot be scaled to manufacturing dimensions, creating a translation
    barrier between laboratory efficiency results and commercial production. The project
    identified blade coating as a scalable laboratory technique whose drying and coating
    conditions are comparable to roll-to-roll and slot-die manufacturing processes.
  lesson_learnt: Polymer solar cell research projects targeting commercialisation
    should replace spin-coating with blade coating at the laboratory screening stage
    — this ensures efficiency results are obtained under conditions translatable to
    large-area manufacturing processes such as roll-to-roll printing, avoiding a late-stage
    discovery that lab results do not replicate at scale.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: Adopted blade coating as the primary laboratory fabrication technique
    to replicate large-area manufacturing conditions, successfully producing cm² cells
    with only modest efficiency reduction compared to small spin-coated cells.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id003
  - 4
  - 5
  - 12
  - 13
  evidence_excerpt: Differences between how long it takes for films to dry in this
    'roll-to-roll' coating process compared to spin-coating can mean that good efficiencies
    achieved using spin-coating are sometimes not realised when large area coating
    processes are used... The coating and drying conditions for blade coating are
    similar to large area printing techniques such as slot-die coating, so that if
    good efficiencies can be achieved in the laboratory they can be translated to
    larger area coating processes.
  confidence_note: null
