  secondary_failure_mode: null
  intervention_note: Explored and systematically optimised direct arylation polymerisation
    reaction conditions across 100+ batches, achieving gram-scale synthesis with high
    molecular weights and minimal toxic waste.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
