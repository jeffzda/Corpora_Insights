- record_id: ARENA-DLV-1705
  source_title: Bringing All-Polymer Solar Cells Closer to Commercialization - Lessons
    Learnt 2
  publish_date: 2021-09
  project_name: Bringing All-Polymer Solar Cells Closer to Commercialization
  what_happened: Upscaling all-polymer solar cell fabrication from 0.045 cm² to 1.0
    cm² using blade coating revealed a systematic decrease in fill factor with increasing
    active area, attributed to increased series resistance in larger cells. This resistance
    limitation was not apparent at laboratory scale and represents a remaining technical
    barrier to further upscaling.
  lesson_learnt: Future projects upscaling all-polymer solar cells beyond the cm²
    range should prioritise strategies to mitigate series resistance (e.g. grid electrode
    design, improved charge transport layers) — series resistance degradation with
    area is a predictable and known failure mode that must be addressed before roll-to-roll
    trials can achieve commercially relevant efficiencies.
