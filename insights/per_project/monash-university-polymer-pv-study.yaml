- record_id: ARENA-DLV-68001
  source_title: Bringing All-Polymer Solar Cells Closer to Commercialization Lessons
    Learnt 1
  publish_date: '2019-08-28'
  project_name: Bringing All-Polymer Solar Cells Closer to Commercialization
  what_happened: Photochemical stability testing of solar polymers was hampered by
    variability in film thickness between and across samples, causing inconsistent
    absorbance measurements over time. Some films were also prepared too thick, making
    photobleaching characterisation difficult.
  lesson_learnt: Establish tight film thickness control protocols before commencing
    photochemical stability experiments — thickness variability across and between
    samples introduces measurement artefacts that compromise absorbance-vs-time data
    and extend characterisation time.
  issue_severity: moderate
  project_type: null
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: data/validation/testing
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: null
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id007
  - 7
  evidence_excerpt: Two problems encountered were variability in film thickness between
    different samples, and variability in film thickness across different samples.
    Variability in film thickness across the same sample led to variability in plots
    of absorbance vs. time since measurements were taken on slightly different spots
    on the sample which had slightly different thickness. Some films prepared were
    too thick which took too longer to photo bleach and were hard to characterise.
  confidence_note: lifecycle_phase assigned as development/design because the issue
    occurred during protocol establishment in the first half of the project, not during
    a discrete commissioning or operations phase.
