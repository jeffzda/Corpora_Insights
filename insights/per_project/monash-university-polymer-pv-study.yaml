  project_name: Bringing All-Polymer Solar Cells Closer to Commercialization
  what_happened: Despite demonstrating improved thermal stability, scalable synthesis,
    and cm²-scale fabrication, the project concluded that significant challenges remain
    in photochemical stability and encapsulation — key barriers to commercial viability
    that were not fully addressed within the project scope.
  lesson_learnt: Projects developing polymer solar cells for commercialisation should
    scope work to include photochemical stability assessment and encapsulation strategy
    development in parallel with efficiency and thermal stability work — deferring
    these to future projects leaves a persistent gap between demonstrated laboratory
    performance and commercially deployable products.
