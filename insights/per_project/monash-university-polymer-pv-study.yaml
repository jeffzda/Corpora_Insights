  publish_date: '2019-08-28'
  project_name: Bringing All-Polymer Solar Cells Closer to Commercialization
  what_happened: Blade-coating parameters (temperature, coating speed, substrate geometry)
    required re-optimisation after spin-coating parameters were adopted as the starting
    point, adding iterative work before good efficiencies were achieved. Adoption
    of a larger substrate geometry earlier in the process could have improved coating
    quality sooner.
  lesson_learnt: When transitioning from spin-coating to blade-coating, plan explicitly
    for parameter re-optimisation from the outset — adopt the larger substrate geometry
    and relevant coating conditions early rather than inheriting spin-coating defaults,
    as this reduces iterative rework and accelerates the achievement of good film
    quality.
