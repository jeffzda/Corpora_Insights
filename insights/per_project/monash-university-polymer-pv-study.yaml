  project_name: Bringing All-Polymer Solar Cells Closer to Commercialization
  what_happened: Blade-coating was demonstrated to reproduce spin-coating efficiencies
    for all-polymer solar cells across five material systems once thickness was optimised,
    confirming that lab-scale efficiencies in this technology class are translatable
    to large-area manufacturing processes.
  lesson_learnt: All-polymer solar cell blends are sufficiently robust that blade-coating
    — which replicates large-area roll-to-roll coating conditions — can reproduce
    spin-coating efficiencies once thickness is optimised; this lab-to-fab translation
    risk, which is a known problem for fullerene-based organic solar cells, does not
    appear to apply to all-polymer systems.
