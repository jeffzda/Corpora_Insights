  project_name: Bringing All-Polymer Solar Cells Closer to Commercialization
  what_happened: 'Stability testing revealed dramatic variation in photochemical stability
    across seven common solar polymers: two of the most widely used polymers lost
    all colour within a few hours of simulated sunlight, while others lasted over
    500 hours. This variation was not anticipated before the study.'
  lesson_learnt: Do not assume commonly used solar polymers possess adequate photochemical
    stability — systematic stability screening should be performed at the outset of
    any polymer solar cell development programme, as inherent stability varies drastically
    and poorly stable materials should be eliminated before investing in efficiency
    optimisation.
