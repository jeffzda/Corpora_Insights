- record_id: ARENA-DLV-1702
  source_title: Bringing All-Polymer Solar Cells Closer to Commercialization - Lessons
    Learnt 2
  publish_date: 2021-09
  project_name: Bringing All-Polymer Solar Cells Closer to Commercialization
  what_happened: Prior to this project, semiconducting polymers for solar applications
    were synthesised only on the milligram scale using toxic organotin compounds (Stille
    coupling), with no established pathway for gram-scale, environmentally friendly
    production needed for pilot manufacturing. The project required over 100 synthesis
    batches to optimise conditions for direct arylation polymerisation before gram-scale
    yields were achieved.
  lesson_learnt: Future projects targeting pilot-scale manufacture of polymer solar
    cells should adopt direct arylation polymerisation from the outset — it enables
    gram-scale synthesis with high yields and high molecular weights while avoiding
    toxic organotin compounds, and the optimised reaction conditions from this project
    are publicly available to reduce the iteration burden.
