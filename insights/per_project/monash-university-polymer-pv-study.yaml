  what_happened: The custom light source used for photochemical stability ageing was
    not benchmarked against a solar simulator early enough in the project, meaning
    its UV output and spectral correspondence to sunlight were not validated at the
    outset.
  lesson_learnt: Benchmark and calibrate the light source against a solar simulator
    before commencing degradation experiments — unvalidated spectral output introduces
    uncertainty in stability results and, budget permitting, a dedicated solar simulator
    with environmental control should be used to ensure spectral correspondence and
    controlled temperature and humidity.
