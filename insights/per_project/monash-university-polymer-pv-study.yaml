  what_happened: During time-resolved microwave conductivity (TRMC) screening, poor
    coordination between film preparation at Monash University and measurement requirements
    at Macquarie University led to suboptimal film thickness and uniformity in early
    samples, reducing data quality.
  lesson_learnt: When a research project splits film preparation and characterisation
    across different institutions, establish explicit feedback loops between measurement
    teams and sample preparation teams before data collection begins — film thickness
    and uniformity requirements for the analytical technique should be communicated
    and validated upfront to avoid iterative rework.
