- record_id: ARENA-DLV-1701
  source_title: Bringing All-Polymer Solar Cells Closer to Commercialization - Lessons
    Learnt 2
  publish_date: 2021-09
  project_name: Bringing All-Polymer Solar Cells Closer to Commercialization
  what_happened: Thermal stability testing across 12 polymer solar cell types revealed
    that all-polymer blends were significantly more stable than polymer:fullerene
    and polymer:non-fullerene alternatives, retaining efficiency through 500 thermal
    cycles while the other types degraded rapidly after only a few cycles. Most prior
    academic work had focused on efficiency rather than stability, leaving a gap in
    standardised thermal stability data.
  lesson_learnt: When selecting materials for polymer solar cell development, prioritise
    larger molecular weight (all-polymer) blends over small-molecule acceptor systems
    — thermal stability benchmarking against ISOS-T-1 should be conducted early in
    material selection, as high power conversion efficiency does not reliably predict
    thermal stability.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Conducted systematic thermal cycling (ISOS-T-1 protocol) across
    12 cell types to identify which material class demonstrated adequate stability
    for further development.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id001
  - 5
  - 8
  - 9
  evidence_excerpt: While power conversion efficiency is the focus of most academic
    studies, high efficiencies do not always correlate with high thermal stability.
    Polymer solar cells that employ small molecule acceptors are susceptible to thermal
    degradation under standard thermal cycling experiments, and larger molecular weight
    materials should be preferred to ensure good thermal stability over a reasonable
    operational lifetime.
  confidence_note: issue_severity set to moderate — the finding reorients material
    selection strategy for the project, which has meaningful development implications
    even though no schedule or cost data is provided.
