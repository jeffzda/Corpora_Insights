- record_id: ARENA-DLV-47056
  source_title: Australian Concentrating Solar Thermal Industry Roadmap
  publish_date: 2018-08
  project_name: Australian CST Sector (multiple projects)
  what_happened: All new generators seeking to connect to the electricity grid faced
    a connection approval process described as 'long, uncertain, opaque and expensive',
    with no standardised steps, timelines that could be bypassed, upfront charges
    held by network owners for years, and no standard data package provided to applicants.
    This was identified as a significant barrier to new generation investment.
  lesson_learnt: Grid connection processes should specify maximum timelines for each
    step, require network operators to provide a standard dataset to applicants within
    a fixed timeframe, and move connection cost payments to a pay-as-you-go model
    — the current upfront charge structure ties up developer capital for years and
    adds material cost and uncertainty to early-stage project economics.
  issue_severity: major
  project_type: generation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: grid connection/system studies
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: null
  intervention_note: Roadmap recommends developing a standardised streamlined connection
    process with published steps, maximum timelines, standard data packages, and pay-as-you-go
    cost recovery, to be piloted in renewable energy zones.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: solar thermal
  source_pages: &id004
  - 64
  - 65
  evidence_excerpt: All new generators and storage system providers seeking to enter
    the electricity grid are faced with the need to negotiate the long, uncertain,
    opaque and expensive pathway to securing a 'connection agreement' and then meet
    the costs of the physical connection. This process is a significant barrier to
    new generation... specified maximum timelines for each step in the process or
    an aggregate timeline. While some timelines do exist within these processes, they
    are easily and frequently by-passed... standard and reasonable approach to funding
    the application process that is more pay-as-you-go than up-front, due to up front
    charges often being large and held for years by the network owner.
