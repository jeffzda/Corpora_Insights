- record_id: ARENA-DLV-47053
  source_title: Australian Concentrating Solar Thermal Industry Roadmap
  publish_date: 2018-08
  project_name: Australian CST Sector (multiple projects)
  what_happened: CST developers across Australia consistently reported inability to
    secure bankable power purchase agreements from major retailers, with large retailers
    unwilling to enter PPAs that reflect the time-of-day value of dispatchable generation.
    This was identified through stakeholder consultation as a primary barrier to project
    financial close.
  lesson_learnt: CST and other dispatchable renewable project developers should structure
    PPA negotiations to explicitly quantify and price the time-of-dispatch premium
    before approaching major retailers — without this, developers lack the market
    power to negotiate terms that reflect dispatchability value, blocking financial
    close.
  issue_severity: major
  project_type: generation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: financing/commercial close
  failure_mode: commercial & market
  outcome_class: delayed but recoverable
  secondary_failure_mode: null
  intervention_note: Roadmap recommends ARENA and CEFC develop PPA underwriting products
    and AEMO-facilitated workshops to develop time-of-dispatch pricing standards.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar thermal
  source_pages: &id001
  - 50
  - 51
  evidence_excerpt: 'CST developers consistently stated their major barriers to development
    are: inability to get funding, including income stream from the RET, government
    grants and private sector finance; RET does not recognise storage, only LCoE;
    inability to get bankable power purchase agreements from the retail market leaders;
    no adequate technology/engineering expertise in Australia; lack of value on time
    of day generation for developers and CST project owners undermines commercial
    case.'
