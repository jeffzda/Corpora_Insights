- record_id: ARENA-DLV-47054
  source_title: Australian Concentrating Solar Thermal Industry Roadmap
  publish_date: 2018-08
  project_name: Australian CST Sector (multiple projects)
  what_happened: Financial institutions consulted for the Roadmap consistently declined
    to finance CST projects in Australia, citing lack of familiarity with the technology,
    no operating reference plants in Australia, poor knowledge of international project
    outcomes, and no demonstrated revenue stream under current market rules. This
    created a structural financing gap blocking project development.
  lesson_learnt: For FOAK technology projects, the absence of any locally operating
    reference plant creates a self-reinforcing financing barrier — lenders require
    demonstrated local performance before committing, but projects cannot be built
    without financing. Early demonstration projects with ARENA grant support are essential
    to break this cycle and reduce the risk premium demanded by institutional lenders.
  issue_severity: major
  project_type: generation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: financing/commercial close
  failure_mode: commercial & market
  outcome_class: delayed but recoverable
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Roadmap recommends ARENA grant funding for small demonstration
    projects and CEFC finance products to reduce lender risk premium for early projects.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: solar thermal
  source_pages: &id002
  - 50
  - 51
  evidence_excerpt: 'The finance sector also raised consistent barriers for CST developers
    to gain access to lenders and equity investors prepared to be part of financing
    for CST projects, which are: lack of understanding how the CST technology works,
    sector cannot see it operating in Australia to make an assessment; lack of understanding
    around the commercial case for CST against the case for PHES and batteries as
    arbitrage market diminishes; some knowledge of unsuccessful Australian projects
    among technology and infrastructure funders; lack of clarity around the technical
    and commercial success of international projects; no clear demonstration of the
    revenue stream from CST projects under current market conditions.'
  confidence_note: secondary_failure_mode resource/capability shortfall reflects the
