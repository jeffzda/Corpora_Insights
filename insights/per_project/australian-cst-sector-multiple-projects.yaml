- record_id: ARENA-DLV-47059
  source_title: Australian Concentrating Solar Thermal Industry Roadmap
  publish_date: 2018-08
  project_name: Australian CST Sector (multiple projects)
  what_happened: Distribution network service providers (DNSPs) under the existing
    regulatory framework had strong financial incentives to invest in network extensions
    and upgrades rather than support non-network solutions such as DER and CST microgrids,
    because their regulated return was maximised by increasing network asset value.
    This structural incentive blocked the transfer of network savings to distributed
    generators.
  lesson_learnt: Regulatory frameworks that reward network businesses based on capital
    investment will systematically block non-network solutions — regulators should
    strengthen the Regulatory Investment Test for Distribution (RIT-D) to require
    DNSPs to proactively assess and support DER and microgrid alternatives before
    approving network augmentation, and remove the investment-volume incentive that
    currently operates in the opposite direction.
  issue_severity: major
  project_type: generation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: concept/feasibility
  proponent_type: project developer
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: coordination & stakeholders
  intervention_note: Roadmap recommends the Energy Council direct EMTPT, AEMO, AEMC
    and AER to develop a regulatory framework that rewards distributed generators
    for network savings on a per-MWh basis and requires DNSPs to proactively support
    microgrid solutions.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: solar thermal
  source_pages: &id005
  - 57
  - 58
  - 59
  - 60
  evidence_excerpt: This has not yet become a commonplace solution however among DNSPs
    as it is a departure from the way they have historically developed their networks
    and been compensated for this development. In fact, the current rules provide
    a strong incentive for DNSPs to drive additional investment into the network so
    as to maximise their regulated return.
