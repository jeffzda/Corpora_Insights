- record_id: ARENA-DLV-47055
  source_title: Australian Concentrating Solar Thermal Industry Roadmap
  publish_date: 2018-08
  project_name: Australian CST Sector (multiple projects)
  what_happened: The Renewable Energy Target (RET) incentive framework rewarded lowest
    LCoE generation and did not recognise the value of thermal storage or dispatchability,
    structurally disadvantaging CST relative to wind and PV. This policy design meant
    CST received no income support through the RET despite providing system services
    (dispatchability, inertia, FCAS) that the market needed.
  lesson_learnt: Incentive frameworks designed around LCoE alone will systematically
    under-reward technologies that provide storage and dispatchability — program designers
    should incorporate value-of-generation metrics (time-of-dispatch, ancillary service
    capability) alongside LCoE to avoid locking out technologies that provide system
    services not captured in energy-only pricing.
  issue_severity: major
  project_type: generation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: concept/feasibility
  proponent_type: project developer
  delay_category: financing/commercial close
  failure_mode: commercial & market
  outcome_class: delayed but recoverable
  secondary_failure_mode: regulatory & approvals
  intervention_note: Roadmap recommends policy reforms including time-of-dispatch
    pricing rewards, network savings transfer to generators, and NEG design that values
    dispatchability.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: solar thermal
  source_pages: &id003
  - 11
  - 50
  evidence_excerpt: The incentives delivered through these schemes have focused on
    delivering lowest-cost electricity into the system where cost has largely been
    a calculation of the LCoE. The focus has not been on an evaluation of the value
    of the new electricity supplied into the system... RET does not recognise storage,
    only LCoE.
  confidence_note: 'project_scale_band reconciled to ''first commercial/FOAK'' from:
