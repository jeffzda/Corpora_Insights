- record_id: ARENA-DLV-52752
  source_title: Next Generation Industrial Bifacial Silicon Solar Cells Final Report
  publish_date: 2021-09
  project_name: Next Generation Industrial Bifacial Silicon Solar Cell (2017/RND015)
  what_happened: The project's successful outcomes were explicitly attributed to a
    long-term R&D investment strategy — the availability of an established research
    team, well-equipped laboratory, and home-grown enabling technologies developed
    through prior ARENA, ACAP, and ARC projects that served as ready building blocks
    for new device designs.
  lesson_learnt: Research projects that can draw on prior investment in people, equipment,
    and locally developed enabling technologies progress significantly faster and
    with less technical risk than greenfield efforts. Funders and proponents should
    structure R&D portfolios to maintain continuity of research capability and build
    on prior results rather than treating each project as a standalone activity.
  issue_severity: none
  project_type: manufacturing/supply chain
  project_scale_band: lab/bench
  lifecycle_phase: concept/feasibility
  proponent_type: research organisation/university
  delay_category: null
