  project_name: Next Generation Industrial Bifacial Silicon Solar Cell (2017/RND015)
  what_happened: Collaboration with an industry partner (Wavelabs Solar Metrology
    Systems GmbH) was structured into the project from the outset, enabling development
    and advancement of polysilicon contact-based bifacial solar cells and providing
    a pathway toward industry adoption of the fabrication technologies developed.
  lesson_learnt: Embedding an industry partner in laboratory R&D projects from commencement
    — rather than seeking technology transfer after results are achieved — accelerates
    the pathway to industry-ready solutions and ensures developed technologies are
    validated against real-world manufacturing requirements.
