- record_id: ARENA-DLV-52755
  source_title: Next Generation Industrial Bifacial Silicon Solar Cells Final Report
  publish_date: 2021-09
  project_name: Next Generation Industrial Bifacial Silicon Solar Cell (2017/RND015)
  what_happened: Two research fellows from the project subsequently received ACAP-funded
    Research Fellowships to continue developing specific technologies that emerged
    during the project, and the IP developed (polysilicon and laser processes) was
    retained by the creators and is being applied as building blocks in next-generation
    device research across a broad network of Australian university and industry collaborators.
  lesson_learnt: Structuring R&D projects to ensure IP is clearly owned by the creating
    researchers — rather than transferred to a single commercial partner — maximises
    the portfolio value of publicly funded research by enabling the knowledge to propagate
    across multiple follow-on projects and institutions.
  issue_severity: none
  project_type: manufacturing/supply chain
  project_scale_band: lab/bench
  lifecycle_phase: close-out/post-project review
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: follow-on scale-up enabled
  secondary_failure_mode: null
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id005
  - 4
  evidence_excerpt: Among the research fellows, two went on to receive ACAP funded
    Research Fellowships to further development of specific technologies developed
    stemming from discoveries during the course of this project. The developed polysilicon
    and laser processes are fully owned by creators in this project, and can therefore
    be applied as a building block in the development of other promising technologies
    such as Hybrid IBC solar cells, and Triple-Junction Si-Perovskite Tandem solar
    cells with a broad network of research and industry collaborators.
  confidence_note: This record captures a programme-level spillover observation rather
    than a discrete delivery event; included because it carries a transferable structural
    lesson about IP ownership in publicly funded R&D.
