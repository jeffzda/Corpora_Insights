  evidence_excerpt: The ANU laboratory had numerous interruptions over the course
    of this project due to bushfire smoke, hailstorm damage, and multiple COVID-19
    related laboratory closures. This project re-routed activities and leveraging
    against a broad network of collaborators and industry partners to enable continuation
    of research activities for calibration and fabrication of samples in other laboratories
    within Australia and internationally. Establishment of an emergency laboratory
    shut-down plan is essential to soften the impact of major and lengthy laboratory
    access interruptions.
