  project_name: Next Generation Industrial Bifacial Silicon Solar Cell (2017/RND015)
  what_happened: 3D device simulation using the ANU-developed Quokka3 tool was integrated
    into the development workflow, allowing virtual experiments to be run before committing
    to physical laboratory fabrication of prototype devices.
  lesson_learnt: Incorporating validated 3D simulation tools into the R&D workflow
    before physical fabrication reduces costly iteration cycles — virtual experiments
    can identify design deficiencies and prioritise prototype designs, materially
    accelerating the rate of technology development.
