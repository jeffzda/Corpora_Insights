- record_id: ARENA-DLV-52751
  source_title: Next Generation Industrial Bifacial Silicon Solar Cells Final Report
  publish_date: 2021-09
  project_name: Next Generation Industrial Bifacial Silicon Solar Cell (2017/RND015)
  what_happened: The ANU laboratory experienced multiple unplanned closures during
    the project due to bushfire smoke, hailstorm damage, and repeated COVID-19-related
    shutdowns, interrupting fabrication and calibration activities.
  lesson_learnt: Establish an emergency laboratory shutdown plan before project commencement
    — projects reliant on a single laboratory facility are highly vulnerable to extended
    access interruptions. Pre-negotiating access to collaborator and industry partner
    laboratories as backup fabrication and calibration sites can allow research activities
    to continue through major disruptions.
