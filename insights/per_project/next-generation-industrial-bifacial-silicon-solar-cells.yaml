  secondary_failure_mode: null
  intervention_note: null
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id002
  - 4
  evidence_excerpt: This project benefited from having a baseline of excellent research
    scientists within a well-established and well-equipped laboratory to handle the
    demands of the project. The available expertise and equipment additionally bring
    together home-grown technologies developed within Australia through previous ARENA,
    ACAP, ARC and other past projects, as building blocks towards new technology designs
    such as the bifacial cells developed in this project. This highlights the importance
    of research continuity and home-grown technology development for present and future
    Australian based R&D projects.
  confidence_note: lifecycle_phase set to concept/feasibility as this insight pertains
