- record_id: ARENA-DLV-45003
  source_title: Network Hosting Capacity Projects Progress Report (Year One)
  publish_date: 2020-03
  project_name: 'Australian National University: Community Models for Deploying and
    Operating DER'
  what_happened: Simulation modelling showed that community energy storage (CES) can
    reduce grid export by 50% compared to equivalently-sized residential storage,
    but capturing the full benefits requires a local use of service (LUOS) reduced
    energy transport tariff that does not currently exist under the regulatory framework.
  lesson_learnt: 'Community energy storage models that co-locate DER across multiple
    unmetered connection points face a regulatory barrier: existing network tariff
    structures penalise local energy exchange rather than incentivising it. Future
    deployments should engage with regulators early to advocate for a LUOS tariff
    or equivalent mechanism as a precondition for commercial viability.'
