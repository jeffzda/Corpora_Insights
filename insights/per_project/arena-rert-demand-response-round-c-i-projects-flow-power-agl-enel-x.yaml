  evidence_excerpt: Business recruitment requires alignment between procurement and
    operational staff. Several projects noted differences between procurement and
    operations – and focusing on procurement managers was problematic if there wasn't
    alignment with operations managers. Early engagement with operations and facilities
    managers is essential for successful recruitment.
