- record_id: ARENA-DLV-53866
  source_title: Demand Flexibility Portfolio Retrospective Analysis Report
  publish_date: 2023-07
  project_name: ARENA RERT Demand Response Round — C&I Projects (Flow Power, AGL,
    Enel X)
  what_happened: Several C&I projects found that business customers were initially
    enthusiastic but ultimately declined to enrol due to concerns about operational
    impacts; lack of alignment between procurement managers (who initiated interest)
    and operations managers (who controlled implementation) was a recurring cause
    of failed enrolments.
  lesson_learnt: C&I demand flexibility recruitment must engage operations and facilities
    managers concurrently with procurement from the outset — focusing on procurement
    alone without operations buy-in will consistently result in late-stage drop-out.
    Identifying an internal 'champion' with cross-functional authority is essential.
