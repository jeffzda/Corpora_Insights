- record_id: ARENA-DLV-25919
  source_title: Review of ARENA's Reliability Portfolio
  publish_date: 2020-01
  project_name: Pumped Hydro Feasibility Assessment Project Group (Kidston, Snowy
    2.0, Hydro Tasmania)
  what_happened: Pumped hydro feasibility assessments across the portfolio (Kidston
    mine, Snowy 2.0, Hydro Tasmania) achieved 100% of milestones and demonstrated
    commercially positive results, but the evaluation found that significant uncertainty
    remained around revenue streams for system security services, treatment of network
    losses under marginal loss factor methodology, and broader energy market and arbitrage
    revenues, preventing positive business cases from being established.
  lesson_learnt: Pumped hydro feasibility studies should explicitly model revenue
    scenarios under multiple NEM rule configurations for system security services
    and loss treatment, not just energy arbitrage; business cases that depend on revenue
    streams subject to ongoing rule uncertainty should not be advanced to investment
    decision without parallel engagement with the AEMC on relevant rule changes.
