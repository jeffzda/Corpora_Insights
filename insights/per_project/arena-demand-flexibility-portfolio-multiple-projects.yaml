- record_id: ARENA-DLV-53851
  source_title: Demand Flexibility Portfolio Retrospective Analysis Report
  publish_date: 2023-07
  project_name: ARENA Demand Flexibility Portfolio (multiple projects)
  what_happened: Across nearly all ARENA-funded demand flexibility projects reviewed,
    residential air-conditioning pilots found that many units lacked demand response
    capability due to non-compliance with the AS-4755 technical standard, installations
    were complex and expensive, and units frequently failed to execute commands correctly
    — leading AGL to conclude the approach was 'unviable' at present.
  lesson_learnt: Technical standards for demand-response enabled devices (AS-4755)
    must be modernised, made mandatory, and diffused through the installed base before
    mass-scale residential air-conditioning demand response can be cost-effective.
    Projects should not rely on voluntary standards; regulatory reform is a prerequisite,
    not an optional complement.
