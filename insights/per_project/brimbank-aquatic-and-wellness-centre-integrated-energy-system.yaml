- record_id: ARENA-DLV-10160
  source_title: Brimbank Aquatic and Wellness Centre Integrated Energy System - Performance
    Analysis
  publish_date: 2025-07
  project_name: Brimbank Aquatic and Wellness Centre Integrated Energy System
  what_happened: Retrofitting existing aquatic centres with heat pumps is constrained
    by legacy heating systems designed for 80°C/60°C flow/return temperatures suited
    to gas plant, whereas heat pumps operate most efficiently at low-grade temperatures
    (~50°C/45°C). Without replacing the full HVAC and distribution network, retrofitted
    ASHPs must operate at elevated temperatures that significantly degrade their efficiency.
  lesson_learnt: When electrifying existing aquatic centres with heat pumps, the full
    HVAC distribution network must be assessed and likely replaced — retrofitting
    ASHPs into legacy high-temperature distribution systems without replacing pipework,
    coils, and heat exchangers substantially reduces heat pump efficiency and undermines
    the business case.
