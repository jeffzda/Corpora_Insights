- record_id: ARENA-DLV-28152
  source_title: Brimbank Aquatic and Wellness Centre Integrated Energy System Lessons
    Learnt 1
  publish_date: 2021-11
  project_name: Brimbank Aquatic and Wellness Centre – Carbon Neutral Aquatic Centre
    Deployment
  what_happened: The HFO heat pump selected has higher annual electricity consumption
    than the LCA alternative (1,450,120 kWh vs 1,308,808 kWh), resulting in approximately
    $15,000–$20,000 in additional electricity costs per year (or $25,000–$30,000 if
    drawing entirely from the grid). The HFO refrigerant (R513a, GWP 631) also has
    a higher global warming potential than the ammonia used in LCA systems (GWP 0),
    though substantially better than the common alternative R410a (GWP 2088).
  lesson_learnt: When selecting heat pump refrigerant technology for all-electric
    aquatic centres, project managers should explicitly quantify the ongoing energy
    cost and lifecycle emissions trade-offs between HFO and LCA options — the lower
    capital cost of HFO carries a real annual energy cost penalty and a higher environmental
    footprint that should be weighed against capital savings.
  issue_severity: minor
