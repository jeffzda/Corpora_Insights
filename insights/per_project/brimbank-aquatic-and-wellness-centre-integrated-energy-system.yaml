  what_happened: Enhanced monitoring and sub-metering investment at BAWC — including
    additional thermal meters on the TES and closure of sub-metering gaps in July
    2024 — enabled quantification of round-trip efficiency, unit-level COP, and identification
    of specific control deficiencies that would otherwise have been undetectable.
  lesson_learnt: Invest in comprehensive sub-metering and monitoring infrastructure
    at or before commissioning for first-of-kind heat pump facilities — the analytical
    value of granular monitoring data in identifying control failures and optimising
    integrated systems substantially outweighs the cost, and absence of monitoring
    data can delay performance improvements by months or years.
