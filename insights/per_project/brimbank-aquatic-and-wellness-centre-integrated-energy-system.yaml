- record_id: ARENA-DLV-28154
  source_title: Brimbank Aquatic and Wellness Centre Integrated Energy System Lessons
    Learnt 1
  publish_date: 2021-11
  project_name: Brimbank Aquatic and Wellness Centre – Carbon Neutral Aquatic Centre
    Deployment
  what_happened: The TES system successfully enabled a reduction in the required heat
    pump peak heating output from 1700 KWth to 1200 KWth, delivering a significant
    reduction in heat pump capital costs. It also enables load shifting to daylight
    hours during periods of excess solar PV generation, increasing the heat pump's
    average coefficient of performance. However, the saving from the reduced heat
    pump capacity was offset by the unexpectedly high cost of the TES itself.
  lesson_learnt: TES integration with heat pumps and solar PV in aquatic centres can
    deliver genuine capital cost reductions by downsizing heat pump capacity, but
    this benefit is only realised net if TES implementation costs do not exceed the
    correlated heat pump cost savings — future projects should size and cost TES and
    solar PV together early in design to ensure the net capital position is positive.
