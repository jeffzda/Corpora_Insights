  publish_date: 2025-07
  project_name: Brimbank Aquatic and Wellness Centre Integrated Energy System
  what_happened: Uninsulated pipe fittings and components were observed at the external
    plant location of the BAWC thermal storage system, contributing to thermal losses
    from stored energy. The A2EP review noted that heat loss from an uninsulated pipe
    or fitting in open air may be 30 times higher than an equivalent insulated component.
  lesson_learnt: All pipe fittings, valves, and connections at external thermal storage
    locations must be fully insulated — uninsulated fittings in open air can lose
    heat at 30 times the rate of insulated components and will materially reduce the
    useful energy available from storage, particularly for lower-temperature heat
    pump systems.
