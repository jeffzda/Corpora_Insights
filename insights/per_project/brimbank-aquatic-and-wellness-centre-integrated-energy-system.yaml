  source_title: Brimbank Aquatic and Wellness Centre Integrated Energy System Lessons
    Learnt 1
  publish_date: 2021-11
  project_name: Brimbank Aquatic and Wellness Centre – Carbon Neutral Aquatic Centre
    Deployment
  what_happened: The above-ground insulated stainless steel thermal energy storage
    (TES) tank solution proposed by the builder came in at approximately double the
    cost expected from background cost estimates. An underground concrete tank option
    was identified as potentially more cost-effective based on quotes obtained by
    the Council prior to the variation process, but the builder did not disclose cost
    information for this option during the variation costing process.
  lesson_learnt: Specify and seek competitive quotes for underground concrete TES
    tank solutions explicitly and early in the design and procurement process — the
    above-ground stainless steel solution procured through a contract variation process
    came in at approximately double background cost estimates, whereas underground
    concrete is likely to deliver equivalent or larger capacity at significantly lower
    cost.
