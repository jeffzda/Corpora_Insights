  publish_date: 2025-07
  project_name: Brimbank Aquatic and Wellness Centre Integrated Energy System
  what_happened: Low-grade heat distribution at BAWC (53°C/45°C flow/return) enabled
    high heat pump COP but required larger pipes, pumps, and heat exchangers than
    a conventional high-grade system. The new-build context meant spatial constraints
    were manageable, but the same approach would be problematic in office or accommodation
    retrofit projects with tighter spatial constraints.
  lesson_learnt: Low-grade heat networks maximise heat pump COP but require significantly
    larger pipework, pumps, and heat exchangers — this trade-off is most viable in
    new builds where spatial planning can accommodate the larger equipment; retrofit
    applications in buildings with tight spatial constraints should assess feasibility
    of low-grade distribution before committing to it.
