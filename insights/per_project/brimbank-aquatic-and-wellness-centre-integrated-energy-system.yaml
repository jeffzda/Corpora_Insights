- record_id: ARENA-DLV-12801
  source_title: Brimbank Aquatic and Wellness Centre Integrated Energy System - Lessons
    Learnt Report 3
  publish_date: 2024-11
  project_name: Brimbank Aquatic and Wellness Centre Integrated Energy System
  what_happened: The backup gas boiler at BAWC activated repeatedly during winter
    months (July–September 2023 and 2024) on days when ambient temperatures fell below
    10°C, despite the facility being designed as an all-electric centre with gas as
    emergency-only backup. Adjustments to the boiler control band by the mechanical
    contractor did not materially reduce boiler run time.
  lesson_learnt: Plan for grid outage scenarios and commissioning-phase gas boiler
    activations in the emissions accounting and operational monitoring framework —
    even a well-designed all-electric system will use backup gas during commissioning
    tuning and grid outage events, and a control strategy to minimise boiler use should
    be defined and tested before handover.
  issue_severity: moderate
  project_type: enabling infrastructure
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: government/public-sector body
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: data & measurement
  intervention_note: A2EP recommended recommissioning the boiler control staging parameters
    so that the boiler only activates under genuine last-resort thermal conditions,
    including review of temperature thresholds, delays, and prioritisation logic in
    partnership with the controls contractor.
  transferability: broad
  delay_magnitude: null
  technology_domain: battery storage
  source_pages:
  - 3
  - 7
  - 14
  - 16
  evidence_excerpt: Only 0.4% of the total heat (12.6GWh) required by the facility
    was generated by the back-up gas boiler in the first year of operation. In the
    first year, the highest monthly contribution from the gas boiler was 3.5% of the
    total monthly heat required, recorded in July 2023. Analysis has shown the boiler
    was used in an event where the grid electricity cut out overnight and needed to
    reheat pool water quickly before centre opening, as well as turning on a number
    of times following initial commissioning and tuning.
  confidence_note: project_type assigned 'enabling infrastructure' as the dominant
    delivery object is an integrated building energy system for a public facility
    rather than generation or storage per se; 'DER/customer-side' was also considered.
    Canonical record merged from 3 source records across 3 document(s).
