  what_happened: By the time TES load-shifting benefits were being seriously considered,
    budgetary and time pressures drove a pragmatic decision to work with the existing
    500 kW solar PV capacity already part of the overarching project, rather than
    optimising solar PV and TES sizing together. This constrained the TES volume and
    the operational benefits achievable.
  lesson_learnt: Solar PV and TES sizing analysis should be undertaken much earlier
    in the design process and in more depth — late consideration of TES load-shifting
    resulted in the solar PV capacity being fixed before TES optimisation could occur,
    limiting the potential capital and operational benefits of the integrated system.
