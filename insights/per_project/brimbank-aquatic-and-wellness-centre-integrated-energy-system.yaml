    primarily on capital expenditure, without requiring tenderers to provide whole-of-life
    energy cost modelling. This made it difficult to fairly evaluate proposals that
    involved higher upfront investment but lower operational costs.
  lesson_learnt: Require tenderers to submit a standardised energy financial model
    as part of procurement responses, covering both capital and whole-of-life operational
    costs — BAWC's experience showed that capital-cost-only assessment criteria systematically
    disadvantage all-electric designs, and providing a model template with reimbursement
    for shortlisted applicants would improve assessment quality.
