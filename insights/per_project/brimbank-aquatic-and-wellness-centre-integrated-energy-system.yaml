- record_id: ARENA-DLV-12802
  source_title: Brimbank Aquatic and Wellness Centre Integrated Energy System - Lessons
    Learnt Report 3
  publish_date: 2024-11
  project_name: Brimbank Aquatic and Wellness Centre Integrated Energy System
  what_happened: After 18 months of operation, the thermal energy storage (TES) system
    at BAWC was found to be operating at a roundtrip efficiency of less than 30% based
    on meter data from July–August 2024, far below design expectations. Standing and
    transmission losses alone could not account for the magnitude of the efficiency
    loss, and the root cause remained unresolved at the time of reporting.
  lesson_learnt: When deploying a thermal energy storage system in an aquatic centre,
    allocate dedicated resources and budget for TES optimisation during the building
    tuning phase before commissioning — including state-of-charge-based controls (rather
    than time-schedule-based) and installation of automatic shutter valves to prevent
    unintended passive water flows.
  issue_severity: major
  project_type: enabling infrastructure
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: government/public-sector body
  delay_category: commissioning/integration
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: execution & logistics
  intervention_note: Additional thermal meters were installed at the TES to quantify
    round-trip efficiency; A2EP recommended improved controls with more sensors, upgraded
    pipe insulation, and potential modification of pipework to operate tanks in parallel
    rather than series.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: industrial renewables
  source_pages:
  - 7
  - 8
  - 9
  - 12
  - 22
  evidence_excerpt: In its first year, BAWC's TES system has not been able to improve
    the overall energy efficiency of the facility as designed. In addition to rectifying
    technical issues, further load analyses need to be undertaken to develop a suitable
    control strategy for the system.
  confidence_note: secondary_failure_mode 'design assumption failure' applied because
    the controls were designed on a time schedule rather than state-of-charge basis,
    which is identified as a probable contributing design flaw. Canonical record merged
    from 3 source records across 3 document(s).
