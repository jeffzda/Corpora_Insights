- record_id: ARENA-DLV-10154
  source_title: Brimbank Aquatic and Wellness Centre Integrated Energy System - Performance
    Analysis
  publish_date: 2025-07
  project_name: Brimbank Aquatic and Wellness Centre Integrated Energy System
  what_happened: The four thermal storage tanks at BAWC were configured in series
    with only two pipe connections per tank and one temperature sensor per tank, causing
    turbulence during charge/discharge cycles, poor thermal stratification, and inability
    to accurately determine state of charge.
  lesson_learnt: Thermal storage tanks for heat pump systems should be configured
    in parallel with four connection points per tank (two charge, two discharge),
    flow diffusers to maintain laminar flow, and multiple temperature sensors per
    tank vertically distributed — series arrangements with only two connections cause
    turbulence, destroy stratification, and render the storage largely ineffective.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: government/public-sector body
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: A2EP recommended adding multiple temperature sensors at vertical
    intervals in each tank and modifying pipework to allow parallel operation with
    four connection points per tank to enable accurate state-of-charge determination
    and effective control.
  transferability: moderate
  delay_magnitude: null
  technology_domain: industrial renewables
  source_pages:
  - 17
  - 22
  - 23
  - 24
  - 27
  - 28
  evidence_excerpt: The current storage system design at BAWC operates four separate
    tanks in series... During discharge, cold water enters the bottom of the first
    tank and 'pushes' the hot water from the top of this tank into the bottom of the
    next tank... This causes turbulence, disrupts the thermocline and facilitates
    poor thermal stratification within the tank.
