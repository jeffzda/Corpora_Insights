  publish_date: 2025-05
  project_name: Brimbank Aquatic and Wellness Centre
  what_happened: The all-electric plant design was introduced as a late design change,
    concurrently with construction beginning. This required an additional 120m2 of
    plant space, and the 90,000L thermal energy storage tanks could not fit in the
    originally planned underground area, requiring an above-ground stainless steel
    unit purchased at approximately double the cost of the original underground concrete
    unit.
  lesson_learnt: Decide on the energy approach (all-electric vs gas) before design
    is finalised — a late switch to all-electric required significant plant space
    additions and caused the TES unit cost to double due to having to use an above-ground
    stainless steel unit instead of an underground concrete one.
