  what_happened: Increased centre attendance (11% year-on-year in Q1 2024) was not
    observed to affect energy use of the all-electric plant, due to the indoor thermal
    envelope design with high-grade insulation, glazing, and an airtightness rating
    under 3 m³/m²/hr, demonstrating that indoor aquatic centre energy demand is largely
