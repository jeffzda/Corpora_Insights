  publish_date: 2025-07
  project_name: Brimbank Aquatic and Wellness Centre Integrated Energy System
  what_happened: The thermal energy storage at BAWC was not utilised to manage heat
    pump defrost cycles during cold winter periods, meaning heat pump capacity was
    reduced precisely when heating demand was highest, increasing reliance on the
    gas backup boiler. No smart control strategy was in place to pre-charge storage
    in anticipation of defrost events.
  lesson_learnt: Thermal storage in heat pump systems must be explicitly programmed
    to buffer heat pump defrost cycles in cold climates — defrost management strategy
    should be documented in controls specifications, with BMS visibility of defrost
    activation events and pre-emptive storage charging protocols before cold weather
    periods.
