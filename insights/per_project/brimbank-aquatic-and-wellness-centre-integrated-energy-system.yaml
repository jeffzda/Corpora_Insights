  project_name: Brimbank Aquatic and Wellness Centre Integrated Energy System
  what_happened: The 4-pipe heat pump's contribution to monthly heating output dropped
    from approximately 40% in winter 2023 to approximately 20% in winter 2024, suggesting
    declining utilisation of waste heat recovery. Additionally, waste heat from the
    4-pipe heat pump was not being utilised during summer, with summer heating demand
    met instead by the dedicated 2-pipe heating-only heat pump.
  lesson_learnt: Four-pipe simultaneous heating and cooling heat pumps require specific
    control logic to capture waste heat — without it, operational staff or default
    controls will default to atmospheric rejection. Commission dedicated monitoring
    and control logic for waste heat capture before handover, and verify it is functioning
    under real operating conditions.
