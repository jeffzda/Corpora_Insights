- record_id: ARENA-DLV-5055
  source_title: Brimbank Aquatic and Wellness Centre Integrated Energy System - Guide
    to Building a 100% Renewable Energy Powered Aquatic Centre
  publish_date: 2025-05
  project_name: Brimbank Aquatic and Wellness Centre
  what_happened: Council and the lead contractor operated separate, non-integrated
    financial systems. When ARENA grant auditing required Council to isolate expenditure
    on the all-electric plant upgrade, the relevant budget items had not been tagged
    against the grant, making it complex to provide financial evidence. Contractor
    staff had to provide non-billed assistance to locate documentation, and some assumptions
    were needed to complete the financial review.
  lesson_learnt: Implement a budget tagging system that links expenditure line items
    to specific grants or funding allocations from project inception, and require
    delivery partners to apply the same system — failure to tag costs to the ARENA
    grant at BAWC created significant difficulties at audit stage and relied on contractor
    goodwill to recover documentation after project close.
  issue_severity: moderate
  project_type: enabling infrastructure
  project_scale_band: first commercial/FOAK
  lifecycle_phase: close-out/post-project review
  proponent_type: government/public-sector body
  delay_category: null
  failure_mode: coordination & stakeholders
  outcome_class: re-scoped/adapted
  secondary_failure_mode: data & measurement
  intervention_note: Council relied on contractor staff providing non-billed assistance
    to locate documentation and established assumptions to complete the grant financial
    audit.
  transferability: broad
  delay_magnitude: null
  technology_domain: null
  source_pages: &id003
  - 16
  - 17
  evidence_excerpt: As Council applied for the grant to upgrade to an all-electric
    plant separate from the key contractor, financial documentation of the newly implemented
    equipment was not 'tagged' by them as being directly related to this grant. As
    a result, providing evidence of final spend separate from the rest of the project
    was complex at the grant auditing and financial review stage and needed to rely
    on a number of assumptions.
