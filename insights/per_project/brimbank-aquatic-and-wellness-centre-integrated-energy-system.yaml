  project_name: Brimbank Aquatic and Wellness Centre Integrated Energy System
  what_happened: The thermal storage control strategy at BAWC designated storage as
    a 'low load' appliance — charged only when grid electricity draw was low — which
    conflicted with the requirement to have storage fully charged ahead of peak heating
    demand events such as cold mornings and heat pump defrost cycles, resulting in
    storage being unavailable when most needed.
  lesson_learnt: Thermal storage control logic in heat pump systems must prioritise
    readiness for peak heating demand events (cold starts, defrost cycles) over solar
    self-consumption optimisation — a 'low load only' charging strategy can leave
    storage depleted precisely when it is needed most.
