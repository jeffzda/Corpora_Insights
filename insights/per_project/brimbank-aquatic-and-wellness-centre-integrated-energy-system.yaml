- record_id: ARENA-DLV-28156
  source_title: Brimbank Aquatic and Wellness Centre Integrated Energy System Lessons
    Learnt 1
  publish_date: 2021-11
  project_name: Brimbank Aquatic and Wellness Centre – Carbon Neutral Aquatic Centre
    Deployment
  what_happened: The project required incorporation of the HVAC system into the overarching
    $60M Brimbank Aquatic and Wellness Centre project through a variation costing
    process with the builder, rather than being designed as part of the original Design
    and Construction contract. This contract variation procurement approach increased
    cost and complexity for both the heat pump and TES components.
  lesson_learnt: Integrating all-electric HVAC systems into large building projects
    as contract variations rather than from the original tender significantly increases
    cost and procurement complexity — future projects should incorporate all-electric,
    natural refrigerant HVAC design into the original D&C contract tender to achieve
    competitive pricing and design optimisation.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: first commercial/FOAK
