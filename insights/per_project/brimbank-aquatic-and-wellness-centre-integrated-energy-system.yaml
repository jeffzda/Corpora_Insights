  what_happened: BAWC was originally designed to meet a 5-star Green Star standard
    with a gas boiler plant. When the decision was made to switch to all-electric,
    the existing high-quality thermal envelope specification (already meeting 5-star
    Green Star requirements) meant that the building fabric did not need to be redesigned.
    This significantly reduced the cost and complexity of the switch.
  lesson_learnt: Specifying a high-performance thermal envelope from the outset —
    even under a gas plant scenario — reduces the cost and risk of later switching
    to all-electric, as BAWC's pre-existing 5-star Green Star fabric standard greatly
    assisted the viability of the mid-project transition to all-electric.
