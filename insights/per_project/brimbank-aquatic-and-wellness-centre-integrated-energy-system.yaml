  publish_date: 2025-05
  project_name: Brimbank Aquatic and Wellness Centre
  what_happened: Metering on each heat pump and the thermal energy storage system
    was planned during design but was inadvertently omitted from the final design.
    After construction was complete, council was required to install meters retrospectively
    because operators lacked visibility of energy system operation.
  lesson_learnt: Develop metering and monitoring requirements explicitly in the project
    brief and verify their inclusion at each design review stage — metering omitted
    from the BAWC design had to be retrofitted after construction at additional cost
    and effort, and left operators without full visibility of system performance.
