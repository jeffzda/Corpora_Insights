- record_id: ARENA-DLV-28151
  source_title: Brimbank Aquatic and Wellness Centre Integrated Energy System Lessons
    Learnt 1
  publish_date: 2021-11
  project_name: Brimbank Aquatic and Wellness Centre – Carbon Neutral Aquatic Centre
    Deployment
  what_happened: The project's initial concept design nominated a low charge ammonia
    (LCA) heat pump system, but this was changed to a HFO heat pump system during
    the procurement process, primarily due to the significantly higher capital cost
    of LCA — total overall supply and construction cost of $3.0M–$3.2M for LCA versus
    $1.35M–$1.55M for HFO. The capital premium for LCA was likely exacerbated by the
    contract variation nature of the procurement process.
  lesson_learnt: Future aquatic centre projects seeking an all-electric outcome should
    prioritise natural refrigerant (LCA) heat pump design from the outset — early
    prioritisation in the design and procurement process (rather than as a contract
    variation) is likely to achieve a more cost-competitive outcome and reduce the
    capital premium that caused LCA to be unaffordable in this project.
