- record_id: ARENA-DLV-53872
  source_title: Demand Flexibility Portfolio Retrospective Analysis Report
  publish_date: 2023-07
  project_name: AGL Demand Response (RERT) — Residential Behavioural
  what_happened: AGL found that in follow-up surveys 25% of household demand response
    results were 'false negatives' (household acted but no change recorded) and 41%
    were 'false positives' (household did nothing but change was recorded). Natural
    variability — particularly temperature — created results that were difficult to
    explain to households, creating dissatisfaction.
  lesson_learnt: Residential demand response measurement is fundamentally unreliable
    using current baseline approaches; programs should adopt deeming or averaged methodologies
    (analogous to energy efficiency certificates) rather than household-level measurement,
    as precise measurement is both cost-prohibitive and a source of customer dissatisfaction.
  issue_severity: moderate
  project_type: DER/customer-side
