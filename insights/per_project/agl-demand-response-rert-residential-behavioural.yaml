  evidence_excerpt: AGL found in follow-up surveys that 25 per cent of household results
    were 'false negatives' (i.e. the household had taken action but no change was
    recorded) and 41 per cent of household results were 'false positives' (i.e., the
    household did nothing, but change was recorded – in some cases the occupants had
    left the house).
