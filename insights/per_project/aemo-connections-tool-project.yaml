- record_id: ARENA-DLV-15607
  source_title: AEMO - Connections tool - Project overview and lessons learnt report
  publish_date: 2023-10
  project_name: AEMO Connections Simulation Tool
  what_happened: Stakeholder feedback identified that limiting user visibility to
    only the Point of Connection — rather than adjacent network elements and nearby
    plant — was the single highest-priority gap reducing the CST's value, requiring
    AEMO-side intervention for scenarios users wished to explore independently.
  lesson_learnt: When designing access-controlled simulation environments, the initial
    scope restriction to the Point of Connection alone is insufficient for users to
    fully investigate network interactions — plan for expanded network visibility
    as a near-term enhancement and engage NSPs early to agree on what can be shared
    without compromising commercial sensitivity.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: first commercial/FOAK
