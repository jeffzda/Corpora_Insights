- record_id: ARENA-DLV-15604
  source_title: AEMO - Connections tool - Project overview and lessons learnt report
  publish_date: 2023-10
  project_name: AEMO Connections Simulation Tool
  what_happened: Despite 54 pre-launch expressions of interest and 14 organisations
    signing Service Access Agreements in the first six months, only two organisations
    actively used the CST — with developers citing higher-than-expected plant development
    costs due to global inflation, skilled labour shortages, and higher insurance
    costs as reasons to cut optional expenditure including CST fees.
  lesson_learnt: When launching a fee-for-use tool targeting project developers, anticipate
    that external cost pressures (inflation, labour shortages) will suppress uptake
    even among organisations that have indicated strong interest — review pricing
    structures to reduce upfront cost barriers and consider tiered or deferred fee
    models.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: government/public-sector body
  delay_category: financing/commercial close
  failure_mode: commercial & market
  outcome_class: partial success
  secondary_failure_mode: null
  intervention_note: AEMO is reviewing the fee structure of the CST to rebalance upfront
    costs against ongoing costs for use of the tool.
  transferability: moderate
  delay_magnitude: null
  technology_domain: grid/system stability
  source_pages: &id004
  - 12
  evidence_excerpt: Developers have experienced unanticipated higher plant development
    costs due to global inflation, skilled labour shortages, and higher insurance
    costs. These issues have caused developers to delay their projects to either redesign
    or refinance them, delaying the connection application process. In some cases,
    the costs identified above have translated into potential CST users cutting down
    on optional costs such as using the CST.
