  outcome_class: re-scoped/adapted
  secondary_failure_mode: coordination & stakeholders
  intervention_note: AEMO identified increased network visibility as the highest-priority
    enhancement and is engaging NSPs to review the scope of network elements visible
    to users beyond the Point of Connection.
  transferability: moderate
  delay_magnitude: null
  technology_domain: grid/system stability
  source_pages: &id007
