- record_id: ARENA-DLV-15601
  source_title: AEMO - Connections tool - Project overview and lessons learnt report
  publish_date: 2023-10
  project_name: AEMO Connections Simulation Tool
  what_happened: Before the CST was available, connection applicants could only test
    plant models against simplified Single Machine Infinite Bus (SMIB) models rather
    than AEMO's full four-state NEM model, creating an uncertain environment where
    unanticipated integration issues caused significant delays and costs during the
    formal connection application process.
  lesson_learnt: Provide connection applicants with access to the same detailed power
    system model used in formal assessments during the design phase — this allows
    issues to be identified and resolved before budgets are finalised and financial
    investment decisions are made, reducing iterations and delays in the formal process.
  issue_severity: major
  project_type: software/data/digital
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: government/public-sector body
  delay_category: grid connection/system studies
  failure_mode: unvalidated technical assumptions
  outcome_class: successful demonstration
  secondary_failure_mode: data & measurement
  intervention_note: AEMO developed the Connections Simulation Tool to give applicants
    access to AEMO's four-state EMT model in a secure, confidentiality-preserving
    environment prior to formal connection application submission.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: grid/system stability
  source_pages: &id001
  - 5
  - 11
  evidence_excerpt: Unanticipated issues can introduce significant delays and costs
    into the connection application approval process, particularly if issues can only
    be solved by adding or redesigning physical plant assets. The CST enables users
    to identify these issues in the design phase of the project, before project budgets
    have been finalised and financial investment decisions made.
