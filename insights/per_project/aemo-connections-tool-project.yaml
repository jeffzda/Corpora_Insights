  what_happened: Some registered CST users delayed their use of the tool due to OEM-
    or NSP-driven changes to plant model development, meaning the CST window of relevance
    passed before they could engage.
  lesson_learnt: Tools positioned as pre-application preparation aids are vulnerable
    to being bypassed when third-party model development delays (OEM or NSP changes)
    push a project past the point where the tool adds value — consider whether the
    tool's scope can be extended to remain relevant across a broader range of application
    stages.
