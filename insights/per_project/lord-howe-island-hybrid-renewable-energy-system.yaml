  what_happened: Community engagement during the value management process surfaced
    a concern about construction traffic on the quiet residential access road to the
    powerhouse. Savings generated from the design consolidation were redirected to
    build an on-site storage shed, reducing the need for staff to travel to an off-site
    secure facility for spares and thereby cutting traffic movements past residential
    properties.
