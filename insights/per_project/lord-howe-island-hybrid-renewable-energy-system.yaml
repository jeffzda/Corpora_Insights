  project_name: Lord Howe Island Hybrid Renewable Energy Project
  what_happened: Community engagement revealed a shortage of public amenities on the
    island. Rather than importing a temporary portable toilet for construction (as
    originally planned), the value management process led to the decision to install
    a permanent composting toilet facility that would serve both construction workers
    and, as legacy infrastructure, tourists and locals using nearby walking tracks.
  lesson_learnt: In remote or environmentally sensitive project locations, explore
    whether temporary construction infrastructure can be upgraded to permanent legacy
    assets — the incremental cost is often modest relative to the long-term community
    benefit, and construction-phase use provides a commissioning period before handover.
