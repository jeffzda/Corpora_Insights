  what_happened: Over three years of operation, annual GHI varied between 1,629 and
    1,754 kWh/m² against a long-term synthesised design figure of 1,649 kWh/m², with
    year-to-year variation closely correlated with rainfall — higher-rainfall years
    (2021–22 and 2022–23) produced lower irradiance, while the lower-rainfall third
    year (1,117 mm vs ~1,700 mm average) produced the highest recorded GHI at 1,754
    kWh/m².
  lesson_learnt: For solar PV systems in humid island climates, annual energy yield
    can vary materially year-to-year (up to ~7% around the long-term mean) driven
    by rainfall and cloud cover variability; operational performance forecasts and
    diesel fuel budgets should account for this inter-annual variability rather than
    assuming the long-term average will be achieved in any given year.
