  what_happened: The bespoke system-hardening solution — cable trays, locked isolators
    and distribution boards — was designed and implemented within the project contingency
    budget, demonstrating that an alternative to standard fencing is economically
    feasible at this scale without exceeding approved funding.
  lesson_learnt: Bespoke environmental compliance solutions for PV/BESS installations
    on sensitive sites can be delivered within normal project contingency if identified
    and scoped early; the cost of custom cable-tray hardening and supplier-approved
    isolator modifications did not require additional funding at the Lord Howe Island
    HREP scale.
