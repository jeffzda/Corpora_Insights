  what_happened: Rooftop solar uptake on Lord Howe Island was constrained because
    there was no mechanism to control rooftop generation during periods of excess
    solar supply, creating the risk of uncontrolled reverse power flows into the microgrid.
  lesson_learnt: When designing islanded microgrids with high solar penetration, incorporate
    a control mechanism for distributed rooftop solar from the outset — without the
    ability to curtail or manage rooftop generation, additional distributed PV cannot
    be safely integrated into the grid.
