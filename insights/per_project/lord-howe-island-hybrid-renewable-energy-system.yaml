- record_id: ARENA-DLV-50401
  source_title: 'Lord Howe Island Renewable Energy Project Lessons Learnt Report:
    System Hardening'
  publish_date: 2021-08
  project_name: Lord Howe Island Renewable Energy Project (HREP)
  what_happened: Standard AS5033-compliant perimeter fencing (1.8m cyclone fence with
    barbed wire and 75mm base gap) was incompatible with the project's conditions
    of consent and World Heritage listing obligations, as it would trap or injure
    critically endangered Lord Howe Island wood hens (requiring 150mm base clearance)
    and flesh-footed shearwaters (entanglement risk from barbed wire). An alternative
    system-hardening approach had to be designed and implemented in lieu of a conventional
    fence.
  lesson_learnt: On environmentally sensitive or World Heritage-listed sites, standard
    electrical safety compliance solutions (e.g. AS5033 perimeter fencing with barbed
    wire) may be incompatible with conditions of consent and biodiversity obligations
    — project teams should identify these conflicts during design development, not
    after, and budget contingency for bespoke hardening solutions.
  issue_severity: moderate
  project_type: multi-technology/hybrid
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: government/public-sector body
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: The project team conducted detailed risk assessments and developed
    a 'system hardening' approach — enclosing all live conductors and equipment in
    locked conduit, cable trays, and secured enclosures — satisfying AS5033 clause
    3.1 restricted-access intent without requiring a standard perimeter fence.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages:
  - 3
  - 4
  - 5
  - 6
  - 9
  - 15
  - 16
  - 17
  evidence_excerpt: A Solar PV and BESS installation of the size and nature designed
    for the Lord Howe HREP would typically be surrounded by a 1.8m high cyclone fence
    with a 75mm gap at the bottom and three strands of barbed wire at the top. Such
    a fence will satisfy the barrier requirements as described in AS5033 but will
    have a negative environmental impact and will not comply with the conditions of
    consent.
  confidence_note: 'project_scale_band: document describes a 1.3MWp solar + 3.7MWh
