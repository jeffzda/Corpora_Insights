- record_id: ARENA-DLV-48901
  source_title: 'Lord Howe Island Lessons Learnt Report: Value Management'
  publish_date: '2019-11-15'
  project_name: Lord Howe Island Hybrid Renewable Energy Project
  what_happened: The wind turbine component of the original hybrid renewable design
    was removed during the extended planning phase (2014–2019), requiring a reconfiguration
    to solar PV and battery storage only. The project team used the resulting design
    gap as an opportunity to conduct a formal value management process, engaging the
    community to realign the project with current community values and aspirations.
  lesson_learnt: When a major project component is removed or the project scope changes
    during a long planning phase, conduct a structured value management and community
    engagement process before finalising the revised design — this can uncover redesign
    opportunities that deliver better outcomes within the existing budget.
  issue_severity: moderate
  project_type: multi-technology/hybrid
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: government/public-sector body
  delay_category: null
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: The project team conducted in-depth stakeholder dialogue and
    a value management review, consolidating the solar array onto one lot, reducing
    trenching and cabling costs, and redirecting savings to additional value-add items
    within the fixed-sum contract.
  transferability: moderate
  delay_magnitude: null
  technology_domain: hybrid systems
  source_pages: &id030
  - 1
  evidence_excerpt: The original renewable solution was to include solar and wind
    generation with battery storage, however, it was determined during the course
    of the project that the wind turbine component could no longer be delivered. Further
    feasibility studies undertaken by Jacobs since 2017 identified that a reconfigured
    and resized solar PV and battery storage generator would provide the same benefits.
  confidence_note: project_scale_band set to demonstration given the island microgrid
