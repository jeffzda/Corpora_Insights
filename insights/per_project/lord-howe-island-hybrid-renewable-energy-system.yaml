  outcome_class: delayed but recoverable
  secondary_failure_mode: execution & logistics
  intervention_note: The commissioning continued and was ultimately completed; the
    lesson identified was to use dummy loads in future to avoid such outages.
  transferability: moderate
  delay_magnitude: <1 month
  technology_domain: hybrid systems
  source_pages: &id003
  - 9
  evidence_excerpt: The island experienced a 3-hour outage island wide during commissioning.
    During this period the first black start failed. Technical solutions such as the
    use of 'dummy loads' should be considered for commissioning of such power plants
