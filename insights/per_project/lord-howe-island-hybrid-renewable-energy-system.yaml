  source_title: Lord Howe Island Hybrid Renewable Energy System - Solar Resource Data
  publish_date: 2024-07
  project_name: Lord Howe Island Hybrid Renewable Energy Project
  what_happened: On-site solar monitoring conducted December 2014 to November 2015
    measured GHI 2.6% below SolarGIS satellite data for the same period, a variance
    attributed to localised island factors. Despite this discrepancy, the synthesised
    long-term average dataset was used for system sizing and subsequently validated
    by three years of operational measurements.
  lesson_learnt: When using satellite-derived solar resource data (e.g. SolarGIS)
    for islanded or coastal locations, conduct at least 12 months of concurrent on-site
    monitoring and cross-validate against the satellite dataset — localised factors
    can introduce site-specific biases of 2–3% that, if undetected, would affect system
    sizing. A 2.6% adjustment applied at this project kept design assumptions within
    operational bounds.
