- record_id: ARENA-DLV-50404
  source_title: 'Lord Howe Island Renewable Energy Project Lessons Learnt Report:
    System Hardening'
  publish_date: 2021-08
  project_name: Lord Howe Island Renewable Energy Project (HREP)
  what_happened: Community culture on Lord Howe Island — a small, tourism-dependent
    community with strong pride in the island's natural appearance — was assessed
    as materially reducing the vandalism risk that conventional perimeter fencing
    is partly intended to address, enabling a lower-security hardening solution to
    be accepted as adequate.
  lesson_learnt: On remote island or tightly-knit community sites, formal risk assessments
    for vandalism and unauthorised access should incorporate community cultural factors;
    a low-vandalism social context can justify departing from standard security infrastructure
    and may allow simpler, lower-impact hardening solutions to be approved.
