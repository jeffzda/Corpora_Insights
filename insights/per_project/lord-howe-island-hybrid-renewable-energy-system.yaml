- record_id: ARENA-DLV-34355
  source_title: Lord Howe Island Renewable Energy Project System Design Report
  publish_date: 2021-08
  project_name: Lord Howe Island Hybrid Renewable Energy Project (HREP)
  what_happened: Inverter-based generation (BESS inverters only, no diesel running)
    produced short-circuit fault currents too low to trip the 800A BESS MCCBs within
    an acceptable timeframe — fault clearance took 13 seconds, which was identified
    as unsafe. Standard MCCB protection sized for nominal current and overload was
    insufficient for inverter-dominated fault conditions.
  lesson_learnt: In inverter-dominated microgrids operating without diesel generation
    (e.g. overnight BESS-only mode), standard MCCB protection cannot be relied upon
    for fault clearance — specify a dedicated protection relay capable of detecting
    low fault currents and tripping within safe clearance times as part of the initial
    electrical protection design.
