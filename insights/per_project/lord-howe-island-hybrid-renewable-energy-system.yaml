  what_happened: Year 1 (2021–22) achieved the highest renewable energy penetration
    of the three years (73.0%) not because solar generation was highest, but because
    island electricity demand was substantially lower — attributed to COVID-19 travel
    restrictions reducing tourist numbers. In year 3, solar generation was higher
    than year 1 but demand was 9% higher, requiring more diesel generation and resulting
    in lower RE penetration.
  lesson_learnt: For island or remote microgrid systems where tourism or seasonal
    demand is a significant load driver, renewable penetration forecasts must explicitly
    model demand variability scenarios — a fixed generation capacity will deliver
    materially different RE penetration depending on total demand, independent of
    solar resource or system performance.
