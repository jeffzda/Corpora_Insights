  project_name: Lord Howe Island Hybrid Renewable Energy Project (HREP)
  what_happened: Solar PV output is curtailed during periods when the BESS is fully
    charged and solar generation exceeds grid demand. This curtailment was observed
    predominantly from September to March (the higher-irradiance period), resulting
    in lower performance ratios during those months despite higher solar resource
    availability.
  lesson_learnt: In islanded microgrid systems with fixed demand ceilings, size battery
    storage with sufficient capacity to absorb peak solar generation during high-irradiance
    months, or model curtailment losses explicitly — curtailment during peak irradiance
    periods will systematically reduce performance ratios and limit the achievable
    renewable fraction during the best solar months.
