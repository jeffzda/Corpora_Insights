  publish_date: 2021-08
  project_name: Lord Howe Island Renewable Energy Project (HREP)
  what_happened: Supplier modifications to both the Tesla BESS inverter DC isolator
    (staple-and-padlock addition) and the SMA inverter DC isolator (padlock-capable
    modification with heavy-duty conduit for all cables) were required and approved
    by each supplier to enable compliant restricted access without a perimeter fence.
  lesson_learnt: Where site constraints preclude standard perimeter fencing, inverter
    and equipment suppliers can be engaged to approve non-standard access-restriction
    modifications; documenting supplier approval for such modifications is essential
    for AS5033 compliance sign-off and future maintenance.
