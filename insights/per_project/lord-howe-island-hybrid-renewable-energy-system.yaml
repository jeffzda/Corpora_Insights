  source_title: 'Lord Howe Island Renewable Energy Project: Solar Resource Data Report'
  publish_date: 2022-11
  project_name: Lord Howe Island Hybrid Renewable Energy Project
  what_happened: The pre-investment solar resource analysis (conducted in 2016 using
    a synthesised long-term average calibrated against SolarGIS satellite data) predicted
    annual GHI of 1,648.7 kWh/m² — actual measured GHI in the first year of operation
    was 1,629 kWh/m², a variance of only 1.2%.
  lesson_learnt: For remote island micro-grid solar projects, calibrating satellite-derived
    resource data (SolarGIS) against at least 12 months of on-site monitoring before
    the investment decision produces a pre-construction irradiance estimate accurate
    to within ~1–3%, providing a reliable basis for system sizing and diesel displacement
    targets.
