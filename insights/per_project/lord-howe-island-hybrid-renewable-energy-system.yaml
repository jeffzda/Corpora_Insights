- record_id: ARENA-DLV-22206
  source_title: 'ARENA Knowledge Sharing Report: Public Project Knowledge Sharing
    – Lord Howe Island Renewable Energy Project'
  publish_date: 2024-05
  project_name: Lord Howe Island Hybrid Renewable Energy Project
  what_happened: No geotechnical testing was conducted on the site prior to tendering.
    Tenderers were required to carry their own geotechnical risk, which typically
    inflated tender prices as they allowed for uncertainties such as the presence
    of rock requiring pre-drilling and additional materials for piling.
  lesson_learnt: Conduct at least preliminary geotechnical testing before issuing
    tender documents for solar farms — providing results to tenderers reduces the
    risk premium priced into bids and avoids passing unnecessary cost uncertainty
    to the market.
  issue_severity: moderate
  project_type: multi-technology/hybrid
  project_scale_band: demonstration
  lifecycle_phase: approvals/contracting
  proponent_type: government/public-sector body
  delay_category: procurement/supply chain
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Photon Energy selected S-rack mounting structures which provided
    flexible foundations suited to the steep and variable ground conditions discovered
    on site.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id004
  - 9
  evidence_excerpt: No geotechnical testing was done onsite prior to tendering. This
    was therefore a risk borne by the tenderers. Such risks typically increase the
    tender price as tenderers need to make an allowance for geotechnical uncertainties
    such as the presence of rock... It is therefore recommended to undertake some
    level of geotechnical testing onsite and provide the results to tenderers as part
    of tender materials.
  confidence_note: null
