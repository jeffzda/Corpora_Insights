- record_id: ARENA-DLV-34356
  source_title: Lord Howe Island Renewable Energy Project System Design Report
  publish_date: 2021-08
  project_name: Lord Howe Island Hybrid Renewable Energy Project (HREP)
  what_happened: The BESS was configured as the primary grid-forming entity in the
    microgrid at all times, including during diesel generation. A fallback frequency-droop
    control mechanism was implemented so that if communication between the Tesla MGC
    and PV inverters or diesel generators was lost, the BESS could still manage system
    frequency and control output of other generating sources without relying on the
    communication network.
  lesson_learnt: Design a frequency-droop fallback control path independent of the
    primary communication network — in islanded microgrids, communication loss to
    any generating asset should not result in loss of system control or supply security.
