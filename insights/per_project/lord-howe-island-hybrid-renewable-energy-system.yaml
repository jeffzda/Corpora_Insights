- record_id: ARENA-DLV-34357
  source_title: Lord Howe Island Renewable Energy Project System Design Report
  publish_date: 2021-08
  project_name: Lord Howe Island Hybrid Renewable Energy Project (HREP)
  what_happened: When the BESS approached full charge (90% SOE) during periods of
    high solar generation, excess PV output risked causing system frequency to rise
    above the trip threshold because the combined island load and battery charging
    could not absorb all available solar power. The MGC was configured to curtail
    solar PV output progressively from 90% to 95% BESS SOE to manage this.
  lesson_learnt: In solar-plus-storage microgrids, configure automatic PV curtailment
    triggered before the BESS reaches full charge — without it, excess solar generation
