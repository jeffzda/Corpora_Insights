- record_id: ARENA-DLV-48907
  source_title: 'Lord Howe Island Lessons Learnt Report: Value Management'
  publish_date: '2019-11-15'
  project_name: Lord Howe Island Hybrid Renewable Energy Project
  what_happened: The project planning phase ran from 2014 to contract award in 2019
    — a five-year period during which technology capability and community values evolved
    materially. Without a formal mechanism to re-examine project assumptions, the
    project risked being locked into an outdated design.
  lesson_learnt: For projects with multi-year planning phases, schedule a formal value
    management review before design freeze and contract award — technology and community
    expectations shift over time, and a structured check-in can prevent locking in
    outdated solutions while there is still flexibility to adjust.
  issue_severity: moderate
  project_type: multi-technology/hybrid
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: government/public-sector body
  delay_category: null
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: The Board commissioned further feasibility studies through Jacobs
    from 2017, leading to a reconfigured solar-plus-storage design that matched updated
    technology and community expectations before contract award.
  transferability: broad
  delay_magnitude: null
  technology_domain: hybrid systems
  source_pages: &id035
  - 1
  evidence_excerpt: Micro grid renewable energy projects can take some time to get
    from project inception to contract commencement, and during that time, technology
    and the client concept of value can evolve. The Lord Howe Island Board sought
    to ensure that the extended planning phase for the Lord Howe Island Hybrid Renewable
    Energy Project did not result in the project failing to keep up with latest technology
    and community values.
  confidence_note: issue_severity set to moderate — the wind component removal and
    five-year planning lag represent meaningful rescope, though the project ultimately
    delivered within budget.
