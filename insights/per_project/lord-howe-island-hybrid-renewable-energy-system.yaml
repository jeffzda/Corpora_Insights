  what_happened: Value engineering during the design phase consolidated two separate
    solar arrays into a single array near the existing powerhouse, eliminating the
    need for high-voltage distribution infrastructure including transformers and switchgear.
    The resulting cost savings were reinvested in additional solar panels and increased
    battery storage capacity, raising the modelled renewable energy penetration from
    the original design to 69%.
