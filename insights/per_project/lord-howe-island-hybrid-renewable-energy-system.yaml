- record_id: ARENA-DLV-34351
  source_title: Lord Howe Island Renewable Energy Project System Design Report
  publish_date: 2021-08
  project_name: Lord Howe Island Hybrid Renewable Energy Project (HREP)
  what_happened: The initial 2016 development application for Lord Howe Island's renewable
    energy project, which included wind generation, was refused consent because wind
    turbines were deemed aesthetically incompatible with the UNESCO World Heritage
    listed island. The project was redesigned to use only solar PV and battery storage
    before proceeding.
  lesson_learnt: On heritage-listed or environmentally sensitive sites, screen technology
    options for visual and ecological compatibility before finalising the design for
    planning approval — wind turbines were incompatible with a World Heritage site
    and their inclusion caused a failed application, adding years to the development
    timeline.
