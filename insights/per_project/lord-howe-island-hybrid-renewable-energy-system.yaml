  source_title: 'ARENA Knowledge Sharing Report: Public Project Knowledge Sharing
    – Lord Howe Island Renewable Energy Project'
  publish_date: 2024-05
  project_name: Lord Howe Island Hybrid Renewable Energy Project
  what_happened: During commissioning, the island experienced a 3-hour island-wide
    outage and the first black start attempt failed, leaving the island without power
    for an extended period.
  lesson_learnt: For islanded microgrid commissioning, require contractors to minimise
    outages and plan for black start failure — technical solutions such as dummy loads
    running off the genset should be used to maintain island power supply during commissioning
    activities.
