- record_id: ARENA-DLV-16305
  source_title: The Tidal Turbine Reef (TTR) Feasibility Study
  publish_date: 2018-05
  project_name: Tidal Turbine Reef (TTR) Feasibility Study
  what_happened: The foundation base length was governed by the 'sea-chesting' controlled-ballasting
    installation procedure rather than in-place structural requirements. This meant
    the structure had to be larger and heavier than would otherwise be required, increasing
    CAPEX. The concrete base doubled in size from the initial Phase 1A estimate as
    a result of these installation-driven constraints.
  lesson_learnt: For gravity-based offshore tidal structures using wet-tow and sea-chesting
    installation, installation procedure requirements will likely govern foundation
    dimensions rather than in-place load conditions — designers must integrate installation
    engineering into the structural design process from the outset to avoid underestimating
    foundation size and cost.
