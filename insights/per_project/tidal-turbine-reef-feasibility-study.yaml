  source_title: The Tidal Turbine Reef (TTR) Feasibility Study
  publish_date: 2018-05
  project_name: Tidal Turbine Reef (TTR) Feasibility Study
  what_happened: Formwork costs for the reinforced concrete foundation base were found
    to represent approximately 50% of total wall construction costs. The original
    compartment design used non-square internal dimensions that limited formwork reuse,
    increasing fabrication cost unnecessarily.
  lesson_learnt: Concrete tidal foundation structures should be designed with square
    internal compartment dimensions from the outset to maximise formwork reuse — non-square
    compartments prevent reuse of the same panels and materially increase fabrication
    cost given that formwork accounts for roughly half of total wall construction
    cost.
