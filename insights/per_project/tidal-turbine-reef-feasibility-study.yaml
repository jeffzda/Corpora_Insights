  - 53
  evidence_excerpt: The TTR concept is very site-specific. For locations that have
    the required water depth, current speed and proximity to land, the energy production
    costs are still roughly an order of magnitude higher than conventionally generated
    electricity... The eight-turbine concept may only produce up to about 73% of the
    electricity demand.
