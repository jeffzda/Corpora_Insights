- record_id: ARENA-DLV-16303
  source_title: The Tidal Turbine Reef (TTR) Feasibility Study
  publish_date: 2018-05
  project_name: Tidal Turbine Reef (TTR) Feasibility Study
  what_happened: The TTR concept was found to be highly site-specific, requiring a
    combination of sufficient water depth (13–18 m relative to LAT), current speeds
    above 3 m/s maximum, and proximity to shore to avoid expensive subsea cabling.
    At the selected One Arm Point site, water depth constrained the design to a single
    row of turbines and the 8-turbine concept could only produce approximately 73%
    of the community's energy demand.
  lesson_learnt: Tidal energy project developers must conduct rigorous site pre-screening
    against a multi-criteria envelope (water depth, current speed, proximity to shore)
    before committing to a concept design — failure to meet any one criterion can
    fundamentally limit the number of turbines deployable and render the project unable
    to meet energy demand targets.
  issue_severity: moderate
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: concept/feasibility
  proponent_type: technology vendor
  delay_category: null
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: The concept was adapted to a single row of eight turbines within
    the available 13 m water depth, and a 16-turbine option was modelled to show how
    slightly deeper water (16–18 m) could accommodate a second row with minimal additional
    cost.
  transferability: moderate
  delay_magnitude: null
  technology_domain: other
  source_pages: &id003
