- record_id: ARENA-DLV-16301
  source_title: The Tidal Turbine Reef (TTR) Feasibility Study
  publish_date: 2018-05
  project_name: Tidal Turbine Reef (TTR) Feasibility Study
  what_happened: Phase 1A financial modelling found the initial TTR design was economically
    unviable at current electricity prices, with an LCOE of $939–$2,337/MWh, costs
    double industry standard, and annual revenue projections unable to cover annual
    OPEX. Particular financial issues centred on transmission costs and the size of
    the supporting structure.
  lesson_learnt: For novel marine energy concepts, conduct early-stage financial modelling
    against industry benchmarks before advancing detailed design — Phase 1A revealed
    fundamental commercial non-viability driven by transmission costs and structure
    sizing, enabling a targeted redesign in Phase 1B rather than investing in a fatally
    flawed configuration.
