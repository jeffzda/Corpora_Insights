  source_title: The Tidal Turbine Reef (TTR) Feasibility Study
  publish_date: 2018-05
  project_name: Tidal Turbine Reef (TTR) Feasibility Study
  what_happened: Energy yield was identified through tornado chart sensitivity analysis
    as the single largest driver of LCOE, having a greater impact than total CAPEX
    or total OPEX. A ±10% variation in annual delivered energy had a larger swing
    effect on LCOE than equivalent percentage changes in any cost category.
  lesson_learnt: For early-stage tidal energy feasibility studies, resource quality
    and certainty should be treated as the primary financial risk — investment in
    detailed resource characterisation (physical measurement and numerical modelling)
    delivers greater financial model confidence than equivalent effort spent refining
    cost estimates, because energy yield uncertainty dominates LCOE sensitivity.
