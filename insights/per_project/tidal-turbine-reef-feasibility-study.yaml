- record_id: ARENA-DLV-16309
  source_title: The Tidal Turbine Reef (TTR) Feasibility Study
  publish_date: 2018-05
  project_name: Tidal Turbine Reef (TTR) Feasibility Study
  what_happened: The available SCHOTTEL SIT 250 turbines had limited customisation
    options — only 4 m or 6.3 m diameter rotors were available — meaning their power
    curves could not be optimised to the specific flow regime at One Arm Point. At
    the slower end of current speeds the turbines did not achieve maximum output,
    and at higher speeds they cut out entirely, producing no output.
  lesson_learnt: When selecting turbines for niche tidal sites with distinctive flow
    profiles, verify that available commercial turbine models can be configured or
    customised for the site-specific current speed distribution — off-the-shelf turbines
    with fixed power curves and cut-out velocities may leave significant energy on
    the table at both low and high ends of the resource, materially degrading capacity
    factor and LCOE.
