- record_id: ARENA-DLV-16311
  source_title: The Tidal Turbine Reef (TTR) Feasibility Study
  publish_date: 2018-05
  project_name: Tidal Turbine Reef (TTR) Feasibility Study
  what_happened: The TTR installation was found to be heavily dependent on a narrow
    weather and tidal window — requiring neap tides (tidal range ≤2 m), wave heights
    ≤0.3 m, wind ≤10 m/s, and a three-day calm forecast simultaneously. Installation
    current speeds for extended operations needed to be below 2 m/s, limiting operations
    to neap tide periods only.
  lesson_learnt: Offshore tidal structure installation programs must be designed around
    narrow combined weather-tide windows — project schedules should incorporate realistic
    weather downtime allowances based on site-specific metocean data, and installation
    sequencing should be planned to exploit predictable neap tide cycles; failure
    to account for multi-parameter installation limits will result in significant
    schedule contingency under-estimation.
  issue_severity: moderate
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: construction/installation
  proponent_type: technology vendor
  delay_category: construction/installation
