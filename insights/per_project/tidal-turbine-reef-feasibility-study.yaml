- record_id: ARENA-DLV-16320
  source_title: The Tidal Turbine Reef (TTR) Feasibility Study
  publish_date: 2018-05
  project_name: Tidal Turbine Reef (TTR) Feasibility Study
  what_happened: The design changed from a steel to a reinforced concrete foundation
    base between Phase 1A and Phase 1B after review showed concrete was cheaper for
    fabrication and provided better in-place load resistance due to its greater weight.
    However, the concrete base subsequently doubled in size from the initial estimate
    as design development progressed, raising questions about whether steel might
    ultimately be cost-competitive.
  lesson_learnt: Material selection for novel offshore gravity-base structures should
    be deferred until installation requirements are fully defined — initial cost comparisons
    between steel and concrete can be invalidated when installation-driven constraints
    cause the structure to grow significantly, potentially reversing the initial cost
    advantage of the heavier material.
  issue_severity: moderate
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: The study concluded that steel may be in the same price range
    as the concrete base at the revised size, but flagged unresolved engineering questions
    around steel's ability to resist installation loads and long-term corrosion costs.
  transferability: narrow
  delay_magnitude: null
  technology_domain: other
  source_pages: &id020
  - 26
  - 50
  evidence_excerpt: In Phase 1A, the project based its design on a steel foundation.
    Upon review, it was shown to be cheaper to change to concrete for fabrication...
