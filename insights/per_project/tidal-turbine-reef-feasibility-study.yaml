- record_id: ARENA-DLV-16319
  source_title: The Tidal Turbine Reef (TTR) Feasibility Study
  publish_date: 2018-05
  project_name: Tidal Turbine Reef (TTR) Feasibility Study
  what_happened: OPEX estimates for the TTR were partially derived from offshore wind
    industry cost breakdowns (by percentage) rather than a bottom-up estimate specific
    to the tidal project, with only the maintenance component estimated from project-specific
    data. This was identified as a significant weakness in the financial model, as
    maintenance was simultaneously the largest OPEX cost driver (38%) and the least
    robustly estimated.
  lesson_learnt: Tidal energy OPEX estimates must be built bottom-up from project-specific
    maintenance plans rather than scaled from offshore wind cost breakdowns — using
    wind industry percentage-based OPEX proxies for tidal projects introduces systematic
    error, particularly for maintenance costs which are operationally distinct and
    represent the dominant OPEX driver.
  issue_severity: moderate
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: concept/feasibility
  proponent_type: technology vendor
