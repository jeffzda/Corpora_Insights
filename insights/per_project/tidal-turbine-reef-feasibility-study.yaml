  source_title: The Tidal Turbine Reef (TTR) Feasibility Study
  publish_date: 2018-05
  project_name: Tidal Turbine Reef (TTR) Feasibility Study
  what_happened: Scaling from an 8-turbine to a 16-turbine TTR concept (by adding
    a second row) was found to reduce CAPEX per MW from AUD $15.7 million to AUD $10.5
    million — a 33% reduction — with transportation and offshore installation costs
    unchanged, as the foundation base increase was marginal. The 16-turbine concept
    also achieved an LCOE of AUD $527/MWh versus AUD $782/MWh for the 8-turbine concept.
  lesson_learnt: For fixed-platform tidal array concepts, scaling to a second row
    of turbines at a site with sufficient water depth delivers substantial economies
    of scale — CAPEX per MW and LCOE reduce by approximately one-third while installation
    costs remain near-constant; project developers should prioritise sites that enable
    multi-row configurations as a primary cost reduction lever.
