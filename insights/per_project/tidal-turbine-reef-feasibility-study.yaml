  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: The transport strategy was split into two legs — a weather-tolerant
    tow to Broome staging port, and a weather-dependent final installation tow — to
    avoid incurring vessel day-rate charges waiting at site for suitable conditions.
