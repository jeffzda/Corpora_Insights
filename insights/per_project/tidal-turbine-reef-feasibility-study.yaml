- record_id: ARENA-DLV-16304
  source_title: The Tidal Turbine Reef (TTR) Feasibility Study
  publish_date: 2018-05
  project_name: Tidal Turbine Reef (TTR) Feasibility Study
  what_happened: No actual current speed measurements existed for the proposed installation
    site at Pearl Pass, One Arm Point. Current speed estimates were derived by scaling
    data from a different location (Irvine Island) using nautical chart indications,
    resulting in significant uncertainty in resource assessment and all downstream
    energy yield and financial modelling.
  lesson_learnt: Marine renewable energy projects must obtain site-specific current
    speed measurements before finalising energy yield estimates and financial models
    — using scaled proxy data from a different location with complex bathymetry introduces
    unquantifiable uncertainty that undermines the credibility of LCOE and investment
    decisions.
