  what_happened: No environmental impact assessment or engagement with environmental
    approvals was conducted during the feasibility study. The report noted that tidal
    turbines in an open marine environment are not well understood in Australia, and
    no regulatory pathway for approval had been identified.
  lesson_learnt: Tidal energy project developers in Australia must initiate environmental
    impact assessment and regulatory pathway identification in parallel with technical
    feasibility work — the absence of established approval frameworks for open-marine
    tidal devices represents a significant unquantified risk that could delay or prevent
    project progression regardless of technical and financial viability.
