- record_id: ARENA-DLV-16307
  source_title: The Tidal Turbine Reef (TTR) Feasibility Study
  publish_date: 2018-05
  project_name: Tidal Turbine Reef (TTR) Feasibility Study
  what_happened: The weight of the TTR structure alone was insufficient to resist
    base shear from extreme tidal current lateral loads, requiring a grout shear interface
    foundation system. However, reducing structural weight to minimise CAPEX created
    a competing risk — insufficient self-weight meant the structure could not remain
    stable during the post-installation grouting period when subject to tidal currents.
  lesson_learnt: 'Fixed tidal structure design involves a competing weight optimisation
    problem: reducing weight saves CAPEX but compromises installation stability during
    grouting — designers should establish a minimum self-weight threshold for the
    installation environment before pursuing weight reduction strategies, and not
    optimise weight in isolation from the installation sequence.'
  issue_severity: moderate
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The design retained sufficient concrete mass to ensure gravity-based
    stability during the grouting period, accepting higher CAPEX rather than risking
    installation failure.
  transferability: narrow
  delay_magnitude: null
  technology_domain: other
  source_pages: &id007
