- record_id: ARENA-DLV-16302
  source_title: The Tidal Turbine Reef (TTR) Feasibility Study
  publish_date: 2018-05
  project_name: Tidal Turbine Reef (TTR) Feasibility Study
  what_happened: Phase 1B economic modelling found the best-case LCOE for the 16-turbine
    TTR scenario was AUD $527/MWh (12-knot resource), which is still approximately
    3.4 times the estimated diesel cost of AUD $678/MWh and requires cost reductions
    of 56–75% to reach 2025–2030 industry targets — meaning the concept is not yet
    commercially viable for grid-connected markets.
  lesson_learnt: First-of-kind tidal energy devices targeting remote diesel displacement
    can achieve economic parity with diesel generation before reaching grid parity
    — project developers should frame early feasibility around diesel replacement
    economics and energy security rather than grid electricity benchmarks, as these
    offer a more accessible initial market.
