- record_id: ARENA-DLV-16306
  source_title: The Tidal Turbine Reef (TTR) Feasibility Study
  publish_date: 2018-05
  project_name: Tidal Turbine Reef (TTR) Feasibility Study
  what_happened: Steel columns supporting the turbines were found to be governed by
    vortex-induced vibrations (VIV) rather than static load requirements. The report
    noted this is a problem for all fixed tidal structures and becomes increasingly
    difficult to solve as water depth increases, potentially constraining the concept's
    scalability to deeper sites.
  lesson_learnt: VIV is a critical design constraint for steel columns on fixed tidal
    structures and should be assessed as a primary design driver early in concept
    development — increasing water depth significantly worsens VIV risk and may require
    disproportionate increases in column diameter that cascade into higher structural
    loads and self-weight requirements.
