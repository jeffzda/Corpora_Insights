- record_id: ARENA-DLV-16318
  source_title: The Tidal Turbine Reef (TTR) Feasibility Study
  publish_date: 2018-05
  project_name: Tidal Turbine Reef (TTR) Feasibility Study
  what_happened: Using smaller turbines (50–300 kW range) was found to be more economical
    than scaling to a single large turbine, because turbine weight increases with
    the cube of scale while energy capture increases only with the square of scale,
    resulting in a worse power-to-cost ratio at larger sizes. The SIT 250 at 70 kW
    was selected on this basis.
  lesson_learnt: For multi-turbine tidal platform concepts, turbine size optimisation
    should explicitly account for the cubic weight-to-square power scaling relationship
    — the economic optimum lies in the 50–300 kW range for current technology, and
    pursuing larger single turbines to simplify installation will likely increase
    cost per unit of generated power rather than reduce it.
