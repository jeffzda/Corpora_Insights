  what_happened: The 200 m aerial cable span from the TTR to shore was found to be
    close to the conventional limit for standard power pole configurations, requiring
    further investigation to confirm feasibility without introducing more complex
    taller structures or intermediate supporting structures.
  lesson_learnt: For near-shore tidal devices relying on aerial power transmission
    to avoid subsea cabling, cable span length must be verified against standard power
    pole design limits early in the design process — spans approaching 200 m push
    conventional limits and may require bespoke structural solutions that add cost
    and complexity not captured in initial estimates.
