  evidence_excerpt: A final gap we have identified is in undertaking trials, particularly for large scale technologies, that are not subject to pricing and market rules that apply under the current market
    design. Such projects would examine how technologies could more effectively operate and coordinate under different system and market conditions, principally to support system security. ARENA funding
    could help incentivise market participants to engage in these trials by ensuring that the costs to market participants (including potential foregone revenues) are recovered.
