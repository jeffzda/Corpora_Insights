- record_id: ARENA-DLV-25929
  source_title: Review of ARENA's Reliability Portfolio
  publish_date: 2020-01
  project_name: ARENA Reliability Portfolio — Trials Under Alternative Market Arrangements
  what_happened: The portfolio evaluation identified a gap in the absence of trials for large-scale technologies operating under pricing and market rules different from the current NEM design. Without such
    trials, the sector lacks evidence about how technologies would behave and whether they could be commercially viable under alternative market structures that may need to be introduced to support high
    VRE penetration.
  lesson_learnt: To prepare the sector for potential market redesign at high VRE penetration, ARENA should fund large-scale technology trials specifically designed to operate under alternative market arrangements
    — compensating participants for foregone revenues under the current market — similar to the approach used for demand response projects.
