- record_id: ARENA-DLV-14677
  source_title: 'Lessons From the Fringes: Australian Fringe-Of-Grid Projects in ARENA''s
    Portfolio'
  publish_date: 2018-06
  project_name: Multiple FOG Projects (Barcaldine, Lakeland, Longreach)
  what_happened: All three FOG solar projects for which MLF data was available experienced
    MLF drops of over 10% within less than three years of operation, driven by the
    rapid influx of large-scale solar generation in regions previously remote from
    bulk generation.
  lesson_learnt: MLF degradation of 10% or more within the first three years of operation
    is a demonstrated pattern for FOG solar projects in the NEM — all FOG solar project
    financial models must include dynamic MLF stress scenarios, and proponents should
    advocate for MLF protection mechanisms in PPAs.
