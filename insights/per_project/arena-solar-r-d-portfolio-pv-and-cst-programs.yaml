- record_id: ARENA-DLV-40362
  source_title: 'In The Spotlight: Australian Solar Energy R&D Outcomes and Achievements in a Global Context'
  publish_date: 2018-07
  project_name: ARENA Solar R&D Portfolio (PV and CST Programs)
  what_happened: Key PV research achievements at UNSW and ANU built on long-term funding commitments spanning many years and the establishment of well-functioning research teams. Projects that received
    sustained multi-year funding produced world-leading results, whereas newer or shorter-funded groups produced fewer commercial outcomes.
  lesson_learnt: Sustained, multi-year funding commitments to established research teams produce disproportionately higher commercial research outcomes than short-term grants — program designers should
    prioritise funding continuity for productive research groups over repeated competitive rounds that fragment effort and destabilise teams.
