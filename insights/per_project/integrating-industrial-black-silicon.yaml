  what_happened: Testing of surface deposition techniques on academic nanotextures
    revealed that the relationship between texture type and ability to form a good
    electrical surface was counterintuitive — textures assumed by convention to be
    impossible to passivate performed better than expected, while less aggressive
    morphologies encountered more problems than anticipated.
  lesson_learnt: Conventional assumptions about which black silicon texture morphologies
    are electrically passivatable should not be relied upon without empirical testing
    — some textures assumed to be incompatible with passivation worked better than
    expected, while apparently easier textures showed more problems. Experimental
    validation of passivation compatibility is essential before ruling out texture
    types.
