  what_happened: The performance of passivation layers with embedded charge on nanotextured
    surfaces did not follow the expected relationship with increasing charge assumed
    in prior literature — nano-scale features were found to impact charge effectiveness
    through short-range effects, making standard passivation design rules inapplicable
    to black silicon.
  lesson_learnt: Passivation layer design rules derived for planar or conventional
    textures cannot be directly applied to nanotextured surfaces — short-range charge
    effects unique to nano-scale geometry alter passivation performance in ways that
    require dedicated simulation studies before process targets can be set.
