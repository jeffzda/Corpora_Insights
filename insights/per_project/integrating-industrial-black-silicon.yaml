  publish_date: '2019-08-28'
  project_name: Integrating Industrial Black Silicon with High Efficiency Multicrystalline
    Solar Cells
  what_happened: The project found that very small nanotextures do not behave optically
    as textures but instead behave as thin surface films — a phenomenon commonly neglected
    in projects developing 'texture on texture' solutions, leading to modelling inaccuracies.
  lesson_learnt: Projects developing texture-on-texture solar cell solutions should
    account for the thin-film optical behaviour of very small nanotextures — treating
    them as geometric textures leads to modelling errors. This finding should be explicitly
    checked when benchmarking against or combining with sub-wavelength texture features.
