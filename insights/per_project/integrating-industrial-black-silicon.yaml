  publish_date: '2019-08-28'
  project_name: Integrating Industrial Black Silicon with High Efficiency Multicrystalline
    Solar Cells
  what_happened: Point-by-point reflectance mapping — the existing approach for measuring
    texture uniformity — was found to be adequate in accuracy but prohibitively slow,
    taking several hours per sample. This timescale was unworkable when studying a
    broad array of textures or for production-line quality control purposes.
  lesson_learnt: When designing experimental workflows involving large numbers of
    texture samples, assess the throughput of characterisation methods upfront — slow
    but accurate point-by-point methods may be individually adequate but become a
    bottleneck at scale. Invest early in rapid alternatives when throughput requirements
    are known.
