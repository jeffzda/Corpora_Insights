    are encapsulated in a module, because the first reflection from the glass dominates
    module performance and is not significantly influenced by the underlying texture.
  lesson_learnt: When citing angular performance benefits of advanced textures as
    a motivation for adoption, account for the optical impact of module encapsulation
    — glass front surface reflection dominates module angular response and can negate
    texture-level advantages, requiring the benefit claim to be reassessed at the
    system level.
