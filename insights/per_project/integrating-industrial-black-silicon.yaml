  what_happened: Existing ray-tracing models for random pyramid texture — the incumbent
    high-efficiency cell technology — were found to contain errors and did not accurately
    reproduce absorption in silicon substrates. No solution had been proposed in the
    literature prior to this project, and the errors caused approximately 0.7% inaccuracy
    in energy yield predictions.
  lesson_learnt: Do not assume that incumbent texture simulation models are sufficiently
    accurate for energy yield assessments — validate models against experimental optical
    measurements and rigorous solving before relying on them for design optimisation,
    and apply corrective scattering distributions (e.g. Gaussian exit-angle model
    for random pyramids) where errors are identified.
