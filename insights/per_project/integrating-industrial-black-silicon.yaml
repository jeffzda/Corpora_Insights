- record_id: ARENA-DLV-61804
  source_title: Integrating Industrial Black Silicon with High Efficiency Multicrystalline
    Solar Cells
  publish_date: '2019-08-28'
  project_name: Integrating Industrial Black Silicon with High Efficiency Multicrystalline
    Solar Cells
  what_happened: Rapid optical modelling techniques were found to be insufficiently
    accurate for plasma-etched black silicon textures across longer wavelengths, as
    this texture type crosses the boundary between ray-tracing and electromagnetic
    modelling regimes. The limitation was confirmed by measured vs. modelled reflection
    data showing divergence at longer wavelengths.
  lesson_learnt: Projects modelling solar cell textures should verify that the texture's
    surface height statistics fall within the valid domain for their chosen modelling
    approach — plasma black silicon textures cannot be accurately ray-traced across
    the full wavelength range and require more rigorous electromagnetic solving for
    longer wavelengths.
