  what_happened: Cell- and wafer-level optical simulations were found to predict different
    optimal design points and performance gains compared to system-level simulations
    that include module encapsulation under glass and real-world angular light conditions.
    The best-known simulation techniques for incumbent textures also contained significant
    errors, with random pyramid texture models producing errors on the order of 0.7%
    in energy yield.
