- record_id: ARENA-DLV-61801
  source_title: Integrating Industrial Black Silicon with High Efficiency Multicrystalline
    Solar Cells
  publish_date: '2019-08-28'
  project_name: Integrating Industrial Black Silicon with High Efficiency Multicrystalline
    Solar Cells
  what_happened: Commercial nanotexture characterisation tools (including conventional
    atomic force microscopy) were found to produce inaccurate or inadequate results
    for certain high-aspect-ratio and overhanging black silicon nanotextures. Suitable
    tools for rapid texture uniformity measurement and detailed optical scattering
    characterisation of low-reflectance textures were not commercially available,
    requiring custom development by the project team.
  lesson_learnt: Before committing to a characterisation methodology for complex nanotextures,
    validate that commercial tools are appropriate for the specific texture type —
    conventional AFM can produce inaccurate quantitative data for high-aspect-ratio
    or overhanging features. Plan and budget for custom tool development if working
    with extreme nanotextures, as standard tools may not suffice.
