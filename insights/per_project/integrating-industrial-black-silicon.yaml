  what_happened: Existing focused-ion-beam scanning electron microscope (FIB-SEM)
    techniques applied to nanotextures in prior literature were found to be filled
    with measurement artefacts, and no signal processing approach existed to convert
    image series into surface topography reconstructions. The project needed to solve
    both problems before 3D characterisation of extreme black silicon textures was
    possible.
  lesson_learnt: When extending established microscopy techniques to novel surface
    morphologies, prior literature results may contain systematic artefacts — independent
    validation via comparison to well-characterised reference surfaces is essential
    before relying on extracted data for modelling or process design.
