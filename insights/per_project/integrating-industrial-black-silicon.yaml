- record_id: ARENA-DLV-61807
  source_title: Integrating Industrial Black Silicon with High Efficiency Multicrystalline
    Solar Cells
  publish_date: '2019-08-28'
  project_name: Integrating Industrial Black Silicon with High Efficiency Multicrystalline
    Solar Cells
  what_happened: Commercial black silicon texturing was successfully integrated into
    solar cell production and improved performance compared to prior texturing technology.
    However, only moderately low-reflectance ('grey silicon') textures could be used
    in production — truly low-reflectance black silicon could not function as a drop-in
    replacement because its nano-sized features negatively interacted with standard
    front-side coating and metal contact processes, reducing electrical performance
    more than the optical gain compensated.
  lesson_learnt: Projects seeking to deploy ultra-low-reflectance black silicon in
    commercial solar cell production should not assume it is a drop-in replacement
    for existing texturing — the nano-features require co-optimisation of front-end
    processing, surface coating deposition techniques, and metal contact approaches
    before electrical performance is maintained.
  issue_severity: major
  project_type: null
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated integration
  intervention_note: Project pivoted second-phase work to focus on more aggressive
    low-reflectance textures from industry partners and to develop alternative deposition
    and contact approaches compatible with extreme nanotextures.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id007
  - 12
  evidence_excerpt: Low reflectance black silicon cannot currently be used as a drop-in
    solution for solar cell production. Only moderately low reflectance black silicon
    textures are being implemented in production... in order to maintain compatibility
    with the current industry standard front side coating and metal contact techniques.
    The nano-sized features of the more aggressive black silicon texture interact
    negatively with critical front-end processing resulting in decreased electrical
    performance that out-weighs the increased optical performance.
