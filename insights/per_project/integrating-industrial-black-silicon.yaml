  what_happened: Prior work attributed enhanced phosphorus diffusion in black silicon
    primarily to increased surface area, but this project found through fundamental
    study that surface-to-volume ratio — a metric not previously used for black silicon
    — is the key driver, explaining why smaller nanotexture features cause deeper
    and more complete phosphorus doping that degrades electrical performance.
  lesson_learnt: When characterising black silicon process interactions, use surface-to-volume
    ratio rather than surface area alone as the primary metric — surface area does
    not capture the reactivity of small texture features, leading to incorrect predictions
    of doping behaviour and consequent errors in process optimisation.
