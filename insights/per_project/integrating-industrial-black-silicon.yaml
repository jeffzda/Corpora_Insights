  publish_date: '2019-08-28'
  project_name: Integrating Industrial Black Silicon with High Efficiency Multicrystalline
    Solar Cells
  what_happened: Initial computer modelling validation relied on comparing model outputs
    against measured physical samples, but this approach made thorough comparison
    difficult because achieving a wide enough variation in samples spanning many extremes
    was costly, time-consuming, and introduced experimental error.
  lesson_learnt: When validating rapid optical modelling techniques, supplement measured
    sample data with randomly generated artificial surfaces — this is faster and cheaper
    than fabricating a full range of physical samples and enables more systematic
    exploration of parameter space without experimental error.
