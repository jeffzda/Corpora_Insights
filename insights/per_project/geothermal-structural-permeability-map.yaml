- record_id: ARENA-DLV-17051
  source_title: The Australian Structural Permeability Map Project - Project results
    and lessons learnt
  publish_date: 2018-03
  project_name: The Australian Structural Permeability Map Project
  what_happened: A new 3D magnetotelluric (MT) survey acquired in the Cooper Basin
    produced inconclusive results — the expected reflection of permeability anisotropy
    in directional electrical resistivity was not observed, contrary to findings from
    prior studies in the Otway Basin that had shown promise for the technique.
  lesson_learnt: Do not rely on magnetotellurics alone to detect structural permeability
    anisotropy at depth — results can be inconclusive where fractures lack interconnectivity
    or are filled with non-saline fluids. Future deployment of this technique should
    target sites where fluid flow and permeability are already better constrained
    (e.g. active geothermal fault systems) to validate the method before applying
    it in less certain settings.
