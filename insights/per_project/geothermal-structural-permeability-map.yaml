- record_id: ARENA-DLV-17052
  source_title: The Australian Structural Permeability Map Project - Project results
    and lessons learnt
  publish_date: 2018-03
  project_name: The Australian Structural Permeability Map Project
  what_happened: The budgeted cost and time allocated for developing an interactive
    GIS website to host structural permeability map outputs proved insufficient; the
    university's in-house development team lacked the capability to integrate an interactive
    GIS platform into the university domain, requiring the work to be outsourced to
    a specialist provider who delivered a simplified version of the original design.
  lesson_learnt: When planning research projects that include delivery of an interactive
    GIS web platform, do not assume in-house university IT teams have the capability
    or capacity — budget explicitly for external specialist web/GIS development from
    the outset, and scope the technical requirements of the platform before contracting.
  issue_severity: moderate
  project_type: enabling infrastructure
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: internal governance/resourcing
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: execution & logistics
  intervention_note: Website development was outsourced to a specialist provider who
    delivered a simplified but functional version of the original template within
    time and budget, with a quote for a fully interactive GIS platform for future
    development.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: other
  source_pages: &id002
  - 8
  evidence_excerpt: A key road block to achieving all outcomes of the project was
    that we found the initial budgeted cost and time input insufficient for the development
    of an interactive GIS website to host the structural permeability map content.
    While the project had intended to keep website development in-house for ease of
    data management, we had to outsource this to a specialist who could provide a
    simplified version of our original template.
