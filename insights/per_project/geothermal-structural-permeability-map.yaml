- record_id: ARENA-DLV-17053
  source_title: The Australian Structural Permeability Map Project - Project results
    and lessons learnt
  publish_date: 2018-03
  project_name: The Australian Structural Permeability Map Project
  what_happened: The project successfully demonstrated that geothermal favourability
    proxies — including geomechanical risking via the FAST tool, fault termination
    and intersection density — could be applied at regional scale using existing open-file
    petroleum and minerals exploration datasets to identify structural permeability
    anisotropy, without requiring new expensive drilling.
  lesson_learnt: Integrate open-file petroleum and minerals exploration data with
    geomechanical risking tools (e.g. FAST) and geothermal favourability proxies to
    cost-effectively identify structural permeability at regional scale before committing
    to expensive drilling campaigns — this approach has been validated across multiple
    Australian energy basins and a workflow is freely available at www.aspmp.com.au.
  issue_severity: none
  project_type: enabling infrastructure
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: other
  source_pages: &id003
  - 9
  evidence_excerpt: Focussing on the permeability, and permeability pathway proxies,
    this project demonstrated how regional-scale map data could also be interrogated
    in this way to provide a broader, regional exploration tool to identify areas
    for more detailed investigation.
  confidence_note: transferability set to moderate rather than broad — the lesson
    is specific to geothermal/unconventional subsurface exploration contexts and requires
    geological expertise to apply.
