- record_id: ARENA-DLV-2008
  source_title: Addressing Solar PV End-of-Life Issues and Lowering Solar PV Cost
    – Summary Report
  publish_date: 2024-05
  project_name: ARENA Solar R&D Round 5 – Advanced Silicon Priority Area (Programmatic)
  what_happened: Across the Advanced Silicon projects, a recurring challenge was the
    processing and stability of ultra-thin (<2µm) passivating layers, which required
    tightly controlled thickness uniformity; several technologies also exhibited thermal
    degradation in TOPCon carrier-selective doped silicon–tunnel oxide and SHJ amorphous
    silicon layers.
  lesson_learnt: R&D projects targeting ultra-thin passivating contact layers should
    include dedicated stability and thermal degradation testing as a deliverable milestone,
    as these failure modes consistently emerge when advancing from laboratory to pilot
    scale and are not captured by initial efficiency benchmarks alone.
