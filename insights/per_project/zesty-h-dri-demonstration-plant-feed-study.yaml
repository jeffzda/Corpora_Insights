- record_id: ARENA-DLV-54907
  source_title: ARENA Insights Green Steel Webinar
  publish_date: 2024-05
  project_name: ZESTY H-DRI Demonstration Plant FEED Study
  what_happened: The ZESTY FEED study produced a levelised cost of green HBI production
    in the range of US$410–520 per tonne, with total energy requirements projected
    at 4.2–4.6 MWh per tonne of iron inclusive of hydrogen production, and near-zero
    emissions — economics that approach the range for conventional carbon-intensive
    HBI production assuming wholesale renewable electricity at A$36–48/MWh.
  lesson_learnt: Green hydrogen DRI economics for Australian hematite are sensitive
    to renewable electricity price — FEED-stage cost estimates for novel DRI technologies
    should explicitly model electricity price sensitivity and include a comparison
    against conventional HBI benchmarks to establish the subsidy or carbon price required
    to reach commercial viability.
