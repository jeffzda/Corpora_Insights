- record_id: ARENA-DLV-54906
  source_title: ARENA Insights Green Steel Webinar
  publish_date: 2024-05
  project_name: ZESTY H-DRI Demonstration Plant FEED Study
  what_happened: The ZESTY FEED study found that eliminating pelletisation and sintering
    steps — by processing iron ore fines of less than approximately 0.3mm directly
    — saves considerable capital and operating expenditure compared to conventional
    DRI routes that require agglomeration, while achieving metallisation degrees of
    75–98% across nine Australian ore variants.
  lesson_learnt: For hydrogen DRI projects using Australian hematite ores, the ability
    to bypass pelletisation and sintering represents a material capital and operating
    cost advantage — project developers should explicitly evaluate whether their chosen
    DRI technology can process ore fines directly before committing to agglomeration
    infrastructure.
