- record_id: ARENA-DLV-54910
  source_title: ARENA Insights Green Steel Webinar
  publish_date: 2024-05
  project_name: ZESTY H-DRI Demonstration Plant FEED Study
  what_happened: The FEED study evaluated two operating scenarios for hydrogen supply
    — a preferred over-the-fence green hydrogen supply arrangement and a fall-back
    in-house electrolyser within the project — reflecting uncertainty about whether
    third-party green hydrogen supply will be commercially available at the required
    price point at the time of project commissioning.
  lesson_learnt: Green iron demonstration projects dependent on hydrogen supply should
    design process systems with flexibility to accommodate both over-the-fence supply
    and on-site electrolysis from the outset — locking in a single hydrogen supply
    model at FEED stage creates stranded-investment risk if the preferred supply route
    is not available at commissioning.
  issue_severity: minor
  project_type: industrial decarbonisation
  project_scale_band: demonstration
