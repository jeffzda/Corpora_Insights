  source_title: ARENA Insights Green Steel Webinar
  publish_date: 2024-05
  project_name: ZESTY H-DRI Demonstration Plant FEED Study
  what_happened: Calix completed a FEED study for a 30,000 tonne per annum ZESTY Hydrogen
    Direct Reduced Iron demonstration plant, supported by an A$947,035 ARENA grant
    covering approximately 50% of FEED costs. The study produced capital and operating
    cost estimates to +/-25% accuracy and finalised inputs required for a Final Investment
    Decision.
  lesson_learnt: A structured FEED study co-funded at approximately 50% by ARENA can
    bring a novel iron-reduction technology from pilot scale to FID-ready status,
    with the FEED deliverables — site layout, permitting, equipment sizing, construction
    methodology — constituting the critical path to investment decision for first-of-a-kind
    industrial demonstration plants.
