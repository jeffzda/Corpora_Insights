- record_id: ARENA-DLV-54908
  source_title: ARENA Insights Green Steel Webinar
  publish_date: 2024-05
  project_name: ZESTY H-DRI Demonstration Plant FEED Study
  what_happened: The ZESTY FEED study identified that the 30,000 tpa demonstration
    scale was selected specifically because it represents full-scale implementation
    of a single reactor tube — sufficient to produce H2-DRI/HBI for downstream steelmaking
    testing at full scale — while the commercial demonstrator is structured to charge
    a tolling fee to iron ore producers to test HBI trial products with their customers,
    providing a potential revenue recovery mechanism.
  lesson_learnt: For first-of-a-kind industrial demonstration plants, sizing the facility
    to match a single commercial-scale process unit (rather than a fraction of one)
    enables meaningful downstream product validation and creates a viable revenue
    model through tolling arrangements — this avoids the common failure mode of demonstrations
    too small to generate commercially relevant product data.
