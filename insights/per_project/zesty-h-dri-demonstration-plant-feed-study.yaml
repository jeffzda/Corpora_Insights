- record_id: ARENA-DLV-54909
  source_title: ARENA Insights Green Steel Webinar
  publish_date: 2024-05
  project_name: ZESTY H-DRI Demonstration Plant FEED Study
  what_happened: The FEED study identified that finalising site location — specifically
    securing access to required power utilities and hydrogen production infrastructure
    — remains an outstanding prerequisite before a Final Investment Decision can be
    reached, alongside establishing iron ore feedstock supply and HBI offtake agreements.
  lesson_learnt: For green iron demonstration projects, site selection must confirm
    co-location or contractual access to renewable power, hydrogen supply, feedstock,
    and offtake before FID — projects that complete FEED without resolving these commercial
    and infrastructure dependencies risk being unable to progress to construction
    despite technical readiness.
