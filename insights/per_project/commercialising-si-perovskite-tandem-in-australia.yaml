  publish_date: 2024-08
  project_name: Commercialising Si Perovskite Tandem in Australia Project
  what_happened: University infrastructure required for establishing process capability
    was not available on the project's planned timeline, creating a gap in research
    capacity during the waiting period.
  lesson_learnt: Build contingency plans for infrastructure unavailability into R&D
    project schedules — when university facilities are delayed, set up temporary alternative
    process capability at an interim location to maintain project momentum rather
    than halting work.
