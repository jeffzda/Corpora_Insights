- record_id: ARENA-DLV-6052
  source_title: Commercialising Si Perovskite Tandem in Australia - USYD - R&D Interim
    Report
  publish_date: 2024-08
  project_name: Commercialising Si Perovskite Tandem in Australia Project
  what_happened: Energetic misalignment between the perovskite and charge selective
    layers caused elevated voltage losses in wide bandgap perovskite solar cells (~1.67
    eV) intended for Si-perovskite tandems. The team developed a novel carbazole SAM
    hole-selective layer (Ph-2PACz) to overcome this, achieving a champion tandem
    PCE of 28.9% and passing IEC 61215 thermal cycling tests.
  lesson_learnt: Designing SAM hole-selective layers with extended conjugated systems
    (e.g., carbazole derivatives with additional benzene rings) can simultaneously
    improve voltage output, charge transfer, and thermal/moisture stability in wide-bandgap
    perovskite cells — a large material design space remains for further optimisation
    across different bandgaps in multi-junction configurations.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: Designed a new Ph-2PACz carbazole SAM-HSL with two additional
    benzene rings, improving PCE to 21.3% for single junction and 28.9% for tandem,
    with the encapsulated device retaining 98.8% initial PCE after 200 IEC 61215 thermal
    cycles.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id002
  - 8
  evidence_excerpt: We have learnt that we can design a new carbazole SAM-HSL based
    on (2-(3,6-diphenyl-9H-carbazol-9-yl) ethyl) phosphonic acid (Ph-2PACz) by introducing
    two benzene rings to create an extended conjugated system... The champion device
    produced a PCE of 28.9% with a VOC of 1.91V which is one of the highest values
    amongst demonstrated Si-perovskite tandems.
  confidence_note: null
