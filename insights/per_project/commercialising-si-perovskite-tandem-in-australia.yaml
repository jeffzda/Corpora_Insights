- record_id: ARENA-DLV-6054
  source_title: Commercialising Si Perovskite Tandem in Australia - USYD - R&D Interim
    Report
  publish_date: 2024-08
  project_name: Commercialising Si Perovskite Tandem in Australia Project
  what_happened: Investigation of combined light and heat stress on perovskite cells
    revealed that the two stresses can be synergistic or antagonistic depending on
    material choices (TiO2 vs SnO2 electron transport layers), with competing degradation
    reactions capable of producing antagonistic behaviour that partially offsets overall
    degradation.
  lesson_learnt: When engineering perovskite cell durability, deliberately selecting
    materials and cell designs that encourage antagonistic interactions between light
    and heat degradation mechanisms can be used as a stability-improvement strategy
    — not solely eliminating each stress independently. This approach should be applied
    to both n-i-p and p-i-n perovskite cell architectures.
  issue_severity: minor
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id004
  - 10
  evidence_excerpt: New learnings include the uncovering of competing degradation
    reactions that result in antagonistic stresses between light and heat when combined...
    deliberate engineering via material choices and cell designs for establishing
    reactions that encourage antagonistic behaviour between light and heat degradation
    mechanisms may be utilised to improve the stability of perovskite cells.
  confidence_note: issue_severity set to minor as this is a knowledge-generation finding
    rather than a project delivery failure; outcome_class set to knowledge generated
    despite setback to reflect the positive learning from an observed degradation
    phenomenon.
