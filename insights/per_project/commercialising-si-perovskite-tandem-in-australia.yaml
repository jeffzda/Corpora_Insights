- record_id: ARENA-DLV-6053
  source_title: Commercialising Si Perovskite Tandem in Australia - USYD - R&D Interim
    Report
  publish_date: 2024-08
  project_name: Commercialising Si Perovskite Tandem in Australia Project
  what_happened: The widely used lithium fluoride (LiF) interlayer in C60-based electron
    selective stacks for p-i-n perovskite cells causes instability. The team investigated
    alternative interlayers using piperidinium bromide (PpBr) and morpholinium bromide
    (MLBr), finding that MLBr's higher dipole moment improved electron extraction
    and defect passivation while both alternatives delivered significantly improved
    thermal cycling durability.
  lesson_learnt: Replacing the C60/LiF interlayer stack with dipole-moment-based alternatives
    (particularly MLBr, which is also cost-effective and accessible) improves both
    efficiency and durability of perovskite and Si-perovskite tandem cells, and the
    approach is transferable to other perovskite multi-junction configurations beyond
    silicon bottom cells.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: Replaced C60/LiF/perovskite stack with C60/MLBr/perovskite and
    C60/PpBr/perovskite alternatives; encapsulated cells retained over 97% initial
    efficiency after 400 thermal cycles — twice the IEC 61215 requirement.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id003
  - 9
  evidence_excerpt: When encapsulated, both types of cells retain over 97% of their
    initial efficiency after 400 thermal cycles (between −40 and 85 °C), twice the
    number of cycles specified by the International Electrotechnical Commission (IEC)
    61215 photovoltaic module standard.
  confidence_note: null
