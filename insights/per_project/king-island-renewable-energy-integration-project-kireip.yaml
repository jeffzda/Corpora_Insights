- record_id: ARENA-DLV-15816
  source_title: Evaluation of ARENA's Impact and Effectiveness
  publish_date: 2019-11
  project_name: King Island Renewable Energy Integration Project (KIREIP)
  what_happened: The King Island Renewable Energy Integration Project, funded by ARENA,
    demonstrated one of the world's first projects combining multiple renewable energy
    technologies, demand management and storage systems in an off-grid location. The
    project reduced the island's reliance on diesel by 65 per cent. Without ARENA
    funding, the project would likely not have succeeded.
  lesson_learnt: Off-grid island grids with high diesel costs present the clearest
    value proposition for battery-renewable hybridisation; integrating advanced control
    systems, dynamic resistors and flywheel UPS alongside battery storage enables
    reliable high-penetration renewable operation that would not be feasible with
    batteries alone.
