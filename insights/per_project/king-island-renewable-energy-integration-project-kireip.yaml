- record_id: ARENA-DLV-23912
  source_title: Australia's Off-Grid Clean Energy Market Research Paper
  publish_date: '2014-10-08'
  project_name: King Island Renewable Energy Integration Project (KIREIP)
  what_happened: A vanadium redox battery installed at King Island in 2003 as part
    of the early renewable integration project was decommissioned after encountering
    technical issues, underscoring the risks of immature energy storage technologies
    in islanded remote systems.
  lesson_learnt: Battery technologies selected for remote off-grid integration must
    have demonstrated longevity — early adoption of immature storage technologies
    (as with the King Island vanadium redox battery) creates operational risk in islanded
    systems with no backup supply and can result in premature decommissioning.
