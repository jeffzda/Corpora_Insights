    control over operational outcomes and design flexibility, while construct-only
    contracts were too time-consuming due to the need for full detailed design upfront;
    for a complex brownfields hydropower project with staged investment decisions,
    'design and construct' was identified as the preferred model.
  lesson_learnt: For large, complex brownfields hydropower redevelopment with staged
    investment and evolving scope, prefer design-and-construct contracting over EPC
    (insufficient owner control) or construct-only (requires premature design freeze);
    consider splitting into multiple contracts reflecting the variety of work types
    (civil, tunnels, electromechanical).
