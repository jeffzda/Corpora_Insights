- record_id: ARENA-DLV-58724
  source_title: Repurposing Tarraleah Hydropower Scheme for The Future Electricity
    Market
  publish_date: 2018-01
  project_name: Tarraleah Hydropower Scheme Redevelopment (Battery of the Nation)
  what_happened: Hydro Tasmania provided synchronous condenser services (operating
    selected hydro generators in dewatered mode to supply inertia and fault level)
    voluntarily without compensation, masking significant dispatch constraints that
    would otherwise have curtailed wind generation and reduced interconnector flow
    — at an estimated cost to Hydro Tasmania of several million dollars per year with
    no market recovery mechanism.
  lesson_learnt: System support services such as synchronous inertia and fault level
    provision from hydro plant operating as condensers have material market value
    but are uncompensated under current NEM mechanisms — project developers and system
    operators should document and quantify these services explicitly to support market
    reform and avoid having them provided indefinitely at the asset owner's cost.
