  publish_date: 2018-01
  project_name: Tarraleah Hydropower Scheme Redevelopment (Battery of the Nation)
  what_happened: 'Despite evolving asset management plans and difficult-to-quantify
    civil asset risk, Hydro Tasmania found that timing of refurbishment decisions
    interacts with the redevelopment investment case: delayed refurbishment favours
    business-as-usual (reduces urgency of capital outlay), while major upfront refurbishment
    spending weakens the case for redevelopment by consuming capital without improving
    operational flexibility.'
  lesson_learnt: Align asset management (refurbishment) planning with redevelopment
    investment planning — uncoordinated refurbishment expenditure can inadvertently
    lock in the status quo and foreclose more valuable redevelopment options; stage
    any refurbishment to preserve optionality until the redevelopment decision is
    made.
