- record_id: ARENA-DLV-58734
  source_title: Repurposing Tarraleah Hydropower Scheme for The Future Electricity
    Market
  publish_date: 2018-01
  project_name: Tarraleah Hydropower Scheme Redevelopment (Battery of the Nation)
  what_happened: Redevelopment of the Tarraleah scheme with a new power tunnel and
    Francis turbines is projected to increase annual generation from 634 GWh to 808
    GWh (27% increase) through reduced hydraulic losses, increased net head, higher
    conveyance capacity reducing spill, and improved turbine efficiency — demonstrating
    that repurposing rather than maintaining aging infrastructure can materially improve
    energy capture.
  lesson_learnt: Hydraulic efficiency improvements from modernised water conveyance
    and turbine replacement in aging hydropower schemes can deliver substantial energy
    output gains (order of 25–30%) even without increasing installed capacity — energy
    capture uplift should be modelled explicitly as a benefit of redevelopment against
    the baseline of progressive refurbishment.
