  what_happened: Fast FCAS requirements in Tasmania became non-linear and increased
    dramatically under low inertia conditions — particularly when Basslink was at
    its import/export limits — because the Tasmanian Frequency Operating Standard
    (TFOS) requires FCAS to manage ROCOF within the time that frequency would reach
    permissible limits under high-ROCOF conditions.
  lesson_learnt: System planners introducing asynchronous generation or HVDC interconnectors
    into systems with limited synchronous generation must explicitly model the non-linear
    relationship between system inertia and fast FCAS requirements — under low inertia
    conditions, fast FCAS requirements can increase faster than linear, making standard
    FCAS procurement formulas inadequate.
