- record_id: ARENA-DLV-58735
  source_title: Repurposing Tarraleah Hydropower Scheme for The Future Electricity
    Market
  publish_date: 2018-01
  project_name: Tarraleah Hydropower Scheme Redevelopment (Battery of the Nation)
  what_happened: The pre-feasibility cost model was built on unit rates developed
    without market testing from contractors — rates were instead derived from internal
    Hydro Tasmania experience, Entura specialist estimates, and Engineering Estimating
    Services (EES) bottom-up estimates with 20% contingency on most civil items. Contractors
    were explicitly not approached for market rates.
  lesson_learnt: Pre-feasibility cost models for large hydropower projects that are
    not market-tested with contractors carry significant cost uncertainty, particularly
    for civil and tunnel works — the cost estimate should be clearly labelled with
    its basis, and the feasibility study should include contractor engagement (particularly
    for civil works) to validate rates before investment decisions are made.
  issue_severity: moderate
  project_type: generation
  project_scale_band: utility/large-scale
  lifecycle_phase: concept/feasibility
  proponent_type: utility/energy retailer
  delay_category: null
