- record_id: ARENA-DLV-58733
  source_title: Repurposing Tarraleah Hydropower Scheme for The Future Electricity
    Market
  publish_date: 2018-01
  project_name: Tarraleah Hydropower Scheme Redevelopment (Battery of the Nation)
  what_happened: The pre-feasibility study recommended that operators of large hydroelectric
    schemes review their current business-as-usual asset management plans to ensure
    they do not compromise the ability of these assets to provide flexible firming
    services in the future NEM — concluding that operators who default to maintenance-mode
    asset strategies risk missing the strategic window for repurposing.
  lesson_learnt: Operators of large hydropower schemes should conduct a formal future-market
    assessment of their asset management strategy before committing to major refurbishment
    cycles — capital spent on refurbishment that locks in inflexible baseload operation
    may foreclose the option to repurpose assets for high-value dispatchable capacity
    and ancillary services in a high-renewables market.
