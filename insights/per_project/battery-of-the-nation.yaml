  project_name: Gordon Power Station Environmental Flow Unit (GO4)
  what_happened: Installation of GO4 requires full station outages to interconnect
    the new machine with existing penstocks and tailbays; these outages must be carefully
    planned to avoid impacting NEM system security or market opportunities.
  lesson_learnt: For hydro retrofits requiring full station outages for hydraulic
    interconnection, develop detailed outage management plans in the feasibility phase
    — unplanned or poorly timed outages at a major dispatchable asset carry both system
    security and commercial revenue risks that need to be quantified and scheduled
    around.
