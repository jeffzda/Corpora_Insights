  publish_date: 2018-01
  project_name: Tarraleah Hydropower Scheme Redevelopment (Battery of the Nation)
  what_happened: The Basslink HVDC interconnector limited Tasmania's ability to export
    dispatchable capacity to the mainland NEM, constraining the investment case for
    new hydropower investments in Tasmania including the Tarraleah redevelopment —
    interconnector capacity was identified as the binding constraint on realising
    the 'Battery of the Nation' value proposition.
  lesson_learnt: The investment case for new or redeveloped hydropower capacity in
    Tasmania is materially dependent on interconnector capacity; proponents should
    assess interconnector augmentation scenarios (including a second Bass Strait interconnector)
    as a key sensitivity in financial models, and engage with interconnector planning
    processes in parallel with project feasibility.
