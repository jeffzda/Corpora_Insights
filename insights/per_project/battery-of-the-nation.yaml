  what_happened: The transmission connection from Tarraleah was on the aging 110 kV
    network with a marginal loss factor (MLF) of 0.9338; upgrading to 220 kV could
    increase the MLF to as high as 0.99, materially improving revenue without being
    part of the project's direct capital scope (costs passed to TasNetworks/network
    users).
  lesson_learnt: For hydropower redevelopment projects on older lower-voltage transmission
    networks, assess transmission upgrade options and their MLF impact early — the
    revenue uplift from an improved MLF can substantially improve project economics
    and the upgrade cost may fall to the network business rather than the project
    proponent.
