  what_happened: Under Commonwealth EPBCA assessment, the proposed GO4 operating regime
    (Regime B — parallel operation with existing units within existing flow bands)
    potentially triggers an 'intensification of use' or 'change in nature of activity'
    assessment because it marginally changes flow release patterns from the station,
    despite the project being located entirely within an existing operating facility.
  lesson_learnt: For hydro generation upgrades in environmentally sensitive river
    systems, engage early with the Commonwealth Department of the Environment and
    relevant state environmental authorities to determine EPBCA exposure — a project
    that appears entirely internal to an existing station can still trigger federal
    assessment if operating regime changes alter downstream flow patterns, even marginally.
