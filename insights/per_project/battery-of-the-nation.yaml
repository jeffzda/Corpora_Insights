  what_happened: Three OCGT peaking units at Bell Bay were successfully modified to
    operate in synchronous condenser mode, providing cost-effective fault level support
    for the George Town area — significantly cheaper than constructing dedicated synchronous
    condensers, though providing less inertia than equivalent hydro units due to the
    aero-derivative machine type.
  lesson_learnt: Where fault level or inertia support is needed in a specific network
    area, assess the feasibility of modifying existing nearby OCGT or gas peakers
    for synchronous condenser operation before committing to new standalone synchronous
    condenser assets — conversion of existing plant can be substantially cheaper where
    suitable machines are already in the right location.
