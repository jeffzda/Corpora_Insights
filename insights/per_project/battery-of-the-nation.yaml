  what_happened: The existing Tarraleah power station's six 15 MW Pelton turbines
    were assessed as providing little power system support (ancillary services), being
    unsuitable for variable downstream water levels, and requiring substantial refurbishment
    in the 2020s — limiting both operational flexibility and future revenue from ancillary
    services markets.
  lesson_learnt: When assessing the long-term asset management strategy for aging
    synchronous hydropower plant, explicitly value the ancillary services capability
    uplift from modern turbine designs (Francis turbines with black start, synchronous
    condenser, fast raise FCAS) — this can materially improve the financial case for
    replacement over refurbishment of legacy Pelton turbine configurations.
