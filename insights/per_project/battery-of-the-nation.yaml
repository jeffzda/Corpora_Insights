  project_name: Tarraleah Hydropower Scheme Redevelopment (Battery of the Nation)
  what_happened: The development approvals pathway for the Tarraleah redevelopment
    involved multiple overlapping regulatory frameworks — LUPA Act planning permit,
    EPBC Act referral, Mining Lease, dam works permit, and threatened species/Aboriginal
    heritage permits — with the major approvals (EPBC + LUPA) estimated to take 10–12
    months and total approvals (including contingency) requiring approximately 18
    months plus 3–9 months for ecological and heritage surveys.
  lesson_learnt: For hydropower projects in Tasmania (and likely other jurisdictions
    with overlapping Commonwealth and State environmental frameworks), allow a minimum
    of 18 months for development approvals in the project programme — and initiate
    ecological and cultural heritage surveys in parallel with feasibility design to
    avoid sequential delays.
