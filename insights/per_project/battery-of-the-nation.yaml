  what_happened: Pre-feasibility analysis found that existing market revenue mechanisms
    (based on short-run marginal cost energy pricing) were very unlikely to provide
    an economically justifiable case for major redevelopment of the Tarraleah hydropower
    scheme under current or near-term market conditions.
  lesson_learnt: When evaluating brownfields hydropower redevelopment, ensure financial
    analysis explicitly models future market states — including capacity market and
    ancillary services revenue — not just current energy-only pricing; failure to
    do so will systematically undervalue redevelopment relative to business-as-usual
    maintenance.
