- record_id: ARENA-DLV-58731
  source_title: Repurposing Tarraleah Hydropower Scheme for The Future Electricity
    Market
  publish_date: 2018-01
  project_name: Tarraleah Hydropower Scheme Redevelopment (Battery of the Nation)
  what_happened: Hydro Tasmania identified that operating hydro generators at low
    output to increase system inertia or fast FCAS capability — as an alternative
    to synchronous condenser mode — caused additional wear and tear from hydraulic
    cavitation, damaging turbines and increasing maintenance costs, making it an unsustainable
    long-term operating practice.
  lesson_learnt: Avoid using hydro generators at prolonged low-output operation as
    a routine inertia or FCAS management tool — hydraulic cavitation under these conditions
    causes mechanical damage that is not captured in standard asset management plans;
    instead, invest in synchronous condenser capability modifications for plant intended
    to provide this service.
  issue_severity: moderate
  project_type: generation
  project_scale_band: utility/large-scale
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Hydro Tasmania undertook synchronous condenser reinstatement
    upgrades on selected plant to provide inertia support without requiring low-output
    generation operation.
  transferability: moderate
  delay_magnitude: null
  technology_domain: grid/system stability
  source_pages: &id048
  - 34
  evidence_excerpt: Such an approach, although effective, may cause additional wear
    and tear to these units, as hydro machines are typically not designed to operate
    at low output for long periods. Hydraulic cavitation is a common issue which can
    cause elevated machine vibration levels as well as mechanical damage to the turbines
    themselves.
