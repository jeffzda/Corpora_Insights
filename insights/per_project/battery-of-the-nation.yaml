- record_id: ARENA-DLV-58717
  source_title: Repurposing Tarraleah Hydropower Scheme for The Future Electricity
    Market
  publish_date: 2018-01
  project_name: Tarraleah Hydropower Scheme Redevelopment (Battery of the Nation)
  what_happened: Hydro Tasmania identified that the current NEM market design — based
    on short-run marginal cost with no explicit capacity or inertia market — does
    not value the full system services provided by dispatchable hydropower, meaning
    that new investment signals were absent and the market would not promote the investments
    in long-life assets needed to support high-renewables penetration.
  lesson_learnt: Operators of dispatchable hydropower should engage with market reform
    processes (AEMC, AEMO) to advocate for capacity markets and new system service
    payments — without market reform, the investment case for long-life firming assets
    will remain structurally undervalued and investment will not occur at the pace
    needed.
  issue_severity: major
