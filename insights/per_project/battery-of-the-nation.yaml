    cycling, increasing O&M costs and reducing the start/stop responsiveness of the
    main Gordon units, introducing both operational and market opportunity risks.
  lesson_learnt: Design environmental flow units at hydro stations for parallel operational
    flexibility with the main generation units — restricting the small unit to isolated
    operation forces more frequent start-stop cycles, degrades main unit responsiveness
    for market dispatch, and increases life-cycle O&M costs.
