- record_id: ARENA-DLV-51101
  source_title: Hydropower Asset Improvement at Gordon Power Station – Feasibility
    Study Knowledge Sharing Report
  publish_date: 2018-01
  project_name: Gordon Power Station Environmental Flow Unit (GO4)
  what_happened: Large Francis turbines at Gordon Power Station must discharge mandatory
    environmental flows 30–50% of the time at very low loads (15–30 MW), operating
    at poor efficiency due to being far below their design flow range, causing accelerated
    turbine runner deterioration.
  lesson_learnt: Where existing large hydro units are required to operate regularly
    at very low loads to satisfy environmental flow obligations, install a purpose-sized
    smaller unit rather than continue degrading the main machines — efficiency gains
    of 45–127% and significantly prolonged asset life for the large units can result.
  issue_severity: moderate
  project_type: generation
  project_scale_band: utility/large-scale
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Feasibility study designed and costed a new 35 MW horizontal
    axis Francis turbine (GO4) sized specifically for environmental flow rates, projected
    to approximately double energy output for the same flow.
  transferability: moderate
  delay_magnitude: null
  technology_domain: pumped hydro
  source_pages:
  - 4
  - 6
  evidence_excerpt: This mode of operation historically occurs for around 30% of the
    time in summer-autumn and 50% of the time in winter-spring... This means of providing
    the environmental flow is inefficient due to the poor efficiency of large Francis
    type hydro turbines in this low load range. A new smaller generator, sized appropriately
    for these flows, would be much more efficient and produce approximately double
    the energy output for the same flow.
  confidence_note: technology_domain set to pumped hydro as closest available value;
    this is conventional hydropower, not pumped hydro — taxonomy lacks a dedicated
