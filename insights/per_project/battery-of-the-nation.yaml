  proponent_type: utility/energy retailer
  delay_category: financing/commercial close
  failure_mode: commercial & market
  outcome_class: policy/market influence only
  secondary_failure_mode: regulatory & approvals
  intervention_note: Hydro Tasmania engaged with AEMO on NSCAS procurement mechanisms
    and commenced future-state NEM modelling to quantify the value of new system services
    as an input to market reform discussions.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: pumped hydro
  source_pages: &id034
  - 7
