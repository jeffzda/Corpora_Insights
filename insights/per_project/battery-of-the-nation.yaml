  project_name: Gordon Power Station Environmental Flow Unit (GO4)
  what_happened: Intensive construction activity in the underground cavern was identified
    as likely to exceed the capacity of the existing ventilation system, with the
    additional constraint that petrol-powered engines are prohibited due to carbon
    monoxide emission risks in the confined underground space.
  lesson_learnt: For underground hydro station construction works, assess ventilation
    capacity against construction activity loads early in planning — budget for supplementary
    ventilation installation and specify diesel-only or electric construction plant
    to manage carbon monoxide risk in confined cavern environments.
