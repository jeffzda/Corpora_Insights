- record_id: ARENA-DLV-51103
  source_title: Hydropower Asset Improvement at Gordon Power Station – Feasibility
    Study Knowledge Sharing Report
  publish_date: 2018-01
  project_name: Gordon Power Station Environmental Flow Unit (GO4)
  what_happened: 'For retrofitting a new turbine into the existing underground Gordon
    Power Station, two electrical connection options were assessed: (1) connecting
    GO4 to an existing large unit at 18 kV, and (2) an independent unitised connection
    to the surface switchyard via a new 11 kV busbar run up an existing ~200 m shaft.'
  lesson_learnt: When adding a small generating unit to an existing underground power
    station, prefer an independent unitised connection to the switchyard over parasitic
    connection to an existing unit — the parasitic option introduced significant cost
    uncertainty and operational risk to the host machine's ancillary service capability,
    making it not preferred despite lower upfront cost.
  issue_severity: minor
  project_type: generation
  project_scale_band: utility/large-scale
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Option 2 (independent unitised connection) was selected as the
    preferred design, accepting higher capital cost in exchange for greater operational
    flexibility, redundancy, and lower operational risk.
  transferability: narrow
  delay_magnitude: null
  technology_domain: pumped hydro
  source_pages: &id001
  - 11
  - 12
  - 14
  evidence_excerpt: Option 1 was found to be technically challenging, with significant
    cost uncertainty and high operational risk due to its potential to impact the
    security and reliability of the larger main unit that would be part of the connection.
    Despite being the cheaper of the two options, it is not preferred. Option 2, which
    is more expensive, is more standardised, provides greater operational flexibility
    and redundancy and has considerably lower operational risks.
  confidence_note: null
  source_url: https://arena.gov.au/knowledge-bank/hydropower-asset-improvement-at-gordon-power-station/
