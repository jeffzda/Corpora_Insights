  what_happened: The Frequency Control System Protection Scheme (FCSPS) developed
    by TasNetworks was successfully deployed to manage the credible contingency of
    Basslink loss (up to 630 MW export or 478 MW import), using 4-second cycle load
    and generation inter-tripping to maintain frequency within TFOS limits — significantly
    increasing interconnector utilisation and enabling greater renewable generation
    dispatch.
