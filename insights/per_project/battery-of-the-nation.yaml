  publish_date: 2018-01
  project_name: Tarraleah Hydropower Scheme Redevelopment (Battery of the Nation)
  what_happened: Discounted cash flow analysis heavily discounts benefits beyond year
    20, making it structurally biased against major hydropower investments that have
    5-year lead times and 60–100 year operational lives, causing redevelopment to
    appear financially unattractive compared with business-as-usual refurbishment.
  lesson_learnt: Standard DCF/NPV methodology is not fit-for-purpose as the primary
    decision tool for long-life hydropower investments; project proponents should
    supplement DCF with options-value analysis and real-options staging frameworks
    that capture the value of flexibility and long-dated cash flows.
  issue_severity: moderate
  project_type: generation
  project_scale_band: utility/large-scale
  lifecycle_phase: concept/feasibility
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: commercial & market
  intervention_note: The study team introduced staged investment decision points and
    real-options framing into the financial model to capture the value of flexibility,
    partially mitigating the discounting bias.
  transferability: broad
  delay_magnitude: null
  technology_domain: pumped hydro
  source_pages: &id019
  - 12
  - 13
  evidence_excerpt: Discounted financial analysis theory is effective for comparing
    a range of new investments but raises a number of questions when comparing the
    operation and maintenance of an existing asset with major capital investment of
    a long life asset. Depending on the discount rate used, the analysis outputs can
    be dominated by the first ten years of costs and benefits.
