  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: The study recommended linking refurbishment expenditure to market
    triggers and integrating asset management planning with the staged redevelopment
    decision framework.
  transferability: moderate
  delay_magnitude: null
