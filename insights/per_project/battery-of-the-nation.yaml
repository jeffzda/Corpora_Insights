- record_id: ARENA-DLV-58732
  source_title: Repurposing Tarraleah Hydropower Scheme for The Future Electricity
    Market
  publish_date: 2018-01
  project_name: Tarraleah Hydropower Scheme Redevelopment (Battery of the Nation)
  what_happened: The NSCAS Quantity procurement methodology used by AEMO was assessed
    as backward-looking and incapable of recognising or incentivising investment to
    address future system support needs — Hydro Tasmania was providing services that
    had quantifiable market value but the procurement framework did not compensate
    for future-state requirements.
  lesson_learnt: Market ancillary service procurement frameworks (NSCAS in particular)
    need to be reformed to be forward-looking and capable of procuring services before
    the need becomes critical — backward-looking procurement mechanisms will consistently
    fail to incentivise investment in system support capability until after problems
    have become acute.
