  what_happened: Installation of GO4 in the underground cavern requires all equipment
    to be lifted over the three operating large machines using the station crane,
    with the existing units remaining in commercial operation throughout construction,
    creating material risk of impact damage to operating plant.
  lesson_learnt: When retrofitting equipment into an operating underground power station,
    plan for overhead lifts above live machines and mandate installation of protective
    catch netting over exposed machine components — failure to do so exposes operating
    assets worth hundreds of millions of dollars to construction-induced damage.
