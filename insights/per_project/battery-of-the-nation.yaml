  what_happened: Hydro Tasmania's King Island microgrid experience over 10 years generated
    transferable intellectual property in low-inertia power system management, including
    resistor-based frequency control, flywheel technology for inertia/voltage support,
    dynamic clutch synchronous condenser operation, and advanced battery storage control
    strategies — several of which were identified as directly applicable to larger
    grid-scale systems.
