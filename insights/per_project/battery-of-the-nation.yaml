  what_happened: Accurate mathematical models and quality design documentation from
    equipment suppliers (synchronous machines, wind turbines, STATCOMs) were identified
    as critical enablers for constraint formulation and network security management
    in Tasmania's high-renewables system — Tasmania was in a favourable position having
    validated models for the majority of connected equipment.
  lesson_learnt: Require validated dynamic models from all generating plant and associated
    equipment as a condition of connection approval — without accurate models for
    power-electronic interfaced plant (wind, HVDC, battery inverters), constraint
    equations and FCAS calculations will be inaccurate, creating hidden system security
    risks as renewable penetration increases.
