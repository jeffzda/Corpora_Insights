- record_id: ARENA-DLV-9120
  source_title: State of DER Technology Integration Report
  publish_date: 2021-02
  project_name: Closed-Loop Voltage Control Trial
  what_happened: SA Power Networks undertook a trial to determine whether closed-loop substation voltage control, already demonstrated successfully in Victoria using ubiquitous smart meter data, could be
    achieved in SA where smart meter penetration is sparse and variable in quality and cost. The trial combined multiple data sources including retailer smart meters, smart streetlights, grid-side monitors,
    customer inverters and third-party devices to produce a rolling forecast of customer voltages.
  lesson_learnt: Closed-loop voltage control does not require ubiquitous smart meter coverage — a data-science approach combining sparse and imperfect data from multiple sources can replicate the function,
    providing a pathway for DNSPs in non-Victorian jurisdictions to adopt advanced voltage management techniques without waiting for AMI rollouts.
