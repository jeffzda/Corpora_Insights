    the US, Brazil, and EU member states — developed those industries through consistent,
    long-term policy frameworks (e.g., the US Renewable Fuel Standard, California's
    Low Carbon Fuel Standard, EU biofuel directives). Australia's historically weak
    and inconsistent policy support has constrained industry development relative
    to these peers.
  lesson_learnt: Policy continuity and long-term mandates are the primary enabler
    of biofuel industry scale-up — demonstrated across multiple markets. Australian
    biofuel project developers should engage with policy development processes and
    structure projects to be commercially viable under multiple policy scenarios,
    given Australia's track record of policy inconsistency in this sector.
