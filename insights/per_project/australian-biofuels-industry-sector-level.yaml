  what_happened: The biofuels industry requires a longer gestation period for industry
    and infrastructure development compared with other carbon mitigation options.
    The investment required by Australian production facilities alone is estimated
    at $25–30 billion, and achieving a 40-fold production expansion in 30 years would
    require up to 250,000 jobs and sustained policy support.
  lesson_learnt: Biofuel project developers and funders should design programs with
    long development horizons and staged capital deployment — the industry's gestation
    period is longer than most renewable energy technologies, and short-term policy
    cycles are insufficient to anchor the required investment. ARENA and CEFC support
    should be structured to bridge the gap between demonstration and first-commercial
    scale.
