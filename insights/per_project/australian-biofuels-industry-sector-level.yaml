  project_name: Australian Biofuels Industry (sector-level)
  what_happened: Cost competitiveness with petroleum fuels is identified as the single
    biggest barrier to biofuel expansion in Australia and globally. Without carbon
    pricing or equivalent policy support, advanced biofuels remain more expensive
    than petroleum, limiting investor appetite and industry growth.
  lesson_learnt: Biofuel project developers and investors should plan for an extended
    period of policy-supported operation before reaching cost parity with petroleum
    — similar to the trajectory of wind and solar. Financial models for first-of-kind
    advanced biofuel facilities should not assume unaided cost competitiveness with
    fossil fuels at project commencement, and should explicitly account for policy
    risk.
