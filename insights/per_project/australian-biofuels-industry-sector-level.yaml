  source_title: 'Biofuels and Transport: An Australian Opportunity'
  publish_date: null
  project_name: Australian Biofuels Industry (sector-level)
  what_happened: Australia's biofuel production capacity declined over the past 10–15
    years due to plant closures, and existing plants are operating below full capacity.
    Australia can currently only produce enough biofuel to satisfy 0.6 per cent of
    national transport fuel demand, well below the global average of 2.7 per cent.
  lesson_learnt: Without a stable, long-term policy and regulatory framework, domestic
    biofuel investment is unable to sustain commercial scale — policy uncertainty
    has demonstrably caused industry contraction in Australia. Project developers
    and investors should treat policy continuity as a prerequisite for long-term capital
    commitment in this sector.
