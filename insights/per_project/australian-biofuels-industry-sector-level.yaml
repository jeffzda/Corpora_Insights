- record_id: ARENA-DLV-16401
  source_title: 'Biofuels and Transport: An Australian Opportunity'
  publish_date: null
  project_name: Australian Biofuels Industry (sector-level)
  what_happened: A number of biodiesel plants built in Australia in the early 2000s
    are no longer operating. Their closure resulted from lower-cost imports monopolising
    the Cleaner Fuels Grant Scheme, increasing feedstock prices, and inconsistent
    product quality. Existing plants are operating below full capacity.
  lesson_learnt: Early-stage biofuel plants must design for feedstock cost resilience
    and consistent product quality from inception — policy support schemes alone are
    insufficient if import competition can access the same incentives and domestic
    production costs are uncompetitive. New entrants should ensure policy frameworks
    explicitly differentiate domestic production before committing capital.
