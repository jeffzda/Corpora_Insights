- record_id: ARENA-DLV-16403
  source_title: 'Biofuels and Transport: An Australian Opportunity'
  publish_date: null
  project_name: Australian Biofuels Industry (sector-level)
  what_happened: Australian feedstocks — including tallow converted to renewable diesel
    at the NexBTL refinery in Singapore and canola seed exported to Europe — are being
    processed overseas to meet international biofuel mandates rather than being converted
    domestically. Meanwhile Australia has no commercial advanced biofuel facilities
    operational or under construction.
  lesson_learnt: In the absence of domestic policy mandates comparable to the US Renewable
    Fuel Standard or EU biofuel directives, Australian feedstock value is captured
    overseas rather than domestically. Project developers seeking to establish advanced
    biofuel facilities in Australia should explicitly assess whether policy conditions
    support domestic processing before committing to site development.
