- record_id: ARENA-DLV-53878
  source_title: Demand Flexibility Portfolio Retrospective Analysis Report
  publish_date: 2023-07
  project_name: Jemena Dynamic EV Charging Trial
  what_happened: A Victorian Government Tariff Order released mid-trial mandated that
    any household installing a dedicated EV charger (≥3.6kW) must move to a Time-of-Use
    (ToU) network tariff. Of 16 Jemena participants on single-rate tariffs, 10 switched
    to ToU, 5 had their charger rate-limited to 3kW to remain on single-rate, and
    1 opted out of the trial entirely.
  lesson_learnt: Mid-trial regulatory changes to tariff structures applicable to EV
    chargers can cause participant attrition and disrupt trial design; EV project
    teams should monitor regulatory pipelines for tariff order changes and include
    in consent processes the possibility that new charger installations may trigger
    mandatory tariff changes.
