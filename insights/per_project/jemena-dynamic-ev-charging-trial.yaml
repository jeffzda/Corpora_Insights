  evidence_excerpt: Of the 23 Jemena participants, 16 of them (70 per cent) were found
    to be on a Single-Rate network tariff. Therefore, the participants had to be informed
    immediately that if they installed the charger with a rate of charge exceeding
    3.6kW, they would need move to a ToU network tariff. 10 out of the 16 (63 per
    cent) participants chose to be moved to the ToU network tariff, 5 (30 per cent)
    were happy to have the maximum rate of the charger reduced to 3kW… and 1 participant
    (6 per cent) opted out of the trial.
