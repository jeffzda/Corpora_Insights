- record_id: ARENA-DLV-32151
  source_title: Industry Ready N-Type Silicon Solar Cells Findings
  publish_date: '2014-07-15'
  project_name: 2-A008 Industry-ready n-type silicon solar cells
  what_happened: Transferring cell fabrication techniques developed in ANU laboratories
    to Trina Solar's industrial production environment proved significantly more difficult
    than anticipated, because the methods and equipment at the two organisations were
    in some cases quite different.
  lesson_learnt: When designing a university–industry R&D collaboration aimed at technology
    transfer, ensure the research organisation has access to industrially compatible
    equipment from the outset — mismatches between lab-scale and production-scale
    tooling create substantial transfer friction and may limit how much of the developed
    technology can be adopted by the industry partner.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: partial success
  secondary_failure_mode: poor scoping
  intervention_note: The report recommends that future projects of this nature ensure
    more industrially compatible equipment is available at ANU; no immediate resolution
    within the project is described.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id001
  - 2
  - 3
  evidence_excerpt: There were, however, some significant challenges in transferring
    the techniques developed in the laboratories at ANU to the industrial setting
    in Trina Solar, due to the fact that the methods and equipment at the two organisations
    are in some cases quite different. Future projects of this nature would benefit
    from the availability of more industrially compatible equipment at ANU.
  confidence_note: issue_severity set to moderate — no schedule or cost data provided,
    but the transfer friction is explicitly flagged as a significant challenge that
    constrained outcomes.
