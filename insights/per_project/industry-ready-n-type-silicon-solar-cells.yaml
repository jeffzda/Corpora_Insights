- record_id: ARENA-DLV-32154
  source_title: Industry Ready N-Type Silicon Solar Cells Findings
  publish_date: '2014-07-15'
  project_name: 2-A008 Industry-ready n-type silicon solar cells
  what_happened: The amorphous silicon sputtering technique for hybrid amorphous/crystalline
    silicon solar cells showed promise as a low-cost method but did not reach a stage
    where it could be considered industry-ready within the project period, with further
    development flagged as necessary.
  lesson_learnt: When scoping multi-stream R&D projects, account for the risk that
    some technology streams will reach only a preliminary proof-of-concept stage within
    the project timeline; build in explicit go/no-go decision points and downstream
    development pathways so promising-but-incomplete streams are not abandoned at
    project close.
