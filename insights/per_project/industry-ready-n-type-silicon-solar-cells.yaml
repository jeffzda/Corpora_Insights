- record_id: ARENA-DLV-32152
  source_title: Industry Ready N-Type Silicon Solar Cells Findings
  publish_date: '2014-07-15'
  project_name: 2-A008 Industry-ready n-type silicon solar cells
  what_happened: Liquid-jet guided laser doping was technically demonstrated at 20.0%
    cell efficiency but was assessed as unlikely to be adopted by industry due to
    the complexity and reliability challenges inherent in the technique.
  lesson_learnt: Technical feasibility alone is insufficient for industrial adoption
    — when evaluating novel processing methods for solar cell manufacture, assess
    manufacturing complexity and equipment reliability requirements early, as a technique
    that works in the lab may not be viable at production scale even if efficiency
    targets are met.
