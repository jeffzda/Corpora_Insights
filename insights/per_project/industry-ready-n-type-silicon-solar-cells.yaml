- record_id: ARENA-DLV-32155
  source_title: Industry Ready N-Type Silicon Solar Cells Findings
  publish_date: '2014-07-15'
  project_name: 2-A008 Industry-ready n-type silicon solar cells
  what_happened: The ANU–Trina Solar collaboration produced a simple, robust two-sided-contact
    n-type cell process achieving 20.5% efficiency on large-area cells at Trina Solar,
    with the technology now being refined on Trina's R&D lines for potential full-production
    implementation — establishing a foundation for ongoing collaboration.
  lesson_learnt: Structuring a university R&D project as a direct co-development with
    a major industry partner — rather than a technology-push followed by separate
    commercialisation — can generate production-compatible results and a pathway to
    adoption within a single project; proponents should identify and formalise industry
    co-development partnerships before project commencement.
  issue_severity: none
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: follow-on scale-up enabled
  secondary_failure_mode: null
  intervention_note: null
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id005
  - 3
  evidence_excerpt: The project has succeeded in developing a new, simple and robust
    method for two-sided metal contact n-type solar cells in collaboration with Trina
    Solar, with efficiencies well above 20% on full-size cells produced at Trina Solar.
    This new n-type process is now being refined and tested on specialised R&D lines
    at Trina Solar, with the aim of implementing the technology in full production
    if it meets the required performance and yield targets.
