- record_id: ARENA-DLV-8753
  source_title: Pilot Landfill Solar Report Feasibility Study
  publish_date: '2019-12-19'
  project_name: Pilot Landfill Solar Project (Wollert)
  what_happened: 'Landfill settlement poses a material risk to solar installations:
    significant settlement occurs within 5–7 years of final capping, and any solar
    system installed on a recently capped landfill is at risk of structural damage
    as the waste beneath decompresses.'
  lesson_learnt: Do not install solar systems on newly capped landfills — wait until
    the initial settlement period (5–7 years post-capping) has passed, and where installation
    is unavoidable, use short-span mounting structures with built-in height adjustment
    to accommodate ongoing subsidence.
