- record_id: ARENA-DLV-8756
  source_title: Pilot Landfill Solar Report Feasibility Study
  publish_date: '2019-12-19'
  project_name: Pilot Landfill Solar Project (Wollert)
  what_happened: The single-module ballast mounting system (65.5 kW, 15° tilt) required
    all vegetation management to be done manually because row spacing was too narrow
    for ride-on mowers or vehicle-mounted spray equipment. This drove higher ongoing
    operations and maintenance labour costs compared to the other two mounting systems
    trialled.
  lesson_learnt: When selecting a mounting system for landfill solar, factor row spacing
    and panel height into operations and maintenance cost modelling — the single-module
    ballast system's close ground clearance and narrow row spacing made mechanised
    vegetation management impossible, materially increasing O&M costs relative to
    higher-clearance alternatives.
