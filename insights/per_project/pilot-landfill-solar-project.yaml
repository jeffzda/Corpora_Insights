- record_id: ARENA-DLV-8763
  source_title: Pilot Landfill Solar Report Feasibility Study
  publish_date: '2019-12-19'
  project_name: Pilot Landfill Solar Project (Wollert)
  what_happened: The project demonstrated that connecting a landfill solar system
    to the electricity grid is both time-consuming and costly at any system size,
    making grid-connected landfill solar financially unviable unless a substantial
    existing grid interconnection with sufficient capacity is already in place at
    the site.
  lesson_learnt: Prioritise landfill sites that already have a substantial grid interconnection
    when scoping landfill solar projects — for sites without one, the cost and timeline
    of obtaining a new connection makes grid-connected deployment financially unviable
    at the 1–5 MW scale typical of landfill installations; behind-the-meter configurations
    (as trialled at Wollert) offer a more viable near-term pathway.
