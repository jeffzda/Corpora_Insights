- record_id: ARENA-DLV-8754
  source_title: Pilot Landfill Solar Report Feasibility Study
  publish_date: '2019-12-19'
  project_name: Pilot Landfill Solar Project (Wollert)
  what_happened: During commissioning, birds were observed perching in large numbers
    on the solar array framework and panels, attracted by the organic waste environment
    of the landfill. Bird droppings reduced panel generation efficiency and created
    an ongoing cleaning burden not anticipated during project design.
  lesson_learnt: Commission a wildlife impact study during site selection for landfill
    solar projects — the organic waste environment inherently attracts significantly
    more birdlife (and other fauna) than virgin-ground sites, and the cost of bird
    deterrents and additional cleaning at commercial scale can materially affect financial
    viability.
