  what_happened: 'The micro-pile mounting system (5.76 kW, 35° tilt) achieved the
    best overall operational performance of the three systems trialled: lowest vegetation
    management costs due to small footing footprint allowing full vehicle access,
    best generation output, fewest bird-perching incidents, and easiest cable access
    without requiring lifting equipment.'
