- record_id: ARENA-DLV-8762
  source_title: Pilot Landfill Solar Report Feasibility Study
  publish_date: '2019-12-19'
  project_name: Pilot Landfill Solar Project (Wollert)
  what_happened: 'The project concluded that landfill solar installations are unlikely
    to be financially feasible under current conditions, driven by: higher equipment
    costs for specialised ballast and micro-pile mountings, more complex and time-consuming
    installation in a hazardous environment, inability to achieve economies of scale
    (typical landfill system size 1–5 MW vs 20–200 MW for competing solar), and costly
    grid interconnection where no existing connection exists.'
  lesson_learnt: Financial modelling for landfill solar must explicitly account for
    the cost premium of specialised mountings, hazardous-environment installation,
    small system size precluding economies of scale, and grid connection costs — without
    a pre-existing grid interconnection of sufficient capacity at the site, the financial
    case is unlikely to stack up under current equipment and installation pricing.
