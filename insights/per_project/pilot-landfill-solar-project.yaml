  source_title: Pilot Landfill Solar Report Feasibility Study
  publish_date: '2019-12-19'
  project_name: Pilot Landfill Solar Project (Wollert)
  what_happened: The single-module ballast mounting system achieved only a 15° tilt
    (versus the optimal 35° for the site), resulting in measurably increased dust
    build-up on panels and reduced generation output compared to the multi-module
    ballast and micro-pile systems that achieved 35° tilt.
  lesson_learnt: Where landfill conditions constrain the achievable tilt angle, quantify
    the generation penalty at design stage — the single-module ballast system's 15°
    tilt produced noticeably greater dust accumulation and lower output than the 35°-tilt
    alternatives, and this trade-off should be explicitly modelled in financial cases
    for large-scale deployments.
