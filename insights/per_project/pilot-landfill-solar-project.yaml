- record_id: ARENA-DLV-8752
  source_title: Pilot Landfill Solar Report Feasibility Study
  publish_date: '2019-12-19'
  project_name: Pilot Landfill Solar Project (Wollert)
  what_happened: The project found that penetrating the impermeable layer of a landfill
    cap requires EPA approval, and each penetration becomes a new gas-emissions testing
    point — meaning a 1–2 MW system using a penetrating mounting method would require
    hundreds of testing points, adding significant regulatory burden and cost.
  lesson_learnt: Select mounting systems that avoid penetrating the landfill cap wherever
    possible, and identify this constraint early in design — the additional approval,
    testing, and remediation costs (e.g. bentonite clay sealing) for penetrating systems
    can substantially exceed initial estimates and are frequently overlooked by developers
    without landfill experience.
  issue_severity: moderate
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: project developer
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: Bentonite clay was applied to seal micro pile penetrations at
    the Wollert project; cables were routed above ground or at shallow depth to further
    protect cap integrity.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id001
  - 18
  - 19
  evidence_excerpt: If you are looking to penetrate the cap, this requires approval
    from the EPA and each penetration becomes a new testing point for gas emissions.
    Hence a 1 or 2MW solar system which uses a mounting system that penetrates the
    cap would require hundreds of testing points for gas emissions.
