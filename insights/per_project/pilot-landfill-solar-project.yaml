- record_id: ARENA-DLV-26351
  source_title: 'Lessons Learnt Report: Solar Landfill Project – Wollert Landfill,
    Victoria'
  publish_date: null
  project_name: Pilot Landfill Solar Project (G00839)
  what_happened: During installation of a 100kW solar PV system on a landfill, electrical
    contractors failed to account for the explosive risk of landfill gas. Standard
    electrical equipment was found to be unsuitable because trenches and conduits
    created gas pathways that could cause dangerous gas build-up in inverters and
    other electrical equipment. A redesign was required mid-construction to install
    gas ventilation cages on all affected electrical equipment.
  lesson_learnt: Solar installations on landfills must be designed from the outset
    to address explosive landfill gas risks — standard solar equipment and contractors
    experienced only with virgin-land installations lack the knowledge to ensure intrinsic
    safety. Only engage contractors with demonstrated experience working on landfills
    and in explosive environments, and explicitly incorporate gas pathway management
    into the electrical design before construction begins.
  issue_severity: major
  project_type: generation
  project_scale_band: pilot
  lifecycle_phase: construction/installation
  proponent_type: project developer
  delay_category: construction/installation
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: A site meeting was convened with the proponent's own electrical
    engineers and gas extraction experts who identified the risk and resolved it by
    installing gas ventilation cages on all electrical equipment with trenches and
    conduits running into them.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
