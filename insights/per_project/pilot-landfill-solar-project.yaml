- record_id: ARENA-DLV-8755
  source_title: Pilot Landfill Solar Report Feasibility Study
  publish_date: '2019-12-19'
  project_name: Pilot Landfill Solar Project (Wollert)
  what_happened: The Wollert landfill contained over 200 gas wells with extensive
    flow lines and gas mains. Without early engagement of the landfill gas contractor,
    solar system designers risk routing arrays over existing or planned gas infrastructure,
    creating safety and environmental risks and potentially requiring the system to
    be moved or dismantled.
  lesson_learnt: Engage the landfill gas contractor from the outset of design and
    maintain that engagement through installation and operations — mapping all existing
    and planned gas wells, flow lines, and mains is essential to avoid layouts that
    conflict with gas infrastructure, since correcting such conflicts post-installation
    may require dismantling the array.
