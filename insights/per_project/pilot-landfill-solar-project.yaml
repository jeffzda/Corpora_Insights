- record_id: ARENA-DLV-8764
  source_title: Pilot Landfill Solar Report Feasibility Study
  publish_date: '2019-12-19'
  project_name: Pilot Landfill Solar Project (Wollert)
  what_happened: Australia had no prior landfill solar installations before this project.
    The feasibility study identified a systematic knowledge gap between virgin-ground
    solar developers and the specialist requirements of landfill installations, spanning
    hazardous-gas safety, cap integrity, settlement tolerance, landfill gas infrastructure
    coordination, and enhanced O&M — meaning standard solar EPC contractors lack the
    competencies required.
  lesson_learnt: Landfill solar projects should not be delivered by virgin-ground
    solar EPC contractors alone — the discipline requires a multi-competency team
    combining solar design, landfill gas engineering, and hazardous-area electrical
    expertise; ARENA and developers should treat this knowledge gap as a capability-building
    priority before scaling up landfill solar in Australia.
  issue_severity: major
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: project developer
