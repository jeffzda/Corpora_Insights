- record_id: ARENA-DLV-34003
  source_title: RayGen Solar Power Plant One Lessons Learnt
  publish_date: null
  project_name: RayGen's Solar Power Plant – Phase One
  what_happened: Despite configuring the plant to qualify for the sub-5 MVA 'fast-tracked'
    grid connection process, RayGen was required to complete extensive PSSE and PSCAD
    modelling comparable in scope to projects 20 times larger (e.g. a 100 MW solar
    farm), and found there was very limited advantage in time or cost from targeting
    the smaller-scale process.
  lesson_learnt: New technology developers seeking Australian grid connection should
    anticipate that LNSPs may apply full AEMO-scope technical modelling requirements
    at their discretion regardless of project scale — budget and schedule accordingly,
    and engage early with the LNSP to understand the true scope of requirements before
    committing to a system configuration.
