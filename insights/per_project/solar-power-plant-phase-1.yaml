  project_name: RayGen Solar Power Plant One (SPP1)
  what_happened: RayGen achieved financial close on the 50MWh SPP1 project in Q1 2021,
    having secured an executed offtake agreement with AGL for electricity and grid
    services. The project structure prioritised long-term value creation objectives
    — demonstrating integrated performance, securing pipeline, and optimising technology
    — ahead of immediate economic returns in the SPP1 project itself.
  lesson_learnt: For FOAK integrated energy technology projects, explicitly separating
    the commercial objectives of the demonstration project (technology validation,
    pipeline development, cost-reduction learning) from the requirement for standalone
    project economics can reduce design constraints and improve the quality of evidence
    generated — provided an anchor offtake partner is secured to underpin project
    finance.
