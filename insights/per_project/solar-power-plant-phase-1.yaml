  source_title: RayGen Commercial Assessment Report
  publish_date: 2021-05
  project_name: RayGen PV Ultra Commercialisation Program (Stages 2–4)
  what_happened: Across four sequential ARENA-funded grant programs from 2012 to 2019,
    RayGen progressively scaled its PV Ultra module manufacturing from zero to 25MW
    p.a. and increased receiver power density by 50% (from 160 kW/m² to 244 kW/m²).
    Total ARENA grant funding of $13.4M across the first four projects was leveraged
    at better than 2:1 with private investment to deliver $27.1M of project activity.
  lesson_learnt: Staged grant programs that sequence technology maturation — pilot,
    then manufacturing scale-up, then commercialisation — can achieve high leverage
    ratios and enable an OEM to reach a credible commercial position; each stage should
    generate operational data that directly de-risks the next stage for private investors.
