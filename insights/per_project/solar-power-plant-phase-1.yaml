  what_happened: RayGen's AUD 30 million capital raise requirement for SPP1 fell outside
    the typical deal size for both traditional project finance/private equity (too
    small) and venture capital (wrong sector — VCs focus on software and biotech),
    requiring RayGen to go directly to limited partners of VCs, corporate strategic
    investors, and family offices. This route produced slower decision-making than
    VC processes.
  lesson_learnt: Early-stage hardware energy technology companies with capital requirements
    in the AUD 20–50 million range should target corporate strategic investors and
    family offices directly rather than conventional project finance or VC channels
    — these investors are slower to decide but provide greater strategic value and
    are more suited to this deal profile.
