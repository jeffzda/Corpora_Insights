- record_id: ARENA-DLV-18805
  source_title: RayGen Commercial Assessment Report
  publish_date: 2021-05
  project_name: RayGen Solar Power Plant One (SPP1) / Solar Power Plant Two (SPP2)
  what_happened: 'RayGen deliberately designed its scale-up pathway using a ''scale-out''
    rather than ''scale-up'' strategy: individual solar components (heliostats, modules,
    receivers, towers) do not change in unit size between SPP1 (4MW solar) and SPP2
    (200MW solar); larger projects simply deploy more identical units. This approach
    was intended to de-risk the transition between project scales and drive supply
    chain unit cost reductions.'
  lesson_learnt: Technology developers designing FOAK-to-commercial scale-up pathways
    should consider 'scale-out' architectures (replicating identical modular units)
    over 'scale-up' architectures (increasing individual component sizes) — the former
    preserves FOAK validation data at the unit level, de-risks supply chain transition,
    and avoids re-engineering at each scale step.
