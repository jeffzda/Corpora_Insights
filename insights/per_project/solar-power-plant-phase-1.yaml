- record_id: ARENA-DLV-18807
  source_title: RayGen Commercial Assessment Report
  publish_date: 2021-05
  project_name: RayGen Solar Power Plant One (SPP1)
  what_happened: 'RayGen identified that the round-trip efficiency of its electro-thermal
    energy storage is critically dependent on by-product heat from PV Ultra solar
    co-generation: with free heat, round-trip efficiency exceeds 70%; without it,
    a heat pump is required and efficiency falls below 25%. This dependency was identified
    as a key design constraint affecting where and how the technology can be deployed.'
  lesson_learnt: Project developers evaluating electro-thermal energy storage should
    confirm that a co-located, cost-free heat source of sufficient scale is available
    before committing to project design — the technology's efficiency and economics
    are fundamentally contingent on free heat input, and retrofitting a heat pump
    to substitute for missing heat results in a round-trip efficiency that makes most
    storage dispatch scenarios uneconomic.
  issue_severity: minor
  project_type: manufacturing/supply chain
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: RayGen resolved this by designing SPP1 as an integrated solar-plus-storage
    system where PV Ultra heat co-generation is the primary heat source, with a small
    heat pump included only for supplementary capacity and arbitrage opportunities.
  transferability: narrow
  delay_magnitude: null
  technology_domain: hybrid systems
  source_pages: &id007
  - 11
  evidence_excerpt: With free heat, the round-trip electrical efficiency of RayGen's
    storage is over 70%; without free heat, a heat pump is required and the round-trip
    electrical efficiency is less than 25%. A low round-trip efficiency causes storage
    to be prohibitively expensive on most occasions, even if the electricity is provided
    by low cost solar.
  confidence_note: 'Classified as ''design assumption failure'' at minor severity
    because this is a fundamental design constraint that was identified and resolved
    in the design phase rather than discovered post-construction; it is a lesson for
    future project developers rather than a failure in SPP1 itself.; project_type
    reconciled to ''manufacturing/supply chain'' from: manufacturing/supply chain
    (4/10), storage (4/10), multi-technology/hybrid (2/10)'
