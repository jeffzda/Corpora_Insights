  source_title: RayGen Solar Power Plant One Lessons Learnt
  publish_date: null
  project_name: RayGen's Solar Power Plant – Phase One
  what_happened: RayGen configured its system to remain below 5 MVA nameplate capacity
    to qualify for a standing exemption from generator registration and a 'fast-tracked'
    grid connection process, but discovered the exemption threshold applied to the
    sum of all generation equipment nameplate capacity — not the maximum permissible
    export — requiring the system to be downsized more than anticipated.
  lesson_learnt: Verify the exact basis on which regulatory exemption thresholds are
    calculated before designing a system around them — the sub-5 MVA standing exemption
    applies to nameplate capacity of all power generation equipment, not the grid
    connection export limit, and system redesign may be required if this is misunderstood.
