  source_title: RayGen Commercial Assessment Report
  publish_date: 2021-05
  project_name: RayGen Solar Power Plant One (SPP1)
  what_happened: RayGen chose to in-source PV Ultra module manufacturing rather than
    outsource to third-party manufacturers, specifically to protect core intellectual
    property and maintain quality assurance over the highest-value, highest-complexity
    component of its system. Balance-of-system components were sourced through an
    outsourced supply chain.
  lesson_learnt: Technology developers with proprietary high-complexity components
    should evaluate in-sourcing manufacturing not only on cost grounds but on IP protection
    and quality assurance grounds — outsourcing core components that are central to
    competitive differentiation creates replication risk and potential quality variance
    that can undermine the commercial value of a FOAK demonstration.
