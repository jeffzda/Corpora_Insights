  source_title: RayGen Solar Power Plant One Lessons Learnt
  publish_date: null
  project_name: RayGen's Solar Power Plant – Phase One
  what_happened: RayGen designed its cold thermal storage system using sensible heat
    of water (between two temperatures) rather than latent heat of freezing ice, after
    investigating both approaches with engineering partners NIRAS and GHD. Ice-based
    storage was found to require more electricity per unit of cold storage and had
    never been deployed at the required order of magnitude.
  lesson_learnt: For large-scale cold thermal storage at an unprecedented scale, use
    sensible heat (water-based) storage rather than ice-based latent heat storage
    — ice storage is unproven at this magnitude, more electrically inefficient, and
    presents higher risk despite offering higher volumetric cold energy density.
