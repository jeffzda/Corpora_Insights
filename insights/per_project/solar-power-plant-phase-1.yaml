  what_happened: RayGen engaged Australian utilities from April 2019 at an early stage
    of storage technology development, offering to pay utilities for participation
    in an agile design process, and ultimately partnered with a leading utility. This
    co-development relationship led to multiple design iterations, reduced technology
    and market risk, and ultimately produced an offtake agreement for SPP1 and feasibility
    studies for larger projects.
