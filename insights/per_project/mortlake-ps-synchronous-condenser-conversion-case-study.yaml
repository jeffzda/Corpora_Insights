  - 34
  evidence_excerpt: The clutch will need to be encased and require a footprint of
    approximately 3-5m (with respect to the length of shaft). This will mean the drive
    train, and subsequent foundations (i.e., plinth), will need to be extended to
    accommodate for the footprint of the clutch. The retrofit will require both mechanical
    and civil works to be performed on site during a major outage.
