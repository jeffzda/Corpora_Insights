- record_id: ARENA-DLV-50962
  source_title: Repurposing Existing Generators as Synchronous Condensers
  publish_date: 2023-06
  project_name: Mortlake PS Synchronous Condenser Conversion (Case Study)
  what_happened: Origin's Mortlake open-cycle gas turbine power station (two 333 MVA
    Siemens SGT 4000F units) was assessed as technically feasible for synchronous
    condenser conversion via SSS clutch installation, with conversion costs estimated
    at approximately 50–60% of a new greenfield 125 MVA SC (~AUD $24M per unit). However,
    operating in SC mode with the gas turbine coupled (windmilling) incurs approximately
    10% per unit (~33 MW) in additional losses — making that operating mode commercially
    unattractive.
  lesson_learnt: Open-cycle gas turbines are among the most cost-effective candidates
    for synchronous condenser conversion via SSS clutch (approximately 60% of new-build
    cost per MVA), but the clutch installation is essential — operating with the turbine
    coupled in windmilling mode incurs ~10% losses per unit, which is commercially
    prohibitive at scale; clutch procurement should be identified as the critical
    path item.
  issue_severity: moderate
  project_type: network/grid
