- record_id: ARENA-DLV-50963
  source_title: Repurposing Existing Generators as Synchronous Condensers
  publish_date: 2023-06
  project_name: Mortlake PS Synchronous Condenser Conversion (Case Study)
  what_happened: Installing a SSS clutch at Mortlake requires extending the drive
    train by approximately 3–5 metres, requiring modifications to the foundation plinth,
    precise shaft extension design, and careful load and alignment analysis — all
    of which must be performed during a major plant outage.
  lesson_learnt: Gas turbine synchronous condenser conversions via SSS clutch require
    civil foundation extension works (typically 1–2m) and precision shaft engineering
    that must be planned as the critical path item; OEM partnership is essential for
    clutch design and integration, and shutdown planning must allow for full driveshaft
    disassembly and reassembly.
  issue_severity: moderate
  project_type: network/grid
  project_scale_band: utility/large-scale
  lifecycle_phase: construction/installation
  proponent_type: utility/energy retailer
  delay_category: construction/installation
  failure_mode: poor scoping
