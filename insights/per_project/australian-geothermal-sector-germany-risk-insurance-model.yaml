  evidence_excerpt: The German government has plans to set up a revolving fund with two thirds of the fund contributed by the government and the remainder by the private insurance sector... the fund will
    cover 80 per cent of the drilling costs of an initial well, if it is not successful. Consequently the owners' contribution represents a deductible of 20 per cent of the drilling costs.
