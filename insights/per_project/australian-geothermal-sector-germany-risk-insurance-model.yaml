- record_id: ARENA-DLV-14978
  source_title: 'Looking Forward: Barriers, Risks and Rewards of the Australian Geothermal Sector to 2020 and 2030'
  publish_date: 2014-06
  project_name: Australian Geothermal Sector – Germany Risk Insurance Model
  what_happened: Germany established a government-backed revolving fund covering 80 per cent of drilling costs for unsuccessful wells (with a 20 per cent owner deductible), combined with high feed-in tariffs,
    enabling multiple commercial geothermal projects to proceed — 26 projects were operating by 2013 — demonstrating that drilling risk insurance is an effective mechanism to catalyse private investment
    in geothermal.
  lesson_learnt: Drilling risk insurance — where government underwrites most of the cost of unsuccessful exploration wells — is a proven mechanism to catalyse private investment in geothermal energy; without
    such risk-sharing, the high probability of a dry or underperforming well at the test-drilling stage makes the risk-adjusted return unacceptable to private capital markets, which is the fundamental market
    barrier that public funding should address.
