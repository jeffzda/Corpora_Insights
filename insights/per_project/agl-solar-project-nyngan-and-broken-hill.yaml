- record_id: ARENA-DLV-33653
  source_title: Large Scale Solar Portfolio Evaluation
  publish_date: '2019-12-20'
  project_name: AGL Solar Project (Nyngan and Broken Hill)
  what_happened: Being the first large-scale solar project to connect to the AEMO
    grid, AGL encountered significant technical and commercial complexity in defining
    the amount and location of additional reactive plant required to stabilise the
    network during a voltage collapse between Nyngan and Dubbo. Extensive modelling
    was required in collaboration with the NSP.
  lesson_learnt: Early and regular engagement with the NSP is essential when connecting
    a novel generation type to the grid — technical negotiations require detailed
    network modelling that takes significant time and cannot be compressed; projects
    should build this into schedules from the outset.
