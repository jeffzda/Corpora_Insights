  publish_date: 2024-07
  project_name: East Kimberley Clean Energy Project
  what_happened: The overnight essential load of the electrolysers emerged during
    Phase 1 engineering as a capacity constraint on the Ammonia Production Facility,
    requiring approximately 5–10 MW of baseload Ord Hydro power to maintain utilities
    and non-process infrastructure at the HPF and solar farm parasitic loads when
    solar is unavailable.
  lesson_learnt: For solar-powered hydrogen projects with intermittent electrolyser
    operation, the overnight parasitic and utility load requirements should be explicitly
    modelled as a capacity constraint on downstream continuous-process facilities
    (such as ammonia plants) — this load was only refined during the study and emerged
    as a binding constraint on APF capacity.
