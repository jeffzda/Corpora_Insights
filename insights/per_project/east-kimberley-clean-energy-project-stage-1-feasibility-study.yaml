  what_happened: The solar resource assessment confirmed that the East Kimberley location
    places in the top 10% of Australian solar potential, with annual GHI consistently
    exceeding 2000 kWh/m² and a capacity factor averaging 27.4% — materially above
    the national mean of 22.4% for solar farms.
  lesson_learnt: The East Kimberley region offers an exceptional solar resource that
    is highly consistent year-round, making it a strong candidate for solar-powered
    industrial processes requiring reliable generation profiles — project developers
    should use multi-year irradiance datasets (2007–2023) to validate resource consistency
    rather than relying on single-year estimates.
