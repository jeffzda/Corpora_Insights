- record_id: ARENA-DLV-18311
  source_title: Aboriginal Clean Energy Partnership - Final Knowledge Sharing Report
  publish_date: 2024-07
  project_name: East Kimberley Clean Energy Project
  what_happened: A pipeline geotechnical desktop assessment identified multiple construction
    geohazards along the 122 km hydrogen pipeline route, including acid sulphate soils,
    saline soils, dispersive soils, high plasticity clays, shallow seasonal groundwater,
    and challenging river crossings (Dunham and Ord Rivers classified as very-high
    risk), all requiring further investigation in Phase 2.
  lesson_learnt: For long greenfield pipeline routes in remote northern Australia,
    geotechnical and hydrological desktop assessments routinely identify a range of
    construction geohazards that materially affect cost and constructability — these
    should be investigated at site walkover stage before pipeline design is advanced,
    as geohazard complexity can significantly affect pipeline routing and construction
    method selection.
