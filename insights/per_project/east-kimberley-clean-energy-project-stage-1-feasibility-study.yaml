  project_name: East Kimberley Clean Energy Project
  what_happened: Environmental approvals were identified as the critical path for
    the project, and a prolonged wet season during Phase 1 posed difficulties for
    environmental survey teams, limiting survey completion.
  lesson_learnt: Environmental approvals should be treated as the critical path from
    the earliest feasibility phase for large-scale renewable energy projects in northern
    Australia — wet season constraints on survey access are predictable and should
    be explicitly scheduled, with dry-season windows protected for on-ground survey
    work.
