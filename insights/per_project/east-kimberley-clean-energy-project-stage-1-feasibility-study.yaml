  publish_date: 2024-08
  project_name: East Kimberley Clean Energy Project
  what_happened: Aboriginal employment in major development projects in the East Kimberley
    has historically underperformed relative to the demographic composition of the
    region, including in skilled roles, because proponents failed to plan adequately
    or engage early enough to ensure a trained, work-ready Aboriginal workforce was
    available when required.
  lesson_learnt: Proponents of large-scale projects in regions with significant Aboriginal
    populations must begin workforce planning and engagement well before construction
    — waiting until construction commences forecloses the lead time needed to build
    a work-ready local workforce, particularly for skilled trades and technical roles.
