  what_happened: The Kimberley region has persistently high unemployment (6–16% over
    2010–2021) and very low Aboriginal workforce participation (35.4% versus a national
    figure of 61.1%), with Aboriginal median weekly income of $361 compared to the
    national median of $805, creating a large latent workforce that is underserved
    by existing employment pathways.
