- record_id: ARENA-DLV-18301
  source_title: Aboriginal Clean Energy Partnership - Final Knowledge Sharing Report
  publish_date: 2024-07
  project_name: East Kimberley Clean Energy Project
  what_happened: The ACE Partnership developed a First Nations-led majority shareholder
    model for a utility-scale green hydrogen and ammonia project, placing Traditional
    Owners (MG Corp and Balanggarra) as majority shareholders and co-decision-makers
    rather than passive stakeholders, which the feasibility study found accelerated
    engineering design and reduced rework.
  lesson_learnt: Structuring Traditional Owners as majority shareholders rather than
    passive stakeholders embeds cultural heritage protection into design decisions
    earlier, enables rapid escalation of heritage risks, and avoids costly rework
    — the model produced demonstrably more efficient engineering optioneering than
    a conventional stakeholder consultation approach.
