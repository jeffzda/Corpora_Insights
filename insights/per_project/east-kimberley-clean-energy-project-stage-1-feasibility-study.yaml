  what_happened: The Port of Wyndham was assessed as largely suitable for ammonia
    export but requires a new Marine Loading Arm and piled support platform, potential
    replacement of sections of the concrete deck superstructure, and possible maintenance
    dredging to deepen the berth pocket — all additional capital works not anticipated
    in the initial scoping study.
