    (particularly hazardous products like ammonia), a detailed structural and operational
    assessment should be completed in early feasibility — the Port of Wyndham required
    multiple capital upgrades beyond initial assumptions, and load capacity verification
    with the port authority should be a Phase 1 deliverable.
