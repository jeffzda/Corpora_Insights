  project_name: East Kimberley Clean Energy Project
  what_happened: The hydrogen pipeline was designed to serve the dual function of
    transporting hydrogen and providing buffer storage (line pack between 30–80 barg),
    enabling continuous operation of the ammonia plant despite intermittent solar-driven
    hydrogen production; this design philosophy was validated at Phase 1 feasibility
    level.
  lesson_learnt: For solar-to-hydrogen-to-ammonia projects, designing the hydrogen
    pipeline as a combined transport and buffer storage asset (using line pack pressure
    cycling) can eliminate or reduce the need for separate dedicated hydrogen storage
    infrastructure — this integration should be validated through dynamic simulation
    early in feasibility to confirm adequacy of storage inventory.
