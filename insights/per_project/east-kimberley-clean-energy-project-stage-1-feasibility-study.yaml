    and responsibilities created inefficiencies, prompting the need for a formal RACI
    framework before entering the more complex second phase.
  lesson_learnt: In multi-party equal-shareholder project structures, a detailed RACI
    framework defining responsibilities and decision-making protocols should be established
    at project outset — the absence of this framework created inefficiencies that
    required mid-phase correction.
