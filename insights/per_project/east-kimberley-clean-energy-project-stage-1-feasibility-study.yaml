  what_happened: The electrolyser technology selection in Phase 1 was based on Worley's
    prior vendor engagement rather than formal vendor engagement for the project,
    with PEM selected as the basis for study due to its cold-restart response time
    and operating pressure advantages; however, a formal vendor engagement process
    was deferred to Phase 2 to confirm efficiencies and costs.
  lesson_learnt: Electrolyser technology selection is a key CAPEX driver for large-scale
    green hydrogen projects — formal vendor engagement should be initiated in early
    feasibility phases rather than deferred, as technology trade-offs between PEM
    and AWE (including high-pressure AWE) can materially affect both capital cost
    and project economics.
