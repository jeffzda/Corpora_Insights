  project_name: East Kimberley Clean Energy Project
  what_happened: No existing geotechnical information was available for the solar
    farm study area, requiring reliance on publicly available 1:250,000 geological
    maps and national-scale surveys for the Phase 1 feasibility assessment, with a
    site walkover and detailed geotechnical investigation deferred to Phase 2.
  lesson_learnt: For greenfield renewable energy projects in remote Australia, the
    absence of existing geotechnical data is common and should be anticipated at concept
    stage — budget and schedule for a site walkover and geotechnical investigation
    should be included in Phase 2 planning rather than treated as a Phase 1 deliverable
    gap.
