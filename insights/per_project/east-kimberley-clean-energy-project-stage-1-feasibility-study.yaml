  what_happened: During environmental surveys, certain areas of cultural significance
    were identified by Balanggarra and Miriuwung Gajerrong peoples prior to survey
    commencement, preventing survey access to those areas; on some occasions surveys
    could not proceed at all for cultural reasons.
  lesson_learnt: Environmental and heritage surveys in First Nations Country should
    be planned with explicit time and cost contingency for culturally restricted access
    — pre-survey identification of culturally significant areas that exclude survey
    teams is a foreseeable constraint in remote northern Australia and should be built
    into survey scheduling and budgets from the outset.
