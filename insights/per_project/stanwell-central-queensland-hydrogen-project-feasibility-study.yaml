    production sites should encompass geotechnical, environmental, ecological, cultural
    heritage, flooding, and civil earthworks assessments simultaneously — co-ordinating
    these in parallel at feasibility stage prevents sequential delays and identifies
    earthworks requirements (including blasting) that affect construction scheduling
    and cost.
