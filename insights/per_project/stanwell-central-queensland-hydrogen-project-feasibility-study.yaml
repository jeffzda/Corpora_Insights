- record_id: ARENA-DLV-14456
  source_title: Central Queensland Hydrogen Project Feasibility Study
  publish_date: 2022-06
  project_name: Central Queensland Hydrogen Project (CQ-H2)
  what_happened: The Phase 2 HPF power requirement of 2,465 MW at start-of-life required
    a new 500/275 kV network to be constructed throughout the Central Queensland Renewable
    Energy Zone, involving expansion of the Larcom Creek substation and installation
    of 20 transformers — a step-change upgrade well beyond anything currently in the
    region.
  lesson_learnt: Utility-scale green hydrogen projects requiring multi-gigawatt electrolysis
    capacity will require major transmission network upgrades that must be co-planned
    with the network operator well ahead of project FID; these upgrades represent
    a critical path item and potential project-enabling constraint independent of
    the hydrogen plant itself.
