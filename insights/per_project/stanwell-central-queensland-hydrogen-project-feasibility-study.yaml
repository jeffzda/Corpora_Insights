  what_happened: The Gladstone region experienced significant negative social impacts
    following the LNG construction boom (2011–2015) — rapid population influx, housing
    cost escalation, and then severe economic contraction after construction ended,
    with workers leaving, house prices dropping, redundancies, and increased demand
    for welfare services persisting through 2020.
  lesson_learnt: Major industrial project proponents in regions with a history of
    boom-bust cycles (such as Gladstone) must develop detailed Social Impact Management
    Plans and Local and First Nations Participation Plans before construction commences
    — the community will have heightened concern about cumulative social impacts and
    managing expectations about employment, housing and services is a social licence
    prerequisite.
