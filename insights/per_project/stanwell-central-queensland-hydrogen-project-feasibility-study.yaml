  evidence_excerpt: The required HPF footprint is highly dependent on the footprint
    of each individual electrolyser. The current proposal can accommodate hydrogen
    production facilities that can support 800 tpd of liquid hydrogen equivalent,
    provided the electrolysers have a compact form, and relatively high load factors.
    Design and cost estimates were included for less compact designs where the electrolysers
    needed to be 'stacked' in order to fit within the available land area.
