  source_title: Central Queensland Hydrogen Project Feasibility Study
  publish_date: 2022-06
  project_name: Central Queensland Hydrogen Project (CQ-H2)
  what_happened: The Feasibility Study confirmed that an Incorporated Joint Venture
    (IJV) is the preferred project structuring vehicle over unincorporated JV or trust
    structures, primarily because it enables grant and debt funding at the JV level,
    allows tax-exempt entities such as Stanwell (a Queensland GOC) to hold more than
    20% equity, and is a familiar structure for non-recourse project finance.
  lesson_learnt: Large-scale hydrogen export projects with mixed public and private
    consortium members should adopt an IJV structure — it enables grant funding to
    be held at the JV level (non-assessable treatment likely), accommodates tax-exempt
    GOC participation above 20%, and provides the separate legal entity structure
    required for project finance, which neither unincorporated JV nor trust structures
    can reliably provide.
