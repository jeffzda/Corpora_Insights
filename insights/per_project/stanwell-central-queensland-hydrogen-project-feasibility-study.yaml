    supply chain cost.
  lesson_learnt: Financial models for hydrogen export projects should present discount
    rate sensitivity as a primary output — given the capital-intensive, long-duration
    nature of these projects, small changes in the discount rate create large changes
    in LCOH, and funders, offtakers and grant agencies should be provided sensitivity
    ranges rather than point estimates.
