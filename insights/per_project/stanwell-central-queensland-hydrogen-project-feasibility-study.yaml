  secondary_failure_mode: poor scoping
  intervention_note: The project noted inapplicability of the P&G Act and developed
    an alternative land acquisition and tenure strategy, engaging early with the Office
    of the Coordinator-General and leveraging the Gladstone State Development Area
    framework.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages: &id004
  - 89
