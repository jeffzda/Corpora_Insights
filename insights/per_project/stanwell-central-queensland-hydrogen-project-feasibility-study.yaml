  source_title: Central Queensland Hydrogen Project Feasibility Study
  publish_date: 2022-06
  project_name: Central Queensland Hydrogen Project (CQ-H2)
  what_happened: Shipping and receiving costs dominate the Phase 1 LCOLH at $11.88/kg
    out of $19.19/kg total (62%), while in Phase 2 this falls to $3.40/kg out of $7.95/kg
    total (43%). The shipping component does not benefit from the same learning curve
    as electrolysis, meaning the supply chain economics only improve materially through
    production scale-up.
  lesson_learnt: Hydrogen export project economics are disproportionately driven by
    shipping and receiving costs at small scale — Phase 1 economics cannot be isolated
    from Phase 2 scale-up; offtake pricing structures must blend Phase 1 and Phase
    2 volumes to be commercially viable, and project proponents should model delivered
    cost rather than production cost when engaging offtakers.
