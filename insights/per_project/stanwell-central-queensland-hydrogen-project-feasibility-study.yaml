- record_id: ARENA-DLV-14454
  source_title: Central Queensland Hydrogen Project Feasibility Study
  publish_date: 2022-06
  project_name: Central Queensland Hydrogen Project (CQ-H2)
  what_happened: Hydrogen pipelines are not covered by the Queensland Petroleum and
    Gas (Production and Safety) Act 2004, meaning the project could not access compulsory
    land acquisition rights available to gas pipeline proponents. This required the
    project to adopt an alternative approach to land tenure and right-of-way acquisition
    for the hydrogen transport pipeline.
  lesson_learnt: Hydrogen pipeline proponents in Queensland cannot rely on the P&G
    Act for compulsory acquisition rights — early legal assessment of the applicable
    legislative framework is essential and alternative tenure strategies must be scoped
    before finalising pipeline route and schedule.
  issue_severity: moderate
  project_type: null
