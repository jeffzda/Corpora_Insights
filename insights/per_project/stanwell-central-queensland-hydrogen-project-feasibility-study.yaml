    phases where Phase 1 functions as a supported commercial demonstration enabling
    Phase 2 cost reduction through scale — financial models should explicitly show
    the Phase 2 standalone economics to demonstrate the long-term commercial pathway
    and attract equity partners willing to accept lower Phase 1 returns.
