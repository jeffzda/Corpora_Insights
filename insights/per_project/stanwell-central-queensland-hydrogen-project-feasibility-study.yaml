- record_id: ARENA-DLV-14480
  source_title: Central Queensland Hydrogen Project Feasibility Study
  publish_date: 2022-06
  project_name: Central Queensland Hydrogen Project (CQ-H2)
  what_happened: The Phase 1 HPF electrolyser footprint was found to be highly dependent
    on the chosen electrolyser technology — compact versus non-compact form factors
    and stacked versus non-stacked configurations — requiring the plot plan to accommodate
    multiple technology outcomes and prompting investigation of double-stacking configurations
    to manage land constraint risk.
  lesson_learnt: Hydrogen production facility plot plans at feasibility stage must
    be designed to accommodate a range of electrolyser footprints across candidate
    technologies — since technology selection occurs at FEED, the site layout must
    remain flexible, and maximum footprint requirements for non-compact technologies
    should be used as the conservative design basis to avoid site constraint becoming
    a technology selection constraint.
