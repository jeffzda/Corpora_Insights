  publish_date: 2022-06
  project_name: Central Queensland Hydrogen Project (CQ-H2)
  what_happened: The Phase 1 feasibility study concluded the project is potentially
    commercially viable only with appropriate government support. Without grants and
    concessional debt, the base-case levelised cost of liquefied hydrogen delivered
    to Japan was $19.19/kg, well above commercially competitive levels.
  lesson_learnt: Large-scale first-of-kind renewable hydrogen export projects should
    not be structured assuming commercial viability without confirmed government grant
    and concessional debt support — the financial model must be tested against a no-support
    scenario to understand the funding gap before proceeding to FEED.
