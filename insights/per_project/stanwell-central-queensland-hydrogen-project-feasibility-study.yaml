  source_title: Central Queensland Hydrogen Project Feasibility Study
  publish_date: 2022-06
  project_name: Central Queensland Hydrogen Project (CQ-H2)
  what_happened: Electrolyser capital cost estimates obtained from vendors during
    the Feasibility Study materially exceeded the values used in the 2020/2021 Concept
    Study, with vendors indicating price increases of 15–20% attributable to COVID-19
    supply chain disruptions and the conflict in eastern Europe affecting global steel
    and metals markets.
  lesson_learnt: Electrolyser cost assumptions from concept-stage studies should not
    be carried forward into feasibility modelling without fresh vendor pricing — global
    supply chain shocks can increase electrolyser CAPEX by 15–20% within 12–18 months,
    significantly impacting project economics.
