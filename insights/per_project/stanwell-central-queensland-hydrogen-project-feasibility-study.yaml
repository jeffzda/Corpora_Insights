  source_title: Central Queensland Hydrogen Project Feasibility Study
  publish_date: 2022-06
  project_name: Central Queensland Hydrogen Project (CQ-H2)
  what_happened: The existing 66 kV electricity distribution network at Fishermans
    Landing was found to be insufficient for the Phase 1 HLF power demand (~70–75
    MW) and could not be economically upgraded, requiring a new transmission line.
    A double-circuit 275 kV connection was identified as the preferred option to also
    serve Phase 2 requirements.
  lesson_learnt: Early power transmission assessment for greenfield industrial sites
    is critical — existing distribution infrastructure at port-adjacent sites may
    be wholly inadequate for large electrolyser or liquefaction loads, requiring costly
    new transmission infrastructure that must be scoped and scheduled before FEED
    commences.
