  project_name: Central Queensland Hydrogen Project (CQ-H2)
  what_happened: The electrolyser vendor engagement during the Feasibility Study was
    limited to a Request for Information (RFI) approach only, rather than the originally
    planned Early Contractor Involvement (ECI). This relied on vendor goodwill and
    correct interpretation of scope, and NDAs were executed only between vendors and
    the technical advisor rather than the broader Consortium.
  lesson_learnt: Electrolyser vendor engagement should be progressed to ECI rather
    than RFI at feasibility stage for projects of this scale — RFI responses rely
    on vendor goodwill and scope interpretation, and limiting NDAs to the technical
    advisor prevents the full Consortium from accessing detailed vendor data, reducing
    cost estimate quality.
