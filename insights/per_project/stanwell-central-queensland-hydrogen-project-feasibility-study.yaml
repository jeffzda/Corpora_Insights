- record_id: ARENA-DLV-14451
  source_title: Central Queensland Hydrogen Project Feasibility Study
  publish_date: 2022-06
  project_name: Central Queensland Hydrogen Project (CQ-H2)
  what_happened: A 10 MW hydrogen electrolysis demonstration project at Stanwell Power
    Station was found to be technically feasible but only modestly commercially viable
    if it could attract a green premium offtake agreement and grant funding for a
    material portion of capital costs. Neither was available, so Stanwell discontinued
    the project.
  lesson_learnt: For first-of-kind hydrogen demonstration projects, technical feasibility
    alone is insufficient — commercial viability requires confirmed offtake premiums
    and significant capital grant support at the point of investment decision. If
    these cannot be secured, project discontinuation is likely regardless of technical
    merit.
