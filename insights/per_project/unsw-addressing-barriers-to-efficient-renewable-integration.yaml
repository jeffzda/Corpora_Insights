  source_title: Addressing Barriers to Efficient Renewable Integration Milestone 1
  publish_date: 2019-02
  project_name: Addressing Barriers to Efficient Renewable Integration
  what_happened: The AEMO 2015 survey of NEM inverter frequency trip settings found
    significant dispersion in settings across the installed base — with 53.5% of NEM
    inverters set to trip below 47 Hz (i.e., outside the normal operating range) —
    indicating low probability of mass simultaneous disconnection under normal disturbances.
    However, a cluster of 14.1% of inverters was set to trip at 49 Hz with a 0.06
    s pickup time, creating a plausible rapid mass-trip risk under moderate under-frequency
    events.
  lesson_learnt: Survey data on inverter trip settings provides a valuable foundation
    for DER dynamic modelling and risk assessment — AEMO's 2015 survey covering 44%
    of installed capacity showed concerning clustering at 49 Hz; future DER integration
    planning should maintain updated inverter settings registers to enable accurate
    aggregate trip modelling and early identification of emerging clustering risks
    before they reach the scale of Germany's 50.2 Hz problem.
