  what_happened: INV#3 (representing 120 MW of NEM installed capacity) was found to
    respond so slowly to an over-frequency event — taking more than 10 seconds to
    reduce active power output — that it would provide no effective generation relief
    to the network during an over-frequency event, continuing to inject power when
    it should curtail.
  lesson_learnt: Slow frequency response in inverters can be as operationally harmful
    as disconnection — an inverter that takes >10 seconds to respond to over-frequency
    provides no grid service during the disturbance window; standards and procurement
    specifications should set explicit maximum response time requirements, not just
    trip thresholds.
