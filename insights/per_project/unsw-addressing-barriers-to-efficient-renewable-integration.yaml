  source_title: Addressing Barriers to Efficient Renewable Integration Milestone 1
  publish_date: 2019-02
  project_name: Addressing Barriers to Efficient Renewable Integration
  what_happened: Analysis of a frequency disturbance event on the Kingston feeder
    (Tasmania, 25 August 2018) found evidence of DER tripping during an under-frequency
    event with a nadir of 48.72 Hz, with approximately 100 kW of generation lost ~80
    ms after frequency reached 49 Hz — consistent with the AEMO 2015 survey showing
    ~14% of NEM inverters set to trip at 49 Hz with a 0.06 s pickup time. Separating
    DER trip contribution from load voltage-dependency effects required composite
    load modelling, which was not yet available.
  lesson_learnt: Accurately attributing feeder power changes during frequency disturbances
    to DER trips versus load voltage/frequency dependency requires a validated composite
    load model — without one, the DER trip signal is ambiguous; system operators deploying
    monitoring infrastructure on high-DER feeders should invest in concurrent load
    composition characterisation to make event data interpretable.
