  what_happened: Overcurrent injection during voltage sags was identified in a significant
    proportion of tested inverters (10 out of 20 AS 4777.2:2015 units, 4 out of 9
    AS 4777.2:2005 units), with peak overcurrent reaching 1.9 p.u. for 2015-standard
    inverters. The new AS 4777.2:2020 standard mandates 'momentary cessation' to address
    this, but the large installed base of 2015 and 2005 inverters continues to pose
    a risk to distribution protection relay coordination.
  lesson_learnt: Grid integration studies for high-DER penetration networks must explicitly
    model the overcurrent injection behaviour of the installed inverter fleet during
    voltage sags — protection relay settings designed without accounting for DER fault
    current contribution may operate incorrectly, causing spurious tripping and compounding
    disturbance events.
