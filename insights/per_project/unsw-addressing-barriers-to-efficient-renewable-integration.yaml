- record_id: ARENA-DLV-37460
  source_title: Addressing Barriers to Efficient Renewable Integration Milestone 1
  publish_date: 2019-02
  project_name: Addressing Barriers to Efficient Renewable Integration
  what_happened: The project identified that load/DER modelling for bulk power system
    studies is an iterative and ongoing task — not a one-time activity. Load composition
    changes on an hourly, daily, and seasonal basis, and as the grid evolves (with
    increasing power-electronic loads replacing resistive and motor loads), models
    must be continuously updated. Very little information was found to exist about
    Australian load composition, representing a systemic data gap.
  lesson_learnt: System operators and grid planners should treat DER and composite
    load model maintenance as a continuous operational function, not a project deliverable
    — the lack of Australian load composition data at the time of this study means
    any initial model parameters carry high uncertainty, and a sustained data collection
    and model update programme is needed to ensure bulk power system studies remain
    fit for purpose as DER penetration grows.
