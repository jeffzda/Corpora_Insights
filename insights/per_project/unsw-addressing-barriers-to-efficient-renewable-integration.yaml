  source_title: Addressing Barriers to Efficient Renewable Integration Milestone 6
  publish_date: 2022-03
  project_name: Addressing Barriers to Efficient Renewable Integration
  what_happened: Bench testing of 28+ rooftop PV inverters revealed that a wide variety
    of unexpected behaviours occur during grid disturbances — including disconnection
    and power curtailment in response to short-duration voltage sags, phase-angle
    jumps, and rate-of-change-of-frequency events — behaviours not captured by the
    2015 Australian standard AS 4777.2.
  lesson_learnt: Product standards for grid-connected inverters must be continuously
    tested against real disturbance profiles — the 2015 standard did not require ride-through
    testing for voltage sags shorter than 1 second, yet bench testing showed these
    sags cause mass disconnection; standards gaps should be identified through systematic
    bench testing before large-scale fleet deployment.
