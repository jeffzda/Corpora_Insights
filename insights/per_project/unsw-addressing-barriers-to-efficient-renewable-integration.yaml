  source_title: Addressing Barriers to Efficient Renewable Integration Milestone 1
  publish_date: 2019-02
  project_name: Addressing Barriers to Efficient Renewable Integration
  what_happened: The DER_A model developed by WECC (finalised September 2018) was
    adopted as the modelling framework for Australian DER dynamic representation,
    but its parameterisation required significant adaptation to Australian standards
    (AS4777.2-2015 and AS4777.3-2005). A key parameter — Vrfrac (the fraction of devices
    that recover after voltage returns to normal) — had to be assumed at 0.5 (50%)
    due to insufficient high-speed feeder data, with the project team flagging this
    as a critical assumption requiring further validation.
  lesson_learnt: When adapting international DER models to the Australian context,
    key parameters such as the partial-recovery fraction (Vrfrac) cannot be reliably
    set without high-speed feeder measurement data — deploying PMUs or PQMs on a representative
    set of high-DER feeders before committing to model parameter values is essential
    to avoid propagating untested assumptions into bulk power system stability studies.
