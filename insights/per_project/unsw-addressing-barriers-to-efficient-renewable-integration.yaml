  what_happened: INV#5 (representing 70 MW of installed capacity) was found to disconnect
    at a Rate of Change of Frequency (RoCoF) above 0.4 Hz/s, a threshold easily exceeded
    during normal power system disturbances, thereby exacerbating the frequency event
    that caused the high RoCoF in the first place. Recovery time after disconnection
    is 7 minutes.
  lesson_learnt: RoCoF sensitivity thresholds of deployed inverters should be explicitly
    evaluated when assessing grid integration risks — an inverter that trips on RoCoF
    above 0.4 Hz/s will worsen the very frequency event it responds to, and this positive-feedback
    risk compounds as DER penetration grows.
