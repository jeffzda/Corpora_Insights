  what_happened: Parameter estimation using the component-based approach alone (Estimation
    I) was unable to significantly reduce modelling error for the WECC Composite Load
    Model against measured substation data — the objective function only reduced from
    5.416 to 4.231. The default component-based parameters failed to replicate the
    load tripping behaviour observed in feeder measurements, indicating that survey-derived
    load fractions are insufficient to capture actual distribution system dynamics.
  lesson_learnt: Component-based parameterisation of composite load models using standard
    surveys and default values produces insufficiently accurate load behaviour representations
    for Australian distribution networks, particularly regarding under-voltage protection
    tripping. Measurement-based calibration against real disturbance data must be
    incorporated to improve model accuracy.
