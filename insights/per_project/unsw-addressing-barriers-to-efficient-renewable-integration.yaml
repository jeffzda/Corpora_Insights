- record_id: ARENA-DLV-13614
  source_title: Addressing Barriers to Efficient Renewable Integration Milestone 5
  publish_date: 2021-08
  project_name: Addressing Barriers to Efficient Renewable Integration
  what_happened: The project found that sub-cycle threats such as grid voltage phase-angle
    jumps and short-duration voltage sags cannot be adequately represented in the
    composite PV-load model implemented in Siemens PSS/E, because that software platform
    operates on steady-state phasor analysis of positive-sequence voltage components
    only, creating a fundamental modelling gap for transient events.
  lesson_learnt: Simulation platforms based on steady-state phasor analysis (such
    as PSS/E) are unsuitable for modelling sub-cycle DER behaviour during transient
    events; grid integration studies that need to assess inverter responses to phase-angle
    jumps or short-duration voltage sags require time-domain or electromagnetic transient
    (EMT) simulation tools.
