- record_id: ARENA-DLV-13602
  source_title: Addressing Barriers to Efficient Renewable Integration Milestone 5
  publish_date: 2021-08
  project_name: Addressing Barriers to Efficient Renewable Integration
  what_happened: Bench testing showed that commercially available AS 4777.2:2015-compliant
    inverters exhibit highly varied responses to voltage sags, including undesired
    disconnection, power curtailment, and overcurrent injection — behaviours not captured
    by compliance testing. For a 100 ms voltage sag to 0.22 pu, 3 out of 20 AS 4777.2:2015
    inverters disconnected (representing 157 MW out of 770 MW), 6 curtailed power,
    and 10 out of 20 exhibited overcurrent.
  lesson_learnt: Grid integration planners and system operators should not assume
    that AS 4777.2:2015-certified inverters will ride through realistic voltage sags;
    model parameters for DER aggregation and contingency planning must be derived
    from empirical bench testing data rather than assumed from standard compliance.
