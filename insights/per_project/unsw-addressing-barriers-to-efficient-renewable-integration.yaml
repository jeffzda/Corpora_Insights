- record_id: ARENA-DLV-6351
  source_title: Addressing Barriers to Efficient Renewable Integration Milestone 2
  publish_date: 2019-07
  project_name: Addressing Barriers to Efficient Renewable Integration
  what_happened: Bench testing of 17 PV inverters revealed that multiple units — including
    those certified as complying with AS 4777.2:2015 — disconnected or curtailed output
    to zero following a 100 ms voltage sag, despite the standard requiring continuous
    operation for voltage disturbances clearing within the 1 s trip delay time. AS
    4777.2:2015 does not include a test procedure to verify inverter ride-through
    for sub-trip-delay voltage sags, creating a compliance gap.
  lesson_learnt: The absence of a standardised test procedure for short-duration voltage
    sag ride-through in AS 4777.2:2015 means that certified inverters can still fail
    in practice — grid integration planners and standard-setters should not assume
    standard compliance guarantees ride-through capability for sub-cycle disturbances.
    A specific accreditation test for short-duration voltage sags should be developed
    and mandated.
  issue_severity: major
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: research organisation/university
  delay_category: null
