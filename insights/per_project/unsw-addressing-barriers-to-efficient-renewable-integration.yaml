- record_id: ARENA-DLV-69758
  source_title: Addressing Barriers to Efficient Renewable Integration Milestone 4
  publish_date: 2020-07
  project_name: Addressing Barriers to Efficient Renewable Integration
  what_happened: Bench testing showed that the wide variety of behaviours displayed
    by different inverter models during voltage sag events — ranging from full ride-through
    to full disconnection to partial power curtailment with recovery times of up to
    7 minutes — presented a fundamental challenge to developing a single aggregate
    model for all PV inverters in power system simulations.
  lesson_learnt: Aggregate DER models used for power system stability studies must
    incorporate statistical distributions of inverter behaviour rather than a single
    representative response — the tested population showed that a meaningful fraction
    (not all) of inverters display unusual behaviours, and model parameters must reflect
    this heterogeneity to avoid systematic underestimation of generation loss during
    disturbances.
