  project_name: Addressing Barriers to Efficient Renewable Integration
  what_happened: 'Bench testing of Inverter 2 revealed that it was uniquely sensitive
    to the rate of change of voltage during sags: when voltage transitioned from 230
    V to 50 V within 1 ms, the inverter curtailed its output to zero with a 6–7 minute
    recovery; the same sag with a 2 ms or 5 ms transition time resulted in full ride-through.
    This behaviour is not captured by any current Australian standard test.'
  lesson_learnt: Inverter certification testing should include tests for rate-of-change-of-voltage
    sensitivity — at least one commercially deployed inverter in the NEM shows markedly
    different behaviour depending on the voltage transition speed, a parameter not
    currently tested in AS 4777.2, and which could cause unexpected generation loss
    during fast-clearing protection events.
