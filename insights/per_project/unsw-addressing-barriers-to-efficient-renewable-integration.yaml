- record_id: ARENA-DLV-6352
  source_title: Addressing Barriers to Efficient Renewable Integration Milestone 2
  publish_date: 2019-07
  project_name: Addressing Barriers to Efficient Renewable Integration
  what_happened: Bench testing projected that if all inverters in the NEM behaved
    like the 9.22% tested, a single short-duration voltage sag could cause disconnection
    or curtailment of up to 1,549 MW (23%) of residential PV capacity across the NEM,
    with Victoria at risk of losing up to 41% of its sub-9.5 kW DER capacity from
    a single grid disturbance event.
  lesson_learnt: Grid integration planners and system operators should account for
    the possibility of large-scale simultaneous PV disconnection from common grid
    disturbances — aggregate DER behaviour under voltage sags cannot be assumed to
    be benign simply because individual inverters are standard-compliant. System stability
    assessments must model this correlated disconnection risk.
