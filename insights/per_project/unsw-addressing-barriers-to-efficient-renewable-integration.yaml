  source_title: Addressing Barriers to Efficient Renewable Integration Milestone 3
  publish_date: 2020-02
  project_name: Addressing Barriers to Efficient Renewable Integration
  what_happened: Including protection equipment parameters (motor trip fractions,
    undervoltage thresholds, electronic load recovery fractions) in the WECC-CMLD
    parameter calibration optimisation reduced model error from 5.416 to 0.829 (Estimation
    II), compared to a reduction only to 4.231 when protection parameters were excluded.
    Extending parameter bounds further reduced the error to 0.483 (Estimation III).
  lesson_learnt: Accurate dynamic load modelling for Australian distribution networks
    requires explicit calibration of under-voltage protection parameters — not just
    load fractions and static load coefficients — because protection-driven load tripping
    during disturbances dominates the observed post-fault power trajectory and cannot
    be replicated without correctly parameterising the relay models.
