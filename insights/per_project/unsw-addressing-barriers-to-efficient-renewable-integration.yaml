  what_happened: Calibrated WECC-CMLD parameters varied substantially across four
    different feeder disturbance events (e.g. electronic load fraction Fel ranged
    0.203–0.596; load tripping fractions Ftr1 ranged 0.050–0.417 across events), demonstrating
    that no single parameter set adequately represents the aggregate load behaviour
    across all contingencies. The current tool calibrated parameters separately for
    each disturbance.
  lesson_learnt: Composite load model parameters for Australian distribution feeders
    are event- and condition-specific; a single calibrated parameter set cannot reliably
    represent load behaviour across different disturbance types, times of day, or
    seasons. Future calibration tools should optimise parameters simultaneously against
    multiple disturbance events to derive more robust load model representations.
