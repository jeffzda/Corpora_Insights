- record_id: ARENA-DLV-69755
  source_title: Addressing Barriers to Efficient Renewable Integration Milestone 4
  publish_date: 2020-07
  project_name: Addressing Barriers to Efficient Renewable Integration
  what_happened: 'The WECC DER-A composite load model, which is the international
    standard approach for aggregating DER behaviour in power system simulations, was
    found to have shortcomings when applied to the Australian grid: it could not represent
    multiple under-frequency trip limits or rate-of-change-of-frequency (RoCoF) protection,
    both of which are real DER behaviours observed in the Australian NEM.'
  lesson_learnt: Do not apply WECC composite load model parameters to Australian power
    system simulations without first adapting the model structure to accommodate Australian-specific
    protection settings — the default model cannot represent RoCoF protection or multiple
    under-frequency trip limits that are characteristic of AS 4777-compliant inverters,
    leading to inaccurate contingency predictions.
