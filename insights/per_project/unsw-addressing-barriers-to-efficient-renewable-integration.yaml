  what_happened: Testing of Volt-VAr dynamic response across nine inverters found
    that none of the six surveyed DNSP technical documents specify a response time
    requirement for Volt-VAr, leaving inverter response times to vary widely between
    manufacturers — measured response times ranged from 0.1 seconds to 10 seconds
    using default settings, with the average at 6.2 seconds across both over- and
    under-voltage tests.
  lesson_learnt: The absence of Volt-VAr response time requirements in DNSP connection
    documents means that installed inverters may respond to voltage disturbances far
    more slowly than network models assume; DNSPs and project developers should establish
    explicit response time specifications in connection agreements to ensure voltage
    regulation effectiveness.
