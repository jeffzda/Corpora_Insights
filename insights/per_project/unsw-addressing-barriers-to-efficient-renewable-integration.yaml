- record_id: ARENA-DLV-6353
  source_title: Addressing Barriers to Efficient Renewable Integration Milestone 2
  publish_date: 2019-07
  project_name: Addressing Barriers to Efficient Renewable Integration
  what_happened: Bench testing of 18 PV inverters against phase angle jumps (15°,
    30°, 45°, 90°) showed highly variable responses across makes and models. Several
    inverters complying with AS 4777.2:2015 disconnected or reduced output to zero
    following phase angle jumps as small as 15°–30°. AS 4777.2:2015 does not specify
    any requirements or test procedure for phase angle jump withstand.
  lesson_learnt: AS 4777.2:2015 compliance does not guarantee that PV inverters will
    remain connected during phase angle jumps, which occur as a consequence of transmission
    faults. Future versions of AS 4777 must mandate phase angle jump ride-through
    requirements and a corresponding test procedure, as already required by IEEE Std
    1547-2018.
