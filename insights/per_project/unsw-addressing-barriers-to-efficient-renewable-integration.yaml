- record_id: ARENA-DLV-6356
  source_title: Addressing Barriers to Efficient Renewable Integration Milestone 2
  publish_date: 2019-07
  project_name: Addressing Barriers to Efficient Renewable Integration
  what_happened: 'Frequency step testing of AS 4777.2:2015 compliant inverters revealed
    highly variable power reduction response times: one inverter reduced output within
    ~1 second (desired), another took 2–3 seconds, and a third took more than 20 seconds
    following the frequency step. Additionally, AS 4777.3:2005 compliant inverters
    showed widely varying frequency disconnection thresholds (49–55 Hz), none of which
    are standardised.'
  lesson_learnt: Wide variability in frequency response speed across certified AS
    4777.2:2015 inverters means that aggregate DER frequency response cannot be treated
    as predictable for system stability modelling. Load models and system restoration
    plans that assume timely droop response from DER should be validated against measured
    inverter response diversity rather than standard-nominal values.
