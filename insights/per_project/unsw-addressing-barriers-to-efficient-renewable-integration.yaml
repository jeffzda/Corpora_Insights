  project_name: Addressing Barriers to Efficient Renewable Integration
  what_happened: One AS 4777.2:2015-compliant inverter (Inverter No. 4, Manufacturer
    D) reconnected after an under-frequency event at 47.1 Hz — below the standard
    requirement of 47.5 Hz — while all other tested inverters met the requirement.
    The AS 4777.2:2015 compliance test does not assess reconnection frequency after
    an under-frequency event, meaning this non-conformance would not be detected through
    standard certification.
  lesson_learnt: Reconnection frequency after under-frequency events is not assessed
    by the AS 4777.2:2015 compliance test suite, leaving a gap that allows non-conforming
    inverters to be certified and deployed; project developers and network operators
    should include reconnection frequency verification in commissioning acceptance
    tests for PV inverters.
