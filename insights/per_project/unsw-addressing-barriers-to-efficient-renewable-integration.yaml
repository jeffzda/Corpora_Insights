- record_id: ARENA-DLV-37959
  source_title: Addressing Barriers to Efficient Renewable Integration Milestone 3
  publish_date: 2020-02
  project_name: Addressing Barriers to Efficient Renewable Integration
  what_happened: Sub-cycle disturbances such as phase-angle jumps and short-duration
    voltage sags — which are known to cause inverter disconnection — cannot be adequately
    represented in phasor-based simulation software (PSS/E) because the software operates
    on steady-state positive-sequence phasor analysis and cannot model these instantaneous
    phenomena.
  lesson_learnt: Phasor-based power system simulation tools (such as PSS/E) are structurally
    incapable of representing sub-cycle inverter disconnection triggers such as phase-angle
    jumps and short-duration voltage sags; projects assessing DER ride-through performance
    must use electromagnetic transient (EMT) simulation tools for these disturbance
    types, and findings from phasor-domain studies should not be taken as definitive
    for sub-cycle risks.
