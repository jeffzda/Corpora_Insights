  project_name: Addressing Barriers to Efficient Renewable Integration
  what_happened: Phase-angle jump bench testing found that approximately 19% of NEM
    DER power is vulnerable to a 30° phase-angle jump, rising to approximately 48%
    for a 90° phase-angle jump, with highly variable outcomes across inverter makes
    and models — some disconnecting, some curtailing to zero, others curtailing partially,
    and others riding through unaffected.
