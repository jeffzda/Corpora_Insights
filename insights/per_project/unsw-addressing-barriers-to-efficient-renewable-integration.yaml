  project_name: Addressing Barriers to Efficient Renewable Integration
  what_happened: UNSW bench testing found that at least 15–30% of post-2016 PV systems
    installed under the 2015 standard did not perform the required over-frequency
    droop response, despite the standard mandating it — indicating a systemic compliance
    failure in the installed DPV fleet.
  lesson_learnt: Standards compliance should not be assumed from certification alone
    — field monitoring of installed inverter fleets is necessary to verify that certified
    behaviours (such as over-frequency droop response) are actually being delivered
    at scale, as installation errors (e.g. not updating firmware to the current standard
    version) can result in widespread non-compliance.
