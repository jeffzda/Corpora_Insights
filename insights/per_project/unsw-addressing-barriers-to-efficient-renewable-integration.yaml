  project_name: Addressing Barriers to Efficient Renewable Integration
  what_happened: The measurement-based parameter calibration tool for the WECC-CMLD
    was developed to calibrate parameters against a single disturbance event at a
    time. The project team identified this as a limitation, as parameters calibrated
    against one event did not necessarily generalise to other disturbance types, times
    of day, or weather conditions.
  lesson_learnt: Load model calibration tools for DER-rich distribution networks should
    be designed from the outset to optimise parameters simultaneously against multiple
    disturbance events rather than a single event, to produce parameters that are
    robust across operating conditions rather than overfitted to one grid incident.
