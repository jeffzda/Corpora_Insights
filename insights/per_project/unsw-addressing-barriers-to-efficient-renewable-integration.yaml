- record_id: ARENA-DLV-6355
  source_title: Addressing Barriers to Efficient Renewable Integration Milestone 2
  publish_date: 2019-07
  project_name: Addressing Barriers to Efficient Renewable Integration
  what_happened: 'Bench testing showed that one inverter brand (both 2005 and 2015
    compliant models, Inverters 5 and 14) disconnected from the grid in response to
    RoCoF as low as 1 Hz/s — a rate of frequency change that can occur during normal
    grid contingency events. AS 4777 contains no RoCoF ride-through requirement. Projected
    NEM-wide impact if this brand''s behaviour is representative: up to 2,629 MW (39%)
    of sub-9.5 kW DER disconnecting, with Queensland at 54% and Tasmania at 55% of
    state DER capacity.'
  lesson_learnt: RoCoF vulnerability is a real and brand-specific risk among certified
    PV inverters in Australia. Because AS 4777 does not mandate RoCoF ride-through,
    this gap will persist until standards are updated. Grid integration planners in
    high-DER regions should treat sudden large-scale PV disconnection during frequency
    contingencies as a credible scenario rather than a theoretical one.
