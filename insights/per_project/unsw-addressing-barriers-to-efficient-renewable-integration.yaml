  what_happened: Inverter bench testing demonstrated that DER model parameters previously
    set by default or estimated from standards alone could be measured empirically
    — for example, AS/NZS 4777.2:2015 inverters had an average overvoltage disconnection
    time of 1.8 s and AS/NZS 4777.3:2005 inverters averaged 1.9 s, measurements not
    available from the standards themselves.
  lesson_learnt: Power system modellers should use empirical inverter bench-testing
    data to set DER model parameters rather than relying on standard default values
    — standards often specify disconnection thresholds but not disconnection times,
    and bench-testing data can replace engineering-judgement estimates with high-confidence
    measured values, materially improving model accuracy.
