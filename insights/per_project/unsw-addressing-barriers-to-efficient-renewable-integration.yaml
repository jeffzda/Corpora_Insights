- record_id: ARENA-DLV-6361
  source_title: Addressing Barriers to Efficient Renewable Integration Milestone 2
  publish_date: 2019-07
  project_name: Addressing Barriers to Efficient Renewable Integration
  what_happened: Bench testing and grid incident analysis revealed that PV inverter
    sampling, processing, and decision-making timescales are 2–3 orders of magnitude
    faster than conventional power system equipment. Existing simulation tools operating
    at standard power system time-steps were found to be inadequate for modelling
    sub-cycle inverter responses to phase jumps and rapid voltage sags.
  lesson_learnt: Grid integration modelling for high-DER systems must use simulation
    tools capable of time-steps smaller than 100 microseconds to accurately capture
    inverter responses to sub-cycle disturbances. Standard power system simulation
    time-steps are insufficient for this purpose, and projects developing or deploying
    DER integration models should explicitly account for this tooling requirement.
