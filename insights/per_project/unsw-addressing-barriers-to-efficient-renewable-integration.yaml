  source_title: Addressing Barriers to Efficient Renewable Integration Milestone 4
  publish_date: 2020-07
  project_name: Addressing Barriers to Efficient Renewable Integration
  what_happened: 'Bench testing of 25 rooftop PV inverters revealed that the current
    Australian standard AS 4777.2 does not test inverter behaviour under short-duration
    voltage sags (less than 1 second), leaving a critical gap: inverters certified
    as compliant were found to disconnect or curtail power to zero in response to
    voltage sags not covered by the standard''s test procedures.'
  lesson_learnt: Product certification standards for grid-connected inverters should
    include short-duration voltage sag tests across a range of depths and durations
    — compliance with current AS 4777.2 does not guarantee safe ride-through behaviour
    during realistic grid disturbances, and this gap must be addressed before large-scale
    DER deployment can be considered grid-secure.
