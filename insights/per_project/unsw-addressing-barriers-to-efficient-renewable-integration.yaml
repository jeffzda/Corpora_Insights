  source_title: Addressing Barriers to Efficient Renewable Integration Milestone 5
  publish_date: 2021-08
  project_name: Addressing Barriers to Efficient Renewable Integration
  what_happened: Testing of AS 4777.2:2005-compliant inverters under a 100 ms voltage
    sag to 0.22 pu showed that 5 out of 9 inverters disconnected (representing 95
    MW out of 560 MW) and 4 out of 9 exhibited overcurrent injection, despite the
    standard not specifying an anticipated response for this condition. This creates
    unquantified protection-relay interaction risks in distribution networks designed
    without accounting for DER fault current contribution.
  lesson_learnt: Legacy AS 4777.2:2005 inverters still operating in the field present
    a material grid-security risk during voltage sag events; network planners and
    system operators should account for the disconnection probability and overcurrent
    injection of this inverter cohort when modelling fault scenarios and protection
    coordination.
