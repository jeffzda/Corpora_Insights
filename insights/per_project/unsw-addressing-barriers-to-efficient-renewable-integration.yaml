  source_title: Addressing Barriers to Efficient Renewable Integration Milestone 5
  publish_date: 2021-08
  project_name: Addressing Barriers to Efficient Renewable Integration
  what_happened: The project identified that understanding of how disturbances propagate
    from the transmission layer to the distribution layer — where rooftop inverters
    are connected — remains insufficient, and that transformer connections and transmission/distribution
    line characteristics may materially affect disturbance propagation. This knowledge
    gap limits the accuracy of composite PV-load models for contingency planning.
  lesson_learnt: Grid integration studies for high-DER penetration scenarios should
    explicitly model the transmission-to-distribution interface, including transformer
    connection types and line parameters, rather than assuming direct propagation
    of bulk system disturbances to the distribution level where inverters operate.
