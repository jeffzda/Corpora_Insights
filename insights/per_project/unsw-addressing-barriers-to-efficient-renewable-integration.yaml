  source_title: Addressing Barriers to Efficient Renewable Integration Milestone 4
  publish_date: 2020-07
  project_name: Addressing Barriers to Efficient Renewable Integration
  what_happened: The project's steering committee (AEMO, ElectraNet, TasNetworks)
    and industry advisory group actively shaped the research agenda at milestone 4,
    redirecting priorities to include inverter performance under weak grid conditions
    and volt-var operation based on emerging needs identified through industry engagement.
    This co-design mechanism ensured research outputs remained aligned with live operational
    concerns.
  lesson_learnt: Research projects addressing grid integration challenges should establish
    formal steering committees with network operators and market bodies as members,
    with authority to adjust research priorities between milestones — AEMO, ElectraNet
    and TasNetworks' participation directly redirected UNSW's research to address
    emerging operational concerns (weak grid performance, volt-var), accelerating
    the practical relevance of outputs.
