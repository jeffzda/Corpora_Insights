  project_name: Addressing Barriers to Efficient Renewable Integration
  what_happened: The WECC DER-A composite load model, developed for power system dynamic
    simulations, contained several shortcomings when applied to the Australian grid,
    including inability to represent multiple under-frequency trip limits and rate-of-change-of-frequency
    protection — behaviours specific to the Australian power grid. Default model parameters
    were found to be insufficiently calibrated for Australian inverter behaviour.
  lesson_learnt: Power system simulation models based on international frameworks
    (WECC) should not be applied to Australian grid studies without empirical re-calibration
    against locally tested inverter behaviour — default parameters fail to capture
    Australia-specific protection settings and DER behaviours, leading to inaccurate
    contingency assessments.
