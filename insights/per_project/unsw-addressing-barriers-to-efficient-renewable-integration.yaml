  project_name: Addressing Barriers to Efficient Renewable Integration
  what_happened: As of September 2018, approximately 71–78% of installed rooftop PV
    across NEM states (NSW 71%, QLD 76%, SA 78%, VIC 74%, TAS 75%) was installed under
    the older AS4777.3-2005 standard, which has significantly different and generally
    wider frequency and voltage trip settings than the current AS4777.2-2015 standard.
    This legacy fleet creates a persistent modelling and grid security challenge that
    will not self-resolve as the installed base grows.
  lesson_learnt: The large legacy DER fleet operating under superseded standards must
    be explicitly modelled as a separate cohort in bulk power system studies — system
    operators and project developers planning grid integration of new large-scale
    renewables should account for the aggregate trip behaviour of the predominant
    AS4777.3-2005 fleet, not only the behaviour of new AS4777.2-2015 compliant installations.
