- record_id: ARENA-DLV-37951
  source_title: Addressing Barriers to Efficient Renewable Integration Milestone 3
  publish_date: 2020-02
  project_name: Addressing Barriers to Efficient Renewable Integration
  what_happened: Bench testing of 25 PV inverters from 11 manufacturers — representing
    approximately 19% of NEM installed rooftop PV capacity — confirmed that inverters
    fully compliant with AS 4777.2:2015 are nonetheless vulnerable to short-duration
    voltage sags, phase-angle jumps, and rate-of-change-of-frequency disturbances.
    Under extrapolated assumptions, approximately 31% of NEM DER power (about 2.1
    GW) is estimated to be at risk of disconnection or curtailment from a short-duration
    voltage sag.
  lesson_learnt: Grid integration planning for high-DER systems must not assume that
    AS 4777.2 compliance guarantees ride-through behaviour under realistic grid disturbances
    — a significant share of installed rooftop PV capacity can disconnect simultaneously
    during common fault events, creating material bulk-power-system stability risks
    that system planners must model explicitly.
