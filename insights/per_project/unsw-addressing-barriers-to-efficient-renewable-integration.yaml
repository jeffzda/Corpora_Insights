  what_happened: Testing revealed that one AS 4777.2:2015-compliant inverter (Inverter
    25) curtailed output power to 0.55–0.75 p.u. following voltage sags of moderate
    depth (0.4–0.2 p.u.), with recovery taking 6–7 minutes, effectively equivalent
    to a long-duration disconnection. This behaviour is not captured by standard compliance
    tests, meaning it would not be detected in procurement qualification.
  lesson_learnt: Power curtailment post-sag with slow recovery (6–7 minutes) is functionally
    equivalent to disconnection for system frequency management purposes; procurement
    specifications for grid-scale PV projects should explicitly test and prohibit
    this behaviour, not just test for physical disconnection.
