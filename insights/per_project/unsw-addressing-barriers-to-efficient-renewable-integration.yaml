- record_id: ARENA-DLV-6357
  source_title: Addressing Barriers to Efficient Renewable Integration Milestone 2
  publish_date: 2019-07
  project_name: Addressing Barriers to Efficient Renewable Integration
  what_happened: 'The Australian standard AS 4777.2:2015 was found to be materially
    less prescriptive than IEC TS 62786-2017, German standard VDE-AR-N 4105-2018,
    and IEEE Std 1547-2018 on three specific grid disturbance types: short-duration
    voltage sags, phase angle jumps, and RoCoF. All three international standards
    include specific voltage-versus-time ride-through curves and RoCoF limits; AS
    4777 includes none of these requirements.'
  lesson_learnt: Project developers and grid planners integrating high volumes of
    DER in Australia should not assume that AS 4777 compliance provides the same level
    of grid disturbance ride-through assurance as international equivalents. Standards
    gaps should be identified early in project design and advocated for remediation;
    in the interim, additional testing beyond AS 4777 requirements should be considered
    for critical DER assets.
