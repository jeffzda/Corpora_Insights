  source_title: Addressing Barriers to Efficient Renewable Integration Milestone 6
  publish_date: 2022-03
  project_name: Addressing Barriers to Efficient Renewable Integration
  what_happened: The existing WECC composite load model had shortcomings for the Australian
    context, including inability to represent multiple under-frequency trip limits
    and rate-of-change-of-frequency protection — both common DER behaviours in the
    Australian power grid — requiring the model to be substantially adapted before
    it could be used for Australian system planning.
  lesson_learnt: International power system models (such as the WECC composite load
    model) should not be adopted without systematic validation against local grid
    codes and inverter standards — specific Australian DER behaviours such as multiple
    under-frequency trip limits and RoCoF protection were absent from the standard
    WECC model and required custom development informed by local inverter bench-testing
    data.
