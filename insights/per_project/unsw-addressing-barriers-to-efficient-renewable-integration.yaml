  project_name: Addressing Barriers to Efficient Renewable Integration
  what_happened: Parameter estimation using only the component-based approach for
    the WECC Composite Load Model (WECC-CMLD) failed to accurately replicate observed
    load behaviour during grid disturbances in Australia. In Estimation I, using default
    parameters derived from AEMO surveys, the objective function (model error) could
    only be reduced from 5.416 to 4.231 — indicating the model could not capture the
    post-fault load reduction observed in measurements.
  lesson_learnt: Component-based load model parameters derived from surveys alone
    are insufficient for accurate dynamic simulation of Australian distribution networks
    with high DER penetration — a measurement-based calibration step against actual
    disturbance data is necessary to capture protection-driven load tripping behaviour
    that survey-based approaches miss.
