  project_name: Addressing Barriers to Efficient Renewable Integration
  what_happened: The composite PV-load model parameter estimation tool developed under
    Milestone 2 was updated during Milestone 3 to incorporate the DER A component
    (representing aggregate rooftop PV dynamics) alongside the load component. Testing
    against grid disturbance data with and without load tripping showed the updated
    model closely matched measured active and reactive power trajectories, performing
    significantly better than the default-parameter model.
  lesson_learnt: Incorporating DER dynamics explicitly into composite load models
    used by system operators — rather than representing rooftop PV as a passive negative
    load — substantially improves the accuracy of post-disturbance power trajectory
    prediction; AEMO and network operators adopting WECC-CMLD for NEM studies should
    include the DER A component with measurement-calibrated parameters rather than
    relying on component-based defaults.
