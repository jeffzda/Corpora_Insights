  project_name: Addressing Barriers to Efficient Renewable Integration
  what_happened: 'Bench testing of five commercially deployed PV inverters (representing
    ~30% of NEM installed capacity by manufacturer market share) found multiple instances
    of non-compliance with AS4777.2-2015 and detrimental grid responses, including:
    three inverter types (500 MW combined) reducing output to zero on voltage phase
    angle changes >30°; two types (250 MW) failing the fast voltage sag test; two
    types (280 MW) tripping too quickly on under-frequency; and only one of five performing
    Volt-Watt response correctly.'
  lesson_learnt: Do not assume CEC-listed inverters labelled as AS4777.2-2015 compliant
    will behave as required during grid disturbances — bench testing revealed widespread
    non-compliance and detrimental responses across inverters representing hundreds
    of MW of installed capacity; procurement specifications and commissioning acceptance
    criteria for DER projects should include specific disturbance response testing
    beyond self-declared compliance.
