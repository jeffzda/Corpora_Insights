  what_happened: Detailed bench testing revealed that Inverter 4 (a commercially deployed
    rooftop PV inverter representing a real brand in the NEM) curtailed its output
    power to zero in response to voltage sags as shallow as 20% depth across all tested
    durations (80 ms, 120 ms, 220 ms), without raising any alarm or physically disconnecting
    — behaviour that is effectively equivalent to disconnection but invisible to grid
    operators.
  lesson_learnt: DER integration planning must account for 'silent' power curtailment
    behaviours in deployed inverters — Inverter 4's curtailment to zero with no alarm
    state means grid operators cannot detect or predict this loss of generation during
    disturbances, and aggregate modelling that relies only on disconnection alarms
    will underestimate generation loss.
