    reporting period (Milestone 5), despite the project commencing in July 2018, because
    recommendations from the steering committee and industry advisory group were needed
    to trigger the work. A notable increase in household rooftop three-phase inverter
    installations had meanwhile occurred, and AEMO had already begun developing a
    three-phase inverter model that required empirical test data.
  lesson_learnt: Research projects involving inverter characterisation should include
    three-phase inverter testing from the outset given the rapid uptake of three-phase
    residential installations — delaying this testing until it is recommended by the
    steering committee creates a gap between model development timelines and the empirical
    data needed to validate them.
