  what_happened: The wide variety of behaviours observed across tested inverter makes
    and models — including disconnection, curtailment to zero, partial curtailment,
    and ride-through — was identified as a fundamental challenge to developing a single
    accurate aggregate DER model for bulk power system studies.
  lesson_learnt: Aggregate DER models used in bulk power system studies must capture
    the statistical distribution of inverter response behaviours across the installed
    fleet, rather than a single representative behaviour — treating the fleet as homogeneous
    will produce incorrect estimates of post-disturbance generation loss and may mask
    significant stability risks.
