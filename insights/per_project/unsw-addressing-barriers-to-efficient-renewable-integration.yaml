  what_happened: The 2015 version of AS 4777.2 did not require ride-through testing
    for voltage sags of duration less than 1 second, leaving a critical gap in inverter
    certification that allowed inverters susceptible to mass-disconnection events
    to be installed at scale across the NEM.
  lesson_learnt: When developing or reviewing inverter connection standards, fault
    clearing times specified in network rules (e.g. National Electricity Rules Table
    S5.1a.2) should be used to define the minimum voltage sag durations that inverters
    must ride through — the 2015 standard's omission of sub-1-second sag testing enabled
    deployment of inverters that disconnect under common network fault conditions.
