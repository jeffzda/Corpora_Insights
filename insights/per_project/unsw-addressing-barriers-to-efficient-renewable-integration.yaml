- record_id: ARENA-DLV-6362
  source_title: Addressing Barriers to Efficient Renewable Integration Milestone 2
  publish_date: 2019-07
  project_name: Addressing Barriers to Efficient Renewable Integration
  what_happened: The wide diversity of inverter behaviours observed across brands
    and models — including different ride-through characteristics, curtailment responses,
    reconnection times, and frequency disconnection thresholds — made it infeasible
    to develop a single aggregate DER model valid for all operating conditions. Two
    or more sub-models were identified as necessary for sub-cycle disturbance scenarios.
  lesson_learnt: 'A single aggregate DER model is insufficient for power system studies
    involving rapid disturbances: at minimum, separate models are needed for phase
    angle jumps/voltage sags and for high-RoCoF events. Grid integration assessments
    that treat all DER as behaving identically during transient disturbances will
    produce unreliable results, particularly in high-penetration regions.'
