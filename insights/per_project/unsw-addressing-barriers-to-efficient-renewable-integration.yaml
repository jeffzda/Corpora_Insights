- record_id: ARENA-DLV-42860
  source_title: Addressing Barriers to Efficient Renewable Integration Milestone 6
  publish_date: 2022-03
  project_name: Addressing Barriers to Efficient Renewable Integration
  what_happened: UNSW's bench testing found that even inverters certified as compliant
    with older standards (2005 and 2015) exhibited undesired behaviours including
    power ramp-up anomalies during start-up, with UNSW estimating that over 50% of
    Australia's then 10 GW installed inverter-based resource would behave undesirably
    (disconnecting or curtailing power) if exposed to a voltage sag of 0.5 pu for
    220 ms.
  lesson_learnt: Policymakers and system operators should not assume that historically
    certified inverters will perform acceptably under future grid disturbance profiles
    — over 50% of the pre-2020-standard installed fleet may disconnect under a 0.5
    pu, 220 ms voltage sag, and retrofitting or accelerated replacement programs should
    be evaluated before DPV penetration reaches levels where this represents a credible
    contingency event.
