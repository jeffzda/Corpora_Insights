  project_name: Addressing Barriers to Efficient Renewable Integration
  what_happened: Bench testing projected that a 90° phase angle jump — which can propagate
    from transmission faults to low-voltage distribution networks — could cause disconnection
    or curtailment of up to 3,366 MW (50% of NEM sub-9.5 kW DER capacity), with Queensland
    at 47%, South Australia at 61%, and Tasmania at 65% of state DER capacity at risk.
  lesson_learnt: Phase angle jumps from transmission-level faults represent a credible
    trigger for large-scale simultaneous PV disconnection events that could destabilise
    the grid. System planners deploying high DER penetration scenarios must model
    this tail risk and advocate for standards upgrades that mandate inverter phase
    angle ride-through.
