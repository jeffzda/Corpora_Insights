  source_title: Addressing Barriers to Efficient Renewable Integration Milestone 4
  publish_date: 2020-07
  project_name: Addressing Barriers to Efficient Renewable Integration
  what_happened: UNSW developed a tuned version of the DER-A model using inverter
    bench-test results to set key parameters (including overvoltage disconnection
    time, undervoltage trip delays, and maximum converter current) with direct empirical
    grounding. The updated model was provided to AEMO, who integrated it into PSS/E
    and began ongoing benchmarking against historical disturbance measurements, confirming
    a close match between model output and recorded data.
  lesson_learnt: Power system simulation models for DER aggregation should be parameterised
    using empirical bench-test data from representative inverter populations rather
    than default or internationally-derived values — UNSW's approach of directly linking
    test results to DER-A parameters produced a model that closely matched historical
    NEM disturbance recordings, demonstrating the value of co-located testing and
    modelling programmes.
