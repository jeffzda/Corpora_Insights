    from 5.416 to 0.829. Extending the parameter bounds further in Estimation III
    reduced it to 0.483. The default WECC-CMLD parameters consistently underperformed
    calibrated versions across all four additional test events.
  lesson_learnt: For accurate composite load modelling of Australian distribution
    feeders, protection equipment parameters — particularly under-voltage trip settings
    — must be included in the calibration process alongside load fractions. Default
    WECC-CMLD parameter sets derived from international datasets should not be used
    for Australian studies without measurement-based calibration against local disturbance
    data.
