- record_id: ARENA-DLV-37456
  source_title: Addressing Barriers to Efficient Renewable Integration Milestone 1
  publish_date: 2019-02
  project_name: Addressing Barriers to Efficient Renewable Integration
  what_happened: Analysis of voltage disturbance events on the high-DER-penetration
    Currimundi feeder (Queensland) showed that even transmission-level faults with
    relatively mild voltage dips (0.80–0.84 pu at inverter terminals) caused measurable
    rooftop PV disconnection, with net demand increases of 90–440 kW depending on
    the PV capacity factor at the time. Inverters installed prior to October 2016
    (under AS4777.3-2005) were identified as most likely to have tripped, as their
    voltage trip settings (200–230 V) would have been exceeded.
  lesson_learnt: Pre-2016 PV inverters on high-penetration feeders represent a material
    grid security risk during transmission-level faults — asset managers and system
    operators should map the concentration of legacy AS4777.3-2005 inverters on feeders
    and account for involuntary DER disconnection in fault analysis, particularly
    for asymmetric faults which showed higher trip rates than symmetric faults.
