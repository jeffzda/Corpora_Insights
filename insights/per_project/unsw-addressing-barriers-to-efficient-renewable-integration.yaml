- record_id: ARENA-DLV-13616
  source_title: Addressing Barriers to Efficient Renewable Integration Milestone 5
  publish_date: 2021-08
  project_name: Addressing Barriers to Efficient Renewable Integration
  what_happened: Some inverters certified under AS 4777.2:2015 had recently been recertified
    as voltage ride-through compliant in South Australia following firmware updates.
    However, earlier bench testing of the same inverters under the UNSW test procedure
    had shown undesired behaviour, creating uncertainty about whether firmware updates
    reliably deliver the expected performance improvements.
  lesson_learnt: Firmware updates that achieve regulatory recertification should be
    independently verified through bench testing before being relied upon in system
    planning — certification of updated firmware does not guarantee that real-world
