  project_name: Addressing Barriers to Efficient Renewable Integration
  what_happened: Germany's experience with the '50.2 Hz problem' — where a single
    frequency trip setting applied uniformly to all low-voltage PV caused a near-simultaneous
    shutdown risk — required mandatory retrofitting of over 315,000 inverters at a
    cost of approximately €175 million (~$250 million AUD). This arose because bulk
    power system security implications of a uniform distributed PV trip setting were
    not assessed at the time the standard was set.
  lesson_learnt: Performance standards for distributed inverters must be evaluated
    for their bulk power system security implications before adoption — the German
    retrofitting programme demonstrates that correcting a poor standard after mass
    deployment is extremely costly; Australian standards development should explicitly
    model aggregate DER trip behaviour under plausible disturbance scenarios before
    finalising settings.
