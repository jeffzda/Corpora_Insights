- record_id: ARENA-DLV-13601
  source_title: Addressing Barriers to Efficient Renewable Integration Milestone 5
  publish_date: 2021-08
  project_name: Addressing Barriers to Efficient Renewable Integration
  what_happened: Bench testing of 28+ rooftop PV inverters revealed that the current
    Australian standard AS 4777.2 does not test inverter behaviour under short-duration
    voltage sags (less than 1 second), a disturbance type that can cause mass disconnection
    of distributed PV and pose a security risk to frequency management in the bulk
    power system.
  lesson_learnt: Standards compliance alone cannot be relied upon to guarantee safe
    inverter behaviour during realistic grid disturbances — project proponents deploying
    large quantities of rooftop or utility-scale PV should specify and verify short-duration
    voltage sag ride-through performance independently of AS 4777.2 compliance testing.
