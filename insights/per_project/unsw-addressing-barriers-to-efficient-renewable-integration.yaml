  project_name: Addressing Barriers to Efficient Renewable Integration
  what_happened: The existing AS 4777.2:2015 standard did not require inverters to
    withstand phase-angle jumps, low-voltage ride-through, or RoCoF events. Bench
    testing demonstrated that inverters compliant with this standard could still fail
    under these disturbances, creating a regulatory gap that the standard's requirements
    did not address.
  lesson_learnt: Inverter connection standards that do not include dynamic ride-through
    requirements (phase-angle jump, LVRT, RoCoF) create a regulatory gap that, at
    scale, becomes a bulk-power-system security risk — standards bodies and system
    planners should proactively test compliance boundaries before high DER penetration
    makes the gap operationally consequential.
