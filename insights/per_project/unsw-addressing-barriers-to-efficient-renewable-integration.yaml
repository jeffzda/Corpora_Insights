- record_id: ARENA-DLV-42861
  source_title: Addressing Barriers to Efficient Renewable Integration Milestone 6
  publish_date: 2022-03
  project_name: Addressing Barriers to Efficient Renewable Integration
  what_happened: Inverter 32, while passing ride-through requirements under AS 4777.2:2020
    for 800 ms voltage sags, responded by injecting an overcurrent of 1.4 pu during
    the sag, which could trigger protection schemes in the power system — a potentially
    harmful behaviour not prohibited by the standard.
  lesson_learnt: Inverter certification standards should specify not only that inverters
    must ride through grid disturbances but also the permissible current injection
    profile during the disturbance — overcurrent responses during voltage sags can
    trigger network protection relays even when the inverter technically passes compliance
    testing, creating a hidden system security risk.
