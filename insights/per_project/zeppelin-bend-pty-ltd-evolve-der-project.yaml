- record_id: ARENA-DLV-52067
  source_title: ARENA Distributed Energy Resources Projects
  publish_date: 2019-03
  project_name: Zeppelin Bend Pty Ltd evolve DER Project
  what_happened: The evolve DER project was structured to augment and extend multiple
    software systems across a large consortium (nine network businesses, four technology
    partners, and two universities) to calculate and publish operating envelopes for
    individual and aggregated DER across multiple states, with NSW Government co-funding
    via a side deed with ARENA.
  lesson_learnt: Multi-party DER operating envelope platforms require careful consortium
    governance from the outset — the scale of partner coordination across multiple
    DNSPs, technology vendors, and universities necessitates clear data-sharing agreements,
    defined system ownership, and co-funding structures agreed before development
    commences.
