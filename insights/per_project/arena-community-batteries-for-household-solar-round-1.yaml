- record_id: ARENA-DLV-37053
  source_title: Community Battery Market Snapshot Report
  publish_date: '2025-02-28'
  project_name: ARENA Community Batteries for Household Solar – Round 1
  what_happened: No economies of scale were observable in relation to the number of
    batteries per project (i.e., deploying more batteries in a single project did
    not reduce unit costs), because community battery projects are highly customised
    to local site conditions and project management overheads are a small proportion
    of total costs.
  lesson_learnt: Proponents should not assume that deploying more batteries per project
    will reduce unit costs; cost efficiency in community battery portfolios comes
    from larger individual battery size, not greater project count, and financial
    models should reflect this.
