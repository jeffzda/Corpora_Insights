- record_id: ARENA-DLV-37055
  source_title: Community Battery Market Snapshot Report
  publish_date: '2025-02-28'
  project_name: ARENA Community Batteries for Household Solar – Round 1
  what_happened: Network (front-of-meter) batteries were on average 73% more expensive
    per Wh than non-network (behind-the-meter) batteries ($2.30 vs $1.33/Wh), driven
    primarily by higher balance-of-plant and construction costs, regional operator
    cost premiums, and large investments in new digital infrastructure rather than
    leveraging existing systems.
  lesson_learnt: Network battery cost models should explicitly account for elevated
    balance-of-plant, construction and digital infrastructure costs that do not apply
    to BTM deployments; where possible, networks should assess whether partnering
    with existing technology providers rather than building bespoke digital systems
    can reduce costs materially.
