- record_id: ARENA-DLV-37052
  source_title: Community Battery Market Snapshot Report
  publish_date: '2025-02-28'
  project_name: ARENA Community Batteries for Household Solar – Round 1
  what_happened: Clear economies of scale were observed in battery project costs,
    with the sharpest cost reduction occurring as capacity increases from 500 to 1,000
    kWh, levelling off at approximately $1/Wh. Fixed project costs (land, planning,
    balance of plant) spread over larger volumes drove the trend, not cheaper battery
    modules.
  lesson_learnt: Community battery projects below ~500 kWh face significantly higher
    unit costs due to fixed project overhead; where feasible, proponents should aggregate
    or upsize batteries to approach the 500–1,000 kWh threshold to access substantially
    lower $/Wh costs.
