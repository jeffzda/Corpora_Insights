- record_id: ARENA-DLV-37051
  source_title: Community Battery Market Snapshot Report
  publish_date: '2025-02-28'
  project_name: ARENA Community Batteries for Household Solar – Round 1
  what_happened: Across 21 funded community battery projects, costs varied from $0.73
    to $4.10/Wh — a nearly six-fold spread — with network (front-of-meter) batteries
    averaging $2.30/Wh compared to $1.33/Wh for non-network (behind-the-meter) batteries.
    Very few proposals had locked in major cost elements at the time of application.
  lesson_learnt: Community battery project cost estimates should be treated with significant
    caution at the proposal stage; the wide spread ($0.73–$4.10/Wh) reflects project-specific
    conditions and an immature market, and proponents should stress-test financial
    models against a range of cost outcomes before committing to a revenue model.
