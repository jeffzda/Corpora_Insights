- record_id: ARENA-DLV-37072
  source_title: Community Battery Market Snapshot Report
  publish_date: '2025-02-28'
  project_name: ARENA Community Batteries for Household Solar – Round 1
  what_happened: Network battery projects (100%) universally intend to provide network
    support services, with some explicitly siting batteries to defer expensive network
    augmentation in constrained or remote areas. In contrast, only 40% of non-network
    battery projects target network support, with the remainder prioritising commercially
    simpler revenue streams.
  lesson_learnt: Program designers seeking to maximise network support outcomes from
    community battery funding should recognise that DNSP-owned (network) batteries
    are structurally more likely to deliver network services than commercially owned
    BTM batteries — funding stream design (DNSP vs non-DNSP) materially influences
    whether network congestion objectives are met.
