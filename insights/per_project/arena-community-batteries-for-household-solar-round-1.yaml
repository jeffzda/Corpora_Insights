  what_happened: Most community battery projects (both network and non-network) are
    best described as 'community-scale batteries' that deliver local benefits without
    relying on community ownership or deep community engagement. None of the network
    battery projects included plans for data transparency with the local community,
    and only three non-network projects planned to make battery operation transparent.
