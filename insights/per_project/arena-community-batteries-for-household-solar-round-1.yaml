- record_id: ARENA-DLV-37054
  source_title: Community Battery Market Snapshot Report
  publish_date: '2025-02-28'
  project_name: ARENA Community Batteries for Household Solar – Round 1
  what_happened: 67% of community battery project proposals did not consider dynamic
    operating envelope (DOE) integration despite DOE export management becoming mandatory
    in South Australia, Victoria, and potentially Queensland before the batteries
    would be operational. Only four network and three non-network projects addressed
    DOE integration in their applications, and the technical and commercial requirements
    (CSIP-Aus communications protocol, network state forecasting integration, contracts)
    were not fully resolved in any proposal.
  lesson_learnt: Community battery proponents must assess mandatory DOE integration
    requirements at the proposal stage — failure to plan for CSIP-Aus communications,
    network state forecasting compatibility and commercial arrangements risks operational
    constraint or non-compliance once batteries are deployed in jurisdictions where
    DOE export management is compulsory.
