  source_title: Community Battery Market Snapshot Report
  publish_date: '2025-02-28'
  project_name: ARENA Community Batteries for Household Solar – Round 1
  what_happened: The 'child meter' configuration used in BTM community battery projects
    — which creates an embedded network — enables simultaneous direct wholesale market
    and FCAS settlement for the battery while reducing network charges (particularly
    demand charges) for the host customer. The AEMC was considering rule changes to
    simplify the administrative processes for child metering arrangements at the time
    of the report.
  lesson_learnt: BTM community battery projects should investigate the child meter
    / embedded network configuration early in design, as it unlocks both wholesale
    market exposure for the battery and demand charge reduction for the host customer
    simultaneously — and proponents should monitor the AEMC 'Unlocking CER benefits
    through flexible trading' rule change process as it may reduce administrative
    burden.
