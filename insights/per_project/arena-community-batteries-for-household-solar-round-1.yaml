  source_title: Community Battery Market Snapshot Report
  publish_date: '2025-02-28'
  project_name: ARENA Community Batteries for Household Solar – Round 1
  what_happened: Non-network battery operators found demand charge reduction to be
    a more accessible and lucrative revenue stream than network support agreements,
    with 80% of non-network batteries targeting demand charge reduction compared to
    only 40% targeting formal network support. Demand charge reduction requires no
    complex tendering, registration or settlement but delivers system-level downsides
    including non-locational incentives and no integration with network planning.
  lesson_learnt: Portfolio designers and regulators should recognise that the commercial
    simplicity of demand charge reduction will attract BTM battery operators away
    from network support services — if network congestion relief is a policy objective,
    structural reforms (e.g. capacity subscriptions, dynamic tariffs) are needed to
    align private incentives with network planning outcomes.
