- record_id: ARENA-DLV-37073
  source_title: Community Battery Market Snapshot Report
  publish_date: '2025-02-28'
  project_name: ARENA Community Batteries for Household Solar – Round 1
  what_happened: Network projects applying for RAB cost allocation must follow AER
    guidance that requires calculating the ratio of network to non-network benefits
    and applying grant funding against either cost stack. The ratios of network and
    non-network costs varied significantly between projects, creating complexity in
    financial modelling and regulatory compliance.
  lesson_learnt: DNSP proponents should engage early with AER guidance on RAB cost
    allocation (including the ring-fencing class waiver methodology) and model multiple
    grant allocation scenarios — the choice of whether to apply grant funding against
    regulated or non-regulated cost stacks has material implications for both regulated
    returns and project commercial viability.
