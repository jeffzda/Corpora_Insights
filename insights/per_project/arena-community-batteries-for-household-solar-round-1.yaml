  what_happened: Behind-the-meter community battery projects face a risk of unexpected
    cost increases where existing site electrical infrastructure (switchboards, transformers,
    protection equipment) is unsuitable and requires upgrade. Some applicants mitigated
    this by conducting early site inspections to screen candidate sites before committing.
  lesson_learnt: For BTM community battery projects, conduct early electrical infrastructure
    inspections at candidate sites before financial commitment — transformer or switchboard
    upgrades can be high-cost and materially affect project viability if discovered
