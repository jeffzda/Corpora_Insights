- record_id: ARENA-DLV-52057
  source_title: ARENA Distributed Energy Resources Projects
  publish_date: 2019-03
  project_name: Impact Investment Group Karratha Airport Solar Plant
  what_happened: A demonstration of solar PV with cloud predictive technology at Karratha Airport successfully reduced the battery storage requirement by 50% while keeping output ramp rates within limits
    imposed by Horizon Power.
  lesson_learnt: Integrating cloud predictive technology with solar PV can halve battery storage requirements in off-grid or fringe-of-grid applications while maintaining network operator ramp-rate compliance
    — projects should evaluate forecasting-enabled dispatch before sizing storage.
