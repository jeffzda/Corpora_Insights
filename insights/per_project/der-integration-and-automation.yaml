- record_id: ARENA-DLV-9126
  source_title: State of DER Technology Integration Report
  publish_date: 2021-02
  project_name: DER Integration and Automation
  what_happened: The Evoenergy DER Integration and Automation project identified that
    lack of DER visibility for networks and absence of DER integration standards from
    vendors and DNSPs were key impediments to business-as-usual adoption of the DERMS-deX
    integration demonstrated in the project.
  lesson_learnt: DERMS-to-aggregator integration projects will face BAU adoption barriers
    unless underpinned by sector-wide standards for DER integration and improved network
    visibility — project teams should explicitly address the standards gap as part
    of the project scope rather than treating it as an external dependency to be solved
    separately.
