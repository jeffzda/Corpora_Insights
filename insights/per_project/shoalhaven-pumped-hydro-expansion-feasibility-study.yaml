  source_title: Shoalhaven Knowledge Sharing Report 2
  publish_date: 2020-05
  project_name: Shoalhaven Pumped Hydro Scheme Expansion
  what_happened: The absence of recent PHES construction experience in Australia and
    a limited local contractor pool capable of competitive EPC pricing was identified
    as a systemic industry barrier across all proposed PHES projects, contributing
    to the cost escalation observed at Shoalhaven and, as noted by Origin, across
    multiple proposed projects in Australia where no project (except Snowy 2.0) reached
    a successful FID.
  lesson_learnt: The lack of PHES construction experience and a thin local civil contractor
    market in Australia is a systemic risk applicable to all proposed PHES projects
    — procurement strategies must account for the need to attract and potentially
    develop the capability of international contractors, and should not assume a competitive
    domestic EPC market will emerge without deliberate policy or market intervention.
