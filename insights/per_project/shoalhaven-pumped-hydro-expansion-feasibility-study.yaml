  what_happened: There was no current clear price signal or payment mechanism for
    grid stability services (inertia, synchronous condenser operation) in the NEM
    at the time of the feasibility study, despite pumped hydro being capable of providing
    these services in both pumping and generating modes — meaning this potential value
    stream could not be included in the financial model.
  lesson_learnt: Developers of pumped hydro projects should not include inertia or
    synchronous condenser services as a modelled revenue stream until a clear NEM
    market mechanism or payment framework exists — the absence of a price signal means
    this capability cannot be relied upon in investment case modelling, though it
    should be preserved as an option value if market structures evolve.
