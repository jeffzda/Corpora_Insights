- record_id: ARENA-DLV-47260
  source_title: Shoalhaven Knowledge Sharing Report 1
  publish_date: '2019-02-28'
  project_name: Shoalhaven Pumped Hydro Scheme Expansion
  what_happened: 'Origin developed a scenario-based market modelling framework using
    PLEXOS to value the SPHS expansion, anchored on the AEMO 2018 Integrated System
    Plan but adjusted with Origin''s internal views on asset retirements and operational
    behaviour. Three scenarios were run: Reference Case, Snowy 2.0 Case, and High
    Renewables Case, producing a revenue range of approximately $50,000–$260,000 per
    MW installed (real) across the period FY23–FY33.'
  lesson_learnt: For pumped hydro investment decisions, a minimum of three distinct
    market scenarios — including a large-competitor-entry case and an accelerated-renewables
    case — should be modelled using a production-simulation tool (such as PLEXOS)
    that captures hydrology constraints, look-ahead dispatch optimisation, and inter-regional
    transmission limits; single-scenario or simplified spreadsheet modelling is insufficient
    given the range of outcomes demonstrated.
