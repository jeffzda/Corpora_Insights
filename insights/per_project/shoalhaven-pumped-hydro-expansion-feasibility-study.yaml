- record_id: ARENA-DLV-14005
  source_title: Shoalhaven Knowledge Sharing Report 2
  publish_date: 2020-05
  project_name: Shoalhaven Pumped Hydro Scheme Expansion
  what_happened: Pipeline and penstock costs came in higher than anticipated due to
    steel costs, AUD/USD and AUD/EUR exchange rate movements, and transport logistics.
    During tendering, the narrow construction easement and steep terrain on the overland
    pipe section required the use of a cable crane at additional cost that had not
    been anticipated in the pre-feasibility study.
  lesson_learnt: PHES projects relying on imported turbines and large-diameter steel
    pipelines carry significant exchange rate exposure — design and commercial risk
    management must include currency hedging strategies and should not lock in capital
    cost assumptions based on FX rates at project inception. Site-specific constructability
    reviews of pipeline routes are essential as desktop assessments routinely underestimate
    terrain-driven cost premiums.
