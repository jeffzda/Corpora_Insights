  source_title: Shoalhaven Knowledge Sharing Report 2
  publish_date: 2020-05
  project_name: Shoalhaven Pumped Hydro Scheme Expansion
  what_happened: Reviews of three reference PHES projects provided by ECI bidders
    found that all three experienced significant schedule challenges due to emergent
    geotechnical and tunnelling issues, two experienced material groundwater inflow
    problems requiring design changes, and all encountered significant tunnelling
    incidents. Long project durations also exposed projects to supplier insolvency
    and legislative or market changes.
  lesson_learnt: Reference-class data from comparable international PHES projects
    confirms that tunnelling incidents, groundwater inflows and geotechnical surprises
    are near-universal on such projects, not outlier risks — contingency allowances,
    contract structures (e.g. GBR framework) and schedule buffers must be set accordingly,
    not to optimistic base-case assumptions.
