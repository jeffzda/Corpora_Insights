  what_happened: The availability and cost of civil EPC contractors and materials
    was adversely affected by a concurrent peak in major infrastructure projects across
    Australia (WestConnex, Cross River Rail, Melbourne Metro Tunnel, Perth Forrestfield
    Airport Link, and similar SE Asian projects), reducing the competitive pool and
    driving up costs and construction durations.
  lesson_learnt: PHES and large civil infrastructure project timelines and costs are
    heavily influenced by the macro construction market cycle — project developers
    should monitor the pipeline of major civil works nationally and regionally when
    setting cost and schedule assumptions, as a concentrated construction boom will
    reduce competition, inflate prices and extend durations.
