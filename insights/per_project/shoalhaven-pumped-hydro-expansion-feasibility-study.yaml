- record_id: ARENA-DLV-14007
  source_title: Shoalhaven Knowledge Sharing Report 2
  publish_date: 2020-05
  project_name: Shoalhaven Pumped Hydro Scheme Expansion
  what_happened: The limited worldwide pool of contractors technically capable and
    experienced in PHES meant that no single contractor was willing to offer a competitive
    EPC contract. OEM suppliers preferred supply-and-commission-only arrangements,
    and civil contractors preferred arrangements that excluded OEM performance guarantees,
    requiring Origin to develop a split Design & Construct plus separate OEM supply
    contract model joined by a Tripartite Agreement.
  lesson_learnt: PHES developers should not assume a conventional single-party EPC
    contract is achievable — the global PHES contractor pool is thin, OEMs will not
    accept construction risk, and civil contractors will not accept OEM performance
    risk. A Design & Construct plus separate OEM supply arrangement under a Tripartite
    Agreement is a more realistic and competitive contracting structure.
  issue_severity: moderate
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: approvals/contracting
  proponent_type: utility/energy retailer
  delay_category: procurement/supply chain
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: coordination & stakeholders
  intervention_note: Origin adopted a Design & Construct methodology with the constructor
    as Principal and OEM supplying under a separate supply contract to Origin, with
    all parties joined under a Tripartite Agreement.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: pumped hydro
  source_pages: &id006
  - 26
  evidence_excerpt: During this process it became evident, due to the scale and nature
    of the Project, that it was unlikely that one contractor would be willing to offer
    a competitive Engineer, Procure & Construct (EPC) contract... Thus, it was decided
    to follow a Design and Construct (D&C) methodology with the constructor being
    the Principal contractor and the OEM supplying the equipment for installation
    under a separate supply contract to Origin.
