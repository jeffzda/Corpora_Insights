  source_title: Shoalhaven Knowledge Sharing Report 2
  publish_date: 2020-05
  project_name: Shoalhaven Pumped Hydro Scheme Expansion
  what_happened: High horizontal in-situ stresses were confirmed by geotechnical investigation
    at the cavern location, consistent with initial assumptions. This finding increased
    the estimated extent of ground support required and could contribute to extending
    construction time, though Origin assessed the cost impact as not material based
    on available pricing information.
  lesson_learnt: PHES cavern designs in high horizontal stress environments should
    include conservative ground support assumptions in cost estimates from the outset
    — confirmed high horizontal stresses will require more extensive ground support
    and can extend tunnelling timelines even where the direct materials cost is not
    large.
