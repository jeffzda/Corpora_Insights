- record_id: ARENA-DLV-47261
  source_title: Shoalhaven Knowledge Sharing Report 1
  publish_date: '2019-02-28'
  project_name: Shoalhaven Pumped Hydro Scheme Expansion
  what_happened: Observable changes in the Shoalhaven scheme's operating profile between
    Q2 2017 and Q2 2018 demonstrated that increasing solar PV penetration was already
    shifting low-price periods from early morning to the middle of the day, increasing
    the frequency of pumping and generating cycles and the intra-day price spread.
  lesson_learnt: Pumped hydro feasibility models must assume that the optimal daily
    dispatch profile will shift significantly as solar penetration increases — static
    dispatch profiles calibrated on historical operating data will underestimate future
    cycle frequency and revenue from intra-day arbitrage, and the model should capture
    the evolving 'duck curve' effect explicitly.
  issue_severity: none
  project_type: storage
