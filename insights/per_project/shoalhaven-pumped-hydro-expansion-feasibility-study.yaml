  what_happened: Legislative requirements to achieve easements for the underground
    penstock traversing under Moreton National Park remained unresolved, with a legal
    premise that the park extends to unlimited depth potentially constraining the
    development. No disturbance of the surface was required, but subsurface tenure
    was not established.
  lesson_learnt: PHES developers planning underground infrastructure beneath National
    Parks must resolve subsurface tenure and easement requirements early — the legal
    question of whether a park's boundary extends to unlimited depth can block or
    materially delay development even when no surface disturbance is involved, and
    this risk is not adequately addressed by standard environmental assessments alone.
