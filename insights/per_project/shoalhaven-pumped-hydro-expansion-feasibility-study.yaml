- record_id: ARENA-DLV-14008
  source_title: Shoalhaven Knowledge Sharing Report 2
  publish_date: 2020-05
  project_name: Shoalhaven Pumped Hydro Scheme Expansion
  what_happened: Grid connection modelling for the AEMO/TransGrid Connection Approval
    was identified as more difficult than expected due to the high volume of applications
    for intermittent generation in NSW competing for system studies capacity. The
    detailed Generator and Customer Performance Standards submission was deferred
    to the ECI stage pending finalisation of key technical parameters.
  lesson_learnt: PHES developers in NSW should anticipate increased difficulty and
    lead times in completing grid connection system studies with AEMO and TransGrid
    given the high volume of competing applications. Scheduling the Performance Standards
    modelling to depend on ECI contractor inputs creates a sequential dependency that
    should be planned for explicitly in the project program.
  issue_severity: moderate
  project_type: storage
  project_scale_band: first commercial/FOAK
