  what_happened: Capital cost estimates received from shortlisted EPC providers during
    the Request for Tender process ranged from $570m to $630m — materially higher
    than the figures estimated in the Pre-Feasibility desktop study. The gap was large
    enough that Origin did not enter the full ECI process.
  lesson_learnt: Do not rely on desktop pre-feasibility cost estimates for PHES investment
    decisions. Competitive tendering from qualified EPC contractors consistently reveals
    materially higher costs driven by civil works, tunnelling complexity and exchange
    rate exposure; a full tendering or ECI process is required before capital costs
    can be considered reliable.
