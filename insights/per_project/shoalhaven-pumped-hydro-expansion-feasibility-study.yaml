  source_title: Shoalhaven Knowledge Sharing Report 1
  publish_date: '2019-02-28'
  project_name: Shoalhaven Pumped Hydro Scheme Expansion
  what_happened: The proposed development of Snowy 2.0 (2,000 MW, ~10 times the size
    of the 235 MW SPHS expansion) emerged as a direct competitive risk during the
    feasibility study. Modelling showed that if Snowy 2.0 proceeds, the SPHS expansion's
    forecast capacity factor drops from 20–25% (Reference Case) to 12–17% (Snowy Case),
    representing a material reduction in projected revenue.
  lesson_learnt: Feasibility studies for new pumped hydro projects in the NEM must
    explicitly model the impact of government-backed large-scale storage competitors
    (such as Snowy 2.0) as a downside scenario — the revenue impact of a large competitor
    entering the same market can be severe enough to determine project viability.
