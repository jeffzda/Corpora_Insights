  source_title: Shoalhaven Knowledge Sharing Report 2
  publish_date: 2020-05
  project_name: Shoalhaven Pumped Hydro Scheme Expansion
  what_happened: Battery storage was found to be increasingly competitive in FCAS
    markets, with battery FCAS supply in Q4 2019 averaging 204MW higher than Q4 2018.
    This trend was assessed as likely to put sustained downward pressure on FCAS prices,
    reducing a previously assumed revenue stream for the PHES expansion.
  lesson_learnt: PHES business cases should not rely materially on FCAS revenue —
    batteries' speed advantage and low energy requirement make them structurally better
    suited to FCAS markets, and their growing penetration is systematically compressing
    FCAS prices available to pumped hydro over the asset's 50+ year life.
