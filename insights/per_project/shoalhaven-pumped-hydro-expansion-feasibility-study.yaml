  source_title: Shoalhaven Knowledge Sharing Report 1
  publish_date: '2019-02-28'
  project_name: Shoalhaven Pumped Hydro Scheme Expansion
  what_happened: The AEMC ruled in November 2017 to align operational dispatch and
    financial settlement at five minutes from July 2021, shifting the revenue settlement
    basis for generators from 30-minute averages to 5-minute periods. Analysis by
    Origin found that in the near term this change was insufficient to alter the investment
    timing for new technologies, but in the longer term (post-2030) it would provide
    a clearer commercial signal for fast-response storage assets including pumped
    hydro.
  lesson_learnt: Pumped hydro feasibility models should explicitly account for the
    5-minute settlement transition — while the near-term revenue impact is modest,
    post-2030 valuations should reflect the enhanced signal value for fast-response
    dispatch, and modelling tools must be configured for 5-minute price forecast granularity
    rather than 30-minute averages.
