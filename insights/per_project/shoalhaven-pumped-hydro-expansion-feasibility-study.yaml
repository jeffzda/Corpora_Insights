- record_id: ARENA-DLV-14016
  source_title: Shoalhaven Knowledge Sharing Report 2
  publish_date: 2020-05
  project_name: Shoalhaven Pumped Hydro Scheme Expansion
  what_happened: The Early Contractor Involvement (ECI) contracting strategy was designed
    and assessed as the preferred delivery approach for PHES, allowing the constructor
    and OEM to collaboratively develop design, cost and risk before committing to
    a binding contract. Origin did not ultimately proceed to ECI due to unacceptably
    high pricing, but the strategy was assessed as sound for future use.
  lesson_learnt: ECI is the preferred contracting approach for PHES given the complexity
    of underground civil works and the limited contractor pool — it enables open-book
    pricing, collaborative risk allocation via a Geological Baseline Report framework,
    and value engineering before binding contract execution. Single-party ECI carries
    the risk of commitment without a finalised price, which should be managed through
    clear change management processes.
