  evidence_excerpt: As the penetration of both large scale and residential solar increases
    in the NSW energy market, low priced periods are expected to shift to the middle
    of the day. This trend is starting to become evident. Figure 2 shows Shoalhaven's
    operating profile during Q2 2018 which has pumping in both the early morning and
    during the middle of the day... Figure 2 above shows more pumping and generating
    periods than the same quarter a year prior. This is caused by Q2 2018 having a
    greater intra-day pricing spread.
  confidence_note: Transferability rated broad — the duck curve effect on storage
    dispatch profiles is a universal issue for any storage technology project in a
    high-solar penetration market, not limited to pumped hydro or NSW.
