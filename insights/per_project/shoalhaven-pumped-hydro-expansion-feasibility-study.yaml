  source_title: Shoalhaven Knowledge Sharing Report 2
  publish_date: 2020-05
  project_name: Shoalhaven Pumped Hydro Scheme Expansion
  what_happened: Spoil disposal for the estimated 260,000m³ of tunnel and cavern excavation
    presented a significant planning and cost challenge. Offsite disposal was assessed
    as potentially making the project unviable due to haulage costs and traffic impacts
    on minor roads and tourism, while onsite disposal at the previous Bendeela Pondage
    spoil area was identified as the lowest-cost viable option subject to environmental
    controls.
  lesson_learnt: Underground PHES projects in constrained locations should identify
    and pre-approve onsite spoil disposal areas during feasibility — the volume of
    excavated material from tunnels and caverns is very large, offsite disposal in
    remote areas is likely to be cost-prohibitive and community-impactful, and onsite
    reuse of previous construction spoil areas can be the project-enabling solution.
