- record_id: ARENA-DLV-14001
  source_title: Shoalhaven Knowledge Sharing Report 2
  publish_date: 2020-05
  project_name: Shoalhaven Pumped Hydro Scheme Expansion
  what_happened: Following completion of the Full Feasibility Study, Origin determined
    that the 235MW expansion of the Shoalhaven Pumped Hydro Scheme is not commercially
    feasible under current and forecast market conditions. Capital costs came in at
    $570–630m ($2.5m/MW), with annual capital charges of $170,000–$285,000/MW against
    forecast revenues of only $125,000–$165,000/MW, and the project was paused without
    reaching a Final Investment Decision.
  lesson_learnt: Pre-feasibility desktop cost estimates for PHES are likely to significantly
    understate actual capital costs — expect detailed site-specific feasibility to
    reveal materially higher civil, tunnelling and equipment costs. Financial modelling
    for PHES must stress-test against competing large-scale storage (e.g. Snowy 2.0)
    and declining FCAS revenue from battery penetration before committing to full
    feasibility expenditure.
