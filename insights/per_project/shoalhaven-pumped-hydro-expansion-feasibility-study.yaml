  project_name: Shoalhaven Pumped Hydro Scheme Expansion
  what_happened: Securing competitive debt or equity financing for the SPHS expansion
    was identified as a significant challenge, due to the combination of very long
    asset lifetimes, high upfront capital requirements, and revenue streams subject
    to considerable uncertainty — a structural financing gap for pumped hydro in the
