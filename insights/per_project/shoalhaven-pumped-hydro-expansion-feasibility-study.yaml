  what_happened: Methane was encountered during geotechnical drilling at Borehole
    3 at approximately 77m depth, constituting a near-miss safety incident. The hazard
    had been anticipated in the Project HAZID and emergency response plans were in
    place; the gas was at low pressure and dispersed naturally without further incident.
  lesson_learnt: Geotechnical investigation programs for underground PHES in the Sydney
    Basin should include methane monitoring and emergency response planning as a standard
    HAZID item — methane at low pressure can be encountered from the lower Sydney
    Basin rock sequence migrating through open joints. Pre-identification in HAZID
    and crew preparation enabled safe management of this event.
