  publish_date: '2025-07-18'
  project_name: Hydro Tasmania Community Batteries Project
  what_happened: Inconsistent fire safety and protection requirements across different
    states meant that each BESS installation required different design arrangements,
    including rules on where batteries can be sited relative to buildings. Re-certification
    was required if the battery location was changed, and fire safety compliance formed
    part of the DA process.
  lesson_learnt: Map state-specific fire safety and protection requirements for BESS
    during the feasibility phase — inconsistent standards across jurisdictions require
    bespoke designs per site and re-certification if locations change, adding cost
    and time that must be accounted for in project budgets and schedules.
