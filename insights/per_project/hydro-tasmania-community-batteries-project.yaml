  publish_date: '2025-07-18'
  project_name: Hydro Tasmania Community Batteries Project
  what_happened: Project participants encountered variable and unpredictable international
    supply chain lead times for BESS procurement, including one instance where a quality
    control issue identified during Factory Acceptance Testing caused a small shipping
    delay. Dangerous goods shipping and storage compliance was also identified as
    a requirement that was not fully anticipated at project outset.
  lesson_learnt: Build conservative lead-time buffers and contingency cashflow into
    BESS procurement schedules — international supply chains are subject to geopolitical
    and logistical volatility, and dangerous goods compliance requirements for battery
    shipments must be understood and budgeted before procurement commences.
  issue_severity: minor
  project_type: storage
  project_scale_band: commercial expansion
  lifecycle_phase: procurement
  proponent_type: project developer
