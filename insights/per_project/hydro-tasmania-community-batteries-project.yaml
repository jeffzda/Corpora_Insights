- record_id: ARENA-DLV-44464
  source_title: Hydro Tasmania Community Batteries Project - Lessons Learnt Report
    1
  publish_date: '2025-07-18'
  project_name: Hydro Tasmania Community Batteries Project
  what_happened: Project participants were required to navigate four separate commercial
    agreements, and the highly specialised industry-specific legal language presented
    barriers to understanding, with limited flexibility for risk-sharing. This required
    engagement of specialist legal expertise by battery owners, imposing costs that
    were identified as a potential barrier to participation for smaller parties.
  lesson_learnt: For multi-party ARENA projects involving community-scale or smaller
    commercial participants, share draft contract terms during the grant application
    phase and consider whether standardised, simplified agreements can reduce the
    legal cost burden — specialist legal fees on four separate agreements can be prohibitive
    for smaller battery owners.
  issue_severity: moderate
  project_type: storage
  project_scale_band: commercial expansion
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: financing/commercial close
