  failure_mode: execution & logistics
  outcome_class: delayed but recoverable
  secondary_failure_mode: poor scoping
  intervention_note: One participant managed shipping independently using their own
    freight-forwarder with FOB terms, finding that ensuring correct documentation
    was the key success factor.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: battery storage
