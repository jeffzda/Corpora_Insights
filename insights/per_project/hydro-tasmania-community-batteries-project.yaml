  publish_date: '2025-07-18'
  project_name: Hydro Tasmania Community Batteries Project
  what_happened: ARENA milestones for the project were structured so that the first
    milestone required collective deliverables from all battery owners. Some battery
    owners failed to submit their Milestone 1 deliverables on time, holding up the
    milestone submission for all project partners. Resolving the delay required significant
    stakeholder engagement and contract variations.
  lesson_learnt: Avoid structuring ARENA milestone deliverables such that all project
    partners must submit collectively — a single partner's delay holds up funding
    for all others. Structure milestones so each partner's deliverables and funding
    payments are independent, ideally tied to individual commissioning completion.
