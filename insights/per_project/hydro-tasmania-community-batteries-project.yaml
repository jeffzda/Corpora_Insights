  publish_date: '2025-07-18'
  project_name: Hydro Tasmania Community Batteries Project
  what_happened: One proposed project partner was an internationally owned business
    that required substantial time to obtain Australian company accreditation for
    ARENA funding compliance. Late in contract negotiations, this partner disclosed
    intent to use an internationally based delivery team to manage the battery installation
    remotely, which would have caused difficulties due to language barriers and unfamiliarity
    with Australian construction practice and connection approval processes. This
    partner ultimately withdrew prior to contract execution.
  lesson_learnt: For ARENA-funded projects, restrict project partners to Australian-based
    entities with an established local delivery capability — international entities
    require lengthy Australian accreditation, and remote international delivery teams
    introduce serious risks around language, local regulatory knowledge, and construction
    practice compliance.
