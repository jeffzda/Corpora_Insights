    1
  publish_date: '2025-07-18'
  project_name: Hydro Tasmania Community Batteries Project
  what_happened: One battery owner was unaware that AEMO FCAS registration requires
    a minimum of 1 MW capacity per state and asset type, and that Hydro Tasmania's
    VPP had no assets already registered in their state. As a result, FCAS revenue
    was delayed until commissioning of Stage 2 batteries, impacting revenue forecasting.
  lesson_learnt: Before finalising project revenue forecasts, verify AEMO FCAS registration
    requirements — the 1 MW minimum capacity threshold per state and asset type means
    a standalone community-scale battery may not qualify for FCAS revenue until a
    sufficient portfolio is aggregated in that state.
