- record_id: ARENA-DLV-44453
  source_title: Hydro Tasmania Community Batteries Project - Lessons Learnt Report
    1
  publish_date: '2025-07-18'
  project_name: Hydro Tasmania Community Batteries Project
  what_happened: Because DNSP connection processes require individual assessment for
    each installation regardless of similarities across sites, the project gained
    no economies of scale across its 39-battery portfolio — each site required a bespoke
    application, multiplying administrative cost and time.
  lesson_learnt: For multi-site battery programs, proponents should engage early with
    DNSPs to explore whether any form of portfolio or template application is available;
    if not, budget and schedule must account for fully bespoke assessment at each
    site with no efficiency gains from scale.
