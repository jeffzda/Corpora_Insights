  what_happened: One participant found that project reporting requirements were more
    extensive than expected and required additional resources. The misalignment between
    ARENA milestone structures and project delivery activities — for example, FAT/SAT
    milestones merging with commissioning milestones due to the participant's site
    acceptance testing approach — created cashflow complications across staggered
    multi-site deliveries.
  lesson_learnt: Before contract execution, map ARENA milestone payment triggers against
    the project's actual delivery sequence for each site — where milestones do not
    align with real delivery activities (e.g. FAT/SAT merging with commissioning),
    cashflow forecasting becomes unreliable and additional reporting resources will
    be required.
