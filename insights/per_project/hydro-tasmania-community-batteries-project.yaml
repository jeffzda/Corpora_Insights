  publish_date: '2025-07-18'
  project_name: Hydro Tasmania Community Batteries Project
  what_happened: SA Power Networks introduced a new lighter-weight control system
    (CSIP-AUS) for BESS installations between 200 kW and 500 kW, replacing the mandatory
    full SCADA requirement previously applicable at that scale. This was identified
    by project participants as a positive development that reduced connection costs
    for smaller installations.
  lesson_learnt: When planning BESS installations in SA Power Networks' jurisdiction
    at 200–500 kW scale, investigate whether CSIP-AUS applies rather than defaulting
    to full SCADA design — this can materially reduce connection costs. Monitor other
    DNSPs for adoption of similar lightweight control frameworks.
