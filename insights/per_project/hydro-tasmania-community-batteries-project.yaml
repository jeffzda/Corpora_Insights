- record_id: ARENA-DLV-44458
  source_title: Hydro Tasmania Community Batteries Project - Lessons Learnt Report
    1
  publish_date: '2025-07-18'
  project_name: Hydro Tasmania Community Batteries Project
  what_happened: Some battery owners were unaware that ARENA funding is paid in arrears
    (after commissioning), creating cashflow difficulties for project partners accustomed
    to progress payments. The cash contribution structure — where a sizeable deposit
    was required to EPC providers upon ARENA contract execution — became a terminal
    issue for some proposed battery owners due to commission batteries near the end
    of a 2-year install program, as they could not justify tying up capital for up
    to 18 months with no return.
  lesson_learnt: Clearly communicate to all project partners during the grant application
    phase that ARENA funding is paid in arrears after commissioning — partners expecting
    progress payments may face cashflow crises that force withdrawal. For multi-year
    programs, negotiate ARENA payment schedules that reduce or defer large EPC deposits
    to prevent capital lock-up of up to 18 months.
