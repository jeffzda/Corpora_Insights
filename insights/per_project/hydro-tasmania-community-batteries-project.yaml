  what_happened: One participant with multiple BESS commissioning experience found
    that integrating the proprietary Battery Management System (BMS) with FCAS and
    other control systems was a new and complex challenge, requiring significant coordination.
    The integration was ultimately successful at the first site and the system commenced
    arbitrage market operation.
