- record_id: ARENA-DLV-44472
  source_title: Hydro Tasmania Community Batteries Project - Lessons Learnt Report
    1
  publish_date: '2025-07-18'
  project_name: Hydro Tasmania Community Batteries Project
  what_happened: At a shopping centre installation site, work had to be scheduled
    around major supermarket tenant delivery cycles, requiring out-of-hours work including
    at 2:30am, and causing delays to installation works. Other sites presented physical
    access restrictions requiring modifications to installation plans.
  lesson_learnt: Before finalising installation schedules for BESS at occupied commercial
    sites, engage tenants directly to map operational constraints — tenant delivery
    schedules, trading hours, and access restrictions will determine what installation
    windows are available and must be factored into schedule and cost estimates from
    the outset.
