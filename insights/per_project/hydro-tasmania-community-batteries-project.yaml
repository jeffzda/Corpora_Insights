- record_id: ARENA-DLV-44470
  source_title: Hydro Tasmania Community Batteries Project - Lessons Learnt Report
    1
  publish_date: '2025-07-18'
  project_name: Hydro Tasmania Community Batteries Project
  what_happened: Community-scale BESS projects ($2–4M asset value) encountered insurance
    market conditions where most Industrial Special Risk (ISR) insurers focus on projects
    above $20M in value, resulting in minimum annual premiums of $25k–$50k per policy
    — a cost described as 'crippling' for a single BESS project at that scale. Some
    insurers also imposed grid-scale physical layout requirements (e.g. 1m cabinet
    spacing) that are impractical on constrained industrial sites.
  lesson_learnt: Budget conservatively for insurance costs on community-scale BESS
    projects — minimum ISR premiums of $25k–$50k/year are disproportionate to project
    value at the $2–4M scale. Investigate whether the BESS can be added to the host
    site's existing insurance policy, and consider a fleet aggregation strategy to
    spread minimum premiums across multiple assets.
  issue_severity: moderate
  project_type: storage
  project_scale_band: commercial expansion
  lifecycle_phase: operations
  proponent_type: project developer
  delay_category: null
  failure_mode: commercial & market
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: A possible mitigation identified was to include the BESS in the
    overall site insurance of the host industrial/commercial site and pay the premium
    difference to the site owner, though this had not been tested at the time of reporting.
  transferability: moderate
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id020
  - 12
  - 13
  evidence_excerpt: Minimum premiums are on the order of $25k/year per policy for
    smaller more bespoke insurers, and $50k for the larger more established insurers.
    These costs are obviously crippling for a BESS project of $2-4M.
