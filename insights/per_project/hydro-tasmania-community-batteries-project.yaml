  what_happened: Sites with existing solar PV installations required Grid Protection
    Relay (GPR) programming in a master/slave arrangement, adding complexity to BESS
    installation. Hard-wired connections between GPRs are preferred but wireless alternatives
    were required at some sites due to physical constraints.
  lesson_learnt: During site assessment for BESS installations, determine whether
    existing solar PV is present and assess GPR configuration requirements early —
    the master/slave GPR arrangement adds design and installation complexity and site
    constraints may force less preferred wireless configurations.
