  publish_date: '2025-07-18'
  project_name: Hydro Tasmania Community Batteries Project
  what_happened: Existing photovoltaic generation at some sites altered the scope
    and cost of network connection applications, as the combined generation capacity
    affected which DNSP size category the BESS application fell into.
  lesson_learnt: During BESS site feasibility, assess existing on-site PV generation
    capacity and include it in the aggregate embedded generation calculation for DNSP
    connection applications — the combined capacity may push the application into
    a higher size category with substantially greater cost and approval time implications.
