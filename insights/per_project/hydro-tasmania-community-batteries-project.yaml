- record_id: ARENA-DLV-44452
  source_title: Hydro Tasmania Community Batteries Project - Lessons Learnt Report
    1
  publish_date: '2025-07-18'
  project_name: Hydro Tasmania Community Batteries Project
  what_happened: Multiple project participants operating across different east coast
    DNSP jurisdictions encountered significantly different embedded generation size
    thresholds, terminology, processing times, and application requirements. For some
    DNSPs, a 'fee for service' model with no committed timeframes applied to applications
    above 1.5 MVA, resulting in a connection process comparable in complexity and
    cost to grid-scale battery projects despite asset sizes of 1.5–5 MVA.
  lesson_learnt: Projects spanning multiple DNSP jurisdictions must map each DNSP's
    specific size thresholds and application pathways during feasibility — the definitions
    of 'small', 'medium', and 'large' embedded generation vary widely, and crossing
    a threshold can impose grid-scale application complexity and open-ended costs
    even for community-scale BESS assets.
  issue_severity: major
  project_type: storage
  project_scale_band: commercial expansion
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: grid connection/system studies
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: poor scoping
  intervention_note: null
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id002
  - 6
  - 7
  evidence_excerpt: The result is a grid connection and site development process akin
    to that of a grid scale battery (where more complex and costly connection studies
    are required and connection timeframes are significantly longer), but for an asset
    between 1.5 MVA and 5 MVA.
