- record_id: ARENA-DLV-44451
  source_title: Hydro Tasmania Community Batteries Project - Lessons Learnt Report
    1
  publish_date: '2025-07-18'
  project_name: Hydro Tasmania Community Batteries Project
  what_happened: A project participant received a positive Site Specific Enquiry Response
    (SSER) from a DNSP, then early in the formal application process was told the
    SSER advice was incorrect and that two connection points must be combined into
    one, pushing the application into a higher capacity category. This triggered additional
    bespoke studies costing $60k–$100k, an 18–24 month approval delay, and unknown
    additional costs for protection equipment.
  lesson_learnt: Do not rely on non-binding SSER responses as indicative of final
    connection requirements — they can be reversed mid-application, triggering reclassification
    into a higher capacity category with substantially greater study costs and approval
    timelines of 18–24 months. Engage the DNSP early to understand binding thresholds
    before committing to a connection point configuration.
  issue_severity: major
  project_type: storage
  project_scale_band: commercial expansion
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: grid connection/system studies
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: coordination & stakeholders
  intervention_note: null
  transferability: broad
  delay_magnitude: 1-3 years
  technology_domain: battery storage
  source_pages: &id001
  - 6
  evidence_excerpt: Having completed the SSER process with a positive response, early
    on in the formal application assessment the DNSP notified the participant that
    their advice in the SSER process was incorrect, and that the application across
    two connection points would need to be combined into one, which would push it
    into a high capacity application category. This required additional bespoke studies
    adding $60 k - $100 k in study cost, and 18 - 24 months of application approval
    delay.
