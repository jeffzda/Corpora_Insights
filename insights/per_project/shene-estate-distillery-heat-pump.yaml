- record_id: ARENA-DLV-11013
  source_title: Renewable Energy Options for Industrial Process Heat
  publish_date: 2019-08
  project_name: Shene Estate Distillery Heat Pump
  what_happened: Shene Estate and Distillery in Pontville, TAS switched from an instantaneous electric resistance water heater to an air-to-water heat pump in 2018 after rising electricity costs made resistance
    heating uneconomic. A gas boiler was considered but rejected due to lack of grid gas connection. The heat pump delivers hot water at 65°C with a COP of 4.3, and is operated during off-peak electricity
    periods with hot water stored for later use, expected to reduce energy costs by approximately 60%.
  lesson_learnt: Heat pumps with hot water storage can reduce energy costs by approximately 60% compared to resistance heating in food and beverage applications — sites without gas grid access should evaluate
    heat pump options rather than defaulting to LPG or resistance heating.
