- record_id: ARENA-DLV-42778
  source_title: Evaluation of ARENA's VPP Portfolio
  publish_date: 2021-06
  project_name: SAPN Advanced VPP Grid Integration
  what_happened: The SAPN Master Agreement was described by the funding recipient
    as somewhat cumbersome to work through, requiring considerable effort before the
    project could commence.
  lesson_learnt: Review and streamline ARENA Master Agreement requirements for network
    business proponents — who may have different contracting norms to commercial entities
    — to reduce the time and effort required before project commencement.
