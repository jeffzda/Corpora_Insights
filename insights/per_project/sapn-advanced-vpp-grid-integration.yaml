- record_id: ARENA-DLV-42776
  source_title: Evaluation of ARENA's VPP Portfolio
  publish_date: 2021-06
  project_name: SAPN Advanced VPP Grid Integration
  what_happened: The SAPN VPP project contracted for only a single public knowledge
    sharing report due at project completion, meaning no public reports were produced
    during the trial period. This significantly impacted the timeliness and transparency
    of knowledge dissemination.
  lesson_learnt: Knowledge sharing reports should be tied to project milestones throughout
    the trial rather than deferred to project completion; a single end-of-project
    report prevents the public and industry from accessing interim findings and learning
    in real time.
