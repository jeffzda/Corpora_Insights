- record_id: ARENA-DLV-42777
  source_title: Evaluation of ARENA's VPP Portfolio
  publish_date: 2021-06
  project_name: SAPN Advanced VPP Grid Integration
  what_happened: In the SAPN VPP project, Tesla's batteries were simultaneously participating
    in the AEMO VPP Demonstrations trial, meaning they were not trading in the SAPN
    market throughout the full SAPN trial period. This was a known constraint from
    the project outset.
  lesson_learnt: When multiple concurrent VPP trials share the same battery assets,
    explicitly design for asset availability constraints in trial protocols and reporting;
    where shared assets limit one trial's data completeness, document this as a known
    limitation rather than a performance shortfall.
