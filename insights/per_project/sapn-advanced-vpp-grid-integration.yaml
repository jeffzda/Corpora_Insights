- record_id: ARENA-DLV-42775
  source_title: Evaluation of ARENA's VPP Portfolio
  publish_date: 2021-06
  project_name: SAPN Advanced VPP Grid Integration
  what_happened: The SAPN Advanced VPP Grid Integration project successfully developed
    and tested an open, IEEE 2030.5-aligned API for dynamic export limits — the first
    trial operating a VPP with Dynamic Operating Envelopes — with the API subsequently
    adopted by other projects and jurisdictions, including SAPN's own solar PV trials.
  lesson_learnt: Designing VPP infrastructure projects around open, standards-based
    APIs (e.g. IEEE 2030.5) rather than proprietary solutions maximises technology
    transferability and accelerates broader industry adoption, providing portfolio-wide
    value beyond the individual trial.
