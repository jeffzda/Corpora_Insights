- record_id: ARENA-DLV-70814
  source_title: Grid Forming Battery Webinar 23 July 2025
  publish_date: 2025-07
  project_name: Darlington Point Energy Storage System (DPESS)
  what_happened: Operational data from DPESS's first six months showed that provision
    of fast-acting voltage control services to Transgrid had 'no discernible impact'
    on the ability of the battery to participate in energy and FCAS markets.
  lesson_learnt: Fast-acting voltage control contracted to a TNSP does not materially
    constrain a GFM BESS's ability to participate in energy and FCAS markets — developers
    can model full market participation revenue without applying a significant haircut
    for voltage control service obligations when assessing project economics.
