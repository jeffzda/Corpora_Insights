- record_id: ARENA-DLV-70810
  source_title: Grid Forming Battery Webinar 23 July 2025
  publish_date: 2025-07
  project_name: Darlington Point Energy Storage System (DPESS)
  what_happened: Fast-acting voltage control services provided by DPESS to Transgrid
    alleviated one of the most binding constraints in the NEM — the transmission line
    between Darlington Point and Wagga Wagga — enabling up to 120 MW of additional
    capacity on the line when the BESS is available.
  lesson_learnt: GFM BESS fast-acting voltage control can directly unlock constrained
    transmission capacity in the NEM — location-specific system modelling should be
    used to identify and quantify this benefit during project development, as it can
    strengthen the regulatory investment test case and commercial contracting arrangements
    with the TNSP.
