- record_id: ARENA-DLV-70811
  source_title: Grid Forming Battery Webinar 23 July 2025
  publish_date: 2025-07
  project_name: Darlington Point Energy Storage System (DPESS)
  what_happened: 'DPESS was contracted under a complex multi-layered commercial structure:
    a long-term tolling arrangement with EnergyAustralia provided full operational
    rights over the BESS, while a separate agreement with Transgrid covered voltage
    support services procured via the RIT-T process. This structure added significant
    contracting complexity compared to a standard merchant BESS.'
  lesson_learnt: GFM BESS projects that stack network support services on top of merchant
    market operations require multi-party contractual frameworks that are materially
    more complex than standard BESS contracts — proponents should engage specialist
    legal and commercial advisers early and allow additional time for contracting
    when negotiating TNSP service agreements alongside tolling or offtake arrangements.
  issue_severity: moderate
  project_type: storage
  project_scale_band: utility/large-scale
  lifecycle_phase: approvals/contracting
