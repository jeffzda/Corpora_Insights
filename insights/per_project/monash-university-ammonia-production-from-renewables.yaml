- record_id: ARENA-DLV-64111
  source_title: Summary of ARENA Funded Hydrogen R&D Projects
  publish_date: 2023-04
  project_name: Monash University – Ammonia Production from Renewables
  what_happened: The Monash ammonia project spun out into Jupiter Ionics Pty Ltd, which secured over $5 million in funding to commercialise the proton shuffling system and selective electrolysis cell technology
    for ammonia synthesis.
  lesson_learnt: Targeted R&D projects with clearly differentiated technical performance — such as the near 100% Faradaic efficiency achieved in this project — are well-positioned to attract private investment
    for commercialisation; early documentation of comparative performance data strengthens the case for spin-out formation.
