  source_title: Summary of ARENA Funded Hydrogen R&D Projects
  publish_date: 2023-04
  project_name: Monash University – Ammonia Production from Renewables
  what_happened: An unintended outcome of the ammonia electrosynthesis project was the development of a new class of highly efficient electrochemical cell — the capillary-fed cell — which was subsequently
    commercialised as the Hysata startup company and attracted over $40 million in investment.
  lesson_learnt: R&D projects should document and protect unexpected technological innovations arising from their work — the capillary-fed cell concept discovered in the Monash ammonia project became a
    more commercially significant outcome than the primary research objective, demonstrating that secondary discoveries can exceed primary project value.
