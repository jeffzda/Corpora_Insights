  evidence_excerpt: In Australia, expansion and construction of first generation biofuel
    facilities were planned in 2007 as a result of government subsidies and high oil
    prices. However, many of these plans were postponed due to high feedstock prices
    and falling crude oil prices at the end of 2008. Uncertainty about future changes
    in oil and feedstock prices continues to restrict investment in new capacity.
