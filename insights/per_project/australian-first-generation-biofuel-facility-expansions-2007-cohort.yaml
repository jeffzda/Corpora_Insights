- record_id: ARENA-DLV-72034
  source_title: Australian Energy Resource Assessment — Second edition, 2014
  publish_date: '2014'
  project_name: Australian first-generation biofuel facility expansions (2007 cohort)
  what_happened: Expansion and construction of first-generation biofuel facilities
    planned in 2007 — driven by government subsidies and high oil prices — were postponed
    when feedstock prices rose sharply and crude oil prices fell at the end of 2008,
    leaving investment in new capacity constrained by ongoing price uncertainty.
  lesson_learnt: First-generation biofuel projects are highly exposed to the dual
    volatility of feedstock and crude oil prices; investment decisions made at price
    peaks can be stranded when either variable moves adversely. Project developers
    should stress-test financial cases against downside commodity scenarios before
    committing to construction.
