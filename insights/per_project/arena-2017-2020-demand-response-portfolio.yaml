  source_title: Evaluation of ARENA's 2017-2020 Demand Response Portfolio
  publish_date: 2021-06
  project_name: ARENA 2017-2020 Demand Response Portfolio
  what_happened: Controlled residential demand response (direct load control) was
    not widely adopted due to customer reluctance to relinquish control of home devices
    and the high capital cost of enabling devices, partly caused by a lack of standards
    mandating compatibility between demand response enabling devices and air conditioning
    units.
  lesson_learnt: Advocating for pragmatic interoperability standards between demand
    response enabling devices and high-load appliances (e.g. air conditioners) is
    a prerequisite for cost-effective scaled deployment of residential controlled
    load DR — without standards, hardware costs remain prohibitive and uptake stays
    low.
