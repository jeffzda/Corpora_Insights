- record_id: ARENA-DLV-42303
  source_title: Evaluation of ARENA's 2017-2020 Demand Response Portfolio
  publish_date: 2021-06
  project_name: ARENA 2017-2020 Demand Response Portfolio
  what_happened: Data collection across the portfolio was insufficiently structured;
    commercial data such as customer acquisition costs, cost to enable DR for C&I
    customers, and customer willingness to participate were not contractually required,
    leaving gaps that prevented a robust cost-benefit analysis.
  lesson_learnt: Establish data collection requirements in contracts before a funding
    round commences, specifically including commercial data (customer acquisition
    costs, retention rates, willingness to participate) — the trial's inability to
    quantify these limited the validity of the post-project cost-benefit assessment.
