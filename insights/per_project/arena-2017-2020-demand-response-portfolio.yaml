  project_name: ARENA 2017-2020 Demand Response Portfolio
  what_happened: Several funding recipients reported delays of several months — and
    in some cases up to 12–18 months — between submitting milestone or progress reports
    and ARENA publishing them on its website, with reasons for the delay unclear to
    recipients.
  lesson_learnt: Establish a defined turnaround standard for publishing milestone
    reports online; unexplained multi-month publication delays reduced momentum, created
    uncertainty for funding recipients, and undermined public interest in the portfolio.
