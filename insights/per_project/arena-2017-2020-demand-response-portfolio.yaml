  what_happened: The AEMO ten-of-ten-day baselining methodology used within the RERT
    framework was found to be potentially misleading for C&I customers with irregular
    or cyclic demand profiles (e.g. weather-dependent or shift-based operations),
    creating inaccurate baseline measurements that affected the evaluation of DR performance.
  lesson_learnt: Select or negotiate a baselining methodology suited to the demand
    profile of participating customers before trial commencement — the standard ten-of-ten
    approach is poorly suited to C&I customers with variable or cyclic load patterns
    and can undermine accurate measurement of DR response.
