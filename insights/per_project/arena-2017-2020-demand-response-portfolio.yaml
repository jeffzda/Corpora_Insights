  outcome_class: follow-on scale-up enabled
  secondary_failure_mode: null
  intervention_note: null
  transferability: broad
  delay_magnitude: null
  technology_domain: demand response
  source_pages: &id001
  - 5
  - 6
  evidence_excerpt: Based on our review and stakeholder interviews, we estimate that
    overall, the DR trial brought forward the market for DR services in Australia
    by approximately three years. Specifically, this was due to milestone deliverables
    within the trial which required participants to deploy technology at scale and
    pace. Without these milestone targets, participants stated that they would not
    have deployed at such scale and/or 'failed fast' as challenges emerged.
