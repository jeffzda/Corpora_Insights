- record_id: ARENA-DLV-42301
  source_title: Evaluation of ARENA's 2017-2020 Demand Response Portfolio
  publish_date: 2021-06
  project_name: ARENA 2017-2020 Demand Response Portfolio
  what_happened: The ARENA-funded DR trial (2017-2020) across ten projects delivered
    over 200MW of tested demand response capacity and directly accelerated the C&I
    demand response market in Australia by an estimated three years, leading to a
    competitive market that is now close to saturated in Victoria and NSW.
  lesson_learnt: Deploying capital at scale with milestone-driven deliverables is
    critical to establishing new markets — participants confirmed they would not have
    deployed at such scale or 'failed fast' without ARENA's structured funding and
    milestone targets.
  issue_severity: none
