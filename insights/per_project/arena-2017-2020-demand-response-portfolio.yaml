- record_id: ARENA-DLV-42302
  source_title: Evaluation of ARENA's 2017-2020 Demand Response Portfolio
  publish_date: 2021-06
  project_name: ARENA 2017-2020 Demand Response Portfolio
  what_happened: The trial focused exclusively on RERT as the value stream, which
    meant that wholesale market arbitrage and FCAS market benefits were not tested
    or captured in project data — despite wholesale market benefits being estimated
    to provide the greatest financial incentive for demand response.
  lesson_learnt: Design future DR trials to test multiple value streams (RERT, wholesale,
    FCAS) simultaneously; restricting a trial to a single mechanism such as RERT limits
    the data captured and may understate the economic case for the technology.
