- record_id: ARENA-DLV-42304
  source_title: Evaluation of ARENA's 2017-2020 Demand Response Portfolio
  publish_date: 2021-06
  project_name: ARENA 2017-2020 Demand Response Portfolio
  what_happened: Only one of ten projects achieved ARENA's target private-sector leverage
    ratio of 1:2 to 1:3; two projects were 100% publicly funded, and several others
    had negligible private-sector co-investment, partly because no leverage targets
    were established prior to the start of the trial.
  lesson_learnt: Establish explicit leverage targets and a portfolio assessment framework
    before commencing a funding round — the absence of pre-defined leverage targets
    meant the portfolio systematically fell short of ARENA's Performance Framework
    co-investment goals.
