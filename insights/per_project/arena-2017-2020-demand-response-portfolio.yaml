  what_happened: The overall portfolio benefit-cost ratio was estimated at 1.25 over
    the 2017–2030 modelling period, driven primarily by wholesale market benefits
    rather than RERT participation; however the CBA relied heavily on assumptions
    and benchmarks rather than directly observed project data due to insufficient
    data collection during the trial.
  lesson_learnt: Design data collection requirements to enable a robust post-project
    cost-benefit analysis from the outset — the need to rely on external benchmarks
    rather than project-specific commercial data significantly reduced confidence
    in the BCR estimate and limited the portfolio's ability to demonstrate value.
