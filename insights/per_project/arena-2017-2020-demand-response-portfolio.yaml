  project_name: ARENA 2017-2020 Demand Response Portfolio
  what_happened: Behavioural demand response (BDR) programs were not commercially
    viable as standalone products (costs outweighed revenue for retailers), but the
    trial revealed ancillary customer engagement and retention benefits that caused
    multiple retailers to transition BDR into business-as-usual activities.
