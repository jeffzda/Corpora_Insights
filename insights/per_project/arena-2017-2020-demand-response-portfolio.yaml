  what_happened: The time taken between awarding projects and executing signed funding
    agreements was considered unnecessarily lengthy; some contracts were also poorly
    structured with milestone payments not aligned to actual project delivery cycles.
  lesson_learnt: Streamline contract execution processes and align milestone payment
    timing to actual project delivery cycles before funding is announced — cumbersome
    sign-off processes and misaligned milestones created friction that required ad
    hoc ARENA flexibility (e.g. email-based milestone payment adjustments) to resolve.
