- record_id: ARENA-DLV-42335
  source_title: Evaluation of ARENA's 2017-2020 Demand Response Portfolio
  publish_date: 2021-06
  project_name: ARENA 2017-2020 Demand Response Portfolio
  what_happened: The C&I DR market in Victoria and NSW became close to saturated by
    the end of the trial, with retailers and aggregators competing to procure DR services
    from suitable C&I facilities — suggesting that the commercially attractive segment
    of the C&I DR market may be limited to a subset of larger, more predictable energy
    users.
  lesson_learnt: Future C&I DR programs should focus on testing the economics of DR
    for wholesale market participation rather than RERT, and on identifying and addressing
    the technical and commercial barriers for the next tier of C&I customers — the
    easily accessible high-DR-potential C&I segment in major NEM states appears to
    be approaching saturation.
