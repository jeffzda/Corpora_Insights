  evidence_excerpt: C&I customers often reduce their operations around extended holiday
    periods (particularly, but not only, Christmas and Easter) and this can have a
    large impact on the volume of DR capacity within a participants' portfolio. Similarly,
    the DR capability of C&I customers can vary materially by season. It may be useful
    for AEMO to request information on the DR capability of portfolios seasonally.
