- record_id: ARENA-DLV-20723
  source_title: Demand Response Short Notice RERT Trial Year 3 Report
  publish_date: 2021-10
  project_name: DR SN RERT Trial — C&I seasonal and holiday variability in DR capacity
  what_happened: Participants reported that C&I DR capacity can vary materially by
    season and is significantly reduced around extended holiday periods (particularly
    Christmas and Easter), creating predictable but underappreciated gaps in portfolio
    capacity during periods when RERT may be most needed.
  lesson_learnt: AEMO and DR aggregators should collect and track DR portfolio capacity
    on a seasonal basis rather than treating contracted capacity as constant throughout
    the year; portfolio managers should model holiday-period capacity withdrawal and
    maintain sufficient buffer to cover these predictable gaps.
