  what_happened: How third parties were to be signed up to the project became the
    single greatest sticking point in finalising the consortium agreement, requiring
    significant legal effort to resolve liability and risk allocation across the multi-party
    structure.
  lesson_learnt: Identify and resolve the third-party sign-on mechanism and associated
    liability/risk allocation before or during initial consortium agreement drafting
