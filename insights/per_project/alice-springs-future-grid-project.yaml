- record_id: ARENA-DLV-27870
  source_title: Alice Springs Future Grid Final Report
  publish_date: '2023'
  project_name: Alice Springs Future Grid
  what_happened: 'Central project management across five interdependent sub-projects
    faced a significant governance challenge: the overall Future Grid Steering Committee
    was not designed to make decisions on key strategic questions for individual sub-projects,
    forcing the Sub-project 4 working group to rely on operational-level collaboration
    without a clear escalation path for sub-project-level decisions. This contributed
    to delays and unresolved blockers.'
  lesson_learnt: Multi-sub-project programs should establish a dedicated sub-project-level
    steering committee (or equivalent decision-making forum) for each complex sub-project
    — relying solely on a portfolio-level steering committee to resolve sub-project-specific
    technical, scope, and commercial disputes creates decision-making bottlenecks
    that slow delivery.
