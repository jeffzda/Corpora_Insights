  what_happened: Tariff trial participants were required to be placed on shadow pricing
    (not billed actual trial tariff amounts) as a condition of NT Utilities Commission
    approval, limiting the ability to observe how pricing signals actually affect
    participant behaviour.
  lesson_learnt: Engage the regulator early in tariff trial design to understand what
    pricing structures will be approved; 'no worse-off' shadow pricing conditions,
    while protecting participants, may prevent observation of genuine price-signal-driven
    behaviour change and should be factored into trial evaluation design.
