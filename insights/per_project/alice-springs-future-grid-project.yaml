  source_title: 'Alice Springs Future Grid: Lessons Learnt #2 - Building a Multi-Stakeholder
    Partnership'
  publish_date: '2021-05-21'
  project_name: Alice Springs Future Grid
  what_happened: Staff turnover among consortium partner organisations was identified
    as one of the primary causes of delays to the project, disrupting continuity of
    negotiations and institutional knowledge within the partnership.
  lesson_learnt: Design consortium governance to be resilient to staff turnover —
    document institutional knowledge, maintain clear records of negotiation positions
    and decisions, and ensure handover processes are embedded in the consortium agreement
    or operating procedures.
