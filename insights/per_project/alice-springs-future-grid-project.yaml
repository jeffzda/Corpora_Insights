  what_happened: The volume of legal contracts required for the Solar Connect VPP
    was far greater than anticipated, encompassing service agreements, NDAs, data
    sharing and platform use agreements, customer trial terms and conditions, and
    inter-agency VPP operating guidelines. This required extensive engagement of external
    solicitors and added significant time and cost to the project.
  lesson_learnt: A VPP project involving multiple vendors, OEMs, a retailer, a network
    operator, and trial customers requires a contract management plan prepared before
    procurement — the complexity and volume of legal agreements (NDAs, data sharing,
    platform access, consumer rights, regulatory compliance) is routinely underestimated
    and requires dedicated legal resourcing from project initiation.
