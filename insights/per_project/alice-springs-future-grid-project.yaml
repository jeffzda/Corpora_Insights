  what_happened: There is no clear demarcation between VPP platforms and DERMS (Distributed
    Energy Resource Management Systems) in the current market, leading to significant
    potential for overlap in monitoring, analysis, decision-making, actuation, control,
    and reporting functions, creating integration challenges and intellectual property
    complications.
  lesson_learnt: Before procuring a VPP platform for a grid with existing DERMS or
    network control systems, define clearly the functional boundary between the VPP
    and the DERMS — ambiguity in this boundary leads to technical integration conflicts
    and commercial/IP tensions between vendors.
