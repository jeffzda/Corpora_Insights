  what_happened: The original Solar Hubs design — which would have clustered solar
    and battery systems on two streets around single distribution transformers, with
    households offered free batteries — was abandoned after the NT Government's Home
    and Business Battery Scheme (HBBS) increased battery uptake significantly and
    made the subsidised battery offer insufficient to direct participants to specific
    locations and battery models.
  lesson_learnt: Government subsidy schemes can rapidly change the DER market conditions
    that a trial design depends upon; build flexibility into trial structures so that
    changes in the external subsidy environment (extensions, expansions) do not require
    full rescope of the participation model.
