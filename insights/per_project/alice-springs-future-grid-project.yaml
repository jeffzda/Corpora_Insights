  project_name: Alice Springs Future Grid
  what_happened: Four to five weeks after commissioning, the main motorised circuit
    breaker on the DKP microgrid BESS failed and could not be repaired, taking the
    BESS offline. A replacement part was not available until September 2023 — approximately
    three months later — due to ongoing supply chain issues, halting the post-commissioning
    trial and data collection.
  lesson_learnt: For remote microgrid deployments, ensure critical single-point-of-failure
    components such as BESS circuit breakers have spare parts held on-site or at least
    in-country at commissioning — warranty replacement from overseas suppliers can
    take months, negating trial data collection windows.
