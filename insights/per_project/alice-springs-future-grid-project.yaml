  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated integration
  intervention_note: The project pivoted to a dynamic operating envelope approach
    using GridQube and GreenSync, which does not require aggregate control group state
    information and instead uses automated pre-programmed setpoints delivered without
    a human dispatcher.
