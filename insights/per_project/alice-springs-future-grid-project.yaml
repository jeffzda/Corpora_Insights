  source_title: Alice Springs Future Grid Final Report
  publish_date: '2023'
  project_name: Alice Springs Future Grid
  what_happened: The dynamic dispatch workstream found that a single global ramp rate
    for all setpoint transitions at a site is not appropriate — at Temple Bar, where
    a pump starting creates a 500 kW load step, the export/import following function
    needed to be extremely fast, but fallback behaviour needed to be slow to avoid
    large system-wide step changes.
  lesson_learnt: DER control systems on sites with large intermittent loads (e.g.
    pumping stations) must support multiple, independently configurable ramp rates
    for different control functions — a single universal ramp rate is too slow for
    load-following and frequency response but too fast for safe fallback, and this
    needs to be designed into the control system architecture from the outset.
