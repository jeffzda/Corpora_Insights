- record_id: ARENA-DLV-27853
  source_title: Alice Springs Future Grid Final Report
  publish_date: '2023'
  project_name: Alice Springs Future Grid
  what_happened: The existing 22kV ring main infrastructure at the Desert Knowledge
    Precinct dated from the early-to-mid 2000s and was not suited to the monitoring
    and control requirements of a modern grid-integrated microgrid. Wholesale replacement
    of key hardware (ring main units) was cost-prohibitive, forcing the project to
    abandon its goal of daily islanding and limit islanding to blackout events and
    scheduled tests only.
  lesson_learnt: Before designing a network-integrated microgrid on an existing embedded
    network, conduct a detailed condition and compatibility assessment of all existing
    MV switchgear — legacy hardware incompatible with modern control requirements
    can fundamentally constrain microgrid functionality and require expensive replacement
    that may exceed the project budget.
