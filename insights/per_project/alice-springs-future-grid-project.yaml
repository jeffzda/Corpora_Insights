  project_name: Alice Springs Future Grid - Solar Connect VPP Trial
  what_happened: The project recognised that its VPP trial design needed to separately
    account for solar-only participants (without batteries) because Alice Springs
    had far more solar-only systems than solar-plus-battery systems, and solar systems
    were having a larger aggregate impact on grid security than batteries.
  lesson_learnt: In high solar penetration environments where battery adoption lags
    solar adoption, VPP trials should include solar-only dynamic export capabilities
    — designing a trial for battery-only participants will underrepresent the dominant
    grid impact driver and miss the opportunity to test coordination of the most prevalent
    DER asset class.
