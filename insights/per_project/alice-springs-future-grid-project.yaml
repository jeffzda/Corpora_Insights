  what_happened: The DKP microgrid project discovered during commissioning that LV
    output voltages across the precinct's transformers were excessively high, potentially
    impairing the BESS's ability to operate and support the network in grid-connected
    mode. All transformer tap-change settings had to be adjusted post-commissioning.
  lesson_learnt: When deploying a BESS on an existing embedded network, survey actual
    LV output voltages at all distribution transformers during design — excessively
    high tap settings discovered only at commissioning can delay operations and compromise
    BESS grid-support capability.
