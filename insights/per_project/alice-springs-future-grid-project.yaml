- record_id: ARENA-DLV-59620
  source_title: 'Alice Springs Future Grid Project - Solar Connect VPP Trial Technical
    Report #1'
  publish_date: 2022-04
  project_name: Alice Springs Future Grid - Solar Connect VPP Trial
  what_happened: Modelling of the 7-11 tariff revealed that under VPP scheduling (where
    battery discharge is held until 7pm), the peak grid import for a household occurs
    around 5–6pm before the battery starts discharging, creating a sharper and higher
    grid import peak than under self-consumption scheduling — a potential perverse
    outcome at scale.
  lesson_learnt: VPP scheduling that holds battery discharge to align with tariff
    windows can create new grid demand peaks in the period immediately before discharge
    begins; validate scheduled battery dispatch profiles against feeder-level load
    data before trial launch, and monitor for perverse aggregate demand outcomes across
    the enrolled fleet.
