  what_happened: The project determined that FCAS provision from VPP assets is technically
    complex and difficult to obtain support for implementation; providers require
    guaranteed FCAS availability from the VPP to avoid needing to commit a machine
    generator for backup, but guaranteeing availability from aggregated DER is inherently
    uncertain.
