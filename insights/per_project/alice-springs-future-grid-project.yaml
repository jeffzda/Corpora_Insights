  what_happened: 'Sub-project 1 modelling encountered significant delays due to difficulty
    accessing whole-of-system power system models: most existing models were on older,
    encrypted model types, owned by different stakeholders (generators owning generator
    models, networks owning network models), and required substantial effort to combine
    into a single usable whole-of-system model.'
  lesson_learnt: Power system modelling programs in remote or isolated grids should
    budget additional time and establish a formal model-sharing working group before
    any modelling work begins — fragmented ownership of encrypted, outdated models
    across multiple entities is a common bottleneck that can significantly extend
    modelling timelines.
