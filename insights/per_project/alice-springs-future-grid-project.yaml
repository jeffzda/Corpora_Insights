- record_id: ARENA-DLV-27857
  source_title: Alice Springs Future Grid Final Report
  publish_date: '2023'
  project_name: Alice Springs Future Grid
  what_happened: The existing regulatory framework for network-integrated and islandable
    microgrids in the NT had not been designed with such systems in mind, creating
    barriers to deployment and restricting the ability of microgrid operators to provide
    services to the grid or on-sell power. The project had to negotiate a bespoke,
    non-standard connection process with Power and Water to enable trials.
  lesson_learnt: Early engagement with the network operator and regulator is essential
