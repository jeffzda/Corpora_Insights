  what_happened: The dynamic dispatch trial demonstrated that as the number of DER
    sites configured with communications-loss fallback to a conservative low-export
    state increases, a simultaneous communications outage affecting many sites could
    cause a large, destabilising step-change in system load.
  lesson_learnt: DER control system architects must design safe-fallback transitions
    to occur gradually (ramped) rather than instantaneously across a fleet — as the
    number of controlled DER sites scales up, a communications outage causing simultaneous
    hard fallback across hundreds of sites creates a system-level step-change risk
    that could threaten grid stability in isolated grids.
