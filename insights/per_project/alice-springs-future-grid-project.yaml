- record_id: ARENA-DLV-27869
  source_title: Alice Springs Future Grid Final Report
  publish_date: '2023'
  project_name: Alice Springs Future Grid
  what_happened: The governance structure for the Alice Springs Future Grid project
    assigned customer management responsibilities for the VPP entirely to Sub-project
    3 (ALEC) in the initial design. This proved unworkable and had to be restructured
    so that Jacana Energy retained its normal retailer function for ongoing customer
    management while ALEC handled on-the-ground recruitment and installation engagement.
  lesson_learnt: In a retailer-led VPP, the energy retailer must retain primary responsibility
    for ongoing customer communications, billing, and contract management — assigning
    these functions to a community engagement organisation without retailer standing
    creates regulatory and practical complications that require costly mid-project
    restructuring.
