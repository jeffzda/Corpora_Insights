  source_title: Alice Springs Future Grid Final Report
  publish_date: '2023'
  project_name: Alice Springs Future Grid
  what_happened: Community surveys across Alice Springs found approximately 90% of
    residents supported having more renewable energy powering the grid, and VPP participants
    rated environmental motivations (reducing carbon emissions, incorporating more
    solar) higher than economic motivations. Despite high interest, only 35% of the
    138 EOI applicants (48 of 138) ultimately participated in the VPP, with technology
    barriers (inverter incompatibility, internet access) and tenancy status (renters
    unable to install hardware) being the primary exclusion factors.
  lesson_learnt: Community appetite for DER participation is high but technical and
    tenancy barriers substantially narrow the eligible pool — VPP programs should
    conduct a detailed eligibility pre-screening of the target population before setting
    participant targets, and program design should explicitly include pathways for
    renters and low-income households to avoid systematically excluding large community
    segments.
