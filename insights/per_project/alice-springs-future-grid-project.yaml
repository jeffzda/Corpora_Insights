  project_name: Alice Springs Future Grid
  what_happened: VPP participant motivation data showed that 91% of participants rated
    environmental motivation (support for renewables) as 4 or 5 out of 5, while economic
    motivation was more distributed (61% rated 4 or 5). This indicates that in the
    Alice Springs context, environmental motivation was the dominant driver for VPP
    participation.
