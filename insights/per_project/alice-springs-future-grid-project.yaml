- record_id: ARENA-DLV-27851
  source_title: Alice Springs Future Grid Final Report
  publish_date: '2023'
  project_name: Alice Springs Future Grid
  what_happened: The BESS supply for the Desert Knowledge Precinct microgrid took
    approximately 12 months to deliver from tendering — nearly twice the six-month
    forecast — due to COVID-19-related supply chain constraints affecting the German-based
    manufacturer MTU/Rolls Royce. This pushed total time from tendering to commissioning
    to 18 months and delayed the entire project.
  lesson_learnt: Allow at least double the pre-COVID lead times for imported BESS
    hardware from European manufacturers — post-COVID supply chains remain constrained,
    particularly for remote NT sites where delays compound. Build extended procurement
    buffers into project schedules for any hardware sourced internationally.
