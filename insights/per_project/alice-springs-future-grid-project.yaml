  project_name: Alice Springs Future Grid - Solar Connect VPP Trial
  what_happened: Existing regulations in the NT were designed for traditional large
    centralised generation or for small-scale renewables used primarily for on-site
    consumption; VPPs fit neither category, creating ambiguity about applicable licensing
    requirements and barriers to entry for renewable DER providers.
  lesson_learnt: VPP regulatory frameworks in jurisdictions outside the NEM/WEM are
    immature; project teams should engage with regulators early to clarify licensing
    requirements for VPP aggregators, and anticipate that new regulatory instruments
    may need to be developed or existing ones interpreted to accommodate VPP service
    models.
