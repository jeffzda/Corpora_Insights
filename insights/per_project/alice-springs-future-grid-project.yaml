  what_happened: New energy projects funded under fixed-scope, fixed-milestone agreements
    with two federal agencies proved difficult to manage with the agile, iterative
    approach needed for trial-and-learn project delivery. Multiple contract variations
    were required primarily due to timeline challenges, and in some cases draft variations
    were superseded before approval was received due to the layered approval structure.
  lesson_learnt: Funding agreements for innovative multi-sub-project trials should
    include explicit provision for scope and timeline flexibility — rigidly structured
    milestone contracts across multiple funding bodies require repeated formal variations
    that consume management capacity and can create situations where variations are
    obsolete by the time approval is granted.
