  publish_date: 2021-05
  project_name: Alice Springs Future Grid
  what_happened: The Project Execution Workshop held in Alice Springs in August 2020
    could not be attended in person by interstate Partners due to strict Northern
    Territory border controls and COVID-19 hotspots, forcing a hybrid format with
    ~20 in-person and ~10 online attendees.
  lesson_learnt: When running multi-partner project workshops under pandemic or travel-restriction
    conditions, designate a dedicated 'online manager' role responsible for admissions,
    presentation playout, email context updates, and session notifications — without
    this role, online participants are poorly integrated and the event's collaborative
    value is diminished.
