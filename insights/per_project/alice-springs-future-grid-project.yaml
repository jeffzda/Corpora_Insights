  what_happened: A GreenSync key technical resource left the organisation during the
    dynamic dispatch project, creating a resourcing gap that delayed testing and prevented
    GreenSync from addressing several integration defects with the deX platform within
    the project timeframe. The project team (GTS) was able to continue but the final
    system only achieved 79% setpoint delivery reliability.
  lesson_learnt: When contracting specialist technology vendors for critical integration
    roles in time-constrained trials, include contractual provisions for continuity
    of key personnel or defined handover procedures — the departure of a vendor's
    sole technical resource mid-project can halt integration work entirely and leave
    defects unresolved that materially compromise trial outcomes.
