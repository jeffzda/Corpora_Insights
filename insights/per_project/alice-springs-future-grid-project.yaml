  source_title: 'Alice Springs Future Grid: Lessons Learnt #2 - Building a Multi-Stakeholder
    Partnership'
  publish_date: '2021-05-21'
  project_name: Alice Springs Future Grid
  what_happened: Partners' internal limitations — including resourcing constraints,
    competing organisational priorities, and internal approvals and governance processes
    — repeatedly slowed consortium agreement negotiations and project progress.
  lesson_learnt: Proactively assess each prospective consortium partner's internal
    capacity, governance timelines, and competing priorities before finalising partnership
    arrangements — failure to do so will result in delays driven by factors outside
    the lead organisation's control.
