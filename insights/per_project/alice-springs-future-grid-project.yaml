  project_name: Alice Springs Future Grid
  what_happened: Community 'energy literacy' in Alice Springs was found to be lower
    than assumed, with low-to-medium awareness of the complex technical and systemic
    issues of the energy transition, despite the town's history of solar projects.
    The project's communication strategy and community engagement strategy were not
    sufficiently integrated from the outset.
  lesson_learnt: Do not assume prior solar uptake in a community indicates high energy
    literacy — assess baseline understanding early and integrate the project communication
    and community engagement strategies from the start, with a clear shared message
    about why the project is needed, to achieve deeper penetration into community
    networks.
