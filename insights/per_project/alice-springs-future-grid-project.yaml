  source_title: 'Alice Springs Future Grid Lessons Learnt: Community Engagement'
  publish_date: 2023-02
  project_name: Alice Springs Future Grid
  what_happened: Door-knocking in the Solar Hub clusters yielded minimal battery installation
    uptake despite three face-to-face attempts at each house. A major barrier was
    that over a third of residents said they would lose their 1:1 Feed-in Tariff if
    they installed a battery — a concern validated shortly after when the NT Government
    replaced the 1:1 FiT with an 8.3c/kWh rate, a change that had not been signalled
    to the project team beforehand.
  lesson_learnt: Maintain close liaison with government departments so that changes
    to tariffs, rebates, or policy settings that affect participant incentives are
    known before designing or delivering community recruitment campaigns — unanticipated
    FiT changes can fundamentally undermine participation incentives.
