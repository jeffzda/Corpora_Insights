  what_happened: Initial tariff modelling estimated annual savings of approximately
    $182 (inc. GST) per year for a customer on the 7-11 tariff, but subsequent validation
    using actual customer interval data found average savings of $448 per year, with
    one out of four battery customers worse off — indicating significant variation
    across the small sample and uncertainty in projected customer returns.
  lesson_learnt: Tariff trial models based on average load profiles can significantly
    underestimate both the mean benefits and the variance of outcomes for individual
    customers; use actual interval data from a representative sample (including high-consumption
    outliers) for validation before finalising tariff structures, and include a benefits
    cap to limit financial exposure from unexpectedly high savers.
