  source_title: 'Alice Springs Future Grid - Wind Resource Monitoring Trial Technical
    Report #2'
  publish_date: 2023-09
  project_name: Alice Springs Future Grid - Wind Resource Monitoring Trial
  what_happened: The SODAR monitoring unit at Site 2 (Owen Springs Power Station)
    experienced an atypically high rate of data unavailability due to measurement
    uncertainties outside tolerance, resulting in a two-month data outage (10 May
    2022 – 10 July 2022) when the unit's E-Box (central processor) required replacement.
  lesson_learnt: Remote wind monitoring equipment in semi-arid climates should include
    redundant data-logging hardware or regular preventive maintenance schedules for
    central processors — equipment failure caused a two-month outage requiring statistical
    imputation to recover the dataset.
