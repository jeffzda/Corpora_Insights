  what_happened: The project identified that the term 'solar PV ramping limit' already
    carried connotations of limits on the rate of change of power, creating confusion
    among partners when the intended meaning was limits on the dynamic export level
    — a naming and terminology problem with material consequences for technical specification
    clarity.
  lesson_learnt: In multi-party technical projects involving new DER functions, invest
    time at the outset to agree on precise terminology for new concepts (such as dynamic
    export limits versus ramping limits) — inconsistent terminology across partners
    causes specification errors and miscommunication that can be costly to unwind
    during design or implementation.
