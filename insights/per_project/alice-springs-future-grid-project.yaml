  project_name: Alice Springs Future Grid - Solar Connect VPP Trial
  what_happened: VPP solution providers showed an apparent lack of understanding of
    power system fundamentals in isolated grids, predominantly understanding the power
    system through a market lens, making it difficult to develop solutions sensitive
    to all relevant technical network and generation considerations in the absence
    of market price signals.
  lesson_learnt: In isolated grids without market mechanisms for ancillary services,
    VPP providers cannot rely on price signals to drive operationally appropriate
    behaviour; project teams must specify technical operating requirements (e.g.,
    minimum system load management, inertia constraints) explicitly and verify provider
    capability to respond to non-market system signals before contract award.
