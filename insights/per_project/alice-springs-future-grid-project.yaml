- record_id: ARENA-DLV-27866
  source_title: Alice Springs Future Grid Final Report
  publish_date: '2023'
  project_name: Alice Springs Future Grid
  what_happened: The cluster battery trial (Solar Hub) failed to attract a single
    participant despite offering generous sign-up bonuses and bill credits. The primary
    barrier was that residents with existing grid-connected solar were unwilling to
    add batteries because doing so would cause them to lose their 1:1 feed-in tariff.
    Others were renters, moving interstate, or had incompatible inverters.
  lesson_learnt: Before designing a battery cluster trial that depends on existing
    solar households adding batteries, assess the impact of the existing feed-in tariff
    policy — a 1:1 FiT that would be lost upon battery addition is a decisive deterrent
    that negates even generous financial incentives, and tariff policy changes should
    be considered as a prerequisite rather than a parallel activity.
