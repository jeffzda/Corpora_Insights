  outcome_class: delayed but recoverable
  secondary_failure_mode: null
  intervention_note: The sub-project team compensated through weekly working group
    meetings and bi-monthly reporting to the Steering Committee, but acknowledged
    a sub-project steering committee would have produced a smoother implementation.
