- record_id: ARENA-DLV-27868
  source_title: Alice Springs Future Grid Final Report
  publish_date: '2023'
  project_name: Alice Springs Future Grid
  what_happened: Connecting a variety of inverter technologies to the VPP platform
    proved unexpectedly complex. Existing solar installer skills in core inverter
    installation did not transfer to the new field of VPP communication and connectivity,
    requiring additional training and repeat site visits. Multiple customers also
    inadvertently disconnected from the VPP by changing internet providers or experiencing
    poor connectivity.
  lesson_learnt: VPP projects that aggregate multiple inverter brands should factor
    in the additional skills gap between standard solar installation and VPP connectivity
    work — installer training, repeat site visits for connectivity issues, and ongoing
    participant communications about not disrupting VPP hardware should all be explicitly
    budgeted for. API-connected inverters require significantly less installation
    effort than hardware-dependent solutions.
