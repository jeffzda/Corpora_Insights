  source_title: Alice Springs Future Grid Final Report
  publish_date: '2023'
  project_name: Alice Springs Future Grid
  what_happened: The project found that reporting obligations to two federal funding
    agencies frequently fell due at critical times in project delivery — for example,
    ARENA final reporting was required at the same time as the Solar Connect VPP activities
    were concluding. This created resource competition between delivery teams and
    reporting, removing the end-of-project buffer that had originally been planned.
  lesson_learnt: When designing multi-funder project timelines, explicitly build a
    1–3 month buffer between completion of the last major delivery activity and final
    reporting obligations to funders — this buffer is routinely consumed by delivery
    overruns and without it, reporting and delivery compete for the same resources
    at the worst possible time.
