- record_id: ARENA-DLV-59630
  source_title: 'Alice Springs Future Grid Project - Solar Connect VPP Trial Technical
    Report #1'
  publish_date: 2022-04
  project_name: Alice Springs Future Grid - Solar Connect VPP Trial
  what_happened: The project found that separating the function of calculating dynamic
    export limits from the function of implementing them (with limits published on
    a web API polled by the VPP every 5 minutes) enabled a flexible architecture where
    the VPP service provider could be replaced without involving the network operator,
    and reduced cyber-security risks by limiting external access to network control
    systems.
  lesson_learnt: For dynamic export limit implementations in VPP trials, adopt an
    architecture that separates limit calculation (by the network operator or analytics
    service) from limit implementation (by the VPP/aggregator via a public web API)
    — this reduces integration complexity, supports vendor substitution, and limits
    cyber exposure of network control systems.
