  publish_date: 2022-04
  project_name: Alice Springs Future Grid - Solar Connect VPP Trial
  what_happened: Growing rooftop solar penetration in Alice Springs (from 2 installations
    to ~2,700 over approximately 13 years) is driving daytime net load below minimum
    stable generation thresholds and creating voltage management challenges, requiring
    urgent development of DER coordination tools to maintain grid security.
  lesson_learnt: Jurisdictions experiencing rapid behind-the-meter solar uptake should
    proactively develop DER coordination frameworks (including dynamic export limits,
    VPP capability, and DERMS) before minimum stable load constraints become binding
    — waiting until the constraint is binding significantly compresses the timeline
    and increases risk of disorderly DER integration.
