  what_happened: The VPP tariff design prioritised grid outcomes (managing minimum
    system demand) over consumer outcomes, and customer research and market validation
    were not conducted before the tariff was launched. Anecdotal feedback in late
    2022 revealed that some participants found the 7-11 tariff overnight battery discharge
    pattern contrary to their expectations about how their battery should be used.
  lesson_learnt: VPP tariffs should be co-designed with a sample of target customers
    before launch — designing tariffs primarily around grid objectives without testing
    assumptions with consumers risks misalignment with customer expectations, low
    engagement, and the need for mid-trial tariff changes that add complexity and
    cost.
