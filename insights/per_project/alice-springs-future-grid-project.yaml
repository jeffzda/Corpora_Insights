  project_name: Alice Springs Future Grid - Solar Connect VPP Trial
  what_happened: Analysis of Tesla Powerwall 2 interval data revealed that batteries
    in the 7–14 kWh range typically completed their charge cycle by or before midday,
    well before the minimum system load event (11am–1:30pm), then caused a sharp jump
    in site export upon completion of charging — the opposite of the desired system
    behaviour.
  lesson_learnt: Battery sizing and charge scheduling must be designed together; batteries
    that self-optimise for household economics (starting charge as soon as solar exceeds
    load) will complete charging before the system minimum load window, providing
    no hosting capacity benefit — time-varying tariffs or VPP scheduling are required
    to shift charging into the minimum load period.
