- record_id: ARENA-DLV-27875
  source_title: Alice Springs Future Grid Final Report
  publish_date: '2023'
  project_name: Alice Springs Future Grid
  what_happened: The forecasting sub-project (SP5.1) found that voltage has a significant
    and previously underestimated impact on behind-the-meter solar generation output
    — often as large as irradiance effects — but was initially excluded from the forecasting
    model because it is highly localised and non-linear. Incorporating live inverter
    telemetry was required to properly account for voltage-induced solar curtailment
    in forecasts.
  lesson_learnt: Solar generation forecasting models for high-penetration distributed
    PV grids must explicitly account for voltage-induced curtailment — models built
    on weather and irradiance data alone will systematically overestimate generation
    output during high-voltage midday periods; real-time inverter telemetry integration
    is required to close this gap.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Once inverter telemetry from Redback systems was integrated into
    Proa Analytics' model, the short-term solar forecast used live PV data to adjust
    the effective derating of the embedded generation forecast in real-time, improving
    forecast accuracy at the 30-minute horizon by approximately 10%.
  transferability: moderate
  delay_magnitude: not quantified
