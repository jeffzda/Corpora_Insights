- record_id: ARENA-DLV-59615
  source_title: 'Alice Springs Future Grid Project - Solar Connect VPP Trial Technical
    Report #1'
  publish_date: 2022-04
  project_name: Alice Springs Future Grid - Solar Connect VPP Trial
  what_happened: The small scale of the Alice Springs VPP trial and the wide variety
    of battery products and household circumstances meant statistical significance
    was unlikely to be achieved for any battery type or size, limiting the ability
    to draw generalisable conclusions from trial results.
  lesson_learnt: When designing DER trials in small grids, explicitly scope the statistical
    analysis plan before launch; if sample sizes are insufficient for statistical
    significance, pre-specify that the trial will generate directional insights and
    qualitative lessons rather than statistically robust conclusions, so stakeholder
    expectations are managed.
