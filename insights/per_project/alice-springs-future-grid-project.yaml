  project_name: Alice Springs Future Grid
  what_happened: The Sub-project 5.3 dynamic dispatch workstream found that its original
    DER front-end concept — using the SwitchDin VPP to provide aggregate accounting
    of a control group's current and potential output — was not viable because StormCloud
    control groups could not provide current or potential output in either direction,
    causing groups to consistently underdeliver when dispatched in tests.
  lesson_learnt: Before designing a DER dispatch system that relies on a VPP platform
    to provide real-time aggregate state information (current output, potential output,
    state of charge) to guide dispatcher decisions, verify that the VPP platform can
    actually provide this data — many commercially available VPP platforms cannot,
    and this capability gap will negate the dispatch concept.
