    project but the majority pulled out mid-way through the installation phase, citing
    being time-poor and having difficulty recruiting staff. This significantly contributed
    to delays at the installer and VPP-droplet installation stages.
  lesson_learnt: Assess the capacity of the local installer workforce before designing
    a VPP rollout that depends on them — in small regional towns, installer scarcity
    is a binding constraint, and workforce shortfalls will cause schedule delays.
    Consider strategies to increase installer capacity or reduce site-visit burden
    (e.g. allowing installers to act as agents) before launch.
