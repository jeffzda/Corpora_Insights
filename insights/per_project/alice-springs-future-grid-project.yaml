  what_happened: Despite a $6,000 government battery subsidy (HBBS), more than 90%
    of new solar customers in Alice Springs chose not to install a battery, and those
    who did tended to choose the smallest eligible battery size, limiting the grid
    benefits of battery uptake.
  lesson_learnt: Capital subsidies alone are insufficient to drive battery uptake
    at scale or to drive optimal battery sizing; revenue-based incentives (such as
    time-varying tariffs with higher feed-in rates during peak periods) and improved
    battery business cases through VPP participation credits are required to achieve
    both uptake and right-sizing for grid benefit.
