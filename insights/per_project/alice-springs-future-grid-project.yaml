- record_id: ARENA-DLV-59622
  source_title: 'Alice Springs Future Grid Project - Solar Connect VPP Trial Technical
    Report #1'
  publish_date: 2022-04
  project_name: Alice Springs Future Grid - Solar Connect VPP Trial
  what_happened: The Alice Springs grid's isolation and small scale (52 MW peak) results
    in fewer generation and storage options, no large flexible industrial loads, minimum
    stable generation requirements, and greater variability from relatively undiversified
    solar — making it significantly more challenging to integrate high penetrations
    of DER than larger interconnected systems.
  lesson_learnt: Small isolated grids have compounding integration challenges not
    present in interconnected systems; DER integration projects in such grids should
    explicitly scope the additional complexity of minimum stable load management,
    voltage control, inertia provision, and the absence of interconnector flexibility
    — and these constraints should drive VPP functional specifications.
