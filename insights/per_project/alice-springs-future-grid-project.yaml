  source_title: 'Alice Springs Future Grid Project - Solar Connect VPP Trial Technical
    Report #1'
  publish_date: 2022-04
  project_name: Alice Springs Future Grid - Solar Connect VPP Trial
  what_happened: The VPP trial design was structured to deliver a 'no worse-off guarantee'
    requiring shadow pricing, which was a condition of the Utilities Commission's
    approval; this regulatory constraint was identified as potentially limiting retail
    revenue signals and hence the retailer's ability to accurately observe the effects
    of the battery tariff combination as a driver of behaviour change.
  lesson_learnt: When seeking regulatory approval for innovative tariff trials, explicitly
    negotiate whether shadow pricing is required — if so, design supplementary data
    collection methods (e.g., stated preference surveys, controlled cohort comparisons)
    to observe behaviour change that pure shadow pricing cannot capture.
