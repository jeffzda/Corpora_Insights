  source_title: Alice Springs Future Grid Final Report
  publish_date: '2023'
  project_name: Alice Springs Future Grid
  what_happened: The StormCloud VPP platform was developed for NEM applications and
    did not align with the specific technical requirements of the NT power system.
    OEM API constraints also restricted the range of functionalities that could be
    controlled through API integrations, preventing delivery of Milestone 6 (automated
    export control via PWC dispatch front-end) within the project timeframe.
  lesson_learnt: When procuring an off-the-shelf VPP platform for an isolated non-NEM
    grid, explicitly verify during procurement that the platform can meet the specific
    technical requirements of the target power system — NEM-designed platforms may
    not support the operational parameters, system security requirements, or dispatch
    protocols of stand-alone grids without significant bespoke development.
