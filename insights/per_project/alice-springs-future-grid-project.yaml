  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: network business
  delay_category: null
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: The project accepted the constraint and redefined islanding as
    a UPS function (network blackout only) rather than daily operation, preserving
    most of the value while avoiding prohibitive hardware replacement costs.
  transferability: moderate
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id024
  - 17
  evidence_excerpt: The existing 22kV ring main...consists of hardware and equipment...that
