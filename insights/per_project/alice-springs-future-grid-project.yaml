  publish_date: '2021-05-21'
  project_name: Alice Springs Future Grid
  what_happened: The number of organisations involved in the consortium directly multiplied
    legal complexity and cost — each additional partner introduced additional lawyers,
    additional internal governance processes, and additional approval chains that
    had to be navigated before the agreement could be executed.
  lesson_learnt: When forming a multi-stakeholder consortium, recognise that each
    additional organisation adds lawyers, complexity, and elapsed time — conduct a
    deliberate trade-off between breadth of partnership and manageability of the legal
    and governance burden before committing to a partner count.
