  source_title: 'Alice Springs Future Grid - Wind Resource Monitoring Trial Technical
    Report #2'
  publish_date: 2023-09
  project_name: Alice Springs Future Grid - Wind Resource Monitoring Trial
  what_happened: The BOM ground-based weather station adjacent to Alice Springs Airport
    recorded a statistically anomalous volume of 0 m/s readings in 2022, making its
    dataset unsuitable for use as a long-term reference in interannual variance analysis.
    The project team was in consultation with BOM but had not resolved a suitable
    approach at time of reporting.
  lesson_learnt: Wind resource studies relying on third-party meteorological reference
    datasets should validate data quality — including screening for anomalous zero-wind
    readings — before committing to a reference source; having an alternative dataset
    (e.g. satellite-derived) available avoids project delay when a preferred source
    proves unusable.
