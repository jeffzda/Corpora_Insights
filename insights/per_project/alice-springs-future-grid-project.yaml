  source_title: 'Alice Springs Future Grid: Lessons Learnt #2 - Building a Multi-Stakeholder
    Partnership'
  publish_date: '2021-05-21'
  project_name: Alice Springs Future Grid
  what_happened: Developing the consortium agreement for the Alice Springs Future
    Grid project took nine months to execute, requiring extensive legal work, multiple
    rounds of negotiation, and weekly meetings with lawyers and partners across numerous
    organisations.
  lesson_learnt: Budget adequate time and legal resources for multi-stakeholder consortium
    agreement development — despite being considered relatively quick, the Future
    Grid agreement took nine months, and every change to the agreement added approximately
    one week of delay and additional legal expense.
