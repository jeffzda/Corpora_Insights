  source_title: 'Alice Springs Future Grid Lessons Learnt: Community Engagement'
  publish_date: 2023-02
  project_name: Alice Springs Future Grid
  what_happened: Of 130 applications to join the Solar Connect VPP trial, only 50%
    were deemed eligible and 55 contracts were issued. The small pool of eligible
    households (approximately 120 batteries installed town-wide at commencement) and
    the 50% conversion rate meant the trial cohort was significantly smaller than
    anticipated.
  lesson_learnt: Before launching community-facing VPP recruitment, assess the local
    installed base of eligible technology — if the eligible pool is too small, broad-focus
    promotion will yield poor conversion and waste engagement resources. Targeted
    outreach to verified eligible households (e.g. via installers) is more effective
    than general campaigns.
