- record_id: ARENA-DLV-59629
  source_title: 'Alice Springs Future Grid Project - Solar Connect VPP Trial Technical
    Report #1'
  publish_date: 2022-04
  project_name: Alice Springs Future Grid - Solar Connect VPP Trial
  what_happened: The project identified that multi-objective optimisation of VPP operations
    — balancing FCAS provision, voltage management, demand response, tariff optimisation,
    and customer self-interest — is inherently complex and that existing VPP platforms,
    optimised for market price signals, do not natively handle non-market system objectives.
  lesson_learnt: VPP operational dispatch logic must explicitly address the hierarchy
    of competing objectives (system security > network constraint management > ancillary
    services > tariff arbitrage > customer self-consumption) and this hierarchy must
    be specified in the functional requirements before platform procurement — vendors
    will not design for non-market objectives unless explicitly required to.
