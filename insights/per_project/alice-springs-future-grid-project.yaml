  project_name: Alice Springs Future Grid
  what_happened: During commissioning of the DKP microgrid, 4G signal strength at
    the BESS location was variable and at times poor, threatening reliable control
    and communications for the microgrid system.
  lesson_learnt: Do not rely solely on commercial 4G mobile networks for microgrid
    control communications in remote or peri-urban NT sites — signal quality can be
    poor and deteriorating. Plan for a wired backup (fibre optic) connection from
    the outset and install high-gain antennas where mobile connectivity is the primary
    link.
