  source_title: Alice Springs Future Grid Final Report
  publish_date: '2023'
  project_name: Alice Springs Future Grid
  what_happened: Industrial action by Power and Water line workers disrupted MV upgrade
    works at the DKP precinct on three occasions where pre-scheduled disconnections
    from the Alice Springs grid were required. Each time, disconnection either did
    not happen or was delayed without advance notice, causing project delays and additional
    costs.
  lesson_learnt: When scheduling MV grid disconnection works that depend on the network
    operator's line workers, build in contingency dates and establish early-warning
    protocols with the DNSP for any planned industrial action — unannounced industrial
    stoppages can repeatedly derail critical-path disconnection windows in remote
    NT projects.
