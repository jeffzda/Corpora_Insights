  what_happened: The Alice Springs power system modelling (Amplitude ESS study) found
    that the system is presently operating at considerable risk of blackout under
    lower demand conditions when it cannot be operated in a secure state. If BTM PV
    continues to grow without new loads, without ESS investment, or without controlled
    connections becoming standard, the power system could become potentially inoperable
    around 2026.
  lesson_learnt: Isolated grid operators with high BTM solar penetration must urgently
    model contingency scenarios under minimum demand conditions — the combination
    of rapid BTM PV uptake and planned retirement of synchronous plant can create
    a grid security crisis within a 2–3 year horizon that requires proactive investment
    in grid-forming BESS, synchronous condensers, and mandatory DER control standards.
