  what_happened: When the Sub-project 5 DER Front End was replaced with a different
    technology solution (an API Manager via GreenSync), the change was not concluded
    in time for Sub-project 4 to meet its VPP platform integration milestone (Milestone
    6), as the API Manager was procured several months after the VPP platform contract
    had already been established.
  lesson_learnt: In multi-sub-project programs, technical dependencies between sub-projects
    must be continuously monitored and formally flagged in contract milestones — when
    one sub-project replaces a contracted deliverable that another sub-project's milestone
    depends on, the downstream contract milestone should be renegotiated immediately
    to avoid an undeliverable obligation.
