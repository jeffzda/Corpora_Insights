- record_id: ARENA-DLV-27860
  source_title: Alice Springs Future Grid Final Report
  publish_date: '2023'
  project_name: Alice Springs Future Grid
  what_happened: The VPP technical specifications were not clearly defined at the
    outset, leading to persistent misunderstandings between sub-project partners about
    what outcomes could be delivered within scope, timeline, and budget. Evaluating
    contract performance was difficult because parties had different interpretations
    of inclusions and exclusions. The VPP product ultimately did not meet system operator
    requirements for seamless, safe, and reliable interfacing with the power network.
  lesson_learnt: Before procuring a VPP platform, establish a precisely written Minimum
    Viable Product scope with explicit technical inclusions and exclusions agreed
    by all parties — ambiguous specifications in a multi-stakeholder environment lead
    to protracted renegotiations, scope creep, and contract delivery disputes that
    delay the entire project.
