  source_title: Alice Springs Future Grid Final Report
  publish_date: '2023'
  project_name: Alice Springs Future Grid
  what_happened: The Sub-project 5.2 dynamic export trial successfully demonstrated
    that a low-cost commercial control device (ComAp InteliGateway, under $5,000 installed)
    could enable dynamic export from commercial solar sites that would otherwise be
    limited to zero export, allowing negotiation of larger solar connections with
    export permissions that would normally be impossible for systems over 30 kVA.
  lesson_learnt: For commercial solar sites constrained to zero-export by the network
    operator, a sub-$5,000 control device with dynamic export capability can unlock
    viable export revenue and deliver a commercially attractive payback period — this
    pathway is likely transferable to any comparable isolated grid and should be considered
    as standard practice for commercial solar installations above 30 kW.
