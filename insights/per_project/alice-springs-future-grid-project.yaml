  project_name: Alice Springs Future Grid - Solar Connect VPP Trial
  what_happened: In tariff design, a necessary trade-off was identified between simplicity
    for the end-consumer and accurately conveying price signals that reflect system
    conditions; the working group opted for simplicity (a uniform year-round tariff
    with 7am–11pm peak periods) over accuracy (seasonally varying tariffs or shoulder
    periods that better matched actual system peak times).
  lesson_learnt: Tariff trials targeting behaviour change should explicitly document
    simplicity-versus-accuracy trade-offs; where simplicity is chosen, model whether
    the simplified tariff still delivers sufficient price signal to achieve system
    objectives — in this case, modelling confirmed the year-round 7-11 tariff achieved
    priority outcomes despite some timing mismatch with actual system peaks.
