  publish_date: 2022-04
  project_name: Alice Springs Future Grid - Solar Connect VPP Trial
  what_happened: Alice Springs lacks open markets for ancillary services (FCAS is
    provided at a flat rate of $5.93/MWh), making it difficult to value DER services
    or access those value streams through normal VPP commercial models.
  lesson_learnt: In isolated grids without competitive ancillary services markets,
    VPP business cases cannot rely on market revenue streams available in the NEM
    or WEM; alternative payment mechanisms (e.g., direct contracts, subsidy performance
    requirements, dynamic operating envelope allocation) must be designed into the
    project from the outset.
