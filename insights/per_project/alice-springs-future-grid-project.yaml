  what_happened: Demonstrating FCAS response from VPP assets in a trial context requires
    high-speed metering and an incidental frequency event to occur, making it difficult
    to plan, measure, and report on FCAS delivery as part of a structured trial.
  lesson_learnt: FCAS capability trials should include high-speed metering as a baseline
    requirement and consider a controlled test event (coordinated with the system
    operator) rather than relying on an incidental frequency event — without this,
