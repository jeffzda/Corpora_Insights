  source_title: Alice Springs Future Grid Final Report
  publish_date: '2023'
  project_name: Alice Springs Future Grid
  what_happened: The dynamic dispatch trial confirmed the value of using a centralised
    data historian (Power and Water's AVEVA PI System) as the integration hub for
    all DER data sources, rather than pursuing bespoke point-to-point integrations
    between vendors. Inverter telemetry brought into PI could be used for forecasting,
    power quality assessment, safety checks, DOE calculations, and compliance — making
    each data source reusable across multiple purposes.
  lesson_learnt: DER management architectures should be designed around a centralised
    data historian (such as AVEVA PI) as the primary integration layer — this approach
    minimises the number of bespoke vendor integrations, makes data available for
    multiple use cases (forecasting, compliance, DOE, safety), and reduces the risk
    that replacing one modular component breaks the broader system.
