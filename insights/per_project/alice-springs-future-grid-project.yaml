  what_happened: VPP technology developers in the commercial market tend to prefer
    controlling as much of the technology ecosystem as possible, and API-integrated
    OEMs signalled that while they would permit the project's arrangements short-term,
    their long-term strategy was to self-aggregate — creating a risk of future platform
    lock-in.
