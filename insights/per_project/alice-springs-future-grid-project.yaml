  what_happened: Wind and solar generation profiles in Alice Springs were found to
    exhibit measurable diurnal complementarity — wind generation peaks in the late
    afternoon and evening when solar generation diminishes, and on windy days solar
    generation is reduced while wind generation increases substantially.
