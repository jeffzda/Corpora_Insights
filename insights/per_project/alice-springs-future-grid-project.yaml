  evidence_excerpt: At Temple Bar it was very apparent that a single ramp rate for
    all setpoints was not appropriate and there needs to be different ramp rates for
    different parameters. For this particular application of responding to frequency
    deviations, a very fast response (e.g. <2 s) would be desirable. Load following
    at Temple Bar also needed to be extremely fast since the pump switching stages
