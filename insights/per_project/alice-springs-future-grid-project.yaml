  what_happened: During the dynamic export trial at Centralian Senior College, the
    power factor correction (PFC) unit required by the Network Technical Code operated
    in potential conflict with the Volt-VAr response from the solar inverters — PFC
    supplies VArs to improve power factor at the site level while inverters absorb
    VArs to lower voltage at the point of connection. The NTC requirement for perpetual
    PF of 0.9+ may not be appropriate in high-voltage scenarios.
  lesson_learnt: When connecting solar systems with modern Volt-VAr inverter response
    modes, review whether the Network Technical Code's blanket power factor correction
    requirement is compatible with modern inverter voltage management — perpetual
    PF correction can directly conflict with inverter Volt-VAr response and undermine
    voltage management outcomes in high-voltage distribution networks.
