- record_id: ARENA-DLV-36263
  source_title: 'Alice Springs Future Grid Lessons Learnt: Community Engagement'
  publish_date: 2023-02
  project_name: Alice Springs Future Grid
  what_happened: Local solar installers were a critical interface between the VPP
    project and the community, yet the project did not initially structure their role
    to maximise this. Installers were the formal source for 7% of trial participants,
    but were likely responsible for significantly more through word-of-mouth, and
    each participant required two separate installer site visits under the project
    structure.
  lesson_learnt: Structure the installer relationship as a primary community recruitment
    and delivery channel from project inception — allow installers to act as agents
    who can qualify and enrol participants in a single visit, reducing project cost
    and improving the participant experience in small regional markets where installers
    are trusted advisors.
