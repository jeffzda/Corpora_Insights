- record_id: ARENA-DLV-27876
  source_title: Alice Springs Future Grid Final Report
  publish_date: '2023'
  project_name: Alice Springs Future Grid
  what_happened: The forecasting sub-project attempted to create feeder-level solar
    and demand forecasts, but this was unachievable because load switching between
    feeders is done manually and is not recorded in a data format that could be integrated
    with the forecasting model. Grouping by substation also failed due to the possibility
    of open points being fed from multiple feeders.
  lesson_learnt: Granular feeder-level forecasting for active distribution networks
    requires a digital record of all manual switching events in a machine-readable
    format — without this, any attempt to disaggregate network-level forecasts to
    feeder level is fundamentally unviable regardless of the quality of the forecasting
    algorithm.
