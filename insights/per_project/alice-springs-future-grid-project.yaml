  project_name: Alice Springs Future Grid - Wind Resource Monitoring Trial
  what_happened: System optimisation modelling for a 50% renewable energy scenario
    in Alice Springs in 2030 found that including 15 MW of wind generation produced
    the lowest present value cost of $171m, compared to $187m with zero wind — a $16m
    saving — despite wind's high standalone LCOE, because wind's diurnal profile complements
    solar and reduces battery storage requirements.
  lesson_learnt: In isolated grids with high solar penetration, wind generation can
    reduce total system cost even when its standalone LCOE is high — whole-of-system
    optimisation modelling should be used rather than LCOE alone when evaluating the
    inclusion of wind in remote renewable energy systems.
