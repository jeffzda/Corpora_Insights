    spanning the Northern Territory and interstate Australia, relying on deep face-to-face
    collaboration — a dependency that became a structural vulnerability when COVID-19
    travel restrictions were imposed.
  lesson_learnt: When designing large multi-organisation projects that span jurisdictions,
    build explicit redundancy into the collaboration model from the outset — a project
    structure that is wholly dependent on in-person interaction across state borders
    is fragile to travel restrictions and should have pre-planned remote-engagement
    protocols.
