  source_title: RayGen Solar Power Plant Demonstration Project Lessons Learnt 2
  publish_date: null
  project_name: RayGen Solar Power Plant – Phase Three A
  what_happened: COVID-19-related labour market impacts — including closed borders
    and government stimulus packages — caused a skills and labour shortage that constrained
    RayGen's PV Ultra module production at a time when internal demand was increasing,
    with new hires requiring a learning curve that reduced manufacturing yield.
  lesson_learnt: For manufacturing-intensive projects, design production processes
