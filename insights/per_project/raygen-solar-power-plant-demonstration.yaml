- record_id: ARENA-DLV-26706
  source_title: RayGen Solar Power Plant Demonstration Project Lessons Learnt 2
  publish_date: null
  project_name: RayGen Solar Power Plant – Phase Three A
  what_happened: The wholesale electricity market lacked a standard product for a
    dispatchable generator providing peak evening generation, forcing RayGen to work
    around existing proxies ('inverted solar curve' and TB4 arbitrage products) that
    were not widely accepted by offtakers and financiers due to their complexity and
    dependence on granular spot-market forecasts.
  lesson_learnt: Developers of dispatchable storage-plus-generation technologies should
    anticipate the absence of standardised wholesale market products and engage early
    with retail market proxies — RayGen found that framing output as a 'peak' retail-equivalent
    contract (100% export capacity every weekday peak period) was more commercially
    viable than bespoke wholesale products that counterparties were unwilling to underwrite.
