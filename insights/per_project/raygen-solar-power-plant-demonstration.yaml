  publish_date: 2024-10
  project_name: Solar Power Plant One (SPP1) – Carwarp, Victoria
  what_happened: RayGen adopted a deliberate 'scale-out' rather than 'scale-up' commercialisation
    strategy for PV Ultra, keeping component unit sizes (heliostats, modules, receivers,
    towers) constant across projects and increasing project capacity by adding more
    identical modular units rather than redesigning larger components for each successive
    project.
  lesson_learnt: For FOAK hardware technologies, a 'scale-out' strategy — deploying
    more identical modular units rather than redesigning larger ones for each project
    — reduces FOAK-to-commercial-scale transition risk, enables supply chain unit
    cost learning curves, and preserves repeatability of installation learnings across
    projects.
