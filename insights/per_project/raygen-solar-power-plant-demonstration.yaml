  source_title: RayGen - Solar Power Plant Demonstration Project - Development Report
  publish_date: 2024-10
  project_name: Solar Power Plant One (SPP1)
  what_happened: Commissioning the chiller system to respond to an active power setpoint
    — rather than a specified cooling effect — was technically novel and required
    significant tuning of control loops before consistent performance was achieved.
  lesson_learnt: When a chiller is required to operate as a grid-responsive scheduled
    load, anticipate that standard chiller control logic (which targets a cooling
    effect, not an active power level) will need substantial custom tuning — allocate
    dedicated commissioning time and control-engineering resource for this.
