  lifecycle_phase: approvals/contracting
  proponent_type: technology vendor
  delay_category: financing/commercial close
  failure_mode: commercial & market
  outcome_class: re-scoped/adapted
  secondary_failure_mode: coordination & stakeholders
  intervention_note: RayGen developed a 'peak' generator contract — committing to
    export at 100% capacity for every weekday peak period (~4PM–9PM) — as a commercially
    viable alternative to non-standard wholesale products.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hybrid systems
  source_pages: &id027
