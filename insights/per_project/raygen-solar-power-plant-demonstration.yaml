    plants to capture their true value to the system is critical. This means being
    rewarded not only for energy and capacity offerings, but for essential system
    services, grid de-congestion and transmission deferral and the 'insurance' value
    uniquely offered by 12-24 hours storage technologies. Government initiatives,
    such as the Capacity Investment Scheme, must be designed with long-term energy
    market transition in mind.
