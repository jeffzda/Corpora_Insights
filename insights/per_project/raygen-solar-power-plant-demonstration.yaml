- record_id: ARENA-DLV-29609
  source_title: RayGen - Solar Power Plant Demonstration Project - Manufacturing Report
  publish_date: 2024-10
  project_name: RayGen Solar Power Plant Demonstration Project - Module Manufacturing
    Line
  what_happened: RayGen estimated that a future 1GW Module Manufacturing Line would
    cost approximately $40m to build (including specialist equipment and cleanroom
    within an established ~4,000m² facility), with a project duration of 2.5 years
    through to end of commissioning — representing a capital cost of $40/W of annual
    capacity, compared to approximately $48/W achieved for the 170MW line.
  lesson_learnt: Reference-class estimates for novel manufacturing scale-up should
    capture the per-unit capital cost trajectory across successive generations — RayGen's
    progression from 170MW ($48/W) to projected 1GW ($40/W) demonstrates meaningful
    but moderate economies of scale in cleanroom manufacturing, informing cost forecasts
    for future gigawatt-scale renewable manufacturing facilities.
