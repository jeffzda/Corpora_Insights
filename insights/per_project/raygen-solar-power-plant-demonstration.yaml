- record_id: ARENA-DLV-26707
  source_title: RayGen Solar Power Plant Demonstration Project Lessons Learnt 2
  publish_date: null
  project_name: RayGen Solar Power Plant – Phase Three A
  what_happened: Markets and regions that accelerated solar deployment without co-locating
    storage experienced severe consequences including wild price swings, collapsing
    reliability, and congestion/curtailment exceeding 20%, demonstrating that new
    transmission investment in renewable energy zones is under-utilised by low-capacity-factor
    solar without storage.
  lesson_learnt: Prioritise development of long-duration energy storage (LDES) within
    renewable energy zones — regulators and transmission planners are increasingly
    mandating storage to justify REZ transmission investment (e.g. NSW LTESA), and
    projects that co-locate LDES with generation are better positioned to secure regulatory
    support, offtake, and network utilisation than solar-only projects.
