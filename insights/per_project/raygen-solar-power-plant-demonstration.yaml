  what_happened: SPP2 cost estimates of A$749–826 million for a remote South Australian
    site reflect a significant remote-location cost premium due to high labour rates
    and logistics challenges, with RayGen noting these costs are above those that
    would be encountered at most other project sites in Australia or globally.
  lesson_learnt: Remote-area project cost estimates for utility-scale storage — particularly
    FOAK projects — should explicitly quantify and report the remote-location labour
    and logistics premium so that reference-class benchmarks are not inflated when
    applied to better-located subsequent projects; failing to do so will systematically
    overestimate future project costs and undermine investment cases.
