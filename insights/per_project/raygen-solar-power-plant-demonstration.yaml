  publish_date: 2024-10
  project_name: Solar Power Plant One (SPP1)
  what_happened: SPP1's grid connection modelling was more extensive than originally
    anticipated and required several iterations to reach agreement with Powercor,
    because the hybrid solar generation and storage plant did not conform to the generation-only
    or load-only system archetypes the connection process was designed for.
  lesson_learnt: Hybrid solar-plus-storage plants should anticipate that standard
    network connection processes are not designed for them — budget for additional
    modelling iterations and engage the NSP early to clarify how the hybrid configuration
    will be assessed before submitting the connection application.
