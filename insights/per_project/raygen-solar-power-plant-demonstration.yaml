  source_title: RayGen Solar Power Plant Demonstration - Operational Report
  publish_date: 2024-10
  project_name: RayGen Solar Power Plant 1 (SPP1)
  what_happened: During low DNI conditions on 15 July 2024 (average DNI of 2.5 kWh/m²
    versus a typical 4.9 kWh/m²), PV Ultra dispatch OEE fell to 62.7% and PV generation
    dropped to 5 MWh, but the Dispatch Controller adapted by storing available thermal
    energy rather than operating the ORC, preserving stored capacity for higher-value
    dispatch windows.
  lesson_learnt: For concentrated solar generation with thermal storage, an automated
    dispatch controller that can defer ORC dispatch in response to low DNI events
    — storing thermal energy rather than generating power at low efficiency — is an
    effective strategy to maximise revenue and protect storage state-of-charge during
    adverse weather. This capability should be designed into dispatch logic from the
    outset.
