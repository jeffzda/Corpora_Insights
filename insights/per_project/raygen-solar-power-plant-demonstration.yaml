  project_name: Solar Power Plant One (SPP1) – Carwarp, Victoria
  what_happened: The FOAK SPP1 demonstration plant cost A$38 million for 4 MW solar
    and 2.8 MW / 50 MWh storage. At FOAK scale-up (SPP2, 165 MW / 102 MW, 1,224 MWh),
    the total installed cost is estimated at A$749–826 million, yielding only mid-single-digit
    IRR under conservative assumptions, with double-digit IRR only expected after
    10 deployments (SPPX).
  lesson_learnt: FOAK long-duration storage projects should be underwritten with the
    expectation of sub-commercial returns at first deployment; financial models must
    account for the substantial cost premium of first-at-scale projects and plan for
    a multi-project learning curve before commercial IRR thresholds are met.
