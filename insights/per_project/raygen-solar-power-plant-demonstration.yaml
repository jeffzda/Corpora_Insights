- record_id: ARENA-DLV-0402
  source_title: RayGen - Solar Power Plant Demonstration Project - Deployment and
    Manufacturing Lessons Learnt Report
  publish_date: null
  project_name: RayGen Solar Power Plant Demonstration Project (SPP1)
  what_happened: Due to funding constraints during development, RayGen reduced the
    SPP1 system scale by cutting PV Ultra generation capacity and eliminating the
    planned Heat Pump. This reduced the plant's ability to maximise arbitrage, particularly
    as the Victorian NEM 'duck curve' evolved more substantially than anticipated
    between the 2019/20 design phase and delivery in 2023.
  lesson_learnt: Avoid reducing the PV generation-to-storage ratio or eliminating
    key flexibility components (such as a Heat Pump) to manage funding constraints
    — doing so undermines the core arbitrage value proposition of the plant, especially
    in markets that may evolve rapidly. Future projects should maintain the optimal
    ratio of PV Ultra generation to ORC system and incorporate a Heat Pump to maximise
    flexibility.
