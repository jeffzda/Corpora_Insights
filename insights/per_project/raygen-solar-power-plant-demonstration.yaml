  source_title: RayGen Solar Power Plant Demonstration Project Lessons Learnt 1
  publish_date: null
  project_name: RayGen's Solar Power Plant – Phase One
  what_happened: Delays in the planning process created a longer-than-ideal gap in
    community engagement, causing RayGen to lose favour with local community groups.
    As a result, some community members and construction contractors were less prepared
    or willing to support the project when construction commenced.
  lesson_learnt: Community engagement plans must include low-impact but routine touchpoints
    — such as local newspaper articles, letter drops, or community consultation evenings
    — to maintain community support during unforeseen planning delays; allowing engagement
    to lapse risks losing community and contractor goodwill at the point construction
    begins.
