  evidence_excerpt: Nominal Takt Time. This assumes ideal plant operations and can
    be used to define RayGen's nominal Nameplate Capacity. Target Takt Time. This
    considers all real-world de-rating factors, such as operator breaks, plant start-up
    and unavailability. RayGen seek to deliver 170MW per annum of product, therefore
    these factors need to be considered. RayGen has designed against this metric.
  confidence_note: transferability narrow — Takt Time methodology is manufacturing-specific
