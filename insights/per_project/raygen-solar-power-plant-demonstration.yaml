    recorded a net thermal charge loss of approximately 31.6 MWh due to thermocline
    degradation and minor thermal losses to environment over the prolonged discharge
    period.
  lesson_learnt: For long-duration PTES discharge events, thermocline degradation
    losses become significant (approximately 1.4 MW average loss rate observed) and
    should be factored into dispatch planning and energy yield forecasting — thermoclines
    recover over the following 24-hour recharge cycle but reduce net energy available
    in real-time dispatch.
