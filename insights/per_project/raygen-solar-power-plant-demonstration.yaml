  source_title: RayGen Solar Power Plant Demonstration - Operational Report
  publish_date: 2024-10
  project_name: RayGen Solar Power Plant 1 (SPP1)
  what_happened: The ORC system's short start-up duration relative to total runtime
    reduced average thermal efficiency, because heat consumed during start-up represented
    a significant proportion of total runtime for typical short dispatch events (approximately
    1 hour).
  lesson_learnt: For ORC-based storage systems, minimise start-up time through control
    logic optimisation before commercial operation — short dispatch windows disproportionately
    penalise thermal efficiency when start-up heat consumption is a large fraction
    of total runtime. Faster start-up improvements should be incorporated into design
    for subsequent projects.
