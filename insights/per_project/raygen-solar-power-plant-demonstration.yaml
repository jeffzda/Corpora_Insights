- record_id: ARENA-DLV-17862
  source_title: RayGen - Solar Power Plant Demonstration Project - Commercialisation
    Report
  publish_date: 2024-10
  project_name: Solar Power Plant One (SPP1) – Carwarp, Victoria
  what_happened: RayGen identified that policy and market settings in Australia and
    other target markets do not yet fully reward long-duration storage technologies
    for their system services value (inertia, system strength, decongestion, transmission
    deferral), which constrains the commercial case and slows deployment of LDES technologies
    even where the technology is technically ready.
  lesson_learnt: Long-duration storage project developers should actively engage with
    regulatory reform processes to ensure market rules reward the full value stack
    — including system strength, inertia, and transmission deferral — because LDES
    projects are commercially marginal at FOAK scale under energy-and-capacity-only
    revenue assumptions, and policy gaps represent a material commercialisation risk.
  issue_severity: major
  project_type: multi-technology/hybrid
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: approvals/regulatory
  failure_mode: commercial & market
  outcome_class: partial success
  secondary_failure_mode: regulatory & approvals
  intervention_note: RayGen is engaging with AEMO's Capacity Investment Scheme and
    related regulatory processes to ensure LDES technologies can capture system services,
    grid decongestion and reliability value through market rules and bi-lateral network
    support contracts.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hybrid systems
  source_pages: &id023
