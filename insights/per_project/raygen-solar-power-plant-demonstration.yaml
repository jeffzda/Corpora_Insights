- record_id: ARENA-DLV-29608
  source_title: RayGen - Solar Power Plant Demonstration Project - Manufacturing Report
  publish_date: 2024-10
  project_name: RayGen Solar Power Plant Demonstration Project - Module Manufacturing
    Line
  what_happened: RayGen developed a detailed Takt Time calculator as the primary capacity
    planning tool for the 170MW MML, incorporating real-world de-rating factors (availability
    83%, performance 92%, yield 99%) to derive a Target Takt Time of 5.07 minutes
    per module — distinct from the idealised Nominal Takt Time of 6.64 minutes. This
    methodology was carried forward directly from the 25MW line.
  lesson_learnt: Use a Takt Time methodology that explicitly separates nominal from
    target capacity by modelling all real-world de-rating factors (shift patterns,
    availability, performance, yield) — designing against nominal capacity alone will
    result in a line that cannot meet actual demand targets under real operating conditions.
