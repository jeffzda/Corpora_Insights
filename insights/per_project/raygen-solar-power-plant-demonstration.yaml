- record_id: ARENA-DLV-26701
  source_title: RayGen Solar Power Plant Demonstration Project Lessons Learnt 2
  publish_date: null
  project_name: RayGen Solar Power Plant – Milestone 3A
  what_happened: Shipping of critical equipment (ORC turbo expander from Atlas Copco
    Mafi Trench in California) was heavily impacted by COVID-19-related global logistics
    disruption, including significantly delayed delivery, revised ship routing via
    additional ports and continents, and major ship maintenance performed without
    notification to RayGen.
  lesson_learnt: Establish a permanent in-country presence and dedicated freight forwarder
    relationships in key supply regions before procurement commences — an 'as-needed'
    remote approach leaves projects exposed to supply chain disruptions; a staffed
    in-region office was pivotal to reducing COVID-19 impacts on supply chain delivery.
  issue_severity: major
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: procurement
  proponent_type: technology vendor
  delay_category: procurement/supply chain
  failure_mode: execution & logistics
  outcome_class: delayed but recoverable
  secondary_failure_mode: null
  intervention_note: RayGen established a permanent staffed office in China and engaged
    dedicated freight forwarders, which significantly reduced the supply chain impact
    of the pandemic.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages:
  - 2
  evidence_excerpt: RayGen identified, prior to COVID-19, that the lack of presence
    in key supply regions was a gap in our capabilities. For previous projects, RayGen
