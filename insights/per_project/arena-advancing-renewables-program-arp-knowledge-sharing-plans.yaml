- record_id: ARENA-DLV-15805
  source_title: Evaluation of ARENA's Impact and Effectiveness
  publish_date: 2019-11
  project_name: ARENA Advancing Renewables Program (ARP) — knowledge sharing plans
  what_happened: Ambiguity of knowledge sharing requirements and delays in agreeing
    Knowledge Sharing Plans (KSPs) were an ongoing source of friction in contract
    negotiations across multiple programs (ARP, RAR, LSS). Recipients complained of
    overly complex requirements and the Future Needs Review found the time taken negotiating
    the knowledge sharing element was 'excessive'. University proponents in particular
    found requirements disproportionate given existing publishing cultures.
  lesson_learnt: Define knowledge sharing expectations in clear, proportionate templates
    before contract negotiations begin — attempting to negotiate KSP details at the
    contracting stage is a misplaced allocation of resources and should be replaced
    with simplified, standardised templates scaled to project type and risk.
