- record_id: ARENA-DLV-25915
  source_title: Review of ARENA's Reliability Portfolio
  publish_date: 2020-01
  project_name: Stand-Alone Power Systems Portfolio (Hydro Tasmania — King Island, Flinders Island, Rottnest Island)
  what_happened: Hydro Tasmania's portfolio of island SAPS projects generated significant learnings about renewable integration in isolated systems but the reviewer found limited ability to generalise these
    learnings to the broader NEM grid, due to the fundamentally different operating conditions in island versus grid-connected environments.
  lesson_learnt: Learnings from SAPS and island microgrid demonstrations transfer only partially to grid-connected network operation; funders should explicitly assess the degree of transferability to the
    wider grid when evaluating SAPS investments for reliability portfolio purposes, and ensure project knowledge-sharing plans address the grid-scale application of findings.
