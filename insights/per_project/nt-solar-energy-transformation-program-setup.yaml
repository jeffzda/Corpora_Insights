- record_id: ARENA-DLV-4760
  source_title: Insights From The Portfolio of Projects Funded Under The Regional
    Australia's Renewables Program
  publish_date: 2017-03
  project_name: NT Solar Energy Transformation Program (SETuP)
  what_happened: The NT SETuP project comprised 30 sub-project communities, integrating
    solar PV with existing diesel supply at scale across a highly dispersed portfolio
    — a programmatic delivery model rather than a single project, adding coordination
    and governance complexity.
  lesson_learnt: Multi-community programmatic off-grid solar deployments require dedicated
    programme-level governance and coordination mechanisms beyond those used for single-site
    projects — the aggregation of 30 sub-projects creates interdependencies, scheduling
    conflicts, and supply chain demands that must be managed at a portfolio level.
