  project_name: ARENA Large-Scale Solar Funding Round Portfolio
  what_happened: The ARENA LSS Funding Round attracted international EPC providers
    to Australia for the first time, improving cost competitiveness among local EPCs
    and contributing to a fall in large-scale solar costs from $135/MWh in 2015 to
    $28–68/MWh in 2019.
