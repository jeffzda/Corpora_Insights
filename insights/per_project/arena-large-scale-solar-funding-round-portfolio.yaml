- record_id: ARENA-DLV-21805
  source_title: Insights From the First Wave of Large-Scale Solar Projects in Australia
  publish_date: 2020-01
  project_name: ARENA Large-Scale Solar Funding Round Portfolio
  what_happened: Poor weather during both construction and hold point testing was
    identified as one of the main causes of delay across the LSS Round Projects, contributing
    to delays in both practical completion and maximum generation.
  lesson_learnt: Construction and commissioning schedules for large-scale solar projects
    should include weather contingency buffers; hold point testing in particular is
    vulnerable to weather disruption, and scheduling this phase during predictably
    adverse weather seasons amplifies delay risk.
