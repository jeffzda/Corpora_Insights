  source_title: Insights From the First Wave of Large-Scale Solar Projects in Australia
  publish_date: 2020-01
  project_name: ARENA Large-Scale Solar Funding Round Portfolio
  what_happened: The vast majority of LSS Round project proponents assumed little
    or no change to MLFs over the project's expected operational lifespan, but actual
    MLFs were generally lower than forecast for both 2018/19 and 2019/20, resulting
    in lower revenues than originally projected.
  lesson_learnt: MLF forecasts for large-scale solar projects should not assume static
    values over a project's life; developers must model MLF degradation scenarios,
    particularly for projects in regions with high solar development activity, where
