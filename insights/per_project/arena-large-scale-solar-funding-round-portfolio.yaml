- record_id: ARENA-DLV-21804
  source_title: Insights From the First Wave of Large-Scale Solar Projects in Australia
  publish_date: 2020-01
  project_name: ARENA Large-Scale Solar Funding Round Portfolio
  what_happened: R2 validation testing — which verifies that a project's grid models
    are representative of the installed system — was among the most frequently cited
    causes of delay across the LSS Round Projects, appearing as a challenge on a greater
    number of projects than most other issues identified.
  lesson_learnt: R2 validation testing should be planned as a dedicated, time-buffered
    activity in the commissioning schedule; developers should engage with AEMO early
    regarding model validation requirements to avoid late-stage delays in achieving
    practical completion and full generation.
