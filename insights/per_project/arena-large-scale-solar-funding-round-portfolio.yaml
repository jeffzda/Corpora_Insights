- record_id: ARENA-DLV-21807
  source_title: Insights From the First Wave of Large-Scale Solar Projects in Australia
  publish_date: 2020-01
  project_name: ARENA Large-Scale Solar Funding Round Portfolio
  what_happened: Total project costs across the 11 LSS Round Projects that submitted
    data ranged from 16 per cent under budget to 25 per cent over budget, with the
    average approximately 2 per cent over budget; however, non-EPC costs averaged
    28 per cent over budget, with one project nearly doubling its expected non-EPC
    costs.
  lesson_learnt: Non-EPC costs (development, owner's engineer, financing, legal, insurance)
    are the highest-risk cost category in large-scale solar projects and should carry
    a contingency of at least 28 per cent; developers who model non-EPC costs tightly
    risk material budget overruns even when EPC costs are controlled.
