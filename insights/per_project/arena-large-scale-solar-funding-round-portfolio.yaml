  source_title: Insights From the First Wave of Large-Scale Solar Projects in Australia
  publish_date: 2020-01
  project_name: ARENA Large-Scale Solar Funding Round Portfolio
  what_happened: The weighted average MLF for solar generators on the NEM dropped
    by 0.114 over two years, from 1.017 in 2017/18 to 0.904 in 2019/20, driven by
    the clustering of solar projects in high-irradiation, high-MLF regions where subsequent
    projects adversely impacted incumbent project MLFs.
  lesson_learnt: Site selection for large-scale solar must account for the pipeline
    of nearby solar developments; locating in high-MLF regions is not a sustainable
    advantage if those same regions attract further solar investment — the compounding
    effect of similar generation profiles means each additional neighbouring solar
    project reduces the MLF for all incumbents.
