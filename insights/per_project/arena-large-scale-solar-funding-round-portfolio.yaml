  what_happened: The exponential growth in large-scale solar projects placed significant
    resource constraints on EPC providers, technical experts, transmission authorities,
    and AEMO simultaneously, meaning the industry faced systemic challenges in integrating
    new projects into a network designed for large thermal generators.
  lesson_learnt: During periods of rapid sector growth, developers should plan for
