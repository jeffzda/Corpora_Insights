- record_id: ARENA-DLV-21802
  source_title: Insights From the First Wave of Large-Scale Solar Projects in Australia
  publish_date: 2020-01
  project_name: ARENA Large-Scale Solar Funding Round Portfolio
  what_happened: Many LSS Round Projects forecast maximum generation to coincide with
    first generation, but AEMO dispatch data shows that on average maximum generation
    was achieved approximately 28 weeks after first generation, primarily due to commissioning
    and R2 validation testing issues.
  lesson_learnt: Project schedules and revenue forecasts should not assume maximum
    generation coincides with first generation; a lag of approximately 28 weeks should
    be modelled between first generation and full generation to account for commissioning
    and R2 validation testing.
