- record_id: ARENA-DLV-21801
  source_title: Insights From the First Wave of Large-Scale Solar Projects in Australia
  publish_date: 2020-01
  project_name: ARENA Large-Scale Solar Funding Round Portfolio
  what_happened: On average, the 14 LSS Round Projects reached practical completion
    38 weeks after the original date forecast at financial close, with construction
    and initial connection processes responsible for more than 15 weeks of delay and
    the period between first generation and practical completion responsible for approximately
    10 weeks.
  lesson_learnt: Schedule forecasts for large-scale solar projects at financial close
    should incorporate a buffer of at least 6–9 months for construction and commissioning
    delays; the average delay across the LSS portfolio was 38 weeks, consistent with
    a sector-wide average of 7.5 months observed by Merrill Lynch across all large-scale
    renewables.
