- record_id: ARENA-DLV-21803
  source_title: Insights From the First Wave of Large-Scale Solar Projects in Australia
  publish_date: 2020-01
  project_name: ARENA Large-Scale Solar Funding Round Portfolio
  what_happened: Grid connection and commissioning, including compliance with Generator
    Performance Standards (GPS) and R2 validation testing, were the most widely cited
    project challenges across the LSS Round portfolio, causing connection delays and
    cost overruns beyond what project developers and EPC contractors originally assumed.
  lesson_learnt: GPS compliance and R2 validation testing should be explicitly scoped
    and scheduled as a major work package in large-scale solar projects; developers
    and EPCs who underestimate this process risk material schedule slippage and cost
    overruns at the grid connection stage.
