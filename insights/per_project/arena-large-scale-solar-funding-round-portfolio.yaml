  source_title: Insights From the First Wave of Large-Scale Solar Projects in Australia
  publish_date: 2020-01
  project_name: ARENA Large-Scale Solar Funding Round Portfolio
  what_happened: The CEFC observed that Post-LSS Round Projects — which did not receive
    ARENA grant funding and were built after the LSS Round — experienced mean delays
    between first generation and full generation that were not significantly different
    from the LSS Round Projects, even after adjusting for projects affected by EPC
    administration.
  lesson_learnt: Commissioning and ramp-up delays for large-scale solar are not attributable
    solely to FOAK factors or grant-funded project characteristics; even experienced,
    commercially-funded subsequent-generation projects experienced similar delays,
    confirming that GPS compliance, R2 validation, and PPC tuning are structurally
    time-consuming activities that all developers must plan for.
