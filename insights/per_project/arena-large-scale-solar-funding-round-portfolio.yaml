- record_id: ARENA-DLV-21806
  source_title: Insights From the First Wave of Large-Scale Solar Projects in Australia
  publish_date: 2020-01
  project_name: ARENA Large-Scale Solar Funding Round Portfolio
  what_happened: Issues associated with EPC contractors — including at least one EPC
    entering voluntary administration — were identified as a cause of delay and contributed
    to the cost and schedule variance observed across the LSS Round portfolio.
  lesson_learnt: EPC contractor financial health should be assessed as part of due
    diligence and monitored throughout construction; an EPC entering voluntary administration
    can cause severe project delays and cost overruns that cannot be recovered through
    normal liquidated damages mechanisms.
