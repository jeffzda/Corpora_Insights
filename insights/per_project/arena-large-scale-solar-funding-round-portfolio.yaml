- record_id: ARENA-DLV-21817
  source_title: Insights From the First Wave of Large-Scale Solar Projects in Australia
  publish_date: 2020-01
  project_name: ARENA Large-Scale Solar Funding Round Portfolio
  what_happened: EPC cost variation across the 11 LSS Round Projects that submitted
    data showed a large spread, ranging from 16 per cent under budget to 18 per cent
    over budget, while the average EPC cost was close to budget — indicating that
    individual project outcomes were highly variable despite the portfolio average
    being controlled.
  lesson_learnt: EPC cost forecasting for large-scale solar carries significant individual
    project risk even when portfolio averages appear controlled; developers and investors
    should not interpret sector-level average EPC cost performance as indicative of
    individual project risk, and should carry contingencies that reflect the observed
    range of ±16–18 per cent.
