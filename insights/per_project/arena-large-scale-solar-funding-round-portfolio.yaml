  source_title: Insights From the First Wave of Large-Scale Solar Projects in Australia
  publish_date: 2020-01
  project_name: ARENA Large-Scale Solar Funding Round Portfolio
  what_happened: The average amount of liquidated damages received by LSS Round Projects
    under their EPC contracts was $4.2 million, with one project receiving $9.7 million,
    generally caused by EPC-driven delays.
  lesson_learnt: Liquidated damages provisions in EPC contracts for large-scale solar
    should be sized to reflect the realistic cost of schedule delays, including foregone
    revenue; the average payout of $4.2 million per project indicates that delay risk
    materialised frequently and at significant scale.
