- record_id: ARENA-DLV-21823
  source_title: Insights From the First Wave of Large-Scale Solar Projects in Australia
  publish_date: 2020-01
  project_name: ARENA Large-Scale Solar Funding Round Portfolio
  what_happened: The CEFC offered a long-term debt product alongside ARENA grant funding
    to provide finance certainty for 10 LSS projects, including those without a guaranteed
    PPA revenue stream at the time of financial close, enabling projects to proceed
    to construction that might otherwise have stalled at financing.
  lesson_learnt: Combining concessional debt (CEFC) with capital grants (ARENA) can
    unlock projects that are unable to reach commercial financial close due to revenue
    uncertainty; co-ordinated public financing instruments that address both the equity
    and debt gaps simultaneously are more effective than either instrument alone for
    FOAK or early-commercial renewable projects.
