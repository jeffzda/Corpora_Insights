  publish_date: 2020-12
  project_name: Biogas from Sugarcane
  what_happened: HTL of digestate achieved a biocrude yield of ~40% with a higher
    heating value of 33 MJ/kg at pilot scale, offering significantly greater financial
    returns than the biofertiliser scenario (Scenario 2), but HTL remains at a lower
    level of commercial readiness than anaerobic digestion and was not demonstrated
    at commercial scale within this project.
  lesson_learnt: Projects integrating HTL with anaerobic digestion should sequence
    technology risk carefully — HTL offers substantially higher returns but adds commercial
    readiness risk; a staged approach that first commercialises the anaerobic digestion
    pathway while continuing HTL development reduces overall project risk.
