  source_title: Biogas from Sugarcane – Final Project Report December 2020
  publish_date: 2020-12
  project_name: Biogas from Sugarcane
  what_happened: At the commencement of the project there were no full-scale or pilot-scale
    biogas upgrading facilities in Australia, and no Australian experience in producing
    biogas from lignocellulosic biomass. This knowledge gap meant the project team
    had to conduct extensive due diligence and independent engineering assessments
    against Australian design standards before procurement could be finalised.
  lesson_learnt: Where Australian precedent for a technology is absent, project teams
    should budget significant additional time and cost for independent engineering
    assessment of imported equipment against Australian standards — this due diligence
    step is not optional and is likely to be on the critical path for procurement.
