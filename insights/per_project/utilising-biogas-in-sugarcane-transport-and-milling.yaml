  what_happened: Annual regulatory licence costs for the pilot-scale biogas plant
    (gas and petroleum licence in Queensland) were the same as those for a large commercial
    installation, creating a disproportionate compliance cost burden for a small research
    project.
  lesson_learnt: Project developers of small-scale bioenergy pilot projects in Queensland
    should budget for commercial-equivalent regulatory licence fees — the gas and
    petroleum licensing regime does not scale with project size, and this cost is
    material for pilot-scale budgets.
