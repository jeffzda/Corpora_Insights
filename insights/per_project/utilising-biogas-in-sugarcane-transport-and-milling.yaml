  publish_date: 2020-12
  project_name: Biogas from Sugarcane
  what_happened: Construction and commissioning of the pilot-scale biogas upgrading
    unit and biogas reactors were delayed due to the need to meet Australian safety,
    quality, and regulatory standards, delays in manufacture and shipping of core
    components, and rectification works for electrical, hazardous zoning, and structural
    compliance. These delays consumed contingency budget and required milestone date
    variations.
  lesson_learnt: When developing novel pilot infrastructure involving imported equipment,
    budget sufficient contingency in both schedule and budget for Australian standards
    compliance, international shipping delays, and on-site rectification works — regulatory
    compliance costs for small pilot projects (e.g. gas and petroleum licences) can
    equal those of large commercial installations.
