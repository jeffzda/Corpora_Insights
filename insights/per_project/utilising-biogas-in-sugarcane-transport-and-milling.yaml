- record_id: ARENA-DLV-34307
  source_title: Biogas from Sugarcane – Final Project Report December 2020
  publish_date: 2020-12
  project_name: Biogas from Sugarcane
  what_happened: Pretreatment trials using liquid hot water and dilute acid produced
    sugar degradation products (furans) that inhibited biomethane production, while
    dilute alkali pretreatment avoided this inhibition but introduced alkali salt
    recovery and liquid stream reuse challenges.
  lesson_learnt: When selecting pretreatment technology for lignocellulosic biogas
    feedstocks, screen explicitly for inhibitory by-products — furan formation under
    acid/hot water conditions can negate biogas yield gains, and alkali processes
    introduce liquid management costs that must be accounted for in techno-economic
    assessment.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: pilot
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Steam explosion pretreatment was selected as the preferred technology,
    having no catalyst cost, short treatment time, and small reactor footprint, thereby
    avoiding both inhibition and liquid management issues.
  transferability: moderate
  delay_magnitude: null
  technology_domain: bioenergy
  source_pages: &id005
  - 10
  evidence_excerpt: For liquid hot water and dilute acid pretreatment, sugar degradation
    products such as furans could inhibit the biomethane production. Dilute alkali
    pretreatment did not inhibit BMP production, however, alkali salts presented issues
    with recovery and reuse of the liquid streams.
