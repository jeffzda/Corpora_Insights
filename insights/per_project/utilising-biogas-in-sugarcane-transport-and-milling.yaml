- record_id: ARENA-DLV-34305
  source_title: Biogas from Sugarcane – Final Project Report December 2020
  publish_date: 2020-12
  project_name: Biogas from Sugarcane
  what_happened: Sugarcane trash particles caused persistent wrapping around stirrers
    and blockages in pipes during anaerobic digestion trials at both laboratory and
    pilot scale, presenting an ongoing materials handling challenge throughout the
    project.
  lesson_learnt: When designing anaerobic digestion systems for lignocellulosic feedstocks
    such as sugarcane trash, equipment must specifically address fibrous material
    handling — design either to eliminate blockage points or to allow ready cleaning,
    as wrapping and pipe blockage are predictable failure modes at small scale with
    this feedstock class.
