  source_title: Biogas from Sugarcane – Final Project Report December 2020
  publish_date: 2020-12
  project_name: Biogas from Sugarcane
  what_happened: Techno-economic modelling showed that supplementing sugarcane trash
    with 10–20% co-digestion feedstocks (food waste or manure) significantly improved
    project financial viability, with the IRR increasing substantially across both
    scenarios, but no co-digestion trials were conducted as part of this project.
  lesson_learnt: Future biogas projects using lignocellulosic agricultural residues
    should assess co-digestion feedstock availability in the local area at the business
    case stage — even a 10–20% supplement of food waste or manure can be the difference
    between marginal and commercially attractive project economics.
