  project_name: Biogas from Sugarcane
  what_happened: The novel QUT non-pneumatic trash separator achieved a 290% increase
    in throughput through iterative improvements during pilot trials at Rocky Point
    sugar mill, but requires further scale-up to 150 t/h commercial scale for full
    validation — commercial readiness was not achieved within the project.
  lesson_learnt: Novel mechanical separation technologies for agricultural residues
    should plan explicitly for a commercial-scale validation stage beyond pilot demonstration
    — pilot trials are necessary to identify design improvements but are not sufficient
    to confirm commercial performance, and failure to resource the scale-up step leaves
    the technology in a validation gap.
