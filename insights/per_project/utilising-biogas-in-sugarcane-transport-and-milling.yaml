- record_id: ARENA-DLV-34312
  source_title: Biogas from Sugarcane – Final Project Report December 2020
  publish_date: 2020-12
  project_name: Biogas from Sugarcane
  what_happened: Pretreatment optimisation for sugarcane bagasse as a digestion feedstock
    remained incomplete at project close — laboratory experiments in batch and semi-continuous
    reactors identified the influence of acids, alkalis, C/N ratio, and high solids
    content, but further work was identified as needed to determine optimum low-cost
    pretreatment conditions for maximum methane yields.
  lesson_learnt: Pilot bioenergy projects using novel lignocellulosic feedstocks should
    allocate dedicated resource and schedule for feedstock pretreatment optimisation
    as a distinct workstream — this task is iterative and is likely to remain incomplete
    if treated as a sub-activity within a broader demonstration programme.
