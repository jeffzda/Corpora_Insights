- record_id: ARENA-DLV-64422
  source_title: Distributed Energy Resources (DER) Integration Project Contribution Assessment
  publish_date: 2019-03
  project_name: Energy Storage Knowledge Bank (University of Adelaide)
  what_happened: The University of Adelaide built a mobile energy storage test platform and an online knowledge bank with high-resolution data capture (up to 500 kHz for power quality events) and more than
    30 sensors, making test data, case studies and lessons from tests conducted around Australia and the world publicly available to technology developers, system integrators and end users.
  lesson_learnt: A centralised, publicly accessible knowledge bank with standardised high-resolution test data can reduce uncertainty and accelerate investment in energy storage technologies — ARENA should
    consider requiring contribution of project data to central repositories as a condition of funding, multiplying the value of individual project investments.
