  evidence_excerpt: By making this data publicly available, this project can reduce the uncertainty around the deployment of energy storage technologies, build industry confidence and accelerate investment
    in reliable battery energy storage technologies. Importantly, by sharing this data and facilitating collaboration, industry stakeholders can learn from each other's experience to facilitate the uptake
    and integration of energy storage across different scales and applications.
