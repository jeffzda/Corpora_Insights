  evidence_excerpt: The approach to solve the problem is to segment the distribution
    network by opening either a bus tie circuit breaker or transformer circuit breaker.
    This reduces the fault contribution upstream and creates fault level headroom
    for future distributed generators downstream of the zone substation. The resultant
    fault level headroom created is approximately 5kA.
