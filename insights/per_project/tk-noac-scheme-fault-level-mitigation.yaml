- record_id: ARENA-DLV-72309
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: '2014'
  project_name: TK NOAC Scheme Fault Level Mitigation
  what_happened: Fault levels on the 11kV bus at Toorak (TK) zone substation on Powercor's
    network were approaching plant rating limits, threatening the ability to connect
    future distributed generators. CitiPower resolved this by segmenting the distribution
    network via opening a bus tie or transformer circuit breaker, creating approximately
    5kA of fault level headroom.
  lesson_learnt: Network segmentation via bus tie or transformer circuit breaker opening
    is a low-cost, rapidly deployable method to create fault level headroom at zone
    substations constrained by approaching plant ratings — this approach should be
    evaluated before committing to more expensive infrastructure upgrades when DG
    connection is blocked by fault level limits.
