- record_id: ARENA-DLV-70806
  source_title: Grid Forming Battery Webinar 23 July 2025
  publish_date: 2025-07
  project_name: Hornsdale Power Reserve Expansion (HPRX)
  what_happened: HPRX demonstrated that Virtual Machine Mode (VMM) / synthetic inertia capability mitigates high RoCoF events, alleviates maximum frequency deviations, and enhances the effectiveness of
    the Wide Area Protection Scheme (WAPS) by enabling rapid charge and discharge responses that avoid Heywood interconnector trips.
  lesson_learnt: GFM BESS synthetic inertia can provide system-level benefits beyond direct inertial substitution — specifically, it creates a time window that allows protection schemes such as WAPS to
    operate accurately, reducing interconnector trip risk. Project design should consider this systemic complementarity when sizing and configuring GFM capability.
