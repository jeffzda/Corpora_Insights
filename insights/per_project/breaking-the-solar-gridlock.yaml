- record_id: ARENA-DLV-72218
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects - First Edition Results'
  publish_date: null
  project_name: Breaking the Solar Gridlock
  what_happened: A study mapping concentrating solar thermal power (CSP) opportunities at constrained network locations in the Australian NEM identified $0.8 billion of potentially avoidable network investment
    and 533MW of cost-effective CSP, with CSP capable of avoiding network augmentation at 72% of the 67 constrained locations studied. The study also found that the availability and accessibility of network
    constraint information was insufficient for distributed energy solutions to compete with traditional network augmentation.
  lesson_learnt: CSP with thermal storage can provide a cost-effective alternative to traditional network augmentation at the majority of constrained locations — but distributed energy solutions cannot
    compete on equal terms with network augmentation until network operators substantially improve the public availability and accessibility of constraint information.
