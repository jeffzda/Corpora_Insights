- record_id: ARENA-DLV-37918
  source_title: Hydrogen Communities & H2City Tool
  publish_date: 2019-06
  project_name: Western Sydney Green Gas Project
  what_happened: The Western Sydney Green Gas Project (Jemena/ARENA, AUD$15 million) adopted a low blending rate of 5–10% hydrogen into the gas network specifically to avoid the need for appliance replacement
    across the approximately 250 homes supplied, thereby avoiding significant upfront capital expenditure.
  lesson_learnt: Limiting hydrogen blend to 5–10% is an effective strategy for gas network trial projects to avoid the capital expenditure and customer disruption of appliance replacement — this design
    choice should be made explicitly at concept stage as it determines regulatory treatment, network augmentation scope, and customer engagement requirements.
