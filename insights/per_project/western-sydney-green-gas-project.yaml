- record_id: ARENA-DLV-37919
  source_title: Hydrogen Communities & H2City Tool
  publish_date: 2019-06
  project_name: Western Sydney Green Gas Project
  what_happened: The Western Sydney Green Gas Project used grid-connected renewable energy purchased through Power Purchase Agreements to feed the 500kW electrolysis facility, rather than relying on dedicated
    behind-the-meter renewables.
  lesson_learnt: Grid-connected electrolysis facilities can source renewable electricity via PPAs rather than requiring dedicated behind-the-meter generation — this approach simplifies project scope and
    reduces capital requirements for the production facility, though it introduces ongoing commercial exposure to PPA pricing.
