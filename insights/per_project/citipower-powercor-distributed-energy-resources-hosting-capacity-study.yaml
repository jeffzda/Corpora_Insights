- record_id: ARENA-DLV-45002
  source_title: Network Hosting Capacity Projects Progress Report (Year One)
  publish_date: 2020-03
  project_name: 'CitiPower & Powercor: Distributed Energy Resources Hosting Capacity
    Study'
  what_happened: The publicly available power flow analysis tool selected for the
    study was found to be limited to balanced three-phase systems, making it inadequate
    for assessing unbalanced LV networks and single-phase systems, which are common
    in the CitiPower and Powercor network.
  lesson_learnt: Before selecting publicly available analysis tools for LV network
    hosting capacity studies, verify that the tool supports unbalanced three-phase
    and single-phase analysis — tools limited to balanced three-phase systems will
    require additional modelling workarounds for typical Australian LV networks.
  issue_severity: moderate
  project_type: network/grid
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: network business
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: CitiPower and Powercor worked with industry partners to develop
    a bespoke modelling approach to address the tool's limitations in assessing unbalanced
    LV networks.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: DER
  source_pages: &id002
  - 3
  evidence_excerpt: CitiPower and Powercor have been working with industry partners
    to develop a modelling approach to address limitations in the publicly available
    analysis tool. This primarily focused on the limitations in assessing unbalanced
    LV networks and single phase systems, as the tool is limited to assessment of
    balanced three phase systems at this time.
