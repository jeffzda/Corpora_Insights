- record_id: ARENA-DLV-45001
  source_title: Network Hosting Capacity Projects Progress Report (Year One)
  publish_date: 2020-03
  project_name: 'CitiPower & Powercor: Distributed Energy Resources Hosting Capacity
    Study'
  what_happened: The number of LV network topologies to be developed was increased
    from five to ten during year one because the network's range of customer types
    and supply areas was greater than originally scoped.
  lesson_learnt: When scoping LV network modelling studies, account for the full diversity
    of customer types and supply area characteristics from the outset — underestimating
    network heterogeneity caused the scope to double, adding workload and likely extending
    the study timeline.
