  what_happened: Detailed pre-feasibility scoping is required before the economics
    of heat pump electrification projects can be determined, but this work has no
    return for site owners if the project does not proceed. This 'pre-project investment
    with uncertain return' structure was identified as the single biggest barrier
    to decarbonising process heat.
  lesson_learnt: Government programs supporting process heat electrification should
    fund pre-project feasibility and engineering design work directly, as this stage
    has no commercial return if the project does not proceed — without this support,
    the barrier to entry remains prohibitively high even when the underlying technology
    economics are favourable.
