  what_happened: Manufacturers reported that inconsistent savings and emissions reduction
    calculations from equipment suppliers — due to different methodologies, inclusion
    of fixed network costs, and non-uniform quoting practices — reduced the perceived
    credibility of energy efficiency and solar investment cases, directly reducing
    likelihood of investment.
