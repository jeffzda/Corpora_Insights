- record_id: ARENA-DLV-2458
  source_title: Advancing Renewables in the Manufacturing Sector Final Report
  publish_date: 2022-05
  project_name: Advancing Renewables in the Manufacturing Sector
  what_happened: Queensland manufacturing businesses face materially worse economics
    for energy efficiency projects compared to NSW and VIC peers due to the absence
    of a certificate-based energy efficiency incentive scheme. For example, a compressed
    air project worth $3,100/year in savings costs $4,000 net in Queensland but is
    effectively cost-neutral or profitable under NSW ESS and VEU rebates.
  lesson_learnt: The absence of a Queensland equivalent to the NSW Energy Saving Scheme
    or Victorian Energy Upgrade program creates a structural competitive disadvantage
    for Queensland manufacturers — multi-state businesses will preferentially allocate
    efficiency capex to states with certificate schemes, leaving Queensland facilities
    comparatively less efficient.
