  what_happened: Capital constraints and short payback thresholds (typically under
    3 years) prevented 56% of identified energy savings opportunities from being actioned,
    representing an estimated $49m per year in unrealised Queensland manufacturing
    energy savings.
  lesson_learnt: Short internal payback hurdles lock out a majority of technically
    viable energy efficiency opportunities; programs that provide financial incentives
    (e.g. tradeable certificate schemes) or co-investment support are necessary to
    unlock the larger pool of 3–5 year payback projects that cannot compete with core
    business capital priorities.
