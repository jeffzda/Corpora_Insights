- record_id: ARENA-DLV-2455
  source_title: Advancing Renewables in the Manufacturing Sector Final Report
  publish_date: 2022-05
  project_name: Advancing Renewables in the Manufacturing Sector
  what_happened: Low energy literacy among manufacturing participants meant electricity
    bills were poorly understood, tariff structures misread, and energy project business
    cases frequently overstated returns — including network fixed costs in variable-cost
    savings calculations for solar PV and efficiency measures.
  lesson_learnt: Programs targeting manufacturing energy upgrades must include energy
    literacy support as a co-design element; overstated business cases caused by misunderstood
    tariffs create a credibility barrier that reduces investment likelihood even when
    the underlying economics are genuinely attractive.
