  source_title: Advancing Renewables in the Manufacturing Sector Final Report
  publish_date: 2022-05
  project_name: Advancing Renewables in the Manufacturing Sector
  what_happened: Small gas consumers (annual consumption below 50,000 GJ) in Queensland
    were found to pay gas costs averaging $22.43/GJ — up to $35/GJ in some cases —
    far exceeding the $15/GJ benchmark typically used in energy efficiency calculations,
    and comparable to or exceeding the all-in cost of electricity from grid or rooftop
    solar.
  lesson_learnt: Standard gas cost benchmarks significantly underestimate costs for
    small manufacturing gas consumers, causing electrification investment cases to
    appear less attractive than they actually are — program assessments should use
    site-specific contracted gas rates rather than sector benchmarks, and small high-cost
    gas consumers should be treated as priority targets for electrification programs.
