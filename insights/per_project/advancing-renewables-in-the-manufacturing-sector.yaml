  project_name: Advancing Renewables in the Manufacturing Sector
  what_happened: Queensland's energy productivity gap relative to NSW, VIC, and SA
    has grown significantly since 2000, with all three leading states having introduced
    long-running certificate-based energy efficiency programs (NSW ESS 2009, VEU 2008/2017,
    SA REPS 2009/2020) while Queensland has not.
  lesson_learnt: Long-running, legislated, retailer-funded energy efficiency certificate
    schemes are demonstrably effective at improving state-level energy productivity
    — the evidence from NSW and VIC shows that continuous, scalable programs (not
    one-off project grants) are required to close systemic energy productivity gaps
    in trade-exposed manufacturing sectors.
