  source_title: Advancing Renewables in the Manufacturing Sector Final Report
  publish_date: 2022-05
  project_name: Advancing Renewables in the Manufacturing Sector
  what_happened: Most manufacturing businesses lacked a single dedicated person responsible
    for energy management — responsibility was typically split between finance and
    operations staff, meaning energy productivity improvements had to be driven externally
    by government or suppliers rather than from within the organisation.
  lesson_learnt: Energy efficiency programs targeting SME manufacturers should not
    assume internal project champions exist — program design should account for the
    absence of a dedicated energy manager and include external facilitation or coaching
    to drive projects to shovel-ready stage.
