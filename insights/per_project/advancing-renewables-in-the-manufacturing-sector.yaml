  project_name: Advancing Renewables in the Manufacturing Sector
  what_happened: There are few suppliers of high-temperature heat pump systems in
    Australia and even fewer in Queensland, making each industrial heat pump project
    bespoke and increasing the relative cost for smaller systems. This supply-side
    constraint creates a structural barrier to smaller manufacturers accessing electrification
    of process heat.
  lesson_learnt: Growing local market demand for industrial heat pump technology —
    through government-supported feasibility programs and pilot projects — is necessary
    to attract overseas suppliers and reduce costs over the medium term; without demand
    aggregation, small manufacturers will continue to face prohibitive per-unit project
    costs.
