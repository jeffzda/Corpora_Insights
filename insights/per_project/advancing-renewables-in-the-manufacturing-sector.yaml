  what_happened: Solar PV adoption among manufacturing participants was impeded in
    part by tenancy arrangements — businesses renting their premises could not install
    renewables without landlord permission, and lease periods were often shorter than
    the solar system payback period, creating a structural split-incentive barrier.
  lesson_learnt: Renewable energy programs targeting the manufacturing sector must
    address the landlord-tenant split incentive — a significant share of manufacturers
    lease their facilities and cannot unilaterally invest in rooftop solar; program
    design should include commercial structures (e.g. solar leases, landlord engagement,
    green lease clauses) to unlock this cohort.
