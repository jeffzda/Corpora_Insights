  what_happened: Analysis of heat pump utilisation data from participating businesses
    showed that heat pump systems operated at only 31% utilisation on average. Best-practice
    design incorporating thermal storage could increase utilisation to 50%, reducing
    simple payback by approximately 40% (e.g. from 7.4 years to 4.6 years).
