- record_id: ARENA-DLV-2454
  source_title: Advancing Renewables in the Manufacturing Sector Final Report
  publish_date: 2022-05
  project_name: Advancing Renewables in the Manufacturing Sector
  what_happened: Across 20 assessed manufacturing sites, only one had a modern submetering
    system. The remaining 19 sites had minimal or no submetering, relying solely on
    gate-meter readings from energy bills with material lags and no production-line
    or machine-level granularity.
  lesson_learnt: Absence of submetering is the primary information barrier to energy
    productivity improvement in manufacturing — without it, energy waste cannot be
    identified, savings cannot be measured or verified, and investment cases for efficiency
    projects cannot be credibly constructed. Installing submeters and integrating
    data into SCADA systems should be the first step in any manufacturing energy program.
