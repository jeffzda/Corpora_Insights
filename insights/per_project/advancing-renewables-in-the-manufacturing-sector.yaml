  source_title: Advancing Renewables in the Manufacturing Sector Final Report
  publish_date: 2022-05
  project_name: Advancing Renewables in the Manufacturing Sector
  what_happened: Energy tariff structures — both electricity and gas — vary significantly
    by geography and consumption level, with small gas consumers paying on average
    $22.43/GJ versus $6.51/GJ for large consumers (a 245% difference), making technology
    business cases highly site-specific and preventing direct replication of opportunities
    across sites.
  lesson_learnt: Energy efficiency and electrification business cases in manufacturing
    cannot be directly replicated across sites without accounting for site-specific
    tariffs — a strong investment case on one set of tariffs can have zero or negative
    returns for a similar site in a different location or consumption band; program
    design must incorporate tariff validation as a mandatory step.
