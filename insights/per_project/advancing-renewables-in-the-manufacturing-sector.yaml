- record_id: ARENA-DLV-2451
  source_title: Advancing Renewables in the Manufacturing Sector Final Report
  publish_date: 2022-05
  project_name: Advancing Renewables in the Manufacturing Sector
  what_happened: Only 10% of the 20 assessed Queensland manufacturing sites had solar
    PV installed, despite all participants having good awareness of potential benefits.
    Solar PV could reduce grid energy consumption by approximately 9% with a simple
    payback of 5–7 years (with RET certificates).
  lesson_learnt: Low solar adoption in the manufacturing sector is driven by capital
    cost barriers, lease/tenancy constraints, and difficulty comparing quotes — not
    by lack of awareness. Programs targeting these specific barriers (e.g. standardised
    quoting, co-investment support) are more likely to drive uptake than awareness
    campaigns alone.
