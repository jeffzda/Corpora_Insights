  project_name: Advancing Renewables in the Manufacturing Sector
  what_happened: Variable Speed Drive (VSD) opportunities in smaller motors (under
    50 kW) were consistently missed across assessed sites because correct identification
    requires detailed study of process flow and motor mechanics — a capability rarely
    available in-house at manufacturing SMEs.
  lesson_learnt: VSD assessments should explicitly include small motors (under 50
    kW) through detailed process flow analysis — standard energy audits focused only
    on the largest, most visible motors systematically miss significant savings opportunities;
    specialist motor assessment should be included as a mandatory element in manufacturing
    energy program audits.
