  what_happened: Battery Energy Storage Systems (BESS) assessed across the 20 manufacturing
    sites showed generally poor financial returns when deployed purely as demand response
    or load-shifting mechanisms, with typical simple paybacks ranging from 7.6 to
    38 years depending on demand cost.
  lesson_learnt: BESS behind the meter in manufacturing is not economically justified
    on demand response or load-shifting alone at current costs; deployment should
    be limited to specific operational risk cases (transformer upgrade deferral, EV
    charging buffer, critical backup) or reserved until costs fall further.
