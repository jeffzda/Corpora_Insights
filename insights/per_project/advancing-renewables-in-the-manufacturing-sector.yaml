  project_name: Advancing Renewables in the Manufacturing Sector
  what_happened: Of five high-temperature heat pump electrification projects assessed
    across participating sites, only two were financially viable (paybacks of 3.3
    and 4.9 years). The key differentiator was the ability to utilise both the hot
    and cold output streams of the heat pump, and the site's gas cost level.
  lesson_learnt: Heat pump electrification of process heat in food manufacturing is
    economically viable now where both heating and cooling outputs can be utilised
    and gas costs are high — projects should be designed from the outset to integrate
    the cooling stream into existing refrigeration systems, as this can improve effective
    COP from ~3 to ~5 and reduce payback by up to 40%.
