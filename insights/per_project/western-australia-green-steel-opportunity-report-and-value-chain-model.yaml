- record_id: ARENA-DLV-54913
  source_title: ARENA Insights Green Steel Webinar
  publish_date: 2024-05
  project_name: Western Australia Green Steel Opportunity Report and Value Chain Model
  what_happened: MRIWA's decarbonisation options analysis found that replacing the blast furnace in steel production delivers a 60–90% reduction in emissions — the largest single lever available — while
    using green iron in existing blast furnaces and basic oxygen furnaces delivers 40%, and increased green EAF and scrap recycling can deliver up to 100% but is constrained by scrap availability.
  lesson_learnt: Steel decarbonisation project portfolios should prioritise blast furnace replacement as the highest-impact technology investment, while recognising that scrap-based EAF — despite offering
    the highest emissions reduction — is constrained by scrap availability and cannot meet total steel demand; a portfolio strategy must therefore develop both DRI-based ironmaking and scrap-based routes
    in parallel.
