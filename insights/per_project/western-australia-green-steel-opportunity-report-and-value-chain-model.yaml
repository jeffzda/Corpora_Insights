- record_id: ARENA-DLV-54912
  source_title: ARENA Insights Green Steel Webinar
  publish_date: 2024-05
  project_name: Western Australia Green Steel Opportunity Report and Value Chain Model
  what_happened: MRIWA's value chain modelling identified that transitioning from fossil fuel iron production to green iron in HBI form requires substantially higher capital investment than conventional
    fossil fuel routes, with the capital requirement analysis showing green iron production (HBI form) as the most capital-intensive step in the magnetite value chain, driven by the need for hydrogen plant,
    new machinery, increased green electricity generation, and additional transmission infrastructure.
  lesson_learnt: Value chain capital modelling for green steel projects in Western Australia should account for enabling infrastructure — renewable electricity generation, transmission, hydrogen production,
    water, port and rail capacity, and appropriately zoned land — as these can exceed the capital cost of the production process itself and are the binding constraints on project feasibility.
