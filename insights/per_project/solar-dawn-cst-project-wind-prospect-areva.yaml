  evidence_excerpt: 'The successful CST proposal was the Wind Prospect/Areva Solar
    Dawn proposal for a 250 MW system near Chinchilla in Queensland... Ultimately
    this project did not reach financial close or proceed. In retrospect, there are
    significant lessons to be learnt from elements of the project, including: the
    attempt to procure a single project bigger than any that had been built globally
    at that time; awarding the project largely on cost to a technology supplier without
    a significant track record; failing to ensure an off-take agreement would be achieved
    as part of the program requirements.'
