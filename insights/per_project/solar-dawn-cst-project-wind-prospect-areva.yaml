- record_id: ARENA-DLV-47051
  source_title: Australian Concentrating Solar Thermal Industry Roadmap
  publish_date: 2018-08
  project_name: Solar Dawn CST Project (Wind Prospect/Areva)
  what_happened: The Solar Dawn project — a 250 MW CST system near Chinchilla, Queensland
    awarded $464 million in Australian Government funding under Round 1 of the Solar
    Flagships program — did not reach financial close or proceed. The project was
    awarded largely on cost to a technology supplier without a significant track record,
    no secure off-take agreement was required as part of program conditions, and the
    proposed scale exceeded anything built globally at the time.
  lesson_learnt: When procuring first-of-kind large-scale CST (or any novel generation
    technology), avoid awarding to suppliers without a demonstrated track record,
    require a bankable off-take agreement as a program prerequisite, and do not target
    a scale larger than the global deployment frontier — each of these factors independently
    undermined the Solar Dawn project and their combination made failure near-certain.
