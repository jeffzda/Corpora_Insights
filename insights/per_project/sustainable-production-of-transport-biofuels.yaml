- record_id: ARENA-DLV-34502
  source_title: Sustainable Production of High-Quality Second Generation Transport Biofuels from Mallee Biomass by Pyrolysis and Biorefinery
  publish_date: '2013-03-20'
  project_name: Sustainable Production of Transport Biofuels from Mallee Crops by Pyrolysis and Biorefinery
  what_happened: Economic analysis confirmed that liquid biofuel production costs from mallee biomass could be as low as A$0.49/litre (two-step biorefinery) or A$0.60/litre (one-step), with the potential
    for net-negative carbon emissions when bio-char is returned to the field — but the technology remained at lab scale with no commercial deployment pathway confirmed.
  lesson_learnt: Early techno-economic analysis showing competitive production costs (sub-$0.60/L) and negative lifecycle emissions can validate a research program's commercial rationale, but future projects
    should pair economic modelling with a defined scale-up roadmap to avoid the gap between demonstrated lab economics and investable commercial proposals.
  issue_severity: minor
