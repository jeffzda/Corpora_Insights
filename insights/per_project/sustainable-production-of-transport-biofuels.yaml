- record_id: ARENA-DLV-34504
  source_title: Sustainable Production of High-Quality Second Generation Transport Biofuels from Mallee Biomass by Pyrolysis and Biorefinery
  publish_date: '2013-03-20'
  project_name: Sustainable Production of Transport Biofuels from Mallee Crops by Pyrolysis and Biorefinery
  what_happened: The project improved understanding of mallee biomass production systems — including belt orientation, configuration, and nutrient application — and developed a decision support tool for
    farmers to estimate yield from site characteristics, addressing both supply-side viability and dryland salinity co-benefits.
  lesson_learnt: Bioenergy projects dependent on purpose-grown feedstocks should invest in farmer-facing decision support tools and agronomic knowledge alongside technology development; without demonstrated
    feedstock supply economics and grower engagement, technology feasibility alone is insufficient to progress to commercial scale.
  issue_severity: none
  project_type: manufacturing/supply chain
  project_scale_band: pilot
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: Project personnel maintained direct links with mallee-growing farmers, inviting them to research sites and sharing the decision support tool to facilitate knowledge transfer.
  transferability: narrow
  delay_magnitude: null
  technology_domain: bioenergy
  source_pages: &id004
  - 3
  - 4
  evidence_excerpt: This project has led to improved understanding and the development of key knowledge that can enhance the economically viable and sustainable production of mallee biomass as a component
    of wheatbelt agricultural systems... This project has resulted in the development of a decision support tool for use by growers to estimate mallee production based on key site characteristics.
  confidence_note: transferability set to narrow because the feedstock-supply and agronomic findings are specific to mallee crops in the WA wheatbelt context.
