- record_id: ARENA-DLV-34501
  source_title: Sustainable Production of High-Quality Second Generation Transport Biofuels from Mallee Biomass by Pyrolysis and Biorefinery
  publish_date: '2013-03-20'
  project_name: Sustainable Production of Transport Biofuels from Mallee Crops by Pyrolysis and Biorefinery
  what_happened: A lab-scale pilot plant demonstrating biomass grinding pyrolysis technology was successfully built and operated at a biomass feeding rate of more than 15 kg/hr, proving the technical feasibility
    of the novel two-step pyrolysis-biorefinery process for producing drop-in biofuels from mallee biomass.
  lesson_learnt: Lab-scale pilot plant demonstration of pyrolysis-biorefinery technology for lignocellulosic biomass is technically achievable at modest scale; however, the pathway from lab/bench demonstration
    to commercial deployment requires a structured commercialisation plan and continued scale-up investment — filing patents and establishing a dedicated facility early can protect IP and accelerate the
    transition.
