  evidence_excerpt: The major commercial barriers to further development of the Australian
    geothermal sector are the small size of the companies holding leases and undertaking
    demonstration projects, the inability to attract additional private sector funding
    to finance the commercial development of projects, and the high cost of developments
    that include drilling costs before a prospective resource can be proven.
