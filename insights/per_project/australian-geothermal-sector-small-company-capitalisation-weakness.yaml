- record_id: ARENA-DLV-14975
  source_title: 'Looking Forward: Barriers, Risks and Rewards of the Australian Geothermal
    Sector to 2020 and 2030'
  publish_date: 2014-06
  project_name: Australian Geothermal Sector – Small Company Capitalisation Weakness
  what_happened: The geothermal sector in Australia was characterised by small companies
    with limited capital holding exploration leases and undertaking demonstration
    projects; by 2014, as investor sentiment turned negative following limited demonstration
    success, these companies lacked the balance sheets to sustain projects through
    the exploration and test-drilling phases where risk is highest.
  lesson_learnt: Funding programs for capital-intensive, high-risk technologies should
    assess company capitalisation and financial resilience as part of project selection
    — small-cap companies holding leases on multi-decade projects requiring tens of
    millions in phased capital are structurally ill-suited to absorb exploration phase
    failures and are likely to exit when early results are disappointing.
