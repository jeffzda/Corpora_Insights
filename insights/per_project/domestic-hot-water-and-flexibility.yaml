- record_id: ARENA-DLV-35079
  source_title: UTS Domestic Hot Water and Flexibility Report
  publish_date: 2023-05
  project_name: Domestic Hot Water and Flexibility
  what_happened: The report found that STCs (Small-scale Technology Certificates),
    the primary financial incentive for heat pump DHW, are declining in value as the
    scheme's deeming period shortens toward the 2030 end date, reducing the financial
    incentive precisely as rapid electrification would most benefit from it.
  lesson_learnt: Programs relying on STC-subsidised heat pump uptake should plan for
    declining STC values post-2025 and identify complementary or replacement incentives
    (state white label schemes, direct rebates) to maintain purchase economics; the
    STC sunset date creates a closing window for incentive-driven technology transition
    that should be explicitly managed in program timelines.
