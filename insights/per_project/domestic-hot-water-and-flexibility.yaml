  what_happened: The Ausgrid Hot Water Load Control trials found that Project 1 (installing
    control devices on small-tank DHW systems) had low customer response rates despite
    incentives, and Project 2 (targeting customers without control devices) had poor
    uptake due to upfront installation costs.
