- record_id: ARENA-DLV-35071
  source_title: UTS Domestic Hot Water and Flexibility Report
  publish_date: 2023-05
  project_name: Domestic Hot Water and Flexibility
  what_happened: Modelling found there is no trade-off between efficiency and flexibility
    in DHW policy — all three alternative scenarios (Highly Flexible, Highly Efficient,
    Rapid Electrification) produced significantly better outcomes than Business as
    Usual on emissions, consumer costs, and flexible demand, with Highly Efficient
    and Highly Flexible delivering similar aggregate benefits.
  lesson_learnt: Program designers should not frame DHW electrification as a binary
    choice between heat pumps (efficiency) and smart resistance heaters (flexibility)
    — the evidence supports pursuing both in parallel using a decision-tree approach
    (heat pumps where feasible, smart resistance otherwise), which maximises portfolio
    outcomes without sacrificing either objective.
