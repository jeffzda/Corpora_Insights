- record_id: ARENA-DLV-35075
  source_title: UTS Domestic Hot Water and Flexibility Report
  publish_date: 2023-05
  project_name: Domestic Hot Water and Flexibility
  what_happened: Heat pump water heaters require outdoor installation space and are
    unsuitable for many apartments, while installation replacing a gas heater with
    an electric unit may require both a plumber and an electrician — multiple trades
    create a practical barrier that standard plumber-only replacement does not face.
  lesson_learnt: Heat pump deployment programs targeting apartment buildings or gas-to-electric
    switching should account for the multi-trade installation challenge in program
    logistics and cost estimates; simplifying licensing to allow qualified plumbers
    to complete single-trade electrification work would materially reduce installation
    barriers and cost.
