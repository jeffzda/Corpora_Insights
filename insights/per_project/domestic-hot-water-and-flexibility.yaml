  project_name: Domestic Hot Water and Flexibility
  what_happened: Australian building policies in the period leading to this study
    were driving an increasing proportion of new homes to install instantaneous gas
    water heaters — by 2035 gas DHW was projected to release 5.8 Mt CO2-e annually
    with over 75% from instantaneous gas — creating carbon and flexibility lock-in
    for at least 10–15 years.
  lesson_learnt: New building construction is the highest-leverage point for DHW technology
    transition — policy levers targeting new builds (NCC, state plumbing codes, development
    approvals) should be the first priority for electrification programs because every
    gas unit installed in a new home locks in emissions and forecloses flexibility
    for its full ~13-year lifetime.
