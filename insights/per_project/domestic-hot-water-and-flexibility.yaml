- record_id: ARENA-DLV-35051
  source_title: UTS Domestic Hot Water and Flexibility Report
  publish_date: 2023-05
  project_name: Domestic Hot Water and Flexibility
  what_happened: Modelling found that under a Business as Usual scenario, the flexible
    demand potential of Australia's domestic hot water fleet would reach only 9 GW
    / 19 GWh/day by 2040 — just 25% and 23% of AEMO's projected DER storage capacity
    — compared to 24 GW / 50 GWh/day under a Highly Flexible scenario.
  lesson_learnt: Without targeted policy intervention to electrify and activate flexible
    demand in the DHW fleet, a major grid resource will be stranded — projects and
    programs deploying smart DHW controls should frame the grid storage displacement
    value (up to $14.3 billion in avoided grid battery costs by 2040) as part of the
    business case to secure policy and regulatory support.
