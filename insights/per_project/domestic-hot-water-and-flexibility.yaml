- record_id: ARENA-DLV-35058
  source_title: UTS Domestic Hot Water and Flexibility Report
  publish_date: 2023-05
  project_name: Domestic Hot Water and Flexibility
  what_happened: When a domestic water heater fails, 46% of occupants contact a plumber
    directly, who typically recommends a like-for-like replacement using whatever
    is in stock, meaning technology transitions to heat pumps or smart-enabled units
    are systematically bypassed at end-of-life — the most common replacement pathway.
  lesson_learnt: Flexible DHW and heat pump programs that rely on end-of-life replacement
    as the uptake pathway must engage and incentivise the installer/plumber channel
    directly — without installer-side intervention (training, stock incentives, or
    performance standards), consumer-facing campaigns alone will not shift technology
    mix at replacement.
