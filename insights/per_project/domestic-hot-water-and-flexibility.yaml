  source_title: UTS Domestic Hot Water and Flexibility Report
  publish_date: 2023-05
  project_name: Domestic Hot Water and Flexibility
  what_happened: The Demand Management Incentive Scheme (DMIS) and Demand Management
    Innovation Allowance (DMIA) use kVA/year as the primary indicator for demand management
    proposals, which makes it difficult for DHW flexibility projects (measured in
    kWh) to qualify and access network incentive funding.
  lesson_learnt: Flexible DHW project proponents seeking DMIS/DMIA funding should
    engage with the AEMC/AER early to negotiate use of kWh-based metrics as an alternative
    to kVA/year, or to propose bespoke trial frameworks; the current metric mismatch
    is a regulatory barrier that requires proactive intervention rather than assuming
    standard eligibility.
