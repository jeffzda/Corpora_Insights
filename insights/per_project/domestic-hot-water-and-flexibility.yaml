  source_title: UTS Domestic Hot Water and Flexibility Report
  publish_date: 2023-05
  project_name: Domestic Hot Water and Flexibility
  what_happened: The AS/NZS 4755 demand response standard for DHW units is not mandatory
    — only DRM1 (no heating) is required for conformance, and the standard does not
    mandate a physical DRED-compatible connection on new units — leaving flexible
    demand capability optional and therefore largely absent from the installed base.
  lesson_learnt: Programs seeking to activate flexible demand from new DHW units at
    scale should push for mandatory DRED-compatible physical connections on all new
    storage water heaters as a minimum standard — even if communications protocols
    are not yet finalised — because retrofitting connectivity after installation is
    a major cost and participation barrier.
