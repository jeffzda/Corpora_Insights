- record_id: ARENA-DLV-35055
  source_title: UTS Domestic Hot Water and Flexibility Report
  publish_date: 2023-05
  project_name: Domestic Hot Water and Flexibility
  what_happened: Consumer research (Stenner et al. 2015, synthesised in this report)
    found that voluntary uptake of cost-reflective pricing is unlikely to exceed 5–10%
    of households, with status quo bias towards flat-rate tariffs being the dominant
    barrier to flexible demand activation.
  lesson_learnt: DHW flexibility programs targeting voluntary opt-in to cost-reflective
    tariffs should plan for very low initial uptake (<10%); program design should
    incorporate automation (timers, DREDs, smart meters) rather than relying on active
    consumer behaviour change, and consider default-on or opt-out enrolment to achieve
    meaningful scale.
