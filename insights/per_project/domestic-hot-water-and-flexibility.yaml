- record_id: ARENA-DLV-35056
  source_title: UTS Domestic Hot Water and Flexibility Report
  publish_date: 2023-05
  project_name: Domestic Hot Water and Flexibility
  what_happened: Current controlled load tariff discounts in the NEM (typically <30%
    off standard tariffs) are insufficient to incentivise consumers to activate flexible
    demand through resistance DHW rather than upgrade to a heat pump, which achieves
    lifetime cost parity at approximately a 65% tariff discount — close to the solar
    feed-in tariff rate of 61.8%.
  lesson_learnt: Tariff design for flexible resistance DHW must offer discounts approaching
    60–65% of standard rates to compete with the lifetime economics of heat pump upgrades;
    current DNSP controlled-load discounts of <30% are structurally inadequate and
    will not drive flexible demand activation at scale.
