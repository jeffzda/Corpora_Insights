- record_id: ARENA-DLV-35078
  source_title: UTS Domestic Hot Water and Flexibility Report
  publish_date: 2023-05
  project_name: Domestic Hot Water and Flexibility
  what_happened: The Parkes NSW 'Solar Soak' trial (2021–ongoing) used smart meter
    functionality to shift controlled DHW load into the solar soak period, using the
    smart meter as the load controller rather than an external relay — providing a
    scalable template for flexible DHW using existing AMI infrastructure.
  lesson_learnt: Smart meter programs being rolled out by retailers and DNSPs represent
    an existing deployment vehicle for flexible DHW that does not require separate
    hardware; programs should assess whether the AMI infrastructure being deployed
    includes the relay and communication capability needed for DHW load control, and
    if so, negotiate its activation as a standard feature of smart meter installation.
