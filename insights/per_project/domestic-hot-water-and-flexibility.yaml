  what_happened: The report identified that ripple control — the dominant existing
    mechanism for DHW load shifting — is currently limited to Queensland and NSW,
    and existing DNSP timer and clock controls require site visits to enable solar
    soaking, meaning the majority of the NEM's off-peak DHW fleet (~3 million units,
    ~10,750 MW) is not optimised for daytime solar periods.
