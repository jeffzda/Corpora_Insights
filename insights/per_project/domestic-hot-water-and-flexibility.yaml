- record_id: ARENA-DLV-35057
  source_title: UTS Domestic Hot Water and Flexibility Report
  publish_date: 2023-05
  project_name: Domestic Hot Water and Flexibility
  what_happened: The National Construction Code 2022 (NCC 2022) effectively prohibits
    installation of electric resistance water heaters in new builds across most of
    Australia (except Tasmania) because their grid-electricity emissions intensity
    exceeds the 100 g CO2-e/MJ threshold — yet imposes no equivalent restriction on
    instantaneous gas water heaters, which emit ~76 g CO2-e/MJ.
  lesson_learnt: Projects and programs seeking to deploy electric resistance DHW as
    a flexible demand resource in new buildings face a direct policy barrier from
    NCC 2022 that simultaneously protects gas; proponents should engage with the NCC
    2025 review cycle and state plumbing code processes to remove this asymmetry before
    investing in resistance-DHW flexibility programs targeting new builds.
