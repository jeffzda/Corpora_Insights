- record_id: ARENA-DLV-35076
  source_title: UTS Domestic Hot Water and Flexibility Report
  publish_date: 2023-05
  project_name: Domestic Hot Water and Flexibility
  what_happened: A study by Hungerford et al. (2016) synthesised in this report found
    that optimised DHW control reducing solar spill by 30–40% slightly increased NEM
    emissions by 0.01% under 2015–2020 grid conditions, because the load-flattening
    effect shifted dispatch from OCGT to black coal — showing that flexible DHW emissions
    benefits are grid-condition dependent.
  lesson_learnt: Flexible DHW programs should not assume emissions co-benefits are
    automatic — under grid conditions with significant coal generation, optimised
    solar-soaking can marginally increase emissions due to dispatch order effects;
    emission benefits should be evaluated under current and forecast grid conditions
    rather than assumed as a given.
