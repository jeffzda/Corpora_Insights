  source_title: UTS Domestic Hot Water and Flexibility Report
  publish_date: 2023-05
  project_name: Domestic Hot Water and Flexibility
  what_happened: The Rheem Active Hot Water Control trial (targeting ~2,400 DHW units
    in South Australia) experienced delays caused by COVID-19 and semiconductor chip
    supply chain disruptions, and found it difficult to achieve substantial uptake
    of the costlier active control system, particularly in the breakdown/replacement
    market.
  lesson_learnt: Flexible DHW trials that rely on active-control hardware are vulnerable
    to semiconductor supply chain disruptions; trials should build hardware buffer
    stock or qualify alternative chipsets before launch, and must specifically address
