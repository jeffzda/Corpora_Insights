- record_id: ARENA-DLV-35074
  source_title: UTS Domestic Hot Water and Flexibility Report
  publish_date: 2023-05
  project_name: Domestic Hot Water and Flexibility
  what_happened: The existing off-peak DHW fleet across major NEM DNSPs represents
    approximately 2.99 million units and 10,750 MW of untapped flexible demand capacity,
    with the majority already on controlled load circuits but largely scheduled during
    overnight periods that no longer align with the need to absorb excess daytime
    solar generation.
  lesson_learnt: The highest-impact near-term flexible demand intervention is to reprogram
    existing ripple-controlled and timer-controlled DHW units to solar hours — this
    requires no new consumer hardware and can be achieved within existing regulatory
    frameworks, making it the most cost-effective first step before investing in new
    smart-meter or DRED deployments.
