  project_name: Ivanpah CSP Power Plant
  what_happened: The 392 MW Ivanpah concentrated solar power plant in the USA experienced
    a four-year integration ramp-up period before reaching stable generation performance.
  lesson_learnt: CSP and other high-complexity renewable generation technologies should
    be modelled with multi-year ramp-up periods in financial and operational forecasts
    — the Ivanpah experience indicates four years may be required for large-scale
    first-of-kind CSP installations.
