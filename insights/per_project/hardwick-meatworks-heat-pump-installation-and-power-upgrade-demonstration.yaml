  what_happened: In the days before the scheduled HV power upgrade works, the network
    provider suddenly required a major communications device to remotely monitor and
    control Hardwick's existing renewable assets (battery and solar). Rather than
    delay the overall project, Hardwick's proceeded with the upgrade and took the
    renewable assets offline. The LV-to-HV changeover, originally scheduled for end
    of October 2022, did not occur until early December 2022, and the renewable assets
    communications works remained uncommissioned as of the reporting date, forcing
    significant additional grid power purchases.
  lesson_learnt: Hold formal face-to-face meetings with the network provider early
    in project planning when works involve both HV upgrades and renewable asset reconfiguration
    — the network's inexperience with small distributed generators meant a critical
    communications requirement was not identified until days before scheduled works,
    taking renewable assets offline and shifting the cutover by approximately six
    weeks.
