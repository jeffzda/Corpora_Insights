- record_id: ARENA-DLV-27154
  source_title: Hardwick Meatworks Heat Pump Installation and Power Upgrade Demonstration
    - Lessons Learnt Report 2
  publish_date: 2023-03
  project_name: Hardwick Processors Proprietary Limited Heat Pump Project
  what_happened: The initial heat pump sizing analysis was conducted over three years
    before project completion. By the time the heat pump was installed and commissioned,
    site water usage had increased by 20%, and production-driven variability of more
    than ±20% in water usage was common. The project team was still working through
    balancing heat pump hot water generation with varying plant demand at the time
    of reporting.
  lesson_learnt: Do not rely on demand analyses performed several years before equipment
    procurement for dynamic industrial processes — collect accurate instantaneous
    flow data and a 7-day usage profile immediately before design freeze to reduce
    the risk of incorrect equipment sizing, and design in operational flexibility
    (e.g. a parallel gas backup) to accommodate ±20% or greater demand variability.
