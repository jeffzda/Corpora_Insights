  project_name: Hardwick Processors Proprietary Limited Heat Pump Project
  what_happened: The requirement for ammonia detection systems in the new heat pump
    plant room was overlooked at the design phase. When identified, the electrical
    scope had to be expanded to include ammonia detection sensors, an automated electrical
    shunt trip, and mechanical ventilation to comply with electrical code requirements
    for explosive gas concentrations near electrical equipment.
  lesson_learnt: Conduct a thorough regulatory and building code compliance review
    at design phase when installing heat pumps in industrial settings that use ammonia
    refrigerant — ammonia detection, shunt trip, and mechanical ventilation are mandatory
    code requirements that, if missed at design, result in unbudgeted scope additions
    during construction.
