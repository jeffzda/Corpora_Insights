    fully completed before the business case was developed, resulting in design assumptions
    that needed revision as more detailed understanding of site-specific integration
    requirements (thermal storage, power infrastructure, control logic) emerged.
  lesson_learnt: Conduct a formal pre-feasibility study before developing a business
    case for industrial heat pump integration — ammonia refrigeration systems are
    not plug-and-play, and without pre-feasibility work the business case will rest
    on assumptions that are likely to require revision, particularly around equipment
    sizing and control integration.
