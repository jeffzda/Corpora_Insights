  what_happened: The heat pump and oil coolers were switched off at weekends and not
    used to heat water in pre-heat tanks, because heat would be lost from stored water
    before Monday startup, causing excessive cold water conditions. The absence of
    a return loop and associated controls prevented effective weekend pre-heating.
  lesson_learnt: Design industrial heat pump systems with a recirculation loop and
    associated controls to allow continuous pre-heat tank heating during non-production
    periods — without this, weekend shutdown of the heat pump negates potential weekend
    thermal inventory accumulation and reduces overall system utilisation.
