  project_name: Hardwick Meat Works Heat Pump Project
  what_happened: The business case for the heat pump project was initially scoped
    around energy cost and carbon savings, but the project team identified that co-benefits
    — reduced water consumption, lower condenser fan power, reduced head pressure,
    and avoided capital for condenser and boiler capacity — were also material and
    needed to be included to justify the investment.
  lesson_learnt: When building the business case for industrial heat pump retrofits,
    include all co-benefits (water savings, reduced condenser fan power, avoided boiler
    and condenser capital) alongside energy cost savings — omitting these can result
    in underestimation of project value and failure to gain approval.
