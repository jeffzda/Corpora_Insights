  what_happened: At the time of reporting, performance benchmarks for the heat pump
    had not yet been established. Benchmarking was still being developed post-commissioning,
    with the intent to track metrics such as cost per kilogram of meat produced. Without
    benchmarks in place from the outset, the project team lacked a baseline against
    which to optimise system operation for varying production levels and input costs.
  lesson_learnt: Develop operational performance benchmarks and a monitoring framework
    in parallel with project delivery — not after commissioning — so that a baseline
    exists from first operation and skilled technicians are ready to optimise the
    system from day one against varying production and input cost conditions.
