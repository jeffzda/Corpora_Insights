  project_name: Hardwick Meatworks Heat Pump Installation and Power Upgrade Demonstration
  what_happened: The refrigeration contractor identified that temperature control
    sensors for oil cooler heat recovery systems were installed in the cooling water
    circuit rather than in the oil circuit itself, resulting in slower reaction times
    and non-uniform return oil temperatures from the oil coolers.
  lesson_learnt: When installing oil cooler heat recovery systems on industrial refrigeration
    plants, install control temperature sensors in the oil circuit (not the cooling
    water circuit) — this improves reaction time, delivers more uniform return oil
    temperatures, and stabilises pre-heat water flows through the heat exchangers.
