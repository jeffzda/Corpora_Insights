- record_id: ARENA-DLV-18153
  source_title: Hardwick Meatworks Heat Pump Installation and Power Upgrade Demonstration
    - Lessons Learnt Report 1
  publish_date: 2022-04
  project_name: Hardwick Meat Works Heat Pump Project
  what_happened: Detailed integration and control design for the heat pump, refrigeration
    condenser, and water management could not be finalised during feasibility; this
    work had to be completed during the engineering and design phase, requiring development
    of a full P&ID and functional description.
  lesson_learnt: Develop an accurate P&ID and associated functional description before
    finalising equipment orders — this is essential to effectively integrate a heat
    pump into existing ammonia refrigeration and hot water systems and to firm up
    sizing of upgraded recovery circuits and instrumentation.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: industrial operator
  delay_category: data/validation/testing
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: A full P&ID and functional description were developed during
    the engineering phase, allowing finalisation of control logic, hot water system
    sizing, and instrumentation specification.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: industrial renewables
  source_pages: &id003
  - 2
  - 4
  evidence_excerpt: The key lesson was the importance of developing an accurate Piping
    and Instrumentation Diagram ("P&ID") and associated functional description so
    that the new heat pump and oil heat recovery could be effectively integrated into
    existing tanks and at the same time satisfy the variable hot water demands for
    the site.
