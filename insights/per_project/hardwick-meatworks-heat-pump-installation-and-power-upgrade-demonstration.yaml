  project_name: Hardwick Meatworks Heat Pump Installation and Power Upgrade Demonstration
  what_happened: During commissioning of the 1 MW heat pump, multiple technical issues
    were identified and required rectification, including air locks in oil cooling
    lines, compressor oil sump heating problems, higher-than-planned pressure drops
    across the oil separator, vibrations on the heat pump skid, and optimisation of
    the expansion valve and level probe controls.
  lesson_learnt: Industrial heat pump commissioning should anticipate a significant
    rectification phase — plan for air lock resolution, pressure drop calibration,
    vibration isolation, and control system tuning as distinct commissioning tasks,
    not post-commissioning activities.
