- record_id: ARENA-DLV-18151
  source_title: Hardwick Meatworks Heat Pump Installation and Power Upgrade Demonstration
    - Lessons Learnt Report 1
  publish_date: 2022-04
  project_name: Hardwick Meat Works Heat Pump Project
  what_happened: Project management was complicated by a long project approval timeframe,
    COVID-19 impacts, and cost variation risks. Copper prices for HV upgrades and
    exchange rate movements for imported heat pump compressors increased costs beyond
    initial estimates.
  lesson_learnt: Build flexibility into project management and budget estimates prior
    to project approval — for projects involving new or imported technologies, commodity
    price movements and exchange rate fluctuations between feasibility and approval
    can materially erode cost estimates.
