  publish_date: 2023-03
  project_name: Hardwick Processors Proprietary Limited Heat Pump Project
  what_happened: The original project scope left existing renewable assets (battery
    and solar) connected to the old main LV switchboard to minimise complexity. A
    scope change was later agreed to bring all renewable assets onto the new HV board,
    ensuring balanced distribution across the entire plant. This unplanned scope addition
    increased project complexity and required PLC integration with multiple existing
    control systems during an already active construction phase that also coincided
    with a parallel site-wide optic-fibre data cabling upgrade.
  lesson_learnt: When planning a site HV upgrade, integrate all existing renewable
    assets onto the new HV board from the outset rather than leaving them on legacy
    LV infrastructure — retrofitting this later adds scope, complexity, and PLC integration
    risk, whereas doing it upfront results in a cleaner system architecture and simplifies
    future renewable upgrades.
