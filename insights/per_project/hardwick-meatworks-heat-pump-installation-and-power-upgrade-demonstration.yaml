- record_id: ARENA-DLV-27155
  source_title: Hardwick Meatworks Heat Pump Installation and Power Upgrade Demonstration
    - Lessons Learnt Report 2
  publish_date: 2023-03
  project_name: Hardwick Processors Proprietary Limited Heat Pump Project
  what_happened: Retrofitting the heat pump into an existing industrial plant required
    extensive PLC integration across refrigeration, hot water, renewable energy, and
    network communications control systems. The integration was successfully delivered
    because the project was run internally and the programmers used had been involved
    in developing all existing PLCs and had deep knowledge of the entire plant. The
    project also engaged the site's long-standing refrigeration contractor of 25 years
    and utilised internal trades for plumbing and electrical works, which kept costs
    down and ensured maintenance staff understood the installed system.
  lesson_learnt: For complex heat pump or industrial decarbonisation retrofits, prioritise
    contractors and programmers with specific site history over lower-cost external
    alternatives — site-experienced staff dramatically reduce the time and resources
    needed for PLC integration and controls planning, and their involvement builds
    internal operational capability for long-term performance.
