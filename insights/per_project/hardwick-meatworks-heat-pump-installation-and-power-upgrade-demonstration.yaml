  project_name: Hardwick Meatworks Heat Pump Installation and Power Upgrade Demonstration
  what_happened: The heat pump outlet temperature set points were adjusted from the
    originally projected ~75°C to an operating range of 68–74°C, while combined flow
    rates through the system were increased. The overall preheat temperatures were
    slightly lower than projected, offset by increased flow.
  lesson_learnt: Heat pump temperature set points in industrial hot water applications
    should be treated as operational variables to be optimised post-commissioning
    rather than fixed design targets — operating at a lower temperature with higher
    flow may deliver equivalent or better overall thermal output and extend equipment
    operating life.
