- record_id: ARENA-DLV-58822
  source_title: 'DER Customer Insights: The Customer Journey'
  publish_date: 2020-07
  project_name: UTS Networks Renewed VPP
  what_happened: The UTS-led Networks Renewed trial demonstrated that both solar PV and batteries can provide network voltage support services, addressing a key operational challenge (high voltage disconnection)
    identified in other trials such as AGL's VPP.
  lesson_learnt: DER assets — solar and batteries together — can provide active voltage support to the distribution network; projects deploying VPPs in voltage-constrained areas should explore network support
    services as a co-benefit that can also improve individual asset availability.
