  evidence_excerpt: Early movers have found numerous commercial, technical and regulatory
    issues which are holding back development of the market. This includes uncertainty
    around the viability of certain revenue streams, demonstrating the capability
    of batteries to resolve technical energy system challenges (i.e. inertia, system
    strength, islanding), and considering the regulatory reform required to allow
    storage systems to be registered and dispatched.
