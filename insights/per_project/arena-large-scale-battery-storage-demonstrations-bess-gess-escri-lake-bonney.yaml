- record_id: ARENA-DLV-15817
  source_title: Evaluation of ARENA's Impact and Effectiveness
  publish_date: 2019-11
  project_name: ARENA Large-Scale Battery Storage Demonstrations (BESS, GESS, ESCRI,
    Lake Bonney)
  what_happened: Four ARENA-funded large-scale battery storage demonstration projects
    (Ballarat BESS 30MW, Gannawarra GESS 30MW/50MWh, ESCRI 30MW/8MWh, Lake Bonney
    25MW/52MWh) collectively demonstrated that large-scale batteries can provide wholesale
    energy arbitrage, FCAS, fringe-of-grid islanding, and system integrity services.
    Early movers encountered significant commercial, technical and regulatory issues
    including uncertainty around revenue streams and regulatory treatment.
  lesson_learnt: First-of-kind large-scale battery projects should be structured as
    explicit demonstrations with knowledge-sharing obligations — the regulatory and
    commercial framework for battery storage was insufficiently developed at time
    of deployment, and only coordinated demonstration programs with shared learnings
    resolved these barriers efficiently.
