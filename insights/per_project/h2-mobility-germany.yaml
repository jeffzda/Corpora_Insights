- record_id: ARENA-DLV-37914
  source_title: Hydrogen Communities & H2City Tool
  publish_date: 2019-06
  project_name: H2 Mobility Germany
  what_happened: The H2 Mobility project in Germany found that placing initial hydrogen refuelling stations in large metropolitan areas and along major arterial highways — and integrating them with existing
    petrol stations — was effective for building consumer awareness and community buy-in for FCEV technology.
  lesson_learnt: Locate early hydrogen refuelling stations at high-visibility sites in metro areas and on major highways, integrated with existing petrol station infrastructure where possible — this maximises
    consumer exposure, normalises the technology, and leverages familiar refuelling contexts to accelerate public acceptance.
