- record_id: ARENA-DLV-37915
  source_title: Hydrogen Communities & H2City Tool
  publish_date: 2019-06
  project_name: H2 Mobility Germany
  what_happened: The H2 Mobility project found that continued German federal government support was critical to keeping the hydrogen refuelling station roll-out on schedule toward the target of 400 stations
    by 2023.
  lesson_learnt: Sustained government financial and policy support is a prerequisite for keeping hydrogen mobility infrastructure roll-out programs on schedule — projects that rely on a transition to private
    capital before market maturity are at risk of missing deployment targets.
