- record_id: ARENA-DLV-28110
  source_title: Insights from Freight Transport Electrification Across Port, Express
    Parcels & Last-Mile Deliveries
  publish_date: '2025-08-05'
  project_name: Depot of the Future Vehicle Electrification Project (Team Global Express);
    Patrick Terminals – BEV Terminal Trucks at the Port of Fremantle; Last Mile Delivery
    Vehicle Electrification Project (ANC)
  what_happened: Analysis across all three ARENA-funded freight electrification projects
    found no equivalent large-scale Australian fleet electrification studies available
    for benchmarking, with the most robust international datasets coming from California
    trials that may not directly translate to Australian operating conditions, fleet
    characteristics, or policy settings.
  lesson_learnt: Australian freight electrification projects are operating in a data
    vacuum — there is no domestic reference class for range requirements, real-world
    efficiency, or grid impacts. Project developers and planners should treat international
    data as directional only and invest in rigorous data collection and sharing to
    build an Australian evidence base.
