- record_id: ARENA-DLV-67055
  source_title: 'Ramp Rate Control for PV Plant Integration: Experience from Karratha
    Airport''s Hybrid Power Station'
  publish_date: '2019'
  project_name: Karratha Airport Hybrid Power Station
  what_happened: Curtailment losses averaged 1.93% of available yield over the three-year
    period but reached up to 10% on individual days. Counter-intuitively, curtailment
    loss was not strongly correlated with the variability index because the conservative
    CPT trigger threshold caused curtailment on relatively clear days whenever the
    forecast probability exceeded the threshold.
  lesson_learnt: Curtailment losses in CPT-assisted ramp rate control are driven by
    forecast conservatism as much as by actual cloud variability; yield loss modelling
    should not rely solely on variability index but should explicitly model false-positive
    curtailment frequency under the chosen trigger threshold.
