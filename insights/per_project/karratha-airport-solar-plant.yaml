- record_id: ARENA-DLV-22259
  source_title: Karratha Airport Solar Public Impact Report
  publish_date: '2018-06-28'
  project_name: Karratha Airport 1MW Solar Project
  what_happened: The project demonstrated that solar PV with cloud prediction and
    battery ramp-rate control could meet Horizon Power's strict grid connection requirements
    on the North-West Interconnected System (NWIS) — an isolated network whose gas
    turbine generators cannot respond quickly enough to solar output fluctuations
    — providing a replicable reference site for other isolated Australian and international
    networks.
  lesson_learnt: Cloud prediction combined with battery ramp-rate support is a viable
    grid-connection compliance pathway for solar PV on isolated networks with fast-response
    generation constraints; this reference site provides evidence that network operators
    on similar systems can accept lower battery storage specifications than their
    current conservative requirements.
