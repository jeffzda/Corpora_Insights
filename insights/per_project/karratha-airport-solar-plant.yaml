- record_id: ARENA-DLV-67054
  source_title: 'Ramp Rate Control for PV Plant Integration: Experience from Karratha
    Airport''s Hybrid Power Station'
  publish_date: '2019'
  project_name: Karratha Airport Hybrid Power Station
  what_happened: Real-world cloud prediction technology exhibited significant false
    positive rates — triggering curtailment on 65% of all operating days, and on 54%
    of relatively clear days (variability index 0.8–1.2) — because the control system
    had to be configured conservatively to avoid non-compliance from false negatives.
  lesson_learnt: CPT false-positive rates in operational ramp rate control systems
    are substantially higher than assumed in simulation studies that use perfect forecast
    assumptions; designers must account for this when estimating yield loss and negotiating
    network technical compliance terms — if the network allows a small number of exceedances
    per year, CPT trigger thresholds can be relaxed to materially reduce curtailment
    losses.
