  what_happened: High-frequency (1-second interval) data collection across a large
    number of sensors produced datasets too large for Microsoft Excel to manage, and
    the battery system data was stored separately from the main meter and PV plant
    data, making combined analysis difficult and time-consuming.
  lesson_learnt: Projects collecting high-resolution operational data from multiple
    subsystems should adopt a database solution rather than spreadsheet tools from
    the outset, and consolidate all data streams into a single system to enable efficient
    cross-system analysis.
