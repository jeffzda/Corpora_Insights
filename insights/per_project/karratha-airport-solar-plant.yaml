- record_id: ARENA-DLV-22252
  source_title: Karratha Airport Solar Public Impact Report
  publish_date: '2018-06-28'
  project_name: Karratha Airport 1MW Solar Project
  what_happened: The battery storage system was found to be oversized relative to
    actual operational requirements — battery inverter support capacity was 47% of
    nominal PV inverter AC capacity (approximately half the current Horizon Power
    specification), yet met smoothing requirements 99.9% of the time, with no identified
    cases of curtailment due to insufficient battery storage.
  lesson_learnt: In the absence of prior operational data, first-of-kind solar-plus-storage
    projects on isolated networks tend to oversize battery capacity as a conservative
    design choice; future projects should use operational data and system modelling
    from reference sites to right-size battery banks and reduce capital cost.
