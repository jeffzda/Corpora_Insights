  source_title: Karratha Airport Solar Public Impact Report
  publish_date: '2018-06-28'
  project_name: Karratha Airport 1MW Solar Project
  what_happened: Dirt build-up on the CloudCAM™ cloud prediction camera lens was identified
    as a risk to prediction accuracy in remote, high-dust environments; however, periodic
    heavy rainfall naturally cleaned the lens between scheduled biannual maintenance
    cleans, and prediction performance was maintained.
  lesson_learnt: When deploying cloud prediction technology in remote or geographically
    isolated locations, include explicit O&M provisions for regular lens cleaning
    and consider anti-perching measures on CPT tower structures to prevent fouling
    that degrades forecast accuracy.
  issue_severity: moderate
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: project developer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: Sensor lens is cleaned twice per year as part of the maintenance
    plan; heavy rain events also cleaned the lens between scheduled maintenance visits.
  transferability: narrow
  delay_magnitude: null
  technology_domain: solar PV
  source_pages:
  - 6
  - 12
  evidence_excerpt: The CPT tower provides a ledge where animals, such as birds, can
    rest. This may result in a build-up of excrement and dust on the camera lens,
    which reduces the ability for effective detection and response. This has proven
    to be an issue and should be considered when deploying into geographically remote
    and/or isolated areas.
