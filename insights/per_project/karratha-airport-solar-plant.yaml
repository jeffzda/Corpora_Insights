  what_happened: Analysis showed that without the cloud detection system, the required
    number of batteries would have needed to be doubled and operated at higher discharge
    rates to maintain acceptable ramp-rates, significantly increasing capital and
    operating costs.
  lesson_learnt: Investing in a cloud prediction system for solar-plus-storage projects
    on constrained isolated networks can halve the required battery bank size and
    reduce operating costs — the cost-benefit case for predictive cloud technology
    should be evaluated against battery capital savings in any future project design.
