  what_happened: The BESS energy capacity was designed conservatively to support three
    consecutive worst-case downward ramps with no intervening charge opportunity,
    but operational data over three years showed depth of discharge rarely exceeded
    40% and the BESS was not called upon at all on almost half of all days examined.
  lesson_learnt: BESS energy capacity for ramp rate control applications is routinely
    over-sized when designed for worst-case consecutive events; use operational variability
    index data to right-size energy capacity, noting that a smaller capacity increases
    cycle count and may reduce battery life.
