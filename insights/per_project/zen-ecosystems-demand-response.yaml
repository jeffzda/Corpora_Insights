- record_id: ARENA-DLV-60765
  source_title: Zen Ecosystems Project Performance Report Winter 2018
  publish_date: '2019-02-15'
  project_name: ARENA/AEMO DR Trial (Zen Ecosystems)
  what_happened: Scaling refrigeration DR to 1 MW would require approximately 1,190
    individual commercial hospitality sites based on observed average DR delivery
    of 0.84 kW per site, highlighting the significant aggregation challenge for this
    load type relative to the opportunity size of hundreds of thousands of devices
    nationally.
  lesson_learnt: Refrigeration DR aggregators should plan for very large site counts
    (>1,000 sites for 1 MW) given the small per-site contribution; business models
    must account for the costs of onboarding and maintaining connectivity across large
    numbers of small hospitality sites, and technology partners must demonstrate reliable
    NMI recovery and device compliance at scale before committing to DR volumes.
