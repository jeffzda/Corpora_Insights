- record_id: ARENA-DLV-60752
  source_title: Zen Ecosystems Project Performance Report Winter 2018
  publish_date: '2019-02-15'
  project_name: ARENA/AEMO DR Trial (Zen Ecosystems)
  what_happened: The AEMO adjusted baseline methodology produced inaccurate — and
    in several cases negative — results for behavioural and temperature-dependent
    HVAC loads, because it used morning consumption data to adjust the baseline when
    afternoon conditions (temperature, solar) were materially different from the morning,
    resulting in a baseline that fell below actual demand even during a visible DR
    response.
  lesson_learnt: The AEMO adjusted baseline methodology is unsuitable for temperature-sensitive
    and behavioural loads on days with atypical morning-to-afternoon temperature variation;
    DR programs using these load types should develop and propose alternative baseline
    methodologies (e.g. linear line of best fit over the event window) and document
    the discrepancy to regulators before committing to AEMO's official measurement
    approach.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: data/validation/testing
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: Zen Ecosystems developed an alternative linear baseline methodology
    using a line of best fit between pre- and post-event energy usage, which produced
    results consistent across two test events (~27–28 kW for the RACV cohort) and
    was proposed to ARENA for future adoption.
  transferability: broad
  delay_magnitude: null
  technology_domain: demand response
  source_pages:
