  what_happened: Recruitment for the Zen Air residential cohort was restricted to
    'family and friends' of Zen Ecosystems and Planet Innovation due to the late 2018
    release date of Zen Air, resulting in only 20 devices deployed and a demographically
    skewed participant pool (95% male, all technology-savvy adults aged 30–45).
