- record_id: ARENA-DLV-60763
  source_title: Zen Ecosystems Project Performance Report Winter 2018
  publish_date: '2019-02-15'
  project_name: ARENA/AEMO DR Trial (Zen Ecosystems)
  what_happened: The PI 'Save the Grid' internal staff trial (50 NMIs) served as a
    scaled precursor to the larger RACV programme, allowing ZE to test messaging,
    participation confirmation mechanics, and incentive structures before the public
    launch; the confirmed participation rate across three test events averaged around
    54%.
  lesson_learnt: Running a small internal or staff DR trial before a large public
