    36% of summer DR delivery (47 kW) despite HVAC systems being turned off completely,
    because mild winter temperatures meant baseline heating loads were low and the
    test day preceded any extreme cold days.
  lesson_learnt: In Australian conditions, HVAC-based DR portfolios should not be
    evaluated against a single-season test; winter DR capacity is structurally lower
    due to mild temperatures but may support longer-duration events, and test regimes
    and DR products should be designed to reflect these seasonal asymmetries rather
    than using a single measurement standard.
