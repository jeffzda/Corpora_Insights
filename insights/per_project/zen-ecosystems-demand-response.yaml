  source_title: Zen Ecosystems Project Performance Report Winter 2018
  publish_date: '2019-02-15'
  project_name: ARENA/AEMO DR Trial (Zen Ecosystems)
  what_happened: The behavioural DR programme delivered an estimated 27.89 kW from
    117 confirmed RACV participants (0.24 kW/person) during the 27 February event
    under ZE's alternative baseline, but the programme costs — including incentives
    and administration — exceeded DR payments delivered, making the programme commercially
    unviable at the tested scale.
  lesson_learnt: Behavioural DR programmes must achieve sufficient confirmed-participant
    scale and per-participant load reduction to cover incentive and programme administration
    costs; at sub-1,000 confirmed-participant scale with ~0.24 kW/person reduction,
    DR revenue will not cover programme costs and the model requires either higher
    participation rates, lower incentive costs, or a significantly larger enrolled
    base.
