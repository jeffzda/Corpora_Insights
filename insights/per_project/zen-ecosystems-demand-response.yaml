  source_title: ARENA/AEMO DR Trial Project Performance Report Summer 2019
  publish_date: '2019-08-19'
  project_name: ARENA/AEMO Demand Response Trial
  what_happened: In residential settings, individual occupants could override DR event
    controls the moment they experienced discomfort, whereas in commercial buildings
    only a site manager could decide to override, making commercial HVAC DR more controllable
    and predictable than residential.
  lesson_learnt: DR programme designers should model residential and commercial sites
    as distinct demand response archetypes — residential sites have a higher and less
    predictable override rate due to individual occupant autonomy, which should be
    reflected in dispatch models, capacity estimates, and participant incentive structures.
