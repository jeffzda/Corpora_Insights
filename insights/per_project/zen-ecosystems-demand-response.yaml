- record_id: ARENA-DLV-15157
  source_title: ARENA/AEMO DR Trial Project Performance Report Summer 2019
  publish_date: '2019-08-19'
  project_name: ARENA/AEMO Demand Response Trial
  what_happened: Zen Air (IR-based, no wiring required) achieved 95% split-system
    compatibility and 15-minute install time compared to 30–40% ducted system compatibility
    and 45-minute install for the wired Zen Thermostat, due to the proprietary wired
    communications protocols used by ducted HVAC manufacturers.
  lesson_learnt: IR-based control significantly outperforms wired thermostat control
    on compatibility and installation speed for residential split-system DR programmes
    — programme designers should account for the limitation that IR-based devices
    cannot guarantee knowledge of current aircon state if the occupant uses the manual
    remote.
