  source_title: Zen Ecosystems Project Performance Report Winter 2018
  publish_date: '2019-02-15'
  project_name: ARENA/AEMO DR Trial (Zen Ecosystems)
  what_happened: During summer 2018 test events, the commercial refrigeration load
    controlled via Frigbot (triggering defrost cycles) showed no discernible DR reduction
    in NMI data — the 8 February event even recorded a spike in consumption — resulting
    in an assessed DR delivery of 0 kW despite Frigbot confirming all devices entered
    defrost cycle.
  lesson_learnt: Refrigeration defrost-cycle DR load may be masked by co-located high-consumption
    equipment (HVAC, kitchen appliances) at the NMI level during summer; validate
    that the expected load reduction signal is distinguishable at NMI granularity
    before including this load type in a DR portfolio, and test during low-background-load
    periods (e.g. winter) to confirm device functionality.
