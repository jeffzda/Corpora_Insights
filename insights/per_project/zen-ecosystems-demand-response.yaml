- record_id: ARENA-DLV-60751
  source_title: Zen Ecosystems Project Performance Report Winter 2018
  publish_date: '2019-02-15'
  project_name: ARENA/AEMO DR Trial (Zen Ecosystems)
  what_happened: Zen Ecosystems, as a non-retailer, could not economically retrieve
    energy data for more than approximately 50 NMIs, meaning the DR performance of
    participants who signed up could not be individually evaluated, making it very
    difficult to provide incentives and reimbursement to participants.
  lesson_learnt: Demand response programs operated by non-retailers require a regulatory
    or contractual mechanism granting data access when customers provide NMIs for
    DR — without this, performance evaluation and participant reimbursement are fundamentally
    broken. Advocate for a universal rule that customer NMI provision for DR implies
    consent for energy data access by the program operator.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: data/validation/testing
  failure_mode: regulatory & approvals
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: coordination & stakeholders
  intervention_note: AEMO provided cohort-level NMI data (without exposing individual
    NMI data) as a partial workaround, allowing load-type performance groupings but
    not resolving participant-level incentive or reimbursement issues.
  transferability: broad
  delay_magnitude: null
  technology_domain: demand response
  source_pages:
  - 15
  - 16
  - 17
  - 22
  evidence_excerpt: As Zen Ecosystems is not an energy retailer we could not economically
    retrieve energy data for large (e.g. >50) amounts of NMI's. This means the performance
    of those NMI's that have signed up for DR with Zen Ecosystems cannot have their
    performance evaluated. This makes providing incentives and reimbursement for participants
    very difficult and as reimbursement for cutting load is one of the fundamentals
    of providing the program, this is a significant issue for running a successful
    program.
