- record_id: ARENA-DLV-60756
  source_title: Zen Ecosystems Project Performance Report Winter 2018
  publish_date: '2019-02-15'
  project_name: ARENA/AEMO DR Trial (Zen Ecosystems)
  what_happened: The RACV 'Help the Grid' behavioural DR programme successfully recruited
    over 1,400 NMI participants using a partnership with RACV, media coverage, and
    a single large prize incentive; however, actual confirmed event participation
    was low (approximately 117 of ~1,400 submitted for reconciliation on the benchmark
    event), and the programme was not pursued in winter as community interest in grid
    reliability had waned.
  lesson_learnt: Behavioural DR programmes relying on partner-brand awareness and
    grid-reliability sentiment can recruit large cohorts but face persistent participation
    verification challenges; combining a trusted consumer-brand partner with simple
    confirmation mechanisms and accurate participation tracking is essential, as unconfirmed
    participants inflate cohort size and depress measured performance.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: null
  failure_mode: data & measurement
  outcome_class: partial success
  secondary_failure_mode: commercial & market
  intervention_note: For the 27 February event, ZE submitted only the 117 confirmed-participant
    NMIs to AEMO rather than the full 1,400, which improved the measured result from
    -4.09 kW (full cohort) to a credible 27.89 kW alternative-baseline result.
  transferability: moderate
  delay_magnitude: null
  technology_domain: demand response
  source_pages: &id009
  - 25
  evidence_excerpt: The number of active participants in test events was lower than
    the number recruited, and combined with impact of the baseline methodology, did
    not deliver as large a demand reduction as expected... the quantity of news around
    energy security, and the perceived urgency of saving the grid had dropped substantially.
    This resulted in lower appeal for a non-energy centric organization like RACV
    (and its members).
  confidence_note: null
