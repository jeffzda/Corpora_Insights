  lesson_learnt: Future DR programme designers and policymakers should advocate for
    a control-group baselining framework for behavioural and temperature-sensitive
    loads; the current AEMO methodology is structurally unable to produce accurate
    baselines for these load types and a matched non-participant cohort is the only
    robust solution.
