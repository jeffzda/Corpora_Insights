- record_id: ARENA-DLV-21260
  source_title: ARENA/AEMO DR Trial Project Performance Report
  publish_date: 2018-10
  project_name: ARENA/AEMO DR Trial (Planet Innovation / Zen Ecosystems)
  what_happened: The AEMO adjusted baseline methodology, which uses morning energy
    consumption data to adjust the baseline, produced significantly incorrect afternoon
    baselines on days with large morning-to-afternoon temperature swings — yielding
    a negative adjusted DR result of −4.09 kW for the RACV cohort on 27 February 2018
    despite a clearly visible demand reduction during the event.
  lesson_learnt: On high-temperature days with atypical morning conditions — which
    are precisely the days when real DR events are called — the AEMO morning-adjusted
    baseline will systematically underestimate afternoon load and understate or negate
    measured DR. Baseline methodology reform (e.g. afternoon adjustment factors, control
    groups) is necessary before DR can be accurately measured and incentivised at
    scale.
