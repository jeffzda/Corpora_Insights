  evidence_excerpt: The trial successfully demonstrated that distributed energy sources can be coordinated in a way the respects network constraints and minimises the total cost of the network provider
    and the DER owner using NAC software. The trial was able to reduce Bruny Island's reliance on expensive diesel generation which was previously TasNetworks only means of managing network constraints
    by 33 per cent.
