- record_id: ARENA-DLV-15820
  source_title: Evaluation of ARENA's Impact and Effectiveness
  publish_date: 2019-11
  project_name: Bruny Island Network-Aware Coordination (NAC) Project
  what_happened: A three-year trial on Tasmania's fringe-of-grid Bruny Island successfully demonstrated that distributed battery storage systems could be coordinated via NAC software to respect network
    constraints and minimise total costs, reducing the island's reliance on expensive diesel backup by 33 per cent.
  lesson_learnt: Software-coordinated distributed storage can replace or substantially supplement dedicated diesel backup on constrained fringe-of-grid networks — NAC-style coordination should be evaluated
    as a lower-cost alternative to network augmentation or centralised storage in similar constrained network contexts.
