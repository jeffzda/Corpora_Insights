- record_id: ARENA-DLV-16265
  source_title: Energy Storage Study
  publish_date: 2015-07
  project_name: Australian Energy Storage Market — FCAS Market Access Barrier
  what_happened: Battery technologies in Australia in 2015 were capable of near-instantaneous
    frequency response, faster than the 6-second FCAS market requirement, but the
    NEM's FCAS market did not financially reward faster-than-required response. This
    prevented batteries from capturing the full value of their technical capability
    in the ancillary services market.
  lesson_learnt: Market rule design that does not differentiate or reward superior
    frequency response speed effectively excludes the commercial advantage of fast-responding
    battery storage; regulators and ARENA should advocate for market structures that
    value sub-6-second response as renewable penetration increases and faster response
    becomes more valuable.
