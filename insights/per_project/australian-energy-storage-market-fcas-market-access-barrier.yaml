  evidence_excerpt: While battery technologies can provide faster (almost instantaneous)
    frequency support than thermal generation, the existing FCAS fastest response
    market is 6-seconds. Currently, this capability is providing sufficient power
    quality to our networks although it is foreseeable that faster response times
    could be valuable in the future as more intermittent generators are connected.
