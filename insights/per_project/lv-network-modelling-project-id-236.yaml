- record_id: ARENA-DLV-72264
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: '2014'
  project_name: LV Network Modelling (Project ID 236)
  what_happened: SP AusNet and University of Melbourne modelling found that even low
    (30%) EV or PV uptake scenarios can cause LV distribution assets to operate beyond
    their limits, and that uneven phase distribution of EVs and PVs exacerbates network
    impacts; LV network support batteries were found effective in reducing impact
    but further work on battery management strategies was required.
  lesson_learnt: Network planners should not assume LV assets can accommodate even
    moderate DER penetration without detailed per-phase modelling — 30% EV or PV uptake
    can exceed asset limits, and phase imbalance significantly worsens impacts; LV
    network support batteries are an effective mitigation tool but require improved
    management strategies.
