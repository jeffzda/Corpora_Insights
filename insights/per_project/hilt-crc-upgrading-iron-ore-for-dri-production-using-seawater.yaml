- record_id: ARENA-DLV-20251
  source_title: HILT CRC - Upgrading Iron Ore for DRI Production Using Seawater Reverse
    Osmosis - Core Research Interim Report
  publish_date: 2025-08
  project_name: Upgrading Iron Ore for DRI Production Using Seawater Reverse Osmosis
    Brines (BALIO Process)
  what_happened: Caustic leaching successfully removed SiO2, Al2O3 and phosphorous
    impurities from iron ores, but entrainment of sodium hydroxide and precipitation
    of sodium alumino silicates in the leach solution limited the upgraded product
    to 65–66 wt.% calcined Fe grade, below the DRI/EAF threshold of 67 wt.%.
  lesson_learnt: In alkaline leach-based iron ore upgrading, sodium contamination
    from entrained NaOH and precipitated sodium alumino silicates is a critical grade-limiting
    factor — a dilute HCl acid rinse post-leach dissolves both contaminants and enables
    the product to exceed the 67 wt.% calcined Fe target.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: lab/bench
  lifecycle_phase: development/design
