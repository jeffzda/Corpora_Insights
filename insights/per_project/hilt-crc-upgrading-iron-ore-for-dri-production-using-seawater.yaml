  source_title: HILT CRC - Upgrading Iron Ore for DRI Production Using Seawater Reverse
    Osmosis - Core Research Interim Report
  publish_date: 2025-08
  project_name: Upgrading Iron Ore for DRI Production Using Seawater Reverse Osmosis
    Brines (BALIO Process)
  what_happened: The desktop salt splitting unit had a temperature limit of 40 °C;
    during initial testing the salt tank reached this limit within one hour, terminating
    experiments prematurely to protect the membranes. A larger chiller was procured
    and commissioned in March 2025, but during commissioning the perspex tank was
    over-pressurised and cracked, requiring external repair before the unit could
    be used.
  lesson_learnt: When commissioning electrochemical membrane units (e.g. electrodialysis
    for salt splitting), thermal management must be validated before full operation
    — size the cooling system for sustained run durations from the outset to avoid
    membrane damage and equipment failure during commissioning.
