  what_happened: Curtin University's pyrometallurgical equipment inventory did not
    include a furnace capable of rapid radiant heating (>50 °C/s), which prior work
    had identified as beneficial for leaching performance. This capability gap was
    identified as a constraint on the research programme at the host institution.
  lesson_learnt: Before scoping a research project requiring specialised thermal processing
    capabilities, audit the host institution's equipment against all identified process
    requirements — where a gap exists (e.g. rapid radiant heating), establish a formal
    collaboration with an equipped partner institution at project inception rather
    than as a mid-project workaround.
