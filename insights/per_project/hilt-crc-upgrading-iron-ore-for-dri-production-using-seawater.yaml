  what_happened: The MPhil study responsible for evaluating the regulatory, environmental
    and social dimensions of the BALIO process (via a triple bottom line approach)
    commenced in May 2025, approximately 14 months later than the planned March 2024
    start, due to late student enrolment. This delayed all progress against regulatory,
    environmental and social feasibility metrics.
  lesson_learnt: Regulatory, environmental and social assessments that depend on a
    single student or researcher should be initiated as early as possible and not
    treated as a later-stage deliverable — a 14-month delay to the ESG evaluation
    stream can leave the concept-level feasibility study incomplete in a key assessment
    dimension and expose the project to stage-gate risk.
