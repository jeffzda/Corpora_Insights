    Brines (BALIO Process)
  what_happened: Order-of-magnitude CAPEX estimation for the BALIO process produced
    a central estimate of USD 2 billion against a commercialisation target of below
    USD 1 billion, with uncertainty bounds of USD 1–4 billion. OPEX estimates ranged
    from USD 78–113/t iron ore product depending on scenario, against a target of
    below USD 80/t — only the lowest scenario (no by-products, maximum brine recycling)
    met the OPEX target.
  lesson_learnt: At the concept-level feasibility stage of a novel hydrometallurgical
    process, CAPEX and OPEX estimates should be benchmarked explicitly against commercialisation
    targets early — where estimates exceed targets by 2× (as here), sensitivity analysis
    and flowsheet simplification must be prioritised before advancing to pilot scale
    to avoid committing capital to a commercially unviable configuration.
