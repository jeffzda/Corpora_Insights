  publish_date: 2025-08
  project_name: Upgrading Iron Ore for DRI Production Using Seawater Reverse Osmosis
    Brines (BALIO Process)
  what_happened: Electricity cost was identified as by far the dominant OPEX contributor
    in the BALIO process, accounting for USD 47–80 per tonne of iron ore product (out
    of total OPEX of USD 78–113/t) at a price of USD 66/MWh. The process achieves
    operational profit only when electricity costs are below USD 66/MWh, with all
    scenarios profitable at USD 33/MWh.
  lesson_learnt: For hydrometallurgical processes reliant on electrochemical unit
    operations (salt splitting, nanofiltration), electricity cost is the primary determinant
    of financial viability — project siting and offtake structure must secure electricity
    below a project-specific threshold (here USD 66/MWh) before proceeding to commercialisation,
    and the techno-economic model should be stress-tested across a range of electricity
    prices from the concept stage.
