- record_id: ARENA-DLV-20253
  source_title: HILT CRC - Upgrading Iron Ore for DRI Production Using Seawater Reverse
    Osmosis - Core Research Interim Report
  publish_date: 2025-08
  project_name: Upgrading Iron Ore for DRI Production Using Seawater Reverse Osmosis
    Brines (BALIO Process)
  what_happened: The Carbolite oscillating furnace required for thermal pretreatment
    experiments had to be relocated twice during the project. The first relocation
    was to a site where adequate extraction could not be provided; installation was
    originally scheduled for September 2024 but the extraction system was postponed
    to September 2025. A second relocation in March 2025 was to a site with an exposed
    electrical cable; after that was rectified, a crystalline respiratory silica risk
    was identified, further delaying experiments.
  lesson_learnt: Before committing to a furnace or high-temperature equipment location
    in a research setting, confirm that extraction/ventilation infrastructure is fully
    in place and that chemical health and safety assessments (including silica dust)
    have been completed — relocating equipment mid-project incurs substantial safety
    documentation effort and can delay experimental programmes by 12+ months.
  issue_severity: major
  project_type: industrial decarbonisation
  project_scale_band: lab/bench
  lifecycle_phase: construction/installation
  proponent_type: research organisation/university
  delay_category: construction/installation
  failure_mode: execution & logistics
  outcome_class: delayed but recoverable
  secondary_failure_mode: poor scoping
  intervention_note: Work continued using a muffle furnace as an interim alternative,
    accepting limitations in atmospheric control, while rapid-heating experiments
    were deferred to a collaboration with the University of Adelaide.
  transferability: moderate
  delay_magnitude: 1-3 years
  technology_domain: industrial renewables
