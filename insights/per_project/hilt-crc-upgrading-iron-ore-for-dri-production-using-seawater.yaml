  source_title: HILT CRC - Upgrading Iron Ore for DRI Production Using Seawater Reverse
    Osmosis - Core Research Interim Report
  publish_date: 2025-08
  project_name: Upgrading Iron Ore for DRI Production Using Seawater Reverse Osmosis
    Brines (BALIO Process)
  what_happened: The reagent production step (Activity 4.3 — leaching with reagents
    made from salt splitting of seawater brine) remained at TRL 2 against a project
    target of TRL 4, the largest TRL gap of any activity in the project. This indicates
    that the integration of brine-derived reagents into the leach circuit has not
    yet been demonstrated at laboratory scale.
  lesson_learnt: In process development projects where reagent production and consumption
    are linked unit operations, integration of the reagent supply step into the process
    circuit should be prioritised for early demonstration — deferring integration
    testing of the salt splitting–leach interface risks leaving the most novel and
    uncertain technology element unvalidated until late in the programme.
