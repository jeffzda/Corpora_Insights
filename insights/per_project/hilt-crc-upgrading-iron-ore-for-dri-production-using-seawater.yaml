    commercialisation readiness activities (market validation, CAPEX/OPEX target-setting,
    innovation roadmap) should be progressed in parallel with technical feasibility
    work from the start — deferring commercial assessment to later stages creates
    gaps that require retrospective remediation and can delay investment decision-making.
