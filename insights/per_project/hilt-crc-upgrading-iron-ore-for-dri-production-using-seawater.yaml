  source_title: HILT CRC - Upgrading Iron Ore for DRI Production Using Seawater Reverse
    Osmosis - Core Research Interim Report
  publish_date: 2025-08
  project_name: Upgrading Iron Ore for DRI Production Using Seawater Reverse Osmosis
    Brines (BALIO Process)
  what_happened: By-product production (zeolites, geopolymers, calcium/magnesium phosphates)
    was incorporated in the BALIO flowsheet as a value driver, but initial economic
    assessments (December 2024) found that by-product production at current low-value
    assumptions did not justify the additional CAPEX and did not significantly improve
    operating profit. Market development for by-products remained in progress at the
    time of reporting.
  lesson_learnt: When by-product revenue is incorporated as a key financial justification
    for a novel process, market value assumptions for those by-products must be validated
    with market data early — if by-product markets are poorly understood or values
    are low, the business case can be undermined even when the core process is technically
    feasible.
