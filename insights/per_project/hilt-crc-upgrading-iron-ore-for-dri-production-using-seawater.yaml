  what_happened: The project planned to recruit four PhD/HDR students. Despite two
    recruitment rounds, no local candidates applied even after the second round offered
    increased living stipends. International applicants were selected instead; two
    obtained visas and commenced in December 2024 and May 2025 respectively, while
    a third candidate remained awaiting student visa approval at the time of reporting.
    Activity 9 (thesis completion and reduction studies) was consequently moved from
    Stage 1 to Stage 2.
  lesson_learnt: Research projects reliant on HDR students for experimental capacity
    should plan for extended visa processing timelines for international candidates
    and the possibility of no local applicants — build contingency into the project
    schedule from the outset and plan for additional staff recruitment to absorb backlog
    if student commencement is delayed.
