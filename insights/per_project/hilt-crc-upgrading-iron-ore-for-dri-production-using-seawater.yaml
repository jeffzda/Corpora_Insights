- record_id: ARENA-DLV-20256
  source_title: HILT CRC - Upgrading Iron Ore for DRI Production Using Seawater Reverse
    Osmosis - Core Research Interim Report
  publish_date: 2025-08
  project_name: Upgrading Iron Ore for DRI Production Using Seawater Reverse Osmosis
    Brines (BALIO Process)
  what_happened: Laboratory results revealed that the BALIO process does not perform
    uniformly across all iron ore feed materials; ores with high quartz content could
    not be upgraded to DRI/EAF grade. This necessitated the development of explicit
    feedstock selection criteria (FeT >50%, SiO2:Al2O3 <2.5, SiO2 <6.5%, vitreous
    goethite <35%, kaolinite-dominant gangue) that constrain which ore types can be
    processed.
  lesson_learnt: For novel hydrometallurgical iron ore upgrade processes, feedstock
    mineralogy — specifically quartz content and Al2O3 speciation — must be characterised
    and used as a selection gate before process design is finalised; process economics
    and product grade targets cannot be assumed to transfer across all ore types without
    explicit feedstock screening criteria.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Feedstock selection criteria were developed based on laboratory
    results and communicated to project partners; preferred feedstock was identified
    as subgrade primary zone material with kaolinite-rich friable shale bands currently
    treated as waste.
  transferability: narrow
  delay_magnitude: null
  technology_domain: industrial renewables
  source_pages: &id006
  - 18
  - 19
  evidence_excerpt: Through the laboratory results, it has become clear that the BALIO
    process will not have similar results on all feed materials, and feed materials
    with high quartz content should not be considered as possible feedstock for a
    DRI/EAF grade product. This led to the development of feedstock selection criteria.
  confidence_note: null
