  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: A dilute HCl rinse was applied to leach solids after water washing,
    dissolving sodium hydroxide and sodium alumino silicates and enabling the calcined
    product to reach 67.1 wt.% Fe.
  transferability: narrow
  delay_magnitude: null
  technology_domain: industrial renewables
