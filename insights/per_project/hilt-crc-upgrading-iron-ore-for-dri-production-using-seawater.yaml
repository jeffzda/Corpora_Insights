  what_happened: New 2024 legislation requiring evaluation of crystalline respiratory
    silica (RCS) exposure risk for processes handling high-silica materials was identified
    partway through the project. A risk assessment was triggered, adding compliance
    burden and further delaying furnace-based thermal pretreatment experiments that
    were already subject to equipment relocation delays.
  lesson_learnt: Research projects handling iron ores or tailings with significant
    crystalline silica content should proactively assess RCS exposure risk at project
    outset, including reviewing forthcoming legislative changes, to avoid mid-project
    compliance interruptions — implement fit-tested P2 respirators, wet handling,
    and HEPA vacuuming as standard controls from day one.
