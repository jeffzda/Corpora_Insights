  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Flow Power changed strategy to target smaller businesses and
    in some cases supplied the kWatch® Controller at Flow Power's own cost to overcome
    participation barriers.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: demand response
  source_pages: &id083
  - 8
  evidence_excerpt: Many large customers (Maximum Demand > 1 MW) when asked to participate
    in the ARENA demand response program felt the financial reward was not significant
