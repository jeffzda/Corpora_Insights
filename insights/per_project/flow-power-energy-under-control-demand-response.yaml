  project_name: Energy Under Control (Flow Power ARENA Demand Response Trial)
  what_happened: Lack of real-time aggregated metering data prevented efficient DR
    portfolio management for some customer sites throughout the trial, particularly
    in NSW where metering upgrade rollout lagged behind Victoria.
  lesson_learnt: Real-time aggregated data access should be confirmed as a precondition
    for enrolling sites into DR programs; in jurisdictions with delayed smart meter
    rollout, aggregators should plan for manual workarounds or pulse-input modifications
    well in advance of operations commencing.
