- record_id: ARENA-DLV-30652
  source_title: May 2018 Project Performance Report – Energy Under Control
  publish_date: 2018-05
  project_name: Energy Under Control
  what_happened: Businesses in NSW demonstrated significantly lower awareness of demand
    response programs compared with Flow Power's experience in Victoria and South
    Australia, slowing customer acquisition. Flow Power attributed this to NSW's lower
    historical exposure to reliability events and compounded it by having its office
    located in Victoria, requiring in-person travel to meet potential NSW customers.
  lesson_learnt: Demand response program operators entering geographically new or
    less mature markets should budget additional time and resources for customer education,
    and consider establishing a local presence early — market awareness gaps can materially
    slow customer acquisition and program ramp-up.
