- record_id: ARENA-DLV-30651
  source_title: May 2018 Project Performance Report – Energy Under Control
  publish_date: 2018-05
  project_name: Energy Under Control
  what_happened: Large commercial and industrial customers (maximum demand >1 MW)
    declined to participate in the demand response program because they judged the
    financial reward insufficient to offset operational risks. Flow Power responded
    by shifting its recruitment strategy to target smaller businesses and, in some
    cases, supplying the kWatch® Controller at its own cost.
  lesson_learnt: When recruiting large C&I customers for demand response, the availability
    and activation payment structure must be clearly benchmarked against customer
    risk tolerance before contracting — large customers are more likely to reject
    participation if the reward does not offset perceived operational disruption.
    Targeting smaller businesses or subsidising controller installation can unlock
    participation where direct financial incentives are insufficient.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: stakeholder/land/community
  failure_mode: commercial & market
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Flow Power shifted recruitment strategy to target smaller businesses
    and supplied the Controller at its own cost in some cases to overcome the financial
    barrier.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: demand response
  source_pages: &id001
  - 7
  evidence_excerpt: Many large customers (Maximum Demand > 1 MW) when asked to participate
    in the ARENA demand response program felt the financial reward was not significant
    enough to offset the risks they take from participating in the program. As such,
    we changed our strategy and now target smaller businesses. In some cases we supplied
    the Controller at Flow Power's cost.
  confidence_note: null
