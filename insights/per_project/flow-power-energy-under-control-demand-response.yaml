  source_pages: &id046
  - 21
  evidence_excerpt: The other challenge with dual trigger customers was erosion of
    the baseline. The CAISO baseline used in the RERT program has a scalar adjustment
    that is particularly sensitive to changes in load prior to the start of a demand
    response event. Customers responding to high prices which preceded RERT events
    by more than two hours experienced significant reductions in their baseline usage
    which subsequently reduced their payments from the RERT program.
