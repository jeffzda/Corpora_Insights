- record_id: ARENA-DLV-52257
  source_title: November 2019 Project Performance Report - Energy Under Control
  publish_date: 2019-11
  project_name: Energy Under Control
  what_happened: The CAISO 10 of 10 asymmetric baseline methodology materially affected
    measured performance when test events were conducted at times of day (morning)
    different from when RERT is typically called (late afternoon/evening), particularly
    for agricultural and cold-store customers with time-dependent loads.
  lesson_learnt: Scrutinise the baseline methodology used in DR programs before committing
    portfolio capacity targets — mismatches between test timing and typical activation
    windows, combined with load profiles that vary by time of day or season, can cause
    severe underperformance against the measured baseline even when customers physically
    curtail load.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
