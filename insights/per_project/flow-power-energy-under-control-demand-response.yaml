  project_name: Energy Under Control
  what_happened: The AEMO baseline methodology used to calculate availability payments
    added complexity to customer communications, making it difficult for customers
    to understand how their payments would be determined.
  lesson_learnt: Simplify or abstract complex market baseline methodologies in customer-facing
    materials — when payment calculations are opaque, customer confidence and willingness
    to participate in demand response programs is reduced.
