  project_name: Energy Under Control
  what_happened: NSW businesses demonstrated significantly lower awareness of demand
    response programs compared to Victoria and South Australia, making customer education
    and acquisition slower than anticipated, compounded by Flow Power's Victorian
    office location requiring travel to meet NSW prospects.
  lesson_learnt: In markets with limited prior exposure to demand response (such as
    NSW), budget significant additional time and resources for customer education,
    and establish local physical presence to reduce friction in customer acquisition
    — remote engagement from interstate substantially slows uptake.
