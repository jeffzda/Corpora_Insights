  source_title: November 2019 Project Performance Report - Energy Under Control
  publish_date: 2019-11
  project_name: Energy Under Control
  what_happened: The seasonality of agricultural (irrigation) and cold-store customer
    loads meant that available DR capacity varied substantially between winter and
    summer, while program payment structures assumed constant MW availability year-round.
  lesson_learnt: Design DR program payment structures and portfolio capacity commitments
    to reflect seasonal load profiles — static availability-based payments misrepresent
    the value contribution of customers whose loads are highly seasonal, and create
    commitment gaps that expose the aggregator to underperformance risk.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
