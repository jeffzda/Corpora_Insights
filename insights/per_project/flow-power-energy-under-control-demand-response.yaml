  source_title: June 2021 Project Performance Report - Energy Under Control
  publish_date: 2021-06
  project_name: Energy Under Control (Flow Power ARENA Demand Response Trial)
  what_happened: The RERT baseline methodology (CAISO 10-of-10 asymmetric adjustment)
    created measurement distortions for Flow Power's portfolio, particularly when
    test timing differed from the expected activation window (e.g. morning tests vs.
    late afternoon/evening activations), causing measured availability to vary significantly
    from actual available load.
  lesson_learnt: Baseline methodology is a critical design parameter for RERT-style
    demand response programs; DR aggregators should test portfolios at times consistent
    with expected activation windows, and program designers should account for seasonal
    and time-of-day load variation when setting baseline rules.
