  source_title: May 2020 Project Performance Report – Energy Under Control
  publish_date: 2020-05
  project_name: Energy Under Control (Flow Power ARENA DR Trial)
  what_happened: Some customers who enrolled in emergency DR programs later migrated
    to retail spot price exposure contracts after discovering they had more load flexibility
    than initially thought and seeing the commercial benefits of active DR participation.
  lesson_learnt: Emergency DR programs serve as an effective on-ramp to deeper demand-side
    market participation — program designers should build in pathways from emergency/RERT
    DR to spot-exposed and market-integrated DR, as the trial experience showed customers
    systematically underestimate their own load flexibility before exposure to a structured
    DR program.
