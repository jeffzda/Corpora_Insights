  project_name: Energy Under Control
  what_happened: Non-existing Flow Power customers expressed concerns about integrating
    the kWatch® Intelligent Controller with their existing control systems, creating
    a barrier to enrolment that was typically resolved once the customer understood
    how the controller operated.
  lesson_learnt: Technology integration anxiety is a recurring barrier for demand
    response customer recruitment; proactively providing clear technical briefings
    on how new demand response hardware interfaces with existing systems — before
    contract execution — can reduce dropout at the enrolment stage.
