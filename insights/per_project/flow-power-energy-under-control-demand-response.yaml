  source_title: November 2019 Project Performance Report - Energy Under Control
  publish_date: 2019-11
  project_name: Energy Under Control
  what_happened: Low spot price volatility and absence of reliability events in NSW
    made DR commercially unattractive to prospective customers compared with Victoria
    and South Australia, where customers faced tangible risks of forced disconnection
    during load-shedding events.
  lesson_learnt: Align DR program design and incentive levels with the regional reliability
    risk environment — in low-volatility regions, the commercial case for customers
    is weaker and the sales cycle will be materially harder than in regions where
    reliability events are visible and recent.
