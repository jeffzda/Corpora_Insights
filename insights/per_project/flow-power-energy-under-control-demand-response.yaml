- record_id: ARENA-DLV-62858
  source_title: May 2019 Project Performance Report – Energy Under Control
  publish_date: 2019-05
  project_name: Energy Under Control
  what_happened: Seasonal variation in customer loads — particularly irrigation-dependent
    agricultural loads effectively absent in winter, and temperature-sensitive cold
    store loads — created a mismatch with the ARENA DR portfolio structure, which
    had a static contracted size and constant payment rates across winter and summer
    periods.
  lesson_learnt: Design demand response portfolio contracts to account for seasonal
    load variability — static portfolio sizes and flat payment structures do not align
    with agricultural or temperature-sensitive loads, and portfolio composition should
    be diversified across seasonally complementary industries.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: partial success
  secondary_failure_mode: commercial & market
  intervention_note: null
  transferability: broad
  delay_magnitude: null
  technology_domain: demand response
  source_pages: &id081
  - 9
  evidence_excerpt: Seasonality of customer loads has an impact on the portfolio –
    the agricultural loads are primarily based on irrigation requirements, which are
    significantly reduced or in some cases non-existent during winter. Cold store
    loads while constant throughout the year are highly dependent on ambient temperatures.
    This is an issue for the ARENA DR portfolio which has a static size between the
    winter and summer periods as well as payments based on a constant rate.
  confidence_note: null
