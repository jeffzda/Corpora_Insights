  project_name: Energy Under Control
  what_happened: Customers who were not existing Flow Power retail customers expressed
    concerns about integrating the kWatch® Controller with their existing building
    control systems, creating a barrier to participation.
  lesson_learnt: Address technology integration concerns early in the customer recruitment
    process — clearly explaining how new demand response hardware interfaces with
    existing control systems is often sufficient to resolve hesitation, particularly
    for non-incumbent customers.
