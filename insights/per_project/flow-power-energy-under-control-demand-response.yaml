- record_id: ARENA-DLV-56008
  source_title: May 2020 Project Performance Report – Energy Under Control
  publish_date: 2020-05
  project_name: Energy Under Control (Flow Power ARENA DR Trial)
  what_happened: Lack of real-time aggregated metering data on the aggregator side
    impeded efficient DR portfolio management. Most industrial customers could monitor
    their own consumption via SCADA but Flow Power could not monitor portfolio-wide
    performance in real time.
  lesson_learnt: Aggregated real-time data access at the portfolio level is essential
    for efficient DR management — design the data architecture to provide the aggregator
    with live visibility across all sites from the outset, not just the individual
    customer view, as the absence of this capability materially limits the aggregator's
    ability to manage portfolio performance.
