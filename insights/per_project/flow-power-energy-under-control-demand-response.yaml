  project_name: Energy Under Control (Flow Power ARENA Demand Response Trial)
  what_happened: During the summer 2020 extreme heat and bushfire events — which triggered
    the first-ever RERT activation in NSW — the ARENA portfolio was not activated
    on 23 and 31 January despite being available, a short-response portfolio, and
    essentially already paid for via availability payments. A non-ARENA Flow Power
    portfolio was activated instead.
  lesson_learnt: Program designers and AEMO should clarify the activation hierarchy
    and dispatch logic for RERT portfolios in advance; a paid-and-available DR portfolio
    not being called during the first NSW reliability emergency represents a missed
    opportunity to validate the trial portfolio under real conditions.
