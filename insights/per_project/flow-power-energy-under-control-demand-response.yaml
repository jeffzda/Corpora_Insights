  project_name: Energy Under Control
  what_happened: Individual customer demand response performance improved as the program
    matured, reflecting improved customer understanding, Flow Power's education efforts,
    and improved internal operational systems — with performance improving measurably
    between Year 1 tests (1.52 MW, 3.51 MW) and later tests (27.9 MW, 21.8 MW).
