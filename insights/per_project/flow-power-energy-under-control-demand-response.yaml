- record_id: ARENA-DLV-71410
  source_title: November 2018 Project Performance Report - Energy Under Control
  publish_date: 2018-11
  project_name: Energy Under Control
  what_happened: The kWatch® Intelligent Controller required significant firmware
    and software updates during the project to achieve reliable and stable operation,
    with considerable development effort needed after initial deployment.
  lesson_learnt: Proprietary demand response hardware deployed in field conditions
    should be treated as requiring iterative firmware and software development post-deployment
    — budget for ongoing development effort and include watchdog and network-recovery
    features from the outset to maintain controller uptime.
