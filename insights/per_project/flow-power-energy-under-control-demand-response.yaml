  project_name: Energy Under Control
  what_happened: Lack of real-time metering data at some customer sites prevented
    efficient DR portfolio management and performance monitoring on the aggregator
    side, as most industrial customers could only monitor their own consumption via
    SCADA without aggregated visibility for Flow Power.
  lesson_learnt: Establish real-time data access from all customer sites as a precondition
    for portfolio enrolment — without aggregated real-time data the aggregator cannot
    monitor or manage performance efficiently, and relying on customer-side SCADA
    alone is insufficient for effective DR portfolio management.
