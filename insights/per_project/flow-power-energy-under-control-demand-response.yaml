  project_name: Energy Under Control (Flow Power ARENA Demand Response Trial)
  what_happened: The initial RERT test in January 2018 yielded only 1.52 MW against
    a target of 5 MW, despite having 7 MW of recruited capacity across 4 customers.
    A second test yielded 3.51 MW against 9 MW expected from 11.6 MW recruited capacity
    — significantly below targets.
  lesson_learnt: Demand response portfolios consistently underperform initial contracted
    capacity estimates; over-subscribing the portfolio is necessary to compensate
    for weather conditions, altered production conditions, and customer-level variability.
