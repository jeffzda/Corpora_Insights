  publish_date: 2021-06
  project_name: Energy Under Control (Flow Power ARENA Demand Response Trial)
  what_happened: Large C&I customers (maximum demand >1 MW) consistently declined
    to join the ARENA RERT demand response portfolio because they judged the financial
    reward insufficient to offset operational risks, forcing Flow Power to redirect
    recruitment towards smaller businesses.
  lesson_learnt: Financial incentives in emergency DR programs may not be compelling
    enough for large C&I customers who perceive operational risk as high; program
    designers and aggregators should calibrate payment structures to the risk appetite
    of large customers or target smaller businesses where the relative value proposition
    is stronger.
