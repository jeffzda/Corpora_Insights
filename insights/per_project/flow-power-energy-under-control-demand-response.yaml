  what_happened: The ARENA DR trial portfolio became over-reliant on a single large
    customer (a 20 MW steel manufacturer at Newcastle representing more than half
    the portfolio's nominated capacity), creating significant portfolio-level risk
    for achieving activation targets.
  lesson_learnt: Demand response portfolios should be structured with an even spread
    of customer sizes across multiple industry verticals; reliance on any single customer
    or single industry type creates unacceptable performance risk during activations
    and should be actively managed as a portfolio design constraint.
