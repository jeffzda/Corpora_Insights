- record_id: ARENA-DLV-56007
  source_title: May 2020 Project Performance Report – Energy Under Control
  publish_date: 2020-05
  project_name: Energy Under Control (Flow Power ARENA DR Trial)
  what_happened: The CAISO 10-of-10 asymmetric adjustment baseline methodology used
    in the RERT program was identified as a significant factor affecting portfolio
    performance assessment, particularly when test timing differed from the typical
    demand event window (late afternoon vs. morning tests).
  lesson_learnt: When managing a RERT demand response portfolio, schedule all tests
    at the same time-of-day as likely real activation events — a baseline methodology
    calibrated to the typical event window will produce materially different (and
    misleading) results if tests are conducted at off-peak times, particularly for
    loads with time-varying profiles such as agriculture and cold storage.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: data & measurement
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: demand response
  source_pages: &id060
  - 11
  evidence_excerpt: The significance of the baseline to Flow Power's portfolio was
    observed when the time window for testing the portfolio varied significantly from
    the time that the portfolio would typically be called upon. One of the tests was
    conducted in the morning, where typically the requirement for RERT is late afternoon/early
    evening. The difference in available load, as determined by a baseline, is apparent
    – particularly in agriculture and cold store customers who have seasonal and/or
    temperature dependent loads.
