  source_title: November 2019 Project Performance Report - Energy Under Control
  publish_date: 2019-11
  project_name: Energy Under Control
  what_happened: Developing an in-house DR control platform with a small engineering
    team created ongoing challenges in building sufficient flexibility to handle the
    diverse range of customer control systems encountered across the portfolio.
  lesson_learnt: When building a proprietary aggregation platform for a heterogeneous
    C&I customer base, design for control system diversity from the outset — a single-relay-output
    architecture requires extensive case-by-case customisation and limits scalability;
    modular integration interfaces reduce per-customer engineering overhead.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: internal governance/resourcing
  failure_mode: unvalidated integration
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Flow Power adopted a single-point relay-control architecture
    for customers to integrate via their own electrical contractors, and in some cases
    worked more closely with customers to specifically program parameters on the Flow
    Power platform side.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: demand response
  source_pages: &id028
  - 11
  evidence_excerpt: One of the challenges developing an in-house technology solution
    with a small team has been developing a platform that is flexible enough to handle
    a range of different customer control systems. The general approach has been to
    provide a single point of relay control, which a customer's electrical contractors
    can then integrate with their specific control systems.
