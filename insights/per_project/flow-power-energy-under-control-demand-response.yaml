- record_id: ARENA-DLV-56001
  source_title: May 2020 Project Performance Report – Energy Under Control
  publish_date: 2020-05
  project_name: Energy Under Control (Flow Power ARENA DR Trial)
  what_happened: The initial recruited portfolio was expected to deliver 6 MW of demand
    response in the first test but yielded only 1.52 MW. The second test yielded 3.51
    MW against an expected 9 MW. Early contracted capacity significantly over-estimated
    actual deliverable load reduction.
  lesson_learnt: Over-subscribe the DR portfolio from the outset to account for the
    gap between contracted capacity and actual delivered load reduction — initial
    tests routinely delivered 25–40% of contracted capacity, and portfolio over-subscription
    is the primary mitigation for this systemic underperformance risk.
