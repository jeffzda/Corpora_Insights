  what_happened: Low spot price volatility and limited public awareness of reliability
    concerns in NSW (compared to Victoria and South Australia) made it substantially
    harder to sell demand response to NSW businesses, as the threat of forced disconnection
    or high prices that motivates customers in other states was not present.
  lesson_learnt: DR program design and marketing should account for regional reliability
    and price volatility context; in low-volatility regions, the customer value proposition
    must be constructed differently — relying on operational or financial benefits
