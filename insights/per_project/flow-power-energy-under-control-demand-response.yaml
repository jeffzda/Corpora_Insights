  project_name: Energy Under Control (Flow Power ARENA Demand Response Trial)
  what_happened: Seasonal load variability — particularly for agricultural irrigation
    and cold storage customers — meant that the static MW nomination submitted for
    RERT did not reflect actual available capacity across winter and summer, with
    some loads nearly absent in winter, creating a structural mismatch between nominated
    and deliverable reserves.
  lesson_learnt: RERT portfolio nominations should account for seasonal and time-of-day
    load variation; aggregators should either over-nominate to account for seasonal
    troughs or advocate for mechanisms that allow dynamic MW nominations reflecting
    seasonal availability rather than a single static figure.
