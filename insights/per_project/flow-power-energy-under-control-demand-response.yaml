  project_name: Energy Under Control
  what_happened: Flow Power found that being the energy retailer for demand response
    customers was not a prerequisite to aggregating their load, but that having an
    existing retail relationship made the process easier.
  lesson_learnt: Demand response aggregators do not need to be the customer's energy
    retailer to participate in aggregation programs, but leveraging existing retail
    customer relationships reduces friction in recruitment, contracting, and technology
    integration — non-retailer aggregators should account for higher customer acquisition
    costs.
