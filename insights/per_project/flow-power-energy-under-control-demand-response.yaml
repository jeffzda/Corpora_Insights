  source_title: June 2021 Project Performance Report - Energy Under Control
  publish_date: 2021-06
  project_name: Energy Under Control (Flow Power ARENA Demand Response Trial)
  what_happened: Metering Data Providers (MDPs) controlled all access to NMI meters
    and required separate relationship-building and negotiation for each customer
    since customers had different MDPs, creating an unexpected bottleneck for meter
    upgrades needed to enable real-time data feeds.
  lesson_learnt: DR aggregators should map customer MDPs during the enrolment process
    and initiate MDP engagement early — meter upgrade timelines are controlled by
    the MDP, not the retailer or aggregator, and delays can impede data access throughout
    the program lifecycle.
