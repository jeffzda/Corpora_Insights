  what_happened: A substantial subset of potential commercial and industrial customers
    were ineligible to participate because their operational processes required more
    than the 10-minute response time mandated by the program, with some requiring
    30 minutes or more.
  lesson_learnt: When designing or scoping a demand response program requiring fast
    response (≤10 minutes), pre-screen potential customers for process response time
    before investing in recruitment and contracting — industries with slow process
    ramp-down (e.g. certain manufacturing processes) will not qualify and should be
    excluded from the target market.
