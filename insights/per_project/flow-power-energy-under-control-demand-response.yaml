  what_happened: The initial recruitment of C&I customers yielded significantly lower
    demand reductions than anticipated. The first test produced only 1.52 MW against
    a target of 5 MW from a portfolio contracted to deliver 6 MW. The second test
    yielded 3.51 MW from an expected 9 MW portfolio.
