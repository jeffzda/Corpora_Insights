- record_id: ARENA-DLV-71409
  source_title: November 2018 Project Performance Report - Energy Under Control
  publish_date: 2018-11
  project_name: Energy Under Control
  what_happened: Being the existing retail electricity supplier to a customer significantly
    simplified demand response recruitment and education compared to recruiting non-incumbent
    customers, though it was not a strict requirement for participation.
  lesson_learnt: Aggregators and retailers running demand response programs should
    prioritise recruitment from their existing retail customer base first — the existing
    commercial relationship materially reduces education burden and sign-on friction,
    even though non-customers can participate.
