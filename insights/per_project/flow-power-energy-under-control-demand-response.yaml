  source_title: May 2020 Project Performance Report – Energy Under Control
  publish_date: 2020-05
  project_name: Energy Under Control (Flow Power ARENA DR Trial)
  what_happened: During the summer 2019–20 heatwave and bushfire emergency — the first
    time RERT was ever activated in NSW — Flow Power's ARENA portfolio was not activated
    by AEMO on multiple high-stress days despite being available, having short response
    times, and being essentially pre-paid via availability payments. Other RERT portfolios
    including Flow Power's non-ARENA portfolio were activated instead.
  lesson_learnt: DR program designers and AEMO should establish clear activation sequencing
    protocols for RERT portfolios — the non-activation of an available, pre-paid,
    short-response portfolio during the first NSW RERT event represents a missed validation
    opportunity and highlights a potential gap in how AEMO selects and sequences RERT
    providers under stress conditions.
  issue_severity: major
