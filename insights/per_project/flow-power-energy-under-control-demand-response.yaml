  source_title: November 2019 Project Performance Report - Energy Under Control
  publish_date: 2019-11
  project_name: Energy Under Control
  what_happened: The DR trial demonstrated that customers who initially participated
    in emergency DR programs (RERT) subsequently migrated to retail spot price exposure
    contracts, indicating greater latent load flexibility than originally assumed
    and a progression pathway for deepening customer engagement.
  lesson_learnt: Design DR programs with a visible migration pathway from emergency/RERT
    participation to spot price exposure — customers who begin with low-commitment
    emergency DR often discover greater operational flexibility than expected and
    can be graduated to market-integrated arrangements that deliver superior system
    value.
