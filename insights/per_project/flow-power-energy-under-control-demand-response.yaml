- record_id: ARENA-DLV-71407
  source_title: November 2018 Project Performance Report - Energy Under Control
  publish_date: 2018-11
  project_name: Energy Under Control
  what_happened: The initial test on 30 January 2018 recruited 7 MW of maximum demand
    capacity across 4 customers but achieved only 1.52 MW of actual load shed against
    a 5 MW target, a delivery ratio of approximately 22% of recruited capacity.
  lesson_learnt: Plan contracted demand response capacity at three to five times the
    target reserve — customers deliver approximately one-third to one-half of their
    maximum demand during an activation event due to partial operational shutdowns,
    weather, and production variability; under-contracting relative to this ratio
    will reliably result in shortfalls.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: Flow Power increased aggregated maximum demand to 9 MW for the
    second test, achieving 3.51 MW — a substantially improved result — and subsequently
    scaled recruited capacity to ~39 MW to reliably exceed the 5 MW target.
  transferability: broad
  delay_magnitude: null
  technology_domain: demand response
  source_pages: &id089
  - 6
  - 8
  evidence_excerpt: As a rule of thumb, we discovered that customers provide one third
    to half their maximum demand during a test or activation. We had initially contracted
    6MW of maximum demand for our initial test, and this yielded 1.5MW.
  confidence_note: Source table records initial recruited capacity as 7 MW but lessons
    learnt text references 6 MW — minor discrepancy noted; the lesson remains valid.
