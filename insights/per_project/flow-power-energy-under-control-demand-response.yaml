  what_happened: Delays in metering upgrades in NSW meant that the standard data feed
    path via the Modbus standard on EDMI mk10 meters was unavailable for many sites,
    as older mk6 meters did not support this interface, making data collection more
    difficult than in Victoria.
  lesson_learnt: Assess the metering infrastructure landscape of the target state
    before finalising demand response controller specifications — state-level metering
    upgrade delays can block standard data integration paths and require hardware
    modifications to accommodate older meters.
