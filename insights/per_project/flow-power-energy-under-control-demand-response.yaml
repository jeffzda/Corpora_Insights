- record_id: ARENA-DLV-30655
  source_title: May 2018 Project Performance Report – Energy Under Control
  publish_date: 2018-05
  project_name: Energy Under Control
  what_happened: The AEMO baseline methodology used to calculate availability payments
    added complexity to customer communications, making it difficult for Flow Power
    to explain how payments were calculated and reducing customer confidence in the
    program.
  lesson_learnt: Demand response aggregators should develop simplified payment explainers
    that abstract baseline methodology complexity for customers — opaque payment calculation
    can undermine customer confidence and slow enrolment even where the financial
    offer is competitive.
  issue_severity: minor
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: coordination & stakeholders
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Flow Power identified the need to simplify explanation of the
    baseline methodology and was actively seeking ways to do so at time of reporting.
  transferability: moderate
  delay_magnitude: null
  technology_domain: demand response
  source_pages: &id005
  - 7
  evidence_excerpt: Given the availability payment is based on the AEMO baseline methodology,
    explaining how the baseline is used to calculate payments adds complexity. We
