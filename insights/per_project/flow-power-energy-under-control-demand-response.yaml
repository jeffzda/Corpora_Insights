- record_id: ARENA-DLV-56014
  source_title: May 2020 Project Performance Report – Energy Under Control
  publish_date: 2020-05
  project_name: Energy Under Control (Flow Power ARENA DR Trial)
  what_happened: Agricultural loads in the portfolio had significantly reduced or
    zero load availability during winter due to irrigation seasonality, while cold
    store loads varied with ambient temperature. The ARENA DR portfolio had a static
    MW capacity size and constant availability payment rate, creating a structural
    mismatch with the seasonal nature of the underlying loads.
  lesson_learnt: DR portfolio contracts should include provisions for seasonal load
    variation — a static MW capacity and flat payment structure creates both commercial
    risk and misrepresentation of available reserves when the underlying loads are
    inherently seasonal or temperature-dependent.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
