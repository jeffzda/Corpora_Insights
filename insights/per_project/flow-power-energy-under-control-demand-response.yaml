- record_id: ARENA-DLV-30657
  source_title: May 2018 Project Performance Report – Energy Under Control
  publish_date: 2018-05
  project_name: Energy Under Control
  what_happened: In the initial test, Flow Power contracted 6 MW of maximum demand
    from 4 customers against a 5 MW target reserve, but achieved only 1.52 MW of actual
    load reduction — approximately one quarter of contracted capacity. In the re-test,
    aggregated maximum demand was increased to 9 MW across 9 customers and actual
    response improved to 3.51 MW, a materially better result.
  lesson_learnt: Demand response aggregators should plan for customers to deliver
    approximately one-third to one-half of their contracted maximum demand during
    activations — over-subscribing the portfolio is necessary to achieve target reserve
    volumes, as customers do not fully shut down operations and are subject to production
    and weather variability on the day.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: partial success
  secondary_failure_mode: poor scoping
  intervention_note: Flow Power increased aggregated contracted maximum demand from
    6 MW to 9 MW across a larger customer base for the re-test, achieving 3.51 MW
    against the 5 MW target — a substantially improved result compared to the initial
    test.
  transferability: broad
  delay_magnitude: null
  technology_domain: demand response
  source_pages: &id007
  - 6
  - 7
  evidence_excerpt: As a rule of thumb, we discovered that customers nominally provide
    one third to half their maximum demand during a test or activation. We had initially
    contracted 6MW of maximum demand for the initial test, and this yielded 1.5MW.
    During our second test we increased our aggregated maximum demand to 9MW and this
    achieved a much more satisfactory result of 3.6MW during the test.
  confidence_note: issue_severity set to major because the initial test delivered
    only ~25% of contracted capacity against the 5 MW target reserve, though the programme
    recovered through re-test redesign.
