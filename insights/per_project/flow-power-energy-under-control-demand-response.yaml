  source_title: November 2019 Project Performance Report - Energy Under Control
  publish_date: 2019-11
  project_name: Energy Under Control
  what_happened: Despite increased public DR awareness, Flow Power struggled to recruit
    new customers to diversify the portfolio during Year 2. Multiple prospective customers
    who were initially interested ultimately declined to participate because they
    judged the operational impact on their business too significant.
  lesson_learnt: Portfolio diversity requires an active and sustained new-customer
    sales pipeline — interested prospects frequently drop out after closer assessment
    of operational impacts, so DR aggregators must maintain a substantial funnel to
    achieve net portfolio growth and diversification.
