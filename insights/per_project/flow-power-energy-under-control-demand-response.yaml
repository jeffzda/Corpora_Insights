  source_title: May 2020 Project Performance Report – Energy Under Control
  publish_date: 2020-05
  project_name: Energy Under Control (Flow Power ARENA DR Trial)
  what_happened: Metering upgrade delays in NSW, stemming from the exclusive role
    of Metering Data Providers (MDPs) over NMI meters, made obtaining data feeds from
    customer sites more difficult than in Victoria. Customers with different MDPs
    required separate negotiations, and one customer's NMI meter was located in an
    HV switchyard inaccessible for upgrades.
  lesson_learnt: Account for the MDP-controlled metering environment in NSW when planning
    DR deployment timelines — the aggregator has no direct control over NMI meter
    upgrades, multiple MDPs mean multiple separate negotiations, and HV-connected
    customers may face effectively insurmountable metering access barriers.
