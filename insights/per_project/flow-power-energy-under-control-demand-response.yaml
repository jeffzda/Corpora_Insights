- record_id: ARENA-DLV-62852
  source_title: May 2019 Project Performance Report – Energy Under Control
  publish_date: 2019-05
  project_name: Energy Under Control
  what_happened: Large commercial and industrial customers (maximum demand >1 MW)
    felt the financial reward from demand response participation was insufficient
    to offset operational risks, forcing Flow Power to pivot focus towards smaller
    businesses and in some cases provide the Controller hardware at no cost.
  lesson_learnt: Design demand response incentive structures that adequately compensate
    large C&I customers for operational risk — where reward-to-risk ratios are insufficient,
    aggregators must either accept smaller customers or absorb hardware costs to maintain
    portfolio size.
