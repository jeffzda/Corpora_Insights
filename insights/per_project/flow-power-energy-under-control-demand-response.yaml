- record_id: ARENA-DLV-56020
  source_title: May 2020 Project Performance Report – Energy Under Control
  publish_date: 2020-05
  project_name: Energy Under Control (Flow Power ARENA DR Trial)
  what_happened: The trial demonstrated that automation of demand response — reducing
    reliance on manual customer acceptance of activation signals — is valued by both
    aggregators and customers, and that customers who were initially reluctant to
    integrate third-party controls became willing to do so once the commercial benefits
    were clear.
  lesson_learnt: Design DR systems with automated response capability as the target
    end-state from the outset, but plan for a transition period where customers begin
    on manual opt-in and migrate to automated opt-out as trust and commercial confidence
    are established — automated DR delivers materially better performance and requires
    fewer resources to manage.
  issue_severity: none
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: null
  transferability: broad
  delay_magnitude: null
  technology_domain: demand response
  source_pages: &id073
  - 15
  evidence_excerpt: The DR trial has shown a desire to integrate controls equipment
    more significantly with a customer site and improve automation. Automated DR is
    the gold standard, both from the perspective of the DR portfolio manager (guarantees
    a higher level of performance and control over the aggregated assets) and from
    the customer perspective where less resources are required to manage the ongoing
    DR activities. Many customers are initially hesitant to significantly integrate
    third party controls into their operations but will do so when the commercial
    benefits are clear.
