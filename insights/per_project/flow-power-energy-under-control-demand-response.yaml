- record_id: ARENA-DLV-71408
  source_title: November 2018 Project Performance Report - Energy Under Control
  publish_date: 2018-11
  project_name: Energy Under Control
  what_happened: By Test Two (23 May 2018) and Test Three (24 October 2018), Flow
    Power had scaled recruited capacity to approximately 39 MW across 6–7 customers,
    achieving 27.9 MW and 21.8 MW respectively against a 5 MW target — well above
    the target once over-subscription was applied.
  lesson_learnt: Over-subscribing customer capacity portfolios by a factor of approximately
    5–8x the target reserve reliably covers the one-third to one-half activation yield
    typical of C&I demand response customers, and reduces the risk of underperformance
    from individual customer production variability on any given day.
