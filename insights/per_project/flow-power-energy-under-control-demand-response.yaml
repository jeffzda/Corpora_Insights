  publish_date: 2020-05
  project_name: Energy Under Control (Flow Power ARENA DR Trial)
  what_happened: Low spot price volatility and limited reliability events in NSW reduced
    the perceived urgency of demand response participation, making the DR sales cycle
    significantly harder in NSW compared to Victoria and South Australia where reliability
    concerns were more salient.
  lesson_learnt: In markets with low price volatility and few recent reliability events,
    DR program designers should develop customer value propositions that go beyond
    reliability event avoidance — the business case must stand without a recent memory
    of curtailment risk, unlike in Victoria and South Australia where that memory
    actively drives uptake.
