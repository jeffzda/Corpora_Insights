  evidence_excerpt: The significance of the baseline to Flow Power's portfolio was
    observed when the time window for testing the portfolio varied significantly from
    the time that the portfolio would typically be called upon. One of the tests was
    conducted in the morning, where typically the requirement for RERT is late afternoon/early
    evening. The difference in available load, as determined by a baseline, is apparent
    – particularly in agriculture and cold store customers who have seasonal and/or
