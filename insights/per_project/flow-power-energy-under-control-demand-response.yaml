  source_title: November 2019 Project Performance Report - Energy Under Control
  publish_date: 2019-11
  project_name: Energy Under Control
  what_happened: Delays in metering upgrades in NSW, caused partly by the exclusive
    domain of Metering Data Providers (MDPs) over NMI meters, impeded data feed delivery
    to the kWatch® Controller. Different customers had different MDPs, each requiring
    separate relationship-building and negotiations for meter upgrades.
  lesson_learnt: Map the metering data provider landscape for each customer site before
    committing to a deployment timeline — MDP exclusivity over NMI meters and the
    need to manage multiple independent MDPs can substantially delay metering upgrades
    and block real-time data feeds critical to DR operation.
  issue_severity: major
