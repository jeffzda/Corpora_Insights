- record_id: ARENA-DLV-53068
  source_title: June 2021 Project Performance Report - Energy Under Control
  publish_date: 2021-06
  project_name: Energy Under Control (Flow Power ARENA Demand Response Trial)
  what_happened: Customers who responded to high wholesale prices immediately before
    a RERT activation event experienced significant baseline erosion under the CAISO
    10-of-10 methodology, which reduced their measured performance and therefore their
    RERT payments, creating a disincentive for customers to be dual-responsive.
  lesson_learnt: Aggregators operating dual-trigger (spot price + RERT) portfolios
    should advise customers of the baseline erosion risk from price-responsive load
    reductions occurring in the two hours before a RERT event; program designers should
    consider whether the baseline methodology adequately handles customers that respond
    to both spot prices and reserve signals.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: null
