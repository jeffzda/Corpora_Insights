- record_id: ARENA-DLV-62851
  source_title: May 2019 Project Performance Report – Energy Under Control
  publish_date: 2019-05
  project_name: Energy Under Control
  what_happened: Initial customer recruitment yielded significantly lower demand reductions
    than anticipated. The first test delivered only 1.52 MW against a target of 5
    MW (contracted portfolio expected to provide 6 MW), and the second test delivered
    3.51 MW against a target of 5 MW from a portfolio expected to provide 9 MW.
  lesson_learnt: Over-subscribe demand response portfolios to hedge against weather
    conditions and altered production conditions — initial contracted capacity consistently
    underdelivered against targets, and over-subscription is the identified mitigation.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Flow Power over-subscribed the portfolio in later tests, achieving
    27.9 MW reduction from a 39.3 MW maximum demand portfolio against a 5 MW target
    in Test Two.
  transferability: broad
  delay_magnitude: null
  technology_domain: demand response
  source_pages: &id074
  - 8
  evidence_excerpt: The initial contracted portfolio was expected to provide 6 MW,
    however the first test yielded only 1.5 MW. The second test yielded a 3.6 MW reduction
    in demand from an expected portfolio of 9 MW. The risk of portfolio underperformance
    due to weather conditions or altered production conditions can be mitigated by
    over-subscribing the portfolio.
