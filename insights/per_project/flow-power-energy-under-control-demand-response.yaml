  what_happened: Customers — particularly those not already Flow Power electricity
    customers — expressed resistance to integrating the kWatch® Intelligent Controller
    with their existing control systems, creating a significant barrier to site activation.
  lesson_learnt: Address technology integration concerns proactively by clearly explaining
    controller operation and signalling protocols to non-incumbent customers before
    they commit — unresolved integration anxiety is a primary cause of late-stage
    drop-out from DR programs.
