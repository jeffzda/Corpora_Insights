  source_title: June 2021 Project Performance Report - Energy Under Control
  publish_date: 2021-06
  project_name: Energy Under Control (Flow Power ARENA Demand Response Trial)
  what_happened: Flow Power found that DR sales consistently required an internal
    champion within the customer organisation to progress; without an in-house champion,
    proposals consistently stalled regardless of the strength of the commercial case.
  lesson_learnt: Identify and cultivate an in-house champion within each target customer
    organisation before committing significant sales effort — without internal advocacy
    the DR proposition will not progress through the customer's decision-making process
    regardless of its financial merit.
