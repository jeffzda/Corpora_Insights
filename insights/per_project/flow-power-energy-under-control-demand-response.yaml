- record_id: ARENA-DLV-71401
  source_title: November 2018 Project Performance Report - Energy Under Control
  publish_date: 2018-11
  project_name: Energy Under Control
  what_happened: Large commercial and industrial customers (maximum demand >1 MW)
    declined to participate in the demand response program because the financial reward
    was insufficient to offset their perceived operational risks, forcing Flow Power
    to pivot to smaller businesses and in some cases subsidise controller installation.
  lesson_learnt: When recruiting large C&I customers for demand response, ensure the
    financial incentive is clearly proportionate to their operational risk exposure
    — if it is not, target smaller businesses with lower risk thresholds and consider
    subsidising hardware costs to lower participation barriers.
  issue_severity: moderate
  project_type: DER/customer-side
