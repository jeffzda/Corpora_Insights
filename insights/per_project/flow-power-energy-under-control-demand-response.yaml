  outcome_class: delayed but recoverable
  secondary_failure_mode: coordination & stakeholders
  intervention_note: Modifications were made to the Controller to allow pulsing inputs
    from older meters as a workaround; however meter upgrades remained the preferred
    path due to reliability and scalability concerns.
