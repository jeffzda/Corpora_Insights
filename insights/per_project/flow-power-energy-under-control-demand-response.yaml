  evidence_excerpt: Seasonality of customer loads continues to be significant – the
    agricultural loads are primarily based on irrigation requirements, which are significantly
    reduced or in some cases non-existent during winter. Cold store loads while constant
    throughout the year are highly dependent on ambient temperatures. This is an issue
