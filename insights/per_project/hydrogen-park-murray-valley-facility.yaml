- record_id: ARENA-DLV-9763
  source_title: AGIG - Hydrogen Park Murray Valley - Lessons Learnt Report 1
  publish_date: 2025-06
  project_name: Hydrogen Park Murray Valley
  what_happened: The project chose to sell RGGO certificates directly to local industrial
    consumers (Mars Petcare) rather than bundling them with gas supply or selling
    to an intermediary trader, building a direct relationship with a community stakeholder
    while achieving better value realisation for both parties during the early market-building
    phase.
  lesson_learnt: During the early market-building phase for renewable gas certificates,
    engage directly with industrial consumers in close proximity to the project rather
    than routing through intermediaries — direct engagement builds community connection,
    enables a better value proposition, and helps educate the market about certification
    scheme benefits.
