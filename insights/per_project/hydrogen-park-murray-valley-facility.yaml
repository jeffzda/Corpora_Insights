- record_id: ARENA-DLV-9765
  source_title: AGIG - Hydrogen Park Murray Valley - Lessons Learnt Report 1
  publish_date: 2025-06
  project_name: Hydrogen Park Murray Valley
  what_happened: The project identified that future RGGO and Product GO certificate
    revenue could be further supported by government recognition of renewable gas
    certification schemes within mandated and voluntary emissions reporting frameworks,
    which would broaden the market and increase willingness to pay among industrial
    consumers.
  lesson_learnt: Project developers and industry bodies should advocate for recognition
    of renewable gas certification schemes (RGGO, Product GO) within government-mandated
    and voluntary emissions reporting frameworks — this would materially increase
    market demand for certificates and reduce the commercial risk associated with
    certificate revenue in project business cases.
