  delay_category: stakeholder/land/community
  failure_mode: design assumption failure
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Evaluated many sites during the development phase before selecting
    the West Wodonga Wastewater Treatment Plant adjacent site, which satisfied the
    combined infrastructure, planning and community requirements.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages:
