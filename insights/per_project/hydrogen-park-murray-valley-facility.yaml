- record_id: ARENA-DLV-9754
  source_title: AGIG - Hydrogen Park Murray Valley - Lessons Learnt Report 1
  publish_date: 2025-06
  project_name: Hydrogen Park Murray Valley
  what_happened: Detailed design review of the imported electrolyser package revealed
    that several localisation changes were required, including additional isolation
    points, remotely operable process control elements, enhanced remote monitoring
    instrumentation, and upgraded material specifications (100% NDT of welds, higher-grade
    stainless steels, increased nickel-plating thickness).
  lesson_learnt: When procuring a complex electrolyser package, extend compliance
    and quality assurance activities to all key sub-component suppliers from the outset
    — do not rely solely on the OEM to cascade requirements — and pre-qualify sub-suppliers
    against Australian standards before contract award to reduce rework risk.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: procurement
  proponent_type: utility/energy retailer
  delay_category: procurement/supply chain
  failure_mode: poor scoping
  outcome_class: delayed but recoverable
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Formalised HAZOP, LOPA and SIL studies were undertaken alongside
    design reviews for operability and maintainability; enhanced quality specifications
    including NDT of 100% of welds were incorporated before equipment left China.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages:
  - 7
  - 9
  evidence_excerpt: Additional elements of the localisation process included design
    reviews for operability and maintainability, leading to inclusion of additional
    isolation points, remotely operable process control elements, and enhanced instrumentation
    for remote monitoring, undertaking of formalised HAZOP and LOPA analyses and SIL
    studies, as well as enhanced quality specifications and inspections such as NDT
    of 100% of welds, use of higher-grade stainless steels, and increased thickness
    specifications of nickel plating.
