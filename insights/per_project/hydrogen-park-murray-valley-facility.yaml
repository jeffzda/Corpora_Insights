- record_id: ARENA-DLV-9760
  source_title: AGIG - Hydrogen Park Murray Valley - Lessons Learnt Report 1
  publish_date: 2025-06
  project_name: Hydrogen Park Murray Valley
  what_happened: Obtaining approval for the medium-voltage electricity supply connection
    to the facility required significantly more time and effort than the hydrogen
    pipeline approvals because the electricity route needed to cross major road and
    rail infrastructure corridors, triggering heightened requirements from the relevant
    infrastructure owners.
  lesson_learnt: Identify early whether any required utility connections (electricity,
    water, gas) must cross major infrastructure corridors such as highways, rail lines
    or major pipelines — if crossings cannot be avoided, engage the relevant infrastructure
    authorities at the earliest opportunity in the development phase to understand
    their requirements and constraints before finalising the connection route or site
    selection.
