- record_id: ARENA-DLV-9751
  source_title: AGIG - Hydrogen Park Murray Valley - Lessons Learnt Report 1
  publish_date: 2025-06
  project_name: Hydrogen Park Murray Valley
  what_happened: Achieving compliance of the Chinese-manufactured alkaline electrolyser
    package with Australian standards took approximately 6 months longer than the
    planned 10-month timeframe, requiring more than 6 trips to manufacturing facilities
    and extensive engagement with sub-component suppliers across a long supply chain.
  lesson_learnt: Prioritise early identification and pre-emptive translation of all
    componentry documentation — wiring diagrams, equipment manuals down to individual
    components, hazardous-area electrical certifications, and pressure-vessel design
    calculations — before verification activities commence, to minimise the number
    of subsequent document request cycles.
  issue_severity: major
  project_type: industrial decarbonisation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: procurement
  proponent_type: utility/energy retailer
  delay_category: procurement/supply chain
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: execution & logistics
  intervention_note: Engaged an Australian multidisciplinary engineering consultancy
    with a presence near the Chinese manufacturing facility to guide design and manufacturing
    stages, supplemented by additional 3rd-party inspectors at key fabrication milestones.
  transferability: moderate
  delay_magnitude: 3-12 months
  technology_domain: hydrogen
  source_pages:
  - 9
  evidence_excerpt: Pain points in undertaking this process were centred around timely
    design information flows and the need to have documentation translated to enable
    the verification process. Given the first-of-a-kind nature of this undertaking,
    a lot of documentation did not exist in English to be verified and often review
    of documentation led to requests for further documentation and subsequent translation
    which added to the verification timeline.
