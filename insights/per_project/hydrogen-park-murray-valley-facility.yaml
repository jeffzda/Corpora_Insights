  project_name: Hydrogen Park Murray Valley
  what_happened: Industrial natural gas consumers who are the intended customers for
    RGGO and Product GO certificates have only emerging awareness of renewable gas
    certification markets, how they work, and the decarbonisation benefits available
    to them, creating a market education challenge for project developers seeking
    certificate sales revenue.
  lesson_learnt: Budget for significant market education effort when contracting renewable
    gas certificate sales to industrial customers — awareness of certification schemes
    and their value is low, and project developers should factor in time and resources
    to build that understanding, particularly for first-mover projects.
