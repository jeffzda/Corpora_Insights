- record_id: ARENA-DLV-9762
  source_title: AGIG - Hydrogen Park Murray Valley - Lessons Learnt Report 1
  publish_date: 2025-06
  project_name: Hydrogen Park Murray Valley
  what_happened: The project adopted an unbundled contracting strategy — selling the
    physical hydrogen as an energy commodity into the gas network and separately contracting
    the renewable attributes via RGGO certificates — which enabled both offtake streams
    to be contracted without requiring end users to invest in new equipment or take
    direct delivery of hydrogen.
  lesson_learnt: 'Adopt an unbundled offtake strategy for early renewable hydrogen
    projects: sell the energy commodity (gas blending) and the renewable attributes
    (RGGO or Product GO certificates) through separate contracts to separate customers
    — this maximises the addressable buyer pool, lowers adoption barriers, and reduces
    offtake risk while the market matures.'
