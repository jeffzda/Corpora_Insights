    of 2015, and NSW Riverina electricity prices increased by 30% from 2011 to 2012
    due to demand charges, making some irrigation equipment prohibitively expensive.
    These tariff changes were identified as creating a step-change improvement in
    the economics of renewable energy for irrigators.
  lesson_learnt: Renewable energy projects targeting Queensland and NSW irrigation
    operators should be timed and sized with reference to the ongoing tariff phase-out
    schedule — the withdrawal of concessional agricultural electricity tariffs creates
    a dynamic window where renewable energy economics improve substantially, and projects
    sized and contracted during the transition period will capture the strongest economics.
