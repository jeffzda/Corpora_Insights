  project_name: Renewable Energy Opportunities in the Australian Water Sector (ARENA
    Sector Study)
  what_happened: Agricultural and irrigation sector stakeholders reported a broader
    spread of barriers to solar PV adoption compared to urban water utilities, including
    knowledge gaps (10%), regulatory barriers (10%), and technical maturity concerns
    (10%), alongside cost (37%) and technical/performance issues (23%). Lower uptake
    than the urban sector despite higher electricity costs suggested that the barrier
    was knowledge rather than economics.
  lesson_learnt: Renewable energy projects targeting agricultural irrigators should
    invest in education and demonstration activities alongside financial support —
    the sector pays higher electricity prices than urban utilities yet has lower uptake,
    indicating that knowledge gaps and perceived technical maturity are the binding
    constraints, not economics.
