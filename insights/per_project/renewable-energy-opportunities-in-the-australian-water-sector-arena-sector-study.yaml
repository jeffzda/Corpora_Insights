    should quantify and include the co-benefits of shading (57% performance uplift
    from cell cooling, reduced algal blooms, reduced evaporation) in the business
    case — failing to account for these water sector-specific benefits will systematically
    underestimate project value compared to equivalent ground-mount installations.
