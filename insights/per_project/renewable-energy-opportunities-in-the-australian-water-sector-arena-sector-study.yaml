  source_title: Renewable Energy Opportunities in The Australian Water Sector
  publish_date: 2015-11
  project_name: Renewable Energy Opportunities in the Australian Water Sector (ARENA
    Sector Study)
  what_happened: Australia's biogas storage capability significantly lagged international
    practice (Australian TML 7 vs international TML 9), with the predominant Australian
    practice being to flare excess biogas rather than store it. This prevented biogas
    facilities from shifting generation to offset peak electricity tariffs, reducing
    project viability particularly for smaller facilities.
  lesson_learnt: Biogas projects at wastewater treatment plants should incorporate
    biogas storage at the design stage to enable flexible generation timing aligned
    with peak electricity tariffs — the current Australian practice of flaring excess
    biogas forfeits the financial benefit of peak tariff offsetting, which is the
    primary mechanism by which small-scale biogas projects achieve viability.
