- record_id: ARENA-DLV-43767
  source_title: Renewable Energy Opportunities in The Australian Water Sector
  publish_date: 2015-11
  project_name: Renewable Energy Opportunities in the Australian Water Sector (ARENA
    Sector Study)
  what_happened: Australia's desalination plants (six major plants across five states
    totalling approximately 487 GL/year capacity) had all been designed with renewable
    energy offset arrangements — typically large-scale wind farms contracted to offset
    electricity consumption via RECs — however several plants had been mothballed
    or underutilised following increased rainfall, reducing the operational value
    of these offset arrangements.
  lesson_learnt: Renewable energy offset arrangements for large water infrastructure
    (such as dedicated wind farms for desalination plants) should be structured to
    retain value when the primary asset is on standby — if the water asset is placed
    in standby, the renewable energy contract may continue to generate cost without
    offsetting operational electricity consumption, creating a stranded cost risk
    that should be addressed in contract design.
