- record_id: ARENA-DLV-43752
  source_title: Renewable Energy Opportunities in The Australian Water Sector
  publish_date: 2015-11
  project_name: Renewable Energy Opportunities in the Australian Water Sector (ARENA
    Sector Study)
  what_happened: Urban water utilities across Australia reported that relatively cheap
    bulk electricity tariffs available to large water utilities reduced the financial
    return on investment for renewable energy projects, making it difficult to obtain
    internal management approval and justify projects to stakeholders on purely financial
    grounds.
  lesson_learnt: For renewable energy projects at large urban water utilities with
    access to cheap bulk grid electricity, project proponents should build the business
    case around non-financial co-benefits (carbon, resilience, reputation) or target
    applications with higher electricity costs such as desalination or pumping — financial
    justification based solely on electricity offset will typically not pass management
    approval at current tariff levels.
