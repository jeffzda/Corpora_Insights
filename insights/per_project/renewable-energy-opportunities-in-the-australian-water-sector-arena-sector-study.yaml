- record_id: ARENA-DLV-43780
  source_title: Renewable Energy Opportunities in The Australian Water Sector
  publish_date: 2015-11
  project_name: Renewable Energy Opportunities in the Australian Water Sector (ARENA
    Sector Study)
  what_happened: Urban water utilities demonstrated high flexibility in demand management
    for time-of-use tariff optimisation, while the agricultural sector showed high
    flexibility constrained by irrigation timing requirements (licensing, crop cycle,
    evaporation avoidance). Both sectors had high perceived benefit for battery storage
    but little deployment, suggesting an untapped opportunity for demand management
    to reduce energy costs and enable renewable integration.
  lesson_learnt: Water sector renewable energy projects should leverage the inherent
    demand management flexibility of pumping loads — urban utilities already exploit
    time-of-use tariff optimisation, and this same principle can be extended to shift
    pumping to periods of high renewable generation, reducing storage requirements
    and improving project economics without requiring dedicated battery investment.
