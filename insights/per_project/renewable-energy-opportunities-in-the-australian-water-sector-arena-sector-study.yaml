- record_id: ARENA-DLV-43753
  source_title: Renewable Energy Opportunities in The Australian Water Sector
  publish_date: 2015-11
  project_name: Renewable Energy Opportunities in the Australian Water Sector (ARENA
    Sector Study)
  what_happened: Stakeholder surveys found that 58% of urban water sector respondents
    cited capital cost as the primary barrier to solar PV adoption, with payback period
    and return on investment cited as too low for management approval. A further 17%
    cited technical and performance issues, primarily intermittency and inability
    to store or export excess generation at adequate value.
  lesson_learnt: Solar PV projects targeting urban water utilities must address both
    the capital cost hurdle and the intermittency/export value problem simultaneously
    — structuring projects around storage or demand-shifting to improve self-consumption
    will improve both the financial case and technical performance case required for
    management approval.
