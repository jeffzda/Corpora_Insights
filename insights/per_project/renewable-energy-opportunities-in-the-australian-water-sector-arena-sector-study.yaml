- record_id: ARENA-DLV-43751
  source_title: Renewable Energy Opportunities in The Australian Water Sector
  publish_date: 2015-11
  project_name: Renewable Energy Opportunities in the Australian Water Sector (ARENA
    Sector Study)
  what_happened: Stakeholder surveys and workshops across the Australian water sector
    (n=121 responses) identified that grid connection cost and uncertainty were a
    significant regulatory barrier to renewable energy deployment for both urban water
    utilities and agriculture/irrigation operators, creating project risk that deterred
    investment.
  lesson_learnt: When developing renewable energy projects at water sector sites,
    budget for grid connection studies early and treat connection cost and requirements
    as a major project risk — stakeholders across both urban and agricultural sub-sectors
    identified high cost and uncertain requirements of grid connection as a key barrier
    that creates project risk.
