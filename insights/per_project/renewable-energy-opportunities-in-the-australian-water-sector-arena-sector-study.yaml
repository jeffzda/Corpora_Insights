- record_id: ARENA-DLV-43756
  source_title: Renewable Energy Opportunities in The Australian Water Sector
  publish_date: 2015-11
  project_name: Renewable Energy Opportunities in the Australian Water Sector (ARENA
    Sector Study)
  what_happened: Urban water sector stakeholders identified that the inability to
    allocate exported renewable energy to other sites via wheeling arrangements reduced
    the viability of renewable energy projects. Regulatory frameworks did not permit
    energy generated at one site to be credited at another site owned by the same
    utility.
  lesson_learnt: Water utility renewable energy projects that may generate export
    energy should assess wheeling arrangements and regulatory frameworks before finalising
    project scope — the inability to wheel exported energy to other utility-owned
    sites is a known project viability constraint that should be addressed either
    through regulatory engagement or by right-sizing generation to avoid excess export.
