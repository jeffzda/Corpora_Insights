  what_happened: Australia's regulatory definition of renewable energy for in-conduit
    hydro installations (Section 3B, Renewable Energy (Electricity) Regulations 2001)
    requires that pumping energy used to raise water before hydro generation be treated
    as an auxiliary loss, meaning that in many in-conduit hydro installations the
    initial pumping energy exceeds energy generated and the installation therefore
    does not qualify as renewable energy.
  lesson_learnt: In-conduit hydro projects at water distribution facilities must verify
    renewable energy eligibility under the Renewable Energy (Electricity) Regulations
    before making investment decisions — where water is pumped prior to release for
    hydro generation, the auxiliary loss rules may mean the installation does not
    qualify for RECs, materially affecting project economics and requiring early legal/regulatory
    advice.
