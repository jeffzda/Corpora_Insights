  what_happened: Australia's agricultural sector has a significant proportion of off-grid
    and fringe-of-grid diesel pumping applications, with electricity and diesel costs
    for pumping accounting for 50–80% of total farm energy bills. The Australian Government's
    diesel fuel excise rebate for agriculture increased the cost-competitiveness of
    diesel relative to renewable alternatives, partially offsetting the economic case
    for renewable pumping transitions.
  lesson_learnt: Renewable pumping business cases for agricultural operators must
    account for the diesel excise rebate that reduces the effective cost of diesel
    — the net cost of diesel after rebate is lower than headline price, and project
    economics should be modelled on the net diesel cost to avoid overestimating renewable
    payback; where the subsidy is being phased out, this risk should be disclosed
    to investors.
