  what_happened: Urban water sector stakeholders reported high interest in small-scale
    wind but very low uptake, with cost, regulatory barriers and performance issues
    identified as the primary reasons. Regulatory and community acceptance issues
    for wind were cited as more significant barriers than for other renewable energy
    technologies.
  lesson_learnt: Small-scale wind projects at water sector sites face regulatory and
    community acceptance barriers that are disproportionately larger than those for
    solar PV — project developers should conduct community engagement and assess planning
    approval pathways before investing in wind resource assessment, as regulatory
    barriers (not resource or economics) are the primary constraint.
