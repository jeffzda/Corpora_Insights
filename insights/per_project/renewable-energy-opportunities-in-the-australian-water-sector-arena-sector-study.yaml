  source_title: Renewable Energy Opportunities in The Australian Water Sector
  publish_date: 2015-11
  project_name: Renewable Energy Opportunities in the Australian Water Sector (ARENA
    Sector Study)
  what_happened: Melbourne Water's Western Treatment Plant generated 72 GWh/year of
    electricity from biogas, providing 95% of the plant's electricity requirements,
    while Australia's urban wastewater sector had approximately 34 MW of installed
    biogas electricity generation capacity across 22 plants. However, of 84 plants
    with anaerobic digestion, only 46 (55%) were capturing biogas and generating energy,
    indicating a significant missed opportunity at the remaining 45% of plants.
  lesson_learnt: Wastewater treatment plants with existing anaerobic digestion infrastructure
    that are not yet capturing biogas should be prioritised for retrofit investment
    — 45% of Australian plants with anaerobic digestion were not capturing biogas
    energy at the time of the study, representing a straightforward retrofit opportunity
    with demonstrated economics from Melbourne Water's Western Treatment Plant which
    achieves 95% electricity self-sufficiency.
