  source_title: Renewable Energy Opportunities in The Australian Water Sector
  publish_date: 2015-11
  project_name: Renewable Energy Opportunities in the Australian Water Sector (ARENA
    Sector Study)
  what_happened: Agricultural and irrigation sector stakeholders identified that significant
    demand seasonality — with extended periods of zero irrigation requirements between
    cropping cycles — increases payback periods for installed renewable capacity,
    because excess electricity generation during off-season cannot be exported at
    adequate value.
  lesson_learnt: Renewable energy systems for irrigation pumping should be sized to
    match peak-season demand rather than annual average demand, and project economics
    should account for the low capacity utilisation during off-season periods — oversizing
    relative to seasonal peak will extend payback periods and may make projects unviable
    without export revenue.
