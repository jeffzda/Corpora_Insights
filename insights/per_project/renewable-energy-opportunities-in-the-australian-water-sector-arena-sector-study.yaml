- record_id: ARENA-DLV-43755
  source_title: Renewable Energy Opportunities in The Australian Water Sector
  publish_date: 2015-11
  project_name: Renewable Energy Opportunities in the Australian Water Sector (ARENA
    Sector Study)
  what_happened: Stakeholder surveys found that insufficient biogas production was
    a major barrier to biogas project viability at urban wastewater treatment plants,
    affecting payback periods and economies of scale. Small wastewater treatment plants
    with inadequate flow were identified as particularly unviable for standalone biogas
    projects.
  lesson_learnt: Biogas projects at smaller wastewater treatment plants should be
    designed around co-digestion of external organic waste streams from the outset
    — adding co-digestion at the Glenelg WWTP increased power generation from 55%
    to 75% of plant requirements, demonstrating that co-digestion is the primary lever
    to improve project viability where biogas production alone is insufficient.
