  what_happened: The canal-top solar PV project in Gujarat, India demonstrated that
    covering irrigation canals with solar panels could simultaneously generate electricity
    (1.6 million kWh/year for the 1 MW pilot), prevent evaporation (9 million litres
    per year), and achieve capital cost recovery within 13 years for a larger 10 MW
    installation, but faced challenges including higher capital cost due to canal-spanning
    support structures, panel cleaning difficulties, and security risks.
  lesson_learnt: Canal-top solar PV projects must account for significantly higher
    balance-of-system costs (support structures spanning the canal), panel cleaning
    and maintenance logistics in dusty environments, and vandalism risk at the design
    and budgeting stage — these costs are not present in conventional ground-mount
    solar and failure to account for them will produce inaccurate feasibility results.
