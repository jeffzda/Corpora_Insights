  what_happened: Desalination in Australia uses approximately 10 times the energy
    per kilolitre of traditional water sources (e.g., 5.62 kWh/kL in Melbourne vs
    0.45 kWh/kL for traditional sources), yet all six Australian desalination plants
    were designed to offset their energy use via renewable energy arrangements from
    the outset, demonstrating that high-energy water infrastructure can be built with
    renewable energy integration as a standard design requirement.
  lesson_learnt: High-energy water infrastructure projects (particularly desalination)
    should incorporate renewable energy offset or direct supply arrangements at the
    design and contracting stage rather than retrofitting — the Australian desalination
    fleet demonstrates that renewable energy integration is achievable and bankable
    for very high-energy-intensity water infrastructure, and early integration reduces
    cost and complexity.
