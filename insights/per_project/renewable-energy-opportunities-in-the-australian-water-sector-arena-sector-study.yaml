- record_id: ARENA-DLV-43757
  source_title: Renewable Energy Opportunities in The Australian Water Sector
  publish_date: 2015-11
  project_name: Renewable Energy Opportunities in the Australian Water Sector (ARENA
    Sector Study)
  what_happened: Stakeholder surveys found that renewable energy generation is widely
    viewed as 'not core business' across both urban water and agricultural/irrigation
    sub-sectors, and is frequently seen as a distraction or complication to core operations
    and maintenance activities. This cultural barrier was identified by stakeholders
    in both sectors as a general barrier to project development.
  lesson_learnt: Renewable energy projects at water sector organisations should be
    structured to minimise operational burden on the host organisation — engaging
    specialist O&M contractors, using PPAs or leasing structures, and framing the
    project as an energy cost reduction measure rather than an energy generation business
    will reduce the 'not core business' objection that consistently blocks project
    development across both urban and agricultural water sub-sectors.
