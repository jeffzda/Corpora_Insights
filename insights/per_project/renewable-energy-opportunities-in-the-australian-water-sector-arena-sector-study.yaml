    technology with substantial international precedent — project developers should
    draw on international operational experience rather than treating co-digestion
    as experimental, and should plan for upstream waste logistics (waste segregation,
    transport, characterisation) as the primary project complexity rather than the
    anaerobic digestion technology itself.
