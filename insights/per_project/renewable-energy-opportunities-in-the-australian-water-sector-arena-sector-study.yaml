  source_title: Renewable Energy Opportunities in The Australian Water Sector
  publish_date: 2015-11
  project_name: Renewable Energy Opportunities in the Australian Water Sector (ARENA
    Sector Study)
  what_happened: Australia's price uncertainty around electricity and Renewable Energy
    Certificates (RECs) was identified by urban water utility stakeholders as making
    renewable energy project viability uncertain, hindering investment decisions.
    The lack of stable long-term price signals prevented projects from proceeding
    past feasibility stage.
  lesson_learnt: Renewable energy projects at water utilities should use Power Purchase
    Agreements (PPAs) or other long-term offtake structures to lock in revenue certainty
    before proceeding to investment decision — the water utility sector's requirement
    to justify costs to stakeholders makes price uncertainty a binding constraint
    that cannot be resolved by improved project modelling alone.
