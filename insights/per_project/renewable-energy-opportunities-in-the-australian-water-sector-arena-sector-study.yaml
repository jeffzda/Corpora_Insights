  what_happened: Australia lagged international practice for battery storage deployment
    within the water sector (Australian TML 6 vs international TML 7), with no known
    use of battery storage specifically within the water sector at the time of the
    study, despite emerging trials for intermittent pumping applications and high
    perceived benefit from stakeholders in both urban and agricultural sub-sectors.
  lesson_learnt: Battery storage pilot projects co-located with water sector renewable
    pumping applications represent a high-value opportunity to close a demonstrated
    technology maturity gap — both urban water and agricultural stakeholders rated
    battery storage as high perceived benefit, but deployment is zero, indicating
    that a demonstration project generating performance data would unlock substantial
    follow-on investment.
