- record_id: ARENA-DLV-43761
  source_title: Renewable Energy Opportunities in The Australian Water Sector
  publish_date: 2015-11
  project_name: Renewable Energy Opportunities in the Australian Water Sector (ARENA
    Sector Study)
  what_happened: Stakeholder surveys found high interest in floating solar PV among
    urban water utilities but very limited uptake (only one installation in Jamestown,
    SA as of 2015). Stakeholder feedback confirmed that limited information was available
    on the technical performance and benefits of floating solar, making feasibility
    assessment challenging and preventing investment decisions.
  lesson_learnt: Floating solar PV projects at water sector sites face a knowledge
    barrier rather than a fundamental technical or commercial barrier — the primary
    obstacle is the absence of local performance data and standardised feasibility
    methodologies; generating and publishing Australian performance data (including
    evaporation reduction, algal growth suppression, and panel efficiency benefits)
    would unlock a pipeline of projects that stakeholders are already motivated to
    pursue.
