  what_happened: Australia significantly lagged international practice for co-digestion
    at wastewater treatment plants (Australian TML 7 vs international TML 8), with
    only emerging interest and trials at a few facilities. The first large-scale co-digestion
    project in Australia (Yarra Valley Water at Wollert) was still in the pre-construction
    planning stage as of late 2015.
