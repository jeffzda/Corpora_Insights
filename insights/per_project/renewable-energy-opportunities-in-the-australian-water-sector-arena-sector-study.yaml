  what_happened: Stakeholder surveys found that both urban water and agricultural/irrigation
    sectors identified demand/load matching as a major technical barrier — the output
    profile of renewable energy technologies does not align with pumping demand requirements,
    and inadequate energy storage exists to overcome this barrier.
  lesson_learnt: Renewable energy pumping projects in the water sector must address
    demand/load matching at the design stage — incorporating pumped water storage
    (using tanks or reservoirs as a storage medium) or battery storage to decouple
    generation from demand will be necessary to achieve viable project outcomes, particularly
    for irrigation applications with strong seasonality.
