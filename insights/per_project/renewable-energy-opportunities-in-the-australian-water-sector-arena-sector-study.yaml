  what_happened: Agricultural sector stakeholders reported low awareness of renewable
    energy financing mechanisms (less than 20% were aware), compared to over 50% awareness
    among urban water sector stakeholders. This knowledge gap contributed to lower
    renewable energy uptake in the agricultural sector despite higher electricity
    and diesel costs that would otherwise favour investment.
  lesson_learnt: Renewable energy programs targeting the agricultural water sector
    should include dedicated financing education and awareness components — the sector
    pays higher energy costs than urban utilities and has stronger economics for renewable
    energy, but less than 20% of agricultural stakeholders were aware of available
    financing mechanisms, suggesting awareness rather than economics is the binding
    constraint.
