  what_happened: Most feasible sites in Australia for large-scale hydroelectric power
    generation had already been developed or were unavailable due to environmental
    protection, limiting new large-scale hydro opportunities. The trend shifted to
    mini-hydro and pumped hydro using existing water infrastructure, with mini-hydro
    accounting for only 2% of total installed hydroelectric capacity in Australia
    as of 2012.
  lesson_learnt: New hydroelectric projects in Australia should focus on mini-hydro
    retrofits to existing distribution and irrigation infrastructure, or pumped hydro
    conversions of existing water storage sites (such as the proposed Kidston 330
    MW pumped storage project using a former mining pit) rather than greenfield large
    dam projects — the latter face both resource scarcity and environmental approvals
    barriers that make them effectively non-viable.
