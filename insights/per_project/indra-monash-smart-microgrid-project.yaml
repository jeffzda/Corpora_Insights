- record_id: ARENA-DLV-9136
  source_title: State of DER Technology Integration Report
  publish_date: 2021-02
  project_name: Indra Monash Smart Microgrid Project
  what_happened: The Indra Monash Smart Microgrid project identified several impediments
    to BAU adoption including regulatory barriers to embedded network deployment (documented
    under a separate Victorian Government funded project), the need to understand
    commercial model viability, and the challenge that the Clayton campus is on a
    non-constrained part of the network, making it difficult to simulate and demonstrate
    network support benefits.
  lesson_learnt: Microgrid demonstrations on non-constrained network segments cannot
    fully validate the network support value proposition — project teams should select
    demonstration sites on constrained feeders where the benefits are observable,
    or invest in credible simulation that quantifies network support value that cannot
    be measured directly on site.
