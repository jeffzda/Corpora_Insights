  publish_date: '2022-07-29'
  project_name: Miniaturised Methanol Production as Hydrogen Carrier from Biomass
    Pyrolysis Syngas
  what_happened: Heat management was identified as a critical design challenge for
    miniaturised methanol synthesis reactors because the exothermic reaction can sinter
    and deactivate Cu-Zn catalysts if reaction temperature exceeds 300°C in an intensified
    process.
  lesson_learnt: Reactor design for small-scale methanol synthesis must prioritise
    heat dissipation — intensified reactors without adequate thermal management will
    deactivate Cu-Zn catalysts through sintering above 300°C; internal cooling coil
    configurations should be evaluated alongside micro-tubular designs at the pilot
    stage.
