  publish_date: '2022-07-29'
  project_name: Miniaturised Methanol Production as Hydrogen Carrier from Biomass
    Pyrolysis Syngas
  what_happened: Cu-based catalysts prepared using co-precipitation with a Cu/Zn/Al
    mass ratio of 60/30/10 demonstrated the highest methanol synthesis activity and
    remained stable across 8 heat-up/cool-down cycles over 60 hours on stream, outperforming
    other preparation methods and metal combinations tested.
  lesson_learnt: For small-scale methanol synthesis, co-precipitation is a low-cost
    and robust preparation method for Cu/ZnO/Al2O3 catalysts — a Cu/Zn/Al ratio of
    60/30/10 wt% should be the starting point for future catalyst development in biomass-to-methanol
    processes.
