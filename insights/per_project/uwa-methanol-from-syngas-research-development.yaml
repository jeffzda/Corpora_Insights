- record_id: ARENA-DLV-2204
  source_title: Miniaturised Methanol Production as Hydrogen Carrier from Biomass
    Pyrolysis Syngas - End of Activity Report
  publish_date: '2022-07-29'
  project_name: Miniaturised Methanol Production as Hydrogen Carrier from Biomass
    Pyrolysis Syngas
  what_happened: Techno-economic analysis showed that miniaturised methanol production
    from biomass pyrolysis syngas is economically viable (NPV of $3.57M, IRR of 9.4%)
    at a selling price of $0.67/kg, but the minimum viable price is $0.51/kg and the
    project economics are sensitive to interest rates and vulnerable to external and
    market conditions.
  lesson_learnt: Techno-economic assessments for novel biomass-to-methanol processes
    should include sensitivity analysis on interest rates and methanol price floor
    — the margin between viable and non-viable operation is narrow and the technology
    is exposed to market volatility; additional hidden benefits (waste minimisation,
    environmental) should be monetised to strengthen the commercial case.
