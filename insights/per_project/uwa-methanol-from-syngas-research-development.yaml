  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: Steam methane reforming (SMR) using Ni-based catalyst was deployed
    to upgrade the syngas quality — under reforming at 695°C and 1 bar, the stoichiometric
    gas ratio R increased to 1.48, eleven times higher than raw pyrolysis syngas,
    enabling substantially improved methanol yields.
