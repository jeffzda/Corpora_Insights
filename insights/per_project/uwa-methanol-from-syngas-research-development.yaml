  source_title: Miniaturised Methanol Production as Hydrogen Carrier from Biomass
    Pyrolysis Syngas Mid-Term Activity October 2020
  publish_date: 2020-10
  project_name: Miniaturised Methanol Production as Hydrogen Carrier from Biomass
    Pyrolysis Syngas
  what_happened: During planning for pilot-scale integration at the project partner's
    biomass pyrolysis plant, it was discovered that the syngas produced by the pyrolysis
    plant could only reach slightly above atmospheric pressure, whereas the methanol
    synthesis reactor requires 30–50 bar. Safely boosting combustible gas to the required
    pressure was identified as a significant technical and safety challenge not fully
    anticipated at project outset.
  lesson_learnt: Before designing a methanol synthesis reactor for integration with
    a partner's biomass pyrolysis plant, confirm the available syngas pressure at
    the integration site — a mismatch between pyrolysis plant output pressure and
    synthesis reactor requirements introduces significant safety and engineering challenges.
    Multi-stage pneumatic-driven gas boosters were identified as a viable solution,
    but the safety implications of pressurising combustible gas should not be underestimated.
  issue_severity: moderate
