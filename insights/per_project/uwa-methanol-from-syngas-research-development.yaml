  source_title: Miniaturised Methanol Production as Hydrogen Carrier from Biomass
    Pyrolysis Syngas - End of Activity Report
  publish_date: '2022-07-29'
  project_name: Miniaturised Methanol Production as Hydrogen Carrier from Biomass
    Pyrolysis Syngas
  what_happened: Integrating a steam methane reforming (SMR) step ahead of methanol
    synthesis increased the stoichiometric gas ratio R from raw pyrolysis syngas to
    1.48 — eleven times higher — enabling methanol yields to rise from 16% (raw syngas)
    to 57% (upgraded syngas) with the same Cu/Zn/Al catalyst.
  lesson_learnt: For biomass pyrolysis-to-methanol processes, inserting an SMR pre-treatment
    step is a technically straightforward and highly effective method to improve syngas
    quality and dramatically increase methanol yield — this process integration step
    should be designed into the system from the outset rather than added as a remediation.
