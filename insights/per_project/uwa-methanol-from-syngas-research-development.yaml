- record_id: ARENA-DLV-2201
  source_title: Miniaturised Methanol Production as Hydrogen Carrier from Biomass
    Pyrolysis Syngas - End of Activity Report
  publish_date: '2022-07-29'
  project_name: Miniaturised Methanol Production as Hydrogen Carrier from Biomass
    Pyrolysis Syngas
  what_happened: Raw biomass pyrolysis syngas produced methanol yields too low to
    meet economic targets across all catalysts tested, because the syngas has low
    H2, high carbon oxides, and high concentrations of impurities (methane and small
    hydrocarbons) that degrade catalyst performance.
  lesson_learnt: Do not assume raw biomass pyrolysis syngas is suitable for direct
    methanol synthesis — a syngas upgrading step (such as steam methane reforming)
    is required before methanol synthesis can approach economic viability at small
    scale.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: lab/bench
