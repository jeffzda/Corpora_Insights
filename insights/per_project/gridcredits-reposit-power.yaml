- record_id: ARENA-DLV-64411
  source_title: Distributed Energy Resources (DER) Integration Project Contribution Assessment
  publish_date: 2019-03
  project_name: GridCredits (Reposit Power)
  what_happened: Reposit Power's ARENA-funded GridCredits trial (5 homes, $445,666 grant) demonstrated one of the first successful instances of residential batteries discharging during an FCAS-triggered
    event and customers receiving payment in the form of GridCredits. This proved that smart battery control could provide frequency control services from behind-the-meter DER.
  lesson_learnt: Small-scale DER battery trials can establish proof-of-concept for FCAS participation and customer reward mechanisms at very low cost; the critical finding is that measurement and verification
    of battery response during contingency events is technically feasible at residential scale, which underpins the case for larger-scale FCAS demonstrations.
