- record_id: ARENA-DLV-64412
  source_title: Distributed Energy Resources (DER) Integration Project Contribution Assessment
  publish_date: 2019-03
  project_name: GridCredits (Reposit Power)
  what_happened: Following the ARENA-funded GridCredits trial, Reposit Power leveraged the learnings and funding to establish the first and largest Canberra VPP (500+ households), win a $4.5 million ACT
    Government grant, and build a national Partner Network. Reposit's technology was subsequently used in three further ARENA-funded projects (Networks Renewed, Peak Demand Reduction Using Solar and Storage,
    CONSORT).
  lesson_learnt: A small, well-targeted ARENA pilot ($445k) can serve as the commercial and technical foundation for a proponent to attract further government funding at 10x scale and build industry partnerships
    — ARENA grants are most effective when they de-risk the first demonstration step in a proponent's growth trajectory.
