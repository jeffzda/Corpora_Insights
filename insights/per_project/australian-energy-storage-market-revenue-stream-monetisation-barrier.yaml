- record_id: ARENA-DLV-16266
  source_title: Energy Storage Study
  publish_date: 2015-07
  project_name: Australian Energy Storage Market — Revenue Stream Monetisation Barrier
  what_happened: Project developers and NSPs found it difficult to monetise all value
    streams of energy storage systems, particularly the wholesale energy component
    for NSP-owned storage. Without an aggregator or retailer, some economic drivers
    (wholesale arbitrage, ancillary services) were inaccessible to end-user or network-connected
    installations.
  lesson_learnt: Aggregator and retailer business models are essential to unlock the
    full value stack for energy storage — projects that cannot access wholesale and
    FCAS markets without intermediaries should incorporate aggregation arrangements
    into their commercial structure from inception, not as an afterthought.
