  source_title: National Low-Voltage Feeder Taxonomy Study
  publish_date: 2021-10
  project_name: National Low-Voltage Feeder Taxonomy Study
  what_happened: The project confirmed that AEMO's NMI smart meter data provides only
    real power at 30-minute resolution, which is insufficient for accurate LV network
    analysis. High time resolution (sub-5-minute) data and reactive power data are
    both needed to accurately assess network losses and voltage quality, particularly
    given cloud cover variability and phase unbalance effects common in LV networks.
  lesson_learnt: DER integration research requiring accurate LV power flow analysis
    should not rely on AEMO NMI data as its primary load dataset; projects should
    either commission sub-5-minute active and reactive power monitoring on selected
    networks, or explicitly acknowledge that 30-minute active-power-only data will
    produce optimistic loss and voltage assessments.
