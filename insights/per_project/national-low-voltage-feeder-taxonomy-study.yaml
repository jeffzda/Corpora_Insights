- record_id: ARENA-DLV-29316
  source_title: National Low-Voltage Feeder Taxonomy Study
  publish_date: 2021-10
  project_name: National Low-Voltage Feeder Taxonomy Study
  what_happened: The initial clustering runs using standard elbow-method and mean
    silhouette score both yielded k=6 clusters, which domain experts considered too
    few to capture all expected LV network types. The final cluster count of k=23
    was chosen based on Davies-Bouldin index performance combined with domain expert
    review, after testing k=2 through k=40.
