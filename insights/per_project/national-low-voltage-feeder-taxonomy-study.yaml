- record_id: ARENA-DLV-29312
  source_title: National Low-Voltage Feeder Taxonomy Study
  publish_date: 2021-10
  project_name: National Low-Voltage Feeder Taxonomy Study
  what_happened: Despite wide agreement among DNSP partners on the need for greater
    data sharing, many networks refrained from sharing significant amounts of useful
    data. Reasons included privacy and security concerns, lack of DNSP capability
    or resources to facilitate sharing, and concern about sacrificing strategic opportunities.
    This limited the representativeness of the national taxonomy.
  lesson_learnt: Data sharing agreements with DNSPs should be negotiated early and
    explicitly, with a clear framework separating customer privacy data from network
    topology data; proponents should not assume willingness to share data will translate
    into actual data flows without structured governance and defined data-sharing
    protocols.
