  publish_date: 2021-10
  project_name: National Low-Voltage Feeder Taxonomy Study
  what_happened: The dataset was strongly geographically biased, with over 90% of
    LV networks located in south-eastern Australia, dominated by Ausgrid (63,580%)
    and TasNetworks (28,546% of raw dataset). DNSPs from other regions provided very
    few networks, and several states were entirely absent, meaning the resulting 23-cluster
    taxonomy under-represents important network topologies.
  lesson_learnt: National LV network taxonomy projects should negotiate minimum data
    quotas from each state or DNSP region before commencing analysis to avoid geographic
    bias dominating cluster outcomes; if equitable data cannot be obtained, results
    should be clearly scoped as regional rather than national.
  issue_severity: major
  project_type: software/data/digital
  project_scale_band: demonstration
