  source_title: National Low-Voltage Feeder Taxonomy Study
  publish_date: 2021-10
  project_name: National Low-Voltage Feeder Taxonomy Study
  what_happened: Power flow simulation of Network S — a single-phase rural network
    with high feeder impedance — showed a load voltage of approximately 218 V at the
    customer end, which is below the AS 61000.3.100 lower limit of 216 V (1st percentile)
    and outside the preferred operating range, even with a relatively small load assigned.
    This occurred because the reference bus was set to 225 V (0.9 pu) due to the long
    high-impedance feeder.
  lesson_learnt: Long rural single-phase feeders with high impedance are particularly
    susceptible to under-voltage even at low load levels; network planners deploying
    DER on such feeders should include conservation voltage reduction or tap-changer
    management as standard mitigations rather than optional enhancements.
