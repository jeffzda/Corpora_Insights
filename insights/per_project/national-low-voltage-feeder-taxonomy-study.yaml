  publish_date: 2021-10
  project_name: National Low-Voltage Feeder Taxonomy Study
  what_happened: Processing the network model data required conversion from multiple
    proprietary formats (Excel, PowerFactory, PSS/Sincal) into a common open format.
    The diversity of formats, proprietary access restrictions, differing data models,
    and absence of commercial-grade conversion tools made data ingestion a major proportion
    of total project effort.
  lesson_learnt: Data-intensive energy research projects that ingest data from multiple
    proprietary DNSP formats should treat format conversion as a first-class engineering
    task requiring dedicated software engineering resources and multi-platform testing;
    trial-and-error approaches against subsets of actual data are insufficient.
