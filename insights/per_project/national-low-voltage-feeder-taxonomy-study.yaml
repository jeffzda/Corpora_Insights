    periods of reverse power flow. The network operates nominally at 250 V, leaving
    little margin before overvoltage limits are breached, and the mutual induction
    between unbalanced phases also caused the lowest voltages to be lower than in
    the base case.
  lesson_learnt: Networks with nominal operating voltages at or near the upper end
    of the permissible range (e.g. 250 V phase-to-neutral) are disproportionately
    constrained in their ability to host rooftop PV; voltage setpoint optimisation
    at the distribution transformer is a prerequisite for maximising PV hosting capacity
    on such networks.
