- record_id: ARENA-DLV-29305
  source_title: National Low-Voltage Feeder Taxonomy Study
  publish_date: 2021-10
  project_name: National Low-Voltage Feeder Taxonomy Study
  what_happened: Confidentiality constraints prevented the software developer responsible
    for data extraction code from accessing actual DNSP network data during development
    and testing. The developer could only work against a small set of public test
    data that was not representative of the real data, and a second person with data
    access was required to be involved in all testing cycles, significantly complicating
    the development process.
  lesson_learnt: When data confidentiality prevents developers from accessing actual
    data, projects should establish a sanitised but representative sample of real
    data for testing, or accept substantially longer development timelines; indirect
    access models that require a separate intermediary for every test cycle are inefficient
    and should be anticipated in project planning.
