  source_title: National Low-Voltage Feeder Taxonomy Study
  publish_date: 2021-10
  project_name: National Low-Voltage Feeder Taxonomy Study
  what_happened: An error in the custom parser for Ausgrid's non-standard Excel format
    caused load data to be missing from many nodes. The issue was discovered after
    the internal release of the final report when Ausgrid identified that the average
    number of loads per network was approximately half the correct figure (10 vs 20
    loads per network across ~45,000 networks).
  lesson_learnt: Custom parsers written for non-standard proprietary data formats
    should include automated validation checks against known summary statistics provided
    by the data owner; post-hoc error discovery at the reporting stage requires expensive
    re-analysis and risks delaying publication.
