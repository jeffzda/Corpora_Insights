  project_name: National Low-Voltage Feeder Taxonomy Study
  what_happened: Clustering runs with k values below 16 produced clusters that almost
    exclusively split the dataset by DNSP rather than by genuine network topology
    characteristics, an artefact of the highly imbalanced dataset in which Ausgrid
    and TasNetworks dominated. This made low-k results unreliable for use as a national
    taxonomy.
  lesson_learnt: When clustering heterogeneous datasets from multiple data providers
    with very unequal sample sizes, validate cluster outputs to ensure clusters reflect
    real-world features rather than data provenance; consider stratified sampling
    or weighting approaches to reduce provider-dominance effects before proceeding
    to higher-k analysis.
