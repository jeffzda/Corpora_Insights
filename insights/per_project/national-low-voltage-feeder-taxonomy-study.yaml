- record_id: ARENA-DLV-29302
  source_title: National Low-Voltage Feeder Taxonomy Study
  publish_date: 2021-10
  project_name: National Low-Voltage Feeder Taxonomy Study
  what_happened: DNSP-provided network data was characterised by varying and often
    severe completeness issues across all seven participating DNSPs, including missing
    distributed generators, loads and service lines, missing grounding data, undocumented
    GIS coordinate systems, and inconsistent impedance representations. For all but
    two DNSPs, the data were incomplete and biased samples of actual LV network assets.
  lesson_learnt: Projects relying on DNSP network data should budget substantial time
    and resources for data cleaning before any analysis can begin; standardised data
    formats and quality expectations should be agreed with DNSPs at project inception
    to avoid biased results.
