  project_name: National Low-Voltage Feeder Taxonomy Study
  what_happened: The DiTTo parser was modified to include LV-splitting functionality
    directly within the parser classes rather than as a separate post-processing function.
    This architectural decision made it difficult to reintegrate the changes back
    into the open-source DiTTo codebase, and the PowerFactory parser — which relies
    on a single-threaded proprietary API — could not benefit from multi-processing
    improvements.
  lesson_learnt: When extending open-source tools for project-specific needs, implement
    project-specific functionality as separate modules rather than modifying core
    classes; this preserves the ability to contribute improvements upstream and avoids
    creating unresolvable dependencies on proprietary interfaces.
