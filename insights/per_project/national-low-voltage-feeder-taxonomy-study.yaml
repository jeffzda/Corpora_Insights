- record_id: ARENA-DLV-29306
  source_title: National Low-Voltage Feeder Taxonomy Study
  publish_date: 2021-10
  project_name: National Low-Voltage Feeder Taxonomy Study
  what_happened: Virtually all LV network data received from DNSPs was provided in
    Kron-reduced form with impedance specified in sequence components, an approximation
    that assumes perfect transposition and balanced loading. This is inappropriate
    for LV networks, which are inherently unbalanced and have single-phase branches,
    limiting the accuracy of power flow simulations.
  lesson_learnt: Projects requiring accurate unbalanced LV power flow simulation should
    specify at project outset that DNSPs must provide non-Kron-reduced, phase-domain
    impedance data; accepting sequence-component data for LV networks introduces systematic
    inaccuracy that cannot be corrected after data collection.
  issue_severity: major
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: data/validation/testing
  failure_mode: poor scoping
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: data & measurement
  intervention_note: The team recommended development of first-principles cable and
    overhead line libraries in the 'abcn' coordinate space using Carson's equations
    as a future work item to address this systematic data gap.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: grid/system stability
  source_pages: &id006
  - 20
  - 21
  evidence_excerpt: In the data we received from the DNSPs, it was observed that virtually
    all LV network data was in Kron-reduced form. Furthermore, the impedance data
    was specified in sequence components (symmetrical components)… transposition does
    not occur in the LV system, and would not resolve the fact that some parts of
    the network are inherently unbalanced.
