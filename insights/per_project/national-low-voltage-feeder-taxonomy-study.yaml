- record_id: ARENA-DLV-29314
  source_title: National Low-Voltage Feeder Taxonomy Study
  publish_date: 2021-10
  project_name: National Low-Voltage Feeder Taxonomy Study
  what_happened: DNSP network records were generally maintained to reflect the network
    as designed rather than as built and operated. When field changes such as line
    replacements or reconfigurations occurred, updates were not consistently propagated
    across GIS, ADMS, and power engineering simulation platforms, meaning no single
    system represented a reliable source of truth.
  lesson_learnt: Research projects that depend on DNSP network models should verify
    whether those models reflect as-designed or as-built conditions; projects requiring
    operational accuracy should push for DNSP commitment to maintain a single source
    of truth across GIS and simulation platforms, supported by business process changes
    for field crews.
  issue_severity: major
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: data/validation/testing
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: coordination & stakeholders
  intervention_note: An automated cycle-removal algorithm was developed that successfully
    de-looped approximately 3,000 LV networks by identifying and opening likely switch
    elements; approximately 20 networks with unresolvable cycles were excluded from
    analysis.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: grid/system stability
