  source_title: National Low-Voltage Feeder Taxonomy Study
  publish_date: 2021-10
  project_name: National Low-Voltage Feeder Taxonomy Study
  what_happened: The project identified a significant deficit in digital literacy
    and capability across DNSPs, regulators, and researchers, particularly in the
    intersection of data science and electrical engineering. Most data scientists
    are trained for time-series or tabular data and lack skills in graph-based network
    data processing, while most electrical engineers lack software engineering and
    data science skills.
  lesson_learnt: Programmes involving LV network data should proactively assess the
    digital capabilities of all project participants at inception and provide targeted
    training or recruit specialised staff; the scarcity of professionals skilled in
    both power systems and data science is a systemic constraint that should be treated
    as a project risk.
