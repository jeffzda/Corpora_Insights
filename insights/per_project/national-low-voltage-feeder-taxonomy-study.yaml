  what_happened: Data extraction and transformation software had to be developed concurrently
    with actually performing the extraction and transformation, because testing on
    a subset of source data invariably failed to expose all data idiosyncrasies. This
    required both software and processed data to be version-controlled, and the workflow
    required iterative development throughout the project.
  lesson_learnt: Data pipeline development for novel, heterogeneous network datasets
    should be planned as an iterative engineering process with version control for
    both code and data from the outset; do not assume that a test subset will expose
    all production data issues before the pipeline is finalised.
