- record_id: ARENA-DLV-29327
  source_title: National Low-Voltage Feeder Taxonomy Study
  publish_date: 2021-10
  project_name: National Low-Voltage Feeder Taxonomy Study
  what_happened: The project identified that proprietary power engineering data formats
    — particularly PowerFactory's .pfd format — require expensive software licences
    for data access, and no commercial-grade tools exist to convert between formats.
    OpenDSS, while technically capable, has a steep learning curve and lacks user-friendly
    debugging functionality for network data issues.
  lesson_learnt: ARENA-funded research programmes involving LV network simulation
    should advocate for and contribute to the development of open, licence-free network
    data formats and conversion tools; projects that depend on proprietary formats
    should budget for licence costs and tool development, and should not assume off-the-shelf
    conversion solutions exist.
