  source_title: National Low-Voltage Feeder Taxonomy Study
  publish_date: 2021-10
  project_name: National Low-Voltage Feeder Taxonomy Study
  what_happened: The project found a sizeable gap between the amount of data, tools,
    skills, and capabilities required to enable a low-cost bidirectional grid and
    what currently exists in the Australian electricity sector. DNSPs underestimate
    their network hosting capacity because they lack reliable data, leading to conservative
    constraints that reduce overall network utilisation and increase costs to customers.
  lesson_learnt: DNSP investment cases for improved network data collection should
    be framed around quantified hosting capacity uplift and reduced customer costs,
    rather than data quality as an abstract goal; without a clear link between data
    investment and network utilisation outcomes, DNSPs will continue to under-invest
    in data.
