- record_id: ARENA-DLV-29301
  source_title: National Low-Voltage Feeder Taxonomy Study
  publish_date: 2021-10
  project_name: National Low-Voltage Feeder Taxonomy Study
  what_happened: The project's more ambitious objective — to develop a national taxonomy
    representative of real-world distribution networks — was not fully achieved. Instead,
    the team produced a taxonomy of distribution network data based on the incomplete
    data DNSPs had assembled, meaning some clusters may reflect data artefacts rather
    than real-world network features.
  lesson_learnt: Data-driven taxonomy projects that depend on DNSP-supplied network
    data should account for significant incompleteness and bias in that data; the
    resulting models should be explicitly scoped as testbeds for simulation, not as
    bases for extrapolating real-world hosting capacity.
  issue_severity: major
