  project_name: National Low-Voltage Feeder Taxonomy Study
  what_happened: The project found that DNSPs lack appropriate middle-ware to synchronise
    network changes across multiple software platforms (GIS, ADMS, simulation tools),
    making it likely that some clusters identified were artefacts of specific DNSP
    data practices rather than genuine distinct network topologies. This echoes findings
    from an earlier ARENA-funded Solar Enablement Initiative project.
  lesson_learnt: Future ARENA-funded DER integration projects that rely on DNSP network
    data should explicitly address the inter-system synchronisation problem at project
    scoping; without a reliable single source of truth for network topology, simulation
    results cannot be confidently linked to real-world network conditions.
