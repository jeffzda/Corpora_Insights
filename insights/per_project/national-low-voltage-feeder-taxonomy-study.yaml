  source_title: National Low-Voltage Feeder Taxonomy Study
  publish_date: 2021-10
  project_name: National Low-Voltage Feeder Taxonomy Study
  what_happened: No publicly available Australian customer load data with sufficient
    time resolution and both active and reactive power profiles existed for use in
    the power flow simulations. The best available dataset — the Smart Grid Smart
    Cities Ausgrid Solar Homes data — was limited to 30-minute resolution, one geographic
    region (coastal NSW), and real power only, with no commercial or industrial customers.
  lesson_learnt: Future DER integration simulation projects should explicitly scope
    the availability of suitable public load data before committing to power flow
    analysis deliverables; where data gaps exist, budget for load profile synthesis
    or advocate for AEMO/DNSP data releases with higher time resolution and reactive
    power components.
