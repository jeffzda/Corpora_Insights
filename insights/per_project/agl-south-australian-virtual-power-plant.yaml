- record_id: ARENA-DLV-58807
  source_title: 'DER Customer Insights: The Customer Journey'
  publish_date: 2020-07
  project_name: AGL South Australian Virtual Power Plant
  what_happened: For AGL's South Australian VPP project, 78% of installation sites
    required a variation due to characteristics of the home when installing battery
    storage systems, significantly increasing the work, cost, and complexity of installation
    relative to initial estimates.
  lesson_learnt: Do not assume residential battery installations will be straightforward
    — the majority of homes are likely to require site-specific variations (switchboard
    upgrades, concrete plinths, roof repairs), so installation budgets and timelines
    should reflect a high variation rate rather than a standard case.
