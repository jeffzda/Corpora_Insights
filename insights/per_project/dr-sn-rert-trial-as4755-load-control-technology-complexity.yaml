- record_id: ARENA-DLV-20722
  source_title: Demand Response Short Notice RERT Trial Year 3 Report
  publish_date: 2021-10
  project_name: DR SN RERT Trial — AS4755 load control technology complexity
  what_happened: One trial participant cited the complexity, high costs, and erratic
    outcomes of the mechanism specified in Australian Standard AS4755 as the reason
    for discontinuing its residential direct load control program.
  lesson_learnt: The AS4755 standard mechanism for residential appliance load control
    is not operationally fit for purpose as a DR technology pathway — its complexity,
    cost, and unreliable performance make it unsuitable for scaled residential DR
    programs; program designers should seek alternative control technologies before
    committing to an AS4755-based architecture.
