    active flow balancing.'
  lesson_learnt: When designing evaporator circulation for a linear Fresnel solar
    thermal plant, size the circulation ratio to simultaneously address mist flow
    avoidance, low-load thermal stress, transient flow stability, and active flow
    balancing — failure to satisfy any one of these constraints risks tube thermal
    fatigue and operational instability.
