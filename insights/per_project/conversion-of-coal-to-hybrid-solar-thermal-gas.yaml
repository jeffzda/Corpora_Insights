  what_happened: The Ergon Energy Planning Study identified that the brownfield grid
    connection would still be exposed to standard new-connection risks including long
    lead-time equipment delays, unexpected construction difficulties, weather disruptions,
    and delays in accessing the Collinsville 33 kV switchyard for outages.
  lesson_learnt: Even on brownfield sites where some infrastructure advantages exist,
    projects must budget and programme for full new-connection risks — including long
    lead-time items, weather disruptions, and switchyard access outage scheduling
