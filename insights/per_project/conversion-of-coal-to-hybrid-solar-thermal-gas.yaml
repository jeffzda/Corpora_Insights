  source_title: Collinsville Solar Thermal Power Station Modelling Optimisation
  publish_date: null
  project_name: Collinsville Solar Thermal Power Station
  what_happened: MLF analysis for the Collinsville site showed that the project's
    MLF is largely driven by external factors — local demand growth, new entrant generators,
    and regional grid augmentation — rather than by the project's own generation output,
    with the MLF gradient at Collinsville substation being shallow across the 0–45
    MW dispatch range.
  lesson_learnt: Solar thermal and other small-to-mid-scale generators at transmission-connected
    regional sites should model MLF sensitivity to external scenarios (new entrant
    generators, demand growth, network augmentation) rather than focusing only on
    their own dispatch profile — the MLF can shift materially due to factors entirely
    outside the project's control, as illustrated by the downside scenario where a
    300 MW wind farm at Ross depressed the Collinsville MLF.
