  source_title: Collinsville Solar Thermal Power Station Knowledge Sharing Report
    4
  publish_date: null
  project_name: Collinsville Solar Thermal Power Station
  what_happened: A Powerlink transmission line traversed the proposed solar mirror
    field site, requiring RAC to commission a Network Transmission Line Relocation
    Study. On reviewing the costs, timeframes, and risks, RAC determined that relocating
    the transmission line was not cost-effective and instead purchased an adjacent
    block of land to relocate the solar mirror field.
  lesson_learnt: When a transmission line traverses a proposed solar field site, assess
    early whether relocating the solar field to adjacent land is more cost-effective
    than relocating the transmission infrastructure — Powerlink is under no statutory
    obligation to relocate its assets, making the network relocation option both costly
    and high-risk.
