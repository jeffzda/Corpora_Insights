    rural greenfield solar thermal sites can misclassify vegetation status in ways
    that would require costly biodiversity offsets if not corrected; early site investigation
    by ecologists to validate mapped ecosystem classifications should be a standard
    pre-development activity to avoid unnecessary offset obligations.
