  source_title: Collinsville Solar Thermal Power Station Modelling Optimisation
  publish_date: null
  project_name: Collinsville Solar Thermal Power Station
  what_happened: Technical modelling by Parsons Brinckerhoff comparing a refurbished
    existing power block against a new power block for a 30 MW hybrid solar thermal/gas
    plant at Collinsville found the new power block delivers approximately 20% higher
    cycle efficiency, 14% more solar generation, 21% less fossil fuel consumption,
    and 30% less water use from the same solar field, at a lower projected LCOE.
  lesson_learnt: When converting a coal-fired station to solar thermal hybrid, do
    not assume refurbishment of the existing power block is the lower-cost or lower-risk
    option — a modern purpose-designed turbine with reheat and fast-start capability
    can outperform refurbishment on efficiency, fuel, water, and LCOE, and should
    be evaluated at feasibility stage before design lock-in.
