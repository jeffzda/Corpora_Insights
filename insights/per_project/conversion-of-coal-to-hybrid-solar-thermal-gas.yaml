  what_happened: The feasibility study assessed thermal energy storage (TES) integration
    with the direct steam generation (DSG) solar thermal system and concluded it was
    unviable at Collinsville due to land constraints, and that feasible TES systems
    for DSG have not yet been developed and are likely to be high-cost when available.
  lesson_learnt: Thermal energy storage should not be assumed viable for direct steam
    generation solar thermal projects — no proven TES solution exists for DSG systems,
    and land constraints at brownfield sites may independently rule out the larger
    solar field footprint that TES requires. Assess TES viability explicitly and early
    in feasibility.
