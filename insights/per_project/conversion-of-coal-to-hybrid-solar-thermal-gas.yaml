- record_id: ARENA-DLV-71762
  source_title: Collinsville Solar Thermal Power Station Knowledge Sharing Report
    6
  publish_date: '2014'
  project_name: Collinsville Solar Thermal Power Station
  what_happened: Power system stability analysis found that a 30 MWe CST plant connected
    near a strong high-voltage bus does not significantly affect steady-state voltage
    in the distribution network, but does have a noteworthy impact on small- and large-disturbance
    voltage stability margins, with the voltage security margin (VSM) varying significantly
    with the CST plant's changing power profile.
  lesson_learnt: CST plant grid integration studies for medium-scale (1–30 MW) projects
    must assess dynamic voltage stability — not just steady-state voltage — because
    variable CST generation profiles can materially affect voltage security margins
    even when steady-state performance is acceptable; static power flow analysis alone
    is insufficient for connection approval.
