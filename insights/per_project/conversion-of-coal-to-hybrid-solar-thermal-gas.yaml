  publish_date: null
  project_name: Collinsville Solar Thermal Power Station
  what_happened: Ergon Energy's grid connection process — comprising Connection Enquiry,
    Planning Study, Scoping Study, Connection Application, and Offer to Connect —
    had entirely Ergon-controlled timelines with no predictable schedule, yet the
    resulting Offer to Connect carried a rigid 30-day acceptance period requiring
    the proponent to commit to construction without certainty on funding, contracts,
    or offtake.
  lesson_learnt: 'Network connection processes controlled entirely by the NSP can
    present an unmanageable risk: an unpredictable lead time followed by a rigid short
    acceptance window forces proponents to commit to major expenditure without project
    certainty — negotiate a longer or conditional acceptance period upfront, or align
    all other project workstreams to be ready to execute the moment an offer is received.'
