  what_happened: Only approximately 1.1 years of on-site solar irradiance measurement
    data was available at Collinsville, which was insufficient for robust long-term
    energy yield analysis. The study was forced to supplement site data with historical
    datasets from the nearby Rockhampton location to model multi-year performance.
  lesson_learnt: Solar resource measurement campaigns for CSP projects should begin
    as early as possible in project development and ideally run for multiple years
    before financial close; a single year of on-site data is insufficient for bankable
    yield analysis and forces reliance on proxy datasets that introduce additional
    uncertainty.
