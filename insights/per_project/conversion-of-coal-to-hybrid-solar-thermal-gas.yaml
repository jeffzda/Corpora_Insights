  project_name: Collinsville Solar Thermal Power Station
  what_happened: Ergon Energy's Planning Study confirmed that re-using the existing
    electrical connection infrastructure from the former coal-fired power station
    was not a viable option for the 30 MW solar thermal project, despite the brownfield
    site location.
  lesson_learnt: When siting a renewable energy project on a brownfield power station
    site, do not assume existing electrical connection infrastructure can be reused
    — a formal grid connection planning study should be commissioned early to confirm
    what, if any, existing assets are usable.
