  publish_date: null
  project_name: Collinsville Solar Thermal Power Station
  what_happened: EPC bids received for the 30MW solar thermal power station came in
    at $286 million total capital cost — approximately 84% (around $130 million) higher
    than the previous budget estimate prepared in May 2013. Bidders had only partially
    covered the required scope and noted that prices were budget estimates requiring
    revalidation once government financial commitment was obtained.
  lesson_learnt: Early-stage cost estimates for solar thermal projects should not
    be used as a basis for investment decisions without EPC-level validation — internal
    estimates using modelling software (e.g. Thermoflex) and incomplete scope definitions
    consistently understate final costs. Commission a detailed design and early contractor
    engagement (value engineering) before finalising financial viability assessments.
