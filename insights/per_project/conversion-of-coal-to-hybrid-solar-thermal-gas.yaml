  source_title: Collinsville Solar Thermal Power Station Initial Plant Assessment
    Report
  publish_date: '2013'
  project_name: Collinsville Solar Thermal Power Station
  what_happened: An initial technical assessment of the existing 180MW Collinsville
    coal-fired power station found that while repowering one unit (Unit 4, 30MW) as
    a solar thermal plant was technically feasible with no fatal flaws, the historic
    installation and maintenance regime meant a substantial portion of the power block
    required replacement, yielding only a moderate capital cost saving over installing
    a new power block entirely.
  lesson_learnt: When assessing coal-to-renewable repowering projects, do not assume
    significant cost savings from reusing existing infrastructure — aged plant with
    poor maintenance histories may require near-total replacement, eroding the capital
    cost advantage over a greenfield power block. Conduct a detailed condition assessment
    before committing to a refurbishment pathway.
