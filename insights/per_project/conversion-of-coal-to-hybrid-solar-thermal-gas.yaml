- record_id: ARENA-DLV-71761
  source_title: Collinsville Solar Thermal Power Station Knowledge Sharing Report
    6
  publish_date: '2014'
  project_name: Collinsville Solar Thermal Power Station
  what_happened: Dynamic modelling of the direct steam generation (DSG) solar field
    identified that parallel evaporator tubes are susceptible to two-phase flow maldistribution
    due to uneven solar heat flux, with some tubes potentially becoming entirely superheated
    and others entirely subcooled — a significant operational stability risk for the
    proposed plant.
  lesson_learnt: DSG linear Fresnel solar thermal plants must address two-phase flow
    instability in parallel evaporator tubes during design; a cascade control scheme
    using common pump and upstream control valves should be evaluated as a mitigation
    strategy before detailed design is finalised.
