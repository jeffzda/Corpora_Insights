  what_happened: The preferred solar field layout for the refurbishment option (Solar
    Field Option 1) required relocation of an existing Powerlink transmission line
    and construction works over an existing ash dam, both identified as potentially
    time-consuming and cost-prohibitive constraints. Even in the preferred configuration,
    the more remote subfield required approximately 900 metres of superheated steam
    piping, adding material cost.
  lesson_learnt: When siting solar fields at repowered or brownfield sites, existing
    infrastructure such as transmission lines and ash dams can impose significant
    layout constraints that drive up cost or extend schedule; site layout optimisation
    should explicitly map and cost these constraints early in feasibility to avoid
    false economies in the refurbishment pathway.
