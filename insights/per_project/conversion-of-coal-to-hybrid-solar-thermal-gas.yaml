  what_happened: Steam and water quality requirements for the hybrid plant were found
    to be demanding, requiring fully demineralised spray water, a condensate polisher,
    and steam separator efficiency of at least 99.8% to meet turbine inlet steam purity
    standards.
  lesson_learnt: For solar thermal plants using spray desuperheating, specify fully
    demineralised spray water and install a condensate polisher; returning water from
    boiler circulation circuits is not acceptable as it will compromise spray water
    quality and risk turbine damage — steam separator efficiency must reach at least
    99.8%, requiring a minimum baffle-plus-vane-separator design.
