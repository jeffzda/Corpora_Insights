- record_id: ARENA-DLV-71763
  source_title: Collinsville Solar Thermal Power Station Knowledge Sharing Report
    6
  publish_date: '2014'
  project_name: Collinsville Solar Thermal Power Station
  what_happened: O&M cost estimates provided by EPC bidders were described as budgetary
    only with limited scope detail; bidders excluded major overhaul costs and it was
    unclear whether major overhauls would be required within the five-year period,
    leaving the full lifecycle cost of the plant uncertain at the feasibility stage.
  lesson_learnt: O&M cost estimates sourced from EPC bidders at tender stage for first-of-kind
    solar thermal plants should be treated as provisional and supplemented with supplier-specific
    maintenance schedules; major overhaul costs should be explicitly scoped and included
    in lifecycle cost modelling rather than excluded by default.
