- record_id: ARENA-DLV-71760
  source_title: Collinsville Solar Thermal Power Station Knowledge Sharing Report
    6
  publish_date: '2014'
  project_name: Collinsville Solar Thermal Power Station
  what_happened: Soiling/dust analysis at Collinsville identified that a nearby open-cut
    coal mine to the south-west was the primary dust source, with peak airborne dust
    concentrations of ~31.5 µg/m³ in October. The interaction of local dust with mirror
    materials, and the optimal cleaning parameters for the jet washing system, remained
    unresolved at the time of the study.
  lesson_learnt: Solar field cleaning requirements for CSP projects near industrial
    dust sources (e.g. coal mines) should be explicitly characterised during feasibility,
    including dust particle chemistry and interaction with mirror materials, before
    finalising O&M cost estimates; uncharacterised soiling losses can materially affect
