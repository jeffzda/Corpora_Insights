- record_id: ARENA-DLV-51302
  source_title: Collinsville Solar Thermal Power Station Modelling Optimisation
  publish_date: null
  project_name: Collinsville Solar Thermal Power Station
  what_happened: When two co-located projects (solar thermal and solar PV) connect
    to the same substation bus, AEMO applies a single combined volume-weighted MLF
    to the site rather than separate MLFs for each technology. ROAM Consulting's analysis
    confirmed this for the Collinsville 132 kV substation and used the combined MLF
    in the financial assessment.
  lesson_learnt: Developers co-locating multiple generation technologies at a shared
    grid connection point should model the combined MLF for the whole site rather
    than individual technology MLFs — AEMO will apply a single volume-weighted MLF
    based on total station output, and using individual MLFs in financial models will
    overstate or misrepresent revenue.
