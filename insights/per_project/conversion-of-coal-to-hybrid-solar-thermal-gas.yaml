  what_happened: Drafting EPC and O&M contracts for an emerging solar thermal technology
    revealed that technology suppliers required greater contractual flexibility and
    longer remedy periods than standard contracts for established technologies, while
    EPC/O&M contractors required additional time for due diligence on the unfamiliar
    technology.
  lesson_learnt: When contracting for emerging technologies such as solar thermal,
    build additional time and flexibility into the tender schedule to allow technology
    suppliers to familiarise themselves with the local environment and EPC/O&M contractors
    to complete adequate due diligence — standard contract terms developed for established
    technologies are insufficient and will cause friction in the tender process.
