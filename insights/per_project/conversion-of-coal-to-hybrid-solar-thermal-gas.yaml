  what_happened: Integrating a hybrid solar thermal and gas power plant introduced
    significant engineering challenges around technology integration, including managing
    transient stresses from cloud cover, daily thermal cycling, and achieving reliable
    long-term operation over a 25-year design life.
  lesson_learnt: Hybrid solar-thermal/gas plants require careful engineering of key
    components — solar field receivers, piping, steam turbines, and boilers — to handle
    daily operating cycles and frequent short-term transients from cloud cover; robustness
    and tolerance of all conceivable loadings must be designed in from the outset,
    not retrofitted.
