  publish_date: null
  project_name: Collinsville Solar Thermal Power Station
  what_happened: The project team used photo simulation, a real-time 3D fly-over application,
    and 3D animation tools to communicate the visual and technical aspects of the
    novel solar thermal technology to stakeholders during early community engagement.
  lesson_learnt: For projects using unfamiliar technology, invest in high-quality
    visualisation tools (photo simulation, 3D fly-over, animation) during early stakeholder
