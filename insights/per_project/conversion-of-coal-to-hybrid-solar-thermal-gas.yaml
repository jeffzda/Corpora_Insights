  what_happened: The preliminary environmental assessment found that two parcels of
    land on the project site were mapped as containing 'of concern' and 'endangered'
    regional ecosystems, but the site investigation determined these mappings were
    incorrect. RAC initiated the process to amend the vegetation mapping via the Property
    Map of Assessable Vegetation instrument to reflect the true 'not of concern' status.
