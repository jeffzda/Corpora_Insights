- record_id: ARENA-DLV-51259
  source_title: Collinsville Solar Thermal Power Station Knowledge Sharing Report
    3
  publish_date: null
  project_name: Collinsville Solar Thermal Power Station
  what_happened: Gas consumption modelling for the hybrid plant showed that gas demand
    is highly variable and difficult to predict, fluctuating from zero to near 100%
    demand within a few hours due to the unstable solar resource, and varying significantly
    across days, weeks, and seasons.
  lesson_learnt: When designing gas supply infrastructure for a solar-thermal hybrid
    plant, do not use average or steady-state gas consumption figures as the basis
    for storage and supply contract sizing — model gas demand using hourly weather
    data over a full year and size storage to cover extended periods of high solar
    energy (which drive minimum gas consumption) as well as extended cloudy periods
    (which drive maximum demand).
