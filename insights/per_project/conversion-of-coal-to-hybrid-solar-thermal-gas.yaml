- record_id: ARENA-DLV-48305
  source_title: Collinsville Solar Thermal Power Station Knowledge Sharing Report
    5
  publish_date: null
  project_name: Collinsville Solar Thermal Power Station
  what_happened: Network system studies could not be finalised because detailed technical
    performance of the plant depends on the final equipment makes and models, which
    are not selected until after the EPC tender process and potentially during detailed
    design — creating a circular dependency with the connection process.
  lesson_learnt: 'Solar thermal project developers face a structural chicken-and-egg
    problem: NSP and AEMO require finalised equipment performance data for connection
    approval, but equipment is only finalised after EPC selection, which in turn depends
    partly on connection certainty — plan for iterative connection submissions and
    engage AEMO and the NSP early to agree on a staged data provision pathway.'
  issue_severity: major
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: approvals/contracting
  proponent_type: utility/energy retailer
  delay_category: grid connection/system studies
  failure_mode: coordination & stakeholders
  outcome_class: delayed but recoverable
  secondary_failure_mode: poor scoping
  intervention_note: AEMO's process accommodates staged data provision — datasheets
    are updated with R1 Data prior to construction and R2 Data after commissioning;
    RAC completed datasheets as far as possible with available information.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar thermal
  source_pages: &id029
  - 6
  evidence_excerpt: The detailed technical performance of the plant cannot be determined
    until the final makes and models of equipment are selected. This selection will
    not be completed until after the tender process and potentially during detailed
    design of the plant. This makes it difficult to confirm whether the plant will
    meet the technical performance standards required by the NSP and AEMO.
  confidence_note: Transferability rated moderate — this circular dependency is most
