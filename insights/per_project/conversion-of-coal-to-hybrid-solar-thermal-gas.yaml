  what_happened: The feasibility study identified integration of the gas-fired boiler
    with the solar field as a high-rated technical risk, due to the challenge of managing
    rapid steam transients when solar insolation changes and the need for the boiler
    to ramp quickly to compensate.
  lesson_learnt: For hybrid solar-gas plants, invest early in dynamic modelling of
    the steam generation system and design the control system and boiler specifically
    for fast ramp rates and rapid transients — integration complexity between dispatchable
    and variable generation sources is a high-probability technical risk that must
    be addressed in detailed design.
