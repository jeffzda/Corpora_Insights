  what_happened: Regional ecosystem mapping on the project site contained errors —
    some areas had been previously mapped incorrectly under the Property Map of Assessable
    Vegetation (PMAV) process. Detailed field work was required to correct the mapping
    status and confirm that the proposed clearing would not impact significant ecological
    values.
