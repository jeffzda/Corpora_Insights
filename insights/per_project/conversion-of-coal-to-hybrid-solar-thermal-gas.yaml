  what_happened: Using a typical meteorological year (TMY) for energy yield analysis
    was identified as inadequate for financing purposes because it excludes worst-case
    weather events; multiple years of historical data are needed to model realistic
    long-term climate variability including potential worst-case years.
  lesson_learnt: CSP project yield analyses submitted for PPA negotiation or investment
    purposes must use multi-year historical datasets rather than a typical meteorological
    year; TMY-based analysis is acceptable only for pre-feasibility studies and will
    not satisfy lender or off-taker requirements.
