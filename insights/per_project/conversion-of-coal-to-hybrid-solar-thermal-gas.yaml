  project_name: Collinsville Solar Thermal Power Station
  what_happened: The project's LCOE as determined through the competitive tender process
    was approximately $297/MWh, compared to an earlier estimate of $173/MWh — a 71%
    increase — which when compared against prevailing wholesale electricity market
    prices rendered the project financially non-viable without significant additional
    capital cost reduction of $142M.
  lesson_learnt: LCOE estimates for first-of-kind solar thermal projects derived from
    modelling tools and internal estimates should be treated as highly provisional;
    the gap between modelled LCOE and tender-validated LCOE can be large enough to
    determine project viability, and financial decisions should not be made until
    contractor-validated cost data is available.
