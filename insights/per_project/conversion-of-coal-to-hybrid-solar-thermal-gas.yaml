  publish_date: '2013'
  project_name: Collinsville Solar Thermal Power Station
  what_happened: The project site was found to encompass a mapped medium bushfire
    hazard area, requiring future development applications (material change of use
    or lot reconfiguration) to be assessed against the Bushfire Management Overlay
    Code, with liaison needed with Whitsunday Shire Council to confirm assessment
    requirements.
  lesson_halearnt: Solar thermal and other large-area renewable projects on rural
    sites should check bushfire hazard overlay mapping at the earliest feasibility
    stage — a medium or high bushfire hazard classification triggers additional design
