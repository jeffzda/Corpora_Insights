- record_id: ARENA-DLV-14979
  source_title: 'Looking Forward: Barriers, Risks and Rewards of the Australian Geothermal Sector to 2020 and 2030'
  publish_date: 2014-06
  project_name: Birdsville Geothermal Power Plant (Queensland)
  what_happened: The Birdsville geothermal power plant — Australia's only operating geothermal power plant as of 2014 — was built as an experimental plant funded by state and federal governments, using
    hot water from the Great Artesian Basin to generate 80 kWe net with a capacity factor exceeding 95 per cent, supplying approximately one third of Birdsville's electricity needs.
  lesson_learnt: Shallow direct-use and low-enthalpy geothermal resources in Australia can reliably generate small-scale off-grid electricity at high capacity factors using existing technology; off-grid
    remote community applications represent a commercially viable niche for geothermal energy where the comparison is against diesel generation costs rather than wholesale electricity prices.
