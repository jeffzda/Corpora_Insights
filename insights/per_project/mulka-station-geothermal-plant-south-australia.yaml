  evidence_excerpt: In 1986, Mulka Station in South Australia used a hot artesian
    bore (Great Artesian Basin) to produce a maximum 0.02 MW of power. However, as
    the project utilised a working fluid on the power plant site that was subsequently
    banned, it has since ceased operation.
  confidence_note: Issue severity coded as critical as the project was permanently
    discontinued. The working fluid ban represents a regulatory compliance failure.;
