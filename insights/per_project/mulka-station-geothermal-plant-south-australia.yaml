- record_id: ARENA-DLV-72011
  source_title: Australian Energy Resource Assessment — Second Edition, 2014
  publish_date: '2014'
  project_name: Mulka Station Geothermal Plant — South Australia
  what_happened: The Mulka Station geothermal plant, which commenced operation in
    1986 using a hot artesian bore to generate 0.02 MW, ceased operations because
    it utilised a working fluid on the power plant site that was subsequently banned.
  lesson_learnt: Geothermal binary-cycle plant designers must ensure working fluid
    selection complies with current and foreseeable environmental regulations — selection
    of a working fluid that was subsequently banned caused permanent plant shutdown,
    representing a regulatory compliance failure with long-term consequences.
