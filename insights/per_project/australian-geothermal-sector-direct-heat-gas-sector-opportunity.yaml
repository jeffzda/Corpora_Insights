  evidence_excerpt: The most prospective markets for geothermal energy in Australia out to 2030 are in remote locations that are off the grid and where there are commercial-scale applications for either
    electricity or direct heat... Direct heat uses in the gas sector, especially in the processing of shale gas, in locations where both gas and proven geothermal resources are co-located offer the most
    likely cost-competitive, commercial-scale market for geothermal energy in the next decade.
