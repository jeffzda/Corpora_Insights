- record_id: ARENA-DLV-14965
  source_title: 'Looking Forward: Barriers, Risks and Rewards of the Australian Geothermal Sector to 2020 and 2030'
  publish_date: 2014-06
  project_name: Australian Geothermal Sector – Direct Heat / Gas Sector Opportunity
  what_happened: Analysis of the Cooper Basin found that geothermal direct heat could become cost-competitive with unconventional gas processing costs under scenarios of high gas prices ($6–$7/GJ) and high
    shale gas production costs, particularly if flow rates could be doubled from the demonstrated 40 kg/s to at least 80 kg/s, with this pathway more likely to be commercially viable before 2030 than grid
    electricity generation.
  lesson_learnt: For early-stage geothermal technology in Australia, direct-heat applications co-located with industrial heat consumers (particularly oil and gas processing) represent the most credible
    near-term commercial pathway; project developers and funders should prioritise sites where geothermal resources and industrial heat demand are co-located rather than pursuing grid electricity as the
    primary market.
