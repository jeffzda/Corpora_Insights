- record_id: ARENA-DLV-47065
  source_title: Australian Concentrating Solar Thermal Industry Roadmap
  publish_date: 2018-08
  project_name: Australian CST Sector — Market Concentration
  what_happened: Market concentration among a small number of vertically integrated
    generator/retailer businesses created a natural oligopoly in PPA markets, with
    smaller retailers unable to enter long-term PPAs without external underwriting
    support. This restricted the pool of bankable off-takers available to CST and
    other renewable developers.
  lesson_learnt: Renewable energy developers — particularly those with dispatchable
    or novel technologies — should actively explore PPA underwriting structures and
    corporate off-taker channels rather than relying solely on large integrated retailers,
    as market concentration among a few large buyers gives developers insufficient
    negotiating power to achieve terms that reflect the full value of their generation.
  issue_severity: major
  project_type: generation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: financing/commercial close
  failure_mode: commercial & market
  outcome_class: delayed but recoverable
  secondary_failure_mode: null
  intervention_note: Roadmap recommends ARENA work with CEFC to develop PPA underwriting
    products and develop best-practice PPA standards to increase off-taker diversity
    and competition.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: solar thermal
  source_pages:
  - 63
  evidence_excerpt: Competition in the market is strongly affected by the current
    concentration of market power in a small number of vertically integrated operators
    across energy retail, trading and generation sectors. In large part, this is due
    to the larger entities being the only 'bankable' long-term buyers of electricity
    in the market, and the result is a natural oligopoly. Smaller retailers are often
    unable to enter long-term PPAs and could be assisted if their PPAs were made bankable
    by external underwriting.
