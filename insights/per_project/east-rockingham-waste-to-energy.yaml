- record_id: ARENA-DLV-55656
  source_title: East Rockingham Waste to Energy Lessons Learnt
  publish_date: 2020-05
  project_name: East Rockingham Waste to Energy
  what_happened: The Application and Queuing Access Policy in Western Australia, which
    requires Competing Access Groups (CAGs) to amalgamate for a joint network connection,
    introduced significant project risk for the East Rockingham proponent during the
    grid connection process.
  lesson_learnt: When connecting to the SWIS in Western Australia, assess the risk
    of the CAG queuing and amalgamation process early — being grouped with other proponents
    in a Competing Access Group can introduce schedule and commercial risks outside
    the project's control.
  issue_severity: major
  project_type: industrial decarbonisation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: grid connection/system studies
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: poor scoping
  intervention_note: East Rockingham opted for a Reference Connection to obtain a
    bespoke network connection designed individually, accepting that all connection
    costs including network upgrades would be borne solely by the proponent.
  transferability: narrow
  delay_magnitude: not quantified
  technology_domain: bioenergy
  source_pages: &id006
  - 9
  - 10
  evidence_excerpt: The Application and Queuing Access Policy where Competing Access
