  outcome_class: re-scoped/adapted
  secondary_failure_mode: regulatory & approvals
  intervention_note: null
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: bioenergy
  source_pages: &id005
  - 9
  evidence_excerpt: 'Grid Connection: consider accessibility and cost of grid connection
    when selecting a site (cost can vary from $6 to $15 million). Western Power may
    require a contribution from the project developers to reinforce the network in
    addition to connection costs. These costs can greatly impact project economics
    so try and identify them as early as possible.'
