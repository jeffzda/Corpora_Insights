    not subject to sufficiently early and rigorous interrogation by lenders, creating
    risk that assumptions embedded in the model were not adequately challenged before
    they became locked in.
  lesson_learnt: Work with lenders (including ARENA) from an early stage to compile
    a comprehensive list of model assumptions and subject them to rigorous challenge
    early and regularly — late discovery of flawed assumptions in project finance
    models is costly and can jeopardise financial close.
