- record_id: ARENA-DLV-55655
  source_title: East Rockingham Waste to Energy Lessons Learnt
  publish_date: 2020-05
  project_name: East Rockingham Waste to Energy
  what_happened: Grid connection to the South West Interconnecting System (SWIS) in
    Western Australia proved a difficult and costly process, with connection costs
    ranging from $6–$15 million and potential additional network reinforcement contributions
    required from the proponent, significantly impacting project economics.
  lesson_learnt: Identify grid connection costs and network reinforcement contributions
    as early as possible during site selection — connection to the SWIS can cost $6–$15
    million plus additional network reinforcement charges, and these costs can make
    or break project economics.
  issue_severity: major
  project_type: industrial decarbonisation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: project developer
  delay_category: grid connection/system studies
