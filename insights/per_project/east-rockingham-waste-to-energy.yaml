- record_id: ARENA-DLV-55651
  source_title: East Rockingham Waste to Energy Lessons Learnt
  publish_date: 2020-05
  project_name: East Rockingham Waste to Energy
  what_happened: Site selection for the East Rockingham WTE project identified that
    land zoning, buffers to sensitive receptors, road access, and grid connection
    accessibility are all critical factors that, if not adequately assessed upfront,
    create significant downstream delivery risk.
  lesson_learnt: Locate waste-to-energy projects in Heavy Industrial Zones with a
    minimum 500m buffer to sensitive receptors and confirm good road and grid access
    before committing to a site — failure to do so creates approvals, community, and
    connection problems that are difficult to resolve after site selection.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: concept/feasibility
  proponent_type: project developer
