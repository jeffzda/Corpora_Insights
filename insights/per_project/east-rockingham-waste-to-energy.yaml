  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: null
  intervention_note: Proponent engaged specialist consultants for EPA approvals and
    commissioned independent human health risk assessments to build community and
    regulator confidence.
  transferability: moderate
  delay_magnitude: 1-3 years
  technology_domain: bioenergy
  source_pages: &id003
  - 7
  evidence_excerpt: Waste to energy projects will attract the highest level of assessment
    by the environmental regulator. Proponents should embrace a detailed assessment
    process and factor in the project timeline of 18 months to 2 years to complete
