- record_id: ARENA-DLV-55653
  source_title: East Rockingham Waste to Energy Lessons Learnt
  publish_date: 2020-05
  project_name: East Rockingham Waste to Energy
  what_happened: Environmental approvals for the East Rockingham WTE project required
    the highest level of regulatory assessment, with the process taking 18 months
    to 2 years including potential appeals, representing a major schedule and budget
    commitment.
  lesson_learnt: Factor 18 months to 2 years into the project timeline for environmental
    approvals for waste-to-energy projects, engage the right consultants from the
    start, and set a realistic budget — there are no shortcuts in the EPA assessment
    process.
