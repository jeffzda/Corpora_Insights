    prior knowledge of waste-to-energy technology and undertook significant self-education
    during the East Rockingham approvals process, creating uncertainty and extended
    timelines for the proponent.
  lesson_learnt: Invest significant effort in educating environmental regulators and
    state and local government stakeholders about waste-to-energy technology early
    in the approvals process — regulators with no prior exposure will require time
    to self-educate, which extends approval timelines.
