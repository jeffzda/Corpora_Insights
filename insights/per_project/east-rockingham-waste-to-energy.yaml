- record_id: ARENA-DLV-55660
  source_title: East Rockingham Waste to Energy Lessons Learnt
  publish_date: 2020-05
  project_name: East Rockingham Waste to Energy
  what_happened: Project finance for the East Rockingham WTE project required all
    bankable components — waste supply agreements, power offtake, network connection,
    EPC, O&M, land tenure, environmental and planning approvals — to be finalised
    before financial close, making the development phase extremely expensive and placing
    all costs at risk until close.
  lesson_learnt: Recognise that WTE projects require every major commercial and regulatory
    component to be bankable and finalised before financial close — budget accordingly
    for a very expensive and fully at-risk development phase, and involve experienced
    international WTE lenders who can navigate the sector's complexity.
