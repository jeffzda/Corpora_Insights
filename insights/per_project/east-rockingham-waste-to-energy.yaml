  source_title: East Rockingham Waste to Energy Lessons Learnt
  publish_date: 2020-05
  project_name: East Rockingham Waste to Energy
  what_happened: The East Rockingham WTE project pioneered a 'waste arising' contract
    structure in which councils commit to deliver only residual waste left after recycling
    and recovery, rather than fixed volumes, transferring waste volume and composition
    risk to the project rather than the councils.
  lesson_learnt: Adopt a waste arising contract structure rather than put-or-pay contracts
    — it is more acceptable to councils who need flexibility to meet increasing waste
    diversion targets, and is critical to securing and maintaining social licence
    to operate for WTE projects in Australia.
