- record_id: ARENA-DLV-55652
  source_title: East Rockingham Waste to Energy Lessons Learnt
  publish_date: 2020-05
  project_name: East Rockingham Waste to Energy
  what_happened: Community opposition or lack of social licence is the primary stakeholder
    risk for waste-to-energy projects; the East Rockingham project found that continuous,
    honest community engagement throughout the entire project life was necessary to
    maintain support.
  lesson_learnt: Treat the community as the number one stakeholder from the outset
    — be honest about advantages and disadvantages, make the project relatable, and
    maintain consistent engagement across the whole project life to secure and retain
    social licence.
