  what_happened: Securing a Power Purchase Agreement in the corporate PPA market proved
    difficult for the East Rockingham WTE project, with limited opportunities to find
    creditworthy counterparties at favourable pricing and acceptable contractual terms.
  lesson_learnt: Retain competitive tension in the PPA sourcing process for as long
    as possible — the corporate PPA market has limited creditworthy counterparties
    willing to engage at favourable pricing, and losing competitive tension early
    weakens the proponent's negotiating position.
