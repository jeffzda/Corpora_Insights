- record_id: ARENA-DLV-50005
  source_title: Ocean Energy Report by Seanergy and Ernst and Young
  publish_date: 2016-06
  project_name: Garorim Bay Tidal Power Plant, South Korea
  what_happened: The planned 520 MW Garorim Bay Tidal Power Plant was suspended and
    technically revoked in November 2014 after the effective date under the Basic
    Plan for Reclamation of Public Waters expired, driven by strong opposition from
    local residents and environmental protection organisations. The Ministry of Environment
    later extended the project duration until 2020.
  lesson_learnt: Large tidal range projects face substantial risk of suspension or
    cancellation from environmental opposition and community resistance; developers
    should invest early in environmental impact assessment and community engagement,
    and ensure project approvals align with statutory time limits before investing
    in detailed design.
