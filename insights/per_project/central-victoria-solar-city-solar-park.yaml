- record_id: ARENA-DLV-72227
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: null
  project_name: Central Victoria Solar City Solar Park
  what_happened: Battery storage installed at the Bendigo Solar Park had capacity
    to store and discharge approximately 60kWh per day (approximately 5% of the park's
    total daily capacity), which was found to be insufficient to present an effective
    storage solution for a medium-scale solar asset.
  lesson_learnt: Battery storage systems co-located with medium-scale solar parks
    require substantially larger capacity than 5% of daily generation to deliver meaningful
    storage value — developers must model required storage capacity relative to total
    generation output before committing to a storage-integrated design.
