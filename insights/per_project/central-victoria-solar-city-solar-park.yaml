- record_id: ARENA-DLV-72226
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: null
  project_name: Central Victoria Solar City Solar Park
  what_happened: PV tracking systems installed at the Bendigo and Ballarat solar parks
    produced 21% and 12% more electricity respectively than fixed arrays of the same
    capacity, but maintenance costs and the relative cost of tracking equipment exceeded
    the additional income earned, making tracking systems financially unviable at
    these sites.
  lesson_learnt: Solar tracking systems generate significantly more electricity than
    fixed arrays but are not financially viable at small-to-medium scale solar parks
    when maintenance costs are factored in — project developers should conduct a full
    lifecycle cost analysis including maintenance before specifying tracking systems.
