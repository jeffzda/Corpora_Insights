- record_id: ARENA-DLV-18502
  source_title: Improving World-Record Commercial High-Efficiency N-Type Solar Cells
    Project Results & Lessons Learnt
  publish_date: 2021-03
  project_name: Improving World-Record Commercial High-Efficiency n-type Solar Cells
    through Recombination Analysis & Innovative Passivation
  what_happened: Commercial n-type silicon heterojunction (SHJ) solar cells, which
    had been assumed to be immune to light-induced degradation (unlike p-type cells),
    were found to exhibit significant degradation of up to 1% absolute efficiency
    under light soaking at elevated temperature (160°C). This was an unexpected finding
    with material implications for SHJ's commercial viability.
  lesson_learnt: Do not assume that n-type SHJ solar cells are stable under light
    soaking conditions — testing under a range of temperatures and light intensities
    should be included in any project evaluating SHJ technology for field deployment,
    as light-induced degradation of up to 1% absolute has been demonstrated and the
    mechanism is not yet resolved.
  issue_severity: major
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Further testing across a range of light intensities (0–40 suns)
    and temperatures (room temperature to 300°C) was conducted using a Loana I-V tester
    to characterise the degradation; the precise mechanism remains under investigation.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id002
  - 9
  - 10
  evidence_excerpt: We demonstrated significant degradation in commercial n-type SHJ
    cells under light soaking. This degradation is as high as 1% absolute, which could
    have a significant impact on the power yield from this technology... It has long
    been assumed that these cells are very stable under light, because they do not
    contain the same boron-oxygen defects that cause degradation in commercial p-type
    cells.
  confidence_note: issue_severity rated major because 1% absolute efficiency degradation
    is material at commercial scale and the finding overturns a widely held industry
    assumption; secondary_failure_mode design assumption failure captures the incorrect
    prior assumption of SHJ stability.
