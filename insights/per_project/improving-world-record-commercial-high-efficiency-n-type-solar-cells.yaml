- record_id: ARENA-DLV-18503
  source_title: Improving World-Record Commercial High-Efficiency N-Type Solar Cells
    Project Results & Lessons Learnt
  publish_date: 2021-03
  project_name: Improving World-Record Commercial High-Efficiency n-type Solar Cells
    through Recombination Analysis & Innovative Passivation
  what_happened: Surface passivation in n-type TOPCon solar cells was found to deteriorate
    significantly under light soaking at elevated temperatures, with the degree of
    deterioration dependent on the firing temperature used to form metal contacts.
    This degradation mechanism was previously unidentified and has implications for
    commercial TOPCon deployments.
  lesson_learnt: Projects deploying or evaluating TOPCon solar cells should treat
    surface passivation stability as a critical risk — firing temperature selection
    directly affects light-soaking degradation, and further characterisation of silicon-passivation
    interfaces and mitigation strategies should be completed before committing to
    large-scale deployment.
  issue_severity: major
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: Special isolation samples were fabricated by a project partner
    and subjected to a variety of firing treatments replicating industrial metal contact
    formation processes, enabling the degradation dependency on firing temperature
    to be characterised.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id003
  - 11
  - 12
  evidence_excerpt: Under light soaking at elevated temperature, the surface passivation
    deteriorated significantly, and this deterioration depended on the temperature
    of the firing process... as commercial solar cells become higher in efficiency,
    they become more and more sensitive to changes at the surface.
  confidence_note: Both SHJ (record 18502) and TOPCon (this record) degradation findings
    are extracted as separate records because they involve distinct cell architectures,
    distinct mechanisms, and are presented as separate lessons-learnt reports in the
    source document.
