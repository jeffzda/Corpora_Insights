- record_id: ARENA-DLV-18501
  source_title: Improving World-Record Commercial High-Efficiency N-Type Solar Cells
    Project Results & Lessons Learnt
  publish_date: 2021-03
  project_name: Improving World-Record Commercial High-Efficiency n-type Solar Cells
    through Recombination Analysis & Innovative Passivation
  what_happened: Hydrogen charge state control (HCSC) techniques developed in laboratory
    settings were successfully transferred to an industrial tool using substrate heating
    and laser illumination, achieving a 0.3% absolute efficiency improvement in industrial
    n-PERT solar cells. However, the physical mechanism driving the improvement was
    not yet fully understood at the time of reporting.
  lesson_learnt: When developing laboratory-scale passivation techniques for n-type
    solar cells, plan explicitly for an industrial tool transfer phase — demonstrating
    the technique on industrially compatible toolsets (substrate heating and laser
    illumination) is a prerequisite before commercial adoption, and the transfer from
    lab to industrial tools is achievable but requires dedicated project scope.
