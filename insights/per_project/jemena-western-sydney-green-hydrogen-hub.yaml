- record_id: ARENA-DLV-69001
  source_title: ARENA Insights Forum Session Summaries and Key Points
  publish_date: 2022-11
  project_name: Jemena Western Sydney Green Hydrogen Hub
  what_happened: Jemena established a green hydrogen demonstration site at Horsley Park featuring a 500kW PEM electrolyser, underground hydrogen storage, fuel cell and micro-turbine generation, and gas
    injection panel blending hydrogen into the local gas distribution network at up to 2% by volume. The site was designed for simple expansion to 1MW electrolyser capacity.
  lesson_learnt: Design hydrogen demonstration sites for modular expansion from the outset — containerised systems with spare capacity and infrastructure pre-designed for scale-up avoid costly retrofits
    when moving to higher electrolyser capacity.
