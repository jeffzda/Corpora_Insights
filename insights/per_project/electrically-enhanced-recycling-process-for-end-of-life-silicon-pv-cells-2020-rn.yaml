  project_name: Electrically-Enhanced Recycling Process for End of Life Silicon PV-Cells
    (2020 RND011)
  what_happened: The Swinburne University electrically-enhanced PV recycling project
    ($404,000) was not completed by the time of the program review and required an
    extension to 30 April 2024, beyond its original two-year term.
  lesson_learnt: High-temperature electrochemical recycling experiments at lab-to-pilot
    scale transition require more schedule margin than standard two-year R&D windows;
    budget and timeline planning should reflect the time needed to design, build and
    commission pilot-scale furnaces and electrochemical cells.
