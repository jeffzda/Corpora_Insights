- record_id: ARENA-DLV-15815
  source_title: Evaluation of ARENA's Impact and Effectiveness
  publish_date: 2019-11
  project_name: ARENA Large-Scale Solar (LSS) Competitive Round — EPC cost reduction
  what_happened: EPC costs for large-scale solar decreased 43 per cent over the period 2013 to 2018, driven by decreases in both module costs and balance-of-system costs. Critically, while global utility-scale
    solar PV costs were declining, the magnitude of cost reduction in Australia was greater than in other countries, implying country-specific factors contributed.
  lesson_learnt: Coordinated competitive deployment programs with systematic knowledge sharing can accelerate domestic cost learning curves beyond global trends — Australian EPC cost reductions from 2013–2018
    outpaced international averages, suggesting the LSS round's structured competition and shared learnings generated additional country-level learning effects.
