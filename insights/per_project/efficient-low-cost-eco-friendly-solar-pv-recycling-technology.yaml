- record_id: ARENA-DLV-16104
  source_title: Efficient, Low-Cost, Eco-Friendly Solar PV Recycling Technology Interim
    Dissemination Report
  publish_date: 2023-03
  project_name: End-of-Life, highly efficient, low-cost and eco-friendly recycling
    technology for silicon photovoltaic panels
  what_happened: The leaching process optimisation study found that temperature and
    particle size are the dominant parameters controlling metal recovery efficiency
    from post-delamination PV material, a finding not previously established for this
    application and which needed to be determined empirically and validated through
    coupled experimental-numerical methods before reactor scale-up could proceed.
  lesson_learnt: For chemical leaching stages in PV or WEEE recycling process development,
    prioritise experimental characterisation of temperature and particle size sensitivities
    early — these parameters dominate leaching efficiency and must be quantified before
    attempting reactor scale-up, as assuming standard leaching kinetics from other
    applications will lead to under-optimised designs.
  issue_severity: minor
  project_type: manufacturing/supply chain
  project_scale_band: pilot
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Built a lab-scale leaching prototype and developed a coupled
    rCFD-DEM leaching kinetics model validated against experimental data to identify
    optimal temperature and particle size parameters before scale-up.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id004
  - 5
  evidence_excerpt: The study found that optimising the temperature and particle size
    can significantly improve the leaching efficiency of solar panels. The optimised
    process can help in the recovery of valuable metals such as Ag and minimize environmental
    impact.
  confidence_note: issue_severity minor — this is a knowledge gap discovered and resolved
    within the R&D programme rather than a failure causing material schedule or cost
    impact.
