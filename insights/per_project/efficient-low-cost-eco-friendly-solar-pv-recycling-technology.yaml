- record_id: ARENA-DLV-16101
  source_title: Efficient, Low-Cost, Eco-Friendly Solar PV Recycling Technology Interim
    Dissemination Report
  publish_date: 2023-03
  project_name: End-of-Life, highly efficient, low-cost and eco-friendly recycling
    technology for silicon photovoltaic panels
  what_happened: In developing a novel PV recycling system, the project found that
    the design space for reactor geometry, type, throughput, input rate, and temperature
    was too large to evaluate through physical prototype construction alone — building
    large-scale prototypes for each candidate design was deemed infeasible.
  lesson_learnt: For new recycling technology development where reactor design space
    is large and poorly constrained, use low-cost numerical simulations first to screen
    and select optimal designs before committing to physical prototype construction
    — this reduces cost and accelerates scale-up from lab to pilot to industrial scale.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: pilot
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Adopted a simulation-first strategy using rCFD-DEM numerical
    models to identify optimal reactor designs before physical prototyping, allowing
    cost-effective scale-up from lab to pilot scale.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id001
  - 3
  evidence_excerpt: PV recycling is a newly emerging area and suitable reactor designs
    and operational strategy design are not yet available. Thus, the possible reactor
    designs in terms of e.g., geometry and type, and operation designs in terms of
    throughput, input rate and temperatures are massive. Constructing such large-scale
    prototypes to evaluate these designs is unfeasible.
  confidence_note: issue_severity set to moderate as the design space problem constrained
    the project approach but did not cause a failure — the team adapted early via
    simulation-first strategy.
