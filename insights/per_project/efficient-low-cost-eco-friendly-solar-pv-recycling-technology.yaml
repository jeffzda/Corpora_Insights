- record_id: ARENA-DLV-16103
  source_title: Efficient, Low-Cost, Eco-Friendly Solar PV Recycling Technology Interim
    Dissemination Report
  publish_date: 2023-03
  project_name: End-of-Life, highly efficient, low-cost and eco-friendly recycling
    technology for silicon photovoltaic panels
  what_happened: The conventional physical sieving process was found to be incapable
    of effectively separating glass and solar cell materials from the debris mixture
    produced after pyrolysis delamination, creating a bottleneck in the recycling
    chain that directly affects energy costs and reagent consumption in the downstream
    chemical leaching stage.
  lesson_learnt: When designing PV recycling process chains, do not assume conventional
    sieving technology will adequately separate post-pyrolysis debris — the conventional
    process fails at this step; optimise sieving aids and machine conditions specifically
    for PV debris mixtures, as separation quality at this stage directly determines
    acid consumption and waste management burden in the downstream leaching process.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: pilot
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Developed an optimised sieving technique incorporating specific
    sieving aids and adjusted machine conditions to effectively separate solar cell
    and glass materials from pyrolysis debris; filed Australian Patent AU2002903639
    for the resulting method and apparatus.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id003
  - 6
  evidence_excerpt: the conventional physical sieving process couldn't effectively
    separate glass and solar cell materials from the mixture, and adding the optimal
    sieving aids and adjusting the sieving machine conditions could achieve the objective
    that effectively separating the materials from the debris mixture resulting from
    the pyrolysis process.
  confidence_note: transferability set to moderate — the finding is specific to PV
    recycling but the principle of validating separation technology for novel waste
    streams applies to other WEEE recycling process development projects.
