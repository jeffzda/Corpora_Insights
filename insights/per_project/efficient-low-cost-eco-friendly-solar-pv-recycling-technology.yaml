- record_id: ARENA-DLV-16102
  source_title: Efficient, Low-Cost, Eco-Friendly Solar PV Recycling Technology Interim
    Dissemination Report
  publish_date: 2023-03
  project_name: End-of-Life, highly efficient, low-cost and eco-friendly recycling
    technology for silicon photovoltaic panels
  what_happened: During development of the thermal delamination (pyrolysis) stage,
    standard modelling approaches were found to be inadequate for representing chip-like
    PV particles in fluidised and fixed bed reactors, requiring development of a novel
    superquadric particle model integrated into the rCFD-DEM framework — a capability
    not previously available for this application.
  lesson_learnt: When developing recycling processes for non-spherical or irregular
    waste materials (such as chip-like PV fragments), standard computational fluid
    dynamics models will misrepresent particle behaviour; invest in adapting particle
    geometry representations before attempting reactor optimisation, as inaccurate
    models will propagate errors into reactor design and operating conditions.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: pilot
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Developed a novel super-quadric model coupled with rCFD-DEM to
    accurately represent chip-like PV particle movement, enabling valid simulation
    of pyrolysis reactor behaviour and supporting optimised prototype design.
  transferability: narrow
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id002
  - 4
  evidence_excerpt: This is the first time to incorporate the chip-like particle into
    the reacting flow system, which aims to more accurately describe the PV particle
    movement in the fluidised bed and fixed bed reactors.
  confidence_note: transferability set to narrow — the chip-like particle geometry
    challenge is specific to PV recycling and similar WEEE fragmentation contexts.
