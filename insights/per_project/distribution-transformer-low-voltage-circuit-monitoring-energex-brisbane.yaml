- record_id: ARENA-DLV-72240
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: '2014'
  project_name: Distribution Transformer Low Voltage Circuit Monitoring - Energex
    Brisbane
  what_happened: Energex's low voltage circuit monitoring project, deploying advanced
    metering across 3,700 residential customers in Brisbane, produced initial evidence
    that circuit cables exceeded their ratings and were unbalanced, and that fusing
    was not in accordance with cable ratings — conditions that were previously invisible
    without feeder-level monitoring.
  lesson_learnt: Distribution networks with high PV penetration should deploy feeder-level
    monitoring rather than only transformer-level measurement — initial Energex data
    revealed unknown cable overloading and fuse-rating mismatches that create risk
    under increased embedded generation, conditions that aggregate metering alone
    cannot detect.
