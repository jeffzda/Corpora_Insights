- record_id: ARENA-DLV-52528
  source_title: ARENA's Virtual Power Plant Knowledge Sharing Workshop Summary
  publish_date: 2019-03
  project_name: Reposit Power VPP Analysis
  what_happened: Reposit Power data showed that VPP customers were motivated by more
    than financial return — a customer quoted in the presentation described that the
    VPP gave them 'a little nice feeling' of having contributed to the Victorian power
    system during a stress event, not just bill savings.
  lesson_learnt: Communicate the non-financial community and environmental value of
    VPP participation explicitly — social contribution and the sense of helping the
    grid through a crisis are genuine motivators that, if surfaced in customer communications,
    can support enrolment and ongoing engagement beyond what financial incentives
    alone can achieve.
