- record_id: ARENA-DLV-52529
  source_title: ARENA's Virtual Power Plant Knowledge Sharing Workshop Summary
  publish_date: 2019-03
  project_name: Reposit Power VPP Analysis
  what_happened: The customer journey for VPP enrolment was found to be a continuous
    process spanning sales and installation, retail plan selection, and smart control
    setup, with customers prone to dropout at any weak link in the chain, and trust
    needing to be built consistently throughout the process with a single coherent
    message and service standard.
  lesson_learnt: Map and strengthen every stage of the VPP customer journey — the
    journey is only as strong as its weakest link; a dropout at sales, installation,
    retail plan, or smart control setup eliminates the customer from participation,
    so all stages need consistent messaging, service quality, and support.
  issue_severity: moderate
