- record_id: ARENA-DLV-52525
  source_title: ARENA's Virtual Power Plant Knowledge Sharing Workshop Summary
  publish_date: 2019-03
  project_name: Reposit Power VPP Analysis
  what_happened: During the Victoria load shedding event in January 2019, non-VPP
    (unorchestrated) batteries created an average of 0.6 kW of extra load per system
    during load shedding as they continued to charge. With an estimated 3,000 non-VPP
    batteries in Victoria, this equated to approximately 1.8 MW of additional load,
    estimated to have caused blackouts for an extra ~350 houses.
  lesson_learnt: Unorchestrated residential batteries present a material grid security
    risk during system stress events — energy program designers and policy makers
    should mandate or strongly incentivise VPP enrolment or minimum smart controls
    for subsidised batteries to prevent them exacerbating peak demand events.
  issue_severity: major
