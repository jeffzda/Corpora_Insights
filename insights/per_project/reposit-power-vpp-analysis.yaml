- record_id: ARENA-DLV-52526
  source_title: ARENA's Virtual Power Plant Knowledge Sharing Workshop Summary
  publish_date: 2019-03
  project_name: Reposit Power VPP Analysis
  what_happened: Reposit Power analysis identified that retrofitting existing devices
    into VPPs increased complexity (multiple installers involved), reduced the window
    of customer motivation (which was highest at initial install), and increased cost
    due to installation overhead compared to all-in-one installations.
  lesson_learnt: Design VPP enrolment processes to capture customers at the point
    of initial solar/battery installation — retrofitting VPP capability onto existing
    systems is more complex, more costly, and occurs when customer motivation has
    already passed its peak; all-in-one installation is the preferred pathway.
