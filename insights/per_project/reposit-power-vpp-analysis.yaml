- record_id: ARENA-DLV-52527
  source_title: ARENA's Virtual Power Plant Knowledge Sharing Workshop Summary
  publish_date: 2019-03
  project_name: Reposit Power VPP Analysis
  what_happened: Reposit Power identified a significant gap between devices being
    technically capable of VPP participation and actually being enrolled in a VPP,
    describing it as 'a large chasm to cross', and noted that customer trust and perception
    of a program — including whether it felt like 'giving my energy' versus 'taking
    my energy' — were more influential on participation rates than increasing financial
    incentives.
  lesson_learnt: Increasing financial value alone will not overcome poor trust or
    negative perception in VPP recruitment — frame VPP participation in terms of customer
    empowerment and contribution rather than extraction, and use demonstrated capability
    (as AEMO does) to build confidence before seeking enrolment.
  issue_severity: moderate
