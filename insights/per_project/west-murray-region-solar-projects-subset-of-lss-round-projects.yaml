  evidence_excerpt: There were some significant curtailment events in certain regions
    of the grid where a number of solar projects are located, including a period spanning
    2019 to early 2020 when solar farms in the West Murray Regions were constrained
    by 50 per cent to avoid the risk of uncontrollable voltage oscillations. This
    curtailment was ultimately resolved by an inverter tuning solution.
