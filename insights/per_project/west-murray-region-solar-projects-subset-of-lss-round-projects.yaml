- record_id: ARENA-DLV-15459
  source_title: 'The Generator Operations Series: Large-Scale Solar Operations'
  publish_date: 2021-05
  project_name: West Murray Region solar projects (subset of LSS Round Projects)
  what_happened: Solar farms in the West Murray region were constrained by 50 per
    cent during a period spanning 2019 to early 2020 to avoid the risk of uncontrollable
    voltage oscillations, causing significant curtailment losses. The constraint was
    ultimately resolved through an inverter tuning solution.
  lesson_learnt: System strength and voltage stability risks in regions with high
    concentrations of inverter-based generation can result in severe prolonged curtailment
    — project developers in such regions should proactively engage with AEMO and TNSPs
    on system strength conditions and plan for potential curtailment periods of 12
    months or more while network-level solutions are developed.
