- record_id: ARENA-DLV-31156
  source_title: Zenobē - EV Delivery Truck Charging Facility - Lessons Learnt Report
    1
  publish_date: 2025-01
  project_name: Zenobē EV Delivery Truck Charging Facility
  what_happened: The DA requirement and associated easement restrictions forced a
    redesign of the site infrastructure and charging layout before construction could
    begin, meaning the final design could not be locked in until DA approval was granted
    by both council and Ausgrid as landowner. Contracts with the civil and electrical
    contractor were prepared but held in executable form pending DA approval.
  lesson_learnt: No site design should be treated as final until all DA approvals
    are received; contracts and procurement processes must include flexibility clauses
    to accommodate design changes arising from the approvals process, rather than
    being executed against a pre-approval design.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: first commercial/FOAK
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: poor scoping
  intervention_note: Contracts were held in executable form rather than executed,
    preserving flexibility until DA approval was received.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: EV
  source_pages: &id004
  - 6
  - 8
  evidence_excerpt: The implication associated with development applications, means
    that no design is final until this has been approved by council (and in this case
    the land owner Ausgrid), therefore flexibility in contractual requirements / procurement
    processes will need to be factored in as a form of contingency.
