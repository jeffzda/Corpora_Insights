- record_id: ARENA-DLV-31155
  source_title: Zenobē - EV Delivery Truck Charging Facility - Lessons Learnt Report
    1
  publish_date: 2025-01
  project_name: Zenobē EV Delivery Truck Charging Facility
  what_happened: Ausgrid requested design changes to the grid connection trench routing
    — from the roadway to the footpath — to avoid the 132 kV underground cable zone
    on the Ausgrid-owned site. This triggered additional design reviews and approval
    cycles with the DNSP before the connection design could be finalised.
  lesson_learnt: When connecting to the grid on land that contains underground HV
    cabling (particularly DNSP-owned sites), anticipate additional design reviews
    and approval iterations as the network operator will impose constraints to protect
    existing infrastructure.
