- record_id: ARENA-DLV-31151
  source_title: Zenobē - EV Delivery Truck Charging Facility - Lessons Learnt Report
    1
  publish_date: 2025-01
  project_name: Zenobē EV Delivery Truck Charging Facility
  what_happened: A development application (DA) was required for the offsite EV truck
    charging hub, which had been overlooked at project commencement due to conflicting
    advice from planning consultants and ambiguity around whether an exemption applied.
    The DA requirement delayed construction and brought forward site surveys and certifications
    that were originally planned for the construction phase.
  lesson_learnt: Before finalising project scope and timeline, obtain a formal letter
    from council confirming whether a development approval is required — conflicting
    informal advice led to a DA being overlooked entirely, delaying construction and
    increasing costs.
  issue_severity: major
  project_type: transport electrification
  project_scale_band: first commercial/FOAK
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: poor scoping
  intervention_note: Zenobē committed to seeking a formal letter of recommendation
    from council on DA requirements for all future design and construction works to
    avoid recurrence.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: EV
  source_pages:
  - 3
  - 5
  - 8
  evidence_excerpt: Given the nascent stage of truck electrification, 'truck depots'
    is not included in the definition of exempt development, however we see in the
    future, through policy advocacy, that this barrier to truck electrification has
    the potential to be removed and sit alongside other similar activities which are
    also exempt.
  confidence_note: delay_magnitude not quantified — construction had not commenced
    at time of report so total delay duration is not stated. Canonical record merged
    from 2 source records across 1 document(s).
