- record_id: ARENA-DLV-31153
  source_title: Zenobē - EV Delivery Truck Charging Facility - Lessons Learnt Report
    1
  publish_date: 2025-01
  project_name: Zenobē EV Delivery Truck Charging Facility
  what_happened: No suitable land with the required tenure was available near Woolworths'
    distribution centre in Mascot; most local land was zoned for housing. Two off-market
    sites were identified but constrained — one had a building requiring demolition,
    and the other (an Ausgrid-owned site with underground HV infrastructure) did not
    permit permanent underground works. Zenobē selected the Ausgrid site based on
    more favourable tenure terms despite the infrastructure restrictions.
  lesson_learnt: In densely populated metropolitan areas, leasing land — including
    sites owned by network utilities — is a viable strategy for EV charging infrastructure;
    however, tenure constraints and underground infrastructure restrictions must be
    assessed thoroughly before site selection as they directly limit design options.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: project developer
  delay_category: stakeholder/land/community
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Zenobē engaged a tenant representative to canvas both on- and
    off-market sites and ultimately leased the Ausgrid site, accepting tenure restrictions
    in exchange for favourable lease terms.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: EV
  source_pages: &id001
  - 5
  evidence_excerpt: Working with a tenant representative to assess all land availability
    on or off the market. We identified two off-market sites that were viable, however,
    were restricted by tenure. One location had an existing building that required
    demolishing, and the second site didn't permit underground works / permanent changes
    due to it being an Ausgrid owned site with underground HV infrastructure.
  confidence_note: null
