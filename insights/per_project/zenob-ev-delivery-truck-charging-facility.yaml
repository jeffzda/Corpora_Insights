- record_id: ARENA-DLV-31157
  source_title: Zenobē - EV Delivery Truck Charging Facility - Lessons Learnt Report
    1
  publish_date: 2025-01
  project_name: Zenobē EV Delivery Truck Charging Facility
  what_happened: While construction was stalled awaiting DA approval, Zenobē ordered
    a mobile ZEROVA charger and used it to conduct early integration testing between
    the Foton truck and Zenobē's smart charging software. This enabled integration
    work to proceed in parallel with the approvals process, partially offsetting the
    project delay.
  lesson_learnt: When construction is blocked by approvals delays, identify integration
    or commissioning activities that can be decoupled and completed in parallel —
    early truck-charger integration using a mobile charger allowed Zenobē to reduce
    total project delay and de-risk the commissioning phase.
