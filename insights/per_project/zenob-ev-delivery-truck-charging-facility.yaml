- record_id: ARENA-DLV-31154
  source_title: Zenobē - EV Delivery Truck Charging Facility - Lessons Learnt Report
    1
  publish_date: 2025-01
  project_name: Zenobē EV Delivery Truck Charging Facility
  what_happened: A future proposed cycle pathway easement at the rear of the selected
    site was not identified by planners until council engagement during the DA process.
    The easement reduced usable site area by approximately 180 m², resulting in loss
    of parking for two trucks overnight and requiring a redesign of the charging layout.
  lesson_learnt: Conduct thorough easement searches and engage with council early
    in the design phase — an undetected easement at this site caused a 180 m² reduction
    in usable area, forced a charging layout redesign, and reduced overnight truck
    parking capacity.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: project developer
  delay_category: approvals/regulatory
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: The layout was redesigned to add a single-gun charger in place
    of a dual-gun unit and a last-in-first-out parking schedule was adopted; Woolworths'
    operations were not impacted.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: EV
  source_pages: &id002
  - 6
  evidence_excerpt: The easement at the back of the site, reduced how much of the
    land we could use... The restrictions have meant losing two trucks to park overnight,
    however, we have gained an additional charger that is not a dual gun and a last
    in first out parking schedule will now apply. This easement was not know to our
    planners until there was engagement with the council.
