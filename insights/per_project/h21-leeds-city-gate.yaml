- record_id: ARENA-DLV-37902
  source_title: Hydrogen Communities & H2City Tool
  publish_date: 2019-06
  project_name: H21 Leeds City Gate
  what_happened: The H21 Leeds City Gate project found that existing gas network pipelines
    in Leeds were already being replaced with hydrogen-suitable materials through
    a routine asset replacement program, significantly reducing the incremental cost
    of network conversion to hydrogen.
  lesson_learnt: Align hydrogen network conversion planning with existing pipeline
    asset replacement cycles — communities where networks are already being upgraded
    to hydrogen-compatible materials can achieve conversion at substantially lower
    incremental cost than greenfield conversions.
