- record_id: ARENA-DLV-37903
  source_title: Hydrogen Communities & H2City Tool
  publish_date: 2019-06
  project_name: H21 Leeds City Gate
  what_happened: The H21 Leeds City Gate project proposed funding conversion costs
    through an increase in regulated tariffs distributed across the entire Northern
    Gas Networks customer base, rather than concentrating costs on directly converted
    customers.
  lesson_learnt: For large-scale gas network hydrogen conversion, propose spreading
    conversion costs across the entire regulated customer base through tariff adjustments
    — concentrating costs on converted customers only creates a prohibitive per-customer
    cost barrier and can block project viability.
