- record_id: ARENA-DLV-37904
  source_title: Hydrogen Communities & H2City Tool
  publish_date: 2019-06
  project_name: H21 Leeds City Gate
  what_happened: The H21 Leeds City Gate project found that electrolysis powered by
    renewable electricity was considered technically difficult to achieve at the scale
    required for Leeds, due to the large land area and renewable electricity quantity
    needed, leading to selection of SMR with CCS as the production method.
  lesson_learnt: For large-scale urban hydrogen supply (multi-GWh annual demand),
    electrolysis from renewable electricity may not be feasible due to land and renewable
    energy resource constraints — assess land availability and renewable electricity
    volumes as binding constraints before selecting a production pathway.
  issue_severity: minor
  project_type: network/grid
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: development/design
  proponent_type: network business
  delay_category: null
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: SMR coupled with CCS was selected as the viable alternative production
    method.
  transferability: moderate
