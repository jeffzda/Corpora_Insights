- record_id: ARENA-DLV-37901
  source_title: Hydrogen Communities & H2City Tool
  publish_date: 2019-06
  project_name: H21 Leeds City Gate
  what_happened: In the H21 Leeds City Gate project, appliance conversion cost was
    estimated at up to 50% of total conversion cost when converting a gas distribution
    network to 100% hydrogen, making customer disruption a dominant delivery risk
    and success factor.
  lesson_learnt: For 100% hydrogen gas network conversion projects, appliance conversion
    can represent up to half of total project cost — minimising customer disruption
    through phased or upgrade-based approaches (rather than full replacement) is a
    critical success criterion and should be designed in from the outset.
  issue_severity: moderate
  project_type: network/grid
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: development/design
  proponent_type: network business
  delay_category: null
  failure_mode: poor scoping
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The project found that Leeds gas pipelines were already being
    replaced with hydrogen-suitable materials through the existing asset replacement
    program, minimising incremental conversion cost.
  transferability: moderate
  delay_magnitude: null
  technology_domain: hydrogen
  source_pages: &id001
  - 18
  evidence_excerpt: Appliance conversion cost is estimated to be up to 50% of the
    total conversion cost when converting a gas distribution network to 100% hydrogen.
    Converting home appliances will be a significant disruption to customers and therefore
    an important success criteria is to minimise the disruption to the end customer
    where practical.
