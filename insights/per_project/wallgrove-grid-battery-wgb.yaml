- record_id: ARENA-DLV-70813
  source_title: Grid Forming Battery Webinar 23 July 2025
  publish_date: 2025-07
  project_name: Wallgrove Grid Battery (WGB)
  what_happened: Analysis from the Wallgrove BESS Flagship Report found that the battery
    can provide FFR and inertia services to at least nameplate capacity approximately
    three-quarters of the time, confirming that commercial market operations (arbitrage
    and FCAS) do not materially inhibit provision of contracted network services.
  lesson_learnt: Market operations and contracted GFM network services (FFR and inertia)
    are largely complementary for a well-configured BESS — project business cases
    can model revenue stacking of both revenue streams without significant discounting
    for operational conflict, provided operating protocols are appropriately configured.
