- record_id: ARENA-DLV-70812
  source_title: Grid Forming Battery Webinar 23 July 2025
  publish_date: 2025-07
  project_name: Wallgrove Grid Battery (WGB)
  what_happened: The Wallgrove Grid Battery's commercial structure involved 12 contracts
    across 4 counterparties, including TNSP ownership with an Iberdrola contract for
    operations and trading, and a portion of storage capacity reserved for inertia
    and fast frequency response (FFR). This was significantly more complex than a
    typical merchant BESS contract.
  lesson_learnt: GFM BESS projects with TNSP ownership and contracted network services
    will require substantially more contractual instruments than merchant projects
    — project developers and TNSPs should scope multi-party contracting requirements
    early, including the interaction between storage capacity reserved for network
    services and capacity available for market participation.
