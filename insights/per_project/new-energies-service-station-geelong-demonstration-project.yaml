  project_name: New Energies Service Station Project
  what_happened: The project's 350bar hydrogen dispensers and nozzles were shipped
    separately as an unplanned change; the nozzles originated from China but were
    transhipped through Korea, meaning neither the China–Australia nor Korea–Australia
    FTA could be applied because the bill of lading showed Korea as country of import
    rather than country of origin.
  lesson_learnt: Monitor vendor logistics throughout the shipment process — components
    moved to different warehouses or transhipped through third countries can break
    FTA country-of-origin requirements; project teams should work continuously with
    vendors to track component origins and be prepared to fall back on Tariff Concession
    Orders if FTA eligibility is lost.
