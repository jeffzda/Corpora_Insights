  source_title: Viva New Energies Service Station Geelong Demonstration Project -
    Market and Technology Report 1
  publish_date: 2024-04
  project_name: New Energies Service Station Project
  what_happened: The project identified that hydrogen fuelling presents novel user
    experience challenges compared to diesel — dispensing nozzles frost up during
    filling, are heavier and more expensive to replace than liquid fuel nozzles, and
    must be compatible with vehicle receptacles — requiring deliberate design of driver
    guidance systems.
  lesson_learnt: Design hydrogen refuelling stations with explicit driver guidance
    infrastructure (clear signage, pressure-differentiated bay demarcation, safe handling
    instructions at each dispenser, training videos) to mitigate safety risks and
    user error arising from the fundamental differences between gaseous hydrogen and
    liquid fuel dispensing.
