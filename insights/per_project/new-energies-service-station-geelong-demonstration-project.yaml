  what_happened: At the time of vendor selection for the electrolyser, the number
    of vendors willing and able to deliver an Australian-compliant electrolyser at
    the required scale (2.0MW) was limited, and some vendors withdrew during the tender
    process, resulting in a change to a 2.5MW system and associated cost increases
    for cell stacks, power supply, and cooling.
  lesson_learnt: The Australian market for large-scale, standards-compliant electrolysers
    is thin — project teams should begin vendor engagement early, anticipate that
    competitive tension may be limited, and build scope and cost flexibility to accommodate
    changes in electrolyser specifications if preferred vendors withdraw during tender.
