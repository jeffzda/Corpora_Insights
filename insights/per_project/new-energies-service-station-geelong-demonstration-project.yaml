- record_id: ARENA-DLV-28905
  source_title: Viva - New Energies Service Station Geelong Demonstration Project
    - Lessons Learned Report 1
  publish_date: 2023-12
  project_name: New Energies Service Station Project
  what_happened: The project was required to consult with WorkSafe Victoria and Fire
    Rescue Victoria as regulatory bodies outside the planning framework because on-site
    hydrogen storage exceeded 5,000L — triggering notification obligations under the
    Dangerous Goods Regulations — even though the project was below the Major Hazard
    Facility threshold.
  lesson_learnt: Hydrogen projects storing more than 5,000L of gas on-site must engage
    WorkSafe Victoria and Fire Rescue Victoria as regulatory bodies under the Dangerous
    Goods Regulations, separate from and in addition to the planning approvals process
    — this dual-track regulatory engagement should be identified and scoped at project
    inception.
  issue_severity: minor
  project_type: enabling infrastructure
  project_scale_band: first commercial/FOAK
  lifecycle_phase: approvals/contracting
  proponent_type: utility/energy retailer
  delay_category: approvals/regulatory
  failure_mode: no major failure stated
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: Viva Energy identified and engaged WorkSafe Victoria and Fire
    Rescue Victoria early by mapping regulatory obligations outside the planning framework
    during the first phase of project development.
  transferability: moderate
  delay_magnitude: null
  technology_domain: hydrogen
  source_pages: &id004
  - 13
  evidence_excerpt: Given that more than 5,000L of hydrogen gas would be stored on
    site (i.e., in excess of the relevant 'Manifest Volume'), WorkSafe Victoria would
    be required to be notified under Regulation 64 of the Dangerous Goods (DG) Regulations
    and the Project would be subject to the DG Regulations.
