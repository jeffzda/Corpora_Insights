  outcome_class: delayed but recoverable
  secondary_failure_mode: poor scoping
  intervention_note: The project team gathered electrical connection point information
    from equipment suppliers and provided it to the state electrical authority to
    establish which standard should apply to the containerised equipment.
  transferability: broad
  delay_magnitude: not quantified
