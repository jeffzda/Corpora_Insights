  proponent_type: utility/energy retailer
  delay_category: procurement/supply chain
  failure_mode: execution & logistics
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: To avoid port storage and demurrage charges within the three-day
    clearance window, the oversized compressor package was split into smaller loads
    for multiple trips at higher-than-planned transport cost.
  transferability: moderate
  delay_magnitude: <1 month
  technology_domain: hydrogen
  source_pages: &id043
