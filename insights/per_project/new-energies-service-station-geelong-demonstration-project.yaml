  what_happened: The project was originally designed around 350 bar dispensing for
    a specific fleet of back-to-base vehicles, but during the project multiple vehicle
    OEMs announced commitments to 700 bar gaseous heavy FCEVs, requiring a scope variation
    to include 700 bar refuelling capability and adding cost to the project.
  lesson_learnt: Hydrogen refuelling infrastructure designed around a specific pressure
    standard (350 bar) risks being stranded as the vehicle OEM market evolves rapidly
    — design for future-proofing from the outset by reserving footprint and infrastructure
    provisions for 700 bar capability, even if the immediate fleet requirement is
    350 bar.
