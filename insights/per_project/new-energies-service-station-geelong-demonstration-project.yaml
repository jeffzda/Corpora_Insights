  source_title: Viva New Energies Service Station Geelong Demonstration Project -
    Lessons Learned Report 2
  publish_date: 2024-09
  project_name: New Energies Service Station Project
  what_happened: Almost all critical equipment for the hydrogen service station (dispensers,
    compressors, storage vessels, electrolyser) had to be imported from overseas vendors,
    exposing the project to import duties, tariff classification complexity, and schedule
    risk due to the immaturity of Australian hydrogen equipment supply chains.
  lesson_learnt: Hydrogen project teams should build in-house or third-party import
    expertise from the outset — import duties can add up to 5% to equipment costs
    worth millions of dollars, and the ~200 pieces of associated legislation make
    mis-steps costly in both budget and schedule terms.
