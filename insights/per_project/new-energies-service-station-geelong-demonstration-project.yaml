  publish_date: 2024-04
  project_name: New Energies Service Station Project
  what_happened: Renewable electricity cost was identified as the dominant OPEX component
    (~60% of LCOH), with electricity cost alone being the largest single contributor;
    the project identified that low-cost electricity access and smart dispatch (avoiding
    peak pricing windows) will be the primary lever for reducing hydrogen production
    cost.
  lesson_learnt: Prioritise securing low-cost renewable electricity contracts and
    design electrolyser dispatch to favour off-peak periods (daytime solar/wind abundance,
    outside morning/evening peaks) to reduce LCOH — electricity is the dominant cost
    driver and dispatch flexibility directly determines hydrogen production economics.
