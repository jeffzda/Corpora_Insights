  what_happened: Obtaining preferential customs duty rates under Free Trade Agreements
    required securing Certificates of Origin and Declarations of Origin from overseas
    vendors in Korea and the USA, which demanded significant in-house and third-party
    effort to validate correct HS tariff classifications before shipment.
  lesson_learnt: Request all relevant vendor documents including HS export codes and
    their justifications well in advance of shipment — this allows the buyer to validate
    import classifications ahead of time and streamline the tariff classification
    process, avoiding penalties for incorrect declarations.
