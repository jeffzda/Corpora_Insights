  publish_date: 2023-12
  project_name: New Energies Service Station Project
  what_happened: The hydrogen equipment (electrolyser, storage vessels, dispensers)
    was procured entirely from overseas vendors as no viable Australian options existed.
    Overseas vendors were unfamiliar with Australian Wiring Rules (AS/NZS 3000), and
    significant time and effort was required during detailed design to investigate
    electrical compliance, which affected sub-component selection, production schedules,
    and site layout.
  lesson_learnt: Conduct a gap analysis against Australian Wiring Rules (AS/NZS 3000)
    at the very start of detailed design when procuring overseas hydrogen equipment
    — failure to identify Wiring Rules compliance gaps early can impact component
    selection, production schedules, and site layout, and regulators will not allow
    electrical energisation of non-compliant installations.
