  what_happened: GST at 10% applied to all imported equipment, adding materially to
    the overall capital cost of the hydrogen project; overseas vendors were potentially
    unfamiliar with Australian GST obligations, risking the impost being passed to
    the buyer without recourse to input tax credits.
  lesson_learnt: Ensure the importing entity has an Australian Business Number (ABN)
    and is registered for GST before equipment arrives — this is required to claim
    input tax credits or access the GST deferral scheme; using an Australian-based
    company as the importer of record can prevent overseas vendors from passing unrecoverable
    GST costs to the buyer.
