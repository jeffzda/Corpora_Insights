- record_id: ARENA-DLV-28917
  source_title: Viva - New Energies Service Station Geelong Demonstration Project
    - Lessons Learned Report 1
  publish_date: 2023-12
  project_name: New Energies Service Station Project
  what_happened: Industry stakeholders, including vehicle OEMs, interpreted AS ISO
    14687 (the hydrogen fuel quality standard specifying 99.97% purity) as requiring
    'five nines' purity (99.999%), creating confusion for Viva Energy about the correct
    specification to design to and raising questions about testing capability and
    feasibility of supply.
  lesson_learnt: The hydrogen fuel quality standard AS ISO 14687 is not uniformly
    understood across industry — before finalising the hydrogen quality specification
    for a refuelling station, confirm the required purity level directly with each
    relevant vehicle OEM, as misinterpretation of the standard could invalidate warranties
    or create commercial disputes with transport operators.
  issue_severity: moderate
  project_type: enabling infrastructure
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: coordination & stakeholders
  intervention_note: Viva Energy sought direct clarification from vehicle OEMs and
    pragmatically confirmed that AS ISO 14687 (99.97%) was acceptable, resolving the
    specification ambiguity before finalising the design.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages: &id012
  - 31
  evidence_excerpt: Interestingly a key observation was noted in that although AS
    ISO 14687 states a hydrogen purity of 99.97%, 'five 9's' was often referenced,
    which points to a purity of 99.999%. The interpretation of AS ISO 14687 as 99.999%
    purity was unexpected and presented some questions internally within the Viva
    Energy team.
