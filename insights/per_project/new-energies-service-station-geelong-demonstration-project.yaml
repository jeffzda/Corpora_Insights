- record_id: ARENA-DLV-28910
  source_title: Viva - New Energies Service Station Geelong Demonstration Project
    - Lessons Learned Report 1
  publish_date: 2023-12
  project_name: New Energies Service Station Project
  what_happened: Overseas hydrogen equipment was certified to ATEX (European) hazardous
    area standards rather than IECEx, which is the standard accepted in Australia.
    ATEX certification is not accepted in Australia without an additional conformity
    assessment by a competent assessor, adding cost and time to the compliance process.
  lesson_learnt: Specify IECEx certification (not ATEX) as a mandatory procurement
    requirement when sourcing overseas hazardous area electrical equipment for Australian
    hydrogen projects — ATEX is not accepted in Australia without an additional conformity
    assessment, which adds cost, time, and supply chain complexity.
  issue_severity: moderate
  project_type: enabling infrastructure
  project_scale_band: first commercial/FOAK
  lifecycle_phase: procurement
  proponent_type: utility/energy retailer
  delay_category: procurement/supply chain
  failure_mode: poor scoping
  outcome_class: delayed but recoverable
  secondary_failure_mode: regulatory & approvals
  intervention_note: The project undertook an additional conformity assessment to
    bridge ATEX-certified equipment to IECEx requirements for the Australian context.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages: &id007
  - 25
  evidence_excerpt: Australia accepts the use of hazardous area electrical equipment
    holding an International Electrotechnical Commission Explosive (IECEx) certificate
    as opposed to Atmosphere Explosible (ATEX) certification, the latter of which
    is not accepted without an additional conformity assessment by a competent assessor.
    This is another layer of cost and time to achieving equipment compliance.
