    - Lessons Learned Report 1
  publish_date: 2023-12
  project_name: New Energies Service Station Project
  what_happened: The project required early engagement with multiple regulatory authorities
    — including the City of Greater Geelong Council, EPA Victoria, WorkSafe Victoria,
    DTP, and Fire Rescue Victoria — before lodging the planning permit application.
    Viva Energy mapped out the full approvals pathway during the first six months
    of project development, identifying both determining and referral authorities
    in advance.
