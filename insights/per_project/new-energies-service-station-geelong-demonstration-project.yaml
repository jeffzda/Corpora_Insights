  publish_date: 2024-09
  project_name: New Energies Service Station Project
  what_happened: Chillers required for the project contained refrigerants comprising
    hydrochlorofluorocarbons or synthetic greenhouse gases, which are scheduled substances
    under the Ozone Protection and Synthetic Greenhouse Gas Management Act 1989; an
    Equipment Licence (EQPL) was required that overseas vendors were unaware of, meaning
    a local distributor had to import the equipment on the project's behalf.
  lesson_learnt: Before procuring equipment containing refrigerants or other scheduled
    substances, confirm whether an Equipment Licence (EQPL) is required under Australian
    law — overseas vendors are unlikely to be aware of this requirement, and failure
    to identify it early will require re-routing the import through a licensed local
    distributor, adding cost and potential schedule risk.
