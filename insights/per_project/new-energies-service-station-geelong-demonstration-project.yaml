  publish_date: 2024-04
  project_name: New Energies Service Station Project
  what_happened: Previous hydrogen projects in Australia (Toyota Ecopark, Jemena Power
    to Gas, ActewAGL HRS, Port Kembla HRS) revealed extended lead times for hydrogen
    generation and refuelling packages, Australian Standards compliance challenges
    for imported equipment, and customer refuelling constraints from limited storage
    and compression capacity.
  lesson_learnt: Define system requirements including vehicle refuelling patterns
    and hydrogen regeneration times early in engineering design, and tender main equipment
    packages before final investment decision to accommodate 18–24 month lead times
    and Australian Standards compliance gaps.
