  what_happened: The peaky nature of heavy vehicle refuelling demand — with buses,
    waste vehicles and prime movers refuelling 20–80kg per fill at shift start/end
    — drove significant investment in compression, storage and chilling infrastructure
    substantially larger than that required for light vehicles or controlled depot
    fleets.
  lesson_learnt: Size compression, storage and chilling infrastructure for peak refuelling
    demand profiles specific to heavy vehicle operations — scheduled shift-start/end
    refuelling creates concentrated demand peaks that require substantially larger
    storage and compression capacity than average utilisation figures suggest, and
    this is a major capital cost driver.
