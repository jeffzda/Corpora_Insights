  publish_date: 2023-12
  project_name: New Energies Service Station Project
  what_happened: The project's delivery timeline coincided with a period of high general
    inflation and elevated construction demand, resulting in 20–30% cost increases
    across construction, standard materials, and hydrogen-related materials over 24
    months. All hydrogen equipment had to be imported due to the absence of local
    manufacturing capability, creating lead times exceeding 18 months and extended
    foreign exchange exposure.
  lesson_learnt: For imported hydrogen equipment with lead times exceeding 18 months,
    project budgets must incorporate explicit foreign exchange hedging provisions
    and construction cost escalation allowances — failure to do so exposes the project
    to compounding cost increases that are difficult to absorb in fixed-budget grant-funded
    structures.
