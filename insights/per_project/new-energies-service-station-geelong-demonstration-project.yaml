  what_happened: Electrolyser vendor lead times ranged from 12–18 months for standard
    packages, with an additional 6 months required for Australian market compliance
    gap analysis, resulting in overall lead times of 18–24 months. Several vendors
    withdrew bids mid-process due to COVID-19 and geopolitical disruptions.
