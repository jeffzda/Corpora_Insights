- record_id: ARENA-DLV-49614
  source_title: Viva New Energies Service Station Geelong Demonstration Project -
    Market and Technology Report 1
  publish_date: 2024-04
  project_name: New Energies Service Station Project
  what_happened: The project identified that LCOH as commonly used in industry is
    a misleading cost metric for hydrogen refuelling applications because it only
    captures generation cost at ~30 bar and excludes compression, storage, dispensing
    (CSD) and greenfield infrastructure costs; the fully dispensed cost is approximately
    double the LCOH, and greenfield costs alone represent ~15% of dispensed cost.
  lesson_learnt: Do not use LCOH as the basis for commercial hydrogen pricing or project
    viability assessments for refuelling applications — use 'dispensed cost' (LCOH
    + CSD + greenfield) and 'retailed price' (dispensed cost + capital recovery +
    margin); CSD roughly doubles LCOH and greenfield development adds a further ~15%.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: first commercial/FOAK
  lifecycle_phase: concept/feasibility
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: Viva Energy recommends industry adopt the term 'retailed price'
    in public discourse when referring to hydrogen pricing at public service stations.
  transferability: broad
  delay_magnitude: null
  technology_domain: hydrogen
  source_pages: &id031
  - 29
  evidence_excerpt: LCOH can be misleading as an indicator for the market price for
    hydrogen given that the product is not usable post-electrolyser at a pressure
    of 30 bar and requires further processing before it can be dispensed into vehicles
    or used in other applications... Combined, LCOH plus CSD derives the dispensed
    cost (at cost, with no margin or capital cost recovery), which is effectively
    double that of LCOH.
