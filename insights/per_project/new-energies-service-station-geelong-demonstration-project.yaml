- record_id: ARENA-DLV-64206
  source_title: Viva New Energies Service Station Geelong Demonstration Project -
    Lessons Learned Report 2
  publish_date: 2024-09
  project_name: New Energies Service Station Project
  what_happened: Three compressors arrived at the Australian port in a single oversized
    package; the need for specialised transport (a low loader requiring pre-approval)
    was not recognised in advance, creating a risk of exceeding the three-day port
    clearance window and incurring demurrage and storage charges.
  lesson_learnt: Obtain detailed information on how equipment will be packaged and
    loaded overseas — including photos — before shipment, so that appropriate specialised
    transport can be arranged in advance; failure to do so can result in last-minute
    re-handling costs and port demurrage charges on top of elevated transport costs.
  issue_severity: moderate
  project_type: enabling infrastructure
  project_scale_band: first commercial/FOAK
