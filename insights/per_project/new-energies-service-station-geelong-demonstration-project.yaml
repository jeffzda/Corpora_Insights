  publish_date: 2024-09
  project_name: New Energies Service Station Project
  what_happened: New Tariff Concession Order (TCO) applications require a 28-day public
    consultation period plus ABF assessment time, meaning that if a new TCO is needed
    and not already in place before equipment shipment arrives, import duties will
    be payable and penalties can apply for incorrect classifications.
  lesson_learnt: Plan TCO applications well ahead of shipment — TCOs must be in place
    before goods arrive, new applications involve a 28-day consultation period and
    ABF assessment, and detailed manufacturer technical drawings and specifications
    are required to support the application; do not assume pre-existing TCOs will
    cover novel hydrogen equipment.
