    local testing supply chain for AS ISO 14687 compliance before operations commence
    — limited domestic capability for fuel-grade hydrogen testing creates supply chain
    risk for ongoing quality assurance, and commissioning may be delayed if testing
    turnaround times are not factored into the schedule.
