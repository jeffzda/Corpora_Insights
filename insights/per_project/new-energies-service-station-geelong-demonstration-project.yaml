- record_id: ARENA-DLV-28904
  source_title: Viva - New Energies Service Station Geelong Demonstration Project
    - Lessons Learned Report 1
  publish_date: 2023-12
  project_name: New Energies Service Station Project
  what_happened: At the time the project lodged its planning permit application, there
    was no consistent planning classification for on-site hydrogen generation in Victoria
    — a comparable 10MW hydrogen project in Victoria was not classified as 'industry'
    whereas Viva Energy's 2.5MW project was, demonstrating interpretive inconsistency
    between councils.
  lesson_learnt: In the absence of a standardised planning pathway for hydrogen, project
    teams should seek specialist planning advice early and engage the relevant council
    directly to establish how hydrogen generation will be classified under the local
    planning scheme — inconsistency between jurisdictions means the outcome cannot
    be assumed from precedent.
