  project_name: New Energies Service Station Project
  what_happened: The site layout for a publicly accessible heavy vehicle hydrogen
    refuelling station required a fundamentally different access and egress design
    compared to conventional service stations — including dual entry points for both
    northbound and southbound freight traffic and specific provisions for back-to-base
    fleet operations — which is unusual on freight thoroughfares.
  lesson_learnt: Heavy vehicle hydrogen refuelling stations serving both back-to-base
    and highway traffic must incorporate dual-direction vehicle access, which is non-standard
    for freight sites — undertake vehicle swept path analysis and access planning
    before selecting or committing to a site, as road rating and access configuration
    can constrain or invalidate candidate sites.
