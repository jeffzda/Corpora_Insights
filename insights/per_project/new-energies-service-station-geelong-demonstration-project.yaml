- record_id: ARENA-DLV-28918
  source_title: Viva - New Energies Service Station Geelong Demonstration Project
    - Lessons Learned Report 1
  publish_date: 2023-12
  project_name: New Energies Service Station Project
  what_happened: Australia has no legislated Hydrogen Fuel Quality Standard equivalent
    to the Fuel Quality Standards Act and Regulations that govern petrol and diesel,
    creating uncertainty for hydrogen infrastructure investors, transport operators,
    and vehicle OEMs about minimum quality requirements, warranty obligations, and
    commercial contract terms.
  lesson_learnt: The absence of a legislated Australian Hydrogen Fuel Quality Standard
    is a structural barrier to investment in refuelling infrastructure and FCEV adoption
    — project proponents should engage with relevant government agencies to advocate
    for a national standard and, in the interim, explicitly reference AS ISO 14687
    in all commercial contracts to create a minimum quality baseline.
  issue_severity: moderate
  project_type: enabling infrastructure
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: regulatory & approvals
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: commercial & market
  intervention_note: Viva Energy proactively surveyed vehicle OEMs to understand their
    fuel quality requirements and adopted AS ISO 14687 as the project's fuel quality
    standard in the absence of legislation.
  transferability: broad
  delay_magnitude: null
  technology_domain: hydrogen
  source_pages: &id013
  - 30
  - 32
  - 33
  evidence_excerpt: Currently for the sale of hydrogen gas as a fuel in Australia
    there is no equivalent legislated Fuel Quality Standards Act or Regulation...
    Having an industry accepted Hydrogen Fuel Quality Standard helps eliminate confusion
    and gives passage to creating basic supply contracts for hydrogen (e.g. warranties
    and liabilities), following on from how the sale of traditional liquid fuels is
    governed today.
