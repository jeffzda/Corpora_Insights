  what_happened: The hydrogen refuelling station layout could not be simply replicated
    to alternative sites because site-specific attributes — including land availability,
    existing utilities, road access, land use zoning, and surrounding uses — significantly
    influence the required configuration and layout of equipment.
  lesson_learnt: Do not assume that a proven hydrogen refuelling station design can
    be replicated as a 'cookie cutter' to new sites — while components are relatively
    standard, layout will always require site-specific adaptation; project timelines
    and budgets for subsequent sites should still include meaningful design effort
    to address local constraints.
