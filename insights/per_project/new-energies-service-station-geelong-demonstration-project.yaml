  what_happened: No standard, off-the-shelf fast-fill hydrogen refuelling package
    meeting the project's performance requirements (300 kg dispensed to at least 10
    trucks or buses consecutively in under 2 hours) existed in the market, and the
    required footprint grew during detailed design to comply with hazardous area and
    exclusion zone requirements, driving cost increases across all construction elements.
  lesson_learnt: There are currently no standard off-the-shelf fast-fill heavy vehicle
    hydrogen refuelling packages meeting commercial performance requirements — project
    teams should budget for a bespoke solution, allow time for iterative design as
    hazardous area compliance drives footprint growth, and treat early equipment cost
    estimates as highly uncertain.
