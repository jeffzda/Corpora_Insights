  what_happened: There is currently no consistent national determination on whether
    and how the Wiring Rules apply to containerised hydrogen equipment, with different
    outcomes possible in different states — this inconsistency adds cost and time
    to compliance efforts for any hydrogen project using containerised systems.
  lesson_learnt: Proactively seek a formal determination from the relevant state electrical
    authority on Wiring Rules applicability to containerised hydrogen equipment at
    the start of the project — the lack of national consistency means the outcome
    varies by jurisdiction and assuming compliance from another state's determination
    is unreliable.
