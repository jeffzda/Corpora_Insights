  publish_date: 2023-12
  project_name: New Energies Service Station Project
  what_happened: The project noted that hydrogen FCEV warranties — particularly for
    fuel cells as individual components — are significantly shorter than ICE truck
    warranties, with fuel cell warranties potentially expiring in under 2 years for
    double-shifted prime movers, creating an elevated warranty risk exposure for transport
    operators adopting hydrogen vehicles.
  lesson_learnt: Transport operators investing in heavy hydrogen FCEVs should explicitly
    account for the significantly shorter warranty periods for fuel cells compared
    to ICE vehicles — and the absence of a legislated Hydrogen Fuel Quality Standard
    means that off-specification hydrogen could void these limited warranties sooner
    than anticipated, making fuel quality assurance a critical operational risk.
