  publish_date: 2023-12
  project_name: New Energies Service Station Project
  what_happened: Ambiguity arose during detailed design over whether containerised
    hydrogen equipment should be classified as a 'fixed electrical installation' under
    AS/NZS 3000 (Wiring Rules) or as 'machinery' under AS/NZS 4024.1204, with the
    two standards having different cable wiring and protection requirements — the
    project team spent significant time resolving this with vendors and the state
    electrical authority.
  lesson_learnt: Resolve the 'fixed electrical installation vs. machinery' classification
    for containerised hydrogen equipment with the relevant state electrical authority
    before detailed design commences — this classification determines which electrical
    standard applies and can materially change wiring and protection requirements,
    adding cost and time if resolved late.
