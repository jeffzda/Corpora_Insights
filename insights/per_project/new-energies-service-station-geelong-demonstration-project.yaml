  what_happened: The gap analysis on Australian Standards compliance conducted for
    the specific electrolyser and refueller models procured for this project only
    benefits the broader market if the same make and model of equipment is purchased
    by other projects — any new or different overseas model entering the Australian
    market will require a fresh gap analysis.
  lesson_learnt: Compliance gap analyses against Australian Wiring Rules completed
    for one project are not transferable to different equipment models — every project
    procuring overseas hydrogen equipment from a vendor not previously active in Australia
    should budget for and conduct its own gap analysis, regardless of prior work done
    by other project proponents.
