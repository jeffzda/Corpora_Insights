  project_name: New Energies Service Station Project
  what_happened: No specific risk acceptance criteria for hydrogen generation or refuelling
    facilities exists in Australian Standards, and Victoria only defines risk criteria
    for Major Hazard Facilities — leaving projects below the MHF threshold to determine
    and justify their own risk criteria, which varied from project to project and
    state to state.
  lesson_learnt: Hydrogen refuelling projects below the MHF threshold must define
    and justify their own QRA risk acceptance criteria — consider adopting WorkSafe
    Victoria MHF land-use planning guidance as a conservative reference point and
    document the justification thoroughly to withstand regulatory scrutiny.
