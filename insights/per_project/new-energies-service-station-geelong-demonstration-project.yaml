  project_name: New Energies Service Station Project
  what_happened: The project cost estimate markedly increased over two years of detailed
    design relative to the 2021 budget estimate submitted with the ARENA application,
    driven by electrolyser upsizing, underestimated electrical infrastructure, refuelling
    package complexity, hazardous area exclusion zone footprint, construction cost
    inflation, and scope addition of 700bar refuelling capability.
  lesson_learnt: Cost estimates for first-of-a-kind hydrogen refuelling stations are
    highly susceptible to significant upward revision during detailed design — build
    substantial contingency into initial budgets and expect iterative scope growth
    as vendor data, compliance requirements, and market technology evolution all interact
    to increase the required footprint and infrastructure cost.
