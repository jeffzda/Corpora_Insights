- record_id: ARENA-DLV-28906
  source_title: Viva - New Energies Service Station Geelong Demonstration Project
    - Lessons Learned Report 1
  publish_date: 2023-12
  project_name: New Energies Service Station Project
  what_happened: The project used an iterative quantitative risk assessment (QRA)
    process to determine separation distances for hydrogen equipment because Australia
    — unlike the US (NFPA 2) — has no prescriptive national standard specifying minimum
    separation distances for hydrogen refuelling stations, requiring multiple design-and-review
    cycles to establish an acceptable layout.
  lesson_learnt: In the absence of prescriptive Australian separation distance standards
    for hydrogen refuelling stations, allow significantly more time and cost in the
    design phase for iterative QRA-based layout development — use NFPA 2 or SA TS
    5359 to establish an initial concept layout as input to QRA, but factor contingency
    into the initial site footprint to accommodate QRA-driven changes.
  issue_severity: moderate
  project_type: enabling infrastructure
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: data/validation/testing
  failure_mode: regulatory & approvals
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Viva Energy applied WorkSafe Victoria MHF land-use planning guidance
    as the risk acceptance criteria for the QRA and used an iterative layout-and-review
    process, referencing NFPA 2 for initial separation distance estimates.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages: &id005
  - 18
  - 19
  evidence_excerpt: It is noted that if separation distances were more prescriptive
    for a hydrogen refuelling station, such as in NFPA 2, facility design would require
    less time and cost to develop.
  confidence_note: secondary_failure_mode of schedule slippage inferred from the iterative
    design process described; not quantified as a separate delay event.
