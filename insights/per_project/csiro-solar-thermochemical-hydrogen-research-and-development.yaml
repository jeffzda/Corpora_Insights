  publish_date: 2020-11
  project_name: CSIRO Solar Thermochemical Hydrogen R&D Project
  what_happened: Knowledge sharing activities for the project were limited at the
    midterm stage primarily because the beam-down facility — the project's centrepiece
    — was not yet operational. The unique nature of the facility meant that meaningful
    dissemination was dependent on demonstrating and verifying performance.
  lesson_learnt: For novel demonstration infrastructure projects, plan knowledge dissemination
    activities to be staged around operational milestones rather than calendar dates
    — publishing or presenting before the facility is commissioned limits the credibility
    and reach of knowledge outputs.
