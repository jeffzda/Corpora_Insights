- record_id: ARENA-DLV-25656
  source_title: Solar Thermochemical Hydrogen R&D Midterm Activity Nov 2020
  publish_date: 2020-11
  project_name: CSIRO Solar Thermochemical Hydrogen R&D Project
  what_happened: Machine learning (Random Forest and label propagation algorithms)
    was applied to screen over 200,000 candidate perovskite formulas for solar thermochemical
    water splitting, narrowing candidates to 81 materials predicted to have low formation
    energy and hydrogen-producing capability — substantially accelerating materials
    screening compared to purely experimental methods.
  lesson_learnt: Combining machine learning screening with targeted experimental validation
    is an effective strategy for accelerating novel catalyst discovery in thermochemical
    hydrogen R&D — deploying ML before committing to expensive experimental synthesis
    reduces the search space by orders of magnitude and focuses resources on the most
    promising candidates.
