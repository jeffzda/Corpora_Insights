- record_id: ARENA-DLV-25654
  source_title: Solar Thermochemical Hydrogen R&D Midterm Activity Nov 2020
  publish_date: 2020-11
  project_name: CSIRO Solar Thermochemical Hydrogen R&D Project
  what_happened: Technoeconomic modelling by IAE found that the methanol production
    cost from the solar thermochemical hydrogen pathway ranged from 300–600 AUD/tonne,
    overlapping with the prevailing market price of approximately 300 AUD/tonne methanol,
    suggesting the technology could potentially be cost-competitive with improvements
    and at scale.
  lesson_learnt: Early technoeconomic modelling for novel hydrogen pathways should
    be completed in parallel with demonstration activity — even preliminary cost ranges
    that overlap with market benchmarks provide a credible basis for commercialisation
    conversations and help attract industry partners before experimental validation
    is complete.
