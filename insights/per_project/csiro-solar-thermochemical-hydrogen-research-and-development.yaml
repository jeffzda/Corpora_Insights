- record_id: ARENA-DLV-25655
  source_title: Solar Thermochemical Hydrogen R&D Midterm Activity Nov 2020
  publish_date: 2020-11
  project_name: CSIRO Solar Thermochemical Hydrogen R&D Project
  what_happened: The original monolithic reflector design for the beam-down optical
    system was discretised into 395×395mm panels during detailed design, and the existing
    tower ring structure required heavy modification to incorporate the reflector
    — a 'bulkhead' design had to be developed to interface the reflector with the
    tower.
  lesson_learnt: When retrofitting new optical or structural systems onto existing
    research infrastructure, budget for significant redesign effort during detailed
    engineering — initial concept designs based on monolithic components frequently
    require discretisation and bespoke interface solutions once structural constraints
    of existing infrastructure are assessed.
  issue_severity: minor
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated integration
  intervention_note: A 'bulkhead' design was developed to modify the existing ring
    structure to create a simple and flexible interface between the new reflector
    panels and the tower.
  transferability: narrow
  delay_magnitude: null
  technology_domain: solar thermal
  source_pages: &id003
  - 9
  evidence_excerpt: It was then clear that the original ring would need to be heavily
    modified to incorporate the reflector. A 'bulkhead' design was developed to change
    the ring to allow a simple and flexible interface to the tower.
