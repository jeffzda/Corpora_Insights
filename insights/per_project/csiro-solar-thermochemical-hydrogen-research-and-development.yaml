  evidence_excerpt: In all cases, the production cost of methanol was in the range
    of 300 to 600AUD/ton MetOH. In context the market price of methanol is about 300AUD/ton
    MetOH, allowing some confidence that the cost range is sufficient to withstand
    market competition and with improvements in future technology and establishment
    of mass production system.
