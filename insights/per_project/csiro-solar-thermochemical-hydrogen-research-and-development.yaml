- record_id: ARENA-DLV-25651
  source_title: Solar Thermochemical Hydrogen R&D Midterm Activity Nov 2020
  publish_date: 2020-11
  project_name: CSIRO Solar Thermochemical Hydrogen R&D Project
  what_happened: Program 1 (demonstration facility construction) was delayed in 2020
    due to COVID-19-related supply chain disruptions — specifically China factory
    closures causing parts delays, shipping delays at Australian ports, and CSIRO-mandated
    restrictions on external contractors accessing the site. A formal project variation
    was requested and approved to accommodate the construction delays.
  lesson_learnt: R&D demonstration projects relying on imported components and external
    contractors should build explicit COVID-19 or supply-chain disruption contingency
    into schedules; the cascading effects of factory shutdowns, shipping delays, and
    site access restrictions compound quickly and require a formal variation process
    to be resolved.
