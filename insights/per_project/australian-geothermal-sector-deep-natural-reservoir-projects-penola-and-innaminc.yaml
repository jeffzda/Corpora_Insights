  evidence_excerpt: Two projects have attempted to demonstrate these resources in
    Australia – at Penola and Innamincka Shallows. These two small-scale, first-of-a-kind
    projects were funded by equity and government project support in one case and
    completely by equity in the other. Neither project produced the anticipated flow
    rates raising questions over the technical viability of developing Deep Natural
    Reservoirs that rely on primary permeability in Australia.
