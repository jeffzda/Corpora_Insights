  source_title: 'Looking Forward: Barriers, Risks and Rewards of the Australian Geothermal
    Sector to 2020 and 2030'
  publish_date: 2014-06
  project_name: Australian Geothermal Sector – Deep Natural Reservoir Projects (Penola
    and Innamincka Shallows)
  what_happened: Two Deep Natural Reservoir demonstration projects in Australia —
    at Penola and Innamincka Shallows — both failed to produce anticipated flow rates,
    raising fundamental questions about the technical viability of developing Deep
    Natural Reservoirs that rely on primary permeability in Australian geological
    conditions.
  lesson_learnt: Before committing to commercial-scale demonstration of deep natural
    reservoir geothermal resources, prospectors must validate that exploration methods
    can reliably identify naturally permeable formations at depth — the ability to
    find and target naturally permeable geothermal reservoirs before drilling has
    not been demonstrated in Australia and represents a critical technology gap.
