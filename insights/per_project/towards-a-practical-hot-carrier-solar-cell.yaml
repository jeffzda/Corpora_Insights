- record_id: ARENA-DLV-16551
  source_title: Hot Carrier Solar Cell - Project Results and Lessons Learnt
  publish_date: 2015-08
  project_name: The Hot Carrier Solar Cells
  what_happened: Si quantum dot (QD) energy selective contacts fabricated by annealing
    silicon-rich oxide layers produced a resonance peak half-width exceeding 400 meV
    — more than an order of magnitude broader than the recommended value — making
    the approach impractical for hot carrier solar cell efficiency targets.
  lesson_learnt: Avoid Si QD-based energy selective contacts formed by thermal annealing
    of silicon-rich oxide; the inherently wide size distribution of QDs broadens the
    resonance peak unacceptably. Use quantum well (QW) resonant tunnelling structures
    instead, where well thickness can be precisely controlled, or Langmuir-Blodgett-deposited
    uniform nanoparticle arrays.
  issue_severity: moderate
