- record_id: ARENA-DLV-16554
  source_title: Hot Carrier Solar Cell - Project Results and Lessons Learnt
  publish_date: 2015-08
  project_name: The Hot Carrier Solar Cells
  what_happened: Market assessment of hot carrier solar cells found that thin-film
    deposition-based HC solar cell costs are very high compared to commercial silicon
    PV, while solution-processed (roll-to-roll) fabrication could potentially achieve
    lower costs than silicon solar cells.
  lesson_learnt: Thin-film deposition routes for hot carrier solar cells are not cost-competitive
    with commercial silicon PV at present; future development pathways should prioritise
    solution-processed or roll-to-roll fabrication architectures to have a realistic
    prospect of cost parity.
