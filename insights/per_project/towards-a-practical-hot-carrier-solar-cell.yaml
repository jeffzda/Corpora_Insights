- record_id: ARENA-DLV-16553
  source_title: Hot Carrier Solar Cell - Project Results and Lessons Learnt
  publish_date: 2015-08
  project_name: The Hot Carrier Solar Cells
  what_happened: The project successfully demonstrated proof-of-concept hot carrier
    solar cell devices combining HfN absorbers with double-barrier resonant tunnelling
    energy selective contacts, confirming power generation and hot carrier collection
    — all milestones were met and 12 journal publications were produced.
  lesson_learnt: A phased approach — separately optimising absorber and energy selective
    contact components before integration — is effective for complex multi-component
    third-generation solar cell research; this pathway can compress iteration cycles
    and validate feasibility without requiring full device integration at every experimental
    step.
