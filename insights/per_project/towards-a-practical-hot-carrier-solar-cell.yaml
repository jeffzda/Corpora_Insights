- record_id: ARENA-DLV-16552
  source_title: Hot Carrier Solar Cell - Project Results and Lessons Learnt
  publish_date: 2015-08
  project_name: The Hot Carrier Solar Cells
  what_happened: InN-based hot carrier solar cells, which are theoretically optimal
    due to InN's large phonon gap and small electronic band gap, could not be made
    practically viable because growing InN and its energy selective contact materials
    (InxGaN1-x) to sufficient crystalline quality proved too difficult, and integrating
    absorber and ESC was hindered by incompatible processing conditions.
  lesson_learnt: Future projects targeting hot carrier solar cells should not rely
    on InN-based absorbers given current material growth limitations; transition metal
    nitrides such as HfN and zirconium nitride are more practical alternatives with
    large phonon gaps capable of suppressing Klemens phonon decay and slowing carrier
    cooling.
  issue_severity: major
  project_type: null
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated integration
  intervention_note: Substituted HfN thin films and colloidal Si nanoparticles as
    absorber materials, and adopted Al2O3/Si(Ge) QW/Al2O3 structures for energy selective
    contacts, enabling fabrication of proof-of-concept HC solar cell devices.
  transferability: narrow
