  what_happened: The project was structured as part of a suite of six linked laser
    processing and characterisation projects at ANU, with explicit synergies between
    PhD projects, ARENA-funded fellowships, and international partner projects (ISFH
    Germany). Project outcomes fed directly into follow-on work including a postdoctoral
    LCP fellowship awarded to Dr. Xinbo Yang.
  lesson_learnt: Structuring applied R&D as a coordinated portfolio of linked projects
    — combining PhD research, postdoctoral fellowships, and international partnerships
    — rather than isolated grants accelerates progress, reduces duplication, and improves
    the quality of outcomes; ARENA funding of complementary fellowships alongside
    project grants is an effective portfolio design mechanism.
