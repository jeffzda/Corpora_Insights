  what_happened: At project completion, commercialisation of the LCP technology IP
    had not been concluded — discussions with equipment manufacturers were described
    as underway, with the most prospective route identified as partnership with a
    large PV processing equipment manufacturer, but no agreement had been reached.
  lesson_learnt: Laboratory R&D projects targeting commercial technology adoption
    should build commercialisation pathway engagement — including identification of
    equipment manufacturer partners — into the project plan rather than treating it
    as a post-completion activity; late-stage commercialisation conversations risk
    losing momentum before IP matures into a licensed product.
