  publish_date: 2014-05
  project_name: Laser Doping Using Laser Chemical Processing Technology for Advanced
    Silicon Solar Cells (1-GER006)
  what_happened: The project developed advanced measurement and modelling techniques
    — including the Quokka simulation program — to interpret results from highly non-uniform
    laser-processed features. These tools were subsequently published, made freely
    available through PV Lighthouse, and found application in other research areas
    beyond the originating project.
  lesson_learnt: When developing novel processing technologies, investing in parallel
    development of fit-for-purpose measurement and modelling tools — and releasing
    them openly — accelerates not only the immediate project but the broader research
    community; open-release of analytical software (e.g. via platforms like PV Lighthouse)
    is a cost-effective knowledge-transfer mechanism for publicly funded R&D.
