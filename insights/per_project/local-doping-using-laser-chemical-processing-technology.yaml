- record_id: ARENA-DLV-40702
  source_title: 'Laser Doping Using Laser Chemical Processing Technology for Advanced
    Silicon Solar Cells - Final Report: Project Results and Lessons Learnt'
  publish_date: 2014-05
  project_name: Laser Doping Using Laser Chemical Processing Technology for Advanced
    Silicon Solar Cells (1-GER006)
  what_happened: Solar cells fabricated at ANU and Fraunhofer ISE using the improved
    LCP process for both front and rear contacts achieved 20.4% conversion efficiency
    in a first attempt with not-yet-optimised processing parameters, exceeding the
    efficiency of most commercially produced solar cells at the time.
  lesson_learnt: Demonstrating end-to-end cell fabrication using the new process —
    even with unoptimised parameters — provides compelling evidence of commercial
    potential and can accelerate engagement with equipment manufacturers; project
    teams should plan a full-cell demonstration milestone before approaching commercialisation
    partners.
