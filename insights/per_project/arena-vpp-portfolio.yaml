- record_id: ARENA-DLV-42754
  source_title: Evaluation of ARENA's VPP Portfolio
  publish_date: 2021-06
  project_name: ARENA VPP Portfolio
  what_happened: The ARENA VPP portfolio resulted in a disproportionate concentration
    of battery subsidies and expertise in South Australia — 76% of total project costs
    and 62% of ARENA funding were allocated to South Australia — creating a risk of
    knowledge remaining geographically siloed.
  lesson_learnt: When funding technology trials in one jurisdiction because of high
    DER penetration or policy drivers, proactively plan knowledge dissemination mechanisms
    to other jurisdictions from the outset; otherwise portfolio learnings may remain
    geographically concentrated and fail to benefit the broader national market.
