- record_id: ARENA-DLV-42757
  source_title: Evaluation of ARENA's VPP Portfolio
  publish_date: 2021-06
  project_name: ARENA VPP Portfolio
  what_happened: No formal impact pathway or quantitative evaluation framework was
    developed during the VPP portfolio planning phase; evaluators retrospectively
    developed the impact pathway and cost-benefit assessment, limiting data availability
    and introducing assumptions that reduced analytical precision.
  lesson_learnt: Develop the impact pathway, counterfactual scenario, and data collection
    requirements at program inception, not retrospectively; failure to do so forces
    evaluators to rely on proxies and expert judgement, reducing the credibility and
    precision of cost-benefit findings.
