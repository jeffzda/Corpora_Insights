  what_happened: Data collection requirements across the VPP portfolio were largely
    limited to requiring that material learnings be included in knowledge sharing
    reports, rather than specifying structured data collection of operational time-series
    and system performance data; evaluators noted that more stringent data collection
    requirements would have improved evaluation quality.
