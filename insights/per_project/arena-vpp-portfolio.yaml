- record_id: ARENA-DLV-42790
  source_title: Evaluation of ARENA's VPP Portfolio
  publish_date: 2021-06
  project_name: ARENA VPP Portfolio
  what_happened: Across the VPP portfolio, ARENA's milestone-based reporting structure
    — where milestone payments and report submissions were linked to project progress
    rather than calendar dates — was consistently rated positively by funding recipients
    and contributed to efficient portfolio delivery.
  lesson_learnt: Link reporting and payment milestones to project progress events
    rather than calendar dates; this aligns funding recipient incentives with actual
    delivery and reduces the administrative burden of reporting periods that arrive
    before meaningful project progress has occurred.
