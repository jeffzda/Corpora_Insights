  project_name: ARENA VPP Portfolio
  what_happened: An inherent conflict emerged between AEMO (favouring a centralised
    bidding platform for VPPs) and network businesses (resistive to that model), creating
    governance uncertainty for VPP operators and limiting the development of a uniform
    market framework.
  lesson_learnt: Identify and resolve governance conflicts between market operator
    and network business models early in portfolio design; funding programs should
    prioritise projects that support development of a common bidding and governance
    framework rather than leaving this unresolved across multiple trials.
