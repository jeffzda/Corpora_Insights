- record_id: ARENA-DLV-42758
  source_title: Evaluation of ARENA's VPP Portfolio
  publish_date: 2021-06
  project_name: ARENA VPP Portfolio
  what_happened: Multiple VPP funding recipients reported that the time elapsed between
    project Board approval and contract execution was protracted and unnecessarily
    complex, with ARENA's sign-off processes adding friction. Start-ups in particular
    found the engagement required to manage ARENA requirements represented a significant
    cost.
  lesson_learnt: Streamline the contracting and sign-off process between project approval
    and funding agreement execution, and calibrate reporting/engagement requirements
    to the size and capacity of the funding recipient — overly complex processes deter
    eligible start-ups and small businesses from applying.
