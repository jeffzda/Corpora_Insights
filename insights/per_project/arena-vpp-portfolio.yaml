  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id005
  - 23
  - 24
  evidence_excerpt: Within the trial, the cost of deploying a VPP was in most cases
    more expensive than installing a large-scale battery. Given the early-stage nature
    of the VPP projects, this is to be expected. As more consumers purchase batteries,
    due to a decline in the cost of batteries, then VPPs may be a cost effective alternative
    to large scale batteries.
