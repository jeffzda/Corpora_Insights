  what_happened: VPP projects confirmed that network services benefits remain largely
    inaccessible to VPPs due to insufficient density of behind-the-meter batteries
    around network assets, meaning this value stream could not be captured during
    the portfolio trials.
  lesson_learnt: Before designing a VPP trial that aims to capture network services
    value, assess whether the geographic density of participating assets around network
    constraint points is sufficient; without this density, network value streams will
    not materialise regardless of technical capability.
