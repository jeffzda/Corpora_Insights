  publish_date: 2021-06
  project_name: ARENA VPP Portfolio
  what_happened: The portfolio validated that present battery costs remain prohibitively
    high for residential customers to justify investing in behind-the-meter batteries
    solely to capture VPP benefits, leaving VPP markets unable to operate at commercial
    scale without government support.
  lesson_learnt: Where the economics of a DER business model depend on rapid decline
    in hardware costs (e.g. batteries), design trials around the software/aggregation
    value rather than subsidising hardware deployment; hardware-led subsidies advance
    market adoption but do not resolve the underlying commercial barrier.
