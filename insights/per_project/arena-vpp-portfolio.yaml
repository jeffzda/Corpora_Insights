- record_id: ARENA-DLV-42751
  source_title: Evaluation of ARENA's VPP Portfolio
  publish_date: 2021-06
  project_name: ARENA VPP Portfolio
  what_happened: Across ARENA's portfolio of 11 VPP projects, 6 of the 11 projects
    failed to meet ARENA's target leverage ratio of 1:2 to 1:3, with private sector
    co-investment falling short of targets. The lowest leverage achieved was 1:0.98
    (AEMO Demonstrations) and several others clustered around 1:1.
  lesson_learnt: When funding nascent technologies such as VPPs that have limited
    commercial proof points, ARENA should balance investment according to commercial
    maturity — directing a higher proportion to more commercially mature projects
    to attract adequate private sector co-investment — and consider a risk/cost KPI
    rather than a simple leverage ratio.
