- record_id: ARENA-DLV-42752
  source_title: Evaluation of ARENA's VPP Portfolio
  publish_date: 2021-06
  project_name: ARENA VPP Portfolio
  what_happened: ARENA funded its VPP portfolio without a documented overarching strategy
    or roadmap, resulting in funding recipients being uncertain about how their project
    fitted within the broader VPP development trajectory and how each project related
    to others.
  lesson_learnt: Before deploying a portfolio of related innovation projects, develop
    and publish a strategic roadmap that identifies technical and commercial gaps
    each project is expected to fill; this enables better project selection, informs
    the market, and helps projects build on one another systematically.
