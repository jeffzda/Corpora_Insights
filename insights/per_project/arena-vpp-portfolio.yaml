- record_id: ARENA-DLV-42756
  source_title: Evaluation of ARENA's VPP Portfolio
  publish_date: 2021-06
  project_name: ARENA VPP Portfolio
  what_happened: The VPP portfolio trials validated that VPPs can access FCAS markets
    and helped develop the AEMO Market Ancillary Service Specification (MASS), estimated
    to have brought forward VPP access to the FCAS market by approximately three years,
    producing a Benefit Cost Ratio of 1.35 over the 2017–2030 modelled period.
  lesson_learnt: Focused investment in developing and testing a specific regulatory
    mechanism (here, the MASS for FCAS participation) can generate system-wide benefits
    well beyond the individual trial projects — future VPP or DER funding programs
    should identify analogous regulatory bottlenecks as priority targets.
