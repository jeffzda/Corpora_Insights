- record_id: ARENA-DLV-42755
  source_title: Evaluation of ARENA's VPP Portfolio
  publish_date: 2021-06
  project_name: ARENA VPP Portfolio
  what_happened: Across multiple VPP projects, the cost of deploying and operating
    a VPP (average ~$844,200/MW/year including hardware subsidies) exceeded the benchmark
    cost of deploying an equivalent large-scale battery (~$827,000/MW), meaning the
    portfolio did not demonstrate cost-competitiveness relative to centralised alternatives
    during the trial period.
  lesson_learnt: Early-stage VPP trials will typically show costs above large-scale
    battery benchmarks because hardware subsidies dominate project budgets; structure
    trial cost metrics to separate hardware deployment costs from software/aggregation
    platform costs, so that the underlying VPP service cost (which becomes competitive
    once batteries are consumer-owned) is visible to future funding decisions.
  issue_severity: moderate
  project_type: null
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: government/public-sector body
  delay_category: null
