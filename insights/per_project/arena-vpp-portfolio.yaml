- record_id: ARENA-DLV-42793
  source_title: Evaluation of ARENA's VPP Portfolio
  publish_date: 2021-06
  project_name: ARENA VPP Portfolio
  what_happened: The ARENA VPP portfolio did not include an interim project assessment
    process to evaluate whether project learnings should be carried forward to a new
    project or whether continued funding of the existing project was the best use
    of resources, resulting in some project learnings not being optimally leveraged.
  lesson_learnt: Introduce a formal mid-project assessment gate for multi-year VPP
    trials that evaluates whether pivoting to a new project would better advance the
    portfolio objectives than continuing the current project; this prevents lock-in
    to projects whose early findings have already been superseded.
