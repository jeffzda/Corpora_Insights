  source_title: Evaluation of ARENA's VPP Portfolio
  publish_date: 2021-06
  project_name: ARENA VPP Portfolio
  what_happened: ARENA's progressive, iterative approach to funding VPP projects —
    investing in individual projects over time rather than through a single funding
    round — proved effective for a nascent, technically complex technology, allowing
    later projects to build on the learnings of earlier ones.
  lesson_learnt: For nascent, technically complex technologies with multiple interacting
    stakeholders (such as VPPs), a progressive iterative funding approach is more
    effective than a single funding round; reserve single-round approaches for technologies
    that are already commercially mature.
