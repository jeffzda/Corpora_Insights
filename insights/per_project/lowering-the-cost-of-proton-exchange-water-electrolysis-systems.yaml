  evidence_excerpt: The key lesson learnt at this stage of the project is a critical
    lack of consistency and transparency in reporting the designs, assembly procedures
    and testing conditions for water electrolyser devices in the scientific and technical
    literature, as well as in patents. As a result, even the most high-impact reports
    in the field are highly challenging to reproduce, even upon personal communication
