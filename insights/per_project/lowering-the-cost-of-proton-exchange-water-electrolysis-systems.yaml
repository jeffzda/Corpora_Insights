- record_id: ARENA-DLV-18455
  source_title: Monash - Lowering cost of proton exchange water electrolysis Systems
    - Core Research Interim Report
  publish_date: 2025-09
  project_name: PRO-1082 – Lowering the cost of proton exchange water electrolysis
    systems
  what_happened: Techno-economic analysis of direct seawater electrolysis conducted
    during the project revealed that the levelised cost of hydrogen does not decrease
    at current densities above approximately 0.2–0.3 A cm⁻², because reductions in
    CapEx at higher current density are offset by increasing OpEx from higher energy
    requirements. This finding contradicted the Milestone 2 target metric of ≥0.4
    A cm⁻² for seawater operation.
  lesson_learnt: Techno-economic analysis should be integrated with R&D target-setting
    from the outset; milestone performance targets for seawater electrolysis set without
    this analysis may not align with commercial cost optimums, potentially directing
    R&D effort toward operating points that offer no economic benefit.
  issue_severity: minor
  project_type: null
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: The team met the milestone target as specified but noted that
    future R&D work will be guided by the techno-economic findings, effectively redirecting
    effort toward lower current density targets for seawater electrolysis.
  transferability: moderate
  delay_magnitude: null
  technology_domain: hydrogen
  source_pages: &id005
  - 6
  - 7
  evidence_excerpt: It should be noted upfront that our revised techno-economic analysis
    of the seawater electrolysis suggests that the cost-effectiveness of this technology
    levels off at current densities between 0.1-0.3 A cm-2, and operation at 0.4 A
    cm–2 might not provide any significant advantages... our techno-economic analysis
    suggests that the levelised cost of hydrogen derived from the direct seawater
    electrolysis might not decrease at current densities above 0.2 A cm–2 due to opposite
    effects of this key operating parameter on the CapEx and OpEx.
  confidence_note: issue_severity rated minor as the milestone target was still met
    and the finding redirects future effort rather than causing a material setback.
