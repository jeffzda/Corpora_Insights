- record_id: ARENA-DLV-18453
  source_title: Monash - Lowering cost of proton exchange water electrolysis Systems
    - Core Research Interim Report
  publish_date: 2025-09
  project_name: PRO-1082 – Lowering the cost of proton exchange water electrolysis
    systems
  what_happened: The project team found that performance data for water electrolysis
    catalysts measured under standard model conditions (as widely reported in scientific
    literature) correlates poorly with performance measured at the device level in
    PEMWE prototypes, meaning literature benchmarks could not be relied upon to assess
    new catalyst candidates.
  lesson_learnt: Catalyst screening for PEMWE development should be conducted at the
    device level rather than relying on model conditions reported in published literature;
    poor correlation between model-condition and device-level performance means that
    device-level testing protocols must be established as a foundational early-project
    activity.
  issue_severity: moderate
  project_type: null
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: data & measurement
  intervention_note: The team established their own robust device-level testing protocols
    in collaboration with CSIRO and industry partners, and plans to publish these
    as an open-source paper to benefit the broader field.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages: &id003
  - 6
  evidence_excerpt: We have also demonstrated that the performance of the water electrolysis
    catalysts measured under model conditions, ubiquitously used in the scientific
    literature, and in the PEMWE prototypes correlate poorly. This means that reliable
    assessment of the performance of new catalysts is only possible at the device
    level, further emphasising the critical importance of establishing robust procedures
    for the fabrication of the PEMWE prototypes at the early stages of the project.
