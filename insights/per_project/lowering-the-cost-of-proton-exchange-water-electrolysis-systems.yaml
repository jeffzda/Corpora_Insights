- record_id: ARENA-DLV-18454
  source_title: Monash - Lowering cost of proton exchange water electrolysis Systems
    - Core Research Interim Report
  publish_date: 2025-09
  project_name: PRO-1082 – Lowering the cost of proton exchange water electrolysis
    systems
  what_happened: The scientific and technical literature, including patents, was found
    to critically lack consistency and transparency in reporting electrolyser designs,
    assembly procedures, and testing conditions. High-impact publications in the field
    were found to be highly difficult to reproduce even after direct communication
    with the original authors.
  lesson_learnt: Research teams entering PEMWE development should not assume published
    assembly and testing protocols are reproducible; budget time and resources at
    project outset to develop and validate in-house standard protocols, and consider
    publishing these openly to advance the field.
