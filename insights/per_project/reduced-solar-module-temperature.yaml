  what_happened: The project found that modifications intended to improve cooling
    — such as new films, glass textures, and structural additions — carry risks of
    unintended consequences including durability reduction and increased dust accumulation,
    and these interactions were not fully anticipated in the original project design.
  lesson_learnt: When introducing passive cooling modifications to solar modules,
    explicitly scope and budget for durability testing and unintended interaction
    assessment (e.g. dust accumulation from textured glass, film degradation) — failure
    to anticipate these effects can invalidate performance gains in real-world deployment.
