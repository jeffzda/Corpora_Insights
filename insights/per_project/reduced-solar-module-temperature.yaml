  source_title: Reduced Solar Module Temperature Project Progress and Lessons Learnt
  publish_date: '2021-09-13'
  project_name: Reduced Solar Module Temperature
  what_happened: The project identified that manufacturability and cost-effectiveness
    of passive cooling technologies remain unresolved knowledge gaps at the mid-project
    stage, meaning that technically demonstrated cooling benefits cannot yet be confirmed
    as commercially viable module design changes.
  lesson_learnt: For solar module innovation projects, technical demonstration of
    cooling performance should be accompanied from the outset by parallel assessment
    of manufacturability and cost-effectiveness — deferring these assessments to a
    later program stage risks investing in approaches that cannot be commercially
    adopted even if the physics works.
