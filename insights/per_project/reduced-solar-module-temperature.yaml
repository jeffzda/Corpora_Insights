    10cm in length could result in 2.2°C of cooling for the module downstream of the
    VG and a further 1.1°C of cooling for the next module... punching an opening on
    the frame of the PV module is the most obvious way to reduce the size and the
    impact of the recirculation bubble... showed that doing so using elliptical openings
    will not compromise the rigidity of the frame.
