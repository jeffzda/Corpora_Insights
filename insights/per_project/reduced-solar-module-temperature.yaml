- record_id: ARENA-DLV-27653
  source_title: Reduced Solar Module Temperature Project Progress and Lessons Learnt
  publish_date: '2021-09-13'
  project_name: Reduced Solar Module Temperature
  what_happened: Initial full-size module field tests using 3D-printed vortex generators
    on the rear of modules achieved a 2°C cooling effect, short of the project target
    of greater than 5°C NMOT reduction, though simulations suggest further improvement
    is possible through material and design refinement.
  lesson_learnt: Initial physical demonstrations of passive convective cooling on
    full-size modules can achieve partial targets (2°C of a 5°C goal); simulations
    indicate the gap can be closed through material upgrades (e.g. thermally conductive
    plastics) and design optimisation, so physical prototyping and modelling should
    proceed in parallel rather than sequentially.
  issue_severity: minor
  project_type: manufacturing/supply chain
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: partial success
  secondary_failure_mode: null
  intervention_note: The team identified that moving from non-conductive to thermally
    conductive plastic in VG manufacturing was expected to close the gap toward the
    5°C target, with mass production via thermoforming or injection moulding identified
    as the cost-effective pathway.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id003
  - 9
  evidence_excerpt: Using these initial VG designs, and with no additional air flow,
    the test showed 2°C of cooling was achieved with an optimised arrangement. These
    VGs can be mass produced cheaply through thermoforming or injecting moulding,
    and a move to more thermally conductive plastic is expected to give us even more
    effective cooling.
  confidence_note: null
