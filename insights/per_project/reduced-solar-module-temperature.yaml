  what_happened: The resonant absorber approach using the element dysprosium (Dy)
    to modify glass refractive index and reduce infrared absorption was found to be
    unlikely to be a practical method for reducing NMOT, due to difficulties in obtaining
    required absorption strength and controlling unwanted absorption at non-targeted
    wavelengths.
  lesson_learnt: Theoretically promising infrared absorption strategies can fail at
    the practical implementation stage due to materials control challenges — validate
    optical material approaches experimentally before committing to module integration
    work, as fundamental physics may not translate into manufacturable solutions.
