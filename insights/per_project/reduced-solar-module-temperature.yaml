  what_happened: Conductive tape applied to the rear of a full-size PV module in outdoor
    field conditions demonstrated lower and more uniform temperature distribution
    at the module edge, suggesting a practical and low-cost thermal management intervention.
  lesson_learnt: Thermally conductive tape applied to module rear edges is a low-cost,
    easily trialled passive cooling intervention that demonstrably reduces and evens
    out edge temperatures — this approach warrants inclusion in module-level thermal
    management trials at scale before committing to more complex structural modifications.
