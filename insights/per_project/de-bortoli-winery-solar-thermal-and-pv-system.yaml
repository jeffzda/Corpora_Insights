- record_id: ARENA-DLV-11011
  source_title: Renewable Energy Options for Industrial Process Heat
  publish_date: 2019-08
  project_name: De Bortoli Winery Solar Thermal and PV System
  what_happened: De Bortoli Winery installed a solar thermal evacuated tube collector system at its Griffith winery in 2013 as part of a bottling line expansion, designed to reduce gas consumption for hot
    water by more than 80%. The project also included a 230 kW PV system. The solar thermal system required roof strengthening and was a small component of a larger $14.5 million plant upgrade. A grant
    of $4.8 million from the Clean Technology Food and Foundries Investment Program contributed to costs.
  lesson_learnt: Solar thermal hot water systems in food and beverage can achieve over 80% reduction in gas use for hot water and are commercially viable at payback periods of approximately 6 years before
    grants — roof structural capacity must be assessed early as strengthening requirements can affect project feasibility.
