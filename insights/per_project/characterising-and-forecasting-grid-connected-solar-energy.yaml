  project_name: Forecasting and Characterising Grid Connected Solar Energy and Developing
    Synergies with Wind
  what_happened: During cloudy conditions, RMSE for TAPM solar irradiance forecasts
    increased by approximately 300% compared to clear-sky conditions, driven primarily
    by misrepresentation of clouds including deep low-pressure systems, cold fronts,
    easterly troughs, and cloud bands.
  lesson_learnt: Solar irradiance forecasting models exhibit severely degraded accuracy
    under cloudy and frontal conditions — forecasting systems deployed for operational
    grid management must explicitly account for model skill collapse during high-cloud
    events and should apply cloud-specific corrections or ensemble approaches.
