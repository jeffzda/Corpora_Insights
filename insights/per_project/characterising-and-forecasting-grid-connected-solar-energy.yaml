- record_id: ARENA-DLV-53556
  source_title: Forecasting and Characterising Grid Connected Solar Energy and Developing
    Synergies with Wind - Project results and lessons learnt
  publish_date: '2015'
  project_name: Forecasting and Characterising Grid Connected Solar Energy and Developing
    Synergies with Wind
  what_happened: The BRL (Boland-Ridley-Lauret) decomposition model was applied to
    convert GHI forecasts (the standard NWP output) into diffuse and direct normal
    irradiance (DNI), enabling CST performance estimation from models that only forecast
    GHI.
  lesson_learnt: When planning solar forecasting systems that must support both PV
    and concentrated solar technology (CST), include a validated GHI decomposition
    model such as BRL to derive DNI — NWP models typically only forecast GHI directly,
    creating a gap for CST applications that can be bridged post-processing.
