  publish_date: '2015'
  project_name: Forecasting and Characterising Grid Connected Solar Energy and Developing
    Synergies with Wind
  what_happened: Numerical Weather Prediction modelling using TAPM found that a 45
    km spatial resolution produced the lowest RMSE for solar irradiance forecasting,
    and that increasing resolution to finer scales did not improve — and sometimes
    degraded — forecast accuracy.
  lesson_learnt: When configuring NWP models for solar irradiance forecasting, coarser
    resolutions (around 45 km) can outperform finer resolutions; do not assume higher
    spatial resolution improves forecast skill — validate performance across resolution
    settings before operational deployment.
