- record_id: ARENA-DLV-53557
  source_title: Forecasting and Characterising Grid Connected Solar Energy and Developing
    Synergies with Wind - Project results and lessons learnt
  publish_date: '2015'
  project_name: Forecasting and Characterising Grid Connected Solar Energy and Developing
    Synergies with Wind
  what_happened: Analysis of 12 years of satellite-derived irradiance data (1998–2010)
    revealed that northern Australia (particularly northern Queensland) experiences
    longer DNI lulls in summer, while southern Australia experiences longer lulls
    in winter, with western Tasmania, coastal NSW, and parts of Victoria having the
    highest number of consecutive low-DNI days — regions that also have good wind
    resources.
  lesson_learnt: Site suitability assessment for concentrated solar technologies must
    account for the seasonality and geographic pattern of DNI lulls — regions with
    the highest solar lull frequency (coastal NSW, Victoria, western Tasmania) coincide
    with strong wind resources, making these locations candidates for hybrid solar-wind
    deployment to mitigate intermittency risk.
  issue_severity: none
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: concept/feasibility
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar thermal
  source_pages: &id007
  - 6
  - 7
  - 8
  evidence_excerpt: Western Tasmania, coastal NSW and regions of Victoria have a higher
    number of consecutive lulls, but this is also where many of our wind farms are
    located. These locations experience good wind conditions, therefore for synergistic
    deployment of wind and solar, and diversity of our resources we would look for
    locations where wind was optimum in one location and solar optimum in another.
