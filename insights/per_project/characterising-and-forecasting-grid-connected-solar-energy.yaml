  what_happened: Modelling of residential rooftop PV with battery storage for Sydney
    households found that adding storage to PV systems increases the system's financial
    benefit and significantly reduces network peak load, potentially deferring network
    augmentation investment.
  lesson_learnt: When evaluating the value proposition of residential PV, include
    the network peak demand reduction benefit of co-located battery storage — storage's
    ability to shift PV output to coincide with network peaks can defer network augmentation
    costs and should be factored into tariff design and network investment planning.
