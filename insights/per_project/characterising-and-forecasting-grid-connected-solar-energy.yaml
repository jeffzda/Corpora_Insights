- record_id: ARENA-DLV-53554
  source_title: Forecasting and Characterising Grid Connected Solar Energy and Developing
    Synergies with Wind - Project results and lessons learnt
  publish_date: '2015'
  project_name: Forecasting and Characterising Grid Connected Solar Energy and Developing
    Synergies with Wind
  what_happened: The WRF model underestimated the spatial extent of clouds over Victoria,
    New South Wales, and South Australia during a storm event, and increasing spatial
    resolution increased RMSE by 5–13% for GHI and 7% for DNI rather than improving
    accuracy.
  lesson_learnt: WRF's cloud representation limitations mean higher spatial resolution
    does not reliably improve solar irradiance forecast accuracy; practitioners should
    test WRF performance on extreme weather events before relying on it for operational
    solar forecasting, and prefer TAPM for GHI accuracy while using WRF when DNI forecasting
    is required.
