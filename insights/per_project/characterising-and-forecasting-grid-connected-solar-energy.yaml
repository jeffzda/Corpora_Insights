  publish_date: '2015'
  project_name: Forecasting and Characterising Grid Connected Solar Energy and Developing
    Synergies with Wind
  what_happened: The project identified that distributed (rooftop) PV forecasting
    requires a fundamentally different approach from large-scale centralised solar
    farm forecasting, and that the techniques developed in this project require significant
    adaptation before they can be applied to distributed generation forecasting.
  lesson_learnt: Forecasting tools developed for utility-scale solar plants cannot
    be directly transferred to distributed rooftop PV forecasting — projects targeting
    distributed PV integration should treat distributed forecasting as a distinct
    research and development challenge requiring dedicated methodology, not a straightforward
    extension of centralised forecasting.
