  what_happened: Correlation analysis of wind and solar output across the NEM found
    that solar demand correlation was 100% positive (except reduced in winter), while
    wind-demand correlation was only positive on 85% of days, and solar matched demand
    better than wind overall; synergies between wind and PV were found to be site-specific
    rather than uniform across a state.
  lesson_learnt: Solar PV is a better match to electricity demand than wind on most
    days in the NEM; however, wind-solar synergies vary significantly within a state
    and must be assessed at the site level — portfolio planners should not assume
    state-level complementarity and should conduct site-specific correlation analysis
    when designing hybrid systems.
