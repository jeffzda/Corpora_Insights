  publish_date: '2015'
  project_name: Forecasting and Characterising Grid Connected Solar Energy and Developing
    Synergies with Wind
  what_happened: The CARDS (Coupled Auto Regressive and Dynamical System) short-term
    statistical forecasting model was developed and successfully validated on Australian
    and French offshore island data across timescales of ten minutes to one hour,
    outperforming comparable methods in the literature.
  lesson_learnt: Data-driven additive de-seasoning using Fourier series methods —
    rather than standard clear-sky index approaches — produces robust short-term solar
    forecasting models that generalise across diverse climates; this approach should
    be evaluated for adoption in operational Australian solar forecasting schemes
    such as ASEFS.
