  source_title: Vast Solar, Port Augusta Concentrated Solar Power Project - Milestone
    1 Lessons Learnt Report
  publish_date: 2025-02
  project_name: Port Augusta Concentrated Solar Power Project (VS1)
  what_happened: High market demand for HV electrical connection contractors and substation
    components extended the duration from Connection Enquiry to Offer to Connect (5.3.4)
    during the FEED phase. TNSPs also began requiring compensation for preliminary
    cost estimates of contestable scope, and the ability to negotiate competitive
    prices was constrained by market conditions.
  lesson_learnt: Future projects should adopt a conservative schedule assumption for
    the HV connection process from enquiry to Offer to Connect — high market demand
    means the standard timeline is likely to be longer than historical precedent,
    and contestable scope pricing is increasingly non-negotiable.
