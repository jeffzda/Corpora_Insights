- record_id: ARENA-DLV-67102
  source_title: Vast Solar, Port Augusta Concentrated Solar Power Project - Milestone
    1 Lessons Learnt Report
  publish_date: 2025-02
  project_name: Port Augusta Concentrated Solar Power Project (VS1)
  what_happened: During the FEED phase, difficulty was encountered in finding consultants
    experienced in modelling steam turbines, as the market is now dominated by inverter-based
    generation modelling. This led to questions during the model validation phase
    that were not relevant to the project's synchronous-generator electrical design.
  lesson_learnt: Projects using synchronous generation technology (such as CSP with
    steam turbines) should proactively identify and pre-qualify consultants with steam
    turbine and synchronous generator modelling experience before entering FEED, as
    this capability is scarce in a market now dominated by inverter-based modelling.
