- record_id: ARENA-DLV-67103
  source_title: Vast Solar, Port Augusta Concentrated Solar Power Project - Milestone
    1 Lessons Learnt Report
  publish_date: 2025-02
  project_name: Port Augusta Concentrated Solar Power Project (VS1)
  what_happened: Vast split FEED engineering across multiple specialist providers
    across different time zones and managed all integration in-house, leading to interface
    management challenges including poor information transfer, vague contractual responsibility
    at scope boundaries, and reduced effective collaboration hours due to time zone
    differences.
  lesson_learnt: When engineering scope is split across multiple contractors — especially
    across time zones — proponents must explicitly resource the integration and interface
    management function; each contractor boundary is a potential information transfer
    failure and a zone of ambiguous contractual responsibility that requires active
    management.
  issue_severity: moderate
  project_type: generation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: project developer
  delay_category: internal governance/resourcing
  failure_mode: coordination & stakeholders
  outcome_class: delayed but recoverable
  secondary_failure_mode: execution & logistics
  intervention_note: null
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: solar thermal
  source_pages: &id003
  - 6
  - 7
  evidence_excerpt: Future projects must prudently account for the resourcing requirements
    when engineering scope is split as each interface introduces a risk of poor information
    transfer and a contractual boundary where responsibility can be vague. Although
    a small developing business has a lot of enthusiasm in the team, there is the
    reality that there is a quantity of work to get through and manpower is important.
    There is a tendency to underestimate the workload and overestimate the work rate.
