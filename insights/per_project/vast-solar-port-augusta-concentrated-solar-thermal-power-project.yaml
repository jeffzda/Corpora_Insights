- record_id: ARENA-DLV-67105
  source_title: Vast Solar, Port Augusta Concentrated Solar Power Project - Milestone
    1 Lessons Learnt Report
  publish_date: 2025-02
  project_name: Port Augusta Concentrated Solar Power Project (VS1)
  what_happened: Applying a pre-assembled modules (PAM) execution strategy to a CSP
    power plant with international vendors proved challenging because CSP and power
    generation specialists had no experience with modular supply. Vendors lacked contractual
    incentive to optimise constructability, requiring additional review and refinement
    cycles that created contractual tensions.
  lesson_learnt: When adopting a PAM modular construction strategy for a technology
    domain (such as CSP) where modularisation is not standard practice, early contractor
    involvement for constructability and regional construction knowledge transfer
    is essential — vendors without modular supply experience and without construction
    responsibility will not self-optimise for constructability without explicit contractual
    mechanisms.
  issue_severity: major
  project_type: generation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: project developer
  delay_category: construction/installation
  failure_mode: unvalidated integration
  outcome_class: delayed but recoverable
  secondary_failure_mode: coordination & stakeholders
  intervention_note: A formal engagement was made with an experienced Australian construction
    contractor to ensure constructability was considered and incorporated, but it
    proved challenging due to the vendors' lack of contractual incentive.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar thermal
  source_pages: &id005
  - 7
  - 8
  evidence_excerpt: An ongoing challenge is that a large portion of the plant is being
    supplied by vendors that are not responsible for the construction. They have limited
    contractual incentive to work to optimise the constructability. This becomes especially
    challenging when they are less experienced with modular supply, requiring alterations
    to their typical design and procurement processes. This resulted in additional
    review and refinement cycles, ultimately becoming contractual tensions.
  confidence_note: issue_severity set to major given explicit contractual tensions
    and multiple additional review cycles described as ongoing.
