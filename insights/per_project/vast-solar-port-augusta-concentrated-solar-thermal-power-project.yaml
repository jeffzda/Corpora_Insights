- record_id: ARENA-DLV-67106
  source_title: Vast Solar, Port Augusta Concentrated Solar Power Project - Milestone
    1 Lessons Learnt Report
  publish_date: 2025-02
  project_name: Port Augusta Concentrated Solar Power Project (VS1)
  what_happened: Securing investment for VS1 was substantially complicated by widespread
    lack of familiarity with CSP technology across Australian engineering, market
    modelling, and financial consultancies. CSP is not yet integrated into standard
    energy market modelling tools such as PLEXOS, requiring Vast to invest consistent
    and significant effort educating investors and ensuring accurate plant modelling
    by both investors and due diligence consultancies.
  lesson_learnt: Future CSP projects — and FOAK projects in novel technology classes
    more broadly — must not underestimate the effort required to build investor and
    consultant familiarity with the technology; developing a robust in-house production
    model that can be shared with investors and consultancies is critical to bridging
    the knowledge gap and accelerating investment confidence.
  issue_severity: major
  project_type: generation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: financing/commercial close
  failure_mode: coordination & stakeholders
  outcome_class: delayed but recoverable
  secondary_failure_mode: commercial & market
  intervention_note: Vast developed a robust in-house plant production model capable
    of end-to-end CSP asset modelling, including hybrid configurations, which was
    used to familiarise investors and due diligence consultancies with the technology's
    commercialisation pathway.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar thermal
  source_pages: &id006
  - 9
  evidence_excerpt: This overarching unfamiliarity with CSP resulted in consistent
    and significant effort on Vast's behalf to familiarise investors and to ensure
    accurate modelling of the plant by both investors and the consultancies contracted
    to conduct due diligence on the project. It is critical that future projects do
    not underestimate the extent of effort required to gain the confidence of project
    participants.
  confidence_note: transferability set to moderate rather than broad because the specific
    barrier (novel asset class absent from standard modelling tools) is most relevant
    to FOAK technology deployments.
