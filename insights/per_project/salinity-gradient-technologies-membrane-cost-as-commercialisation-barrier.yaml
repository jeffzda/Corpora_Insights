- record_id: ARENA-DLV-50014
  source_title: Ocean Energy Report by Seanergy and Ernst and Young
  publish_date: 2016-06
  project_name: Salinity Gradient Technologies — Membrane Cost as Commercialisation
    Barrier
  what_happened: Salinity gradient energy technologies (both PRO and RED) remained
    at R&D stage as of 2016, with membrane costs representing 50–80% of total capital
    costs. IRENA assessed that membrane prices needed to fall to EUR 2–5/m² from EUR
    10–30/m² to achieve competitiveness with other renewables.
  lesson_learnt: Salinity gradient energy projects should not be progressed beyond
    R&D stage until membrane cost reductions to at least EUR 5/m² are demonstrated
    by suppliers; the cost of this single component dominates project economics and
    makes commercial deployment currently unviable regardless of other design optimisations.
