  lesson_learnt: Early and active stakeholder collaboration — including with network operators, regulators, government bodies and technology suppliers — is a demonstrable success factor for LSBS projects
    delivered on tight schedules; project teams should establish clear communication protocols and dedicated liaison roles with key parties from project inception.
