- record_id: ARENA-DLV-18755
  source_title: A Double-Sided Causer Pays Implementation of Frequency Deviation Pricing
    – Analysis Report
  publish_date: 2022-02
  project_name: Double-Sided Causer Pays Implementation of Frequency Deviation Pricing
  what_happened: 'Communication outages within DSCP settlement create an incentive
    problem: a unit with missing data during a high-price frequency event avoids its
    share of costs, which would otherwise be correctly allocated to it. The existing
    SCADA reliability standard allows up to 6 hours of outage per 12-month rolling
    period, creating windows where cost allocation can be gamed or distorted.'
  lesson_learnt: Market settlement mechanisms dependent on real-time telemetry must
    include an explicit default treatment for units with missing data — treating non-reporting
    units as part of the residual (a net cost position) creates a self-correcting
    incentive to maintain reliable communications and avoids cost-shifting to compliant
    participants during high-price events.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: no material delay stated
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated integration
  intervention_note: The report recommended treating units with missing or poor-quality
    data as part of the residual for affected dispatch intervals, allocating costs
    pro-rata by metered energy, which creates a direct financial incentive to invest
    in redundant communication infrastructure.
  transferability: moderate
  delay_magnitude: null
  technology_domain: grid/system stability
  source_pages: &id003
  - 30
  - 31
  - 37
  - 38
  evidence_excerpt: If during a high frequency event, a unit with large excess MW
    deviations (which is making the supply-demand balance worse) would be liable for
    higher share of the costs. If there was an outage the unit would benefit in the
    absence of an alternative mechanism to allocate costs... As the residual is defined
    as load or generation without metering, including a unit with missing data in
    the residual seems to be the logical approach.
  confidence_note: null
