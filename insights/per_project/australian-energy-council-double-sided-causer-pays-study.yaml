  what_happened: The mandatory PFR rule achieved frequency performance improvements
    primarily through large thermal plant (Tranche 1, DUIDs > 200 MW), which accounts
    for approximately 35.6 GW. As thermal generation is expected to exit the market
    over the next decade or two, the frequency control capability underpinning current
    NEM performance will progressively erode unless replaced by alternative resources.
  lesson_learnt: Market design for ancillary services must account for the retirement
    trajectory of incumbent technology — a mandatory rule that achieves compliance
    primarily through assets being phased out does not provide durable frequency security,
    and transitional market mechanisms should be developed and tested well before
    thermal retirement occurs at scale.
