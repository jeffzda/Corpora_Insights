- record_id: ARENA-DLV-18753
  source_title: A Double-Sided Causer Pays Implementation of Frequency Deviation Pricing
    – Analysis Report
  publish_date: 2022-02
  project_name: Double-Sided Causer Pays Implementation of Frequency Deviation Pricing
  what_happened: Analysis of SCADA metering for use in DSCP settlement found that
    transmission delays of up to 6 seconds permitted under AEMO's SCADA standard introduce
    underestimation errors of up to approximately 5% in PFR performance factors, with
    the raw 4-second frequency metric significantly more sensitive to these delays
    than the lagged 35-second or FI metrics used for existing Causer Pays.
  lesson_learnt: Any new market settlement mechanism built on SCADA data should be
    designed and stress-tested against the full permissible delay range in AEMO's
    data communication standard before deployment — PFR-specific settlement logic
    is materially more sensitive to SCADA transmission delays than the existing regulation
    Causer Pays procedure, requiring either tighter delay standards or smoothed metrics
    at the design stage.
