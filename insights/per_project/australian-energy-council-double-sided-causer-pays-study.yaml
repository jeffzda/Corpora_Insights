  source_title: A Double-Sided Causer Pays Implementation of Frequency Deviation Pricing
    – Analysis Report
  publish_date: 2022-02
  project_name: Double-Sided Causer Pays Implementation of Frequency Deviation Pricing
  what_happened: Approximately 20 GW of non-AGC-regulated generation showed no measurable
    improvement in Primary Frequency Response performance following the mandatory
    PFR rule change, exceeding the combined Tranche 2 and Tranche 3 capacity totals.
    This cohort lacked either the firmware updates or the spare capacity headroom
    needed to modulate output for PFR.
  lesson_learnt: When designing mandatory frequency response obligations for inverter-based
    and variable renewable generators, verify that participating plant has both the
    control system capability (updated firmware) and sufficient operational headroom
    to deliver the required response — capability without headroom, or headroom without
    capability, yields no frequency control benefit.
