  source_title: A Double-Sided Causer Pays Implementation of Frequency Deviation Pricing
    – Analysis Report
  publish_date: 2022-02
  project_name: Double-Sided Causer Pays Implementation of Frequency Deviation Pricing
  what_happened: General-purpose high-resolution power quality meters available on
    the market cannot be used directly for DSCP settlement because they are not designed
    to calculate and accumulate the required frequency-deviation factors internally,
    and uploading raw high-resolution data (e.g. 50 ms intervals) to AEMO for central
    processing would be impractical due to data volume and storage requirements.
  lesson_learnt: When designing settlements that require high-frequency metering data,
    specify in-meter calculation and accumulation of settlement-ready values (e.g.
    5-minute aggregates) rather than central processing of raw high-resolution data
    — this keeps data transmission volumes manageable and allows the meter to operate
    with the same robustness as a standard revenue meter.
