  source_title: A Double-Sided Causer Pays Implementation of Frequency Deviation Pricing
    – Analysis Report
  publish_date: 2022-02
  project_name: Double-Sided Causer Pays Implementation of Frequency Deviation Pricing
  what_happened: The mandatory Primary Frequency Response (PFR) rule (AEMC Rule 2020
    No. 5, effective 4 June 2020) significantly improved NEM frequency performance,
    but as of mid-2021 only approximately 66% of in-scope generation capacity (38.4
    GW of 58.1 GW) had implemented the required settings. Tranche 2 and Tranche 3
    compliance rates were only 37% and 36% respectively against their scheduled targets.
  lesson_learnt: Mandatory rule changes requiring firmware or inverter control updates
    from OEMs should include lead-time assessments and OEM readiness checks before
    setting compliance deadlines — delayed OEM firmware delivery was the primary cause
    of the implementation shortfall across approximately 20 GW of inverter-based generation.
