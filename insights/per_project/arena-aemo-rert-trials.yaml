- record_id: ARENA-DLV-50552
  source_title: DEIP Market Integration Trials Summary Report 1.0
  publish_date: 2022-09
  project_name: ARENA-AEMO RERT Trials
  what_happened: The baselines used to measure changes in demand in the RERT trial
    were not suitable for sites with variable demand or generation, including sites
    with day-to-day operational variation, solar output, or temperature-sensitive
    loads.
  lesson_learnt: When designing demand response trials at sites with solar generation
    or variable loads, ensure baseline measurement methodologies are validated for
    variable generation profiles before deployment — standard baselines will produce
    unreliable performance measurements and undermine market participation outcomes.
