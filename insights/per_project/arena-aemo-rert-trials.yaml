- record_id: ARENA-DLV-50551
  source_title: DEIP Market Integration Trials Summary Report 1.0
  publish_date: 2022-09
  project_name: ARENA-AEMO RERT Trials
  what_happened: The ARENA-AEMO RERT Trials tested demand response participation in
    the RERT market across residential, commercial and industrial consumers. Residential
    participation was skewed towards behavioural demand response because consumers
    preferred retaining control over their energy use, while C&I consumers preferred
    automated load control. Market participants also reported issues with control
    technologies leading to higher costs and poorer quality of control.
  lesson_learnt: Design RERT demand response programs with distinct participation
    models for residential versus C&I consumers — residential consumers require behavioural
    program designs that preserve consumer control, while C&I consumers benefit from
    automated load control. Standardisation and maturity of DER monitoring and control
    technology are key to resolving cost and performance issues.
