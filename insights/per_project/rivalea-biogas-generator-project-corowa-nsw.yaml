- record_id: ARENA-DLV-59203
  source_title: Biogas Opportunities for Australia
  publish_date: 2019-03
  project_name: Rivalea Biogas Generator Project, Corowa, NSW
  what_happened: Evo Energy commissioned a 500 kW combined heat and power biogas unit for Rivalea Australia's Corowa piggery in 2017, capturing biogas from a covered anaerobic lagoon. The system supplies
    approximately 25 per cent of the site's power demand and is estimated to avoid 28,000 tonnes of CO2e per year.
  lesson_learnt: On-farm covered anaerobic lagoon systems with CHP can deliver material energy cost savings (covering ~25% of site power demand) and significant emissions abatement for large piggeries —
    agricultural operators should treat a prior successful lagoon installation at another site as a proof point to justify scaling up to CHP integration.
