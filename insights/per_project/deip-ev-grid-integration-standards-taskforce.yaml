- record_id: ARENA-DLV-9149
  source_title: State of DER Technology Integration Report
  publish_date: 2021-02
  project_name: DEIP EV Grid Integration Standards Taskforce
  what_happened: The DEIP EV Grid Integration Standards Taskforce identified notable
    standards gaps for EV grid integration including charger performance and capability,
    interoperability and cyber security. The absence of comprehensive EV grid integration
    standards was found to increase the risk of an inefficient transition to electrified
    transportation, potentially leading to additional costs and reduced EV uptake.
    Standards work for EVs was at very initial stages as of mid-2020.
  lesson_learnt: EV grid integration standards development must be initiated well
    ahead of significant EV deployment — the multi-year pipeline from standards gap
    identification to mandatory compliance means that standards activity started at
    trial stage will not produce mandatory requirements until after significant EV
    infrastructure has already been installed without the protections the standards
    are designed to provide.
