- record_id: ARENA-DLV-72024
  source_title: Australian Energy Resource Assessment – Second edition, 2014
  publish_date: '2014'
  project_name: Australian Solar PV Market (Feed-in Tariff Programs)
  what_happened: Rapid PV uptake drove state governments to close most feed-in tariff
    programs to new applicants between 2011 and 2012, replacing generous tariffs with
    nominal wholesale-linked payments and reducing federal incentives via the RET
    mechanism. Individual state schemes closed at different times — Victoria's Premium
    Feed-in Tariff closed September 2011, South Australia's was cut from A$0.44/kWh
    to A$0.16/kWh, the ACT scheme reached its 15 MW cap by July 2011, NSW closed April
    2011, and Western Australia reduced and closed its scheme by August 2011.
  lesson_learnt: Feed-in tariff programs calibrated without firm capacity caps or
    demand-response pricing can be overwhelmed by uptake faster than anticipated,
    forcing abrupt programme closures that create boom-bust investment cycles; future
    support mechanisms should include clear capacity limits and scheduled step-down
    provisions to manage orderly market transitions.
