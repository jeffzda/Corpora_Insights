- record_id: ARENA-DLV-4764
  source_title: Insights From The Portfolio of Projects Funded Under The Regional Australia's Renewables Program
  publish_date: 2017-03
  project_name: DeGrussa Solar and Battery Project
  what_happened: The DeGrussa off-grid mine project achieved a high renewable energy fraction through the combination of 10.56 MWp solar PV with 1-axis tracking and a 6 MW / 1.81 MWh battery storage system
    — demonstrating that battery storage was a necessary enabler for high renewable fractions at mine sites.
  lesson_learnt: Battery storage is a critical enabling technology for achieving high renewable energy fractions at off-grid mine sites — solar PV alone is insufficient without storage to manage variability,
    and mine operators targeting high renewable fractions should plan for co-located battery systems from the outset.
