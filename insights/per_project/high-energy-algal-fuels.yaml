  what_happened: Australia discharges 75% of its 4.3 × 10⁶ m³/day of municipal wastewater
    into the environment; this volume was identified as a nationally scalable, nutrient-rich
    water resource to support freshwater macroalgal cultivation at a scale compatible
    with commercial biofuel production.
  lesson_learnt: National-scale deployment of freshwater macroalgal biofuel production
    should be sited at or adjacent to municipal wastewater treatment plants — the
    volume and nutrient content of Australia's wastewater discharge is sufficient
    to sustain large-scale commercial production without competing for freshwater
    resources.
