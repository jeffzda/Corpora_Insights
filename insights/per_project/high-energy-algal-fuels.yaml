- record_id: ARENA-DLV-41456
  source_title: High-Energy Algal Fuels Project
  publish_date: null
  project_name: High-Energy Algal Fuels Project (HEAF)
  what_happened: Pre-harvest nitrogen starvation improved biocrude quality by reducing
    heteroatom (nitrogen and sulphur) content but reduced biomass productivity; the
    trade-off was least costly for Oedogonium, which retained the highest biocrude
    quality with the smallest productivity loss, leading to its selection for scale-up.
  lesson_learnt: When applying pre-harvest nitrogen starvation to improve biocrude
    quality, evaluate species-specific productivity trade-offs before committing to
    scale-up — Oedogonium minimises productivity loss while achieving the greatest
    improvement in biocrude quality and is the preferred candidate for freshwater
    systems.
  issue_severity: minor
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Oedogonium was selected for scale-up on the basis of the best
    productivity-quality trade-off, and biomass was produced at 40 kg dry weight for
    pilot-scale biocrude production and refining.
  transferability: narrow
  delay_magnitude: null
  technology_domain: bioenergy
  source_pages: &id006
