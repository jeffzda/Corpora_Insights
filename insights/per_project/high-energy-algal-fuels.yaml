  source_title: High-Energy Algal Fuels Project
  publish_date: null
  project_name: High-Energy Algal Fuels Project (HEAF)
  what_happened: Across six species of macroalgae, biomass productivity varied far
    more widely between species than biocrude yield, making species selection — not
    conversion efficiency — the dominant determinant of overall biocrude productivity.
  lesson_learnt: Prioritise upstream species selection based on biomass productivity
    rather than optimising the HTL conversion process first — variance in biomass
    productivity between species dwarfs variance in biocrude yield and is therefore
    the primary lever for improving fuel output per unit area.
