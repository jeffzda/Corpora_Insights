  project_name: High-Energy Algal Fuels Project (HEAF)
  what_happened: At Tarong Power Station, Oedogonium biomass containing sequestered
    heavy metals (including Al, As, Cd, Cr, Cu, Ni, Se, Zn) was found unsuitable for
    food-chain applications but was demonstrated to be a suitable feedstock for biochar
    production via slow pyrolysis at 750°C, which immobilised metals in the biochar's
    macromolecular structure for use as a soil ameliorant.
  lesson_learnt: When cultivating macroalgae in metal-contaminated industrial wastewaters,
    plan for biochar production as the end-use pathway from project design — biomass
    will be excluded from food and feed markets, and slow pyrolysis at 750°C provides
    a proven route to a safe, value-adding product while also immobilising heavy metals.
