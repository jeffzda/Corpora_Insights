- record_id: ARENA-DLV-41457
  source_title: High-Energy Algal Fuels Project
  publish_date: null
  project_name: High-Energy Algal Fuels Project (HEAF)
  what_happened: Post-harvest washing of biomass reduced ash (salt) content, increasing
    biocrude yield as a proportion of dry weight, while also reducing corrosion risk
    and catalyst interference in the HTL process, without affecting ash-free dry weight
    yield or biocrude quality.
  lesson_learnt: Include a post-harvest washing step in biomass processing protocols
    before HTL — it reduces ash content, protects HTL reactor equipment from corrosion,
    and improves catalyst longevity without compromising yield on an organic-matter
    basis.
