- record_id: ARENA-DLV-41453
  source_title: High-Energy Algal Fuels Project
  publish_date: null
  project_name: High-Energy Algal Fuels Project (HEAF)
  what_happened: Integration of algal biomass production with municipal wastewater
    treatment — charging $360/ML for water treatment, roughly half the cost of existing
    municipal treatment facilities — converted the enterprise from a negative NPV
    to a positive NPV with a payback period under 5 years.
  lesson_learnt: Price the bioremediation service as a genuine revenue stream from
    project inception; charging for wastewater treatment at a competitive rate relative
    to conventional treatment is the pivotal factor that tips algal biofuel projects
    from financially unviable to commercially attractive.
