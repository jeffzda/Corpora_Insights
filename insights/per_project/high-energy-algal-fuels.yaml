- record_id: ARENA-DLV-41451
  source_title: High-Energy Algal Fuels Project
  publish_date: null
  project_name: High-Energy Algal Fuels Project (HEAF)
  what_happened: Standalone production of renewable fuels from algae cultivated in
    land-based systems in Australia was found to be economically unviable at present
    or in the near future, with combined production and processing costs of $544 per
    tonne of algae against a combined product value of $378 per tonne, yielding a
    negative NPV over 10 years even when co-products provided more than 70% of revenue.
  lesson_learnt: Do not design algal biofuel projects as standalone fuel-production
    enterprises — economic viability requires integration with wastewater treatment
    services and co-product revenue streams; biocrude alone cannot carry the business
    case at current or near-future oil prices.
  issue_severity: major
