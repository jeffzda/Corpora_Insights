  project_name: High-Energy Algal Fuels Project (HEAF)
  what_happened: The carbon content of macroalgal biomass was found to be a strong
    predictor of biocrude yield (R²=0.96, linear relationship within 30–50% carbon
    range), enabling rapid screening of candidate species without full HTL trials.
  lesson_learnt: Use proximate carbon content analysis as a rapid initial screen for
    new macroalgal species under consideration for biofuel production — it reliably
    predicts biocrude yield and can eliminate low-potential species before costly
    cultivation and HTL trials are conducted.
