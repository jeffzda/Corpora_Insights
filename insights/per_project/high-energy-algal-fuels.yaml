- record_id: ARENA-DLV-41452
  source_title: High-Energy Algal Fuels Project
  publish_date: null
  project_name: High-Energy Algal Fuels Project (HEAF)
  what_happened: The techno-economic model showed that at a base biocrude value of
    $324/tonne (equivalent to $50/barrel WTI crude), more than 70% of enterprise revenue
    came from high-value products and protein for animal feed, yet the NPV remained
    negative; only at $1,263/tonne of biocrude ($200/barrel) would fuel revenue alone
    produce a positive NPV.
  lesson_learnt: Algal biofuel project economics must not be modelled on fuel revenue
    alone — co-product pricing and wastewater service fees must be built into the
    financial model from the outset, as fuel revenue cannot justify investment at
    any plausible near-term oil price.
