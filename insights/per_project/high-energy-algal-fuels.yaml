- record_id: ARENA-DLV-41472
  source_title: High-Energy Algal Fuels Project
  publish_date: null
  project_name: High-Energy Algal Fuels Project (HEAF)
  what_happened: The integrated value chain — combining co-products (protein, ulvans,
    lipids), biocrude, biochar, and bioremediation services — was modelled to deliver
    the broadest product suite and highest value from Oedogonium biomass, with co-products
    rather than fuel contributing the majority of economic value.
  lesson_hurnt: Design algal biofuel projects around a full biorefinery value chain
    where fuel is one output among several — the economics of any single product (including
    biocrude) are insufficient to justify investment, but a diversified product portfolio
    including high-value co-products and service revenues creates the commercial resilience
    needed for viability.
  lesson_learnt: Design algal biofuel projects around a full biorefinery value chain
