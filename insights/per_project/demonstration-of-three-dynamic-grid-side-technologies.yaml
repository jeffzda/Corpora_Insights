  source_title: Jemena DER Hosting Capacity Project Final Report
  publish_date: 2021-09
  project_name: Jemena DER Hosting Capacity Project (Solar Friendly Neighbourhoods)
  what_happened: There was initial concern that LoRa antennas mounted internally inside
    closed steel PSD enclosures would deliver unreliable communications; at the AusNet
    Services site communications were 100% reliable, but at the Jemena site one PSD
    location could not achieve LoRa connectivity and several others experienced intermittent
    dropouts.
  lesson_learnt: Do not assume that internally-mounted antennas in closed steel enclosures
    will provide reliable LoRa communications across all sites — conduct site-specific
    RF assessments and test communications before finalising installation, as local
    conditions can cause failures even at short distances.
