  evidence_excerpt: Controlling PCD for power factor control purposes have both advantage
    and disadvantage. The advantage is that most DT capacity could be used to transfer
    active power, while the disadvantage is that it could exacerbate the over/under-voltage
    issue. For example, when the network is exporting active power while importing
    reactive power via the DT, PCD working at power factor operational mode will increase
    voltage rise in the DT, leading to higher voltage levels in the network.
