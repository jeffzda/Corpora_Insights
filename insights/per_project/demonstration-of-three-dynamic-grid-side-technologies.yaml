- record_id: ARENA-DLV-9701
  source_title: DER Hosting Capacity Project Interim Knowledge Sharing Report
  publish_date: 2020-08
  project_name: Jemena DER Hosting Capacity Project
  what_happened: The PCD and PSDs are commercially available and have been deployed
    successfully on low voltage networks overseas, but being relatively new to the
    Australian market presented significant challenges including the need to work
    closely with the vendor to design a simplified control algorithm that built on
    existing equipment capabilities rather than implementing full complexity from
    the outset.
  lesson_learnt: When deploying overseas equipment new to the Australian market, start
    with a simple control algorithm that builds on existing equipment capabilities
    and grow complexity only after core functionality has been tested in the field
    — attempting full complexity from the start risks delivery failure with unfamiliar
    vendors.
