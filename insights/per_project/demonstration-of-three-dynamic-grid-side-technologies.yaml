  project_name: Jemena DER Hosting Capacity Project (Solar Friendly Neighbourhoods)
  what_happened: PSD switching was assigned only to customers without solar PV to
    prevent phase switching from directly impacting solar inverter operation, and
    a day-ahead switching strategy at 2 a.m. was adopted to minimise impact on customers
    by switching when fewest appliances are active.
  lesson_learnt: When deploying dynamic phase switching devices in mixed PV/non-PV
    residential feeders, restrict switching to non-PV customer connection points and
    schedule the primary switching cycle for low-appliance-use periods (e.g. 2 a.m.)
    — this protects solar inverter continuity and minimises disturbance to residents
    while still achieving the bulk of the daily optimisation.
