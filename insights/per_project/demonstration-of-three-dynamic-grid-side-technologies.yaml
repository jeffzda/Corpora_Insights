- record_id: ARENA-DLV-69653
  source_title: Jemena DER Hosting Capacity Project Final Report
  publish_date: 2021-09
  project_name: Jemena DER Hosting Capacity Project (Solar Friendly Neighbourhoods)
  what_happened: Jemena chose to integrate the Central Controller (CC) with its SCADA
    system using DNP3.0 protocol, which required significantly more effort to test
    interoperability and limited the ability to conduct remote testing during COVID
    lockdowns, resulting in less data collected compared to AusNet Services.
  lesson_learnt: SCADA integration of novel field devices adds interoperability testing
    overhead and can constrain remote testing capability during site access restrictions
    — for demonstration projects, consider whether vendor-supplied standalone remote
    monitoring (as used by AusNet Services) offers a more practical option during
    the trial phase before SCADA integration is pursued.
  issue_severity: moderate
  project_type: network/grid
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: network business
  delay_category: commissioning/integration
  failure_mode: unvalidated integration
  outcome_class: delayed but recoverable
  secondary_failure_mode: data & measurement
  intervention_note: Jemena worked through interoperability testing of the DNP3.0
    SCADA protocol with its master station; AusNet Services avoided this burden by
    using the vendor-supplied standalone system.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: DER
  source_pages:
  - 23
  - 24
  - 25
  - 31
  evidence_excerpt: The approach taken by Jemena did result in significantly more
    effort to test the interoperability of the SCADA protocol (DNP3.0) with its master
    station... Jemena's choice of interfacing the CC to its SCADA system has limited
    its ability to conduct remote testing. Site testing was impacted by COVID lockdown
    restriction. AST, on the other hand, could continue to perform remote testing
    from its master station setup. Consequently, Jemena's post-commissioning testing
    was conducted over a longer period of time, and captured less data compared with
    AST.
