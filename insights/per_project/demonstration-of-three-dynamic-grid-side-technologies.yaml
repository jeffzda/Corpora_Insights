  source_title: DER Hosting Capacity Project Interim Knowledge Sharing Report
  publish_date: 2020-08
  project_name: Jemena DER Hosting Capacity Project
  what_happened: To minimise the risk of outage delays during actual field installation
    of novel equipment on live customer networks, the project team conducted trial
    installations at their respective depots prior to the actual installation date,
    allowing field crews to familiarise themselves with the new equipment and non-standard
    mounting requirements.
  lesson_learnt: For novel equipment installations on live distribution networks,
    conduct a full trial installation at a depot before the scheduled outage date
    — this allows field crews to work through unfamiliar mounting and connection procedures
    in a low-risk environment, reducing the likelihood of overrunning outage windows.
