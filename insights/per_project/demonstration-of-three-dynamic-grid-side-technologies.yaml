  project_name: Jemena DER Hosting Capacity Project (Solar Friendly Neighbourhoods)
  what_happened: Mass adoption of LV phase switching and compensation technologies
    faces a barrier from the difficulty of acquiring accurate LV network data (phase
    positions, topology, line impedances) for networks outside the trial sites, where
    such information may be unavailable or require novel estimation methods.
  lesson_learnt: Scaling DER hosting capacity technologies beyond trial sites requires
    a systematic strategy for LV network data collection or inference — without accurate
    phase connectivity, topology and impedance data, the placement and control optimisation
    that underpins technology effectiveness cannot be performed; DNSPs planning broader
    deployment should invest in LV data acquisition as a prerequisite.
