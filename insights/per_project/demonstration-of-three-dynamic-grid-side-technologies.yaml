  project_name: Jemena DER Hosting Capacity Project
  what_happened: Bench testing of 30 appliances confirmed that most common household
    appliances operate normally during phase switching, but negative sequence switching
    caused observable adverse effects on motor-based appliances; these findings were
    incorporated into the PSD control logic before field deployment.
  lesson_learnt: Conduct laboratory bench testing of phase switching effects on a
    representative range of household appliances before deploying phase switching
    devices in the field — the results directly inform control logic design and can
    prevent customer complaints or equipment damage.
