- record_id: ARENA-DLV-69660
  source_title: Jemena DER Hosting Capacity Project Final Report
  publish_date: 2021-09
  project_name: Jemena DER Hosting Capacity Project (Solar Friendly Neighbourhoods)
  what_happened: Bench testing of the PSD at UNSW revealed that negative sequence
    phase switching caused heavy vibration in motor-based appliances (e.g. pool pumps),
    while positive sequence switching had minimal impact; this finding led to a modification
    of the device's switching logic by the supplier before field deployment.
  lesson_learnt: Conduct appliance bench testing before deploying dynamic phase switching
    devices in residential networks — negative sequence switching caused heavy motor
    vibration and required a supplier firmware modification; without bench testing
    this defect would have been discovered in service, potentially generating customer
    complaints or equipment damage claims.
  issue_severity: moderate
  project_type: network/grid
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: network business
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Bench testing results were fed back to the device supplier who
    modified the switching logic to use consecutive positive sequence switching instead
    of direct negative sequence switching; the revised logic was incorporated into
    the field deployment.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: DER
  source_pages:
  - 17
  - 18
  - 19
  - 25
  - 26
  evidence_excerpt: the negative sequence switching (red to blue to yellow) had significant
    impacts on the pool pump running operation, which led to heavy vibrations compared
    to its normal operating condition... It was suggested to apply consecutive positive
    sequence switching to replace the direct negative sequence switching. Feedback
    to device supplier resulted in a modification to the device switching logic.
