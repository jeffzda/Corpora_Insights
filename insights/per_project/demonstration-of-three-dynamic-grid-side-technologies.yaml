- record_id: ARENA-DLV-69673
  source_title: Jemena DER Hosting Capacity Project Final Report
  publish_date: 2021-09
  project_name: Jemena DER Hosting Capacity Project (Solar Friendly Neighbourhoods)
  what_happened: 'The three grid-side technologies (PSD, PCD, BESS) were all successfully
    deployed and demonstrated increased DER hosting capacity: PSD optimisation alone
    increased capacity by 58.87% at the AusNet Services network, and combined PSD+PCD
    increased it to 87.75%; at the Jemena network the combined PSD+PCD+BESS achieved
    a 36.27% increase.'
  lesson_learnt: Combining dynamic phase switching (PSD) with power compensation (PCD)
    delivers substantially greater DER hosting capacity increases than either technology
    alone — the combination addresses both over-voltage and reverse power flow constraints
    simultaneously, making it the recommended baseline configuration for LV networks
    with high PV penetration.
