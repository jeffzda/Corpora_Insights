  source_title: Jemena DER Hosting Capacity Project Final Report
  publish_date: 2021-09
  project_name: Jemena DER Hosting Capacity Project (Solar Friendly Neighbourhoods)
  what_happened: The BESS control strategy in the Jemena network was based on the
    sum of three-phase reverse power flow rather than single-phase reverse power flow,
    meaning that single-phase reverse power flow limit violations could occur even
    when the three-phase aggregate was within limits, reducing the effectiveness of
    BESS control.
  lesson_learnt: Design BESS reverse power flow control strategies using single-phase
    limits rather than three-phase aggregate limits in unbalanced LV networks — the
    three-phase control approach allowed per-phase violations to occur undetected,
    and simulations confirmed the single-phase control strategy delivers better outcomes.
