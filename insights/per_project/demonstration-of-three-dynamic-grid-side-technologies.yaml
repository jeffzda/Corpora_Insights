  what_happened: The cost-benefit analysis quantified benefits only from feed-in tariff
    revenue on additional exported solar generation, excluding benefits from avoided
    grid energy imports, wholesale market services, FCAS, and network deferral value;
    this conservative benefit scope contributed to negative NPV outcomes across all
    scenarios.
  lesson_learnt: Future economic assessments of DER hosting capacity technologies
    should quantify the full value stack — including wholesale market services, FCAS
    ancillary services, network deferral value, and behind-the-meter energy offset
    — as the feed-in tariff revenue alone materially understates the potential business
    case, particularly for BESS-inclusive configurations.
