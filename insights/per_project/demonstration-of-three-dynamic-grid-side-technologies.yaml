  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Simulations confirmed that PCD at complex mode or active power
    balancing mode delivered better over-voltage outcomes; power factor mode is recommended
    only when reactive power levels are low and over-voltage is not a primary constraint.
