  what_happened: Network impedance data for the unbalanced LV distribution network
    was not available from standard sources and had to be calculated from first principles
    using Carson's Equations and site physical parameters; validated models were then
    compared against historical smart meter data before being used for placement optimisation.
  lesson_learnt: LV network modelling for DER integration projects requires impedance
    calculation from first principles when standard network data is unavailable —
    projects should budget for this effort and validate results against smart meter
    historical data before using models to optimise device placement; this data gap
    will be a barrier to mass adoption of similar technologies on networks without
    complete LV records.
