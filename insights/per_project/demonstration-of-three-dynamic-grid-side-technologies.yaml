  source_title: Jemena DER Hosting Capacity Project Final Report
  publish_date: 2021-09
  project_name: Jemena DER Hosting Capacity Project (Solar Friendly Neighbourhoods)
  what_happened: PCD power factor control mode was found to potentially exacerbate
    over/under-voltage issues in networks exporting active power while importing reactive
    power, because it increases voltage rise at the distribution transformer — this
    disadvantage did not materialise significantly at the AusNet Services site (low
    reactive power) but was observed in simulations for the Jemena network.
  lesson_learnt: Avoid using PCD in power factor control mode as the primary voltage
    management strategy in networks with significant reverse active power flow — in
    such networks, power factor control increases voltage rise and can worsen over-voltage
    conditions; active power balancing mode or complex mode is more appropriate and
    should be the default operational setting.
