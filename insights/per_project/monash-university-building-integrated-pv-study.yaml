  what_happened: Replicating integrated glass unit (IGU) construction at laboratory
    scale proved difficult because commercial partner equipment could not be used
    on small-scale devices, requiring alternate encapsulation methods that did not
    match the performance of industry-standard IGUs.
  lesson_learnt: Identify or develop a small-scale prototyping pathway that replicates
    the encapsulation properties of commercial IGUs early in the project — the gap
    between lab-scale encapsulation and commercial IGU performance slows technology
    development and makes it harder to validate real-world device lifetime.
