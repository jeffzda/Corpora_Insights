  source_title: Monash University Building Integrated PV Study Public Dissemination
    Report
  publish_date: 2021-10
  project_name: Developing a New Type of High Efficiency Building Integrated PV Cell
    (2017/RND013)
  what_happened: Perovskite precursor solution aging was found to affect device performance,
    creating a potential consistency risk for commercial manufacturing where solutions
    may be prepared off-site or in advance.
  lesson_learnt: Perovskite precursor solutions should be synthesised as close to
    the point of deposition as possible — onsite preparation is preferred over third-party
    synthesis to maintain consistency and avoid performance variability from solution
    aging.
