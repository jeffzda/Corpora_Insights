  publish_date: 2021-10
  project_name: Developing a New Type of High Efficiency Building Integrated PV Cell
    (2017/RND013)
  what_happened: No industry-wide standard exists for how to design and integrate
    a BIPV window into the electrical system of an existing or new building, creating
    a barrier to broad deployment and a risk for installers working without a defined
    framework.
  lesson_learnt: The absence of an industry-wide BIPV electrical integration standard
    is a deployment blocker — projects in this space should engage with standards
    bodies early to drive standardisation, as this is a prerequisite for widespread
    adoption and installer confidence.
