- record_id: ARENA-DLV-29651
  source_title: Monash University Building Integrated PV Study Public Dissemination
    Report
  publish_date: 2021-10
  project_name: Developing a New Type of High Efficiency Building Integrated PV Cell
    (2017/RND013)
  what_happened: The project demonstrated perovskite-based semi-transparent solar
    cells at laboratory scale, achieving world-record efficiencies across a range
    of average visible transmittance (AVT) values, but device lifetimes remained far
    short of the 30–40 year operational requirements for building-integrated applications.
  lesson_learnt: BIPV applications impose far more stringent lifetime requirements
    than conventional solar — perovskite devices must demonstrate 30–40 year durability
    before commercial deployment is feasible, requiring further composition engineering
    and industry-compatible IGU encapsulation beyond what lab-scale prototyping can
    deliver.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: Replaced organic cation components with all-inorganic analogues
    and substituted the Spiro-OMeTAD charge transport layer with VNPB to reduce water
    vapour transmission, significantly improving device stability.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id001
  - 1
  - 4
  evidence_excerpt: Building integrated applications place the most stringent requirements
    on PV technologies, particularly in terms of operational lifetime and aesthetic
    appeal. While this project used organic-cation-free perovskite formulations to
    fabricate ST-PeSCs with greatly improved lifetimes, further efforts are required
    to extend lifetimes to the 30-40 year timeframes required for these applications.
  confidence_note: issue_severity set to moderate — the project achieved its stated
    lab-scale goals but the gap to commercial requirements is substantial, representing
    a meaningful technical shortfall rather than a minor one.
