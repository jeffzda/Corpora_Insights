- record_id: ARENA-DLV-46951
  source_title: Developing a New Type of High Efficiency Building Integrated PV Cell
    - Project results and lessons learnt
  publish_date: '2019-06-28'
  project_name: Developing a New Type of High Efficiency Building Integrated PV Cell
  what_happened: The conventionally used hole transport layer material Spiro-OMeTAD
    was found to be unsuitable for long-term BIPV applications due to its sensitivity
    to moisture and tendency to impart device instability. Screening of alternative
    hole transport materials from OLED development identified VNPB as a viable replacement,
    yielding comparable device efficiency (15%) with better stability under extended
    testing.
  lesson_learnt: When developing perovskite solar cells for long-lifetime applications
    such as BIPV, screen hole transport layer alternatives drawn from adjacent fields
    (e.g. OLED semiconductors) early in the project — Spiro-OMeTAD's known moisture
    sensitivity makes it unsuitable for building-integrated contexts, and VNPB demonstrated
    comparable efficiency with improved stability under accelerated testing.
