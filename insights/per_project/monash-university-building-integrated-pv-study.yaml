  publish_date: '2019-06-28'
  project_name: Developing a New Type of High Efficiency Building Integrated PV Cell
  what_happened: The project successfully fabricated semi-transparent perovskite solar
    cells at lab scale achieving 15% efficiency while maintaining 10% visible light
    transmission, meeting all Phase 1 milestones. However, scaling beyond laboratory
    device sizes to module scale and integration with commercial window framing (CSR
    Viridian) remained outstanding for Phase 2.
  lesson_learnt: Phased R&D projects targeting commercial readiness should establish
    a clear pathway from small-scale lab device performance to module-scale fabrication
    and commercial partner integration from the outset — the gap between demonstrating
    lab-scale efficiency and delivering an industrially relevant demonstrator module
    requires dedicated resourcing and commercial partner engagement that cannot be
    deferred.
