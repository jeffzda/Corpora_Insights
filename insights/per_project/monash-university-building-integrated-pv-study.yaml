- record_id: ARENA-DLV-29652
  source_title: Monash University Building Integrated PV Study Public Dissemination
    Report
  publish_date: 2021-10
  project_name: Developing a New Type of High Efficiency Building Integrated PV Cell
    (2017/RND013)
  what_happened: Scale-up of perovskite device fabrication from lab-scale spin coating
    to commercially viable methods (e.g. slot-die coating, reverse gravure) was not
    achieved within the project; spin coating remained the sole fabrication method
    used, limiting the pathway to commercial production.
  lesson_learnt: When designing perovskite precursor solutions for lab-scale research,
    formulations should be simultaneously validated for scalable deposition methods
    such as slot-die coating — designing only for spin coating creates a translational
    barrier that must be resolved before commercial scale-up is possible.
  issue_severity: major
  project_type: manufacturing/supply chain
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id002
  - 3
  - 4
  evidence_excerpt: Spin coating remains an excellent method for prototyping devices
    on a lab-scale to understand the relationship between efficiency, average visible
    transmittance, colour appearance and stability, but it will never be suitable
    for at-scale production. When designing precursor solutions for perovskite deposition,
    it is important not only to consider how the solution is used for spin coating,
    but also how it translates for use with scalable deposition methods, e.g. slot-die
    coating and reverse gravure.
