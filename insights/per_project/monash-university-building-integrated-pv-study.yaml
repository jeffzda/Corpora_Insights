  what_happened: Long-term stability of VNPB as a hole transport layer in perovskite
    solar cells beyond the tested durations remained uncharacterised at the time of
    reporting, and its compatibility with alternative perovskite compositions was
    also unknown, representing an unresolved knowledge gap at the end of Phase 1.
  lesson_learnt: When a new material is identified as a performance improvement, plan
    for extended accelerated lifetime testing and compatibility testing with alternative
    compositions before claiming commercial readiness — residual unknowns around VNPB
    long-term stability and perovskite composition compatibility mean the technology
    readiness level cannot be confirmed without further testing.
