- record_id: ARENA-DLV-72248
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: '2015'
  project_name: 'FPDI: Value of Small Scale Embedded Generation and Storage'
  what_happened: Multiple Australian independent regulators acknowledged that embedded
    generation provides network benefits through demand alleviation but were unable
    to determine an appropriate value due to diversity in network characteristics.
    This policy gap meant the contribution of small-scale embedded generation and
    storage to networks remained unquantified and unrewarded.
  lesson_learnt: The absence of a methodology for quantifying the network value of
    embedded generation is a structural barrier to efficient DER deployment — policy
    makers should develop and adopt a cost/benefit methodology that allows distributed
    generation to be appropriately rewarded for its network contributions under varying
    locational and consumption conditions.
