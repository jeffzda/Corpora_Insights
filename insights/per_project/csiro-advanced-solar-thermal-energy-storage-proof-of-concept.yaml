- record_id: ARENA-DLV-16261
  source_title: Energy Storage Study
  publish_date: 2015-07
  project_name: CSIRO Advanced Solar Thermal Energy Storage Proof-of-Concept
  what_happened: CSIRO received $3.5 million from ARENA to develop a proof-of-concept solar thermal energy storage facility (750 kWh). The study concluded that similar projects would need to exceed 100
    MWe (250 MWt) to be viable, with a levelised cost of electricity of approximately $175/MWh at that scale.
  lesson_learnt: Solar thermal energy storage projects require very large scale (>100 MWe) to achieve sufficient economies of scale for commercial viability; ARENA funding for sub-commercial-scale proof-of-concept
    work is valuable for establishing this threshold and avoiding premature deployment at uneconomic scales.
