  publish_date: 2022-11
  project_name: Project Yuri (Yara Clean Ammonia / Engie)
  what_happened: Project Yuri, described as Australia's largest hydrogen project at the time, reached financial close as a $1.8 billion joint venture to install a 10MW electrolyser and 18MW solar panels
    in the Pilbara, targeting ammonia production for export. Regional collaboration agreements were key to enabling offtake.
  lesson_learnt: Securing regional collaboration agreements and strategic offtake partners early in project development is critical to achieving financial close on large-scale green hydrogen and ammonia
    projects — offtake certainty was a key enabler for Project Yuri's $1.8B investment decision.
