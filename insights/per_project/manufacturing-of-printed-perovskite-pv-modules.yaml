- record_id: ARENA-DLV-33501
  source_title: Manufacturing of Printed Perovskite PV Modules
  publish_date: '2019-06-30'
  project_name: Manufacturing of Printed Perovskite PV Modules
  what_happened: Testing across various humidity and temperature conditions revealed
    that the optimal environmental range for roll-to-roll perovskite PV fabrication
    is composition- and process-dependent, and that high humidity can be beneficial
    for some processes — contradicting the prevailing research community assumption
    that low humidity (20–30%) or an inert atmosphere is universally required.
  lesson_learnt: Do not design manufacturing facilities around the assumption that
    a single low-humidity environment is required for perovskite PV production — optimal
    conditions are process- and formulation-specific, and relaxing humidity control
    requirements can significantly reduce capital cost for establishing a printing
    facility.
