  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The team consolidated a knowledge base, technical expertise,
    and infrastructure for perovskite manufacturing across multiple formulations to
    accelerate future projects pursuing commercial pathways.
  transferability: narrow
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id006
