- record_id: ARENA-DLV-11652
  source_title: Manufacturing of Printed Perovskite PV Modules Final Report
  publish_date: 2021-11
  project_name: Manufacturing of Printed Perovskite PV Modules
  what_happened: Direct printing of conductive carbon-based inks onto the sensitive
    perovskite layer to replace vacuum-deposited gold electrodes caused partial degradation
    of the perovskite photoabsorber and functional layers due to solvents in the carbon
    pastes/inks, and post-annealing required to remove solvents also partially degraded
    the device. This resulted in inferior device efficiency compared to vacuum-deposited
    electrodes.
  lesson_learnt: Direct deposition of carbon or silver inks onto perovskite films
    degrades device performance due to solvent incompatibility; future projects should
    evaluate lamination or dry-transfer electrode approaches as a preferable route
    to vacuum-free, fully printable perovskite PV that avoids solvent-induced degradation.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: The team developed a dry-transfer (lamination) approach where
    electrodes are pre-printed on a separate substrate and then transferred to the
    perovskite film without chemical agents, enabling use of any commercially available
    conductive inks and yielding higher efficiency devices.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
