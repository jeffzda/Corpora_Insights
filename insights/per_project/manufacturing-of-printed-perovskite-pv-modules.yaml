- record_id: ARENA-DLV-11651
  source_title: Manufacturing of Printed Perovskite PV Modules Final Report
  publish_date: 2021-11
  project_name: Manufacturing of Printed Perovskite PV Modules
  what_happened: Laboratory-scale perovskite PV research has historically relied on
    spin-coating and inert glovebox environments — techniques incompatible with industrial-scale
    roll-to-roll manufacturing. When the project team attempted to translate laboratory
    processes to scalable slot-die coating under ambient conditions, the approaches
    that achieved the highest laboratory efficiencies (anti-solvent treatment, nitrogen-blowing)
    proved technically very challenging to implement, and there was no significant
    improvement in efficiency or reproducibility in this area after initial efforts
    in 2015 prior to this project.
  lesson_learnt: Results obtained for highly optimised laboratory-scale perovskite
    PV should be treated as an upper limit of technical potential, not a performance
    indicator for larger-scale manufacturing. Future perovskite PV projects should
    design fabrication processes around scalable, industry-compatible techniques (e.g.
    slot-die coating) from the outset, rather than adapting laboratory processes retrospectively.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The team abandoned anti-solvent and gas-assisted methods and
    instead investigated volatile low-boiling-point solvents (Route 1) and heated-substrate
    one-step deposition (Route 2), ultimately achieving a world-record 18% PCE via
    Route 2 slot-die coating.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
