- record_id: ARENA-DLV-11656
  source_title: Manufacturing of Printed Perovskite PV Modules Final Report
  publish_date: 2021-11
  project_name: Manufacturing of Printed Perovskite PV Modules
  what_happened: Perovskite materials exhibit innumerable compositional permutations
    leading to complex formulations, large differences in film formation dynamics,
    and different processing requirements. The project found that the two scalable
    production routes identified were not universally compatible with all combinations
    of perovskite precursors, meaning each new formulation required significant process
    optimisation work.
  lesson_learnt: Future perovskite PV projects should not assume that a scalable deposition
    process optimised for one perovskite formulation will transfer directly to other
    formulations; significant process development effort should be budgeted for each
    new material combination, and a consolidated knowledge base and infrastructure
    like that developed at CSIRO should be leveraged to reduce this overhead.
