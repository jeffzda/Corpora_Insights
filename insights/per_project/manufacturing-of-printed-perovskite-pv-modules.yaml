- record_id: ARENA-DLV-11655
  source_title: Manufacturing of Printed Perovskite PV Modules Final Report
  publish_date: 2021-11
  project_name: Manufacturing of Printed Perovskite PV Modules
  what_happened: Academic perovskite PV research has focused on achieving high efficiencies
    using the best available materials regardless of production cost, and calculating
    realistic manufacturing costs from laboratory processes required too many unrealistic
    assumptions. This created a significant knowledge gap between demonstrated laboratory
    efficiency and the economic viability of scaling to commercial manufacturing.
  lesson_learnt: Emerging technology R&D projects should develop cost models in parallel
    with technical performance work rather than at the end; calculating manufacturing
    cost alongside efficiency progress allows early identification of which device
    configurations and material substitutions are commercially viable at scale, and
    enables more credible engagement with commercialisation partners.
  issue_severity: minor
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: CSIRO developed a manufacturing cost model in collaboration with
    UNSW, based on demonstrated efficiencies, realistic factory operating costs in
    Australia, and multiple device architecture options, yielding a cost estimate
    of 0.5–1.5 AUD/Wp for a ~100 MW/year Australian facility.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id005
