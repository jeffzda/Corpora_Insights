- record_id: ARENA-DLV-51460
  source_title: UTS - Flexible Demand State of Play in Australia - Report
  publish_date: 2024-05
  project_name: Intellihub – Flexibility Load Platform
  what_happened: The Intellihub pilot found that retailers and networks are at different
    stages of CER management maturity, trialling various approaches to register, connect
    and control devices, with no consistent industry approach established.
  lesson_learnt: CER aggregation platforms cannot assume standardised onboarding processes
    across retailers and networks; platform developers must build for heterogeneous
    integration environments and factor in significant per-partner integration effort,
    as industry standardisation is still nascent.
