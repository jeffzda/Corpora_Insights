- record_id: ARENA-DLV-51461
  source_title: UTS - Flexible Demand State of Play in Australia - Report
  publish_date: 2024-05
  project_name: Intellihub – Flexibility Load Platform
  what_happened: Preliminary analysis from the Intellihub pilot found that the wholesale
    value of flexible loads varies substantially by device type and by state, with
    daily EV charging shifting having the highest wholesale value ($631/annum), while
    hot water and pool pump values varied from $16–$388/annum depending on state.
  lesson_learnt: Business cases for flexible demand aggregation should be assessed
    at the state and device-type level rather than using national averages — wholesale
    value varies by an order of magnitude across states and device types, and a viable
    business case in Queensland may not translate to Tasmania.
  issue_severity: none
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: null
