  evidence_excerpt: Preliminary analysis of the annual wholesale savings from different
    flexible loads found daily shifting of EV charging has the highest wholesale value
    ($631 per annum)... the wholesale value of hot water and pool pumping as flexible
    loads varies significantly by state, peaking at $388 per annum for pool pumps
    in Queensland and $203 per annum for hot water in South Australia, with the lowest
    savings $35 per annum for hot water and $16 per annum for pool pumps in Tasmania.
