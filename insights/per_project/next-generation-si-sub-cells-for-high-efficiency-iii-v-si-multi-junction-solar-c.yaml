- record_id: ARENA-DLV-48105
  source_title: ARENA-Funded Cutting Edge Research in Photovoltaics
  publish_date: 2019-09
  project_name: Next Generation Si sub-cells for high efficiency III-V/Si multi-junction
    solar cells (2017/RND008)
  what_happened: 'The project identified that deposition of III-V materials onto Si
    substrates introduced defects that degraded the Si and inhibited high efficiency
    — a key technical barrier. The team found a solution: high-temperature annealing
    of the Si substrate prior to III-V deposition, combined with a Si nitride layer
    on the rear, successfully addressed this defect mechanism.'
  lesson_learnt: In III-V/Si tandem cell fabrication, Si substrate preparation (high-temperature
    anneal plus SiN rear layer) before III-V deposition is necessary to prevent III-V-induced
    Si degradation — this defect mechanism should be treated as a known process risk
    and mitigated by design rather than discovered empirically.
