- record_id: ARENA-DLV-40609
  source_title: ARENA Electrical Infrastructure Roundtable
  publish_date: '2025-06-25'
  project_name: Energy Queensland / Ergon Network – CER and Minimum Demand Challenge
  what_happened: Energy Queensland's Ergon network — originally built for one-way
    energy transfer — is experiencing a dramatic swing between maximum and minimum
    demand, with the 2023–24 high of 2,874 MW versus a low of 784 MW, as distributed
    solar PV, batteries, and emerging V2G penetration create network instability risks
    at minimum demand.
  lesson_learnt: Distribution networks not designed for two-way power flows face acute
    system stability risks at minimum demand as DER penetration grows; proponents
    connecting DER assets should engage with DNSPs on minimum demand scenarios — not
    just peak demand — as a prerequisite for connection design, and networks must
    invest in dynamic management tools before minimum demand constraints become a
    binding constraint.
