- record_id: ARENA-DLV-64121
  source_title: Summary of ARENA Funded Hydrogen R&D Projects
  publish_date: 2023-04
  project_name: CSIRO – Methane Fuel Carrier
  what_happened: The CSIRO methane fuel carrier project demonstrated that direct air capture of CO2 using amino-acid salt solutions is feasible at a cost as low as $100/tonne, with overall liquefied synthetic
    methane production costing $37.40/GJ — but electricity costs were the dominant cost driver, making the economics highly sensitive to energy price.
  lesson_learnt: Synthetic methane from direct air capture projects must secure low-cost renewable electricity supply as a foundational commercial requirement — the DAC process efficiency gains are secondary
    to energy price in determining whether the overall system is economically viable.
