- record_id: ARENA-DLV-42331
  source_title: Evaluation of ARENA's 2017-2020 Demand Response Portfolio
  publish_date: 2021-06
  project_name: United Energy Distribution Demand Response (VIC)
  what_happened: While United Energy's DVMS demonstrated voltage-based DR capability,
    peer distribution networks would need to replace relay devices at significant
    cost and have smart meters installed at customer premises before they could replicate
    the approach — limiting the near-term transferability of the technology and its
    commercial readiness for the broader market.
  lesson_learnt: Network-level voltage reduction DR is highly capital-intensive to
    replicate — it requires both zone substation relay upgrades and broad smart meter
    penetration; future programs should account for the prerequisite infrastructure
    investment required at peer networks before claiming broad commercial readiness
    of this approach.
