- record_id: ARENA-DLV-42330
  source_title: Evaluation of ARENA's 2017-2020 Demand Response Portfolio
  publish_date: 2021-06
  project_name: United Energy Distribution Demand Response (VIC)
  what_happened: United Energy developed and deployed a Dynamic Voltage Management
    System (DVMS) using smart meters to implement voltage reduction across 47 zone
    substations without breaching regulated customer voltage limits — the first trial
    of its kind in Australia — delivering over 150 MW of DR reserve across the three-year
    trial, including 45.5 MW and 51.8 MW in actual RERT activations on 24–25 January
    2019.
  lesson_learnt: Network-level voltage reduction using smart meters offers a scalable,
    low-marginal-cost DR mechanism capable of delivering large volumes of firm capacity
    rapidly (≥30 MW within 10 minutes) without direct customer interaction — this
    approach warrants replication by other distribution networks where smart meter
    coverage is sufficient.
