- record_id: ARENA-DLV-72009
  source_title: Australian Energy Resource Assessment — Second Edition, 2014
  publish_date: '2014'
  project_name: Australian Geothermal Sector — Inadequate Pre-Competitive Data
  what_happened: Geothermal exploration in Australia was initially constrained to
    areas covered by petroleum exploration data, because the existing OZTEMP bottom-hole
    temperature database was biased towards petroleum basin settings and inadequate
    for assessing full geothermal potential — leaving large parts of the continent
    unexplored despite likely geothermal potential.
  lesson_learnt: Pre-competitive geoscience data gaps can systematically bias exploration
    toward suboptimal targets — geothermal developers should advocate for and use
    heat-flow measurement programs and publicly available geological datasets beyond
    petroleum bottom-hole temperatures, as these provide more robust temperature-at-depth
    predictions and can open new prospective areas.
  issue_severity: moderate
  project_type: generation
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: concept/feasibility
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: poor scoping
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: data & measurement
  intervention_note: Geoscience Australia expanded the OZTEMP database and published
    national-scale maps of high heat-producing granites and sedimentary basins; companies
    began acquiring heat-flow measurements specifically for geothermal exploration
    to supplement the petroleum-well temperature database.
  transferability: narrow
  delay_magnitude: null
  technology_domain: other
