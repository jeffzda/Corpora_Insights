  evidence_excerpt: Until recently, this has been the only database of significant
    use to geothermal explorers, and exploration in Australia was initially limited
    to areas of petroleum exploration activity because this was the only available
    relevant dataset. However, this dataset has a number of inadequacies and does
    not fully represent Australia's geothermal potential.
  confidence_note: Proponent type set to research organisation/university as the data
    improvement work was led by Geoscience Australia and universities; the finding
    applies broadly to the sector.
