- record_id: ARENA-DLV-59202
  source_title: Biogas Opportunities for Australia
  publish_date: 2019-03
  project_name: ReWaste Plant at Yarra Valley Water, Wollert, Victoria
  what_happened: Yarra Valley Water constructed the ReWaste waste-to-energy plant (1 MW electric, 33,000 tonnes biowaste per annum) at a capital cost of A$27 million, which came into commercial operation
    in 2017. The plant generates enough electricity to supply approximately 30 per cent of the adjacent Aurora sewage treatment plant's demand, with the remainder exported to the grid.
  lesson_learnt: Co-locating an anaerobic digestion plant at an existing wastewater treatment facility provides a secure feedstock supply (sewage sludge plus imported biowaste) and an immediate on-site
    electricity offtake, significantly improving project financial case — future proponents should prioritise WWTP co-location as a site selection criterion.
