- record_id: ARENA-DLV-21952
  source_title: Lessons for Improving the Fabrication of Thermionic Device Using Advanced
    Ceramics
  publish_date: null
  project_name: Fabrication of Thermionic Devices Using Directional Solidification/Sintering
    Processes for High Temperature CST Applications
  what_happened: 'The efficiency of the fabricated thermionic device was materially
    limited by two technical factors: low effective heat transfer rates (contact resistance)
    between components, and space charge build-up across the 45-micron gap between
    cathode and anode.'
  lesson_learnt: For thermionic device development, thermal contact resistance between
    envelope and emitter/collector components and space charge management across the
    inter-electrode gap must be treated as primary design constraints from the outset
    — both were identified as efficiency-limiting factors in this prototype and require
    dedicated R&D attention before further scale-up.
