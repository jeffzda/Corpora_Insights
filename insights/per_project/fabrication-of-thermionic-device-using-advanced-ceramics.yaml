  publish_date: null
  project_name: Fabrication of Thermionic Devices Using Directional Solidification/Sintering
    Processes for High Temperature CST Applications
  what_happened: At project completion the thermionic energy converter remained at
    TRL3, unable to compete commercially with photovoltaic or solar-driven steam generation
    technologies. The technology's development path requires multiple further R&D
    phases before commercial viability can be assessed.
  lesson_learnt: Thermionic energy conversion projects should be scoped and funded
    as a staged long-term R&D programme with explicit TRL progression gates rather
    than as a single project expected to deliver a commercially competitive outcome
    — the gap between TRL3 and commercial readiness is substantial and requires sequential
    phase investments.
