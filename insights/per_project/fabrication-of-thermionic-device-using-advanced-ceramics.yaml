- record_id: ARENA-DLV-21953
  source_title: Lessons for Improving the Fabrication of Thermionic Device Using Advanced
    Ceramics
  publish_date: null
  project_name: Fabrication of Thermionic Devices Using Directional Solidification/Sintering
    Processes for High Temperature CST Applications
  what_happened: A demountable enclosure with a maximum service temperature of 1400°C
    was successfully fabricated using commercially available products, meeting ultra-high
    vacuum and oxidation resistance requirements for the thermionic prototype.
  lesson_learnt: Ultra-high vacuum, high-temperature enclosures for thermionic prototype
    testing can be constructed from commercially available products — projects should
    assess whether off-the-shelf components can meet enclosure requirements before
    investing in custom fabrication, as this was demonstrated to be viable up to 1400°C.
