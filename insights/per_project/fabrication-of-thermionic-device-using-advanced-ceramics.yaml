  publish_date: null
  project_name: Fabrication of Thermionic Devices Using Directional Solidification/Sintering
    Processes for High Temperature CST Applications
  what_happened: The project scope was too broad for the low starting TRL (TRL3),
    making it difficult to meet milestones. The project attempted to simultaneously
    develop electron emissive materials, a gap-forming material, a high-temperature
    ultra-high vacuum enclosure, and a working prototype device.
  lesson_learnt: When starting a low-TRL project, reduce the initial scope to focus
    on the most critical research objectives (e.g. emitter/collector material development)
    and defer downstream deliverables such as enclosure and prototype fabrication
    to a second phase — attempting the full scope at low TRL makes milestone achievement
    difficult.
