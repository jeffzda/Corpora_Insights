- record_id: ARENA-DLV-21954
  source_title: Lessons for Improving the Fabrication of Thermionic Device Using Advanced
    Ceramics
  publish_date: null
  project_name: Fabrication of Thermionic Devices Using Directional Solidification/Sintering
    Processes for High Temperature CST Applications
  what_happened: Rare-earth hexaboride electron emissive materials of high purity
    were successfully synthesised at lower temperatures than previously established
    in the literature, and a suitable gap-forming material with good electrical and
    thermal insulation properties compatible with rare-earth hexaborides was identified.
  lesson_learnt: High-purity rare-earth hexaboride emitter materials can be synthesised
    at lower temperatures than previously assumed, reducing processing cost and complexity
    — future thermionic device programmes should use this finding as a baseline rather
    than replicating prior high-temperature synthesis routes.
