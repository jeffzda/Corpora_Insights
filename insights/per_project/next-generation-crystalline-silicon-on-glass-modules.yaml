  - 5
  evidence_excerpt: The CSG cell efficiency was also capped at around 10% by the defective
    nature of the silicon material obtained by solid-phase crystallisation... the
    project demonstrated solar cells with the efficiency exceeding the previous CSG
    cells and approaching 13%.
