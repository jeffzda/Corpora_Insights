- record_id: ARENA-DLV-13806
  source_title: Next Generation Crystalline Silicon on Glass Modules Final Report
  publish_date: 2016-04
  project_name: Next Generation Crystalline Silicon on Glass Modules
  what_happened: The metallisation scheme for LPCSG cells — where contacts are made
    to a lightly doped absorber — was identified as a key remaining barrier to achieving
    fill factors above 75%, with the current lab-scale device design described as
    'complicated'. This represents an unresolved technical gap at project close-out
    that blocks full realisation of the high-quality material's potential.
  lesson_learnt: For thin-film silicon PV projects using liquid-phase crystallisation,
    metallisation and contact design should be treated as a critical development workstream
    from the outset — unresolved contact resistance and fill-factor limitations in
    the lab-scale device are identified as the primary barrier to the next performance
    milestone and will require dedicated effort before scale-up.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: lab/bench
  lifecycle_phase: close-out/post-project review
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Selective absorber doping was introduced for contact areas to
    reduce contact resistance, achieving sufficiently low contact resistance and high
    fill factor at lab scale, but further simplification of the metallisation scheme
    is identified as the primary next step.
  transferability: narrow
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id006
  - 6
  - 7
  evidence_excerpt: A major next step is to improve and simplify the currently complicated
    lab scale device design, metallisation scheme in particular, to fully realise
    the potential of the high quality material and to achieve the fill-factor of above
    75%.
