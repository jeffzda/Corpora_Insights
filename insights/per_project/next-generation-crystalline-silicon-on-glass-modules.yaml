- record_id: ARENA-DLV-13804
  source_title: Next Generation Crystalline Silicon on Glass Modules Final Report
  publish_date: 2016-04
  project_name: Next Generation Crystalline Silicon on Glass Modules
  what_happened: The cell fabrication processes for dopant diffusion, light-trapping,
    and metallisation used in the original CSG technology could not be directly adopted
    for LPCSG cells because the dopant profiles relied on deposition-phase doping.
    New processes had to be designed and implemented from scratch, adding significant
    development effort.
  lesson_learnt: When changing the core deposition and crystallisation process in
    a thin-film PV technology, downstream cell fabrication steps (dopant diffusion,
    light-trapping, metallisation) cannot be assumed to transfer directly — budget
    and schedule for redesigning each downstream process independently.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: Developed new thermal and laser-based dopant diffusion processes,
    optimised rear and glass-silicon interface texturing for light-trapping achieving
    ~50% photocurrent enhancement, and introduced selective absorber doping for metallisation
    contact resistance.
  transferability: narrow
  delay_magnitude: null
  technology_domain: solar PV
