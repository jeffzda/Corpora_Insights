- record_id: ARENA-DLV-13803
  source_title: Next Generation Crystalline Silicon on Glass Modules Final Report
  publish_date: 2016-04
  project_name: Next Generation Crystalline Silicon on Glass Modules
  what_happened: The original CSG technology used solid-phase crystallisation, which
    produced silicon with high defect density and capped cell efficiency at around
    10%, making it uncompetitive with other thin-film and conventional silicon wafer
    technologies. The project developed liquid-phase crystallisation using a line-focus
    laser beam, achieving cells exceeding 13% efficiency with material quality similar
    to multi-crystalline silicon wafers.
  lesson_learnt: Liquid-phase crystallisation via line-focus laser beam produces silicon
    grain quality and open-circuit voltages comparable to multi-crystalline wafers;
    future thin-film silicon R&D programmes should prioritise liquid-phase over solid-phase
    crystallisation routes to overcome the efficiency ceiling imposed by defect-dense
    solid-phase material.
  issue_severity: major
  project_type: manufacturing/supply chain
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: Developed a line-focus diode laser crystallisation process that
    fully melts the silicon film and recrystallises it into large low-defect grains
    in under one minute, achieving open-circuit voltages above 620 mV.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id003
