  project_name: Next Generation Crystalline Silicon on Glass Modules
  what_happened: The cost of ownership model developed by the project estimated CapEx
    for a 100 MW LPCSG production plant at approximately USD 2/W, which is more than
    twice the then-current CapEx of less than USD 1/W for silicon wafer-based PV technologies,
    primarily because silicon evaporators are not standard manufacturing equipment
    and must be custom-built.
  lesson_learnt: Technology readiness assessments for novel thin-film PV manufacturing
    routes must account for non-standard capital equipment requirements; custom-built
    tools such as large-area silicon evaporators can dominate CapEx and must be identified
    as a key development and cost-reduction target before commercialisation planning.
