- record_id: ARENA-DLV-13801
  source_title: Next Generation Crystalline Silicon on Glass Modules Final Report
  publish_date: 2016-04
  project_name: Next Generation Crystalline Silicon on Glass Modules
  what_happened: During development of liquid-phase crystallised silicon on glass
    (LPCSG) solar cells, direct contact between silicon and glass caused film delamination
    during laser melting, impurity diffusion into the silicon, high interface reflectance,
    and high carrier recombination — all of which prevented viable cell performance.
  lesson_learnt: When processing silicon on glass substrates via liquid-phase crystallisation,
    a multilayer intermediate dielectric stack (specifically silicon nitride sandwiched
    between two silicon dioxide layers) must be used — no single material satisfies
    all required properties (wetting, impurity barrier, antireflection, interface
    passivation) simultaneously.
  issue_severity: major
  project_type: manufacturing/supply chain
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Experimented with combinations of single dielectrics (silicon
    carbide, silicon oxide, silicon nitride) and developed a triple-layer stack of
    silicon nitride sandwiched between two silicon dioxide layers, which resolved
    all interface issues and enabled successful laser crystallisation.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id001
  - 8
  - 9
  evidence_excerpt: The project has identified a critical importance of the intermediate
    layer between glass and the silicon for successful film crystallisation and resulting
    cell performance. This layer plays multiple roles and should possess specific
    properties which no single material can combine. A multi-layer stack made of different
    materials has to be used.
  confidence_note: issue_severity rated major because the absence of a functioning
    intermediate layer blocked viable cell fabrication entirely, representing a fundamental
    technical barrier that required iterative experimental resolution.
