- record_id: ARENA-DLV-13802
  source_title: Next Generation Crystalline Silicon on Glass Modules Final Report
  publish_date: 2016-04
  project_name: Next Generation Crystalline Silicon on Glass Modules
  what_happened: Prior to the project, CSG technology used slow plasma-enhanced chemical
    vapour deposition (taking ~5 hours to deposit 10 microns of silicon) and solid-phase
    crystallisation (taking ~30 hours), making the technology too expensive to manufacture
    commercially. The project successfully replaced these with e-beam evaporation
    (~10 minutes for the same deposition) and laser liquid-phase crystallisation (under
    1 minute).
  lesson_learnt: E-beam evaporation at rates up to 1 micron per minute — 30 times
    faster than plasma deposition — is a commercially viable alternative for silicon
    thin-film deposition; pairing it with line-focus laser crystallisation eliminates
    the slow solid-phase crystallisation step and substantially reduces manufacturing
    cost.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: Re-designed the silicon electron beam evaporator to reduce impurity
    incorporation, improve dopant flow control, and increase deposition rate to 1
    micron per minute; introduced and optimised line-focus laser crystallisation to
    produce high electronic quality material in under a minute.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id002
  - 3
  - 5
  evidence_excerpt: It takes only about 10 min to deposit 10 microns of silicon required
    for CSG solar cells as compared to about 5 hours by plasma deposition... Silicon
    evaporation is capable of deposition rates up to 1 micron per minute which is
    30 times faster than plasma deposition.
  confidence_note: null
