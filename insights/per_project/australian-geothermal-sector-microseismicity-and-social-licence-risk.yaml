  evidence_excerpt: Community outreach could have helped the public to understand
    the issues. A similar project in St. Gallan, Switzerland that did excellent community
    outreach had a seismic event that people could feel, but the public was aware
    of the risks and were notified immediately and included in ongoing decision making.
    The town elected to continue the project... A proposed project in Geelong resulted
    in significant community concern.
