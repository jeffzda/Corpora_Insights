- record_id: ARENA-DLV-14974
  source_title: 'Looking Forward: Barriers, Risks and Rewards of the Australian Geothermal
    Sector to 2020 and 2030'
  publish_date: 2014-06
  project_name: Australian Geothermal Sector – Microseismicity and Social Licence
    Risk
  what_happened: Geothermal EGS projects in Australia and internationally have encountered
    public concern over hydraulic fracturing and induced microseismicity; a proposed
    geothermal project in Geelong resulted in significant community concern, and the
    Basel project was abandoned after induced seismicity, illustrating that social
    licence to operate is a real project-termination risk for EGS.
  lesson_learnt: Community outreach and transparent communication about induced seismicity
    risks should begin well before stimulation activities, not after events occur
    — the contrast between Basel (abandoned after public was not adequately prepared)
    and St Gallen (community continued project after being pre-informed and involved
    in decision making) demonstrates that early, evidence-based stakeholder engagement
    can be the difference between project continuation and abandonment.
