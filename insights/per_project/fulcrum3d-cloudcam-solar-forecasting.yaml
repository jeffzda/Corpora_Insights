- record_id: ARENA-DLV-40751
  source_title: Fulcrum3D CloudCAM Solar Forecasting for the NEM Lessons Learnt Report
    2
  publish_date: 2020-04
  project_name: 'Fulcrum3D: Solar Forecasting for the NEM'
  what_happened: The MP5F API registration and authentication process changed repeatedly
    during the project, API passwords expired regularly with no automated reset mechanism,
    and having two forecast providers on the same site submitting through separate
    API connections created operational challenges.
  lesson_learnt: A secure automated or semi-automated system for resetting API passwords
    is critical to operational efficiency when integrating with AEMO's MP5F API —
    regular manual password resets introduce unnecessary operational risk. Engage
    directly with the asset owner and AEMO participant early to resolve conflicts
    arising from multiple forecast providers on the same site.
