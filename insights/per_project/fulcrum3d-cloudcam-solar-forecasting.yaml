- record_id: ARENA-DLV-62952
  source_title: Fulcrum3D CloudCAM Solar Forecasting for the NEM Lessons Learnt Report
    1
  publish_date: 2019-10
  project_name: Fulcrum3D CloudCAM Solar Forecasting for the NEM
  what_happened: CloudCAM hardware (cameras, pyranometers, loggers, power supplies,
    network hardware) performed reliably through harsh environmental conditions including
    heavy flooding rains and summer temperatures consistently over 40°C, consistent
    with prior deployments operating continuously for over three years.
  lesson_learnt: CloudCAM hardware is sufficiently robust for deployment in harsh
    tropical climates; being the designer, integrator and OEM enables rapid detection
    and software-level correction of hardware anomalies without field intervention,
    demonstrating the value of vertically integrated smart-sensor systems.
