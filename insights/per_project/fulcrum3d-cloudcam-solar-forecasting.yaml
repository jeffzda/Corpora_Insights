  what_happened: Power point controller and inverter controller algorithms were poorly
    documented by equipment suppliers, creating a knowledge gap that complicated power
    modelling and required the team to develop workarounds.
  lesson_learnt: Request detailed technical documentation for power point controller
    and inverter controller algorithms from suppliers before finalising forecasting
    system design — poor supplier documentation forces costly workarounds and should
    be flagged as a procurement requirement or risk.
