  source_title: Fulcrum3D CloudCAM Solar Forecasting for the NEM Lessons Learnt Report
    2
  publish_date: 2020-04
  project_name: 'Fulcrum3D: Solar Forecasting for the NEM'
  what_happened: Analysis of FCAS spot prices versus energy spot prices showed that
    the business case for using self-forecasts to enable FCAS participation or export
    control by solar farms is weak under current market conditions, because energy
    spot prices are generally significantly higher than FCAS spot prices. However,
    the South Australian islanding event demonstrated that generators without FCAS
    participation capability faced very large unexpected FCAS costs while only Hornsdale
    wind farms — the sole renewable FCAS providers in South Australia — were able
    to capitalise on the FCAS windfall.
  lesson_learnt: Solar and wind farm operators should assess their FCAS exposure and
    consider developing FCAS participation capabilities — under normal conditions
    the business case is weak, but low-probability high-impact islanding or separation
    events can result in severe unexpected FCAS costs for generators that have not
    developed mitigation strategies, as demonstrated by the South Australian islanding
    event.
  issue_severity: moderate
