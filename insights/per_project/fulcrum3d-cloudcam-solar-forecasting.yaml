- record_id: ARENA-DLV-30605
  source_title: Fulcrum3D CloudCAM Solar Forecasting Final Report
  publish_date: '2021-02-15'
  project_name: Fulcrum3D CloudCAM Solar Forecasting for the NEM
  what_happened: The NEM dispatch engine applies a zero floor to dispatch targets,
    preventing negative self-forecasts from being submitted via MP5F. When solar or
    wind plants are net consumers from the grid (negative generation), they incur
    FCAS Causer Pays costs that self-forecasting cannot mitigate. AEMO validated that
    this effect can contribute 10–20% to a generator's Market Participant Factor.
  lesson_learnt: Self-forecasting via MP5F cannot reduce Causer Pays charges incurred
    during periods of negative generation; project developers and operators should
    account for this structural limitation in their Causer Pays reduction forecasts,
    particularly for wind farms where negative generation is more prevalent.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: null
  failure_mode: regulatory & approvals
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Fulcrum3D raised the issue with AEMO, who validated the internal
    analysis; a future project to explore modification of the NEM dispatch engine
    to allow negative dispatch targets was recommended.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id008
  - 10
  evidence_excerpt: AEMO have been able to validate our internal analysis that this
    effect can contribute 10-20% to a generator's MPF... Operational forecasting meeting
    notes from 2018 said MP5F would allow negative submissions but this is not the
    case.
  confidence_note: failure_mode classified as regulatory misfit because the limitation
    is embedded in AEMO's dispatch engine design rather than a forecasting or hardware
    failure; secondary design assumption failure reflects that early MP5F documentation
    indicated negative submissions would be permitted.
