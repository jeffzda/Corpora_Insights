- record_id: ARENA-DLV-15832
  source_title: Evaluation of ARENA's Impact and Effectiveness
  publish_date: 2019-11
  project_name: Fulcrum3D CloudCAM Solar Forecasting
  what_happened: ARENA's $490,000 initial investment in Fulcrum3D's $991,000 CloudCAM
    short-term cloud forecasting project enabled commercial product development that
    would not otherwise have proceeded. The technology reduced battery usage at Ti-Tree
    and Kalkarindji power stations by approximately 30 per cent and increased average
    solar yield by 4–5 per cent. However, commercial viability of the technology was
    found to be dependent on market arrangements that penalise generators for rapid
    output changes (causer pays FCAS).
  lesson_learnt: Solar forecasting technology business models are critically dependent
    on the regulatory value of forecast accuracy — projects should explicitly assess
    whether current and forecast market rules create sufficient financial incentive
    for accuracy before assuming commercial viability at scale.
  issue_severity: none
