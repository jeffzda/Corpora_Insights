- record_id: ARENA-DLV-30608
  source_title: Fulcrum3D CloudCAM Solar Forecasting Final Report
  publish_date: '2021-02-15'
  project_name: Fulcrum3D CloudCAM Solar Forecasting for the NEM
  what_happened: Across more than twelve NEM plant deployments, SCADA integration
    emerged as the most variable and time-consuming component of deploying a self-forecasting
    system, requiring site-specific interface configuration and QA of all SCADA tags
    even where the core forecasting and API components were mature and repeatable.
  lesson_learnt: Budget significant time for site-specific SCADA integration when
    deploying self-forecasting systems — while not always technically difficult, configuring
    interfaces and validating SCADA tags can be highly time-consuming and is now the
    primary source of deployment variability across sites.
