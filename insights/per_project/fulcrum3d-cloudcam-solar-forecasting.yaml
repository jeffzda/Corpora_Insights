- record_id: ARENA-DLV-30606
  source_title: Fulcrum3D CloudCAM Solar Forecasting Final Report
  publish_date: '2021-02-15'
  project_name: Fulcrum3D CloudCAM Solar Forecasting for the NEM
  what_happened: AEMO's dispatch engine was found to round dispatch targets down to
    the nearest MW, making it impossible to forecast accurately when a plant is operating
    at full unconstrained capacity and generating Causer Pays charges that could not
    be explained by forecast error.
  lesson_learnt: When designing self-forecasting submissions for AEMO's dispatch engine,
    account for the MW-level rounding behaviour at full plant capacity — accurate
    forecasting at that operating point is not achievable under current system settings
    and forecast logic should handle this boundary condition explicitly.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: regulatory & approvals
  intervention_note: Fulcrum3D identified the rounding behaviour through analysis
    of unexpected Causer Pays charges at unconstrained plants and recommended a future
    project investigate whether the dispatch engine could be modified to remove the
    rounding.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages:
  - 2
  - 11
  evidence_excerpt: A setting in AEMO's system appears to round the dispatch target
    down to the nearest MW in the dispatch engine. This means that it is impossible
    to forecast accurately when the plant is permitted to produce at full capacity
    and is doing so.
  confidence_note: Canonical record merged from 2 source records across 2 document(s).
