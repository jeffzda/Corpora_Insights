- record_id: ARENA-DLV-26501
  source_title: CONSORT - Network Aware Coordination (NAC)
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial - Network Aware Coordination
  what_happened: The NAC algorithm was successfully developed from basic research
    to a robust live implementation over three years, demonstrating a 34% reduction
    in diesel consumption during peak periods on Bruny Island through coordinated
    dispatch of 31–32 customer-owned solar and battery systems.
  lesson_learnt: A distributed optimisation algorithm (NAC/ADMM) can successfully
    coordinate DER to manage network constraints in live operations, achieving better
    outcomes than manual dispatch or uncoordinated batteries — and the approach is
    scalable and privacy-preserving, making it viable for broader deployment.
