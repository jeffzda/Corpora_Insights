- record_id: ARENA-DLV-30851
  source_title: CONSORT - Project Results and Lessons Learnt
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: Short-term load forecasting proved to be a critical and initially
    underperforming component of the NAC battery orchestration system. Manual dispatch
    and early regression-based forecasting caused over-dispatch or missed network
    peaks; only a later advanced transformer neural network forecasting engine delivered
    reliable performance.
  lesson_learnt: Future distribution optimisation projects should treat load forecasting
    as a critical input from the outset and assign adequate development effort — poor
    forecasts cause over-dispatch or missed peaks, directly undermining the value
    of battery orchestration.
