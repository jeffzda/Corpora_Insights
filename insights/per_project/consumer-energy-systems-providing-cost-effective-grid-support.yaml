- record_id: ARENA-DLV-49510
  source_title: CONSORT - Social Science Report
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: When householders became frustrated or confused by the complexity
    of the DER system, some adopted a 'set and forget' coping strategy (disengaging
    from monitoring), while others opted out of network support entirely. Disengaged
    households risked missing technical faults, and those who opted out reduced the
    available DER resource.
  lesson_learnt: Design DER programs to anticipate disengagement coping strategies
    — ensure the system can flag faults without relying on active householder monitoring,
    and make the opt-out pathway visible so that it can be tracked and addressed before
    it undermines network support objectives.
