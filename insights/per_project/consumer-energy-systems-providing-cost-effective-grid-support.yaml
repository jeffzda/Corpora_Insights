  source_title: CONSORT - Reward Structures Report
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: The Shapley value reward structure discriminated meaningfully between
    customers based on their phase connection, with batteries on the phase responsible
    for setting diesel dispatch level (blue phase) receiving substantially higher
    payments than those on other phases — reflecting the unequal network value of
    contributions under conditions of large phase imbalance.
  lesson_learnt: Value-reflective DER payment structures will produce materially unequal
    customer payments in networks with significant phase imbalance, as the Shapley
    value correctly rewards contributions to the binding constraint — program designers
    and DNSPs should anticipate and communicate this heterogeneity to customers before
    deployment to avoid perceptions of unfairness.
