  what_happened: Customers showed no discernible preference or behavioural difference
    between receiving payment notifications before (Energy Reserve) or after (Energy
    Use) network support events, contrary to the team's prior conjecture that customers
    might be averse to having their battery used without advance payment certainty.
  lesson_learnt: DER network support program designers should not assume customers
    require advance payment notification to participate willingly — the absence of
    preference between pre- and post-event payment timing in the Bruny Island trial
    suggests that trust in the program or broader understanding of the technology
    may be more salient than payment timing, and post-event (actual use) payment structures
    are simpler to implement without reducing customer acceptance.
