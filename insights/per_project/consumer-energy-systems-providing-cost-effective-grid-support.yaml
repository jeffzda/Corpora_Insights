- record_id: ARENA-DLV-49528
  source_title: CONSORT - Social Science Report
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: Eleven of 30 households at year-one interviews reported there was
    insufficient detail in the Reposit app to make informed choices about network
    support payment types — they could not see price per kWh, the kilowatts traded
    from their batteries, or the workings behind summary grid credit amounts.
  lesson_learnt: DER platform interfaces must provide granular, transparent data on
    energy traded and payment calculations if householders are to make informed decisions
    about network support participation — summary credit displays without underlying
    data are insufficient and undermine trust and engagement.
