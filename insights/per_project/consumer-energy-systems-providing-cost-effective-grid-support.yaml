- record_id: ARENA-DLV-49526
  source_title: CONSORT - Social Science Report
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: The overall complexity of the CONSORT system — combining PV, battery,
    Reposit controller, NAC, tariff changes, and network support payments — was experienced
    by a significant number of householders as overwhelming and lacking in transparency.
    Some participants concluded in the final focus group that they would prefer centralised
    renewable energy solutions (e.g. solar farms) over the complexity of household
    DER participation.
  lesson_learnt: The cumulative complexity of multi-component household DER systems
    is a meaningful barrier to participation at scale — programme designers must actively
    reduce perceived complexity through simplified interfaces, clearer communication,
    and streamlined householder obligations, or risk participants rejecting the model
    entirely in favour of passive consumption.
