  project_name: CONSORT Bruny Island Battery Trial
  what_happened: Installer quotes provided to customers during the selection process
    were found to be significantly less detailed than the specifications submitted
    to TasNetworks for subsidy assessment — installers added the required detail only
    for the TasNetworks submission, leaving customers with less information to make
    informed decisions.
  lesson_learnt: Subsidy programs requiring technical specification submissions should
    mandate that the quote provided to the customer is identical to the one submitted
    for program assessment — separate customer-facing and regulator-facing quote formats
    create an information asymmetry that undermines informed consumer decision-making.
