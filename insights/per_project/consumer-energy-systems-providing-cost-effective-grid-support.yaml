  project_name: CONSORT Bruny Island Battery Trial - Network Aware Coordination
  what_happened: An extended 21-day test period (April school holidays, TP180413)
    with no network peaks was deliberately used to test NAC for long-duration operation,
    specifically to surface bugs that only manifest over time such as memory leaks
    and overflows; no issues were observed.
  lesson_learnt: Software-intensive DER coordination systems should be validated through
    extended continuous operation periods — not just during peak events — to surface
    time-dependent software faults such as memory leaks; scheduling dedicated long-run
    test periods alongside event-driven trial periods is a low-cost quality assurance
    measure.
