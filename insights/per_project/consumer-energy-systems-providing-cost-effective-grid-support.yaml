- record_id: ARENA-DLV-26517
  source_title: CONSORT - Network Aware Coordination (NAC)
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial - Network Aware Coordination
  what_happened: The NAC was designed to use actual negotiated prices for optimal
    dispatch, but participants were paid using a separate, simpler scheme ($1/kWh
    for network support via energy reserve or energy use methods) rather than the
    mathematically derived NAC prices, because implementing actual NAC price-based
    payments was considered out of scope.
  lesson_learnt: DER coordination projects should explicitly address the gap between
    optimisation-derived prices and participant payment structures at design stage
    — a mismatch between dispatch incentives and actual reward structures may limit
    participant trust, fairness of remuneration, and the full economic efficiency
    gains of the coordination system.
