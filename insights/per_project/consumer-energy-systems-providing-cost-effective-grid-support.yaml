  project_name: CONSORT Bruny Island Battery Trial
  what_happened: The technology installation process was not a discrete event but
    a diffuse, often protracted process for most households. Installers varied greatly
    in the education and support they provided, and most lacked capacity for follow-up
    support. TasNetworks and Reposit had to provide support well above what would
    be feasible outside a subsidised trial context.
  lesson_learnt: Devote dedicated resources (people, time, expertise, money) to household
    DER installation, and consider incorporating installers into the project or policy
    team from the design stage — variable installer quality significantly affected
    household satisfaction and ongoing trial engagement.
