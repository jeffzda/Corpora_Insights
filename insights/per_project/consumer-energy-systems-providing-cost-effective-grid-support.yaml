  source_title: CONSORT - Social Science Report
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: Industry partners assumed householders would be willing to share
    their battery with the network if adequately compensated financially. Trial findings
    showed this was not necessarily the case — battery backup during outages was a
    priority for many households, particularly in the rural Bruny Island context with
    above-average network outages.
  lesson_learnt: Do not assume financial compensation is sufficient to secure household
    participation in DER network support — particularly in rural or outage-prone areas
    where battery backup is highly valued; programme design must explicitly account
    for the tension between network use and household backup needs.
