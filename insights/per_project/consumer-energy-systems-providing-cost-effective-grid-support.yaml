  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: Consumer uptake rates for participation in the Consumer Power Station/DER
    trial were slower than hoped, and the social science component on Bruny Island
    showed that consumer participation remained uncertain despite the most thorough
    social science program in Australia at the time.
  lesson_learnt: Do not assume consumer participation rates will meet projections
    in DER trials — even well-resourced trials with dedicated social science components
    encounter uncertain and slower-than-expected uptake; plan contingency around participation
    assumptions when sizing trial outcomes.
