  intervention_note: Developed a Shapley value approximation heuristic that was successfully
    integrated with NAC software and deployed in the Bruny Island field trials, though
    participants continued to be paid the flat $1/kWh baseline rate.
  transferability: moderate
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id042
