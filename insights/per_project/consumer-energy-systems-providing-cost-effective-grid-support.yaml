  project_name: CONSORT Bruny Island Battery Trial
  what_happened: A mismatch between minimum state-of-charge settings in the inverter
    and the Reposit controller caused the orchestration system to overestimate available
    battery energy, leading to underperformance toward the end of dispatch events
    in early network support trials.
  lesson_learnt: When deploying battery systems with third-party controllers, verify
    that minimum state-of-charge settings are aligned across all layers of the control
    stack (inverter firmware, battery BMS, and aggregator controller) before commissioning
    — mismatches will cause the orchestration system to over-commit energy and underperform
    during dispatch.
