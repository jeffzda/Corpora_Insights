  what_happened: Householders' emotional responses to the new DER technology — including
    joy, anxiety, anger, and frustration — significantly shaped their ongoing engagement
    with the trial. Nine of 32 longitudinally analysed households expressed predominantly
    negative emotions, leading some to adopt coping strategies such as 'set and forget'
    disengagement or considering opting out of network support.
  lesson_learnt: DER program communication strategies that focus only on technical
    information risk limiting uptake; household emotional responses must be factored
    into program design because disengaged householders may miss potentially hazardous
    technical faults and be less likely to remain participants.
