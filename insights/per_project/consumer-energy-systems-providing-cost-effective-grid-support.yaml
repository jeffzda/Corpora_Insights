  what_happened: Retailers seeking to participate in NEM ancillary markets with DER
    faced significant barriers including an extensive regulatory authorisation process,
    a 1 MW integer bid requirement, and high-speed metering constraints — all of which
    were encountered in the context of the CONSORT trial.
  lesson_learnt: DER aggregation projects targeting ancillary market revenue should
