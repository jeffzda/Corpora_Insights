  what_happened: Because each DER technology component (PV, inverter, battery, Reposit
    controller) was supported by a different vendor, no single party had overall responsibility
    for the integrated DER system. Householders needing whole-of-system support and
    troubleshooting had nowhere to turn except installers and TasNetworks, creating
    an unsustainable support burden.
