  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: The NAC was demonstrated operating on Bruny Island using only an
    11kV network model and did not extend to the LV network level, because — like
    almost all Australian networks except Evoenergy — TasNetworks had poor data on
    its LV network.
  lesson_learnt: Poor LV network data is a near-universal constraint for Australian
    distribution networks and will limit the fidelity of any DER coordination or network-aware
    dispatch system; projects should assess and budget for LV data collection early,
    or design systems that can operate with degraded network models and improve over
    time.
