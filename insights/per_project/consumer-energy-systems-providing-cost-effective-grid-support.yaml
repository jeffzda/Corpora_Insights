  source_title: CONSORT - Participant System Financial Performance
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: 'The Tasmanianlegacy Tariff 41 structure for heating and hot water
    created a significant complication for participants considering switching to TOU
    tariffs: moving to TOU required moving all load to the new tariff, meaning that
    heating and hot water costs that had been low under Tariff 41 could substantially
    increase, potentially negating TOU benefits.'
  lesson_learnt: In jurisdictions with legacy controlled-load tariff structures (such
    as Tasmania's Tariff 41), tariff transition pathways for residential battery trial
    participants must be individually assessed — blanket advice to switch to TOU can
    be financially harmful for participants with significant heating and hot water
    loads that were previously on advantageous controlled-load tariffs.
