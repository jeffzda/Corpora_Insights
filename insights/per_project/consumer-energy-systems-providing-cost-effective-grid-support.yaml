  source_title: CONSORT - Reward Structures Report
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: The heuristic flat-rate payment ($1/kWh dispatched) used throughout
    most of the trial likely inflated customer rebates above the actual economic value
    of network support as measured by diesel fuel cost reductions, with the economically
    justified price estimated closer to $0.50/kWh.
  lesson_learnt: When setting DER network support payment rates for a trial, calibrate
    the rate against actual avoided network costs (e.g. diesel fuel cost reductions)
    rather than round-number proxies — using twice the economically justified rate
    may be acceptable for a demonstration trial but will overstate the commercial
    viability of the network support value stream in NPV projections.
