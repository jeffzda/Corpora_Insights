- record_id: ARENA-DLV-49529
  source_title: CONSORT - Social Science Report
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: The social research sample was skewed toward older householders (driven
    by home ownership requirements and Bruny Island demographics), with very few participants
    aged 25–44. This constrained the transferability of findings to younger demographic
    cohorts and left a gap in understanding DER responses across the full age distribution.
  lesson_learnt: DER trial participant selection processes that require home ownership,
    island or rural residency, or other restrictive criteria will systematically under-represent
    younger demographics — future trials should assess sample representativeness against
    target deployment populations and, where feasible, design selection criteria to
    achieve broader demographic coverage.
