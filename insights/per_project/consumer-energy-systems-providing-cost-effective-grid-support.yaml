  project_name: CONSORT Bruny Island Battery Trial
  what_happened: Some participants had battery systems with average daily utilisation
    well below 4 kWh per day, indicating the battery was undersized relative to generation
    capacity or over-sized relative to household load. Analysis showed battery daily
    load-shifting ranged from 2.5 to 6 kWh with a 4 kWh average, and systems below
    4 kWh were considered ill-sized for the household.
  lesson_learnt: Battery sizing for residential installations should be carefully
    matched to both household load profile and PV system size — systems with average
    daily utilisation below 4 kWh are likely ill-matched to their generation or load
    context, reducing the financial return on the battery investment.
