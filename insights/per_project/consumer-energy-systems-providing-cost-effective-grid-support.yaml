  source_title: CONSORT - Project Results and Lessons Learnt
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: Customer participation in the orchestration algorithm was found not
    to be guaranteed or predictable. Householders had unexpected energy needs, emergencies,
    and varying willingness to engage, meaning the algorithm assumptions about household
    behaviour were not always met. Some households considered opting out of network
    support when the technology clashed with their priorities.
  lesson_learnt: Customer engagement, management and retention must be designed into
    orchestration algorithms from the outset — algorithms that are misaligned with
    household needs and priorities risk customer dissatisfaction and opt-out, directly
    reducing the effectiveness of network support services.
