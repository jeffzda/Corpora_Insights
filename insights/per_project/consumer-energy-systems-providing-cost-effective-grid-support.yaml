- record_id: ARENA-DLV-49509
  source_title: CONSORT - Social Science Report
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: Nine of 32 longitudinally analysed households expressed predominantly
    negative emotions (anxiety, frustration, anger) about the technology and installation
    experience. For two households, negative emotions persisted to the end of the
    trial, resulting in them withdrawing from network support and using the battery
    only for personal backup.
  lesson_learnt: Do not dismiss householder emotional responses to DER technology
    as irrational — negative emotions often signal real gaps in information, trust,
    or system performance, and communication strategies that focus only on technical
    information may limit uptake; plan for emotion-aware engagement throughout the
    deployment.
