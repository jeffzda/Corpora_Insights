- record_id: ARENA-DLV-49527
  source_title: CONSORT - Social Science Report
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: 'Householder motivations for participating in the trial were diverse
    and extended well beyond finances: environmental and sustainability motivations
    were mentioned 29 times, community care 17 times, interest in technology 16 times,
    being part of a trial 15 times, and network-aware motivations 11 times — compared
    to financial motives at 56 times. Six households were motivated solely by finances.'
  lesson_learnt: DER programme incentive design that relies only on financial rewards
    will fail to engage a significant proportion of potential participants — programme
    design should surface and accommodate the range of non-financial motivations (environmental,
    community, self-sufficiency, backup) that drive household DER participation.
