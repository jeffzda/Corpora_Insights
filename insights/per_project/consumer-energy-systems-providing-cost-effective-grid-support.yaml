- record_id: ARENA-DLV-49523
  source_title: CONSORT - Social Science Report
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: Competition and data-sharing rules prevented key system data (such
    as accurate tariff information) from being shared between trial participants (TasNetworks,
    Reposit, Aurora). This meant that important details affecting DER performance
    could not be reliably cross-checked between organisations, creating persistent
    data quality problems at scale.
  lesson_learnt: Regulatory data-sharing constraints between energy market participants
    can undermine DER programme performance — identify data-sharing barriers between
    all relevant organisations before programme design is finalised, and either resolve
    them with regulators or design data flows that do not require restricted data
    exchange.
