  source_title: CONSORT - Network Aware Coordination (NAC)
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial - Network Aware Coordination
  what_happened: The CONSORT project initially used a linear regression-based load
    predictor but switched to a neural network-based forecasting method on 16 July
    2018; simulations showed that a perfect load forecast would yield only a modest
    3.5% further improvement in costs over the actual NAC implementation, suggesting
    the forecasting module was not the dominant limiting factor.
  lesson_learnt: Improving load forecasting accuracy yields diminishing returns for
    DER coordination systems once a reasonably good forecast is in place — a 3.5%
    cost improvement ceiling from perfect forecasting suggests deployment effort is
    better directed at increasing DER participation rates and enabling reactive power
    control than further refining load prediction.
