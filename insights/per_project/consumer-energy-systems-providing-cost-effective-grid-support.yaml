  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: The battery installation process took far longer than planned due
    to supply issues with batteries, installations completed across multiple visits
    sometimes spanning months, technology unfamiliarity among installers, and the
    limited cash flow of small installer businesses. Safety inspection requirements
    and defect rectification extended timelines further.
  lesson_learnt: DER rollout programs should account for extended installation timelines
    when installers are small businesses unfamiliar with new technology — supply chain
    issues, multi-visit installations, and mandatory safety inspections each compound
    delays; program scheduling should build in conservative installation periods and
    pre-qualify financially capable installers.
