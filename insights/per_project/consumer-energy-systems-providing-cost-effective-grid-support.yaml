- record_id: ARENA-DLV-23002
  source_title: CONSORT - Participant System Financial Performance
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: Revenue meter data collected by energy retailers for billing purposes
    was not available to the analysis team at the time of analysis. This prevented
    independent verification of the detailed time-series data and limited options
    for estimating financial performance in cases where significant chunks of time-series
    data were missing.
  lesson_learnt: Establish data-sharing agreements with energy retailers to obtain
    revenue meter interval data before a trial commences — the absence of this independent
    verification source limited the ability to cross-check Reposit-measured data and
    to recover financial performance estimates for participants with data gaps.
