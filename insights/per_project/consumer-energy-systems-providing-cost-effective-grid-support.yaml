- record_id: ARENA-DLV-32354
  source_title: CONSORT - Reward Structures Report
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: The Energy Reserve payment type — which paid customers based on forecast
    battery use before a peak event — generated payments for peak events that did
    not ultimately eventuate, because the NAC settings are biased to prepare for a
    peak even when none occurs.
  lesson_learnt: Avoid pre-event (forecast-based) payment structures for DER network
    support programs where false peak activations are possible — post-event (actual
    use) payment types eliminate the 'false peak' payment problem and are preferable
    from a DNSP and aggregator perspective, unless pre-commitment by customers is
    operationally essential.
