- record_id: ARENA-DLV-49524
  source_title: CONSORT - Social Science Report
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: Differential (variable) pricing based on individual battery value
    to the network was not actually applied to household payments during the trial
    — all households received a flat rate of $1/kWh throughout. The Shapley heuristic
    was only tested alongside NAC near the end of the trial and not exposed to householders
    in real-time, limiting learning about household responses to variable pricing.
  lesson_learnt: When a trial is designed to test novel payment mechanisms, ensure
    they are actually implemented with real household payments — testing pricing mechanisms
    only in simulation or alongside but not applied to actual payments means the trial
    generates no evidence on real household behavioural responses to those mechanisms.
