  source_title: CONSORT - Project Results and Lessons Learnt
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: Battery orchestration through the NAC platform approximately doubled
    the diesel reduction value of the battery/solar systems compared to batteries
    operating without orchestration. Solar alone contributed only 4% diesel reduction,
    unorchestrated batteries achieved 12%, and orchestrated batteries together achieved
    approximately 33% reduction.
  lesson_learnt: Network orchestration is the critical multiplier for DER grid support
    value — batteries alone optimising for individual customer behaviour deliver only
    a fraction of the network benefit achievable through coordinated dispatch; future
    programs should invest in orchestration capability rather than relying on passive
    DER participation.
