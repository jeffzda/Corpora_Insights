- record_id: ARENA-DLV-23001
  source_title: CONSORT - Participant System Financial Performance
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: Of 34 participant systems in the trial, only 19 had data of sufficient
    quality for full financial benefit analysis. The remaining 15 systems each had
    one or more data validity issues, with the most common issue (affecting 9 systems)
    being an implied average battery efficiency greater than 100% over extended periods
    — a physical impossibility indicating faulty measurements.
  lesson_learnt: When deploying residential battery trials, implement data validation
    checks — including rolling implied efficiency calculations — before analysis begins;
    invalid data from nearly half of all systems can preclude benefit analysis for
    those participants and should be flagged and investigated in real time rather
    than discovered at close-out.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: research organisation/university
  delay_category: data/validation/testing
  failure_mode: data & measurement
  outcome_class: partial success
  secondary_failure_mode: null
  intervention_note: Data validity thresholds (implied efficiency >100%, implied efficiency
    <70%, negative total load >100 kWh/year) were defined and applied post-hoc to
    screen systems; 19 of 34 systems passed and were included in detailed analysis.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id006
  - 10
  - 11
  evidence_excerpt: Based on these defined criteria for data acceptability, data for
    19 out of 34 participant systems was deemed to be complete (or sufficiently complete)
    and free of any significant data validity issues. The remaining 15 systems each
    had one or more data validity issue identified. The most common data validity
    issue observed (9 systems) was that of implied average battery efficiency being
    > 100% for an extended period.
