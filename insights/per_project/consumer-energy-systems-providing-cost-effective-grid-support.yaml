- record_id: ARENA-DLV-30861
  source_title: CONSORT - Project Results and Lessons Learnt
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: The financial opportunity cost to householders of allowing their
    batteries to participate in coordinated network support was found to be very small
    — no higher than $7 per participant over a 12-month period (average $1.40) — while
    network support payments averaged $115 per participant over the same period.
  lesson_learnt: The opportunity cost of enrolling household batteries in coordinated
    network support is negligible relative to the network support revenue earned;
    future programs can confidently design for battery orchestration without significant
    concern about displacing household benefit, particularly where network constraints
    are frequent.
