  what_happened: Some inverter types installed by participants limited battery discharge
    power capability below what the battery hardware itself could sustain, reducing
    the effective network support capacity available from those systems.
  lesson_learnt: In DER trials where participants select their own hardware, screen
    for inverter–battery compatibility with respect to peak discharge capability before
    installation — inverter limitations can silently cap network support performance
    below the intended system specification.
