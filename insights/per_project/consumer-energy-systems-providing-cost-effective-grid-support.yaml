  what_happened: Participants on flat-rate tariffs received no financial benefit from
    the Reposit TOU optimisation algorithm, since optimised TOU arbitrage requires
    a time-varying tariff. Analysis confirmed that the Reposit controller operated
    identically to a simple self-consumption maximisation (SCM) algorithm for flat-rate
    customers.
