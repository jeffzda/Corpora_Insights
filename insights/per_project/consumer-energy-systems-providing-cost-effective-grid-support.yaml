- record_id: ARENA-DLV-49518
  source_title: CONSORT - Social Science Report
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: The TOU tariff change process involved multiple steps (decision,
    meter changeover, notification to Reposit) and was poorly communicated to households.
    A significant number of households did not switch to TOU despite financial analysis
    showing they would be better off doing so. Several households did not know what
    tariff they were on even a year after installation, and Reposit frequently held
    incorrect tariff data.
  lesson_learnt: Map out all pricing and tariff intervention steps exhaustively before
    a DER trial begins, ensure each step has a clearly assigned responsible party,
    and build in verification checkpoints — the compounding complexity of multi-step
    tariff transitions creates persistent data quality and financial performance problems
    that are very difficult to remediate mid-trial.
