  source_title: CONSORT - Social Science Report
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: DER technology installation was treated in early trial planning as
    a discrete, one-off event, but in practice it was a diffuse, multi-month process
    involving multiple actors, organisations, components, inspections, and financial
    negotiations. For most households the process was slower and more complex than
    expected.
  lesson_learnt: Do not treat DER installation as a simple one-off event — plan for
    a multi-stage, multi-actor process requiring dedicated resources (people, time,
    expertise, money) and include installers as core members of the project team from
    the design stage.
