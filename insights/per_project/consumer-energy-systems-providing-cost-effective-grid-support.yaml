- record_id: ARENA-DLV-32704
  source_title: CONSORT - Lessons Learnt During Trial Deployment
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: Single points of failure in the demand response chain (the Reposit
    platform and the NAC algorithm) experienced outages during the trial. Although
    none coincided with a peak event, the architecture meant that a platform failure
    during a peak could have caused all demand response services to fail simultaneously.
  lesson_learnt: DER orchestration platforms represent systemically critical infrastructure;
    future projects should explicitly assess single-point-of-failure risks across
    the demand response chain and design in sufficient redundancy — particularly for
    platform components whose failure would disable all participating assets simultaneously.
