  what_happened: Voltage control in CONSORT was demonstrated only at the 11 kV medium
    voltage network level; the project found that targeting the low voltage network
    — where a single battery near the end of an LV feeder could have far greater local
    voltage impact — was not possible due to limited LV network visibility.
  lesson_learnt: Future DER voltage control trials should target the LV network rather
    than MV, and must invest in LV network visibility (metering, topology data) before
    trial commencement — without LV visibility, voltage control demonstrations are
    limited to MV where individual DER impact is significantly weaker.
