- record_id: ARENA-DLV-32706
  source_title: CONSORT - Lessons Learnt During Trial Deployment
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: Most installed battery systems had defects requiring rectification
    before they could be approved — common faults included missing or misplaced labels,
    switches without adequate protection from unintended operation, and wiring issues
    or loose terminals. The defect rate did not decline meaningfully with installer
    experience.
  lesson_learnt: DER programs relying on third-party installers should build mandatory
    quality inspection into the installation workflow and not assume defect rates
    will improve over time; programme designs should also require installers to include
    adequate system handover time in their quotes rather than competing solely on
    price.
