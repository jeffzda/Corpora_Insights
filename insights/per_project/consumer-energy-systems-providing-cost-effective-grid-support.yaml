  source_title: CONSORT - Lessons Learnt During Trial Deployment
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: Batteries on flat energy tariffs were found to increase peak demand
    in the morning (by storing excess solar or remaining flat) rather than contributing
    to peak reduction, while batteries on time-of-use tariffs delivered significantly
    greater network and customer value by discharging at peak times.
  lesson_learnt: DER orchestration programs and network constraint management schemes
    should actively promote time-of-use tariffs for participating customers — flat
    tariff batteries can actively worsen morning peaks and deliver negligible incremental
    customer value, while time-of-use tariffs align customer and network interests
    simultaneously.
