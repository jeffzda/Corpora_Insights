- record_id: ARENA-DLV-26516
  source_title: CONSORT - Network Aware Coordination (NAC)
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial - Network Aware Coordination
  what_happened: The NAC negotiation requires approximately five minutes to find a
    solution for each 24-hour horizon; if communications outages occur or convergence
    fails within this window, participating batteries may act on older, outdated horizons
    rather than the current optimal plan.
  lesson_learnt: Real-time DER coordination systems operating on fixed negotiation
    windows must include fallback behaviour specifications for communications failures
    or convergence timeouts — acting on stale plans can degrade network constraint
    management outcomes and should be treated as a design risk requiring explicit
    mitigation.
  issue_severity: minor
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated integration
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: The system was designed so that even horizons that did not converge
    within the desired tolerance were assessed for acceptability ('acceptable' convergence),
    and the best available solution was used; 960 of 982 horizons in the Queen's Birthday
    trial converged fully.
  transferability: moderate
  delay_magnitude: null
  technology_domain: DER
