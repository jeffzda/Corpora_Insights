- record_id: ARENA-DLV-32714
  source_title: CONSORT - Lessons Learnt During Trial Deployment
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: The timing of payment notifications (before vs. after dispatch events)
    had little effect on customer behaviour. The phase-dependent pricing structure
    — which was the strongest determinant of payment size — was not explained to most
    customers and was difficult for them to understand.
  lesson_learnt: Payment timing (pre- vs. post-event notification) is unlikely to
    be a meaningful lever for customer engagement in DER orchestration programs; the
    stronger focus should be on simplifying pricing signals and ensuring customers
    understand what determines their payment — complexity that cannot be explained
    in accessible terms will not drive participation.
