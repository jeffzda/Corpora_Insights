  source_title: CONSORT - Network Aware Coordination (NAC)
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial - Network Aware Coordination
  what_happened: The project found that distribution networks suffer from widespread
    poor data visibility — network configuration data is often patchy, only available
    in mixed formats including hardcopy, phasing is frequently unknown, metering is
    sparse and may be inaccurate, and switching state may not be discoverable — creating
    a persistent challenge for any DER coordination system.
  lesson_learnt: DER coordination projects should not assume adequate distribution
    network data will be available from DNSPs — budget for data discovery, validation,
    and potentially developing bespoke tools to infer network state from available
    smart meter and SCADA data; this is a systemic industry problem not resolvable
    within a single project timeframe.
