- record_id: ARENA-DLV-32355
  source_title: CONSORT - Reward Structures Report
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: Forecast-based Energy Reserve payments were found to be materially
    inaccurate because individual household load forecasts are highly volatile (no
    large-number smoothing effect) and optimal power flow solutions are notoriously
    sensitive to network conditions, causing Energy Reserve payments to diverge significantly
    from the actual energy dispatched.
  lesson_learnt: Individual household load forecasts are too volatile to serve as
    a reliable basis for DER network support payments — power flow solutions are highly
    sensitive to these inputs and the resulting pre-event payments can differ materially
    from the actual network support value delivered; post-event metered payment designs
    are more accurate and defensible.
