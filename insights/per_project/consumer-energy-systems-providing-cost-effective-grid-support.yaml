- record_id: ARENA-DLV-32712
  source_title: CONSORT - Lessons Learnt During Trial Deployment
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: The Reposit Power VPP optimisation software was not initially compatible
    with the NAC network optimisation algorithm's negotiation protocol, requiring
    ANU to develop a modified DER optimiser that retained Reposit's core capabilities
    while adding NAC compatibility. This was a significant integration challenge.
  lesson_learnt: When combining a VPP aggregator platform with a network-level orchestration
    algorithm, do not assume out-of-the-box software compatibility — existing VPP
    optimisers are unlikely to be compatible with distribution-level network optimisation
    protocols and dedicated integration work (or an open reference interface standard)
    will be required.
