- record_id: ARENA-DLV-30852
  source_title: CONSORT - Project Results and Lessons Learnt
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: The Shapley value reward structure, initially identified as the most
    principled approach to value-reflective pricing of battery network support, proved
    computationally infeasible for generating real-time or day-ahead spot prices.
    Severe approximations were required for any practical deployment, and these approximations
    undermined the method's reliability for more complex multi-value-stream problems.
  lesson_learnt: Do not rely on direct Shapley value computation for real-time or
    near-real-time network support pricing — it is computationally infeasible at operational
    timescales; instead, consider offline computation with regression-based implementation
    as a viable path to value-reflective pricing.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
