- record_id: ARENA-DLV-5955
  source_title: CONSORT - Commercialisation Plan
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: The NAC technology was perceived by the market as an overly complex
    solution, causing it to lose ground to simpler Dynamic Hosting Capacity Engine
    (DHCE) alternatives that attracted ARENA and other funding, even though the document
    argues the NAC is technically and economically superior.
  lesson_learnt: A technically superior but complex DER coordination solution can
    lose commercial momentum to simpler alternatives if its value proposition is not
    communicated clearly and early — projects developing novel platform technologies
    should invest in market education and accessible technical communication alongside
    the core R&D program.
