- record_id: ARENA-DLV-30854
  source_title: CONSORT - Project Results and Lessons Learnt
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: Householder participation in the DER trial was not uniformly forthcoming.
    Of 119 applicants, 46 received offers and only 34 ultimately installed systems.
    Responses to the technology varied widely — some households engaged with the Reposit
    app regularly while others never downloaded it, and some were responsive to price
    signals while others were not.
  lesson_learnt: DER program designers should not assume householders are willing,
    uniform, or predictable participants — projections and modelled scenarios should
    be substantiated with real-world social research data, and program design must
    account for diverse household responses.
