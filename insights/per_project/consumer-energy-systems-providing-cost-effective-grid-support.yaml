  source_title: CONSORT - Reward Structures Report
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: The sample-based Shapley value computation method (Algorithm 1) required
    up to 200 hours of computation time for 34 customers (~5000 NAC instances), which
    could only be reduced to approximately 10 hours even with high-performance algorithms
    and multi-core hardware — far exceeding the trial's 1–2 hour computational wall
    time requirement.
  lesson_learnt: Before committing to a Shapley value-based reward structure for real-time
    DER network support payments, validate computational feasibility against the system's
    timing requirements — for 34 customers, exact or sample-based Shapley value computation
    is incompatible with near-real-time pricing and must be replaced with an approximation
    method designed for the available time budget.
