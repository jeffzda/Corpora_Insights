- record_id: ARENA-DLV-23003
  source_title: CONSORT - Participant System Financial Performance
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: The battery control algorithm (Reposit) made scheduling decisions
    based on load calculations that did not account for inverter DC-AC and DC-DC conversion
    losses, because measurements were taken on the DC side while load and revenue
    metering was on the AC side. This resulted in sub-optimal battery scheduling and
    an estimated annual benefit loss of approximately $20 per system.
  lesson_learnt: Battery optimisation controllers should explicitly account for power
    electronics conversion losses in their scheduling logic — failing to do so results
    in sub-optimal charge/discharge instructions and an estimated ~$20/year reduction
    in per-household financial benefit, which compounds across a large fleet.
  issue_severity: minor
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The analysis team modelled the impact using DC-DC efficiency
    of 98% and DC-AC efficiency of 96% and found the sub-optimal scheduling impact
    was small (~$20/year); they recommended future implementations account for converter
    losses appropriately.
  transferability: moderate
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id008
  - 16
  - 17
  evidence_excerpt: It is anticipated that the difference would likely be small, perhaps
    in the order of $20 over a one year period, but no such analysis has been done
    to determine this. Nonetheless, it would be easy and sensible for any future battery
    control implementations (either simple SCM, or forecast & optimisation) to ensure
    that converter losses are accounted for appropriately.
  confidence_note: null
  source_url: https://arena.gov.au/knowledge-bank/consort-participant-system-financial-performance/
