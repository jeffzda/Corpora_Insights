  project_name: CONSORT Bruny Island Battery Trial
  what_happened: The benefit of the Reposit optimisation algorithm (over simple SCM
    battery control) was negligible for TOU participants with low household loads,
    and increased with increasing average household load. Participants with low or
    irregular load patterns were found to be unsuitable target customers for the smart
    optimisation technology.
  lesson_learnt: Smart battery optimisation algorithms deliver the most value for
    households with high average loads on TOU tariffs — targeting these products at
    low-load households or flat-rate customers is likely to yield minimal incremental
    benefit over basic SCM control and should be reflected in customer segmentation
    strategies for future DER programs.
