- record_id: ARENA-DLV-49522
  source_title: CONSORT - Social Science Report
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: Holiday home and irregular-occupancy households (13 of 36 trial homes)
    had highly unpredictable energy loads from day to day and week to week, which
    negatively affected the performance of predictive algorithms in Reposit controllers.
    Similarly, households using a mix of wood, gas, and electric heating (18 of 36)
    had unpredictable electric loads that further undermined controller performance.
  lesson_learnt: DER controller algorithms that rely on load prediction are significantly
    degraded by irregular occupancy and multi-fuel heating configurations — screen
    for these characteristics during participant selection for grid-support programmes,
    or develop algorithm variants that accommodate high load variability.
