  what_happened: Between 6 July and 13 July 2018, the Reposit boxes failed to switch
    into NAC mode and effectively ignored all NAC messages, rendering that entire
    period invalid as a test of NAC effectiveness.
  lesson_learnt: Integration between third-party device controllers (e.g. Reposit
    boxes) and an overlying coordination system must be verified at each trial period
    commencement — silent failure where devices ignore coordination signals can invalidate
    entire test periods without obvious indication.
