  what_happened: Network-Aware Coordination (NAC)-driven network support payments
    averaged $115 per participant over 12 months, while the average cost of participation
    (the opportunity cost of battery capacity redirected from household optimisation
    to network support) was only $1.40 per participant — a ratio of approximately
