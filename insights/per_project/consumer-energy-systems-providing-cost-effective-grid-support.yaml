  source_title: CONSORT - Lessons Learnt During Trial Deployment
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: Installers generally lacked knowledge about grid participation and
    the operation of the battery controllers, leaving customers without adequate handover
    guidance on how their systems worked or how the grid participation component functioned.
    Installers did not allow sufficient handover time in their quotes due to competitive
    pricing pressure.
  lesson_learnt: DER orchestration programs cannot rely on installers to educate customers
    about grid participation — installers are typically ill-equipped and commercially
    incentivised against spending handover time; a trusted third party (e.g. the network
    business or program coordinator) should be explicitly resourced to fill this information
    and education role.
