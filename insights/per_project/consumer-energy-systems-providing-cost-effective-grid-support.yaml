  project_name: CONSORT Bruny Island Battery Trial - Network Aware Coordination
  what_happened: The NAC scope was explicitly limited to real power dispatch only;
    reactive power treatment was excluded from the project due to the need for additional
    technical work on inverter reactive power capabilities, limiting the system's
    ability to demonstrate full voltage control.
  lesson_learnt: Projects aiming to demonstrate voltage management via DER coordination
    should ensure inverter reactive power capability is included in scope from the
    outset — deferring reactive power to future work substantially constrains the
    voltage control results achievable within a trial.
