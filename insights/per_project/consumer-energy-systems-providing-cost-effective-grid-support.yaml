  source_title: CONSORT - Project Results and Lessons Learnt
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: The Time of Use (TOU) tariff change, which was not strictly part
    of the trial's core pricing interventions, dominated householder attention and
    overshadowed the specific network support payment treatments being trialled. A
    significant number of households did not switch to TOU despite financial benefit,
    and many remained uncertain what tariff they were on even a year after installation.
  lesson_learnt: Carefully map out all household pricing interventions when designing
    a DER trial — concurrent tariff changes can dominate the householder experience
    and confound the evaluation of the specific pricing interventions under test.
