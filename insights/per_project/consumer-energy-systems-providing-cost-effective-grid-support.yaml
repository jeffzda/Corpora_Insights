  what_happened: 'The Energy Reserve payment structure created a commitment problem:
    customers were paid in advance to reserve battery energy, but were not contractually
    bound to keep that energy available during the support period, creating a potential
    for strategic behaviour where customers could use the reserved energy for their
    own loads.'
  lesson_learnt: Pre-event reservation payment structures for residential DER must
    include binding commitment mechanisms — without them, customers are paid for energy
    reservation but face no obligation to maintain availability, creating a structural
    incentive for strategic behaviour that could undermine network support delivery
    at scale.
