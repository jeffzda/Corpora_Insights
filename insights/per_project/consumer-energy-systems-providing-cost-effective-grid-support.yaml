- record_id: ARENA-DLV-32720
  source_title: CONSORT - Lessons Learnt During Trial Deployment
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: The CONSORT trial demonstrated that customer-owned distributed battery
    storage, orchestrated via the NAC algorithm, delivered a 33% reduction in diesel
    generation on Bruny Island in 2018 across 24 peak events, with one occasion where
    all diesel generation was fully avoided — validating the core technical proposition
    of the trial.
  lesson_learnt: Orchestrated customer-sited DER can successfully manage real network
    constraints at a distribution level — trials of this type provide a viable template
    for deploying VPP-based constraint management as an alternative to network augmentation
    or diesel backup generation, provided the supporting data infrastructure and customer
    engagement model are in place.
