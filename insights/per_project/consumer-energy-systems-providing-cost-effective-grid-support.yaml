- record_id: ARENA-DLV-30860
  source_title: CONSORT - Project Results and Lessons Learnt
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: The financial benefit of battery systems to individual householders
    was highly variable and complex to calculate. Total annual energy savings ranged
    from $630 to $1,550, with individual component contributions requiring sophisticated
    modelling unavailable to householders. If a system was underperforming, householders
    had no practical means of detecting this themselves.
  lesson_learnt: DER programs should provide householders with simple, accessible
    tools or communications to monitor the financial performance of their system —
    the complexity of detailed benefit calculation means underperformance is likely
    to go undetected without such support, risking disengagement.
