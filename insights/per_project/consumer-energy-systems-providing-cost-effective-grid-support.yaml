- record_id: ARENA-DLV-32711
  source_title: CONSORT - Lessons Learnt During Trial Deployment
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: Customers were disappointed that the Reposit controller did not reserve
    battery energy for backup purposes during grid participation events, leaving homes
    without backup power when the grid failed. Some customers also found that their
    chosen inverter could not support certain appliances (e.g. the 2kW SolaX could
    not power a water pump).
  lesson_learnt: DER orchestration programs that also offer backup capability must
    clearly communicate to customers at the point of sale that grid participation
    and backup are competing uses of battery energy — and that the control system
    will prioritise grid participation; backup capacity limitations relative to specific
    appliance loads should also be disclosed upfront.
