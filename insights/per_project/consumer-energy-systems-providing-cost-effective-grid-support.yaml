  source_title: CONSORT - Lessons Learnt During Trial Deployment
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: Existing network measurement devices (reclosers, sectionalizers)
    returned low-quality metering data and experienced frequent communication dropouts
    because they are designed for protection rather than metering, creating a risk
    that the NAC orchestration algorithm could receive bad data during active network
    management events.
  lesson_learnt: Critical network devices used for DER orchestration should have redundant
    communications channels and be calibrated for metering purposes; orchestration
    algorithms should also be designed to detect and gracefully handle bad or missing
    data rather than assuming reliable real-time feeds.
