  what_happened: Retrofitting multi-component DER technology into existing homes proved
    consistently challenging. Each house required bespoke site design decisions regarding
    placement, fixing materials, aesthetics, ventilation, and safety signage. In some
    cases batteries were placed on north-facing walls or near bedroom walls causing
    noise nuisance, and some installations were visually intrusive.
  lesson_learnt: Conduct a site-specific design and retrofit planning visit before
    each DER installation day — on-site design decisions made under time pressure
    on installation day lead to poor aesthetic, safety, and performance outcomes;
    pre-visit planning is essential and must be resourced.
