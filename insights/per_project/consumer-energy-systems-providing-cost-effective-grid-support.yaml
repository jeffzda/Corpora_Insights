  project_name: CONSORT Bruny Island Battery Trial
  what_happened: Customer management, engagement and retention were handled across
    a distributed team (social science researchers, TasNetworks, Reposit Power, installers)
    rather than being integrated into the design of the orchestration algorithms.
    Outside a trial context this distributed support structure would not exist, creating
    a gap in the customer experience.
  lesson_learnt: Customer management, engagement, and retention should be explicitly
    designed into the orchestration algorithm and aggregator platform from the outset
    — the multi-party support structure available in a trial setting will not exist
    in commercial deployment, so the system itself must manage customer complexity
    and prevent opt-out.
