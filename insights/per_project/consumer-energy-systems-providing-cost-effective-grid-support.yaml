  source_title: CONSORT - Lessons Learnt During Trial Deployment
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: Orchestration through the NAC algorithm approximately doubled the
    value of customer battery/solar systems in reducing diesel consumption compared
    to unorchestrated battery operation (NAC contributed ~17% diesel reduction vs
    ~12% from batteries alone optimising for customer behaviour), demonstrating a
    significant incremental network benefit from orchestration.
  lesson_learnt: Network orchestration provides substantial incremental value over
    uncoordinated customer-optimised battery dispatch — future network constraint
    management programs should incorporate orchestration algorithms rather than relying
    on tariff signals alone, as orchestration roughly doubles the network benefit
    from the same installed battery capacity.
