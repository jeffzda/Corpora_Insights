  what_happened: The NAC technology, having successfully demonstrated network-aware
    DER coordination on Bruny Island, was not yet able to scale up to larger geographic
    areas or integrate NEMDE-compatible bidding, leaving critical commercialisation
    steps unfunded and undemonstrated at project close.
  lesson_learnt: Demonstration-scale DER coordination projects should include a funded
    pathway to scale-up in the original project design — key capabilities such as
    market bidding interfaces and multi-feeder operation that are needed for commercialisation
    are unlikely to emerge without a dedicated follow-on funding commitment.
