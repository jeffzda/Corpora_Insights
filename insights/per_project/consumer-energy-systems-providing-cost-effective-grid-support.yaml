- record_id: ARENA-DLV-32713
  source_title: CONSORT - Lessons Learnt During Trial Deployment
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: The Shapley value-based reward structures algorithm proved too computationally
    intensive for near-real-time deployment, with only one full trial of the complete
    Shapley calculation achieved. The complexity of phase-dependent pricing was also
    not communicated to customers and was difficult for them to understand.
  lesson_learnt: Value-reflective pricing algorithms for DER network services need
    to be computationally tractable for real-time use; near-term deployments should
    consider offline (e.g. annual) calculation, simplification by removing phase-dependence,
    and applying the pricing signal at the aggregator level rather than directly to
    customers.
