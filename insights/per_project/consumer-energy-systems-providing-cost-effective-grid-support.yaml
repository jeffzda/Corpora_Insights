  source_title: CONSORT - Lessons Learnt During Trial Deployment
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: Short-term load forecasting proved inadequate when NAC was first
    deployed using a simple regression-based model, causing either over-dispatch or
    under-dispatch of batteries. A neural network-based forecast replaced it on 16
    July 2018 and performed significantly better, successfully avoiding diesel generation
    on one occasion.
  lesson_learnt: Future distribution optimisation projects should treat load forecasting
    as a critical input from the outset and assign adequate development effort — an
    advanced forecast (e.g. neural network) is required for automated orchestration
    algorithms to dispatch accurately and avoid both over- and under-response.
