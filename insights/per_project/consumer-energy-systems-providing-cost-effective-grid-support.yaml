  source_title: CONSORT - Lessons Learnt During Trial Deployment
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: The Bruny Island voltage regulator failed in September 2018, requiring
    the project team to dispatch batteries under fixed dispatch to manage voltage
    — a use case that was only formally tested as a proof-of-concept in January 2019.
    The trial thus encountered a real voltage management need before the capability
    was fully developed.
  lesson_learnt: DER orchestration programs should include voltage control capability
    in scope from the outset, particularly in networks with high or growing DER penetration
    — voltage issues can arise unexpectedly (as with the Bruny Island regulator failure)
    and the ability to use orchestrated batteries for voltage support provides valuable
    network resilience.
