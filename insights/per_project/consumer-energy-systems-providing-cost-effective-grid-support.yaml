  project_name: CONSORT Bruny Island Battery Trial
  what_happened: Householders valued battery backup power at times of grid outages
    as highly as or more than financial rewards, particularly in the rural Bruny Island
    context where network outages were above average. This value for backup power
    created a tension with the orchestration system's need to discharge battery reserves
    for network support.
  lesson_learnt: In rural or reliability-constrained locations, battery backup value
    may outweigh financial network support incentives for some householders — DER
    program designers should account for backup power as a competing priority when
    designing orchestration rules and reward structures, rather than assuming financial
    incentives are the primary driver.
