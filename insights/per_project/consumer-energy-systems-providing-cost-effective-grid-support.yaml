- record_id: ARENA-DLV-32709
  source_title: CONSORT - Lessons Learnt During Trial Deployment
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: The subsidy design (based purely on battery power capacity at $3,200/kW)
    caused all 34 customers to install the largest available battery (5kW/10kWh),
    regardless of their actual energy consumption needs. Several participants had
    very low consumption and received limited return from their systems.
  lesson_learnt: Subsidy designs based solely on installed capacity create a distortion
    where participants maximise subsidy rather than selecting the best system for
    their load — future subsidy structures should incorporate consumption-based eligibility
    or household profiling (e.g. advanced meter baselines) to better match system
    size to actual customer needs.
