  source_title: CONSORT - Social Science Report
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: All trial households reported they would not have purchased a PV-battery
    system without the significant trial subsidy (average $16,000, maximum $17,200).
    Households contributed an average of $4,700 with a range of $2,000 to $26,600.
    Without the subsidy, the economics of the system were not compelling to this demographic.
  lesson_learnt: Household DER uptake in non-early-adopter demographics is highly
    subsidy-dependent at current technology costs — programme designers should not
    project voluntary adoption curves from early-adopter trial data when planning
    mainstream rollout, and should account for subsidy requirements explicitly in
    scaling models.
