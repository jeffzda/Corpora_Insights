- record_id: ARENA-DLV-26503
  source_title: CONSORT - Network Aware Coordination (NAC)
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial - Network Aware Coordination
  what_happened: During the Queen's Birthday trial, batteries were observed to be
    capacity-limited during evening peaks, and did not charge sufficiently overnight
    before the morning peak on the third day, reducing NAC effectiveness.
  lesson_learnt: Battery controller settings that cause devices to act 'as late as
    possible' — desirable under normal non-peak operation — can reduce peak response
    effectiveness; these settings should be reviewed and tuned for anticipated peak
    periods, and forward peak prediction should be improved to allow adequate pre-charging.
  issue_severity: minor
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: partial success
  secondary_failure_mode: data & measurement
  intervention_note: Identified as a tuning issue — improved load disaggregation parameters
    and very short-term load forecasting were implemented prior to or during the trial,
    improving cable current limiting compared to the Easter trial.
  transferability: moderate
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id023
  - 21
  - 22
  evidence_excerpt: We also saw that the batteries were capacity limited during the
    evening peaks, and that the batteries did not charge enough overnight during the
    morning peak of the third day. We believe this is due to the peak not being predicted
    far enough ahead of time, possibly interacting with settings that caused the Reposit
    controllers to act as late as possible, a feature that is deemed desirable under
    normal (non-peak) circumstances, but which may occasionally reduce the effectiveness
    of NAC.
