- record_id: ARENA-DLV-30862
  source_title: CONSORT - Project Results and Lessons Learnt
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: Batteries on flat energy tariffs were found to increase peak demand
    in the morning rather than reduce it, because they prioritised self-consumption
    optimisation (storing excess solar or being discharged) rather than network support.
    Time of Use tariffs significantly increased battery value for peak demand reduction.
  lesson_learnt: Flat energy tariffs can cause batteries to worsen rather than relieve
    network peaks in the morning — DER programs targeting network peak reduction should
    ensure participants are on Time of Use tariffs aligned with network peak periods
    to realise the intended network benefit.
