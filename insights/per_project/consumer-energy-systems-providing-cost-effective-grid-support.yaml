  what_happened: The CONSORT project demonstrated some voltage control capability
    using NAC toward the end of the project (trial periods TP190130 and TP190208),
    but was limited to real power dispatch only, and could not demonstrate strong
    voltage influence due to the limited number of batteries, presence of a network-level
    voltage regulator, and restricted visibility of the LV network.
  lesson_learnt: Voltage control via DER requires reactive power capability from inverters,
    good LV network visibility, and sufficient DER density — projects should not expect
    meaningful voltage demonstration from real-power-only DER coordination with limited
    participant numbers; enabling inverter VAR dispatch should be a design requirement
    for voltage-control-focused trials.
