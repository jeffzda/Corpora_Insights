  what_happened: Householder awareness of the Network Aware Coordination (NAC) system
    was very low throughout the trial. NAC was consistently confused with the Reposit
    controller even after re-explanation at the final focus group in February 2019.
    The lack of a physical device on the householder side made NAC intangible and
    difficult to conceptualise.
  lesson_learnt: Abstract software coordination layers in DER systems will not be
    understood or engaged with by householders unless given a tangible presence —
    if householder awareness of coordination mechanisms matters commercially, design
    communication and interface elements that make the coordination agent visible
    and distinguishable from in-home hardware.
