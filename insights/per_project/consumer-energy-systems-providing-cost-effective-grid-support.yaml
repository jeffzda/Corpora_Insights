  source_title: CONSORT - Social Science Report
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: The Reposit controller was configured to optimise solely against
    financial incentives (minimising the household energy bill). However, trial households
    also valued battery backup, environmental outcomes, community values, and self-sufficiency
    — motivations that were not captured or reflected in the controller's optimisation
    logic.
  lesson_learnt: DER controller optimisation assumptions that rely on price-only household
    motivation are too narrow — future system designs should allow controllers to
    incorporate a broader range of household preferences (backup, environmental, community),
    noting that creating user interfaces to quantify these values requires non-trivial
    development.
