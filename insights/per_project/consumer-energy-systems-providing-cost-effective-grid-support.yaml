  source_title: CONSORT - Network Aware Coordination (NAC)
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial - Network Aware Coordination
  what_happened: Simulations with 100 batteries (vs 31–32 in the live trial) showed
    diesel reduction improving from 34% to 74%, with NAC algorithm convergence performance
    (mean iterations 13.0) actually slightly better than the live trial, and worker
    solve times increasing only modestly (357 ms vs 316 ms per job) despite tripling
    participant count.
  lesson_learnt: The NAC distributed algorithm scales favourably — near-tripling the
    number of DER participants does not proportionally increase solve times, and larger
    participant pools can dramatically improve network constraint management outcomes;
    scaling to 100+ participants is technically feasible with modest additional computational
    resources.
