- record_id: ARENA-DLV-32353
  source_title: CONSORT - Reward Structures Report
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: The Shapley value approximation in Algorithm 2 was found to be poorly
    aligned with payment expectations when the NAC simultaneously managed both network
    voltages and thermal limits, because the approximations could not adequately incorporate
    the non-linear network effects of multiple simultaneous network management objectives.
  lesson_learnt: Shapley value approximations that linearise network effects are only
    reliable for single-objective network support problems (e.g. thermal limit management
    alone); do not use Algorithm 2-style approximations for multi-objective DER coordination
    (e.g. simultaneous voltage and thermal management) without further validation,
    as payment allocations will be materially inaccurate.
