- record_id: ARENA-DLV-49525
  source_title: CONSORT - Social Science Report
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: Embedded social research with frequent in-person household contact
    proved effective at identifying early-stage technology issues — the social research
    team identified multiple technical faults (e.g. non-charging batteries, tariff
    miscommunications) before they were detected by technical monitoring, because
    social researchers were in regular front-line contact with households.
  lesson_learnt: Embedding social researchers with regular in-person household contact
    in DER trials provides an early-warning system for technical and operational issues
    that technical monitoring alone misses — the value of this role should be explicitly
    planned and resourced as a quality assurance function, not just as a social science
    output.
