  source_title: CONSORT - Social Science Report
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: Trial households were not typical early adopters — the cohort was
    older (median age on Bruny Island 45.3 vs national average 37.4), included many
    retirees, and included a high proportion of holiday home owners with irregular
    occupancy patterns. These characteristics affected predictive algorithm performance,
    engagement with technology, and responsiveness to price signals.
  lesson_learnt: Business models and DER programme assumptions developed on early-adopter
    populations do not translate reliably to geographically or demographically targeted
    programmes with diverse, non-typical householder cohorts — validate assumptions
    about engagement, price responsiveness, and technology adoption with the actual
    target cohort before scaling.
