- record_id: ARENA-DLV-72283
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects - First Edition Results'
  publish_date: '2015'
  project_name: PNM Prosperity – Ecoult/PNM New Mexico (Project ID 216)
  what_happened: PNM New Mexico deployed a 500kW solar PV field co-located with 500kW of UltraBattery energy-smoothing and 250kW/1MWh of energy-shifting capability. The project successfully met and exceeded
    its targeted objectives for peak shaving and PV ramp-rate smoothing, with project objectives later extended to simultaneous ancillary services delivery.
  lesson_learnt: Co-locating battery storage with utility-scale solar PV can deliver simultaneous peak shaving, ramp-rate smoothing, and ancillary services — project developers targeting multiple grid services
    from a single storage asset should design control algorithms that can deliver these services concurrently rather than sequentially.
