- record_id: ARENA-DLV-53868
  source_title: Demand Flexibility Portfolio Retrospective Analysis Report
  publish_date: 2023-07
  project_name: ARENA Demand Flexibility Portfolio — Residential Behavioural Demand
    Response (AGL, EnergyAustralia, Powershop)
  what_happened: Behavioural demand response projects were broadly successful in delivering
    load reductions, but AGL found that 80% of demand reduction came from approximately
    20% of customers, 30% of participants delivered zero reduction, and participation
    fatigue was observed over time. Both AGL and Powershop concluded these programs
    attract already energy-efficient customers with limited additional savings headroom.
  lesson_learnt: Behavioural demand response programs deliver concentrated benefits
    from a small engaged minority and face structural limits to scaling; programs
    should be targeted at engaged customer segments rather than general recruitment,
    and the inherent ceiling on participation breadth must be factored into portfolio
    planning.
