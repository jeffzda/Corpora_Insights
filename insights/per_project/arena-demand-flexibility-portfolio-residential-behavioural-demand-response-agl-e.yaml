  evidence_excerpt: AGL found 80 per cent of the demand reduction was delivered by
    around 20 per cent of customers and 30 per cent of participants delivered zero.
    Powershop also concluded behavioural programs should be targeted at 'more engaged'
    customers. Both retailers also observed that the customers who were more likely
    to participate are already relatively energy efficient and therefore there was
    less to save.
