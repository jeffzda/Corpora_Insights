- record_id: ARENA-DLV-72031
  source_title: Australian Energy Resource Assessment – Second edition, 2014
  publish_date: '2014'
  project_name: Tidal Barrage Projects (Environmental Opposition — General)
  what_happened: Tidal barrage projects in multiple jurisdictions faced significant
    public and regulatory opposition due to environmental impacts on wetlands, fisheries,
    and marine habitats. Britain's proposed Severn Estuary barrage was abandoned after
    major environmental groups identified it would destroy 350,000 hectares of protected
    wetlands; the British Government withdrew support in 2010. The Incheon Bay barrage
    in Korea faced similar concerns over habitat destruction and fishermen's livelihoods.
  lesson_learnt: Tidal barrage projects in ecologically sensitive estuarine and intertidal
    environments face a high risk of project cancellation due to environmental and
    social opposition; project proponents should conduct comprehensive environmental
    and social impact assessments, including quantified assessment of intertidal habitat
    loss, before committing to barrage-type designs — tidal current (kinetic) technologies
    with lower environmental footprint should be evaluated as alternatives at the
    concept stage.
