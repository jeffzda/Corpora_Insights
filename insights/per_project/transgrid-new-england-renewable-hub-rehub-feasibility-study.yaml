  project_name: New England Renewable Energy Hub
  what_happened: A new generation facility needed to be operational by approximately
    2020 to take full advantage of LGC revenue, and given a typical three-year development
    and construction cycle, financial commitment was required before end of 2017 —
    imposing a hard commercial deadline on all REHub participants.
  lesson_learnt: Large-scale renewable energy projects dependent on RET revenue should
    back-calculate from the 2030 sunset date to determine their financial close deadline;
    any project requiring more than three years from financial commitment to commissioning
    must reach close well before 2017 to access sufficient LGC revenue to underpin
    capital costs — this deadline should be used to drive urgency in commercial negotiations.
