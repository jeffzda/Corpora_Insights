- record_id: ARENA-DLV-46165
  source_title: Renewable Energy Hub Knowledge Sharing Report
  publish_date: 2016-06
  project_name: New England Renewable Energy Hub
  what_happened: Individual wind farm developers in the New England area were proceeding
    independently, with White Rock 1 having completed pre-connection in 2015 while
    Sapphire 1 and Glen Innes were still progressing pre-connection in 2016 — making
    simultaneous commitment to a shared hub arrangement difficult and increasing the
    risk that early movers would lock in standalone connections before the hub was
    viable.
  lesson_learnt: When multiple generators in the same region are progressing independently,
    the TNSP should proactively initiate hub feasibility work as early as possible
    and maintain ongoing dialogue with all prospective participants — once the first
    generator commits to a standalone connection, the window for a more cost-effective
    shared solution may close.
