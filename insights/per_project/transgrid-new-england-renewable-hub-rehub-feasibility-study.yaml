- record_id: ARENA-DLV-46175
  source_title: Renewable Energy Hub Knowledge Sharing Report
  publish_date: 2016-06
  project_name: New England Renewable Energy Hub
  what_happened: Community stakeholders who were consulted during the REHub feasibility
    study raised concerns about clarity of leadership and responsibility — specifically,
    they could not identify which entity would lead and coordinate communications,
    and there was no agreement between developers on governance arrangements.
  lesson_learnt: Before commencing community consultation on a multi-proponent shared
    infrastructure project, nominate a single lead entity responsible for stakeholder
    communications and establish a governance committee of all proponents to align
    messaging — community confusion about project leadership erodes trust and can
    harden opposition during subsequent planning approval processes.
