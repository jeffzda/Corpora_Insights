- record_id: ARENA-DLV-46166
  source_title: Renewable Energy Hub Knowledge Sharing Report
  publish_date: 2016-06
  project_name: New England Renewable Energy Hub
  what_happened: Where a wind farm or solar farm's proposed location overlaps with
    a site already covered by an existing environmental approval, certain REHub infrastructure
    elements (substation location, transmission line sections) were found to be covered
    under the generator's existing approval — but approvals could lapse if construction
    did not commence within the mandated timeframe.
  lesson_learnt: REHub infrastructure approvals must be tracked separately from the
    individual generator project approvals; where REHub assets sit within a generator's
    existing approval footprint, confirm that the timeframe conditions align with
    the hub's construction schedule and apply for modifications proactively if they
    do not — approval lapses can delay hub construction independently of generator
    readiness.
  issue_severity: moderate
  project_type: network/grid
