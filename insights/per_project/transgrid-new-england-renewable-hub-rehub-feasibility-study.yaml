- record_id: ARENA-DLV-46157
  source_title: Renewable Energy Hub Knowledge Sharing Report
  publish_date: 2016-06
  project_name: New England Renewable Energy Hub
  what_happened: Analysis of five generators connecting to the New England REHub showed
    that different cost-sharing mechanisms (marginal-cost, proportional, or TNSP-bears-residual)
    produced widely varying outcomes for individual generators, with some paying more
    under certain hub arrangements than they would have under a standalone connection
    — which the NER prohibits for the negotiated services component.
  lesson_learnt: No single cost-sharing formula is equitable for all hub participants
    across all connection sequences; hub proponents should model multiple allocation
    scenarios before commencing commercial negotiations, identify the mechanism that
    is NER-compliant and keeps all parties better off than standalone connection,
    and document these terms in connection agreements before construction commences.
  issue_severity: moderate
