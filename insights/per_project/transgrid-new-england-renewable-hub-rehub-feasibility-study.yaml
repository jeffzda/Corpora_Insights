  what_happened: The Renewable Energy Target's $65/MWh penalty was not indexed and
    therefore falling in real value over time, creating a risk that electricity retailers
    would find it commercially preferable to pay the penalty rather than purchase
    LGCs — which would collapse the LGC market and remove the primary revenue support
    underpinning renewable energy investment.
  lesson_learnt: 'REHub and large-scale renewable project developers should treat
    the RET penalty rate erosion as a material project risk: financial models should
    be stress-tested against scenarios where LGC prices fall to zero for uncontracted
    generation post-2020, and projects should be brought to financial close before
    2017 to capture sufficient RET revenue to underpin capital costs.'
