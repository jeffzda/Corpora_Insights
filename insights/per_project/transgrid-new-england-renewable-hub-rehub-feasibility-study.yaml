  what_happened: The first generator to connect to a shared hub under Hub 1 (marginal
    cost) arrangements received no share of the cost saving from the hub, while subsequent
    generators received windfall benefits — creating a structural first-mover disadvantage
    that could deter the pioneer generator from committing to the hub.
  lesson_learnt: Marginal-cost connection pricing in a shared hub creates strong disincentives
    for pioneer generators; a proportional cost-sharing arrangement or a pioneer rebate
    scheme (under which later connectors make retrospective contributions to the initial
    developer) should be designed into the connection framework from the outset to
    ensure the first mover is not penalised.
