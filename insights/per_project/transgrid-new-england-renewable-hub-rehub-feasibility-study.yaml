- record_id: ARENA-DLV-46151
  source_title: Renewable Energy Hub Knowledge Sharing Report
  publish_date: 2016-06
  project_name: New England Renewable Energy Hub
  what_happened: Despite the SENE (Scale Efficient Network Extension) rule framework
    being introduced in 2011, no SENE Design and Costing studies had been requested
    or completed in the NEM in nearly five years, because the regulatory framework
    did not provide commercial parties with sufficient certainty of recovering costs
    and earning a return commensurate with the risk borne.
  lesson_learnt: A regulatory framework that lacks clear cost-recovery and risk-return
    provisions for shared network connection infrastructure will not be used in practice,
    even if nominally available — before pursuing a shared connection hub model, proponents
    should verify that the applicable rules permit a risk-adjusted return on invested
    capital, or seek regulatory clarification first.
