- record_id: ARENA-DLV-46173
  source_title: Renewable Energy Hub Knowledge Sharing Report
  publish_date: 2016-06
  project_name: New England Renewable Energy Hub
  what_happened: The NER provisions governing DNSP 'pioneer schemes' (where later
    connecting customers make retrospective cost contributions to the pioneer who
    funded the extension) had no equivalent in the transmission rules, leaving no
    established cost-recovery mechanism for a TNSP or first generator that invested
    in oversized hub assets.
  lesson_learnt: A transmission-equivalent pioneer scheme does not currently exist
    in the NER; hub developers relying on retrospective cost contributions from later
    generators must document this arrangement in individual connection agreements
    using arm's-length commercial terms, and should seek regulatory guidance on enforceability
    before committing capital on the expectation of future repayment.
  issue_severity: major
  project_type: network/grid
