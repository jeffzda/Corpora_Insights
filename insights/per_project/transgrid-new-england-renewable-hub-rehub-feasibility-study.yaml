  what_happened: The technical analysis of the NEM network identified that adequate
    network mapping of viable REHub locations and maximum viable aggregated nameplate
    capacities was not publicly available, making it difficult for developers to identify
    the best sites for new projects and reducing the efficiency of new generation
    investment decisions.
  lesson_learnt: TNSPs or AEMO should publish a regularly updated map of viable REHub
    locations with indicative connection capacity ranges; this market information
    reduces developer risk, encourages efficient resource exploitation, and is a prerequisite
    for any rational developer decision to invest in hub-connected generation.
