  source_title: Renewable Energy Hub Knowledge Sharing Report
  publish_date: 2016-06
  project_name: New England Renewable Energy Hub
  what_happened: The direct economic benefit of the REHub — an approximately 18% reduction
    in grid connection cost — translated to only about a 1% reduction in LCOE for
    a typical 200 MW wind farm, meaning the primary value proposition of the hub was
    connection certainty and resource utilisation rather than material cost savings.
  lesson_learnt: Do not oversell shared connection hubs on the basis of LCOE reduction
    alone — the grid connection component is typically less than 10% of capital cost,
    so hub cost savings are marginal in the overall project economics; the stronger
    case is connection certainty, network capacity preservation, and enabling development
    that would otherwise be precluded.
