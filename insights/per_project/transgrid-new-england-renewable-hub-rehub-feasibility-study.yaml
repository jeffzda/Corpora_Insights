- record_id: ARENA-DLV-46152
  source_title: Renewable Energy Hub Knowledge Sharing Report
  publish_date: 2016-06
  project_name: New England Renewable Energy Hub
  what_happened: The NER provisions governing charges for negotiated transmission
    services require prices to be 'no more than the stand-alone cost', but are silent
    on whether a risk-adjusted return can be included in 'costs' for the negotiated
    (substation) component of a shared hub, creating commercial uncertainty that acted
    as a disincentive for the TNSP to bear stranded asset risk.
  lesson_learnt: Where NER rules are ambiguous on whether a risk-adjusted return is
    recoverable for negotiated transmission services, TNSPs will be reluctant to invest
    speculatively in oversized shared connection assets — rule clarity or a formal
    regulatory determination should be obtained before committing to a first-of-a-kind
    shared hub investment.
