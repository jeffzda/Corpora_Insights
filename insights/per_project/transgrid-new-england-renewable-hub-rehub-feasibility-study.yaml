  source_title: Renewable Energy Hub Knowledge Sharing Report
  publish_date: 2016-06
  project_name: New England Renewable Energy Hub
  what_happened: Individual wind farm developers in the New England area were on broadly
    similar but non-identical development timelines, making it difficult for all pioneer
    generators to reach the board-commitment milestone simultaneously — a prerequisite
    for a cooperative REHub connection agreement.
  lesson_learnt: Misaligned development timelines among prospective hub participants
    are a major coordination risk; the TNSP or hub facilitator should map each generator's
    project gates early and design the connection process to accommodate asynchronous
    readiness, including staged commitment mechanisms or options to join at defined
    future milestones.
