    Level 1) and require a first-of-a-kind implementation to advance to CRI Level
    2; project proponents and funders should treat the first REHub as a commercial
    demonstration with an explicit knowledge-sharing mandate, and should not assume
    that the commercial architecture from the first project will be bankable without
