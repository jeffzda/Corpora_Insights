- record_id: ARENA-DLV-46174
  source_title: Renewable Energy Hub Knowledge Sharing Report
  publish_date: 2016-06
  project_name: New England Renewable Energy Hub
  what_happened: 'The TNSP''s capex cost overrun risk was identified as a material
    financial exposure: connection service fees to generators were fixed at connection
    agreement execution, meaning any capital cost overrun during hub construction
    would reduce the TNSP''s/SPV''s return with no mechanism for recovery from generators.'
  lesson_learnt: Fixed-price connection service fees lock in revenue before construction
    cost certainty is achieved; hub developers should include construction cost contingency
    in the service fee structure, negotiate cost escalation clauses tied to verified
    indices, or use an EPC fixed-price procurement contract to transfer construction
    cost overrun risk to the contractor before executing connection agreements.
