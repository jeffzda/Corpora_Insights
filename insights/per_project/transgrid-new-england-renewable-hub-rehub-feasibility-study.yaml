- record_id: ARENA-DLV-46178
  source_title: Renewable Energy Hub Knowledge Sharing Report
  publish_date: 2016-06
  project_name: New England Renewable Energy Hub
  what_happened: Generators bear the ongoing risk of network congestion constraining
    their dispatch under the NEM's non-firm access framework — a risk that persists
    after physical connection and is not mitigated by the connection agreement; this
    risk was identified as common to all generation connections, not unique to hubs,
    but was particularly acute in high-resource areas where multiple generators compete
    for limited network capacity.
  lesson_learnt: Generation project proponents connecting in resource-rich, constrained
    corridors should explicitly model the probability and financial impact of congestion-driven
    dispatch curtailment throughout the project life, not just at connection — this
    risk is not addressed in the connection agreement and must be managed through
    hedging, PPA structuring, or by funding network augmentation via NER 5.18 funded
    augmentations.
  issue_severity: moderate
  project_type: network/grid
  project_scale_band: first commercial/FOAK
  lifecycle_phase: concept/feasibility
  proponent_type: network business
