- record_id: ARENA-DLV-46153
  source_title: Renewable Energy Hub Knowledge Sharing Report
  publish_date: 2016-06
  project_name: New England Renewable Energy Hub
  what_happened: The REHub concept required an initial investment in oversized common
    assets to accommodate multiple generators connecting at different times, creating
    a material stranded asset risk — the risk that the oversized asset would not be
    fully used if anticipated generators did not connect.
  lesson_learnt: Identifying which party will bear stranded asset risk is the single
    most important commercial issue in designing a shared connection hub; this must
    be resolved before technical design is finalised, and the chosen risk-bearer needs
    an explicit contractual mechanism to earn a return commensurate with the risk
    taken.
