- record_id: ARENA-DLV-46156
  source_title: Renewable Energy Hub Knowledge Sharing Report
  publish_date: 2016-06
  project_name: New England Renewable Energy Hub
  what_happened: Under the NER 'open access' regime, a TNSP is obliged to offer connection
    to each generator applicant in order of receipt, regardless of network capacity
    or the connection status of concurrent applicants — meaning early connecting generators
    can consume network capacity that forecloses or degrades connection for subsequent
    generators in the same area.
  lesson_learnt: Developers planning to connect to an area with concentrated renewable
    resource should engage with the TNSP early to understand queue position and the
    cumulative capacity impact of prior connection offers — late applicants may face
    binding network constraints or runback schemes that materially impair dispatch,
    reducing project revenue.
  issue_severity: major
  project_type: network/grid
  project_scale_band: first commercial/FOAK
  lifecycle_phase: concept/feasibility
  proponent_type: network business
  delay_category: grid connection/system studies
  failure_mode: regulatory & approvals
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: The REHub concept was proposed specifically to address this sequencing
    problem by establishing a common, expandable connection point that removes first-mover
    disadvantage and gives all generators improved certainty of connection.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: wind
