  what_happened: 'Generators in the New England area had competing commercial incentives:
    participating in a cooperative REHub framework would lower their own connection
    costs but would simultaneously give a cost advantage to competitors also seeking
    to connect and sell into the same LGC and PPA markets.'
  lesson_learnt: Competitive tension among generators is a structural barrier to voluntary
    cooperation on shared connection infrastructure — hub proponents should design
    connection agreements and cost-sharing terms that clearly demonstrate the net
    benefit to each generator over standalone connection, and should consider sequencing
    negotiations to minimise each party's exposure to competitor free-riding.
