- record_id: ARENA-DLV-46161
  source_title: Renewable Energy Hub Knowledge Sharing Report
  publish_date: 2016-06
  project_name: New England Renewable Energy Hub
  what_happened: Development of a REHub required simultaneous negotiation of multiple
    interlocking contracts (land/leases, connection agreements, EPC/O&M contracts,
    PPAs, and finance arrangements), which were all typically not executed until financial
    close — creating a complex interdependency that was compounded when generators
    were at different stages of project development.
  lesson_learnt: When developing a shared connection hub, map the full contract interdependency
    structure early and identify the critical path contract (typically the PPA or
    finance close) that gates all others; design the hub connection agreement to accommodate
    asynchronous financial close dates across participants rather than requiring simultaneous
    execution.
