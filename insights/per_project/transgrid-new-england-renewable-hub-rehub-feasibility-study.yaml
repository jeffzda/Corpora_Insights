  what_happened: Wind farm proponents held non-permanent leasehold tenures over land
    within their project areas, but the TNSP required permanent freehold or permanent
    easements over substation and transmission line routes — meaning leaseholder proponents
    could not grant the necessary tenure themselves and had to negotiate separately
    with the underlying freehold landowners on the TNSP's behalf.
  lesson_learnt: TNSPs require permanent tenure (freehold or permanent easements)
    for hub infrastructure, but renewable energy developers typically only hold leasehold
    rights — this tenure gap must be identified and resolved early in development,
    as negotiating freehold easements with multiple landowners is time-consuming and
    can delay construction; proponents should flag this issue to landowners at the
    time of initial land access negotiations.
