  failure_mode: regulatory & approvals
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The report noted that while no NER mechanism prevents voluntary
    cost-sharing agreements for contestable components, formal regulatory backing
    analogous to the DNSP pioneer scheme does not exist and must be created contractually.
