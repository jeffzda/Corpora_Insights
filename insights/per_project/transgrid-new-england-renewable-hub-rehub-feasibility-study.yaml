  what_happened: The REHub concept rated at Commercial Readiness Index Level 1 (hypothetical
    commercial proposition) prior to any first project, with impediments across regulatory
    environment, stakeholder acceptance, financial proposition, and market opportunity
    — development and commissioning of the first REHub would only advance CRI to Level
    2.
