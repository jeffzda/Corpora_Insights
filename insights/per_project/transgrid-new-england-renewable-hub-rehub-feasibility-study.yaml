  project_name: New England Renewable Energy Hub
  what_happened: 'Connecting multiple large generators near the QNI in the New England
    area was constrained by voltage stability limits: southward flows reached a stability
    limit at approximately 700 MW and northward flows at approximately 450 MW on a
    single circuit cut-in, limiting the total REHub capacity that could be safely
    accommodated without network augmentation.'
  lesson_learnt: Before sizing a shared connection hub, proponents and the TNSP should
    conduct detailed stability analysis (voltage, transient, small signal) in both
    directions from the connection point, as hub capacity limits can be binding well
    below the sum of individual nameplate capacities — this analysis should be published
    to assist generators in making informed investment decisions.
