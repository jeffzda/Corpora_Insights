- record_id: ARENA-DLV-46177
  source_title: Renewable Energy Hub Knowledge Sharing Report
  publish_date: 2016-06
  project_name: New England Renewable Energy Hub
  what_happened: The REHub feasibility study was successfully completed with ARENA
    and NSW Government co-funding, matched by TransGrid, producing a replicable technical
    and commercial framework for shared generation connection infrastructure — but
    the project had not proceeded to implementation by the time of this report.
  lesson_learnt: A government-funded feasibility study can advance a first-of-a-kind
    shared infrastructure concept from CRI Level 1 to a point where the technical
    and commercial framework is sufficiently developed for commercial negotiations
    to begin; however, feasibility funding alone does not bridge the gap to construction
    — a clear pathway from study to implementation, including committed TNSP risk
    appetite and generator pre-commitment, must be defined before the study commences.
