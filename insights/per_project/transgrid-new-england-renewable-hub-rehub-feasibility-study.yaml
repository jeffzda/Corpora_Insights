- record_id: ARENA-DLV-46171
  source_title: Renewable Energy Hub Knowledge Sharing Report
  publish_date: 2016-06
  project_name: New England Renewable Energy Hub
  what_happened: The TNSP (TransGrid) required financial security from each generator
    (e.g. bank guarantees) as a condition precedent to each Connection Agreement,
    but some generators might not have committed project finance in place at the time
    the hub required their commitment — preventing them from providing the required
    security even if willing to participate.
  lesson_learnt: Hub connection timelines should be designed to align with generators'
    project finance milestones — requiring financial security before generators have
    reached financial close on their own projects will exclude willing participants;
    consider staged security commitments or conditional connection agreements that
    crystallise only upon the generator's financial close.
