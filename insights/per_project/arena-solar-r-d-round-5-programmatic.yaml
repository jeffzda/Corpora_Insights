- record_id: ARENA-DLV-2010
  source_title: Addressing Solar PV End-of-Life Issues and Lowering Solar PV Cost
    – Summary Report
  publish_date: 2024-05
  project_name: ARENA Solar R&D Round 5 (Programmatic)
  what_happened: Of 16 projects funded in the round, only 10 demonstrated TRL progress,
    three projects required extensions and were not completed at the time of review,
    and one was terminated early — meaning five of 16 projects did not deliver completed
    outcomes within the two-year program window.
  lesson_learnt: For competitive R&D rounds targeting TRL 2–4 technologies across
    four distinct priority areas, program managers should expect a meaningful proportion
    of projects to require extensions or to be terminated; build extension budget
    and review processes into the program design rather than treating extensions as
    exceptional events.
