  publish_date: 2016-06
  project_name: Incheon Bay Tidal Power Plant, South Korea
  what_happened: The planned 1,320 MW Incheon Bay Tidal Power Plant was cancelled
    due to environmental issues and opposition from local residents and environmental
    protection organisations.
  lesson_learnt: Very large tidal range projects are particularly susceptible to cancellation
    on environmental and social grounds; the environmental impact of tidal barrage
    structures and their opposition from fishing communities and conservation bodies
    should be treated as a primary project risk requiring early and sustained mitigation.
