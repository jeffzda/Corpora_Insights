- record_id: ARENA-DLV-35901
  source_title: 'Jemena Ltd: Malabar Biomethane Injection Project Lessons Learnt Report
    3'
  publish_date: 2023-04
  project_name: Malabar Biomethane Injection Project
  what_happened: After initial plant design was completed, it became evident that
    a biodome buffer vessel was required to smooth biogas flow and quality variations
    from the wastewater anaerobic digester. The biodome had not been included in the
    original design and was added as a design change.
  lesson_learnt: Future biomethane upgrading projects should include a biodome or
    equivalent buffer vessel in the initial design to dampen biogas flow and quality
    fluctuations from anaerobic digesters — this reduces compressor ramp rates, lowers
    shutdown frequency, and extends plant lifespan. Size the buffer to provide at
    least one hour of run-time at design throughput and locate the upgrader feed analyser
    on the biodome outlet to ensure well-mixed gas composition.
