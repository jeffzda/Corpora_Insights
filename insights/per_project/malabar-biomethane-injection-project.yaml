- record_id: ARENA-DLV-55151
  source_title: Malabar Biomethane Injection Project Lessons Learnt Report 2
  publish_date: 2022-07
  project_name: Malabar Biomethane Injection Project
  what_happened: During the early FEED phase, Australian engineering consultancies
    engaged on the project had limited knowledge of biogas upgrading technologies
    and requirements, leading to technical, scoping, and budgeting issues despite
    engaging consultants with overseas personnel to mitigate first-of-a-kind risk.
  lesson_learnt: For biogas upgrading projects in Australia, engage engineering consultants
    who work in formal partnership with overseas firms that have a proven track record
    in designing biogas upgrading facilities — domestic consultants alone lack the
    specialist knowledge needed to avoid scoping and budgeting errors at FEED stage.
