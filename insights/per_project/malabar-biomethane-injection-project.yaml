  publish_date: 2023-04
  project_name: Malabar Biomethane Injection Project
  what_happened: During commissioning, a ~30-minute lag was identified between actual
    gas composition changes in the delivery line and the Gas Chromatograph (GC) reading,
    caused by excessive tube length between the sample point and the GC. This delay
    caused prolonged recycling of gas that was actually in-spec, reducing throughput
    and risking off-spec export to the Custody Transfer Station.
  lesson_learnt: The sample point location for Gas Chromatograph measurement should
    be optimised early in design to minimise tube length and sampling lag — a 30-minute
    lag caused unnecessary gas recycling and off-spec export risk during commissioning
    at Malabar. Reducing tube length cut the lag to 6–8 minutes; future projects should
    also align GC sampling frequency with the expected lag time.
