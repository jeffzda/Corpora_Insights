- record_id: ARENA-DLV-13402
  source_title: Malabar Biomethane Injection Project Lessons Learnt Report 1
  publish_date: null
  project_name: Malabar Biomethane Injection Project
  what_happened: During upgrader technology selection (membrane vs. Pressure Swing
    Absorption/PSA), the project team found that technology choice involved complex
    trade-offs across contaminant risk, reliability, and flow variability that were
    not fully apparent at the outset. Membranes pass contaminants such as oxygen that
    elevate risk under variable feed gas conditions; PSA has more moving parts and
    potentially lower reliability; and flow variability handling differs between technologies
    in ways that interact with storage design decisions.
  lesson_learnt: Maximise the monitoring period for feed biogas composition before
    specifying upgrader equipment — longer monitoring enables better risk trade-off
    assessment between membrane and PSA technologies. Additionally, clear guidance
    for developers and gas networks on how technology selection affects contaminant
    risk and associated monitoring requirements would improve optimal technology selection
    on future projects.
  issue_severity: minor
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: network business
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: The project leveraged a good historical record of biogas constituents
    at Malabar to better assess contaminant risk, and integrated storage to largely
    negate PSA's flow variability advantage, ultimately allowing an informed technology
    selection.
  transferability: moderate
  delay_magnitude: null
  technology_domain: bioenergy
  source_pages: &id002
  - 2
  evidence_excerpt: Contamination – membranes pass through contaminants such as oxygen
    that can increase their risk in variations in the feed gas. PSA lowers this risk
    but does not eliminate it. At Malabar we had a good history of biogas constituents
    so could better consider the risk.
  confidence_note: issue_severity set to minor as the complexity led to a more rigorous
    selection process rather than a failure or delay.
