- record_id: ARENA-DLV-38511
  source_title: Jemena Gas Network - Malabar Biomethane Injection Project - Commissioning
    Report
  publish_date: 2025-06
  project_name: Malabar Biomethane Injection Project (MBIP)
  what_happened: A structured three-stage commissioning process with system-by-system
    energisation, use of a temporary flare for off-specification gas management, and
    immediate investigation of equipment failures resulted in safe start-up with no
    repeat failure events.
  lesson_learnt: A phased, system-by-system commissioning approach with a dedicated
    Commissioning Manager, formal handover certificates between construction and commissioning,
