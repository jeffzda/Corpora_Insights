- record_id: ARENA-DLV-35907
  source_title: 'Jemena Ltd: Malabar Biomethane Injection Project Lessons Learnt Report
    3'
  publish_date: 2023-04
  project_name: Malabar Biomethane Injection Project
  what_happened: Hydrogen Sulfide (H2S) present in raw biogas posed a significant
    flammability and toxicity risk. A detailed risk assessment and dispersion modelling
    specific to the Malabar facility was completed, determining that low operating
    pressure (4 kPa) at the point of H2S presence limited dispersion risk, and that
    H2S is removed at the activated carbon membranes before compression to 1,050 kPa
    where residual H2S would be a major personnel hazard.
  lesson_learnt: H2S risk assessment and dispersion modelling must be completed early
    in the design phase so that vent and gas detection systems are designed fit-for-purpose
    — the Malabar project found that dispersion risk is strongly pressure-dependent
    and that segmenting the plant by pressure zone appropriately manages H2S risk.
    Do not rely on generic H2S hazard classifications; model site-specific dispersion
    for each pressure zone.
  issue_severity: minor
  project_type: industrial decarbonisation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: network business
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: A facility-specific dispersion modelling study was completed,
    confirming acceptable risk at low-pressure sections and establishing that H2S
    removal before high-pressure compression was the critical control.
  transferability: moderate
  delay_magnitude: null
  technology_domain: bioenergy
  source_pages: &id008
  - 4
  - 6
  evidence_excerpt: It was determined that due to the upgrader operating at low pressures
    (4kPa) the rate of dispersion is very low and therefore the risk of engulfment
    by a H2S cloud is minimised... the H2S would be a major hazard to personnel [if
    still present at 1050kPa].
  confidence_note: Issue severity set to minor as no delivery failure or delay resulted
    — the lesson is a proactive design finding with transferable safety design implications.
