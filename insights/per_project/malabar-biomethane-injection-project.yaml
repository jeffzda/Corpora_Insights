- record_id: ARENA-DLV-35903
  source_title: 'Jemena Ltd: Malabar Biomethane Injection Project Lessons Learnt Report
    3'
  publish_date: 2023-04
  project_name: Malabar Biomethane Injection Project
  what_happened: The Factory Acceptance Test (FAT) conducted by equipment supplier
    Eneraque was limited in scope, covering only basic checks such as manual valve
    operation and equipment tagging. This inadequate FAT meant that issues not caught
    at the factory had to be resolved during the more costly and time-consuming Site
    Acceptance Test.
  lesson_learnt: An effective FAT for biomethane upgrading modules should include
    piping and equipment internal inspection, leak tests, instrument calibration,
    flange management, test runs with rotating equipment, communications testing,
    I/O testing, and control loop function checks — not just basic tagging and valve
    checks. A comprehensive FAT scope should be contractually specified before procurement
    to minimise remediation costs at site.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: procurement
