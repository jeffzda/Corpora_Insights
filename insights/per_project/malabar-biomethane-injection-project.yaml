- record_id: ARENA-DLV-35906
  source_title: 'Jemena Ltd: Malabar Biomethane Injection Project Lessons Learnt Report
    3'
  publish_date: 2023-04
  project_name: Malabar Biomethane Injection Project
  what_happened: The Malabar Biomethane Injection Project relies on renewable electricity
    primarily supplied by Sydney Water's co-generation system. When the co-gen goes
    offline, the facility falls back to grid electricity, which is not inherently
    renewable and may not satisfy the renewable electricity requirement for green
    gas certification, potentially requiring the purchase of Large-scale Generation
    Certificates (LGCs) to maintain certification.
  lesson_learnt: Biomethane projects seeking green gas certification must design and
    contract for continuous renewable electricity supply from project inception —
    including metering of independent energy sources, reliable LGC purchase mechanisms
    as a fallback, and CAPEX evaluation of on-site renewable electricity generation.
    Dependence on a third-party co-gen system without a certified fallback creates
    certification risk that should be identified and mitigated in the commercial and
    design phases.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: The project drew electricity from the grid and offset consumption
    with LGCs to maintain green certification eligibility, though the cost of LGCs
    had not been factored into ongoing operational costs.
  transferability: broad
  delay_magnitude: null
  technology_domain: bioenergy
  source_pages:
