  publish_date: 2025-06
  project_name: Malabar Biomethane Injection Project (MBIP)
  what_happened: The volume of biogas supplied from the wastewater anaerobic digestor
    is inherently variable, creating process interruptions and unstable biomethane
    injection without dedicated buffer storage; the MBIP design incorporated a biodome
    storage to manage this variability.
  lesson_learnt: Future biomethane projects should explicitly size biodome or buffer
    storage to allow steady-state operation of upgrading equipment through the expected
    range of wastewater AD quality and flow rate variability, and should conduct a
    cost-benefit analysis of capital versus operating cost savings from buffer storage
    at the design stage.
