  what_happened: The upgrader, filtration, and cooling modules were pre-fabricated
    in Brisbane by Eneraque rather than imported from Europe. This approach simplified
    compliance with Australian regulations, reduced field welds, and streamlined onsite
    installation, delivering an estimated 4–6 weeks in time savings.
  lesson_learnt: Biomethane upgrading projects should pre-manufacture skids and modules
    domestically to avoid compliance retrofitting required for imported European equipment,
    reduce site installation risk, and achieve time savings of 4–6 weeks. An effective
    Factory Acceptance Test (FAT) — including leak tests, instrument calibration,
    I/O testing, and control loop checks — should be conducted before mobilisation
    to minimise Site Acceptance Test issues.
