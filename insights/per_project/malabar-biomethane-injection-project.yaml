  evidence_excerpt: Recognised that Renewable electricity input to MBIP to receive
    Renewable Gas Certificates. There is a feed line from SydWater's CoGen facility.
    However, this supply is unreliable/consumed by SydWater. Therefore, project required
    to draw electricity from the grip and subsequently offset with LGCs. Costs of
    LGCs not factored into ongoing operational costs.
