- record_id: ARENA-DLV-13403
  source_title: Malabar Biomethane Injection Project Lessons Learnt Report 1
  publish_date: null
  project_name: Malabar Biomethane Injection Project
  what_happened: A community consultation event held in early March 2021 revealed
    that local residents had concerns about increased infrastructure, odour, and noise
    from the biomethane injection equipment. Initial communications had not pre-emptively
    addressed these concerns. Once the project team explained that the system processes
    currently flared gas (so odour would not increase), that the new equipment would
    be quieter than existing flares, and that the physical footprint was small, residents
    became supportive. Residents also expressed discomfort with the term 'injection'
    used to describe the project.
  lesson_learnt: Pre-empt common community concerns — odour, noise, and infrastructure
    footprint — in initial communications for biomethane projects, particularly for
    greenfield sites. Review project naming to avoid technically accurate but publicly
    uneasy terminology such as 'injection', and instead use language that emphasises
    positive environmental benefits. Specifying low-noise compressors and odour controls
    is especially important where no pre-existing noise and odour baseline exists.
  issue_severity: minor
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: approvals/contracting
  proponent_type: network business
  delay_category: stakeholder/land/community
  failure_mode: coordination & stakeholders
  outcome_class: delayed but recoverable
  secondary_failure_mode: null
  intervention_note: The project team addressed community concerns at the consultation
    event by explaining odour, noise, and infrastructure impacts, and by highlighting
    carbon reduction benefits — residents became supportive following these discussions.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: bioenergy
  source_pages: &id003
  - 2
  - 3
  evidence_excerpt: They were supportive of the scheme after the following was communicated...
    However, they noted that the term 'injection' made them uneasy and a 'softer'
    term could prevent these uneasy feelings.
  confidence_note: failure_mode set to governance/coordination failure as initial
    communications did not pre-address known community concerns; issue_severity minor
