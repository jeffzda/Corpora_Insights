- record_id: ARENA-DLV-38517
  source_title: Jemena Gas Network - Malabar Biomethane Injection Project - Commissioning
    Report
  publish_date: 2025-06
  project_name: Malabar Biomethane Injection Project (MBIP)
  what_happened: Variability in both the quantity and quality of biogas from the anaerobic
    digestors — driven by bacteria type, effluent volumes, ambient temperature, and
    water content — made it difficult to accurately forecast biomethane injection
    nominations to the Short Term Trading Market (STTM), with the MBIP experiencing
    events where injection exceeded the AEMO allowable tolerance of ±20% versus nominations.
  lesson_learnt: The inherent variability of anaerobic digestion feedstocks makes
    STTM nomination accuracy a structural challenge for biomethane injection projects;
    future projects should incorporate biodome buffer storage sized explicitly for
    STTM tolerance compliance, and establish real-time communication protocols between
    the host wastewater facility and the gas network control room before first injection.
  issue_severity: moderate
  project_type: enabling infrastructure
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: A gas nomination work process was established between SWC and
    Jemena Commercial Operations, with biodome buffer storage used to smooth variability;
    AEMO ±20% tolerance compliance was tracked as a key performance metric.
  transferability: moderate
  delay_magnitude: null
  technology_domain: bioenergy
