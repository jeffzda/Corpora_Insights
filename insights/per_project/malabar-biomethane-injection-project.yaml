- record_id: ARENA-DLV-55153
  source_title: Malabar Biomethane Injection Project Lessons Learnt Report 2
  publish_date: 2022-07
  project_name: Malabar Biomethane Injection Project
  what_happened: In the absence of biogas-specific technical specifications, Jemena
    applied its existing high-pressure oil and gas industry specifications to the
    biogas upgrading facility, which proved excessively stringent for the low-pressure
    biogas processing environment, significantly increasing complexity and costs.
  lesson_learnt: Develop or adopt technical specifications that are fit for purpose
    for biogas upgrading to biomethane — applying high-pressure oil and gas specifications
    to low-pressure biogas processing environments overcomplicates design, manufacturing,
    and commissioning and drives unnecessary cost and complexity.
