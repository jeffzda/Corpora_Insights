- record_id: ARENA-DLV-13401
  source_title: Malabar Biomethane Injection Project Lessons Learnt Report 1
  publish_date: null
  project_name: Malabar Biomethane Injection Project
  what_happened: During initial design and upgrader specification, the project encountered
    challenges sizing biogas upgrading equipment due to highly variable feed gas flowrates
    — low excess flows when the cogeneration engine was operating and high flows when
    it was not. Operating below 50% capacity caused significant efficiency losses
    and frequent starts/stops increased maintenance burden. A storage vessel was added
    to the design to buffer these flow variations.
  lesson_learnt: A buffer storage vessel upstream of the upgrader can smooth flow
    variation, improve efficiency, and reduce maintenance costs — even for projects
    not specifically processing 'excess gas'. Future projects should model flow variability
    and consider storage integration as part of the base design rather than as an
    afterthought.
