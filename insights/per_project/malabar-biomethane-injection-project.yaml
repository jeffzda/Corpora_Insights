  secondary_failure_mode: null
  intervention_note: A biodome operating at 4 kPa with approximately one hour of biogas
    buffer capacity was added to the design, stabilising operations and reducing shutdown
    frequency.
  transferability: broad
  delay_magnitude: null
  technology_domain: bioenergy
