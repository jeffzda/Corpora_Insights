- record_id: ARENA-DLV-35904
  source_title: 'Jemena Ltd: Malabar Biomethane Injection Project Lessons Learnt Report
    3'
  publish_date: 2023-04
  project_name: Malabar Biomethane Injection Project
  what_happened: 'A Layer of Protection Analysis (LOPA) conducted during design concluded
    there was no overpressure scenario capable of exceeding the biodome MAOP, leading
    to removal of the Pressure Safety Valve at the biogas inlet. During mechanical
    completion, an overlooked scenario was identified: reverse flow of high-pressure
    upgraded gas back to the biodome during Emergency Shutdown events could cause
    over-pressurisation.'
  lesson_learnt: Biomethane upgrading projects must explicitly model reverse-flow
    overpressure scenarios at the interface between high-pressure and low-pressure
    systems during ESD and station trip events — these are commonly overlooked in
    LOPA studies focused on forward-flow cases. Consider retaining inlet PSVs, sizing
    the low-pressure system to absorb settle-out pressures, using shutdown valves
    to segregate systems during ESD, and providing localised flare systems for biogas
    releases.
  issue_severity: major
  project_type: industrial decarbonisation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: network business
  delay_category: commissioning/integration
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: A design change was implemented to reinstate the PSV at the biogas
    inlet at a set pressure of 4 kPag, allowing the project to proceed to commissioning.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: bioenergy
  source_pages: &id007
  - 4
  - 5
  evidence_excerpt: During the mechanical completion, it was noted that the design
    had overlooked an overpressure scenario caused by reverse flow from the high-pressure
    system back to the biodome while the inlet valve (tie-in from Sydney Water) was
    closed, which happens on Emergency Shutdowns (ESD), and could result in the over
    pressurisation.
  confidence_note: Issue severity set to major because the oversight required a design
    change discovered at mechanical completion — a safety-critical gap that, if undetected,
    could have caused equipment damage or personnel harm.
  source_url: https://arena.gov.au/knowledge-bank/malabar-biomethane-injection-project-lessons-learnt-report-3/
