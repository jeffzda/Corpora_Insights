- record_id: ARENA-DLV-55152
  source_title: Malabar Biomethane Injection Project Lessons Learnt Report 2
  publish_date: 2022-07
  project_name: Malabar Biomethane Injection Project
  what_happened: All upgrader tender respondents claimed they could achieve compliance
    with Australian Standards, but the appointed supplier faced significant challenges
    redesigning and modifying the unit to conform, ultimately manufacturing within
    Australia — a better outcome but one that caused significant project delays.
  lesson_learnt: Do not accept tenderer assurances of Australian Standards compliance
    at face value — prior non-compliance by OEMs is a known risk. Invite Australian
    suppliers with in-country engineering design, fabrication, and construction capabilities
    to tender, and require suppliers to establish back-to-back contracts with international
    OEMs to enforce compliance obligations and understand the schedule impact if compliance
    cannot be achieved.
