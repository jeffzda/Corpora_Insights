- record_id: ARENA-DLV-43152
  source_title: Granite Power Solar Thermal Demonstration Plant
  publish_date: '2012'
  project_name: Solar Supercritical Organic Rankine Cycle for Power and Industrial
    Heat (Wallsend Demonstration Site)
  what_happened: The project demonstrated that thermodynamic constraints limited electricity
    output to less than 20% of collected solar thermal energy, with approximately
    70% rejected as low-grade heat; this heat was productively used to heat the Wallsend
    public swimming pool, improving overall system efficiency.
  lesson_learnt: Small-scale solar ORC projects should plan for low electrical conversion
    efficiency (~20%) and actively integrate a thermal off-take (e.g. pool, industrial
    process) to make productive use of rejected heat and improve overall project economics
    and viability.
  issue_severity: minor
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Waste heat unable to be converted to electricity was redirected
    to heat Wallsend Swimming Pool, recovering approximately 100 kW average thermal
    output that would otherwise be lost.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar thermal
  source_pages: &id002
  - 3
  evidence_excerpt: Of the solar thermal energy collected, thermodynamic limitations
    mean less than 20% goes to electricity and about 70% is rejected as heat. As an
    example of how this heat can still be useful, the Wallsend public swimming pool
    is heated.
  confidence_note: issue_severity set to minor because thermodynamic limitation was
    an expected design constraint managed through co-location with pool; not a project
    failure per se but a design implication with delivery relevance.
