- record_id: ARENA-DLV-43153
  source_title: Granite Power Solar Thermal Demonstration Plant
  publish_date: '2012'
  project_name: Solar Supercritical Organic Rankine Cycle for Power and Industrial
    Heat (Wallsend Demonstration Site)
  what_happened: The demonstration plant was delivered through a multi-party consortium
    including a solar collector supplier (NEP Solar), turbine manufacturer (Turbo
    Power Systems UK), controls vendor (Yokogawa), local council (City of Newcastle),
    university research partner (University of Newcastle), and commercialisation support
    (Newcastle Innovation), alongside ARENA funding.
  lesson_learnt: Solar thermal demonstration projects at small scale can be assembled
    effectively via consortium structures that distribute specialist risk — technology
    vendors, research institutions, facility hosts, and commercialisation bodies each
    covering distinct gaps that no single proponent could cover alone.
