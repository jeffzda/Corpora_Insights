- record_id: ARENA-DLV-43151
  source_title: Granite Power Solar Thermal Demonstration Plant
  publish_date: '2012'
  project_name: Solar Supercritical Organic Rankine Cycle for Power and Industrial
    Heat (Wallsend Demonstration Site)
  what_happened: The project successfully demonstrated world-first direct heating
    of a supercritical organic working fluid in a parabolic solar trough, eliminating
    the need for an auxiliary thermal fluid transfer system at a small-scale demonstration
    plant in Wallsend, NSW.
  lesson_learnt: Eliminating the auxiliary thermal fluid transfer system through direct
    supercritical fluid heating reduces system complexity, cost, and efficiency losses
    — a design approach worth evaluating for future solar ORC deployments at similar
    scale.
