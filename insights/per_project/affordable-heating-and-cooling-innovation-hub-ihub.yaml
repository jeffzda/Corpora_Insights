  what_happened: The i-Hub living laboratory model — converting occupied buildings
    into instrumented performance assessment spaces for independent technology evaluation
    — was found to be replicable across sectors; a new living laboratory (Carseldine
    Urban Village) was established through RACE2030 CRC following the i-Hub model,
