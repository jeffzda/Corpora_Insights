  what_happened: Integrated design studios across 14 buildings and 9 typologies demonstrated
    that energy demand reductions of 25–320% relative to business-as-usual were achievable
    for most non-residential building types through combinations of passive design,
    envelope improvements, electrification, and on-site renewables; the exception
    was data centres where core IT load dominated.
  lesson_learnt: Integrated design — bringing architects, engineers, and building
    owners together at the earliest design stage — can unlock energy demand reductions
    well in excess of 25% for most non-residential building typologies using current
    technologies; project teams should adopt this process from concept stage rather
    than treating HVAC and renewables as late-stage add-ons.
