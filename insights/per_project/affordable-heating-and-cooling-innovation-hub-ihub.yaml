  publish_date: 2022-09
  project_name: Innovation Hub for Affordable Heating and Cooling (i-Hub) – LLS1
  what_happened: Analysis of 3,701 Australian public primary schools found that inclusion
    of solar PV alone reduced net energy usage by approximately 16% on average, while
    energy usage varied by 65–70% on a per-student basis within the same climate zone,
    indicating substantial energy savings potential that existing PV systems were
    not capturing — likely because systems were undersized.
  lesson_learnt: School PV system sizing should be informed by sector-wide energy
    baseline data that accounts for per-student and per-m² variations within climate
    zones — average-based sizing significantly undersizes systems; portfolio-wide
    deployment programs should use empirical baseline data to right-size PV and identify
    the highest-consumption sites as priority targets.
