  what_happened: COVID-19 disrupted delivery across all 32 i-Hub sub-projects from
    March 2020 onward, restricting access to aged care, healthcare and education sites,
    forcing face-to-face design studios and project management online, and limiting
    availability of key project technology due to supply chain impacts.
