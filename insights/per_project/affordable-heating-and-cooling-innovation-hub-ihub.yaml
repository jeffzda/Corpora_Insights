  what_happened: The design industry proved conservative and unlikely to be influenced
    by a single integrated design example; a deliberate program of 14 studios was
    required to create a sense of movement and accumulate sufficient evidence to shift
    industry practice around net zero design.
  lesson_learnt: Behaviour change programs targeting the design industry require multiple
    iterations and a critical mass of demonstrated examples to shift practice norms
    — a single demonstration project is insufficient; program designers should plan
    for a minimum series of studios across multiple typologies, climates, and proponent
    types to create the 'movement' effect needed for industry adoption.
