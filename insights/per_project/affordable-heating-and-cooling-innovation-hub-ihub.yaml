    could pre-cool and pre-heat prior to forecast high price events, and that 75–95%
    of condenser units responded within the required 6 seconds for FCAS Fast Raise
    markets, with a potential annual FCAS market value of $69,000 for the site.
  lesson_learnt: Aged care HVAC loads have demonstrated FCAS Fast Raise market participation
