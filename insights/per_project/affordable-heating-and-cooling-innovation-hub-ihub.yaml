  what_happened: Initial testing of the DCH flexible demand thermostat app highlighted
    that mechanical control system dynamics — not building thermal dynamics — were
    the binding constraint for short-term load shifting, requiring ongoing testing
    and refinement of the application.
  lesson_learnt: When developing HVAC demand response applications for short-duration
    load shifting, characterise and test HVAC mechanical control system response times
    early — building thermal mass is not the limiting factor for sub-5-minute events;
    the speed and reliability of BMS actuator response determines feasibility.
