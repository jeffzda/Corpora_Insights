  what_happened: Creating individual legal agreements for 32 sub-projects was one
    of the most time-consuming aspects of i-Hub program delivery, requiring a detailed
    30-page standard template negotiated separately with approximately 65 partner
    legal teams.
  lesson_learnt: For multi-project programs, develop a clear legal agreement template
    with explicit guidance on which clauses are fixed and which can be negotiated
    — this manages partner expectations and reduces negotiation time; budget substantial
    project management time for legal documentation when contracting 30+ sub-project
    partners.
