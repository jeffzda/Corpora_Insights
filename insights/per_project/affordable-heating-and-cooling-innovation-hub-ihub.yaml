  evidence_excerpt: Government procurement departments tend to use a list of preferred
    contractors for the provision of technical installation services through a public
    tender process. So, when the tender is for a unique and innovative approach the
    process is more complex and time consuming to both specify and price. Many contractors
    will also tend to price unfamiliar, unusual, or innovative work higher, to address
    perceived delivery risks.
