  what_happened: Building owners seeking to participate in flexible demand markets
    encountered barriers including device interoperability issues, data quality problems,
    high complexity, workforce skills gaps, and inadequate IT infrastructure and connectivity
    — preventing or significantly impeding participation.
  lesson_learnt: Address the foundational 'digital readiness' layer first — establishing
    standardised IT infrastructure and connectivity before layering on demand response
    services dramatically reduces the cost and complexity of each subsequent service,
    compared with treating every service as a bespoke siloed offering.
