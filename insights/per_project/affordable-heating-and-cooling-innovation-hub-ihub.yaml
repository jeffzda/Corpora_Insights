  what_happened: Modelling at Queensland Children's Hospital showed that pandemic-mode
    ventilation changes (increasing outdoor air percentage) were ineffective at containing
    aerosol spread and instead required local exhaust/filtration, while also significantly
    increasing peak electrical demand and annual energy consumption per Australian
    Standards AS4187 requirements.
  lesson_learnt: Healthcare facility energy planners should model the energy and demand
    implications of pandemic ventilation protocol changes (including AS4187 compliance)
    before adoption — blanket outdoor air increases impose large energy penalties
    without achieving infection control objectives; local exhaust and filtration are
    more effective and energy-efficient alternatives.
