- record_id: ARENA-DLV-18704
  source_title: The Innovation Hub for Affordable Heating and Cooling (i-Hub) Final
    Report
  publish_date: 2022-09
  project_name: Innovation Hub for Affordable Heating and Cooling (i-Hub)
  what_happened: Government procurement processes for technical installation services
    in several Living Laboratory and DCH sub-projects proved significantly more complex
    and time-consuming than planned, as public-sector preferred-contractor lists and
    public tender processes were poorly suited to unique, innovative, and unfamiliar
    scopes of work, which contractors also priced at a premium.
  lesson_learnt: When engaging government building owners as living laboratory partners,
    account for extended public procurement lead times in the project schedule; frame
    tender specifications carefully to describe innovative work in terms familiar
    to procurement panels, and budget for contractor price premiums on unfamiliar
    scopes.
