  what_happened: Poor hardware/software interoperability, lack of data standards,
    cyber security concerns, and conservative IT department culture were identified
    as systemic barriers to building digitalisation that inhibited uptake of data-driven
    HVAC energy services across the industry.
  lesson_learnt: Building digitalisation programs must address cyber security governance,
    data interoperability standards (such as Brick schema), and IT department engagement
    protocols explicitly — standardisation on a machine-readable data schema significantly
    reduces onboarding cost, and clear data governance frameworks are prerequisite
    for building owner consent to connect to shared platforms.
