  what_happened: The Data Clearing House encountered the challenge that energy analytics
    software cannot readily interpret a building's systems without human intervention,
    because commercial buildings each have unique configurations — the design and
    construction industry norm that 'every building is a prototype' creates a scaling
    barrier for digital energy services.
  lesson_learnt: Scaling energy analytics software across commercial building portfolios
    requires self-serve deployment capability analogous to smartphone apps — bespoke,
    human-mediated onboarding for each building is not scalable, and platform design
    should prioritise automated building-system discovery and configuration.
