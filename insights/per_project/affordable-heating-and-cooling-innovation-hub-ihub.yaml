  source_title: The Innovation Hub for Affordable Heating and Cooling (i-Hub) Final
    Report
  publish_date: 2022-09
  project_name: Innovation Hub for Affordable Heating and Cooling (i-Hub)
  what_happened: Global supply chain and logistics disruptions delayed acquisition
    of required technology in several sub-projects, particularly new battery banks
    for renewable energy storage and flexible demand, and heat recovery ventilation
    units; in at least one case a building was still awaiting battery delivery after
    the project's scheduled end date.
  lesson_learnt: When trialling integrated battery-solar-HVAC systems in a school
    portfolio context, procure batteries and control systems early in the project
    timeline and maintain parallel procurement pathways — supply chain risk for battery
    storage is high and can invalidate proof-of-concept results if delivery is too
    close to the project end date.
