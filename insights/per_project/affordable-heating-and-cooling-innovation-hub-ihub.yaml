  what_happened: Working in occupied healthcare buildings (aged care and hospitals)
    for living laboratory activities required carefully communicated procedures and
    protocols to avoid disrupting residents and staff; coordination across multiple
    departments proved lengthy and time-consuming, which was not accounted for in
    initial planning.
