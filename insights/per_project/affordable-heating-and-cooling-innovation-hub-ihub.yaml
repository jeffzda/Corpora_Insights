  what_happened: The DCH platform's cloud-based architecture introduced latency that
    prevented direct fast-acting PID loop control of HVAC equipment, restricting the
    intended control functionality to adjusting set points of local controllers rather
    than enabling real-time direct control.
  lesson_learnt: Cloud-based building control platforms should be architected for
    supervisory set-point adjustment rather than direct PID loop control — inherent
    cloud latency makes the latter unreliable; design demand response applications
    around thermostat offset and staging strategies that tolerate communication delays.
