  what_happened: Running a second integrated design studio for the ACT Schools typology
    (IDS03) was found necessary because the first studio (IDS02) involved a steep
    learning curve in both studio mechanics and design depth, meaning exploration
    was insufficient in the first iteration to produce robust outputs.
  lesson_learnt: When applying an integrated design studio process to a new building
    typology for the first time, plan for at least two studio iterations — the first
    run serves primarily to establish process fluency and reveal typology-specific
    design constraints; substantive design innovation outputs are more reliably generated
    in the second iteration.
