  publish_date: 2022-09
  project_name: Innovation Hub for Affordable Heating and Cooling (i-Hub)
  what_happened: The i-Hub project's original 3-year delivery timeline was compressed
    to 2.5 years, meaning sub-project teams commenced in January 2020 with a June
    2022 end date, forcing parallel activity scheduling and leaving limited time for
    synthesis and integration of final deliverables.
  lesson_learnt: When managing a multi-project program, build in at least 6 months
    beyond the last sub-project completion date for synthesis, debriefing, and integration
    of tools and knowledge — compressing this period materially limits the quality
    of final outputs.
