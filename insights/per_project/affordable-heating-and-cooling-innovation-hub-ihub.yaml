  what_happened: Evaluation at ACT Schools living laboratory demonstrated that replacing
    ageing gas hydronic in-slab heating with split-system air conditioners reduced
    energy consumption by 4 to 7 times, and that electrification of heating coupled
    with solar PV — given school operating hours aligning with solar generation —
    could reduce greenhouse gas emissions to near zero depending on available roof
    area.
  lesson_learnt: Gas-to-electric heating replacement in schools delivers outsized
    energy and emissions benefits compared to efficiency upgrades to existing gas
    systems — project teams should prioritise electrification of school heating as
    a first step in decarbonisation roadmaps, and couple it with PV sizing analysis
    to exploit the school-hours solar alignment.
