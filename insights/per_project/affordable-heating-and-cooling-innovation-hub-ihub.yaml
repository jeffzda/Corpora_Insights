  what_happened: The i-Hub project found that standard laboratory testing of HVAC&R
    technologies — conducted under standardised, steady-state conditions — does not
    capture real-world performance under occupant needs and system interactions within
    buildings, leading to a gap between lab results and in-situ outcomes.
