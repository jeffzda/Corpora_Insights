  publish_date: 2022-09
  project_name: Innovation Hub for Affordable Heating and Cooling (i-Hub) – DCH6.1
  what_happened: Modelling for the DCH6.1 NSW Schools pilot showed that HVAC demand
    controls without battery storage consistently returned the best benefit-cost ratio
    (above 2x BCR) across all three school sites, outperforming battery energy arbitrage
    scenarios, while larger solar PV without batteries or controls also showed strong
    returns at two sites.
  lesson_learnt: For schools seeking maximum financial return from energy investments,
    HVAC demand controls should be prioritised ahead of battery storage — controls
    deliver superior benefit-cost ratios without capital-intensive battery procurement,
    and should be deployed before batteries are sized; larger PV is the next-best
    investment at most sites.
