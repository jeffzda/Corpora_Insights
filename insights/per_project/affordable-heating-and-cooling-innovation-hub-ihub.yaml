  what_happened: Key barriers to building participation in electricity markets — data
    ownership ambiguity, high data acquisition costs (accounting for over 50% of the
    cost of providing data-driven services), and lack of trust in vertically-integrated
    vendor platforms — were identified as the primary impediments to widespread adoption
    of building energy optimisation and demand response services.
  lesson_learnt: Deploying digital energy services at scale in commercial buildings
    requires an open, vendor-neutral data platform that separates data ownership from
    service provision; without this, each new service incurs duplicated onboarding
    costs and buildings remain locked into proprietary solutions with no interoperability.
