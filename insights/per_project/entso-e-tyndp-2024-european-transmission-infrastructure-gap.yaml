- record_id: ARENA-DLV-40613
  source_title: ARENA Electrical Infrastructure Roundtable
  publish_date: '2025-06-25'
  project_name: ENTSO-E TYNDP 2024 – European Transmission Infrastructure Gap
  what_happened: ENTSO-E's TYNDP 2024 analysis found that the existing portfolio of
    planned transmission projects (representing 80 GW of additional cross-border capacity
    after 2030) addresses only part of the identified 2040 need of 108 GW, leaving
    a gap of 28 GW of cross-border transmission capacity that is not covered by any
    project currently in the pipeline.
  lesson_learnt: Even with a well-developed pan-European infrastructure planning process,
    the pipeline of approved projects can fall materially short of identified system
    needs; infrastructure planners should not assume that identified needs will automatically
    translate into funded and approved projects, and should build portfolio-level
    gap analysis into regular planning cycles.
