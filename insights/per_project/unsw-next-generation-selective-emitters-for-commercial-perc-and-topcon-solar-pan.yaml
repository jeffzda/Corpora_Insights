  project_name: UNSW – Next-Generation Selective-Emitters for Commercial PERC and
    TOPCon Solar Panels (2020 RND005)
  what_happened: The project identified non-fire-through (NFT) silver paste chemistry
    issues as a remaining barrier to achieving full contact performance improvements,
    leaving a key technical problem unresolved at project completion.
  lesson_learnt: Solar cell R&D projects relying on commercially supplied screen-print
    paste chemistry should engage paste suppliers as project partners from the outset;
    third-party material constraints that emerge late in the project cannot be resolved
    within the project scope and create unfinished technology pathways.
