- record_id: ARENA-DLV-15833
  source_title: Evaluation of ARENA's Impact and Effectiveness
  publish_date: 2019-11
  project_name: Kidston Hydro-Solar Project (Genex Power)
  what_happened: ARENA provided staged funding across multiple phases of the Kidston project (initially $4 million for the pumped hydro feasibility study, then $8.9 million for solar PV, and $5 million
    for pre-financial close activities in 2018). The continued multi-stage funding commitment from ARENA was identified as essential to enabling what will be the world's first integrated solar and pumped
    hydro project to proceed.
  lesson_learnt: Multi-stage funding commitments that track alongside project development milestones — from feasibility through to pre-financial close — are essential for complex first-of-kind hybrid projects
    where each stage de-risks the next; a single upfront commitment or single-phase grant is insufficient to carry these projects to financial close.
