  source_title: Evie Networks Lessons Learnt Report December 2019
  publish_date: 2019-12
  project_name: National Ultrafast EV Charging Infrastructure Network
  what_happened: Grid connection capital costs for ultrafast EV charging sites varied
    by up to ±100% around the budget allowance of $200,000–$250,000 per site, with
    some connections costing double the budget and others provided free of charge.
    Cost estimates often came very late in the site acquisition process, and at least
    one site failed in acquisition after a prohibitive connection cost was received
    too late to manage.
  lesson_learnt: Budget allowances for grid connection at ultrafast EV charging sites
    should carry a contingency of at least ±100% until a formal connection offer is
    received; where possible, obtain indicative connection cost estimates from the
    DNSP before finalising site acquisition to avoid late-stage failures.
