- record_id: ARENA-DLV-66510
  source_title: Evie Networks Lessons Learnt Report September 2020
  publish_date: 2020-09
  project_name: National Ultrafast EV Charging Infrastructure Network
  what_happened: Evie's per-kWh plus per-minute pricing structure created perceived
    inequity among customers with slower-charging vehicles — at 30kW average session
    power the effective rate was 85c/kWh versus 45c/kWh at 150kW — generating customer
    complaints that the pricing was deliberately punitive, even though the structure
    reflected genuine cost recovery needs.
  lesson_learnt: Combination time-and-energy pricing structures for ultrafast charging
    sites are commercially justified but create significant customer perception problems
    when sessions occur at low average powers — communicate the rationale transparently
    and consider whether differentiated pricing tiers by connector type or vehicle
    class can reduce perceived inequity while still recovering costs.
