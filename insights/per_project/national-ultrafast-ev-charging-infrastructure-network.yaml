  source_title: Evie Networks Lessons Learnt Report December 2019
  publish_date: 2019-12
  project_name: National Ultrafast EV Charging Infrastructure Network
  what_happened: At project commencement, only two suppliers of 350kW charging hardware
    existed in the Australian market, and neither could fully meet Evie Networks'
    technical and commercial requirements. The higher-performing, lower-cost option
    did not provide a turnkey solution, requiring Evie Networks to manage in-house
    specification and procurement of additional customised balance-of-plant components
    with limited engineering support from the supplier.
  lesson_learnt: When deploying cutting-edge EV charging hardware with a thin supplier
    market, procurers should anticipate that no single vendor will meet all technical
    and commercial requirements and budget for in-house engineering resources to manage
    balance-of-plant gaps — particularly where turnkey solutions are unavailable or
    inferior.
