  project_name: National Ultrafast EV Charging Infrastructure Network
  what_happened: Legacy C&I distribution network tariffs (with high demand and standing
    charges) resulted in power costs of approximately 50c per kWh ex-GST for Evie's
    ultrafast highway charging sites — well above viable end-user pricing levels —
    because the tariff structure does not reflect the actual, underutilised network
    impact of ultrafast charging sites.
  lesson_learnt: Legacy C&I large-customer DNSP tariffs are not cost-reflective for
    ultrafast public charging sites and create a fundamental commercial barrier; proponents
    should engage actively in regulatory pricing determination processes and advocate
    for fit-for-purpose tariff structures before assuming grid-connected site economics
    are viable.
