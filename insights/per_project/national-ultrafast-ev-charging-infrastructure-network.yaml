  project_name: National Ultrafast EV Charging Infrastructure Network
  what_happened: Evie Networks' site selection priorities (road access, amenities,
    willing host) frequently conflicted with DNSP planning preferences, and finalising
    a site required simultaneous completion of four interdependent workstreams — property,
    power, planning, and procurement — that could not be sequenced independently.
    On several occasions Evie had to procure DNSP-specified transformers before receiving
    finalised connection offers in order to meet project timelines.
  lesson_learnt: EV charging network developers should treat the four interdependent
    site workstreams (property, power, planning, procurement) as a parallel critical
    path from the outset, accepting that risk procurement of DNSP-specified assets
    may be necessary to hold timelines — and should explicitly budget and govern these
    risk purchases.
