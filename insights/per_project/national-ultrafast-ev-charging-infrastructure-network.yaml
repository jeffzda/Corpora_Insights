  project_name: National Ultrafast EV Charging Infrastructure Network
  what_happened: Complex leasing arrangements — particularly where a tenant rather
    than the landowner controlled the site, or where sublease rights were restricted
    — created uncertainty and delays in the site acquisition process and resulted
    in suboptimal tenure outcomes for EV charger deployment.
  lesson_learnt: Prioritise dealing directly with landowners when acquiring EV charging
    sites; where a tenant controls the site, verify they hold a long-term right of
    occupation and can grant sublease or licence rights without extensive landowner
    consent — failure to do so creates delays and weaker tenure outcomes.
