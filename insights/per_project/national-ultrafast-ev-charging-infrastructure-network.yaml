- record_id: ARENA-DLV-2751
  source_title: Evie Lessons Learnt Report October 2021
  publish_date: 2021-10
  project_name: National Ultrafast EV Charging Infrastructure Network
  what_happened: Despite steady network growth, average utilisation across Evie's
    ultrafast highway charging network was approximately 1% in September 2021, with
    significant variability between sites. COVID lockdowns in NSW and VIC caused demand
    to drop 78% and 54% respectively from June to August 2021.
  lesson_learnt: Public EV charging infrastructure deployed ahead of significant EV
    uptake will face very low utilisation; project proponents and funders should model
    demand conservatively and recognise that commercial viability depends on broader
    EV fleet growth, not just network coverage.
