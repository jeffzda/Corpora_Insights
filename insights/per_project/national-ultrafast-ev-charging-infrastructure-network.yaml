- record_id: ARENA-DLV-2755
  source_title: Evie Lessons Learnt Report October 2021
  publish_date: 2021-10
  project_name: National Ultrafast EV Charging Infrastructure Network
  what_happened: While assigned the incorrect medium business tariff (EA302), the
    effective cost per kWh sold at the Mosman site ranged from $1.08 down to $0.38,
    compared to the preferred small business tariff cost of approximately $0.24–$0.31/kWh.
    Evie paid approximately $5,000 in additional network costs over 10 months while
    charging drivers $0.36/kWh ex GST, meaning the operator was selling below cost.
  lesson_learnt: Engage distribution network service providers early on tariff classification
    for EV charging sites — DNSPs default to medium business tariffs for high-capacity
    connections regardless of actual utilisation, and challenging incorrect classifications
    requires a lengthy, bespoke process with each DNSP that should be anticipated
    in project timelines and budgets.
