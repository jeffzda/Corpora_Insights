- record_id: ARENA-DLV-28651
  source_title: Evie Lessons Learnt Report June 2021
  publish_date: 2021-06
  project_name: National Ultrafast EV Charging Infrastructure Network
  what_happened: Following launch of the first ultrafast charging station in November
    2019, Evie Networks recorded 17 outages across five sites between August and December
    2020, with an average duration of 2.6 hours. Outages were caused by small variations
    in upstream electricity network supply beyond Evie's control, as well as equipment
    issues, with some events requiring a qualified technician to travel to a remote
    site to reset equipment, extending resolution times to up to 18 hours.
  lesson_learnt: Deploy additional resilience infrastructure (such as backup power
    for communications and control systems) early in network operations — after Evie
    added resilience measures, outage frequency dropped from 17 to 6 events and average
    duration fell from 2.6 to 1.8 hours per quarter. EV charging operators should
    not rely solely on upstream network stability and must design for autonomous recovery
    from short-duration supply interruptions.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: project developer
  delay_category: commissioning/integration
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: execution & logistics
  intervention_note: Evie deployed additional resilience infrastructure to supplement
    existing backup power for communications and control equipment, reducing average
    outage duration from 2.6 hours to 1.8 hours across monitored sites.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: EV
  source_pages: &id003
  - 4
  - 5
  evidence_excerpt: Incidents investigated have been in part due to small variations
    in upstream electricity network supply that are beyond Evie's control, as well
    as some equipment issues. The impact on charging experience has been that charging
    has been unavailable for periods ranging from 30 mins to 18 hours.
  confidence_note: delay_category set to commissioning/integration as outage patterns
    emerged in early operational phase of a nascent network; operations also considered.
