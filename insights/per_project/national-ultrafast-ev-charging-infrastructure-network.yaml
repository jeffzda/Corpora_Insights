- record_id: ARENA-DLV-2757
  source_title: Evie Lessons Learnt Report October 2021
  publish_date: 2021-10
  project_name: National Ultrafast EV Charging Infrastructure Network
  what_happened: Even after reclassification to the correct small business tariff,
    Ausgrid's unusually low 40 MWh annual usage threshold means Evie's sites will
    likely be automatically re-escalated to medium business tariffs as utilisation
    grows, creating a recurring regulatory and cost management problem.
  lesson_learnt: In Ausgrid territory, EV charging operators face a structural tariff
    trap — sites initially qualifying for small business tariffs will be reclassified
    to demand-charged medium business tariffs as EV uptake increases; this cost cliff
    must be modelled into long-run financial projections and tariff reform advocacy
    should be pursued proactively.
