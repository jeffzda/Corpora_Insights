  what_happened: Evie's analysis of 10 target NSW highway charging sites found that
    ultrafast charging loads do not coincide with DNSP network peaks, and the marginal
    diversified demand impact on existing zone substations was negligible — reducing
    headroom by only 1 percentage point (28% to 27%) even at full future buildout.
