  source_title: Evie Networks Lessons Learnt Report September 2020
  publish_date: 2020-09
  project_name: National Ultrafast EV Charging Infrastructure Network
  what_happened: Evie assessed whether C&I-scale battery storage could substitute
    for grid connection upgrades to manage DNSP demand charges, finding that at a
    benchmark cost of ~AU$1,600/kW for fully installed storage versus ~AU$220/kVA
    for grid connection upgrades and ~AU$8/kVA in discounted ongoing demand charges,
    grid connection remained commercially superior in all but exceptional site configurations.
  lesson_learnt: For ultrafast public charging sites, grid connection upgrades remain
    economically preferable to on-site battery storage under current cost structures
    — benchmark grid connection at ~AU$220/kVA versus ~AU$1,600/kW installed storage;
    reassess only for sites with extreme connection costs or very high DNSP demand
    tariffs, or where additional storage value streams (backup power, ancillary services)
    are reliably available.
