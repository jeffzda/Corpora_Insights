  outcome_class: delayed but recoverable
  secondary_failure_mode: coordination & stakeholders
  intervention_note: Evie provided usage data to Ausgrid on multiple occasions; after
    10 months the site was reassigned to the preferred EA225 tariff, reducing effective
    costs to approximately $0.24–$0.31/kWh sold.
  transferability: moderate
  delay_magnitude: 3–12 months
  technology_domain: EV
