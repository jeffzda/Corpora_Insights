- record_id: ARENA-DLV-2756
  source_title: Evie Lessons Learnt Report October 2021
  publish_date: 2021-10
  project_name: National Ultrafast EV Charging Infrastructure Network
  what_happened: Distribution network tariff structures across Australian DNSPs are
    inconsistent and not designed for EV charging load profiles. Small business tariff
    thresholds vary significantly (40 MWh for Ausgrid, 100 MWh for Queensland DNSPs,
    160 MWh for most others), and there is no standard national approach for classifying
    EV charging infrastructure, requiring bespoke engagement with each DNSP.
  lesson_learnt: EV charging network operators deploying multi-state infrastructure
    must conduct site-by-site tariff analysis for each DNSP jurisdiction before finalising
    business cases — the absence of a standardised national approach means cost structures
    vary materially and adversarial reclassification processes should be planned for,
    particularly in Ausgrid territory.
  issue_severity: major
  project_type: transport electrification
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: project developer
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: partial success
  secondary_failure_mode: poor scoping
  intervention_note: Evie engaged individually with each DNSP and was able to secure
    small business tariff assignment for most sites; Victoria achieved a broader resolution
    via a regulatory determination allowing opt-in to volumetric tariffs.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: EV
  source_pages: &id001
  - 7
  evidence_excerpt: The process has been unique and bespoke for each DNSP as there
    does not appear to be any standard approach for EV charging.
