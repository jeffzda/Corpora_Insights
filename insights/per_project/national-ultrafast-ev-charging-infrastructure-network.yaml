- record_id: ARENA-DLV-28653
  source_title: Evie Lessons Learnt Report June 2021
  publish_date: 2021-06
  project_name: National Ultrafast EV Charging Infrastructure Network
  what_happened: Evie Networks observed intermittent vehicle interoperability failures
    across its ultrafast charging network between November 2020 and April 2021, including
    instances where charging sessions failed to initiate, cables could not be released,
    and repeated communication errors occurred between vehicle and charger. These
    issues affected multiple vehicle models and arose despite charging equipment being
    fully operational and correct procedures being followed.
  lesson_learnt: EV charging operators should establish a formal interoperability
    testing and escalation pathway with EVSE manufacturers and auto manufacturers
    before network launch — vehicle-charger communication protocols (CCS2, CHAdeMO)
    are not yet mature, leave room for firmware-level interpretation, and cannot be
    diagnosed through standard OCPP management systems, meaning issues will persist
    until OEM patches are developed. Even low-volume interoperability failures can
    undermine driver confidence and advocacy for EVs.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: project developer
  delay_category: null
  failure_mode: unvalidated integration
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: data & measurement
  intervention_note: Evie escalated vehicle-model-specific issues to EVSE manufacturers
    who developed firmware patches; for cable-release failures a workaround procedure
    using the vehicle security FOB was identified and documented for reuse.
  transferability: broad
  delay_magnitude: null
  technology_domain: EV
  source_pages: &id005
  - 7
  evidence_excerpt: Investigating vehicle interoperability issues is not straightforward
    as communications between vehicle and charging station do not occur via the Open
    Charge Point Protocol (OCPP). Instead the session initiation and termination sequence
    occurs according to CCS2 and CHAdeMO protocols which is not available via OCPP
    management systems. Full troubleshooting requires the Electric Vehicle Supply
    Equipment (EVSE) manufacturer to run detailed diagnostics.
