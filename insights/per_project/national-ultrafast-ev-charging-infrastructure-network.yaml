- record_id: ARENA-DLV-46457
  source_title: Evie Networks Lessons Learnt Report December 2019
  publish_date: 2019-12
  project_name: National Ultrafast EV Charging Infrastructure Network
  what_happened: Ultrafast EV charging sites require future-proofed grid connections
    of 400kVA to 1,000kVA or more, but the time-consuming and expensive nature of
    DNSP upgrade processes means that repeated upgrades are not commercially viable.
    The business case evaluation was further complicated by the fact that exact connection
    feasibility and cost could not be determined until precise site locations were
    confirmed, creating large upfront capital uncertainty.
  lesson_learnt: Ultrafast EV charging sites must be designed with a future-proofed,
    high-capacity grid connection from the outset — the cost and delay of repeated
    DNSP upgrades is prohibitive; site connection ratings should be sized for long-term
    forecast load, not initial utilisation.
  issue_severity: moderate
