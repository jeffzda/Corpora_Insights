  project_name: National Ultrafast EV Charging Infrastructure Network
  what_happened: Average charging session power across Evie's highway network was
    approximately 50kW — only 25–35% of the 350kW rated capacity — because contemporary
    ~400VDC EVs are current-limited to around 200kW and significant charge tapering
    occurs in practice relative to nameplate ratings.
  lesson_learnt: When sizing ultrafast charging infrastructure and forecasting power
    costs, plan around real-world average session powers (typically 25–35% of rated
    capacity for current EV fleet mix) rather than nameplate charger ratings — actual
    utilisation of charger capacity will be substantially lower than theoretical maximums
    until higher-voltage EVs become prevalent.
