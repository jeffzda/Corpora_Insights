  what_happened: Evie Networks encountered inconsistent and unpredictable grid connection
    processes across 13 DNSPs in seven states and territories, including inconsistencies
    in distribution voltages (at least three different voltages nationally), connection
    design topologies, balance-of-plant specifications, and whether the connection
    process was managed in-house or outsourced. This made planning and budgeting a
    42-site national rollout significantly more difficult.
  lesson_learnt: Developers planning multi-state EV charging rollouts should map DNSP
    service boundaries, process models, and distribution voltages at the outset —
    engaging each DNSP early to understand their specific connection requirements,
    as national inconsistency substantially compounds planning and cost uncertainty
    across a portfolio.
