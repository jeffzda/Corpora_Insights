- record_id: ARENA-DLV-66511
  source_title: Evie Networks Lessons Learnt Report September 2020
  publish_date: 2020-09
  project_name: National Ultrafast EV Charging Infrastructure Network
  what_happened: Other public charging networks operating at below-cost prices (including
    free, government-subsidised at 20c/kWh, and flat 40c/kWh from a 350kW network)
    confused the market and distorted customer price expectations, undermining Evie's
    ability to set and sustain cost-reflective pricing for its commercially operated
    ultrafast network.
  lesson_learnt: Mixed public/subsidised/commercial charging networks operating simultaneously
    at vastly different price points create market expectation problems that undermine
    commercial viability of cost-reflective operators — industry bodies and funders
    should consider whether pricing transparency or minimum pricing standards would
    support long-term private investment in the sector.
