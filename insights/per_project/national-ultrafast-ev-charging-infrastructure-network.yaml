  project_name: National Ultrafast EV Charging Infrastructure Network
  what_happened: Site equipment idle losses substantially amplified energy consumption
    and per-kWh power costs at Evie's highway sites in the early market stage, disproportionately
    increasing costs to customers when utilisation was low.
  lesson_learnt: Account explicitly for charger idle losses in early-market financial
    models — idle losses significantly amplify per-kWh costs when site utilisation
    is low and should be a key criterion in equipment selection and site economics
    modelling.
