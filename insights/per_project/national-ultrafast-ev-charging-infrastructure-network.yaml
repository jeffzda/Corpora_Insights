- record_id: ARENA-DLV-66501
  source_title: Evie Networks Lessons Learnt Report September 2020
  publish_date: 2020-09
  project_name: National Ultrafast EV Charging Infrastructure Network
  what_happened: Australian EV market growth was substantially slower than the 2018
    Energeia 'No Intervention' forecasts used in Evie's original project proposal,
    compounded further by COVID-19 travel restrictions and lockdowns throughout 2020,
    resulting in materially lower site utilisation and revenue than projected.
  lesson_learnt: Do not rely solely on industry or government EV uptake forecasts
    when building a charging network business case — use conservative scenario analysis
    with explicit downside cases, and structure the commercial model to remain viable
    at significantly lower-than-forecast utilisation in the early market stage.
