- record_id: ARENA-DLV-25930
  source_title: Review of ARENA's Reliability Portfolio
  publish_date: 2020-01
  project_name: ARENA Reliability Portfolio — Bioenergy Sector Coordination
  what_happened: Stakeholder discussions and the portfolio evaluation found that the
    Australian bioenergy industry was poorly coordinated, with inadequate links between
    biomass suppliers and end users, and limited policy support for scaling bioenergy.
    This coordination failure limited the ability of ARENA-funded bioenergy projects
    to generate sector-wide impact beyond their individual project outcomes.
  lesson_learnt: In sectors with poor commercial coordination (such as bioenergy),
    ARENA should fund sector coordination activities — such as national resource databases
    and industry cluster support — alongside technology demonstration, as the coordination
    gap can be as binding a constraint as the technology gap.
