- record_id: ARENA-DLV-72239
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects - First Edition Results'
  publish_date: '2014'
  project_name: EPM FOA Frequency Regulation - Ecoult/East Penn Manufacturing UltraBattery
  what_happened: Ecoult deployed UltraBattery storage at East Penn Manufacturing in Pennsylvania to provide frequency regulation services to the PJM market, earning approximately USD $750K–$1M per year
    and achieving a project IRR of 15–20% for standalone systems, demonstrating commercial viability of battery storage in ancillary services markets against incumbent gas peakers.
  lesson_learnt: Battery storage competing in open ancillary services markets against gas peakers can achieve commercial returns (15–20% IRR) when the market structure rewards fast response performance
    — monitor regulatory changes toward performance-based payment structures as the trigger for storage to become commercially self-sustaining in frequency regulation.
