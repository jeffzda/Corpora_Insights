- record_id: ARENA-DLV-15460
  source_title: 'The Generator Operations Series: Large-Scale Solar Operations'
  publish_date: 2021-05
  project_name: North Queensland LSS Round Projects (Collinsville, Hamilton, Kidston,
    Longreach, Whitsunday)
  what_happened: In April 2020, AEMO declared a system strength shortfall in North
    Queensland, resulting in constraint equations being applied to inverter-based
    generation in the area. Five LSS Round Projects had their energy export curtailed
    depending on levels of synchronous generation in the network. The system strength
    shortfall was not due to be resolved until August 2021.
  lesson_learnt: Projects not contributing to a system strength shortfall have no
    direct mitigation options and are solely reliant on the network operator to resolve
    the issue — this dependency represents a material unhedgeable risk for solar projects
    in regions with low or declining synchronous generation, and investors should
    assess regional system strength trajectories as part of investment due diligence.
