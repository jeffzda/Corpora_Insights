- record_id: ARENA-DLV-18853
  source_title: Towards an Australian Capability in Arrays of Ocean Wave-Power Machines
  publish_date: 2018-06
  project_name: Towards an Australian Capability in Arrays of Ocean Wave-Power Machines
    (ARENA A00575)
  what_happened: The project found that significant array power benefits from WEC
    arrays are only realised once the whole array is installed, rather than accruing
    incrementally as successive machines are added, because beneficial inter-machine
    constructive interference requires the full array configuration.
  lesson_learnt: Wave energy developments must be planned and financed as complete
    arrays from the outset — the economic case cannot be built incrementally machine-by-machine,
    because the array interaction benefits that justify the investment only materialise
    when the full configuration is operational.
