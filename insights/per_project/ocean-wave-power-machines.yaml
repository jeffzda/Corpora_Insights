  source_title: Towards an Australian Capability in Arrays of Ocean Wave-Power Machines
  publish_date: 2018-06
  project_name: Towards an Australian Capability in Arrays of Ocean Wave-Power Machines
    (ARENA A00575)
  what_happened: The project found that some coastal locations previously overlooked
    as wave energy prospects — specifically the West Gippsland Coast of Victoria,
    the Western Australian coast between Perth and Bunbury, and parts of South Australia
    — showed higher WEC array power output than higher-resource sites, due to local
    wave direction uniformity effects from continental shelf geometry and coastal
    diffraction features.
  lesson_learnt: Pre-feasibility site screening for wave energy projects should not
    rely solely on existing wave energy resource atlases, which reflect raw power
    only; locations with moderate raw resource but highly uniform wave direction may
    outperform nominally higher-resource sites when array effects are accounted for,
    warranting inclusion of array modelling tools such as APOGEA in the earliest site
    screening stage.
