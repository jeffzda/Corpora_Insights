  project_name: Towards an Australian Capability in Arrays of Ocean Wave-Power Machines
    (ARENA A00575)
  what_happened: The semi-analytic theoretical model showed a discrepancy with laboratory
    experimental data in a frequency band between approximately 0.50 and 0.75 Hz,
    where experimental data exhibited a small 'bump' not reproduced by the linear
    potential-flow theory or numerical simulation.
  lesson_learnt: Linear potential-flow models used for WEC array interaction analysis
    have a known limitation in reproducing nonlinear subharmonic or ultraharmonic
    behaviour at specific frequency bands; future modelling work should account for
    or flag this limitation when results fall in affected frequency ranges.
