- record_id: ARENA-DLV-18854
  source_title: Towards an Australian Capability in Arrays of Ocean Wave-Power Machines
  publish_date: 2018-06
  project_name: Towards an Australian Capability in Arrays of Ocean Wave-Power Machines
    (ARENA A00575)
  what_happened: Analysis using the APOGEA software tool found that raw wave power
    data alone is insufficient for WEC array site selection — the variability in wave
    direction is an independent and critical factor that can reverse rankings between
    candidate sites, with sites of lower raw wave power sometimes yielding higher
    array output due to more uniform wave direction.
  lesson_learnt: Site assessment for wave energy arrays must include analysis of wave
    direction variability, not just wave power magnitude — using raw wave energy resource
    data alone risks selecting suboptimal sites and rejecting potentially high-performing
    locations; wave climate datasets must be processed through array algorithms before
    siting decisions are made.
