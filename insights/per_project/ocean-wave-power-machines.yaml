- record_id: ARENA-DLV-18851
  source_title: Towards an Australian Capability in Arrays of Ocean Wave-Power Machines
  publish_date: 2018-06
  project_name: Towards an Australian Capability in Arrays of Ocean Wave-Power Machines
    (ARENA A00575)
  what_happened: A field experiment at Garden Island designed to measure currents
    generated by a wave energy converter yielded no observable data because acoustic
    Doppler current meters were placed further from the WEC mooring points than necessary
    to detect the expected weak currents, due to operational safety constraints.
  lesson_learnt: When designing in-ocean instrumentation experiments around WECs,
    safety exclusion zones may prevent instrument placement close enough to detect
    weak localised phenomena such as WEC-generated currents; instrument placement
    distances must be validated against expected signal magnitude before deployment,
    or alternative measurement strategies identified.
