  project_name: Towards an Australian Capability in Arrays of Ocean Wave-Power Machines
    (ARENA A00575)
  what_happened: This project relied on wave climate input data from the Australian
    Wave Energy Atlas (AWavEA), a separate concurrent ARENA-funded measure, which
    completed approximately six months before the present measure. The sequencing
    created a dependency that constrained the start of the array performance analysis
    work.
  lesson_learnt: When a research project depends on datasets or outputs from a concurrent
    parallel project, the sequencing and data handover timeline should be explicitly
    managed as a project dependency; a six-month lag between data availability and
    dependent analysis is a realistic planning assumption for similar inter-project
    dependencies within the ARENA portfolio.
