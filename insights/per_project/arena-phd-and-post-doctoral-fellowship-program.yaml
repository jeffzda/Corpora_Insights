- record_id: ARENA-DLV-40363
  source_title: 'In The Spotlight: Australian Solar Energy R&D Outcomes and Achievements
    in a Global Context'
  publish_date: 2018-07
  project_name: ARENA PhD and Post-Doctoral Fellowship Program
  what_happened: Of 80 directly funded PhD and Post-Doc Fellowship recipients surveyed,
    only 33 responded (41% response rate). Among respondents, 75% had collaborated
    with international research groups, 12 had secured subsequent research grants
    as lead researcher totalling over $12m, and 16 of 22 respondents were still working
    in the same field — indicating strong career continuation and international connectivity
    from ARENA fellowship investment.
  lesson_learnt: Early career researcher fellowships focused on solar R&D are an effective
    mechanism for building durable research capacity and international networks —
    the majority of recipients remained in the field and subsequently attracted further
    competitive funding, validating fellowship programs as a high-leverage investment
    in human capital.
