- record_id: ARENA-DLV-40364
  source_title: 'In The Spotlight: Australian Solar Energy R&D Outcomes and Achievements
    in a Global Context'
  publish_date: 2018-07
  project_name: ARENA PhD and Post-Doctoral Fellowship Program
  what_happened: 'Survey respondents from the ARENA fellowship program identified
    several structural gaps: lack of fellowship pathways for mid-career researchers
    or those with industry experience re-entering academia; insufficient conference
    travel funding making networking and international collaboration difficult; and
    absence of industry mentoring arrangements, creating an ''echo chamber'' where
    research pursued is not always relevant to industry outcomes.'
  lesson_learnt: Fellowship programs targeting commercial research outcomes should
    include structured industry mentoring, adequate conference travel allowances,
    and pathways for mid-career and industry-experienced candidates — without these
    elements, early-career researchers struggle to simultaneously pursue academic
    publication metrics and industry-relevant outcomes, reducing the program's commercial
    impact.
