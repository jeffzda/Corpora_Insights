- record_id: ARENA-DLV-65151
  source_title: Capral - Log Furnace Replacement - Technology and Equipment Report
  publish_date: 2025-11
  project_name: Capral Log Furnace Replacement
  what_happened: Capral evaluated all available electric log furnace technologies
    (induction, magnetic, and convection) against requirements including >80% efficiency,
    taper heating capability, hot billet sawing, and brownfield footprint constraints.
    Only one supplier (Extrutec) offered a fully electric solution meeting all criteria,
    with the EHKO convection system selected.
  lesson_learnt: When electrifying industrial heating processes, conduct a structured
    multi-supplier technology evaluation against hard technical constraints early
    — footprint, efficiency, and process-specific requirements (e.g. taper heating)
    can eliminate most alternatives, and only one viable option may exist globally.
    Identify this early to avoid late-stage redesign.
