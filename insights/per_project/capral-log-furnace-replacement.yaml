    point cloud of the installation area to the overseas equipment designer, having
    used this approach successfully on other plant projects.
  lesson_learnt: Use 3D laser scanning to generate a point cloud survey of brownfield
    installation areas before sending dimensional data to overseas equipment suppliers
    — this provides millimetre-level accuracy for mechanical interface design and
    avoids costly fabrication errors for equipment manufactured remotely without an
    opportunity for iterative on-site adjustment.
