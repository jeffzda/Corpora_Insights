  project_name: Capral Log Furnace Replacement
  what_happened: Electric induction and magnetic furnace alternatives were found to
    require tandem (side-by-side) units to achieve the required throughput (>5,000
    kg/h), which would not fit within the available brownfield floorspace at Capral's
    Bremer Park plant or many other Capral sites.
  lesson_learnt: Brownfield industrial electrification projects must assess footprint
    compatibility of electric alternatives early — induction and magnetic heating
    systems often require tandem configurations that exceed the envelope of existing
    gas furnace installations, potentially disqualifying otherwise viable technologies.
