- record_id: ARENA-DLV-65163
  source_title: Capral - Log Furnace Replacement - Technology and Equipment Report
  publish_date: 2025-11
  project_name: Capral Log Furnace Replacement
  what_happened: The EHKO system design incorporates dual redundancy between the EHKO
    convection furnace and the inline induction heater, so that either unit can independently
    sustain production if the other fails, albeit at reduced productivity and with
    some product limitations.
  lesson_learnt: When specifying FOAK industrial heating systems, negotiate dual-mode
    operational redundancy between major heating stages — designing the EHKO convection
    furnace and induction heater to each sustain partial production independently
    provides a meaningful reliability buffer that reduces the consequence of single-component
    failure in a high-throughput brownfield environment.
  issue_severity: none
