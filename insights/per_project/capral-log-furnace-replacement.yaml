- record_id: ARENA-DLV-65156
  source_title: Capral - Log Furnace Replacement - Technology and Equipment Report
  publish_date: 2025-11
  project_name: Capral Log Furnace Replacement
  what_happened: A site visit by Extrutec to Capral's Bremer Park facility identified
    that mains power interruptions could cause heat to transfer backwards from hot
    logs in the furnace to the fan bearings, potentially causing damage. This risk
    had not been anticipated in the initial project scope.
  lesson_learnt: For electric convection furnace installations in industrial settings,
    assess power outage risk to fan cooling systems during the supplier site visit
    phase — a 10 kWh UPS to maintain fan operation during outages may be required
    and should be scoped early to avoid late additions to the project.
  issue_severity: minor
  project_type: industrial decarbonisation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: industrial operator
  delay_category: null
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Extrutec recommended installation of a 10 kWh standby battery
    UPS; Capral identified a suitable existing unit within its facilities that could
    be repurposed, avoiding additional procurement cost.
  transferability: moderate
  delay_magnitude: null
  technology_domain: industrial renewables
  source_pages: &id006
  - 10
  evidence_excerpt: The site visit by Extrutec highlighted an issue in relation to
    power outages. Extrutec recommended that a standby battery power supply (UPS)
    be installed by Capral to allow continued fan operation to cool the equipment
    if mains power is interrupted. This would avoid the possibility of heat transferring
    (backwards) from the hot logs in the furnace and harming the fan bearings. The
    required battery capacity is 10kWh.
