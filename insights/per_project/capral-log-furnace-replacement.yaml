- record_id: ARENA-DLV-65153
  source_title: Capral - Log Furnace Replacement - Technology and Equipment Report
  publish_date: 2025-11
  project_name: Capral Log Furnace Replacement
  what_happened: Capral's existing gas-fired log furnaces have efficiencies ranging
    from 20% (the oldest, 39-year-old B1 QLD unit being replaced) to 75% (a newly
    installed Penrith unit), representing a large variation across the fleet and significant
    Scope 1 emissions of up to 5,200 tCO2-e/y in aggregate.
  lesson_learnt: Industrial operators planning fleet-wide electrification should sequence
    furnace replacements by age and efficiency — oldest and least efficient units
    offer the greatest emissions and cost reduction per replacement dollar and should
    be prioritised, while newer gas-fired units installed during the transition period
    carry stranded-asset risk.
