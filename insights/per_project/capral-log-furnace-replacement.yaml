- record_id: ARENA-DLV-65162
  source_title: Capral - Log Furnace Replacement - Technology and Equipment Report
  publish_date: 2025-11
  project_name: Capral Log Furnace Replacement
  what_happened: All log furnace suppliers are based in Europe or the USA; none are
    based in Australia. This means there is no domestic supply market for this category
    of industrial decarbonisation equipment, creating supply chain, support, and lead-time
    risks for Australian operators.
  lesson_learnt: Australian industrial operators electrifying aluminium extrusion
    or similar processes should account for the complete absence of domestic log furnace
    suppliers in project planning — extended lead times, international shipping, overseas
    commissioning support, and foreign currency exposure are structural features of
    this procurement, not project-specific risks.
  issue_severity: moderate
