  what_happened: Capral's selected EHKO system is only the 5th to be installed worldwide,
    with the first commissioned in Finland in January 2025. Due diligence revealed
    that electricity consumption at the Finnish reference site was slightly above
    target and productivity slightly below target after commissioning.
  lesson_learnt: For FOAK or near-FOAK industrial equipment, conduct in-person site
    visits to the first reference installation before finalising equipment design
    — early performance shortfalls discovered during due diligence can be designed
    out before manufacturing, avoiding costly post-commissioning modifications.
