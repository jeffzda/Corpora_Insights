  what_happened: Capral's equipment purchase from German supplier Extrutec is denominated
    in foreign currency (EUR). Capral has a Foreign Currency Hedging Policy and will
    hedge all foreign currency purchase order commitments using Forward Exchange Contracts
    (FECs) through its bank.
  lesson_learnt: Industrial electrification projects sourcing major equipment from
    European suppliers should establish foreign currency hedging (e.g. Forward Exchange
    Contracts) at contract execution to eliminate exchange rate exposure — this is
    particularly important for equipment with long manufacturing lead times where
    AUD/EUR movements could materially affect project economics.
