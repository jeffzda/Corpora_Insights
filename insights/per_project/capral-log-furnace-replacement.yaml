- record_id: ARENA-DLV-65154
  source_title: Capral - Log Furnace Replacement - Technology and Equipment Report
  publish_date: 2025-11
  project_name: Capral Log Furnace Replacement
  what_happened: Capral chose to install a modern gas-fired furnace at its Penrith,
    NSW plant in July 2025 while the technical and commercial feasibility of preferred
    electric systems remained unproven, explicitly acknowledging stranded-asset risk
    for equipment with a 30–40 year design life.
  lesson_learnt: When full electrification is not yet proven at commercial scale,
    industrial operators may need to accept near-term stranded-asset risk by installing
    gas-fired equipment to address urgent reliability or capacity needs — this risk
    should be explicitly documented, and the decision should be tied to a defined
    electrification roadmap to limit exposure.
