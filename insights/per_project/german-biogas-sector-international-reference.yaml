- record_id: ARENA-DLV-59217
  source_title: Biogas Opportunities for Australia
  publish_date: 2019-03
  project_name: German biogas sector (international reference)
  what_happened: Germany's 'biogas boom' between 2000 and 2015, driven by feed-in
    tariffs under the Renewable Energy Act 2000, stalled after FiTs were gradually
    replaced by direct market sales for units larger than 100 kW from 2014, and restrictions
    were imposed on energy crop use. The sector experienced stagnation despite the
    original policy intent of enabling transition to market-based revenues.
  lesson_learnt: Policy support mechanisms for bioenergy must be withdrawn or restructured
    gradually and with market signals that give sufficient lead time — abrupt replacement
    of FiTs with direct market sales, without ensuring grid parity had been reached,
    caused sector stagnation in Germany and would risk the same outcome in Australia
    if support is withdrawn prematurely.
