  project_name: eTelligence Project (EWE AG)
  what_happened: EWE AG's eTelligence project in Cuxhaven, Germany, linked large and small-scale energy consumers and producers via ICT into an intelligent regional marketplace and active distribution network.
    Real-time electricity consumption visualisation in 650 households achieved an average 11% reduction in electricity consumption.
  lesson_learnt: Real-time consumption feedback combined with smart meters and tariff incentives can reliably achieve approximately 10% demand reduction — this approach is transferable and provides a scalable
    model for integrating distributed energy resources through consumer activation.
