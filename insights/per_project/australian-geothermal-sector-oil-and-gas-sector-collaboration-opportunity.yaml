  evidence_excerpt: The development of unconventional gas in Australia and elsewhere
    faces similar technical challenges to geothermal energy, particularly in regard
    to the need to 'find it and flow it'. Consequently, there are important overlaps
    in understanding the resource (i.e. Australia's sedimentary basins) and opportunities
    to translate learnings and technologies used to find and flow the resource between
    the oil and gas sector and the geothermal sector.
