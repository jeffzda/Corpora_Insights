- record_id: ARENA-DLV-14984
  source_title: 'Looking Forward: Barriers, Risks and Rewards of the Australian Geothermal
    Sector to 2020 and 2030'
  publish_date: 2014-06
  project_name: Australian Geothermal Sector – Oil and Gas Sector Collaboration Opportunity
  what_happened: The geothermal and unconventional gas sectors in Australia faced
    similar technical challenges in 'finding and flowing' subsurface resources, yet
    operated largely in isolation; collaboration opportunities for sharing seismic
    data, stimulation techniques, well completion methods, and microseismic monitoring
    expertise remained largely unexploited as of 2014.
  lesson_learnt: Geothermal R&D programs should explicitly incorporate collaboration
    with the oil and gas sector, particularly unconventional gas operators, to leverage
    existing subsurface data (3-D seismic, drilling data) and to adapt multi-stage
    hydraulic fracturing and multi-zone completion techniques to geothermal conditions
    — this is the most likely pathway to achieving the stimulation performance improvements
    required for commercial EGS viability.
