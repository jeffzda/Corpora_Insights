- record_id: ARENA-DLV-72296
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: '2015'
  project_name: Smart Voltage Regulator (SVR) - Ergon Energy
  what_happened: Ergon Energy's laboratory testing of a Smart Voltage Regulator (SVR)
    confirmed its ability to regulate voltage but produced inconclusive results for
    reverse power flow capability because the reverse power testing ran at only low
    power levels, requiring further testing before a commercial deployment decision
    could be made.
  lesson_learnt: Laboratory testing of voltage regulation equipment for PV-connected
    networks must include reverse power testing at realistic power levels — inconclusive
    low-power testing of the SVR's reverse power capability meant further testing
    was required before a commercial deployment decision, delaying the programme.
