- record_id: ARENA-DLV-30104
  source_title: GridWise - Dynamic Model Validation Project - Lessons Learnt 1
  publish_date: 2024-11
  project_name: Dynamic Model Validation (DMV) Project
  what_happened: During pilot launch planning for the DMV Tool, data privacy and security
    requirements — including compliance with the Security of Critical Infrastructure
    Act 2018 and NSP/AEMO security standards — proved more complex and time-consuming
    than initially budgeted for. Navigating data ownership, access controls, and secure
    data transmission required more time and specialist expertise than anticipated.
  lesson_learnt: Projects involving multi-party sharing of sensitive energy infrastructure
    data must conduct thorough data privacy impact assessments, engage cybersecurity
    experts from the planning stage, and budget explicitly for the time required to
    obtain security clearances from all participating organisations — these requirements
    consistently exceed initial estimates.
