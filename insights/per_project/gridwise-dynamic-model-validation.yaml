- record_id: ARENA-DLV-30103
  source_title: GridWise - Dynamic Model Validation Project - Lessons Learnt 1
  publish_date: 2024-11
  project_name: Dynamic Model Validation (DMV) Project
  what_happened: Inconsistent and poor-quality dynamic model submissions by project
    proponents were identified as a major bottleneck in the grid connection assessment
    process, causing multiple iterations between proponents and assessors and adding
    delays and costs. Variations ranged from differing data presentation formats to
    inconsistent modelling methodologies and assumptions.
  lesson_learnt: Develop standardised submission templates and automated quality-check
    tools early in the connection process — implementing pre-submission checks that
    flag completeness and consistency issues before lodgement allows reviewers to
    focus on substantive technical assessments rather than correcting basic errors.
