  what_happened: The DMV Tool experienced scalability challenges under peak user loads
    and lacked sufficient disaster recovery capabilities, identified as risks to commercialisation
    in the pilot phase.
  lesson_learnt: Design cloud-hosted digital tools for elastic scaling and automated
    disaster recovery from the outset — retrofitting autoscaling across multiple availability
    zones and robust data retention/logging capabilities after a pilot is costlier
    than building them into the initial architecture.
