- record_id: ARENA-DLV-30105
  source_title: GridWise - Dynamic Model Validation Project - Lessons Learnt 1
  publish_date: 2024-11
  project_name: Dynamic Model Validation (DMV) Project
  what_happened: During the transition from pilot to full launch of the DMV Tool,
    different user groups — NSP engineers, project developers, and grid consultants
    — were found to have significantly varying levels of technical expertise and familiarity
    with the tool, requiring different levels of UI sophistication and training. Complex
    features needed by power system engineers created interface depth that was inaccessible
    to less technical users such as project managers.
  lesson_learnt: Software tools deployed to diverse technical user communities should
    be designed from the pilot phase with tiered, role-based interfaces and modular
    training programs — a single interface and training approach will alienate either
    novice or advanced users, reducing adoption and effectiveness.
  issue_severity: minor
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: technology vendor
  delay_category: null
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Developed a tiered UI/UX strategy with role-based interfaces
    and a corresponding multi-level training program to address the varying needs
    of different user groups.
  transferability: moderate
  delay_magnitude: null
  technology_domain: grid/system stability
  source_pages: &id005
  - 11
  evidence_excerpt: Different user groups (e.g., NSP engineers, project developers,
    grid consultants) had varying levels of technical expertise and familiarity with
    similar tools, requiring different levels of UI sophistication and training support...
    This has led to the development of a tiered UI/UX strategy with role-based interfaces
    and a corresponding multi-level training program.
  confidence_note: lifecycle_phase assigned as commissioning/integration — the insight
    arose during the pilot-to-launch transition, which is analogous to first-time
    activation/integration testing for a software tool.
