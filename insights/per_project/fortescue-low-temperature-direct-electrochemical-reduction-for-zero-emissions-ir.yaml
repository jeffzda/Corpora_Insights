- record_id: ARENA-DLV-62514
  source_title: Fortescue - Low Temp Direct Electrochemical Reduction for Zero Emissions
    Iron - Core Research Final Report
  publish_date: 2025-12
  project_name: Low Temperature Direct Electrochemical Reduction for Zero Emissions
    Iron Project
  what_happened: Analytical-scale electrolyser tests showed that smaller iron ore
    particle sizes (below 200 µm P80) improved Faradaic efficiency by as much as 20%;
    however, this trend did not replicate in benchtop-scale electrolyser tests, with
    no consistent relationship found between particle size and production rate or
    normalised energy consumption at that scale.
  lesson_learnt: Electrochemical performance trends observed at small analytical scale
    do not always translate to larger bench-scale electrolysers for iron ore DER —
    validate particle size effects (and other process parameter optimisations) at
    each successive scale before specifying feedstock preparation requirements for
    larger plant.
