  what_happened: Mixed NaOH+KOH electrolyte tests were deemed unstable and unsuitable
    for DER. One mixed electrolyte test (30 wt.% NaOH + 30 wt.% KOH) failed due to
    excessive hydrogen generation which caused electrolyte to bubble out of the beaker,
    preventing Faradaic efficiency measurement; the second mixed test achieved lower
    efficiency (59%) than equivalent pure NaOH.
  lesson_learnt: Mixed NaOH/KOH electrolytes introduce stability risks (excessive
    gassing) and do not improve DER performance over pure high-concentration NaOH;
    avoid mixed hydroxide electrolyte formulations in alkaline iron ore electroreduction
    and default to pure NaOH at optimised concentration.
