  what_happened: 'EPDM O-rings immersed for 30 days in 50 wt% NaOH at 110°C exhibited
    a contradictory result: they lost weight but gained thickness. Visual inspection
    showed no apparent deterioration, but the anomalous dimensional change raised
    unresolved questions about long-term sealing integrity in the electrolyser.'
