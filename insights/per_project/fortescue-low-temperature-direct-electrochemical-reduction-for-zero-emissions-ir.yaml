  what_happened: Fully encapsulated carbon–titanium composite electrodes demonstrated
    strong resistance to 50 wt.% NaOH at 100 °C, maintaining electrochemical activity
    for up to 136 hours — substantially longer than earlier non-encapsulated specimens
    — confirming that prior steel degradation was due to caustic ingress through seams.
