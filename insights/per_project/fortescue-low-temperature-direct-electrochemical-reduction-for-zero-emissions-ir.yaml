  what_happened: Iron (Fe) and copper (Cu) electrodes were excluded as cathode candidates
    due to poor stability (corrosion) in concentrated hot NaOH. Nickel showed promise
    as an anode material (low OER onset) but was found unsuitable as a cathode because
    of insufficient separation between the iron reduction peak (C2) and HER.
  lesson_learnt: For hot-caustic alkaline iron ore electroreduction cathodes, eliminate
    Fe and Cu early in material screening due to caustic instability; screen Ni only
    as an anode candidate — its low OER onset potential makes it well-suited as an
    anode but its C2/HER separation is inadequate for cathode service.
