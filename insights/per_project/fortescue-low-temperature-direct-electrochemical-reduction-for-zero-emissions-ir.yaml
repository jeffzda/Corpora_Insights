- record_id: ARENA-DLV-4954
  source_title: Fortescue Low Temperature Direct Electrochemical Reduction for Zero
    Emissions Iron - Core Research Interim Report
  publish_date: 2025-05
  project_name: Low Temperature Direct Electrochemical Reduction (DER) for Zero Emissions
    Iron Project
  what_happened: Surfactant screening experiments to suppress the Hydrogen Evolution
    Reaction (HER) at electrode surfaces produced results difficult to distinguish
    from normal variability caused by changes in electrode preparation and testing
    conditions, making it impossible to confidently identify the magnitude of any
    HER suppression effect.
  lesson_learnt: HER suppression additives for alkaline iron electroreduction must
    be evaluated for each specific electrode–electrolyte combination rather than assumed
    transferable — a surfactant effective on one electrode (e.g. CTAB on glassy carbon
    in dilute KOH) may provide zero suppression on another (e.g. the same surfactant
    in 50 wt.% NaOH), and may also suppress the target iron reduction reaction.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: industrial operator
  delay_category: data/validation/testing
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Screened multiple cationic, anionic and non-ionic surfactants
    across a matrix of electrode types and electrolyte concentrations; identified
    CTAB on glassy carbon in 0.1 M KOH as the strongest HER suppressor (–0.102 V onset
    shift) and documented all electrode–electrolyte-specific results.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: industrial renewables
  source_pages:
  - 16
  - 21
  - 22
  - 26
  evidence_excerpt: The results of this study indicate that there is not a one size
    fits all solution when it comes to suppressing HER, with additive efficacy changing
    with electrode material and electrolyte. The GC electrode appeared to respond
    best with 2 mM of the cationic surfactant CTAB, with a potential shift of ‑0.102
    V observed in the 0.1 M KOH solution at 25 °C... However, the same additives on
    these electrodes provided effectively no change to the onset of HER in 50 wt.%
    NaOH electrolyte at 25 °C.
