  project_name: Low Temperature Direct Electrochemical Reduction (DER) for Zero Emissions
    Iron Project
  what_happened: The DER green iron product is produced as finely divided iron powder
    in the low micron particle size range, which is pyrophoric (can spontaneously
    ignite in air). This creates significant handling, storage, and shipping constraints
    that must be resolved before the product can be commercially distributed to steel
    makers.
  lesson_learnt: Pyrophoricity of fine iron powder is a critical product finishing
    challenge that must be engineered out before commercial deployment — agglomeration
    to a density of ~5 t/m³ (at which pyrophoricity is assumed negligible) via briquetting
    or pelletising must be demonstrated and qualified as part of the DER development
    program, not treated as a downstream problem.
