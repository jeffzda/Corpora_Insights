  what_happened: The first-generation electrolyser plant rapid prototype (RP01) balance
    of system used an overhead tank to supply electrolyte to the electrolyser, which
    resulted in poor slurry flow through the electrolyser stacks and accumulation
    of solids (both converted and unconverted iron) within the cells.
  lesson_learnt: Gravity-fed overhead tank electrolyte supply is insufficient to maintain
    adequate slurry flow through DER electrolyser stacks — pump-driven feed systems
    should be used from early design iterations to prevent solids accumulation in
    cells, as this directly affects iron product yield and requires a full BOS redesign
    if discovered late.
