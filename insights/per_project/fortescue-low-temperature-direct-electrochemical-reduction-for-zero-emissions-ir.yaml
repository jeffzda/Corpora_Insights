  intervention_note: Screened four alternative polymers with Tg above 110 °C (J-B
    Weld HH thermoset, Ampreg-31 replacement thermoset, PEI and PPS thermoplastics);
    eliminated thermoplastics due to poor results, and eliminated J-B Weld HH after
    corner delamination within 5 hours of NaOH submersion testing; proceeded to fully
    encapsulated carbon–titanium composite design which maintained activity for over
    136 hours.
