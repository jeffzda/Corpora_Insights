    drop to only 9% Faradaic efficiency (compared to 33% at 50 wt.% KOH), accompanied
    by evidence of corrosion on titanium electrodes, indicating an upper concentration
    limit for KOH viability.
  lesson_learnt: KOH concentration for alkaline iron ore electroreduction must not
    exceed approximately 51 wt.% — above this threshold, performance collapses and
    electrode corrosion can occur; the concentration-performance relationship for
    KOH is non-monotonic and must be characterised across the full operating range
    before specifying electrolyte conditions.
