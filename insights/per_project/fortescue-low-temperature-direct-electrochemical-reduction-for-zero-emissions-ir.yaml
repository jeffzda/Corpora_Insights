- record_id: ARENA-DLV-4955
  source_title: Fortescue Low Temperature Direct Electrochemical Reduction for Zero
    Emissions Iron - Core Research Interim Report
  publish_date: 2025-05
  project_name: Low Temperature Direct Electrochemical Reduction (DER) for Zero Emissions
    Iron Project
  what_happened: HER suppression experiments revealed that the effectiveness of surfactants
    is highly dependent on electrode material — CTAB suppressed HER on glassy carbon
    electrodes but increased HER activity on steel electrodes, while SDS showed the
    opposite pattern. This means results from one electrode material cannot be directly
    extrapolated to another.
  lesson_learnt: Do not assume surfactant HER suppression results from one electrode
    material transfer to another — the mechanism of inhibition appears to vary with
    electrode surface chemistry, and scoping experiments must be performed on the
    actual electrode material intended for the commercial process.
  issue_severity: minor
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: industrial operator
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Future work was redirected to use an iron electrode alongside
    the glassy carbon electrode, and surfactant scoping was planned in 50% NaOH (the
    actual process solution) rather than dilute KOH used in prior literature.
  transferability: narrow
  delay_magnitude: not quantified
  technology_domain: industrial renewables
  source_pages: &id002
  - 28
  evidence_excerpt: From these differences it is apparent that the electrode material
    has a large impact on the effect of the surfactant, indicating that the mechanism
    of HER and HER inhibition may change with electrode material... it is reasonable
    to assume that measurements on one electrode material may not directly translate
    to another material.
