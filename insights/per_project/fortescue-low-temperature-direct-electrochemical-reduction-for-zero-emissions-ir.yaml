  what_happened: The DER green iron product lacks carbon, which raises the melting
    point from ~1147°C (iron with 4.3% carbon) to 1536°C, potentially requiring changes
    to smelting operations at steel mills. This was identified as a product characteristic
    that steel makers must be informed of and may need to adapt their processes to
    accommodate.
  lesson_learnt: Green iron products produced via electrochemical routes will be carbon-free,
    significantly raising melting point compared to conventional iron inputs — this
    must be communicated and validated with steel maker customers early in the commercialisation
    process, as it may require operational changes to EAF/BOF smelting that affect
    customer adoption timelines.
