  what_happened: Impurities from Fortescue iron ore (silica, alumina, manganese) dissolve
    into the alkaline electrolyte during DER and are expected to accumulate in a circulating
    liquor during continuous operation. A locked-cycle approach was employed to investigate
    this accumulation effect, with implications for process efficiency and electrolyte
    management strategy.
  lesson_learnt: Electrolyte impurity accumulation from ore dissolution is a critical
    process design consideration for continuous or semi-continuous DER operation —
    implement a locked-cycle testing protocol early in process development to quantify
    impurity build-up rates and define the crystallisation or purge strategy required
    to maintain electrolyte quality within acceptable thresholds.
