- record_id: ARENA-DLV-62504
  source_title: Fortescue - Low Temp Direct Electrochemical Reduction for Zero Emissions
    Iron - Core Research Final Report
  publish_date: 2025-12
  project_name: Low Temperature Direct Electrochemical Reduction for Zero Emissions
    Iron Project
  what_happened: 'The composite carbon electrode material exhibited repeated delamination
    failures. Investigation identified two probable mechanisms: chemical incompatibility
    of the polymer binder with 50 wt.% NaOH at operating temperature, and the cell
    operating temperature exceeding the Glass Transition Temperature (Tg) of the original
    Ampreg-31 epoxy (Tg 92 °C), which is below the cell maximum of 110 °C.'
  lesson_learnt: When designing composite electrodes for alkaline electrolyser environments,
    verify that all polymer binders have a Tg above the operating temperature and
    are chemically compatible with the electrolyte at operating temperature before
    committing to a design — chemical and thermal screening should be performed early
    to avoid recurring electrode failure during testing.
