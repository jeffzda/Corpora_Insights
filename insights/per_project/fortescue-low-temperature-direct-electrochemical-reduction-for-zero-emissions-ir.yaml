  publish_date: 2025-12
  project_name: Low Temperature Direct Electrochemical Reduction for Zero Emissions
    Iron Project
  what_happened: Fortescue iron ore from the Pilbara contains 57.4 wt.% goethite as
    the dominant iron mineral (with 40.5 wt.% hematite), and XRF analysis revealed
    that approximately 3 wt.% SiO₂ is present in amorphous form (total 5.75 wt.% vs
    1.8 wt.% from crystalline quartz and kaolinite by XRD), indicating that a large
    portion of impurities are not captured by standard XRD characterisation alone.
  lesson_learnt: Standard XRD mineralogy alone is insufficient to characterise iron
    ore impurity content for DER process design — combine XRD with XRF and TIMA analysis
    to quantify amorphous Al₂O₃ and SiO₂ phases that will dissolve in the alkaline
    electrolyte and accumulate as impurities during continuous operation.
