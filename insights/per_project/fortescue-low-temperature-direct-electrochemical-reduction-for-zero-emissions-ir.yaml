  what_happened: Ti RDE showed only negligible iron reduction (C2) peak activity with
    goethite even after 4 h and 24 h conditioning — longer conditioning deposited
    a thicker passive oxide layer that acted as a barrier to electrochemical reactions.
    Ta RDE also showed no iron reduction peak at any conditioning duration when tested
    in RDE form.
  lesson_learnt: Titanium and tantalum in rotating disk electrode (RDE) form are poor
    cathode candidates for alkaline iron ore DER despite their desirable HER kinetics
    — the RDE geometry and oxide film formation limit iron reduction activity; screen
    these materials in sheet form (larger area, more representative current distribution)
    before drawing conclusions about their suitability.
