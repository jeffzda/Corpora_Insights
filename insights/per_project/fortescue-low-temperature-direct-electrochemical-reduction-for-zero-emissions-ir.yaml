    binders for alkaline electrolyser applications — their high processing temperatures,
    tendency to delaminate on cooling, and potential electrical insulation issues
    make thermoset matrices a more reliable choice; evaluate electrical conductivity
    and bond strength under process conditions before qualifying any new binder system.
