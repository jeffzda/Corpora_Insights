  what_happened: Anionic surfactant SDS reduced HER activity in iron ore slurry solutions
    but simultaneously suppressed the iron oxide reduction current peak, indicating
    a trade-off between HER suppression and iron yield.
  lesson_learnt: When screening HER suppressants for electrochemical iron reduction,
    measure the iron reduction peak (C2) and iron yield alongside HER onset shift
    — a surfactant may appear beneficial from HER metrics alone while actually reducing
    iron production efficiency.
