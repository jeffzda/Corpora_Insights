- record_id: ARENA-DLV-4956
  source_title: Fortescue Low Temperature Direct Electrochemical Reduction for Zero
    Emissions Iron - Core Research Interim Report
  publish_date: 2025-05
  project_name: Low Temperature Direct Electrochemical Reduction (DER) for Zero Emissions
    Iron Project
  what_happened: Standard materials used for the DER balance of system (316L stainless
    steel, 2205 duplex stainless steel, EPDM) were selected based on literature review
    for caustic resistance, but no experimental data existed to confirm their long-term
    durability in 50 wt% NaOH at 100°C. Fortescue initiated immersion testing to fill
    this gap in parallel with main technology development.
  lesson_learnt: For electrolyser balance-of-system components exposed to hot concentrated
    caustic, do not rely solely on literature-sourced material compatibility data
    — initiate experimental corrosion testing at actual operating conditions (temperature,
    concentration, contaminants) early in the development program, as this work has
    long lead times and must be available before scale-up commitments are made.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: industrial operator
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Fortescue commenced parallel corrosion immersion testing of candidate
    metals and EPDM seals in 50 wt% NaOH at 100–110°C, and planned engagement of an
    external specialist corrosion testing service provider to supplement in-house
    work.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: industrial renewables
  source_pages: &id003
  - 28
  - 29
  evidence_excerpt: Although these materials were selected based on an extensive literature
    search for caustic resistance, there is a lack of experimental data to support
    the long-term durability of these materials in 50 wt% NaOH at 100°C. Hence material
    testing must be performed to obtain the long-term durability of these materials
    for plant stability.
