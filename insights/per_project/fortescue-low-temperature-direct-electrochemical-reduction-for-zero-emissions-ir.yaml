  what_happened: High levels of dissolved impurities (silica and alumina liberated
    from Pilbara iron ore into the electrolyte) were found via inline Raman analysis
    to significantly alter the ore-to-metal conversion pathway and inhibit the formation
    of magnetite, an intermediate step in the reduction of hematite/goethite to metallic
    iron.
  lesson_learnt: Electrolyte impurity management is a critical process control parameter
    in DER operations — dissolved gangue minerals accumulating in recycled electrolyte
    must be monitored and controlled, as they materially change conversion chemistry
    and can degrade process performance; impurity monitoring should be built into
    the electrolyser design from early development stages.
