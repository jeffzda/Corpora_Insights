  what_happened: Sodium contamination in the DER iron product was identified as a
    critical steelmaking compatibility issue because sodium damages refractories in
    electric arc furnaces (EAF) and basic oxygen furnaces (BOF) and is strictly controlled
    as an input. The DER process uses sodium hydroxide as the electrolyte, making
    sodium contamination an inherent process risk.
  lesson_learnt: For DER processes using NaOH electrolyte, a product washing process
    must be developed and validated to reduce sodium to levels acceptable for EAF/BOF
    refractory integrity — this is a mandatory qualification step before steel makers
    can accept the product, and should be factored into product finishing design from
    early development stages.
