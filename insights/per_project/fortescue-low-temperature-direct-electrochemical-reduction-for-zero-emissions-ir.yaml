  what_happened: Iron product from the DER process adhered to cheaper cathode surfaces
    (e.g. stainless steel) rather than being released into the slurry. This iron adhesion
    impedes continuous operation and scalable processing because electrolysers would
    require frequent maintenance to remove adhered material, raising operating costs
    and undermining commercialisation economics.
  lesson_learnt: Iron adhesion to cathode surfaces is a critical commercialisation
    barrier for continuous-flow DER electrolysers — electrode material selection and
    surface treatment must be evaluated specifically for adhesion behaviour under
    process conditions before committing to a cathode design at scale, as frequent
    maintenance stops are incompatible with commercial throughput targets.
