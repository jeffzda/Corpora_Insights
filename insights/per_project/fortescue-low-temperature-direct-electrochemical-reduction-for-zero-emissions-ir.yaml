  what_happened: Thermal pre-treatment of goethite-rich Pilbara iron ore (roasting
    above 300 °C) converts goethite to hematite, releasing ~10 wt.% water, increasing
    porosity and surface area, and improving NaOH penetration and ionic transport.
    Raman spectroscopy confirmed complete goethite depletion at 350 °C roasting, with
    hematite features emerging.
  lesson_learnt: Thermal pre-treatment (roasting at ~350 °C) of goethite-rich iron
    ores before DER is a technically viable pathway to eliminate the charge-consuming
    goethite reduction step and improve access to hematite — incorporate ore pre-treatment
    as a process design element when working with high-goethite Pilbara ore feedstocks.
