  what_happened: Test result reproducibility was identified as a persistent challenge
    in electrolyser cell development, attributed to inconsistent slurry flow behaviour
    within the electrolysers and to compositional variability in Pilbara iron ore
    feedstock — including variation between different mine sites and between batches
    from the same mine.
  lesson_learnt: When developing DER electrolyser cells using heterogeneous ore feedstocks,
    reproducibility of test results cannot be assumed — establish standardised ore
    characterisation and slurry flow validation protocols before drawing conclusions
    from cell performance data, and use computational fluid dynamics modelling to
    design out flow inconsistencies that introduce experimental variability.
