  what_happened: 316 stainless steel substrates underlying composite carbon electrodes
    corroded in 50 wt.% NaOH at 100 °C, forming a dark brown corrosion product that
    caused loss of electrical continuity between the composite layer and the steel,
    identified as a probable mechanism behind earlier delamination failures.
  lesson_learnt: 316 stainless steel is unsuitable as an exposed substrate in alkaline
    electrolysers operating at ≥100 °C in 50 wt.% NaOH; design fully encapsulated
    electrode geometries or use corrosion-resistant substrate materials (e.g. titanium)
    to prevent substrate corrosion-driven delamination.
