- record_id: ARENA-DLV-62516
  source_title: Fortescue - Low Temp Direct Electrochemical Reduction for Zero Emissions
    Iron - Core Research Final Report
  publish_date: 2025-12
  project_name: Low Temperature Direct Electrochemical Reduction for Zero Emissions
    Iron Project
  what_happened: Time-series analysis of the DER process revealed that goethite is
    consumed first (0–20 Ahr range), followed by near-complete goethite consumption
    by 20–40 Ahr, then steady hematite reduction and metallic iron production from
    40–60 Ahr, and only minor magnetite reduction at 60–80 Ahr. This means that significant
    quantities of goethite in the feed ore will limit metallic iron production.
  lesson_learnt: Goethite content in feed ore is a critical constraint on metallic
    iron yield in DER — if goethite is not pre-converted (e.g. by thermal treatment
    above 300 °C to form hematite), substantial charge will be consumed reducing goethite
    before metallic iron forms, reducing process efficiency and requiring longer residence
    times or higher charge inputs.
