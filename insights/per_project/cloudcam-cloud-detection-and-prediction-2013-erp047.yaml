  publish_date: 2018-07
  project_name: CloudCam - Cloud Detection and Prediction (2013/ERP047)
  what_happened: During field trials of the CloudCam sky camera technology across
    three sites in the Northern Territory, insect activity on the camera lens was
    identified as a practical operational issue that needed to be managed.
  lesson_learnt: Sky camera deployments in tropical or remote Australian environments
    should include provisions for managing insect activity on the camera lens — this
    operational consideration should be factored into hardware design and maintenance
    schedules at the demonstration planning stage.
