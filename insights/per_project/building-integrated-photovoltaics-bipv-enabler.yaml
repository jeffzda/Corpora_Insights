- record_id: ARENA-DLV-51753
  source_title: Building Integrated Photovoltaics (BIPV) Enabler Final Report
  publish_date: '2022'
  project_name: BIPV Enabler
  what_happened: The platform incorporated open-source software and databases, which
    introduced unexpected complexity in commercialisation and licensing, requiring
    intervention from RMIT's legal and IP team.
  lesson_learnt: Future software development projects intended for commercialisation
    should prefer software components with permissive licences from the outset — relying
    on open-source components with restrictive licensing creates downstream commercialisation
    complications that are difficult and costly to resolve.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: approvals/contracting
  proponent_type: research organisation/university
