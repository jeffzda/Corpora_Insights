- record_id: ARENA-DLV-51752
  source_title: Building Integrated Photovoltaics (BIPV) Enabler Final Report
  publish_date: '2022'
  project_name: BIPV Enabler
  what_happened: Stakeholder engagement was severely impacted by COVID-19 conditions,
    reducing progress on organising industry meetings, workshops, and trial sessions,
    and diminishing communication efficiency when group meetings moved online.
  lesson_learnt: In pandemic or remote-engagement conditions, replace group online
    meetings with individual stakeholder meetings and distribute trial versions in
    advance of workshops to allow participants time to explore and test the tool —
    this partially compensates for reduced communication efficiency.
