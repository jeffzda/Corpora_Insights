  secondary_failure_mode: coordination & stakeholders
  intervention_note: RMIT Legal/IP team provided instructive suggestions to navigate
    the open-source licensing complications.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id003
  - 6
  - 7
  evidence_excerpt: The tool uses some open-source software/databases. This added
    complexity in Commercialisation/licensing. Although RMIT Legal/IP team has provided
    instructive suggestions, we suggest in the future similar projects should consider
    using software that grants a permissive license if possible.
