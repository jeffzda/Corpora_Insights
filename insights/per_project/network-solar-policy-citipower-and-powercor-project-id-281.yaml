- record_id: ARENA-DLV-72273
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects - First Edition Results'
  publish_date: '2015'
  project_name: Network Solar Policy – Citipower and Powercor (Project ID 281)
  what_happened: Citipower and Powercor faced a large volume of solar connection requests that would have required expensive network augmentation. The network introduced a solar connection pre-approval
    process and policy, educating customers via website and technical bulletins, which successfully managed quality of supply issues without requiring augmentation.
  lesson_learnt: Network businesses facing high solar connection volumes should proactively establish a solar pre-approval policy and publish clear penetration thresholds — doing so avoids costly augmentation,
    manages quality of supply within distribution code requirements, and reduces the burden on connection assessment processes.
