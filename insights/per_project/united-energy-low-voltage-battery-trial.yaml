- record_id: ARENA-DLV-50755
  source_title: Low-Voltage Grid Battery Energy Storage Systems Trial – Lessons Learnt
    Report No 1
  publish_date: '2021-08-06'
  project_name: Low-Voltage Grid Battery Energy Storage Systems Trial
  what_happened: The innovative, first-of-kind nature of the LV BESS trial introduced
    unforeseen challenges that threatened the delivery timeline and cost, beyond what
    standard BAU project contingency would cover.
  lesson_learnt: Trial and innovation projects should carry additional contingency
    — both schedule and cost — above standard BAU levels, given the higher rate of
    unforeseen challenges; streamlined issue resolution processes are also needed
    to limit compounding delays.
  issue_severity: moderate
  project_type: network/grid
