  project_name: Low-Voltage Grid Battery Energy Storage Systems Trial
  what_happened: Information and key documents were being shared between internal
    teams and external parties via email, creating cyber security risks and causing
    confusion and lack of visibility across the project team.
  lesson_learnt: Establish a dedicated shared document management system (internal
