  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Monash Council was engaged to procure demographic data; UE plans
    to use the Mosaic market research platform and partnerships with local councils
    to reach hard-to-reach CALD communities in future.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id001
  - 8
  evidence_excerpt: As a culturally and linguistically diverse (CALD) local government
    area, language barriers prevented several residents from sharing their concerns
    before construction. Monash Council was engaged to procure demographic data before
    the installation where this issue arose.
