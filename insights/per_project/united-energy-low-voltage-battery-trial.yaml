- record_id: ARENA-DLV-39204
  source_title: Low-Voltage Grid Battery Energy Storage Systems Trial – Lessons Learnt
    Report No 2
  publish_date: '2022-03-08'
  project_name: United Energy Low Voltage Grid Battery Energy Storage Systems Trial
  what_happened: There was a misalignment between United Energy's expectations of
    a 'preliminary design' (engineering-verified) and the BESS supplier's understanding
    (concept-level, not requiring engineering calculations), which created rework
    and delays during the design phase.
  lesson_learnt: Define 'preliminary design' explicitly in the contract and align
    expectations between the network operator and BESS supplier at the project kick-off
    meeting — undefined deliverable scope between a network owner and a technology
    supplier is a recurring source of rework.
  issue_severity: moderate
  project_type: network/grid
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: network business
  delay_category: procurement/supply chain
  failure_mode: coordination & stakeholders
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: UE held weekly design meetings with the BESS supplier and required
    the supplier to review drawings with project leads before formal submission to
    ensure alignment.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages:
  - 7
  evidence_excerpt: There was a lack of clarity about UE expectations of a preliminary
    design against BESS supplier's understanding. BESS supplier's understanding of
    the preliminary design was more of a concept design which did not have to be verified
    by engineering calculations. For future projects, it is recommended to define
    preliminary design in the contract and also ensure both the BESS supplier and
    UE expectations are aligned during the project kick-off meeting.
