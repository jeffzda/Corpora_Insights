  what_happened: The communications interface was outsourced to an overseas third
    party (Congruitive) to implement a modified IEEE 2030.5 protocol. The three-way
    interdependency between UE, THYCON, and the overseas vendor, compounded by time
    zone differences and inability to meet face-to-face, produced unexpected delays
    as the project evolved.
