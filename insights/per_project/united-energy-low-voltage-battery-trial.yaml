  project_name: United Energy Low Voltage Battery Trial (Electric Avenue)
  what_happened: BESS control was frequently disrupted by poor communication signal
    strength between units and the database server. Three antennas (AMI, SCADA modem,
    IEEE modem) were installed at a static pole location, but some antenna lead lengths
    were insufficient and proximity to other assets interfered with signal strength.
  lesson_learnt: Communications design for pole-mounted BESS units requires site-specific
    antenna placement based on direct line of sight to the relevant telco tower, with
    a minimum 300 mm clearance from interfering assets — a fixed standard pole location
    is insufficient; higher design focus on per-site communications planning would
    have avoided chronic control disruption.
