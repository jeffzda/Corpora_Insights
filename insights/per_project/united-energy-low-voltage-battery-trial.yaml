  what_happened: Applying zone substation commissioning practice to the LV BESS installation
    would have required significant on-site testing of protection and communications
    equipment at height on poles, which was identified as impractical and costly based
    on prior experience.
  lesson_learnt: Design out onsite testing requirements for pole-mounted BESS by shifting
