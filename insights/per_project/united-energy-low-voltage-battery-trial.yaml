  what_happened: The base IEEE 2030.5 standard did not meet the network visibility
    and control requirements of the UE distribution network, preventing use of an
    off-the-shelf communication solution. A customised version of the protocol incorporating
    non-standard elements was developed over more than three years to meet utility
    requirements.
  lesson_learnt: Do not assume off-the-shelf communications protocol implementations
    will meet complex DNSP control requirements — FCAS, advanced scheduling, and network
    visibility typically require bespoke protocol modifications; budget and schedule
    must explicitly allow for a multi-year customisation process and its interdependencies
    with BESS hardware and fleet control systems.
