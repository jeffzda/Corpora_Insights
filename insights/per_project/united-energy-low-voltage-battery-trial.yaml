  what_happened: 'Cyber security was identified as a major risk due to the bespoke
    communication protocol connected to the UE network. Multiple mitigations were
    implemented: the IEEE 2030.5 protocol was selected for its IoT security; a dedicated
    Telstra VPN was used as the communication medium; auxiliary protection equipment
    was hardwired to prevent remote configuration; a main circuit breaker was installed
    independent of the BESS unit; and a bespoke software patch was developed to encrypt
    firmware updates.'
  lesson_learnt: Pole-top BESS units connected to a DNSP network via bespoke protocols
    present significant cyber security risks that require a layered mitigation strategy
    — combining a secure communication protocol, a dedicated VPN, hardwired auxiliary
    protection, an independently controlled circuit breaker, and encrypted firmware
    update processes reduces the attack surface to an acceptable level.
