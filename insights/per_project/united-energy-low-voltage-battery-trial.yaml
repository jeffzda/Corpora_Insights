  what_happened: There was no agreed Australian standard interpretation applicable
    to utility-connected BESS at the outset of the project, creating a gap between
    DNSP network requirements and the OEM's manufacturing standards. This required
    UE to work extensively with THYCON to develop bespoke technical specifications
    to bridge the gap.
  lesson_learnt: When no specific Australian standard exists for a new technology
    (such as LV-connected BESS), conduct a formal standards gap analysis at the outset
    and work collaboratively with the manufacturer to document how existing utility
    standards will be applied — this avoids inconsistent interpretation and repeated
    redesign.
