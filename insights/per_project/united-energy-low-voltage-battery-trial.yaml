  what_happened: The FCAS market changed materially during the project, with contingency
    prices decreasing significantly. The retail partner advised it was no longer economic
    to register for Victorian contingency FCAS markets, collapsing a key revenue stream
    in the value stack model and leading to the project being brought to a close before
    full commercial operation was achieved.
  lesson_learnt: Value stacking models that depend on wholesale market revenues (FCAS,
    arbitrage) are exposed to market change over multi-year project timelines — future
    business cases should stress-test revenue assumptions against market evolution
    and include fallback positions if a key revenue stream becomes unviable.
