  project_name: United Energy Low Voltage Battery Trial (Electric Avenue)
  what_happened: The BESS units successfully alleviated LV circuit constraints and
    delivered network reliability benefits, but the analysis of operational units
    showed that some circuits will still require further traditional augmentation
    in the short term because load growth has outstripped BESS capacity. Traditional
    network augmentation (conductor upgrades, transformer replacements) was found
    to remain more cost-effective and longer-lasting at current battery prices.
  lesson_learnt: Future BESS network support projects should use real lifecycle cost
    data from deployed projects (such as this trial) to validate least-cost comparisons
    against traditional augmentation before committing to BESS — at current battery
    prices and maintenance cost levels, conventional augmentation is often still the
    more cost-effective solution for resolving LV constraints.
