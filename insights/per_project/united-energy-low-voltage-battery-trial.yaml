  what_happened: Installation training was not adequately scoped at the outset. When
    installations commenced in late 2021, there was no structured training package
    for field crews, unclear responsibility boundaries between UE, the manufacturer
    (THYCON), and service delivery partners, and insufficient understanding of safe
    work practices for the new BESS asset class. Service delivery crews initially
    showed reluctance to handle and transport BESS units, causing delays.
  lesson_learnt: Installation and maintenance training must be treated as a defined
    scope item from project initiation — for novel asset classes, the absence of a
    structured training package and clear responsibility boundaries between the proponent,
    manufacturer, and service delivery partner creates safety risks, workforce reluctance,
    and installation delays.
