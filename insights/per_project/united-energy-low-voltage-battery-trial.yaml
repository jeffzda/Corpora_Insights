  publish_date: 2024-10
  project_name: United Energy Low-Voltage Battery Trial (Electric Avenue)
  what_happened: The AEMO registration threshold for FCAS market participation requires
    at least 1 MW of aggregated capacity. This proved a critical benchmark that constrained
    retailer participation incentives — Simply Energy had not commenced FCAS or wholesale
    arbitrage operations at the time of the report due to the combined effect of this
    threshold and upstream manufacturing and installation delays.
  lesson_learnt: Business cases that depend on achieving an aggregated capacity threshold
    for market participation (e.g. 1 MW for FCAS) are highly sensitive to installation
    delays — any slippage can push market entry past a window of favourable conditions;
    build contingency for delayed market entry and verify market assumptions remain
    valid close to the participation date.
