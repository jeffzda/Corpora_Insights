  what_happened: Integrating the BESS units into UE's business-as-usual operations
    created significant complexity. The protected IP nature of units created supplier
    dependency for maintenance; regular manual battery cycling required for warranty
    compliance did not align with standard asset management processes; dual-operation
    by UE and the retailer required bespoke dashboards; and full SCADA integration
    would require substantial additional investment.
  lesson_learnt: Early stakeholder engagement in product specification should encompass
    BAU operational requirements — failure to design for SCADA compatibility, standard
    asset management processes, and multi-party operational interfaces from the outset
    creates costly rework and ongoing operational dependencies on suppliers; all future
    BESS projects should require SCADA operability as a baseline specification.
