  source_title: Low-Voltage Grid Battery Energy Storage Systems Trial – Lessons Learnt
    Report No 2
  publish_date: '2022-03-08'
  project_name: United Energy Low Voltage Grid Battery Energy Storage Systems Trial
  what_happened: In a culturally and linguistically diverse (CALD) suburb in Melbourne's
    Monash Council area, residents were notified three times about the BESS installation
    but language barriers prevented several residents from engaging and raising concerns
    before construction began.
  lesson_learnt: Before community engagement in CALD areas, obtain demographic data
    from local councils and tailor communications for language barriers — generic
    English-only notifications are insufficient and risk excluding community members
    from the consultation process.
