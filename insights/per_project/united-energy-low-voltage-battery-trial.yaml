  what_happened: A limited pool of Australian service providers capable of developing
    and integrating the IEC 2030.5 protocol between the BESS and BAU systems necessitated
    engagement of an offshore provider, adding coordination complexity. Concurrently,
    COVID-19 pandemic disruptions caused supply chain delays and extended equipment
    lead times.
