- record_id: ARENA-DLV-13853
  source_title: Solar Thermal Foundation Project Results
  publish_date: '2014-06-24'
  project_name: Solar Thermal Foundation Project
  what_happened: Almost the entire 1.2MWth solar thermal tower facility — including
    world-class heliostat technology — was designed, manufactured and constructed
    using Australian companies and materials, demonstrating that CSP technology is
    well suited to domestic manufacturing despite Australia typically being an importer
    of energy technologies.
  lesson_learnt: CSP facility development, including heliostat design and fabrication,
    can be successfully delivered through Australian SMEs — future CSP projects should
    assess domestic supply chains rather than defaulting to imported technology, particularly
    for heliostat systems where local manufacturing proved cost-competitive and technically
    capable.
