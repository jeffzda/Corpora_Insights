- record_id: ARENA-DLV-13851
  source_title: Solar Thermal Foundation Project Results
  publish_date: '2014-06-24'
  project_name: Solar Thermal Foundation Project
  what_happened: Sourcing a small-scale Brayton cycle heat engine for the solar air
    turbine demonstration proved difficult due to the absence of local manufacturing
    capability. Most international suppliers were unwilling to supply a one-off custom
    turbine modified for solar thermal input without local technical support, causing
    delays to the solarised air turbine demonstration.
  lesson_learnt: Before committing to a demonstration milestone that depends on a
    bespoke heat engine or other niche hardware, confirm supplier willingness to supply
    custom one-off units early in design — absence of local manufacturing and reluctance
    of international suppliers to support R&D modifications can delay key demonstration
    milestones.
  issue_severity: moderate
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: procurement
  proponent_type: research organisation/university
  delay_category: procurement/supply chain
  failure_mode: execution & logistics
  outcome_class: delayed but recoverable
  secondary_failure_mode: poor scoping
  intervention_note: null
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar thermal
  source_pages: &id001
  - 8
  evidence_excerpt: The lack of local manufacturing capability for small scale brayton
    cycle turbines meant that the heat engine had to be sourced from international
    suppliers. With the added technical challenge of modifying a standard turbine
    design to allow for the solar thermal input with no local technical support, many
    of the potential suppliers were unwilling to provide a one off custom turbine
    for the purposes of research and development activities. This difficulty led to
    delays in the completion of the solarised air turbine demonstration on the facility.
