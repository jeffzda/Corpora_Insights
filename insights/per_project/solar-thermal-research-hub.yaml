- record_id: ARENA-DLV-13852
  source_title: Solar Thermal Foundation Project Results
  publish_date: '2014-06-24'
  project_name: Solar Thermal Foundation Project
  what_happened: A $5M investment in a concentrated solar thermal research facility
    at CSIRO Newcastle leveraged over $35M in follow-on research investment from major
    international partners including Mitsubishi Heavy Industries, Abengoa Solar, and
    General Electric, generating 4 heliostat patents and enabling multiple subsequent
    collaborative projects.
  lesson_learnt: Investment in shared, large-scale pilot research infrastructure for
    CSP can generate a high leverage ratio on follow-on funding — a well-specified
    facility with world-class capability attracts international industry partners
    and co-investment at multiples well above the initial public outlay.
