- record_id: ARENA-DLV-13854
  source_title: Solar Thermal Foundation Project Results
  publish_date: '2014-06-24'
  project_name: Solar Thermal Foundation Project
  what_happened: The CSIRO National Solar Energy Centre in Newcastle reached the limits
    of its existing facility capabilities by 2008, requiring construction of a new
    higher-capability solar tower to allow the next generation of CSP R&D to proceed.
    The Foundation Project addressed this gap by constructing a 30-metre tower with
    451 heliostats capable of temperatures up to 1500°C.
  lesson_learnt: Research infrastructure for CSP must be scoped to exceed current
    experimental requirements — facilities that cannot achieve target temperatures,
    flux levels, or flux control will constrain the research program and require capital
    replacement investment before next-generation development can proceed.
  issue_severity: moderate
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: concept/feasibility
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: A new 1.2MWth solar thermal tower with 451 locally-manufactured
    heliostats was constructed at the CSIRO Newcastle site, restoring and extending
    research capability.
  transferability: narrow
  delay_magnitude: null
  technology_domain: solar thermal
  source_pages: &id004
  - 4
  - 5
  evidence_excerpt: In 2008 the research needs of CSIRO's CSP program were extending
    beyond the technical capabilities of the existing facilities at CSIRO's National
    Solar Energy Centre in Newcastle. The next generation of research and development
    required a facility able to achieve higher temperatures, higher solar flux, improved
    flux control, and higher temperature receiver development.
  confidence_note: null
