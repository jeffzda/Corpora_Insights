- record_id: ARENA-DLV-15826
  source_title: Evaluation of ARENA's Impact and Effectiveness
  publish_date: 2019-11
  project_name: ARENA early funding programs — staff turnover impact
  what_happened: High staff turnover in ARENA's earlier programs resulted in a lack
    of continuity and consistency in project management, as found in the RAR Initiative
    evaluation. The handover process caused inefficiencies when project history and
    relationship continuity were lost and needed to be rebuilt between managers.
  lesson_learnt: Grant program continuity is materially affected by client manager
    turnover — structured handover protocols and relationship documentation should
    be mandatory for all active projects to prevent loss of institutional knowledge
    and proponent confidence.
