- record_id: ARENA-DLV-46613
  source_title: 'DEIP Dynamic Operating Envelopes Workstream: Outcomes Report'
  publish_date: 2022-03
  project_name: Solar Enablement Initiative (SEI) – University of Queensland
  what_happened: The University of Queensland Solar Enablement Initiative trialled a state estimation technique across seven medium-voltage distribution feeders in south-east Queensland, Victoria and Tasmania,
    demonstrating that more complex, optimal allocation of network capacity to customers can be performed in real-time using available data — and that there is potential for additional exports beyond static
    limits.
  lesson_learnt: State estimation approaches that work with available (rather than ideal) data can unlock additional network hosting capacity in real-time without requiring full sensor deployment — this
    approach, commercialised as GridQube, is transferable to other DNSPs seeking to implement DOEs with limited LV monitoring infrastructure.
