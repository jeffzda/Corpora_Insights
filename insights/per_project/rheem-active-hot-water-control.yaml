- record_id: ARENA-DLV-3564
  source_title: Rheem Final Lessons Learnt Report
  publish_date: 2024-05
  project_name: SA Smart Network Project
  what_happened: Non-solar customers were required to switch from a flat-rate household
    tariff to a Time-of-Use (ToU) tariff as a condition of participating in the PowerStore
    VPP trial. This was a harder sell than for solar customers, because non-solar
    customers could not easily see bill savings from ToU without also changing their
    behavioural electricity consumption patterns.
  lesson_learnt: Avoid requiring non-solar residential customers to move to a household
    ToU tariff as a condition of DER trial participation — the benefits of ToU are
    less tangible to non-solar customers and the added complexity suppresses uptake;
    consider allowing participation on a flat tariff with device-level managed load
    control applied separately.
