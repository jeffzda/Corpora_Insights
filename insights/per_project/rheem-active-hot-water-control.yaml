- record_id: ARENA-DLV-3553
  source_title: Rheem Final Lessons Learnt Report
  publish_date: 2024-05
  project_name: SA Smart Network Project
  what_happened: The project was designed with rigid preconditions including a mandated
    50/50 split between solar and non-solar customers and a specific required mix
    of five product types totalling 2,400 units. These preconditions proved too inflexible
    in practice and impeded sales, contributing to the project's failure to meet customer
    acquisition targets.
  lesson_learnt: Build flexibility into sales and channel strategies for complex DER
    products — rigid preconditions on customer type ratios and product mix agreed
    at project initiation can become major impediments if market conditions differ
    from assumptions; technical and knowledge outcomes can often still be achieved
    with a smaller, more flexible fleet.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: manufacturer/OEM
  delay_category: null
  failure_mode: poor scoping
  outcome_class: discontinued/not progressed
  secondary_failure_mode: commercial & market
  intervention_note: Project recommended that future programs set acquisition deadlines
    and modest minimum volume targets rather than large fixed targets, and allow sales
    to continue during the testing phase.
  transferability: broad
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id001
  - 10
  - 11
  evidence_excerpt: The conditions of sales were agreed on initiation of the project,
    however, learnings and feedback from the project and customers suggested a more
    flexible agile approach to sales should have been envisaged particularly if the
    technical and knowledge outcomes for the project were still met.
  confidence_note: null
