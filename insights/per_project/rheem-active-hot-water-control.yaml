- record_id: ARENA-DLV-64751
  source_title: 'ARENA Insights Spotlight: Rheem Smart Network Project - An Interview
    with Combined Energy Technologies'
  publish_date: 2021-11
  project_name: Rheem Smart Network Project
  what_happened: During behind-the-meter DER orchestration, CET encountered a wide
    variety of communication protocols across devices — CAN bus, Modbus, SunSpec,
    ECHONET, OCPP, and multiple proprietary UDP/TCP protocols — requiring custom integration
    work for each, rather than a single standards-based API pathway.
  lesson_learnt: DER integration projects should not assume standards-based APIs will
    be available across all devices — budget for protocol diversity and bespoke integration
    work for each device category, and prioritise vendors that expose controllable
    APIs before deployment.
