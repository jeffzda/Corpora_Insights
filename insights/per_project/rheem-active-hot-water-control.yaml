  what_happened: Marketing the PowerStore product as an energy storage device with
    over 13 kWh of capacity — using messaging such as 'it's like having battery storage
    at a quarter of the cost' — resonated with customers and appeared to improve the
    value proposition compared to positioning it purely as a smart water heater.
  lesson_learnt: For smart hot water systems with large thermal storage capacity,
    framing the product as an energy storage device in customer communications can
    be more effective than technical appliance-focused messaging — customers respond
    to the energy cost reduction narrative that battery-like framing provides.
