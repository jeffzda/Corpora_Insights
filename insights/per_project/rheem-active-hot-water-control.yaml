- record_id: ARENA-DLV-3552
  source_title: Rheem Final Lessons Learnt Report
  publish_date: 2024-05
  project_name: SA Smart Network Project
  what_happened: When the project pivoted away from retailer-led sales to dealer/installer
    channels, dealers and plumbers struggled to manage the energy contracting, tariff
    change, and meter exchange requirements that remained mandatory parts of every
    PowerStore sale. Requiring customers to sign two separate contracts — one with
    a project retailer and one with Rheem/CET — added significant complexity at the
    point of sale.
  lesson_learnt: VPP and smart appliance trials that require customers to change their
    energy retailer as a condition of participation will face substantial inertia
    — design the enrollment pathway to minimise switching requirements, or ensure
    the retailer has a dominant market share in the target geography before launch.
