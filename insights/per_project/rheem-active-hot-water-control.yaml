  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Project explored a retailer-agnostic approach but was unable
    to fully remove retail energy contracting requirements within the existing project
    structure.
  transferability: broad
  delay_magnitude: null
  technology_domain: DER
  source_pages:
