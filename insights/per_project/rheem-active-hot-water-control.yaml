  source_title: Rheem Final Knowledge Sharing Report
  publish_date: 2024-05
  project_name: SA Smart Network Project (Bringing SA Hot Water Load Under Active
    Control)
  what_happened: SAPN analysis showed that shifting the start time of existing off-peak
    controlled load hot water systems to the beginning of the solar generation period
    still produced a load profile poorly correlated to the solar generation curve,
    because all systems start within the same hour with only a 30-minute randomised
    offset and run at full power.
  lesson_learnt: Simple rescheduling of existing OPCL water heaters to daytime is
    insufficient to match the solar generation curve — effective solar soaking requires
    smart variable-power heating control and staggered dispatch across the fleet;
    DNSPs considering hot water demand management to address minimum demand should
    invest in individually addressable, variable-power devices rather than time-switch
    rescheduling alone.
