  project_name: SA Smart Network Project
  what_happened: Communication between project partners (retailers, Rheem, CET, installers)
    and between the project and customers was poorly coordinated. When energy prices
    rose sharply in early July 2022, customers became confused about why their bills
    were increasing while they were participating in the project, revealing a lack
    of coordinated messaging protocols across partners.
