- record_id: ARENA-DLV-3554
  source_title: Rheem Final Lessons Learnt Report
  publish_date: 2024-05
  project_name: SA Smart Network Project
  what_happened: The PowerStore smart hot water system was not eligible for South
    Australia's Retail Energy Productivity Scheme (REPS) credits, while competing
    heat pump water heaters attracted both REPS credits and federal STCs, allowing
    them to be sold fully installed for under $100. This made PowerStore effectively
    uncompetitive on price, caused retailers and sales channel partners to focus exclusively
    on REPS-eligible heat pumps, and was identified as one of the primary reasons
    for the project's early termination.
  lesson_learnt: Smart grid-interactive appliances competing against incentive-eligible
    substitutes require inclusion in relevant energy efficiency schemes before or
    at product launch — regulatory exclusion from schemes such as REPS allowed heat
    pumps to undercut the PowerStore on price precisely when market growth was occurring,
    and the window to correct this was missed before project closure.
  issue_severity: critical
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: approvals/contracting
  proponent_type: manufacturer/OEM
  delay_category: approvals/regulatory
  failure_mode: commercial & market
  outcome_class: discontinued/not progressed
  secondary_failure_mode: regulatory & approvals
  intervention_note: Rheem submitted to the SA Minister's office in February 2022
    seeking REPS inclusion for PowerStore at an equivalent credit level to heat pumps;
    after a change of government the submission was resent in April 2022, but no decision
    was received from either the Minister or DEM as of December 2023.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: DER
  source_pages:
  - 12
  - 13
  - 14
  - 15
  - 35
  - 36
  evidence_excerpt: Under any scheme, the flexible, controlled load PowerStore water
    heaters were not eligible for significant credits and could not compete effectively
    with heat pump water heaters... The market for heat pumps grew dramatically during
    from 2019 through to 2022 as incentives began to fuel growth... just the PowerStore
    smart hot water system was launching.
  confidence_note: issue_severity assessed as critical because the REPS exclusion
    was identified as one of the primary causes of project termination, not merely
    a contributing factor. Canonical record merged from 2 source records across 2
    document(s).
