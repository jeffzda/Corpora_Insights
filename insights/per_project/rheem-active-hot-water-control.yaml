  intervention_note: On the suggestion of AGL, installers were directed to pre-wire
    a connection tail on the smart water meter circuit and clearly label it, so that
    the MC could terminate it directly into the controlled load output of the new
    smart electricity meter without requiring the installer to return; this reduced
    multi-visit requirements substantially.
