  source_title: Rheem Final Knowledge Sharing Report
  publish_date: 2024-05
  project_name: SA Smart Network Project (Bringing SA Hot Water Load Under Active
    Control)
  what_happened: Assessment of retrofit solar diverter devices versus full smart water
    heater replacement found that retrofits lack legionella control, tank temperature
    profiling, real-time monitoring of available hot water, shorter warranties, and
    may damage water heater thermostats if switching frequently, despite having a
    lower upfront cost.
  lesson_learnt: Retrofit solar diverter devices are an inferior solution to purpose-built
    smart water heaters for VPP and FCAS applications due to missing safety features
    (legionella control), lack of real-time monitoring, and risk of thermostat damage
    from frequent switching — programs should clearly differentiate between retrofit
    and replacement pathways and reserve retrofit targeting for customers with recently
    acquired water heaters (less than 4–5 years old).
