- record_id: ARENA-DLV-64754
  source_title: 'ARENA Insights Spotlight: Rheem Smart Network Project - An Interview
    with Combined Energy Technologies'
  publish_date: 2021-11
  project_name: Rheem Smart Network Project
  what_happened: The project identified that as more DER types are installed per home,
    meeting dynamic operating envelope requirements set by DNSPs becomes very difficult
    or impossible if each DER is independently controlled rather than managed at a
    Whole-of-Home level.
  lesson_learnt: Whole-of-Home (WoH) DER management architecture should be deployed
    at the outset of DER rollouts — retrofitting WoH control capability after individual
    devices are already independently operating adds unnecessary cost and complexity,
    and makes compliance with dynamic operating envelopes increasingly unworkable
    as the number of devices per home grows.
  issue_severity: minor
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: null
  failure_mode: poor scoping
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: CET developed a Whole-of-Home management approach encapsulating
    all devices behind a single NMI-level resource to simplify DNSP dynamic operating
    envelope compliance.
  transferability: broad
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id033
  - 4
  evidence_excerpt: The challenge is to ensure that WoH architecture is deployed early
    in the DER deployments as retrofitting the technology will add unnecessary costs.
  confidence_note: Issue severity set to minor — this is a design architecture finding
    rather than a realised delivery failure during the project itself; the lesson
