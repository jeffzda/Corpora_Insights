- record_id: ARENA-DLV-51516
  source_title: Rheem Final Knowledge Sharing Report
  publish_date: 2024-05
  project_name: SA Smart Network Project (Bringing SA Hot Water Load Under Active
    Control)
  what_happened: For households with medium hot water usage and a large PV system
    (MHW-LPV), the HEMS solution and OPCL delivered very similar consumer electricity
    costs because the large PV system and low hot water usage resulted in high export
    and low grid purchases for both scenarios. The distribution of retailer network
    savings to consumers was identified as the key mechanism to make smart control
    more attractive than OPCL in this segment.
  lesson_learnt: In configurations where consumer bill differences between smart HEMS
    and OPCL are small, the network and retailer savings generated by smart water
    heaters should be redistributed to consumers as tariff incentives — without this,
    consumer uptake of more expensive smart technology over cheaper OPCL will remain
    limited in the high-export, low-demand segment.
