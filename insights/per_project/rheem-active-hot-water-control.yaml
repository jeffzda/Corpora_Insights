  project_name: SA Smart Network Project
  what_happened: As the project expanded into dealer, installer, and plumber channels,
    those channels lacked the training and product knowledge to sell PowerStore as
    an energy management system rather than a simple appliance. Initial training was
    insufficient, leading to installation issues and difficulty explaining the product's
    energy contracting components to customers.
  lesson_learnt: When deploying DER products through hardware-oriented channels such
    as plumbers and electricians, invest early in frequent, practical training that
    covers both the physical installation and the energy management proposition —
    hardware sellers require structured support to explain tariff changes, contracts
    and system benefits that are outside their normal expertise.
