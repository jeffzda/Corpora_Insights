- record_id: ARENA-DLV-3555
  source_title: Rheem Final Lessons Learnt Report
  publish_date: 2024-05
  project_name: SA Smart Network Project
  what_happened: Retailers and major sales channel partners in South Australia were
    contractually focused on delivering REPS credits to meet escalating annual obligations
    (growing 5–16% per year from 2021 to 2023), causing them to refuse to promote
    or sell PowerStore or allocate customer contact opportunities to non-REPS products.
  lesson_learnt: When designing a DER trial that relies on retail energy partners
    or sales channel partners for customer acquisition, assess whether those partners
    carry regulatory obligations (such as energy efficiency scheme targets) that will
    crowd out their capacity to promote non-compliant products — if so, either seek
    scheme inclusion or design a sales channel that is independent of obligated parties.
