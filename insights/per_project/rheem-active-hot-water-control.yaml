- record_id: ARENA-DLV-51521
  source_title: Rheem Final Knowledge Sharing Report
  publish_date: 2024-05
  project_name: SA Smart Network Project (Bringing SA Hot Water Load Under Active
    Control)
  what_happened: The project identified that 1 kW of water heating capacity cannot
    fully absorb the output of 1 kW of solar PV on a spring day because a typical
    250L, 3.6 kW hot water service may only consume around 10 kWh daily in mild weather,
    while a 5 kW rooftop PV system can generate over 25 kWh on a spring day.
  lesson_learnt: Water heating load is structurally insufficient to fully absorb co-located
    solar PV generation on a 1:1 basis in spring — demand management programs should
    target the midday peak generation window specifically rather than spreading hot
    water load broadly across solar hours, and should complement water heating with
    other flexible loads (pool pumps, air conditioning, batteries) for effective duck
    curve management.
  issue_severity: none
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: manufacturer/OEM
