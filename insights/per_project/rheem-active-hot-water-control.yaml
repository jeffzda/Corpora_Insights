  evidence_excerpt: In simple terms, 1kW of water heating will not have the storage
    capacity to fully absorb the output of 1kW of solar PV on a spring day. This means
    there should be particular focus put on making sure the controlled hot water is
    targeted at minimising peak generation through the middle part of the day, which
    will have the most impact on network and system stability issues.
