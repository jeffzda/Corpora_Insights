  source_title: Rheem Final Knowledge Sharing Report
  publish_date: 2024-05
  project_name: SA Smart Network Project (Bringing SA Hot Water Load Under Active
    Control)
  what_happened: The hot water load profile arising from traditional OPCL timing (all
    systems start in the same hour with a 30-minute randomised start and run at full
    power) also varies significantly by season and region depending on distribution
    of water temperatures across the fleet at the start of the heating cycle, further
    complicating alignment with solar generation profiles.
  lesson_learnt: Regional and seasonal variation in hot water load curves must be
    accounted for in demand management scheduling algorithms — load shifting programs
    that use a single static schedule will deliver inconsistent solar absorption outcomes
    across seasons and network regions, and dynamic, weather- and usage-aware scheduling
    is necessary for reliable duck curve management.
