  source_title: South Australian Smart Network Project Lessons Learnt Report 2
  publish_date: 2022-04
  project_name: SA Smart Network Project
  what_happened: AEMO's proposed amendments to the Market Ancillary Service Specification
    (MASS) — intended to lower barriers for DER to participate in FCAS markets — threatened
    to dilute FCAS revenues for existing VPP participants by enabling a large influx
    of new entrants, including residential batteries, into the same markets. FCAS
    was estimated to represent up to 75% of total VPP revenue.
  lesson_learnt: VPP project economics that depend heavily on FCAS revenues carry
    significant regulatory risk — proponents should model downside scenarios in which
    FCAS market rule changes substantially reduce per-unit revenues, and design commercial
    structures that remain viable under materially lower ancillary service income.
