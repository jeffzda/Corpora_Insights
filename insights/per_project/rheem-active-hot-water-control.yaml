- record_id: ARENA-DLV-3551
  source_title: Rheem Final Lessons Learnt Report
  publish_date: 2024-05
  project_name: SA Smart Network Project
  what_happened: The project was structured so that sales of the PowerStore smart
    hot water system were primarily driven through a retail energy channel partner,
    but the retailer was unable to deliver the projected volume of sales from its
    own customer base (which represented only 15% of the SA market). The project failed
    to meet its customer acquisition targets and was mutually terminated early.
  lesson_learnt: Do not rely on a retail energy channel partner as the primary sales
    acquisition channel for complex DER hardware products — dealers and installers
    with pre-existing customer relationships are better suited to selling high-cost
    physical products, provided they receive support for the energy contracting components
    of the sale.
  issue_severity: critical
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: manufacturer/OEM
  delay_category: null
  failure_mode: coordination & stakeholders
  outcome_class: discontinued/not progressed
  secondary_failure_mode: commercial & market
  intervention_note: Project pivoted to Dealers/Installers as primary sales channel
    and onboarded an additional retailer and plumbers, but was constrained by remaining
    energy contracting requirements that continued to hamper acquisition.
  transferability: broad
  delay_magnitude: null
  technology_domain: DER
  source_pages:
  - 5
  - 9
  - 33
  - 34
  evidence_excerpt: As the project progressed it became apparent that Energy Retailers
    were not best placed to drive demand and align to customer behaviours in the hot
    water breakdown market and new upgrade market. The breakdown market is significant
    in terms of size, and we are observing that the behaviours of these customers
    is driven by time (to get hot water back ASAP) and price (as it is an unplanned
    household cost), both of which make it more challenging to offer them a higher
    priced and more complex product like a smart electric water heater as part of
    a VPP.
  confidence_note: outcome_class is critical/discontinued — the document states the
    project was halted due to failure to meet customer numbers and mutually terminated.
