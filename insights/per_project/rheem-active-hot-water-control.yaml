  what_happened: The project initially structured the customer rebate as two phased
    'cash back' payments — one at sign-up and a second conditional on remaining in
    the program past August 31, 2022. This split structure was found to be insufficiently
    compelling to drive customer sign-up, so Rheem changed to a single full upfront
    payment.
