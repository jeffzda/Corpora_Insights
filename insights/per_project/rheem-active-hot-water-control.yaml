- record_id: ARENA-DLV-64752
  source_title: 'ARENA Insights Spotlight: Rheem Smart Network Project - An Interview
    with Combined Energy Technologies'
  publish_date: 2021-11
  project_name: Rheem Smart Network Project
  what_happened: Some battery and EV charger brands encountered during the project
    did not provide APIs, meaning HEMS could not control those devices. This caused
    unintended outcomes including batteries discharging into storage devices during
    off-peak periods and VPP export events being negated by uncontrolled devices charging
    in response to grid exports.
  lesson_learnt: Before deploying HEMS or DER aggregation at a site, verify that all
    battery and EV charger brands present expose controllable APIs — devices without
    APIs actively undermine HEMS optimisation and VPP participation, and this cannot
    be resolved post-installation without device replacement.
