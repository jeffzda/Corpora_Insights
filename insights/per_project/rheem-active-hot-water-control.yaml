- record_id: ARENA-DLV-3561
  source_title: Rheem Final Lessons Learnt Report
  publish_date: 2024-05
  project_name: SA Smart Network Project
  what_happened: The meter exchange process at installation was cumbersome and required
    multiple site visits from different parties — the water heater installer and the
    Metering Coordinator (MC), sometimes also a Metering Provider (MP). MCs arriving
    on site after installation frequently could not complete the smart meter replacement
    because they did not know how to connect it to the water heater circuit, requiring
    the installer to return for a second visit.
  lesson_learnt: Standardise the handover process between water heater installers
    and metering coordinators before commencing rollout — pre-wiring a clearly labelled
    connection point at installation that the MC can use to terminate the controlled
    load circuit eliminates the need for return visits and significantly improves
    customer experience.
