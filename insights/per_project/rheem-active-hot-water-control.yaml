- record_id: ARENA-DLV-64753
  source_title: 'ARENA Insights Spotlight: Rheem Smart Network Project - An Interview
    with Combined Energy Technologies'
  publish_date: 2021-11
  project_name: Rheem Smart Network Project
  what_happened: A large installed base of legacy appliances — water heaters, air
    conditioners, pool pumps — lacked native networking capabilities and could not
    be leveraged as DERs without additional integration hardware, limiting the scalable
    deployment of HEMS across the existing building stock.
  lesson_learnt: DER orchestration projects targeting existing residential building
    stock should account for the absence of native networking in legacy appliances
    — retrofit load control adapters (as developed by CET) are required and their
    installation cost and logistics should be factored into total deployment cost
    from the outset, not treated as incidental.
