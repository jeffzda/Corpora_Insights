- record_id: ARENA-DLV-18005
  source_title: South Australian Smart Network Project Lessons Learnt Report 2
  publish_date: 2022-04
  project_name: SA Smart Network Project
  what_happened: The hot water 'breakdown market' — customers replacing a failed system
    urgently — proved incompatible with the project's sales process, as these customers
    prioritised speed and low cost over a higher-priced, more complex smart product
    requiring VPP enrolment.
  lesson_learnt: DER programs targeting emergency replacement moments (e.g. hot water
    breakdown) must offer a fast, low-friction enrolment pathway — a complex trial
    sign-up is structurally mismatched with time-pressured, unplanned purchases; consider
    pre-qualified installer networks and simplified point-of-sale enrolment to capture
    this market.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: manufacturer/OEM
  delay_category: stakeholder/land/community
  failure_mode: commercial & market
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Project opened new sales channels through plumbing businesses,
    improved promotional materials, and added retail partners to reduce perceived
    barriers to entry.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: DER
  source_pages: &id010
  - 8
  - 9
  evidence_excerpt: The breakdown market is significant in terms of size, and we are
    observing that the behaviours of these customers is driven by time (to get hot
    water back ASAP) and price (as it is an unplanned household cost), both of which
    make it more challenging to offer them a higher priced and more complex product
    like a smart electric water heater as part of a VPP.
  confidence_note: secondary_failure_mode of design assumption failure coded because
    the project's original customer acquisition model did not adequately account for
    breakdown-market purchasing behaviour.
