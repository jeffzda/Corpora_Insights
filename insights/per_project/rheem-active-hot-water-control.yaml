- record_id: ARENA-DLV-18001
  source_title: South Australian Smart Network Project Lessons Learnt Report 2
  publish_date: 2022-04
  project_name: SA Smart Network Project
  what_happened: The global semiconductor shortage, exacerbated by COVID-19, caused
    chip component lead times to blow out from approximately 18 weeks to 54 weeks
    in some cases, limiting the supply of smart electric water heaters and retrofit
    devices available for customer deployment and constraining manufacturing output
    for the project.
  lesson_learnt: Design smart DER hardware to be tolerant of generic, widely available
    semiconductor components rather than specific proprietary chips — procuring based
    on availability of pin-compatible alternatives rather than specific technical
    properties insulates device manufacturing from global chip shortages.
