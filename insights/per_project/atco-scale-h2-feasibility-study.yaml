  project_name: ATCO ScaleH2
  what_happened: The study identified that seaborne hydrogen import opportunities
    for Australia are materially sensitive to delays in European pipeline infrastructure
    development — a 5-year delay in pipeline delivery was modelled to boost seaborne
    imports by more than 0.5 MtH2e in 2030, while lower domestic European project
    success rates could boost overseas ammonia imports by more than 3 MtH2e by 2050.
  lesson_learnt: Australian hydrogen export project developers should monitor the
    progress of European Hydrogen Backbone pipeline infrastructure and European domestic
    hydrogen project FID rates as leading indicators of seaborne market size — delays
    or failures in European supply infrastructure directly expand the addressable
    market for Australian exporters and should inform the timing of offtake contracting
    efforts.
