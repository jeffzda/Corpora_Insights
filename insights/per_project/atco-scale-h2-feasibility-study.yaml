- record_id: ARENA-DLV-7709
  source_title: ATCO Scale H2 Feasibility Study - Market Study Report
  publish_date: 2024-05
  project_name: ATCO ScaleH2
  what_happened: The study found that Australian and German government funding levels
    for the bilateral hydrogen supply chain (up to AU$50m and €50m under HyGATE) were
    assessed by both governments as insufficient to bridge the cost gap and stimulate
    a commercial-scale hydrogen supply chain, with a potential AU$660 million green
    hydrogen funding initiative under discussion at the time of the study.
  lesson_learnt: The scale of bilateral government support required to commercialise
    a hydrogen export supply chain between Australia and Germany is orders of magnitude
    larger than initial pilot/demonstration funding — project developers should factor
    in the need to engage both Australian and German governments early on funding
    adequacy, and should not assume that demonstration-scale support commitments will
    be sufficient to underpin commercial FID.
