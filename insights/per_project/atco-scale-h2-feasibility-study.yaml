  what_happened: The commercial assessment found that H2Global fixes the product price
    for the full contract duration, meaning construction capex overruns and operational
    cost inflation (particularly power costs) represent high-priority risks for ScaleH2
    because they cannot be passed through to the offtaker after contract execution.
  lesson_learnt: Hydrogen producers bidding into fixed or cost-plus offtake mechanisms
    such as H2Global must build explicit buffers for capex overruns into their bid
    price — the fixed product price cannot be renegotiated if construction costs exceed
    the feasibility estimate, and power cost inflation cannot be recovered through
    the contracted price once locked.
