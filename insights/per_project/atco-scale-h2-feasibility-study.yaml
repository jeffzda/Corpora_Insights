  source_title: ATCO - Scale H2 Feasibility Study - Final Report
  publish_date: 2025-07
  project_name: ATCO ScaleH2 Feasibility Study
  what_happened: The commercial feasibility study found that ScaleH2's proposed 800
    ktpa production capacity significantly exceeds the scale of projects that have
    successfully secured offtake through European hydrogen auctions (H2Global, European
    Hydrogen Bank), where winning projects ranged from 66 ktpa to 300 ktpa, creating
    a risk that no single offtaker could absorb ScaleH2's full output under a single
    Hydrogen Purchase Agreement.
  lesson_learnt: Australian green hydrogen export projects targeting European auction
    mechanisms should size initial production phases to match the capacity range of
    previously successful auction bidders (sub-300 ktpa), or adopt a phased commissioning
    approach — at 800 ktpa, ScaleH2 exceeds single HPA contract sizes and risks being
    unable to contract its full capacity.
