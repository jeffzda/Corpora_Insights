  source_title: ATCO - Scale H2 Feasibility Study - Final Report
  publish_date: 2025-07
  project_name: ATCO ScaleH2 Feasibility Study
  what_happened: The port assessment at Port Kembla found that very few berths were
    suitable for ammonia export, with most inner harbour berths presenting unacceptable
    operational impacts, outer harbour berths either too close to sensitive receivers
    or lacking capacity for the design vessels, and the most suitable remaining berth
    requiring significant infrastructure upgrades plus having restrictions on vessel
    movements due to wind conditions.
  lesson_learnt: Port suitability for hazardous bulk liquid exports (e.g. ammonia)
    should be assessed in parallel with site selection from project inception — port
    infrastructure gaps and safety constraints can materially affect both capital
    cost and export productivity assumptions.
