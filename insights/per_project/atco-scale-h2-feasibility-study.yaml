  publish_date: 2024-05
  project_name: ATCO ScaleH2
  what_happened: The study found that government supply-side support, while necessary
    to make early Australian hydrogen export projects commercially viable, simultaneously
    constrains supplier profit to a moderate rate of return acceptable to the administering
    government agency — meaning projects structured around subsidy access cannot expect
    the full commercial upside suggested by market prices.
  lesson_learnt: Project developers and investors in early Australian hydrogen export
    projects should model a constrained return scenario as the base case when projects
    rely on government supply-side support — the profit ceiling imposed by administering
    agencies means that projects dependent on subsidies will not capture the full
    market premium, and financial models should reflect this from concept stage.
