  project_name: ATCO ScaleH2 Feasibility Study
  what_happened: The commercial study found that bank financing for renewable hydrogen
    projects requires offtake contracts extending beyond 1–2 years, while consulted
    offtakers expressed a preference for shorter 1–3 year contract durations, creating
    a structural mismatch between what producers and financiers need and what offtakers
    want.
  lesson_learnt: Hydrogen project developers should not rely on bilateral short-term
    offtake agreements to achieve bankability — project finance requires long-term
    revenue certainty (10+ years), and bridging the mismatch between offtaker preference
    for short tenors and lender requirements for long tenors typically requires an
    intermediary mechanism such as H2Global or an aggregating trader.
  issue_severity: major
  project_type: industrial decarbonisation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: approvals/contracting
  proponent_type: utility/energy retailer
  delay_category: financing/commercial close
  failure_mode: commercial & market
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The study highlighted H2Global's role in bridging this gap by
    signing long-term HPAs with producers and reselling to customers under shorter
    HSAs; it also noted that large German offtakers could act as intermediaries signing
    10–15 year contracts with producers while servicing flexible short-term downstream
    customers.
