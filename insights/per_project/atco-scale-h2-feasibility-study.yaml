  publish_date: 2024-05
  project_name: ATCO ScaleH2
  what_happened: Analysis of the German hydrogen import market found that only approximately
    5–7 seaborne import contracts are likely to be required to meet 2030 demand, with
    anticipated contract terms of 10–15 years meaning a significant share of early
    demand will be locked up by the mid-2020s, disadvantaging later entrants.
  lesson_learnt: Australian hydrogen export projects targeting Germany must move quickly
    to secure offtake — being among the first 5–7 projects to contract by ~2030 is
    likely to determine long-term market position, given 10–15-year contract terms
    will lock out later entrants from a substantial portion of available demand.
