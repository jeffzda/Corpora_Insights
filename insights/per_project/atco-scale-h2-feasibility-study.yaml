  publish_date: 2024-05
  project_name: ATCO ScaleH2
  what_happened: The study found that less than 12% of globally announced hydrogen
    projects had reached a final investment decision (FID) as of 2023, indicating
    a very high attrition rate between project announcement and commitment to invest
    — the modelling applied a 40% success rate to concept- and feasibility-stage projects
    to account for likely abandonments.
  lesson_learnt: Project developers and portfolio planners should apply a conservative
    success-rate adjustment (circa 40% or lower) when using announced hydrogen project
    pipelines as a basis for supply forecasting or competitive positioning — the historical
    FID conversion rate of less than 12% for announced projects indicates that announced
    capacity significantly overstates likely delivered supply.
