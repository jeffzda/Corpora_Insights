  source_title: ATCO - Scale H2 Feasibility Study - Final Report
  publish_date: 2025-07
  project_name: ATCO ScaleH2 Feasibility Study
  what_happened: The power firming assessment found that operating electrolysers in
    a steady-state mode (Scenario 1) was less capital-efficient than a shutdown operational
    scenario (Scenario 3), where electrolysers are shut down for 6 hours during peak
    grid demand, because Scenario 3 required the largest electrolyser nameplate capacity
    (1,380 MW) but allowed the design to simultaneously accommodate lower-demand scenarios.
  lesson_learnt: For grid-connected electrolysis plants, designing to a peak-shedding
    operational scenario rather than steady-state maximises capital efficiency and
    flexibility — a facility designed for the peak-shutdown scenario inherently accommodates
    steady-state and shaped operation at no additional capital cost.
