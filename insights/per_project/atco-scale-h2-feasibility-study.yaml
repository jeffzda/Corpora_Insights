  what_happened: The study found that EU RFNBO regulations impose strict additionality,
    temporal correlation, and geographic correlation requirements on hydrogen producers,
    and that the definition of a 'bidding zone' outside the European context has not
    yet been clarified for countries like Australia, creating a material regulatory
    ambiguity for Australian projects seeking to access EU supply-side support mechanisms.
  lesson_learnt: Australian hydrogen export projects must structure their electricity
    supply arrangements (PPAs and grid connections) to comply with EU additionality,
    temporal, and geographic correlation rules from project inception — and should
    proactively engage German and European government officials to resolve the definition
    of 'bidding zone' in the Australian context before seeking to access H2Global
    or equivalent schemes.
