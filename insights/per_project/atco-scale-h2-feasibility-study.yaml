  source_title: ATCO - Scale H2 Feasibility Study - Final Report
  publish_date: 2025-07
  project_name: ATCO ScaleH2 Feasibility Study
  what_happened: The feasibility study recommended engaging other proponents in the
    Port Kembla area to better understand future aggregate electricity demand, enabling
    collaborative planning and potential cost-sharing of the transmission infrastructure
    required to deliver 1.5 GW to the ScaleH2 site.
  lesson_learnt: In clustered industrial precincts where multiple large electricity
    consumers may co-locate, proponents should engage peer proponents early to aggregate
    demand signals to the network operator — this can unlock shared infrastructure
    investment and reduce per-project grid connection costs.
