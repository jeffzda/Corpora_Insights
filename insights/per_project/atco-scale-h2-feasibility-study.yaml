  project_name: ATCO ScaleH2 Feasibility Study
  what_happened: The feasibility study identified an opportunity to reduce water treatment
    plant capital cost and complexity by using a large buffer tank on the treated
    effluent supply to smooth out the highly variable and seasonal water demand from
    the adiabatic cooling system, allowing the WTP to be sized for average rather
    than peak demand.
  lesson_learnt: For green ammonia facilities using adiabatic cooling, buffer storage
    between the water treatment plant and the cooling circuit is a cost-effective
    design strategy — adiabatic cooling water demand is highly peaky and seasonal,
    and without a buffer tank the WTP must be oversized to meet peak instantaneous
    demand at significant unnecessary capital cost.
