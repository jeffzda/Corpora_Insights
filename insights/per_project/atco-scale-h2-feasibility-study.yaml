- record_id: ARENA-DLV-7710
  source_title: ATCO Scale H2 Feasibility Study - Market Study Report
  publish_date: 2024-05
  project_name: ATCO ScaleH2
  what_happened: The study found that direct market engagement with German offtakers
    had not yet occurred for the ATCO ScaleH2 project at the time of the feasibility
    study, and that volume, timing, price, and contractual requirements could only
    be observed through such direct engagement — meaning the commercial case remained
    indicative rather than grounded in confirmed offtaker appetite.
  lesson_learnt: Hydrogen export project developers should conduct direct market soundings
    with prospective German offtakers before finalising project design or scale —
    indicative demand models cannot substitute for confirmed offtaker requirements
    on volume, timing, price, and contract terms, and the absence of this engagement
    leaves the commercial case unvalidated.
