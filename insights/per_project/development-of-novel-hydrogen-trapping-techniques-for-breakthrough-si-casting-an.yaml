- record_id: ARENA-DLV-48102
  source_title: ARENA-Funded Cutting Edge Research in Photovoltaics
  publish_date: 2019-09
  project_name: Development of novel hydrogen trapping techniques for breakthrough
    Si casting and wafering technologies (2017/RND010)
  what_happened: The team demonstrated hydrogen trapping techniques that improved
    quasi-mono Si wafer quality by 70% beyond standard hydrogenation. However, they
    found that excess hydrogen caused degradation under light and heat, and that some
    localised grown-in defects (dislocations) did not respond to hydrogen trapping,
    leaving a residual performance limitation.
  lesson_learnt: Hydrogen passivation processes must be carefully controlled — excess
    hydrogen can itself introduce degradation under operational conditions, and certain
    defect types (dislocations) are not addressable by this technique; researchers
    and manufacturers should characterise defect populations before selecting passivation
    strategies.
