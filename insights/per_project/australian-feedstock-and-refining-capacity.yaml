- record_id: ARENA-DLV-26401
  source_title: Australian Feedstock and Refining Capacity to Produce Sustainable
    Aviation Fuel (SAF)
  publish_date: 2013-06
  project_name: Australian SAF Feasibility Study
  what_happened: The feasibility study found that establishing a commercially viable
    SAF manufacturing industry in Australia using the HEFA pathway is not economically
    viable under current conditions. The net present value of the base case scenario
    was negative A$1.93 billion, with a long-run marginal cost of A$1.94 per litre
    compared to a conventional jet fuel price of A$0.65–0.95 per litre.
  lesson_learnt: Before committing to SAF production infrastructure, project developers
    must confirm that feedstock can be sourced substantially below prevailing market
    prices — the study demonstrated that feedstock costs alone exceeded total product
    revenue in every modelled scenario, making the economics structurally unviable
    without either cheap feedstock or significant government support.
