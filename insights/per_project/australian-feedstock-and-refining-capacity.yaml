  what_happened: The reduced-scale (1,000 tonnes per day) bio-refinery scenario produced
    worse unit economics than the base case (3,000 tonnes per day), with an LRMC of
    A$2.26 per litre versus A$1.94, because capital costs only reduced by half while
    throughput reduced by two-thirds. Aggregation and pre-treatment infrastructure
    costs showed particular diseconomies of scale.
  lesson_learnt: Scaling down a bio-refinery to match limited domestic feedstock availability
    does not improve unit economics and may worsen them — the high fixed costs of
    aggregation, pre-treatment and hydrogen manufacturing infrastructure do not scale
    proportionally, so developers should not assume a smaller plant reduces financial
    risk per unit of output.
