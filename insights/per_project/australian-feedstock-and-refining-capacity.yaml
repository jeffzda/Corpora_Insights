  publish_date: 2013-06
  project_name: Australian SAF Feasibility Study
  what_happened: The study found that the ASTM D7566 certification process limits
    SAF to a maximum 50% blend by volume with conventional jet fuel, and that only
    two pathways (FT-SPK and HEFA/HRJ) were certified at the time of the study. The
    certification process involves extensive fuel property, component performance
    and compatibility testing, creating a significant barrier to entry for new conversion
    technologies.
  lesson_learnt: Developers of novel SAF conversion technologies must plan for a multi-year
    ASTM certification process as a critical path item — the certification requirement
    is non-negotiable for commercial aviation use, requires significant investment
    in testing across fuel properties, component performance and compatibility, and
    cannot be abbreviated even with strong safety performance data.
