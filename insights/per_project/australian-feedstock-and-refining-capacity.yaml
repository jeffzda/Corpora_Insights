  source_title: Australian Feedstock and Refining Capacity to Produce Sustainable
    Aviation Fuel (SAF)
  publish_date: 2013-06
  project_name: Australian SAF Feasibility Study
  what_happened: The study found that even a government capital contribution of A$500
    million would be insufficient to generate a positive NPV under most base case
    scenarios, because the ongoing annual operating loss of approximately A$300 million
    per year during the early operating phase dominates the economics. Only a full
    A$0.38 per litre grant on all renewable products for the life of the project (beyond
    2021) produced a positive NPV in the base case.
  lesson_learnt: Government capital grants for SAF facilities, while helpful, do not
    address the fundamental operating loss driven by feedstock cost exceeding product
    revenue — any government support program for SAF must include ongoing production
    incentives (such as equalised production grants across all renewable fuel products)
    rather than relying on upfront capital contributions alone.
