  publish_date: 2013-06
  project_name: Australian SAF Feasibility Study
  what_happened: 'The study found that lignocellulosic (LC) biomass feedstock, while
    cheap and plentiful in Australia, suffers from a ''chicken-and-egg'' commercial
    problem: there is no established supply chain because no certified conversion
    pathway exists for commercial aviation use, and no investment in conversion technology
    will occur without feedstock supply certainty. Alcohol-to-jet (ATJ) and thermochemical
    pathways were not yet ASTM certified at the time of study.'
  lesson_learnt: LC biomass-based SAF pathways require parallel development of both
    feedstock supply chains and conversion technology certification — sequential development
    (waiting for certification before building supply, or vice versa) will not work
    because neither side will invest without certainty from the other, requiring government-coordinated
    co-investment to unlock the opportunity.
