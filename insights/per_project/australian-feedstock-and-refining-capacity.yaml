  publish_date: 2013-06
  project_name: Australian SAF Feasibility Study
  what_happened: The study found that the FT pathway using waste (MSW) feedstock has
    potential in Australia given sufficient waste volumes in Sydney and Melbourne,
    and landfill levies of A$95.20/tonne in NSW and A$48.40/tonne in Victoria that
    could make waste feedstock 'negative cost'. However, key assumptions including
    technology scale-up, long-term waste supply agreements, and site access remained
    unproven.
  lesson_learnt: Waste-to-fuel FT projects in Australia should prioritise securing
    long-term waste supply agreements with waste companies before committing to capital
    expenditure — the economic model depends on being paid to accept waste rather
    than purchasing it, and this requires multi-year contractual certainty that cannot
    be assumed from waste market dynamics alone.
