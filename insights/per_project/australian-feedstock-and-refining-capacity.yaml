  what_happened: The study found that analysis of the hydrogen desulphurisation units
    at the former Shell Clyde refinery in Sydney found the plant technically incompatible
    with conditions required to process bio-oil, due to design constraints of the
    original unit. Even the most promising idle asset (a reactor at Shell's Geelong
    refinery) would require replacement of most supporting equipment and faced potential
    commissioning challenges from poor vessel integrity.
  lesson_learnt: Project developers exploring conversion of decommissioned refinery
    assets for bio-oil processing should conduct thorough equipment integrity and
    compatibility assessments before including reuse of existing assets in their capital
    cost models — the apparent cost saving from reusing existing reactor hardware
    may be offset or eliminated by the need to replace most supporting equipment and
    address unexpected integrity issues.
