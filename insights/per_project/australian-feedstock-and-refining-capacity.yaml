  project_name: Australian SAF Feasibility Study
  what_happened: The study identified that molecule tracking for carbon accounting
    purposes is structurally impractical under the HEFA pathway, because SAF must
    be certified separately as 100% renewable kerosene and then blended with conventional
    jet fuel before entering the airport supply chain, making it impossible to trace
    the SAF to any specific aircraft fuelling event.
  lesson_learnt: SAF supply chain designers must plan for alternative carbon accounting
    mechanisms such as a 'book and claim' system from the outset — the physical infrastructure
    of blending SAF with conventional jet fuel before airport distribution makes direct
    molecule tracking to point of consumption technically infeasible, and a regulatory
    solution must be in place before commercial operations begin.
