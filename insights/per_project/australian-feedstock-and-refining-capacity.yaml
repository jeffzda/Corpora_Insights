  what_happened: The study found that Australia's eight bio-diesel facilities built
    from 2006 onwards experienced widespread commercial failure, with only four still
    operating and the remainder operating below capacity. Facilities struggled to
    develop a bio-diesel market even with access to the Energy Grants (Cleaner Fuels)
    Scheme providing a A$0.38 per litre grant, driven by high feedstock costs.
