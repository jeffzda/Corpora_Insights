- record_id: ARENA-DLV-26403
  source_title: Australian Feedstock and Refining Capacity to Produce Sustainable
    Aviation Fuel (SAF)
  publish_date: 2013-06
  project_name: Australian SAF Feasibility Study
  what_happened: Although Australia produces approximately 1.6 million tonnes of natural
    oils annually, the study found that in practice very limited rateable domestic
    feedstock is available for SAF production at competitive prices. Approximately
    42% of domestic natural oils are exported at higher export prices, and non-food
    volume available for domestic use represents only 15% of total production.
  lesson_learnt: Feasibility studies for biofuel projects must distinguish between
    total domestic production volumes and actually accessible, competitively priced
    feedstock — headline availability figures can be misleading when much of the volume
    is already committed to export markets or higher-value applications.
