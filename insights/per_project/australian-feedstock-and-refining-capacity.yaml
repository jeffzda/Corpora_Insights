- record_id: ARENA-DLV-26419
  source_title: Australian Feedstock and Refining Capacity to Produce Sustainable
    Aviation Fuel (SAF)
  publish_date: 2013-06
  project_name: Australian SAF Feasibility Study
  what_happened: The study found that bio-feedstock and intermediate renewable hydrocarbons
    are incompatible with existing refinery infrastructure due to acidity, high oxygen
    content (10% wt), metals and other contaminants. A separate aggregation and pre-treatment
    facility costing A$115 million capex and A$9 million per year opex (base case)
    is required to ensure feedstock compatibility with hydroprocessing equipment,
    and must be physically segregated from the existing refinery precinct.
  lesson_learnt: HEFA bio-refinery projects should budget for a substantial standalone
    aggregation and pre-treatment facility in addition to the manufacturing plant
    — the chemical incompatibility of bio-feedstock with conventional refinery infrastructure
    means co-location does not eliminate the need for separate segregated processing
    infrastructure, and this cost does not scale proportionally with throughput.
