- record_id: ARENA-DLV-26407
  source_title: Australian Feedstock and Refining Capacity to Produce Sustainable
    Aviation Fuel (SAF)
  publish_date: 2013-06
  project_name: Australian SAF Feasibility Study
  what_happened: Targeting SAF (kerosene) production over renewable diesel requires
    hydrocracking diesel-range molecules, which simultaneously increases production
    of lower-value naphtha and refinery gas. The economic analysis showed that the
    maximum SAF production configuration resulted in a project NPV of negative A$2.13
    billion compared to negative A$1.76 billion for maximum diesel production — a
    A$370 million disadvantage.
  lesson_learnt: SAF projects using the HEFA pathway face an inherent economic penalty
    when maximising jet fuel output because the cracking process that converts diesel
    to kerosene simultaneously degrades product value by generating more low-value
    naphtha and gas — project economics must model the full product slate and not
    assume maximum SAF yield is optimal.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
