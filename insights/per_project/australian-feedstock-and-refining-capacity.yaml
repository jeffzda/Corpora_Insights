- record_id: ARENA-DLV-26429
  source_title: Australian Feedstock and Refining Capacity to Produce Sustainable
    Aviation Fuel (SAF)
  publish_date: 2013-06
  project_name: Australian SAF Feasibility Study
  what_happened: The study found that the Pongamia tree, an emerging non-food oilseed
    feedstock with strong sustainability credentials, has a maturation period of 4–5
    years before producing any oil, an estimated domestication period of 5–7 years,
    and a horizon for commercial volumes of 10–15 years. Production costs were estimated
    unlikely to fall below A$2,000 per tonne without significant plant science investment
    over several years.
  lesson_learnt: Long-cycle perennial feedstock crops such as Pongamia should not
    be included in SAF project development timelines without accounting for decade-scale
    lead times and the compounding risk of delayed cash flows — the 10–15 year horizon
    to commercial volumes means Pongamia-based strategies require patient capital
    structures fundamentally different from conventional project finance.
