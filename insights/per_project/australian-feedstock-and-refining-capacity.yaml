  what_happened: Autotrophic algae bio-fuel companies globally experienced great difficulty
    scaling up to commercial viability over the five years prior to this study. Despite
    R&D investment from US and other governments, no algal bio-fuel company had demonstrated
    an economically viable production pathway for commercial fuel volumes. Commercial
    scale demonstration beyond a large pilot was estimated to be 3–5 years away globally
    and 5–7 years in Australia.
  lesson_learnt: Algae-based SAF projects should be treated as long-horizon, high-risk
    ventures requiring significant de-risking before commercial investment — the consistent
    failure of algae companies to scale beyond demonstration phase reflects structural
    challenges in accessing conventional growth financing and managing the unique
    risk profile of scale-up in this pathway.
