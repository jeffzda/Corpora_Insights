- record_id: ARENA-DLV-26406
  source_title: Australian Feedstock and Refining Capacity to Produce Sustainable
    Aviation Fuel (SAF)
  publish_date: 2013-06
  project_name: Australian SAF Feasibility Study
  what_happened: Most Australian refineries were found to have insufficient hydrogen
    to process natural bio-oil or tallow feedstock, requiring additional hydrogen
    manufacturing units (HMU) to be constructed onsite. Conventional hydroprocessing
    of bio-feedstock consumes approximately three times more hydrogen than processing
    conventional petroleum streams, due to high oxygen content of bio-feedstock.
  lesson_learnt: HEFA bio-refinery projects co-located at Australian brownfield sites
    must include significant hydrogen manufacturing infrastructure in their capital
    plans — the hydrogen shortfall at existing refineries is a structural constraint
    that adds material capital and operating cost to any bio-oil hydroprocessing project.
