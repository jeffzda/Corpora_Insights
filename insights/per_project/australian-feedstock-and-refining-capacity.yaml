    in Queensland, Western Australia and the Northern Territory — the three Australian
    states with a suitable agro-climate for its cultivation, effectively precluding
    domestic Jatropha-based feedstock development in the short term.
  lesson_learnt: Developers of SAF feedstock programs in Australia must conduct a
    jurisdictional weed and biosecurity screening of candidate crops before committing
    to development pathways — regulatory classification as a noxious weed can eliminate
