- record_id: ARENA-DLV-26402
  source_title: Australian Feedstock and Refining Capacity to Produce Sustainable
    Aviation Fuel (SAF)
  publish_date: 2013-06
  project_name: Australian SAF Feasibility Study
  what_happened: The study identified that the price of natural oil feedstock is correlated
    to the price of crude oil, meaning that as crude oil prices rise (which would
    normally improve SAF competitiveness), feedstock costs also rise proportionally,
    neutralising the competitive benefit. This was observed across all major feedstock
    categories including tallow, canola, UCO and palm oil.
  lesson_learnt: SAF project developers using natural oil feedstock should not assume
    that rising crude oil prices will improve project economics — the strong correlation
    between natural oil and crude oil prices means feedstock costs track upward in
    step with product revenues, leaving the margin gap structurally unchanged.
