  what_happened: The study found that Western Australia has approximately half of
    Australia's Canola crop but only two small seed crushers, meaning most grain must
    be transported to ports for export rather than being crushed domestically for
    oil. This geographic mismatch between crop production and crushing capacity means
    that additional feedstock from idle crushing capacity would require most material
    to come from NSW and Victoria.
  lesson_learnt: Biofuel project developers relying on canola as a feedstock must
    map crushing infrastructure capacity and location against crop production geography
    — the mismatch between where seed is grown (WA) and where crushing capacity exists
    (NSW/Vic) creates logistics cost and supply certainty constraints that directly
    affect delivered feedstock economics.
