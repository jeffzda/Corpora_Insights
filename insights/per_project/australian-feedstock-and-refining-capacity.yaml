- record_id: ARENA-DLV-26404
  source_title: Australian Feedstock and Refining Capacity to Produce Sustainable
    Aviation Fuel (SAF)
  publish_date: 2013-06
  project_name: Australian SAF Feasibility Study
  what_happened: The Energy Grants (Cleaner Fuels) Scheme provided a 38 cents per
    litre grant for renewable diesel and biodiesel but not for SAF, naphtha or refinery
    gas. Combined with the techno-economic tendency of hydroprocessing Australian
    natural oils to produce diesel rather than jet fuel, this policy created a strong
    structural incentive to produce renewable diesel over SAF.
  lesson_learnt: Policy frameworks that grant production subsidies to specific fuel
    products (e.g., renewable diesel) but not others (e.g., SAF) within the same production
    pathway will systematically distort investment decisions — SAF projects competing
    for the same feedstock and refinery assets as subsidised diesel production face
    an uneven playing field that feasibility studies must quantify explicitly.
