    pathway are insufficient to drive commercial scale-up without a viable economic
    model — the HEFA pathway's proven operational benefits and decade of certification
    did not lead to commercial deployment in Australia because feedstock economics
    were not resolved, demonstrating that technology readiness and commercial readiness
    are independent challenges.
