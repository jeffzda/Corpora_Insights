  publish_date: 2013-06
  project_name: Australian SAF Feasibility Study
  what_happened: 'The study found that emerging feedstock crops such as algae, Jatropha,
    Pongamia, Camelina and mustard are trapped in a ''chicken-and-egg'' cycle: lack
    of commercial scale development means increased investor risk and reduced investment
    interest, compounded by the absence of bio-refining infrastructure to process
    them. Commercial scale ramp-up was estimated to be at least 5–7 years away in
    the Australian context.'
  lesson_learnt: Emerging feedstock programs for SAF require coordinated government
    intervention to break the investment cycle — commercial scale cannot be achieved
    without refinery offtake demand, and refinery investment will not proceed without
    secure feedstock supply, meaning public sector coordination and funding is a prerequisite
    for market entry rather than an optional supplement.
