- record_id: ARENA-DLV-26405
  source_title: Australian Feedstock and Refining Capacity to Produce Sustainable
    Aviation Fuel (SAF)
  publish_date: 2013-06
  project_name: Australian SAF Feasibility Study
  what_happened: Construction of a dedicated HEFA bio-refinery on a brownfield site
    was found to be necessary because existing Australian refinery hydroprocessing
    units are technically incompatible with neat bio-oil processing, and co-processing
    bio-feedstock with conventional petroleum streams cannot be certified as SAF under
    ASTM D7566. The capital cost for a 3,000 tonnes per day facility was approximately
    A$1 billion (2012).
  lesson_learnt: SAF project developers must budget for entirely new dedicated hydroprocessing
    equipment rather than planning to retrofit or co-process through existing refinery
    units — ASTM certification requirements for neat processing and technical incompatibilities
    with conventional units preclude the lower-cost conversion route, substantially
    increasing capital requirements.
