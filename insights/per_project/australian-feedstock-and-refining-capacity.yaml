  what_happened: The study found that imported commodity vegetable oils are difficult
    to rely on for SAF over the medium to long term due to high and volatile prices
    driven by food market demand, EU and US bio-fuel mandates creating a price floor,
    and increasing sustainability criteria. For the base case scenario, approximately
    70% of feedstock would need to be imported at a price close to import price parity.
