- record_id: ARENA-DLV-72281
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: '2015'
  project_name: PowerShade – Ergon Energy (Project ID 310)
  what_happened: Ergon Energy trialled PV panels integrated into tension membrane
    shade structures with zinc-bromine flow battery storage. While the PV and battery
    systems functioned and demonstrated peak-shaving capability, the PV array fixed
    to the shade sail was found not to be durable and required redesign.
  lesson_learnt: When integrating PV into non-standard mounting structures such as
    tension membrane shade sails, durability of the PV array under real operating
    conditions must be validated before deployment — technical function of generation
    and storage does not guarantee structural durability of novel mounting configurations.
