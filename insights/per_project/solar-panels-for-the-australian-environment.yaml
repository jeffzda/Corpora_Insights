  project_name: PV-Mate
  what_happened: Damp heat testing of encapsulants (85°C/85% RH for ~1000 hours per
    IEC61215) produced mixed and sometimes contradictory results — some UV-transparent
    samples degraded significantly while others improved in transmission, with no
    clear trend by encapsulant type, suggesting degradation mechanisms are material-composition-specific
    rather than purely driven by UV-blocking functionality.
  lesson_learnt: Damp heat degradation behaviour of encapsulants cannot be predicted
    from UV-blocking properties alone — project teams specifying encapsulants for
    Australian conditions should conduct material-specific damp heat testing rather
    than relying on generic functional categories, as performance varies significantly
    by manufacturer and formulation.
