  what_happened: Increasing the cell-to-cell gap in Tindo's modules from 2.5 mm to
    4 mm, based on modelling and mini-module tests, delivered a measured 0.7%–1.71%
    improvement in production module power across approximately 19,000 panels, validated
    across multiple cell efficiency bins.
  lesson_learnt: Optimising cell spacing is a zero-cost design change that reliably
    delivers ~1%–1.7% production power improvement for Australian-manufactured modules
    — module designers should model cell gap effects and validate on production statistics
    before fixing a standard gap, as the measurement uncertainty at mini-module scale
    requires large-sample production confirmation.
