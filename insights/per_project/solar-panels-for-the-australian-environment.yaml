  what_happened: Double-glass module lamination using conventional lamination procedures
    caused cell spreading (on average 1 mm greater cell separation than standard modules)
    and visual defects including EVA overflow, which were not resolved by reducing
    lamination pressure alone; the issue was identified across multiple full-size
    module fabrication runs.
