  project_name: PV-Mate
  what_happened: Switching Tindo Solar's module backsheet from black to white, prompted
    by CTM analysis early in the project, resulted in a measured 2.5% improvement
    in module STC power with no additional manufacturing cost, and was subsequently
    adopted into full production.
  lesson_learnt: Backsheet colour is a low-cost, high-impact design parameter for
    Australian manufacturers — switching from black to white backsheet delivers a
    measurable ~2.5% power improvement at negligible cost and should be considered
    a baseline standard for modules deployed in high-irradiance Australian conditions.
