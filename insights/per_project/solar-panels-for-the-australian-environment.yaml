  what_happened: Sourcing and testing 2.0 mm tempered glass for double-glass module
    construction revealed that the only available international supplier (Asahi) was
    supplying annealed or semi-tempered glass rather than fully tempered glass; this
    caused the glass to shatter when loaded into Tindo's production handling robot,
    and a separate glass backsheet module cracked during shipping and handling.
  lesson_learnt: When specifying thin glass for double-glass module production, verify
    tempering grade directly with the supplier and confirm compatibility with existing
    production handling equipment before committing to a design — semi-tempered glass
    that passes supplier specifications may fail under standard production robot handling,
    causing safety hazards and production disruption.
