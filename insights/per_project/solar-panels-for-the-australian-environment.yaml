  what_happened: Asahi Leoflex ultra-thin glass (1.1–1.8 mm) showed comparable optics
    to conventional glass at mini-module scale, but residual stresses from the lamination
    process caused the glass to shatter, and the project lacked resources to further
    develop the approach.
  lesson_warnt: Ultra-thin chemically tempered glass for solar modules requires custom
    lamination process development to manage residual thermal stresses — teams should
    budget for lamination process optimisation as a distinct workstream, separate
    from glass material evaluation, before committing to this technology pathway.
  lesson_learnt: Ultra-thin chemically tempered glass for solar modules requires custom
    lamination process development to manage residual thermal stresses — teams should
    budget for lamination process optimisation as a distinct workstream, separate
    from glass material evaluation, before committing to this technology pathway.
