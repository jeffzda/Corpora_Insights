    improvement over full-cell designs for PERC modules, achievable without UV-transparent
    EVA — manufacturers considering PERC adoption should evaluate half-cell configuration
    as the primary route to a positive CTM ratio, particularly for high-efficiency
    cells where resistive losses are more significant.
