- record_id: ARENA-DLV-20656
  source_title: PV-Mate Photovoltaic Modules for the Australian Environment—Final
    Report
  publish_date: '2018'
  project_name: PV-Mate
  what_happened: Testing of 10 encapsulant materials under extreme UV exposure (6×
    IEC61215 dose) found that UV-transparent (non-blocking) encapsulants experienced
    1.6%–4.35% reductions in transmission, while standard UV-blocking encapsulants
    showed minimal or negligible degradation, indicating that UV-transparent EVA carries
    a durability trade-off in high-UV environments such as Australia.
  lesson_learnt: UV-transparent EVA offers 1%–3% short-circuit current gains but degrades
    under extended UV exposure in the Australian environment — module designers should
    conduct extended UV durability testing (at least 6× IEC61215) before specifying
    UV-transparent encapsulants for Australian deployments, and should account for
    the transmission loss when modelling long-term yield.
  issue_severity: moderate
