  publish_date: '2018'
  project_name: PV-Mate
  what_happened: Modelling and NOCT testing demonstrated that double-glass modules
    with glass backsheeting can operate at lower temperatures than conventional polymer-backsheet
    modules under NOCT conditions (modelled 49.2°C vs 49.5°C), because the thermal
    conductivity of glass is 4–5 times higher than that of polymer backsheets, contrary
    to the common intuitive assumption that two glass layers would trap more heat.
  lesson_learnt: The assumption that double-glass modules run hotter than polymer-backsheet
    modules is incorrect — thermal modelling and NOCT testing should be conducted
    to verify operating temperature for any novel module form factor, as the higher
    thermal conductivity of glass can more than offset its greater thickness, resulting
    in lower cell operating temperatures and improved yield.
