  what_happened: Australia's temperate regions receive 40%–100% more direct solar
    radiation than comparable temperate regions in Europe, Asia, and the USA, and
    Australian UV radiation levels are 12%–15% higher than geographically similar
    northern hemisphere locations due to Earth's proximity to the Sun in January,
    low aerosol prevalence, and ozone depletion effects — conditions not adequately
    captured by standard Koppen-Geiger climate classification used in most existing
    PV performance standards.
  lesson_warnt: PV module designers, yield assessors, and procurement teams for Australian
    projects should not rely solely on European-derived climate classifications or
    IEC test protocols — Australian conditions (higher direct irradiance, higher UV,
    hot arid steppe climates) systematically differ from the European conditions that
    underpinned most standard module test sequences, and Australian-specific climate
    data should be used for yield modelling and accelerated test dosing.
