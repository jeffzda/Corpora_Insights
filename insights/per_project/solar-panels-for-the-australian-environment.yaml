    demonstrating a 5.2%–5.3% improvement in module power over equivalent full-cell
    designs through the combined effect of halved resistive losses (connector resistive
    loss reduced from 11.1 W to 2.8 W) and enhanced optical coupling from the higher
    edge-to-cell gap ratio.
