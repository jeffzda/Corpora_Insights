  project_name: PV-Mate
  what_happened: Temperature losses were identified as one of the most significant
    energy losses in Australian module operation, quantified using a minutely simulation
    model across 16 BOM weather station sites. PERC half-cell modules with EVA encapsulant
    achieved 5.3% higher relative yield compared to the baseline full-cell PERC EVA
    module, while an encapsulant-free ('air') configuration reduced yield by 3.9%
    relative to the EVA baseline.
  lesson_warnt: Yield modelling for Australian PV projects should explicitly account
    for temperature losses using local BOM weather data rather than generic irradiance-only
    models — the relative yield benefit of half-cell PERC modules (~5.3%) and the
    penalty of removing encapsulant (~3.9%) can only be accurately quantified with
    location-specific, high-temporal-resolution climate data.
  lesson_learnt: Yield modelling for Australian PV projects should explicitly account
