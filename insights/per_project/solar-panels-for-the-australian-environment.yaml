  what_happened: Anti-reflection coatings on solar glass were found to improve annual
    module yield by 3.4%–3.7% by modifying incident angle losses and thermal energy
    balance, but the expected coating lifetime was only approximately 10 years — shorter
    than the 25-year module warranty period — representing a durability gap that had
    not been fully resolved by the industry at the time of the project.
  lesson_warnt: Anti-reflection coatings on module glass should be evaluated for durability
    over the full warranty period, not just for initial power gain — project teams
    specifying AR-coated glass for Australian deployments should require accelerated
    durability test data corresponding to at least 25 years of Australian UV exposure
    and confirm warranty alignment with the glass supplier before procurement.
  lesson_learnt: Anti-reflection coatings on module glass should be evaluated for
    durability over the full warranty period, not just for initial power gain — project
    teams specifying AR-coated glass for Australian deployments should require accelerated
    durability test data corresponding to at least 25 years of Australian UV exposure
    and confirm warranty alignment with the glass supplier before procurement.
