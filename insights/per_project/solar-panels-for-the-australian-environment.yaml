  publish_date: '2018'
  project_name: PV-Mate
  what_happened: At the start of the project in 2014, Tindo Solar's module design
    was lagging behind the industry standard by approximately 1.6% in cell-to-module
    (CTM) ratio, achieving around 96.4% CTM compared to the industry average of approximately
    98%.
  lesson_learnt: Baseline CTM analysis against industry benchmarks should be conducted
    before committing to a module design improvement programme — quantifying the gap
    relative to industry standards clarifies where the greatest improvement opportunities
    lie and provides a controlled baseline for measuring R&D gains.
