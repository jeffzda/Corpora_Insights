  project_name: PV-Mate
  what_happened: Cell efficiency improvements from 17.4% to 18.2% during the project
    period (a 4.6% relative gain) were found to make achieving a good cell-to-module
    ratio harder, because higher cell efficiency increases cell current, reduces module
    optical gains, and increases connector resistance losses — meaning industry-standard
    CTM improvement benchmarks need to be adjusted upward as cell efficiency rises.
  lesson_warnt: CTM improvement targets must be recalibrated as cell efficiency increases
    — a module design that achieves industry-standard CTM at one cell efficiency level
    may fall behind as the industry transitions to higher-efficiency cells, because
    higher currents increase resistive losses and optical coupling gains diminish.
    Module improvement programmes should control for cell efficiency changes when
    reporting progress.
  lesson_learnt: CTM improvement targets must be recalibrated as cell efficiency increases
