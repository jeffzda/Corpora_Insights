  source_title: PV-Mate Photovoltaic Modules for the Australian Environment—Final
    Report
  publish_date: '2018'
  project_name: PV-Mate
  what_happened: Busbar tape applied to the ribbon surface of multi-crystalline cells
    delivered a 1.7% increase in Isc at mini-module scale, but only a 0.2% increase
    for mono-crystalline cells, due to the differing initial reflectivities of the
    cell types; the improvement was not implemented on full-size production modules
    as a commercial busbar tape applicator had not yet been developed.
  lesson_warnt: Component-level optical improvements (such as busbar tape) must be
    validated separately for each cell type before production adoption — gains observed
    for multi-crystalline cells do not transfer to mono-crystalline cells due to different
    baseline reflectivities, and commercial implementation also requires purpose-built
    application equipment that may not yet be available at the time of the R&D finding.
  lesson_learnt: Component-level optical improvements such as busbar tape must be
