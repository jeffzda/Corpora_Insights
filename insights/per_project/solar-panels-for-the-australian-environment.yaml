- record_id: ARENA-DLV-20674
  source_title: PV-Mate Photovoltaic Modules for the Australian Environment—Final
    Report
  publish_date: '2018'
  project_name: PV-Mate
  what_happened: At the conclusion of the project, Tindo Solar had not arranged a
    supply contract for UV-transparent EVA despite it being identified as capable
    of delivering a further ~1%–1.5% yield improvement — indicating that the commercial
    procurement step lagged behind the technical validation.
  lesson_warnt: Technical validation of an improved module material is not sufficient
    to ensure its adoption in production — manufacturers must negotiate supply contracts
    for new materials in parallel with technical development, as commercial procurement
    timelines (supplier qualification, pricing, volume commitments) can prevent a
    technically validated improvement from being realised in production at project
    close-out.
  lesson_learnt: Technical validation of an improved module material is not sufficient
    to ensure its adoption in production — manufacturers must negotiate supply contracts
    for new materials in parallel with technical development, as commercial procurement
    timelines (supplier qualification, pricing, volume commitments) can prevent a
    technically validated improvement from being realised in production at project
    close-out.
