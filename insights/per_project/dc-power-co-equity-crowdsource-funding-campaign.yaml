- record_id: ARENA-DLV-37604
  source_title: Building the World's First Consumer Owned Solar Retail and Services
    Company
  publish_date: 2018-04
  project_name: DC Power Co. Equity Crowdsource Funding Campaign
  what_happened: DC Power Co. attempted to simultaneously communicate a new brand,
    a new business model, and a new investment mechanism, which created confusion
    among prospective investors and required significant campaign resources to be
    diverted to handling queries and clarifying messaging.
  lesson_learnt: Avoid layering multiple novel concepts in a single equity CSF campaign
    — when brand, business model, and investment vehicle are all unfamiliar to the
    audience, complexity suppresses conversion; simplify or sequence messaging to
    reduce cognitive load on prospective participants.
