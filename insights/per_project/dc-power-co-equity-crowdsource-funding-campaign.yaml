  publish_date: 2018-04
  project_name: DC Power Co. Equity Crowdsource Funding Campaign
  what_happened: Legal restrictions on provision of financial advice prevented most
    individuals and companies from endorsing DC Power Co.'s equity investment opportunity,
    limiting the effectiveness of personal and corporate endorsement as a campaign
    tool.
  lesson_learnt: Equity CSF promoters should not rely on personal or corporate endorsements
    as a significant channel — legal constraints around financial advice mean that
    aligned supporters will routinely decline to endorse an investment opportunity;
    plan alternative credibility-building mechanisms from the outset.
