    Company
  publish_date: 2018-04
  project_name: DC Power Co. Equity Crowdsource Funding Campaign
  what_happened: A two-phase campaign structure (pre-registration awareness followed
    by investment launch) caused confusion and frustration among some prospective
    investors who learned of the opportunity during the awareness phase but could
    not yet invest, potentially losing momentum.
  lesson_learnt: Consider a single-phase campaign that allows immediate investment
    upon first engagement rather than a sequential awareness-then-invest structure
    — the pre-registration phase built a valuable email list (50% of final investors)
    but also created friction for prospects who were ready to act before the platform
    opened.
