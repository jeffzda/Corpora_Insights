- record_id: ARENA-DLV-37613
  source_title: Building the World's First Consumer Owned Solar Retail and Services
    Company
  publish_date: 2018-04
  project_name: DC Power Co. Equity Crowdsource Funding Campaign
  what_happened: Attempts to manufacture early campaign scarcity and momentum through
    a pre-campaign awareness phase did not prevent a characteristic mid-campaign lull
    in the second and third weeks, which followed the typical sociological pattern
    of initial rush, mid-campaign lull, and final-week surge regardless of the pre-campaign
    effort.
  lesson_learnt: Rather than trying to manufacture artificial scarcity upfront, equity
    CSF promoters should plan campaigns around the natural participation pattern —
    build awareness broadly, open investment only when ready, and focus scarcity-driven
    urgency messaging on the campaign's final phase when it will be most effective.
  issue_severity: minor
  project_type: software/data/digital
  project_scale_band: pilot
