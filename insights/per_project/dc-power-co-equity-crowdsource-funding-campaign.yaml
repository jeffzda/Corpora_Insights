  source_title: Building the World's First Consumer Owned Solar Retail and Services
    Company
  publish_date: 2018-04
  project_name: DC Power Co. Equity Crowdsource Funding Campaign
  what_happened: Despite falling short of its 35,000-participant target, DC Power
    Co.'s equity CSF attracted 17,625 investors and set a world record for initial
    equity CSF participation, demonstrating strong latent consumer appetite for new
    energy retail services in a market characterised by low retail satisfaction.
  lesson_learnt: Equity CSF is a viable capital-raising and customer-acquisition mechanism
    for innovative energy services start-ups — consumer dissatisfaction with incumbent
    energy retailers creates genuine appetite for alternative models, and even a campaign
    that misses its internal targets can achieve record participation on global benchmarks.
