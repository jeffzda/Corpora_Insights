- record_id: ARENA-DLV-37605
  source_title: Building the World's First Consumer Owned Solar Retail and Services
    Company
  publish_date: 2018-04
  project_name: DC Power Co. Equity Crowdsource Funding Campaign
  what_happened: A $50 individual investment cap was set to maximise participant numbers,
    but the payment process required for even this small amount (BPay, direct debit,
    or Payment Express) was sufficiently onerous that a material proportion of prospective
    investors likely abandoned the process without completing it.
  lesson_learnt: Set investment minimums and maximums that are proportionate to the
    regulatory burden placed on investors — a $50 investment requiring the same compliance
    overhead as a $10,000 investment creates friction that suppresses participation;
    a floor of $100–$250 would better match the effort required.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: pilot
  lifecycle_phase: development/design
  proponent_type: project developer
  delay_category: null
  failure_mode: commercial & market
  outcome_class: partial success
  secondary_failure_mode: poor scoping
  intervention_note: DC Power Co. removed the $50 cap mid-campaign, raising the upper
    limit to $10k, which accelerated capital accumulation and enabled the $1.75m minimum
    to be secured.
  transferability: moderate
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id004
  - 7
  evidence_excerpt: it seems reasonable to assume that a proportion of mass market
    consumers that were willing to invest in DC Power Co. may have failed to do so
    because the investment opportunity was too small to warrant the time and effort
    required to take it up.
