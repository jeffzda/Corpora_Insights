  source_title: Building the World's First Consumer Owned Solar Retail and Services
    Company
  publish_date: 2018-04
  project_name: DC Power Co. Equity Crowdsource Funding Campaign
  what_happened: Partner organisations with closely aligned missions and highly engaged
    memberships (e.g. Solar Citizens) proved far more effective marketing channels
    than larger organisations with lower member engagement (e.g. Energy Matters, 1
    Million Women), despite the latter having membership lists orders of magnitude
    larger.
  lesson_learnt: Prioritise partner alignment and membership engagement over raw audience
    size — a small, highly engaged partner membership will generate more qualified
    leads than a large, loosely engaged one; also ensure partners are commercially
    incentivised (e.g. equity stake) to actively promote the campaign.
