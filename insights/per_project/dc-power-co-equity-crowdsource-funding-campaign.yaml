  project_name: DC Power Co. Equity Crowdsource Funding Campaign
  what_happened: DC Power Co.'s conversion from a proprietary company to an unlisted
    public company — a regulatory prerequisite for equity CSF — took approximately
    2 months, nearly double the initially estimated 1 month, consuming legal advisory
    budget and delaying the campaign timeline.
  lesson_learnt: Allow at least 3 months and adequate legal budget for the corporate
    conversion from proprietary to unlisted public company before launching an equity
    CSF campaign — estimates of 1 month are unreliable and the conversion process
    requires iterative legal advice and ASIC administrative fees.
