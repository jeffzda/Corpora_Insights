  project_name: DC Power Co. Equity Crowdsource Funding Campaign
  what_happened: DC Power Co. had no visibility over investors who visited the OnMarket
    platform but abandoned the investment process without completing it, meaning those
    leads were permanently lost and could not be re-engaged.
  lesson_learnt: Equity CSF promoters should rigorously evaluate the investment platform's
    user experience and dropout-tracking capabilities before launching — the inability
    to identify and re-engage drop-outs represents a material loss of prospective
