  project_name: DC Power Co. Equity Crowdsource Funding Campaign
  what_happened: The equity CSF regulatory framework was immature at the time of the
    campaign, with platform providers only ASIC-certified from January 2018, leaving
    promoters, platforms, and the regulator without clear, integrated operating procedures.
  lesson_learnt: Equity CSF promoters in early-regulatory environments must budget
    significant time and legal resources for iterative compliance work — DC Power
    Co. spent considerable time resolving ambiguities with the platform, ASIC, and
    external legal advisors; allow at least 3 months and adequate legal budget before
    launch.
