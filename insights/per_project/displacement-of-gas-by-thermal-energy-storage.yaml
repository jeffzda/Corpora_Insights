- record_id: ARENA-DLV-34953
  source_title: Displacement of Gas by Thermal Energy Storage Lessons Learnt
  publish_date: 2021-07
  project_name: Displacement of Gas by Thermal Energy Storage
  what_happened: The total mass of a complete ECTES system — even in a small prototype
    configuration — exceeded the transport capacity of standard road vehicles and
    shipping container handling equipment when loaded with quartzite rock. Considerable
    difficulties were encountered handling the empty stainless steel vessel due to
    its mass, size, and shape, and loading the rocks into the installed system proved
    highly problematic.
  lesson_learnt: Design ECTES systems for on-site rock loading after the container
    is positioned — ship the unit to site without the thermal storage media to stay
    within transport weight limits, and incorporate sufficiently large fill points
    in the container roof or upper walls to allow rock loading via standard mining
    or quarrying materials handling equipment such as excavators, stackers, or augers.
  issue_severity: moderate
  project_type: storage
  project_scale_band: demonstration
  lifecycle_phase: construction/installation
  proponent_type: research organisation/university
  delay_category: construction/installation
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: execution & logistics
  intervention_note: Team determined that future systems should be redesigned so that
    rocks are added on site after delivery, using standard mining/quarrying materials
    handling equipment and purpose-designed fill points in the container roof or upper
    walls.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: other
  source_pages: &id003
  - 8
  - 9
  evidence_excerpt: The total mass of a complete ECTES system in either a 10ft or
    20ft shipping container will exceed the allowable capacity for transportation
    of both the shipping container and associated standard road transportation equipment.
    Considerable difficulties had to be overcome whilst handling the empty stainless
    steel vessel of the relatively small prototype that was constructed, based on
    its significant mass, size and shape.
  confidence_note: null
