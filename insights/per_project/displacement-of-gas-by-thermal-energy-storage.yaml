- record_id: ARENA-DLV-34952
  source_title: Displacement of Gas by Thermal Energy Storage Lessons Learnt
  publish_date: 2021-07
  project_name: Displacement of Gas by Thermal Energy Storage
  what_happened: During engineering design meetings, multiple housing options were
    evaluated for the ECTES system. The team discovered that secondhand shipping containers
    substantially reduced system cost compared to purpose-fabricated housing, due
    to lower purchase price, reduced fabrication and labour costs, faster manufacturing
    turnaround, and additional discounts available to high-volume commercial purchasers.
  lesson_learnt: Use secondhand shipping containers as the weatherproof housing for
    ECTES systems — they are significantly cheaper than new or custom-fabricated alternatives,
    readily available, easily modified, weatherproof, and optimised for transportation
    and handling via globally established infrastructure.
  issue_severity: minor
  project_type: storage
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: A modified secondhand shipping container was selected as the
    ECTES housing, delivering cost savings across purchase price, fabrication, labour,
    and delivery time.
  transferability: moderate
  delay_magnitude: null
  technology_domain: other
  source_pages: &id002
  - 7
  evidence_excerpt: The use of secondhand shipping containers for housing ECTES systems
    reduces the system cost substantially, which represents a lesson learnt through
    this project... Shipping containers are especially well suited to the task, given
