- record_id: ARENA-DLV-34951
  source_title: Displacement of Gas by Thermal Energy Storage Lessons Learnt
  publish_date: 2021-07
  project_name: Displacement of Gas by Thermal Energy Storage
  what_happened: Procurement of heating elements meeting project specifications proved
    very difficult — suppliers quoted prohibitively high costs, and significant delivery
    delays were projected due to Covid-19 causing medical organisations to be prioritised
    over other customers. Initial heating element designs also failed after no more
    than 20 thermal cycles.
  lesson_learnt: Do not rely on off-the-shelf or supplier-manufactured heating elements
    for high-temperature ECTES applications — design a purpose-built, in-house prototype
    early in the project. The final simple Kanthal wire design completed over 100
    cycles without failure and eliminated both sagging and short-circuit failure modes.
  issue_severity: major
