  secondary_failure_mode: execution & logistics
  intervention_note: Team developed an in-house prototype heating element design using
    Kanthal wire that successfully resolved sagging and carbon/oxide short-circuit
    failure, completing over 100 thermal cycles without failure.
  transferability: moderate
