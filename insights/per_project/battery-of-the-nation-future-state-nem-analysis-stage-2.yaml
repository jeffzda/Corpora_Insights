- record_id: ARENA-DLV-12158
  source_title: Battery of the Nation - Operation of Storages Without Perfect Foresight
  publish_date: 2019-09
  project_name: Battery of the Nation
  what_happened: Analysis of the Hornsdale Power Reserve operating model — where 70
    MW/10 MWh is reserved for ancillary services and 30 MW/119 MWh for arbitrage —
    was used to assess the value of maintaining an energy reserve to manage forecast
    uncertainty. The analysis confirmed that longer-duration storages can hold a reserve
    with little impact on arbitrage opportunity, while shorter-duration storages lose
    material arbitrage opportunities when holding a reserve.
  lesson_learnt: When structuring operational dispatch strategies for battery storage
    projects, longer-duration assets should be designed with an explicit energy reserve
    allocation to manage forecast uncertainty and cap contract obligations — short-duration
    assets face an inherent trade-off between reserve holding and arbitrage capture
    that limits this strategy's effectiveness.
