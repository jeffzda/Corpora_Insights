  publish_date: 2019-08
  project_name: Battery of the Nation
  what_happened: The retirement of Hazelwood power station in March 2017 proceeded
    with relatively short notice and caused sustained high wholesale electricity prices
    and loss of power to customers in Victoria, demonstrating that the NEM's planning
    horizon for replacement capacity was insufficient to manage the transition smoothly.
  lesson_learnt: Coal generator retirement decisions can be made and implemented on
    short timelines regardless of regulatory minimum notice periods — system planners
    and developers of replacement capacity should treat announced retirement dates
    as upper bounds, not certain commitments, and size planning contingencies accordingly.
