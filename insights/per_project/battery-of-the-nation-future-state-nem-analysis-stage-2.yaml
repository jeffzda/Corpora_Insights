  project_name: Battery of the Nation
  what_happened: Pumped hydro projects in Tasmania leverage existing storages, roads,
    transmission infrastructure, and Hydro Tasmania's existing water licence, materially
    reducing delivery risk compared with greenfield pumped hydro on mainland Australia
    where no such supporting infrastructure or legal frameworks exist.
  lesson_learnt: When evaluating pumped hydro development options, reuse of existing
    water storage infrastructure, access roads, transmission connections, and established
    water licences significantly reduces delivery risk and construction complexity
    — developers should prioritise sites that integrate with existing hydropower schemes
    over greenfield locations where permitting and infrastructure gaps add substantial
    schedule and cost risk.
