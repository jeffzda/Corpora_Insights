- record_id: ARENA-DLV-47114
  source_title: How Battery of the Nation Can Contribute to Victoria's Energy Needs
    and Objectives
  publish_date: 2019-08
  project_name: Battery of the Nation
  what_happened: AEMO's 2018 ISP modelled a need for 14 GW of pumped hydro to be built
    over the foreseeable future, with most required over a few years in the late 2030s
    — a rate of construction the analysis assessed as unlikely to be achievable, raising
    the risk of a boom-bust investment cycle and potential energy shortfalls during
    transition.
  lesson_learnt: When planning large-scale storage or generation portfolios, project
    developers and system planners must assess not just the total quantum of required
    capacity but the feasibility of the required construction rate — an accelerated
    construction boom creates supply chain, workforce, and financing constraints that
    can make technically optimal outcomes physically undeliverable, arguing for early
    and distributed investment.
  issue_severity: major
  project_type: storage
  project_scale_band: programmatic/portfolio-level
