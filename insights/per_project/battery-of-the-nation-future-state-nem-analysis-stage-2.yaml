  source_title: How Battery of the Nation Can Contribute to Victoria's Energy Needs
    and Objectives
  publish_date: 2019-08
  project_name: Battery of the Nation
  what_happened: A lack of enduring national policy certainty on emissions contributed
    to a wait-and-see attitude from potential energy developers, with a missed opportunity
    being treated as significantly less damaging by investors than a stranded asset,
    resulting in delayed deployment of new generation and storage capacity.
  lesson_learnt: Policy uncertainty is a primary constraint on private investment
    in long-lead-time energy infrastructure — project developers and ARENA should
    factor policy risk into project business cases and seek contractual structures
    (e.g. underwriting, CfDs) that insulate projects from policy reversals, particularly
    for capital-intensive assets with long payback periods.
