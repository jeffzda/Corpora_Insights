  project_name: Battery of the Nation
  what_happened: Flexible generation set the Victorian market price only 25% of the
    time in Q4 2018, yet accounted for 60% of the total cost of the Victorian market,
    with two participants setting the price for more than two-thirds of total cost
    during flexible supply events — indicating a highly concentrated and illiquid
    flexible generation market.
  lesson_learnt: Introducing even modest additional flexible dispatchable capacity
    into a concentrated market can have a disproportionately large impact on wholesale
    prices — new entrant flexible generation or storage projects should be assessed
    not just on their own revenue but on their system-level price reduction value,
    which substantially exceeds their energy output share.
