- record_id: ARENA-DLV-12159
  source_title: Battery of the Nation - Operation of Storages Without Perfect Foresight
  publish_date: 2019-09
  project_name: Battery of the Nation
  what_happened: The analysis was constrained to historic data because realistic synthetic
    forecasts for future NEM conditions (incorporating increased VRE penetration,
    EV demand uncertainty, and changed bidding behaviour) do not yet exist. This limited
    the study's ability to quantify the impact of forecast uncertainty in the future,
    higher-VRE NEM where conditions are expected to be more challenging than the historic
    period.
  lesson_learnt: Investment in developing realistic synthetic forecast datasets for
    future NEM scenarios — incorporating VRE variability, EV charging uncertainty,
    and bidding behaviour — is a critical prerequisite for accurate storage project
    appraisal; planning decisions made without such datasets will systematically underestimate
    storage requirements.
