- record_id: ARENA-DLV-12151
  source_title: Battery of the Nation - Operation of Storages Without Perfect Foresight
  publish_date: 2019-09
  project_name: Battery of the Nation
  what_happened: Power system planning models for the NEM have used perfect foresight
    as a standard simplification, which was historically acceptable when energy storage
    played a minor role. As storage is projected to dominate future flexible supply,
    analysis showed this assumption materially overestimates the value and capability
    of shorter-duration storages, leading to an underestimation of total storage required
    to meet reliability targets.
  lesson_learnt: Battery storage project models must explicitly account for cycling
    costs and limits — optimisation models that ignore start/stop constraints will
    produce unrealistically high cycle rates that substantially overstate asset life
    and understate lifetime costs; non-linear optimisation tools that incorporate
    cycling degradation are needed for realistic battery project appraisal.
  issue_severity: major
  project_type: storage
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: concept/feasibility
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Hydro Tasmania developed a linear programming methodology using
    historic Victorian price data paired with real historic forecasts (rather than
    perfect foresight) to quantify the value loss by storage duration, providing an
    empirical correction factor for planners.
  transferability: broad
  delay_magnitude: null
  technology_domain: hybrid systems
