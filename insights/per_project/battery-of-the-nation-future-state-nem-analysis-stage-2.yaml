- record_id: ARENA-DLV-47112
  source_title: How Battery of the Nation Can Contribute to Victoria's Energy Needs
    and Objectives
  publish_date: 2019-08
  project_name: Battery of the Nation
  what_happened: Around 400 MW of latent hydro capacity existed in Tasmania's existing
    hydropower system that could be made available to the NEM at little or no additional
    cost, with a further 340 MW developable at minimal cost, yet none of this capacity
    had been developed because the limited existing interconnection did not create
    sufficient market incentive.
  lesson_learnt: Transmission constraints can systematically prevent cost-effective
    capacity from entering the market — before investing in new generation assets,
    portfolio planners should assess whether existing generation capacity in adjacent
    regions is being suppressed by interconnection limits, as lifting constraints
    may deliver capacity more cheaply than building new plant.
