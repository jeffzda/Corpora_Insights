  source_title: How Battery of the Nation Can Contribute to Victoria's Energy Needs
    and Objectives
  publish_date: 2019-08
  project_name: Battery of the Nation
  what_happened: Some components of the least-cost future power system, including
    interconnection, have construction lead times longer than the minimum notice period
    for coal generator retirement (three years), meaning that if investment is deferred
    until a retirement is announced, the replacement capacity cannot be available
    in time.
  lesson_learnt: For long-lead-time energy infrastructure, investment decisions must
    be made well before the triggering event (e.g. coal retirement) occurs — waiting
    for market trigger signals will systematically favour short-build-cycle but higher-cost
    options (batteries, gas peakers) over least-cost long-duration solutions.
