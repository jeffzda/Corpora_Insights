- record_id: ARENA-DLV-47102
  source_title: How Battery of the Nation Can Contribute to Victoria's Energy Needs
    and Objectives
  publish_date: 2019-08
  project_name: Battery of the Nation
  what_happened: 'Large-scale, long-lead-time energy infrastructure investments (such
    as pumped hydro and interconnection) face a structural market barrier: the investor''s
    commercial interest favours late investment to avoid oversupply and suppressed
    prices, while consumer interest requires early investment to avoid supply shortfalls
    — creating a persistent under-investment dynamic during market transitions.'
  lesson_learnt: De-risking mechanisms or underwriting arrangements are necessary
    to align investor and consumer interests during energy market transitions — without
    them, long-lead-time infrastructure will systematically be built too late to prevent
    supply shortfalls and price spikes.
