  what_happened: Transmission congestion from concentrated renewable energy development
    in certain corridors has caused substantial changes to marginal loss factors (MLFs)
    for some renewable energy projects in Victoria, having material financial implications
    for market participants and investors and contributing to project curtailment.
  lesson_learnt: Renewable energy project developers must account for transmission
    congestion risk and its effect on MLFs during project development and financial
    modelling — concentration of generation on constrained corridors can materially
    erode project revenues and undermine project viability post-commissioning.
