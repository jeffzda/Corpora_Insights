- record_id: ARENA-DLV-47107
  source_title: How Battery of the Nation Can Contribute to Victoria's Energy Needs
    and Objectives
  publish_date: 2019-08
  project_name: Battery of the Nation
  what_happened: Despite a positive business case on prevailing market signals, there
    has been little development of pumped hydro storage in Australia's energy-only
    NEM, because the investment is exposed to risk from price spread variability and
    there is no capacity mechanism to underwrite long-duration storage assets during
    the transition period.
  lesson_learnt: An energy-only market design is insufficient to support timely investment
    in long-duration storage during an energy transition — project developers for
    pumped hydro and similar long-lead-time storage must engage early with market
    reform processes and seek offtake or de-risking arrangements, as market price
    signals alone will not reliably trigger investment at the right time.
