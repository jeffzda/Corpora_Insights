  publish_date: 2019-08
  project_name: Battery of the Nation
  what_happened: Victorian ageing brown coal generators operated at only 73% of expected
    summer capacity during the January 2019 heatwave due to forced outages, contributing
    to involuntary load shedding, despite being the primary dispatchable generation
    resource relied upon to meet peak summer demand.
  lesson_learnt: System planners and project developers should not rely on ageing
    thermal generation assets to meet peak demand contingencies — forced outage rates
    for ageing coal have increased materially (brown coal forced outage factor rose
    from 4.1% in 2017 ESOO to 5.3% in 2018 ESOO) and alternative dispatchable capacity
    must be available before it is needed.
