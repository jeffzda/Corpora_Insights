  source_title: How Battery of the Nation Can Contribute to Victoria's Energy Needs
    and Objectives
  publish_date: 2019-08
  project_name: Battery of the Nation
  what_happened: 'Pumped hydro projects with longer conveyance tunnels face a capital-versus-efficiency
    trade-off: a smaller diameter tunnel costs less but generates higher head losses,
    reducing round-trip efficiency from approximately 83% (1% head loss) to 70% (10%
    head loss) — a difference of almost 20% in annual energy consumed, requiring additional
    wind or solar generation to compensate.'
  lesson_learnt: Pumped hydro project design must optimise conveyance diameter against
    both capital cost and operational efficiency — a 20% variation in round-trip efficiency
    between high and low head-loss designs can require an additional $0.25 million
    of wind or solar per installed MW of pumped hydro, materially affecting whole-of-system
    cost and should be included in feasibility assessments.
