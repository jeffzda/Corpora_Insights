- record_id: ARENA-DLV-47101
  source_title: How Battery of the Nation Can Contribute to Victoria's Energy Needs
    and Objectives
  publish_date: 2019-08
  project_name: Battery of the Nation
  what_happened: During the January 2019 Victorian heatwave, AEMO directed over 250
    MW of load shedding affecting 200,000 customers over two days, despite more than
    500 MW of Tasmanian hydropower being available in the market but unable to be
    dispatched due to insufficient interconnection capacity on Basslink.
  lesson_learnt: Transmission interconnection constraints can prevent available dispatchable
    generation from reaching load centres during system stress events — interconnection
    capacity must be sized to deliver latent generation assets to market, not just
    to meet average transfer requirements.
