  publish_date: '2015'
  project_name: Nyngan Solar Plant (Project ID 239)
  what_happened: AGL Energy developed the Nyngan Solar Plant (AUD 290M) as one of
    Australia's first utility-scale PV projects under the Solar Flagships program.
    Being first-of-kind on the NEM, multiple stakeholders — including local and state
    government planning agencies and AEMO — had to gain familiarity with the project
    type through the development and construction process.
  lesson_learnt: First-of-kind utility-scale solar projects require additional time
    and resources to educate regulators, planning agencies, and financiers who have
    no prior reference class — project developers should factor in extended engagement
    timelines with all approving bodies when delivering the first project of a new
    type in a jurisdiction.
