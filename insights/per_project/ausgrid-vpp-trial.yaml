- record_id: ARENA-DLV-50558
  source_title: DEIP Market Integration Trials Summary Report 1.0
  publish_date: 2022-09
  project_name: Ausgrid VPP Trial
  what_happened: The Ausgrid VPP Trial experienced a conflict between network support
    dispatch obligations (scheduled 17:00–21:00) and concurrent RERT obligations,
    which forced the network support dispatch start time to be moved to 16:30.
  lesson_learnt: When a DER fleet is enrolled in both network support and wholesale
    market services, establish explicit capacity conflict resolution rules and service
    priority hierarchies agreed by all parties before operations begin — conflicting
    dispatch obligations will otherwise require ad hoc adjustments that compromise
    service delivery.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: null
  failure_mode: coordination & stakeholders
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: Dispatch start time for network support was adjusted from 17:00
    to 16:30 to accommodate RERT obligations.
  transferability: moderate
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id002
  - 22
  evidence_excerpt: Ausgrid's VPP trial experienced this conflict in priority of delivering
    services when the VPP was scheduled to dispatch network support between 17:00-21:00,
    yet the VPP had conflicting RERT obligations which meant the network support dispatch
    start time had to be adjusted to 16:30.
