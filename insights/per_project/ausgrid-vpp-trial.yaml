- record_id: ARENA-DLV-50557
  source_title: DEIP Market Integration Trials Summary Report 1.0
  publish_date: 2022-09
  project_name: Ausgrid VPP Trial
  what_happened: During the Ausgrid VPP Trial, it was discovered that batteries scheduled
    to provide network support must be charged before a network event, but if charging
    occurs too close to the event it can itself contribute to peak demand. Additionally,
    'value stacking' — where DER participates in multiple markets simultaneously —
    reduced VPP availability during peak demand days because capacity was committed
    to other market services.
  lesson_learnt: When scheduling battery VPPs for network support, plan charging windows
    well in advance of demand events to avoid charge-driven peak demand spikes; also
    implement clear capacity allocation rules to prevent value stacking from committing
    VPP capacity away from critical network support obligations.
