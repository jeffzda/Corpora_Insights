- record_id: ARENA-DLV-53873
  source_title: Demand Flexibility Portfolio Retrospective Analysis Report
  publish_date: 2023-07
  project_name: ARENA RERT Demand Response Round — FCAS/Wholesale Value Stream Conflict
  what_happened: 'ARENA projects found that high FCAS prices created a conflict with
    RERT participation: AEMO informed Enel X that any load ''contracted under a reserve
    contract'' was ineligible for FCAS, meaning Invitations to Tender under RERT (lasting
    up to a week) caused Enel X to forgo up to 60 hours of FCAS payments. This led
    Enel X to focus on recruiting new RERT sites rather than dual-registering existing
    FCAS customers.'
  lesson_learnt: Regulatory clarity on dual-registration eligibility for RERT and
    FCAS must be obtained in writing from AEMO before designing portfolios that attempt
    to access both value streams; the financial asymmetry between RERT availability
    payments and FCAS event payments makes dual participation commercially complex
    even where it is technically permitted.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: regulatory & approvals
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: coordination & stakeholders
  intervention_note: In collaboration with AEMO, a protocol was developed (via Tesla's
    project) to prioritise wholesale signals when frequency was within normal band
    and FCAS signals when frequency deviated, partially resolving the FCAS/wholesale
    conflict but not the RERT/FCAS eligibility issue.
  transferability: moderate
  delay_magnitude: null
  technology_domain: demand response
  source_pages:
