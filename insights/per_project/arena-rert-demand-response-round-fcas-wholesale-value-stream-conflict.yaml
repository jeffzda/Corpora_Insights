  evidence_excerpt: Enel X records that AEMO informed them that any load 'contracted
    under a reserve contract' is ineligible for FCAS. Invitations to Tender (ITTs)
    under RERT can last for a week and therefore miss 60-hours of FCAS payments under
    this interpretation. High FCAS prices and uncertainty about AEMO interpretation
    led them to primarily focus on recruiting new sites for RERT and not to dual-register
    existing FCAS sites.
