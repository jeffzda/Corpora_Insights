- record_id: ARENA-DLV-11030
  source_title: Renewable Energy Options for Industrial Process Heat
  publish_date: 2019-08
  project_name: Minera El Tesoro Solar Process Heat, Chile
  what_happened: Abengoa Solar installed 1,280 parabolic trough modules on six hectares adjacent to the Minera El Tesoro copper mine in the Atacama Desert at a cost of US$12 million. The system delivers
    10 MWth at up to 260°C using pressurised hot water storage, displacing 55% of diesel use and saving approximately 10,000 tonnes of CO2/year. Thermal storage enables operation after sunset and on partially
    cloudy days.
  lesson_learnt: Solar parabolic trough systems with pressurised hot water storage can displace the majority of fossil fuel heat in copper electrowinning processes in high-DNI locations — thermal storage
    is essential to meet continuous process heat demand and should be integrated into the system design from the outset.
