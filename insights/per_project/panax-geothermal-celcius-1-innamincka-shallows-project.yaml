  evidence_excerpt: Celcius-1 was drilled to a total depth of 2416 m in April 2011.
    The target was shallow sediments of the Hutton Sandstone. The well recorded a
    temperature in excess of 145 °C, but the flow rates achieved were determined to
    be too low to warrant further work at this stage.
  confidence_note: Project scale is pilot as this was a single appraisal well targeting
    a shallow resource with no power plant yet constructed.
