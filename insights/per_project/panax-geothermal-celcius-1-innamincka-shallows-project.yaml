- record_id: ARENA-DLV-72004
  source_title: Australian Energy Resource Assessment — Second Edition, 2014
  publish_date: '2014'
  project_name: Panax Geothermal Celcius-1 — Innamincka Shallows Project
  what_happened: The Celcius-1 well at the Innamincka Shallows project reached 2416
    m and recorded temperatures in excess of 145°C, but achieved flow rates too low
    to warrant further development work, halting progress on the shallow sedimentary
    geothermal play.
  lesson_learnt: Shallow sedimentary geothermal plays targeting the Hutton Sandstone
    may achieve adequate temperatures but fail on flow rate — low natural permeability
    at depth can preclude economic production even where temperature targets are met,
    and this risk should be explicitly characterised before committing to full well
    programs.
