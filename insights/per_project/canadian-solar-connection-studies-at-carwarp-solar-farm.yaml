  what_happened: PSCAD modelling of the GFI BESS in the Wide Area Network required
    several iterations of parameter tuning and changes to the BESS MVA size before
    acceptable model responses could be achieved, with 13 contingency scenarios tested
    across two hold points.
  lesson_learnt: GFI BESS system strength studies require multiple tuning iterations
    of PSCAD model parameters and potentially multiple MVA sizing changes before results
    pass stability thresholds — project schedules and study budgets should accommodate
    this iterative process.
