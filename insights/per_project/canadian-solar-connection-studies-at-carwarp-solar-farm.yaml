- record_id: ARENA-DLV-26755
  source_title: Grid Forming Inverter BESS Case Study at Carwarp
  publish_date: '2023-01-18'
  project_name: Carwarp Grid Forming Inverter BESS Case Study
  what_happened: 9 of 13 contingency case scenarios passed the 0.5% voltage oscillation
    stability threshold, including the most onerous case when all synchronous condensers
    were in service; 4 cases did not pass but were assessed as candidates for further
    site-specific model tuning.
  lesson_learnt: GFI BESS operating in Virtual Synchronous Mode can provide sufficient
    system strength to stabilise a weak-grid network comparable to a bank of synchronous
    condensers; residual failing cases should be attributed to model tuning gaps rather
    than fundamental technology limitations, and further site-specific tuning should
    be scoped into any project study programme.
