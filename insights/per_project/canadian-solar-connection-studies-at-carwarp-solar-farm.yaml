- record_id: ARENA-DLV-26753
  source_title: Grid Forming Inverter BESS Case Study at Carwarp
  publish_date: '2023-01-18'
  project_name: Carwarp Grid Forming Inverter BESS Case Study
  what_happened: PSCAD simulation results demonstrated that a 40 MVA GFI BESS was
    sufficient to reduce voltage oscillations below the 0.5% threshold for three of
    four transmission contingency cases, while the most onerous contingency (Kerang–Bendigo
    220 kV) required an 80 MVA BESS.
  lesson_learnt: GFI BESS sizing for system strength support in weak grids is contingency-specific
    — the most onerous fault scenario may require up to double the MVA capacity of
    less severe contingencies, so system strength studies must test the full range
    of credible network faults before fixing BESS size.
