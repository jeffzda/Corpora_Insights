- record_id: ARENA-DLV-26756
  source_title: Grid Forming Inverter BESS Case Study at Carwarp
  publish_date: '2023-01-18'
  project_name: Carwarp Grid Forming Inverter BESS Case Study
  what_happened: The recipient project did not proceed with actual GFI BESS implementation
    following the study, due to a combination of synchronous condenser installations
    in the West Murray Zone narrowing the system strength gap, adverse economic conditions
    in the commodities market, and limited GFI procurement options.
  lesson_learnt: Technology demonstration projects in rapidly evolving markets risk
    being overtaken by parallel infrastructure developments or procurement constraints
    before they reach implementation — proponents should monitor the network investment
    pipeline and GFI supply market in parallel with study work to ensure the business
    case remains viable at the point of procurement decision.
