- record_id: ARENA-DLV-26754
  source_title: Grid Forming Inverter BESS Case Study at Carwarp
  publish_date: '2023-01-18'
  project_name: Carwarp Grid Forming Inverter BESS Case Study
  what_happened: In the most onerous contingency scenario (D5.3), a 3% voltage oscillation
    was observed when the BESS was in full generation mode (80 MW) with only a 20
    MVA synchronous condenser in service and network MW were reduced by 80–100 MW,
    indicating a residual stability risk at the boundary of operating conditions.
  lesson_learnt: GFI BESS system strength performance is sensitive to the combination
    of synchronous condenser availability and network MW dispatch level — project
    engineers should define the minimum synchronous condenser co-requirement and flag
    operating constraints that could breach stability thresholds under onerous but
    credible conditions.
  issue_severity: moderate
  project_type: storage
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: project developer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: When all five synchronous condensers were in service alongside
    the 80 MVA GFI BESS, voltage oscillations were reduced to less than 0.5% even
    in the D5.3 case, confirming that combined operation resolves the residual instability.
  transferability: moderate
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id004
