- record_id: ARENA-DLV-26751
  source_title: Grid Forming Inverter BESS Case Study at Carwarp
  publish_date: '2023-01-18'
  project_name: Carwarp Grid Forming Inverter BESS Case Study
  what_happened: Renewable generators connecting to the West Murray Zone faced grid
    connection barriers because the high penetration of inverter-based resources reduced
    fault levels and system strength, requiring expensive synchronous condensers as
    a connection condition — a cost that rendered many projects unviable.
  lesson_learnt: In weak-grid zones with high inverter-based resource penetration,
    proponents should assess system strength requirements early and evaluate Grid
    Forming Inverter (GFI) BESS as an alternative to synchronous condensers, which
    impose sunk capital costs with no revenue benefit.
  issue_severity: major
  project_type: storage
  project_scale_band: demonstration
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: grid connection/system studies
  failure_mode: regulatory & approvals
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Canadian Solar submitted a grid connection application pairing
    the solar farm with a GFI BESS and engaged AEMO to conduct a Full Impact Assessment
    using PSCAD Wide Area Network modelling to demonstrate system strength adequacy.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id001
  - 3
  - 4
  evidence_excerpt: Due to their high capital and operational costs, a requirement
    for synchronous condensers results in any intending renewable generator project
    becoming un-feasible to build. Synchronous Condensers are seen as sunk costs to
    the project as its purpose is for network support and not actually transmitting
    the energy produced by the renewable energy.
