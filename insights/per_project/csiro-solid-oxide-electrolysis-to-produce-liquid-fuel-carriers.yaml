- record_id: ARENA-DLV-64124
  source_title: Summary of ARENA Funded Hydrogen R&D Projects
  publish_date: 2023-04
  project_name: CSIRO – Solid Oxide Electrolysis to Produce Liquid Fuel Carriers
  what_happened: The CSIRO solid oxide electrolyser project achieved steady-state
    operation over 350 hours at 800°C using superheated steam from a solar test furnace,
    but identified a need for further optimisation and longer-duration testing before
    the technology can be considered commercially ready.
  lesson_learnt: Solid oxide electrolyser projects should define minimum continuous
    operation duration requirements (well beyond 350 hours) as part of the technology
    validation criteria — short-duration test periods are insufficient to characterise
    degradation behaviour and material longevity, which are critical barriers to commercialisation
    for high-temperature electrolysis.
