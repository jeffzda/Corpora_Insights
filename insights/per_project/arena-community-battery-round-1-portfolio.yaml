- record_id: ARENA-DLV-63915
  source_title: ARENA Community Battery Round 1 Pre-Deployment Challenges & Best Practice
    Report
  publish_date: 2025-09
  project_name: ARENA Community Battery Round 1 (portfolio)
  what_happened: EPC and O&M procurement was one of the most challenging elements
    of the programme (average difficulty rating 3.5/5). A limited pool of capable
    suppliers created delivery delays; many battery OEMs and EPCs were geared toward
    utility-scale deployments and either priced smaller community-scale systems uncompetitively
    or proposed off-the-shelf solutions ill-suited to suburban locations. In at least
    one case a major commissioning delay resulted from miscommunication between EMS
    and inverter providers, each blaming the other.
  lesson_learnt: Conduct early market sounding and EOIs to screen unsuitable vendors
    before issuing RFPs; structure RFPs around functional outcomes (throughput, uptime,
    dispatchability) rather than prescriptive specifications, and adopt turnkey EPC
    models to assign clear integration responsibility and avoid inter-vendor blame
    disputes.
