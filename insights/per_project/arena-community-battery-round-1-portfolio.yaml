  what_happened: Several proponents spent over $500,000 on consultancy during pre-deployment
    phases. Consultants were found to be valuable for well-established tasks such
    as financial modelling and procurement support, but less helpful when projects
    required novel or innovative approaches — some proponents found external advice
    often echoed internal views without adding new insight.
  lesson_learnt: Reserve external consultancy for well-defined tasks with clear deliverables
    (e.g. financial modelling, standards interpretation, procurement support) — for
    novel delivery challenges, prioritise internal ownership and cross-team learning
    over external advice, which tends to be less effective when there is no established
    precedent.
