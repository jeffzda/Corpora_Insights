  what_happened: Cybersecurity and data management were under-scoped in early project
    planning across much of the portfolio. Proponents assumed vendors would 'bring
    their own' cybersecurity protocols, only to discover late that integration, compliance,
    and ownership issues were unresolved. Some systems were deployed with outdated
    firmware, default passwords, or no formal governance over remote access. Data
    sovereignty conflicts arose when government-led projects required onshore data
    storage but EMS vendors relied on offshore cloud infrastructure by default.
  lesson_learnt: Treat cybersecurity and data governance as integral to system design,
    not secondary IT considerations — embed explicit requirements in RFPs (encryption
    standards, access control, cloud sovereignty, patch management) and require vendors
    to demonstrate compliance during procurement.
