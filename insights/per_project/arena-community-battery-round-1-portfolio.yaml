- record_id: ARENA-DLV-63934
  source_title: ARENA Community Battery Round 1 Pre-Deployment Challenges & Best Practice
    Report
  publish_date: 2025-09
  project_name: ARENA Community Battery Round 1 (portfolio)
  what_happened: Community battery projects consistently lacked standardised methods
    for estimating avoided emissions and social benefits. Different projects used
    different proxies (e.g. average vs. marginal grid intensity), and without common
    methods, cross-project comparison and funder reporting were limited. Some projects
    did not implement structured measurement of hosting capacity improvement despite
    it being a key project rationale.
  lesson_learnt: Adopt a standardised emissions estimation methodology aligned with
    public marginal emissions databases from the outset, and capture pre- and post-commissioning
    feeder-level voltage profiles to enable structured measurement of hosting capacity
    improvements — without these baselines, post-project evaluation and funder reporting
    are severely constrained.
