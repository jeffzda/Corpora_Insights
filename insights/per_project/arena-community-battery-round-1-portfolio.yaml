  project_name: ARENA Community Battery Round 1 (portfolio)
  what_happened: Measuring and communicating community benefit was consistently challenging
    across the portfolio. There was no consistent sectoral guidance on what constitutes
    fair or adequate benefit sharing, meaning each project designed its own approach.
    Early uptake of battery tariff products offered by some projects with retailer
    integration was lower than expected, partly due to customer confusion including
    incorrect assumptions that rooftop solar was required.
  lesson_learnt: Define and embed benefit-sharing mechanisms before project launch
    — including eligibility criteria, tracking KPIs, and community reporting plans
    — to avoid each project reinventing the wheel and to maintain social licence over
    the long project lifecycle.
