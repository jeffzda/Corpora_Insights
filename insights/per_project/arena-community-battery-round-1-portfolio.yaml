  project_name: ARENA Community Battery Round 1 (portfolio)
  what_happened: Community battery proponents in regional and remote areas faced higher
    logistics costs, fewer local service providers, and greater maintenance complexity.
    Vendor presence, logistics capability, and long-term support arrangements were
    particularly difficult to secure, and some battery OEMs lacked local service infrastructure
    entirely.
  lesson_learnt: Factor in remoteness when selecting suppliers for regional and remote
    deployments — assess vendor presence, logistics capability, and post-installation
    support arrangements during procurement, and prioritise factory pre-integration
    and testing to reduce on-site troubleshooting needs.
