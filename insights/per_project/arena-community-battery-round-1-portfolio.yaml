  source_title: ARENA Community Battery Round 1 Pre-Deployment Challenges & Best Practice
    Report
  publish_date: 2025-09
  project_name: ARENA Community Battery Round 1 (portfolio)
  what_happened: Dynamic Operating Envelopes (DOEs) remained challenging to implement
    across the portfolio. Some DNSPs were still developing DOE tools or policies at
    the time of battery deployment, making integration a moving target. Even minor
    DOE constraints could disproportionately impact retailer revenues when they coincided
    with high market prices. One project undertook the first live DOE trial on a large
    battery, finding that coordinating 24-hour DOE forecasts with FCAS participation
    was technically complex.
  lesson_learnt: Future-proof EMS and inverter configurations to enable DOE capability
    via firmware updates, even when DNSPs have not yet formalised DOE requirements
    — this avoids costly retrofitting as DNSP DOE policies mature.
