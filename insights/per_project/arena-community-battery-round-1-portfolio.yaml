  publish_date: 2025-09
  project_name: ARENA Community Battery Round 1 (portfolio)
  what_happened: Network connection processes were a major bottleneck for some projects,
    causing commissioning delays and unanticipated costs. Community-scale batteries
    in the 100 kW to 1 MW range did not fit neatly into existing DNSP frameworks —
    too large for solar-like treatment, too small for high-voltage processes — resulting
    in inconsistent handling. Internal DNSP handovers between planning, SCADA, protection,
    and regulatory teams introduced rework or changed requirements mid-process.
  lesson_learnt: Engage DNSP connection, planning, and regulatory teams simultaneously
    from the outset to align on connection pathways, documentation requirements, and
    timelines — do not allow sequential internal DNSP handovers to drive rework and
    schedule extension.
