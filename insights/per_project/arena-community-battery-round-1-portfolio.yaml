  publish_date: 2025-09
  project_name: ARENA Community Battery Round 1 (portfolio)
  what_happened: Backup power (resilience) functionality was identified as a strong
    driver of community support across the portfolio. Projects that included backup
    capability experienced smoother community engagement and stronger local buy-in,
    while projects that could not offer it found it difficult to justify other, less
    visible benefits such as improved solar hosting or emissions reduction.
  lesson_learnt: Explicitly assess the inclusion of backup power capability during
    project design and — if it is not technically or commercially feasible — prepare
    clear, accessible explanations for why it is excluded, as its absence is a consistent
    source of community disappointment and engagement difficulty.
