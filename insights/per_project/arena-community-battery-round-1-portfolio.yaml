- record_id: ARENA-DLV-63925
  source_title: ARENA Community Battery Round 1 Pre-Deployment Challenges & Best Practice
    Report
  publish_date: 2025-09
  project_name: ARENA Community Battery Round 1 (portfolio)
  what_happened: Urban and suburban installation sites presented logistical constraints
    including limited access for trucks and cranes, unexpected tree protection zones,
    and requirements for non-standard fencing, landscaping, and acoustic treatments.
    These issues caused redesigns and schedule changes. Additionally, traditional
    DNSP substation design standards — based on 50+ year asset lifespans — were not
    well suited to 10–15 year battery assets, creating internal cultural and process
    friction.
  lesson_learnt: Conduct early site inspections before finalising designs to surface
    access constraints, tree protection zones, and acoustic requirements; adapt internal
    engineering standards to reflect the shorter economic life of battery assets rather
    than applying 50-year substation design processes.
