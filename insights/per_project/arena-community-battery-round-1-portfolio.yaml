  publish_date: 2025-09
  project_name: ARENA Community Battery Round 1 (portfolio)
  what_happened: Site suitability assessments across the portfolio regularly identified
    vegetation, heritage, and planning overlay constraints that caused project setbacks
    — including at least one site that required redesign due to unexpected root intrusion
    — while planning approvals in some jurisdictions took 4–6 months, misaligning
    with grant funding milestones.
  lesson_learnt: Apply a parallel rather than sequential site assessment approach
    — evaluating technical feasibility, land access, planning constraints, and social
    licence concurrently — and use early desktop GIS screening to filter 'no-go' zones
    before committing field assessment resources.
