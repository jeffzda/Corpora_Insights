  project_name: ARENA Community Battery Round 1 (portfolio)
  what_happened: One project switched battery chemistry from NMC to LFP mid-project
    to meet UL 9540A fire safety compliance requirements, generating redesign costs
    and schedule disruption. Integration issues arose across multiple projects when
    battery, inverter, and EMS components came from different vendors with incompatible
    protocols, creating unclear warranty terms and handover risks.
  lesson_learnt: Select battery chemistry with fire safety compliance requirements
    in mind from the outset — LFP is preferred for ground-mounted community systems
    in residential or sensitive areas — and favour single-vendor or turnkey EPC arrangements
    to reduce multi-vendor integration risk.
