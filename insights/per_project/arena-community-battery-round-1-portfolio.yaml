  what_happened: Community engagement around community batteries was frequently more
    complex and resource-intensive than proponents anticipated. The term 'community
    battery' caused residents to assume shared ownership or direct bill savings; early
    government announcements reinforced these assumptions before technical designs
    were confirmed. At least one project was cancelled due to sustained local pushback.
  lesson_learnt: Avoid the term 'community battery' in public communications — use
    alternatives such as 'neighbourhood energy storage' or 'shared grid battery' —
    and stage engagement timing to align with funding certainty, initiating only light
    early contact before design parameters are confirmed.
