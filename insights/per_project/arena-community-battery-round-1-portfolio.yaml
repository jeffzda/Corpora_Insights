- record_id: ARENA-DLV-63920
  source_title: ARENA Community Battery Round 1 Pre-Deployment Challenges & Best Practice
    Report
  publish_date: 2025-09
  project_name: ARENA Community Battery Round 1 (portfolio)
  what_happened: SCADA and telemetry integration with DNSP systems created significant
    complexity and cost across the portfolio. EMS and battery vendors frequently lacked
    familiarity with DNSP-specific SCADA protocols (e.g. DNP3, IEC 61850), requiring
    bespoke configurations even for basic real-time visibility. Integration costs
    in some cases reached hundreds of thousands of dollars. Commissioning protocols
    for SCADA were often out of sync with construction timelines, leaving some batteries
    installed but inoperable or live without full DNSP visibility.
  lesson_learnt: Collaboratively develop a control interface specification with DNSP
    SCADA and operational teams early in design — covering signal lists, protocols,
    update frequencies, and override logic — and treat SCADA commissioning as a separate
    milestone with staged testing before construction handover.
