- record_id: ARENA-DLV-63901
  source_title: ARENA Community Battery Round 1 Pre-Deployment Challenges & Best Practice
    Report
  publish_date: 2025-09
  project_name: ARENA Community Battery Round 1 (portfolio)
  what_happened: Proponents across the 16-project community battery portfolio reported
    that balancing multiple objectives — network deferral, market revenue, customer
    equity, and resilience — in a single project introduced significant delivery complexity
    and delayed internal approvals, with internal investment committees struggling
    to evaluate hybrid value stacks.
  lesson_learnt: Anchor project design around one or two primary objectives (e.g.
    network deferral or bill savings for social housing) and treat other benefits
    as secondary — trying to maximise all value streams simultaneously creates unnecessary
    delivery friction and dilutes effectiveness.
  issue_severity: moderate
  project_type: storage
