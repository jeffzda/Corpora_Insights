- record_id: ARENA-DLV-63923
  source_title: ARENA Community Battery Round 1 Pre-Deployment Challenges & Best Practice
    Report
  publish_date: 2025-09
  project_name: ARENA Community Battery Round 1 (portfolio)
  what_happened: Community-scale batteries rarely stacked enough revenue to be financially
    viable without grant support. FCAS revenue was found to be unviable at community
    scale — particularly below 1 MW — due to size thresholds, technology compatibility
    requirements, and growing compliance obligations. Arbitrage returns were often
    eroded by distribution charges or flat retail tariffs.
  lesson_learnt: Confirm FCAS eligibility (hardware certification, frequency injection
    testing, EMS/SCADA integration) at the procurement stage if FCAS is a targeted
    revenue stream — retrofitting FCAS capability post-commissioning was found to
    be technically difficult and expensive.
