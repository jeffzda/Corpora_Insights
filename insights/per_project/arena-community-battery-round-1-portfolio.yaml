- record_id: ARENA-DLV-63930
  source_title: ARENA Community Battery Round 1 Pre-Deployment Challenges & Best Practice
    Report
  publish_date: 2025-09
  project_name: ARENA Community Battery Round 1 (portfolio)
  what_happened: Engaging councils as project partners was consistently resource-intensive.
    Within a single council, teams responsible for parks, roads, planning, sustainability,
    and legal had different concerns and levels of familiarity. The process of aligning
    them was prone to stalling if key staff left or shifted priorities. Even templated
    leases triggered delays or objections, and approvals sometimes required passage
    through five or more separate departments.
  lesson_learnt: Use structured, repeatable council engagement processes starting
    with general briefings for all departments then tailored technical and legal discussions
    for the right teams — build relationships with both executive and operational
    layers, and identify a strong internal council champion to reduce the risk of
    referrals stalling in the bureaucracy.
