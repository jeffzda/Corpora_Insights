- record_id: ARENA-DLV-63906
  source_title: ARENA Community Battery Round 1 Pre-Deployment Challenges & Best Practice
    Report
  publish_date: 2025-09
  project_name: ARENA Community Battery Round 1 (portfolio)
  what_happened: Non-DNSP proponents found identifying viable network locations opaque
    and resource-intensive because publicly available hosting capacity maps were outdated,
    limited in spatial resolution, or did not reflect recent network changes. In at
    least one case, a project team invested significant effort investigating locations
    that were later ruled out by DNSP engineers.
  lesson_learnt: Formally request detailed feeder-level data and interpretation support
    from the DNSP early — do not rely solely on public hosting capacity maps — and
    seek DNSP pre-endorsement of site shortlists before committing community engagement
    resources.
