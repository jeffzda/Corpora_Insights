- record_id: ARENA-DLV-63926
  source_title: ARENA Community Battery Round 1 Pre-Deployment Challenges & Best Practice
    Report
  publish_date: 2025-09
  project_name: ARENA Community Battery Round 1 (portfolio)
  what_happened: Performance tracking was frequently under-scoped during early project
    stages and became a pain point during early operations. EMS platforms sometimes
    lacked sufficient data granularity or long-term storage; vendor data was sometimes
    unreliable with some batteries underperforming compared to nominal specifications
    (e.g. 60 kWh capacity delivering approximately 50 kWh). Measurement of network
    benefits including hosting capacity improvement was technically feasible but rarely
    implemented in a structured way.
  lesson_learnt: Define performance metrics, data resolution, retention requirements,
    and access protocols in EMS and vendor specifications at the procurement stage
    — do not leave performance tracking as an afterthought — and embed uptime and
    availability KPIs in O&M contracts with obligations for independent performance
    verification.
