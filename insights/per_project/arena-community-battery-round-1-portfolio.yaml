- record_id: ARENA-DLV-63905
  source_title: ARENA Community Battery Round 1 Pre-Deployment Challenges & Best Practice
    Report
  publish_date: 2025-09
  project_name: ARENA Community Battery Round 1 (portfolio)
  what_happened: Legal and contracting processes were resource-intensive and time-consuming,
    with government-led proponents facing particularly long legal pathways due to
    Crown Solicitor reviews, multi-agency coordination, and staff turnover. Late-stage
    disputes over fire and environmental liability caused major delays on at least
    one project, and one project required approximately $80k in external legal support
    to develop fit-for-purpose contracts.
  lesson_learnt: Engage legal counsel with energy infrastructure experience as early
    as possible and develop clear modular legal templates — including site lease agreements,
    liability frameworks, and heads of agreement — before engaging external partners
    to avoid costly delays from generalist legal misalignment.
