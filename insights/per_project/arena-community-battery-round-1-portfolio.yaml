- record_id: ARENA-DLV-63904
  source_title: ARENA Community Battery Round 1 Pre-Deployment Challenges & Best Practice
    Report
  publish_date: 2025-09
  project_name: ARENA Community Battery Round 1 (portfolio)
  what_happened: Proponents consistently found it difficult to demonstrate financial
    viability for community-scale batteries, particularly for DNSPs required to model
    unregulated revenue streams. Many projects showed marginal returns even with grant
    funding, leading to prolonged internal debates about risk and return. The absence
    of standardised methods for estimating network value, avoided emissions, and social
    benefits further complicated business case development.
  lesson_learnt: Adopt a portfolio or programmatic approach to business case development
    — presenting shared delivery costs and co-optimised risks across multiple sites
    — rather than justifying viability site-by-site, to improve economics and secure
    internal approval.
