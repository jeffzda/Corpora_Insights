  publish_date: 2025-09
  project_name: ARENA Community Battery Round 1 (portfolio)
  what_happened: In one instance, a council volunteered land for a community battery
    but the entire LGA had no viable grid capacity for a 500 kW battery — a fact not
    discovered until late in the project development process, wasting significant
    development effort and cost.
  lesson_learnt: Validate grid capacity at the LGA or feeder level before engaging
    councils or communities about land availability — overly optimistic assumptions
    about network availability discovered late in the process can waste substantial
    pre-development investment.
