- record_id: ARENA-DLV-63922
  source_title: ARENA Community Battery Round 1 Pre-Deployment Challenges & Best Practice
    Report
  publish_date: 2025-09
  project_name: ARENA Community Battery Round 1 (portfolio)
  what_happened: Despite widespread interest, most community battery projects found
    it difficult to operationalise or monetise network support services (NSS). There
    were no standardised methodologies for quantifying network benefits such as peak
    reduction or voltage support, and most batteries were deployed in locations that
    lacked a strong, monetisable NSS case. Many projects ultimately defaulted to 'in-principle'
    NSS objectives relying on grant funding, with no formal performance verification
    or payment mechanism.
  lesson_learnt: Site batteries at locations with identified, measurable network constraints
    (e.g. constrained feeders, seasonal peaks) if NSS revenue is a project objective
    — then trial NSS participation under 'friendly' conditions with aligned DNSPs
    before attempting formal performance-based payment structures.
