  failure_mode: coordination & stakeholders
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: Several DNSPs recommended limiting objectives to one or two primary
    drivers and framing outcomes in plain language to communicate more effectively
    with boards and councils.
  transferability: broad
