  project_name: ARENA Community Battery Round 1 (portfolio)
  what_happened: EMS and control system integration was widely characterised as one
    of the most underestimated aspects of community battery deployment. Battery vendors,
    inverter suppliers, and EMS providers were frequently separate entities with incompatible
    systems and limited integration experience. In one case a DNSP had to bring in
    a third-party integrator to bridge gaps between its SCADA system and the battery
    vendor.
  lesson_learnt: Treat EMS design as a major dedicated workstream from project inception
    — embed detailed EMS specifications in tenders covering control logic, data protocols,
    cybersecurity, storage location, and interface expectations — and assign a 'systems
    integrator' with end-to-end compatibility responsibility across BMS, inverter,
    EMS, and SCADA.
