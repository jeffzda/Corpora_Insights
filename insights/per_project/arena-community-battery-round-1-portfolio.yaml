  project_name: ARENA Community Battery Round 1 (portfolio)
  what_happened: Proponents reported that supplying batteries as contestable services
    from DNSP-owned assets was complicated by ring-fencing regulations, which required
    individual AER waivers for each deployment even when the service and risk profile
    were essentially identical to previous approved cases. This created significant
    legal and regulatory overhead — some participants are using subsidiaries or partnerships
    to allow contestable market participation.
  lesson_learnt: Where ring-fencing creates barriers to contestable market participation,
    explore subsidiary or partnership structures early in project development; simultaneously
    advocate for standing ring-fencing waiver frameworks to reduce per-project regulatory
    overhead across the sector.
