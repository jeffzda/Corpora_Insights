- record_id: ARENA-DLV-63903
  source_title: ARENA Community Battery Round 1 Pre-Deployment Challenges & Best Practice
    Report
  publish_date: 2025-09
  project_name: ARENA Community Battery Round 1 (portfolio)
  what_happened: 'Many proponents faced a ''catch-22'' during feasibility: securing
    external funding required detailed engineering, legal, and community inputs, but
    those inputs required funding to produce. This led some teams to carry significant
    costs at risk or perform unpaid work over extended periods before funding was
    confirmed.'
  lesson_learnt: Structure early-phase work into staged, at-risk workstreams with
    Board-level provisional budget approval so feasibility inputs can be developed
    ahead of formal funding, reducing the financial exposure of the catch-22 while
    maintaining project momentum.
