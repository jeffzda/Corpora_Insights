  what_happened: System sizing decisions across the portfolio were complicated by
    poor data quality — proponents reported difficulty sourcing accurate load data
    at the right spatial and temporal granularity. In several cases batteries ended
    up underutilised because anticipated network peaks or export curtailment did not
    materialise as modelled.
  lesson_learnt: Use conservative sizing bands and stress-test both under- and over-sizing
    scenarios when load data is unreliable — do not rely on theoretical assumptions
    or stylised load profiles, and engage DNSPs early to obtain feeder-level data
    before finalising battery size.
