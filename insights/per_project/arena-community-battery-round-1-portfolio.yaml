  project_name: ARENA Community Battery Round 1 (portfolio)
  what_happened: Project continuity was a persistent challenge across the multi-year
    deployment programme. Staff turnover was common within project teams and among
    stakeholder organisations and delivery partners. Several teams were required to
    re-brief new decision-makers mid-stream, often without structured onboarding materials,
    creating risks of delays, duplication, and loss of institutional context.
  lesson_learnt: Develop structured onboarding materials and project continuity documentation
    from early in the project lifecycle so that new decision-makers and staff can
    be briefed efficiently without losing institutional context or restarting negotiations.
