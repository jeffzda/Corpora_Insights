  what_happened: Early-stage testing of sensor and I/O hardware for the Gen 2 robot
    system revealed that many readily available commercial components failed or exhibited
    signal degradation when exposed to dust, vibration, moisture, and temperature
    fluctuations typical of large-scale solar construction sites, causing unplanned
    downtime and requiring iterative redesign.
  lesson_learnt: Specify ruggedised, industrial-grade I/O and sensor hardware rated
    for harsh environments (dust, vibration, moisture, temperature fluctuation) from
    the outset of robotic construction system design — using standard commercial components
    in this environment leads to signal failures, increased downtime, and costly mid-development
    redesign.
