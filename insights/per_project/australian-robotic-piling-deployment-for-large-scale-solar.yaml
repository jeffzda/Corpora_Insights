  project_name: Australia Robotic Piling Deployment for Large Scale Solar PRO-973
  what_happened: A comparative field test between manual pile shake-out, Gen 1 basket-based
    kitting, and the Gen 2 robot-mounted bundle picking system demonstrated that the
    Gen 2 system eliminated manual intervention in pile loading and significantly
    reduced idle time, enabling uninterrupted operation including during extended
    low-light test periods.
  lesson_learnt: Integrate pile bundle carrying directly onto the robot platform rather
    than relying on separate loading equipment or manual basket kitting — robot-mounted
    bundle handling eliminates manual intervention, reduces site logistics dependencies,
    enables continuous operation during night shifts, and meaningfully improves cycle
    time and safety outcomes.
