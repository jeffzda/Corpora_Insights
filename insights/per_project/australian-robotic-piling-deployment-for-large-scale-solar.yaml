  what_happened: The Gen 2 system successfully demonstrated that piles can be picked
    and driven directly from transport bundles in H-orientation, eliminating the need
    for the manual basket kitting process that was required with the Gen 1 system
    and which constrained operational efficiency and safety.
  lesson_learnt: Design autonomous piling systems to handle piles in their as-delivered
    transport bundle orientation — this eliminates the manual kitting step, reduces
    labour requirements, improves safety by removing workers from proximity to heavy
    lifting, and enables extended and night-shift operation without additional site
    logistics.
