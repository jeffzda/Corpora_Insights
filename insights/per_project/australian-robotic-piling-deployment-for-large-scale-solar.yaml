  what_happened: During Gen 2 robot development, sensor fusion integrating LiDAR,
    vision systems, and inertial sensors was found to substantially improve the accuracy
    of the end effector when picking piles directly from transport bundles, enabling
    reliable performance under variable real-world site conditions including dust,
    low lighting, and inconsistent bundle orientation.
  lesson_learnt: Adopt a multi-modal sensor fusion architecture (LiDAR for spatial
    awareness, vision for shape recognition, IMUs for dynamic response, proximity
    sensors for close-range confirmation) for robotic pile-picking end effectors —
    this combination delivered the most reliable and repeatable picking performance
    under varying field conditions and should form the baseline for future end effector
    sensor selection.
