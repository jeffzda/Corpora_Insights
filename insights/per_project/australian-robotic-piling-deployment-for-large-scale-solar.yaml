  publish_date: '2025-04-10'
  project_name: Australia Robotic Piling Deployment for Large Scale Solar PRO-973
  what_happened: The pilot project required motor piles with unusually low reveals
    (as low as 40 cm above ground level) that differed from typical tracker designs,
    meaning the robot software could not initially accommodate the specific pile geometry;
    a physical pile extension workaround was used while software development was completed.
  lesson_learnt: Confirm site-specific pile design requirements — including pile reveal
    heights and tracker design variants — before robot software is finalised; where
    design variations cannot be accommodated in software before deployment, pre-plan
    physical workarounds such as pile extensions to avoid construction stoppages.
