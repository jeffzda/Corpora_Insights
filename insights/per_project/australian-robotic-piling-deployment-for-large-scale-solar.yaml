  what_happened: Simulation testing alone during Gen 2 robot development did not capture
    real-world terrain variability and site challenges; field testing was required
    to identify control tuning needs and validate theoretical performance gains, with
    several issues only surfacing in the field environment.
  lesson_learnt: Do not rely on simulation testing alone to validate autonomous robotic
    construction systems — field testing in representative site conditions is indispensable
    for identifying control tuning requirements and real-world performance gaps that
    simulation cannot replicate, including terrain variability and environmental effects.
