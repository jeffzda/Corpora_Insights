  project_name: Australia Robotic Piling Deployment for Large Scale Solar PRO-973
  what_happened: During Gen 2 prototype development, frequent iteration between mechanical
    and software engineering teams was found to be critical for achieving coordinated
    picking logic, pile alignment feedback, and control actuation — insufficient integration
    between these disciplines led to misalignment between hardware capabilities and
    software control expectations.
  lesson_learnt: Establish tight mechanical-software integration loops during robotic
    prototype development — frequent co-iteration between mechanical and software
    leads is essential to align picking logic, pile alignment feedback, and control
    actuation, and reduces costly mismatches between hardware design and software
    control assumptions.
