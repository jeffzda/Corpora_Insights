- record_id: ARENA-DLV-65457
  source_title: Relectrify - Second-life battery trial - Final Knowledge Sharing Report
  publish_date: 2025-03
  project_name: Relectrify Second-Life Battery Trial
  what_happened: The anticipated cost advantage of second-life batteries over new
    batteries was largely offset by limited supply, high logistics costs, additional
    compliance overheads, and rapidly falling new-battery prices. In practice, second-life
    solutions offered only a marginal benefit over new batteries under 2020–2025 conditions,
    and the business case was sometimes viable only where sustainability motivations
    supplemented the financial case.
  lesson_learnt: Conduct sensitivity analysis on the second-life BESS cost case across
    logistics cost, used-battery acquisition price, and new-battery price trajectories
    before committing to a commercial second-life strategy — under adverse but plausible
    conditions, the economic case can collapse entirely, making the sustainability
    narrative the primary commercial differentiator rather than cost.
  issue_severity: major
  project_type: storage
  project_scale_band: demonstration
  lifecycle_phase: concept/feasibility
