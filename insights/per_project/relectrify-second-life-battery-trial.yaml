  publish_date: 2023-11
  project_name: Relectrify Second-Life Battery Trial (ReVolve®)
  what_happened: To replicate the certification body's test system without access
    to a commercial grid simulator (which was cost-prohibitive), Relectrify converted
    one of its own ReVolve units into an in-house grid simulator, enabling internal
    testing and reducing ongoing certification and regression-testing costs.
  lesson_learnt: Where commercial test infrastructure is unavailable or prohibitively
    expensive, developing proprietary in-house test tools — such as converting a production
    unit into a grid simulator — can generate significant cost savings, build internal
    capability, and accelerate future certification and product development cycles.
