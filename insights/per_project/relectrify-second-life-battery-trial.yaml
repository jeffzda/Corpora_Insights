  what_happened: Prospective C&I customers repeatedly raised the 4-year warranty on
    the ReVolve as a concern, comparing it unfavourably to the 6–10+ year warranties
    offered on new battery systems. Some customers were deterred by the shorter warranty
    despite being provided analysis supporting a 6–8 year system life expectation.
