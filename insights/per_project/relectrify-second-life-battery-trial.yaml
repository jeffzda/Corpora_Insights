  publish_date: 2023-11
  project_name: Relectrify Second-Life Battery Trial (ReVolve®)
  what_happened: Functional safety requirements demanded significant overhead and
    early involvement in the design and development phase, including selection of
    new microprocessors suitable for functional safety and upfront planning for EMC
    testing that incorporates functional safety elements — aspects that were not fully
    anticipated at the outset.
  lesson_learnt: Integrate functional safety planning from the earliest stage of design
    and development — late recognition of functional safety requirements (including
    microprocessor selection and EMC test scope) creates substantial rework and resource
    overhead that cannot be efficiently addressed retrospectively.
