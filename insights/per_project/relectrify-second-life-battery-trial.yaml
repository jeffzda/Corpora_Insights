  what_happened: Commissioning at some customer sites was constrained by grid connection
    agreements that imposed export limits or other power restrictions, preventing
    the standard full-power commissioning test from being performed. Relectrify engineers
    had to adapt commissioning plans on a site-by-site basis — for example, running
    partial-power tests or extended-duration lower-rate tests.
  lesson_learnt: Commissioning procedures for grid-connected BESS must anticipate
    export or power limits imposed by connection agreements and include a formally
    approved pathway for site-specific modifications — a single standard full-power
    checklist will fail at a material proportion of sites, and improvised adaptations
    without a governance process create both validation gaps and customer relationship
    risks.
