  what_happened: The ReVolve® became the first cell-level control product at commercial
    and industrial scale to be certified to IEC standards and the first stationary
    battery energy storage product using second-life EV batteries to be certified
    for on-grid deployment in Australia, with initial installations successfully completed
    at three commercial customer sites.
  lesson_learnt: A structured first-of-kind certification pathway for second-life
    battery products — despite high complexity and cost — unlocks commercial deployment
    and enables the proponent to assist future customers and partners in certifying
    new products using the same cell-level control technology, creating portfolio-wide
    leverage from the initial certification investment.
