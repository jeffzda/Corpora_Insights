- record_id: ARENA-DLV-65455
  source_title: Relectrify - Second-life battery trial - Final Knowledge Sharing Report
  publish_date: 2025-03
  project_name: Relectrify Second-Life Battery Trial
  what_happened: Second-life Nissan Leaf battery packs were sourced from Australia,
    the US, and Japan. Supply of used EV packs in the volumes and consistency required
    for production proved very limited, forcing the project to import packs from overseas
    when Australian supplies ran short. Automakers retained packs as assets with internal
    repurposing programs, keeping prices high.
  lesson_learnt: Do not assume that second-life EV batteries will be cheaply or readily
    available at commercial scale — OEM internal repurposing programs and low end-of-first-life
    volumes constrain supply and sustain high prices; a credible second-life BESS
    business model requires a secured, predictable battery supply chain before commercial
    commitments are made.
