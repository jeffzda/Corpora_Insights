- record_id: ARENA-DLV-65456
  source_title: Relectrify - Second-life battery trial - Final Knowledge Sharing Report
  publish_date: 2025-03
  project_name: Relectrify Second-Life Battery Trial
  what_happened: Shipping used lithium-ion battery packs internationally proved extremely
    difficult and costly. Multiple shipments were held at ports or turned away by
    carriers despite prior arrangements. COVID-19 surged freight costs, and one container
    of used battery modules spent months in transit limbo incurring storage fees.
    Logistics costs reached US$20–40/kWh shipped against an original expectation of
    under US$10/kWh.
  lesson_learnt: Model second-life battery logistics costs conservatively and account
    for dangerous-goods classification constraints — actual international shipping
    costs can reach 2–4× initial estimates and must be stress-tested for freight market
    disruption scenarios, as they can eliminate the core cost advantage of second-life
    over new batteries.
