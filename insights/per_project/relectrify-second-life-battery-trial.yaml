  what_happened: Relectrify's second-life BESS had a LCOS within 5–10% of equivalent
    new-battery systems in favourable scenarios, but this margin was highly sensitive
    to used-battery acquisition costs, international shipping rates (which doubled
    or tripled in 2021–2022), and foreign exchange rates. For economically-driven
    customers, payback periods of 4–7 years were acceptable but only marginally so,
    and some required additional incentives or sustainability value to justify investment.
  lesson_learnt: Second-life BESS project economics must be stress-tested against
    freight, FX, and used-battery price volatility before commercial commitments are
    made — the small cost advantage over new batteries can be eliminated by a single
    adverse logistics event, making the business case inherently fragile without risk
    mitigation mechanisms such as supply contracts or hedging.
