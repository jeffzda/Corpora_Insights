  what_happened: One DNSP revised its embedded generation guidelines partway through
    Relectrify's connection application process, delaying connection approvals for
    ReVolve systems in that distribution area. The fragmented landscape of fourteen
    DNSPs — each with its own guidelines updated independently — created ongoing compliance
    uncertainty for a product being deployed across multiple networks.
  lesson_learnt: When deploying across multiple DNSP areas, treat regulatory monitoring
    as a continuous internal function rather than a project milestone — nominate an
    internal regulatory lead or engage specialist consultants to track evolving DNSP-specific
