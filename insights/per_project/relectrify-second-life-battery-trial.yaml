  source_title: Relectrify - Second-life battery trial - Final Knowledge Sharing Report
  publish_date: 2025-03
  project_name: Relectrify Second-Life Battery Trial
  what_happened: Second-life battery packs exhibited SoH variation of up to 32% between
    cells and internal resistance variation of up to 2.63 mΩ within packs, plus highly
    clustered initial SoC imbalances of more than 50% spread. Conventional BMS architectures
    with passive balancing cannot adequately manage these levels of variability, limiting
    usable capacity and creating persistent imbalances over time.
  lesson_learnt: Second-life EV battery packs require active cell-level management
    systems — not conventional passive BMS — to achieve commercially viable performance;
    project designers should not assume that second-life packs can be substituted
    for new cells in conventional BESS architectures without significant performance
    penalties.
