- record_id: ARENA-DLV-65465
  source_title: Relectrify - Second-life battery trial - Final Knowledge Sharing Report
  publish_date: 2025-03
  project_name: Relectrify Second-Life Battery Trial
  what_happened: Servicing the ReVolve required highly skilled technicians — often
    Relectrify's own engineers — for many tasks because the design lacked sufficient
    modularity. Replacing battery modules required enclosure removal, disconnection
    of cell boards and wiring, and partial disassembly of module stacks. Internal
    cabling with multiple connectors created connectivity risks and complex assembly,
    including flat printed circuit cables that could appear seated when not fully
    engaged.
  lesson_learnt: Design BESS products for field serviceability by qualified tradespeople
    from the outset — modular, tool-friendly battery and electronics replacement that
