  project_name: Relectrify Second-Life Battery Trial
  what_happened: Integration of external site metering with the ReVolve's control
    system was an unexpected source of commissioning delays and suboptimal initial
    performance. Issues included very long cable runs causing signal attenuation,
    electrical noise on communication lines in industrial environments, incorrectly
    wired current transformers, and meter programming errors — tasks outside Relectrify's
    core competency that nonetheless required Relectrify engineers to troubleshoot.
  lesson_learnt: For BESS products that rely on external meters for operational control
    modes, treat metering integration as a defined scope item requiring clear installer
    documentation, pre-validated meter models, and specialist metering partnerships
    — leaving metering to site electricians without specific guidance consistently
    caused commissioning delays and performance issues.
