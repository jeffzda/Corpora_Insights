  source_title: Relectrify - Second-life battery trial - Final Knowledge Sharing Report
  publish_date: 2025-03
  project_name: Relectrify Second-Life Battery Trial
  what_happened: Multiple commercial and industrial installation sites presented space
    constraints not fully anticipated at design stage. Units sometimes had to be installed
    in tight electrical rooms or on raised steel platforms, which introduced new engineering
    considerations including structural load, vibration-induced electrical noise,
    and maintenance access limitations. Insufficient clearances around units made
    maintenance tasks harder to perform.
  lesson_learnt: Design commercial/industrial BESS products for real-world site constraints
    by minimising footprint, consolidating all regular service access to a single
    side, and providing prescriptive minimum clearance requirements in installation
    documentation — ideal site conditions are the exception, not the rule, and under-specified
    guidance leads to installations that are difficult and costly to maintain.
