- record_id: ARENA-DLV-65451
  source_title: Relectrify - Second-life battery trial - Final Knowledge Sharing Report
  publish_date: 2025-03
  project_name: Relectrify Second-Life Battery Trial
  what_happened: Achieving product certification for the ReVolve was significantly
    delayed because the system's integrated BMS-inverter architecture did not fit
    existing certification categories. A certification body was unsure whether to
    test the ReVolve as an inverter or as a battery system, causing certain tests
    to be redone and extending the overall certification timeline.
  lesson_learnt: Novel integrated devices that merge functions across established
    certification categories must engage certification bodies early to establish a
    shared classification framework — ambiguity about which standards apply forces
    rework and extends timelines materially. Design for certification from the outset,
    building required safety provisions into the product rather than retrofitting
    them.
