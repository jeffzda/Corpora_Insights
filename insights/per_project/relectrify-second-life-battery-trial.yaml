- record_id: ARENA-DLV-65452
  source_title: Relectrify - Second-life battery trial - Final Knowledge Sharing Report
  publish_date: 2025-03
  project_name: Relectrify Second-Life Battery Trial
  what_happened: A certification body required that the inverter portion of the ReVolve
    be certified by a JAS-ANZ-accredited laboratory, but no JAS-ANZ-accredited facility
    capable of testing the system was available. Relectrify's only viable option was
    an ILAC-MRA-accredited lab, and the CEC declined to make any exception, blocking
    CEC product listing.
  lesson_learnt: Before committing to a certification pathway for a novel system in
    the Australian market, verify that a JAS-ANZ-accredited test facility capable
    of evaluating the specific device type exists — discovering this gap mid-process
    forces expensive workarounds and can block market access via CEC listing regardless
    of IEC compliance.
