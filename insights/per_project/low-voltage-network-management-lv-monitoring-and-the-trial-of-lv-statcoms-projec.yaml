  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: '2014'
  project_name: 'Low Voltage Network Management: LV Monitoring and the Trial of LV
    Statcoms (Project ID 314)'
  what_happened: Energex's LV network monitoring project was rescoped during delivery
    — the trial focus was narrowed to manual control of STATCOMs and batteries, and
    in-house development of an active control application was abandoned, aligning
    with changes in business priorities.
  lesson_learnt: LV STATCOM and battery trials in distribution networks should account
    for the complexity of active control software development — when in-house development
    proves infeasible or deprioritised, scoping trials around manual control first
    provides a lower-risk path to generating useful network characterisation data.
