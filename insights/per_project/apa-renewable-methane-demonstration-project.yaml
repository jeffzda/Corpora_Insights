  publish_date: null
  project_name: Wallumbilla Renewable Methane Demonstration Project
  what_happened: A considerable time lag between ARENA grant submission and project
    commencement allowed the module design to continue evolving, but the impact of
    those design changes was not adequately reflected in the project plan, causing
    delays in design finalisation and ordering of complex equipment — compounded by
    international transport constraints.
  lesson_learnt: Acknowledge that product design evolves between grant submission
    and project commencement, and put in place efficient change management processes.
    Understand the implications of commercial payment terms on R&D and procurement
    timelines in advance, and ensure adequate contingency is built in for critical
    components.
