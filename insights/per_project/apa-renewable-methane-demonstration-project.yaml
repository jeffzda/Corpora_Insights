- record_id: ARENA-DLV-56653
  source_title: Wallumbilla Renewable Methane Demonstration Lessons Learnt
  publish_date: null
  project_name: Wallumbilla Renewable Methane Demonstration Project
  what_happened: COVID-19 restrictions prevented face-to-face interaction between
    the four key technology partners located across Melbourne, Sydney, Newcastle,
    the USA and Europe. Multiple video-conferencing tools were used as substitutes
    but did not deliver the brainstorming and problem-solving efficiency normally
    achieved in person.
  lesson_learnt: Assess carefully the use of geographically dispersed international
    technology partners, particularly for innovation-intensive work. Consider embedding
    sponsor personnel within technology partner teams to maintain the quality of collaboration
    that face-to-face interaction provides.
