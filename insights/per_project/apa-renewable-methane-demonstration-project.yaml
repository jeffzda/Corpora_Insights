- record_id: ARENA-DLV-56656
  source_title: Wallumbilla Renewable Methane Demonstration Lessons Learnt
  publish_date: null
  project_name: Wallumbilla Renewable Methane Demonstration Project
  what_happened: Initial activation of the MOF (metal-organic framework) for the CO2
    prototype at 110°C for 24 hours in vacuum failed because the vacuum pump used
    could only achieve 30 mbar whereas 1 mbar was required, necessitating a repeat
    activation under revised conditions.
  lesson_learnt: Verify that vacuum equipment meets the required specification (e.g.
    1 mbar for MOF activation) before commencing activation protocols — using a pump
    rated only to 30 mbar when 1 mbar is required will result in unsuccessful activation
    and require rework. Subsequent activation at 160°C for 4 hours at 30 mbar proved
    successful, indicating that protocol adjustment can compensate for equipment limitations.
  issue_severity: minor
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: utility/energy retailer
  delay_category: commissioning/integration
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: execution & logistics
  intervention_note: Activation protocol was adjusted to 160°C for 4 hours at 30 mbar
    vacuum, which proved successful.
  transferability: narrow
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages: &id006
  - 4
  evidence_excerpt: An initial activation at 110ºC for 24 hours in vacuum was unsuccessful
    because the vacuum pump used was only capable of 30mbar whereas 1mbar was required;
    Subsequent activation occurred at 160ºC for 4 hours in 30mbar vacuum, which proved
    successful.
  confidence_note: transferability set to narrow as this is a highly specific MOF
    activation procedure relevant only to similar adsorbent-based gas separation projects.
