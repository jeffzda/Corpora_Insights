- record_id: ARENA-DLV-56654
  source_title: Wallumbilla Renewable Methane Demonstration Lessons Learnt
  publish_date: null
  project_name: Wallumbilla Renewable Methane Demonstration Project
  what_happened: International technology partners were selected several months before
    the project commenced without adequate research into Australian capability. After
    selection, it was discovered that Australian academics had advanced design and
    manufacturing capability to supply key technology components required for the
    renewable methane module.
  lesson_learnt: Carefully and extensively research local capability before selecting
    technology partners — the logistical advantages of Australian-based partners (reduced
    shipping delays, ease of collaboration) should be explicitly factored into partner
    selection. If a time lag exists between project conception and agreement, review
    key technical requirements and partner assumptions prior to commencement to confirm
    they remain best-available.
