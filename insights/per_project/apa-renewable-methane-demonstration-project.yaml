  delay_category: internal governance/resourcing
  failure_mode: coordination & stakeholders
  outcome_class: delayed but recoverable
  secondary_failure_mode: null
  intervention_note: Various video-conferencing tools (Zoom, Microsoft Teams, Skype,
    Webex) were adopted as mitigations, though these were noted as inferior to face-to-face
    interaction.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages: &id003
  - 3
  evidence_excerpt: The impact of COVID-19 did not allow for face-to-face interaction
    (even between Australian parties) which is essential for efficient brainstorming
    of ideas essential for innovation and problem solving; Various video-conferencing
    measures were used (Zoom, Microsoft Project, Skype, Webex) but did not deliver
    the results normally expected from face-to-face interaction.
  confidence_note: failure_mode set to resource/capability shortfall as the collaboration
