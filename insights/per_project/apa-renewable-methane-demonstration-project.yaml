- record_id: ARENA-DLV-56651
  source_title: Wallumbilla Renewable Methane Demonstration Lessons Learnt
  publish_date: null
  project_name: Wallumbilla Renewable Methane Demonstration Project
  what_happened: International air freight of adsorbent materials, test coupons and
    adsorbent canisters between Australian and US-based technology partners experienced
    repeated delays of at least two weeks beyond normal courier times, caused primarily
    by COVID-19 disruptions to air freight logistics and unanticipated regulatory
    clearance requirements.
  lesson_learnt: Assess carefully the schedule risk of using international technology
    partners for time-critical aspects of the project — international logistics are
    highly susceptible to disruption, and delays of two or more weeks beyond normal
    courier times should be treated as a realistic scenario when planning critical
    path activities.
