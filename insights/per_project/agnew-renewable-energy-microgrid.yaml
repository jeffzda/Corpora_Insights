  project_name: Agnew Hybrid Microgrid Project
  what_happened: Getting IPP consortiums comfortable with Gold Fields as a counterparty
    — specifically that their return on capital was secure — required demonstrating
    the Agnew mine company's balance sheet strength, providing credit support from
    the wider Gold Fields group, and offering other financial guarantees.
  lesson_learnt: For first-of-kind hybrid microgrid PPAs at remote mines, proactively
    demonstrate mine company creditworthiness to prospective IPP consortiums through
    balance sheet disclosure, group-level credit support and financial guarantees
    — IPP willingness to commit capital at competitive rates depends on confidence
    in the offtaker's financial standing, not just the technical merit of the project.
