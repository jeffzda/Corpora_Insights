- record_id: ARENA-DLV-21179
  source_title: Gold Fields Agnew Gold Mine Final Report
  publish_date: 2022-03
  project_name: Agnew Hybrid Microgrid Project
  what_happened: Spinning reserve cannot practically be reduced to zero even with
    a large BESS providing virtual spinning reserve, because mine load varies at a
    rate faster than a gas generator can be started and shut down; relying solely
    on the BESS for spinning reserve would cause premature BESS ageing.
  lesson_learnt: Do not design a hybrid microgrid to rely solely on the BESS for spinning
    reserve — the combination of BESS and online gas generator spinning reserve is
    more cost-effective and avoids premature battery ageing from excessive cycling
    that would result if the BESS alone had to cover rapid load variations.
