  what_happened: There is a limited number of cranes in Australia capable of performing
    wind farm erection duties, and mobilising these cranes to a remote site is a significant
    logistical challenge requiring over 50 truck loads and supporting cranes. Roads
    must be built to crane specification if the crane is to travel between turbine
    sites on tracks, otherwise it must be dismantled, transported and reassembled
    at each site, adding materially to hire time and labour costs.
  lesson_learnt: Secure specialised wind farm cranes early in procurement — crane
    availability is a genuine supply constraint in Australia, and mobilisation logistics
    (50+ truck loads, access road specification, crane assembly/disassembly between
    turbine sites) should be fully costed and scheduled at the design stage for remote
    wind projects.
