  what_happened: Predictive solar technology (sky imager cloud forecasting) was implemented
    at Agnew but found to have limited practical benefit because the BESS provided
    sufficient instantaneous power buffer and solar penetration was relatively low,
    meaning the MCS did not need advance warning to schedule gas generation ahead
    of solar loss.
  lesson_learnt: Predictive solar forecasting technology offers limited operational
    benefit in a microgrid where BESS instantaneous capacity is sized to full or near-full
    mine load — the technology becomes more valuable when BESS is undersized, but
    increasing BESS minimum state of charge is a more effective strategy for low-carbon
    microgrids than reducing BESS size and relying on forecasting.
