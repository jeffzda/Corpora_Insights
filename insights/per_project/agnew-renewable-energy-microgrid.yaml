  source_title: Gold Fields Agnew Gold Mine Final Report
  publish_date: 2022-03
  project_name: Agnew Hybrid Microgrid Project
  what_happened: Traditional thermal IPPs had not historically needed to form consortiums
    to integrate multiple technologies, making it difficult to find IPPs with the
    combined capability and experience to deliver, integrate and operate wind, solar,
    BESS and thermal components together. Competitive tension was also constrained
    because the volume of integration, renewable resource and construction risks was
    much larger than for a typical thermal project.
  lesson_learnt: When procuring a first-of-kind hybrid microgrid, actively facilitate
    IPP consortium formation through introductions between suitable parties and absorb
    a greater share of project risk than in a typical thermal procurement — stacking
    too many risks onto tenderers reduces competitive tension and may result in excessive
    risk premiums or insufficient bidder interest.
