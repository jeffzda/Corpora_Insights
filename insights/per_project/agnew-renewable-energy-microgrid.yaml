  what_happened: The ARENA funding of $13.5 million enabled Gold Fields to increase
    the BESS size to match the full mine load, effectively creating an uninterruptible
    power supply (UPS) for the mine. Without this additional funding, the battery
    would have been smaller and the reliability and renewable fraction outcomes would
    have been lower.
