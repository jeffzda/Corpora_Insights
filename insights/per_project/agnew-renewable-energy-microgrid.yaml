  source_title: Gold Fields Agnew Gold Mine Final Report
  publish_date: 2022-03
  project_name: Agnew Hybrid Microgrid Project
  what_happened: At the point of writing, the most cost-effective strategy to increase
    renewable fraction at Agnew beyond 54% was installing additional solar PV generation
    (approximately $10 million for 6 MW additional solar, lifting REF from 54% to
    60%) rather than bulk energy storage (100 MWh battery estimated well above $38
    million, only lifting REF from 54% to 59%).
  lesson_learnt: For mid-range renewable fractions (50–80%), designing a microgrid
    to accept curtailment and adding incremental renewable generation is more cost-effective
    than investing in bulk energy storage — storage becomes economic above approximately
    80% REF where there are diminishing returns from additional renewable capacity.
