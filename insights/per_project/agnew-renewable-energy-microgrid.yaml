  project_name: Agnew Hybrid Microgrid Project
  what_happened: The lithium-ion BESS at Agnew was sized to provide short-duration
    buffering (approximately 15 minutes) to cover thermal generator start-up time,
    rather than bulk energy storage for time-shifting. This made the BESS unsuitable
    for high-frequency cycling without risking premature cell degradation.
  lesson_learnt: Size the BESS power rating to cover the full mine load during the
    thermal generator start-up window, but recognise that short-duration BESS cannot
    substitute for bulk energy storage needed to approach 100% renewable fraction
    — increasing renewable generation capacity with managed curtailment is currently
    more cost-effective than additional BESS capacity for mid-range renewable fractions
    (50–80%).
