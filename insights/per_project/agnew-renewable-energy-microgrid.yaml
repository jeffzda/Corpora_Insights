  source_title: Gold Fields Agnew Gold Mine Final Report
  publish_date: 2022-03
  project_name: Agnew Hybrid Microgrid Project
  what_happened: 'ARENA funding approval was still progressing through its channels
    at the time of financial close, forcing the project to be split into two phases:
    Phase 1 (thermal station and 4 MW solar) and Phase 2 (wind farm and BESS), with
    Phase 2 contingent on ARENA funding approval.'
  lesson_learnt: Align ARENA funding approval timelines with project financial close
    — where approval lags, phased delivery can preserve schedule but introduces cost
    escalation, reduced amortisation periods, and constrained future optionality that
    may not be recoverable post-construction.
