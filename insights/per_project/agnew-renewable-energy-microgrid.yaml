- record_id: ARENA-DLV-21167
  source_title: Gold Fields Agnew Gold Mine Final Report
  publish_date: 2022-03
  project_name: Agnew Hybrid Microgrid Project
  what_happened: Investing in renewable energy for a mine represents a fundamental
    shift in risk profile from low capex/high opex (diesel) to high capex/low opex,
    requiring a much larger upfront capital investment that tests balance sheet strength
    and is only economically viable if the mine has sufficient life to amortise the
    expenditure — at least 10 years, with 25 years most desirable.
  lesson_learnt: Before committing to a high-penetration renewable microgrid for a
    mine, confirm that the mine has sufficient geological reserves and life expectancy
    to amortise the renewable energy capital outlay — the business case requires at
    minimum a 10-year amortisation period and the project is infeasible for mines
    with short remaining lives or capital constraints.
