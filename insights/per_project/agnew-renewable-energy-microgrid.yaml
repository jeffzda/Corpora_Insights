- record_id: ARENA-DLV-21156
  source_title: Gold Fields Agnew Gold Mine Final Report
  publish_date: 2022-03
  project_name: Agnew Hybrid Microgrid Project
  what_happened: 'The gas supply pressure regulators were identified as a design risk:
    at 100% renewable penetration with thermal generators off, regulators can pass
    gas to the low-pressure side and trigger an emergency shutdown of the gas supply,
    which in a remote location could take a long time to manually reset.'
  lesson_learnt: Design gas supply systems for a no-flow condition by including automated
    isolation valves upstream of pressure regulators, controlled by a signal from
    the power station when thermal generation is not required — this prevents emergency
    gas supply shutdowns at high renewable fractions and avoids prolonged manual resets
    in remote locations.
  issue_severity: moderate
  project_type: multi-technology/hybrid
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: industrial operator
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Identified as a design lesson for future projects; retrofitting
    was assessed as uneconomic at Agnew.
  transferability: moderate
  delay_magnitude: null
  technology_domain: hybrid systems
  source_pages: &id006
  - 20
  evidence_excerpt: For projects connected to a gas pipeline, at 100% renewable penetration
    (thermal generators off), the gas supply pressure regulators may pass gas over
    to the low pressure side and trigger an emergency shutdown of the gas supply...
