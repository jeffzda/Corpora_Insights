- record_id: ARENA-DLV-21155
  source_title: Gold Fields Agnew Gold Mine Final Report
  publish_date: 2022-03
  project_name: Agnew Hybrid Microgrid Project
  what_happened: Gold Fields took the Agnew project to the IPP market for tender after
    collecting only 3 months of wind resource data from a SODAR unit, well short of
    the 12-month minimum historically required for bankable wind farm design and the
    3 years preferred by financiers.
  lesson_learnt: A short wind dataset (3 months SODAR) does not have to delay project
    procurement — IPPs can extrapolate limited datasets against regional wind data
    for turbine selection and sizing, and the dataset can be validated against a 12-month
    dataset collected during detailed design; for new projects, freely available datasets
    (AREMI, NASA) can support early viability assessment before local instrumentation
    data is complete.
