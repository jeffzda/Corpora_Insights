- record_id: ARENA-DLV-21180
  source_title: Gold Fields Agnew Gold Mine Final Report
  publish_date: 2022-03
  project_name: Agnew Hybrid Microgrid Project
  what_happened: The Agnew project demonstrated that wind and solar resources at this
    location are complementary — wind is predominantly available at night when solar
    is absent, and vice versa — resulting in a stable combined renewable energy output
    that supports a consistent 54% renewable energy fraction across all seasons.
  lesson_learnt: Assess the diurnal and seasonal complementarity of wind and solar
    resources at a specific site before committing to a hybrid renewable configuration
    — where wind and solar are strongly complementary (wind at night, solar by day),
    the combined renewable fraction can be achieved at lower storage cost and with
    less curtailment than at sites where both resources peak simultaneously.
