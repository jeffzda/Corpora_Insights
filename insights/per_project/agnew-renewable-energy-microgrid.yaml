  what_happened: Phasing the delivery (splitting Phase 1 and Phase 2) forced Gold
    Fields to secure additional gas pipeline capacity for a 12-month period, eliminating
    the LNG option and locking in sunk costs that made it less feasible to achieve
    higher renewable fractions in the future, while also resulting in higher emissions
    over the project life and reduced LGC revenue.
