  source_title: Gold Fields Agnew Gold Mine Final Report
  publish_date: 2022-03
  project_name: Agnew Hybrid Microgrid Project
  what_happened: The mismatch between mine life (finite, dependent on geological reserves)
    and renewable energy asset life (25+ years) is identified as a key commercial
    barrier to renewable energy adoption at mine sites, with the assets least redeployable
    (wind turbines and PV arrays) presenting the highest residual commercial risk
    if the mine closes before end of PPA term.
  lesson_learnt: Address the mine life vs. renewable asset life mismatch at the procurement
    stage by structuring the PPA so the mine owner retains residual risk on non-redeployable
    assets, and factor the resulting higher monthly lease charge into the business
    case — emerging redeployable renewable technologies (e.g. modular solar systems)
    may offer a better risk-return profile for mines with shorter expected lives.
