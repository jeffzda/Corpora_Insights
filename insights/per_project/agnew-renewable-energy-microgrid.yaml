- record_id: ARENA-DLV-21169
  source_title: Gold Fields Agnew Gold Mine Final Report
  publish_date: 2022-03
  project_name: Agnew Hybrid Microgrid Project
  what_happened: Demand-side dynamic load shedding was implemented at Agnew as a last
    resort capability but had not been initiated as of the time of writing, because
    the BESS provided sufficient reliability. The document notes that if load shedding
    were used as a first line of defence, the impact on mine production could be severe
    including triggering underground mine evacuations due to loss of ventilation.
  lesson_learnt: For underground mines, invest in a sufficiently robust power solution
    (including full-load BESS buffering) to avoid reliance on dynamic load shedding
    — the production losses and safety consequences of shedding underground mine loads
    (ventilation loss triggering evacuation) far exceed the capital cost premium of
    a more robust generation and storage configuration.
