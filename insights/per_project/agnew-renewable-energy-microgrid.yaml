- record_id: ARENA-DLV-21158
  source_title: Gold Fields Agnew Gold Mine Final Report
  publish_date: 2022-03
  project_name: Agnew Hybrid Microgrid Project
  what_happened: The long-term renewable energy fraction at Agnew is constrained to
    approximately 54% (with instantaneous peaks of 85%) due to the requirement to
    run a minimum of two thermal generators at all times to provide system inertia
    and spinning reserve, causing renewable energy curtailment of approximately 7.3%.
  lesson_learnt: Design the inertia and spinning reserve strategy early — the requirement
    to maintain a minimum number of synchronous generators online limits long-term
    renewable fraction and causes curtailment; technologies such as synchronous condensers,
    flywheels, or BESS-based virtual inertia should be evaluated at the design stage
    to avoid this constraint being locked in.
  issue_severity: moderate
  project_type: multi-technology/hybrid
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: industrial operator
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: Gold Fields is investigating relieving the minimum thermal operating
    constraint by proving the BESS can replicate grid support functionality of thermal
    generators; if successful, curtailment would reduce from 7.3% to 3.4% and REF
    would increase from 54% to 57%.
  transferability: moderate
