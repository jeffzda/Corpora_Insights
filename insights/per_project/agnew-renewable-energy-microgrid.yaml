- record_id: ARENA-DLV-21174
  source_title: Gold Fields Agnew Gold Mine Final Report
  publish_date: 2022-03
  project_name: Agnew Hybrid Microgrid Project
  what_happened: The Agnew mine is a continuous 24/7 operation and even a brief power
    outage can cause up to 4 hours of production downtime at the process plant due
    to system reset requirements, gold losses to tailings, and potential underground
    mine evacuations. This operational context drove the design decision to invest
    in a highly reliable power solution rather than optimising purely on cost.
  lesson_learnt: When sizing backup and firming capacity for an underground gold mine
    microgrid, quantify the production cost of a power outage (including process plant
    reset time, gold recovery losses and underground evacuation costs) and use this
    as the benchmark for evaluating the cost-benefit of incremental reliability investments
    such as a full-load BESS.
