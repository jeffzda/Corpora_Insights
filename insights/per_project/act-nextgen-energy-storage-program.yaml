- record_id: ARENA-DLV-52511
  source_title: ARENA's Virtual Power Plant Knowledge Sharing Workshop Summary
  publish_date: 2019-03
  project_name: ACT NextGen Energy Storage Program
  what_happened: The ACT NextGen program achieved over 1,000 system sales (4.5 MW
    of output) and developed a battery database, smart requirements, and industry/community
    collaborations, demonstrating that a government subsidy program can drive meaningful
    DER uptake.
  lesson_learnt: A brand- and technology-neutral approach combined with smart requirements
    and a battery database can deliver meaningful scale (1,000+ systems, 4.5 MW) in
    a government subsidy program — these design elements are replicable in other jurisdictions.
