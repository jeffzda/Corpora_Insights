- record_id: ARENA-DLV-52512
  source_title: ARENA's Virtual Power Plant Knowledge Sharing Workshop Summary
  publish_date: 2019-03
  project_name: ACT NextGen Energy Storage Program
  what_happened: The ACT NextGen program faced challenges with battery prices, lack
    of public awareness, split incentives, and resourcing and contract management,
    all of which constrained the program's rate of uptake.
  lesson_learnt: Government ESS programs must actively plan for split incentives (e.g.
    landlord/tenant, renter/owner), insufficient public awareness, and internal contract
    management resourcing — these are recurring constraints on program throughput
    and should be addressed in program design rather than managed reactively.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: operations
  proponent_type: government/public-sector body
  delay_category: internal governance/resourcing
  failure_mode: coordination & stakeholders
  outcome_class: partial success
  secondary_failure_mode: commercial & market
  intervention_note: A mid-cycle program review was commenced and a brand/technology
    neutral approach with ongoing stakeholder engagement was maintained.
