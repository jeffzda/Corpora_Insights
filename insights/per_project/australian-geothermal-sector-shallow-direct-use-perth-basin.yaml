- record_id: ARENA-DLV-14980
  source_title: 'Looking Forward: Barriers, Risks and Rewards of the Australian Geothermal Sector to 2020 and 2030'
  publish_date: 2014-06
  project_name: Australian Geothermal Sector – Shallow Direct Use (Perth Basin)
  what_happened: Nine commercial shallow direct-use geothermal projects were operating in the Perth metropolitan area by 2014, using the Yarragadee Aquifer to heat swimming pools, demonstrating that shallow
    direct-use geothermal energy (CRI Level 4) can be deployed commercially without material government intervention in settings with mature regulatory frameworks and well-characterised resources.
  lesson_learnt: Shallow direct-use geothermal applications in Australia have demonstrated commercial viability where the resource is well understood, technology is mature, and regulatory frameworks are
    established; the main barrier to broader deployment is establishing market pathways — capturing and publishing performance data from existing projects as case studies would materially accelerate wider
    adoption in other jurisdictions.
