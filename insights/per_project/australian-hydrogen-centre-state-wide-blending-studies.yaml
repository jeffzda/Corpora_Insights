  what_happened: The AHC's implementation plan identified that safety management documentation
    and approval to operate a 100% hydrogen gas network needed to be completed between
    2022 and 2028, and that updates to safety and operating procedures were needed
    to reflect differences between hydrogen and natural gas — however, these were
    assessed as not representing major step-changes to current procedures.
  lesson_learnt: Safety management documentation and operational procedure updates
    for hydrogen networks should be initiated at least 6–7 years before planned conversion
    to allow sufficient time for regulatory approval processes; because the changes
    are not major step-changes from natural gas procedures, early engagement with
    safety regulators should be used to confirm scope and streamline approvals rather
    than treating them as a new regulatory frontier.
