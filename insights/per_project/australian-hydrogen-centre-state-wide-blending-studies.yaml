  what_happened: The AHC found that significant regulatory and legal work was required
    at both state and federal levels to enable blended gas and hydrogen supply, including
    recognition of hydrogen in regulatory frameworks, compliance with gas specifications
    and standards, and regulatory changes needed for the sale of a 'renewable gas'
    product — none of which were resolved at the time of the study.
  lesson_learnt: Regulatory reform to recognise hydrogen in gas network frameworks
    is a long-lead enabler that must be initiated in parallel with technical feasibility
    work — proponents should engage regulators early to map the required legislative
    and standards changes and sequence them against the project implementation timeline,
    rather than treating regulatory readiness as a follow-on activity.
