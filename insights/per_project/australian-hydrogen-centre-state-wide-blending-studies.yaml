  evidence_excerpt: Current electrolysis technology requires water that is purified
    at site to what commonly referred to as 'ultra-pure water'. This means hydrogen
    production does not necessarily require high quality water supply to begin with
    and can avoid competition with existing demands for these sources by drawing on
    lower quality options, including seawater, and recycled wastewater.
