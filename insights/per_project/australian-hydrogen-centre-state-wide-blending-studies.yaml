- record_id: ARENA-DLV-63555
  source_title: Australian Hydrogen Centre State-Wide Blending Studies - Summary Report
  publish_date: null
  project_name: Australian Hydrogen Centre State-Wide Blending Studies
  what_happened: A comprehensive assessment of gas distribution network assets in
    South Australia and Victoria found that 162 of 178 distribution licensed pipelines
    are suitable for both 10% and 100% hydrogen supply, with only 16 requiring potential
    minor modification pending further research; all distribution piping was found
    suitable with no changes required.
  lesson_learnt: Conducting a full asset compatibility audit of the existing gas network
    before committing to hydrogen blending investment is a low-regret action — in
    both SA and Victoria, the vast majority of network assets required no modification,
    meaning network upgrade costs are a small fraction of total project costs and
    can largely be absorbed within planned asset replacement programs.
