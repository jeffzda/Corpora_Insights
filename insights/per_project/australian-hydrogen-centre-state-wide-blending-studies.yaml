  source_title: Australian Hydrogen Centre State-Wide Blending Studies - Summary Report
  publish_date: null
  project_name: Australian Hydrogen Centre State-Wide Blending Studies
  what_happened: The AHC's modelling found that optimum electrolyser capacity factor
    and electricity generation mix is dependent on the availability of long-term storage
    — projects with more storage can rely less on expensive renewable energy sources,
    reducing the need to match the daily gas load profile with real-time electricity
    generation.
  lesson_learnt: Long-term hydrogen storage and electrolyser sizing must be co-optimised
    — undersizing storage forces reliance on expensive peak electricity supply and
    reduces the ability to exploit negative-price curtailment periods; developers
    should model storage-electrolyser interactions explicitly before finalising capacity
    decisions rather than sizing them independently.
