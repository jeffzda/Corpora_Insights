  project_name: Australian Hydrogen Centre State-Wide Blending Studies
  what_happened: The AHC found that existing domestic appliances are compatible with
    up to 10% hydrogen blends, but that compatibility of bespoke commercial and industrial
    (Type B) appliances at 10% hydrogen had not yet been fully confirmed, requiring
    separate research and practical demonstrations such as HyP SA and Hydrogen Park
    Gladstone to progress approvals.
  lesson_learnt: Appliance compatibility testing — particularly for commercial and
    industrial Type B appliances — is a critical approval pathway dependency that
    must be sequenced early in the program; uncertainty about the upper blending limit
    for existing appliances is a key regulatory risk that can constrain network rollout
    timelines if not resolved in advance.
