  source_title: Australian Hydrogen Centre State-Wide Blending Studies - Summary Report
  publish_date: null
  project_name: Australian Hydrogen Centre State-Wide Blending Studies
  what_happened: The AHC modelled that current electrolysis technology requires ultra-pure
    water produced on-site, meaning hydrogen production does not require high-quality
    water supply at source; it can use lower-quality sources including seawater and
    recycled wastewater, with a conservative consumption ratio of 20 litres per kilogram
    of hydrogen produced.
  lesson_learnt: Water sourcing for hydrogen production should be planned around lower-quality
    inputs (seawater, recycled wastewater) rather than competing for potable or high-quality
    water; on-site water purification enables siting flexibility, and total water
    needs for full state-wide 100% hydrogen networks are less than 0.3% of annual
    state water use — water availability should not be treated as a binding site selection
    constraint.
  issue_severity: none
  project_type: null
  project_scale_band: utility/large-scale
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
