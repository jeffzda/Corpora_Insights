  project_name: Australian Hydrogen Centre State-Wide Blending Studies
  what_happened: The AHC identified that introducing hydrogen-ready appliances as
    existing appliances reach natural end-of-life — rather than undertaking a forced
    mass changeover — enables a single-step transition to 100% hydrogen from 10%,
    minimising customer disruption and reducing the cost and complexity of conversion
    programs.
  lesson_learnt: Mandate or incentivise the purchase of hydrogen-ready appliances
    ahead of the 100% conversion date so that appliance stock naturally turns over;
    a dual-fuel or hydrogen-ready appliance mandate by 2030 is a low-regret enabler
    that avoids a costly forced changeover program later and preserves customer energy
    choice during the transition.
