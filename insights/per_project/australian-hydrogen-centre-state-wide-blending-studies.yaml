- record_id: ARENA-DLV-63558
  source_title: Australian Hydrogen Centre State-Wide Blending Studies - Summary Report
  publish_date: null
  project_name: Australian Hydrogen Centre State-Wide Blending Studies
  what_happened: The AHC found that 100% hydrogen requires new appliances or burner
    parts for consumers, but that at the time of the study, 100% hydrogen appliances
    were niche products while the market established itself, and Australian Standards
    for these appliances had not yet been developed — meaning testing requirements
    could not be finalised and manufacturers could not begin producing at scale for
    the Australian market.
  lesson_learnt: Development of Australian Standards for 100% hydrogen appliances
    is a long-lead enabling action that must be initiated well before network conversion
    commences — without standards, testing requirements cannot be set and manufacturers
    cannot supply at scale; this should be treated as a critical path regulatory dependency
    in implementation planning.
