  project_name: Australian Hydrogen Centre State-Wide Blending Studies
  what_happened: The AHC's financial modelling found that average residential customer
    bills for 100% renewable hydrogen could be similar to projected natural gas-only
    bills out to 2050, but this model excluded any cost of carbon, biomethane, hydrogen
    with CCS, and technological breakthroughs — meaning the model was conservative
    and did not fully capture potential cost advantages of hydrogen.
  lesson_learnt: Financial modelling for hydrogen network transition programs should
    explicitly present model boundary conditions — particularly the exclusion of carbon
    costs, alternative renewable gases, and technology improvement curves — to avoid
    both overstating and understating the economic case; presenting a conservative
    base case alongside upside scenarios gives decision-makers a more robust basis
    for investment decisions.
