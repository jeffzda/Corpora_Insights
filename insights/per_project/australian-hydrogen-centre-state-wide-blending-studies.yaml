  project_name: Australian Hydrogen Centre State-Wide Blending Studies
  what_happened: Feasibility modelling found that 100% hydrogen supply would reduce
    gas network capacity by approximately 13% due to hydrogen's lower energy density,
    but this reduction could be absorbed by the existing network while maintaining
    supply at historic service levels.
  lesson_learnt: Network capacity modelling should explicitly account for the ~13%
    capacity reduction when transitioning to 100% hydrogen — project planners should
    confirm the existing network's ability to absorb this reduction before committing
    to full conversion, rather than discovering it as a constraint during detailed
    design.
