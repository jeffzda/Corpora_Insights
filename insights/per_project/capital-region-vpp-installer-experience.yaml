- record_id: ARENA-DLV-52530
  source_title: ARENA's Virtual Power Plant Knowledge Sharing Workshop Summary
  publish_date: 2019-03
  project_name: Capital Region VPP / Installer Experience
  what_happened: A chart of hybrid solar installation job productivity over 9 months
    showed a steep initial learning curve in labour hours per job, with productivity
    improving significantly as installers completed more jobs, illustrating the importance
    of workforce development in scaling ESS installation programs.
  lesson_learnt: Account for the steep installer learning curve in ESS rollout scheduling
    — early jobs in a hybrid solar/battery program consume substantially more labour
    hours than later jobs; program throughput and unit costs will improve materially
    as installer experience accumulates, so initial capacity assumptions should not
    be based on mature productivity rates.
