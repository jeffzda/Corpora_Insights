  what_happened: A number of LSBS projects reported highly complex contracting arrangements
    with up to 15 parties involved, and proponents noted that underestimating negotiation
    timeframes and making multiple iterations of contracting structures led to protracted
    processes.
  lesson_learnt: LSBS projects should not underestimate contracting complexity — up
    to 15 parties may be involved — and should avoid multiple iterations of contracting
    structures by fully understanding the business case and guarantee structure before
    entering negotiations; leveraging market precedents and guidance on contracting
    structures from previous projects will reduce rework.
