  what_happened: All ARENA-funded LSBS projects identified additional services — including
    FFR, synthetic inertia, system strength, SIPS, and VCAS — that the battery hardware
    is technically capable of providing but for which no market revenue stream currently
    exists, leaving significant potential value uncaptured.
