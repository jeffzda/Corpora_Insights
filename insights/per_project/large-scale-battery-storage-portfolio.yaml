- record_id: ARENA-DLV-2968
  source_title: Large-Scale Battery Storage Knowledge Sharing Report
  publish_date: 2019-09
  project_name: Large-Scale Battery Storage (portfolio)
  what_happened: Battery regulation FCAS operation requires significantly greater
    energy throughput than contingency FCAS, creating additional round-trip efficiency
    losses and degradation, and a tendency to reduce state of charge when providing
    both raise and lower regulation FCAS simultaneously.
  lesson_learnt: Regulation FCAS participation strategies must explicitly account
    for round-trip efficiency losses and state of charge drift — an intelligent bidding
    strategy that uses low wholesale price periods to provide lower regulation FCAS
    (charging only) can enable recharging while earning FCAS revenue and should be
    incorporated into battery operating logic.
