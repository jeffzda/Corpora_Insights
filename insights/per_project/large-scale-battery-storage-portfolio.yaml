- record_id: ARENA-DLV-2962
  source_title: Large-Scale Battery Storage Knowledge Sharing Report
  publish_date: 2019-09
  project_name: Large-Scale Battery Storage (portfolio)
  what_happened: Multiple LSBS projects experienced delays in commissioning due to
    challenges with the timing of grid connection access being granted — a problem
    affecting both standalone battery projects and batteries co-located with generation,
    since co-located systems cannot use the co-located generator to form a microgrid
    for battery commissioning and testing.
  lesson_learnt: Grid connection access timing is a common commissioning delay risk
    for all LSBS configurations; project schedules should include contingency for
    delayed network access and project designs should consider provisions for temporary
    commissioning equipment (such as diesel generators and load banks) to allow commissioning
    independent of network access where this risk is identified early.
  issue_severity: moderate
