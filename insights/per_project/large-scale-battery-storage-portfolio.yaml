  what_happened: There is no existing market framework for system strength as a service
    in the NEM, forcing VRE developers to install synchronous condensers at significant
    cost to meet connection requirements, while some battery inverter technologies
    can potentially provide equivalent system strength support but lack the demonstrated
    evidence needed to be recognised by AEMO.
  lesson_learnt: LSBS projects in weak grid areas should evaluate advanced grid-forming
    inverter options as a potential lower-cost alternative to synchronous condensers
    for meeting system strength requirements — the battery's system strength contribution
    can be built into the business case for the associated VRE generator connection
    rather than requiring a separate market payment.
