  source_title: Large-Scale Battery Storage Knowledge Sharing Report
  publish_date: 2019-09
  project_name: Large-Scale Battery Storage (portfolio)
  what_happened: There is an inconsistency in how AEMO's Market Ancillary Services
    Specification (MASS) has been applied to determine permissible contingency FCAS
    registered capacities across the LSBS projects, with AEMO's January 2019 guidance
    (41% of dispatch capacity) not being consistent with any of the actual registered
    capacities of existing projects.
  lesson_learnt: Future LSBS projects should not assume their contingency FCAS registered
    capacity will equal their full dispatch capacity — the methodology applied by
    AEMO remains inconsistent across projects and the 2019 guidance (41% of capacity)
    is not reflected in existing registrations; project developers should engage AEMO
    directly to clarify applicable capacity registration rules before building FCAS
    revenue into the business case.
