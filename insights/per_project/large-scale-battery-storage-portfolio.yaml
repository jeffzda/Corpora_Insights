  source_title: Large-Scale Battery Storage Knowledge Sharing Report
  publish_date: 2019-09
  project_name: Large-Scale Battery Storage (portfolio)
  what_happened: LSBS projects face uncertainty in revenue forecasting because ability
    to capture revenue depends on fluctuating spot prices, FCAS price signals, and
    future changes to the energy system (e.g. generation mix changes and new interconnection
    projects), making financial modelling for investor confidence difficult.
  lesson_learnt: LSBS business cases require scenario-based revenue modelling that
    accounts for FCAS market saturation, wholesale price volatility, and structural
    NEM changes — single-point revenue forecasts are unreliable; developers should
    build sensitivity analysis for major market variables into investor documentation
    to accurately represent the risk profile.
