- record_id: ARENA-DLV-2969
  source_title: Large-Scale Battery Storage Knowledge Sharing Report
  publish_date: 2019-09
  project_name: Large-Scale Battery Storage (portfolio)
  what_happened: The existing regulation FCAS framework does not differentiate or
    reward the faster and more precise frequency response quality that LSBS can provide
    compared to traditional steam turbine generators, meaning battery operators cannot
    monetise their superior performance in this market.
