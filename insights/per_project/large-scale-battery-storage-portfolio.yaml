  source_title: Large-Scale Battery Storage Knowledge Sharing Report
  publish_date: 2019-09
  project_name: Large-Scale Battery Storage (portfolio)
  what_happened: Standard warranty conditions offered by some battery suppliers are
    based on assumed energy cycling and state of charge profiles that do not reflect
    the complex, multi-service operating reality of LSBS in the NEM, creating commercial
    risk for operators who deviate from warranty assumptions to optimise revenue.
  lesson_learnt: Battery warranty structures should be negotiated to reflect energy-throughput-based
    degradation rather than fixed cycling and SOC assumptions — inflexible standard
    warranties create a tension between maximising revenue (which requires flexible
    operation) and maintaining warranty coverage; developers should negotiate throughput-based
    warranties before contract execution.
