  project_name: Large-Scale Battery Storage (portfolio)
  what_happened: The grid connection process for LSBS lacks visibility of other proposed
    projects, making it difficult for developers to evaluate network constraints at
    proposed connection points in early development stages, with AEMO unable to reflect
    the impact of proposed but not yet approved projects in system studies.
  lesson_learnt: LSBS developers should be aware that the absence of a transparency
    framework for proposed grid-connected projects means network constraint assessments
    in early development may be unreliable; developers should engage AEMO early in
    the connection process and monitor AEMC rule change outcomes (transparency of
    new projects, final determination expected October 2019) to understand how this
    will improve over time.
