  source_title: Large-Scale Battery Storage Knowledge Sharing Report
  publish_date: 2019-09
  project_name: Large-Scale Battery Storage (portfolio)
  what_happened: Several LSBS projects experienced higher than expected auxiliary
    power consumption and standby losses, indicating that balance of plant items such
    as battery container HVAC systems and their control systems were not optimised.
  lesson_learnt: LSBS project developers should model and validate auxiliary power
    consumption and standby losses for balance of plant — particularly container HVAC
    systems — as these have been higher than expected across multiple projects and
