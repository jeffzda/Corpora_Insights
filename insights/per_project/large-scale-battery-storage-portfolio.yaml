  source_title: Large-Scale Battery Storage Knowledge Sharing Report
  publish_date: 2019-09
  project_name: Large-Scale Battery Storage (portfolio)
  what_happened: The FCAS markets are small (210–220 MW for regulation; 350–450 MW
    for contingency) and a relatively small number of LSBS projects could quickly
    saturate FCAS supply markets; introduction of the Hornsdale Power Reserve has
    already significantly increased competition in the Regulation FCAS market and
    reduced pricing.
  lesson_learnt: LSBS business cases that are heavily dependent on FCAS revenue face
    material downside risk from market saturation as more batteries are deployed —
    developers should stress-test revenue models for FCAS price compression and diversify
    projected revenue streams accordingly, rather than assuming current FCAS prices
    will persist.
