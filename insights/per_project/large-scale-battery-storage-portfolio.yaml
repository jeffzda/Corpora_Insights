  project_name: Large-Scale Battery Storage (portfolio)
  what_happened: LSBS projects are currently required to register both as a generator
    and a load under the NER, creating complicated registration and participation
    arrangements and restricting the ability to dispatch batteries for functions such
    as firming of VRE dispatch to manage Causer Pays factors.
