  source_title: Large-Scale Battery Storage Knowledge Sharing Report
  publish_date: 2019-09
  project_name: Large-Scale Battery Storage (portfolio)
  what_happened: Batteries are typically designed with a nominal 10-year life, while
    wind and solar PV projects are typically developed over 20–25 year project lives,
    and not all battery suppliers adequately support extended warranty or life-extension
    options, weakening LSBS business cases compared to other renewable technologies.
  lesson_learnt: LSBS project developers should address battery life extension and
    replacement options explicitly in contracting before financial close — strategies
    including performance assessments at year 10, warranty extensions of up to 5 years
    subject to usage, and capacity maintenance agreements up to 20 years should be
    evaluated and negotiated with suppliers to improve long-term business case certainty.
