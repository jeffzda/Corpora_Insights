- record_id: ARENA-DLV-53870
  source_title: Demand Flexibility Portfolio Retrospective Analysis Report
  publish_date: 2023-07
  project_name: ARENA Demand Flexibility Portfolio — C&I Metering (AGL, EnergyAustralia,
    Flow Power, Enel X)
  what_happened: Multiple C&I demand flexibility projects reported that meter upgrades
    were complicated by the exclusive domain of Metering Data Providers (MDPs), with
    each customer having a different MDP requiring a multiplicity of relationships.
    Flow Power described MDP cooperation as a 'surprising barrier'; Enel X noted some
    installations moved slowly and finding the right contact person within an MDP
    could add weeks.
  lesson_learnt: C&I demand flexibility aggregators should map the MDPs across their
    prospective customer portfolios before program launch and establish direct working
    relationships with each MDP; fragmented MDP relationships are a material source
    of installation delay that can be predicted and partially mitigated through proactive
    relationship management.
