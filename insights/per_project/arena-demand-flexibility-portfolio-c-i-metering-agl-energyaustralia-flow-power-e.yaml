  evidence_excerpt: Flow Power observed that the cooperation of metering providers
    in upgrading meters – which is the 'exclusive domain' of the Metering Data Provider
    (MDP) – was a 'surprising barrier'. Different customers have different MDPs and
    therefore a multiplicity of relationships. Enel X also noted some installations
    were 'slower' than others and it could be hard finding the right person in the
    MDP adding weeks to installations.
