- record_id: ARENA-DLV-72252
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects - First Edition Results'
  publish_date: '2015'
  project_name: Grid Utility Support System (GUSS)
  what_happened: Ergon Energy trialled the Grid Utility Support System (GUSS) — a battery and inverter system charging overnight and discharging at peak — on its Single Wire Earth Return (SWER) network
    in the Atherton Tableland (AUD $982,000). The trial demonstrated effective peak demand reduction and both battery systems cycled daily consecutively for over one year, proving reliability.
  lesson_learnt: Battery storage deployed as a network asset on SWER and rural distribution networks can cost-effectively defer or replace expensive conventional augmentation (re-conductoring, voltage regulators)
    — network businesses with high-cost, low-utilisation rural assets should evaluate battery storage as an alternative to capital augmentation before committing to traditional upgrades.
