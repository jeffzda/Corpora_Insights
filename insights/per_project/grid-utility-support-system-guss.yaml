  evidence_excerpt: The trial has shown a clear effectiveness of GUSS to reduce the demand on the SWER by using battery storage. The capability to shift load from one time to another is a key step in unlocking
    the potential solution of energy storage for the network. Although there were issues through the trial, the battery technology and inverter system has shown to be reliable with both systems cycling
    daily consecutively for over 1 year.
