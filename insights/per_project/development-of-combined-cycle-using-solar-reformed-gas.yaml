  what_happened: Although the solar-hybrid combined cycle project did not proceed
    to deployment, the solar steam reformer design developed under the project was
    found to have transferable application to large-scale hydrogen production facilities
    and other high-temperature solar thermal processes, with a patented design technique
    progressing into separate follow-on projects.
  lesson_learnt: Novel solar thermal reactor designs developed for power generation
    applications may have higher-value near-term pathways in adjacent markets (hydrogen
    production, industrial processes); projects should assess cross-sector applicability
    of core IP to identify viable commercialisation routes when the primary application
    is not commercially ready.
