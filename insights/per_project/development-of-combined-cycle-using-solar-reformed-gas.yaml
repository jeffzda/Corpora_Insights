  what_happened: The estimated cost of the solar thermal system for a first-of-kind
    deployment in remote Western Australia was $948/kWt — more than double the cost-neutral
    benchmark of $400/kWt — with nearly half the cost attributable to the tower system,
    driven by the remote location limiting crane access.
  lesson_learnt: Remote site location can more than double solar thermal system costs
    relative to cost-neutral thresholds; tower construction costs in particular are
    highly sensitive to site accessibility, and crane access should be a primary site
    selection criterion for solar tower projects.
