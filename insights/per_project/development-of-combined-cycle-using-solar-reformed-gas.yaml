- record_id: ARENA-DLV-3251
  source_title: Development of Combined Cycle Using Solar Reformed Gas Final Report
  publish_date: 2014-05
  project_name: Development of Combined Cycle using Solar Reformed Gas in North Western
    Australia
  what_happened: The economic feasibility assessment found that adding a solar thermal
    steam reformer to a combined cycle power station increased LCOE by only 0.3% but
    delivered only 1.3% annual CO2 emissions reduction — far below expectations —
    because combustion system constraints (Wobbe index and NOx emission limits) capped
    the allowable solar fuel contribution.
  lesson_learnt: For solar-hybrid gas turbine projects, quantify combustion system
    fuel flexibility limits (Wobbe index, NOx thresholds) before committing to a solar
    integration design — these constraints can cap the emissions benefit to a level
    that undermines the project's core value proposition.
