- record_id: ARENA-DLV-3254
  source_title: Development of Combined Cycle Using Solar Reformed Gas Final Report
  publish_date: 2014-05
  project_name: Development of Combined Cycle using Solar Reformed Gas in North Western
    Australia
  what_happened: The market assessment conducted by GE Australia found that mining
    company customers — the primary target market for the North West Australian site
    — require proven, reliable technology for power generation as a critical non-core
    business input, and were unwilling to accept the increased complexity and risk
    of a novel solar-hybrid system.
  lesson_learnt: When targeting industrial customers (e.g. miners) as offtakers for
    novel energy technology, conduct a commercial readiness and customer risk-appetite
    assessment early in the project; customers whose core business depends on reliable
    power supply will not accept first-of-kind technology risk regardless of LCOE
    neutrality.
