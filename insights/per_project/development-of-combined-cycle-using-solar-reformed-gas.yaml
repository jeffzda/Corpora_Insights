- record_id: ARENA-DLV-3256
  source_title: Development of Combined Cycle Using Solar Reformed Gas Final Report
  publish_date: 2014-05
  project_name: Development of Combined Cycle using Solar Reformed Gas in North Western
    Australia
  what_happened: The solar thermal steam reformer design had to address four novel
    engineering challenges not present in conventional reformers — thermal cycling
    from intermittent operation, uneven tube wall heating, catalyst position and lifetime
    management, and exposure of reformer tubes to air at elevated temperatures — all
    of which added design complexity and risk.
  lesson_learnt: Solar thermal reformer designs must explicitly address intermittent
    operation challenges (thermal cycling, uneven heating, catalyst degradation, high-temperature
    air exposure) that do not arise in continuously operating conventional reformers;
    failure to design for these from the outset will result in significant rework
    during detailed engineering.
  issue_severity: moderate
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: CSIRO developed a new receiver/reactor design specifically for
    this application, taking into account the solar flux density and intermittent
    operating profile of the site.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar thermal
  source_pages: &id006
  - 5
  evidence_excerpt: 'The project addressed a number of challenges in building a solar
    thermal reformer which can be attributed to the following major novel differences
    for this solar reformer compared to a conventional reformer. These are: 1. Thermal
    cycling caused by intermittent daily operation as opposed to continuous around
    the clock operation; 2. Uneven tube wall heating; 3. Catalyst position and lifetime;
    and 4. The reformer tubes are exposed to air at elevated temperatures.'
