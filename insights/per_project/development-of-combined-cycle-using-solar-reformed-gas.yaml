- record_id: ARENA-DLV-3255
  source_title: Development of Combined Cycle Using Solar Reformed Gas Final Report
  publish_date: 2014-05
  project_name: Development of Combined Cycle using Solar Reformed Gas in North Western
    Australia
  what_happened: The absence of a solarised gas storage system meant the combined
    cycle could only utilise solar-derived fuel during daylight hours, limiting annual
    CO2 abatement and making the solar contribution insufficient to justify the capital
    cost and complexity of the solar field and reactor.
  lesson_learnt: Solar thermochemical integration with gas turbines requires co-designed
    fuel storage (e.g. a pressurised SOLARGAS vessel) to enable continuous combustion
    of solar-derived fuel; without storage, solar contribution is limited to daylight
    hours and the emissions and economic benefits are insufficient to warrant the
    system's capital cost.
