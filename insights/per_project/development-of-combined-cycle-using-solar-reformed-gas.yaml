- record_id: ARENA-DLV-3252
  source_title: Development of Combined Cycle Using Solar Reformed Gas Final Report
  publish_date: 2014-05
  project_name: Development of Combined Cycle using Solar Reformed Gas in North Western
    Australia
  what_happened: The technology scale-up from a 600 kW demonstrated reformer to a
    15 MW design for power generation was assessed as too large a single step, introducing
    unacceptable risk for a power generation application and preventing progression
    to the next stage.
  lesson_learnt: Solar thermochemical scale-up must proceed in staged increments —
    jumping from 600 kW to 15 MW in a single step was assessed as beyond acceptable
    risk thresholds for a power generation customer; intermediate demonstration scale
    steps should be planned before targeting commercial power generation integration.
