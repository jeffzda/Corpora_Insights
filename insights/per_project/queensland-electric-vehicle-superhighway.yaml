- record_id: ARENA-DLV-16856
  source_title: 'The State of Electric Vehicles in Australia – Second Report: Driving Momentum in Electric Mobility'
  publish_date: 2018-06
  project_name: Queensland Electric Vehicle Superhighway
  what_happened: The Queensland Government's Electric Vehicle Superhighway initiative rolled out 17 DC fast chargers between Coolangatta and Cairns, increasing Queensland's total DC fast charger count from
    5 in 2017 to 24 in 2018 — the most significant state-level infrastructure deployment in the reporting period.
  lesson_learnt: Coordinated government-funded corridor charging programs can rapidly multiply DC fast-charging coverage — Queensland's Superhighway demonstrates that targeted corridor investment, rather
    than dispersed urban-only deployment, can deliver step-change increases in practical long-distance EV viability.
