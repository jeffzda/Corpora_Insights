- record_id: ARENA-DLV-1306
  source_title: ARENA Insights Forum Presentation Summaries & Key Points – Large-Scale
    Projects Stream
  publish_date: '2019-06-25'
  project_name: Pumped Hydro Energy Storage (Generic/PHES Pipeline)
  what_happened: Long construction times and high capital costs of pumped hydro energy
    storage (PHES) projects, combined with uncertainty about what the electricity
    market would look like upon project completion, made it extremely difficult to
    construct a bankable business model or pursue a merchant revenue strategy.
  lesson_learnt: PHES projects face a structural bankability challenge due to the
    mismatch between long construction lead times and market uncertainty — project
    developers should model a range of market scenarios at project sanction and consider
    whether a contracted revenue stream (e.g. PPA or capacity agreement) is necessary
    to secure financing.
