- record_id: ARENA-DLV-72254
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects - First Edition Results'
  publish_date: '2015'
  project_name: Hervey Bay Hospital Solar
  what_happened: Queensland Health installed a 265kW roof-mounted solar PV system at Hervey Bay Hospital (AUD 1.3M), one of Australia's first large rooftop commercial-scale solar installations. The local
    utility Ergon Energy was consulted during the design phase, enabling grid protection requirements to be met without post-design rework.
  lesson_learnt: Engaging the local distribution network business during the design phase of commercial rooftop solar installations — rather than after design is finalised — reduces connection timeframes
    and costs by ensuring grid protection measures are agreed upfront and avoiding redesign.
