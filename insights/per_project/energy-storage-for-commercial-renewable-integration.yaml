  what_happened: The Milestone 3 technology review identified fire risk as the primary
    constructability and operability concern for battery storage in an Australian
    context, noting that some battery installations (particularly Li-ion) had experienced
    fires and that bushfire hazard at the chosen site location added a further layer
    of risk requiring a comprehensive fire protection system.
  lesson_learnt: For battery storage projects sited in bushfire-prone regions of Australia,
    fire risk must be assessed at site selection stage and a comprehensive fire protection
    system — including suppression technology appropriate to the battery chemistry
    — must be designed in from the outset; retrofitting fire protection after technology
    selection and site finalisation is significantly more costly.
