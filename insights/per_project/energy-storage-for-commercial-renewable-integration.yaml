    spot rate was 0.71 USD/AUD, and the Consortium flagged that FX movements over
    the delivery and construction period could materially affect project costs.
  lesson_learnt: For grid-scale battery storage projects where the majority of equipment
    is imported, include a foreign exchange hedging strategy as a mandatory element
    of financial close planning — denominating capital cost estimates in AUD at the
    spot rate without hedging transfers substantial currency risk to the project and
    can erode the business case if the AUD depreciates during the EPC delivery period.
