  project_name: Energy Storage for Renewable Integration South Australia (ESCRI-SA)
  what_happened: The Phase 1 business case for a 10 MW / 20 MWh grid-scale battery
    storage asset at Dalrymple substation on the Yorke Peninsula, South Australia,
    returned a significantly negative NPV across all scenarios, with a post-tax NPV
    of approximately -$14.8 million and a funding shortfall of approximately 63% of
    capital, requiring substantial additional funding to proceed.
  lesson_learnt: Before committing to a utility-scale grid storage project, validate
    that the revenue stack from energy trading, MLF improvement, unserved energy,
    and ancillary services can jointly close the business case under realistic market
    conditions — a negative NPV at Phase 1 indicates fundamental commercial viability
    issues that scaling down the asset or revisiting market assumptions may not resolve
    without structural changes.
