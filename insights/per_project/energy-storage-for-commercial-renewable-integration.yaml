  what_happened: The Consortium concluded that battery storage technology was globally
    immature at utility scale as of 2015, with the technology forward cost curve highly
    uncertain, limited third-party data on realistic cost trajectories, and vendor
    pricing showing very wide spread (per prior RFI findings). The business case was
    therefore presented with a scenario showing a 50% capital cost reduction as the
    primary pathway to commercial viability.
  lesson_learnt: For first-of-a-kind utility-scale storage projects, the technology
    forward cost curve should be explicitly modelled as a key scenario variable —
    a 50% capital cost reduction over 5 years was considered plausible based on RFI
    respondent views, and projects that are unviable today may become viable within
    a single regulatory investment cycle.
