  what_happened: The site selection benefit quantification explicitly deferred consideration
    of the interplay, hierarchy, and mutual exclusivity of benefit classes — for example,
    when an ESD is contracted as a non-network solution, its availability during constraint
    events prevents simultaneous participation in energy or FCAS markets. Co-optimisation
    of benefit classes was also deferred to the business case stage.
  lesson_learnt: Storage project business cases that stack multiple revenue streams
    must explicitly model the mutual exclusivity and hierarchy of benefit classes
    — contracted network support obligations will constrain availability for market
    participation precisely at the highest-value times. Failing to model this at the
    site selection stage can produce materially overstated total benefit estimates.
