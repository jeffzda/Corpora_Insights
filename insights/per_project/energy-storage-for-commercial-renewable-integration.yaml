  what_happened: The Milestone 3 technology review noted that FCAS revenue for a storage
    device is only recoverable when the unit is online at a specific power level,
    meaning that devices with limited storage capacity are more likely to be dispatch-constrained
    and therefore generate less FCAS revenue — simulated FCAS revenue per MW of device
    rating ranged from $300/MW/year (1-hour storage) to $1,700/MW/year (20-hour storage).
  lesson_learnt: FCAS revenue for grid-scale storage is strongly dependent on storage
    duration — devices with short storage ratios are frequently dispatch-constrained
    and unable to participate in the FCAS market, so short-duration assets should
    not be assumed to capture significant FCAS revenue in business case modelling.
