- record_id: ARENA-DLV-72629
  source_title: Energy Storage for Renewable Integration South Australia (ESCRI) -
    General Project Report Phase 1
  publish_date: 2015-08
  project_name: Energy Storage for Commercial Renewable Integration South Australia
    (ESCRI-SA)
  what_happened: The TNSP ring-fencing guidelines and TNSP ownership constraints meant
    that ElectraNet's ability to own and operate the ESD commercially was severely
    restricted, requiring a complex shared-ownership structure with AGL as the commercial
    operator. The regulatory framework also did not provide a clear non-discriminatory
    registration pathway for a device acting simultaneously as a generator, load,
    and ancillary service provider.
  lesson_learnt: Where a TNSP is intended to play a role in grid-scale storage ownership
    or operation, verify early whether ring-fencing arrangements permit mixed network
    and market functions — if they do not, either advocate for regulatory change before
    financial close or structure the asset ownership so that commercial and network
    functions are separated between distinct legal entities.
  issue_severity: major
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: approvals/contracting
  proponent_type: network business
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: coordination & stakeholders
  intervention_note: The Consortium engaged with the AER and the AEMC to flag the
    issue; the AEMC signalled a likely review of ring-fencing arrangements, and the
    Consortium structured its recommended commercial framework to place the TNSP as
    owner and operator while the Generator/Retailer holds dispatch rights, separating
    functions within a contractual structure.
  transferability: moderate
