  what_happened: The technology state-of-the-art review found that chemical energy
    storage systems (BES and FBES) typically have low cycling capacities due to chemical
    deterioration, with most technologies limited to fewer than 5,000 useful cycles
    — creating significant lifecycle replacement cost implications for business case
    modelling over a 20-year asset life.
  lesson_learnt: Business cases for battery and flow battery storage must explicitly
    model replacement and maintenance costs arising from limited cycling capacity
    — systems with low cycle life will incur material additional capital expenditure
    mid-asset-life that can substantially alter project economics if not modelled
    from the outset.
