    party provider with TNSP purchasing dispatch rights on short-term contracts),
    the likelihood of the TNSP seeking short-term contracts shorter than the asset
    life would make financing the ESD more difficult for the 3rd party, particularly
    if additional energy trading revenues could not be generated.
  lesson_learnt: Third-party-owned grid storage assets relying on TNSP network support
    payments face a structural financing mismatch — TNSPs tend to prefer short-term
    contracts while project debt requires long-term revenue certainty; developers
    should either secure a long-term network support agreement or demonstrate sufficient
    standalone energy trading revenues to service project debt without TNSP contract
    certainty.
