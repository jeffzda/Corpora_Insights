  what_happened: The Consortium identified that recent capacity withdrawal announcements
    (Pelican Point, Torrens Island Power Station A, Northern Power Station) had been
    premised on historical pool price samples prior to the announcements, and that
    these withdrawals would increase pool price volatility and cap trading revenue
    — but also reduce the market value associated with both the market energy trading
    and cap trading strategy if generators continued to supply.
  lesson_learnt: Business cases for grid-scale storage in high-renewable markets should
    model scenarios involving capacity withdrawal by conventional generators, as this
    can simultaneously increase revenue upside (higher volatility) and risk (reduced
    despatchable capacity increasing system security costs), requiring careful scenario
    analysis rather than a single base case.
