  what_happened: The Consortium's commercial framework analysis identified four possible
    ownership and operating models for the ESD, and concluded that the mixed network-and-market
    benefit model (Framework 4) potentially represented the most economically and
    commercially viable option but would also require the most complex commercial
    framework, with unresolved questions around dispatch rights allocation, TNSP ring-fencing
    compliance, and the appropriate valuation mechanism for residual capacity.
  lesson_learnt: For grid-scale storage assets seeking to monetise both network support
    and energy trading simultaneously, the commercial framework design is at least
    as technically challenging as the engineering design — the interplay between TNSP
    ring-fencing rules, dispatch rights allocation, and RAB treatment of trading revenue
    must be resolved before commercial close and cannot be left to post-construction
    negotiation.
