  secondary_failure_mode: regulatory & approvals
  intervention_note: The Consortium included frequency control ancillary services
    (FCAS) as a revenue stream in the business case and advocated for regulatory reform
    to allow ESDs to be compensated for system security services; this contributed
    to the AEMC's subsequent work on the regulatory implications of storage integration.
