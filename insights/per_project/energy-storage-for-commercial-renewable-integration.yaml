  lesson_learnt: MLF impact of storage operation can be negative at some locations
    — particularly where the device's charge/discharge pattern worsens rather than
    improves the local loss factor. Business cases should model MLF impact explicitly
    at the intended connection point, as a negative MLF effect can meaningfully erode
    arbitrage revenue and should not be assumed to be neutral or positive.
