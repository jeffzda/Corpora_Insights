  what_happened: Benefit quantification modelling found that arbitrage revenue scales
    proportionally with the MLF at the connection point, meaning remote sites with
    low MLFs (such as Port Lincoln and Dalrymple, both below unity) are structurally
    disadvantaged relative to load-centre locations like Monash for capturing energy
    trading value.
  lesson_learnt: When siting a grid-scale storage asset for arbitrage revenue, prioritise
    connection points with high MLFs (typically near load centres and remote from
    generation sources) — remote transmission sites with low MLFs impose a persistent
    revenue penalty that cannot be overcome by dispatch optimisation alone.
