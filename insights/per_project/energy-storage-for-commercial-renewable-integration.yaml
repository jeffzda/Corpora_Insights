  what_happened: The Consortium identified that increased rooftop solar PV penetration
    on the Yorke Peninsula — particularly on the 132 kV Dalrymple line network — could
    create occasions where a combination of high PV output and low demand would cause
    high voltages on the 132 kV network, providing additional potential value for
    the ESD through voltage management. However, this benefit was difficult to quantify
    and was not included in the business case.
  lesson_learnt: As rooftop solar PV penetration increases on radial transmission
    networks, voltage management value for co-located storage grows — developers of
    storage projects in high-solar-penetration areas should engage the TNSP to assess
    whether voltage support revenue or regulatory asset base contributions are available
    as the penetration trajectory becomes clearer.
