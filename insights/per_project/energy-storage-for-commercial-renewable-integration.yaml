    to the ESD was estimated at only $360k NPV real FY16, contributing approximately
    4% of total revenue. Historical outage analysis showed Dalrymple experienced 22
    outages per year averaging 3.5 hours, but the ESD was estimated to be able to
    supply load only during outages when its state of charge was sufficient — resulting
    in a modest and non-cash benefit.
  lesson_learnt: Expected unserved energy benefits for grid-scale storage at radial
    network endpoints are real but modest, non-cash, and dependent heavily on state
    of charge at the time of outage — they should not be relied upon as a primary
    revenue stream in business cases, but should be included as a network benefit
    metric when negotiating regulatory revenue arrangements.
