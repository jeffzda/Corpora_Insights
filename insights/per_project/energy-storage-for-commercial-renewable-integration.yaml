  - 32
  evidence_excerpt: AEMO confirmed that it understands that the current registration
    and rules framework for pumped hydro storage would be applicable to ESDs. However,
    the dual marginal loss factor application for ESDs is likely to depend on the
    size of the device. AEMO said it would be very likely to categorise ESDs as a
    generator rather than a load, which means that ESDs would not be charged transmission
    use of system charges, but could be charged distribution use of system charges
    if distribution connected.
