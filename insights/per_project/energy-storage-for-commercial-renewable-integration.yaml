- record_id: ARENA-DLV-72607
  source_title: Energy Storage for Renewable Integration South Australia (ESCRI) -
    General Project Report Phase 1
  publish_date: 2015-12
  project_name: Energy Storage for Renewable Integration South Australia (ESCRI-SA)
  what_happened: The Consortium found that grid-scale non-hydro energy storage devices
    had no clear or non-discriminatory regulatory registration pathway under the NEM,
    with registration category (generator vs. load vs. market network service provider)
    depending on device size and operational mode in ways that were not defined in
    the market rules, creating material commercial and legal uncertainty.
  lesson_learnt: Clarify the regulatory registration classification for any novel
    grid-scale storage asset with AEMO before finalising the commercial structure
    — the NEM registration framework was designed for conventional generation and
    load, and novel storage assets will face ambiguous dual classification that affects
    system use of service charges, ancillary service eligibility, and dispatch obligations.
  issue_severity: major
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: network business
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: The Consortium held direct meetings with AEMC, AER, and AEMO;
    the AEMC subsequently signalled a review of transmission ring-fencing arrangements
    and the regulatory treatment of storage, and the Consortium provided formal input
    to the AEMC's project on regulatory implications of storage integration into the
    NEM.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages:
