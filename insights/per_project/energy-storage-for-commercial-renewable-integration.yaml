  source_title: Energy Storage for Renewable Integration South Australia (ESCRI) -
    General Project Report Phase 1
  publish_date: 2015-12
  project_name: Energy Storage for Renewable Integration South Australia (ESCRI-SA)
  what_happened: South Australia's electricity system had among the world's highest
    penetration of intermittent wind and solar PV generation (average wind penetration
    close to 35% of NEM-connected system demand at end of 2014, with instances exceeding
    100% of instantaneous system demand), combined with announcements of closure or
    mothballing of 1,505 MW of synchronous coal and gas generation, creating acute
    system security and frequency control challenges that were not adequately addressed
    by market or regulatory frameworks at the time.
  lesson_learnt: Grid-scale storage projects in high-renewable-penetration systems
    should explicitly scope and quantify the value of system security services (inertia,
    frequency control, black start) as a distinct revenue stream — these services
    are increasingly valuable as synchronous generation retires, and failing to include
    them in the business case will understate the asset's contribution to the power
    system and may result in a viable project appearing unviable.
