  what_happened: The Consortium identified that the complexity of designing an ESD
    for island mode operation at Dalrymple — including integrating with a 33 kV network
    supplying 11 kV feeders over 100 km with SWER lines, managing fault detection
    on extremities, and co-ordinating with Wattle Point Wind Farm — significantly
    increased the technical scope and estimated cost of the total ESD installation.
  lesson_learnt: Island mode capability for a grid-scale storage device on a radial
    distribution network requires substantial additional technical investment in protection
    systems, control coordination with co-located wind generation, and fault detection
    — this complexity should be scoped and costed explicitly before finalising the
    ESD specification, as it can materially increase capital requirements.
