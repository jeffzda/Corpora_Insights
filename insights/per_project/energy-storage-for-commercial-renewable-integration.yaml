  what_happened: The Consortium found that the commercial viability of a grid-scale
    storage project was strongly influenced by the interaction between multiple revenue
    streams (energy trading, MLF improvement, unserved energy, ancillary services,
    network augmentation deferral) and that these streams were highly interdependent;
    optimising one stream could conflict with another, and the interdependency was
    not well understood at the outset.
