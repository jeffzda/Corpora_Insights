    National Electricity Rules, which prescribe how the device would operate and interact
    with the market and the network to which it is connected. However, within this
    governing construct, this regulatory review reveals that there are a number of
    choices to be made regarding ownership and registration... potential limitations
    on the ability of a transmission network operator (TNSP) to receive revenue from
    energy sales.
