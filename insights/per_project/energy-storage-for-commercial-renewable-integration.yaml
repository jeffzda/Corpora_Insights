  what_happened: The Marginal Loss Factor (MLF) at Dalrymple was found to be approximately
    0.87 — significantly below unity — due to the weak radial network connection,
    meaning the ESD's effective energy yield and revenue were materially reduced compared
    to a well-connected site. The MLF benefit from co-locating storage with Wattle
    Point Wind Farm was estimated at only +0.5% improvement, providing minimal incremental
    value.
  lesson_learnt: Site selection for grid-scale storage should explicitly account for
    MLF at the connection point — a poor MLF (e.g. 0.87 on a weak radial network)
    materially erodes revenue across all market trading strategies and should be quantified
    early in the business case.
