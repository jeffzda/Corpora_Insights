  what_happened: The Request for Information (RFI) process, conducted with 42 international
    entities and resulting in 17 formal submissions, revealed that no project could
    be made NPV positive under current market circumstances, that respondent pricing
    varied significantly, and that several respondents could not adequately demonstrate
    compliance with delivery and performance standards in Australia — with energy
    storage supplier experience in Australia found to be extremely limited.
  lesson_learnt: Use a formal RFI process before commercial close for first-of-type
    grid storage projects to establish realistic cost ranges, technology maturity,
    and supplier capability in the local context — RFI results will reveal whether
    a business case is commercially viable before committing to procurement and will
    surface key technology and delivery risks that public-domain data cannot capture.
