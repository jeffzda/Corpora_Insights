  what_happened: The Milestone 2 site selection report explicitly deferred assessment
    of losses in the ESD (a 20% loss figure was assumed in arbitrage simulations only)
    and did not consider the interplay or mutual exclusivity of benefit streams —
    the report identified these as items requiring resolution before final site selection
    and business case could be completed.
  lesson_learnt: Business case modelling for multi-service storage assets must account
    for round-trip losses and the mutual exclusivity of competing dispatch objectives
    (e.g. arbitrage vs. MLF optimisation vs. FCAS) before committing to a site and
    size — deferring these interactions to a later stage risks significant revision
    of revenue forecasts.
