  what_happened: The RFI Specification made it a mandatory requirement that contractors
    provide a mathematical model of the ESD in a format compatible with AEMO's PSS/E
    transmission modelling software, covering all expected device functionality —
    this was identified as necessary for AEMO to assess device behaviour under system
    transient conditions as part of the connection approval process.
  lesson_learnt: Grid-scale storage projects connecting to the transmission network
    should require PSS/E-compatible dynamic models from technology vendors as a mandatory
    tender deliverable — absence of an acceptable AEMO-compatible model is a potential
    connection approval blocker that vendors are best placed to address before contract
    award rather than after.
