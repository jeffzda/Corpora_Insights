  what_happened: The Milestone 3 technology review found that chemical energy storage
    systems (static and flow batteries) typically need replacement after a relatively
    low number of charge-discharge cycles due to chemical deterioration, and that
    depth of discharge and overcharging can significantly decrease useful life — factors
    identified as requiring explicit modelling in the business case.
  lesson_learnt: Battery storage business cases must explicitly model the impact of
    the intended dispatch strategy on cycle life — depth of discharge, overcharging,
    and cycling frequency all materially affect replacement cost and total lifecycle
    economics, and these interactions should be quantified before finalising equipment
    procurement decisions.
