  what_happened: The Consortium identified that wind generation curtailment (spilling)
    at Wattle Point Wind Farm, caused by network constraints on the 132 kV Dalrymple
    line and AEMO dispatch limits, provided a potential additional revenue stream
    for the ESD through storing otherwise-curtailed energy — but that this benefit
    was difficult to quantify because curtailment data was not readily available and
    the AEMO/ElectraNet dispatch signals may not provide the ESD with sufficient advance
    notice.
  lesson_learnt: The value of avoided wind curtailment as a storage revenue stream
    requires access to granular SCADA and NGM dispatch data from the network operator
    and AEMO — project developers should negotiate data access agreements with the
    TNSP and AEMO early, as curtailment benefits can be material but are unquantifiable
    without operational data.
