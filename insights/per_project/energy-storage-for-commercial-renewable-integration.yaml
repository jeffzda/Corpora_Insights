  what_happened: The RFI Specification identified that the ESD operational algorithm
    would be a critical component for achieving business case metrics, and explicitly
    required that the algorithm be updatable by the operator — noting that significant
    algorithmic changes were likely as electricity markets evolved and ESD service
    value shifted over the asset's 20-year life.
