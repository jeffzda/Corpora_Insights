  what_happened: The Consortium concluded that a frequency control ancillary services
    (FCAS) contribution from the ESD could be valuable in South Australia given increasing
    renewable penetration, but that the ability to provide FCAS as a synthetic inertia
    source was not yet commercially proven for battery storage and that the ESD would
    need to be able to respond to high and low frequency events using an inverter-based
    control system — a technical requirement that was sought but not confirmed during
    the RFI process.
  lesson_learnt: FCAS capability for battery storage systems should be confirmed as
    a firm technical deliverable during the RFI/procurement process, including specifying
    the required response time, capacity and control system interface — the value
    of this revenue stream is increasing in high-renewable markets and the technical
    specification must be locked down before vendor selection.
