  what_happened: The two-stage site screening process assessed all 88 ElectraNet transmission
    substations and identified that the highest-ranked sites were concentrated on
    the Eyre Peninsula (Port Lincoln Terminal), Yorke Peninsula (Dalrymple), and Riverland
    (Monash) — in each case driven by the combination of radial network topology,
    existing wind farm co-location, and network augmentation deferral value rather
    than market energy trading opportunity alone.
  lesson_learnt: Structure grid-scale storage site selection as a two-stage screening
    process — first apply network and revenue category scoring to all candidate substations
    to produce a shortlist, then apply detailed benefit quantification and connection
    cost analysis to the shortlist — to manage complexity and avoid premature commitment
    to a single site before key technical and commercial unknowns are resolved.
