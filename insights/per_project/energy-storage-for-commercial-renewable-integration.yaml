  what_happened: Modelling found that arbitrage revenue follows a strong law of diminishing
    returns beyond a storage-to-rating ratio of approximately 20 (i.e., ~20 hours
    of storage capacity), because most pool price variation occurs on a 24-hour cycle,
    meaning additional storage capacity beyond that threshold adds little incremental
    revenue.
  lesson_learnt: Size storage duration for arbitrage applications at no more than
    roughly 20 hours of rated capacity — beyond this threshold, incremental revenue
    gains diminish sharply and additional capital expenditure on storage is unlikely
    to be recovered through price arbitrage alone.
