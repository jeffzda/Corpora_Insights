  what_happened: 'Price arbitrage revenue modelling showed a strong non-linear relationship
    between storage duration and annual revenue per MW: a 1-hour device generated
    approximately $5k/MW/year, a 5-hour device $25k/MW/year, a 10-hour device $48k/MW/year,
    and a 25-hour device approximately $99k/MW/year before flattening — demonstrating
    that revenue per MW increases substantially with energy-to-power ratio up to approximately
    25 hours of storage.'
  lesson_learnt: Arbitrage revenue per MW of storage capacity increases substantially
    with energy-to-power ratio up to approximately 25 hours of storage, after which
    marginal gains diminish. Business cases for arbitrage-oriented storage should
    model a range of duration assumptions — a 1-hour device captures only ~5% of the
    revenue available to a 25-hour device of the same power rating in the SA market.
