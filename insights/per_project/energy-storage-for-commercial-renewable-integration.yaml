  what_happened: The ESCRI project identified that any inverter-connected battery
    system — including grid-scale BESS — must carefully manage system strength constraints,
    with grid-forming inverters and connection to stronger network nodes identified
    as the key technical mitigations.
  lesson_learnt: Grid-scale battery projects should connect to stronger parts of the
    network where possible and specify grid-forming inverters capable of operating
    at lower system strength levels — failure to address system strength at the design
    stage creates technical and regulatory risk that is difficult to resolve post-installation.
