  what_happened: The mathematical modelling work found that energy trading (time-shifting)
    was the dominant revenue stream but was insufficient on its own to produce a positive
    NPV; network support value was difficult to quantify due to unknown service requirements;
    and ancillary services revenue, while potentially valuable, was not sufficiently
    high to bridge the funding gap in early model runs.
  lesson_learnt: When developing a business case for grid-scale storage, build a purpose-designed
    mathematical model that can test all revenue streams — energy trading, MLF improvement,
    unserved energy reduction, and ancillary services — simultaneously under historical
    market conditions, because reliance on any single revenue stream will not produce
    a viable case and the interactions between streams are complex and non-additive.
