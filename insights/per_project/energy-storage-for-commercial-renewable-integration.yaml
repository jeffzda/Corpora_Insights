  what_happened: The regulatory analysis confirmed that an ESD registered as both
    a market generator and an ancillary service generator is technically only capable
    of either generating energy or providing FCAS at any given time — not both simultaneously
    — meaning the device must choose at each interval which market offers the greatest
    revenue, and contractual commitments to NSCAS or SRAS would preclude spot market
    or FCAS participation during those contracted periods.
  lesson_learnt: 'Multi-service storage business cases must account for the mutual
    exclusivity of simultaneous revenue streams: contractual commitments to non-market
    ancillary services (NSCAS/SRAS) will lock out spot market and FCAS participation,
    and the ESD can only optimise one revenue stream per dispatch interval. Revenue
    stacking assumptions that ignore this will overstate project economics.'
