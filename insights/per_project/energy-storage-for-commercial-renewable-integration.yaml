  what_happened: The Milestone 3 technology review concluded that battery and flow
    battery technologies provided the best fit to the ESCRI-SA project requirements,
    while pumped hydro and large-scale CAES were problematic because they require
    favourable site conditions not necessarily available at existing substations or
    wind farm sites.
  lesson_learnt: For grid-scale storage projects targeting existing substation or
    wind farm sites, pumped hydro and large-scale CAES should be screened out early
    in technology selection — their dependence on favourable topography makes them
    incompatible with substation-sited deployment even if they offer cost advantages
    at greenfield locations.
