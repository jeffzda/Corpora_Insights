  what_happened: Site selection for the ESD was limited to existing ElectraNet and
    AGL-owned land in order to minimise project development risks including land acquisition,
    statutory approvals, and native vegetation obligations. This meant potentially
    high-value distribution network sites (e.g. Kangaroo Island, Victor Harbor, Fleurieu
    Peninsula) and privately-owned wind farm sites were excluded from detailed consideration.
  lesson_learnt: Restricting storage siting to land already owned by consortium members
    significantly reduces development risk and approval complexity; however, it may
    exclude the highest-value locations. Projects should explicitly acknowledge this
    trade-off and document excluded high-value sites for future reference, rather
    than treating the analysis as exhaustive.
