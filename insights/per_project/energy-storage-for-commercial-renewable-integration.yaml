  what_happened: The regulatory analysis found that an ESD registered as a market
    generator is exempt from Transmission Use of System (TUOS) charges, but if registered
    off-market or as an exempt generator, TUOS charges would apply — creating a direct
    financial incentive to pursue market generator registration even where off-market
    operation might otherwise be preferred.
  lesson_learnt: ESD proponents should pursue market generator registration to avoid
    TUOS charges; off-market or exempt registration pathways attract TUOS and may
    materially reduce project economics. Seeking a Rule clarification that permanently
    exempts all ESDs from TUOS — regardless of registration pathway — is worth pursuing.
