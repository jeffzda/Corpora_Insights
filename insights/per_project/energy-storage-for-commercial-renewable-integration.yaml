  what_happened: The Milestone 2 benefit quantification found that the Murraylink
    interconnector constraint reduction benefit — which appeared historically significant
    ($3–8M per annum in 2013–14) — was expected to fall to near zero following planned
    AEMO and ElectraNet network augmentation projects, reducing the case for an ESD
    at Monash on this basis.
  lesson_learnt: Interconnector constraint relief is a volatile revenue source for
    grid-scale storage — planned network augmentation by AEMO or TNSPs can eliminate
    the benefit entirely, and storage business cases should model the post-augmentation
    residual value rather than using historical constrained-hours data as a proxy
    for future revenue.
