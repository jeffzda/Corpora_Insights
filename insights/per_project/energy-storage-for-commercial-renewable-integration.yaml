  what_happened: The cap trading revenue (selling $300/MWh cap derivatives) was modelled
    as the primary value driver for the ESD, but the implied volatility capture varied
    significantly year to year (from 14% to 89% across back-tested years), and a liquidity
    discount of 20% was required due to low liquidity in the forward cap market at
    the $12/MWh strike.
  lesson_learnt: Cap trading strategies for grid-scale storage are highly sensitive
    to market liquidity and annual volatility variation; a conservative volatility
    capture assumption and liquidity discount should be applied in business case modelling,
    and the feasibility of actually trading the required derivative volumes should
    be verified before committing to the strategy.
