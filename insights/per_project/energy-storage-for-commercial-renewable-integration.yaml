    hours of stored energy with minimal self-discharge, short-duration technologies
    (supercapacitors, SMES, flywheels) can be eliminated early in the technology selection
    process — retaining only battery, flow battery, pumped hydro, and large-scale
    CAES for detailed evaluation reduces wasted analysis effort.
