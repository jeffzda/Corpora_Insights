  evidence_excerpt: Chemical energy storage systems – BES and FBES typically need
    to be replaced after a relatively low number of charge and discharge cycles due
    to chemical deterioration with accumulated operating time. The number of useful
    cycles of these technologies are typically less than 5 000 with the exception
    of reported cycling times of Li ion (1 000 – 20,000), VRB (12,000 +) and Hydrogen
    fuel cells (20,000 +). Lifetime and cycling time have an impact on the overall
    investment cost of the energy storage system. Systems with low lifetime and cycling
    times increase the overall costs due to maintenance and replacement of equipment.
    These effects need to be carefully modelled when developing a business case for
    a storage installation.
