  project_name: ANU – Solar Hydrogen Generation
  what_happened: The ANU tandem silicon-perovskite solar cell project demonstrated 20% solar-to-hydrogen efficiency and is transitioning to prototype development for pilot-scale demonstration, representing
    a successful laboratory-to-prototype pathway but with further development required before commercialisation.
  lesson_learnt: Silicon-perovskite tandem cell architectures offer a viable pathway to 20%+ solar-to-hydrogen efficiency using nickel-based catalysts; projects targeting this technology should plan for
    a prototype development phase with a defined scale (e.g. 10 tonnes/day) as the basis for techno-economic optimisation.
