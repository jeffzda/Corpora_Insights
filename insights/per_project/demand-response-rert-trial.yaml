- record_id: ARENA-DLV-17907
  source_title: Demand Response RERT Trial Year 1 Report
  publish_date: 2019-03
  project_name: Demand Response RERT Trial
  what_happened: The 60-minute notification portfolio did not meet aggregate contracted
    DR volume in either Period 1 or Period 2 tests, largely because the residential
    sector — which comprises a much larger share of the 60-minute portfolio — under-delivered
    its contracted level of DR in both test periods.
  lesson_learnt: Residential load portfolios should not be the primary capacity source
    for 60-minute notification DR programs — residential DR is inherently variable
    and behavioural, and programs relying on residential customers for a large share
    of volume should over-recruit substantially relative to contracted capacity.
