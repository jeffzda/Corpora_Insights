  what_happened: United Energy deployed voltage reduction across its 47 zone substations
    as a DR mechanism, using smart meter data to ensure voltage at customer connection
    points remained above minimum standards during reduction events — an approach
    that prevented equipment damage risks associated with unmonitored voltage reduction.
  lesson_learnt: Network-level voltage reduction as a DR mechanism is technically
    viable at scale when paired with smart meter monitoring at customer connection
    points — this capability enables network businesses to safely provide emergency
    DR without risk of under-voltage damage to customer equipment.
