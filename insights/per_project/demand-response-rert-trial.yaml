  source_title: ARENA Insights Forum Presentation Summaries & Key Points – DER Stream
  publish_date: 2019-06
  project_name: Demand Response RERT Trial
  what_happened: C&I participants in the RERT trial were found to require little additional
    incentive to participate in DR programs where a strong existing business case
    existed, but each participant had unique operating environments that determined
    if, how, and when they could participate in activations.
  lesson_learnt: Tailor DR participation structures for each C&I customer's unique
    operational context — a strong business case reduces the need for incentives,
    but rigid activation requirements will exclude C&I participants whose operations
    cannot accommodate uniform response protocols.
