- record_id: ARENA-DLV-17901
  source_title: Demand Response RERT Trial Year 1 Report
  publish_date: 2019-03
  project_name: Demand Response RERT Trial
  what_happened: The CAISO 10 of 10 baseline methodology was found to be problematic
    early in Period 1 for certain load types — particularly facilities with PV systems
    or loads whose shape changes significantly on hot days — causing potential over-
    or under-statement of actual demand response delivered.
  lesson_learnt: Validate baseline methodology applicability for each load type before
    program commencement — loads with PV systems or strongly temperature-dependent
    profiles require an alternative or adjusted baseline approach, as the standard
    10 of 10 methodology can materially misstate DR delivered.
