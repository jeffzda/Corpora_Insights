  what_happened: South Australia and Victoria failed to meet contracted DR volumes
    in the Period 2 tests while NSW exceeded contracted volumes in both periods, with
    the difference attributed to NSW having a higher proportion of industrial load
    — which is a more consistent DR source than residential or commercial loads.
  lesson_learnt: Portfolio composition is a primary driver of DR delivery reliability
    across jurisdictions — programs targeting grid reliability should prioritise industrial
    load where possible, and state-level contracted volumes should be calibrated to
    reflect the realistic DR potential of the available customer base in each jurisdiction.
