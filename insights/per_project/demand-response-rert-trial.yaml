  source_title: Demand Response RERT Trial Year 1 Report
  publish_date: 2019-03
  project_name: Demand Response RERT Trial
  what_happened: AGL's availability fee structure for C&I customers — reset after
    each test or dispatch to reflect actual capacity delivered — was identified as
    effective at maintaining participant readiness and reminding providers of their
    program obligations, while the only penalty for poor performance was a reduction
    or loss of payments.
  lesson_learnt: Availability fee structures for C&I DR programs should be dynamically
    reset against measured test performance to maintain accurate capacity signals
    and participant accountability — a performance-linked availability payment provides
    a stronger ongoing incentive than a fixed retainer with no performance-based adjustment.
