- record_id: ARENA-DLV-17906
  source_title: Demand Response RERT Trial Year 1 Report
  publish_date: 2019-03
  project_name: Demand Response RERT Trial
  what_happened: Residential recruitment fell short of contracted targets — residential
    customers were recruited to only 78.1% of contracted capacity in Year 1, while
    commercial and industrial sectors exceeded contracted volumes — reflecting the
    short mobilisation timeframe and less prior DR familiarity among residential customers.
  lesson_learnt: Residential DR recruitment requires longer lead times and more intensive
    engagement than commercial and industrial recruitment — program designers should
    set lower initial contracted volumes for residential portfolios when timeframes
    are tight and build in an extended customer acquisition phase before contracted
    delivery begins.
