  project_name: Demand Response RERT Trial
  what_happened: EnergyAustralia's residential BDR program delivered less demand reduction
    than expected based on test results, with the program identifying that tests may
    be called when portfolio DR potential is not at its highest — for example when
    weather conditions mean baseline consumption is low.
  lesson_learnt: Residential BDR program capacity assessments must account for the
    dependency of available DR on prevailing conditions at the time of dispatch —
    contracted capacity should be based on realistic delivery estimates under the
    range of conditions in which RERT events are likely to be called, not peak-condition
    estimates.
