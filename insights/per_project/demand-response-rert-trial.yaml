- record_id: ARENA-DLV-17909
  source_title: Demand Response RERT Trial Year 1 Report
  publish_date: 2019-03
  project_name: Demand Response RERT Trial
  what_happened: Approximately 40 per cent of customers who signed up for AGL's Managed
    for You air-conditioner controlled load program had equipment compatible with
    remote control under Australian Standard AS4755; site visits were required to
    determine compatibility as nameplate data is often inaccessible, increasing program
    costs and time.
  lesson_learnt: Residential controlled load programs relying on air-conditioner remote
    control should pre-screen customer equipment compatibility with AS4755 before
    signing up participants — without pre-screening, a large proportion of sign-ups
    will be ineligible, requiring costly site visits and reducing effective program
    capacity.
