  project_name: Demand Response RERT Trial
  what_happened: The ARENA/AEMO RERT trial across eight businesses and 10 projects
    delivered 164 MW against a 143 MW contracted goal in Year 1, and 191 MW against
    188 MW contracted in Year 2 — exceeding contracted targets by a combined average
    of 107% — demonstrating that DR proponents can successfully recruit and mobilise
    programs at short notice.
  lesson_learnt: Use behavioural DR programs where rapid customer recruitment is a
    priority — the avoidance of mandatory hardware and the preservation of customer
    autonomy consistently drives higher participation rates than controlled load approaches,
    though controlled load has strengths in reliability that BDR cannot match.
