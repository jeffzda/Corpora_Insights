  what_happened: Powershop recruited over 7,500 residential registrations within days
    from an email campaign to approximately 56,000 customers (13.4% response rate),
    ultimately growing to 10,634 participants by May 2018, demonstrating that electronic
    direct mail to an existing retail customer base is a fast and scalable residential
    DR recruitment channel.
  lesson_learnt: Electricity retailers with large existing customer bases can rapidly
    recruit residential DR participants at scale through targeted email campaigns
    — a 13% response rate from a single campaign to ~56,000 customers demonstrates
    that retailers have a significant structural advantage over non-retailer aggregators
    in residential DR recruitment speed.
