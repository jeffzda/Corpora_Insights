  source_title: Demand Response RERT Trial Year 1 Report
  publish_date: 2019-03
  project_name: Demand Response RERT Trial
  what_happened: Proponents had less than four months after notification of successful
    applications to recruit customers and meet contracted capacity for Period 1, creating
    significant mobilisation challenges — particularly for non-retailer aggregators
    and proponents entering new geographic markets.
  lesson_learnt: Allow substantially more than four months between program award and
    the first contracted delivery period for DR programs — non-retailer aggregators
    and proponents without an existing customer base in the target region require
    additional lead time to build recruitment pipelines from scratch.
