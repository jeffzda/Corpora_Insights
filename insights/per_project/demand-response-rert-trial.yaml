  what_happened: EnergyAustralia observed reluctance among residential customers to
    purchase battery storage for participation in its controlled load DR program,
    with customers deferring purchase decisions in anticipation of future price reductions
    or technical improvements.
  lesson_learnt: DR programs that require residential customers to purchase battery
    storage as a condition of participation will face adoption headwinds while battery
    costs remain high — program designers should consider proponent-funded or subsidised
    equipment installation for residential battery DR streams, or focus initial recruitment
    on customers who already own batteries.
