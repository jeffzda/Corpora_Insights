- record_id: ARENA-DLV-17908
  source_title: Demand Response RERT Trial Year 1 Report
  publish_date: 2019-03
  project_name: Demand Response RERT Trial
  what_happened: Proponents with prior experience in the Contingency FCAS market —
    specifically Enel X — were able to mobilise DR resources for the RERT trial significantly
    faster than new entrants, drawing on an existing customer base and established
    organisational capability.
  lesson_learnt: DR aggregators entering new reserve or ancillary markets should prioritise
    building an existing customer base and operational capability in adjacent markets
    first — prior participation in FCAS or other DR markets substantially reduces
    the time and cost of mobilising for a new DR program.
