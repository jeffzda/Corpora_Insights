- record_id: ARENA-DLV-17904
  source_title: Demand Response RERT Trial Year 1 Report
  publish_date: 2019-03
  project_name: Demand Response RERT Trial
  what_happened: Zen Ecosystems, a non-retailer aggregator, was unable to access individual
    residential customer metering data due to privacy restrictions, preventing delivery
    of individual performance feedback and performance-based incentives, and leaving
    it reliant on participation-based incentives that proved relatively ineffective
    at sustaining customer engagement.
  lesson_learnt: Non-retailer DR aggregators should anticipate data access friction
    from metering data providers and build manual integration processes or MDP relationship
    management into their operational model — signed customer authorities do not guarantee
    timely or standardised data delivery.
