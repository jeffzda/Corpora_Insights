  source_title: Demand Response RERT Trial Year 1 Report
  publish_date: 2019-03
  project_name: Demand Response RERT Trial
  what_happened: The ThinkPlace study commissioned by ARENA found that while people
    are willing to change energy usage in response to extreme events, there is meaningful
    scope to improve DR program feedback mechanisms and incentive alignment — current
    reward structures do not adequately reflect customers' social preferences, including
    status-based incentives.
  lesson_learnt: DR program incentive design should move beyond simple financial rewards
    to incorporate social and status-based incentives — independent customer research
    should inform program design before launch, as customers' stated motivations for
    participation frequently diverge from the financial-reward assumptions embedded
    in standard program structures.
