  source_title: Demand Response RERT Trial Year 1 Report
  publish_date: 2019-03
  project_name: Demand Response RERT Trial
  what_happened: AGL's residential behavioural DR program (Peak Energy Rewards) achieved
    over 60% customer participation in each of four proponent-led dispatches, with
    90% of customers reporting they were likely or very likely to participate in future
    events, and survey responses indicating no loss of comfort in over 79–97% of cases
    across events.
  lesson_learnt: Residential behavioural DR programs using SMS/email notification
    with modest financial incentives can achieve consistently high participation rates
    and customer satisfaction when events are infrequent, well-communicated, and customers
    retain full autonomy — this model is viable as a foundation for emergency reserve
    capacity.
