  what_happened: Larger C&I customers (those with maximum demands of 1 MW or more)
    frequently declined to participate in DR programs because the financial rewards
    were insufficient to offset perceived operational and reputational risks; agreements
    were sometimes signed by financial teams while operational teams — who bore the
    implementation burden — were not consulted, leading to internal conflict.
  lesson_learnt: DR program engagement with large C&I customers must involve both
