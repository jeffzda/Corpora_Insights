- record_id: ARENA-DLV-17905
  source_title: Demand Response RERT Trial Year 1 Report
  publish_date: 2019-03
  project_name: Demand Response RERT Trial
  what_happened: Revisions to metering data from the market were possible several
    months after DR events, with the potential to materially change assessed performance
    levels for aggregators and individual customers within portfolios.
  lesson_learnt: DR program settlement and performance reporting frameworks must account
    for post-event metering data revisions — payment and performance assessment processes
    should include a defined revision window and a mechanism for reconciling incentive
    payments against revised data.
