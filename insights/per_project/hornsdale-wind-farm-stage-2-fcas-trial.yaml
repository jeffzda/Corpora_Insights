- record_id: ARENA-DLV-22056
  source_title: AEMO Hornsdale Wind Farm 2 FCAS Trial
  publish_date: 2018-07
  project_name: Hornsdale Wind Farm 2 FCAS Trial
  what_happened: During the market trial, HWF2's raise contingency FCAS response to
    a low-frequency event on 26 December 2017 was not sustained while frequency was
    still recovering — active power momentarily increased after the frequency deviation
    but then fell before frequency returned to the normal operating band, because
    insufficient headroom was maintained.
  lesson_learnt: Wind farms providing raise contingency FCAS must maintain adequate
    headroom above their current output so that a raised active power response can
    be sustained for the full response period — operating close to Possible Power
    with minimal headroom will cause contingency raise responses to collapse before
    frequency recovers.
  issue_severity: moderate
  project_type: generation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The report notes that had HWF2 operated with greater headroom
    between its active power output and Possible Power, the raise response could potentially
    have been sustained; this finding informed updated headroom requirements for future
    FCAS applicants.
  transferability: moderate
  delay_magnitude: null
  technology_domain: wind
  source_pages: &id020
  - 26
  - 27
  evidence_excerpt: While system frequency was still recovering and below 49.85 Hz,
    HWF2 did not maintain an active power output above its initial output at the time
