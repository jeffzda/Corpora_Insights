  project_name: Hornsdale Wind Farm Stage 2 FCAS Trial
  what_happened: For 5.8% of trial periods, FCAS was not enabled because the cost
    of curtailing the wind farm to provide FCAS exceeded the FCAS price, and for 11%
    of trial periods FCAS was stranded because the wind farm's energy output was outside
    the FCAS trapezium enablement limits.
  lesson_learnt: Wind farm FCAS revenues are materially constrained by co-optimisation
    losses and stranding effects — project economics should account for the proportion
    of time FCAS will not be enabled, and operators should develop co-optimisation
    bidding capability before going to market to minimise stranded capacity.
