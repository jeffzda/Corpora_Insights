  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: AEMO developed a procedure to assign a generic minimum headroom
    factor for new wind or solar farms lacking historical forecast data, with provision
    to review after six months of actual operation.
  transferability: moderate
  delay_magnitude: null
  technology_domain: wind
