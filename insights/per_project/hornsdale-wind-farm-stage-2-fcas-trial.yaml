- record_id: ARENA-DLV-64656
  source_title: Neoen Hornsdale Wind Farm FCAS Trial Report
  publish_date: '2018'
  project_name: Hornsdale Wind Farm Stage 2 FCAS Trial
  what_happened: Despite FCAS having been an established NEM market for 20 years,
    the depth of technical understanding within both the wind farm owner (Neoen) and
    turbine vendor (Siemens Gamesa) organisations was limited, requiring significant
    internal education and the creation of interim operational systems to manage FCAS
    enablement and optimisation during the trial.
  lesson_learnt: Wind farm proponents and their technology vendors should invest in
    building FCAS-specific operational capability — including internal training and
    control room systems — before commencing a live FCAS trial, as typical wind farm
    operational systems do not natively support FCAS management.
