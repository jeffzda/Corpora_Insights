- record_id: ARENA-DLV-22058
  source_title: AEMO Hornsdale Wind Farm 2 FCAS Trial
  publish_date: 2018-07
  project_name: Hornsdale Wind Farm 2 FCAS Trial
  what_happened: Semi-scheduled generators such as HWF2 were frequently not enabled
    for FCAS despite bidding below the dispatch price, because co-optimisation of
    energy and FCAS in NEMDE makes it uneconomic to back off negative-price energy
    offers to create FCAS headroom — in 50 of 863 dispatch intervals (5.8%) no FCAS
    was enabled for this reason.
  lesson_learnt: Semi-scheduled wind and solar generators offering energy at or near
    the market floor price will rarely be enabled for raise FCAS through co-optimisation
    — FCAS bidding strategy must account for the energy-FCAS trade-off in NEMDE, and
    operators should consider whether FCAS offers priced to create a net economic
    incentive for enablement are feasible given their energy pricing.
  issue_severity: moderate
  project_type: generation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: commercial & market
  intervention_note: AEMO documented the co-optimisation mechanics in detail in the
    market trial report and Appendix A3 to inform future FCAS participants about this
    non-intuitive outcome.
  transferability: moderate
  delay_magnitude: null
  technology_domain: wind
  source_pages: &id022
  - 28
  - 29
  evidence_excerpt: During the FCAS trial, there were 50 dispatch intervals (or 5.8%
    of the time) when no FCAS was enabled for the HWF2 unit because its effective
    FCAS offer was uneconomic due to the relative high cost of trading off its energy
    target against FCAS enablement along the upper slope of its FCAS offer trapezium.
  confidence_note: failure_mode set to commercial/demand failure as the root cause
    is the economics of co-optimisation, not a technical incapability; secondary_failure_mode
    set to design assumption failure because the bidding strategy did not anticipate
    this dynamic.
