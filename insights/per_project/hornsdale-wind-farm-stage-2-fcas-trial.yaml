- record_id: ARENA-DLV-6858
  source_title: Hornsdale 2 Frequency Control Ancillary Service Trial Knowledge Sharing
    Report
  publish_date: '2018'
  project_name: Hornsdale 2 Wind Farm FCAS Trial
  what_happened: To provide raise FCAS, Hornsdale 2 had to be curtailed below available
    output to maintain headroom — for example, curtailed by 14 MW or 28 MW for up
    to 60 minutes per contingency test, and by 7 MW for regulation tests — representing
    a direct opportunity cost to the wind farm operator.
  lesson_learnt: Wind farm operators bidding into FCAS raise markets must factor in
    mandatory curtailment costs when assessing FCAS revenue — the revenue from ancillary
    services must outweigh lost energy revenue from the curtailment required to maintain
    raise headroom.
