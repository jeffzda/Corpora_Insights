- record_id: ARENA-DLV-22060
  source_title: AEMO Hornsdale Wind Farm 2 FCAS Trial
  publish_date: 2018-07
  project_name: Hornsdale Wind Farm 2 FCAS Trial
  what_happened: AEMO's centralised wind farm forecasting model (AWEFS) uses an estimated
    average wind speed across all turbines rather than individual turbine forecasts,
    causing systemic under-forecasting when a greater number of turbines experience
    above-average wind speeds — at HWF2 on 19 December 2017, individual turbine wind
    speeds ranged from 4.3 to 9.5 m/s against a 7.2 m/s farm average.
  lesson_learnt: Wind farm operators seeking to minimise FCAS headroom requirements
    should develop self-forecasting capability based on individual turbine wind and
    power forecasts rather than farm-average estimates — more accurate Possible Power
    forecasts reduce the required headroom and increase the economic value of FCAS
    participation.
  issue_severity: minor
  project_type: generation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: AEMO and ARENA initiated a Market Participant 5-minute Self-Forecasting
    project to enable participants to submit their own Possible Power forecasts based
    on individual turbine data, anticipated to improve forecast accuracy and reduce
    required headroom.
  transferability: moderate
  delay_magnitude: null
  technology_domain: wind
  source_pages: &id024
  - 33
  - 34
  evidence_excerpt: Forecast accuracy is further impacted by AWEFS, AEMO's wind farm
    forecasting model, using an estimated average wind speed from across each wind
    turbine to determine forecast output via the turbine power curve, rather than
    using wind speed forecasts for individual turbine power curves.
