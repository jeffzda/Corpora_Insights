- record_id: ARENA-DLV-64660
  source_title: Neoen Hornsdale Wind Farm FCAS Trial Report
  publish_date: '2018'
  project_name: Hornsdale Wind Farm Stage 2 FCAS Trial
  what_happened: The wind farm's existing PPA with a contracted offtaker was impacted
    by curtailment during the FCAS trial; the PPA provider was satisfied the impacts
    were small given the trial context, but identified that future commercially operating
    wind farms providing FCAS could face more significant PPA implications.
  lesson_learnt: Wind farm operators with PPA obligations must assess the commercial
    impact of FCAS-related curtailment on contracted offtakers before committing to
    FCAS provision — the curtailment required for spinning reserve operation may conflict
    with PPA delivery obligations in a way that requires contractual negotiation or
    is economically prohibitive.
