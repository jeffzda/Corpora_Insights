  source_title: AEMO Hornsdale Wind Farm 2 FCAS Trial
  publish_date: 2018-07
  project_name: Hornsdale Wind Farm 2 FCAS Trial
  what_happened: FCAS 'stranding' — where a semi-scheduled generator's actual energy
    output falls outside its FCAS enablement limits — occurred in 94 of 863 dispatch
    intervals (11%) during the HWF2 market trial, split equally between operating
    above Enablement Max/UIGF and below Enablement Min.
  lesson_learnt: Semi-scheduled generators have less control over output and are inherently
    more susceptible to FCAS stranding than scheduled units — FCAS offer trapeziums,
    headroom settings, and enablement minimum levels must be calibrated to the natural
    output variability of the wind or solar resource to minimise stranding incidence.
