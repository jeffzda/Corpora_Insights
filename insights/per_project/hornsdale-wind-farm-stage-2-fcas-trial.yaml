  project_name: Hornsdale 2 Wind Farm FCAS Trial
  what_happened: The wind farm controller (HPPP) frequency mode settings were only
    accessible by Siemens Gamesa personnel during the trial, meaning NEOEN's control
    room operators could not independently switch the wind farm between FCAS modes,
    limiting operational agility and reliability for ongoing market participation.
