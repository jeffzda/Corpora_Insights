  project_name: Hornsdale Wind Farm 2 FCAS Trial
  what_happened: Basic frequency control capability — AGC remote control and autonomous
    active power response to locally measured frequency — was confirmed by consultation
    with wind turbine, solar inverter, and utility-scale battery manufacturers to
    be achievable with little or no increase in capital cost, yet no wind or solar
    farm had registered to provide FCAS in the NEM before this trial.
  lesson_learnt: The barrier to wind and solar FCAS participation was not technology
    cost but the absence of an established end-to-end registration, testing, and market
    integration pathway — future projects should not assume technical capability alone
    is sufficient and must plan for the regulatory and market integration steps required
    for FCAS classification.
