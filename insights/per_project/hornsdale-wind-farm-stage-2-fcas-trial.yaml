- record_id: ARENA-DLV-6856
  source_title: Hornsdale 2 Frequency Control Ancillary Service Trial Knowledge Sharing
    Report
  publish_date: '2018'
  project_name: Hornsdale 2 Wind Farm FCAS Trial
  what_happened: Siemens Gamesa selected Power Factory over the more commonly used
    PSS/E simulation platform for FCAS modelling because the simulation techniques
    required had only recently matured in PSS/E's latest version, and the uncertainty
    in PSS/E models and engineering effort to configure it as needed made it impractical
    for this application.
  lesson_learnt: Project teams should not default to the market-standard simulation
    tool (PSS/E) when modelling inverter-connected wind farm FCAS response — Power
    Factory offers more transparent communication between grid and wind farm models
    and may be more suitable for this class of problem, particularly where PSS/E model
    maturity is uncertain.
