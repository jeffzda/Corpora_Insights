  project_name: Hornsdale 2 Wind Farm FCAS Trial
  what_happened: The internet-based communication link between the frequency injection
    tool and the HPPP introduced an unquantified time delay, creating uncertainty
    in the accuracy of the test signal timing and complicating interpretation of test
    results.
  lesson_learnt: FCAS testing using web-based or internet-connected injection tools
    should characterise and document communication latency before testing commences
    — unquantified delays reduce confidence in test result interpretation and may
    require additional test runs to isolate the delay contribution.
