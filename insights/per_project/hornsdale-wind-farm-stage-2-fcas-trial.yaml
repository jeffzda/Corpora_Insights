- record_id: ARENA-DLV-6862
  source_title: Hornsdale 2 Frequency Control Ancillary Service Trial Knowledge Sharing
    Report
  publish_date: '2018'
  project_name: Hornsdale 2 Wind Farm FCAS Trial
  what_happened: Multiple communication and polling time delays were identified in
    the wind farm FCAS response chain — including a 0.125-second HPPP controller input
    delay, a 0.2-second turbine polling delay, and an unquantified internet communication
    delay from the injection tool — collectively affecting the speed and accuracy
    of the FCAS response.
  lesson_learnt: Wind farm developers seeking FCAS registration should characterise
    and model all communication and polling delays across the full control chain (injection
    tool, wind farm controller, turbine polling) as these compound delays can materially
    affect compliance with fast FCAS timing requirements and must be accurately reflected
    in simulation models submitted to AEMO.
  issue_severity: moderate
  project_type: generation
  project_scale_band: utility/large-scale
  lifecycle_phase: commissioning/integration
  proponent_type: manufacturer/OEM
  delay_category: data/validation/testing
  failure_mode: unvalidated integration
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: data & measurement
  intervention_note: Time delays were explicitly modelled in Power Factory (Td_input
    = 0.125s, Td_Psp_Park = 0.2s) to replicate the field test stepped response in
    simulation.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: wind
  source_pages: &id012
  - 44
  - 45
  evidence_excerpt: The HPPP frequency controller takes some time to respond and calculate
    new set-points and is modelled as Td_input (communication time delay) with a value
    of 0.125 seconds... The wind farm also takes some time to send new set-points
    to each turbine in a wind farm. This is modelled as Td_Psp_Park and is modelled
    as 0.2 seconds this is mostly due to the time that is taken to pole each turbine
    in the wind farm.
