  project_name: Hornsdale 2 Wind Farm FCAS Trial
  what_happened: Siemens Gamesa identified that converter-connected wind generation
    is technically capable of providing Fast Frequency Response (FFR) beyond the current
    MASS specifications, but noted that any FFR obligation would need a derogation
    for concurrent short-circuit events.
  lesson_learnt: Policy makers and market designers seeking to leverage wind generation
    for FFR should engage with OEMs early to define a FFR characteristic that accounts
    for the inverter control priority hierarchy during concurrent fault events — a
    derogation or modified assessment methodology will be needed before wind FFR can
    be formally registered.
