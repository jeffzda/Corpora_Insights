  source_title: Neoen Hornsdale Wind Farm FCAS Trial Report
  publish_date: '2018'
  project_name: Hornsdale Wind Farm Stage 2 FCAS Trial
  what_happened: To provide raise FCAS, the wind farm was required to operate in a
    curtailed spinning reserve mode, spilling wind energy below available output;
    the upper angle of the FCAS trapezium was set conservatively under MASS and the
    Verification Tool, limiting the amount of FCAS that could be offered relative
    to the amount of curtailment required.
  lesson_learnt: Wind farm FCAS proponents should anticipate that conservative trapezium
    upper-angle settings under MASS will limit FCAS capacity relative to curtailment
    cost — engage with AEMO's self-forecasting process to obtain tighter headroom
    estimates and reduce the curtailment-to-FCAS ratio before committing to registration
    volumes.
