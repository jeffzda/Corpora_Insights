  what_happened: The Hornsdale Wind Farm 2 operates without synthetic inertia because
    the full-scale converters are not configured to provide it, meaning the wind farm
    provides no resistance to frequency changes and does not assist transient stability
    — a design characteristic with implications for FCAS capability assessment.
  lesson_learnt: Future wind farm projects using full-scale converters should explicitly
    evaluate and document whether synthetic inertia will be enabled at the design
    stage — the absence of inertia affects the wind farm's FCAS profile and its contribution
    to grid stability, and this should be factored into FCAS registration planning.
