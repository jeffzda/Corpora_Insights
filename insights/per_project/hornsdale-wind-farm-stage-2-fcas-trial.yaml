- record_id: ARENA-DLV-22052
  source_title: AEMO Hornsdale Wind Farm 2 FCAS Trial
  publish_date: 2018-07
  project_name: Hornsdale Wind Farm 2 FCAS Trial
  what_happened: HWF2 could not be registered for fast raise and lower contingency
    FCAS (6-second response) because Low Voltage Ride Through (LVRT) mode — required
    under Generator Performance Standards — prioritises reactive power over active
    power, preventing delivery of active power within six seconds of a simultaneous
    frequency and voltage event.
  lesson_learnt: Wind farms seeking FCAS classification must simulate combined frequency
    and voltage disturbance scenarios before applying — the conflict between LVRT
    obligations and fast FCAS delivery can disqualify a wind farm from fast contingency
    services, and this cannot be detected by on-site frequency injection tests alone.
