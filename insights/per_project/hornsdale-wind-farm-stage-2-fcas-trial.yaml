- record_id: ARENA-DLV-6854
  source_title: Hornsdale 2 Frequency Control Ancillary Service Trial Knowledge Sharing
    Report
  publish_date: '2018'
  project_name: Hornsdale 2 Wind Farm FCAS Trial
  what_happened: The frequency injection tool used for FCAS testing updates the frequency
    signal to the HPPP only once per second (1 Hz sample rate), introducing a zero-order-hold
    artefact that caused a stepped rather than smooth wind farm power response, complicating
    comparison between field test results and simulation outputs.
  lesson_learnt: When using frequency injection tools for FCAS pre-registration testing,
    project teams should be aware that a 1-second update rate introduces a zero-order-hold
    effect that creates stepped responses not present in actual operation — simulation
    models must replicate this artefact to produce valid comparisons with field test
    results.
  issue_severity: minor
  project_type: generation
  project_scale_band: utility/large-scale
  lifecycle_phase: commissioning/integration
  proponent_type: manufacturer/OEM
  delay_category: data/validation/testing
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The Power Factory input file was made more representative of
    the stepped injection signal (overcoming automatic linearisation) to reconcile
    simulation and field test results.
  transferability: narrow
  delay_magnitude: not quantified
  technology_domain: wind
  source_pages: &id004
