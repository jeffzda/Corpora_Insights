- record_id: ARENA-DLV-6857
  source_title: Hornsdale 2 Frequency Control Ancillary Service Trial Knowledge Sharing
    Report
  publish_date: '2018'
  project_name: Hornsdale 2 Wind Farm FCAS Trial
  what_happened: Inverter-connected wind turbines at Hornsdale 2 are effectively decoupled
    from grid frequency (often described as 'inertia-less'), because the power converter
    synthesises the current waveform independently of the mechanical rotor speed,
    unlike synchronous generators whose kinetic energy is immediately available to
    resist frequency changes.
  lesson_learnt: Project teams and market participants should understand that inverter-connected
    wind generation does not provide inherent inertial response — any synthetic inertia
    or FCAS capability must be explicitly programmed into the converter control system,
    and curtailment headroom must be maintained to enable upward frequency response.
  issue_severity: none
  project_type: generation
  project_scale_band: utility/large-scale
  lifecycle_phase: development/design
  proponent_type: manufacturer/OEM
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: null
  transferability: broad
  delay_magnitude: null
  technology_domain: wind
  source_pages: &id007
  - 8
  - 9
  evidence_excerpt: As the variable speed generator is effectively decoupled from
    the fluctuations of grid frequency, inverter connected generation is crudely referred
    to as 'inertia-less'... to respond to under frequency events the wind farm needs
    to be operating at a generation level lower than the available power.
