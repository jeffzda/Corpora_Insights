  secondary_failure_mode: null
  intervention_note: Siemens Gamesa ran simulations in Power Factory, noting that
    the Siemens Gamesa Power Factory and PSS/E models are developed from the same
    control block diagrams and produce identical model behaviour.
  transferability: narrow
  delay_magnitude: null
  technology_domain: wind
  source_pages: &id006
