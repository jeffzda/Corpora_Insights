  outcome_class: partial success
  secondary_failure_mode: poor scoping
  intervention_note: AEMO requested power system simulations of simultaneous voltage
    and frequency dips; simulation results confirmed the LVRT conflict and HWF2 was
    classified for six of eight FCAS products, with fast services excluded.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: wind
  source_pages: &id016
  - 4
