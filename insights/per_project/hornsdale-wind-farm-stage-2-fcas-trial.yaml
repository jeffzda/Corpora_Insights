- record_id: ARENA-DLV-6852
  source_title: Hornsdale 2 Frequency Control Ancillary Service Trial Knowledge Sharing
    Report
  publish_date: '2018'
  project_name: Hornsdale 2 Wind Farm FCAS Trial
  what_happened: When AEMO assessed Hornsdale 2's ability to provide fast raise FCAS
    (R6) under a combined frequency and short-circuit event, the wind farm's active
    power dropped from 74 MW to 47 MW before recovering, resulting in zero contribution
    to the 6-second fast raise service under that assessment scenario.
  lesson_learnt: Inverter-connected wind farms prioritise fault ride-through and voltage
    support over FCAS during concurrent voltage and frequency events — project teams
    seeking R6 registration should engage AEMO to seek derogation from the combined-event
    assessment requirement, or accept that R6 will not be achievable in that scenario.
  issue_severity: major
  project_type: generation
  project_scale_band: utility/large-scale
  lifecycle_phase: commissioning/integration
  proponent_type: manufacturer/OEM
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: regulatory & approvals
  intervention_note: Siemens Gamesa proposed that AEMO exclude combined frequency
    and voltage events from the FCAS capability assessment, arguing such events had
    not historically co-occurred in the SA islanding scenarios.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: wind
  source_pages: &id002
  - 35
  - 36
  - 37
  - 49
  - 53
  evidence_excerpt: The impact of the active power reducing is that the Hornsdale
    Stage 2 wind farm demonstrates no contribution to FCAS for the six second fast
    raise service (R6)... It may also require a relaxation by AEMO of the requirement
