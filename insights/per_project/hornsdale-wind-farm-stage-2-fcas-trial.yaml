- record_id: ARENA-DLV-22054
  source_title: AEMO Hornsdale Wind Farm 2 FCAS Trial
  publish_date: 2018-07
  project_name: Hornsdale Wind Farm 2 FCAS Trial
  what_happened: Wind farms seeking FCAS registration had no established minimum headroom
    (pre-curtailment) requirement. AEMO developed a minimum headroom parameter for
    HWF2 equivalent to approximately 10 MW (10% of registered capacity), representing
    a 3 standard deviation error in the 5-minute ahead generation forecast, to ensure
    reliable FCAS delivery.
  lesson_learnt: Wind and solar farms registering for FCAS must maintain a minimum
    headroom margin — calculated from 3 standard deviations of forecast error over
    historical commissioning data — to prevent stranding and ensure contracted services
    can be delivered; new farms without historical data should accept a generic AEMO-determined
    baseline and review it after six months of operation.
  issue_severity: moderate
  project_type: generation
  project_scale_band: first commercial/FOAK
