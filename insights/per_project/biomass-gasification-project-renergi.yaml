- record_id: ARENA-DLV-25921
  source_title: Review of ARENA's Reliability Portfolio
  publish_date: 2020-01
  project_name: Biomass Gasification Project (Renergi)
  what_happened: Renergi's advanced biomass gasification project — which converts
    agricultural waste crops into clean gaseous fuel for electricity generation —
    was successfully completed in 2018 and demonstrated the viability of the technology
    at commercial scale, but the project had not yet progressed to full commercial
    deployment at the time of review.
  lesson_learnt: Successful demonstration of a novel bioenergy technology does not
    automatically translate to commercial deployment; ARENA should consider follow-on
    funding specifically targeting commercial-scale deployment pathways and market
    linkages for demonstrated but not yet commercialised bioenergy technologies.
