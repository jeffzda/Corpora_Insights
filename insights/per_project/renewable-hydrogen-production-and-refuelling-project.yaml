  what_happened: Hydrogen supply reliability was identified as a critical risk for
    HRS operations; the project mitigated this by maintaining multiple supply sources
    and additional buffer storage, ensuring continuity if the primary Bulwer Island
    electrolyser required planned or unplanned maintenance.
