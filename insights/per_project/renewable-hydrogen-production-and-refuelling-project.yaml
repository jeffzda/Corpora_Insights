- record_id: ARENA-DLV-10951
  source_title: BOC Renewable Hydrogen Production and Refuelling Lessons Learnt
  publish_date: 2022-02
  project_name: Renewable Hydrogen Production and Refuelling Project
  what_happened: Hydrogen electrolysers and refuellers approved for sale in the EU
    and US required significant additional engineering and cost to meet Australian
    standards, particularly around pressure vessel design registration and flammable
    zoning requirements, which differ from European and US standards and vary between
    Australian states.
  lesson_learnt: Budget and schedule for importing internationally approved hydrogen
    equipment must account for Australian-specific localisation requirements — pressure
    vessel design registration and flammable zoning rules add cost and rework beyond
    what EU/US approvals cover, and state-level variations compound this further.
  issue_severity: major
  project_type: transport electrification
  project_scale_band: demonstration
  lifecycle_phase: procurement
  proponent_type: manufacturer/OEM
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: BOC worked with Linde Fuel Tech on additional engineering to
    ensure the HRS met Australian conditions including higher temperatures seen in
    Brisbane compared to European operating norms.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages:
  - 2
  - 7
  evidence_excerpt: This project found a number of key areas where localisation of
    equipment from Europe requires additional engineering as well as costs to meet
    Australian standards... Design registration and verification of pressure vessels
    is mandatory in all Australian states and territories... Australia has flammable
    zoning rules that differ from Europe and the US. This has led to the requirement
    for additional risk modelling as well as re-wiring of equipment that is currently
    operating safely in the EU.
  confidence_note: delay_magnitude not quantified in document; issue_severity rated
    major based on scope of rework and cost impact described across multiple equipment
    categories. Canonical record merged from 3 source records across 2 document(s).
