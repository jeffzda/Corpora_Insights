- record_id: ARENA-DLV-31115
  source_title: BOC Hydrogen Refuelling Guide
  publish_date: 2023-03
  project_name: Renewable Hydrogen Production and Refuelling Project
  what_happened: Lack of national consistency in the interpretation of hydrogen standards
    by local councils and state regulators created uncertainty and additional effort
    in obtaining approvals, with local interpretations generating confusion for both
    approvers and the community.
  lesson_learnt: Until a national HRS approval toolkit is developed, proponents should
    reference established international standards (e.g. ANZIGA, ISO) and international
    operational track records when engaging regulators — and should actively advocate
    through industry bodies for national consistency in standards interpretation to
    reduce approval burden on future projects.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: demonstration
  lifecycle_phase: approvals/contracting
  proponent_type: manufacturer/OEM
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: null
  intervention_note: BOC referenced ANZIGA and international industrial gas standards
    where no specific Australian legislation existed, and provided Brisbane City Council
    with comprehensive performance, safety and operations data, securing supportive
    approval at the bp Port of Brisbane site.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages:
  - 4
  - 9
  evidence_excerpt: The Development Application process for the alternative site is
    ongoing and will be a key test for councils approving hydrogen facilities at non-industrial
    sites. The learnings from this process should be used as a framework for councils
    to help build their knowledge of relevant hydrogen projects. The specific issues
    of community acceptance and council development approval is likely to remain a
    challenge to the sector as it develops.
  confidence_note: Canonical record merged from 3 source records across 2 document(s).
