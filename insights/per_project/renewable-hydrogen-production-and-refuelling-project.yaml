- record_id: ARENA-DLV-10954
  source_title: BOC Renewable Hydrogen Production and Refuelling Lessons Learnt
  publish_date: 2022-02
  project_name: Renewable Hydrogen Production and Refuelling Project
  what_happened: The originally planned refuelling infrastructure site on the Queensland
    University of Technology campus was abandoned after community concerns about perceived
    explosive risk, requiring identification of an alternative site at Bulwer Island
    and restarting the Development Application process.
  lesson_learnt: Conduct early community risk perception assessment before committing
    to a refuelling site — community and council objections based on perceived explosive
    risk from hydrogen can force late-stage site relocation, extending approvals timelines
    significantly, particularly for non-industrial locations.
  issue_severity: major
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: approvals/contracting
  proponent_type: utility/energy retailer
  delay_category: stakeholder/land/community
  failure_mode: coordination & stakeholders
  outcome_class: re-scoped/adapted
  secondary_failure_mode: regulatory & approvals
  intervention_note: An alternative site on Bulwer Island was identified that offered
    co-location of hydrogen and traditional liquid fuels, and a new Development Application
    was lodged for that site.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages: &id001
  - 4
  evidence_excerpt: The refuelling infrastructure was originally planned to be sited
    on the Queensland University of Technology (QUT) campus but this plan was changed
    in response to concerns about the potential risk perceptions related to a sensitive
    local population. This process highlighted the difficulty of communicating complex
    industrial risk assessment outcomes to stakeholders that are not trained in this
    area, but understandably sensitive to the notion of explosive risk.
  confidence_note: failure_mode coded as governance/coordination failure reflecting
