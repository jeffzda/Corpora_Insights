- record_id: ARENA-DLV-10952
  source_title: BOC Renewable Hydrogen Production and Refuelling Lessons Learnt
  publish_date: 2022-02
  project_name: Renewable Hydrogen Production and Refuelling Project
  what_happened: International hydrogen equipment manufacturers required their own
    staff to travel from Europe or the US to commission electrolysers and refuelling
    systems in Australia; COVID-19 border restrictions and hotel quarantine requirements
    delayed this process and added costs.
  lesson_learnt: Use equipment from vendors who can support remote commissioning and
    invest in specialist hydrogen training for local staff — COVID-19 demonstrated
    that reliance on international personnel for commissioning creates schedule and
    cost risk, and local skills are also essential for ongoing maintenance.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: utility/energy retailer
  delay_category: commissioning/integration
  failure_mode: execution & logistics
  outcome_class: delayed but recoverable
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: BOC worked with Linde counterparts to remotely commission the
    Toyota EcoPark refueller in Altona using video conferencing and well-designed
    commissioning manuals, and planned to apply the same approach to the Bulwer Island
    refueller.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages:
  - 3
  evidence_excerpt: Similar learnings may be applied to electrolysers although in
    many cases the manufacturer has looked to commission these units themselves based
    on proprietary technology in the electrolyser 'stack'. These skills need to be
    localised through long term partnerships as they will also be needed for ongoing
    maintenance.
