- record_id: ARENA-DLV-15822
  source_title: Evaluation of ARENA's Impact and Effectiveness
  publish_date: 2019-11
  project_name: Greensync Distributed Energy Exchange (deX)
  what_happened: ARENA's initial $405,000 investment was identified by GreenSync as
    vital to propelling the deX platform from idea to commercial product. Without
    it, deX would not have become a globally competitive platform. However, GreenSync
    identified that current regulatory rules on rights and obligations for managing
    distributed resources to maintain system security remained unresolved, creating
    ongoing commercial uncertainty.
  lesson_learnt: Early-stage digital platform projects for DER coordination require
    regulatory clarity on system security obligations before they can achieve full
    commercial scale — technology development funding alone is insufficient if the
    regulatory framework governing platform liability and dispatch rights remains
    undefined.
