- record_id: ARENA-DLV-2611
  source_title: ARENA Insights Forum November 2024 - Accelerating Zero-Emissions Heavy
    Transport
  publish_date: 2024-11
  project_name: ANC Project Spark
  what_happened: ANC launched Project Spark in June 2024 to deploy Australia's largest
    last-mile EV fleet, adding 65 EVs in the first year with a commitment to 112 EVs
    by 2026 and 30% of total fleet electrified by 2028. The project identified a 35.2%
    total cost of ownership gap as the primary barrier to ZEV adoption in last-mile
    delivery.
  lesson_learnt: A TCO gap of ~35% for last-mile delivery EVs can be substantially
    closed through a combination of levers — brand carry (16.5%), green premium bundled
    with sustainable deliveries (18.7%), battery residual value (19.8%), high utilisation
    through twilight deliveries and route optimisation (1.4%), and lower driver churn
    (8.4%) — reducing the residual gap to approximately 35% of the original gap.
  issue_severity: major
  project_type: transport electrification
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: operations
  proponent_type: fleet/logistics operator
  delay_category: null
  failure_mode: commercial & market
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Closed the TCO gap using a bundled green premium (combining brand
    carry and sustainable delivery marketing), high utilisation scheduling, and battery
    residual value calculations.
  transferability: moderate
  delay_magnitude: null
  technology_domain: EV
  source_pages: &id001
