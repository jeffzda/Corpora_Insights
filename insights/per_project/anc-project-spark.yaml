- record_id: ARENA-DLV-2614
  source_title: ARENA Insights Forum November 2024 - Accelerating Zero-Emissions Heavy
    Transport
  publish_date: 2024-11
  project_name: ANC Project Spark
  what_happened: ANC found that offering delivery professionals a green premium for
    each EV delivery reduced driver churn and lowered replacement costs, contributing
    to closing the overall TCO gap.
  lesson_learnt: Sharing a portion of the green premium directly with delivery professionals
    reduces churn and replacement costs — structuring driver incentives around EV
    operation creates a measurable commercial return that contributes to TCO closure.
