- record_id: ARENA-DLV-2612
  source_title: ARENA Insights Forum November 2024 - Accelerating Zero-Emissions Heavy
    Transport
  publish_date: 2024-11
  project_name: ANC Project Spark
  what_happened: ANC found that consumers remain reluctant to pay a standalone green
    premium for sustainable deliveries, but success was achieved when the green premium
    was bundled with brand carry (clients with Scope 3 targets advertising their brand
    on EVs).
  lesson_learnt: Do not offer a standalone green delivery premium to end consumers
    — bundle it with brand visibility on EVs for clients with Scope 3 targets, as
    this combination generates commercial willingness to pay where a standalone green
    premium does not.
