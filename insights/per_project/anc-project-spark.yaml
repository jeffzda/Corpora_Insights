- record_id: ARENA-DLV-2613
  source_title: ARENA Insights Forum November 2024 - Accelerating Zero-Emissions Heavy
    Transport
  publish_date: 2024-11
  project_name: ANC Project Spark
  what_happened: ANC identified that public access charging for larger-format delivery
    vehicles (e.g. 9-tonne JAC) remains restrictive, while depot and at-home charging
    are complex — principal contractors are unwilling to invest in chargers for their
    crew, and delivery professionals are often unable to install home chargers.
  lesson_learnt: Last-mile EV fleet operators relying on contractors or gig-economy
    delivery professionals face a structural charging gap — depot charging investment
    by principal contractors is unlikely without mandate or incentive, and home charging
    is often not feasible; fleet operators should plan for depot-owned charging infrastructure
    and route designs that do not depend on public or home charging for larger vehicles.
  issue_severity: major
  project_type: transport electrification
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: operations
  proponent_type: fleet/logistics operator
  delay_category: null
  failure_mode: coordination & stakeholders
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Made public access charging frictionless through partnerships
    for light vehicles; continued to work through depot charging complexity.
  transferability: moderate
  delay_magnitude: null
  technology_domain: EV
