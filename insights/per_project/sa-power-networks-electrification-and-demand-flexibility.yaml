  what_happened: A HEMS bug causing hot water failure — leaving a participant with
    no hot water — was discovered during 'friendly' installations (staff homes used
    as test sites) before wide-scale rollout to participant homes.
  lesson_learnt: Use internal or 'friendly' test installations with staff or closely
    engaged participants to surface software and hardware bugs before public rollout
    — this allows bugs to be identified and resolved without disrupting participant
    experience or eroding trust.
