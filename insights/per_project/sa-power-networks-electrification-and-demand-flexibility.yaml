  what_happened: The REPS scheme and comparable jurisdictional incentive programs
    do not cover rental properties, yet approximately 190,000 rental households exist
    in South Australia alone — leaving renters unable to access electrification and
    efficiency upgrade subsidies, risking deepened affordability gaps as the owner-occupied
    sector electrifies.
  lesson_learnt: National scale-up of household electrification programs requires
    explicit policy design to address the landlord-tenant split incentive — absent
    this, programs will systematically exclude renters and deepen existing energy
    affordability inequities; advocate for renter-accessible incentive mechanisms
    in parallel with program delivery.
