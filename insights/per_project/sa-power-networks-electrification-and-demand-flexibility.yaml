  publish_date: 2024-09
  project_name: Energy Masters
  what_happened: The Diversify trial tariff structure placed the obligation on the
    retailer to deliver the flexible demand credit on behalf of SAPN, even though
    the retailer does not directly deliver the flexible demand — that is the responsibility
    of the HEMS. Some retailers' billing systems were also found to be poorly equipped
    to incorporate additional credit tariffs on top of consumption-based network tariffs.
  lesson_learnt: When designing network trial tariffs for flexible demand pilots,
    verify that retailer billing systems can technically accommodate credit structures
    layered on top of consumption-based tariffs, and ensure that tariff obligations
    are allocated to the party that actually controls the relevant function — misalignment
    between tariff obligations and operational responsibility creates delivery risk.
