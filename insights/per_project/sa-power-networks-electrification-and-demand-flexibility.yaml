  what_happened: The regulatory timeline for establishing new trial network tariffs
    under the AER process has a minimum four-month lead time. The Diversify tariff
    used in the Energy Masters pilot had already been approved in 2023/24; had it
    not been pre-approved, SAPN would have had to wait until July 2025 to implement
    it, significantly delaying the pilot.
  lesson_learnt: Identify all required network trial tariffs at the earliest stage
    of pilot planning and initiate AER approval processes well in advance — the minimum
    four-month lead time can be prohibitive, and relying on tariffs that are not yet
    approved will delay pilot commencement by at least one regulatory cycle.
