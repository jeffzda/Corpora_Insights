  publish_date: 2024-09
  project_name: Energy Masters
  what_happened: Developing consumer-facing communications materials took considerably
    more time than expected. Technical concepts (demand flexibility, dynamic operating
    envelopes, HEMS) had to be translated from scratch into accessible language while
    meeting legal requirements for all partners. Materials also had to be revised
    repeatedly as energy offers were refined and multiple partners provided feedback.
  lesson_learnt: Budget substantial time and resources for consumer communications
    development in demand flexibility pilots — technical concepts are unfamiliar to
    households, multi-partner legal review cycles add iterations, and the inability
    to make firm savings commitments while the trial design is still being finalised
    further constrains what can be communicated effectively.
