  what_happened: Households on the project frequently requested that tradespeople
    on site complete small unrelated electrical or plumbing tasks, creating scheduling
    disruption and extending installation time beyond the planned duration.
  lesson_learnt: Large-scale household installation programs should offer participants
    the option to pre-schedule minor additional works or flag these needs during the
    EOI process — capturing these needs upfront reduces ad-hoc scope creep on installation
    day and improves both efficiency and participant satisfaction.
