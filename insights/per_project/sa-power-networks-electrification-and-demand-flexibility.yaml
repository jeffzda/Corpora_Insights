  what_happened: The physical HEMS used in the project carries additional installation
    complexity and extended installation time compared to virtual/cloud-based alternatives,
    yet virtual HEMS remain nascent and carry their own challenges including connectivity
    dependency, slower response times, and the need to build failsafe behaviours into
    every device.
