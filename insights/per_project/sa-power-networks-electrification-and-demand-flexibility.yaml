- record_id: ARENA-DLV-62663
  source_title: SA Power Networks, South Australia, Electrification and Demand Flexibility
    - Energy Masters - Lessons Learnt Report 1
  publish_date: 2024-09
  project_name: Energy Masters
  what_happened: The absence of mandatory national interoperability standards for
    behind-the-meter CER devices was identified as a systemic barrier across the pilot,
    driving up integration costs, slowing development, limiting customer choice, and
    risking lock-in to specific device/HEMS/retailer combinations. The voluntary Sunspec
    standard provided insufficient relief due to inconsistent OEM implementation.
  lesson_learnt: Advocate for and actively participate in the development of mandatory
    national interoperability standards early in pilot design — the lack of such standards
    is the root cause of multiple delivery barriers in HEMS pilots (bespoke integrations,
    closed ecosystems, control engine conflicts), and standards must include functional
    requirements, protocol requirements and testing/verification to be effective.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: network business
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated integration
  intervention_note: Multiple project partners are actively participating in interoperability
    working groups run by the Australian National University and Standards Australia;
    SAPN will draft standards for behind-the-meter interoperability once the final
    HEMS design is trialled.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: DER
  source_pages: &id041
  - 20
  - 21
  evidence_excerpt: The establishment of nationally adopted interoperability standards
    to behind-the-meter CER and appliances would streamline technology development,
    unlock efficiencies for HEMS providers and open the market to new entrants. National
    inter-operability standards will be vital to enable scaling of HEMS and behind
    the meter orchestration, and it is urgent that they be implemented before the
    diffusion of HEMS and devices makes these harder.
