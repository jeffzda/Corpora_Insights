  what_happened: Market research on consumer communications revealed that highlighting
    government and electricity network involvement significantly increased household
    trust in the project. It also found that framing the offer around control of total
    energy use rather than control of specific devices was more effective, and that
    the information hierarchy assumed by the project team did not match consumer priorities.
  lesson_learnt: Conduct market research before finalising consumer recruitment materials
    for household energy pilots — consumer information priorities often differ from
    what the project team assumes, and emphasising government and network operator
    involvement materially increases trust and participation intent.
