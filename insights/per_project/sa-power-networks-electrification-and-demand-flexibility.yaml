  project_name: Energy Masters
  what_happened: The South Australian REPS scheme rewards energy efficiency but does
    not recognise HEMS or demand flexibility technologies that deliver system-wide
    benefits through load shifting and peak reduction, creating a misalignment between
    the available financial incentive framework and the program's flexible demand
    objectives.
  lesson_learnt: When designing multi-year household electrification programs, assess
    whether the jurisdictional incentive scheme covers flexible demand technologies
    (HEMS, load orchestration) as well as efficiency — a scheme that only rewards
    efficiency upgrades will undervalue and under-incentivise the demand flexibility
    component of the program.
