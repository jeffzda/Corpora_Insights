- record_id: ARENA-DLV-62154
  source_title: SA Power Networks - Energy Masters - Lessons Learnt Report 2
  publish_date: 2026-01
  project_name: Energy Masters
  what_happened: South Australia-specific heat pump hot water system regulations —
    requiring condensate drains to connect to a visible, approved outlet — prevented
    installation at approximately 10–15% of participant homes, with a further 10–20%
    excluded due to space constraints for the storage tank and compressor.
  lesson_learnt: Before designing an appliance installation program, audit all applicable
    state-specific regulatory variations — SA's unique condensate drain requirement
    alone blocked 10–15% of sites; identifying this earlier would allow program planners
    to adjust eligibility screening and set realistic installation targets.
