    a 33c/day rebate for responding to flexible import limits via HEMS — required
    manual, off-market communication between the DNSP and partner retailers to administer,
    which is resource-intensive and not scalable to a large program.
  lesson_learnt: DNSP-to-retailer tariff pass-through models for demand flexibility
    rewards require integration with MSATS or a standardised credit mechanism to be
    scalable — pilot programs should treat the manual administration process as a
    temporary workaround and plan the pathway to automated settlement before moving
    to scale.
