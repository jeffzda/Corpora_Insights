- record_id: ARENA-DLV-62666
  source_title: SA Power Networks, South Australia, Electrification and Demand Flexibility
    - Energy Masters - Lessons Learnt Report 1
  publish_date: 2024-09
  project_name: Energy Masters
  what_happened: The two partner retailers (EnergyAustralia and Amber) have fundamentally
    different business models — a standard time-of-use retail offer versus a wholesale-price
    subscription model — making it difficult to present side-by-side comparisons to
    consumers and creating no benchmark for VPP offers.
  lesson_learnt: When pairing retailers with incompatible pricing models in a single
    pilot, develop a consumer comparison framework before recruitment materials are
    finalised — the absence of standardised benchmarks for wholesale versus traditional
    retail offers limits informed consumer decision-making and complicates communications.
