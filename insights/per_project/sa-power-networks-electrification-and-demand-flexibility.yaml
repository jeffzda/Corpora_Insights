  what_happened: The complex household segmentation design — requiring diverse appliance
    combinations, retail offers and demographics to enable statistically valid comparisons
    — created a difficult recruitment challenge. The need to control cohort composition
    added significant time and cost to recruitment planning, with uncertainty about
    whether all segmentation objectives could be achieved with the available applicant
    pool.
