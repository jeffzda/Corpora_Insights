  publish_date: 2024-09
  project_name: Energy Masters
  what_happened: The project trademarked the 'Energy Masters' brand (wordmark and
    logo) to protect consumers and the project from misrepresentation by unethical
    operators seeking to exploit project subsidies and benefits — a risk identified
    as historically prevalent in the residential energy industry. Trademarking added
    both time and cost to the project.
  lesson_learnt: Consumer-facing pilots offering subsidies or exclusive benefits should
    trademark the project brand early in delivery — misrepresentation by third parties
    is a material risk in the residential energy sector, and having trademark protection
    in place before public promotion significantly reduces legal exposure.
