  source_title: SA Power Networks, South Australia, Electrification and Demand Flexibility
    - Energy Masters - Lessons Learnt Report 1
  publish_date: 2024-09
  project_name: Energy Masters
  what_happened: HEMS integration required time-consuming, bespoke development work
    for each CER brand and model due to the absence of common technical standards
    across the market. Even devices claiming compliance with the voluntary Sunspec
    alliance standard showed different levels of actual alignment, meaning bespoke
    integration was still required.
  lesson_learnt: Do not rely on voluntary interoperability standards (such as Sunspec)
    to eliminate integration effort — in practice, OEM implementations vary significantly,
    and bespoke integration work will still be needed for each device. Factor this
    into development timelines and select only OEMs with contacts available for intensive
    integration collaboration.
