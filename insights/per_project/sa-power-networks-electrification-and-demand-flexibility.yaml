  source_title: SA Power Networks - Energy Masters - Lessons Learnt Report 2
  publish_date: 2026-01
  project_name: Energy Masters
  what_happened: Installing heat pump hot water systems required both licensed electricians
    and licensed plumbers, but the training unit enabling plumbers to disconnect and
    reconnect electrical hot water systems (UEERL0004) was not available in South
    Australia, forcing some subcontractors to travel interstate to obtain the qualification.
  lesson_learnt: Before deploying heat pump hot water systems at scale, confirm availability
    of all cross-trade licensing requirements in each jurisdiction — where critical
    training is unavailable locally (as with UEERL0004 in SA), advocate for its introduction
    early to avoid installer shortages and interstate travel costs.
