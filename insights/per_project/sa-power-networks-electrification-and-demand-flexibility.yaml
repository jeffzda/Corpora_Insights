- record_id: ARENA-DLV-62667
  source_title: SA Power Networks, South Australia, Electrification and Demand Flexibility
    - Energy Masters - Lessons Learnt Report 1
  publish_date: 2024-09
  project_name: Energy Masters
  what_happened: Technical fragmentation between OEMs limited the number of compatible
    device brands the HEMS could integrate with, as intensive OEM collaboration was
    required during development. This reduced the pool of eligible households (who
    needed specific appliance brands) and required a higher volume of expressions
    of interest to secure a sufficient number of households with suitable appliance
    combinations.
  lesson_learnt: In HEMS or CER orchestration pilots, the need for intensive OEM collaboration
    during integration will constrain the number of compatible device brands — project
    teams should map eligible household appliance combinations against the integration
    roadmap early and set household recruitment targets accordingly, including a substantial
    expression-of-interest buffer.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: network business
  delay_category: stakeholder/land/community
  failure_mode: unvalidated integration
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: The pilot built in a higher expression-of-interest volume requirement
    to ensure a sufficient number of households with compatible appliance combinations
    could be enrolled.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: DER
  source_pages: &id045
