  project_name: Energy Masters
  what_happened: The selected heat pump hot water system could not be fully integrated
    with the HEMS because heat pumps are not designed to be switched on and off at
    the power supply (appliance memory is wiped), and the unit lacked DRED control.
    No retrofit solution analogous to the Sensibo device used for air-conditioning
    exists for heat pump hot water systems. Retrofitting also risked voiding product
    warranties and breaching the Retailer Energy Productivity Scheme rules.
  lesson_learnt: Verify DRED or API controllability for each appliance type — especially
    heat pump hot water systems — before finalising pilot design. The AS-4755 standard
    exists but has low OEM adoption, and retrofit options carry warranty and regulatory
    compliance risks that can block integration entirely.
