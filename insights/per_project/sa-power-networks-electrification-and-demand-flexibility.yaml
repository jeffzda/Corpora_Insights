  project_name: Energy Masters
  what_happened: Sites with three-phase solar inverters — which the project had not
    intended to include — passed through eligibility screening due to gaps in the
    checking process, requiring unanticipated 'double-HEMS' setups that added cost,
    installation time, and switchboard space requirements.
