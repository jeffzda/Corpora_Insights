  publish_date: 2024-09
  project_name: Energy Masters
  what_happened: Partners experienced difficulty understanding the process for registering
    flexible demand activities under the Retailer Energy Productivity Scheme (REPS),
    as the scheme was designed for energy efficiency rather than flexible demand participation.
    This created compliance uncertainty and timeline risk for the pilot.
  lesson_learnt: Engage early with energy efficiency certificate scheme administrators
    (such as REPS) to clarify registration processes for flexible demand activities
    — these schemes were not designed with flexible demand in mind, and late engagement
    risks delaying compliance and therefore pilot timelines.
