  evidence_excerpt: This limitation is likely to significantly impact the volume of
    households that are eligible to participate, as each household will require specific
    appliance brands to participate. This has a flow-on risk to household recruitment,
    requiring a higher volume of households to express their interest in participating
    in the pilot.
