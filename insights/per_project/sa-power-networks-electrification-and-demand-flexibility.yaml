  what_happened: A proactively communicated waitlist of non-selected EOI applicants
    allowed the project to efficiently replace withdrawn households and capitalise
    on new technical opportunities — for example, re-inviting 50 previously ineligible
    households when a new AlphaESS battery integration was enabled in September 2025.
    Approximately 400 waitlist households were re-invited in total.
  lesson_learnt: Build and actively maintain a consented waitlist from the outset
    of household recruitment programs — it enables low-cost replacement of withdrawals,
    converts technical advances into immediate participation growth, and avoids the
    cost and delay of reopening public recruitment rounds.
