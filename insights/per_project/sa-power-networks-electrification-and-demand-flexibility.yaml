- record_id: ARENA-DLV-62158
  source_title: SA Power Networks - Energy Masters - Lessons Learnt Report 2
  publish_date: 2026-01
  project_name: Energy Masters
  what_happened: Modbus communication between the HEMS and solar/hybrid inverters
    occasionally dropped out due to weak Wi-Fi signals or configuration errors, rendering
    inverters offline and invisible to the Clipsal Cortex platform and requiring site
    revisits.
