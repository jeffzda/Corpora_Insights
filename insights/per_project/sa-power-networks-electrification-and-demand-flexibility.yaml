  project_name: Energy Masters
  what_happened: Quoting and installation took significantly longer than originally
    anticipated due to the diversity and complexity of South Australian housing stock
    — variations in electrical layouts, meter boxes, roof access, Wi-Fi signal strength,
    and legacy wiring all affected installation duration.
  lesson_learnt: Whole-of-home HEMS installation programs must budget materially more
    time per site than standard electrical work — conduct detailed pre-installation
    site inspections and build rescheduling contingency into the program plan from
    the outset.
