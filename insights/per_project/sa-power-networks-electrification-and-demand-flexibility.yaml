  what_happened: After encountering control issues at a participant site, the project
    discovered that manufacturers other than the specified iStore brand do not officially
    support external dry-contactor control — leading to a decision to configure non-iStore
    heat pumps for monitoring only rather than active HEMS control.
  lesson_learnt: Verify manufacturer-endorsed compatibility with third-party control
    methods (e.g. dry-contactor on/off switching) before including any appliance brand
    in a HEMS integration program — undisclosed warranty and performance concerns
    from OEMs can force a downgrade from active control to monitoring-only, reducing
    program value.
