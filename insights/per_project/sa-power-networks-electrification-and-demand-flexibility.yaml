  what_happened: Targeted marketing campaigns using government subsidy recipient data
    (home battery and EV owners) produced strong over-representation of EV and battery
    owners in the EOI cohort, while higher-cost mainstream marketing reached the broader
    population — resulting in 500 recruited households of which 25–30% were priority
    or low-income customers against a 10% target.
