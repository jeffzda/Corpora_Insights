  source_title: SA Power Networks - Energy Masters - Lessons Learnt Report 2
  publish_date: 2026-01
  project_name: Energy Masters
  what_happened: HEMS installation proved to require a new, specialised skill set
    combining electrical expertise, digital commissioning, CER knowledge, Wi-Fi connectivity
    troubleshooting, and participant education — a role that does not currently exist
    as a recognised trade or training pathway in Australia.
  lesson_learnt: Scale-up programs for whole-of-home HEMS integration will need to
    create formal training pathways — short courses or OEM-led certifications — for
    a new 'HEMS installer' role; programs relying on existing trade categories alone
    will face persistent workforce capability gaps.
