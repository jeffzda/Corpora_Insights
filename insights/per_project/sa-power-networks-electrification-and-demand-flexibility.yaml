- record_id: ARENA-DLV-62151
  source_title: SA Power Networks - Energy Masters - Lessons Learnt Report 2
  publish_date: 2026-01
  project_name: Energy Masters
  what_happened: Over 50% of the approximately 2,000 households that submitted an
    Expression of Interest were ineligible to participate because their existing solar,
    battery, or appliance devices were incompatible with the HEMS platform, due to
    the absence of national interoperability standards.
  lesson_learnt: The lack of nationally consistent behind-the-meter interoperability
    standards is the single largest barrier to scaling CER integration programs —
    establish device compatibility requirements and screen for them at EOI stage to
    avoid losing half your eligible pool before installation begins.
