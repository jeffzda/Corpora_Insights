  source_title: SA Power Networks - Energy Masters - Lessons Learnt Report 2
  publish_date: 2026-01
  project_name: Energy Masters
  what_happened: Participants switching from instantaneous gas hot water to heat pump
    systems frequently held incorrect expectations about system performance — assuming
    instant heating availability — and were surprised by tank size requirements, operating
    modes, and timers, requiring additional education to avoid dissatisfaction.
  lesson_learnt: Heat pump hot water programs must include structured participant
    education covering storage capacity, scheduled operation, physical footprint,
    and efficiency benefits before and at installation — participants transitioning
    from gas often have mental models incompatible with heat pump operation, and unmanaged
    expectations generate support calls and dissatisfaction.
  issue_severity: minor
