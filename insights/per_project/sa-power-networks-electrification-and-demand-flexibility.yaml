  what_happened: The procurement process for a HEMS provider found no off-the-shelf
    product capable of providing all monitoring, control, communication and consumer
    engagement capabilities required by the pilot. Products fell into two camps —
    strong technical capability but weak customer interface, or strong customer interface
    but requiring technical uplift — forcing a significant bespoke HEMS development
    process.
