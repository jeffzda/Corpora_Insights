  evidence_excerpt: The aim of the project is to validate Virtual Power Plants (VPP) as a suitable approach for managing augmentation in low growth, low voltage distribution networks with no adverse impacts
    to network reliability and safety. To do this the project installed VPP at 13 premises to collect data and allow the project's objectives to be validated.
