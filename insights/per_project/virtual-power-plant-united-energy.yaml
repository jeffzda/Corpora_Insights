- record_id: ARENA-DLV-72315
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects - First Edition Results'
  publish_date: '2014'
  project_name: Virtual Power Plant (United Energy)
  what_happened: United Energy initiated a Virtual Power Plant trial (13 premises) to validate whether solar PV paired with controlled battery storage could serve as an incremental, non-network augmentation
    solution for low-growth LV distribution networks, as an alternative to traditional step-change augmentation.
  lesson_farnt: Trialling VPP configurations at small scale (13 premises) before committing to broader non-network augmentation programmes is a prudent approach to validating whether incremental DER-based
    solutions can cost-effectively defer traditional network investment in low-growth LV networks.
  lesson_learnt: Trialling VPP configurations at small scale (13 premises) before committing to broader non-network augmentation programmes is a prudent approach to validating whether incremental DER-based
    solutions can cost-effectively defer traditional network investment in low-growth LV networks.
