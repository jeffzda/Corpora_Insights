  source_title: Advisian Wind & Solar Forecasting for the NEM Final Report
  publish_date: '2021-02-17'
  project_name: Wind & Solar Forecasting for the NEM
  what_happened: 'The project identified a fundamental tension in its objective: optimising
    for forecast accuracy (the stated goal) may not be aligned with minimising individual
    generator FCAS costs if the 4-second CPF performance measures work against frequency
    support. The forecasting models did not incorporate frequency trend or inertia,
    leaving open the question of whether a biased forecast could deliver better commercial
    outcomes.'
  lesson_learnt: Future self-forecasting projects should investigate whether incorporating
    frequency direction and inertia into the model — to produce a strategically biased
    forecast that aids power system frequency stability — would reduce FCAS costs
    more effectively than pure accuracy optimisation; the project objective of 'accurate
    forecast' and the commercial objective of 'lowest FCAS cost' may not be the same
    thing.
