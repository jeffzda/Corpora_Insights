- record_id: ARENA-DLV-27107
  source_title: Advisian Wind & Solar Forecasting for the NEM Final Report
  publish_date: '2021-02-17'
  project_name: Wind & Solar Forecasting for the NEM
  what_happened: An ensemble model architecture — running multiple parallel models
    that switch based on available input data (unconstrained operation, constrained
    operation, and post-constraint ramping) — was found to be the most effective approach
    for producing accurate forecasts across all operating modes of wind and solar
    farms.
  lesson_learnt: Design self-forecasting systems as ensemble models with mode-switching
    logic rather than a single model — this approach handles the distinct data environments
    of constrained and unconstrained operation, and transition periods, delivering
    superior accuracy across all operating states.
  issue_severity: none
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: null
