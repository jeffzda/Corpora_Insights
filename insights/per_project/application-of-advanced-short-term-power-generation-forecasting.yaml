- record_id: ARENA-DLV-27108
  source_title: Advisian Wind & Solar Forecasting for the NEM Final Report
  publish_date: '2021-02-17'
  project_name: Wind & Solar Forecasting for the NEM
  what_happened: The AEMO AWEFS (ANEMOS) forecast for Waterloo Wind Farm exhibited
    heavy negative skewness (−8.24) and very high kurtosis (114.28), meaning it systematically
    over-predicted generation output and was prone to extreme forecast errors — particularly
    in the period immediately after constraints were lifted. The Advisian self-forecast
    showed near-neutral skewness (−0.01) and substantially lower kurtosis (10.52).
  lesson_learnt: Wind self-forecasting models should be evaluated not only on mean
    error metrics but also on skewness and kurtosis of residuals — systematic over-prediction
    bias (negative skewness) inflates Causer Pays Factors and FCAS costs, and a neutrally
    biased model can deliver disproportionately large commercial benefits during extreme
    network events.
