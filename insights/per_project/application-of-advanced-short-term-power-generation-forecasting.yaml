  what_happened: When using the Azure Event Hub to connect with the AEMO API, failure
    to checkpoint data during processing could require reprocessing over one million
    events, making it impossible to submit new forecast values within the required
    5-minute window.
  lesson_learnt: When using Azure Event Hub for AEMO API integration, implement data
    checkpointing during processing to avoid needing to reprocess up to 1 million+
    unexpired events — without this, the system cannot meet the 5-minute forecast
    submission window under failure recovery conditions.
