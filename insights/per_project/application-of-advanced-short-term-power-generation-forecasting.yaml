  publish_date: '2021-02-17'
  project_name: Wind & Solar Forecasting for the NEM
  what_happened: The Ross River Solar Farm self-forecasting model achieved only modest
    improvements over the AEMO ASEFS (ANEMOS) benchmark — 2% on MAE and 8% on RMSE
    during unconstrained periods — falling well short of the gains achieved at the
    wind farm site.
  lesson_learnt: Solar farm self-forecasting models built using only met station and
    SCADA data are unlikely to achieve the same accuracy improvements as wind models;
    additional inputs such as sky camera cloud imagery are needed to meaningfully
    improve solar forecast accuracy.
