  source_title: Advisian Wind & Solar Forecasting for the NEM Final Report
  publish_date: '2021-02-17'
  project_name: Wind & Solar Forecasting for the NEM
  what_happened: Deploying machine learning forecasting models at the edge on Dell
    Edge 5100 Gateways — integrated directly with onsite SCADA systems via Modbus
    — proved effective, with no adverse effects on latency or model performance, and
    provided resilience against internet outages.
  lesson_learnt: 'Edge deployment of machine learning forecasting models is a viable
    and robust approach for renewable energy sites: it reduces bandwidth requirements,
    ensures continuity during internet outages, and does not compromise latency or
    accuracy.'
