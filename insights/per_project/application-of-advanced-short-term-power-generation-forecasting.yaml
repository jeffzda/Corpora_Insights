- record_id: ARENA-DLV-66710
  source_title: Advisian Wind & Solar Forecasting for the NEM Project Lessons Learnt
    2
  publish_date: '2020-04-30'
  project_name: Advisian Wind and Solar Forecasting for the NEM Project
  what_happened: The AEMO API rejected forecast submissions that exceeded the integer-rounded-down
    maximum capacity value — for example, Waterloo Wind Farm's rated capacity of 130.8
    MW was stored as 130 MW, causing rejection of any submission between 130 and 130.8
    MW.
  lesson_learnt: When submitting forecasts to the AEMO API, cap maximum forecast values
    at the integer floor of the registered capacity — the API stores maximum capacity
    as an integer rounded down and will reject any submission exceeding this value,
    even if it is within the actual rated capacity.
