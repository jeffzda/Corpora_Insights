- record_id: ARENA-DLV-27105
  source_title: Advisian Wind & Solar Forecasting for the NEM Final Report
  publish_date: '2021-02-17'
  project_name: Wind & Solar Forecasting for the NEM
  what_happened: Many wind and solar farm sites historise SCADA data at infrequent
    intervals (5 or 10 minutes), which is insufficient to train a 5-minute ahead self-forecasting
    model to the required accuracy. The project required at least 1-minute interval
    data.
  lesson_learnt: Operators planning to adopt self-forecasting should immediately begin
    historising SCADA data at 1-minute intervals — sites that delay this will have
    insufficient historical data to train an accurate model when they are ready to
    deploy.
