  publish_date: '2020-04-30'
  project_name: Advisian Wind and Solar Forecasting for the NEM Project
  what_happened: Wind farm operating constraints meant wind power data could not be
    used as a model input during constrained periods, degrading forecast accuracy
    unless a parallel model using external meteorological inputs was developed and
    switched to automatically.
  lesson_learnt: Design wind forecasting algorithms with a parallel constraint-aware
    model — when the wind farm is curtailed, switching to a model driven by wind speed
    and direction rather than power output is essential for delivering accurate forecasts
    when constraints are lifted.
