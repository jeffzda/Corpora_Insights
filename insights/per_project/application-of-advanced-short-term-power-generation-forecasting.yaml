- record_id: ARENA-DLV-27104
  source_title: Advisian Wind & Solar Forecasting for the NEM Final Report
  publish_date: '2021-02-17'
  project_name: Wind & Solar Forecasting for the NEM
  what_happened: Several solar irradiance variables (diffuse irradiance, ambient relative
    humidity, wind speed, and wind direction) were missing from the Ross River Solar
    Farm dataset for the first three months (February to April 2019), requiring those
    variables to be omitted from the model. Active power was not captured at all in
    the dataset, requiring a proxy calculation using gross power multiplied by an
    efficiency loss factor.
  lesson_learnt: Data quality gaps in historical SCADA datasets — including missing
    sensor channels and absent active power readings — constrain model inputs and
    force proxy approaches; proponents should audit data completeness before model
    development begins and address gaps proactively.
  issue_severity: moderate
  project_type: software/data/digital
