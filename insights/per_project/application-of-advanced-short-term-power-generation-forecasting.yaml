  publish_date: 2019-10
  project_name: Advisian Wind and Solar Forecasting for the NEM Project
  what_happened: Exogenous variables including AEMO dispatch constraints and maintenance
    outages artificially suppressed wind farm power output, requiring those periods
    to be removed from the model training dataset, resulting in data gaps that may
    reduce model accuracy.
  lesson_learnt: Identify and filter exogenous variables (such as network constraints
    and maintenance outages) that artificially suppress generation output before training
    forecasting models — failure to do so will corrupt training data, but removal
    creates gaps; plan for periodic model retraining in production to recover accuracy
    incrementally.
