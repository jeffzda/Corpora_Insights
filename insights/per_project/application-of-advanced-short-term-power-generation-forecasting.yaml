  what_happened: Estimated annualised FCAS cost savings from the wind self-forecasting
    algorithm were $45,000–$100,000 per year for a 100 MW wind facility, while savings
    for the solar algorithm were only $5,000–$20,000 per year, reflecting the much
    smaller accuracy improvement achieved at the solar farm. Savings were noted to
    be potentially much larger during extreme pricing events.
  lesson_learnt: The financial case for self-forecasting is substantially stronger
    for wind than solar under current model capabilities — project developers should
    quantify FCAS cost exposure when assessing the return on investment of deploying
    self-forecasting, noting that benefits during extreme events may be materially
    underestimated by average-based calculations.
