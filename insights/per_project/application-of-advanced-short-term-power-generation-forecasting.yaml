- record_id: ARENA-DLV-27103
  source_title: Advisian Wind & Solar Forecasting for the NEM Final Report
  publish_date: '2021-02-17'
  project_name: Wind & Solar Forecasting for the NEM
  what_happened: Sky cameras procured for solar farm cloud imagery encountered multiple
    technical commissioning problems — difficulties integrating with the customer's
    IT network, firmware issues for daytime imaging, and overheating of the camera
    control unit — and were ultimately excluded from the forecasting model. COVID-related
    interstate travel restrictions also contributed to logistical problems.
  lesson_learnt: When procuring sky cameras for solar forecasting, specify commercially
    available digital cameras designed for daytime imaging in Australian conditions
    rather than scientific cameras — they offer simpler integration and greater reliability,
    reducing commissioning risk.
