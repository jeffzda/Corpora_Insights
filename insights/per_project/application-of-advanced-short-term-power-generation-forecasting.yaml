  what_happened: Sky cameras for solar forecasting were ordered with filters tested
    for UK daylight conditions; upon commissioning in Australia the images were overexposed
    due to much higher solar brightness, requiring new lens filters to be ordered.
    Delivery of replacement filters was significantly delayed due to COVID-19.
