  intervention_note: Developed two parallel models — one using wind power during unconstrained
    periods and one using external wind speed/direction inputs during constrained
    periods — with automatic switching logic.
  transferability: moderate
  delay_magnitude: null
  technology_domain: wind
  source_pages: &id020
  - 1
  evidence_excerpt: During periods where the wind farm is operating under constraint,
    the wind power cannot be used as an input to the model. As such we have developed
    two models, one using Wind Power and during non-constrained periods and the other
    which relies on external factors such as wind speed and direction. These two models
    run in parallel and the algorithm switches between models depending on whether
    a constraint is active.
