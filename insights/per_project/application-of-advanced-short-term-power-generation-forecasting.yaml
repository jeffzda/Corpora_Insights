  source_title: Advisian Wind & Solar Forecasting for the NEM Final Report
  publish_date: '2021-02-17'
  project_name: Wind & Solar Forecasting for the NEM
  what_happened: The self-forecasting algorithm demonstrated particularly strong improvement
    over ANEMOS in the period immediately after AEMO-imposed generation constraints
    were lifted, with the wind farm showing 63.2% MAE and 74.6% RMSE improvement during
    constrained periods — a substantially larger gain than during normal unconstrained
    operation.
  lesson_learnt: Post-constraint ramping periods represent the highest-value use case
    for self-forecasting over centralised AEMO forecasts — projects evaluating self-forecasting
    ROI should weight this period heavily, as extreme CPF deviations at constraint
    release disproportionately inflate total FCAS liability.
