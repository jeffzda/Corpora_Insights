  - 8
  - 20
  evidence_excerpt: Producing a forecast that is accurate across all operating modes
    of a wind or solar farm is best achieved by running multiple models in parallel,
    whereby the algorithm switches between models based on available input data...
    The combination of these different models running in parallel means that our algorithm
    can respond more accurately when constraints are active and lifted by switching
    between models.
