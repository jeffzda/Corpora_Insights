- record_id: ARENA-DLV-27757
  source_title: Advisian Wind & Solar Forecasting for the NEM Project Lessons Learnt
    1
  publish_date: 2019-10
  project_name: Advisian Wind and Solar Forecasting for the NEM Project
  what_happened: Wind farm data exhibited high degrees of seasonality requiring more
    complex modelling approaches, and the training datasets were large; together these
    factors created substantial computational demands that could not be met within
    reasonable timeframes on standard infrastructure.
  lesson_learnt: Plan for scalable cloud-based computing resources when developing
