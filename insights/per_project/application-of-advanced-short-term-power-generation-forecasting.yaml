  what_happened: The AEMO API documentation contained technical errors and lacked
    business process information, including incorrect header naming conventions and
    inconsistent authentication guidance, causing integration delays.
  lesson_learnt: When integrating with the AEMO API, independently verify all header
    names, authentication methods, and case-sensitive fields against a working implementation
    — the published documentation contained errors (e.g. 'BasicAuth' vs standard 'Authorization'
    header, incorrect 'Content-type' casing) that would cause silent failures if followed
    literally.
