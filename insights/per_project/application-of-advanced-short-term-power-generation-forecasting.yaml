  what_happened: Self-forecasting under the AEMO framework requires ongoing active
    management by the project owner, including maintaining MSATS access, validating
    SCADA signals, and continuously monitoring forecast performance to avoid suspension
    if forecasts underperform AWEFS.
  lesson_learnt: Self-forecasting is not a set-and-forget solution — project owners
    must actively maintain MSATS access, verify SCADA signal integrity, and monitor
    forecast accuracy in real time, as sustained underperformance relative to AWEFS
    risks forecast suspension by AEMO.
