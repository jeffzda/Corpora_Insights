- record_id: ARENA-DLV-70356
  source_title: Kidston Pumped Hydro Lessons Learnt 6
  publish_date: 2023-01
  project_name: Kidston Pumped Storage Hydro Project
  what_happened: Sensitive electronic equipment stored onsite required climate-controlled
    temporary buildings to maintain humidity and temperature within manufacturer-specified
    limits. Preservation requirements were defined in advance through a management
    plan covering receipt, inspection, quarantine, and long-term storage protocols,
    including monthly checks for open-air storage and quarterly checks for covered
    storage.
  lesson_learnt: Identify and plan for equipment-specific preservation requirements
    — including climate control infrastructure for sensitive electronics — before
    components arrive on site; failure to have appropriate storage infrastructure
    ready risks equipment damage that can delay installation and require costly rectification.
