  what_happened: The approach to connecting to the Ergon Energy distribution network
    for 8MVA construction power was considered straightforward pre-financial close,
    but post-financial close the connection became significantly complicated due to
    the poor condition of Ergon's existing distribution network and a shortage of
    Ergon staff available to design and execute the works. A diesel generator and
    transformer system had to be installed as an interim power supply.
