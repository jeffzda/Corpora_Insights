- record_id: ARENA-DLV-12756
  source_title: Genex Kidston Pumped Hydro Energy Storage Lessons Learnt Report No.12
  publish_date: 2024-12
  project_name: Kidston Pumped Storage Hydro Project (K2-Hydro)
  what_happened: Installing secondary standpipes separately from primary standpipes
    after primary probing results were known added significant time to the cycle,
    because each standpipe installation required a minimum 24-hour curing time (48
    hours if a re-grout was needed). This sequential approach extended the overall
    probe-grout-drill-blast cycle.
  lesson_learnt: Install all primary and secondary standpipes (up to twenty in total)
    simultaneously rather than sequentially — the 24-hour minimum curing time per
    standpipe installation makes sequential installation costly in schedule terms,
    and pre-installing secondary standpipes eliminates the need to return and re-drill
    later.
