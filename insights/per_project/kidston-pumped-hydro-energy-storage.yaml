- record_id: ARENA-DLV-24256
  source_title: Kidston Pumped Hydro Lessons Learnt 4
  publish_date: 2022-06
  project_name: Kidston Pumped Storage Hydro Project
  what_happened: COVID-19 disrupted the global manufacture and shipping of critical
    project components, including HDPE liner (sourced from Taiwan) and embedded generator
    components (from India and China). The project mitigated this by bringing forward
    orders as much as practicable and building significant float into the construction
    program.
  lesson_learnt: For projects with long-lead international supply chains, bring forward
    component orders as early as practicable and build explicit schedule float to
    absorb COVID-19 or other shipping disruptions. Proactive procurement and schedule
    buffering are more reliable mitigations than reactive responses once supply disruption
    materialises.
  issue_severity: minor
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: procurement
  proponent_type: project developer
  delay_category: procurement/supply chain
  failure_mode: execution & logistics
  outcome_class: delayed but recoverable
  secondary_failure_mode: null
  intervention_note: Orders for HDPE liner and embedded generator components were
    brought forward as early as practicable, and the construction program was structured
    with significant float to absorb COVID-19-related shipping delays.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: pumped hydro
  source_pages: &id044
  - 5
  evidence_excerpt: Where possible, the Project has brought forward orders as much
    as reasonably practicable to ensure the product is available on site when required.
    This includes HDPE Liner for Wises Dam (from Taiwan) and the embedded components
    required for the generators (from India and China, where possible). The program
    contains significant float to absorb any delays that may arise from COVID-19 or
    otherwise relating to the shipping of components to site.
