  what_happened: At Kidston, the reamer head was removed at the surface after breaking
    through rather than being lowered back down the shaft to the underground chamber,
    saving significant time and reducing the risk of the reamer head catching on the
    shaft wall during lowering.
  lesson_learnt: Remove the reamer head at the surface after breakthrough rather than
    lowering it back underground — at 250m depth, reattaching drill strings to lower
    the head and then removing them is time-consuming, and surface removal also eliminates
    the risk of the reamer catching on the shaft wall.
