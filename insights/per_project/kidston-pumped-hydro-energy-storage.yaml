- record_id: ARENA-DLV-35404
  source_title: Kidston Pumped Hydro Lessons Learnt 7
  publish_date: 2023-03
  project_name: Kidston Pumped Storage Hydro Project
  what_happened: Following the water ingress event, the project team explored tightening
    MAT geometry parameters (steeper grade, tighter radius) to minimise the length
    of the realigned tunnel, but discovered this would require fundamentally different
    and more complex transportation methodologies for delivering large pump-turbines
    and transformers to the underground cavern, introducing significant additional
    risk to timetable and costs.
  lesson_learnt: When considering MAT geometry changes to work around unexpected ground
    conditions, conduct a holistic assessment of the full transportation logistics
    chain — including technical, safety, and construction logistics risks — for delivering
    heavy machine components before committing to revised geometry; shorter is not
    always better if it compromises equipment delivery.
  issue_severity: major
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: close-out/post-project review
  proponent_type: project developer
  delay_category: construction/installation
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: execution & logistics
  intervention_note: An additional construction Adit 5 was introduced to maintain
    access to lower powerhouse cavern sections and cable/intake shafts independently
    of the MAT2 excavation progress, protecting the critical path.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: pumped hydro
  source_pages:
  - 6
  - 7
  - 16
  - 17
  evidence_excerpt: The key lesson learnt is that, whilst challenging initial assumptions
    was important in an effort to mitigate the effects of the water ingress event
    by having the shortest possible MAT route, a holistic assessment needs to be conducted
    as to the impact of the transportation mode required to bring in the pumped turbines,
    transformers and associated equipment down the MAT, and a re-assessment of the
    risk from both technical, safety and construction logistics perspectives needs
    to be fully understood.
  confidence_note: secondary_failure_mode of governance/coordination failure applied
    because the initial design review did not adequately flag the transportation constraint
    as a binding constraint on geometry options. Canonical record merged from 3 source
