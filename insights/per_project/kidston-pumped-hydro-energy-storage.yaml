  what_happened: The Wises Dam water balance analysis determined that the scheme is
    in a water deficit condition, requiring water to be introduced from Kidston Dam
    (~15km away) via an existing raw water pipeline rather than discharging from Wises
    Dam to the Copperfield River. An 18-month sampling programme of the Copperfield
    River was required to establish background water chemistry before the regulatory
    body would set final water discharge criteria.
  lesson_learnt: Water balance and discharge approval timelines for PSH projects using
    mine voids can be lengthy — proponents should initiate background water quality
    sampling programmes as early as possible in the development phase, as 18+ months
    of baseline data collection may be required before regulators will issue discharge
    criteria, which can become a critical path item.
