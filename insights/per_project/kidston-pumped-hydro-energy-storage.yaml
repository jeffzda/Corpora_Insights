- record_id: ARENA-DLV-12751
  source_title: Genex Kidston Pumped Hydro Energy Storage Lessons Learnt Report No.12
  publish_date: 2024-12
  project_name: Kidston Pumped Storage Hydro Project (K2-Hydro)
  what_happened: During excavation of the tailrace tunnels, high-pressure water ingress
    was encountered, with water pressures up to 180m head in CA02 and up to 120m head
    in the tailrace tunnels, with inflows exceeding 2000L/minute from single standpipe
    holes. The tunnel alignment was fixed so a realignment (as was done for the Main
    Access Tunnel in 2022) was not possible, requiring a modified drill-and-blast
    sequence incorporating standpipes, probing, and pressure grouting to manage water
    ahead of the face.
  lesson_learnt: Having good baseline geotechnical information and pre-planned construction
    techniques for managing high-pressure water ingress is critical — when poor ground
    conditions are anticipated, water management methods (standpipes, probing, grouting)
    must be ready for immediate deployment so tunnelling can safely progress without
    costly realignment or stoppage.
  issue_severity: major
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: construction/installation
  proponent_type: project developer
  delay_category: construction/installation
  failure_mode: unvalidated technical assumptions
  outcome_class: delayed but recoverable
  secondary_failure_mode: poor scoping
  intervention_note: Modified the standard drill-and-blast sequence to include standpipe
    installation, probe drilling up to 24m ahead of the face, and pressure grouting
    under a 'probe and grout' regime, successfully allowing the tunnels to advance
    through high-pressure water zones.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: pumped hydro
  source_pages:
  - 4
  - 5
  - 6
  - 7
  - 8
  - 15
  evidence_excerpt: Tailrace Tunnel 1 and 2 – Maximum water pressure of 120m head,
    and inflows exceeding 2000L/minute (>33L/s) from single standpipe holes of approximately
    45mm diameter. Unlike when the Main Access Tunnel (MAT) encountered water in September
    2022 and a realignment of the MAT was undertaken, the alignment of the tailrace
    tunnels was fixed and tunnelling through high water pressure under a probe and
    grout regime was the preferred approach which was successfully implemented in
    the excavation of the tunnels.
  confidence_note: issue_severity set to major given >2000L/min inflows requiring
    a fundamental change to the construction methodology; delay magnitude not quantified
