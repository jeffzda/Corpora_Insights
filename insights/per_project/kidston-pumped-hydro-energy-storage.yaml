- record_id: ARENA-DLV-12759
  source_title: Genex Kidston Pumped Hydro Energy Storage Lessons Learnt Report No.12
  publish_date: 2024-12
  project_name: Kidston Pumped Storage Hydro Project (K2-Hydro)
  what_happened: Tunnelling through high-pressure water zones required a dynamic,
    daily decision-making process that could not be pre-planned far in advance. The
    team implemented a Permit to Tunnel (PTT) system combined with real-time face
    mapping, survey scans, and continuous updates to the geological model to manage
    this complexity and ensure safe and informed daily decisions.
  lesson_learnt: For tunnelling through unpredictable high-pressure water-bearing
    ground, a daily permit-to-tunnel system combined with real-time updates to the
    geological model (incorporating face mapping, survey scans, and probe hole data)
    provides the structured decision-making forum needed to safely manage dynamic
    ground conditions — it allows engineering, management, and supervisors to agree
    works daily based on the best available geological picture.
  issue_severity: moderate
  project_type: storage
  project_scale_band: utility/large-scale
  lifecycle_phase: construction/installation
  proponent_type: project developer
  delay_category: null
  failure_mode: coordination & stakeholders
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: Implemented a daily Permit to Tunnel (PTT) system with mandatory
    review meetings, supplemented by real-time geological model updates integrating
    face mapping, survey scans, and probe hole data to guide daily decisions.
  transferability: moderate
  delay_magnitude: null
  technology_domain: pumped hydro
  source_pages: &id027
  - 14
  - 15
  evidence_excerpt: The permit to tunnel (PTT) system was used daily to ensure that
    agreed tasks were authorised for the following 24 hours. This provided a forum
    for management, engineering, and supervisors to meet and review the previous works
    undertaken and agree the future works to be undertaken. Advancing the tunnel using
    the probe and grout regime resulted in at times a dynamic decision-making process.
