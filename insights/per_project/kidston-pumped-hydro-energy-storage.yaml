- record_id: ARENA-DLV-70357
  source_title: Kidston Pumped Hydro Lessons Learnt 6
  publish_date: 2023-01
  project_name: Kidston Pumped Storage Hydro Project
  what_happened: Port storage time was minimised by using a just-in-time delivery
    process, with critical equipment overseen at port by specialist logistics personnel.
    Equipment was wrapped at the fabrication warehouse to comply with Andritz Hydro
    preservation requirements before shipping, and items were either containerised
    or stored in break-bulk facilities depending on size and weight.
  lesson_learnt: Minimise port dwell time through just-in-time scheduling and deploy
    specialist logistics personnel at the port to oversee critical equipment — extended
    port storage increases preservation risks and costs, particularly for large or
    sensitive components that cannot be containerised.
  issue_severity: none
  project_type: multi-technology/hybrid
  project_scale_band: utility/large-scale
  lifecycle_phase: procurement
