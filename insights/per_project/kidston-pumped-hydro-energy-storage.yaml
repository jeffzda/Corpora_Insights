  what_happened: Construction of the 186km transmission line corridor required real-time
    access and clearing management across diverse terrain, with localised field constraints
    (including DAF-regulated waterway crossings requiring specific engineering designs)
    that could not all be captured in advance desktop planning.
  lesson_learnt: Long linear transmission corridor projects should integrate LiDAR
    survey and GIS technology to give field crews real-time constraint information
    and enable rapid in-field feedback to the design team — static upfront design
    is insufficient for 186km-scale projects where localised conditions routinely
    require design modification.
