  what_happened: The project implemented the Insite Logistics Management System (LMS)
    to track components from the factory in China and India through to port, site
    laydown, and ultimately underground to the powerhouse operating floor. A dedicated
    engineering team was tasked with staging plans to maximise fitout efficiency and
    ensure components are positioned in logical installation order.
