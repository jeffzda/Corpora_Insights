  project_name: Kidston Pumped Storage Hydro Project (K2-Hydro)
  what_happened: The transmission line infrastructure was oversized relative to K2-Hydro's
    immediate requirements, with excess capacity deliberately built in to support
    Stage 3 developments (200MW wind project and up to 270MW solar farm) at the Kidston
    Clean Energy Hub.
  lesson_learnt: Where a remote energy hub has a pipeline of future generation projects,
    oversizing transmission infrastructure at initial construction to accommodate
    future stages avoids the cost and disruption of subsequent augmentation — this
    shared-infrastructure approach should be modelled explicitly at feasibility stage
    with cost allocation agreed between current and future projects before financial
    close.
