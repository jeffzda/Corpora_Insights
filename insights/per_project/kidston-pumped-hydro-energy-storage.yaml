  what_happened: For all four shafts at Kidston, the rotary vertical drilling system
    (RVDS) was used for pilot hole drilling, achieving a positional accuracy of up
    to 0.1% (250mm over 250m), which the project team assessed as essential for maintaining
    shaft verticality at depths up to 252m.
  lesson_learnt: Specify and use state-of-the-art self-correcting drilling positioning
    equipment such as RVDS for deep shaft pilot holes — at Kidston, achieving the
    required shaft verticality over 250m depth would not have been possible with conventional
    methods, and positional accuracy of 0.1% was only achievable with RVDS.
