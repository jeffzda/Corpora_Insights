  what_happened: Following an AEMC rule change to the National Electricity Rules,
    the K2X substation was reconfigured from a Dedicated Connection Asset (DCA) to
    a Designated Network Asset (DNA), transferring responsibility for its design,
    build, operation and maintenance from the project proponent (Beon under D&C contract)
    to Powerlink. This also shifted the project's connection point from Mt Fox to
    the K2X substation.
  lesson_learnt: NER rule changes during construction can materially alter connection
    asset ownership, scope boundaries, and connection points — project agreements
    should include change-of-law provisions that explicitly allocate cost and schedule
    risk for regulatory reclassification of connection assets.
