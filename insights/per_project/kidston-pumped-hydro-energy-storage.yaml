- record_id: ARENA-DLV-10651
  source_title: Kidston Pumped Hydro Energy Storage Construction Report
  publish_date: 2022-11
  project_name: Kidston Pumped Storage Hydro Project (K2-Hydro)
  what_happened: The K2-Hydro project reached financial close in May 2021 after a
    development period beginning in 2014, with construction underway across a 3.75-year
    programme targeting operations in late 2024. The project is a FOAK globally —
    the first repurposing of an abandoned gold mine for large-scale pumped storage
    hydro, and the first PSH project in the NEM in over 40 years.
  lesson_learnt: Repurposing existing mine infrastructure (voids as reservoirs, tailings
    area for solar) can significantly reduce civil scope and capital cost for pumped
    hydro projects — future developers should actively assess abandoned mine sites
    as candidate PSH locations rather than seeking greenfield sites.
