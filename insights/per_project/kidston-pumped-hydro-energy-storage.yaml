  source_title: Kidston Pumped Hydro Lessons Learnt 2
  publish_date: '2021-12-02'
  project_name: Kidston Pumped Storage Hydro Project
  what_happened: Refurbishment of the existing Oaks Rush Accommodation Camp uncovered
    unplanned structural, electrical, and code compliance deficiencies requiring additional
    variations. Below-ground service strikes also occurred during excavation despite
    desktop searches and vacuum excavation at intervals, due to variability in depth
    and plan location of existing services.
  lesson_learnt: Use vacuum excavation techniques for all excavation near high-risk
    services — not just as a spot-check method — because variability in existing service
    installation depth and location means interval potholing alone is insufficient
    to prevent strikes.
