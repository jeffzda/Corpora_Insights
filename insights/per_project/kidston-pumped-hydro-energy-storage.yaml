  - 13
  evidence_excerpt: A lesson learned was that it is always advisable to start grouting
    with a highly fluid grout mix as this will not only ensure the highest initial
    penetration into the rock mass but will also lubricate the hole to maintain grout
    flow. It is far easier to then thicken the grout mix on grouting parameters (pressure
    and flow) have been observed, rather than start with a thick grout mix and discover
    that the hole and or joints / faults have been blocked by grout that is too thick.
