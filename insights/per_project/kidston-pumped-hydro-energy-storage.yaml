- record_id: ARENA-DLV-12752
  source_title: Genex Kidston Pumped Hydro Energy Storage Lessons Learnt Report No.12
  publish_date: 2024-12
  project_name: Kidston Pumped Storage Hydro Project (K2-Hydro)
  what_happened: A dilated zone of water-bearing rock was encountered ahead of previously
    identified fault zones during tailrace tunnel excavation. The faults themselves
    were dry, acting as a buffer preventing water dissipation, while the water pressure
    in the dilated rock mass remained higher than expected as the Eldridge Pit water
    level dropped, creating a perched water system.
  lesson_learnt: Water pressure in dilated rock mass connected to a surface reservoir
    can behave unexpectedly — faults expected to contain water may instead impede
    pressure dissipation, creating a perched system. Tunnelling teams should not assume
    that surface water level reductions will promptly translate to reduced underground
    water pressure in such geological settings.
  issue_severity: moderate
  project_type: storage
  project_scale_band: utility/large-scale
  lifecycle_phase: construction/installation
  proponent_type: project developer
  delay_category: construction/installation
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Continued tunnelling through the dilated fault zones using the
    probe and grout regime; once the excavation passed the dilated rock mass and corresponding
    fault zones, water pressure reduced and became consistent with the Eldridge Pit
    water level.
  transferability: narrow
  delay_magnitude: not quantified
  technology_domain: pumped hydro
  source_pages: &id022
  - 7
  evidence_excerpt: The lesson learned was that the water pressure in the dilated
    rock mass was highly likely connected to Eldridge Pit at a higher level through
    either ungrouted boreholes or faults / joints and that as the water level reduced
    in Eldridge Pit, the water was unable to dissipate in a timeframe that was consistent
    with the pit water lowering rate and in turn produced a perched water system.
    It was interesting that the faults that were in front of the dilated rock mass
    acted like a buffer to prevent water dissipation, as it was these faults which
    were expected to contain water, whereas in fact, they were dry.
