  source_title: Kidston Pumped Hydro Lessons Learnt 4
  publish_date: 2022-06
  project_name: Kidston Pumped Storage Hydro Project
  what_happened: The Powerlink transmission line required a Ministerial Infrastructure
    Designation (MID) under the Planning Act 2016 (Qld), involving a formal community
    and stakeholder consultation process. Submissions received from landholders, stakeholders
    and the wider community required formal responses and potentially triggered amendments
    to the Ministerial Infrastructure Designation Assessment Report (MIDAR), adding
    complexity and time to the approvals pathway.
  lesson_learnt: Commence the MID approval process immediately upon contract execution
    and undertake early works to gather background data — approval stages are sequential
    with fixed durations for review and public consultation, so late starts directly
    extend the critical path; build adequate time contingency into the approvals phase.
  issue_severity: moderate
  project_type: storage
  project_scale_band: first commercial/FOAK
