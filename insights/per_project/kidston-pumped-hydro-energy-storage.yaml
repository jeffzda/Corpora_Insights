  source_title: Kidston Pumped Hydro Financial Close Report
  publish_date: 2021-08
  project_name: Kidston Pumped Storage Hydro Project (K2-Hydro)
  what_happened: To support a highly geared financing structure (79% debt), the offtake
    was structured as a fixed annuity-style availability payment over 30 years, transferring
    market risk to EnergyAustralia, which enabled NAIF to provide a $610M long-term
    debt facility.
  lesson_learnt: Where a PSH project requires high gearing to be economically viable,
    structure the offtake as a fixed availability-based annuity payment rather than
    a merchant or energy-indexed arrangement — this provides the revenue certainty
    lenders require to support a highly leveraged capital structure.
