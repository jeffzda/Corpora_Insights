  source_title: Genex - Kidston Pumped Storage Hydro Project - Lessons Learnt Report
    9
  publish_date: 2023-12
  project_name: Kidston Pumped Storage Hydro Project (K2-Hydro)
  what_happened: The original design for the HDPE liner substrate specified a conventional
    select fill layer on the upstream embankment face, which carries known constructability
    risks and is vulnerable to erosion and rework if rain occurs before the liner
    is installed. The project team developed an alternative cement screed product
    using waste fines generated by the on-site crushing plant, which provided a rain-resistant,
    environmentally beneficial substrate.
  lesson_learnt: Investigate opportunities to reuse on-site waste materials to create
    substitute construction products — in this case, cement screed made from crusher
    fines replaced a risk-prone select fill layer, reduced erosion rework exposure,
    and consumed waste material that would otherwise have had limited use.
  issue_severity: moderate
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: construction/installation
  proponent_type: project developer
  delay_category: construction/installation
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: An alternative cement screed comprising cement and waste crusher
    fines was developed and applied to the dam face using two long-reach excavators
    working in tandem with a custom screed attachment, replacing the original select
    fill specification.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: pumped hydro
  source_pages: &id089
  - 7
  - 8
  evidence_excerpt: To utilise the by product and reduce construction risk from rework
    of the original design select fill layer, an alternate cement screed product was
    developed comprising a combination of cement and waste fine material to produce
    a low slump cementitious material that could be applied to the upstream dam face.
    This was an environmentally friendly solution as it used waste material which
    would otherwise have had limited use.
  confidence_note: issue_severity moderate — the original design was replaced due
