  project_name: Kidston Pumped Storage Hydro Project (K2-Hydro)
  what_happened: A bespoke dewatering system comprising six 850kW electric pumps on
    a pontoon was designed, manufactured, installed, and commissioned using international
    suppliers to transfer approximately 28GL of water from Eldridge Pit to Wises Dam
    over approximately 200 days. Initial high bearing temperatures in the pumps required
    replacement with a larger bearing arrangement, causing minor downtime that did
    not affect the overall project programme.
  lesson_learnt: For bespoke, multi-supplier pumping systems on critical path dewatering
    operations, integrate supplier expertise across all phases (design, manufacture,
    installation, commissioning) from the outset; minor mechanical issues such as
    bearing failures can be managed without programme impact when the commissioning
    team and supply chain are well-coordinated.
