- record_id: ARENA-DLV-16603
  source_title: Genex - Kidston Pumped Storage Hydro Project - Lessons Learnt Report
    10
  publish_date: 2024-02
  project_name: Kidston Pumped Storage Hydro Project (K2-Hydro)
  what_happened: Raisebore shaft reaming operations require frequent halting to remove
    cuttings from the shaft base; failure to monitor and remove cuttings creates a
    risk of shaft choking and uncontrolled release of material into the underground
    works. On previous (reference) projects, shaft choking has resulted in cuttings
    mobilising with enough force to transport equipment along tunnel drives.
  lesson_learnt: Continuously monitor the volume of cuttings deposited against the
    theoretical volume of ground reamed, and halt reaming frequently to muck out —
    failure to do so risks an uncontrolled, high-energy release of cuttings into underground
    works, as has occurred on other projects. Optimise cutterhead void patterns to
    produce gravel-sized particles that fall freely and do not bind in the shaft.
