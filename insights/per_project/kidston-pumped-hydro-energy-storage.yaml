  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: coordination & stakeholders
  intervention_note: Powerlink prepared and submitted a MIDAR, undertook extensive
    community and stakeholder consultation, and was targeting finalisation of the
    MID approvals package by 15 June 2022.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: pumped hydro
  source_pages:
