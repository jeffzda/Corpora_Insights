- record_id: ARENA-DLV-12757
  source_title: Genex Kidston Pumped Hydro Energy Storage Lessons Learnt Report No.12
  publish_date: 2024-12
  project_name: Kidston Pumped Storage Hydro Project (K2-Hydro)
  what_happened: 'In some sections where tertiary and quaternary standpipes were required
    and water was encountered within 10 metres of the face near known faults, a standard
    full-advance blast would have been unsafe. A ''belt and braces'' approach was
    adopted: the face was drilled to full blast length (4.8m), back-grouted with cementitious
    grout, then redrilled to allow only a 2m advance, ensuring no water-bearing features
    missed by probing and grouting were exposed in a single advance.'
  lesson_learnt: When advancing through zones with known faults, persistent water
    at close range, and high standpipe orders (tertiary/quaternary), reduce blast
    advance to 2m and back-grout full-depth drill holes before redrilling — this 'belt
    and braces' approach provides a final check that prior probe and grouting has
    not missed any water-bearing features.
  issue_severity: moderate
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: construction/installation
  proponent_type: project developer
  delay_category: construction/installation
  failure_mode: execution & logistics
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Drilled the face to full blast pattern depth, back-grouted all
    holes with cementitious grout, then redrilled to permit a 2m advance only, ensuring
    any water-bearing features not captured by earlier grouting would be identified
    before a full advance.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: pumped hydro
  source_pages:
