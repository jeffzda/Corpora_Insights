- record_id: ARENA-DLV-15202
  source_title: Kidston Pumped Storage Hydro Project - Lessons Learnt Report
  publish_date: 2023-07
  project_name: Kidston Pumped Storage Hydro Project (K2-Hydro)
  what_happened: During the initial route assessment, Option 1 (shorter route) was
    constrained by the Einasleigh River Bridge, which had a trafficable width of only
    3.24m — insufficient for the oversized loads. Option 2 (longer route) was initially
    preferred but was later found unsuitable due to bridge strengthening works required,
    requiring a return to Option 1 with a revised trailer configuration.
  lesson_learnt: Conduct a visual route proof and assess all road infrastructure —
    including bridge widths and load limits — early in planning so that route constraints
    are identified before transport schedules are locked in; a narrow bridge discovered
    late forced a 200km route detour for every oversized load.
