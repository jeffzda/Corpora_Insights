- record_id: ARENA-DLV-12754
  source_title: Genex Kidston Pumped Hydro Energy Storage Lessons Learnt Report No.12
  publish_date: 2024-12
  project_name: Kidston Pumped Storage Hydro Project (K2-Hydro)
  what_happened: During standpipe pressure testing, some tests failed due to pressure
    reduction through rock fractures rather than leaks along the standpipe annulus.
    Without a means to distinguish between failure mechanisms, teams risked misdiagnosing
    and incorrectly re-grouting standpipes. Additionally, standpipes were at risk
    of physical ejection under high water pressure in the event of a seal failure.
  lesson_learnt: When pressure-testing standpipes, observe and distinguish the mechanism
    of failure — pressure bleed through rock fractures is different from annulus leakage
    and requires a different response. Install a rated failsafe chain, shackle, and
    anchor connection to prevent standpipe ejection in the event of a failed test
    under high water pressure.
  issue_severity: moderate
  project_type: storage
  project_scale_band: utility/large-scale
  lifecycle_phase: construction/installation
  proponent_type: project developer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: execution & logistics
  intervention_note: Implemented observation of failure mechanism during pressure
    tests and added a failsafe connection between the standpipe and rock face using
    rated chain, shackles, and anchor points to restrain the standpipe from moving
    in the event of failure.
  transferability: moderate
  delay_magnitude: null
  technology_domain: pumped hydro
  source_pages: &id023
  - 9
  - 10
  evidence_excerpt: A lesson learned was to observe the mechanism of failure for a
    failed test. In some instances, pressure reduction through the rock fractures
    was unavoidable as compared to a leak along the standpipe annulus. A failsafe
    connection between the standpipe and rock face using rated chain, shackles and
    anchor points was also incorporated to refrain the standpipe from moving in the
    event of failure.
