  - 5
  evidence_excerpt: The Approval process needs to commence immediately upon contract
    execution. A key lesson learnt would be to undertake early works to obtain background
    data to support Approval documentation, in order to ensure a fast start. The Approval
    process stages are typically sequential and the timings for each step with respect
    to review and public consultation are fixed durations. It is also recommended
    that allowance for adequate time contingency be included for the Approval phase.
