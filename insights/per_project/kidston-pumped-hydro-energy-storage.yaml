  what_happened: Transportation of major underground components (turbine stay rings
    and 135-tonne transformers) required specialised Self-Propelled Modular Trailers
    due to strict tunnel geometry constraints (6m high, 6m wide, 7% grade, 60m radius
    curves). Early engagement of heavy logistics specialists (Hansa Meyer Global and
    J.H. Bachmann) identified these constraints and shaped the transport solution
    currently being constructed.
  lesson_learnt: Engage heavy logistics specialists early in the planning phase for
    underground projects — route geometry and available specialist equipment must
    be confirmed before design is finalised, as tunnel constraints dictate transport
    configurations that cannot easily be changed later.
