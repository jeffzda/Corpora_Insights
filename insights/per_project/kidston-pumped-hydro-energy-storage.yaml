  source_title: Kidston Pumped Hydro Energy Storage Construction Report
  publish_date: 2022-11
  project_name: Kidston Pumped Storage Hydro Project (K2-Hydro)
  what_happened: The electromechanical equipment supply chain for the PSH project
    was highly globalised, with major components manufactured across China, India,
    Europe (Austria, Italy, Switzerland) and Australia. Critical items such as turbine
    runners, spiral casings, main inlet valves, and high-voltage transformers were
    sourced from China, while automation and governor systems came from Austria and
    high-voltage cables from Switzerland.
  lesson_learnt: PSH electromechanical supply chains are inherently multi-country
    and long-lead — project schedules must account for international shipping, customs,
    and factory acceptance testing across multiple jurisdictions; any single-country
    supply disruption (e.g. China factory delays) can cascade to affect multiple interdependent
    components simultaneously.
