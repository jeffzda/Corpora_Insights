- record_id: ARENA-DLV-24253
  source_title: Kidston Pumped Hydro Lessons Learnt 4
  publish_date: 2022-06
  project_name: Kidston Pumped Storage Hydro Project
  what_happened: The EPBC Act approval process for the Powerlink transmission line
    required the project to provide environmental offsets for impacts on Matters of
    National Environmental Significance (MNES), including Koala, Sharman Rock Wallaby,
    Greater Glider, and Squatter Pigeon. Securing suitable offset properties proved
    difficult and time-consuming due to landholder constraints and competing renewable
    energy development interest in the region.
  lesson_learnt: Gain a comprehensive understanding of EPBC offset requirements early
    in project development. When new transmission infrastructure is developed in areas
    with renewable energy development potential, landholders may be unable or unwilling
    to provide offsets due to existing contractual arrangements or perceived development
    value — this can substantially delay approvals and project delivery.
  issue_severity: moderate
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: coordination & stakeholders
  intervention_note: A deemed suitable offset property was identified by May 2022
    with final surveys underway; EPBC approval was expected by 19 August 2022 following
    a public comment period and formal assessment.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: pumped hydro
  source_pages:
  - 3
  - 4
  evidence_excerpt: Given the scope and scale of the Project, it is important to gain
    a comprehensive understanding of a Project's offset requirements whilst understanding
    the prevailing renewable energy development market conditions, the type of infrastructure
    being developed and the associated land use. When new electrical transmission
    infrastructure is developed, it inadvertently generates interest in the surrounding
    areas for potential renewable energy developments. This can add a layer of complexity
    when negotiating with landholders to secure an offset.
