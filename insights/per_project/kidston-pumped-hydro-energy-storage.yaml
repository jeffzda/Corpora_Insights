- record_id: ARENA-DLV-24255
  source_title: Kidston Pumped Hydro Lessons Learnt 4
  publish_date: 2022-06
  project_name: Kidston Pumped Storage Hydro Project
  what_happened: Powerlink needed to acquire easements across multiple landholdings
    for the transmission line, requiring a concurrent strategy of negotiated commercial
    settlements alongside a compulsory acquisition process under the Acquisition of
    Land Act 1967 (Qld). Negotiating with rural landholders — particularly those with
    development potential or existing encumbrances — proved complex and time-consuming.
  lesson_learnt: Adopt a concurrent voluntary negotiation and statutory compulsory
    acquisition strategy for transmission line easements to preserve schedule flexibility.
    Where landholders cannot reach voluntary agreement, having the statutory process
    running in parallel ensures project delivery is not held hostage to a single negotiation
    outcome.
