  publish_date: 2023-01
  project_name: Kidston Pumped Storage Hydro Project
  what_happened: Transportation planning for oversized and overweight loads required
    approvals from at least eight separate authorities including the Townsville Port,
    Queensland Department of Transport and Main Roads, Queensland Police Service,
    Ergon Energy, Optus, Foxtel, Queensland Rail, Local Councils, and the Department
    of Environmental Services. Involving local stakeholders and Councils early in
    planning was identified as critical to avoid unexpected situations during construction.
  lesson_learnt: Commence transport planning as early as possible and involve all
    relevant local stakeholders and Councils from the outset — multiple overlapping
    approval authorities for oversize/overweight loads can create unexpected delays
    if not engaged before construction commences. Also explore opportunities for cost-shared
    road infrastructure upgrades at that time.
