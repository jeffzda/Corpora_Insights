  what_happened: Scaled model hydraulic testing of the ANDRITZ turbine units was conducted
    at the ANDRITZ laboratory in Graz, Austria from June to September 2021, prior
    to prototype manufacture. Results confirmed the turbine weighted efficiency exceeded
    guaranteed levels (90.52% actual vs 90.37% guaranteed model; 91.99% predicted
    prototype vs 91.86% guaranteed), and pump weighted efficiency also exceeded guarantees
    (92.63% model vs 91.94% guaranteed).
  lesson_learnt: Conducting scaled model tests at the OEM's accredited laboratory
    before committing to full prototype manufacture provides contractual confidence
    in hydraulic performance guarantees and de-risks commissioning disputes — this
    should be a standard contractual requirement for FOAK PSH projects rather than
    an optional test.
