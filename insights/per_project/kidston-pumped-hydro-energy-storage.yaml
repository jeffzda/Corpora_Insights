  source_title: 'Kidston Pumped Hydro Energy Storage - Lessons Learnt Report #11'
  publish_date: 2024-05
  project_name: Kidston Pumped Storage Hydro Project
  what_happened: During filling of Wises Dam, kangaroos became stranded on islands
    formed within the reservoir as water levels rose; the existing mine pit (Wises
    Pit) within the reservoir floor prevented grading the entire floor to the highest
    point to allow animals to self-relocate, requiring a complex coordinated rescue
    operation.
  lesson_learnt: Where reservoir filling will create islands from irregular floor
    topography (e.g. legacy mine pits), a fauna management procedure accounting for
    the changed topography must be developed well before filling commences — self-relocation
    of fauna cannot be assumed and active retrieval using drones, surveys, and boat
    crews may be required.
