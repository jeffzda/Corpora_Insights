  source_title: Kidston Pumped Hydro Lessons Learnt 4
  publish_date: 2022-06
  project_name: Kidston Pumped Storage Hydro Project
  what_happened: Following commencement of the main access tunnel (MAT) in January
    2022, tunnelling advance rates were below the target maximum. Multiple operational
    improvements were identified and implemented during construction to increase daily
    advance rates.
  lesson_learnt: Expect a period of operational optimisation at the start of tunnelling
    works and plan for iterative improvement of equipment configurations, muck handling
    arrangements, services routing, and blasting parameters. Building in a structured
    continuous improvement process from the outset of tunnelling can accelerate advance
    rates more quickly than reactive problem-solving.
  issue_severity: minor
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: construction/installation
  proponent_type: project developer
  delay_category: construction/installation
  failure_mode: execution & logistics
  outcome_class: delayed but recoverable
  secondary_failure_mode: null
  intervention_note: 'Five specific improvements were implemented: provision of additional
    critical tunnelling equipment as breakdown spares; additional ancillary plant
    for crown access; change from four-way to T-intersection muck cuddy arrangement;
    replacement of rigid steel pipe services with flexible HDPE pipe; and reduction
    of perimeter hole spacings for blasting to reduce overbreak.'
  transferability: narrow
  delay_magnitude: not quantified
  technology_domain: pumped hydro
  source_pages: &id046
  - 6
  evidence_excerpt: 'Since the construction of the MAT began in January 2022, several
    improvements have been made in the tunnelling operations to increase the advance
    rates, namely: Provision of additional critical tunnelling equipment in case of
    plant breakdown; Additional ancillary plant to assist operations (loader with
    IT attachment for access to crown); Change in muck cuddy arrangement from four
    way intersection to T intersection arrangement; Services changed from rigid steel
    pipe to flexible HDPE pipe to better facilitate the geometry; and Reduce perimeter
    hole spacings for blasting to reduce the amount of overbreak.'
