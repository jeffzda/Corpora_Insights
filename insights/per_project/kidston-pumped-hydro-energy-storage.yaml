- record_id: ARENA-DLV-10670
  source_title: Kidston Pumped Hydro Energy Storage Construction Report
  publish_date: 2022-11
  project_name: Kidston Pumped Storage Hydro Project (K2-Hydro)
  what_happened: The Wises Dam design used existing waste rock material from the mine
    site to construct embankment walls, minimising capital cost by utilising available
    on-site resources. Where existing waste dump heaps could not be used, freestanding
    embankment walls were constructed. The design also repurposed the existing water
    bodies (Wises Pit and Eldridge Pit) as reservoirs, with water progressively transferred
    from Eldridge to Wises Pit as the dam was developed.
  lesson_learnt: PSH projects on former mine sites can achieve significant capital
    cost savings by designing reservoirs around existing pit voids and using on-site
    waste rock for embankment construction — the engineering challenge is qualifying
    existing materials to dam safety standards, which requires early geotechnical
    investigation and independent review of waste rock properties before committing
    to this approach.
