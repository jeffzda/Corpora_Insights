  what_happened: K2-Hydro's financing required a multi-party capital structure involving
    federal grant funding (ARENA $47M), a government-backed concessional debt facility
    (NAIF $610M), strategic equity from a Japanese utility (J-POWER $25M into Genex),
    and the project developer's own equity ($118.5M), taking approximately seven years
    from feasibility to financial close.
  lesson_learnt: First-of-kind large PSH projects in Australia are unlikely to be
    financeable through conventional project finance alone — the K2-Hydro capital
    structure required concessional government debt (NAIF), grant funding (ARENA),
    and strategic equity from an experienced international utility (J-POWER), and
    developers should plan for a multi-year multi-party financing assembly process.
