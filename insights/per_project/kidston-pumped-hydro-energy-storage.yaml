- record_id: ARENA-DLV-12755
  source_title: Genex Kidston Pumped Hydro Energy Storage Lessons Learnt Report No.12
  publish_date: 2024-12
  project_name: Kidston Pumped Storage Hydro Project (K2-Hydro)
  what_happened: The initial probing design used only four probe holes at quadrant
    points, with additional holes added if water was encountered. However, water presence
    proved highly variable between adjacent holes — flows in one hole could exceed
    50L/min while an adjacent hole metres away was dry — meaning the initial configuration
    was insufficient to reliably characterise and manage water ahead of the face.
  lesson_learnt: For tunnelling through highly variable water-bearing rock, adopt
    full-perimeter probing from the outset using a minimum of ten primary holes rather
    than a minimal initial design — the variability of water between closely spaced
    holes makes partial probing unreliable for managing water risk ahead of the face.
  issue_severity: moderate
  project_type: storage
  project_scale_band: utility/large-scale
  lifecycle_phase: construction/installation
  proponent_type: project developer
  delay_category: construction/installation
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Engaged subject matter expert MultiGrout Australia and adopted
    full-perimeter probing with a minimum of ten primary holes, supplemented by secondary
    holes either side of any hole encountering water to confirm grouting effectiveness.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: pumped hydro
  source_pages: &id024
  - 11
  evidence_excerpt: It became apparent that for the water features being intersected
    for Kidston, there was a wide variability in the presence of water between the
    holes. In adjacent holes, water flows in one hole may be greater than 50L/min
    whilst in the adjacent hole of no more than meters apart minimal to no water was
    encountered. It was on this basis that full perimeter probing, and subsequent
    grouting was adopted using a minimum of ten primary holes.
