  source_title: Kidston Pumped Hydro Energy Storage Construction Report
  publish_date: 2022-11
  project_name: Kidston Pumped Storage Hydro Project (K2-Hydro)
  what_happened: The Wises Dam upper reservoir required a 2mm thick HDPE geomembrane
    liner with a 30-year design life to achieve low permeability. The project site
    is in a zone of high UV energy and high ambient temperatures, creating an accelerated
    degradation environment. An independent evaluation and laboratory testing programme
    was commissioned to verify liner durability under project-specific conditions
    before selection.
  lesson_learnt: For exposed HDPE liners at remote tropical sites, commissioning independent
    accelerated ageing tests (UV and thermal) before material procurement is essential
    — standard manufacturer data sheets may not capture site-specific degradation
    rates, and a liner failure in an upper reservoir would be catastrophic and extremely
    costly to remediate.
