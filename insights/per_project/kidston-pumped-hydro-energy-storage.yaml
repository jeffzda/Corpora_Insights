  secondary_failure_mode: null
  intervention_note: Installed multiple intermediate sumps and pumps along the 2km+
    tunnel length, with a three-sump back-to-back arrangement at the tailrace to provide
    overflow capacity and evacuation time for personnel.
  transferability: moderate
  delay_magnitude: null
  technology_domain: pumped hydro
  source_pages: &id028
