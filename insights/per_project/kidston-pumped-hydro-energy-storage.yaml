  what_happened: The project used a fully-wrapped EPC contract with the MDJH JV (McConnell
    Dowell and John Holland joint venture), under which MDJH was responsible for procuring
    all supplies including the electromechanical equipment package from ANDRITZ as
    a nominated subcontractor. The EPC contract value was $477M, representing 62%
    of total capital cost.
