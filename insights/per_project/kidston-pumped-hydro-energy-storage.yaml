- record_id: ARENA-DLV-70354
  source_title: Kidston Pumped Hydro Lessons Learnt 6
  publish_date: 2023-01
  project_name: Kidston Pumped Storage Hydro Project
  what_happened: The project site is accessed via unsealed roads, low-level bridge
    crossings, and the Copperfield River causeway, all of which become impassable
    during the wet season (November–March in Far-North Queensland). In January 2023,
    spillway levels of up to 2.5m were recorded, demonstrating the causeway's inaccessibility
    during this period. The project's first three equipment shipments were successfully
    delivered during the dry season.
  lesson_learnt: Schedule major equipment deliveries to site within the dry season
    window and identify alternative offsite storage in advance — wet season access
    loss at remote Far North Queensland sites can be abrupt and the Kidston Dam telemetry
    provides a reliable leading indicator of road passability.
  issue_severity: moderate
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: procurement
  proponent_type: project developer
  delay_category: procurement/supply chain
  failure_mode: execution & logistics
  outcome_class: delayed but recoverable
  secondary_failure_mode: poor scoping
  intervention_note: The project planned all shipments to arrive during the dry season;
    January 2023 dam spillway data confirmed the wet-season inaccessibility and validated
    this scheduling approach.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: pumped hydro
  source_pages:
  - 11
  - 12
  evidence_excerpt: A key lesson is that material transportation should take place
    outside of the wet season and alternate offsite storage should be identified and
    available if required. The Project has benefited from the first three shipments
    being delivered to site during the dry season, with remaining shipments planned
    to also arrive during the dry season.
  confidence_note: delay_magnitude estimated at 3–12 months — wet season spans approximately
    5 months; a missed dry-season window would delay a shipment by that duration.
