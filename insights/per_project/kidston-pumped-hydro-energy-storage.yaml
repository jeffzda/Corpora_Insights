    simplify owner risk management for complex underground PSH projects — proponents
    should consider requiring the EPC contractor to take on nominated subcontractor
    (OEM) risk explicitly, rather than managing OEM interfaces directly, to avoid
    split-responsibility disputes during equipment delivery.
