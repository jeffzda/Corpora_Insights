- record_id: ARENA-DLV-53511
  source_title: Kidston Pumped Hydro Financial Close Report
  publish_date: 2021-08
  project_name: Kidston Pumped Storage Hydro Project (K2-Hydro)
  what_happened: Genex found that contracting with a large gentailer (EnergyAustralia)
    rather than a smaller retailer or generator produced a higher offtake price, because
    the gentailer could value the storage asset against its broader retail portfolio
    exposure to wholesale price volatility rather than on a standalone P&L basis.
  lesson_learnt: When running an offtake process for a large flexible storage asset,
    prioritise large integrated gentailers as offtake counterparties — they can price
    the portfolio hedging value of storage against their retail book, yielding a materially
    higher offer than standalone retailers or generators who price only on project-level
    P&L.
