  what_happened: The project required a new 186km 275kV transmission line from the
    remote Kidston site to the existing Powerlink network at Mt Fox (Guybal Munjan
    Substation). This transmission infrastructure was entirely outside the proponent's
    control and represented a major capital item ($258.2M contract value) delivered
    by the network service provider under a Generator Connection and Access Agreement.
  lesson_learnt: For remote projects requiring long transmission connections, early
    execution of a Generator Connection and Access Agreement with a clear Powerlink
    scope and schedule is critical — the transmission line represents a parallel critical
    path that can constrain the overall commissioning date regardless of civil construction
    progress.
