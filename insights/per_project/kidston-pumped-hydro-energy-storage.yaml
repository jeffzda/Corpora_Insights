  secondary_failure_mode: coordination & stakeholders
  intervention_note: The Einasleigh River Floodway was structurally assessed and a
    suitable narrow trailer identified that could carry the load within the crossing
    roadway with minimal clearances; Option 1 became the submitted route.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: pumped hydro
