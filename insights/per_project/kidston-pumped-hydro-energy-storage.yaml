  source_title: Kidston Pumped Hydro Financial Close Report
  publish_date: 2021-08
  project_name: Kidston Pumped Storage Hydro Project (K2-Hydro)
  what_happened: Genex determined that selling 100% of K2-Hydro's dispatch rights
    to a single offtaker under a tolling-style arrangement — rather than selling individual
    capabilities (generation, pumping, FCAS, inertia) to different parties — maximised
    the plant's revenue potential and was key to securing offtake price.
  lesson_learnt: For flexible storage assets with multiple revenue streams (energy,
    FCAS, inertia, ancillary services), avoid carving up dispatch rights among multiple
    offtakers — the portfolio flexibility value is greatest when a single offtaker
    can optimise dispatch across all markets, and this integrated value proposition
    commands a higher offtake price.
