- record_id: ARENA-DLV-12760
  source_title: Genex Kidston Pumped Hydro Energy Storage Lessons Learnt Report No.12
  publish_date: 2024-12
  project_name: Kidston Pumped Storage Hydro Project (K2-Hydro)
  what_happened: The secondary water management system (sump collection and pumping)
    needed to handle pumping over more than 2km of tunnel length, requiring a series
    of intermediate collection sumps and pumps. The primary sump arrangement used
    three back-to-back sumps to provide overflow storage and additional evacuation
    time for underground workers if the primary sump was overtopped.
  lesson_learnt: Ensure multiple layers of redundancy in underground water management
    systems — for long tunnels, design intermediate pumping stages and provide back-to-back
    sump storage not just for operational continuity but as a life-safety measure,
    giving workers adequate time to evacuate if primary containment is overwhelmed.
