- record_id: ARENA-DLV-69905
  source_title: 'Kidston Pumped Hydro Energy Storage - Lessons Learnt Report #11'
  publish_date: 2024-05
  project_name: Kidston Pumped Storage Hydro Project
  what_happened: The project inherited approximately 3.5GL of excess water in the
    reservoir system from legacy mine pit water, which could not simply be discharged
    — regulatory conditions (minimum dilution factor and mine licensing requirements)
    restricted permanent release to wet season only, requiring a separate mechanical
    evaporation solution for the remainder of the year.
  lesson_learnt: Projects reusing legacy mine infrastructure must establish a detailed
    water balance model early, track it continuously, and implement mechanical evaporation
    systems well in advance — regulatory constraints on discharge can leave excess
    water unmanageable for most of the year without supplementary systems.
