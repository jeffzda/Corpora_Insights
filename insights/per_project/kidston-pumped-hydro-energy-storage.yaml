  project_name: Kidston Pumped Storage Hydro Project (K2-Hydro)
  what_happened: Transportation of major heavy equipment (turbines and transformers,
    each up to 120 tonnes) from Townsville Port to the underground project site required
    specialised route planning, multiple approval authorities, and the use of Self-Propelled
    Modular Trailers (SPMTs) for underground segments. The route involved a 6m wide,
    6m high tunnel with a 14% grade and 60m radius curves.
  lesson_learnt: Engage heavy logistics specialists early in the planning phase to
    ensure route geometry is compatible with available specialist equipment — doing
    so at the Kidston project yielded a workable transport solution for items that
    could not otherwise fit through the access tunnel.
