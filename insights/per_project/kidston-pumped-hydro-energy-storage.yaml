- record_id: ARENA-DLV-53518
  source_title: Kidston Pumped Hydro Financial Close Report
  publish_date: 2021-08
  project_name: Kidston Pumped Storage Hydro Project (K2-Hydro)
  what_happened: The K2-Hydro design incorporated fixed-speed rather than variable-speed
    reversible Francis turbines, primarily because fixed-speed units provide real
    inertia as an ancillary service to the grid, which is especially valuable in the
    remote North Queensland network context, and offer better comparative reliability
    and cost.
  lesson_learnt: When selecting PSH turbine technology, the grid ancillary services
    context — particularly inertia requirements in remote or weak network locations
    — should be a primary driver alongside capital cost; at Kidston, the ability to
    provide real inertia justified selecting fixed-speed over variable-speed units
    despite the latter's pumping flexibility advantages.
