- record_id: ARENA-DLV-53501
  source_title: Kidston Pumped Hydro Financial Close Report
  publish_date: 2021-08
  project_name: Kidston Pumped Storage Hydro Project (K2-Hydro)
  what_happened: Capital costs for the 250MW K2-Hydro project increased significantly
    from feasibility through to construction stage, driven by limitations in design
    consultants' ability to price accurately without Australian reference projects,
    EPC risk premiums, five years of CPI escalation, and COVID-19 pricing pressures.
  lesson_learnt: PSH capital cost estimates at feasibility stage should carry substantial
    contingency — the absence of recent Australian reference projects, combined with
    EPC risk premiums and multi-year development timelines, means early estimates
    will materially understate final construction costs. Future developers should
    stress-test feasibility estimates against these factors explicitly.
  issue_severity: major
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: project developer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: delayed but recoverable
  secondary_failure_mode: poor scoping
  intervention_note: The open-book ECI process with pre-agreed contingency and profit
    margins partially mitigated the lack of competitive pricing tension for the balance
    of EPC works.
  transferability: moderate
  delay_magnitude: null
  technology_domain: pumped hydro
  source_pages: &id067
  - 15
  - 16
  evidence_excerpt: 'the experience with the Project is that the estimated capital
    cost significantly increased as it moved from feasibility, to development and
    ultimately construction stage. This is a result of a number of factors observed
    during the Project''s development, namely: The ability for design consultants
    to accurately price a construction contract is limited, particularly in the absence
    of suitable reference project data in Australia; The final allocation of risk
    to a counterparty under an EPC contract invariably results in a price premium
    to the estimated labour and materials costs; The time it takes for development
    (5 years from the feasibility stage, in the Project''s case) results in pricing
    increases due to CPI, as well as the general price pressures in the Australian
    construction industry; and The Project was costed and financed during the COVID-19
    pandemic.'
