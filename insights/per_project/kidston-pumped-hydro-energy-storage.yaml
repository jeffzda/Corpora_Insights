  project_name: Kidston Pumped Storage Hydro Project
  what_happened: The porosity of the large waste rock stockpile remaining within the
    Wises Dam footprint could not be accurately determined by sample testing due to
    the volume involved, introducing significant uncertainty into the water balance
    model during dam filling.
  lesson_learnt: Where legacy mine waste rock is incorporated into a reservoir footprint,
    the void porosity available to absorb rising water cannot be reliably determined
    by sampling alone — the water balance model should include a range of porosity
    assumptions and be calibrated iteratively against measured water levels as filling
    proceeds.
