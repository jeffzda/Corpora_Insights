  evidence_excerpt: In instances where tertiary and quaternary standpipes were utilised
    and water was encountered within 10 meters of the face, known faults were close
    by and all the probing and grouting undertaken meet the project requirements to
    continue to blast; an additional check of face stability was undertaken where
    the face was drilled out for the blast pattern for full length (typically 4.8m)
    and then the holes were back grouted with cementitious grout and the face redrilled
    to allow for a 2m advance only.
