- record_id: ARENA-DLV-12758
  source_title: Genex Kidston Pumped Hydro Energy Storage Lessons Learnt Report No.12
  publish_date: 2024-12
  project_name: Kidston Pumped Storage Hydro Project (K2-Hydro)
  what_happened: When pressure grouting ahead of the tunnel face, starting with an
    overly thick grout mix risked blocking holes and joints before adequate penetration
    into the rock mass was achieved, reducing the effectiveness of the grout curtain.
  lesson_learnt: Always begin pressure grouting with a highly fluid grout mix — this
    maximises initial penetration depth into the rock mass and lubricates the hole
    to maintain flow. Thicken the mix progressively only after observing grouting
    parameters (pressure and flow rate); starting with a thick mix risks blocking
    holes and faults prematurely.
  issue_severity: minor
  project_type: storage
  project_scale_band: utility/large-scale
  lifecycle_phase: construction/installation
  proponent_type: project developer
  delay_category: null
  failure_mode: execution & logistics
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Adopted a grouting protocol starting with highly fluid cementitious
    grout (minimum ~1500L pumped before thickening) and progressively thickened only
    when grouting pressure and flow parameters indicated it was appropriate.
  transferability: moderate
  delay_magnitude: null
  technology_domain: pumped hydro
  source_pages: &id026
