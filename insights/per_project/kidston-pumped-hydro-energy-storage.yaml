  evidence_excerpt: Powerlink is executing a concurrent acquisition strategy. The
    strategy focuses on negotiating commercial settlements with landholders to allow
    easements to be registered, whilst also commencing a compulsory acquisition process
    pursuant to the Acquisition of Land Act 1967 (Qld) (ALA) and its rights under
    the Electricity Act 1994 (Qld). This flexible approach to progressing easement
    acquisition has proved successful as it allows for negotiated outcomes to be achieved
    whilst also ensuring timely delivery of the Project.
