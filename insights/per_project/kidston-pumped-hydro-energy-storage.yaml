  project_name: Kidston Pumped Storage Hydro Project
  what_happened: The Kidston airstrip lacks an Instrument Landing System (ILS), restricting
    landings to visual conditions. The project investigated adding ILS but found it
    would reduce the strip length by approximately 100 metres, which would exclude
    the aircraft types currently used. Extending the strip to compensate was unfeasible
    due to proximity to the Copperfield River.
  lesson_learnt: Where a remote FIFO airstrip lacks ILS, assess the feasibility and
    trade-offs of ILS installation — including strip length implications — at the
    design stage, as retrofitting is constrained by environmental and physical boundaries
    that may make it permanently unviable.
