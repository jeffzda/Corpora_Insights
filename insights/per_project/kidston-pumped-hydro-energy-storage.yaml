    installations failed to reliably achieve the required pressure seal, requiring
    a revised two-stage grouting approach to achieve a reliable seal.
  lesson_learnt: When installing standpipes for high-pressure borehole drilling in
    water-bearing ground, first set the standpipe with grout or chemical adhesive
    and then apply a second installation of grout under pressure — this two-stage
    approach reliably achieves the required pressure rating (25 bar in this case).
