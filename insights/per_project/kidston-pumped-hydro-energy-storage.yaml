  source_title: Genex - Kidston Pumped Storage Hydro Project - Lessons Learnt Report
    10
  publish_date: 2024-02
  project_name: Kidston Pumped Storage Hydro Project (K2-Hydro)
  what_happened: Geotechnical investigation confirmed that the top 20m of ground at
    the ventilation and cable shaft locations consisted of extremely weathered rock,
    creating risk of ground squeeze, ravelling, and instability during raisebore operations.
    This required installation of secant piled rings as a presink activity, which
    was not part of the original scope of works.
  lesson_learnt: Undertake thorough geotechnical investigation and confirm ground
    conditions during detailed design before committing to shaft excavation methodology
    — at Kidston, weathered rock in the upper 20m of two shafts required an unplanned
    presink piling activity that was outside original scope and could only be confirmed
    once detailed design geotechnical data was available.
  issue_severity: moderate
  project_type: storage
  project_scale_band: utility/large-scale
  lifecycle_phase: construction/installation
  proponent_type: project developer
  delay_category: construction/installation
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Installed secant piled rings in the upper zone of both affected
    shafts as an advanced presink activity prior to raisebore operations, stabilising
    the ground and allowing safe reaming through the weathered zone.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: pumped hydro
  source_pages: &id037
  - 5
  evidence_excerpt: This activity was not allowed for as part of the original scope
    of works, as the geotechnical information needed to be confirmed before committing
    to the need of a presink. Further geotechnical information obtained during detailed
