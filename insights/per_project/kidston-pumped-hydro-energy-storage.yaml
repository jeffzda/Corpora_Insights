- record_id: ARENA-DLV-64254
  source_title: Genex - Kidston Pumped Storage Hydro Project - Lessons Learnt Report
    9
  publish_date: 2023-12
  project_name: Kidston Pumped Storage Hydro Project (K2-Hydro)
  what_happened: The HDPE liner specification for Wises Dam was developed through
    early engagement of the design team, manufacturers, and specialist installation
    experts to achieve a product meeting a 30-year design life. A key installation
    finding was that the liner must be secured at a thermally neutral temperature
    to avoid expansion/contraction pulling the liner away from fixings once filled
    with water.
  lesson_learnt: Engage HDPE liner manufacturers and installation specialists early
    in the design process to develop a fit-for-purpose liner specification; ensure
    installation procedures account for thermal expansion by securing the liner at
    a neutral temperature before reservoir filling.
