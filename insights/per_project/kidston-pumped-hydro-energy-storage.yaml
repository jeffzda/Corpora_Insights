  source_title: Kidston Pumped Hydro Energy Storage Construction Report
  publish_date: 2022-11
  project_name: Kidston Pumped Storage Hydro Project (K2-Hydro)
  what_happened: The project selected fixed-speed reversible Francis pump-generator
    turbine technology in preference to variable-speed technology, primarily because
    fixed-speed units provide 'real inertia' as a grid ancillary service — a particularly
    valued capability in the remote Queensland network context — as well as offering
    comparative reliability and cost efficiencies.
  lesson_learnt: For PSH projects in network locations with high intermittent renewable
    penetration and limited synchronous generation, fixed-speed units may be preferable
    to variable-speed despite lower operational efficiency range — the ancillary services
    value (inertia, frequency support, system restart) should be explicitly quantified
    and included in the technology selection business case.
