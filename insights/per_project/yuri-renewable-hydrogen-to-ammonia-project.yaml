- record_id: ARENA-DLV-5206
  source_title: Engie - Yuri Renewable Hydrogen to Ammonia - Lessons Learned Report
  publish_date: 2023-07
  project_name: Project Yuri Phase 0 – 10MW Green Hydrogen for Ammonia in the Pilbara
  what_happened: In the cyclone-prone Pilbara, larger solar PV panels required lower
    tilt angles than smaller panels to withstand wind loads, reducing power generation
    output relative to what would have been achievable with a standard tilt optimised
    for energy yield.
  lesson_learnt: In cyclone-prone regions, conduct panel pre-qualification during
    conceptual design by holistically assessing PV plant design including tilt angle,
    panel size and orientation, layout, and structural certifications, to avoid late-stage
    redesign that sacrifices energy yield for structural compliance.
  issue_severity: moderate
  project_type: multi-technology/hybrid
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: null
  transferability: narrow
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id002
  - 6
  - 7
  evidence_excerpt: Large solar panels magnify forces required to be sustained by
    the whole panel system, particular in cyclone regions. As a result, larger panels
    may need to be installed at lower tilt angles than smaller panels, which reduces
    power generation.
  confidence_note: transferability rated narrow because the finding is specific to
    cyclone-prone regions and large-format panel configurations.
