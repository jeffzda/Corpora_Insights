  source_title: Engie - Yuri Renewable Hydrogen to Ammonia - Lessons Learned Report
  publish_date: 2023-07
  project_name: Project Yuri Phase 0 – 10MW Green Hydrogen for Ammonia in the Pilbara
  what_happened: Limited solar PV operating data for the Pilbara region meant soiling
    loss assumptions used in project development were not well-supported by local
    evidence, introducing uncertainty in energy yield forecasts and O&M planning for
    panel cleaning.
  lesson_learnt: For projects in data-sparse locations such as the Pilbara, initiate
    a soiling monitoring campaign as early as possible in the development phase so
    that soiling loss assumptions and panel cleaning strategies are informed by site-specific
    measurements before final design is locked in.
