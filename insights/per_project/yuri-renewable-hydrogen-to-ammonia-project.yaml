  - 21
  evidence_excerpt: The autonomous control of microgrids with integrated EMS & PMS
    is relatively novel and few companies have expertise and capability to deliver
    this control system... EMS providers are experienced in controlling generation
    assets; however, have limited to no experience controlling process equipment and
    are generally reluctant to include this in their scope.
