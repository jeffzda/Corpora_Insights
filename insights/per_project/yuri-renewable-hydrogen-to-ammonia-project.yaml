  what_happened: The BESS was sized primarily for islanded operation — dynamic studies
    determined that an 8 MW power rating was required to achieve the minimum short
    circuit ratio needed to run the electrolyser and auxiliaries at full load in island
    mode — rather than for energy shifting to extend electrolyser operation.
  lesson_learnt: Size the BESS in solar-hydrogen microgrids against the islanded operation
    short circuit ratio requirement (power rating) rather than energy shifting (energy
    rating) — the power rating driven by islanded stability will typically be the
    binding constraint and should be confirmed through dynamic stability studies early
    in design.
