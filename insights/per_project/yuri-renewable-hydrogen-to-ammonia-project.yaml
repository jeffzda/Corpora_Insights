  what_happened: International OEM vendors repeatedly failed to cascade project specification
    requirements to their sub-vendors, particularly requirements for automatic and
    cyclic operations, leading to significant delays and rework. Equipment designed
    for continuous operation was delivered without provision for intermittent service.
  lesson_learnt: Allocate dedicated QAQC and package management personnel based overseas
    to monitor international vendors and their sub-vendor chains — contract commitments
    on quality and schedule are insufficient without active on-the-ground oversight
    at the sub-vendor level.
