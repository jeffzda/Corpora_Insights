  what_happened: Significant rework of engineering deliverables from Chinese vendors
    was required due to poor quality, non-compliance with project standards, and documentation
    gaps between Chinese and Australian/Western requirements, affecting P&IDs, single
    line diagrams, stability studies, electrical protection studies, cause-and-effect
    charts, functional specifications, and MSDS documents.
  lesson_learnt: Require Chinese equipment vendors to submit key engineering deliverables
    (P&IDs, SLDs, cause-and-effect charts, functional specs, MSDS) for compliance
    review against Australian standards at the award stage, not after delivery — rework
    of these documents after receipt caused substantial schedule delay and should
    be treated as a known risk on all projects with Chinese supply.
