  publish_date: 2025-06
  project_name: Yuri Renewable Hydrogen to Ammonia Project
  what_happened: Overseas equipment vendors and sub-vendors repeatedly failed to comply
    with Australian standards (ASME, AS3000, EEHA), causing delays and rework during
    engineering, procurement, and equipment assembly. The hydrogen compressor supplier
    had to be replaced several months into the project.
  lesson_learnt: Conduct thorough due diligence on electrolyser OEMs to identify gaps
    in Australian standards compliance and local support capacity; assess what supplemental
    in-country resources are needed for engineering, fabrication, and QA/QC; and independently
    validate OEM delivery schedules before contract award.
