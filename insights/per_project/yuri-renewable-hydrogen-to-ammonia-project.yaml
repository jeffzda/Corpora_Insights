  what_happened: IGBT-based rectifier technology, which would significantly reduce
    harmonics and potentially eliminate the requirement for a separate harmonic filter,
    was not mandated for the Yuri project because doing so would have excluded several
    OEMs using thyristor-based rectifiers in their standard designs, introducing interface
    risk and likely schedule delay.
  lesson_learnt: For future solar-coupled electrolyser projects, evaluate IGBT-based
    rectifier technology at the concept stage — mandating IGBT rectifiers may reduce
    or eliminate the harmonic filter (a 9–12 month procurement item) and simplify
    the power system, provided sufficient OEM options remain in the shortlist.
