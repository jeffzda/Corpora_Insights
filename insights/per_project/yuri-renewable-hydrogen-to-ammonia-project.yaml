- record_id: ARENA-DLV-15910
  source_title: Yuri Renewable Hydrogen to Ammonia Project - Project Technology &
    Market Report
  publish_date: 2025-06
  project_name: Yuri Renewable Hydrogen to Ammonia Project
  what_happened: The harmonic filter required a 9–12 month procurement lead time,
    but could not be ordered until upstream harmonic studies were completed, which
    in turn required all major equipment (electrolyser rectifiers, PV inverters, BESS
    PCS) to be selected and vendor software models to be available — creating a long
    in-series dependency chain that was not adequately reflected in the initial schedule.
  lesson_learnt: Map the harmonic filter procurement dependency chain (major equipment
    selection → vendor software models → harmonic studies → filter sizing → procurement)
    at the start of detailed engineering and place it on the critical path — the 9–12
    month lead time combined with upstream study dependencies can add over 18 months
    to the schedule if not identified early.
