- record_id: ARENA-DLV-15907
  source_title: Yuri Renewable Hydrogen to Ammonia Project - Project Technology &
    Market Report
  publish_date: 2025-06
  project_name: Yuri Renewable Hydrogen to Ammonia Project
  what_happened: The alkaline electrolyser OEM (Peric) had very limited experience
    with flexible/intermittent operating conditions driven by variable renewable energy,
    causing significant engineering effort and delays in developing control system
    logic, operating procedures, daily start/stop sequencing, and de-pressurisation
    processes.
  lesson_learnt: During the electrolyser tender phase, explicitly qualify vendors
    on flexible/intermittent renewable operation experience and require detailed responses
    on daily start-up/shutdown sequences, ramp rates, and de-pressurisation procedures
    — then allocate substantial schedule margin during engineering and commissioning
    to close any identified gaps.
  issue_severity: major
