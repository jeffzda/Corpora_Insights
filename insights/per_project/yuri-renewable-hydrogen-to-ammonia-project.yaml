  publish_date: 2025-06
  project_name: Yuri Renewable Hydrogen to Ammonia Project
  what_happened: At reduced electrolyser loads during solar variability, lye pumps
    operating at constant full-load flow rates risked inefficient gas-liquid separation,
    potentially allowing H2 and O2 gases to accumulate in the lye loop and creating
    an explosion risk. The standard vendor design did not include variable speed drives
    for the lye pumps.
  lesson_learnt: When operating alkaline electrolysers at variable loads driven by
    renewable generation, add variable speed drives to lye circulation pumps as a
    non-negotiable design requirement — the standard vendor configuration for constant-flow
    lye pumps is unsafe at part-load and the OEM will not identify this without owner-driven
    analysis.
  issue_severity: major
  project_type: industrial decarbonisation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
