  project_name: Yuri Renewable Hydrogen to Ammonia Project
  what_happened: There was no clear regulatory position from DWER on whether hydrogen
    production facilities require Works Approval under environmental protection regulations
    (Part V, Schedule 1 – Category 31 Chemical Manufacturing), as these regulations
    were issued in 1987 and had not been updated for hydrogen projects.
  lesson_learnt: When deploying new technologies such as BESS in jurisdictions with
    regulatory gaps, proactively identify those gaps early and engage regulators collaboratively
    to develop workable compliance pathways; referencing equivalent standards from
    other Australian states can accelerate resolution where local regulations are
    absent.
