- record_id: ARENA-DLV-5201
  source_title: Engie - Yuri Renewable Hydrogen to Ammonia - Lessons Learned Report
  publish_date: 2023-07
  project_name: Project Yuri Phase 0 – 10MW Green Hydrogen for Ammonia in the Pilbara
  what_happened: The Energy Management System (EMS) for a complex microgrid integrating
    solar PV, BESS, synchronous generators, and an electrolyser proved difficult to
    procure and engineer because very few suppliers have capability to control both
    generation assets and process equipment simultaneously, and electrolyser OEMs
    had limited data on how flexible operation affects performance and degradation.
  lesson_learnt: Treat the EMS as a long-lead item and appoint the EMS supplier as
    early as possible; structure the engineering and procurement model to minimise
    supplier interfaces and concentrate expertise on resolving the technical complexity
    of integrating electrolyser process controls with the power management system.
  issue_severity: major
  project_type: multi-technology/hybrid
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: procurement/supply chain
  failure_mode: unvalidated integration
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: null
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages:
