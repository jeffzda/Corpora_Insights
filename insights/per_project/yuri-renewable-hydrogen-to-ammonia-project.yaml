    from placement of the order to delivery ex-works. Prior to the placement of the
    purchase order, detailed harmonic analyses are required for the sizing and design
    of the harmonic filter... Consequently, sufficient time must be allocated in the
    schedule to allow for the in-series duration of the selection of major equipment,
    the supply of the associated software models, performance of the harmonic studies
    to size the filter, and ultimately the filter procurement process.
