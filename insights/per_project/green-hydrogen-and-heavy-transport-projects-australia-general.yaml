- record_id: ARENA-DLV-69020
  source_title: ARENA Insights Forum Session Summaries and Key Points
  publish_date: 2022-11
  project_name: Green hydrogen and heavy transport projects (Australia — general)
  what_happened: Forum participants identified that understanding customers' perspectives
    was critical for hydrogen transport projects, noting that operators cannot be
    expected to significantly change their processes and behaviours to accommodate
    new hydrogen technology. Demonstration projects involving large, reputable operators
    were identified as critical to building credibility.
  lesson_learnt: Design hydrogen heavy transport projects around the customer's operational
    constraints rather than expecting behavioural change — commercial adoption requires
    that refuelling and vehicle operation fit within existing fleet management processes,
    and demonstration projects should involve large reputable operators to build credibility
    with the broader market.
