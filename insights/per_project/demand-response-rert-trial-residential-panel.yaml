- record_id: ARENA-DLV-45516
  source_title: ARENA Insights Forum Presentation Summaries & Key Points – DER Stream
  publish_date: 2019-06
  project_name: Demand Response RERT Trial – Residential Panel
  what_happened: Communicating post-event DR results to individual residential customers
    proved challenging due to restricted data access and difficulties in establishing
    accurate consumption baselines.
  lesson_learnt: Resolve data access and baseline methodology issues before committing
    to post-event customer communication obligations in residential DR programs —
    inability to report individual results erodes customer trust and reduces long-term
    program retention.
