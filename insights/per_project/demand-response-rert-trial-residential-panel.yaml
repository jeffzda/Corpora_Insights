- record_id: ARENA-DLV-45517
  source_title: ARENA Insights Forum Presentation Summaries & Key Points – DER Stream
  publish_date: 2019-06
  project_name: Demand Response RERT Trial – Residential Panel
  what_happened: Experience from the RERT trial showed that residential customers
    were generally supportive of direct load control (DLC) provided their comfort
    was not significantly impacted, but that building customer trust and securing
    social licence for automatic equipment operation was identified as essential to
    DLC program success.
  lesson_learnt: Secure explicit social licence and trust before deploying direct
    load control programs — residential customers accept automatic equipment operation
    only when they are confident their comfort is protected, and this trust must be
    built through transparent communication before and during the program.
  issue_severity: minor
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: government/public-sector body
  delay_category: null
  failure_mode: no major failure stated
