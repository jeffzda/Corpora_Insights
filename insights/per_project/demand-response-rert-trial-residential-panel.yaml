- record_id: ARENA-DLV-45518
  source_title: ARENA Insights Forum Presentation Summaries & Key Points – DER Stream
  publish_date: 2019-06
  project_name: Demand Response RERT Trial – Residential Panel
  what_happened: The RERT trial found that relying exclusively on behavioural DR for
    load management is unlikely to produce optimal outcomes due to a poor industry
    understanding of customer motivations and incentive structures.
  lesson_learnt: Do not design residential DR programs around behavioural DR alone
    — the industry's limited understanding of what motivates different customer segments
    means BDR-only programs carry material reliability risk; combine with controlled
    load approaches calibrated to the customer segment.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: government/public-sector body
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: null
  transferability: broad
  delay_magnitude: null
  technology_domain: demand response
  source_pages: &id003
  - 6
  evidence_excerpt: BDR programs have the potential to empower customers to increase
    ownership of the energy usage and can create a more engaged customer base; however,
    relying on BDR exclusively for load management may not lead to the best outcome
    due to a poor understanding of motivations and incentive structures by industry.
  confidence_note: null
