  secondary_failure_mode: null
  intervention_note: null
  transferability: broad
  delay_magnitude: null
  technology_domain: demand response
  source_pages: &id002
  - 6
  evidence_excerpt: Building trust and receiving a social licence to automatically
    operate household equipment is essential to the success of direct load control
    (DLC) programs. Experience has shown that residential customers are supportive
    of DLC, so long as they're not being significantly impacted and their comfort
    remains high.
