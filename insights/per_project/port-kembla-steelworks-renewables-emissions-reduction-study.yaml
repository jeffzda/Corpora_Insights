- record_id: ARENA-DLV-40301
  source_title: Port Kembla Steelworks Renewables & Emissions Reduction Study Lessons
    Learnt 1
  publish_date: 2022-08
  project_name: Port Kembla Steelworks Renewables and Emissions Reduction Study
  what_happened: BlueScope required approximately 1,000 tonnes of low-ash, low-volatile-matter
    biochar to conduct pilot and plant trials for blast furnace injection, but found
    that Australian domestic suppliers could only produce a maximum of 50 tonnes of
    suitable-quality biochar — far short of the requirement. Overseas suppliers were
    identified but would have required significant additional due diligence to meet
    environmental and social standards. The minimum trial quantity was subsequently
    reduced to 600 tonnes, which was eventually sourced from two Australian suppliers.
  lesson_learnt: Before designing trial scope and quantities for biochar-based industrial
    decarbonisation projects in Australia, confirm domestic supply chain capacity
    early — there is currently no established bulk supply chain for steelworks-grade
    biochar in Australia, and procurement planning must account for this constraint
    or incorporate overseas sourcing with associated compliance due diligence.
