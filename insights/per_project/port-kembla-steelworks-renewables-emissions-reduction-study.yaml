  what_happened: Process simulation modelling predicted that injection of pure hydrogen
    into the blast furnace at up to 30 kgH2/tHM could reduce PKSW CO2 emissions by
    14–16% from baseline depending on H2 preheat temperature. However, 30 kgH2/tHM
    was assessed as well beyond PKSW's operational RAFT limits, and preheating H2
    to temperatures above 600°C requires significant engineering development not yet
    undertaken.
  lesson_learnt: Modelling-based estimates of hydrogen injection benefits in blast
    furnaces can overstate practically achievable reductions if RAFT operational limits
    and high-temperature preheat engineering requirements are not treated as hard
    constraints in the model — project teams should bound simulation outputs to operationally
    validated injection rates before reporting abatement potential.
