  what_happened: The capacitance-based coal flow concentration flowmeter on the injection
    system consistently registered an apparent increase in coal flow concentration
    when biochar was present, because it is calibrated for coal only. This caused
    unnecessary process adjustments (increases in fluidisation nitrogen) and introduced
    uncertainty about actual injection rates during trials.
  lesson_learnt: Existing coal-specific flowmeters should be recalibrated or supplemented
    before conducting extended biochar injection trials — an inaccurate concentration
    signal leads to unnecessary control interventions and limits the ability to optimise
    injection parameters for biochar-coal blends.
