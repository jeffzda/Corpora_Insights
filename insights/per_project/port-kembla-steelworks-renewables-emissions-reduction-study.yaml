  what_happened: Onsite pyrolysis production of 30,000 tpa of biochar at PKSW was
    estimated to require approximately $100M CAPEX using European pyrolysis equipment,
    and biochar must compete with PCI coal on price incorporating any carbon price.
    The economics of biochar are further complicated by limited current options for
    utilising pyrolysis by-products (approximately 40% of pyrolysis process output),
    which if valorised could significantly improve project economics.
  lesson_learnt: Biochar projects for industrial-scale PCI substitution face a dual
    economic challenge — high pyrolysis CAPEX and low by-product value; proponents
    should develop integrated business cases that include by-product valorisation
    pathways (pyrolysis oil, wood vinegar, renewable fuel) as a necessary condition
    for commercial viability rather than treating them as optional upside.
