  publish_date: '2023-09-29'
  project_name: Port Kembla Steelworks Renewables and Emissions Reduction Study
  what_happened: Australia's iron ore reserves are approximately 72% hematite and
    28% magnetite. Conventional DRI-EAF processes require high-grade ore (>67% Fe,
    <3% silica+alumina), which currently limits them to magnetite concentrates — representing
    less than 15% of global seaborne ore. Australian hematite, which dominates domestic
    reserves, requires higher-order beneficiation for DRI use, substantially increasing
    cost and reducing mined yield.
  lesson_learnt: 'Australian steelmakers transitioning to DRI-based ironmaking face
    a structural raw materials constraint: the country''s dominant hematite ore cannot
    be used in conventional DRI-EAF without costly beneficiation, making the DRI-ESF-BOF
    route (which accommodates lower-grade ore via an Electric Smelting Furnace) strategically
    important for Australian operations — decarbonisation pathway studies for Australian
    steelmakers should prioritise hematite-compatible process routes.'
