  publish_date: 2023-01
  project_name: Port Kembla Steelworks Renewables and Emissions Reduction Study
  what_happened: The BlueScope-UOW team developed a structured Information Review
    template with seven defined components (process description, material inputs/outputs,
    abatement pathway, KPIs, maturity, strengths/weaknesses, and additional descriptors)
    to systematically screen and compare decarbonisation technologies for PKSW. This
    approach enabled high-quality, site-specific prioritisation of viable technology
    options.
  lesson_learnt: When conducting multi-technology feasibility evaluations, develop
    and apply a standardised information-capture template upfront — a consistent structured
    format enables systematic first-pass screening using tools like SWOT and Fatal
    Flaws analysis, and produces site-specific prioritised options rather than generic
    global assessments.
