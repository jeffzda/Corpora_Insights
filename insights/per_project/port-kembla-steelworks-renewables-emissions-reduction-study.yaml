  project_name: Port Kembla Steelworks Decarbonisation Study
  what_happened: The QOA found that Top Gas Recycling with High Oxygen Blast Furnace
    (TGR-OBF) technology could not be included in the No. 6 BF reline scope because
    the BF design is fixed well in advance of the reline and retrofitting shaft staves
    and associated equipment during operations would be impractical, creating an investment
    cycle fatal flaw.
  lesson_learnt: Decarbonisation technologies that require fundamental modifications
    to blast furnace shaft design must be specified before the BF reline design is
    frozen — late-stage inclusion is not feasible without major production impact,
    meaning the window to incorporate such technologies is narrow and must be anticipated
    in capital planning cycles several years ahead of the reline.
