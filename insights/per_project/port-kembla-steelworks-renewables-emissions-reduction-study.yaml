- record_id: ARENA-DLV-40852
  source_title: Port Kembla Steelworks Renewables & Emissions Reduction Study
  publish_date: '2023-05-31'
  project_name: Port Kembla Steelworks Renewables and Emissions Reduction Study
  what_happened: Quality screening of Australian biochar samples revealed that many
    commercially available biochars were unsuitable for ironmaking due to excessive
    ash, volatile matter, heavy metal contamination (lead, zinc, arsenic), or moisture.
    Of six producers whose samples were analysed against BlueScope's specification,
    several exceeded limits for ash (>10%), moisture (>12%), lead (>10 mg/kg), and
    zinc (>50 mg/kg), with one biochar showing 52.8% ash and another 1,789 mg/kg zinc.
  lesson_learnt: Steelmaking applications require tight biochar quality specifications;
    procurement teams must obtain and test samples against ironmaking-specific parameters
    (ash, heavy metals, volatile matter) before committing to supply, as agricultural-grade
    biochar from waste timber or bio-solids feedstocks routinely fails these specifications.
