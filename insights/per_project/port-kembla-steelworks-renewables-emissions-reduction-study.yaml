  publish_date: '2023-09-29'
  project_name: Port Kembla Steelworks Renewables and Emissions Reduction Study
  what_happened: Hot metal transported from the blast furnace to the BOF in torpedo
    ladle cars loses over 170°C in transit; this temperature loss limits the amount
    of scrap that can be melted in the BOF, capping scrap utilisation. BlueScope developed
    a lid and opening/closing mechanism for torpedo ladles to reduce this temperature
    loss by approximately 40°C, which could enable additional scrap utilisation and
    an estimated 2.4% emissions intensity reduction.
  lesson_learnt: Heat loss in hot metal transport is a hidden constraint on scrap
    utilisation and emissions performance in integrated steelworks — engineering interventions
    to reduce torpedo ladle heat loss (e.g. insulating lids) can unlock meaningful
    additional scrap use and should be assessed as part of any emissions intensity
    improvement program.
