- record_id: ARENA-DLV-40855
  source_title: Port Kembla Steelworks Renewables & Emissions Reduction Study
  publish_date: '2023-05-31'
  project_name: Port Kembla Steelworks Renewables and Emissions Reduction Study
  what_happened: The Australian biochar market was found to be heavily oriented toward
    carbon sequestration and European carbon credit schemes (e.g. Puro.earth), leading
    most suppliers to apply a carbon credit premium to pricing. Quoted biochar prices
    ranged from ~$180/t FOB to ~$1,000/t FOB, with most sources above $500/t — rendering
    biochar uncompetitive with PCI coal on a cost-per-dry-tonne basis even after accounting
    for rising coal prices.
  lesson_learnt: Industrial biochar buyers must account for carbon credit premiums
    embedded in supplier pricing, which can add $120/t or more and make procurement
    from the spot market commercially unviable compared to coal; long-term offtake
    agreements or own-production are likely necessary to secure biochar at a competitive
    cost for steelmaking applications.
