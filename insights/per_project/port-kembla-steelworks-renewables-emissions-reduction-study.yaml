  what_happened: BlueScope increased scrap charged into the BOF from a historical
    average of approximately 65 t/heat (23% of steel production) to 76 t/heat (30%)
    through plant modifications and operational improvements, and subsequently conducted
    over 100 trials at above 90 t/heat (targeting 100 t) during FY23. Over the period
    from FY18 to FY23, PKSW's CO2 emissions intensity dropped by approximately 5%,
    with scrap rate increase identified as the major contributor.
