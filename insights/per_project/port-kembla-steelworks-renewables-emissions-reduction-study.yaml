  source_title: Port Kembla Steelworks Renewables & Emissions Reduction Study
  publish_date: '2023-05-31'
  project_name: Port Kembla Steelworks Renewables and Emissions Reduction Study
  what_happened: Blast furnace operation was unaffected at all tested biochar levels
    (5–30% nominal, effectively up to ~20% in the conveying line) across all 10 trial
    events. Key metrics — K factor, differential pressure, hot blast pressure and
    volume, hot metal temperature, silicon and sulphur in hot metal — remained stable
    throughout, and tuyere photography showed no adverse combustion effects. Production
    rate was maintained and in some trials increased.
  lesson_learnt: Biochar-coal blends of up to approximately 20% can be injected via
    PCI into blast furnace operations without detrimental effects on process stability,
    productivity, or hot metal quality — this constitutes industrial-scale validation
    of earlier laboratory combustion work and provides a credible evidence base for
    inclusion of biochar in blast furnace decarbonisation roadmaps.
