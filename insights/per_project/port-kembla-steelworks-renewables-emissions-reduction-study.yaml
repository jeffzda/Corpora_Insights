  project_name: Port Kembla Steelworks Decarbonisation Study
  what_happened: 'The study found that CCUS for integrated steelworks faces a specific
    logistical barrier at PKSW: the lack of proximate geological CO2 storage near
    the coast, combined with the challenge of capturing CO2 from multiple large-volume,
    dusty, dispersed off-gas sources across the plant, means that even commercially-proven
    small-scale absorption technologies cannot be straightforwardly scaled to PKSW
    requirements.'
  lesson_learnt: CCUS feasibility for coastal integrated steelworks must explicitly
    assess CO2 transport and storage logistics — the absence of nearby geological
    storage and the high cost of CO2 transport by pipeline or shipping represent site-specific
    barriers that can eliminate CCUS as a near-term option regardless of capture technology
    maturity; this should be a first-pass screen in any industrial CCUS feasibility
    study.
