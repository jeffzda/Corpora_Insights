  what_happened: Initial tuyere photography and biochar proportion sampling in different
    tuyere injection lines (4, 11, 18, 25) during Trials 3B and 4B showed broadly
    similar biochar concentrations across tuyere lines, suggesting no significant
    segregation through the 900-m pipeline or distributor. However, the measurement
    technique accuracy of ±5% (absolute) limited confidence in this finding.
  lesson_learnt: Uniform distribution of biochar through blast furnace tuyere lines
    appears achievable with existing distributor design, but confirmation requires
    more accurate measurement techniques and longer-duration trials — uneven tuyere
    distribution would be a critical risk as it could cause localised combustion instability
    and is difficult to detect without reliable near-simultaneous sampling from multiple
    lines.
