  source_title: Port Kembla Steelworks Renewables & Emissions Reduction Study
  publish_date: '2023-05-31'
  project_name: Port Kembla Steelworks Renewables and Emissions Reduction Study
  what_happened: Dedicated biomass plantations (short-rotation woody crops) were identified
    as the most reliable long-term biomass supply option for steelmaking-grade biochar
    in Australia, drawing on the successful Brazilian eucalyptus plantation model.
    However, even with fast-growing species planted immediately, a 3–7 year establishment
    lag means this source cannot contribute to near-term biochar supply, and Australia's
    higher labour costs relative to Brazil add economic uncertainty.
  lesson_learnt: Organisations targeting biochar use in steelmaking beyond the short
    term should initiate plantation establishment planning now to account for the
    3–7 year lag before material is available — waiting until near-term supply options
    are exhausted before developing dedicated biomass crops will result in an avoidable
    supply gap in the medium term.
