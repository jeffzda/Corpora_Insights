- record_id: ARENA-DLV-40866
  source_title: Port Kembla Steelworks Renewables & Emissions Reduction Study
  publish_date: '2023-05-31'
  project_name: Port Kembla Steelworks Renewables and Emissions Reduction Study
  what_happened: Due to the stagnant flow zones in the shared Raw Coal Storage Bin
    (RCSB) and Pulverised Coal Storage Bin (PCSB) — both originally designed for two
    blast furnaces but now feeding only one — biochar appeared in the injection stream
    much faster than plug-flow geometry predicted (~1–2 hours vs ~6 hours) and persisted
    in the system long after biochar loading had ceased (up to 50 hours post-trial
    start). This dilution effect limited the maximum biochar proportion actually injected
    to ~20% even during 30% nominal trials, making it impossible to assess the effect
    of sustained 30% biochar injection.
  lesson_learnt: Trials of novel coal substitutes in blast furnace PCI systems should
    account for storage vessel flow dynamics — non-plug-flow behaviour in bins originally
    sized for multiple furnaces can cause rapid early appearance and prolonged persistence
    of the substitute material, preventing attainment of target concentrations during
    short-duration trials; minimum trial duration should be calculated based on actual
    PCSB residence time, not geometric plug-flow assumptions.
  issue_severity: moderate
