- record_id: ARENA-DLV-40860
  source_title: Port Kembla Steelworks Renewables & Emissions Reduction Study
  publish_date: '2023-05-31'
  project_name: Port Kembla Steelworks Renewables and Emissions Reduction Study
  what_happened: Pilot-scale flow property testing at the University of Wollongong
    demonstrated that pulverised biochar-coal blends up to 30% biochar exhibited flow
    characteristics and wall friction angles very similar to 100% pulverised coal,
    with only a ~10% reduction in bulk density and improved flowability at higher
    biochar proportions. Segregation testing under 15-minute fluidisation cycles (matching
    PKSW injection hopper cycle times) showed no meaningful separation of coal and
    biochar.
  lesson_learnt: Pilot pneumatic conveying testing at lower pressures provides a conservative,
    fit-for-purpose indication of blend behaviour for higher-pressure industrial systems
    — because higher static pressure increases gas momentum and reduces minimum transport
    velocity, results from lower-pressure rigs are likely to understate the actual
    performance margin available in the industrial system.
  issue_severity: minor
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: industrial operator
  delay_category: no material delay stated
  failure_mode: no major failure stated
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: Pilot-scale trials at Bulk Materials Engineering Australia's
    University of Wollongong test facility were conducted to de-risk pneumatic conveying
    assumptions prior to plant trials.
  transferability: moderate
  delay_magnitude: null
  technology_domain: bioenergy
  source_pages:
  - 3
  - 35
  - 39
  - 44
  - 45
  - 46
  evidence_excerpt: static testing shows that biochar/coal blends show similar or
    slight improvements in several material flow related parameters when compared
    to coal. As such, while further results are still pending, indications are that
    biochar/coal blends will be easier to handle and therefore should convey as easily
    as coal alone, thereby limiting the potential impacts on the operation of the
    PCI Plant and Blast Furnace. This is contrary to expectations given that the particle
    shape of ground biochar is quite different to that of coal, being more needle-like
    and therefore potentially prone to binding.
