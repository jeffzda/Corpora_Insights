  what_happened: The Phase 1 desktop evaluation of decarbonisation technologies required
    substantially more time than planned due to the unexpected volume of qualitative
    information and data that needed to be assessed, summarised and reviewed before
    workshops and option prioritisation could proceed. The additional workload was
    not captured in the project's risk analysis.
  lesson_learnt: For desktop feasibility studies involving large-scale technology
    screening, carefully estimate and plan the workload for information gathering
    and review upfront — the assembly of qualitative data for multi-technology evaluations
    routinely exceeds initial expectations and should be explicitly captured in the
    project risk register.
