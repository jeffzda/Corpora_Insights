  source_title: Port Kembla Steelworks Identification of Prioritised Options
  publish_date: 2022-10
  project_name: Port Kembla Steelworks Decarbonisation Study
  what_happened: BlueScope's QOA determined that Electric Arc Furnace steelmaking
    was not a viable near-term option for PKSW due to the high capital cost of a new
    EAF plant alongside the existing configuration, inadequate supplies of prime scrap
    in Australia, and high electricity and gas unit costs — all constituting investment
    cycle fatal flaws.
  lesson_learnt: EAF-based secondary steelmaking is only viable where sufficient prime
    scrap supply exists and electricity/gas costs are competitive; Australian east-coast
    conditions (scrap shortage, high gas prices) currently eliminate this pathway
    for integrated BF-BOF plants, and project developers should assess local raw material
    and energy market conditions before including EAF in decarbonisation plans.
