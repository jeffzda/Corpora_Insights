  project_name: Port Kembla Steelworks Renewables and Emissions Reduction Study
  what_happened: BlueScope assessed Carbon Capture and Storage (CCS) for PKSW based
    on a CO2CRC study. The total cost of CO2 avoidance was estimated at $174/t (comprising
    $142/t for capture and $31.8/t for transport/storage by pipeline), which substantially
    exceeds expected Australian carbon pricing, making CCS commercially unviable for
    PKSW at this time.
  lesson_learnt: 'CCS applied to integrated steelworks in Australia faces a double
    cost barrier: the complexity of capturing CO2 from over 100 dispersed stacks at
    a large site, and the absence of local geological storage requiring long-distance
    CO2 transport — at $174/t total cost, CCS is not viable without a materially higher
    carbon price, and industrial proponents should defer CCS investment planning until
    capture costs fall significantly.'
