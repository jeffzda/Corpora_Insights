  source_title: Port Kembla Steelworks Renewables & Emissions Reduction Study
  publish_date: '2023-05-31'
  project_name: Port Kembla Steelworks Renewables and Emissions Reduction Study
  what_happened: Biochar transport costs proved disproportionately high due to biochar's
    low bulk density (~400 kg/m³), which caused trucks to reach volumetric capacity
    well before weight limits (each B-double carried only ~35 t), and because the
    WA-to-NSW route offered no backload opportunities, effectively doubling transport
    costs. High and variable moisture content (up to 40%) further inflated the cost
    per dry tonne delivered.
  lesson_learnt: For bulk biochar procurement, transport economics must be assessed
    on a dry-tonne basis accounting for low bulk density and high moisture variability
    — standard freight cost estimates based on coal or similar dense materials will
    substantially underestimate delivered cost. Seaborne transport from established
    woodchip ports should be prioritised over long-distance road freight where possible.
  issue_severity: moderate
