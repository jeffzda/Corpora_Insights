- record_id: ARENA-DLV-40876
  source_title: Port Kembla Steelworks Renewables & Emissions Reduction Study
  publish_date: '2023-05-31'
  project_name: Port Kembla Steelworks Renewables and Emissions Reduction Study
  what_happened: Investigation of pyrolysis by-products (bio-oil) found no ready commercial
    market in Australia or internationally in the short to medium term. Bio-oil's
    inherent properties (high oxygen and moisture content, low heating value, corrosivity,
    immiscibility with petroleum fuels, storage instability) require significant upgrading
    to be commercially useful, and upgrading technologies are not yet commercially
    mature. The conclusion was that all pyrolysis by-products would need to be combusted
    for onsite energy rather than sold as a revenue stream.
  lesson_learnt: Biochar production business cases for steelmaking should not assume
    a near-term revenue stream from bio-oil by-products — the absence of a commercial
    market for raw or upgraded bio-oil in Australia means that by-product combustion
    for process heat or steam is the only viable short-term disposition, and this
    should be reflected in techno-economic models for biochar production facilities.
