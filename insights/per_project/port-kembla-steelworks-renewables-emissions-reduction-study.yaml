  what_happened: As the scrap charge rate in the BOF increases beyond ~30% of heat
    weight, tramp elements (copper, chromium, nickel, zinc) in lower-grade scrap become
    an increasing constraint on steel product quality, limiting how far scrap utilisation
    can be pushed without introducing quality risks.
