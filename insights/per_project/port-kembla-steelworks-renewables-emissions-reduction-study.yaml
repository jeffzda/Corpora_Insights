    offer at most 20% CO2 reduction compared to BF ironmaking, which is insufficient
    for a net zero trajectory, and they require major capital investment. SR processes
    using H2-rich gas (Ironarc, flash ironmaking) remain at TRL 5 with limited scale-up
    experience.'
