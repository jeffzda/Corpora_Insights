- record_id: ARENA-DLV-43272
  source_title: Bluescope Steel - Port Kembla Steelworks Renewables & Emissions Reduction
    Study - Phase 3 Report
  publish_date: '2023-09-29'
  project_name: Port Kembla Steelworks Renewables and Emissions Reduction Study
  what_happened: Fluidised bed direct reduction processes (Circored, Finored/Finmet)
    have been commercially demonstrated at large scale but face persistent process
    stability challenges related to iron ore particle sticking, refractory erosion
    by fine particles, and non-uniform product quality; only one of two large commercial
    Finored/Finmet plants remains in operation. Hydrogen-based fluidised bed variants
    (HYFOR, HYREX) are at lower TRL with pilot plants announced for 2026.
  lesson_learnt: Fluidised bed DR technology carries higher commercialisation risk
    than shaft furnace DR for early movers due to unresolved process stability and
    ore quality sensitivity issues at scale; industrial operators selecting a long-term
    DRI process route should weight shaft furnace technology more heavily for reliability
    unless site-specific ore characteristics (e.g. availability of ultra-fines) make
    fluidised bed distinctly advantageous.
