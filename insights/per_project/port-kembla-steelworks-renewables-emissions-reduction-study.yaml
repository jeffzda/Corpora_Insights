- record_id: ARENA-DLV-40875
  source_title: Port Kembla Steelworks Renewables & Emissions Reduction Study
  publish_date: '2023-05-31'
  project_name: Port Kembla Steelworks Renewables and Emissions Reduction Study
  what_happened: A survey of over 30 pyrolysis technologies identified that most commercially
    available units have capacities well below 20,000 t/pa per unit, and that augur/screw
    reactors are limited by scale-up challenges at high temperatures. Only multiple
    hearth furnaces (MHF) and rotary kiln technologies (specifically the Torrcoal
    process) met BlueScope's combined requirements for scale (≥20,000 t/pa per unit),
    autogenous operation, feedstock flexibility, and adequate technology readiness
    level (TRL 8–9). No pyrolysis technology capable of producing bio-oil by-products
    at commercial scale and quality was identified.
  lesson_learnt: Industrial-scale biochar production for steelmaking requires technology
    selection focused on scale, autogenous operation, and feedstock flexibility —
    proponents should not assume that the wide range of commercially marketed pyrolysis
    technologies includes many options suitable for large-scale commodity biochar
    production, and should plan for significant further development work even for
    the most suitable candidates (MHF or rotary kiln).
