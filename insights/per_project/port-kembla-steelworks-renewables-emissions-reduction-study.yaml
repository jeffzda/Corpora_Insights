- record_id: ARENA-DLV-7151
  source_title: Port Kembla Steelworks Renewables & Emissions Reduction Study Lessons
    Learnt 2
  publish_date: 2022-12
  project_name: Port Kembla Steelworks Renewables and Emissions Reduction Study
  what_happened: Delivered biochar (850 tonnes from two suppliers) was found to be
    extremely dusty at low moisture levels due to its fine particle size and low density,
    but also capable of holding up to 45% moisture by mass — far exceeding coal's
    ~15% maximum — creating a difficult balance between dust suppression and moisture
    control for PCI Plant suitability. Rain events at the manufacturing facility caused
    deliveries to arrive with excessive moisture, significantly reducing transport
    efficiency.
  lesson_learnt: Fine, dry biochar requires a dedicated dust management protocol for
    site receipt and storage — plan for moisture addition as standard practice, but
    design storage arrangements and trial schedules to allow moisture to stabilise
    and be measured accurately before grinding operations begin, as uncontrolled moisture
    variability complicates process control during trials.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: pilot
  lifecycle_phase: construction/installation
  proponent_type: industrial operator
  delay_category: procurement/supply chain
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: execution & logistics
  intervention_note: A garden sprinkler system was applied to the biochar pile for
    approximately 24 hours after each delivery to reduce dust to acceptable levels;
    moisture levels were sampled periodically and a weighted average of 27% moisture
    was adopted for process calculations.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: bioenergy
  source_pages:
  - 2
  - 48
  - 49
  evidence_excerpt: biochar has significant capacity to hold water, up to at least
    45% by mass (in comparison to a maximum of ~15% for coal), which in turn becomes
    problematic for its future use in the PCI Plant. As such, it has taken some time
    to determine the balance between dust generation and moisture additions, with
    indications that for the fine biochar material, approximately 13-18% moisture
    is required to control dust levels.
  confidence_note: lifecycle_phase assigned as construction/installation as the issue
    arose during delivery and materials preparation ahead of pilot trials; delay_category
    is procurement/supply chain as the issue manifested in the supply and delivery
    of biochar. Canonical record merged from 2 source records across 2 document(s).
