- record_id: ARENA-DLV-40862
  source_title: Port Kembla Steelworks Renewables & Emissions Reduction Study
  publish_date: '2023-05-31'
  project_name: Port Kembla Steelworks Renewables and Emissions Reduction Study
  what_happened: Industrial-scale blast furnace trials using a staged 10-step programme
    (5–30% biochar addition, 1–24 hour durations) were conducted at PKSW No. 5 Blast
    Furnace between February and March 2023, consuming 965 dmt of biochar. Across
    all trials, proportioning, elevation, grinding, drying, and pneumatic conveying
    of biochar-coal blends proceeded without significant disruption; blast furnace
    process stability, hot metal temperature, silicon, sulphur, and productivity were
    unaffected.
  lesson_learnt: Biochar can replace up to 30% of pulverised coal in blast furnace
    injection without disrupting PCI plant or blast furnace operation; future industrial
    decarbonisation projects at integrated steelworks should consider this pathway
    as technically viable for further scale-up, subject to longer-duration trials
    and regulatory/supply constraints.
