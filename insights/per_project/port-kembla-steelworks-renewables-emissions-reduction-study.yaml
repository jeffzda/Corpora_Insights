    actionable and cost-effective emissions intensity reduction levers for integrated
    steelmakers — incremental plant modifications enabling higher scrap charging can
    deliver measurable site-wide CO2 intensity reductions (approximately 0.3% per
    tonne average scrap charge increase) without fundamental process change, and should
    be pursued in parallel with longer-term technology development.
