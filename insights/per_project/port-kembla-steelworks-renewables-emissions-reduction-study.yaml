  source_title: Port Kembla Steelworks Renewables & Emissions Reduction Study
  publish_date: '2023-05-31'
  project_name: Port Kembla Steelworks Renewables and Emissions Reduction Study
  what_happened: The total biochar consumed across all industrial trials was 965 dmt
    — described by the report as a very small amount relative to normal raw materials
    trials, which typically require thousands to tens of thousands of tonnes. Due
    to this supply constraint, combined with PCSB dilution effects, trials of 30%
    biochar addition could not generate representative results for sustained 30% injection,
    and the conclusions are limited to 20% biochar addition.
  lesson_learnt: Industrial-scale blast furnace raw materials trials require substantially
    more material than 965 t to generate statistically representative results at target
    substitution levels — future biochar trial programmes should be designed around
    a minimum of 72 continuous hours at target concentration, requiring supply plans
    of several thousand tonnes, before conclusions about operational viability at
    30% substitution can be drawn.
