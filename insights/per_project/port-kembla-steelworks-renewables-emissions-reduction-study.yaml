- record_id: ARENA-DLV-40874
  source_title: Port Kembla Steelworks Renewables & Emissions Reduction Study
  publish_date: '2023-05-31'
  project_name: Port Kembla Steelworks Renewables and Emissions Reduction Study
  what_happened: Biochar pricing from the Australian market was found to be uncompetitive
    with PCI coal on a delivered dry-tonne basis, and the conclusion was that should
    BlueScope wish to use biochar at scale, it would likely need to invest in its
    own biochar production — at PKSW or nearby — using biomass transported by sea.
    The report identified that no large-scale commercial pyrolysis facility suitable
    for BlueScope's requirements existed in Australia, and that investment in either
    a multiple hearth furnace or rotary kiln technology would be required.
  lesson_learnt: For industrial-scale biochar use in steelmaking, self-sufficiency
    in biochar production is likely to be required rather than market procurement
    — project developers should plan for significant capital investment in pyrolysis
    infrastructure alongside biomass supply chain development, rather than treating
    biochar as a commodity input that can be purchased at scale from existing suppliers.
