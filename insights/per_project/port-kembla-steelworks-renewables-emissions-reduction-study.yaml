  publish_date: '2023-09-29'
  project_name: Port Kembla Steelworks Renewables and Emissions Reduction Study
  what_happened: DRI is a highly reactive material susceptible to re-oxidation and
    potential fire or explosion when exposed to air during storage, transport, or
    furnace charging. This safety issue applies to both the DRI-ESF-BOF and DRI-EAF
    process routes and requires dedicated engineering solutions (nitrogen atmosphere
    conveyor systems and storage) that, while proven at TRL 9 in EAF industry, still
    require adaptation and confirmation for ESF application at PKSW scale.
  lesson_learnt: Projects planning to handle DRI as a feed material must integrate
    DRI reactivity and safe handling requirements into engineering design from the
    earliest stages — nitrogen atmosphere handling systems are a proven but non-trivial
    engineering requirement that adds capital cost and operational complexity, and
    should be scoped into feasibility studies rather than deferred to detailed design.
