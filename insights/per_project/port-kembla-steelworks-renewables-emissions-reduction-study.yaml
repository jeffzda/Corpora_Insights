- record_id: ARENA-DLV-40851
  source_title: Port Kembla Steelworks Renewables & Emissions Reduction Study
  publish_date: '2023-05-31'
  project_name: Port Kembla Steelworks Renewables and Emissions Reduction Study
  what_happened: BlueScope surveyed 21 potential Australian biochar suppliers and
    found that domestic production capacity (estimated at 10,000–20,000 t/pa) was
    far too small and insufficiently focused on commodity-grade biochar to supply
    the minimum 130,000 t/pa BlueScope would require to replace 30% of pulverised
    coal injection. Most suppliers produced only hundreds of tonnes per year, predominantly
    for horticultural markets in small bags, and none were willing to commit to the
    1,000 t required even for an industrial trial.
  lesson_learnt: Industrial decarbonisation projects in heavy industry that rely on
    novel bio-based feedstocks must treat domestic supply chain development as a parallel
    workstream to process trials — absence of an Australian biochar supply chain is
    the critical path constraint blocking scale-up at PKSW, and similar constraints
    will affect other steelmakers considering biomass substitution.
