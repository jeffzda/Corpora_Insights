- record_id: ARENA-DLV-43279
  source_title: Bluescope Steel - Port Kembla Steelworks Renewables & Emissions Reduction
    Study - Phase 3 Report
  publish_date: '2023-09-29'
  project_name: Port Kembla Steelworks Renewables and Emissions Reduction Study
  what_happened: For integrated steelworks operating the DRI-ESF-BOF route with hydrogen-based
    DRI, the resulting near-zero carbon DRI requires a source of renewable carbon
    for carburization in the ESF, alloying to steel specification in the BOF, and
    potentially for slag conditioning. This carbon requirement creates a secondary
    dependency on renewable carbon sources (e.g. biochar) that is not present in conventional
    BF-BOF operations.
  lesson_learnt: Decarbonisation pathways using H2-DRI in an ESF-BOF configuration
    introduce a new dependency on renewable carbon supply that does not exist in the
    BF-BOF route — project teams should identify and secure renewable carbon supply
    (e.g. biochar) as a co-development requirement alongside hydrogen and electricity
    supply when planning DRI-ESF-BOF transitions.
