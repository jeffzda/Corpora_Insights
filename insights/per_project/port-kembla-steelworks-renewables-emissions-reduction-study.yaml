- record_id: ARENA-DLV-10551
  source_title: Port Kembla Steelworks Identification of Prioritised Options
  publish_date: 2022-10
  project_name: Port Kembla Steelworks Decarbonisation Study
  what_happened: BlueScope conducted a systematic qualitative options analysis (QOA)
    of 17 SCU and DCA technology areas for PKSW and found that no single breakthrough
    low-emissions technology was commercially viable to replace the blast furnace
    by the mid-2020s, leading to a decision to reline and upgrade the No. 6 Blast
    Furnace as a bridging investment.
  lesson_learnt: For capital-intensive hard-to-abate industrial sites, a structured
    fatal-flaw and technology readiness assessment should be completed before committing
    to a decarbonisation pathway — this study confirmed that the BF reline was the
    only credible near-term option given scrap availability constraints, high east-coast
    natural gas costs, and the >decade timeline to commercial breakthrough technologies.
  issue_severity: none
  project_type: industrial decarbonisation
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: concept/feasibility
  proponent_type: industrial operator
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Completed a three-phase Qualitative Options Analysis using four
    technical decision criteria and a fatal-flaw screening approach to narrow 17 technology
    areas to a prioritised shortlist for further assessment.
  transferability: moderate
  delay_magnitude: null
  technology_domain: industrial renewables
  source_pages: &id003
  - 3
  - 4
  - 9
  - 10
  evidence_excerpt: 'The reline and upgrade plan is based on: Inadequate supplies
    of prime scrap in Australia to enable secondary steelmaking (via Electric Arc
    Furnace (EAF) production), The relatively high cost of natural gas rendering DRI
    economically unviable at this time, and Accepted industry estimates that breakthrough,
    low emissions steel technology to replace the BF-BOF process is likely to be more
    than a decade from commercialisation.'
