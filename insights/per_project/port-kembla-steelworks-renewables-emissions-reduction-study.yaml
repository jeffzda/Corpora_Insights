- record_id: ARENA-DLV-65756
  source_title: Port Kembla Steelworks Renewables & Emissions Reduction Study Lessons
    Learnt 4
  publish_date: 2023-04
  project_name: Port Kembla Steelworks Renewables and Emissions Reduction Study
  what_happened: Further longer-duration trials (weeks/months) of biochar injection
    are required to assess long-term process effects, but these are constrained by
    EPA licence limitations and biochar supply availability. Short-duration trials
    (12–24 hours per trial stage) were sufficient to demonstrate feasibility but insufficient
    to confirm there are no longer-term operational impacts.
  lesson_learnt: Industrial decarbonisation trials using novel feedstocks in regulated
    plant environments should proactively engage with the EPA and secure regulatory
    headroom and feedstock supply agreements before scheduling trials — post-trial
    constraints on further testing can stall scale-up momentum.
