  source_title: Port Kembla Steelworks Renewables & Emissions Reduction Study
  publish_date: '2023-05-31'
  project_name: Port Kembla Steelworks Renewables and Emissions Reduction Study
  what_happened: A Request for Information to 18 forestry and woodchip organisations
    found that response rates were low and that most respondents focused on premium
    woodchip production rather than forestry residues. Only three respondents provided
    information on residues, with many producers stating there was insufficient demand
    for residues to justify investment in collection and processing infrastructure.
    Indicative residue availability was nonetheless estimated at 500,000–800,000 green
    metric tonnes per year from eastern Australia, potentially yielding ~130,000 t/pa
    of biochar.
  lesson_learnt: Forestry residue supply for industrial biochar production in Australia
    is constrained not by physical availability but by absence of collection infrastructure
    and insufficient demand signals — a prospective large-scale user should expect
    to co-invest in residue collection and processing capability or provide long-term
    demand commitments to unlock this resource.
