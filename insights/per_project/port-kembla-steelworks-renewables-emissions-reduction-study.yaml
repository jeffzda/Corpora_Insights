  what_happened: The ISREM process simulation model used for the study was validated
    on 2018–2019 yearly average data at a production rate of 308 tph of hot metal.
    The model does not include the PKSW power plant, requiring a simplifying assumption
    (natural gas as balancing fuel) for excess fuel gas energy impacts, and estimates
    of CO2 reduction for scenarios outside validated process conditions carry a degree
    of uncertainty.
  lesson_learnt: Process simulation models for decarbonisation option assessment in
    integrated steelworks should explicitly bound their scope (e.g. exclusion of power
    plants) and validation period, and report scenario results with uncertainty ranges
    when operating outside validated conditions — failure to do so can give false
    precision to abatement estimates that inform investment decisions.
