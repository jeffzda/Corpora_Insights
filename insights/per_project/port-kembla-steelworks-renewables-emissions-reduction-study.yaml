  what_happened: Investigation of waste timber from landfill streams found that while
    significant volumes exist (~354,000 t/pa to NSW landfill), most material is already
    captured by competing markets (process engineered fuels, export markets, composting).
    Analysis of five waste timber samples showed elevated heavy metals — arsenic up
    to 117 mg/kg, lead up to 37 mg/kg, zinc up to 1,220 mg/kg — primarily from CCA-treated
    timber contamination, with concentrations expected to increase 3–4 times in the
    resulting biochar post-pyrolysis.
  lesson_learnt: Waste timber from construction and demolition streams should not
    be assumed to be a low-cost, low-risk biochar feedstock for steelmaking without
    detailed chemical screening — CCA contamination is widespread, heavy metal concentrations
    multiply during pyrolysis, and competition from the waste-to-energy sector limits
    actual availability despite headline volume estimates.
