  project_name: Port Kembla Steelworks Renewables and Emissions Reduction Study
  what_happened: 'CCS applied to PKSW was assessed as facing a site-specific structural
    barrier: PKSW is located in the Sydney Basin, which is geologically unsuitable
    for CO2 storage, meaning any captured CO2 would need to be transported long distances
    (by pipeline or ship) to suitable storage sites such as Darling Basin or Gippsland
    Basin, adding $31.8/t to the already high capture cost of $142/t.'
  lesson_learnt: Industrial facilities in the Sydney Basin or similar geologically
    unsuitable areas face a permanent structural cost disadvantage for CCS relative
    to sites near suitable storage geology — site-specific geological suitability
    for CO2 storage should be assessed as an early screening criterion in CCS feasibility
    studies to avoid investing in detailed capture engineering for commercially non-viable
    configurations.
