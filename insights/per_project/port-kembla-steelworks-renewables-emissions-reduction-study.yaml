- record_id: ARENA-DLV-40880
  source_title: Port Kembla Steelworks Renewables & Emissions Reduction Study
  publish_date: '2023-05-31'
  project_name: Port Kembla Steelworks Renewables and Emissions Reduction Study
  what_happened: BlueScope's target of replacing 30% of pulverised coal injection
    (approximately 130,000 t/pa of biochar) would require biomass supply of approximately
    430,000–650,000 green metric tonnes per year. The RFI process and supply analysis
    confirmed that while forestry residue volumes potentially sufficient for this
    exist in eastern Australia, overland transport economics constrain viable sourcing
    to within ~100 km of the production facility. Seaborne transport from established
    woodchip ports in southern NSW, Victoria, and Tasmania was identified as the most
    economically viable supply route, suggesting co-location of a biochar facility
    at PKSW is advantageous.
  lesson_learnt: For large-scale industrial biochar production, transport economics
    — not biomass physical availability — is the binding constraint; biochar production
    facilities should be located at or near deep-water port infrastructure with existing
    woodchip handling capability, as overland transport of low-density, high-moisture
    biomass beyond ~100 km makes the resulting biochar uncompetitive with coal.
