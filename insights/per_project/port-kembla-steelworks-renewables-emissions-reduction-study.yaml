    for long-term industrial decarbonisation: coal-based variants offer insufficient
    abatement potential for net zero pathways, while hydrogen-based variants are too
    immature for near-term commercial deployment — SR should generally not be a priority
    in steelworks decarbonisation roadmaps unless site-specific factors (e.g. non-coking
    coal availability, absence of pelletising capacity) make DRI routes unviable.'
