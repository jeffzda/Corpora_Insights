  what_happened: During Trials 1A–1D (5–8% biochar, 1–6.3 hours), initial biochar
    proportioning required mixing biochar with coal in the stockyard two days prior
    because the mixing plant could not directly weigh small biochar proportions. Heavy
    rain during the pre-blending period added uncertainty to actual dry biochar proportions,
    with Trial 1D loading 145 wmt against an aim of 113 wmt, indicating the coal yard
    mix was wetter and heavier than planned.
  lesson_learnt: For low-proportion biochar trials using stockyard pre-blending, rain
    events can significantly alter the wet mass of material loaded and therefore the
    actual dry biochar proportion — trials should either be scheduled around weather
    windows or use covered stockpiling and dry-mass verification to ensure the target
    blend ratio is achieved.
