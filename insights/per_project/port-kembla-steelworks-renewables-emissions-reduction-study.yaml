  what_happened: Process simulation modelling (ISREM) predicted that substituting
    30% of pulverised coal injection (PCI) with biochar would reduce PKSW's total
    CO2 emissions by approximately 6.6% from the 2018–19 baseline, while torrefied
    biomass at the same substitution rate yielded only 3.8% reduction due to lower
    carbon content and adverse effects on Raceway Adiabatic Flame Temperature.
  lesson_learnt: When selecting biomass substitutes for blast furnace PCI, biochar
    is materially superior to torrefied biomass on a CO2 reduction basis at equivalent
    substitution rates; project teams should use process simulation to quantify this
    differential before committing to pyrolysis technology choices, as the difference
    is operationally significant.
