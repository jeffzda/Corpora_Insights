  what_happened: For relatively low-volume steelmakers such as BlueScope (~3 million
    tonnes of steel per annum from a single operating blast furnace), the study found
    that a conservative approach to technology transition is required, with limited
    resources meaning only a select few technologies with the greatest financially
    viable emissions reduction potential can be pursued concurrently.
  lesson_learnt: Smaller integrated steelmakers cannot pursue broad technology portfolios
    in parallel — decarbonisation programs should prioritise a limited number of technically
    mature options with credible near-term commercial viability, and use a structured
    options assessment process to screen out technologies requiring significant resource
    investment for modest or uncertain returns.
