  what_happened: Contamination of biochar with timber offcuts (from co-storage with
    unprocessed wood at the WA supplier's yard) and, in the final trial batch, scrap
    steel (from shed clean-out), was detected on multiple occasions — timber pieces
    caused blockages in mixing plant Bin 3 legs and were found in the oversize screen
    reject bins. Metal was detected and removed by the magnetic separator.
  lesson_learnt: Biochar supply contracts should include explicit requirements for
    contamination limits (particularly timber offcuts and metals) and dedicated clean
    storage at the supplier — contamination is a supply-chain issue not inherent to
    biochar, but without contractual controls it creates recurring operational risks
    to conveying and grinding equipment.
