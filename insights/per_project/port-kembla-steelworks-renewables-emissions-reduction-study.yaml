  publish_date: 2022-10
  project_name: Port Kembla Steelworks Decarbonisation Study
  what_happened: The study established that decarbonising PKSW to net zero by 2050
    is contingent on five external enablers — commercialisation of breakthrough technologies,
    affordable and reliable renewable energy, competitively priced renewable hydrogen
    at volume, appropriate quality and quantity of raw materials, and supportive government
    policy — none of which are within BlueScope's direct control.
  lesson_learnt: Industrial decarbonisation pathways for hard-to-abate sectors cannot
    be planned as internally-managed projects alone — they are contingent on systemic
    infrastructure investments (renewable energy, hydrogen supply), policy settings,
    and global technology development timelines that require government co-investment
    and long-term engagement; project developers and funders should structure milestones
    and go/no-go decision points around the materialisation of these external enablers.
