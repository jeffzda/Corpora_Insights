- record_id: ARENA-DLV-40863
  source_title: Port Kembla Steelworks Renewables & Emissions Reduction Study
  publish_date: '2023-05-31'
  project_name: Port Kembla Steelworks Renewables and Emissions Reduction Study
  what_happened: During trials at 20–30% biochar addition, the lower bulk density
    of biochar (~400 kg/m³ vs ~750 kg/m³ for coal) caused the actual grinding throughput
    to be lower than the control system calculated, because the drag-chain conveyor
    feeding the mill uses a fixed assumed coal density. This resulted in the actual
    mass of material reaching the pulverised coal storage bin (PCSB) being less than
    the calculated net fill rate, leading to longer-than-expected grinding periods.
  lesson_learnt: Wet biochar with moisture levels substantially higher than the base
    coal (27% vs 8–12%) imposes a meaningful additional drying load on PCI plant mills
    — for future biochar procurement, specifying and controlling delivered moisture,
    or accepting reduced grinding rates during wet weather periods, should be built
    into operational planning from the outset.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: industrial operator
  delay_category: commissioning/integration
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Minor reductions in grinding rate corrected the moisture issue
    during the trial; the document notes that biochar with lower moisture (closer
    to standard commercial supply) would not be expected to cause this problem.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: bioenergy
  source_pages:
  - 2
  - 3
  - 4
  - 64
  - 65
  - 67
  - 68
  - 71
  - 72
  - 73
  - 78
  evidence_excerpt: Despite the high biochar moisture (27%) – no significant affects
    were notable on the drying/grinding operation until the biochar proportion reached
    30%, where significantly higher moistures were measured in the ground product.
    Minor reductions in grinding rate were able to correct this. This could be problematic
    in the future; however, the moistures of the trial biochar were exceptionally
    high and are not expected to be repeated.
