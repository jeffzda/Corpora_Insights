  what_happened: Trial 4B consumed all remaining biochar stock. An increase in furnace
    injection rate mid-programme (from 40 t/hr to 46 t/hr) had increased biochar consumption
    per trial, so the final batch was approximately 11 t short of the 453 t aimed,
    shortening Trial 4B by approximately one hour. The final biochar deliveries also
    contained contamination from shed clean-out material (scrap steel and timber/plywood).
  lesson_learnt: Industrial trial programmes that consume nearly all available material
    should include a contingency stock buffer to absorb increases in consumption rates
    — changes to injection rate or trial duration during a programme will affect total
    biochar requirements, and running the supply to zero creates risk of curtailed
    final trials and contamination from residual shed material.
