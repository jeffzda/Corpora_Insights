- record_id: ARENA-DLV-43275
  source_title: Bluescope Steel - Port Kembla Steelworks Renewables & Emissions Reduction
    Study - Phase 3 Report
  publish_date: '2023-09-29'
  project_name: Port Kembla Steelworks Renewables and Emissions Reduction Study
  what_happened: 'Natural gas injection into the blast furnace was assessed as having
    limited decarbonisation value: it was replaced by PCI at PKSW in 2002 because
    PCI enabled significantly more energy/reductant to be injected, resulting in cost
    reductions and productivity gains. A maximum RAFT-constrained natural gas injection
    scenario would decrease PKSW emissions by up to only ~3%, at a cost approximately
    1.5 times PCI coal on an energy content basis.'
  lesson_learnt: Natural gas injection into blast furnaces is not a meaningful decarbonisation
    option for integrated steelmakers already using PCI — the combination of limited
    abatement potential (~3%), higher operating cost than coal, and RAFT constraints
    makes it uncompetitive; project teams should not include NG injection as a serious
    near-term emissions reduction measure in steelworks decarbonisation programs.
