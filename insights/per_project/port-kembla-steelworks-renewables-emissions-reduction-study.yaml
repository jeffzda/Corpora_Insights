- record_id: ARENA-DLV-43278
  source_title: Bluescope Steel - Port Kembla Steelworks Renewables & Emissions Reduction
    Study - Phase 3 Report
  publish_date: '2023-09-29'
  project_name: Port Kembla Steelworks Renewables and Emissions Reduction Study
  what_happened: COG injection at PKSW was previously practised in the 1990s at up
    to 100 Nm3/tHM but was discontinued. A 2022 pre-feasibility study found that reinstating
    COG injection would require a $62M CAPEX COG compression plant, and the proposed
    design needed to draw COG from multiple sources, some of which would reduce internal
    COG generation and thus increase Scope 2 emissions — partially negating the Scope
    1 abatement benefit.
  lesson_learnt: Reinstating previously discontinued injection technologies at integrated
    steelworks requires a full plant-wide gas balance assessment — partial COG diversion
    for injection may reduce availability for other internal uses (power generation,
    heating), creating Scope 2 emissions increases that offset Scope 1 benefits and
    must be captured in the net abatement calculation.
