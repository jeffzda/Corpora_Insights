- record_id: ARENA-DLV-35101
  source_title: DEIP Market Integration Trials Summary Report 2.0
  publish_date: 2023-12
  project_name: DEIP DER Market Integration Trials (Project EDGE, Project Converge,
    Project Edith, Project Symphony)
  what_happened: Surveys of 898 community residents found consumers were generally
    lukewarm about joining VPPs or aggregators, with low trust in aggregators. Only
    57% of VPP trial participants believed aggregators looked after their long-term
    household needs, and 29% believed aggregators benefited more than consumers themselves.
  lesson_learnt: VPP service providers must proactively build consumer trust through
    greater transparency, control, safeguards, and clear information — without these,
    consumer reluctance will constrain VPP uptake and retention even where financial
    benefits exist.
