- record_id: ARENA-DLV-40964
  source_title: Renewable Energy for Process Heat Opportunity Study Final Report
  publish_date: 2022-03
  project_name: Renewable Energy for Process Heat - Opportunity Study Phase 2
  what_happened: The 3 Ravens Brewery feasibility study found that a brewing process
    — inherently a batch operation — posed a fundamental challenge for heat pump integration,
    as heat pumps work best in continuous operation. The solution required advanced
    PLC control, redundancy, thermal storage (including 29 kWh of latent energy storage),
    and redesigned heat exchange systems to manage simultaneous and intermittent heating
    and cooling demands.
  lesson_learnt: Batch processes are a more complex application for heat pumps than
    continuous processes — ensure the design includes flexible thermal storage, redundancy,
    and advanced controls to manage intermittent and sometimes simultaneous heating
    and cooling demands; failure to do so will result in poor capacity factor and
    degraded economics.
