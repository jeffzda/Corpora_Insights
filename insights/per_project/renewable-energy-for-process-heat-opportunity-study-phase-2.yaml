- record_id: ARENA-DLV-40957
  source_title: Renewable Energy for Process Heat Opportunity Study Final Report
  publish_date: 2022-03
  project_name: Renewable Energy for Process Heat - Opportunity Study Phase 2
  what_happened: At some sites studied, insufficient physical space was available
    to install a thermal battery or hot water tank alongside the heat pump. Without
    thermal storage, heat pumps could only operate when heat was directly demanded,
    reducing capacity factor and worsening economic performance.
  lesson_learnt: Confirm available floor space for both the heat pump and a thermal
    storage tank before committing to a heat pump project — space constraints that
    prevent thermal battery installation will force the heat pump to operate at low
    capacity factor and can make the investment uneconomic.
