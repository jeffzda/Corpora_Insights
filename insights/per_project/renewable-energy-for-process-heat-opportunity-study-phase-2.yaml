- record_id: ARENA-DLV-40974
  source_title: Renewable Energy for Process Heat Opportunity Study Final Report
  publish_date: 2022-03
  project_name: Renewable Energy for Process Heat - Opportunity Study Phase 2
  what_happened: The study found that a thermal battery or hot water tank used in
    conjunction with a heat pump creates demand flexibility — the ability to shift
    electrical load to times of low or negative electricity prices, avoid peak time-of-use
    tariffs (e.g. 5 pm–9 pm), and absorb excess variable renewable energy — generating
    additional revenue or cost savings not captured in simple payback calculations.
  lesson_learnt: Quantify demand flexibility value when assessing heat pump economics
    — the ability to schedule heat pump operation around wholesale electricity prices
    and time-of-use tariffs, including during periods of negative electricity prices,
    can provide material additional revenue that improves project economics beyond
    the base energy-saving case.
