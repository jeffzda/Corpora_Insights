  what_happened: The study noted that industrial heat pump technology for temperatures
    above 100°C was still at pilot and demonstration stage at the time of the study,
    limiting the decarbonisation pathway for the significant portion of industrial
    process heat demand above this threshold.
  lesson_learnt: For process heat demands above 100°C, industrial heat pump technology
    is not yet commercially mature — project developers should consider hybrid solutions
    combining heat pumps for lower-temperature duties with other technologies (biogas,
    solar thermal, green hydrogen) for higher-temperature requirements, and monitor
    the development of very high temperature heat pump technology.
