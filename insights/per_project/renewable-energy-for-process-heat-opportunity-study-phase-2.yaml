  what_happened: The study identified that sites converting from centralised steam
    systems to heat pump-based hot water systems may face significant additional costs
    if long steam pipe runs need to be converted to hot water reticulation, adding
    costs that can substantially alter project economics.
  lesson_learnt: Assess the cost of converting existing steam pipe runs to hot water
    reticulation before committing to a centralised heat pump replacement — in facilities
    with long pipe runs, deploying heat pumps to serve discrete local process needs
    rather than as a centralised replacement system can avoid these conversion costs
    entirely.
