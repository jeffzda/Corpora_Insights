- record_id: ARENA-DLV-40954
  source_title: Renewable Energy for Process Heat Opportunity Study Final Report
  publish_date: 2022-03
  project_name: Renewable Energy for Process Heat - Opportunity Study Phase 2
  what_happened: Across multiple sites studied, waste heat flows were not mapped,
    resulting in missed opportunities to use waste heat as a heat source for the heat
    pump, which would have increased COP and reduced operating costs. This was typically
    linked to the same sites lacking good energy data.
  lesson_learnt: Conduct waste heat mapping (using methods such as pinch analysis)
    before finalising heat pump design — utilising waste heat from refrigeration plant
    or compressed air systems as the heat source can increase heat pump efficiency
    by approximately 25% (for every 1°C increase in source temperature, efficiency
    improves by approximately 2.5%).
