  what_happened: The study found that the absence of white certificate schemes or
    targeted grant funding for industrial heat pump projects meant that many projects
    with paybacks between three and seven years could not clear typical business investment
    hurdle rates, slowing adoption even where the technology was technically and economically
    viable in absolute terms.
