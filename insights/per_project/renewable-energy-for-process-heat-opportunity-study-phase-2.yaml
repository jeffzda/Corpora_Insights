  what_happened: The Victorian meat processing site used a 1,000 kW heat pump (half
    the 2,000 kW boiler capacity it was supplementing) operating continuously with
    two 160,000-litre thermal storage tanks to smooth demand. The heat pump also recovered
    approximately 800 kW of heat from the existing ammonia refrigeration system, reducing
    condenser load and delivering water and electricity co-savings.
  lesson_learnt: In large industrial sites with significant refrigeration loads, integrating
    the heat pump with the refrigeration system's condenser circuit can recover substantial
    waste heat (800 kW in this case), reduce heat pump operating costs, and generate
    secondary savings in cooling tower water consumption and condenser fan electricity
    — this integration should be explicitly modelled at feasibility stage.
