- record_id: ARENA-DLV-40952
  source_title: Renewable Energy for Process Heat Opportunity Study Final Report
  publish_date: 2022-03
  project_name: Renewable Energy for Process Heat - Opportunity Study Phase 2
  what_happened: Across multiple feasibility studies, heat pumps were routinely assessed
    against conventional boilers using a like-for-like capacity replacement assumption,
    which systematically overstated the required heat pump size and capital cost,
    making heat pumps appear uncompetitive.
  lesson_learnt: Never assess a heat pump on a like-for-like capacity replacement
    basis with the boiler it is replacing — conventional boilers are oversized for
    peak demand and a heat pump with as little as 50% of the boiler's capacity can
    deliver the same service when paired with thermal storage, cutting CapEx by 20%
    or more and reducing simple payback below three years.
