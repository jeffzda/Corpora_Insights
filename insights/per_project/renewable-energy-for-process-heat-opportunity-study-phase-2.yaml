- record_id: ARENA-DLV-40953
  source_title: Renewable Energy for Process Heat Opportunity Study Final Report
  publish_date: 2022-03
  project_name: Renewable Energy for Process Heat - Opportunity Study Phase 2
  what_happened: At many sites studied, natural gas consumption data was only available
    from monthly bills rather than at the granular intervals needed (approximately
    every five minutes), and steam or hot water consumption data was not available
    at the individual process level. This lack of energy and heat data led to inaccurate
    sizing of heat pumps.
  lesson_learnt: Before sizing a heat pump, install sub-metering to obtain intraday
    and intra-seasonal heating demand profiles at approximately five-minute intervals
    and at the individual process level — without this data, heat pumps will be oversized
    and CapEx will be unnecessarily high.
