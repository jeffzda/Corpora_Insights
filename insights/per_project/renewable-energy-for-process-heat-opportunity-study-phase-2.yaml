- record_id: ARENA-DLV-40956
  source_title: Renewable Energy for Process Heat Opportunity Study Final Report
  publish_date: 2022-03
  project_name: Renewable Energy for Process Heat - Opportunity Study Phase 2
  what_happened: For sites with historically large natural gas consumption relative
    to electrical consumption, transitioning to heat pumps created electrical capacity
    constraints at the site or at the nearby substation, resulting in the need for
    costly electrical infrastructure upgrades. One site's CapEx increased significantly
    between feasibility and final investment decision stages due to required on-site
    electrical system upgrades.
  lesson_learnt: Assess site electrical capacity and distribution network capacity
    early in heat pump project development — electrical upgrade costs can materially
    change project economics and should be included in feasibility-stage cost estimates,
    not discovered at final investment decision.
