  source_title: Renewable Energy for Process Heat Opportunity Study Final Report
  publish_date: 2022-03
  project_name: Renewable Energy for Process Heat - Opportunity Study Phase 2
  what_happened: Across 20 pre-feasibility and 7 feasibility studies of industrial
    process heating applications, industrial heat pumps were recommended as the preferred
    technology in 90% of studies for heat demands below 90°C, outperforming solar
    thermal and biogas options where site conditions were favourable.
  lesson_learnt: For low-temperature process heat (<90°C), industrial heat pumps should
    be the default first consideration — they were the recommended technology in 90%
    of studies and can deliver levelised costs of heating competitive with fossil
    fuels when properly sized and integrated.
