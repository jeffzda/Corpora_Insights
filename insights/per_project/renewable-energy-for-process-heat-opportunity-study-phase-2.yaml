- record_id: ARENA-DLV-40958
  source_title: Renewable Energy for Process Heat Opportunity Study Final Report
  publish_date: 2022-03
  project_name: Renewable Energy for Process Heat - Opportunity Study Phase 2
  what_happened: Two projects within the study program could not proceed from pre-feasibility
    to feasibility stage because sites lacked the staff availability and capital to
    install the energy metering required for a proper feasibility assessment.
  lesson_learnt: Insufficient internal resources or metering infrastructure can block
    projects at the pre-feasibility to feasibility transition — programme designers
    should consider funding or subsidising energy metering as a prerequisite step,
    or provide targeted support to resource-constrained sites to avoid attrition at
    this stage.
