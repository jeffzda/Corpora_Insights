- record_id: ARENA-DLV-40955
  source_title: Renewable Energy for Process Heat Opportunity Study Final Report
  publish_date: 2022-03
  project_name: Renewable Energy for Process Heat - Opportunity Study Phase 2
  what_happened: Benchmarking analysis across feasibility studies found that capacity
    factor (hours of operation per year at maximum output) was the single most consistent
    determinant of economic performance for industrial heat pumps, with the site with
    the lowest capacity factor (11.5%) returning the longest payback period.
  lesson_learnt: Prioritise maximising heat pump capacity factor when assessing economic
    viability — sites operating less than 4,000 hours per year or with intermittent
    demand are poor candidates unless thermal storage is used to increase operating
    hours; sites with capacity factors below approximately 15% are likely to have
    unacceptable payback periods.
