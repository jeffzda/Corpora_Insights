  evidence_excerpt: Any heat pump system works best operating in a constant state
    (optimised with variable speed systems), yet brewing is by nature a batch process.
    Where the heating and cooling services come from the same machine it is a challenge
    to ensure that the system can produce both thermal streams where they are not
    required at the same time. The key to success in this application is system flexibility,
    redundancy, storage and better use of heat exchangers in the process, all driven
