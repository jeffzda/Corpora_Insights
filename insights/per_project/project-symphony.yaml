- record_id: ARENA-DLV-68324
  source_title: DEIP Market Integration Trials Summary Report 3.0
  publish_date: '2026-01-27'
  project_name: Project Symphony
  what_happened: Project Symphony's third-party aggregator (TPA) business model was
    found to be economically unviable in its tested form — the cost of integrating
    TPA systems with the Synergy aggregator platform, system access fees, and customer
    payments outweighed the benefits received by third-party aggregators from Synergy.
  lesson_learnt: Third-party aggregator business models that route through an intermediary
    platform must be carefully costed before deployment — integration fees, system
    access fees, and customer payment obligations can collectively exceed achievable
    revenues, requiring platform design changes or cost-sharing arrangements to achieve
    viability.
