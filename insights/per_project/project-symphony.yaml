- record_id: ARENA-DLV-50573
  source_title: DEIP Market Integration Trials Summary Report 1.0
  publish_date: 2022-09
  project_name: Project Symphony
  what_happened: Project Symphony requires tight integration of three interconnected
    platforms — the DSO Platform (Western Power), the DER Integration Platform (AEMO),
    and the Aggregator Platform (Synergy) — with considerable data passed between
    them. The complexity of integrating these systems was identified as a key delivery
    challenge for the pilot.
  lesson_learnt: Multi-platform DER integration architectures with tightly coupled
    data flows between market operator, network operator, and aggregator systems represent
    a significant integration delivery risk — allocate substantial design and testing
    time to the interfaces between platforms, as failures at integration points are
    likely to be the primary source of delivery friction.
