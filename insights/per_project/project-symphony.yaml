  source_title: UTS - Flexible Demand State of Play in Australia - Report
  publish_date: 2024-05
  project_name: Project Symphony
  what_happened: Project Symphony found that the current metering code does not allow
    for third-party aggregation, and that better consumer protections are required
    as information passes from consumers to parent aggregators, representing a regulatory
    gap for VPP business models.
  lesson_learnt: VPP and aggregation program designers should anticipate that the
    current metering code structurally prevents third-party aggregation, creating
    a regulatory barrier that must be resolved at the rule level before aggregation
    business models can scale; consumer protection frameworks for data flows to parent
    aggregators also need development in parallel.
