- record_id: ARENA-DLV-68323
  source_title: DEIP Market Integration Trials Summary Report 3.0
  publish_date: '2026-01-27'
  project_name: Project Symphony
  what_happened: Project Symphony lacked accessible DER standing data at installation
    and had to create its own datasets for the trial; this absence of timely, accurate
    standing data about installed DER equipment was identified as a significant barrier
    to network planning, capacity allocation, and compliance monitoring.
  lesson_learnt: Accurate and timely DER standing data — including information on
    EVSEs and DER management systems — must be collected at installation and made
    accessible to networks and market operators; pilots should not proceed without
    a standing data solution, as post-hoc data collection adds significant cost and
    limits operational effectiveness.
