- record_id: ARENA-DLV-50564
  source_title: DEIP Market Integration Trials Summary Report 1.0
  publish_date: 2022-09
  project_name: Project Symphony
  what_happened: Project Symphony social science research found that consumers in
    Western Australia had a general lack of understanding of DER concepts and benefits,
    and expressed concerns about control, costs, and risk. Additionally, because Synergy
    is the sole retailer to small customers in the WEM, commercial aggregators lack
    a foothold, and consumers voiced concerns about profit motive and degree of regulation,
    creating structural barriers for third-party aggregator models in the WEM.
  lesson_learnt: In electricity markets with a single dominant retailer and limited
    retail competition (such as the WEM), third-party DER aggregator models face structural
    consumer trust barriers that do not exist in competitive retail markets — program
    designers must account for this market structure difference and invest more heavily
    in consumer education and regulatory reassurance before expecting broad VPP participation.
  issue_severity: moderate
