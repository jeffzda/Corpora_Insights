  what_happened: Interoperability issues between trader systems and DER hardware throughout
    Project Symphony led to a recommendation to adopt CSIP-AUS for all inverter-based
    generation in the SWIS; Synergy has since begun supporting solar and batteries
    with CSIP-AUS.
