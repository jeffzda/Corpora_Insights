  publish_date: 2024-05
  project_name: Project Symphony
  what_happened: Project Symphony experienced slower-than-expected customer acquisition
    due to tight eligibility requirements (e.g. mandatory solar export) and inadequate
    incentives, particularly for PV and air-conditioning participants; switching to
    consumer-facing third-party aggregators for contracting improved recruitment outcomes.
  lesson_learnt: VPP recruitment programs should use consumer-facing third-party aggregators
    rather than direct utility recruitment — aggregators have established customer
    relationships and sales capability that improve conversion rates; eligibility
    requirements should also be reviewed to ensure they do not exclude large segments
    of the target market.
