  source_title: UTS - Flexible Demand State of Play in Australia - Report
  publish_date: 2024-05
  project_name: Project Symphony
  what_happened: Project Symphony found that the end-to-end technical capacity and
    understanding of VPPs was insufficient at the start of the project and that communication
    and interoperability standards for DER assets were not mature, causing delays
    while technical challenges were resolved.
  lesson_learnt: VPP integration projects should conduct detailed upfront technical
    design and comprehensive pre-deployment testing of all DER device types and communication
    standards before live deployment — insufficient pre-deployment testing of immature
    interoperability standards was a primary cause of delays and integration failures
    in Project Symphony.
