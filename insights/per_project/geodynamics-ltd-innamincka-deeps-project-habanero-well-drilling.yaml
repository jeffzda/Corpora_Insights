  source_title: 'Looking Forward: Barriers, Risks and Rewards of the Australian Geothermal
    Sector to 2020 and 2030'
  publish_date: 2014-06
  project_name: Geodynamics Ltd – Innamincka Deeps Project (Habanero well drilling)
  what_happened: The first deep geothermal well drilled in Australia (Habanero 1 in
    2003) had a trouble-free cost of approximately $7 million, while the most recently
    completed well (Habanero 4 in 2012) had a trouble-free cost more than three times
    higher, driven largely by market-driven increases in Australian drilling costs
    rather than well design.
  lesson_learnt: Geothermal project financial models should stress-test drilling cost
    assumptions against market-driven cost escalation over multi-year drilling programs;
    failure to account for oil-and-gas-driven rig cost inflation can result in capital
    cost overruns of more than 3× for otherwise similar wells over a decade-long project.
