  evidence_excerpt: The first deep geothermal well drilled in Australia, Habanero
    1, is reported to have been drilled with a trouble-free cost of around $7 million
    (Tester et al., 2006) in 2003. The most recently completed well, Habanero 4, had
    a trouble-free cost more than three times higher than this in 2012. This difference
    can be partly explained by well design, but is largely due to market-driven increases
    in the cost of drilling in Australia.
