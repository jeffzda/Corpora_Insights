- record_id: ARENA-DLV-20710
  source_title: Demand Response Short Notice RERT Trial Year 3 Report
  publish_date: 2021-10
  project_name: DR SN RERT Trial — EnergyAustralia opt-out BDR design
  what_happened: EnergyAustralia made PowerResponse BDR eligibility a default feature for all retail customers (opt-out rather than opt-in), which — combined with a Jemena partnership — grew the program
    to 380,000 customers by end of December 2020; only 6% of customers opted out when first notified of an event.
  lesson_learnt: Opt-out BDR program design can achieve population-scale participation rapidly and at low marginal cost; designing programs as a default customer benefit (with easy opt-out) rather than
    an active enrolment process is the most effective mechanism for achieving large residential DR portfolios.
