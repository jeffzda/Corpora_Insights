  project_name: SAPN – Closed-loop Voltage Control Trial
  what_happened: The SAPN Closed-loop Voltage Control Trial demonstrated that CLVC algorithms improved DER hosting capacity with a headroom margin three times larger than business-as-usual and nearly twice
    that of line-drop compensation, enabling substantial voltage reduction within regulatory bandwidths for demand response.
  lesson_learnt: Dynamic closed-loop voltage control significantly outperforms both BAU and line-drop compensation approaches for DER hosting capacity and demand response headroom — distribution network
    planners in areas of high solar PV penetration should evaluate CLVC as an alternative to network augmentation before committing capital to infrastructure upgrades.
