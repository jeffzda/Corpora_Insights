  publish_date: 2024-05
  project_name: 'UNSW – Earth-Abundant, RoHS-Compliant Antimony Chalcogenide: Top
    Cell Alternative for Silicon Tandem Cells (2020 RND014)'
  what_happened: An unencapsulated antimony chalcogenide silicon tandem cell demonstrated
    acceptable performance under some test conditions but experienced severe delamination
    under others, revealing a stability and adhesion failure that limits the technology's
    viability for further development without encapsulation solutions.
  lesson_learnt: New-material tandem cell projects should include encapsulation and
    delamination testing as a deliverable from the first prototype stage; stability
    failures discovered at unencapsulated device level late in the project constrain
    commercialisation planning and leave the technology pathway incomplete.
