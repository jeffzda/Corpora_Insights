  publish_date: '2024-06-06'
  project_name: Hysata Electrolyser Commercialisation
  what_happened: Hysata, commercialising a novel capillary-fed electrolyser, grew from 6 employees and a lab-scale site in 2021 to 80–100 employees and an 8,500m² facility by 2024, securing AU$172M Series
    B funding — demonstrating a successful R&D-to-commercialisation trajectory supported by sequential ARENA grants.
