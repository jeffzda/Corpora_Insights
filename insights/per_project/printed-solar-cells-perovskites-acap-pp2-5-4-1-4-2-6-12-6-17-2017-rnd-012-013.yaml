- record_id: ARENA-DLV-40368
  source_title: 'In The Spotlight: Australian Solar Energy R&D Outcomes and Achievements
    in a Global Context'
  publish_date: 2018-07
  project_name: Printed Solar Cells - Perovskites (ACAP PP2.5/4.1/4.2/6.12/6.17, 2017/RND
    012/013)
  what_happened: Laboratory-scale perovskite devices were demonstrated at over 15%
    efficiency using batch-processed slot-die coating on glass and over 11% for roll-to-roll
    air-ambient printing on flexible PET film. However, the challenge of translating
    high laboratory-scale efficiencies to R2R-produced PV modules with efficiencies
    above 10% remained the critical barrier, with commercial products projected to
    be achievable only 2–3 years after the 2021 project completion.
  lesson_learnt: The translation from high-efficiency laboratory cells to commercially
    viable roll-to-roll manufactured modules is a distinct and time-consuming engineering
    challenge that should be planned and resourced as a separate project phase — programs
    should not assume that laboratory efficiency results translate directly to manufacturable
    module performance without a dedicated scale-up and process engineering effort.
