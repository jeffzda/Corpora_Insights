  evidence_excerpt: Continuing work is focussed on CSIRO's 'lab-to-fab' approach,
    translating the high efficiencies achieved in laboratory-scale devices to R2R
    produced PV modules with efficiencies >10%. Considering estimated manufacturing
    costs and the merits of the flexible form factor, products using these modules
