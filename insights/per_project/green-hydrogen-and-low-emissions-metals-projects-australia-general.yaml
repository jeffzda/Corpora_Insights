- record_id: ARENA-DLV-69021
  source_title: ARENA Insights Forum Session Summaries and Key Points
  publish_date: 2022-11
  project_name: Green hydrogen and low emissions metals projects (Australia — general)
  what_happened: Forum closing plenary identified that water supply for hydrogen production
    is a significant and underestimated challenge. Participants also noted that electrolyser
    availability and transmission infrastructure are key constraints to scaling up
    renewable energy and green hydrogen in Australia.
  lesson_learnt: Water supply sufficiency and security should be treated as a primary
    site selection and feasibility criterion for hydrogen production projects — the
    challenge of sourcing appropriate and sufficient water is frequently underestimated
    and can be a project-limiting constraint, particularly in arid regions where renewable
    energy resources are strongest.
