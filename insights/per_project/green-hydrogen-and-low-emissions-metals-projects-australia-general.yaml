- record_id: ARENA-DLV-69022
  source_title: ARENA Insights Forum Session Summaries and Key Points
  publish_date: 2022-11
  project_name: Green hydrogen and low emissions metals projects (Australia — general)
  what_happened: Forum participants agreed that running demonstrations or pilots before
    large capital investments is important across both hydrogen and low-emissions
    metals sectors, and that avoiding infrastructure duplication is a key lesson from
    the LNG industry applicable to hydrogen.
  lesson_learnt: Stage capital deployment by running demonstrations or pilots before
    committing to large-scale infrastructure investment in first-of-kind clean energy
    technologies — this reduces technology and commercial risk, and infrastructure
    should be planned to avoid duplication as the industry scales (a lesson directly
    applicable from LNG).
