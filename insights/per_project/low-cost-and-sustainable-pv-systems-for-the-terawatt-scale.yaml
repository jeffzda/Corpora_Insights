- record_id: ARENA-DLV-2651
  source_title: UNSW - Low-Cost and Sustainable PV Systems for the Terawatt Scale
    R&D Interim Report
  publish_date: '2024-08-06'
  project_name: Low-cost and Sustainable PV Systems for the Terawatt Scale Project
  what_happened: Rapid and faster-than-predicted shifts in PV technology — notably
    the 2023 transition from p-type to high-efficiency n-type (TOPCon, SHJ, back-contacted)
    cells — outpaced publicly available information sources such as ITRPV and IEA
    reports, making it difficult for the research team to obtain up-to-date and accurate
    industry benchmarks on material usage and emissions in a timely manner.
  lesson_learnt: Research projects analysing PV supply chains and emissions must maintain
    high-frequency direct engagement with industry partners to access current benchmarks,
    as published roadmaps and international agency reports lag real-world technology
    transitions by a significant margin; project scopes should also be designed to
    be adaptable when dominant technology trends shift unexpectedly mid-project.
