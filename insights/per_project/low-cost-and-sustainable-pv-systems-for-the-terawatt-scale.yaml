- record_id: ARENA-DLV-2652
  source_title: UNSW - Low-Cost and Sustainable PV Systems for the Terawatt Scale
    R&D Interim Report
  publish_date: '2024-08-06'
  project_name: Low-cost and Sustainable PV Systems for the Terawatt Scale Project
  what_happened: When evaluating alternatives to reduce PV material usage and emissions
    (e.g. frameless modules, steel frames instead of aluminium), the project team
    found that each alternative introduced its own trade-offs across technical, economic,
    market-acceptance and bankability dimensions, making it impossible to identify
    a single universally optimal solution without deep industry expertise in fabrication
    and testing.
  lesson_learnt: Sustainability-focused R&D projects should resist declaring a single
    best-practice alternative and instead map options against specific market segments
    and customer priorities; close collaboration with industry partners possessing
    fabrication and testing expertise is necessary to properly characterise trade-offs
    and avoid recommending solutions that fail on non-environmental criteria.
  issue_severity: minor
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: poor scoping
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The team shifted to identifying and characterising the strengths
    and weaknesses of each alternative rather than prescribing a single optimal solution,
    and worked with industry partners to assess trade-offs for different market segments.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id002
  - 9
  - 10
  evidence_excerpt: A complete analysis of the pros and cons of each alternative,
    with an optimum of multiple objectives (environmental, cost, performance, market
    acceptance and bankability etc) for each main material is a challenging task,
    and requires expertise in analysis, fabrication and testing. Even with all this
    expertise, there will be different solutions that suit different customers, depending
    on their priorities and application.
  confidence_note: issue_severity assessed as minor — the challenge shaped the research
    approach but did not cause schedule or cost impact; failure_mode design assumption
    failure selected as the underlying issue was an initial assumption that a clear
    optimal path could be identified analytically.
