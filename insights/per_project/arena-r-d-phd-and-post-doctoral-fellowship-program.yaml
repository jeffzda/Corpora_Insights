- record_id: ARENA-DLV-15834
  source_title: Evaluation of ARENA's Impact and Effectiveness
  publish_date: 2019-11
  project_name: ARENA R&D — PhD and Post-Doctoral Fellowship Program
  what_happened: ARENA and its predecessor ASI directly funded 35 PhD scholarships and 48 Postdoctoral Fellowships (excluding those through ACAP and ASTRI), totalling 86 awards at a cost of $18.1 million.
    A survey of recipients found funded research delivered an average TRL increase of 1.6, produced 406 publications, and 12 recipients subsequently secured research grants as lead researchers. The evaluation
    found these awards were instrumental in retaining skilled personnel in Australia longer than typical.
  lesson_learnt: PhD and postdoctoral fellowship programs within applied R&D funding create compounding returns — they retain skilled researchers in-country, generate publications, and produce independent
    future grant-holders; this pipeline effect should be explicitly tracked and valued in program evaluation frameworks.
