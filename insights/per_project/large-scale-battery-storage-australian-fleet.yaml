- record_id: ARENA-DLV-1304
  source_title: ARENA Insights Forum Presentation Summaries & Key Points – Large-Scale
    Projects Stream
  publish_date: '2019-06-25'
  project_name: Large-Scale Battery Storage (Australian Fleet)
  what_happened: New solar PV project developers installed synchronous condensers
    to satisfy AEMO system security requirements and investor expectations, despite
    batteries potentially being a technically superior solution, because synchronous
    condensers were faster and cheaper to procure and approve.
  lesson_learnt: Synchronous condensers are being used as the expedient solution for
    system security compliance in new solar projects — project developers and investors
    should be aware this is a cost/speed trade-off, not a technically optimal one,
    and track whether evolving market rules shift the calculus toward batteries.
