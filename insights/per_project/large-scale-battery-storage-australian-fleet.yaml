  publish_date: '2019-06-25'
  project_name: Large-Scale Battery Storage (Australian Fleet)
  what_happened: Batteries registered as SRAS providers were required to hold a significant
    proportion of their capacity in reserve, limiting their ability to participate
    simultaneously in other value streams and constraining overall revenue.
  lesson_learnt: When evaluating battery project revenue stacks, account for capacity
    reservation obligations under SRAS — holding capacity for SRAS materially limits
    participation in other markets and may undermine the overall business case.
