    cheaper compliance path to satisfy AEMO and investors.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id004
  - 3
  evidence_excerpt: The decision by developers to install synchronous condensers for
    projects to assist with AEMO's system security concerns in relation to new solar
    PV projects demonstrates where the market is right now. It can be seen as the
    'easy' and cheap(er) option to quickly satisfy investors and AEMO, despite a battery
    likely being a better (but slower and more expensive) solution.
