- record_id: ARENA-DLV-1326
  source_title: ARENA Insights Forum Presentation Summaries & Key Points – Large-Scale
    Projects Stream
  publish_date: '2019-06-25'
  project_name: Large-Scale Battery Storage (Australian Fleet)
  what_happened: As more large-scale batteries enter the grid, forecasting their output
    becomes increasingly difficult because their charge/discharge timing depends on
    proprietary algorithms and market conditions, creating the risk that multiple
    batteries could act in unison and generate large, unmanaged ramping events.
  lesson_learnt: System planners and market operators should model the systemic risk
    of coordinated large-scale battery dispatch — if many batteries respond to the
    same price signal simultaneously, the resulting ramp rates could destabilise the
    grid, and proactive ramp rate restrictions or dispatch coordination mechanisms
    may be required before this fleet size is reached.
  issue_severity: major
  project_type: storage
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: project developer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated integration
  intervention_note: The panel noted that the future system may continue to restrict
    ramp rates to limit fast discharging and charging during price-related events.
  transferability: broad
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id006
  - 7
  evidence_excerpt: Forecasting battery output will become more difficult and important
    as more batteries enter the grid. A large-scale battery might show full availability
    but no one knows exactly when it will discharge (or charge) – it will depend on
    the algorithm and market/system conditions. So the risk is that batteries might
    start charging and discharging in unison, creating huge ramping issues for the
    grid.
  confidence_note: 'project_scale_band reconciled to ''demonstration'' from: demonstration
