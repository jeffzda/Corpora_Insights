- record_id: ARENA-DLV-1301
  source_title: ARENA Insights Forum Presentation Summaries & Key Points – Large-Scale
    Projects Stream
  publish_date: '2019-06-25'
  project_name: Large-Scale Battery Storage (Australian Fleet)
  what_happened: Large-scale battery systems (LSBS) in Australia were providing critical
    grid support services for free because no market existed to compensate them, while
    battery project developers had not settled on a bankable value stream. The FCAS
    market was described as incredibly hard to predict and not currently bankable
    for project owners.
  lesson_learnt: Do not rely on FCAS as a primary bankable revenue stream for large-scale
    battery projects — the market is highly unpredictable and may be saturated without
    adequate modelling of capacity limits. Rule changes such as bidirectional generator
    registration and stronger market signals are prerequisites for a sustainable battery
    business model.
  issue_severity: major
  project_type: storage
