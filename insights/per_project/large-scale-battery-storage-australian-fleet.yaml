  publish_date: '2019-06-25'
  project_name: Large-Scale Battery Storage (Australian Fleet)
  what_happened: Modelling of the FCAS market capacity had not been conducted, leaving
    investors and developers without visibility of the point at which new entrants
    would devalue the market.
  lesson_learnt: Before committing capital to FCAS-dependent battery projects, commission
    market-saturation modelling for the FCAS market — the absence of such modelling
    creates material investor risk as new entrants could devalue revenues for all
    participants.
