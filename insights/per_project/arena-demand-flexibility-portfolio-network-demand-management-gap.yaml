- record_id: ARENA-DLV-53890
  source_title: Demand Flexibility Portfolio Retrospective Analysis Report
  publish_date: 2023-07
  project_name: ARENA Demand Flexibility Portfolio — Network Demand Management Gap
  what_happened: Despite the Demand Management Incentive Scheme (DMIS) permitting
    up to approximately $500 million (1% of distribution network revenue) for demand
    management, only $3 million had been funded since its inception in December 2017
    — delivering $50 million in consumer benefits but representing approximately 0.6%
    of permissible expenditure. ARENA projects also had few examples of network demand
    management collaboration with retailers.
  lesson_learnt: The DMIS has substantially under-delivered on its mandate due to
    insufficient network incentives; ARENA should prioritise funding demand flexibility
    pilots that involve explicit collaboration between networks and retailers using
    cost-reflective tariffs or network payments, as this is the largest untapped value
    stream in the current portfolio.
