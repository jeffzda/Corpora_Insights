- record_id: ARENA-DLV-28107
  source_title: Insights from Freight Transport Electrification Across Port, Express
    Parcels & Last-Mile Deliveries
  publish_date: '2025-08-05'
  project_name: Last Mile Delivery Vehicle Electrification Project (ANC)
  what_happened: Residential AC chargers installed at Owner-Driver homes (7 kW) showed
    an early evening charging peak as vehicles returned, but their low power capacity
    meant there was very limited flexibility to shift charging to off-peak windows.
    Incentive-based off-peak home charging programmes are therefore unlikely to be
    effective for this cohort.
  lesson_learnt: Residential 7 kW chargers installed at Owner-Driver premises have
    insufficient capacity to provide meaningful load-shifting flexibility — future
    programmes targeting grid-friendly charging behaviour for this segment should
    consider alternative approaches beyond off-peak incentives, such as depot charging,
    higher-capacity home chargers, or smart charging with dynamic tariffs.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: fleet/logistics operator
  delay_category: null
  failure_mode: unvalidated technical assumptions
