- record_id: ARENA-DLV-28103
  source_title: Insights from Freight Transport Electrification Across Port, Express
    Parcels & Last-Mile Deliveries
  publish_date: '2025-08-05'
  project_name: Last Mile Delivery Vehicle Electrification Project (ANC)
  what_happened: Most ANC vehicles completed daily routes within single-charge range,
    but some vehicles exceeded their range within a day, requiring use of public DC
    fast chargers as an emergency fallback. Operators scheduled trips to minimise
    the need for mid-route public charging.
  lesson_learnt: When deploying last-mile delivery EVs, operators should design routes
    to stay within single-charge range as the primary strategy, but must also ensure
    drivers know how to access public charging for range extension — and factor public
    charging availability into operational risk assessments for routes that approach
    range limits.
  issue_severity: minor
