  source_title: TGE - Depot of the Future - Change Management Report 2
  publish_date: 2024-10
  project_name: Depot of the Future Vehicle Electrification Project
  what_happened: TGE implemented time-of-use charge lockout between 4pm and 8pm and
    deployed the BESS to cover depot energy needs during peak periods, resulting in
    demonstrated commodity and network cost savings. On 29 February 2024 during a
    NSW Lack of Reserve event, total savings of $7,330 were achieved in a single day.
  lesson_learnt: Integrate time-of-use charge lockout windows and BESS peak-shifting
    into the depot energy management system as early as possible — the combination
    of avoided peak charging and BESS dispatch during grid stress events can deliver
    substantial daily cost savings and supports grid stability, with a demonstrable
    return even on individual high-price days.
