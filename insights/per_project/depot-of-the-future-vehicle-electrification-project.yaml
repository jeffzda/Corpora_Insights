  publish_date: 2023-11
  project_name: Depot of the Future Vehicle Electrification Project (Project Cobra)
  what_happened: Emergency responders were not initially briefed on the BEV fleet
    and charging infrastructure at the depot, creating a gap in emergency preparedness;
    the project found that insurers and Fire & Rescue NSW needed early engagement
    to understand site changes including battery energy storage system locations and
    electrical isolation points.
  lesson_learnt: Engage local emergency response teams (e.g. Fire & Rescue NSW) and
    insurance underwriters early in a BEV fleet deployment — ensure they understand
    proposed site changes, isolation points, and battery locations, and that rescue
    sheets for BEV models are accessible via the ANCAP Rescue app or visible QR codes
    on vehicles.
