- record_id: ARENA-DLV-12702
  source_title: TGE Depot of the Future Vehicle Electrification Project - Change Management
    Report
  publish_date: 2024-04
  project_name: Depot of the Future Vehicle Electrification Project
  what_happened: The depot's EV charging and monitoring systems relied on external
    telecommunications networks for RFID-based charger activation; network failures
    caused extensive downtime across the entire charge network.
  lesson_learnt: Design EV charging infrastructure with network redundancy from the
    outset — reliance on a single telecommunications network created a single point
    of failure that could take down the entire depot charging network; dual SIM systems
    and offline charging fallback should be specified at design stage.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: fleet/logistics operator
  delay_category: commissioning/integration
  failure_mode: unvalidated integration
  outcome_class: delayed but recoverable
  secondary_failure_mode: poor scoping
  intervention_note: Software was upgraded to automatically accept all charging transactions
    during a communication failure, enabling the charger to initiate charging as soon
    as a truck is plugged in even if the network is down.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: EV
  source_pages:
  - 13
  evidence_excerpt: The project encountered several communication failures due to
    local network outages, resulting in trucks being unable to charge... the system
    software was upgraded to automatically accept all charging transactions during
    a communication failure, enabling the charger to initiate charging as soon as
    a truck is plugged in, even if the network is down.
