  what_happened: An emergency response drill was conducted on 6 June 2024 simulating
    a BEV thermal runaway event escalating through four stages to involve a 1 MW BESS.
    The drill identified gaps in site procedures, equipment, and signage, leading
    to improvements including clearer isolation point signage and wind-socks at each
    charge location.
