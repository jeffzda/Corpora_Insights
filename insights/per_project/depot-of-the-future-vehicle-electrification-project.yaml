  publish_date: 2023-11
  project_name: Depot of the Future Vehicle Electrification Project (Project Cobra)
  what_happened: Internationally available BEV heavy trucks (Volvo and Mercedes Benz)
    required a steer axle mass of 7.5 tonnes due to the weight of electric battery
    packs, exceeding existing Australian heavy vehicle regulations; this necessitated
    engagement with the National Heavy Vehicle Regulator and state transport agencies
    to amend steer axle limits.
  lesson_learnt: Account for the weight penalty of BEV battery packs in regulatory
    compliance planning — electric heavy vehicles from international OEMs may exceed
    Australian steer axle mass limits, and securing regulatory change across all jurisdictions
    can be a prolonged, multi-stakeholder process with incomplete national coverage.
