  secondary_failure_mode: regulatory & approvals
  intervention_note: Consulted insurer guidelines on BEV ownership and charging facility
    design as part of the emergency response planning process.
  transferability: broad
  delay_magnitude: null
  technology_domain: EV
  source_pages: &id052
  - 16
  evidence_excerpt: Insurance companies are already providing guidelines for BEV ownership
    and operation of BEV charging facilities, however you may see an increase in insurance
    premiums to cover increased cost of repair to BEVs and restrictions on vehicle
    type and models covered. Guidelines provided by your insurer may cover specific
    design or consultation requirements.
