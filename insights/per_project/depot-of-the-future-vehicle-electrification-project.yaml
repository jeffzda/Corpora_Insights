  publish_date: 2024-04
  project_name: TGE Depot of the Future Vehicle Electrification Project
  what_happened: Installation of 22 x 300mm² electrical cables through the depot roof
    required roof reinforcement with a steel beam and installation of a 600mm wide
    suspended cable tray. The work caused partial road closures, power outages, after-hours
    work requirements, disruption to driver rest areas, and changes to laydown areas
    for depot plant and equipment.
  lesson_learnt: Existing depot buildings may require structural reinforcement before
    heavy electrical cable infrastructure can be installed — assess roof or structural
    load capacity for cable trays and high-amperage cable runs early in design to
    avoid discovering this constraint during construction when operational disruption
    is hardest to manage.
