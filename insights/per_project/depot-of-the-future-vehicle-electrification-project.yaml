  project_name: Depot of the Future Vehicle Electrification Project (Project Cobra)
  what_happened: Design of charging infrastructure initially did not adequately account
    for the unique physical and operational characteristics of heavy trucks — including
    turning radii, swing sizes, cab-front charging locations, and cable length management
    — compared to light vehicles.
  lesson_learnt: Heavy truck charging infrastructure design requires fundamentally
    different consideration to passenger and light commercial vehicles — plan for
    truck swing sizes, cab-front charging positions, cable length, pedestrian separation,
    and reverse-entry bay layouts from the outset.
