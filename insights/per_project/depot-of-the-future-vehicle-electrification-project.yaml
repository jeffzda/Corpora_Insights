- record_id: ARENA-DLV-0203
  source_title: TGE - Depot of the Future - Change Management Report 2
  publish_date: 2024-10
  project_name: Depot of the Future Vehicle Electrification Project
  what_happened: Components in approximately 18 of the AC/DC chargers were found not
    to be functioning as designed, causing repeated charger errors reported by drivers.
    A reset at the switchboard provided only temporary relief; ultimately the faulty
    components were identified and the affected charger units were replaced.
  lesson_learnt: When charger errors recur across a significant proportion of a fleet
    charging installation, treat it as a systemic hardware issue rather than individual
    faults — proactive component inspection across all units is likely to be more
    efficient than reactive reset-based fault management.
