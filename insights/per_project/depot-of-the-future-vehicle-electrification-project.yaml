  publish_date: 2024-04
  project_name: TGE Depot of the Future Vehicle Electrification Project
  what_happened: TGE designed and installed an independent communications network
    using single-mode fibre optic to connect all charging infrastructure, the BESS,
    and electrical load meters, kept entirely separate from the existing TGE corporate
    customer network. This enabled a web-hosted operational dashboard accessible to
    depot staff for real-time monitoring of the charging system.
  lesson_learnt: For fleet depot EV charging deployments, establish a dedicated communications
    network that is isolated from the corporate IT network — this reduces the number
    of internal stakeholders required to manage the system, simplifies cybersecurity
    governance, and gives operations staff direct visibility of charging status without
    IT department dependencies.
