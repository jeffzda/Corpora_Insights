  what_happened: Retail and network energy tariffs placed constraints on evening charging,
    with a peak demand window from 4pm to 8pm on weekdays. The fleet was planned to
    be available for charging from approximately 6:30–7:00pm, but charging was minimised
    during peak hours and restricted to off-peak periods between 8:30pm and 5:00am
    to manage costs.
