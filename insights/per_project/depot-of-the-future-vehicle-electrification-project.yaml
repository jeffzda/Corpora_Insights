  publish_date: 2023-11
  project_name: Depot of the Future Vehicle Electrification Project (Project Cobra)
  what_happened: Upon delivery of the BEV fleet in September 2023, TGE assigned BEVs
    to the shortest scheduled depot runs to reduce charge depletion risk during the
    integration period, with plans to progressively assign longer routes as operational
    confidence grew.
  lesson_learnt: During initial BEV fleet integration, assign vehicles to the shortest
    routes and gradually increase run lengths — this manages the operational risk
    of range depletion while systematically building evidence of real-world range
    capability.
