  what_happened: The BESS was configured with a dual-network connectivity setup (Optus
    5G primary and Telstra modem redundant) to ensure 100% connectivity, while charger
    communications were kept on a separate network to avoid protocol conflicts — a
    solution developed in response to earlier single-network communication failures.
  lesson_learnt: Specify dual-carrier network redundancy for BESS and critical EV
    charging infrastructure from the design stage, and segregate BESS communications
    from the broader site network — network outages that ground fleet charging are
    operationally unacceptable, and segregated networks also simplify troubleshooting.
