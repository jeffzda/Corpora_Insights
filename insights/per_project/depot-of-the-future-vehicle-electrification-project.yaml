- record_id: ARENA-DLV-0210
  source_title: TGE - Depot of the Future - Change Management Report 2
  publish_date: 2024-10
  project_name: Depot of the Future Vehicle Electrification Project
  what_happened: Volvo eFL trucks activate brake lights during regenerative braking
    in compliance with Australian Design Rules (ADR 13/00), but existing road rules
    require trucks to use low gear on steep descents without using the primary brake
    — creating ambiguity over whether drivers were compliant and exposing them to
    potential fines.
  lesson_learnt: Identify and escalate regulatory ambiguities around electric vehicle
    operation on public roads before fleet route expansion to steep or sign-posted
    roads — the regulatory framework for ICE vehicles (low gear requirements) has
    not been updated to accommodate regenerative braking, leaving fleet operators
    and drivers in an uncertain legal position that requires proactive engagement
    with regulators and interim protective measures for drivers.
