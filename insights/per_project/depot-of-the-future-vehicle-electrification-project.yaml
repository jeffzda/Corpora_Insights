- record_id: ARENA-DLV-0205
  source_title: TGE - Depot of the Future - Change Management Report 2
  publish_date: 2024-10
  project_name: Depot of the Future Vehicle Electrification Project
  what_happened: The low-voltage (12/24V) auxiliary battery systems in the BEVs depleted
    during stand-down periods (driver absence, public holidays, maintenance), rendering
    trucks unable to start or connect to chargers even when the high-voltage traction
    battery was fully charged.
  lesson_learnt: Account for LV battery management in BEV fleet operations — if auxiliary
    12/24V systems drain during stand-down periods, trucks cannot start or charge
    regardless of HV state of charge; implement LV monitoring, event alerts via telematics,
    or continuous trickle-charge solutions before fleet go-live.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: fleet/logistics operator
  delay_category: no material delay stated
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Contingent measures including LV battery monitoring and BEV-specific
    telematics event alerts for vehicles stationary beyond a set period were put in
    place; trickle-charge and LV isolation options were also identified for future
    implementation.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: EV
  source_pages: &id002
  - 12
  - 13
  evidence_excerpt: If the LV battery is drained, the truck cannot be started, even
    if the HV system is fully charged, and it will not recognize a connection to the
    charger... It is therefore crucial to monitor the usage and movement of BEVs to
    ensure that the LV system remains charged.
  confidence_note: null
