  project_name: Depot of the Future Vehicle Electrification Project (Project Cobra)
  what_happened: Drivers and operations staff at the Bungarribee depot experienced
    range anxiety and operational uncertainty ahead of and during the introduction
    of 60 BEV trucks, requiring active change management to build confidence in the
    technology.
  lesson_learnt: Implement a structured driver acceptance program before BEV fleet
    deployment — including toolbox talks, change management workshops, regular updates
    at safety committee meetings, and 'Train the Trainer' programs delivered by OEM
    partners — to reduce range anxiety and build operational confidence.
