  source_title: TGE - Depot of the Future - Change Management Report 2
  publish_date: 2024-10
  project_name: Depot of the Future Vehicle Electrification Project
  what_happened: Recurring alarms across several trucks after firmware updates pointed
    to a gear selector solenoid fault, confirmed by driver reports of delayed gear
    changes. A warranty campaign was launched and solenoids were replaced across affected
    vehicles.
  lesson_learnt: Monitor BEV fleets systematically for new alarm patterns after each
    firmware or software update — cross-fleet alarm correlation can rapidly identify
    latent component faults that would otherwise surface slowly through individual
    driver reports, enabling faster warranty campaign activation.
