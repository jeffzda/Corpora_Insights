  project_name: Depot of the Future Vehicle Electrification Project
  what_happened: Route optimisation and BEV-to-route assignment were constrained by
    a range of operational factors including payload requirements, vehicle body fit-out
    variations, residential street access, driver licence class, and union consultation
    requirements for routes assigned to owner drivers — resulting in four Volvo eFLs
    still awaiting fashion rail installation before route assignment.
  lesson_learnt: When planning BEV route assignments for a mixed commercial fleet,
    map all assignment constraints (payload, access, body fit-out, licence class,
    industrial relations obligations) before fleet delivery — discovering body fit-out
    or consultation requirements post-delivery delays route activation and reduces
    early utilisation.
