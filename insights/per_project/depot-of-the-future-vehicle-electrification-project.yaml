  publish_date: 2024-04
  project_name: TGE Depot of the Future Vehicle Electrification Project
  what_happened: On 29 February 2024, a Lack of Reserve (LOR) event in NSW caused
    significant electricity price volatility. The on-site BESS was deployed to reduce
    grid-supplied electricity, saving $4,865.79 in commodity costs and $2,464.56 in
    network costs against a battery charging cost of $13.33 for the relevant increment,
    for a net saving of $7,330.35 on a single day.
  lesson_learnt: A behind-the-meter BESS at a large commercial fleet depot can deliver
    substantial single-event savings during grid stress events — in this case a single
    LOR event produced savings equivalent to approximately 10% of the monthly electricity
    bill, demonstrating that BESS value stacking across energy arbitrage and demand
    reduction can materially accelerate payback.
