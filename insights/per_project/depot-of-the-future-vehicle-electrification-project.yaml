  project_name: Depot of the Future Vehicle Electrification Project
  what_happened: End-of-shift reporting processes were insufficient to capture the
    volume and variety of BEV and charger issues occurring during operations; drivers
    were using temporary self-isolation resets to manage software errors rather than
    reporting them, masking the true scale of problems.
  lesson_learnt: Establish a real-time, mobile-accessible fault reporting channel
    specific to the BEV fleet before operations begin — relying on end-of-shift reporting
    causes under-reporting of issues perceived as minor, delays maintenance response,
    and allows temporary workarounds to obscure systemic problems.
