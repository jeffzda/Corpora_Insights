  source_title: TGE Depot of the Future Vehicle Electrification Project - Infrastructure
    Design Report
  publish_date: 2024-04
  project_name: TGE Depot of the Future Vehicle Electrification Project
  what_happened: The BESS at Bungarribee is scheduled to charge during midday (08:00–14:00
    AEST) when solar generation on site is highest and prices are lower, and to discharge
    during the evening demand window (16:00–20:00) to reduce peak demand charges.
    The 400kW existing solar installation provides approximately 25% of site demand.
  lesson_learnt: For depot electrification projects with co-located solar and BESS,
    configure the BESS to charge from solar during midday off-peak windows and discharge
    during the evening demand peak — this strategy reduces both commodity and network
    demand charges while maximising the value of existing renewable generation assets.
