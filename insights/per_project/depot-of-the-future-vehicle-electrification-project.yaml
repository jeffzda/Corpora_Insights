  source_title: TGE - Depot of the Future - Change Management Report 2
  publish_date: 2024-10
  project_name: Depot of the Future Vehicle Electrification Project
  what_happened: 'Software incompatibility between the CORE Energy Management System
    and the onboard systems of the electric trucks prevented integrated charging control;
    this was unresolved at the time of Change Management Report #1 and was only fixed
    during this reporting period through charger and fleet OEM operating system upgrades.'
  lesson_learnt: Validate end-to-end software compatibility between the energy management
    system, charger firmware, and vehicle OEM systems before fleet go-live — incompatibilities
    discovered post-deployment required multiple firmware upgrades and delayed the
    implementation of time-of-use charging optimisation.
