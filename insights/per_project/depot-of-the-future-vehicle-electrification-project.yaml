  source_title: TGE - Depot of the Future Vehicle Electrification Project - Lessons
    Learnt Reports 1-5
  publish_date: 2023-11
  project_name: Depot of the Future Vehicle Electrification Project (Project Cobra)
  what_happened: The project identified that voltage drop calculations were a critical
    design requirement for depot-scale EV charging infrastructure, with Australian
    standards allowing 4–7% voltage drop depending on transformer installation; undersized
    cables caused resistance, reduced charging efficiency, and risked damage to charging
    infrastructure.
  lesson_learnt: Conduct thorough electrical design analysis accounting for voltage
    drop during the design phase — use appropriately sized cables meeting or exceeding
    manufacturer specifications to avoid reduced charging efficiency and damage to
    infrastructure.
