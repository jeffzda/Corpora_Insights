  source_title: TGE - Depot of the Future - Change Management Report 2
  publish_date: 2024-10
  project_name: Depot of the Future Vehicle Electrification Project
  what_happened: Two BEVs on separate occasions accepted only 50% of their rated charging
    rate (7 or 22 kW instead of full rate), with telematics and charging data unable
    to identify the root cause; the issue did not recur and was attributed to software
    interactions across systems.
  lesson_learnt: When deploying large BEV fleets, log and retain all anomalous charging
    events even if they self-resolve — intermittent charging rate limitations may
    reflect transient software version conflicts that become reproducible and diagnosable
    only with sufficient data history.
