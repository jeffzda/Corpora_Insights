  publish_date: 2023-11
  project_name: Depot of the Future Vehicle Electrification Project (Project Cobra)
  what_happened: Insurance underwriters began imposing guidelines and restrictions
    on BEV fleet operations and charging facilities, including potential premium increases
    and coverage restrictions on vehicle types and models, creating an emerging financial
    and operational risk for BEV fleet operators.
  lesson_learnt: Engage insurance underwriters early in BEV fleet and charging infrastructure
    planning — insurer guidelines may impose specific design or consultation requirements,
    and operators should anticipate increasing premiums and possible coverage restrictions
    as the insurance industry adjusts to BEV risk.
  issue_severity: minor
  project_type: transport electrification
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: fleet/logistics operator
