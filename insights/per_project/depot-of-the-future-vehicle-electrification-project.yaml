- record_id: ARENA-DLV-0209
  source_title: TGE - Depot of the Future - Change Management Report 2
  publish_date: 2024-10
  project_name: Depot of the Future Vehicle Electrification Project
  what_happened: Water ingress was discovered in some truck bodies during wet weather
    due to inadequate sealing at the rear door roller seals (top and bottom) and,
    on larger BEVs, because high-voltage battery placement forced the body to be mounted
    above the chassis, creating drainage issues at the rear dock face.
  lesson_learnt: When fitting bodies to BEVs, carefully account for the higher chassis
    floor height imposed by under-floor HV battery placement — body mounting geometry
    that works on ICE vehicles may create water pooling and ingress risks on BEVs,
    requiring additional drainage and diversion features at the design stage.
