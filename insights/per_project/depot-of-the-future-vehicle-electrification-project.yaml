- record_id: ARENA-DLV-0208
  source_title: TGE - Depot of the Future - Change Management Report 2
  publish_date: 2024-10
  project_name: Depot of the Future Vehicle Electrification Project
  what_happened: BEV drivers reported reduced range in winter when using the cab heating
    system, as the heating system was found to be significantly less energy-efficient
    than the cooling system, creating range anxiety on longer routes.
  lesson_learnt: Brief BEV fleet drivers on the disproportionate energy draw of cab
    heating versus cooling before winter operations begin, and establish coaching
    protocols on minimising idle time with heating running and maximising regenerative
    braking to offset range reduction.
