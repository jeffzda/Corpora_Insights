- record_id: ARENA-DLV-11020
  source_title: Renewable Energy Options for Industrial Process Heat
  publish_date: 2019-08
  project_name: Adelaide Brighton Birkenhead Cement Kiln Alternative Fuel
  what_happened: Adelaide Brighton's gas-fired cement kiln at Birkenhead, SA commenced using over 70,000 tonnes of recycled construction and demolition timber per year as a supplement to natural gas in
    2003, achieving a 20% reduction in natural gas consumption. A dedicated processing plant was constructed near the cement facility to minimise transport costs.
  lesson_learnt: Cement kilns are particularly well-suited to co-firing with biomass and waste-derived fuels due to their high temperatures and ability to absorb ash into the product — locating the waste
    processing facility adjacent to the kiln is essential to manage transport economics of low-density fuel.
