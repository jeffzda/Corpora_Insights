  publish_date: '2024-05-30'
  project_name: Patrick Terminals - BEV Terminal Trucks at the Port of Fremantle
  what_happened: Lead times for ICT components required for the Fleet Power Management
    System (telemetry/communication devices, connected chargers, server software)
    were longer than initially anticipated due to post-pandemic supply chain disruption,
    creating a scheduling risk for the project.
  lesson_learnt: When planning BEV heavy vehicle projects, explicitly map and schedule
    lead times for all ICT and smaller components (transformers, telemetry devices,
    communication hardware) — not just the major items (vehicles, chargers) — as post-pandemic
    supply chain disruption continues to extend ICT component lead times beyond standard
    assumptions.
