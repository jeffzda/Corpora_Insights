- record_id: ARENA-DLV-33454
  source_title: Patrick Terminals 'BEV Terminal Trucks at Fremantle Port' Lessons
    Learnt Report 3
  publish_date: '2025-06-28'
  project_name: Patrick Terminals - BEV Terminal Trucks at the Port of Fremantle
  what_happened: Over the first six months of operation, BEV terminal truck maintenance
    costs were approximately 30% lower than equivalent ICE vehicles; however, over
    50% of BEV maintenance spend was reactive (breakdown or unplanned corrective maintenance)
    — higher than expected for relatively new vehicles — and BEV unavailability was
    elevated due to extended resolution of warranty claims, both attributable to early-stage
    product maturity and limited OEM experience.
  lesson_learnt: Future projects deploying first-generation heavy BEV technology should
    establish direct escalation pathways to the OEM factory before operations commence,
    negotiate extended warranty periods with guaranteed response and resolution times,
    and budget for higher reactive maintenance rates than a mature product would require
    — early-stage product reliability issues can substantially erode the projected
    maintenance cost savings.
  issue_severity: moderate
  project_type: transport electrification
