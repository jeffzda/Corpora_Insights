  project_name: Patrick Terminals - BEV Terminal Trucks at the Port of Fremantle
  what_happened: During the initial operational period, troubleshooting and component
    issues were encountered with the new BEV terminal trucks, reflecting an experience
    gap with a new vehicle OEM and new technology. Spare parts processes and troubleshooting
    capability were not established at go-live, requiring active intervention to build
    them out during early operations.
  lesson_learnt: Future heavy BEV deployments with new OEMs must resource the initial
    operational period for active vendor management — establish escalation pathways,
    maintain clear accountability lines, and pre-agree spare parts processes before
    go-live rather than building them reactively, to minimise vehicle downtime during
    the experience gap period.
