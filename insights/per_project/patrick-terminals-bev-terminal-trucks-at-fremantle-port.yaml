- record_id: ARENA-DLV-43053
  source_title: Patrick Terminals - BEV Terminal Trucks at Fremantle Port - Lessons
    Learnt Report 1
  publish_date: '2024-05-30'
  project_name: Patrick Terminals - BEV Terminal Trucks at the Port of Fremantle
  what_happened: BEV terminal truck deployment required a broader cross-functional
    team than an equivalent ICE project — including electrical engineers, construction
    management, ICT specialists, and operational staff — and the project was able
    to maintain schedule by assembling an experienced team of specialists for electrical
    infrastructure delivery, including the grid connection development agreement process,
    electrical design, and transformer procurement.
  lesson_learnt: Before commencing a BEV heavy vehicle project, proactively recruit
    or procure skilled specialists across electrical infrastructure design and delivery,
    equipment procurement, operational integration, and ICT — these disciplines are
    not required for ICE equivalents and the quality of resources is a key determinant
    of whether project schedule is maintained.
  issue_severity: minor
  project_type: transport electrification
  project_scale_band: first commercial/FOAK
  lifecycle_phase: procurement
  proponent_type: fleet/logistics operator
  delay_category: no material delay stated
  failure_mode: no major failure stated
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: Assembled an experienced team of specialists for electrical infrastructure
    scope, including grid operator development agreement, electrical design, and transformer
    procurement, enabling the charger installation to proceed to schedule.
  transferability: moderate
  delay_magnitude: null
  technology_domain: EV
  source_pages: &id009
  - 10
  - 11
  evidence_excerpt: The Project was able to maintain project schedule for this scope
    of activities largely through the assembly of an experienced team of specialists
    who were able to efficiently work through the required set of tasks to enable
    charger installation... this cross functional team must be rapidly assembled and
    hence prior to commencement, there needs to be consideration to appropriately
    skilled and experienced resource recruitment/procurement.
  confidence_note: issue_severity set to minor — the document implies that resourcing
    was a risk that was proactively managed rather than a failure that occurred; outcome
    is framed positively.
