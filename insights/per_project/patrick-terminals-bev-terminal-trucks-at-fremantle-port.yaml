- record_id: ARENA-DLV-43051
  source_title: Patrick Terminals - BEV Terminal Trucks at Fremantle Port - Lessons
    Learnt Report 1
  publish_date: '2024-05-30'
  project_name: Patrick Terminals - BEV Terminal Trucks at the Port of Fremantle
  what_happened: Patrick Terminals deployed 9 battery electric terminal trucks (the
    first heavy BEV deployment for 24/7 container terminal operations in Australia)
    and adopted a three-pillar procurement framework — vendor due-diligence, a performance
    specification/contractual framework, and a single supplier for technical integration
    — which was credited with delivering to project schedule.
  lesson_learnt: 'For first-of-type BEV heavy vehicle deployments, invest early in
    a structured procurement framework: conduct multi-criteria vendor due-diligence
    (including interviews with overseas operators of the same equipment), develop
    a comprehensive performance specification and contract, and appoint a single supplier
    to own integration risk between vehicles, chargers, and fleet management systems.'
  issue_severity: none
  project_type: transport electrification
  project_scale_band: first commercial/FOAK
  lifecycle_phase: approvals/contracting
