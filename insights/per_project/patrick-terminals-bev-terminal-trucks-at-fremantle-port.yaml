- record_id: ARENA-DLV-33452
  source_title: Patrick Terminals 'BEV Terminal Trucks at Fremantle Port' Lessons
    Learnt Report 3
  publish_date: '2025-06-28'
  project_name: Patrick Terminals - BEV Terminal Trucks at the Port of Fremantle
  what_happened: Six months of battery data from the fleet power management system
    showed LFP battery state of health between 96% and 99.6% across all nine vehicles,
    with an estimated annual consumption of approximately 192 equivalent full cycles
    per vehicle, projecting battery life of approximately 18 years — exceeding the
    12-year vehicle life and making mid-life battery replacement very unlikely.
  lesson_learnt: Future heavy BEV projects should model battery longevity using equivalent
    full cycles derived from actual charger consumption plus measured regeneration
    rates — for 24/7 port operations with 23% regeneration, LFP batteries are on track
    to outlast vehicle life and mid-life replacement risk is low, removing a key financial
    barrier to adoption.
