    cost savings (~60%) compared to diesel equivalents; however, project proponents
    in Western Australia should account for higher WA electricity prices and factor
    in diesel fuel excise credits available to off-road operators when modelling the
    energy opex differential, as these two factors reduce the net comparative saving.
