- record_id: ARENA-DLV-53888
  source_title: Demand Flexibility Portfolio Retrospective Analysis Report
  publish_date: 2023-07
  project_name: ARENA Demand Flexibility Portfolio — Residential Demand Flexibility
    Scaling
  what_happened: Across the ARENA portfolio, projects observed that households with
    rooftop solar were harder to recruit for demand flexibility programs than non-solar
    households because solar already provided larger financial returns; financial
    expectations raised by solar ownership made demand flexibility's modest per-household
    rewards (often tens of dollars) comparatively unattractive.
  lesson_learnt: Targeting existing solar households with standalone demand flexibility
    offers will yield poor recruitment results; the more effective pathway is to bundle
    demand flexibility with rooftop solar installation via solar retailers/installers
    or to link demand flexibility incentives to dynamic operating envelopes that expand
    solar export capacity — making demand flexibility a prerequisite for a valued
    outcome rather than a standalone proposition.
