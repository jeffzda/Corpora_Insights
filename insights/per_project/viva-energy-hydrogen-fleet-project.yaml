- record_id: ARENA-DLV-2609
  source_title: ARENA Insights Forum November 2024 - Accelerating Zero-Emissions Heavy
    Transport
  publish_date: 2024-11
  project_name: Viva Energy Hydrogen Fleet Project
  what_happened: Viva Energy's hydrogen fleet project identified hydrogen purity as
    a distinct operational complexity, and found that the retail price of hydrogen
    is dominated by compression, storage and dispensing (CSD) costs (40% of retailed
    price) rather than hydrogen generation (LCOH) alone, with greenfield site development
    adding further cost layers.
  lesson_learnt: Hydrogen fleet projects must account for compression, storage and
    dispensing costs as the dominant cost component in the retail hydrogen price —
    focusing only on LCOH (generation cost) will substantially underestimate the total
    delivered cost to fleet operators.
