- record_id: ARENA-DLV-2610
  source_title: ARENA Insights Forum November 2024 - Accelerating Zero-Emissions Heavy
    Transport
  publish_date: 2024-11
  project_name: Viva Energy Hydrogen Fleet Project
  what_happened: Viva Energy described the need to 'stay the course' through a hydrogen
    fleet project, requiring executive conviction, willingness to compromise for an
    industry-wide win rather than a single participant win, readiness to undertake
    activities not normally required in mature industries, and active sourcing of
    expert advice and industry solutions.
  lesson_learnt: First-of-kind hydrogen fleet projects require sustained executive
    support and a willingness to operate outside normal commercial practices — proponents
    should seek and pay for expert advice, build industry coalitions, and prioritise
    outcomes that benefit the sector rather than a single organisation.
