- record_id: ARENA-DLV-10903
  source_title: 'Cane2Fuel: Feasibility of Producing Biofuel from Sugarcane Waste'
  publish_date: '2013-03-20'
  project_name: 'Cane2Fuel: Developing an optimised and sustainable sugarcane biomass
    input system for the production of second generation biofuels'
  what_happened: Accelerated harvesting regimes trialled in the field did not enhance
    biomass production relative to standard commercial sugarcane varieties and existing
    practices, confirming that current varieties and harvesting methods are not sufficient
    to make lignocellulosic biofuel production economic.
  lesson_learnt: Do not assume that modified harvesting regimes alone will unlock
    additional biomass supply from existing sugarcane varieties — field trials showed
    accelerated harvesting offered no production uplift, meaning genetic improvement
    programs are necessary to materially increase biomass yield for biofuel economics.
