- record_id: ARENA-DLV-10906
  source_title: 'Cane2Fuel: Feasibility of Producing Biofuel from Sugarcane Waste'
  publish_date: '2013-03-20'
  project_name: 'Cane2Fuel: Developing an optimised and sustainable sugarcane biomass
    input system for the production of second generation biofuels'
  what_happened: The project identified that ensuring sustainable supply of lignocellulosic
    raw material beyond the existing sugar season is a key unresolved barrier before
    a commercial second-generation biofuel plant can be established at an Australian
    sugar mill.
  lesson_learnt: Any future pilot or commercial-scale second generation biofuel project
    co-located with an Australian sugar mill must resolve year-round feedstock supply
    before committing to plant design — seasonal sugarcane processing constrains available
    bagasse to within-season supply, creating an uneconomic operating window for a
    biorefinery.
