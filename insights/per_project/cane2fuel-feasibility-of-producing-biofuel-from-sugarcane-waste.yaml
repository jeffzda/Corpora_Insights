- record_id: ARENA-DLV-10901
  source_title: 'Cane2Fuel: Feasibility of Producing Biofuel from Sugarcane Waste'
  publish_date: '2013-03-20'
  project_name: 'Cane2Fuel: Developing an optimised and sustainable sugarcane biomass
    input system for the production of second generation biofuels'
  what_happened: The project concluded that production of second generation biofuels
    from lignocellulosic sugarcane waste material is not currently economic, despite
    achieving its technical research objectives. Conversion technologies remain pre-commercial
    and cost structures are not competitive.
  lesson_learnt: Feasibility studies for biofuel production pathways from lignocellulosic
    feedstocks should explicitly assess commercial readiness of conversion technologies
    before investing in feedstock supply chain development — the unavailability of
    commercial-scale conversion technology renders the supply chain work premature
    for near-term deployment.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: pilot
  lifecycle_phase: concept/feasibility
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: commercial & market
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: A confidential Information Memorandum was produced outlining
    investment opportunities in RD&D, and follow-on partnerships with CSIRO, University
    of Queensland and Clemson University were established to continue advancing conversion
    and feedstock development.
  transferability: moderate
  delay_magnitude: null
  technology_domain: bioenergy
  source_pages: &id001
  - 1
  - 4
  evidence_excerpt: The project concluded that it is not currently economic to produce
    biofuels from lignocellulosic material left over after sugarcane processing. This
    was not a surprising outcome but is expected to change in the short to medium
    term as improvements in conversion technology, operating and capital cost reductions,
    feedstock supply, reduced emissions and compelling market forces for second generation
    biofuel production and consumption drive technology uptake.
  confidence_note: issue_severity set to moderate rather than minor because the economic
    unviability finding materially limits the project's stated commercialisation objective,
    even though research outputs were delivered.
