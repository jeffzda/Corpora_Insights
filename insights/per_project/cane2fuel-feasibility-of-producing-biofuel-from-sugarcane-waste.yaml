- record_id: ARENA-DLV-10904
  source_title: 'Cane2Fuel: Feasibility of Producing Biofuel from Sugarcane Waste'
  publish_date: '2013-03-20'
  project_name: 'Cane2Fuel: Developing an optimised and sustainable sugarcane biomass
    input system for the production of second generation biofuels'
  what_happened: The project successfully developed an online near-infrared (NIR)
    measurement system capable of analysing biomass quality at the front-end of biorefineries,
    applicable across multiple feedstocks beyond sugarcane, and demonstrated its use
    in a practical bagasse analysis application.
  lesson_learnt: Online NIR measurement systems developed in a specific feedstock
    context (sugarcane) can be successfully generalised to handle multiple biomass
    feedstocks — designing for cross-feedstock applicability from the outset multiplies
    the commercial value of analytical tools developed in bioenergy R&D projects.
