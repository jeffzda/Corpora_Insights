- record_id: ARENA-DLV-15812
  source_title: Evaluation of ARENA's Impact and Effectiveness
  publish_date: 2019-11
  project_name: Australian Solar Thermal Research Initiative (ASTRI)
  what_happened: While ASTRI established strong research networks, it faced difficulty
    forming long-term collaborative links with industry due to commercial difficulties
    experienced by industry partners and difficulty in articulating and realising
    commercial pathways. In the absence of a clear deployment path for CST in Australia,
    large international CST companies had only a small presence, making meaningful
    commercial partnerships hard to form.
  lesson_learnt: R&D programs targeting technologies with high LCOE disadvantages
    relative to incumbent alternatives need explicit commercial pathway strategies
    built into program design — ASTRI's technical achievements were not sufficient
    to attract sustained industry partners without a viable commercial deployment
    context.
