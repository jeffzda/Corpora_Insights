  publish_date: 2017-05
  project_name: Development of High Temperature Phase Change Storage Systems and a
    Test Facility
  what_happened: The PCM 308 prototype incorporating a U-tube heat exchanger design
    was tested in the facility and demonstrated that high discharging effectiveness
    is maintained throughout the discharge cycle. Results also validated UniSA's E-NTU
    model as a reliable design tool for tube-in-shell PCM systems.
  lesson_learnt: A U-tube heat exchanger configuration within PCM storage systems
    can sustain high heat transfer effectiveness throughout the discharging process;
    validating this design against a numerical model at prototype scale provides a
    low-cost basis for confident scale-up and techno-economic analysis before committing
    to full field demonstrations.
