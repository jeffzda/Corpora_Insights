  what_happened: During testing of the first PCM prototype at high temperature, a
    fault occurred in the heater bank of the test rig that required the manufacturer
    to intervene and rectify it before testing could continue. The facility was recommissioned
    on 20 May 2016.
  lesson_learnt: Heater bank elements in high-temperature test rigs are a critical
    failure point — ensure manufacturer support arrangements and spare elements are
    in place before commencing prototype testing to minimise downtime when faults
    occur.
