- record_id: ARENA-DLV-5557
  source_title: Development of High Temperature Phase Change Storage Systems and a
    Test Facility
  publish_date: 2017-05
  project_name: Development of High Temperature Phase Change Storage Systems and a
    Test Facility
  what_happened: The project established one of only a handful of high-temperature
    thermal energy storage test facilities in the world (50 kW, up to 900°C), filling
    a gap in Australian research infrastructure that had previously forced researchers
    to rely on overseas facilities or forgo mid-scale prototype validation entirely.
  lesson_learnt: Investing in shared national test infrastructure for mid-scale prototype
    validation enables de-risking of thermal energy storage technologies at a fraction
    of the cost of full field demonstrations — identifying and funding such infrastructure
    gaps early in a technology development pathway accelerates the pipeline from laboratory
    to commercial deployment.
  issue_severity: none
  project_type: enabling infrastructure
