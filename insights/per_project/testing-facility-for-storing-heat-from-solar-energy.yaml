  intervention_note: The design was modified to incorporate air recirculation, making
    the rig more than 1 metre shorter, more energy efficient, and capable of faster
    heat-up; the modified design was approved by UniSA's Facilities Management Unit.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar thermal
  source_pages: &id003
  - 10
  evidence_excerpt: By March 2015, detailed drawings of components of the high temperature
    test facility were completed. These showed that the original test rig design was
    too large for the designated floor plan area. As the area could only be extended
    by about 1 metre, the test rig design needed to be shortened. The test rig design
    was modified to incorporate recirculation of the heat carrier fluid (air). The
    new design of the rig was improved, more than 1 metre shorter, and also more energy
    efficient and gained the ability to heat up faster so that tests could commence
    in a shorter period of time.
