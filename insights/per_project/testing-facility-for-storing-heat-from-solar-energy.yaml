- record_id: ARENA-DLV-5556
  source_title: Development of High Temperature Phase Change Storage Systems and a
    Test Facility
  publish_date: 2017-05
  project_name: Development of High Temperature Phase Change Storage Systems and a
    Test Facility
  what_happened: The PCM 638 prototype was tested in the facility to demonstrate melting
    and freezing behaviour at larger scale (up from ~10 mL laboratory scale). While
    phase change at approximately 638°C was confirmed, heat transfer to the HTF was
    poor because the prototype was not designed for heat exchange effectiveness, and
    temperature measurements did not match freezing temperature due to local measurement
    effects.
  lesson_learnt: When scaling up PCM prototypes from small laboratory samples, design
    specifically for heat exchange effectiveness from the outset — a prototype that
    confirms phase change but does not address HTF heat transfer leaves a critical
    performance gap that requires further testing cycles before viability at scale
    can be established.
  issue_severity: minor
  project_type: enabling infrastructure
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: research organisation/university
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: Future testing cycles were planned to focus on cycling and long-term
    stability to further validate viability at scale.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar thermal
  source_pages: &id006
  - 11
  evidence_excerpt: This prototype test did not focus on the heat exchange effectiveness,
    and therefore it was expected that the heat transfer to the heat transfer fluid
    would be poor. Therefore the potential of this PCM to be used at scale has been
    demonstrated. Future testing will involve cycling to further validate the viability
    of the PCM at scale.
