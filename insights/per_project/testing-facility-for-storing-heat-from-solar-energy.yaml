  evidence_excerpt: There are three known purpose-built thermal energy storage test
    facilities in the world that have been reported... The development of a testing
    facility within Australia provides a channel for researchers to develop their
    technologies from theoretical and laboratory scale research and experiments for
    proof of concept, to important mid-scale prototype testing. This scale of prototype
    testing is an economical approach to demonstrating the viability and to go some
    way to de-risking thermal energy storage technologies. The lessons learnt in the
    prototype scale tests can be integrated into full scale field demonstrations at
    a fraction of the cost.
