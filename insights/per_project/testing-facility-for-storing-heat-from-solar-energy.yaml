- record_id: ARENA-DLV-5553
  source_title: Development of High Temperature Phase Change Storage Systems and a
    Test Facility
  publish_date: 2017-05
  project_name: Development of High Temperature Phase Change Storage Systems and a
    Test Facility
  what_happened: By March 2015, detailed drawings of the high-temperature test facility
    revealed that the original design was too large for the designated floor plan
    area. The test rig had to be redesigned and shortened, incorporating recirculation
    of the heat carrier fluid to fit within the available space.
  lesson_learnt: Verify that detailed equipment drawings are checked against the actual
    available floor plan area at an early design stage — discovering a spatial mismatch
    only at detailed drawing completion can force a full redesign. In this case the
    forced redesign serendipitously improved the rig, but spatial constraints should
    be a primary design input, not a late-stage check.
