- record_id: ARENA-DLV-2569
  source_title: 'ARENA Insights Hot Decarbonisation Webinar: Renewable Heat and Energy
    Efficiency at Industrial Facilities'
  publish_date: 2024-10
  project_name: Feasibility Study into Resource Recovery Facility in the Red Meat
    Sector (Bindaree Food Group / Tessele Consultants)
  what_happened: The bio-resource recovery feasibility study identified approximately
    $18 million per year in potential revenue from multiple streams including recycled
    water, biofertiliser, energy from biogas, savings from waste disposal, food-grade
    bio-CO2, and carbon credits, with biofertiliser pellets valued at $4,000 per tonne
    in the retail market.
  lesson_learnt: Red meat processors should evaluate bio-resource recovery as a revenue-generating
    opportunity across multiple co-product streams — the combined revenue from water
    recycling, biofertiliser, biogas energy, bio-CO2, and carbon credits can substantially
    improve project economics and justify the capital investment in an integrated
    facility.
