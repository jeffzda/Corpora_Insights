- record_id: ARENA-DLV-2568
  source_title: 'ARENA Insights Hot Decarbonisation Webinar: Renewable Heat and Energy
    Efficiency at Industrial Facilities'
  publish_date: 2024-10
  project_name: Feasibility Study into Resource Recovery Facility in the Red Meat
    Sector (Bindaree Food Group / Tessele Consultants)
  what_happened: A feasibility study for a bio-resource recovery facility (BRRF) at
    a red meat processing plant found that economy of scale strongly influenced project
    viability, with NPV and payback time varying significantly across throughput scales
    from 5,920 to 100,000 tonnes HSCW per year, indicating that smaller processors
    may not achieve viable economics without aggregation.
  lesson_learnt: Bio-resource recovery facilities at red meat processing plants require
    sufficient throughput scale to be economically viable — feasibility assessments
    should model multiple throughput scenarios and consider whether aggregation with
    other processors or staged delivery is needed to achieve the minimum viable scale.
