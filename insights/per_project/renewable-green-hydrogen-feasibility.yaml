  what_happened: The project's financial model showed the cash generation from AU$2/kg
    hydrogen sales does not support debt financing even at interest rates as low as
    3%, with debt only viable once pre-tax IRR exceeds 2% — achievable only through
    a combination of government grant funding and access to high-value domestic markets
    (AU$6/kg transport hydrogen).
  lesson_learnt: Renewable hydrogen projects targeting industrial offtake at near-parity
    pricing with grey hydrogen cannot support debt financing in their current form
    — financing structures must rely primarily on equity plus government grants, and
    proponents should not include debt in the base-case financing model unless the
    pre-tax IRR from operations exceeds 2%.
