  what_happened: Wind energy was assessed and rejected as the primary renewable energy
    source for the facility. Analysis found that wind at Moranbah had a capacity factor
    of only 25% (vs 28% for solar), higher installed cost (AU$1.85/W vs AU$1.20/W
    for solar), and wind peaks overlapped with solar peaks rather than providing complementary
    overnight generation, resulting in wind power being approximately 70% more expensive
    than a solar-only solution.
  lesson_learnt: In locations with high solar irradiance and poor overnight wind profiles,
    wind energy does not provide meaningful complementarity to solar for hydrogen
    production — solar-only behind-the-meter configurations should be the baseline,
    and hybrid wind-solar configurations should only be evaluated where wind capacity
    factors are sufficiently high to justify additional capital cost.
