  what_happened: The feasibility study established a 2020 LCOH of AU$3.10–$3.98/kg
    for large-scale BTM PEM hydrogen, approximately 50% below CSIRO's 2018 forecast
    of AU$6.08–$7.43/kg for PEM electrolysis, with the reduction attributed to improved
    power system efficiency, lower solar installation costs per watt, lower electrolyser
    costs per MW, industrial scale (>100MW), and local BOP design improvements.
