  source_title: Dyno Nobel Renewable Hydrogen Feasibility Study
  publish_date: 2020-07
  project_name: Dyno Nobel Moranbah Renewable Hydrogen Facility
  what_happened: The project identified that economies of scale for renewable hydrogen
    cannot be achieved through multiple small-scale facilities — the engineering and
    integration challenges of large-scale RH production are not resolved by small-scale
    (<5MW) deployments, which do not develop BOS/BOP integration efficiencies or de-risk
    the engineering and bankability of scale-up.
  lesson_learnt: Portfolio strategies for building hydrogen capability through multiple
    small-scale pilot facilities do not generate the economies of scale or integration
    learnings needed to de-risk large commercial facilities — a single large-scale
    demonstration (>100MW) is required to establish bankable cost and performance
    benchmarks for the industry.
