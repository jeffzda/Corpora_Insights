- record_id: ARENA-DLV-45224
  source_title: Dyno Nobel Renewable Hydrogen Feasibility Study
  publish_date: 2020-07
  project_name: Dyno Nobel Moranbah Renewable Hydrogen Facility
  what_happened: The study found that over 50% of OPEX costs over the 25-year life
    of the RHF were attributable to the solar farm alone, and that operational cost
    estimates for large-scale solar facilities varied widely — a conservative approach
    added greater than AU$6.5M per year to the operational budget, potentially reducible
    by 50% through operational learnings and new technology.
  lesson_learnt: Solar farm OPEX is the dominant lifecycle cost driver for behind-the-meter
    hydrogen projects and carries wide uncertainty at feasibility stage — apply conservative
    OPEX assumptions and explicitly model the potential for automation and operational
    learning to reduce costs, as this variance materially affects LCOH and business
    case bankability.
