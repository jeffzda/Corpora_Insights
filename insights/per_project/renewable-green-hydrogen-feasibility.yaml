  what_happened: Alkaline electrolysers were found to require complete stack replacement
    at least once over a 25-year facility life due to their higher degradation rate
    under intermittent solar-coupled operation, with maximum capacity reaching the
    consumption limit by year 10 and requiring refurbishment at approximately year
    11, adding an estimated AU$41M to lifecycle costs.
  lesson_learnt: Alkaline electrolyser degradation under solar-coupled intermittent
    duty cycles is substantially higher than nameplate figures assume — the 1% per
    year degradation rate does not decline below this level for variable operation,
    and a stack replacement every 9–11 years must be budgeted as a major lifecycle
    cost item that can materially affect project economics.
