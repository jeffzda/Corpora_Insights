    has significantly lower lifecycle cost than alkaline due to wider turndown range,
    better compatibility with variable solar generation, and avoidance of daily nitrogen
    purging and stack replacement — alkaline degradation accelerates under the intermittent
    operating profile of solar-powered electrolysis.
