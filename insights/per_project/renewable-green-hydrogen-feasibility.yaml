- record_id: ARENA-DLV-45220
  source_title: Dyno Nobel Renewable Hydrogen Feasibility Study
  publish_date: 2020-07
  project_name: Dyno Nobel Moranbah Renewable Hydrogen Facility
  what_happened: The project financial model showed that achieving a post-tax IRR
    of 5% with DNM-only sales at AU$2/kg requires 59% government grant funding of
    total CAPEX; without grant funding, the project can only achieve an investable
    return if hydrogen is sold to DNM at AU$3.56/kg or if significant volumes of surplus
    hydrogen can be sold at AU$6/kg into high-value markets — but no domestic transport
    hydrogen customers were available at the required scale.
  lesson_learnt: Surplus renewable hydrogen from large industrial facilities should
    be treated as a secondary revenue stream in the business case only when specific
    offtake commitments exist at viable prices — at the time of this study, domestic
    transport hydrogen demand near Moranbah was far below the 800+ tpa surplus available,
    and designing a business case around uncontracted high-value surplus sales materially
    overstates bankable returns.
