  source_title: Dyno Nobel Renewable Hydrogen Feasibility Study
  publish_date: 2020-07
  project_name: Dyno Nobel Moranbah Renewable Hydrogen Facility
  what_happened: Hydrogen buffer storage using pressure vessels (AU$1,207/kg installed)
    was found to be dramatically more cost-effective than pipeline storage (AU$14,115/kg
    installed) for the RHF. Battery storage for overnight electrolyser operation was
    assessed at AU$778M — almost three times the cost of the entire hydrogen storage
    system (AU$111M) and comparable to the total RHF CAPEX.
  lesson_learnt: For solar-coupled hydrogen projects requiring overnight supply continuity,
    hydrogen pressure vessel storage is by far the most cost-effective buffering technology;
    batteries are unsuitable as a primary overnight energy source at scale due to
    prohibitive cost, and pipeline-based hydrogen storage should be ruled out unless
    tank farm siting is infeasible.
