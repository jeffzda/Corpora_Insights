  source_title: Dyno Nobel Renewable Hydrogen Feasibility Study
  publish_date: 2020-07
  project_name: Dyno Nobel Moranbah Renewable Hydrogen Facility
  what_happened: Distributing four 40MW electrolyser trains across the solar array
    rather than centralising all electrolysis in one location was selected as the
    optimal design trade-off between minimising DC cable costs (which favour distribution)
    and minimising BOP costs (which favour centralisation), while also providing full
    facility redundancy since each train can operate independently.
  lesson_learnt: For large-scale solar-coupled hydrogen facilities, distributing electrolyser
    trains within the solar array at an intermediate scale (e.g. 4 x 40MW rather than
    one centralised facility or many small skids) optimises the trade-off between
    DC cabling losses and BOP cost; this modular architecture also provides operational
    resilience through independent train operation.
