  what_happened: 'Hydroelectric power was assessed and rejected as a viable energy
    source: the nearest major dam (Burdekin) was 170km away, had no HV transmission
    connection to the grid, its proposed 37MW hydro station capacity was less than
    one-third of the RHF requirement, and pumped hydro sites near Moranbah had no
    firm plans or approvals.'
