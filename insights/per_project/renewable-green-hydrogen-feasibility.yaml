  what_happened: The study found that the LCOH for BTM solar hydrogen is significantly
    more sensitive to solar and electrolyser capital cost reductions than to grid
    power price reductions; a 75% reduction in all BTM components simultaneously reduces
    LCOH by 48%, whereas for grid-connected systems, a 75% reduction in major capital
    equipment reduces LCOH by only 9.5%.
  lesson_learnt: Cost reduction strategies for renewable hydrogen should prioritise
    capital cost reduction in solar, electrolysis and storage equipment for behind-the-meter
    projects, rather than pursuing lower grid power prices — the LCOH sensitivity
    to component cost is far greater in BTM configurations and these costs are declining
    faster than grid power costs.
