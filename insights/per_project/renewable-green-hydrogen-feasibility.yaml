  what_happened: 'Solar and electrolyser stack degradation over the 25-year project
    life required a proactive capacity addition strategy: in year 11 the electrolyser
    power requirement was modelled to exceed maximum solar array output, requiring
    planned 5MW electrolyser and 6MW solar additions every 5 years to maintain hydrogen
    supply to DNM requirements through the facility life.'
  lesson_learnt: Long-lived solar-coupled electrolysis facilities must explicitly
    model and budget for ongoing capacity additions to offset compounding solar panel
    and electrolyser stack degradation; planning for these additions in the initial
    layout and cost model avoids unplanned expenditure and potential supply shortfalls
    in later operating years.
