  source_title: Dyno Nobel Renewable Hydrogen Feasibility Study
  publish_date: 2020-07
  project_name: Dyno Nobel Moranbah Renewable Hydrogen Facility
  what_happened: Planning upfront for long-term electrolyser stack degradation by
    sizing auxiliary sub-systems (thermal control, DC/DC rectifiers) with sufficient
    design margin or pre-designed modular capacity additions was identified as a strategy
    to avoid the need for full stack replacement, saving up to AU$70M in refurbishment
    expenditure over the 25-year facility life.
  lesson_learnt: Size electrolyser BOP and auxiliary systems with explicit degradation
    margin rather than nominal design point — minor upfront investment in over-specifying
    sub-systems can eliminate full stack refurbishment costs that represent a major
    lifecycle cost item, particularly for solar-coupled facilities with lower annual
    operating hours than grid-connected alternatives.
