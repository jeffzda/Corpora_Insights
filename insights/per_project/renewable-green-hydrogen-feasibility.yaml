- record_id: ARENA-DLV-45234
  source_title: Dyno Nobel Renewable Hydrogen Feasibility Study
  publish_date: 2020-07
  project_name: Dyno Nobel Moranbah Renewable Hydrogen Facility
  what_happened: Industrial customers for ammonia or ammonium nitrate were not willing
    to pay a premium for products manufactured from renewable hydrogen, meaning RH
    must compete directly on cost with grey hydrogen from SMR — at the Moranbah contracted
    gas price, grey hydrogen could be produced for less than AU$1.50/kg, well below
    the AU$4.09/kg LCOH for the BTM RHF.
  lesson_learnt: Without a regulatory carbon price or mandatory renewable content
    requirement, industrial renewable hydrogen projects cannot close a business case
    based on product premium — the commercialisation pathway requires either a carbon
    price on SMR, a renewable product premium from customers, or government subsidy,
    and project proponents should not assume market willingness to pay without firm
    offtake commitments at agreed prices.
