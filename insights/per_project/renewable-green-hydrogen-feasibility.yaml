  what_happened: Designing for and sourcing suitable hydrogen compressors was identified
    as challenging — while hydrogen compressors are commercially available, compressors
    capable of accommodating variable supply at the large volume, flow rates, and
    pressures required for a large-scale BTM renewable hydrogen facility were found
    to be limited in the market.
  lesson_learnt: For large-scale behind-the-meter hydrogen facilities, compressor
    procurement is a critical long-lead item with limited supply options; engage compressor
    vendors early in the design process and verify market availability for the required
    duty before committing to a plant configuration.
