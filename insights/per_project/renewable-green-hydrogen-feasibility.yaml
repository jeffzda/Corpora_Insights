  source_title: Dyno Nobel Renewable Hydrogen Feasibility Study
  publish_date: 2020-07
  project_name: Dyno Nobel Moranbah Renewable Hydrogen Facility
  what_happened: The team relied on external regional meteorological data from the
    Bureau of Meteorology and Solargis rather than site-specific weather station data
    at the DNM site, which was identified as a limitation that reduced confidence
    in the solar production model.
  lesson_learnt: Projects planned adjacent to existing industrial facilities should
    install a weather station and collect site-specific meteorological data for several
    years before commencing detailed design — reliance on regional proxy data introduces
    material uncertainty into renewable energy yield models that directly affects
    storage sizing and business case bankability.
