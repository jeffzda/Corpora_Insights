- record_id: ARENA-DLV-45235
  source_title: Dyno Nobel Renewable Hydrogen Feasibility Study
  publish_date: 2020-07
  project_name: Dyno Nobel Moranbah Renewable Hydrogen Facility
  what_happened: The study found that a long-term take-or-pay offtake agreement from
    DNM provides a secure basis for equity investment, and multiple private companies
    showed interest in providing equity funding at minimum IRRs as low as 5% — however
    only large profitable organisations are likely to be credible RHF owners due to
    the taxation structure, presenting both capability benefits and risk-aversion
    challenges.
  lesson_learnt: Securing a long-term take-or-pay offtake agreement before approaching
    equity investors is essential for large-scale FOAK hydrogen projects; the investor
    pool is effectively limited to large profitable organisations due to the taxation
    treatment of the investment structure, which should be factored into early project
    development and governance planning.
