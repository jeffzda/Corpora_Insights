  evidence_excerpt: Choosing a P80 or P90 outcome (i.e. 80 or 90% certain that the
    design production will be achieved every year) will significantly increase upfront
    capital expenditure and will generate significant 'unused' hydrogen in most years
    unless there are additional users or the ability to substitute alternative supplies.
    Choosing lower likelihood outcomes increases the risk that the RHF has lower revenue
    than modelled, potentially jeopardising the business case.
