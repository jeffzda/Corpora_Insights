  source_title: Dyno Nobel Renewable Hydrogen Feasibility Study
  publish_date: 2020-07
  project_name: Dyno Nobel Moranbah Renewable Hydrogen Facility
  what_happened: The contracting model selected was an EPCM arrangement with free-issue
    of AU$362M (54%) of major capital equipment to an EPC contractor, reducing EPC
    margin but introducing higher investor risk because EPC vendors would seek to
    limit liability on equipment performance, affecting the value and enforceability
    of any facility-level performance guarantee.
  lesson_learnt: For FOAK renewable hydrogen projects with high free-issue equipment
    value, proponents must balance the cost benefit of avoiding full EPC margin against
    reduced performance guarantee coverage — owners taking on integration risk under
    EPCM models need deeper understanding of equipment performance risks and should
    prioritise suppliers with strong warranties and financial backing.
