- record_id: ARENA-DLV-45205
  source_title: Dyno Nobel Renewable Hydrogen Feasibility Study
  publish_date: 2020-07
  project_name: Dyno Nobel Moranbah Renewable Hydrogen Facility
  what_happened: 'Selecting the appropriate design baseline (P50, P80 or P90 solar
    yield) was identified as a critical and unresolved design decision: choosing a
    higher certainty baseline (P80/P90) significantly increases upfront CAPEX and
    generates unused hydrogen in most years, while a lower certainty baseline increases
    revenue risk and could jeopardise the business case, particularly in early years
    of operation.'
  lesson_learnt: For renewable hydrogen projects with intermittent solar supply, the
    choice of probabilistic design baseline directly drives both CAPEX and revenue
    risk — financiers must be prepared to take a 'through-cycle' view of cashflow
    volatility, and proponents should model multiple baselines explicitly before committing
    to a design.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: industrial operator
