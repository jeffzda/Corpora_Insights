    totalling AU$118M in CAPEX savings for the FEED stage, with the largest single
    items being: solar PV module upgrades (AU$39M, 16%), decentralised AC auxiliary
    power (AU$17M, 54% of that system), larger electrolyser stacks (AU$29M, 15%),
    and alternative hydrogen tank farm technologies (AU$33M, 30%) — reflecting the
    immaturity of the design and lack of comparable project precedents.'
