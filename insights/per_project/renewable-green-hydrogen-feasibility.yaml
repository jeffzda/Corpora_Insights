  source_title: Dyno Nobel Renewable Hydrogen Feasibility Study
  publish_date: 2020-07
  project_name: Dyno Nobel Moranbah Renewable Hydrogen Facility
  what_happened: Modelling showed that 224t of hydrogen storage would be required
    to guarantee zero hours of no supply across an average year, which was commercially
    infeasible; however, 95% of supply volume could be met with only 35t, and allowing
    supply to flex down 25% (to 18tpd) during low irradiance periods eliminated all
    zero-supply hours with just 45t of storage — the design settled on 54t to allow
    for below-average solar years.
  lesson_learnt: For hydrogen offtake agreements requiring near-continuous supply,
    designing for operational flexibility (modest downward variation in supply during
    seasonal low-irradiance periods) substantially reduces required hydrogen storage
    capacity and project CAPEX; quantify the ammonia plant's turndown capability early
    and build this into the storage optimisation model.
