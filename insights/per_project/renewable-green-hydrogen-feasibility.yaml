    feasibility study directly reflects the maturity of the design and the absence
    of comparable project precedents — proponents should explicitly plan for a dedicated
    value engineering phase between feasibility and FEED, with a target of 15–20%
    CAPEX reduction, particularly in solar PV, electrolyser BOP, and hydrogen storage
    subsystems.
