  source_title: Future Grid for Distributed Energy
  publish_date: 2020-06
  project_name: Future Grid for Distributed Energy — DER Hosting Capacity Study
  what_happened: Geospatial and topological data used to build LV network power flow
    models was found to contain potential inaccuracies and to be in some cases out
    of date, because LV network management had historically been low priority for
    DNSPs and systematic data capture had not been maintained.
  lesson_learnt: DNSPs embarking on LV hosting capacity modelling should first audit
    and remediate their geospatial and topological LV data quality — inaccurate or
    outdated GIS data directly degrades the accuracy of power flow outputs and could
    result in incorrect hosting capacity assessments and poor investment decisions.
