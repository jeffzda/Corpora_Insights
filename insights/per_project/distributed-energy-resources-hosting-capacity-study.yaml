- record_id: ARENA-DLV-60106
  source_title: Future Grid for Distributed Energy
  publish_date: 2020-06
  project_name: Future Grid for Distributed Energy — DER Hosting Capacity Study
  what_happened: On the one long rural HV feeder modelled, simulated PV penetration
    caused HV bus voltage to breach the +10% nominal limit before the voltage was
    even stepped down to the LV level, meaning LV voltage rise compounded with HV
    voltage rise and could theoretically reach extremely high levels without coordinated
    management of both network portions.
  lesson_learnt: For long rural HV feeders, voltage management strategies must address
    both HV and LV portions simultaneously — LV-only mitigation measures are insufficient
    because HV voltage rise independently breaches limits and compounds LV effects.
  issue_severity: major
  project_type: network/grid
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: network business
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: Study recommended further analysis combining HV and LV mitigation
    measures for long feeders, including HV regulators and OLTC functionality at zone
    substations.
  transferability: moderate
  delay_magnitude: null
  technology_domain: grid/system stability
  source_pages: &id006
  - 8
  - 39
  - 68
  evidence_excerpt: It is notable that with moderate PV uptake, an unmanaged HV feeder
    can reach +10% nominal voltage before stepping down to the LV level. In these
    cases, voltage rise within an LV network compounds with the rise seen at HV level
    and could (without intervention) reach extremely high levels. To address this
    voltage rise, management is required both within the HV and LV network portions.
  confidence_note: null
