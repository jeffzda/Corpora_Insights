- record_id: ARENA-DLV-60114
  source_title: Future Grid for Distributed Energy
  publish_date: 2020-06
  project_name: Future Grid for Distributed Energy — DER Hosting Capacity Study
  what_happened: Victoria's Solar Battery Rebate scheme provided no guidelines on
    how customers should operate their battery systems, meaning batteries were by
    default operated in self-consumption mode — a mode confirmed by this study to
    provide no hosting capacity or grid voltage management benefit.
  lesson_learnt: Battery incentive programs and rebate schemes should include operating
    guidelines or interoperability requirements that enable grid-service modes; without
    these conditions, subsidy spending on behind-the-meter batteries will not deliver
    network voltage management benefits and may represent misallocated public investment.
