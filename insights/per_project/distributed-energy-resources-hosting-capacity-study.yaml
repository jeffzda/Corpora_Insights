- record_id: ARENA-DLV-60102
  source_title: Future Grid for Distributed Energy
  publish_date: 2020-06
  project_name: Future Grid for Distributed Energy — DER Hosting Capacity Study
  what_happened: Behind-the-meter batteries operated to maximise customer self-consumption
    provided no improvement to LV network hosting capacity across all 10 example networks.
    Batteries typically reached full charge around midday — before peak PV export
    voltage stress — and were therefore unable to absorb excess generation when most
    needed.
  lesson_learnt: Batteries operating in default self-consumption mode deliver no grid
    voltage management benefit; any policy or program that incentivises behind-the-meter
    batteries without specifying coordinated grid-service operating modes should not
    expect hosting capacity improvements.
