- record_id: ARENA-DLV-60101
  source_title: Future Grid for Distributed Energy
  publish_date: 2020-06
  project_name: Future Grid for Distributed Energy — DER Hosting Capacity Study
  what_happened: Power quality issues (voltage breaches above the +10% nominal limit)
    occurred at low PV penetration levels (below 25%) on seven of the 10 example LV
    networks modelled, with five networks already experiencing breaches at their current
    PV penetration level before any additional installations were simulated.
  lesson_learnt: DNSPs should not assume LV networks have significant headroom for
    additional PV connections — a majority of network types will experience voltage
    breaches at relatively low penetration levels, and proactive hosting capacity
    assessment is required before connection approvals are granted.
