- record_id: ARENA-DLV-60113
  source_title: Future Grid for Distributed Energy
  publish_date: 2020-06
  project_name: Future Grid for Distributed Energy — DER Hosting Capacity Study
  what_happened: OLTC technology (on-load tap changers at distribution substation
    level) had never been installed on CPPAL's distribution network at the time of
    the study and was only in the planning/pilot phase, despite being assessed as
    the highest net-benefit option for one LV network type experiencing extreme voltage
    rise.
  lesson_learnt: DNSPs should progress OLTC trials at distribution substations as
    a priority for networks with extreme voltage rise — the technology's higher capital
    cost per unit is offset by requiring only one unit per network, and its auto-tapping
    range (±10%) significantly outperforms manual off-load tap changers (±5%) for
    severe voltage management cases.
