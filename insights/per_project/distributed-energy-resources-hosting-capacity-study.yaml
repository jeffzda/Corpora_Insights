- record_id: ARENA-DLV-60104
  source_title: Future Grid for Distributed Energy
  publish_date: 2020-06
  project_name: Future Grid for Distributed Energy — DER Hosting Capacity Study
  what_happened: Transformer upgrade/reconductoring (replacing the distribution transformer
    to include an off-load tap changer with additional buck taps, and upgrading LV
    conductors) was the highest net-benefit mitigation measure for the majority of
    LV networks at higher PV penetration levels, outperforming OLTC and LVR on cost-benefit
    grounds for networks with moderate voltage rise.
  lesson_learnt: During routine transformer replacement cycles, DNSPs should install
    transformers with additional buck taps targeting the current 230 V nominal standard
    — this low-cost intervention defers or eliminates the need for more expensive
    augmentation as PV penetration grows.
  issue_severity: moderate
  project_type: network/grid
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: network business
