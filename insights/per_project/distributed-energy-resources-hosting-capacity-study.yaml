  - 66
  evidence_excerpt: The upshot of this is that many DSS transformers' LV bus voltage
    is 3%–4% above their HV bus voltage (in percentage of nominal terms), an increase
    that compounds any voltage rise caused by an increasing PV penetration. Of the
    10 example LV networks, eight were equipped with transformers exhibiting this
