- record_id: ARENA-DLV-60107
  source_title: Future Grid for Distributed Energy
  publish_date: 2020-06
  project_name: Future Grid for Distributed Energy — DER Hosting Capacity Study
  what_happened: The study's initial plan to extrapolate results from 10 example LV
    networks to CPPAL's full 80,000-network portfolio was abandoned mid-project because
    within-category variability was too high to support reliable network-wide inferences
    from a single example per category.
  lesson_learnt: A sample of 10 LV networks across 10 categories is insufficient for
    network-wide extrapolation — DNSPs undertaking hosting capacity studies should
    invest in building power flow models for substantially more networks (one to two
    orders of magnitude more) to achieve statistically reliable inference.
