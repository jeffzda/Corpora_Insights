  evidence_excerpt: This study showed that an increased 'buck' tap range of an off-load
    tap changer had a much more beneficial impact on voltage than an increase of the
    transformer's rating and/or reconductoring of the LV network. So does the installation
    of a transformer targeting the updated regulated voltage range.
