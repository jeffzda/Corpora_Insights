- record_id: ARENA-DLV-60109
  source_title: Future Grid for Distributed Energy
  publish_date: 2020-06
  project_name: Future Grid for Distributed Energy — DER Hosting Capacity Study
  what_happened: Phase imbalance — uneven distribution of customer load across three
    phases — could not be modelled directly because individual customer phase allocations
    were unknown on CPPAL's network, requiring a post-processing correction approach
    that carries increasing uncertainty as PV penetration grows.
  lesson_learnt: DNSPs should invest in building phase allocation data for their LV
    customer base; without it, power flow models must treat each customer as a balanced
    three-phase load, producing an optimistic view of voltage regulation that could
    lead to underestimating the scale of hosting capacity interventions needed.
