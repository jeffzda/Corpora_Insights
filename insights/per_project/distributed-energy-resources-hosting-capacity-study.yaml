  project_name: Future Grid for Distributed Energy — DER Hosting Capacity Study
  what_happened: The study found there is no single mitigation measure that optimally
    addresses hosting capacity challenges across all LV network types — the preferred
    measure is highly sensitive to local network characteristics including transformer
    rating, number of customers, feeder type, and magnitude of voltage rise.
  lesson_learnt: DNSPs should not adopt a single network-wide DER mitigation strategy;
    investment planning must be informed by LV network-specific power flow modelling
    to identify the cost-optimal solution for each network's characteristics and PV
    penetration trajectory.
