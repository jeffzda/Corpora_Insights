  publish_date: 2020-06
  project_name: Future Grid for Distributed Energy — DER Hosting Capacity Study
  what_happened: Increasing the hosting capacity of LV networks with very few customers
    (Low-density rural single-phase and Remote rural SWER categories) was found to
    be not cost-efficient under any mitigation measure assessed — the value of additional
    PV generation enabled was too small to offset even the least expensive interventions.
  lesson_learnt: Investment appraisal for DER hosting capacity upgrades on sparse
    rural networks should account for the low customer count; dynamic or flexible
    export limits may be a more cost-effective policy instrument than network augmentation
    for these network types.
