- record_id: ARENA-DLV-60105
  source_title: Future Grid for Distributed Energy
  publish_date: 2020-06
  project_name: Future Grid for Distributed Energy — DER Hosting Capacity Study
  what_happened: Eight of the 10 example LV networks were equipped with older distribution
    transformers still targeting the obsolete 240 V nominal standard rather than the
    current 230 V standard, resulting in LV bus voltages 3–4% above nominal before
    any PV is added — consuming a material portion of the available +10% voltage headroom.
  lesson_learnt: The legacy 240 V transformer issue is widespread across CPPAL's network
    and likely across other DNSPs; identifying and prioritising replacement of these
    transformers should be incorporated into asset management programs as a cost-effective
    pre-condition for enabling further PV connections.
  issue_severity: major
  project_type: network/grid
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: null
  failure_mode: poor scoping
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Study recommended that during normal transformer replacement
    activities, transformers targeting the current 230 V nominal standard with additional
    buck taps be installed in all cases.
  transferability: broad
  delay_magnitude: null
  technology_domain: grid/system stability
  source_pages: &id005
