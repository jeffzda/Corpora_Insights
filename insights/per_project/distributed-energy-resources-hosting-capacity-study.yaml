- record_id: ARENA-DLV-60108
  source_title: Future Grid for Distributed Energy
  publish_date: 2020-06
  project_name: Future Grid for Distributed Energy — DER Hosting Capacity Study
  what_happened: Advanced metering infrastructure (AMI) data enabled power flow models
    to be validated against historical voltage readings through a 'digital twin test',
    which revealed that initial simulated voltages were systematically lower and less
    variable than historical readings — discrepancies larger than anticipated, attributable
    to unrepresented zone substation tap behaviour and unknown distribution substation
    tap settings.
  lesson_learnt: LV network power flow models built without accounting for ZSS tap
    behaviour and DSS tap settings will systematically underestimate voltage levels;
    iterative digital twin validation against AMI historical data is essential before
    using models for hosting capacity or investment decisions.
  issue_severity: moderate
  project_type: network/grid
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: network business
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: data & measurement
  intervention_note: Historical ZSS voltages were substituted into the model at each
    simulation timestamp, and a correction was derived for each DSS transformer's
    tap position inferred from historical AMI voltage readings; after correction,
    simulated and historical voltages aligned closely.
  transferability: moderate
  delay_magnitude: null
  technology_domain: grid/system stability
  source_pages: &id008
  - 29
  - 30
  evidence_excerpt: The digital twin test highlighted that the magnitude of these
    two effects was larger than expected. A comparison of the baseline simulated voltages
    and historical voltages showed that the power flow modelling produced voltages
    that were lower and less varied than what occurred historically.
  confidence_note: null
