- record_id: ARENA-DLV-60111
  source_title: Future Grid for Distributed Energy
  publish_date: 2020-06
  project_name: Future Grid for Distributed Energy — DER Hosting Capacity Study
  what_happened: Fixed (static) export limits applied by DNSPs resulted in some customers
    having PV generation curtailed when network conditions did not require it, while
    unlocking 100% of exports across all networks was found to be economically inefficient
    and would create unnecessary upward pressure on electricity prices.
  lesson_learnt: Governments and regulators should enable dynamic (flexible) export
    limits rather than maintaining static caps — dynamic curtailment through smart
    inverter Volt-Watt control allows curtailment only when the network requires it,
    improving customer outcomes and enabling more PV capacity without network investment.
