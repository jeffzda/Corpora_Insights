- record_id: ARENA-DLV-60103
  source_title: Future Grid for Distributed Energy
  publish_date: 2020-06
  project_name: Future Grid for Distributed Energy — DER Hosting Capacity Study
  what_happened: Smart inverters with Volt-Watt and Volt-VAR control achieved the
    highest net-benefit of all mitigation measures at low PV penetration levels due
    to near-zero marginal cost (mandated in Victoria), but their benefit declined
    sharply at higher penetration levels because they achieved voltage regulation
    primarily through curtailing PV exports rather than enabling generation.
  lesson_learnt: Smart inverters should be mandated as a baseline measure alongside
    all new PV installations but must not be treated as a complete solution — at high
    PV penetration levels their reliance on curtailment makes them insufficient alone,
    and targeted network augmentation will still be required.
  issue_severity: moderate
  project_type: network/grid
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: network business
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: Victoria mandated smart inverters with Volt-Watt/Volt-VAR modes
    under the Solar Homes Program; the study recommended other jurisdictions follow
    this as a minimum baseline.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id003
  - 10
  - 11
  - 65
  evidence_excerpt: Smart inverters had the highest net-benefit at low PV penetration
    levels due to their comparatively lower cost. However, as PV penetration increased,
    transformer upgrade/reconductoring had the highest net-benefit for most of the
    LV networks. This was because as PV penetration increased, smart inverters began
    to curtail PV generation, whereas network upgrade/reconductoring enabled more
    PV generation.
  confidence_note: null
