  what_happened: The use of open-source power flow modelling software (Pandapower)
    and open-source PV generation libraries (pvlib) enabled thousands of 30-minute
    simulations to be run in parallel over a 12-month period and allowed the methodology
    to be replicated by other DNSPs without proprietary software licences.
