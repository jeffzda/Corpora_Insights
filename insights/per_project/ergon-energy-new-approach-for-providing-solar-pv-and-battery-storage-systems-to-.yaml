- record_id: ARENA-DLV-52053
  source_title: ARENA Distributed Energy Resources Projects
  publish_date: 2019-03
  project_name: Ergon Energy New approach for providing solar PV and battery storage
    systems to residential customer
  what_happened: When Cyclone Debbie caused a grid outage, the deployment of residential
    BESS systems highlighted the absence of standard procedures for operating BESS
    during outage conditions, raising concerns about customer safety and network stability.
  lesson_learnt: Standard operating procedures for BESS systems during grid outage
    events must be developed before deployment at scale — the absence of such procedures
    creates customer safety and network stability risks in emergency conditions.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
