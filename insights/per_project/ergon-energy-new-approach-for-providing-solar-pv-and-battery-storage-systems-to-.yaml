- record_id: ARENA-DLV-52052
  source_title: ARENA Distributed Energy Resources Projects
  publish_date: 2019-03
  project_name: Ergon Energy New approach for providing solar PV and battery storage
    systems to residential customer
  what_happened: Manual processes used to activate residential BESS systems as a VPP
    did not result in dispatch that matched peak demand events, reducing the effectiveness
    of aggregated demand response.
  lesson_learnt: Manual VPP dispatch processes are insufficient for matching peak
    demand events — integration with a trading or VPP platform via API is required
    to enable automated discharge when threshold prices are reached.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
