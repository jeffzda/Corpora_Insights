- record_id: ARENA-DLV-9112
  source_title: State of DER Technology Integration Report
  publish_date: 2021-02
  project_name: State of DER Technology Integration Report (Portfolio-level)
  what_happened: Demand response by C&I customers had moved beyond trial stage to
    commercial deployment for wholesale energy and RERT services, but aggregated residential
    demand response remained less commercially advanced due to the higher complexity
    and cost of installing communications and control equipment relative to revenue
    that could be earned.
  lesson_learnt: Residential aggregated demand response faces a fundamentally different
    cost-revenue challenge than C&I demand response — programme designers should not
    extrapolate C&I business models to residential programmes and should account for
    additional customer engagement, behavioural complexity, and communications infrastructure
    costs when assessing viability.
