- record_id: ARENA-DLV-9150
  source_title: State of DER Technology Integration Report
  publish_date: 2021-02
  project_name: State of DER Technology Integration Report (Portfolio-level)
  what_happened: The report found that standardisation could unlock increased maturity
    for many DER integration capabilities, with mandatory device standards playing
    an important role for device capabilities, but progress on voluntary industry
    guidelines for communications and interoperability being at only early stages
    as of mid-2020.
  lesson_learnt: Mandatory standards are more effective than voluntary guidelines
    at driving widespread capability uplift across the DER fleet — where the capability
    gap is systemic and affects all market participants, regulators and funders should
    actively support a transition from voluntary industry guidelines to mandatory
    standards rather than allowing voluntary adoption to determine the pace of change.
