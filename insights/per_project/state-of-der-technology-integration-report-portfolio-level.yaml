  secondary_failure_mode: poor scoping
  intervention_note: The ESB and Inter-Jurisdictional Working Group on DER Compliance
    and Enforcement were considering development of an improved compliance framework;
    AEMO was working with SA government on fast-tracked LVRT testing for current inverter
    fleet ahead of standard publication.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id003
