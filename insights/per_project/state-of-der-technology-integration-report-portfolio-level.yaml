- record_id: ARENA-DLV-9101
  source_title: State of DER Technology Integration Report
  publish_date: 2021-02
  project_name: State of DER Technology Integration Report (Portfolio-level)
  what_happened: A mid-2020 maturity assessment of 45 ARENA and non-ARENA DER projects
    found that communications and interoperability was the least mature of all four
    DER integration topic areas, still rated at trial or research stage, with no agreed
    standards on what DER data should be shared or in what format.
  lesson_learnt: Interoperability and data exchange standards are a critical bottleneck
    for DER integration — funders and project sponsors should prioritise projects
    that establish common APIs and data exchange protocols, as no progress on devices,
    services or network hosting capacity can be fully realised without this foundation.
