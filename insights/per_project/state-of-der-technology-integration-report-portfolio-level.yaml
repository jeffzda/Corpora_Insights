  what_happened: Provision of localised network services by DER was assessed at trial
    stage, with community battery projects demonstrating the ability to defer transformer
    upgrades and several trials showing DER can provide voltage and frequency support,
    but progress not yet moving from trials to broader commercial deployments across
    a variety of DER types.
  lesson_learnt: Community batteries have demonstrated concrete network deferral value
    but the broader scaling of DER-provided network services requires progress on
    interoperability and visibility as enabling prerequisites — funders should sequence
    investments to address these foundations before expecting commercial scale deployment
    of DER network services.
