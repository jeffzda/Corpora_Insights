  what_happened: The assessment found that improving DER visibility for the existing
    fleet is likely to be challenging and expensive, with most current visibility
    improvements only applying to newly installed DER, creating a long lead time before
    the majority of the installed fleet becomes visible.
  lesson_learnt: Programmes relying on DER visibility for network management or market
