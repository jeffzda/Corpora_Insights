  project_name: State of DER Technology Integration Report (Portfolio-level)
  what_happened: Trading of DER services with wholesale markets was assessed at trial
    stage, with VPPs successfully demonstrating contingency FCAS and wholesale energy
    services but the technical capabilities for providing regulating FCAS from VPPs
    not yet proven. EV-based services had not been tested at all. The maturity level
    was found to vary markedly between DER types and service types.
  lesson_learnt: VPP market participation has demonstrated contingency FCAS viability
    but should not be assumed to generalise to other ancillary services — project
    sponsors should scope each DER-service combination separately and ensure trials
    explicitly test the specific service type being targeted before committing to
    commercial deployment.
