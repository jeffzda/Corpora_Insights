- record_id: ARENA-DLV-9104
  source_title: State of DER Technology Integration Report
  publish_date: 2021-02
  project_name: State of DER Technology Integration Report (Portfolio-level)
  what_happened: DER cyber security was assessed as the least mature functional area
    in the communications and interoperability topic, rated at research stage. No
    projects were dedicated specifically to DER cyber security, the AESCSF did not
    address DER-specific issues, and significant R&D effort was still required to
    understand the full extent of the challenge.
  lesson_learnt: DER cyber security is a cross-cutting gap that no single project
    will resolve — a coordinated sector-wide approach is required, as the security
    of the DER chain is only as strong as its weakest link (device, aggregator or
    communications layer); projects should embed cyber security assessment as a core
    deliverable rather than a minor workstream.
