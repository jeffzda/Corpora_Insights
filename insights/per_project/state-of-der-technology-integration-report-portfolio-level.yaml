  project_name: State of DER Technology Integration Report (Portfolio-level)
  what_happened: Network hosting capacity was assessed at trial stage, with parts
    of the network already reaching capacity limits and DNSPs having to limit DER
    connection or impose export limits. Setting these limits accurately or adjusting
    them dynamically was described as very difficult due to limited LV network information.
  lesson_learnt: Static export limits are a blunt instrument that will increasingly
    constrain DER value as penetration grows — DNSPs and project teams should invest
    in dynamic operating envelope capabilities and associated LV network modelling
    early, before hosting capacity constraints become a binding deployment barrier.
