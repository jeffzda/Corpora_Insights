  proponent_type: government/public-sector body
  delay_category: null
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: AEMO launched the DER Register in March 2020 for static data;
    multiple trials (Wattwatchers, GreenSync, Solar Analytics, NOJA Power) were developing
    real-time monitoring technologies; the DER Visibility and Monitoring Best Practice
    Guide was establishing a common dynamic data set.
  transferability: broad
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id005
  - 37
  - 38
  evidence_excerpt: The current level of DER visibility is relatively limited, with
    AEMO, DNSPs and service providers having little or no visibility of data regarding
    most existing DER devices... The DER Register is limited to static data that is
    collected at the time of installation of new DER devices and does not contain
    the full set of data needed to understand how the DER fleet is likely to behave
    in real-time.
