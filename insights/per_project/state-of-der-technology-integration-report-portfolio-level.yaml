  source_title: State of DER Technology Integration Report
  publish_date: 2021-02
  project_name: State of DER Technology Integration Report (Portfolio-level)
  what_happened: Bulk power system security and reliability impacts of high DER penetration
    were assessed as poorly understood outside of sub-areas like frequency control,
    with system strength and system restoration not being actively assessed in current
    trials and remaining at research stage. Australia's position at the global frontier
    of DER adoption meant limited overseas experience to draw from.
  lesson_learnt: System strength and system restoration challenges from high DER penetration
    require dedicated research investment — these are not solved by existing international
    experience, and Australia must develop its own evidence base; project sponsors
    should not assume these issues can be deferred until DER penetrations are higher.
