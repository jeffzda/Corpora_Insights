- record_id: ARENA-DLV-9105
  source_title: State of DER Technology Integration Report
  publish_date: 2021-02
  project_name: State of DER Technology Integration Report (Portfolio-level)
  what_happened: 'DER visibility was assessed as a critical bottleneck for the entire
    integration ecosystem: AEMO, DNSPs, and service providers had little or no visibility
    of most existing DER devices, and the DER Register launched in March 2020 captured
    only static data at installation and lacked real-time data or the full data set
    needed to understand fleet behaviour.'
  lesson_learnt: Real-time DER visibility is a prerequisite for network hosting capacity,
    DER modelling, bulk system security and trading — investment in visibility infrastructure
    should be treated as foundational before deploying more sophisticated DER service
    or market capabilities, noting that improving visibility of the existing fleet
    will be expensive and slow.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: programmatic/portfolio-level
