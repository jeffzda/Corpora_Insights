- record_id: ARENA-DLV-9103
  source_title: State of DER Technology Integration Report
  publish_date: 2021-02
  project_name: State of DER Technology Integration Report (Portfolio-level)
  what_happened: 'The assessment found that DER device standards compliance is a major
    systemic problem: empirical data from AEMO and DNSPs showed that a sizeable portion
    of the existing installed DER fleet does not meet current standards requirements,
    and this fleet is expected to be unable to meet higher requirements in the revised
    AS/NZS 4777.2, requiring grandfathering.'
  lesson_learnt: Device standards applied only to new installations create a long-lead-time
    problem for the overall fleet — programme designers should plan for decades-long
    transition periods and consider compliance uplift mechanisms alongside new standards,
    rather than assuming standards alone will deliver system-wide behavioural change.
