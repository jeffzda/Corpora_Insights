- record_id: ARENA-DLV-9107
  source_title: State of DER Technology Integration Report
  publish_date: 2021-02
  project_name: State of DER Technology Integration Report (Portfolio-level)
  what_happened: DER modelling was assessed as being at trial stage, with models for
    solar PV and battery storage gaining traction but models for newer DER types such
    as EV-to-grid and aggregated residential demand response in very early development
    stages. The current level of DER modelling was found to compare unfavourably with
    the mature, commercially available modelling of large-scale generating systems.
  lesson_learnt: DER modelling capability needs to evolve continuously as new DER
    types emerge — project sponsors should not assume that modelling approaches proven
    for solar PV will transfer directly to EVs or demand response aggregations, and
    should fund DER-type-specific modelling R&D in parallel with deployment programmes.
