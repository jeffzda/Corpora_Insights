- record_id: ARENA-DLV-72015
  source_title: Australian Energy Resource Assessment - Second edition, 2014
  publish_date: '2014'
  project_name: Australian hydroelectricity sector (general)
  what_happened: Hydroelectricity generation in eastern Australia declined significantly
    during the 2002–2009 drought, with water levels in Murray–Darling Basin storages
    falling to an average below 20 per cent of capacity and below 40 per cent in Tasmania,
    materially reducing capacity factors and output from hydro assets that had been
    designed and contracted on historical rainfall assumptions.
  lesson_learnt: Hydroelectricity project business cases and long-term revenue models
    must explicitly stress-test against extended drought scenarios; the 2002–2009
    drought demonstrated that storage levels can fall below 20 per cent of capacity
    for sustained multi-year periods, which should be treated as a reference-class
    planning scenario rather than a tail risk.
  issue_severity: major
  project_type: generation
  project_scale_band: utility/large-scale
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
