- record_id: ARENA-DLV-72016
  source_title: Australian Energy Resource Assessment - Second edition, 2014
  publish_date: '2014'
  project_name: Australian hydroelectricity sector (general)
  what_happened: Competition for scarce water resources from urban and agricultural
    uses, combined with environmental flow requirements below dams and water policy
    changes (including Murray–Darling Basin regulation), constrained hydroelectricity
    generators' ability to operate at planned capacity, and is projected to be a growing
    constraint on future hydro development in Australia.
  lesson_learnt: Water access rights and environmental flow obligations must be secured
    and stress-tested during project development for any hydroelectricity proposal
    in southern or eastern Australia — evolving water policy and competing uses (urban,
    agricultural, environmental) represent a material long-term operational risk that
    can override contracted generation capacity.
  issue_severity: moderate
  project_type: generation
  project_scale_band: utility/large-scale
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: partial success
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: null
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: pumped hydro
  source_pages: &id002
  - 250
  evidence_excerpt: Competition for water resources will also affect the availability
    of water for hydroelectricity generation... It is likely that these uses for scarce
    water resources will take precedence over hydroelectricity generation. Generators
    face increasing demands to balance their needs against the need for greater water
    security for cities and major inland towns.
  confidence_note: delay_category approvals/regulatory applied because evolving water
    policy and licence conditions represent the delivery constraint; secondary_failure_mode
    commercial/demand failure reflects the commercial consequence of reduced generation
    rights.
