  delay_category: internal governance/resourcing
  failure_mode: coordination & stakeholders
  outcome_class: delayed but recoverable
  secondary_failure_mode: null
  intervention_note: ARENA adopted a risk-based approach to delegations from approximately
    2017 to allow lower-level personnel to act as signatories.
  transferability: broad
  delay_magnitude: <1 month
  technology_domain: solar PV
