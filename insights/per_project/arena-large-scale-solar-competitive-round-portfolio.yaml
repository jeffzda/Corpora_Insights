  publish_date: '2019-12-20'
  project_name: ARENA Large-Scale Solar Competitive Round (portfolio)
  what_happened: The Solar Flagships program, which preceded the Competitive Round,
    encountered difficulties establishing feasibility due to a lack of offtake agreements
    in the market and overly optimistic assumptions about technology readiness, resulting
    in a protracted and ultimately unsuccessful process. ARENA drew explicit lessons
    from this failure when designing the Competitive Round.
  lesson_learnt: Assess technology and market readiness rigorously before launching
    a competitive funding round — the Solar Flagships program failed because technology
    was insufficiently developed and offtake markets did not exist, whereas the Competitive
    Round succeeded by waiting until the technology was deployable at scale and by
    involving CEFC to eliminate offtake risk as a Financial Close barrier.
