- record_id: ARENA-DLV-33651
  source_title: Large Scale Solar Portfolio Evaluation
  publish_date: '2019-12-20'
  project_name: ARENA Large-Scale Solar Competitive Round (portfolio)
  what_happened: 11 of 12 LSS Competitive Round projects failed to meet expected commissioning
    timeframes, averaging 8.5 months behind schedule, with grid connection complexity
    identified as the leading cause of delays and increased costs. Projects took on
    average 19 months to reach commercial operation from Financial Close.
  lesson_learnt: Liaise with AEMO prior to launching a competitive funding round and
    consider a staged approach to offering grant funding — concentrating 12 projects
    on similar timelines created a backlog of grid connection approvals that AEMO
    and NSPs were under-resourced to handle, adding an average of 8.5 months to schedules.
