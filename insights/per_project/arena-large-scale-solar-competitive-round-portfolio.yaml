- record_id: ARENA-DLV-33668
  source_title: Large Scale Solar Portfolio Evaluation
  publish_date: '2019-12-20'
  project_name: ARENA Large-Scale Solar Competitive Round (portfolio)
  what_happened: The funding agreement's withdrawal request process required authorisation
    personally from the ARENA CEO and CFO as bank account signatories, making it challenging
    to meet 5-business-day EPC payment deadlines when those officers were on leave
    or travelling, creating logistical risk for multiple projects during the construction
    phase.
  lesson_learnt: Adopt a risk-based approach to bank account delegation authorities
    so that appropriately senior but more available personnel can approve funding
    withdrawal requests — restricting signatory authority to the CEO and CFO created
    material payment risk for EPC contractors with tight invoice payment windows.
  issue_severity: minor
  project_type: generation
