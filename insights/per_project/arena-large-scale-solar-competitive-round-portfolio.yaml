  project_name: ARENA Large-Scale Solar Competitive Round (portfolio)
  what_happened: Published capex and opex data was categorised too broadly to be useful
    for detailed cost benchmarking by market participants. Active developers already
    had current EPC pricing through their own tender processes; the data's primary
    value was for new market entrants and institutions (such as banks) unfamiliar
    with the sector.
  lesson_learnt: Collect and publish cost data at a more granular level (e.g. separated
    into owner's costs, grid costs, and EPC sub-categories) and target publication
    timing to serve new market entrants and financiers — highly aggregated cost data
    becomes outdated quickly in a rapidly declining cost environment and incumbent
    developers gain minimal benefit from it.
