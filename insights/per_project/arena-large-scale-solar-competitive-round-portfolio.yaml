- record_id: ARENA-DLV-33652
  source_title: Large Scale Solar Portfolio Evaluation
  publish_date: '2019-12-20'
  project_name: ARENA Large-Scale Solar Competitive Round (portfolio)
  what_happened: The influx of grid connection applications from Competitive Round
    projects, combined with rule changes AEMO was making relating to system strength
    and Generator Performance Standards, overwhelmed AEMO's capacity to review and
    approve applications. Each new generator approval triggered cascading changes
    to the connection requirements of other queued generators, compounding delays.
  lesson_learnt: When designing a competitive funding round for generation projects,
    engage AEMO substantively before launch to understand connection queue capacity
    and consider staggered tranches of funding to avoid simultaneously flooding AEMO
    with applications from projects on identical timelines.
