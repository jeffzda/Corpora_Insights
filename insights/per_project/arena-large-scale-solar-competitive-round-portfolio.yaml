- record_id: ARENA-DLV-33688
  source_title: Large Scale Solar Portfolio Evaluation
  publish_date: '2019-12-20'
  project_name: ARENA Large-Scale Solar Competitive Round (portfolio)
  what_happened: The Competitive Round's LCOE focus, combined with a rapidly declining
    cost environment, meant that price discovery from published cost data had limited
    impact on forecast costs for incumbent developers — the data became outdated quickly
    and active developers already had current EPC pricing through their own continuous
    tender processes.
  lesson_learnt: In rapidly declining cost environments, published cost data from
    competitive rounds provides price discovery primarily for new market entrants
    and financiers rather than active developers — design knowledge sharing and data
    publication to explicitly serve these secondary beneficiaries rather than expecting
    incumbent proponents to update their forecasts from published data.
