  what_happened: ARENA grant funds were taxable, creating a tax structuring challenge
    for project proponents that required expenditure on specialist tax advice to minimise
    tax liability — an additional cost not anticipated in early project budgets.
  lesson_learnt: Explore intergovernmental arrangements to deem grant funds non-taxable
    at the program design stage — taxability of ARENA grant funds created unexpected
    tax advisory costs and structuring complexity for proponents; resolving this at
    the program level rather than at the project level would reduce costs and administrative
    burden across the portfolio.
