- record_id: ARENA-DLV-33664
  source_title: Large Scale Solar Portfolio Evaluation
  publish_date: '2019-12-20'
  project_name: ARENA Large-Scale Solar Competitive Round (portfolio)
  what_happened: Connection application processes locked developers into specific
    inverter models at an early stage; any subsequent change of inverter required
    restarting the entire connection application, creating significant schedule and
    cost risk if inverter availability or performance data changed during development.
  lesson_learnt: Finalise inverter selection and confirm product availability before
    lodging a grid connection application — the connection process locks in the inverter
    model and a change requires restarting the entire application, which can cost
    many months of schedule time.
