  secondary_failure_mode: regulatory & approvals
  intervention_note: ARENA facilitated knowledge sharing workshops between proponents
    and with AEMO and NSPs, enabling earlier identification of work-arounds to achieve
    grid connection.
  transferability: broad
  delay_magnitude: 3-12 months
  technology_domain: solar PV
