- record_id: ARENA-DLV-33667
  source_title: Large Scale Solar Portfolio Evaluation
  publish_date: '2019-12-20'
  project_name: ARENA Large-Scale Solar Competitive Round (portfolio)
  what_happened: The LCOE benchmark used in the Competitive Round focused solely on
    cost and was not calibrated against grid location or system value. This inadvertently
    concentrated funded projects in Queensland (6) and New South Wales (5), leaving
    Victoria, South Australia and Tasmania with no funded projects, contributing to
    NEM congestion in the regions where projects clustered.
  lesson_learnt: Supplement LCOE-based assessment criteria with grid stability, reliability
    and geographical diversity metrics in future funding rounds — sole focus on LCOE
    disadvantages projects in southern NEM states and concentrates generation in grid
    regions that become congested, reducing revenue through MLF deterioration and
    creating system strength issues.
