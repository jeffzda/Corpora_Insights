- record_id: ARENA-DLV-33665
  source_title: Large Scale Solar Portfolio Evaluation
  publish_date: '2019-12-20'
  project_name: ARENA Large-Scale Solar Competitive Round (portfolio)
  what_happened: The grid connection scoping study process had no commercial accountability
    — cost variations occurred frequently, estimates had limited basis-of-estimate
    documentation, and there was no mechanism for proponents to hold NSPs or AEMO
    accountable for scope or cost overruns in studies.
  lesson_learnt: Negotiate a defined scope, basis of estimate and cost cap for connection
    scoping studies before commissioning them — the absence of commercial accountability
    in scoping studies led to cost variations with no recourse for proponents and
    impaired project budget certainty.
