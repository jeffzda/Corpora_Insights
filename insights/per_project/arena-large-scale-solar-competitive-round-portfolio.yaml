- record_id: ARENA-DLV-33679
  source_title: Large Scale Solar Portfolio Evaluation
  publish_date: '2019-12-20'
  project_name: ARENA Large-Scale Solar Competitive Round (portfolio)
  what_happened: The Competitive Round's LCOE benchmark of $135/MWh embedded a 10%
    pre-tax WACC — higher than most sponsors' actual cost of capital — meaning sophisticated
    players could tailor their models to meet the benchmark relatively easily, and
    the benchmark may not have been as challenging as intended in driving genuine
    cost reduction.
  lesson_learnt: Calibrate LCOE benchmarks against actual sponsor weighted average
    costs of capital rather than a standard assumed rate — an embedded WACC that is
    materially above real market rates allows sophisticated bidders to achieve the
    benchmark without genuine cost reduction, and may understate the fund's catalytic
    impact.
