  source_title: Large Scale Solar Portfolio Evaluation
  publish_date: '2019-12-20'
  project_name: ARENA Large-Scale Solar Competitive Round (portfolio)
  what_happened: CEFC's concessional debt product, which did not require an executed
    offtake agreement as a precondition, was a critical enabler of the Competitive
    Round's success. By removing merchant risk as a barrier to Financial Close, CEFC's
    involvement gave ARENA and project sponsors confidence that shortlisted projects
    could achieve Financial Close even in an uncertain market.
  lesson_learnt: When launching a funding round for an immature generation technology
    in an uncertain offtake market, partner with CEFC or equivalent at program design
    stage so that concessional debt is available without requiring a PPA — this directly
    removes the most common barrier to Financial Close and enables programs to attract
    commercially viable projects that would otherwise fail to secure conventional
    debt.
