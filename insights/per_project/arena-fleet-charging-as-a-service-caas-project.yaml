- record_id: ARENA-DLV-22751
  source_title: JET Charge - Charging as a Service - Lessons Learnt 1
  publish_date: 2023-12
  project_name: ARENA Fleet Charging as a Service (CaaS) Project
  what_happened: Early marketing and customer engagement activities for the CaaS project
    yielded negligible results — minimal customer inquiries from project launch communications,
    low LinkedIn campaign engagement, and reluctance to engage at the National Public
    Sector Fleet Managers event — despite the AfMA 2023 survey confirming that cost
    and complexity of charging infrastructure is now the top barrier to fleet EV uptake.
  lesson_learnt: A technology-led organisation scaling a new commercial model must
    build outbound B2B marketing capability as a primary project deliverable from
    day one — a strong channel strategy alone is insufficient; structured test-and-learn
    marketing is needed to drive customer acquisition at scale.
