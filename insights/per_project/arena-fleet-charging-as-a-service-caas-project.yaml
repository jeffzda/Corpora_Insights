- record_id: ARENA-DLV-22755
  source_title: JET Charge - Charging as a Service - Lessons Learnt 1
  publish_date: 2023-12
  project_name: ARENA Fleet Charging as a Service (CaaS) Project
  what_happened: Channel development activities revealed that approximately half of
    JET Charge's business customer sales were to novated leasing customers (Fleet
    Management Organisations) rather than traditional fleet operators — a segment
    requiring a distinctly different CaaS product — and that VFACTS industry data
    misclassifies novated leasing as Business rather than Private sales, overstating
    the traditional fleet EV market size.
  lesson_learnt: Fleet EV market analysis must account for novated leasing as a separate,
    large segment — VFACTS data classifies novated leasing under Business/Fleet, but
    adjusting for this reclassification suggests the true traditional fleet EV market
    is approximately 15% of sales rather than the implied 32%, requiring separate
    product and channel strategies for novated leasing versus fleet operators.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: JET Charge brought forward product development activities aimed
    at providing a tailored CaaS solution for the FMO novated leasing segment.
  transferability: moderate
  delay_magnitude: null
  technology_domain: EV
  source_pages: &id005
  - 10
  evidence_excerpt: JET Charge analysis suggests the impact of this reallocation is
    significant. EV sales projections for 2023 would nominally have split the market
    at around 68% Private buyers versus 32% Fleet... Adjusting for the reclassification
    of novated leasing away from Business and adding to Private suggests the actual
    ratio is around 85% Private to 15% Fleet.
  confidence_note: transferability rated moderate rather than broad because the VFACTS
    classification issue is specific to the Australian EV market context.
