    employee home charging solutions, driven by cost and speed advantages: home charging
    costs less than half a comparable commercial building installation, and installation
    leadtime is approximately 2 weeks versus 3–6 months for a large commercial building
    project.'
  lesson_learnt: Employee home charging is a critical enabler for fleet electrification
    that should be prioritised in product design — the economics (unit cost less than
    half, lead time 2 weeks vs 3–6 months) and the fact that ~50% of fleet vehicles
    are garaged at employee homes make home charging a faster, cheaper path to fleet
    EV deployment than workplace infrastructure.
