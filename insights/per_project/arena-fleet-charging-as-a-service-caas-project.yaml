- record_id: ARENA-DLV-22756
  source_title: JET Charge - Charging as a Service - Lessons Learnt 1
  publish_date: 2023-12
  project_name: ARENA Fleet Charging as a Service (CaaS) Project
  what_happened: During project setup, JET Charge found that a purely waterfall project
    management approach was unsuitable for an early-stage commercialisation project
    due to high uncertainty, while a purely agile approach was incompatible with the
    fixed milestone commitments required by the ARENA funding agreement. The project
    adopted a hybrid agile-waterfall model combining waterfall Stage Gates with agile
    squad-based delivery within each stage.
  lesson_learnt: Commercialisation projects funded under fixed milestone agreements
    should adopt a hybrid agile-waterfall model from the outset — waterfall Stage
    Gates provide the contractual certainty required for funders while agile sprint
    cycles within each stage allow the build-test-learn loops needed to adapt product-market
    fit under uncertainty.
  issue_severity: minor
  project_type: transport electrification
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: internal governance/resourcing
  failure_mode: coordination & stakeholders
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: JET Charge designed and implemented a hybrid Stage Gate (waterfall)
    plus cross-functional Squad (agile) delivery model, with quarterly planning increments
    and build-test-learn feedback loops operating within each Stage Gate.
  transferability: broad
  delay_magnitude: null
  technology_domain: EV
  source_pages: &id006
  - 12
  - 13
  evidence_excerpt: Unfortunately the early stage commercialisation task is plagued
    by uncertainty, requiring flexibility in the delivery model to accommodate learnings
    that dictate next steps... JET Charge has designed and implemented a hybrid approach
    that reflects the milestone plan that is the foundation of our funding agreement
    and the commercialisation problem that we are seeking to solve.
  confidence_note: issue_severity minor because the issue was identified at project
    design stage and resolved before delivery commenced; transferability broad because
    the waterfall/agile tension applies to any ARENA commercialisation project with
    fixed milestone agreements.
