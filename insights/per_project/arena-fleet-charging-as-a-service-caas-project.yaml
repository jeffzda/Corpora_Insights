  secondary_failure_mode: coordination & stakeholders
  intervention_note: JET Charge identified a Marketing & Communications Plan as a
    key Milestone 1 deliverable and adopted a test-and-learn approach to outbound
    B2B marketing through Year One of the project.
  transferability: moderate
