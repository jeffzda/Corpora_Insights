- record_id: ARENA-DLV-22754
  source_title: JET Charge - Charging as a Service - Lessons Learnt 1
  publish_date: 2023-12
  project_name: ARENA Fleet Charging as a Service (CaaS) Project
  what_happened: 'Commercial building EV charging infrastructure faces a structural
    barrier: most buildings can accommodate only up to 5 AC chargers within existing
    electrical infrastructure before an expensive building uplift (approximately $100k
    for distribution boards, cable trays and cabling to support up to 50 AC stations)
    is required, which is typically the building owner''s responsibility and requires
    long-term tenancy commitment or rent increase to proceed.'
  lesson_learnt: Fleet electrification programmes deploying workplace charging must
    account for commercial building electrical infrastructure constraints early in
    planning — the ~5-charger threshold before costly building uplift is required
    frequently stalls deployment and shifts financial responsibility to building owners,
    making workplace-only strategies unreliable at scale.
