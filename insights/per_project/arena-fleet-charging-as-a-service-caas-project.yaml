- record_id: ARENA-DLV-22757
  source_title: JET Charge - Charging as a Service - Lessons Learnt 1
  publish_date: 2023-12
  project_name: ARENA Fleet Charging as a Service (CaaS) Project
  what_happened: When setting up cross-functional project squads comprising lawyers,
    engineers, project managers, electricians, graphic designers, accountants and
    software developers, JET Charge found that sophisticated collaboration tools with
    extensive feature sets were counterproductive — they raised the engagement barrier,
    alienated some team members, and undermined efforts to build momentum.
  lesson_learnt: Cross-functional project teams spanning diverse disciplines should
    adopt the simplest available collaboration tool — prioritise lowest barrier to
    entry over feature richness — to maximise participation and avoid losing momentum
    during project setup; JET Charge adopted Confluence as a low-overhead, intuitive
    platform that enabled engagement without a large training overhead.
  issue_severity: minor
  project_type: transport electrification
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: internal governance/resourcing
  failure_mode: coordination & stakeholders
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: JET Charge replaced sophisticated collaboration tools with the
    Atlassian Confluence platform — a simple, intuitive 'blank canvas' tool — to reduce
    the engagement barrier and promote cross-functional team participation.
  transferability: broad
  delay_magnitude: null
  technology_domain: EV
  source_pages: &id007
  - 14
  evidence_excerpt: In bringing together a diverse team we found that more sophisticated
    tools were counterproductive as they raised the bar for user engagement and productivity,
    alienating some team members and undermining efforts to establish momentum. As
    an outcome, we have adopted a simple collaboration tool with the lowest bar for
    user engagement.
  confidence_note: issue_severity minor — the document rates this LOW significance
