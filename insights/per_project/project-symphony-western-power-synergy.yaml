- record_id: ARENA-DLV-29555
  source_title: DEIP - DEIP Dive - Event Summary 2023
  publish_date: 2023-07
  project_name: Project Symphony (Western Power/Synergy)
  what_happened: Project Symphony revised its consumer engagement approach between
    Phase 1 and Phase 2 of the pilot after Phase 1 revealed inadequate consumer communication,
    introducing dedicated communication tools. This change was credited as a key factor
    behind improved consumer experiences in Phase 2.
  lesson_learnt: DER/VPP pilot programs should invest in dedicated, consistent consumer
    communication tools from the outset — the significant improvement in consumer
    experience between Phase 1 and Phase 2 of Project Symphony demonstrates that reactive
    engagement remediation between phases is effective but would be more efficient
    if built in from the start.
