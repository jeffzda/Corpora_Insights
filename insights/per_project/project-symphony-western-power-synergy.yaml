- record_id: ARENA-DLV-29557
  source_title: DEIP - DEIP Dive - Event Summary 2023
  publish_date: 2023-07
  project_name: Project Symphony (Western Power/Synergy)
  what_happened: Project Symphony initially experienced a failure rate in the provision
    of market services when orchestrating DER/CER to provide network services, though
    performance optimisation improved outcomes over time.
  lesson_learnt: VPP/DER orchestration platforms should anticipate an initial service-delivery
    failure rate when first dispatching to market and build in a structured optimisation
    phase — treating early operational performance as a tuning baseline rather than
    a launch target reduces the reputational risk of early service failures with consumers
    and counterparties.
