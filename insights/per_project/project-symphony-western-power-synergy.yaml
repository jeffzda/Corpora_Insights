- record_id: ARENA-DLV-29559
  source_title: DEIP - DEIP Dive - Event Summary 2023
  publish_date: 2023-07
  project_name: Project Symphony (Western Power/Synergy)
  what_happened: Project Symphony identified that to achieve scalability by 2027 it
    must demonstrate not only technical feasibility but commercial viability, sustainable
    financing, and multi-service consumer participation — and that quantifying and
    communicating the actual value of VPPs to the market and consumers is a key unresolved
    priority.
  lesson_learnt: VPP pilots should establish a value quantification and communication
    strategy as a formal workstream from the outset — the inability to clearly articulate
    VPP value to market and consumers is a barrier to commercial scale-up and should
    not be deferred to the post-pilot phase.
  issue_severity: moderate
  project_type: DER/customer-side
