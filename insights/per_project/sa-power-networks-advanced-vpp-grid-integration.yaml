- record_id: ARENA-DLV-45004
  source_title: Network Hosting Capacity Projects Progress Report (Year One)
  publish_date: 2020-03
  project_name: 'SA Power Networks: Advanced VPP Grid Integration'
  what_happened: Integrating SAPN's distribution network API with Tesla's VPP management
    and market trading systems required global updates to Tesla's Powerwall firmware
    to support the dynamic export limit function, demonstrating that network-side
    API integration with third-party DER platforms can require changes to embedded
    device firmware at scale.
  lesson_learnt: When designing network APIs that interact with third-party DER hardware,
    plan for the possibility that firmware changes to end-user devices will be required
    — this involves coordinating across the network operator, aggregator, and device
    manufacturer, and can affect large numbers of devices globally, not just the trial
    cohort.
  issue_severity: minor
  project_type: network/grid
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: network business
  delay_category: commissioning/integration
  failure_mode: unvalidated integration
  outcome_class: delayed but recoverable
  secondary_failure_mode: coordination & stakeholders
  intervention_note: Tesla issued global Powerwall firmware updates to support the
    dynamic export limit function, enabling the API integration and live field trial
    to commence in July 2019.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: DER
  source_pages: &id001
  - 6
  evidence_excerpt: The API has been integrated with Tesla's VPP management and market
    trading systems, including global updates to Tesla's Powerwall firmware to support
    the dynamic export limit function, and commenced live field trials in July 2019.
  confidence_note: The need for global firmware updates is flagged as a notable integration
    complexity; it is unclear whether this caused delay, but the multi-party coordination
    required warrants a minor severity rating.
