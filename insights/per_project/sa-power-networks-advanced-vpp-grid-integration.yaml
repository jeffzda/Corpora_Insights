- record_id: ARENA-DLV-45005
  source_title: Network Hosting Capacity Projects Progress Report (Year One)
  publish_date: 2020-03
  project_name: 'SA Power Networks: Advanced VPP Grid Integration'
  what_happened: SAPN established a DER integration API working group drawing together
    multiple related ARENA projects to collaborate on API design and development,
    accelerating progress and reducing duplication across the portfolio.
  lesson_learnt: Where multiple concurrent projects are developing similar API or
    integration interfaces, establishing a cross-project working group early creates
    shared design standards and reduces duplicated effort — SAPN's API working group,
    which brought together several ARENA projects, is a replicable coordination mechanism
    for DER integration programmes.
