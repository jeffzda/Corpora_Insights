- record_id: ARENA-DLV-52408
  source_title: 'Australian Solar Energy Forecasting System Final Report: Project
    Results and Lessons Learnt'
  publish_date: 2016-05
  project_name: Australian Solar Energy Forecasting System (ASEFS)
  what_happened: The ASEFS R&D program successfully developed a sky-camera based solar
    ramp-event forecasting system that, using inexpensive off-the-shelf fisheye cameras,
    correctly predicted 99.96% of cloud shading events over a 30-day validation period
    and provided up to 30 minutes of advance warning for slow high clouds and more
    than 5 minutes for fast low clouds. The cloud classification model achieved 97%
    pixel-level accuracy on a 1-million pixel test set.
  lesson_learnt: Low-cost, off-the-shelf camera hardware can be integrated with machine-learning
    cloud classification to deliver operational-quality solar ramp-event warnings;
    such systems can be brought to TRL 5–6 within a single R&D project cycle and are
    suitable for rapid deployment at large solar farms to enable pre-emptive grid
    management actions.
