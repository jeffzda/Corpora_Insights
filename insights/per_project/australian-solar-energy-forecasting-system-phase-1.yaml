  intervention_note: Two small-scale test solar farms (Black Mountain, Canberra and
    Norwest, Sydney) were rapidly set up to provide scaled SCADA feeds so the forecasting
    models could be exercised in a non-production environment.
  transferability: moderate
  delay_magnitude: not quantified
