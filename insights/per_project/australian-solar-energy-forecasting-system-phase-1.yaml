- record_id: ARENA-DLV-52405
  source_title: 'Australian Solar Energy Forecasting System Final Report: Project
    Results and Lessons Learnt'
  publish_date: 2016-05
  project_name: Australian Solar Energy Forecasting System (ASEFS)
  what_happened: The ASEFS operational forecasting system was successfully delivered
    and went live at AEMO on 30 May 2014 — on the planned target date. Performance
    in user-acceptance testing exceeded the NMAE accuracy specifications across all
    forecast horizons (5 minutes to 6 days ahead) for both test solar farms, demonstrating
    that the wind forecasting system architecture (AWEFS) could be extended to solar
    with acceptable accuracy.
  lesson_learnt: Extending an existing, proven operational forecasting architecture
    (AWEFS) to a new generation technology (solar) is a viable and lower-risk delivery
    approach — leveraging the same subcontractor, data feeds, and system integration
    pathway can enable on-time delivery even when the target technology (large-scale
    solar) is not yet commercially deployed.
