- record_id: ARENA-DLV-52409
  source_title: 'Australian Solar Energy Forecasting System Final Report: Project
    Results and Lessons Learnt'
  publish_date: 2016-05
  project_name: Australian Solar Energy Forecasting System (ASEFS)
  what_happened: Analysis of the ACCESS NWP model's radiative transfer parameterisation
    during the ASEFS R&D program uncovered an erroneous assumption in the formulation
    used to derive direct solar radiation, consistent with systematic over-estimation
    of the direct beam component and under-estimation of the diffuse component. A
    corrected version of the ACCESS-C model was developed and tested.
  lesson_learnt: When adapting an NWP model for solar irradiance forecasting, validate
    the radiative transfer parameterisation against surface observations before relying
    on model output — systematic bias in the direct/diffuse radiation partition can
    propagate into forecasting errors and may originate from assumptions embedded
    in the base model that have not been scrutinised for solar applications.
  issue_severity: minor
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: A corrected version of ACCESS-C was developed and monthly forecasts
    were run to assess improvement in surface radiation verification scores; the correction
    was subsequently applied to global and regional model variants.
  transferability: narrow
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id005
  - 20
  - 21
  evidence_excerpt: In the process of checking the results of the two-stream variants
    an erroneous assumption in the formulation used to derive the direct solar radiation
    in the parameterization scheme was uncovered which was consistent with too much
    direct beam radiation.
  confidence_note: transferability set to narrow as this finding is specific to the
