- record_id: ARENA-DLV-52401
  source_title: 'Australian Solar Energy Forecasting System Final Report: Project
    Results and Lessons Learnt'
  publish_date: 2016-05
  project_name: Australian Solar Energy Forecasting System (ASEFS)
  what_happened: Large-scale solar farms (>30 MW) that the ASEFS operational system
    was designed to serve were not commissioned during the project period (January
    2013 – June 2015), due to delays and withdrawals under the Solar Flagship program
    caused by policy changes around renewables. As a result, the operational ASEFS
    system could not be tested against real large-scale generators and had to operate
    in a non-production environment using two small-scale test farms.
  lesson_learnt: Projects that are designed around an anticipated pipeline of external
    assets should explicitly assess the policy and market risk to that pipeline; where
    the project's primary operational objective depends on third-party asset commissioning,
    build contingency scope that allows the project to generate value independent
    of whether those assets are delivered on schedule.
