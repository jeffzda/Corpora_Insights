- record_id: ARENA-DLV-52404
  source_title: 'Australian Solar Energy Forecasting System Final Report: Project
    Results and Lessons Learnt'
  publish_date: 2016-05
  project_name: Australian Solar Energy Forecasting System (ASEFS)
  what_happened: The rapid and largely unanticipated uptake of rooftop PV in Australia
    grew to over 4 GW during the ASEFS project period — far exceeding expectations
    at the time of project design — creating a growing supply-demand balancing problem.
    Forecast errors attributable to unmodelled distributed PV had already been experienced
    in South Australia and South-East Queensland, with potential to cause severe power
    quality (frequency) issues. Because distributed PV forecasting was only a small
    component of the original ASEFS scope, the project could not fully pivot to address
    this emerging issue.
  lesson_learnt: In fast-moving technology sectors, project scopes should be designed
    with sufficient flexibility to allow reallocation of effort toward unexpected
    but material emerging issues; a formal mid-project rescoping mechanism should
    be established so teams can respond to rapid market shifts without needing to
    wait for the next funding round.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: close-out/post-project review
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Planned distributed PV forecasting work was delivered as originally
    scoped; AEMO subsequently commissioned a separate system to handle rooftop solar
    PV generation forecasting.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id002
  - 43
  evidence_excerpt: 'An unexpected rapid increase in the uptake of roof-top PV has
    been creating a growing problem for the balancing of supply-demand: forecast errors
    have already been experienced in regions like South Australia or South East Queensland,
    and these may increasingly contribute to severe power quality (frequency) issues.
    This externality was difficult to anticipate. However, it only affected the project
    to the extent that more emphasis could have been placed on targeting this issue
    during ASEFS, perhaps through a re-planning of the project.'
  confidence_note: null
