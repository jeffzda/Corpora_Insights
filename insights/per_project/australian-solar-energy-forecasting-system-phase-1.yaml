- record_id: ARENA-DLV-52410
  source_title: 'Australian Solar Energy Forecasting System Final Report: Project
    Results and Lessons Learnt'
  publish_date: 2016-05
  project_name: Australian Solar Energy Forecasting System (ASEFS)
  what_happened: Intermittent gaps in ARENA funding between ASEFS and potential successor
    projects risked loss of the specialised solar forecasting expertise developed
    during the project, with some migration of researchers to other areas already
    occurring. The document notes that without long-term investment continuity Australia
    would not be competitive in supporting the solar industry and was already dependent
    on the overseas firm Overspeed for operational system services.
  lesson_learnt: Capability built through a discrete R&D project is vulnerable to
    attrition if follow-on funding is not secured before the project closes; funder
    and proponent should plan for continuity of specialised teams between sequential
    projects, particularly in emerging fields where Australian expertise is thin and
    international competition is intense.
