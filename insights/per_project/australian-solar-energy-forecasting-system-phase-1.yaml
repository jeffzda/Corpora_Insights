- record_id: ARENA-DLV-52402
  source_title: 'Australian Solar Energy Forecasting System Final Report: Project
    Results and Lessons Learnt'
  publish_date: 2016-05
  project_name: Australian Solar Energy Forecasting System (ASEFS)
  what_happened: The agreement between CSIRO and US subcontractor NREL took over one
    year from project commencement (January 2013) to be signed, due to the complexity
    of the two organisations involved and lengthy negotiations. NREL did not consistently
    contribute to ASEFS until June 2014, and the overall project finished six months
    later than originally planned (June 2015 vs. December 2014).
  lesson_learnt: When engaging international research organisations as subcontractors,
    circulate draft terms and conditions well ahead of planned contract execution
    — legal complexity between large organisations can delay signing by more than
    a year and push out project completion.
