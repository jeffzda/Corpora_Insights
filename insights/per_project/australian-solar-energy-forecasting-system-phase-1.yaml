- record_id: ARENA-DLV-52403
  source_title: 'Australian Solar Energy Forecasting System Final Report: Project
    Results and Lessons Learnt'
  publish_date: 2016-05
  project_name: Australian Solar Energy Forecasting System (ASEFS)
  what_happened: Researcher access to ASEFS operational forecast data — a planned
    key project output modelled on analogous access provided for AWEFS — could not
    be delivered because no large-scale solar generators were registered in the system,
    meaning ASEFS ran only in a non-production test environment. Technical issues
    also prevented AEMO from extracting offline forecast data from the test system,
    and the data remained unavailable at project completion.
  lesson_learnt: When a project's evaluation framework requires access to operational
    data held by a third-party system operator, formalise the data-sharing arrangement
    and test the extraction pathway before the evaluation milestone is due — do not
    rely on a data access mechanism (researcher access) that is contingent on operational
    conditions outside the project's control.
