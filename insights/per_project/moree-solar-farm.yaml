  what_happened: High-quality, long-term meteorological data was found to be critical
    for accurate production assessments for solar tracking applications, with site-derived
    data needing to be correlated against datasets with good temporal and spatial
    coverage — a higher bar than for fixed-tilt systems.
  lesson_learnt: For solar tracking applications, longer-term site meteorological
    data at ISO Class accuracy standard is critical; ensure reference datasets used
    for correlation have good temporal coverage and spatial resolution — inadequate
    data undermines production forecasts and lender confidence.
