- record_id: ARENA-DLV-71714
  source_title: Moree Solar Farm Lessons Learnt Report
  publish_date: null
  project_name: Moree Solar Farm
  what_happened: The regulatory framework for generator connections under Chapter
    5 of the National Electricity Rules provided no mandatory timeframes for NSP connection
    steps including costing of non-contestable works. This forced Moree Solar Farm
    to accept risk on NSP design and costing timelines, requiring financiers to make
    otherwise avoidable contingency allowances.
  lesson_learnt: Advocate for improvements to Chapter 5 of the National Electricity
    Rules to include mandatory timelines for generator connection steps including
    costing of non-contestable works — in the current framework, NSPs face no penalty
    for delays, forcing project proponents to absorb scheduling risk and financiers
    to hold unnecessary contingency.
  issue_severity: major
  project_type: generation
  project_scale_band: utility/large-scale
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: grid connection/system studies
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: coordination & stakeholders
  intervention_note: Positive engagement with the NSW Government Renewable Energy
    Advocate and the NSP's Connection Manager enabled the project to meet most key
    deadlines despite the absence of regulatory mandated timeframes.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id014
  - 6
  - 7
  evidence_excerpt: The current regulatory framework for connection of Generators
