  project_name: Moree Solar Farm
  what_happened: Moree Solar Farm pursued a merchant financing structure (selling
    into the wholesale spot market) rather than a PPA, which was unusual for Australian
    utility-scale PV at the time. The Solar Flagships program and subsequent ARENA
    program originally required a PPA for eligibility, but a flexible solution was
    ultimately agreed, enabling the project to proceed on a merchant basis.
  lesson_learnt: Obtaining a long-term PPA for utility-scale solar in Australia has
    proven challenging — developers should explore innovative financing structures
    including merchant arrangements, and engage early with funders (ARENA, CEFC) about
    flexibility in funding conditions, as program requirements may be adaptable where
    the underlying project rationale is sound.
