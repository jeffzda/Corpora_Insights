  what_happened: Moree Solar Farm was the first large-scale solar farm in Australia
    to use horizontal single-axis trackers. The technology increased energy yield
    and better matched grid load profiles but introduced higher ongoing maintenance
    costs and stricter site flatness requirements (generally <5° slope) compared to
    fixed structures.
  lesson_learnt: Tracking systems require much flatter sites than fixed structures
    (generally <5° slope) and involve higher ongoing maintenance costs — account for
    these constraints in site selection and operational budgeting; also ensure mounting
    structures are sufficiently elevated on flood-prone sites.
