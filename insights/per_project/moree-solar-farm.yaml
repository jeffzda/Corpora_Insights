  what_happened: The original project size of 150MW was set by the Solar Flagships
    program minimum requirement. An initial MLF/DLF assessment for that size underestimated
    network losses; a subsequent assessment by a different consultant identified higher
    losses, creating commercial pressure and ultimately leading to the project being
    rescoped to 56MWac once minimum size constraints were lifted.
