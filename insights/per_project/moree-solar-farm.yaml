  source_title: Moree Solar Farm Lessons Learnt Report
  publish_date: null
  project_name: Moree Solar Farm
  what_happened: The Solar Flagships program required projects to pre-select technology
    providers and construction companies as part of the initial proposal, which reduced
    competitive tension and led to less efficient procurement outcomes compared to
    an open competitive process.
  lesson_learnt: Avoid pre-selecting technology providers and construction companies
    in funding program requirements — locking in suppliers before competitive tension
    can be applied increases costs; retaining flexibility to select providers late
    in the process (from a shortlist) helps minimise project costs.
  issue_severity: moderate
  project_type: generation
  project_scale_band: utility/large-scale
  lifecycle_phase: procurement
  proponent_type: project developer
  delay_category: procurement/supply chain
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: coordination & stakeholders
  intervention_note: ARENA ultimately allowed flexibility in provider selection for
    Moree Solar Farm, enabling FRV to run a competitive RFP process and retain supplier
    selection flexibility until late in negotiations, which minimised overall project
    costs.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id021
  - 11
  - 12
  evidence_excerpt: Often, government programs can require or assess more favourably
    the inclusion of a specific technology provider and / or construction company
    as part of the initial project proposal, as was the case for the Solar Flagships
    program... this can result in less efficient outcomes as developers are unable
    to utilise competitive tension in the selection of providers. The flexibility
    ultimately allowed by ARENA in this respect helped to minimise the overall project
    costs for Moree Solar Farm.
