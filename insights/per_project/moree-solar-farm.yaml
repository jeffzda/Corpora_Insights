- record_id: ARENA-DLV-71707
  source_title: Moree Solar Farm Lessons Learnt Report
  publish_date: null
  project_name: Moree Solar Farm
  what_happened: During PV module procurement, the project identified that quality
    control practices vary significantly across manufacturer production lines, and
    that IEC certifications (61730, 61853, 61215) and Light Induced Degradation (LID)
    test records are not consistently provided unless explicitly required.
  lesson_learnt: When selecting a PV module manufacturer, verify quality control measures
    at each production line used for the project, confirm relevant IEC certifications
    are held, and require suppliers to provide LID testing records — these are not
    automatically supplied and omitting them creates performance and warranty risk.
  issue_severity: minor
  project_type: generation
  project_scale_band: utility/large-scale
  lifecycle_phase: procurement
  proponent_type: project developer
