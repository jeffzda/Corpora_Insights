  - 39
  evidence_excerpt: The project was initially financed on a merchant basis, but later
    secured a 15-year PPA with Origin in March 2016 (during the Competitive Round
    process), covering 100% of the output. Feedback from a participant highlighted
    this project as a 'blueprint' for others to follow, giving other developers confidence
    to apply for funding initially on a merchant basis.
