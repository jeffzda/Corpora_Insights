- record_id: ARENA-DLV-15823
  source_title: Evaluation of ARENA's Impact and Effectiveness
  publish_date: 2019-11
  project_name: Moree Solar Farm
  what_happened: The 56 MW Moree Solar Farm was Australia's first large-scale solar
    project using single-axis tracking. It was initially financed on a merchant basis
    before securing a 15-year PPA with Origin in March 2016. The project became a
    'blueprint' for subsequent developers, giving others confidence to pursue large-scale
    solar initially on a merchant basis, including the Swan Hill solar farm which
    secured $16.5 million in debt funding without a PPA.
  lesson_learnt: First-mover large-scale solar projects that are well-documented and
    publicly reported become industry blueprints — the Moree experience shows that
    a single landmark project with comprehensive knowledge sharing can unlock private
    financing for subsequent projects by demonstrating that merchant-basis financing
    is achievable.
  issue_severity: none
  project_type: multi-technology/hybrid
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: operations
  proponent_type: project developer
  delay_category: no material delay stated
