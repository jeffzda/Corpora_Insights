  publish_date: null
  project_name: Moree Solar Farm
  what_happened: During consultation phases of lower activity, community confusion
    arose about whether the project was still progressing; conversely, during intense
    engagement phases, participation numbers fell — indicating that the cadence of
    consultation was not well calibrated to project rhythm.
  lesson_learnt: Do not over-consult, but provide regular status updates to ensure
    misconceptions do not emerge — calibrate consultation intensity to project stage
    rather than maintaining a constant high frequency that causes community fatigue.
