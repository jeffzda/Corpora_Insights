  source_title: Moree Solar Farm Lessons Learnt Report
  publish_date: null
  project_name: Moree Solar Farm
  what_happened: Moree Solar Farm required a critical reactive power (voltage) control
    strategy to prevent network stress from intermittent solar generation on a long,
    high-impedance distribution network. The project engaged the NSP early and met
    frequently to develop a mutually acceptable strategy.
  lesson_learnt: Engage the NSP early and conduct grid-connection studies before design
    is finalised — understanding pre-existing network characteristics is essential
    to developing an appropriate reactive power control strategy, particularly on
    high-impedance rural distribution networks.
