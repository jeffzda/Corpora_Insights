  project_name: Moree Solar Farm
  what_happened: Rural Australian grid locations with high solar resource tend to
    sit on long, high-impedance distribution lines where harmonic current distortion
    from inverters can be amplified — a more significant issue than in stronger urban
    networks.
  lesson_learnt: Analyse and design the solar farm so that harmonic current distortion
    from inverters does not exceed relevant standards or NSP requirements — this risk
    is amplified in rural high-impedance networks typical of Australian solar resource
    zones and must be addressed in design, not left to commissioning.
