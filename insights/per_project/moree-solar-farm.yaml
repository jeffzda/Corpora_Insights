    and PPA-backed ones, due to unfamiliarity with the technology and construction
    risk profile.
  lesson_learnt: Public funding support (ARENA grant, CEFC loan) is critical to underpinning
    financing of first-of-a-kind utility-scale solar projects in a market where commercial
    lenders lack experience — as the market matures, commercial appetite and financing
    costs will improve.
