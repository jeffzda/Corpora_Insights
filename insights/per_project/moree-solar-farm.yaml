  source_title: Moree Solar Farm Lessons Learnt Report
  publish_date: null
  project_name: Moree Solar Farm
  what_happened: MLF and DLF values change annually based on variations in loads,
    generation and other NEM changes, meaning long-term revenue forecasts built on
    a single MLF/DLF assessment carry material risk if load forecasts and NEM changes
    are not adequately sensitivity-tested.
  lesson_learnt: When projecting solar farm revenues over project life, perform sensitivity
    analysis on MLF/DLF assumptions to account for future load and NEM changes — these
    factors are recalculated annually and can materially affect revenues if not stress-tested.
