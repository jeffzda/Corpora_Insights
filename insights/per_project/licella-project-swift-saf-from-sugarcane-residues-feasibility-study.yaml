- record_id: ARENA-DLV-2051
  source_title: Licella - Project Swift - Lessons Learnt Report
  publish_date: 2025-08
  project_name: Licella - Project Swift - SAF from Sugarcane Residues Feasibility
    Study
  what_happened: During pre-FEED, Licella evaluated the relationship between carbon
    intensity and production cost for SAF and found that targeting lower carbon intensity
    significantly increases production costs, particularly for a FOAK facility in
    Australia where low-carbon inputs such as renewable energy, green hydrogen, and
    sustainable feedstocks are not yet mature or competitively priced.
  lesson_learnt: SAF project developers should use a carbon-cost trade-off framework
    (such as a Carbon-Price Efficiency Frontier) to prioritise decarbonisation measures
    offering the best value per dollar, and plan for progressive decarbonisation as
    technologies scale and markets mature — rather than targeting maximum carbon reduction
    at FOAK stage, which undermines commercial viability.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: concept/feasibility
  proponent_type: technology vendor
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Licella developed a 'Carbon-Price Efficiency Frontier' framework
    to communicate trade-offs to investors and policymakers, enabling more informed
    and pragmatic decision-making about decarbonisation targets at FOAK scale.
  transferability: moderate
  delay_magnitude: null
  technology_domain: bioenergy
  source_pages: &id001
  - 6
  - 7
  - 8
  evidence_excerpt: Reducing the carbon intensity of SAF often increases production
    costs, particularly where a facility is a First-of-a-Kind (FOAK) in the local
    market, as is the case in Australia.
  confidence_note: Classified as design assumption failure because the cost-carbon
    trade-off was not fully understood at project outset and required pre-FEED analysis
    to surface; no schedule delay was documented.
