  what_happened: Licella identified that conventional SAF feedstocks (used cooking
    oil, tallow, edible oils, first-generation sugar) used in HEFA and ATJ pathways
    are volume-constrained and subject to increasing price volatility, limiting the
    scale at which these pathways alone can meet aviation decarbonisation targets.
  lesson_learnt: SAF project developers targeting large-scale production should prioritise
    lignocellulosic waste and residue feedstocks over conventional HEFA/ATJ feedstocks
    — conventional feedstocks face structural supply constraints that limit scalability,
    while agricultural residues offer abundant, low-cost and low-carbon-intensity
    alternatives.
