  project_name: Licella - Project Swift - SAF from Sugarcane Residues Feasibility
    Study
  what_happened: During early-stage planning, Licella developed a social impact framework
    and established a community baseline using ABS Census data and regional planning
    documents before formal community consultation commenced, which proactively identified
    housing and accommodation pressures, road and transport infrastructure constraints,
    workforce access challenges, and the need for early First Nations engagement in
    the Bundaberg region.
  lesson_learnt: Define measurable social indicators and establish a local community
    baseline before formal consultation begins — early social impact framework development
    surfaces risks (e.g. accommodation shortages, infrastructure constraints, First
    Nations engagement needs) that can be designed around, rather than discovered
    during approvals or construction.
