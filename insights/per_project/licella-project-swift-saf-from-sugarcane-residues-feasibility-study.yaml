  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Licella identified maritime biofuels and potentially renewable
    CO2 as lower-barrier Phase 1 products with faster routes to market, adopting a
    phased product development approach to secure earlier revenues and protect the
    FID timeline while SAF certification proceeds in parallel.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: bioenergy
