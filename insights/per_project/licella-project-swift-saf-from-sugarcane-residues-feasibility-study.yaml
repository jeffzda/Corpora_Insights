  project_type: industrial decarbonisation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: approvals/contracting
  proponent_type: technology vendor
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Licella made formal submissions to Queensland's Primary Industries
    Blueprint, Queensland Waste Strategy 2025–2030, and DCCEEW's Guarantee of Origin
    LCLF Expansion consultation to advocate for HTL as a recognised LCLF pathway.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: bioenergy
  source_pages: &id005
