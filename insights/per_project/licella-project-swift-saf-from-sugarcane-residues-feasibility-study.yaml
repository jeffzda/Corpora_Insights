  source_title: Licella - Project Swift - Lessons Learnt Report
  publish_date: 2025-08
  project_name: Licella - Project Swift - SAF from Sugarcane Residues Feasibility
    Study
  what_happened: Through technical sessions with upgrading partner Shell Catalyst
    & Technologies during pre-FEED, Licella identified that the ASTM certification
    pathway for its SAF product represented a key risk to achieving Final Investment
    Decision within the project's target timeframes, potentially delaying FID at end
    of 2026.
  lesson_learnt: For SAF projects using novel conversion pathways, map the ASTM certification
    timeline explicitly during pre-FEED and identify lower-barrier product pathways
    (such as maritime biofuels) that can serve as Phase 1 revenue streams — this improves
    bankability and protects the FID timeline from being held hostage to long certification
    processes.
