- record_id: ARENA-DLV-2055
  source_title: Licella - Project Swift - Lessons Learnt Report
  publish_date: 2025-08
  project_name: Licella - Project Swift - SAF from Sugarcane Residues Feasibility
    Study
  what_happened: During pre-FEED, Licella identified that newer HTL conversion pathways
    are frequently overlooked in evolving LCLF policy frameworks at both Queensland
    and Federal levels, creating regulatory uncertainty around project approvals,
    feedstock classifications, and eligibility under future LCLF standards that could
    materially delay or derail the project.
  lesson_learnt: Projects utilising novel conversion technologies should engage proactively
    and persistently with policymakers from the earliest project phase — submitting
    to consultations and advocating for technology-inclusive policy definitions —
    to reduce regulatory uncertainty and ensure their pathway is not inadvertently
    excluded from emerging frameworks.
