- record_id: ARENA-DLV-2052
  source_title: Licella - Project Swift - Lessons Learnt Report
  publish_date: 2025-08
  project_name: Licella - Project Swift - SAF from Sugarcane Residues Feasibility
    Study
  what_happened: Pre-FEED technical studies and on-site trials at Isis Central Sugar
    Mill revealed that sugarcane bagasse cannot be reliably stored for use during
    the six-month off-season due to high moisture content (~50% by weight), which
    causes rapid microbial breakdown resulting in up to 30–50% dry matter loss over
    several months and greenhouse gas emissions that undermine the feedstock's environmental
    credentials.
  lesson_learnt: Projects targeting seasonal biomass feedstocks such as bagasse should
    adopt a mixed feedstock strategy from the outset — using bagasse during the harvest
    season and switching to storable alternatives (e.g. woody biomass residues) during
    the off-season — rather than relying on long-term storage, which is technically
    unreliable and environmentally costly.
  issue_severity: major
  project_type: industrial decarbonisation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: concept/feasibility
  proponent_type: technology vendor
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Licella embedded a diversified feedstock model into the project
    design, planning to use bagasse during harvest season and switch to storable woody
    biomass residues in the off-season, eliminating reliance on costly drying and
    storage infrastructure.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: bioenergy
  source_pages: &id002
  - 9
  - 10
  - 11
  evidence_excerpt: Licella's feedstock studies and published industry data (including
    by IEA Bioenergy), suggest that significant breakdown of the feedstock can occur
    within weeks, with up to 30–50% dry matter loss over several months if left unmanaged.
  confidence_note: null
