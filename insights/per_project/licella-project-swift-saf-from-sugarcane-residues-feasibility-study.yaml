  what_happened: 'A Fatal Flaws Assessment conducted early in pre-FEED identified
    two potential environmental constraints at the preferred project site: a vegetation
    covenant near the proposed site layout and a potential impact on a local waterway,
    both of which had the potential to negatively impact the permitting timeline.'
  lesson_learnt: Commission a fatal flaws assessment at the start of the feasibility
    stage — early identification of environmental and regulatory constraints at a
    preferred site allows the plot plan to be adjusted with minimal rework, avoiding
    costly redesign and approval delays later.
