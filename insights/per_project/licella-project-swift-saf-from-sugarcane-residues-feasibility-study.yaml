- record_id: ARENA-DLV-2053
  source_title: Licella - Project Swift - Lessons Learnt Report
  publish_date: 2025-08
  project_name: Licella - Project Swift - SAF from Sugarcane Residues Feasibility
    Study
  what_happened: On-site trials at ICSM demonstrated that drying bagasse immediately
    after production to below 25% moisture content could theoretically prevent microbial
    breakdown and enable long-term storage, but in practice drying is energy- and
    capital-intensive in humid climates, and rewetting during storage — observed during
    Licella's trials — reinitiated microbial breakdown, making drying an unreliable
    standalone solution.
  lesson_learnt: Do not rely on post-harvest drying as a primary storage solution
    for high-moisture biomass feedstocks in humid climates; the energy cost, capital
    intensity, and risk of rewetting make it an insufficient mitigation — feedstock
    diversification is a more robust and bankable approach.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: concept/feasibility
  proponent_type: technology vendor
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Licella moved away from drying as a primary mitigation strategy
    and instead adopted a mixed feedstock model to avoid the need for long-term bagasse
    storage.
  transferability: moderate
  delay_magnitude: null
  technology_domain: bioenergy
  source_pages: &id003
  - 10
  - 11
  evidence_excerpt: Licella explored drying bagasse immediately after production (to
    below 25% moisture content, the threshold for microbial stability) as a potential
    solution. In theory, this would allow long-term storage by preventing microbial
    activity. However, drying is both energy and capital intensive, particularly in
    humid climates. There is also the ongoing challenge of avoiding rewetting during
    storage, which was a challenge observed during Licella's own on-site trials, which
    would reinitiate microbial breakdown.
  confidence_note: null
  source_url: https://arena.gov.au/knowledge-bank/licella-project-swift-lessons-learnt-report/
