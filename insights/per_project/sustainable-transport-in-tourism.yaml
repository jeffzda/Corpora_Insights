- record_id: ARENA-DLV-61203
  source_title: Tropic Wings Lessons Learnt Report 1 – Towards Sustainable Transport
    in Tourism
  publish_date: 2024-10
  project_name: Towards Sustainable Transport in Tourism (Tropic Wings Electric Bus
    Project)
  what_happened: At Rainforestation, Ergon Energy initially provided positive feedback
    about a software-export-limited battery energy storage system during the feasibility
    stage. After the project parties proceeded with procurement, civil works, and
    electrical works based on that feedback, Ergon Energy changed its position upon
    formal connection application in the second half of 2024, requiring an additional
    grid impact study quoted at $25,000 and delaying BESS installation until mid-2025.
  lesson_learnt: Do not assume that locally available DNSP hardware or third-party
    service providers can be used to accelerate grid connection — DNSPs may refuse
    both options, and there is currently no regulatory mechanism to compel prioritisation.
    Project timelines must account for DNSP internal resourcing constraints.
  issue_severity: major
