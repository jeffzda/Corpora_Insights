  what_happened: All 12 electric buses performed well in real-world tourism operations
    across the Cairns region, meeting or exceeding range and usability expectations
    even before full charging infrastructure was deployed. Positive feedback was received
    from both drivers (comfort, quietness, car-like handling) and customers. Buses
    regularly operated routes up to 350 km per day.
  lesson_learnt: Electric buses are viable today for tourism and regional operations
    — any bus regularly travelling up to 350 km per day is a candidate for electrification
    with current technology. Operators should strategically deploy electric buses
    on high-visibility routes to build driver and customer confidence and demonstrate
    the technology's benefits.
