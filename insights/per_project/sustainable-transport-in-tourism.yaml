- record_id: ARENA-DLV-61210
  source_title: Tropic Wings Lessons Learnt Report 1 – Towards Sustainable Transport
    in Tourism
  publish_date: 2024-10
  project_name: Towards Sustainable Transport in Tourism (Tropic Wings Electric Bus
    Project)
  what_happened: All 12 electric buses were delivered on schedule, but the full charging
    infrastructure was not yet deployed. Tropic Wings successfully operated a fleet
    of 13 electric buses (including the pre-existing 2019 bus) using only 4 x 22 kW
    chargers as interim infrastructure, managing utilisation through manual scheduling
    and daytime top-up charging.
  lesson_learnt: Develop a transitionary operational plan before electric buses arrive
    in case charging infrastructure deployment lags — low-power 22 kW chargers can
    serve as interim infrastructure and, with active scheduling, can support meaningful
    fleet utilisation while higher-power infrastructure is awaited.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: fleet/logistics operator
  delay_category: no material delay stated
  failure_mode: no major failure stated
  outcome_class: partial success
  secondary_failure_mode: null
  intervention_note: Buses were topped up during the day whenever possible, with priority
    given to vehicles with longer scheduled journeys or lower state of charge; up
    to 4 buses were left on overnight charge without switching.
  transferability: broad
  delay_magnitude: null
  technology_domain: EV
  source_pages: &id006
  - 21
  evidence_excerpt: At present, the fleet of 13 electric buses (including the existing
    2019 electric bus) is primarily being charged using 4 x 22 kW chargers... Tropic
    Wings has been impressed with the relatively high utilisation of the bus fleet
    that has been possible, despite the lack of infrastructure... Low-power 22 kW
    chargers can be important for redundancy and providing base-level infrastructure
