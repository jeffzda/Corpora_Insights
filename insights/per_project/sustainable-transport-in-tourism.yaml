  publish_date: 2024-10
  project_name: Towards Sustainable Transport in Tourism (Tropic Wings Electric Bus
    Project)
  what_happened: Tropic Wings lacked in-house electrical engineering expertise at
    the outset of the project, which limited their ability to effectively plan, scope,
    and budget the electrical infrastructure component of the EV fleet deployment
    and to engage meaningfully with the grid connection process.
  lesson_learnt: Fleet operators transitioning to electric buses should develop or
    recruit in-house electrical engineering expertise before commencing the project
    — even where external contractors carry out the work, in-house capability is essential
    for understanding requirements, validating contractor proposals, and managing
    the grid connection process effectively.
