  source_title: Tropic Wings Lessons Learnt Report 1 – Towards Sustainable Transport
    in Tourism
  publish_date: 2024-10
  project_name: Towards Sustainable Transport in Tourism (Tropic Wings Electric Bus
    Project)
  what_happened: New charging infrastructure from the same supplier as an existing
    on-site charger was assumed to meet the same Australian certification standards
    as the older unit. This assumption proved incorrect — the new chargers required
    a separate compliance process, delaying energisation of the Tropic Wings Depot
    charging infrastructure until approximately October 2024.
  lesson_learnt: Do not assume that new equipment from the same OEM as previously
    certified equipment will automatically meet current Australian certification requirements
    — verify local compliance status for each procurement separately and build time
    for the certification process into the project schedule.
