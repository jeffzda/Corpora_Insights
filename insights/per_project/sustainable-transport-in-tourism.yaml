  publish_date: 2024-10
  project_name: Towards Sustainable Transport in Tourism (Tropic Wings Electric Bus
    Project)
  what_happened: During the feasibility planning stage, insufficient site visits were
    conducted, resulting in the planned location of electrical infrastructure at the
    Tropic Wings Depot obstructing traffic flow. This required replanning of infrastructure
    placement with associated financial and timeline implications.
  lesson_learnt: Do not substitute desktop studies for physical site visits during
    feasibility planning — walking contractors through the site early to identify
    practical constraints such as traffic flow can avoid costly replanning of electrical
    infrastructure placement later in the project.
