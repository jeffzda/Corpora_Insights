- record_id: ARENA-DLV-61205
  source_title: Tropic Wings Lessons Learnt Report 1 – Towards Sustainable Transport
    in Tourism
  publish_date: 2024-10
  project_name: Towards Sustainable Transport in Tourism (Tropic Wings Electric Bus
    Project)
  what_happened: Construction costs for the electrical infrastructure component of
    the project exceeded the feasibility-stage estimates by approximately 10%, and
    grid connection challenges consumed the contingency budget more rapidly than expected,
    though the project remained within its original planned contingency overall.
  lesson_learnt: Budget a contingency of up to 20% specifically for charging infrastructure
    costs when deploying electric bus fleets — scope creep in electrical infrastructure
    is common and grid connection challenges are a key driver of cost overruns that
    can rapidly exhaust standard contingencies.
