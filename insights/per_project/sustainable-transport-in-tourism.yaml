  delay_category: grid connection/system studies
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: coordination & stakeholders
  intervention_note: Project parties managed fleet operations using 4 x 22 kW low-power
    chargers as interim infrastructure while awaiting full grid connection, and proactively
    completed civil works ahead of DNSP scheduling.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: EV
