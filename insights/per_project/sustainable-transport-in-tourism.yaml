  publish_date: 2024-10
  project_name: Towards Sustainable Transport in Tourism (Tropic Wings Electric Bus
    Project)
  what_happened: The absence of public heavy-vehicle charging infrastructure along
    routes north of Port Douglas and south toward Townsville limited the confidence
    of Tropic Wings operators to push buses toward their range limits on longer-distance
    routes, constraining the operational scope of the electric fleet.
  lesson_learnt: The lack of publicly accessible heavy-vehicle charging infrastructure
    is a binding constraint on the operational range of private electric bus fleets
    — operators and governments should plan for public charging points on key corridors
    to provide redundancy and extend viable operating distances beyond depot range.
