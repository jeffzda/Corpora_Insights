  what_happened: The BESS supplier selected for both the Tropic Wings Depot and Rainforestation
    sites went into receivership during the project, requiring a new procurement process
    to find a replacement supplier. This compounded existing delays from grid connection
    challenges and pushed BESS installation at Rainforestation out to mid-2025.
