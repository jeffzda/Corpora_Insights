- record_id: ARENA-DLV-20728
  source_title: Demand Response Short Notice RERT Trial Year 3 Report
  publish_date: 2021-10
  project_name: DR SN RERT Trial — Intercast & Forge industrial self-DR
  what_happened: Intercast & Forge, a South Australian foundry, consistently exceeded its 10 MW contracted DR capacity throughout the trial by curtailing its own furnaces and operational equipment, supported
    by an internally developed written standard operating procedure, an email-based personnel notification system, and an on-site electricity monitoring system.
  lesson_learnt: Single large industrial operators with flexible process loads (such as foundries) can be highly reliable DR providers without aggregation intermediaries, provided they develop formal internal
    procedures, train all relevant personnel, and install real-time consumption monitoring to validate and manage curtailment; these capability investments are low-cost relative to the DR value delivered.
