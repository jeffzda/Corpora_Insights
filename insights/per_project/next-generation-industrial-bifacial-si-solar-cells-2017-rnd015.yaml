- record_id: ARENA-DLV-48115
  source_title: ARENA-Funded Cutting Edge Research in Photovoltaics
  publish_date: 2019-09
  project_name: Next Generation Industrial Bifacial Si Solar Cells (2017/RND015)
  what_happened: The bifacial Si solar cell project adopted a stage-gate project management approach to manage a highly complex multi-tiered technology development programme. The researcher noted this as
    a noteworthy feature contributing to the project's methodological rigour and progress, with multiple parallel technology streams (ONO stack, LPCVD poly-Si contacts, laser doping) being evaluated and
    prioritised through the process.
  lesson_learnt: For multi-technology R&D projects with several parallel innovation streams, a stage-gate project management approach provides structured decision points to prioritise the most promising
    pathways and avoid resource diffusion — this is particularly valuable when the project encompasses multiple novel technologies each requiring separate optimisation.
