- record_id: ARENA-DLV-19757
  source_title: High Efficiency Silicon Solar Cell Technology Final Report
  publish_date: 2021-12
  project_name: Development and Commercialisation of High Efficiency Silicon Solar
    Cell Technology
  what_happened: The project developed and validated multiple complementary LeTID
    mitigation strategies — including modifying firing temperatures, adjusting hydrogen
    content in surface films, applying pre-contact-firing annealing, and post-fabrication
    stabilisation using elevated temperature and high-intensity light — and demonstrated
    that combining these strategies substantially enhanced cell stability, reducing
    post-production degradation from 5–6% relative to 1–1.5% relative.
  lesson_learnt: 'LeTID mitigation is most effective when multiple complementary process
    controls are combined: reducing peak firing temperature, lowering hydrogen in
    surface films, and applying post-production stabilisation (elevated temperature
    and high-intensity illumination) together deliver substantially greater stability
    improvements than any single intervention, and manufacturers should adopt multi-layered
    process controls rather than relying on a single mitigation step.'
  issue_severity: none
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: Post-production stabilisation using a dedicated inline hydrogenation
    step reduced LeTID degradation in PERC cells from 5–6% relative (untreated) to
    1–1.5% relative after 900 hours of standard light soaking.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
