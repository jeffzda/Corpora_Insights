  what_happened: The laser ablation process developed to replace photolithography
    introduced silicon damage that degraded device performance, creating an unplanned
    dependency on the project's hydrogen passivation technology to repair that damage
    before cell performance targets could be met.
  lesson_learnt: When adopting a low-cost processing substitute (e.g. laser ablation
    in place of photolithography), validate that any process-induced damage can be
    reliably repaired within the same process flow — and ensure the repair step is
    stable under all expected field operating conditions before committing the approach
    to manufacture.
