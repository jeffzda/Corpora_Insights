- record_id: ARENA-DLV-19755
  source_title: High Efficiency Silicon Solar Cell Technology Final Report
  publish_date: 2021-12
  project_name: Development and Commercialisation of High Efficiency Silicon Solar
    Cell Technology
  what_happened: The project identified that hydrogen-related surface degradation
    at the front surface of PERC cells takes very long timescales to manifest under
    standard conditions — longer than those used in existing LeTID testing protocols
    — meaning this failure mode would not be caught by standard qualification tests
    currently used in industry.
  lesson_learnt: Standard LeTID qualification tests are insufficient to capture hydrogen-related
    surface degradation mechanisms; future testing standards and cell qualification
    protocols should include long-duration or accelerated surface-specific tests,
    particularly as cell architectures trend toward higher emitter sheet resistance,
    monocrystalline material, and surface oxide layers — all factors that increase
    susceptibility.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The project developed accelerated surface degradation testing
    using high-intensity laser illumination at elevated temperatures, and identified
    the conditions under which surface failure is most likely to occur so manufacturers
    can design cell processes to avoid it.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id005
  - 15
  - 19
  evidence_excerpt: A failure at the front surface of PERC solar cells, related to
    a build-up of excess hydrogen in the near-surface region. This failure mode takes
    a very long time to occur, which has implications for the design of testing methods.
    The likelihood of this failure is greater with (1) higher emitter sheet resistance
    values (which is a predicted trend for future cells), (2) mono-crystalline silicon
    material (which has achieved market share of 80% in 2021), (3) when surface oxide
    layers are present (which are commonly used to achieve higher efficiency).
