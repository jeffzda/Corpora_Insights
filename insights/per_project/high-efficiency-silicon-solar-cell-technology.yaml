- record_id: ARENA-DLV-19754
  source_title: High Efficiency Silicon Solar Cell Technology Final Report
  publish_date: 2021-12
  project_name: Development and Commercialisation of High Efficiency Silicon Solar
    Cell Technology
  what_happened: Standard industry testing for LeTID at the project outset required
    approximately 1,000 hours under 1-sun illumination at 75°C, making research cycles
    impractically slow and inline production monitoring impossible. The project developed
    accelerated testing techniques using high-intensity light and elevated temperature
    that reduced testing time from hundreds of hours to seconds — a factor of more
    than one million times acceleration.
  lesson_learnt: Research programmes targeting light-induced degradation in solar
    cells should invest early in developing accelerated testing tools — standard 1,000-hour
    test cycles create a fundamental bottleneck to research cycle time and inline
    monitoring; accelerated techniques validated against standard conditions can compress
    this to seconds without inducing different failure modes.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: data/validation/testing
  failure_mode: data & measurement
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: The project developed laser-based high-intensity illumination
    at elevated temperatures (up to ~50 suns at 130°C) and dark annealing processes
    that accelerated LeTID formation and recovery by over one million times, validated
    against standard test conditions using defect kinetics modelling.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id004
  - 19
  - 20
  - 21
  - 22
  evidence_excerpt: The project found that using standard test conditions, it would
    take 100 to 1000 hours for LeTID failure and >1000 hours for hydrogen-related
    surface failure to occur. These time scales are too long to be applied to inline
    production monitoring and slow down the time to create experimental results. The
    project found that it can be accelerated more than 1 million times by increasing
    both the light intensity (or by increasing the amount of current applied to the
    solar cell) and increasing the testing temperature.
