  what_happened: The project identified that LeTID is not exclusively caused by light
    exposure but can be induced in the dark via thermally generated charge carriers
    or with an applied electrical bias, broadening the conditions under which the
    defect can form and undermining assumptions about field conditions required to
    trigger the failure mode.
  lesson_learnt: Solar cell reliability testing programmes should not assume that
    LeTID is strictly a light-activated phenomenon — testing protocols should include
    dark annealing and current-injection conditions to fully characterise LeTID susceptibility,
    particularly for cells intended for applications with non-standard illumination
    profiles.
