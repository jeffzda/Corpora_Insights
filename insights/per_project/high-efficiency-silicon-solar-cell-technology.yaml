- record_id: ARENA-DLV-19751
  source_title: High Efficiency Silicon Solar Cell Technology Final Report
  publish_date: 2021-12
  project_name: Development and Commercialisation of High Efficiency Silicon Solar
    Cell Technology
  what_happened: LeTID (Light and Elevated Temperature Induced Degradation) was identified
    as a major barrier to commercialisation of PERC solar cells at project outset,
    causing efficiency reductions of up to 10–16% relative. The initial project assumption
    was that advanced hydrogenation processes developed in Phase 1 would cure LeTID,
    but fundamental studies revealed hydrogen was in fact the root cause of the problem,
    not the solution.
  lesson_learnt: Do not assume that a technique effective for one failure mode (B-O
    LID) will transfer to a related but distinct failure mode (LeTID) — fundamental
    studies are required to establish root cause before mitigation strategies are
    finalised, as the initial design assumption that hydrogen would cure LeTID was
    incorrect and required a full reorientation of the project.
  issue_severity: major
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The project redirected to fundamental studies of hydrogen behaviour
    in silicon, ultimately identifying the mechanism and developing processing solutions
    and novel post-fabrication mitigation techniques that resolved LeTID for industry.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id001
