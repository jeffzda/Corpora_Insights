  what_happened: Carbonate molten salts identified as the best candidate for high-temperature
    stability were found to be highly corrosive to metal alloys, presenting major
    materials containment challenges that would need to be resolved before any practical
    deployment.
  lesson_learnt: Materials compatibility with high-temperature molten salts must be
    resolved as a prerequisite before selecting them as a storage medium — corrosion
    of containment alloys by carbonate salts represents a fundamental barrier that
    cannot be deferred to detailed design.
