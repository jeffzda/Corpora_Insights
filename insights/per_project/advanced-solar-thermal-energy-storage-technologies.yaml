- record_id: ARENA-DLV-49706
  source_title: Development of Advanced Solar Thermal Energy Storage Technologies
    for Integration with Energy-intensive Industrial Processes and Electricity Generation
    - Final Report
  publish_date: 2014-08
  project_name: Development of Advanced Solar Thermal Energy Storage Technologies
  what_happened: Investigations into molten salt formulations found that conventional
    nitrate salts and tertiary/quaternary nitrate modifications could not achieve
    stability above 600°C, and carbonate alternatives had melting points of approximately
    400°C that would make them impractical as heat transfer fluids.
  lesson_learnt: Projects targeting thermal storage above 600°C should not plan to
    use molten salt heat transfer fluids without first resolving the fundamental trade-off
    between thermal stability and low melting point — no current salt formulation
    resolves this, and gas/solid systems represent the more viable near-term pathway.
  issue_severity: moderate
  project_type: storage
