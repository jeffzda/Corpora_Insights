  project_name: Development of Advanced Solar Thermal Energy Storage Technologies
  what_happened: The storage vessel's poor thermal performance meant gas leaving the
    vessel was below the 200–250°C inlet temperature required by the solar receiver/absorber,
    forcing the team to use a natural gas-fired preheater to supplement heating and
    severely limiting solar receiver performance.
  lesson_learnt: Subsystem interdependencies in solar thermal loops must be explicitly
    designed for worst-case thermal degradation — the storage vessel's underperformance
    cascaded directly into the receiver/absorber, meaning a backup gas heater was
    required to sustain operations.
