  publish_date: 2014-08
  project_name: Development of Advanced Solar Thermal Energy Storage Technologies
  what_happened: Alumina balls as the packed-bed thermal storage medium performed
    well, showing no evidence of attrition under repeated thermal cycling, and the
    CO2/alumina system was confirmed as a viable combination for high-temperature
    thermal energy storage.
  lesson_learnt: High-density alumina balls are a robust and effective solid storage
    medium for high-temperature packed-bed thermal storage systems — no attrition
    was observed under repeated charge/discharge cycles, confirming their suitability
    for scale-up.
