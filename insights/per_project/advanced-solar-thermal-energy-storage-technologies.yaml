- record_id: ARENA-DLV-49702
  source_title: Development of Advanced Solar Thermal Energy Storage Technologies
    for Integration with Energy-intensive Industrial Processes and Electricity Generation
    - Final Report
  publish_date: 2014-08
  project_name: Development of Advanced Solar Thermal Energy Storage Technologies
  what_happened: Non-uniform gas flow channelling through the central region of the
    storage vessel was observed, caused by an inadequate bottom gas distributor design,
    resulting in cold regions and radial heat conduction losses that degraded the
    thermocline profile.
  lesson_learnt: Gas distributor design in packed-bed thermal storage vessels must
    be validated computationally (e.g. via CFD) before build — the distributor intended
    to ensure even flow proved ineffective at scale and created non-uniform temperature
    profiles that compounded heat losses.
