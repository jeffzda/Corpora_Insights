- record_id: ARENA-DLV-49714
  source_title: Development of Advanced Solar Thermal Energy Storage Technologies
    for Integration with Energy-intensive Industrial Processes and Electricity Generation
    - Final Report
  publish_date: 2014-08
  project_name: Development of Advanced Solar Thermal Energy Storage Technologies
  what_happened: The unsteady-state operating conditions inherent in solar-based systems
    — large insolation variation throughout the day combined with regular thermal
    cycling from charge/discharge — imposed design constraints on piping and vessels
    that substantially exceeded those typical of steady-state industrial plant design.
  lesson_learnt: Solar thermal projects must not benchmark mechanical design timelines
    and costs against conventional steady-state process plant — the cyclic thermal
    loading requires additional engineering effort (finite element analysis, custom
    supports, all-welded construction) that should be budgeted explicitly at project
    initiation.
  issue_severity: major
  project_type: storage
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: Finite element analysis was used extensively to develop pipe
    support designs tolerating thermal expansion without heat loss; this approach
    should be included as a standard work package in future project plans.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar thermal
  source_pages: &id014
  - 16
  evidence_excerpt: The unsteady state conditions inherent in solar based systems
    where there can be large variation in insolation throughout the day, together
    with the regular cycling temperatures associated with charge/discharge cycles
    used in this project, pose great limitations on the mechanical design of pipework
    and vessels... In planning future projects greater allowance needs to be made
    for the time and costs involved in sourcing and developing the knowledge and skills
    to overcoming some of the design problems associated with projects that are at
    the cutting edge of technology.
