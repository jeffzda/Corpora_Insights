- record_id: ARENA-DLV-49708
  source_title: Development of Advanced Solar Thermal Energy Storage Technologies
    for Integration with Energy-intensive Industrial Processes and Electricity Generation
    - Final Report
  publish_date: 2014-08
  project_name: Development of Advanced Solar Thermal Energy Storage Technologies
  what_happened: The mechanical design and construction of high-temperature, high-pressure
    gas piping with thermal cycling was substantially more complex than anticipated,
    requiring extensive finite element analysis, custom pipe support designs, fully
    welded (no flanged) connections with X-ray inspection, and use of special high-temperature
    alloys.
  lesson_learnt: Projects handling gases at high temperatures and pressures with thermal
    cycling must allocate significantly more time and budget for mechanical design
    — thermal expansion management, elimination of flanged joints, weld procedure
    development, and sourcing of special alloys and fittings all involve long lead
    times and are difficult to parallelise.
  issue_severity: major
