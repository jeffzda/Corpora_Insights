  publish_date: 2014-08
  project_name: Development of Advanced Solar Thermal Energy Storage Technologies
  what_happened: The thermal storage vessel suffered significant heat losses, particularly
    from the top dome where temperatures were highest, preventing the system from
    being operated over charge/discharge cycles from one day to the next.
  lesson_learnt: Thermal insulation of storage vessel domed sections is the critical
    performance bottleneck in high-temperature packed-bed storage systems — future
    designs must prioritise insulation of top and bottom domes and use CFD modelling
    to identify heat loss pathways before construction.
