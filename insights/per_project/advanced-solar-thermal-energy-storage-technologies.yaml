  what_happened: The solar receiver/absorber required construction from a special
    high-temperature alloy due to the poor heat transfer characteristics of low-density
    gas compared to liquid heat transfer fluids, and because high-temperature, high-pressure
    CO2 is highly corrosive to many common metal alloys.
  lesson_learnt: When designing gas-based solar receivers operating above 700°C, the
    combination of poor gas-phase heat transfer and CO2 corrosivity at pressure requires
    early selection of specialist alloys — standard materials are inadequate and late-stage
    material substitution drives significant cost and schedule impact.
