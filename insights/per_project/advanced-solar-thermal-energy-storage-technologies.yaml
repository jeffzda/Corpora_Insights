  what_happened: Instrumentation of the storage vessel with up to 20 thermocouples
    proved insufficient to characterise temperature distribution and gas flow paths
    through the 5-metre packed bed, leaving significant uncertainties about internal
    vessel behaviour.
  lesson_learnt: Dense instrumentation is insufficient on its own to characterise
    internal conditions in large packed-bed storage vessels — future projects should
    couple physical instrumentation with CFD modelling to resolve temperature distribution
    and flow path uncertainties before drawing performance conclusions.
