- record_id: ARENA-DLV-50012
  source_title: Ocean Energy Report by Seanergy and Ernst and Young
  publish_date: 2016-06
  project_name: Ocean Energy Technologies — Scale Threshold for LCOE Viability
  what_happened: Carnegie Wave Energy assessed that a minimum wave farm size of 10 MW is required to bring the LCOE down to competitive levels and to amortise associated costs such as plant and power cable
    installation. Below this threshold, per-unit costs of shared infrastructure prevent commercial competitiveness.
  lesson_learnt: Ocean wave energy project developers should plan for a minimum array size of approximately 10 MW to achieve LCOE levels that are commercially competitive; single-device or sub-scale deployments
    should be framed as technology demonstrations rather than commercial projects, and business cases should not extrapolate economics from sub-scale installations.
