- record_id: ARENA-DLV-37206
  source_title: openCEM Knowledge Sharing Report
  publish_date: 2023-02
  project_name: openCEM – Open Source Grid Integration Model for the National Electricity
    Market
  what_happened: Post-launch user feedback revealed a gap between openCEM's automatic
    transmission upgrade feature and the real-world planning and regulatory constraints
    governing NEM transmission upgrades, with the model not observing lead times and
    regulatory factors that affect generator investment decisions.
  lesson_learnt: NEM capacity expansion models must incorporate planning and regulatory
    lead-time constraints on transmission upgrades — automatic least-cost transmission
    upgrade logic without these constraints produces results that diverge from real-world
    investment timelines and misleads users about achievable generator decisions.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Developed and released a 'manual transmission upgrade' feature
    allowing users to disable automatic upgrades for a user-defined horizon and prescribe
    specific transmission projects to be incorporated.
  transferability: moderate
  delay_magnitude: null
  technology_domain: grid/system stability
  source_pages: &id006
  - 8
  - 9
  evidence_excerpt: openCEM did not observe planning and regulatory factors that impact
    the lead time to deliver upgrades, and this in turn may affect generator decisions.
    Therefore, the team has developed and released a 'manual transmission upgrade'
    feature that allow users to disable automatic transmission upgrades for a user-defined
    horizon and prescribe specific transmission projects that need to be incorporated
    into the mix.
  confidence_note: lifecycle_phase assigned as operations because the gap was discovered
    post-launch during user engagement, not during development.
