- record_id: ARENA-DLV-37203
  source_title: openCEM Knowledge Sharing Report
  publish_date: 2023-02
  project_name: openCEM – Open Source Grid Integration Model for the National Electricity
    Market
  what_happened: ITP's original approach of treating coal generators with the same
    flexibility as other technologies produced impractical ramp rates, requiring the
    addition of linearised unit commitment constraints for fossil fuel generators
    mid-development.
  lesson_learnt: Energy system models that include fossil fuel generators must implement
    unit commitment constraints (ramp rates, minimum load, minimum up times) from
    the outset — treating coal generators with the same flexibility as renewables
    produces physically unrealistic results and requires disruptive rework.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: internal governance/resourcing
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Added linearised unit commitment constraints for fossil fuel
    generators on the recommendation of NREL, incorporating ramp rates, minimum load
    and minimum up times to emulate unit commitment in each planning zone.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: grid/system stability
  source_pages: &id003
  - 7
  evidence_excerpt: ITP's original idea of treating coal generators with the same
    flexibility as other technologies resulted in impractical ramp rates for those
    generators. We therefore adding linearised unit commitment constraints for some
    fossil fuel generators in order to more realistically represent ramp rates and
    flexibility. This decision has been made on the recommendation from NREL based
    on their extensive experience of simulating fossil fuel generators in the US.
