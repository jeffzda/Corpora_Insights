- record_id: ARENA-DLV-37201
  source_title: openCEM Knowledge Sharing Report
  publish_date: 2023-02
  project_name: openCEM – Open Source Grid Integration Model for the National Electricity
    Market
  what_happened: The scale of simultaneously modelling capacity and dispatch decisions
    for the entire NEM with detailed storage treatment proved larger than ITP originally
    anticipated, requiring a change in optimisation methodology from the original
    approach to Linear Programming.
  lesson_learnt: When scoping open-source energy system models for NEM-scale capacity
    expansion, anticipate that simultaneous treatment of capacity, dispatch and storage
    across all regions will exceed initial complexity estimates — plan for Linear
    Programming or equivalent scalable methods from the outset rather than discovering
    the need mid-development.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: internal governance/resourcing
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Adopted Linear Programming as the optimisation method, which
    is well-suited to the scale of the problem despite being relatively simplistic
    in its treatment of physical NEM behaviour.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: grid/system stability
  source_pages: &id001
  - 7
  evidence_excerpt: Modelling capacity and dispatch decisions for the entire National
    Electricity Market simultaneously, taking into consideration a detailed treatment
    of storage, was larger scale problem than ITP originally anticipated. Combined
    with the aim to keep the model entirely open source, led us to use Linear Programming
    as the method to perform the optimisation.
