  source_title: openCEM Knowledge Sharing Report
  publish_date: 2023-02
  project_name: openCEM – Open Source Grid Integration Model for the National Electricity
    Market
  what_happened: During development it became evident that without the ability to
    model transmission upgrades, openCEM would not produce results comparable to other
    publicly available modelling efforts such as the AEMO ISP, requiring a significant
    addition to the model scope.
  lesson_learnt: Energy system models intended to be comparable to industry-standard
    tools (e.g. AEMO ISP) must include transmission upgrade modelling from the design
    stage — retrofitting transmission capability after initial build requires substantial
    scope expansion and risks producing non-comparable results in the interim.
