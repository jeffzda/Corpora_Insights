  what_happened: During a period when only AEMO NTNDP data was available and ISP data
    had not yet been released, the team experienced difficulty integrating data because
    the two sources organised records differently and the openCEM data structure was
    still being defined.
  lesson_learnt: When developing energy models dependent on external data sources,
    define and lock the internal data structure before ingesting source data — mixing
    data sources with different record organisation during a period of undefined internal
    structure causes integration difficulty that resolves only once the data structure
    matures.
