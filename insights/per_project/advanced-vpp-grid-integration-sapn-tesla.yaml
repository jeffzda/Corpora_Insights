  evidence_excerpt: The total export capacity of the VPP could be increased from 5 MW to 6-8 MW during solar hours, thereby increasing the amount of network capacity available to system-level markets. SAPN
    were successfully able to override forecasted export limits for planned maintenance or unplanned outages. SAPN and Tesla developed an API (based on IEEE 2030.5) to transmit data over the internet, such
    as registration, operational data, and the dynamic export limits.
