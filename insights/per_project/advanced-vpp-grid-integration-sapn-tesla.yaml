- record_id: ARENA-DLV-50561
  source_title: DEIP Market Integration Trials Summary Report 1.0
  publish_date: 2022-09
  project_name: Advanced VPP Grid Integration (SAPN–Tesla)
  what_happened: The Advanced VPP Grid Integration trial between SA Power Networks and Tesla demonstrated that dynamic export limits could increase total VPP export capacity from 5 MW to 6–8 MW during solar
    hours, that SAPN could successfully override forecasted export limits for planned and unplanned outages, and that an API based on IEEE 2030.5 was effective for transmitting dynamic export limits and
    operational data.
  lesson_learnt: Implementing site-level dynamic export limits via a standardised API (such as IEEE 2030.5/CSIP-AUS) can materially increase aggregate VPP capacity available to system-level markets; include
    an operational override capability in the API design from the outset to handle maintenance and outage events.
