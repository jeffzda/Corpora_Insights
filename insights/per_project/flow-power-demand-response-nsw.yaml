  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Flow Power materially over-recruited customers as a direct response
    to initial underperformance, successfully delivering 24.9 MW of DR reserve against
    an initial target of 15 MW by the end of Year 2.
  transferability: moderate
