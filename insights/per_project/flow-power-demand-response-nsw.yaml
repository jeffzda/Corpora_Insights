- record_id: ARENA-DLV-42325
  source_title: Evaluation of ARENA's 2017-2020 Demand Response Portfolio
  publish_date: 2021-06
  project_name: Flow Power Demand Response (NSW)
  what_happened: Flow Power's initial contracted C&I portfolio was expected to yield
    6 MW in the first test but delivered only 1.5 MW; the second test yielded 3.6
    MW against an expected 9 MW. Underperformance was linked to weather conditions
    and altered production schedules at customer sites, and Flow Power responded by
    significantly over-subscribing the customer portfolio.
  lesson_learnt: C&I demand response portfolios are highly sensitive to customer operating
    conditions at the time of dispatch — build in a significant over-subscription
    buffer (Flow Power ultimately over-subscribed to deliver 24.9 MW against a 15
    MW target by Year 2) and establish clear protocols for weather-dependent or production-variable
    customer sites.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: government/public-sector body
  delay_category: data/validation/testing
