- record_id: ARENA-DLV-42326
  source_title: Evaluation of ARENA's 2017-2020 Demand Response Portfolio
  publish_date: 2021-06
  project_name: Flow Power Demand Response (NSW)
  what_happened: Flow Power's kWatch intelligent controller went through two design
    iterations during the trial that materially improved performance, and control
    software was standardised as a direct result of the ARENA-funded trial — demonstrating
    that funding at operational scale accelerates hardware and software maturation.
  lesson_learnt: Allocate funding for iterative hardware and software refinement within
    DR trials — Flow Power's two controller design iterations and software standardisation,
    enabled by the trial, produced a mature product that became the standard platform
    for their ongoing DR operations.
