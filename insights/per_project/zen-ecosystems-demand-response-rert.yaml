- record_id: ARENA-DLV-53892
  source_title: Demand Flexibility Portfolio Retrospective Analysis Report
  publish_date: 2023-07
  project_name: Zen Ecosystems Demand Response (RERT)
  what_happened: Zen Ecosystems used an alternative direct-control technology for
    air-conditioning (infrared signals via internet, self-installable) that could
    circumvent the AS-4755 adapter requirements, but could not evaluate the quantum
    of demand response because the company lacked access to participants' NMI data
    as a non-retailer without MSATS access.
  lesson_learnt: Non-retailer demand flexibility providers face structural barriers
    to evaluating demand response outcomes due to restricted NMI and MSATS access;
    technology innovators using non-standard control approaches should negotiate data
    access arrangements — or partner with a licensed retailer — before designing evaluation
    methodologies that depend on interval meter data.
