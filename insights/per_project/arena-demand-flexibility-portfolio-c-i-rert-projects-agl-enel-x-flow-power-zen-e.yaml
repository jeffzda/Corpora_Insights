  evidence_excerpt: '''AGL''s experience in the RERT program demonstrated that the
    AEMO baseline works well for flat and/or highly predictable loads, but discounts
    DR from temperature sensitive loads and intermittent or fluctuating loads, despite
    these loads being potentially valuable contributors in DR events''… Multiple demand
    flexibility providers noted they filter customers based on fit with AEMO baselines
    and turn away and do not attempt to register potential customers they expect to
    be incompatible.'
