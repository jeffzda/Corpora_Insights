- record_id: ARENA-DLV-53871
  source_title: Demand Flexibility Portfolio Retrospective Analysis Report
  publish_date: 2023-07
  project_name: ARENA Demand Flexibility Portfolio — C&I RERT Projects (AGL, Enel
    X, Flow Power, Zen Ecosystems)
  what_happened: AEMO baseline methodologies effectively excluded 80–95% of C&I loads
    from the Wholesale Demand Response mechanism because the baselines were calibrated
    for flat, predictable loads and performed poorly for temperature-sensitive, variable,
    or intermittent loads. Multiple providers reported filtering out prospective customers
    they expected to fail the baseline test before attempting registration.
  lesson_learnt: AEMO baseline methodologies are a fundamental barrier to WDR market
    growth; aggregators should not structure business cases around broad C&I market
    penetration until new baseline methodologies accommodating variable and temperature-sensitive
    loads are adopted. Advocacy for baseline reform should be treated as a strategic
    priority alongside customer recruitment.
