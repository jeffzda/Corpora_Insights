- record_id: ARENA-DLV-25922
  source_title: Review of ARENA's Reliability Portfolio
  publish_date: 2020-01
  project_name: ARENA Reliability Portfolio — Large Scale Coordination and Battery
    Integration
  what_happened: Across the portfolio, large-scale battery storage and large-scale
    coordination projects identified that meeting connection requirements specified
    by DNSPs — including modelling system security impacts in the context of multiple
    simultaneous new connections — was a significant and recurring barrier, made worse
    by information asymmetry between new projects and existing network operators.
  lesson_learnt: Grid connection modelling for new large-scale generation and storage
    projects is materially complicated by the lack of publicly available information
    about other projects also seeking connection; ARENA-funded projects should be
    designed to generate and share grid impact modelling data, and ARENA should advocate
    for rule changes requiring connection information transparency.
