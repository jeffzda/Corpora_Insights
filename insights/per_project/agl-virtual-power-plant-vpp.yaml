- record_id: ARENA-DLV-58811
  source_title: 'DER Customer Insights: The Customer Journey'
  publish_date: 2020-07
  project_name: AGL Virtual Power Plant (VPP)
  what_happened: AGL's VPP trial found that approximately one-eighth of energy storage
    systems experienced high grid voltages that caused disconnection from the grid,
    rendering them unavailable within the AGL fleet during periods of high grid voltage.
  lesson_learnt: When deploying residential battery VPPs at scale, account for grid
    voltage exceedances as a recurring operational constraint — high voltages driven
    by low demand and high solar generation can render a material fraction of fleet
    assets unavailable, undermining dispatch reliability.
