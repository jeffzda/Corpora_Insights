- record_id: ARENA-DLV-72279
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects - First Edition Results'
  publish_date: '2015'
  project_name: Photovoltaic Systems Interconnected onto Secondary Network Distribution Systems (Project ID 231)
  what_happened: NREL studied six successful large rooftop PV installations (676kW to 300kW) on US secondary network distribution systems and found that with appropriate design — including minimum import
    relays, reverse power relays, dynamically controlled inverters, or appropriately sized systems — PV systems can be interconnected without causing operational problems or network protector trips.
  lesson_learnt: 'Large rooftop PV installations on secondary network distribution systems are feasible without adversely affecting network reliability, provided one of four design methods is employed:
    keeping PV output below minimum daytime load, installing import/reverse power relays, using dynamically controlled inverters, or connecting only small systems — specify these requirements in network
    connection standards.'
