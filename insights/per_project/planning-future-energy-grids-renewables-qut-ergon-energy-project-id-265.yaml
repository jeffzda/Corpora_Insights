- record_id: ARENA-DLV-72280
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects - First Edition Results'
  publish_date: '2015'
  project_name: 'Planning Future Energy Grids: Renewables – QUT/Ergon Energy (Project ID 265)'
  what_happened: QUT developed comprehensive network planning and modelling tools for Ergon Energy's Queensland network to accommodate increasing DER and peak load growth. The planning tool demonstrated
    significant network savings potential in case studies on both urban (Townsville) and rural SWER systems, and was incorporated into Ergon Energy's network planning frameworks.
  lesson_learnt: Network businesses should invest in advanced multi-objective planning tools that simultaneously optimise technology placement, size, and network reinforcement — embedding such tools in
    regulatory planning frameworks can yield significant network cost savings as DER penetration increases.
