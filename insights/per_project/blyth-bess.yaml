- record_id: ARENA-DLV-21603
  source_title: 'Ekistica - ARENA Grid-Forming Battery Portfolio Series: Update Report'
  publish_date: 2025-10
  project_name: Blyth BESS
  what_happened: At Blyth BESS, the third-party Power Plant Controller (PPC) from
    a different OEM to the inverter could not provide the Vref signal required for
    GFM operation, and its cycle time was insufficient for Very Fast FCAS (VFFCAS)
    market participation, requiring software, firmware, and hardware updates that
    caused additional cost and delay.
  lesson_learnt: Where a third-party PPC is used with a different inverter OEM, conduct
    detailed control hardware-in-the-loop (CHIL) testing and PSCAD benchmarking before
    finalising the control architecture to identify incompatibilities early; preferably
    use the inverter OEM's native PPC to avoid GFM integration risks.
  issue_severity: major
