- record_id: ARENA-DLV-72232
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects - First Edition Results'
  publish_date: '2014'
  project_name: Demand Management Storage Project (DMSP) - Powercor
  what_happened: Powercor (CitiPower) undertook systematic evaluation of grid energy storage across its entire network at sub-transmission, zone substation and feeder levels before selecting the deployment
    site, finding that unreliable remote feeder sections offered the best opportunity to realise multiple services simultaneously (peak shaving, voltage control, reliability improvement).
  lesson_learnt: Before deploying grid-scale storage, conduct a systematic network-wide value assessment across all voltage levels and service types — the highest-value location is where multiple services
    (capital deferral, voltage control, reliability) can be co-optimised, which may be remote feeder sections rather than more obvious substation sites.
