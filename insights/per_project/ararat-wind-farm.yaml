- record_id: ARENA-DLV-16058
  source_title: Multi-Model and Machine Learning Wind Forecast Final Report
  publish_date: '2022-02-02'
  project_name: Multi-Model and Machine Learning Wind Forecast Project (2018ARP166)
  what_happened: All forecast models — including the Refined and CP Optimised Models
    which outperformed AWEFS on average — performed poorly during periods of high
    wind speed volatility. High CP charges during these periods could significantly
    influence overall cost outcomes, and generators could not adequately optimise
    self-forecasts to account for these events.
  lesson_learnt: Self-forecast models for wind farms should be specifically stress-tested
    and calibrated for high wind speed volatility periods — these events disproportionately
    drive CP charges and represent a known limitation of current ML-based approaches
    that cannot yet be adequately compensated for through optimisation.
