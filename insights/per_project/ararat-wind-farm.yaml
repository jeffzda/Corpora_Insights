- record_id: ARENA-DLV-16053
  source_title: Multi-Model and Machine Learning Wind Forecast Final Report
  publish_date: '2022-02-02'
  project_name: Multi-Model and Machine Learning Wind Forecast Project (2018ARP166)
  what_happened: AEMO made material improvements to its AWEFS forecasting model between
    November and December 2019, causing a step-change in the baseline forecast performance.
    This shifted the Refined Model from delivering a ~38% financial saving to delivering
    a -6% financial outcome (i.e. worse than AWEFS), without any change to DNV GL's
    own model.
  lesson_learnt: Forecast providers should continuously monitor the AWEFS baseline
    and treat it as a moving target — AEMO periodically improves AWEFS, meaning a
    self-forecast model that outperforms AWEFS today may underperform it after an
    AWEFS update, requiring ongoing model recalibration.
  issue_severity: major
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: commercial & market
  intervention_note: DNV GL identified the AWEFS improvement as the cause of the step
    change and split the financial analysis into pre- and post-AWEFS improvement periods
    to correctly attribute model performance.
  transferability: moderate
  delay_magnitude: null
  technology_domain: wind
  source_pages: &id002
  - 11
  - 12
  evidence_excerpt: It should however be noted that AEMO appear to have made improvements
    to their internal forecasting models sometime between November 2019 and December
    2019, which may have contributed to the step change observed in Figure 3-2 in
    financial savings derived from the Refined model.
  confidence_note: issue_severity set to major because the AWEFS update reversed the
    financial case for the Refined Model entirely (from +38% savings to -6%), fundamentally
    changing the project's delivery outcome.
