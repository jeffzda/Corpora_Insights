- record_id: ARENA-DLV-16055
  source_title: Multi-Model and Machine Learning Wind Forecast Final Report
  publish_date: '2022-02-02'
  project_name: Multi-Model and Machine Learning Wind Forecast Project (2018ARP166)
  what_happened: The financial performance of self-forecasts in the NEM's FCAS Causer
    Pays market is dynamic and influenced by market volatility, grid health, regulatory
    changes, and the addition or removal of generators — factors entirely outside
    the control of the forecast model. Even models with stable and improving accuracy
    metrics can experience rapidly deteriorating financial outcomes due to market
    changes.
  lesson_learnt: Operators deploying self-forecasts under the NEM Causer Pays framework
    must implement ongoing monitoring of both forecast accuracy and financial performance
    — a model performing well at one point in time may rapidly cease to offer financial
    benefits due to market structure changes, requiring continuous recalibration rather
    than a set-and-forget approach.
