  source_title: Multi-Model and Machine Learning Wind Forecast Final Report
  publish_date: '2022-02-02'
  project_name: Multi-Model and Machine Learning Wind Forecast Project (2018ARP166)
  what_happened: DNV GL submitted forecasts with the suppressed flag set throughout
    the entire project, meaning the improved forecasts were never actively used by
    AEMO for dispatch. This precautionary decision was made because the lag in FCAS
    contribution factor and CP charge calculation meant financial performance could
    not be confirmed in real time.
  lesson_learnt: Before going live with self-forecasts through AEMO's MP5F API, validate
    financial outcomes offline using historical CP charge calculations — the lag between
    forecast submission and CP charge determination means live deployment can cause
    financial harm before the problem is detected.
