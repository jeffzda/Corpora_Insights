  what_happened: 'Optimising self-forecasts to reduce Causer Pays charges creates
    a potential perverse incentive: forecast providers may be motivated to submit
    strategically inaccurate forecasts that reduce their own CP liability at the expense
    of overall NEM frequency stability, which may not be in the best interests of
    the market.'
  lesson_learnt: Policymakers and AEMO should be aware that Causer Pays optimisation
    creates incentives to submit deliberately inaccurate but strategically advantageous
    forecasts — market design should consider whether the CP framework adequately
    aligns self-forecast accuracy incentives with NEM-wide frequency stability outcomes.
