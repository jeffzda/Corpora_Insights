  source_title: Multi-Model and Machine Learning Wind Forecast Final Report
  publish_date: '2022-02-02'
  project_name: Multi-Model and Machine Learning Wind Forecast Project (2018ARP166)
  what_happened: The CP Optimised Model, developed to target Causer Pays cost reduction
    directly rather than minimising MAE/RMSE, consistently outperformed AWEFS across
    the entire analysis period (April 2019 to October 2020), achieving estimated financial
    savings of 50% pre-AWEFS improvement and 55% post-AWEFS improvement, and remained
    robust to the AWEFS model update that undermined the Refined Model.
  lesson_learnt: When developing self-forecast models for financial benefit under
    the NEM's Causer Pays framework, optimise directly for Causer Pays portfolio factors
    rather than standard accuracy metrics — a CP-optimised model can deliver 50%+
    cost savings and remain resilient to changes in the AWEFS baseline that undermine
    accuracy-optimised models.
