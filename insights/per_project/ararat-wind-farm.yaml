  source_title: DNV GL Multi-Model and Machine Learning Wind Forecast Project Lessons
    Learnt 2
  publish_date: 2020-04
  project_name: DNV GL Multi-Model and Machine Learning Wind Forecast Project
  what_happened: Recovery of real-time site data from the Ararat Wind Farm proved
    persistently unreliable. The secure connection to the third-party dispatch solution
    provider was insufficiently robust, and direct access to the wind farm SCADA system
    was blocked by security restrictions and knowledge gaps, preventing alternative
    data retrieval pathways.
  lesson_learnt: Allocate dedicated resources to real-time data retrieval planning
    at the outset of any site-level forecasting project — the data acquisition environment
    is unique to each site, and extensive early engagement with all parties involved
    in data management is necessary to understand the environment and select the most
    appropriate retrieval method before deployment.
