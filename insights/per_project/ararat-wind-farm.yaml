- record_id: ARENA-DLV-16051
  source_title: Multi-Model and Machine Learning Wind Forecast Final Report
  publish_date: '2022-02-02'
  project_name: Multi-Model and Machine Learning Wind Forecast Project (2018ARP166)
  what_happened: The project found that improved forecast accuracy (lower MAE/RMSE)
    does not necessarily translate to reduced FCAS Causer Pays charges. Even when
    the Refined Model outperformed AWEFS on standard error metrics, it produced worse
    financial outcomes than AWEFS for certain periods because forecast errors can
    represent 'helpful deviations' that inadvertently balance grid frequency.
  lesson_learnt: Do not assume that improved statistical forecast accuracy automatically
    delivers financial benefits — future forecast model development should consider
    optimising directly for financial outcomes such as FCAS charge minimisation, not
    solely for error metrics like MAE or RMSE.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: DNV GL developed a supplementary CP Optimised Model specifically
    targeting Causer Pays cost reduction rather than forecast error minimisation,
    which consistently outperformed AWEFS across the entire analysis period with estimated
    financial savings of 7–79% per 28-day period.
  transferability: broad
  delay_magnitude: null
  technology_domain: wind
  source_pages:
  - 6
  - 7
  - 13
  evidence_excerpt: Results from preliminary investigations into the impact of forecast
    accuracy on FCAS charges have indicated that while improved forecast accuracy
    can lead to improved outcomes, this is not always the case. As such, improved
    self-forecasts relative to AWEFS may not necessarily always translate to lower
    FCAS charges.
