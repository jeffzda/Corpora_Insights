- record_id: ARENA-DLV-4803
  source_title: DNV GL Multi-Model and Machine Learning Wind Forecast Project Lessons
    Learnt 2
  publish_date: 2020-04
  project_name: DNV GL Multi-Model and Machine Learning Wind Forecast Project
  what_happened: Developing an accurate machine learning model for short-horizon wind
    power forecasting required extensive feature engineering, parameter tuning across
    multiple model configurations, and testing of different input data streams ranging
    from low-frequency AEMO dispatch data to high-frequency SCADA data. Sudden wind
    climate change points in production time series proved particularly difficult
    for the models to predict.
  lesson_learnt: When deploying machine learning-based wind forecasting at a new site,
    plan for multiple months of site-specific training data (ideally one year to capture
    seasonal variation), and budget for bespoke feature engineering and parameter
    tuning — generalised model frameworks from prior projects provide a useful starting
    point but cannot substitute for site-specific training and sensitivity testing.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: data/validation/testing
  failure_mode: no major failure stated
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: DNV GL iteratively tested multiple feature-engineered input streams
    and ensemble gradient boosting configurations to arrive at a deployable model,
    with further work planned to address change-point prediction.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: wind
  source_pages:
  - 3
  - 4
  - 5
  evidence_excerpt: Each new site will present unique challenges and require unique
    training of the machine learning model with bespoke settings to provide the most
    accurate result... it is envisaged that multiple months of input data are likely
    to be required, and one year of data is likely to be desirable to capture variations
    in production due to seasonality.
  confidence_note: issue_severity set to minor as the challenge was technical complexity
    rather than a failure — the model development proceeded and produced deployable
    outputs. Canonical record merged from 2 source records across 2 document(s).
