  publish_date: 2020-04
  project_name: DNV GL Multi-Model and Machine Learning Wind Forecast Project
  what_happened: Connection to the AEMO MP5F API experienced ongoing failures due
    to credential expiry and AEMO-side outages, resulting in unsuccessful forecast
    delivery during affected periods. The problem was compounded by insufficient documentation
    and complexity introduced by multiple forecast providers operating simultaneously.
  lesson_learnt: Implement proactive monitoring and automated renewal processes for
    API credentials before deploying any AEMO-integrated forecasting service — credential
    expiry and third-party outages will cause forecast delivery failures unless resilience
    processes are built in from the start. Also advocate for clearer AEMO API documentation
    and dedicated troubleshooting support, particularly in multi-provider configurations.
