- record_id: ARENA-DLV-39803
  source_title: DNV GL – Multi-Model and Machine Learning Wind Forecast Project Lessons
    Learnt 1
  publish_date: 2019-10
  project_name: DNV GL Multi-Model and Machine Learning Wind Forecast Project
  what_happened: Across both the data recovery and API connection challenges, insufficient
    resources had been allocated in the first project phase — the underestimation
    of effort affected all stakeholders including DNV GL, Ararat Wind Farm, and RES
    Australia.
  lesson_learnt: For wind forecasting projects that require real-time data integration
    and AEMO API connectivity, budget and staff resources for the setup phase should
    be explicitly sized up across all partner organisations — these activities consistently
    take more effort than anticipated and should not be treated as incidental project
    tasks.
