  source_title: Multi-Model and Machine Learning Wind Forecast Final Report
  publish_date: '2022-02-02'
  project_name: Multi-Model and Machine Learning Wind Forecast Project (2018ARP166)
  what_happened: The Refined Model, built using machine learning fed with live high-frequency
    SCADA data and multi-model NWP ensemble inputs, achieved MAE and RMSE approximately
    11.7% and 11.5% lower than AWEFS respectively across a six-month live submission
    period (May–December 2020), demonstrating that site-specific machine learning
    self-forecasts can consistently outperform the centralised AEMO forecasting system.
  lesson_learnt: Machine learning self-forecast models fed with real-time high-frequency
    site data can meaningfully outperform AEMO's centralised AWEFS on standard accuracy
    metrics — wind farm operators and forecast providers should consider site-specific
    ML models as viable inputs into the MP5F API, provided financial performance is
    validated separately.
