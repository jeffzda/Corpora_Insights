  what_happened: The steam measurement data for the P2 plant process areas was derived
    from only two weeks of sub-meter data collected after new meters were installed
    during the study, due to delays in the metering installation program. The study
    acknowledged this was a limitation and that longer measurement periods are recommended
    before finalising system design.
  lesson_learnt: Do not finalise heat pump or waste-heat-recovery system sizing based
    on short measurement periods — a minimum of several months of sub-metered data
    across seasonal and production variation is needed; if this cannot be achieved
    within the feasibility study timeline, flag it explicitly and defer final equipment
    sizing to the detailed design phase.
