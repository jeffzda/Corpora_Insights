- record_id: ARENA-DLV-18551
  source_title: George Weston Foods' Feasibility Study into Onsite Thermal Systems
    - Lessons Learnt Report 1
  publish_date: 2024-08
  project_name: DON Smallgoods – Feasibility Study into Onsite Thermal Systems
  what_happened: Analysis of the Don Castlemaine refrigeration plants revealed that
    the total heat rejected by ammonia refrigeration systems is directly comparable
    in quantity to the thermal energy generated by the site's steam boilers, representing
    a large waste heat resource currently rejected to atmosphere via air-cooled condensers.
  lesson_learnt: For food manufacturing sites with concurrent refrigeration and process
    heating loads, always compare total refrigeration heat rejection against steam/hot
    water demand before designing any new thermal system — where these are comparable
    in scale, heat pump-based waste heat recovery is likely to be economically viable
    and should be investigated as the primary decarbonisation pathway.
