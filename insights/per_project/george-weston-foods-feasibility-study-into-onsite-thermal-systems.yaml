  what_happened: The cogeneration plant on site, originally designed to produce both
    steam and hot water from exhaust heat, no longer produces steam — only hot water
    recovery is operational. The cogeneration units consumed 62% of site natural gas,
    and their partial decommissioning from baseload to backup/demand-response mode
    was already underway during the study period.
  lesson_learnt: When assessing a site's decarbonisation pathway, account for the
    planned transition of cogeneration assets — retiring baseload cogeneration releases
    thermal energy supply that must be replaced, and this transition must be sequenced
    carefully with electrification projects to avoid creating an energy supply gap.
