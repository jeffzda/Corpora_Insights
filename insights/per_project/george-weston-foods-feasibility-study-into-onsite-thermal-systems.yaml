- record_id: ARENA-DLV-18554
  source_title: George Weston Foods' Feasibility Study into Onsite Thermal Systems
    - Lessons Learnt Report 1
  publish_date: 2024-08
  project_name: DON Smallgoods – Feasibility Study into Onsite Thermal Systems
  what_happened: The Don Castlemaine site lacked personnel with end-to-end metering
    installation and commissioning competence, and budget constraints prevented full
    third-party contracting, creating a capability gap that contributed to delays
    and quality issues in the metering program.
  lesson_learnt: Industrial sites undertaking energy feasibility studies should assess
    internal metering and instrumentation capability before committing to an ambitious
    metering scope — where internal competency is low and third-party contracting
    is budget-constrained, developing an internal skills program ahead of the project
