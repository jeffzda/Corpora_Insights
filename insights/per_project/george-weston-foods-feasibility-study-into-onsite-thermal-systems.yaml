- record_id: ARENA-DLV-16802
  source_title: George Weston Foods' Feasibility Study into Onsite Thermal Systems
    - Study Report
  publish_date: 2025-08
  project_name: George Weston Foods DON KRC Castlemaine Thermal Systems Feasibility
    Study
  what_happened: The P2 plant's refrigeration system evolved organically over 40 years
    into a patchwork of two separate ammonia plants of approximately equal capacity,
    with no accurate metering of compressor power or energy flows at the time of the
    study. Refrigeration power had to be estimated using short-term current logging
    and assumed COP values, reducing the reliability of load sizing for the new design.
  lesson_learnt: Install permanent electrical power metering on refrigeration compressors
    as a priority — without it, load sizing for any upgrade or replacement plant must
    rely on approximations that introduce significant design risk and will need to
    be revisited during detailed engineering.
