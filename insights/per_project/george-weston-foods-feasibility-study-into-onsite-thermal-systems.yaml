- record_id: ARENA-DLV-16806
  source_title: George Weston Foods' Feasibility Study into Onsite Thermal Systems
    - Study Report
  publish_date: 2025-08
  project_name: George Weston Foods DON KRC Castlemaine Thermal Systems Feasibility
    Study
  what_happened: The P2 facility stores approximately 15 tonnes of ammonia across
    its refrigeration plants, with pumped liquid ammonia distributed throughout the
    production facility. This posed a significant health and safety risk given the
    facility's 1,200+ employees and proximity to a hospital. The existing design had
    ammonia distributed in evaporators, pipes, receivers, and surge drums throughout
    the plant rather than contained within a plant room.
  lesson_learnt: When designing or upgrading refrigeration systems at large food manufacturing
    sites, prioritise containment of ammonia refrigerant within the plant room by
    using secondary refrigerants (glycol, CO2) for distribution — this can reduce
    ammonia charge in occupied plant areas by up to 80% while maintaining system efficiency.
  issue_severity: major
