  what_happened: The study identified that the heat pump and waste-heat-recovery solution
    for the P2 plant is directly replicable across the meat processing and dairy industries,
    where simultaneous refrigeration and medium-temperature process heating demands
    (fermentation, washdown, pasteurisation) create comparable energy profiles. The
    relevant industrial sub-segment was estimated at ~30.7 PJ of annual energy use,
    with potential to abate 400,000 to 1 million tonnes of Scope 1 and 2 CO2e by 2030.
  lesson_learnt: Feasibility findings from a refrigeration heat recovery project at
    one food manufacturing site can be directly transferred to other sites in the
    meat processing and dairy sectors — prioritise replication across the portfolio
    by identifying sites with similar simultaneous heating and cooling profiles before
    committing to site-specific detailed engineering.
