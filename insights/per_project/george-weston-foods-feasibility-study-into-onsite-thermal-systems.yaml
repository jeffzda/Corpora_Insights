  what_happened: The space-constrained site required a multi-level steel structure
    to accommodate the new centralised refrigeration plant within the available footprint
    on the eastern side of P2, stacking six packaged plant units two high with condensers
    on the upper level. This was identified as a key challenge to consolidation, with
    crane access and construction sequencing adding complexity to the installation
    plan.
  lesson_learnt: On space-constrained industrial sites, consolidation of refrigeration
    to a centralised plant requires detailed site layout and crane access planning
    at feasibility stage — if vertical stacking structures are required, these add
    cost and construction complexity that should be captured in the capital estimate
    and construction staging plan.
