- record_id: ARENA-DLV-16805
  source_title: George Weston Foods' Feasibility Study into Onsite Thermal Systems
    - Study Report
  publish_date: 2025-08
  project_name: George Weston Foods DON KRC Castlemaine Thermal Systems Feasibility
    Study
  what_happened: The proposed electrification of P2 thermal systems (replacing steam
    with heat-pump-derived hot water) would increase site electricity demand by 15%,
    straining an already constrained electrical supply. The study found that a site
    electrical supply upgrade would likely be required, though a planned 3.5 MW solar
    installation would partially offset the additional load.
  lesson_learnt: When planning industrial heat pump projects to replace gas/steam,
    assess electrical supply capacity early — the step-change increase in site electrical
    demand from heat pump operation frequently requires DNSP engagement and supply
    upgrade works that must be sequenced with the thermal upgrade to avoid project
    delays.
