- record_id: ARENA-DLV-18556
  source_title: George Weston Foods' Feasibility Study into Onsite Thermal Systems
    - Lessons Learnt Report 1
  publish_date: 2024-08
  project_name: DON Smallgoods – Feasibility Study into Onsite Thermal Systems
  what_happened: A concurrent SCADA migration from legacy systems (Citect, Factory
    Talk) to a new platform (Ignition) was underway during the study, compounding
    the complexity of integrating new metering data points and managing tag naming
    conventions across a large volume of data points.
  lesson_learnt: When planning energy feasibility studies at industrial facilities,
    check whether major IT/OT system migrations are in progress — concurrent SCADA
    or BMS transitions significantly increase the complexity and cost of metering
    integration and data tag management, and may require the study timeline to be
    aligned with or staged around the migration.
