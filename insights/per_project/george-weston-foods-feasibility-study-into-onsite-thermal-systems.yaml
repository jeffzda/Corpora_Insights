  what_happened: The P2 refrigeration system had no sub-metering of steam use at the
    process level prior to the study. The P3 plant (newer, built 2011) had 5 steam
    sub-meters across its processes, while P2 had none despite being the larger steam
    consumer. This meant that the baseline for heat recovery design had to be established
    from scratch as part of the feasibility study, consuming study budget and time.
  lesson_learnt: Ensure process-level steam sub-metering is in place at any industrial
    facility considering heat recovery — without it, baseline characterisation becomes
    a major cost item in the feasibility study itself; facilities planning decarbonisation
    should install steam sub-metering as a precursor investment rather than embedding
    it in the feasibility scope.
