  what_happened: The feasibility study found that switching from pumped ammonia to
    glycol cooling coils in fermentation and maturation rooms may reduce cooling capacity
    in those rooms due to the latent heat advantage of ammonia evaporator coils compared
    to glycol coils of the same physical size. This risk to production capacity was
    not fully quantified during the feasibility phase.
  lesson_learnt: When converting ammonia evaporator coils to glycol coils in production
    rooms with critical process requirements (e.g. fermentation), account for the
    reduction in latent cooling capacity and engage the equipment supplier early to
    quantify production impact — this should be resolved at feasibility stage, not
    deferred to detailed design.
