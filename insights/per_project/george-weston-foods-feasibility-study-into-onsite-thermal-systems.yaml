  what_happened: The feasibility study demonstrated that integrating new sub-metering
    data with over 500 existing SCADA/BMS data points into a purpose-built energy
    monitoring platform (CoolPlanetOS) enabled comprehensive energy mapping, opportunity
    identification, and ongoing tracking — providing a data foundation that would
    not have been possible from billing data or sparse site meters alone.
  lesson_learnt: Invest in integrating existing SCADA/BMS data points into a unified
    energy analytics platform alongside new sub-meters at the start of a feasibility
    study — the marginal cost of integrating already-captured data tags is low and
    the analytical benefit is high, enabling characterisation of energy systems that
    would otherwise require costly new instrumentation.
