  what_happened: The study found that Phase Change Material (PCM) thermal storage,
    investigated as a means to dispatch megawatt-scale demand reductions for grid
    services, was uneconomic at over $1,200,000 per MWh of electrical demand shifted,
    yielding a payback period of more than 25 years. The fundamental barrier was the
    small temperature differentials (~5°C) in the glycol system, which would require
    megalitres of sensible heat storage to achieve comparable energy storage without
    PCM.
  lesson_learnt: PCM thermal storage is not economically viable for industrial refrigeration
    demand response applications at current market prices — do not include it in the
    business case for industrial heat pump or refrigeration projects; instead, focus
    on lower-cost demand flexibility strategies such as thermal mass pre-cooling and
    hot water pre-heating during solar generation periods.
