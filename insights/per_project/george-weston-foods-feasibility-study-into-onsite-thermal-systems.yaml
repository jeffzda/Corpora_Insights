  what_happened: The feasibility study found that load-shifting refrigeration demand
    using the thermal mass of the refrigerated spaces — by pre-cooling rooms during
    solar generation periods and allowing temperatures to rise within acceptable bands
    during peak grid periods — could save approximately $12,000 per annum and 30 tonnes
    of GHG without any capital investment beyond the new glycol control system.
  lesson_learnt: Centralised glycol cooling distribution with improved coil control
    enables demand flexibility at low incremental cost — building this capability
    into the refrigeration upgrade design from the outset allows industrial operators
    to shift refrigeration load to coincide with on-site solar generation and capture
    immediate operating cost savings.
