    recovery integration, plan for capital costs significantly higher than a like-for-like
    replacement — in this case, adding heat recovery, glycol distribution, and electrical
    upgrades more than doubled the estimate; however, the operating cost savings ($609k/year)
    and emissions reductions justify the additional scope when evaluated on a whole-of-life
    basis.
