- record_id: ARENA-DLV-16804
  source_title: George Weston Foods' Feasibility Study into Onsite Thermal Systems
    - Study Report
  publish_date: 2025-08
  project_name: George Weston Foods DON KRC Castlemaine Thermal Systems Feasibility
    Study
  what_happened: Steam was being used in the P2 plant to heat fermentation and maturation
    rooms and smokehouses to process temperatures of 40°C–70°C. The feasibility study
    found that hot water at 80°C could directly replace steam in these applications
    without affecting process performance, as confirmed in consultation with the equipment
    manufacturer.
  lesson_learnt: When evaluating heat recovery options for industrial decarbonisation,
    assess the temperature requirements of each process stream separately — if reclaimed
    heat can substitute steam directly (minimal disruption) versus requiring process
    redesign (costly but more efficient), the two pathways have very different business
    cases and should be evaluated distinctly.
