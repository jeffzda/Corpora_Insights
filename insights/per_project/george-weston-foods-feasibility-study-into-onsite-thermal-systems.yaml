    be converted to saturated steam and replace existing steam, existing production
    processes can be continued with minimal change and cost. Most production processes
    require heat of only 85°C however, so opportunity exists to reconsider how DON
    manufacture. This option will be more disruptive and costly but the longer-term
    gains in energy and process efficiency may provide attractive business cases.
