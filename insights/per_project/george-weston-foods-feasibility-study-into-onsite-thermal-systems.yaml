  what_happened: The proposed construction and cutover sequence was specifically designed
    to maintain production continuity throughout the installation of the new centralised
    refrigeration plant — new plant would be constructed on the eastern side of P2
    while existing plants remained operational, with individual rooms cut over from
    ammonia to glycol sequentially before decommissioning the legacy systems.
