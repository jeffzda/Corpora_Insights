  what_happened: The installation of the new hot water distribution network to replace
    distributed steam users across the P2 plant was identified as a significant proportion
    of total project cost (~20% of the $27.6m capital estimate for ammonia reduction
    and distribution changes alone), driven by the dispersed layout of steam users
    across the facility and the high-precision requirements of salami process rooms
    requiring coil replacement.
  lesson_learnt: For industrial sites with widely distributed steam users, the cost
    of new hot water distribution pipework and coil replacement is a major capital
    item that can dominate the project economics — sites with more concentrated steam
    loads will achieve better returns on heat pump investment, and this factor should
    be assessed early in feasibility to prioritise which plants to target.
