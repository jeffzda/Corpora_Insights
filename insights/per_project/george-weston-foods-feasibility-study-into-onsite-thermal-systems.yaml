- record_id: ARENA-DLV-18553
  source_title: George Weston Foods' Feasibility Study into Onsite Thermal Systems
    - Lessons Learnt Report 1
  publish_date: 2024-08
  project_name: DON Smallgoods – Feasibility Study into Onsite Thermal Systems
  what_happened: Metering and data integration at the Don Castlemaine site was significantly
    more complex, time-consuming, and costly than originally anticipated. The study
    aimed to install 14 new flow meters, 44 electrical metering points, and integrate
    approximately 500 additional SCADA data points, but execution encountered multiple
    compounding obstacles including access constraints, incomplete documentation,
    incorrectly installed existing meters, and a concurrent SCADA migration.
  lesson_learnt: Feasibility studies at large, complex industrial facilities should
    substantially increase the time, budget, and resource estimates for metering and
    data integration work — the combination of production access restrictions, outdated
    plant documentation, non-standardised legacy instrumentation, and concurrent IT/OT
    migrations can multiply the effort required far beyond initial estimates.
