  publish_date: 2024-08
  project_name: DON Smallgoods – Feasibility Study into Onsite Thermal Systems
  what_happened: During the metering and SCADA integration work, the team identified
    that a large number of additional existing data tags already present in the site
    SCADA/BMS systems could be integrated into the energy analytics platform at marginal
    incremental cost while the integration work was already underway.
  lesson_learnt: When mobilising metering or SCADA integration resources at an industrial
    site, include a scoping step to identify all existing data tags that can be incorporated
    at minimal additional cost — the marginal effort to integrate additional existing
    tags during an active integration project is low and the resulting data can generate
    significant ongoing energy management value.
