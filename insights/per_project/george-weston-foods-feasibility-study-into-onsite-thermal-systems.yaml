  publish_date: 2024-08
  project_name: DON Smallgoods – Feasibility Study into Onsite Thermal Systems
  what_happened: The metering infrastructure established for the feasibility study
    — including 380 existing data points in CoolPlanetOS and the planned integration
    of ~500 additional SCADA tags — was recognised as having enduring value beyond
    the study itself, providing ongoing energy management data rather than being a
    one-off study investment.
  lesson_learnt: Design metering plans for industrial feasibility studies to deliver
    enduring operational value — instrumentation and data integration established
    during a study can directly support continuous improvement programs and future
    energy project business cases, justifying higher upfront investment and shifting
    energy management from a project activity to business-as-usual.
