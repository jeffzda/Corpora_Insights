- record_id: ARENA-DLV-37910
  source_title: Hydrogen Communities & H2City Tool
  publish_date: 2019-06
  project_name: HyDeploy
  what_happened: The HyDeploy project found that blending hydrogen up to 20% into
    the gas network at Keele University did not require appliance conversion and did
    not present greater safety risks than natural gas, removing the primary barrier
    to community acceptance.
  lesson_learnt: Hydrogen blends up to 20% can be implemented without appliance conversion
    and without materially greater safety risk than natural gas — this removes the
    largest customer disruption and acceptance barrier in early-stage hydrogen network
    projects.
  issue_severity: none
  project_type: network/grid
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: commissioning/integration
  proponent_type: network business
  delay_category: no material delay stated
  failure_mode: no major failure stated
