- record_id: ARENA-DLV-37908
  source_title: Hydrogen Communities & H2City Tool
  publish_date: 2019-06
  project_name: HyDeploy
  what_happened: HyDeploy obtained approval from the UK Health and Safety Executive
    to blend up to 20% hydrogen into Keele University's private gas network, but this
    required an extensive safety research phase and approval was granted on a case-by-case
    basis — the existing UK network injection limit was 0.1%.
  lesson_learnt: Regulatory approval for hydrogen blending above standard limits requires
    a dedicated, evidence-intensive safety research phase and must be sought from
    the safety regulator on a case-by-case basis — plan for this approval process
    as a distinct project phase with significant lead time.
  issue_severity: moderate
  project_type: network/grid
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: approvals/contracting
  proponent_type: network business
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: null
  intervention_note: Ofgem provided £6.8 million via its network innovation competition
    fund for the Keele University trial, enabling the safety research phase that secured
    HSE approval.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages: &id001
  - 21
  evidence_excerpt: Approval was granted by the UK Health & Safety Executive to run
    a 12 month trial of blending up to 20% of Hydrogen with natural gas. The current
    limit of Hydrogen injection into the UK gas network is 0.1%... approval of blending
    limits are assessed on a case by case basis and extensive testing will be required
    to understand the safety and risk implications.
