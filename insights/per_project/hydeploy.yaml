- record_id: ARENA-DLV-37909
  source_title: Hydrogen Communities & H2City Tool
  publish_date: 2019-06
  project_name: HyDeploy
  what_happened: The HyDeploy project at Keele University installed a 0.5 MW onsite
    electrolyser, eliminating the need for long pipeline infrastructure to transport
    hydrogen to the trial site and enabling a self-contained closed-network trial.
  lesson_learnt: For small-scale or pilot hydrogen trials, locating the electrolyser
    onsite eliminates pipeline transport infrastructure costs and complexity — this
    configuration is particularly suited to closed private networks where the trial
    boundary is well defined.
