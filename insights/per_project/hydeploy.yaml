  secondary_failure_mode: null
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: hydrogen
  source_pages: &id003
  - 21
  evidence_excerpt: Blending of up to 20% does not have an impact to the end user,
    i.e. no appliance conversion is required and the risks are not greater than using
    natural gas. Therefore, there is no major barriers in gaining customer or social
    acceptance.
