  publish_date: '2023-04-30'
  project_name: Integrating Concentrating Solar Thermal Energy into the Bayer Alumina
    Process
  what_happened: The windowed SEVR configuration (Configuration 2) achieved the lowest
    LCOH of AUD27.1/GJ (7% discount rate, SM=2.5 at Pinjarra), approximately 45% lower
    than the windowless air-only configuration, and delivered a 43% solar share —
    the highest of all configurations assessed — demonstrating that window-based sealing
    substantially improves system economics despite introducing reliability and scale-up
    challenges.
  lesson_learnt: Windowed solar receiver configurations can offer significantly better
    techno-economic performance than windowless alternatives for industrial air heating
    applications; project teams should evaluate windowed designs in parallel with
    windowless designs and engage commercial suppliers of window-based receivers early,
    as this technology is closer to commercialisation than internally-developed windowless
    variants.
