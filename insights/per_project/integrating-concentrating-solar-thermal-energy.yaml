  what_happened: The assessment of solar reforming of natural gas found that while
    on-site reforming with direct hot syngas injection into the calciner offers thermodynamic
    advantages, achieving net-zero emissions via this pathway is only possible if
    the methane feedstock itself is net-zero — otherwise off-site reforming with hydrogen
    pipeline transport would be required.
  lesson_learnt: When evaluating solar gas reforming pathways for industrial decarbonisation,
    proponents must assess the carbon intensity of the methane feedstock as a prerequisite
    — a technically efficient on-site reforming configuration may not deliver net-zero
    outcomes if upstream methane emissions are not addressed, fundamentally changing
    the preferred technology configuration and infrastructure requirements.
