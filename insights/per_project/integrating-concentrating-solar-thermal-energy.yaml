    requiring the project to develop the SEVR technology from TRL-3. In the meantime,
    a commercial supplier of a solar steam receiver was identified during the project
    and a partnership established.
  lesson_learnt: Projects targeting high-temperature industrial solar heat applications
    should conduct thorough commercial technology scanning before committing to internal
    technology development — the discovery mid-project of a commercial supplier (Synhelion)
    developing windowed steam receivers indicates that technology readiness landscapes
    can change significantly during multi-year R&D projects and regular re-assessment
    of the commercial market is warranted.
