  what_happened: The scaling of the SEVR from lab scale (~5 kW) to 50 MWth demonstrated
    that the constant velocity (CV) approach was more appropriate than the constant
    residence time (CRT) approach, because CV prevents excessive particle attrition
    due to high flow velocities while maintaining appropriate aperture ratios for
    the heliostat flux map profile. The scaled design achieved outlet temperatures
    of approximately 860°C.
  lesson_learnt: When scaling vortex-based solar receivers, the constant velocity
    approach should be used rather than constant residence time to avoid particle
    erosion damage at higher scales; a structured logic-diagram scaling procedure
    that checks Reynolds and Stokes numbers, gas residence time, and flux map compatibility
    at each stage reduces the risk of design errors at scale.
