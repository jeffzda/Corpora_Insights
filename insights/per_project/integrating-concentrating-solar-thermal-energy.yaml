  what_happened: The standard ISO 806-2004 methodology for measuring loss on ignition
    (LOI) and moisture on ignition (MOI) in alumina was found to be unsuitable for
    intermediate calcination products (aluminium hydroxides such as gibbsite and boehmite)
    because holding samples at 300°C for 2 hours as required by the standard caused
    further calcination, altering the chemical composition of the samples and producing
    inaccurate LOI/MOI values.
  lesson_learnt: Standard industry test methods for calcined alumina product quality
    (such as ISO 806-2004) may not be applicable to intermediate calcination products
    or novel process conditions — researchers and project teams developing new calcination
    pathways should validate and if necessary adapt standard analytical methods for
    their specific feed materials before drawing conclusions about product quality.
