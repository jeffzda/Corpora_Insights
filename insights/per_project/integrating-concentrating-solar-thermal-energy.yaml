  source_title: Integrating Concentrating Solar Thermal Energy into the Bayer Alumina
    Process - Final Report
  publish_date: '2023-04-30'
  project_name: Integrating Concentrating Solar Thermal Energy into the Bayer Alumina
    Process
  what_happened: Thermal energy storage losses accounted for 32.6% of annual solar
    input in the reference Configuration 1b system, making it the largest single source
    of energy loss — exceeding receiver losses (20.9%) — due to the thermodynamic
    penalties of charging and discharging sensible heat storage and standby heat losses.
  lesson_learnt: For CST industrial heat supply systems using packed-bed sensible
    energy storage, storage losses are the dominant system efficiency penalty and
    should be a primary target for optimisation; control strategy for charging and
    discharging cycles should be optimised to reduce losses before finalising storage
    sizing, as the smallest cost-effective storage configuration consistently outperformed
    larger designs in this study.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Identified that SOC24=5% (minimal overnight insulation requirement)
    was the most cost-effective storage configuration and that optimisation of charging/discharging
    control strategy offers significant potential to reduce losses.
