    in a wall-to-air temperature difference of ~700°C and thermal efficiency of only
    62.7% at the highest tested air mass flow rate. Artificially increasing the heat
    transfer coefficient by 50–150% raised efficiency to only 70–75%, indicating a
    fundamental limitation of air-only operation.
