    of gamma alumina detected was substantially less than that estimated from weight-loss
    data, indicating the presence of an unidentified intermediate alumina phase during
    conversion from boehmite to gamma alumina that was not detectable by the standard
    XRD method used.
  lesson_learnt: XRD-based phase quantification of alumina calcination products may
    miss intermediate amorphous or poorly-crystalline phases — researchers characterising
    novel calcination conditions should use complementary analytical techniques (such
    as TGA, BET, and SEM) alongside XRD to avoid underestimating the degree of conversion
    and misinterpreting product phase composition.
