  what_happened: For the hot air transmission pipeline, a minimum refractory insulation
    thickness of 100 mm was required to keep heat loss below 5% for all inner gas
    temperatures (370–1100°C) over a 1 km length, while thicknesses of 300–400 mm
    were needed to minimise losses for 1–3 km pipelines. The analysis found that pipe
    surface temperature could be maintained below 90°C with adequate insulation, satisfying
    safety requirements.
  lesson_learnt: High-temperature air transmission pipelines for industrial CST systems
    require careful insulation thickness design, with 100 mm minimum for ≤1 km and
    300–400 mm for 2–3 km lengths at operating temperatures up to 1100°C; pipeline
    length is a key cost driver and should be minimised through plant layout optimisation,
    as both heat losses and insulation CAPEX scale strongly with distance.
