  what_happened: 'The net air exchange through the SEVR aperture was found to significantly
    affect outlet flow temperature: as net air ingress increased (more cold ambient
    air drawn in), outlet temperature decreased. Outlet temperature was also reduced
    by increasing inlet mass flow rate at constant heat input, due to the energy balance
    constraint.'
  lesson_learnt: For windowless solar air heaters, minimising net ambient air ingress
    through the aperture is essential for maximising outlet temperature and process
    heat quality; control systems should target the minimum suction level that prevents
    particle egress rather than maximising ventilation, and inlet mass flow rate selection
    must balance thermal efficiency against outlet temperature requirements.
