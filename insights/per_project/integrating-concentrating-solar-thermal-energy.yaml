  publish_date: '2022-03-28'
  project_name: Integrating Concentrating Solar Thermal Energy into the Bayer Alumina
    Process
  what_happened: Techno-economic assessment of CST integration into the high-temperature
    calcination process found that the cost of integrating solar heat into the industrial
    process is significant — of the same order as the cost of the heliostat field
    and tower — meaning process integration costs are as material as the solar generation
    asset itself.
  lesson_learnt: Project developers and funders should treat industrial process integration
    costs as a major cost category comparable to the solar generation asset when assessing
    CST-for-industry projects — underestimating integration costs relative to generation
    infrastructure is a systematic risk in early-stage techno-economic assessments
    for industrial decarbonisation.
