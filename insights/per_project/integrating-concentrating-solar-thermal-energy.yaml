  source_title: Integrating Concentrating Solar Thermal Energy into the Bayer Alumina
    Process - Final Report
  publish_date: '2023-04-30'
  project_name: Integrating Concentrating Solar Thermal Energy into the Bayer Alumina
    Process
  what_happened: The cost of air transmission pipelines (insulated hot-air ducting
    connecting the CST plant to the calciner) emerged as the single largest cost component
    in the CST system, accounting for approximately 32–38% of total CAPEX in the retrofit
    scenario — exceeding even the heliostat field cost — due to pipeline lengths exceeding
    1 km imposed by land availability constraints around the existing Pinjarra refinery.
  lesson_learnt: For industrial CST retrofit projects, the cost of heat integration
    infrastructure (transmission pipelines) can dominate total system cost and must
    be treated as a primary design constraint; greenfield siting of CST plant close
    to process equipment should be evaluated early, as retrofit scenarios with pipeline
    distances over 1 km risk unacceptable LCOH penalties.
