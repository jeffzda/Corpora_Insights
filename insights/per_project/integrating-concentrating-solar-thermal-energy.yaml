  what_happened: The optimal tower height for the 50 MWth SEVR at Learmonth was found
    to be 80 m with a 2.75 m aperture radius, yielding an LCOH of AUD22/GJ for the
    field/tower/receiver subsystems alone (excluding storage and pipework). Increasing
    tower height beyond 80 m caused tower cost to become dominant and increase total
    LCOH, while aperture radii greater than 3 m risked excessive particle attrition
    despite lower optical losses.
  lesson_learnt: For high-temperature CST tower systems at the 50 MWth scale, tower
    height and aperture radius optimisation significantly affects LCOH through competing
    cost and efficiency effects — a parametric optimisation across both dimensions
    should be conducted for each site and capacity, as the optimum is site-specific
    and cannot be inferred from smaller-scale analogues.
