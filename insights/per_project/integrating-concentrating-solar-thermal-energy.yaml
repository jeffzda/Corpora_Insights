  what_happened: For the SEVR at the 50 MWth scale, the solar share that achieves
    the lowest LCOH is approximately 25%, but increasing solar share to 60% can be
    achieved with only a marginal increase in LCOH over the range 25–60%; this locus
    of optimality shifts significantly with changes in CAPEX and overall system efficiency.
  lesson_learnt: CST industrial heat systems exhibit a relatively flat LCOH-vs-solar-share
    curve above the optimal solar share — project developers should not anchor on
    the minimum-LCOH solar share as the only valid design point, since higher solar
    shares (and thus greater emissions reduction) can be achieved at marginally higher
    cost; sensitivity analysis across the LCOH-solar share trade-off should be presented
    to decision-makers alongside the headline LCOH figure.
