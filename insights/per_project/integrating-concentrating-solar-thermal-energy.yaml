  what_happened: High heating rate gibbsite calcination experiments yielded a reaction
    rate constant approximately 15 times larger than low heating rate experiments,
    with activation energy approximately halved (17 kJ/mol vs ~30 kJ/mol), showing
    that flash calcination conditions in solar receivers differ fundamentally from
    the slow-heating-rate kinetics available in literature and cannot be reliably
    predicted from existing models.
  lesson_learnt: Kinetic models for alumina calcination derived from slow heating
    rate experiments are not transferable to flash calcination or solar receiver conditions
    — projects developing solar calcination processes must generate new kinetic data
    under high heating rate conditions representative of the target reactor, rather
    than relying on published literature values.
