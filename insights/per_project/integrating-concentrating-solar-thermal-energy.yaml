  what_happened: Solar syngas (methane reforming using CST) was assessed as more viable
    when the reactor is operated off-sun (indirectly heated via thermal storage) rather
    than on-sun (directly in the receiver), because heat storage is cheaper and easier
    to manage than syngas storage, and off-sun operation provides more stable reactor
    conditions. A preliminary design for a new off-sun reactor configuration was developed.
  lesson_learnt: For solar thermochemical fuel production processes, indirect off-sun
    reactor operation via thermal storage is preferable to direct on-sun operation
    — this decouples reactor stability from solar intermittency, eliminates costly
    syngas storage, and reduces operational risk; project teams should evaluate indirect
    configurations before committing to on-sun reactor designs.
