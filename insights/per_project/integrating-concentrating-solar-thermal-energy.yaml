  what_happened: For CST net-zero alumina production using solar syngas, net-zero
    operation would most plausibly require biogas as the methane source rather than
    natural gas, because CO₂ is an inevitable combustion product and CCS is not currently
    a priority for the alumina industry. However, access to sufficient biogas resources
    in Western Australia to meet alumina calciner needs would be challenging.
  lesson_learnt: Solar syngas pathways for industrial decarbonisation must include
    a credible feedstock plan — projects relying on biogas to achieve net-zero should
    assess regional biogas availability and supply chain early, as feedstock constraints
    may make the technology non-viable in specific geographies regardless of technical
    and economic performance of the solar conversion system.
