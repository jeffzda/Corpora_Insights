  what_happened: Lab-scale demonstration of the 5 kWth windowless Solar Expanding
    Vortex Receiver (SEVR) successfully proved the single-phase (air-only) windowless
    concept, but two-phase (air with particles) operation was found to be challenging
    due to particle egress that was minimised but not completely eliminated.
  lesson_learnt: When scaling up particle-based solar receivers, particle egress under
    two-phase flow conditions is a critical technical barrier that must be resolved
    before commercial deployment — aerodynamic control strategies can mitigate but
    not fully eliminate egress at lab scale, and further geometry optimisation is
    required before pilot-scale progression.
