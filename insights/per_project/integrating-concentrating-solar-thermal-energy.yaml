- record_id: ARENA-DLV-62707
  source_title: Integrating Concentrating Solar Thermal Energy into the Bayer Alumina
    Process
  publish_date: '2022-03-28'
  project_name: Integrating Concentrating Solar Thermal Energy into the Bayer Alumina
    Process
  what_happened: The CFD models developed for the lab-scale 5 kWth SEVR predicted
    relatively small temperature differences between gas and particle phases at that
    scale, but modelling indicated that temperature differentials would become significantly
    larger at industrial scale (50 MWth) due to greater radiant heat absorption and
    residence time — a finding not apparent from lab-scale data alone.
  lesson_learnt: Scale-up of solar particle receivers from lab to industrial scale
    cannot assume proportional thermal behaviour — CFD modelling should be used to
    identify scale-dependent phenomena (such as inter-phase temperature differentials)
    early in the development pathway to avoid design assumptions from lab data being
    invalidated at commercial scale.
