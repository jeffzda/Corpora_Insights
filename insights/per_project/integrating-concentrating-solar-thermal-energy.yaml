  what_happened: Solar steam systems for alumina digestion require 7–14 hours of full-load
    thermal energy storage to achieve a solar share of 29–45%, but the economics improve
    with decreasing storage size due to the high capital cost of large thermal storage,
    implying these systems must always be hybridised with backup energy sources since
    continuous production with storage alone is uneconomic.
  lesson_learnt: Industrial CST steam systems for continuous-process applications
    should be designed as hybrids from the outset — the economics of large thermal
    storage are unfavourable at current costs, and hybrid operation with natural gas,
    biogas or hydrogen backup is both more cost-effective and more operationally reliable
    than designing for full solar supply.
