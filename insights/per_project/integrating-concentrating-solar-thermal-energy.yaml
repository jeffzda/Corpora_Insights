- record_id: ARENA-DLV-62708
  source_title: Integrating Concentrating Solar Thermal Energy into the Bayer Alumina
    Process
  publish_date: '2022-03-28'
  project_name: Integrating Concentrating Solar Thermal Energy into the Bayer Alumina
    Process
  what_happened: The project demonstrated that developing an integrated suite of CST
    technologies for one industrial process in parallel — rather than sequentially
    or in isolation — enabled knowledge transfer between technology streams, synergies
    in process and techno-economic modelling, and identification of integration opportunities
    that would not have been visible in single-technology development.
  lesson_learnt: For industrial decarbonisation projects with multiple candidate solar
    integration pathways at different technology readiness levels, parallel development
    under a single program is more effective than sequential single-technology development
    — shared process models, techno-economic frameworks, and end-user knowledge transfer
    generate compounding value not achievable through isolated workstreams.
