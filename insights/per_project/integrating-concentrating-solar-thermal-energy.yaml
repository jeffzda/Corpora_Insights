- record_id: ARENA-DLV-12501
  source_title: Integrating Concentrating Solar Thermal Energy into the Bayer Alumina
    Process - Final Report
  publish_date: '2023-04-30'
  project_name: Integrating Concentrating Solar Thermal Energy into the Bayer Alumina
    Process
  what_happened: The Solar Expanding Vortex Receiver (SEVR) was advanced from TRL-3
    to TRL-4 as an air heater for alumina calcination. Lab-scale windowless demonstration
    achieved thermal efficiencies up to 70% but particle egress through the open aperture
    remained an unresolved challenge requiring active mitigation via outlet over-ventilation.
  lesson_learnt: Windowless solar receivers for high-temperature industrial air heating
    can achieve functional operation with outlet over-ventilation as a primary control
    strategy, but designers must account for the energetic and exergetic penalty of
    diluting outlet temperature — minimum suction levels should be targeted to maximise
    both outlet gas temperature and exergy rate.
  issue_severity: moderate
