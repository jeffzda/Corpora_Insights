  source_title: Integrating Concentrating Solar Thermal Energy into the Bayer Alumina
    Process - Final Report
  publish_date: '2023-04-30'
  project_name: Integrating Concentrating Solar Thermal Energy into the Bayer Alumina
    Process
  what_happened: At radiative heat fluxes above approximately 20 MW/m², particle temperatures
    in the SEVR plateaued rather than continuing to increase linearly, contrary to
    analytical model predictions. The departure was attributed to radiation-induced
    buoyancy and turbulence generation that increased convective heat transfer coefficients
    by up to a factor of 16, reducing peak particle temperatures and creating more
    uniform temperature distributions.
  lesson_learnt: Existing analytical models for particle heating in solar receivers
    are invalid above approximately 20 MW/m² flux; CFD models and experimental validation
    at target operating fluxes are essential before scale-up, as radiation-induced
    buoyancy effects can fundamentally alter predicted particle temperatures and heat
    transfer rates at the flux levels required for high-temperature industrial applications.
