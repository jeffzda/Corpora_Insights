  what_happened: 'The effect of steam on gibbsite and boehmite calcination was found
    to be complex and temperature-dependent: at low temperatures (250–400°C) high
    steam concentrations (80%) inhibit boehmite formation, while at higher temperatures
    (500–650°C) steam has a catalytic effect on conversion. This non-linear behaviour
    contradicted simpler transformation mechanisms proposed in earlier literature.'
  lesson_learnt: The influence of steam on alumina calcination chemistry is strongly
    temperature-dependent and cannot be characterised by a single mechanism across
    the full process temperature range; project teams designing hybrid CST–calcination
    systems that alter the flue gas steam concentration must conduct detailed experimental
    studies across the full temperature range of their specific process conditions,
    as literature-based models may be misleading.
