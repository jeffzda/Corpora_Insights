  what_happened: Site selection analysis found that Learmonth (WA) has approximately
    20% higher annual DNI than Pinjarra (2740 vs 2280 kWh/m²), resulting in ~20% higher
    annual energy output and ~20% lower LCOH for the same CST system configuration,
    with the windowed Configuration 1b at Learmonth achieving LCOH of AUD38.7/GJ compared
    to AUD48.1/GJ at Pinjarra.
  lesson_learnt: Solar resource quality is a primary determinant of CST economic viability
    for industrial heat supply — project proponents should conduct site screening
    based on annual DNI before finalising plant location, and where industrial facilities
    can be located at greenfield sites, sites with DNI exceeding 2500 kWh/m² (such
    as Learmonth) should be strongly preferred over lower-resource locations adjacent
    to existing plant.
