  what_happened: The solar syngas (methane reforming) levelised cost of fuel at Pinjarra
    was AUD14–18/GJ at 50 MWth scale, reducible to AUD12–15/GJ at 450 MWth scale,
    with a further 17% reduction available at Learmonth. Hydrogen from the same process
    at Learmonth with carbon capture was estimated at AUD1.8–2.7/kg, which is within
    the range of competitive green hydrogen production targets.
  lesson_learnt: Solar methane reforming for syngas or blue hydrogen production becomes
    progressively more economic at larger scales (450 MWth vs 50 MWth gives ~20% cost
    reduction) and at higher DNI sites; project proponents should design for scale
    from the outset and prioritise sites with DNI above 2500 kWh/m² — the combination
    of scale and solar resource is more impactful on economics than technology optimisation
    alone.
