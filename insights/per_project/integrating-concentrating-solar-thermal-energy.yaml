    in poor wall-to-fluid heat transfer and large temperature differentials that constrain
    efficiency; receiver designers should incorporate surface enhancement features
    (fins, rough surfaces) or switch to a particle-laden or steam-based heat transfer
    medium to achieve acceptable thermal efficiency at industrial scale.
