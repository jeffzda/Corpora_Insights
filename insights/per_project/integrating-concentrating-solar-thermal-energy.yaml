  what_happened: Steam calcination of alumina at temperatures above 650°C was found
    to produce a product with higher specific surface area and lower loss on ignition
    (LOI) than standard smelter-grade alumina (SGA), with a LOI value below 1% and
    specific surface area >75 m²/g achievable — a product quality potentially superior
    to conventional SGA — representing an unexpected positive finding with potential
    process benefits.
  lesson_learnt: Operating alumina calciners in a steam-rich atmosphere (>50% steam
    by volume) at temperatures above 650–850°C can produce a product with superior
    surface area characteristics compared to conventional dry calcination; projects
    developing solar or hydrogen-based calcination pathways should explicitly investigate
    steam-atmosphere operation as a potential co-benefit, as the product quality improvement
    may offset part of the higher energy cost.
