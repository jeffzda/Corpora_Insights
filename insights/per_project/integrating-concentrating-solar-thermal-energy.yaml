  what_happened: The project found that for the SEVR, aperture size and the magnitude
    of over-ventilation were the most significant and second-most important factors
    controlling particle egress through the open aperture, and that the mechanism
    of flow ingress (via aperture centre, axially) and egress (via aperture edge,
    tangentially) are independent, enabling them to be influenced separately.
  lesson_learnt: In windowless vortex solar receivers, particle egress control is
    best achieved by first optimising aperture geometry (primary control) and then
    applying aerodynamic suction at the outlet (secondary control); designers should
    treat flow ingress and egress as independent phenomena amenable to separate optimisation
    rather than as a single coupled problem.
