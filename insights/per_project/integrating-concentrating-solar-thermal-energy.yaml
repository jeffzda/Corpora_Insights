  what_happened: Existing RANS CFD models were found to be unable to accurately predict
    particle dispersion in complex swirling two-phase flows relevant to solar vortex
    receivers, particularly with regard to particle size effects and volumetric loading.
    A modified particle dispersion model was developed that reduced mean errors in
    particle velocity spread/decay to below 6% and particle number density spread/decay
    to below 15%.
  lesson_learnt: Standard commercial CFD RANS models should not be used without validation
    for particle-laden swirling solar receiver flows — project teams scaling up vortex-based
    solar receivers should develop and validate modified dispersion models against
    DNS or experimental data before using CFD predictions for design optimisation,
    as errors in particle distribution predictions propagate directly into thermal
    performance estimates.
