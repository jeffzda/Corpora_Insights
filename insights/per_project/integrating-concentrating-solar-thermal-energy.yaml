  source_title: Integrating Concentrating Solar Thermal Energy into the Bayer Alumina
    Process - Final Report
  publish_date: '2023-04-30'
  project_name: Integrating Concentrating Solar Thermal Energy into the Bayer Alumina
    Process
  what_happened: Techno-economic assessment of the windowless SEVR air-only configuration
    (Configuration 1a) at Pinjarra found a levelised cost of heat (LCOH) of AUD59.5/GJ
    at 7% discount rate — approximately six times the cost of natural gas (~AUD10/GJ)
    — making it uncompetitive under current conditions without significant capital
    cost reductions.
  lesson_learnt: High-temperature CST air-heating systems for industrial retrofit
    are currently uneconomic relative to natural gas without substantial CapEx reductions;
    techno-economic assessments should be conducted early and should explicitly benchmark
    against incumbent fuel costs to identify the required cost reduction pathway before
    committing to demonstration at scale.
