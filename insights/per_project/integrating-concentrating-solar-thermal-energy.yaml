  what_happened: Dense phase pneumatic conveying was found to be more exergy-efficient
    than dilute phase for transporting hot particles in the SEVR system at elevated
    temperatures (>250°C inlet solid temperature), because dilute phase requires higher
    gas velocities and mass flow rates, resulting in greater thermal energy loss to
    the conveying gas and higher heat exchanger exergy destruction.
  lesson_learnt: For CST systems requiring pneumatic conveyance of hot particles,
    dense phase conveying should be preferred over dilute phase at particle inlet
    temperatures above approximately 250°C to minimise parasitic thermal and exergetic
    losses — conveying mode selection should be included as a design variable in system-level
    energy and cost models.
