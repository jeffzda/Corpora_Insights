- record_id: ARENA-DLV-72282
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: '2015'
  project_name: PRIME PLC Evaluation – Energex (Project ID 316)
  what_happened: Energex trialled PRIME Power Line Carrier (PLC) technology as a potential
    'last mile' edge network solution for smart grid communications on its LV networks.
    Initial results found PRIME PLC performed sufficiently to merit further testing,
    but no further updates were provided, with the project's continuation dependent
    on the outcomes of the 'Power of Choice' review.
  lesson_learnt: Power line carrier communications technology can support smart grid
    data traffic on LV networks, but utilities should assess regulatory and policy
    dependencies before committing to scale-up — continuation of the Energex PRIME
    trial was blocked by an unresolved policy review, leaving the technology validated
    at pilot scale but with no clear deployment pathway.
