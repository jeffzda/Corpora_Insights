- record_id: ARENA-DLV-45511
  source_title: ARENA Insights Forum Presentation Summaries & Key Points – DER Stream
  publish_date: 2019-06
  project_name: DER Integration – General (ARENA Insights Forum DER Stream)
  what_happened: Panel discussion identified that data accessibility, capture, privacy,
    formatting, and storage represent unresolved systemic challenges across DER integration
    projects, limiting the ability of networks to manage operational conditions and
    plan investments.
  lesson_learnt: Treat data governance — including collection standards, privacy frameworks,
    and interoperable formats — as a foundational workstream in DER integration projects,
    not an afterthought; without it, increased DER penetration cannot be safely managed
    by distribution businesses.
