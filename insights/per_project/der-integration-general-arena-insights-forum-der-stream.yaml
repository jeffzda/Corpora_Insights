- record_id: ARENA-DLV-45512
  source_title: ARENA Insights Forum Presentation Summaries & Key Points – DER Stream
  publish_date: 2019-06
  project_name: DER Integration – General (ARENA Insights Forum DER Stream)
  what_happened: Customers participating in DER programs were found to be largely
    unaware of the data collection, use, and storage implications of DER technology,
    while the industry faced the additional challenge of communicating legitimate
    data concerns without triggering undue customer alarm.
  lesson_learnt: Design customer data communications carefully — inform customers
    of real data risks and opportunities without overstating unlikely scenarios, as
    both ignorance and overcommunicated fear erode trust and participation in DER
    programs.
  issue_severity: minor
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: government/public-sector body
  delay_category: null
