  source_pages: &id002
  - 4
  evidence_excerpt: A result of the limited community awareness surrounding DER technology,
    services and integration is that households are also unaware of the opportunities
    and risks involved in data collection, use, and storage. However, the industry
    needs to be savvy when communicating legitimate data concerns with customers to
    manage undue customer concern about scenarios that are unlikely to eventuate.
