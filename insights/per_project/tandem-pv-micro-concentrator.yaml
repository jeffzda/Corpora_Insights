- record_id: ARENA-DLV-32003
  source_title: Tandem PV Micro Concentrator Final Report
  publish_date: 2021-02
  project_name: Tandem PV Micro Concentrator
  what_happened: The prototype tandem module used only one acrylic micro concentrator
    (7.5 cm × 2.2 cm) over a standard large-area silicon cell (12.5 cm × 12.5 cm),
    meaning only a small fraction of the silicon cell area was illuminated. This caused
    the silicon cell efficiency to be measured at 3% — a significant underestimate
    of its real contribution in a full commercial module.
  lesson_learnt: When building prototype tandem concentrator modules, ensure the micro
    concentrator array covers the full silicon cell area, or explicitly account for
    partial-illumination bias in efficiency measurements — otherwise performance data
    will materially understate the commercial potential of the silicon bottom cell.
  issue_severity: minor
  project_type: null
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The report corrected for this in analysis, estimating a ~1% absolute
    efficiency gain for the silicon cell once its full area is covered with micro
    concentrators in a commercial module.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id002
  - 7
  evidence_excerpt: The efficiency of the silicon cell is underestimated because with
    only one acrylic micro concentrator of dimensions 7.5 cm x 2.2 cm only a small
    fraction of the standard large-area silicon cell (12.5 cm x 12.5 cm) is under
    illumination. In a commercial module, the full area of the silicon cells would
    be covered with micro concentrators so the efficiency of the silicon cell would
    be higher than in this prototype tandem module.
  confidence_note: null
