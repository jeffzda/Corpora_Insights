  what_happened: ICP/RIE was demonstrated as a viable method for forming high-quality,
    narrow vertical grooves in GaAs wafers, achieving groove widths of 13 µm and depths
    of 100 µm using a SiO2 etch mask, with good selectivity and directionality. However,
    the process had not yet been developed into a repeatable, high-throughput production
    process capable of achieving the full 250+ µm depth required.
  lesson_learnt: ICP/RIE with a SiO2 mask is a promising path to high-quality GaAs
    groove etching for SLIVER cells, but future projects must invest in process repeatability
    and throughput optimisation before the method can support commercial cell production
    — isolated lab demonstrations are insufficient proof of manufacturability.
