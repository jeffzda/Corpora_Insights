- record_id: ARENA-DLV-32004
  source_title: Tandem PV Micro Concentrator Final Report
  publish_date: 2021-02
  project_name: Tandem PV Micro Concentrator
  what_happened: The project could not determine whether GaAs wafer costs at very
    large production scales would be sufficiently low to make the GaAs/Si tandem concentrator
    system commercially competitive. This uncertainty remained unresolved at project
    close and was identified as the main impediment to commercial progression.
  lesson_learnt: Future projects developing high-efficiency III-V/Si tandem systems
    should commission independent techno-economic analysis of GaAs wafer cost trajectories
    at scale before committing to concentrator-based cost-reduction pathways — the
    viability of the entire system depends on an input cost that cannot be reliably
    estimated at lab scale.
  issue_severity: major
  project_type: null
  project_scale_band: lab/bench
  lifecycle_phase: close-out/post-project review
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
