  secondary_failure_mode: commercial & market
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id003
  - 3
  evidence_excerpt: The main impediment to progression of GaAs/Si tandem cells is
    the high cost of GaAs. A concentrator system such as the one described above substantially
    ameliorates this cost. However, it is very difficult to obtain reliable estimates
    for the cost of GaAs wafers when produced at very large scales. It will certainly
    be much lower than at present, but whether it is sufficiently low could not be
    ascertained.
  confidence_note: issue_severity rated major because this unresolved uncertainty
