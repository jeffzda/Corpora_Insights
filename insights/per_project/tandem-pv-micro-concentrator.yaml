- record_id: ARENA-DLV-32002
  source_title: Tandem PV Micro Concentrator Final Report
  publish_date: 2021-02
  project_name: Tandem PV Micro Concentrator
  what_happened: Accelerated lifetime thermal cycling testing of the tandem micro
    concentrator module (0°C to 80°C, −20°C to 80°C, and −40°C to 80°C, 30 cycles
    each) resulted in a 10% relative reduction in module efficiency, attributed to
    degradation of electrical contacts to the GaAs cell.
  lesson_learnt: Electrical contacts to GaAs cells in tandem concentrator modules
    are a reliability vulnerability under thermal cycling — contact robustness must
    be specifically engineered and tested early in module design, not treated as a
    standard packaging assumption.
