- record_id: ARENA-DLV-60455
  source_title: Tandem PV Micro Concentrator Project Results and Lessons Learnt
  publish_date: '2019-08-12'
  project_name: Tandem PV Micro Concentrator
  what_happened: Integration of the complete module identified that antireflection
    coatings were sub-optimal for concentrator operation and that the silicone gel
    bonding method was applied in excess quantities and with suboptimal refractive
    index, reducing optical coupling efficiency.
  lesson_learnt: Antireflection coating specifications and bonding gel selection (type
    and quantity) must be co-optimised for the specific optical environment of the
    concentrator module — coatings and adhesives validated on standalone cells will
    not perform equivalently when integrated into a concentrator package.
  issue_severity: moderate
  project_type: generation
  project_scale_band: lab/bench
  lifecycle_phase: commissioning/integration
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated integration
  intervention_note: Identified that antireflection coating thicknesses need to be
    re-optimised for bonded concentrator conditions and that a higher refractive index
    silicone gel should be substituted to improve optical coupling; to be addressed
    in the second project phase.
  transferability: narrow
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id009
  - 8
  evidence_excerpt: Fabrication aspects of the cell and module designs were identified
    as sub-optimal which can be addressed in future stages of the project to improve
    the efficiency of the module. Specifically, the antireflection coatings can be
    optimised for better performance in the concentrator module, the application of
    silicone gel for bonding with the GaAs cell can be improved to minimise the amount
    used and the type of silicone gel can be changed to one with a higher refractive
    index for better optical coupling.
  confidence_note: null
