- record_id: ARENA-DLV-32008
  source_title: Tandem PV Micro Concentrator Final Report
  publish_date: 2021-02
  project_name: Tandem PV Micro Concentrator
  what_happened: The tandem micro concentrator system was intentionally designed using
    non-imaging optics to achieve tolerance to tracking errors of approximately ±5°,
    enabling compatibility with low-cost single-axis trackers rather than requiring
    the highly precise and expensive dual-axis or high-accuracy trackers typically
    needed for high-concentration systems (100× and above).
  lesson_learnt: Designing concentrator PV systems around non-imaging optics at moderate
    concentration ratios (5–30×) is a viable strategy for reducing tracker cost and
    complexity — future concentrator PV projects should evaluate whether this design
    trade-off (lower concentration for greater tracking tolerance) enables a better
    commercial cost structure than high-concentration alternatives.
