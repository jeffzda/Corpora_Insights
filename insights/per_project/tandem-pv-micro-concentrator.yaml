- record_id: ARENA-DLV-32001
  source_title: Tandem PV Micro Concentrator Final Report
  publish_date: 2021-02
  project_name: Tandem PV Micro Concentrator
  what_happened: Mechanical dicing of GaAs wafers to form SLIVER grooves achieved
    a minimum pitch of ~45 µm but produced chipping on both surfaces, sidewall roughness,
    and kerf losses that limited groove width and pitch. The method was found to be
    extremely challenging to scale up or produce high-efficiency cells from.
  lesson_learnt: Dicing alone is not suitable for producing the narrow, high-quality
    GaAs Sliver grooves required for this application — ICP/RIE etching should be
    investigated as the primary groove formation method from the outset, as it demonstrated
    superior groove width (23 µm) and sidewall quality.
  issue_severity: moderate
  project_type: null
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Switched to ICP/RIE etching using a 10 µm-thick SiO2 mask, successfully
    producing grooves 100 µm deep and 23 µm wide with good selectivity and highly
    vertical walls.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages:
  - 6
