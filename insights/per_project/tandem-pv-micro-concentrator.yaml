- record_id: ARENA-DLV-60452
  source_title: Tandem PV Micro Concentrator Project Results and Lessons Learnt
  publish_date: '2019-08-12'
  project_name: Tandem PV Micro Concentrator
  what_happened: ICP/RIE etching demonstrated the ability to produce 23 µm-wide grooves
    to 100 µm depth in GaAs, but full wafer depth (250 µm) etching had not yet been
    demonstrated, and the RIE-lag effect was identified as requiring etching from
    both sides of the wafer — a process not yet tested.
  lesson_learnt: When planning GaAs Sliver groove etching via ICP/RIE, account for
    RIE-lag effects that will likely require double-sided etching to achieve full
    wafer depth — this capability must be validated before relying on the method for
    full-depth groove production.
