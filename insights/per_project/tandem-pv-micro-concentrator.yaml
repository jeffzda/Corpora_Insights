- record_id: ARENA-DLV-60453
  source_title: Tandem PV Micro Concentrator Project Results and Lessons Learnt
  publish_date: '2019-08-12'
  project_name: Tandem PV Micro Concentrator
  what_happened: The quality of the ICP/RIE etched groove sidewall had not been extensively
    characterised, leaving surface roughness parameters and required post-etch treatment
    undefined at the midpoint of the project.
  lesson_learnt: Surface roughness of etched sidewalls should be measured and etching
    parameters systematically varied early in the process development phase — leaving
    sidewall quality uncharacterised delays determination of whether additional treatment
    steps are needed before subsequent processing.
