  evidence_excerpt: there was some chipping on both surfaces and tapering of the groove
    as well as roughness on the Sliver sidewall to contend with. Adjusting parameters
    such as spindle speed and dicing cut rate reduced the amount of taper, although
    the chipping was still significant. The minimum pitch (groove + GaAs Sliver) which
    could be produced was 150 µm.
