  source_title: Tandem PV Micro Concentrator Final Report
  publish_date: 2021-02
  project_name: Tandem PV Micro Concentrator
  what_happened: The combination of non-imaging micro concentrators with commercially
    available single-axis trackers was not experimentally validated with a real commercial
    system during the project. The ideal pairing of micro concentrator design parameters
    with commercially available tracker specifications remained an open knowledge
    gap at project close.
  lesson_learnt: Future projects scaling this technology should prioritise early experimental
    integration with a commercially available single-axis tracker to determine the
    practical design trade-off between concentration ratio and tracking-error tolerance
    — this cannot be resolved through modelling alone and is a prerequisite for commercial
    viability assessment.
