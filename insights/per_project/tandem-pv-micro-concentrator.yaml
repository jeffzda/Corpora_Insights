- record_id: ARENA-DLV-32006
  source_title: Tandem PV Micro Concentrator Final Report
  publish_date: 2021-02
  project_name: Tandem PV Micro Concentrator
  what_happened: The project successfully demonstrated a fully integrated tandem PV
    micro concentrator module — bonding glass, acrylic micro concentrator, GaAs cell,
    and silicon cell into a weatherproof enclosure — achieving a measured tandem module
    efficiency of 25% and a demonstrated underlying GaAs/Si cell efficiency of 30%
    under concentration.
  lesson_learnt: Early integration testing of all sub-components as a combined package
    — rather than testing components individually in isolation — should be prioritised
    to reveal system-level fabrication issues (such as antireflection coating optimisation
    and bonding gel application) that are not apparent from component-level results
    alone.
