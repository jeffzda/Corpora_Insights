- record_id: ARENA-DLV-21606
  source_title: 'Ekistica - ARENA Grid-Forming Battery Portfolio Series: Update Report'
  publish_date: 2025-10
  project_name: Western Downs BESS (WDBESS)
  what_happened: WDBESS observed that the harmonic emissions profile changed when
    transitioning from GFL to GFM operation, potentially requiring the installation
    of a harmonic filter that was not part of the original design.
  lesson_learnt: When planning a GFL-to-GFM transition, assess harmonic emissions
    under GFM operating mode during design — do not assume the GFL harmonic profile
    will be maintained — as GFM operation can change the harmonic emissions profile
    and trigger network filter requirements.
