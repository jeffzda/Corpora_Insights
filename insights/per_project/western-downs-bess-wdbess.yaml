- record_id: ARENA-DLV-21621
  source_title: 'Ekistica - ARENA Grid-Forming Battery Portfolio Series: Update Report'
  publish_date: 2025-10
  project_name: Western Downs BESS (WDBESS)
  what_happened: WDBESS explicitly benefited from lessons learned on prior Neoen GFM
    projects (VBB and HPRX) and from knowledge sharing across third-party NEM projects,
    accelerating its development and connection process relative to the first-generation
    projects.
  lesson_learnt: Proponents with prior GFM project experience within their organisation
    gain a measurable delivery advantage — capture and institutionalise GFM project
    knowledge after each deployment; when this internal experience is absent, seek
    proactive engagement with proponents of prior NEM GFM projects through industry
    forums and ARENA knowledge sharing channels.
