- record_id: ARENA-DLV-72022
  source_title: Australian Energy Resource Assessment - Second edition, 2014
  publish_date: '2014'
  project_name: CS Energy Kogan Creek Solar Boost Project
  what_happened: The CS Energy Kogan Creek Solar Boost project was under construction at the time of the document, integrating a 44 MW linear Fresnel reflector with the existing Kogan Creek coal-fired power
    plant in Queensland — representing one of the first utility-scale hybrid solar-fossil fuel integrations in Australia.
  lesson_learnt: Solar thermal integration with existing coal plant infrastructure using linear Fresnel reflectors is a viable pathway to demonstrate concentrating solar technology at commercial scale while
    using existing turbine and grid infrastructure — hybrid solar-fossil fuel plants can reduce the capital cost and commercial risk compared to standalone greenfield CSP, and should be evaluated as a FOAK
    demonstration strategy.
