  source_title: Rottnest Island WREN Project Case Study
  publish_date: null
  project_name: Rottnest Island Water and Renewable Energy Nexus (WREN) Project
  what_happened: The dynamic resistor enabled low-load diesel generators to operate
    at a minimum loading of 5% (versus 30% on standard high-speed diesel generators),
    improving system security, power quality, and reducing diesel consumption by approximately
    5%. Without this enabling technology, higher diesel reserves would have been required,
    reducing the renewable contribution achievable.
  lesson_learnt: In off-grid hybrid systems lacking flywheels or batteries, a dynamic
    resistor (continuously variable load bank) is a cost-effective enabling technology
    that improves instantaneous renewable penetration headroom by absorbing surplus
    generation as fast-acting reserve, allowing diesel engines to run at much lower
    minimum loads and reducing curtailment.
