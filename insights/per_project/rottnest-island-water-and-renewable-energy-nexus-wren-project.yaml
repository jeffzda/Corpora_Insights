  transferability: moderate
  delay_magnitude: null
  technology_domain: hybrid systems
  source_pages: &id023
  - 4
  evidence_excerpt: The relative impact of this variability can be significantly greater
    in off-grid applications, where renewable generation can be the major source of
    supply, compared with a grid connected system... A challenge in high contribution
    hybrid projects, in particular in the absence of significant enabling technologies,
    such as flywheels or batteries, is the ability to maintain or even improve system
    stability under high levels of instantaneous renewable energy penetration. Running
    additional diesel generation, to increase the diesel reserve is the traditional
    solution, however, the challenge is to minimise the diesel reserve to maximise
    diesel savings.
