- record_id: ARENA-DLV-22166
  source_title: 'Rottnest Island Water and Renewable Energy Nexus - Final ARENA Report:
    Project Results and Lessons Learnt'
  publish_date: 2018-10
  project_name: Rottnest Island Water and Renewable Energy Nexus (WREN)
  what_happened: Desalination plants were found to be unsuitable targets for fast-acting
    DSM (minutes or sub-second) due to increasing maintenance costs from frequent
    start-stop cycles, impacts on membrane filters, and the time required to shut
    down and restart desalination trains.
  lesson_learnt: Design DSM of desalination plants for longer-duration energy shifting
    (hours) rather than fast-acting power variability response — frequent start-stop
    cycles damage membranes and increase maintenance costs, making desalination plants
    unsuitable for sub-minute demand response applications.
  issue_severity: minor
  project_type: multi-technology/hybrid
  project_scale_band: demonstration
