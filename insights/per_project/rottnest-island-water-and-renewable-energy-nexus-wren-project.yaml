- record_id: ARENA-DLV-22167
  source_title: 'Rottnest Island Water and Renewable Energy Nexus - Final ARENA Report:
    Project Results and Lessons Learnt'
  publish_date: 2018-10
  project_name: Rottnest Island Water and Renewable Energy Nexus (WREN)
  what_happened: The flexible scheduling of the desalination plant for DSM purposes
    was constrained by process control and regulatory requirements that had not been
    fully anticipated, including minimum water storage levels, maximum holding days,
    and the operational limits of individual reverse osmosis trains.
  lesson_learnt: Plan DSM flexibility requirements into desalination plant design
    from the outset — specifying independent train operation, soft start capability,
    configurable start/stop sequences, and compliance with regulatory water production
    requirements upfront significantly widens the operational window and improves
    renewable energy utilisation.
