  publish_date: null
  project_name: Rottnest Island Water and Renewable Energy Nexus (WREN) Project
  what_happened: The WREN project achieved a 45% annual renewable contribution by
    combining solar PV and wind generation with demand-side management of the desalination
    plant and a dynamic resistor, without deploying battery or flywheel storage. This
    was made possible by detailed prior operational experience from King Island and
    Flinders Island hybrid systems.
  lesson_learnt: Off-grid communities and utilities pursuing high renewable contribution
    can reach commercially meaningful renewable fractions (45%+) without battery or
    flywheel storage, provided the system design leverages existing deferrable loads
    and incorporates appropriate enabling technologies — prior operational experience
    from comparable systems is a strong predictor of successful delivery.
