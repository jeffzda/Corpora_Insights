  publish_date: 2018-10
  project_name: Rottnest Island Water and Renewable Energy Nexus (WREN)
  what_happened: SCADA upgrade works required at the desalination plant prior to enabling
    automated DSM operation took a significant amount of effort and time, attributed
    to limited documentation of the existing SCADA system and the requirement for
    autonomous desalination plant operation.
  lesson_learnt: Before committing to DSM of an existing desalination plant, undertake
    a detailed investigation of the plant's SCADA and control systems — undocumented
    legacy SCADA systems require major augmentation effort and DSM is unlikely to
    proceed where a major SCADA augmentation is required.
