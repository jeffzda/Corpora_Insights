- record_id: ARENA-DLV-22168
  source_title: 'Rottnest Island Water and Renewable Energy Nexus - Final ARENA Report:
    Project Results and Lessons Learnt'
  publish_date: 2018-10
  project_name: Rottnest Island Water and Renewable Energy Nexus (WREN)
  what_happened: As renewable penetration increased in the low-inertia off-grid system,
    the number of interacting control and protection devices — including 7 diesel
    generators, 1 wind turbine, 20 solar inverters, 7 feeders, DSM loads, dynamic
    resistors, and protection devices — required a significant level of detailed engineering
    to correctly operate under variable conditions and contingency events.
  lesson_learnt: For high-penetration off-grid renewable projects, allocate substantial
    engineering effort to coordinating all control and protection systems — the interaction
    complexity scales with the number of devices, and any single device-level protection
    function (e.g. a solar farm rapid shutdown) can destabilise the entire grid if
    not accounted for in the system controller design.
  issue_severity: moderate
  project_type: multi-technology/hybrid
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: unvalidated integration
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: A hybrid power system controller was deployed to co-ordinate
    and dispatch all generation and enabling technologies automatically, providing
    fast-acting co-ordination across the system.
  transferability: moderate
  delay_magnitude: null
  technology_domain: hybrid systems
  source_pages: &id015
  - 16
  evidence_excerpt: All generation and monitoring, control and protection systems
    must be carefully designed in order not to cause a major grid disturbance in a
    lightly loaded system with large levels of renewable generation. This, combined
    with the high quantity of controllers and need for fast acting co-ordination,
    requires a significant level of detailed engineering in order to correctly operate
    under variable system conditions and contingency events. For example on Rottnest
    Island the control system interfaced with 7 x diesel generators, 1 x wind turbines,
    20 x solar inverters, 7 x feeders, demand side management loads, dynamic resistors
    as well as a large number of protection devices on the network.
