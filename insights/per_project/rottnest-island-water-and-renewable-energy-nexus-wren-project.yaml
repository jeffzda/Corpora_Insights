  publish_date: 2018-10
  project_name: Rottnest Island Water and Renewable Energy Nexus (WREN)
  what_happened: Equipment in remote locations was found to be inoperable for significant
    periods due to lack of available resources or repair budget, as illustrated by
    the desalination train being out of service for the majority of the performance
    proving period.
  lesson_learnt: Future projects in remote areas should anticipate extended equipment
    outages as a likely occurrence and factor this into both technical and commercial
    project delivery, including putting in place a significant amount of operational
    support.
