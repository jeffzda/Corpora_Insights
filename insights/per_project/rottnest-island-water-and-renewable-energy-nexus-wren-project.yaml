  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Hydro Tasmania utilised a dynamic resistor at the powerhouse
    to manage fast-acting (<250 ms) variability, with the desalination plant reserved
    for longer-duration energy shifting.
  transferability: moderate
  delay_magnitude: null
  technology_domain: hybrid systems
