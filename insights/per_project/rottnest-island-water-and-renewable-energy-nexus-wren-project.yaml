  evidence_excerpt: The overall utilisation of renewable energy for DSM was not fully
    tested due to the desalination plant having one train out of three out of service
    for the majority of the performance proving period. The reduced plant availability
    means that the remaining desalination trains have to operate more of the time
    in order to maintain minimum water levels, significantly reducing the opportunities
    for DSM.
