  evidence_excerpt: It is not uncommon for hybrid system operators to run systems
    sub-optimally, or to disable automated features due to limited understanding of
    system operation, poor design or faulty equipment. This can significantly reduce
    diesel savings over the life of the project, and reduce business case returns.
    One typical example is the manual scheduling by operators of an extra diesel engine
    to increase reserves above that required, incurring a large increase in diesel
    fuel costs over the project life.
