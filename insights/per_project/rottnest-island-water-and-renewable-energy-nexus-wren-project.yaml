- record_id: ARENA-DLV-22169
  source_title: 'Rottnest Island Water and Renewable Energy Nexus - Final ARENA Report:
    Project Results and Lessons Learnt'
  publish_date: 2018-10
  project_name: Rottnest Island Water and Renewable Energy Nexus (WREN)
  what_happened: Solar PV equipment using daisy-chain communications network topologies
    caused loss of inverter control downstream of any point of failure, creating a
    reliability risk in the high-penetration off-grid system.
  lesson_learnt: When selecting between central and decentralised inverter architectures
    for off-grid solar farms, explicitly evaluate communications network topology
    resilience — daisy-chain topologies create single points of failure that can cause
    loss of supervisory control over multiple inverters simultaneously.
