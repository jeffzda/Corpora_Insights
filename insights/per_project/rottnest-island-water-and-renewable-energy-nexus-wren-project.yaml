  source_title: 'Rottnest Island Water and Renewable Energy Nexus - Final ARENA Report:
    Project Results and Lessons Learnt'
  publish_date: 2018-10
  project_name: Rottnest Island Water and Renewable Energy Nexus (WREN)
  what_happened: Demand side management of the desalination plant was proven effective
    in principle, but full utilisation of renewable energy through DSM was not achievable
    during the performance proving period because one of three desalination trains
    was out of service for the majority of that period.
  lesson_learnt: Conduct a comprehensive condition assessment of all equipment proposed
    for DSM before committing to demand side management of a desalination plant —
    a single train out of service significantly reduced DSM opportunities and meant
    the overall utilisation of renewable energy for DSM could not be fully tested.
  issue_severity: moderate
