- record_id: ARENA-DLV-22155
  source_title: 'Rottnest Island Water and Renewable Energy Nexus - Final ARENA Report:
    Project Results and Lessons Learnt'
  publish_date: 2018-10
  project_name: Rottnest Island Water and Renewable Energy Nexus (WREN)
  what_happened: Remote islands have limited access to specialised skills needed to
    operate and fault-find sophisticated integrated control systems from multiple
    equipment manufacturers, resulting in equipment being left inoperable or at suboptimal
    settings for extended periods.
  lesson_learnt: Establish ongoing contractual relationships between equipment suppliers
    (e.g. wind turbine manufacturers, solar inverter and controller providers) and
    system integrators to ensure specialist support remains accessible in remote locations
    — skill gaps left unaddressed can result in prolonged suboptimal operation and
    curtailed renewable output.
