  what_happened: Solar PV string inverter aggregation controllers used on the 600
    kW solar farm had difficulties providing robust supervisory control within the
    sub-second timeframes required for system stability in the high-penetration off-grid
    environment.
  lesson_learnt: Where a solar farm requires fast-acting set-point control for system
    stability in a high-penetration off-grid application, consider using a centralised
    inverter rather than aggregated string inverters — commonly available string inverter
    aggregation controllers have demonstrated difficulties in providing robust supervisory
    control within sub-second timeframes.
