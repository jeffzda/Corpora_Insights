  what_happened: The WREN project required integration of multiple existing and new
    equipment types — diesel unit controllers, feeder management systems, wind turbines,
    solar inverters, a dynamic resistor, and a desalination plant — into a single
    coordinated hybrid control system. Existing equipment was often outdated or unable
    to provide control information at the required resolution or speed.
  lesson_learnt: When upgrading a hybrid off-grid system to higher renewable penetration,
    plan for the likelihood that existing equipment controllers will be inadequate
    for the required response speed and resolution — budget for controller upgrades
    or replacement as a standard line item, not a contingency.
