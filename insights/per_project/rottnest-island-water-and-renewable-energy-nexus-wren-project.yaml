  publish_date: 2018-10
  project_name: Rottnest Island Water and Renewable Energy Nexus (WREN)
  what_happened: Contractors and equipment suppliers engaged on the WREN project were
    accustomed to designing, installing and operating equipment in large grids with
    significantly more inertia and slower control response rates, creating a knowledge
    gap regarding the specific requirements of high-penetration, low-inertia off-grid
    systems.
  lesson_learnt: Explicitly assess and specify the knowledge requirements for high-penetration
    off-grid applications when procuring contractors and equipment suppliers — experience
    in standard grid-connected projects does not transfer directly, and contractors
    may not understand the critical impact of individual device-level protection and
    control functions on a small isolated grid.
