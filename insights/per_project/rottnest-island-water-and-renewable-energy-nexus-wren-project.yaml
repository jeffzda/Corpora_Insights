- record_id: ARENA-DLV-22157
  source_title: 'Rottnest Island Water and Renewable Energy Nexus - Final ARENA Report:
    Project Results and Lessons Learnt'
  publish_date: 2018-10
  project_name: Rottnest Island Water and Renewable Energy Nexus (WREN)
  what_happened: In the low-inertia off-grid system on Rottnest Island, the wind turbine
    — the single largest generation source — intermittently shut down due to internal
    control functions (e.g. cable untwisting, automatic greasing), which had the potential
    to cause a system blackout, unlike in a large grid-connected environment where
    such an event would be unnoticeable.
  lesson_learnt: For off-grid systems where a single renewable generator is the dominant
    source, require OEM suppliers to fully document all operational shutdown triggers
    and configure shutdown ramp rates — internal turbine control functions that are
    benign in large grid-connected contexts can cause destabilising events in low-inertia
    off-grid systems.
  issue_severity: major
  project_type: multi-technology/hybrid
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: utility/energy retailer
  delay_category: commissioning/integration
  failure_mode: unvalidated integration
  outcome_class: delayed but recoverable
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Detailed performance-based specifications were developed during
    procurement and extensive commissioning and testing occurred to observe equipment
    behaviour over a wide range of operating conditions; numerous clarifications were
    sought with OEM manufacturers.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: wind
  source_pages: &id006
  - 17
  evidence_excerpt: At times internal control systems have been seen to intermittently
    shut down the wind turbine even when operating at full power. The shut downs could
    be for operational reasons such as untwisting power cables or automatic greasing
    of pitch motors. This disturbance has the potential to cause a system blackout
    in the off-grid environment, though if it occurred in a large grid connected wind
    farm in the NEM a single turbine shutting down would be unnoticeable.
  confidence_note: null
