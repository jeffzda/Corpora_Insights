- record_id: ARENA-DLV-23207
  source_title: Rottnest Island WREN Project Case Study
  publish_date: null
  project_name: Rottnest Island Water and Renewable Energy Nexus (WREN) Project
  what_happened: High instantaneous renewable penetration in off-grid systems creates
    system stability risks — particularly managing contingent events and variability
    — that are disproportionately greater than in grid-connected systems, where the
    larger grid can absorb fluctuations. Traditional mitigation (running extra diesel
    reserve) directly undermines the diesel savings that justify the project.
  lesson_learnt: Off-grid hybrid projects targeting high instantaneous renewable penetration
    (the WREN aimed for up to 95%) must include fast-acting coordinated control and
    protection systems as non-negotiable design elements — without these, the only
    fallback is running additional diesel reserve, which erodes the project's business
    case.
  issue_severity: none
  project_type: multi-technology/hybrid
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: successful demonstration
  secondary_failure_mode: null
