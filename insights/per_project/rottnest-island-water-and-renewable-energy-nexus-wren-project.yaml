- record_id: ARENA-DLV-23202
  source_title: Rottnest Island WREN Project Case Study
  publish_date: null
  project_name: Rottnest Island Water and Renewable Energy Nexus (WREN) Project
  what_happened: Operators of hybrid power systems commonly run systems sub-optimally
    or disable automated features due to limited understanding of system operation,
    poor design, or faulty equipment. A typical example cited is operators manually
    scheduling an extra diesel engine to increase reserves beyond what is required,
    substantially increasing fuel costs over the project life.
  lesson_learnt: Ensure a high level of system operator involvement in the design
    and implementation phase, and provide thorough operator training, system documentation,
    and remote performance monitoring tools — manual overrides by operators (such
    as manually scheduling extra diesel engines) can substantially erode diesel savings
    over the project life.
  issue_severity: major
  project_type: multi-technology/hybrid
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: execution & logistics
  outcome_class: partial success
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Hydro Tasmania provided WREN operators with training programs,
    real-time remote system viewing, a data historian, automated performance reporting,
    and online documentation to support optimal system operation and realise diesel
    savings targets.
  transferability: broad
  delay_magnitude: null
  technology_domain: hybrid systems
