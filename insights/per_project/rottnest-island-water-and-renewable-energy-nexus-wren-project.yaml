  what_happened: For high-penetration off-grid solar applications, developers who
    engaged EPC contractors still found it necessary to maintain detailed engineering
    input into specification, design, and commissioning — the complexity of the control
    requirements meant that EPC contracting alone was insufficient to ensure appropriate
    outcomes.
