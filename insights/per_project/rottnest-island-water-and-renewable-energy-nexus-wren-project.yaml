  what_happened: Standard off-the-shelf equipment (wind turbines, solar inverters)
    designed for on-grid installations required significant reconfiguration, firmware
    changes, controller replacement, and protection setting modifications to function
    correctly in the off-grid hybrid context. Both the wind turbine and solar farm
    required detailed engineering intervention to ensure system stability was not
    compromised.
  lesson_learnt: Hybrid system designers must have detailed operational engineering
    expertise to configure or customise control and protection systems for off-grid
    use — standard on-grid equipment cannot be deployed without site-specific modification,
    and accessing detailed engineering information from international suppliers adds
    further complexity and risk.
