- record_id: ARENA-DLV-23203
  source_title: Rottnest Island WREN Project Case Study
  publish_date: null
  project_name: Rottnest Island Water and Renewable Energy Nexus (WREN) Project
  what_happened: The WREN project demonstrated that reverse osmosis desalination —
    a large (145 kW), deferrable, interruptible load backed by 14–15 ML of potable
    water storage — could be used as a form of virtual energy storage to absorb surplus
    renewable energy, reducing diesel consumption without incurring the capital cost
    of battery storage. Modelled surplus renewable energy of ~150 MWh/year was insufficient
    to justify battery storage on cost grounds.
  lesson_learnt: Where a project has an existing large deferrable load with adequate
    process storage (e.g. desalination with water tanks), demand-side management of
    that load can substitute for capital-intensive battery storage to increase renewable
    utilisation — but this requires detailed control system integration including
    instrumentation, bypass valves, turbidity sensors and level sensing upgrades to
    the controlled load.
