  what_happened: The DMIR modelling found that for Case 3 (distribution zone on urban
    fringe requiring a new zone substation vs. a mini-grid DM solution), the DM opex
    solution delivers $18.23M net customer benefit versus $7.9M for the network capex
    solution over 30 years — the largest absolute customer benefit gap among the four
    cases — even though the network business earns a higher profit from capex ($4.67M)
    than DM (negative $3.95M without any incentive).
  lesson_learnt: Mini-grid and distributed energy solutions for new residential or
    urban fringe developments can deliver substantially greater customer net benefit
    than traditional network augmentation, but require explicit incentive design to
    make them financially viable for network businesses; new development connections
    are a high-priority application for DM incentive schemes.
