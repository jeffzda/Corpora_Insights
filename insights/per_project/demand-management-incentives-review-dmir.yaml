- record_id: ARENA-DLV-61623
  source_title: Demand Management Incentives Review
  publish_date: 2017-06
  project_name: Demand Management Incentives Review (DMIR)
  what_happened: The AEMC's 2012 Power of Choice Review estimated potential DM benefits
    of $4–12 billion over 2013/14 to 2022/23, and recommended rule changes to strengthen
    DM incentives. The subsequent rule change was adopted in 2015, giving the AER
    responsibility for creating the DMIS — a delay of approximately three years from
    identification of the gap to the regulatory instrument being established.
  lesson_learnt: Regulatory reform processes for DM incentive design are slow (3+
    years from AEMC recommendation to AER rule change); ARENA-funded DM projects should
    be designed with regulatory lag in mind and should engage proactively with AER
    DMIS consultation processes to ensure new funding mechanisms and project structures
    align with emerging regulatory frameworks.
