- record_id: ARENA-DLV-61617
  source_title: Demand Management Incentives Review
  publish_date: 2017-06
  project_name: Demand Management Incentives Review (DMIR)
  what_happened: The DM market in Australia had very little competitive depth at the
    time of the review because network businesses had minimal demand for DM services,
    meaning DM service providers had no sustained commercial basis on which to develop
    capacity. The ring-fencing guidelines meant network businesses were expected to
    contract with third-party DM providers, but without regulatory incentives to do
    so, this market demand did not materialise.
  lesson_learnt: DM market development requires demand-side signals (incentives for
    network businesses to procure) not just supply-side support (funding for DM providers);
    ARENA-funded DM projects should be designed with a pathway to sustained commercial
    demand from network businesses, and contractual arrangements with network businesses
    should not preclude DM providers from selling services to other market participants.
  issue_severity: major
  project_type: network/grid
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: null
  failure_mode: commercial & market
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: coordination & stakeholders
  intervention_note: ISF recommended network businesses be encouraged by the DMIS
    to procure DM services from a range of providers, and that contractual arrangements
    not preclude DM providers from serving other market participants (ancillary services,
    retailers, pool-price-exposed customers).
  transferability: broad
  delay_magnitude: null
  technology_domain: demand response
  source_pages: &id014
  - 36
  evidence_excerpt: At present, there is very little competition in the Australian
    network DM market as there is currently little demand from network businesses
    for these services... it is very difficult to develop an effective DM market unless
    the network is incentivised to do so.
