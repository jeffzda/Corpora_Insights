- record_id: ARENA-DLV-61615
  source_title: Demand Management Incentives Review
  publish_date: 2017-06
  project_name: Demand Management Incentives Review (DMIR)
  what_happened: Modelling across all four network constraint cases found that in
    Cases 2 and 4 (over-/under-voltage on a distribution feeder and unreliable rural
    fringe-of-grid feeder), even when net market benefits are included, the DM solution
    does not deliver net customer benefits over the network capex solution without
    a DM incentive payment — meaning DM is not cost-competitive in all network contexts.
  lesson_learnt: Not all network constraints are suitable for DM solutions; project
    developers and regulators should require network businesses to demonstrate a positive
    net customer benefit before a DM incentive payment is awarded, and the incentive
    scheme should be structured so that businesses can claim less than the stipulated
    maximum where this test cannot be met.
  issue_severity: minor
  project_type: network/grid
