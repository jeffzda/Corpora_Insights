- record_id: ARENA-DLV-61622
  source_title: Demand Management Incentives Review
  publish_date: 2017-06
  project_name: Demand Management Incentives Review (DMIR)
  what_happened: ISF recommended a DM Cost Uplift (DMCU) range of 40–90% of the cost
    of DM to the distribution network business as an alternative to a per-kW incentive
    payment. Modelling showed the medium break-even DMCU (net profit equalisation)
    averaged 90% of DM cost across the four cases, with a range of 55–141%, indicating
    high variability by constraint type.
  lesson_learnt: If a cost-uplift DM incentive is used instead of a performance-based
    payment, it must be accompanied by robust performance monitoring and a net-customer-benefit
    test, because cost-based incentives do not directly link payment to demand reduction
    achieved and could incentivise inefficient DM expenditure.
