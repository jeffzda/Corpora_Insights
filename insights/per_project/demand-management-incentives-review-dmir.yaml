- record_id: ARENA-DLV-61602
  source_title: Demand Management Incentives Review
  publish_date: 2017-06
  project_name: Demand Management Incentives Review (DMIR)
  what_happened: The effective DM opex cost recovery under current AER base-step-trend
    regulatory arrangements was found to be only approximately two-thirds of actual
    DM opex costs. In the modelled Case 1, the NPV of DM opex costs was $14.1M while
    the NPV of DM opex cost recovery was only $8.2M, a shortfall of approximately
    $5.9M.
  lesson_learnt: When structuring DM programmes for network businesses, project developers
    and regulators must account for the fact that DM opex is systematically under-recovered
    relative to capex under base-step-trend forecasting; unless this is corrected,
    network businesses face a guaranteed financial loss on DM programmes even where
    those programmes deliver superior customer outcomes.
