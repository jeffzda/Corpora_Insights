  lifecycle_phase: development/design
  proponent_type: network business
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: ISF recommended that DMIP payment be contingent on the network
    business publicly demonstrating a net benefit to customers, with businesses permitted
    to recover less than the maximum stipulated level where the incentive would outweigh
    expected net benefits.
  transferability: moderate
  delay_magnitude: null
  technology_domain: demand response
