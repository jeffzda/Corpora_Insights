- record_id: ARENA-DLV-61601
  source_title: Demand Management Incentives Review
  publish_date: 2017-06
  project_name: Demand Management Incentives Review (DMIR)
  what_happened: Modelling of four network constraint cases found that under current
    Australian regulatory settings, distribution network businesses earn higher net
    profit from network capex solutions than from DM opex solutions, even in cases
    where the DM solution delivers greater net benefit to customers. In Case 1 (30-year
    horizon), network capex generated $44.6M net profit versus $25.8M for DM opex,
    while customer net benefit was $128.3M for DM versus $92.8M for capex.
  lesson_learnt: Regulatory incentive design that treats DM opex less favourably than
    network capex creates a structural financial disincentive for network businesses
    to adopt least-cost DM solutions; correcting this requires both normalising DM
    opex cost recovery and providing an explicit DM incentive payment in the range
    $50–$100/kWpeak per year.
  issue_severity: major
  project_type: network/grid
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: concept/feasibility
  proponent_type: network business
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: commercial & market
  intervention_note: 'ISF recommended a two-pronged approach: normalising DM opex
    cost recovery in regulatory determinations and introducing a performance-based
    DM Incentive Payment (DMIP) of $50–$100/kWpeak per year contingent on demonstrated
    net customer benefit.'
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: demand response
  source_pages: &id001
  - 18
  - 19
  - 20
  - 21
  evidence_excerpt: the network capex solution is the more profitable option ($44.6
    million net profit compared to only $25.8 million net profit for the DM opex solution)...
    the net benefits for consumers from the DM opex solution are superior to the network
    capex solution in all four cases if net market benefits are included
  confidence_note: This is a modelling-based finding rather than a specific project
    event, but it represents a systemic delivery failure with quantified evidence
    directly relevant to DM project delivery.
