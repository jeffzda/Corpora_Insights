  what_happened: Consultation during the study indicated that a DMIP below approximately
    $40–50/kWpeak per year (roughly 20% of the average cost of distribution network
    services) would be unlikely to motivate network businesses to actively support
    DM, suggesting a minimum threshold below which the incentive has no practical
    effect on procurement behaviour.
