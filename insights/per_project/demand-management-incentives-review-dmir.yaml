- record_id: ARENA-DLV-61608
  source_title: Demand Management Incentives Review
  publish_date: 2017-06
  project_name: Demand Management Incentives Review (DMIR)
  what_happened: The existing DM Innovation Allowance was assessed by both the AER
    and ISF as having not been effective in encouraging an efficient level of demand
    management activity. ISF concluded the allowance may have been counterproductive
    by signalling to the market that DM is small-scale and uncommercial, and by confining
    DM research funding to network businesses only.
  lesson_learnt: Innovation funding mechanisms for DM should be structured with open
    competitive access rather than allocation solely to regulated network businesses,
    and should be accompanied by clear signals that DM is a mainstream resource; a
    mechanism restricted to incumbents and framed as 'innovation' risks marginalising
    DM rather than mainstreaming it.
