- record_id: ARENA-DLV-61604
  source_title: Demand Management Incentives Review
  publish_date: 2017-06
  project_name: Demand Management Incentives Review (DMIR)
  what_happened: Modelling across all four network constraint cases showed that when
    net market benefits (avoided transmission and generation capacity, carbon abatement,
    option value) are included, DM solutions deliver superior net benefits to customers
    in all four cases over a 30-year horizon. However, these net market benefits are
    currently inaccessible to any market participant, so they do not influence network
    business procurement decisions.
  lesson_learnt: DM project business cases should explicitly quantify net market benefits
    (avoided transmission/generation capacity, option value, carbon abatement) and
    advocate for their inclusion in regulatory assessments; failure to capture these
    benefits systematically understates the value of DM and biases procurement decisions
    toward capex.
