- record_id: ARENA-DLV-61605
  source_title: Demand Management Incentives Review
  publish_date: 2017-06
  project_name: Demand Management Incentives Review (DMIR)
  what_happened: The capex bias in network regulation — where the regulated return
    on equity may exceed the actual cost of capital — further disadvantages DM opex
    solutions relative to network capex. In Case 1, the network capex solution's return
    on equity was 4.9% versus 4.7% for DM opex, and this gap persisted across all
    four cases, meaning network businesses earn a higher financial return from capex
    even when DM delivers greater customer value.
  lesson_learnt: When evaluating DM versus capex options, project teams should test
    sensitivity to the regulated WACC assumption; if the regulated return on equity
    exceeds the actual cost of capital, the financial advantage of capex over DM is
    amplified, which should be flagged explicitly in regulatory submissions to the
    AER.
  issue_severity: moderate
  project_type: network/grid
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: development/design
  proponent_type: network business
