- record_id: ARENA-DLV-61621
  source_title: Demand Management Incentives Review
  publish_date: 2017-06
  project_name: Demand Management Incentives Review (DMIR)
  what_happened: The rise of the 'duck curve' — driven by high rooftop solar PV penetration
    — was identified as creating a new and urgent case for flexible DM. AEMO forecasts
    showed South Australian minimum operational demand could fall to zero or below
    from around 2029, while peak demand continues to rise, creating extreme ramp-rate
    challenges that make DM more valuable than it was when the NEM was designed.
  lesson_learnt: DM programme design and DMIS incentive levels should be calibrated
    to account for the growing value of flexible demand response as a complement to
    high variable renewable penetration; the value of DM in managing the 'duck curve'
    should be explicitly quantified as a net market benefit in DM investment business
    cases.
