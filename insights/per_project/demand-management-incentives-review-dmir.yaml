- record_id: ARENA-DLV-61607
  source_title: Demand Management Incentives Review
  publish_date: 2017-06
  project_name: Demand Management Incentives Review (DMIR)
  what_happened: Since the NEM was established in 1998, the absence of balanced incentives
    for DM has resulted in Australia's demand-side participation remaining at approximately
    1% of peak demand (388 MW across the NEM), compared to an average of 9% in the
    United States (over 55,000 MW). If the NEM had equivalent DM penetration to the
    US average, this would represent approximately 3,000 MW of additional capacity.
  lesson_learnt: The long-run gap between Australian and US DM penetration demonstrates
    that without explicit regulatory incentives, network businesses will systematically
    underinvest in DM regardless of its cost-effectiveness; any new DM programme or
    mechanism must address the underlying regulatory incentive structure, not just
    fund individual projects.
