  what_happened: The DMIR modelling found that with full DM cost recovery, the DM
    opex solution's net profit for the network business in Case 1 increases from $25.8M
    to $31.4M (30-year horizon), and that full cost recovery is sufficient — in conjunction
    with the regulated return on equity assumption — to make the DM opex solution
    more attractive than the network capex solution to the network business in some
    scenarios.
  lesson_learnt: Correcting DM opex cost recovery to parity with capex (without any
    additional incentive payment) can substantially close the financial gap between
    DM and capex options for network businesses; this should be the first step in
