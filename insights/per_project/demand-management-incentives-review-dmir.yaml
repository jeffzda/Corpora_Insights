  source_title: Demand Management Incentives Review
  publish_date: 2017-06
  project_name: Demand Management Incentives Review (DMIR)
  what_happened: ISF's modelling found the CESS (Capital Expenditure Savings Scheme)
    was actually the largest single factor favouring DM opex over network capex in
    the disaggregated analysis of Case 1, because it prevents the network business
    from recovering the full $300M capex from customers. This partially offsets the
    DM opex cost recovery disadvantage but is insufficient to make DM the financially
    preferred option.
  lesson_learnt: Project teams analysing the financial case for DM versus capex should
    decompose the full regulatory incentive stack (EBSS, CESS, STPIS, tax treatment,
    debt recovery, DM cost recovery) rather than relying on simple cost comparisons;
    the CESS in particular partially corrects the capex bias and should be explicitly
    modelled.
