- record_id: ARENA-DLV-61606
  source_title: Demand Management Incentives Review
  publish_date: 2017-06
  project_name: Demand Management Incentives Review (DMIR)
  what_happened: The network option value of DM — the value created by deferring capex
    during a period when demand conditions may change, potentially making the capex
    unnecessary — was found to be material but is generally excluded from regulatory
    assessments of DM. Modelling assumed a 10% probability of the network constraint
    disappearing within five years, which generated a major option value in Case 1.
  lesson_learnt: DM project business cases should explicitly model and include option
    value (the probability-weighted benefit of demand conditions changing to render
    deferred capex unnecessary); omitting option value systematically understates
    the benefit of DM relative to irreversible capex investment.
  issue_severity: moderate
  project_type: network/grid
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: development/design
  proponent_type: network business
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
