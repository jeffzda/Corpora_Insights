  what_happened: The new DMIS was scheduled to commence in July 2019 for NSW/ACT/NT,
    July 2020 for SA/Queensland/Tasmania, and January 2021 for Victoria — leaving
    a gap of two to four years during which several supply reliability events occurred,
    including the September 2016 South Australian statewide blackout, a February 2017
    blackout affecting 90,000 SA customers, and a near-miss event in NSW in March
    2017.
  lesson_learnt: When regulatory reform timelines leave a multi-year gap before new
    incentive mechanisms take effect, interim transitional measures with clearly defined
    deliverables, competitive procurement, and modest initial scale should be established
    by state governments to avoid reliability and cost consequences in the interim
    period.
