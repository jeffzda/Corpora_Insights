- record_id: ARENA-DLV-61603
  source_title: Demand Management Incentives Review
  publish_date: 2017-06
  project_name: Demand Management Incentives Review (DMIR)
  what_happened: The DM Incentives Review found that DM opex is treated as subordinate
    to network capex in AER regulatory assessments — DM can only be justified where
    it avoids or defers specific network capex, whereas capex is justified by its
    ability to improve reliability and reduce unserved energy directly. This prevents
    DM from competing on equal terms with capex solutions.
  lesson_learnt: DM programmes should be designed and justified on the basis of direct
    customer service improvements (reliability, reduced unserved energy) rather than
    solely as a substitute for specific capex; regulatory submissions for DM projects
    should explicitly quantify these service benefits to overcome the subordination
    trap.
  issue_severity: major
  project_type: network/grid
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: development/design
  proponent_type: network business
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: ISF recommended that the AER allow DM to be justified by reference
    to direct customer service improvements, not only by reference to deferred capex,
    and that network businesses develop five-year DM Plans as part of their regulatory
    proposals.
  transferability: moderate
  delay_magnitude: null
  technology_domain: demand response
  source_pages: &id003
  - 20
  evidence_excerpt: DM opex is typically only justifiable where it is shown to cost-effectively
    avoid or defer network capex. This makes DM subordinate to the higher-priority
    network capex solution, and it does not allow the two solutions to be compared
    equally, according to their ability to meet customer needs.
