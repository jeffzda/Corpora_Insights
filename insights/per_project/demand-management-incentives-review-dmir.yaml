  project_name: Demand Management Incentives Review (DMIR)
  what_happened: Cultural and organisational barriers within network businesses —
    including greater familiarity with capex solutions, greater confidence in capex
    cost recovery certainty, and an expectation that DM is only a stopgap — compound
    the regulatory incentive barriers and further reduce DM uptake beyond what regulatory
    modelling alone captures.
  lesson_learnt: DM programme designers and funders should recognise that regulatory
    incentive corrections alone are insufficient; capability-building within network
    businesses (DM planning expertise, procurement skills, confidence in DM cost recovery)
    must be explicitly supported, particularly in early regulatory periods when DM
    Plans are being established for the first time.
