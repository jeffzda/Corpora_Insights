  publish_date: 2025-05
  project_name: SunDrive Solar 20MW Pilot Facility (ARP008)
  what_happened: The project incurred approximately 15 months of timeline extensions
    and additional budget spend by project completion in May 2025. Delays were primarily
    caused by the complexity of acquiring, commissioning, and qualifying a pilot-scale
    production line in a non-purpose-built facility, compounded by underestimating
    process integration challenges of copper plating at scale.
  lesson_learnt: Deep tech industrialisation projects in non-purpose-built facilities
    require substantially more contingency in both schedule and budget than linear
    scale-up assumptions suggest — early-stage risk identification, real-time cost
    tracking, and formalised cross-functional delivery teams are critical mitigations.
