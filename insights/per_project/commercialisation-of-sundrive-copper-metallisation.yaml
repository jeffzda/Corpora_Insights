  what_happened: During commissioning, multiple overseas equipment suppliers required
    their technicians to travel to Australia for installation and commissioning support.
    Several visa applications were declined (five technicians in total), causing delays
    and requiring resubmissions. Many suppliers had never shipped or serviced equipment
    in Australia, adding significant logistical complexity.
  lesson_learnt: When commissioning pilot-scale equipment from overseas suppliers
    in Australia, begin visa applications and logistics planning well before the installation
    window — initial refusals for multiple technicians caused material commissioning
    delays that could have been anticipated and mitigated.
