  outcome_class: delayed but recoverable
  secondary_failure_mode: null
  intervention_note: Hard plastic rollers were replaced with soft thermoplastic elastomer
    rollers (sourced in consultation with the equipment supplier), which underwent
    a leaching process to remove contaminants before use.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages:
