- record_id: ARENA-DLV-39907
  source_title: SunDrive Solar - 20MW Pilot Facility Knowledge Sharing Report
  publish_date: 2025-05
  project_name: SunDrive Solar 20MW Pilot Facility (ARP008)
  what_happened: A global solar market downturn in 2024 — characterised by oversupply,
    falling module prices, and financial distress among manufacturers — disrupted
    SunDrive's supply chain, most notably causing the loss of a key precursor supplier.
    The project had been relying on a single source for this critical input.
  lesson_learnt: Single-source dependency on key consumables such as solar cell precursors
    exposes a pilot-scale project to supply chain disruption — dual-sourcing strategies
    and supply chain mapping should be conducted before production begins, not in
    response to a supplier failure.
