- record_id: ARENA-DLV-39919
  source_title: SunDrive Solar - 20MW Pilot Facility Knowledge Sharing Report
  publish_date: 2025-05
  project_name: SunDrive Solar 20MW Pilot Facility (ARP008)
  what_happened: The prior ARENA project (ARP006) had produced prototype equipment
    designed for M6 wafer formats, while the industry had rapidly shifted to M10 and
    M12 half-cut wafers. This format mismatch meant the entire process and equipment
    required substantial redesign before a scaled pilot line could be established
    under ARP008.
  lesson_learnt: Prototype equipment should be designed or adaptable to emerging industry
    wafer standards rather than current standards — designing to M6 when the industry
    was shifting to M10/M12 required substantial redesign effort at the start of the
    follow-on scale-up project.
