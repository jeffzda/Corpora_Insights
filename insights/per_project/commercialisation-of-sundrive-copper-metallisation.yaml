- record_id: ARENA-DLV-39906
  source_title: SunDrive Solar - 20MW Pilot Facility Knowledge Sharing Report
  publish_date: 2025-05
  project_name: SunDrive Solar 20MW Pilot Facility (ARP008)
  what_happened: The facility at Kurnell was a non-purpose-built warehouse that lacked
    sufficient infrastructure for industrial manufacturing, including adequate power,
    compressed air, ultra-pure water, and waste treatment capacity. Certain high-capacity
    equipment could not operate at full capacity due to power supply constraints.
  lesson_learnt: A detailed utility and services assessment — covering power, compressed
    dry air, water, and waste treatment — should be completed before signing a lease
    on a non-purpose-built facility for pilot-scale manufacturing; infrastructure
    gaps discovered after fit-out caused process instability, delays, and limited
    equipment operating capacity.
