- record_id: ARENA-DLV-39905
  source_title: SunDrive Solar - 20MW Pilot Facility Knowledge Sharing Report
  publish_date: 2025-05
  project_name: SunDrive Solar 20MW Pilot Facility (ARP008)
  what_happened: During the MS3A demonstration run, process QC yield was only 43.9%
    despite a mechanical yield of 90.5%. Root causes included cell contact peeling
    caused by acid vapour-induced corrosion of electrical connections on plating tool
    anodes, and solution ingress caused by the cell carrier plate design.
  lesson_learnt: Plating tool anodes and carrier plates in electroplating environments
    must be designed and specified with corrosion resistance and solution ingress
    prevention as primary criteria — acid vapour-induced anode corrosion and carrier
    ingress caused QC yield to fall to 43.9%, requiring significant redesign before
    the next milestone.
  issue_severity: major
  project_type: manufacturing/supply chain
  project_scale_band: pilot
  lifecycle_phase: commissioning/integration
  proponent_type: technology vendor
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: delayed but recoverable
  secondary_failure_mode: null
  intervention_note: Corroded electrical connections on plating tool anodes were rectified
    and the cell carrier plate was redesigned to reduce breakages and solution ingress;
    between MS3A and MS3B overall yield increased by 68.8%.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
