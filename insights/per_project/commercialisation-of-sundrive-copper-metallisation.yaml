- record_id: ARENA-DLV-39903
  source_title: SunDrive Solar - 20MW Pilot Facility Knowledge Sharing Report
  publish_date: 2025-05
  project_name: SunDrive Solar 20MW Pilot Facility (ARP008)
  what_happened: During commissioning of the pilot-scale resist treatment tool, wafer
    breakage rates exceeded 50% during loading and unloading. The root cause was a
    misalignment between the timing of the precursor handling system and the conveyor
    belt motion — a delay in pressure release combined with premature belt movement
    generated a shear force that fractured wafers.
  lesson_learnt: Mechanical wafer handling timing between vacuum release and conveyor
    engagement must be explicitly validated during commissioning of resist treatment
    tools — a small timing misalignment caused >50% breakage rates that were only
    resolved by precise timing adjustment.
