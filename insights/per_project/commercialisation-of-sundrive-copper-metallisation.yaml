- record_id: ARENA-DLV-39909
  source_title: SunDrive Solar - 20MW Pilot Facility Knowledge Sharing Report
  publish_date: 2025-05
  project_name: SunDrive Solar 20MW Pilot Facility (ARP008)
  what_happened: Scaling SunDrive's lab-scale copper plating process to a 20MW pilot
    environment introduced complex, non-linear interactions between variables such
    as flow rates, reaction times, and equipment capabilities. Early assumptions of
