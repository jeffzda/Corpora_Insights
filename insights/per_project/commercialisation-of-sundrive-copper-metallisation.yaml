- record_id: ARENA-DLV-39920
  source_title: SunDrive Solar - 20MW Pilot Facility Knowledge Sharing Report
  publish_date: 2025-05
  project_name: SunDrive Solar 20MW Pilot Facility (ARP008)
  what_happened: SunDrive successfully demonstrated small-scale replica lab tools
    as a technique for debugging and optimising the pilot-scale production line processes.
    Running rapid experiments on small-scale tools with low labour input allowed iterative
    process tuning that would have been impractical on the large-scale pilot tool
    due to long turnaround times.
  lesson_learnt: Building small-scale replica tools that replicate pilot-line conditions
    enables rapid, low-cost process experimentation and significantly reduces the
    iteration time needed to resolve issues on the full-scale pilot line — this should
    be planned as standard practice in any deep tech scale-up project.
