  source_title: SunDrive Solar - 20MW Pilot Facility Knowledge Sharing Report
  publish_date: 2025-05
  project_name: SunDrive Solar 20MW Pilot Facility (ARP008)
  what_happened: Module fabrication during Milestone 3B used glass sized for M10 modules
    because custom glass for the larger M12 cells was unavailable. The resulting module
    layout had poor packing density and significant unused area, leading to higher-than-usual
    cell-to-module (CTM) losses despite high active-area cell efficiency of 25.11%.
  lesson_learnt: Module-level component procurement — particularly glass sizing —
    must be specified to match the cell format being produced; sourcing constraints
    that force a mismatch between cell and glass size directly penalise module efficiency
    through poor packing density and inflated CTM losses.
