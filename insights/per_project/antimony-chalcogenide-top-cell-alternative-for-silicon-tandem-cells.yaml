  evidence_excerpt: The InCl3-modified SnO2 not only significantly improved the crystallinity
    of antimony selenide films and increased the grain size, but also optimised the
    band alignment between SnO2 and Sb2Se3. Furthermore, the deep-level defects in
    antimony selenide were reduced, and thus prolonged the carrier lifetime of the
    absorber layer. As a result, the efficiency of the solar cell got a significant
    improvement, which is the highest power conversion efficiency among completely
    Cd-free antimony selenide solar cells prepared by vacuum thermal evaporation.
