- record_id: ARENA-DLV-6504
  source_title: UNSW - Earth-abundant, RoHS-compliant antimony chalcogenide - Public
    Dissemination Report
  publish_date: 2023-09
  project_name: 'Earth-abundant, RoHS-compliant antimony chalcogenide: top cell alternative
    for silicon tandem cells'
  what_happened: Antimony chalcogenide thin-film solar cells had historically been
    fabricated as mono-facial and opaque due to metal contacts in both substrate and
    superstrate configurations, preventing their use as top cells in tandems or in
    BIPV applications requiring semitransparency and performance under diffuse and
    non-normal incident light.
  lesson_learnt: Replacing metal back contacts with ITO in thin-film solar cells enables
    bifacial and semitransparent operation at reduced cost — this structural modification
    is applicable beyond antimony chalcogenide to other thin-film technologies, and
    should be considered early in device architecture decisions where tandem or BIPV
    applications are targeted.
