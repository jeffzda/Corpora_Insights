  evidence_excerpt: The core materials in the solar cell may behave durable, for example
    antimony chalcogenide material in this project. However, the solar cell is produced
    with multiple materials and these materials may interact with each other during
    working condition and environment and become unstable or cause solar cell degradation.
    Therefore, the durability of the solar cell has to be monitored from the beginning
    of the research and development.
  confidence_note: transferability rated broad because this lesson — that multi-layer
