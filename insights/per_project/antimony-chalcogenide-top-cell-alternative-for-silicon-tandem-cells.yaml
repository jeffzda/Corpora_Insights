- record_id: ARENA-DLV-6507
  source_title: UNSW - Earth-abundant, RoHS-compliant antimony chalcogenide - Public
    Dissemination Report
  publish_date: 2023-09
  project_name: 'Earth-abundant, RoHS-compliant antimony chalcogenide: top cell alternative
    for silicon tandem cells'
  what_happened: High-efficiency antimony selenide solar cells had universally relied
    on CdS as the electron transport layer, but CdS causes parasitic light absorption
    that reduces absorber layer utilisation and its cadmium content creates toxicity
    and regulatory barriers limiting large-scale practical application.
  lesson_learnt: CdS electron transport layers should be replaced with metal oxide
    alternatives (e.g. SnO2) in antimony selenide solar cells — InCl3 surface passivation
    on SnO2 followed by post-annealing improves crystallinity, grain size, band alignment,
    and carrier lifetime, achieving the highest recorded efficiency for fully Cd-free
    antimony selenide cells made by vacuum thermal evaporation, and this passivation
    approach is transferable to other metal-oxide-based thin-film cell architectures.
  issue_severity: moderate
  project_type: null
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: Adopted SnO2 as the electron transport layer and applied InCl3
    solution surface passivation with post-annealing treatment, which improved crystallinity,
    reduced deep-level defects, and achieved record Cd-free cell efficiency.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id004
