- record_id: ARENA-DLV-23752
  source_title: 'Antimony Chalcogenide: Top Cell Alternative for Silicon Tandem Cells
    Mid Report'
  publish_date: 2023-03
  project_name: 'Earth-abundant, RoHS-compliant antimony chalcogenide: top cell alternative
    for silicon tandem cells'
  what_happened: To achieve the strong electric field required in the identified p-i-n
    device structure for antimony chalcogenide solar cells, the electron transport
    layer (ETL) and hole transport layer (HTL) must have a large Fermi level energy
    difference or high doping density — constraints that existing standard transport
    layers do not adequately satisfy.
  lesson_learnt: Future p-i-n structure solar cell projects using low-mobility absorbers
    should prioritise identification and optimisation of ETL and HTL materials with
    large Fermi level separation or high doping density early in development, as off-the-shelf
    transport layers are likely to be inadequate for generating the required electric
    field strength.
