- record_id: ARENA-DLV-23756
  source_title: 'Antimony Chalcogenide: Top Cell Alternative for Silicon Tandem Cells
    Mid Report'
  publish_date: 2023-03
  project_name: 'Earth-abundant, RoHS-compliant antimony chalcogenide: top cell alternative
    for silicon tandem cells'
  what_happened: The project identified that the durability of a solar cell cannot
    be inferred solely from the stability of its constituent absorber material — the
    interaction between multiple functional layers during operation and exposure to
    environmental stressors can independently cause degradation or device failure
    even when the absorber itself is stable.
  lesson_learnt: Solar cell R&D projects should monitor the durability of the full
    multi-layer stack from the earliest stages, not just the primary absorber material
    — multi-layer interactions under operating conditions are a distinct and non-trivial
    failure pathway that will not be captured by material-level stability assessments
    alone.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
