- record_id: ARENA-DLV-6506
  source_title: UNSW - Earth-abundant, RoHS-compliant antimony chalcogenide - Public
    Dissemination Report
  publish_date: 2023-09
  project_name: 'Earth-abundant, RoHS-compliant antimony chalcogenide: top cell alternative
    for silicon tandem cells'
  what_happened: A 4-terminal antimony chalcogenide/silicon tandem solar cell was
    successfully assembled by stacking a bifacial semitransparent antimony chalcogenide
    top cell onto a silicon heterojunction bottom cell, with a polydimethylsiloxane
    anti-reflection film added at the top surface, achieving a power conversion efficiency
    exceeding the record for single-junction antimony chalcogenide cells.
  lesson_learnt: The 4-terminal tandem configuration can be validated without substantive
    extra expense by stacking existing optimised sub-cells — future work should tailor
    silicon bottom cell size and structure to the tandem geometry and fine-tune the
    antimony chalcogenide bandgap via selenourea dosage to reduce edge recombination
    and improve current matching, which represent the highest-leverage optimisation
    levers for this tandem architecture.
