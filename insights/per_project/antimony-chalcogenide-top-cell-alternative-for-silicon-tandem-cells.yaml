- record_id: ARENA-DLV-23753
  source_title: 'Antimony Chalcogenide: Top Cell Alternative for Silicon Tandem Cells
    Mid Report'
  publish_date: 2023-03
  project_name: 'Earth-abundant, RoHS-compliant antimony chalcogenide: top cell alternative
    for silicon tandem cells'
  what_happened: The widely used organic hole transport layer material Spiro-OMeTAD,
    commonly used in p-i-n structure solar cells, was found to be expensive, unstable,
    and incompatible with high-throughput production processes, creating a cost and
    durability barrier for antimony chalcogenide solar cell development.
  lesson_learnt: When developing thin-film solar cells targeting commercialisation,
    identify and qualify inorganic alternatives to expensive organic transport layers
    at the early R&D stage — manganese sulfide (MnS) deposited by scalable thermal
    evaporation demonstrated comparable efficiency to Spiro-OMeTAD with significantly
    better durability and is applicable to perovskite and other p-i-n structure devices.
