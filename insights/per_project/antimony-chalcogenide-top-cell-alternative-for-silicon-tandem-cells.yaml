- record_id: ARENA-DLV-23751
  source_title: 'Antimony Chalcogenide: Top Cell Alternative for Silicon Tandem Cells
    Mid Report'
  publish_date: 2023-03
  project_name: 'Earth-abundant, RoHS-compliant antimony chalcogenide: top cell alternative
    for silicon tandem cells'
  what_happened: Device simulation and characterisation of antimony chalcogenide (Sb2(S,Se)3)
    solar cells revealed that the material's one-dimensional structure and strong
    carrier transport anisotropy impose a serious limit on carrier mobility, with
    complicated deep defects causing low minority carrier lifetime and low effective
    doping, resulting in a near-intrinsic material with very low carrier diffusion
    length.
  lesson_learnt: For antimony chalcogenide and similarly anisotropic thin-film PV
    materials, a p-i-n device structure with a fully depleted absorber is essential;
    electron and hole transport layers must have large Fermi level energy differences
    or high doping density to generate a strong built-in electric field across the
    entire absorber — this should be the starting design assumption, not a late-stage
    correction.
  issue_severity: moderate
  project_type: manufacturing/supply chain
