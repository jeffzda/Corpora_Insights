  project_name: 'Earth-abundant, RoHS-compliant antimony chalcogenide: top cell alternative
    for silicon tandem cells'
  what_happened: Accelerated stability testing of unencapsulated antimony chalcogenide
    and antimony chalcogenide/Si tandem solar cells revealed that while devices showed
    acceptable stability under damp heat conditions, they suffered severe delamination
    under thermal cycle and humidity freeze test conditions, indicating that the multi-layer
    device structure has unresolved thermal stability issues.
  lesson_learnt: Multi-layer solar cell stability must be monitored from the start
    of R&D — even when the core absorber material is intrinsically stable, interactions
    between functional layers during thermal cycling and humidity freeze can cause
    severe delamination; accelerated stability testing should be integrated into early-stage
    device development to guide materials selection and encapsulation strategy before
    the device architecture is locked in.
