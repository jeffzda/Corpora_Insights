  source_title: 'Antimony Chalcogenide: Top Cell Alternative for Silicon Tandem Cells
    Mid Report'
  publish_date: 2023-03
  project_name: 'Earth-abundant, RoHS-compliant antimony chalcogenide: top cell alternative
    for silicon tandem cells'
  what_happened: Manganese sulfide (MnS) was successfully demonstrated as an inorganic
    hole transport layer in antimony chalcogenide p-i-n solar cells, delivering comparable
    device performance to Spiro-OMeTAD after proper heat treatment, while also exhibiting
    superior durability and being depositable via scalable thermal evaporation.
  lesson_learnt: MnS is a viable inorganic hole transport layer for p-i-n thin-film
    solar cells, including perovskite-based devices, and its deposition via thermal
    evaporation is scalable — teams developing similar device architectures should
    evaluate MnS as a lower-cost, more durable alternative to organic transport layers
    before committing to an organic HTL.
