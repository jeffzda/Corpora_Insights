  evidence_excerpt: According to the special optical and electrical properties of
    the antimony chalcogenide material, p-type semiconductor - intrinsic semiconductor-
    n-type semiconductor (p-i-n) structure is the most suitable device structure.
    With a very thin (about 300 nm) and fully depleted absorber, the carrier separation
    and transport efficiency can be greatly promoted by the built-in electric field
    spreading into the entire absorber.
