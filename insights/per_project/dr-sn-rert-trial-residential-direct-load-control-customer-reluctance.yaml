- record_id: ARENA-DLV-20713
  source_title: Demand Response Short Notice RERT Trial Year 3 Report
  publish_date: 2021-10
  project_name: DR SN RERT Trial — Residential direct load control customer reluctance
  what_happened: Across the trial, residential direct load control programs consistently
    attracted far fewer customers than anticipated despite high financial incentives
    (in some cases $200–$300 per customer), with customers unwilling to cede control
    of end-use appliances such as air conditioners and EV chargers.
  lesson_learnt: Financial incentives alone are insufficient to overcome residential
    customers' resistance to external control of appliances; future DR program designers
    should invest in understanding customer perceptions of amenity and autonomy before
    committing to direct load control as a program model, and should design programs
    that preserve customer override capability.
