  project_name: Carnarvon PV Penetration Case Study
  what_happened: A voltage rise on the Richardson distribution transformer (17% nominal
    PV penetration) caused multiple inverter disconnections; investigation revealed
    a load imbalance where one phase had low load and high PV generation, but no formal
    study was undertaken at the time because local operators lacked knowledge of PV
    impacts.
  lesson_learnt: Phase imbalance between load and PV connection points can trigger
    voltage rise and inverter disconnection even at relatively low aggregate penetration
    levels (17%); phase allocation should be explicitly checked for PV balance during
    installation approval rather than reactively corrected after a disconnection event.
