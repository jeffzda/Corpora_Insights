  proponent_type: network business
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated integration
  intervention_note: Horizon Power undertook a survey of inverter types and protection
    settings across the network and initiated a review to standardise anti-islanding
    set points, preferring a fixed value over the variable range permitted by AS4777.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id003
