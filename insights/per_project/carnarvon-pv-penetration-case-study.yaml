- record_id: ARENA-DLV-49059
  source_title: 'Carnarvon: A Case Study of Increasing Levels of PV Penetration in
    an Isolated Electricity Supply System'
  publish_date: 2012-04
  project_name: Carnarvon PV Penetration Case Study
  what_happened: Australian distribution utilities have historically tapped distribution
    transformers high (above nominal voltage) to compensate for voltage drop under
    load, but this pre-existing elevated voltage reduces the headroom available for
    PV-induced voltage rise, making inverter disconnection more likely even at moderate
    PV penetrations.
  lesson_learnt: Before approving PV connections in an area, network planners should
    audit and lower distribution transformer tap settings to create voltage headroom
    for PV injection; high tap settings that were appropriate for load-drop compensation
    become a liability once bidirectional power flows are introduced.
