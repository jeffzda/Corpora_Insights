  publish_date: 2012-04
  project_name: Carnarvon PV Penetration Case Study
  what_happened: Under some metering and tariff arrangements in place at the time
    of the study, a PV system could reduce network revenue for a utility such as Horizon
    Power without reducing required network expenditure, and at high penetrations
    could actually increase required network expenditure, creating a structural misalignment
    between policy incentives and network management outcomes.
  lesson_learnt: Tariff and metering frameworks for distributed PV must be designed
    to align customer incentives with network management outcomes; net feed-in tariffs
    that maximise export can increase network integration costs at high penetrations,
    and arrangements that recognise both the value of PV and the costs it imposes
    on the network are necessary to sustain high-penetration deployment.
