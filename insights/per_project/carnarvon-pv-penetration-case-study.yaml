  what_happened: Localised reverse power flow through the Gibson distribution transformer
    was observed during midday on sunny days, driven by a nominal PV penetration of
    70% of transformer capacity; at the 22kV level no backfeeding was observed, but
    the situation was flagged as likely to change following connection of the 300kWp
    system to the same South River Feeder.
  lesson_learnt: Distribution transformers with PV penetrations approaching or exceeding
    70% of rated capacity should be monitored for reverse power flow and their protection
    schemes reviewed before further PV connections are approved on the same feeder;
    adding large commercial PV systems to feeders already hosting high-penetration
    transformers requires explicit analysis of cumulative impact.
