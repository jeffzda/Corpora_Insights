  outcome_class: re-scoped/adapted
  secondary_failure_mode: coordination & stakeholders
  intervention_note: Horizon Power allowed the 300kWp EMC system to connect under
    a Power Purchase Agreement that included feed-in management, reactive power support,
    and utility dispatch control, effectively creating a pathway above the 1.15MWp
    cap.
  transferability: moderate
