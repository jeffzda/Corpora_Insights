- record_id: ARENA-DLV-49053
  source_title: 'Carnarvon: A Case Study of Increasing Levels of PV Penetration in
    an Isolated Electricity Supply System'
  publish_date: 2012-04
  project_name: Carnarvon PV Penetration Case Study
  what_happened: AS4777 permits inverter frequency trip settings within a wide range
    (45–55 Hz), but many European inverters shipped with default trip settings of
    50 ± 0.25 Hz — a range that falls entirely within Horizon Power's normal operating
    band of 47.5–52 Hz — causing inverter disconnection during normal, non-fault network
    operation.
  lesson_learnt: Procurers of PV inverters for isolated Australian grids must verify
    and adjust manufacturer default protection set points before installation; the
    AS4777 compliance range is too broad to guarantee compatibility with isolated-grid
    frequency excursions, and defaults from international markets can cause nuisance
    tripping under normal operation.
