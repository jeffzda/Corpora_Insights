  what_happened: Community members in Carnarvon expressed willingness to help Horizon
    Power by modifying their inverter disconnection settings beyond Australian standards
    to prevent nuisance tripping at high voltages; this created a risk of equipment
    damage and potential compromise of passive anti-islanding protection if implemented
    without utility oversight.
  lesson_learnt: Utilities should ensure PV inverters are either password-protected
    or require specialist cables to modify protection settings, and should proactively
    communicate with PV owners about why protection limits cannot be relaxed unilaterally;
    community pressure to extend inverter voltage limits is a foreseeable risk in
    networks with strong PV culture.
