- record_id: ARENA-DLV-49054
  source_title: 'Carnarvon: A Case Study of Increasing Levels of PV Penetration in
    an Isolated Electricity Supply System'
  publish_date: 2012-04
  project_name: Carnarvon PV Penetration Case Study
  what_happened: Horizon Power's strategy of maintaining full spinning reserve sufficient
    to cover simultaneous loss of all PV generation (n-1 for both largest generator
    and all PV) reduced generator efficiency and increased maintenance costs, effectively
    negating part of the fuel-saving benefit of the installed PV systems.
  lesson_learnt: Isolated-grid operators that maintain static spinning reserve sized
    for total PV loss forgo much of the economic benefit of PV; a dynamic spinning
    reserve strategy informed by real-time cloud sensing and PV output forecasting
    can reduce reserve requirements and recover fuel savings without compromising
    security.
  issue_severity: moderate
  project_type: network/grid
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Horizon Power trialled cloud sensor and sky-camera technology
    to forecast PV output variability and enable dynamic adjustment of spinning reserve
    in response to anticipated cloud events, analogous to their existing practice
    of pre-adjusting reserve for large load start-ups.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id004
  - 28
  - 35
  - 41
  evidence_excerpt: This policy reduces the value of PV to power system operation
    as sufficient central generators are still running, albeit at reduced load, to
    cover the possible loss of the PV generation. This results in lower efficiency
    of operation of the central generating sets as well as higher maintenance costs
    than if the strategy could assume that the PV systems would stay connected at
    times of downward frequency excursions.
