  publish_date: 2012-04
  project_name: Carnarvon PV Penetration Case Study
  what_happened: The variability of distributed PV output complicated Horizon Power's
    network peak-load forecasting, because PV generation simultaneously reduces net
    load on average days while a rapid cloud event during a high-demand summer afternoon
    could eliminate ~700–900kW of generation precisely when air-conditioning load
    is peaking.
  lesson_learnt: Utilities planning network augmentation in the presence of significant
    PV penetration must use probabilistic forecasting methods that model the correlated
    risk of peak demand occurring simultaneously with low PV output (e.g. cloud cover
    on a hot day); deterministic deferral of upgrades based solely on average PV contribution
    understates risk.
