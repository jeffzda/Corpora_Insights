  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: Horizon Power identified lowering distribution transformer tap
    settings as a low-cost mitigation option requiring only a network study and short
    field time, while cautioning that voltage at peak load must be verified to remain
    above minimum standards before any tap reduction.
  transferability: broad
  delay_magnitude: null
