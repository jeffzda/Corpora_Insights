- record_id: ARENA-DLV-49055
  source_title: 'Carnarvon: A Case Study of Increasing Levels of PV Penetration in
    an Isolated Electricity Supply System'
  publish_date: 2012-04
  project_name: Carnarvon PV Penetration Case Study
  what_happened: Clustered PV systems in the Carnarvon urban area created a cloud-shear
    risk where a single passing cloud could reduce aggregate PV output by up to 70–80%
    within seconds, potentially presenting the central generators with an apparent
    load step of approximately 500kW within minutes — comparable to the loss of a
    major load.
  lesson_learnt: Where PV systems are geographically clustered in an isolated grid,
    cloud shear can produce aggregate generation ramps large enough to threaten frequency
    stability; operators should quantify this risk using high-resolution irradiance
    sensing and geographic diversity analysis before approving further PV connections.
  issue_severity: moderate
  project_type: network/grid
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: Horizon Power deployed a solar irradiation sensor array and sky
    camera to monitor cloud cover and model aggregated PV output, aiming to predict
    generation ramps and dynamically adjust spinning reserve ahead of cloud events.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id005
  - 27
  - 28
  - 29
  evidence_excerpt: a 10kW inverter during a survey of PV system installations when
    a small cloud passed over the output of the inverter changed from 8kW to 2.2kW
    in approximately 2 seconds as the cloud passed over resulting in a 72% change
    in PV output... it can be estimated that PV generation fluctuations of approximately
    500kW could potentially be seen by the central generators over a period of minutes.
