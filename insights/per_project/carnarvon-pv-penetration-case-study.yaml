- record_id: ARENA-DLV-49057
  source_title: 'Carnarvon: A Case Study of Increasing Levels of PV Penetration in
    an Isolated Electricity Supply System'
  publish_date: 2012-04
  project_name: Carnarvon PV Penetration Case Study
  what_happened: A voltage rise event on the Gibson distribution transformer (carrying
    70% nominal PV penetration relative to transformer capacity) caused multiple PV
    inverters to disconnect; the root cause was an operational decision to move a
    normally-open network point that connected more generation to a single transformer,
    raising LV voltages to levels visible in Figure 14 (up to 258V at customer connection
    points).
  lesson_learnt: Network reconfiguration decisions — including moving normally-open
    points — must be assessed for their effect on PV hosting capacity and LV voltage
    profiles before implementation; in networks with clustered PV, switching that
    concentrates generation behind a single transformer can immediately trigger over-voltage
    and mass inverter disconnection.
  issue_severity: major
  project_type: network/grid
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: null
  failure_mode: unvalidated integration
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: The open point was moved back to its original position to remove
    generation from the affected transformer, and Horizon Power recommended relocating
    the large PV system onto a dedicated transformer and replacing consumer mains
    in the area.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id007
  - 31
  - 32
  evidence_excerpt: The root cause of the problem was that a normally open point was
    moved resulting in more generation being connected to the one transformer. The
    result of this was a high network voltage... The solution to this problem was
    to move the open point back to the original position thus removing some generation
    from the transformer and lowering the voltage.
