- record_id: ARENA-DLV-49056
  source_title: 'Carnarvon: A Case Study of Increasing Levels of PV Penetration in
    an Isolated Electricity Supply System'
  publish_date: 2012-04
  project_name: Carnarvon PV Penetration Case Study
  what_happened: Insufficient data resolution (15-minute intervals) in Horizon Power's
    network monitoring systems meant that rapid frequency and PV output fluctuations
    — which occur over seconds — could not be captured or diagnosed, preventing the
    utility from confirming the cause of suspected inverter disconnection events or
    quantifying cloud-shear impacts on system stability.
  lesson_learnt: Monitoring infrastructure for isolated grids with significant PV
    penetration must record frequency and generation data at sub-minute resolution
    (ideally seconds); 15-minute SCADA data is structurally incapable of capturing
    the rapid transients that drive inverter disconnection and cloud-shear frequency
    events.
  issue_severity: moderate
  project_type: network/grid
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: data/validation/testing
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Horizon Power installed additional power quality monitoring equipment
    on the Gibson distribution transformer and, as part of the 300kWp system connection,
    increased the level of monitoring to capture higher-resolution performance data.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id006
  - 27
  - 28
  evidence_excerpt: it should be noted here that a 15 minute data resolution is insufficient
    to capture the frequency fluctuations which are of the most importance. The lack
    of specific high resolution data makes it difficult to identify this issue. Routine
    collection of high resolution system frequency data will help networks understand
    how inverters are behaving on the network.
