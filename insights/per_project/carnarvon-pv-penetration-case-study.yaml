- record_id: ARENA-DLV-49051
  source_title: 'Carnarvon: A Case Study of Increasing Levels of PV Penetration in
    an Isolated Electricity Supply System'
  publish_date: 2012-04
  project_name: Carnarvon PV Penetration Case Study
  what_happened: Horizon Power imposed a 1.15MWp cap on distributed PV connections
    to the Carnarvon isolated network in July 2011, halting all new renewable energy
    system connections unless covered by a Power Purchase Agreement providing Horizon
    Power operational control, due to concerns about power quality and system security.
  lesson_learnt: In isolated grids, utilities will cap distributed PV at the level
    of spinning reserve they can maintain for potential simultaneous PV disconnection;
    proponents seeking to connect above this threshold must negotiate a PPA or feed-in
    management agreement that gives the utility dispatch control before connection
    will be permitted.
  issue_severity: major
  project_type: network/grid
