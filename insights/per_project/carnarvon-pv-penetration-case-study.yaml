  what_happened: The Western Australian Distribution Connections Manual specifies
    a guideline limiting PV system connections to 20% of distribution transformer
    capacity to prevent islanding and backfeeding; however, Horizon Power had allowed
    this limit to be exceeded in isolated cases (with one transformer reaching 70%
    penetration) without encountering significant islanding or protection problems
    to date.
  lesson_learnt: The 20% distribution transformer PV penetration guideline is a conservative
    default; utilities that conduct detailed network studies and implement appropriate
    monitoring and protection measures may be able to safely exceed it, but should
    do so in a controlled and monitored manner rather than through ad hoc approvals.
