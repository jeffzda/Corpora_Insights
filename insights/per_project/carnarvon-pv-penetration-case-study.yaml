  publish_date: 2012-04
  project_name: Carnarvon PV Penetration Case Study
  what_happened: PV generation at current Carnarvon penetration levels (approximately
    13% of midday load) offset an estimated 833 tonnes of CO2 per annum and reduced
    generator fuel consumption, but the spinning reserve strategy required to accommodate
    possible simultaneous PV loss partially offset these benefits through reduced
    generator efficiency and higher maintenance costs.
  lesson_learnt: The net fuel and emissions benefit of PV in isolated diesel/gas grids
    is materially reduced by static spinning reserve strategies sized for total PV
    loss; quantifying this offset is necessary to accurately value PV's contribution
    and build the business case for dynamic reserve strategies that would recover
    the full benefit.
