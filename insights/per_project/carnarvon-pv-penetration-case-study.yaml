- record_id: ARENA-DLV-49052
  source_title: 'Carnarvon: A Case Study of Increasing Levels of PV Penetration in
    an Isolated Electricity Supply System'
  publish_date: 2012-04
  project_name: Carnarvon PV Penetration Case Study
  what_happened: A system-wide frequency disturbance caused multiple PV inverters
    to simultaneously disconnect from the Carnarvon isolated network via their anti-islanding
    protection, effectively adding approximately 700kW of apparent load to the central
    generators at the moment the generators were already stressed by the disturbance.
  lesson_learnt: In isolated grids, mass simultaneous inverter disconnection during
    frequency events exacerbates rather than relieves generation deficits; inverter
    under-frequency trip settings must be set below the network's under-frequency
    load shedding threshold so that load is shed before PV disconnects, protecting
    generators from compounded stress.
  issue_severity: major
  project_type: network/grid
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: null
  failure_mode: unvalidated integration
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Horizon Power initiated a review of all inverter anti-islanding
    set points to ensure under-frequency trip levels sit below network protection
    thresholds, and trialled a dispatchable load scheme that disconnects a matched
    non-critical load whenever a PV system trips, neutralising the net load step seen
    by generators.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id002
