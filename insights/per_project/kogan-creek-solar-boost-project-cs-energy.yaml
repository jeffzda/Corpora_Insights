- record_id: ARENA-DLV-25904
  source_title: Review of ARENA's Reliability Portfolio
  publish_date: 2020-01
  project_name: Kogan Creek Solar Boost Project (CS Energy)
  what_happened: The Kogan Creek Solar Boost Project was terminated in March 2016
    after the proponent concluded that the solar thermal addition could not be commercially
    deployed without substantial further financial investment and there was no prospect
    of a positive return on that investment.
  lesson_learnt: Solar thermal additions to existing coal generation face fundamental
    commercial viability barriers under current market and technology conditions;
    feasibility work should assess commercial viability explicitly before committing
    to demonstration-scale investment.
