  publish_date: null
  project_name: Upconversion of the Solar Spectrum for Improved PV Energy Conversion
    (A-023)
  what_happened: A poly-pendant perylene polymer emitter was synthesised to allow
    triplet energy to diffuse electronically along polymer chains rather than requiring
    physical molecular diffusion, but it only demonstrated upconversion in solution
    and not in the solid state, apparently due to low-energy trap sites quenching
    triplet excited states.
  lesson_learnt: Polymer emitters designed to enable solid-state upconversion via
    electronic (rather than molecular) diffusion are a valid concept but face a trap-site
    quenching problem in the solid phase; future development should focus on alternative
    solid-phase routes (e.g. gelation of liquid upconvertors) rather than direct polymerisation
    of pendant chromophores.
