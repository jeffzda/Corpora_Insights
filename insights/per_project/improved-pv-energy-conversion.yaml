  publish_date: null
  project_name: Upconversion of the Solar Spectrum for Improved PV Energy Conversion
    (A-023)
  what_happened: Molecular dynamics computer simulations revealed that emitter molecule
    shape strongly governs interaction geometry and hence upconversion efficiency
    — overturning the prior assumption of random collision orientations and explaining
    why certain emitters and multi-emitter combinations outperform others.
  lesson_learnt: Computational simulation of emitter molecular dynamics should be
    incorporated into upconversion material screening workflows, as molecular shape
    governs preferred interaction geometries and can predict intrinsic upconversion
    efficiency before costly synthesis and device testing.
