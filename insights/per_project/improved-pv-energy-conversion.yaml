  project_name: Upconversion of the Solar Spectrum for Improved PV Energy Conversion
    (A-023)
  what_happened: A silver-coated bead back-reflector was added to redirect isotropically
    emitted upconverted light back toward the solar cell, doubling the figure-of-merit
    from approximately 1.3×10⁻⁴ to 3.4×10⁻⁴ mA.cm⁻².
  lesson_learnt: Because photochemical upconversion emits light isotropically (half
    directed away from the cell), incorporating a back-reflector is a straightforward
    optical engineering step that doubles device performance and should be included
    as standard in any upconversion-coupled solar cell architecture.
