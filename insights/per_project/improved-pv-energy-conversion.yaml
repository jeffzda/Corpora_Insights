  publish_date: null
  project_name: Upconversion of the Solar Spectrum for Improved PV Energy Conversion
    (A-023)
  what_happened: The project demonstrated photochemical upconversion applied to amorphous
    silicon solar cells for the first time, achieving a figure-of-merit of 1.3×10⁻⁴
    mA.cm⁻² with a broadband sensitizer — approximately 1000 times below device-relevant
    levels, though 200 times more efficient than state-of-the-art inorganic phosphor
    upconversion.
  lesson_learnt: Photochemical upconversion can be successfully applied to solar cells
    and outperforms inorganic phosphor alternatives, but current efficiency levels
    remain orders of magnitude below commercial relevance — further R&D on sensitizer
    bandwidth and device architecture is required before deployment potential can
    be assessed.
