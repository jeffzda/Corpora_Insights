    materials, first application of upconversion to solar cells, full materials and
    device characterisation, multiple peer-reviewed publications, and filing of a
    patent application.
  lesson_learnt: Structuring a fundamental R&D project around clearly defined, measurable
    deliverables (synthesis targets, device demonstrations, publications, IP filings)
    enables full accountability against funding agreement outcomes even when individual
    technical sub-goals (e.g. plasmonics, solid-state polymer emitters) are not achieved.
