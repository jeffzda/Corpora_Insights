  project_name: Upconversion of the Solar Spectrum for Improved PV Energy Conversion
    (A-023)
  what_happened: Attempts to apply plasmonic nanostructured substrates (fabricated
    by electron beam lithography at Imperial College London) to enhance sensitizer
    light harvesting in upconversion were unsuccessful; no discernible plasmonic enhancement
    effect was detected.
  lesson_learnt: Plasmonic enhancement is confined to approximately 200 nm proximity
    of the nanostructure, while the characteristic absorption length of sensitizer
    materials at working concentrations is around 100 µm — a ~1000-fold mismatch that
    must be addressed (e.g. via 3D nanostructured absorbers) before plasmonics can
    meaningfully enhance upconversion.
  issue_severity: moderate
  project_type: generation
