  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Team identified the physical reason for failure (scale mismatch
    between plasmonic near-field and sensitizer absorption length) and redirected
    toward 3D nanostructured absorbers and plasmon-core nanosphere supports as future
    approaches.
  transferability: narrow
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id004
  - 6
  evidence_excerpt: We were unsuccessful in determining any discernable effect of
    the plasmonic substrate. We reason that this is because the effect of the plasmonic
    device is limited to the ~200nm vicinity, but at the concentrations of sensitizer
    material employed, our characteristic absorption length is more like 100µm. As
    such, we require a thousandfold increase in absorption coefficient.
