- record_id: ARENA-DLV-21115
  source_title: Project Clean Wafers Pre-Feasibility Study
  publish_date: 2025-12
  project_name: Project Clean Wafers
  what_happened: The project identified that global solar wafer production is more
    than 97% concentrated in China, and that policy-driven demand for non-Chinese
    supply (U.S. FEOC rules, EU NZIA resilience requirements, tariffs) creates a rare
    market entry window for Australian production — but that this window is time-sensitive
    and dependent on the policy settings remaining in place.
  lesson_learnt: Australian manufacturing feasibility studies for export-oriented
    clean energy products should quantify the policy-driven component of the market
    opportunity separately from structural demand, and explicitly assess the risk
    of policy reversal — a project that is only viable under current tariff and FEOC
    settings carries a regulatory tail risk that must be managed in the investment
    structure.
  issue_severity: minor
  project_type: manufacturing/supply chain
  project_scale_band: first commercial/FOAK
  lifecycle_phase: concept/feasibility
  proponent_type: project developer
