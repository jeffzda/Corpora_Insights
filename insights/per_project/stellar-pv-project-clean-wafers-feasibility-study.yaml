  what_happened: The project found that upstream value chain integration with a nearby
    metallurgical silicon processing facility (Solquartz, within 300 km of Townsville)
    and potential future Australian polysilicon producers represents a material supply
    chain advantage, but the project was designed to remain viable without this domestic
    supply being available.
  lesson_learnt: Manufacturing projects that depend on upstream inputs should be designed
    to be commercially viable on international supply alone, treating domestic upstream
    integration as an upside rather than a dependency — this prevents a project from
    being held hostage to upstream developments that may not proceed on the same timeline.
