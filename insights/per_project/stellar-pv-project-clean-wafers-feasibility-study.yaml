  source_title: Project Clean Wafers Pre-Feasibility Study
  publish_date: 2025-12
  project_name: Project Clean Wafers
  what_happened: The project identified that the U.S. currently has only two operational
    or under-construction wafer manufacturers with a combined capacity of approximately
    9 GW, while cell manufacturing capacity is projected to reach 31 GW — creating
    a 22 GW wafer supply gap that constrains the domestic U.S. solar supply chain
    and which proposed projects (CubicPV, Norsun) have been suspended without filling.
  lesson_learnt: When planning manufacturing investments for export markets, validate
    that the demand gap is structural and not already being addressed by announced
    projects — the suspension of planned U.S. wafer plants due to policy uncertainty
    demonstrates that announced capacity should not be treated as committed supply
    when assessing market opportunity.
