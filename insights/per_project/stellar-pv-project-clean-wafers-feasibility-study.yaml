  evidence_excerpt: 'Globally, more than 97% of solar wafer production is concentrated
    in China... These policies strengthen the U.S. solar supply chain for key inputs
    – including polysilicon, wafers, and cells – reinforcing the shift away from Chinese
    sourcing... FEOC-compliant: Australian ownership ensures compliance and avoids
    penalties. Tariff-advantaged: Non-Chinese origin gives Stellar PV wafers a clear
    pricing advantage as tariffs on FEOC suppliers rise.'
