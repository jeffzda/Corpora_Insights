- record_id: ARENA-DLV-21107
  source_title: Project Clean Wafers Pre-Feasibility Study
  publish_date: 2025-12
  project_name: Project Clean Wafers
  what_happened: The project selected a site within an established industrial precinct
    near Townsville that offers co-located behind-the-grid renewable energy supply
    from other proponents at the site, avoiding transmission costs and reducing dependence
    on Queensland grid supply, which is a critical input given the high electricity
    demand of Czochralski ingot-pulling furnaces.
  lesson_learnt: For energy-intensive manufacturing projects, co-locating within a
    precinct that has dedicated behind-the-grid renewable energy infrastructure significantly
    reduces operating costs and grid exposure — electricity access should be treated
    as a primary site-selection criterion, not a secondary infrastructure consideration.
