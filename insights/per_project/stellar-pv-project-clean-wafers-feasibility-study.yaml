- record_id: ARENA-DLV-21105
  source_title: Project Clean Wafers Pre-Feasibility Study
  publish_date: 2025-12
  project_name: Project Clean Wafers
  what_happened: The project identified that polysilicon supply chain compliance —
    specifically sourcing from non-FEOC jurisdictions — is a critical constraint on
    project viability and market access, as Chinese polysilicon (representing ~97%
    of global supply) risks disqualifying downstream products from U.S. IRA tax credits
    and triggering trade restrictions.
  lesson_learnt: For Australian solar manufacturing projects targeting the U.S. market,
    polysilicon sourcing strategy must be resolved at pre-feasibility stage — not
    post-investment — because FEOC non-compliance can eliminate access to IRA production
    credits and undermine the entire commercial case; build flexibility into procurement
    to operate with or without Australian domestic polysilicon.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: first commercial/FOAK
  lifecycle_phase: concept/feasibility
  proponent_type: project developer
  delay_category: procurement/supply chain
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: commercial & market
  intervention_note: Project designed a flexible procurement model that can operate
    with or without Australian polysilicon, prioritising non-FEOC sources from the
    U.S., Europe, Malaysia, or other compliant jurisdictions.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id005
  - 43
  evidence_excerpt: Under the IRA/OBBBA, products remain eligible for tax credits
    if FEOC-sourced materials stay below Treasury's cost-share threshold. Since most
    Chinese polysilicon falls into this category, using it risks disqualifying downstream
    solar products from IRA benefits, undermining competitiveness in the U.S. market...
    our project must remain viable regardless of local supply availability.
  confidence_note: issue_severity set to moderate because FEOC compliance is a material
    commercial constraint requiring explicit procurement design, not a minor consideration;
    no delay yet as project is still pre-feasibility.
  source_url: https://arena.gov.au/knowledge-bank/project-clean-wafers-pre-feasibility-study/
