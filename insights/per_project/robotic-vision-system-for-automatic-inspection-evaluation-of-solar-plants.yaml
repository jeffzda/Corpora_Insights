- record_id: ARENA-DLV-10705
  source_title: A Robotic Vision System for Rapid Inspection and Evaluation of Solar
    Plant Infrastructure
  publish_date: 2019-11
  project_name: A Robotic Vision System for Rapid Inspection and Evaluation of Solar
    Plant Infrastructure
  what_happened: The project demonstrated that automated robotic monitoring of soiling
    levels on CSP heliostats is economically justified, with estimated lifetime savings
    approximately 14 times the cost of the initial hardware investment and NPV benefits
    of $1.5–2.4 million for a commercial-scale 115 MWe plant. The image processing
    software achieved soiling reflectivity estimation within 1% accuracy at panel
    level.
  lesson_learnt: CSP plant operators should consider investing in automated UAV-based
    soiling monitoring systems for heliostat fields — spatially resolved soiling data
    enables prioritised cleaning schedules that yield NPV benefits of $1.5–2.4M at
    commercial scale, far exceeding system hardware costs, particularly where non-homogeneous
    soiling allows differential cleaning prioritisation based on each heliostat's
    optical contribution.
  issue_severity: none
  project_type: software/data/digital
