- record_id: ARENA-DLV-10704
  source_title: A Robotic Vision System for Rapid Inspection and Evaluation of Solar
    Plant Infrastructure
  publish_date: 2019-11
  project_name: A Robotic Vision System for Rapid Inspection and Evaluation of Solar
    Plant Infrastructure
  what_happened: The project found no economic advantage in using automated visual
    (RGB) inspection for detection of defects in PV modules. Existing methods — manual
    inspection, string-level power monitoring, and biannual infrared aerial surveys
    — were already economical and sufficient for the timescales of PV fault rectification,
    rendering the project's original PV defect detection objective redundant.
  lesson_learnt: Before investing in automated visible-spectrum inspection for PV
    fault detection, verify that existing infrared aerial survey methods do not already
    provide an adequate and cost-effective solution — infrared imaging identifies
    PV faults effectively from high altitude and does not require the high-resolution
    close-up imaging that RGB robotic inspection demands, making the latter hard to
    justify economically.
  issue_severity: major
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: poor scoping
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Pivoted project focus away from PV defect detection toward CSP
    heliostat soiling monitoring, where automated visual inspection demonstrated clear
    economic value.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id004
  - 18
  evidence_excerpt: The cost benefit of automated defect identification in solar PV
    fields showed that existing methods are economical. Infrared imaging of solar
    PV is effective at identifying a wide range of faults. Infrared aerial surveys
    of solar fields are already in active use. The resolution of image data required
    is fairly low and existing photometric aerial survey software packages produce
    good quality results. The associated data analysis is simple and does not require
    automated systems.
