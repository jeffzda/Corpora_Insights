  source_title: A Robotic Vision System for Rapid Inspection and Evaluation of Solar
    Plant Infrastructure
  publish_date: 2019-11
  project_name: A Robotic Vision System for Rapid Inspection and Evaluation of Solar
    Plant Infrastructure
  what_happened: The first two UAV service providers engaged by the project both ceased
    operations within the first year — one went broke within six months, the other
    ceased aerial services after a further six months due to staffing changes. The
    third provider, a sole owner-operator, remained active but was limited to a single
    quadrotor with restricted flight times, and hardware faults and crashes cost the
    project significant experiment time and compromised data acquisition.
  lesson_learnt: Do not rely on small commercial UAV operators as project-critical
    delivery partners — the sector has high attrition. Budget significant time for
    mission-planning and flight-control software development tailored to the specific
    inspection task, and plan for hardware failure contingency; sourcing a capable
    hobby-grade drone platform with open-source autopilot support is more reliable
    than commercial UAV service contracts for non-standard inspection missions.
