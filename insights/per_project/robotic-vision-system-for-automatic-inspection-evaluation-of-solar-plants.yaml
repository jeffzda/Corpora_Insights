  publish_date: 2019-11
  project_name: A Robotic Vision System for Rapid Inspection and Evaluation of Solar
    Plant Infrastructure
  what_happened: The project employed three successive research fellows from the computer
    vision community before finding a suitable contributor; the first three had short
    tenures and focused on pure computer vision problems, resulting in slow overall
    progress. The breakthrough on soiling estimation algorithms came only after hiring
    a researcher from a renewables energy background who was then trained in computer
    vision.
  lesson_learnt: For applied computer vision projects in the renewables sector, recruiting
    staff with a renewables or domain-science background and training them in computer
    vision is more effective than hiring specialist computer vision researchers who
    lack domain context — domain-specific algorithm development requires deep understanding
    of the physical problem, not just algorithmic expertise.
