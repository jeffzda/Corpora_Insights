- record_id: ARENA-DLV-10707
  source_title: A Robotic Vision System for Rapid Inspection and Evaluation of Solar
    Plant Infrastructure
  publish_date: 2019-11
  project_name: A Robotic Vision System for Rapid Inspection and Evaluation of Solar
    Plant Infrastructure
  what_happened: The project concluded that the Australian and global CSP market is
    too small and geographically dispersed to support commercialisation of automated
    inspection services through a dedicated spin-off company. With approximately 50
    CSP plants worldwide and NPV savings of only $1.5–2M per plant, the total addressable
    market capital for automated inspection was assessed as under $100M — insufficient
    to justify a standalone service business.
  lesson_learnt: When commercialisation of an enabling technology depends on a niche
    market (such as CSP O&M inspection), spin-off or direct-service business models
    are unlikely to be viable; open-sourcing the software and enabling existing multi-service
    aerial operators to add the capability as an incremental service is a more effective
    commercialisation pathway.
