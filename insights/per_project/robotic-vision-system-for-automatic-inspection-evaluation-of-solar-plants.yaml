- record_id: ARENA-DLV-10706
  source_title: A Robotic Vision System for Rapid Inspection and Evaluation of Solar
    Plant Infrastructure
  publish_date: 2019-11
  project_name: A Robotic Vision System for Rapid Inspection and Evaluation of Solar
    Plant Infrastructure
  what_happened: Existing commercial aerial platforms and mission-planning software
    were found to be unsuitable for detailed solar infrastructure inspection tasks.
    Standard photogrammetric survey software fuses images into large-scale maps at
    insufficient resolution for defect and soiling analysis, and no purpose-built
    software existed for the close-up, waypoint-specific inspection missions required.
  lesson_learnt: Projects deploying UAVs for solar infrastructure inspection should
    not assume commercial mapping or survey software is fit for purpose — close-up
    infrastructure inspection requires custom mission-planning software with waypoint-level
    control, gimbal management, and panel-specific image resolution that existing
    photogrammetric survey packages do not provide. Budget for custom software development
    from the outset.
