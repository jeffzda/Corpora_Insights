- record_id: ARENA-DLV-71085
  source_title: Hybrid Power Generation for Australian Off-Grid Mines
  publish_date: 2018-06
  project_name: Newman Power Station Battery Storage
  what_happened: A 30 MW lithium-ion battery storage facility was installed at the 178 MW Newman gas-fired power station in 2017 to improve power security and quality through network support functions and
    additional spinning reserve.
  lesson_learnt: Battery storage added to an existing fossil-fuel power station can improve network stability and spinning reserve without a full hybrid renewable retrofit — this represents a lower-risk
    incremental step towards hybrid integration for mines where a full renewable build is not yet viable.
