- record_id: ARENA-DLV-40607
  source_title: ARENA Electrical Infrastructure Roundtable
  publish_date: '2025-06-25'
  project_name: Energy Queensland / Ergon Network – Major Customer Connections Growth
  what_happened: The volume of major customer connection projects managed by Energy
    Queensland's Major Projects team grew from approximately 20 projects in 2021 to
    approximately 110 projects by 2025, a more than five-fold increase that placed
    significant strain on resources and process capacity.
  lesson_learnt: A five-fold increase in major connection project volumes in four
    years indicates that resourcing models calibrated to historical workloads will
    be severely inadequate in an accelerated energy transition; network businesses
    and proponents should expect major customer connection timelines to be under pressure
    and plan accordingly, including earlier engagement and longer lead times.
