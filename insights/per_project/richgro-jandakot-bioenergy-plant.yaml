- record_id: ARENA-DLV-59201
  source_title: Biogas Opportunities for Australia
  publish_date: 2019-03
  project_name: Richgro Jandakot Bioenergy Plant
  what_happened: The Jandakot Bioenergy Plant was commissioned in 2015 by Biogass Renewables for Richgro, handling 30,000–50,000 tonnes of commercial and industrial biowaste annually and generating 2 MW
    electricity and 2.2 MW heat. Capital investment was A$8–10 million with a payback period estimated at less than four years before grants.
  lesson_learnt: Behind-the-meter biowaste anaerobic digestion projects co-located with an industrial feedstock source can achieve payback periods under four years, especially when waste treatment gate
    fees, energy bill savings, and by-product (bio-fertiliser) revenues are stacked — proponents should model all three revenue streams, not just energy sales.
