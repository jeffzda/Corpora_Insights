  source_title: Summary of ARENA Funded Hydrogen R&D Projects
  publish_date: 2023-04
  project_name: ARENA Hydrogen R&D Funding Round (Portfolio)
  what_happened: Multiple projects identified high sensitivity of their economic models
    to electricity prices and the sell price of green hydrogen, making it difficult
    to quantify reliable LCOH metrics and build credible business cases during the
    R&D phase.
  lesson_learnt: Techno-economic analyses for hydrogen R&D projects should explicitly
    model sensitivity ranges for electricity price and green hydrogen sell price,
    and avoid presenting single-point LCOH estimates — the uncertainty in these inputs
