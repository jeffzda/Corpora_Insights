  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Final Guidelines specified that appropriately calibrated reference
    cells with spectral response similar to the device under test should be used,
    with mismatch corrections applied, and lamp characterisation performed to control
    illumination level.
