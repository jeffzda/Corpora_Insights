- record_id: ARENA-DLV-60207
  source_title: Specifying Guidelines for Assessing Perovskite Solar Cells - Public
    Impact Report
  publish_date: 2019-07
  project_name: Specifying Guidelines for Assessing Perovskite Solar Cells
  what_happened: The project demonstrated that perovskite solar cells exhibit meta-stability
    effects across timescales from milliseconds to days, coupled with irreversible
    degradation, making standard silicon-based measurement protocols inadequate. Fast
    I-V sweeps mask hysteresis but misrepresent true device performance; slow sweeps
    can cause irreversible degradation during measurement itself.
  lesson_learnt: For emerging PV technologies with meta-stability characteristics,
    standard silicon-cell measurement approaches produce unreliable efficiency figures
    — a Dynamic I-V or Settled Current at Fixed Voltage approach is required; project
    teams and funders assessing perovskite performance claims should verify that the
    measurement method used accounts for hysteresis and settling time, not just sweep
    direction.
  issue_severity: major
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Guidelines recommended Dynamic I-V measurement over a limited
    number of points with a Maximum-Power-Point-Tracking algorithm as the preferred
    approach to eliminate hysteresis artefacts while minimising degradation during
    measurement.
  transferability: narrow
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id007
  - 18
  - 19
  evidence_excerpt: When Forward and Reverse I-V curves result in observed hysteresis,
    the correct output power cannot be taken from either curve, nor can it be taken
    from the mean of the two curves ... Using fast I-V sweeps may result in negligible
    hysteresis, however if the sweep rate is faster than the response time of the
    device, the measured state is not representative of device performance in the
    field.
  confidence_note: transferability set to narrow as this finding is specific to meta-stable
    emerging PV device types; secondary_failure_mode of design assumption failure
    added because the root issue is that assumptions built into existing IEC standards
    for silicon cells do not hold for perovskites.
