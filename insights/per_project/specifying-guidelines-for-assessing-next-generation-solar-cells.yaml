  project_name: Specifying Guidelines for Assessing Perovskite Solar Cells
  what_happened: Over 24 months of the project, more than 4,000 perovskite cells were
    fabricated and tested across multiple fabrication campaigns. Champion device performance
    reached 20.1% PCE for small cells and 18.1% PCE for large-area (>1 cm²) cells,
    with significant reduction in batch variability achieved over time.
  lesson_learnt: Sustained iterative fabrication and measurement campaigns — in this
    case over 4,000 cells across 24 months — are necessary to reduce variability and
    achieve reproducible performance in emerging PV device development; one-off champion
    results are insufficient evidence of technology readiness and funders should require
    statistical performance data across batches.
