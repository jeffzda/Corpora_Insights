  source_title: Specifying Guidelines for Assessing Perovskite Solar Cells - Public
    Impact Report
  publish_date: 2019-07
  project_name: Specifying Guidelines for Assessing Perovskite Solar Cells
  what_happened: The project found that the terms 'stability' and 'stabilisation'
    were used inconsistently across the perovskite solar cell research community,
    conflating long-term device stabilisation with short-term measurement settling.
    This terminological inconsistency was a source of error and miscommunication in
    published efficiency results.
  lesson_learnt: When developing or applying measurement standards for emerging technologies,
    establish and enforce clear, agreed definitions for key terms before disseminating
    results — inconsistent use of terms like 'stabilisation' across research groups
    causes systematic miscommunication that undermines comparison of results and may
    mislead investment decisions.
