  source_title: Specifying Guidelines for Assessing Perovskite Solar Cells - Public
    Impact Report
  publish_date: 2019-07
  project_name: Specifying Guidelines for Assessing Perovskite Solar Cells
  what_happened: At project conception, standard laboratory methods for measuring
    perovskite solar cell performance were insufficient and practices varied widely
    across research groups, making it impossible to compare breakthrough results between
    laboratories. This absence of shared measurement standards was identified as a
    barrier to reliable technology assessment and investor confidence.
  lesson_learnt: The absence of agreed measurement protocols for emerging PV technologies
    creates a systemic risk of misdirected R&D investment — funding bodies should
    require or support development of measurement standards as a precondition or parallel
    activity when funding early-stage technology demonstration, not as an afterthought.
