  source_title: Specifying Guidelines for Assessing Perovskite Solar Cells - Public
    Impact Report
  publish_date: 2019-07
  project_name: Specifying Guidelines for Assessing Perovskite Solar Cells
  what_happened: Engagement with researcher partners through roadshow and exchange
    activities revealed that results from perovskite solar cells that are not independently
    certified may have efficiency measurement errors of at least ±10% when correct
    illumination levels, device temperature control, and measurement protocols are
    not applied. This finding was common across multiple partner laboratories.
  lesson_learnt: When evaluating or funding emerging PV technology claims, require
    independent certified measurement from an accredited laboratory — self-reported
    efficiency results from non-accredited labs carry a potential error floor of ±10%,
    sufficient to misrepresent whether a technology meets commercial viability thresholds.
