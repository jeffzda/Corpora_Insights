  publish_date: 2014-08
  project_name: Smart Grid, Smart City Project (AusGrid)
  what_happened: The $100 million Australian government-funded Smart Grid, Smart City project, led by AusGrid with up to 30,000 household participants over 2010–2014, tested a range of smart grid technologies
    and gathered information on their costs and benefits in an Australian setting. The project identified the need for further work to improve how stakeholders share knowledge and experience.
  lesson_learnt: Large-scale smart grid trials should embed structured knowledge-sharing mechanisms from the outset — the Smart Grid, Smart City program's own cost-benefit assessment explicitly recommended
    that industry peak bodies improve information sharing and knowledge transfer as a follow-on priority.
