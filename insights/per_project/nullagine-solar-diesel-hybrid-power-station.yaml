- record_id: ARENA-DLV-23909
  source_title: Australia's Off-Grid Clean Energy Market Research Paper
  publish_date: '2014-10-08'
  project_name: Nullagine Solar-Diesel Hybrid Power Station
  what_happened: Horizon Power installed a solar-diesel hybrid system at Nullagine in October 2010 for $14 million (including diesel units), comprising 0.96MW diesel and 203kW solar. The system reliably
    reduced average interruption time from 110 minutes in 2009-10 to zero interruptions in 2010-11.
  lesson_learnt: Solar-diesel hybrid systems in remote communities can substantially improve power reliability as well as reduce fuel costs — the Nullagine system eliminated all interruptions in its first
    full year of operation, demonstrating that reliability concerns about integrating renewables in islanded systems are manageable at low penetration levels.
