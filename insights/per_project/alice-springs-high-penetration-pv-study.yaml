- record_id: ARENA-DLV-72214
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: null
  project_name: Alice Springs High Penetration PV Study
  what_happened: Power and Water Corporation identified that it does not own or directly
    control PV inverters connected to its network and must direct third-party owners
    or installers to change inverter settings, which may not always occur in practice
    — creating a governance risk that grows as PV penetration increases.
  lesson_learnt: Network operators that do not own or control distributed PV inverters
    face a material governance risk when system-wide setting changes are required
    — establish clear contractual or regulatory mechanisms for inverter setting control
    before PV penetration reaches levels requiring coordinated intervention.
  issue_severity: moderate
  project_type: network/grid
  project_scale_band: utility/large-scale
  lifecycle_phase: operations
  proponent_type: network business
