  - 121
  evidence_excerpt: P&W observed significant loss of PV power during several system
    frequency-drop events in 2010 and, as a result, reduced their low-frequency trip
    requirement for grid-connected PV inverters to 46Hz, below the lowest emergency
    load-shedding frequency level for the system. This was done to keep PV systems
    on-line for as long as possible during frequency-drop events to ensure the situation
    does not worsen during any rapid increase in system net load.
