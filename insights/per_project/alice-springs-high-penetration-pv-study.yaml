  technology_domain: solar PV
  source_pages: &id002
  - 121
  evidence_excerpt: Power and Water Corporation (P&W) does not own or directly control
    the PV inverters connected to its network. It must direct the PV inverter owner
    or installer to change inverter settings if required by P&W, and this may not
    always occur in practice. This issue may increase in significance as more inverters
    are connected to the network and if future system-wide inverter setting changes
    are required.
