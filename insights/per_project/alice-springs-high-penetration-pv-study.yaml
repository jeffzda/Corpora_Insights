- record_id: ARENA-DLV-72213
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: null
  project_name: Alice Springs High Penetration PV Study
  what_happened: Power and Water Corporation observed significant loss of PV power
    during system frequency-drop events in Alice Springs in 2010, caused by PV inverters
    tripping at 49.9Hz. In response, they reduced the low-frequency trip requirement
    for grid-connected PV inverters to 46Hz to keep PV systems online during frequency
    disturbances.
  lesson_learnt: In small isolated grids with high PV penetration, PV inverter low-frequency
    trip settings set too close to operational frequency (e.g. 49.9Hz) cause mass
    PV disconnection during frequency events, worsening instability — network operators
    should review and lower inverter trip thresholds to maintain PV online during
    disturbances.
  issue_severity: major
  project_type: network/grid
  project_scale_band: utility/large-scale
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Power and Water Corporation reduced the low-frequency trip requirement
    for grid-connected PV inverters from 49.9Hz to 46Hz, below the lowest emergency
    load-shedding frequency, to keep PV systems online during frequency-drop events.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id001
  - 119
