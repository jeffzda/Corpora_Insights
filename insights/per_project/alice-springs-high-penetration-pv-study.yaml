- record_id: ARENA-DLV-72215
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: null
  project_name: Alice Springs High Penetration PV Study
  what_happened: Analysis of the Alice Springs grid found that spatial dispersion
    of PV systems across the network substantially reduces the impact of cloud-induced
    intermittency on system-wide net power demand, with increasing the total number
    of spatially dispersed PV sites identified as the most effective mitigation strategy.
  lesson_learnt: Spatially dispersing PV installations across a grid — by maximising
    the number of connection sites rather than concentrating capacity — is the most
    effective operational strategy for reducing PV intermittency impacts on network
    stability without requiring storage.
  issue_severity: none
  project_type: network/grid
  project_scale_band: utility/large-scale
  lifecycle_phase: operations
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: null
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id003
  - 120
  - 121
  evidence_excerpt: A good distribution of PV systems across the network can help
    to reduce localised concentrations of PV capacity and therefore help reduce localised
    PV penetration effects. It can also help to reduce the effects on the system of
    passing clouds, particularly on the system-wide net power demand and hence the
    centralised generation system.
  confidence_note: null
