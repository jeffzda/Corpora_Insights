  evidence_excerpt: Identified a low cost solution for voltage fluctuations caused by either embedded generation or network loading. Proven, using a number of test installations the capabilities of a four
    quadrant inverter in controlling the power flow on the network in response to voltage through the use of energy storage and/or reactive power. Confirmed the modelled theory... that the voltage at the
    point of connection is able to be controlled with sub cycle response times.
