- record_id: ARENA-DLV-72251
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects - First Edition Results'
  publish_date: '2015'
  project_name: Grid Interactive Inverter program
  what_happened: Essential Energy developed and deployed a small-scale four-quadrant inverter capable of responding to voltage fluctuations caused by embedded generation or network loading. The program
    moved through prototype, field trial, and general deployment stages over approximately eight years (2008–2016), proving the technology could control voltage at the point of connection with sub-cycle
    response times.
  lesson_learnt: Small-scale four-quadrant inverters using energy storage or reactive power control are a low-cost alternative to network augmentation for managing voltage rise from embedded generation
    — network businesses facing PV-driven voltage issues should evaluate grid-interactive inverter deployment before committing to capital-intensive augmentation.
