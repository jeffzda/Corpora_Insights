- record_id: ARENA-DLV-45503
  source_title: ARENA Insights Forum Presentation Summaries & Key Points – DER Stream
  publish_date: 2019-06
  project_name: AGL Virtual Power Plant in South Australia
  what_happened: The early-stage VPP hardware market was characterised by proprietary
    protocols for interconnection via API, creating interoperability challenges across
    the fleet.
  lesson_learnt: Account for proprietary protocol fragmentation when designing VPP
    fleet management systems — the lack of industry-wide connectivity standards is
    a near-term constraint, and projects should monitor emerging standards to plan
    for future interoperability.
  issue_severity: minor
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: unvalidated integration
  outcome_class: partial success
  secondary_failure_mode: null
  intervention_note: null
  transferability: broad
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id003
  - 2
  evidence_excerpt: The early stage of the VPP hardware market is such that most players
    use proprietary protocols for interconnection via API, though this is likely appropriate
    to the early stage of the market, with industry-wide standards beginning to garner
    significant support from all market sectors.
