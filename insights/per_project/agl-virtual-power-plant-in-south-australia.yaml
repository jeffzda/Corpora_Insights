- record_id: ARENA-DLV-45501
  source_title: ARENA Insights Forum Presentation Summaries & Key Points – DER Stream
  publish_date: 2019-06
  project_name: AGL Virtual Power Plant in South Australia
  what_happened: AGL's VPP sales process revealed a significant customer knowledge
    gap regarding residential storage and VPPs, making the sales process resource-intensive
    and slowing customer uptake despite strong community interest and attractive pricing.
  lesson_learnt: Develop and distribute accessible educational material on residential
    storage and VPPs before and during the sales process — customer knowledge gaps
    make VPP sales resource-intensive and can constrain uptake even where subsidies
    and pricing are attractive.
