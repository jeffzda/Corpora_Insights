- record_id: ARENA-DLV-45502
  source_title: ARENA Insights Forum Presentation Summaries & Key Points – DER Stream
  publish_date: 2019-06
  project_name: AGL Virtual Power Plant in South Australia
  what_happened: Battery performance on the AGL VPP project was found to rely heavily
    on site metering quality, and installers proficient across multiple hardware types
    — critical for metering accuracy — were identified as rare and valuable resources.
  lesson_learnt: Prioritise correct battery metering as a key installation quality
    metric, and identify multi-hardware-proficient installers early — they are scarce
    and their absence leads to metering errors that directly degrade battery and VPP
    performance.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: construction/installation
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: execution & logistics
  outcome_class: partial success
  secondary_failure_mode: data & measurement
  intervention_note: null
  transferability: broad
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id002
  - 2
  evidence_excerpt: As a key installation quality metric, it's important to get battery
    metering right, as battery performance relies heavily on site metering. Installers
    that are proficient across multiple hardware types are highly valuable but relatively
    rare resources.
