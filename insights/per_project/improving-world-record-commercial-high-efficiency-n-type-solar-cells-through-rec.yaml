- record_id: ARENA-DLV-48101
  source_title: ARENA-Funded Cutting Edge Research in Photovoltaics
  publish_date: 2019-09
  project_name: Improving World-Record Commercial High-Efficiency n-type Solar Cells
    through Recombination Analysis and Innovative Passivation (2017/RND003)
  what_happened: Research demonstrated that light-induced degradation (LID) in n-type
    Si solar cells — previously underappreciated in the PV community — can be addressed
    by tuning hydrogen atoms to reduce defects, improving efficiencies. The techniques
    were validated at laboratory scale but had not yet been transferred to an industrial
    manufacturing setting at the time of reporting.
  lesson_learnt: When developing passivation techniques for Si PV, explicitly plan
    and resource the laboratory-to-industrial transfer step early — the gap between
    lab-demonstrated results and commercial manufacturing readiness is a distinct
    phase requiring targeted effort and industry partnership.
