- record_id: ARENA-DLV-23552
  source_title: 'Flagship Report: Large-Scale Battery Storage as an Inertia Substitute
    - Wallgrove Grid Battery'
  publish_date: '2024'
  project_name: Wallgrove Grid Battery
  what_happened: 'During the NER clause 5.3.9 alteration process to enable VMM, Lumea
    encountered a significant regulatory barrier: the existing performance standards
    of the plant effectively became minimum standards for the alteration, meaning
    the grid-forming (VMM) configuration was assessed against access standards designed
    for grid-following asynchronous generators. This created a compliance conflict,
    particularly under clause s5.2.5.5, that was not immediately resolvable.'
  lesson_learnt: When upgrading a battery from grid-following to grid-forming operation,
    engage AEMO early on the NER alteration process and seek legal/technical advice
    on how existing performance standards will be applied — the current access standards
    in Schedule 5.2 are designed for grid-following systems and can impose unintended
    constraints on grid-forming inverters, requiring renegotiation of access standard
    wording before hold-point testing can proceed.
  issue_severity: major
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: approvals/contracting
  proponent_type: network business
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: coordination & stakeholders
  intervention_note: Lumea and Transgrid sought external legal/technical advice that
    enabled alteration of the wording of clause s5.2.5.5, and demonstrated holistic
    performance improvements to AEMO, who agreed to updated access standard wording
    — this was the critical hurdle before hold-point testing could commence.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages:
  - 15
  - 16
  - 34
  - 35
  evidence_excerpt: The most significant challenge faced was that under the 5.3.9
    process, the performance standards of the existing plant effectively become the
    minimum standards that the plant must adhere to when alterations are made [clause
    5.3.4A(b)(1A), NER Version 206]. An unintended consequence of the current access
    standards in Schedule 5.2 of the NER for asynchronous generation is that a project
    with grid-forming inverter technology is assessed against access standards that
    appear more suited to asynchronous generating systems that are of a grid-following
    nature.
