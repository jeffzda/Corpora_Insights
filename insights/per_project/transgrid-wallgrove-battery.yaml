  source_title: 'TransGrid Wallgrove Grid Battery - Operations Report #4'
  publish_date: 2024-01
  project_name: Wallgrove Grid Battery
  what_happened: The proportion of negative price dispatch intervals in NSW increased
    dramatically from 2.7% (1,426 intervals) in H1 2023 to 9.9% (5,263 intervals)
    in H2 2023, a ~270% increase, yet the average energy spread and arbitrage revenue
    remained relatively consistent throughout the year.
  lesson_learnt: An increase in negative price frequency does not guarantee an increase
    in arbitrage revenue for BESS — the key driver of arbitrage value remains intra-day
    price spread volatility, not the mere prevalence of negative prices; BESS business
    cases should not conflate negative price frequency with arbitrage opportunity.
