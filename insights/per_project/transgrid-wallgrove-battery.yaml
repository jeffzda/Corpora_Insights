  source_title: Transgrid 'Wallgrove Grid Battery' Commissioning Report
  publish_date: 2022-10
  project_name: Wallgrove Grid Battery
  what_happened: Transgrid faced significant challenges implementing a cyber-secure
    networking solution to allow Tesla's proprietary Autobidder system to interface
    with Transgrid's transmission network infrastructure; a lack of specialist skilled
    personnel, combined with an internal restructure and COVID-19 restrictions, caused
    delays to the system development, and the remote maintenance connection protocol
    remained incomplete at commercial operations date.
  lesson_learnt: TNSPs undertaking BESS projects where they also own the asset should
    assess cyber security system requirements and specialist personnel risks at the
    project development stage — not during construction — to avoid delays and ensure
    all stakeholder interfaces (TNSP, market participant, OEM, market operator) are
    technically resolved before the construction phase begins.
