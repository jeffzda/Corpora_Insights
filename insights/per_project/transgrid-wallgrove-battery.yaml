  what_happened: In August 2022, AEMO MMS public data contradicted Iberdrola's internal
    revenue calculations due to a scheduling error on 10 August 2022 that caused high
    volumes of contingency FCAS to trade at the price cap for 13 dispatch intervals.
    Although prices were subsequently revised, the public database retained artificially
    high figures, making it unreliable as a sole data source for revenue reporting.
  lesson_learnt: BESS operators should maintain independent internal revenue calculations
