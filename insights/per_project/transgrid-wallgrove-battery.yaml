- record_id: ARENA-DLV-36756
  source_title: Transgrid Wallgrove Battery Lessons Learnt 1
  publish_date: 2021-04
  project_name: Wallgrove Grid Battery
  what_happened: 'As a TNSP owning a BESS but without dispatch control in the NEM,
    TransGrid encountered a complex and novel AEMO registration problem: it could
    not enter into a Connection Agreement with itself, operate the BESS in the NEM,
    or hold itself accountable for generator and customer performance standards under
    clause 5.3.4A of the NER. TransGrid had initially planned to register as owner,
    operator, and controller, which AEMO advised was inconsistent with the NER.'
  lesson_learnt: TNSPs or other network businesses owning a BESS but not controlling
    dispatch must engage AEMO early in the project to understand NER registration
    constraints — the correct structure requires an intermediary to hold Generator
    and Customer registrations while the TNSP submits an Exemption Application, and
    this structural requirement should be resolved before contracting.
  issue_severity: moderate
  project_type: storage
  project_scale_band: demonstration
  lifecycle_phase: approvals/contracting
  proponent_type: network business
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Transgrid engaged Iberdrola Australia as an intermediary market
    participant to submit generator and customer registration applications, while
    Transgrid submitted an exemption application, and the connection agreement was
    structured between Transgrid as NSP and Iberdrola Australia as intermediary.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages:
  - 8
  - 9
  - 10
  - 31
  evidence_excerpt: 'Initially TransGrid had wanted to register the Wallgrove Grid
    Battery with TransGrid as the owner, operator and controller, but AEMO advised
    that this was inconsistent with the operations of the National Electricity Rules
    (NER) as TransGrid could not: enter into a Connection Agreement with itself; operate
    the BESS in the NEM and; Could not hold itself accountable for any non-compliances
    with the Generator and Customer Performance Standards.'
  confidence_note: transferability set to narrow — this registration issue is specific
    to TNSPs owning BESS assets in the NEM context; directly transferable only to
    other network businesses in similar ownership configurations. Canonical record
    merged from 2 source records across 2 document(s).
