  what_happened: Following the introduction of very fast contingency FCAS markets,
    AEMO standardised the WGB's contingency FCAS registration to 27 MW across all
    markets, removing the previous ability to register different enablement levels
    for fast (6s), slow (60s) and delayed (5 min) markets based on the battery's superior
    fast-response capability.
