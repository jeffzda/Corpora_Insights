  source_title: 'TransGrid Wallgrove Grid Battery - Operations Report #4'
  publish_date: 2024-01
  project_name: Wallgrove Grid Battery
  what_happened: Revenue from capturing periods of increased market volatility proved
    crucial to overall financial performance, with large amounts of revenue available
    across short timeframes during shoulder periods (outside Summer and Winter) when
    thermal generators take scheduled maintenance outages, while Summer quarters produced
    comparably limited revenue opportunity.
  lesson_learnt: BESS revenue is highly concentrated in volatile shoulder periods
    driven by thermal generator outage seasons — project revenue models should weight
    these periods appropriately and ensure no daily cycle limits or availability constraints
    constrain the battery during peak volatility windows, which may be unpredictable
    in timing.
