- record_id: ARENA-DLV-32802
  source_title: Transgrid - Wallgrid grid battery - Operations report 2
  publish_date: 2023-07
  project_name: Wallgrove Grid Battery
  what_happened: The VMM connection alteration process at Wallgrove was more difficult
    than the equivalent process undertaken by ElectraNet at Hornsdale Power Reserve,
    partly because Wallgrove is in a stronger part of the network and partly because
    the original performance standard negotiated for the grid-following configuration
    in that strong network context made it harder to replicate equivalent behaviour
    using grid-forming controls.
  lesson_learnt: Network strength at the connection point materially affects the difficulty
    of transitioning a battery from grid-following to grid-forming operation — projects
    in electrically stronger parts of the network face more stringent baseline performance
    standards that become harder to meet with grid-forming controls; this should be
    assessed before committing to a VMM upgrade pathway.
