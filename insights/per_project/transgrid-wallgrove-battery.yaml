- record_id: ARENA-DLV-32807
  source_title: Transgrid - Wallgrid grid battery - Operations report 2
  publish_date: 2023-07
  project_name: Wallgrove Grid Battery
  what_happened: The energy-only capacity factor of the WGB varied significantly across
    the year (discharge capacity factor of 3.22% in Q2 versus 0.74% in Q4), driven
    by extreme energy market volatility in mid-2022 that subsequently corrected to
    historical norms. Despite this variation in energy capacity factor, active market
    intervals remained consistently high (96–98%) throughout the year, reflecting
    consistent FCAS participation.
  lesson_learnt: Single-interval price spikes that are not visible in pre-dispatch
    forecasts are difficult for BESS to capture systematically — operators should
    assess the proportion of revenue opportunity attributable to forecastable versus
    unforecastable price events when benchmarking performance, and avoid penalising
    dispatch strategies for missing inherently unpredictable spikes.
