  source_title: Transgrid - Wallgrid grid battery - Operations report 2
  publish_date: 2023-07
  project_name: Wallgrove Grid Battery
  what_happened: The WGB's co-optimised dispatch across energy, regulation FCAS, and
    contingency FCAS markets means that being fully enabled for contingency FCAS (26
    MW reserved in both directions) limits the available capacity for regulation FCAS
    to 24 MW raise and 21 MW lower simultaneously. Prioritising one market necessarily
    constrains participation in the others, creating complex bidding trade-offs for
    the operator.
  lesson_learnt: Co-optimisation constraints between energy, regulation FCAS, and
    contingency FCAS markets significantly reduce the practical simultaneous capacity
    available in each market — BESS business cases and dispatch strategies must explicitly
    model these co-optimisation trade-offs rather than assuming nameplate capacity
    is available in all markets simultaneously.
