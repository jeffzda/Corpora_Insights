  what_happened: The WGB completed approximately 270 equivalent full cycles in 2023
    (discharging ~20,000 MWh in aggregate), remaining within the cumulative cycle
    threshold required to preserve the storage degradation warranty, despite significant
    monthly variation driven by energy market arbitrage dynamics and FCAS market opportunities.
  lesson_learnt: BESS cycling warranties set a binding operational constraint that
    dispatchers must actively manage — operators should track cumulative cycles against
    warranty thresholds in real time and model the trade-off between incremental revenue
    from higher cycling and the risk of voiding degradation warranties.
