  what_happened: VMM operates faster than standard grid-following technology and responds
    to ROCOF (rate of change of frequency) rather than the magnitude of frequency
    deviation, meaning the WGB began responding before any measurable frequency change
    was captured at its power quality meter — a behaviour confirmed across all four
    real disturbance events analysed.
  lesson_learnt: VMM-equipped BESS provides a demonstrably superior frequency response
    to standard grid-following inverters by responding to ROCOF rather than frequency
    deviation magnitude — this advantage should be quantified and credited in network
    planning studies and system security assessments as a distinct, beneficial capability
    even where full synchronous inertia substitution cannot be claimed.
