  source_title: Transgrid 'Wallgrove Grid Battery' Commissioning Report
  publish_date: 2022-10
  project_name: Wallgrove Grid Battery
  what_happened: The EPC tender and contracting period for the Wallgrove Grid Battery
    was significantly longer than for traditional technology solutions because the
    BESS supplier market was immature — only a limited number of suppliers had the
    capability and risk appetite to provide a fully scoped proposal covering both
    physical supply and NEM connection/operation requirements.
  lesson_learnt: When procuring a BESS EPC contractor, ask respondents to propose
    specifications and the commercial model rather than specifying a fixed solution
    — and allow substantially more time and cost in the program for tender and contracting
    than would be required for conventional generation technology, because supplier
    market maturity for BESS in Australia remains limited.
