  what_happened: The coincident triggering of Primary Frequency Response (PFR), Fast
    Frequency Response (FFR), and VMM inertial response during real disturbance events
    made it impossible to definitively isolate and quantify the contribution attributable
    to the VMM inertial controller alone from real-time event data.
  lesson_learnt: Future trials of synthetic inertia must include a methodology for
    separating VMM inertial response from PFR and FFR contributions — consider hardware-in-the-loop
    testing or controlled isolation of individual controllers during commissioning
    tests to generate clean inertia-only response data, as real-event analysis alone
    cannot resolve this attribution problem.
