  what_happened: By going through the connections process as an asset owner rather
    than a TNSP facilitating a third-party connection, Transgrid gained direct insight
    into the complexities, delays, and process gaps its customers experience. This
    informed identification of process improvements including the development of 'how
    to' documents, templates, and guidance for future customers.
  lesson_learnt: TNSPs that have experienced the connections process from the proponent
    side are well-placed to develop practical guidance materials — 'how to' documents,
    templates, and checklists — that can meaningfully reduce connection process complexity
    and duration for future BESS proponents connecting to their network.
