- record_id: ARENA-DLV-32804
  source_title: Transgrid - Wallgrid grid battery - Operations report 2
  publish_date: 2023-07
  project_name: Wallgrove Grid Battery
  what_happened: During the June 2022 energy market suspension, the WGB was dispatched
    to discharge but could not recharge via the normal AGC process because the over-constrained
    dispatch price settled above the highest energy load bid the BESS could submit
    ($15,100/MWh). The battery was discharged to a very low state of charge, causing
    the site controller to disable AGC mode as a protective measure, which then locked
    out automated recharging. A further AGC outage recurred on 12 July 2022, taking
    the WGB out of service for approximately five hours.
  lesson_learnt: BESS control logic that disables AGC when state of charge falls below
    a threshold can create a self-reinforcing lockout during extreme market events
    — ensure manual recharge fallback procedures are clearly defined and that AGC
    re-enable logic is tested under low-SoC scenarios before commercial operations
    commence.
  issue_severity: moderate
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: commissioning/integration
  failure_mode: unvalidated integration
  outcome_class: delayed but recoverable
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: The AGC control logic was updated in mid-July 2022 to prevent
    further AGC lockouts; no AGC-related unplanned outages occurred after that update.
  transferability: broad
  delay_magnitude: <1 month
  technology_domain: battery storage
  source_pages: &id036
  - 26
  evidence_excerpt: This caused the WGB site controller to disable AGC mode. This
    was by design, to prevent the WGB from being dispatched when it did not have sufficient
    stored energy to participate in the market. Unfortunately, this also made it impossible
    for Iberdrola Australia to re-charge the battery via the normal dispatch process
    (ie via AGC), meaning the only way to re-charge was via manual dispatch. A new
    AGC outage occurred on 12 July 2022, with the WGB out of service for approximately
    five hours.
