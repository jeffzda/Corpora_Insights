- record_id: ARENA-DLV-31912
  source_title: TransGrid - Wallgrove Battery - Operations Report 3
  publish_date: 2023-07
  project_name: Wallgrove Grid Battery
  what_happened: Changes to AEMO's Market Ancillary Service Specifications, associated
    with the introduction of Very Fast Contingency FCAS markets planned for October
    2023, will standardise the registerable contingency FCAS capacity to the physical
    battery response (26MW) across all markets. Previously the WGB could register
    33MW in the fast (6s) market and 19MW in the slow (60s) market by exploiting the
    faster-than-specified response of batteries.
  lesson_learnt: BESS revenue models that rely on registering above-nameplate contingency
    FCAS capacity by exploiting fast response characteristics will need to be revised
