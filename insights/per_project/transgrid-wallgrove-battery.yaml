  lifecycle_phase: commissioning/integration
  proponent_type: network business
  delay_category: commissioning/integration
  failure_mode: regulatory & approvals
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: coordination & stakeholders
  intervention_note: Transgrid worked with AEMO and ElectraNet (which had prior Tesla
    battery experience) through ARENA knowledge-sharing processes to develop a commissioning
    test requirements document, and agreed with AEMO to reduce the number of hold
    points given the WGB's relatively small size.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id012
