- record_id: ARENA-DLV-36755
  source_title: Transgrid Wallgrove Battery Lessons Learnt 1
  publish_date: 2021-04
  project_name: Wallgrove Grid Battery
  what_happened: TransGrid initially tendered for a fully wrapped EPC plus O&M solution,
    but the supplier's performance guarantees covered only the battery units, leaving
    a gap between the assets required for a fully operational BESS and those for which
    performance was guaranteed. This misalignment between financial and physical responsibility
    for balance-of-plant assets was identified as a material project risk.
  lesson_learnt: When procuring a BESS under an EPC plus O&M model, ensure that the
    supplier's performance guarantees and maintenance obligations cover the full scope
    of assets required for a complete operational system — not just the battery units
    — so that financial and physical responsibility are closely aligned across all
    balance-of-plant components.
  issue_severity: moderate
  project_type: storage
  project_scale_band: demonstration
  lifecycle_phase: approvals/contracting
  proponent_type: network business
  delay_category: null
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated integration
  intervention_note: TransGrid modified contract terms to take direct responsibility
    for supply and maintenance of more of the balance of plant, ensuring financial
    and physical responsibility were closely aligned.
  transferability: broad
  delay_magnitude: null
  technology_domain: battery storage
  source_pages:
  - 7
  - 22
  evidence_excerpt: The scope of the O&M services and ongoing performance guarantees
    for the supplier were limited to the battery units, leaving a gap between the
    assets required for a fully operational BESS and those where performance is guaranteed
    by the supplier. Such a model was considered by Lumea to be suboptimal.
