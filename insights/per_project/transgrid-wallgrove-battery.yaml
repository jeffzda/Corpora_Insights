  project_name: Wallgrove Grid Battery
  what_happened: The WGB's VMM active power response commenced prior to any measurable
    frequency change at the power quality meter during the Bayswater trip event, demonstrating
    that the controller responds to ROCOF rather than the magnitude of frequency deviation,
    consistent with the intended VMM design.
  lesson_learnt: VMM battery controllers that respond to ROCOF rather than frequency
    magnitude can provide an earlier active power response than standard PFR/FFR controllers
    — this is a meaningful technical advantage for grid stabilisation and should be
    verified in commissioning testing and monitored through operations to confirm
    design intent is maintained.
