- record_id: ARENA-DLV-65107
  source_title: Transgrid Wallgrove Battery Lessons Learnt 2
  publish_date: '2022-01-28'
  project_name: Wallgrove Grid Battery
  what_happened: As the first grid-scale battery connected to the Transgrid network,
    and with limited NEM precedent, Transgrid's commissioning team had to build knowledge
    of battery OEM products from scratch. The PSCAD model submission and amendment
    process, commissioning hold point testing requirements, NER obligations, and AEMO
    approval processes were all novel, creating a steep learning curve across all
    parties.
  lesson_learnt: TNSPs commissioning their first grid-scale BESS should engage the
    OEM, AEMO, and experienced peer TNSPs early to develop commissioning test requirements
    and PSCAD model submission processes before the commissioning phase — relying
    on real-time learning during commissioning substantially increases schedule risk
    and resource burden.
  issue_severity: moderate
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: commissioning/integration
  proponent_type: network business
  delay_category: commissioning/integration
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: coordination & stakeholders
  intervention_note: Transgrid collaborated with AEMO and ElectraNet (which had experience
    connecting other Tesla batteries) via ARENA's knowledge-sharing processes, and
    worked with Tesla to develop a commissioning test requirements document that AEMO
    agreed with and the OEM incorporated into its Commissioning Plan.
  transferability: moderate
  delay_magnitude: not quantified
