  source_title: Transgrid 'Wallgrove Grid Battery' Commissioning Report
  publish_date: 2022-10
  project_name: Wallgrove Grid Battery
  what_happened: The Virtual Machine Mode (VMM) synthetic inertia functionality —
    the primary technical objective of the WGB pilot — had not been enabled at the
    time of commissioning in December 2021 due to ongoing GPS compliance assessments
    and a NER 5.3.9 application process with AEMO still under review; VMM testing
    was deferred to subsequent operations reports.
  lesson_learnt: Separating commercial commissioning from grid-forming capability
    registration is a viable sequencing strategy, but project teams should plan explicitly
    for the additional regulatory process time required to enable advanced inverter
    capabilities post-commissioning — at Wallgrove this added approximately 11 months
    to full capability delivery.
