  source_title: Transgrid Wallgrove Battery Lessons Learnt 1
  publish_date: 2021-04
  project_name: Wallgrove Grid Battery
  what_happened: During commercial negotiations, multiple risk allocation issues emerged
    that had not been anticipated at project outset — 'unknown unknowns' that were
    only discovered during the contracting process. This was attributed to the novelty
    and complexity of the technology and commercial model, and added time and cost
    to reaching financial close.
  lesson_learnt: Proponents of novel or complex BESS projects should explicitly budget
    additional time in the development schedule for risk issues that will only surface
    during negotiations; consider strategies to surface 'unknown unknowns' earlier
    in the development process to address them more efficiently.
