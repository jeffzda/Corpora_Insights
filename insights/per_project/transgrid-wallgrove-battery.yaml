  what_happened: The WGB is co-optimised across energy, regulation FCAS, and contingency
    FCAS markets, with nameplate capacity shared across these services. Fully enabling
    contingency FCAS (26MW) reduces available regulation raise FCAS to 24MW and regulation
    lower FCAS to 21MW. During Q1 2023, high-price energy intervals were missed because
    the battery preferred to bid into the regulation raise FCAS market.
  lesson_learnt: BESS operators should explicitly model co-optimisation trade-offs
    between energy, regulation FCAS, and contingency FCAS at the portfolio level —
    the interaction between these capacity constraints means that maximising revenue
    in one market necessarily limits participation in others, and this trade-off should
    be assessed dynamically against relative market prices.
