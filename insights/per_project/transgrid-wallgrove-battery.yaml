- record_id: ARENA-DLV-23568
  source_title: 'Flagship Report: Large-Scale Battery Storage as an Inertia Substitute
    - Wallgrove Grid Battery'
  publish_date: '2024'
  project_name: Wallgrove Grid Battery
  what_happened: The industry lacks an established framework and shared understanding
    of how much inertia VMM-equipped batteries actually provide, how to plan for it,
    and what the critical threshold for rate-of-change of response is within the first
    1–2 seconds of a disturbance — both Transgrid and Tesla hold different views on
    whether mimicking synchronous generator behaviour is necessary or sufficient.
  lesson_learnt: The industry requires further research across diverse technologies
    and larger scale demonstrations before synthetic inertia from batteries can be
    reliably substituted for synchronous inertia in system planning — individual project
    findings from one technology (Tesla VMM at 50MW) cannot be generalised to define
    the broader capability of grid-forming BESS for inertia purposes.
