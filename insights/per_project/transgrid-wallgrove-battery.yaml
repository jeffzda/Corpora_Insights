- record_id: ARENA-DLV-27405
  source_title: Transgrid 'Wallgrove Grid Battery' Commissioning Report
  publish_date: 2022-10
  project_name: Wallgrove Grid Battery
  what_happened: As the first grid-scale battery to be commissioned in the NSW transmission
    network, there was no established precedent for hold point testing requirements;
    the TNSP, AEMO, OEM, and market participant all had to develop commissioning test
    requirements collaboratively from scratch, creating a steep learning curve across
    all parties.
  lesson_learnt: Engage with AEMO and the TNSP before contract award to establish
    project-specific hold point commissioning requirements so they can be scheduled
    into the delivery program; the number of hold points can be negotiated down for
    smaller generators, which can materially accelerate commissioning.
