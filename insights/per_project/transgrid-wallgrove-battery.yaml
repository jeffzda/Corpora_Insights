    where a TNSP owns the asset but contracts a separate market participant for commercial
    dispatch, is operationally viable and can maximise battery utilisation — future
    TNSPs considering BESS should consider this model as a template for cost-effective
    delivery of network services while accessing commercial revenue streams.
