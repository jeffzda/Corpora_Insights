  what_happened: The WGB achieved 81.7% round-trip efficiency (RTE) at the 132kV transmission
    network connection point over the H2 2022 operating period. This figure includes
    losses in the 132/33kV power transformer and reflects actual operational conditions
    including auxiliary and standby losses, which differ materially from test conditions.
  lesson_learnt: BESS RTE at the transmission connection point — which includes transformer
    losses — will be materially lower than inverter-level test RTE, particularly when
    ambient conditions and auxiliary/standby loads differ from standard test conditions;
    financial models should use connection-point RTE rather than OEM test specifications.
