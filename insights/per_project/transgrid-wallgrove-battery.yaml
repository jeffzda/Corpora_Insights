- record_id: ARENA-DLV-23556
  source_title: 'Flagship Report: Large-Scale Battery Storage as an Inertia Substitute
    - Wallgrove Grid Battery'
  publish_date: '2024'
  project_name: Wallgrove Grid Battery
  what_happened: Across four real grid disturbance events analysed (Kogan Creek, Eraring,
    Loy Yang, Bayswater), the WGB operating in VMM consistently provided a slower
    and lower-magnitude active power inertial response within the first 0–500ms compared
    to an equivalent NSW synchronous generator, with the synchronous generator providing
    a substantially greater proportion of its total two-second energy injection in
    the earliest response windows.
  lesson_learnt: Battery BESS operating in VMM with compliant tuning cannot provide
    a like-for-like substitute for synchronous inertia within the critical first 200–500ms
    of a frequency disturbance at current scale — system planners should not assume
    VMM-equipped batteries will replicate synchronous inertia on a MW.s-for-MW.s basis
    in the early response window when conducting inertia adequacy assessments.
  issue_severity: major
  project_type: storage
  project_scale_band: first commercial/FOAK
