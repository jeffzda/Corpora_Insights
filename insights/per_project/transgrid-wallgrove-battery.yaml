  what_happened: 'Modelling showed that tuning VMM more aggressively to match the
    speed and magnitude of synchronous generator inertial response introduced non-compliant
    trade-offs: adverse damping post-disturbance (larger active power swings), and
    in the 340ms fault scenario the scaled-up BESS tripped and caused network instability
    due to negative power swing during under-frequency.'
  lesson_learnt: Aggressive VMM tuning to replicate synchronous inertia speed is incompatible
    with fault ride-through compliance and grid stability under the current technology
    — project teams must explicitly define and sequence the required performance objectives
    (inertia speed vs. FRT vs. damping) and accept that a single tuning set cannot
    simultaneously optimise all three with current BESS technology.
