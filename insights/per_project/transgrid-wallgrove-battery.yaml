- record_id: ARENA-DLV-32814
  source_title: Transgrid - Wallgrid grid battery - Operations report 2
  publish_date: 2023-07
  project_name: Wallgrove Grid Battery
  what_happened: The lack of precedent for the NER clause 5.3.9 connection alteration
    process for grid-forming batteries (with only Hornsdale Power Reserve having previously
    completed a similar process) and the absence of current incentive structures meant
    limited market insights were available on how smooth the alteration process would
    be, creating uncertainty about likely challenges before the process was commenced.
  lesson_learnt: Before committing to a VMM or grid-forming upgrade on an operational
    BESS, seek direct engagement with AEMO and the relevant TNSP to understand the
    full scope of the clause 5.3.9 alteration process — the absence of a well-worn
    precedent pathway and current incentive structures means project teams should
    allocate significant time and external expert resources to navigate NER compliance
    requirements.
  issue_severity: moderate
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: approvals/contracting
  proponent_type: network business
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: poor scoping
  intervention_note: Lumea established through dialogue with AEMO and ElectraNet the
    reasons why the Hornsdale process differed, which informed the approach to resolving
    the WGB's specific compliance issues.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages:
  - 15
  - 34
  evidence_excerpt: At the time of commencing this process only one other battery
    (Hornsdale Power Reserve) had gone through a similar alteration process with AEMO.
    The lack of current incentive structures and the perceived, or actual, complications
    in connection alterations have prevented more operational batteries from undertaking
    a similar alteration. As such there were limited market insights on how smooth
    the connection alteration would be, and whether challenges would arise in relation
    to either specific clauses in the NER or the AEMO connection process.
