  what_happened: Transgrid had never previously prepared a generator/load for FCAS
    market participation. Before lodging the connection enquiry, Transgrid proactively
    held discussions with AEMO to understand FCAS technical requirements, equipment
    needs, registration, and testing processes — a step the document states would
    have caused significant project delay if not taken.
  lesson_learnt: Network businesses entering the BESS market as asset owners should
    engage AEMO on FCAS registration and testing requirements before lodging the connection
    enquiry — failure to do so risks missing the contractual date for commencement
    of commercial operations by the market participant.
