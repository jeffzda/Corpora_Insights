    Australia lease) — was innovative but required considerable time and resources
    to finalise, with costs progressively increasing through the development journey
    as all parties gained a better understanding of the BESS capability and stakeholder
    roles; funding was also reduced during contract development, making the final
    business model quite different from the original concept.
