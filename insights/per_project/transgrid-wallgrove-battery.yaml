- record_id: ARENA-DLV-36753
  source_title: Transgrid Wallgrove Battery Lessons Learnt 1
  publish_date: 2021-04
  project_name: Wallgrove Grid Battery
  what_happened: TransGrid negotiated twelve separate contracts with four counterparties
    (ARENA, NSW Government, a regulated revenue counterparty, and Infigen) to fund
    the Wallgrove Grid Battery, with contract terms up to ten years. All contracts
    had to be drafted in parallel and aligned across three companies' commercial interests
    and two grant funding bodies, creating substantial complexity, cost, and delay
    in reaching financial close.
  lesson_learnt: Minimise the number of counterparties in pilot project commercial
    structures wherever possible — each additional counterparty adds significant cost
    and complexity to reaching financial close. Future network BESS projects supported
    by regulated funding alone can eliminate grant-funding counterparties and substantially
    reduce contracting burden.
