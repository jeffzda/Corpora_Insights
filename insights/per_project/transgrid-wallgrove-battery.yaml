  what_happened: During initial scoping of Transgrid's first BESS, the secondary system
    design integration scope was not clearly defined when engaging the market. Items
    not included in requirements included the local control and monitoring facility,
    integration with Transgrid's HMI, and Power Plant Controller capabilities required
    to comply with AEMO requirements — leading to scope gaps, increased project costs,
    and potential delays.
  lesson_learnt: For a TNSP delivering its first BESS, the secondary system design
    scope — including local control and monitoring, HMI integration, and AEMO-compliant
    Power Plant Controller requirements — must be fully defined before market engagement
    to avoid scope gaps that increase project costs and risk delays.
