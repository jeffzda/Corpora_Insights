- record_id: ARENA-DLV-58302
  source_title: 'TransGrid Wallgrove Grid Battery - Operations Report #4'
  publish_date: 2024-01
  project_name: Wallgrove Grid Battery
  what_happened: Across multiple grid disturbance events (Loy Yang and Bayswater trips),
    the WGB's VMM active power response was proportionally slower in the first 200–500
    ms compared to a NSW synchronous generator, with the synchronous machine providing
    2.4% of its 2-second energy response within 200 ms versus only 0.6% for the WGB
    in the Loy Yang event.
  lesson_learnt: Virtual machine mode battery response, while faster than standard
    grid-following technology, is slower than synchronous generator inertial response
    in the critical first 200–500 ms window — planners should not assume VMM BESS
    can fully substitute for synchronous inertia at sub-second timescales without
    further investigation at scale.
