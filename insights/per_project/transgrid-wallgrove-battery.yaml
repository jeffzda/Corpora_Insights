  project_name: Wallgrove Grid Battery
  what_happened: Transgrid observed that Synchronous Condensers (Syncons) can provide
    inertial responses equivalent to synchronous generators, but unlike BESS or synchronous
    generators, Syncons have no ongoing energy delivery capability after the inertial
    response is exhausted. Without a Power Oscillation Damper (POD), Syncons may also
    generate larger post-disturbance oscillations than BESS.
  lesson_learnt: When comparing inertia solutions for network investment decisions,
    planners should distinguish between Syncons (which provide strong but energy-limited
    inertial response and may require POD to control oscillations) and BESS with VMM
    (which provides sustained energy delivery and more flexible active power control)
    — neither is universally superior and the choice depends on the specific network
    service requirement.
