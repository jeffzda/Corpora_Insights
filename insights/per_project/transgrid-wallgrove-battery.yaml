  what_happened: The WGB's VMM controller showed non-linear active power response
    during frequency disturbances, with the direction of active power not consistently
    aligned with ROCOF polarity at multiple points in the frequency trend, suggesting
    the controller may be simultaneously attempting to satisfy both inertial response
    and absolute frequency deviation objectives.
  lesson_learnt: System planners and network operators should not assume that VMM
    inertial response can be modelled with the same linear ROCOF-to-power relationship
    as synchronous machines — planning tools and inertia adequacy assessments must
    account for the non-linear and potentially unpredictable response characteristics
    of grid-forming BESS under real disturbance conditions.
