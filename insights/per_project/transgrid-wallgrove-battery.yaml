- record_id: ARENA-DLV-65110
  source_title: Transgrid Wallgrove Battery Lessons Learnt 2
  publish_date: '2022-01-28'
  project_name: Wallgrove Grid Battery
  what_happened: The Wallgrove Grid Battery's commercial and funding framework — involving
    ARENA grants, NSW Government grants, a regulatory network service component, and
    a commercial market participant (Iberdrola) — was highly complex. Project costs
    progressively increased as all parties gained a better understanding of BESS capability
    and stakeholder roles, and grant funding was reduced during development, resulting
    in a final business model substantially different from the original concept.
  lesson_learnt: BESS projects reliant on multiple government grant streams and a
    split between network services and market services should anticipate that the
    commercial and contract framework will require significant time and resources
    to finalise, and that cost and scope will evolve materially as capability understanding
    matures — budget contingency and contract flexibility should reflect this.
