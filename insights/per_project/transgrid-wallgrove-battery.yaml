  what_happened: The hybrid commercial model — combining regulated network service
    revenue (inertia, FFR) with unregulated market revenue (energy, FCAS) dispatched
    by a separate market participant (Iberdrola Australia) — operated successfully
    in H2 2022, with less than 5% of energy storage capacity reserved for network
    services and the remaining capacity available for commercial market participation.
