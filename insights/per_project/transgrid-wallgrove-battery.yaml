  what_happened: The WGB demonstrated that reserving less than 5% of energy storage
    capacity for network inertia services did not materially constrain commercial
    energy and FCAS market participation. The battery operator found that the inertia
    requirement overlapped with its preferred commercial use of the battery in a complementary
    way.
