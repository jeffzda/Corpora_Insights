  what_happened: Assessment of the WGB's revenue from a standalone asset perspective
    was found to be misleading because Iberdrola manages the battery as part of a
    broader renewable energy portfolio. During high-price energy intervals, the battery's
    state of charge was sometimes reserved to backstop the portfolio's contracted
    position if intermittent generation fell, rather than discharging into the spot
    market.
  lesson_learnt: Financial performance reporting and revenue benchmarking for commercial
    BESS should be assessed at the portfolio level rather than as a standalone asset
    — interpreting dispatch decisions and revenue capture rates without visibility
    of the operator's broader contracted position will generate misleading conclusions
    about battery optimisation performance.
