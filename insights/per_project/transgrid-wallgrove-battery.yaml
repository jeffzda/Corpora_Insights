- record_id: ARENA-DLV-32817
  source_title: Transgrid - Wallgrid grid battery - Operations report 2
  publish_date: 2023-07
  project_name: Wallgrove Grid Battery
  what_happened: During periods of high energy price volatility, the WGB's energy-constrained
    nature made it difficult to bid optimally into energy market intervals marginally
    above $1,000/MWh because forecasting uncertainty meant it was often preferable
    to conserve state of charge for potentially higher-priced future intervals. Additionally,
    when Iberdrola's renewable portfolio was covering its contracted position, the
    battery SoC was reserved as a hedge against intermittency.
  lesson_learnt: Co-optimisation between energy and FCAS markets means that extreme
    price capture rates in either market will always be constrained by the other —
    operators and investors should model expected high-price capture rates accounting
    for co-optimisation and maintenance scheduling conflicts rather than assuming
    the battery can fully capture all extreme price events in any single market.
