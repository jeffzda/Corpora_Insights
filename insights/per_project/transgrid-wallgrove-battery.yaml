  source_title: Transgrid - Wallgrid grid battery - Operations report 2
  publish_date: 2023-07
  project_name: Wallgrove Grid Battery
  what_happened: VMM was enabled on 23 November 2022 only after completing the NER
    clause 5.3.9 alteration process — making the WGB only the second battery in the
    NEM (after Hornsdale Power Reserve) to go through this process. On 25 December
    2022, the WGB successfully provided an inertial response of approximately 4.5
    MW (delivering approximately 4.1 MWs of inertia over ~2.46 seconds) to a 260 MW
    generation loss event, demonstrating immediate response consistent with synthetic
    inertia behaviour.
  lesson_learnt: A grid-forming BESS with VMM enabled can successfully deliver a measurable
    inertial response to real grid disturbance events — this provides empirical validation
    that synthetic inertia from batteries can substitute for declining mechanical
    inertia from retiring synchronous generators, supporting the business case for
    including LSBS in regulatory investment submissions.
