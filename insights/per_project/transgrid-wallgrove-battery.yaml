  what_happened: Under existing NER obligations, AEMO does not believe there is a
    credible risk of NSW islanding alone and has not declared inertia shortfalls,
    making it difficult for Transgrid to proactively procure inertia services even
    though its own analysis indicates that when all coal retires in NSW there will
    be very little reliable inertia remaining.
  lesson_learnt: TNSPs seeking to proactively address future inertia shortfalls from
    coal retirements face a regulatory gap under current NER obligations — engage
    with AEMC rule change processes (specifically 'Improving security frameworks for
    the energy transition') and build the evidence base now, as the regulatory trigger
    for proactive inertia procurement is not expected until approximately 2027.
