  source_title: Transgrid - Wallgrid grid battery - Operations report 2
  publish_date: 2023-07
  project_name: Wallgrove Grid Battery
  what_happened: During H2 2022, the WGB's revenue was split almost equally across
    energy (26%), raise regulation FCAS (24.7%), lower regulation FCAS (25.1%), and
    contingency FCAS (24.2%), returning to the historical convention for NEM battery
    revenue distribution after an atypical energy-dominated period in Q2 2022. This
    distribution closely matched the operating experience of Iberdrola's Lake Bonney
    BESS.
  lesson_learnt: Under normal NEM market conditions (outside of extreme volatility
    events), grid-scale BESS revenue is split roughly evenly across energy arbitrage,
    regulation FCAS, and contingency FCAS — operators and investors entering the NEM
    should use this distribution as a baseline rather than modelling heavy reliance
    on energy arbitrage alone, and should validate dispatch strategy assumptions against
    comparable operating assets.
