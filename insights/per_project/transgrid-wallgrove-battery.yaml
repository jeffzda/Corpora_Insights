- record_id: ARENA-DLV-31903
  source_title: TransGrid - Wallgrove Battery - Operations Report 3
  publish_date: 2023-07
  project_name: Wallgrove Grid Battery
  what_happened: Tesla's Virtual Machine Mode (VMM) was enabled on 23 November 2022
    and H1 2023 was the first full reporting period in which VMM could be observed
    responding to real network disturbances. Across three major generator trip events
    (Mt Piper Unit 2, Eraring Unit 1, Kogan Creek), the WGB responded immediately
    to ROCOF, whereas prior to VMM enablement the battery response commenced approximately
    600ms after event initiation.
  lesson_learnt: Virtual Machine Mode (grid-forming synthetic inertia) demonstrably
    reduces battery response latency from ~600ms to near-instantaneous ROCOF response;
    project teams deploying BESS for inertia services should prioritise VMM or equivalent
    grid-forming capability and allow a full operational period before drawing conclusions
    on tuned parameter interactions.
