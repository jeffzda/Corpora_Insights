  evidence_excerpt: The industry would benefit from further research across a diverse
    range of technologies to better understand the trade-offs and operational limitations
    that must be considered for each specific project when substituting inertia from
    synchronous machines with synthetic inertia. As the synthetic inertial response
    is provided by the control system of a battery, the inertial response can be affected
    by the control structure and filter tunings. This means that conclusions on virtual
    inertia response cannot be drawn exclusively from one specific model within one
    technology.
