- record_id: ARENA-DLV-36758
  source_title: Transgrid Wallgrove Battery Lessons Learnt 1
  publish_date: 2021-04
  project_name: Wallgrove Grid Battery
  what_happened: At the time of project development, all utility-scale BESS operating
    in Australia were underpinned by substantial grant funding from state governments
    and/or ARENA, because securing revenue from networks for network services had
    not yet been established as a viable commercial pathway. The Wallgrove Grid Battery's
    costs progressively increased through development as all parties gained a better
    understanding of BESS capability, and funding was reduced through the journey,
    making the final business model substantially different from the original concept.
  lesson_learnt: Early-stage BESS business cases should be treated as provisional
    — costs are likely to increase and funding amounts may be revised as the commercial
    model matures; build explicit flexibility into the business model and maintain
    stakeholder alignment on a changing cost and funding profile throughout development.
