- record_id: ARENA-DLV-36751
  source_title: Transgrid Wallgrove Battery Lessons Learnt 1
  publish_date: 2021-04
  project_name: Wallgrove Grid Battery
  what_happened: During tendering, TransGrid found that while multiple suppliers could
    respond, very few could demonstrate a comprehensive understanding of how a BESS
    would connect to and operate in the NEM while meeting AEMO's requirements. The
    supplier market for grid-scale BESS in Australia was immature, with limited depth
    of capable and risk-willing providers.
  lesson_learnt: When procuring a grid-scale BESS that must connect to and operate
    in the NEM, do not assume sufficient supplier depth exists — structure the tender
    to invite respondents to propose their own specifications and commercial model,
    and build in additional time for an extended tender and contracting period given
    the immaturity of the BESS supplier market.
