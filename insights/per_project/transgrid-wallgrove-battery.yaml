  source_title: TransGrid - Wallgrove Battery - Operations Report 3
  publish_date: 2023-07
  project_name: Wallgrove Grid Battery
  what_happened: Across all three observed frequency events, the WGB's fast frequency
    response (FFR) component was dominant over the inertial response component from
    VMM. The inertial energy release was small relative to the total energy release
    in each event (e.g. 1.46MWs inertial vs. 39MWs total in Event 1; 2.08MWs inertial
    vs. 18.85MWs total in Event 2; 1.41MWs inertial vs. 48.92MWs total in Event 3).
  lesson_learnt: When deploying VMM for synthetic inertia, project teams should be
    aware that FFR droop settings will dominate the battery's frequency response;
    the inertial constant alone does not determine inertial response since control
    structure and filter tunings also affect it — conclusions on virtual inertia cannot
    be drawn from a single technology or parameter set.
