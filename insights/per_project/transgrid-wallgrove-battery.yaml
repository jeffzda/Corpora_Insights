- record_id: ARENA-DLV-32803
  source_title: Transgrid - Wallgrid grid battery - Operations report 2
  publish_date: 2023-07
  project_name: Wallgrove Grid Battery
  what_happened: 'The VMM settings had to be tuned to meet the pre-existing generator
    performance standards (GPS) negotiated for grid-following operation, resulting
    in a trade-off: the final inertia constant (H=1 MWs/MVA) and damping factor (D=0.9)
    did not represent optimal tuning for inertia provision, and modelling showed slower
    active power recovery time and reactive current settling time compared to what
    a more optimally-tuned grid-forming system could offer.'
  lesson_learnt: When registering a grid-forming BESS under NER processes that anchor
    on pre-existing grid-following performance standards, the approved tuning parameters
    may be sub-optimal for the inertia service the project is designed to provide
    — future projects should seek regulatory reform or project-specific waivers before
    locking in tuning, or design the initial GPS with grid-forming operation in mind
    from the outset.
  issue_severity: moderate
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: approvals/contracting
  proponent_type: network business
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Transgrid contributed input to the AEMC rule change process ('Efficient
    reactive current access standards for inverter-based resources') which was identified
    as likely to address the underlying regulatory issue.
  transferability: moderate
  delay_magnitude: null
  technology_domain: battery storage
  source_pages:
  - 16
  - 35
  evidence_excerpt: The primary objective in determining the final settings was to
    demonstrate that the previously agreed GPS (negotiated for a grid-following configuration)
    could be met as required by the NER, although it should be emphasised that this
    resulted in a trade-off in performance in some areas where a more optimal tuning
    of the virtual machine could have been offered for provision of inertia services.
