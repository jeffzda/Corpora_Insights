- record_id: ARENA-DLV-5155
  source_title: LIDAR for Wind Forecasts End of Project Report
  publish_date: '2021-03-05'
  project_name: LIDAR for Wind Forecasts Project
  what_happened: Significant seasonal non-stationarity in the wind climate at Kiata
    Wind Farm meant that ML models trained on the full annual dataset performed poorly
    due to within-year variability, while models trained on short 2–3 month windows
    performed poorly due to insufficient data volume — creating a fundamental tension
    in model training strategy.
  lesson_learnt: Wind forecasting ML models at sites with strong seasonal wind variability
    require multi-year training datasets spanning multiple annual cycles; projects
    with measurement campaigns shorter than 3–4 years should treat ML model accuracy
    as provisional and budget for extended data collection before any commercial deployment
    decision.
