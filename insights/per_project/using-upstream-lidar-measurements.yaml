- record_id: ARENA-DLV-5151
  source_title: LIDAR for Wind Forecasts End of Project Report
  publish_date: '2021-03-05'
  project_name: LIDAR for Wind Forecasts Project
  what_happened: The project investigated whether upstream LIDAR measurements could
    improve five-minute-ahead wind farm forecasts. Despite successful data collection
    and ML model development, the accuracy improvement from including upstream LIDAR
    measurements was only 2–2.5% RMSE reduction, which was insufficient to justify
    commercial development of a forecast product.
  lesson_learnt: 'Before investing in upstream measurement infrastructure for short-horizon
    wind forecasting, conduct an upfront economic analysis: even a 3–4% RMSE improvement
    with 3–4 LIDAR units is unlikely to generate sufficient commercial value to recover
    equipment and operational costs at a small wind farm.'
