  project_name: LIDAR for Wind Forecasts Project
  what_happened: Curtailment and individual turbine outages during the operational
    forecast period significantly degraded forecast accuracy — when these factors
    were included in the forecast submitted to the AEMO API, accuracy fell to roughly
    the same level as the existing AWEFS benchmark forecast, eliminating most of the
    LIDAR-derived improvement.
  lesson_learnt: Wind farm forecasting systems intended for AEMO market submission
    must explicitly account for curtailment and turbine outage signals; failure to
    incorporate these factors can negate the accuracy gains achieved under clean evaluation
    conditions and render a technically superior model commercially uncompetitive.
