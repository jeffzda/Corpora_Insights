- record_id: ARENA-DLV-5157
  source_title: LIDAR for Wind Forecasts End of Project Report
  publish_date: '2021-03-05'
  project_name: LIDAR for Wind Forecasts Project
  what_happened: ML algorithms trained on raw (unfiltered) 1-minute wind data containing
    high random components learned to predict persistence rather than actual wind
    changes, degrading forecast skill. Applying a multi-point running mean filter
    (Hamming window) to the training data resolved the issue and allowed the models
    to train properly.
  lesson_learnt: When training ML wind forecast models on high-frequency data, apply
    a smoothing filter optimised for the target forecast horizon before training —
    using raw data with high entropy at the target time scale causes the model to
    revert to persistence and suppresses genuine predictive skill.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: A multi-point running mean filter with a Hamming window was applied
    to the training data; filter length was optimised to minimise forecast RMSE, balancing
    noise removal against signal retention.
  transferability: moderate
  delay_magnitude: null
  technology_domain: wind
  source_pages: &id007
  - 12
  evidence_excerpt: Filtering the data with a multi-point running mean filters eliminated
    much of the randomness and allowed the ML algorithm to train properly... The length
    of the filter was optimized to give the lowest forecast RMSE. Using too long a
    filter, though resulting in less randomness, tends to remove some of the signal
    that we are trying to forecast. Using too short a filter (or no filter at all)
    tends to get in the way of proper training of the ML algorithm.
  confidence_note: null
