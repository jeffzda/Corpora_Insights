- record_id: ARENA-DLV-5152
  source_title: LIDAR for Wind Forecasts End of Project Report
  publish_date: '2021-03-05'
  project_name: LIDAR for Wind Forecasts Project
  what_happened: Ideal upstream measurement conditions — wind blowing directly along
    a line between a LIDAR and a turbine at the right speed — existed only 3–6% of
    the time across all turbines when both LIDARs were included, limiting the practical
    benefit of the upstream measurement approach.
  lesson_learnt: When designing upstream wind measurement schemes, calculate the fraction
    of time that wind trajectories will pass through both the measurement point and
    a turbine before committing to hardware — if this fraction is below ~5%, RMSE
    gains will likely be under 2% and the approach may not be economically viable.
