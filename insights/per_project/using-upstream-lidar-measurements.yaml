  what_happened: The economic model developed to assess commercial viability of the
    LIDAR-enhanced forecasting system contained substantial uncertainty, to the point
    where even a 10% forecast improvement could not be confidently determined to be
    sufficient to support a commercial forecasting business — leaving the go/no-go
    decision unresolvable with available data.
