- record_id: ARENA-DLV-71851
  source_title: 'Windlab Limited - LIDAR for Wind Forecasts Lessons Learnt Report
    #1'
  publish_date: 2019-10
  project_name: Windlab Limited - LIDAR for Wind Forecasts Project
  what_happened: Early analysis at the Kiata Wind Farm demonstrated that atmospheric
    randomness (turbulence) substantially degrades the performance of time-series
    wind-speed prediction algorithms, with turbulence levels varying diurnally — strongest
    during daytime heating periods — making naive forecast approaches unreliable.
  lesson_learnt: Any 5-minute wind or generation forecast algorithm must explicitly
    model and accommodate diurnal variation in atmospheric turbulence; failing to
    separate signal from noise in upstream measurements will reduce forecast skill
    to little better than a persistence forecast regardless of algorithm sophistication.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Applied a wavelet filter to LIDAR wind-speed measurements to
    separate turbulent noise from the predictable signal, achieving near-Gaussian
    residuals and providing a basis for skill improvement in forecast algorithms.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: wind
  source_pages: &id016
  - 2
