- record_id: ARENA-DLV-5156
  source_title: LIDAR for Wind Forecasts End of Project Report
  publish_date: '2021-03-05'
  project_name: LIDAR for Wind Forecasts Project
  what_happened: Spectral analysis of 1-minute SCADA and LIDAR samples revealed that
    at the 2–10 minute time scales targeted by the forecast, wind signals have a large
    random component (high entropy), which by definition is not predictable. This
    fundamental characteristic of the wind signal imposed a hard ceiling on achievable
    forecast accuracy.
  lesson_learnt: Five-minute-ahead wind forecasting projects should conduct spectral
    analysis of the target signal before selecting a forecast approach — high entropy
    at the target time scale indicates a physical predictability ceiling that no algorithm
    or additional upstream measurement can overcome, and this should be factored into
    the commercial viability assessment at project inception.
  issue_severity: major
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: wind
  source_pages: &id006
  - 11
  - 12
  evidence_excerpt: Spectral analysis of this data showed that at between 0.5Hz and
    0.1Hz (motions with periods between 2 and 10 minutes – a range surrounding the
    period for which we wish to forecast), the motions had a large random component.
    Near midday when surface heating is strongest and helps to create turbulent motions,
    even in winter months, wind measurements contain significant randomness (entropy).
    This means that, by definition, much of the signal at these time scales is not
    predictable.
