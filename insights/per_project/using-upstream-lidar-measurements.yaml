- record_id: ARENA-DLV-71854
  source_title: 'Windlab Limited - LIDAR for Wind Forecasts Lessons Learnt Report
    #1'
  publish_date: 2019-10
  project_name: Windlab Limited - LIDAR for Wind Forecasts Project
  what_happened: The project identified a knowledge gap in understanding the time
    scales of turbulent motions under varying atmospheric conditions, which is required
    before forecast algorithms can be appropriately tuned to filter turbulent noise;
    this gap prevented algorithm development work from commencing within the initial
    reporting period.
  lesson_learnt: Before applying forecast algorithms to short-term wind prediction,
    dedicated effort must be invested in characterising turbulent time-scale distributions
    under varied atmospheric conditions — proceeding to algorithm selection without
    this understanding risks over-fitting to noise and underperforming against a simple
    persistence baseline.
  issue_severity: minor
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: data/validation/testing
  failure_mode: no major failure stated
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Project resequenced to complete turbulent time-scale characterisation
    before progressing to forecast algorithm selection and testing.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: wind
  source_pages: &id019
  - 3
  evidence_excerpt: Understanding the time scales associated with turbulent motions
    under various atmospheric conditions is likely to be key to being able to appropriately
    filter out their effects and increasing the accuracy of the 5-minute forecast.
    Given this understanding, as the project moves forward the focus will turn to
    applying this understanding to a number of forecast algorithms to determine the
    most appropriate to the task.
  confidence_note: issue_severity minor — this is a sequencing gap identified mid-project
    rather than a failure; no schedule quantification available.
