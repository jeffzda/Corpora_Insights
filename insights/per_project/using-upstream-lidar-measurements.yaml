  source_title: Windlab Limited - LIDAR for Wind Forecasts Lessons Learnt 2
  publish_date: 2020-04
  project_name: LIDAR for Wind Forecasts
  what_happened: Raw RMSE/MAE accuracy metrics from machine learning forecast algorithms
    were significantly degraded by edge cases and a mismatch between 4-second and
    1-minute sampling times, causing error scores to be much worse than anticipated
    when evaluated against AEMO's error calculation methodology.
  lesson_learnt: Build a validation framework that replicates the target operational
    environment (e.g. AEMO's error calculation methodology) before using raw algorithm
    metrics to assess forecast performance — mismatches in sampling frequency and
    edge cases can substantially degrade apparent accuracy and mislead algorithm selection.
