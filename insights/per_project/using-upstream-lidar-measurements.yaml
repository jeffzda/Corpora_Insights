  source_title: LIDAR for Wind Forecasts End of Project Report
  publish_date: '2021-03-05'
  project_name: LIDAR for Wind Forecasts Project
  what_happened: The ML training dataset contained a large overrepresentation of zero
    production-ratio values (persistence cases) at the Kiata Wind Farm, where 31%
    of operating time had output below 5% or above 95% of rated power — significantly
    above the 26% average for seven comparable wind farms in the region. Left unfiltered,
    this caused the model to learn persistence rather than genuine change predictions.
  lesson_learnt: Before training ML wind forecast models, analyse the production-ratio
    distribution of the specific wind farm and filter out near-persistence training
    points — sites with high proportions of time at curtailment limits or near rated
    output require more aggressive filtering to prevent the model defaulting to a
    persistence forecast.
