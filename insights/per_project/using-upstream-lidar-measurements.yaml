- record_id: ARENA-DLV-71852
  source_title: 'Windlab Limited - LIDAR for Wind Forecasts Lessons Learnt Report
    #1'
  publish_date: 2019-10
  project_name: Windlab Limited - LIDAR for Wind Forecasts Project
  what_happened: Analysis of LIDAR placement at Kiata Wind Farm revealed that the
    geographic coverage pattern of any single LIDAR measurement position varies significantly
    across even a small wind farm, meaning the initial northern LIDAR placement provided
    little direct turbine coverage, and one or both LIDARs were planned for relocation
    after four months.
  lesson_learnt: LIDAR placement must be determined through spatial probability analysis
    of wind transport paths before installation — coverage of all turbines varies
    significantly with position, and deploying movable platforms allows iterative
    optimisation rather than committing to sub-optimal fixed positions.
