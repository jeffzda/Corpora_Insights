- record_id: ARENA-DLV-71853
  source_title: 'Windlab Limited - LIDAR for Wind Forecasts Lessons Learnt Report
    #1'
  publish_date: 2019-10
  project_name: Windlab Limited - LIDAR for Wind Forecasts Project
  what_happened: The project confirmed that upstream LIDAR measurements at ~3 km separation
    successfully captured wind-speed signals that arrived at downstream turbines approximately
    5 minutes later, validating the physical principle underpinning the 5-minute ahead
    forecast approach.
  lesson_learnt: Upstream LIDAR placement at a distance matching the 5-minute wind-transport
    distance (approximately wind speed in m/s × 300 seconds) is a viable basis for
    short-term wind generation forecasting; investing in high-quality multi-level
    LIDAR measurements up front is critical to characterising atmospheric processes
    before developing forecast algorithms.
