- record_id: ARENA-DLV-15302
  source_title: Windlab Limited - LIDAR for Wind Forecasts Lessons Learnt 2
  publish_date: 2020-04
  project_name: LIDAR for Wind Forecasts
  what_happened: The project found that backtracking wind trajectory methods using
    turbine nacelle measurements can accurately produce trajectory probability density
    maps to identify optimal upstream LIDAR measurement locations, and that these
    results are largely equivalent to forward-tracking methods — removing the need
    for an iterative measure-and-move approach.
  lesson_learnt: Use turbine-based backtracking trajectory methods to select upstream
    measurement locations before installing any devices; this avoids costly iterative
    repositioning and performs equivalently to forward-tracking, provided measurements
    span a full year or are statistically corrected for seasonality.
