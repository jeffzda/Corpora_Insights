- record_id: ARENA-DLV-69202
  source_title: A Roadmap for Decarbonising Australian Alumina Refining
  publish_date: 2022-11
  project_name: Alcoa Renewable Powered Electric Calcination Pilot – Pinjarra Alumina Refinery
  what_happened: In April 2022, Alcoa announced a first-of-a-kind electric calcination demonstration at its Pinjarra Alumina Refinery, with $8.6 million from ARENA and $1.7 million from the WA Clean Energy
    Fund. Stage 1 involves a 140 kW field pilot (200 kg/h calcination capacity) and Stage 2 a 1,400 kW field pilot (2,000 kg/h capacity).
  lesson_learnt: For capital-intensive, first-of-a-kind industrial electrification pilots, securing co-funding from both federal (ARENA) and state (WA Clean Energy Fund) sources and structuring delivery
    in two escalating pilot stages reduces financial exposure and allows techno-economic learnings from the smaller stage to inform the larger one.
