- record_id: ARENA-DLV-25931
  source_title: Review of ARENA's Reliability Portfolio
  publish_date: 2020-01
  project_name: ARENA Reliability Portfolio — ASTRI Mid-Term Review
  what_happened: A 2016 mid-term review of the Australian Solar Thermal Research Institute
    (ASTRI) by an ARENA-appointed Review Panel recommended that attention be turned
    to projects moving CSTP technology through scale-up demonstrations to deployment.
    Despite this recommendation, no new solar thermal demonstration projects within
    the reliability portfolio were commenced by ARENA following the review, creating
    a gap between the recommended direction and actual funding action.
  lesson_learnt: Mid-term programme reviews that produce specific recommendations
    for reorienting investment should be followed up with concrete funding decisions
    within a defined timeframe; review recommendations that are not acted upon represent
    a governance failure that can allow technology programmes to remain misaligned
    with their stated goals for extended periods.
