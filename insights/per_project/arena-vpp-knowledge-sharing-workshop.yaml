  project_name: ARENA VPP Knowledge Sharing Workshop
  what_happened: Customer misconceptions were being actively propagated in the VPP
    market — specifically the expectation of a zero electricity bill and automatic
    backup power from ESS — which workshop participants identified as damaging to
    industry credibility and long-term development.
  lesson_learnt: VPP program operators must proactively correct unrealistic customer
    expectations (zero bills, automatic backup) at the point of sale and installation
    — allowing these misconceptions to persist damages industry credibility and increases
    churn when outcomes fall short.
