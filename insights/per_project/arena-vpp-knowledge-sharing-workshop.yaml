  publish_date: 2019-03
  project_name: ARENA VPP Knowledge Sharing Workshop
  what_happened: The return on investment for residential ESS was approximately 10
    years at best, roughly equivalent to system life, meaning financial incentives
    alone were insufficient to drive customer decisions to purchase batteries or enter
    VPPs in 2019.
  lesson_learnt: VPP and ESS programs should be designed to appeal to non-financial
    customer motivations (environmental contribution, self-sufficiency, clean technology
    interest) rather than relying solely on financial ROI — the current payback period
    does not stack up as a standalone value proposition.
