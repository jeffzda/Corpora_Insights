  source_title: ARENA's Virtual Power Plant Knowledge Sharing Workshop Summary
  publish_date: 2019-03
  project_name: ARENA VPP Knowledge Sharing Workshop
  what_happened: Workforce capacity for ESS installation was identified as a binding
    constraint on VPP rollout, with workshop attendees noting it takes 12 or more
    months to train a qualified electrician to be competent in ESS installations,
    and that retention in the industry was also an ongoing problem.
  lesson_learnt: Program designers should factor workforce training lead times (12+
    months to competency) and retention risk into rollout timelines for ESS and VPP
    programs — treating skilled labour as an abundant resource will produce schedule
    shortfalls.
