  source_title: EnergyAustralia South Australian Pumped Hydro Energy Storage (PHES)
    Feasibility Study
  publish_date: 2017-09
  project_name: Cultana Pumped Hydro Project
  what_happened: AEMO indicated that variable speed motor-generators, which can only
    provide synthetic rather than real inertia, could be precluded from participating
    in any future inertia market or procurement process; the consortium therefore
    selected fixed speed motor-generators at a saving of approximately 20% capital
    cost premium, accepting a narrower operational range.
  lesson_learnt: PHES developers should confirm with AEMO the eligibility rules for
    future inertia market participation before selecting motor-generator type — at
    Cultana, choosing fixed speed over variable speed avoided an approximately 20%
    capital cost premium and preserved eligibility for real inertia markets, which
    are the ancillary service most in short supply in South Australia.
