    finalising financial models — at Cultana, the unresolved classification of pump
    load versus generation liability created a $6M+ annual revenue swing that could
    not be modelled with confidence, highlighting that regulatory clarity on energy
    storage under the RET is a prerequisite for investment-grade feasibility.
