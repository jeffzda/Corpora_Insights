  what_happened: The feasibility study identified that applying PHES technology to
    seawater introduces specific technical challenges — including corrosion management
    and salinity treatment — that require dedicated engineering solutions and careful
    materials selection not required for freshwater PHES.
  lesson_learnt: Seawater PHES projects must treat corrosion management and materials
    selection as first-order engineering problems from the concept stage; the Cultana
    study demonstrated these challenges are addressable but require explicit design
    attention distinct from conventional freshwater pumped hydro.
