  publish_date: 2017-09
  project_name: Cultana Pumped Hydro Project
  what_happened: The AEMO-imposed constraint limiting SA wind output to 1,200MW when
    insufficient synchronous generation is online was identified as a market constraint
    that Cultana SPHES could materially alleviate — the project's synchronous generation
    at the Davenport substation would likely make this constraint non-binding, unlocking
    constrained wind generation and creating a non-network alternative to new interconnectors.
  lesson_learnt: PHES developers in regions with AEMO-imposed wind curtailment constraints
    should quantify the market value of releasing those constraints as an additional
    revenue stream — at Cultana, the ability to provide synchronous generation at
    Davenport was assessed as likely to remove the SA-wide 1,200MW wind cap, creating
    value for wind generators and strengthening the PHES business case beyond pure
    arbitrage.
