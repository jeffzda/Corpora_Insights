- record_id: ARENA-DLV-24002
  source_title: EnergyAustralia South Australian Pumped Hydro Energy Storage (PHES)
    Feasibility Study
  publish_date: 2017-09
  project_name: Cultana Pumped Hydro Project
  what_happened: The Cultana SPHES capital cost estimate of $477 million (±30% accuracy)
    equates to approximately $2.1 million/MW, placing it at the upper end of comparable
    freshwater pumped hydro projects due to a 3.3km penstock, extensive marine screening
    structures, shoreline powerhouse construction, and seawater-resistant coatings
    and alloys.
  lesson_learnt: Seawater PHES sites with long penstock runs and complex marine interfaces
    carry a material capital cost premium over freshwater equivalents — project developers
    should explicitly model the incremental marine construction costs (penstock length,
    marine works, special alloys) and ensure cost estimates reach at least pre-FEED
    accuracy (±15%) before seeking project financing, as the ±30% accuracy typical
    of concept design is insufficient for lenders.
