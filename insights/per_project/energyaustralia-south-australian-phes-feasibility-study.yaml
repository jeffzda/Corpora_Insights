  what_happened: Community briefings in Port Augusta generated queries focused on
    noise, night lighting, marine impacts, inlet/outlet exclusion zones, aesthetics
    of the powerhouse structure, and employment — issues that had not been fully resolved
    at the feasibility stage and were deferred to the next project phase.
  lesson_learnt: For coastal or near-community PHES projects, community engagement
    should be initiated at feasibility stage and planned responses to predictable
    community concerns (noise, lighting, marine impacts, visual amenity, employment)
    should be prepared before public briefings — deferring these to a later phase
    risks eroding community confidence.
