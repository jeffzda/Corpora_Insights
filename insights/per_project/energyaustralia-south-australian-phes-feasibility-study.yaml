- record_id: ARENA-DLV-24017
  source_title: EnergyAustralia South Australian Pumped Hydro Energy Storage (PHES)
    Feasibility Study
  publish_date: 2017-09
  project_name: Cultana Pumped Hydro Project
  what_happened: For PHES systems with storage duration exceeding approximately 2
    hours, the capital cost per kWh is approximately one-third that of utility-scale
    lithium-ion batteries (at 2017 prices), making PHES the more economical technology
    for large-scale, long-duration storage, while batteries outperform PHES for durations
    under 1–2 hours and offer faster frequency response (6 seconds vs 60 seconds).
  lesson_learnt: Technology selection between PHES and batteries should be based on
    required storage duration and ancillary service profile — PHES is economically
    superior for durations above 2 hours and provides real inertia and system restart
    services unavailable from batteries, while batteries are preferable for sub-2-hour
    applications and 6-second frequency response; the two technologies should be treated
    as complementary rather than competing in integrated renewables firming design.
