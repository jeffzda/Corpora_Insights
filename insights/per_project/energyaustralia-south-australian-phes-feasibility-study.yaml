- record_id: ARENA-DLV-24003
  source_title: EnergyAustralia South Australian Pumped Hydro Energy Storage (PHES)
    Feasibility Study
  publish_date: 2017-09
  project_name: Cultana Pumped Hydro Project
  what_happened: The only global precedent for large-scale seawater PHES — the 30MW
    Yanbaru plant in Okinawa, Japan — was decommissioned in 2016 after 12 years of
    commercial operation due to changes in network requirements, not technical failure;
    it had demonstrated ten years of fault-free operation with minimal material erosion,
    no corrosion, and negligible biofouling, but was built at approximately $10 million/MW
    as an R&D undertaking.
  lesson_learnt: Developers of seawater PHES can draw confidence from Yanbaru's technical
    track record (no corrosion or biofouling after 10 years), but must design around
    the commercial risk that network requirements can change over the asset's life
    — the Yanbaru precedent shows that seawater PHES can be decommissioned for commercial
    rather than technical reasons, underscoring the importance of long-term offtake
    or network service agreements.
