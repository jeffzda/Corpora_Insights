  project_name: Cultana Pumped Hydro Project
  what_happened: 'The feasibility study identified five discrete workstreams required
    before a final investment decision could be made: detailed engineering design,
    a complete environmental impact assessment, securing land access arrangements,
    securing a grid connection, and securing revenue streams — none of which had been
    resolved at feasibility stage.'
  lesson_learnt: Feasibility studies for utility-scale PHES should explicitly map
    the post-feasibility workstreams (detailed engineering, EIA, land access, grid
    connection, revenue agreements) and schedule them in parallel where possible,
    as each represents a separate critical path that could independently prevent a
    final investment decision.
