- record_id: ARENA-DLV-31608
  source_title: Cultana Pumped Hydro Project Feasibility Study - ARENA Final Report
  publish_date: 2017-09
  project_name: Cultana Pumped Hydro Project
  what_happened: The feasibility study identified that seawater PHES could be deployed
    widely across Australia, particularly where freshwater resources are limited,
    but noted that at the time of the study only one other seawater PHES project existed
    globally (Yanbaru, Japan), highlighting the very limited reference class for cost
    and performance benchmarking.
  lesson_learnt: Feasibility studies for seawater PHES in Australia should explicitly
    account for the near-absence of global reference projects when developing cost
    estimates and revenue assumptions — the Yanbaru project in Japan is the only comparable
    operational facility, meaning cost and performance data carry significant uncertainty.
  issue_severity: moderate
  project_type: storage
  project_scale_band: demonstration
  lifecycle_phase: concept/feasibility
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
