  source_title: EnergyAustralia South Australian Pumped Hydro Energy Storage (PHES)
    Feasibility Study
  publish_date: 2017-09
  project_name: Cultana Pumped Hydro Project
  what_happened: Scenario modelling demonstrated that a low gas price environment
    had the most negative impact on PHES revenue (as peak prices set by gas generators
    determine the ceiling for arbitrage value), while an additional 200MW of batteries
    in the market also materially eroded arbitrage revenue by compressing peak pricing
    events.
  lesson_learnt: PHES revenue models must include a low gas price scenario and a battery
    market penetration scenario as stress tests — at Cultana, these were the two most
    damaging scenarios for project revenue, and a project that is viable only under
    high gas prices or low battery penetration carries significant stranded asset
    risk as both gas prices fall and battery costs decline.
