  publish_date: 2017-09
  project_name: Cultana Pumped Hydro Project
  what_happened: The SA EPA required marine water exchange velocities to be kept at
    or below 0.15m/s to allow small marine organisms to swim away from the intake,
    which necessitated a large and expensive marine intake/outlet structure (approximately
    18m wide rock-lined tailrace extending 50m from shore) and was a significant driver
    of capital cost above comparable freshwater PHES.
  lesson_learnt: Seawater PHES developers should obtain the applicable EPA marine
    intake velocity limits early in concept design and directly cost their impact
    on the intake/outlet structure — at Cultana, the 0.15m/s SA EPA requirement drove
    a disproportionate share of marine works cost and should be treated as a non-negotiable
    design constraint from the outset rather than a detail resolved in detailed engineering.
