  publish_date: 2017-09
  project_name: Cultana Pumped Hydro Project
  what_happened: If the pumping load were classified as a large load subject to Transmission
    Use of System (TUoS) charges, the project would face an estimated $15 million
    per annum liability — effectively rendering it unviable — but the appropriate
    regulatory treatment was unresolved at the time of the study.
  lesson_learnt: Developers of large grid-connected storage assets should seek early
    written clarification from AEMO, AEMC, and AER on whether the storage pumping
    load attracts separate TUoS charges — at Cultana, an adverse ruling could add
    $15M/year in charges, which would be fatal to project viability; this regulatory
    ambiguity must be resolved before FID.
