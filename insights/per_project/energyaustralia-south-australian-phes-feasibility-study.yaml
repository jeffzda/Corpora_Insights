  source_title: EnergyAustralia South Australian Pumped Hydro Energy Storage (PHES)
    Feasibility Study
  publish_date: 2017-09
  project_name: Cultana Pumped Hydro Project
  what_happened: The existing Australian PHES plants (Tumut 3, Wivenhoe, Shoalhaven)
    were developed with water management as a primary consideration alongside hydroelectricity,
    making them poor reference cases for new-entrant off-river PHES systems where
    energy storage is the sole purpose; greenfield PHES systems face materially different
    development challenges and cost structures.
  lesson_learnt: New-entrant PHES developers should not use legacy Australian PHES
    assets (Tumut 3, Wivenhoe, Shoalhaven) as cost or design benchmarks — these were
    built for water management with electricity as a secondary benefit, and their
    development profiles, approval pathways, and cost structures are not representative
    of greenfield off-river systems; international off-river PHES projects are more
    appropriate comparators.
