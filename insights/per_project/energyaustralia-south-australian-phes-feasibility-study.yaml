- record_id: ARENA-DLV-24005
  source_title: EnergyAustralia South Australian Pumped Hydro Energy Storage (PHES)
    Feasibility Study
  publish_date: 2017-09
  project_name: Cultana Pumped Hydro Project
  what_happened: The maximum plant capacity of 225MW was constrained by the largest
    available steel pipe diameter (3.3m internal diameter) that could be transported
    and meet the required 40 bar gauge hydrostatic test pressure — this physical supply
    chain limit determined the system ceiling rather than market or engineering optimisation.
  lesson_learnt: PHES developers should confirm maximum available penstock pipe diameters
    and pressure test rig capacities with pipeline vendors early in design, as these
    supply chain constraints can become binding capacity limits — at Cultana, the
    3.3m pipe diameter ceiling fixed the project at 225MW and ruled out a two-turbine
    design without moving to a more expensive tunnelled penstock.
