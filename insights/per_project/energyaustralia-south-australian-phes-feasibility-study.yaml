  what_happened: Spot market arbitrage revenue per MW was found to decline with increasing
    plant capacity, meaning that the larger the PHES project, the lower the revenue
    per MW as the plant's own dispatch increasingly dampens the price differentials
    it is trying to exploit.
  lesson_learnt: PHES developers should model the 'large machine' impact of their
    project on spot prices — the small machine assumption used in initial historical
    arbitrage analysis will systematically overstate revenue for projects of 100MW
    or more in a regional NEM market, and the degree of revenue cannibalisation increases
    with plant size; for SA, the analysis found declining revenue per MW above approximately
    100MW.
