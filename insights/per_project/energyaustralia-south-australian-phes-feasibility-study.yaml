- record_id: ARENA-DLV-24025
  source_title: EnergyAustralia South Australian Pumped Hydro Energy Storage (PHES)
    Feasibility Study
  publish_date: 2017-09
  project_name: Cultana Pumped Hydro Project
  what_happened: The project below 100MW was assessed as non-viable due to insufficient
    economies of scale relative to fixed civil construction costs, while capacity
    above 250MW carried the risk of the storage being too large for the SA market
    with declining revenue per unit of capacity — the 225MW optimum was the maximum
    achievable within available pipe size constraints.
  lesson_learnt: PHES feasibility studies should explicitly model the lower and upper
    viability boundaries for plant capacity given fixed civil cost floors and market
    saturation effects — at Cultana, 100MW was the minimum viable scale and 250MW
    the market ceiling, with the optimum determined by a supply chain constraint;
    this bounding analysis should be a standard feasibility deliverable for any new
    PHES project in a regional NEM market.
  issue_severity: none
