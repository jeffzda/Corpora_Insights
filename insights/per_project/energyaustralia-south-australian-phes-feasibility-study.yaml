- record_id: ARENA-DLV-24013
  source_title: EnergyAustralia South Australian Pumped Hydro Energy Storage (PHES)
    Feasibility Study
  publish_date: 2017-09
  project_name: Cultana Pumped Hydro Project
  what_happened: Revenue modelling showed that spot price arbitrage revenue in South
    Australia is highly volatile year-to-year, ranging from near-zero in years of
    wholesale oversupply to high levels following coal-fired generator retirements,
    and that the value of storage increases with storage duration up to approximately
    6–8 hours before diminishing returns set in.
  lesson_learnt: PHES feasibility studies should model at least 15 years of historical
    spot price data and multiple forward scenarios to capture revenue volatility —
    at Cultana, single-year revenue estimates were highly misleading, and only multi-year
    averaging across the 2000–2017 period provided a reliable basis for investment
    analysis; the 6–8 hour storage duration was found to be the economic optimum for
    the SA market.
