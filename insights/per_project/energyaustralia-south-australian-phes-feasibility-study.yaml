  intervention_note: null
  transferability: narrow
  delay_magnitude: null
  technology_domain: pumped hydro
  source_pages: &id031
  - 5
  evidence_excerpt: There is limited deployment of seawater PHES, with Yanburu being
    the only other project. Australia could become the only seawater PHES and therefore
    become a key research centre into the technology.
  confidence_note: issue_severity rated moderate because limited reference class directly
    contributes to unresolved cost/revenue uncertainty flagged elsewhere in the document.
