- record_id: ARENA-DLV-31602
  source_title: Cultana Pumped Hydro Project Feasibility Study - ARENA Final Report
  publish_date: 2017-09
  project_name: Cultana Pumped Hydro Project
  what_happened: The feasibility study found the seawater PHES project technically
    and economically feasible across a range of scenarios, with a post-tax nominal
    rate of return of 8–12%, but identified that significant residual uncertainty
    in both costs and revenues remained and that a large further body of work would
    be required before a final investment decision.
  lesson_learnt: A seawater PHES feasibility study should quantify IRR sensitivity
    across capital cost (±20%) and multiple revenue scenarios before seeking investment
    decisions — the Cultana study found an 8–12% IRR range that is borderline against
    private sector hurdle rates, meaning small adverse movements in gas prices or
    additional battery competition could render the project unviable without concessional
    support.
