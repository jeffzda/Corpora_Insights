- record_id: ARENA-DLV-24004
  source_title: EnergyAustralia South Australian Pumped Hydro Energy Storage (PHES)
    Feasibility Study
  publish_date: 2017-09
  project_name: Cultana Pumped Hydro Project
  what_happened: The Yanbaru seawater PHES plant achieved ten years of fault-free
    operation with only low signs of material erosion, no corrosion, and little biofouling,
    attributed to the use of fibre-reinforced plastic pipelines, austenitic stainless
    steel pump-turbine runners, and impermeable reservoir lining — but this performance
    came at a capital cost of approximately $10 million/MW.
  lesson_learnt: Material selection is the primary technical lever for managing seawater
    corrosion and biofouling in SPHES; the Yanbaru precedent demonstrates that these
    risks are manageable but at significant capital cost premium — subsequent projects
    should use Yanbaru's material specifications as a lower-bound benchmark and seek
    cost-reduction opportunities through modern coatings and anti-fouling systems
    used in desalination plants.
