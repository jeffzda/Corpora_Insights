- record_id: ARENA-DLV-24021
  source_title: EnergyAustralia South Australian Pumped Hydro Energy Storage (PHES)
    Feasibility Study
  publish_date: 2017-09
  project_name: Cultana Pumped Hydro Project
  what_happened: The selection of the Cultana site was driven by a 2014 coastal analysis
    by MEI and Arup across the entire South Australian coastline; Cultana offered
    the highest elevation, shortest distance to the 275kV Davenport substation (the
    strategic connection point for northern SA), low environmental impact, and non-arable
    land for the upper reservoir — a Marginal Loss Factor close to unity was an additional
    advantage.
  lesson_learnt: Systematic multi-criteria coastal screening studies (elevation, grid
    proximity, environment, land tenure) are the appropriate method for identifying
    viable seawater PHES sites, and a location at a major substation connection point
    (rather than a mid-line tap) provides both a near-unity MLF and reduced connection
    cost — these criteria should be formalised into site selection frameworks for
    future seawater PHES development across Australia.
