  project_name: International Engagement Program (IEP) – Off-grid MI Challenge (UNSW)
  what_happened: The UNSW Off-grid MI Challenge project leveraged IEP relationships to develop deep collaborative partnerships with stakeholders in Papua New Guinea, Vanuatu, and Fiji, delivering workshops
    with government, industry, utilities, and community stakeholders in PNG and securing additional funding from the Clean Energy Solutions Centre and International Solar Alliance.
  lesson_learnt: International engagement funding that supports relationship-building can catalyse follow-on collaboration and co-funding well beyond the original program scope — projects should be encouraged
    to actively pursue formalised agreements (such as MOUs) to consolidate relationships developed through participation in international programs.
