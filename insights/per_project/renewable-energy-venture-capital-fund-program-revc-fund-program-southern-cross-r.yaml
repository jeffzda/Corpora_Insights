- record_id: ARENA-DLV-11158
  source_title: Renewable Energy Venture Capital Fund Evaluation Report
  publish_date: '2019'
  project_name: Renewable Energy Venture Capital Fund Program (REVC Fund Program)
    / Southern Cross Renewable Energy Fund (SCRE Fund)
  what_happened: The unstable Australian policy environment for renewable energy —
    particularly regarding the Renewable Energy Target and carbon pricing — dampened
    investor appetite and confidence during the life of the SCRE Fund, though not
    sufficiently to prevent continued investment.
  lesson_learnt: RE VC programs must be structured with sufficient patience capital
    and long fund lifespans (10–15 years) to withstand policy instability — short-horizon
    funds in a volatile RE policy environment are likely to see deal flow and co-investor
    confidence deteriorate materially during periods of policy uncertainty.
  issue_severity: moderate
  project_type: multi-technology/hybrid
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: operations
  proponent_type: government/public-sector body
  delay_category: approvals/regulatory
  failure_mode: commercial & market
  outcome_class: partial success
  secondary_failure_mode: regulatory & approvals
  intervention_note: The SCRE Fund's 13-year lifespan and patient capital structure
    enabled it to continue finding investable deals and willing co-investors despite
    the shifting policy landscape.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: other
  source_pages: &id008
  - 11
  evidence_excerpt: The policy environment for RE in Australia has been unstable during
    the life of the SCRE Fund, particularly in relation to the Renewable Energy Target
    and carbon pricing. At times this may have dampened investor appetite and confidence,
    but over the long-term it has not been sufficient to prevent continued investment
    in the sector.
