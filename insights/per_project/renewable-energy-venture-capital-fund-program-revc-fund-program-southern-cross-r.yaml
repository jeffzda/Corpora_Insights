  source_title: Renewable Energy Venture Capital Fund Evaluation Report
  publish_date: '2019'
  project_name: Renewable Energy Venture Capital Fund Program (REVC Fund Program)
    / Southern Cross Renewable Energy Fund (SCRE Fund)
  what_happened: The quality of deal flow from the Australian RE sector was variable,
    partially constraining the SCRE Fund's ability to find investable opportunities.
    The overall quality of early-stage RE start-ups and management teams was inconsistent.
  lesson_learnt: Government-backed RE VC programs should complement fund investment
    with sector-level capacity building — improving entrepreneur skills, management
    capability, and start-up quality — to increase the volume and quality of investable
    deal flow rather than relying solely on the fund manager to develop the pipeline.
