  outcome_class: delayed but recoverable
  secondary_failure_mode: null
  intervention_note: Over time, and following a fund restructure, investor objectives
    became better aligned and the working relationship between ARENA, the Fund Manager
    and the co-investor became strong.
  transferability: moderate
