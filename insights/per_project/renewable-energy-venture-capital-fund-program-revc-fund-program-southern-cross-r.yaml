  project_name: Renewable Energy Venture Capital Fund Program (REVC Fund Program)
    / Southern Cross Renewable Energy Fund (SCRE Fund)
  what_happened: Active investment management by the SCRE Fund's Fund Manager — including
    guidance, networks, and connections to strengthen management teams, attract follow-on
    capital, and develop strategic relationships — was consistently valued by portfolio
    companies and viewed as a major positive outcome not available through traditional
    grant funding.
  lesson_learnt: Where ARENA programs target early-stage companies, VC equity structures
    with experienced active fund managers deliver additive value beyond capital injection
    that grant mechanisms cannot replicate — proponent capability uplift through hands-on
    management support should be weighted as a core program outcome, not a side benefit.
