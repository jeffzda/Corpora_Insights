- record_id: ARENA-DLV-11156
  source_title: Renewable Energy Venture Capital Fund Evaluation Report
  publish_date: '2019'
  project_name: Renewable Energy Venture Capital Fund Program (REVC Fund Program)
    / Southern Cross Renewable Energy Fund (SCRE Fund)
  what_happened: The SCRE Fund's internationalisation strategy — designed to foster
    innovation and link markets in the US, China, and Australia — achieved mixed results.
    It was more successful in bringing non-Australian technology into the Australian
    market than in exporting Australian technology overseas.
  lesson_learnt: Future RE VC programs with internationalisation strategies should
    design explicit mechanisms and milestones for export market development, not just
    inbound technology attraction; without these, the strategy is likely to default
    to import-focused outcomes.
