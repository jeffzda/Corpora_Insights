- record_id: ARENA-DLV-11161
  source_title: Renewable Energy Venture Capital Fund Evaluation Report
  publish_date: '2019'
  project_name: Renewable Energy Venture Capital Fund Program (REVC Fund Program)
    / Southern Cross Renewable Energy Fund (SCRE Fund)
  what_happened: The REVC Fund Program lacked a formal knowledge sharing mandate,
    limiting the systematic capture and dissemination of lessons from the SCRE Fund's
    experience with RE start-ups to the broader Australian RE sector.
  lesson_learnt: Future ARENA VC fund programs should include an explicit knowledge
    sharing mandate and associated activities — the Fund Manager's networks, conferences,
    and engagement with non-investable companies represent an underutilised channel
    for sector-level capacity building that should be formalised and resourced.
