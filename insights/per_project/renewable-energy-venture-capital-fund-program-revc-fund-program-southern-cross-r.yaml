- record_id: ARENA-DLV-11152
  source_title: Renewable Energy Venture Capital Fund Evaluation Report
  publish_date: '2019'
  project_name: Renewable Energy Venture Capital Fund Program (REVC Fund Program)
    / Southern Cross Renewable Energy Fund (SCRE Fund)
  what_happened: SBCVC held a major and direct role in vetting deals and investment
    decision-making, meaning investee companies had to negotiate with two separate
    investment committees. This created inefficiencies, extra negotiation rounds,
    and uncertainty for portfolio companies.
  lesson_learnt: For future similar public-private VC funds, it is preferable for
    the Fund Manager to manage capital at arms-length from primary investors — dual
    investment committee structures impose material inefficiencies and uncertainty
    on investee companies. This preference should however be weighed against the ability
    to secure larger capital pools and desired market reach.
