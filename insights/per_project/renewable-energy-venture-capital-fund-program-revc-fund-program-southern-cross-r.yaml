- record_id: ARENA-DLV-11151
  source_title: Renewable Energy Venture Capital Fund Evaluation Report
  publish_date: '2019'
  project_name: Renewable Energy Venture Capital Fund Program (REVC Fund Program)
    / Southern Cross Renewable Energy Fund (SCRE Fund)
  what_happened: In the early years of the SCRE Fund, differences in the alignment
    of interests among the parties — including expected returns, risk appetite, and
    the types of investable companies — contributed to a slower pace of investment
    than targeted.
  lesson_learnt: For public-private co-investment VC arrangements, clear upfront negotiation
    and dialogue is needed to align differing investor objectives from the outset
    — misalignment of interests in the early stages will slow investment pace and
    reduce program effectiveness.
