  source_title: Renewable Energy Venture Capital Fund Evaluation Report
  publish_date: '2019'
  project_name: Renewable Energy Venture Capital Fund Program (REVC Fund Program)
    / Southern Cross Renewable Energy Fund (SCRE Fund)
  what_happened: The REVC Fund Program's portfolio reporting had inconsistencies in
    accuracy, completeness, and relevance of indicators relative to program objectives.
    Reported indicators were not always well-aligned with the REVC Fund Program's
    stated objectives.
  lesson_learnt: For VC fund programs, ARENA should establish clear, objective-aligned
    reporting indicators and quality controls on fund manager reports from the outset
    — misaligned or inconsistently reported metrics undermine the ability to monitor
    and evaluate program success.
