- record_id: ARENA-DLV-11157
  source_title: Renewable Energy Venture Capital Fund Evaluation Report
  publish_date: '2019'
  project_name: Renewable Energy Venture Capital Fund Program (REVC Fund Program)
    / Southern Cross Renewable Energy Fund (SCRE Fund)
  what_happened: The SCRE Fund achieved a small positive return of 4% across its two
    exited investments, slightly below the Australian Investment Council's median
    return of 4.02% for all Australian VC funds. The overall portfolio performance
    was approximately breakeven at a multiple of cost of 0.98.
  lesson_learnt: Government-backed RE VC funds should be assessed against tailored
    benchmarks rather than general VC benchmarks — RE VC is atypical due to higher
    capital intensity, longer investment timeframes, lower return expectations, and
    impact objectives; applying standard VC return expectations will create misleading
    performance assessments.
  issue_severity: minor
  project_type: multi-technology/hybrid
