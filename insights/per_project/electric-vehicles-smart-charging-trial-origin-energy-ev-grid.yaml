  source_title: Insights from Smart Charging Trials Data (Update)
  publish_date: '2023-08-02'
  project_name: Electric Vehicles Smart Charging Trial (Origin Energy / EV Grid)
  what_happened: Regional trial participants exhibited materially higher charging
    load requirements than urban participants, reflecting greater typical driving
    distances in regional areas.
  lesson_learnt: Network planners and program designers should treat regional EV customers
    as a distinct segment with higher per-vehicle charging load — urban-calibrated
    assumptions will underestimate regional network impacts.
