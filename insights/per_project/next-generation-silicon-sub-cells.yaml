- record_id: ARENA-DLV-41654
  source_title: Next Generation Silicon Sub-cells for High Efficiency III-V/Si Multi-Junction
    Solar Cells
  publish_date: '2019-08-28'
  project_name: Next Generation Silicon Sub-cells for High Efficiency III-V/Si Multi-Junction
    Solar Cells
  what_happened: An unplanned additive textured Polydimethylsiloxane (PDMS) layer
    was introduced during the project and found to significantly improve device performance
    by enhancing light trapping, also offering the potential to reduce III-V layer
    thickness. This approach was not in the original project scope.
  lesson_learnt: In early-stage photovoltaic R&D projects, allow process flexibility
    for unplanned additive approaches — the PDMS texturing layer, discovered opportunistically,
    delivered meaningful performance gains applicable across multiple device architectures
    beyond the original project scope.
