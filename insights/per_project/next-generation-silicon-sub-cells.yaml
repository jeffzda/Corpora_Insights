- record_id: ARENA-DLV-41653
  source_title: Next Generation Silicon Sub-cells for High Efficiency III-V/Si Multi-Junction
    Solar Cells
  publish_date: '2019-08-28'
  project_name: Next Generation Silicon Sub-cells for High Efficiency III-V/Si Multi-Junction
    Solar Cells
  what_happened: Integration of a room-temperature metal contacting technique (developed
    in a separate ARENA-funded project) with III-V/Si structures produced only modest
    performance due to unrelated handling and processing issues, rather than any fundamental
    barrier in the technique itself.
  lesson_learnt: When transferring a technique developed in one project context into
    a new device architecture, budget for additional process integration effort —
    handling procedures and process flows may require substantial refinement before
    the imported technique performs as expected in the new configuration.
