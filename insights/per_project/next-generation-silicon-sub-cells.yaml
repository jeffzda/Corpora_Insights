  evidence_excerpt: An unexpected highlight for the project was the improvement of
    performance using an additive textured Polydimethylsiloxane (PDMS) layer to improve
    performance... The additive layer was not originally planned, but offers advantages
    in that the thickness of the III-V device may also be reduced due to the enhanced
    light path length in the device.
