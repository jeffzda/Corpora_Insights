- record_id: ARENA-DLV-41652
  source_title: Next Generation Silicon Sub-cells for High Efficiency III-V/Si Multi-Junction
    Solar Cells
  publish_date: '2019-08-28'
  project_name: Next Generation Silicon Sub-cells for High Efficiency III-V/Si Multi-Junction
    Solar Cells
  what_happened: Use of silicon substrates thinner than 200 microns to reduce material
    usage caused substrate bowing during fabrication, reducing device yield. Managing
    strain build-up in the full III-V/Si structure was identified as a critical and
    underestimated fabrication challenge.
  lesson_learnt: When designing III-V/Si multi-junction devices with thin silicon
    substrates (below 200 microns), strain management and substrate bowing must be
    explicitly planned for in the process flow — these issues directly limit device
    yield and require dedicated process optimisation before thin-substrate approaches
    can deliver reliable output.
  issue_severity: moderate
  project_type: generation
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Identified strain build-up and substrate bowing as the root cause
    of yield loss; ongoing work planned to refine processing of thin-substrate structures.
  transferability: narrow
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id002
  - 4
  - 6
  evidence_excerpt: The results have shown that management of the strain build up
    in the full structure will be an important parameter to control during the fabrication.
    High quality material has been found to be possible, there are, however, downstream
    issues to resolve to produce a greater yield of devices due to bowing of the substrates.
  confidence_note: null
