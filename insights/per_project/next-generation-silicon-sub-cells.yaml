- record_id: ARENA-DLV-41651
  source_title: Next Generation Silicon Sub-cells for High Efficiency III-V/Si Multi-Junction
    Solar Cells
  publish_date: '2019-08-28'
  project_name: Next Generation Silicon Sub-cells for High Efficiency III-V/Si Multi-Junction
    Solar Cells
  what_happened: 'During III-V deposition on silicon substrates, severe degradation
    of silicon minority carrier lifetime was observed, posing a major barrier to high-performance
    III-V/Si multi-junction solar cell fabrication. The degradation was found to have
    two distinct causes: activation of grown-in defects from heating the substrate,
    and contamination within the deposition chamber. Existing remedies reported in
    the literature were found to be inconsistent and sometimes ineffective.'
  lesson_learnt: When subjecting silicon substrates to high-temperature III-V deposition,
    perform a high-temperature anneal before processing begins and apply a silicon
    nitride layer on the rear of the silicon prior to deposition — this combination
    prevents both grown-in defect activation and chamber contamination, the two independent
    causes of minority carrier lifetime degradation. Projects working with silicon
    at elevated temperatures should anticipate this dual-cause mechanism rather than
    relying on single-remedy approaches from the literature.
  issue_severity: major
  project_type: generation
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: data & measurement
  intervention_note: Conducted targeted annealing experiments and cross-checked silicon
    substrates at multiple facilities; identified that a high-temperature pre-anneal
    combined with a silicon nitride rear layer resolves the degradation, with simpler
    alternatives being investigated to reduce process complexity.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id001
  - 8
  - 9
  evidence_excerpt: We then used the exact same procedure as employed in a report
    that suggested silicon nitride layers on the rear of the silicon prevents contamination
    during III-V processing. We still observed a degradation... Our results showed
    unambiguously that the presence of grown-in defects could also catastrophically
    degrade silicon performance. This led us to the conclusion that the degradation
    is due to two reasons, grown-in defect activation from simply heating the substrate,
    plus contamination in the deposition chamber.
  confidence_note: delay_category set to data/validation/testing as the issue manifested
    during experimental characterisation work; lifecycle_phase set to development/design
    as this occurred during the early fabrication development phase of the research
    project.
