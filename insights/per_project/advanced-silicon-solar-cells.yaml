- record_id: ARENA-DLV-46102
  source_title: Advanced Silicon Solar Cells by DESIJN (Deposited Silicon Junctions)
  publish_date: '2019-06-27'
  project_name: Advanced Silicon Solar Cells by DESIJN
  what_happened: The project identified a sputtering-based deposition method with in-situ doping for poly-silicon contacts that offers cost and safety advantages over standard methods, providing an industrially
    viable alternative pathway for efficiency improvement without increased production cost.
  lesson_learnt: When selecting a fabrication approach for technology transfer to an industrial partner, prioritise methods with demonstrated cost and safety advantages over standard industry methods —
    these are more likely to be adopted at the partner's pilot line and reduce barriers to commercialisation.
