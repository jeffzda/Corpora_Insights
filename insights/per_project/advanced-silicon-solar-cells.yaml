- record_id: ARENA-DLV-46101
  source_title: Advanced Silicon Solar Cells by DESIJN (Deposited Silicon Junctions)
  publish_date: '2019-06-27'
  project_name: Advanced Silicon Solar Cells by DESIJN
  what_happened: At the halfway point of the project, ANU successfully fabricated 23% efficient p-type solar cells using a boron-doped poly-silicon rear contact deposited via a low-cost sputtering method
    with in-situ doping, demonstrating proof-of-concept before planned transfer to Jinko Solar pilot lines.
  lesson_learnt: In university-to-industry technology transfer projects, structuring the work as explicit sequential phases — proof-of-concept and development at the research institution first, then transfer
    to industrial pilot lines — allows technical risk to be retired before committing partner manufacturing resources.
