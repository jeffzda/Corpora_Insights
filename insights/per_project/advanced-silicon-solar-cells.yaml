- record_id: ARENA-DLV-36851
  source_title: DESIJN Advanced Silicon Solar Cells Final Report
  publish_date: 2021-09
  project_name: Advanced Silicon Solar Cells by DESIJN (Deposited Silicon Junctions)
  what_happened: ANU and Jinko Solar successfully co-developed industrially-compatible phosphorus-doped poly-silicon passivating contact (TOPCon) technology, achieving certified cell efficiencies of 25.25%
    on full-sized cells in Jinko's pilot lines, with Jinko intending to move the technology to mass production.
  lesson_learnt: Embedding an industry partner (here, a top-three global PV manufacturer) directly in the R&D programme from the outset — with technology transfer to their own pilot lines — accelerates
    translation from bench-scale results to production-ready processes and de-risks the commercialisation pathway.
