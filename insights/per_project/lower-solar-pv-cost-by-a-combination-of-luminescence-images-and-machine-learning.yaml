- record_id: ARENA-DLV-44052
  source_title: Lower Solar PV Cost by a Combination of Luminescence Images and Machine-Learning
    Report
  publish_date: 2023-02
  project_name: Advanced Silicon - Lower photovoltaic cost by a combination of luminescence
    images and machine-learning
  what_happened: Existing image quality metrics were found to be inadequate for accurately
    quantifying reconstructed super-resolution luminescence images in relation to
    human visual perception, creating a knowledge gap that limits rigorous evaluation
    of ML-based image enhancement methods.
  lesson_learnt: Projects applying ML-based image super-resolution to solar cell inspection
    should not rely solely on standard image metrics (e.g. SSIM, PSNR) to validate
    results — these metrics have severe limitations in capturing perceptually relevant
    quality and new evaluation methods need to be developed or adopted before results
    can be fully trusted at scale.
