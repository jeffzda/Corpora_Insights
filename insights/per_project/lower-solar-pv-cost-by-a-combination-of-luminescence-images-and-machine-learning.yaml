- record_id: ARENA-DLV-58552
  source_title: Low Solar PV Cost Interim Public Dissemination Report
  publish_date: 2021-09
  project_name: UNSW – R&D Project – Advanced Silicon – Lower photovoltaic cost by
    a combination of luminescence images and machine-learning
  what_happened: ML models trained on one type of luminescence image dataset (electroluminescence)
    could not be directly applied to a different dataset type without fine-tuning,
    and required close monitoring for distribution shifts when redeployed.
  lesson_learnt: Do not assume a trained ML model will transfer directly to a new
    dataset type — fine-tune the model on the target dataset and monitor closely for
    distribution drift before relying on outputs; this applies when moving between
    electroluminescence and photoluminescence image sets or between different production
    lines.
