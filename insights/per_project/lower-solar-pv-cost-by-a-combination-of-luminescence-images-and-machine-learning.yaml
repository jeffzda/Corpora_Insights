- record_id: ARENA-DLV-58553
  source_title: Low Solar PV Cost Interim Public Dissemination Report
  publish_date: 2021-09
  project_name: UNSW – R&D Project – Advanced Silicon – Lower photovoltaic cost by
    a combination of luminescence images and machine-learning
  what_happened: Noisy and low-resolution luminescence images reduced the accuracy
    of trained ML models, making it difficult for models to extract useful information
    during both training and inference.
  lesson_learnt: Specify minimum image quality standards (resolution and noise thresholds)
    before deploying ML-based characterisation tools on a production line — low-resolution
    or noisy input images degrade model accuracy and can undermine the reliability
    of automated fault classification and efficiency prediction.
