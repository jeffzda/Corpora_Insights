- record_id: ARENA-DLV-44053
  source_title: Lower Solar PV Cost by a Combination of Luminescence Images and Machine-Learning
    Report
  publish_date: 2023-02
  project_name: Advanced Silicon - Lower photovoltaic cost by a combination of luminescence
    images and machine-learning
  what_happened: A hybrid model combining an empirical expression (Martin Green's
    fill-factor equation) with a machine learning residual-correction framework significantly
    outperformed both the pure empirical model (R² 0.81) and the pure ML model on
    a validation set of 2,000 solar cells, achieving superior R² and RMSE on fill-factor
    prediction from luminescence images.
  lesson_learnt: When predicting solar cell electrical parameters from luminescence
    images, use a hybrid approach — apply an empirical expression for initial estimation
    and train an ML model to predict the residual error — rather than a pure ML or
    pure empirical model; this yields materially better accuracy, potentially with
    less training data.
