- record_id: ARENA-DLV-44051
  source_title: Lower Solar PV Cost by a Combination of Luminescence Images and Machine-Learning
    Report
  publish_date: 2023-02
  project_name: Advanced Silicon - Lower photovoltaic cost by a combination of luminescence
    images and machine-learning
  what_happened: A deep learning-based super-resolution algorithm (ESRGAN) was developed
    and demonstrated to outperform traditional bicubic interpolation for enhancing
    the spatial resolution of luminescence images of solar cells, successfully reconstructing
    fine defect features even on images significantly different from the training
    dataset.
  lesson_learnt: When seeking to increase luminescence image spatial resolution for
    solar cell inspection, ML-based super-resolution algorithms (e.g. ESRGAN) should
    be preferred over traditional image processing methods such as bicubic interpolation
    — they generalise to unseen image types and recover fine defect detail that traditional
    methods miss, reducing the need for costly high-resolution hardware.
