  evidence_excerpt: Image metrics play a fundamental role in assessing enhanced super-resolution
    images. While various metrics have been proposed, it is acknowledged that none
    of them accurately measures the quality of an image. Hence, the existing metrics
    have severe limitations in effectively quantifying the reconstructed images in
    relation to human visual perception. There is an urgent need to develop more accurate
    image metrics to facilitate the evaluation of image quality.
