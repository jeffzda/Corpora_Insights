  what_happened: Despite widespread collection of electrical and weather data from
    Australian utility-scale PV plants, the project found this data was rarely used
    to enhance plant performance or minimise degradation and soiling losses, representing
    a systemic missed opportunity in the existing fleet.
  lesson_learnt: Owners and operators of utility-scale PV plants should actively leverage
    routinely collected electrical and weather data with ML-based algorithms to detect
    early-stage performance degradation and predict faults before they cause damage
    — current non-utilisation of this data represents avoidable financial loss from
    degradation and soiling.
