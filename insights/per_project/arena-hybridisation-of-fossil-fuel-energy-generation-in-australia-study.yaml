  what_happened: The study found that geothermal hybridisation with existing coal
    plants offered no significant efficiency advantage over a stand-alone geothermal
    plant (approximately 15% net cycle efficiency for geothermal boost compared to
    14.3% for stand-alone), and that no significant proven geothermal resources exist
    close to existing power plants in Australia's main generation regions.
  lesson_learnt: Geothermal hybridisation with coal power stations should not be prioritised
    in Australian programme design — the efficiency advantage over stand-alone geothermal
    is negligible, proven resources are not co-located with major generation hubs,
    and the cost of geothermal development cannot be justified by marginal integration
    benefits.
