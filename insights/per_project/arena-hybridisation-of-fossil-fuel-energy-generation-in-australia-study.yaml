- record_id: ARENA-DLV-44252
  source_title: Hybridisation of Fossil Fuel Energy Generation in Australia - Public
    Report
  publish_date: 2013-11
  project_name: ARENA Hybridisation of Fossil Fuel Energy Generation in Australia
    Study
  what_happened: Industry stakeholders confirmed that hybridisation would need to
    be heavily subsidised to be viable, and that adding generation capacity (rather
    than substituting existing fossil fuel generation) would make hybridisation more
    appealing — but this in turn raises market demand and market impact issues that
    would need separate consideration.
  lesson_learnt: Hybrid renewable projects structured as fossil-fuel substitution
    (same output, less fuel) are commercially less attractive to generators than projects
    that add new generation capacity; programme designers should consider whether
    subsidy structures and project configurations can be designed around output addition
    rather than substitution to improve proponent appetite.
