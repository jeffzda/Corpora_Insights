  publish_date: 2013-11
  project_name: ARENA Hybridisation of Fossil Fuel Energy Generation in Australia
    Study
  what_happened: The study found that for high-penetration biomass co-firing in coal
    boilers, chlorine in biomass fuels causes aggressive corrosion of superheaters,
    limiting conventional dedicated biomass boiler steam temperatures to 400–450°C.
    Crop residues such as straw contain very high chlorine levels, while clean heartwood
    has minimal chlorine; co-firing with sulphur-containing coals reduces this attack.
  lesson_learnt: Biomass fuel selection for high-penetration co-firing must account
    for chlorine content — crop residues are significantly more corrosive to superheaters
    than clean wood products, and project developers should specify low-chlorine fuels
    (clean wood pellets, heartwood) or design for reduced steam temperatures when
    using agricultural residues, factoring co-firing with sulphur-containing coal
    as a corrosion mitigation strategy.
