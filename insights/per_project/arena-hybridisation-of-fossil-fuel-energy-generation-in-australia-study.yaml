- record_id: ARENA-DLV-44261
  source_title: Hybridisation of Fossil Fuel Energy Generation in Australia - Public
    Report
  publish_date: 2013-11
  project_name: ARENA Hybridisation of Fossil Fuel Energy Generation in Australia
    Study
  what_happened: The study found that reducing CCGT output to enable a solar boost
    is thermally inefficient because gas turbine efficiency decreases at partial load;
    the only viable CST integration point for CCGT plants is adding solar steam to
    an existing duct-fired CCGT or converting an OCGT to CCGT, where up to 16% additional
    displaced output is available without reducing gas turbine efficiency.
  lesson_learnt: Do not design solar thermal hybridisation for existing CCGT plants
    by throttling gas turbine output to create headroom for solar steam injection
    — this degrades overall thermal efficiency; instead, target duct-fired CCGT plants
    or OCGT-to-CCGT conversions where solar steam can be added to the HRSG without
    compromising gas turbine performance.
