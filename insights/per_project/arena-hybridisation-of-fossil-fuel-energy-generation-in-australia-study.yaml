  what_happened: The geothermal hybridisation assessment was unable to proceed to
    shortlisting because publicly available data on geothermal resources (bottom-hole
    temperatures, heat flow measurements, geology at depth) was inadequate for detailed
    assessment; the available data was biased toward petroleum drilling geology rather
    than geothermal resource geology.
  lesson_learnt: Before scoping geothermal hybridisation or stand-alone geothermal
    projects, conduct an early data adequacy check — publicly available Australian
    geothermal data is biased toward petroleum geology and is insufficient for site-specific
    resource assessment; projects should budget for proprietary exploration data acquisition
    or access to company exploration lease data before proceeding past concept stage.
