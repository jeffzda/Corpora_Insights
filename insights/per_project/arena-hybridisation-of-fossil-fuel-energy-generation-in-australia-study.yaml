- record_id: ARENA-DLV-44270
  source_title: Hybridisation of Fossil Fuel Energy Generation in Australia - Public
    Report
  publish_date: 2013-11
  project_name: ARENA Hybridisation of Fossil Fuel Energy Generation in Australia
    Study
  what_happened: The study found that Australia currently has no significant MSW-to-energy
    facilities despite the technology being mature overseas (over 100 facilities in
    the USA alone), with most waste combustion in Australia limited to small-scale
    applications such as medical waste incineration and cement kiln co-processing.
  lesson_learnt: Projects proposing to use MSW as a biomass co-firing feedstock for
    power station hybridisation in Australia face a significant market development
    challenge — the absence of an established MSW-to-energy industry means there is
    no proven supply chain, gate fee structure, or regulatory precedent to draw on,
    requiring project developers to plan for longer development timelines and potential
    regulatory pathway creation.
