- record_id: ARENA-DLV-44251
  source_title: Hybridisation of Fossil Fuel Energy Generation in Australia - Public
    Report
  publish_date: 2013-11
  project_name: ARENA Hybridisation of Fossil Fuel Energy Generation in Australia
    Study
  what_happened: Industry stakeholders at the 2013 ARENA hybridisation workshop reported
    that appetite for new investment in hybridisation was severely reduced due to
    low wholesale electricity prices, policy uncertainty around the carbon price and
    direct action plan, and individual companies preparing for sale. Stakeholders
    indicated it would be unlikely that conditions would exist in the near term for
    attendees to be interested in hybridisation projects.
  lesson_learnt: Market appetite for hybrid fossil-fuel/renewable projects is highly
    sensitive to electricity price levels, carbon policy certainty, and generator
    ownership cycles — a programme targeting hybridisation should assess prevailing
    commercial conditions and individual company circumstances before expecting proponent
    uptake, rather than assuming technical feasibility will drive investment.
