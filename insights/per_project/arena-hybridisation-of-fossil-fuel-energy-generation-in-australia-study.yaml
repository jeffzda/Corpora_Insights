  - 30
  evidence_excerpt: A modern thermal power plant is a sophisticated assembly of boilers,
    heat exchangers and turbines that is optimised to achieve the highest practicable
    thermal efficiency in a stand-alone, fossil fired, operation. Any attempts to
    integrate renewable energy into these plants will meet barriers due to equipment
    sizing or resulting adverse impacts on the fossil fuel plant's operations or efficiency...
    The plant operation will also be considerably more difficult as fluctuations in
    solar input will compromise the stability of the power plant.
