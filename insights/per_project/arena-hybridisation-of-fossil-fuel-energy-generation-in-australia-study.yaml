- record_id: ARENA-DLV-44256
  source_title: Hybridisation of Fossil Fuel Energy Generation in Australia - Public
    Report
  publish_date: 2013-11
  project_name: ARENA Hybridisation of Fossil Fuel Energy Generation in Australia
    Study
  what_happened: The study applied a 30-year age cut-off as a fatal flaw criterion
    to screen out older power plants, based on the assumption of a 50-year plant life.
    However, stakeholders at the workshop challenged this, noting that older plants
    typically have less debt leverage and lower revenue risk, and may be technically
    easier to augment due to more robust design tolerances — particularly for biomass
    co-firing where payback periods are shorter.
  lesson_learnt: Age-based screening criteria for hybrid retrofit candidates should
    not be applied rigidly — older, less-leveraged plants may present a better business
    case for hybridisation than newer plants, and mid-life refurbishments can reset
    the effective integration complexity; screen on residual economic life and debt
    structure rather than age alone, and apply a less stringent threshold for low-modification
    technologies like direct biomass co-firing.
  issue_severity: moderate
