- record_id: ARENA-DLV-44269
  source_title: Hybridisation of Fossil Fuel Energy Generation in Australia - Public
    Report
  publish_date: 2013-11
  project_name: ARENA Hybridisation of Fossil Fuel Energy Generation in Australia
    Study
  what_happened: The study found that bagasse, while an appropriate biomass fuel for
    co-firing, was not available near enough to any of the power stations under investigation
    to be viable for hybridisation, despite being produced at 28 sugar cane mill sites
    predominantly on Australia's east coast.
  lesson_learnt: Biomass hybridisation feasibility studies must verify spatial co-location
    of feedstock supply with power station location rather than relying on national
    availability figures — abundant feedstocks like bagasse may have no viable co-location
    opportunity with candidate host plants despite appearing plentiful at the national
    level.
