  what_happened: Stakeholders at the workshop indicated that the study scope was too
    limiting and that ARENA's hybridisation initiative definition should be broadened
    beyond thermal cycle integration to include co-location (renewable plant alongside
    but not thermally integrated with fossil plant), integration with industrial process
    blocks (coal drying, coal gasification), and other integration types not restricted
    to the thermal cycle.
  lesson_learnt: When designing a strategic initiative around hybridisation, engage
    generators and industry early to validate the programme scope definition — a narrow
    technical definition (e.g. thermal cycle integration only) may exclude commercially
    viable configurations that proponents would pursue, and restricting the definition
    risks reducing market participation without technical justification.
