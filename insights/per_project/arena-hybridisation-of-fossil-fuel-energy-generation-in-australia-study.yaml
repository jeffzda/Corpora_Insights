- record_id: ARENA-DLV-44268
  source_title: Hybridisation of Fossil Fuel Energy Generation in Australia - Public
    Report
  publish_date: 2013-11
  project_name: ARENA Hybridisation of Fossil Fuel Energy Generation in Australia
    Study
  what_happened: The study found that for solar thermal hybridisation of coal plants,
    potential iron pick-up from CST field piping was identified as a specific technical
    concern if CST steam is delivered directly to host plant reheaters, leading to
    a design preference for solar boost configurations that avoid CST steam entering
    the reheat circuit.
  lesson_learnt: Solar thermal hybridisation designs for coal plants should avoid
    routing CST-generated steam through host plant reheaters due to the risk of iron
    contamination from the solar field — configure integration points to supply feedwater
    heating or pre-superheater steam rather than direct reheater injection to protect
    turbine and boiler metallurgy.
