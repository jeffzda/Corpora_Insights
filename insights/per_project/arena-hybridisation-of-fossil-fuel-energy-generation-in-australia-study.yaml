  what_happened: Stakeholders raised that the hybrid system would need to be a 'bolt-on'
    type system that could be isolated so the host plant could revert to normal operation
    if issues occurred, because reliability and security of the existing generation
    asset was identified as a critical factor for generator acceptance.
