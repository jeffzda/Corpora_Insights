- record_id: ARENA-DLV-44263
  source_title: Hybridisation of Fossil Fuel Energy Generation in Australia - Public
    Report
  publish_date: 2013-11
  project_name: ARENA Hybridisation of Fossil Fuel Energy Generation in Australia
    Study
  what_happened: The study's initial screening applied a DNI threshold of 2,000 kWh/m²/a
    as a cut-off for solar hybridisation viability. The study acknowledges that a
    less stringent limit of 1,700 kWh/m²/a could have been applied, which would have
    allowed approximately eight additional projects (primarily Victorian power stations)
    to proceed to multi-criteria analysis.
  lesson_learnt: When screening sites for solar thermal hybridisation, avoid applying
    standalone CST economic feasibility DNI thresholds (typically 2,000 kWh/m²/a)
    to hybrid projects — hybrid plants can be economically viable at lower DNI levels
    because shared infrastructure reduces LCOE; apply a lower threshold (around 1,700
    kWh/m²/a) to ensure potentially viable hybrid sites are not incorrectly screened
    out at the fatal flaws stage.
