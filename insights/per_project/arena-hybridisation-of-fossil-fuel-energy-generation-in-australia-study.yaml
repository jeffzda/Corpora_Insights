- record_id: ARENA-DLV-44255
  source_title: Hybridisation of Fossil Fuel Energy Generation in Australia - Public
    Report
  publish_date: 2013-11
  project_name: ARENA Hybridisation of Fossil Fuel Energy Generation in Australia
    Study
  what_happened: The assessment found that OCGT plants are typically peaking plants
    operating during high-demand periods, which do not align with periods of high
    solar resource availability. As a result, solar hybrid solutions with OCGT host
    plants were modelled on the assumption of converting to base-load operation —
    a commercially uncertain assumption that individual plant owners would need to
    separately evaluate.
  lesson_learnt: Solar hybridisation of OCGT peaking plants requires a fundamental
    operating mode change from peaking to base-load to utilise the solar resource
    effectively; project developers should assess the commercial and market implications
    of this mode change before committing to this configuration, as the solar and
    demand profiles are typically misaligned.
