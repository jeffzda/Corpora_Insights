- record_id: ARENA-DLV-44257
  source_title: Hybridisation of Fossil Fuel Energy Generation in Australia - Public
    Report
  publish_date: 2013-11
  project_name: ARENA Hybridisation of Fossil Fuel Energy Generation in Australia
    Study
  what_happened: The cost analysis found that biomass co-firing in existing boilers
    at 5% penetration (OT 5-a) produced the lowest renewable component LCOE of all
    hybridisation options assessed — approximately one third of the capital cost per
    MW compared to the nearest solar thermal option — while solar thermal technologies
    (particularly linear Fresnel) had the highest renewable component LCOE.
  lesson_learnt: For programmes seeking lowest-cost renewable energy delivery through
    fossil fuel hybridisation, biomass co-firing at low penetration (around 5%) in
    existing coal boilers offers the most cost-effective entry point and should be
    prioritised for early deployment; solar thermal hybridisation requires a substantially
    higher subsidy per MWh of renewable output and is better suited to demonstration
    rather than commercial-scale rollout without further cost reduction.
