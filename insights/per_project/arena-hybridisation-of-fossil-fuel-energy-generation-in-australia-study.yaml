- record_id: ARENA-DLV-44258
  source_title: Hybridisation of Fossil Fuel Energy Generation in Australia - Public
    Report
  publish_date: 2013-11
  project_name: ARENA Hybridisation of Fossil Fuel Energy Generation in Australia
    Study
  what_happened: The study found that current CST (concentrated solar thermal) technology
    cannot produce steam temperatures required to match the high-pressure turbine
    inlet conditions of super-critical coal plants, limiting parallel solar thermal
    integration to sub-critical plants only and restricting penetration for solar
    boost options to approximately 7.9%.
  lesson_learnt: Project developers scoping solar thermal hybridisation with coal
    plants should verify host plant steam cycle parameters early — super-critical
    plants are currently incompatible with parallel CST integration due to temperature
    limitations, and even sub-critical solar boost configurations are constrained
    to approximately 7.9% penetration; power tower with molten salt is the only near-term
    technology pathway toward matching super-critical conditions.
  issue_severity: moderate
