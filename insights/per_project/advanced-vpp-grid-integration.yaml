  source_title: Analysis of the VPP Dynamic Network Constraint Management
  publish_date: 2021-05
  project_name: Advanced VPP Grid Integration Project
  what_happened: The preliminary economic analysis used static export limits (2 kW,
    5 kW, 10 kW) as proxies for dynamic limits because the actual trial data and dynamic
    limit time series were not available at the time of analysis, limiting the precision
    and applicability of the cost-benefit findings.
  lesson_learnt: Economic analyses of dynamic constraint management systems should
    be built on actual dynamic limit observations rather than static proxies — using
    static limits as upper/lower bounds significantly understates the nuance of value
    distribution and can lead to misleading benefit estimates.
