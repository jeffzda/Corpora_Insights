  project_name: Advanced VPP Grid Integration
  what_happened: SA Power Networks and Tesla successfully demonstrated the use of
    DNSP-supplied dynamic operating envelopes (DOEs) by a 1,000-customer VPP during
    live NEM market trading — the first such demonstration at scale in Australia.
