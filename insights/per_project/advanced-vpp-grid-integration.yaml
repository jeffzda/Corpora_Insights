  source_title: Advanced VPP Grid Integration Final Report
  publish_date: 2021-05
  project_name: Advanced VPP Grid Integration
  what_happened: The first-generation hosting capacity model used seasonal worst-case
    scenarios to set operating envelopes. This unnecessarily restricted VPP export
    capacity on days with unusually high local load or low passive PV generation compared
    to the seasonal average. A second issue was that some LV networks with high uncertainty
    in connected PV capacity could not be modelled reliably and had to remain on static
    5kW limits throughout the trial.
  lesson_learnt: A prototypical seasonal network model is sufficient to demonstrate
    the DOE concept and unlock significant capacity gains over static limits, but
    real-time local weather and load data integration is needed to maximise capacity
    availability — and high-quality records of small-scale DER connected to the network
    are a prerequisite for accurate hosting capacity modelling.
