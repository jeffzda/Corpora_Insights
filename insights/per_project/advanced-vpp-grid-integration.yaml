- record_id: ARENA-DLV-65856
  source_title: Analysis of the VPP Dynamic Network Constraint Management
  publish_date: 2021-05
  project_name: Advanced VPP Grid Integration Project
  what_happened: Under a regime of static 100%-unconstrained export limits, 56.1%
    of SAPN's 75,530 transformers had zero available capacity headroom for additional
    DER, and 86.8% had 1 kW or less — indicating the existing network was already
    heavily saturated under static limit assumptions.
  lesson_learnt: In high-DER networks, static unconstrained hosting capacity is effectively
    exhausted at most distribution transformers; future DER connection assessments
    should use dynamic capacity frameworks rather than static hosting capacity limits
    to avoid systematically underestimating available headroom.
