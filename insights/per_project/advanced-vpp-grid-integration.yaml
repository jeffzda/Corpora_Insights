  source_title: Advanced VPP Grid Integration Final Report
  publish_date: 2021-05
  project_name: Advanced VPP Grid Integration
  what_happened: Voltage measurements received via the API were taken at the battery
    inverter, which sits some electrical distance away from the customer's network
    connection point. Under high export conditions, the battery can raise voltage
    within the customer's premises while the local LV network remains compliant. An
    initial threshold of 253V at the inverter was used, which proved overly conservative
    and unnecessarily restricted VPP capacity.
  lesson_learnt: When using inverter-side voltage measurements as a network constraint
    proxy, account for the voltage rise across the customer's on-site wiring between
    the inverter and the network connection point — failing to do so results in overly
    conservative operating envelopes and significant lost export capacity.
