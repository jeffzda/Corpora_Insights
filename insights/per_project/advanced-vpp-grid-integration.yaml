- record_id: ARENA-DLV-67305
  source_title: Advanced VPP Grid Integration Final Report
  publish_date: 2021-05
  project_name: Advanced VPP Grid Integration
  what_happened: 'During operations stage 2 testing, four specific technical issues
    were identified: (1) Autobidder updated Powerwalls every 15 minutes while DOEs
    were published every 5 minutes, causing sites to apply the last 5-minute limit
    rather than the minimum for the 15-minute window; (2) forced dispatch events activated
    outside Autobidder could exceed published limits; (3) a missing commissioning
    check meant sites were not initialised to the 5kW default failsafe limit on first
    registration; and (4) two sites had incorrect metering installation causing persistent
    non-compliance.'
  lesson_learnt: Integration testing at scale with live customer equipment is essential
    to reveal mismatches between the DNSP's 5-minute operating envelope publication
    cadence and the VPP's 15-minute update cycle, missing commissioning checklist
    items, and installation quality issues — these are not detectable in lab or unit
    testing alone.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: network business
  delay_category: commissioning/integration
  failure_mode: unvalidated integration
  outcome_class: re-scoped/adapted
  secondary_failure_mode: execution & logistics
  intervention_note: Operating procedures were changed to preclude forced dispatch
    outside Autobidder; the commissioning process was updated to require initialisation
    to 5kW default; metering faults were corrected; and the 15-minute limitation was
    deferred to a future Autobidder update supporting 5-minute NEM settlement.
  transferability: moderate
  delay_magnitude: 1-3 months
