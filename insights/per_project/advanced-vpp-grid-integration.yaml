  source_title: Advanced VPP Grid Integration Final Report
  publish_date: 2021-05
  project_name: Advanced VPP Grid Integration
  what_happened: Tesla's cost to implement the API integration for the trial was $460,065.
    A preliminary CSIRO economic analysis found that, under conditions where static
    export limits remain at 5kW, the incremental NPV of implementing the interface
    to achieve an increase from 5kW to 10kW export was marginal based on wholesale
    market trading alone. However, when static limits are reduced below 5kW, when
    FCAS revenues are included, or when VPP scale exceeds 5MW, the business case becomes
    strongly positive.
  lesson_learnt: The business case for VPP operators investing in DNSP API integration
    for dynamic operating envelopes is sensitive to the static export limit counterfactual,
    VPP scale, and access to FCAS markets — integration costs are broadly fixed while
    benefits scale with fleet size, so early movers should target larger fleets and
    multiple revenue streams to justify API development investment.
