  project_name: Advanced VPP Grid Integration Project
  what_happened: The PV-battery systems deployed in the trial were not optimised for
    dynamic export limits, which constrained the realised upside of the dynamic limit
    scheme relative to the 5 kW static limit and limited the economic benefits that
    could be captured.
  lesson_learnt: When deploying VPP systems under a dynamic constraint management
    regime, ensure the inverter and battery hardware and control software are specifically
    configured to respond to dynamic export signals — using hardware optimised for
