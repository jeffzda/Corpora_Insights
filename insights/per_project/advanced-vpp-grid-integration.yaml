- record_id: ARENA-DLV-65866
  source_title: Analysis of the VPP Dynamic Network Constraint Management
  publish_date: 2021-05
  project_name: Advanced VPP Grid Integration Project
  what_happened: The SAPN API allocated transformer capacity equally across all VPP
    sites connected to that transformer, rather than allowing differentiated allocation
    — this simplified implementation but reduced the ability of the VPP aggregator
    to optimise dispatch across nodes.
  lesson_learnt: Future dynamic constraint API designs should support differentiated
    capacity allocation at the sub-node level to enable VPP optimisation — equal-share
    allocation is a pragmatic starting point but leaves portfolio-level dispatch optimisation
