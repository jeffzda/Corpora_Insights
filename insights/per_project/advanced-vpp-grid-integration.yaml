- record_id: ARENA-DLV-67328
  source_title: Advanced VPP Grid Integration Final Report
  publish_date: 2021-05
  project_name: Advanced VPP Grid Integration
  what_happened: 'South Australia wholesale spot prices shifted materially over the
    trial period: SA transitioned from having the highest NEM spot prices to among
    the lowest; midday prices collapsed to zero or negative frequently; and daily
    energy arbitrage opportunities nonetheless increased from $71 to $84 per customer
    on average. This structural market shift was not anticipated in the original 2019
    economic modelling.'
  lesson_learnt: VPP economic models must include scenario analysis for rapid structural
    market change — the emergence of midday negative prices due to solar penetration
    growth can shift battery revenue streams significantly within a trial period,
    and models anchored to conditions at project commencement may quickly become unrepresentative.
