  what_happened: Tesla's semi-autonomous Powerwall control approach — where individual
    devices operate with reference to price forecasts from Autobidder rather than
    strict central dispatch commands — was found to have implications for the design
    of operating protocols for dynamic operating envelopes. Under this architecture,
    the DNSP cannot assume that a central VPP dispatch command will translate immediately
    and precisely into site-level limit compliance.
  lesson_learnt: DNSP operating envelope protocols must account for the degree of
    centralisation in the VPP's control architecture — semi-autonomous DER designs
    that depend on customer internet and local device logic require different compliance
    monitoring approaches and fallback limit protocols compared to centrally dispatched
    VPPs.
