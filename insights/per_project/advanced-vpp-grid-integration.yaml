    20 sites where VPP equipment had been installed or commissioned incorrectly (e.g.
    export meter added twice to the Tesla gateway), causing them to appear non-compliant
    with operating envelopes when they were actually operating correctly. Separately,
    voltage telemetry identified a faulty neutral at one VPP site — a potential electric
    shock hazard — that would not otherwise have been detected.
  lesson_learnt: Real-time telemetry from VPP sites via the DNSP API provides a powerful
    installation quality assurance mechanism and network safety monitoring capability
    that goes well beyond VPP dispatch compliance — build automated data quality alerts
    into the API backend from day one to detect and escalate anomalies promptly.
