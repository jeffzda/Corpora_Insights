- record_id: ARENA-DLV-65851
  source_title: Analysis of the VPP Dynamic Network Constraint Management
  publish_date: 2021-05
  project_name: Advanced VPP Grid Integration Project
  what_happened: SA Power Networks' static 5 kW per-customer export limit constrained
    the Tesla VPP to half its nameplate capacity (5 MW instead of 10 MW for 1,000
    customers), preventing the VPP from operating at full rated output and limiting
    its market participation.
  lesson_learnt: Static per-customer export limits are a fundamental constraint on
    VPP capacity — project teams integrating VPPs into distribution networks should
    engage the DNSP early to design dynamic constraint mechanisms, as static limits
    may halve the effective dispatchable capacity of the VPP.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: network business
  delay_category: null
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated integration
  intervention_note: SAPN and Tesla co-designed a dynamic constraint API (SAPN API)
    that communicated real-time, locational export limits to the VPP, enabling exports
    above the static 5 kW limit when network capacity permitted.
  transferability: broad
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id001
  - 16
  - 36
  evidence_excerpt: The 'nameplate' peak power rating of Tesla's VPP at the end of
    its second phase of deployment (1,000 customers) will be 10 MW... However, under
    SAPN's present connection rules, the static export limit of 5 kW that applies
    per household limits the maximum power output of the VPP to 5 MW.
  confidence_note: null
