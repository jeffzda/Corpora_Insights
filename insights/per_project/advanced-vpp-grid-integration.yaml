  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: The analysis demonstrated that by switching to dynamic locational
    limits (accepting 50% unconstrained operation), the available hosting capacity
    grew from 200 MW to 600 MW across the SAPN network.
  transferability: moderate
  delay_magnitude: null
