  project_name: Advanced VPP Grid Integration Project
  what_happened: Released energy analysis showed that the benefit of dynamic constraint
    management was heavily concentrated in a minority of VPP sites — for example,
    released energy levels of ~17 kWh were typically only available to around 25%
    of VPP sites during non-workdays, while most sites received far less.
  lesson_learnt: VPP developers should not distribute dynamic constraint management
    benefits uniformly across participants in project economics or customer offers
    — the network-derived uplift is concentrated at a minority of well-located sites,
    and participant agreements and revenue-sharing models need to reflect this locational
    inequality.
