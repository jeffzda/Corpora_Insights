- record_id: ARENA-DLV-65858
  source_title: Analysis of the VPP Dynamic Network Constraint Management
  publish_date: 2021-05
  project_name: Advanced VPP Grid Integration Project
  what_happened: 'The energy arbitrage benefit of increasing export limits was nonlinear:
    the jump from 2 kW to 5 kW delivered substantially greater benefit ($164 to $388
    per site per year) than the jump from 5 kW to 10 kW ($388 to $423 per site per
    year), because exports above 5 kW are constrained by the simultaneous availability
    of both battery and solar.'
  lesson_learnt: VPP export limit design should be matched to system hardware capability
    — for PV-plus-battery systems with 5 kW inverters, a 5 kW export limit captures
    most of the arbitrage value, and further increases yield diminishing returns unless
    hardware is also upgraded.
