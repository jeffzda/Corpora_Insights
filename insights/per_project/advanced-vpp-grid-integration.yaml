- record_id: ARENA-DLV-65855
  source_title: Analysis of the VPP Dynamic Network Constraint Management
  publish_date: 2021-05
  project_name: Advanced VPP Grid Integration Project
  what_happened: Dynamic, locational export limits were shown to increase the network's
    DER hosting capacity by 25–300% compared to static limits, depending on the acceptable
    level of curtailment — 25% more DER for 10% curtailment tolerance, up to 300%
    more DER for 50% curtailment tolerance.
  lesson_learnt: DNSPs planning for high DER penetration should adopt dynamic operating
    envelopes — accepting occasional export constraints enables hosting 2–4 times
    more DER on existing infrastructure without costly network augmentation, and the
    network planning framework should formalise acceptable curtailment tolerance levels.
