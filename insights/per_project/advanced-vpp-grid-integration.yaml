  source_title: Advanced VPP Grid Integration Final Report
  publish_date: 2021-05
  project_name: Advanced VPP Grid Integration
  what_happened: Providing operating envelopes at the network node (distribution transformer)
    level rather than at individual NMI level was intended to allow the VPP aggregator
    to optimally allocate network capacity across sites. In practice, Tesla's control
    strategy at the time of the trial did not support this optimisation, and capacity
    was simply divided equally across all NMIs below a constrained transformer.
  lesson_learnt: Specify the VPP aggregator's capacity allocation logic when designing
    the node-level operating envelope protocol — equal distribution is a valid and
    safe default but leaves value on the table; agreeing optimisation rules (e.g.
    allocation by state of charge) in advance enables the DNSP and VPP to realise
    the full efficiency of node-level envelope granularity.
