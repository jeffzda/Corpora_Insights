- record_id: ARENA-DLV-67324
  source_title: Advanced VPP Grid Integration Final Report
  publish_date: 2021-05
  project_name: Advanced VPP Grid Integration
  what_happened: The trial demonstrated that, where node-level operating envelope
    capacity is allocated to individual customers by the aggregator rather than directly
    by the DNSP, the arrangement requires explicit consent from customers to allow
    the aggregator to set their individual export limit, and the network must formally
    qualify the aggregator as a trusted party. These governance requirements were
    not fully formalised at trial commencement and required working through during
    operations.
  lesson_learnt: Formalise the consent framework and aggregator qualification process
    for node-level operating envelope allocation before trial go-live — the regulatory
    relationship for network connection limits runs between the DNSP and the individual
    customer, not the DNSP and the aggregator, and this must be resolved in connection
    agreements before commercial production deployment.
