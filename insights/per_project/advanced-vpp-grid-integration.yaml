- record_id: ARENA-DLV-65853
  source_title: Analysis of the VPP Dynamic Network Constraint Management
  publish_date: 2021-05
  project_name: Advanced VPP Grid Integration Project
  what_happened: Analysis revealed that communicating DER export capacity as a simple
    daily average (24-hour basis) substantially overstated exploitable capacity for
    solar-dominated VPPs, because network congestion is typically highest during daylight
    hours when PV generation is active.
  lesson_learnt: When reporting or communicating DER export capacity for solar-integrated
    VPPs, always use a daylight-hours average metric rather than a 24-hour average
    — the 24-hour metric can be misleading because it includes off-peak night hours
    when capacity is plentiful but PV cannot generate.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: null
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The analysis defined a daylight-hours average available capacity
    metric (ACdl) as the preferred representation, showing 20% increase over the year
    versus 60% for the potentially misleading 24-hour metric.
  transferability: broad
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id003
  - 14
  - 36
  - 46
  evidence_excerpt: A caveat is in order in regards to the quantification of DER export
    capacity as a daily average, which can be misleading for PV export capacity. Indeed,
    since DER export capacity is typically the lowest during daylight hours in feeders
    with high PV penetration, network capacity available for PV exports is more realistically
    represented as a daylight average.
  confidence_note: null
