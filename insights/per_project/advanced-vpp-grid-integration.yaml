- record_id: ARENA-DLV-67307
  source_title: Advanced VPP Grid Integration Final Report
  publish_date: 2021-05
  project_name: Advanced VPP Grid Integration
  what_happened: 'The existing IEEE2030.5 standard, identified as the most suitable
    base standard for the DNSP-VPP API, required significant modification for the
    trial: it is device-oriented rather than site-oriented, and oriented towards direct
    device control rather than publication of operating envelopes. A custom subset
    and extension of the standard had to be designed from scratch.'
  lesson_learnt: Do not assume that existing DER communication standards (including
    IEEE2030.5) can be adopted without substantial adaptation for DNSP-VPP dynamic
    operating envelope use cases — allocate design effort and timeline for custom
    extensions, and contribute the outputs to national standardisation groups to reduce
    future project costs.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: network business
  delay_category: internal governance/resourcing
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: SA Power Networks designed a custom subset of IEEE2030.5 with
    new 'site', 'limit' and 'group limit' concepts, published an open developer portal,
    and established the DER Integration API Working Group to progress the specification
    towards a national Australian standard.
  transferability: moderate
