  source_title: Advanced VPP Grid Integration Final Report
  publish_date: 2021-05
  project_name: Advanced VPP Grid Integration
  what_happened: The dynamic operating envelope approach increased total VPP export
    capacity from 5MW to 6–8MW during solar hours — a 20–60% increase above static
    limits — without causing measurable power quality issues on the LV network. During
    winter months the average per-site export capacity reached 8kW (60% above the
    5kW static limit); during spring/summer it averaged 6kW (20% above).
  lesson_learnt: Even a conservative prototypical network model generating seasonal
    DOEs can unlock 20–60% additional export capacity for a VPP compared to static
    limits, with the greatest gains in low-solar winter periods — the technical and
    commercial case for dynamic operating envelopes is proven at 1,000-site scale
    in the NEM.
