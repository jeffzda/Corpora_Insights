  source_title: Advanced VPP Grid Integration Final Report
  publish_date: 2021-05
  project_name: Advanced VPP Grid Integration
  what_happened: The project generated industry-standard outputs (an open developer
    portal, an API specification, and industry working group contributions) that enabled
    a third-party VPP operator to integrate with the SAPN API in July 2020, outside
    the original trial scope, using only registration and telemetry functions. This
    demonstrated that the API design was sufficiently open and documented for other
    industry participants to adopt without bespoke assistance.
  lesson_learnt: Publishing an automatically-generated developer portal that stays
    in sync with the live API configuration, and designing the API as an open standard
    from the outset, materially reduces the cost and effort for third-party VPP operators
    to onboard — this approach should be standard practice for all DNSP DER integration
    APIs.
