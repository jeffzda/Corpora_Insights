- record_id: ARENA-DLV-67314
  source_title: Advanced VPP Grid Integration Final Report
  publish_date: 2021-05
  project_name: Advanced VPP Grid Integration
  what_happened: During the SA islanding event of 31 January 2020, the Heywood interconnector
    was damaged and South Australia operated isolated from the NEM for approximately
    two weeks. VPP sites providing contingency FCAS raise services produced transient
    export excursions above the published 5kW operating envelopes, with one site peaking
    at 7.8kW export during the 2 March 2020 FCAS event. Approximately 150 sites breached
    static 5kW limits during that single event for roughly 90 seconds.
  lesson_learnt: Design operating protocols to explicitly distinguish between steady-state
    and emergency operating envelopes — during contingency FCAS events, transient
    excursions above steady-state limits may be acceptable and network-beneficial,
    but this must be pre-agreed with defined risk parameters rather than managed informally
    during an event.
