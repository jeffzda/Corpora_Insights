  source_title: Advanced VPP Grid Integration Final Report
  publish_date: 2021-05
  project_name: Advanced VPP Grid Integration
  what_happened: The Powerwall 2 Gateway controls exports through battery management
    only and has no control path to the solar PV inverter. When the battery is fully
    charged, the gateway cannot prevent energy from being exported at times of negative
    wholesale prices. This caused the VPP to generate negative net monthly wholesale
    revenues on three occasions (September and December 2020, January 2021).
  lesson_learnt: VPP site design should include a control path from the energy management
    gateway to the solar PV inverter — relying on battery control alone for export
    management creates an uncontrolled export residual during negative price events
    and limits the VPP's ability to optimise state of charge for market dispatch.
