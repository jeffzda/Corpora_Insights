- record_id: ARENA-DLV-67325
  source_title: Advanced VPP Grid Integration Final Report
  publish_date: 2021-05
  project_name: Advanced VPP Grid Integration
  what_happened: Site equipment for the trial was configured with 5kVA PV inverters
    and 5kVA Powerwalls, optimised to match the prevailing 5kW static export limit.
    This meant that outside solar hours, maximum export was capped at 5kW from the
    battery alone, and export above 5kW was only possible during solar hours — precisely
    when wholesale prices are typically depressed, limiting the economic upside of
    dynamic operating envelopes for wholesale market arbitrage.
  lesson_learnt: Future VPP sites should be designed with battery export capacity
    that exceeds the anticipated static export limit — as static limits are progressively
    reduced below 5kW, the relative value of dynamic operating envelopes will increase
    and site configurations with higher battery export capacity will be able to access
    more of that value at times outside solar hours.
