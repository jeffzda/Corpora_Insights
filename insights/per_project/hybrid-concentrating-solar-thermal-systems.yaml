- record_id: ARENA-DLV-43001
  source_title: Hybrid Concentrating Solar Thermal Systems for Large Scale Applications
  publish_date: 2016-04
  project_name: Hybrid Concentrating Solar Thermal Systems for Large Scale Applications
  what_happened: Installation of parabolic trough collectors and the desiccant air
    conditioner prototype on the rooftop of the Stockland Wendouree shopping centre
    required the addition of a super structure to distribute load onto existing concrete
    columns. The structural intervention was not anticipated at project outset and
    added significant cost, with the super structure alone accounting for more than
    20% of the solar thermal system cost.
  lesson_learnt: Before finalising the installation site for heavy rooftop solar systems,
    commission a structural assessment that accounts for the specific collector load
    (dead weight and wind load) and includes the cost of any required super structure,
    building approvals, and contingency in the project budget — these costs are easily
    underestimated and can exceed 20% of the solar thermal system cost.
