- record_id: ARENA-DLV-43003
  source_title: Hybrid Concentrating Solar Thermal Systems for Large Scale Applications
  publish_date: 2016-04
  project_name: Hybrid Concentrating Solar Thermal Systems for Large Scale Applications
  what_happened: When CSIRO sought quotes from Australian HVAC contractors to build
    the early-TRL desiccant air conditioning prototype, the quotes received were approximately
    200% higher than component-level cost estimates, reflecting risk premiums for
    constructing an unprecedented design. CSIRO was forced to source an international
    supplier, which brought the cost within budget but resulted in several items non-compliant
    with Australian standards arriving with the unit.
  lesson_learnt: When budgeting for first-prototype builds at TRL levels below 5,
    include a substantial contingency margin to cover contractor risk premiums; if
    an international supplier is used to control cost, plan for a compliance review
    against Australian standards before site installation to identify and rectify
    non-conformances.
