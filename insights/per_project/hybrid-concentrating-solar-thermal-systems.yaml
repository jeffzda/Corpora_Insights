- record_id: ARENA-DLV-43002
  source_title: Hybrid Concentrating Solar Thermal Systems for Large Scale Applications
  publish_date: 2016-04
  project_name: Hybrid Concentrating Solar Thermal Systems for Large Scale Applications
  what_happened: HVAC tradespeople at the remote demonstration site lacked expertise
    in the novel desiccant and indirect evaporative cooling technology, requiring
    CSIRO engineers to make more site visits to Ballarat (over 1000 km from CSIRO's
    Newcastle facility) for troubleshooting than originally planned, resulting in
    additional cost and time.
  lesson_learnt: When deploying R&D prototypes at remote client sites, build in a
    contingency margin for additional site visits and engineer travel, ensure the
    local contractor has relevant technology expertise, and where possible complete
    full system testing and troubleshooting at the R&D facility before shipment to
    avoid costly on-site remediation.
