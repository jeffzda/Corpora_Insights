- record_id: ARENA-DLV-43005
  source_title: Hybrid Concentrating Solar Thermal Systems for Large Scale Applications
  publish_date: 2016-04
  project_name: Hybrid Concentrating Solar Thermal Systems for Large Scale Applications
  what_happened: The world-first two-stage desiccant air conditioning system using
    high-temperature closed-loop solar regeneration was successfully designed, installed,
    and commissioned at the Stockland Wendouree shopping centre, achieving a mean
    thermal COP of 0.66 and electrical COP of 7 in desiccant mode, validating the
    technical feasibility of the concept at TRL3–TRL4.
  lesson_learnt: A carefully designed solar thermal system with integrated thermal
    storage can reliably deliver heat for both space heating and air conditioning
    in a commercial building; the two-stage desiccant design with heat cascading demonstrably
    improves thermal efficiency over single-stage systems and warrants scale-up investment
    to achieve the target thermal COP of 1.
