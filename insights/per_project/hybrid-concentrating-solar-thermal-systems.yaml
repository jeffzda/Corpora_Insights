- record_id: ARENA-DLV-43004
  source_title: Hybrid Concentrating Solar Thermal Systems for Large Scale Applications
  publish_date: 2016-04
  project_name: Hybrid Concentrating Solar Thermal Systems for Large Scale Applications
  what_happened: Time constraints arising from the international construction of the
    desiccant air conditioning prototype meant the unit was shipped directly to the
    Ballarat client site without first undergoing full testing and troubleshooting
    at CSIRO's Newcastle R&D facility, leading to hardware issues that required unplanned
    engineer site visits during commissioning.
  lesson_learnt: Where project schedules allow, fully test and troubleshoot R&D prototypes
    at the development facility before shipping to a remote client site — skipping
    this step to meet schedule transfers troubleshooting effort to the field, where
    it is more costly and time-consuming.
