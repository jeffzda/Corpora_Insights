- record_id: ARENA-DLV-15821
  source_title: Evaluation of ARENA's Impact and Effectiveness
  publish_date: 2019-11
  project_name: ARENA Virtual Power Plant (VPP) Program
  what_happened: ARENA's VPP program committed $25.2 million across multiple projects from 2014, increasing in scale and complexity over time. An independent evaluation found clear progression toward VPPs
    being a viable contributor to secure, reliable and affordable electricity, and that ARENA funding was vital to projects such as Reposit's GridCredits and Simply Energy's VPPx reaching commercial stage.
  lesson_learnt: VPP commercialisation requires a staged program that starts with small demonstrations and progressively increases scale and complexity — single large-scale VPP pilots are insufficient;
    funders should sequence projects to build operational evidence, regulatory confidence, and business model clarity in parallel.
