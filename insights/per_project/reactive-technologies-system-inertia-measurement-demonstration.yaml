  source_title: 'Reactive Technologies - Reactive Technologies, System Inertia Measurement
    Demonstration '' Lessons Learnt #3 Report'
  publish_date: '2024-07-26'
  project_name: Reactive Technologies, System Inertia Measurement Demonstration
  what_happened: Using the single Victorian modulator (VBB), Reactive Technologies
    successfully measured regional inertia not only for VIC but also for SA and QLD,
    extending the project's scope beyond its original objectives of total NEM and
    VIC regional inertia measurement. Detection of SA inertia response required an
    extended computation time window due to SA's smaller share of system inertia.
  lesson_hearnt: A single well-located modulator can measure regional inertia across
    multiple NEM regions simultaneously; however, for regions contributing a smaller
    inertia share — such as SA — extend the measurement computation time window to
    maintain accuracy, and plan for regional modulators in an enduring service to
    improve local resilience and precision.
  lesson_learnt: A single well-located modulator can measure regional inertia across
    multiple NEM regions simultaneously; however, for regions contributing a smaller
    inertia share — such as SA — extend the measurement computation time window to
    maintain accuracy, and plan for regional modulators in an enduring service to
    improve local resilience and precision.
