  publish_date: '2024-07-26'
  project_name: Reactive Technologies, System Inertia Measurement Demonstration
  what_happened: The demonstration project successfully showed that BESS can deliver
    modulation simultaneously with other flexibility services, and that modulation
    via BESS is a viable alternative to ultracapacitors used in the UK. However, for
    an enduring service, the project identified that local metering and monitoring
    systems at the BESS site would need to be specified to higher requirements than
    used in the demonstration.
  lesson_learnt: BESS is a viable modulator for inertia measurement services and can
    operate simultaneously with other flexibility services, expanding procurement
    options; however, transitioning from demonstration to enduring service requires
    specifying high-grade local metering and real-time monitoring infrastructure at
    the modulator site that is not necessary for a trial.
