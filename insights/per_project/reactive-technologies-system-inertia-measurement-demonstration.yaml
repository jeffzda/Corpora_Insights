- record_id: ARENA-DLV-35201
  source_title: 'Reactive Technologies - Reactive Technologies, System Inertia Measurement
    Demonstration '' Lessons Learnt #3 Report'
  publish_date: '2024-07-26'
  project_name: Reactive Technologies, System Inertia Measurement Demonstration
  what_happened: The initial BESS modulator (Neoen's Bulgana Battery) was found to
    be technically unsuitable during project execution, requiring a switch to the
    Victorian Big Battery (VBB). This change introduced approximately one year of
    delay to the testing phase, driven by SIPS contract commitments at VBB, the need
    for revised grid studies and modelling, and Tesla's modulation functionality testing
    for the new asset.
  lesson_learnt: Conduct detailed technical feasibility assessments of the intended
    BESS modulator — including existing contract obligations, BESS supplier testing
    requirements, and grid impact studies — before project commencement, to avoid
    late-stage asset substitutions that can cause year-long delays.
  issue_severity: major
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: commissioning/integration
  failure_mode: unvalidated technical assumptions
  outcome_class: delayed but recoverable
  secondary_failure_mode: poor scoping
  intervention_note: Reactive Technologies negotiated with Neoen to secure VBB as
    a replacement modulator, conducted revised grid studies with University of Adelaide,
    and coordinated Tesla lab testing to confirm modulation functionality before proceeding
    to the testing phase.
  transferability: moderate
  delay_magnitude: 1-3 years
  technology_domain: battery storage
  source_pages: &id001
  - 14
  evidence_excerpt: The change in asset from Neoen's Bulgana Battery to the VBB necessitated
    negotiations with Neoen to secure the services of the VBB as a viable modulator
    alternative. While this change allowed the project to move forward, it did introduce
    a significant delay of approximately one year to the start of the project's testing
    phase.
  confidence_note: delay_magnitude coded as 1–3 years based on 'approximately one
    year' stated; lifecycle_phase assigned to development/design as the failure emerged
    from planning assumptions about asset suitability.
