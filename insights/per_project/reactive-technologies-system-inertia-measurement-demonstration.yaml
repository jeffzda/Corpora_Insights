  publish_date: '2024-07-26'
  project_name: Reactive Technologies, System Inertia Measurement Demonstration
  what_happened: Comprehensive grid studies were conducted before ARENA funding approval
    to determine modulator specifications for the Australian grid. These specifications
    were shared early with AEMO (for impact modelling) and Neoen/Tesla (for implementation
    planning and lab testing), allowing modulator control logic to be scoped and validated
    in advance of the testing phase.
  lesson_learnt: Conduct and share modulator technical specifications with all relevant
    parties — system operator, BESS owner, and BESS supplier — early in the project,
    before funding is secured, to enable parallel impact assessment, control logic
    implementation, and lab testing that prevents bottlenecks during later project
    phases.
