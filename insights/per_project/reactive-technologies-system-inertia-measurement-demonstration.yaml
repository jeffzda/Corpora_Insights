  source_title: 'Reactive Technologies - Reactive Technologies, System Inertia Measurement
    Demonstration '' Lessons Learnt #3 Report'
  publish_date: '2024-07-26'
  project_name: Reactive Technologies, System Inertia Measurement Demonstration
  what_happened: VBB lenders required AER approval before Neoen could commit VBB as
    the modulator. This regulatory approval requirement had not been anticipated in
    early project planning. Preparing documentation for AER submission and AER's due
    diligence process was described as lengthy and time-consuming, adding further
    delay to the start of the testing phase.
  lesson_learnt: When using a financed BESS asset as a project modulator or ancillary
    service provider, proactively identify lender consent and regulatory no-action
    letter requirements at the outset — these approvals can be lengthy and were not
    envisaged in early project stages, contributing to testing phase delays.
