  publish_date: '2024-07-26'
  project_name: Reactive Technologies, System Inertia Measurement Demonstration
  what_happened: University of Melbourne's Melbourne Energy Institute (MEI) validated
    Reactive Technologies' inertia measurements against AEMO's generation inertia
    estimates and real-world frequency disturbance events. A real-world event on 26
    September 2023 showed AEMO's pre-calculated inertia was 77 GWs versus an actual
    event inertia of ~99 GWs (a 22 GWs discrepancy), while Reactive's measured value
    of 92 GWs deviated by only 7 GWs — demonstrating significant accuracy improvement
    over theoretical estimation.
  lesson_learnt: Third-party academic validation of new measurement technology against
    both models and real-world events is essential for building operator confidence
    — structured partnership with a university knowledge-sharing partner provided
    independent verification that materially strengthened the credibility of the demonstration
    results.
