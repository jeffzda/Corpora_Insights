  what_happened: Internet connectivity at DEECA office hosting sites presented challenges
    due to intermittent Wi-Fi and company-specific cyber-security configuration requirements.
    The initial configuration used guest Wi-Fi as the primary connection, but intermittent
    connectivity issues led to a reconfiguration prioritising 4G cellular with Wi-Fi
    as failover. Configuring site-specific IT security access required meaningful
    effort from both DEECA and Reactive IT teams.
  lesson_learnt: Configure XMU or similar remote measurement panels with multi-mode
    internet redundancy (cellular primary, Wi-Fi failover) from the outset, and plan
    for meaningful IT security configuration effort when deploying at government or
    corporate office sites — guest Wi-Fi alone is insufficient for reliable data transmission.
