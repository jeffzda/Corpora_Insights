  project_name: Reactive Technologies, System Inertia Measurement Demonstration
  what_happened: For an enduring operational service, DEECA office locations were
    identified as unsuitable long-term hosts for XMU frequency measurement panels.
    The demonstration project recommended migrating hosting to secure third-party
    sites such as cell towers, citing the need for broader geographical coverage,
    reliable power supply, and secure independent infrastructure.
  lesson_learnt: Design enduring grid measurement networks to use dedicated secure
    third-party hosting sites (e.g. cell towers) rather than government office buildings
    — office environments provide adequate coverage for demonstrations but do not
    meet the reliability, security, and geographic distribution requirements of a
    permanent measurement service.
