- record_id: ARENA-DLV-35203
  source_title: 'Reactive Technologies - Reactive Technologies, System Inertia Measurement
    Demonstration '' Lessons Learnt #3 Report'
  publish_date: '2024-07-26'
  project_name: Reactive Technologies, System Inertia Measurement Demonstration
  what_happened: VBB's existing SIPS (System Integrity Protection Scheme) contract
    commitments reserved the asset from 1 November to 31 March each year, preventing
    its use as a modulator during Australian summers. The project was required to
    schedule all modulation testing within the Australian winter window, which constrained
    flexibility and contributed to delays in commencing testing.
  lesson_learnt: Before selecting a BESS as a modulator or ancillary service provider,
    confirm its existing service contract obligations — seasonal reservations such
    as SIPS commitments can prevent use for significant portions of the year and force
    narrow testing windows.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: approvals/contracting
  proponent_type: technology vendor
  delay_category: procurement/supply chain
  failure_mode: coordination & stakeholders
  outcome_class: delayed but recoverable
  secondary_failure_mode: poor scoping
  intervention_note: The project aligned its testing schedule to the available winter
    window (June–September 2023) when VBB was not reserved for SIPS services.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id003
  - 9
  - 14
  evidence_excerpt: 'VBB has been reserved for providing SIPS services during Australian
    summers i.e. from 1st November - 31st March each year, during this time VBB cannot
    be used for any other services... Existing Commitments (SIPS Contracts): VBB was
    already engaged in other contracts, specifically the SIPS, which limited its availability
    for use in the pilot demonstration project.'
