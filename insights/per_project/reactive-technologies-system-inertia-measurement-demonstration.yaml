- record_id: ARENA-DLV-35204
  source_title: 'Reactive Technologies - Reactive Technologies, System Inertia Measurement
    Demonstration '' Lessons Learnt #3 Report'
  publish_date: '2024-07-26'
  project_name: Reactive Technologies, System Inertia Measurement Demonstration
  what_happened: Real-time modulation power measurements were unavailable directly
    from VBB during testing. Reactive Technologies and Neoen implemented a workaround
    whereby modulation power data was retrieved offline after each modulation run
    and used for post-hoc inertia calculation, with results then published to the
    GridMetrix UI.
  lesson_learnt: For an enduring inertia measurement service, ensure appropriate power
    metering infrastructure is installed at the modulator site to enable real-time
    modulation power data acquisition — the offline workaround used in this demonstration
    was adequate for the trial but would be insufficient for a live operational service.
  issue_severity: minor
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: technology vendor
  delay_category: null
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Neoen and Reactive Technologies collaborated to obtain modulation
    power data offline after each modulation run, enabling post-hoc inertia calculation
    and publication to GridMetrix UI with no impact on trial outcomes.
  transferability: moderate
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id004
  - 14
  - 15
  evidence_excerpt: Due to the unavailability of live modulation power measurements
    directly from the VBB, Neoen and Reactive Technologies engaged in a collaborative
    effort to obtain the modulation power data offline after each modulation run...
    The absence of real-time data had no impact on the outcomes for the trial... the
    key lesson is on ensuring the installation of appropriate power metering infrastructure
    at the modulator site.
