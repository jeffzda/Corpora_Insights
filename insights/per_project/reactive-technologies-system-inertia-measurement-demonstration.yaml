  source_title: 'Reactive Technologies - Reactive Technologies, System Inertia Measurement
    Demonstration '' Lessons Learnt #3 Report'
  publish_date: '2024-07-26'
  project_name: Reactive Technologies, System Inertia Measurement Demonstration
  what_happened: The Melbourne Energy Institute (UoM) cost-benefit analysis found
    that incorporating demand-side inertia measurement could defer or reduce critical
    infrastructure investments and lower inertia payments to generators, with value
    persisting under future high-renewable scenarios. The analysis applied a model
    encompassing FCAS markets, RoCoF and nadir requirements across current and 2037
    zero-coal scenarios.
  lesson_learnt: Include a cost-benefit analysis by an independent academic partner
    as part of demonstration project deliverables — quantifying economic value across
    current and future grid scenarios (including infrastructure deferral and reduced
    FCAS costs) is essential for translating technical demonstration results into
    policy and investment decisions by market operators and regulators.
