- record_id: ARENA-DLV-35215
  source_title: 'Reactive Technologies - Reactive Technologies, System Inertia Measurement
    Demonstration '' Lessons Learnt #3 Report'
  publish_date: '2024-07-26'
  project_name: Reactive Technologies, System Inertia Measurement Demonstration
  what_happened: The project identified that significant distributed (demand-side)
    inertia — averaging an additional 38% above transmission-level generation inertia
    — exists on the NEM but is unmetered and not currently visible to AEMO. This finding
    was consistent with analysis of power grids globally and was independently confirmed
    by the University of Melbourne.
  lesson_learnt: Grid operators and planners should not rely solely on transmission-level
    generation inertia in system security assessments — real-time inertia measurement
    at the system level can reveal substantial additional demand-side and distributed
    inertia (averaging 38% in this study) that, if incorporated into planning, could
    reduce curtailment of inverter-based resources and optimise ancillary service
    procurement.
