- record_id: ARENA-DLV-67453
  source_title: UNSW - Low-Cost >30% Efficient Silicon Photovoltaic Solar Cells Achieved
    Through Singlet Fission - R&D Interim Report
  publish_date: 2024-08
  project_name: Low-Cost >30% Efficient Silicon Photovoltaic Solar Cells Achieved
    Through Singlet Fission
  what_happened: The 2019 Einzinger et al. singlet fission silicon device was a net
    detriment to overall solar cell efficiency, primarily due to poor triplet energy
    transfer from the singlet fission layer into the silicon device, establishing
    a known failure mode at the start of this project.
  lesson_learnt: Pursuing two parallel triplet transfer pathways — direct interlayer
    engineering and radiative optical transfer — reduces the risk of a single approach
    failing to achieve net efficiency benefit; radiative transfer in particular can
    be applied to existing silicon architectures without surface modification, lowering
    the barrier to industrial adoption.
  issue_severity: major
  project_type: generation
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Adopted two parallel development pathways — direct energy transfer
    via interlayer engineering and radiative optical transfer — to ensure at least
    one route achieves net efficiency benefit; optical precursor platform used to
    validate interlayer candidates before full device fabrication.
  transferability: narrow
  delay_magnitude: null
  technology_domain: solar PV
