- record_id: ARENA-DLV-67451
  source_title: UNSW - Low-Cost >30% Efficient Silicon Photovoltaic Solar Cells Achieved
    Through Singlet Fission - R&D Interim Report
  publish_date: 2024-08
  project_name: Low-Cost >30% Efficient Silicon Photovoltaic Solar Cells Achieved
    Through Singlet Fission
  what_happened: At project outset, only one interlayer material (HfOxNy) and one
    singlet fission material (tetracene) had been demonstrated to allow triplet energy
    transfer into silicon, leaving a significant knowledge gap about the range of
    usable materials and the underpinning physics of triplet transfer.
  lesson_learnt: Developing an 'optical precursor' testing platform — using rear-passivated
    silicon wafers and magnetic-field-dependent photoluminescence — allows rapid screening
    of candidate singlet fission and interlayer material pairings without fabricating
    full photovoltaic devices, substantially increasing R&D throughput and broadening
    the material search space.
  issue_severity: moderate
  project_type: generation
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Developed an optical precursor testing platform using magnetic-field-dependent
    photoluminescence to screen materials before full device fabrication, enabling
    discovery of multiple viable interlayer and singlet fission material pairings.
  transferability: narrow
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id001
  - 14
  - 15
  evidence_excerpt: Only one interlayer (HfOxNy) and singlet fission material (tetracene)
    has been shown to allow for triplet energy transfer. However, in this project
    we have shown that there exist several pairings of materials that can be used.
  confidence_note: issue_severity set to moderate as the knowledge gap constrained
    early device development but was resolved within the first 18 months without schedule
    impact.
