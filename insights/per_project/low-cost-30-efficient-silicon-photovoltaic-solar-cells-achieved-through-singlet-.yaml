  source_title: UNSW - Low-Cost >30% Efficient Silicon Photovoltaic Solar Cells Achieved
    Through Singlet Fission - R&D Interim Report
  publish_date: 2024-08
  project_name: Low-Cost >30% Efficient Silicon Photovoltaic Solar Cells Achieved
    Through Singlet Fission
  what_happened: At 18 months into a 60-month project, the team confirmed that singlet
    fission is augmenting photocurrent in a silicon solar cell under laboratory conditions
    — meeting the 18-month milestone in December 2023 — and secured formal partnership
    agreements with eight leading global silicon PV manufacturers.
  lesson_learnt: Securing formal industry partner agreements with major manufacturers
    early in an R&D project (before laboratory proof-of-concept is fully established)
    accelerates the pathway from lab demonstration to commercialisation by ensuring
    manufacturers are already engaged when technology readiness advances; having a
    pre-formed spin-out company (OMEGA Silicon Pty) ready to licence IP also shortens
    the technology transfer timeline.
