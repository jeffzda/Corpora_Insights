- record_id: ARENA-DLV-67455
  source_title: UNSW - Low-Cost >30% Efficient Silicon Photovoltaic Solar Cells Achieved
    Through Singlet Fission - R&D Interim Report
  publish_date: 2024-08
  project_name: Low-Cost >30% Efficient Silicon Photovoltaic Solar Cells Achieved
    Through Singlet Fission
  what_happened: The incumbent silicon PV industry lacked familiarity with the molecular
    singlet fission materials required for the technology, and no immediate industrial
    supply chain existed for these specialised materials at the outset of the project.
  lesson_learnt: When developing a novel add-on technology for a mature industry,
    embed a dedicated supply-chain vehicle (such as a spin-out company positioned
    to coordinate specialised material supply) into the commercialisation model from
    the start — waiting until laboratory proof-of-concept to address supply chain
    risks the technology being stranded without a viable route to manufacturing.
  issue_severity: moderate
  project_type: generation
  project_scale_band: lab/bench
  lifecycle_phase: concept/feasibility
  proponent_type: research organisation/university
  delay_category: procurement/supply chain
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated integration
  intervention_note: Established spin-out company OMEGA Silicon Pty to act as a supply
    chain coordinator between UNSW IP, chemical dye industry material suppliers, and
    PV manufacturers, embedding supply chain development into the commercialisation
    model from project inception.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id005
  - 7
  evidence_excerpt: The technology is at an early stage and involves materials that
    the incumbent solar PV industry find unfamiliar and for which there is no immediate
    supply.
  confidence_note: delay_category populated as procurement/supply chain because the
    absence of supply is a prospective delivery constraint explicitly identified by
    the project team; delay_magnitude is not quantified as no duration is stated.
