- record_id: ARENA-DLV-67452
  source_title: UNSW - Low-Cost >30% Efficient Silicon Photovoltaic Solar Cells Achieved
    Through Singlet Fission - R&D Interim Report
  publish_date: 2024-08
  project_name: Low-Cost >30% Efficient Silicon Photovoltaic Solar Cells Achieved
    Through Singlet Fission
  what_happened: Prior to this project, all singlet fission materials demonstrated
    to couple effectively with silicon were photochemically unstable, limiting the
    practical viability of the technology for commercial solar applications.
  lesson_learnt: Prioritising synthesis of new singlet fission molecules based on
    industrially familiar pigment chemistries (e.g. paint-industry pigments) can yield
    materials with significantly improved photochemical stability, which is a prerequisite
    for any commercial deployment of singlet fission on silicon.
