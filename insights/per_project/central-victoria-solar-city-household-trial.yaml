- record_id: ARENA-DLV-72225
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: null
  project_name: Central Victoria Solar City Household Trial
  what_happened: The CVSC trial found that in-home displays alone (without a price
    signal) delivered a 5% average daily consumption reduction, and that replacing
    electric storage hot water systems with solar water heaters achieved gross savings
    of 41% of average daily consumption (22% attributable to the CVSC program).
  lesson_learnt: Real-time consumption feedback via in-home displays drives measurable
    energy reductions even without an accompanying price signal; solar hot water replacement
    is the single most effective household energy efficiency intervention and should
    be prioritised in demand reduction programs.
