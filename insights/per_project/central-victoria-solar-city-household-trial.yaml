- record_id: ARENA-DLV-72224
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: null
  project_name: Central Victoria Solar City Household Trial
  what_happened: The Central Victoria Solar City (CVSC) trial of 1,724 households
    found that renters were severely under-represented (only 2% of the intervention
    group), with high-income households accounting for nearly a quarter of participants,
    demonstrating a systematic equity gap in distributed energy uptake under voluntary
    program designs.
  lesson_learnt: Voluntary DER programs systematically exclude renters and low-income
    households — program designers must explicitly address split incentives between
    landlords and tenants, and cost barriers for low-income households, through targeted
    financial mechanisms or mandatory participation pathways.
