  evidence_excerpt: Results were not shared equally among residents of central Victoria,
    with almost a quarter of the intervention group falling into the top two household
    income categories. Renters were significantly under represented with only 2 per
    cent of the intervention group renting their home. More work is needed to address
    split incentives between landlords and tenants and to address cost barriers for
    low income households in accessing energy savings.
  confidence_note: Published 2016 — commercial viability and demand conditions may
