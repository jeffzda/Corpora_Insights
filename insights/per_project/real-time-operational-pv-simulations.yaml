- record_id: ARENA-DLV-8654
  source_title: Real-time Operational Distributed PV Simulations for Distribution
    Network Providers
  publish_date: '2019-06-30'
  project_name: Real-time Operational Distributed PV Simulations for Distribution
    Network Service Providers
  what_happened: Prior to the project, DNSPs using net metering had no direct visibility
    of how much electricity was being generated by rooftop PV systems within their
    networks — past, present or future — because net metering only records the net
    flow at the meter, not gross PV generation. This lack of visibility reduced load
    flow modelling accuracy and created operational risk.
  lesson_learnt: Net metering creates a fundamental blind spot for distribution network
    operators managing high PV penetration; DNSP planning and operations tools must
    account for the absence of direct PV generation data and should incorporate satellite-derived
    or modelled PV estimates to reconstruct generation profiles.
  issue_severity: major
  project_type: network/grid
  project_scale_band: utility/large-scale
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: null
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The project developed a satellite-based forecasting system that
    estimated PV output every 10 minutes using irradiance data and PV installation
    location/capacity data provided by DNSPs, providing historical, real-time and
    forecast PV generation profiles.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id004
  - 9
  - 10
  evidence_excerpt: 'Consequently, DNSPs do not know: how much electricity was generated
    by PV systems within their network in the past; how much those systems are currently
    generating; or how much they are likely to generate – and when they are likely
    to generate it – in the future.'
