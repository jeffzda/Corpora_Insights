  what_happened: Ergon Energy, operating in Queensland (the highest per-capita behind-the-meter
    solar PV market in the world), found that API aggregation metadata at the zone
    substation level quickly became outdated due to rapid new PV connection rates
    (13% growth in connections in 12 months), making zone-substation-level PV forecasts
    unreliable.
  lesson_learnt: In fast-growing PV markets, zone-substation-level PV aggregation
    metadata becomes stale within months; design forecasting workflows that are resilient
    to metadata lag — for example, using a scaled generic 1 kW reference site approach
    rather than maintaining exhaustive individual system records.
