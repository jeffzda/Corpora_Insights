  what_happened: Western Power's network, which has very high solar PV penetration,
    began experiencing daytime demand falling below night-time demand as early as
    2016, creating reverse power flow risks. The network lacked adequate metering
    data and SCADA coverage to model these conditions, and had previously made poorly
    targeted capital investments in network augmentation due to inadequate analytics.
  lesson_learnt: Networks with high PV penetration face minimum-demand and reverse
    power flow challenges that conventional SCADA and metering infrastructure cannot
    adequately monitor; invest in solar generation analytics ahead of the penetration
    tipping point rather than responding after operational problems have materialised.
