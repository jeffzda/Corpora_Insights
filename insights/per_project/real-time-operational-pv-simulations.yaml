- record_id: ARENA-DLV-8657
  source_title: Real-time Operational Distributed PV Simulations for Distribution
    Network Providers
  publish_date: '2019-06-30'
  project_name: Real-time Operational Distributed PV Simulations for Distribution
    Network Service Providers
  what_happened: Automatically reported solar PV power output data from inverter manufacturers
    and monitoring platforms contained systematic errors due to equipment faults,
    panel shading, and dust-related derating, making raw data unsuitable for use in
    the forecasting system without quality control.
  lesson_learnt: Operational PV forecasting systems that ingest automatically reported
    inverter data must apply rigorous quality control before use; invest in developing
    and validating a quality control algorithm (such as QCPV) before relying on crowdsourced
    PV output data as ground truth for model training or calibration.
  issue_severity: moderate
  project_type: network/grid
  project_scale_band: utility/large-scale
  lifecycle_phase: development/design
  proponent_type: network business
  delay_category: data/validation/testing
  failure_mode: data & measurement
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: The project developed and published the QCPV quality control
    algorithm, which earned the 2016 best paper award in Solar Energy and was used
    to create a research-grade dataset for over 1,200 PV systems across the ACT, WA
    and SA.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id007
  - 12
  - 13
  evidence_excerpt: There are inherent problems with the quality of the reported data,
    however, due to equipment faults, PV panel shading, PV system derating due to
    dust, etc, so the PV power output data need to be quality controlled.
