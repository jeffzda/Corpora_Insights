- record_id: ARENA-DLV-8664
  source_title: Real-time Operational Distributed PV Simulations for Distribution
    Network Providers
  publish_date: '2019-06-30'
  project_name: Real-time Operational Distributed PV Simulations for Distribution
    Network Service Providers
  what_happened: CitiPower/Powercor found that without historical PV generation data,
    they could not accurately determine how much customer energy consumption was being
    displaced by solar self-consumption, creating inaccuracies in consumption-based
    tariff revenue reporting and shareholder volume forecasting.
  lesson_learnt: As solar self-consumption displaces metered demand, DNSPs' revenue
    and demand forecasting models will increasingly understate gross consumption unless
    PV self-consumption is explicitly estimated and subtracted; incorporate historical
    PV generation estimates into all consumption-based reporting and forecasting workflows.
  issue_severity: moderate
  project_type: network/grid
