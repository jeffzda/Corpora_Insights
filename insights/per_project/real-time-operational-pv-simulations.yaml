  what_happened: Essential Energy used the forecasting tool to identify in advance
    a day when Harrington zone substation load was forecast to approach zero and potentially
    enter reverse power flow. The substation had never previously experienced reverse
    power flow, and pre-identification allowed the local planner to review device
    settings and monitor the event as it occurred — the load did go below zero for
    one hour.
  lesson_learnt: PV forecasting tools can identify imminent first-occurrence reverse
    power flow events at zone substations before they happen; DNSPs should use such
    tools to proactively review protection device settings and monitor substation
    behaviour during predicted reverse-flow events rather than discovering them reactively.
