  what_happened: In the AusNet/Networks Renewed Yackandandah trial, using reactive
    power from solar and battery inverters for voltage control caused some curtailment
    of solar active power and modest reductions in battery state of charge. The trial
    used PV estimated actuals data to calculate appropriate customer compensation
    — a $200 per year gift certificate — to ensure customers were never under-compensated
    for lost solar generation.
