  publish_date: '2019-06-30'
  project_name: Real-time Operational Distributed PV Simulations for Distribution
    Network Service Providers
  what_happened: Early validation work found that existing solar forecasting methodologies
    had been tested using data from only a small geographic sample of meteorological
    stations, leading to poor performance when applied across all global climates.
    The project team systematically tested algorithms across global climates and identified
    significant biases.
  lesson_learnt: Solar forecasting algorithms validated on geographically limited
    datasets will produce unreliable results when deployed in new climates; algorithm
    validation datasets must be geographically and climatically representative of
    all intended deployment regions before operational adoption.
