- record_id: ARENA-DLV-59218
  source_title: Biogas Opportunities for Australia
  publish_date: 2019-03
  project_name: United Kingdom biogas sector (international reference)
  what_happened: The UK's Renewable Heat Incentive (RHI) boosted biomethane development
    between 2013 and 2016, but a reduction in government support in 2017 resulted
    in a slowdown in the number of new biomethane plants built each year.
  lesson_learnt: Biomethane project pipelines are highly sensitive to support mechanism
    changes — UK experience shows that even partial reduction of a well-functioning
    scheme (the RHI) rapidly curtails new project development; Australian policy design
    should include clear transition pathways and minimum notice periods for any support
    reductions.
