- record_id: ARENA-DLV-21401
  source_title: Module Design for Lower Field Operating Temperature and Improved Yield
    Study
  publish_date: 2021-03
  project_name: Module Design for Lowering Field Operating Temperature and Improved
    Yield Study
  what_happened: A desktop modelling study at UNSW Sydney successfully developed and
    assessed multiple solar module passive cooling technologies — including vortex
    generators, textured glass, thermally conductive strips, and mounting designs
    — identifying two leading approaches (vortex generators and glass texturing) with
    projected LCOE reductions of 5–8% and 3–15% respectively, and prompted three patent
    filings and design of a follow-on experimental stage.
  lesson_learnt: Initiating research programs with a desktop/modelling study before
    field testing is an effective way to scope opportunities, identify limitations,
    attract industry partners, and frame research questions — reducing the risk of
    investing in experimental work on approaches that modelling would have ruled out.
