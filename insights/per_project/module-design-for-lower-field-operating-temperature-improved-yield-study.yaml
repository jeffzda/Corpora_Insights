- record_id: ARENA-DLV-21403
  source_title: Module Design for Lower Field Operating Temperature and Improved Yield
    Study
  publish_date: 2021-03
  project_name: Module Design for Lowering Field Operating Temperature and Improved
    Yield Study
  what_happened: The initial vortex generator simulation modelled only a 'slice' of
    the module (sub-module) rather than a full-size module. When simulation was scaled
    to full-size, lateral flow effects were identified that could reduce the effectiveness
    of vortex generators — an outcome not anticipated in the initial stage. A new
    simulation method had to be developed to manage the computational demands of the
    full-size model.
  lesson_learnt: When modelling component-level behaviour, validate whether sub-component
    simulation assumptions hold at full system scale before drawing conclusions —
    lateral flow and other emergent effects at full size may not be visible in slice
    or sub-module models, requiring additional method development if the scale-up
    is not planned from the outset.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: A new simulation method was developed in the second stage of
    the desktop study to manage the computational demands of full-size module modelling,
    ultimately showing VGs can deliver a 2–3 °C cooling benefit.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id003
  - 5
  evidence_excerpt: Simulating a full-size module allows for lateral flow which could
    reduce the effectiveness of vortex generators. This was not anticipated in the
    initial stage of the research which only investigated a 'slice' of the module
    (sub-module). A new simulation method was developed in the second stage of the
    desktop study to manage the computational demands the for a full-size module.
  confidence_note: 'delay_category: data/validation/testing is listed as a delay_category
