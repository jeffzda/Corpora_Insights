- record_id: ARENA-DLV-16272
  source_title: Energy Storage Study
  publish_date: 2015-07
  project_name: Australia — Grid Connection Process Complexity for End-User Storage
  what_happened: The grid connection process in Australia was identified as slow and
    expensive for end-user energy storage installations, constituting a barrier to
    residential and small commercial deployment. Updates to AS4777 were underway to
    address this, but the process remained a recognised impediment.
  lesson_learnt: Streamlining grid connection processes and updating connection standards
    (such as AS4777) for bidirectional storage installations is a prerequisite for
    cost-effective residential and commercial storage rollout — high per-project connection
    costs disproportionately impact smaller installations and impede market scale-up.
