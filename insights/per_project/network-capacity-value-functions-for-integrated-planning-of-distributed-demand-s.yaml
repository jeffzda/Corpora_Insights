- record_id: ARENA-DLV-72272
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: '2015'
  project_name: Network Capacity Value Functions for Integrated Planning of Distributed
    Demand Side Resources (Project ID 195)
  what_happened: Monash University research identified that methods for assessing
    the marginal and incremental network value of demand side response had not been
    previously formulated in a standard method for detailed locational analysis, and
    that existing network charge structures do not provide price signals suitable
    for integrated planning of demand side resources.
  lesson_learnt: Network businesses and regulators should publish Network Value Functions
    (NVFs) in planning statements to reveal locational economic opportunities for
    demand side response — the absence of such signals means DER investment decisions
    are made without accurate signals about where distributed resources provide the
    greatest network value.
