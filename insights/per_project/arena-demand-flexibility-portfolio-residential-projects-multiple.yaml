- record_id: ARENA-DLV-53867
  source_title: Demand Flexibility Portfolio Retrospective Analysis Report
  publish_date: 2023-07
  project_name: ARENA Demand Flexibility Portfolio — Residential Projects (multiple)
  what_happened: Residential demand flexibility pilots extensively experimented with
    payment models; sign-up bonuses below $10–$50 were found insufficient to pass
    the 'get out of bed' test, split rebate structures (staged payments) performed
    worse than single upfront payments, and financial incentives — while important
    for acquisition — had diminishing impact on ongoing participation.
  lesson_learnt: Residential demand flexibility programs require an upfront sign-up
    payment of at least $10–$50 to achieve adequate enrolment; staged or back-loaded
    rebate structures reduce sign-up rates. Financial incentives should be structured
    as a recruitment tool, with program loyalty and environmental values being the
    primary drivers of sustained participation.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: commercial & market
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Rheem switched from a two-tranche rebate to a single upfront
    payment, which improved sign-up rates. AGL observed demand response became a 'loyalty
    program' valued for reasons beyond financial returns.
  transferability: broad
  delay_magnitude: null
  technology_domain: demand response
  source_pages:
  - 10
  - 35
  evidence_excerpt: 'Models over time coalesced around several core features: ''opt-in/opt-out''
    models to reduce concerns about being locked-in, no up-front costs, and sign-up
    payments sufficiently large to meet the ''get out of bed'' test (variously estimated
    between $10 - $50). Up-front payments were sometimes considered insufficient by
    customers and the structure of payments needed to be adjusted throughout pilots
    to bring forward payments.'
