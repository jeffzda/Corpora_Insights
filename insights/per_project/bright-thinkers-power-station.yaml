  what_happened: The average NEM price fell 29% from $84.85/MWh in 2019 to $59.89/MWh
    in 2020, while high-price events over $2,000/MWh increased more than sixfold (from
    5 to 31 events), creating a lower-average but higher-volatility market environment
    that affected BTPS NEM revenue relative to initial forecasts.
  lesson_learnt: Project revenue models for urban solar assets with NEM participation
    should stress-test both a lower average price and a higher volatility scenario
    — the BTPS architecture can capture high-price events (which typically occur in
    summer afternoons when solar is still generating) and partially offset lower average
    prices, but this upside should be modelled explicitly rather than assumed.
