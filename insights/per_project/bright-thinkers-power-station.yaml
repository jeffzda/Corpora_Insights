  publish_date: '2021-06-25'
  project_name: Bright Thinkers Power Station™
  what_happened: The BTPS proof-of-concept 1.7MW system was commissioned in March/April
    2020 and operated for over 12 months, successfully demonstrating dynamic switching
    of solar energy between behind-the-meter PPA supply and front-of-meter NEM trading,
    delivering the project in scope, time and budget.
  lesson_learnt: Including all major regulatory stakeholders (DNSP, AEMO) from the
    earliest whiteboard design stage minimises scope creep and delays — the BTPS team
    credits this practice with completing the project on scope, time and budget with
    a low number of design iterations.
