- record_id: ARENA-DLV-47206
  source_title: Bright Thinkers Power Station Knowledge Sharing Report
  publish_date: '2021-06-25'
  project_name: Bright Thinkers Power Station™
  what_happened: Epho engaged Endeavour Energy (the local DNSP) during the initial
    planning phase to undertake a Preliminary Technical Review; this allowed the BTPS
    controls and protection design to be shaped to meet DNSP requirements before design
    was finalised, and ultimately secured approval — the first time this technology
    class had been approved in the DNSP industry.
  lesson_learnt: Engage the DNSP at the very start of the planning phase for novel
    behind-and-front-of-meter technology — DNSPs are risk-averse and favour known
    technology, so early engagement gives them adequate time to become familiar with
    the new concept and avoids costly redesign after connection requirements are imposed
    post-design-freeze.
  issue_severity: none
  project_type: generation
