- record_id: ARENA-DLV-47216
  source_title: Bright Thinkers Power Station Knowledge Sharing Report
  publish_date: '2021-06-25'
  project_name: Bright Thinkers Power Station™
  what_happened: Customers (tenants) in the commercial solar market prefer consumption-based
    PPAs over generation-based PPAs because generation PPAs transfer the risk of unused
    solar energy to the customer; financiers traditionally prefer generation PPAs
    for their revenue certainty. This tension was identified as a barrier to deal
    closure in the market.
  lesson_learnt: Structure commercial solar PPAs as consumption-based where possible
    to improve customer uptake — generation PPAs favour financiers but are a barrier
    for customers; technologies or commercial structures that provide an alternative
    revenue stream for surplus energy (such as NEM trading) allow both parties to
    accept a consumption PPA without financier overexposure.
