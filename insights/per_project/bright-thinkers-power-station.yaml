  project_name: Bright Thinkers Power Station™
  what_happened: The BTPS dual-revenue model (behind-the-meter PPA plus front-of-meter
    NEM trading) provided a structural contingency against tenant vacancy risk — if
    a tenant vacates, the asset owner retains the ability to sell all energy to the
    NEM rather than being stranded with no revenue, which is not possible under a
    conventional behind-the-meter-only PPA arrangement.
  lesson_learnt: For industrial rooftop solar projects structured around a single-tenant
    PPA, tenant vacancy represents a material stranded-asset risk; incorporating a
    front-of-meter NEM trading capability as a fallback revenue stream materially
    de-risks the financier and landlord position without requiring additional physical
    infrastructure.
