  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: The BTPS NEM trading capability provided a fallback revenue stream
    that enabled the financier to accept a consumption-based PPA, resolving the traditional
    financier-customer tension.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id016
  - 15
  evidence_excerpt: Whilst traditionally financiers prefer generation Power Purchase
