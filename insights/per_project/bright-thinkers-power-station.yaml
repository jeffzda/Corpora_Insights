  project_name: Bright Thinkers Power Station™
  what_happened: Because BTPS was a novel commercial arrangement with no direct precedents,
    all contractual documents had to be prepared from first principles; this created
    uncertainty and slowed negotiations between the landlord, tenant and asset owner.
  lesson_learnt: When structuring a first-of-kind commercial arrangement, assemble
    related accepted precedents from analogous (non-identical) deals to anchor negotiations,
    and engage quality legal advisers early — this builds mutual confidence, avoids
    perceptions of undue advantage, and accelerates contract execution.
