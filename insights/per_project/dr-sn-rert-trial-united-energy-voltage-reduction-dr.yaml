- record_id: ARENA-DLV-20727
  source_title: Demand Response Short Notice RERT Trial Year 3 Report
  publish_date: 2021-10
  project_name: DR SN RERT Trial — United Energy voltage reduction DR
  what_happened: United Energy demonstrated throughout the trial that voltage reduction across zone substations using its Dynamic Voltage Management System (DVMS) and smart meter technology could reliably
    deliver 30 MW of RERT-eligible DR while keeping delivered voltages within regulated limits; it also developed and had AEMO accept a temperature-adjusted variant of the '10 of 10' baseline methodology.
  lesson_learnt: Distribution businesses with DVMS and smart metering infrastructure can deliver reliable, large-scale RERT capacity through voltage reduction without needing to recruit individual customers
    or install additional hardware; this model is directly scalable as smart meter rollout expands and becomes increasingly important as DER penetration increases voltage management complexity.
