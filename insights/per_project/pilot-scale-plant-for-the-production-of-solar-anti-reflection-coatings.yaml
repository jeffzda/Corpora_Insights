- record_id: ARENA-DLV-70402
  source_title: A Pilot-Scale Plant for the Production of Solar Antireflection Coatings
  publish_date: 2015-06
  project_name: Pilot-Scale Plant for Solar Anti-Reflection Coatings (Project 1-US018)
  what_happened: BMT engaged with multiple global PV module manufacturers during the project before identifying a single lead customer whose product needs closely matched BMT's value proposition; subsequent
    product and plant design was focused on that customer, culminating in advanced commercial negotiations for the first full manufacturing plant.
  lesson_learnt: For early-stage manufacturing technology projects, initiating broad customer engagement early in the project — rather than after technical development is complete — enables product and
    plant design to be shaped by real customer requirements, increasing the probability of a commercial outcome by project end.
