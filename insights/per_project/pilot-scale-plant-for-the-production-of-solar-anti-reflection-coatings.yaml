- record_id: ARENA-DLV-70401
  source_title: A Pilot-Scale Plant for the Production of Solar Antireflection Coatings
  publish_date: 2015-06
  project_name: Pilot-Scale Plant for Solar Anti-Reflection Coatings (Project 1-US018)
  what_happened: Brisbane Materials Technology successfully scaled its AR coating process from small laboratory batches (up to 30 cm x 30 cm) to PV module-relevant sizes (120 cm x 80 cm and above) by building
    a pilot plant at its Brisbane facility and a prototype production plant at its European equipment manufacturing partner's site.
  lesson_learnt: For novel manufacturing processes being scaled from lab to commercial production, a two-site development model — pilot plant at the technology developer's site and prototype production
    plant at the equipment manufacturer's site — can allow engineering learnings to be systematically transferred and design iterations to be validated before committing to a full manufacturing plant.
