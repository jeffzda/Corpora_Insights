- record_id: ARENA-DLV-70403
  source_title: A Pilot-Scale Plant for the Production of Solar Antireflection Coatings
  publish_date: 2015-06
  project_name: Pilot-Scale Plant for Solar Anti-Reflection Coatings (Project 1-US018)
  what_happened: The ARENA-funded pilot project produced qualification sample batches that were tested by the lead customer, and by project completion BMT had designed its first full-scale manufacturing
    plant and was in advanced contract negotiations with a major global PV module manufacturer — demonstrating a full pathway from lab to commercial readiness within a single ARENA project.
  lesson_learnt: Pilot-scale manufacturing projects that include explicit deliverables for customer qualification batches and full manufacturing plant design — not just technical proof of concept — are
    better positioned to convert ARENA funding into a commercial outcome by project end.
