- record_id: ARENA-DLV-36955
  source_title: Insights from ARENA's Public Charging Projects
  publish_date: 2024-06
  project_name: ARENA Future Fuels Fund Round 1 – Public Charging Projects (portfolio)
  what_happened: CCS2 emerged as the dominant EV plug standard in Australia, with
    8 of the top 10 best-selling EV models in 2021 (representing 83.8% of all EVs
    sold that year) using CCS2. CHAdeMO utilisation at Ampol sites fell well below
    CCS2 utilisation, leaving CPOs that had invested in chargers with one plug of
    each type with underutilised CHAdeMO ports.
  lesson_learnt: CPOs should monitor EV manufacturer plug-type trends closely and
    weight new charging bay investment toward CCS2; deploying equal CCS2 and CHAdeMO
    capacity is likely to result in chronic underutilisation of CHAdeMO ports and
    reduced return on capital.
