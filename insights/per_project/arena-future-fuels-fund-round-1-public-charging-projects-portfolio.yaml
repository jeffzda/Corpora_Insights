- record_id: ARENA-DLV-36969
  source_title: Insights from ARENA's Public Charging Projects
  publish_date: 2024-06
  project_name: ARENA Future Fuels Fund Round 1 – Public Charging Projects (portfolio)
  what_happened: Ampol reported that electricity distribution networks were constrained
    by the high volume of simultaneous connection projects and supply chain disruptions,
    causing significant delays to new site connections. JOLT found that connection
    processes could take up to six months depending on complexity. Evie's data (Table
    6) showed significant time from application to energisation across its ultrafast
    charging highway sites.
  lesson_learnt: Begin grid connection applications as early as possible in the project
    development process — even before a site is ready to be energised — as network
    congestion, equipment supply constraints, and process complexity routinely extend
    connection timelines to six months or more, and early engagement helps establish
    firmer timeframes and builds collaborative relationships with the network.
