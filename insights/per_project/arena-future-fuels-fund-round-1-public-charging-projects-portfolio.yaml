- record_id: ARENA-DLV-36966
  source_title: Insights from ARENA's Public Charging Projects
  publish_date: 2024-06
  project_name: ARENA Future Fuels Fund Round 1 – Public Charging Projects (portfolio)
  what_happened: Chargefox and Evie both observed that aggregated EV charging loads
    align temporally with periods of solar PV export (midday). Co-locating solar PV
    at charging sites — or developing on sites with existing solar PV — allows charging
    loads to consume on-site renewable energy, reducing net grid demand and potentially
    deferring network augmentation.
  lesson_learnt: Co-locating solar PV with public EV charging sites is a commercially
    attractive strategy — the temporal alignment of midday charging demand with solar
    generation reduces grid energy costs and may defer costly network augmentation;
    battery storage can extend this benefit to evening hours as costs continue to
    fall.
