- record_id: ARENA-DLV-36972
  source_title: Insights from ARENA's Public Charging Projects
  publish_date: 2024-06
  project_name: ARENA Future Fuels Fund Round 1 – Public Charging Projects (portfolio)
  what_happened: ENGIE noted that EV chargers need to interface with building management
    systems (BMS) for site load management but that OCPP EV charging systems are difficult
    to integrate with BMS. Chargefox recommended dynamic connections — which measure
    available network asset capacity in real time and allocate the remainder to EV
    chargers — as an effective load management tool that can avoid costly network
    augmentation.
  lesson_learnt: Specify BMS-to-OCPP integration requirements at the design stage
    and consider dynamic load connections as a preferred alternative to static capacity
    allocation — dynamic connections make maximum use of existing network headroom
    and can eliminate or defer costly augmentation works.
