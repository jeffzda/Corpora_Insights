- record_id: ARENA-DLV-36954
  source_title: Insights from ARENA's Public Charging Projects
  publish_date: 2024-06
  project_name: ARENA Future Fuels Fund Round 1 – Public Charging Projects (portfolio)
  what_happened: CPOs observed that only 5–10% of EV charging occurs at public charging
    sites, with the majority happening at home. Public charging sessions typically
    lasted 20–30 minutes for 10–20 kWh — opportunistic top-ups rather than full charges
    — and peak public charging demand occurred in the middle of the day, the inverse
    of typical network demand profiles.
  lesson_learnt: Public fast-charging infrastructure should be designed around opportunistic
    top-up behaviour (short sessions, midday peaks) rather than the full-charge model
    of ICE refuelling — this affects bay sizing, session pricing, tariff negotiation
    with DNSPs, and site capacity planning.
