- record_id: ARENA-DLV-36957
  source_title: Insights from ARENA's Public Charging Projects
  publish_date: 2024-06
  project_name: ARENA Future Fuels Fund Round 1 – Public Charging Projects (portfolio)
  what_happened: Australian standards governing compliance requirements for EV fast-charging
    equipment were found to be ambiguous by Ampol, leaving CPOs reliant on international
    certifications (UL, CE). No Australian standards exist for testing the interoperability
    of EV charging between manufacturers, and detailed diagnostics for specific vehicle-charger
    compatibility issues can only be accessed by the equipment manufacturer rather
    than the CPO.
  lesson_learnt: In the absence of domestic EV charging standards, CPOs should partner
    only with suppliers that have a proven track record of compliant Australian installations
    and carry internationally recognised certifications; standards gaps around interoperability
    will worsen as new EV models and charging concepts (e.g. Plug & Charge) proliferate.
