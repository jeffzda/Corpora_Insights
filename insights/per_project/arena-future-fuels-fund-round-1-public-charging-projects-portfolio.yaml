- record_id: ARENA-DLV-36974
  source_title: Insights from ARENA's Public Charging Projects
  publish_date: 2024-06
  project_name: ARENA Future Fuels Fund Round 1 – Public Charging Projects (portfolio)
  what_happened: CPOs consistently identified site visibility and proximity to high-traffic
    locations (fuel stations, shopping centres, visitor attractions, urban hubs) as
    the primary driver of utilisation. JOLT modelled expected current and future charging
    demand using traffic volume data, and Ampol developed an AI-based utilisation
    modelling tool to determine optimal charger sizing by location.
  lesson_learnt: Prioritise visibility and proximity to high-traffic demand generators
    in site selection — traffic volume modelling (including pedestrian and vehicle
    flows) is a practical tool for ranking candidate sites, and charger sizing should
    be calibrated to location-specific utilisation projections rather than a uniform
    standard.
