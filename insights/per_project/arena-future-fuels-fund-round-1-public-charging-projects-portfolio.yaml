- record_id: ARENA-DLV-36973
  source_title: Insights from ARENA's Public Charging Projects
  publish_date: 2024-06
  project_name: ARENA Future Fuels Fund Round 1 – Public Charging Projects (portfolio)
  what_happened: COVID-19 lockdowns prevented CPOs from accessing sites for commissioning
    grid connections. Ampol and ENGIE developed virtual feasibility assessment tools,
    and Chargefox developed a remote commissioning system in which charger manufacturers
    supervised trained local electricians off-site, eliminating the need to book scarce
    commissioning teams and avoiding further schedule delays.
  lesson_learnt: Develop remote commissioning capability as a standard delivery tool
    — the ability for charger manufacturers to supervise local electricians remotely
    removes dependence on scarce specialist commissioning teams, increases scheduling
    flexibility, and reduces connection delay; this benefit persists well beyond any
    acute public health emergency.
