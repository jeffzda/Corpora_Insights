- record_id: ARENA-DLV-36958
  source_title: Insights from ARENA's Public Charging Projects
  publish_date: 2024-06
  project_name: ARENA Future Fuels Fund Round 1 – Public Charging Projects (portfolio)
  what_happened: ENGIE, EHT, Chargefox, and Ampol all experienced extended procurement
    lead times for charging equipment due to COVID-19-driven supply chain disruptions
    including chip shortages, shipping delays, and exponential growth in global EV
    charging demand. Raw material price increases also raised equipment costs.
  lesson_learnt: Procure EV charging equipment well ahead of installation schedules
    and establish contingency supply arrangements — global supply chains for charging
    equipment are vulnerable to compounding disruptions (chip shortages, shipping
    delays, demand surges) that can extend lead times unpredictably; sourcing from
    multiple suppliers and regions reduces exposure.
