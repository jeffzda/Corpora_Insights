- record_id: ARENA-DLV-36978
  source_title: Insights from ARENA's Public Charging Projects
  publish_date: 2024-06
  project_name: ARENA Future Fuels Fund Round 1 – Public Charging Projects (portfolio)
  what_happened: Chargefox and Ampol reported significant time lags in obtaining site
    approvals and licences from landlords. Delays arose from landlords with limited
    EV knowledge, competition among CPOs for the same sites leading to more demanding
    landlords, conflicts between executive-level and tenant-level stakeholders within
    property groups, and landlord reluctance to sacrifice parking spaces for installation
    works.
  lesson_learnt: Engage with site landlords and property groups as early as possible
    and pursue binding agreements rather than letters of intent — non-binding pre-approvals
    have a material failure rate as landlords change positions; engage directly with
    decision-makers (not tenants), and anticipate lengthy, non-linear approval processes
    when scheduling project timelines.
  issue_severity: major
  project_type: transport electrification
  project_scale_band: commercial expansion
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: stakeholder/land/community
  failure_mode: coordination & stakeholders
  outcome_class: delayed but recoverable
  secondary_failure_mode: poor scoping
  intervention_note: Evie recommended dealing directly with landlords rather than
    tenants and signing long-term agreements that allow cost recovery over the project's
    operating life.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: EV
  source_pages: &id013
  - 29
  evidence_excerpt: Chargefox and Ampol both mentioned the significant time lags associated
    with seeking site approvals and licences, which can delay projects... They cited
