- record_id: ARENA-DLV-36951
  source_title: Insights from ARENA's Public Charging Projects
  publish_date: 2024-06
  project_name: ARENA Future Fuels Fund Round 1 – Public Charging Projects (portfolio)
  what_happened: EV uptake fell below even conservative industry forecasts during
    COVID-19, leaving ultrafast chargers at around 1% utilisation (approximately 30
    minutes of charging per site per day) through 2020–2021. As COVID-19 impacts subsided
    through 2022–2023, demand began doubling every 4–5 months at Evie Networks sites
    and monthly EV sales rose from around 900 to 5,000.
  lesson_learnt: Demand forecasts for early-stage EV charging infrastructure should
    incorporate wide uncertainty bands and be revisited frequently — COVID-19 demonstrated
    that external shocks can suppress utilisation well below conservative baseline
    projections for extended periods, but recovery can be rapid once conditions normalise.
