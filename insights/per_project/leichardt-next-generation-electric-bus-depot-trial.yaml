- record_id: ARENA-DLV-29563
  source_title: DEIP - DEIP Dive - Event Summary 2023
  publish_date: 2023-07
  project_name: Leichardt Next Generation Electric Bus Depot Trial
  what_happened: The Leichardt Next Generation Electric Bus Depot trial deployed 40 electric buses with smart charging software, on-site solar PV, battery storage, a 1.5MVA substation, 31 400VAC chargers
    and five 150–950VDC dual-gun chargers capable of simultaneously charging two buses — demonstrating an integrated multi-technology depot charging solution at operational scale.
  lesson_learnt: Electric bus depot electrification requires integrated planning across charging hardware (AC and DC), on-site generation and storage, and grid connection (substation) as a single system
    — treating these as separate procurement packages risks integration failures and should be avoided in fleet electrification projects.
