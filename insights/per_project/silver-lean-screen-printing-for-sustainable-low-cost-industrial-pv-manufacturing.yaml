- record_id: ARENA-DLV-36204
  source_title: Interim R&D Phase Public Dissemination Report – Silver-lean screen-printing
    for sustainable low-cost industrial PV manufacturing at the terawatt scale
  publish_date: 2024-08
  project_name: Silver-lean screen-printing for sustainable low-cost industrial PV
    manufacturing at the terawatt scale
  what_happened: The project successfully developed and demonstrated a roadmap showing
    that achieving the 5 mg/W silver consumption target for TOPCon and SHJ cells using
    existing standard metallisation designs would require reducing silver finger widths
    to below 20 µm or even 10 µm — dimensions that current mass-production screen-printing
    technology cannot reliably achieve — establishing that alternative silver-lean
    paste materials are necessary to reach the target.
  lesson_learnt: Technology development projects targeting silver reduction in PV
    manufacturing should establish a quantitative capability roadmap early — defining
    the physical limits of existing manufacturing technology (e.g., minimum printable
    finger width) clarifies which targets require new materials or processes rather
    than incremental improvement, and prevents wasted effort optimising approaches
    that cannot reach the target.
  issue_severity: minor
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: concept/feasibility
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id004
  - 5
  - 8
  - 9
  evidence_excerpt: Substantial reductions in silver finger width towards less than
    20 µm or even 10 µm are mandatorily required for TOPCon and SHJ solar cells with
    existing standard metallization designs. Current screen-printing technologies
    will face significant challenges in meeting such requirements, particularly in
    mass-production environments.
  confidence_note: issue_severity set to minor as this is a technical scoping finding
    that shaped the project direction rather than a delivery failure.
