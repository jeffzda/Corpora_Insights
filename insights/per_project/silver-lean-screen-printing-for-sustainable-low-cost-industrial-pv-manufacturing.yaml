- record_id: ARENA-DLV-36203
  source_title: Interim R&D Phase Public Dissemination Report – Silver-lean screen-printing
    for sustainable low-cost industrial PV manufacturing at the terawatt scale
  publish_date: 2024-08
  project_name: Silver-lean screen-printing for sustainable low-cost industrial PV
    manufacturing at the terawatt scale
  what_happened: When plating copper onto screen-printed silver-lean contacts using
    a hybrid metallisation approach, the plating process was found to be highly sensitive
    to surface conditions. Ghost plating occurred in areas with screen-printed paste
    residues or insufficient dielectric coverage, and lateral metal growth increased
    finger width and shading losses, reducing cell efficiency. Uneven plating also
    resulted from conductivity differences in different directions caused by the shape
    of screen-printed fingers.
  lesson_learnt: Hybrid screen-printing/plating metallisation requires careful attention
    to surface preparation at every processing step — minimise screen-printed paste
    residues along finger sides, avoid mechanical surface scratches during handling
    and transport, and optimise finger shape to prevent ghost plating and lateral
    growth that degrade cell efficiency; these process controls are essential before
    any scale-up attempt.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Systematic process controls were identified — minimising paste
    residues, careful mechanical handling to avoid surface scratches, and optimising
    screen-printed finger shape — and devices with improved efficiency and reduced
    silver usage were successfully fabricated after applying these controls.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id003
  - 12
  - 13
  evidence_excerpt: Plating is highly sensitive to the silicon cell surface conditions
    and therefore screen-print paste residues, surface scratches, or poor printing
    quality can cause plating in undesired areas, reducing the cell efficiency...
    careful design and preparation in screen-printing, sample handling and packing
    are essential when using a hybrid metallisation approach to achieve silver-lean
    metallisation for solar cells.
  confidence_note: null
