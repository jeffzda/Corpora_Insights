  source_title: Interim R&D Phase Public Dissemination Report – Silver-lean screen-printing
    for sustainable low-cost industrial PV manufacturing at the terawatt scale
  publish_date: 2024-08
  project_name: Silver-lean screen-printing for sustainable low-cost industrial PV
    manufacturing at the terawatt scale
  what_happened: Technology transfer to industry partners commenced ahead of the project's
    formal commercialisation stage, with new screen designs shared and pilot trials
    underway. The first pilot trials at partner facilities achieved TOPCon cell efficiencies
    of 25.5–26%, demonstrating that the silver-lean metallisation approach developed
    at UNSW is viable in industrial production environments.
  lesson_learnt: Initiating technology transfer and pilot trials with industry partners
    before the formal commercialisation stage accelerates the pathway from lab to
    commercial readiness — early partner engagement allows commercial-scale challenges
    to be identified in parallel with ongoing R&D optimisation rather than sequentially.
