  evidence_excerpt: In 2023, the PV industry has observed a swift transition from
    traditional p-type technologies to high-efficiency n-type solar cells. Over the
    past 12 months alone, more than 500 GW of n-type (TOPCon, SHJ, XBC) production
    capabilities have been added to the market... Providing that n-type solar cell
    technologies have almost doubled the silver consumption of traditional p-type,
    such considerable growth in n-type production will substantially increase the
    silver demand in the PV industry.
  confidence_note: Project scope was not formally re-scoped via a variation but the
