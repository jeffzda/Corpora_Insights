- record_id: ARENA-DLV-36201
  source_title: Interim R&D Phase Public Dissemination Report – Silver-lean screen-printing
    for sustainable low-cost industrial PV manufacturing at the terawatt scale
  publish_date: 2024-08
  project_name: Silver-lean screen-printing for sustainable low-cost industrial PV
    manufacturing at the terawatt scale
  what_happened: The rapid industry-wide transition from p-type PERC to n-type solar
    cell technologies (TOPCon, SHJ) significantly increased silver demand, as n-type
    cells consume 2–3× more silver than PERC cells. Over 500 GW of n-type production
    capacity was added in 2023 alone, making the project's original focus on PERC
    increasingly less industrially relevant and requiring a reorientation of R&D emphasis
    toward n-type cell architectures.
  lesson_learnt: Future R&D projects targeting silver reduction in PV manufacturing
    must prioritise n-type solar cell technologies (TOPCon, SHJ, back-contact) from
    the outset — the industry transition to n-type is accelerating and their inherently
    higher silver consumption (10–17 mg/W vs. 5–7 mg/W for PERC) makes them the critical
    bottleneck for sustainable TW-scale production.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Project reoriented to place more R&D emphasis on n-type cell
    technologies (TOPCon, SHJ) to maintain industrial relevance.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id001
