- record_id: ARENA-DLV-36202
  source_title: Interim R&D Phase Public Dissemination Report – Silver-lean screen-printing
    for sustainable low-cost industrial PV manufacturing at the terawatt scale
  publish_date: 2024-08
  project_name: Silver-lean screen-printing for sustainable low-cost industrial PV
    manufacturing at the terawatt scale
  what_happened: Replacing conventional silver rear contacts with aluminium contacts
    in TOPCon solar cells caused substantial performance degradation. During high-temperature
    firing, aluminium penetrated and fully destroyed the thin (~100 nm) polysilicon
    passivation layers, forming up to 10 µm-deep eutectic/porous Al-Si layers that
    severely compromised surface passivation quality and increased carrier recombination
    losses.
  lesson_learnt: When substituting paste materials in next-generation solar cell architectures,
    comprehensively characterise metal-silicon interactions before committing to a
    contact scheme — aluminium pastes that work well in p-type PERC cells can destroy
    the nanometre-scale passivation layers critical to TOPCon performance, requiring
    fundamental redesign of the contact approach.
  issue_severity: major
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: A blocking layer was inserted between the aluminium contact and
    polysilicon surface to prevent direct Al-Si interaction; preliminary results showed
    substantially improved passivation quality, though minor aluminium diffusion through
    the blocking layer remained a residual challenge.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id002
  - 10
  - 11
  evidence_excerpt: Up to 10 µm-deep eutectic/porous Al-Si layers were formed at direct
    Al-Si interfaces after firing. The depth of regions affected by Al-Si interaction
    goes way beyond the thickness of polysilicon layers at approximately 100 nm, indicating
    that polysilicon layers were fully penetrated by Al contacts or Al-Si alloys.
    As a result, the effectiveness of surface passivation with SiO2/poly-Si layers
    had been compromised by those aluminium contacts.
  confidence_note: null
