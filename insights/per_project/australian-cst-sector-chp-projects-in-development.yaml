- record_id: ARENA-DLV-47058
  source_title: Australian Concentrating Solar Thermal Industry Roadmap
  publish_date: 2018-08
  project_name: Australian CST Sector — CHP Projects in Development
  what_happened: Multiple CST combined heat and power (CHP) projects reviewed by the
    Roadmap team (ranging from 6 to 50 MWth, all at development stage) were stalled
    at financial close primarily because potential industrial off-takers lacked confidence
    in the technology integration process, perceiving disruption and operational risk
    to their core business even though they would not directly carry technology investment
    risk.
  lesson_learnt: When developing behind-the-meter CST CHP projects for industrial
    off-takers, the primary barrier is not technology cost but off-taker confidence
    in integration risk — developers should invest early in demonstration of integration
    process and operational continuity assurance, potentially through staged connection
    or contractual risk protections, before seeking financial close.
  issue_severity: major
  project_type: generation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: financing/commercial close
  failure_mode: coordination & stakeholders
  outcome_class: delayed but recoverable
  secondary_failure_mode: commercial & market
  intervention_note: Roadmap recommends ARENA grant funding for small demonstration
    projects and CEFC finance products specifically designed for behind-the-meter
    CHP systems to reduce barriers for off-takers.
  transferability: moderate
