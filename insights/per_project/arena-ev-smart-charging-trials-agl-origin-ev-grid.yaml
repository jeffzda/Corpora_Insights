- record_id: ARENA-DLV-27017
  source_title: Insights from Smart Charging Trials Data (Update)
  publish_date: '2023-08-02'
  project_name: ARENA EV Smart Charging Trials (AGL, Origin, EV Grid)
  what_happened: Across all three trials, EV charging data was collected by three
    different providers with different levels of participant characteristic data —
    EV Grid collected the richest dataset including annual km driven, DER installation
    status, and charger model, while AGL collected only charger power and model, limiting
    cross-trial analytical comparability.
  lesson_learnt: Future EV smart charging trials should standardise minimum participant
    characteristic data requirements across proponents — inconsistent data collection
    across AGL, Origin, and EV Grid limited the ability to make like-for-like comparisons
    and reduced the analytical value of the aggregated dataset.
