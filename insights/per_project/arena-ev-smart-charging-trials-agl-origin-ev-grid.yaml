  evidence_excerpt: Comparison shows that the trial outcomes show close to half of
    CSIRO's modelled average daily consumption. The CSIRO's assumption arises from
    an average annual driving distance of 11,000 km/year. This implies that the trial
    vehicles do not entirely charge at home, or potentially also drive below the average
    annual driving distance.
