- record_id: ARENA-DLV-27018
  source_title: Insights from Smart Charging Trials Data (Update)
  publish_date: '2023-08-02'
  project_name: ARENA EV Smart Charging Trials (AGL, Origin, EV Grid)
  what_happened: Trial participant samples were heavily skewed toward urban capital
    city residents and prosumers with rooftop solar — EV Grid reported 72% of participants
    had rooftop solar PV, compared to the broader population, and the vast majority
    of participants across all three trials were from capital cities.
  lesson_learnt: EV smart charging trial results derived from prosumer-heavy, urban-skewed
    samples should not be directly extrapolated to mass-market EV populations — future
    trials need deliberate recruitment strategies to include non-solar, regional,
    and lower-income segments to generate broadly applicable findings.
  issue_severity: moderate
  project_type: transport electrification
