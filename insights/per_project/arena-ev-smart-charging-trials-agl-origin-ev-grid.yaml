- record_id: ARENA-DLV-27016
  source_title: Insights from Smart Charging Trials Data (Update)
  publish_date: '2023-08-02'
  project_name: ARENA EV Smart Charging Trials (AGL, Origin, EV Grid)
  what_happened: Comparison of trial data against AEMO's NEM ISP modelled EV charging
    load shapes showed that trial participants exhibited materially more daytime charging
    than AEMO profiles assumed, and trial average daily consumption was close to half
    of CSIRO's modelled average — approximately 3–4 kWh/day versus 6–7 kWh/day modelled.
  lesson_learnt: AEMO and CSIRO EV charging assumptions significantly overestimate
    average home-charging energy consumption and underestimate daytime charging —
    planners using these models for network or generation investment decisions should
    recalibrate against real-world trial data, particularly for behind-the-meter L2
    charging.
