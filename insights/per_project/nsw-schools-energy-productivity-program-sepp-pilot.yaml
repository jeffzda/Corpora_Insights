  what_happened: Some schools lacked sufficient WiFi to download the Demand Tracker
    App, and in at least one case the designated staff member's mobile phone was too
    old to support any app download, leaving those schools unable to benefit from
    the demand management tool.
  lesson_learnt: 'Before deploying app-based demand management tools in institutional
    settings, run a simple pre-qualification check confirming: (a) a willing staff
    member exists, (b) they have a compatible smartphone, and (c) the site has adequate
