- record_id: ARENA-DLV-33351
  source_title: NSW Schools Energy Productivity Program (SEPP) Project Results
  publish_date: '2019-04-12'
  project_name: NSW Schools Energy Productivity Program (SEPP)
  what_happened: Meter Data Providers (MDPs) were slow to respond, slow to provide
    technical resources, and when data quality problems arose (late or missing data)
    the MDP did not produce a solution, undermining the near-real-time data feed required
    by the Demand Tracker App.
  lesson_learnt: Do not rely on MDPs as the primary data acquisition route for demand
    management tools — they lack incentive to prioritise third-party projects. Future
    projects should weight alternatives (direct client API or own metering) more heavily,
    despite the cost and complexity tradeoffs.
