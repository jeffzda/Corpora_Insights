  project_name: NSW Schools Energy Productivity Program (SEPP)
  what_happened: Connecting the Posterboard digital display screens to the existing
    school IT network proved unexpectedly difficult; DoE IT staff were not proactive,
    and a workable solution was not agreed until approximately 12 months after first
    contact. Standalone modems were purchased as a workaround.
  lesson_learnt: Liaison with institutional IT departments (e.g. DoE IT) for network
    access should begin at the proposal or RFT stage, not during implementation —
    the process took 12 months and required a workaround purchase of standalone modems.
    Early testing should also be built into the schedule.
