  what_happened: 'Staff and student energy literacy improved substantially through
    the engagement program: understanding of electricity bills rose from 18% to 55%
    of respondents, and understanding of the concept of electricity demand rose from
    36% to 72%, though engagement levels varied markedly between schools.'
  lesson_learnt: A structured energy literacy program embedded alongside capital works
    in institutional settings can approximately triple awareness of billing and demand
    concepts, but engagement is uneven — schools that are already resource-constrained
    will not engage regardless of program quality, and the program design should account
    for this heterogeneity.
