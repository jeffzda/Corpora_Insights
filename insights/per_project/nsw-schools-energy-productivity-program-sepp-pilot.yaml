- record_id: ARENA-DLV-33354
  source_title: NSW Schools Energy Productivity Program (SEPP) Project Results
  publish_date: '2019-04-12'
  project_name: NSW Schools Energy Productivity Program (SEPP)
  what_happened: Five of 20 Posterboard screens experienced outages during the one-year
    trial due to blackouts, WiFi issues, or physical interference (e.g. a school removed
    a screen to paint a wall and did not reinstall it correctly). Schools did not
    reliably self-report these outages to the project team.
  lesson_learnt: Remote monitoring and remote-access troubleshooting capability should
    be costed and built into any digital hardware rollout in a busy institutional
    environment — schools cannot be relied upon to self-report device outages, and
    a weekly online-hours report with remote restart capability would allow issues
    to be detected and resolved without burdening site staff.
