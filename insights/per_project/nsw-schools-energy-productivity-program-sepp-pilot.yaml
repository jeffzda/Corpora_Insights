  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: null
  failure_mode: coordination & stakeholders
  outcome_class: partial success
  secondary_failure_mode: null
  intervention_note: ERM Power added a summary page to the front of the standard Level
    2 audit output and moved less-relevant calculations to a background Excel document
    for SINSW; an energy consultant also walked schools through key findings in person.
  transferability: moderate
  delay_magnitude: null
  technology_domain: demand response
