- record_id: ARENA-DLV-33355
  source_title: NSW Schools Energy Productivity Program (SEPP) Project Results
  publish_date: '2019-04-12'
  project_name: NSW Schools Energy Productivity Program (SEPP)
  what_happened: Despite ERM Power simplifying the Level 2 Energy Audit into a more
    user-friendly format with a summary page, 40% of school respondents reported not
    fully reading the Energy Report and 45% did not fully read the educational materials,
    reflecting time constraints and competing priorities in the school environment.
  lesson_learnt: Energy audit outputs and educational materials for time-poor institutional
    audiences (e.g. schools) should be further tailored and condensed — even a simplified
    Level 2 audit format yielded only ~50% full engagement. Future programs should
    test even shorter, more visual formats and consider in-person delivery as the
    primary channel rather than written reports.
