- record_id: ARENA-DLV-14967
  source_title: 'Looking Forward: Barriers, Risks and Rewards of the Australian Geothermal
    Sector to 2020 and 2030'
  publish_date: 2014-06
  project_name: Deep Heat Mining Basel – EGS Project (Switzerland)
  what_happened: During hydraulic stimulation of the Basel EGS well in 2006, high
    rates of microseismic activity built up within the first six days of fluid injection,
    reaching ML 2.6; injection was stopped per a pre-defined response protocol, but
    a subsequent ML 3.4 event occurred during preparations for bleed-off, followed
    by three aftershocks above ML 3 over 56 days, leading to permanent project abandonment.
  lesson_learnt: EGS projects located beneath or near populated areas face an acute
    and potentially unmanageable microseismic risk; site selection for EGS must explicitly
    exclude locations where induced seismicity of even moderate magnitude would be
    socially or regulatorily unacceptable, and stimulation protocols alone are insufficient
    mitigation when a pre-existing fault is intersected.
