- record_id: ARENA-DLV-63953
  source_title: Port Augusta Solar Thermal Generation Feasibility Study Options Study
    Report
  publish_date: 2014-07
  project_name: Port Augusta Solar Thermal Generation Feasibility Study
  what_happened: No ground-measured Direct Normal Irradiance (DNI) data was available
    for Port Augusta at the pre-feasibility stage; the study relied solely on satellite-derived
    data from 3TIER's publicly available TMY dataset, which carried a quoted standard
    error of 16% on DNI estimates — double the 9% error of commercially acquired datasets.
  lesson_learnt: Install a ground-based meteorological station measuring DNI as early
    as possible in project development — satellite-derived DNI data carries errors
    of up to 16% for public datasets, which is unacceptable for investment-grade feasibility;
    a minimum 12 months of ground data is required to calibrate satellite projections
    and generate P50/P90 probability-based resource estimates for Stage 2 studies.
  issue_severity: moderate
  project_type: generation
  project_scale_band: null
  lifecycle_phase: concept/feasibility
  proponent_type: utility/energy retailer
  delay_category: data/validation/testing
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Alinta proceeded with installing a ground-based meteorological
    weather station at Port Augusta in early 2014 to collect at least 12 months of
    measured DNI data for calibration and use in Stage 2.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: solar thermal
  source_pages: &id006
  - 28
  - 29
  evidence_excerpt: It should be noted that no ground-measured data was available
    to 3TIER when developing this TMY dataset, therefore all solar irradiance data
    is processed satellite output and modelled output only. 3TIER has quoted a standard
    error of 16% on this publically available DNI estimate. Commercially available
    datasets from 3TIER have a quoted standard error of 9% (less when calibrated against
    ground-measured data).
