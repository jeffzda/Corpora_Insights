- record_id: ARENA-DLV-63964
  source_title: Port Augusta Solar Thermal Generation Feasibility Study Options Study
    Report
  publish_date: 2014-07
  project_name: Port Augusta Solar Thermal Generation Feasibility Study
  what_happened: The multi-criteria analysis (MCA) ranked the hybrid parabolic trough
    solar boost option as the best overall option (MCA score 4.4) primarily due to
    parabolic trough's dominant global operating track record (3,273 MW installed,
    327 cumulative plant-years), low land requirement (46 ha), and low capital cost
    per kW ($5,820/kWe) — despite having the highest LCOE ($412/MWh) among hybrid
    options.
  lesson_learnt: 'Technology selection for first-of-kind CSP in Australia should weight
    operational track record heavily: parabolic trough''s 327 cumulative plant-years
    of global experience provides substantially greater bankability, insurance, warranty,
    and O&M knowledge than power tower (16 years) or linear Fresnel (7 years) — this
    risk reduction may justify accepting a higher LCOE, particularly where the project
    is a pathfinder for a new market.'
  issue_severity: moderate
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: concept/feasibility
  proponent_type: utility/energy retailer
  delay_category: null
