- record_id: ARENA-DLV-63954
  source_title: Port Augusta Solar Thermal Generation Feasibility Study Options Study
    Report
  publish_date: 2014-07
  project_name: Port Augusta Solar Thermal Generation Feasibility Study
  what_happened: Linear Fresnel technology was found to have only 44 MW of installed
    operating capacity worldwide (versus 3,273 MW for parabolic trough and 448 MW
    for power tower) and no commercially available thermal energy storage — limiting
    its capacity factor and dispatchability and resulting in the worst overall MCA
    score among all six configurations assessed.
  lesson_learnt: Technology maturity and operating track record are critical screening
    criteria for first-of-kind commercial CSP projects in Australia; linear Fresnel's
    limited global installed base (44 MW), short operating history (7 years), and
    absence of thermal storage capability create substantial execution, performance,
    and bankability risks that should be weighed against its lower capital cost per
    kW.
