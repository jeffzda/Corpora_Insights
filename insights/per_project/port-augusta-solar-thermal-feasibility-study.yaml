- record_id: ARENA-DLV-63957
  source_title: Port Augusta Solar Thermal Generation Feasibility Study Options Study
    Report
  publish_date: 2014-07
  project_name: Port Augusta Solar Thermal Generation Feasibility Study
  what_happened: The power tower standalone configuration — when optimised with 15
    hours of molten salt thermal energy storage and a solar multiple of 3.5 — achieved
    a capacity factor of 64.7% and an LCOE of $258/MWh, making it the lowest-LCOE
    standalone option by a wide margin; this was enabled by the significantly lower
    cost of molten salt storage for power towers (~$40/kWhth) compared to parabolic
    trough systems (~$139/kWhth).
  lesson_learnt: 'Thermal energy storage economics are technology-dependent and should
    be evaluated carefully at the options stage: molten salt storage costs are approximately
    3.5 times lower per kWhth for power towers than for parabolic trough systems due
    to higher operating temperature differentials, making deep storage (15+ hours)
    economically viable for power towers but not for parabolic troughs — this fundamentally
    changes optimal plant design and LCOE outcomes.'
