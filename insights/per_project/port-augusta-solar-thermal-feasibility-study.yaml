- record_id: ARENA-DLV-63959
  source_title: Port Augusta Solar Thermal Generation Feasibility Study Options Study
    Report
  publish_date: 2014-07
  project_name: Port Augusta Solar Thermal Generation Feasibility Study
  what_happened: Solar boost hybridisation into the cold reheat line of Northern Power
    Station was found to be limited to approximately 7.3% solar penetration (displacement
    of extraction steam to the final HP feedwater heater), with penetration beyond
    ~8% creating boiler imbalance risks through unbalanced superheat and reheat steam
    flows that could cause reheat temperature control problems.
  lesson_learnt: Solar boost injection into cold reheat lines of coal-fired plant
    is inherently limited to approximately 8% penetration before causing boiler circuit
    imbalance; project developers should treat this as a hard design constraint when
    scoping solar boost hybridisation, and assess whether higher penetration via boiler
    reheat circuit modification is technically and commercially justified before committing
    to this configuration.
  issue_severity: moderate
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: concept/feasibility
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: The solar field was sized to exactly displace extraction steam
    to the final HP heater at NPS, maintaining penetration at 7.3%; parallel hybridisation
    via power tower was identified as the alternative for higher penetration.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar thermal
  source_pages:
