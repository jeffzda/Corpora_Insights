- record_id: ARENA-DLV-63961
  source_title: Port Augusta Solar Thermal Generation Feasibility Study Options Study
    Report
  publish_date: 2014-07
  project_name: Port Augusta Solar Thermal Generation Feasibility Study
  what_happened: Parabolic trough systems using synthetic oil as HTF are limited to
    a maximum operating temperature of approximately 395°C, which constrains achievable
    steam cycle conditions and prevents direct steam generation — requiring an intermediate
    heat exchanger and limiting thermal energy storage to cold/hot tank temperatures
    of 290–390°C versus 290–565°C achievable with molten salt in power towers.
  lesson_learnt: Parabolic trough systems' HTF temperature ceiling (~395°C for synthetic
    oil) is a fundamental constraint on steam cycle efficiency and storage economics;
    for projects prioritising high capacity factor and low LCOE, this HTF limitation
    makes parabolic trough less competitive than power tower in Australian conditions
    — technology selection should explicitly account for this constraint rather than
    defaulting to parabolic trough's greater operational track record.
