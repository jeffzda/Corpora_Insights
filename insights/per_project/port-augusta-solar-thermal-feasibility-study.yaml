- record_id: ARENA-DLV-63952
  source_title: Port Augusta Solar Thermal Generation Feasibility Study Options Study
    Report
  publish_date: 2014-07
  project_name: Port Augusta Solar Thermal Generation Feasibility Study
  what_happened: The remaining life of Northern Power Station was constrained to approximately
    15 years by the anticipated end-of-life of the Leigh Creek coal mine (estimated
    2032), which directly capped the financial analysis period for any hybrid solar
    plant at NPS to 15 years — significantly shorter than the 25-year analysis period
    used for standalone CSP plants.
  lesson_learnt: For solar hybrid projects co-located with fossil fuel plant, the
    remaining operational life of the host plant (driven by fuel supply or regulatory
    factors) sets a hard ceiling on project economics; a shorter analysis period materially
    increases LCOE and reduces financial attractiveness compared with standalone alternatives
    — this constraint must be identified and quantified early in feasibility.
