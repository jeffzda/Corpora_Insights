- record_id: ARENA-DLV-63958
  source_title: Port Augusta Solar Thermal Generation Feasibility Study Options Study
    Report
  publish_date: 2014-07
  project_name: Port Augusta Solar Thermal Generation Feasibility Study
  what_happened: 'Australian capital cost estimates for CSP plant were found to be
    materially higher than US reference costs: labour rates required a 1.14x multiplier
    over Californian union rates (localised to the Port Augusta region), materials
    and equipment required a 1.34x multiplier, and an additional 1.1x currency conversion
    factor (USD to AUD) was applied, collectively indicating Australian CSP capital
    costs in the order of 25–50% above US benchmarks depending on component mix.'
  lesson_learnt: US-published CSP cost benchmarks (such as NREL reference plants)
    require explicit Australian localisation before use in feasibility studies — material
    costs are approximately 34% higher and labour approximately 14% higher than Californian
    baselines, and currency conversion adds further uplift; using unadjusted US data
    will systematically understate Australian project costs and distort technology
    comparisons.
