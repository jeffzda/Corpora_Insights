- record_id: ARENA-DLV-63960
  source_title: Port Augusta Solar Thermal Generation Feasibility Study Options Study
    Report
  publish_date: 2014-07
  project_name: Port Augusta Solar Thermal Generation Feasibility Study
  what_happened: Molten salt heat transfer fluid — used in power tower systems and
    for thermal energy storage — has a freezing point of approximately 220°C, requiring
    heat tracing of all distribution piping, gravity drainage systems, and continuous
    low-flow pumped circulation to prevent freeze events; a system freeze requires
    very slow reheating to avoid rupturing piping filled with solidified salt.
  lesson_learnt: Molten salt freeze protection must be designed into power tower and
    molten salt TES systems from the outset as a primary operational risk — failure
    to heat-trace piping, maintain minimum circulation flows, or respond correctly
    to a freeze event can cause catastrophic pipe rupture during reheating; O&M procedures
    and auxiliary power loads for freeze protection should be explicitly included
    in both capital and operating cost estimates.
