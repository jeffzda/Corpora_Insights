  source_title: Port Augusta Solar Thermal Generation Feasibility Study Options Study
    Report
  publish_date: 2014-07
  project_name: Port Augusta Solar Thermal Generation Feasibility Study
  what_happened: Hybrid CSP plants (solar steam injected into Northern Power Station)
    achieved installed capital costs of $4,651–$5,820/kWe — roughly half to one-third
    of the standalone plant cost range ($6,969–$15,926/kWe) — because the existing
    turbine-generator and power block infrastructure could be reused, substantially
    lowering per-kW capital requirements.
  lesson_learnt: Solar hybridisation of existing thermal plant offers materially lower
    capital cost per kW of solar capacity than standalone CSP by leveraging existing
    power block assets; project developers should evaluate hybridisation as a cost-reduction
    pathway for first-of-kind CSP deployment, particularly where suitable host plant
    exists with known remaining life.
