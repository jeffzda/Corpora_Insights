- record_id: ARENA-DLV-63963
  source_title: Port Augusta Solar Thermal Generation Feasibility Study Options Study
    Report
  publish_date: 2014-07
  project_name: Port Augusta Solar Thermal Generation Feasibility Study
  what_happened: Once-through boilers at Northern Power Station (unlike drum-type
    boilers) lack a mechanism to protect the steam turbine from iron contamination
    that may accumulate due to thermal cycling associated with daily solar field start/stop
    operations, creating a risk of iron deposition on turbine blading in hybridised
    configurations.
  lesson_learnt: Solar hybridisation of once-through boiler plant requires inclusion
    of a 'clean-steam' heat exchanger (rather than direct steam injection) to prevent
    iron contamination of the steam cycle from solar field thermal cycling; this design
    requirement should be identified during integration assessment and costed as a
    mandatory component — omitting it risks turbine blade damage over the project
    life.
  issue_severity: minor
  project_type: generation
  project_scale_band: null
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The design specification required use of a clean-steam generator
    (heat exchanger) to isolate the solar field steam from the once-through boiler
    water circuit.
  transferability: narrow
  delay_magnitude: null
  technology_domain: solar thermal
  source_pages: &id012
  - 23
  evidence_excerpt: Hybridised systems paired with a once-through fired boiler should
    allow for a 'clean-steam' generator (i.e. heat exchanger) to avoid issues with
    iron contamination of the boiler water. The thermal cycling associated with the
    daily start/stop operation of a solar field may lead to high levels of iron transport
    in the solar field steam cycle, which can lead to iron deposition on the steam
    turbine blading.
