  project_name: Port Augusta Solar Thermal Generation Feasibility Study
  what_happened: The geography of Port Augusta (coastal location, adjacent urban development,
    coal delivery rail loop, multiple high-voltage transmission easements not under
    Alinta control) created compounding infrastructure access challenges for hybrid
    CSP integration at Northern Power Station.
  lesson_learnt: Site-specific infrastructure constraints — particularly overlapping
    rail, transmission, and land tenure constraints in peri-urban coastal locations
    — can make hybrid integration infeasible even when the host plant is technically
    suitable; these constraints should be mapped in a fatal-flaws assessment before
    investing in detailed hybrid design.
