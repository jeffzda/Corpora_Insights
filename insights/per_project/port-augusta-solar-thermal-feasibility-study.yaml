- record_id: ARENA-DLV-63962
  source_title: Port Augusta Solar Thermal Generation Feasibility Study Options Study
    Report
  publish_date: 2014-07
  project_name: Port Augusta Solar Thermal Generation Feasibility Study
  what_happened: The power tower standalone configuration required 553 ha of land
    for a 50 MWe plant — 3.8 times the 147 ha required for parabolic trough and 8.1
    times the 68 ha for linear Fresnel — due to its significantly lower aperture-to-land-use
    ratio of 0.075 compared to 0.28 for parabolic trough and 0.6 for linear Fresnel.
  lesson_learnt: Power tower CSP projects require substantially more land per unit
    output than parabolic trough or linear Fresnel alternatives — up to 8 times more
    per MWe at this scale — making land availability and cost a potentially decisive
    constraint for power tower deployment; site selection for power tower plants should
    confirm adequate flat, unencumbered land area early in feasibility, and land cost
    should be explicitly included in LCOE calculations.
