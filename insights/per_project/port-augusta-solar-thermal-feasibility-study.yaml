- record_id: ARENA-DLV-63955
  source_title: Port Augusta Solar Thermal Generation Feasibility Study Options Study
    Report
  publish_date: 2014-07
  project_name: Port Augusta Solar Thermal Generation Feasibility Study
  what_happened: The pre-feasibility study found that all three standalone CSP technologies
    (parabolic trough, power tower, linear Fresnel) produce electricity at LCOEs far
    exceeding the South Australian average wholesale price of ~$72/MWh, ranging from
    $258/MWh (power tower with storage) to $474/MWh (parabolic trough), making standalone
    projects commercially unviable without significant policy support.
  lesson_learnt: At 2013/14 cost levels, standalone utility-scale CSP in Australia
    is not commercially viable without substantial policy support — LCOE estimates
    ranging from $258 to $474/MWh against a ~$72/MWh pool price imply a policy premium
    of $186–$402/MWh; feasibility studies for standalone CSP must explicitly model
    required support mechanisms (e.g. REC revenue, contract for difference) as a primary
    financial input, not an optional overlay.
  issue_severity: major
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: concept/feasibility
  proponent_type: utility/energy retailer
  delay_category: financing/commercial close
  failure_mode: commercial & market
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Alinta identified that LCOE-based offtake agreements and/or technology
    cost reductions or regulation changes would be prerequisites for commercial viability,
    and structured the further study accordingly.
  transferability: moderate
