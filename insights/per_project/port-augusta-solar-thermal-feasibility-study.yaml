- record_id: ARENA-DLV-63951
  source_title: Port Augusta Solar Thermal Generation Feasibility Study Options Study
    Report
  publish_date: 2014-07
  project_name: Port Augusta Solar Thermal Generation Feasibility Study
  what_happened: The pre-feasibility study found that Playford B Power Station was
    not a viable candidate for solar thermal hybridisation due to its poor steam cycle
    efficiency (34.4%), uncertain plant condition, and uncertain remaining operational
    life — requiring 45% greater solar field aperture and 27% higher capital cost
    than the adjacent Northern Power Station for the same gross output.
  lesson_learnt: When evaluating brownfield solar hybrid opportunities, prioritise
    host plants with high steam cycle efficiency, known remaining life, and refurbishment
    certainty; low-efficiency aging plant with uncertain condition will substantially
    inflate solar field and capital costs and introduce unquantifiable life-extension
    risk that undermines project viability.
