- record_id: ARENA-DLV-56308
  source_title: Stanwell Hydrogen Project Feasibility Study
  publish_date: 2020-10
  project_name: Stanwell Hydrogen Demonstration Project
  what_happened: 'An RFQ process engaging nine electrolyser OEMs from Europe and Asia
    revealed a wide cost range for installed and delivered electrolyser capacity:
    PEM electrolysers ranged from A$1,850/kW to A$2,750/kW, while Alkaline electrolysers
    ranged from A$1,100/kW to A$1,950/kW, with thyssenkrupp selected as the reference
    technology.'
  lesson_learnt: Running a competitive RFQ process across multiple OEM technology
    types (PEM and Alkaline) at feasibility stage produces a 40–55% cost range that
    materially affects project economics; proponents should not rely on a single vendor
    quote or desktop estimates for electrolyser capital costs, and should explicitly
    identify the preferred technology type and vendor before committing to financial
    modelling.
