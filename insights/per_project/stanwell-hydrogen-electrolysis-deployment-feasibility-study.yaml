- record_id: ARENA-DLV-56301
  source_title: Stanwell Hydrogen Project Feasibility Study
  publish_date: 2020-10
  project_name: Stanwell Hydrogen Demonstration Project
  what_happened: The feasibility study concluded that the 10 MW demonstration project
    was only modestly commercially viable if it could attract grant funding for a
    material portion (~$25M) of its capital costs. Stanwell's EOI for ARENA's Renewable
    Hydrogen Deployment Funding Round was unsuccessful, meaning the project was deemed
    uncommercial and no further work was recommended on the demonstration project.
  lesson_learnt: At demonstration scale, green hydrogen electrolysis projects are
    unlikely to be commercially viable without substantial grant funding (around 30–60%
    of capital costs); proponents should confirm grant funding availability before
    committing to full feasibility study expenditure and should have a clear fallback
    strategy if grant applications are unsuccessful.
