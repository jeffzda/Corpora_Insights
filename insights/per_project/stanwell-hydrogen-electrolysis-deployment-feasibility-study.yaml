  what_happened: Uncertainty around electrical supply reliability requirements for
    the hydrogen plant created a risk of a complex and costly electrical connection
    configuration. Specifically, whether transmission use of system (TUOS) charges
    would be payable on power supplied to the hydrogen plant via the Stanwell Power
    Station connection remained unresolved during feasibility.
  lesson_learnt: Hydrogen projects connecting to the grid via an existing power station's
    internal electrical infrastructure should resolve TUOS liability with the transmission
    network service provider before finalising connection design and cost estimates
    — unresolved TUOS obligations can materially increase both capital and operating
    costs and undermine project commercial viability.
