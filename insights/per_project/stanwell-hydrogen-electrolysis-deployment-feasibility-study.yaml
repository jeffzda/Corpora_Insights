  what_happened: The project schedule was predicated on receiving confirmed grant
    funding by November 2020 to enable a financial investment decision by late February
    2021. The schedule required revision if funding became available later, and the
    project's ARENA Renewable Hydrogen Deployment Funding Round EOI was ultimately
    unsuccessful, meaning the FID schedule could not be maintained.
