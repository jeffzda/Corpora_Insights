  source_title: Stanwell Hydrogen Project Feasibility Study
  publish_date: 2020-10
  project_name: Stanwell Hydrogen Demonstration Project
  what_happened: Regulatory analysis identified that the hydrogen project would not
    trigger the Petroleum and Gas Act 2004 (as hydrogen does not meet the definition
    of petroleum) and was unlikely to constitute a Major Hazard Facility under the
    Work Health and Safety Act 2011, simplifying the regulatory approval pathway compared
    to initial expectations. Multiple approvals under Queensland and Commonwealth
    legislation were still required but assessed as manageable within 3–6 month timeframes.
  lesson_learnt: Early regulatory scoping for hydrogen electrolysis projects at existing
    industrial sites should confirm inapplicability of petroleum and MHF legislation
    — these are common areas of regulatory uncertainty for hydrogen FOAK projects
    — and establishing a separate Environmental Authority for the hydrogen facility
    (rather than amending the host site EA) can streamline approvals by decoupling
    the two approval processes.
