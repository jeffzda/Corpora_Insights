- record_id: ARENA-DLV-56306
  source_title: Stanwell Hydrogen Project Feasibility Study
  publish_date: 2020-10
  project_name: Stanwell Hydrogen Demonstration Project
  what_happened: The pre-feasibility study assessed three value chain pathways (power-to-ammonia,
    power-to-gas, power-to-power) and eliminated power-to-power due to large energy
    conversion losses, before the feasibility study further eliminated small-scale
    ammonia production (10–25 MW equivalent) as commercially unviable, ultimately
    selecting Case 3 (10 MW producing ~1,600 tpa hydrogen for domestic industrial
    offtake) as the reference project.
  lesson_learnt: Structured options filtering at pre-feasibility stage — assessing
    technical viability, commercial viability and strategic alignment before committing
    to detailed feasibility work — effectively narrows the option space and avoids
    wasted engineering expenditure; power-to-power pathways should be screened early
    given their inherent round-trip efficiency penalties.
