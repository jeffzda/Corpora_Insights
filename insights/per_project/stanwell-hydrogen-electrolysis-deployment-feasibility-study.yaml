- record_id: ARENA-DLV-56305
  source_title: Stanwell Hydrogen Project Feasibility Study
  publish_date: 2020-10
  project_name: Stanwell Hydrogen Demonstration Project
  what_happened: Capital cost estimates for the 10 MW electrolyser project were developed
    only to AACE Class 4 accuracy (±30%), representing approximately 10% completion
    of required engineering. The cost estimate totalled A$74M ($2020 real), with FEED
    and contingency alone accounting for A$21.2M (29% of total capital).
  lesson_learnt: Hydrogen electrolysis projects proceeding toward FID require FEED
    investment to reduce cost estimate uncertainty from ±30% to ±10%; at Class 4 accuracy,
    contingency allowances consume a disproportionate share of capital (around 30%),
    which materially affects financial viability assessments and should be explicitly
    disclosed to funding partners.
