  source_title: Stanwell Hydrogen Project Feasibility Study
  publish_date: 2020-10
  project_name: Stanwell Hydrogen Demonstration Project
  what_happened: Stanwell's financing structure required equity to be deployed first
    (to place long-lead equipment orders and fund site works) before debt could be
    drawn down for installation, integration and commissioning — meaning the project
    carried significant equity at risk before debt financing could be activated, which
    increased the risk profile for Stanwell as the sole initial equity investor.
  lesson_learnt: Hydrogen project financing structures that require equity to fund
    long-lead equipment procurement before debt is activated create a phase-mismatch
    risk for the project sponsor; proponents should negotiate facility arrangements
    that allow debt drawdown to coincide with or precede major equipment orders, or
    secure bridge financing arrangements to reduce the equity-at-risk period.
