- record_id: ARENA-DLV-56303
  source_title: Stanwell Hydrogen Project Feasibility Study
  publish_date: 2020-10
  project_name: Stanwell Hydrogen Demonstration Project
  what_happened: Market engagement revealed significant difficulty in attracting a
    price premium for green hydrogen when hydrogen is a commoditised product produced
    through conventional industrial processes. Offtakers did not differentiate green
    hydrogen at a price premium in the domestic demonstration-scale market.
  lesson_learnt: Green hydrogen projects targeting domestic industrial offtakers should
    anticipate strong resistance to green premiums in commoditised markets; self-consumption
    models or vertically integrated offtake structures are more likely to realise
    a premium than standalone merchant supply arrangements at demonstration scale.
