- record_id: ARENA-DLV-56304
  source_title: Stanwell Hydrogen Project Feasibility Study
  publish_date: 2020-10
  project_name: Stanwell Hydrogen Demonstration Project
  what_happened: Financial modelling showed that under a 100% equity scenario, the
    project's post-tax equity IRR was only 0.44% and NPV was negative $28.5M. Even
    with the optimised funding mix (equity + $25M concessional debt + $25M grant),
    the post-tax equity IRR reached only 3.49% with NPV still negative at $8.5M, indicating
    the project required subsidised financing to approach viability.
  lesson_learnt: First-of-kind hydrogen electrolysis projects at 10 MW scale are unlikely
    to meet commercial return hurdles on a standalone equity basis; project structures
    that blend concessional debt and grant funding are necessary to bring returns
    into an acceptable range, but proponents should test whether even blended structures
    meet shareholder return requirements before committing to FEED.
