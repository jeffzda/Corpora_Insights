  source_title: Stanwell Hydrogen Project Feasibility Study
  publish_date: 2020-10
  project_name: Stanwell Hydrogen Demonstration Project
  what_happened: The feasibility study identified that green hydrogen for domestic
    industrial feedstock supply achieves its strongest commercial case when the offtaker
    uses the green hydrogen as a direct substitute for a higher-emission feedstock
    (e.g. coal gasification-derived hydrogen in ammonia synthesis), yielding an implied
    carbon abatement value of 20.2 kg CO2-e/kg H2 and 32,948 tCO2-e/year abatement
    for the 10 MW plant.
  lesson_learnt: When targeting domestic industrial offtake for green hydrogen, proponents
    should prioritise applications where green hydrogen substitutes for demonstrably
    higher-emission production processes (such as coal gasification), as these applications
    carry the strongest carbon abatement case and are most likely to sustain a green
    premium or justify carbon-based policy support mechanisms.
