  what_happened: Origin's attempt to supply EVs to Defence Housing Australia's fleet
    was blocked because of legal uncertainty around liability for home chargers installed
    at employee residences, preventing a potential major customer from entering the
    program.
  lesson_learnt: Legal liability frameworks for home charger installations at employee
    residences are an unresolved barrier that can block fleet EV contracts entirely
