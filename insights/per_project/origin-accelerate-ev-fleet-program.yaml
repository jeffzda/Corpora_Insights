  source_title: Origin Accelerate EV Fleet Program - Lessons Learnt Report 2
  publish_date: 2025-05
  project_name: Accelerate EV Fleet Program
  what_happened: Despite falling EV purchase prices — particularly from newer Chinese
    brands — leasing costs remained high because leasing providers priced in the risk
    of higher depreciation and difficulty re-leasing returned vehicles, resulting
    in lower forecasted residual values.
  lesson_learnt: High leasing costs driven by residual value uncertainty are a structural
    barrier to fleet EV uptake independent of purchase price reductions. Government
    commitment to purchase second-hand EVs for public fleets could stabilise residual
    values and reduce leasing costs for the broader market.
