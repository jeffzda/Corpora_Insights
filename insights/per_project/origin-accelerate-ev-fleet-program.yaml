- record_id: ARENA-DLV-6159
  source_title: Origin Accelerate EV Fleet Program - Lessons Learnt Report 2
  publish_date: 2025-05
  project_name: Accelerate EV Fleet Program
  what_happened: Home charging was identified as the most convenient and reliable
    charging option for fleet drivers, but renters and apartment/body corporate residents
    were unable to install home chargers due to ownership or strata limitations, creating
    a structural barrier to program participation for a significant cohort of employees.
  lesson_learnt: Fleet EV programs that rely on home charging as the primary charging
    solution will be limited by the proportion of employees able to install home chargers.
    Program design should proactively identify the renter/apartment cohort and develop
    alternative charging solutions or advocate for government frameworks enabling
    home charger installation in rental and multi-dwelling properties.
