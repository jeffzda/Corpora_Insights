- record_id: ARENA-DLV-6151
  source_title: Origin Accelerate EV Fleet Program - Lessons Learnt Report 2
  publish_date: 2025-05
  project_name: Accelerate EV Fleet Program
  what_happened: Fleet electrification decisions were primarily driven by commercial
    cost logic rather than emissions targets. The FBT exemption was a major enabler
    but only applied to vehicles with private use, excluding pool vehicles from its
    benefits and limiting the program's reach.
  lesson_learnt: Policy design must account for the full fleet mix — FBT exemptions
    that exclude pool/business-use-only vehicles leave a significant segment of commercial
    fleets without a viable financial pathway to electrification. Advocate for direct
    subsidies or tax offsets for business-use-only EVs as a complement to FBT policy.
