- record_id: ARENA-DLV-68265
  source_title: Evaluation of ARENA's transport strategic priority
  publish_date: 2024-11
  project_name: Origin Accelerate EV Fleet Program
  what_happened: The Origin Accelerate EV Fleet Program, facilitating uptake of 1,000
    BEVs and 1,000 smart chargers by businesses, found that the future commercialisation
    pathway for BEVs in Australia was unclear even after project completion, with
    the proponent indicating further grant support would likely be required to bridge
    the green premium. The project leverage ratio was approximately 1:1 against an
    expected 1:2–1:3 for commercialisation projects.
  lesson_learnt: BEV fleet commercialisation projects have not yet reached self-sustaining
    economics — the green premium remains a persistent barrier and ARENA-funded proponents
    consistently report that further grant support will be required for the next wave
    of fleet transitions; programs should be designed as part of a multi-round funding
    pathway rather than expecting a single commercialisation project to fully close
    the viability gap.
