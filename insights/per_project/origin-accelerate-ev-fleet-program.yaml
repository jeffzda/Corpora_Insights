- record_id: ARENA-DLV-6157
  source_title: Origin Accelerate EV Fleet Program - Lessons Learnt Report 2
  publish_date: 2025-05
  project_name: Accelerate EV Fleet Program
  what_happened: Fleet electrification transitions were constrained by the natural
    4–5 year expiry cycle of existing vehicle leases. Even when businesses were willing
    to switch to EVs, the prohibitive cost of early lease exit meant transitions were
    slow and staggered across the fleet.
  lesson_learnt: Fleet electrification programs must account for the structural constraint
    of existing ICE lease terms — the 4–5 year expiry cycle will pace transitions
    regardless of willingness to switch. Program timelines and funding horizons should
    be designed around these natural transition windows rather than expecting rapid
    wholesale fleet changeovers.
