- record_id: ARENA-DLV-54313
  source_title: Lochard Energy H2RESTORE Feasibility Study
  publish_date: 2025-11
  project_name: H2RESTORE Project
  what_happened: Water supply assessment initially focused on recycled water from
    the Warrnambool Sewage Treatment Plant via a new water recycling plant and 45
    km pipeline. Later in the study, groundwater extraction from the deep Dilwyn aquifer
    at a consolidated single site was identified as a lower-cost alternative requiring
    no supply pipeline and with adequate water quality and bore deliverability.
  lesson_learnt: Water supply concept selection for large-scale electrolysis projects
    should evaluate deep aquifer options alongside treated wastewater before committing
    to pipeline infrastructure — deep aquifer sourcing can eliminate long supply pipelines
    and reduce project CAPEX, provided salinity and bore deliverability are confirmed
    by early-stage hydrogeological assessment.
