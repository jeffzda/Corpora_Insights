- record_id: ARENA-DLV-54328
  source_title: Lochard Energy H2RESTORE Feasibility Study
  publish_date: 2025-11
  project_name: H2RESTORE Project
  what_happened: System-level modelling by Frontier Economics found that underground
    hydrogen storage is consistently selected by a least-cost energy system optimisation
    model as the only form of hydrogen storage — pressure vessels and liquefied hydrogen
    were not chosen in material quantities — indicating that the full benefits of
    hydrogen storage for electricity and hydrogen markets are only realised through
    underground options.
  lesson_learnt: System-level energy modelling that includes UHS as an option consistently
    selects it as part of the least-cost portfolio — alternative forms of hydrogen
    storage (pressure vessels, liquefied hydrogen) do not replicate the system benefits
    of UHS at scale. Policy and investment frameworks should recognise UHS as a distinct
    infrastructure category rather than treating all hydrogen storage technologies
    as interchangeable.
