- record_id: ARENA-DLV-54311
  source_title: Lochard Energy H2RESTORE Feasibility Study
  publish_date: 2025-11
  project_name: H2RESTORE Project
  what_happened: Techno-economic analysis found that network charges could account
    for up to 45% of total electricity costs for the H2RESTORE project, representing
    a material commercial risk. Waiving or reducing network charges (e.g. via subsidies
    or updated policies) was found to improve project NPV by nearly 1%.
  lesson_learnt: Network charges are a first-order commercial variable for large flexible
    electricity consumers such as electrolysers — projects should model network tariff
    structures as a key sensitivity from feasibility stage and actively engage with
    network businesses and policymakers about flexible load tariff arrangements, which
    can materially improve project economics.
