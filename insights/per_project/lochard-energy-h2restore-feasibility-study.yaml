  intervention_note: The consolidated single-site concept incorporating groundwater
    sourcing was identified as the preferred option, with Southern Rural Water conducting
    groundwater entitlement auctions in November 2025 to further inform availability
    and cost.
  transferability: moderate
  delay_magnitude: null
