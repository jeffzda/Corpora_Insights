  source_title: Lochard Energy H2RESTORE Feasibility Study
  publish_date: 2025-11
  project_name: H2RESTORE Project
  what_happened: Commercial-scale reservoir modelling (WS3) identified that at injection
    rates of ~20 t/day of hydrogen, near-wellbore cooling of 10–20°C would occur in
    the reservoir, potentially affecting geomechanical stresses and reducing the maximum
    allowable injection pressure, as well as influencing the rate of geochemical and
    microbial reactions in complex ways.
  lesson_learnt: Thermal effects of high-rate hydrogen injection at commercial scale
    are materially different from pilot scale and must be explicitly modelled — the
    10–20°C near-wellbore cooling at commercial injection rates could reduce maximum
    allowable injection pressure and affect geochemical/microbial reaction rates.
    Coupled thermo-geomechanical modelling should be included in commercial FEED scope.
