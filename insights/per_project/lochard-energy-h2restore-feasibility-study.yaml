  what_happened: A rigorous, iterative Multi-Criteria Analysis (MCA) process that
    integrated technical, economic, stakeholder, environmental, heritage, and regulatory
    considerations was used to narrow down both field and site options for the H2RESTORE
    Demonstration Pilot. The process was described as critical to ensuring technical
    feasibility was balanced with social licence and regulatory certainty.
  lesson_learnt: Novel energy storage pilots involving community-sensitive infrastructure
    should use a structured Multi-Criteria Analysis (MCA) for site selection that
    explicitly includes stakeholder sentiment, environmental and heritage assessments,
    and regulatory pathway clarity alongside technical and economic criteria — purely
    technical site selection processes risk identifying sites that are technically
    superior but not approvable or socially acceptable.
