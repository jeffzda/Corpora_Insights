- record_id: ARENA-DLV-54314
  source_title: Lochard Energy H2RESTORE Feasibility Study
  publish_date: 2025-11
  project_name: H2RESTORE Project
  what_happened: Water quality testing of recycled water from the Warrnambool Sewage
    Treatment Plant showed high and variable total dissolved solids, necessitating
    a two-stage purification process (initial treatment at a dedicated water recycling
    plant plus final polishing at the hydrogen production facility) to meet electrolyser
    vendor water quality requirements.
  lesson_learnt: Electrolyser demineralised water quality specifications should be
    obtained from vendors at the earliest feasibility stage and matched against the
    actual water source quality — high and variable TDS in treated wastewater sources
    may require a two-stage purification train with significant associated CAPEX and
    OPEX that can be avoided through alternative water source selection.
