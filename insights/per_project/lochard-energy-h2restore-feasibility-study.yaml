  project_name: H2RESTORE Project
  what_happened: The original commercial concept for the H2RESTORE hydrogen pipeline
    between the Hydrogen Production Facility and the Hydrogen Storage Site was designed
    at 180 barg operating pressure. This was found to be technically infeasible due
    to cyclic fatigue from bi-directional injection and withdrawal cycles, requiring
    a revised design at 80 barg MAOP with additional compression at the storage site.
  lesson_learnt: High-pressure (>100 barg) hydrogen pipeline concepts for cyclic bi-directional
    UHS service must be assessed for fatigue failure from pressure cycling at the
    earliest design stage — the H2RESTORE experience shows that 180 barg MAOP was
    infeasible due to cyclic fatigue, and an 80 barg design with additional compression
    at the storage site was required, adding cost and complexity.
