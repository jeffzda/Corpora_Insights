  publish_date: 2025-06
  project_name: H2RESTORE Project
  what_happened: Regulatory uncertainty created by the absence of a clear approval
    pathway for underground hydrogen storage in Victoria risks deterring investment,
    creating inconsistency in the policy landscape, and causing Victoria to fall behind
    other jurisdictions with clearer hydrogen regulatory frameworks. Lochard formally
    documented five categories of risk arising from the Petroleum Act gap — regulatory
    uncertainty, inconsistent policy, missed opportunities, environmental/safety concerns,
    and lack of oversight.
  lesson_learnt: Proponents of first-of-kind underground hydrogen storage projects
    should proactively document and communicate the regulatory gap risks to government
    counterparts — framing the absence of a pathway not only as a project risk but
    as a jurisdictional competitiveness and investment risk increases the urgency
    for regulators to progress legislative reform.
