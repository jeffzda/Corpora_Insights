  evidence_excerpt: The Petroleum Act 1998 does not currently permit for UHS. This
    is a key gap that is currently under consideration by the Victorian Government.
    Lochard is continuing to engage with DEECA on potential reform to enable this
    project. This Regulatory Approval Plan assumes that regulatory reform of the Petroleum
    Act 1998 to include hydrogen will be undertaken by the Victorian Government.
