  project_name: H2RESTORE Project
  what_happened: Early reservoir modelling for the Fenton Creek pilot site estimated
    hydrogen cycling volumes at 80–400 tonnes over three injection-withdrawal cycles,
    representing a significant cost burden for a demonstration project not expected
    to generate economic return.
  lesson_learnt: Pilot hydrogen volumes should be minimised to reduce cost — initial
    static-model estimates of required hydrogen mass can be significantly reduced
    through fine-grid dynamic modelling. Before committing to hydrogen procurement
    contracts for a UHS pilot, project teams should complete fine-grid sector modelling
    to determine the minimum viable injection mass, and should contract for a minimum
    supply quantity with flexibility to increase.
