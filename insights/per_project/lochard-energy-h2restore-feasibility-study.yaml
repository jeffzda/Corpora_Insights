- record_id: ARENA-DLV-54312
  source_title: Lochard Energy H2RESTORE Feasibility Study
  publish_date: 2025-11
  project_name: H2RESTORE Project
  what_happened: System strength compliance was identified as an obligation rather
    than a revenue opportunity for the H2RESTORE project. Large inverter-based loads
    such as electrolysers have a negative impact on system strength, potentially requiring
    a self-remediation scheme (e.g., operating gas turbines as synchronous condensers
    via a clutch arrangement) rather than providing an additional revenue stream.
  lesson_learnt: Projects with large inverter-based loads should budget for system
    strength self-remediation costs from the outset — system strength is a compliance
    obligation, not a revenue stream. Including a clutch between turbine and generator
    to allow synchronous condenser operation is a cost-effective self-remediation
    option that should be evaluated in concept design.
  issue_severity: moderate
  project_type: null
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: The project incorporated a clutch between turbine and generator
    in the concept design, allowing turbines to operate as synchronous condensers
    for system strength self-remediation while potentially providing reactive power
    support.
  transferability: broad
  delay_magnitude: null
  technology_domain: hydrogen
  source_pages: &id029
  - 33
  evidence_excerpt: 'System Strength and Harmonics: Compliance, Not Revenue: System
    strength is a compliance obligation, not a revenue stream. New connections must
    either pay a system strength charge or self-remediate (e.g., by operating turbines
    as synchronous condensers). Harmonic compliance and power quality studies are
    required for large inverter-based loads (electrolysers).'
