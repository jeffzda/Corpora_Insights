  source_title: Lochard Energy H2RESTORE Feasibility Study
  publish_date: 2025-11
  project_name: H2RESTORE Project
  what_happened: Techno-economic modelling found that a smaller 200 MW electrolyser
    operating at a higher utilisation rate (37% load factor) produced better project
    economics than a larger 500 MW electrolyser, because the lower CAPEX improved
    returns more than the additional production volume from the larger unit under
    the available storage capacity and electricity price conditions.
  lesson_learnt: For UHS projects in arbitrage mode, optimising electrolyser utilisation
    rate is more important than maximising electrolyser capacity — a smaller, highly-utilised
    electrolyser yields better IRR than a larger, under-utilised unit where storage
    capacity constrains production cycles. Electrolyser sizing should be co-optimised
    with available storage volume and electricity price profile.
