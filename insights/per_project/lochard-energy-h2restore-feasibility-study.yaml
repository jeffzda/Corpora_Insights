    multi-criteria analysis that integrates technical, commercial, planning, environmental,
    and community factors simultaneously — treating these as a combined optimisation
    rather than a sequential filter reduces the risk of late-stage site rejection
    due to factors (e.g. landowner sentiment, heritage sensitivity) not captured in
    a purely technical evaluation.
