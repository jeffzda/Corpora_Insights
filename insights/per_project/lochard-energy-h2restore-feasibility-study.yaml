- record_id: ARENA-DLV-54326
  source_title: Lochard Energy H2RESTORE Feasibility Study
  publish_date: 2025-11
  project_name: H2RESTORE Project
  what_happened: UHS hydrogen mixing with residual native gas in the depleted reservoir
    means that withdrawn gas is a hydrogen-natural gas blend rather than pure hydrogen.
    For the H2RESTORE electricity generation use case, this is acceptable because
    turbine specifications allow wide fuel composition ranges and no purification
    step is required. However, for Power-to-X applications requiring high-purity hydrogen
    (e.g., ammonia production), depleted gas fields would require an additional purification
    step, adding cost.
  lesson_learnt: UHS in depleted gas fields is best suited to use cases tolerant of
    hydrogen-methane blends on withdrawal (e.g., hydrogen-fuelled power generation)
    — for high-purity applications such as ammonia or other hydrogen carriers, a gas
    purification step must be included in the concept design and cost estimate. Projects
    should confirm end-user purity requirements before committing to UHS in a depleted
    gas field.
