- record_id: ARENA-DLV-54315
  source_title: Lochard Energy H2RESTORE Feasibility Study
  publish_date: 2025-11
  project_name: H2RESTORE Project
  what_happened: Aeroderivative OCGTs were initially selected as the preferred power
    generation technology for H2RESTORE due to fast response time. As the study progressed,
    further analysis of NEM dispatch requirements showed that grid pricing trends
    are predictable hours in advance, making start-up speed less critical than previously
    assumed, and frame turbines — approximately 30% cheaper in CAPEX — were selected
    as the central case for final techno-economic modelling.
  lesson_learnt: For hydrogen-fuelled peaking generation in the NEM, frame OCGTs offer
    materially lower CAPEX than aeroderivatives and should be the central case for
    economic modelling — fast-start capability is less critical than assumed because
    high-price periods are typically predictable well in advance. Technology selection
    for generation should be revisited iteratively as dispatch modelling is refined
    rather than locked in early.
