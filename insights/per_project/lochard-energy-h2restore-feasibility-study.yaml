    threshold) or more than 50 tonnes (Safety Case threshold). For both the Demonstration
    Pilot and the Commercial Facility, the current scope does not include aboveground
    hydrogen storage above these thresholds; however, this must be confirmed with
    WorkSafe Victoria as designs are finalised.
  lesson_learnt: Underground hydrogen storage projects should quantify and explicitly
    document aboveground hydrogen inventory levels in design specifications at an
    early stage — if aboveground storage exceeds 5 tonnes at any point, WorkSafe notification
    and potentially a full Major Hazard Facility Safety Case are triggered, adding
    significant regulatory lead time and cost.
