  what_happened: A Multi-Criteria Analysis (MCA) was used to select the Fenton Creek
    reservoir as the preferred Demonstration Pilot site, evaluating factors including
    total cost, land access and community sentiment, reservoir technical suitability,
    commercial expansion potential, access to electricity grid, proximity to gas pipelines,
