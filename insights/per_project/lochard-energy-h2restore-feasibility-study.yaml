- record_id: ARENA-DLV-54332
  source_title: Lochard Energy H2RESTORE Feasibility Study
  publish_date: 2025-11
  project_name: H2RESTORE Project
  what_happened: The H2RESTORE project's commercial viability was found to require
    a combination of supportive mechanisms beyond electricity market arbitrage revenues,
    including capacity payments similar to Western Australia's WEM, network charge
    waivers, the Australian Government's Hydrogen Production Tax Incentive ($2/kg
    for production 2027–2040), and potentially government CAPEX subsidies of approximately
    25% (~AUD 400 million).
  lesson_learnt: First commercial/FOAK long-duration hydrogen energy storage projects
    are unlikely to be commercially viable on electricity market arbitrage alone —
    project sponsors and policymakers should plan for a package of support mechanisms
    (capacity markets, network tariff relief, production tax incentives, and CAPEX
    co-funding) to bridge the commercial gap, and project economics should be modelled
    with and without each mechanism to identify the minimum required support package.
