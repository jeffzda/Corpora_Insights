  what_happened: Techno-economic modelling found that consolidating the Hydrogen Production
    Facility (HPF) and Hydrogen Storage Site (HSS) at a single location near the reservoir
    could yield over AUD 150 million in CAPEX savings by eliminating the need for
    71 km of hydrogen and water transmission pipelines, despite higher electrical
    system costs at the single site.
  lesson_learnt: For UHS projects where the production facility and storage reservoir
    can be co-located, single-site consolidation should be the default concept — the
    CAPEX saving from eliminating long hydrogen and water pipelines (>AUD 150 million
    in this case) typically outweighs higher on-site electrical costs. Split-site
    concepts should only be progressed where co-location is physically impossible.
