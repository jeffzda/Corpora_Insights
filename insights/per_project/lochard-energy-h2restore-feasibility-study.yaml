  publish_date: 2025-11
  project_name: H2RESTORE Project
  what_happened: Grid connection studies found that connection to the 220 kV Terang-Moorabool
    line would be significantly constrained by thermal ratings and by competing BESS
    projects charging on the same line — H2RESTORE generation would be restricted
    below 250 MW under those conditions. Connection to the 500 kV network was identified
    as the preferred option.
  lesson_learnt: For large flexible loads and generators co-locating with renewables
    and BESS in a congested region, 220 kV connection points can impose binding thermal
    and stability constraints that materially limit project capacity and scalability
    — 500 kV connection should be assessed first for projects above ~200 MW. Competition
    from other projects connecting to the same line must be modelled explicitly.
  issue_severity: major
  project_type: null
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: grid connection/system studies
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Lochard pivoted to the 500 kV network via Mortlake/Tarrone terminal
    stations as the preferred connection basis, with Tarrone selected for cost estimates
    due to competition for capacity at Mortlake; a potential new Mortlake East terminal
    station was also identified for future monitoring.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages: &id027
  - 31
  - 32
  - 33
  evidence_excerpt: This found that planned and operational BESS projects at Terang
    and Gnarwarre would likely compete with H2RESTORE for line capacity in both load
    and generation scenarios, and when these BESS projects are not online, 500 MW
    generation would be restricted by line ratings. A 220kV connection option into
    the Terang-Moorabool line is therefore only considered suitable for a P2X configuration
    that utilises 200 MW or less electrolyser load.
  confidence_note: null
