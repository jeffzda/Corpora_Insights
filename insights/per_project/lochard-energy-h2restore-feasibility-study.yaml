- record_id: ARENA-DLV-54316
  source_title: Lochard Energy H2RESTORE Feasibility Study
  publish_date: 2025-11
  project_name: H2RESTORE Project
  what_happened: Operating gas turbines on 100% hydrogen presents unresolved technical
    challenges, particularly during transient conditions such as startup and shutdown.
    NOx emissions from hydrogen combustion, even with spray intercooling, are likely
    to exceed discharge concentrations typically accepted for gas-powered generation
    facilities unless supplementary exhaust treatment (adding CAPEX) is included.
  lesson_learnt: Hydrogen-fuelled OCGT projects should include allowance for exhaust
    NOx treatment in their cost estimates — OEM development of 100% hydrogen-capable
    turbines is still maturing, and current turbine designs require startup on an
    alternate fuel and produce NOx emissions above standard GPG licence limits without
    supplementary treatment. Technology monitoring agreements with OEMs should be
    established during FEED.
  issue_severity: moderate
  project_type: null
