- record_id: ARENA-DLV-54303
  source_title: Lochard Energy H2RESTORE Feasibility Study
  publish_date: 2025-11
  project_name: H2RESTORE Project
  what_happened: Geomechanical laboratory testing found that hydrogen exposure degraded
    mechanical properties in clay- and iron-rich reservoir units (Waarre A and B),
    while the main Waarre C reservoir unit showed resilience. The degree of degradation
    was correlated with smectite and siderite content, and hydrogen caused rocks to
    shift from water-wet to intermediate-wet, potentially influencing hydrogen trapping
    and migration.
  lesson_learnt: UHS reservoir selection should prioritise units with low smectite
    and siderite content — hydrogen exposure can degrade mechanical properties and
    alter wettability in clay- and iron-rich formations, increasing risk of hydrogen
    migration. Mineralogical characterisation of both reservoir and seal units should
    be completed before committing to injection parameters.
