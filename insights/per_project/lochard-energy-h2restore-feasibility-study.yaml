- record_id: ARENA-DLV-54301
  source_title: Lochard Energy H2RESTORE Feasibility Study
  publish_date: 2025-11
  project_name: H2RESTORE Project
  what_happened: Microbial sampling from Otway Basin depleted gas reservoirs failed
    to yield representative subsurface communities. Laboratory experiments showed
    the microbial community was dominated by surface-environment taxa rather than
    the native high-temperature, anoxic reservoir taxa, indicating contamination during
    sampling.
  lesson_learnt: Obtaining contamination-free, representative subsurface microbial
    samples is extremely difficult — even brief deviations from in-situ pressure,
    temperature, and redox conditions dramatically alter microbial composition. Future
    UHS projects must invest in purpose-built sampling protocols (maintaining pressure
    and temperature, minimising contamination) and should not rely on standard surface-sampling
    methods for subsurface microbial risk assessment.
