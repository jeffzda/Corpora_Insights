- record_id: ARENA-DLV-54321
  source_title: Lochard Energy H2RESTORE Feasibility Study
  publish_date: 2025-11
  project_name: H2RESTORE Project
  what_happened: Long-term electricity spot price forecasts obtained from two separate
    providers over two years showed substantial differences, particularly in the number
    of zero or low-price hours and the distribution of high-price periods. This uncertainty
    was identified as a significant commercial challenge — the project's IRR is highly
    sensitive to the frequency and magnitude of electricity price swings.
  lesson_learnt: For electricity arbitrage-based hydrogen storage projects, electricity
    price forecast uncertainty is the dominant commercial risk and must be treated
    as a key sensitivity with multiple scenarios rather than a single base case. Projects
    should obtain forecasts from multiple providers and stress-test economics against
    pessimistic as well as optimistic price distributions before seeking investment
    approval.
