- record_id: ARENA-DLV-38452
  source_title: Lochard Energy - H2Restore - Stakeholder Engagement Plan & Regulatory
    Approvals Plan
  publish_date: 2025-06
  project_name: H2RESTORE Project
  what_happened: The Victorian Planning Scheme's interim guidelines for hydrogen facilities
    (published November 2023) have not been formally adopted into the planning scheme,
    and no prescriptive conditions exist for hydrogen land uses. Underground hydrogen
    storage has no explicit land use definition — it is classified as undefined within
    the Corangamite Planning Scheme, creating inconsistency risk across different
    local planning schemes.
  lesson_learnt: Hydrogen project proponents in Victoria cannot rely on a single,
    uniform planning pathway — each project component (production, storage, generation,
    pipeline) carries a different land use term and assessment criteria. Engage the
    responsible authority and the Department of Transport and Planning in pre-submission
    meetings early to resolve definitional ambiguity before lodging any planning permit
    application.
  issue_severity: major
  project_type: null
