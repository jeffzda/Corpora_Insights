  source_title: Lochard Energy H2RESTORE Feasibility Study
  publish_date: 2025-11
  project_name: H2RESTORE Project
  what_happened: Electrolyser CAPEX was identified as the largest single contributor
    to levelised cost of hydrogen (LCOH) and levelised cost of electricity (LCOE)
    in the H2RESTORE techno-economic model. A 20% reduction in electrolyser CAPEX
    yielded only a 0.6% improvement in project IRR, while electricity price conditions
    had a far greater influence on project returns.
  lesson_learnt: Electrolyser CAPEX dominates LCOH but has modest impact on project
    IRR compared to electricity market variables — project teams should pursue electrolyser
    cost reduction through vendor competition and scale, but not over-invest analytical
    effort in electrolyser optimisation at the expense of electricity price and network
    charge analysis, which are the dominant value drivers.
