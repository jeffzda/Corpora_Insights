  project_name: H2RESTORE Project
  what_happened: Electrolyser technology selection assessed PEM, AWE and emerging
    AEM technologies. PEM was selected as the base case for economic modelling due
    to fast response time and commercial readiness, but analysis showed that performance,
    cost and vendor support varied more between individual vendors than between technology
    types.
  lesson_learnt: For large-scale hydrogen projects, technology selection between PEM
    and AWE should not be finalised early — vendor-specific factors (cost, performance,
    support, standardisation of design) vary more than technology-type differences.
    Procurement processes should engage multiple vendors across both technology types
    to capture the best commercial outcome.
