  what_happened: Ground-disturbing construction activities for both the Demonstration
    Pilot and the Commercial Facility will occur in areas of Cultural Heritage Sensitivity,
    requiring approved Cultural Heritage Management Plans (CHMPs) under the Aboriginal
    Heritage Act 2006 (Vic). The Eastern Maar Aboriginal Corporation (EMAC) is the
    Registered Aboriginal Party for the area, and other RAPs may apply along pipeline
    and transmission corridors.
  lesson_learnt: For projects involving drilling, pipeline installation, or HV line
    construction in Victoria's southwest, Cultural Heritage Management Plan preparation
    and approval by the relevant Registered Aboriginal Party (EMAC and potentially
    others) must be sequenced as a parallel workstream to design — waiting until after
    site selection to begin CHMP due diligence risks delaying construction mobilisation.
