- record_id: ARENA-DLV-54305
  source_title: Lochard Energy H2RESTORE Feasibility Study
  publish_date: 2025-11
  project_name: H2RESTORE Project
  what_happened: Reservoir simulation showed that for small pilot-scale hydrogen injection
    volumes (below ~30 t nominal), hydrogen recovery was non-monotonic and highly
    sensitive to local reservoir structure and dispersion — at the smallest injection
    masses, recovery could be zero because the injected plume was too small to prevent
    early water breakthrough.
  lesson_learnt: 'For a UHS pilot targeting small injection volumes, well placement
    and perforation length are critical design decisions: shorter perforations delay
    water breakthrough and maximise recovery. Pilot designs should not target injection
    masses smaller than what modelling shows is needed to reliably prevent zero recovery,
    and structural topography and well placement uncertainty must be explicitly characterised
    before drilling.'
