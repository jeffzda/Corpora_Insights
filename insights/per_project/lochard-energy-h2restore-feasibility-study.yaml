- record_id: ARENA-DLV-54317
  source_title: Lochard Energy H2RESTORE Feasibility Study
  publish_date: 2025-11
  project_name: H2RESTORE Project
  what_happened: For the Demonstration Pilot, on-site electrolysis was assessed as
    an alternative to trucking hydrogen to site. Analysis found that on-site electrolysis
    only becomes cost-competitive with trucking when the required hydrogen injection
    volume exceeds approximately 900 tonnes — well above the pilot requirement of
    30–44 tonnes, making trucking the lowest-cost sourcing option.
  lesson_learnt: For small-scale UHS demonstration pilots, hydrogen trucking (tube
    trailer delivery) is almost always lower cost than on-site electrolysis — the
    crossover point where electrolysis becomes economic is approximately 900 tonnes
    of injection, far above typical pilot volumes. Pilot designs should default to
    trucking and avoid the CAPEX and regulatory complexity of on-site electrolysis
    unless injection volumes exceed this threshold.
