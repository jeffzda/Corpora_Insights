  what_happened: The Demonstration Pilot's preferred reservoir (Fenton Creek) is expected
    to contain remaining native gas (estimated 200–300 MMcf) that subsurface studies
    indicate should be produced prior to hydrogen injection. A short gathering line
    to the adjacent HUGS MFCT wellsite (currently in construction) is one proposed
    means of removing this gas, which would require an exemption under the Petroleum
    Act from the Pipelines Act for a short intra-PPL gathering line.
  lesson_learnt: Underground hydrogen storage pilots using depleted gas reservoirs
    should conduct early subsurface characterisation to quantify residual native gas
    volumes and assess remediation options — the need to produce residual gas before
    hydrogen injection adds a pre-injection workstream (and potentially a gathering
    line) that must be factored into the pilot schedule and regulatory plan.
