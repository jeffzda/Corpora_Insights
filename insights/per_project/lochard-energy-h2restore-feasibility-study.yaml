- record_id: ARENA-DLV-54302
  source_title: Lochard Energy H2RESTORE Feasibility Study
  publish_date: 2025-11
  project_name: H2RESTORE Project
  what_happened: Geochemical and cement testing found low risk of adverse hydrogen-induced
    reactions with Otway Basin reservoir rocks and wellbore cement. Quartz remained
    stable, pyrite showed negligible alteration, and unaltered cement was unaffected
    by hydrogen exposure; deteriorated cement showed some susceptibility to pore-structure
    changes driven by water movement facilitated by hydrogen.
  lesson_learnt: Geochemical risk screening for UHS in depleted sandstone gas fields
    should specifically test deteriorated as well as intact wellbore cement, since
    deteriorated cement is more susceptible to hydrogen-facilitated water movement.
    Where legacy wells exist, cement condition assessment is a priority before committing
    to UHS injection.
