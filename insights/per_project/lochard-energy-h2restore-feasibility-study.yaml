- record_id: ARENA-DLV-38451
  source_title: Lochard Energy - H2Restore - Stakeholder Engagement Plan & Regulatory
    Approvals Plan
  publish_date: 2025-06
  project_name: H2RESTORE Project
  what_happened: The Victorian Petroleum Act 1998 does not currently permit underground
    hydrogen storage (UHS) — hydrogen is not a hydrocarbon and falls outside the Act's
    definition of petroleum. Lochard Energy identified this as a fundamental regulatory
    gap blocking both the Demonstration Pilot and Commercial Facility, requiring legislative
    amendment before either project phase can proceed.
  lesson_learnt: Before committing to an underground hydrogen storage project in Victoria,
    proponents must confirm that enabling legislation exists or is on a firm amendment
    pathway — the absence of a legal approval pathway under the Petroleum Act 1998
    creates project-stopping regulatory uncertainty that cannot be resolved through
    normal permitting engagement alone.
  issue_severity: critical
  project_type: null
  project_scale_band: demonstration
  lifecycle_phase: approvals/contracting
  proponent_type: utility/energy retailer
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: null
  intervention_note: Lochard engaged directly with DEECA/Resources Victoria and provided
    a formal report on options for regulating UHS under the Petroleum Act; Victorian
    Government amendments are understood to be in progress.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages: &id001
  - 7
