  source_title: Lochard Energy H2RESTORE Feasibility Study
  publish_date: 2025-11
  project_name: H2RESTORE Project
  what_happened: Screening methodology established that for pilot-scale UHS, small
    and steeply-dipping reservoir structures are preferred to minimise hydrogen inventory,
    while for commercial-scale UHS, large and shallow-dipping structures with aquifer
    pressure support are preferred to maximise working storage volume and deliverability.
  lesson_learnt: 'UHS site selection criteria are scale-dependent: pilot-scale projects
    should prioritise steeply-dipping structures (minimising required hydrogen inventory
    and cost), while commercial-scale projects should prioritise large, shallow-dipping
    structures with aquifer pressure support (maximising working storage volume and
    withdrawal deliverability). Applying commercial-scale selection criteria to pilot
    site selection will result in unnecessarily large and expensive pilots.'
