- record_id: ARENA-DLV-15824
  source_title: Evaluation of ARENA's Impact and Effectiveness
  publish_date: 2019-11
  project_name: Coober Pedy Renewable Diesel Hybrid Project
  what_happened: The Coober Pedy hybrid project (4MW wind, 1MW solar, 500kWh battery with diesel backup) displaced up to 70 per cent of diesel generation, avoided approximately 6,000 tonnes of CO2e per
    annum, and in August 2019 achieved the longest continuous period of 100 per cent renewable operation at 93 hours. The project set a global benchmark for renewables in MW-scale isolated grids.
  lesson_learnt: Hybrid renewable-diesel systems in isolated grids can achieve very high renewable penetration (up to 70% displacement) without grid stability risks when properly designed with battery buffering
    — this architecture is directly replicable for mines and remote communities currently dependent on diesel generation.
