  what_happened: The study identified that regulatory frameworks governing reuse of
    anaerobic digestion by-products — including biofertiliser from digestate and high-quality
    recycled water — represent a deployment barrier that must be resolved before full
    commercialisation of integrated BRRF facilities at red meat processors.
  lesson_learnt: Before committing capital to an integrated bio-resource recovery
    facility, project proponents should conduct detailed regulatory analysis in collaboration
    with relevant regulators to confirm pathways for by-product classification, recycled
    water reuse approvals, and biofertiliser market access — regulatory gaps in these
    areas can block revenue streams that underpin project economics.
  issue_severity: moderate
  project_type: industrial decarbonisation
