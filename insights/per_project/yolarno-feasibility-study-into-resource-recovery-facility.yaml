- record_id: ARENA-DLV-55511
  source_title: Yolarno - Feasibility Study into Resource Recovery Facility - Lessons
    Learnt Report 1
  publish_date: 2024-06
  project_name: Feasibility Study of a Resource Recovery Facility (Bindaree Food Group)
  what_happened: The cost estimate for the resource recovery facility was developed
    using a quoting process in which concept design drawings and equipment lists were
    shared with up to three vendors per equipment item, alongside a cost escalation
    factor for the anticipated construction date — an approach that produced estimates
    within Class 4 accuracy.
  lesson_learnt: For industrial bioenergy feasibility cost estimates, obtain quotes
    from at least three vendors per major equipment item using concept design drawings
    and equipment lists, and apply an escalation factor for the forecast construction
    date — this multi-vendor approach improves estimate accuracy and is achievable
    within a feasibility study budget.
