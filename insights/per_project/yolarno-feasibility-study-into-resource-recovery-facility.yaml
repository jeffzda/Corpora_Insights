  publish_date: 2024-06
  project_name: Feasibility Study of a Resource Recovery Facility (Bindaree Food Group)
  what_happened: The carbon credits component of the economic analysis was conducted
    using Australian National Greenhouse Accounts Factors 2023, but further analysis
    of emissions trading scheme (ETS) regulations was not incorporated, leaving a
    gap in the valuation of carbon credit benefits.
  lesson_learnt: For industrial decarbonisation feasibility studies that include carbon
    credits as a revenue stream, supplement greenhouse gas accounting with an in-depth
    review of applicable emissions trading scheme (ETS) regulations — relying solely
    on national accounting factors may understate or misrepresent the actual carbon
    credit value achievable under market mechanisms.
