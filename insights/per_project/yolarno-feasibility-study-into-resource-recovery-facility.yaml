- record_id: ARENA-DLV-35651
  source_title: Yolarno Feasibility Study into Resource Recovery Facility - Study
    Report
  publish_date: 2024-10
  project_name: Yolarno / Bindaree Food Group Integrated Bio-Resource Recovery Facility
    (BRRF)
  what_happened: A FEED-level feasibility study found that full implementation of
    an Integrated Bio-resource Recovery Facility (BRRF) — combining wastewater treatment,
    anaerobic digestion, CO2 recovery, and biofertiliser production — at the NSW red
    meat processing facility yields an NPV of AU$225.3 million over 25 years, a 492%
    ROI, and a 7-year payback period, making it the most economically attractive of
    seven scenarios modelled.
  lesson_learnt: For industrial facilities with organic waste streams, co-locating
    multiple resource recovery components (biogas, CO2 recovery, biofertiliser, water
    recycling) in a single integrated facility substantially outperforms partial implementations
    — the full BRRF delivers payback 4 years faster than WWTP-only staging and nearly
    doubles NPV compared to biogas-only scenarios.
