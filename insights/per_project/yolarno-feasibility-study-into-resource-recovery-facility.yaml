- record_id: ARENA-DLV-35656
  source_title: Yolarno Feasibility Study into Resource Recovery Facility - Study
    Report
  publish_date: 2024-10
  project_name: Yolarno / Bindaree Food Group Integrated Bio-Resource Recovery Facility
    (BRRF)
  what_happened: The feasibility study found that digestate disposal — if not processed
    into biofertiliser — would incur additional ongoing costs and regulatory challenges,
    whereas converting digestate to pelletised biofertiliser eliminates disposal costs
    and creates a revenue stream estimated to contribute to overall BRRF profitability.
  lesson_learnt: Biogas project developers should include digestate processing to
    biofertiliser in the initial project scope — treating digestate as a waste requiring
    disposal increases costs and regulatory burden, whereas dewatering, drying, and
    pelletising to biofertiliser produces a saleable product and is more economical
    than waste management at this scale.
  issue_severity: minor
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: concept/feasibility
  proponent_type: industrial operator
  delay_category: null
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Study recommended mechanical dewatering to ~22% TS, thermal drying
    and pelletising of digestate into bio-based fertiliser pellets for third-party
    offtake, producing approximately 5,656 t/year.
  transferability: moderate
  delay_magnitude: null
  technology_domain: bioenergy
  source_pages: &id006
