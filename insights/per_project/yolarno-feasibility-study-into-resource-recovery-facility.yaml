  publish_date: 2024-10
  project_name: Yolarno / Bindaree Food Group Integrated Bio-Resource Recovery Facility
    (BRRF)
  what_happened: The facility experienced unreliable external supply of food-grade
    CO2 for dry ice production, with documented supply shortages from Australia's
    limited number of CO2 producers and significant price surges in recent years,
    causing production disruptions at the NSW red meat processing facility.
  lesson_learnt: Red meat processors reliant on externally procured dry ice should
    treat CO2 supply chain vulnerability as a material operational risk — Australia's
    limited CO2 producer base creates concentration risk; on-site CO2 recovery integrated
    with a biogas facility directly eliminates this exposure and reduces Scope 3 emissions
    from CO2 transport.
