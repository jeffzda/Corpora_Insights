  what_happened: The study found that carbon credit revenue under the ACCU scheme
    at AU$32/tonne contributes meaningfully to BRRF economics, with the full BRRF
    (Scenario 1) generating 10,964 tonnes CO2-e/year in credits worth approximately
    AU$350,833/year, while the CO2 recovery plant itself was found to be a net emitter
    in some configurations.
  lesson_learnt: Carbon credit revenue should be included in biogas project economic
    models but assessed carefully at component level — the CO2 recovery plant can
    be a net emitter (negative carbon balance) in some configurations, potentially
    reducing total ACCU revenue; detailed boundary-level carbon accounting is needed
    rather than a project-level estimate alone.
