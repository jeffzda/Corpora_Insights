  what_happened: The market research conducted for biofertiliser pricing during the
    feasibility study was found to be insufficient in depth to produce an accurate
    cost estimate for pelletised biofertiliser in Australia, and only broad market
    research was possible within the study's scope.
  lesson_learnt: Feasibility studies for novel bioproducts such as pelletised biofertiliser
    from red meat processing waste should include a more rigorous market survey —
    and a sensitivity analysis on revenues from streams subject to high market uncertainty
    or volatility — before proceeding to investment decision-making.
