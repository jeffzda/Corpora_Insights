  what_happened: The study noted that the economic modelling used assumed execution
    dates (2026 for Stage 1, 2031 for Stage 2) for financial modelling purposes, but
    explicitly stated that the NSW case study facility currently has no plans committed
    to delivering the project on these dates, indicating the investment decision had
    not been made at the time of the study.
  lesson_learnt: FEED-stage economic models for industrial decarbonisation projects
    should clearly distinguish between financial modelling assumptions and committed
    project timelines — using execution dates as modelling inputs without a committed
    FID can create false expectations among funders and partners; the document should
    explicitly flag this distinction as this study does.
