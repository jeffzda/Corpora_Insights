- record_id: ARENA-DLV-55509
  source_title: Yolarno - Feasibility Study into Resource Recovery Facility - Lessons
    Learnt Report 1
  publish_date: 2024-06
  project_name: Feasibility Study of a Resource Recovery Facility (Bindaree Food Group)
  what_happened: The economic analysis used conservative estimates for all revenue
    streams — pricing recovered resources at current procurement cost and biofertiliser
    at half the minimum market price — to ensure positive NPV and ROI results were
    robust even under pessimistic assumptions.
  lesson_learnt: In Class 4 feasibility estimates (±30% accuracy per AACE), apply
    conservative revenue assumptions — price recovered outputs at current procurement
    cost rather than optimistic market rates, and use the lower bound of market surveys
    for novel products like biofertiliser — to confirm viability before committing
    to more detailed and costly engineering.
