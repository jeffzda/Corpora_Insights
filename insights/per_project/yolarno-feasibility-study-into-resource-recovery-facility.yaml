  publish_date: 2024-10
  project_name: Yolarno / Bindaree Food Group Integrated Bio-Resource Recovery Facility
    (BRRF)
  what_happened: The feasibility study found that CO2 recovery for on-site dry ice
    production is the single component most responsible for shortening overall payback
    period. Removing CO2 recovery from the full BRRF (Scenario 2 vs Scenario 1) reduced
    NPV from AU$225.3 million to AU$76.8 million and extended payback from 7 to 11
    years.
  lesson_learnt: For red meat processors reliant on externally supplied dry ice, including
    on-site food-grade CO2 recovery within a biogas facility significantly improves
    investment returns — project developers should treat CO2 recovery as a core component
    rather than an optional add-on, particularly given Australia's documented dry
    ice supply shortages and price volatility.
