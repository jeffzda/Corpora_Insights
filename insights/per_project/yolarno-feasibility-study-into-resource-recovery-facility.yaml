- record_id: ARENA-DLV-35654
  source_title: Yolarno Feasibility Study into Resource Recovery Facility - Study
    Report
  publish_date: 2024-10
  project_name: Yolarno / Bindaree Food Group Integrated Bio-Resource Recovery Facility
    (BRRF)
  what_happened: The study identified that mono-digestion of red meat processor bio-resources
    carries a technical risk of process inhibition due to accumulation of ammonia
    and long-chain fatty acids, requiring co-digestion with carbon-rich substrates
    to optimise the carbon-to-nitrogen ratio and maintain process stability.
  lesson_learnt: Red meat processor biogas projects should plan for co-digestion with
    carbon-rich agricultural substrates (e.g. grain residues, spent brewery by-products)
    from the outset — mono-digestion of high-nitrogen meat processing waste risks
    inhibition and reduced methane yields; this should be addressed in detailed design
    and confirmed through BMP testing before committing capital.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: industrial operator
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The study recommended ongoing BMP tests and participation in
    RACE for 2030 anaerobic co-digestion pilot trials with Griffith University and
    AMPC to refine co-digestion ratios before full-scale implementation.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: bioenergy
  source_pages: &id004
  - 14
  - 29
  evidence_excerpt: Mono-digestion of red meat processor bio-resources can be challenging
    due to accumulation of intermediate products such as ammonia and/or long-chain
    fatty acids, leading to potential process inhibition. Studies have demonstrated
    that co-digesting red meat industry by-products with carbon-rich substrates can
    optimise the carbon-to-nitrogen ratio, enhancing process stability and boosting
    methane yields.
