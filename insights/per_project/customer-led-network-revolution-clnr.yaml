  evidence_excerpt: The project is on target to deliver the learning outcomes as specified
    at the start of the project but these will be delivered one year later than planned
    (at end 2014). The impact on the completion of the project was due to a number
    of externalities impacting the project. These externalities ranged from a slower
    uptake of low carbon technologies than indicated in the DECC forecasts to a major
    equipment supplier filing for bankruptcy protection and being taken over.
