- record_id: ARENA-DLV-72231
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: '2014'
  project_name: Customer-Led Network Revolution (CLNR)
  what_happened: The CLNR project at Northern Powergrid (AUD 55M, 550 customers) was
    delayed by one year beyond its original schedule due to a slower-than-forecast
    uptake of low carbon technologies and a major equipment supplier filing for bankruptcy
    and being taken over mid-project.
  lesson_learnt: When procuring equipment for multi-year grid trials, assess supplier
    financial stability and do not rely on external demand forecasts (e.g. government
    LCT uptake projections) for trial design — both optimistic technology uptake assumptions
    and supplier insolvency risk can derail project timelines.
  issue_severity: moderate
