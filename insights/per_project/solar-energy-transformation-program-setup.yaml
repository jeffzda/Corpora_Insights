  publish_date: '2019-06-25'
  project_name: Solar Energy Transformation Program (SETuP)
  what_happened: SETuP found that prefabricated portable solar PV reduced construction
    time and lowered both capital and operational costs compared to conventional on-site
    construction approaches at remote sites.
  lesson_learnt: Specify prefabricated, portable solar PV modules for remote off-grid
    installations — they have been demonstrated to reduce construction time and total
    project cost while improving deployment flexibility, which are all critical factors
    for remote renewable energy projects.
