  publish_date: '2019-06-25'
  project_name: Solar Energy Transformation Program (SETuP)
  what_happened: The SETuP program in remote Northern Territory communities experienced
    long lead times for obtaining land leases, which complicated project scheduling.
  lesson_learnt: For remote off-grid renewable projects on community or Aboriginal
    land, initiate land lease negotiations well ahead of other project activities
    — long lead times for land access can hold up the entire project schedule if not
    treated as a critical path item.
