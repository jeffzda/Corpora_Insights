- record_id: ARENA-DLV-1311
  source_title: ARENA Insights Forum Presentation Summaries & Key Points – Large-Scale
    Projects Stream
  publish_date: '2019-06-25'
  project_name: Solar Energy Transformation Program (SETuP)
  what_happened: Community engagement and local employment were identified as critical
    to securing social licence for SETuP remote community projects; without this,
    projects risked opposition or community disengagement.
  lesson_learnt: Embed local engagement and employment of community members into the
    project delivery model for remote off-grid renewable projects — this is integral
    to gaining and maintaining social licence, not an optional add-on.
