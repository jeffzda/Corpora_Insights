- record_id: ARENA-DLV-1310
  source_title: ARENA Insights Forum Presentation Summaries & Key Points – Large-Scale
    Projects Stream
  publish_date: '2019-06-25'
  project_name: Solar Energy Transformation Program (SETuP)
  what_happened: Remote off-grid sites on the SETuP program were vulnerable to extended
    outages if equipment failed, as single points of failure without redundancy could
    leave communities without power for prolonged periods.
  lesson_learnt: Design remote off-grid systems to minimise single points of failure
    and maintain adequate spare parts inventories on site — in remote locations where
    technician response times are long, redundancy and on-site spares are the primary
    defence against extended supply interruptions.
  issue_severity: moderate
  project_type: storage
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: project developer
  delay_category: null
  failure_mode: execution & logistics
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: PWC adopted a practice of keeping multiple spare parts on site
    to reduce response time for equipment failures.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id004
  - 4
  evidence_excerpt: The importance of minimising single points of failure for remote
    sites, including having multiple spare parts on site.
