  what_happened: During CFR engine testing, hydrogen's high flame speeds at near-stoichiometric
    conditions produced high rates of pressure rise that were mistakenly identified
    as autoignition by the standard detonation pickup sensor, leading to an unrealistically
    low octane value being assigned to hydrogen.
