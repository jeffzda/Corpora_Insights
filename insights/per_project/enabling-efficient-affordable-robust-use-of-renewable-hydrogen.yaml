  what_happened: In the second-generation DISI hydrogen engine, space constraints
    in the engine head required use of a small M8 spark plug, whose short ceramic
    insulation combined with high in-cylinder pressures made the ignition system prone
    to arcing outside the combustion chamber, causing engine misfires.
  lesson_learnt: When retrofitting hydrogen fuel systems into existing engine heads
    with space constraints, ignition system design must account for elevated in-cylinder
    pressures — small spark plugs with short ceramic insulation are prone to external
    arcing; reduce spark gap, apply dielectric grease, and pressurise the plug back
    to increase electrical resistance.
