  what_happened: High-pressure hydrogen injectors capable of handling injection pressures
    exceeding 200 bar were not commercially available, preventing the CVCC programme
    from sourcing off-the-shelf components for hydrogen fuel-jet and flame experiments.
  lesson_learnt: When designing hydrogen engine test rigs requiring injection pressures
    above 200 bar, do not assume commercial injector availability — plan for custom
    modification of commercial injectors from the outset, including additional lead
    time and engineering resource.
