- record_id: ARENA-DLV-35852
  source_title: Enabling Efficient, Affordable and Robust Use of Renewable Hydrogen
    in Transport and Power Generation
  publish_date: '2020'
  project_name: Enabling Efficient, Affordable & Robust Use of Renewable Hydrogen
  what_happened: Quantitative analysis of water produced by hydrogen oxidation in
    the PFR programme was technically challenging because producing a calibration
    curve for known water vapour concentrations was complicated by the risk of water
    condensation in the sample line.
  lesson_learnt: When measuring water vapour from hydrogen oxidation experiments,
    anticipate condensation risks in sample lines and plan a dedicated calibration
    approach — use refrigeration and controlled water bath bubbling to reliably generate
    known vapour concentrations for calibration.
  issue_severity: minor
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: data & measurement
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Used a refrigeration unit to bubble air through a water bath
    to generate a calibration curve for water quantification, successfully resolving
    the measurement challenge.
  transferability: narrow
  delay_magnitude: null
  technology_domain: hydrogen
  source_pages: &id002
  - 5
  evidence_excerpt: Producing a calibrating curve with a range of known water vapor
    concentrations was not straightforward, particularly considering the potential
    water condensation in the sample line... We then used a refrigeration unit and
    bubbled air through a bottle of water immersed in a water bath cooled by the unit.
    A calibration curve for water quantification was thus obtained.
