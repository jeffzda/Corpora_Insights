  project_name: Enabling Efficient, Affordable and Robust Use of Renewable Hydrogen
    in Transport and Power Generation
  what_happened: Techno-economic modelling of coupled electricity, transport and heating/industry
    sectors found that marginal abatement costs beyond approximately 90% reduction
    always exceeded 100 $/tCO2e and that land use could increase dramatically, indicating
    residual emissions are very costly to eliminate.
  lesson_learnt: Energy system transition plans targeting net-zero should account
    for sharply rising marginal abatement costs beyond ~90% emissions reduction; negative
    emission technologies are likely necessary and should be included in long-run
    transition modelling alongside renewable deployment and CCS.
