- record_id: ARENA-DLV-35856
  source_title: Enabling Efficient, Affordable and Robust Use of Renewable Hydrogen
    in Transport and Power Generation
  publish_date: '2020'
  project_name: Enabling Efficient, Affordable & Robust Use of Renewable Hydrogen
  what_happened: The first-generation spark-ignition hydrogen engine experienced significant
    engine knock under hydrogen-fuelled operation due to the high compression ratio
    of the base diesel engine, limiting attainable peak thermal efficiency below the
    45% project target.
  lesson_learnt: When converting a high-compression-ratio diesel engine base to hydrogen
    spark ignition, engine knock is a significant constraint — design modifications
    to lower effective compression ratio should be incorporated from the first-generation
    prototype, not deferred to subsequent iterations, to avoid efficiency ceilings
    driven by knock limits.
