  what_happened: In the SI engine programme, space constraints in the engine head
    made it impossible to fabricate the integrated direct-injection and ignition system
    using conventional machining, requiring a switch to 3D metal printing technology.
  lesson_learnt: When integrating novel hydrogen injection and ignition systems into
    existing engine heads, assess fabrication constraints early — complex fuel passage
    geometries may be incompatible with conventional machining and will require additive
    manufacturing, which should be planned and budgeted from the outset.
