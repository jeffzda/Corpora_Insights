- record_id: ARENA-DLV-35857
  source_title: Enabling Efficient, Affordable and Robust Use of Renewable Hydrogen
    in Transport and Power Generation
  publish_date: '2020'
  project_name: Enabling Efficient, Affordable & Robust Use of Renewable Hydrogen
  what_happened: In the CI engine programme, the high compression ratio of the base
    engine limited hydrogen substitution rate due to pre-ignition, constraining the
    programme's ability to achieve higher energy substitution rates in the first-generation
    configuration.
  lesson_learnt: Pre-ignition driven by high compression ratios is a key constraint
    in hydrogen-diesel dual direct injection engines — injector configuration, nozzle
    flow rate, and injection timing must be tailored to avoid pre-ignition when designing
    CI hydrogen engine prototypes, and this should be prioritised at the first-generation
    stage.
