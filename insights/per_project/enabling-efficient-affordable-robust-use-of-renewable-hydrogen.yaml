- record_id: ARENA-DLV-35858
  source_title: Enabling Efficient, Affordable and Robust Use of Renewable Hydrogen
    in Transport and Power Generation
  publish_date: '2020'
  project_name: Enabling Efficient, Affordable & Robust Use of Renewable Hydrogen
  what_happened: The CI engine programme encountered high NOx emissions as a major
    challenge during hydrogen-fuelled operation, representing a significant barrier
    to the viability of hydrogen compression-ignition engines.
