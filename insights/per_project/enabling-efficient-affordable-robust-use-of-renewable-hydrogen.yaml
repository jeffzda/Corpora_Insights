- record_id: ARENA-DLV-35851
  source_title: Enabling Efficient, Affordable and Robust Use of Renewable Hydrogen
    in Transport and Power Generation
  publish_date: '2020'
  project_name: Enabling Efficient, Affordable & Robust Use of Renewable Hydrogen
  what_happened: Developing a turbulent flow reactor for high-pressure and high-temperature
    hydrogen autoignition experiments proved challenging. The initial plan to use
    nitrogen as a dilution gas had to be abandoned due to limited supply capacity
    and high operational cost, requiring a switch to air as the dilution medium.
  lesson_learnt: When designing experimental infrastructure for high-pressure hydrogen
    combustion research, validate dilution gas supply capacity and cost before locking
    in experimental design — late-stage substitution of nitrogen with air requires
    recalibration of kinetic simulations to account for excess oxygen effects.
  issue_severity: minor
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Switched from nitrogen to air as the dilution gas and accounted
    for the excess oxygen impact on reaction rates through kinetic simulation, successfully
    capturing its effects within existing models.
  transferability: narrow
  delay_magnitude: null
  technology_domain: hydrogen
  source_pages: &id001
  - 5
  evidence_excerpt: The initial idea of using nitrogen as the dilution gas to control
    the reaction rates was replaced by using air due to the limited supply capacity
    and high operational cost. The impact of the excess oxygen on reaction rates was
    counted in kinetic simulation and overall was well-captured by existing models.
