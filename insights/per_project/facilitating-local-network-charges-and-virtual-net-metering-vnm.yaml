- record_id: ARENA-DLV-72245
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: '2015'
  project_name: Facilitating Local Network Charges and Virtual Net Metering (VNM)
  what_happened: ISF identified that potential benefits of distributed energy accruing
    to networks were not incentivised or price-signalled in a manner leading to economically
    efficient outcomes, causing some customer generation projects to either not proceed
    or to proceed with duplication of network infrastructure via private wires.
  lesson_learnt: The absence of a local generation network credit mechanism and virtual
    net metering framework creates a market gap that causes viable distributed generation
    projects not to proceed or to inefficiently duplicate network infrastructure —
    rule change processes to introduce such mechanisms should be pursued in parallel
    with project trials.
