- record_id: ARENA-DLV-68263
  source_title: Evaluation of ARENA's transport strategic priority
  publish_date: 2024-11
  project_name: JET Charge Charging as a Service Project
  what_happened: JET Charge's CaaS project encountered difficulties obtaining internal
    risk assessments from early adopter customers and achieving support from fleet
    leasing organisations, representing barriers to market entry for the subscription-based
    charging model despite customer satisfaction with the service itself.
  lesson_learnt: Fleet leasing organisations and internal corporate risk functions
    represent underestimated barriers to CaaS adoption — project teams should engage
    fleet leasing intermediaries and risk managers during business development rather
    than treating the fleet manager as the sole decision-maker, and should develop
    materials that specifically address the risk and accounting treatment of CaaS
    arrangements.
