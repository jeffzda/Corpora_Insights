- record_id: ARENA-DLV-68264
  source_title: Evaluation of ARENA's transport strategic priority
  publish_date: 2024-11
  project_name: JET Charge Charging as a Service Project
  what_happened: Uncertainties regarding the tax treatment of electric vehicles created
    barriers to market entry for JET Charge's CaaS offering, with the evaluation noting
    these as ongoing commercial uncertainties affecting the project's effectiveness.
  lesson_learnt: Unclear tax treatment of EVs and EV charging arrangements is a material
    barrier to fleet CaaS business models — proponents and ARENA should engage tax
    authorities early to clarify FBT and income tax implications for CaaS subscription
    arrangements, as unresolved tax uncertainty will slow fleet customer adoption
    regardless of the quality of the service.
