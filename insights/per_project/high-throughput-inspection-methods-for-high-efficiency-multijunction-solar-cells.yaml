- record_id: ARENA-DLV-21304
  source_title: UNSW - High-Throughput Inspection Methods for High-Efficiency Multijunction
    Solar Cells - R&D Interim Report
  publish_date: 2024-05
  project_name: Industrial High-Throughput Inspection Methods for High-Efficiency
    Multijunction Solar Cells
  what_happened: The team developed a bandpass filter (BPF)-based calibration method
    that successfully extracts implied open-circuit voltage (iVOC) images of silicon
    solar cells with errors below 3 mV regardless of variations in sample optical
    properties such as texturing and thickness; this was validated against a calibration
    cell with known voltage.
  lesson_learnt: For luminescence-based voltage imaging systems, a bandpass filter
    calibration approach that accounts for quantum efficiency variation across detection
    cameras can eliminate the need for closely matched calibration samples — reducing
    measurement complexity and enabling deployment across diverse cell types in both
    research and industrial contexts.
