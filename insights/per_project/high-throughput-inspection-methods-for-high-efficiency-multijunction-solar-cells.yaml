- record_id: ARENA-DLV-21301
  source_title: UNSW - High-Throughput Inspection Methods for High-Efficiency Multijunction
    Solar Cells - R&D Interim Report
  publish_date: 2024-05
  project_name: Industrial High-Throughput Inspection Methods for High-Efficiency
    Multijunction Solar Cells
  what_happened: During development of luminescence-based voltage calibration techniques
    for silicon solar cells, the research team found that lower-cost silicon (Si)
    cameras outperformed more-expensive indium-gallium-arsenide (InGaAs) cameras in
    minimising implied open-circuit voltage (iVOC) calibration errors — the maximum
    error of the InGaAs camera was four times higher than that of the Si camera.
  lesson_learnt: When designing luminescence imaging systems for silicon solar cell
    characterisation, select detection cameras based on their quantum efficiency profile
    relative to the measurement wavelength range — lower-cost Si cameras can deliver
    superior voltage calibration accuracy over InGaAs cameras due to the Si camera's
    sharper QE drop-off around 1,100 nm, enabling significant equipment cost reductions
    without sacrificing measurement quality.
  issue_severity: minor
  project_type: manufacturing/supply chain
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Developed a theoretical model to evaluate iVOC errors as a function
    of camera quantum efficiency and filter selection; demonstrated that careful bandpass
    filter (BPF) selection with a Si camera limits iVOC error to below 3 mV regardless
    of sample optical properties.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id001
  - 7
  - 8
  evidence_excerpt: For the imaging of Si solar cells, one key learning with immediate
    commercial impact was that the use of the lower-cost Si camera was arguably more
    effective at reducing the maximum voltage calibration error than more-expensive
    InGaAs cameras. This is shown visually in Figure 1, where the maximum error of
    the InGaAs camera is four times higher than the maximum error of the Si camera.
  confidence_note: issue_severity set to minor — the finding is a positive design
    insight rather than a delivery failure; outcome_class set to knowledge generated
    despite setback as the assumption that InGaAs cameras would be superior was overturned,
    generating cost-saving knowledge.
