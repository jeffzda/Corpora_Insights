- record_id: ARENA-DLV-21303
  source_title: UNSW - High-Throughput Inspection Methods for High-Efficiency Multijunction
    Solar Cells - R&D Interim Report
  publish_date: 2024-05
  project_name: Industrial High-Throughput Inspection Methods for High-Efficiency
    Multijunction Solar Cells
  what_happened: The project identified that existing characterisation techniques
    have significant gaps for multijunction solar cells, particularly the absence
    of contactless luminescence-based imaging techniques such as photoluminescence
    (PL) and electroluminescence (EL) suitable for in-line high-throughput inspection
    in mass production environments.
  lesson_learnt: R&D programs targeting next-generation solar cell manufacturing should
    explicitly scope the development of in-line, contactless characterisation techniques
    from the outset — the absence of such techniques represents a critical gap that,
    if unaddressed, will constrain scale-up and mass production optimisation of multijunction/tandem
    cells.
