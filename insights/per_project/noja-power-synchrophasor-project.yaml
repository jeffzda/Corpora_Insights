- record_id: ARENA-DLV-1809
  source_title: ARENA Insights Forum November 2018 DER Summary
  publish_date: 2019-04
  project_name: NOJA Power Synchrophasor Project
  what_happened: NOJA Power deployed phasor measurement units (PMUs) to address identified gaps in distribution network visibility, including insufficient resolution for accurate grid modelling, inadequate
    support for DER characterisation, and limited capability for microgrid operation monitoring.
  lesson_learnt: Distribution networks integrating significant DER penetration require higher-resolution monitoring infrastructure than conventional SCADA provides; PMU deployment should be considered as
    a precondition for accurate DER impact modelling and safe high-penetration operations.
