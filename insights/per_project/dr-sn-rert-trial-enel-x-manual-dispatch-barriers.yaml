- record_id: ARENA-DLV-20718
  source_title: Demand Response Short Notice RERT Trial Year 3 Report
  publish_date: 2021-10
  project_name: DR SN RERT Trial — Enel X manual dispatch barriers
  what_happened: Enel X identified that C&I customers relying on manual DR dispatch
    faced recurring challenges including competing operational priorities, inability
    to have suitably qualified personnel available on event days, and staff turnover
    causing loss of institutional knowledge about the DR program.
  lesson_learnt: Manual DR dispatch in C&I settings is vulnerable to operational friction,
    staff availability, and knowledge loss from personnel turnover; aggregators should
    build re-training protocols into their C&I program management and prioritise customer
    sites with stable operations and low turnover for manual-only dispatch arrangements.
