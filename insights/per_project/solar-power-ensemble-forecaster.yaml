- record_id: ARENA-DLV-8504
  source_title: Solar Power Ensemble Forecaster Lessons Learnt 2
  publish_date: null
  project_name: Skycam and Multi-Model Solar Forecasting Project
  what_happened: Intermittent unknown errors on the AEMO server or within user account
    permissions caused forecast submission failures on multiple occasions. In two
    notable cases, the commencement of forecast submission was delayed significantly;
    in another, many missed forecasts materially impacted the self-forecasting performance
    assessment. The errors started and stopped without any intervention or changes
    made by either the project team or market participants.
  lesson_learnt: Self-forecast technology providers integrating with AEMO's EMMS system
    should verify whether programmatic password management is available before project
    start; the inability to automate password rotation across five farms with multiple
    accounts each imposed a disproportionate administrative burden that diverted effort
    from forecast improvement.
  issue_severity: major
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: data/validation/testing
  failure_mode: unvalidated integration
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: data & measurement
  intervention_note: In mid-October 2020 AEMO implemented an API endpoint enabling
    self-forecast providers to change account passwords programmatically, resolving
    the issue near the end of the project.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages:
  - 3
  - 11
  evidence_excerpt: An inability for the self-forecast provider to change the passwords
    for the EMMS user accounts used as the authentication method when submitting forecasts.
    This was a challenge as the password must be changed every 90 days... Managing
    this across five solar farms, with multiple accounts for each farm (pre-production,
    production and backup accounts) required a significant amount of time and coordination,
    which could have been better spent improving other aspects of our forecasting
    system.
  confidence_note: failure_mode set to integration failure as the root cause appears
    to be at the interface between the project's submission system and AEMO's server/account
    management infrastructure rather than within either system independently. Canonical
