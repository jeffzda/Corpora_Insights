- record_id: ARENA-DLV-60058
  source_title: Solar Power Ensemble Forecaster Lessons Learnt 1
  publish_date: '2019-10-29'
  project_name: Solar Power Ensemble Forecaster (2018/ARP161 - Industrial Monitoring
    & Control - Skycam and Multi-Model Solar Forecasting Project)
  what_happened: Improving GHI accuracy through multiple satellite channels was identified
    as potentially requiring fast radiative transfer models, which would increase
    computational costs and extend processing times — creating a trade-off between
    accuracy and operational timeliness for short time-scale forecasts.
  lesson_learnt: Forecasting projects targeting short time-scale outputs must explicitly
    evaluate the computational cost trade-off before pursuing higher-accuracy multi-channel
    radiative transfer methods — improved accuracy may be incompatible with the processing
    time requirements of real-time NEM dispatch.
  issue_severity: minor
