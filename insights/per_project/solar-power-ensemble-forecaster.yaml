- record_id: ARENA-DLV-56806
  source_title: Solar Power Ensemble Forecaster Final Report
  publish_date: 2021-03
  project_name: Solar Power Ensemble Forecaster (SPEF)
  what_happened: AEMO server slow response times caused forecast submissions to miss
    gate closure times, and were recorded as reliability failures against the self-forecast
    during the initial assessment period, even though the cause was AEMO infrastructure
    rather than forecast quality. AEMO's policy only excluded intervals from assessment
    when all self-forecast providers were affected simultaneously, but in practice
    all providers were affected at different times.
  lesson_learnt: Self-forecast providers entering the AEMO initial assessment process
    should document and formally escalate AEMO server-side response failures to avoid
    being penalised for reliability issues outside their control; the assessment framework's
    requirement for simultaneous multi-provider outages before exclusion is impractical
    and may unfairly extend assessment periods.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: data/validation/testing
  failure_mode: regulatory & approvals
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: coordination & stakeholders
  intervention_note: Issues were largely resolved by the conclusion of the project;
    the project recommends AEMO review assessment exclusion criteria to address this
    systemic fairness issue.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages:
  - 2
  - 11
  evidence_excerpt: when submitting 7 seconds prior to the gate closure, the response
    time from the AEMO server varied from near instantaneous to 12 seconds (where
    any response time over 6-7 seconds would cause the gate closure to be missed),
    but submitting 9 seconds prior to the gate closure, only 2 seconds earlier, the
    response time is always near instantaneous, and at most less than 1 second.
  confidence_note: Canonical record merged from 2 source records across 2 document(s).
