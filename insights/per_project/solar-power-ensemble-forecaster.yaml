  source_title: Solar Power Ensemble Forecaster Final Report
  publish_date: 2021-03
  project_name: Solar Power Ensemble Forecaster (SPEF)
  what_happened: Training data splitting by clear sky index (ranking each day by CSI
    and placing an equal share in training and validation sets) was found to give
    better estimates of live forecast performance than other methods tested, improving
    model parameter tuning efficiency.
  lesson_learnt: Solar forecast model training pipelines should split training and
    validation data by clear sky index rather than by date or randomly; stratified
    splitting by CSI ensures both training and validation sets represent the full
    range of sky conditions, yielding more accurate estimates of live performance
    and more efficient hyperparameter tuning.
