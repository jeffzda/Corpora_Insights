- record_id: ARENA-DLV-60053
  source_title: Solar Power Ensemble Forecaster Lessons Learnt 1
  publish_date: '2019-10-29'
  project_name: Solar Power Ensemble Forecaster (2018/ARP161 - Industrial Monitoring
    & Control - Skycam and Multi-Model Solar Forecasting Project)
  what_happened: The project steering committee encountered misalignment between stakeholders
    on what constituted a successful forecast — national grid/academic objectives
    (maximum accuracy at multiple time horizons) diverged from market participant
    objectives (e.g. minimising FCAS Causer Pays charges), and no agreed KPIs or metrics
    existed at project outset.
  lesson_learnt: Before commencing a solar forecasting project, define and agree KPIs,
    reporting metrics, and success criteria for each stakeholder class — market participants,
    system operators, and researchers have different commercial objectives, and misalignment
    will consume significant steering committee time and may invalidate evaluation
    frameworks.
