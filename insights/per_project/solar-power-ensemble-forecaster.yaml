  project_name: Solar Power Ensemble Forecaster (SPEF)
  what_happened: Power autoregression models performed poorly for a small number of
    dispatch intervals immediately after a semi-dispatch cap was released, because
    the historical power window still contained constrained power values, leading
    to depressed forecasts and forecast errors.
  lesson_learnt: Self-forecast models that use historical power data should implement
    logic to switch to irradiance-only models during and immediately after semi-dispatch
    cap periods; training data should also have pre- and post-cap ramp intervals removed,
    as implementing this filtering produced 4–5% improvements in MAE skill vs ASEFS.
