- record_id: ARENA-DLV-56810
  source_title: Solar Power Ensemble Forecaster Final Report
  publish_date: 2021-03
  project_name: Solar Power Ensemble Forecaster (SPEF)
  what_happened: Forecasts optimised primarily to minimise RMSE or MAE did not directly
    minimise FCAS Causer Pays fees because the relationship between forecast error
    metrics and fees is non-trivial; the project found that RMSE was slightly more
    important than MAE for fee estimation (contrary to the documented procedure),
    and that fee reduction was not directly associated with improved forecast performance.
  lesson_learnt: Solar forecast providers seeking to reduce Causer Pays fees should
    optimise directly for fee reduction using RNEF/LNEF metrics rather than assuming
    MAE or RMSE minimisation is sufficient; the Causer Pays procedure's reliance on
    frequency coincidence and lagged contribution factors means raw forecast accuracy
    does not translate linearly into fee savings.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: no material delay stated
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The team developed a multi-input linear regression model using
    RNEF/LNEF metrics to estimate relative Contribution Factors per model, enabling
    after-the-fact fee comparison even without real-time FI data.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id006
  - 9
  - 61
  evidence_excerpt: Fee reduction was found to not be directly associated with improved
