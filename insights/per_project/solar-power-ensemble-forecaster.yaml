- record_id: ARENA-DLV-56804
  source_title: Solar Power Ensemble Forecaster Final Report
  publish_date: 2021-03
  project_name: Solar Power Ensemble Forecaster (SPEF)
  what_happened: The AEMO Causer Pays procedure was found to be partially undocumented,
    with key data (Frequency Indicator values) not publicly available, and required
    data scattered across disparate, poorly documented locations, making it extremely
    difficult to reimplement and validate.
  lesson_learnt: Projects that need to reimplement or validate regulatory fee calculation
    procedures should negotiate early access to worked examples and underlying data
    from the regulator; the AEMO Causer Pays procedure was so opaque that AEMO staff
    reportedly stated it had never been successfully reimplemented, making independent
    validation nearly impossible without insider access.
  issue_severity: major
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: data/validation/testing
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: regulatory & approvals
  intervention_note: Frequency Indicator data was eventually supplied by one of the
    market participants in the trial, enabling partial reconstruction of the Causer
    Pays model.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages:
  - 2
  - 10
  - 11
  evidence_excerpt: Some important parts of the FCAS procedure are undocumented (e.g.
    FI values are prematurely rounded to five decimal points in AEMO's calculations,
    meaning that intervals where FI is approximately zero, are removed from five-minute
    factor calculations), and data which is required for the calculation is in disparate,
    impractical and poorly documented locations across both NEMWeb and the AEMO website.
