  what_happened: A possible trend was observed where solar farms at more southerly
    latitudes exhibited higher normalised forecast error (NRMSE R² = 0.89 across four
    sites), potentially reflecting higher solar intermittency in winter/spring at
    those locations; the sample size of four sites was too small to draw definitive
    conclusions.
  lesson_learnt: Portfolio managers deploying solar self-forecasting systems should
    anticipate higher forecast error at more southerly sites during winter/spring
    and plan for longer model improvement cycles or greater ensemble diversity at
    those sites; a larger multi-site, multi-season dataset is needed to confirm this
    latitude-error relationship.
