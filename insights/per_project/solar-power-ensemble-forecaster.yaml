  project_name: Solar Power Ensemble Forecaster (SPEF)
  what_happened: The Statistics Model (Fourier series combined with an autoregressive
    model) was simple to implement, required no additional installed hardware, and
    performed comparably to or better than ASEFS at most sites, though it was occasionally
    degraded by SCADA feed dropouts.
  lesson_learnt: A statistics-based autoregressive model retrained every five minutes
    on SCADA data is a low-cost, hardware-free baseline forecast option that can outperform
    ASEFS; its main vulnerability is SCADA data dropouts, which should be monitored
    and mitigated through redundant data feeds or fault detection logic.
