  what_happened: AEMO did not respond to clarification requests regarding the Causer
    Pays procedure for almost four months, severely hampering the project's ability
    to produce the cost-benefit analysis and preventing the planned financial optimisation
    of forecast models to further reduce causer-pays charges.
  lesson_learnt: Projects that depend on regulatory body clarification for financial
    modelling should build explicit buffer time and escalation protocols into their
    schedules; a nearly four-month AEMO non-response caused the financial optimisation
    workstream to be abandoned, reducing the demonstrable financial impact of the
    project.
