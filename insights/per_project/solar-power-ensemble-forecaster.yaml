  project_name: Solar Power Ensemble Forecaster (SPEF)
  what_happened: The SIFM satellite-based model underperformed significantly against
    ASEFS at most sites (RMSE skill of −64% to −131% versus ASEFS), with errors in
    the GHI-to-power conversion amplifying upstream irradiance estimation errors;
    lack of direct DNI measurements at any site made it harder to diagnose and correct
    conversion errors.
  lesson_learnt: Satellite irradiance forecasting models that rely on GHI-to-power
    conversion are limited by the absence of on-site DNI measurement; deploying pyranometers
    capable of measuring DNI directly at trial sites is necessary to properly diagnose
    and correct the compounded errors in satellite-derived power forecasts.
