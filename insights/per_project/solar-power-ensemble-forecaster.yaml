- record_id: ARENA-DLV-56820
  source_title: Solar Power Ensemble Forecaster Final Report
  publish_date: 2021-03
  project_name: Solar Power Ensemble Forecaster (SPEF)
  what_happened: Solar farms generally did not provide information about maintenance
    periods or network constraint curtailments (e.g. SF3), making it difficult to
    flag and remove these periods from model training data; this likely explains some
    of the performance differences observed between farms and introduced unintended
    bias in trained models.
  lesson_learnt: Solar forecasting project agreements should require participating
    farms to provide real-time or near-real-time flags for all types of non-weather
    curtailment (maintenance, network constraints, unplanned outages); absence of
    this data introduces systematic bias in trained models and degrades forecast accuracy
    in ways that cannot be quantified without the flags.
