  what_happened: The initial AEMO self-forecasting assessment for SF2 extended to
    17 weeks (more than double the standard 8-week window) primarily because of reliability
    issues that arose in the first week only, after which fixes were applied; the
    16-week rolling assessment window did not reset after early issues were corrected.
