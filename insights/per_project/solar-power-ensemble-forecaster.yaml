  source_title: Solar Power Ensemble Forecaster Lessons Learnt 2
  publish_date: null
  project_name: Skycam and Multi-Model Solar Forecasting Project
  what_happened: 'As a non-market participant forecast provider, the project team
    faced operational complications including: manual password change processes requiring
    coordination with market participants, blurred responsibility boundaries, and
    an overly complex and expensive process to access MarketNet data. The lack of
    MarketNet access risked reducing forecast accuracy while imposing cost barriers
    on forecast providers.'
  lesson_learnt: Forecast providers operating as non-market participants should establish
    clear documented protocols with market participants for credential management
    before going live, and advocate for automated password processes and streamlined
    MarketNet access — the current manual, fragmented arrangement creates operational
    risk and cost barriers that will inhibit uptake of self-forecasting solutions
    at scale.
