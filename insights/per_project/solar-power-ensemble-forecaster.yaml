  project_name: Solar Power Ensemble Forecaster (SPEF)
  what_happened: Frequency Indicator (FI) data required for real-time Causer Pays
    fee optimisation is not publicly published by AEMO and was not available frequently
    enough for the project team to implement planned real-time model tuning to minimise
    fees during the trial.
  lesson_learnt: AEMO should publish Frequency Indicator data and a worked example
    of the full Causer Pays calculation procedure; absence of public FI data prevents
    self-forecast providers from optimising forecasts for fee minimisation in real-time,
    limiting the full financial benefit achievable for generators and the grid.
