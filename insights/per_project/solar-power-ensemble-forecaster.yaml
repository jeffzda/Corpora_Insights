  source_title: Solar Power Ensemble Forecaster Final Report
  publish_date: 2021-03
  project_name: Solar Power Ensemble Forecaster (SPEF)
  what_happened: The Causer Pays procedure applies contribution factors from a previous
    28-day period to fee calculations for the current period, implicitly assuming
    constant generator forecast performance month-to-month; the project found this
    assumption is invalid for solar generators due to seasonal variation in solar
    intermittency.
  lesson_learnt: Stakeholders advocating for solar generators should seek a review
    of the AEMO Causer Pays procedure's lag structure, which allocates fees based
    on prior-month performance factors that do not reflect actual forecast performance
    for seasonally variable renewable generators, potentially resulting in systematically
    unfair fee allocation.
