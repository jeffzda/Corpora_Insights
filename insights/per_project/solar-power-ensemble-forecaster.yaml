  what_happened: Using a single irradiance value as input for field performance modelling
    was found to produce accurate results for only approximately 50% of field operating
    conditions, limiting the reliability of forecast-to-power conversion.
  lesson_learnt: Solar forecasting projects that convert irradiance forecasts to power
    output should not rely on a single irradiance input — string or inverter level
    data is likely required to accurately model field output across the full range
    of operating conditions.
