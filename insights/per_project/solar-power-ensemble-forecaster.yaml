- record_id: ARENA-DLV-8503
  source_title: Solar Power Ensemble Forecaster Lessons Learnt 2
  publish_date: null
  project_name: Skycam and Multi-Model Solar Forecasting Project
  what_happened: Large discrepancies were found between on-site SCADA-based export
    power measurements and AEMO's published INITIALMW values across several sites.
    On some sites the differences were almost as large as the forecast error itself,
    significantly constraining the ability to demonstrate forecast accuracy improvements
    over AWEFS/ASEFS benchmarks.
  lesson_learnt: 'Evaluators of self-forecasting systems must account for AEMO''s
    data substitution behaviour: when SCADA power quality is flagged, INITIALMW is
    replaced with UIGF, inflating apparent ASEFS performance and making fair comparison
    against self-forecasts impossible without separating affected intervals.'
  issue_severity: major
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: data/validation/testing
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The project team was still working to resolve data discrepancies
    across several sites at the time of reporting; no completed resolution was documented.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages:
  - 2
  - 3
  - 62
  evidence_excerpt: Poor SCADA data quality benefits the incumbent forecast. When
    the SCADA power data sent from the farm to AEMO is flagged as poor quality, the
    INITIALMW value is sometimes replaced with the UIGF. This quality data is difficult
    to obtain, and if not considered when assessing forecasts makes the incumbent
    forecast (e.g. ASEFS at SF4) appear to be much higher performing than it may be.
  confidence_note: issue_severity set to major because the discrepancy was of sufficient
    magnitude to fundamentally compromise the core project objective of demonstrating
    forecast accuracy improvement. Canonical record merged from 2 source records across
    2 document(s).
