    over NWP-based systems like ASEFS specifically during high-intermittency conditions;
    deploying Skycam hardware at solar farms facing frequent cloudy or partly cloudy
    conditions is likely to yield the greatest forecast performance and Causer Pays
    fee reduction benefits.
