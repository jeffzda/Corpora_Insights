- record_id: ARENA-DLV-3751
  source_title: Jet Zero - Project Ulysses - Proof of Concept LCA Public Summary
  publish_date: '2025-03-27'
  project_name: Project Ulysses
  what_happened: The proof-of-concept LCA for Project Ulysses was completed using
    pre-FEED data, meaning key inputs — including electricity mix, hydrogen production
    assumptions, and ethanol process parameters — are based on conservative estimates
    that are expected to change as engineering design is refined during FEED.
  lesson_learnt: When commissioning a proof-of-concept LCA before FEED is complete,
    clearly document which assumptions are placeholders and schedule a refresh of
    the LCA once FEED data is available — pre-FEED LCA results carry material uncertainty
    and should not be used as final investment decision inputs without revision.
