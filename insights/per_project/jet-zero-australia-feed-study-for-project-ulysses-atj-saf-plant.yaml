- record_id: ARENA-DLV-3752
  source_title: Jet Zero - Project Ulysses - Proof of Concept LCA Public Summary
  publish_date: '2025-03-27'
  project_name: Project Ulysses
  what_happened: Contribution analysis identified that ethanol production accounts
    for over 50% of total GHG emissions for Project Ulysses SAF, with energy consumption
    (electricity and natural gas for plant operations plus hydrogen production) accounting
    for a further 40%-plus, making these the two dominant emissions hotspots in the
    production system.
  lesson_learnt: For Alcohol-to-Jet SAF projects, feedstock ethanol production and
    on-site energy supply are the dominant lifecycle emissions drivers — project developers
    should prioritise decarbonising these two inputs (via optimised bioethanol supply
    chains and 100% renewable electricity/biomethane) before other process improvements
    to achieve maximum GHG reduction.
