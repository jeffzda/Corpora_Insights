- record_id: ARENA-DLV-3753
  source_title: Jet Zero - Project Ulysses - Proof of Concept LCA Public Summary
  publish_date: '2025-03-27'
  project_name: Project Ulysses
  what_happened: Modelling of three cumulative improvement scenarios — 100% renewable
    electricity, 100% biomethane substitution for natural gas, and optimised bioethanol
    production — demonstrated that Project Ulysses SAF could achieve a 71% GHG reduction
    versus fossil kerosene (from the baseline conservative 48%), representing a further
    23 percentage-point improvement available through identified supply chain and
    design changes ahead of Final Investment Decision.
  lesson_learnt: SAF projects using the Alcohol-to-Jet pathway should model supply
    chain decarbonisation scenarios (renewable electricity, biomethane, feedstock
    optimisation) during pre-FEED to identify which levers deliver the greatest emissions
    benefit before locking in design and offtake arrangements — the gap between conservative
    and optimised scenarios can be large enough to determine CORSIA eligibility or
    commercial competitiveness.
  issue_severity: none
  project_type: industrial decarbonisation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: project developer
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: follow-on scale-up enabled
  secondary_failure_mode: null
  intervention_note: Three optimisation scenarios were modelled prior to FEED to guide
    design and supply chain decisions ahead of Final Investment Decision.
  transferability: moderate
  delay_magnitude: null
  technology_domain: bioenergy
  source_pages: &id003
  - 6
  - 7
  evidence_excerpt: The cumulative effects of the three scenarios are shown in Figure
    3, and demonstrate potential for a further 23% emissions reduction (71% reduction
    from the reference fuel) to an estimated ~25 g CO2-eq / MJ when compared with
    Project Ulysses' baseline using the climate change indicator.
