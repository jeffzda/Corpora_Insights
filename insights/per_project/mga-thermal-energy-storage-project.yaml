  what_happened: NEM wholesale price data for NSW (July 2024 to March 2025) showed
    that the average hourly wholesale price is well below $40/MWh during a significant
    daily window, but published analysis excludes retailer fees and transmission tariffs;
    several Australian grid operators are exploring alternative tariff structures
    to recognise the flexible load characteristics of eTES and similar electrification
    technologies.
  lesson_learnt: Project developers planning grid-connected thermal energy storage
    systems should engage early with network and grid operators regarding alternative
    tariff arrangements for flexible resistive loads — current tariff structures (particularly
    capacity-based network charges) may undermine business cases that appear sound
    on wholesale-price analysis alone, and early engagement can influence tariff design
    in favour of flexible industrial loads.
