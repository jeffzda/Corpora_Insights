  publish_date: 2025-10
  project_name: MGA Thermal Energy Storage Demonstration Project
  what_happened: The thermal insulation survey identified localised hot spots exceeding
    55 °C predominantly around conductive heat bridges at nozzles, heater penetrations,
    and guide features, and a preliminary aggregate enclosure heat loss of approximately
    70 kW — around 14% of the 500 kW rated steam duty.
  lesson_learnt: Penetration details, nozzle connections, and guide-tube conduction
    paths are the primary source of surface heat-bridge losses in solid-state thermal
    storage enclosures; addressing these in detailed design — rather than adding external
    insulation post-construction — is the correct mitigation, and guarding should
    be applied where accessible surfaces exceed 55 °C.
