  what_happened: The project demonstrated that round-trip efficiency and discharge
    depth metrics for thermal energy storage are case-dependent — sensitive to load
    profile, operating set-points, and allowable state-of-charge windows — rather
    than fixed system constants, requiring validated thermodynamic models to explore
    trade-offs for each specific application.
  lesson_learnt: Performance metrics for thermal energy storage (RTE, discharge depth,
    standby losses) should not be quoted as single fixed values in feasibility studies
    or offtake negotiations; validated system models must be used to generate application-specific
    performance envelopes tied to actual load profiles and SOC operating windows.
