  publish_date: 2025-10
  project_name: MGA Thermal Energy Storage Demonstration Project
  what_happened: The 10-hour discharge test (14 August 2025) demonstrated stable process-quality
    steam delivery over an extended duty cycle; the system sustained HP steam conditions
    within acceptance bands (358–364 °C at ~3.69–3.72 MPa) and released 4.46 MWh from
    storage over the full window, consistent with the 5 MWh rated capacity at 91%
    initial state of charge.
  lesson_learnt: Extended discharge testing at a first-of-a-kind thermal storage demonstrator
    should account for start-up pressure-raising losses and control-system trips that
    reduce effective storage capacity available for the test window; running heaters
    during pressure-raising in future operation can recover this loss (~0.4 MWh) and
    is consistent with real-world simultaneous charge-discharge operation.
