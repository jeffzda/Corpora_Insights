  publish_date: 2025-10
  project_name: MGA Thermal Energy Storage Demonstration Project
  what_happened: Techno-economic modelling benchmarked the Levelised Cost of Heat
    (LCOH) for MGA eTES-supplied process steam at AUD $64.25/MWh against natural gas
    boiler at $70.79/MWh (including $30/tonne carbon cost), hydrogen boiler at $119.57/MWh,
    biomass at $56.04/MWh, and electric boiler with BESS at $100.32/MWh, indicating
    that eTES is cost-competitive with gas for continuous industrial steam supply
    when charging at ~$40/MWh.
  lesson_learnt: Techno-economic feasibility assessments for industrial thermal energy
    storage should explicitly model the effective average charging electricity cost
    as the primary sensitivity — NEM data shows significant daily windows in NSW below
    $40/MWh that, when systematically exploited, underpin competitive LCOH; network
    tariff structure (energy vs. capacity components) is the second critical variable
    and should be stress-tested in FEED.
