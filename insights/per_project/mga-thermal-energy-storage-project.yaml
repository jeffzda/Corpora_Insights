- record_id: ARENA-DLV-41905
  source_title: MGA Thermal, Thermal Energy Storage Project - Final Project Knowledge
    Sharing Report
  publish_date: 2025-10
  project_name: MGA Thermal Energy Storage Demonstration Project
  what_happened: Geometric scaling analysis derived from the demonstrator's measured
    heat-loss data shows that enclosure standby losses scale with surface area (L²)
    while stored energy scales with volume (L³), meaning specific standby loss falls
    proportionally with scale; moving from 5 MWh to a 50 MWh system of similar geometry
    is expected to roughly halve enclosure loss as a fraction of rated duty (from
    ~14% to ~6–7%), with design refinements bringing commercial systems below 2%.
  lesson_learnt: Thermal storage system designs should favour fewer, larger enclosures
    over distributed fields of small modules — centralisation reduces the area-to-volume
    ratio, cuts penetration and nozzle density per MWh, and lowers specific standby
    losses; this geometric efficiency advantage should be explicitly modelled in FEED
    to justify the centralised architecture to investors and offtakers.
  issue_severity: none
