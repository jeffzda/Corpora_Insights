  what_happened: The MGA eTES demonstration confirmed that grid-connected thermal
    storage systems acting as large controllable resistive loads can participate in
    demand response, frequency control ancillary services (FCAS), and potentially
    synchronous generation services in CHP modes — value streams that are not captured
    in standard LCOH comparisons but could materially improve project economics.
