- record_id: ARENA-DLV-17502
  source_title: Luminous - Knowledge Share Public Report
  publish_date: 2025-11
  project_name: Luminous LUMI Series 4 at Goorambat East Solar Farm
  what_happened: Perception latency accounted for 22% of each LUMI cycle. Prior to
    fine-tuning with real-world Goorambat data, the AI perception algorithms produced
    faulty outputs when background objects (such as the skid steer) appeared in the
    field of view, causing unreliable autonomous operation.
  lesson_learnt: AI perception models for construction robots require fine-tuning
    with real on-site data before reliable performance is achieved — pre-deployment
    lab or simulation training is insufficient to handle the visual noise of an active
    construction environment. Budget for a data-collection and fine-tuning phase at
    each new site.
  issue_severity: moderate
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: technology vendor
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: successful demonstration
  secondary_failure_mode: data & measurement
  intervention_note: Fine-tuning the AI with Goorambat-specific data reduced total
    perception time by 55.2% (from 14.4s to 6.3s per cycle), achieving a peak autonomy
    ratio of 97.4%.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id002
  - 14
  evidence_excerpt: Prior to fine-tuning, the perception algorithms would oftentimes
    be confused by unexpected geometries in view... Fine-tuning with onsite Goorambat
    data enabled the software AI to become robust to such potential noise... our team
    was able to improve reliability and reduce the total perception time by 55.2%
    (from 14.4s to 6.3s).
