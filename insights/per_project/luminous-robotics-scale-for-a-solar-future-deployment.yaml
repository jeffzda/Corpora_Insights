  - 23
  evidence_excerpt: We eventually learned that this staging was sub-optimal, because
    the skid steer would have to traverse the row and 'exit', then enter the row next
    to it to retrieve new pallets. Doing so, added an additional 5-10 minutes per
    box... Near the end of the project, we altered the staging to be clustered near
    the end of the rows... This brought the pallet retrieval time to about 2 minutes
    per box.
