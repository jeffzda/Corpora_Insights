  intervention_note: The U.S. engineering team iterated on AI perception models overnight
    (EST) using data collected during Australian shifts (AEST), enabling a fast 16×6
    continuous improvement cycle that resolved perception issues shift-by-shift.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
