  project_name: Luminous LUMI Series 4 at Goorambat East Solar Farm
  what_happened: Zero safety incidents were recorded during the entire module installation
    phase at Goorambat East Solar Farm. The safety outcome was achieved through a
    jointly developed and continuously updated Safe Work Method Statement (SWMS),
    flagged work zones restricting access to trained personnel only, and real-time
    wind speed monitoring.
  lesson_farnt: A zero-incident outcome for a first-ever robotic module installation
    deployment can be achieved by co-developing the SWMS with the site safety team
    from day one, creating physically demarcated robot-only work zones, and implementing
    real-time environmental monitoring with pre-defined stop thresholds.
