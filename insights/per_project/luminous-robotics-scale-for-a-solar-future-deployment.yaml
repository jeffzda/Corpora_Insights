  source_title: Luminous - Knowledge Share Public Report
  publish_date: 2025-11
  project_name: Luminous LUMI Series 4 at Goorambat East Solar Farm
  what_happened: All Luminous personnel deploying on a Victorian construction site
    were required to complete in-person 'white card' (Construction Induction) training
    for Victoria, plus a separate site induction managed by Equans, with all credentials
    uploaded to the 3DSafety platform before they could access the site. Equipment
    operators additionally required Certificates of Competency for each piece of plant.
  lesson_learnt: When deploying US-based robotics personnel to Australian construction
    sites for the first time, account for mandatory state-level construction induction
    (white card), site-specific induction, work visa requirements, and equipment-specific
    Certificates of Competency — these cannot be completed on the day of mobilisation
    and must be planned weeks in advance.
