    site shutdowns), persistent winds above 35 km/h, and muddy ground conditions —
    caused repeated unplanned site stoppages that reduced realised module installation
    counts during affected shifts.
  lesson_learnt: Weather-related stoppages at Australian utility-scale solar construction
    sites are frequent and material to daily production targets — robotic installation
    rate projections must incorporate realistic weather downtime buffers, particularly
    for wind, rain, and ground-condition events.
