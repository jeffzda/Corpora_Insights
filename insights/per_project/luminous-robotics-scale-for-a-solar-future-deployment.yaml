  project_name: Luminous LUMI Series 4 at Goorambat East Solar Farm
  what_happened: LUMI robots achieved installation rates that exceeded the pace at
    which human catchers could complete their tasks (bolting, torquing, and torque
    marking), making the labourers the rate-limiting factor rather than the robots.
    In the final weeks, LUMI had to stop production one hour early each shift to allow
    labourers to finish securing installed modules.
  lesson_learnt: When deploying high-speed robotic module installers, model the entire
    crew system — robot throughput will exceed labourer finishing capacity, making
    human task completion the binding constraint. Plan crew ratios and task sequencing
    to prevent end-of-shift incomplete work accumulation.
