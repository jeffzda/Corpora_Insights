  source_title: Luminous - Knowledge Share Public Report
  publish_date: 2025-11
  project_name: Luminous LUMI Series 4 at Goorambat East Solar Farm
  what_happened: Due to the compressed project timeline, 91% of the 11 freight shipments
    (totalling 11,291 kg over 168,553 km) between the US and Australia were shipped
    by air rather than sea, significantly increasing logistics costs.
  lesson_learnt: Compressed deployment timelines force air freight for heavy robotics
    equipment, which is approximately 5× more expensive than sea freight — realistic
    manufacturing, assembly, and transport lead times must be built into project schedules
    to enable sea freight and control logistics costs.
