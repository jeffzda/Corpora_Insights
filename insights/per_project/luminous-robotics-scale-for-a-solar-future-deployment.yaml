- record_id: ARENA-DLV-17501
  source_title: Luminous - Knowledge Share Public Report
  publish_date: 2025-11
  project_name: Luminous LUMI Series 4 at Goorambat East Solar Farm
  what_happened: The LUMI robot fleet's software required 21 upgrades (v0.1.27 to
    v0.1.47) during the trial to address visual perception issues with a new racking
    system (ARRAY racking with octagonal tubes) and to optimise process flow. This
    was the first time LUMI had been configured for ARRAY racking geometry.
  lesson_learnt: When deploying robotic installation systems on a racking type not
    previously encountered, plan for significant in-field AI/software iteration cycles
    — first-time racking geometry differences will require multiple software upgrades
    before reliable autonomous performance is achieved.
