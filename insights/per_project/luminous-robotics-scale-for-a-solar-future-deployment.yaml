  source_title: Luminous - Knowledge Share Public Report
  publish_date: 2025-11
  project_name: Luminous LUMI Series 4 at Goorambat East Solar Farm
  what_happened: The effective daily production window was only 7.5 hours out of a
    nominally allocated 9-hour shift (7am–4pm) due to mandatory pre-start briefings,
    a 15-minute Smoke-O break, a lunch break, and travel time between the crib area
    and the increasingly distant work face — resulting in up to 26% loss of operational
    duration.
  lesson_learnt: Robotic installation rate forecasts for Australian construction sites
    must be based on ~7.5 hours of productive time per 9-hour shift, not total allocated
    hours — pre-start, breaks, and increasing travel time to the work face consistently
    consume approximately 26% of scheduled shift time.
