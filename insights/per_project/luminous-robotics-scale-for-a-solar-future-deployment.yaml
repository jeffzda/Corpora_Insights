  project_name: Luminous LUMI Series 4 at Goorambat East Solar Farm
  what_happened: Robot BY-001 was configured to throw modules to the right and BY-002
    to the left. Because the short rails at the beginning of each row were not pre-spaced
    and were initially skipped, BY-001 had to revisit these sections later, resulting
    in BY-002 installing 71.7% of all modules while BY-001 installed only 28.3%.
  lesson_learnt: Uneven task allocation between paired robots in a two-robot fleet
    configuration significantly reduces overall fleet efficiency — ensure row-start
    geometry is pre-spaced and ready before beginning a new row to prevent one robot
    carrying a disproportionate share of the workload.
