- record_id: ARENA-DLV-2607
  source_title: ARENA Insights Forum November 2024 - Accelerating Zero-Emissions Heavy
    Transport
  publish_date: 2024-11
  project_name: Centurion Electric Trucks Project
  what_happened: The Centurion Electric Trucks Project involved establishing 30 Mercedes
    eActros 300 BEVs at Centurion's Hazelmere depots in Perth, fuelled by two off-grid
    renewable energy systems (4.4MW solar PV and 10.3MWh BESS). Fleet operational
    readiness was scheduled for January 2025 (20 BEVs, north site) and April 2025
    (10 BEVs, south site).
  lesson_learnt: Large-scale electric fleet deployments co-located with off-grid renewable
    energy systems require careful phased scheduling across multiple sites — staggering
    operational readiness dates allows commissioning lessons from the first site to
    be applied to subsequent ones.
