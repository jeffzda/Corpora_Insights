- record_id: ARENA-DLV-2608
  source_title: ARENA Insights Forum November 2024 - Accelerating Zero-Emissions Heavy
    Transport
  publish_date: 2024-11
  project_name: Centurion Electric Trucks Project
  what_happened: The Centurion project required engagement with a complex stakeholder
    landscape including landlords (Perth Airport, Airport Building Controller as Federal
    Government), insurance companies, DEMIRS, and the network manager, all classified
    as high-power/high-interest stakeholders requiring active management across planning,
    execution, and operations stages.
  lesson_learnt: Electric fleet projects at facilities with complex tenancy or regulatory
    arrangements (e.g. airport sites, grid-connected renewables) require formal stakeholder
    mapping and active management of regulatory and landlord stakeholders from the
    earliest project stage — their requirements can constrain design and schedule.
