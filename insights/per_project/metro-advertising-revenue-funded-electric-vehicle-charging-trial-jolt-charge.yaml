- record_id: ARENA-DLV-68255
  source_title: Evaluation of ARENA's transport strategic priority
  publish_date: 2024-11
  project_name: Metro Advertising Revenue Funded Electric Vehicle Charging Trial (JOLT
    Charge)
  what_happened: JOLT Charge deployed 21 EV charging and advertising panels in Adelaide
    using a freemium advertising business model. The project successfully navigated
    grid connection, high voltage cabling, and underground infrastructure complexities.
    Following the ARENA investment of ~$1 million, JOLT secured ~$130 million in private
    funding — described as the largest EV infrastructure investment in Australia —
    and expanded nationally and internationally.
  lesson_learnt: A modest ARENA grant to a startup proving a novel charging business
    model can catalyse orders-of-magnitude larger private investment — ARENA's early
    commitment as the first financial backer was a decisive credibility signal that
    unlocked $130 million in private funding; this leverage effect should be factored
    into program design for FOAK business model trials.
