- record_id: ARENA-DLV-68256
  source_title: Evaluation of ARENA's transport strategic priority
  publish_date: 2024-11
  project_name: Metro Advertising Revenue Funded Electric Vehicle Charging Trial (JOLT
    Charge)
  what_happened: The JOLT Charge trial encountered complexities with grid connections,
    high voltage cabling, and existing underground infrastructure during deployment
    of 21 charging stations across four Adelaide councils. These were identified as
    core delivery issues for deploying any EV network in metropolitan areas.
  lesson_learnt: EV charging infrastructure projects in urban areas should conduct
    detailed subsurface and grid connection surveys before finalising site selections
    — underground infrastructure conflicts and high-voltage cabling requirements are
    recurring delivery risks that can affect timelines and costs at multiple sites
    simultaneously.
