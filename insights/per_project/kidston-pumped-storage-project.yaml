  source_title: Kidston Pumped Storage Hydro Project - Knowledge Sharing - ARENA
  publish_date: 2018-12
  project_name: Kidston Pumped Storage Hydro Project (K2H)
  what_happened: Acquiring a disused mine site for pumped hydro development entails
    significant ongoing financial liability in the form of an environmental bond,
    the magnitude of which varies depending on how much rehabilitation has already
    been completed at the site.
  lesson_learnt: Before acquiring a decommissioned mine site for pumped hydro development,
    rigorously assess the environmental bond liability — the degree of prior rehabilitation
    directly determines the financial exposure and can materially affect project economics
    and bankability.
