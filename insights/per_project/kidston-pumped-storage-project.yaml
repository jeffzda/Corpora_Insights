- record_id: ARENA-DLV-21356
  source_title: Kidston Pumped Storage Hydro Project - Knowledge Sharing - ARENA
  publish_date: 2018-12
  project_name: Kidston Pumped Storage Hydro Project (K2H)
  what_happened: Geotechnical assessment of the mine pit rock walls was identified
    as a critical feasibility requirement because fluctuating water levels during
    pumped hydro operation impose dynamic pressure on the walls; rock composition,
    integrity, porosity, and chemical interaction with water all affect design viability.
  lesson_learnt: Prioritise geotechnical assessment of rock wall integrity early in
    feasibility for any disused open-cut mine pumped hydro scheme — the dynamic pressures
    from operational water level fluctuations make rock composition, porosity, and
    water-rock chemistry fundamental inputs to a technically viable design.
