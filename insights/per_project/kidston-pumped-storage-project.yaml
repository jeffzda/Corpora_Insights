- record_id: ARENA-DLV-21360
  source_title: Kidston Pumped Storage Hydro Project - Knowledge Sharing - ARENA
  publish_date: 2018-12
  project_name: Kidston Pumped Storage Hydro Project (K2H)
  what_happened: The feasibility works established that, for a FOAK mine-pit pumped
    hydro project, reaching the final development stage (detailed design and EPC contract
    execution) requires a minimum of 3 years from concept, plus approximately one
    further year to secure financing and initiate construction — totalling a minimum
    of 4 years from concept to construction start.
  lesson_learnt: Schedule at least 3 years from concept to detailed design / EPC contract
    execution for a first-of-kind mine-pit pumped hydro project, plus a further year
    for financing and construction mobilisation — the precedent and financial structures
    established at Kidston mean subsequent similar projects could reach financial
    close in under 3 years.
