  source_title: Kidston Pumped Storage Hydro Project - Knowledge Sharing - ARENA
  publish_date: 2018-12
  project_name: Kidston Pumped Storage Hydro Project (K2H)
  what_happened: Isolated disused mine sites typically lack the existing infrastructure
    (accommodation, electrical, water) required to support large-scale pumped storage
    construction; the Kidston site was specifically selected because substantial legacy
    mine infrastructure remained, reducing this barrier.
  lesson_learnt: When evaluating disused mine sites for pumped hydro development,
    prioritise sites with significant residual mine infrastructure — sites lacking
    accommodation, electrical, and water infrastructure will face substantially higher
    capital costs and logistical complexity that may undermine project viability.
