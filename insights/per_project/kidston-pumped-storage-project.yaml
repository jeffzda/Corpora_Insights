- record_id: ARENA-DLV-21355
  source_title: Kidston Pumped Storage Hydro Project - Knowledge Sharing - ARENA
  publish_date: 2018-12
  project_name: Kidston Pumped Storage Hydro Project (K2H)
  what_happened: The project was initially designed around a 330MW three-pit (turkey's
    nest) configuration, but following market studies that revised the optimal capacity
    to 250MW, Genex was able to revert to a simpler two-pit solution using the existing
    mine pits, achieving lower construction cost per MW.
  lesson_learnt: Where existing mine pit infrastructure can serve as reservoirs, design
    iterations should evaluate the two-pit solution against turkey's nest / artificial
    reservoir options at each capacity scenario — the lower-cost two-pit solution
    may become viable when capacity is scaled down to market-optimal levels.
  issue_severity: minor
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: project developer
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Mott MacDonald Optimisation Study confirmed 250MW viability,
    enabling Genex to drop the third reservoir and reduce capital cost.
  transferability: narrow
  delay_magnitude: null
  technology_domain: pumped hydro
  source_pages: &id005
  - 7
  evidence_excerpt: In terms of the most optimal configuration, the turkey's nest/3-pit
    solution was the most viable option when the project was initially sized at 330MW.
    However, following market studies that concluded 250MW was the most optimal size
    from a financial/market perspective, the scheme no longer required the additional
    capacity associated with building a third reservoir/turkey's nest. Genex was able
    to revert to a two-pit solution given this was adequate to achieve a 250MW nameplate
    capacity and more cost effective than constructing a third artificial reservoir.
