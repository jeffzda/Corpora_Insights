- record_id: ARENA-DLV-21354
  source_title: Kidston Pumped Storage Hydro Project - Knowledge Sharing - ARENA
  publish_date: 2018-12
  project_name: Kidston Pumped Storage Hydro Project (K2H)
  what_happened: Market analysis completed in 2016 and a revised Optimisation Study
    in 2017 determined that 250MW with up to 8 hours of storage was the optimal installed
    capacity; the project had originally been sized at 330MW and a three-pit (turkey's
    nest) configuration, which was found to produce market inefficiencies at that
    scale.
  lesson_learnt: Conduct rigorous market analysis before finalising capacity and configuration
    for large pumped hydro projects — over-sizing relative to the target market creates
    inefficiencies; for the Northern Queensland context, 250MW / 8-hour storage represented
    the ceiling of financially viable capacity.
