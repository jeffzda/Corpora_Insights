  evidence_excerpt: Based on a market analysis completed in 2016 and the revised Optimisation
    Study in 2017, it was concluded that K2-Hydro should have a nameplate capacity
    of 250MW and have up to 8 hours of storage. Anything of greater capacity results
    in market inefficiencies.
