- record_id: ARENA-DLV-21351
  source_title: Kidston Pumped Storage Hydro Project - Knowledge Sharing - ARENA
  publish_date: 2018-12
  project_name: Kidston Pumped Storage Hydro Project (K2H)
  what_happened: The overall development timeline from original concept to the final
    development stage exceeded 5 years, partly because the novel concept required
    detailed technical exploration before operational and financial analysis could
    begin, and partly because Genex allocated the majority of its resources to a large-scale
    solar project for 18 months.
  lesson_learnt: Resource competition between concurrent projects can significantly
    extend development timelines — ring-fence dedicated resources for FOAK pumped
    hydro development to avoid compounding the already lengthy feasibility period;
    with dedicated resourcing, future similar developments could reach final development
    stage in a minimum of 3 years rather than 5+.
  issue_severity: moderate
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: project developer
  delay_category: internal governance/resourcing
  failure_mode: coordination & stakeholders
  outcome_class: delayed but recoverable
  secondary_failure_mode: poor scoping
  intervention_note: Genex completed the TFS Optimisation with Mott MacDonald in 2017
    to recover development momentum after the resourcing diversion, ultimately producing
    a bankable engineering solution.
  transferability: moderate
  delay_magnitude: 1-3 years
  technology_domain: pumped hydro
  source_pages: &id001
  - 8
  evidence_excerpt: Since the formation of the original concept to the present day,
    the entire timeline has exceeded 5 years. This lengthy development period was
    the result of this novel, innovative concept that required detailed technical
    exploration and understanding prior to the analysis of the operational and financial
    components. However, this period was exacerbated by the company's development
    of a large-scale solar project, with the majority of resources allocated toward
    this development for 18 months.
