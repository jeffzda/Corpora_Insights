- record_id: ARENA-DLV-21357
  source_title: Kidston Pumped Storage Hydro Project - Knowledge Sharing - ARENA
  publish_date: 2018-12
  project_name: Kidston Pumped Storage Hydro Project (K2H)
  what_happened: Hydrological planning for the project revealed that both long-term
    water resource availability (via weather patterns and access agreements) and the
    management of large-volume dewatering during construction are significant practical
    challenges for disused mine pit pumped hydro projects.
  lesson_learnt: Secure water access agreements and model long-term hydrological reserves
    before committing to mine-pit pumped hydro design — dewatering large mine pit
    volumes during construction requires dedicated planning for process, logistics,
    and timeline that is not required in conventional pumped hydro projects.
