- record_id: ARENA-DLV-21358
  source_title: Kidston Pumped Storage Hydro Project - Knowledge Sharing - ARENA
  publish_date: 2018-12
  project_name: Kidston Pumped Storage Hydro Project (K2H)
  what_happened: K2-Hydro's design selected fixed-speed reversible Francis turbines
    over variable-speed alternatives, based on lower capital cost, greater operational
    simplicity, and the ability to provide real (physical) inertia to the grid rather
    than synthetic inertia.
  lesson_learnt: When selecting turbine type for pumped hydro projects targeting grid
    stability services, evaluate fixed-speed versus variable-speed against the full
    value stack — fixed-speed turbines cost less and provide real inertia (valued
    for grid stability), while variable-speed units offer operational flexibility
    and faster response but at higher capital cost; the optimal choice depends on
    the specific ancillary service revenue mix.
  issue_severity: none
