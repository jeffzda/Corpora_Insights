- record_id: ARENA-DLV-45662
  source_title: Pollination - Community Energy Report
  publish_date: 2024-07
  project_name: Marlinja Community Solar Project
  what_happened: Phase One of the Marlinja Community Solar Project delivered 10.75 kW of solar panels and a 10 kWh battery on the Community Centre roof in a remote Northern Territory community of approximately
    60 residents, reducing reliance on high-cost diesel generation and providing grid-outage resilience. Phase Two (100 kW solar, 136 kWh battery microgrid) was commissioned in July 2024, making it the
    first grid-connected Indigenous community-owned renewable energy project in the NT.
  lesson_learnt: For remote communities reliant on diesel generation, behind-the-meter solar and battery installations at community facilities provide immediate energy cost savings and outage resilience
    without the connection costs and use-of-grid charges of front-of-meter assets — this phased, behind-the-meter approach is a viable pathway to grid-connected community-owned renewable energy.
