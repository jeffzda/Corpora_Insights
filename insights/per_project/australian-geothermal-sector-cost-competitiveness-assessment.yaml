- record_id: ARENA-DLV-14957
  source_title: 'Looking Forward: Barriers, Risks and Rewards of the Australian Geothermal
    Sector to 2020 and 2030'
  publish_date: 2014-06
  project_name: Australian Geothermal Sector – Cost Competitiveness Assessment
  what_happened: LCOE modelling for geothermal electricity generation in Australia
    projected a range of $170–$300/MWh by 2020, compared to a wholesale electricity
    price expected to be $50–$100/MWh, making utility-scale geothermal power generation
    uncompetitive in 2020 without large subsidies under any scenario.
  lesson_learnt: Funding agencies should not commit to utility-scale geothermal electricity
    demonstration projects without a credible pathway to close a 2–4× cost gap relative
    to wholesale power prices; investment in the sector prior to 2020 should be redirected
    toward R&D to reduce the key cost drivers (drilling costs and flow rates) rather
    than further commercial demonstration at current technology readiness levels.
