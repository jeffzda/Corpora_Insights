  evidence_excerpt: the supply of cost-competitive geothermal energy provided at a
    utility scale level is extremely unlikely by 2020. This is because the levelised
    cost of energy from geothermal energy at a utility scale in 2020, as estimated
    by the IGEG and depending on assumptions about parameter values, varies between
    about $170/MWh and $300/MWh with a mean value of around $220/MWh. By contrast,
    the wholesale price of electricity in Australia, which is currently around $50/MWh,
    is unlikely to exceed $100/MWh by 2020 in almost any possible scenario.
