- record_id: ARENA-DLV-71053
  source_title: Hybrid Power Generation for Australian Off-Grid Mines
  publish_date: 2018-06
  project_name: DeGrussa Copper-Gold Mine Hybrid Power Project
  what_happened: The DeGrussa PV-diesel hybrid plant (35.8% renewable power fraction,
    with battery storage) experienced an 18-month ramp-up period after commissioning
    before reaching stable operation, significantly longer than lower-penetration
    hybrid systems.
  lesson_learnt: Financial models for hybrid power generation must include an explicit
    ramp-up period — the higher the renewable power fraction and the more complex
    the enabling technologies, the longer this period will be; the DeGrussa experience
    indicates at least 18 months for a ~36% RPF system with storage.
