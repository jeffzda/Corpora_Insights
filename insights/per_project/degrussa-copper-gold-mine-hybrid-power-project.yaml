- record_id: ARENA-DLV-71083
  source_title: Hybrid Power Generation for Australian Off-Grid Mines
  publish_date: 2018-06
  project_name: DeGrussa Copper-Gold Mine Hybrid Power Project
  what_happened: The DeGrussa PPA between Sandfire Resources and Neoen incorporated
    a variable electricity price structure sensitive to cumulative energy offtake
    in the initial supply period and annual energy offtake in the extended period,
    creating incentives for higher energy consumption that benefited both parties
    and encouraged PPA extension.
  lesson_learnt: Structuring PPA pricing to be sensitive to energy offtake thresholds
    (rather than fixed unit pricing) can align incentives between the mine and IPP
    — the DeGrussa model demonstrates that consumption-based price steps incentivise
    higher energy offtake, reducing unit costs for the mine while improving revenue
    certainty for the IPP.
