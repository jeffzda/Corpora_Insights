- record_id: ARENA-DLV-71060
  source_title: Hybrid Power Generation for Australian Off-Grid Mines
  publish_date: 2018-06
  project_name: DeGrussa Copper-Gold Mine Hybrid Power Project
  what_happened: At the DeGrussa brownfield site, installing PV outside the mining
    lease (rather than within it) was found to lower compliance requirements, resulting
    in lower costs and faster delivery.
  lesson_learnt: On brownfield sites, evaluate whether siting renewable generation
    outside the mining lease is feasible — doing so can reduce compliance obligations
    and accelerate delivery, as demonstrated at DeGrussa where this approach lowered
    costs and shortened timelines.
