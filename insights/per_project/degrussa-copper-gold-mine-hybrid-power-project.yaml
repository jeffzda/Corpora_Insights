- record_id: ARENA-DLV-71051
  source_title: Hybrid Power Generation for Australian Off-Grid Mines
  publish_date: 2018-06
  project_name: DeGrussa Copper-Gold Mine Hybrid Power Project
  what_happened: The risk profile of existing mine operations was not fully understood
    at the outset of a brownfield hybrid power generation retrofit, requiring construction
    methods to be redesigned to be flexible and complementary to current mine processes,
    including scheduling commissioning during maintenance downtime to minimise production
    disruption.
  lesson_learnt: On brownfield sites, the core processes of the mine must be fully
    understood and considered throughout delivery — construction and commissioning
    methods must be flexible and scheduled around mine operations (e.g. during planned
    maintenance downtime) to avoid disrupting production.
  issue_severity: moderate
