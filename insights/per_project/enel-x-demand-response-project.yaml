  project_name: ARENA Demand Response Trial (EnerNOC)
  what_happened: EnerNOC found that a common operational issue was insufficient staff
    numbers on site to confirm dispatch and enable load reduction, risking failed
    activations if contacts were unavailable.
  lesson_learnt: DR aggregators should mandate a minimum of three on-site contacts
    registered to receive and confirm dispatch instructions for each enrolled customer
    — relying on one or two contacts creates a material availability risk during real
    events when key staff may be unavailable.
