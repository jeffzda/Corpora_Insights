- record_id: ARENA-DLV-4552
  source_title: Enel X Demand Response Project – Knowledge Sharing Report 5
  publish_date: 2020-04
  project_name: ARENA Demand Response Trial (Enel X)
  what_happened: The RERT framework dispatches 10-minute notice reserves last, meaning
    customers on Energy-only payment structures had very little chance of earning
    revenue because Enel X's portfolios were rarely dispatched by AEMO during the
    trial period.
  lesson_learnt: When designing DR programs where reserves are dispatched in merit
    order, participants on Energy-only contracts face a structural disadvantage —
    program designers and aggregators should ensure payment structures reflect realistic
    dispatch probability, or default customers to Availability Payment models.
