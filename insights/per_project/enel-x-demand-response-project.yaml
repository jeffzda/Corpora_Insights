- record_id: ARENA-DLV-34764
  source_title: Enel X ARENA Demand Response Trial 7 - Knowledge Sharing Project Performance
    Report
  publish_date: '2020-12-21'
  project_name: ARENA Demand Response Trial - Enel X (EnerNOC)
  what_happened: The AEMO RERT baseline methodology's 20% cap on day-of-adjustment
    uplift meant that temperature-sensitive C&I sites (e.g. commercial buildings with
    heavy HVAC loads) whose actual consumption on extreme heat days was 200% above
    the 10-day average were only credited for a 20% uplift above that average, significantly
    understating their actual DR contribution.
  lesson_learnt: RERT program designers should revise or supplement the 20% day-of-adjustment
    uplift cap to accommodate temperature-sensitive loads whose consumption on extreme
    events can far exceed the historical 10-day baseline — under the current methodology,
    high-HVAC commercial buildings are systematically under-credited for DR during
    exactly the high-temperature events when the market most needs their response.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: null
  failure_mode: regulatory & approvals
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: demand response
  source_pages: &id061
  - 21
  evidence_excerpt: AEMO's RERT baseline methodology used over last 3 summers has
    put a 20% cap on any day-of-adjustment uplift. Therefore, rather than being credited
    with the full amount of load drop on the day (i.e. what they were using in the
    t-4 to t-1 window prior to event start time which is 200% higher than normal),
    AEMO only measures the load drop from a level which is 20% above their average
    load from past 10 days.
