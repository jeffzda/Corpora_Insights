  publish_date: 2020-04
  project_name: ARENA Demand Response Trial (Enel X)
  what_happened: Enel X deliberately recruited a 20% capacity buffer above its contracted
    50 MW portfolio target (10.9 MW additional capacity across VIC and NSW), which
    provided resilience against unplanned site unavailability, temperature-sensitive
    demand variation, and large-customer non-participation across multiple test and
    dispatch events.
  lesson_learnt: Building a 20% capacity buffer into DR portfolios is an effective
    strategy for managing unplanned unavailability — across multiple test events the
    buffer absorbed site outages, adverse weather, and large-customer withdrawals
    while still delivering 100%+ of target performance.
