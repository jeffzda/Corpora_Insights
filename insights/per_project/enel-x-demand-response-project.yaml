  evidence_excerpt: There were also other customers engaged by EnerNOC who would have
    been ideal candidates for the program, but were not enrolled by EnerNOC due to
    their business hours (i.e. 9AM – 5PM). Notwithstanding the program parameters
    which state reserves must be available between 10AM and 10PM AEST on working days;
    our experience operating wholesale DR resources in the NEM and our observation
