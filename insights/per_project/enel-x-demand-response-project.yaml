  transferability: moderate
  delay_magnitude: null
  technology_domain: demand response
  source_pages: &id023
  - 121
  evidence_excerpt: Based on our experience with participating in RERT in both this
    program and outside this program, we note the standard high 10 of 10 baseline
    methodology with day-of-adjustment for intervals t-4 to t-1 can be very punitive
    for certain C&I customer loads, who would otherwise be recognised for providing
    valuable load reduction.
