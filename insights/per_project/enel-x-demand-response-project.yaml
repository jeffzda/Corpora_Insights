  what_happened: Enel X recruited a multi-site retail customer that agreed to forgo
    availability payments in favour of higher energy payments, reflecting the customer's
    low setup costs (due to existing BMS infrastructure) but higher short-run marginal
    costs during curtailment. This non-standard payment structure enabled enrolment
    of a customer type not previously in the portfolio.
