  project_name: ARENA Demand Response Trial (Enel X)
  what_happened: Food production and processing facilities in VIC bucked the Christmas
    holiday shutdown trend, maintaining or increasing operations and energy consumption
    during the Christmas/New Year period due to seasonal demand for finished goods
    and increased export orders from Asia.
  lesson_learnt: Food production and processing sites represent a potentially reliable
    source of DR capacity during Christmas/New Year periods when most other C&I customers
    reduce operations — DR aggregators should actively recruit customers in this sector
    to maintain portfolio capacity over the summer holiday period.
