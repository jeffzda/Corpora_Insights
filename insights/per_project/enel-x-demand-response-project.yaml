  secondary_failure_mode: poor scoping
  intervention_note: Enel X updated internal procedures to reduce declared availability
    in the AEMO portal during public holiday periods and began recruiting additional
    customers that continue to operate during these periods.
  transferability: broad
  delay_magnitude: null
  technology_domain: demand response
  source_pages: &id004
