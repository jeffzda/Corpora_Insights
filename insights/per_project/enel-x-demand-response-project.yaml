  project_name: ARENA Demand Response Trial – Enel X
  what_happened: Across the ARENA DR trial, the majority of C&I customers consistently
    preferred firm Availability Payments over Energy-only dispatch payments, with
    customers explicitly describing availability payments as 'bankable' revenue and
    one customer stating they did not want to depend on a grid emergency to earn money.
    Customers from other DR programs also indicated a preference for guaranteed availability
    payments over opportunistic dispatch earnings.
  lesson_learnt: Design DR business models with firm availability payments as the
    primary revenue stream for C&I customers — energy-only or dispatch-contingent
    payment structures are commercially unattractive to most C&I decision-makers (CFOs,
    GMs) who require reliable, forecastable revenue to justify participation and obtain
    internal approvals.
