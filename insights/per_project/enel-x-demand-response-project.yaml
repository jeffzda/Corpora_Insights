- record_id: ARENA-DLV-34763
  source_title: Enel X ARENA Demand Response Trial 7 - Knowledge Sharing Project Performance
    Report
  publish_date: '2020-12-21'
  project_name: ARENA Demand Response Trial - Enel X (EnerNOC)
  what_happened: The AEMO RERT 'High 10 of 10' baseline methodology with a day-of-adjustment
    window (t-4 to t-1 hours before event) failed to credit DR from customers who
    proactively curtailed load before the adjustment window in response to published
    market notices of grid stress — their voluntary early load reduction was not reflected
    in the adjusted baseline, so no DR credit was recorded despite genuine contribution.
  lesson_learnt: The RERT High-10-of-10 adjusted baseline methodology structurally
    penalises proactive load curtailment that occurs before the t-4 to t-1 adjustment
    window — program designers should consider allowing credit for pre-event voluntary
    curtailment, or at minimum communicate this limitation clearly to customers to
    prevent well-intentioned actions from being commercially unrewarded.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: demonstration
