  source_title: EnelX Demand Response Project - Knowledge Sharing Report 1
  publish_date: '2018-03-06'
  project_name: ARENA Demand Response Trial (EnerNOC)
  what_happened: AEMO interpreted NER 3.20.3(j) to mean that any load enrolled under
    a RERT reserve contract cannot simultaneously bid into any FCAS markets during
    trading intervals covered by an ITT, including contingency FCAS. This interpretation
    — which EnerNOC disputed — created material opportunity costs and caused EnerNOC
    to redirect its recruitment strategy away from dual-enrolled FCAS customers toward
    greenfield-only ARENA sites.
  lesson_learnt: Before finalising recruitment strategy for a reliability DR program,
    aggregators must obtain a definitive ruling from AEMO on the eligibility of dual-participation
    between RERT and FCAS markets — ambiguity in AEMO's interpretation of NER 3.20.3(j)
    at program launch forced EnerNOC to abandon its most cost-efficient recruitment
    pathway and rebuild the portfolio from greenfield sites.
