- record_id: ARENA-DLV-45810
  source_title: EnelX Demand Response Project - Knowledge Sharing Report 2
  publish_date: 2018-06
  project_name: ARENA Demand Response Trial (EnerNOC)
  what_happened: Some C&I customers with business hours of 9AM–5PM could not be enrolled
    because DR events could extend beyond standard business hours (to 7–8:30PM), and
    the program availability window of 10AM–10PM on working days conflicted with these
    customers' operating profiles.
  lesson_learnt: DR program availability windows that extend beyond standard business
    hours (e.g. 10AM–10PM) will systematically exclude C&I customers with daytime-only
    operations — program designers should consider whether the availability window
    can be narrowed or whether evening-capable customers should attract a premium.
