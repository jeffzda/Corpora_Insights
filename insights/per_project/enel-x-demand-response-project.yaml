- record_id: ARENA-DLV-4556
  source_title: Enel X Demand Response Project – Knowledge Sharing Report 5
  publish_date: 2020-04
  project_name: ARENA Demand Response Trial (Enel X)
  what_happened: VIC portfolio energy consumption declined 17% over the week leading
    up to Christmas (16–20 December 2019), with many customers commencing site shutdowns
    from midday or early afternoon on work days before Christmas.
  lesson_learnt: DR aggregators should expect and plan for consumption — and therefore
    available DR capacity — to begin declining several days before public holidays,
    not just on the holidays themselves; portfolio models should factor in progressive
    demand reduction across the pre-holiday week.
