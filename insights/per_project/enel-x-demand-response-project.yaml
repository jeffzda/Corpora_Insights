- record_id: ARENA-DLV-4554
  source_title: Enel X Demand Response Project – Knowledge Sharing Report 5
  publish_date: 2020-04
  project_name: ARENA Demand Response Trial (Enel X)
  what_happened: Reduced business operations around extended public holiday periods
    (Christmas/New Year, Easter, Queen's Birthday) materially reduced baseline energy
    consumption at C&I customer sites, thereby reducing available DR capacity during
    periods when grid stress events may still occur.
  lesson_learnt: DR aggregators must proactively reduce declared availability in the
    AEMO portal during extended public holiday periods and communicate reduced capacity
    transparently — operating without adjustment risks AEMO forming reserve contracts
    against overstated capacity, as occurred when the VIC portfolio was placed on
    standby on 30 December 2019 despite extremely low baselines.
