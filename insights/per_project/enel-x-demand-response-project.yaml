- record_id: ARENA-DLV-57901
  source_title: EnelX Demand Response Project - Knowledge Sharing Report 1
  publish_date: '2018-03-06'
  project_name: ARENA Demand Response Trial (EnerNOC)
  what_happened: EnerNOC was given only two months between funding confirmation (end
    of September 2017) and program start (1 December 2017) to recruit, contract, commission,
    test, and enrol 50 MW of greenfield demand response customers across NSW and Victoria
    — a timeline described as a significant challenge that required speculative pre-investment.
  lesson_learnt: For future demand response programs, participants should be given
    at least six months' lead time before the required start date — a two-to-three
