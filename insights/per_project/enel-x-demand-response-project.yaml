  what_happened: Customers enrolled in both FCAS and ARENA DR incurred opportunity
    costs from being removed from FCAS markets during RERT reserve contract periods,
    but the annual value of ARENA availability payments was generally judged to outweigh
    these costs, and customers also attributed non-financial value to contributing
    to system reliability.
