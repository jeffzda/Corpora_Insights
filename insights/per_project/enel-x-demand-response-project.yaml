    2019 during the Christmas holiday period, when C&I customer baseline demand was
    extremely low due to reduced operations, rendering meaningful DR delivery difficult
    and a separate RERT contract was dispatched despite this low-baseline environment.
  lesson_learnt: DR aggregators should proactively reduce declared availability in
    the AEMO portal during extended public holiday periods when C&I customer baselines
    drop significantly — failure to do so risks being placed on standby or dispatched
    when actual deliverable capacity is materially lower than the registered reserve
    quantity.
