  source_title: Enel X Demand Response Project - Knowledge Sharing Report 3
  publish_date: 2018-12
  project_name: ARENA Demand Response Trial (Enel X)
  what_happened: Extended public holiday periods created measurable and directionally
    varied impacts on C&I customer baseline demand across VIC and NSW — VIC aggregate
    demand fell approximately 3.8 MW (8%) in the three days preceding the Easter long
    weekend, while NSW aggregate demand rose approximately 3.1 MW (13%) in the same
    period, with the reverse pattern observed in the days following.
