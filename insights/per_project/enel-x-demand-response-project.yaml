- record_id: ARENA-DLV-4569
  source_title: Enel X Demand Response Project – Knowledge Sharing Report 5
  publish_date: 2020-04
  project_name: ARENA Demand Response Trial (Enel X)
  what_happened: Short RERT tender timelines (2–3 months before program start) were
    found to result in participants mobilising fewer MW at higher per-unit cost compared
    to what could be achieved with six months' lead time, limiting the overall effectiveness
    and cost efficiency of the reserve mechanism.
  lesson_learnt: Future strategic reserve or DR program tenders should allow participants
    at least six months' lead time before required availability — shorter lead times
    constrain recruitment, increase per-unit costs, and reduce the total MW that can
    be committed reliably.
