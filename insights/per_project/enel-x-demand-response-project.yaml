  what_happened: Certain prospective customers — including those in fruit growing
    and product manufacturing — were difficult to recruit because of seasonal demand
    fluctuations and high opportunity costs for production interruption, particularly
    in the pre-Christmas period, effectively narrowing the addressable customer pool
    during the initial recruitment window.
  lesson_warnt: When recruiting C&I customers for DR programs, aggregators should
    account for industry-specific seasonal constraints and production cycle peaks
    — sectors such as fruit growing (seasonal harvest) and manufacturing (pre-Christmas
    production runs) have elevated opportunity costs at precisely the times of year
    when DR is most likely to be called.
