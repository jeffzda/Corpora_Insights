  source_title: Enel X Demand Response Project – Knowledge Sharing Report 5
  publish_date: 2020-04
  project_name: ARENA Demand Response Trial (Enel X)
  what_happened: Customers showed a strong preference for firm Availability Payments
    over Energy-only payments during contract negotiations, citing the need for predictable,
    'bankable' revenue rather than dependence on infrequent grid emergency dispatch
    events.
  lesson_learnt: Structure DR contracts to offer firm Availability Payments as the
    primary incentive — C&I customers are more willing to commit and remain enrolled
    when revenue is predictable rather than contingent on infrequent emergency dispatch
    events.
