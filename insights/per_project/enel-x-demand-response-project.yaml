- record_id: ARENA-DLV-9128
  source_title: State of DER Technology Integration Report
  publish_date: 2021-02
  project_name: Enel X Demand Response Project
  what_happened: Following project completion, the shift from ARENA/government-funded
    RERT availability payments to a short-notice RERT model offering only energy payments
    (no availability payments) was identified as a key constraint on customer willingness
    to continue participating in demand response, as the majority of customers prefer
    revenue certainty.
  lesson_farnt: Demand response participation depends critically on revenue certainty
    — programmes that transition from guaranteed availability payments to energy-only
    payments when subsidies end will likely see significant customer attrition, and
    BAU business models must include a reliable revenue stream to sustain large commercial
    and industrial portfolios.
  lesson_learnt: Demand response programmes transitioning from subsidy-funded availability
    payments to energy-only payments face significant customer retention challenges
    — programme designers should model the post-subsidy revenue profile explicitly
    and test whether it provides sufficient certainty to retain the portfolio before
    committing to the programme structure.
