  what_happened: C&I customers with highly volatile load profiles (e.g. a metals recycling
    plant whose consumption ranged from 50 kW to 5 MW depending on shredder operations)
    found that their RERT DR results were highly sensitive to the timing of event
    activation relative to their load cycle, with the baseline methodology producing
    results up to 33% lower than actual load reduction in unfavourable timing scenarios.
  lesson_learnt: Customers with intermittent or highly variable load profiles are
    poorly served by fixed-window adjusted baseline methodologies — screen these customers
    carefully before enrolment and either exclude them from programs with punitive
    baseline rules or develop alternative measurement protocols that better reflect
    their actual flexibility contribution.
