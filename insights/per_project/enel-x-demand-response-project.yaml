  project_name: ARENA Demand Response Trial (EnerNOC)
  what_happened: EnerNOC noted that all participants in the ARENA trial with commitments
    exceeding 12 MW in any single year were large established retailers (apart from
    EnerNOC itself), suggesting that customer acquisition capability — specifically
    existing commercial relationships with large energy users — is a primary determinant
    of the scale of DR commitment an aggregator can make.
  lesson_learnt: Program designers seeking large-scale DR commitments should recognise
    that customer acquisition is the primary bottleneck for independent aggregators
    — established retailers have a structural advantage due to pre-existing commercial
    relationships, and policy mechanisms that support independent aggregators' market
    access (such as FCAS unbundling) are material enablers of DR supply at scale.
