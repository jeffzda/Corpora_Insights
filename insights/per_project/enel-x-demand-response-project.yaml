  source_title: Enel X Demand Response Project – Knowledge Sharing Report 5
  publish_date: 2020-04
  project_name: ARENA Demand Response Trial (Enel X)
  what_happened: DR portfolio performance in the 2018 NSW winter test fell below 100%
    of target, largely because the portfolio was over-reliant on temperature-sensitive
    HVAC loads whose baseline demand was lower during mild autumn temperatures.
  lesson_learnt: Diversify DR portfolios away from temperature-sensitive loads (e.g.
    HVAC) to ensure reliable performance year-round — include non-seasonal industrial
    customers such as 24/7 manufacturing sites to maintain aggregate capacity in non-summer
    months.
