  what_happened: Industrial customers such as meat processors and flourmills increased
    production — and therefore energy consumption — in the weeks leading up to Christmas
    and Easter to meet delivery obligations, creating elevated baselines just before
    the shutdown period but making DR unavailable due to commercial priorities during
    the same window.
