  what_happened: Program parameters including the maximum 4-hour curtailment duration,
    10-minute response time requirement, and the dynamic baseline and adjustment rules
    made participation unviable for some potential customers, particularly those with
    intermittent or unpredictable load profiles — reducing the available pool of recruitable
    capacity.
  lesson_learnt: Future demand response program designs should consider tiered or
    flexible participation parameters to avoid systematically excluding customers
    with intermittent or volatile loads — the 4-hour duration cap, 10-minute response
    requirement, and strict baseline methodology collectively disqualify a significant
    segment of otherwise willing C&I participants.
