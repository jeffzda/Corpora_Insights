  source_title: Enel X Demand Response Project – Knowledge Sharing Report 5
  publish_date: 2020-04
  project_name: ARENA Demand Response Trial (Enel X)
  what_happened: Cold storage and logistics facilities experienced significantly increased
    energy demand in the final week before Christmas due to high customer demand for
    fresh food and produce, but then shifted their 'Christmas shutdown' period to
    start a week later than other industries (commencing around 30 December), resulting
    in lowest demand in the weeks of 30 December and 6 January.
  lesson_learnt: Cold storage and logistics customers have an offset holiday demand
    profile — their peak demand aligns with pre-Christmas food supply requirements
    and their reduced-operations period runs later into January than other industries;
    DR aggregators should account for this sector-specific timing when modelling portfolio
    availability across the holiday period.
