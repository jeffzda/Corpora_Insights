  project_name: ARENA Demand Response Trial (Enel X)
  what_happened: Customers with automated curtailment capability consistently outperformed
    those relying on manual on-site curtailment during DR dispatch and test events.
    However, many customers remained reluctant to accept automated curtailment due
    to operational concerns about ceding load control to an aggregator.
  lesson_learnt: Prioritise enrolment of customers with automated curtailment capability
    — automated sites deliver higher and more reliable DR performance than manual
    sites. Aggregators should proactively work to address customer concerns about
    loss of operational control, as overcoming this barrier is key to achieving firm
    delivery.
