- record_id: ARENA-DLV-45802
  source_title: EnelX Demand Response Project - Knowledge Sharing Report 2
  publish_date: 2018-06
  project_name: ARENA Demand Response Trial (EnerNOC)
  what_happened: EnerNOC was able to commit to and deliver 50 MW of DR capacity largely
    because it had already been recruiting C&I customers for its FCAS program for
    6+ months prior to the ARENA competitive round announcement, providing a 'running
    start' on customer acquisition.
  lesson_learnt: Value-stacking multiple DR services (e.g. FCAS and reliability reserve)
    allows aggregators to build larger DR portfolios at lower unit cost and on tighter
    timelines — program designers should recognise that prior market activity in adjacent
    services significantly reduces mobilisation cost and time, and procurement mechanisms
    should reward this.
