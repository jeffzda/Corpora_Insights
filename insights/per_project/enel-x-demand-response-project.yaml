- record_id: ARENA-DLV-9127
  source_title: State of DER Technology Integration Report
  publish_date: 2021-02
  project_name: Enel X Demand Response Project
  what_happened: The Enel X RERT demand response project identified that the AEMO
    baseline methodology used to measure demand response (high 10 of 10 baseline with
    day-of-adjustment) was punitive for several categories of C&I customer, including
    temperature-sensitive sites, volatile-load sites, and sites that curtailed load
    before the baseline measurement window.
  lesson_learnt: Standard demand response baseline methodologies penalise customers
    with temperature-sensitive, volatile, or proactive load profiles in ways that
    misrepresent their actual contribution — programme designers should review baseline
    methodology for each customer load category before contracting, and advocate for
    baseline reforms that recognise diverse load patterns.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: null
  failure_mode: regulatory & approvals
  outcome_class: knowledge generated despite setback
