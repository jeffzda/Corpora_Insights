  outcome_class: re-scoped/adapted
  secondary_failure_mode: coordination & stakeholders
  intervention_note: EnerNOC redirected recruitment to greenfield DR sites and, separately,
    AEMO later adopted a process of issuing ITTs only in the minutes/hours before
    anticipated activation, minimising the practical impact of the restriction on
    future dual-participation.
