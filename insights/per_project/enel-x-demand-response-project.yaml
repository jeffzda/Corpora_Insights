- record_id: ARENA-DLV-4555
  source_title: Enel X Demand Response Project – Knowledge Sharing Report 5
  publish_date: 2020-04
  project_name: ARENA Demand Response Trial (Enel X)
  what_happened: AEMO's approach to DR participants' capacity declarations during
    public holiday periods created a risk that a punitive response to capacity reductions
    could dis-incentivise transparent reporting and ultimately discourage participation
    in RERT and other DR programs.
  lesson_learnt: Program designers and market operators should adopt a non-punitive
    approach to capacity adjustments around public holidays — encouraging transparent
    availability updates produces more reliable system information than penalising
    participants who accurately declare reduced capacity.
