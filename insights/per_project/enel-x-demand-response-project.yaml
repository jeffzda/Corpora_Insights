- record_id: ARENA-DLV-4568
  source_title: Enel X Demand Response Project – Knowledge Sharing Report 5
  publish_date: 2020-04
  project_name: ARENA Demand Response Trial (Enel X)
  what_happened: When AEMO issued an Invitation to Tender (ITT), Enel X's dual-enrolled
    FCAS/DR customers had to be removed from FCAS markets for the ITT period plus
    an additional four hours prior, creating an opportunity cost for customers but
    also a coordination requirement that had to be managed precisely to protect DR
    baseline measurements.
  lesson_learnt: Aggregators running dual-enrolled FCAS/DR portfolios must establish
    clear, pre-agreed protocols for bidding customers out of FCAS markets ahead of
    DR activation windows — removing customers at least four hours before an ITT window
    protects baseline integrity and prevents FCAS frequency trips from contaminating
    DR performance measurement.
