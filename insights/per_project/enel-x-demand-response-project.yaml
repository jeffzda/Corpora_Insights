  source_title: Enel X Demand Response Project - Knowledge Sharing Report 4
  publish_date: '2019-09-20'
  project_name: ARENA Demand Response Trial (Enel X)
  what_happened: Automated curtailment sites consistently outperformed manual on-site
    curtailment sites across all test and dispatch events. In NSW, automated sites
    delivered 107–119% of target while manual sites delivered 81–94%. In VIC, automated
    sites delivered 103–119% while manual sites delivered 77–83%.
  lesson_learnt: Prioritise automated curtailment over manual on-site curtailment
    when recruiting DR customers — automated sites consistently achieved 107–119%
    of dispatch targets versus 77–94% for manual sites across all events. Advocate
    for automation during customer onboarding and resolve operational concerns before
    program start.
