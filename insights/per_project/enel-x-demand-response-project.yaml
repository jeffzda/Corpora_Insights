  project_name: ARENA Demand Response Trial (EnerNOC)
  what_happened: Prospective customers subject to AusNet Services' Critical Peak Pricing
    (CPP) tariffs could not be enrolled because participating in an ARENA DR event
    risked destroying their baseline adjustment window and causing them to miss AusNet
    CPP events, making them financially worse off overall.
  lesson_learnt: Reliability DR programs should explicitly resolve interactions with
    network CPP tariff structures before customer recruitment begins — where ARENA
    dispatch timing overlaps with network critical peak windows, C&I customers face
    perverse incentives that exclude them from participation, reducing the available
    DR pool in heavily CPP-exposed networks.
