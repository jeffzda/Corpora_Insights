  project_name: ARENA Demand Response Trial (EnerNOC)
  what_happened: A small percentage of EnerNOC's enrolled customers were not credited
    with their full curtailment during testing because their load was already below
    baseline levels during the adjustment window on the day of the test, due to program
    baseline and adjustment rules.
  lesson_learnt: DR aggregators should pre-screen customers for baseline eligibility
    risk — customers whose load naturally falls below baseline levels during the adjustment
    window on high-demand days will fail measurement and verification even if they
    comply operationally, and should either be excluded or their nominations adjusted
    downward.
