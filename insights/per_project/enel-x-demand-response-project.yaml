  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: EnerNOC decided not to pursue dual-enrolled FCAS customers for
    ARENA and instead focused on recruiting greenfield DR sites, thereby avoiding
    the FCAS opportunity cost exposure entirely.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: demand response
