- record_id: ARENA-DLV-45805
  source_title: EnelX Demand Response Project - Knowledge Sharing Report 2
  publish_date: 2018-06
  project_name: ARENA Demand Response Trial (EnerNOC)
  what_happened: AEMO's interpretation of NER 3.20.3(j) determined that any load under
    a RERT reserve contract cannot simultaneously bid into FCAS markets during any
    trading interval covered by the contract, creating material opportunity costs
    for dual-enrolled customers when ITTs were issued.
  lesson_learnt: Program designers and aggregators should clarify upfront with AEMO
    how RERT and FCAS participation will interact under NER 3.20.3(j) — the eligibility
    boundary between reserve and ancillary services DR is not self-evident, and an
    unresolved interpretation can force strategic customer recruitment decisions (greenfield-only
    vs. dual-enrolled) with material cost implications.
  issue_severity: major
  project_type: DER/customer-side
