    maximum event duration, and baseline methodology — directly constrain the addressable
    customer pool. Program designers should assess the trade-off between technical
    firmness requirements and customer eligibility, as overly restrictive parameters
    can exclude viable flexible loads and increase per-MW recruitment costs.
