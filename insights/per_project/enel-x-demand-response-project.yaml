  project_name: ARENA Demand Response Trial (EnerNOC)
  what_happened: EnerNOC identified that ARENA's DR program parameters — specifically
    the 4-hour curtailment duration, 10-minute response time, and dynamic baseline
    and adjustment rules — materially restricted the pool of eligible industries and
    specific customers, excluding those unable to sustain prolonged load reduction
    or with variable pre-event load profiles.
  lesson_learnt: Program designers should model the combined effect of curtailment
    duration, response time, and baseline methodology on the eligible customer pool
    before setting program parameters — parameters that are individually reasonable
    can jointly exclude large segments of the C&I market, reducing competition and
    increasing per-MW cost.
