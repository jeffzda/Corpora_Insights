  project_name: ARENA Demand Response Trial (Enel X)
  what_happened: RERT program parameters — specifically the maximum 4-hour curtailment
    duration, 10-minute response time, and dynamic baseline and adjustment rules —
    excluded potential customers with intermittent or unpredictable load profiles
    from participating, constraining the pool of recruitable capacity.
  lesson_learnt: DR program design parameters such as curtailment duration, response
    time requirements, and baseline methodology directly limit the customer segments
    that can participate — program designers should assess the trade-off between technical
    rigour of these requirements and the size and diversity of the addressable customer
    pool.
