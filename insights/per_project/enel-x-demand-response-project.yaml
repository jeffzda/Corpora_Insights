  project_name: ARENA Demand Response Trial (Enel X)
  what_happened: Diversification into new industry sectors (tertiary education, fruit
    and tree nut growing, retail, product manufacturing) beyond Enel X's prior experience
    helped achieve the 50 MW portfolio target and provided non-seasonal load diversity
    that offset temperature-sensitive cold storage and HVAC customers in winter months.
  lesson_learnt: DR aggregators should actively pursue portfolio diversification across
    industry sectors, including sectors outside their prior experience — non-seasonal
    industrial loads (e.g. 24/7 manufacturing, retail) provide year-round capacity
    that offsets the seasonal variability of HVAC and cold storage customers and reduces
    portfolio concentration risk.
