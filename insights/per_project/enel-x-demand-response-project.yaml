- record_id: ARENA-DLV-57908
  source_title: EnelX Demand Response Project - Knowledge Sharing Report 1
  publish_date: '2018-03-06'
  project_name: ARENA Demand Response Trial (EnerNOC)
  what_happened: A small percentage of EnerNOC's customers, despite providing load
    reduction during DR test intervals, were not credited with their full curtailment
    amount because their load was below baseline levels during the baseline adjustment
    window on the day of testing, an outcome caused by the dynamic baseline and adjustment
    rules.
  lesson_learnt: Aggregators should screen customers for load stability during the
    baseline adjustment window before enrolment — customers whose load is highly variable
    or low in the adjustment window prior to a potential dispatch are at risk of under-measurement
    under dynamic baseline rules, and may not receive credit for genuine curtailment.
  issue_severity: minor
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: technology vendor
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: partial success
  secondary_failure_mode: data & measurement
