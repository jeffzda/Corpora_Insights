  what_happened: RERT procurement tenders running only 2–3 months before program start
    resulted in aggregators mobilising fewer megawatts at higher per-unit cost compared
    to what would be achievable with at least six months' lead time.
  lesson_learnt: RERT and equivalent strategic reserve procurements should provide
    at minimum six months' lead time before the availability period — short tender
    timelines of 2–3 months structurally limit the MW that aggregators can mobilise
    and inflate per-unit costs, reducing the value of the mechanism for both participants
    and the system operator.
