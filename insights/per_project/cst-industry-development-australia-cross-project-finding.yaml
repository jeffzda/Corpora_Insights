- record_id: ARENA-DLV-70555
  source_title: Industry Development Opportunities from Developing Concentrating Solar
    Thermal Power in Australia
  publish_date: 2018-04
  project_name: CST Industry Development — Australia (cross-project finding)
  what_happened: The majority of high-specification turbines used in Australian CST
    projects are imported, with industry experts noting that improving turbine efficiency
    is critical to CST cost-effectiveness. International experience indicates lead
    times of 16–24 months to obtain a turbine from order placement due to limited
    global supply, creating a significant procurement risk for CST project schedules.
  lesson_learnt: Allow 16–24 months lead time when procuring turbines for CST projects
    in Australia — limited global supply of CST-compatible turbines creates significant
    schedule risk if procurement is not initiated well before construction. Explore
    partnerships with turbine manufacturers (e.g. Mitsubishi Hitachi Power Systems)
    early in project development to secure supply and reduce lead times.
