  publish_date: 2018-04
  project_name: CST Industry Development — Australia (cross-project finding)
  what_happened: Due to the high level of customisation required for support structures
    in CST plants, proximity of fabrication firms to project sites was identified
    as a significant advantage that can decrease time to market and transportation
    costs. Specific examples included SA-based Ottoway Fabrication (Whyalla), which
    manufactured wind turbine poles for Hornsdale and was identified as having transferable
    capability to fabricate CST support structures and solar towers for the proposed
    Port Augusta plant, with rail links reducing transport costs.
  lesson_learnt: When procuring fabricated support structures and solar towers for
    CST projects, assess regional fabricators with adjacent renewable energy experience
    (particularly wind farm tower fabrication) before defaulting to distant or international
    suppliers — the high customisation requirement for CST support structures makes
    local supply advantageous in reducing lead time, transport cost and coordination
    complexity.
