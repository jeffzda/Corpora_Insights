    CSIRO and its commercial partners (including Thermal Focus and Mitsubishi Hitachi
    Power Systems) early — Australian-origin heliostat IP exists and has been demonstrated
    in international deployments, providing a pathway to domestic supply that avoids
    full import dependence. International partnerships for commercialisation can help
    scale Australian IP into future global plants.
