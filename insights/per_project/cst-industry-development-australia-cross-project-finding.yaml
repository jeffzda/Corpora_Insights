  what_happened: Patent analysis of CST components revealed that Australian heliostat
    IP activity increased substantially between 2013 and 2016, with CSIRO having commercialised
    heliostat technology into China and Japan. However, the heliostat market in Australia
    remains dominated by Japanese and US applicants, with only a small number of Australian
    organisations (CSIRO, HeliostatSA, Heliosystems, Vast Solar, University of Sydney)
    having lodged IP applications.
