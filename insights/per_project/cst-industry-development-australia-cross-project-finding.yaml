  publish_date: 2018-04
  project_name: CST Industry Development — Australia (cross-project finding)
  what_happened: CST plants demonstrably involve higher proportions of locally sourced
    construction, assembly and operations and maintenance services compared to PV
    solar and wind farms, with local content rates typically around 40–45% attributable
    to local services. Countries pursuing domestic manufacturing capability have set
    higher requirements (Spain achieved 75–80% with subsidies; South Australia set
    60% for the Aurora CST plant; Victoria set 64% for renewables generally).
  lesson_learnt: When structuring CST project procurement and local content commitments,
    recognise that the technology's nature supports higher local content than PV or
    wind — baseline local services content of 40–45% is achievable without specific
    policy intervention, and 60–80% is achievable with targeted domestic manufacturing
    incentives. Set local content targets cooperatively with developers and manufacturers
    to ensure levels are workable and do not become a barrier to project delivery.
