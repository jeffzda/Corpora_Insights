- record_id: ARENA-DLV-70551
  source_title: Industry Development Opportunities from Developing Concentrating Solar
    Thermal Power in Australia
  publish_date: 2018-04
  project_name: CST Industry Development — Australia (cross-project finding)
  what_happened: Developer consultation revealed that grid connection approval for
    CST projects can take over a year to obtain, creating a significant barrier to
    project development. Developers noted this was nonetheless faster than the historical
    two-year average for coal power plant connections, but that changing technology
    expectations were driving demand for shorter lead times.
  lesson_learnt: Budget for grid connection approval timelines exceeding 12 months
    when developing CST projects in Australia. Engage AEMO and the Australian Energy
    Regulator early and advocate for renewable energy hubs with pre-approved grid
    connectivity to reduce this barrier — streamlined hub-based connection processes
    (as demonstrated in Morocco) can materially shorten timelines.
  issue_severity: major
  project_type: generation
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: grid connection/system studies
  failure_mode: regulatory & approvals
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Industry stakeholders called for renewable energy hubs with streamlined
    grid connectivity processes, citing Morocco's five designated solar sites as a
    model where companies can bid for space and access pre-approved connections.
  transferability: broad
  delay_magnitude: 1–3 years
  technology_domain: solar thermal
  source_pages: &id001
  - 19
  evidence_excerpt: Consultation with developers revealed that the grid connection
    approval process needs to be expedited, indicating that it can take over a year
    to obtain approval.
