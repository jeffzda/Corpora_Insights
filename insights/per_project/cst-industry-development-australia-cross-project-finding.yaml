  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: CSIRO has an existing partnership with Mitsubishi Hitachi Power
    Systems through a CST farm in Yokohama, Japan, which the report identifies as
    a potential pathway to securing turbine supply.
  transferability: moderate
  delay_magnitude: 1–3 years
  technology_domain: solar thermal
  source_pages: &id005
