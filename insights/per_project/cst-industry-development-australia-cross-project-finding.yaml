- record_id: ARENA-DLV-70556
  source_title: Industry Development Opportunities from Developing Concentrating Solar
    Thermal Power in Australia
  publish_date: 2018-04
  project_name: CST Industry Development — Australia (cross-project finding)
  what_happened: The majority of high-specification pumps required for CST thermal
    conversion systems in Australia are imported, with no established domestic manufacturing
    capability for the highest-specification equipment. This creates a supply chain
    dependency that increases cost and schedule risk for CST projects.
  lesson_learnt: Identify imported pump specifications early in CST project design
    and initiate procurement well ahead of construction — no domestic manufacturing
    capability exists for high-tech CST pumps in Australia. Consider whether Australian
    firms with adjacent capabilities (e.g. Dynapumps, Union Hydraulics) can meet specifications,
    as local supply reduces transport costs and schedule risk.
