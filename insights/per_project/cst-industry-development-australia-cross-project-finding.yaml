  publish_date: 2018-04
  project_name: CST Industry Development — Australia (cross-project finding)
  what_happened: Development approval processes for CST projects were delayed at local
    government level due to insufficient awareness of CST technology among councils.
    Specific examples cited included land approval delays caused by council questions
    about potential hazards from glare and bird mortality.
  lesson_learnt: Proactively engage local government councils before lodging development
    approval applications for CST projects — councils lack familiarity with CST-specific
    hazards (glare, bird mortality, habitat loss, water use) and may impose delays
    while seeking information. Pre-application briefings and environmental assessment
    guidance materials can reduce this friction.
