  what_happened: Under the base-case scenario, CST deployment in Australia was not
    expected to begin until 2031 — more than 13 years after the time of study — because
    existing policies and initiatives were insufficient to bring forward investment.
    Under the 'No Regrets' scenario, earlier and larger investments from 2022 onwards
    would generate substantially greater economic and employment outcomes, with national
    CAPEX of $9.231B versus $5.012B in the base case.
  lesson_learnt: 'Policy inaction on CST in Australia carries a quantifiable opportunity
    cost: under base-case policy settings, the market entry date is 2031 versus 2022
    under proactive investment, forgoing approximately $4.2B in additional CAPEX and
    approximately 9,400 additional direct FTE person-years of employment nationally.
    ARENA and government co-investment in early CST projects can bring forward market
    entry and generate significantly larger economic returns.'
