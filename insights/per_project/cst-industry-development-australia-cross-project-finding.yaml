  source_title: Industry Development Opportunities from Developing Concentrating Solar
    Thermal Power in Australia
  publish_date: 2018-04
  project_name: CST Industry Development — Australia (cross-project finding)
  what_happened: CST turbines face unique operational demands — unlike conventional
    turbines, they must withstand frequent load variations, start-ups and shut-downs,
    requiring effective part-load and transient operation capability and short start-up
    times to minimise plant downtime. Improving turbine efficiency was identified
    by CST plant developers as critical to improving overall CST cost-effectiveness.
  lesson_learnt: When specifying turbines for CST projects, do not assume conventional
    turbine specifications are adequate — CST turbines require specific part-load
    performance, transient operation capability and short start-up times that conventional
    turbines may not provide. Include these operational requirements explicitly in
    procurement specifications and engage turbine manufacturers with CST-specific
    experience (e.g. Siemens, Mitsubishi Hitachi Power Systems) during design.
