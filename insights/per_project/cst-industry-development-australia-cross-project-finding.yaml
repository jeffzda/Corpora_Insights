  what_happened: Industry consultation identified shortfalls in required certifications
    among tradespeople needed for major CST projects. The cost of obtaining specialised
    certifications was identified as a barrier to engaging particular groups such
    as electricians, limiting the available skilled workforce for CST construction.
  lesson_learnt: Plan for certification gaps in the tradesperson workforce when scoping
    CST construction labour — the cost burden of specialised certifications acts as
    a participation barrier, particularly for electricians. Budget for upskilling
    support or incorporate certification costs into labour planning, and engage with
    SERREE or similar bodies that have training providers in their network.
