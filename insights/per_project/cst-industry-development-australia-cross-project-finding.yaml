  what_happened: The Upper Spencer Gulf / Iron Triangle region of South Australia
    was identified as having exceptional enabling conditions for a renewable energy
    hub, including existing transmission infrastructure (from the former coal power
    station), reverse brain drain potential from skilled former power station workers,
    university upskilling infrastructure, port development potential, steel manufacturing
    (Liberty OneSteel), and an operational rail network connecting the region nationally.
  lesson_learnt: When siting CST plants or renewable energy hubs, prioritise locations
    with existing transmission infrastructure, transferable skilled workforce and
    manufacturing capability — the Upper Spencer Gulf region demonstrates that former
    coal power station sites can offer multiple co-location advantages (grid connection,
    skills, fabrication, materials, transport) that significantly reduce greenfield
    development costs and risks compared to new-site development.
