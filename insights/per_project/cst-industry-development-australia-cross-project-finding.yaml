- record_id: ARENA-DLV-70554
  source_title: Industry Development Opportunities from Developing Concentrating Solar
    Thermal Power in Australia
  publish_date: 2018-04
  project_name: CST Industry Development — Australia (cross-project finding)
  what_happened: Industry consultation identified that CST projects in regional areas
    face competition from high-paying industries such as LNG when recruiting skilled
    workers. Specific skills in short supply included experienced pressure welders
    and workers with experience in power station operations, turbines, specialised
    fabrication, mechanical and structural design, thermal expertise and project management.
  lesson_learnt: When recruiting for CST construction in regional areas, anticipate
    wage competition from LNG and resources sectors for pressure welders, power station
    operators, turbine specialists and project managers. Establish secondment programs
    with international CST firms or domestic analogues early in project development
    to build this capability ahead of construction mobilisation.
