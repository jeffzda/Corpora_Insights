- record_id: ARENA-DLV-50019
  source_title: Ocean Energy Report by Seanergy and Ernst and Young
  publish_date: 2016-06
  project_name: Ocean Energy Technologies — Tidal Range Environmental Opposition
  what_happened: Tidal range technologies, despite being the only commercially mature
    ocean energy technology (0.5 GW installed globally), face strong opposition for
    their environmental and visual impacts because they consist of large dams installed
    across bays. This opposition has constrained further development of the technology
    globally.
  lesson_learnt: Tidal range projects must plan for significant community and environmental
    opposition from the outset; the technology's maturity advantage over other ocean
    energy types does not reduce the environmental acceptability challenge, and developers
    should invest heavily in environmental assessment and stakeholder engagement before
    committing to project development.
