- record_id: ARENA-DLV-9902
  source_title: High Quality Laser Doping For Solar Cells Final Report
  publish_date: null
  project_name: Local doping using Laser Chemical Processing technology for advanced
    silicon solar cells
  what_happened: The project successfully developed two new measurement techniques
    — SEMDCI dopant imaging and a photoluminescence-based electronic quality assessment
    combined with the open-source Quokka computer model — that together enabled rapid,
    accurate characterisation of laser doped regions on small samples. Using this
    measurement toolbox, solar cells with efficiencies of nearly 21% were fabricated
    using a novel alumina-film laser doping process, exceeding the efficiency of most
    commercially manufactured solar cells at the time.
  lesson_learnt: Combining complementary characterisation techniques (imaging-based
    dopant mapping and photoluminescence-based electronic quality assessment) with
    a fast, freely available simulation model allows many process variable combinations
    to be evaluated on a single small wafer, dramatically accelerating laser doping
    optimisation. Future solar PV research projects developing novel doping or contact
    processes should invest early in building a multi-technique measurement toolbox
    rather than relying on a single characterisation method.
  issue_severity: none
  project_type: manufacturing/supply chain
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: no material delay stated
  failure_mode: no major failure stated
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id002
