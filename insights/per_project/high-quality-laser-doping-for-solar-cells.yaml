- record_id: ARENA-DLV-9901
  source_title: High Quality Laser Doping For Solar Cells Final Report
  publish_date: null
  project_name: Local doping using Laser Chemical Processing technology for advanced
    silicon solar cells
  what_happened: The Secondary Electron Microscopy Dopant Contrast Imaging (SEMDCI)
    technique developed in the project was found to be incapable of producing quantitative
    dopant concentration maps for n-type doped samples. No consistent relationship
    between image contrast and dopant concentration could be established for n-type
    dopants across any of the microscope settings investigated, suggesting a fundamental
    physical limitation rather than a process optimisation problem.
  lesson_learnt: SEMDCI dopant contrast imaging cannot be used to produce quantitative
    dopant density maps for n-type doped regions — the technique is likely fundamentally
    limited to p-type samples. Future projects relying on SEMDCI for n-type laser
    doping characterisation should anticipate this constraint and plan alternative
    measurement approaches from the outset.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: For p-type dopants, the contrast–concentration relationship was
    successfully established using ECV profiling as a calibration reference, confirming
    the technique is valid for p-type applications.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
