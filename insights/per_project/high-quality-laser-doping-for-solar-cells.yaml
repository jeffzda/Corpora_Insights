  evidence_excerpt: For n type dopants, the same process was followed. However, in
    this case, such a relationship could not be established... The evidence we have
    suggests that it is fundamentally not possible to arrive at a relationship between
    dopant contrast and concentration for n type dopants.
  confidence_note: delay_category set to data/validation/testing as the limitation
