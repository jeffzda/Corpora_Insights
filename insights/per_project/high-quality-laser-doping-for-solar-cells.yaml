  evidence_excerpt: Only small areas are required for each set of process variables,
    so many process variables can be tested and measured on a single sample... In
    total, 35 different combinations of process variables were trialled on the one
    wafer... This allowed us to quickly reach solar cell efficiencies above 20% -
    above the efficiency of many commercially made solar cells.
