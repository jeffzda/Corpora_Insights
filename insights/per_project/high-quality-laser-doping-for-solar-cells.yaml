- record_id: ARENA-DLV-9903
  source_title: High Quality Laser Doping For Solar Cells Final Report
  publish_date: null
  project_name: Local doping using Laser Chemical Processing technology for advanced
    silicon solar cells
  what_happened: Prior to this project, reliable characterisation of laser doped regions
    was constrained by the need for large-area samples and expensive commercial simulation
    software, making rapid iteration across process variables impractical. The Quokka
    computer model developed in this project replicated the accuracy of commercial
    packages at a fraction of the time and cost, and was made freely available via
    the PV Lighthouse website.
  lesson_learnt: Releasing simulation tools as open-source or freely available software
    significantly amplifies the impact of R&D investments — Quokka was subsequently
    adopted by research organisations and solar manufacturers globally to optimise
    cell technologies, extending the project's benefit well beyond its original scope.
    Future research projects developing modelling tools should consider open-access
    release as a standard dissemination strategy.
  issue_severity: none
  project_type: manufacturing/supply chain
  project_scale_band: lab/bench
  lifecycle_phase: close-out/post-project review
  proponent_type: research organisation/university
