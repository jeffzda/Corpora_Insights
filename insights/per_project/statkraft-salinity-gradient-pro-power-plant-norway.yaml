- record_id: ARENA-DLV-50003
  source_title: Ocean Energy Report by Seanergy and Ernst and Young
  publish_date: 2016-06
  project_name: Statkraft Salinity Gradient PRO Power Plant, Norway
  what_happened: Statkraft operated the world's first salinity gradient power generation
    plant using pressure-related osmosis (PRO technology) with a 10 kW capacity from
    2009, but discontinued it in 2014 due to a lack of long-term financial support
    mechanisms.
  lesson_learnt: Pilot projects for novel renewable technologies require secured long-term
    financial support mechanisms before construction, not just initial grant funding;
    absence of a post-demonstration revenue pathway or ongoing subsidy will lead to
    premature discontinuation even when the technology performs adequately.
