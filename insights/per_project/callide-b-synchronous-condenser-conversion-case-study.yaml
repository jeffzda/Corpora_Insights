- record_id: ARENA-DLV-50959
  source_title: Repurposing Existing Generators as Synchronous Condensers
  publish_date: 2023-06
  project_name: Callide B Synchronous Condenser Conversion (Case Study)
  what_happened: Callide B (two 350 MW Hitachi coal units, commissioned 1988, approaching
    end of life) was assessed for synchronous condenser conversion involving turbine
    disconnection, flywheel installation, new starting mechanism, new excitation system,
    and thrust bearing. The entire conversion process was estimated to take 2–3 years
    and cost more than AUD $30M per unit, with the excitation system alone requiring
    full replacement due to the legacy 1988 system having no OEM support and scarce
    spare parts.
  lesson_learnt: For coal-fired generators approaching end of design life, the combination
    of foundation works, flywheel installation, and replacement of unsupported legacy
    secondary systems (excitation, controls) will likely push conversion costs to
    or above AUD $30M per unit and timelines to 2–3 years — site-specific condition
    assessment is essential before cost estimates are relied upon.
