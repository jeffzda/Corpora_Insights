- record_id: ARENA-DLV-50979
  source_title: Repurposing Existing Generators as Synchronous Condensers
  publish_date: 2023-06
  project_name: Callide B Synchronous Condenser Conversion (Case Study)
  what_happened: The Callide B excitation system was the original 1988 installation,
    no longer supported by the OEM and with scarce spare parts — requiring complete
    replacement for any conversion project, at an estimated cost of AUD $2–2.5M for
    a new system. By contrast, the generator stator and rotor were rewound in 2010,
    likely extending their serviceable life and potentially avoiding a costly rewind
    (>AUD $20M if required).
  lesson_learnt: When assessing legacy coal plant for synchronous condenser conversion,
    the condition and supportability of secondary systems — particularly excitation
    systems — is as important as primary plant condition; unsupported legacy excitation
    systems are a near-certain replacement cost that must be budgeted, while recent
    primary plant refurbishments (e.g., stator rewinds) can materially reduce conversion
    costs.
  issue_severity: moderate
