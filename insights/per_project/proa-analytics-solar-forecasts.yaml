- record_id: ARENA-DLV-54560
  source_title: Pro Analytics Final Report and Cost Benefit Analysis
  publish_date: 2021-01
  project_name: Innovative Optimally Combined Solar Forecasts
  what_happened: On clear, low-variability days, forecasting errors could be reduced
    by 30–40% by correcting for morning and evening generation ramps — a benefit achievable
    without satellite or skycam imagery, demonstrating that ramp-correction algorithms
    are the dominant accuracy lever on cloud-free days.
  lesson_learnt: Implement ramp-correction algorithms targeting morning and evening
    generation profiles as a baseline accuracy improvement for clear-sky days; this
    delivers 30–40% error reduction without any hardware investment and should be
    a standard component of any solar self-forecasting system.
