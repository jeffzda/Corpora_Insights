  project_name: Innovative Optimally Combined Solar Forecasts
  what_happened: The cost-benefit analysis showed that the live data + satellite +
    skycam combination delivered the highest NPV across all solar farm sizes from
    30 to 240 MW under current FCAS pricing, despite higher capex and opex, with skycam
    equipment and installation representing approximately 40% of total cost over a
    3-year period.
  lesson_learnt: For solar farms operating under current NEM FCAS pricing, the live
    data + satellite + skycam combination offers the best financial return despite
    higher upfront costs; the business case improves further over longer asset life
    because skycam capex is amortised over a 10+ year instrument design life.
