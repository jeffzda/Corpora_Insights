- record_id: ARENA-DLV-14803
  source_title: 'Proa Analytics Solar Farm Short Term Forecasting Project: Lessons
    Learnt 1'
  publish_date: 2019-10
  project_name: Proa Analytics Solar Farm Short Term Forecasting Project
  what_happened: AEMO's self-forecast assessment procedure requires that 80% or more
    of dispatch intervals (DIs) during the assessment period be 'included'; DIs are
    excluded when a solar farm is network-constrained or when spot prices fall below
    the farm's offer price, meaning farms in high-constraint or negative-price environments
    may be unable to pass assessment regardless of forecast accuracy.
  lesson_learnt: When selecting sites for self-forecast demonstration, prioritise
    solar farms with low frequency of network constraints and negative spot prices
    — high exclusion rates under AEMO's 80% eligibility criterion can prevent assessment
    entirely, even if forecasts are technically superior to AWEFS/ASEFS.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: approvals/contracting
  proponent_type: technology vendor
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: 'Proa proposed two regulatory fixes to AEMO: replacing the percentage-based
    eligibility criterion with a fixed minimum number of DIs, and enabling submission
    of Possible Power values via the self-forecast API to restore excluded DIs to
    assessment eligibility.'
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id002
  - 4
  - 5
  evidence_excerpt: Frequent network constraints or negative NEM spot prices may make
    it difficult or impossible to pass the AEMO self-forecast assessment process,
    even if the self-forecast accuracy is greater than AWEFS/ASEFS.
  confidence_note: lifecycle_phase assigned as approvals/contracting because the barrier
