- record_id: ARENA-DLV-14804
  source_title: 'Proa Analytics Solar Farm Short Term Forecasting Project: Lessons
    Learnt 1'
  publish_date: 2019-10
  project_name: Proa Analytics Solar Farm Short Term Forecasting Project
  what_happened: Self-forecasting providers lacked real-time access to AEMO's Intermittent_DS
    data tables (INTERMITTENT_DS_RUN, INTERMITTENT_DS_PRED, INTERMITTENT_FORECAST_TRK)
    during the assessment day; only the Registered Market Participant could access
    current-day values via the EMMS portal, but sharing EMMS credentials was impractical
    due to confidential market information in that portal.
  lesson_learnt: Forecasting projects relying on real-time AEMO data feeds should
    identify data-access constraints before design, and advocate for AEMO to provide
    a separate secure data feed for current-day Intermittent_DS reports to forecasting
    providers, enabling same-day forecast validation rather than next-day-only review.
  issue_severity: minor
