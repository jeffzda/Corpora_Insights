- record_id: ARENA-DLV-30702
  source_title: 'Proa Analytics Solar Farm Short Term Forecasting Project: Lessons
    Learnt 3'
  publish_date: 2020-10
  project_name: Innovative Optimally Combined Solar Forecasts
  what_happened: Cloud dynamics modelling proved to be the dominant source of uncertainty
    in solar generation forecasts, capable of reducing power output by 80–90% and
    causing large ramps within minutes. Entry-level self-forecasting models that ignore
    cloud dynamics showed limited improvement potential, while more complex cloud-aware
    models (using skycam, satellite, and NWP data) introduced new challenges around
    calibration, computing time, and deployment risk.
  lesson_learnt: Developers of solar self-forecasting systems should invest in cloud
    dynamics modelling to unlock material accuracy gains, but must budget for fine
    calibration, algorithm optimisation to manage compute latency at 5-minute horizons,
    and additional testing to handle the higher risk of unexpected model behaviour
    in deployment.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: data & measurement
  intervention_note: Further development and optimisation of algorithms was undertaken
    to reduce computing time and maintain forecast accuracy at short time frames.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id005
  - 3
  - 4
  evidence_excerpt: 'Clouds are the main source of uncertainty and are responsible
    for the greatest errors in solar generation forecasts... their complexity has
    presented additional challenges: First, the sensitivity of the forecasts to inaccuracies
    in intermediate modelling steps... Second, more complex models require increased
    computing time which can negatively impact forecast accuracy, especially at short
    time frames such as 5 minutes ahead... Third, they require additional testing
    and monitoring to handle the increased risk of unexpected outcomes in the deployment
    process.'
  confidence_note: delay_category data/validation/testing applied as the main friction
    was in calibration and testing of complex models during development.
