  secondary_failure_mode: poor scoping
  intervention_note: Proa identified a workaround whereby the Registered Market Participant
    could forward the relevant EMMS portal data manually, but noted this was cumbersome
    and proposed AEMO publish the data via a separate secure feed.
  transferability: moderate
  delay_magnitude: not quantified
