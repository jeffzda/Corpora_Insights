- record_id: ARENA-DLV-30703
  source_title: 'Proa Analytics Solar Farm Short Term Forecasting Project: Lessons
    Learnt 3'
  publish_date: 2020-10
  project_name: Innovative Optimally Combined Solar Forecasts
  what_happened: Soiling of skycams from dust and bird droppings degraded forecasting
    accuracy, and periodic manual cleaning by O&M staff was insufficient to maintain
    instrument quality due to personnel availability, cost, and access constraints.
    Proa designed and installed an automatic self-cleaning system (ACS) using pressurised
    water that successfully removed dust and atmospheric contaminants but still required
    manual intervention for bird droppings, prompting an extension of the ACS to include
    active wildlife deterrence.
  lesson_learnt: When installing skycam systems at solar farms for forecasting purposes,
    plan for regular lens cleaning from the outset — install safe anchor points, permanent
    ladders, or equivalent access infrastructure to make cleaning practical and cost-effective,
    particularly at remote, arid sites where dust accumulation is rapid.
