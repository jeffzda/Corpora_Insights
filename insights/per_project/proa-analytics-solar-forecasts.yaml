  what_happened: Early adopters of self-forecasting were able to reduce their Market
    Participant Factor (MPF) to near zero by applying artificial corrections to self-forecasts
    designed to minimise MPF, a benefit that is expected to diminish as more participants
    adopt the same approach and market conditions mature.
  lesson_learnt: Early adoption of self-forecasting in the NEM provides a first-mover
    advantage through MPF optimisation beyond forecast accuracy alone; however, project
    developers should base long-term financial modelling on accuracy-driven FCAS reductions
    of 20–30% rather than the 70–100% achievable in current market conditions.
