  project_name: Proa Analytics Solar Forecasts Project
  what_happened: 'Satellite imagery (Himawari-8) used for 5-minute-ahead solar forecasts
    was found to have significant limitations: images could be more than 15 minutes
    old when used, and the solar farm footprint was represented by only 2–5 pixels,
    reducing accuracy for local cloud structures. Skycam imagery installed on-site
    delivered images in seconds with 10–20 times greater spatial resolution for nearby
    clouds.'
  lesson_learnt: For very short-term solar forecasting (5 minutes ahead), on-site
    skycam systems are significantly superior to satellite imagery due to near-real-time
    data transfer and much higher local spatial resolution; projects targeting NEM
    dispatch self-forecasting accuracy should plan to install skycams at participating
    solar farms.
