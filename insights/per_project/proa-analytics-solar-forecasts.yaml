  source_title: Pro Analytics Final Report and Cost Benefit Analysis
  publish_date: 2021-01
  project_name: Innovative Optimally Combined Solar Forecasts
  what_happened: FCAS causer-pays charges for NEM semi-scheduled solar farms without
    self-forecasting averaged approximately $1M per 100 MW per year in 2019, declining
    to $650k per 100 MW per year in 2020, with the decline driven largely by widespread
    adoption of self-forecasting and commissioning of BESS regulation services rather
    than by any single project.
  lesson_learnt: The financial case for self-forecasting at NEM solar farms is anchored
    primarily in avoided FCAS causer-pays charges, not incremental energy market revenue;
    project developers should size the forecasting investment against FCAS exposure,
    and should act before market-wide adoption further compresses available savings.
