  source_title: 'Proa Analytics Solar Farm Short Term Forecasting Project: Lessons
    Learnt 3'
  publish_date: 2020-10
  project_name: Innovative Optimally Combined Solar Forecasts
  what_happened: The project demonstrated that Causer Pays Factor (MPF) calculations
    can be replicated using publicly available AEMO data, and that self-forecast corrections
    based on market factors can minimise a participant's MPF — provided the self-forecast
    still outperforms ASEFS in MAE and RMSE.
  lesson_learnt: Solar farm operators should replicate the Causer Pays Factor procedure
    using public AEMO data and apply market-factor corrections to self-forecasts to
    minimise MPF liability; however, the self-forecast must still outperform ASEFS
    on MAE and RMSE to be eligible for use in dispatch.
