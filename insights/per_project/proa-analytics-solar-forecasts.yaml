- record_id: ARENA-DLV-14802
  source_title: 'Proa Analytics Solar Farm Short Term Forecasting Project: Lessons
    Learnt 1'
  publish_date: 2019-10
  project_name: Proa Analytics Solar Farm Short Term Forecasting Project
  what_happened: Under AEMO's self-forecast registration process, only the officially
    registered market participant is permitted to complete most registration tasks,
    including resetting the EMMS API password every 90 days, creating coordination
    overhead and potential delays when the forecasting provider needs a password reset
    but cannot action it directly.
  lesson_learnt: When engaging an independent self-forecasting provider, solar farm
    operators should establish a clear password renewal protocol well ahead of the
    90-day expiry threshold; until AEMO's API-based self-service reset is available,
    this administrative dependency is a material operational risk that increases costs
    and can disrupt forecast submissions.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: commissioning/integration
  failure_mode: coordination & stakeholders
  outcome_class: delayed but recoverable
  secondary_failure_mode: regulatory & approvals
  intervention_note: AEMO was developing an API-based password reset capability for
    self-forecasters at the time of reporting, expected to eliminate the manual renewal
    process and its associated overhead.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages:
  - 3
  - 4
  - 6
  evidence_excerpt: Such passwords expire automatically every 90 days and need to
    be manually reset before this time, otherwise any self-forecast submission will
    be automatically rejected by AEMO systems... Such a process had a significant
    overhead in communication and administration, as well as creating risk that a
    key person would be unavailable at a critical time.
