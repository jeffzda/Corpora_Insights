- record_id: ARENA-DLV-15814
  source_title: Evaluation of ARENA's Impact and Effectiveness
  publish_date: 2019-11
  project_name: ARENA Large-Scale Solar (LSS) Competitive Round — supply chain development
  what_happened: ARENA's LSS Competitive Round successfully expanded the number of accredited large-scale solar PV developers from 12 prior to the round to 30 post-round (a ~2.5x increase). Registered installed
    capacity grew from approximately 69 MW prior to the round to 2,011 MW after, and the commercialisation of large-scale solar was advanced by an estimated five years relative to pre-ARENA projections.
  lesson_learnt: A competitive funding round with defined merit criteria and a knowledge-sharing requirement can accelerate supply chain maturation at sector scale — the LSS model demonstrates that structured
    competition with shared learnings is more effective at building market depth than equivalent funding distributed through ad hoc projects.
