- record_id: ARENA-DLV-35459
  source_title: Fulcrum3D Wind Forecasting for the NEM Lessons Learnt 2
  publish_date: 2020-04
  project_name: 'Fulcrum3D: Wind Forecasting for the NEM'
  what_happened: Analysis found that the business case for using self-forecasts to
    support FCAS participation or export control was not strong under prevailing market
    conditions, as spot energy prices were generally significantly higher than FCAS
    service prices. However, the South Australian islanding event demonstrated that
    generators without FCAS capability collectively paid more for FCAS than the market
    value of their energy during the event, while Hornsdale wind farms — the only
    renewable FCAS providers in SA — captured significant windfall revenue.
  lesson_learnt: The commercial case for FCAS participation capability is currently
    marginal for most generators but is tail-risk significant — extreme events like
    the SA islanding episode can result in generators paying more for FCAS than they
    earn from energy. Wind and solar farms should assess their FCAS exposure and develop
    at least partial mitigation strategies rather than leaving themselves exposed
    to low-probability but high-cost events.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
