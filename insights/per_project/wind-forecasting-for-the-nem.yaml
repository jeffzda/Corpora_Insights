- record_id: ARENA-DLV-61306
  source_title: Fulcrum3D Wind Forecasting For the NEM Final Report
  publish_date: '2021-02-15'
  project_name: Fulcrum3D Wind Forecasting for the NEM
  what_happened: Unexpected Causer Pays charges were observed when generation caps
    were lifted because some plant control systems could not ramp fast enough to meet
    the new dispatch target within a single dispatch period, and the NEM Dispatch
    Engine does not account for plant ramp rate limitations.
  lesson_learnt: Generators should assess their plant's ramp rate capability against
    the rate assumed by the dispatch engine before deploying self-forecasting; if
    ramp rate is insufficient to meet a new dispatch target in one period after a
    cap is lifted, Causer Pays charges will be incurred that cannot be avoided by
    accurate forecasting alone.
  issue_severity: minor
