- record_id: ARENA-DLV-35453
  source_title: Fulcrum3D Wind Forecasting for the NEM Lessons Learnt 2
  publish_date: 2020-04
  project_name: 'Fulcrum3D: Wind Forecasting for the NEM'
  what_happened: Pacific Hydro developed a remote SCADA access system (GOS — Global
    Operating System), which Fulcrum3D began using at Clements Gap and Taralga to
    query wind farm SCADA from off-site servers. This eliminated the need for on-site
    data loggers and reduced points of failure.
  lesson_learnt: Remote SCADA access systems (such as a centralised GOS) significantly
    streamline wind farm self-forecasting by removing on-site hardware requirements,
    reducing cost, and lowering system complexity — wind farm operators and forecasting
    providers should explore this architecture early in integration design.
