  what_happened: A rounding feature in AEMO's dispatch engine rounds the dispatch
    target down to the nearest MW, making it impossible to forecast accurately when
    a plant is operating at full capacity, and generating unexpected Causer Pays charges
    in those intervals.
  lesson_learnt: Account for AEMO's dispatch engine rounding behaviour (capacity rounded
    down to nearest MW) when designing and evaluating forecast accuracy metrics —
    full-capacity operating periods will produce systematic forecast errors that cannot
    be resolved through model tuning alone; escalate to AEMO as a system design issue.
