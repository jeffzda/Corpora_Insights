  source_title: Fulcrum3D Wind Forecasting for the NEM Lessons Learnt 3
  publish_date: 2021-01
  project_name: 'Fulcrum3D: Wind Forecasting for the NEM'
  what_happened: The remote SCADA access system (GOS/Global Operating System) used
    by Pacific Hydro at Taralga did not have sufficient availability for real-time
    forecasting applications, and implementation of the Crowlands GOS was delayed,
    forcing the team to re-explore onsite logger options.
  lesson_learnt: Cloud-based SCADA monitoring systems not designed for real-time controls
    should not be relied upon for real-time forecasting applications; onsite polling
    of SCADA data via dedicated hardware is the more reliable option when remote SCADA
    availability cannot be guaranteed.
