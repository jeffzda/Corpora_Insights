- record_id: ARENA-DLV-35451
  source_title: Fulcrum3D Wind Forecasting for the NEM Lessons Learnt 2
  publish_date: 2020-04
  project_name: 'Fulcrum3D: Wind Forecasting for the NEM'
  what_happened: The MP5F API registration process continued to change as AEMO refined
    its processes, and regular expiration of API passwords created operational disruptions.
    No automated or semi-automated system for resetting passwords was in place, requiring
    manual intervention and reducing operational efficiency.
  lesson_learnt: When connecting to the AEMO MP5F API, ensure the DUID market participant
    is actively engaged and up to date with the API protocol from the outset — routing
    communications through a participant unfamiliar with recent MP5F developments
    adds delay. Verify current API specifications against any prior connection experience,
    as protocols may have changed.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: technology vendor
  delay_category: commissioning/integration
  failure_mode: unvalidated integration
  outcome_class: delayed but recoverable
  secondary_failure_mode: execution & logistics
  intervention_note: AEMO was engaged and understood to be working on an improved
    password management system; project team continued operations while awaiting resolution.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: wind
  source_pages:
  - 2
  evidence_excerpt: 'Connection to the MP5F API took longer than expected because:
    Formal communications with AEMO must be via the DUID participant and not with
    independent forecasters. The participants have not necessarily followed the MP5F
    development as closely as the forecasters and are having to learn it now. The
    API connection protocol appears to have changed since we set up the Kidston API.'
  confidence_note: Canonical record merged from 3 source records across 2 document(s).
