  source_title: Fulcrum3D Wind Forecasting for the NEM Lessons Learnt 1
  publish_date: 2019-10
  project_name: Fulcrum3D Wind Forecasting for the NEM
  what_happened: Early analysis showed that higher-dimensional models built from SCADA
    data alone outperformed AEMO's AWEFS, and upstream sensing data from the Clements
    Gap Sodar gave early confidence that incorporating upstream sensing would further
    improve forecast accuracy.
  lesson_learnt: Future wind forecasting projects should consider deploying upstream
    sensing (e.g. sodar) alongside SCADA-based modelling — early evidence indicates
    this combination outperforms the incumbent AWEFS benchmark and warrants investment
    in sensor infrastructure.
