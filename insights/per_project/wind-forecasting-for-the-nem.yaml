- record_id: ARENA-DLV-35457
  source_title: Fulcrum3D Wind Forecasting for the NEM Lessons Learnt 2
  publish_date: 2020-04
  project_name: 'Fulcrum3D: Wind Forecasting for the NEM'
  what_happened: The NEM dispatch engine sets a zero floor for dispatch targets submitted
    via MP5F, but the FCAS calculation uses negative numbers when a generator is a
    net consumer. This means wind farms consuming from the grid incur FCAS costs that
    cannot be managed through self-forecasting, contrary to earlier AEMO operational
    forecasting meeting notes from 2018 that indicated MP5F would allow negative submissions.
    AEMO validated that this effect can contribute 10–20% to a generator's market
    performance factor (MPF), and 25 wind farms on the NEM exhibit negative generation.
  lesson_learnt: Wind farm operators should be aware that MP5F does not allow negative
    dispatch targets, so FCAS Causer Pays charges incurred during periods of negative
    net generation cannot be managed via self-forecasting; this is a structural limitation
    disproportionately affecting wind farms (25 wind farms vs. 4 solar farms show
    negative generation >5% of the time).
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: regulatory & approvals
  intervention_note: Fulcrum3D engaged AEMO to validate the internal analysis; AEMO
    confirmed the negative generation effect can contribute 10–20% to a generator's
    MPF, but no system fix was in place at the time of reporting.
  transferability: broad
  delay_magnitude: null
  technology_domain: wind
  source_pages:
  - 3
  - 11
  evidence_excerpt: AEMO have been able to validate our internal analysis that this
    effect can contribute 10-20% to a generator's MPF. There are 25 wind farms that
    do [show negative generation for more than 5% of the time]. There appears to be
    a systematic modification of some SCADA power feeds which may bias FCAS Causer
    Pays costs towards wind farms.
  confidence_note: secondary_failure_mode of design assumption failure reflects that
    the project initially assumed negative forecast submissions would be supported,
