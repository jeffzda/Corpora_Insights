  what_happened: Sodar hardware enhancements — including baffle testing at Taralga
    and the use of 20-metre range bins — improved data availability at lower and higher
    measurement heights, increasing robustness of the forecasting inputs. Higher-height
    availability improved to approximately 80% at 200m.
