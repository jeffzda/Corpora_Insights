  what_happened: After integrating the self-forecasting system across more than twelve
    NEM plants, SCADA integration emerged as the most variable and time-consuming
    component of deployment, displacing API integration as the primary complexity
    driver, because legacy and complex SCADA systems require site-specific interface
    configuration and QA of all SCADA tags.
