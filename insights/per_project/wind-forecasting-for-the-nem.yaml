- record_id: ARENA-DLV-35458
  source_title: Fulcrum3D Wind Forecasting for the NEM Lessons Learnt 2
  publish_date: 2020-04
  project_name: 'Fulcrum3D: Wind Forecasting for the NEM'
  what_happened: During periods of generation caps on South Australian wind farms,
    self-forecasting created a risk of ever-declining forecast outputs due to small
    errors in forecasts or plant control systems triggering a continuous exponential
    decline in output. As a result, it was judged prudent to suppress self-forecasts
    during generation cap intervals.
  lesson_learnt: Self-forecasts should be suppressed during generation cap intervals
    — small forecast or control system errors can initiate a continuous exponential
    output decline under cap conditions, and methods to counteract this (such as slightly
    overestimating production) can result in significant causer pays charges. Improved
    information-sharing between generators and AEMO about dispatch cap intervals is
    needed to resolve this limitation.
  issue_severity: major
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: regulatory & approvals
  intervention_note: Fulcrum3D concluded it is currently prudent to suppress self-forecasts
    during generation cap periods to avoid the exponential output decline.
  transferability: broad
  delay_magnitude: null
  technology_domain: wind
  source_pages:
