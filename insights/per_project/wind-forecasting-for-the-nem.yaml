  evidence_excerpt: It is currently prudent to suppress self-forecasts during generation
    caps because small errors in forecasts or the plant control system can start a
    continuous exponential decline in output as shown above. This is driven by non-linear
    behaviour in some plant controllers which is not captured in the current forecast
    and dispatch system.
  confidence_note: issue_severity rated major because this limitation materially constrains
