- record_id: ARENA-DLV-72299
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects - First Edition Results'
  publish_date: '2015'
  project_name: Summer Energy Demand Trial (United Energy)
  what_happened: United Energy's residential demand trial involving 30 customers in Bulleen/Lower Templestowe found that customers reduced peak demand by 30–45% during peak event periods compared to similar
    days, with the trial intended to defer a 2017/18 network upgrade on four 11kV feeders.
  lesson_learnt: Small residential demand response trials targeting specific constrained feeders can achieve 30–45% peak reductions sufficient to defer network augmentation — engage customers early with
    education on appliance use and provide sufficient incentives to achieve consistent event-day response.
