- record_id: ARENA-DLV-50576
  source_title: DEIP Market Integration Trials Summary Report 1.0
  publish_date: 2022-09
  project_name: Project Converge
  what_happened: Project Converge tested shaped operating envelopes (SOEs) — a bid-optimised
    DOE allocation methodology — which preferentially allocates network capacity to
    the lowest-cost energy sources during constraints, similar to transmission network
    capacity allocation. However, this approach raised concerns about fairness (some
    households receiving greater export limits than others based on their aggregator's
    bids) and risked disorderly bidding behaviour.
  lesson_learnt: Bid-optimised DOE allocation (SOEs) can improve system-level energy
    cost efficiency but introduces disorderly bidding risks and consumer equity concerns
    that must be explicitly managed — ensure trader bid governance rules and consumer
    benefit distribution mechanisms are in place before deploying SOEs in a field
    trial.
  issue_severity: minor
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: network business
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: coordination & stakeholders
  intervention_note: The report notes that fairness issues can be resolved by traders
    distributing benefits equally across consumers.
  transferability: moderate
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id002
  - 20
  - 21
  evidence_excerpt: A trade-off to this method is the perception of fairness, as some
    households will receive greater export limits than others depending on how their
    aggregators bid. Another complexity is managing disorderly bidding, a behaviour
    common at the transmission level where generators bid below their marginal energy
    cost to be allocated greater local capacity on a constrained part of the network.
