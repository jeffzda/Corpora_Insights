  project_name: Project Converge
  what_happened: Project Converge found that traders were not always compliant with
    issued shaped operating envelopes, with inaccurate forecasts identified as a primary
    cause — the SOE engine was heavily dependent on trader-submitted forecasts.
  lesson_learnt: SOE and DOE systems that rely on trader-provided forecasts for capacity
    allocation must account for forecast inaccuracy; providing forecasts over longer
    intervals and improving forecast quality are prerequisites for reliable envelope
    compliance.
