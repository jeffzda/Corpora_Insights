  what_happened: Project Converge modelled network support services from DER through
    a real-time RIT-D demonstration across a Canberra network area with 1,980 customers,
    showing DER could deliver up to $1.9 million in benefits by avoiding network augmentation,
    with CER network support costs as low as $5,931 compared to network upgrade costs
    of $654,000.
