- record_id: ARENA-DLV-68308
  source_title: DEIP Market Integration Trials Summary Report 3.0
  publish_date: '2026-01-27'
  project_name: Project Converge
  what_happened: The Shaped Operating Envelope (SOE) design in Project Converge assumed
    that traders would submit energy market bids at the household level, but traders
    in practice make bids at an aggregated portfolio level. This fundamental mismatch
    meant the SOE engine could not optimise as designed, and the trial had to pivot
    to focus on network support bids and a real-time RIT-D demonstration instead.
  lesson_learnt: Trial designs for DER market integration must be validated against
    actual trader bidding architecture before finalisation — assuming household-level
    bid granularity when traders operate at portfolio level will render co-optimisation
    mechanisms unworkable and require significant rescope.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: coordination & stakeholders
  intervention_note: The trial pivoted to focus on network support bids (available
    at household level) and performed a real-time RIT-D demonstration, allowing meaningful
    insights to be generated despite the design mismatch.
  transferability: moderate
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id004
  - 46
  evidence_excerpt: The original SOE concept assumed that traders would develop market
    bids per household. Instead, traders make bids into the market at an aggregated
    portfolio level. This meant they couldn't provide energy bids at the household
    level that the SOE engine was designed to optimise around.
