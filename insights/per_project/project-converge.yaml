  source_title: DEIP Market Integration Trials Summary Report 3.0
  publish_date: '2026-01-27'
  project_name: Project Converge
  what_happened: Project Converge's social science research found that consumers reacted
    extremely negatively when the SOE limited their ability to self-consume their
    own generated power, requiring the trial to adopt a design principle that self-consumption
    must always remain possible.
  lesson_learnt: VPP and SOE product designs must preserve consumers' ability to self-consume
    their own generation — prioritising technical optimisation over self-consumption
    will undermine consumer acceptance and require mid-trial redesign; consumer equity
    constraints should be embedded from the outset.
