- record_id: ARENA-DLV-50566
  source_title: DEIP Market Integration Trials Summary Report 1.0
  publish_date: 2022-09
  project_name: Project Converge
  what_happened: Project Converge identified that the existing regulatory investment
    test for distribution (RIT-D) process is costly and slow, applies only to augmentations
    or constraints costing more than $6 million to resolve, and consequently generates
    limited interest from asset owners and cannot be applied to smaller or more transient
    constraints. The project is testing a 'real-time RIT-D' platform to address these
    limitations.
  lesson_learnt: The current RIT-D process is a structural barrier to procuring non-network
    solutions for smaller distribution constraints — DER integration programs targeting
    network deferrals should design or adopt streamlined, near-real-time procurement
    processes from the outset rather than relying on the existing RIT-D pathway, which
    is unsuited to the frequency and scale of constraints in high-DER networks.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: network business
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Project Converge is testing a new real-time RIT-D platform that
    identifies constrained network areas in reduced timeframes and streamlines commercial
    engagement with traders on a fixed rather than case-by-case basis.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: DER
