  publish_date: 2020-01
  project_name: ARENA Short-Term Forecasting Trial on the NEM
  what_happened: Solar forecasters found there is no industry standard for control
    system interfaces on solar farms. Forecasting service providers had to build bespoke
    workarounds for power plant controller and inverter controller algorithms because
    documentation on DC current sensors, control system interfaces, and inverters
    was obscure and non-standardised.
  lesson_learnt: Solar STF projects should list standardised control system interface
    documentation (for DC current sensors, inverter controllers, and power plant controllers)
    as a procurement requirement from equipment suppliers — without this, forecasting
    service providers will need to build costly workarounds, and the absence of a
    standard degrades the accuracy of detailed power models that are essential for
    accurate forecasting.
