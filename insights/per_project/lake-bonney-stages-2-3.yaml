- record_id: ARENA-DLV-45908
  source_title: Improving Accuracy of Short-Term Forecasting in the NEM
  publish_date: '2020'
  project_name: Lake Bonney Stages 2 & 3 Short-Term Forecasting Pilot Project
  what_happened: A Hybrid SCADA model that switches between two sub-models depending
    on whether AEMO curtailment is active achieved the highest ranking performance
    for both LB2 and LB3, outperforming single-mode SCADA models and all other model
    variants tested.
  lesson_learnt: Wind farm self-forecast accuracy can be improved by using operationally-aware
    model switching — deploying separate optimised models for curtailment and non-curtailment
    operating states, rather than a single model across all conditions, yielded the
    best overall forecast performance in this pilot.
  issue_severity: none
  project_type: software/data/digital
  project_scale_band: pilot
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: wind
  source_pages: &id033
  - 2
  evidence_excerpt: The model with the highest ranking when compared to AWEFS was
    the 'Hybrid' SCADA model for both LB2 and LB3. The Hybrid model is a combination
    of two SCADA models. It alternates between the two models, based on whether AEMO
    curtailment is occurring or not... this approach allows for the bounds of each
    model to be simplified, and hence they can be optimised better.
