- record_id: ARENA-DLV-9055
  source_title: Vestas Short Term Forecasting of Wind Farms Lessons Learnt 1
  publish_date: 2019-10
  project_name: Vestas Short Term Forecasting of Wind Farms
  what_happened: AEMO constraints were binding at Lake Bonney 3 for over 24% of periods
    in the last 20 days of the trial. Because the assessment required forecast data
    to cover 80% of the trial period, suppressing constrained periods risked failing
    the 80% coverage condition even though the self-forecast was performing correctly.
  lesson_learnt: The 80% data-coverage threshold in self-forecast trial assessments
    should be revised to account for high frequencies of binding AEMO constraints
    — a threshold that penalises proponents for correctly suppressing constrained
    periods creates a perverse incentive and invalidates the assessment.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: null
  failure_mode: regulatory & approvals
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: The team recommended revising the 80% coverage condition in the
    assessment framework to address this structural conflict.
  transferability: moderate
  delay_magnitude: null
  technology_domain: wind
  source_pages: &id007
  - 1
  evidence_excerpt: Over the last 20 days, AEMO constraints (where the constraint
    was both less than or equal to the AWEFS availability), were binding at Lake Bonney
    3 for over 24% of the periods. Therefore, if Lake Bonney were to suppress the
    forecast where AEMO is constraining the park to its AWEFS maximum availability,
    then the trial might not pass the condition that forecast data must cover 80%
    of the trial period.
  confidence_note: null
