  what_happened: Aeolius Wind Systems identified that understanding turbine wake behaviour
    in large wind farms with multiple turbines is critical for physical-based LIDAR
    forecasting strategies to succeed, but that the knowledge and data needed to quantify
    upstream turbine impacts on leeward turbines represented a significant gap at
    the time of the trial.
  lesson_learnt: STF projects relying on physical LIDAR forecasting at large wind
    farms should treat turbine wake characterisation as a prerequisite data requirement
    — without quantifying upstream wake impacts on leeward turbines, forecast accuracy
    will be materially limited and the knowledge gap should be addressed in parallel
    with project delivery.
