- record_id: ARENA-DLV-9054
  source_title: Vestas Short Term Forecasting of Wind Farms Lessons Learnt 1
  publish_date: 2019-10
  project_name: Vestas Short Term Forecasting of Wind Farms
  what_happened: The project assessment methodology contained a condition whereby
    AEMO constraints on a park equal to the park's forecasted AWEFS availability were
    not excluded from the MAE/RMSE calculation. This condition structurally favoured
    AWEFS over the self-forecast when the actual MW output followed the AWEFS-set
    constraint ceiling, making the self-forecast appear less accurate than it was.
  lesson_learnt: When designing assessment frameworks for self-forecast trials, exclude
    all periods where AEMO dispatch constraints are binding from accuracy metrics
    (MAE/RMSE) — failure to do so systematically biases results in favour of the incumbent
    AWEFS benchmark and misrepresents self-forecast reliability.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: null
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: The project team identified the flaw and recommended that the
    assessment condition be revised to exclude all AEMO-constrained periods.
  transferability: moderate
  delay_magnitude: null
  technology_domain: wind
  source_pages: &id006
  - 1
  evidence_excerpt: The assessment condition stating that any AEMO constraint on a
    park that is equal to the park's forecasted AWEFS availability will not be excluded
    from the MAE/RMSE calculation should be revised. This condition will favour the
    AWEFS when the actual availability and self-forecast availability is higher than
    the AWEFS availability, as the actual MW will directly follow the AWEFS availability
    due to the constraint limiting the park.
