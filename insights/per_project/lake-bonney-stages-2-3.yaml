  publish_date: 2020-01
  project_name: ARENA Short-Term Forecasting Trial on the NEM
  what_happened: IMC identified that an economic model relating FCAS causer pays penalties
    to the quality of solar forecasts in the NEM did not exist at the time of the
    trial, creating a knowledge gap that prevented quantification of the commercial
    benefit of improved solar self-forecasting.
  lesson_learnt: Before committing to a solar STF investment, proponents and service
    providers should confirm that an economic model exists to quantify the FCAS causer
    pays savings attributable to improved forecast accuracy — without this model,
    the business case cannot be robustly evaluated and demonstration of commercial
    benefit to the market will be deferred.
