- record_id: ARENA-DLV-0855
  source_title: Vestas – Wind Forecasting for the NEM Lessons Learnt Report 2
  publish_date: 2020-04
  project_name: Vestas Wind Forecasting for the NEM
  what_happened: The Causer Pays Factor (CPF) analysis intended to quantify the commercial
    benefit of self-forecasting was inconclusive at the time of reporting because
    only three CPF calculation periods had included self-forecasting data, the historical
    CPF data was highly variable, and the CPF calculation procedure was difficult
    to replicate against AEMO's published figures.
  lesson_learnt: When designing a commercial benefit assessment for a self-forecasting
    project, account for the lag in CPF calculation cycles (computed monthly, applied
    prospectively) — plan for at least 12 months of self-forecasting operation before
    drawing conclusions, and seek early engagement with AEMO on the CPF calculation
    methodology to avoid replication difficulties.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: data/validation/testing
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Vestas and Infigen are developing a tool using 4-second SCADA
    data to directly calculate theoretical CPFs under AWEFS and self-forecasting scenarios,
    and requested ARENA/AEMO provide a workshop on the CPF calculation procedure.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: wind
  source_pages:
  - 4
  - 5
  - 8
  evidence_excerpt: Based on the observed period, the corresponding annual bounds
    from extrapolating individual 28-day periods becomes $35,600 to $2,306,400 in
    savings... Extrapolating monthly 28-day CPF values could result in grossly varied
    annual saving and needs to be understood when discussing a monthly 'average' CPF
    value or savings.
  confidence_note: issue_severity moderate because the inability to quantify CPF benefit
    directly impairs the project's ability to demonstrate commercial value, which
    is a stated project objective. Canonical record merged from 3 source records across
    3 document(s).
