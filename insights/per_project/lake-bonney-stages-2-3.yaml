- record_id: ARENA-DLV-39601
  source_title: Short-Term Forecasting Trial on the NEM Progress Report (April to
    October 2019)
  publish_date: 2020-01
  project_name: ARENA Short-Term Forecasting Trial on the NEM
  what_happened: Trial participants encountered delays in completing MP5F API registration
    and self-forecast accreditation due to the 90-day password expiry on AEMO's MP5F
    API user accounts. When passwords expired, AEMO's authentication service made
    the account inactive and blocked forecast submissions; only the wind or solar
    farm operator (not the forecasting service provider) could reset the password,
    creating a diffusion of responsibility that caused delays in restoring submissions.
  lesson_learnt: Forecasting service providers should not assume they can independently
    manage all system credentials — where a third-party system (such as AEMO's MP5F
    API) assigns account management responsibilities to the asset operator rather
    than the service provider, this dependency must be explicitly documented in the
    project risk plan and a clear password-renewal protocol agreed with the operator
    before go-live.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: technology vendor
  delay_category: commissioning/integration
  failure_mode: coordination & stakeholders
  outcome_class: delayed but recoverable
  secondary_failure_mode: unvalidated integration
  intervention_note: AEMO developed a new API to allow self-forecast providers to
    directly update their password without requiring market participant involvement,
    resolving the diffusion-of-responsibility issue.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: grid/system stability
  source_pages: &id013
  - 7
  evidence_excerpt: A common challenge has been that the MP5F API user account password
    expires every 90 days. If not renewed beforehand, AEMO's authentication service
    will make that user account inactive and block any further self-forecast submissions
    from that user. Only the operator of the wind or solar farm can reset the MP5F
    API User account password. This diffusion of responsibility has created delays
    in getting the submissions accepted again.
