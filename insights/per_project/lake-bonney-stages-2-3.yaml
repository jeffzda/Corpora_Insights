- record_id: ARENA-DLV-9058
  source_title: Vestas Short Term Forecasting of Wind Farms Lessons Learnt 1
  publish_date: 2019-10
  project_name: Vestas Short Term Forecasting of Wind Farms
  what_happened: Managing self-forecast submissions for multiple DUIDs registered
    under a single participant required additional complexity in the API submission
    process. The API platform introduced per-DUID access controls so forecast providers
    could only submit for their specific DUIDs, not the full participant portfolio.
  lesson_learnt: When a participant holds multiple DUIDs, design the API integration
    architecture to handle per-DUID access controls from the outset — adding this
    security layer later increases submission complexity and requires additional development
    effort.
  issue_severity: minor
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: technology vendor
  delay_category: null
  failure_mode: unvalidated integration
  outcome_class: follow-on scale-up enabled
  secondary_failure_mode: poor scoping
  intervention_note: The API platform was configured to restrict forecast providers
    to only their specific DUIDs, improving security while adding submission complexity.
  transferability: moderate
  delay_magnitude: null
  technology_domain: wind
  source_pages: &id009
  - 2
  evidence_excerpt: As Infigen has multiple DUIDs registered under a single participant,
    the addition of the API platform allowed Infigen greater security that forecast
    providers could only submit self-forecasts for the specific DUIDs they were providing
    the service for and not the full participant. While this gives Infigen control
    and monitoring over the data being submitted on behalf of Infigen's participants,
    it does add additional complexity to the submission process.
