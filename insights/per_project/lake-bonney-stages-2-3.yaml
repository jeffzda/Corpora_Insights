  publish_date: 2020-01
  project_name: ARENA Short-Term Forecasting Trial on the NEM
  what_happened: Meridian found a trade-off between spatial resolution and sampling
    frequency when configuring LIDAR scanning parameters, determining that higher
    sampling frequency was preferable for short-term forecasting purposes. Meridian
    also identified that simple machine learning approaches perform no better than
    statistical methods when given only on-site farm data, indicating a skill cap
    that can only be exceeded using deep learning or off-farm data.
  lesson_learnt: When configuring LIDAR scanning parameters for wind STF, prioritise
    sampling frequency over spatial resolution; and when selecting machine learning
    approaches, recognise that simple models trained solely on on-site data have a
    hard skill ceiling — deep learning methods combined with off-farm data are likely
    necessary to achieve material improvements in forecast accuracy.
