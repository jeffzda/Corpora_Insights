  project_name: Lake Bonney Stages 2 & 3 Short-Term Forecasting Pilot Project
  what_happened: It remained unconfirmed at project close whether the SCADA-based
    self-forecast model is turbine-agnostic, as the model relies on specific SCADA
    signals that may not be available on all wind turbine types, meaning transferability
    of the approach to other fleets requires operational validation.
  lesson_learnt: Proponents seeking to replicate SCADA-based self-forecasting on turbines
    not covered by this pilot must first validate SCADA signal availability and quality
    — the model's performance is dependent on specific signal types and operational
    validation on new turbine types is required before assuming equivalent accuracy.
