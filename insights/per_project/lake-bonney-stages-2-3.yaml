- record_id: ARENA-DLV-45905
  source_title: Improving Accuracy of Short-Term Forecasting in the NEM
  publish_date: '2020'
  project_name: Lake Bonney Stages 2 & 3 Short-Term Forecasting Pilot Project
  what_happened: Calculating the Causer Pays Factor required processing approximately
    30 GB of 4-second interval data per 28-day period (870 million rows across 8,064
    CSV files), in formats poorly suited to large-scale data processing and with incomplete
    documentation from AEMO, making accurate CPF replication extremely resource-intensive.
  lesson_learnt: Proponents undertaking CPF analysis should budget significant data
    engineering resources and request AEMO's procedural clarification early — AEMO's
    published CPF data is fragmented across incompatible formats, contains gaps, and
    the calculation methodology is poorly documented, making independent replication
    disproportionately difficult.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: pilot
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: data/validation/testing
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: execution & logistics
  intervention_note: Infigen engaged directly with AEMO during the project to clarify
    the CPF methodology; AEMO was responsive in answering questions and clarifying
    the proposed approach.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: wind
  source_pages: &id031
  - 6
  evidence_excerpt: The dataset for CPF calculation for a 28-day period using 4-second
    data is ~30 GB, with a total of 8.064 csv files and 870 million rows of data.
    Moreover, the dataset is in a format which is not well-suited for large volumes
    of data, and is also not easily accessible. Furthermore, the procedure to calculate
    CPF is not very straightforward as the exact process is poorly documented, complex
    and resource-intensive, making it hard to replicate and match AEMO's published
    data.
