  what_happened: Advisian found that constraint periods — where wind and solar farm
    output was artificially reduced due to maintenance outages or AEMO restrictions
    — needed to be excluded from model training datasets. The volume of excluded data
    was greater than originally expected, materially reducing the amount of data available
    for model training and reducing initial model accuracy.
  lesson_learnt: When designing training datasets for self-forecasting models, account
    for the volume of constrained-off periods that will need to be excluded — this
    is consistently larger than expected at Australian wind and solar farms, and under-provisioning
    training data reduces model accuracy; plan for periodic model retraining after
    project completion to recover accuracy incrementally.
