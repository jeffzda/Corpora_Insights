- record_id: ARENA-DLV-45902
  source_title: Improving Accuracy of Short-Term Forecasting in the NEM
  publish_date: '2020'
  project_name: Lake Bonney Stages 2 & 3 Short-Term Forecasting Pilot Project
  what_happened: LB2's self-forecast took longer to pass AEMO's assessment than LB3
    because ongoing curtailment at LB2 caused the self-forecast to fail the qualification
    threshold, despite the self-forecast performing better than AWEFS during non-curtailment
    periods, which AEMO's assessment procedure excluded.
  lesson_learnt: Wind farms subject to ongoing network curtailment may fail AEMO's
    self-forecast assessment procedure even when their forecast outperforms AWEFS,
    because curtailment periods are excluded from the assessment — proponents should
    anticipate and flag this procedural constraint early with AEMO.
  issue_severity: minor
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: The issue resolved itself over time as curtailment conditions
    changed, and LB2 ultimately passed AEMO assessment on December 24, 2019.
  transferability: moderate
  delay_magnitude: 1-3 months
  technology_domain: wind
  source_pages:
  - 2
  - 5
  evidence_excerpt: On the 12th of November 2019 Lake Bonney 3 passed AEMO's initial
    assessment by performing better than AWEFS in terms of the MAE and RMSE and by
    providing reliable and consistent forecasts to AEMO's production environment.
    Similarly, on the 24th of December 2019 Lake Bonney 2 passed AEMO's initial assessment.
  confidence_note: Delay magnitude estimated from LB3 passing assessment 12 November
