  what_happened: Windlab found that wind turbulence — driven by daytime solar heating
    creating turbulent eddies — produces a daily changing variance in both horizontal
    and vertical wind speeds that requires a forecast algorithm specifically designed
    to accommodate this varying pattern; existing approaches did not handle this adequately.
  lesson_learnt: Wind forecasting algorithms for NEM sites must be designed to handle
    diurnally varying turbulence, particularly in summer — the algorithm must accommodate
    daily changing variance in wind speeds caused by thermal convection, or forecast
    accuracy will degrade predictably during daytime hours.
