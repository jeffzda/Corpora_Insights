  publish_date: 2020-01
  project_name: ARENA Short-Term Forecasting Trial on the NEM
  what_happened: The trial demonstrated that self-forecasting for semi-scheduled generators
    cannot be fully subcontracted to a third-party turnkey solution because the Semi-Scheduled
    Generator asset owner/operator must remain actively engaged with the forecasting
    technology provider to submit self-forecasts, and remains legally responsible
    for forecast accuracy regardless of the service provider used.
  lesson_learnt: Wind and solar farm operators considering third-party STF service
    arrangements must understand that they cannot fully delegate self-forecasting
    responsibility — asset owners retain ongoing obligations for AEMO submission and
    forecast accuracy, and this engagement requirement must be resourced and factored
    into operational costs when evaluating the STF business case.
  issue_severity: minor
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
