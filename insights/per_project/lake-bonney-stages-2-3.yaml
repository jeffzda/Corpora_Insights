- record_id: ARENA-DLV-39609
  source_title: Short-Term Forecasting Trial on the NEM Progress Report (April to
    October 2019)
  publish_date: 2020-01
  project_name: ARENA Short-Term Forecasting Trial on the NEM
  what_happened: Both wind and solar forecasters found that rainfall had a non-trivial
    impact on forecast accuracy. For solar farms, rainfall correlates with cloud cover
    but also reduces panel temperatures and soiling. For wind farms, SODAR instruments
    perform better than LIDARs in rain, fog, and low-visibility conditions, but both
    have limitations in arid environments with clean air.
  lesson_learnt: Hardware selection for STF projects must account for local climate
    and rainfall patterns — SODARs should be preferred over LIDARs in high-rainfall
    or low-visibility environments, while short masts may be more appropriate in arid
    clean-air conditions; in all cases, adequate hardware redundancy should be installed
    to maintain forecast accuracy during and after rain events.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: It was recommended that adequate hardware redundancy be installed
    on site to counter the impact of rainfall on weather forecasting equipment.
  transferability: moderate
  delay_magnitude: null
  technology_domain: wind
  source_pages: &id021
  - 10
  evidence_excerpt: For wind forecasting, SODARs perform better than LIDARs in rain,
    fog, smog and other low visibility scenarios. There are some environments where
    both SODARs and LIDARs have performance limitations (e.g. arid areas with clean
    air), a short mast may be a better solution in these situations. To manage the
    effect of rainfall on forecast accuracy it is suggested that adequate hardware
    redundancy is installed on site.
