- record_id: ARENA-DLV-0853
  source_title: Vestas – Wind Forecasting for the NEM Lessons Learnt Report 2
  publish_date: 2020-04
  project_name: Vestas Wind Forecasting for the NEM
  what_happened: The new VMET data logger installed at Met Mast A could not stream
    data via the existing 4G network and required use of the SCADA network instead,
    causing a temporary communication loss between Met Mast A and Infigen's independent
    met mast data service provider because data routed through the Vestas VOB server
    was no longer considered truly raw data.
  lesson_learnt: Before installing new data loggers at met mast sites, conduct a thorough
    investigation of all existing and required data-streaming pathways — including
    third-party independent data service provider requirements — to avoid disrupting
    parallel data flows that depend on connectivity assumptions baked into the existing
    setup.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: technology vendor
  delay_category: commissioning/integration
  failure_mode: unvalidated integration
  outcome_class: delayed but recoverable
  secondary_failure_mode: poor scoping
  intervention_note: Vestas configured direct access to the VMET panel via the SCADA
    network bypassing the VOB server, and Infigen developed a new FTP-based data transfer
    system to its independent met mast data service provider.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: wind
  source_pages: &id001
  - 7
  evidence_excerpt: The new data logger (Vestas VMET panel) installed at Met Mast
    A, required to stream data for the forecasting models, was unable to continue
    to stream data via the existing 4G network and instead the SCADA network was the
    only point of connection… This led to temporary communication loss between Met
    Mast A and the independent service provider.
  confidence_note: secondary_failure_mode of design assumption failure included because
    the 4G connectivity assumption was embedded in the original installation scope
    and not validated before deployment.
