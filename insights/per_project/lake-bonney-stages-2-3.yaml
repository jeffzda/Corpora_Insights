  evidence_excerpt: It was observed in our trial that Raise Regulation FCAS was required
    in the NEM more often than Lower Regulation FCAS. Therefore, due to an observed
    slight tendency of the self-forecast to under-forecast production there was less
    risk of actual production being lower than the forecasted production and less
    exposure to the more frequent Raise Regulation FCAS. However, if every semi-scheduled
    generator was to intentionally under-forecast production, we may see a need for
    more Lower Regulation FCAS and a bias to over-forecast would be advantageous from
    a cost perspective.
  confidence_note: failure_mode set to design assumption failure — the model's implicit
