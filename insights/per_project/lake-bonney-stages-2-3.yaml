  technology_domain: grid/system stability
  source_pages: &id029
  - 12
  evidence_excerpt: the ability for a wind or solar farm to self-forecast is currently
    not able to be subcontracted to a third-party owned, turnkey solution. This is
    due to the need for Semi-Scheduled Generator asset owners/operators to be actively
    engaged with their third-party forecasting technology providers to send self-forecasts
    to the AEMO MP5F API. Market participant will also always be responsible for ensuring
    to the accuracy of their self-forecast to the market regardless of the technology
    service provider.
