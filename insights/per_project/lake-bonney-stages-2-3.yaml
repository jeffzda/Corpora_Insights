  publish_date: 2020-01
  project_name: ARENA Short-Term Forecasting Trial on the NEM
  what_happened: Wind forecasting algorithms required revision during the trial because
    existing machine learning and physical models failed to adequately account for
    site terrain, wind turbine wakes, extreme wind speeds, and turbulence — factors
    that significantly degraded forecast accuracy.
  lesson_learnt: Wind STF algorithm design must explicitly incorporate site-specific
    terrain effects, turbine wake interactions, and diurnal turbulence variation before
    deployment; treating these as post-hoc calibration issues rather than design inputs
    will require costly algorithm rework during the trial period.
