- record_id: ARENA-DLV-23301
  source_title: 'Spotlight: Short Term Forecasting Trial on the NEM'
  publish_date: 2020-09
  project_name: Vestas Lake Bonney Wind Farm Short-Term Forecasting Trial
  what_happened: A short-term forecasting trial using machine learning models at Infigen
    Energy's Lake Bonney 2 and 3 wind farms achieved a 26% improvement in forecasting
    accuracy compared with AEMO's AWEFS system, reducing the Causer Pays Factor by
    an equivalent margin and delivering estimated annual cost savings of $198,000
    (approximately $1,000/MW).
  lesson_learnt: ML-based self-forecasting solutions can materially outperform the
    market operator's default forecasting system for wind farms — a 26% accuracy improvement
    translated directly into ~$1,000/MW/year in reduced FCAS Causer Pays costs, making
    a SaaS subscription commercially justifiable for asset owners.
