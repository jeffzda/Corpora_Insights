- record_id: ARENA-DLV-23305
  source_title: 'Spotlight: Short Term Forecasting Trial on the NEM'
  publish_date: 2020-09
  project_name: Vestas Lake Bonney Wind Farm Short-Term Forecasting Trial
  what_happened: During the trial, an observed tendency for the self-forecast model
    to slightly under-forecast production was identified. Under the existing NEM conditions
    — where Raise Regulation FCAS was required more often than Lower Regulation FCAS
    — this bias was actually advantageous, reducing cost exposure. However, if all
    semi-scheduled generators adopted the same under-forecasting bias, the market
    dynamic could reverse.
  lesson_learnt: Self-forecasting strategies should be designed with awareness of
    portfolio-level market effects — a forecast bias that is individually advantageous
    under current NEM FCAS conditions could become harmful if widely adopted, and
    operators should monitor evolving FCAS market dynamics rather than hard-coding
    a directional bias.
  issue_severity: minor
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
