- record_id: ARENA-DLV-45903
  source_title: Improving Accuracy of Short-Term Forecasting in the NEM
  publish_date: '2020'
  project_name: Lake Bonney Stages 2 & 3 Short-Term Forecasting Pilot Project
  what_happened: The self-forecast was found to be skewed toward underestimating generation
    while AWEFS overestimates; the CPF improvement of 26% was driven primarily by
    this underestimation bias coinciding with a market structural preference for raise
    regulation FCAS, rather than purely by improved forecast accuracy.
  lesson_learnt: A self-forecast's CPF benefit can be driven by directional bias (underestimation)
    rather than raw accuracy improvement — proponents should assess whether market
    FCAS conditions favour their forecast bias direction, and should not assume CPF
    improvement will persist if market raise/lower regulation dynamics shift.
