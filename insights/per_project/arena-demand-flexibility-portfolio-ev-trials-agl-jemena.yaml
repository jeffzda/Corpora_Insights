- record_id: ARENA-DLV-53895
  source_title: Demand Flexibility Portfolio Retrospective Analysis Report
  publish_date: 2023-07
  project_name: ARENA Demand Flexibility Portfolio — EV Trials (AGL, Jemena)
  what_happened: Post-installation handover and ongoing communication was cited across
    EV trials as the area most needing improvement; participants experienced confusion
    about hardware handover, charging software, trial processes, and what to do when
    chargers developed faults, leading to fleet manager anxiety and driver dissatisfaction.
  lesson_learnt: EV smart charging trials must invest in detailed post-installation
    handover documentation and a clear ongoing communication plan, including explicit
    fault-management processes; inadequate handover and communications is a predictable
    source of participant attrition and negative experience that undermines trial
    outcomes.
