- record_id: ARENA-DLV-67553
  source_title: Hydrogenated and Hybrid Heterojunction P-Type Silicon PV Cells
  publish_date: 2021-12
  project_name: Hydrogenated and Hybrid Heterojunction p-type Silicon PV Cells R&D
    Project
  what_happened: A high-speed post-fabrication process was developed that improves
    industrial n-type heterojunction solar cell efficiency by approximately 0.7% absolute
    within seconds, compared to prior illuminated annealing processes that required
    hundreds of hours for smaller gains of 0.2–0.4% absolute.
  lesson_learnt: Future projects and manufacturers developing n-type silicon heterojunction
    solar cells should evaluate rapid post-fabrication treatment processes — a 0.7%
    absolute efficiency gain achievable in seconds could translate to approximately
    $100 M per year for a large-scale manufacturer and represents a viable cost-reduction
    pathway without changes to cell architecture.
  issue_severity: none
  project_type: manufacturing/supply chain
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: follow-on scale-up enabled
  secondary_failure_mode: null
  intervention_note: Applied a rapid patent-pending post-fabrication process to industrial
    n-type heterojunction solar cells sourced from CIE Power in China, improving surface
    passivation and electron transport within seconds.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id001
  - 3
  - 8
  - 9
  evidence_excerpt: In the past, illuminated annealing processes have been shown to
    lead to improvements in the efficiency of heterojunction solar cells in the range
    of 0.2% - 0.4% absolute, but hundreds of hours are required to achieve these improvements.
    Of particular importance in this project, has been the development of a high-speed
    process to transform heterojunction solar cells within seconds, to improve the
    efficiency by 0.7% absolute.
