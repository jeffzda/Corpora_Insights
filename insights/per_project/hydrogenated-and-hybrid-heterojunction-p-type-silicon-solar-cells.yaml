- record_id: ARENA-DLV-67552
  source_title: Hydrogenated and Hybrid Heterojunction P-Type Silicon PV Cells
  publish_date: 2021-12
  project_name: Hydrogenated and Hybrid Heterojunction p-type Silicon PV Cells R&D
    Project
  what_happened: The project successfully demonstrated that p-type silicon material
    quality can be improved by more than a factor of 10 through a multi-stage gettering
    and hydrogenation process, enabling fabrication of heterojunction solar cells
    with open circuit voltages over 700 mV — exceeding current state-of-the-art PERC
    technology — even using low-cost multi-crystalline silicon.
  lesson_learnt: Low-cost p-type multi-crystalline silicon, previously considered
    unsuitable for high-efficiency heterojunction structures, can be elevated to sufficient
    quality through multi-stage defect engineering; future projects should not exclude
    cheap p-type substrates from high-efficiency cell architectures without first
    evaluating defect engineering options.
