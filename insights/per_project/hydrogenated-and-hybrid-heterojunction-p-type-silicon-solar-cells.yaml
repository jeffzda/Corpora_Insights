- record_id: ARENA-DLV-67554
  source_title: Hydrogenated and Hybrid Heterojunction P-Type Silicon PV Cells
  publish_date: 2021-12
  project_name: Hydrogenated and Hybrid Heterojunction p-type Silicon PV Cells R&D
    Project
  what_happened: 'A key knowledge gap remained at project close-out: while significant
    efficiency enhancements from post-fabrication processes were demonstrated on industrial
    heterojunction solar cells, the fundamental physical mechanisms responsible for
    these improvements were not understood, limiting the ability to design further
    optimisations.'
  lesson_learnt: When developing novel post-fabrication treatments for solar cells,
    plan dedicated mechanistic investigation work streams alongside performance characterisation
    — efficiency gains achieved without mechanistic understanding limit the ability
    to optimise further and create intellectual property risk.
