- record_id: ARENA-DLV-45657
  source_title: Pollination - Community Energy Report
  publish_date: 2024-07
  project_name: Denmark Community Windfarm
  what_happened: Western Power determined that the transmission line could not support
    four turbines and constrained the project to two, halving potential generation.
    After a major blackout in 2007, the WA government instructed Western Power to
    upgrade the line to the original design capacity, but by then the project was
    too far advanced to rework the feasibility study and absorb the unbudgeted costs
    of returning to a four-turbine design.
  lesson_learnt: Seek formal written confirmation of network hosting capacity and
    any planned line upgrades before finalising turbine count in the project design
    — a network-imposed scope reduction that occurs after feasibility completion cannot
    be easily reversed, even if the constraint is subsequently resolved by government
    action.
