- record_id: ARENA-DLV-45658
  source_title: Pollination - Community Energy Report
  publish_date: 2024-07
  project_name: Denmark Community Windfarm
  what_happened: The Denmark Community Windfarm's economic success was underpinned
    by a highly favourable Power Purchase Agreement with Synergy, a federal government
    grant of $2.48 million under the Remote and Regional Power Generation Program,
    and relatively low capital costs — conditions the report explicitly states are
    unlikely to be replicable under today's market and capital cost conditions.
  lesson_learnt: Do not use Denmark Community Windfarm as an economic benchmark for
    new community wind projects — its success depended on a favourable PPA, a government
    grant programme that no longer exists, and development costs that have since increased
    substantially; new projects must be assessed against current market conditions.
