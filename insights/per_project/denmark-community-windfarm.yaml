- record_id: ARENA-DLV-45656
  source_title: Pollination - Community Energy Report
  publish_date: 2024-07
  project_name: Denmark Community Windfarm
  what_happened: The Denmark Community Windfarm took approximately a decade from inception
    (2003) to commissioning (March 2013), facing statutory land excision processes
    (~3 years), funding delays, and Western Power technical studies that constrained
    the project to two turbines instead of the originally approved four.
  lesson_learnt: Community wind projects on Crown land should anticipate a statutory
    excision process of approximately three years and factor grid-imposed capacity
    constraints into the initial design — late-stage scope reduction forced by the
    network operator (from four to two turbines) cannot easily be reversed once the
    project has advanced.
  issue_severity: major
  project_type: storage
  project_scale_band: demonstration
  lifecycle_phase: approvals/contracting
  proponent_type: community/local body
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: poor scoping
  intervention_note: The community persisted with the two-turbine design, secured
    a PPA with Synergy, and commissioned the project — it repaid debt in 2022 and
    continues to pay dividends.
  transferability: moderate
  delay_magnitude: 1-3 years
  technology_domain: wind
