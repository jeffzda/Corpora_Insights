- record_id: ARENA-DLV-45659
  source_title: Pollination - Community Energy Report
  publish_date: 2024-07
  project_name: Denmark Community Windfarm
  what_happened: The Denmark Community Windfarm required approximately 11,600 volunteer
    hours to reach technical and financial feasibility, with voluntary contributions
    sustained over more than 20 years. The steering group possessed diverse professional
    skills (environmental science, law, commerce, communications) which were identified
    as a key enabler of success.
  lesson_learnt: Community energy projects that involve grid connection and commercial
    energy market participation require sustained, multi-decade volunteer commitments
    with deep professional skills — projects should map required competencies (energy
    markets, law, engineering, finance) against available volunteer capacity before
    committing to development.
  issue_severity: moderate
  project_type: storage
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: community/local body
  delay_category: internal governance/resourcing
  failure_mode: coordination & stakeholders
  outcome_class: successful demonstration
  secondary_failure_mode: poor scoping
  intervention_note: Local residents with backgrounds in environmental science, law,
    commerce and communications joined the initial steering group, providing the breadth
    of skills needed to progress the project.
  transferability: broad
  delay_magnitude: null
  technology_domain: wind
  source_pages: &id004
  - 51
  - 52
  evidence_excerpt: In all, some 11,600 hours of volunteer time were contributed to
    take the project through to technical and financial feasibility. Volunteer contributions
    have now been sustained over 20 years.
