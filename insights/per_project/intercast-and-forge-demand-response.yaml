- record_id: ARENA-DLV-9551
  source_title: Intercast and Forge Demand Response Report 1
  publish_date: '2019-02-26'
  project_name: Intercast and Forge Demand Response
  what_happened: During the first required demand response curtailment test (before
    31 May 2018), Intercast & Forge had received significant production orders that
    made losing production time detrimental to customer deliveries. The company accepted
    the curtailment request via the portal but did not actually curtail, resulting
    in a recorded curtailment of only 0.6166 MW — generated through average usage
    calculation rather than genuine curtailment activity.
  lesson_learnt: Industrial demand response participants must account for production
    scheduling conflicts that can prevent genuine curtailment during test events;
    a contingency plan for rescheduling or deferring production loads before a test
    window should be established to ensure valid test results.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: industrial operator
  delay_category: data/validation/testing
  failure_mode: execution & logistics
  outcome_class: re-scoped/adapted
  secondary_failure_mode: coordination & stakeholders
  intervention_note: Elected a retest in June 2018 when production scheduling allowed
    genuine curtailment to be demonstrated; the retest results were described as 'extremely
    encouraging'.
  transferability: moderate
  delay_magnitude: 1-3 months
  technology_domain: demand response
  source_pages: &id001
  - 4
  evidence_excerpt: In between the request for a test and the actual test, significant
    orders were received that would make losing production time detrimental to the
    deliveries required by our customers... The results of the physical test showed
    that we curtailed 0.6166MW during that period. This was merely generated through
    the average usage calculation as opposed to any true curtailment.
  confidence_note: null
