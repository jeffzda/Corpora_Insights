  source_title: Intercast and Forge Demand Response Report 4
  publish_date: '2020-12-08'
  project_name: Intercast & Forge Demand Response Trial
  what_happened: During a live demand response test on 28 November 2019, Intercast
    & Forge delivered an average curtailment of 9.49 MWh against a contracted commitment
    of 10 MWh. The shortfall was attributed to a low baseline usage period caused
    by machine maintenance, which reduced the calculated curtailment rather than reflecting
    an actual inability to shed load.
  lesson_learnt: Baseline calculation methodology for demand response tests can understate
    actual curtailment capability when a maintenance-driven low-usage period falls
    within the baseline window — verify that the baseline period reflects normal operating
    conditions before accepting a test result as indicative of true curtailment capacity.
  issue_severity: minor
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: industrial operator
  delay_category: null
  failure_mode: data & measurement
  outcome_class: partial success
  secondary_failure_mode: null
  intervention_note: The team noted that using the prior 2 hours as the baseline would
    have shown 10.26 MWh shed, confirming physical curtailment capability met the
    target.
  transferability: moderate
  delay_magnitude: null
  technology_domain: demand response
  source_pages: &id009
  - 4
  - 5
  evidence_excerpt: We were able to deliver an average of 9.49 MWh during the test
    period. Although we did not achieve the required consumption curtailment commitment,
    this was more a result of the low baseline used in the calculation, due to machine
    maintenance. For example if the prior 2 hours were used as the base in the calculation
    we would have actually load shed 10.26 MWh.
  confidence_note: issue_severity set to minor — the shortfall was a measurement/baseline
    artefact rather than a genuine operational failure; physical curtailment appeared
