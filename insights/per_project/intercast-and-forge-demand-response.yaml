- record_id: ARENA-DLV-52804
  source_title: Intercast and Forge Demand Response Report 2
  publish_date: '2019-07-29'
  project_name: Intercast & Forge Demand Response Trial
  what_happened: Intercast & Forge's committed curtailment for the retest was 8 MWh
    rather than the originally planned 10 MWh, due to lower production levels during
    January and February which reduced the calculated electricity usage base level.
  lesson_learnt: Demand response capacity commitments for industrial participants
    should be calculated dynamically against current production levels — reduced production
    schedules can materially lower the achievable baseline and therefore the committable
    curtailment volume, which must be reflected in declarations to avoid overstating
    capacity.
