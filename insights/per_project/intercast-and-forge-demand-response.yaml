- record_id: ARENA-DLV-9555
  source_title: Intercast and Forge Demand Response Report 1
  publish_date: '2019-02-26'
  project_name: Intercast and Forge Demand Response
  what_happened: As a single-site industrial consumer rather than an on-seller or
    retailer, Intercast & Forge's demand response capacity was entirely dependent
    on its own ability to curtail internal power usage; no external customer recruitment,
    business model, or pricing structure was required or applicable.
  lesson_learnt: Program designers and prospective industrial demand response participants
    should recognise that single-site industrial consumers operate under a fundamentally
    different participation model to aggregators or retailers — their available curtailment
    volume is bounded entirely by their own process flexibility, and standard aggregator
    business model assumptions do not apply.
  issue_severity: none
  project_type: DER/customer-side
  project_scale_band: demonstration
