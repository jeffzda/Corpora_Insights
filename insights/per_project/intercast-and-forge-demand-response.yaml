  project_name: Intercast & Forge Demand Response Trial
  what_happened: Across four demand response tests, Intercast & Forge incurred total
    costs of $137,468, encompassing test costs, fixed cost non-recovery during tests,
    system set-up, project management, travel, and knowledge sharing, training and
    education.
  lesson_learnt: Industrial demand response participants should budget for the full
    cost base of participation beyond direct test costs — fixed cost non-recovery
    during curtailment events, project management, training and knowledge sharing
    activities represent substantial cost components that need to be factored into
    the business case.
