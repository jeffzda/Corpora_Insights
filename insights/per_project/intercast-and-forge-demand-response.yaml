- record_id: ARENA-DLV-9552
  source_title: Intercast and Forge Demand Response Report 1
  publish_date: '2019-02-26'
  project_name: Intercast and Forge Demand Response
  what_happened: Intercast & Forge accepted the curtailment test notification via
    the portal without intending to physically curtail, in order to test whether internal
    cross-departmental communication could occur within the required acceptance/rejection
    timeframe. This effectively used a live test event as a communication drill rather
    than a physical curtailment demonstration.
  lesson_learnt: Industrial demand response participants should separate communication
    readiness testing from physical curtailment testing; conflating the two — accepting
    a curtailment request without intending to curtail — produces invalid performance
    data and wastes a test event.
