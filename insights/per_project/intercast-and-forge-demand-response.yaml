- record_id: ARENA-DLV-17701
  source_title: Intercast and Forge Demand Response Report 3
  publish_date: null
  project_name: Intercast and Forge Demand Response
  what_happened: Intercast & Forge's contracted demand response capacity was reduced
    from the standard 10 MWh to 5 MWh for the 30 May 2019 live event because base
    rate usage calculations during the contracted test-hour window fell below the
    10 MWh threshold for certain periods, lowering the dispatchable curtailment volume.
  lesson_learnt: When contracting demand response capacity, verify that baseline usage
    calculations across all possible dispatch windows meet the contracted threshold
    — if base consumption in certain periods is too low, contracted capacity will
    be reduced and the participant cannot deliver the nominal volume.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: approvals/contracting
  proponent_type: industrial operator
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Contracted capacity was adjusted downward to 5 MWh to reflect
    the actual dispatchable baseline, allowing the test to proceed successfully within
    the revised parameters.
  transferability: moderate
  delay_magnitude: null
  technology_domain: demand response
  source_pages: &id006
  - 4
  evidence_excerpt: lntercast's contracted MW capacity was SMWh for the period of
    the test, as opposed to the standard l0MWh contracted capacity. This was due to
    the base rate usage calculation within the testing hours range being below the
    required l0MWh requirement for certain periods. This thereby lowers the ability
    to demand curtail l0MWh should the low usage period be selected.
  confidence_note: issue_severity assessed as moderate because the capacity reduction
    (50% below standard) materially constrained commercial participation, though the
    test was ultimately completed.
