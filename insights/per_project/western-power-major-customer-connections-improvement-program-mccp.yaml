- record_id: ARENA-DLV-40603
  source_title: ARENA Electrical Infrastructure Roundtable
  publish_date: '2025-06-25'
  project_name: Western Power Major Customer Connections Improvement Program (MCCP)
  what_happened: Western Power's technical standards were not easily accessible to
    customers, creating inefficiency; after being published via a customer portal,
    the standards were accessed or downloaded over 4,000 times by 1,500 different
    users.
  lesson_learnt: Publishing technical connection standards openly and accessibly —
    rather than providing them only on request — reduces rework and accelerates customer-side
    design; network businesses should make technical standards self-service as a low-cost
    intervention with high uptake.
  issue_severity: minor
  project_type: network/grid
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: development/design
  proponent_type: network business
  delay_category: null
  failure_mode: coordination & stakeholders
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Western Power published its Transmission Technical Standards
    online via a customer portal, resulting in over 4,000 downloads by 1,500 unique
    users.
  transferability: broad
  delay_magnitude: null
  technology_domain: grid/system stability
