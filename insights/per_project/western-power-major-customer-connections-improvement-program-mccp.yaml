- record_id: ARENA-DLV-40602
  source_title: ARENA Electrical Infrastructure Roundtable
  publish_date: '2025-06-25'
  project_name: Western Power Major Customer Connections Improvement Program (MCCP)
  what_happened: The connection enquiry phase took 9 months with limited price certainty;
    after MCCP reforms, the enquiry phase was reduced by 6 months and greater price
    certainty was provided to customers.
  lesson_learnt: Providing customers with earlier price certainty and a shorter enquiry
    phase materially improves the proportion of projects that proceed — network businesses
    should front-load cost transparency rather than requiring customers to invest
    significant time before receiving indicative costs.
  issue_severity: moderate
  project_type: network/grid
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: approvals/contracting
  proponent_type: network business
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: MCCP restructured the enquiry phase, cutting it from 9 months
    to approximately 3 months while adding greater price certainty for customers.
  transferability: broad
  delay_magnitude: 3-12 months
  technology_domain: grid/system stability
  source_pages: &id002
