- record_id: ARENA-DLV-40601
  source_title: ARENA Electrical Infrastructure Roundtable
  publish_date: '2025-06-25'
  project_name: Western Power Major Customer Connections Improvement Program (MCCP)
  what_happened: In 2022, only 5% of connection enquiries in the SWIS reached an Access
    Offer, prompting Western Power to review and overhaul the connections process
    through the Major Customer Connections Improvement Program (MCCP).
  lesson_learnt: A connection process where only 5% of enquiries reach an Access Offer
    is a strong signal that the process — not just individual projects — needs structural
    reform; proponents should anticipate long attrition and network businesses should
    invest in process redesign before demand surges overwhelm capacity.
  issue_severity: major
  project_type: network/grid
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: approvals/contracting
  proponent_type: network business
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: re-scoped/adapted
  secondary_failure_mode: coordination & stakeholders
  intervention_note: Western Power launched the MCCP to reorganise the process, eliminate
    unnecessary work, give customers more choice under uncertainty, enable self-service,
    and reduce handovers — reducing timeframe to Access Offer by up to ~50% from a
    3.5-year baseline.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: grid/system stability
