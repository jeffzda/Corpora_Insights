- record_id: ARENA-DLV-69015
  source_title: ARENA Insights Forum Session Summaries and Key Points
  publish_date: 2022-11
  project_name: Green hydrogen export projects (Australia — general)
  what_happened: Australia faces increasing competition from countries with similar
    natural advantages for green hydrogen production that also benefit from greater
    government support — specifically the US Inflation Reduction Act — creating commercial
    feasibility pressure for Australian projects without equivalent domestic policy
    support.
  lesson_learnt: Australian green hydrogen projects must account for international
    policy asymmetry in their business cases — US IRA-style subsidies materially reduce
    the cost of competing projects offshore, and Australian projects without equivalent
    government support will face growing competitiveness challenges that should be
    reflected in feasibility assumptions.
