- record_id: ARENA-DLV-69019
  source_title: ARENA Insights Forum Session Summaries and Key Points
  publish_date: 2022-11
  project_name: Green hydrogen export projects (Australia — general)
  what_happened: Near-term large-scale green hydrogen projects were found to be more
    likely focused on domestic use cases rather than export, because international
    hydrogen supply chains with clear pricing and volume requirements had not yet
    emerged at the time of the forum.
  lesson_learnt: Green hydrogen projects targeting export markets should sequence
    development to capture domestic use cases first — international supply chains
    with stable pricing and volume commitments are not yet established, and projects
    premised on early export revenue face significant commercial risk.
  issue_severity: moderate
  project_type: enabling infrastructure
