  what_happened: At pilot scale, the measured boron distribution coefficients (LB)
    in high-alumina slag (40Al2O3-30SiO2-30CaO) were substantially lower than FactSage
    thermodynamic predictions — the simulation predicted LB ≈ 7 for this system, while
    pilot experiments yielded a maximum LB of 1.25. The enhancement from applied electrical
    current was also modest (estimated 10–20% improvement only).
  lesson_learnt: Thermodynamic equilibrium models systematically overestimate achievable
    distribution coefficients at pilot scale for silicon-slag systems — budget for
    a significant performance gap (potentially 5-fold or greater) between FactSage
    predictions and pilot-scale outcomes, particularly for high-alumina slag compositions,
    and design scale-up experiments to characterise this gap before committing to
    process specifications.
