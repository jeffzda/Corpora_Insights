  what_happened: At pilot scale (337–380 g batches), boron distribution coefficients
    showed no clear trend with alumina content in high-alumina slag (T1 and T3 trials),
    and results were suspected to reflect non-homogeneous concentration distribution
    in the melt rather than true equilibrium values, with some LB values falling below
    1.0 (i.e. boron remaining preferentially in silicon).
  lesson_learnt: At pilot scale, melt homogeneity becomes a significant confounding
    factor in measuring slag-silicon distribution coefficients — design pilot reactors
    with active stirring or longer equilibration times, and interpret distribution
    coefficient measurements with caution when spatial heterogeneity in the melt cannot
    be excluded.
