  publish_date: '2024-05-28'
  project_name: Electrically-Enhanced Recycling Process for EoL Si PV-Cells
  what_happened: Thermodynamic simulations (FactSage) predicted that phosphorus would
    not dissolve significantly in any of the slag systems tested, and experimental
    work confirmed this — phosphorus distribution coefficients (LP) remained between
    0.1 and 0.6 across all conditions, far below the >90% removal target. This required
    a fundamental redesign of the process flowsheet to include a separate vacuum evaporation
    step for phosphorus removal.
  lesson_learnt: When designing multi-impurity removal processes for silicon refining,
    do not assume that a single slag treatment step can address all target impurities
    — phosphorus and boron have fundamentally different thermochemical behaviours,
    and a multi-step flowsheet (slag treatment for boron, vacuum evaporation for phosphorus)
    should be planned from the outset rather than discovered through failed trials.
