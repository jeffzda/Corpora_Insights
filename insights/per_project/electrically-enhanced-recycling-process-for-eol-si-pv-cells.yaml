  publish_date: '2024-05-28'
  project_name: Electrically-Enhanced Recycling Process for EoL Si PV-Cells
  what_happened: 'Vacuum evaporation was identified as the only viable route for phosphorus
    removal from silicon, but simulations showed a fundamental trade-off: at 10-3
    atm (optimal for P removal), only 50% of the initial silicon mass was recovered
    in liquid form due to simultaneous silicon evaporation loss.'
  lesson_learnt: When incorporating vacuum evaporation for phosphorus removal in silicon
    refining processes, explicitly model and account for silicon mass loss (potentially
    50% at optimal phosphorus removal conditions) — this silicon loss directly affects
    process yield and economics and must be factored into material balance calculations
    and cost modelling at the feasibility stage.
