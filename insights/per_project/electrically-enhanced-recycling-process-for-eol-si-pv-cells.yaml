- record_id: ARENA-DLV-60656
  source_title: Electrically-Enhanced Recycling Process for End of Life Si PV Cells
    - Final Report
  publish_date: '2024-05-28'
  project_name: Electrically-Enhanced Recycling Process for EoL Si PV-Cells
  what_happened: When end-of-life solar panel material was melted without flux additions,
    the resulting melt was highly viscous (silica-rich) and metallic phases including
    silver formed as surface droplets without significant coalescence, making recovery
    impractical. The addition of CaO or Na2O fluxes reduced viscosity but at 50 wt%
    flux loading the metallic phases were present at such low concentrations they
    were not visible in cross-section analysis.
  lesson_learnt: When melting shredded end-of-life solar panels for pyrometallurgical
    metal recovery, flux addition alone is insufficient to achieve metal coalescence
    at the ppm concentration levels present — adding carrier metallic silicon (at
    a PV cell:silicon:flux ratio of approximately 2:1:1) is necessary to facilitate
    coalescence of silver and other metals into a recoverable phase.
  issue_severity: moderate
