  what_happened: The project identified that CaF2-containing slag, which was one of
    four slag systems evaluated computationally, had a negative and decreasing influence
    on the boron distribution coefficient with increasing CaF2 concentration, and
    was ruled out for use in experiments. This avoided wasted experimental effort
    on an unproductive pathway.
  lesson_learnt: Computational thermodynamic screening (FactSage) of multiple slag
    systems before committing to laboratory experiments is an effective strategy for
    eliminating unproductive process routes early — in this case, CaF2-containing
    slag was eliminated at the modelling stage, saving experimental resources for
    the three productive slag systems.
