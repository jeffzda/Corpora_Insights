  source_title: Electrically-Enhanced Recycling Process for End of Life Si PV Cells
    - Final Report
  publish_date: '2024-05-28'
  project_name: Electrically-Enhanced Recycling Process for EoL Si PV-Cells
  what_happened: Silver was confirmed to report almost entirely to the silicon phase
    (not the slag) during slag treatment, with distribution coefficients Lslag/Si
    Ag < 0.02 in thermodynamic simulations and near-zero in experimental measurements.
    This means silver recovery is achievable via controlled cooling to crystallise
    Ag intermetallics, improving the economics of the overall recycling process.
  lesson_learnt: In designing EoL silicon PV recycling processes, silver recovery
    can be integrated into the pyrometallurgical route at negligible additional process
    cost — silver partitions strongly to silicon during slag treatment and can be
    recovered as Ag-intermetallics (~80% Ag) by controlled cooling of the silicon
    phase, providing a significant economic co-product that should be factored into
    process economics from the feasibility stage.
