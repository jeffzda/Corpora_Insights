  publish_date: '2024-05-28'
  project_name: Electrically-Enhanced Recycling Process for EoL Si PV-Cells
  what_happened: Multi-stage slag treatment was demonstrated to be substantially more
    effective than single-stage treatment for boron removal. Experimental work showed
    boron concentration reduced from 270 ppmw to 6.0 ppmw across 4 stages (97.8% removal),
    compared to a single-stage result of approximately 110–120 ppmw from prior published
    work using similar conditions.
  lesson_learnt: For silicon purification targeting solar-grade specifications (<0.38
    ppmw boron), single-stage slag treatment is insufficient regardless of slag composition
    or temperature — design multi-stage slag treatment into the process from the start,
    using a new slag charge at each stage with a slag-to-silicon mass ratio of approximately
    2:1 to achieve approximately 78% boron reduction per stage.
