    decreased rather than increased, contradicting FactSage thermodynamic simulation
    predictions which showed a monotonic increase in boron distribution coefficient
    with increasing alumina content up to ~49 wt% Al2O3.
  lesson_learnt: Thermodynamic databases for silicon-slag systems (particularly the
    FSupsi/FToxid databases in FactSage) may not accurately predict behaviour at high
    alumina concentrations — experimental validation is essential before using high-alumina
    slag compositions in process design, and optimum alumina content for boron removal
    should be determined experimentally rather than from simulation alone.
