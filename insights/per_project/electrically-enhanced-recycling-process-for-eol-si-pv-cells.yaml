  evidence_excerpt: The results from the thermodynamic modelling and experimental
    studies show that the conditions for boron and phosphorus removal are different.
    These conditions can not be met using the same conditions used using the slag
    treatment (both non-enhanced and enhanced)... Boron removal can be done using
    the slag treatment, either using multi-stage slag treatment or electrically-enhanced
    slag treatment. Phosphorus, however, will require different treatment.
