- record_id: ARENA-DLV-60666
  source_title: Electrically-Enhanced Recycling Process for End of Life Si PV Cells
    - Final Report
  publish_date: '2024-05-28'
  project_name: Electrically-Enhanced Recycling Process for EoL Si PV-Cells
  what_happened: 'The proposed process flowsheet for EoL silicon PV recycling evolved
    from a single-step electrically-enhanced slag treatment concept into a mandated
    multi-stage process: (1) multi-stage or electrically-enhanced slag treatment for
    boron removal, (2) vacuum treatment for phosphorus removal, and (3) controlled
    cooling/zone refining for silver recovery as intermetallics. This three-stage
    complexity was not apparent at project inception.'
  lesson_learnt: Pyrometallurgical routes for EoL silicon PV recycling inherently
    require multi-stage processing to address boron, phosphorus, and silver simultaneously
    — do not design pilot systems around a single-step refining concept; instead,
    plan and cost a minimum three-stage flowsheet from the outset to avoid mid-project
    rescoping and underestimation of capital and operating costs.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: pilot
  lifecycle_phase: concept/feasibility
