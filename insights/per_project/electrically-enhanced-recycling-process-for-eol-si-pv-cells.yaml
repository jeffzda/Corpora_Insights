  what_happened: Use of alumina crucibles throughout the laboratory experiments caused
    uncontrolled contamination of the slag with Al2O3 (rising from initial 0–10 wt%
    to 8–15 wt% during experiments), and the ICP-AES analysis also detected elevated
    aluminium and iron in silicon samples from multi-stage experiments, potentially
    attributed to crucible dissolution and comminution contamination respectively.
  lesson_learnt: In high-temperature silicon-slag experiments using alumina crucibles,
    crucible dissolution into the slag is significant and must be quantified and accounted
    for in data interpretation — report final rather than initial slag composition,
    and consider alternative crucible materials or protective linings when designing
    experiments where alumina content must be precisely controlled.
