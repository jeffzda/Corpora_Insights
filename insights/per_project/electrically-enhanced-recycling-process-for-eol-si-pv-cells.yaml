  what_happened: The project successfully demonstrated that CaO-MgO-SiO2 slag achieved
    approximately 23% faster boron removal rate and 40% lower final boron concentration
    than CaO-Al2O3-SiO2 slag at 1500°C, attributed to MgO reducing slag viscosity.
    This finding was confirmed at both laboratory kinetic scale and pilot scale.
  lesson_learnt: For silicon refining via slag treatment, CaO-MgO-SiO2 slag should
    be evaluated as a preferred alternative to CaO-Al2O3-SiO2 slag where faster kinetics
    are required — the viscosity reduction from MgO addition provides both higher
    rate and lower equilibrium boron concentration at lower temperatures, potentially
    reducing energy costs.
