  what_happened: Out of 9 pilot-scale experiments conducted, only 4 (Trial 0, 1, 3,
    and 7) yielded successful and meaningful results. Five trials failed due to short
    circuits (silicon touching both electrodes), broken molybdenum wires causing loss
    of current, or repeated electrode failure mid-experiment.
  lesson_learnt: In electrically-enhanced pilot-scale pyrometallurgical reactors,
    electrode configuration and material selection (particularly molybdenum wire connections)
    are critical failure points — validate electrode integrity and prevent silicon
    bridging between electrodes before conducting extended runs, as over half of pilot
    trials may be lost to these failure modes.
