  project_name: SP Energy Networks Accelerating Renewable Connections
  what_happened: SP Energy Networks developed a two-stage commercial agreement approach and an online curtailment analysis tool to allow renewable generators to connect to a distribution network approaching
    saturation, enabling connection sooner while wider reinforcement works proceeded concurrently.
  lesson_learnt: Use active network management and staged commercial agreements to allow renewable generators to connect ahead of full network reinforcement — this avoids over-reservation of capacity and
    enables faster connection without waiting for costly augmentation to complete.
