- record_id: ARENA-DLV-61854
  source_title: Activation of the ARENA DR Trial Portfolio Under the SN RERT Panel
  publish_date: 2019-01
  project_name: ARENA-AEMO Demand Response RERT Trial
  what_happened: DR capacity that has been dispatched in response to high wholesale
    market prices prior to issuance of an ITT cannot be counted as RERT capacity for
    the duration of the ITT, meaning the SN RERT activation would produce no additional
    demand reduction beyond what the wholesale price signal already caused.
  lesson_learnt: DR proponents and aggregators must carefully manage the use of customer
    load reduction across market mechanisms — dispatching DR capacity for wholesale
    price response before a RERT ITT is issued can effectively nullify the incremental
    value of the RERT activation and may create contractual compliance issues.
