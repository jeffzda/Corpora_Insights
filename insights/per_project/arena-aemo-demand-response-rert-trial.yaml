- record_id: ARENA-DLV-62615
  source_title: Baselining the ARENA-AEMO Demand Response RERT Trial
  publish_date: 2019-09
  project_name: ARENA-AEMO Demand Response RERT Trial
  what_happened: A larger 40% adjustment cap substantially reduced the proportion
    of restricted baseline adjustments for Victorian commercial loads (from 30% restricted
    to 0–3% restricted) and NSW commercial loads (from 43% to none), indicating the
    20% cap was routinely binding and suppressing measured DR for commercial participants.
  lesson_learnt: A 40% adjustment cap should be adopted for commercial DR portfolios
    in place of the 20% cap — the 20% cap was routinely binding for commercial loads,
    systematically under-calculating DR delivered; the gaming risk of a 40% cap is
    manageable given typical RERT notice periods and the cost of artificial pre-event
    consumption increases.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: Tested 40% adjustment cap across all alternative baseline methods;
    commercial sector showed near-complete elimination of cap-restricted adjustments.
  transferability: moderate
  delay_magnitude: null
  technology_domain: demand response
