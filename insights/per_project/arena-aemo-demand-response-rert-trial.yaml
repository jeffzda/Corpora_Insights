  source_title: Activation of the ARENA DR Trial Portfolio Under the SN RERT Panel
  publish_date: 2019-01
  project_name: ARENA-AEMO Demand Response RERT Trial
  what_happened: During the 24 January RERT event, the activation window for Enel
    X and United Energy was changed after the ITT was accepted — Enel X's activation
    window shifted from 16:30–19:30 (as in the ITT) to 17:00–21:00, and United Energy's
    activation period was similarly changed — creating uncertainty about how performance
    would be measured and payments calculated.
  lesson_learnt: RERT contracts and operating procedures must clearly define how changes
    to activation windows after ITT acceptance affect performance assessment and payment
    calculations; ambiguity on this point creates commercial risk for proponents and
    operational uncertainty during events.
