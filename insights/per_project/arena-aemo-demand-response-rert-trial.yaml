- record_id: ARENA-DLV-61856
  source_title: Activation of the ARENA DR Trial Portfolio Under the SN RERT Panel
  publish_date: 2019-01
  project_name: ARENA-AEMO Demand Response RERT Trial
  what_happened: During the January 2019 RERT events, the binary ITT response mechanism
    (accept or reject only) meant proponents unable to fully commit to the requested
    MW or time period had to reject the ITT and request a revised one from AEMO, adding
    friction and delay to the activation process under time-critical emergency conditions.
  lesson_learnt: The SN RERT ITT process should be redesigned to allow proponents
    to respond with a partial 'MW available' quantity rather than a binary yes/no,
    reducing round-trip delays in emergency activations and enabling more accurate
    capacity matching.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: regulatory & approvals
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: The report recommended allowing proponents to respond to an ITT
    with a 'MW available' amount to streamline the process.
  transferability: moderate
  delay_magnitude: null
  technology_domain: demand response
  source_pages: &id006
  - 8
  evidence_excerpt: At present the only responses available to an ITT are 'yes', or
    'no'. A proponent cannot accept an ITT for a level of DR or a time other than
    what is specified in the ITT. If the proponent cannot say 'yes' unequivocally,
    they need to reject the ITT, inform AEMO operations of what they can respond to
    and AEMO needs to prepare and send a new ITT.
