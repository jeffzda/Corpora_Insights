- record_id: ARENA-DLV-62611
  source_title: Baselining the ARENA-AEMO Demand Response RERT Trial
  publish_date: 2019-09
  project_name: ARENA-AEMO Demand Response RERT Trial
  what_happened: Highly intermittent loads in the RERT Trial portfolio could not be
    assessed using any average-demand baselining methodology because their instantaneous
    demand characteristics (e.g. a 1 MW press operating for 5 minutes per hour) are
    functionally identical to steady-state loads in energy terms but materially different
    in power system terms.
  lesson_learnt: Highly intermittent loads should be excluded from DR programs using
    average-demand baselines, or measured using instantaneous or 5-minute demand baselines
    — a facility delivering 83 kWh over an hour via a 1 MW intermittent load creates
    fundamentally different grid risk than one delivering it at a steady 83 kW, and
    the distinction is invisible to any energy-based baseline.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: demand response
  source_pages: &id023
  - 13
  evidence_excerpt: Assessment of the performance of these loads in a RERT event is
    not amenable to an average demand methodology (which includes the '10 of 10' and
    all the alternatives assessed)... A baseline based on instantaneous demand (or
    5-minute average demand) could provide a more accurate assessment of the level
    of demand response delivered.
