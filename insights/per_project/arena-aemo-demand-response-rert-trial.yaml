  secondary_failure_mode: regulatory & approvals
  intervention_note: Enel X notified AEMO that its activation would follow the original
    ITT window (17:00–19:30) with best-endeavours DR beyond 19:30, providing a practical
    workaround pending formal clarification.
  transferability: moderate
