- record_id: ARENA-DLV-61858
  source_title: Activation of the ARENA DR Trial Portfolio Under the SN RERT Panel
  publish_date: 2019-01
  project_name: ARENA-AEMO Demand Response RERT Trial
  what_happened: The current RERT performance payment mechanism, which caps payments
    at the MW agreed in the ITT and measures performance per 30-minute trading interval,
    creates a risk that payments are withheld for both under- and over-delivery within
    individual intervals even if aggregate performance across the activation period
    meets the contracted level.
  lesson_learnt: RERT payment structures should be based on average MW delivered across
    the full activation period rather than per 30-minute interval, to avoid penalising
    proponents for natural variation in DR delivery and to better reflect the genuine
    contribution of demand response to emergency reliability events.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: regulatory & approvals
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The report proposed basing performance on the average MW delivered
    per 30 minutes across the entire RERT activation period as a potential solution.
  transferability: moderate
  delay_magnitude: null
  technology_domain: demand response
  source_pages: &id008
  - 8
  evidence_excerpt: Performance payments are currently based on the MW delivered within
    each 30-minute trading interval, and capped at the amount at the DR capacity agreed
    upon in the ITT. This has the potential to result in payments being withheld for
    both under- and over-delivery of the agreed DR capacity.
  confidence_note: null
