  source_title: Activation of the ARENA DR Trial Portfolio Under the SN RERT Panel
  publish_date: 2019-01
  project_name: ARENA-AEMO Demand Response RERT Trial
  what_happened: During the 24 January RERT event, Powershop notified customers at
    15:33 for a 16:30 activation — a 57-minute lead time — and successfully activated
    its portfolio on time, demonstrating that early customer notification is critical
    for manual behavioural DR programs reliant on SMS-based customer engagement.
  lesson_learnt: For demand response programs relying on manual customer behavioural
    response, proponents should notify customers as early as possible after accepting
    an ITT — the January events demonstrated that maximising the notification lead
    time improves the likelihood of on-time customer response.
