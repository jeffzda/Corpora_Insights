- record_id: ARENA-DLV-62604
  source_title: Baselining the ARENA-AEMO Demand Response RERT Trial
  publish_date: 2019-09
  project_name: ARENA-AEMO Demand Response RERT Trial
  what_happened: Victorian commercial NMIs showed poor '10 of 10' baseline accuracy
    (good accuracy in only 48% of simulated events; acceptable in 76%), primarily
    because two very large NMIs dominated the portfolio aggregate load (92%) while
    also exhibiting significant half-hourly load variation.
  lesson_learnt: Portfolio-level baselining accuracy is heavily distorted when one
    or two large sites dominate aggregate consumption and have highly variable loads
    — DR program designers should assess load concentration within portfolios and
    apply site-specific or tiered baseline approaches to prevent dominant sites from
    undermining portfolio-level measurement.
