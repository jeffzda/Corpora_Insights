- record_id: ARENA-DLV-62607
  source_title: Baselining the ARENA-AEMO Demand Response RERT Trial
  publish_date: 2019-09
  project_name: ARENA-AEMO Demand Response RERT Trial
  what_happened: Load profiles of non-PV residential NMIs differed substantially between
    consecutive hot days (8 and 9 February 2017) with virtually identical maximum
    and average temperatures, with peak demand on the second day being materially
    lower and earlier, undermining the like-weather-day baseline assumption.
  lesson_learnt: Consecutive hot days produce materially different residential load
    shapes even at identical temperatures, likely due to overnight air-conditioning
    carry-over — RERT baseline designers must account for the sequential-hot-day effect
    when constructing residential DR baselines, as neither the '10 of 10' nor a like-weather-day
    approach captures this dynamic.
