  source_title: Activation of the ARENA DR Trial Portfolio Under the SN RERT Panel
  publish_date: 2019-01
  project_name: ARENA-AEMO Demand Response RERT Trial
  what_happened: The declaration process for SN RERT capacity lacked sufficient controls,
    with proponents able to update declared MW capacity themselves via the AEMO RERT
    portal without a structured review or confirmation step, leading to inaccurate
    availability information at the time of the January 2019 emergency events.
  lesson_learnt: The RERT declaration process requires a formalised review mechanism
    to ensure all declarations are accurate and agreed by all relevant parties before
    ITTs are issued; self-service declaration updates without validation introduce
    risk of capacity shortfalls during emergency activations.
