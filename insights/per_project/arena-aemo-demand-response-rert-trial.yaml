  what_happened: Residential NMIs with rooftop PV systems in Victoria produced zero
    good or acceptable baseline accuracy across all tested methodologies (0% RRMSE
    <10% and 0% RRMSE <20%), because net metering prevented disaggregation of PV generation
    from household consumption.
  lesson_learnt: Net-metered rooftop PV makes household consumption unbaseable using
    any current average-demand methodology — DR programmes enrolling residential PV
    customers should require gross metering of PV output as a prerequisite for participation,
    or adopt control-group-based measurement that avoids the need for individual site
    baselines.
