  source_title: Baselining the ARENA-AEMO Demand Response RERT Trial
  publish_date: 2019-09
  project_name: ARENA-AEMO Demand Response RERT Trial
  what_happened: The 20% adjustment factor cap in the '10 of 10' methodology restricted
    baseline adjustments for 77% of residential simulated event days, compared to
    14–30% for Victorian commercial and industrial loads, resulting in systematic
    under-calculation of demand response for residential participants.
  lesson_learnt: The 20% adjustment cap is structurally unsuitable for residential
    DR portfolios where pre-event consumption conditions frequently differ substantially
    from qualifying days — a higher cap (40%) or a fundamentally different approach
    should be used for residential participants, with awareness that a larger cap
    introduces gaming risk if event notice periods are long.
  issue_severity: moderate
  project_type: DER/customer-side
