  source_title: Activation of the ARENA DR Trial Portfolio Under the SN RERT Panel
  publish_date: 2019-01
  project_name: ARENA-AEMO Demand Response RERT Trial
  what_happened: During the January 2019 RERT events, Powershop's declared capacity
    dropped from 5 MW to 4 MW immediately before the ITT was issued due to the temporary
    unavailability of the Monash Cogeneration facility, illustrating how DR capacity
    dependent on specific assets can be vulnerable to last-minute reductions.
  lesson_learnt: DR aggregators whose capacity relies on individual large assets should
    maintain contingency plans or diversified portfolios to avoid sudden capacity
    reductions at the moment of dispatch; single-asset dependencies create reliability
    risk during emergency activations.
