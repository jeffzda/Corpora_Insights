  project_name: ARENA-AEMO Demand Response RERT Trial
  what_happened: For consistently variable commercial loads (e.g. retail facilities
    with extended Thursday trading hours), the standard '10 of 10' achieved good accuracy
    in only 76% of simulated events, but adding day-of-week combined with temperature
    (either maximum or average) with a 40% adjustment cap achieved 100% good accuracy.
