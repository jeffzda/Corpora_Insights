- record_id: ARENA-DLV-62614
  source_title: Baselining the ARENA-AEMO Demand Response RERT Trial
  publish_date: 2019-09
  project_name: ARENA-AEMO Demand Response RERT Trial
  what_happened: The RERT Trial baseline methodology applied the '10 of 10' at portfolio
    (aggregated) level rather than individual NMI level, which masked load-type heterogeneity
    within portfolios and meant that a few atypical large sites could dominate measured
    DR outcomes.
  lesson_learnt: Portfolio-level baselining aggregates away load-type heterogeneity
    — future DR programs should consider whether portfolio-level aggregation is appropriate
    or whether sub-portfolio or site-level baselines should be applied to large or
    atypical sites to avoid distortion of overall DR measurement.
