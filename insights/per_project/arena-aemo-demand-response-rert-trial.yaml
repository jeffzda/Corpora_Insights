- record_id: ARENA-DLV-62602
  source_title: Baselining the ARENA-AEMO Demand Response RERT Trial
  publish_date: 2019-09
  project_name: ARENA-AEMO Demand Response RERT Trial
  what_happened: For NSW industrial NMIs, the '10 of 10' baseline achieved good accuracy
    (RRMSE <10%) in only 11% of simulated event days and acceptable accuracy in only
    29%, far below the 83% and 97% achieved for Victorian industrial NMIs. No alternative
    methodology tested improved on these results.
  lesson_learnt: Where industrial loads exhibit high half-hourly variability (20–50%
    swings), no standard average-demand baselining approach will produce reliable
    DR measurement — proponents should identify and segregate such loads before entering
    a DR program, and a fundamentally different measurement approach (e.g. instantaneous
    demand baselining) should be considered.
