- record_id: ARENA-DLV-61851
  source_title: Activation of the ARENA DR Trial Portfolio Under the SN RERT Panel
  publish_date: 2019-01
  project_name: ARENA-AEMO Demand Response RERT Trial
  what_happened: During the January 2019 RERT events, EnergyAustralia and Planet Innovation
    had declared 0 MW available and were not dispatched despite having contracted
    capacity of 12 MW, 18 MW, and 5 MW respectively, meaning significant contracted
    DR capacity was unavailable when the grid needed it most.
  lesson_learnt: DR proponents must maintain accurate and up-to-date availability
    declarations in the AEMO RERT portal; contracted capacity that is declared unavailable
    cannot be called upon during emergency events, reducing the effective reserve
    available to the grid.
