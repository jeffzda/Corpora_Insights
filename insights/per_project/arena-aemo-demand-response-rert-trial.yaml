- record_id: ARENA-DLV-62613
  source_title: Baselining the ARENA-AEMO Demand Response RERT Trial
  publish_date: 2019-09
  project_name: ARENA-AEMO Demand Response RERT Trial
  what_happened: AGL developed and deployed a proprietary anchoring-based baseline
    methodology within the RERT Trial that combined temperature-regression load forecasting
    over five weeks, de-biasing against recent actuals, and anchoring to pre/post
    event consumption — stating it was suitable for both PV and non-PV customers,
    outperforming the '10 of 10'.
  lesson_learnt: Proponents with diverse customer portfolios including residential
    and PV customers should develop regression-based anchoring baselines rather than
    relying on the standard '10 of 10' — AGL's approach of combining a temperature-adjusted
    shape forecast with de-biasing and event-day anchoring is a replicable model for
    future DR programs.
