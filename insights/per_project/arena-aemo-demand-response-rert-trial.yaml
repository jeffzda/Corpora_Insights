  source_title: Baselining the ARENA-AEMO Demand Response RERT Trial
  publish_date: 2019-09
  project_name: ARENA-AEMO Demand Response RERT Trial
  what_happened: The '10 of 10' baselining methodology adopted from CAISO for the
    RERT Trial proved inadequate for several load types encountered in the trial portfolio,
    including residential, highly variable industrial, and PV-influenced loads, producing
    inaccurate demand response measurements for those segments.
  lesson_learnt: Before adopting a baselining methodology for a demand response trial,
    verify it is suitable for all load types in the participant portfolio — the '10
    of 10' method was designed for consistent large industrial loads and performs
    poorly for residential, highly variable, or PV-influenced loads that now constitute
    a significant share of DR programs.
