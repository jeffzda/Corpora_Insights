- record_id: ARENA-DLV-72002
  source_title: Australian Energy Resource Assessment — Second Edition, 2014
  publish_date: '2014'
  project_name: Geodynamics Innamincka Deeps — Jolokia-1 and Savina-1 Wells
  what_happened: At the Innamincka Deeps project, hydraulic stimulation was unsuccessful
    in the Jolokia-1 well (278°C at 4911 m depth), and the Savina-1 well was suspended
    after a stuck drill pipe at 3700 m, representing two well failures that curtailed
    development of these prospect areas.
  lesson_learnt: Deep geothermal EGS drilling carries high well-level failure risk
    — both stuck drill pipe and unsuccessful hydraulic stimulation can render expensive
    wells unproductive; project plans should include contingency for well failure
    and avoid concentrating development progress on single wells.
