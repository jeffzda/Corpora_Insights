- record_id: ARENA-DLV-71070
  source_title: Hybrid Power Generation for Australian Off-Grid Mines
  publish_date: 2018-06
  project_name: Diavik Diamond Mine Wind-Diesel Hybrid
  what_happened: The Diavik Diamond Mine in Canada installed a 9.2 MW four-turbine wind plant in 2012 at a cost of AUD $32M, which provided approximately 10% of average power demand (up to 50% at times),
    reducing annual OPEX by 25% (AUD $6M per annum) and greenhouse gas emissions by 6%.
  lesson_learnt: Even a relatively modest wind-diesel hybrid integration (~10% average renewable power fraction) at a remote mine can deliver substantial OPEX savings — at Diavik, a $32M investment yielded
    $6M per annum in savings, demonstrating that the business case for hybrid power is strongest at mines with high diesel logistics costs.
