- record_id: ARENA-DLV-9124
  source_title: State of DER Technology Integration Report
  publish_date: 2021-02
  project_name: DER Impact on Bulk Power System Operations
  what_happened: AEMO's ongoing program found that passive distributed PV cannot be
    curtailed by AEMO even under extreme system conditions, leading to an increasingly
    less dispatchable power system. This was identified as a critical gap requiring
    action, with the mass-disconnection risk from DPV during system disturbances identified
    as a priority issue requiring standards changes.
  lesson_learnt: The uncontrollability of passive distributed PV is a structural bulk
    system security risk that worsens with scale — project sponsors and regulators
    should prioritise standards changes to require curtailability and improved disturbance
    withstand for new DPV installations rather than waiting for incidents to force
    action, as the cost of inaction grows with each installation.
  issue_severity: major
  project_type: network/grid
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: operations
  proponent_type: government/public-sector body
  delay_category: null
  failure_mode: regulatory & approvals
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: AEMO's Renewable Integration Study recommended DPV generation
    curtailment capability at the device level nationally and a curtailment scheme
    to be implemented in SA immediately; Standards Australia revision of AS/NZS 4777.2
    was progressed on an accelerated timeline.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
