- record_id: ARENA-DLV-9125
  source_title: State of DER Technology Integration Report
  publish_date: 2021-02
  project_name: DER Impact on Bulk Power System Operations
  what_happened: AEMO identified budget constraints as a potential limitation on its
    ability to extend the DER bulk power system operations program to a longer-term
    BAU function from July 2021, despite identifying this as necessary to support
    operational teams integrating DER into their models.
  lesson_learnt: Transition from ARENA-funded research programs to BAU operational
    capability requires explicit budget allocation and institutional commitment from
    the receiving organisation — programme designers should not assume research findings
    will be operationalised without dedicated resourcing and a formal transition plan.
