- record_id: ARENA-DLV-45660
  source_title: Pollination - Community Energy Report
  publish_date: 2024-07
  project_name: Totally Renewable Yackandandah
  what_happened: Totally Renewable Yackandandah (TRY) progressively delivered a range of behind-the-meter energy assets over a decade, starting with a $5,000 LED lighting loan in 2017 and scaling to rooftop
    solar, community batteries, microgrids, a Virtual Power Plant encompassing 210+ properties, and a $275,000 emergency generator program. The initial objective of a whole-of-town microgrid was replaced
    by a more nuanced incremental approach as the team gained experience.
  lesson_learnt: Starting with small, funded, behind-the-meter projects and building complexity incrementally allows volunteer community energy groups to develop technical literacy, establish revolving
    funding mechanisms, and avoid the economic headwinds of large grid-connected assets — a decade-long phased approach is more sustainable than aiming for a whole-of-town microgrid from the outset.
