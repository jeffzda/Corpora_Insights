- record_id: ARENA-DLV-45661
  source_title: Pollination - Community Energy Report
  publish_date: 2024-07
  project_name: Totally Renewable Yackandandah
  what_happened: TRY's volunteer team included individuals with familiarity with energy markets, key power system participants, technical elements of the power grid, and knowledge of where to source expertise.
    This literacy allowed TRY to pursue achievable, well-resolved projects with local relevance and build complexity progressively. The volunteer workload has been heavy and remains substantial ten years
    into the project.
  lesson_learnt: Resident technical literacy in energy markets and grid systems is a prerequisite for a volunteer-run community energy group to successfully deliver increasingly complex projects — without
    this, groups face higher costs from rework, suboptimal design, and reliance on paid technical consultants.
