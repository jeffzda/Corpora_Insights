- record_id: ARENA-DLV-72029
  source_title: Australian Energy Resource Assessment – Second edition, 2014
  publish_date: '2014'
  project_name: Australian Ocean Energy Demonstration Projects (ARENA-funded)
  what_happened: ARENA allocated approximately A$86 million across four ocean energy
    demonstration projects using different wave technologies (Victorian Wave Partners
    19 MW PowerBuoy array, Carnegie Wave Energy CETO pilot 2 MW, BioPower Systems
    bioWAVE 0.25 MW, Oceanlinx greenWave 1 MW). At the time of the document, none
    of the projects had yet delivered electricity to the grid, with most still at
    proof-of-concept or pre-commercial stage.
  lesson_learnt: Wave energy technology diversity — with many competing converter
    designs at prototype stage — means portfolio-level funding programmes should explicitly
    plan for the possibility that not all funded technologies will reach commercial
    grid delivery; milestone-gated funding structures with clear grid-connection delivery
    criteria are important to manage this risk.
