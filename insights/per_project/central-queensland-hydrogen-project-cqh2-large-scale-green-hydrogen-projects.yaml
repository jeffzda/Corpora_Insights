- record_id: ARENA-DLV-69012
  source_title: ARENA Insights Forum Session Summaries and Key Points
  publish_date: 2022-11
  project_name: Central Queensland Hydrogen Project (CQH2) / Large-scale green hydrogen
    projects
  what_happened: Initial plans for a large-scale green hydrogen project were scaled
    up from a 40MW electrolyser to a capacity of between 150MW and 200MW in order
    to achieve commercial feasibility. The smaller scale was found to be sub-commercial.
  lesson_learnt: Scale is a prerequisite for commercial feasibility in green hydrogen
    export projects — initial development concepts at ~40MW are sub-commercial and
    projects should be planned and financed at 150MW+ from the outset, developed in
    phases to manage technology and commercial risk.
