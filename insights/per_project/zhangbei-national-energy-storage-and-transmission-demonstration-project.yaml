- record_id: ARENA-DLV-72314
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects - First Edition Results'
  publish_date: '2014'
  project_name: Zhangbei National Energy Storage and Transmission Demonstration Project
  what_happened: The State Grid of China commissioned the 216MW Zhangbei hybrid project (100MW wind, 40MW solar PV, 20–36MW battery storage) in 2011 at a total investment of approximately AUD 1.88 billion,
    demonstrating that large-scale battery storage combined with intelligent transmission can enable predictable, dispatchable delivery of utility-scale wind and solar generation to the national transmission
    grid.
  lesson_learnt: At utility scale, battery storage integrated alongside hybrid wind-solar generation — rather than wind or solar alone — is necessary to convert intermittent renewable output into fully
    dispatchable supply; projects pursuing dispatchable renewable generation at scale should plan for battery storage as a core system component rather than an add-on.
