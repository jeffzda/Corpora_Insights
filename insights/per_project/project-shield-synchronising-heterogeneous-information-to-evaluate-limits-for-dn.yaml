  what_happened: Assumption-based and limited-data estimation methods for setting
    DER export limits were found to be excessively conservative, unnecessarily restricting
    solar exports, reducing household feed-in tariff revenue, slowing DER uptake,
    and deferring the transition benefits — while also carrying hidden long-term costs
    from underutilised grid and potential corrective investments.
  lesson_learnt: When selecting methods for establishing hosting capacity limits,
    account for the full system cost of conservatism in simpler methods — the apparent
    cost savings of assumption-based or limited-data approaches are offset by lost
    renewable energy value, reduced consumer returns, and potential augmentation costs
    that state estimation could have deferred.
