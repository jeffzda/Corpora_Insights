  what_happened: The project found that many vendors lacked data expertise and were
    either unaware of the legalities of data sharing, believed it to be illegal, or
    had high workloads that caused them to deprioritise project data requests despite
    expressing willingness to participate.
  lesson_learnt: Data-sharing arrangements with device vendors should be supported
    by a pre-agreed, industry-recognised commercial contract template addressing privacy,
    legality, and liability — the absence of such a template means each vendor engagement
    requires individual legal work, which is time-consuming, costly, and creates inconsistent
    outcomes.
