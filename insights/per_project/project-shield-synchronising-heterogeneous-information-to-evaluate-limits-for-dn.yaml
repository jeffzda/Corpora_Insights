- record_id: ARENA-DLV-35619
  source_title: Project SHIELD - Consolidated Analysis Report
  publish_date: 2024-01
  project_name: Project SHIELD
  what_happened: The absence of standardised data reporting protocols across smart
    meters, inverters, and IoT devices meant that measurement parameters such as voltage
    were collected using inconsistent methods (averages, maximums, instantaneous readings)
    across different device types, making data integration and comparison extremely
    difficult.
  lesson_learnt: Industry bodies and regulators should establish and publish standardised
    data schemas for smart meters, inverters, and IoT devices specifying measurement
    parameters, accuracy levels, time resolution (e.g., 5- or 10-minute intervals),
    measurement types (instantaneous or average), and mandatory fields such as NMI
    and timestamp — projects attempting to integrate heterogeneous data without these
    standards will spend disproportionate effort on data reconciliation.
