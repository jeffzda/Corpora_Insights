- record_id: ARENA-DLV-50056
  source_title: Project SHIELD - Final Knowledge Sharing Report
  publish_date: 2024-07
  project_name: Project SHIELD
  what_happened: The AEMC proposed that smart meter data be batched and delivered
    to DNSPs daily, but the project found that DOE calculations for dynamic network
    management require near-real-time data — using data up to 24 hours old produces
    DOEs based on past rather than current network conditions.
  lesson_learnt: When designing systems that rely on smart meter data for dynamic
    operating envelopes or real-time network management, do not rely on daily-batch
    AMI delivery — procure near-real-time data from alternative sources or design
    state estimation to compensate for data latency.
