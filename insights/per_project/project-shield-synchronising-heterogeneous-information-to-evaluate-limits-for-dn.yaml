    devices such as inverters and smart meters could theoretically be retrieved, the
    cost of establishing the required infrastructure and systems for a short-duration
    project was prohibitive. Accessing this data also required cooperation from third
    parties (retailers, meter providers) outside the project consortium, which proved
    difficult to secure.
