  what_happened: Data integration for the DSSE proved more challenging than anticipated
    because data streams, while having clear definitions and cloud API access, varied
    in time resolution and lacked synchronised time clocks, requiring development
    and testing of data adapters to accept various formats and careful time-alignment
    before state estimation could proceed.
  lesson_learnt: Data integration timelines for multi-source network analytics projects
    should be extended to account for time-synchronisation and format alignment work
    — assume that all incoming data streams will have different time resolutions and
    unsynchronised clocks, and budget for development and testing of data adapters
    for each source type as a formal work package.
