  what_happened: Consumers were found to be generally sceptical about sharing their
    data with networks. Some vendors required customer permissions before sharing
    data; others were less concerned. This consumer data-sharing hesitancy was an
    inhibiting factor throughout the project.
  lesson_learnt: Projects requiring consumer-level data sharing with network operators
    should plan for consumer engagement and incentivisation strategies from the outset
    — close engagement and tangible incentives may shift consumer attitudes on a case-by-case
    basis, but broad consumer scepticism should be treated as a structural constraint.
