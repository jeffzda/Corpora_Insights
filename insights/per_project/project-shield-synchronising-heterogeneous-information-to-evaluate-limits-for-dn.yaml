- record_id: ARENA-DLV-27921
  source_title: Project SHIELD Stage 1 Outcomes Report
  publish_date: 2022-04
  project_name: Project SHIELD
  what_happened: Devices installed at customer premises (solar inverters, home energy
    management systems, IoT devices) were designed to serve customer and OEM purposes,
    not to provide network-useful engineering data — as a result, most behind-the-meter
    sensors provided voltage-only measurements rather than the full voltage, active
    power and reactive power set needed for state estimation.
  lesson_learnt: Do not assume that commercially available BTM devices will provide
    the full set of engineering measurements required for network state estimation
    — a significant proportion will provide voltage only, and projects should design
    their measurement strategies to account for this systematic gap in reactive and
    active power data from BTM sources.
