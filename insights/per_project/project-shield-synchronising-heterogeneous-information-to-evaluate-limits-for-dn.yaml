  project_name: Project SHIELD
  what_happened: The project found that the location of data sources within the LV
    network architecture had a critical impact on the accuracy of DER hosting capacity
    estimation, beyond the volume of data collected — data from certain network locations
    provided substantially more value to the state estimation model than data from
    other locations.
  lesson_learnt: When designing data collection strategies for LV network state estimation,
    optimise device placement for electrical network topology — data from strategically
    located nodes (particularly household connection points combined with network
    device data) improves state estimation accuracy more than increasing device density
    at sub-optimal locations.
