- record_id: ARENA-DLV-50051
  source_title: Project SHIELD - Final Knowledge Sharing Report
  publish_date: 2024-07
  project_name: Project SHIELD
  what_happened: At project commencement in 2020, smart meter penetration was approximately
    20% of NEM households outside Victoria, and commercial arrangements for capturing
    and delivering power quality data to networks were limited and expensive — driven
    by high data transport, validation, and storage costs.
