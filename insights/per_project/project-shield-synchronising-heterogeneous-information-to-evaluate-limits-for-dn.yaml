  source_title: Project SHIELD - Consolidated Analysis Report
  publish_date: 2024-01
  project_name: Project SHIELD
  what_happened: The project encountered significant communication difficulties with
    vendors and between network partners due to inconsistent terminology — terms such
    as 'feeders' and 'circuits' were used differently across organisations, and vendors
    described data types such as voltage without understanding whether they were providing
    averages, maximums, or instantaneous readings.
  lesson_learnt: Develop a detailed data dictionary defining all required data types
    (distinguishing historical vs real-time, device-level vs aggregated, instantaneous
    vs average, engineering vs energy data) before approaching vendors, and require
    vendors to confirm alignment with this dictionary before proceeding to data sharing
    agreements.
