- record_id: ARENA-DLV-50064
  source_title: Project SHIELD - Final Knowledge Sharing Report
  publish_date: 2024-07
  project_name: Project SHIELD
  what_happened: Scenario analysis on feeder CMA9A demonstrated that conservative
    adjustments to operational limits — such as reducing MV current limits by 10%
    or narrowing statutory voltage bands — to compensate for estimation uncertainty
    resulted in materially reduced DOE capacity allocations, in some cases reducing
    available export to zero.
  lesson_learnt: Reducing uncertainty in network state estimates through better data
    and DSSE directly unlocks additional DER export capacity — quantify the capacity
    cost of conservatism in limit-setting before accepting data gaps, as scenario
    modelling shows conservative buffers can eliminate available hosting capacity
    entirely.
