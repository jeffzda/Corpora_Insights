  project_name: Project SHIELD
  what_happened: Smart meter penetration outside Victoria was found to be too low
    to support dynamic network analytics. Smart meter data was available for Bohle
    Plains and Port Macquarie but not for Upper Coomera, and the available smart meter
    data was not optimised for network purposes and was costly to access.
  lesson_learnt: Projects seeking to use smart meter data for LV network analytics
    outside Victoria should not rely on smart meter penetration as a primary data
    source — plan for supplementary data sources from the outset, as current smart
    meter infrastructure is too sparse, not network-optimised, and too costly for
    DNSPs to use as a sole input.
