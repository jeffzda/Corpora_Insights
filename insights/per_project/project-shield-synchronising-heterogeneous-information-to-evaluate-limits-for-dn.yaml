  source_title: Project SHIELD - Final Knowledge Sharing Report
  publish_date: 2024-07
  project_name: Project SHIELD
  what_happened: The project identified that data sets transmitted from smart meters
    to meter data agents are sometimes partially corrupted in transit, resulting in
    incomplete records for specific time periods — existing substitution protocols
    designed for consumption data may not be appropriate for power quality data, leaving
    gaps in event analysis.
  lesson_learnt: Do not rely solely on smart meter primary data streams for power
    quality event analysis — implement secondary data streams or on-demand data feeds
    from non-traditional sources as a fallback, since corrupted transit data cannot
    be substituted in the same way as consumption data without compromising event
    understanding.
