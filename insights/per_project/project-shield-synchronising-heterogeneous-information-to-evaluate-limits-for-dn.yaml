- record_id: ARENA-DLV-27901
  source_title: Project SHIELD Stage 1 Outcomes Report
  publish_date: 2022-04
  project_name: Project SHIELD
  what_happened: Of 68 potential external data source companies identified, only 4
    external data sources were ultimately acquired for Stage 1. Many vendors had no
    devices on the trial feeders, others refused to share data due to privacy, IP
    and competition concerns, and contact could not be established with 12 companies.
