- record_id: ARENA-DLV-50066
  source_title: Project SHIELD - Final Knowledge Sharing Report
  publish_date: 2024-07
  project_name: Project SHIELD
  what_happened: Survey responses from nine DNSPs (65% of Australian distribution
    networks) revealed that networks are progressing at different speeds in developing
    DOE capability — the dominant approach remains conventional load-flow modelling
    using historical data, with only a minority actively deploying state estimation,
    partly due to differing skills pools across organisations.
  lesson_learnt: The adoption of state estimation for DOE calculation across the DNSP
    sector is uneven and skills-constrained — industry programs should target capability
    uplift alongside technical demonstrations, and regulators should consider incentive
    mechanisms to accelerate uptake given the direct impact on DER export availability
    for consumers.
