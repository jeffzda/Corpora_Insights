- record_id: ARENA-DLV-57961
  source_title: Redback Technologies - Project SHIELD - Project Journey Report
  publish_date: 2023-11
  project_name: Project SHIELD
  what_happened: The project's rescoped final deliverable focused solely on generating
    Dynamic Operating Envelopes using heterogeneous data sets, dropping the Business
    Case, Simulator Tool, and Digital Observatory. The resources originally assigned
    to these three outputs had left the project by the time the rescope was agreed,
    making them the highest-risk deliverables to attempt with remaining capability.
  lesson_learnt: When rescoping a multi-deliverable project under resource and time
    constraints, prioritise the highest-value core output that can be delivered with
    remaining capability rather than attempting partial delivery across all outputs
    — incomplete delivery of secondary outputs provides less portfolio value than
    full delivery of the primary outcome.
