- record_id: ARENA-DLV-17951
  source_title: Project SHIELD Lessons Learnt Report 3
  publish_date: 2022-04
  project_name: Project SHIELD (Synchronising Heterogenous Information to Evaluate
    Limits for DNSPs)
  what_happened: The project team identified numerous potential alternative data sources
    for estimating LV network hosting capacity but found actual device density across
    trial feeders was extremely low — coverage reached at best 24% of connection points
    on one feeder and as low as 5% on others, making robust hosting capacity estimation
    infeasible from existing data alone.
  lesson_learnt: Do not assume alternative behind-the-meter data sources will be available
    at sufficient density on any given LV feeder — audit device penetration rates
    in target trial areas before project design is finalised, and allocate time to
    interact with vendors to secure data access early.
