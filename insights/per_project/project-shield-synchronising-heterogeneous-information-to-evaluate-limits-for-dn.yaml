- record_id: ARENA-DLV-7856
  source_title: Project SHIELD Lessons Learnt Report 2
  publish_date: 2021-07
  project_name: Project SHIELD (Synchronising Heterogenous Information to Evaluate
    Limits for DNSPs)
  what_happened: Project SHIELD found that GIS data quality and structure varied significantly
    across network operators, and that GIS systems typically lack electrical asset
    details needed for state estimation, requiring supplementary asset databases and
    careful data schema design.
  lesson_learnt: When designing distribution network analytics systems, specify GIS
    data requirements in detail upfront — including unique asset identifiers, named
    terminals for directionality, switching element states, and installation/retirement
    dates — as most GIS systems are not configured to host the electrical specifics
    needed for accurate network modelling.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: network business
  delay_category: data/validation/testing
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: The project developed a detailed specification of GIS data requirements
    including unique identifiers, named terminals, switching element state recording,
    and support for historical network traces to guide future data source engagement.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: grid/system stability
  source_pages: &id004
  - 17
