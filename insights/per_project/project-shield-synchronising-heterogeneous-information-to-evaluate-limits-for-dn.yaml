    across the trial network feeders was found to be relatively low — data density
    ranged from 5% to 24% across the three trial feeders (Bohle Plains 13.6%, Coomera
    9A 5%, Port Macquarie 24%).
  lesson_learnt: Current behind-the-meter sensor penetration in Australian distribution
    networks is insufficient to support reliable dynamic network analytics at feeder
    level — projects must plan for and communicate to policymakers that new digital
    infrastructure investment will be required, rather than assuming existing BTM
    devices provide adequate coverage.
