  source_title: Project SHIELD - Final Knowledge Sharing Report
  publish_date: 2024-07
  project_name: Project SHIELD
  what_happened: The project found that there is no standardised definition of what
    constraints to impose when assessing hosting capacity, with constraints driven
    by varying combinations of statutory voltages, thermal limits, protection settings,
    and engineering judgement — including differences in whether nameplate or emergency
    cyclic ratings are used for distribution transformers.
  lesson_learnt: The absence of standardised network constraint definitions for hosting
    capacity assessment means that DOE outcomes are not comparable across networks
    and may be unnecessarily conservative — industry standardisation of constraint
    frameworks would improve consistency and unlock additional renewable capacity
    across the system.
