  source_title: Project SHIELD - Final Knowledge Sharing Report
  publish_date: 2024-07
  project_name: Project SHIELD
  what_happened: The cost of acquiring comprehensive smart meter data for full network
    coverage was found to be prohibitive for many DNSPs, forcing trade-offs between
    data granularity and cost — networks are purchasing only targeted, partial datasets
    rather than full coverage, with regulatory costs not currently allowing recovery
    of data acquisition investment in high-DER-growth areas.
