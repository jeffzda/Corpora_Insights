  what_happened: The energy industry lacked a common understanding of regulations
    and risks associated with sharing energy data sets. Some barriers were based on
    legal advice, some on interpretation of public information, and some on risk aversion,
    creating inconsistent and unpredictable access outcomes across vendors.
  lesson_learnt: The absence of an industry-wide data-sharing protocol for energy
    data creates project risk — advocate for or contribute to developing a standard
    data-sharing guide at the outset of data-intensive projects, and engage the Energy
    Security Board or equivalent bodies who are already working on this problem.
