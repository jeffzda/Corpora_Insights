  project_name: Project SHIELD (Synchronising Heterogenous Information to Evaluate
    Limits for DNSPs)
  what_happened: DNSP data governance frameworks designed to adhere to IPART licence
    conditions introduced additional labour and process requirements for sharing data
    with external parties, requiring justification of risk exposure against the value
    of outcomes before any information with a non-low dissemination classification
    could be transacted.
  lesson_learnt: Factor DNSP data governance and cybersecurity assessment processes
    into project timelines when planning to receive network-owned data — these processes
    are governed by licence conditions and can impose significant additional effort
    that is not visible until engagement is underway.
