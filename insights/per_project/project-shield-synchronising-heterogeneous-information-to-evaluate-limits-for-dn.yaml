  what_happened: DNSPs who had not yet adopted state estimation cited lack of data
    availability as the primary reason, despite evidence from Project SHIELD and partner
    networks that state estimation is effective at sub-complete data coverage — indicating
    that perception of data requirements rather than actual data constraints may be
    the barrier.
  lesson_learnt: When promoting state estimation adoption to DNSPs, directly address
    the misconception that full data coverage is required — evidence-based demonstrations
    at 30–40% data penetration are more persuasive than capability arguments alone,
    as perceived data gaps rather than real ones appear to be the dominant adoption
    barrier.
