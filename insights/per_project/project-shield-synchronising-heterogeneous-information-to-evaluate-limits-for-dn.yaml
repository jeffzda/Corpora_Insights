  project_name: Project SHIELD
  what_happened: Victoria's universal smart meter rollout enabled its DNSPs to achieve
    comprehensive, uniform, and timely meter data across the entire network — a capability
    that the rest of the NEM lacks and will lack until the 2030s — demonstrating the
    substantial optimisation benefits of complete AMI coverage.
  lesson_learnt: The Victorian experience demonstrates that comprehensive AMI coverage
    is the gold standard for LV network visibility; for jurisdictions without it,
    alternative approaches like Project SHIELD's heterogeneous DSSE are essential
    interim measures — projects should position their solutions explicitly as bridging
    strategies pending full AMI rollout.
