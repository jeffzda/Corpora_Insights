  source_title: Project SHIELD Stage 1 Outcomes Report
  publish_date: 2022-04
  project_name: Project SHIELD
  what_happened: Scenario analysis found that measurements from commercial premises
    improved state estimation accuracy for both commercial and residential premises,
    while adding more residential premise measurements provided no improvement in
    commercial premise estimation even when increased from 2 to 50 devices.
  lesson_learnt: When deploying measurement devices to improve LV network state estimation,
    prioritise commercial premises over residential — commercial loads are less predictable
    and carry greater informational value per device, while additional residential
    devices beyond a minimum number yield diminishing returns.
