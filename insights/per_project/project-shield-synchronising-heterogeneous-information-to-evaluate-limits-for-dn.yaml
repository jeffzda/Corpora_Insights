  what_happened: The Victorian smart meter rollout experience showed that the last
    areas to receive smart meters were those with the poorest communications infrastructure
    — the same pattern was expected to recur in the broader NEM rollout, creating
    data gaps precisely in those network areas that are hardest to manage and may
    have the weakest alternative data options.
  lesson_learnt: Plan for communications-constrained areas to be last in any smart
    meter rollout — for projects depending on smart meter data in rural or remote
    network sections, build in alternative data collection strategies using LPWAN
    or customer internet connections from the outset rather than waiting for AMI coverage.
