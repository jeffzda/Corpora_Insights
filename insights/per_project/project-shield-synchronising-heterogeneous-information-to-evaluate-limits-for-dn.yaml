- record_id: ARENA-DLV-17960
  source_title: Project SHIELD Lessons Learnt Report 3
  publish_date: 2022-04
  project_name: Project SHIELD (Synchronising Heterogenous Information to Evaluate
    Limits for DNSPs)
  what_happened: The project had planned to use real-time data but found that very
    few devices in the trial feeders were equipped to deliver real-time data streams,
    no real-time capable smart meters were available in the feeders, and most vendors
    lacked the know-how or infrastructure to deliver real-time data at scale. The
    project ultimately defaulted to using historical data.
  lesson_learnt: Projects relying on real-time data feeds from third-party devices
    should assess real-time delivery capability at the vendor and infrastructure level
    before scoping the project — and explicitly determine upfront whether historical
    data would suffice for the project's analytical objectives, avoiding the cost
    and complexity of a real-time data architecture unnecessarily.
  issue_severity: major
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: network business
  delay_category: data/validation/testing
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: data & measurement
  intervention_note: Project leveraged 2,000 Luceo Link devices within the Gold Coast
    area (part of an Energy Queensland safety program) as the sole fully real-time
    devices identified on the networks, supplemented by strategic shift to historical
    data analysis.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: DER
