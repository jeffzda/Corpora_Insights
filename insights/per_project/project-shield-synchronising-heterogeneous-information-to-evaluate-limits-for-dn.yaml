  publish_date: 2022-04
  project_name: Project SHIELD
  what_happened: State estimation analysis demonstrated that transformer tap position
    data is critical for accurate network state estimation — scenarios with incorrect
    tap settings produced estimation errors of +4 to +9 volts on average, while the
    correct tap setting (position 4) reduced deviation to +4 to -3 volts.
  lesson_learnt: DNSPs undertaking state estimation-based hosting capacity analysis
    should collect and maintain accurate transformer tap position data — if tap data
    is unavailable, an optimisation algorithm can estimate it but this is time-consuming
    and requires an LV voltage reference for verification.
