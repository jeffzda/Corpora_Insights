  source_title: Project SHIELD - Final Knowledge Sharing Report
  publish_date: 2024-07
  project_name: Project SHIELD
  what_happened: Convergence analysis on feeder CMA9A showed that measurements were
    taken predominantly on distribution transformers with residential customer connections,
    resulting in a sub-optimal statistical sample — a large atypical commercial load
    was unmonitored, producing a significant near-constant offset between the best
    estimate and the measured substation value, primarily during nighttime.
  lesson_learnt: When selecting measurement points for state estimation, prioritise
    large commercial and industrial (C&I) loads with atypical behaviour over purely
    residential connections — unmonitored large loads with low correlation to surrounding
    loads create persistent estimation errors that cannot be corrected by increasing
    residential measurement density.
