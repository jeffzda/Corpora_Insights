  project_name: Project SHIELD
  what_happened: Privacy constraints on NMI (National Meter Identifier) information
    required the project to use geocoding and address-based solutions to locate data
    points within the network, but varying precision levels in geographic details
    sometimes prevented accurate node placement, requiring geocoding precision of
    at least four decimal points (approximately eleven metres).
  lesson_learnt: Where NMI data is unavailable due to privacy constraints, geocoding
    is the next best approach for linking measurements to the LV network — but geocoding
    precision must be specified at four or more decimal points (approximately 11 metres)
    in data requests to vendors; accept that some data points will be unlocatable
    and design the state estimator to tolerate this uncertainty.
