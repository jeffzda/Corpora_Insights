  project_name: Project SHIELD
  what_happened: Analysis of the Upper Coomera and Port Macquarie feeders confirmed
    that increasing state estimation accuracy requires maintaining a minimum data
    density — scenarios with more removed NMI devices consistently produced higher
    voltage deviation, though the relationship was not strictly linear and device
    location affected results.
  lesson_learnt: When planning sensor deployment for LV network state estimation,
    prioritise achieving a minimum data density threshold across the feeder rather
    than simply maximising the total number of devices — device location (proximity
    to key nodes) matters as much as quantity.
