  what_happened: Accessing data from external vendors at the customer or device level
    was found to be prohibitively costly — vendors charged high fixed costs for bespoke
    development of new queries against their established datasets, even for small
    amounts of data, making the economics unfavourable for DNSPs.
  lesson_learnt: When budgeting for third-party data acquisition from commercial vendors,
    treat bespoke data extraction costs as a significant project cost item — the cost
    of custom query development against proprietary datasets can be disproportionately
    high relative to the small data volumes available at specific network locations.
