- record_id: ARENA-DLV-50055
  source_title: Project SHIELD - Final Knowledge Sharing Report
  publish_date: 2024-07
  project_name: Project SHIELD
  what_happened: The AEMC's August 2023 metering review recommended accelerating smart
    meter deployment to 100% by 2030 and providing DNSPs with free basic power quality
    data — however, the basic data set proposed (voltage, current, phase angle at
    5-minute intervals, delivered daily) was found to be insufficient for several
    DNSP use cases including real-time DOE calculation.
  lesson_learnt: Policy-mandated smart meter data streams should not be assumed to
    meet all DNSP network management needs — projects relying on smart meter data
    for real-time or high-resolution applications must plan for supplementary data
    sources, as basic AMI data lacks frequency metrics, harmonics, sub-minute intervals,
    and near-real-time delivery.
