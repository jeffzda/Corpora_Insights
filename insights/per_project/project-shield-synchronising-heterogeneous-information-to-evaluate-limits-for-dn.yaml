- record_id: ARENA-DLV-7858
  source_title: Project SHIELD Lessons Learnt Report 2
  publish_date: 2021-07
  project_name: Project SHIELD (Synchronising Heterogenous Information to Evaluate
    Limits for DNSPs)
  what_happened: After Milestone 1, acquiring live data from external sources for
    integration with the Luceo Platform proved difficult and time-consuming. Data
    privacy concerns, disparate and incomplete data sets, and the absence of any legal
    obligation on manufacturers to share data meant the project had very limited external
    data beyond its own 50 Luceo monitoring devices.
  lesson_learnt: Projects relying on third-party live data feeds should assess data
    access risk — including privacy law, contractual obligations, and data completeness
    — before finalising the technical architecture; design the platform to fall back
    to alternative or historical data sources if live feeds cannot be secured, and
    begin data access negotiations well before the data is operationally required.
  issue_severity: major
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: construction/installation
  proponent_type: network business
  delay_category: data/validation/testing
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: The Working Group and Steering Committee resolved to prioritise
    Smart Meter Data as the primary third-party source and pursue a targeted approach
    to inverter manufacturer data sharing, while continuing to rely on the 50 installed
    Luceo devices as the primary live feed.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: grid/system stability
  source_pages:
