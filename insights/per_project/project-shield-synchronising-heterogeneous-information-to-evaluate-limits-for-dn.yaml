- record_id: ARENA-DLV-57960
  source_title: Redback Technologies - Project SHIELD - Project Journey Report
  publish_date: 2023-11
  project_name: Project SHIELD
  what_happened: Stage 1 of Project SHIELD successfully demonstrated a fully operating
    solution capable of producing real-time Dynamic Operating Envelopes using heterogeneous,
    incomplete data sources — a capability not previously demonstrated by any Australian
    system including SCADA-based systems. Following Stage 1, Luceo and GridQube were
    both able to enter into commercial contracts for their respective solution modules.
  lesson_learnt: Structuring a demonstration project in clearly defined stages with
    a stage gate review enables early commercialisation of validated components —
    Stage 1 delivery of the core DOE capability was sufficient to enable both technology
    partners to secure commercial contracts before the overall project concluded.
