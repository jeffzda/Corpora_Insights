- record_id: ARENA-DLV-17953
  source_title: Project SHIELD Lessons Learnt Report 3
  publish_date: 2022-04
  project_name: Project SHIELD (Synchronising Heterogenous Information to Evaluate
    Limits for DNSPs)
  what_happened: Accessing alternative and network data sources proved to be a complex
    technical, legal, and commercial challenge. Data concerning electricity consumption
    in small time intervals combined with geographic information was treated as highly
    sensitive, and there was no established repeatable framework for data access for
    research projects or DNSPs.
  lesson_learnt: When data access from third-party vendors is on the critical path,
    engage vendors immediately post-approval and bypass local sales offices to approach
    manufacturers directly; prepare data request materials in multiple formats and
    seek legal guidance from a trusted industry body early to reduce vendor uncertainty
    about privacy obligations.
