- record_id: ARENA-DLV-35602
  source_title: Project SHIELD - Consolidated Analysis Report
  publish_date: 2024-01
  project_name: Project SHIELD
  what_happened: Non-network devices used to collect power quality data were built
    to cost rather than utility-grade standards (IEEE1613/IEC 61850-3), resulting
    in frequent data corruption, loss, and unreadability due to software malfunctions,
    hardware faults, extreme environmental conditions, and power failures.
  lesson_learnt: When relying on non-network consumer devices as data sources for
    network analysis, explicitly benchmark their reliability against utility-grade
    standards before project design — devices built to cost lack data recovery features
    such as robust backup and power protection, making data streams unreliable for
    state estimation.
