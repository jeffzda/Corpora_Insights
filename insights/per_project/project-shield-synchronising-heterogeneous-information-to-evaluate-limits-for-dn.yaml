  what_happened: Privacy and data security concerns caused significant friction throughout
    data acquisition. Uncertainty and ongoing changes in customer data privacy legislation
    made many vendors uncomfortable about sharing data even after external legal advice
    confirmed moderate risk with appropriate controls.
  lesson_learnt: Obtain independent legal advice on data privacy obligations early
    in project planning and develop a clear, documented data governance framework
    before approaching vendors — vendor confidence in sharing data is unlikely to
    be achieved without formal privacy assurance and agreed controls in place from
    the outset.
