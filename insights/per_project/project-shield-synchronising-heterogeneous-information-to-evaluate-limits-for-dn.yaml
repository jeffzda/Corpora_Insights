  what_happened: During the project pause following December 2022, with less than
    eight months remaining, most of the project's current staff sought alternative
    employment, making re-establishment of project capability both time-consuming
    and costly and putting remaining project expertise at risk of being lost entirely.
  lesson_learnt: When a multi-partner project is paused or placed on hold, treat staff
    retention as an immediate critical risk — even a short pause in a tight labour
    market will cause fixed-term staff to seek permanent employment, and the cost
    and time to rebuild capability may exceed the value of resuming the original scope.
