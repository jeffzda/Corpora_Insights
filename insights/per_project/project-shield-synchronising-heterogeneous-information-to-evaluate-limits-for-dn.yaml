  source_title: Project SHIELD Stage 1 Outcomes Report
  publish_date: 2022-04
  project_name: Project SHIELD
  what_happened: The Port Macquarie feeder dataset lacked phase identification and
    tap information for NMIs and transformers, and only two of three transformer measurements
    could be used due to unreliable data from one unit. This resulted in insufficient
    data for a high-quality state estimation outcome for that feeder.
  lesson_learnt: For state estimation on a specific feeder, transformer measurements
    — including phase identification and tap settings — are the most critical inputs
    and should be verified as complete before feeder selection is finalised; feeders
    without complete transformer data should be deprioritised or used only for exploratory
    analysis.
