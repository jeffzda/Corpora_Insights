  what_happened: Low-voltage network model data for several trial feeders was found
    to be incomplete — some feeders only had customer-to-transformer association data
    without full electrical connectivity detail, as maintaining LV network model granularity
    had not historically been a priority for DNSPs.
  lesson_learnt: Before commencing LV network analytics work, verify the completeness
    of the DNSP's LV network model — incomplete connectivity data will limit state
    estimation accuracy and may require fallback to medium-voltage estimation approaches;
    DNSPs should be encouraged to begin capturing and maintaining LV topology data
    now.
