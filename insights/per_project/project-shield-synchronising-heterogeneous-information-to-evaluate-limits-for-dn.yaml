  project_name: Project SHIELD
  what_happened: Travel restrictions during the COVID-19 pandemic prevented technical
    staff from conducting site walkthroughs of trial areas, meaning shortcomings in
    the trial area network architecture were not identified until much later in the
    project during development of the digital architecture.
  lesson_learnt: Site walkthroughs by technical staff in data or network projects
    should be treated as a critical path activity and not deferred or replaced with
    remote assessment — deficiencies in physical network architecture that affect
    digital system design are unlikely to be detected until late in development if
    physical inspection is skipped.
