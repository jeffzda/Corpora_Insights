- record_id: ARENA-DLV-57956
  source_title: Redback Technologies - Project SHIELD - Project Journey Report
  publish_date: 2023-11
  project_name: Project SHIELD
  what_happened: Early procurement of data devices by the project team — intended
    to leverage a larger network procurement program — resulted in devices being procured
    and partly installed before final agreements were completed. This created timing
    and provenance problems that meant the expenditure could not be claimed as a cash
    contribution, and clearly separating SHIELD devices from the larger network program
    proved more difficult than expected.
  lesson_learnt: Do not commence procurement or installation activities ahead of finalised
    funding agreements, even when piggybacking on a larger partner program appears
    efficient — the inability to cleanly separate expenditure will prevent it from
    being counted as a legitimate cash contribution and can trigger a funding renegotiation.
