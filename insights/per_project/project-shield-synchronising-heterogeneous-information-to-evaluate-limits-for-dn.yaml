  what_happened: Staff turnover occurred at unexpectedly high rates across almost
    every project role — sometimes multiple times over the first two and a half years
    — driven by the buoyant labour market, as fixed-term project employees moved to
    more permanent and better-paying positions. Key technical staff with core knowledge
    also turned over, and the ARENA contract management team experienced higher-than-expected
    turnover creating legacy knowledge gaps.
  lesson_learnt: Fixed-term project roles in a hot labour market carry high key-person
    risk; structure compensation and role continuity to compete with the open market,
    build systematic knowledge transfer mechanisms from day one, and treat ARENA contract
    team continuity as a dependency — knowledge gaps on both sides compound project
    governance risk.
