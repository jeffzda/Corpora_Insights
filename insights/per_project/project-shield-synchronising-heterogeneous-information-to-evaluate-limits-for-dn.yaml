- record_id: ARENA-DLV-7857
  source_title: Project SHIELD Lessons Learnt Report 2
  publish_date: 2021-07
  project_name: Project SHIELD (Synchronising Heterogenous Information to Evaluate
    Limits for DNSPs)
  what_happened: The scarcity of actual measurement data across the distribution network
    was identified as the main challenge for network monitoring; the project found
    this could be substantially compensated using statistical information on network
    utilisation through aggregation-disaggregation approaches, but only when appropriate
    meta-data accompanied measurements.
  lesson_learnt: When building distribution network monitoring systems, design the
    data schema to capture statistical load/generation type information and measurement
    parent-child relationships for every connection point — these enable aggregation-disaggregation
    techniques that compensate for sparse measurement coverage and substantially improve
    state estimation accuracy.
