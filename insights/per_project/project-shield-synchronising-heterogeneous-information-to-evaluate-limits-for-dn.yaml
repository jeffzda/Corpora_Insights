  what_happened: DSSE analysis on feeder CMA9A showed that voltage estimates converge
    to acceptable accuracy at very low measurement data quantities, significantly
    faster than power flow estimates — making voltage-primary DSSE deployments viable
    with minimal instrumentation.
  lesson_learnt: For networks where voltage is the primary operational concern, DSSE
    produces usable accuracy with very few measurement points — prioritise power flow
    measurement coverage only where load estimation accuracy is the primary constraint,
    as voltage and power flow estimates have fundamentally different data-density
    requirements.
