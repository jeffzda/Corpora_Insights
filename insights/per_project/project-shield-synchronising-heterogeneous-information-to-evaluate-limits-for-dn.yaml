- record_id: ARENA-DLV-17964
  source_title: Project SHIELD Lessons Learnt Report 3
  publish_date: 2022-04
  project_name: Project SHIELD (Synchronising Heterogenous Information to Evaluate
    Limits for DNSPs)
  what_happened: The project attempted to build a simulator to identify optimal locations
    for LV network monitoring devices by systematically removing data points and assessing
    impact on hosting capacity estimation accuracy. With 53 data monitors on one trial
    feeder, the number of possible combinations (2^53-1 ≈ 9 quadrillion) was computationally
    intractable within the project timeline.
  lesson_learnt: When designing combinatorial simulation tasks for network monitoring
    optimisation, plan the computational approach before scoping the work — the combination
    space grows exponentially with the number of data points and a sampling strategy
    (rather than exhaustive enumeration) must be defined upfront to remain tractable.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: network business
  delay_category: data/validation/testing
  failure_mode: poor scoping
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: The team adopted a sampling approach using 1,000 combinations
    to generalise results, which yielded early findings to be explored further in
    Stage 2.
  transferability: narrow
  delay_magnitude: not quantified
  technology_domain: grid/system stability
  source_pages: &id010
  - 19
  - 20
  evidence_excerpt: Mathematically it is 253-1 = 9,000 trillion possible combinations.
