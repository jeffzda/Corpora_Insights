- record_id: ARENA-DLV-53896
  source_title: Demand Flexibility Portfolio Retrospective Analysis Report
  publish_date: 2023-07
  project_name: ARENA Demand Flexibility Portfolio — C&I RERT Projects (Enel X)
  what_happened: The AEMO baseline adjustment penalised a plant with a scheduled outage
    by reducing its baseline downward, and similarly reduced the baseline of an inter-shift
    non-production period at Inter-Cast Forge smelter, removing the financial incentive
    to participate in demand response events even when full capacity was available
    to be curtailed.
  lesson_warnt: Sites with planned outages, inter-shift periods, or irregular production
    schedules are likely to be ineligible or financially disadvantaged under AEMO's
    dynamic baseline methodology; aggregators should screen for these patterns during
    customer recruitment and exclude such sites from RERT or WDR portfolios until
    more flexible baseline approaches are adopted.
  lesson_learnt: Sites with planned outages, inter-shift periods, or irregular production
    schedules are likely to be ineligible or financially disadvantaged under AEMO's
    dynamic baseline methodology; aggregators should screen for these patterns during
    customer recruitment and exclude such sites from RERT or WDR portfolios until
    more flexible baseline approaches are adopted.
