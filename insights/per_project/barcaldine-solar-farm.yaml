- record_id: ARENA-DLV-14652
  source_title: 'Lessons From the Fringes: Australian Fringe-Of-Grid Projects in ARENA''s
    Portfolio'
  publish_date: 2018-06
  project_name: Barcaldine Solar Farm
  what_happened: Reverse power flows from Barcaldine Solar Farm when solar generation
    exceeded local demand caused a small increase in losses on the immediate Clermont-Barcaldine
    132 kV feeder, but this did not translate to upstream feeders and the net effect
    remained beneficial compared to no solar generation.
  lesson_learnt: Reverse power flow from FOG solar plants causes only localised loss
    increases on the nearest feeders and does not propagate materially to upstream
    transmission lines — network impact studies for FOG solar should model this distinction
    rather than assuming uniform detriment across the network.
