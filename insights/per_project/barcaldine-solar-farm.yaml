- record_id: ARENA-DLV-14651
  source_title: 'Lessons From the Fringes: Australian Fringe-Of-Grid Projects in ARENA''s
    Portfolio'
  publish_date: 2018-06
  project_name: Barcaldine Solar Farm
  what_happened: Barcaldine Solar Farm (25 MWDC / 20 MWAC) demonstrated a measurable
    reduction in line losses on the Lilyvale-Clermont 132 kV feeder during solar generation
    hours (8am–4pm), consistent with the premise of distributed generation reducing
    transmission losses in fringe-of-grid areas.
  lesson_learnt: Distributed solar generation co-located near FOG load centres materially
    reduces resistive and reactive line losses on upstream transmission feeders —
    quantifying this benefit before investment can strengthen the business case for
    FOG renewable projects.
