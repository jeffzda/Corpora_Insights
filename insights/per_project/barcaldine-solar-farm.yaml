  publish_date: 2018-06
  project_name: Barcaldine Solar Farm
  what_happened: Barcaldine Solar Farm demonstrated that its solar generation did
    not materially impact the operations of the co-located combined cycle gas generator,
    which continued to operate as a peaking plant responding to high-demand events
    independent of BSF output levels.
  lesson_learnt: FOG solar PV plants can co-exist with incumbent gas peaking plant
    without operationally displacing it — proponents and network planners in FOG regions
    should not assume solar integration will disrupt existing dispatchable generation,
    though longer-term monitoring is warranted.
