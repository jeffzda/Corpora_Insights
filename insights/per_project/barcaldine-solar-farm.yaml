  publish_date: 2018-06
  project_name: Barcaldine Solar Farm
  what_happened: Barcaldine Solar Farm's marginal loss factor (MLF) fell by more than
    10% within three years of commissioning, reducing revenue by approximately 12%
    compared to expectations at the time of investment.
  lesson_learnt: MLF degradation from rapid influx of solar in FOG regions can erode
    project revenue by 10% or more within a few years — FOG solar project financial
    models must stress-test MLF decline scenarios, particularly in regions attracting
    multiple new generators on the same feeder.
