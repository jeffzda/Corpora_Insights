- record_id: ARENA-DLV-14653
  source_title: 'Lessons From the Fringes: Australian Fringe-Of-Grid Projects in ARENA''s
    Portfolio'
  publish_date: 2018-06
  project_name: Barcaldine Solar Farm
  what_happened: Voltage levels at substations across the Barcaldine network showed
    no discernible detriment during BSF operation; the plant's inverters absorbed
    reactive power during the day and contributed reactive power overnight, suggesting
    a potential voltage stabilisation function for the network.
  lesson_learnt: FOG solar plants with reactive power capability from inverters can
    provide a voltage stabilisation function on remote networks — proponents should
    monitor and document this potential grid support role, noting that current market
    rules do not allow remuneration for it.
