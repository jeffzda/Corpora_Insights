- record_id: ARENA-DLV-14655
  source_title: 'Lessons From the Fringes: Australian Fringe-Of-Grid Projects in ARENA''s
    Portfolio'
  publish_date: 2018-06
  project_name: Barcaldine Solar Farm
  what_happened: The arrival of Longreach Solar Farm on the same feeder as Barcaldine
    Solar Farm, approximately 10 months after BSF commenced full generation, introduced
    a confounding variable that complicated attribution of network impacts (losses,
    voltages) to BSF alone and raised the prospect of future curtailment as transformer
    capacity limits are approached.
  lesson_learnt: When multiple solar generators share a FOG feeder, holistic grid
    planning must model cumulative network impacts and curtailment risk from the outset
    — proponents who do not account for neighbouring generators can face unexpected
    curtailment and compromised monitoring data.
