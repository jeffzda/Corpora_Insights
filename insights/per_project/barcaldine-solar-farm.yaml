    anticipated but a longer commissioning period, with implications for insurance
    extension costs and intermediate trading fees.
  lesson_learnt: FOG solar project schedules should allow extra time for commissioning
    — construction can proceed faster than expected in remote areas, but commissioning
    typically runs longer, generating unbudgeted insurance extension and trading fee
    costs that should be included in contingency planning.
