- record_id: ARENA-DLV-16274
  source_title: Energy Storage Study
  publish_date: 2015-07
  project_name: Australia — Lack of Market Understanding among NSPs and Developers
  what_happened: Stakeholder consultation (C3) found that market immaturity meant
    detailed specifications for energy storage did not exist, and there was a widespread
    lack of understanding among NSPs and developers regarding technology capability
    and project requirements. This created barriers to project development and investment
    decisions.
  lesson_learnt: Education and demonstration projects are more valuable than technology
    R&D in the early market phase — NSPs and developers need practical exposure to
    battery system capabilities and design requirements before they can write effective
    specifications or evaluate tenders, making knowledge-sharing investment a high-priority
    enabler.
