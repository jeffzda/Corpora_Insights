- record_id: ARENA-DLV-72234
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: '2014'
  project_name: DERINT - Large Scale Virtual Power Plant Integration (DONG Energy
    Power Hub)
  what_happened: DONG Energy's Power Hub VPP demonstration in Denmark found that mobilising
    flexibility from distributed energy resources required time-consuming owner education
    and awareness efforts — out of more than 100 owners approached, only 47 signed
    up to participate on commercial terms.
  lesson_learnt: VPP and aggregation projects should budget significant time and resources
    for owner education before assuming participation rates — most DER owners are
    unaware of the economic value of their flexible assets, and mobilisation efforts
    to create awareness are a major project activity, not a minor transaction.
  issue_severity: minor
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: utility/energy retailer
  delay_category: stakeholder/land/community
  failure_mode: coordination & stakeholders
  outcome_class: partial success
  secondary_failure_mode: null
  intervention_note: The Power Hub team approached more than 100 owners and signed
    up 47, demonstrating the VPP on fully commercial terms in the Danish power market.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: grid/system stability
  source_pages: &id001
  - 200
  evidence_excerpt: Most owners of distributed energy resources are not aware of the
    potential economic value of flexible power production and consumption. Mobilising
    flexibility often involves time consuming efforts to create the necessary awareness
    among them, explaining the potential economic value as well as the value of contributing
    to the greening of the energy system. The Power Hub team approached more than
    100 owners and signed up 47.
  confidence_note: Published 2014 — commercial viability and demand conditions may
    be superseded by subsequent developments in this rapidly evolving field.
