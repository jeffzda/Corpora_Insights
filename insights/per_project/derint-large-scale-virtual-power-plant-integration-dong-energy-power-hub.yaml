- record_id: ARENA-DLV-72235
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: '2014'
  project_name: DERINT - Large Scale Virtual Power Plant Integration (DONG Energy
    Power Hub)
  what_happened: The Power Hub VPP demonstration showed that wind turbines can deliver
    the full portfolio of required balancing services including reactive power and
    fast frequency demand response, and that even a small portfolio of distributed
    assets can be commercially competitive in existing reserves markets.
  lesson_learnt: Wind assets and small distributed portfolios should be evaluated
    as viable participants in ancillary services markets — demonstrated commercial
    viability of small VPP portfolios in existing reserves markets means that aggregation
    at modest scale can be financially self-sustaining without requiring new market
    structures.
  issue_severity: none
  project_type: software/data/digital
