- record_id: ARENA-DLV-9961
  source_title: 'Empowered Consumers: Distributed Energy Resources Portfolio Update'
  publish_date: '2018'
  project_name: United Energy Solar and Storage Program
  what_happened: United Energy deployed solar PV and battery storage at customer premises connected to 14 constrained distribution substations, finding this approach more cost-effective than traditional
    network augmentation. Only 42 systems (3% of customers at constrained substations) were required to bring substations to design rating equivalent.
  lesson_learnt: Targeted deployment of customer-sited solar and storage at constrained substations can be more cost-effective than traditional network augmentation — detailed substation load profiling
    with and without dispatch enabled this conclusion, and automated control algorithms are necessary to operationalise the non-network solution at scale.
