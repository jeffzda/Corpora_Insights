  evidence_excerpt: Wind farms aren't suitable for connection to weak distribution
    feeder networks. There can be a large amount of augmentation required to have
    the network operate within the distribution code. This can make the project economically
    unviable. For the wind farm to be economically viable, a 22kV feeder in a rural
    area with 4 MW could be the limit.
  confidence_note: Cost overrun inferred from 'large amount of augmentation required'
    and 'economically unviable' language rather than explicit percentage figures.
