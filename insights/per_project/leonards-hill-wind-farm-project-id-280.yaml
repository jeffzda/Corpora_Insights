- record_id: ARENA-DLV-72262
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: '2014'
  project_name: Leonards Hill Wind Farm (Project ID 280)
  what_happened: Powercor connected the Hepburn Community Wind Farm (2×2MW) to a rural
    22kV distribution feeder and found that the connection required significant network
    augmentation including voltage control scheme upgrades and automatic circuit recloser
    modifications to stay within distribution code limits, with findings suggesting
    that wind farms are not suitable for connection to weak distribution feeder networks
    and that 4MW may be the economic viability limit for a 22kV rural feeder.
  lesson_learnt: Wind farms should not be connected to weak distribution feeder networks
    without thorough system studies — significant and potentially project-killing
    augmentation costs arise to meet distribution code requirements, and a 22kV rural
    feeder with 4MW may represent the upper limit of economic viability for this configuration.
