  publish_date: '2025-09-01'
  project_name: Multiphase Electrolysers for Renewable Ammonia Production
  what_happened: The initial electrode design suffered stability challenges that limited
    extended electrolyser operation; aqueous electrolyte permeated the electrode structure,
    causing significant activity degradation over time.
  lesson_learnt: Electrode substrate selection must account for electrolyte permeation
    resistance in multiphase electrolyser configurations — using a substrate with
    inherent catalytic activity for the target reaction provides both structural stability
    and eliminates the permeation failure mode.
