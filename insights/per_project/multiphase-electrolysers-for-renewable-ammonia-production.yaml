  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Optimised both the electrolyte flow path and electrode-membrane
    distance, achieving equivalent reaction rate to the 1 cm² cell with significantly
    improved resistance, Faradaic efficiency, and energy consumption.
  transferability: moderate
  delay_magnitude: null
  technology_domain: hydrogen
  source_pages: &id001
  - 15
  evidence_excerpt: In scaling the electrolyser from 1 to 25 cm2, whilst the total
    reaction rate increased, we faced a significant drop in current density (mA/cm2).
    This was attributed to the flow channels utilised, which did not provide a full
    coverage of the electrode as the electrolyte solution flowed from the inlet to
    outlet ports at the cathode.
