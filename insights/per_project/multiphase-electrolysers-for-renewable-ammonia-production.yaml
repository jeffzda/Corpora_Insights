- record_id: ARENA-DLV-63203
  source_title: UNSW - Multiphase Electrolysers for Renewable Ammonia Production -
    Core Research Interim Report
  publish_date: '2025-09-01'
  project_name: Multiphase Electrolysers for Renewable Ammonia Production
  what_happened: The presence of nitrate ions in the electrolyser system resulted
    in 33% greater energy consumption compared to nitrite when converting NOx to ammonia.
    The advanced air oxidation process produced a high concentration of nitrate ions
    in neutral and acidic electrolyte solutions, increasing overall system energy
    demand.
  lesson_learnt: Electrolyte pH should be tuned early in system design for multiphase
    NOx-to-ammonia electrolysers — alkaline conditions (e.g. KOH) favour nitrite over
    nitrate formation, reducing energy consumption by approximately 33% and aligning
    the system with established commercial AEM electrolyser scaleup knowledge.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: lab/bench
