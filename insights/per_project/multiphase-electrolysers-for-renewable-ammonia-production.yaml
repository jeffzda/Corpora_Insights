- record_id: ARENA-DLV-63201
  source_title: UNSW - Multiphase Electrolysers for Renewable Ammonia Production -
    Core Research Interim Report
  publish_date: '2025-09-01'
  project_name: Multiphase Electrolysers for Renewable Ammonia Production
  what_happened: During scale-up of the electrolyser from 1 cm² to 25 cm², the team
    observed a significant drop in current density (mA/cm²) despite an increase in
    total reaction rate. The root cause was inadequate flow channel design that failed
    to provide full electrolyte coverage across the larger electrode surface.
  lesson_learnt: When scaling electrolyser systems, flow channel geometry must be
    redesigned specifically for the larger electrode area — simply enlarging the cell
    without optimising electrolyte flow path and electrode-membrane distance will
    cause a significant drop in current density and efficiency.
  issue_severity: moderate
