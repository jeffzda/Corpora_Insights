- record_id: ARENA-DLV-1318
  source_title: ARENA Insights Forum Presentation Summaries & Key Points – Large-Scale
    Projects Stream
  publish_date: '2019-06-25'
  project_name: Off-Grid and Fringe-of-Grid Projects (General)
  what_happened: A panel of practitioners identified that a 'build, neglect and rebuild'
    mentality had occurred on projects in some remote locations and islands, where
    significant investment was made in EPC but not in continued O&M, leading to premature
    asset degradation and ultimately higher lifecycle costs.
  lesson_learnt: When budgeting and contracting for remote off-grid renewable projects,
    treat ongoing O&M with the same rigour as EPC investment — the 'build, neglect
    and rebuild' pattern has recurred across multiple projects over decades and is
    a predictable failure mode that must be explicitly addressed in project design.
