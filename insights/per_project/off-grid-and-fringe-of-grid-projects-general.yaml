- record_id: ARENA-DLV-1319
  source_title: ARENA Insights Forum Presentation Summaries & Key Points – Large-Scale
    Projects Stream
  publish_date: '2019-06-25'
  project_name: Off-Grid and Fringe-of-Grid Projects (General)
  what_happened: A panel discussion noted that the same three failure modes for off-grid
    projects — poor installation, lack of quality operations and maintenance, and
    lack of local training — identified by Dr Bob Lloyd over 20 years ago remain the
    dominant failure modes for remote off-grid renewable projects today.
  lesson_learnt: The three persistent failure modes of remote off-grid renewable projects
    (poor installation, inadequate O&M, and lack of local training) have been known
    for over 20 years and continue to recur — new projects must explicitly address
    all three in project design, procurement, and capability-building plans rather
    than treating them as low-priority risks.
