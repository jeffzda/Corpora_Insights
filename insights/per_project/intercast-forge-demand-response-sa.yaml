- record_id: ARENA-DLV-42324
  source_title: Evaluation of ARENA's 2017-2020 Demand Response Portfolio
  publish_date: 2021-06
  project_name: Intercast & Forge Demand Response (SA)
  what_happened: Intercast & Forge's DR capability relied entirely on manually switching
    off furnaces and other equipment — simple, low-tech, site-specific demand reduction
    with no replicable technology component — meaning neither TRL nor CRI progressed
    as a result of the project.
  lesson_learnt: Assess the technology transferability of proposed industrial DR projects
    before funding — a single-site, manual process-based curtailment with no replicable
    technology has minimal potential for broader portfolio learning or market development
    and should be weighted accordingly in competitive funding rounds.
  issue_severity: minor
  project_type: DER/customer-side
  project_scale_band: demonstration
