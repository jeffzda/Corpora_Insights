- record_id: ARENA-DLV-42323
  source_title: Evaluation of ARENA's 2017-2020 Demand Response Portfolio
  publish_date: 2021-06
  project_name: Intercast & Forge Demand Response (SA)
  what_happened: Intercast & Forge accepted a RERT curtailment request at the start
    of Period 2 in Year 1 but then chose not to curtail operations for commercial
    reasons, delivering only 0.6 MW against a 10 MW contract — representing a significant
    shortfall driven by in-the-moment commercial decision-making overriding contractual
    commitments.
  lesson_learnt: For single-site industrial DR participants, contractual mechanisms
    should include provisions that address the commercial cost of curtailment to the
    participant at the time of dispatch — where no compensation mechanism covers foregone
    production, industrial operators may default on contracted DR for commercial reasons
    even after initial acceptance.
