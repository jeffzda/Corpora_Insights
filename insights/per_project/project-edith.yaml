- record_id: ARENA-DLV-43801
  source_title: Project Edith Stage 3 Insights Report
  publish_date: 2025-12
  project_name: Project Edith
  what_happened: Dynamic network prices in Stage 1 were generated using simple weather-based
    algorithms (e.g. higher import prices when temperature exceeded 30°C) and tested
    with 200 customers and one retail partner, demonstrating that price signals could
    be sent via a standard-based API and elicit CER behavioural change in a low-risk
    environment with a no-worse-off guarantee.
  lesson_learnt: Starting a dynamic pricing trial with a no-worse-off guarantee and
    simple, interpretable algorithms allows a network to safely test a wide variety
    of price signals without harming customers, generating foundational evidence on
    CER responsiveness before increasing complexity.
