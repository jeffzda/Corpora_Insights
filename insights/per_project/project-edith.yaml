- record_id: ARENA-DLV-43806
  source_title: Project Edith Stage 3 Insights Report
  publish_date: 2025-12
  project_name: Project Edith
  what_happened: Introducing dynamic network pricing tariffs required significant
    investment in metering and billing infrastructure. Ausgrid's existing systems
    were inflexible and not designed to support the complexity of 5-minute dynamic
    tariffs, requiring a detailed documentation of business requirements and an upgrade
    of the enterprise resource planning system.
  lesson_learnt: Networks planning to deploy dynamic pricing should assess billing
    and metering system capability early — legacy systems are typically unable to
    support 5-minute dynamic tariff complexity, and the system upgrade workstream
    requires dedicated resourcing alongside tariff design, not as an afterthought.
