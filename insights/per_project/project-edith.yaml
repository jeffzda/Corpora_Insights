  what_happened: The data requirements for dynamic network pricing (real-time network
    visibility, CER capability data, accurate forecasting, reliable communication
    channels) closely overlap with the data requirements for dynamic operating envelopes,
    creating an opportunity for shared data infrastructure that supports both mechanisms
    and lowers combined implementation costs.
  lesson_learnt: Networks investing in data infrastructure for dynamic pricing should
    design it to simultaneously support dynamic operating envelopes — the overlapping
    data requirements mean that a single integrated data platform can serve both mechanisms,
    substantially reducing unit implementation cost and enabling a toolkit approach
    to CER network management.
