  source_title: Project Edith Stage 3 Insights Report
  publish_date: 2025-12
  project_name: Project Edith
  what_happened: The Australian Energy Regulator's current network utilisation metric
    (peak demand relative to maximum capacity) paradoxically shows a decline in utilisation
    — appearing as worse performance — when a DNSP successfully reduces peak demand
    through dynamic pricing and CER coordination, making it impossible to use the
    existing metric to demonstrate the network benefits of dynamic tariffs.
  lesson_learnt: Projects deploying dynamic network pricing should not rely on existing
    AER network utilisation metrics to demonstrate network benefit — new metrics capable
    of capturing load profile flattening and deferral of network upgrades must be
    developed and agreed with the regulator before benefits can be formally recognised,
    and project design should include a measurement framework that anticipates this
    gap.
