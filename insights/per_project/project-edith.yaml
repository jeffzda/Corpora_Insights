  source_title: Project Edith Stage 3 Insights Report
  publish_date: 2025-12
  project_name: Project Edith
  what_happened: A solar soak experiment conducted in April–May 2024 applied an 8c/kWh
    dynamic export price between 11:30am–12:30pm and a 90c/kWh dynamic import price
    between 4:30–5:30pm; Edith customers demonstrably exported less during the day
    and consumed less in the evening, effectively flattening the load profile compared
    to a baseline cohort of solar-battery customers on static tariffs.
  lesson_learnt: Dynamic network pricing can successfully incentivise residential
    CER to address both midday solar export peaks and evening demand peaks simultaneously
    — a two-sided dynamic tariff applied at specific intervals is sufficient to meaningfully
    flatten the duck curve, demonstrating the mechanism's potential for deferring
    network augmentation.
