  what_happened: The dynamic pricing engine for Project Edith depends on a wide variety
    of data inputs — operational, forecasted, and static — from diverse sources with
    varying degrees of reliability, accuracy, and timeliness. Data gaps, delays, or
    inaccuracies were identified as a material operational risk that the pricing engine
    must be designed to tolerate, as incomplete data could generate incorrect or misleading
    price signals.
  lesson_learnt: Dynamic network pricing systems must be designed for resilience to
    incomplete, delayed, or inaccurate data inputs from the outset — building data
    quality tolerance into the pricing engine is a prerequisite for reliable operation,
    and improving data infrastructure (CER asset capabilities, forward-looking schedules,
    granular usage data) is a parallel workstream that can also benefit dynamic operating
    envelopes.
