- record_id: ARENA-DLV-43814
  source_title: Project Edith Stage 3 Insights Report
  publish_date: 2025-12
  project_name: Project Edith
  what_happened: Customers with both solar and a battery were observed to typically
    have a relatively large solar system compared to their battery size, meaning most
    solar-battery customers still export significant energy to the grid during midday,
    and their average load profile resembles a flattened duck curve rather than being
    fully self-consuming — indicating batteries are not eliminating the midday export
    and evening demand challenge at the distribution level.
  lesson_learnt: DNSPs and VPP aggregators should not assume that residential solar-battery
    customers have neutralised their duck curve contribution — the typical battery
    size (approximately 2-hour discharge) is insufficient to fully offset large rooftop
    PV systems, and dynamic network pricing design must account for continued midday
    export and evening import peaks from these customers.
