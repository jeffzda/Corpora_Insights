  source_title: DEIP Market Integration Trials Summary Report 1.0
  publish_date: 2022-09
  project_name: Project Edith
  what_happened: The SA Power Networks and AusNet Flexible Exports trial found that
    a high percentage of existing inverters could not comply with operating envelopes.
    In response, Project Edith introduced a subscription model where consumers (through
    their trader) can select and pay for a minimum export limit compatible with their
    equipment capability, replacing part of the consumer's current network tariff.
  lesson_learnt: Where existing consumer inverter hardware cannot comply with dynamic
    export limits, a subscription model — allowing consumers to select a minimum compliant
    limit rather than forcing compliance with a uniform envelope — can maintain participation
    incentives while accommodating legacy equipment; this approach also creates a
    commercial signal for consumers to upgrade hardware over time.
