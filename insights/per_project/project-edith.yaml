- record_id: ARENA-DLV-43816
  source_title: Project Edith Stage 3 Insights Report
  publish_date: 2025-12
  project_name: Project Edith
  what_happened: 'Measuring the price elasticity of CER demand response under dynamic
    network pricing proved analytically challenging due to multiple confounding factors:
    most demand changes are driven by non-discretionary household consumption unrelated
    to price signals; customers also respond to correlated wholesale market prices;
    aggregators cannot control all customers'' rooftop PV output; and battery state
    of charge creates time-varying responsiveness that declines over a price event.'
  lesson_learnt: Trial designs for dynamic network pricing must build in robust counterfactual
    baseline methodologies from the start — isolating network price-driven responses
    from wholesale market responses, unmanaged solar, and battery state-of-charge
    effects requires careful experimental design with matched control cohorts, not
    just aggregate price-demand correlation analysis.
