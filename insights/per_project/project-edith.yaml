  source_title: DEIP Market Integration Trials Summary Report 3.0
  publish_date: '2026-01-27'
  project_name: Project Edith
  what_happened: Project Edith found that dynamic network prices differ significantly
    across locations — some customers experiencing highly fluctuating rates and others
    seeing no variable changes — raising fairness and efficiency concerns that require
    regulatory and industry attention.
  lesson_learnt: When rolling out dynamic network pricing, traders and consumers must
    be provided with information on likely price outcomes at their specific location
    before sign-up — the location-specific nature of dynamic prices can disadvantage
    some customers relative to others and requires regulatory frameworks addressing
    equity.
