- record_id: ARENA-DLV-43809
  source_title: Project Edith Stage 3 Insights Report
  publish_date: 2025-12
  project_name: Project Edith
  what_happened: Customer battery responses to high dynamic price events showed strong
    initial response that diminished over 2–3 hours as batteries depleted; once depleted,
    VPP operators had no additional tools to respond, and the load profile reverted
    to — or exceeded — baseline consumption, sometimes exhibiting positive price elasticity
    (higher prices coinciding with increased consumption) during the evening peak.
  lesson_learnt: Dynamic pricing algorithms should anticipate battery depletion dynamics
    and avoid sustaining high-price events beyond the typical 2-hour response window
    — once battery capacity is exhausted, continued high prices can produce perverse
    outcomes including increased demand, undermining the network benefit the price
    signal was designed to achieve.
  issue_severity: moderate
  project_type: network/grid
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Ausgrid evolved its pricing methodology over successive trial
    stages to incorporate this constraint, with the current methodology applying increasingly
    higher prices as forecasted network loading exceeds 80%.
  transferability: moderate
  delay_magnitude: null
  technology_domain: DER
  source_pages:
  - 13
  - 19
  - 20
  - 49
  evidence_excerpt: Edith's results to date suggest that customers find it challenging
    to provide flexibility for an extended period, which means that high prices no
    longer motivate a response... the algorithm supporting the pricing engine is being
    adjusted to ensure that high-priced events do not last more than two consecutive
    hours... Edith's data analysis suggests that a customer's battery response tends
    to decrease after about 2 hours, which matches the fact that at the time of the
    experiment, home batteries and inverters are typically sized for 2 hours of maximum
    discharge.
