  source_title: Project Edith Stage 3 Insights Report
  publish_date: 2025-12
  project_name: Project Edith
  what_happened: Dynamic network prices vary significantly between transformers on
    the same feeder — some transformers in the Edith trial experience critical peak
    price events frequently while others never reach the congestion threshold and
    face only low default prices throughout the year, creating large disparities in
    annual network charges and rewards between customers in geographically close locations.
  lesson_learnt: Widescale rollout of dynamic network tariffs must address fairness
    concerns arising from transformer-level price diversity — providing customers
    and agents with location-specific information on likely price outcomes before
    they opt in is essential, and policy makers need to develop clear principles on
    the fairness-efficiency trade-off inherent in highly localised pricing.
