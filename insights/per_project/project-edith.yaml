- record_id: ARENA-DLV-43821
  source_title: Project Edith Stage 3 Insights Report
  publish_date: 2025-12
  project_name: Project Edith
  what_happened: Dynamic network price responsiveness depends substantially on the
    VPP operator's algorithm and tools — including the customer's battery state of
    charge, whether the agent can curtail solar PV exports, and VPP contractual constraints
    — meaning that measured price elasticity reflects the aggregator's decision-making
    rather than the end-user's willingness to respond, and varies significantly between
    agent partners.
  lesson_learnt: Dynamic network pricing trials should track and report price elasticity
    by agent-partner separately, not as a single aggregate figure — since responsiveness
    is driven by agent algorithm capability rather than end-user behaviour, understanding
    which agent architectures produce the best responses is key to designing effective
    incentives and informing future tariff parameters.
