  source_title: Project Edith Stage 3 Insights Report
  publish_date: 2025-12
  project_name: Project Edith
  what_happened: Analysis of the median Edith customer from July to October 2024 estimated
    potential wholesale market earnings of $226 over four months; after adjusting
    for time-of-use network charges the net benefit was reduced by approximately $50,
    but under the Edith dynamic tariff the customer earned an additional $79 in dynamic
    network rewards, producing a net benefit approximately $129 higher than for equivalent
    time-of-use customers — more than offsetting Edith's higher daily network access
    charge of $38.29 over the period.
  lesson_learnt: A dynamic network tariff designed to 'get out of the way' during
    unconstrained periods — setting low anytime energy charges and only applying dynamic
    charges at congestion — can increase customers' wholesale market earnings enough
    to more than offset a higher daily access charge, creating a net benefit that
    supports customer opt-in and commercial viability of the tariff.
