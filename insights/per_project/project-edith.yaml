  evidence_excerpt: 'The Edith team is examining options to develop a reliable measure
    of price elasticity. As discussed earlier, several complications make it difficult
    to reach a definitive conclusion. These complications include: Most changes in
    customer demand are entirely unrelated to network price signals... Customers or
    customer assets also respond to the wholesale market price, which is often correlated
    with the dynamic price... The aggregators and retailers in the Edith trial cannot
    adjust the output of all their customers'' rooftop PV systems based on price...
    The responsiveness to a given price change during the high price event, with a
    strong reaction at the start that diminishes over time.'
