- record_id: ARENA-DLV-43808
  source_title: Project Edith Stage 3 Insights Report
  publish_date: 2025-12
  project_name: Project Edith
  what_happened: Preliminary results from March to November 2024 showed that a 45c/kWh
    change in dynamic price produced an average 500W variation in instantaneous demand
    across Edith customers, implying customers are prepared to adjust consumption
    by 1 kWh for roughly 90c/kWh — substantially lower than the value of customer
    reliability ($38.53/kWh) or other demand response payment mechanisms.
  lesson_learnt: Dynamic network prices can elicit measurable CER demand response
    at cost levels competitive with other demand management tools, but the elasticity
    measure is highly context-dependent and does not yet account for response duration
    or scalability — trials should design analysis to capture time-varying response
    curves, not just instantaneous price-demand relationships.
  issue_severity: none
  project_type: network/grid
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: no material delay stated
  failure_mode: no major failure stated
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: DER
  source_pages:
  - 19
  - 49
  evidence_excerpt: On average, from March to November 2024, a 45c/kWh change in price
    resulted in a 500W variation in the instantaneous demand of Edith customers...
    This implies that Edith customers are prepared to adjust their power consumption
    by 1 kWh for roughly 90c/kWh. For comparison, this is dramatically lower than
    metrics such as the value of customer reliability ($38.53/kWh in 2024 for NSW)
    or other demand response payments such as RERT or WDRM, which are often above
    $3/kWh.
