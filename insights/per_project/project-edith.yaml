- record_id: ARENA-DLV-43823
  source_title: Project Edith Stage 3 Insights Report
  publish_date: 2025-12
  project_name: Project Edith
  what_happened: Current dynamic network tariffs used in Project Edith carry a relatively
    high fixed daily network access charge (NAC) to prevent cross-subsidisation with
    non-Edith customers, but trial experience and modelling indicate the NAC may need
    to be further increased to better recover costs and minimise cross-subsidies,
    while trial-specific settings such as artificial simulated constraints must be
    removed before market deployment.
  lesson_learnt: Dynamic network tariff parameters — particularly the fixed network
    access charge, dynamic price triggers, scaling mechanisms, default pricing levels,
    and price caps — require systematic calibration based on real-world performance
    data before commercial deployment; trial designers should build in a formal tariff
    parameter review process rather than treating initial settings as fixed.
