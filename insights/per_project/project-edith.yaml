- record_id: ARENA-DLV-43804
  source_title: Project Edith Stage 3 Insights Report
  publish_date: 2025-12
  project_name: Project Edith
  what_happened: Using a single simulated feeder for all Edith customers negatively
    impacted forecasting accuracy because weather significantly influences electricity
    demand and a single feeder could not represent the geographic diversity of participating
    customers across Ausgrid's network.
  lesson_learnt: Dynamic pricing trials that span geographically diverse areas should
    assign customers to multiple location-matched simulated feeders rather than a
    single model — using geographic weather zones substantially improves forecast
    accuracy and the realism of price signals received by customers.
  issue_severity: moderate
  project_type: network/grid
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: In Stage 3, Ausgrid introduced six simulated feeders based on
    main weather zones and assigned customers to the nearest feeder, improving price
    signal accuracy and relevance.
  transferability: moderate
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id004
  - 12
  evidence_excerpt: Weather significantly influences electricity demand and supply
    and forecasting accuracy was negatively impacted by only using a single simulated
    feeder. Allocation to nearby feeders enables prices to mirror real-world CER conditions,
    simplifies the network data requirements for the pricing engine, and offers flexibility
    to model various network scenarios. In practice, we have six simulated feeders,
    which provide a good geographical distribution of our network.
