  source_title: Project Edith Stage 3 Insights Report
  publish_date: 2025-12
  project_name: Project Edith
  what_happened: In Stage 2, a capacity subscription scheme was trialled allowing
    customers to pay upfront for a specific capacity allocation, but it was subsequently
    withdrawn because it had limited impact on customer behaviour and was complex
    to implement.
  lesson_learnt: Capacity subscription pricing structures are likely to add complexity
    without meaningfully influencing CER behaviour in a residential dynamic pricing
    context — simpler tariff designs that directly link price to network congestion
    are more effective and easier to administer.
