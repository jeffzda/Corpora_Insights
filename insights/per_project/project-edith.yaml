- record_id: ARENA-DLV-43810
  source_title: Project Edith Stage 3 Insights Report
  publish_date: 2025-12
  project_name: Project Edith
  what_happened: An asymmetric tariff experiment in which dynamic rewards were applied
    to exports but imports remained under standard TOU pricing was identified by Ausgrid's
    project partners as creating an incentive for battery cycling — repeatedly charging
    and discharging during a price event to maximise export revenue — representing
    a design flaw in the tariff.
  lesson_learnt: Asymmetric dynamic network tariffs where export rewards are not matched
    by equivalent import charges create a structural incentive for battery cycling
    arbitrage; symmetric pricing (where import charges equal export rewards) should
    be the default design to prevent gaming, as it eliminates this risk without requiring
    complex anti-cycling provisions.
