- record_id: ARENA-DLV-43819
  source_title: Project Edith Stage 3 Insights Report
  publish_date: 2025-12
  project_name: Project Edith
  what_happened: Project Edith operates at a current dynamic price cap of approximately
    $1.10/kWh, which is substantially lower than the wholesale market price cap ($20.3/kWh)
    or the NSW value of customer reliability ($38.53/kWh), meaning customers and VPP
    operators may prioritise responding to wholesale market price spikes over network
    price signals when the two compete for the same battery capacity.
  lesson_learnt: The relative level of dynamic network price caps versus wholesale
    market prices creates a hierarchy of response priority for VPP operators — where
    network and wholesale peaks align, low network price caps reduce CER response
    to network needs; trial designers should model the interaction between network
    and wholesale price signals and determine appropriate cap levels before scaling,
    noting that higher caps deliver more network response but raise cost and overcompensation
    risks.
