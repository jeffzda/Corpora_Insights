- record_id: ARENA-DLV-43803
  source_title: Project Edith Stage 3 Insights Report
  publish_date: 2025-12
  project_name: Project Edith
  what_happened: In Stage 2, the pricing engine used optimal power flow to produce
    bespoke per-customer, per-5-minute-interval prices, but this highly complex model
    was difficult to understand or justify, making it hard to explain why prices differed
    across locations and posing a barrier to regulatory acceptance for an on-market
    tariff.
  lesson_learnt: Pricing engines for dynamic network tariffs should prioritise transparency
    and justifiability over mathematical optimality — a simpler asset-based utilisation
    model that customers and regulators can readily interpret is more suitable for
    progressing from trial to on-market deployment.
  issue_severity: moderate
  project_type: network/grid
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: network business
  delay_category: null
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: In Stage 3 the pricing engine was changed to a network-aware,
    asset-based utilisation model, making pricing decisions more transparent and justifiable
    as a step toward on-market tariff approval.
  transferability: moderate
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id003
  - 12
  evidence_excerpt: This model is highly complex, and prices are fine-grained (to
    the individual household level). Therefore, it can often be hard to understand
    or easily justify the outputs, such as why certain prices were set in different
    locations. During the enhancement stage, the pricing engine was changed to use
    a network-aware model... This made pricing decisions more transparent and justifiable,
    helping demonstrate how dynamic prices could be linked to network congestion,
    which was a key step toward developing an on-market tariff.
