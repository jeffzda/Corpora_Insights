  project_name: Project Edith
  what_happened: Early testing of IEEE 2030.5 pricing functionality within CSIP-AUS
    to send dynamic network prices alongside export limits worked technically for
    aggregators but required a large amount of communication between CER devices (or
    aggregators) and the server, making it inefficient for 5-minute dynamic pricing.
  lesson_learnt: When implementing dynamic network price communication via CSIP-AUS,
    the base IEEE 2030.5 pricing functionality requires adaptation for the Australian
    5-minute pricing context — integrating pricing into the next version of CSIP-AUS
    (v1.3) leverages existing network-wide integrations and governance while reducing
    communication overhead.
