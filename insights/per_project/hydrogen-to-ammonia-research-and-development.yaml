  what_happened: A multi-party consortium model — involving CSIRO (technology developer),
    Orica (ammonia industry expertise and reactor design), and GRDC (agricultural
    end-use funding and biomass hydrogen pathway) — was used to advance low-pressure
    ammonia synthesis from TRL 3 to prototype demonstration. Each partner contributed
    distinct capabilities that accelerated progress across the value chain.
