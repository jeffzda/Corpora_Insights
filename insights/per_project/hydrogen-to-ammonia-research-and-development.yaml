- record_id: ARENA-DLV-41605
  source_title: CSIRO Hydrogen to Ammonia R&D Project - Mid-term Knowledge Sharing
    Report
  publish_date: 2020-07
  project_name: CSIRO Hydrogen to Ammonia R&D Project
  what_happened: The project achieved single-pass hydrogen-to-ammonia conversion of
    up to 4.8 vol% ammonia content at 450°C/30 bar, rising to 11.3 vol% with hydrogen
    separation and recycling — falling short of the 15% conversion rate target set
    at project outset, though the technology was progressed from TRL 3 with the earlier
    project.
  lesson_learnt: For membrane-based ammonia synthesis R&D, incorporate hydrogen recycling
    loops into the baseline test configuration from the outset — the recycling step
    was crucial to approaching target conversion rates and should not be treated as
    an optional enhancement to be added later.
  issue_severity: minor
  project_type: industrial decarbonisation
  project_scale_band: pilot
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: partial success
  secondary_failure_mode: poor scoping
  intervention_note: Demonstrated that 76–90% of unreacted hydrogen can be recovered
    by passing product stream through a second reactor section; this raised ammonia
    content in product stream from 4.8 vol% to 11.3 vol%.
  transferability: narrow
  delay_magnitude: null
  technology_domain: hydrogen
  source_pages: &id011
  - 6
  evidence_excerpt: The peak ammonia content in the product stream achieved at 450oC
    / 30 bar pressure is 4.8 vol% in a single pass. However, it was demonstrated that
    76- 90% of the unused hydrogen can be recovered by passing the product stream
    through another reactor (or section of the same reactor) and reused in the synthesis
    process. This results in increasing the ammonia content in the product stream
    to 11.3%.
  confidence_note: issue_severity set to minor as the shortfall from 15% target is
    noted but the project remains active and alternative pathways are being pursued;
    the 15% target has not been formally abandoned.
