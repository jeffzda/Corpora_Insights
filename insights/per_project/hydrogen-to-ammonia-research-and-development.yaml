  evidence_excerpt: The volume of one of the reactors had to be reduced to less than
    1/10th due to sealing issues, and this contributed to extremely high GHSV through
    the reactor... The production rate of ammonia achieved by the rig operation at
    30 bar pressure were up to 400g/day. These values are lower than the originally
    designed reactor capacity of 1 kg/day and is due to the reduced volume of the
    membrane reactor that was essential to overcome the reactor sealing challenges.
