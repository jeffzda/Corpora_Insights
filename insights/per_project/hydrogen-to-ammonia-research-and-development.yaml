- record_id: ARENA-DLV-23702
  source_title: Hydrogen to Ammonia Research and Development Public Report
  publish_date: '2022'
  project_name: CSIRO Hydrogen to Ammonia R&D Project – 2018 / RND002
  what_happened: The demonstration rig successfully achieved hydrogen-to-ammonia conversion
    rates of 13.5–14.5% and ammonia concentrations of 7.0–7.5 vol% at 30 bar pressure,
    exceeding the Haber-Bosch equilibrium value of 6.5 vol% at the same pressure.
    This validated the core technical claim of the membrane-reactor concept — achieving
    above-equilibrium ammonia concentrations at substantially lower pressures than
    conventional H-B.
  lesson_learnt: Membrane-based reactor designs for ammonia synthesis can demonstrably
    exceed equilibrium conversion limits at low pressures (~30 bar); this approach
    is technically viable at lab/prototype scale and warrants investment in reactor
    sealing and scale-up engineering to progress toward pilot demonstration.
