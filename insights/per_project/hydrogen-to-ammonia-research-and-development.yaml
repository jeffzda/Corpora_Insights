  project_name: CSIRO Hydrogen to Ammonia R&D Project – 2018 / RND002
  what_happened: The demonstration rig was built using gas cylinder supply for hydrogen
    and nitrogen rather than the intended electrolyser-powered solar PV supply. Facilities
    to use electrolyser-sourced hydrogen were being constructed but were not operational
    during the demonstration period, meaning the full integrated system (water + air
    + solar PV → ammonia) was not demonstrated end-to-end within the project scope.
  lesson_learnt: When a demonstration project depends on multiple integrated subsystems
    (electrolyser, solar PV, reactor), ensure all subsystems are commissioned in parallel
    — deferring the electrolyser/solar integration to a later phase means the full
    value chain is not demonstrated and the commercial case remains partially evidenced.
