- record_id: ARENA-DLV-41601
  source_title: CSIRO Hydrogen to Ammonia R&D Project - Mid-term Knowledge Sharing
    Report
  publish_date: 2020-07
  project_name: CSIRO Hydrogen to Ammonia R&D Project
  what_happened: Following discussions between CSIRO and Orica on commercial viability,
    the project strategy was changed mid-project to replace expensive noble-metal
    membranes and catalysts with lower-cost iron-based catalysts and cheaper metal
    membranes. Performance with iron-based catalyst was approximately half that achieved
    with noble metal catalysts.
  lesson_learnt: Build a commercial viability checkpoint into early-stage R&D projects
    — when noble-metal-dependent performance cannot be replicated at acceptable cost
    with base-metal alternatives, identify this before committing the full experimental
    programme to a single material pathway.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: pilot
