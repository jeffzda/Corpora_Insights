  what_happened: The project operated under a three-organisation consortium structure
    (CSIRO, Orica, GRDC) with fortnightly meetings across all partners. Orica's industry
    expertise in ammonia production and GRDC's end-user perspective on distributed
    fertiliser production directly informed project strategy and led to the strategy
    pivot toward lower-cost materials.
  lesson_learnt: For R&D projects targeting commercial deployment, include an industry
    partner with operational experience in the target sector from the outset — Orica's
    ammonia industry knowledge directly prompted the commercially necessary pivot
    to lower-cost materials that would not have been identified through a purely research-oriented
    team.
