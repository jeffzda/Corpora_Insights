- record_id: ARENA-DLV-41602
  source_title: CSIRO Hydrogen to Ammonia R&D Project - Mid-term Knowledge Sharing
    Report
  publish_date: 2020-07
  project_name: CSIRO Hydrogen to Ammonia R&D Project
  what_happened: Energy and capital requirement modelling (flow sheeting) identified
    that the low-pressure membrane process requires downstream separation of mixed
    gases for recycling, which is potentially capital- and energy-intensive — a challenge
    not fully anticipated at project outset.
  lesson_learnt: For novel reactor technologies operating at non-standard pressures,
    include process-level flow sheeting and energy calculations for gas separation
    and recycling in the initial feasibility scope — downstream separation can become
    a dominant cost and energy driver that materially affects commercial viability.
