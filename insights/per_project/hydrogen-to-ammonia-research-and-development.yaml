- record_id: ARENA-DLV-41603
  source_title: CSIRO Hydrogen to Ammonia R&D Project - Mid-term Knowledge Sharing
    Report
  publish_date: 2020-07
  project_name: CSIRO Hydrogen to Ammonia R&D Project
  what_happened: Techno-economic analysis found that hydrogen cost represents 70–80%
    of the levelised cost of ammonia regardless of process route, and that renewable
    ammonia from electrolysis-based hydrogen is unlikely to be cost-competitive with
    conventional unabated ammonia production in the short to medium term — even at
    zero electricity cost, ammonia cost remains $470–800/t versus $200–300/t for conventional
    production.
  lesson_learnt: Renewable hydrogen-to-ammonia projects should define explicit cost
    competitiveness conditions and carbon pricing scenarios at the outset — without
    carbon costs or regional transport premiums, electrolysis-based renewable ammonia
    is unlikely to achieve cost parity with conventional production in the near term,
    and this should inform go/no-go decisions for scale-up.
  issue_severity: major
  project_type: industrial decarbonisation
  project_scale_band: pilot
  lifecycle_phase: concept/feasibility
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: commercial & market
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Analysis identified that cost competitiveness improves where
    biomass hydrogen is available (approaching $600/t in some regions), where carbon
    capture costs are imposed on conventional production, or where transport costs
    are prohibitive — these scenarios were flagged as the primary commercial pathways
    to pursue.
  transferability: broad
  delay_magnitude: null
  technology_domain: hydrogen
  source_pages: &id009
  - 10
  evidence_excerpt: It is unlikely that, even at large scale, that renewable ammonia
    will be lower cost than large scale conventional unabated ammonia production from
    coal or natural gas in the short to medium term. Even relatively extreme scenarios
    where a zero cost of electricity is used, the resulting costs are between $470-800/t
    of ammonia.
  confidence_note: issue_severity set to major because the cost gap fundamentally
    constrains the commercialisation pathway for the technology being developed.
