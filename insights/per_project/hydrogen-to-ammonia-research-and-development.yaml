- record_id: ARENA-DLV-23704
  source_title: Hydrogen to Ammonia Research and Development Public Report
  publish_date: '2022'
  project_name: CSIRO Hydrogen to Ammonia R&D Project – 2018 / RND002
  what_happened: A techno-economic analysis performed jointly by CSIRO and Orica estimated
    that a 10 tonne/day pilot-scale ammonia production facility based on the developed
    low-pressure membrane technology would cost approximately $15M (including electrolyser
    capital and operating costs but excluding solar PV), with ammonia production costs
    of around $650/tonne. Using lower-cost reactor materials reduced the estimate
    to $11.5M and $550/tonne respectively.
  lesson_learnt: Early techno-economic analysis conducted in parallel with lab-scale
    R&D, using industry partner (Orica) engineering input for flow-sheeting, provides
    credible cost signals to inform scale-up investment decisions — the $550–650/tonne
    production cost estimate at 10 t/day scale gives a concrete commercial benchmark
    against which to assess the pathway to competitiveness.
