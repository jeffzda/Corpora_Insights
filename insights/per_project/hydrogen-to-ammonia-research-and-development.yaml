  outcome_class: partial success
  secondary_failure_mode: poor scoping
  intervention_note: The team reduced reactor volume to overcome sealing issues and
    continued operation; a redesign of the affected reactor was identified as necessary
    to achieve the original >1 kg/day target in future work.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hydrogen
