- record_id: ARENA-DLV-23703
  source_title: Hydrogen to Ammonia Research and Development Public Report
  publish_date: '2022'
  project_name: CSIRO Hydrogen to Ammonia R&D Project – 2018 / RND002
  what_happened: At the end of the project, the demonstration rig had operated for
    over 200 hours total but had only produced approximately 1 kg of ammonia cumulatively
    — far below the design intent of 1 kg/day. Ammonia production rates improved progressively
    over operating time, rising from 0.3 kg/day to 0.4 kg/day during the final 25.5-hour
    continuous run, suggesting catalyst conditioning effects were still ongoing at
    project close.
  lesson_learnt: For catalytic membrane reactor demonstrations, schedule sufficient
    operating hours for catalyst conditioning before assessing peak performance —
    production rates that are still improving at 200 hours indicate the system had
    not reached steady-state, and early performance assessments may understate the
    technology's potential.
  issue_severity: moderate
