  evidence_excerpt: As the frequency of negative pricing intervals has increased,
    so too has the non-compliance with dispatch instructions from semi-scheduled generators.
    Output from semi-scheduled generators has been rapidly reducing to zero to avoid
    negative pricing without first receiving approval from AEMO to do so... This rule
    change requires them to always inform the market operator of the intention to
    move from anticipated generation output by rebidding and waiting to receive a
    price dispatch target.
