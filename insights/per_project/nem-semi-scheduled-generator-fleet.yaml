- record_id: ARENA-DLV-59254
  source_title: 'The Generator Operations Series: Negative Pricing and Bidding Behaviour
    on the NEM'
  publish_date: 2021-09
  project_name: NEM Semi-Scheduled Generator Fleet
  what_happened: Semi-scheduled VRE generators increasingly self-curtailed output
    to zero to avoid negative prices without first receiving a revised dispatch target
    from AEMO, in violation of National Electricity Rules dispatch compliance obligations.
    This behaviour created system security and reliability risks, ultimately triggering
    a rule change in April 2021 requiring semi-scheduled generators to always rebid
    and receive a revised dispatch target before deviating from anticipated generation.
  lesson_learnt: VRE project operators must ensure their bidding and curtailment systems
    are designed for full NER dispatch compliance — self-curtailment without a corresponding
    rebid and AEMO dispatch instruction is non-compliant and exposes the project to
    regulatory sanction, regardless of the commercial rationale for avoiding negative
    prices.
