  evidence_excerpt: In general, the results show that imposing fairness requirements
    into the DOE objective function calculation on the division of capacity allocated
    to customers participating in the DER marketplace has a detrimental impact on
    the technical and economic performance of the DOEs. Additionally, this negative
    impact can become worse with higher DER penetration rates as networks become more
    constrained.
