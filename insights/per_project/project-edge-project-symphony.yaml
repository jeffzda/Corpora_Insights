- record_id: ARENA-DLV-35108
  source_title: DEIP Market Integration Trials Summary Report 2.0
  publish_date: 2023-12
  project_name: Project EDGE / Project Symphony
  what_happened: Modelling studies in Projects EDGE and Symphony found that equal
    allocation methods for DOE flexible export capacity can result in poor overall
    outcomes for consumers and the electricity system. More sophisticated allocation
    methods that create unequal individual outcomes consistently outperformed equal
    allocation on network utilisation and economic metrics, with the performance gap
    widening under high CER penetration scenarios.
  lesson_learnt: Network planners implementing flexible export programs should move
    beyond equal DOE allocation methods as CER penetration grows — equal allocation
    is technically and economically inferior at higher penetration levels, though
    the social and equity implications of unequal allocation must be explicitly addressed
    through early consumer engagement.
