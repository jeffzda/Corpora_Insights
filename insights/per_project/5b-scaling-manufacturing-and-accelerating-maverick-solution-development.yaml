  evidence_excerpt: In Australia, a company can only access working capital funds
    from a commercial bank if it is accepted as a commercial credit customer, which
    has a restrictive definition and many small- to medium-sized enterprises struggle
    to obtain commercial bank credit. As a result, scaling companies are forced to
    seek more expensive sources of what should be a relatively low-risk credit transaction,
    such as venture equity and private debt.
