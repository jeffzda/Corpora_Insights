  outcome_class: re-scoped/adapted
  secondary_failure_mode: commercial & market
  intervention_note: Set up a structured transport trial that incidentally tested
    the commercial assumptions, revealing the tautliner availability and cost assumptions
    were wrong before significant misdirected investment was locked in.
  transferability: moderate
