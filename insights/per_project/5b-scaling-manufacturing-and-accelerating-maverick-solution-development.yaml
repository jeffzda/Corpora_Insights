  project_name: 5B Scaling Manufacturing and Accelerating Maverick Solution Development
  what_happened: 'Prior to the transport trial, 5B held beliefs that tautliner trailers
    were significantly more expensive and had limited availability on east-west interstate
    highways — assumptions that were driving investment in flatbed-compatible transport
    solutions. The trial setup revealed these assumptions were incorrect: tautliners
    were cheaper and more available than flatbeds on the relevant route.'
  lesson_learnt: Test commercial and logistical assumptions with structured trials
    before committing to design directions based on those assumptions — 5B's unverified
    beliefs about tautliner cost and availability drove unnecessary development effort
    toward flatbed-compatible solutions that was not warranted once the assumptions
    were checked.
