  what_happened: During installation of the Maverick Integration Kit (MIK) on recent
    projects, the construction team was found to be spending a significant proportion
    of their time receiving, sorting, and searching for inbound materials across the
    site rather than installing them, reducing labour efficiency.
  lesson_learnt: Introduce part kitting, improved product labelling, and well-designed
    packaging before site delivery to significantly reduce non-productive material
    handling time for construction teams installing prefabricated DC balance-of-system
    kits — the MIK installation experience showed that poor material organisation
    on site was a meaningful drag on construction productivity.
