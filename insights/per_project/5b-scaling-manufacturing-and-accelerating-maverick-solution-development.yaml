  evidence_excerpt: 'We had two impactful existing beliefs: (1) that tautliners were
    always significantly more expensive than standard flatbed trailers; and (2) that
    for east/west interstate highway transport, tautliner trailers had limited availability.
    The impact of these beliefs was a drive to develop transport options suitable
    for flatbed trailers. In setting up this trial, there was negligible price difference
    in the options (and both were used), and tautliner trailers were in fact cheaper
    and more available than flatbed trailers.'
