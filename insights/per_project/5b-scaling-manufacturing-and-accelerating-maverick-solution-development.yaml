  publish_date: 2025-02
  project_name: 5B Maverick Solar Solution Commercialisation
  what_happened: Utility-scale project customers and their financiers were concerned
    about company risk associated with procuring from a 10-year-old start-up whose
    product had been commercially available for only a fraction of the 30-year solar
    farm asset life. Stakeholders including banks, insurers, and EPCs found it difficult
    to evaluate bankability at scales often an order of magnitude larger than 5B's
    completed projects, threatening to exclude 5B from tender processes on financial
    stability grounds.
  lesson_learnt: Novel technology companies pursuing utility-scale contracts should
    engage insurance providers early to develop project-specific financial mechanisms
    or guarantees that address customer concerns about company longevity. Pricing
    incentives can be used to overcome bankability hesitance, but structural financial
    risk mitigation instruments are more durable than price discounts alone.
