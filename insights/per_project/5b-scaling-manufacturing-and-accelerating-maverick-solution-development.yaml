  publish_date: 2025-08
  project_name: 5B Scaling Manufacturing and Accelerating Maverick Solution Development
  what_happened: During commissioning of the first assembly line version (B2 line),
    a post-commissioning workshop with the production team revealed that intralogistics
    and human-hardware interaction had been inadequately tested during the proof of
    concept phase, leading to overlooked functional interaction issues that were only
    identified after the line was installed.
  lesson_learnt: Conduct a process flow workshop with the operations team during the
    design phase — not after commissioning — and implement full-scale proof of concept
    prototypes specifically to test human-hardware interaction before finalising production
    technology design. Overlooking this step in the B2 line resulted in rework to
    address intralogistic tasks that should have been resolved at design stage.
