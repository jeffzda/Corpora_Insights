  project_name: 5B Maverick Solar Solution Commercialisation
  what_happened: Conventional yield modelling tools (e.g. PVsyst) were designed for
    SAT technology and did not accurately model Maverick-specific performance characteristics
    such as bifacial gain and degradation losses, leading to an approximately 5% under-estimate
    of Maverick yield. For a 150 MW project this translated to an overestimate of
    CAPEX of approximately AUD 7.5 million, creating a systematic commercial disadvantage
    for the novel technology.
  lesson_learnt: Invest in third-party certification and data gathering very early
    in the product development cycle, and actively work with modelling tool providers
    to incorporate novel technology characteristics. Yield modelling gaps can generate
    material financial misrepresentations that bias customer decisions against a novel
    technology — closing these gaps is as important as the technology itself.
