  what_happened: 5B faced pressure from investors to expand internationally before
    achieving significant domestic utility-scale traction. Global expansion proved
    expensive and complex due to different regulatory environments, structural engineering
    codes, and supply chain challenges, making it difficult to leverage the Australian
    market as an effective testbed while simultaneously pursuing international markets.
