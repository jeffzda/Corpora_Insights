  what_happened: Cleaning trials on multiple 5B Maverick installations using a wide
    format PV module cleaning robot confirmed the practical feasibility of robotic
    cleaning. Time and motion data established that a North-South traverse strategy
    was the most efficient cleaning method, achieving commercially viable productivity
    rates.
  lesson_learnt: A wide format PV module cleaning robot operated at 65–70% of maximum
    speed using a North-South traverse strategy delivers the highest cleaning productivity
    on Maverick installations — this can now be proposed as a validated, feasible
    cleaning solution for new Maverick solar farm projects. Follow-up trials on large
    sites should be conducted to establish firm productivity rates.
