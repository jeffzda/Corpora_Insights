- record_id: ARENA-DLV-20455
  source_title: 5B Scaling Manufacturing and Accelerating Maverick Solution Development
    - Lessons Learnt Report 1
  publish_date: 2025-08
  project_name: 5B Scaling Manufacturing and Accelerating Maverick Solution Development
  what_happened: In developing the 5B Rover for vegetation management, 5B initially
    contracted an external partner to cover mechanical, electrical, and control software
    scopes. It became evident over an extended period that in-house product knowledge
    was essential for effective software and control optimisation, leading to a contract
    restructure that retained only the mechanical build with the external vendor while
    bringing electrical and control scope in-house.
  lesson_learnt: Allocate work packages so that components requiring rapid iteration
    and deep product knowledge — especially guidance and control software — are retained
    in-house, while externally contracting components that benefit from specialised
    supply chain and manufacturing expertise. Initial over-reliance on an external
    partner for software delayed realisation that in-house control was necessary for
    efficient long-term optimisation.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: commercial expansion
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: internal governance/resourcing
  failure_mode: coordination & stakeholders
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Restructured the commercial contract to scope the external vendor
    to mechanical build only, bringing electrical and control software in-house to
    allow rapid iteration and simplification of the control system.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id005
  - 11
  - 12
  evidence_excerpt: A key realisation was the imperative to maintain internal control
    over the guidance and control software. While our partners possess strong mechanical
    and software capabilities, it became evident that our in-depth product knowledge
    necessitates in-house software development and optimisation for long-term iteration
    and improvement. This understanding, though reached over an extended period, underscored
    that despite the initial belief that leveraging all the partners expertise (mechanical,
    electrical, and software) would accelerate the process, our direct product familiarity
    made internal management of the software and automation more valuable.
  confidence_note: delay_magnitude set to not quantified — the document states the
    realisation was reached 'over an extended period' but gives no specific duration.
