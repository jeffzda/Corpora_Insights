  publish_date: 2025-02
  project_name: 5B Maverick Solar Solution Commercialisation
  what_happened: 5B faced persistent incumbency bias in the Australian solar market,
    where ~92% of solar farms are built with single-axis tracker (SAT) technology.
    The incumbent technology is specified early in project lifecycles — often at the
    development application stage — making it difficult to substitute a novel technology
    even when it offers economic benefits, because decision-makers across the ecosystem
    (EPCs, lenders engineers, financiers, insurers) must all be convinced simultaneously.
  lesson_learnt: Map all stakeholders in the decision-making ecosystem (EPCs, owners
    engineers, developers, financiers, insurers) before engaging the market, and invest
    in developing relationships with one or two key players in each category. Focus
    on being specified early in project lifecycles — if a novel technology is excluded
    at the development application stage, later economic arguments are largely ineffective.
