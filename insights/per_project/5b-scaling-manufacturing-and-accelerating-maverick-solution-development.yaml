- record_id: ARENA-DLV-38705
  source_title: 5B Scaling Manufacturing and Accelerating Maverick Solution Development
    - Commercialisation Report
  publish_date: 2025-02
  project_name: 5B Maverick Solar Solution Commercialisation
  what_happened: Product development cycles for the Maverick were approximately 12
    months and resource intensive because changes — even minor ones — to the physical
    hardware product could have material impacts on wind certifications and other
    third-party validations. This is in stark contrast to software products which
    can be tested and adapted rapidly, and created tension between selling current
    versions and developing future iterations.
  lesson_learnt: Engage with utility-scale customers early in the product development
    cycle to understand their technical requirements, as these may take years to incorporate
    into a certified hardware product. Build customer technical requirements into
    the design phase before certification, not after — post-certification changes
    trigger full recertification cycles.
