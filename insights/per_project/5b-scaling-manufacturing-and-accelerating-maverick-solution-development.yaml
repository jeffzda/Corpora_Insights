    damage at all on the Mavericks aboard the tautliner trailer, and only minor rubbing
    of the galvanised coating on the Beams for the Mavericks on the flatbed trailer
    – this caused by the truck strapping vibrating in the wind. A full deployment
    test of all 4 x Mavericks was conducted post trial in Adelaide to verify the condition
    of the Mavericks.
