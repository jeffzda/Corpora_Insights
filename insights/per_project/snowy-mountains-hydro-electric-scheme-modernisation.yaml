- record_id: ARENA-DLV-72014
  source_title: Australian Energy Resource Assessment - Second edition, 2014
  publish_date: '2014'
  project_name: Snowy Mountains Hydro-Electric Scheme Modernisation
  what_happened: The Snowy Mountains Hydro-Electric Scheme undertook a A$400 million modernisation programme over seven years, replacing ageing equipment, increasing turbine efficiency and capacity, and
    ensuring continued reliable operation. The Lower Tumut project was completed with six units each providing 25–50 MW of additional capacity; work then commenced on the Upper Tumut project expected to
    add 40 MW.
  lesson_learnt: Large-scale hydro asset modernisation programmes require multi-year, staged delivery structures with distinct sub-project scopes; sequencing lower-risk sub-projects first (Lower Tumut before
    Upper Tumut) allows lessons and commissioning experience to be applied to subsequent stages.
