  project_name: RPF Ingleburn & Yatala Energy Design (Real Pet Foods)
  what_happened: The steam cooking tunnels at Yatala were identified as consuming
    47.97 TJ/yr of gas, with 34.91 TJ/yr reducible through recovery and reduction
    measures — a loss that was described as 'hiding in plain sight' and had not been
    identified by previous energy audits.
  lesson_learnt: Steam tunnel losses are frequently the largest single energy waste
    in food manufacturing facilities but are routinely missed by top-down energy audits
    — a full heat and mass balance across all processes, including apparently minor
    ones, is required to surface these opportunities.
