- record_id: ARENA-DLV-2578
  source_title: 'ARENA Insights Hot Decarbonisation Webinar: Renewable Heat and Energy
    Efficiency at Industrial Facilities'
  publish_date: 2024-10
  project_name: RPF Ingleburn & Yatala Energy Design (Real Pet Foods)
  what_happened: The retort cooking and sterilisation process at RPF consumed 57.85
    TJ/yr of gas; the study identified that recovering, storing and reusing heat via
    thermal energy storage (TES) with a three-step heating and four-step cooling sequence
    using hot water at 90°C and 80°C could reduce gas demand to 39.6 TJ/yr, with the
    TES-plus-reuse option achieving an IRR of 16.05% and payback of 6.46 years.
  lesson_learnt: Thermal energy storage using water as the storage medium is the most
    economical heat recovery solution for batch industrial processes such as retort
    cooking — the approach maximises heat reuse within the process before any external
    substitution and should be evaluated before heat pumps or other advanced technologies.
