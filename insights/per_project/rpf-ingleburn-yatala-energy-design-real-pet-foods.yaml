    would require additional electricity supply feeders of 15 MW at Ingleburn and
    10 MW at Yatala, with a renewable PPA likely costing $0.18–0.24/kWh — producing
    a negative EBIT impact of $5.9M–$8.2M per annum — making direct electrification
    financially unattractive at current electricity prices.
  lesson_learnt: Full electrification of industrial heat is not currently financially
    viable for food manufacturers at renewable PPA prices of $0.18–0.24/kWh — energy
    efficiency reduction is the superior near-term decarbonisation investment, and
    grid capacity upgrades required for electrification should be secured early given
    the risk that capacity may be unavailable later.
