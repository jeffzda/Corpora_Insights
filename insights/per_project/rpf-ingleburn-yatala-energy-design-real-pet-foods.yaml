- record_id: ARENA-DLV-2557
  source_title: 'ARENA Insights Hot Decarbonisation Webinar: Renewable Heat and Energy
    Efficiency at Industrial Facilities'
  publish_date: 2024-10
  project_name: RPF Ingleburn & Yatala Energy Design (Real Pet Foods)
  what_happened: Energy audits overestimated waste heat available for a heat pump
    application because audits assumed equipment operates at maximum capacity continuously,
    whereas in reality heat sources were intermittent and lower grade on average —
    for example, refrigeration plant rejected heat at 25°C rather than the 35°C maximum
    used in audit calculations.
  lesson_learnt: Energy audit assumptions about waste heat quality and availability
    are systematically optimistic — use real-time metering and first-principles analysis
    to characterise heat source intermittency and actual temperatures before sizing
    heat pump or heat recovery equipment.
