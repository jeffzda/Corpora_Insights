  what_happened: Meters were installed during the study rather than before it, causing
    inefficiency in the study process because calculations had to be performed without
    validated data and then re-checked once metering was operational.
  lesson_learnt: Install and commission energy meters before starting a heat and mass
    balance study — installing them in parallel with the study creates rework and
    delays; validated meter data from the outset is required for accurate first-principles
    calculations.
