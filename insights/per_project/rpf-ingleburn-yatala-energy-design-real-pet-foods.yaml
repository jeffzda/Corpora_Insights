  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Revised the project scope and identified an alternative solution
    recovering energy from cooked product to preheat raw product, delivering 5,187
    GJ/yr savings.
  transferability: moderate
  delay_magnitude: null
  technology_domain: industrial renewables
  source_pages: &id003
  - 60
  evidence_excerpt: Vapour recovery and Mechanical re-compression (MVR) was considered
