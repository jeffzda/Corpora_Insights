- record_id: ARENA-DLV-2554
  source_title: 'ARENA Insights Hot Decarbonisation Webinar: Renewable Heat and Energy
    Efficiency at Industrial Facilities'
  publish_date: 2024-10
  project_name: RPF Ingleburn & Yatala Energy Design (Real Pet Foods)
  what_happened: Energy audits conducted prior to the detailed first-principles heat
    and mass balance study significantly overestimated and underestimated savings
    for individual processes — expected savings on the Dog Roll project were 10.4
    TJ versus 5.39 TJ in reality, while expected losses on Steam Tunnels were estimated
    at 6.8 TJ versus 38.9 TJ in reality.
  lesson_learnt: Do not commit to technology solutions based on energy audits alone
    — detailed heat and mass balance from first principles must precede technology
    selection, as top-down audits routinely misstate both the magnitude and location
    of losses.
  issue_severity: major
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: industrial operator
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: data & measurement
  intervention_note: Built a detailed heat and mass balance from first thermodynamic
    principles and validated with installed meters, which corrected the audit-derived
    estimates and identified the steam tunnels as the largest loss source.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: industrial renewables
  source_pages: &id001
  - 60
  - 70
  evidence_excerpt: Committing to technology solutions based on Energy Audits was
    a mistake. Detailed process knowledge, Heat & Mass flow data should guide the
    choice of solution... Expected savings on the Dog Roll project were 10.4TJ vs
    5.39TJ in reality. Expected loss on Steam tunnels was estimated at 6.8TJ vs 38.9TJ
    in reality.
