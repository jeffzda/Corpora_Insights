- record_id: ARENA-DLV-2556
  source_title: 'ARENA Insights Hot Decarbonisation Webinar: Renewable Heat and Energy
    Efficiency at Industrial Facilities'
  publish_date: 2024-10
  project_name: RPF Ingleburn & Yatala Energy Design (Real Pet Foods)
  what_happened: Mechanical vapour recompression (MVR) was initially identified as
    a promising solution for the dog roll cooking process, but first-principles analysis
    revealed that available MVR technology is only cost-effective at above 5,000 kg/hr
    of vapour recovery, which this process did not meet. A reciprocating recompression
    alternative was also rejected because it required positive suction pressure incompatible
    with a vacuum flash vessel.
  lesson_learnt: Validate technology applicability against actual process parameters
    before including it in a business case — MVR and similar technologies have minimum-scale
    thresholds that render them uneconomic at typical process sizes; first-principles
    mass balance must precede technology selection.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: industrial operator
