  publish_date: 2024-10
  project_name: RPF Ingleburn & Yatala Energy Design (Real Pet Foods)
  what_happened: A heat pump was initially considered for recycling low-grade heat
    in the retort cooking process, but the detailed heat balance showed that the demand
    for high-temperature heat was already met by the thermal energy storage system,
    and re-using low-grade heat in the boiler as make-up water proved cheaper and
    more effective than a heat pump.
  lesson_learnt: Heat pumps are not always the optimal solution for low-grade heat
    recovery — a complete heat and mass balance may reveal simpler, cheaper alternatives
    such as boiler make-up water reuse; always complete the energy balance before
    specifying heat pump equipment.
