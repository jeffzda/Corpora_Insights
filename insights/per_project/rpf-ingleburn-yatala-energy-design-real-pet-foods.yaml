  what_happened: Designing hygienic stainless steel food-industry-standard solutions
    for the steam tunnel recovery project was found to be prohibitively expensive,
    requiring engagement of a different group of trades and suppliers than normally
    used, and the final solution involved commercially available technology applied
    differently from its intended use.
  lesson_learnt: Food-grade hygienic design requirements dramatically increase capital
    costs for heat recovery retrofits — explore repurposing commercially available
    technology from adjacent industries before commissioning bespoke food-grade engineering,
    and engage non-standard trades early.
