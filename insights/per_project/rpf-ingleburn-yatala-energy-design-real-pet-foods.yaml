  source_title: 'ARENA Insights Hot Decarbonisation Webinar: Renewable Heat and Energy
    Efficiency at Industrial Facilities'
  publish_date: 2024-10
  project_name: RPF Ingleburn & Yatala Energy Design (Real Pet Foods)
  what_happened: No commercially available instrumentation with a proven track record
    for measuring steam density in air existed, preventing reliable feedback control
    of steam injection in cooking tunnels. OEMs relied on commissioning set-points
    rather than real-time measurement, and smoke detector technology was identified
    as a potential adaptation requiring significant R&D.
  lesson_learnt: The absence of commercially proven instrumentation for steam-in-air
    density measurement is a significant technology gap for industrial steam cooking
    applications — project teams should plan for custom instrumentation development
    time and cost, or design control strategies that do not rely on direct steam density
    measurement.
