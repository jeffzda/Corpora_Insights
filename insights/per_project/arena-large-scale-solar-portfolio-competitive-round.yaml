- record_id: ARENA-DLV-33661
  source_title: Large Scale Solar Portfolio Evaluation
  publish_date: '2019-12-20'
  project_name: ARENA Large-Scale Solar portfolio (Competitive Round)
  what_happened: Marginal Loss Factors (MLFs) were overestimated in 10 of 12 Competitive
    Round projects, resulting in an average yield deficit of approximately 6% in the
    first year of operations. The concentration of projects in Queensland and New
    South Wales, and the rapid, unforeseen influx of new generators into the same
    grid regions, were the primary drivers.
  lesson_learnt: Engage a top-tier consultant at early stages to model MLF sensitivity
    and select project size and location accordingly — MLF reductions of over 10%
    in three years were common for solar farms in fringe-of-grid regions, and the
    concentration of projects in similar grid locations dramatically compounds the
    risk.
