  what_happened: The home study found that the coincidence between a typical 5.82
    kW South Australian solar system and a 7.2 kW EV charger meant solar could only
    fulfil part of the vehicle charging demand, and only on sunny days when the vehicle
    was at home, limiting the renewable charging benefit in practice.
  lesson_learnt: EV-solar integration programmes should account for the mismatch between
    residential solar output and charger power ratings — slower 'generation-following'
    chargers or smart charging products that throttle to match solar output are needed
    to maximise renewable energy use and improve the financial case.
