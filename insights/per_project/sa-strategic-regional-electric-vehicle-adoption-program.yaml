  what_happened: The Charge Together South Australia study found clusters of EV intenders
    concentrated around university areas, suggesting street-level transformer hotspots
    could emerge in those localities even within the next regulatory period, despite
    aggregate network capacity appearing sufficient.
  lesson_learnt: Network planners should not rely solely on aggregate zone-substation
    capacity figures — localised clustering of EV intenders in areas such as university
    precincts can stress individual street transformers well before fleet-wide penetration
    reaches threshold levels, and bottom-up, activity-based data is required to identify
    these pockets.
