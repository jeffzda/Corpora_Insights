- record_id: ARENA-DLV-10101
  source_title: Unlocking Demand for Renewably Powered Electric Vehicles
  publish_date: '2018'
  project_name: Charge Together South Australia
  what_happened: 'A behavioural research program recruiting 1,600 South Australian
    PEV intenders found a large intention-action gap: despite strong stated interest,
    the vast majority of participants would not have completed a PEV purchase due
    to an accumulation of barriers encountered during the simulated customer journey.'
  lesson_learnt: Stated consumer intent to buy EVs significantly overstates likely
    purchase outcomes in the Australian context — demand-side interventions must address
    the full customer journey, not just awareness, to convert intenders into buyers.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: research organisation/university
