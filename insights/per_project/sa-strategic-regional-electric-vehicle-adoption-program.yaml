  what_happened: The document found that clusters of multiple charging use cases in
    a localised area — for example, a combination of dense home chargers, a DC rapid
    charger, and AC fast chargers within a single network feeder area — represent
    the highest aggregate hotspot risk, even where each individual installation would
    not independently trigger a constraint.
  lesson_learnt: Network planning for EV charging must assess the aggregate load of
    mixed-use charger clusters at feeder level, not just individual connection points
    — a business district or precinct combining workplace, carpark, and rapid chargers
    within a single zone can exceed feeder capacity through cumulative load even when
    each site independently appears manageable.
