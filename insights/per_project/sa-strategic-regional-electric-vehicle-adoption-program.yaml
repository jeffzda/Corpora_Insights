  what_happened: The SA Government Fleet (Fleet SA), with 7,151 vehicles and a 30%
    low-emissions target it was not meeting (sitting at 22.7%), was structurally disincentivised
    from adopting EVs because fuel costs were borne by individual agencies rather
    than Fleet SA, and vehicles were sold after 3 years so servicing savings accrued
    to secondary owners rather than the fleet operator.
