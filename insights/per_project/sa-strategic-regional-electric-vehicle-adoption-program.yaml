  what_happened: Australia's lack of fuel efficiency standards, luxury car tax, fringe
    benefits tax arrangements, and absence of purchase incentives meant automotive
    manufacturers had little commercial motivation to prioritise Australia as a supply
    market; one senior automotive executive noted that European CAFÉ regulation represented
    a potential $1.5B fine for non-compliance, causing manufacturers to divert supply
    to incentivised markets.
  lesson_learnt: Without supply-side policy signals (emissions standards, purchase
    incentives, ZEV mandates) comparable to key international markets, Australia will
    continue to be deprioritised by global automakers for EV supply allocation — addressing
    government policy inaction on vehicle standards is a prerequisite for improving
    model availability.
