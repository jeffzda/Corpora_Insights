  what_happened: The home energy monitoring study, conducted over only three months
    (March–May 2018) with 45 South Australian households, found that coincident home
    EV charging by households sharing similar work-life patterns could impose considerable
    additional load on a local distribution transformer, with the severity depending
    on charger size, driving distance, and presence of rooftop solar or battery storage.
  lesson_learnt: Residential hotspot risk is primarily determined by the co-incidence
    of charging patterns on a shared transformer, not just by fleet penetration rates
    — network planners should use activity-based load profiles segmented by work-life
    pattern and charger size, and encourage solar and battery adoption to flatten
    residential transformer peaks.
