- record_id: ARENA-DLV-49554
  source_title: Managing the Impacts of Renewably Powered Electric Vehicles on Distribution
    Networks
  publish_date: '2018'
  project_name: Strategic Regional EV Adoption Program (South Australia)
  what_happened: Static time-of-use (TOU) tariffs deployed by utilities to shift EV
    charging to off-peak periods caused a rebound peak during the designated low-rate
    window, as experienced by Progress Energy in North Carolina, where many customers
    scheduled charging to start simultaneously, creating higher off-peak peaks than
    the original peak demand.
  lesson_learnt: Static TOU tariffs for EV charging can produce unintended load spikes
    during designated cheap-rate periods when large numbers of customers synchronise
    their charging start times — dynamic rates or staggered incentive structures should
    be preferred over uniform static tariffs to avoid trading one peak for another.
