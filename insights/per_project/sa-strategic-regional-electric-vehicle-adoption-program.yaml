- record_id: ARENA-DLV-10108
  source_title: Unlocking Demand for Renewably Powered Electric Vehicles
  publish_date: '2018'
  project_name: Charge Together South Australia
  what_happened: Fleet managers in South Australia were found to make rational TCO-based
    purchasing decisions but faced a disconnect between organisational sustainability
    aspirations and the incentives, tools and vehicle options available to fleet departments;
    most did not have PEVs as a priority and cited depreciation uncertainty, insufficient
    product variety, and lack of fit-for-purpose models as primary barriers.
  lesson_learnt: Fleet EV adoption requires targeted interventions addressing depreciation
    risk and residual value certainty — fleet managers respond to TCO signals but
    will not act without transparent residual value data and a credible vehicle procurement
    pathway; grant funding to offset depreciation risk and aggregated buying programmes
    are the most effective levers.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: commercial & market
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: coordination & stakeholders
  intervention_note: The report recommended a competitive fleet transition grant fund
    covering vehicle price gaps, depreciation risk, and renewable energy powering
    costs, alongside aggregated fleet purchasing initiatives.
  transferability: moderate
  delay_magnitude: null
  technology_domain: EV
  source_pages: &id008
  - 7
  - 31
  - 32
  evidence_excerpt: There is a very low percentage of PEVs in fleets today... Fleet
    managers do approach these purchases from a rational economic perspective with
