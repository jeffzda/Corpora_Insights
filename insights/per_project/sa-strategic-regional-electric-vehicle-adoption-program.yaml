  what_happened: Participants in behavioural safaris were unable to arrange test drives
    of EVs at South Australian dealerships — upon visiting a strip of car yards they
    found no EV available to drive at any dealer, despite seeking models from Hyundai,
    Mitsubishi, and Nissan. Dealers were also found to be poorly trained on EVs and
    had mixed motivations to sell them.
  lesson_learnt: Car dealerships are a structural bottleneck to EV adoption — their
    limited EV inventory, poor product training, and financial disincentives (EVs
    require more sales effort and reduce servicing revenue) mean that test-drive access
    must be structured independently of dealer enthusiasm, such as through manufacturer
    or advocacy-body managed trial fleets.
