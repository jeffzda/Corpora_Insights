  project_type: transport electrification
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: commercial & market
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The project developed an online TCO calculator to help consumers
    and fleets compare full ownership costs; the report also recommended direct purchase
    price incentives to close the sticker-price gap.
  transferability: broad
  delay_magnitude: null
  technology_domain: EV
  source_pages: &id003
  - 6
  - 24
  evidence_excerpt: In general, affordability is a significant barrier and understanding
    total cost of ownership, while important, will not solve this issue alone. The
    current price gap between an electric vehicle and a similar equivalent vehicle
    is between $15,000 and $20,000 more expensive from an upfront perspective and
    between $5000 and $10,000 more expensive after five years of ownership.
