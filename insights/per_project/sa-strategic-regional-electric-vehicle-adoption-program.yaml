- record_id: ARENA-DLV-10103
  source_title: Unlocking Demand for Renewably Powered Electric Vehicles
  publish_date: '2018'
  project_name: Charge Together South Australia
  what_happened: Survey and behavioural safari data showed that upfront purchase price
    was an issue for 70% of respondents, with a price gap of $13,000–$15,488 between
    comparable EV and ICE models; even participants who said they considered total
    cost of ownership (TCO) defaulted to sticker-price sensitivity when simulating
    an actual purchase decision.
  lesson_learnt: Incentive frameworks targeting EV affordability should focus on reducing
    the upfront sticker price gap (approximately $10,000 for private buyers), not
    only TCO education — the 'energy paradox' means consumers systematically underweight
    long-run fuel savings at the point of purchase.
