- record_id: ARENA-DLV-10106
  source_title: Unlocking Demand for Renewably Powered Electric Vehicles
  publish_date: '2018'
  project_name: Charge Together South Australia
  what_happened: 42% of surveyed PEV intenders cited lack of charging infrastructure
    as a major purchasing barrier; participants in behavioural safaris found virtually
    no visible indicators of EVs or charging infrastructure in South Australia, reinforcing
    psychological reluctance to purchase even though home charging was practically
    feasible for most.
  lesson_learnt: Strategically placed, highly visible fast-charging infrastructure
    has a disproportionate psychological impact on EV adoption relative to investment
    — infrastructure deployment should prioritise visible urban locations to shift
    social norms, not just maximise geographic coverage.
