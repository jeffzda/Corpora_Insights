  what_happened: The document found that DC fast chargers (Level 3) have an episodic
    and high-power demand profile that is difficult to pair with renewable energy
    generation and creates localised network capacity pressure, unlike Level 2 charging
    which is more manageable through demand response.
  lesson_learnt: Policy makers and network planners should couple DC fast charging
    infrastructure with local battery storage to smooth episodic high-power demand
    and enable renewable energy integration — without storage, DC fast chargers impose
    large peak loads that are incompatible with both network asset utilisation and
    renewable generation profiles.
