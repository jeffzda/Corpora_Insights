- record_id: ARENA-DLV-49569
  source_title: Managing the Impacts of Renewably Powered Electric Vehicles on Distribution
    Networks
  publish_date: '2018'
  project_name: Strategic Regional EV Adoption Program (South Australia)
  what_happened: The SAPN off-peak controlled load tariff for EV charging requires
    customers to have a separate controlled load circuit, and the 40A maximum on that
    circuit means that a large EV charger and a hot water service cannot run simultaneously,
    requiring customers to install an additional time switch — a complexity that was
    identified as a likely barrier to uptake.
  lesson_learnt: When adapting existing controlled load tariff structures for EV charging,
    utilities must assess whether the existing circuit constraints (amperage limits,
    shared circuits with hot water) create practical barriers for customers — product
    design should address these interactions explicitly, or provide automated switching
    solutions, to avoid deterring uptake of a tariff that would otherwise benefit
    both customers and the network.
