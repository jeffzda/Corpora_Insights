  project_name: Strategic Regional PEV Adoption Program
  what_happened: The study found that although consumers stated they considered total
    cost of ownership (TCO) when making purchasing decisions, in practice they focused
    primarily on upfront purchase price — a behavioural phenomenon described as the
    'energy paradox' — meaning TCO arguments alone did not overcome affordability
    barriers.
  lesson_learnt: Incentive programmes and communications targeting EV affordability
    must address upfront purchase price directly, not rely solely on TCO arguments
    — bounded rationality means most buyers will not act on favourable long-term economics
    if the sticker price gap remains large.
