  evidence_excerpt: We found that the global momentum with respect to PEV consumers
    may have led to unwarranted comfort levels in Australia and outstripped the reality
    of the barriers facing those intending to buy a vehicle. The gap between intention
    and likely purchases at the bottom of the funnel will remain wide unless strong
    intervention is undertaken by industry and government.
  confidence_note: Outcome class assessed as knowledge generated despite setback —
