- record_id: ARENA-DLV-10102
  source_title: Unlocking Demand for Renewably Powered Electric Vehicles
  publish_date: '2018'
  project_name: Charge Together South Australia
  what_happened: During simulated purchase journeys (behavioural safaris), almost
    all participants would have abandoned the buying process due to the near-total
    unavailability of affordable PEV models in Australia — at time of writing only
    one affordable model (Mitsubishi Outlander PHEV) was readily available.
  lesson_learnt: Vehicle availability is a primary practical barrier to EV adoption
    in Australia; programs seeking to accelerate uptake must account for the reality
    that even motivated buyers cannot complete a purchase without accessible product,
    and policy should target supply-side availability alongside demand-side interventions.
