  source_title: Executive Summary - Strategic Regional PEV Adoption Program
  publish_date: 2018-07
  project_name: Strategic Regional PEV Adoption Program
  what_happened: Total cost of ownership modelling showed that the upfront purchase
    premium for PEVs ($13,000–$15,488) was not recovered within a typical 5-year ownership
    period, with the cost-to-own gap remaining negative across all four personas at
    five years, approaching parity only around nine years depending on driving behaviour.
  lesson_learnt: EV incentive design should target the upfront price gap explicitly
    — the business case does not close within typical fleet replacement cycles at
    current price premiums, meaning TCO parity arguments are insufficient unless ownership
    periods extend well beyond five years.
