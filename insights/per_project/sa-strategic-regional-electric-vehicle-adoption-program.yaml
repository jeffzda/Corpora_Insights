- record_id: ARENA-DLV-10105
  source_title: Unlocking Demand for Renewably Powered Electric Vehicles
  publish_date: '2018'
  project_name: Charge Together South Australia
  what_happened: Behavioural safari participants who used the EV-Drive GPS tracking
    application found that their actual driving patterns were well within EV range
    and that range anxiety diminished significantly once real-world data was available;
    however, without such tools participants anchored their purchase decision on the
    longest (atypical) trip they anticipated.
  lesson_learnt: Range anxiety is substantially a perception problem addressable through
    personalised data tools — providing intenders with GPS-based trip analysis showing
    their actual versus perceived range requirements is a cost-effective intervention
    to reduce this barrier before investing in large-scale public charging infrastructure.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The project developed and deployed the 'EV-Drive' GPS tracking
    app; after over 600 drives from 30 participants, few had any challenge imagining
    that PEV range would be a problem.
  transferability: broad
  delay_magnitude: null
  technology_domain: EV
  source_pages: &id005
  - 28
  - 42
  evidence_excerpt: We also evidenced a strong behaviour of almost all of those evaluating
    transitioning to a PEV – anchoring their decision around the longest distances
    that participants would need to drive rather than the typical distances driven...
    With those in the surveys who installed and used our EV-Drive application there
    was a clear realisation that range was not as significant a barrier as they felt
    originally.
