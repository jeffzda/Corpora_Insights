- record_id: ARENA-DLV-10107
  source_title: Unlocking Demand for Renewably Powered Electric Vehicles
  publish_date: '2018'
  project_name: Charge Together South Australia
  what_happened: Among the 112 participants identified as most ready to buy, 55% indicated
    they would purchase a used EV, with stated willingness-to-pay aligned to actual
    prices of importable used PEVs; yet no used EV market exists in Australia despite
    18.8 million registered vehicles.
  lesson_learnt: There is a latent and price-aligned market for used EVs in Australia
    that is currently inaccessible due to the absence of grey-import pathways and
    a second-hand EV supply chain — supporting used EV imports would immediately expand
    the addressable market and reduce the affordability barrier for price-sensitive
    buyers.
