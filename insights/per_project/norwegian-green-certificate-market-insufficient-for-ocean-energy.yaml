  evidence_excerpt: Although the price of EUR 50-55/MWh is a good incentive for maturing
    renewable energy technologies, it is certainly insufficient for ocean energy project
    developers due to the high CAPEX of these technologies. At this early stage of
    development of the sector, government grants represent a more incentivising tool
    for project developers.
