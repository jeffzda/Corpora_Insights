- record_id: ARENA-DLV-50025
  source_title: Ocean Energy Report by Seanergy and Ernst and Young
  publish_date: 2016-06
  project_name: Norwegian Green Certificate Market — Insufficient for Ocean Energy
  what_happened: Norway's joint green certificate market with Sweden provided EUR
    50–55/MWh per MWh of renewable electricity produced, regardless of technology.
    This price level was assessed as a good incentive for mature renewables but explicitly
    insufficient for ocean energy project developers given the high CAPEX of these
    technologies, making government grants a more effective support instrument.
  lesson_learnt: Technology-neutral renewable energy certificate markets set at prices
    appropriate for mature technologies (wind, hydro) are insufficient to drive ocean
    energy commercialisation; ocean energy projects at pilot and demonstration scale
    require dedicated grant instruments or technology-specific premium tariffs rather
    than technology-neutral market mechanisms.
