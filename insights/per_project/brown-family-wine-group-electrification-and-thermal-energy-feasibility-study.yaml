  publish_date: 2025-03
  project_name: Brown Family Wine Group Industrial Energy Transformation Study
  what_happened: The production efficiency study found that steam pipe thermal lagging
    and compressed air leak detection and repair were the only two production-related
    energy efficiency projects with positive NPV out of five assessed; the advanced
    tank temperature control project had an NPV of -$1,047,398 despite delivering
    167 T CO2-e/year abatement.
  lesson_learnt: In wine and food production facilities, low-cost energy efficiency
    measures such as steam pipe insulation (payback 0.4 years, NPV $30,531) and compressed
    air leak detection (payback 1.3 years, NPV $12,123) should be implemented as immediate
    priorities; high-capital control upgrades require case-by-case justification on
    broader grounds (e.g. asset end-of-life or reliability) rather than energy savings
    alone.
