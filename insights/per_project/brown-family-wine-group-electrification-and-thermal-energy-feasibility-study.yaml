  source_title: BFWG - Electrification and Thermal Energy Feasibility Study - IETS
    Summary & Emissions Reduction Roadmap
  publish_date: 2025-03
  project_name: Brown Family Wine Group Industrial Energy Transformation Study
  what_happened: Most heating processes at BFWG requiring steam actually operated
    at temperatures below 80°C, meaning a steam-based system was being used where
    hot water would suffice; this represented a missed opportunity for heat pump electrification
    at high COP (3–4), though the centralised heat pump project had a payback of 12.7
    years and negative NPV of -$370,951 under current electricity and gas price parity.
  lesson_learnt: Food and beverage manufacturers using steam for process heating should
    verify whether processes actually require steam temperatures or whether hot water
    would suffice — if processes operate below 80°C, switching to hot water enables
    heat pump electrification at COP 3–4, reducing emissions and future-proofing against
    gas price rises and supply uncertainty, even if payback exceeds 10 years at current
    energy prices.
  issue_severity: moderate
