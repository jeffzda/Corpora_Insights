- record_id: ARENA-DLV-40471
  source_title: BFWG - Electrification and Thermal Energy Feasibility Study - IETS
    Summary & Emissions Reduction Roadmap
  publish_date: 2025-03
  project_name: Brown Family Wine Group Industrial Energy Transformation Study
  what_happened: The onsite efficiency measures identified in the roadmap (8 projects,
    CAPEX ~$1.85 million) delivered a combined NPV of $191,556 and a simple payback
    of 8.7 years, making them the only component of the roadmap with a positive NPV;
    the onsite solar PV programme (2 projects, ~$844,000 CAPEX) had a negative NPV
    of -$218,963 at a 14.3 year payback.
  lesson_learnt: In industrial decarbonisation roadmaps, energy efficiency and fuel
    switching measures typically deliver the strongest financial returns (positive
    NPV) and should be implemented before onsite renewable generation, which may have
    negative NPV but still reduces dependence on certificate purchases; the sequencing
    of the roadmap materially affects total cost of abatement.
