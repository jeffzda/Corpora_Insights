  evidence_excerpt: Process cooling is another major load in the food manufacturing
    sector and a source of waste heat as the hot refrigerant or condenser water can
    be used to heat water for use in heat pumps. The size of system at which this
    can start to be considered is around 500 kWr. Consideration must also be given
    to the distance between refrigeration and hot water plants, as well as the complexity
    of their integration. These types of solutions work better when the cooling and
    heating loads are both high at the same time of year, for example, during vintage
    season.
