  what_happened: At the BFWG site, the electricity cost and gas cost per GJ were approximately
    equal at around $27–$28/GJ; even with a COP of 3–4, the central heat pump project
    had a payback of 12.7 years, but the existing boilers were at or near end of life,
    meaning the net incremental cost of heat pump replacement over boiler replacement
    was substantially lower.
