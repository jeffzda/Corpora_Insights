- record_id: ARENA-DLV-40469
  source_title: BFWG - Electrification and Thermal Energy Feasibility Study - IETS
    Summary & Emissions Reduction Roadmap
  publish_date: 2025-03
  project_name: Brown Family Wine Group Industrial Energy Transformation Study
  what_happened: Scope 2 emissions (grid electricity) accounted for 88% of BFWG's
    total emissions baseline, while Scope 1 (mainly LPG and diesel) accounted for
    only 12%, meaning that grid electricity consumption was overwhelmingly the dominant
    emissions driver and the primary target for abatement through efficiency, onsite
    renewables, and GreenPower.
  lesson_learnt: Industrial sites with high grid electricity intensity (such as wineries
    with large refrigeration loads) should focus their emissions reduction strategy
    primarily on Scope 2 electricity efficiency and renewable procurement before targeting
    Scope 1 fuel switching, as Scope 2 typically dominates the abatement opportunity
    in this sector.
