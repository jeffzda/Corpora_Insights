  intervention_note: Study recommended replacing the steam boiler and major hot water
    boilers with water-source heat pumps utilising waste heat from nearby refrigeration
    systems, with the decision framed as avoiding fossil fuel 'lock-in' given uncertain
    gas supply in Victoria.
