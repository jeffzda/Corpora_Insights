- record_id: ARENA-DLV-40455
  source_title: BFWG - Electrification and Thermal Energy Feasibility Study - IETS
    Summary & Emissions Reduction Roadmap
  publish_date: 2025-03
  project_name: Brown Family Wine Group Industrial Energy Transformation Study
  what_happened: Refrigeration accounted for approximately 54% of site electricity
    consumption at the BFWG Milawa winery, making it by far the largest single energy
    consumer; however, no advanced energy management or load optimisation controls
    were in place across three hydraulically separate refrigeration sub-systems operating
    on different schedules.
  lesson_learnt: In food manufacturing and wine production sites, refrigeration is
    typically the dominant electricity load and should be the primary focus of energy
    audits; all identified refrigeration optimisation projects at BFWG had negative
    CO2 abatement costs (i.e. they save money while reducing emissions) and should
    be prioritised over other measures.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: industrial operator
  delay_category: null
  failure_mode: poor scoping
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Study identified four refrigeration optimisation projects (optimum
    staging, north plant isolation, variable head pressure control, and north-west
    integration) with payback periods of 0.6 to 2.2 years and combined NPV of over
    $400,000.
  transferability: moderate
  delay_magnitude: null
  technology_domain: industrial renewables
  source_pages: &id007
