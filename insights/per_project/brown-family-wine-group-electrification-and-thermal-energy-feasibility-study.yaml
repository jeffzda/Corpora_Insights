- record_id: ARENA-DLV-40470
  source_title: BFWG - Electrification and Thermal Energy Feasibility Study - IETS
    Summary & Emissions Reduction Roadmap
  publish_date: 2025-03
  project_name: Brown Family Wine Group Industrial Energy Transformation Study
  what_happened: The waste heat from BFWG's refrigeration condensers was identified
    as a viable low-grade heat source for water-source heat pumps to replace the LPG
    steam boiler, but the study noted that this integration is technically complex
    and only works well when refrigeration and heating loads coincide — a condition
    met during vintage but not year-round.
  lesson_learnt: Waste heat recovery from refrigeration systems for heat pump integration
    is a viable emissions reduction strategy for food and beverage manufacturers with
    co-located cooling and heating loads, but the refrigeration system must be of
    sufficient scale (around 500 kWr minimum), the distance between refrigeration
    and hot water plants must be manageable, and the cooling and heating loads should
    be high simultaneously for the solution to be feasible.
