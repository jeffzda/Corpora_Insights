  what_happened: Heating demands at the BFWG site were distributed across an expansive
    area, with many small, seasonal loads complicating the economic case for centralised
    hot water or electrification; small distributed hot water heaters accounting for
    only around 4% of site LPG were assessed as not feasible to replace with heat
    pumps on an energy cost basis.
