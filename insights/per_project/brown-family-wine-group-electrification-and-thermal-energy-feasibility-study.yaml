- record_id: ARENA-DLV-40451
  source_title: BFWG - Electrification and Thermal Energy Feasibility Study - IETS
    Summary & Emissions Reduction Roadmap
  publish_date: 2025-03
  project_name: Brown Family Wine Group Industrial Energy Transformation Study
  what_happened: A feasibility study found that customer-owned BESS is not financially
    viable at the BFWG Milawa site under current market conditions, with a 1 MW BESS
    on the West Transformer yielding an NPV of -$1,087,825 and a simple payback of
    20.5 years, and a 250 kW BESS at the Plant Room yielding an NPV of -$426,769 at
    34.4 years payback.
  lesson_learnt: For small-to-medium industrial and agricultural sites in Victoria,
    customer-owned BESS is unlikely to be financially viable under current market
    conditions due to high battery CAPEX and low demand-response revenues; projects
    should be deferred until battery costs fall, site load grows, or grant funding
    (e.g. ARENA) becomes available.
