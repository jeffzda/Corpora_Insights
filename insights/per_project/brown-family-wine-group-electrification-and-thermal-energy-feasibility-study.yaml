  project_name: Brown Family Wine Group Industrial Energy Transformation Study
  what_happened: Variable head pressure control was not implemented on any of BFWG's
    refrigeration plants, meaning compressors operated at fixed — and often unnecessarily
    high — head pressures, wasting energy. Implementing variable head pressure control
    was estimated to deliver 247,163 kWh/year savings, $24,565/year cost savings,
    and a simple payback of 1.5 years.
  lesson_learnt: Variable head pressure control should be considered as a standard
    energy efficiency measure for industrial refrigeration systems across the manufacturing
    sector, as it allows the system to operate at optimal conditions based on load
    and ambient weather, typically with very short payback periods.
