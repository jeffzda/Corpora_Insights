  publish_date: 2025-03
  project_name: Brown Family Wine Group Industrial Energy Transformation Study
  what_happened: The emissions reduction roadmap demonstrated that prioritising onsite
    direct actions (energy efficiency and fuel switching) ahead of renewable energy
    purchases and carbon offsets reduced the total cost of abatement from $13.39/T
    CO2-e (reference scenario — offsets and GreenPower only) to $7.11/T CO2-e, while
    generating positive annual OPEX savings of $249,513 by 2030 against the reference
    scenario's net cost of -$73,201/year.
  lesson_learnt: For industrial operators targeting net zero by 2030, prioritising
    onsite energy efficiency and fuel switching over certificate-based abatement (GreenPower
    and carbon offsets) produces a cost-positive pathway — the BFWG study shows onsite
    actions nearly halved the cost of abatement and turned a net annual cost into
    a net annual saving.
