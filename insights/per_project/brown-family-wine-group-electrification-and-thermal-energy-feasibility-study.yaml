- record_id: ARENA-DLV-12402
  source_title: BFWG Electrification and Thermal Energy Feasibility Study - Lessons
    Learnt Report 1
  publish_date: 2024-04
  project_name: BFWG Electrification and Thermal Energy Feasibility Study
  what_happened: The site's three separate refrigeration systems each used different
    coolant chemicals, different equipment generations, and had inconsistent or out-of-date
    documentation. The oldest system lacked accessible logged data, while the newest
    provided data via a web interface. This data heterogeneity complicated the feasibility
    assessment and may limit the viability of consolidation solutions.
  lesson_learnt: Before commencing energy efficiency feasibility studies on legacy
    industrial sites, audit data availability and documentation completeness for each
    system. Where systems use incompatible process media or lack as-built documentation,
    budget additional effort for data retrieval and consider preparing updated schematics
    — failure to do so will constrain the solution options that can be evaluated.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: industrial operator
  delay_category: data/validation/testing
  failure_mode: data & measurement
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: The team worked with contractors to obtain data more efficiently
    from each system and identified direct access pathways; some data gaps were accepted
    and the scope of consolidation solutions was narrowed accordingly.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: industrial renewables
  source_pages: &id002
  - 4
  - 5
  evidence_excerpt: The three different systems add complexity to the project. Each
    system uses a different brine chemical (methylated spirit, propylene glycol, and
    a glycol-ethanol blend) and includes different types and ages of equipment and
    technologies. This impacts the quantity and quality of data available or retrievable
    for each system.
