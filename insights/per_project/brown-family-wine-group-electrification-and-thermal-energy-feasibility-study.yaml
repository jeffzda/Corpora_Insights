- record_id: ARENA-DLV-12401
  source_title: BFWG Electrification and Thermal Energy Feasibility Study - Lessons
    Learnt Report 1
  publish_date: 2024-04
  project_name: BFWG Electrification and Thermal Energy Feasibility Study
  what_happened: Insufficient time was available between the project start date and
    the start of the winemaking 'Vintage' season (January–April) to procure and install
    metering equipment. The limited availability of the engineering consultant's approved
    contractors over the Christmas period compounded the issue, meaning energy consumption
    data during the highest-demand period of the year could not be fully captured.
  lesson_learnt: For industrial feasibility studies at seasonal facilities, allow
    extra time for meter installation before peak production periods and establish
    parallel access to site-approved contractors early — relying solely on a single
    contractor pool risks missing the critical data-capture window if availability
    is constrained over holiday periods.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: industrial operator
  delay_category: data/validation/testing
  failure_mode: data & measurement
  outcome_class: re-scoped/adapted
  secondary_failure_mode: execution & logistics
  intervention_note: BFWG bypassed the consultant's contractor pool by procuring site
    trades directly from its own site-approved contractors, partially recovering the
    metering installation timeline, and used existing control system data and extrapolation
    from non-Vintage periods to estimate Vintage consumption.
  transferability: moderate
  delay_magnitude: 1-3 months
  technology_domain: industrial renewables
  source_pages: &id001
  - 3
  - 4
  evidence_excerpt: Insufficient time prior to Vintage from the project start date
    was available to secure procurement and installation of metering. The limited
    availability of Shell-approved contractors over the Christmas period exacerbated
    this issue, which we were able to address by BFWG procuring site trades directly
    from BFWG's site-approved contractor pool.
  confidence_note: delay_magnitude estimated as 1–3 months based on the Vintage window
    (January–April) being missed; no explicit duration stated in the document.
