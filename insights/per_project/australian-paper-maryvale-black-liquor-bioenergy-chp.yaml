- record_id: ARENA-DLV-11022
  source_title: Renewable Energy Options for Industrial Process Heat
  publish_date: 2019-08
  project_name: Australian Paper Maryvale Black Liquor Bioenergy CHP
  what_happened: Australian Paper's Maryvale plant, Victoria's biggest generator of renewable baseload energy, operates a black liquor-fuelled CHP system producing approximately 240 GWhe/year of electricity
    and 1,800 GWhth/year of thermal energy, offsetting approximately 50% of the plant's 18 PJ/year energy requirements. Maintaining carbon neutral certification under the National Carbon Offset Standard
    (NCOS) was identified as a resource-intensive challenge requiring substantial data collection and robust analysis.
  lesson_learnt: Large-scale bioenergy CHP in pulp and paper achieves carbon neutrality certification but NCOS compliance is resource-intensive — operational budgets for carbon certification data management
    should be planned from project outset rather than treated as a minor administrative task.
