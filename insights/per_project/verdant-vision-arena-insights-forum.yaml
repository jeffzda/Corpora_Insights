- record_id: ARENA-DLV-2628
  source_title: ARENA Insights Forum November 2024 - Accelerating Zero-Emissions Heavy
    Transport
  publish_date: 2024-11
  project_name: Verdant Vision / ARENA Insights Forum
  what_happened: The forum presentation noted that the Australian EV market has approximately
    1% fleet penetration (200,000 EVs out of 20 million cars), that car turnover takes
    approximately 10 years, and that building consumer confidence in EVs may take
    even longer — indicating a material gap between new EV sales rates and fleet-level
    penetration.
  lesson_learnt: Project forecasts and portfolio planning for EV fleet transition
    should use fleet penetration rates, not new sales rates, as the primary metric
    — the 10+ year fleet turnover cycle means high new-vehicle sales do not translate
    to rapid operational fleet change, and consumer confidence timelines extend the
    lag further.
