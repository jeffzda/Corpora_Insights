- record_id: ARENA-DLV-2627
  source_title: ARENA Insights Forum November 2024 - Accelerating Zero-Emissions Heavy
    Transport
  publish_date: 2024-11
  project_name: Verdant Vision / ARENA Insights Forum
  what_happened: The forum presentation noted that fleet and facility assets are becoming
    intertwined as vehicle electrification at commercial premises creates potential
    for V2X integration, with V2X particularly suited to commercial truck fleets due
    to garaging at peak times, mapped/costed routes, large batteries, automation suitability,
    and the vehicle being a commercial asset.
  lesson_learnt: Fleet electrification projects at commercial facilities should assess
    V2X potential from the outset — the operational characteristics of commercial
    truck fleets (predictable routes, large batteries, depot garaging at peak times)
    make them better candidates for V2X value capture than residential EV applications.
