- record_id: ARENA-DLV-51455
  source_title: UTS - Flexible Demand State of Play in Australia - Report
  publish_date: 2024-05
  project_name: AGL – Electric Vehicle Orchestration Trial
  what_happened: Approximately 20% of smart chargers in AGL's EV orchestration trial
    were not returning data at any given point in time, creating a data quality problem
    that would be materially more damaging at higher penetration rates.
  lesson_learnt: Smart charger data reliability is a critical dependency for EV demand
    response at scale — a 20% non-reporting rate acceptable in a small pilot would
    undermine orchestration reliability at commercial scale; procurement specifications
    for smart chargers should include robust data uptime requirements and monitoring
    protocols.
