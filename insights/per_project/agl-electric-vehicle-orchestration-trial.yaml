- record_id: ARENA-DLV-51456
  source_title: UTS - Flexible Demand State of Play in Australia - Report
  publish_date: 2024-05
  project_name: AGL – Electric Vehicle Orchestration Trial
  what_happened: AGL's trial concluded that EVs could theoretically participate in
    FCAS, but found no chargers in Australia currently allow for frequency response
    control, making FCAS participation impossible without hardware that does not yet
    exist commercially.
  lesson_learnt: EV participation in FCAS markets cannot proceed until charger hardware
    that supports frequency response control is commercially available in Australia;
    pilots planning to demonstrate V2G or FCAS services should confirm the full technology
    readiness of charger hardware before committing to those objectives.
