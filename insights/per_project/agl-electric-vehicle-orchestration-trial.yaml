- record_id: ARENA-DLV-51454
  source_title: UTS - Flexible Demand State of Play in Australia - Report
  publish_date: 2024-05
  project_name: AGL – Electric Vehicle Orchestration Trial
  what_happened: The projected early evening peak in residential EV charging was not
    observed in practice; AGL's trial of 300 vehicles found charging patterns were
    more diverse than expected, with most charging occurring from 9pm onwards and
    scattered throughout the day and week, with only one-in-six chargers operating
    simultaneously.
  lesson_learnt: Do not design residential EV demand response programs on the assumption
    of a concentrated evening charging peak — actual residential EV charging is substantially
    more distributed across the day and week, which changes the timing and magnitude
    of both the problem and the value available from orchestration.
