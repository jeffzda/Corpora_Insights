- record_id: ARENA-DLV-51457
  source_title: UTS - Flexible Demand State of Play in Australia - Report
  publish_date: 2024-05
  project_name: AGL – Electric Vehicle Orchestration Trial
  what_happened: The absence of common technical standards for EV chargers was identified
    as one of the major barriers to Vehicle-to-Grid (V2G) deployment; AGL assessed
    V2G as 'some years away' at the time of the trial.
  lesson_learnt: V2G deployment at scale requires resolution of common technical standards
    for chargers before commercial programs can proceed; projects scoping V2G services
    should explicitly assess standards readiness and not assume interoperability between
    charger brands and grid interface requirements.
