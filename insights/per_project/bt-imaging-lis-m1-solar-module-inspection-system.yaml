  intervention_note: ARENA agreed to hold off varying the project and Funding Agreement
    to allow time for BT Imaging to clarify the change-of-control situation; once
    resolved, both parties mutually agreed to terminate and plan a new application.
  transferability: moderate
  delay_magnitude: 1-3 years
