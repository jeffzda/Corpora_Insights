- record_id: ARENA-DLV-0302
  source_title: BT Imaging - Learnings from a BT Imaging Pty Ltd ARENA Funded Project
  publish_date: '2023-03-22'
  project_name: BT Imaging LIS-M1 Solar Module Inspection System Project
  what_happened: A change-of-control event (acquisition of BT Imaging by Aurora Solar
    Technologies Inc.) took from mid-2021 to early August 2022 to resolve — over a
    year — freezing project variations and preventing any Funding Agreement modifications
    during that period.
  lesson_learnt: Anticipate that corporate change-of-control events can take far longer
    to resolve than expected and ensure the funding agreement explicitly addresses
    what happens during a protracted change-of-control period, including provisions
    for temporary suspension rather than indefinite limbo.
