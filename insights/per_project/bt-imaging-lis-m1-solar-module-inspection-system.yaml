- record_id: ARENA-DLV-0304
  source_title: BT Imaging - Learnings from a BT Imaging Pty Ltd ARENA Funded Project
  publish_date: '2023-03-22'
  project_name: BT Imaging LIS-M1 Solar Module Inspection System Project
  what_happened: Project partners critical to data collection and demonstration activities
    were unable to contribute as planned due to the impacts of COVID-19 and their
    own business disruptions, jeopardising the project's viability independently of
    the technology-obsolescence issue.
  lesson_learnt: Avoid structuring a project so that any single partner's withdrawal
    would irreversibly compromise viability — identify replacement partners in advance,
    negotiate robust agreements including break and termination conditions, and assess
    how each partner's own business may change over the project life before formalising
    their involvement.
