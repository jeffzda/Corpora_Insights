- record_id: ARENA-DLV-0305
  source_title: BT Imaging - Learnings from a BT Imaging Pty Ltd ARENA Funded Project
  publish_date: '2023-03-22'
  project_name: BT Imaging LIS-M1 Solar Module Inspection System Project
  what_happened: BT Imaging maintained open and proactive communication with ARENA
    throughout all phases of disruption — including early milestone reports flagging
    emerging risks, mid-2020 notifications of inevitable delays, and December 2020
    formal requests for project changes — which ultimately allowed a clean mutual
    termination without significant financial loss or acrimony.
  lesson_learnt: Treat the funding body as a project partner rather than merely a
    source of funds — early, transparent communication about emerging risks enables
    collaborative problem-solving and, if termination becomes necessary, allows it
    to occur on terms acceptable to both parties with minimal wasted investment.
  issue_severity: none
