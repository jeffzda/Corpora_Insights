- record_id: ARENA-DLV-0301
  source_title: BT Imaging - Learnings from a BT Imaging Pty Ltd ARENA Funded Project
  publish_date: '2023-03-22'
  project_name: BT Imaging LIS-M1 Solar Module Inspection System Project
  what_happened: The COVID-19 pandemic severely disrupted BT Imaging's operations
    and those of its domestic and international project partners from early 2020,
    forcing a pause in project activities and causing significant delays that ultimately
    stretched the project timeline by approximately three years from its original
    scope date.
  lesson_learnt: Build explicit black-swan contingency provisions into funding agreements
    — COVID-19-scale disruptions can cascade across multiple partners simultaneously,
    and a funding agreement without sufficient flexibility to accommodate major project
    changes will force repeated variations and may ultimately result in termination
    rather than adaptation.
  issue_severity: critical
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: procurement/supply chain
  failure_mode: coordination & stakeholders
  outcome_class: discontinued/not progressed
  secondary_failure_mode: execution & logistics
  intervention_note: BT Imaging communicated early and openly with ARENA throughout
    the disruption, enabling mutual agreement to terminate the Funding Agreement without
    significant loss and with a pathway to submit a new project application.
  transferability: broad
  delay_magnitude: 1-3 years
  technology_domain: solar PV
  source_pages: &id001
  - 3
  - 4
  evidence_excerpt: BT Imaging was not adequately prepared first for the consequences
    of the Covid-19 emergency and later the impact that a protracted change of control
    situation would have on the viability of its project.
  confidence_note: lifecycle_phase assigned as operations since disruption occurred
    after project commencement and first milestone delivery; outcome_class is discontinued/not
    progressed as the funding agreement was mutually terminated.
