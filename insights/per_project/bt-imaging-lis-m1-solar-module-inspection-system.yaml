- record_id: ARENA-DLV-0303
  source_title: BT Imaging - Learnings from a BT Imaging Pty Ltd ARENA Funded Project
  publish_date: '2023-03-22'
  project_name: BT Imaging LIS-M1 Solar Module Inspection System Project
  what_happened: Over the approximately three years between project scoping and the
    point at which BT Imaging could resume activity, the PV manufacturing industry
    underwent major changes — faster production line speeds, new cell forms and larger
    module dimensions, and the emergence of new complementary quality-assessment imaging
    techniques — rendering the original project design incompatible with current industry
    needs.
  lesson_learnt: For multi-year R&D projects in fast-moving technology sectors, build
    explicit technology-refresh review points into the project plan and funding agreement
    so that the project can be formally reassessed and redirected if the industry
    landscape shifts materially, rather than continuing toward an objective that has
    become outdated.
  issue_severity: critical
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: close-out/post-project review
  proponent_type: technology vendor
  delay_category: no material delay stated
  failure_mode: unvalidated technical assumptions
  outcome_class: discontinued/not progressed
  secondary_failure_mode: commercial & market
  intervention_note: BT Imaging and ARENA mutually agreed to terminate the existing
    Funding Agreement and BT Imaging committed to lodging a new funding proposal aligned
    with current industry needs once Aurora's acquisition was bedded down.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id003
  - 4
  - 5
  evidence_excerpt: Given the industry developments in production and given also the
    emergence of the promising new imaging techniques that were not included in the
    project as originally developed, BT Imaging's project was rendered incompatible
    with the new industry requirements.
  confidence_note: delay_category set to no material delay stated for this specific
    record as the issue is technology obsolescence rather than a scheduling delay;
    the schedule slippage is captured in ARENA-DLV-0301.
