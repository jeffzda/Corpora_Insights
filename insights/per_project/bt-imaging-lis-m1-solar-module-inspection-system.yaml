  what_happened: Both BT Imaging and ARENA persevered with the project well past the
    point at which it became apparent the completion date was receding indefinitely,
    expending effort and resources that in retrospect could have been avoided had
    clearer termination triggers been established upfront.
  lesson_learnt: Funding agreements should define explicit timeline thresholds and
    decision gates that trigger a formal reassessment of project viability — both
    parties expended unnecessary resources by continuing to pursue a project whose
    completion date had receded indefinitely without a pre-agreed escalation mechanism.
