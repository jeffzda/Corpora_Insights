- record_id: ARENA-DLV-15467
  source_title: 'The Generator Operations Series: Large-Scale Solar Operations'
  publish_date: 2021-05
  project_name: LSS Round Projects Portfolio (14 large-scale solar projects)
  what_happened: Dispatch constraints and plant derating were disproportionately concentrated
    at specific projects reflecting local grid conditions, while negative pricing
    impacts were more broadly distributed across Queensland projects. The median percentage
    loss due to curtailment remained below 3.3 per cent per month but individual projects
    experienced significantly higher losses concentrated in specific periods.
  lesson_learnt: Curtailment risk is highly location-specific for large-scale solar
    — dispatch constraint losses are driven by local grid conditions and are therefore
    concentrated at particular projects, meaning that due diligence on grid infrastructure
    and regional renewable energy penetration levels is essential in site selection
    and should be reflected in project-specific rather than portfolio-average curtailment
    assumptions.
