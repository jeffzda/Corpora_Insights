  secondary_failure_mode: execution & logistics
  intervention_note: Projects implemented internal site fencing for zone-based grazing,
    herbicide mapping for fire risk mitigation, and added in-house mower and resourcing
    to provide baseline vegetation management capability.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
