- record_id: ARENA-DLV-15468
  source_title: 'The Generator Operations Series: Large-Scale Solar Operations'
  publish_date: 2021-05
  project_name: LSS Round Projects Portfolio (14 large-scale solar projects)
  what_happened: The corrected performance ratio (adjusted for curtailment and unavailability)
    averaged 78.4 per cent across the LSS Round Projects in 2019 and 2020, below the
    typical EPC PR guarantee of approximately 80 per cent. The uncorrected PR ranged
    from 55.8 per cent to 84.4 per cent, with one project falling below 50 per cent
    in 2019.
  lesson_learnt: EPC performance guarantees of around 80 per cent corrected PR represent
    a reasonable benchmark but were not consistently achieved across the LSS portfolio
    — investors and lenders should test sensitivity of returns to corrected PR values
    below the EPC guarantee threshold and understand what recourse mechanisms (liquidated
    damages) are available and how quickly they can be exercised.
