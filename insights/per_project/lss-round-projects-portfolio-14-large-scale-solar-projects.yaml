- record_id: ARENA-DLV-15452
  source_title: 'The Generator Operations Series: Large-Scale Solar Operations'
  publish_date: 2021-05
  project_name: LSS Round Projects Portfolio (14 large-scale solar projects)
  what_happened: Actual capacity factors achieved in 2019 and 2020 were systematically
    lower than forecast at financial close. On average, LSS Round Projects overestimated
    first-year capacity factor by 11.0 per cent, with one project overestimating by
    35.9 per cent and more than a third of projects overestimating by approximately
    20 per cent.
  lesson_learnt: Capacity factor forecasts for early large-scale solar projects in
    Australia were consistently optimistic — future project financial models should
    apply conservative adjustments to capacity factor assumptions, particularly accounting
    for curtailment risks not reflected in pre-2018 modelling practice.
