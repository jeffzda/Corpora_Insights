- record_id: ARENA-DLV-15453
  source_title: 'The Generator Operations Series: Large-Scale Solar Operations'
  publish_date: 2021-05
  project_name: LSS Round Projects Portfolio (14 large-scale solar projects)
  what_happened: Actual OPEX in 2020 exceeded forecasts for seven of eleven LSS Round
    Projects. Average actual OPEX was $30,000 per MWDC against an average forecast
    of $22,500 per MWDC — an average overrun of $6,000 per MWDC (approximately 27%).
    One project spent $27,000 per MWDC more than forecast.
  lesson_learnt: OPEX forecasts for large-scale solar projects systematically underestimated
    actual costs — future projects should build in material contingency above forecast
    OPEX, with particular attention to FCAS costs, inverter failure rectification,
    insurance premiums, and equipment availability, all of which emerged as larger
    contributors than anticipated.
