- record_id: ARENA-DLV-15454
  source_title: 'The Generator Operations Series: Large-Scale Solar Operations'
  publish_date: 2021-05
  project_name: LSS Round Projects Portfolio (14 large-scale solar projects)
  what_happened: Frequency Control Ancillary Services (FCAS) costs were significantly
    higher than forecast and were identified as one of the top operational challenges
    across the LSS Round Projects. FCAS costs were on average approximately 64 per
    cent higher in 2019 than in 2020 for the four projects reporting significant FCAS
    costs.
  lesson_learnt: Solar farm operators should register for self-forecasting with AEMO
    as early as possible — projects that implemented self-forecasting from late 2019
    experienced materially reduced FCAS costs compared to those relying on AEMO's
    ASEFS baseline forecasts, as generation forecast accuracy directly determines
    Causer-Pays FCAS exposure.
  issue_severity: moderate
  project_type: generation
  project_scale_band: utility/large-scale
  lifecycle_phase: operations
  proponent_type: project developer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Several solar farms registered for self-forecasting with AEMO
    from late 2019, using satellite or cloud-cam technology to provide real-time generation
    forecasts, which reduced FCAS costs relative to the ASEFS baseline.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id004
