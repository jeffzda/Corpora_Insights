  source_title: 'The Generator Operations Series: Large-Scale Solar Operations'
  publish_date: 2021-05
  project_name: LSS Round Projects Portfolio (14 large-scale solar projects)
  what_happened: Residual losses (excluding temperature and curtailment losses) averaged
    15.0 per cent across the LSS Round Projects in 2019 and 2020, substantially higher
    than the 9–18 per cent range forecast at financial close, and with wide variation
    across the portfolio.
  lesson_learnt: Financial models for large-scale solar should apply higher residual
    loss assumptions than those used at financial close for the LSS Round Projects
    — actual residual losses averaged 15.0 per cent and were driven by ongoing performance
    issues with modules and inverters and one-off incidents, suggesting that forecast
    residual loss allowances were insufficient.
