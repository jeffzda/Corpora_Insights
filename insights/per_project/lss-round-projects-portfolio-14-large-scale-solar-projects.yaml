- record_id: ARENA-DLV-15469
  source_title: 'The Generator Operations Series: Large-Scale Solar Operations'
  publish_date: 2021-05
  project_name: LSS Round Projects Portfolio (14 large-scale solar projects)
  what_happened: Spot market revenue per MWDC across the LSS Round Projects fell on
    average by 39 per cent from 2019 to 2020, with one project experiencing a 73 per
    cent decline ($154,135 per MWDC). The average daylight-hours spot price fell from
    $102 per MWh in 2019 to $66 per MWh in 2020, driven partly by the proliferation
    of solar generation (utility and rooftop) since the grant round was run.
  lesson_learnt: PPA strike prices secured by early-mover LSS projects reflected historically
    high market and LGC prices that were not sustained — future solar project developers
    should model significant downside scenarios for both merchant revenue and PPA
    pricing, recognising that solar generation proliferation structurally suppresses
    daytime spot prices over time.
