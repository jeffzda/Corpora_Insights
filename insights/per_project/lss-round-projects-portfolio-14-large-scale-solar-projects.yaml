  source_title: 'The Generator Operations Series: Large-Scale Solar Operations'
  publish_date: 2021-05
  project_name: LSS Round Projects Portfolio (14 large-scale solar projects)
  what_happened: Negative pricing impacts increased significantly for LSS Round Projects
    in 2020, particularly for Queensland projects, with three Queensland projects
    self-curtailing over 3 per cent of generation in 2020 due to negative pricing
    events. Spot market revenue across the portfolio fell by an average of 39 per
    cent from 2019 to 2020.
  lesson_learnt: Solar project financial models should include explicit scenarios
    for increasing negative pricing frequency and declining average spot prices —
    revenue per MWDC fell 39 per cent on average from 2019 to 2020, with Queensland
