- record_id: ARENA-DLV-15456
  source_title: 'The Generator Operations Series: Large-Scale Solar Operations'
  publish_date: 2021-05
  project_name: LSS Round Projects Portfolio (14 large-scale solar projects)
  what_happened: Lack of readily available spare critical equipment — including inverters,
    transformers, and ring main units — caused lengthy operational downtimes across
    several LSS Round Projects. For some projects, the inverter supplier held no stock
    in Australia, requiring overseas sourcing and shipping.
  lesson_learnt: Asset managers of large-scale solar projects should negotiate local
    spare parts inventory obligations into equipment supply and O&M contracts at financial
    close, and consider acquiring critical major spares directly — reliance on overseas
    factory supply for inverters and transformers caused extended downtime that would
    have been avoided with in-country stock.
  issue_severity: moderate
  project_type: generation
  project_scale_band: utility/large-scale
  lifecycle_phase: operations
  proponent_type: project developer
  delay_category: null
  failure_mode: execution & logistics
  outcome_class: re-scoped/adapted
  secondary_failure_mode: coordination & stakeholders
  intervention_note: Projects implemented more direct engagement with local and parent
    service providers to improve spares inventories in Australia, distributed lessons
    learned internally for new project contracts, and acquired their own critical
    major spares.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id006
