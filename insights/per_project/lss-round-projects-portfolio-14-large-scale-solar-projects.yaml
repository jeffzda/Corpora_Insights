- record_id: ARENA-DLV-15466
  source_title: 'The Generator Operations Series: Large-Scale Solar Operations'
  publish_date: 2021-05
  project_name: LSS Round Projects Portfolio (14 large-scale solar projects)
  what_happened: Vegetation control emerged as one of the top operational challenges
    across the LSS Round Projects, proving to be high cost and resource-intensive.
    Issues included inconsistent sheep grazing, fire risk mitigation complexity, and
    high variability in seasonal vegetation growth requiring more robust management
    plans than originally anticipated.
  lesson_learnt: Vegetation management plans for large-scale solar sites should be
    developed with multi-year flexibility to accommodate drought variability and fire
    risk, and should include provisions for internal site zoning for livestock grazing,
    herbicide use protocols, and in-house mowing capability — initial plans were insufficient
    to manage the range of conditions encountered across the first two years of operations.
  issue_severity: minor
