- record_id: ARENA-DLV-15457
  source_title: 'The Generator Operations Series: Large-Scale Solar Operations'
  publish_date: 2021-05
  project_name: LSS Round Projects Portfolio (14 large-scale solar projects)
  what_happened: Equipment service providers did not have sufficient employees or
    sub-contractors to service new large-scale solar sites, and were reluctant to
    approve in-house maintenance beyond basic fault-finding, creating an almost complete
    reliance on equipment manufacturers for servicing.
  lesson_learnt: Contracts with equipment service providers should explicitly address
    staffing capacity, sub-contractor availability, and the scope of in-house maintenance
    that asset managers are authorised to perform — the near-monopoly dependence on
    manufacturer technicians created servicing bottlenecks and extended downtime across
    multiple LSS projects.
  issue_severity: moderate
  project_type: generation
  project_scale_band: utility/large-scale
  lifecycle_phase: operations
  proponent_type: project developer
  delay_category: null
  failure_mode: coordination & stakeholders
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Some projects engaged more directly with local and parent service
    providers and promoted greater service levels; others distributed internal lessons
    learned for consideration in new project contractual agreements.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id007
  - 19
  evidence_excerpt: Equipment service providers do not always have sufficient employees
    or sub-contractors to effectively service new sites... Even with accredited training,
    equipment service providers are reluctant to approve any in-house maintenance
    except the most basic fault finding and rectification. This leads to almost complete
    monopoly and reliance on the equipment manufacturer.
