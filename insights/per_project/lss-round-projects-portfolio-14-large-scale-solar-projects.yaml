  source_title: 'The Generator Operations Series: Large-Scale Solar Operations'
  publish_date: 2021-05
  project_name: LSS Round Projects Portfolio (14 large-scale solar projects)
  what_happened: Inverter power stack failures were one of the most impactful operational
    challenges across the LSS Round Projects. For two projects, power stack failures
    began in November 2019 and lasted for six months, relating to an industry-wide
    inverter manufacturer issue.
  lesson_learnt: Inverter power stack failure risk should be factored into both equipment
    selection and O&M planning for large-scale solar — the six-month duration of failures
    at two projects and the industry-wide nature of the fault indicate that due diligence
    on inverter manufacturer quality control and maintaining local spare parts inventory
    are critical to minimising downtime.
