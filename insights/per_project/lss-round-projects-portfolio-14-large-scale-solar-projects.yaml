- record_id: ARENA-DLV-15451
  source_title: 'The Generator Operations Series: Large-Scale Solar Operations'
  publish_date: 2021-05
  project_name: LSS Round Projects Portfolio (14 large-scale solar projects)
  what_happened: Curtailment was not included in financial models at the time of ARENA
    submission for the LSS Round Projects in 2016, as it was not considered a significant
    risk. During operations in 2019–2020, curtailment reduced average generation by
    5.1 per cent across the portfolio, with one project losing 18.8 per cent of total
    generation and another losing over 23.4 per cent in 2019.
  lesson_learnt: Curtailment must be explicitly modelled as a material risk in financial
    models for large-scale solar projects connected to the NEM — the absence of curtailment
    modelling at financial close for the LSS Round Projects resulted in significant
    underestimation of generation losses, with some projects losing nearly a quarter
    of output.
  issue_severity: major
  project_type: generation
  project_scale_band: utility/large-scale
  lifecycle_phase: operations
  proponent_type: project developer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: partial success
  secondary_failure_mode: commercial & market
  intervention_note: null
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id001
  - 8
  - 10
  evidence_excerpt: At the time that the LSS Round Projects were achieving financial
    close there was a relatively small number of large-scale solar projects connected
    in Australia and curtailment was not considered a significant risk... Curtailment
    was rarely included in these models at the time of ARENA submission... The average
    amount of energy lost to curtailment across 2019 and 2020 for the LSS Round Projects
    is 5.1 per cent, where one project lost 18.8 per cent of generation in total.
