- record_id: ARENA-DLV-53875
  source_title: Demand Flexibility Portfolio Retrospective Analysis Report
  publish_date: 2023-07
  project_name: Flow Power Energy Under Control Demand Response (RERT)
  what_happened: Flow Power found that several C&I customers who started with RERT participation progressed to wholesale pricing after gaining confidence in their demand flexibility capability; RERT's combination
    of financial certainty (availability payments) and low event frequency provided a safe learning environment that enabled customers to take the next step.
  lesson_learnt: Structured sequencing of value streams — starting with RERT for financial certainty and low operational burden, then graduating to wholesale participation — is an effective 'value-pairing'
    strategy for building C&I customer capability and confidence toward eventually stacking multiple value streams.
