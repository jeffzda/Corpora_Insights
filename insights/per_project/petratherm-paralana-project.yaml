- record_id: ARENA-DLV-72005
  source_title: Australian Energy Resource Assessment — Second Edition, 2014
  publish_date: '2014'
  project_name: Petratherm Paralana Project
  what_happened: Petratherm successfully completed hydraulic stimulation and flow
    testing in Paralana-2 in late 2012, but was unable to secure matching funding
    required to unlock government grants for drilling Paralana-3 and additional works,
    causing project activity to stall.
  lesson_learnt: Government grants for geothermal demonstration projects that require
    co-funding can stall if the proponent cannot attract matching private investment
    — proponents should secure co-funding commitments before relying on milestone-triggered
    grant tranches as the primary project funding mechanism.
