- record_id: ARENA-DLV-72298
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects - First Edition Results'
  publish_date: '2015'
  project_name: Survey of likely take-up of a voluntary residential capacity based tariff (SA Power Networks)
  what_happened: SA Power Networks surveyed residential customers about a voluntary capacity-based network tariff and found that only 6% were opposed when the reasons for its introduction were explained,
    56% expressed conditional interest, and approximately 1 in 10 were willing to sign up immediately — with early adopters more likely to be university-educated and already economising on energy.
  lesson_learnt: Customer opposition to capacity-based network tariffs is low (6%) when rationale is clearly communicated — explaining the reasons for tariff reform before seeking uptake substantially reduces
    resistance and is a prerequisite for successful voluntary tariff introduction programmes.
