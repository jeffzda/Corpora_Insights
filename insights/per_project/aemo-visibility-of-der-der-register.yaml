- record_id: ARENA-DLV-9148
  source_title: State of DER Technology Integration Report
  publish_date: 2021-02
  project_name: AEMO Visibility of DER (DER Register)
  what_happened: AEMO's DER Register, the first initiative globally explicitly built
    to capture information on residential-scale DER at the time of installation, was
    launched in March 2020, approximately 3 years after the Visibility of DER report
    was published in January 2017 and 18 months after the AEMC made its final rule
    in September 2018. The register captured only static installation data and did
    not include real-time visibility.
  lesson_learnt: Building a national DER register requires a multi-year regulatory
    and implementation pipeline — projects that depend on DER register data for operational
    purposes should plan for registers to be limited to static installation data initially
    and should not rely on real-time visibility data being available within the project's
    own timeframe.
