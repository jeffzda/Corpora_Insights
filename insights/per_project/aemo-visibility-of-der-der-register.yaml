  evidence_excerpt: The work formed the basis for a COAG Energy Council rule change
    request for the development of a DER register, submitted to the AEMC in October
    2017. Following its industry consultation process, the AEMC made its final rule
    in September 2018 for AEMO to establish a register of DER in the NEM... AEMO launched
    the DER Register formally in March 2020.
