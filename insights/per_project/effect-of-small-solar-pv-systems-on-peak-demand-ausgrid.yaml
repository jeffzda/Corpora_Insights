  evidence_excerpt: The findings of this study found that solar photovoltaic systems
    appear to have only a small effect on reducing summer peak demand on the electricity
    network. The study found that at the time of AusGrid system summer peak between
    4:30 to 5pm (Australian Eastern Daylight Savings Time) that the average generation
    for the 26,000 solar systems was 30% of the peak rated solar capacity. The detailed
    analysis of zone and feeder load profiles found that the amount of peak demand
    reduction was not significant enough to contribute to any potential deferral of
    network investment.
