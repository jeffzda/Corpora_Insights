- record_id: ARENA-DLV-72237
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: '2014'
  project_name: Effect of Small Solar PV Systems on Peak Demand - Ausgrid
  what_happened: Ausgrid analysis of 26,000 solar PV systems across its network found
    that at system summer peak (4:30–5pm AEDT), average solar generation was only
    30% of rated capacity, and that the peak demand reduction attributable to rooftop
    PV was not sufficient to defer any network investment.
  lesson_learnt: Do not assume rooftop solar PV will deliver material network peak
    demand deferral benefits — Ausgrid data showed average output at system peak was
    only 30% of rated capacity, and detailed zone and feeder analysis found the reduction
    was not significant enough to justify avoided capital expenditure assumptions
    in network planning.
