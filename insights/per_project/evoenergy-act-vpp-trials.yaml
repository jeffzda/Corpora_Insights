- record_id: ARENA-DLV-52517
  source_title: ARENA's Virtual Power Plant Knowledge Sharing Workshop Summary
  publish_date: 2019-03
  project_name: Evoenergy ACT VPP Trials
  what_happened: During Evoenergy's VPP trials, lack of uniformity in DER design and
    components limited fleet response, with solar throttling and inverter capacity
    limitations reducing the effective aggregate response. Fleet availability was
    also impacted by competing dispatches, and validation of response was difficult
    without critical mass.
  lesson_learnt: Non-standardised DER hardware across a VPP fleet materially limits
    aggregate response capability — program designers should mandate minimum functional
    specifications for enrolled devices, and trial designs should ensure sufficient
    node density to enable statistically meaningful validation.
