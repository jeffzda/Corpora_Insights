- record_id: ARENA-DLV-52516
  source_title: ARENA's Virtual Power Plant Knowledge Sharing Workshop Summary
  publish_date: 2019-03
  project_name: Evoenergy ACT VPP Trials
  what_happened: Evoenergy conducted three VPP trials in the ACT between March 2017
    and January 2019, growing from 320 nodes (1.4 MW) to 601 nodes (2.2 MW), including
    voltage control trials and a response to a NEM heat event. The trials demonstrated
    that LV network can be manipulated through export of power at different power
    factors.
  lesson_learnt: Structured, incremental VPP trials — beginning with small node counts
    and expanding — enable networks to build dispatch capability, validate response,
    and generate costing data before committing to full-scale deployment; voltage
    control (VAr) through distributed batteries is technically feasible but requires
    critical mass for reliable validation.
