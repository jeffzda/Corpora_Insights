- record_id: ARENA-DLV-72276
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: '2015'
  project_name: Orkney Island Smart Grid (Project ID 169)
  what_happened: The Orkney ANM project required banks financing new wind generators
    to accept curtailment risk as a condition of grid access. The project modelled
    curtailment forecasts to demonstrate that expected curtailment levels were acceptable,
    making the connection arrangements 'bankable'.
  lesson_learnt: When curtailment-based grid access agreements are used to enable
    new renewable connections, early modelling of curtailment forecasts and direct
    engagement with project financiers is essential to demonstrate bankability — without
    this step, lenders may decline to finance projects subject to non-firm access.
  issue_severity: moderate
  project_type: network/grid
  project_scale_band: demonstration
  lifecycle_phase: approvals/contracting
  proponent_type: network business
  delay_category: financing/commercial close
  failure_mode: commercial & market
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: Curtailment approach was modelled and forecasts were presented
    to banks; curtailment levels were found to be acceptable to project financiers.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: wind
  source_pages: &id002
  - 449
  - 451
  evidence_excerpt: Crucial to the scheme was agreement on defining the grid access
    arrangements including the real-time curtailment of wind generation output when
    necessary. This approach was modelled and the curtailment forecasts were found
    to be acceptable to the banks who finance the schemes.
  confidence_note: Published 2015 — commercial viability and demand conditions may
    be superseded by subsequent developments in this rapidly evolving field.
