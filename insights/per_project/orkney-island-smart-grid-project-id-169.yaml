- record_id: ARENA-DLV-72275
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: '2015'
  project_name: Orkney Island Smart Grid (Project ID 169)
  what_happened: The Orkney Islands network was deemed 'full' under conventional planning
    standards, with the cost of a conventional network upgrade (additional subsea
    cable) estimated at ~AU$50M. SSEPD deployed an active network management (ANM)
    system with dynamic line ratings and real-time curtailment of wind generators
    for less than AU$865,000, enabling 24MW of new wind capacity and making Orkney
    a net renewable energy exporter.
  lesson_learnt: Where conventional network reinforcement is prohibitively expensive
    or time-consuming, active network management with dynamic line rating and curtailment-based
    access agreements can enable substantial new renewable generation connections
    at a fraction of the cost — the Orkney solution cost under AU$850K versus AU$50M
    for conventional reinforcement and took far less time.
  issue_severity: major
  project_type: network/grid
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: network business
  delay_category: no material delay stated
  failure_mode: no major failure stated
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: Deployed an ANM system with real-time curtailment controls and
    dynamic line rating; modelled curtailment forecasts to demonstrate bankability
    to project financiers, enabling 20 generators totalling 24MW to connect.
  transferability: moderate
  delay_magnitude: null
  technology_domain: wind
  source_pages: &id001
