  what_happened: Soldering to pure copper plated contacts was problematic due to poor
    solder wettability and surface oxidation; early modules could not be interconnected
    by standard soldering, requiring more costly alternative interconnection methods
    that would have undermined commercial viability.
  lesson_learnt: Copper-plated solar cell contacts require a capping layer and carefully
    selected flux chemistry to achieve sufficient solder wetting — establish a soldering
    process qualification protocol early in module development, as standard soldered
    interconnection is a hard commercial requirement and failures here can force costly
    alternative interconnection methods.
