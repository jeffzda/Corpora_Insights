  source_title: SunDrive Copper Metallisation Demonstration Project Final Report
  publish_date: null
  project_name: SunDrive Copper Metallisation Demonstration Project
  what_happened: Cleaving full M6 cells to half-cells using an in-house laser process
    introduced an absolute efficiency loss of 0.3% (from 25.32% to 25.02%), and cutting
    losses for HJT cells were identified as significantly higher than for PERC cells
    — a key commercialisation challenge.
  lesson_learnt: HJT technology developers should adopt M12 wafers cut to half-cells
    before cell processing, rather than cleaving finished cells, to avoid edge passivation
    losses — the industry's transition to this approach eliminates a systematic efficiency
    loss unique to HJT that does not apply to PERC.
