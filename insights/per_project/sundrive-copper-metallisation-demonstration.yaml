  source_title: SunDrive Copper Metallisation Demonstration Project Final Report
  publish_date: null
  project_name: SunDrive Copper Metallisation Demonstration Project
  what_happened: 'Prior copper metallisation commercialisation attempts by BP Solar,
    Suntech (Pluto), and Jinko/Rena all failed to reach commercial scale due to distinct
    technical barriers: slow throughput, poor finger adhesion, and efficiency losses
    from copper diffusion into the emitter respectively.'
  lesson_learnt: Before committing to a copper plating approach for silicon solar
    cells, proponents should explicitly map the failure modes of prior industry attempts
    — adhesion to the cell surface, solder compatibility, and plating throughput are
    the three historically decisive barriers and must each be addressed with dedicated
    engineering effort.
