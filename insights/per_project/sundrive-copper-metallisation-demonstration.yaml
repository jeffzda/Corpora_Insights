  source_title: SunDrive Copper Metallisation Demonstration Project Final Report
  publish_date: null
  project_name: SunDrive Copper Metallisation Demonstration Project
  what_happened: SunDrive's grid optimisation model, developed from first principles
    for resistive loss analysis, identified a 0.6%abs efficiency gain achievable purely
    from grid design improvements — access to this modelling capability was a prerequisite
    for achieving world-record efficiencies during the project.
  lesson_learnt: Develop in-house resistive loss models from first principles early
    in cell metallisation development — empirical trial-and-error of grid designs
    is insufficient to systematically approach efficiency limits, and analytical models
    that decompose shading, contact resistance, and bulk resistive losses independently
    are required to identify the binding constraint at each development stage.
