  publish_date: null
  project_name: SunDrive Copper Metallisation Demonstration Project
  what_happened: Cell-to-module (CTM) modelling during module development revealed
    that the majority of early-stage module electrical losses arose from reflective
    losses at the front glass, parasitic absorption in encapsulant materials, and
    resistive losses in junction boxes and cabling — not from the copper metallisation
    itself.
  lesson_learnt: Apply CTM loss modelling before finalising module bill-of-materials
    selection — it identifies which optical and electrical losses are driven by materials
    choices (glass, encapsulant, cabling) versus cell-level factors, enabling targeted
    materials sourcing improvements rather than unfocused optimisation across all
    components simultaneously.
