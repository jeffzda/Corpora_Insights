  source_title: SunDrive Copper Metallisation Demonstration Project Lessons Learnt
    Report 1
  publish_date: null
  project_name: SunDrive Copper Metallisation Demonstration Project
  what_happened: SunDrive experienced significant time pressure from investors and
    competitive market dynamics to deliver a product to market rapidly, which accelerated
    the technology iteration cycle but impeded thorough analysis of experimental results
    that could otherwise have better informed the development pathway.
  lesson_learnt: Hardware start-ups should negotiate milestone timelines with investors
    that allow sufficient analytical depth at each iteration — compressing the cycle
    to satisfy investor pressure can create false economies by missing insights that
    would reduce downstream rework.
