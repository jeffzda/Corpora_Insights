  what_happened: Manual wafer handling in the lab plating process introduced yield
    variability; transitioning to semi-automated wafer handling and controlled fluid
    flow in the prototype plating tool reduced efficiency standard deviation by 27%
    compared to the lab process, while both methods maintained yields above 80%.
  lesson_learnt: Automating wafer handling and controlling fluid dynamics during electroplating
    are the two highest-leverage process improvements for improving yield repeatability
    when scaling from lab to prototype production — prioritise these before optimising
    chemistry parameters.
