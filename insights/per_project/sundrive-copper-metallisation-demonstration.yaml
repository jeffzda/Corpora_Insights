- record_id: ARENA-DLV-17304
  source_title: SunDrive Copper Metallisation Demonstration Project Final Report
  publish_date: null
  project_name: SunDrive Copper Metallisation Demonstration Project
  what_happened: Poor adhesion between the plated copper busbar and the TCO surface
    of HJT cells was a recurring industry-wide problem; SunDrive addressed this by
    developing a proprietary two-step plating process tuned for high interfacial adhesion,
    ultimately achieving adhesion stronger than the silicon wafer itself.
  lesson_learnt: For copper-plated HJT cells, interfacial adhesion between the copper
    grid and the TCO is the critical reliability determinant — measure finger adhesion
    directly (not just busbar pull tests) and tune plating electrolytes and anode
    materials iteratively, as this cannot be assumed from bulk copper plating knowledge
    inherited from PCB or IC industries.
