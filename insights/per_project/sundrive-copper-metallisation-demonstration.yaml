  what_happened: As a lean start-up operating outside a university, SunDrive faced
    significant resource scarcity — lacking access to sophisticated processing and
    characterisation equipment, ultra-pure water, compressed dry air, nitrogen, and
    wastewater treatment services — and was required to design and build its own cleanroom
    and laboratory infrastructure from scratch.
  lesson_learnt: Hardware deep-tech start-ups should explicitly budget and timeline
    the establishment of basic laboratory infrastructure (cleanroom, utilities, wastewater
    treatment) as a foundational project in itself — absence of these services is
    a primary constraint on the technology development iteration cycle and is routinely
    underestimated at founding.
