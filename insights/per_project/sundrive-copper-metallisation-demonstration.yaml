  what_happened: SunDrive's lab-based masking process required a high degree of manual
    input for individual wafer loading, visual inspection, and manual defect removal;
    this was incompatible with production throughput requirements and had to be fully
    redesigned for automation.
  lesson_learnt: When transitioning solar cell metallisation processes from lab to
    prototype production, the masking step is a critical bottleneck requiring purpose-built
    automated equipment with integrated vision systems — the lab process cannot be
    directly scaled and manual intervention must be designed out from the outset.
