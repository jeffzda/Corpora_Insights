- record_id: ARENA-DLV-58911
  source_title: A Commercially Viable Application of Electricity Storage for Australia's
    National Electricity Grid
  publish_date: 2017-01
  project_name: ARENA Emerging Renewables Measure A00598 (Reposit Power)
  what_happened: Reposit's predictive optimisation algorithms were demonstrated to
    improve performance continuously as more high-frequency data was gathered — the
    system used real-time solar and load forecasts to execute dynamic re-optimisation
    during the day, including twin peak charge/discharge cycles that extracted more
    than 100% of battery capacity value within a single 24-hour period.
  lesson_learnt: Residential battery control systems should be designed for continuous
    intra-day re-optimisation using updated forecasts rather than a fixed daily dispatch
    schedule — dynamic re-optimisation demonstrably extracts additional value from
    the same hardware by responding to new solar and load forecast data as it becomes
    available.
