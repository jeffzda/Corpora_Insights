  outcome_class: successful demonstration
  secondary_failure_mode: poor scoping
  intervention_note: Reposit commissioned a whiteboard animation, ran a media campaign,
    and developed a formal customer acquisition plan with defined customer personas
    to identify and recruit suitable early adopters.
  transferability: broad
  delay_magnitude: null
  technology_domain: battery storage
