- record_id: ARENA-DLV-58909
  source_title: A Commercially Viable Application of Electricity Storage for Australia's
    National Electricity Grid
  publish_date: 2017-01
  project_name: ARENA Emerging Renewables Measure A00598 (Reposit Power)
  what_happened: Competing installation guidelines from rival industry groups — in
    some cases requiring storage units to be placed in a cage — and calls for battery
    registers created regulatory uncertainty that Reposit identified as potentially
    harmful to the emerging residential storage market and to Australia's global competitiveness.
  lesson_learnt: Overly prescriptive or competing installation standards for residential
    battery storage risk suppressing market development — industry bodies and regulators
    should coordinate on a single fit-for-purpose standard that enables market-interactive
    batteries rather than imposing requirements designed for non-interactive storage.
