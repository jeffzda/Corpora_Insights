- record_id: ARENA-DLV-58906
  source_title: A Commercially Viable Application of Electricity Storage for Australia's
    National Electricity Grid
  publish_date: 2017-01
  project_name: ARENA Emerging Renewables Measure A00598 (Reposit Power)
  what_happened: Off-the-shelf metering hardware was found to be both size- and cost-prohibitive
    for residential DER applications, identified through initial deployment of test
    systems. This forced Reposit to develop its own single-phase electricity meter
    (the RP115) during the project.
  lesson_learnt: Residential DER deployments requiring high-frequency electricity
    data should not assume off-the-shelf metering hardware will be fit for purpose
    — proponents should assess metering size and cost constraints early, as custom
    meter development may be required and will consume significant project resources.
