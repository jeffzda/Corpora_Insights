- record_id: ARENA-DLV-58901
  source_title: A Commercially Viable Application of Electricity Storage for Australia's
    National Electricity Grid
  publish_date: 2017-01
  project_name: ARENA Emerging Renewables Measure A00598 (Reposit Power)
  what_happened: Reposit, an engineering-led startup with no consumer engagement experience,
    had to learn how to communicate the battery value proposition to households from
    scratch. The basic value proposition of a battery was poorly understood by the
    public, and the concept of a battery trading in electricity markets was entirely
    unproven at project outset.
  lesson_learnt: Technology-focused organisations entering the residential DER market
    must invest explicitly in consumer communication and marketing capability — a
    whiteboard animation, formal customer acquisition plan, and media outreach were
    necessary before any installations could proceed.
  issue_severity: moderate
