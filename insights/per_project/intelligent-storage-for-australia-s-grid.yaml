- record_id: ARENA-DLV-58904
  source_title: A Commercially Viable Application of Electricity Storage for Australia's
    National Electricity Grid
  publish_date: 2017-01
  project_name: ARENA Emerging Renewables Measure A00598 (Reposit Power)
  what_happened: Early battery installations required crane trucks, bollards, concrete
    pads, and several weeks to fully commission due to the semi-industrial scale of
    storage hardware available at the time. Within 18 months, battery hardware had
    shrunk dramatically and became readily wall or floor mountable.
  lesson_learnt: Early-stage demonstration projects using first-generation hardware
    should budget for significantly higher installation labour and civil works than
    will apply to subsequent generations — hardware maturation over an 18-month period
    reduced installation complexity from weeks to hours.
