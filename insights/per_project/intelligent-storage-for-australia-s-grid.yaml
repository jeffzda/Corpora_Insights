- record_id: ARENA-DLV-58902
  source_title: A Commercially Viable Application of Electricity Storage for Australia's
    National Electricity Grid
  publish_date: 2017-01
  project_name: ARENA Emerging Renewables Measure A00598 (Reposit Power)
  what_happened: Reposit required customers to contribute financially to the project
    rather than gifting them equipment. This financial commitment changed the customer
    dynamic — paying customers felt empowered to demand service levels and features,
    which accelerated product development.
  lesson_learnt: Requiring customers to make a financial contribution to a demonstration
    project increases accountability and accelerates development — customers who have
    paid feel entitled to demand service quality, which pushes the technology provider
    to meet real-world expectations faster than a gifted-equipment model would.
