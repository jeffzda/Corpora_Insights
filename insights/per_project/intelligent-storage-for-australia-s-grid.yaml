  publish_date: 2017-01
  project_name: ARENA Emerging Renewables Measure A00598 (Reposit Power)
  what_happened: The original Reposit controller housing was a bespoke aluminium casing
    that proved over-engineered, expensive, and difficult to mount in residential
    settings. This was identified during the initial rollout and triggered a hardware
    redesign.
  lesson_learnt: Bespoke enclosures for residential DER controllers add cost and installation
    complexity without proportionate benefit — use standard off-the-shelf DIN-rail-compatible
    plastic housings from the outset to reduce unit cost and simplify installation
    in Australian residential distribution boards.
