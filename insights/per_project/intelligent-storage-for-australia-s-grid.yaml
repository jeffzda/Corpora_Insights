  what_happened: Reposit's first solar installation partner, Armada Solar, exited
    the solar industry before the project rollout was complete, creating a gap in
    the installation supply chain mid-project.
  lesson_learnt: For DER demonstration projects relying on SME solar installers, proponents
    should not depend on a single installation partner — SME solar firms are vulnerable
    to market exit, and a backup installer network or national partner programme should
    be established before rollout begins.
