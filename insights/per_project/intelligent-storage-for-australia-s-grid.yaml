- record_id: ARENA-DLV-58910
  source_title: A Commercially Viable Application of Electricity Storage for Australia's
    National Electricity Grid
  publish_date: 2017-01
  project_name: ARENA Emerging Renewables Measure A00598 (Reposit Power)
  what_happened: Reposit deployed 12 Reposit Box controller-only devices (without
    batteries) in households to collect energy consumption data and demonstrate that
    its IT systems could scale to handle larger volumes. At the project outset, batteries
    were very expensive, so controller-only deployments were used to build data capability
    ahead of hardware cost reductions.
  lesson_learnt: When battery hardware costs are prohibitive, deploying software/controller-only
    units in homes can build the data pipeline, train predictive algorithms, and stress-test
    IT infrastructure at scale — allowing a DER technology provider to be ready for
    rapid deployment when hardware costs fall.
