- record_id: ARENA-DLV-58907
  source_title: A Commercially Viable Application of Electricity Storage for Australia's
    National Electricity Grid
  publish_date: 2017-01
  project_name: ARENA Emerging Renewables Measure A00598 (Reposit Power)
  what_happened: Reposit successfully demonstrated that a single small residential
    battery system could simultaneously deliver multiple stacked services — solar
    shifting, tariff arbitrage, wholesale market trading, ancillary services (FCAS),
    and network demand management — and that a software co-optimisation model could
    negotiate between competing service demands in real time.
  lesson_learnt: Residential battery systems can commercially deliver stacked services
    across solar shifting, wholesale markets, FCAS, and network support simultaneously
    — proponents developing business models for residential storage should design
    for multi-service co-optimisation from the outset rather than optimising for a
    single use case.
