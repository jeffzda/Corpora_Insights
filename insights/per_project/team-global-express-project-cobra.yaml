- record_id: ARENA-DLV-2616
  source_title: ARENA Insights Forum November 2024 - Accelerating Zero-Emissions Heavy
    Transport
  publish_date: 2024-11
  project_name: Team Global Express Project COBRA
  what_happened: 'Project COBRA integrated multiple interdependent systems: facility
    renewable energy (solar), energy storage and backup (BESS/microgrid), energy management
    systems, grid renewable energy supply, EV chargers, electric vehicles, and data
    management — all of which required simultaneous coordination across design, installation,
    and commissioning.'
  lesson_learnt: Electric fleet projects that integrate on-site renewables, BESS,
    smart energy management, and EV charging are multi-system integration projects,
    not fleet procurement projects — project delivery must be structured to manage
    the interdependencies across all subsystems from the outset.
