- record_id: ARENA-DLV-2623
  source_title: ARENA Insights Forum November 2024 - Accelerating Zero-Emissions Heavy
    Transport
  publish_date: 2024-11
  project_name: Team Global Express Project COBRA
  what_happened: Team Global Express identified that for a 3rd-party logistics (3PL)
    versus captive fleet context, operational complexities differ substantially, and
    union interface was specifically listed as a delivery challenge for the electric
    vehicle fleet transition.
  lesson_learnt: Electric fleet transitions in unionised 3PL environments must include
    a structured union interface strategy from the outset — union engagement is a
    delivery variable, not a communications task, and can affect scheduling, driver
    training, and operational integration.
