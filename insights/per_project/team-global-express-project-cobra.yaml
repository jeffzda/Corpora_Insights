  project_name: Team Global Express Project COBRA
  what_happened: Team Global Express received a $20M+ ARENA grant plus substantial
    TGE investment to trial 60 battery electric vehicles (Fuso eCanters and Volvo
    FLs) with associated depot charging infrastructure, constituting the largest such
