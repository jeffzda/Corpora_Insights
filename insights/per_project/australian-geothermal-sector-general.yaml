- record_id: ARENA-DLV-72006
  source_title: Australian Energy Resource Assessment — Second Edition, 2014
  publish_date: '2014'
  project_name: Australian Geothermal Sector — General
  what_happened: The Australian geothermal exploration sector expanded rapidly to
    54 companies holding 409 leases by January 2010, but had been in decline since
    2010, with only 28 entities holding 232 licences by August 2012, reflecting the
    failure of early projects to demonstrate commercial viability and attract continued
    private investment.
  lesson_learnt: Nascent geothermal sectors are highly sensitive to early demonstration
    outcomes — failure of lead projects to prove commercial viability can trigger
    rapid contraction in exploration activity across the whole sector; securing at
    least one commercially successful demonstration project early is critical to sustaining
    investor confidence and sector momentum.
