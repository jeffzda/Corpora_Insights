  evidence_excerpt: Following a period of rapid expansion, exploration for geothermal
    resources has been in decline since 2010. The first geothermal exploration licence
    in Australia was granted in 2000 and by January 2010, 54 companies held 409 leases
    over an area of 432 000 km2. In August 2012, 28 entities had applied for, or been
    granted, 232 geothermal exploration/development licences.
