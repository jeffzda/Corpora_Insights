- record_id: ARENA-DLV-7902
  source_title: ANU - Cost-effective Si/Perovskite Tandem Modules on Passivating Contact
    Si Cells - R&D Interim Report
  publish_date: '2024-05-31'
  project_name: Cost-effective Si/Perovskite Tandem Modules on Passivating Contact
    Si Cells (2022/TRAC005)
  what_happened: Investigations into alternatives to the commonly used but thermally
    unstable hole transport material Spiro-OMeTAD identified Spiro-TTB as a promising
    candidate with better thermal stability. However, cells using Spiro-TTB showed
    performance that was unexpectedly highly dependent on the electron transport layer
    used — a synergistic inter-layer interaction not observed with Spiro-OMeTAD and
    not anticipated.
  lesson_learnt: Different layers in a perovskite solar cell can interact strongly
    and unpredictably with each other; when substituting a new material for one layer,
    its compatibility with all other cell layers must be empirically validated rather
    than assumed. Future R&D programmes should incorporate cross-layer interaction
    testing and invest in device modelling tools capable of predicting multi-layer
    performance.
  issue_severity: moderate
  project_type: generation
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated integration
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Investigations into the cause of the electron-transport-layer
    dependency are ongoing; no resolution stated in this report.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id002
