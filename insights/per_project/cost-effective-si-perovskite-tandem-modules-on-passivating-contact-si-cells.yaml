- record_id: ARENA-DLV-7904
  source_title: ANU - Cost-effective Si/Perovskite Tandem Modules on Passivating Contact
    Si Cells - R&D Interim Report
  publish_date: '2024-05-31'
  project_name: Cost-effective Si/Perovskite Tandem Modules on Passivating Contact
    Si Cells (2022/TRAC005)
  what_happened: Perovskite cells are chemically reactive with the widely used encapsulant
    EVA and cannot withstand the high lamination temperatures (>150 °C) standard in
    silicon module production. This materials incompatibility means standard silicon
    module encapsulation processes cannot be applied directly to perovskite or tandem
    modules, requiring new encapsulation process development.
  lesson_learnt: Standard silicon module encapsulation processes (EVA encapsulant,
    >150 °C lamination) are incompatible with perovskite cells and cannot be assumed
    transferable to tandem modules. Projects commercialising perovskite-containing
    modules must budget for dedicated encapsulation process and materials development
    as a distinct workstream, not a late-stage integration task.
  issue_severity: moderate
  project_type: generation
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: A dedicated work package (WP-3) was established to develop and
    evaluate modified encapsulation processes and materials compatible with perovskite
    cells.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id004
  - 5
  evidence_excerpt: perovskite materials are reactive to the widely used encapsulant
    ethylene vinyl acetate (EVA) and they cannot withstand the high temperature (generally
    over 150 °C) involved in the lamination process. Therefore, it is necessary to
    modify the typical encapsulation processes to reduce moisture and oxygen ingress.
