- record_id: ARENA-DLV-7901
  source_title: ANU - Cost-effective Si/Perovskite Tandem Modules on Passivating Contact
    Si Cells - R&D Interim Report
  publish_date: '2024-05-31'
  project_name: Cost-effective Si/Perovskite Tandem Modules on Passivating Contact
    Si Cells (2022/TRAC005)
  what_happened: A custom LED-based stability test chamber was built to test perovskite
    cells under inert atmosphere, but the LED light source proved unstable — light
    intensity decreased rapidly after switch-on due to a chemical change in the LED
    cover layer caused by the absence of oxygen. This required significant redesign
    of the test setup, moving the light source outside the chamber and coupling light
    through a transparent window.
  lesson_learnt: LED-based light sources must not be housed inside inert (oxygen-free)
    test chambers — the lack of oxygen causes a reversible but practically disruptive
    chemical degradation of the LED cover layer. When designing perovskite stability
    test rigs using LEDs, keep the light source in an ambient atmosphere and couple
    light into the inert test zone via a transparent window.
