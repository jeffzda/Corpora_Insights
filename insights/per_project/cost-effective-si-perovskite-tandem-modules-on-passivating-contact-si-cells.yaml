  evidence_excerpt: further investigation showed that the cell performance tended
    to be highly dependent on the electron transport layer used, in contrast to Spiro-OMeTAD,
    where cell performance was insensitive to the electron transport layer. This was
    unexpected. The reasons are currently under investigation.
