- record_id: ARENA-DLV-7903
  source_title: ANU - Cost-effective Si/Perovskite Tandem Modules on Passivating Contact
    Si Cells - R&D Interim Report
  publish_date: '2024-05-31'
  project_name: Cost-effective Si/Perovskite Tandem Modules on Passivating Contact
    Si Cells (2022/TRAC005)
  what_happened: Scaling perovskite-silicon tandem cells from 1 cm² to 20 cm² required
    modification of several process steps, particularly metallisation (metal finger
    design for current collection across the larger area). After successful development,
    the team achieved 23.7% efficiency on 20 cm² devices, exceeding the 23% target.
  lesson_learnt: Upscaling perovskite-silicon tandem cells requires non-trivial process
    redesign — current collection metallisation that works at 1 cm² does not transfer
    directly to larger areas and must be re-engineered. Plan explicit scale-up work
    packages and associated resourcing when moving from small-area proof-of-concept
    to commercially relevant cell sizes.
  issue_severity: minor
