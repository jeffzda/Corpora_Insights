  intervention_note: ARENA funded the Australian Solar Energy Information System (ASEIS)
    developed collaboratively by Geoscience Australia and the Bureau of Meteorology
    to provide pre-competitive solar resource data to assist regional analysis of
    suitable large-scale solar locations.
