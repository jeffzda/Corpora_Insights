  evidence_excerpt: Solar energy resources are greater in the north‑west and centre
    of Australia, in areas that do not have access to the national electricity grid.
    Locating utility-scale plants in these areas is likely to require investment in
    transmission infrastructure... The outlook for commercial-scale solar photovoltaic
    and thermal electricity generation depends on demonstration at commercial scale
    that will reduce investment risks and encourage deployment.
  confidence_note: This record captures a structural delivery barrier identified at
    sector level, grounded in specific resource mapping data. The DNI dataset resolution
    limitation (1-degree grid, ~10,000 km² cells) is also a delivery-relevant data
    quality issue for project developers relying on it for site selection.
