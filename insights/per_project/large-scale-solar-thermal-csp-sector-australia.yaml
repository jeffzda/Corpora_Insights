- record_id: ARENA-DLV-72023
  source_title: Australian Energy Resource Assessment - Second edition, 2014
  publish_date: '2014'
  project_name: Large-scale solar thermal/CSP sector (Australia)
  what_happened: The document identifies that the outlook for commercial-scale solar
    PV and thermal electricity generation in Australia depends on demonstration at
    commercial scale to reduce investment risks and encourage deployment, and that
    the highest solar radiation resources are predominantly in remote inland areas
    not connected to the national electricity grid — requiring transmission investment
    to access.
  lesson_learnt: 'Large-scale solar thermal projects in Australia face a fundamental
    siting tension: the highest DNI resources are in remote, grid-remote locations
    requiring major transmission investment, while grid-proximate sites have lower
    but still substantial solar resource; project developers should quantify the net
    present cost of transmission investment against resource quality trade-off at
    the development stage, rather than optimising on resource alone.'
  issue_severity: moderate
  project_type: generation
