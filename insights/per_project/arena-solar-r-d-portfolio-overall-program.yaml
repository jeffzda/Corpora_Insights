- record_id: ARENA-DLV-40372
  source_title: 'In The Spotlight: Australian Solar Energy R&D Outcomes and Achievements in a Global Context'
  publish_date: 2018-07
  project_name: ARENA Solar R&D Portfolio (Overall Program)
  what_happened: The average funding leverage ratio for ARENA solar R&D projects was 1.58 (total project budget to ARENA contribution), lower than the average leverage ratio for all ARENA projects (2.4),
    demonstration projects (1.8), and deployment projects (3.6). PV projects achieved the highest leverage (1.67) and Enabling projects the lowest (1.43).
  lesson_learnt: Early-stage solar R&D programs should anticipate lower co-funding leverage ratios than deployment programs when setting portfolio-level financial targets — requiring deployment-equivalent
    leverage ratios from R&D programs will structurally under-fund basic and applied research where industry co-investment is naturally limited by high technical risk.
