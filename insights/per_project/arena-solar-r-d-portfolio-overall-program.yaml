- record_id: ARENA-DLV-40373
  source_title: 'In The Spotlight: Australian Solar Energy R&D Outcomes and Achievements in a Global Context'
  publish_date: 2018-07
  project_name: ARENA Solar R&D Portfolio (Overall Program)
  what_happened: Research and industry hubs such as ACAP (for PV), ASTRI (for CST), and data/forecasting infrastructure (ASEFS, AREMI) were identified as playing a key role in reducing funding volatility,
    securing employment for graduates, maintaining high educational outcomes, and providing links into the global industry — outcomes that individual project grants could not have achieved.
  lesson_learnt: Establishing durable research institutions and industry hubs with multi-year funding mandates is more effective than repeated competitive grant rounds for maintaining world-competitive
    research capability — hub structures reduce funding volatility, concentrate talent, and create the sustained industry linkages needed to move research outcomes to market.
