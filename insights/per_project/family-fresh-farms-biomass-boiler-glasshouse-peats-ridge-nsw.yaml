- record_id: ARENA-DLV-11019
  source_title: Renewable Energy Options for Industrial Process Heat
  publish_date: 2019-08
  project_name: Family Fresh Farms Biomass Boiler Glasshouse, Peats Ridge NSW
  what_happened: Family Fresh Farms installed a 5 MWth biomass-fuelled hot water boiler
    using sawmill waste with 60 MWh of hot water storage to heat a cucumber greenhouse
    in Peats Ridge, NSW. The system was commissioned in 2017 and operates autonomously,
    using approximately 4,000 tonnes of wood chips per year. The boiler operates with
    moisture contents of up to 55%. Operating a bioenergy plant of this sort required
    EPA approval, and any future change to fuel source may require an expanded exhaust
    treatment system and a new approval.
  lesson_learnt: Bioenergy heat systems using mixed waste fuels require EPA approval,
    and changes to feedstock can trigger both exhaust treatment system upgrades and
    re-approval — fuel flexibility should be confirmed with regulators before selecting
    equipment, and the exhaust gas treatment system should be sized for likely feedstock
    variations.
