- record_id: ARENA-DLV-52063
  source_title: ARENA Distributed Energy Resources Projects
  publish_date: 2019-03
  project_name: Powershop Behavioural demand response program utilising a mobile app notification system directed to Victorian residential retail customers (RERT)
  what_happened: Powershop's Curb Your Power behavioural demand response program attracted over 10,000 customers, making it the largest behavioural demand response program run in Australia at the time,
    demonstrating that smartphone app-based engagement with power credits as incentives could achieve significant residential participation.
  lesson_learnt: Smartphone app-based notification combined with power credit incentives (rather than physical rewards) can achieve large-scale residential demand response participation — this model is
    replicable for retailers seeking to build behavioural DR programs at scale.
