  project_name: Santos Oil Beam Pump Conversion to Solar and Battery
  what_happened: Battery costs remained high and commercially available battery storage
    products were found to be poorly suited to the harsh environmental conditions
    (heat, dust, transport shock) encountered in remote locations, requiring custom
    packaging solutions rather than standard industry approaches.
  lesson_learnt: Standard battery system packaging solutions (building rooms to accommodate
    components) are inadequate for remote harsh-environment deployments — future projects
    should require battery suppliers to provide tightly integrated packages incorporating
    ambient control, communications, security, vermin control, radiation damage protection,
    mobility and civil considerations, rather than adapting standard configurations
    on-site.
