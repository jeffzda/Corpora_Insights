- record_id: ARENA-DLV-64351
  source_title: Solar Beam Pumps Lessons Learnt
  publish_date: 2021-12
  project_name: Conversion of Remote Crude Oil Pumps to Solar & Battery Project
  what_happened: Summer installation work in the Cooper Basin was delayed by hot temperatures
    exceeding 35°C and wet weather that restricted access to lease sites via dirt
    roads. Unstable road conditions also caused physical damage to solar PV panels
    and battery units during transport, requiring disassembly and reassembly before
    transit.
  lesson_learnt: Schedule installations in the Cooper Basin between April and October
    to avoid summer heat and wet-season road closures. For transport, dissemble units
    prior to transit on rough roads and detour to bitumen roads where available —
    this was found to be more time-effective and prevented further damage.
