- record_id: ARENA-DLV-10351
  source_title: Conversion of Remote Crude Oil Beam Pumps to Solar & Battery Final
    Report
  publish_date: 2021-12
  project_name: Conversion of Remote Crude Oil Pumps to Solar & Battery Project
  what_happened: Approximately 20% of the solar and battery systems installed across
    56 beam pumps were undersized because increased well loads during well life maturity
    were not adequately anticipated, causing gensets to be powered on to supplement
    power. The project failed to meet its 95% availability target, achieving only
    90% (excluding units offline for maintenance) or 77% overall.
  lesson_learnt: Design remote solar and battery systems for beam pumps to be expansion-ready
    with modular plug-and-play options so capacity can be scaled up or down to match
    each stage of the well's life — undersized units require genset backup and depress
    overall system availability.
  issue_severity: major
  project_type: industrial decarbonisation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: industrial operator
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: Switched to gensets to meet load requirements on undersized sites,
    and planned relocation of units to lower-load-intensive wells when no longer fit
    for purpose on current well.
  transferability: moderate
  delay_magnitude: null
  technology_domain: hybrid systems
