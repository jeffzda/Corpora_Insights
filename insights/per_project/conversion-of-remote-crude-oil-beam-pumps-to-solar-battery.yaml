- record_id: ARENA-DLV-2851
  source_title: Conversion of Remote Crude Oil Beam Pumps to Solar & Battery Lessons
    Learnt
  publish_date: 2020-03
  project_name: Santos Oil Beam Pump Conversion to Solar and Battery
  what_happened: After deploying the first six solar and battery units, load variation
    caused by changing reservoir composition (increasing water-to-oil ratio over time)
    was found to have been underestimated in the initial design, requiring a review
    and larger design allowances for solar and battery sizing in subsequent units.
  lesson_learnt: Account for cyclic peak demand and long-term load growth due to reservoir
    water ingress when sizing solar and battery systems for beam pump applications
    — initial designs that omit this will require resizing after early deployments.
