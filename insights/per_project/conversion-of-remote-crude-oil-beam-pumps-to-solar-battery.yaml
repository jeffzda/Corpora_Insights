  source_title: Solar Beam Pumps Lessons Learnt
  publish_date: 2021-12
  project_name: Conversion of Remote Crude Oil Pumps to Solar & Battery Project
  what_happened: The EPC contract required the EPC contractor (AGL) to conduct all
    hardware maintenance to preserve the warranty, which caused delays in fault remediation
    due to the remote location of sites. The spares list was also held exclusively
    by AGL, preventing the operator from conducting simple repairs.
  lesson_learnt: Structure EPC contracts for remote-site renewable installations to
    permit operator-led maintenance for non-complex faults, so that on-site personnel
    — who are physically closer — can resolve issues quickly without waiting for the
    contractor. Require the spares list to be documented and handed over during installation.
