  evidence_excerpt: Summer months presents hot (>35oC) and wet weather in the Cooper
    basin. This delayed installation progress by restricting access to the lease sites
    when dirt roads were wet... Unstable road conditions to the implementation site
    resulted in damage to the solar PV panels and battery units.
