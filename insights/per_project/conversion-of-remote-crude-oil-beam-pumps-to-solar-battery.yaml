  what_happened: The Ecoult battery supplier withdrew from Australia in August 2020,
    and a safety recall was issued because the batteries were not designed to independently
    protect against fire or electric shock when combined with certain equipment. All
    Phase 1 batteries installed in 2019 had to be taken offline for remediation, requiring
