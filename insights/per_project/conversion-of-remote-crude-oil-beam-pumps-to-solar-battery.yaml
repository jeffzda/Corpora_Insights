  project_type: industrial decarbonisation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: construction/installation
  proponent_type: industrial operator
  delay_category: construction/installation
  failure_mode: execution & logistics
  outcome_class: delayed but recoverable
  secondary_failure_mode: poor scoping
  intervention_note: Transporting at very low speeds and detouring to bitumen roads
    where available was implemented for remaining installations, reducing further
    damage and transit time.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: hybrid systems
  source_pages:
