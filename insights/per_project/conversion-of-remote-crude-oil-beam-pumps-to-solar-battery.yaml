  source_title: Solar Beam Pumps Lessons Learnt
  publish_date: 2021-12
  project_name: Conversion of Remote Crude Oil Pumps to Solar & Battery Project
  what_happened: Multiple different standard designs were used across Phase 1 and
    Phase 2 of the project, increasing complexity in maintenance campaigns, design
    optimisation, and supply reliability. The ABB battery designs were found to be
    overly complex for a rural remote environment, with multiple alarms triggering
    simultaneously, making fault diagnosis difficult.
  lesson_learnt: After initial trials, minimise the number of standard designs by
    specifying a defined set of final designs in the EPC contract. Favour simpler
    battery architectures suited to remote rural environments to reduce alarm complexity
    and improve maintenance and root-cause analysis.
