- record_id: ARENA-DLV-0903
  source_title: Roof-Mounted Hybrid CST System for Distributed Generation of Heating,
    Cooling and Electricity
  publish_date: '2015-04-30'
  project_name: Roof-Mounted Hybrid CST System for Distributed Generation of Heating,
    Cooling and Electricity
  what_happened: Commercial partners Chromasun and NEP Solar, who had been engaged
    in commercialising thermal-only roof-mounted solar systems, found their own businesses
    under financial pressure from declining PV costs during the project period, removing
    the expected commercialisation pathway for the hybrid technology at project completion.
  lesson_learnt: When funding early-stage solar technology R&D, explicitly model the
    competitive cost trajectory of incumbent technologies (particularly silicon PV)
    as a boundary condition — a technology that appears commercially viable at project
    approval may be rendered uncompetitive before completion if PV cost declines are
    not accounted for.
