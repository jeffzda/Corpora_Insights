- record_id: ARENA-DLV-0902
  source_title: Roof-Mounted Hybrid CST System for Distributed Generation of Heating,
    Cooling and Electricity
  publish_date: '2015-04-30'
  project_name: Roof-Mounted Hybrid CST System for Distributed Generation of Heating,
    Cooling and Electricity
  what_happened: The project successfully demonstrated spectral splitting of sunlight
    to direct the PV-suitable spectrum to silicon solar cells operating at 30 suns
    concentration, achieving efficiencies greater than 20%, and directed remaining
    spectrum to a thermal absorber producing heat at 120–150°C, with all key subsystems
    fabricated and integrated.
  lesson_learnt: Adapting commercially available one-sun silicon solar cells for use
    under concentration (~30 suns) is technically feasible and achieves efficiencies
    above 20%, making this a viable subsystem approach for hybrid CPV-thermal receivers
    even when large resistive losses are present.
