- record_id: ARENA-DLV-0904
  source_title: Roof-Mounted Hybrid CST System for Distributed Generation of Heating,
    Cooling and Electricity
  publish_date: '2015-04-30'
  project_name: Roof-Mounted Hybrid CST System for Distributed Generation of Heating,
    Cooling and Electricity
  what_happened: Despite the loss of a clear commercialisation pathway, the project
    generated skills in modelling, characterisation, analysis, and solar systems knowledge
    among students and staff that were identified as transferable to other solar projects,
    and results were disseminated through publications, conference presentations,
    media outreach, and facility visits.
  lesson_learnt: Even when a demonstration project does not achieve commercial follow-on,
    structuring knowledge dissemination through journal publications, conference presentations,
    and open facility access can preserve and transfer the technical value generated
    — this residual value should be explicitly planned and documented as a project
    output.
