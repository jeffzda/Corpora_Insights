- record_id: ARENA-DLV-37921
  source_title: Hydrogen Communities & H2City Tool
  publish_date: 2019-06
  project_name: Hydrogen Energy Supply Chain (HESC) Project
  what_happened: The HESC Project secured strong government support from the Japanese,
    Victorian and Commonwealth governments, including $50 million each from the Victorian
    and Commonwealth governments for the pilot phase, demonstrating that multi-government
    investment was required to progress a world-first hydrogen export supply chain.
  lesson_learnt: First-of-kind international hydrogen supply chain projects require
    co-investment from multiple governments across the supply chain (both exporting
    and importing countries) — bilateral government commitment is a prerequisite for
    commercial consortium formation and should be secured before detailed engineering
    begins.
