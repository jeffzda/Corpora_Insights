- record_id: ARENA-DLV-37920
  source_title: Hydrogen Communities & H2City Tool
  publish_date: 2019-06
  project_name: Hydrogen Energy Supply Chain (HESC) Project
  what_happened: The HESC Project, which aimed to convert Victorian brown coal to
    liquid hydrogen for export to Japan, identified that a carbon capture and storage
    (CCS) solution is a critical dependency for any future commercial-scale operation,
    with CCS absent from the pilot phase due to the small volume of CO2 produced.
  lesson_learnt: For hydrogen production projects using coal gasification, CCS is
    a non-negotiable requirement for commercial-scale operation — projects must identify
    and secure a viable CCS solution (including a suitable geological storage reservoir)
    during the pilot phase, not defer it to commercial scale-up.
