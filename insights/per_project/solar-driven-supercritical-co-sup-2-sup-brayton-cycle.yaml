  secondary_failure_mode: null
  intervention_note: CSIRO positioned the existing flow loop as a shared infrastructure
    asset for ASTRI integration and continued US DOE collaboration to sustain technology
    progression beyond the project boundary.
  transferability: narrow
  delay_magnitude: null
  technology_domain: solar thermal
  source_pages: &id006
