- record_id: ARENA-DLV-12302
  source_title: Solar Driven Supercritical CO2 Brayton Cycle - Project Results and
    Lessons Learnt
  publish_date: 2017-05
  project_name: Solar-driven Supercritical CO2 Brayton Cycle (1-UFA004)
  what_happened: Existing industry supply chains were found to be unable to provide
    sCO2 cycle components — particularly seals, pumps, and valve seats — that meet
    the longevity and performance requirements of a commercial plant. Components sourced
    from international suppliers deteriorated faster than expected under operating
    conditions of 650°C and 20 MPa.
  lesson_learnt: Future sCO2 projects should not assume commercial-off-the-shelf components
    will meet longevity requirements. A dedicated component qualification and supply
    chain development programme is needed before progressing to commercial-scale sCO2
    deployment, particularly for dynamic sealing elements.
  issue_severity: major
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: CSIRO initiated ongoing collaboration with pump manufacturers
    and seal material developers to better understand degradation mechanisms and develop
    improved configurations.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar thermal
  source_pages: &id002
  - 10
  - 12
  evidence_excerpt: The implication is that industry is currently underprepared to
    supply components for the sCO2 power cycle that will meet the longevity and performance
    requirements a commercial plant.
  confidence_note: lifecycle_phase set to operations as the shortfall was discovered
    during ongoing experimental system operation, not during initial commissioning.
