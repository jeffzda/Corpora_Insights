  publish_date: 2017-05
  project_name: Solar-driven Supercritical CO2 Brayton Cycle (1-UFA004)
  what_happened: The project successfully achieved the first on-sun demonstration
    of a directly illuminated solar receiver operating with high-pressure supercritical
    CO2 at 650°C and 20 MPa, validating the sCO2 flow loop under conditions representative
    of a large-scale solar thermal power station.
  lesson_learnt: Integrating thermal storage into a novel experimental flow loop allows
    the system to be commissioned in a controlled environment before live solar exposure,
    reducing risk during first-of-kind on-sun operation. This approach de-risks early-stage
    demonstrations of high-pressure, high-temperature solar receiver systems.
