- record_id: ARENA-DLV-12305
  source_title: Solar Driven Supercritical CO2 Brayton Cycle - Project Results and
    Lessons Learnt
  publish_date: 2017-05
  project_name: Solar-driven Supercritical CO2 Brayton Cycle (1-UFA004)
  what_happened: The project demonstrated the use of a thermal storage system charged
    by either solar or combustion heat sources to allow the sCO2 flow loop to be commissioned
    and operated in a controlled environment, enabling safe and flexible testing independent
    of solar availability.
  lesson_learnt: Incorporating dual-source thermal storage (solar and combustion)
    into an experimental sCO2 loop significantly expands the testing envelope by decoupling
    commissioning and experimental activities from solar resource availability, improving
    the pace and quality of component testing for early-stage solar thermal R&D.
