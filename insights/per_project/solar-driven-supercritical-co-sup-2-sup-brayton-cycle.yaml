- record_id: ARENA-DLV-12301
  source_title: Solar Driven Supercritical CO2 Brayton Cycle - Project Results and
    Lessons Learnt
  publish_date: 2017-05
  project_name: Solar-driven Supercritical CO2 Brayton Cycle (1-UFA004)
  what_happened: Seal materials used in the sCO2 reciprocating pump (PTFE-based compression
    packings and polymer anti-extrusion rings) deteriorated at an advanced rate under
    supercritical CO2 conditions. Supercritical and liquid CO2 acts as a solvent that
    causes swelling and degradation of most polymer-based seal materials, rendering
    them unable to reseal effectively after the first depressurisation.
  lesson_learnt: Do not specify PTFE-based or hydrocarbon-lubricated seal materials
    for sCO2 pump and valve components — CO2 in supercritical or liquid state will
    dissolve lubricants and swell polymers, causing rapid seal failure. Graphite-based
    sealing materials should be investigated as the primary alternative, and seal
    material compatibility must be validated under actual supercritical conditions
    before committing to a pump configuration.
  issue_severity: moderate
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: research organisation/university
  delay_category: commissioning/integration
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: CSIRO investigated graphite-based sealing materials as a replacement
    and began working directly with pump manufacturers and seal material developers
    to test alternative configurations combining materials with complementary properties.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar thermal
  source_pages: &id001
  - 10
  - 11
  - 12
  evidence_excerpt: The conditions under which Supercritical CO2 (sCO2) is required
    to operate within the power cycle result in short life spans for traditional seal
    materials. This was identified within the reciprocating pump seals and valve seats,
    which were observed to deteriorate at an advanced rate.
  confidence_note: issue_severity set to moderate rather than major as the seal failure
    constrained experimental operation but did not halt the overall project; the system
    still achieved first on-sun demonstration.
