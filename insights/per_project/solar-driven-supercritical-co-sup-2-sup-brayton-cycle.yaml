  evidence_excerpt: The next steps for the project include the continued on sun activities
    within CSIRO to further experiment on the sCO2 system. The flow loop and equipment
    will become a key part of scaling ASTRI technologies and hopefully be part of
    the future sCO2 power system powered by solar thermal power.
  confidence_note: outcome_class set to knowledge generated despite setback as the
