- record_id: ARENA-DLV-12306
  source_title: Solar Driven Supercritical CO2 Brayton Cycle - Project Results and
    Lessons Learnt
  publish_date: 2017-05
  project_name: Solar-driven Supercritical CO2 Brayton Cycle (1-UFA004)
  what_happened: After five years of development (2012–2017), the sCO2 Brayton cycle
    technology remained at a pre-commercial research stage with key components — including
    turbines — still under development within the ASTRI programme. The project did
    not progress to a turbine test, identifying this as scope for future work.
  lesson_learnt: sCO2 Brayton cycle projects should plan for extended development
    timelines across multiple sequential projects; individual project scopes should
    be bounded to achievable component-level milestones rather than full-system integration,
    and follow-on programme funding should be anticipated from the outset.
  issue_severity: moderate
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: close-out/post-project review
  proponent_type: research organisation/university
  delay_category: null
