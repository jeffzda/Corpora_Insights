- record_id: ARENA-DLV-34551
  source_title: 'Renergi Pty Ltd: Energy from Waste through Pyrolysis Project Lessons
    Learnt Report #3'
  publish_date: 2022-03
  project_name: Energy from Waste through Pyrolysis Project
  what_happened: During front-end engineering design (FEED) for the pre-commercial
    pyrolysis demonstration plant, the project team determined that a dedicated dryer
    was necessary for the process to achieve high efficiency and consistent product
    quality. The initial assessment of direct drying (hot flue gas in direct contact
    with feedstock) was ruled out due to pathogen release risk, particulate matter
    emissions, dust explosion hazard, and prohibitive heat transfer surface area requirements
    for indirect drying at the required low temperatures (<150°C).
  lesson_learnt: Drying must be treated as a critical design consideration — not an
    afterthought — in any pyrolysis or thermochemical conversion process handling
    municipal solid waste or high-moisture biomass feedstocks; direct drying with
    flue gas is incompatible with MSW due to pathogen, particulate, and explosion
    risks, and indirect drying at low temperatures requires innovative heat transfer
    solutions to be economically viable.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Renergi's technical team invented a new indirect dryer using
    a recirculating thermal oil circuit with two heat exchangers — one to heat the
    thermal oil from pyrolysis flue gas, and one to transfer heat indirectly to the
    feedstock — eliminating pathogen release, particle entrainment, and explosion
    risks; a patent application was filed to protect the new design.
  transferability: moderate
  delay_magnitude: null
  technology_domain: bioenergy
  source_pages: &id005
  - 2
  - 3
  evidence_excerpt: The detailed front-end-engineering design (FEED) in this project
    indeed proved the need for a dedicated dryer for the pre-commercial plant to be
    built in this project. A dryer is necessary to optimise the energy supply and
    demand for the whole pyrolysis process to achieve high efficiency. A dryer is
    also essential to produce a pyrolysis oil product with consistent quality, especially
    with acceptable water contents.
  confidence_note: issue_severity rated moderate rather than minor because the design
    assumption failure required invention of a new dryer type and a new patent filing,
    indicating meaningful rework beyond normal contingency; no schedule or cost data
    provided to calibrate further.
