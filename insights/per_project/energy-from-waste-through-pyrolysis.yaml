- record_id: ARENA-DLV-8003
  source_title: Renergi - Energy from Waste through Pyrolysis - Lessons Learnt Report
    5
  publish_date: '2025-04-16'
  project_name: 'Renergi Pty Ltd: Energy from Waste through Pyrolysis Project'
  what_happened: Pipe surface roughness, internal protrusions, reductions in pipe
    diameter, and pipe deformation along the biomass pathway were found to initiate
    and strengthen biomass bridging, compounding blockage problems during plant commissioning.
  lesson_learnt: Biomass conveying pipework must use smooth internal surfaces, avoid
    any protrusions or dead corners, and maintain consistent or increasing diameter
    along the biomass pathway — any local narrowing or deformation is sufficient to
    initiate bridging in fibrous, low-bulk-density feedstocks.
