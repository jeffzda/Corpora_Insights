- record_id: ARENA-DLV-8002
  source_title: Renergi - Energy from Waste through Pyrolysis - Lessons Learnt Report
    5
  publish_date: '2025-04-16'
  project_name: 'Renergi Pty Ltd: Energy from Waste through Pyrolysis Project'
  what_happened: Equipment in the plant was designed using angle-of-repose measurements
    taken from small uncompacted biomass samples. In operation, compaction caused
    by transport over rough roads substantially raised the effective angle of repose
    — in some cases approaching 90° — making gravity-flow designs unreliable and contributing
    to repeated blockages.
  lesson_learnt: Do not rely primarily on angle-of-repose measurements from small
    uncompacted samples to design biomass-conveying equipment — compaction during
    transport can raise the effective angle of repose dramatically, rendering gravity-flow
    designs unworkable. Equipment must be designed assuming worst-case compacted bulk
    behaviour, or screw-based conveyance used instead.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: commissioning/integration
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: null
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: bioenergy
  source_pages: &id002
  - 3
  evidence_excerpt: While the angle of repose is commonly used in the design of equipment
    handling solid particles, equipment designed by relying mainly or solely on the
    angle of repose for biomass handling is highly likely to be troublesome to operate.
  confidence_note: lifecycle_phase assigned as development/design because the root
    cause is a design-phase assumption error, even though the failure manifested during
    commissioning.
