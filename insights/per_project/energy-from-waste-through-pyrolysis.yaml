- record_id: ARENA-DLV-15751
  source_title: 'Renergi Pty Ltd: Energy from Waste through Pyrolysis Project Lessons
    Learnt Report #4'
  publish_date: 2023-02
  project_name: Energy from Waste through Pyrolysis Project
  what_happened: Construction of a pre-commercial pyrolysis demonstration plant in
    Collie, WA was delayed when Total Fire Ban days were declared, prohibiting key
    hot works (cutting and welding) at the remote bushfire-prone project site. Meeting
    the prescribed conditions to continue hot works during a Total Fire Ban (firefighting
    vehicles, bulk water supply, dedicated fire detection officer) was financially
    prohibitive for a small project.
  lesson_learnt: Plan explicitly for Total Fire Ban disruptions when constructing
    in remote or bushfire-prone regions of Australia — strategies such as engaging
    a local contractor to enable off-site workshop completion of portable hot-work
    items can minimise schedule and cost impacts, since bans can be declared with
    as little as 12 hours' notice.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: construction/installation
  proponent_type: technology vendor
  delay_category: construction/installation
  failure_mode: execution & logistics
  outcome_class: delayed but recoverable
  secondary_failure_mode: poor scoping
  intervention_note: Used a local contractor so that portable items requiring hot
    works could be transported to the contractor's off-site workshop on Total Fire
    Ban days, allowing work to continue at additional transport cost rather than full
    work stoppage.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: bioenergy
  source_pages: &id004
