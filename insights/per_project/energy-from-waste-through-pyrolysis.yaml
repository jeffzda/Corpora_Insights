- record_id: ARENA-DLV-8001
  source_title: Renergi - Energy from Waste through Pyrolysis - Lessons Learnt Report
    5
  publish_date: '2025-04-16'
  project_name: 'Renergi Pty Ltd: Energy from Waste through Pyrolysis Project'
  what_happened: During commissioning of a pre-commercial pyrolysis demonstration
    plant in Collie, WA, biomass bridging and blockages occurred in pipes and valves
    used to convey fibrous biomass feedstock. The wide particle size distribution
    of Renergi's accepted feedstock — from sub-microns to several centimetres — exacerbated
    bridging severity, causing significant downtime and requiring labour-intensive
    manual unblocking.
  lesson_learnt: Pyrolysis and biomass-handling plants accepting wide particle size
    distributions should use screw conveyors rather than gravity-flow designs based
    on angle of repose — screw conveyors continuously destroy bridging and avoid the
    costly manual interventions that gravity-flow pipe and valve designs require with
    fibrous biomass. Downstream equipment must also be sized and operated at higher
    throughput capacity than upstream equipment, and started first during commissioning
    and operation.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: technology vendor
  delay_category: commissioning/integration
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: execution & logistics
  intervention_note: Adopted a downstream-first start-up sequence and implemented
    screw-based conveying where possible to continuously destroy bridging during ongoing
    commissioning and future operation.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: bioenergy
  source_pages: &id001
  - 2
  - 3
  - 4
  evidence_excerpt: Biomass bridging inside such equipment as pipes and valves is
    very common, causing significant downtime. Unblocking biomass bridging or ratholing
    would normally require the pipes and valves to be taken out of service, necessitating
    a lot of manual handling to unblock, before they can be put back into service.
  confidence_note: issue_severity assessed as moderate rather than major — downtime
    described as significant but the project remained on a recoverable commissioning
    trajectory; no schedule magnitude quantified.
