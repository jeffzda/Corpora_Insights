  what_happened: Steel prices rose by up to 215% between March 2020 and July 2021
    during the COVID-19 pandemic, threatening to increase Renergi's project construction
    costs by several hundred thousand dollars and undermining the financial viability
    of a budget that had been planned in 2019 with significant contingency.
  lesson_learnt: In periods of economic disruption, project budgets should include
    substantial contingency funds and a committed investor obligation to inject additional
    capital when needed — standard CPI figures are not a reliable proxy for construction
    material cost escalation and should not be used as the sole inflation benchmark.
