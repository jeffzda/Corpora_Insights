  project_name: Energy from Waste through Pyrolysis Project
  what_happened: A Public Forum with the Collie community — required to obtain social
    licence and inform plant design — was delayed when a COVID-19 lockdown was announced
    for the Perth metropolitan area and South West region in late January 2021, forcing
    rescheduling from mid-February to 22 April 2021. A second lockdown announced the
    following day narrowly missed disrupting the rescheduled forum.
