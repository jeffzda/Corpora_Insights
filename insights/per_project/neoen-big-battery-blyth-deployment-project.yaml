  project_name: Blyth Battery Energy Storage System (BBESS)
  what_happened: EPC companies in the Australian BESS market commonly mandate their
    own PPC and BMS solutions as part of their tender, meaning the grid connection
    application package cannot be finalised until the EPC tenderer is selected, because
    the connection application is specific to the PPC–inverter combination. This created
    a sequential dependency that delayed the connection application process relative
    to the EPC tender process.
  lesson_learnt: Because the NEM connection application is specific to the PPC–inverter
    combination, the EPC tender and grid connection application processes cannot run
    fully in parallel when EPC contractors mandate their own PPCs — project programmes
    should account for this sequential dependency or specify the inverter and PPC
    before EPC tender to enable parallel processing.
