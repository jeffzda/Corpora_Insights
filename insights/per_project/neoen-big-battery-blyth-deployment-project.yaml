  source_title: Neoen - Blyth Battery - Lessons Learnt 3
  publish_date: 2025-06
  project_name: Blyth Battery Energy Storage System (BBESS)
  what_happened: GFM plant tuning on the retrofit BBESS project revealed that delivering
    a set quantity of inertia requires reserving headroom in plant capacity, reducing
    available active power and energy for market dispatch compared to GFL operations.
    Existing contractual performance obligations from the GFL phase made it extremely
    difficult to accept any reduction in market availability during the GFM transition.
  lesson_learnt: Retrofit GFM projects face a structural conflict between system-strength
    delivery commitments and market revenue obligations inherited from the GFL phase;
    future developers should design GFM capacity requirements into the original plant
    design so that tuning trade-offs do not impinge on contracted market performance.
