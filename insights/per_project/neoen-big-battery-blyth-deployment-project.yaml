- record_id: ARENA-DLV-61154
  source_title: Neoen - Blyth Big Battery Deployment Project - Development Report
    Milestone 2
  publish_date: 2024-10
  project_name: Blyth Battery Energy Storage System (BBESS)
  what_happened: Well into the grid connection process for BBESS, a gap was identified
    between the control loop cycle time achievable in the PPC model and what the controller
    could achieve in reality. This meant the system could not meet the OTR's Fast
    Frequency Response (FFR) requirements via the PPC as originally planned, requiring
    virtual synchronous inertia to instead be enabled natively in the inverter.
  lesson_learnt: Controller communication and full cycle response times must be confirmed
    against real-world hardware performance — not just model performance — before
    finalising a grid connection application; relying on modelled cycle times risks
    a late-stage redesign of the control architecture.
