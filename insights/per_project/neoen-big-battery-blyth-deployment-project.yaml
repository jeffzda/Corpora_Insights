- record_id: ARENA-DLV-61153
  source_title: Neoen - Blyth Big Battery Deployment Project - Development Report
    Milestone 2
  publish_date: 2024-10
  project_name: Blyth Battery Energy Storage System (BBESS)
  what_happened: 'The third-party Power Plant Controller (PPC) selected for BBESS
    was incompatible with the GFM inverter: in GFL mode the inverter accepts P and
    Q commands from the controller, but in GFM mode it requires P, Q and Vref. The
    PPC could only supply P and Q, creating an interface incompatibility that required
    resolution mid-project. Early procurement discussions did not include GFM requirements,
    and the PPC OEM had no tested compatible model.'
  lesson_learnt: CHIL testing benchmarked against PSCAD must be completed before any
    PPC–inverter combination that has not previously obtained NEM approval is deployed
    — software model compatibility alone is insufficient and real-device benchmarking
    is necessary to identify communication and control loop issues that only appear
    in hardware.
