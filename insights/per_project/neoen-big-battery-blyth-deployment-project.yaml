  what_happened: The GFM inverter's faster control loop means that fault current behaviour
    under GFM operation differs significantly from GFL, requiring redesign of protection
    and arc-flash settings within the generating system's electrical balance of plant.
    This was not fully anticipated during initial design, creating additional engineering
    work during the detailed design and connection application phases.
  lesson_learnt: When upgrading a BESS from GFL to GFM, protection and arc-flash settings
    must be re-evaluated from first principles — the GFM inverter's faster control
    loop can produce materially different fault currents that invalidate existing
    protection settings designed for GFL operation.
