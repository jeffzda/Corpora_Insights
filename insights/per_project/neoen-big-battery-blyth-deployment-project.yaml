  project_name: Blyth Battery Energy Storage System (BBESS)
  what_happened: The BBESS project initially obtained grid connection approval and
    registration in grid-following (GFL) mode rather than grid-forming (GFM) mode,
    because the GFM regulatory pathway was too uncertain and slow to meet the target
    Commercial Operations Date. The project then initiated a separate NER clause 5.3.9
    process to transition from GFL to GFM after registration.
  lesson_learnt: To protect the target COD for a GFM BESS project, obtain grid connection
    approval in GFL mode first, then pursue GFM conversion via the 5.3.9 process —
    this decouples the schedule-critical registration milestone from the more complex
    and uncertain GFM approval process.
