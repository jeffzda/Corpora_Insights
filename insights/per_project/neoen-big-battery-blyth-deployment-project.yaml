- record_id: ARENA-DLV-70851
  source_title: Neoen - Blyth Big Battery Deployment Project - Lessons Learnt Report
    No.1
  publish_date: 2024-11
  project_name: Blyth BESS
  what_happened: When Blyth BESS was converted from grid-following to grid-forming
    mode after contracts were executed, the third-party Power Plant Controller (PPC)
    OEM — selected because the inverter OEM had not released its own PPC in the Australian
    market — was found to be incompatible with the GFM inverters. The PPC could only
    provide P and Q signals, whereas GFM operation required P, Q, and Vref signals,
    necessitating a different PPC provider.
  lesson_learnt: Before committing to GFM inverters (or any mode change), confirm
    PPC compatibility with the inverter OEM through desktop studies and CHIL-to-PSCAD
    benchmarking — not just technical discussions. Where possible, use the inverter
    OEM's native PPC; where a third-party PPC is required, rigorously validate compatibility
    in both models and hardware before executing contracts.
