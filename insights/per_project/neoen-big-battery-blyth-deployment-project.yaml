- record_id: ARENA-DLV-70855
  source_title: Neoen - Blyth Big Battery Deployment Project - Lessons Learnt Report
    No.1
  publish_date: 2024-11
  project_name: Blyth BESS
  what_happened: The Australian market for full-wrap EPC delivery of BESS projects
    is narrow compared to solar and wind, with few providers. EPC contractors typically
    supply their own PPC (integrated with BMS and O&M functions) rather than the inverter
    OEM's native controller, creating a structural tension between market competition
    and PPC-inverter compatibility requirements.
  lesson_learnt: Restricting BESS projects to inverter-OEM native PPCs would narrow
    the already limited EPC market in Australia, risking higher project costs; industry
    and procurement policy should actively develop the multi-OEM integration capability
    of third-party PPCs (through standardised interfaces and CHIL benchmarking) rather
    than mandating single-OEM stacks.
  issue_severity: moderate
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: procurement
  proponent_type: project developer
  delay_category: procurement/supply chain
  failure_mode: unvalidated integration
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: coordination & stakeholders
  intervention_note: null
  transferability: broad
