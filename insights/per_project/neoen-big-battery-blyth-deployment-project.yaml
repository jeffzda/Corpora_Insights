  source_title: Neoen - Blyth Battery Deployment - Lessons Learnt Report No.2 H2 2024
  publish_date: 2024-12
  project_name: Blyth Battery Energy Storage System (BBESS)
  what_happened: Compatibility issues between the advanced inverters and the site
    PPC, together with unresolved contractual responsibilities for GFM delivery, delayed
    the commencement of the 5.3.9 network studies and the GFM connection application.
    As at the report date, the project had completed construction and GFL holdpoint
    testing but had not yet commenced the GFM connection process.
  lesson_learnt: For BESS projects targeting GFM capability, the 5.3.9 connection
    process should be initiated as early as possible — ideally in parallel with GFL
    commissioning — and the NSP should be included in early technical discussions
    to avoid delays caused by unresolved technical or contractual issues between system
    component suppliers.
