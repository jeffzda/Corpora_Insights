- record_id: ARENA-DLV-60851
  source_title: Neoen - Blyth Battery - Lessons Learnt 3
  publish_date: 2025-06
  project_name: Blyth Battery Energy Storage System (BBESS)
  what_happened: The GFL-to-GFM retrofit project discovered that new inverter-level
    harmonic filters would be required to enable grid-forming capabilities — contrary
    to the original assumption that only firmware and software changes would be needed,
    as advised by the OEM. This unforeseen hardware requirement added significant
    cost and necessitated taking the plant offline to complete upgrades at each inverter.
  lesson_learnt: Projects planning a GFL-to-GFM retrofit should not rely solely on
    OEM assurances that only firmware/software changes are needed — validate physical
    hardware upgrade requirements early by reviewing comparable GFM deployments in
    overseas markets, and include a hardware upgrade budget contingency from the outset.
  issue_severity: major
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: close-out/post-project review
  proponent_type: project developer
  delay_category: commissioning/integration
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: execution & logistics
  intervention_note: Discussions were initiated to procure required inverter filter
    components and prepare an installation plan designed to minimise impact on facility
    operations; the OEM developed bespoke filter modifications during the course of
    BBESS construction.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id002
  - 7
  - 8
  evidence_excerpt: The delivery of GFM capabilities was expected to be delivered
    mostly through updates to the site firmware and software. However, it is now clear
    that the inverters will require hardware updates to the physical equipment in
