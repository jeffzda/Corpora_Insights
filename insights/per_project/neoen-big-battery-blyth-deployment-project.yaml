- record_id: ARENA-DLV-45054
  source_title: Neoen - Blyth Battery Deployment - Lessons Learnt Report No.2 H2 2024
  publish_date: 2024-12
  project_name: Blyth Battery Energy Storage System (BBESS)
  what_happened: The BBESS was originally designed and registered as a Grid-Following
    (GFL) facility. A later decision to retrofit Grid-Forming (GFM) capability created
    cascading technical and contractual complications — including incompatible control
    system components, unclear responsibility allocation, and delays to the 5.3.9
    connection application process — that would not have arisen had GFM been designed
    in from the outset.
  lesson_learnt: Avoid retrofitting GFM capability to a BESS site initially designed
    and registered as GFL. If GFM capability is a project objective or a likely future
    requirement, it should be incorporated into the original system design, equipment
    selection, and contracts — not added after the GFL design is substantially complete.
