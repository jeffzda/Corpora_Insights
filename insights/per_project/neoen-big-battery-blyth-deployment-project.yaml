  - 8
  evidence_excerpt: Currently the options available in the Australian market for undertaking
    EPC of a BESS project is quite narrow (when compared for example to solar or wind).
    The companies offering this in the market will all tend to use their own PPC rather
    than an inverter OEM's native controller, since they will also roll in other functionality
    such as BMS, and other ongoing operation and maintenance (O&M) requirements.
