  what_happened: At the time of inverter and PPC selection for BBESS, no NEM market
    mechanism existed to value GFM services, meaning there was no financial incentive
    for the proponent to implement GFM capability without grant funding. The project
    would not have proceeded as a GFM deployment without ARENA's $17 million grant.
  lesson_learnt: In the absence of market mechanisms that monetise GFM services, grant
    funding or equivalent incentives are essential to enable proponents to deploy
    advanced inverter technologies — project sponsors should identify and secure such
    incentives before committing to GFM capability in the design.
