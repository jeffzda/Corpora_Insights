- record_id: ARENA-DLV-45053
  source_title: Neoen - Blyth Battery Deployment - Lessons Learnt Report No.2 H2 2024
  publish_date: 2024-12
  project_name: Blyth Battery Energy Storage System (BBESS)
  what_happened: Well into the connection process, a gap was discovered between the
    control loop cycle time achievable by the third-party PPC in its simulation model
    versus what it could achieve with real hardware. This prevented BBESS from meeting
    the Very Fast FCAS and Fast Frequency Response (FFR) performance requirements
    set by the South Australian Office of the Technical Regulator (OTR), despite extensive
    multi-party efforts to resolve it.
  lesson_learnt: Validate the complete control system loop time — including communication
    delays, internal calculation times, and signal measurement averaging — in both
    software and hardware environments before committing to specific fast-response
    generator performance characteristics such as Very Fast FCAS or FFR. Simulation
    models from individual OEMs may not reflect real-world integrated system performance.
  issue_severity: major
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: commissioning/integration
  proponent_type: project developer
  delay_category: commissioning/integration
  failure_mode: unvalidated integration
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Virtual synchronous inertia was enabled in the inverter to allow
    native frequency response without relying on the PPC control loop; separately,
    the PPC function was consolidated into the BMS unit to eliminate the separate
    PPC hardware and reduce control loop latency, enabling some level of Very Fast
    FCAS participation.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
