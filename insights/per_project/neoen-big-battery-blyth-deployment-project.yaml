- record_id: ARENA-DLV-61165
  source_title: Neoen - Blyth Big Battery Deployment Project - Development Report
    Milestone 2
  publish_date: 2024-10
  project_name: Blyth Battery Energy Storage System (BBESS)
  what_happened: The BBESS project determined that selecting an inverter OEM with
    a strong local NEM market presence and track record of registering and commissioning
    their models in Australia materially reduces GPS process risk. The GFM technology
    was still evolving at the time of selection, making it difficult to always achieve
    this, but OEMs with experience in microgrid or off-grid operation and in international
    grid jurisdictions with FFR-type requirements were identified as better prepared
    for the NEM GFM process.
  lesson_learnt: When selecting a GFM inverter OEM, prioritise those with demonstrated
    NEM registration history, active grid models in PSS/E and PSCAD, microgrid or
    off-grid operating experience, and experience in international jurisdictions with
    FFR requirements — these characteristics are the strongest proxies for the OEM's
    ability to support the Australian GFM connection and commissioning process.
