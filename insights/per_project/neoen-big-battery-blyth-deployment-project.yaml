  what_happened: 'The BBESS project identified that transitioning from GFL to GFM
    via the NER 5.3.9 process is not practically scalable: reverting inverter firmware
    back to GFL settings between each hold point test to minimise commercial operations
    impact is workable for one project but not as a standard industry pathway. The
    project also found that AEMO and NSPs are not yet sufficiently familiar with GFM
    models and performance to provide predictable approval timelines.'
  lesson_learnt: The 5.3.9 GFL-to-GFM transition pathway carries inherent schedule
    unpredictability because AEMO and NSPs are still developing familiarity with GFM
    models — this risk will reduce as more projects complete the process, and industry
    should advocate for NER updates that create a dedicated GFM compliance pathway.
