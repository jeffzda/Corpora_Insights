  evidence_excerpt: The complex nature of standard multi-party agreements for delivery
    of projects like a large-scale battery mean it can become unclear when requirements
    changed for GFM, to the point it is not possible to determine with certainty where
    within the multi-party arrangement technical requirements and responsibilities
    lie.
