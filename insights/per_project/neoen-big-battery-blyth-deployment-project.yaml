  source_title: Neoen - Blyth Big Battery Deployment Project - Development Report
    Milestone 2
  publish_date: 2024-10
  project_name: Blyth Battery Energy Storage System (BBESS)
  what_happened: The NER clause S5.2.5.5 requirement for a reactive current settling
    time of no greater than 70 milliseconds was written for GFL asynchronous generating
    systems. When BBESS transitions to GFM mode, the inverter will behave more like
    a synchronous machine with longer settling times, creating a compliance gap because
    no NER provisions or GPS categories exist for this mode of operation.
  lesson_learnt: Future GFM BESS projects should anticipate that NER clause S5.2.5.5
    will require negotiation and that existing GPS standards do not accommodate synchronous
    machine behaviour from asynchronous GFM inverters — engage AEMO and the NSP early
    on this regulatory gap to avoid hold points during commissioning.
