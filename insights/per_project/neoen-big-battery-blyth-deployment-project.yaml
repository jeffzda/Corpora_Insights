- record_id: ARENA-DLV-45052
  source_title: Neoen - Blyth Battery Deployment - Lessons Learnt Report No.2 H2 2024
  publish_date: 2024-12
  project_name: Blyth Battery Energy Storage System (BBESS)
  what_happened: The PPC supplier selected at notice-to-proceed was a different OEM
    from the inverter supplier, because the inverter OEM's PPC was not available in
    the Australian market at that time. When the project later decided to enable GFM
    capability, it was discovered — after GFM contracts had already been executed
    — that the existing PPC could not provide the full signal set (P, Q, and Vref)
    required by the GFM inverters, rendering the original PPC incompatible with GFM
    operation.
  lesson_learnt: Before selecting a Power Plant Controller from a different OEM than
    the inverter supplier, verify the full software and hardware interfacing requirements
    for all intended operational modes — including GFM — in both simulation models
    (PSCAD/PSSE) and real-world hardware. Mismatched OEMs for inverters and PPCs create
    significant integration risk when advanced inverter capabilities are later required.
  issue_severity: major
  project_type: storage
  project_scale_band: utility/large-scale
  lifecycle_phase: commissioning/integration
  proponent_type: project developer
  delay_category: commissioning/integration
  failure_mode: unvalidated integration
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: The additional work, hardware and outage times required to resolve
    the PPC incompatibility were scoped and costed; the revised scope was incorporated
    into the project budget with risks managed accordingly, though replacement of
    the PPC OEM was required.
