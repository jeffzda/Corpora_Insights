  what_happened: GFM inverter implementation introduced additional costs compared
    to conventional GFL inverters, including higher inverter capital costs for advanced
    features such as overload capability, and added costs for grid connection approval,
    installation, and commissioning due to the increased complexity. At the time of
    the report, these additional costs were not offset by market revenues for GFM
    services.
