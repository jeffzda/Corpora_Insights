  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: '2015'
  project_name: Solar Resource Mapping for High Prospectively Regions (Geoscience
    Australia)
  what_happened: Geoscience Australia delivered the AUD 5.5M Solar Resource Mapping
    project, producing the Australian Solar Energy Information System, improving satellite
    solar radiation models, and deploying eight additional ground monitoring stations.
    Future maintenance of the web platform was uncertain due to absence of ongoing
    funding at project close.
  lesson_learnt: Resource mapping and data infrastructure projects must include a
    funded ongoing maintenance plan at the outset — without committed post-project
    funding, valuable solar data platforms risk degrading or becoming unavailable
    after the project concludes.
