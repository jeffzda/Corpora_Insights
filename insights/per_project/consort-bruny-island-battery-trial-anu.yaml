- record_id: ARENA-DLV-58805
  source_title: 'DER Customer Insights: The Customer Journey'
  publish_date: 2020-07
  project_name: CONSORT Bruny Island Battery Trial (ANU)
  what_happened: ANU's CONSORT Trial found that providing a suite of technology type
    and billing option choices was daunting for prospective customers, contributing
    to lower acquisition rates.
  lesson_learnt: Limit the number of choices offered to prospective DER customers
    during acquisition — presenting too many technology or pricing options leads to
    decision paralysis and reduced uptake; simple brochures focused on benefits outperform
    comprehensive option menus.
