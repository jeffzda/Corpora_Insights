- record_id: ARENA-DLV-58103
  source_title: Commercial Demonstration of Lignocellulosics to (Unique) Stable Bio-Crude Oil
  publish_date: '2013-03-20'
  project_name: Commercial Demonstration of Lignocellulosics to Stable Bio-Crude Oil (Licella Cat-HTR)
  what_happened: Feedstock testing across radiata pine, miscanthus (banna grass), and macro algae demonstrated that the Cat-HTR technology could be tuned to process any consistent biomass feedstock supply,
    establishing high feedstock flexibility as a commercial attribute.
  lesson_learnt: Conducting systematic multi-feedstock testing at demonstration scale is essential for bioenergy technology commercialisation — demonstrating feedstock flexibility early de-risks supply
    chain assumptions and broadens the addressable market for potential offtake and JV partners.
  issue_severity: none
  project_type: industrial decarbonisation
