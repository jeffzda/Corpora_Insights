- record_id: ARENA-DLV-58101
  source_title: Commercial Demonstration of Lignocellulosics to (Unique) Stable Bio-Crude Oil
  publish_date: '2013-03-20'
  project_name: Commercial Demonstration of Lignocellulosics to Stable Bio-Crude Oil (Licella Cat-HTR)
  what_happened: Licella successfully designed, constructed, and operated a 10-times scale-up commercial demonstration plant (CDP) for its Catalytic Hydrothermal Reactor (Cat-HTR) technology at Somersby,
    NSW, opened in December 2011, proving the underlying economic assumptions for further scale-up were sound.
  lesson_learnt: A stepwise scale-up strategy — from pilot to 10× demonstration before committing to full commercial scale — allowed technical and economic assumptions to be validated at each stage, reducing
    investment risk and enabling a credible case for the next scale-up step.
