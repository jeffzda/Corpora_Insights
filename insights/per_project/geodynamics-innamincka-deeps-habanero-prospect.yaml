  secondary_failure_mode: execution & logistics
  intervention_note: Geodynamics drilled the replacement Habanero-4 well and successfully
    extended the previously stimulated reservoir through a major hydraulic stimulation
    program, establishing a closed circulation loop with Habanero-1 for the 1 MW pilot
    plant commissioned in early 2013.
