- record_id: ARENA-DLV-72001
  source_title: Australian Energy Resource Assessment — Second Edition, 2014
  publish_date: '2014'
  project_name: Geodynamics Innamincka Deeps — Habanero Prospect
  what_happened: The Habanero-3 well suffered a casing failure due to incomplete cement
    placement between steel casing and surrounding rock, causing loss of the well
    just prior to establishment of a 1 MW pilot plant and requiring drilling of a
    replacement well (Habanero-4).
  lesson_learnt: In deep EGS geothermal wells, cement placement quality between steel
    casing and surrounding rock is critical — incomplete cementing caused casing failure
    and loss of the production well, requiring a costly replacement drilling program
    before pilot plant commissioning could proceed.
