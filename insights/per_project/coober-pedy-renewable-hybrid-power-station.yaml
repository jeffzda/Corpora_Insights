- record_id: ARENA-DLV-4765
  source_title: Insights From The Portfolio of Projects Funded Under The Regional
    Australia's Renewables Program
  publish_date: 2017-03
  project_name: Coober Pedy Renewable Hybrid Power Station
  what_happened: The Coober Pedy off-grid community project required six distinct
    technologies — solar PV, wind, battery storage, two flywheels on fast-start diesel,
    a dynamic resistor, and an integrating control system — to achieve stable high-renewable-fraction
    operation, representing one of the highest technology-count and cost-per-watt
    projects in the portfolio.
  lesson_learnt: Off-grid community projects targeting high renewable fractions in
    weak or isolated grids require investment in grid stability technologies (flywheels,
    dynamic resistors, integrated control systems) beyond the renewable generation
    assets themselves — these stability technologies are non-optional and must be
    costed and contracted as core project scope.
