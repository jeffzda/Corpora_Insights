  evidence_excerpt: Integrated solutions require large, cross-functional projects
    which cross business units. Onboarding subject matter experts across functionalities
    is key to enabling the project. Onboarding of site operations personnel & technical
    service providers early is crucial to ensure smooth access, facilitating the validation
    of site suitability and avoiding delays.
