- record_id: ARENA-DLV-51480
  source_title: UTS - Flexible Demand State of Play in Australia - Report
  publish_date: 2024-05
  project_name: Shell Energy – Smart Energy Hubs Deployment
  what_happened: Shell Energy found that integrated whole-of-site energy hub deployments
    require large cross-functional projects that cross business units, and that onboarding
    both subject matter experts across functions and site operations personnel early
    was crucial to avoid access delays and site feasibility problems.
  lesson_learnt: Integrated multi-technology site deployments (solar, battery, EV,
    HVAC-R in a single site) must begin cross-functional and site operations onboarding
    at the earliest opportunity — failure to do so creates access delays, late-stage
    feasibility failures, and coordination bottlenecks that are expensive to resolve
    during construction.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: development/design
