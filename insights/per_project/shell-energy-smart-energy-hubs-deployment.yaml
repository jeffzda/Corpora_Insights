- record_id: ARENA-DLV-51479
  source_title: UTS - Flexible Demand State of Play in Australia - Report
  publish_date: 2024-05
  project_name: Shell Energy – Smart Energy Hubs Deployment
  what_happened: Shell Energy found that most DNSPs would not provide indicative network
    export capacity until a formal grid connection application was submitted, preventing
    efficient battery sizing for co-located storage-and-export configurations at commercial
    sites.
  lesson_learnt: Battery storage sizing for commercial sites with export capability
    is materially hindered by DNSPs' reluctance to provide preliminary export capacity
    information before a formal connection application; program designers and proponents
    should seek early preliminary feedback from DNSPs that do provide it, and advocate
    for pre-application information sharing as a standard DNSP practice.
