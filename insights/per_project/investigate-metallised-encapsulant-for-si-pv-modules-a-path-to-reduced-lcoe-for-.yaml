- record_id: ARENA-DLV-48107
  source_title: ARENA-Funded Cutting Edge Research in Photovoltaics
  publish_date: 2019-09
  project_name: 'Investigate Metallised Encapsulant for Si PV Modules: A Path to Reduced LCOE for PV (2017/RND002)'
  what_happened: Module fabrication costs were found to be increasing considerably over time as a proportion of total PV system costs. The team demonstrated that metallised encapsulants — metal conductors
    formed directly in polymer encapsulants — can achieve comparable module efficiencies (19.95%) to state-of-the-art 5BB PERC modules while offering multiple co-benefits including reduced silver use, lower
    thermomechanical stress, and improved optical performance.
  lesson_learnt: Rising module fabrication costs in the PV supply chain create an opportunity for novel interconnection architectures such as metallised encapsulants; R&D programs targeting LCOE reduction
    should track the evolving cost structure of the module supply chain to ensure research priorities remain aligned with the largest cost drivers.
