- record_id: ARENA-DLV-64418
  source_title: Distributed Energy Resources (DER) Integration Project Contribution Assessment
  publish_date: 2019-03
  project_name: Alkimos Beach Energy Storage Project (Synergy)
  what_happened: Synergy's Alkimos Beach trial ($3.31m, commenced August 2014) installed smart meters, solar hot water, solar PV, and a 250kW Community Energy Storage System (CESS) across 100 residences
    in Western Australia, using the CESS to absorb exported solar PV and reduce customer peak demand. The project aimed to report on the extent to which 100% of instantaneous household load was being achieved.
  lesson_learnt: Community-scale battery storage co-located with distributed solar PV can shift generation to peak demand periods and approach 100% instantaneous self-sufficiency at the zone substation
    level — projects should measure and report instantaneous demand coverage as a headline metric to build evidence for this outcome.
