  source_title: Ultra Fast Charging Data Analysis Webinar Materials
  publish_date: 2021-08
  project_name: Chargefox Electric Vehicle Charging Network Project / National Ultrafast
    EV Charging Infrastructure Network
  what_happened: Urban sites generally installed fewer hoses per station than regional
    sites, resulting in higher electrical and equipment cost per hose for urban sites
    compared to the larger regional sites. Regional locations also had greater site
    costs, correlating with larger site size.
  lesson_learnt: Urban ultra-fast charging sites face a structural cost disadvantage
    per hose because they tend to be smaller configurations — network planners should
    account for this when comparing urban and regional site economics, and consider
    increasing hose counts at urban sites to reduce unit costs where site constraints
    allow.
