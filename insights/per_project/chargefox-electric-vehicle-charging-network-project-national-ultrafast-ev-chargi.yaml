  what_happened: Analysis of five Evie Networks sites found that site peak demand
    during the network peak period ranged from 41% to 100% of the site's annual maximum
    demand, with an average around 60%. One out of five sites peaked at 100% of annual
    maximum demand during the network peak (3–9pm summer weeknights).
  lesson_learnt: Ultra-fast charging sites have the potential to drive significant
    upstream network upgrades — while many sites may not coincide with network peaks,
    the worst-case site can reach 100% of peak demand during the network peak period;
    network impact assessments must be conducted for each site individually rather
    than relying on average behaviour.
