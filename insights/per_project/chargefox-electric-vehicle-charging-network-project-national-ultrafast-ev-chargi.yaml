  source_title: Insights from Ultra-Fast Charging Network Data (Update)
  publish_date: 2023-08
  project_name: Chargefox Electric Vehicle Charging Network Project / National Ultrafast
    EV Charging Infrastructure Network
  what_happened: Most fast-charging sites did not charge at their rated charger capacity;
    actual vehicle charging rates were constrained by the maximum acceptance rate
    of the vehicle rather than the charger's rated output, resulting in low load factors
    across the network (generally below 3%).
  lesson_learnt: Fast-charging site capacity should be specified based on realistic
    vehicle acceptance rates rather than charger nameplate capacity — oversizing to
    rated capacity inflates connection and demand charge costs without delivering
    proportional throughput, distorting business-case economics.
