  what_happened: COVID-19 lockdowns in 2020 materially reduced utilisation at ultra-fast
    charging sites. However, utilisation recovered when lockdowns lifted and had increased
    to approximately 2x pre-2020 COVID lockdown levels by early 2021.
  lesson_learnt: External demand shocks such as pandemic lockdowns can significantly
