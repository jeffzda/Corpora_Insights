- record_id: ARENA-DLV-35807
  source_title: Ultra Fast Charging Data Analysis Webinar Materials
  publish_date: 2021-08
  project_name: Chargefox Electric Vehicle Charging Network Project / National Ultrafast
    EV Charging Infrastructure Network
  what_happened: Analysis of Evie Networks electricity billing data showed that the
    cost per kWh of electricity fell as monthly energy consumption increased, meaning
    that sites with low utilisation face significantly higher running costs per kWh
    than highly utilised sites. Early-stage sites with low EV uptake therefore incurred
    disproportionately high electricity costs.
  lesson_learnt: Electricity running costs for public EV charging sites are highly
    sensitive to utilisation — financial models for new sites must stress-test low-utilisation
    scenarios as the cost per kWh can be substantially higher than at mature sites;
    siting decisions and demand stimulation strategies should be factored in early.
