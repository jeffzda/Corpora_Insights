  project_name: Chargefox Electric Vehicle Charging Network Project / National Ultrafast
    EV Charging Infrastructure Network
  what_happened: Comparison of tariff structures across Evie Networks sites found
    that time-of-use (ToU) bills were higher per kWh than flat tariff bills, maximum
    demand (MD) tariffs were higher than other tariffs at the same monthly energy
    consumption level, and flat tariffs were the lowest. Costs under ToU and MD tariffs
    appeared to converge with flat tariffs only at higher energy consumption volumes.
  lesson_learnt: Tariff selection materially affects electricity running costs for
    public EV charging sites, particularly at low utilisation — flat tariffs deliver
    the lowest per-kWh cost in early-stage deployment; MD and ToU tariffs may only
    become competitive once sites reach higher sustained utilisation levels.
