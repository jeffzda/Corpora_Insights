  what_happened: Capex costs for the most common 4-hose configuration varied by almost
    50% between sites, even though the sites were essentially the same type of charging
    installation. Site configuration, existing infrastructure, geotechnical conditions,
    and remediation requirements were identified as key drivers of this variance.
