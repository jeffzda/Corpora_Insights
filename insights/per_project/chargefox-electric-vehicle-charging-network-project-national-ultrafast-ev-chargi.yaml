  source_title: Ultra Fast Charging Data Analysis Webinar Materials
  publish_date: 2021-08
  project_name: Chargefox Electric Vehicle Charging Network Project / National Ultrafast
    EV Charging Infrastructure Network
  what_happened: Average charging session duration across all sites was approximately
    20 minutes, corresponding to charging to approximately 80% state of charge. Regional
    sessions were longer on average (~25 minutes, ~20 kWh) than urban sessions (~23
    minutes, ~18 kWh). Drivers generally did not leave vehicles at charging spots
    significantly longer than needed.
  lesson_harnt: Design ultra-fast charging site layouts and forecasting models around
    a ~20-minute average session duration and ~80% charge target — regional sites
    should be designed for slightly longer sessions; the low overstay rate reduces
    the need for active occupancy management at current utilisation levels.
  lesson_learnt: Design ultra-fast charging site layouts and forecasting models around
    a ~20-minute average session duration and ~80% charge target — regional sites
    should be designed for slightly longer sessions; the low overstay rate reduces
    the need for active occupancy management at current utilisation levels.
