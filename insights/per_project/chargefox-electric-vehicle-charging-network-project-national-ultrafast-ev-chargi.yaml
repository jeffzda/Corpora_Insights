- record_id: ARENA-DLV-35801
  source_title: Ultra Fast Charging Data Analysis Webinar Materials
  publish_date: 2021-08
  project_name: Chargefox Electric Vehicle Charging Network Project / National Ultrafast
    EV Charging Infrastructure Network
  what_happened: Analysis of capex data across ChargeFox and Evie Networks ultra-fast
    charging sites found that larger configurations (6 and 8 hose sites) delivered
    significantly lower cost per hose than 4-hose sites, with economies of scale achievable
    across all key cost categories including charging equipment, electrical works,
    and site costs.
  lesson_learnt: Plan for larger site configurations where demand warrants it — the
    data shows a decreasing marginal cost per additional hose, meaning that deploying
    6- or 8-hose sites rather than 4-hose sites materially reduces capital cost per
    outlet and should be factored into network rollout strategy.
