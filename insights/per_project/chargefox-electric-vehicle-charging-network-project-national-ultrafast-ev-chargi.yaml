  source_title: Insights from Ultra-Fast Charging Network Data (Update)
  publish_date: 2023-08
  project_name: Chargefox Electric Vehicle Charging Network Project / National Ultrafast
    EV Charging Infrastructure Network
  what_happened: Electricity cost per kWh at fast-charging sites fell significantly
    as monthly energy consumption increased, but cost reduction flattened out at approximately
    60 MWh per annum, indicating a floor in achievable cost reduction through utilisation
    alone.
  lesson_learnt: Fast-charging site business cases should model the cost-per-kWh floor
    at around 60 MWh/pa consumption — operators cannot expect continued cost reductions
    beyond this threshold purely through volume growth, and must factor this into
    long-run unit economics and tariff design.
