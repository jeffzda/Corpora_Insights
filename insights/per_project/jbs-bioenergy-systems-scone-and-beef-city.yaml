- record_id: ARENA-DLV-2575
  source_title: 'ARENA Insights Hot Decarbonisation Webinar: Renewable Heat and Energy Efficiency at Industrial Facilities'
  publish_date: 2024-10
  project_name: JBS Bioenergy Systems — Scone and Beef City
  what_happened: JBS invested $11.1 million to develop bioenergy systems at its Scone and Beef City (Toowoomba) meat processing facilities in partnership with Energy360, targeting biogas production of 64
    TJ/yr at Beef City and 48 TJ/yr at Scone, with expected natural gas bill savings of more than $1.2M and $1.25M per annum respectively, and a combined CO2 reduction target of 63,000 t per annum.
  lesson_learnt: Biogas recovery from meat processing wastewater and organic waste at large-scale facilities can deliver commercially attractive returns — co-development with a specialist biogas handling
    partner is an effective delivery model for first installations in this sector.
