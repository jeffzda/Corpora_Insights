- record_id: ARENA-DLV-72269
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: '2015'
  project_name: SA Power Networks DER Modelling Project (Project ID 304)
  what_happened: SA Power Networks modelled the impact of four DER categories (PV,
    EVs, controllable loads, and battery storage) on LV and SWER network quality of
    supply, finding that on a high proportion of older LV feeders, voltage regulation
    requirements limit acceptable PV penetration to around 25% of customers.
  lesson_learnt: Network planners should model DER impacts on older LV feeders before
    allowing high PV penetration — voltage regulation constraints on a high proportion
    of older overhead and underground feeders limit acceptable PV penetration to around
    25% of customers without mitigation measures.
