- record_id: ARENA-DLV-49207
  source_title: Next generation silicon solar cells >26% efficiency in mass production
    - Interim Public Dissemination Report
  publish_date: '2024-05-31'
  project_name: Next generation silicon solar cells >26% efficiency in mass production
  what_happened: Ultra-thin poly-Si layers (3–5 nm) with barrier layers were demonstrated
    to be highly compatible with existing TOPCon production line equipment (including
    ALD tools already deployed at scale), indicating a low-disruption path to adoption,
    though upfront R&D costs were identified as substantial.
  lesson_learnt: Where a novel cell architecture relies on fabrication tools already
    embedded in existing production lines (such as ALD for barrier layer deposition
    in TOPCon lines), the technology transition risk is materially lower; a comprehensive
    cost-benefit analysis comparing retooling costs against processing time and material
    savings should be completed before scale-up commitment.
