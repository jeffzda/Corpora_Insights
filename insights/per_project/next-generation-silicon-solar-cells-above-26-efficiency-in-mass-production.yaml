- record_id: ARENA-DLV-49204
  source_title: Next generation silicon solar cells >26% efficiency in mass production
    - Interim Public Dissemination Report
  publish_date: '2024-05-31'
  project_name: Next generation silicon solar cells >26% efficiency in mass production
  what_happened: Inkjet-printed localised polysilicon dopant width measured 52.6 µm
    against a project milestone target of 50 µm — a 5% variance — meaning the milestone
    was technically missed, though the approach was assessed as among the most promising
    routes towards commercial application.
  lesson_learnt: When milestone targets for novel patterning technologies are set
    at a specific dimensional tolerance, build in a defined acceptable variance band;
    a result within 5% of target for an emerging process represents functional success
    and should not be treated equivalently to a substantive milestone failure.
