  publish_date: '2024-05-31'
  project_name: Next generation silicon solar cells >26% efficiency in mass production
  what_happened: Internal approval processes caused significant unexpected delays
    to the procurement of a PV Module Outdoor Monitoring Station, beyond what the
    project team had anticipated at the planning stage.
  lesson_learnt: Engage with internal stakeholders at the application phase — even
    before project approval is confirmed — to ensure all necessary internal approvals
    and requirements are understood early and do not create downstream procurement
    delays.
