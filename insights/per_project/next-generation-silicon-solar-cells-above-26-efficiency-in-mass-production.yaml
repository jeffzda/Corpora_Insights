  source_title: Next generation silicon solar cells >26% efficiency in mass production
    - Interim Public Dissemination Report
  publish_date: '2024-05-31'
  project_name: Next generation silicon solar cells >26% efficiency in mass production
  what_happened: Barrier layer contact resistivity measurements for AZO and TiO2 on
    ultra-thin polysilicon came in slightly above the milestone target of 5 mΩcm²,
    meaning the milestone was technically missed, though the technology was still
    assessed as viable for full-area and large-area rear contact applications.
  lesson_learnt: When setting milestone targets for novel material stacks, distinguish
    between functional viability thresholds and aspirational performance targets —
    a result marginally above target may still represent commercially applicable performance,
    and this nuance should be captured in reporting to avoid misclassifying progress.
