  publish_date: '2024-05-31'
  project_name: Next generation silicon solar cells >26% efficiency in mass production
  what_happened: Inkjet printing of localised poly-Si dopant contacts was demonstrated
    to be largely compatible with existing silicon solar cell production lines, with
    most required equipment integrable with minimal modification, though co-doping
    remained an unresolved technical problem requiring further development before
    mass production readiness.
  lesson_learnt: Assess production-line compatibility early in the R&D-to-commercialisation
    pathway — where a new process is compatible with existing equipment and handles
    (as inkjet printing largely is with TOPCon lines), the transition risk and capital
    requirement are substantially lower, but residual process problems such as co-doping
    must be resolved before committing to scale-up.
