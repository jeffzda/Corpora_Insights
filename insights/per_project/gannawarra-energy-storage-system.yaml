- record_id: ARENA-DLV-2955
  source_title: Large-Scale Battery Storage Knowledge Sharing Report
  publish_date: 2019-09
  project_name: Gannawarra Energy Storage System
  what_happened: Because GESS is a distribution-connected asset, it faces estimated
    demand charges of over $500,000 per annum, compared to a transmission-connected
    asset, representing a significant and ongoing operational cost disadvantage.
  lesson_learnt: Distribution-connected LSBS projects face materially higher demand
    charges than transmission-connected equivalents — estimated at over $500k per
    annum for Gannawarra — and project business cases should explicitly model and
    mitigate this cost, for example by scheduling battery charging during solar generation
    hours to reduce DNSP demand peaks.
