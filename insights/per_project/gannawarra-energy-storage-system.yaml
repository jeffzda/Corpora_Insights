- record_id: ARENA-DLV-2956
  source_title: Large-Scale Battery Storage Knowledge Sharing Report
  publish_date: 2019-09
  project_name: Gannawarra Energy Storage System
  what_happened: GESS was unable to use the battery for local curtailment management
    because, once registered as a scheduled market generator and customer, the system
    can only be operated through AEMO market bidding and centralised dispatch — it
    cannot be independently controlled to manage curtailment caused by local network
    constraints.
  lesson_learnt: Under the existing NEM registration framework, LSBS registered as
    scheduled generators cannot be independently controlled to manage local network
    curtailment — project developers intending to use co-located batteries for curtailment
    management must investigate registration options or regulatory solutions (such
    as the proposed bi-directional resource provider category) before committing this
    function to the business case.
  issue_severity: moderate
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: project developer
  delay_category: null
  failure_mode: regulatory & approvals
  outcome_class: partial success
  secondary_failure_mode: poor scoping
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id003
  - 12
  evidence_excerpt: inability of the project to make use of the LSBS system for the
    management of curtailment in a local network due to registration of assets as
    independent generating units. Since the LSBS system is registered as a scheduled
    market generator and customer, its operation is via market bidding and centralised
    AEMO control. Under the existing framework the LSBS system is not able to operate
    outside of this AEMO dispatch and therefore cannot be independently controlled
    to manage curtailment caused by local constraints.
