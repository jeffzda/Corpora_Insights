- record_id: ARENA-DLV-2954
  source_title: Large-Scale Battery Storage Knowledge Sharing Report
  publish_date: 2019-09
  project_name: Gannawarra Energy Storage System
  what_happened: Retrofitting the GESS battery behind the existing solar farm's point
    of connection introduced multiple unforeseen regulatory and commercial complexities,
    including the need for a direct AGC connection to AEMO (not typically available
    at DNSP substations), a parent/child metering arrangement, movement of GPS enforcement
    points, DLF redetermination, GPS renegotiation under new FIA rules, and establishment
    of a private registered network.
  lesson_learnt: Connecting a battery behind an existing solar farm's substation connection
    point introduces a range of novel regulatory, metering and GPS complexities that
    have not been resolved before in Australia; future co-located retrofit projects
    should engage AEMO and the DNSP early to understand registration, metering and
    AGC requirements specific to distribution-connected assets before finalising the
    connection design.
  issue_severity: major
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: grid connection/system studies
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: unvalidated integration
  intervention_note: The project resolved the AGC connection complexity and enabled
    regulation FCAS; a private registered network was established to connect both
    assets and manage commercial risk.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id001
  - 12
  - 13
  evidence_excerpt: 'The retrofit of the battery to the solar farm raised a number
    of issues, not addressed before in Australia including: in order to provide regulation
    FCAS, a direct Automatic Generation Control (AGC) connection to AEMO is required,
    which is not typically available at distribution network substations... locating
    the connection point for the new asset (battery) behind the existing substation
    connection point for the solar farm introduced several complexities in both the
    physical connection and registration arrangements.'
