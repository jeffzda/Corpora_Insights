- record_id: ARENA-DLV-2978
  source_title: Large-Scale Battery Storage Knowledge Sharing Report
  publish_date: 2019-09
  project_name: Gannawarra Energy Storage System
  what_happened: The GESS was the first LSBS retrofit to an existing or under-construction
    solar farm connected behind the solar farm's existing point of connection, establishing
    a precedent for co-located hybrid registration arrangements in Victoria, with
    the project now commissioned and regulation FCAS enabled.
  lesson_learnt: The Gannawarra project has established a market precedent for registering
    and connecting a battery behind a solar farm's existing point of connection, including
    parent/child metering and private registered network structures — future co-located
    retrofit projects can leverage this precedent to reduce regulatory uncertainty,
    though the complexity of the process should not be underestimated.
  issue_severity: none
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: no material delay stated
