- record_id: ARENA-DLV-20702
  source_title: Demand Response Short Notice RERT Trial Year 3 Report
  publish_date: 2021-10
  project_name: DR SN RERT Trial
  what_happened: Bushfires in Victoria and New South Wales during late 2019 and early
    2020 reduced available DR capacity for several participants, particularly those
    with customers in critical infrastructure roles such as water utilities and telecommunications
    companies, who could not curtail load during emergency response operations.
  lesson_learnt: Participants should identify and exclude — or separately classify
    — customers in critical infrastructure sectors (water, telecoms, emergency services)
    from DR portfolios intended for emergency reserve activation, as these customers
    will be unavailable precisely when RERT is most likely to be needed.
