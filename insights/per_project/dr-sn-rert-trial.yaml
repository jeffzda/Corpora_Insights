- record_id: ARENA-DLV-20704
  source_title: Demand Response Short Notice RERT Trial Year 3 Report
  publish_date: 2021-10
  project_name: DR SN RERT Trial
  what_happened: COVID-19 limited participants' ability to recruit new customers into
    DR portfolios and reduced existing C&I DR capacity when businesses shut down,
    while stay-at-home orders reduced residential customers' flexibility to respond
    to DR tests during 2020.
  lesson_learnt: DR portfolio capacity planning should include contingency for external
    shocks that simultaneously reduce C&I operational loads (making DR unavailable)
    and alter residential consumption patterns; over-recruitment buffers and diversification
    across customer segments and industries provide resilience against such systemic
    disruptions.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
