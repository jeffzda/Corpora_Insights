- record_id: ARENA-DLV-20701
  source_title: Demand Response Short Notice RERT Trial Year 3 Report
  publish_date: 2021-10
  project_name: DR SN RERT Trial
  what_happened: The three-year DR SN RERT Trial (2017–2020) successfully delivered
    more demand response capacity than contracted in every program year and every
    testing period, with Year 3 delivering 198.1 MW against a contracted 180 MW in
    Period 5 (110.1%) and 189.8 MW against 184 MW in Period 6 (103.2%), despite bushfire
    and COVID-19 disruptions.
  lesson_learnt: Aggregated demand response from a diverse portfolio of residential
    and C&I participants is a viable and reliable source of RERT capacity — over-delivery
    relative to contracted volumes is achievable even under significant external disruptions
    such as bushfires and a pandemic, provided participants maintain sufficient buffer
    recruitment.
