- record_id: ARENA-DLV-36905
  source_title: Downstream Fish Passage Criteria for Hydropower and Irrigation
  publish_date: 2014-05
  project_name: Downstream Fish Passage Criteria for Hydropower and Irrigation Infrastructure
    in the Murray–Darling Basin
  what_happened: Experiments on juvenile fish exposed tail-first to fluid shear (the
    natural orientation fish adopted in the test flume) showed little mortality, whereas
    the scientific literature showed that head-first exposure at comparable shear
    levels caused severe injury and mortality in other studies. This means the study's
    juvenile shear thresholds may underestimate actual risk at infrastructure where
    fish are forced through in an uncontrolled orientation.
  lesson_learnt: When designing fish-passage risk assessments for hydropower or weir
    infrastructure, ensure that shear tolerance experiments use both head-first and
    tail-first fish orientations, as orientation alone can reduce mortality from ~100%
    to ~10% at the same strain rate — and infrastructure design cannot control fish
    orientation during entrainment.
  issue_severity: moderate
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: data/validation/testing
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Report recommends further shear testing with head-first fish
    orientation to establish whether juvenile shear guidelines need to be added.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: pumped hydro
  source_pages: &id005
  - 72
  - 74
  evidence_excerpt: The importance of orientation is illustrated nicely by Neitzel
    et al. (2004), who found that mortality of Chinook salmon was reduced from 100%
    to 10% if the fish was exposed tail first to strain rates of ~1000 cm s-1 cm-1,
    rather than head first. The implication of this for our study is that we may not
    have gained a full appreciation for the impact of fluid shear on juveniles of
    the species studied.
  confidence_note: delay_category data/validation/testing used here as the finding
    is about a testing methodology limitation, not a project delivery delay.
