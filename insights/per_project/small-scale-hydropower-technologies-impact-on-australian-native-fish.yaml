- record_id: ARENA-DLV-36906
  source_title: Downstream Fish Passage Criteria for Hydropower and Irrigation
  publish_date: 2014-05
  project_name: Downstream Fish Passage Criteria for Hydropower and Irrigation Infrastructure
    in the Murray–Darling Basin
  what_happened: 'The study found that generalised rules of thumb from North American
    physostomous species (e.g., that physoclistous fish are more susceptible to swim
    bladder rupture than physostomous fish) did not hold for MDB species: Murray cod
    (a physoclist) required greater decompression before rupture than Chinook salmon
    (a physostome), suggesting swim bladder morphology and strength may be more important
    than fish type in determining rupture thresholds.'
  lesson_learnt: Infrastructure engineers and environmental consultants should not
    apply fish passage decompression thresholds from North American species to Australian
    MDB species without species-specific validation — generalised rules from overseas
    literature may be significantly non-conservative or over-conservative for native
    Australian species.
