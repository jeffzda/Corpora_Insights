    weirs regulating flows, and that Australia ranks in the top 15 countries globally
    for number of large dams (517 large dams). The cumulative effect of this infrastructure
    on downstream fish migration had not been systematically assessed from a hydraulic-tolerance
    perspective prior to this study.
