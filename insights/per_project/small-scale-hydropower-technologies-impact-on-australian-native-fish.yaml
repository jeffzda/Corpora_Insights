- record_id: ARENA-DLV-36903
  source_title: Downstream Fish Passage Criteria for Hydropower and Irrigation
  publish_date: 2014-05
  project_name: Downstream Fish Passage Criteria for Hydropower and Irrigation Infrastructure
    in the Murray–Darling Basin
  what_happened: Laboratory decompression experiments found that juvenile MDB fish
    (Murray cod and silver perch) showed high rates of internal barotrauma injury
    — including swim bladder rupture, haemorrhaging and emphysema — despite few dying
    immediately after simulated infrastructure passage. Many such injuries are known
    to lead to eventual mortality in other species, but the long-term survival implications
    for MDB species had not been established.
  lesson_learnt: Designers and regulators of mini-hydropower and irrigation infrastructure
    should not rely on immediate post-passage mortality counts as a measure of fish
    welfare impacts; internal barotrauma injuries that cause delayed death will be
    missed, and exposure pressures should not fall below 60% of acclimation pressure
    for juvenile physoclistous fish.
