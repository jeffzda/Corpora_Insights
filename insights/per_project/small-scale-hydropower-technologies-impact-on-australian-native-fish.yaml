  what_happened: The study established that the long-term survival consequences of
    non-lethal barotrauma injuries in eggs and larvae (swim bladder deflation, haemorrhage)
    remained unknown at the 24-hour experimental endpoint used, and that larvae forced
    to 'burp' gas during decompression may never regain the capacity to refill their
    swim bladder, with potential consequences for growth, development and survival
    beyond the study period.
  lesson_learnt: Environmental impact assessments for mini-hydropower and irrigation
    infrastructure should not rely on 24-hour post-passage survival as the sole fish
    welfare metric; longer-term monitoring of larvae through to juvenile metamorphosis
    is needed to capture delayed mortality and sub-lethal developmental impacts from
    barotrauma, otherwise infrastructure approvals may underestimate actual ecological
    risk.
