- record_id: ARENA-DLV-36904
  source_title: Downstream Fish Passage Criteria for Hydropower and Irrigation
  publish_date: 2014-05
  project_name: Downstream Fish Passage Criteria for Hydropower and Irrigation Infrastructure
    in the Murray–Darling Basin
  what_happened: Prior to this study, the mechanisms causing fish injury and mortality
    at MDB irrigation weirs and mini-hydropower infrastructure were poorly understood,
    making it difficult to evaluate sustainability of infrastructure developments
    or to develop engineering guidelines. More than 80% of main channel weirs in key
    MDB rivers used 'undershot' designs associated with >90% larval mortality in golden
    and silver perch and >50% in Murray cod, but the relative contribution of decompression
    versus fluid shear was unquantified.
  lesson_learnt: Infrastructure developers and regulators in the MDB should not approve
    or construct new mini-hydropower or undershot weir designs without first quantifying
    the fluid shear and decompression profiles at the proposed structure and comparing
    them against the species-specific thresholds established in this report, to avoid
    creating structures that cause legally significant fish mortality.
