  source_title: Downstream Fish Passage Criteria for Hydropower and Irrigation
  publish_date: 2014-05
  project_name: Downstream Fish Passage Criteria for Hydropower and Irrigation Infrastructure
    in the Murray–Darling Basin
  what_happened: 'Laboratory experiments established that eggs of MDB fish species
    (golden perch and silver perch) are highly susceptible to fluid shear stress:
    100% mortality of golden perch eggs and >40% mortality of silver perch eggs occurred
    once strain rates exceeded approximately 150 cm s-1 cm-1. No equivalent threshold
    had previously been defined for MDB species.'
  lesson_learnt: Mini-hydropower and irrigation infrastructure designers should ensure
    that fluid shear at locations where fish eggs may be entrained does not exceed
    150 cm s-1 cm-1; exceeding this threshold will cause high egg mortality, creating
    a regulatory and ecological risk for projects in MDB catchments.
