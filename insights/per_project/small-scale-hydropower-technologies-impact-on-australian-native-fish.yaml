- record_id: ARENA-DLV-36914
  source_title: Downstream Fish Passage Criteria for Hydropower and Irrigation
  publish_date: 2014-05
  project_name: Downstream Fish Passage Criteria for Hydropower and Irrigation Infrastructure
    in the Murray–Darling Basin
  what_happened: The study identified that field validation of laboratory-derived
    fish passage models had not been undertaken at any Australian mini-hydropower
    facility, meaning that operational thresholds derived from laboratory experiments
    could not be confirmed as representative of real-world passage conditions. Autonomous
    hydraulic sensor (Sensor Fish) data from overseas suggested mean nadir pressures
    at Kaplan turbines of ~87 kPa but with extremes as low as 7 kPa — a range that
    would produce very different injury outcomes under the laboratory-derived models.
  lesson_learnt: New mini-hydropower projects should include a post-commissioning
    field validation program releasing live fish alongside autonomous hydraulic sensors
    (Sensor Fish) at the operational structure to verify that hydraulic conditions
    at the installed facility stay within the laboratory-derived thresholds, before
    assuming that design specifications translate to acceptable fish passage outcomes
    in operation.
