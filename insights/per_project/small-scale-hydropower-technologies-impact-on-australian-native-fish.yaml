  what_happened: Laboratory experiments found that 9–13-days-post-hatch Murray cod
    larvae were extremely susceptible to fluid shear mortality, with a lethal shear
    threshold (LS10) of only 6 cm s-1 cm-1 — far lower than any other age class or
    species tested. This vulnerability arises from a large, exposed yolk sac present
    during active downstream drift.
  lesson_learnt: Hydropower and irrigation infrastructure operators in Murray cod
    spawning areas should implement operational restrictions (e.g., curtailing operation
    during the ~6-week Murray cod spawning window) or install intake screens, because
    shear levels acceptable for other species and life stages will cause near-total
    mortality of 9–13 DPH Murray cod larvae at strain rates above 6 cm s-1 cm-1.
