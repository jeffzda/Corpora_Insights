- record_id: ARENA-DLV-36907
  source_title: Downstream Fish Passage Criteria for Hydropower and Irrigation
  publish_date: 2014-05
  project_name: Downstream Fish Passage Criteria for Hydropower and Irrigation Infrastructure
    in the Murray–Darling Basin
  what_happened: The study identified that a significant proportion of MDB infrastructure
    consists of undershot weirs (>80% of main channel weirs in the Murrumbidgee, Macquarie,
    Namoi and Gwydir rivers), and that computational fluid dynamics and field sensor
    measurements confirmed these structures generate elevated shear, turbulence and
    sub-atmospheric pressures. However, an attempt to mitigate fish mortality by adding
    a flow deflector and hydraulic jump actually increased mortality rather than reducing
    it.
  lesson_learnt: Modifying existing irrigation weir hydraulics to reduce fish mortality
    requires understanding which specific hydraulic parameters (shear vs. decompression)
    drive injury before implementing structural changes — applying modifications without
    this understanding can inadvertently worsen outcomes, as demonstrated when a deflector
    and hydraulic jump increased rather than decreased mortality.
  issue_severity: major
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: development/design
