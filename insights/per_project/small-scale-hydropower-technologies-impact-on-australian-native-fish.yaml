  what_happened: 'The study found that susceptibility to fluid shear mortality in
    larvae was highly age-dependent: younger larvae were far more susceptible than
    older ones, and the age at which larvae were tested significantly determined experimental
    outcomes. A generalisation in the prior literature (Cada 1990) that early-life-stage
    fish are not susceptible to shear-induced mortality was based on a very limited
    range of shear values and did not account for age-related variation.'
  lesson_learnt: Environmental impact studies for river infrastructure should test
    fish at multiple developmental stages across a wide range of hydraulic conditions;
    relying on single-age or narrow-range studies to characterise shear risk will
    produce misleading conclusions that may either understate or overstate actual
    risk to migrating larval fish populations.
