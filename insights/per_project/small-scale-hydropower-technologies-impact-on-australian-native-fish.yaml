    safer downstream fish passage than large high-head dams due to lower operating
    head, but that there was little scientific evidence to support this assertion
    for Australian species or low-head installations, creating a knowledge gap that
    had been influencing policy and project approvals.
  lesson_learnt: Project developers and approving agencies should not assume that
    low-head or mini-hydropower installations are inherently fish-safe relative to
    large dams; specific hydraulic measurements (shear and decompression profiles)
    at each proposed site are required, as operating head alone does not reliably
    predict fish passage risk.
