  project_name: Addressing Barriers to Efficient Renewable Integration (UNSW)
  what_happened: UNSW's project ($0.98m, commenced August 2016) investigated frequency control, ancillary services and market rules for systems approaching 100% renewable energy, developing models and tools
    for AEMO and transmission network service providers to facilitate long-term planning for efficient frequency control at NEM-region scale.
  lesson_learnt: System-wide modelling tools for frequency control under high renewable penetration are a critical enabler for building NEM-region-scale confidence — open-sourced models that can be used
    by AEMO and TNSPs multiply the impact of research funding by becoming embedded in ongoing network planning processes.
