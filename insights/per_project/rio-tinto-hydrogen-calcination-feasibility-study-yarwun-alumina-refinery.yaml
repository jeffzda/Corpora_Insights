- record_id: ARENA-DLV-69203
  source_title: A Roadmap for Decarbonising Australian Alumina Refining
  publish_date: 2022-11
  project_name: Rio Tinto Hydrogen Calcination Feasibility Study – Yarwun Alumina Refinery
  what_happened: A $1.2 million technical feasibility study into using hydrogen to replace natural gas in the calcination process at Rio Tinto's Yarwun Alumina Refinery was undertaken, receiving $0.58 million
    in ARENA funding. The study investigated technical feasibility and safety implications of retrofitting hydrogen burners into existing calciners.
  lesson_learnt: Before committing to hydrogen calcination demonstration capital, a dedicated safety and technical feasibility study focused on burner retrofit compatibility is essential — the study design
    should explicitly address the safety implications of hydrogen oxy-firing in existing calciner infrastructure.
