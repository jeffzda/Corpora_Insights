  project_name: Methane Fuel Carrier Project
  what_happened: The cooling tower contactor exhibited volumetric mass transfer 2–3
    times lower than calculated for the 5 M MEA baseline, meaning the original mass
    transfer assumption used for cost benchmarking was not achieved in laboratory
    experiments — however, the low pressure drop (10 times lower) partially offset
    this by reducing energy consumption.
  lesson_learnt: When adapting post-combustion CO2-capture mass transfer correlations
    to ambient air conditions and different contactors, do not rely on calculated
    baseline performance — experimentally validate mass transfer coefficients at representative
    conditions early in the design process, as real performance can be 2–3 times lower
    than calculated values, materially affecting absorber sizing and capital cost.
