- record_id: ARENA-DLV-32853
  source_title: Methane Fuel Carrier Project Final Report
  publish_date: 2021-06
  project_name: Methane Fuel Carrier Project
  what_happened: The project identified that thermal energy required for liquid absorbent
    regeneration in the DAC process could be reduced to zero by integrating a vapour
    compression step with the exothermic methanation process, eliminating the heat
    cost component (previously AU$139/tonne CO2 in the MEA baseline) and achieving
    a 77% electricity reduction for the DAC process.
  lesson_learnt: When co-locating DAC with methanation, design the thermal integration
    from the outset — specifically, a vapour recompression loop on the desorber overhead
    can recover sufficient latent heat from methanation to eliminate external heat
    input to the regeneration circuit, materially reducing both capital and operating
    costs.
