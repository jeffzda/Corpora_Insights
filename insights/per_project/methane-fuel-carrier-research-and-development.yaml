- record_id: ARENA-DLV-0351
  source_title: Methane Fuel Carrier Project September 2020
  publish_date: 2020-09
  project_name: Methane Fuel Carrier Project
  what_happened: Techno-economic assessment of CO2 capture from ambient air using
    a standard MEA-based process yielded a baseline capture cost of AU$2,500/tonne
    CO2 at small scale (0.291 t CO2/hour), with capital cost (47%) and energy requirement
    (35%) as the dominant cost drivers — making the process uneconomic at the scales
    studied.
  lesson_learnt: Direct air capture of CO2 is highly cost-sensitive to scale; project
    developers should not evaluate economic viability of DAC-based fuel production
    pathways at small-scale pilot configurations — costs only approach commercial
    viability (AU$100/t CO2) at approximately 1 million tonnes/annum, requiring explicit
    scale-up plans before investment decisions are made.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: lab/bench
  lifecycle_phase: concept/feasibility
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: Parametric analysis identified amino acid salt solutions and
    low-cost cooling-tower-style contactors as pathways to reduce capture costs to
    AU$1,000/t CO2, with further reduction to AU$100/t CO2 projected at commercial
    scale through process learning analogous to flue-gas CO2 capture development trajectories.
  transferability: moderate
  delay_magnitude: null
  technology_domain: hydrogen
  source_pages: &id001
  - 4
  evidence_excerpt: 'The parametric analysis resulted in an overall capture cost of
    AU$2500/tonne CO2 (range: AU$1500-4500/tonne CO2) for 50% capture from ambient
    air... It was argued that the CO2-capture costs can be reduced to AU$100/tonne
    CO2 (range: AU$40-180/tonne CO2) through the scale-up of the capture process to
    1 million tonnes/annum.'
  confidence_note: issue_severity set to moderate rather than minor — the cost gap
    between small-scale and commercial viability is an order of magnitude and materially
    affects the commercialisation pathway, though project scope was R&D so this was
    an expected finding rather than an unplanned failure.
