- record_id: ARENA-DLV-32854
  source_title: Methane Fuel Carrier Project Final Report
  publish_date: 2021-06
  project_name: Methane Fuel Carrier Project
  what_happened: Using commercially available cooling tower equipment instead of bespoke
    gas/liquid contactors — enabled by operation at ambient temperatures — reduced
    DAC capital costs substantially and, combined with the switch to amino-acid salt
    solutions (eliminating the water wash step), delivered a 62% cost reduction from
    the MEA baseline (from AU$1,859 to AU$705/tonne CO2).
  lesson_learnt: DAC process designers should evaluate commercial cooling tower hardware
    as the primary gas/liquid contactor before specifying custom absorber columns
    — the lower mass transfer performance is offset by significantly lower capital
    cost and pressure drop, and the use of amino-acid salts removes the need for amine
    vapour recovery equipment.
