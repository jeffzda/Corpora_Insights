  project_name: Methane Fuel Carrier Project
  what_happened: The methanation process design assessed was based on a series of
    adiabatic fixed-bed reactors and was found to be complex and costly at the small
    scale studied; new isothermal designs were identified as likely to be simpler
    and lower cost but were not assessed within the project scope.
  lesson_learnt: Projects integrating methanation with DAC at sub-commercial scale
    should not assume that commercially available adiabatic fixed-bed methanation
    designs are cost-optimal — emerging isothermal reactor designs may be substantially
    simpler and cheaper at small scale and should be evaluated before committing to
    a reactor configuration.
