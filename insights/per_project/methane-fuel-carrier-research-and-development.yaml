  source_title: Methane Fuel Carrier Project Final Report
  publish_date: 2021-06
  project_name: Methane Fuel Carrier Project
  what_happened: Laboratory screening of six amino-acid salt solutions identified
    two candidates with better oxidative stability than the MEA benchmark and adequate
    mass transfer and thermal regenerability, while MEA retained the best thermal
    stability. Only two of six candidate solvents met all the criteria for viable
    DAC application.
  lesson_learnt: Solvent screening for DAC applications should assess oxidative stability
    (operation in air), thermal stability (regeneration temperature), and mass transfer
    simultaneously — MEA, the standard post-combustion solvent, is not automatically
    the best choice for air-capture because its oxidative stability is inferior to
    at least two amino-acid salt alternatives, meaning solvent selection requires
    dedicated experimental work rather than defaulting to established post-combustion
    solvents.
