  project_name: Methane Fuel Carrier Project
  what_happened: Despite positive techno-economic modelling results projecting methane
    production costs below AU$10/GJ (excluding hydrogen production cost) at commercial
    scale, the project identified that a pilot plant continuously producing a CO2
    stream is a mandatory precursor step before commercialisation can proceed, as
    process robustness has not yet been demonstrated.
  lesson_learnt: Renewable gas projects based on direct air capture should plan for
    a dedicated pilot-plant demonstration phase to verify continuous CO2 capture performance
    and process robustness before advancing to commercial design — techno-economic
    modelling alone is insufficient to de-risk the pathway for investors and industry
    partners.
