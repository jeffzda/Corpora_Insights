  what_happened: Industry and investor engagement conducted during the project revealed
    that the critical blocker to further investment is the absence of a technology
    demonstrator at TRL-6 scale; discussions confirmed that investor confidence will
    not materialise until an integrated prototype operating at 100–250 kta CO2 scale
    has been validated.
  lesson_learnt: For novel process technologies such as DAC, early engagement with
    investors should be used diagnostically to identify the specific TRL gate that
    unlocks private investment — in this case investors required TRL-6 demonstration
    before committing; R&D programs should plan public funding to bridge to that gate
    rather than assuming earlier-stage results will attract private co-investment.
