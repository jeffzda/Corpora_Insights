  source_title: Methane Fuel Carrier Project Final Report
  publish_date: 2021-06
  project_name: Methane Fuel Carrier Project
  what_happened: The project concluded that liquefied synthetic methane (AU$37.4/GJ)
    is cost-competitive with liquefied hydrogen (AU$39.3/GJ) while avoiding the need
    for new hydrogen transport and utilisation infrastructure, because the fuel product
    is largely unchanged along the existing LNG supply chain.
  lesson_learnт: When evaluating hydrogen export pathways, infrastructure compatibility
    should be weighted as a significant commercialisation factor alongside production
    cost — liquefied synthetic methane offers a lower infrastructure-barrier route
    to renewable energy export than liquefied hydrogen, and programs assessing export
    competitiveness should include full supply-chain infrastructure costs rather than
    comparing production costs alone.
