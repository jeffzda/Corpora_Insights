  project_name: Methane Fuel Carrier Project
  what_happened: The techno-economic assessment found that electricity costs dominate
    the production cost of liquefied synthetic methane (77% of AU$37.4/GJ total),
    primarily driven by hydrogen production via electrolysis, making the economics
    highly sensitive to electricity price.
  lesson_learnt: Projects targeting synthetic methane or electrolytic hydrogen as
    export fuels must secure access to very low-cost renewable electricity — at AU$60/MWh
    the product cost (AU$37.4/GJ) is three to six times the prevailing natural gas
    price, and a carbon price of AU$300–400/tonne CO2 would be required to achieve
    parity; project developers should not progress to commercial design without a
    credible sub-AU$40/MWh electricity offtake pathway.
