  what_happened: The CSIRO-developed rotating liquid sheet contactor, tested as an
    alternative to commercial cooling towers for CO2 absorption from air, showed little
    advantage for this application because it requires high liquid flow rates, which
    would increase energy consumption rather than reduce it.
  lesson_learnt: Novel proprietary contactors developed for other applications should
    not be assumed to outperform commercial off-the-shelf equipment in direct air
    capture contexts — experimental validation against commercial alternatives (e.g.
    cooling towers) should be built into early R&D plans before committing to a preferred
    contactor design.
