- record_id: ARENA-DLV-32851
  source_title: Methane Fuel Carrier Project Final Report
  publish_date: 2021-06
  project_name: Methane Fuel Carrier Project
  what_happened: A techno-economic assessment demonstrated that direct air capture
    (DAC) using amino-acid salt solutions integrated with a methanation process can
    reduce CO2 capture costs by 95% — from AU$1,859/tonne CO2 (MEA baseline) to AU$87/tonne
    CO2 at 1 Mta scale — through staged adaptation of post-combustion capture technology,
    energy integration, and scale-up.
  lesson_learnt: Systematic staged cost-reduction — adapting existing post-combustion
    capture technology to air-capture conditions, then optimising energy integration,
    then applying scale-up factors — can achieve order-of-magnitude cost reductions;
    future DAC projects should structure R&D roadmaps around these discrete improvement
    levers rather than pursuing a single design iteration.
