  publish_date: 2024-11
  project_name: 'Efficient and Stable Chalcogenide-Si tandem cells: integrating commercialised
    PV technologies (TRAC006)'
  what_happened: The project team investigated low bandgap (~0.7 eV) chalcogenide
    solar cells as a potential sub-cell for tandem applications and, based on progress
    and analysis, made a formal 'No-Go' decision to discontinue that research direction
    during the project period.
  lesson_learnt: Build explicit go/no-go decision gates into R&D project plans for
    each technical sub-direction — early formal assessment of low-bandgap chalcogenide
    viability allowed the team to redirect resources toward higher-probability pathways
    rather than persisting with a direction unlikely to meet tandem targets.
