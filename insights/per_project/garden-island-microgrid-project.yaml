  what_happened: Public knowledge sharing about the Garden Island Microgrid was constrained
    throughout the project due to the site's location on and electrical connection
    to an active naval base, limiting what could be disclosed in public forums, to
    academic researchers, and to students seeking commercial data.
  lesson_learnt: When pursuing knowledge-sharing obligations on a Defence-hosted project,
    negotiate the scope and boundaries of permissible disclosure with the host agency
