  source_title: Garden Island Microgrid Report
  publish_date: 2020-11
  project_name: Garden Island Microgrid Project
  what_happened: Carnegie engaged the Commonwealth Bank of Australia (CBA) as early
    as 2015 to provide financing for the wave energy integrated microgrid project,
    a type of financing CBA had not previously considered due to the perceived risk
    profile. Whilst the facilities were not fully utilised, securing a commercial
    bank's willingness to finance this project type was treated as a significant knowledge-sharing
    outcome.
  lesson_learnt: Early engagement with commercial banks to build comfort with novel
    renewable energy project financing — even when financing facilities are ultimately
    not fully drawn — creates market precedent and reduces perceived risk for subsequent
    similar projects; this precedent-setting should be recognised as a deliverable
    in its own right.
