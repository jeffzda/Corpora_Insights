- record_id: ARENA-DLV-42605
  source_title: Garden Island Microgrid Report
  publish_date: 2020-11
  project_name: Garden Island Microgrid Project
  what_happened: The Garden Island Microgrid system had to be disconnected and was
    unable to operate while Defence contractors overhauled the section of the powerhouse
    to which it was connected, as part of a broader $350m electrical upgrade on HMAS
    Stirling. Reconnection required testing and reprogramming of communications and
    protection settings.
  lesson_learnt: Where a behind-the-meter microgrid is connected to a host site's
    internal electrical infrastructure, design connection arrangements to minimise
    exposure to host-site upgrade outages — and anticipate that major base redevelopments
    can force extended operational shutdowns requiring reprogramming upon reconnection.
  issue_severity: major
  project_type: multi-technology/hybrid
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: project developer
  delay_category: commissioning/integration
  failure_mode: unvalidated integration
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Carnegie worked with Defence, contractors and consultants on
    the reconnection to Defence's upgraded electrical infrastructure, with reprogramming
    of communications and protection settings; the upgraded connection was expected
    to reduce future Defence-caused operational disruptions.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hybrid systems
  source_pages: &id005
  - 13
  evidence_excerpt: the system had to be disconnected and was not able to operate
    whilst Defence's contractors overhauled the existing part of the powerhouse where
