  what_happened: Deploying a microgrid on an active naval base required Carnegie to
    navigate numerous Defence directorates, personnel groups, contractors, and approval
    processes across site selection, design, construction, commissioning, and operations
    — a level of organisational complexity not typical of commercial renewable deployments.
  lesson_learnt: When deploying on a Defence site, map all relevant Defence directorates
    and their distinct interests before project commencement — the range of groups
    involved (estate, environment, sustainability, asset management, procurement,
    site personnel, and base contractors) requires sustained multi-stakeholder engagement
    that must be resourced throughout every project phase.
