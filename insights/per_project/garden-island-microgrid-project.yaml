  source_title: Garden Island Microgrid Report
  publish_date: 2020-11
  project_name: Garden Island Microgrid Project
  what_happened: The Garden Island Microgrid was constructed and commissioned but
    then had to wait longer than scheduled for final sign-offs by Western Power and
    Department of Defence, with operations not commencing until August 2019 after
    numerous delays due to a variety of factors both internal and external to Carnegie.
  lesson_learnt: When deploying a renewable microgrid on an active Defence base, plan
    for extended approval timelines from both the network operator and the host agency
    — final sign-off processes can extend well beyond construction completion and
    should be scheduled as a critical-path activity.
