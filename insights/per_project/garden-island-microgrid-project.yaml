- record_id: ARENA-DLV-42606
  source_title: Garden Island Microgrid Report
  publish_date: 2020-11
  project_name: Garden Island Microgrid Project
  what_happened: Operations of the Garden Island Microgrid required active management
    of system output to meet base load requirements during high-load and high-generation
    events, including when submarines were in port and when emergency diesel generators
    were undergoing regular test runs — operational complexity not fully anticipated
    at the design stage.
  lesson_learnt: When designing a behind-the-meter microgrid for a military base,
    explicitly model the base's atypical load events (submarine berthing, generator
    test cycles) in the control system design — failure to do so creates ongoing operational
    management complexity that falls to the renewable energy operator.
