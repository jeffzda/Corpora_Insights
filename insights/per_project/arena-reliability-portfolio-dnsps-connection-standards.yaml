- record_id: ARENA-DLV-25926
  source_title: Review of ARENA's Reliability Portfolio
  publish_date: 2020-01
  project_name: ARENA Reliability Portfolio — DNSPs Connection Standards
  what_happened: Multiple projects across the reliability portfolio identified the
    lack of standardised regulatory approaches and the absence of clear standards
    governing interactions with DNSPs when negotiating competitively procured connections
    as a recurring barrier, with different states applying different metering and
    connection requirements that prevented development of standardised approaches
    across the NEM.
  lesson_learnt: Absence of national connection standards creates repeated project-level
    friction and prevents scale-up of proven connection approaches; ARENA-funded projects
    should document state-specific connection requirements as a deliverable, and ARENA
    should use portfolio-level evidence to advocate for national standardisation through
    the AEMC rule change process.
