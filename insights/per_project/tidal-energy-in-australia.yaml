- record_id: ARENA-DLV-25404
  source_title: 'Tidal Energy in Australia: Assessing Resource and Feasibility in
    Australia''s Future Energy Mix'
  publish_date: 2020-11
  project_name: AUSTEn - Australian Tidal Energy Project
  what_happened: Grid connection studies for both Banks Strait (Tasmanian NEM network)
    and Clarence Strait (Darwin-Katherine Interconnected System) found that network
    capacity severely constrains the maximum allowable tidal farm size. In Tasmania,
    the maximum allowable generation at any single connection point ranged from 21–90
    MW; in DKIS, 77–104 MW. The network constraint was identified as an immediate
    barrier to large-scale tidal integration, with no projected transmission upgrades
    able to relieve the constraint for the tidal points of connection.
  lesson_learnt: Network hosting capacity must be assessed as a primary constraint
    on tidal farm sizing before undertaking detailed resource assessment or project
    design — the transmission network, not the tidal resource, was the binding constraint
    at several Australian sites, and no planned network upgrades resolved the issue
    for tidal connection points.
  issue_severity: major
  project_type: generation
  project_scale_band: null
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: grid connection/system studies
  failure_mode: poor scoping
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: regulatory & approvals
  intervention_note: DIgSILENT/PowerFactory power system models were used to identify
    locational hosting capacity limits; results showed transformer upgrades could
    relieve some constraints but none of the projected transmission lines improved
    tidal hosting capacity at the points of connection studied.
  transferability: moderate
  delay_magnitude: null
  technology_domain: other
