  publish_date: 2020-11
  project_name: AUSTEn - Australian Tidal Energy Project
  what_happened: The LCOE sensitivity analysis showed that LCOE for tidal energy is
    most sensitive to capacity factor, followed by capital cost and O&M. A 50% reduction
    in capital cost reduces LCOE by only 25%, and even at 50% capital cost reduction,
    tidal remains uncompetitive with solar PV and wind in all modelled Australian
    regions. O&M cost reduction (50%) had almost the same impact as capital cost reduction.
  lesson_learnt: Improving capacity factor (through better-suited TEC design) is the
    single most effective lever for reducing tidal LCOE in Australia — capital cost
    reduction alone is insufficient, and business cases for Australian tidal projects
    should not be built on assumed cost parity with overseas TEC manufacturers without
    accounting for the mismatch between device ratings and local flow velocities.
