  project_name: AUSTEn - Australian Tidal Energy Project
  what_happened: The existing IEC technical guidelines for tidal site characterisation
    did not adequately cover turbulence measurement procedures, creating uncertainty
    in turbulence parametrisation. At Banks Strait, wave-turbulence decomposition
    techniques had to be applied before turbulence parameters could be reliably estimated,
    highlighting a gap in standard methodology.
  lesson_learnt: Current IEC site characterisation guidelines are insufficient for
    turbulence measurement at Australian tidal sites — developers should apply wave-turbulence
    decomposition techniques to ADCP data in mixed wave-current environments and advocate
    for or apply extended guidelines covering turbulence parametrisation, as overestimated
    turbulence intensity will lead to incorrect fatigue load calculations for TEC
    design.
