  publish_date: 2020-11
  project_name: AUSTEn - Australian Tidal Energy Project
  what_happened: The turbine energy extraction modelling for Banks Strait (two farms
    totalling ~21 MW) showed that the presence of TEC arrays reduces flow velocity
    by only up to 5 cm/s in a flow regularly exceeding 2 m/s, implying minimal hydrodynamic
    and environmental disturbance. The IEC Annex A method and the 2D bottom friction
    extraction model gave comparable results for annual energy production estimates.
  lesson_learnt: For Australian tidal site assessment, the simpler IEC Annex A energy
    extraction approach provides results comparable to the more computationally intensive
    2D bottom friction turbine model, and can be used for rapid initial farm layout
    and AEP estimation without requiring additional simulation runs; the 2D model
    is only needed where hydrodynamic impact assessment is specifically required.
