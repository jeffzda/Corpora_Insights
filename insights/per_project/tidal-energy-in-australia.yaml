  what_happened: The AUSTEn workshop found that at the current stage of tidal sector
    development in Australia, there is an insufficient database of real cost metrics
    for tidal energy. Cross-sector single-point LCOE estimates were concluded to be
    meaningless given the diversity of sites, technology-specific cost factors, balance-of-plant
    costs, and market economics.
  lesson_learnt: Single-point LCOE benchmarks for tidal energy are not a reliable
    basis for investment or policy decisions — project economics should be presented
    as ranges covering the full spread of development conditions, site-specific regional
    factors, and market applications; a common financial model structure populated
    with project-specific metrics is recommended over sector-wide averages.
