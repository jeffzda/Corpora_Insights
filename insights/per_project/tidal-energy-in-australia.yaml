- record_id: ARENA-DLV-25402
  source_title: 'Tidal Energy in Australia: Assessing Resource and Feasibility in
    Australia''s Future Energy Mix'
  publish_date: 2020-11
  project_name: AUSTEn - Australian Tidal Energy Project
  what_happened: Australian tidal current velocities at the two most promising characterised
    sites (Banks Strait, TAS and Clarence Strait, NT) were measured at maximums of
    2.3–2.8 m/s, substantially below the approximately 4 m/s flows at which current-generation
    commercial tidal energy converters (TECs) are designed to operate, rendering off-the-shelf
    devices unsuitable.
  lesson_learnt: Do not assume that commercially available TEC designs optimised for
    high-flow European/Canadian sites (~4 m/s) will be viable in Australian conditions
    — Australian tidal velocities typically reach only 2–3 m/s and require custom-designed
    TECs with larger rotors (20–26 m diameter) and lower power ratings to achieve
    acceptable capacity factors.
