  what_happened: High-resolution modelling of Banks Strait required bathymetry sourced
    from multiple datasets (Geoscience Australia 2009, AHS charts, AUSTEn multibeam
    surveys) and found that model accuracy was critically dependent on the quality
    and resolution of bathymetric data available. Where model boundaries fell outside
    the AUSTEn survey area, they relied on lower-quality synthetic data, reducing
    model accuracy.
  lesson_learnt: Tidal hydrodynamic model accuracy is fundamentally limited by bathymetric
    data quality — ensure that high-resolution multibeam surveys cover the full model
    domain including boundary zones before committing to detailed numerical modelling
    for site assessment, as reliance on synthetic or legacy bathymetry at model boundaries
    introduces systematic errors in resource estimates.
