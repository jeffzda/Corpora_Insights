- record_id: ARENA-DLV-25407
  source_title: 'Tidal Energy in Australia: Assessing Resource and Feasibility in
    Australia''s Future Energy Mix'
  publish_date: 2020-11
  project_name: AUSTEn - Australian Tidal Energy Project
  what_happened: Before the AUSTEn project, no accurate high-resolution seabed elevation
    and composition data existed for Banks Strait, a key candidate tidal energy site.
    The absence of this baseline bathymetric data prevented accurate resource characterisation
    and had limited progress toward commercial deployment.
  lesson_learnt: High-resolution multibeam bathymetry surveys are a prerequisite for
    tidal site characterisation and should be completed before investing in numerical
    modelling — for Banks Strait, no such data existed prior to AUSTEn, and the survey
    (covering ~210 km²) revealed seabed complexity (sand waves, rock/reef, scour patterns)
    that fundamentally informed device suitability assessments.
