- record_id: ARENA-DLV-25401
  source_title: 'Tidal Energy in Australia: Assessing Resource and Feasibility in
    Australia''s Future Energy Mix'
  publish_date: 2020-11
  project_name: AUSTEn - Australian Tidal Energy Project
  what_happened: Australia's tidal energy resource lacked a national high-resolution
    model, limiting identification of prospective sites and calculation of economic
    parameters such as LCOE. Prior to the AUSTEn project, the best available national
    model had a coarse grid size of approximately 10 km, leading to large uncertainties
    (>50%) in energy assessments and potentially overlooking high-energy sites.
  lesson_learnt: Before committing to site-level tidal energy investment, develop
    or commission a national high-resolution hydrodynamic tidal model (≤500 m resolution)
    to identify prospective sites and reduce resource uncertainty — coarse national
    models at ~10 km resolution introduce >50% uncertainty and can miss commercially
    viable locations.
