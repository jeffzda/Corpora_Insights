  what_happened: In the Banks Strait fine-scale model calibration, considerable effort
    was required to calibrate the simulation against up to five widely spaced ADCP
    stations. The calibration process varied bottom friction, horizontal viscosity
    and diffusion iteratively; 2D models were ultimately found to offer comparable
    accuracy to 3D models at significantly reduced computational cost.
