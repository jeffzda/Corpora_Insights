    solution under any fossil fuel price scenario. The primary competitive threat
    is the low cost of solar PV and battery storage, not fossil fuel prices. To be
    competitive in one example community (Tiwi Islands), tidal would need to reduce
    capital cost by 50% to approximately 1,930 $/kW by 2050.
  lesson_learnt: Even in off-grid communities where tidal energy's dispatchability
