  evidence_excerpt: The assessment showed that although both Banks and Clarence straits
    provide very good tidal resources, the network capacity to transfer the energy
    from those locations to load centres is limited. In other words, the network capacity
    is an immediate constraint on future massive tidal integration into these both
    networks... none of the projected transmission and distribution lines could improve
    the locational tidal hosting capacity for the considered tidal POCs.
