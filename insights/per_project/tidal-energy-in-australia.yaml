    reduction in battery storage requirements rather than bulk energy generation —
    when a dispatchability requirement exists, co-locating a modest tidal farm with
    a wind or solar farm can reduce battery storage sizing by orders of magnitude
    and deliver a positive business case where tidal alone cannot compete.
