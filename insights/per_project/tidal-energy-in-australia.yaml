  what_happened: The Banks Strait hybrid tidal/wind farm case study demonstrated that
    a 60-TEC tidal array (47 MW rated, 8 MW average) combined with 56 wind turbines
    (168 MW rated) could reduce total capital cost from $863M to $657M — a $206M (24%)
