  publish_date: 2020-11
  project_name: AUSTEn - Australian Tidal Energy Project
  what_happened: 'The AUSTEn project demonstrated that tidal energy has an intrinsic
    value in hybrid systems not captured by LCOE comparisons: because tidal output
    is completely forecastable years in advance, storage sizing for a tidal-stabilised
    hybrid system can be optimised at lower cost than for wind or solar alone, where
    storage must be sized against unforecastable generation drops.'
  lesson_learnt: Economic assessments of tidal energy in hybrid systems should include
    the avoided cost of oversized storage due to wind/solar forecast uncertainty —
    the complete predictability of tidal generation allows storage to be optimally
    sized (e.g. 3 hours versus 6–38 hours), representing a real capital cost saving
    that is invisible in standard LCOE comparisons.
