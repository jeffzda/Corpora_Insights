  publish_date: 2020-11
  project_name: AUSTEn - Australian Tidal Energy Project
  what_happened: The national tidal model underestimated tidal velocities near the
    Tiwi Islands/Darwin area, affecting LCOE calculations for that region. The higher-resolution
    regional model subsequently increased the capacity factor estimate for Darwin,
    demonstrating that national-scale models can materially understate resource quality
    at specific high-flow locations.
  lesson_learnt: Do not rely solely on national-scale tidal models for site-level
    investment decisions — national models may underestimate resource at localised
    high-flow sites, and high-resolution regional modelling validated against in-situ
    ADCP data is required before finalising LCOE or capacity factor estimates for
    any specific development site.
