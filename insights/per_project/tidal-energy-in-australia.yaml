  secondary_failure_mode: null
  intervention_note: AUSTEn assessed modified TEC power curves adjusted for local
    flow conditions and identified custom rotor/generator configurations (20–26 m
    rotors, rated for ~2 m/s peak) as the required design direction.
  transferability: narrow
