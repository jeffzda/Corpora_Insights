  what_happened: At Broome and some off-grid communities in Western Australia and
    the Northern Territory, grid or generation infrastructure constraints limit the
    maximum practical tidal farm size to well below the available resource. For example,
    the maximum farm size at Ardyaloon (One Arm Point) is constrained by grid capacity
    to 0.8 MW despite the tidal resource supporting 199 MW rated power.
  lesson_learnt: At small remote off-grid communities, existing generation and distribution
    infrastructure capacity — not the tidal resource — defines the practical upper
    limit of a tidal development; engage with network/microgrid operators early to
    understand hosting capacity constraints before sizing any tidal project.
