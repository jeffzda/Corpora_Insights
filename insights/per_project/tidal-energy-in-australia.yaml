- record_id: ARENA-DLV-25421
  source_title: 'Tidal Energy in Australia: Assessing Resource and Feasibility in
    Australia''s Future Energy Mix'
  publish_date: 2020-11
  project_name: AUSTEn - Australian Tidal Energy Project
  what_happened: 'The AUSTEn project found that Australian tidal velocity profiles
    differ significantly between temperate sites (Banks Strait: 12–20°C, significant
    wave heights up to 6.83 m, strong wave-current interaction, storm-prone) and tropical
    sites (Clarence Strait: 25–32°C, wave heights rarely exceeding 1.5 m, minimal
    wave-current interaction), with both sites also exhibiting distinct biofouling
    type and rates.'
  lesson_learnt: The diversity of tidal environments across Australia (tropical vs
    temperate, calm vs storm-exposed) means site-specific characterisation campaigns
    are essential — device design, corrosion protection, biofouling management and
    O&M planning cannot be transferred between sites without site-specific adaptation;
    this diversity was a key finding from the first comprehensive Australian multi-site
    tidal field campaigns.
