- record_id: ARENA-DLV-25403
  source_title: 'Tidal Energy in Australia: Assessing Resource and Feasibility in
    Australia''s Future Energy Mix'
  publish_date: 2020-11
  project_name: AUSTEn - Australian Tidal Energy Project
  what_happened: LCOE calculations for tidal energy at Banks Strait and Clarence Strait
    (the two best-characterised Australian sites) ranged from $0.96–1.75/kWh, which
    is more than double the LCOE of solar PV and onshore wind. Even with 50% capital
    cost reductions and reduced O&M, tidal remained uncompetitive in grid-connected
    NEM and DKIS modelling scenarios.
  lesson_learnt: Tidal energy is not currently cost-competitive with wind and solar
    PV for grid-connected electricity supply in Australia, even at the most favourable
    sites — developers and investors should direct tidal feasibility investment toward
    niche applications requiring dispatchable power (remote/off-grid, backup, chemical
    processing) rather than bulk grid supply.
