- record_id: ARENA-DLV-25406
  source_title: 'Tidal Energy in Australia: Assessing Resource and Feasibility in
    Australia''s Future Energy Mix'
  publish_date: 2020-11
  project_name: AUSTEn - Australian Tidal Energy Project
  what_happened: At Banks Strait, strong wave-current interactions were measured throughout
    the water column, with significant wave heights up to 6.83 m and average 1.25
    m, alongside turbulence intensities of 13–19%. The site was also found to be prone
    to large storms. These conditions create significant operational constraints on
    installation windows, maintenance costs and fatigue loading on TEC devices.
  lesson_learnt: Wave-current interactions and extreme storm exposure must be quantified
    at tidal energy sites before finalising device design or installation planning
    — at Banks Strait, strong wave-current interaction and storm exposure will constrain
    maintenance windows and increase device fatigue loads, affecting both capital
    and operational cost estimates.
