- record_id: ARENA-DLV-16258
  source_title: Energy Storage Study
  publish_date: 2015-07
  project_name: Australian Energy Storage Market — Wholesale Market Revenue Constraints
  what_happened: Australia's wholesale electricity market in 2015 exhibited oversupply
    of generation capacity, low and stable spot prices, and limited price volatility,
    creating weak financial drivers for wholesale arbitrage and FCAS revenue streams
    for energy storage. This significantly reduced the business case for utility-scale
    storage in the wholesale market.
  lesson_learnt: Utility-scale storage projects relying on wholesale arbitrage or
    FCAS as primary revenue streams are highly exposed to market conditions; in an
    oversupplied market these revenue streams are insufficient to underpin a business
    case without additional value streams such as off-grid fuel savings or behind-the-meter
    tariff arbitrage.
