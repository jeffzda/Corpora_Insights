  evidence_excerpt: Currently, the market has a surplus of generation assets leading
    to low wholesale prices with limited volatility. This market environment (among
    other factors) has contributed to the closure of Playford B, Munmorah and Collinsville
    power stations... This environment also reduces the potential wholesale market
    revenue streams for energy storage, with limited potential for market arbitrage
    as well as significant competition of the provision of FCAS.
