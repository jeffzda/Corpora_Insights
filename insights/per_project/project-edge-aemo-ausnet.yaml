- record_id: ARENA-DLV-29562
  source_title: DEIP - DEIP Dive - Event Summary 2023
  publish_date: 2023-07
  project_name: Project EDGE (AEMO/AusNet)
  what_happened: Project EDGE identified that the most significant barrier to DER/CER
    market integration in the NEM is the absence of agreement between policy, regulatory
    and market bodies on what the future architecture looks like, limiting the ability
    of market participants to invest with confidence.
  lesson_learnt: DER/CER scale-up projects in the NEM should explicitly track and
    engage with policy and regulatory alignment as a delivery risk — the lack of consensus
    between AEMO, AER, and relevant government bodies on future market structure is
    a material external risk that can stall commercial investment and should be named
    in project risk registers.
