- record_id: ARENA-DLV-29556
  source_title: DEIP - DEIP Dive - Event Summary 2023
  publish_date: 2023-07
  project_name: Project EDGE (AEMO/AusNet)
  what_happened: Project EDGE found that while aggregator bidding and dispatch can
    conform to export/import limits at the individual NMI level, forecasting DER/CER
    behaviour at NMI-level is computationally expensive and translating this to a
    fleet-level response requires significant optimisation before it can scale to
    hundreds of thousands of consumers.
  lesson_learnt: DER aggregation platforms targeting large-scale fleet dispatch must
    plan for substantial computational investment in NMI-level forecasting and fleet-level
    optimisation — the technical scaling challenge is not trivial and should be treated
    as a core engineering workstream, not a backend integration task.
