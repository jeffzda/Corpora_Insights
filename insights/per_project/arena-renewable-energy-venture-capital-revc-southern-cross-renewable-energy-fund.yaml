- record_id: ARENA-DLV-15828
  source_title: Evaluation of ARENA's Impact and Effectiveness
  publish_date: 2019-11
  project_name: ARENA Renewable Energy Venture Capital (REVC) / Southern Cross Renewable Energy Fund
  what_happened: The Southern Cross Renewable Energy Fund invested over $72 million in 12 energy start-ups from 2012 to 2018, with 10 still active. An independent evaluation found the fund contributed to
    increasing the number of Australian renewable energy companies and acted as a cornerstone investor that accelerated investment by others. There was no evidence of displacement of private investment.
  lesson_learnt: A government-backed anchor investment in a venture capital fund for early-stage clean energy companies can catalyse private co-investment and provide patient capital without displacing
    private market activity — the SCRE Fund model is replicable for other emerging technology categories where private early-stage capital is absent.
