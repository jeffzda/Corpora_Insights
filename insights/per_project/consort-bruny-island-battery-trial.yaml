- record_id: ARENA-DLV-50555
  source_title: DEIP Market Integration Trials Summary Report 1.0
  publish_date: 2022-09
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: The CONSORT trial found that load forecasting quality directly affected
    network support dispatch performance — poor load forecasts led to over or under
    dispatching DER when network support was needed. The Shapley value reward methodology
    was found to be fair and efficient but too computationally complex to support
    real-time or near-real-time pricing.
  lesson_learnt: Invest in high-quality load forecasting before deploying DER for
    network support services, as forecast errors directly cause dispatch errors; also
    avoid complex reward allocation algorithms (such as Shapley value) for real-time
    or day-ahead pricing applications due to computational infeasibility.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: execution & logistics
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id002
  - 14
  evidence_excerpt: The importance of good load forecasting. Poor load forecasts can
    lead to over or under dispatching DER when network support is needed. While the
    rewards structure methodology (finding the Shapely value) creates fair and efficient
    procurement of network support, the complexity of calculating it made it unsuitable
    to generating spot prices or even close to real-time prices (e.g. day-ahead prices)
    without estimations.
