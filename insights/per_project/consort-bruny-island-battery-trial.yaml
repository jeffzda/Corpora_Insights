- record_id: ARENA-DLV-58803
  source_title: 'DER Customer Insights: The Customer Journey'
  publish_date: 2020-07
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: The CONSORT Bruny Island Battery Trial used community and industry
    forums plus at least 50 media items for awareness raising, then required an expression
    of interest and random ballot process to select 34 participant households — a
    structured acquisition funnel that was assessed as successful for a geographically
    focused trial.
  lesson_learnt: For geographically focused DER trials, a structured acquisition funnel
    combining broad awareness raising, expressions of interest, and eligibility-based
    selection reduces recruitment friction and helps reach engaged early adopters.
  issue_severity: minor
  project_type: DER/customer-side
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: development/design
  proponent_type: network business
  delay_category: no material delay stated
  failure_mode: no major failure stated
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id004
