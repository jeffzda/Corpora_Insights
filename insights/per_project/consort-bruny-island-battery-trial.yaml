- record_id: ARENA-DLV-1806
  source_title: ARENA Insights Forum November 2018 DER Summary
  publish_date: 2019-04
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: The CONSORT Bruny Island Battery Trial tested household solar and
    battery systems to meet community energy needs during peak holiday periods, finding
    that customers assign value to DER systems through multiple dimensions — monetary
    savings, environmental contribution, community benefit, and autonomy — not price
    signals alone.
  lesson_learnt: DER programme designers should assess and communicate value propositions
    across monetary and non-monetary dimensions; programmes that frame benefits only
    in terms of bill savings will fail to activate customer segments motivated by
    environmental, community, or autonomy values.
  issue_severity: minor
  project_type: DER/customer-side
  project_scale_band: demonstration
