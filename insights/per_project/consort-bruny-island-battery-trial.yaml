- record_id: ARENA-DLV-50556
  source_title: DEIP Market Integration Trials Summary Report 1.0
  publish_date: 2022-09
  project_name: CONSORT Bruny Island Battery Trial
  what_happened: The CONSORT trial social science research found that consumers must
    be included in orchestration and algorithm design, and that DER at a consumer's
    home is experienced as a mixture of technologies across the home rather than a
    single integrated system, causing confusion about operation and support contacts.
  lesson_learnt: Include consumers in the design of orchestration algorithms and DER
    programs from the outset; provide clear, simple upfront information on how the
    combined technology system works and who to contact if something goes wrong —
    failure to do so results in consumer confusion and erodes trust in the program.
  issue_severity: minor
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: network business
