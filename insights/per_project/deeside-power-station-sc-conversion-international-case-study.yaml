- record_id: ARENA-DLV-50970
  source_title: Repurposing Existing Generators as Synchronous Condensers
  publish_date: 2023-06
  project_name: Deeside Power Station SC Conversion (International Case Study)
  what_happened: Deeside Power Station in Wales (498 MW CCGT) had two gas turbines repurposed as synchronous condensers under a six-year contract for inertia and reactive power awarded in 2020. The SC service
    commenced in June 2021, with an implementation time of approximately 15 months, and is expected to save approximately GBP £128M over six years (~AUD $38M per year).
  lesson_learnt: Gas turbine combined-cycle repurposing to synchronous condenser is achievable within approximately 15 months from contract award, and the value of inertia and system strength services can
    be substantial — the Deeside case demonstrates that long-term contracts (six years) underwriting conversion costs are viable and deliver significant system savings.
