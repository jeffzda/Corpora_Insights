- record_id: ARENA-DLV-59251
  source_title: 'The Generator Operations Series: Negative Pricing and Bidding Behaviour
    on the NEM'
  publish_date: 2021-09
  project_name: ARENA Large-scale Solar (LSS) Portfolio
  what_happened: When ARENA launched its $100 million Large-scale Solar funding round
    in 2016, negative pricing was not considered a major risk. Many offtake agreements
    from that era required projects to switch off during negative price intervals
    but were structured as if such events would be rare. By 2021, economic curtailment
    in response to negative pricing had become the largest source of VRE curtailment,
    accounting for 58 per cent of the total.
  lesson_learnt: PPA structures negotiated when negative pricing was rare can become
    a significant revenue liability as renewable penetration grows — future offtake
    agreements must explicitly quantify and allocate negative pricing risk rather
    than treating curtailment obligations as low-risk provisions.
