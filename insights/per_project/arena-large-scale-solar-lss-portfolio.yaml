- record_id: ARENA-DLV-59252
  source_title: 'The Generator Operations Series: Negative Pricing and Bidding Behaviour
    on the NEM'
  publish_date: 2021-09
  project_name: ARENA Large-scale Solar (LSS) Portfolio
  what_happened: VRE generators installed prior to July 2018 were found to be almost
    50 per cent more likely to adopt a price-agnostic bidding strategy — bidding at
    close to the market floor at all times regardless of spot price — reflecting legacy
    offtake agreements in which the purchaser bore negative pricing risk. As negative
    pricing has intensified, this strategy increasingly exposes generators to dispatching
    during loss-making intervals where the offtaker no longer absorbs the cost.
  lesson_learnt: Generators operating under pre-2018 offtake agreements should audit
    whether their PPA counterparty still bears negative pricing risk or whether that
    risk has reverted; price-agnostic bidding is only commercially safe where the
    offtaker fully absorbs negative price exposure.
