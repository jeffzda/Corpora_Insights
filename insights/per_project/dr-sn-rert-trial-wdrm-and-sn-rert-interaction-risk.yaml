  evidence_excerpt: It is worth noting that... under the SN RERT, loads are empanelled
    but are not contracted until an ITT is issued and accepted. Given this, it may
    be the case that SN RERT DR loads can be offered into the WDRM until an ITT is
    issued. This can result in some sub-optimal outcomes as were experienced in one
    instance in Year 2.
