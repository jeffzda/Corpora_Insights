- record_id: ARENA-DLV-20733
  source_title: Demand Response Short Notice RERT Trial Year 3 Report
  publish_date: 2021-10
  project_name: DR SN RERT Trial — WDRM and SN RERT interaction risk
  what_happened: The WDRM as codified at the time of the trial specifically precluded
    loads participating in RERT from being offered in the WDRM; however, an ambiguity
    existed for SN RERT loads (which are empanelled but not contracted until an ITT
    is issued), and this ambiguity led to at least one sub-optimal outcome in Year
    2 when a participant attempted to operate across both markets.
  lesson_learnt: DR program participants operating across RERT and wholesale DR market
    mechanisms should obtain clear legal and market advice on the interaction rules
    before attempting to offer the same capacity into multiple markets; market design
    ambiguities between SN RERT and WDRM participation need to be resolved to prevent
    sub-optimal dispatch outcomes.
