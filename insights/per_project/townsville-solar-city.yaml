  evidence_excerpt: The decline in maximum demand is more impressive when compared with the control town of Ayr where it has been steadily rising at 2.4% per year up to mid 2010 compared with the Island
    where it has been falling by 4.5%... This in turn has deferred the augmentation of cables feeding Magnetic Island, an investment worth $17 million.
