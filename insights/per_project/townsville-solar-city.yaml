- record_id: ARENA-DLV-72311
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects - First Edition Results'
  publish_date: '2014'
  project_name: Townsville Solar City
  what_happened: Analysis of PV systems connected to Ergon Energy's Townsville network found voltage rises within manageable limits and little effect from harmonics, while experimentation with power factor
    correction from the latest inverters showed promise for delivering positive network effects.
  lesson_learnt: At moderate penetration levels, PV-induced voltage rise on distribution networks can remain within manageable limits; deploying inverters with power factor correction capability should
    be prioritised as a cost-effective tool for managing voltage impacts before more expensive network interventions are required.
  issue_severity: minor
  project_type: network/grid
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: Experimentation with power factor correction by the latest inverters showed promise for positive network voltage effects.
  transferability: broad
