- record_id: ARENA-DLV-72310
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects - First Edition Results'
  publish_date: '2014'
  project_name: Townsville Solar City
  what_happened: The Townsville Solar City program (AUD 31M), using an Energy Behaviour Change Model combining community engagement, social marketing, and personal energy assessments, achieved a 46% reduction
    in energy consumption compared to business-as-usual across Magnetic Island and Ayr communities, deferring a $17 million cable augmentation from 2014 to at least 2016.
  lesson_learnt: Structured community energy behaviour change programmes combining social marketing, community culture development, and tailored personal energy assessments can deliver peak demand reductions
    sufficient to defer significant network capital expenditure — the Townsville model deferred a $17M cable augmentation and should be considered a replicable non-network alternative to traditional augmentation.
  issue_severity: none
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: network business
