    — that puts grid operation into uncharted territory with no international comparisons
    available to draw on.
  lesson_learnt: Grid operators, developers and policy makers should treat Australia's
    high-renewables grid as a frontier system requiring proactive investment in understanding
    operational limits — standard international reference cases are not available,
    and reactive management is insufficient at this penetration level.
