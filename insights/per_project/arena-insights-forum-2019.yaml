  publish_date: 2019-12
  project_name: ARENA Insights Forum 2019
  what_happened: Forum panellists observed that the actual development path of renewable
    energy projects frequently diverges from the starting point, with projects ending
    up in materially different locations or configurations than originally planned.
  lesson_learnt: Portfolio managers and grid planners should track the delta between
    project starting points and final outcomes to build a better evidence base for
    future grid development planning and connection signal design.
