  source_title: ARENA Insights Forum Session Summaries & Key Points
  publish_date: 2019-12
  project_name: ARENA Insights Forum 2019
  what_happened: Forum panellists from industry identified that while the business
    case for renewable energy transitions is often commercially sound, finding the
    economic sweet spot and then moving quickly is critical — delays in implementation
    after the business case is established allow competitive and market conditions
    to shift.
  lesson_learnt: Once the economic business case for a renewable energy project is
    established and internal stakeholder buy-in is secured, implementation should
    proceed quickly — prolonged internal deliberation after the business case is proven
    risks market and cost conditions shifting unfavourably.
