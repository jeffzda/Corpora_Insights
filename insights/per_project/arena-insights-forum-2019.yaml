  source_title: ARENA Insights Forum Session Summaries & Key Points
  publish_date: 2019-12
  project_name: ARENA Insights Forum 2019
  what_happened: Industry representatives across oil, gas, mining and agriculture
    at the forum identified that internal stakeholder buy-in is a critical barrier
    to progressing renewable energy and decarbonisation projects, with shareholders
    driving sustainability demand more than supply chains.
  lesson_learnt: Project proponents within large industrial organisations should engage
    key internal stakeholders early and build a strong internal business case emphasising
    long-term operational cost savings to offset concerns about higher upfront capital
    expenditure — without internal buy-in, projects stall regardless of external viability.
