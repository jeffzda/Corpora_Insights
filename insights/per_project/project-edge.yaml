- record_id: ARENA-DLV-51486
  source_title: UTS - Flexible Demand State of Play in Australia - Report
  publish_date: 2024-05
  project_name: Project EDGE
  what_happened: Project EDGE identified that limitations on access to real-time data
    and interoperability between network and market systems were key barriers to integrating
    price-responsive CER into the NEM, and recommended a data exchange hub model over
    point-to-point or fully centralised platforms.
  lesson_learnt: CER market integration architectures should use a federated data
    exchange hub model where each network connects with its own digital solution aligned
    to an industry standard — this reduces inter-connectivity costs compared to point-to-point
    systems while avoiding the single-point-of-failure and governance risks of fully
    centralised platforms.
