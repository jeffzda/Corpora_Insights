- record_id: ARENA-DLV-50563
  source_title: DEIP Market Integration Trials Summary Report 1.0
  publish_date: 2022-09
  project_name: Project EDGE
  what_happened: Project EDGE social science research (16 in-depth consumer interviews)
    found that consumers were primarily motivated by non-financial benefits such as
    community, environmental values and energy self-sufficiency; that consumers viewed
    the battery as an asset for their own needs first; and that the aggregator was
    perceived as a hardware supplier rather than an energy aggregator, with consumers
    expressing distrust about whether a commercial company would use the battery in
    the consumer's interest.
  lesson_learnt: VPP program design must address the trust deficit between consumers
    and commercial aggregators — consumers do not naturally perceive aggregators as
    acting in their interest; programs should explicitly communicate consumer benefit,
    provide transparency on how assets will be used, and not assume financial incentives
    alone will drive participation.
