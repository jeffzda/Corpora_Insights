- record_id: ARENA-DLV-6819
  source_title: Navigating Dynamic Operating Envelopes
  publish_date: 2025-12
  project_name: Project EDGE
  what_happened: Project EDGE demonstrated that multiple measurement points (sub-locations
    within a site where controllable devices are monitored) can coexist at a single
    site without compromising consumer energy use, enabling multi-aggregator operation
    — but the trial identified that differentiated protections are required for controllable
    versus non-controllable loads.
  lesson_learnt: When designing DOE architectures to enable multi-aggregator operation
    at a single site, establish measurement point frameworks with differentiated consumer
    protections for controllable and non-controllable loads from the outset — Project
    EDGE confirmed the technical feasibility but also identified that without this
    protection differentiation, non-controllable loads risk being inadvertently affected
    by aggregator dispatch decisions.
