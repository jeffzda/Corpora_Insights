  project_name: Project EDGE
  what_happened: Project EDGE found that compensatory controls — fall-back behaviours
    for DER, traders, and system operators during communication failures — were not
    consistently implemented by traders, presenting a power system security risk if
    DER is deployed at material scale without reliable compensatory controls.
  lesson_learnt: Compensatory control capabilities must be developed, tested, and
    monitored within trader systems before DER aggregations are permitted to operate
    at material scale — undefined or inconsistently applied fall-back behaviours during
    communication outages represent a systemic power system security risk.
