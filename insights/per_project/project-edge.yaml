- record_id: ARENA-DLV-6807
  source_title: Navigating Dynamic Operating Envelopes
  publish_date: 2025-12
  project_name: Project EDGE
  what_happened: Consumer research conducted by Deakin University under Project EDGE
    found that consumers evaluate the fairness of DOE capacity allocation methods
    primarily in terms of personal benefit — they perceive an allocation method as
    'fair' if it delivers the greatest advantage to their own household, regardless
    of network-wide efficiency.
  lesson_learnt: Consumer acceptance of DOE allocation methods cannot be assumed based
    on technical efficiency alone — consumers assess fairness through a personal-benefit
    lens. DOE implementers should invest in consumer communication and engagement
    strategies that explain the rationale for allocation choices, particularly where
    efficiency-optimising methods result in differential treatment of households.
