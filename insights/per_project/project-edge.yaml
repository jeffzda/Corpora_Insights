  what_happened: Project EDGE found that traders could more accurately forecast and
    operate VPPs when metering was applied only to flexible assets at a site (sub-metering),
    rather than using the whole connection-point net consumption figure that includes
    non-price-responsive loads.
  lesson_learnt: Flexible metering that separates price-responsive DER from non-responsive
    household loads materially improves trader forecasting accuracy and market scheduling
    performance — regulatory reforms to enable sub-metering at residential sites should
    be progressed as an enabler of DER market participation.
