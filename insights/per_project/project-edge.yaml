- record_id: ARENA-DLV-50562
  source_title: DEIP Market Integration Trials Summary Report 1.0
  publish_date: 2022-09
  project_name: Project EDGE
  what_happened: Project EDGE is testing a hypothesis that a centralised or decentralised
    data hub — where all parties connect once to exchange data with all parties —
    is more efficient and preferable at scale compared to point-to-point architectures
    with standards (e.g. each trader connecting to each DNSP via CSIP-AUS). The trial
    is still underway and the relative merits of the two approaches are being assessed.
  lesson_learnt: When designing data architectures for multi-party DER integration
    at scale, evaluate hub versus point-to-point architectures early in the design
    phase — point-to-point with standards may suffice for small networks but the number
    of bilateral integrations grows rapidly as participant numbers increase, making
    a hub architecture potentially more cost-effective at portfolio scale.
