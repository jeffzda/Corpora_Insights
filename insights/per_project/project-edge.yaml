  project_name: Project EDGE
  what_happened: Traders in Project EDGE showed approximately 14% non-conformance
    with Dynamic Operating Envelopes (DOEs) during constrained periods and demonstrated
    inconsistent performance in meeting linear ramp requirements for market dispatch
    instructions.
  lesson_learnt: Clear performance standards, ongoing conformance testing, and regular
    feedback mechanisms must be established before widespread DOE adoption — traders
    will not reliably self-correct without defined compliance frameworks and enforcement
    mechanisms.
