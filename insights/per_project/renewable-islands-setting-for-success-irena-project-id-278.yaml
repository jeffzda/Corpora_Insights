  evidence_excerpt: 'The case studies in this report show that a wide variety of islands in different locations and at different levels of development can all attract investment in cost-effective renewable
    energy resources through a mix of four key ingredients: Political priority to attract investment; a market framework for investment; technical planning for investment; and capacity to implement investment.'
