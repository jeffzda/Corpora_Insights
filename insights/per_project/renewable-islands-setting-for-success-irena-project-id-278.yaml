- record_id: ARENA-DLV-72284
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects - First Edition Results'
  publish_date: '2015'
  project_name: 'Renewable Islands: Setting for Success – IRENA (Project ID 278)'
  what_happened: 'IRENA case studies across four island nations (Cabo Verde, Cyprus, Fiji, Samoa) found that successful renewable energy deployment on islands required four ingredients acting together:
    political priority, a market framework for investment, technical planning, and implementation capacity — the absence of any one factor was found to prevent successful investment.'
  lesson_learnt: Island or isolated grid renewable energy projects are unlikely to succeed unless political commitment, a supportive market framework, sound technical planning, and on-the-ground implementation
    capacity are all in place simultaneously — project developers entering island markets should assess all four factors before committing capital.
