- record_id: ARENA-DLV-52064
  source_title: ARENA Distributed Energy Resources Projects
  publish_date: 2019-03
  project_name: United Energy Dynamic Voltage Management Demand Response (RERT)
  what_happened: United Energy demonstrated that distribution substation voltage control devices, using smart meter voltage data, could deliver up to 30 MW of demand response reserve by reducing network
    voltage by an average of 3% during peak demand events without disrupting customer appliance use.
  lesson_learnt: Network-side voltage control is a scalable, non-intrusive mechanism for delivering large volumes of demand response — DNSPs should consider voltage management as a primary DR tool alongside
    customer-side curtailment programs, as it leverages existing substation infrastructure.
