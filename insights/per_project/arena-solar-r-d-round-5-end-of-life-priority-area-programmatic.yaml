- record_id: ARENA-DLV-2013
  source_title: Addressing Solar PV End-of-Life Issues and Lowering Solar PV Cost
    – Summary Report
  publish_date: 2024-05
  project_name: ARENA Solar R&D Round 5 – End-of-Life Priority Area (Programmatic)
  what_happened: Panel re-use in Australia is restricted to off-grid applications
    because no approved testing and re-certification processes exist for grid-connected
    reuse of old panels; no projects in Round 5 addressed panel re-use, leaving this
    regulatory gap unresolved.
  lesson_learnt: Future R&D investment in solar panel circularity should explicitly
    include regulatory pathway development for re-certification of used panels for
    grid-connected applications; technical recycling solutions will not be adopted
    at scale without a corresponding regulatory framework.
  issue_severity: major
  project_type: manufacturing/supply chain
  project_scale_band: lab/bench
  lifecycle_phase: approvals/contracting
  proponent_type: research organisation/university
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id003
  - 10
  evidence_excerpt: In Australia, restrictions apply to the re-use of old panels in
    grid-connected applications, therefore, approved testing and re-certification
    processes will need to be developed for re-use to be allowed. In the interim,
    re-use of solar panels is limited to off-grid applications.
