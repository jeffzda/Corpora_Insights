- record_id: ARENA-DLV-2006
  source_title: Addressing Solar PV End-of-Life Issues and Lowering Solar PV Cost
    – Summary Report
  publish_date: 2024-05
  project_name: ARENA Solar R&D Round 5 – End-of-Life Priority Area (Programmatic)
  what_happened: Across the End-of-Life priority area, the absence of local upstream
    PV manufacturing, absence of standard component labelling, and high minimum processing
    volumes (>5,000 t/yr) created structural barriers to commercialising recycling
    processes developed in the round, limiting the market for recovered materials.
  lesson_learnt: End-of-life solar PV recycling R&D projects should be scoped alongside
    market development and policy work from the outset; without addressable markets
    for recovered materials and collection infrastructure, technical breakthroughs
    at lab scale cannot progress to commercial deployment.
