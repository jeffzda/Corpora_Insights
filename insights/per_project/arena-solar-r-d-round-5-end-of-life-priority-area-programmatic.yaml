- record_id: ARENA-DLV-2007
  source_title: Addressing Solar PV End-of-Life Issues and Lowering Solar PV Cost
    – Summary Report
  publish_date: 2024-05
  project_name: ARENA Solar R&D Round 5 – End-of-Life Priority Area (Programmatic)
  what_happened: The rapid evolution of solar PV technology, combined with the absence
    of standard component labelling on panels, prevented the development of standardised
    recycling methods capable of handling the full range of module types and materials
    currently in the waste stream.
  lesson_learnt: Future R&D investment in PV end-of-life should be paired with industry
    engagement to establish standard labelling and material disclosure for panels
    at manufacture; without this, recycling processes remain module-type-specific
    and cannot scale economically.
