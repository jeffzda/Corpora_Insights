- record_id: ARENA-DLV-11029
  source_title: Renewable Energy Options for Industrial Process Heat
  publish_date: 2019-08
  project_name: Queen City Forging Electric Infrared Preheating System
  what_happened: Queen City Forging in Ohio, US replaced gas-fired convection batch furnaces for aluminium billet preheating with a continuous electric convection-infrared hybrid furnace. Energy consumption
    dropped from 3.49 GJ/tonne to 1.16 GJ/tonne (a two-thirds reduction), energy costs fell 40–50%, preheating time reduced from 6 hours to 18 minutes, and heat treatment time reduced from 10 hours to 1
    hour. Infrared-processed materials also showed improved strength and fatigue resistance.
  lesson_learnt: Electric infrared preheating furnaces can reduce energy consumption by two-thirds and improve throughput by over 10-fold compared to gas batch systems for non-ferrous metal preheating —
    the combination of energy savings, quality improvement, and throughput gains justifies the capital investment independently of renewable energy considerations.
