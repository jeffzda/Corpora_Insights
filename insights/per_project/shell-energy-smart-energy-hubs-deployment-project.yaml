  what_happened: The PDRS treated batteries simultaneously as both a load and a generator,
    creating ambiguity in cost allocation mechanisms and economics and adding compliance
    and financial risk for retailers participating in the scheme.
  lesson_learnt: Certificate-based demand response schemes should establish clear,
    consistent rules for how battery storage assets are classified and settled before
    scheme launch; treating batteries as both load and generator without a clear allocation
    rule introduces regulatory uncertainty that deters participation and may create
    unintended cross-subsidies.
