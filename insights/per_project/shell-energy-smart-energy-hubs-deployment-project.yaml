  what_happened: Growing rooftop solar penetration was causing negative power flows
    on distribution feeders in localised areas of networks, creating voltage and quality-of-supply
    issues and risking transformer damage, yet no standardised flexible demand network
    service existed to address this phenomenon.
  lesson_learnt: Distribution networks experiencing growing rooftop solar penetration
    should proactively develop bilateral flexible demand services for voltage support
    and negative flow management before these issues reach critical levels; new service
    development requires significant lead time for terms and conditions negotiation
    and aggregator engagement, and should not wait until the constraint becomes acute.
