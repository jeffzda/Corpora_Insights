- record_id: ARENA-DLV-11251
  source_title: Smart Energy Hubs Deployment Project Lessons Learnt Report 1
  publish_date: '2023-05-09'
  project_name: Shell Energy Smart Energy Hubs Deployment Project
  what_happened: During feasibility studies for BESS sizing at Smart Energy Hub candidate
    sites, Shell Energy found that most DNSPs would not provide indicative network
    export capacity until a formal grid connection application was submitted, preventing
    upfront optimisation of flexible demand capacity and creating additional engineering
    and commercial approval burdens.
  lesson_learnt: Submit grid connection applications at the start of the design process
    and engage DNSPs bilaterally on known constraints during initial site selection
    — withholding this information until application stage inhibits BESS sizing optimisation
    and adds unnecessary engineering rework and approval delays.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: commercial expansion
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: grid connection/system studies
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: coordination & stakeholders
  intervention_note: Shell Energy began engaging DNSPs bilaterally on known constraints
    based on initial site selection and submitting grid connection applications at
    the start of the design process to speed up design and implementation.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id001
  - 6
  evidence_excerpt: While some DNSPs provide fast and free preliminary feedback; the
    majority will not provide indicative capacity until a grid connection application
    is submitted. Not only does this inhibit optimisation of a Smart Energy Hub's
    Flexible Demand Capacity upfront, but it also creates additional barriers such
    as increased engineering work and further commercial approvals processes.
  confidence_note: null
