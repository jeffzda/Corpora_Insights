- record_id: ARENA-DLV-50529
  source_title: 'Smart Energy Hubs Stage 1 Report: Regulatory Reform'
  publish_date: 2023-03
  project_name: Smart Energy Hubs
  what_happened: The RERT timing of typical activation events did not align well with
    standard CAISO '10 of 10' baseline methodologies and many customer loads, meaning
    that RERT events could systematically produce inaccurate baselines that penalised
    rational customer behaviour rather than measuring the true demand response delivered.
  lesson_learnt: Before adopting a baseline methodology from another jurisdiction,
    scheme designers should assess whether the temporal pattern of scheme activation
    events is compatible with that methodology; the CAISO '10 of 10' approach was
    designed for a different demand pattern and its direct application to RERT creates
    systematic measurement error for the event types RERT is most likely to trigger.
