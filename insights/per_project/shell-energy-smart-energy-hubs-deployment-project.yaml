- record_id: ARENA-DLV-11253
  source_title: Smart Energy Hubs Deployment Project Lessons Learnt Report 1
  publish_date: '2023-05-09'
  project_name: Shell Energy Smart Energy Hubs Deployment Project
  what_happened: Shell Energy engineers found that physical space availability at
    candidate sites is a critical and frequently overlooked constraint on BESS deployment,
    with the 50 kW cabinet format requiring substantially more space, access clearance,
    and structural foundations per kW than the 250 kW packaged format, causing some
    financially viable sites to be physically unsuitable for the required capacity.
  lesson_learnt: Assess physical space availability and BESS packaging format compatibility
    (50 kW vs 250 kW cabinets) as early as possible in feasibility — a site whose
    financial model supports 150 kW may be physically unable to accommodate six 50
    kW cabinets, whereas two 250 kW cabinets may fit, provided the higher capital
    cost is financially viable.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: commercial expansion
  lifecycle_phase: concept/feasibility
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Shell Energy incorporated physical footprint assessment for BESS
    packaging into the early feasibility stage for all candidate sites, prioritising
    the 250 kW two-cabinet format for supermarket sites to simplify implementation.
  transferability: moderate
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id003
  - 7
  evidence_excerpt: A site where the financial model supports 150kW of capacity may
    not physically accommodate the six required cabinets. A 250kW solution of two
    cabinets may be physically supported by the location provided the increase in
    capital investment is feasible.
  confidence_note: null
