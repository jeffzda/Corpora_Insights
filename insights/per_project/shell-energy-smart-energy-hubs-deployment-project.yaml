- record_id: ARENA-DLV-50528
  source_title: 'Smart Energy Hubs Stage 1 Report: Regulatory Reform'
  publish_date: 2023-03
  project_name: Smart Energy Hubs
  what_happened: Implementing a deeming approach for volatile loads (such as batteries)
    in WDRM was assessed as requiring a rule change and an 18+ month implementation
    timeline, and faced significant cultural resistance among stakeholders who were
    risk-averse to accepting measurement inaccuracies, even where deeming would improve
    market participation.
  lesson_learnt: Introducing deeming as a measurement methodology for demand response
    requires a deliberate stakeholder change-management programme alongside any rule
    change process; cultural resistance to accepting that some measurement inaccuracy
    is an acceptable trade-off for market growth is a material implementation barrier
    that must be explicitly addressed, not assumed to resolve itself through the rule
    change process.
