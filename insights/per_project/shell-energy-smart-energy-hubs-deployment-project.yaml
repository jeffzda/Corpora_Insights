- record_id: ARENA-DLV-11255
  source_title: Smart Energy Hubs Deployment Project Lessons Learnt Report 1
  publish_date: '2023-05-09'
  project_name: Shell Energy Smart Energy Hubs Deployment Project
  what_happened: When the project needed to pivot to alternative candidate sites to
    meet program timelines, those sites had not been adequately onboarded, leading
    to difficulties obtaining site information, accessing assets such as switchboards
    and plant rooms, and a lack of understanding of the Smart Energy Hubs project
    among site operations staff — exposing the project to feasibility-stage delays.
  lesson_learnt: Engage site operations personnel (including site operations managers,
    specialised operations staff, and landlords where applicable) early and implement
    a communication plan before site inspections begin — sites that are not pre-briefed
    create information and access barriers that delay feasibility validation and can
    expose the project to missed demand flexibility opportunities.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: commercial expansion
  lifecycle_phase: concept/feasibility
  proponent_type: utility/energy retailer
  delay_category: stakeholder/land/community
  failure_mode: coordination & stakeholders
  outcome_class: delayed but recoverable
  secondary_failure_mode: null
  intervention_note: Shell Energy identified that customer candidate submissions should
    include site operations manager contacts and landlord details, and that a formal
    communication plan should be implemented to engage all key stakeholders ahead
    of site inspections.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: hybrid systems
  source_pages: &id005
  - 8
  evidence_excerpt: When it became necessary to pivot to alternative locations to
    meet the timelines of the program, sites were not as well informed. This led to
    difficulties with fulfilment of requests for information, access to assets such
    as switchboards or plant rooms, and a lack of understanding of the aims of the
    Smart Energy Hub project by site operations staff. This can expose the project
    to risks of delay at the feasibility stage.
  confidence_note: null
