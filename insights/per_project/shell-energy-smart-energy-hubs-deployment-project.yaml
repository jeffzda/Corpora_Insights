- record_id: ARENA-DLV-50530
  source_title: 'Smart Energy Hubs Stage 1 Report: Regulatory Reform'
  publish_date: 2023-03
  project_name: Smart Energy Hubs
  what_happened: The Smart Energy Hubs project identified that approximately $1.26
    billion in distribution network investment over 2025–2030 was potentially deferrable
    through non-network flexible demand solutions, yet the market and regulatory structures
    for procuring such services remained underdeveloped, meaning this value was unlikely
    to be captured without targeted reform.
  lesson_learnt: The quantum of deferrable network investment creates a compelling
    economic case for investing in the regulatory and market infrastructure needed
    to procure flexible demand as a network service; programme designers should use
    available network planning data to quantify and communicate the size of the non-network
    solution opportunity to motivate regulatory action.
