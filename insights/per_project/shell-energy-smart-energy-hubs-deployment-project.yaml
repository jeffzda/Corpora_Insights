  what_happened: The rapidly increasing penetration of rooftop solar PV across NEM
    regions was driving a decline in minimum operational demand, with the 2022 ESOO
    forecasting minimum operational demand to fall rapidly across all mainland NEM
    regions over the next five years, creating new challenges that existing flexible
    demand schemes were not designed to address.
  lesson_learnt: As distributed solar penetration accelerates, flexible demand schemes
    must be expanded beyond peak demand management to include minimum demand and load
    shifting services; schemes designed solely around maximum demand events will become
    progressively less relevant as the primary system challenge shifts to managing
    surplus generation during daytime periods.
