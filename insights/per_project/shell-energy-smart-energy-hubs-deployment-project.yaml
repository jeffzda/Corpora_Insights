- record_id: ARENA-DLV-50501
  source_title: 'Smart Energy Hubs Stage 1 Report: Regulatory Reform'
  publish_date: 2023-03
  project_name: Smart Energy Hubs
  what_happened: Uptake of C&I flexible demand participation in NEM market schemes
    (particularly WDRM and RERT) remained low despite the existence of multiple schemes,
    with only 28 registered NMIs and 65MW capacity in WDRM as at January 2023 — far
    below the estimated 1.8 GW potential for C&I flexible demand.
  lesson_learnt: Low participation in in-market demand response schemes relative to
    the available C&I flexible demand potential signals systemic barriers beyond simple
    market awareness; scheme design, baselining methodology, and transaction cost
    structure all require reform before C&I uptake can accelerate.
