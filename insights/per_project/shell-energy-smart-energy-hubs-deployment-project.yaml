- record_id: ARENA-DLV-11254
  source_title: Smart Energy Hubs Deployment Project Lessons Learnt Report 1
  publish_date: '2023-05-09'
  project_name: Shell Energy Smart Energy Hubs Deployment Project
  what_happened: Each Smart Energy Hub implementation became a large cross-functional
    project spanning multiple state boundaries and business units within Shell Energy,
    with technologies historically deployed on a technology-by-technology basis. Coordinating
    subject matter experts across HVAC, HVAC&R, BESS, solar, UPS, and backup generation
    simultaneously proved difficult and created capability gaps that slowed delivery.
  lesson_learnt: For integrated multi-technology DER deployments, formally onboard
    discipline-specific subject matter experts (e.g. BMS technicians, mechanical engineers,
    electrical engineers) into the program structure from the outset, using an informal
    matrix structure to close capability gaps and enable each functional area to progress
    engineering feasibility, detailed design, installation, and dispatch integration
    in parallel.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: commercial expansion
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: internal governance/resourcing
  failure_mode: coordination & stakeholders
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Shell Energy moved to onboard technology-specific subject matter
    experts into the program and create an informal matrix structure to systematically
    upskill the project team and enable greater functional autonomy.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hybrid systems
  source_pages: &id004
  - 7
  - 8
  evidence_excerpt: Maintaining engagement between subject matter experts and recently
    onboarded program contributors is key to being open to opportunities in terms
    of flexible demand capacity and cost per unit of flexible demand realised within
    a Smart Energy Hub.
  confidence_note: technology_domain set to hybrid systems reflecting the multi-technology
    (BESS, solar, HVAC, EV) integration nature of the program.
