  project_name: Smart Energy Hubs
  what_happened: The Peak Demand Reduction Scheme (PDRS), launched in NSW in November
    2022, initially excluded C&I customers and load shifting as eligible activities,
    with only residential and small business technologies approved, limiting C&I flexible
    demand participation and causing most retailers to face financial penalties in
    the scheme's early years.
  lesson_learnt: State-based demand response certificate schemes should include a
    clear, publicly committed roadmap and timeline for expanding eligible activities
    to C&I customers and load shifting from launch; restricting eligibility to residential
    and small business at commencement signals uncertainty that deters C&I investment
    in enabling technology and participation infrastructure.
