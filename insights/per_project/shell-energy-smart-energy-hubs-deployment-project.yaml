  what_happened: Information asymmetry between electricity networks and C&I customers
    or aggregators regarding where network constraints exist, what services are needed,
    and when they will be required made it difficult to build a business case for
    providing network support services, with limited public transparency on required
    services.
  lesson_learnt: Distribution networks should publish minimum mandatory information
    on constraint locations, required service types, typical contract terms, and tender
    processes in a standardised format; information asymmetry between networks and
    potential service providers is a structural market failure that prevents efficient
    non-network solutions from being developed and offered.
