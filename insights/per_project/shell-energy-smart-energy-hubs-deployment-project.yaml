  what_happened: The ex-post nature of WDRM baseline settlement meant customers did
    not know their entitlement until after the event, and the ex-ante price and volume
    for customers was highly uncertain, reducing the attractiveness of WDRM participation
    relative to alternative revenue streams available to C&I customers.
