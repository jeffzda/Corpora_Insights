- record_id: ARENA-DLV-50502
  source_title: 'Smart Energy Hubs Stage 1 Report: Regulatory Reform'
  publish_date: 2023-03
  project_name: Smart Energy Hubs
  what_happened: The WDRM baselining framework only approved four methodologies all
    based on the CAISO '10 of 10' framework, none of which are appropriate for temperature-sensitive,
    volatile, or EV/battery loads, effectively excluding a significant segment of
    C&I flexible demand from participating.
  lesson_learnt: Demand response scheme designers should develop temperature-sensitive
    and load-type-specific baselining methodologies from the outset; a single framework
    based on stable historical consumption patterns systematically excludes volatile
    and weather-sensitive loads that represent a major share of the C&I flexible demand
    opportunity.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: The report recommended developing new baselining methodologies
    for temperature-sensitive and volatile loads within WDRM and RERT, and investigating
    deeming approaches for loads such as batteries where conventional baselines are
    impractical.
  transferability: moderate
  delay_magnitude: null
  technology_domain: demand response
  source_pages: &id007
  - 56
  - 57
  evidence_excerpt: For WDRM, AEMO has currently approved four baseline methodologies
    that are all based on the CAISO '10 of 10' framework and differentiated by day
    type. None of the baselines are relevant for volatile or temperature sensitive
    loads.
