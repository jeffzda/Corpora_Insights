- record_id: ARENA-DLV-50503
  source_title: 'Smart Energy Hubs Stage 1 Report: Regulatory Reform'
  publish_date: 2023-03
  project_name: Smart Energy Hubs
  what_happened: Electricity networks and demand response providers treated simultaneous
    participation in WDRM (or RERT) and network services as effectively prohibited
    due to 'double dipping' concerns, even though no explicit regulatory prohibition
    existed, limiting participants' ability to value-stack and recover fixed costs.
  lesson_learnt: Where no regulatory prohibition on simultaneous service provision
    exists, market bodies and networks should proactively clarify and communicate
    that simultaneous participation is permitted; ambiguity and cultural conservatism
    can create de facto barriers as restrictive as formal rules, suppressing market
    participation.
