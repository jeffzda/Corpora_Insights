  what_happened: The RIT-D process and its $6 million threshold were identified as
    limiting the creation of an efficient price signal for network support services
    and reducing the number of non-network solution opportunities that were formally
    tested, with few examples of flexible demand being selected as the preferred option
    under a RIT-D.
  lesson_learnt: Regulatory investment test frameworks for distribution networks should
    be explicitly reviewed to ensure they are fit for purpose in evaluating flexible
    demand as a non-network option; a threshold and assessment process calibrated
    for traditional network capital expenditure may systematically undervalue flexible
    demand alternatives and entrench capital-intensive network investment.
