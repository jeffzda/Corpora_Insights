  what_happened: The RERT scheme had a weak compliance penalty regime — the only real
    financial consequence for non-compliance was loss of the pre-activation fee —
    creating insufficient incentives for providers to ensure reliable delivery, particularly
    as the scheme grew in scale.
  lesson_learnt: Demand response schemes that rely on out-of-market reserve provision
    require meaningful financial penalties for non-delivery to maintain the integrity
    of reserve commitments; where the only penalty is forfeiture of an availability
    payment, providers face an asymmetric risk structure that can encourage strategic
    non-compliance during high-value events.
