  project_name: Smart Energy Hubs
  what_happened: A cultural bias among distribution network businesses towards addressing
    network constraint issues through traditional capital network solutions rather
    than flexible demand service procurement was identified as a systemic barrier
    to non-network solution uptake, with stakeholders questioning whether networks
    were genuinely incentivised to offer flexible demand services.
  lesson_learnt: Regulatory frameworks for distribution networks should include explicit
    performance incentives for procuring and deploying non-network solutions; without
    such incentives, network businesses will default to capital expenditure solutions
    they are comfortable with, regardless of the relative economic merit of flexible
    demand alternatives.
