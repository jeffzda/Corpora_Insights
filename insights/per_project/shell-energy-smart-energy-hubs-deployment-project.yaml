- record_id: ARENA-DLV-11252
  source_title: Smart Energy Hubs Deployment Project Lessons Learnt Report 1
  publish_date: '2023-05-09'
  project_name: Shell Energy Smart Energy Hubs Deployment Project
  what_happened: Feasibility studies revealed that sizing BESS purely to offset site
    load (rather than accounting for network export value and demand response market
    revenues) caused sites to deploy sub-optimal BESS configurations — for example,
    four 50 kW cabinets instead of one 250 kW unit — incurring significantly higher
    civil, structural, and electrical installation costs per unit of capacity.
  lesson_learnt: BESS sizing for commercial and industrial Smart Energy Hubs should
    be based on best economics within network constraints rather than site load alone
    — accounting for export capacity and demand response market value can shift configurations
    toward larger packaged units with substantially lower cost per unit of flexible
    capacity.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: commercial expansion
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Shell Energy reframed BESS sizing methodology to optimise against
    the full value stack (demand response capacity, export revenue, and reduced installation
    costs), enabling selection of larger packaged 250 kW units where network constraints
    allow.
  transferability: moderate
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id002
  - 6
  - 7
  evidence_excerpt: Determination of flexible demand capability of a Smart Energy
    Hub should not be limited to site load, rather it should be based on best economics
    within the boundaries of network constraints. Early access to available export
    capacity can reduce cost and implementation barriers to significant additional
    volumes of flexible demand.
  confidence_note: secondary_failure_mode of cost overrun inferred from the description
    of higher deployment costs per cabinet relative to an optimised configuration;
    not stated as a formal overrun.
  source_url: https://arena.gov.au/knowledge-bank/smart-energy-hubs-deployment-project-lessons-learnt-report-1/
