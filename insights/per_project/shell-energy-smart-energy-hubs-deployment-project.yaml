  what_happened: An SGA operating within an embedded network was generally unable
    to access network tariff benefits because tariffs were applied at the parent meter
    level, structurally disadvantaging embedded network participants relative to grid-connected
    participants in the flexible demand market.
  lesson_learnt: When designing or reviewing SGA and embedded network participation
    frameworks, regulators should assess whether tariff application points create
    structural inequities for embedded network participants; tariff structures applied
    solely at parent meters may inadvertently suppress behind-the-meter flexible demand
    participation in shopping centres, commercial precincts, and similar embedded
    network environments.
