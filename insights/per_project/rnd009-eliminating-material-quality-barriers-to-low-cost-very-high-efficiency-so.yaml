- record_id: ARENA-DLV-69056
  source_title: Eliminating Material Quality Barriers to Low Cost, Very High Efficiency
    Solar Cells and Modules
  publish_date: '2018-05-31'
  project_name: RND009 Eliminating material quality barriers to low cost, very high
    efficiency solar cells and modules
  what_happened: The original detailed project plan attempted to specify research
    activities three years into the future; in practice, some of the most valuable
    research directions (e.g. daylight photoluminescence imaging of modules) emerged
    during execution and could not have been anticipated at project design stage.
  lesson_learnt: For multi-year cutting-edge R&D projects, scope project goals and
    tasks broadly enough to accommodate unforeseen research opportunities without
    requiring formal re-scoping — overly narrow task definitions constrain the ability
    to exploit unexpected high-value discoveries.
  issue_severity: minor
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: The team pursued emerging research directions (daylight photoluminescence
    imaging) outside the original task list; a follow-on ARENA project was initiated
    to fully exploit these new areas.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id006
  - 10
  evidence_excerpt: The original Project Plan for this project was very detailed and
    attempted to foresee our research activities 3 years into the future. In practice,
    we found that some of the most exciting and potentially valuable ideas (for example
    the specific methods used for daylight photoluminescence imaging of modules) occurred
    during the execution of the project, and they could not have reasonably been anticipated
    beforehand.
  confidence_note: issue_severity minor because the rigidity of the original plan
    created friction but did not prevent the project from being successful overall.
