  publish_date: '2018-05-31'
  project_name: RND009 Eliminating material quality barriers to low cost, very high
    efficiency solar cells and modules
  what_happened: An integrated ingot-to-module manufacturer (Trina Solar) was added
    to the consortium after project commencement, enabling large-scale industrial
    experiments across the full value chain that could not have been conducted with
    the original partners.
  lesson_learnt: Include an integrated PV manufacturer in the consortium from the
    beginning of future projects — their involvement enabled large sample-set experiments
    in an industrial setting, which reduced barriers to industry adoption of new metrology
    tools.
