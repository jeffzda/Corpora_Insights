  project_name: RND009 Eliminating material quality barriers to low cost, very high
    efficiency solar cells and modules
  what_happened: Initial six-monthly project meetings were structured as single-day
    workshops, which proved insufficient to cover collaboration topics in adequate
    depth across the multi-institutional team.
  lesson_learnt: For multi-partner R&D consortia, evolve collaboration workshops from
    single-day events into multi-day off-site retreats — the shift to three-day retreats
    hosted away from campus was significantly more effective at driving deep collaboration
    and building trust between teams.
