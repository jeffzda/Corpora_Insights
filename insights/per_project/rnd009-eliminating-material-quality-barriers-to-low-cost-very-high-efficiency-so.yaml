  publish_date: '2018-05-31'
  project_name: RND009 Eliminating material quality barriers to low cost, very high
    efficiency solar cells and modules
  what_happened: One of the original project consortium members, SunEdison (an ingot
    manufacturer), went into liquidation during the project, creating a gap in the
    consortium's value-chain coverage.
  lesson_learnt: Build consortia with multiple partners holding complementary expertise
    so that the loss of any single partner can be absorbed — redundancy in the consortium
    prevented SunEdison's liquidation from derailing the project. Include an integrated
    PV manufacturer from the outset to enable large-scale industrial testing.
