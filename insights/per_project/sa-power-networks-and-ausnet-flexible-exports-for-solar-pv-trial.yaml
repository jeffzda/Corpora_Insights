- record_id: ARENA-DLV-50559
  source_title: DEIP Market Integration Trials Summary Report 1.0
  publish_date: 2022-09
  project_name: SA Power Networks and AusNet Flexible Exports for Solar PV Trial
  what_happened: The SA Power Networks and AusNet Flexible Exports trial found that
    a high percentage of existing consumer inverters were incompatible with flexible
    export limits — AusNet identified that 90% of existing solar consumers in constrained
    network areas would be ineligible for the program due to their inverter not being
    flexible-exports capable.
  lesson_learnt: Before designing a flexible exports rollout program, audit the installed
    inverter base in target network areas for CSIP-AUS or flexible-export protocol
    compatibility — where 90% of existing devices are ineligible, program costs and
    consumer exclusion are far higher than anticipated and alternative pathways (e.g.
    gateways, incentivised hardware upgrades) must be planned from the outset.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: network business
  delay_category: commissioning/integration
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: The trial explored installing gateways or more expensive compatible
    inverters as workarounds to enable participation for non-compliant devices.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id001
  - 18
  evidence_excerpt: There is currently a lack of compatible technology that is flexible
    exports capable. This can increase the costs of participation (due to having to
    install a gateway or a more expensive compatible inverter) or cause a consumer
    to be ineligible for the program (AusNet identified that 90% of their existing
    consumers with solar in constrained network areas would be ineligible for the
    program due to their inverter).
