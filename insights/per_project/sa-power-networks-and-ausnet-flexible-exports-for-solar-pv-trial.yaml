- record_id: ARENA-DLV-50560
  source_title: DEIP Market Integration Trials Summary Report 1.0
  publish_date: 2022-09
  project_name: SA Power Networks and AusNet Flexible Exports for Solar PV Trial
  what_happened: The SA Power Networks and AusNet Flexible Exports trial found that
    solar retailers and installers are well placed to inform consumers about flexible
    export programs, but that solar retailers and installers required training to
    communicate the program accurately and to correctly install and commission hardware
    under flexible export arrangements.
  lesson_learnt: Leverage solar retailers and installers as a consumer communication
    channel for flexible export programs, but invest in structured training for these
    intermediaries before program rollout — inadequately trained installers and retailers
    will provide inaccurate program information to consumers and create commissioning
    errors.
  issue_severity: minor
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: network business
  delay_category: null
  failure_mode: execution & logistics
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id002
  - 18
  evidence_excerpt: The solar industry has many touch points with consumers and solar
    retailers or installers are well placed to provide information about the program
    to consumers. However, solar retailers must be well trained in providing information
    on flexible export programs and solar installers trained in installing and commissioning
    hardware under these arrangements.
