  what_happened: All existing commercial Grid-Forming Inverters in the NEM are BESS-based;
    there is only one reported international example of a wind farm operating in grid-forming
    mode (Siemens-Gamesa Desalloch, Scotland), and it operated in grid-forming mode
    for only six weeks with reported operational limitations when wind speed was declining
    or farm output was near zero.
  lesson_learnt: Grid-forming capability for wind turbines is technically feasible
    (Type 4 machines) but carries operational constraints — particularly near zero
    output and during wind speed decline — that must be addressed in project design
    and grid connection agreements before large-scale deployment; developers should
    plan for control system modifications to both the Machine-Side and Grid-Side Converter
    controllers.
