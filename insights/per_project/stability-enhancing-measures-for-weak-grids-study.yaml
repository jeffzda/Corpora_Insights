  secondary_failure_mode: regulatory & approvals
  intervention_note: Project developed a new impedance-based Stability Index (SI)
    that incorporates both SCR and X/R ratio, validated in simulation and experiment,
    and proposed its adoption for NEM system strength assessment.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: grid/system stability
