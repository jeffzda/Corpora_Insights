- record_id: ARENA-DLV-32652
  source_title: Stability Enhancing Measures for Weak Grids Study - Final Report
  publish_date: 2023-03
  project_name: Stability Enhancing Measures for Weak Grids Study
  what_happened: Many renewable energy farms in the NEM experience connection delays
    or output curtailment because the conventional Short-Circuit Ratio (SCR) metric
    used for system strength assessment does not account for the X/R ratio of the
    grid impedance — a system can be unstable even with SCR above 3 if the X/R ratio
    is high.
  lesson_learnt: Network planners and renewable project developers should assess system
    strength using impedance-based indices that incorporate both SCR and X/R ratio,
    not SCR alone; relying solely on SCR can lead to incorrect stability assessments
    and unexpected connection or curtailment issues.
