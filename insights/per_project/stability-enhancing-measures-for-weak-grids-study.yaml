- record_id: ARENA-DLV-32653
  source_title: Stability Enhancing Measures for Weak Grids Study - Final Report
  publish_date: 2023-03
  project_name: Stability Enhancing Measures for Weak Grids Study
  what_happened: Grid-Following Inverters (GFLIs), the dominant technology used in
    large-scale solar and wind farms, are prone to instability in weak grids due to
    their Phase-Locked Loop (PLL) synchronisation mechanism, causing some areas of
    the NEM with high IBR share to experience connection delays or generation curtailment.
  lesson_learnt: Solar and wind farm developers planning to connect to weak grid areas
    (SCR below 3) should assess PLL stability limits as part of the connection design
    process and consider PLL re-tuning, passivation techniques, or PLL-less control
    structures (PSGFLIs or GFMIs) to avoid curtailment or connection refusal.
