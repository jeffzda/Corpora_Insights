- record_id: ARENA-DLV-32656
  source_title: Stability Enhancing Measures for Weak Grids Study - Final Report
  publish_date: 2023-03
  project_name: Stability Enhancing Measures for Weak Grids Study
  what_happened: Grid-Following Inverters in weak grids (SCR ≤ 2) cannot transfer
    their full rated power when the grid is inductive, because the PLL stability limit
    and static power transfer limit constrain maximum transferable power to below
    nominal — meaning installed renewable capacity is effectively stranded unless
    mitigated.
  lesson_learnt: Renewable farm developers and network planners should quantify maximum
    transferable power using Output Capability Curves (OCCs) that account for both
    PLL stability limits and static transfer limits, and consider reactive power injection
    or PLL-less control to unlock full capacity in weak grid connection points.
