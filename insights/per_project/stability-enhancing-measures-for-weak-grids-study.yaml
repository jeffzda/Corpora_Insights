  what_happened: Fixed-value Virtual Resistor (FVR) methods for damping post-fault
    oscillations in GFMIs were found to be effective in low-SCR (weak grid) conditions
    but caused loss of synchronism in stiffer grids (SCR = 4.5), because the same
    fixed resistor value reactivated the current limiter after fault clearance in
    high-SCR scenarios.
  lesson_learnt: Post-fault oscillation damping control for GFMIs should use adaptive
    rather than fixed virtual resistor schemes; a fixed-value VR sized for weak grid
    conditions will cause loss of synchronism in stronger grids, and the appropriate
    VR size must be dynamically determined based on measured oscillation severity
    at the time of fault recovery.
