- record_id: ARENA-DLV-32657
  source_title: Stability Enhancing Measures for Weak Grids Study - Final Report
  publish_date: 2023-03
  project_name: Stability Enhancing Measures for Weak Grids Study
  what_happened: Conventional Virtual Synchronous Generator (VSG) controllers used
    in Grid-Forming Inverters cannot simultaneously achieve low overshoot and fast
    settling time in grid-connected mode while also providing adequate virtual inertia
    (low RoCoF) in standalone/islanded mode — a fundamental design trade-off that
    limits GFMI performance.
  lesson_learnt: BESS and GFMI project designers should not assume that standard VSG
    controller parameterisation will meet both grid-connected dispatch response and
    standalone inertia requirements; advanced controllers (GVSG, CGVSG, or H-infinity-based)
    should be specified to decouple these competing objectives, particularly where
    RoCoF relay compliance is required.
  issue_severity: moderate
  project_type: generation
  project_scale_band: utility/large-scale
  lifecycle_phase: development/design
  proponent_type: project developer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Project developed and experimentally validated GVSG, CGVSG, and
    H-infinity-based discrete-time controllers that achieve low overshoot and short
    settling time in grid-connected mode while adhering to RoCoF relay limits in standalone
    mode; CGVSG reduced overshoot from ~67% (VSG) to well-controlled levels.
  transferability: moderate
  delay_magnitude: null
  technology_domain: battery storage
