- record_id: ARENA-DLV-32664
  source_title: Stability Enhancing Measures for Weak Grids Study - Final Report
  publish_date: 2023-03
  project_name: Stability Enhancing Measures for Weak Grids Study
  what_happened: The project found that a small SynCon (10 MVA) installed at a weak
    grid connection point (SCR=2, X/R=10) did not reduce the stability index sufficiently
    to stabilise solar farm integration, while a 60 MVA or 100 MVA SynCon was required
    — demonstrating that SynCon sizing must be driven by impedance-based stability
    analysis, not a simple SCR threshold check.
  lesson_learnt: SynCon sizing decisions for renewable farm connection support should
    be based on impedance-based stability indices (incorporating X/R ratio) rather
    than SCR thresholds alone; undersized SynCons will not resolve instability, and
    the optimal size must balance stability margin against capital cost using quantified
    analysis.
