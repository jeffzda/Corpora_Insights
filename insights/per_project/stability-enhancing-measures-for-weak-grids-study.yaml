  publish_date: 2023-03
  project_name: Stability Enhancing Measures for Weak Grids Study
  what_happened: VSG-based GFMIs experience significant performance deterioration
    — including large oscillatory step responses — in strong grids (high SCR) and
    in grids with lower X/R ratios, because the inherent coupling between active and
    reactive power flow through the grid impedance is not accounted for in standard
    VSG parameterisation.
  lesson_learnt: GFMI control parameters should be adaptively tuned based on real-time
    grid impedance estimation to maintain consistent dynamic performance across both
    strong and weak grid conditions; fixed VSG parameters tuned for weak grids will
    produce excessive oscillations when the grid is strong, and vice versa.
