  intervention_note: Project developed a mixed-integer convex optimisation (semi-definite
    programming) method for optimal SynCon allocation and sizing at system level,
    validated on a modified IEEE 39-bus test system in PSCAD/EMTDC; convex approach
    yielded significantly smaller SynCon capacities than meta-heuristic methods.
