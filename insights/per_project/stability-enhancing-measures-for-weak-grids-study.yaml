  source_title: Stability Enhancing Measures for Weak Grids Study - Final Report
  publish_date: 2023-03
  project_name: Stability Enhancing Measures for Weak Grids Study
  what_happened: 'The existing optimisation-based PSGFLI and LPV-PSGFLI control strategies
    for PLL-less inverter operation were found to have a significant shortcoming:
    the LPV-PSGFLI strategy is highly sensitive to grid frequency deviation from nominal,
    causing steady-state errors in active and reactive power output and potentially
    driving the inverter to unstable operation under real-world frequency excursions.'
  lesson_learnt: PLL-less inverter control strategies for weak grid applications must
    be validated against realistic grid frequency deviation scenarios (not just steady-state
    nominal frequency) before deployment; control designs that are sensitive to frequency
    offset will produce steady-state power errors and potential instability in grids
    where frequency regulation is imperfect.
