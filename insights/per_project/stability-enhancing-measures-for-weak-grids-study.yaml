  secondary_failure_mode: unvalidated integration
  intervention_note: Project derived comprehensive small-signal models and validated
    experimentally that MPTC increases as inner ACC bandwidth increases (0.15 to 0.8
    pu across four bandwidth settings); eigenvalue analysis used to identify the high-frequency
    instability boundary.
