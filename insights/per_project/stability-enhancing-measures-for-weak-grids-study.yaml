  source_title: Stability Enhancing Measures for Weak Grids Study - Final Report
  publish_date: 2023-03
  project_name: Stability Enhancing Measures for Weak Grids Study
  what_happened: The project found that increasing the inner current controller (ACC)
    bandwidth of Grid-Following Inverters improves maximum transferable power in weak
    grids, but excessively high ACC bandwidth causes high-frequency instability (oscillation
    at ~240 Hz) due to time-delay effects in the digital control system.
  lesson_learnt: When tuning inverter current control bandwidths for weak grid operation,
    designers must balance the improvement in low-frequency PLL stability (which benefits
    from higher ACC bandwidth) against the risk of time-delay-induced high-frequency
    instability; a trade-off analysis using small-signal modelling should be conducted
    before commissioning.
  issue_severity: moderate
  project_type: generation
