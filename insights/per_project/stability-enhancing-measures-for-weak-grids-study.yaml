  source_title: Stability Enhancing Measures for Weak Grids Study - Final Report
  publish_date: 2023-03
  project_name: Stability Enhancing Measures for Weak Grids Study
  what_happened: Synchronous Condenser (SynCon) installations in the NEM have been
    planned on a project-by-project basis rather than at a network or REZ level, leading
    to suboptimal sizing and placement that does not minimise costs while maintaining
    system strength across all connection points.
  lesson_learnt: SynCon planning should be conducted at the NSP, REZ, or NEM system
    level — not on a project-by-project basis — using optimisation methods that simultaneously
    consider committed and upcoming renewable projects; this approach yielded significantly
    smaller and cheaper SynCon configurations than meta-heuristic project-level approaches.
