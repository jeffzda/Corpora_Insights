  what_happened: When targeting sites for RC20 installation near large-scale renewables
    in EQL's network, new connection projects proved unsuitable for inclusion because
    of their tight delivery timeframes and sensitivity, meaning most renewable-adjacent
    units had to be directed to existing customer connections rather than new ones.
  lesson_learnt: When planning demonstration deployments at renewable connection points,
