  project_name: NOJA Power Intelligent Switchgear
  what_happened: Some deployed RC20 PMU devices exhibited erroneous GPS values and
    data losses in the field, creating data quality issues that required a dedicated
    monitoring algorithm and a GPS synchronisation remediation exercise across all
    50 devices in a utility network before reliable data could be obtained.
  lesson_learnt: Include GPS/communications health monitoring as a standard element
    of any large-scale PMU deployment; plan for a post-installation GPS synchronisation
    verification and remediation pass before relying on data for analysis, as GPS
    lock failures and communications dropouts can silently corrupt measurement quality.
