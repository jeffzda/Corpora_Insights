  what_happened: The rapid deployment of solar PV in Queensland distribution networks
    was found to be accelerating aging and deterioration of electrical assets (transformers,
    tap changers, capacitor banks) that were originally designed for uni-directional,
    slow-changing power flow, with a large amount of Queensland distribution equipment
    already exceeding designed lifetime, posing reliability risks.
  lesson_learnt: Network planning for high-penetration solar PV zones must account
    for accelerated asset aging as a material risk — assets designed for uni-directional
    power flow are subject to increased operational stress from bi-directional flows
    and PV fluctuations, and asset management strategies should be updated to incorporate
    condition monitoring approaches (such as PMU-based SNR analysis) rather than relying
    on fixed-interval inspection programs.
