  what_happened: Analysis of a major under-frequency network event using PMU data
    from across the Energy Queensland network revealed that solar-connected sites
    exhibited higher current and voltage standard deviations, longer stabilisation
    times (approximately 15 seconds vs 5 seconds for conventional), and larger negative-sequence
    voltage peaks (approximately three times higher) compared to conventional and
    hydropower generation sites during the event.
