  what_happened: Analysis of 18 MV distribution feeders in Energy Queensland's network
    using PMU data and postcode-level solar generation data found that some residential
    feeders (e.g. R5) exceeded the Australian voltage deviation limit of ±5% — with
    a 95th-percentile VDI of 10.6% — at solar generation levels around 20 MW, identifying
    them as constrained for further renewable uptake under existing conditions.
  lesson_learnt: Utilities planning to increase renewable hosting capacity on MV feeders
    should use PMU-derived voltage indices (particularly VDI) correlated with postcode-level
    solar generation data to identify feeders where voltage standards are already
    being violated under current penetration levels, before approving additional connections
    — this data-driven approach can replace conservative blanket limits with feeder-specific
    assessments.
