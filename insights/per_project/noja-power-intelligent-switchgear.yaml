- record_id: ARENA-DLV-66817
  source_title: NOJA Power Intelligent Switchgear Final Report
  publish_date: 2021-09
  project_name: NOJA Power Intelligent Switchgear
  what_happened: The project found that the transformer SNR variation band remained
    consistent and showed no significant change during a two-month accelerated aging
    experiment in which the transformer remained in good condition (equivalent age
    12.9 years), validating that SNR stability is a reliable baseline indicator but
    noting that the experiment could not be extended to transformer failure due to
    time constraints.
  lesson_learnt: PMU-based SNR monitoring shows promise as a low-cost transformer
    health indicator but requires long-duration experiments through to failure to
    establish the relationship between SNR deviation and impending failure — future
    programs should plan for multi-year experiments rather than two-month trials to
    generate actionable predictive maintenance thresholds.
