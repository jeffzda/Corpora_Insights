  what_happened: 'Two different data collection architectures were required to be
    developed for the two utility partners: Energy Queensland used a private 4G network
    feeding through firewalls into a DMZ and then via VPN to a NOJA Azure cloud VM,
    while AusNet sent data directly from field units to the Azure VM via VPN tunnel,
    reflecting differing network security and operational technology architectures
    between utilities.'
  lesson_learnt: When deploying connected field devices across multiple utility partners,
    plan for divergent data communication architectures from the outset — each utility's
    OT network security posture and firewall topology will likely require a bespoke
    integration solution, adding engineering effort that should be scoped and budgeted
    separately for each partner.
