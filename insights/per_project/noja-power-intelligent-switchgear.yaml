- record_id: ARENA-DLV-66818
  source_title: NOJA Power Intelligent Switchgear Final Report
  publish_date: 2021-09
  project_name: NOJA Power Intelligent Switchgear
  what_happened: The project identified that the reduction in power system inertia
    caused by increasing DER penetration leads to steeper system-wide frequency fluctuations
    and shorter response windows, and that effective inertia varies regionally across
    the distribution network — a dynamic that existing SCADA-based monitoring cannot
    capture but that PMU data can address through real-time synchrophasor measurements.
  lesson_learnt: As DER penetration increases, system operators should deploy PMU-based
    real-time inertia monitoring at the distribution level — regional variation in
    effective inertia means that transmission-level inertia estimates are insufficient
    for managing frequency stability, and the shorter response windows created by
    low-inertia conditions require the sub-second resolution that only PMUs can provide.
