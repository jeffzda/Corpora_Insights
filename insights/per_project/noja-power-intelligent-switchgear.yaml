  source_title: NOJA Power Intelligent Switchgear Final Report
  publish_date: 2021-09
  project_name: NOJA Power Intelligent Switchgear
  what_happened: Installation and data streaming for RC20 units in both the Energy
    Queensland and AusNet networks were delayed by natural disasters (bushfires and
    flooding) and the COVID-19 pandemic, which forced EQL to reprioritise field resources
    and carry out only essential operational work during December 2019–February 2020.
    Data streaming from all AusNet units was not completed until August 2021.
  lesson_learnt: Deployment schedules for field installation programs should include
    contingency for force-majeure events such as natural disasters and pandemics,
    particularly in regions with known bushfire or flood risk; co-ordinate with utility
    partners early to understand their resourcing prioritisation protocols during
    such events.
