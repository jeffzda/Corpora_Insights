  what_happened: The project demonstrated that a PMU-based Isolation Forest arcing
    detection approach could identify insulator arcing faults at low resolution (one
    sample per cycle / 20 ms PMU data) with timing accuracy comparable to high-resolution
    power quality meter waveform data (detected arcing duration 80 ms vs PQM benchmark
    of 76 ms), providing a computationally lightweight alternative to waveform-based
    methods.
  lesson_learnt: For network asset condition monitoring programs seeking to detect
    insulator arcing faults, low-resolution PMU data combined with an unsupervised
    Isolation Forest algorithm can achieve near-equivalent detection accuracy to high-resolution
    waveform monitoring at significantly lower computational cost and without requiring
    prior knowledge of arcing events — making it viable for large-scale fleet deployment.
