  source_title: NOJA Power Intelligent Switchgear Final Report
  publish_date: 2021-09
  project_name: NOJA Power Intelligent Switchgear
  what_happened: The project demonstrated that GPS-timestamped PMU data enables cross-correlation
    of events across multiple distributed devices, allowing operators to distinguish
    transmission-level events (visible to all PMUs simultaneously) from local distribution-level
    events (visible only to nearby PMUs), a capability not available with conventional
    SCADA.
  lesson_learnt: When designing distribution network monitoring systems for high-renewable
    environments, GPS-synchronised PMU timestamping should be specified as a baseline
    requirement — the ability to correlate events across multiple devices simultaneously
    is essential for distinguishing transmission-level disturbances from local distribution
    events, which has direct implications for protection coordination and fault response.
