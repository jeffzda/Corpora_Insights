  source_title: NOJA Power Intelligent Switchgear Final Report
  publish_date: 2021-09
  project_name: NOJA Power Intelligent Switchgear
  what_happened: The project found that conventional methods for voltage stability
    assessment (e.g. continuation power flow) are computationally too slow for real-time
    distribution network applications, and that a least-squares PMU-based Thevenin
    equivalent framework developed in the project could calculate maximum loading
    point in real-time without requiring system topology knowledge, with approximately
    5% error validated against MATPOWER on an IEEE 33-bus system.
  lesson_learnt: For real-time voltage stability monitoring in distribution networks
    with high renewable penetration, deploy PMU-based Thevenin equivalent estimation
    rather than topology-dependent power flow methods — the PMU approach eliminates
    the need for system model knowledge and is computationally feasible for online
    applications, enabling network operators to identify proximity to voltage collapse
    in real time.
