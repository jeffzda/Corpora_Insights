- record_id: ARENA-DLV-66807
  source_title: NOJA Power Intelligent Switchgear Final Report
  publish_date: 2021-09
  project_name: NOJA Power Intelligent Switchgear
  what_happened: The project demonstrated that integrating PMU capability into an
    existing recloser controller (RC20) consolidates multiple discrete protection
    devices — including passive anti-islanding, loss of mains, reverse power, and
    neutral voltage displacement protection — into a single lower-cost unit, reducing
    installation time and coordination complexity for medium-scale renewable generator
    connections (30 kW–5 MW).
  lesson_learnt: For medium-scale DER connections to MV distribution networks, consider
    integrated switchgear solutions that combine protection, synchronisation, and
    PMU functions in one device — using discrete devices from multiple suppliers significantly
    increases installation complexity, coordination effort, and connection cost.
