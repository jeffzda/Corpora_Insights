- record_id: ARENA-DLV-2553
  source_title: 'ARENA Insights Hot Decarbonisation Webinar: Renewable Heat and Energy
    Efficiency at Industrial Facilities'
  publish_date: 2024-10
  project_name: Closing the Loop on Red Meat Processing Energy and Emissions (G. &
    K. O'Connor)
  what_happened: The study found that energy efficiency improvement (the 'Efficiency
    Led' scenario) offered the most attractive payback and highest NPV of all decarbonisation
    scenarios assessed, with the principle that reducing energy demand first reduces
    the size and cost of subsequent electrification investments.
  lesson_learnt: Prioritise energy efficiency measures before fuel substitution —
    reducing load first lowers the capital cost of electrification and delivers the
    strongest near-term financial returns; this sequence should be the default roadmap
    for industrial decarbonisers.
