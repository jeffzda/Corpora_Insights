- record_id: ARENA-DLV-2551
  source_title: 'ARENA Insights Hot Decarbonisation Webinar: Renewable Heat and Energy
    Efficiency at Industrial Facilities'
  publish_date: 2024-10
  project_name: Closing the Loop on Red Meat Processing Energy and Emissions (G. &
    K. O'Connor)
  what_happened: Before the study commenced, G. & K. O'Connor had only ad-hoc manual
    energy readings and no centralised metering system, making it impossible to quantify
    Scope 1 and 2 emissions or identify decarbonisation opportunities without first
    installing a comprehensive metering and monitoring system.
  lesson_learnt: Metering and monitoring is the essential first step before any decarbonisation
    study — without centralised, real-time energy data it is not possible to quantify
    emissions, validate assumptions, or prioritise investments.
