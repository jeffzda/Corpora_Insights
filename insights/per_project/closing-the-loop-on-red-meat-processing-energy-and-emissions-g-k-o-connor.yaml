- record_id: ARENA-DLV-2576
  source_title: 'ARENA Insights Hot Decarbonisation Webinar: Renewable Heat and Energy
    Efficiency at Industrial Facilities'
  publish_date: 2024-10
  project_name: Closing the Loop on Red Meat Processing Energy and Emissions (G. &
    K. O'Connor)
  what_happened: GKO's feasibility study found that cultural change and training are
    critical barriers to embedding energy management as business-as-usual, and that
    an energy management system functions as a catalyst for the organisational-wide
    focus on energy performance targets required to realise efficiency savings.
  lesson_learnt: Invest in training and organisational change management alongside
    technical energy systems — an energy management system without a corresponding
    cultural change programme will not deliver sustained energy performance improvement
    in a medium-sized industrial operation.
