  source_title: Platform for Solar Farm Pre-Commissioning - Final Knowledge Sharing
    Report
  publish_date: 2024-03
  project_name: Platform for Solar Farm Pre-Commissioning (SFPP)
  what_happened: The industry's current practice of assessing the AGCS only on-site
    during the commissioning period means that integration problems between the AGCS,
    PV panels, and inverters — supplied by different manufacturers — are not identified
    until after construction, as no pre-commissioning hardware platforms or defined
    testing standards existed in the market.
  lesson_learnt: Because AGCS equipment, PV panels, and inverters are often supplied
    by different manufacturers and are not integrated or tested by any single party
    in a HIL setup prior to on-site commissioning, projects should insist on pre-commissioning
    HIL validation of the full AGCS to detect integration failures before the costly
    on-site phase.
