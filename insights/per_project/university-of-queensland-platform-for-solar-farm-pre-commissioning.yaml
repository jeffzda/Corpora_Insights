  source_title: Platform for Solar Farm Pre-Commissioning - Final Knowledge Sharing
    Report
  publish_date: 2024-03
  project_name: Platform for Solar Farm Pre-Commissioning (SFPP)
  what_happened: Many solar PV farms in construction and commissioning experienced
    delays because hardware test results did not match the submitted software models
    (PSSE/PSCAD) within AEMO's required ±10% tolerance, triggering multiple iterations
    of model revision, re-testing, and due diligence reviews by network service providers
    before grid connection could proceed.
  lesson_learnt: Solar farm developers should validate the Aggregated Generator Control
    System (AGCS) hardware against software models in a Hardware-in-the-Loop (HIL)
    pre-commissioning platform before on-site commissioning — hardware-software mismatches
    discovered only during on-site R2 testing cause repeated model iterations and
    significant commissioning delays.
