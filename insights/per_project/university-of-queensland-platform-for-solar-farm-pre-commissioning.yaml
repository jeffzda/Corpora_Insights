  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The HIL pre-commissioning platform enabled firmware version differences
    to be identified and characterised in a laboratory setting before on-site tests,
    allowing teams to select or lock the appropriate firmware version.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
