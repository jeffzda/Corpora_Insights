  what_happened: The voltage reference step change test (TSP2) showed noticeable dynamic
    response discrepancies between the RTDS HIL setup and the PSCAD simulation, even
    though steady-state voltage magnitudes matched well, suggesting the dynamic mismatch
    could provide insights for refining the R1 software model to improve R1-to-R2
    alignment.
  lesson_learnt: Dynamic mismatches between HIL and PSCAD simulation results — even
    when steady-state values align — should be treated as diagnostic signals rather
    than test failures; they indicate where the R1 software model may diverge from
    hardware behaviour and should be used to refine the model before on-site R2 commissioning.
