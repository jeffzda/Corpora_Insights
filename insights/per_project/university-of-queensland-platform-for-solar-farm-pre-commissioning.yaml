- record_id: ARENA-DLV-45256
  source_title: Platform for Solar Farm Pre-Commissioning - Final Knowledge Sharing
    Report
  publish_date: 2024-03
  project_name: Platform for Solar Farm Pre-Commissioning (SFPP)
  what_happened: Frequency data obtained via PQM-PLC-RTDS Modbus showed significant
    discrepancies compared to PQM internal logging files, and the starting points
    of frequency responses from the two sources were not synchronised via GPS, introducing
    measurement inconsistencies that could affect commissioning test compliance assessment.
  lesson_learnt: When using Modbus communication to relay frequency measurements from
    a PQM during commissioning, teams should verify that the Modbus-relayed data is
    consistent with PQM internal logs and that time synchronisation (e.g. via GPS)
    is in place — Modbus-relayed frequency data can exhibit substantial discrepancies
    that may compromise compliance assessments against AEMO's ±10% tolerance.
  issue_severity: moderate
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: research organisation/university
  delay_category: data/validation/testing
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated integration
  intervention_note: The project identified the GPS time-synchronisation gap and flagged
    that frequency data from PQM internal logs (rather than Modbus relay) exhibits
    the least error and should be used as the reference source.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id004
  - 15
  evidence_excerpt: Among these three sources of frequency data, the average frequency
    extracted from the PQM's internal logging files exhibits the least amount of error.
    Notably, the frequency data acquired through PQM-PLC-RTDS Modbus displays significant
    discrepancies... the starting points of the frequency responses recorded by PQM-PLC-RTDS
    Modbus and from the PQM's internal logging files are not synchronized in time
    via the global positioning system.
  confidence_note: null
