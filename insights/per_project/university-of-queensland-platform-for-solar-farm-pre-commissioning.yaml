  what_happened: Benchmarking between PSCAD and RSCAD models during platform development
    revealed that the average voltage mismatch was 0.2–0.36%, active power mismatch
    0.05–0.21%, and reactive power mismatch 0.07–0.22% across six operating conditions
    — all within acceptable margins, validating the RSCAD model for subsequent HIL
    tests.
