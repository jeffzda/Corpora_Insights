  publish_date: 2024-03
  project_name: Platform for Solar Farm Pre-Commissioning (SFPP)
  what_happened: The established SFPP platform does not yet incorporate SCADA systems
    used in renewable energy farms, fault testing procedures, DC-side dynamics, or
    battery management systems — identified as gaps in the current platform's coverage
    that limit its applicability to the full commissioning test suite.
  lesson_learnt: Future iterations of solar farm and hybrid storage pre-commissioning
    platforms should incorporate SCADA integration, DC-side dynamics, battery management
    systems, and full fault testing procedures — the absence of these elements in
    the current SFPP limits pre-commissioning coverage and leaves residual commissioning
    risks unaddressed.
