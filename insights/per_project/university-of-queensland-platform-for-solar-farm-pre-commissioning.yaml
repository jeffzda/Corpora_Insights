- record_id: ARENA-DLV-45255
  source_title: Platform for Solar Farm Pre-Commissioning - Final Knowledge Sharing
    Report
  publish_date: 2024-03
  project_name: Platform for Solar Farm Pre-Commissioning (SFPP)
  what_happened: PQM voltage measurement delays averaging 130 ms mean that after a
    real fault clears and the PPC regains control, the PPC continues to receive a
    delayed low-voltage signal from the PQM, which can trigger excessive capacitive
    reactive power injection and cause over-voltage at inverter terminals.
  lesson_learnt: Solar farm commissioning engineers should be aware that PQM voltage
    measurement latency can cause post-fault over-voltage at inverter terminals —
    the PPC receives a falsely low voltage signal for ~130 ms after fault clearance,
    triggering a reactive power response that overshoots. Pre-commissioning HIL testing
    can identify this behaviour before on-site testing.
  issue_severity: moderate
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: research organisation/university
  delay_category: data/validation/testing
  failure_mode: unvalidated integration
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: data & measurement
  intervention_note: HIL testing with the TSP1 setup enabled measurement and quantification
    of PQM Modbus delays across multiple fault types, providing data to inform commissioning
    tolerance assessments.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages:
  - 15
  - 20
  - 21
  evidence_excerpt: Such a voltage measurement delay may create over overvoltage issue
    of PV inverters. This is because after the real fault is cleared and PPC regains
    system control, PPC receives the significantly delayed POC fault voltage from
    the PQM. Such a low voltage may trigger a higher capacitive reactive power which
    causes an over-voltage at inverter terminals.
