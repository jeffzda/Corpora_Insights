- record_id: ARENA-DLV-45257
  source_title: Platform for Solar Farm Pre-Commissioning - Final Knowledge Sharing
    Report
  publish_date: 2024-03
  project_name: Platform for Solar Farm Pre-Commissioning (SFPP)
  what_happened: Different firmware versions of the real Power Plant Controller (PPC)
    produced distinct dynamic frequency responses in pre-commissioning tests — an
    older firmware version showed notably faster responses than the upgraded version
    — creating potential mismatches with PSCAD/PSSE software models that do not require
    firmware versioning.
  lesson_learnt: Before on-site commissioning, confirm that the PPC firmware version
    deployed in the field matches the version used in pre-commissioning HIL tests
    and is consistent with the software model behaviour — firmware updates can materially
    alter dynamic response characteristics, causing unexpected mismatches against
    AEMO's R1 software model that will block commissioning progression.
  issue_severity: moderate
  project_type: generation
