- record_id: ARENA-DLV-45258
  source_title: Platform for Solar Farm Pre-Commissioning - Final Knowledge Sharing
    Report
  publish_date: 2024-03
  project_name: Platform for Solar Farm Pre-Commissioning (SFPP)
  what_happened: Incorrect parameter mapping in the PPC — for example, a voltage droop
    value assigned in the wrong register compared to the software model — produced
    substantial steady-state discrepancies between pre-commissioning platform results
    and field commissioning outcomes, with the potential to cause significant commissioning
    delays.
  lesson_learnt: Rigorously verify PPC parameter mapping against the software model
    before commencing HIL or on-site commissioning tests — a single incorrectly positioned
    parameter (e.g. voltage droop value) can produce large steady-state deviations
    that will fail AEMO's ±10% acceptance criterion and trigger repeated commissioning
    iterations.
  issue_severity: major
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: research organisation/university
  delay_category: commissioning/integration
  failure_mode: unvalidated integration
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: data & measurement
  intervention_note: Within the established SFPP platform, parameter mismatches can
    be identified and rectified in a laboratory environment before on-site commissioning,
    avoiding the delays that would arise if discovered during field testing.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id006
  - 16
  evidence_excerpt: If any parameter is incorrectly assigned, it can result in a substantial
    discrepancy between the response obtained through software and the outcomes of
    field commissioning... if the voltage droop value is erroneously positioned differently
    from the software-based model, it can lead to a considerable disparity in steady-state
    results. This misalignment has the potential to cause significant delays during
    commissioning.
