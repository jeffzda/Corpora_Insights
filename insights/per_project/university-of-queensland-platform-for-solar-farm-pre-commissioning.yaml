- record_id: ARENA-DLV-45253
  source_title: Platform for Solar Farm Pre-Commissioning - Final Knowledge Sharing
    Report
  publish_date: 2024-03
  project_name: Platform for Solar Farm Pre-Commissioning (SFPP)
  what_happened: During HIL testing, voltage disturbances were found to cause instances
    of frequency overshoot following fault clearance, with an overall occurrence probability
    of 54% — higher for three-phase voltage events (32%) than for L-L and single-phase
    faults (22%) — including a 12% probability of overshoot in the 2.8–3 Hz range
    lasting 100 milliseconds.
  lesson_learnt: Pre-commissioning HIL testing should specifically test for frequency
    overshoot following voltage fault clearance, as this failure mode occurs in over
    half of voltage disturbance events and is difficult to predict from software models
    alone; three-phase faults carry the highest risk.
  issue_severity: moderate
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: research organisation/university
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The SFPP HIL platform enabled systematic characterisation of
    frequency overshoot probability across fault types, providing quantified risk
    data that can inform commissioning test design.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id003
  - 15
  evidence_excerpt: The occurrence of this frequency overshoot is hard to predict
    accurately and it varies based on the fault type and duration. Regarding the HIL
    experiments results, the overall occurrence probability of the frequency overshoot
    is 54% and the occurrence probability of the frequency overshoot is higher for
    three-phase voltage events (32%) compared with L-L fault and single-phase faults
    (total 22%).
