  what_happened: Some PPC devices from certain OEMs cannot activate their reactive
    power control loop in a HIL test environment unless specific real-time feedback
    signals (read input registries) from the inverter are present, limiting the completeness
    of HIL testing and creating a dependency on OEM cooperation and hardware configuration.
  lesson_learnt: When planning HIL pre-commissioning tests, confirm with the PPC OEM
    whether the reactive power control loop requires live inverter feedback signals
    to activate — if so, the HIL test setup must replicate these signals or the reactive
    power control validation will be incomplete, leaving a commissioning risk undetected.
