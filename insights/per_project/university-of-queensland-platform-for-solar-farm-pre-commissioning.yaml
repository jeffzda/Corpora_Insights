  outcome_class: knowledge generated despite setback
  secondary_failure_mode: data & measurement
  intervention_note: The project identified this dependency and recommended ascertaining
    the total number of inverters as a prerequisite configuration step before HIL
    experiments.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id010
  - 24
  evidence_excerpt: The action of the controller depends on the number of inverters,
    which is reversely related to the integral gain of the controller (for particular
    settings of PPC). For example, the controller responds slowly due to the large
    integral time constant. On the other hand, it may lose the system stability for
    a small integral time constant.
