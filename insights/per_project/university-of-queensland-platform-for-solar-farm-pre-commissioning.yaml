  publish_date: 2024-03
  project_name: Platform for Solar Farm Pre-Commissioning (SFPP)
  what_happened: The integral gain of the PPC controller is inversely related to the
    number of inverters in the solar farm model; using an incorrect inverter count
    in the HIL platform resulted in controller responses that were either too slow
    (large integral time constant) or unstable (small integral time constant), degrading
    the fidelity of pre-commissioning test results.
  lesson_learnt: When setting up a HIL pre-commissioning platform for a solar farm,
    confirm the exact total number of inverters from the farm design and configure
    this in the real-time model before testing — inverter count directly affects PPC
    controller gain and an incorrect value will produce unrepresentative dynamic responses.
  issue_severity: minor
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: research organisation/university
  delay_category: data/validation/testing
