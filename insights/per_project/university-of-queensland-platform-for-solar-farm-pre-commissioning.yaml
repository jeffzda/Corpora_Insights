    conduct steady-state and dynamic benchmarking against PSCAD — errors below ~0.4%
    for voltage and ~0.22% for power confirm the real-time model is sufficiently accurate
    for AGCS validation, and this step should be treated as a mandatory quality gate
    before commencing HIL experiments.
