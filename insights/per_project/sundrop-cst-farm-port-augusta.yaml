- record_id: ARENA-DLV-70560
  source_title: Industry Development Opportunities from Developing Concentrating Solar Thermal Power in Australia
  publish_date: 2018-04
  project_name: Sundrop CST Farm, Port Augusta
  what_happened: The Sundrop CST farm at Port Augusta was successfully delivered using Australian EPC (John Holland) and civil works (Broadspectrum) contractors, with SA-based Sage Automation developing
    and supplying the integration systems. This demonstrated that Australian firms across EPC, civil works and control/integration segments can successfully deliver a commercial-scale CST plant.
  lesson_learnt: Australian EPC contractors, civil works firms and systems integrators have demonstrated capability to deliver commercial CST projects — future CST projects should actively assess local
    options in these segments rather than defaulting to international contractors. SA-based integration capability (Sage Automation) and national EPC firms (John Holland, Broadspectrum) have proven track
    records on the Sundrop project.
