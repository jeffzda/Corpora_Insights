- record_id: ARENA-DLV-72208
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects - First Edition Results'
  publish_date: null
  project_name: Adelaide Solar City
  what_happened: In-home display devices deployed to 481 participants in the Adelaide Solar City trial resulted in a 10.9% reduction in peak electricity consumption during the 2012 critical peak period,
    with 94% of surveyed participants agreeing the devices helped them understand their energy consumption.
  lesson_learnt: In-home displays that provide real-time energy consumption feedback can achieve approximately 10% peak demand reductions without requiring a price signal — deploying these devices at scale
    is a cost-effective demand management intervention.
