- record_id: ARENA-DLV-72207
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects - First Edition Results'
  publish_date: null
  project_name: Adelaide Solar City
  what_happened: A large-scale demand management trial involving 2,803 households in Adelaide tested Critical Peak Pricing (CPP) and Time of Use (TOU) pricing alongside smart meters and in-home displays.
    CPP participants reduced electricity usage by an average of 14% on critical peak days, while TOU participants shifted 7% of consumption from peak to off-peak periods.
  lesson_learnt: Critical Peak Pricing combined with smart metering and in-home displays can reliably deliver 14% demand reductions during peak events — this combination of price signal, real-time feedback
    and customer engagement is transferable to other demand management programs seeking peak reduction.
