- record_id: ARENA-DLV-48106
  source_title: ARENA-Funded Cutting Edge Research in Photovoltaics
  publish_date: 2019-09
  project_name: Tandem PV Micro-Concentrator (2017/RND020)
  what_happened: The team applied the Sliver technique to GaAs material and evaluated
    two dicing methods — conventional dicing saw and ICP/RIE etching. The conventional
    dicing method was found to be less effective; ICP/RIE was identified as the most
    efficient approach for producing the required microstructures (100 µm deep, 23
    µm wide), proving the technical viability of the Sliver technique for GaAs.
  lesson_learnt: When adapting Sliver-type micro-structuring techniques to new semiconductor
    materials such as GaAs, evaluate ICP/RIE before conventional dicing — ICP/RIE
    produces narrower, higher-quality grooves with better selectivity, and assuming
    transferability of dicing parameters from Si to III-V materials risks suboptimal
    results.
