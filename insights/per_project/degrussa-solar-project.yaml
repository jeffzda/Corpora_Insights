  source_title: DeGrussa Solar Project Report
  publish_date: 2017-03
  project_name: DeGrussa Solar Project
  what_happened: Constructing a utility-scale solar PV and battery system on a brownfield
    mine site introduced significant administrative burden and mobilisation complexity,
    including FIFO roster management, first-time mobilisation requirements (medicals,
    mine approvals, flight and accommodation bookings), and high labour turnover due
    to repetitive tasks in summer heat.
  lesson_learnt: Define all mine processes, procedures, documentation requirements
    and operational expectations with the mine operator before mobilisation — pre-construction
    planning workshops are essential to align stakeholders and prevent administrative
    delays during construction.
