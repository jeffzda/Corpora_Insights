  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Extended working days to 12 hours and increased piling equipment
    from two rigs to three piling rigs, one auger drill rig and two hammer drill rigs
    to recover programme.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
