  what_happened: All interfaces between project construction activities and mine operations
    (HV switching, cable runs across vehicle routes, shutdowns of the processing facility,
    shared access road loading) required additional planning, time and resources,
    and commissioning tests that could affect operations had to be scheduled around
    mine maintenance days.
  lesson_learnt: Physically and contractually segregate solar-hybrid project works
    from mine operations wherever possible — overlapping interfaces multiply planning
    effort and create dependencies on mine personnel availability; clarify and agree
    electrical connection, energisation and hybrid control integration plans before
    construction begins.
