  source_title: DeGrussa Solar Project Report
  publish_date: 2017-03
  project_name: DeGrussa Solar Project
  what_happened: Battery station cabling between the AC cabinet and the transformer
    kiosk needed to carry ~4,300 A per battery inverter container; traditional cabling
    in cable tray was assessed as presenting constructability and operational complications,
    so bus duct was selected instead, delivering a faster installation at similar
    overall cost.
  lesson_learnt: For high-current battery station connections at remote sites with
    high labour rates, specify bus duct over traditional cabling in cable tray — installation
    is faster and more reliable, and total cost including design and supply is comparable.
