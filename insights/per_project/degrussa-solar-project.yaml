- record_id: ARENA-DLV-50201
  source_title: DeGrussa Solar Project Report
  publish_date: 2017-03
  project_name: DeGrussa Solar Project
  what_happened: Hard pan geology (3.5–5.5 MPa) located 200–1,000 mm below the topsoil
    was identified during early development, but piling works still took approximately
    twice as long as expected despite pre-construction testing, requiring the contractor
    to extend working days from 10 to 12 hours and increase equipment from two piling
    rigs to three plus additional hammer drill rigs.
  lesson_learnt: Use the exact equipment proposed for the project during pre-construction
    geotech testing — using different equipment produces unreliable time and cost
    estimates. If piling targets are not being met early, change processes or source
    larger/different machines immediately rather than persisting with the original
    setup.
  issue_severity: moderate
  project_type: generation
