  what_happened: The DeGrussa Solar Project successfully demonstrated that a 10.6
    MWp solar PV system with 6 MW battery storage can be integrated with a mine's
    critical operational diesel load, establishing the first reference case for utility-scale
    solar-hybrid mine-site systems in Australia.
  lesson_learnt: The DeGrussa project provides a proven reference case that de-risks
    future mine-solar-hybrid projects — developers and mine operators can now point
    to demonstrated feasibility, and the contractors and suppliers involved carry
    directly transferable experience to future deployments.
