  source_title: DeGrussa Solar Project Report
  publish_date: 2017-03
  project_name: DeGrussa Solar Project
  what_happened: Additional system benefits of the solar-hybrid system — including
    voltage and frequency support, reactive power supply, and additional spinning
    reserve from battery inverters — were observed during operation but could not
    be quantified prior to project commencement, so they were not included in the
    financial model or leveraged for additional project revenue.
  lesson_learnt: Capture high-resolution operational data from solar-hybrid projects
    such as DeGrussa to quantify ancillary service benefits (voltage support, reactive
    power, spinning reserve) — once quantified, these benefits can be included in
    financial models for future projects, potentially improving project economics.
