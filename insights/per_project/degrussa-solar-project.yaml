  project_name: DeGrussa Solar Project
  what_happened: Commissioning activities were affected by the unavailability of solar-hybrid
    specialist personnel who were subject to FIFO fatigue management policies, meaning
    urgent tasks could not be completed until personnel returned to site via the full
    mobilisation process.
  lesson_learnt: For FOAK solar-hybrid projects at remote mine sites, ensure commissioning
    schedules account for FIFO fatigue management constraints on specialist personnel
    — the limited pool of qualified individuals means any unplanned absence triggers
    delays tied to the full mobilisation cycle.
