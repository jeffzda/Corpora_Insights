  source_title: DeGrussa Solar Project Report
  publish_date: 2017-03
  project_name: DeGrussa Solar Project
  what_happened: The single 5 MVA battery transformer was larger than other transformers
    on the microgrid and caused a trip of the mill motor (~10 min outage) on initial
    HV energisation; temporary diesel generators rather than the existing diesel power
    station were used to supply LV power for pre-commissioning works.
  lesson_learnt: For battery storage integration on microgrids, use multiple smaller
    transformers (one per inverter station) rather than a single large transformer
    to reduce energisation transients; also supply LV pre-commissioning power from
    the existing diesel power station rather than temporary generators where possible.
