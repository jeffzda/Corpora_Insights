  what_happened: The preferred pre-fabricated 40ft solar inverter container (including
    transformer and switchgear) was found unlikely to meet Australian Standards and
    site standards after it had been selected, requiring a change to a standard ABB
    20ft station with external HV substation.
  lesson_learnt: Before selecting prefabricated inverter solutions — particularly
    those new to the Australian market — verify compliance with Australian Standards
    and local building regulations early in procurement; non-compliance discovered
    after selection forces redesign, adds cost, and risks schedule slippage.
