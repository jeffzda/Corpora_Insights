- record_id: ARENA-DLV-50210
  source_title: DeGrussa Solar Project Report
  publish_date: 2017-03
  project_name: DeGrussa Solar Project
  what_happened: Mine operators' conservatism around minimum diesel loading, minimum
    generators online, maximum solar ramp rate, and minimum spinning reserve — driven
    by limited operational data on how high-penetration renewables affect diesel generators
    — drove up battery storage sizing, control system complexity and project cost,
    and reduced potential solar PV output.
  lesson_learnt: Address diesel operator conservatism by gathering operational data
    from comparable mine-solar-hybrid sites before design freeze — the absence of
    reference data forces conservative system constraints that directly increase battery
    size, control complexity, and LCOE while limiting solar penetration.
