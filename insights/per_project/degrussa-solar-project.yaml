- record_id: ARENA-DLV-50212
  source_title: DeGrussa Solar Project Report
  publish_date: 2017-03
  project_name: DeGrussa Solar Project
  what_happened: In October 2016 a routine diesel generator maintenance task (unplugging
    a generator controller) caused an unforeseen intermittent communications failure
    between the generator controllers and the Solar-Hybrid controller bridge. This
    caused the solar and battery systems to overpower the diesel generators, leading
    to diesel generator trips on reverse power, an under-voltage and under-frequency
    event, and a site blackout; power was restored within 7 minutes with no equipment
    damage but with loss of mine production.
  lesson_learnt: Test control system behaviour under all plausible communications-loss
    scenarios — including loss of individual generator controller communications —
    before go-live; require that any personnel performing maintenance on equipment
    interfaced with the hybrid control system notify all stakeholders in advance,
    and ensure firmware on all control system components is current before commissioning.
  issue_severity: major
  project_type: generation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: project developer
  delay_category: null
  failure_mode: unvalidated integration
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: coordination & stakeholders
  intervention_note: Firmware updated on relevant control system components with bug
    fixes; communications-loss scenarios added to test regime; requirement established
    for all personnel to notify stakeholders before working on relevant equipment;
    remote monitoring staff given additional training.
  transferability: moderate
  delay_magnitude: null
  technology_domain: hybrid systems
  source_pages: &id012
  - 25
  - 26
  - 27
  evidence_excerpt: Disconnection of the particular generator controller caused an
    unforeseen intermittent communications failure which led to the solar and battery
    generation systems eventually overpowering the diesel generation system... the
    testing of communications under the specific scenario seen pre-event was an oversight
    by all stakeholders during the project.
  confidence_note: issue_severity set to major due to site-wide blackout and production
