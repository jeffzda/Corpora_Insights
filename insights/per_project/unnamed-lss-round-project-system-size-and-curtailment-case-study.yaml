- record_id: ARENA-DLV-15462
  source_title: 'The Generator Operations Series: Large-Scale Solar Operations'
  publish_date: 2021-05
  project_name: Unnamed LSS Round Project (system size and curtailment case study)
  what_happened: After financial close, grid connection negotiations resulted in a
    4 per cent reduction in AC capacity. During commissioning, the network operator
    identified a thermal constraint and rapid load fluctuations, leading to a 26 per
    cent derating of the plant. Modifications reduced the derating to approximately
    14 per cent on an ongoing basis. The project estimated 12 per cent and 7 per cent
    of generation was lost in 2019 and 2020 respectively compared to financial close
    budgets.
  lesson_learnt: Grid connection parameters should be finalised before financial close
    and construction begins — post-financial-close GPS negotiations that reduced AC
    capacity by 4 per cent, followed by a 26 per cent commissioning-stage derating,
    together caused generation losses of 12 per cent in the first year and demonstrate
    the compounding effect of incomplete grid connection work at financial close.
  issue_severity: major
