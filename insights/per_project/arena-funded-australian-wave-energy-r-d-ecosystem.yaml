- record_id: ARENA-DLV-50024
  source_title: Ocean Energy Report by Seanergy and Ernst and Young
  publish_date: 2016-06
  project_name: ARENA-Funded Australian Wave Energy R&D Ecosystem
  what_happened: Australian universities played an active role as delivery partners in ARENA-funded ocean energy projects, contributing specific technical capabilities including fluid dynamic modelling,
    geological knowledge, wave testing validation and engineering design optimisation. The University of Plymouth and University of Western Australia contributed distinct capabilities to Carnegie Wave Energy's
    CETO technology development.
  lesson_learnt: For first-of-kind ocean energy technologies, partnering with universities that have specific complementary capabilities (hydrodynamic modelling, wave testing, geotechnical design) from
    early stages reduces technical risk and can improve LCOE by improving foundation and structural design; project developers should map required capabilities against available academic partners before
    commencing detailed design.
