    with SA farms showing higher mean performance (83.0%) based on a small sample
    of two farms.'
  lesson_learnt: Investors and asset managers can use 79.3% as a reference-class temperature-corrected
    PR benchmark for NEM large-scale solar farms as at 2020; a farm's temperature-corrected
    PR below 75.4% is likely in the bottom quartile of industry performance and warrants
    investigation, while a PR above 83.5% is likely in the top quartile.
