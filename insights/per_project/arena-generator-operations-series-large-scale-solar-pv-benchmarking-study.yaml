- record_id: ARENA-DLV-36106
  source_title: 'The Generator Operations Series Report Five: Benchmarking Large-scale
    Solar PV Performance in Australia using satellite weather data'
  publish_date: 2022-08
  project_name: ARENA Generator Operations Series – Large-Scale Solar PV Benchmarking
    Study
  what_happened: No publicly available database of solar farm installation details
    (tracking type, tilt angle, azimuth) exists in Australia, requiring the study
    to develop an automated method to infer site setup by modelling 52 different configurations
    per site and comparing simulated generation profiles to AEMO dispatch data. Several
    sites had limited usable training data due to curtailment, reducing the reliability
    of detected configurations.
  lesson_learnt: The absence of a public registry of large-scale solar farm technical
    specifications (tracking type, tilt, azimuth) imposes significant analytical overhead
    for any performance benchmarking or yield modelling exercise — the industry and
    regulators should consider establishing a public database of installation parameters
    to reduce duplication of effort and improve the accuracy of portfolio-level assessments.
  issue_severity: minor
