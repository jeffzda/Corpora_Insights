- record_id: ARENA-DLV-36103
  source_title: 'The Generator Operations Series Report Five: Benchmarking Large-scale
    Solar PV Performance in Australia using satellite weather data'
  publish_date: 2022-08
  project_name: ARENA Generator Operations Series – Large-Scale Solar PV Benchmarking
    Study
  what_happened: AEMO did not publicly record local limit data tags for generator
    assets until November 2021, meaning that for analysis of 2020 operational data,
    curtailment periods had to be identified by manual visual inspection of dispatch
    data. This conservative approach caused entire days to be excluded whenever a
    local limit was detected at any point, unnecessarily reducing the dataset available
    for unconstrained and temperature-corrected PR calculations.
  lesson_learnt: Performance analysis and benchmarking of solar farm operations for
    periods prior to November 2021 is materially hampered by the absence of public
    local limit data from AEMO; future analyses covering post-November 2021 data will
    achieve significantly more comprehensive unconstrained datasets with fewer unnecessary
    exclusions, improving reliability of results.
