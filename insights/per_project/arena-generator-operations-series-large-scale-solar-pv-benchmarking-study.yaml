- record_id: ARENA-DLV-36107
  source_title: 'The Generator Operations Series Report Five: Benchmarking Large-scale
    Solar PV Performance in Australia using satellite weather data'
  publish_date: 2022-08
  project_name: ARENA Generator Operations Series – Large-Scale Solar PV Benchmarking
    Study
  what_happened: Using a single set of module temperature coefficients across all
    10 ARENA LSS validation sites resulted in higher relative error for satellite
    cell temperature estimates (mean RMSE of 16.65% at 5-minute resolution) compared
    to irradiance estimates (mean RMSE of 27.76% W/m² but only 2.92% at monthly level),
    reflecting that module temperature behaviour varies with site-specific installation
    conditions and module types.
  lesson_learnt: Cell temperature models applied across multiple solar farms should
    incorporate site-specific thermal coefficients derived from on-site measurements
    or correlation analysis — applying generic SAPM coefficients introduces systematic
    bias that, while having limited impact on annual PR calculations (±1.1% contribution
    to expanded uncertainty), can materially affect short-interval performance assessments.
  issue_severity: minor
  project_type: generation
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: operations
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The 'a' coefficient in the Sandia temperature model was iteratively
    optimised across all LSS sites to minimise mean bias error, shifting from the
    recommended value of -3.56 to an adapted value of -4.1, reducing systematic bias
    in cell temperature estimates.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id007
  - 15
  - 16
  - 17
  evidence_excerpt: The relative MBE, standard deviation of MBE, and RMSE are all
    higher for cell temperature estimates than was observed for irradiance estimates.
    This likely reflects the fact that a single set of coefficients has been assumed
    to describe the cell temperature model at all sites. In reality, the way that
    weather conditions translate to module temperatures over the course of the day
    will vary depending on the particular module and installation conditions at each
    site.
