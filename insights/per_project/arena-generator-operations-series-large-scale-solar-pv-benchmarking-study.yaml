- record_id: ARENA-DLV-36102
  source_title: 'The Generator Operations Series Report Five: Benchmarking Large-scale
    Solar PV Performance in Australia using satellite weather data'
  publish_date: 2022-08
  project_name: ARENA Generator Operations Series – Large-Scale Solar PV Benchmarking
    Study
  what_happened: Across 26 large-scale solar farms on the NEM in 2020, the average
    raw performance ratio was 68.4% but the average unconstrained performance ratio
    was 75.4%, indicating that curtailment reduced aggregate performance by approximately
    7 percentage points. Victorian farms showed the most severe curtailment impact,
    with a raw PR of only 59.1% versus an unconstrained PR of 76.0%.
  lesson_learnt: Yield models and revenue forecasts for large-scale solar farms —
    particularly in Victoria and South Australia — must explicitly model curtailment
    risk; a gap of 7–17 percentage points between raw and unconstrained PR demonstrates
    that curtailment can materially reduce realised generation relative to technical
    capacity, with significant implications for project financing and PPA structuring.
