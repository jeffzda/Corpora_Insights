  source_title: 'The Generator Operations Series Report Five: Benchmarking Large-scale
    Solar PV Performance in Australia using satellite weather data'
  publish_date: 2022-08
  project_name: ARENA Generator Operations Series – Large-Scale Solar PV Benchmarking
    Study
  what_happened: Performance data for large-scale solar farms in Australia is temporally
    and spatially scarce, expensive to maintain, and unavailable to the public because
    it relies on privately-owned high-quality ground station measurements, making
    cross-project performance benchmarking impossible without proprietary data access.
  lesson_learnt: Investors, developers and operators should not rely solely on privately-held
    ground station data for portfolio-level performance benchmarking — satellite-based
    PR calculations using public AEMO generation data provide a viable alternative
    accurate to ±4.6% (95% confidence) for annual irradiance, sufficient for relative
    performance comparisons across farms.
