- record_id: ARENA-DLV-53852
  source_title: Demand Flexibility Portfolio Retrospective Analysis Report
  publish_date: 2023-07
  project_name: ARENA Demand Flexibility Portfolio — Air-Conditioning Projects (AGL,
    EnergyAustralia, Powershop, Synergy, Zen Ecosystems)
  what_happened: Air-conditioning units that were AS-4755 compliant still required
    additional adapters (with 'many variants'), often needed 2–3 site visits, and
    a 4-hour installation requiring the homeowner to be present. Only 40–54% of homes
    had compliant units, making portfolio construction costly and slow.
  lesson_learnt: Even where technical standards exist, complex and expensive site-by-site
    installation processes make residential demand response economically unviable
    at scale; programs should pursue self-installable or factory-integrated solutions
    and avoid approaches requiring skilled-installer site visits per household.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: construction/installation
  proponent_type: utility/energy retailer
  delay_category: construction/installation
  failure_mode: poor scoping
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: execution & logistics
  intervention_note: Zen Ecosystems trialled a self-installable infrared technology
    that did not require a DRED, circumventing installation complexity — though evaluation
    was hampered by inability to access NMI data.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: demand response
  source_pages:
  - 25
  evidence_excerpt: Installations were complex, expensive, dependent on the assessment
    of skilled installers and inconvenient for customers. AS-4755 compliant units
    still often required an additional adapter to link to the DRED and there are 'many
    variants' of adapters – often requiring 2 or 3 site visits. Some of the AS-4755
    compliant units had not fully implemented all of the demand response modes under
    the AS-4755 and required modifications. Upgrading units was a 4-hour installation
    at which the homeowner must be present.
