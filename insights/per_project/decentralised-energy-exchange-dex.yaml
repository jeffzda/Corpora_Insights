- record_id: ARENA-DLV-64413
  source_title: Distributed Energy Resources (DER) Integration Project Contribution Assessment
  publish_date: 2019-03
  project_name: Decentralised Energy Exchange (deX)
  what_happened: GreenSync's deX project, funded by ARENA in 2017 ($450k), developed the early stages of a novel online exchange platform for DER market transactions and resulted in an industry-wide collaboration
    of 68 partner organisations. The deX platform was subsequently adopted as a core component of Simply Energy's VPPx project, extending its functionality and providing network visibility to SA Power Networks.
  lesson_learnt: Early-stage platform and marketplace projects can generate disproportionate portfolio leverage by becoming enabling infrastructure for subsequent, larger projects — ARENA should identify
    and prioritise platform investments that multiple follow-on projects can build on, rather than treating them as standalone demonstrations.
