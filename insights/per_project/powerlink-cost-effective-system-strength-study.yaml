  what_happened: The approval and construction process for pumped hydro was found
    to be far more complicated and protracted than for batteries — with regulatory,
    environmental and community approval and design estimated at 2 years, followed
    by 2.5–5 years of construction — meaning the significant lead-time and capital
    requirements made synchronous pumped hydro impractical for individual project
    developers needing system strength remediation.
