- record_id: ARENA-DLV-37408
  source_title: Managing System Strength During the Transition to Renewables
  publish_date: 2020-04
  project_name: Managing System Strength During the Transition to Renewables
  what_happened: Life-cycle cost analysis of synchronous condensers of varying sizes
    (70 MVAr to 260 MVAr) found that approximately two-thirds of capital costs are
    largely fixed (civils, control systems, cooling, grid connection), while the incremental
    cost of increasing machine size is relatively modest. A 70 MVAr unit costs approximately
    35% more per MVAr over its lifetime than a 260 MVAr unit.
  lesson_learnt: Synchronous condenser installations exhibit significant economies
    of scale — the fixed cost of civil works, cooling, controls and grid connection
    means that larger or shared installations are materially cheaper per MVAr than
    project-scale units; where network topology permits, developers and TNSPs should
    pursue shared or oversized installations to reduce total system strength provision
    costs.
