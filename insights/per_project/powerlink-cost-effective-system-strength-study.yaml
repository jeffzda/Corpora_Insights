  source_title: PSCAD assessment of the effectiveness of a centralised synchronous
    condenser approach
  publish_date: 2020-10
  project_name: Powerlink Cost-Effective System Strength Study
  what_happened: The study found that system strength does not travel effectively
    between different voltage levels (e.g. from 275kV to 132kV), meaning that if the
    high-voltage transmission path between a generator and a centralised synchronous
    condenser is severed, residual support via a lower-voltage network is negligible
    and the generator would likely become unstable.
  lesson_learnt: Do not assume that system strength support from a synchronous condenser
    can reach a generator via a lower-voltage fallback path — when designing centralised
    solutions, assess all network outage scenarios including voltage-level transitions,
    and treat connectivity loss to the synchronous condenser via the primary voltage
    level as effectively equivalent to complete loss of support.
