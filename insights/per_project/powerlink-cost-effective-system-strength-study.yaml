  what_happened: Connection applications required developers to provide complete and
    accurate technical data packages (including PSCAD and PSSE models, connection
    studies reports, protection and control details, and system strength impact assessments)
    at the time of application; the application fee was approximately $300,000 and
    any inaccuracies or poor data caused delays to the NSP and AEMO assessment process.
