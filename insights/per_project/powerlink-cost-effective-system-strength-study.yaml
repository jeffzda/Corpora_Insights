  what_happened: PSCAD modelling of the centralised 230MVAr synchronous condenser
    showed that an inertia constant of 2 seconds produced oscillation damping ratios
    below the NER minimum of 0.05 for frequencies above 0.6Hz, while a 3-second inertia
    constant (requiring a flywheel) achieved compliant damping across all modelled
    frequencies.
  lesson_learnt: When specifying synchronous condensers for system strength purposes
    — particularly in a centralised configuration — do not assume a low inertia constant
    is sufficient; specify at least a 3-second inertia constant (i.e. include a flywheel)
    to ensure NER damping compliance, even where inertia provision is not the primary
    design objective.
