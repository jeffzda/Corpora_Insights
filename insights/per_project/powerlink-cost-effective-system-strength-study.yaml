  what_happened: Network modelling in North Queensland showed that on the 132 kV sub-transmission
    network, a single credible N-1 contingency can reduce the system strength contribution
    from a synchronous condenser at a remote end from 60% (system intact) to only
    2% (N-1) — a 97% reduction — compared with much more modest reductions on the
    275 kV backbone.
  lesson_learnt: When assessing the viability of a shared synchronous condenser solution,
    developers and planners must evaluate N-1 contingency conditions as well as system-intact
    conditions; on the 132 kV network, single contingency events can virtually eliminate
    the benefit of a remote synchronous condenser, making shared solutions unviable
    and requiring on-site remediation.
