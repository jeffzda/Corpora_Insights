  project_name: Managing System Strength During the Transition to Renewables
  what_happened: PSCAD modelling required for grid connection assessments of inverter-based
    generators proved extremely detailed and time-consuming, and utilities and inverter
    suppliers required significant time to develop and refine models; in several cases
    iterative model refinement uncovered issues with vendor-supplied inverter models,
    producing variable outputs over time.
  lesson_learnt: Developers should submit precise inverter and electrical infrastructure
    details as early as possible in the development process, because any subsequent
    design changes — including inverter selection — may invalidate completed PSCAD
    analyses and force the entire lengthy assessment to restart.
