- record_id: ARENA-DLV-37410
  source_title: Managing System Strength During the Transition to Renewables
  publish_date: 2020-04
  project_name: Managing System Strength During the Transition to Renewables
  what_happened: Where a VRE generator's grid connection relies on a synchronous condenser
    for 'do no harm' compliance, an unplanned outage of that condenser — potentially
    lasting several months if bespoke parts need to be manufactured overseas — can
    force the generator to run back or disconnect entirely, creating a single-point-of-failure
    risk.
  lesson_learnt: Renewable generators that are dependent on a single synchronous condenser
    for grid connection compliance should assess the risk of extended unplanned outages
    and consider whether a centralised portfolio of multiple condensers (providing
    partial redundancy) or other risk mitigation measures are warranted, particularly
    given that major unplanned repairs may require bespoke overseas parts with multi-month
    lead times.
