  source_title: PSCAD Assessment of The Effectiveness of Grid Forming Batteries
  publish_date: 2021-04
  project_name: Powerlink System Strength Study – Grid Forming Batteries
  what_happened: The study found that AEMO's fault-level-based Preliminary Assessment
    methodology — used as a screening tool for system strength adequacy — does not
    provide sufficient confidence for identifying inverter control interaction risks,
    because it does not capture the complex multi-inverter interactions that are the
    dominant cause of instability. Powerlink concluded that detailed EMT (PSCAD) modelling
    is required even at the screening stage for weak grid areas with multiple IBR
    generators.
  lesson_learnt: Do not rely solely on AEMO's fault-level-based Preliminary Assessment
    to screen for system strength adequacy in areas with multiple inverter-based generators
    — commission detailed EMT (PSCAD) system studies early in the development process,
    as fault level analysis can substantially understate instability risk from inverter
    control interactions.
