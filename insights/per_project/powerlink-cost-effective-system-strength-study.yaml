- record_id: ARENA-DLV-37422
  source_title: Managing System Strength During the Transition to Renewables
  publish_date: 2020-04
  project_name: Managing System Strength During the Transition to Renewables
  what_happened: The commissioning process for grid-connected generators involved
    a detailed 'hold point' testing regime in which MW output is stepped up progressively,
    with data downloaded and compared against modelled performance at each hold point
    before AEMO and the NSP approve advancement to the next step. For a 100 MW generator
    this could involve four hold points. The variability of solar and wind resources
    made the process of holding output at specified levels for data collection particularly
    problematic.
  lesson_learnt: Begin developing the commissioning plan with the NSP and AEMO at
    least three months before the planned commissioning date, as the plan can be complex
    and the requirement to hold generator output at specified levels for data collection
    is operationally challenging for variable renewable generators — delays to commissioning
    approval at any hold point directly delay commercial operation.
