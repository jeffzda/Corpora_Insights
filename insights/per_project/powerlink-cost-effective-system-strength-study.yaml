- record_id: ARENA-DLV-37407
  source_title: Managing System Strength During the Transition to Renewables
  publish_date: 2020-04
  project_name: Managing System Strength During the Transition to Renewables
  what_happened: Multiple VRE generator proponents — including Kiamal Solar Farm,
    Darlington Point Solar Farm, Murra Warra 2 Wind Farm, and Haughton Solar Farm
    — were required to install or plan synchronous condensers as individual 'do no
    harm' remediation measures under the NER connection process, resulting in numerous
    small scattered installations rather than coordinated shared solutions.
  lesson_learnt: The 'do no harm' framework drives individual, project-by-project
    synchronous condenser installations that are economically inefficient compared
    to shared centralised solutions; developers and regulators should proactively
    explore shared system strength solutions at the outset of connection planning,
    particularly for projects located on or near the main transmission backbone.
