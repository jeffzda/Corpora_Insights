  what_happened: The study found that grid forming batteries are susceptible to small
    signal (oscillatory) instability — an issue historically associated with synchronous
    generators — and that this risk grows as the number of independent grid forming
    batteries on the network increases, because each additional GFMI increases interaction
    complexity. This issue was not observed in the simulations but is identified as
    a latent risk as GFMI deployment scales up.
  lesson_learnt: Procure or specify grid forming batteries with supplementary power
    system stabiliser (PSS) functionality; from a system planning perspective, favour
    fewer, larger grid forming batteries over many smaller ones to reduce small signal
    instability risk and simplify mitigation as the GFMI population grows.
