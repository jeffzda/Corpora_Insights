- record_id: ARENA-DLV-56401
  source_title: PSCAD assessment of the effectiveness of a centralised synchronous
    condenser approach
  publish_date: 2020-10
  project_name: Powerlink Cost-Effective System Strength Study
  what_happened: PSCAD modelling of three IBR generators (~400MW total) connected
    to Powerlink's 275kV network demonstrated that a single centralised 230MVAr synchronous
    condenser could provide system strength remediation for all three generators,
    compared to three separate units totalling 325MVAr under a decentralised approach.
  lesson_learnt: A centralised synchronous condenser can serve multiple geographically
    dispersed IBR generators (up to 400km apart) connected to the same transmission
    backbone, reducing total required capacity and achieving approximately 40% lifecycle
    cost savings compared to a distributed approach — provided electrical distance
    (impedance) between generators remains low.
