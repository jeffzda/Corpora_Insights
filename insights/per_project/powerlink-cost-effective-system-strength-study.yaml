- record_id: ARENA-DLV-61660
  source_title: PSCAD Assessment of The Effectiveness of Grid Forming Batteries
  publish_date: 2021-04
  project_name: Powerlink System Strength Study – Grid Forming Batteries
  what_happened: The study found that grid forming batteries are a more capable solution
    than synchronous condensers for transient stability management because they can
    absorb real power (switch to charging mode) to offset excess generation following
    a fault, whereas synchronous condensers only provide reactive power support and
    voltage stiffness. With a synchronous condenser, at least one renewable plant
    still had to be tripped post-fault; with a grid forming battery and coordinated
    control, no tripping was required.
  lesson_learnt: When selecting between a synchronous condenser and a grid forming
    battery for system strength in areas with transient stability constraints, account
    for the grid forming battery's real power absorption capability — this can eliminate
    the need for post-fault generator tripping and materially improve renewable energy
    yield, justifying the higher capital cost in many network configurations.
