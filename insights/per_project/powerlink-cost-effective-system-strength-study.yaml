- record_id: ARENA-DLV-37428
  source_title: Managing System Strength During the Transition to Renewables
  publish_date: 2020-04
  project_name: Managing System Strength During the Transition to Renewables
  what_happened: A synchronous condenser's inclusion in a renewable generation project
    increases the fault level experienced by the project's internal electrical network
    (especially if connected on the low-voltage side of the grid-connection transformer),
    potentially exceeding the ratings of switchgear and other electrical equipment
    specified before the condenser was added to the design.
  lesson_learnt: Consider the fault level implications of a synchronous condenser
    early in the electrical design of the renewable project — adding a condenser post-design
    freeze can require costly re-specification of switchgear and other plant rated
    for lower fault levels; the impact on the nearby transmission and distribution
    network fault levels must also be assessed, with any remediation costs borne by
    the developer.
