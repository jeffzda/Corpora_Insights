- record_id: ARENA-DLV-37404
  source_title: Managing System Strength During the Transition to Renewables
  publish_date: 2020-04
  project_name: Managing System Strength During the Transition to Renewables
  what_happened: Five solar farms in the West Murray Zone (NSW/Victoria) were subject
    to significant and protracted output constraints — constrained to half-output
    for seven months — because inverter instability and the potential for large-scale
    distribution generation tripping following a network contingency was only identified
    after the solar farms were constructed.
  lesson_learnt: Specifying advanced inverter controls upfront — before connection
    assessment — avoids the need to restart the assessment process if controls are
    changed later; retrospective firmware upgrades are most practical when affected
    generators share a common inverter vendor, making IP management straightforward.
