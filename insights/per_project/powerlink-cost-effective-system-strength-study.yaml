  source_title: Managing System Strength During the Transition to Renewables
  publish_date: 2020-04
  project_name: Managing System Strength During the Transition to Renewables
  what_happened: Synchronous generator emulating (SGE) / grid-forming inverters —
    a technology that could in principle provide system strength without requiring
    a separate synchronous condenser — had predominantly been used in islanded (off-grid)
    applications at the time of the report; their effectiveness in grid-connected
    transmission applications remained unclear, with various investigations and pilot
    projects underway including an ARENA-supported Powerlink investigation.
  lesson_learnt: Grid-forming inverter technology cannot yet be relied upon as a proven
    system strength solution for grid-connected applications; developers should design
    for synchronous condenser or other proven remediation and treat grid-forming inverters
    as an emerging option to monitor, not a bankable solution for current projects.
