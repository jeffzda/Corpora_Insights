  source_title: PSCAD Assessment of The Effectiveness of Grid Forming Batteries
  publish_date: 2021-04
  project_name: Powerlink System Strength Study – Grid Forming Batteries
  what_happened: PSCAD modelling demonstrated that a grid forming battery (GFMI with
    BESS) of the same continuous MVA rating as a synchronous condenser could effectively
    damp sub-synchronous voltage oscillations caused by inadequate system strength
    in a weak grid area with ~300 MW of inverter-based renewables. After controller
    tuning, the required continuous MVA capacity was halved while achieving the same
    damping performance.
  lesson_learnt: Grid forming batteries can provide equivalent system strength support
    to a synchronous condenser at half the continuous MVA capacity, but only when
    controller parameters are specifically tuned to the network conditions — untuned
    or generically configured GFMIs will not achieve this efficiency gain.
