- record_id: ARENA-DLV-37417
  source_title: Managing System Strength During the Transition to Renewables
  publish_date: 2020-04
  project_name: Managing System Strength During the Transition to Renewables
  what_happened: The two existing system strength frameworks ('do no harm' for connecting
    generators and 'minimum system strength' for TNSP-managed shortfalls) were found
    to be poorly coordinated with each other and with other regulatory frameworks
    such as inertia, preventing co-optimised procurement of system strength and inertia
    services and creating inefficient outcomes including unexpected shortfalls and
    constraints.
  lesson_learnt: Synchronous condensers can provide both system strength and inertia
    simultaneously, but the regulatory separation of these services prevents co-optimised
    procurement; developers and network businesses should advocate for — and where
    possible structure commercial arrangements to capture — the combined value of
    system strength and inertia from the same asset, particularly as the regulatory
    framework evolves.
