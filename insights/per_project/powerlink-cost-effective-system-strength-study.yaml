  source_title: Managing System Strength During the Transition to Renewables
  publish_date: 2020-04
  project_name: Managing System Strength During the Transition to Renewables
  what_happened: The existing 'do no harm' regulatory framework for system strength
    was identified by stakeholders in the AEMC review as exacerbating barriers to
    connection for new entrants by adding substantial uncertainties in the form of
    delays and costs, and by driving many individual and discrete synchronous condenser
    installations rather than coordinated responses — increasing power system model
    complexity and the complexity of ongoing operations and future connection assessments.
  lesson_learnt: The current 'do no harm' framework creates a structural barrier where
    each new generator individually bears the cost and complexity of system strength
    remediation, increasing total system cost and model complexity; ARENA-funded projects
    should anticipate this regulatory friction and engage early with TNSPs and AEMO
    to identify opportunities for coordinated solutions before individual remediation
    commitments are made.
