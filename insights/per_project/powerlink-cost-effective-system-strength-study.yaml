  evidence_excerpt: The investigation found that both approaches to synchronous condensers
    are technically feasible, but the centralised solution would yield significant
    economies. Three smaller synchronous condensers (rated at 65MVAr, 130MVAr and
    130MVAr) would be required under the decentralised approach, compared to a single
    larger (230MVAr) unit at a centralised location. Given the significant economies
    of scale which apply to synchronous condensers, a centralised approach would result
