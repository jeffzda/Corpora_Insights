  project_name: Managing System Strength During the Transition to Renewables
  what_happened: Any changes to a generator's inverter controller design after a connection
    assessment had commenced required the connection assessment process to be restarted,
    adding cost and time; additionally, retrospective improvements to existing inverters
    to benefit the broader network faced practical barriers because incumbents were
    not obligated to upgrade and had commercial incentives to resist changes that
    would facilitate competing generation.
  lesson_learnt: Specify the most advanced available inverter controls from the outset
    — including any enhanced firmware available from the supplier — before commencing
    the connection assessment; retrospective inverter control improvements are difficult
    to mandate under the current NER and rely on bilateral agreement that incumbents
    have little commercial incentive to provide.
