  source_title: Managing System Strength During the Transition to Renewables
  publish_date: 2020-04
  project_name: Managing System Strength During the Transition to Renewables
  what_happened: The preliminary system strength impact assessment (PIA) used as a
    screening tool for connection applications was designed primarily to screen for
    individual inverter instability, not for interactions between multiple inverters,
    which had become the dominant concern. Some TNSPs with high inverter populations
    (including Powerlink in Queensland) consequently required all new connections
    to undergo full PSCAD assessment regardless of PIA outcome.
  lesson_learnt: Developers should not rely on a favourable preliminary impact assessment
    to avoid full PSCAD modelling; in regions with high inverter penetration, all
    new connections are likely to require detailed PSCAD analysis regardless of PIA
    screening results, and project programmes and budgets should be planned accordingly.
