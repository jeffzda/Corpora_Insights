- record_id: ARENA-DLV-37406
  source_title: Managing System Strength During the Transition to Renewables
  publish_date: 2020-04
  project_name: Managing System Strength During the Transition to Renewables
  what_happened: South Australia experienced declared shortfalls in both system strength
    and inertia as renewable penetration increased and synchronous generators retired
    or reduced output. AEMO managed the shortfall operationally through market constraints
    and directions for approximately two years before a regulated solution was implemented.
  lesson_learnt: Reactive management of system strength shortfalls through AEMO market
    interventions and constraints is costly and operationally complex; proactive,
    planned procurement of system strength infrastructure — as ElectraNet undertook
    via a RIT-T process — produces a more cost-effective outcome and should be initiated
    before shortfalls are declared.
  issue_severity: major
  project_type: network/grid
  project_scale_band: utility/large-scale
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: ElectraNet undertook a RIT-T process and identified that installing
    four synchronous condensers (with flywheels) at two network locations was the
    most cost-effective solution to address both system strength and inertia shortfalls
    simultaneously.
  transferability: broad
  delay_magnitude: 1–3 years
  technology_domain: grid/system stability
  source_pages: &id004
