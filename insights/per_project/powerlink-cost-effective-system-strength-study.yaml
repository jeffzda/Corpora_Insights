- record_id: ARENA-DLV-37418
  source_title: Managing System Strength During the Transition to Renewables
  publish_date: 2020-04
  project_name: Managing System Strength During the Transition to Renewables
  what_happened: Network modelling for the Sun Metals and Haughton Solar Farm worked
    example in North Queensland showed that despite the two projects being geographically
    close, the impedance of 275/132 kV transformers at Ross created a significant
    electrical distance between the projects — equivalent to approximately 150 km
    of 275 kV transmission line — making it impractical for a synchronous condenser
    at one project's location to reliably serve the other.
  lesson_learnt: Geographic proximity between renewable projects does not guarantee
    that a shared synchronous condenser solution is viable — electrical distance (determined
    by transformer impedance and network configuration) is the governing factor; developers
    of adjacent projects should conduct detailed network analysis rather than assuming
    sharing is economic.
