  source_title: PSCAD assessment of the effectiveness of a centralised synchronous
    condenser approach
  publish_date: 2020-10
  project_name: Powerlink Cost-Effective System Strength Study
  what_happened: The study found that conventional fault-level based preliminary assessment
    methodology (used in AEMO's screening tool) is insufficient for identifying system
    strength issues arising from dynamic control interactions between multiple IBR
    generators, and that full EMT (PSCAD) modelling is necessary to capture unstable
    oscillations in the 8–15Hz range.
  lesson_learnt: IBR generator connection assessments should not rely solely on fault-level
    screening (e.g. AEMO's preliminary assessment) to identify system strength risks
    — full EMT modelling using tools such as PSCAD is required to detect adverse multi-inverter
    control interactions, which the preliminary methodology was found to materially
    understate.
  issue_severity: moderate
