  what_happened: The study found that pre-contingent curtailment of IBR generation
    to 80% of capacity — combined with fast post-fault tripping — was the only option
    that could maintain system stability without additional grid-forming or synchronous
    condenser support. This curtailment would be continuously detrimental to the financial
    viability of renewable generators and was assessed as an unacceptable long-term
    solution.
  lesson_learnt: Do not rely on pre-contingent generation curtailment as a system
    strength mitigation strategy in weak grid areas — it is financially unviable for
    renewable proponents and should be used only as a temporary measure while active
    solutions (grid forming batteries or synchronous condensers) are procured and
    commissioned.
