    protection design, and system strength impact assessment — is complete and accurate
    before lodging the formal Application to Connect; the $300,000+ application fee
    and extensive TNSP/AEMO assessment work mean that incomplete or inaccurate submissions
    cause material delays and wasted expenditure that could be avoided with thorough
    pre-application preparation.
