  what_happened: The AEMO registration process for new generators — which must be
    completed before connection — required confirmation of fit-and-proper entity status,
    technical compliance, and all market participation arrangements, and could only
    commence after the connection agreement was executed and the project reached 'committed'
    status. A further 'R1 Data Due Diligence' technical review at this stage required
    substantial additional modelling and negotiation with AEMO and the NSP on final
    technical requirements.
