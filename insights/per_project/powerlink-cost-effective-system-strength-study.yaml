  source_title: Managing System Strength During the Transition to Renewables
  publish_date: 2020-04
  project_name: Managing System Strength During the Transition to Renewables
  what_happened: Network modelling in North Queensland demonstrated that system strength
    from a synchronous condenser diminishes over 2.5 times more rapidly per kilometre
    on 132 kV sub-transmission lines than on 275 kV transmission backbone lines, due
    to the higher impedance of lower-voltage conductors.
  lesson_learnt: Generators connecting to 132 kV or lower-voltage sub-transmission
    networks should not assume they can benefit from a shared centralised synchronous
    condenser — the higher impedance of the sub-transmission network means system
    strength dissipates rapidly with distance, and such generators are likely to need
    individual on-site system strength remediation.
