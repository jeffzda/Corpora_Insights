  source_title: Managing System Strength During the Transition to Renewables
  publish_date: 2020-04
  project_name: Managing System Strength During the Transition to Renewables
  what_happened: Modelling of the North Queensland network demonstrated that a synchronous
    condenser's benefit to inverter stability can extend beyond the geographic area
    where it measurably increases fault level — because stabilising one inverter involved
    in a multi-inverter interaction can break the interaction chain and benefit other
    inverters located outside the zone of increased system strength.
  lesson_learnt: Fault-level-based assessment of synchronous condenser coverage can
    understate effectiveness in areas dominated by inverter controller interaction
    instability; PSCAD analysis is required to quantify the 'over-reach' effect, and
    developers and planners should not rule out shared synchronous condenser solutions
    based solely on fault level propagation analysis without conducting full PSCAD
    assessment.
