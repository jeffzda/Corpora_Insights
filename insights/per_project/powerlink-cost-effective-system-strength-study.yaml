- record_id: ARENA-DLV-37420
  source_title: Managing System Strength During the Transition to Renewables
  publish_date: 2020-04
  project_name: Managing System Strength During the Transition to Renewables
  what_happened: 'Special protection schemes (which trip or run back inverters during
    problematic system conditions) were identified as potentially viable complements
    to other system strength solutions, but only in a limited range of circumstances:
    where instability arises in a very small number of detectable and infrequent network
    states, and where the scheme can be implemented at modest cost and complexity
    relative to the alternative of a larger synchronous condenser.'
  lesson_learnt: Special protection schemes should be evaluated early in project design
    as a potential cost-reducing complement to synchronous condensers; they are most
    viable where there is one identifiable critical contingency with a localised impact,
    and least viable in deep sub-transmission networks with many problematic contingencies
    — the cost and TNSP acceptability of a scheme should be assessed before it is
    relied upon in the remediation strategy.
