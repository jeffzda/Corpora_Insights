- record_id: ARENA-DLV-37414
  source_title: Managing System Strength During the Transition to Renewables
  publish_date: 2020-04
  project_name: Managing System Strength During the Transition to Renewables
  what_happened: 'The Haughton Solar Farm was connected by being ''cut into'' only
    a single circuit of a double-circuit transmission line. This created a particularly
    onerous N-1 contingency: loss of that single circuit significantly increased the
    electrical distance to any synchronous condenser source of system strength, severely
    reducing its effectiveness and potentially requiring substantial oversizing of
    any shared synchronous condenser solution.'
  lesson_learnt: Where possible, connect a renewable generator by 'cutting into' both
    circuits of a double-circuit transmission line rather than only one; connecting
    to a single circuit creates a critical single-point N-1 contingency that can require
    substantially oversized (and uneconomic) system strength remediation, whereas
    connection to both circuits preserves a low-impedance path to system strength
    sources even when one circuit is out of service.
