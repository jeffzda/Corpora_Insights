- record_id: ARENA-DLV-61663
  source_title: PSCAD Assessment of The Effectiveness of Grid Forming Batteries
  publish_date: 2021-04
  project_name: Powerlink System Strength Study – Grid Forming Batteries
  what_happened: The study found that while grid forming batteries offer additional
    commercial value streams (arbitrage, FCAS, network support services) that can
    offset their higher capital cost compared to synchronous condensers, the economic
    assessment is highly context-specific and was beyond the scope of the technical
    study. The report also demonstrated that system strength and stability support
    services have minimal impact on the battery's ability to pursue commercial revenue
    — system strength support only requires the battery to be online, and transient
    stability support is only activated infrequently during actual contingency events.
  lesson_learnt: When conducting cost-benefit analysis of grid forming batteries versus
    synchronous condensers, explicitly model the incremental revenue from commercial
    services (FCAS, arbitrage, network support) that the battery can stack — the higher
    capital cost may be substantially offset, and the system strength obligation itself
    imposes minimal constraint on commercial dispatch.
