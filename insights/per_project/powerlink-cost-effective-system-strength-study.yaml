  source_title: Managing System Strength During the Transition to Renewables
  publish_date: 2020-04
  project_name: Managing System Strength During the Transition to Renewables
  what_happened: Synchronous condensers have a lead time of approximately 18 months
    from order to delivery (excluding connection assessment time), and are manufactured
    overseas. Transport logistics — including the size and weight of components and
    road/bridge infrastructure constraints — can restrict installation locations or
    require expensive bridgeworks funded by the proponent.
  lesson_learnt: Allow at least 18 months in the project schedule for synchronous
    condenser procurement and delivery, and assess transport route constraints (bridge
    weight limits, road capacity) before selecting the installation site; transport
    limitations can restrict location options or add significant unforeseen cost.
