  what_happened: Variable speed drive (inverter-based) pumped hydro installations
    — increasingly common due to improved efficiency and operational flexibility —
    do not provide system strength and can in fact consume available system strength,
    contrary to the expectation that pumped hydro storage would inherently strengthen
    the network.
  lesson_learnt: Do not assume that a pumped hydro energy storage installation will
    provide system strength — only direct-connected synchronous machine configurations
    provide this benefit; projects proposing variable-speed-drive pumped hydro as
    part of a system strength solution must verify the technology configuration, as
    an inverter-based drive will consume rather than contribute system strength.
