- record_id: ARENA-DLV-61662
  source_title: PSCAD Assessment of The Effectiveness of Grid Forming Batteries
  publish_date: 2021-04
  project_name: Powerlink System Strength Study – Grid Forming Batteries
  what_happened: The report noted that terminology confusion around 'virtual inertia'
    and 'synthetic inertia' is prevalent in the industry — these terms are used inconsistently,
    sometimes implying a grid-forming function and sometimes as a synonym for fast
    frequency response (FFR) provided by grid-following batteries. This confusion
    risks incorrect technology selection or mismatched expectations between proponents,
    network operators, and vendors.
  lesson_learnt: When specifying grid-forming or FFR battery services in contracts,
    connection applications, or tender documents, define the exact technical capability
    required (GFMI vs GFLI with FFR) explicitly — do not rely on terms like 'virtual
    inertia' or 'synthetic inertia' without a precise technical definition, as these
    are interpreted inconsistently across the industry.
