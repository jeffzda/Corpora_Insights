- record_id: ARENA-DLV-37401
  source_title: Managing System Strength During the Transition to Renewables
  publish_date: 2020-04
  project_name: Managing System Strength During the Transition to Renewables
  what_happened: Renewable generators across the NEM experienced project delays and
    large unanticipated expenditure over the preceding 12 months due to system strength-related
    considerations including network factors, location, cost of remediation, and the
    system strength assessment process.
  lesson_learnt: Renewable generation developers should enter the network connection
    process assuming that some form of system strength remediation will be required
    — treating the connection process as a tool to refine the details of that requirement
    rather than to determine whether it is needed at all.
