- record_id: ARENA-DLV-61664
  source_title: PSCAD Assessment of The Effectiveness of Grid Forming Batteries
  publish_date: 2021-04
  project_name: Powerlink System Strength Study – Grid Forming Batteries
  what_happened: The report identified that confusion exists between grid forming
    inverters designed for islanded (off-grid) operation and those designed for grid-connected
    operation. These are technically distinct products with different requirements
    — notably, grid-connected GFMIs require a specified overcurrent capability that
    islanded designs may not have. Specifying or procuring an islanded-design GFMI
    for a grid-connected system strength application would result in an unsuitable
    product.
  lesson_learnt: When procuring grid forming inverters for system strength applications,
    explicitly specify 'grid-connected GFMI with defined overcurrent capability' in
    tender documents — do not accept products that only demonstrate islanded grid-forming
    capability, as they may lack the overcurrent hardware design required for grid-connected
    operation.
