  project_name: Managing System Strength During the Transition to Renewables
  what_happened: The minimum system strength regulatory framework, established in
    2017, was found to be reactive in nature — requiring AEMO to declare existing
    shortfalls rather than forecast emerging ones. This resulted in very costly and
    operationally complex market interventions by AEMO and limited TNSPs' ability
    to develop least-cost solutions.
  lesson_learnt: Reactive system strength frameworks that only respond to declared
    shortfalls generate higher long-term costs than proactive, forecast-based planning;
    project developers should be aware that AEMO market interventions (constraints,
    directions) triggered by system strength shortfalls can affect generator dispatch
    and revenues, and factor this risk into project financials and risk registers.
