- record_id: ARENA-DLV-37403
  source_title: Managing System Strength During the Transition to Renewables
  publish_date: 2020-04
  project_name: Managing System Strength During the Transition to Renewables
  what_happened: Developers connecting inverter-based generation were required to
    submit precise project details — including inverter selection — at a stage when,
    historically, generation proponents had not sufficiently advanced their project
    specification to have this information available. Any subsequent design changes
    invalidated completed analyses, and the fresh commitment of another generator
    in the same area could also require re-analysis.
  lesson_learnt: Lock in inverter selection and key electrical design parameters before
    submitting a connection application; changing these after analysis has commenced
    forces the PSCAD assessment to restart, adding substantial cost and time to the
    connection process.
