  source_title: Managing System Strength During the Transition to Renewables
  publish_date: 2020-04
  project_name: Managing System Strength During the Transition to Renewables
  what_happened: 'Contracting with an existing synchronous generator for system strength
    services was identified as potentially viable but constrained by multiple factors:
    the generator must be electrically nearby, must be able to operate in synchronous
    condensing mode (or retrofitted to do so), cannot already be committed under AEMO''s
    minimum system strength arrangements, and contractual arrangements must comply
    with NER requirements for least-cost provision.'
  lesson_learnt: Before investing in a new synchronous condenser, investigate whether
    a nearby synchronous generator with a synchronous condensing mode is available
    for contracting — but verify early that it is not already committed under AEMO's
    minimum fault level arrangements, as contracted generators in those arrangements
    cannot provide additional system strength benefit; engage the TNSP to confirm
    eligibility.
