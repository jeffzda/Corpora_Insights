- record_id: ARENA-DLV-47556
  source_title: 'Networks Renewed: Project Results and Lessons Learnt'
  publish_date: 2019-08
  project_name: Networks Renewed
  what_happened: Both market-scale demonstrations required manual transfer of control
    information between the DNSP Distribution Management System (DMS) and the inverter
    control applications, as neither DNSP had automated integration between their
    DMS and the third-party aggregator platforms. This was bespoke to each DNSP and
    was not integrated into normal network operations.
  lesson_learnt: Manual dispatch processes are not scalable — future DER-based network
    support services will require automated DMS integration with inverter control
    platforms via a common API and standardised protocols; without this, the approach
    is too resource-intensive for mainstream DNSP adoption.
