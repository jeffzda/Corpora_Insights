  project_type: network/grid
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: The experimental design differentiated between UE (urban, reactive-power-appropriate)
    and EE rural feeder (real-power/battery management) sites to match control strategy
    to network impedance characteristics.
  transferability: moderate
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id054
