  source_title: Networks Renewed Technical Analysis
  publish_date: 2017-01
  project_name: Networks Renewed
  what_happened: United Energy's distribution network in Victoria already had legacy
    components not designed to the current voltage standard (400V +10%), causing average
    grid voltages in some network areas to trend toward the upper allowable limit
    even before accounting for solar PV export, creating a precondition for voltage
    exceedances as solar penetration increased.
  lesson_learnt: Network demonstrations involving voltage regulation technology should
    assess the legacy infrastructure voltage profile before recruiting demonstration
    sites — pre-existing elevated voltages from non-compliant legacy equipment compound
    the solar-driven over-voltage problem and may make some segments more sensitive
    test sites than anticipated, requiring adjusted control strategies.
