- record_id: ARENA-DLV-64016
  source_title: The Business Case for Behind-the-Meter Inverter Control for Regulating
    Voltage
  publish_date: 2019-04
  project_name: Networks Renewed
  what_happened: Power electronic voltage regulators were technically suitable for
    voltage regulation at Collombatti at a capital cost of $1.185M but were assessed
    as likely to require replacement every 7–10 years, making their lifetime cost
    significantly higher than the initial CAPEX figure suggests.
  lesson_learnt: When comparing network-centric voltage regulation options, total
    lifecycle cost (including replacement cycles) must be used rather than CAPEX alone
    — power electronic equipment with 7–10 year replacement cycles can appear cost-competitive
    at the CAPEX level while being significantly more expensive over a 20–30 year
    asset life.
