  source_title: 'Networks Renewed: Project Results and Lessons Learnt'
  publish_date: 2019-08
  project_name: Networks Renewed
  what_happened: The project identified that the pricing of DER-based network support
    services during the trial was set at fixed levels ($1/kWh per event in NSW; $200/year
    in Victoria) chosen to ensure customer participation, rather than reflecting a
    dynamic real-time market value for the service, leaving value on the table and
    lacking a mechanism to respond to changing network needs.
  lesson_learnt: Develop a dynamic approach to pricing DER-based network support services
    that responds to real-time or simulated market value — fixed pricing set to guarantee
    participation is inefficient and does not signal the true value of the service
    to customers or attract the most cost-effective DER response.
