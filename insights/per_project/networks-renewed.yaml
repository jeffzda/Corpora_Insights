  project_name: Networks Renewed
  what_happened: The BTM voltage regulation solution at Collombatti was assessed as
    neither the most expensive nor the least costly option on a CAPEX basis (~$675,000
    for ~90 homes), sitting between reconductoring ($300,000) and power electronic
    regulators ($1.185M), but with the advantage of being adaptable and scalable as
    voltage issues grow.
  lesson_learnt: BTM inverter voltage control should be positioned not as the lowest-CAPEX
    option but as the most risk-managed option — its scalability (deployable incrementally
    as voltage issues grow) and adaptability provide option value that pure CAPEX
    comparisons with reconductoring do not capture, particularly on feeders where
    PV penetration is still increasing.
