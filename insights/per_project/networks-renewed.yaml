- record_id: ARENA-DLV-47554
  source_title: 'Networks Renewed: Project Results and Lessons Learnt'
  publish_date: 2019-08
  project_name: Networks Renewed
  what_happened: In the Yackandandah (Victoria) trial, reactive power from inverter-connected
    solar and storage delivered a substantial 3–5V voltage correction in the LV network,
    though the solar reactive power response was described as sporadic, suggesting
    control improvements could yield greater impact. The solution was likely less
    expensive than splitting the SWER feeder at a cost of $150,000.
  lesson_learnt: Sporadic inverter reactive power response indicates a need to improve
    inverter control algorithms before deploying at scale — without consistent response,
    the reliability of the DER-based service as a firm network support alternative
    cannot be assured.
