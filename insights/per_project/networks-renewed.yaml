  what_happened: The Networks Renewed project designed its experimental program in
    two sequential phases — pilot-scale demonstration (Oct 2016–Jun 2017) then market-scale
    demonstration (Jul 2017–Jun 2018) — because the ideal design of the market-scale
    demonstration could not be determined in advance of gathering pilot data on control
    effectiveness and network response.
  lesson_learnt: First-of-a-kind smart inverter demonstrations on live distribution
    networks should be staged, with a pilot phase explicitly designed to generate
    the data needed to configure the market-scale experiment — attempting to jump
    directly to market-scale deployment without first characterising feeder-level
    inverter response risks misallocating resources and generating inconclusive data.
