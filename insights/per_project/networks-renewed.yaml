  what_happened: The project found that reactive power from batteries is still available
    even at very low levels of active solar generation — inverters with a minimum
    0.8 power factor specification were able to produce the requested 3 kVAr even
    when solar generation had fallen to approximately 100 W, corresponding to a very
    small power factor.
  lesson_learnt: Do not exclude battery-equipped sites from reactive power service
    delivery during low-solar periods — battery inverters can continue to provide
    reactive power support even when active generation is near zero, extending the
    available service window beyond solar generation hours.
