  source_title: Networks Renewed Technical Analysis
  publish_date: 2017-01
  project_name: Networks Renewed
  what_happened: The Networks Renewed project identified that uncoordinated local
    voltage regulation responses by individual inverters — each acting on locally
    sensed data without coordination — could produce unexpected and potentially inequitable
    outcomes, with customers at the end of feeders bearing a disproportionate burden
    of voltage regulation duty.
  lesson_learnt: When designing smart inverter control demonstrations on distribution
    feeders, the equity implications of local droop control must be explicitly addressed
    — end-of-feeder customers will be assigned more reactive power duty under uncoordinated
    schemes, which may reduce the commercial attractiveness of participation and create
    a barrier to market-scale uptake; coordinated control strategies should be preferred
    to distribute the burden equitably.
