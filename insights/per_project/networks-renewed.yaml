  project_name: Networks Renewed
  what_happened: The updated AS/NZS 4777.2:2015 standard came into force in October
    2016, requiring new inverters to have demand response and power quality response
    modes and align set-points with DNSP requirements — but the majority of inverters
    presently available in the Australian market did not meet these new standards
    at the time of project design.
  lesson_learnt: Demonstrations deploying new inverters for grid services should reference
    the latest AS/NZS 4777.2 standard to ensure all installed hardware is compliant
    from installation, as non-compliant inverters cannot participate in advanced control
    programs and may be refused connection approval — the standard change in October
    2016 represented a significant capability upgrade that procurement specifications
    should explicitly reference.
