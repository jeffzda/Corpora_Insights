- record_id: ARENA-DLV-70127
  source_title: Networks Renewed Technical Analysis
  publish_date: 2017-01
  project_name: Networks Renewed
  what_happened: The Networks Renewed project recognised that solar PV's anti-islanding
    requirement — mandatory disconnection when grid frequency or voltage goes outside
    defined ranges — means that customer solar and battery systems do not provide
    backup power during blackouts unless special backup-power features are specifically
    installed.
  lesson_learnt: Customer engagement programs for solar-storage demonstrations must
    explicitly address the common customer misconception that solar PV and battery
    systems provide blackout protection — failure to correct this expectation before
    installation leads to customer dissatisfaction and can undermine the commercial
    proposition when customers discover their systems disconnect during outages, as
    their motivation for the technology investment may partly depend on assumed backup
    capability.
