- record_id: ARENA-DLV-70107
  source_title: Networks Renewed Technical Analysis
  publish_date: 2017-01
  project_name: Networks Renewed
  what_happened: The Networks Renewed project found that the effectiveness of reactive
    power control for voltage regulation depends critically on whether the distribution
    network is predominantly reactive (urban) or resistive (rural) — reactive power
    control is effective in urban networks but real power management (charging/discharging
    batteries) is required on resistive rural networks.
  lesson_learnt: Before selecting a smart inverter control strategy for a distribution
    network demonstration, the X/R ratio of the target feeder must be characterised
    — applying reactive power control strategies on highly resistive rural networks
    will underperform, while real power modulation via battery storage is the appropriate
    voltage regulation tool for those environments, requiring a different technology
    configuration and customer proposition.
