  source_title: 'Networks Renewed: Project Results and Lessons Learnt'
  publish_date: 2019-08
  project_name: Networks Renewed
  what_happened: The technical results of the trial met or exceeded initial expectations,
    but the commercial readiness of the DER-based voltage regulation solution proved
    further away than anticipated; each trial required bespoke design and application,
    particularly for customer acquisition and integration with DNSP SCADA systems,
    making the process too resource-intensive for mainstream deployment.
  lesson_learnt: Do not assume that a technically successful DER trial will translate
    quickly to commercial readiness — each step of the customer acquisition, integration,
    and control process needs to be simplified and/or standardised before DER-based
    network support services can become a viable alternative to network-side solutions
    at scale.
