  what_happened: Customer recruitment was identified as a difficult and time-consuming
    process; complex customer messaging around the value proposition and the payment/subsidy
    structure was directly attributed to recruitment delays in both NSW and Victoria.
  lesson_learnt: Simplify the customer value proposition before commencing recruitment
    for DER-based network service trials — complex messaging about payments and subsidies
    was directly attributed to recruitment delays, and the offer must be communicated
    clearly enough that customers can easily assess its value.
