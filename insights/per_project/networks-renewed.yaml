- record_id: ARENA-DLV-47558
  source_title: 'Networks Renewed: Project Results and Lessons Learnt'
  publish_date: 2019-08
  project_name: Networks Renewed
  what_happened: The trial recruited 90 customers under two different business models
    (earn-as-you-go at $1/kWh per event in NSW; $200/year upfront gift card in Victoria),
    achieving 18% penetration in Collombatti and 13% in Yackandandah — strong levels
    but insufficient to fully address the voltage constraint on the target feeders.
  lesson_learnt: Customer penetration rates of 13–18% may be insufficient to fully
    resolve network voltage constraints — future DER-based network support programs
    should plan for higher participation levels and test business models that allow
    multiple aggregators to simultaneously recruit customers in a constrained area.
