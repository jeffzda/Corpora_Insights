  evidence_excerpt: A DNSP investing in a network solution takes the risk of a long-term
    asset investment. By acquiring voltage support as a service, the DNSP has no sunk-cost
    in redundant assets. The problem may potentially abate in time, or a new technology
    solution may be developed. By shifting asset ownership to another party, the DNSP
    has increased optionality that reduces its exposure to technology risk.
