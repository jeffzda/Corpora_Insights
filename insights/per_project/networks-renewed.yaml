  project_name: Networks Renewed
  what_happened: 'The Australian solar market experienced a dramatic boom-bust cycle
    driven by government feed-in tariff policy: residential installations peaked at
    958 MW in 2012 following generous FiT programs, then retracted significantly in
    2013 when most governments removed those programs, demonstrating that policy uncertainty
    is a major driver of market volatility.'
  lesson_learnt: Demonstrations of solar-integrated network services should not be
    designed around the assumption that solar PV uptake will continue at boom-phase
    rates — the feed-in tariff boom-bust cycle demonstrated that government policy
    changes can rapidly alter market conditions, and project assumptions about customer
    solar penetration on demonstration feeders should be stress-tested against scenarios
    where uptake stabilises or declines in the near term.
