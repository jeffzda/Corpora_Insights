  source_title: Networks Renewed Technical Analysis
  publish_date: 2017-01
  project_name: Networks Renewed
  what_happened: The Networks Renewed project found that the business case for smart
    inverter voltage regulation services requires simultaneous demonstration of multiple
    value streams ('value stacking') — including voltage regulation, peak demand deferral,
    energy arbitrage, and FCAS market participation — because no single value stream
    is sufficient to justify the investment without others.
  lesson_learnt: Smart inverter and battery storage demonstrations that test only
    one value proposition (e.g., voltage regulation alone) will likely fail to demonstrate
    a viable business case — the demonstration program must be designed to measure
    multiple simultaneous value streams, and the commercial model must allocate revenue
    fairly across customer, network, retailer, and market participants to be replicable
    at scale.
