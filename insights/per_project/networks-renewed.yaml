    status, limiting the ability to identify constraints and available DER resources
    dynamically for network planning and operations.
  lesson_learnt: Publish a real-time model of the LV network that integrates both
    network constraints and DER resource availability — static annual-update data
    (as in current AREMI Network Opportunity Maps) is insufficient for operational
    DER orchestration; real-time data pipelines are needed for network operators to
    identify, plan, and transact for DER-based services.
