  source_title: Networks Renewed Technical Analysis
  publish_date: 2017-01
  project_name: Networks Renewed
  what_happened: The Networks Renewed project established that advanced control strategies
    from the academic literature cannot be implemented during a short pilot-scale
    demonstration due to time constraints — advanced methods require formulation,
    load-flow model validation, and sufficient experimental run-length before they
    can be reliably evaluated, making them only feasible in a subsequent market-scale
    demonstration.
  lesson_learnt: Demonstration project timelines should allocate sufficient run-length
    for each control strategy experiment — advanced coordinated control methods require
    a preceding phase of baseline data collection and model validation before meaningful
    results can be attributed to the control strategy, and squeezing multiple novel
    control methods into a single short demonstration phase will produce data too
    noisy to be conclusive.
