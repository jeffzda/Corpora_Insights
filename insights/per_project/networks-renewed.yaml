  what_happened: The Networks Renewed project noted that load-flow models used by
    both UE and EE (implemented in PSS Sincal) have uncertain input data — the resistance
    and reactance per unit length of network elements are not precisely known, and
    service line impedances add further complexity — meaning models require experimental
    validation before they can reliably predict the impact of inverter control strategies.
  lesson_learnt: Distribution network load-flow models should not be trusted without
    experimental validation when designing inverter control demonstrations — measured
    voltage responses to known inverter actions are required to calibrate network
    impedance parameters, and the demonstration program should explicitly include
    a model validation phase before drawing conclusions about control strategy effectiveness
    or scaling results to future solar penetration levels.
