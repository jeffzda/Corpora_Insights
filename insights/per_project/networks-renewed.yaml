  publish_date: 2017-01
  project_name: Networks Renewed
  what_happened: The Networks Renewed project identified that network operators need
    to integrate smart inverter control systems with their existing SCADA infrastructure,
    but the choice of integration architecture — whether the network operator facilitates
    communications directly, uses a third-party aggregator, or logs into a third-party
    product — was unresolved at the time of project design, with significant implications
    for data security, control granularity, and cost.
  lesson_learnt: Smart inverter demonstration projects should resolve the SCADA integration
    architecture before committing to control hardware procurement — the choice between
    direct SCADA integration, third-party aggregator, and third-party platform access
    models has material consequences for data security, network operator control granularity,
    and cost, and must be agreed between the network operator and technology partners
    at the contracting stage rather than deferred to implementation.
