  publish_date: 2019-04
  project_name: Networks Renewed
  what_happened: The NSW demonstration (Collombatti) deployed BTM inverter control
    using solar PV, battery storage, and smart inverters with a VPP platform (Reposit
    Power) to regulate voltage on behalf of Essential Energy, paying customers $1
    per kWh per voltage regulation event on an 'earn as you go' basis.
