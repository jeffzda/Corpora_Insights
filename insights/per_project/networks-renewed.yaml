- record_id: ARENA-DLV-47557
  source_title: 'Networks Renewed: Project Results and Lessons Learnt'
  publish_date: 2019-08
  project_name: Networks Renewed
  what_happened: Each of the three DNSP partners required a bespoke control and integration
    approach — Essential Energy used Reposit Power's MarketPlace API, United Energy
    used a third-party platform, and AusNet Services developed its own Distributed
    Energy Network Optimisation Platform (DENOP) — making the model replicable but
    not scalable without standardisation.
  lesson_learnt: Develop a common API and standardised protocols for DER-to-DNSP integration
    across the industry — the proliferation of bespoke VPP deployments with different
    stakeholders, technologies, and platforms will prevent mainstreaming unless common
    standards are established, such as through the VPP Technical Reference Group.
