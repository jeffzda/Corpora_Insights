- record_id: ARENA-DLV-47574
  source_title: 'Networks Renewed: Project Results and Lessons Learnt'
  publish_date: 2019-08
  project_name: Networks Renewed
  what_happened: The project found that 57% of NSW respondents did not notice any
    change in their power quality during the trial, despite voltage being substantially
    corrected at the network level, while 68% noticed their electricity bills were
    much lower and 74% were satisfied with bill savings. Mobile apps (64%) were the
    most popular tracking mode, with more than half checking daily or weekly.
  lesson_learnt: Customers are unlikely to perceive or value invisible network benefits
    (voltage correction) — focus customer value propositions on tangible, personally
    experienced benefits such as bill savings rather than network-level outcomes that
