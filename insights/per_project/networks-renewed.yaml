  what_happened: The Networks Renewed market-scale demonstration was structured to
    include a subsidy component to reflect anticipated near-term reductions in battery
    storage costs — acknowledging that without subsidy, battery storage economics
    would not yet support a fully commercial model at the time of the demonstration.
  lesson_learnt: Market-scale demonstrations of storage-based network services that
    are designed to test commercial replicability should explicitly quantify and document
    the subsidy component, and calibrate it to near-term forecast cost reductions
    — this allows post-demonstration business case analysis to extrapolate from subsidised
    pilot economics to unsubsidised commercial viability, and avoids the demonstration
    being dismissed as non-transferable due to implicit subsidies.
