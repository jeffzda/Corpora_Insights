  project_name: Networks Renewed
  what_happened: The Networks Renewed project identified that advanced control methods
    (automated and aggregated) documented in the academic literature had not been
    practically demonstrated — the literature reviews and related project scans found
    very few examples of smart inverter control specifically targeting voltage regulation
    rather than peak demand or self-consumption.
  lesson_learnt: ARENA-funded smart inverter demonstrations should not assume that
    published academic control algorithms can be directly deployed — the engineering
    literature contains numerous candidate methods that have never been validated
    in real network conditions, meaning practical implementation requires a structured
    experimental program beginning with simpler droop-based controls before attempting
    advanced coordinated strategies.
