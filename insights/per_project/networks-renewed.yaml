- record_id: ARENA-DLV-47565
  source_title: 'Networks Renewed: Project Results and Lessons Learnt'
  publish_date: 2019-08
  project_name: Networks Renewed
  what_happened: Both trials experienced communications problems between the aggregator
    platforms and individual DER devices; devices 'out of communication' increased
    the reliability risk of the aggregated portfolio and reduced the DNSP's confidence
    that a firm service could be delivered.
  lesson_learnt: Portfolio-level communication reliability is a critical risk for
    DER-based network services — future projects should actively de-risk portfolio
    operations by testing contingency modes (e.g. timeclock-based or local voltage-sensing
    fallback discharge) to ensure a minimum service level even when some devices lose
    connectivity.
