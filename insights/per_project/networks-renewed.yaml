  source_title: 'Networks Renewed: Project Results and Lessons Learnt'
  publish_date: 2019-08
  project_name: Networks Renewed
  what_happened: During evening peak abatement tests in Collombatti (NSW), batteries'
    rate of discharge slowed before the test window was complete, meaning the available
    service capacity and duration were not accurately predicted by the aggregator
    platform.
  lesson_learnt: Prediction algorithms for battery state-of-charge and deliverable
    capacity must be improved before DER-based services can be offered as a firm network
    support product — inaccurate capacity prediction undermines service reliability
    and DNSP confidence in the solution.
