  project_name: Networks Renewed
  what_happened: The project identified that ongoing DER-based voltage support services
    would not fall into the DNSP's regulated asset base, potentially creating an incentive
    bias against demand-side solutions compared with traditional capital network investments
    that do enter the regulated asset base.
  lesson_learnt: Regulatory treatment of DER-based network services must be addressed
    alongside technical demonstration — the exclusion of ongoing service payments
    from the regulated asset base creates a structural incentive bias toward capital
    network solutions that will persist unless addressed through demand management
    incentive scheme (DMIS) reform or equivalent regulatory change.
