- record_id: ARENA-DLV-70116
  source_title: Networks Renewed Technical Analysis
  publish_date: 2017-01
  project_name: Networks Renewed
  what_happened: Essential Energy's network experienced a situation where mobile diesel
    generators used during planned outages were forced to supply large amounts of
    reactive power when solar installations resynchronised and supplied only real
    power, leading to poor power factor conditions and tripping of the mobile generation
    equipment.
  lesson_learnt: Planned outage procedures on networks with significant solar PV penetration
    must include provisions to manually disable local embedded generation before deploying
    temporary generators — the reactive power demand imposed on mobile generation
    by resynchronised solar inverters can cause equipment trips, creating safety and
    reliability risks that are not present on networks without high solar penetration.
  issue_severity: moderate
  project_type: network/grid
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated integration
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Essential Energy's solution was to manually disable local embedded
    generation during planned outages where temporary generators are used — a procedural
    workaround rather than a technical fix.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id063
  - 12
  evidence_excerpt: When mobile diesel generation is used on LV street circuits during
    planned outages, solar installations resynchronise and supply real power only,
    requiring the mobile generation to supply much of the reactive power for the LV
    loads along with the small amount of remaining real power. This poor power factor
    situation can lead to tripping of the mobile generation. To prevent this, local
    embedded generation must be manually disabled during planned outages where temporary
    generators are used.
