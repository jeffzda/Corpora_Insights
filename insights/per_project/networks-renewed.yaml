  project_name: Networks Renewed
  what_happened: At the outset of the Networks Renewed project, the vast majority
    of the approximately 5.2 GW of inverters installed across Australian distribution
    networks lacked smart-grid capabilities, with only 50–60% of inverters installed
    from 2013 onwards expected to have such capabilities, and only half of those being
    easily programmable.
  lesson_learnt: Project designers relying on existing installed inverter fleets for
    smart-grid demonstrations must audit actual programmability, not just nameplate
    capability — a large fraction of nominally 'smart' inverters (particularly Chinese-manufactured
    units with flash-locked settings) cannot be activated on site, which directly
    constrains the recruitment pool for demonstration programs.
