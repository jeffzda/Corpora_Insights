- record_id: ARENA-DLV-47551
  source_title: 'Networks Renewed: Project Results and Lessons Learnt'
  publish_date: 2019-08
  project_name: Networks Renewed
  what_happened: The trial proved that both residential solar PV and battery storage
    can support network voltage through active and reactive power control on low voltage
    distribution networks, substantially correcting voltage on two LV networks (Collombatti,
    NSW and Yackandandah, Victoria) with some positive impact at the HV level.
  lesson_learnt: Residential solar PV and battery inverters can be used as a viable
    alternative to traditional network-side voltage solutions (e.g. reconductoring)
    — demonstrating this technical feasibility is a necessary but not sufficient step;
    commercial readiness requires additional standardisation of integration, pricing,
    and customer acquisition processes.
