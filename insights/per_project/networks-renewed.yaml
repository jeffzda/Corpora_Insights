  what_happened: The Networks Renewed project found that only two demonstrations across
    two DNSP feeders are insufficient to establish competitive market pricing for
    BTM voltage regulation services — neither site represents efficient market costs,
    and broader DNSP engagement is needed to build a generalisable value estimating
    tool.
  lesson_learnt: A minimum of two demonstration sites is not sufficient to establish
    credible market pricing for a new network service — plan for a structured multi-DNSP
    engagement process from the outset to build a wider dataset of voltage pathology
    types, network configurations, and cost comparisons that can underpin a broadly
    applicable estimating tool.
