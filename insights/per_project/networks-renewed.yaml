  project_name: Networks Renewed
  what_happened: In NSW, customers found it difficult to assign value to the subsidy
    they were to receive under the earn-as-you-go model ($1/kWh per event), and over
    a quarter of participants did not find the communication tools used by the project
    team useful. The project website appeared to be the least useful communication
    mechanism.
  lesson_learnt: A simple, fixed upfront payment (e.g. a gift card) is more effective
    as a customer value proposition for DER trials than a variable per-event payment
    — NSW customers struggled to value the earn-as-you-go model, whereas Victorian
    customers found the $200 annual voucher model clearly understandable.
