  project_name: Networks Renewed
  what_happened: The project determined that the demand-side DER solution is likely
    to increase in economic favour relative to network reconductoring for longer feeders
    with lower customer density per kilometre, because reconductoring costs on a per-km
    basis while DER-based solutions cost on a per-customer basis.
  lesson_learnt: When evaluating DER-based network support against traditional reconductoring,
    use a cost metric normalised per kilometre of feeder for the network option versus
    per customer for the DER option — this reveals that DER solutions become relatively
    more attractive on long, sparsely populated rural feeders.
