  source_title: 'Networks Renewed: Project Results and Lessons Learnt'
  publish_date: 2019-08
  project_name: Networks Renewable
  what_happened: The project found that DER-based voltage support as a service shifts
    asset ownership and risk away from the DNSP — instead of a long-term regulated
    capital investment, the DNSP acquires a service and has no sunk cost in redundant
    assets if the voltage problem abates or new solutions emerge.
  lesson_learnt: Frame DER-based network services to DNSP decision-makers as a risk-reduction
    option as well as a cost option — unlike capital network investment, service-based
    DER arrangements carry no technology stranding risk and give the DNSP optionality
    to adapt as load patterns and technologies evolve.
