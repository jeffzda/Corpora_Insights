  publish_date: 2017-01
  project_name: Networks Renewed
  what_happened: The Networks Renewed project identified that the regulatory framework
    governing Australian network businesses — specifically the AER's economic regulation
    model — can hinder efficient deployment of non-network investment alternatives
    such as smart inverter services, because the regulatory structure was designed
    around centralised generation and unidirectional power flow with steadily increasing
    peak demand.
  lesson_learnt: Network-supported DER demonstrations must explicitly include a policy
    and business case component to demonstrate cost-effectiveness relative to traditional
    regulated network investment — without demonstrated cost parity or superiority,
    the AER regulatory framework will continue to favour capex network solutions over
    smart inverter service procurement, regardless of technical performance, because
    the incentive structure does not naturally reward non-network alternatives.
