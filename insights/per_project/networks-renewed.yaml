  publish_date: 2019-04
  project_name: Networks Renewed
  what_happened: Customers participating in the NSW trial were unable to set their
    own 'accept' limits in response to adjusted bid prices from Essential Energy,
    making them price-takers in the voltage regulation market with no ability to negotiate
    or withdraw from control events.
  lesson_learnt: BTM voltage regulation business models should consider giving customers
    the ability to set minimum accept thresholds for control events — price-taker
    arrangements reduce customer agency and may create retention and satisfaction
    risks at scale, particularly if DNSPs later seek to reduce the per-event payment
    rate.
