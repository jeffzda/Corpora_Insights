  project_name: Networks Renewed
  what_happened: The Mooroolbark Community Mini Grid successfully operated in islanded
    mode for up to 22 hours, powered entirely by customer solar and batteries, but
    required a bespoke protection configuration using a three-phase battery storage
    system as a 'stabiliser' because inverters supply only relatively small fault
    currents (2–3 times continuous rating) compared to the grid.
  lesson_learnt: Islanded operation of an inverter-dominated LV network requires a
    purpose-built protection scheme — standard protection designed for grid fault
    currents is unsuitable; a dedicated protection load flow model and a grid-forming
    storage asset as a voltage/frequency reference are minimum requirements for safe
    islanded operation.
