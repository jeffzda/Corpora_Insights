  source_title: Networks Renewed Technical Analysis
  publish_date: 2017-01
  project_name: Networks Renewed
  what_happened: Networks Renewed investigated two contrasting ownership models simultaneously
    — utility ownership of behind-the-meter storage assets (United Energy, Victoria)
    and customer ownership with network service payments via a third-party aggregator
    (Essential Energy/Reposit Power, NSW) — because the growth of energy storage was
    expected to be dominated by residential systems, making customer ownership an
    important model to test for network applications.
  lesson_learnt: Demonstrations of distributed storage for network services should
    test customer-ownership and utility-ownership models in parallel rather than defaulting
    to the utility-ownership approach that has dominated previous Australian deployments
    — the customer-ownership model has distinct cost and engagement advantages but
    introduces a third-party aggregator into the value chain, adding commercial and
    regulatory complexity that must be explicitly demonstrated before it can scale.
