- record_id: ARENA-DLV-70103
  source_title: Networks Renewed Technical Analysis
  publish_date: 2017-01
  project_name: Networks Renewed
  what_happened: Essential Energy documented persistent voltage exceedance events
    on rural feeders caused by solar PV export, including a 2013 case on Feeder A
    where voltages exceeded 253V, and a 2016 case on Feeder B where high voltage variances
    of around 35V persisted even after a tap change, both correlated to solar PV penetration
    of around 45–48 kW on long feeder branches.
  lesson_learnt: On long rural feeders where both over-voltage and under-voltage risks
    coexist, traditional remedies such as tap changes cannot resolve solar-driven
    over-voltage without pushing minimum voltages below standard — smart inverter
    control must be considered early in network planning for feeders with solar penetration
    above a low threshold, particularly where feeder length amplifies impedance effects.
