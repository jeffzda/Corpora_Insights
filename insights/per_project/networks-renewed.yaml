- record_id: ARENA-DLV-70105
  source_title: Networks Renewed Technical Analysis
  publish_date: 2017-01
  project_name: Networks Renewed
  what_happened: Solar PV inverters on Essential Energy's network were experiencing
    repetitive tripping cycles due to over-voltage — when voltage exceeded limits,
    inverters disconnected, voltage returned to acceptable levels, inverters reconnected,
    voltage rose again, causing a continuing cycle — meaning PV systems could not
    supply consistent power.
  lesson_learnt: Inverter over-voltage tripping cycles on high-impedance rural feeders
    represent a system-level interaction failure, not an individual inverter fault
    — resolving them requires coordinated voltage regulation across the feeder rather
    than inverter-by-inverter settings adjustment, and project teams should design
    for this systemic intervention from the outset.
