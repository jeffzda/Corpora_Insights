- record_id: ARENA-DLV-14678
  source_title: 'Lessons From the Fringes: Australian Fringe-Of-Grid Projects in ARENA''s
    Portfolio'
  publish_date: 2018-06
  project_name: Multiple FOG Projects (portfolio-level)
  what_happened: Across multiple ARENA-funded FOG projects, a consistent pattern was
    observed of faster-than-expected construction but longer-than-expected commissioning,
    resulting in insurance extension costs and intermediate trading fees that were
    not fully budgeted.
  lesson_learnt: 'FOG solar project budgets and schedules should reverse the conventional
    assumption: plan for construction to complete ahead of schedule but commissioning
    to run significantly over — provision for insurance extensions and intermediate
    trading fees as a standard contingency item.'
