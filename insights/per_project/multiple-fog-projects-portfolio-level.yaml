- record_id: ARENA-DLV-14679
  source_title: 'Lessons From the Fringes: Australian Fringe-Of-Grid Projects in ARENA''s
    Portfolio'
  publish_date: 2018-06
  project_name: Multiple FOG Projects (portfolio-level)
  what_happened: Across multiple ARENA-funded FOG projects, local sourcing of qualified
    labour and specialty equipment in remote areas was consistently identified as
    a challenge, increasing costs and causing delays; network connection and regulatory
    changes were also a recurring theme.
  lesson_learnt: FOG project delivery plans should treat remote labour and equipment
    sourcing as a primary risk, not a secondary one — budget for higher labour mobilisation
    costs, pre-identify and approve local contractors, and build regulatory change
    buffers into connection agreement and design documentation.
  issue_severity: moderate
  project_type: generation
  project_scale_band: first commercial/FOAK
