  source_title: Regulatory Distributed Energy Integration Program (DEIP) Dive Workshop
  publish_date: 2019-06
  project_name: Regulatory DEIP Dive Workshop – Adelaide
  what_happened: Endeavour Energy reported receiving applications from industrial
    customers to implement new DER business models that operate both behind the meter
    and in front of the meter simultaneously. The existing rules governing NMIs and
    connection arrangements were not written with these hybrid arrangements in mind,
    creating a regulatory misfit for emerging commercial DER integration models.
  lesson_learnt: Innovative DER integration projects that span the meter boundary
    face regulatory barriers because NMI rules and connection frameworks were designed
    for uni-directional customer arrangements — project developers should engage the
    DNSP and AER early to identify whether an exemption, rule change, or regulatory
    sandbox is required before committing to a business model that assumes current
    rules will accommodate behind-the-meter and in-front-of-meter operations simultaneously.
