- record_id: ARENA-DLV-29013
  source_title: Regulatory Distributed Energy Integration Program (DEIP) Dive Workshop
  publish_date: 2019-06
  project_name: Regulatory DEIP Dive Workshop – Adelaide
  what_happened: The workshop identified that the current DNSP access and connection
    framework is structured around meeting reliability standards for consumers (importers),
    with DNSPs holding no obligation to enable export. DER producers are subject to
    a 'first come, first served, one size fits all' approach, leaving no mechanism
    to efficiently allocate scarce export capacity among competing users as penetration
    grows.
  lesson_learnt: DER projects relying on unrestricted export access face structural
    risk from the current connection framework — as penetration increases and hosting
    capacity tightens, later-connecting systems face static constraints with no right
    of appeal or capacity market access; project developers should assess local penetration
    levels and connection queue position before assuming full export entitlement in
    project revenue models.
  issue_severity: major
  project_type: network/grid
  project_scale_band: utility/large-scale
  lifecycle_phase: approvals/contracting
  proponent_type: network business
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: policy/market influence only
  secondary_failure_mode: poor scoping
  intervention_note: The DEIP workshop was convened specifically to develop reform
    options including access products with different firmness levels, pricing signals,
    and DSO platforms as alternatives to the static first-come-first-served framework.
  transferability: broad
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id012
  - 30
  evidence_excerpt: Framework designed around meeting reliability standards for consumers,
    not producers … DNSPs must connect DER but have no obligation to enable export
    … For producers, it is a 'first come, first serve' and 'one size fits all' approach
    … DNSPs have limited visibility of LV network constraints so limited practical
    ability to implement more dynamic approaches
