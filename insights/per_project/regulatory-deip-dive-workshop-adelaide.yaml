  source_title: Regulatory Distributed Energy Integration Program (DEIP) Dive Workshop
  publish_date: 2019-06
  project_name: Regulatory DEIP Dive Workshop – Adelaide
  what_happened: Endeavour Energy reported that its primary source of knowledge about
    LV export constraints was customer complaints, because it lacked metering or monitoring
    visibility of its LV network. This reactive, complaint-driven awareness meant
    constraints were only identified after customers had already experienced curtailment
    or voltage issues.
  lesson_learnt: Absence of LV network monitoring means a DNSP is operationally blind
    to emerging export constraints until customers report problems — investment in
    smart meter data acquisition and edge-of-grid monitoring should be treated as
    foundational infrastructure for DER integration programs, not a discretionary
    enhancement.
