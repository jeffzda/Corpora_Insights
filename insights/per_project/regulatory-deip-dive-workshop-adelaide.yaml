- record_id: ARENA-DLV-29007
  source_title: Regulatory Distributed Energy Integration Program (DEIP) Dive Workshop
  publish_date: 2019-06
  project_name: Regulatory DEIP Dive Workshop – Adelaide
  what_happened: Endeavour Energy's Kentlyn case study documented a residential customer
    with a compliant 16 kW three-phase solar installation experiencing severe volt-watt
    curtailment — data showed the system could export at best ~3 kW before curtailment,
    despite being a compliant installation on a feeder with ~40 kW total solar. An
    LV StatCom was identified as the required solution.
  lesson_learnt: Compliant DER installations do not guarantee export capability —
    on constrained LV feeders, volt-watt curtailment can reduce effective export to
    a fraction of installed capacity. Network operators and DER project developers
    should assess feeder-level hosting capacity before assuming customer export entitlements
    are realisable, and budget for LV power electronics (e.g. StatCom) as a potential
    enabling cost.
  issue_severity: moderate
