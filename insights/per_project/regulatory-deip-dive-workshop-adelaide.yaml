- record_id: ARENA-DLV-29005
  source_title: Regulatory Distributed Energy Integration Program (DEIP) Dive Workshop
  publish_date: 2019-06
  project_name: Regulatory DEIP Dive Workshop – Adelaide
  what_happened: SA Power Networks conducted customer research (Newgate Research)
    across solar, non-solar and vulnerable customer segments on three DER management
    options. Dynamic export management was ranked as both the most preferred option
    (54%) and most in customers' long-term interests (48%) — ahead of comprehensive
    network upgrade and no upgrade.
  lesson_learnt: Customer research should be conducted before committing to a DER
    management strategy — SAPN's research demonstrated that customers, including vulnerable
    segments, preferred dynamic export management over both network augmentation and
    the status quo, providing a social licence basis for the regulatory proposal that
    a technical-only analysis would not supply.
