- record_id: ARENA-DLV-29008
  source_title: Regulatory Distributed Energy Integration Program (DEIP) Dive Workshop
  publish_date: 2019-06
  project_name: Regulatory DEIP Dive Workshop – Adelaide
  what_happened: Endeavour Energy identified that during its most recent AER regulatory
    determination process, the focus was on After Diversity Maximum Demand (ADMD)
    assumptions for network sizing, but this metric does not account for the expected
    generation output from DER in new greenfield developments. With near-100% PV penetration
    expected in new housing areas, reducing ADMD assumptions could inadvertently create
    localised generation constraints.
  lesson_learnt: Network planning tools and regulatory benchmarking frameworks designed
    around consumption load will systematically under-invest in network capacity needed
    to handle reverse power flows from high-DER greenfield developments — DNSPs and
    regulators must update planning assumptions to incorporate DER generation profiles
    alongside demand, or risk creating voltage and export constraints in newly built
    networks.
  issue_severity: major
  project_type: network/grid
  project_scale_band: utility/large-scale
  lifecycle_phase: development/design
  proponent_type: network business
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: null
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id007
  - 63
  evidence_excerpt: What this measure does not consider is the expectation of DER
    generation within those areas and what the 'load' from these generation sources
    may be. It is entirely conceivable that by reducing the ADMD assumptions we may
    be creating the environment where localised generation constraints may arise in
    the future.
