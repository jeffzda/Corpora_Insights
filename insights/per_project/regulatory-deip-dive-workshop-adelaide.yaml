- record_id: ARENA-DLV-29002
  source_title: Regulatory Distributed Energy Integration Program (DEIP) Dive Workshop
  publish_date: 2019-06
  project_name: Regulatory DEIP Dive Workshop – Adelaide
  what_happened: SA Power Networks reduced its standard export limit from 10 kW to
    5 kW in 2017 in response to growing voltage constraint issues caused by high rooftop
    PV penetration, and anticipated further reductions would be required. This static,
    blunt instrument response was identified as economically inferior to dynamic export
    management.
  lesson_learnt: Static export limit reductions are a short-term stopgap that progressively
    curtail customer value as DER penetration grows; network operators should model
    and plan for dynamic export management well before hosting capacity is reached
    to avoid locking in sub-optimal static constraints.
