- record_id: ARENA-DLV-29010
  source_title: Regulatory Distributed Energy Integration Program (DEIP) Dive Workshop
  publish_date: 2019-06
  project_name: Regulatory DEIP Dive Workshop – Adelaide
  what_happened: The workshop identified that the existing regulatory framework for
    DNSPs contains no explicit incentives related to export constraints — the framework
    is structured around reliability and consumption, with financial incentives (CESS,
    EBSS, STPIS) not designed to reward DNSPs for enabling or maximising DER export
    capability.
  lesson_learnt: Absence of explicit export-related incentives in DNSP regulatory
    frameworks means network businesses face no financial consequence for imposing
    export constraints that reduce system-wide DER value — regulatory reform projects
    and DER integration programs should account for this incentive gap when assessing
    whether a DNSP will proactively invest in constraint resolution without regulatory
    intervention.
