- record_id: ARENA-DLV-29011
  source_title: Regulatory Distributed Energy Integration Program (DEIP) Dive Workshop
  publish_date: 2019-06
  project_name: Regulatory DEIP Dive Workshop – Adelaide
  what_happened: The workshop identified a growing cross-subsidy problem in distribution
    networks, where rooftop solar PV owners export energy without paying use-of-system
    charges, leading to revenue under-recovery from solar generators that is borne
    by non-solar customers. Several customer-focused organisations were considering
    a rule change request to remove the current prohibition on DNSPs applying a use-of-system
    charge on energy exporters.
  lesson_learnt: DER project developers and network businesses should anticipate that
    the current prohibition on export use-of-system charges is a live regulatory risk
    — a rule change removing this prohibition could materially alter the economics
    of solar and battery export projects, and should be factored into long-term revenue
    assumptions in project business cases.
