- record_id: ARENA-DLV-29001
  source_title: Regulatory Distributed Energy Integration Program (DEIP) Dive Workshop
  publish_date: 2019-06
  project_name: Regulatory DEIP Dive Workshop – Adelaide
  what_happened: SA Power Networks identified that it has almost no real-time visibility
    of its low voltage (LV) network, which meant it could not directly monitor where
    DER was being connected or how reverse power flows were affecting operational
    capacity. Hosting capacity was estimated using a statistical modelling tool originally
    developed for Ofgem (EA Technology) rather than from live network data.
  lesson_learnt: DNSPs planning for high-DER futures must invest in LV network monitoring
    infrastructure before hosting capacity is exhausted — relying on statistical modelling
    tools as a proxy for real-time visibility leaves the network operator unable to
    identify the most efficient intervention and delays active management of constraints.
  issue_severity: major
  project_type: network/grid
  project_scale_band: utility/large-scale
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: null
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: SAPN proposed procuring smart meter data, deploying smart inverters
    and investing in LV monitoring as part of its 2020-25 regulatory proposal to close
    the visibility gap.
  transferability: broad
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id001
  - 41
  evidence_excerpt: A key challenge is we have almost no visibility of our LV network
    today … We have estimated the hosting capacity of our LV network using a statistical
