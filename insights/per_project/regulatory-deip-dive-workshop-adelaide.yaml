- record_id: ARENA-DLV-29004
  source_title: Regulatory Distributed Energy Integration Program (DEIP) Dive Workshop
  publish_date: 2019-06
  project_name: Regulatory DEIP Dive Workshop – Adelaide
  what_happened: SA Power Networks identified that inverter vendors would not adopt
    smart inverter capabilities (AS4777 Volt/VAR response modes and dynamic export
    compliance) unless national standards and direction were agreed across the industry.
    Without this, SAPN's ability to deploy flexible exports at scale was contingent
    on a regulatory outcome it could not control.
  lesson_learnt: Technology deployment programs that depend on vendor-embedded firmware
    or device-level standards (e.g. smart inverter export controls) must be preceded
    by national standards agreement — a single DNSP cannot drive vendor adoption unilaterally,
    so industry-wide coordination should be treated as a critical path dependency
    in DER integration project planning.
