- record_id: ARENA-DLV-29012
  source_title: Regulatory Distributed Energy Integration Program (DEIP) Dive Workshop
  publish_date: 2019-06
  project_name: Regulatory DEIP Dive Workshop – Adelaide
  what_happened: Endeavour Energy's Kellyville distribution substation reached close
    to 100% solar PV penetration with system sizes of 3–5 kW. The network manages
    routine reverse power flows using voltage reduction at the zone substation and
    distribution transformer tap adjustments, with the strong urban network able to
    accommodate these flows without service disruption.
  lesson_learnt: High solar penetration (up to 100%) can be accommodated in strong
    urban underground LV networks through proactive voltage management (zone substation
    voltage reduction, distribution transformer re-tapping) without requiring network
    augmentation — this operational approach should be documented and considered as
    a low-cost first response before capital investment in DER-dense urban areas.
