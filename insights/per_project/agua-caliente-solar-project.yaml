  project_name: Agua Caliente Solar Project
  what_happened: The Agua Caliente project — the largest commissioned PV plant in the world at time of construction (>AUD 600M, connected to a 500kV transmission line) — developed and demonstrated grid
    support functions including voltage regulation, active power management, frequency response, and fault ride-through capability, which were subsequently adopted by other utility-scale PV plants.
  lesson_learnt: Utility-scale PV plants must be designed to provide active grid support functions (voltage regulation, active power management, fault ride-through) equivalent to conventional generators
    — these capabilities, once developed at scale, can be standardised and adopted across subsequent utility-scale PV projects.
