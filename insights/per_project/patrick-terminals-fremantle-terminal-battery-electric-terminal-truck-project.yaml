- record_id: ARENA-DLV-2605
  source_title: ARENA Insights Forum November 2024 - Accelerating Zero-Emissions Heavy
    Transport
  publish_date: 2024-11
  project_name: Patrick Terminals Fremantle Terminal – Battery Electric Terminal Truck
    Project
  what_happened: The project assessed overall delivery complexity as low for the ~500kWh
    LFP battery platform charging at 250–300kW, but identified that successful delivery
    remained conditional on infrastructure readiness/grid capacity and operational
    integration including rotation charging.
  lesson_warnt: 'Even where EV fleet deployment is assessed as low complexity, delivery
    is contingent on two preconditions: grid/infrastructure readiness and operational
    integration (particularly rotation charging schedules) — these must be resolved
    before deployment, not during.'
