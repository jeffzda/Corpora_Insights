  source_title: ARENA Insights Forum November 2024 - Accelerating Zero-Emissions Heavy
    Transport
  publish_date: 2024-11
  project_name: Patrick Terminals Fremantle Terminal – Battery Electric Terminal Truck
    Project
  what_happened: Nine battery electric terminal trucks (88-ton capacity) were deployed
    at Patrick Terminals Fremantle, replacing eight end-of-life ICE terminal trucks,
    alongside CCS2 charging infrastructure and fleet power management systems. BEV-ITVs
    reached full operation in August 2024.
  lesson_learnt: Procurement specifications must be written with precision ('what
    you say/write is what you get'), and using a single supplier to manage integration
    between key components reduces integration risk in complex heavy vehicle EV deployments.
