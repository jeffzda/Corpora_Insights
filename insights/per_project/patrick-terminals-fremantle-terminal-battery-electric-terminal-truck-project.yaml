- record_id: ARENA-DLV-2606
  source_title: ARENA Insights Forum November 2024 - Accelerating Zero-Emissions Heavy
    Transport
  publish_date: 2024-11
  project_name: Patrick Terminals Fremantle Terminal – Battery Electric Terminal Truck
    Project
  what_happened: Despite reductions in battery costs, a total cost of ownership gap
    remained for heavy vehicle applications (GCM >70T), driven primarily by charging
    infrastructure capital costs. Projects at this scale were still at proof-of-concept
    or development phase.
  lesson_learnt: For heavy vehicle applications above 70T GCM requiring high-power
    charging (>500kW) and large batteries (>500kWh), a significant TCO gap persists
    and external support is required to demonstrate feasibility and stimulate demand
    — do not assume light/medium EV economics transfer to this segment.
