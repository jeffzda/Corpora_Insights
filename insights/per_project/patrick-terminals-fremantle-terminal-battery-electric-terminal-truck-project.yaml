  what_happened: In the initial months of operation, the project required close management
    of servicing and spare parts availability due to the novelty of the vehicle OEM
    in the Australian context.
  lesson_learnt: When deploying a new-to-market heavy vehicle OEM, plan for intensive
    spare parts and servicing management in the first months of operation — supply
    chains for novel platforms are immature and require active management.
