- record_id: ARENA-DLV-71071
  source_title: Hybrid Power Generation for Australian Off-Grid Mines
  publish_date: 2018-06
  project_name: Sun Metals Zinc Refinery PV Project
  what_happened: Sun Metals zinc refinery in Queensland installed a 124 MWAC (151 MWDC) PV array in 2017, reducing electricity costs (previously 48% of total OPEX) by enabling load shifting of the electrolysis
    process to coincide with peak PV generation hours, increasing production capacity by up to 5% and reducing total OPEX by 15%.
  lesson_learnt: For large industrial loads that are flexible in timing (such as electrolysis), scheduling electricity-intensive processes to coincide with peak PV generation hours can increase throughput
    and reduce OPEX substantially — the Sun Metals experience demonstrates 15% OPEX reduction and 5% production increase from this load-shifting approach.
