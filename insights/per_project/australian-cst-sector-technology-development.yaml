  evidence_excerpt: As new technologies are developed, the focus is necessarily on
    effectiveness. As technology progresses through to commercialisation, attention
    turns toward cost reduction through design. This step is a significant one for
    technology developers, as it requires expertise that is not typically in-house
    and requires pragmatism that often challenges passionate inventors and researchers.
