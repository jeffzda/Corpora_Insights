- record_id: ARENA-DLV-47062
  source_title: Australian Concentrating Solar Thermal Industry Roadmap
  publish_date: 2018-08
  project_name: Australian CST Sector — Technology Development
  what_happened: Australian CST technology developers (including Vast Solar, SolaStor,
    HeliostatSA) had developed novel technologies with focus on technical effectiveness
    but had not applied 'design for manufacture' principles to reduce component costs,
    limiting their ability to reach commercial cost competitiveness. The transition
    from effective prototype to manufacturable commercial product required specialist
    expertise not typically available in-house.
  lesson_learnt: Technology developers transitioning from R&D to commercial deployment
    should engage specialist 'design for manufacture' expertise early in the commercialisation
    process — this step is often underestimated by developers focused on technical
    effectiveness, but simplifying component design, maximising use of standard products,
    and optimising procurement can have a major impact on both cost and supply chain
    reliability.
