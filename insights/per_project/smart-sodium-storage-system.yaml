- record_id: ARENA-DLV-48162
  source_title: Smart Sodium Storage System Final Report
  publish_date: 2022-02
  project_name: Smart Sodium Storage System (S4) Project
  what_happened: The project identified that the use of two cathode material candidates
    (layered oxides and Prussian Blue) in parallel, necessitated by limited funding,
    diluted research effort and slowed progress on both pathways compared to what
    a focused single-cathode strategy might have achieved.
  lesson_learnt: When funding is constrained, parallel development of multiple material
    candidates in a single project reduces the depth of progress on each; where possible,
    stage-gate the selection of primary candidates early so resources can be concentrated
    on the most promising pathway before scale-up work begins.
