  what_happened: Managing researchers and PhD students in an academic environment
    toward commercially-oriented ARENA project goals proved persistently difficult
    because the researchers' primary incentive — publishing papers essential for future
    employment — was not well aligned with the project's commercial demonstration
    and scaled-production objectives.
  lesson_learnt: When structuring commercially-oriented R&D projects delivered through
    universities, explicitly address the incentive misalignment between academic publication
    requirements and commercial delivery milestones at the project design stage —
    for example through dedicated industry-secondment roles, milestone-linked stipends,
    or dedicated non-publishing technical staff — rather than relying on researchers
    whose career incentives lie elsewhere.
