  project_name: Smart Sodium Storage System (S4) Project
  what_happened: The project team originally planned to demonstrate sodium-ion battery
    technology in operational installations at both the Illawarra Flame House (residential)
    and Sydney Water's Bondi Sewage Pumping Station (distributed infrastructure),
    but production difficulties meant only laboratory-characterised battery packs
    were delivered rather than fully operational field installations.
  lesson_learnt: For pre-commercial battery technology demonstration projects, plan
    demonstrator milestones in stages — first laboratory characterisation, then controlled
    testbed operation, then field installation — rather than committing to field demonstration
    from the outset, so that each stage can be de-risked before proceeding to the
    next.
