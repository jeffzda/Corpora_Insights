  publish_date: 2022-02
  project_name: Smart Sodium Storage System (S4) Project
  what_happened: COVID-19 caused approximately four months of shutdown at both Chinese
    industry partner facilities and introduced ongoing supply chain disruptions, compounded
    by the absence of commercial electrolyte and parts suppliers for sodium-ion batteries
    and the loss of routine air freight between Australia and China.
  lesson_learnt: For projects reliant on novel-technology supply chains — particularly
    those sourcing non-commercial materials across international borders — build in
    explicit contingency for supply disruption; the combination of a non-mature supply
    chain and a border closure event can be catastrophic for schedule, and diversifying
    supply sources or pre-positioning critical materials should be considered during
    project design.
