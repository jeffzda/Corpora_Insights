- record_id: ARENA-DLV-48154
  source_title: Smart Sodium Storage System Final Report
  publish_date: 2022-02
  project_name: Smart Sodium Storage System (S4) Project
  what_happened: The project team underestimated the technical complexity of transitioning
    from lithium-ion to sodium-ion battery production, assuming that LIB manufacturing
    methodologies could be directly adopted, whereas the change to sodium as the central
    element required significant reformulation of all materials — cathode, anode,
    and electrolyte.
  lesson_learnt: Do not assume that replacing a single element in an established battery
    chemistry leaves the rest of the production methodology intact — changing from
    lithium to sodium requires fundamental rework of all materials and processes,
    and project milestones should reflect this complexity rather than assuming direct
    technology transfer from LIB.
