  what_happened: Partner requirements from Sydney Water and Hong Cheng Electric Power
    — who would only participate if the project delivered full energy storage packs
    — locked in the most technically challenging milestones despite ARENA's assessment
    committee flagging that targeting large packs at that technology readiness level
    was overly ambitious.
  lesson_learnt: When end-user industry partners make participation conditional on
    outputs that exceed the project's current technology readiness level, negotiators
    should push back or redesign the milestone structure — accepting over-ambitious
    milestones to retain partners creates delivery risk that may be unresolvable within
    the project budget and timeframe.
