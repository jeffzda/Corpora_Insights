  what_happened: The S4 Project was originally scheduled to finish in March 2020 but
    continued through to December 2021 — a delay of approximately 21 months — due
    to the withdrawal of a key industry partner (McNair) and the COVID-19 pandemic
    causing industrial and supply chain interruptions.
