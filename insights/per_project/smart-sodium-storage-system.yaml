- record_id: ARENA-DLV-48159
  source_title: Smart Sodium Storage System Final Report
  publish_date: 2022-02
  project_name: Smart Sodium Storage System (S4) Project
  what_happened: Scaling up sodium-ion battery material synthesis from lab-scale (milligrams)
    to industrial-scale (kilograms to tonnes) proved far more complex than anticipated
    — it was not feasible to simply multiply raw material quantities, and parameters
    such as solution homogeneity and temperature variation required iterative trial-and-error
    optimisation.
  lesson_learnt: Scale-up of novel battery chemistries from lab to industrial production
    is a distinct engineering challenge that requires dedicated resources and time
    beyond what laboratory optimisation suggests — project plans should treat scale-up
    as a separate, resource-intensive workstream with its own risk allowance rather
    than assuming it follows directly from lab success.
  issue_severity: moderate
  project_type: storage
