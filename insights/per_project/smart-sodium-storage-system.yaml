  source_title: Smart Sodium Storage System Final Report
  publish_date: 2022-02
  project_name: Smart Sodium Storage System (S4) Project
  what_happened: The project team set overly ambitious commercialisation targets at
    inception, partly due to a misreading of rapidly rising lithium prices in 2015–2016
    as a durable signal that sodium-ion batteries would commercialise within five
    years, when in fact the technical and commercial pathway was much longer.
  lesson_learnt: At the project planning stage, conduct careful and sceptical analysis
    of market signals before setting commercialisation timelines — short-term commodity
    price spikes are unreliable proxies for technology readiness, and over-optimistic
    goal-setting creates downstream milestone pressure that is difficult to unwind
    once partners are committed.
