    capabilities including day-ahead capacity forecasting algorithms for portfolio
    bidding and disaggregation of dispatch instructions to NMI level, which represent
    a significant capability uplift even for aggregators with existing platforms.
  lesson_learnt: Prospective aggregators in a DER marketplace should not underestimate
    the capability uplift required — sophisticated portfolio forecasting, bidding,
    and NMI-level dispatch disaggregation functionality is a non-trivial development
    exercise; aggregators with existing platforms should plan for significant additional
    development effort rather than assuming existing systems are sufficient.
