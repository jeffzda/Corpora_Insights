  what_happened: Project EDGE successfully demonstrated, across 333 days of field
    testing, that three active aggregators, AusNet as DNSP, and AEMO could build and
    operate real-time systems for DOE calculation and communication, DER fleet forecasting,
    portfolio coordination, and scalable multi-party data exchange — establishing
    an end-to-end proof of concept for DER integration into the NEM.
