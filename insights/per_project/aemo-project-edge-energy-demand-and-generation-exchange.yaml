  what_happened: Field tests showed that aggregators did not always follow partial
    dispatch instructions (dispatched for 70% of clearing bid), with all three aggregators
    conforming to full dispatch more often than to partial dispatch. One aggregator's
    system was configured around four price-based operational modes and could not
    respond to partial dispatch instructions that fell outside those modes.
  lesson_learnt: Aggregators must design their dispatch systems to handle partial
    dispatch instructions, not only full dispatch — systems built around a small number
    of fixed price-based operational modes will fail to conform to partial dispatch,
    and this limitation should be identified and remediated before seeking scheduled
    resource status.
