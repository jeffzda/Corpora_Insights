  what_happened: Because Project EDGE does not include real settlement processes,
    Mondo had to fund all customer incentives from its own project budget rather than
    from market payments, with incentive amounts needing to compensate customers for
    the right to control their PV and battery systems rather than being linked to
    the value of services delivered.
  lesson_learnt: DER marketplace trials without real settlement mechanisms require
    aggregators to fund customer incentives from project budgets rather than service
    revenues, increasing aggregator costs and creating artificial incentive structures;
    trial designers should build adequate incentive funding into aggregator project
    budgets and consider whether simulated settlement better reflects real-market
    economics.
