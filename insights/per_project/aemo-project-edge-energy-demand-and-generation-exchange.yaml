- record_id: ARENA-DLV-34157
  source_title: Project EDGE Interim Public Project Report
  publish_date: 2022-07
  project_name: Project EDGE
  what_happened: Determining an effective compliance mechanism for DER fleets bidding
    within DOEs into NEM central dispatch proved challenging; real-time validation
    at portfolio level cannot determine whether individual NMI DOE limits were breached,
    while ex-post-only assessment requires a degree of trust in aggregators that may
    not be warranted given commercial incentives to exceed DOEs at high prices.
  lesson_learnt: DER marketplace designs must resolve the compliance mechanism for
    DOE adherence before going live — real-time portfolio-level validation is too
    coarse for DNSPs, while ex-post penalties alone may not prevent aggregators from
    exceeding DOEs during high price events, particularly for nascent markets where
    high penalties could stifle development.
