  source_title: AEMO - Project EDGE - Final Report
  publish_date: 2023-10
  project_name: Project EDGE
  what_happened: Consumer research found that customers' perception of a 'fair' DER
    export policy was strongly influenced by their own DER ownership status — consumers
    with rooftop PV preferred cost socialisation, while those without preferred export
    charges on exporters. However, the policy scenario involving Dynamic Operating
    Envelopes with no network upgrades (Scenario 2) was perceived as equally fair
    by both groups.
  lesson_learnt: Policy makers designing DER export frameworks should prioritise DOE-based
    approaches that avoid costly distribution network upgrades — this configuration
    is perceived as fair by consumers regardless of whether they own rooftop PV, making
    it the most socially licensable export policy option.
