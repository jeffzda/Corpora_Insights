  source_title: AEMO - Project EDGE - Final Report
  publish_date: '2023'
  project_name: Project EDGE
  what_happened: Project EDGE did not implement or test a DOE conformance and compliance
    framework, but field test results identified persistent DOE non-conformance, revealing
    a need for a robust three-role framework separating DOE conformance monitoring,
    conformance assessment, and compliance enforcement — with the AER responsible
    for enforcement of repeated breaches.
  lesson_learnt: A DOE conformance framework must separate monitoring (DNSP accountable,
    optionally outsourced), conformance assessment (DNSP), and compliance enforcement
    (AER for widespread or persistent breaches) — conflating these roles creates conflicts
    of interest; industry should develop this framework before DOE rollout scales
    significantly.
