  what_happened: The Project EDGE Cost Benefit Analysis, conducted by Deloitte Access
    Economics and Energeia across a 20-year horizon, found that coordinated DER integration
    via the Project EDGE arrangement could deliver an incremental benefit of up to
    $5.15 billion (AEMO ISP step change assumptions) or up to $6.04 billion (high
    DER uptake assumptions) for all NEM consumers.
  lesson_learnt: Investment cases for DER integration reform should be grounded in
    comprehensive CBA across a multi-decade horizon — the Project EDGE CBA provides
    a transferable methodology and evidence base showing that even conservative DER
    uptake scenarios yield multi-billion dollar net consumer benefits, supporting
    the case for early regulatory action.
