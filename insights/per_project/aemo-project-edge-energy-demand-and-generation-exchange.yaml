  what_happened: Fragmented market frameworks prevented DER Aggregators from co-optimising
    DER portfolios across wholesale and network support services simultaneously, restricting
    the ability to provide both service types from the same DER portfolio and limiting
    value realisation for DER customers.
  lesson_learnt: DER programme designers and policy makers should establish a Local
    Services Exchange (LSE) with clear roles for DER Aggregators to co-optimise wholesale
    and network support services from the same portfolio — this co-optimisation capability
    is a prerequisite for value-stacking and should be implemented via a data hub
    to reduce integration costs, targeting network-constrained locations first.
