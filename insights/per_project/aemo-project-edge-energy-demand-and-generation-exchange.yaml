  what_happened: LSE field trials found that high-firmness NSS portfolios require
    either multiple customer sites to provide statistical confidence of delivery,
    or a single site with predictable load and appropriately over-sized solar and
    battery capacity — small single-site portfolios with variable load were found
    to be unreliable for high-firmness services.
  lesson_learnt: DNSPs and aggregators designing high-firmness LSE portfolios should
    require minimum portfolio sizes (multiple NMIs) or specify minimum DER sizing
    relative to contractual quantities, to ensure statistically reliable delivery;
    aggregators may need to over-size portfolios relative to contracted quantities
    to absorb site-level variability.
