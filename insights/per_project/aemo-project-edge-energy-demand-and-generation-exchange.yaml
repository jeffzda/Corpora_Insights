  source_title: Project EDGE Interim Public Project Report
  publish_date: 2022-07
  project_name: Project EDGE
  what_happened: The existing SCADA-based data exchange infrastructure used for scheduled
    generation in the NEM costs between $700,000 (basic connection) and $2.5 million
    (advanced connection) per plant connection, making it an unaffordable and prohibitive
    entry barrier for small DER aggregators seeking to provide visibility and participate
    in central dispatch.
  lesson_learnt: Requiring DER aggregators to use SCADA-equivalent data connections
    for market participation would create prohibitive cost barriers; affordable alternatives
    to SCADA (such as public internet-based solutions) need to be tested and validated
    before mandating data sharing obligations on aggregators in a DER marketplace.
