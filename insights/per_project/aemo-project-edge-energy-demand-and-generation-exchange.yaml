- record_id: ARENA-DLV-48506
  source_title: AEMO - Project EDGE - Independent CBA Full Report
  publish_date: 2023-10
  project_name: Project EDGE
  what_happened: Fragmented and non-standardised DER data exchange under point-to-point
    approaches was identified as a barrier that limits DER Aggregators' ability to
    access a full scope of service opportunities and scale VPP operations across multiple
    DNSP service areas, reducing economic value for DER customers.
  lesson_learnt: Standardisation of DER data exchange protocols must be progressed
