- record_id: ARENA-DLV-41066
  source_title: AEMO - Project EDGE - Final customer insights study
  publish_date: '2023'
  project_name: Project EDGE
  what_happened: Most Project EDGE customers preferred automated VPP exports and did
    not want to be involved in day-to-day management; however, this preference created
    a 'black box' effect where customers were often unaware of when or whether active
    management of their DER was occurring.
  lesson_learnt: Automated operation is the right default for VPP customers, but automation
    without passive transparency (e.g., post-event summaries, dashboard visibility)
    creates disengagement and erodes trust — aggregators should design systems that
    inform without requiring active customer involvement.
