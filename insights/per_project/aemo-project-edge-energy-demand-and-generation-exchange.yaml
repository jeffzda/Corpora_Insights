  publish_date: 2022-07
  project_name: Project EDGE
  what_happened: Project EDGE participants perceived their household battery primarily
    as a personal energy asset to support their own consumption, not as a tradeable
    resource. This created strong resistance to the VPP's energy trading function,
    with participants only willing to trade genuine surplus energy after their own
    household needs were fully assured.
  lesson_learnt: VPP operators must explicitly address the 'personal asset' perception
    of household batteries early in the customer journey — clearly define the conditions
    under which trading will and will not occur, and provide assurances that household
    energy needs take priority, to build genuine consent for the trading function.
