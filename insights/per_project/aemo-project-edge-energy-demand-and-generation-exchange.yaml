    focuses on protecting systems from attack but lacks capabilities that 'assume
    compromise' — i.e., monitoring, detection, isolation, defence and recovery — creating
    a systemic gap in the DER ecosystem's resilience.
  lesson_learnt: Aggregators and DER data hub participants should adopt a cyber security
    posture that goes beyond perimeter protection to include 'assume compromise' detection,
    isolation and recovery capabilities; industry-wide cyber security standards (beyond
