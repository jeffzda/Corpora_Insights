  what_happened: The optimal timing for LSE implementation was found to be unclear
    and dependent on localised network conditions — LSE services are only viable where
    DER Aggregators can represent sufficient DER capacity at concentrated locations
    matching network constraint geography. Under AEMO ISP Step Change assumptions
    the LSE delivered only $0.08b incremental benefit; under High DER assumptions
    it delivered $0.51b.
  lesson_learnt: Do not deploy a Local Services Exchange uniformly across all network
    areas — target initial implementation at constrained network locations where DER
    Aggregators can already represent sufficient concentrated DER capacity; premature
    broad deployment risks high costs with negligible benefit.
