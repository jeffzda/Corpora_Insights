  what_happened: Project EDGE found that aggregators need advance transparency about
    which network areas are forecast to have constraints — with 12–18 month horizons
    — to develop targeted customer acquisition strategies for LSE portfolios; the
    current absence of forward-looking, geographically precise network constraint
    information limits aggregators' ability to recruit suitable customers in constrained
    areas.
  lesson_learnt: DNSPs should proactively publish forward-looking network constraint
    information (12–18 month horizon) through mechanisms such as the DAPR process,
    including geospatially accurate constraint locations rather than arbitrary geographic
    boundaries like postcodes — this is a prerequisite for aggregators to build LSE
    portfolios with sufficient customers in the right network locations.
