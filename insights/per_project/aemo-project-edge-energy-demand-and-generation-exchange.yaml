  source_title: AEMO - Project EDGE - Final Report
  publish_date: '2023'
  project_name: Project EDGE
  what_happened: An Aggregator of Last Resort (AoLR) scenario was field-tested in
    Project EDGE, revealing that default DOE values must be captured for each NMI
    on enrolment and made available to AEMO, and that a lag exists between an aggregator
    exiting the market and its devices reverting to passive/default operation.
  lesson_learnt: Default DOE values for each NMI should be recorded at enrolment and
    shared with AEMO so that during an aggregator market exit, AEMO can account for
    the expected operating band of the exiting fleet in dispatch forecasting; an AoLR
    market process analogous to the Retailer of Last Resort process is required to
    manage this transition.
