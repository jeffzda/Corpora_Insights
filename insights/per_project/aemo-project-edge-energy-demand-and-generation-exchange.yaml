  source_title: Project EDGE Lessons Learnt 1
  publish_date: 2021-05
  project_name: Project EDGE
  what_happened: Varying stakeholder priorities and views within the DER Demonstrations
    Insights Forum created difficulty in achieving and maintaining alignment around
    project design, with the extent of divergent views not apparent until the forum
    sessions surfaced them.
  lesson_learnt: Allow stakeholder forums to surface contested concepts openly rather
    than managing for premature consensus — revealing the true extent of divergent
    views early enables a more considered convergence on project direction and prevents
    misalignment from embedding in the design.
