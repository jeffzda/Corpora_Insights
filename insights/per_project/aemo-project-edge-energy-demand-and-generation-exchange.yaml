  what_happened: Both AusNet (DERMS) and AEMO (EDGE marketplace platform) found that
    existing technical standards could not be fully adopted without adaptation for
    the Australian context, requiring a trade-off assessment between strict standards
    compliance and the cost and practicality of implementation.
  lesson_learnt: When deploying DER platforms in the Australian NEM context, assess
    technical standards compliance as a cost/learning trade-off rather than a binary
    requirement — existing international standards may not adequately cover operating-envelope-centric
    communication or NEM-specific data exchange, and the project can generate value
    by identifying where standards are inadequate and informing their development.
