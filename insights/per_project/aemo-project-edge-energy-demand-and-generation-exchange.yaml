  project_name: Project EDGE
  what_happened: LSE field tests found that hybrid inverters — where solar and battery
    share a single inverter — could not be controlled independently, causing sites
    with hybrid inverters to miss expected dispatch set points by approximately 100–300W
    compared with non-hybrid inverter sites.
  lesson_learnt: Aggregators building LSE portfolios should factor in hybrid inverter
    shortfalls when setting dispatch targets — always aim higher to compensate — and
    consider excluding or qualifying hybrid inverter sites, as independent control
    of solar and battery components is not possible with current hybrid configurations.
