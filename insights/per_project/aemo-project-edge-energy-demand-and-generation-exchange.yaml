- record_id: ARENA-DLV-72509
  source_title: AEMO - Project EDGE - Final Report
  publish_date: '2023'
  project_name: Project EDGE
  what_happened: Real-time bid validation (approach 2) tested in Project EDGE — where
    AEMO checked that aggregator maximum bid quantities did not exceed the sum of
    NMI-level DOEs — had to be turned off during Flex bidding because Net NMI DOEs
    include uncontrolled load, which unnecessarily constrained Flex bids and reduced
    dispatch quantities.
  lesson_learnt: Real-time bid validation against aggregated DOEs is not compatible
    with Flex bidding under Net NMI DOEs — the DOE definition must match the bidding
    approach (Flex DOEs for Flex bidding) before this validation can be applied; mismatched
    DOE and bidding definitions will constrain dispatch unnecessarily and reduce market
    efficiency.
