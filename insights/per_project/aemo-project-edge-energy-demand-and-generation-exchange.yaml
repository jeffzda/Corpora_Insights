- record_id: ARENA-DLV-48530
  source_title: AEMO - Project EDGE - Independent CBA Full Report
  publish_date: 2023-10
  project_name: Project EDGE
  what_happened: 'The CBA found that validating Energeia''s techno-economic model
    DOE impacts against Project EDGE field trial data revealed a forecasting error:
    on a given feeder, 200 kW of network capacity was predicted by the DOE for the
    day ahead but 220 kW was actually available, indicating that DOE models applied
    an implicit conservatism buffer that leads to under-utilisation of real network
    capacity.'
  lesson_learnt: DOE calculation models should be calibrated against real field trial
    data to quantify and reduce implicit conservatism buffers — models that consistently
    underestimate available network capacity will systematically over-curtail DER
    exports, reducing consumer value even when DOEs are deployed.
