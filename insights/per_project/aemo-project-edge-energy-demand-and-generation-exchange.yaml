- record_id: ARENA-DLV-52466
  source_title: Project EDGE Lessons Learnt 2
  publish_date: 2022-11
  project_name: Project EDGE
  what_happened: A cyber security threat assessment identified that the most material
    risks in a DER marketplace ecosystem include vulnerabilities across multiple layers
    of software in the DER supply chain, inadequate supply chain risk management,
    and insufficient security controls for critical assets — all of which could be
    exploited at scale with potential system security consequences.
  lesson_learnt: DER marketplace participants should implement secure application
    development processes across the entire DER ecosystem (from devices to aggregator
    platforms to data exchange infrastructure), establish third-party risk management
    frameworks for key suppliers, and conduct Business Impact Analyses to protect
    critical assets — waiting until the ecosystem scales before addressing these risks
