- record_id: ARENA-DLV-48511
  source_title: AEMO - Project EDGE - Independent CBA Full Report
  publish_date: 2023-10
  project_name: Project EDGE
  what_happened: The Local Services Exchange (LSE) was demonstrated technically in
    the Project EDGE field trial for demand management and voltage management services,
    but the economic value assessment was conservative because insufficient data was
    available to quantify benefits beyond DER export curtailment reduction — localised
    factors (network configuration, constraint location, customer density) were not
    modelled.
  lesson_learnt: When evaluating LSE or similar market mechanism trials, ensure the
    CBA methodology captures localised network factors (constraint location, feeder
    configuration, DER concentration) from the outset — the conservative approach
    used in Project EDGE likely understates LSE value significantly, which could lead
    to under-prioritisation in regulatory submissions.
