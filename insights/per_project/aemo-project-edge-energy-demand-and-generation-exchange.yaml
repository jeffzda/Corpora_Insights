  what_happened: Field tests found approximately 14% non-conformance with Dynamic
    Operating Envelopes (DOEs) during constrained network periods, meaning aggregator
    DER portfolios exceeded DNSP-set export/import limits during times of actual network
    constraint.
  lesson_learnt: DOE conformance monitoring requires smart meter data access — which
    is currently only readily available to DNSPs in Victoria — and aggregators must
    build control systems capable of reliably respecting DOE limits during constrained
    periods, as non-conformance during peak constraint events poses the greatest system
    security risk.
