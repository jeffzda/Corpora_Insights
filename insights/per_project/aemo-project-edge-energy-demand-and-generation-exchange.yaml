  project_name: Project EDGE
  what_happened: Due to lead-time required in the Request-for-Tender process, AusNet
    only appointed the DERMS vendor after significant DOE algorithmic development
    work had already been undertaken by the University of Melbourne, creating a steep
    learning curve for the DERMS vendor to incorporate the algorithm into its product.
  lesson_learnt: Procure the DERMS vendor in parallel with algorithm development from
    the outset — appointing the vendor after significant algorithmic work is complete
    forces the vendor into a steep learning curve and makes integration more difficult;
    parallel development with strong coordination produces a smoother and more efficient
    implementation.
