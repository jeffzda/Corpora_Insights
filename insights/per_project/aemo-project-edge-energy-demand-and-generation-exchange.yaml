  what_happened: UoM modelling found that at low DER penetration levels both the LV
    network model and approximation algorithm DOE approaches perform similarly, but
    as DER penetration increases the LV network model allocates materially more spare
    hosting capacity — and once the approximation algorithm becomes constrained, lost
    DER capacity increases rapidly.
  lesson_learnt: DNSPs should monitor when their approximation-based DOE calculation
    becomes frequently constrained as a signal to transition to the LV network model
    — waiting until constant constraint events occur before transitioning will result
    in progressively larger losses in DER capacity allocation that compound quickly.
