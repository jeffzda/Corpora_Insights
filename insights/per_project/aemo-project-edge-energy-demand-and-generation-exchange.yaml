- record_id: ARENA-DLV-41060
  source_title: AEMO - Project EDGE - Final customer insights study
  publish_date: '2023'
  project_name: Project EDGE
  what_happened: Potential customers assessed the fairness of DER export policies
    primarily through the lens of personal household costs and benefits. Consumers
    with solar PV rated Scenario 3 (socialised distribution upgrade costs) as fairest;
    those without solar PV rated Scenario 4 (exporter-pays charges) as fairest.
  lesson_learnt: DER export policy design will face predictable opposition from the
    households disadvantaged by any given cost-sharing model — policymakers should
    anticipate that solar PV owners and non-owners will systematically disagree on
    fairness, and should communicate policy rationale in terms of household-level
    cost impacts.
