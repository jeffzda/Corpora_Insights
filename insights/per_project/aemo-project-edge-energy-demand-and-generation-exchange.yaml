  source_title: AEMO - Project EDGE - Independent CBA Executive Summary
  publish_date: 2023-10
  project_name: Project EDGE
  what_happened: The CBA did not quantitatively assess Vehicle-to-Grid (V2G) coordination
    because its nascency at the time of project design meant insufficient data was
    available, leaving a known source of additional DER value unquantified in the
    economic case.
  lesson_learnt: CBA and investment case modelling for DER integration programmes
    should explicitly flag V2G as an unquantified upside and plan for a model update
    cycle as V2G adoption data becomes available — the absence of V2G from the base
    case means the $6.04b headline benefit figure is conservative and stakeholders
    should not treat it as a ceiling.
  issue_severity: minor
