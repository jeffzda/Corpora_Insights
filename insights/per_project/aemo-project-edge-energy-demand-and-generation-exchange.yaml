  project_name: Project EDGE
  what_happened: Voltage management service field tests found that verification of
    performance using smart meter PQ data at the site — rather than at the inverter
    terminals — was problematic because uncontrolled appliances downstream of the
    connection point (particularly reactive loads at C&I sites) distorted the observed
    Volt-VAr response, making it impossible to confirm whether the inverter had correctly
    followed the prescribed curve.
  lesson_learnt: DNSPs procuring voltage management NSS should require aggregators
    to provide inverter-level telemetry for performance verification, as smart meter
    data at the NMI cannot reliably distinguish inverter response from downstream
    appliance reactive loads; a DER data hub could efficiently facilitate this data
    exchange.
