    and VPP participation — ranging from those who did not want to engage with any
    technical detail, to those with high energy literacy who wanted granular control
    and transparency.
  lesson_learnt: VPP customer interfaces should be designed with tiered engagement
    levels — simple 'set and forget' defaults for low-engagement customers alongside
    deep customisation options for energy-literate users — to avoid designing a single
    experience that fails both segments simultaneously.
