  source_title: AEMO - Project EDGE - Final customer insights study
  publish_date: '2023'
  project_name: Project EDGE
  what_happened: Some Project EDGE customers held unrealistic expectations about what
    their DER could achieve or how it would interact with the VPP, and others expected
    greater direct community benefits than were delivered — leading to dissatisfaction
    that could have been avoided with better pre-enrolment expectation management.
  lesson_learnt: Aggregators should implement structured expectation-setting at onboarding
    — covering realistic financial returns, the scope of community benefit, and how
    DER-VPP interaction actually works — to prevent the gap between expectation and
    experience from eroding long-term customer satisfaction.
