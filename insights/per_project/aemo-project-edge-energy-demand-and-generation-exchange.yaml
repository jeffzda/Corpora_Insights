  project_name: Project EDGE
  what_happened: Project EDGE identified that smart meters, if configured with decentralised
    monitoring capabilities, could provide an autonomous on-site safeguard for DOE
    conformance — operating in 'permissive' mode to alert on non-compliance and 'enforcing'
    mode to disconnect non-compliant DER — but this approach was not field-tested
    in the trial.
  lesson_learnt: Decentralised, smart-meter-based DOE conformance enforcement should
    be explored as a complementary safeguard to centralised monitoring — implementing
    enforcement logic within on-site metering equipment mitigates risks associated
    with communications loss between aggregators and their devices, a failure mode
    observed in the Project EDGE field trial.
