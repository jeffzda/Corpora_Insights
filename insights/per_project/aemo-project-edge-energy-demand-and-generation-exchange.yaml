  source_title: AEMO - Project EDGE - Independent CBA Full Report
  publish_date: 2023-10
  project_name: Project EDGE
  what_happened: The CBA found that the Net NMI bidding mode incurred approximately
    $5.34m more in Net Present Value costs over the 20-year horizon for the Market
    Operator compared to Flex bidding, and required additional system complexity including
    model retraining and shadow forecasting, while also leaving residual risk from
    lower forecasting certainty that would require greater operating reserves.
  lesson_learnt: When designing DER bidding frameworks, prefer Flex bidding over Net
    NMI bidding where possible — Flex provides cleaner separation of controlled and
    uncontrolled DER activity, enabling more accurate Market Operator demand forecasts
    at lower system cost and residual risk.
