  what_happened: During field tests, aggregators experienced communications outages
    to DER fleets operating on public internet; most DER fleets lacked communications
    redundancy, and aggregators acknowledged they would need to significantly improve
    cyber security capabilities — including 'assume compromise' approaches — to meet
    recognised industry best practice frameworks.
  lesson_learnt: VPP aggregators must implement cyber security capabilities that assume
    system compromise, including detection, isolation, defence and recovery controls,
    and must implement reliable fail-safes and fallback default operations with alternative
    fleet monitoring mechanisms that do not share a common mode of failure with the
    primary system.
