  project_name: Project EDGE
  what_happened: Project EDGE identified that if DNSPs publish DOEs via an industry
    data hub rather than their own systems, they may face accountability for supply
    quality issues caused by failures in third-party infrastructure outside their
    control, creating a governance and liability gap that must be addressed in any
    DER data hub design.
  lesson_learnt: DER data hub design must include service level agreements with DNSPs
    and defined compensatory controls (e.g. 48-hour rolling DOE windows, default DOEs)
    to manage the risk of hub failures causing customer supply issues — the same risk
    management obligation applies if a DNSP engages any third-party technology provider
    for DOE communications.
