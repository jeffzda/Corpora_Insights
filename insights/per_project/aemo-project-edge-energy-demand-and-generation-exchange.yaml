  what_happened: Field test data showed that during Project EDGE, dispatch data took
    up to 10 seconds for an aggregator to send to their fleet, exceeding the 6-second
    maximum under the current Power System Data Communications Standard for dispatch
    data, meaning VPP aggregators could not meet the same SCADA-based standards required
    of large-scale resources.
  lesson_learnt: Current SCADA-based data communications standards are not fit-for-purpose
    for VPP aggregators — applying them would create prohibitive entry barriers and
    exclude rural customers; fit-for-purpose DER data communications standards should
    be developed that are proportionate to system risk while remaining commercially
    feasible for nascent aggregators.
