  what_happened: Limited visibility of active DER for the Market Operator and DNSPs
    minimised situational awareness and constrained forward-looking operational and
    network planning, identified as one of the key barriers preventing DER value from
    being maximised across the NEM.
  lesson_learnt: Market operators and DNSPs must invest in monitoring systems and
    digital platforms to increase DER visibility and control before DER penetration
    becomes operationally unmanageable — the CBA found that enhanced DER visibility
    contributes up to $0.20b in incremental benefit under AEMO ISP Step Change assumptions
    and should be treated as a foundational capability requiring 1–5 year investment.
