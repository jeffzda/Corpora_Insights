- record_id: ARENA-DLV-48504
  source_title: AEMO - Project EDGE - Independent CBA Full Report
  publish_date: 2023-10
  project_name: Project EDGE
  what_happened: Lack of standardisation in DER data exchange under the existing point-to-point
    approach requires each market participant (DNSP, DER Aggregator, Market Operator)
    to establish bespoke bilateral integrations, creating high costs and a barrier
    to entry that limits scalability of DER services. The CBA quantified this as up
    to $0.45b in avoidable costs over 20 years compared to a data hub approach.
  lesson_learnt: Implement a standardised, centralised or decentralised data hub for
    DER data exchange as an early foundational investment — the cost saving versus
    point-to-point integration is substantial ($0.44–0.45b over 20 years NEM-wide)
    and the hub also enables new DER service innovations that point-to-point cannot.
