  project_name: Project EDGE (Energy Demand and Generation Exchange)
  what_happened: The current method of procuring local network support services (NSS)
    from DER aggregators is based on bespoke bilateral negotiations, which Project
    EDGE found to be costly and not scalable across multiple DNSPs; NSS were successfully
    exchanged in the field trial using a Local Services Exchange connected to a data
    hub, but no financial settlement was tested.
  lesson_learnt: Standardisation of network support service definitions, transaction
    terms, data exchange protocols, and user experience across DNSPs is a prerequisite
    for scalable DER-based NSS markets; DNSPs should collaborate on an industry guideline
    for standardised NSS characteristics before developing separate digital platforms,
    to avoid costly fragmentation.
