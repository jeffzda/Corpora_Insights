- record_id: ARENA-DLV-63153
  source_title: AEMO - Project EDGE - Independent CBA Executive Summary
  publish_date: 2023-10
  project_name: Project EDGE
  what_happened: Lack of standardisation in DER data exchange limited scalability
    of DER integration. Point-to-point data exchange between multiple DNSPs and DER
    Aggregators created high integration costs, with the CBA modelling 13 DNSPs each
    integrating with an average of 27 DER Aggregators/Retailers/OEMs under a point-to-point
    approach.
  lesson_learnt: Prioritise implementation of a centralised data hub for DER data
    exchange over point-to-point approaches — a data hub reduces costs by up to $0.45b
    over 20 years by requiring each participant to integrate only once, and also enables
    new DER service innovations and B2B services that are impractical under point-to-point
    architectures.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: operations
  proponent_type: government/public-sector body
  delay_category: null
  failure_mode: unvalidated integration
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: The CBA recommended a scalable data hub providing standardised
    services including DER registration, identity verification and reporting, to be
    implemented within a 1–2 year timeframe as a foundational priority.
  transferability: broad
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id271
  - 16
  - 23
  evidence_excerpt: A data hub model would provide a lower cost approach for scalable
    DER data exchange between participants, compared with an approach with many point-to-point
    interactions, by reducing the number of integrations, as each participant only
    needs to integrate with one industry data hub. The CBA found that across the 20-year
    time horizon, a centralised data hub would reduce costs by up to $0.44b and a
    decentralised data hub would reduce costs by up to $0.45b compared to a point-to
    point approach.
