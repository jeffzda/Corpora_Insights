  what_happened: DNSPs will need to develop new capabilities for determining the value
    of local services and measuring and verifying performance of delivery of services
    from DER, but the appropriate measurement methodology remains unresolved — in
    particular, baselining techniques may not suit an active market environment and
    international jurisdictions are moving toward direct measurement of controlled
    assets.
  lesson_learnt: DNSPs planning to procure DER-based local network services must resolve
    measurement and verification methodology before operationalising a local services
    exchange; baselining techniques may not be suitable in active DER market environments
    and direct measurement of controlled assets is likely to be the more reliable
    approach.
