  what_happened: The CBA found that upgrading from an approximation DOE optimisation
    methodology to an LV impedance model methodology, combined with increasing DOE
    customer coverage to 100%, delivered the largest single incremental benefit of
    any DOE enhancement — up to $4.12b (AEMO ISP Step Change) and $4.60b (High DER)
    over 20 years — but requires more sophisticated DNSP DERMS platforms with significantly
    higher capex (fixed $4.50m vs $1.50m per DNSP) and opex (fixed $0.45m vs $0.14m
    per DNSP per annum).
  lesson_learnt: DNSP regulatory submissions for the period FY26–FY32 should include
    investment in LV impedance model DERMS capabilities at constrained network locations
    — the consumer benefit from this investment ($4–4.6b system-wide) dwarfs the incremental
    platform cost, but the investment lead times (platform development plus regulatory
    approval) require action in the near term.
