- record_id: ARENA-DLV-14612
  source_title: Project EDGE Lessons Learnt 1
  publish_date: 2021-05
  project_name: Project EDGE
  what_happened: AusNet's procurement of a DER management system (DERMS) found that
    all international network-related DERMS products were designed for vertically
    integrated utilities with command-and-control functionality, and none could be
    directly applied to Australia's disaggregated, contestable market context without
    adaptation.
  lesson_learnt: Do not assume international DERMS products will be fit-for-purpose
    in the Australian regulatory context — the disaggregated, contestable market structure
    requires an 'operating envelope' publish-subscribe model that differs fundamentally
    from command-and-control products designed for vertically integrated overseas
    utilities; plan for adaptation effort and assess smaller niche vendors alongside
    large enterprise players.
  issue_severity: moderate
