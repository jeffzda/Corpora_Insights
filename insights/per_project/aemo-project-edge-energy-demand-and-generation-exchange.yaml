    community engagement and trust-building because customers' understanding of electricity
    market mechanisms and the financial value of DER participation was limited, and
    customers prioritised self-consumption and resilience over market participation.
  lesson_learnt: DER aggregator customer acquisition in a marketplace context requires
    investment in community-level trust-building, simplified messaging, ongoing education,
    and engagement with non-financial motivators (sustainability, resilience, community);
    a purely financial value proposition is insufficient, and engaging through local
    installers and community groups is highly effective.
