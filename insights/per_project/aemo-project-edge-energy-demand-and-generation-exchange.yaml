  source_title: AEMO - Project EDGE - Independent CBA Full Report
  publish_date: 2023-10
  project_name: Project EDGE
  what_happened: The CBA found that, while starting with simpler DOE configurations
    may be operationally prudent, the cumulative incremental benefit is greatest from
    the first year under the Advanced DOE, High Coverage with Data Hub scenarios —
    meaning deferral of more advanced configurations has an immediate and growing
    opportunity cost rather than a one-off delay.
  lesson_learnt: Do not assume that a simple-first, evolve-later approach to DOE deployment
    is economically neutral — the opportunity cost of simpler configurations accrues
    from Year 1 and compounds over time; the decision to defer advanced DOEs should
    be explicitly costed and justified by implementation constraints rather than assumed
    to be cost-free.
