  what_happened: The distribution network industry raised concerns during design about
    potential risks of passing network operational responsibilities to aggregators,
    who are expected to favour market outcomes over network integrity, creating a
    design conflict requiring a fail-safe mechanism.
  lesson_learnt: DER marketplace designs that delegate network-adjacent responsibilities
    to aggregators must include an explicit fail-safe mechanism and performance compliance
    framework to satisfy DNSPs that network integrity and stability will not be compromised
    by aggregators prioritising market outcomes.
