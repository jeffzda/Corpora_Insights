- record_id: ARENA-DLV-52474
  source_title: Project EDGE Lessons Learnt 2
  publish_date: 2022-11
  project_name: Project EDGE
  what_happened: The NEM market suspension in June 2022 created an unplanned but valuable
    test opportunity. Project EDGE rapidly formulated and executed four structured
    tests within the suspension period to generate evidence on VPP direction mechanisms
    in a high-DER future — a scenario that could not have been replicated in normal
    planned trials.
  lesson_learnt: Demonstration projects operating in live markets should maintain
    standing protocols for rapid response to rare market events — the June 2022 NEM
    suspension was a one-in-many-years event that generated critical evidence on aggregator
    controllability and DOE/dispatch conflicts that planned trials could not replicate;
    having a rapid test-design capability enabled the project to capture irreplaceable
    real-world data.
