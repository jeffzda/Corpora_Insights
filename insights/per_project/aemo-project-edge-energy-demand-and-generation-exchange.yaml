- record_id: ARENA-DLV-72436
  source_title: AEMO - Project EDGE - Final Report
  publish_date: null
  project_name: Project EDGE
  what_happened: Desktop analysis of field trial data found that LV network model-only
    DOEs were consistently below perfect hindsight DOEs due to imperfect day-ahead
    forecasts and a buffer applied for forecast error — while this meant less capacity
    was allocated, these DOEs were more technically efficient in not over-allocating
    capacity that could cause network breaches.
  lesson_farnt: When designing DOE systems, teams should recognise that conservative
    day-ahead forecast buffers in LV network model DOEs may under-allocate capacity
    but protect against over-allocation breaches — improving head of feeder voltage
    forecast accuracy is the priority mechanism for closing this gap rather than simply
    increasing allocated limits.
  lesson_learnt: When designing DOE systems, a conservative forecast buffer in LV
    network model DOEs may under-allocate capacity but protects against breach-causing
    over-allocation — improving head of feeder voltage forecast accuracy is the priority
    action for closing the gap between field DOEs and true network limits.
  issue_severity: minor
