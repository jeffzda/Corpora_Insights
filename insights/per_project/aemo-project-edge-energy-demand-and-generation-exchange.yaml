  source_title: AEMO - Project EDGE - Final Report
  publish_date: 2023-12
  project_name: Project EDGE
  what_happened: LSE field trials found that communications outages during an activated
    high-firmness NSS could cause under-delivery against the contracted target, particularly
    where the aggregator's portfolio was committed close to its maximum deliverable
    capacity with insufficient headroom to compensate for devices going offline.
  lesson_learnt: Aggregators should not commit LSE portfolios to quantities close
    to maximum deliverable capacity — sufficient headroom must be maintained to absorb
    communications outages and device failures during activated services; for regional
    portfolios with lower communications reliability, this headroom buffer should
    be larger, or communications redundancy built in.
