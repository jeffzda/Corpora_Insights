  what_happened: UoM techno-economic modelling found that the design and calculation
    approach for Dynamic Operating Envelopes has a material impact on network operation
    and efficient delivery of DER services — more sophisticated DOEs are more efficient
    but more complex and costly to implement, creating a simplicity-efficiency trade-off
    spectrum.
  lesson_learnt: DNSPs should start with simpler approximation-based DOE calculation
    approaches to realise value quickly and invest incrementally in more sophisticated
    model-based DOEs over time, guided by local DER penetration levels — a step-change
