  source_title: AEMO - Project EDGE - Final Report
  publish_date: 2023-10
  project_name: Project EDGE (Energy Demand and Generation Exchange)
  what_happened: Project EDGE found that the absence of consistent compensatory controls
    — defining DER behaviour during communications failures — across DNSPs and AEMO
    creates a risk that DER cannot be managed during emergencies as penetration grows,
    with potential for duplicate or contradictory controls being applied simultaneously.
  lesson_learnt: Before large-scale DER coordination is deployed, AEMO and all DNSPs
    must collaboratively design and agree consistent compensatory control frameworks
    — including default DER behaviours on communications loss, hierarchy of interventions,
    and operational procedures between control rooms — to prevent contradictory controls
    during system emergencies.
