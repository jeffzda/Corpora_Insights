- record_id: ARENA-DLV-63151
  source_title: AEMO - Project EDGE - Independent CBA Executive Summary
  publish_date: 2023-10
  project_name: Project EDGE
  what_happened: The Project EDGE field trial and CBA found that static, overly conservative
    export limits resulted in significant curtailment of DER exports, with the Project
    EDGE arrangement projected to avoid 15.1TWh of customer rooftop solar curtailment
    to 2030 and up to 90.6TWh across a 20-year horizon under AEMO ISP Step Change
    assumptions.
  lesson_learnt: Static and overly conservative export limits are a primary barrier
    to DER value realisation at scale — increasing Dynamic Operating Envelope (DOE)
    customer coverage to unlock network capacity for DER coordination should be the
    first implementation priority, as it is the single greatest driver of consumer
    benefit in a coordinated DER market.
