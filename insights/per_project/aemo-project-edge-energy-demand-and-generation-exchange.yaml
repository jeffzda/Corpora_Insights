  what_happened: Project EDGE field trial results showed that VPP fleet size needs
    to reach materiality thresholds before normalised forecasting error reduces to
    acceptable levels — small fleets produce disproportionately high forecast errors,
    which constrains their ability to participate as scheduled resources in the wholesale
    market.
  lesson_learnt: Market entry thresholds for VPP scheduled participation should account
    for minimum fleet size requirements to achieve acceptable forecast accuracy —
    regulators and aggregators should plan for a stepping-stone pathway where smaller
    fleets access off-market and passive participation first, graduating to scheduled
    status only when fleet size is sufficient to reduce normalised forecasting error.
