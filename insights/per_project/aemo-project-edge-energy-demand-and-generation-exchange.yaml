  what_happened: A stronger link between customer acquisition geography and network-constrained
    areas was identified as preferable to improve network modelling efficiency and
    maximise the ability to test research hypotheses, given the extensive effort required
    to set up accurate network models for specific network areas.
  lesson_learnt: In DER marketplace trials using network model-based DOE algorithms,
    align customer acquisition targeting closely with the specific network areas for
    which accurate models have been built — misalignment wastes modelling effort and
    reduces the ability to authentically test hypotheses about DOE and local service
    interactions.
