  source_title: AEMO - Project EDGE - Final customer insights study
  publish_date: '2023'
  project_name: Project EDGE
  what_happened: A survey of 893 potential customers across NEM jurisdictions found
    that 92% were either unaware of VPPs or knew nothing about them. While 62% held
    a positive opinion after reading a summary, only 24% expressed very or extreme
    interest in joining a VPP.
  lesson_learnt: Low VPP awareness means that positive attitude toward the concept
    does not translate into adoption intent — aggregators and policymakers must invest
    in targeted awareness campaigns before expecting significant VPP uptake from the
    broader population.
