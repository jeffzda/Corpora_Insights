  what_happened: Feedback from the DIF on VPP dispatch participation design identified
    the need for an additional 'first step' test model — one in which VPPs only provide
    visibility through forecasts and/or near real-time telemetry without submitting
    bids/offers — which had not been included in the original design.
  lesson_learnt: Build iterative design review loops with expert stakeholders before
    finalising trial operating models — feedback from informed external parties can
    identify missing foundational test cases that, if absent, would leave gaps in
    the evidence base for future market design.
