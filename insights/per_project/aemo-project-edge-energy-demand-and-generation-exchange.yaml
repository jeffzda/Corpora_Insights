- record_id: ARENA-DLV-72401
  source_title: AEMO - Project EDGE - Final Report
  publish_date: 2023-10
  project_name: Project EDGE (Energy Demand and Generation Exchange)
  what_happened: Three active aggregators participated in wholesale market field tests
    over 333 days and demonstrated capability to deliver wholesale and local network
    services, but performance was inconsistent — aggregators did not consistently
    meet scheduled-resource standards for dispatch conformance including linear ramping,
    and a 'set and forget' bidding strategy was observed rather than active price-responsive
    bidding.
  lesson_learnt: VPP aggregators require significant capability development before
    meeting scheduled-resource obligations; a stepping-stone approach to wholesale
    market participation — progressing from visibility through self-dispatch to full
    scheduling — allows aggregators to build capability incrementally and absorb compliance
    costs as their portfolios scale, rather than imposing full obligations prematurely.
  issue_severity: moderate
  project_type: DER/customer-side
