  what_happened: AEMO identified that approximately 65% of new DER installations in
    Q1 2022 across the NEM were non-compliant with AS 4777.2:2020 (the inverter standard
    governing grid connection and disconnection behaviour during system disturbances),
    posing a systemic power system security risk as DER penetration scales.
  lesson_learnt: DER technical standards compliance cannot be assumed at scale; projects
    integrating DER into grid services must account for widespread inverter non-compliance
    as a design risk, and policy makers should accelerate smart meter deployment and
    monitoring tools to detect and remediate non-compliance before it becomes a system
    security threat at 100GW DER penetration.
