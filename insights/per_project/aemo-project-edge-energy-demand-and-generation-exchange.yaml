  what_happened: The primary driver motivating consumers to join VPP programs and
    participate in Project EDGE was reduction in electricity bills, with trust in
    the service provider and device availability as secondary factors. Business models
    focused on community benefit or emissions reduction were less effective, particularly
    for later adopter consumer categories.
  lesson_learnt: VPP and DER marketplace business models should lead with a clear,
    quantified bill-reduction value proposition and reassurance of device availability
    — community and environmental framing alone is insufficient to drive broad consumer
    participation, especially among late majority and laggard segments.
