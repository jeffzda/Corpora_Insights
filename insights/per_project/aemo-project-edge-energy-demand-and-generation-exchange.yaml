  project_name: Project EDGE
  what_happened: During Project EDGE field trials, point-to-point DER data exchange
    was assessed against a data hub approach; EY's independent technical assessment
    scored point-to-point lowest across all four criteria (scalability, interoperability,
    security, standardisation), and stakeholder engagement and the Deloitte CBA both
    confirmed that scaling point-to-point approaches would lead to exponentially complex
    and inefficient outcomes as DER numbers grow toward 100GW.
  lesson_learnt: Plan for a centralised or decentralised DER data hub from the outset
    rather than scaling point-to-point integrations — point-to-point approaches become
    unmanageable as the number of aggregators and DNSPs grows, and the CBA identified
    up to $6.04b in incremental consumer benefit from a coordinated data hub approach
    under high-DER scenarios.
