  what_happened: Establishing accurate LV network electrical models required for DOE
    calculation proved highly resource and time-consuming due to historically incomplete
    and outdated network topology and impedance data held in utility systems, requiring
    iterative desktop assessment and in some cases field inspection.
  lesson_learnt: DNSPs should expect significant effort in data validation and field
    inspection to establish accurate LV network models for DOE calculation — historical
    utility systems are typically incomplete for precise customer connection point
    data and investment in data collection and validation capability is a prerequisite
    for implementing DOEs at scale.
