  source_title: AEMO - Project EDGE - Final customer insights study
  publish_date: '2023'
  project_name: Project EDGE
  what_happened: While 86% of surveyed Project EDGE customers agreed their aggregator
    was reliable and trustworthy, only 57% agreed the aggregator was looking after
    their long-term needs, and only 51% of those who recalled receiving VPP communications
    were satisfied with those communications.
  lesson_learnt: High baseline trust in aggregator reliability does not automatically
    translate into confidence in long-term customer care — aggregators must proactively
    demonstrate that their ongoing communications and decisions serve the customer's
    long-term interests, not just operational reliability.
