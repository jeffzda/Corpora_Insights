  what_happened: UoM research found that using a 'maximise aggregate export' DOE objective
    function produces the highest net economic benefit for all consumers, whereas
    'equal individual allocation' objective functions constrain total aggregate export
    and reduce benefits to non-DER consumers — the impact worsening at higher DER
    penetration levels.
  lesson_learnt: DNSPs and policy makers should adopt a 'maximise aggregate export'
    DOE objective function as the default, as it aligns with the National Electricity
    Objective and delivers greater whole-of-system efficiency and consumer benefit
    compared to allocation approaches based purely on per-customer fairness.
