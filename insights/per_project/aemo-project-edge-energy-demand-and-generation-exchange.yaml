  what_happened: Field test data analysis showed dispatch conformance errors were
    higher under Net NMI bidding compared with Flex bidding by a factor of 10, with
    normalised absolute error under Net NMI ranging from 0 to 6 versus 0 to 0.6 under
    Flex bidding, primarily driven by uncontrolled load variability in Net NMI.
  lesson_learnt: Flex bidding should be preferred over Net NMI bidding for VPP wholesale
    market participation — the 10-fold reduction in dispatch conformance error under
    Flex bidding substantially reduces non-conformance risk and causer-pays FCAS costs,
    and this advantage will grow as VPP fleet sizes scale.
