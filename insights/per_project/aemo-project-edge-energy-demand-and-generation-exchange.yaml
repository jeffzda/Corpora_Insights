  what_happened: The CBA found that under the point-to-point approach, DNSPs face
    $90.4m in project management (FTE) costs over 20 years for data exchange, compared
    to $13.2m under either hub model — a 85% reduction — because each of the assumed
    13 DNSPs must maintain bilateral integrations with an average of 27 DER Aggregators/Retailers/OEMs
    under point-to-point.
  lesson_learnt: Project management and coordination costs for bilateral DER data
    exchange integrations should be explicitly costed in regulatory proposals — these
    FTE costs are often overlooked but represent the largest single cost category
    for DNSPs under point-to-point, and make the business case for a shared data hub
    compelling on project management savings alone.
