  project_name: Project EDGE
  what_happened: UK experience reviewed during Project EDGE showed that point-to-point
    NSS procurement — where each DNSP develops its own separate flexibility market
    — creates significant market failures including information asymmetry, high transactional
    burden for sellers, barriers to entry from non-standardised requirements, and
    structural trust deficits, despite UK DNOs tendering for almost 4GW of distribution
    flexibility since 2018.
  lesson_learnt: Australia should establish standardised NSS frameworks and common
    digital infrastructure before NSS trade scales up — the UK's point-to-point experience
    demonstrates that market failures from non-standardisation become entrenched and
    expensive to unwind once volume builds.
