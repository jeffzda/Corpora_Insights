  project_name: Project EDGE
  what_happened: Several Project EDGE participants (5 of 16 interviews) discovered
    post-installation that their battery capacity was insufficient to cover day-to-day
    household consumption needs, and 6 of 16 felt they had no spare battery power
    available for trading. Participants had not adequately anticipated their actual
    consumption needs when selecting battery size.
