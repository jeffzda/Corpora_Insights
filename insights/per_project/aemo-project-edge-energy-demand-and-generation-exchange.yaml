- record_id: ARENA-DLV-52462
  source_title: Project EDGE Lessons Learnt 2
  publish_date: 2022-11
  project_name: Project EDGE
  what_happened: Test 3 during the NEM market suspension event demonstrated that Dynamic
    Operating Envelopes (DOEs) alone cannot reliably achieve a portfolio-level set
    point because they provide permissible limits rather than specific targets; under
    the test, some sites were not utilising their full export capacity, meaning the
    portfolio target could not be met through DOEs alone.
  lesson_learnt: DOEs should not be relied upon as the sole dispatch mechanism for
    VPPs in emergency or market suspension scenarios — they set permissible limits
    rather than specific targets and are less accurate than explicit AEMO dispatch
    instructions; coordination between AEMO and DNSPs is required to ensure DOE limits
    do not inadvertently prevent dispatch targets from being achieved.
