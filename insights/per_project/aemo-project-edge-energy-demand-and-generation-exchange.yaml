  what_happened: The biggest perceived barrier to joining a VPP among potential customers
    was the upfront cost of purchasing the necessary DER hardware (solar panels and/or
    battery), not concerns about the VPP model itself.
  lesson_learnt: Reducing the upfront cost of DER acquisition — through financing,
    bundling, or subsidy schemes — is the most impactful lever for increasing VPP
    participation; addressing VPP-specific concerns alone will not suffice if hardware
    affordability remains a barrier.
