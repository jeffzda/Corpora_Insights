  what_happened: Potential residential consumers perceived little incremental benefit
    from joining an aggregator over and above simply adopting DER, with the only exception
    being a perception that joining an aggregator was more likely to help the community.
    This suggests the value proposition for aggregator participation was not adequately
    differentiated from DER adoption alone.
