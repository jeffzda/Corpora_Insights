  project_name: Project EDGE
  what_happened: Technology procurement for Project EDGE required new platforms to
    be built or procured for scalable data exchange and DER management within operating
    envelopes. AusNet procured a DERMS product as a tactical BAU solution, and AEMO
    procured Energy Web Foundation's technology solution after a competitive process.
  lesson_learnt: Projects integrating novel DER marketplace technology should allow
    sufficient time and process for competitive technology procurement, as bespoke
    platform builds and integrations for first-of-kind use cases carry significant
    schedule risk; procuring proven products for BAU functions (e.g. DERMS) while
    reserving custom development for genuinely novel functions reduces overall delivery
    risk.
