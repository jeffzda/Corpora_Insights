  what_happened: Stakeholder engagement with aggregators during Project EDGE found
    that most aggregators focus on protecting their systems from cyber risks but have
    a gap in capabilities that 'assume compromise' — lacking monitoring, detection,
    isolation, defence and recovery capabilities — and there is broad industry support
    for mandatory DER-specific cyber security standards.
  lesson_learnt: DER aggregators deploying VPP systems at scale must go beyond perimeter-protection
    cyber security to implement 'assume compromise' frameworks covering detection,
    isolation and recovery, and DER-specific mandatory cyber security standards should
    be developed to replace the current voluntary approach before large-scale coordinated
    DER creates systemic vulnerability through public internet communications infrastructure.
