    unlocked for voltage-constrained distribution networks through voltage management
    services — simple but aggressive Volt-VAr curves applied by participating inverters
    can unlock hosting capacity — but net benefits are highly sensitive to wholesale
    spot market prices.
  lesson_learnt: DNSPs and policy makers should investigate voltage management services
    as a complementary DSO capability to DOEs — voltage management can expand DER
    hosting capacity in voltage-constrained networks and open additional revenue streams
    for DER, but should be evaluated in the context of wholesale price sensitivity
    and regulatory treatment before deployment at scale.
