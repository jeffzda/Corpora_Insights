  what_happened: Project EDGE found that the existing NEM legal and regulatory framework
    did not contemplate DNSPs calculating and communicating operational limits (DOEs)
    to flexible resources while AEMO remains responsible for whole-of-system security,
    creating ambiguity in roles and risk allocation that would need to be resolved
    before DOEs can be rolled out at scale.
