- record_id: ARENA-DLV-72475
  source_title: AEMO - Project EDGE - Final Report
  publish_date: '2023'
  project_name: Project EDGE
  what_happened: Field tests of a 0kW dispatch instruction to limit VPP portfolio
    gross power flow to zero (intended to manage minimum system load events) showed
    that none of the aggregators' controlled power met the dispatch target during
    the test period — controlled power ranged from 0.42kW to 24.66kW — because the
    instruction conflicted with consumer self-consumption and negative price incentives.
  lesson_learnt: A 0kW dispatch instruction to limit PV generation may not achieve
    the intended outcome of managing minimum system load events because it conflicts
    with consumer self-consumption incentives; AEMO should instead issue directions
    specifying a set load target, account for DOE limits and forecast fleet capacity,
    or develop alternative non-market backstop mechanisms.
