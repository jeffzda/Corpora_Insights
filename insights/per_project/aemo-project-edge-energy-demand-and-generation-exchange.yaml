- record_id: ARENA-DLV-72460
  source_title: AEMO - Project EDGE - Final Report
  publish_date: '2023'
  project_name: Project EDGE
  what_happened: Field trial data showed that as DUID-level telemetry was transmitted
    at higher frequency, fleet coverage reduced due to latency between IoT devices
    and the aggregator's cloud, with vendor-driven software upgrades causing 5–10
    minute outages and increasing storage and telecommunications costs.
  lesson_learnt: Aggregators should design distributed (gateway-based) rather than
    purely cloud-based architectures for high-frequency telemetry — storing data locally
