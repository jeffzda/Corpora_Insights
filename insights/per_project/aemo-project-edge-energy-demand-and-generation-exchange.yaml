- record_id: ARENA-DLV-14614
  source_title: Project EDGE Lessons Learnt 1
  publish_date: 2021-05
  project_name: Project EDGE
  what_happened: AusNet faced the challenge of aligning a trial/pilot DERMS procurement
    with incumbent enterprise systems and strategic system renewal activities planned
    for the upcoming regulatory period, requiring a deliberate approach to avoid creating
    technical debt or stranded assets.
  lesson_learnt: When procuring technology for a trial that must eventually integrate
    with enterprise systems, prioritise agility and minimum-viable-product scope over
    full-featured solutions — this minimises technical debt, preserves future option
    value when surrounding enterprise systems are renewed, and provides a tactical
    BAU capability in the interim.
