  project_name: Project EDGE
  what_happened: Despite broad satisfaction, only 59% of Project EDGE customers reported
    a high likelihood of remaining with the VPP after the trial concluded, and only
    59% were very or extremely comfortable with their aggregator managing their DER
    — a low figure given that DER management is the core VPP proposition.
