  source_title: AEMO - Project EDGE - Independent CBA Executive Summary
  publish_date: 2023-10
  project_name: Project EDGE
  what_happened: The Project EDGE CBA found that the value of a Local Services Exchange
    is highly location- and time-dependent, making it difficult to determine optimal
    timing for NEM-wide LSE implementation. The LSE delivers value only where DER
    Aggregators can represent sufficient DER capacity at concentrated locations where
    network support is required.
  lesson_learnt: Do not implement an LSE as a uniform NEM-wide rollout — instead take
    a targeted, staged approach based on identified network constraints, as LSE services
    are only viable where there is sufficient concentrated DER capacity at constrained
    locations; start with known constrained network segments and lower barriers by
    exchanging data via a scalable DER data hub.
