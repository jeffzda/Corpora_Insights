  project_name: Project EDGE
  what_happened: Project EDGE found that if each party (AEMO, DNSPs, aggregators)
    maintained separate VPP portfolio management systems, it would create inefficiencies,
    raise the risk of errors and disputes, and would not be scalable in a high DER
    future — whereas a single integrated source of truth used by all parties avoided
    duplication.
  lesson_learnt: DER integration at scale requires a single integrated system for
    VPP portfolio registration accessible to AEMO, DNSPs and aggregators — separate
    parallel registers create discrepancies, errors and scaling barriers; a DER data
    hub providing a common source of truth for standing data, portfolio allocation
    and consent should be a foundational design requirement.
