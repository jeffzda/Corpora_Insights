- record_id: ARENA-DLV-72459
  source_title: AEMO - Project EDGE - Final Report
  publish_date: '2023'
  project_name: Project EDGE
  what_happened: During a field-tested sustained high-price event ($13,000/MWh from
    12:00–12:30 plus a subsequent spike), an aggregator's 'set and forget' bidding
    approach meant it did not prepare battery state of charge ahead of the forecast
    event, resulting in near-depleted storage during the high-price period and significant
    dispatch non-conformance.
  lesson_farnt: Aggregators must develop active battery state-of-charge management
    ahead of forecast high-price events — failure to pre-charge batteries before a
    sustained high-price period results in dispatch non-conformance and significant
    missed revenue; re-bidding lower quantities when SOC is insufficient is also required
    to avoid non-conformance penalties.
  lesson_learnt: Aggregators must develop active battery state-of-charge management
    ahead of forecast high-price events — failure to pre-charge batteries before a
    sustained high-price period results in dispatch non-conformance and significant
    missed revenue; re-bidding to reflect lower available quantities when SOC is insufficient
    is required to avoid non-conformance penalties.
