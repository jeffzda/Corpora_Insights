  what_happened: Project EDGE found that the 'trust in self-constraining' approach
    for VPP DOE conformance — tested during Flex bidding — proved effective but not
    100% of the time, and that as VPPs scale to GW levels, the risk to system security
    from operating beyond operational limits would be materially higher, necessitating
    additional controls.
  lesson_learnt: Self-constraining alone is not a sufficient safeguard for VPP DOE
    conformance at GW scale — as VPP portfolios grow, additional conformance mechanisms
    (bid validation, transmission-level constraints, or decentralised monitoring)
    will be required; policy makers and AEMO should define the appropriate combination
    before VPPs reach material scale.
