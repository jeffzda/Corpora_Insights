  source_title: Project EDGE Lessons Learnt 2
  publish_date: 2022-11
  project_name: Project EDGE
  what_happened: Commercial and industrial (C&I) consumers perceived a range of potential
    benefits from DER adoption but most interviewees indicated that adoption interest
    within their organisations would likely be limited, driven primarily by weak financial
    cases due to the current cost of batteries and lengthy payback periods.
  lesson_learnt: Business models targeting C&I consumers must attach quantified financial
    value to the broader benefits of DER adoption (resilience, climate action) and
    consider mission alignment, as diverse payback period thresholds (2–10 years)
    mean a one-size-fits-all financial model will not drive adoption; grant funding
    and case studies can strengthen internal champion advocacy.
