  what_happened: Project EDGE field trial results confirmed that existing NEM wholesale
    market frameworks — based on central scheduling and dispatch — are not fit for
    purpose for integrating DER at scale, as there are currently no VPPs with small-scale
    DER participating in the wholesale energy market.
  lesson_learnt: Wholesale market reform is needed before DER can be integrated at
    scale — existing scheduling and dispatch frameworks do not support DER visibility
    or participation, and a progressive stepping-stone approach (visibility → self-dispatch
    → full scheduling) should be designed and implemented now while DER penetration
    is still manageable.
