  project_name: Project EDGE
  what_happened: Project EDGE identified that capacity-optimised and bid-optimised
    DOE approaches carry a gaming risk — aggregators could maintain high MaxAvail
    figures before DOEs are generated and then rebid lower MaxAvail or higher prices
    before gate closure, maximising their network capacity allocation while limiting
    actual dispatch.
  lesson_learnt: Any DOE optimisation mechanism that uses pre-dispatch aggregator
    bids or capacity forecasts to allocate network capacity should include anti-gaming
    provisions — either by minimising the time lag between DOE generation and dispatch,
    or through ex-post surveillance of aggregator bidding patterns around DOE calculation
    intervals.
