  project_name: Project EDGE
  what_happened: 'Point-to-point data exchange between DNSPs and customer agents/aggregators
    without a central hub creates scalability problems as active DER grows: each aggregator
    must register with and maintain integrations with each DNSP, and small differences
    in how each DNSP implements the agreed standard proliferate integration requirements
    and negate efficiency gains over time.'
  lesson_learnt: Point-to-point data exchange between DNSPs and aggregators is not
    a scalable architecture for a high-DER future — even with agreed standards, per-DNSP
    integration burdens will create entry barriers and cost increases for aggregators;
    a data exchange hub approach should be evaluated as the preferred architecture
    before standardising on point-to-point.
