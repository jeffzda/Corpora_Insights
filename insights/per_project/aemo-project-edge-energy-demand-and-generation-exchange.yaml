  source_title: AEMO - Project EDGE - Final Report
  publish_date: '2023'
  project_name: Project EDGE
  what_happened: Field trial data showed that high-frequency (1-minute) portfolio
    telemetry transmission to AEMO was technically feasible within trial constraints,
    but the associated costs — including IoT device upgrades, cloud storage, telecommunications,
    and parallel processing — were significant and aggregators had different views
    on whether these costs were commercially prohibitive at scale.
  lesson_learnt: Data communications standards for scheduled DER participation should
    balance power system security needs against commercial feasibility — requiring
    SCADA-equivalent telemetry at scale would be prohibitively costly for most aggregators;
    a stepped approach tying data obligations to revenue opportunities (via a service-based
    stepping-stone model) would allow aggregators to invest in communications capability
    as revenue scales.
