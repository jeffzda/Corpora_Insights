- record_id: ARENA-DLV-52475
  source_title: Project EDGE Lessons Learnt 2
  publish_date: 2022-11
  project_name: Project EDGE
  what_happened: The governance and ownership model for a future decentralised DER
    data hub had not been resolved by the time of this report. Key unresolved questions
    included who would establish and govern the hub, whether it should be permissioned
    or public, how costs would be recovered, and how it would be regulated — creating
    a barrier to transition beyond the proof-of-concept.
  lesson_learnt: Governance, ownership, and cost-recovery frameworks for a shared
    DER data infrastructure must be designed and consulted on in parallel with the
    technical proof-of-concept phase — leaving these questions unresolved until after
    technical feasibility is demonstrated creates transition barriers and risks the
    benefits of the technology not being realised at industry scale.
