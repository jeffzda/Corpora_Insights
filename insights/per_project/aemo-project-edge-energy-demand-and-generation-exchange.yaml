  source_title: AEMO - Project EDGE - Independent CBA Full Report
  publish_date: 2023-10
  project_name: Project EDGE
  what_happened: The Project EDGE CBA used the AEMO ISP Step Change and a separately
    developed High DER scenario for DER uptake assumptions, rather than the AEMO ISP
    Hydrogen Superpower scenario, because the latter was driven by hydrogen electrolyser
    demand and policy change rather than commercial DER factors, making it less suitable
    for testing DER integration capabilities.
  lesson_learnt: When selecting DER uptake scenarios for CBA modelling, ensure scenarios
    are driven by commercial DER adoption dynamics rather than policy-dependent or
    demand-side transformation assumptions — scenario selection materially affects
    the apparent value of DER capabilities and must be fit for the purpose of testing
    those capabilities.
