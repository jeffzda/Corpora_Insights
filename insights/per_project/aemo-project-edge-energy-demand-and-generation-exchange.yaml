    that included C&I sites, because a single forecast error for a large C&I site
    (often MW-scale) had a materially larger impact on conformance than errors at
    residential sites (~10kW).
  lesson_learnt: Aggregators building NSS portfolios for simultaneous wholesale market
    participation should carefully consider the composition of C&I versus residential
    sites — C&I sites carry a disproportionate risk of dispatch conformance errors
    due to their size, and should be complemented by consistent demand profiles and
    sufficient historical data.
