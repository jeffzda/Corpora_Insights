  what_happened: The CBA identified that Vehicle-to-Grid (V2G) coordination, the compounding
    effect of market configurations on DER uptake, and additional DER service innovations
    (e.g., retailers requesting DER Aggregators to manage exports during negative
    price periods) were all excluded from the quantified CBA due to data limitations,
    meaning the $5.15–6.04b headline figure is a conservative lower bound.
  lesson_learnt: CBA methodology for DER integration programmes should flag and attempt
    to bound unquantified benefit streams (V2G, market configuration compounding effects,
    innovative DER services) explicitly — failing to do so risks underestimating benefits
    by an unknown but potentially material margin, which could lead to under-investment
    decisions.
