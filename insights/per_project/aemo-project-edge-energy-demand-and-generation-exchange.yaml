  outcome_class: knowledge generated despite setback
  secondary_failure_mode: regulatory & approvals
  intervention_note: Project EDGE recommended further field testing of Flex DOEs across
    multiple companies and networks, with CBA analysis to inform future DOE design
    and rollout.
  transferability: moderate
  delay_magnitude: null
  technology_domain: DER
