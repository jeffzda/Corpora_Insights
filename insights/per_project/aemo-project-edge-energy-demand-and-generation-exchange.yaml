  source_title: AEMO - Project EDGE - Final Report
  publish_date: 2023-10
  project_name: Project EDGE (Energy Demand and Generation Exchange)
  what_happened: Point-to-point DER data exchange — where each aggregator and retailer
    connects separately to each DNSP's systems — was assessed as not scalable for
    a high-DER future; Project EDGE demonstrated a DER data hub approach at small
    scale as an alternative, with the CBA finding a hub approach saves $0.44b over
    20 years compared to point-to-point.
  lesson_learnt: Programmes deploying DER services at scale should design data exchange
    architecture around a centralised or decentralised hub model from the outset rather
    than defaulting to point-to-point integrations, which become prohibitively costly
    and complex as participant numbers grow; detailed design and governance decisions
    for a hub should be resolved before technology procurement.
