  project_name: Project EDGE
  what_happened: Modelling work in Project EDGE demonstrated that the 'Equal Allocation'
    DOE objective function results in material underutilisation of available network
    capacity for DER compared with the 'Maximise Service' objective function, meaning
    DER resources are constrained unnecessarily with negative economic impact for
    all consumers.
  lesson_learnt: DNSPs rolling out DOEs should avoid a simple equal allocation objective
    function as the default — it demonstrably under-utilises network capacity relative
    to service-maximising approaches, with negative economic consequences for consumers;
    the choice of allocation objective function should be informed by techno-economic
    analysis before deployment.
