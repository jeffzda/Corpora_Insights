  project_name: Project EDGE
  what_happened: LSE field tests showed that a 90% compliance threshold — where a
    single instantaneous measurement outside the band constituted service failure
    — forced aggregators to systematically over-deliver (maintain a buffer) to avoid
    non-compliance, increasing the cost of service delivery and potentially reducing
    the quantity aggregators are willing to offer.
  lesson_learnt: DNSPs should consult with aggregators to set NSS compliance thresholds
    that reflect realistic delivery variability — strict instantaneous compliance
    metrics increase aggregator delivery costs and may suppress NSS market participation;
    a threshold based on duration and consistency of delivery within target bands
    is likely more appropriate than instantaneous measurement.
