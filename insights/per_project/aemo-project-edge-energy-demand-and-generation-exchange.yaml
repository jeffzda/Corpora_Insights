    additional exports would not accelerate DER depreciation and certainty about the
    financial trade-off between additional exports and self-consumption.
  lesson_learnt: Any strategy to increase VPP export volumes must be accompanied by
    clear household-level financial modelling showing the customer will be net better
    off, and assurances about hardware longevity — without these, even motivated customers
    will decline additional export requests.
