  source_title: Project Edge Public Customer Insight and Engagement Study Interim
    Report
  publish_date: 2022-07
  project_name: Project EDGE
  what_happened: Some interviewees (5 of 16) had not been able to test whether their
    battery would deliver the blackout/bushfire resilience they had purchased it for,
    yet battery resilience during outages was a primary purchase motivator. For those
    who had experienced a real outage, battery performance during blackouts was positively
    surprising and generated social proof value.
  lesson_learnt: Resilience benefits are a compelling VPP participation motivator
    but remain latent until experienced — consider scheduling controlled discharge
    tests or simulated outage demonstrations early in the customer journey to validate
    the resilience value proposition and strengthen participant commitment.
