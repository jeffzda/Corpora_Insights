  what_happened: Consumer preference for self-consumption was the dominant driver
    of aggregator DER control behaviour throughout the Project EDGE field trial, meaning
    aggregators focused on minimising net grid imports and largely ignored revenue
    opportunities from wholesale price signals except at extreme price thresholds.
  lesson_farnt: Aggregators building towards wholesale market participation should
    future-proof their system architecture from the outset so self-consumption logic
    can be enhanced to support price-responsive operation — systems designed solely
    around self-consumption optimisation will require costly rearchitecting to access
    wholesale revenue streams.
