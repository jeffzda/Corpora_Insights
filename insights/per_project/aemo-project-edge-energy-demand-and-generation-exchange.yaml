  project_name: Project EDGE
  what_happened: Project EDGE found that under Net NMI DOEs, aggregators must monitor
    uncontrolled devices and adjust controlled resources to maintain net site compliance
    — in practice this forces aggregators to either withhold capacity from the market
    or risk non-conformance when uncontrolled load changes unexpectedly, reducing
    available DER capacity in the wholesale market.
  lesson_learnt: Flex DOEs — applied only to controllable devices — reduce VPP operational
    risk compared to Net NMI DOEs by eliminating the need to forecast and compensate
    for uncontrolled load, thereby enabling aggregators to offer greater DER capacity
    to the market; however, DER interoperability barriers must first be resolved for
    this benefit to be realised.
