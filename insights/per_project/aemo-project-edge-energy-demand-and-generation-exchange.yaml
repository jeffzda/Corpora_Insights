  project_name: Project EDGE
  what_happened: Project EDGE found that under existing Australian ringfencing guidelines,
    DNSPs are prohibited from providing certain contestable services — including RERT
    — without an AER waiver, and that the current Shared Asset Guideline requires
    only very limited revenue sharing with customers (above a 1% threshold, only 10%
    shared), creating uncertainty about whether DSO market service revenues would
    benefit consumers.
  lesson_learnt: As DNSPs develop DSO capabilities that generate revenue from market
    services, clear regulatory mechanisms for sharing unregulated revenues with customers
    will be needed — the current 1%/10% threshold in the Shared Asset Guideline is
    inadequate compared to UK arrangements where DNOs share revenues at the totex
    efficiency incentive rate; this should be resolved before DSO market services
    are scaled.
