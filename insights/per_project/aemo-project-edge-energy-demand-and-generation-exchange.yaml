  source_title: AEMO - Project EDGE - Independent CBA Full Report
  publish_date: 2023-10
  project_name: Project EDGE
  what_happened: The Project EDGE arrangement placed DER Aggregators in the role of
    co-optimising DER portfolios across wholesale and local network services on behalf
    of DER customers, which the MCA and CBA found to be more efficient and better
    aligned with the NEO than alternative arrangements (e.g., NMI-level dispatch,
    AEMO co-optimisation of three separate bid files, or DNSP-initiated alternative
    DOEs).
  lesson_learnt: Assign DER portfolio optimisation responsibility to DER Aggregators
    rather than distributing it across the Market Operator or DNSPs — portfolio-level
    co-optimisation by the party closest to DER customers delivers better consumer
    value, lower complexity, and more appropriate risk allocation than centralised
    or network-centric alternatives.
