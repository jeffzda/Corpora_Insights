  outcome_class: knowledge generated despite setback
  secondary_failure_mode: execution & logistics
  intervention_note: Project EDGE developed and tested a five-horizon stepping-stone
    participation model (from uncoordinated through visibility, forecasting, self-dispatch,
    to fully scheduled) to allow aggregators to develop capabilities progressively.
  transferability: broad
  delay_magnitude: null
