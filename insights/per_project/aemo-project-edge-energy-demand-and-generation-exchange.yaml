  source_title: AEMO - Project EDGE - Independent CBA Full Report
  publish_date: 2023-10
  project_name: Project EDGE
  what_happened: Overly conservative, static export limits on DER connections resulted
    in significant export curtailment — the Project EDGE arrangement was found capable
    of avoiding 15.1 TWh of rooftop solar curtailment by 2030 and up to 90.6 TWh across
    20 years under AEMO ISP Step Change assumptions, representing value that is currently
    being destroyed under the base case.
  lesson_learnt: Static export limits set at connection should be replaced with dynamic
    operating envelopes as early as possible; the longer static limits persist, the
    greater the cumulative economic loss from curtailed DER exports, particularly
    as solar penetration rises above 30% of dwellings.
