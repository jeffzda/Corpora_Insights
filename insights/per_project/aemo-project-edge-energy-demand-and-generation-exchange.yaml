  what_happened: 'Stakeholder engagement during Project EDGE identified four categories
    of DER data exchange problems: data inconsistency across participants due to replicated
    standing data with limited reconciliation; high bespoke bilateral integration
    costs that create entry barriers; fragmented and costly visibility of DER operational
    data; and cyber security challenges from heterogeneous proprietary platforms lacking
    uniform standards.'
  lesson_learnt: Before designing DER market integration architecture, project proponents
    and policy makers should formally identify and validate data exchange problem
    statements with industry — the four categories found in Project EDGE (data inconsistency,
    high integration costs, limited visibility, and cyber security) represent persistent
    barriers that any scalable DER data exchange solution must address.
