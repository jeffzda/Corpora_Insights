- record_id: ARENA-DLV-72416
  source_title: AEMO - Project EDGE - Final Report
  publish_date: 2023-10
  project_name: Project EDGE
  what_happened: VPP customers consistently prioritised self-consumption of stored
    power over grid export, particularly during high-price periods — the very times
    aggregators most need to dispatch DER. This misalignment between customer preference
    and aggregator dispatch needs created a structural barrier to price-responsive
    VPP operation.
  lesson_learnt: Aggregators should design VPP business models that explicitly demonstrate
    net financial benefit over time even when self-consumption is occasionally foregone;
    offering guaranteed 'better off overall' assurances and deploying personalised
    messaging about under-utilised stored energy can help shift customer behaviour
    toward price-responsive participation.
