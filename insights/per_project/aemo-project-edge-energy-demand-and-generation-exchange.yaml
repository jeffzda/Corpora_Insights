  project_name: Project EDGE
  what_happened: SAPN's Flexible Exports program demonstrated that IEEE 2030.5 DefaultDERControl
    — a failsafe reverting devices to minimal export after 2 hours without communications
    — can manage system security under current DER penetration levels, but SAPN acknowledged
    this procedure may need further development as DER penetration increases.
  lesson_learnt: DNSPs should implement and regularly review DefaultDERControl failsafe
    settings calibrated to current and projected DER penetration levels; as penetration
    grows, static compensatory control settings will be insufficient and dynamic operational
    procedures between DNSP and AEMO control rooms will be required.
