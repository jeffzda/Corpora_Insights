  what_happened: Project EDGE found that customer churn from LSE portfolios — particularly
    in high-firmness service contexts — creates a need for a streamlined contract
    amendment process between aggregators and DNSPs to adjust contracted volumes when
    sites exit or are added; without a streamlined process, contract bureaucracy becomes
    a barrier to LSE participation.
