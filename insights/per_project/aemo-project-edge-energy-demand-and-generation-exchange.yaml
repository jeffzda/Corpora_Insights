  source_title: AEMO - Project EDGE - Final customer insights study
  publish_date: '2023'
  project_name: Project EDGE
  what_happened: Current Project EDGE customers consistently requested improved communications
    including real-time visibility of VPP activity, forewarning of export events,
    and information about what the trial was achieving — the same items they also
    identified as enhancing their comfort with aggregator DER management.
  lesson_learnt: Providing real-time export activity data, advance notification of
    VPP dispatch events, and regular trial progress updates simultaneously addresses
    the communications gap and increases customer comfort with aggregator DER management
    — these features should be treated as core product requirements rather than optional
    enhancements.
