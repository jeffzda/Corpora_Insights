  source_title: AEMO - Project EDGE - Final customer insights study
  publish_date: '2023'
  project_name: Project EDGE
  what_happened: Only 24% of current Project EDGE customers strongly agreed that joining
    the VPP had benefitted their household, compared with 61% who strongly agreed
    that adopting DER alone had done so. Additionally, 29% believed aggregators benefitted
    more from VPP participation than households, against only 11% who believed households
    benefitted more.
  lesson_learnt: The perceived value of VPP participation to households is significantly
    lower than the perceived value of DER ownership alone — aggregators must strengthen
    and clearly communicate the household-level incremental benefit of VPP enrolment
    to improve retention and advocacy.
