  what_happened: Desktop assessment of capacity-optimised DOEs on a constrained cluster
    found that capacity optimisation reduced unused export DOE allocation from 135kWh
    to less than 1kWh over a week, fully utilising available network capacity — but
    this relied on near-dispatch-time NMI-level aggregator forecasts that are unlikely
    to be available in operational practice.
  lesson_learnt: Capacity-optimised DOEs can deliver significant efficiency gains
    in constrained network clusters, but practical implementation requires aggregators
    to provide accurate NMI-level forecasts close to dispatch time — programme designers
    should treat the desktop results as a best-case bound and design operational implementations
    with forecast uncertainty buffers to prevent aggregators being disincentivised
    by tighter DOE limits.
