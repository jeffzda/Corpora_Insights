- record_id: ARENA-DLV-52451
  source_title: Project EDGE Lessons Learnt 2
  publish_date: 2022-11
  project_name: Project EDGE
  what_happened: Discover Energy, a small electricity retailer without a generation
    or gas portfolio, was unable to acquire as many trial participants as anticipated
    because persistent high wholesale prices forced it to pass cost increases to customers
    and withdraw all market offers from July 2022. Some consumers switched to other
    VPP service providers due to increased usage rates.
  lesson_learnt: Aggregators participating in DER marketplace trials must have sufficient
    portfolio diversification or risk-hedging capability to absorb wholesale price
    volatility — small retailers fully exposed to spot prices may lose consumers to
