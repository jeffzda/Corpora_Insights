  what_happened: Project EDGE VPP customers were disproportionately older, more highly
    educated, and more likely to live in two-person households compared with the broader
    Australian population, suggesting that early VPP adoption has skewed toward a
    non-representative demographic.
  lesson_learnt: VPP trial participant pools drawn from existing early-adopter DER
    owners over-represent educated, older, smaller households — insights from these
    cohorts should not be assumed to generalise to the broader population, and future
    trials should actively recruit more diverse participants.
