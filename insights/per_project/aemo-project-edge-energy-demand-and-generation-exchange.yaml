- record_id: ARENA-DLV-63158
  source_title: AEMO - Project EDGE - Independent CBA Executive Summary
  publish_date: 2023-10
  project_name: Project EDGE
  what_happened: The Project EDGE CBA identified that DNSP regulatory reset submission
    timelines — where draft submissions must be lodged approximately 18 months before
    the regulatory reset period — create a binding constraint on the timing of DER
    capability investment decisions, with reset periods running FY25–FY30, FY26–FY31,
    and FY27–FY32.
  lesson_learnt: DER programme managers and policy makers must align capability investment
    proposals with DNSP regulatory reset submission windows — missing the 18-month
    pre-reset submission deadline means deferring DER investment by an entire regulatory
    period (typically 5 years), significantly delaying the realisation of consumer
    benefits identified in the CBA.
