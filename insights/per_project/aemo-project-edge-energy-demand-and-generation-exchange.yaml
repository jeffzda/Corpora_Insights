  what_happened: Aggregators found that existing IEEE 2030.5 protocol needed to be
    adapted into a semi-bespoke version for Project EDGE because standard protocols
    were not fully fit-for-purpose for the specific trial requirements, highlighting
    that lack of agreed standards for DER information exchange significantly increases
    aggregation costs.
