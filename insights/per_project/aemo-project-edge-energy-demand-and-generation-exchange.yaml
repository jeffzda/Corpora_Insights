  what_happened: Consumer research by Deakin University found that a majority of potential
    residential consumers (60%) were unsure whether they would trust an aggregator
    to access and export their stored power, and only 25% indicated they would trust
    an aggregator to do so.
  lesson_learnt: Trust is a structural barrier to VPP participation; aggregators should
    explicitly offer consumer control over export timing and quantity, pre- and post-export
    transparency notifications, and guaranteed financial earnings to overcome the
    default distrust among potential residential consumers.
