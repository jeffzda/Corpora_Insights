  source_title: Project EDGE Interim Public Project Report
  publish_date: 2022-07
  project_name: Project EDGE
  what_happened: The UoM DOE algorithm demonstrated it can reliably calculate network
    access for DER at specific site connections when fed accurate network and customer
    data, and that the simplified iterative load flow calculation is fast and efficient;
    however, the algorithm requires accurate full topology and impedance data as inputs,
    limiting its scalability to networks with high active DER penetration where investment
    in data accuracy is justified.
  lesson_learnt: A full electrical network model-based DOE algorithm is well-suited
    to high DER-penetration networks where reliable and accurate DOE calculation benefits
    outweigh implementation costs; for networks with lower active DER penetration,
    simplified DOE calculation approaches are likely to be more cost-efficient and
    should be considered from the outset.
