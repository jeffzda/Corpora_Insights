  project_name: Project EDGE
  what_happened: AusNet's initial approach to selecting trial customer areas applied
    a range of network and customer filters via data analytics to identify attractive
    local networks, but this proved too restrictive on aggregator customer recruitment;
    the process was simplified to focus on LV and HV networks with severely constrained
    DER hosting capacity.
  lesson_learnt: Over-filtering customer recruitment areas using multiple simultaneous
    network and customer criteria will constrain the aggregator's customer acquisition;
    a simpler network-first filter focused on constrained DER hosting capacity produces
    more usable trial areas, even if it does not ideally suit testing of all local
    network service types.
