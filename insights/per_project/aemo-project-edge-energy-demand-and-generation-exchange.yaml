  what_happened: The theoretical evaluation found that a decentralised data hub can
    theoretically deliver greater benefits than a centralised hub across all four
    assessed criteria (scalability/resilience, interoperability, security/auditability,
    and standardisation/fairness), but decentralised approaches remain relatively
    immature in the Australian energy sector and require enterprise-grade development
    before benefits can be realised.
