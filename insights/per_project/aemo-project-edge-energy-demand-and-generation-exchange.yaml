  what_happened: One participant (1 of 16) received inconsistent technical advice
    during the installation process — the initial installer specified cable sizing
    for a shed-to-house solar connection, but the solar installer subsequently refused
    to proceed with that configuration. This resulted in wasted infrastructure investment.
  lesson_learnt: In VPP hardware rollouts involving multiple contractors, ensure end-to-end
    installation specifications are coordinated and confirmed by the final installer
    before customers commit to preparatory infrastructure works — inconsistent advice
    across the installation chain creates unnecessary cost and customer frustration.
