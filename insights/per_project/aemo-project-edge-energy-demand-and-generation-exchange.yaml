  what_happened: Project EDGE found that NSS for coordinated DER are not widely adopted
    or standardised in Australia — where procured, they are point-to-point and bespoke
    — making it difficult for aggregators to efficiently participate across multiple
    DNSP service areas.
  lesson_learnt: Policy makers and DNSPs should develop an industry guideline to standardise
    NSS service definitions, contractual terms and transaction processes across the
    NEM; standardisation disproportionately benefits aggregators by reducing operational
    costs but is also essential for DNSPs to seed a liquid market of service providers
    and achieve price competition.
