  what_happened: LSE field trials showed that aggregators would generally prioritise
    higher wholesale market prices over local network support services, except for
    firm services where service revenue certainty, DNSP trust, and avoidance of contract
    penalties provided sufficient incentive to honour NSS commitments.
  lesson_learnt: LSE contract design should recognise that aggregators will defect
    to wholesale market participation when prices are materially higher — firm service
    contracts with clear penalties and revenue certainty are needed to ensure reliable
    NSS delivery; low-firmness services face higher defection risk and should be priced
    accordingly.
