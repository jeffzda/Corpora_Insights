  what_happened: Non-residential customers with Type 1-4 meters provided only 30-minute
    accumulated energy consumption data without instantaneous voltage and current
    measurements, leaving gaps in the data set needed for DOE calculation and requiring
    workarounds such as portable power quality meters and estimated usage profiles.
  lesson_learnt: DNSPs must develop a strategy for obtaining active and reactive power
    data from customers with Type 1-4 meters before deploying DOE algorithms — incomplete
    measurement data reduces DOE calculation integrity and requires costly interim
    measures such as portable power quality meters or estimated profiles.
