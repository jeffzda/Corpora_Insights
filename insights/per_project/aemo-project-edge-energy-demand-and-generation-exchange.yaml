  project_name: Project EDGE
  what_happened: During field tests, Project EDGE found that the Project EDGE implementation
    of the CSIP-AUS data schema required export and import DOE limits to be positive
    numbers, preventing the setting of a negative export limit needed to fully curtail
    distributed PV generation during DPV contingency events.
  lesson_learnt: DOE data schema implementations must support negative export limit
    values (not only positive) to enable full distributed PV curtailment during contingency
    events — the SA HB 218:2023 CSIP-AUS handbook permits this; future implementations
    should adopt the single operating envelope approach rather than two independent
    positive limits.
