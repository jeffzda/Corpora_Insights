  project_name: Project EDGE
  what_happened: Consumer research by Deakin University found that consumers already
    participating in VPP programs were willing to trade stored energy but only once
    their own household energy requirements were assured, and many expressed concern
    that their current battery had insufficient capacity to meet their existing needs
    let alone support trading.
  lesson_learnt: VPP business models must credibly guarantee household energy sufficiency
    before trading obligations are triggered — battery capacity adequacy and consumer
    energy security assurances are prerequisite conditions for sustained residential
    VPP participation, and aggregators should design enrolment criteria and dispatch
    logic that visibly protect household reserve levels.
