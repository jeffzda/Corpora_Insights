  source_title: AEMO - Project EDGE - Final Report
  publish_date: '2023'
  project_name: Project EDGE
  what_happened: Project EDGE found that aggregators face opportunity costs from committing
    DER capacity to firm local NSS contracts — including higher energy costs during
    import-at-high-price events, missed wholesale revenue opportunities during high-price
    windows, and battery degradation — meaning contract value must exceed these costs
    for aggregators to willingly participate.
  lesson_learnt: LSE contract pricing and design must compensate aggregators for quantifiable
    opportunity costs — energy cost exposure, missed wholesale revenue and battery
    degradation — not just the direct service delivery cost; failure to adequately
    price these factors will suppress aggregator willingness to participate in firm
    NSS contracts.
