- record_id: ARENA-DLV-72438
  source_title: AEMO - Project EDGE - Final Report
  publish_date: null
  project_name: Project EDGE
  what_happened: Some aggregators in the Project EDGE field trial conformed to a DOE
    without having operational control of all flexible devices at the premises — leading
    one aggregator to install a control relay to switch off third-party equipment
    at sites to prevent those devices from causing DOE breaches, which potentially
    unnecessarily constrained consumer DER.
  lesson_learnt: Where multiple aggregators or third-party controllers operate DER
