  what_happened: During the high-level design stage of Project EDGE, the project assumed
    DOE capacity could be economically optimised using aggregator bids; however, detailed
    design revealed that aggregator bids supplied at whole-of-fleet level (DUID) lacked
    the NMI-level granularity required for economic DOE optimisation, forcing a pivot
    to desktop analysis of theoretical value only.
