  source_title: Project EDGE Interim Public Project Report
  publish_date: 2022-07
  project_name: Project EDGE
  what_happened: Information obligations placed on aggregators to enable participation
    in a DER marketplace — including data integration requirements, DUID telemetry,
    and portfolio management capability — require investment to uplift systems and
    capabilities; the level of obligations needs to be carefully assessed to avoid
    creating entry barriers for a nascent market while still ensuring power system
    security.
  lesson_learnt: Aggregator information obligations for DER marketplace participation
    must be carefully calibrated — obligations must be sufficient for power system
    security and market integrity but must not be so onerous as to create cost-based
    entry barriers; a staged or proportionate obligation framework aligned to aggregator
    scale and capability would reduce barriers while maintaining system security.
