  what_happened: Field test results showed that VPP forecasting accuracy did not materially
    differ between 2-hour and 24-hour forecast horizons, but improved substantially
    at the 5-minute final bi-directional offer, with accuracy changing by approximately
    50% over 48 hours under Net NMI bidding.
  lesson_learnt: Aggregators and policy makers should not expect material forecasting
    improvement between 2 and 24 hours ahead for DER portfolios — the primary accuracy
    benefit occurs only within the final 2 hours before dispatch, which has implications
    for how market frameworks should treat DER forecast obligations and non-conformance
    penalties.
