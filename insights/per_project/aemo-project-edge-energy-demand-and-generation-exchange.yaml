  what_happened: Some participants (3 of 16) raised concerns about their battery's
    usability during high-risk fire days, noting that restrictions on battery use
    during fire risk periods would undercut the primary resilience benefit that motivated
    their participation. Battery performance was also lower than expected on cloudy
    or winter days due to reduced solar generation.
