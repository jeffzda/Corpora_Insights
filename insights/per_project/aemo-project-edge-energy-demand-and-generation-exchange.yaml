  project_name: Project EDGE
  what_happened: The Project EDGE field trial timeline and budget did not allow parallel
    field testing of alternative arrangements of roles and responsibilities within
    the Hybrid Model, requiring the use of Multi-Criteria Analysis (MCA) as a substitute
    for empirical CBA quantification across several key OpEN functions.
  lesson_farnt: When scoping DER integration field trials, allocate budget and timeline
    for parallel testing of at least two alternative role-and-responsibility configurations
    — reliance on MCA as a substitute for quantified CBA evidence leaves key governance
    decisions underpinned by qualitative scoring rather than economic data.
  lesson_learnt: When scoping DER integration field trials, allocate budget and timeline
    for parallel testing of at least two alternative role-and-responsibility configurations
    — reliance on MCA as a substitute for quantified CBA evidence leaves key governance
    decisions underpinned by qualitative scoring rather than economic data.
