  what_happened: LSE field trial analysis identified that battery degradation caused
    by repeated cycling to deliver local network services represents a real cost to
    customers, reducing battery capacity over time and shortening asset lifetime.
  lesson_learnt: LSE contract terms and aggregator customer acquisition strategies
    must account for battery degradation costs — customers whose assets are cycled
    heavily for NSS delivery will experience reduced battery lifetime, and this cost
    should be transparently factored into the value proposition offered to customers.
