  what_happened: The CBA found that the DNSP regulatory reset cycle creates a binding
    constraint on when advanced DOE and DERMS investments can be approved and implemented
    — draft regulatory submissions must be lodged approximately 18 months before the
    reset period commences, meaning investment decisions for FY27–FY32 resets need
    to be outlined well in advance of FY25.
  lesson_learnt: DER integration programme owners and policy makers must align capability
    roadmaps to DNSP regulatory reset timelines — missing the lodgement window for
    a regulatory reset period can delay DERMS and DOE investment by 5+ years, which
    would substantially defer consumer benefits.
