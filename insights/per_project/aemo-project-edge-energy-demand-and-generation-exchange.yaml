  publish_date: 2022-11
  project_name: Project EDGE
  what_happened: The Project EDGE data exchange hub successfully provided AEMO with
    visibility of DNSPs' DOEs during the NEM market suspension tests, demonstrating
    that a scalable multi-subscriber data exchange approach can deliver operational
    visibility that point-to-point DNSP-to-AEMO integration cannot efficiently replicate
    across many DNSP boundaries.
  lesson_learnt: A scalable data hub that delivers DOEs to multiple subscribers simultaneously
    (including AEMO and aggregators) is operationally superior to point-to-point DNSP
    integration for system management purposes — this benefit becomes critical as
    the number of DNSPs and VPPs requiring coordination grows, and should be a core
    design requirement for any future DER market architecture.
