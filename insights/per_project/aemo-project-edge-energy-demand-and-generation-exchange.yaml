  publish_date: 2022-07
  project_name: Project EDGE
  what_happened: Upfront battery purchase costs were the dominant barrier to participation
    in the Project EDGE VPP trial, outweighing the perceived financial benefits of
    joining. Most participants acknowledged they were unlikely to recoup their battery
    investment within a reasonable timeframe, and subsidies were identified as essential
    to getting people over the line.
  lesson_learnt: For VPP trials where the financial return is ambiguous or long-dated,
    hardware subsidies are essential to overcome the upfront cost barrier — design
    participation incentives around reducing the immediate 'sting' of hardware costs
    rather than emphasising long-term bill savings.
