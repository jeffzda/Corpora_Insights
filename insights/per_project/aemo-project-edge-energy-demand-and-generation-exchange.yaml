  project_name: Project EDGE
  what_happened: During high-level design, Project EDGE assumed DOE capacity could
    be economically optimised at NMI level by comparing aggregator bids, but detailed
    design revealed that fleet-level (DUID) bids lacked the granularity required for
    NMI-level DOE calculations, forcing a pivot in approach.
  lesson_learnt: Design assumptions about data granularity available from aggregators
    should be validated at detailed design stage before committing to an economic
    optimisation model — fleet-level bids cannot support NMI-level optimisation and
    alternative approaches carry scalability costs.
