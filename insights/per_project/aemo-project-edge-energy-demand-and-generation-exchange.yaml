  what_happened: Project EDGE field tests identified that DOE breaches during constrained
    intervals were partly caused by the absence of a synchronisation process between
    new NMI enrolment in an aggregator portfolio and DOE updates from the DNSP — aggregators
    therefore operated without complete DOE limits for newly enrolled sites.
  lesson_learnt: A formal coordination process must be established between the active
    start date of new aggregator sites after AEMO enrolment and a corresponding DOE
    update from the DNSP — without this, aggregators will have incomplete DOE limits
    and breach rates will rise as portfolios grow.
