  source_title: AEMO - Project EDGE - Independent CBA Full Report
  publish_date: 2023-10
  project_name: Project EDGE
  what_happened: The Market Operator's current forecasting mechanisms have limited
    visibility of coordinated DER generation and load, creating a known forecasting
    gap that the CBA identified as 'problematic given no visibility' — with downstream
    impacts on constraint forecasts, supply-demand balancing, and the ability to dispatch
    large generators efficiently.
  lesson_learnt: The Market Operator's forecasting architecture must be updated to
    incorporate DER Aggregator bids and portfolio telemetry before high DER penetration
    is reached — waiting until penetration creates visible operational problems will
    leave insufficient time for system upgrades and could result in degraded power
    system security during the transition.
