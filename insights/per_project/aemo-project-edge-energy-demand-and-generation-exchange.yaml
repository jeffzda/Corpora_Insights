  project_name: Project EDGE
  what_happened: Participants expressed strong reluctance to allow battery trading
    during winter or cloudy days when solar generation was insufficient to recharge
    the battery, and many wanted seasonal restrictions on when trading could occur.
    This preference was not anticipated in the trial design and created tension with
    the VPP operating model.
  lesson_learnt: VPP dispatch logic and customer agreements should explicitly account
    for seasonal and weather-related constraints on participant willingness to trade
    — building configurable 'blackout periods' into the customer interface may reduce
    conflict between operational needs and participant expectations.
