- record_id: ARENA-DLV-53869
  source_title: Demand Flexibility Portfolio Retrospective Analysis Report
  publish_date: 2023-07
  project_name: ARENA Demand Flexibility Portfolio — Residential Smart Meter Coverage
  what_happened: Low penetration of smart meters outside Victoria (approximately 30%
    coverage) was consistently reported as a major barrier to residential demand flexibility
    across multiple ARENA-funded projects. The cost of site-by-site meter upgrades
    was not financially viable and the quality of installed smart meters was also
    limited — described by AGL as 'anything but smart by 2021 standards' due to once-daily
    data collection.
  lesson_learnt: Residential demand flexibility programs in jurisdictions outside
    Victoria should treat smart meter penetration as a binding constraint; programs
    should either target Victoria, design around metering limitations, or advocate
    for accelerated rollout as a precondition — upgrading meters site-by-site at project
    expense is not financially viable at scale.
