- record_id: ARENA-DLV-64113
  source_title: Summary of ARENA Funded Hydrogen R&D Projects
  publish_date: 2023-04
  project_name: RMIT – Hydrogen Storage and Transport
  what_happened: The RMIT proton flow reactor project achieved a round-trip efficiency
    of only 15% at prototype scale, with efficiency expected to improve to 57% only
    upon full scaling-up, highlighting a significant gap between prototype and scaled
    performance that must be resolved before commercialisation.
  lesson_learnt: Hydrogen storage projects using novel solid-state materials should
    explicitly characterise the performance gap between prototype and scaled operation
    before advancing to commercialisation discussions — a 15% round-trip efficiency
    at prototype scale is insufficient for commercial deployment and scale-up assumptions
    must be validated experimentally.
