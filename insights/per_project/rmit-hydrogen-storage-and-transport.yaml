  evidence_excerpt: The system achieved a three-fold increase in the gravimetric hydrogen
    storage capacity on the carbon-based material from 0.8 per cent by weight to 2.2
    per cent. This allowed for a round trip efficiency of 15 per cent to be achieved,
    which is expected to be increased to up to 57 per cent upon a full scaling-up
    of the system.
