- record_id: ARENA-DLV-3601
  source_title: Development of Novel Hydrogen Trapping Techniques for Breakthrough
    Si Casting & Wafering Technologies
  publish_date: 2019-06
  project_name: Development of Novel Hydrogen Trapping Techniques for Breakthrough
    Si Casting and Wafering Technologies
  what_happened: Hydrogen trapping processes alone were found to provide better passivation
    of grown-in defects in quasi-mono silicon than the anticipated combination of
    hydrogen trapping followed by advanced hydrogenation, achieving over 70% lifetime
    enhancement above conventional hydrogenation results.
  lesson_learnt: When developing hydrogen passivation processes for defected silicon,
    test trapping-only approaches before assuming a multi-step trapping-plus-hydrogenation
    sequence is required — a simpler single-step trapping process may outperform the
    combination and be better suited to high-throughput commercial implementation.
  issue_severity: minor
  project_type: manufacturing/supply chain
