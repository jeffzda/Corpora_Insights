- record_id: ARENA-DLV-3604
  source_title: Development of Novel Hydrogen Trapping Techniques for Breakthrough
    Si Casting & Wafering Technologies
  publish_date: 2019-06
  project_name: Development of Novel Hydrogen Trapping Techniques for Breakthrough
    Si Casting and Wafering Technologies
  what_happened: When hydrogen trapping processes developed on silicon wafers were
    applied to finished solar cells, hydrogen accumulated at the metal-silicon interface
    with increasing process time, causing high contact resistance and degrading fill
    factor after an optimal process duration.
  lesson_learnt: Processes validated at the wafer level must be re-optimised before
    application to finished cells — hydrogen accumulation at metal contacts is a distinct
    failure mode that does not appear in wafer-level testing; consider applying trapping
    processes prior to contact formation to avoid this issue entirely.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated integration
  intervention_note: Process application time was identified as the key control variable;
    investigation into applying trapping prior to cell contact formation was initiated
    as an alternative mitigation pathway.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id011
