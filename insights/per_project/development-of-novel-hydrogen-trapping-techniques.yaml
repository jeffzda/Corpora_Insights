  what_happened: During design and construction of a light soaking station, twin interlocked
    power connections were used to separately power LEDs and heater (to avoid delays
    in having 15A sockets installed) rather than a single isolation switch, which
    did not meet safety/standards requirements. A review by an external electrical
    engineer required rebuilding a large part of the control box.
  lesson_learnt: Address safety and electrical standards requirements at the design
    stage — standards issues discovered after construction required significant rework.
    Engage an external electrical engineer to review designs before build commences,
    not after.
