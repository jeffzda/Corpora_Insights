  what_happened: Across multiple tool builds, the team found that standardising hardware
    components and software modules (for thermal control, power supplies, motion control,
    etc.) significantly reduced build time and complexity, including enabling the
    same software to be reused across both a lab-based single-wafer tool and the prototype
