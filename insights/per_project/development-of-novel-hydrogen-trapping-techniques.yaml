- record_id: ARENA-DLV-3157
  source_title: Development of Novel Hydrogen Trapping Techniques Final Report
  publish_date: 2022-03
  project_name: Development of novel hydrogen trapping techniques for breakthrough
    Si casting and wafering technologies
  what_happened: The project identified that the commonly observed 'minority carrier
    trapping' artifact in quasi-steady-state photoconductance lifetime measurements
    on multicrystalline and cast-mono silicon wafers is caused at least in part by
    crystallographic defects acting as barriers to lateral eddy current flow — not
    necessarily by bulk defects or impurities as previously assumed. This was validated
    using microwave detected photoconductance decay (uPCD) measurements that do not
    rely on lateral eddy currents.
  lesson_learnt: When measuring effective lifetime of silicon wafers with crystallographic
    defects using eddy current techniques, high apparent lifetimes at low carrier
    densities should not automatically be attributed to bulk impurity traps — the
    artifact may be caused by crystallographic defect barriers to lateral current
    flow, and uPCD measurements should be used to distinguish between these mechanisms.
  issue_severity: moderate
  project_type: null
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: data & measurement
  intervention_note: Developed new methodology using spatially resolved dark conductance
    and photoconductance measurements combined with uPCD to identify and separate
    the crystallographic defect contribution to the trapping artifact.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id007
  - 10
  - 11
  evidence_excerpt: It is important to recognise that high apparent lifetimes measured
    using eddy current techniques may not necessarily be due to traps or specific
    impurities in a wafer. In wafers with crystallographic defects, the 'minority
    carrier trapping' artifact observed is at least in part due to the presence of
    the crystallographic defects and we have developed methodology to identify this.
  confidence_note: issue_severity set to moderate — the measurement misinterpretation,
    if uncorrected, would lead to incorrect optimisation decisions in hydrogen trapping
    experiments; the finding required dedicated experimental effort to resolve.
  source_url: https://arena.gov.au/knowledge-bank/development-of-novel-hydrogen-trapping-techniques-final-report/
