  publish_date: 2019-06
  project_name: Development of Novel Hydrogen Trapping Techniques for Breakthrough
    Si Casting and Wafering Technologies
  what_happened: Hydrogen trapping processes that improved silicon wafer quality were
    found to leave excess hydrogen in loosely bound states, causing subsequent degradation
    under light and heat (LeTID) that returned wafer quality to below pre-treatment
    levels.
  lesson_learnt: Hydrogen passivation processes must be evaluated not only for immediate
    improvement in carrier lifetime but also for stability under operating conditions
    — the conditions required for effective trapping and those required to prevent
    LeTID degradation are distinct and likely require a multi-step process approach.
  issue_severity: major
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
