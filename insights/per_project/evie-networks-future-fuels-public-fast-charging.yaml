  proponent_type: project developer
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: policy/market influence only
  secondary_failure_mode: commercial & market
  intervention_note: Evie encouraged industry participants to engage via the Electric
    Vehicle Council to raise the profile of tariff and technology issues with DNSPs,
    and committed to continued collaborative engagement with DNSPs.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: EV
  source_pages: &id002
  - 6
