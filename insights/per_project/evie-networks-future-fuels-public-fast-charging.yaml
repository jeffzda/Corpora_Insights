- record_id: ARENA-DLV-47351
  source_title: Evie Networks - Lessons Learnt Report - March 2023
  publish_date: 2023-03
  project_name: National Ultrafast EV Charging Infrastructure Network
  what_happened: Power connection timelines across multiple highway charging sites
    were extremely protracted, with individual sites taking between 10 months and
    nearly 3 years from initial connection application to energisation. Cameron Park
    NSW took from May 2020 to March 2023 (almost 3 years); Warrenheip VIC took from
    April 2020 to September 2022 (over 2 years); BP Northpoint VIC took from June
    2020 to June 2022 (2 years).
  lesson_learnt: Initiate DNSP connection inquiries as early as possible in site development
    — the 6–8 month information lag before receiving feasibility data, combined with
    augmentation costs up to $500,000, can render sites commercially unviable if not
    identified early. Advocate for nationally consistent DNSP connection standards
    to reduce site-by-site variability.
  issue_severity: major
  project_type: transport electrification
  project_scale_band: commercial expansion
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: grid connection/system studies
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: coordination & stakeholders
  intervention_note: Evie Networks investigated battery and solar options to reduce
    the need for grid connection upgrades, and began engaging with distribution networks
    earlier in planning stages.
  transferability: broad
  delay_magnitude: 3-12 months
  technology_domain: EV
  source_pages:
  - 5
  evidence_excerpt: The power connection process can take more than 6 -8 months from
    initial inquiry to receive the necessary information to inform technical feasibility
    and commercial viability of building infrastructure at the location. These delays
    not only adversely impact the rollout of the chargers, but are also very costly.
    An application could cost up to $30,000 depending on level of assessment work
    required. Additionally upfront expenditure on augmentation of a site once design
    standards and requirements from the DNSP are received can total up to $500,000
    for high power connections.
