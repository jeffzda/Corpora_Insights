  failure_mode: regulatory & approvals
  outcome_class: partial success
  secondary_failure_mode: coordination & stakeholders
  intervention_note: Evie identified the tariff mismatch through detailed cost analysis
    and engaged with Ausgrid on tariff assignment; the report flags this as an ongoing
    challenge without a confirmed resolution by the report date.
  transferability: broad
  delay_magnitude: null
  technology_domain: EV
  source_pages:
  - 5
  - 6
