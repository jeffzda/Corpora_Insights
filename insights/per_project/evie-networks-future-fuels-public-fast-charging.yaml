- record_id: ARENA-DLV-36968
  source_title: Insights from ARENA's Public Charging Projects
  publish_date: 2024-06
  project_name: Evie Networks Future Fuels Public Fast Charging
  what_happened: Evie discovered that a material number of customers were deliberately
    triggering payment declines after energy had already been delivered to their EVs
    — a form of energy theft — reaching an unsustainably high level that threatened
    the commercial viability of their public charging operations.
  lesson_sarnt: Implement a pre-authorisation (funds hold) system before deploying
    pay-as-you-go EV charging commercially — without it, deliberate payment fraud
    by customers can reach levels that threaten business viability; accompany the
    system with a customer education program to prevent confusion between the hold
    and an actual charge.
  lesson_learnt: Implement a pre-authorisation (funds hold) system before deploying
    pay-as-you-go EV charging commercially — without it, deliberate payment fraud
    by customers can reach levels that threaten business viability; accompany the
    system with a customer education program to prevent confusion between the hold
    and an actual charge.
