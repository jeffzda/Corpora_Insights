- record_id: ARENA-DLV-17601
  source_title: Evie Networks Future Fuels Fast Charging Lessons Learnt 1
  publish_date: 2022-05
  project_name: Evie Networks Future Fuels Public Fast Charging
  what_happened: Evie Networks observed that utilisation of its public fast charging
    network tracked linearly with EV uptake, meaning that slowing EV supply to Australia
    — due to international supply chain issues and manufacturers directing vehicles
    to other markets — directly suppressed charging network utilisation. Compounding
    this was accelerating deployment of competing charging infrastructure from multiple
    operators.
  lesson_learnt: EV charging network infrastructure should be designed with future-proofing
    from the outset — including sufficient civil and grid connection capacity for
    expansion — as demand growth rates of doubling every 4–5 months can quickly exhaust
    initial capacity at high-traffic sites, while remote regional sites will remain
    underutilised for extended periods and should be sized conservatively at first.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: commercial expansion
  lifecycle_phase: operations
  proponent_type: project developer
  delay_category: null
  failure_mode: commercial & market
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Evie Networks upgraded the Sutton Forest site by adding charging
    heads to double capacity in response to high utilisation; many sites were pre-designed
    with infrastructure to support expansion up to six chargers.
  transferability: broad
  delay_magnitude: null
  technology_domain: EV
  source_pages:
  - 4
  evidence_excerpt: The risk for charging network operators is that vehicle supply
    to Australia slows due to international supply chain issues, with auto manufacturers
    directing vehicle sales to other markets, placing pressure on network utilisation.
    Compounding this will be the increased rate of charging infrastructure deployment
    from multiple operators. Charging network operators will need to carefully monitor
    market conditions to avoid investing too far ahead of demand.
