  source_title: Evie Networks Future Fuels Fast Charging Lessons Learnt 1
  publish_date: 2022-05
  project_name: Evie Networks Future Fuels Public Fast Charging
  what_happened: Wholesale electricity prices in Australia approximately doubled in
    2022 (as illustrated by the NSW CAL23 flat swap rate), adding approximately $0.06/kWh
    to electricity costs in NSW and more in Queensland. These cost increases were
    beginning to flow through to commercial and industrial contracts and threatened
    to further raise the price of public fast charging to consumers.
  lesson_learnt: Public fast charging operators face material exposure to wholesale
    electricity price volatility and must proactively decide whether to hedge, absorb,
    or pass through cost increases — failure to plan for wholesale price risk can
    erode the commercial viability of charging networks and deter EV adoption.
