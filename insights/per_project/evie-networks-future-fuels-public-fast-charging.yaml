- record_id: ARENA-DLV-36961
  source_title: Insights from ARENA's Public Charging Projects
  publish_date: 2024-06
  project_name: Evie Networks Future Fuels Public Fast Charging
  what_happened: Repair scheduling and duration for charging equipment were affected
    not only by skilled maintenance crew availability but also by unpredictable supply
    chain availability of specialised spare parts. Evie deployed a backup power resilience
    system that maintained communication and control of chargers during outages, materially
    reducing the number and duration of outages.
  lesson_learnt: Invest in remote monitoring and backup communication resilience systems
    at the outset — maintaining charger connectivity during power events enables faster
    remote diagnosis and resolution, reducing outage frequency and duration without
    requiring physical site attendance; also stockpile key spare parts to reduce dependence
    on volatile supply chains.
