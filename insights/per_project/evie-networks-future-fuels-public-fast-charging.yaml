- record_id: ARENA-DLV-47352
  source_title: Evie Networks - Lessons Learnt Report - March 2023
  publish_date: 2023-03
  project_name: National Ultrafast EV Charging Infrastructure Network
  what_happened: DNSP tariff structures featuring Demand or Capacity charges were
    found to be commercially unviable for public EV fast charging infrastructure due
    to the technology's intermittent, high-peak load profile. Once sites exceed utilisation
    thresholds (e.g. 40 MWh/year for Ausgrid, 160 MWh/year for some NSW DNSPs), network
    charges rise to represent 73% of total electricity cost, pushing estimated cost
    to 61c/kWh ex-GST — a level that would require high retail prices that undermine
    EV affordability.
  lesson_learnt: Project developers planning public fast charging infrastructure should
    account for the structural mismatch between DNSP demand/capacity tariff thresholds
    and the low-utilisation ramp-up profile of new charging sites — tariff transition
    points can sharply increase operating costs and threaten commercial viability
    before demand matures. Engagement with DNSPs and regulators to establish technology-specific
    tariffs should be pursued as part of the commercial model.
  issue_severity: major
  project_type: transport electrification
  project_scale_band: commercial expansion
  lifecycle_phase: operations
  proponent_type: project developer
  delay_category: approvals/regulatory
  failure_mode: commercial & market
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: regulatory & approvals
  intervention_note: Evie Networks is working via the Electric Vehicle Council to
    reach industry consensus on an approach to address structural tariff issues, aiming
    for technology-specific or customer-specific tariffs for publicly available EV
    charging sites.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: EV
  source_pages:
  - 5
  - 6
  evidence_excerpt: DNSP tariff structures with Demand or Capacity charges are not
    appropriate for the fledging EV Charging Infrastructure Industry given its very
    different load profile relative to 'traditional' businesses and low usage levels
    at this stage of the industry's development... At this time, 73% of electricity
    cost is made up from network charges and the cost of electricity is estimated
    to be 61c ex GST.
  confidence_note: secondary_failure_mode set to regulatory misfit as the tariff structure
    is a regulatory design issue independently driving the commercial failure risk.
