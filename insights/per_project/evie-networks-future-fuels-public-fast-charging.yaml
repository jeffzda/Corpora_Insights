- record_id: ARENA-DLV-6203
  source_title: Evie Networks Future Fuels Fast Charging Lessons Learnt 2
  publish_date: 2022-10
  project_name: Evie Networks Future Fuels Public Fast Charging
  what_happened: Public fast EV charging on the Evie network was observed to peak
    consistently during midday solar generation hours, demonstrating potential for
    EV chargers to act as a 'solar soak' and support network management. However,
    DNSP tariff structures — notably Ausgrid's capacity charge thresholds — were found
    to impose barriers to public charging investment rather than incentivising it.
  lesson_learnt: EV charging network developers should engage regulators and industry
    groups proactively to address DNSP tariff barriers, particularly capacity charge
    structures that front-load costs. The midday solar-alignment of public charging
    is a commercially and technically valuable network attribute that should be quantified
    and presented to DNSPs as evidence in tariff reform discussions.
