  evidence_excerpt: in Ausgrid's recent draft plan for 2024-2029, Ausgrid acknowledges
    the barriers that its tariff structures and processes create but does not address
    the barriers in a way that will provide any tangible benefit... without effective
    actions from networks and/or regulatory support, significant barriers to investment
    will remain in the areas covered by those networks.
  confidence_note: secondary_failure_mode commercial/demand failure applied because
