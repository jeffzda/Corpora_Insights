- record_id: ARENA-DLV-36976
  source_title: Insights from ARENA's Public Charging Projects
  publish_date: 2024-06
  project_name: Evie Networks Future Fuels Public Fast Charging
  what_happened: Public perception of lithium-ion battery fires (driven largely by
    incidents involving cheaper products such as e-scooters) negatively affected perceptions
    of EV charging as a fire hazard despite limited supporting evidence. Fire authorities
    designated EVs as a 'special hazard' requiring additional structural and fire
    protection measures; some insurers began charging building premiums, discouraging
    site hosts from accepting EV charging installations. Fire Rescue NSW recommended
    outdoor-only EV charging, which would severely restrict potential site locations.
  lesson_learnt: Address EV fire safety perception proactively with site hosts and
    insurers before signing lease agreements — regulatory positions from fire authorities
    and insurer premium loading based on perceived (rather than evidenced) risk can
    materially increase site development costs and restrict site options; engage fire
    authorities and insurers early to obtain specific guidance and cost certainty.
  issue_severity: major
  project_type: transport electrification
  project_scale_band: commercial expansion
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: stakeholder/land/community
  failure_mode: regulatory & approvals
  outcome_class: partial success
  secondary_failure_mode: coordination & stakeholders
  intervention_note: Evie advocated for a coordinated government and CPO effort to
    provide greater certainty to site hosts about EV safety and minimise additional
    building costs.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: EV
  source_pages: &id007
  - 28
  evidence_excerpt: Some of Evie's site hosts flagged that insurers are charging premiums
    for buildings that will house EVs (citing the safety risks), which is discouraging
    site owners from hosting EV chargers... Fire Rescue NSW endorses AFAC's view,
    going further to say that EV charging should be outdoor only – which would severely
    impact EV charging by limiting potential sites.
