  source_title: Insights from ARENA's Public Charging Projects
  publish_date: 2024-06
  project_name: Evie Networks Future Fuels Public Fast Charging
  what_happened: Evie found that subsidised charging sites nearby their unsubsidised
    sites reduced demand at those unsubsidised sites to one-fifth of normal levels
    and generated a disproportionate share of price complaints. Evie argued that subsidised
    pricing sets unrealistic consumer expectations about the true cost of charging
    and that public charging accounts for only 5–10% of total EV charging, making
    subsidised public charging an ineffective driver of overall EV uptake.
  lesson_learnt: Subsidised public charging undermines the commercial viability of
    nearby unsubsidised operators and distorts consumer price expectations — where
    subsidies are used, accompany them with clear explanations of the true cost of
    service to avoid permanent distortion of market pricing norms.
