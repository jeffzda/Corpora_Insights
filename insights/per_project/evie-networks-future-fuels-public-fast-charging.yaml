- record_id: ARENA-DLV-17602
  source_title: Evie Networks Future Fuels Fast Charging Lessons Learnt 1
  publish_date: 2022-05
  project_name: Evie Networks Future Fuels Public Fast Charging
  what_happened: Ausgrid assigned Evie's fast charging sites in Sydney to tariff EA302
    (a medium business commercial and industrial tariff) rather than the requested
    small business time-of-use tariff EA225, resulting in network charges of $861
    per month for a site consuming less than 25 MWh annually. Ausgrid charges constituted
    72% of total electricity costs at $0.46/kWh, producing a total electricity cost
    of $0.63/kWh, with estimated overpayment of approximately $8,700 in the first
    twelve months.
  lesson_learnt: Engage proactively with DNSPs to challenge default tariff assignments
    for EV charging sites — demand tariffs based on long-run marginal costs are likely
    to overstate costs for low-utilisation chargers whose peaks do not coincide with
    network peaks, and cost-reflective tariff design is critical to the commercial
    viability of public charging.
  issue_severity: major
  project_type: transport electrification
