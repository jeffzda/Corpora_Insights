  - 22
  evidence_excerpt: 'Tariff EA302 (a medium business commercial and industrial style
    tariff) was applied despite Evie requesting tariff EA225 (small business time
    of use). The impact is that: Evie is paying $861 to Ausgrid in network charges
    in one month for a site that consumes <25MWh annually. 72% of electricity costs
    for the site are Ausgrid network charges… Evie calculates the overpayment to Ausgrid
    in the first twelve months as approximately $8700.'
