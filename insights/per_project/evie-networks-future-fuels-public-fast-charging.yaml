  source_title: Evie Networks Future Fuels Fast Charging Lessons Learnt 2
  publish_date: 2022-10
  project_name: Evie Networks Future Fuels Public Fast Charging
  what_happened: CCS2 charging sessions grew by nearly 50% over six months while CHAdeMO
    grew by less than 10%, reflecting the rapid shift in EV sales toward CCS2-equipped
    vehicles. By October 2022, only 28 of 158 planned fast charging stations had been
    commissioned.
  lesson_learnt: Infrastructure planners should weight connector-type investment heavily
    toward CCS2 rather than CHAdeMO — the relative share of CHAdeMO sessions is declining
    structurally as CCS2 vehicles dominate new sales, and this trend is expected to
    continue. Avoid over-provisioning CHAdeMO ports at new sites.
