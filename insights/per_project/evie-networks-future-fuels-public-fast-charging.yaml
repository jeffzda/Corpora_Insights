- record_id: ARENA-DLV-61403
  source_title: Future Fuels Public Fast Charging - Lessons Learnt Report May 2024
  publish_date: 2024-05
  project_name: Evie Networks Future Fuels Public Fast Charging
  what_happened: Fire agency guidance and insurer responses — treating EVs as a 'special
    hazard' and recommending outdoor-only charging or costly fire protection systems
    — created significant barriers to deploying fast charging at indoor or multi-storey
    sites, adding cost and complexity and deterring site hosts.
  lesson_learnt: EV charging project developers should proactively engage site hosts
    and their insurers with verified fire-risk data and industry statistics before
    site agreements are finalised, and should advocate through government and industry
    bodies for evidence-based regulatory guidance to prevent non-data-driven fire
    authority recommendations from blocking deployment.
  issue_severity: major
  project_type: transport electrification
  project_scale_band: commercial expansion
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: partial success
  secondary_failure_mode: coordination & stakeholders
  intervention_note: Evie attended meetings directly with site host insurers to present
    safety data and statistics demonstrating lower EV fire frequency compared to ICE
    vehicles, and engaged with the EVFireSafe project to access verified fire incident
    data.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: EV
  source_pages: &id009
  - 6
  - 7
  evidence_excerpt: On several occasions, Site hosts have indicated that their insurer
    has informed them that adding EV charging to their buildings will incur increased
    premiums due to the increased risk associated with EVs and EV charging... It is
    clear that the EV industry needs a coordinated approach, with assistance from
    Government, to provide certainty to site hosts and to contain build costs.
  confidence_note: secondary_failure_mode of governance/coordination failure applied
    because fire authorities are characterising their guidance as regulations without
    regulatory authority, creating a coordination gap between agencies.
