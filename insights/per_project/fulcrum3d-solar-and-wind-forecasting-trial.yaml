  publish_date: '2019-06-25'
  project_name: Fulcrum3D Solar and Wind Forecasting Trial
  what_happened: ARENA-funded Fulcrum3D trials installing CloudCAMs and SODARs on
    solar and wind farms found that managing large volumes of data through the API
    and modelling the plant were significant technical challenges, though ultimately
    rewarding.
  lesson_learnt: When designing self-forecasting trials for renewable generators,
    plan explicitly for data pipeline and API management complexity — the volume and
    variety of data from meteorological sensors and plant models can become a material
    technical challenge that requires dedicated engineering resources to resolve.
