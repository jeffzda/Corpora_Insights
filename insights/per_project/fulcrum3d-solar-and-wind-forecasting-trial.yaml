  publish_date: '2019-06-25'
  project_name: Fulcrum3D Solar and Wind Forecasting Trial
  what_happened: The Fulcrum3D trial found that project partner relationships were
    a critical success factor in progressing the forecasting trials to their current
    stage.
  lesson_learnt: Secure committed project partner relationships before commencing
    technology trials at third-party renewable energy sites — partner cooperation
    is the primary enabler for data access, equipment installation, and trial progression,
    and its absence is a key risk to schedule and outcomes.
