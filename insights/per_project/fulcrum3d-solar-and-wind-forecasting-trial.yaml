- record_id: ARENA-DLV-1323
  source_title: ARENA Insights Forum Presentation Summaries & Key Points – Large-Scale
    Projects Stream
  publish_date: '2019-06-25'
  project_name: Fulcrum3D Solar and Wind Forecasting Trial
  what_happened: Early results from the Fulcrum3D CloudCAM trial indicated that a
    single CloudCAM unit could pay itself off within one year from savings in the
    Causer Pays factor, and could also improve diesel generator efficiency, diesel
    savings and battery round-trip efficiency in off-grid systems.
  lesson_learnt: CloudCAM solar forecasting technology appears to offer a short payback
    period through Causer Pays cost reductions — project developers and operators
    of semi-scheduled solar generators should evaluate the business case for self-forecasting
    devices as part of their O&M and revenue optimisation strategy.
