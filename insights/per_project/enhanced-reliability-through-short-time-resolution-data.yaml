  what_happened: The project found that the optimal voltage and frequency trigger
    thresholds for automatic 5-second data extraction had not been finalised by project
    completion, with the current settings generating alerts primarily from localised
    network issues rather than systemically significant disturbances, requiring further
    calibration work.
  lesson_learnt: Automated disturbance-detection trigger settings for DPV monitoring
    systems require iterative calibration against a library of real events to distinguish
    locally significant from systemically significant disturbances — projects should
    budget for a dedicated trigger-tuning phase using historical event data before
    the detection system is considered operational.
