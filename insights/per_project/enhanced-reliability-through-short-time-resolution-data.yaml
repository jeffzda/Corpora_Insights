- record_id: ARENA-DLV-29451
  source_title: 'Solar Analytics – Enhanced Reliability through Short Term Resolution
    Data around Voltage Disturbances: Project Results and Lessons Learnt'
  publish_date: 2021-03
  project_name: Enhanced Reliability through Short Term Resolution Data around Voltage
    Disturbances
  what_happened: Analysis of Solar Analytics DPV monitoring data shared with AEMO
    revealed extensive disconnection of distributed PV systems in response to voltage
    disturbances across the NEM, increasing contingency sizes and necessitating market
    interventions including tightened network constraints and increased frequency
    reserves.
  lesson_learnt: Fleet-level DPV monitoring data shared with system operators can
    reveal systemic compliance failures invisible to individual site monitoring —
    projects should plan for data sharing with AEMO from the outset to enable timely
    system model updates and regulatory responses.
  issue_severity: major
