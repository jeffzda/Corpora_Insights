- record_id: ARENA-DLV-29453
  source_title: 'Solar Analytics – Enhanced Reliability through Short Term Resolution
    Data around Voltage Disturbances: Project Results and Lessons Learnt'
  publish_date: 2021-03
  project_name: Enhanced Reliability through Short Term Resolution Data around Voltage
    Disturbances
  what_happened: The project demonstrated that data collected at 60-second intervals
    was insufficient to capture the duration of DPV disconnection events (which require
    5-second resolution) or the minimum voltage experienced during voltage sags (which
    have typical durations of 100–300ms and require sub-second resolution), limiting
    the analytical conclusions that could be drawn.
  lesson_learnt: Future DPV monitoring projects should specify data resolution requirements
    based on the physical timescales of the phenomena being studied — 5-second intervals
    are the minimum needed to confirm reconnection duration compliance, and 250ms
    or finer intervals are needed to capture voltage sag depth during disturbances.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: null
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: A subset of 1,000 devices was reconfigured to 5-second reporting
    from September 2020 to March 2021 to enable AEMO deeper analysis while new firmware
    capabilities were being developed.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id003
  - 13
  - 14
  - 15
  evidence_excerpt: Voltage sags have typical durations of 100-300ms, and are therefore
    unlikely to be captured by Wattwatchers devices measuring at 5s intervals. This
    means that it is not possible to measure the minimum voltage experienced by the
    solar inverter in the distribution network.
  confidence_note: null
