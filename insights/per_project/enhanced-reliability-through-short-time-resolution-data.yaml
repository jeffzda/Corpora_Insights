  outcome_class: policy/market influence only
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: AEMO used the shared disturbance datasets to update system models,
    impose new Heywood Interconnector constraints, incorporate a new voltage ride-through
    test into DER technical standards, and engage inverter manufacturers to review
    fielded settings.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
