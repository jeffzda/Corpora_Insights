  source_title: 'Solar Analytics – Enhanced Reliability through Short Term Resolution
    Data around Voltage Disturbances: Project Results and Lessons Learnt'
  publish_date: 2021-03
  project_name: Enhanced Reliability through Short Term Resolution Data around Voltage
    Disturbances
  what_happened: A voltage measurement firmware upgrade was deployed that replaced
    single instantaneous end-of-interval voltage samples with min, max and mean values
    calculated from 250ms sub-samples within each 5-second or 60-second reporting
    interval, improving detection of short-duration voltage excursions that were previously
    invisible to the monitoring system.
  lesson_learnt: DPV monitoring devices should be specified to record statistical
    summaries (min/max/mean) of voltage based on sub-second sampling even when reporting
    intervals are long — instantaneous end-of-period voltage snapshots will systematically
    miss short-duration disturbances relevant to inverter protection compliance.
