  what_happened: A firmware upgrade was successfully developed and deployed over-the-air
    to the existing fielded fleet of Wattwatchers monitoring devices, introducing
    a 10-minute rolling buffer of 5-second full-attribute data that could be extracted
    retrospectively after a disturbance was detected, without requiring permanent
    high-resolution reporting.
  lesson_learnt: Designing monitoring hardware and firmware with on-board ring-buffer
    architectures and over-the-air update capability enables cost-effective retrospective
    retrieval of high-resolution data around rare but critical events — this approach
    should be specified in future DER monitoring hardware procurement.
