  what_happened: The automated disturbance-detection and 5-second data extraction
    system became functional in October 2020, but no significant grid disturbances
    involving PV occurred between October 2020 and project completion in March 2021,
    meaning the system's performance under real high-impact conditions was not fully
    validated during the project period.
