  what_happened: The project found that analysis of DPV behaviour was limited to the
    NEM, with Tasmania providing insufficient data due to its non-synchronised status,
    and no equivalent disturbance analysis had been conducted in the South-West Interconnected
    System in Western Australia.
  lesson_learnt: Future DPV disturbance monitoring programs should prioritise geographic
    coverage in non-synchronised and islanded networks (such as Tasmania and SWIS)
    where frequency stability is lower and DPV response is potentially more consequential
    — dataset gaps in these regions represent the highest residual system risk.
