  publish_date: 2021-03
  project_name: Enhanced Reliability through Short Term Resolution Data around Voltage
    Disturbances
  what_happened: Continuous 5-second data reporting across a fleet of over 20,000
    devices was estimated to cost approximately $1 per device per month more than
    60-second reporting, making permanent high-resolution monitoring financially unsustainable
    at full fleet scale.
  lesson_learnt: Monitoring projects with large device fleets must design tiered data-resolution
    strategies from the outset — continuous high-resolution reporting is cost-prohibitive
    at scale, so firmware architectures should default to low-resolution with triggered
    high-resolution capture around events of interest.
