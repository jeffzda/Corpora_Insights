- record_id: ARENA-DLV-29452
  source_title: 'Solar Analytics – Enhanced Reliability through Short Term Resolution
    Data around Voltage Disturbances: Project Results and Lessons Learnt'
  publish_date: 2021-03
  project_name: Enhanced Reliability through Short Term Resolution Data around Voltage
    Disturbances
  what_happened: Approximately 35% of distributed PV systems installed under the 2015
    standard failed to deliver the over-frequency droop response required by AS/NZS
    4777.2:2015 during the Victoria and South Australia separation event on 31 January
    2020, instead remaining at pre-disturbance output levels.
  lesson_learnt: Field compliance with inverter grid-protection standards cannot be
    assumed from certification alone — systematic monitoring of fielded DPV fleets
    during actual grid disturbances is required to identify widespread non-conformance
    and trigger corrective action with manufacturers and regulators.
