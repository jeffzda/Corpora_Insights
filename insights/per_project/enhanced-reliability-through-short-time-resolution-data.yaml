- record_id: ARENA-DLV-29457
  source_title: 'Solar Analytics – Enhanced Reliability through Short Term Resolution
    Data around Voltage Disturbances: Project Results and Lessons Learnt'
  publish_date: 2021-03
  project_name: Enhanced Reliability through Short Term Resolution Data around Voltage
    Disturbances
  what_happened: During a minor frequency disturbance on 2 February 2021, simultaneous
    extraction of 5-second buffered data from up to 2,000 devices per NEM region placed
    significant strain on Solar Analytics servers, and NSW data capture was substantially
    lower than expected (40–60% of devices), attributed to server processing queuing
    from a preceding voltage event six minutes earlier.
  lesson_learnt: Large-scale simultaneous data extraction triggered by grid disturbances
    can overwhelm back-end infrastructure — projects operating distributed monitoring
    fleets must stress-test server capacity for concurrent multi-region extraction
    scenarios and implement worker-scaling or rate-limiting before going to full fleet
    scale.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: null
  failure_mode: unvalidated integration
  outcome_class: re-scoped/adapted
  secondary_failure_mode: execution & logistics
  intervention_note: The maximum extraction limit was capped at 2,000 devices per
    region during testing, and the number of server workers was increased; full capacity
    lifting was deferred pending confirmation of 100% reporting reliability at the
    capped limit.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id007
  - 22
  - 24
  - 25
  evidence_excerpt: This can put great strain on the Solar Analytics servers and an
    increase in the number of workers was required to extract data all the data. Limitations
    on numbers were made in order to test operation in small volumes before increasing.
    The limitation is currently set to 2000 devices per region.
