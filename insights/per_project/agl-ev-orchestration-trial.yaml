- record_id: ARENA-DLV-29554
  source_title: DEIP - DEIP Dive - Event Summary 2023
  publish_date: 2023-07
  project_name: AGL EV Orchestration Trial
  what_happened: The AGL EV Orchestration Trial revealed systematic differences in
    charging behaviour across multiple consumer segments — weekday vs. weekend, households
    with and without PV, regional vs. urban, and more vs. less expensive vehicles
    — indicating that a single smart charging model does not capture real-world diversity.
  lesson_learnt: Smart charging trial design should stratify participant cohorts by
    key variables (PV ownership, geography, vehicle tier) and analyse results by segment;
    a single aggregate result will mask behavioural heterogeneity that is critical
    for designing commercially viable smart charging products.
  issue_severity: minor
  project_type: DER/customer-side
