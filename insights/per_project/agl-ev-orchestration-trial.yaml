- record_id: ARENA-DLV-29553
  source_title: DEIP - DEIP Dive - Event Summary 2023
  publish_date: 2023-07
  project_name: AGL EV Orchestration Trial
  what_happened: The AGL EV Orchestration Trial demonstrated strong consumer acceptance
    of smart charging, with 84% of participants satisfied and willing to participate
    again; however, early adopters were so highly engaged that communication staff
    had to increase their contact with participants beyond planned levels.
  lesson_learnt: Smart charging trials should plan for elevated communication demands
    from highly engaged early-adopter participants — resourcing for participant communication
    should be scaled to the engagement intensity of the cohort, not just headcount.
