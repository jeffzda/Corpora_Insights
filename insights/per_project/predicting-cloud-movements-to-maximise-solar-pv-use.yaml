- record_id: ARENA-DLV-67906
  source_title: Fulcrum 3D CloudCAM Final Report
  publish_date: 2016-11
  project_name: Cloud detection and prediction for maximising solar PV utilisation
    in off-grid hybrid power systems (CloudCAM)
  what_happened: For off-grid high-penetration solar PV sites without CloudCAM, operators
    were forced to curtail solar output when battery state-of-charge was low, to ensure
    any cloud event would not cause sudden unacceptable PV output drops. CloudCAM's
    short-term prediction allowed the site to operate at full PV output regardless
    of battery state, because operators had confidence no cloud shadow would occur
    in the next 2–5 minutes.
  lesson_learnt: Short-term cloud prediction (2–5 minutes) can eliminate the need
    for output curtailment at off-grid high-penetration solar PV sites when batteries
    are not fully charged, directly increasing yield — this operational benefit should
    be quantified and included in business cases for cloud prediction systems at remote
    hybrid sites.
