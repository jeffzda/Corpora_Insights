  source_title: Fulcrum 3D CloudCAM Final Report
  publish_date: 2016-11
  project_name: Cloud detection and prediction for maximising solar PV utilisation
    in off-grid hybrid power systems (CloudCAM)
  what_happened: The CloudCAM optical system was successfully trialled at Epuron solar
    power stations in the Northern Territory and integrated into solar control systems
    in early 2016, delivering measurable increases in PV yield and reductions in battery
    cycling — outcomes that exceeded initial expectations for the optical system and
    led to the first commercial third-party sale in August 2016.
  lesson_learnt: A well-developed optical sky camera system with high-resolution fisheye
    lens and robust cloud detection software can deliver commercially useful short-term
    PV output prediction for off-grid high-penetration hybrid solar sites without
    requiring advanced sensor augmentation — do not underestimate the standalone commercial
    value of a simpler optical system while pursuing a more technically ambitious
    parallel development.
