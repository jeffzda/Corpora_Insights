- record_id: ARENA-DLV-67903
  source_title: Fulcrum 3D CloudCAM Final Report
  publish_date: 2016-11
  project_name: Cloud detection and prediction for maximising solar PV utilisation
    in off-grid hybrid power systems (CloudCAM)
  what_happened: The project's original design target was cloud shadow prediction
    10–20 minutes ahead of time. Through engagement with utilities and solar farm
    operators during the project, the team discovered that remote area hybrid grids
    require only 2–5 minutes lead time (enough to start a diesel generator or pre-emptively
    ramp PV), making the longer prediction window largely redundant in the current
    Australian market.
  lesson_learnt: For off-grid hybrid solar PV projects, validate the required forecasting
    lead time with actual grid operators and utilities before locking in system design
    — the operational requirement (2–5 minutes to start a diesel generator) may be
    far shorter than the technically ambitious target, fundamentally changing the
    system's scope and accuracy requirements.
