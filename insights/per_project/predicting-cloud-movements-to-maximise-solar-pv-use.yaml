  project_name: Cloud detection and prediction for maximising solar PV utilisation
    in off-grid hybrid power systems (CloudCAM)
  what_happened: Clouds within 5 degrees of the horizon were initially not accurately
    detected due to low spatial resolution at the horizon and the whiter sky appearance
    at low angles caused by aerosol light scattering, resulting in additional false
    negatives in the cloud detection algorithm.
  lesson_learnt: Sky imaging cloud detection algorithms must include a dedicated near-horizon
    filter accounting for increased air mass and aerosol scattering effects that whiten
    the sky at low angles — treating horizon sky the same as mid-sky sky will produce
    systematic under-detection of low clouds.
