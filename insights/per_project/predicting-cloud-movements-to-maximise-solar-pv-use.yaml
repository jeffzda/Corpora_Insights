  project_name: Cloud detection and prediction for maximising solar PV utilisation
    in off-grid hybrid power systems (CloudCAM)
  what_happened: The cloud detection and prediction software was developed to operate
    independently of the CloudCAM hardware, meaning it could run on third-party hardware,
    function in remote areas without server access, and be deployed remotely to existing
    installed units — a design decision that broadened the commercial applicability
    of the software beyond the original hardware platform.
  lesson_learnt: Decoupling prediction software from proprietary hardware from the
    outset broadens commercial applicability and enables remote software updates to
    deployed units — for forecasting and monitoring products in remote energy applications,
    hardware-independent software architecture should be a deliberate design requirement.
