  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Developed a solar flare filter algorithm applied to each image
    that tracks the sun position using calibration data and applies a more precise
    detection threshold near the sun, treating clear sky near the sun as sharp white
    rather than cloud.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
