- record_id: ARENA-DLV-67901
  source_title: Fulcrum 3D CloudCAM Final Report
  publish_date: 2016-11
  project_name: Cloud detection and prediction for maximising solar PV utilisation
    in off-grid hybrid power systems (CloudCAM)
  what_happened: Solar glare from the fisheye lens was initially misinterpreted as
    cloud by the binary cloud detection algorithm, creating false positives in cloud
    detection and inaccurate shadow placement predictions. This problem had been underestimated
    at project conception.
  lesson_learnt: Sky imaging systems for cloud detection must account for solar flare
    from the outset — glare near the sun can be misidentified as cloud, undermining
    prediction accuracy. A dedicated solar flare filter algorithm that tracks sun
    position and applies precise near-sun detection logic should be designed in before
    field deployment, not retrofitted.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
