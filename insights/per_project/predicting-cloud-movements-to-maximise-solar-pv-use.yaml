- record_id: ARENA-DLV-67904
  source_title: Fulcrum 3D CloudCAM Final Report
  publish_date: 2016-11
  project_name: Cloud detection and prediction for maximising solar PV utilisation
    in off-grid hybrid power systems (CloudCAM)
  what_happened: The CloudCAM Advanced system, which aimed to determine cloud heights
    using novel sensors, did not reach the expected pilot-scale demonstration outcome
    within the project timeframe. No commercially available sensor met the resolution
    requirements at a cost-effective price, requiring Fulcrum3D to design and build
    custom hardware. Continual technical difficulties persisted to project close,
    compounded by time and commercial constraints.
  lesson_learnt: When a project depends on novel sensing hardware not yet available
    on the commercial market, the R&D timeline and budget should explicitly account
    for iterative sensor selection, custom hardware fabrication, and the risk that
    solving known problems will reveal further unknown ones — underestimating this
    compound risk is a recurring cause of FOAK technology projects not reaching their
    target demonstration stage.
