  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: null
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Refocused the software development from 15–20 minute forecasting
    to 2–5 minute short-term prediction after meetings with utilities and project
    developers confirmed the shorter timeframe was what the market needed; satellite
    imagery integration was also dropped as it offered no benefit at this timescale.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id003
