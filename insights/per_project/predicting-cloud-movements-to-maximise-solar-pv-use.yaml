- record_id: ARENA-DLV-67908
  source_title: Fulcrum 3D CloudCAM Final Report
  publish_date: 2016-11
  project_name: Cloud detection and prediction for maximising solar PV utilisation
    in off-grid hybrid power systems (CloudCAM)
  what_happened: Australia had very few grid-connected large-scale solar plants at
    the time of the project, meaning there was no existing domestic market for the
    30-minute ahead prediction needed for scheduling and bidding in the NEM. The project's
    forecasting capability was therefore designed for and validated against remote
    hybrid grid use cases only.
  lesson_learnt: When developing solar PV forecasting technology, distinguish clearly
    between the off-grid hybrid grid use case (2–5 minute lead time for generator
    dispatch) and the grid-connected large-scale market (30-minute lead time for scheduling/bidding)
    — these are fundamentally different product requirements, and a system optimised
    for one may need significant re-development to serve the other.
