  evidence_excerpt: Many of the challenges faced in the experimental phase related
    to managing the solar thermal plant to achieve the process conditions of an existing
    PCC process. Conventional PCC processes have been developed with the view to integrating
    with the steam cycle of the power plant and have thus been constrained to a narrow
    set of process parameters defined by the steam temperatures and pressures available
    from the power plant.
  confidence_note: issue_severity set to moderate — the design assumption mismatch
    constrained experimental outcomes but the pilot was completed and knowledge was
    generated.
