- record_id: ARENA-DLV-70301
  source_title: Hybridisation of Concentrated Solar Thermal with Carbon Capture and
    Storage
  publish_date: 2015-03
  project_name: Evaluation of hybridisation of concentrated solar thermal technology
    with carbon capture and storage project
  what_happened: During the experimental phase, the pilot plant was designed to integrate
    solar thermal energy with an existing PCC process engineered for steam-cycle conditions.
    The solar plant's capability to produce a broad range of temperature and pressure
    profiles could not be exploited because the PCC process was constrained to a narrow
    set of parameters defined by the power plant steam cycle.
  lesson_learnt: When integrating solar thermal energy with CCS, develop a PCC process
    matched to the characteristics of the solar energy system rather than forcing
    the solar plant to meet legacy steam-cycle constraints — doing so opens opportunities
    for novel capture processes and avoids sub-optimal integration.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: pilot
  lifecycle_phase: development/design
  proponent_type: research organisation/university
