- record_id: ARENA-DLV-70303
  source_title: Hybridisation of Concentrated Solar Thermal with Carbon Capture and
    Storage
  publish_date: 2015-03
  project_name: Evaluation of hybridisation of concentrated solar thermal technology
    with carbon capture and storage project
  what_happened: During system start-up at pilot scale, bringing all system components
    up to operating temperature consumed approximately 37.5% of the total energy available
    from the solar plant, severely limiting the energy available for the intended
    CCS process. The thermal inertia of the system — driven by material selection,
    pipe wall thickness, and inadequate insulation — was identified as a critical
    design shortcoming.
  lesson_learnt: 'Thermal inertia is a primary design constraint for solar-thermal
    CCS pilot plants: insulation materials, material heat-transfer characteristics,
    and pipe wall thickness must be carefully selected and sized at design stage,
    and a dedicated thermal storage or pre-heat start-up circuit should be incorporated
    to avoid losing a large fraction of available solar energy to system warm-up.'
  issue_severity: major
  project_type: industrial decarbonisation
  project_scale_band: pilot
  lifecycle_phase: commissioning/integration
  proponent_type: research organisation/university
  delay_category: commissioning/integration
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The project team connected the PCC plant boiler into the steam
    drum to provide system pre-heat during start-up, allowing performance tests to
    proceed under steady-state conditions.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar thermal
  source_pages: &id003
  - 17
  - 18
  evidence_excerpt: For the experimental phase the energy required to bring the various
    system materials up to temperature consumed almost 37.5% of the energy available
    from the solar plant. Therefore the thermal inertia of the system is a key design
    consideration with careful selection and examination required for insulation materials,
    material heat transfer characteristics, and pipe wall thickness.
  confidence_note: issue_severity set to major because 37.5% energy loss to warm-up
    is a substantial fraction of available resource that materially constrained test
    outcomes.
