- record_id: ARENA-DLV-70302
  source_title: Hybridisation of Concentrated Solar Thermal with Carbon Capture and
    Storage
  publish_date: 2015-03
  project_name: Evaluation of hybridisation of concentrated solar thermal technology
    with carbon capture and storage project
  what_happened: Engineering tools used during design (ASPEN-Plus, Thermoflow STEAM
    PRO/MASTER) were fundamentally steady-state tools, which meant that valve sizing,
    pump selection, and control strategies were not well suited to the variable, transient
    nature of solar energy production. This created sub-optimal design solutions for
    the dynamic behaviour of the integrated solar-CCS system.
  lesson_learnt: Projects integrating variable renewable energy sources with processes
    designed for steady-state operation must use dynamic modelling tools during design
    — steady-state process engineering software cannot adequately size equipment or
    define control strategies for systems with fluctuating energy inputs such as solar
    thermal.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: pilot
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The project team identified distinct phases in start-up to model
    manually and provided guidance to plant operators as a workaround for the lack
    of dynamic modelling capability.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar thermal
  source_pages: &id002
  - 15
  - 16
  evidence_excerpt: The key process engineering software and design techniques employed
    by the project engineers are fundamentally based on steady state conditions. Therefore
    the selection of valves, pumps, and control strategies were not always well suited
    to the needs of a variable process like solar energy production where the solar
    resource fluctuates from day to day and even hour to hour.
  confidence_note: secondary_failure_mode of technical underperformance included because
    sub-optimal equipment selection produced measurable performance shortfalls during
    testing.
