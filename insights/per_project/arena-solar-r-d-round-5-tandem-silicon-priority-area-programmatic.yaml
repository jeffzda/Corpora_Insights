- record_id: ARENA-DLV-2009
  source_title: Addressing Solar PV End-of-Life Issues and Lowering Solar PV Cost
    – Summary Report
  publish_date: 2024-05
  project_name: ARENA Solar R&D Round 5 – Tandem Silicon Priority Area (Programmatic)
  what_happened: Device stability was identified as a persistent key challenge across
    all perovskite-based tandem silicon projects in the round, with encapsulation
    performance and material degradation mechanisms requiring dedicated research effort
    that competed with efficiency optimisation goals.
  lesson_learnt: Tandem silicon R&D projects incorporating perovskite materials should
    treat stability and encapsulation as primary deliverables alongside efficiency
    targets; projects that defer stability work risk producing efficiency results
    that cannot be replicated at prototype scale due to rapid degradation.
