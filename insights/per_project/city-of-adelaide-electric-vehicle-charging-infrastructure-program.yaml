- record_id: ARENA-DLV-16857
  source_title: 'The State of Electric Vehicles in Australia – Second Report: Driving Momentum in Electric Mobility'
  publish_date: 2018-06
  project_name: City of Adelaide Electric Vehicle Charging Infrastructure Program
  what_happened: The City of Adelaide deployed a multi-pronged charging infrastructure program including an ICE-to-EV parking management system with occupancy sensors and contactless payment, a central
    Charging Hub built in partnership with SA Power Networks and industry partners, and on-street charging stations — collectively increasing South Australia's charging station count from 42 in 2017 to
    76 in 2018.
  lesson_learnt: Municipal EV charging programs achieve greater impact and faster rollout when they combine active parking management systems (to prevent ICE vehicle overstay), contactless payment (to eliminate
    registration barriers), and network partnerships with utilities — the City of Adelaide model suggests that removing friction at the point of use is as important as deploying hardware.
