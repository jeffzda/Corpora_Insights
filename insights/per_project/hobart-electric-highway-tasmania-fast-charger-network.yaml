- record_id: ARENA-DLV-8456
  source_title: 'Electric Highway Tasmania – Lessons Learnt Report #1'
  publish_date: 2023-01
  project_name: Electric Highway Tasmania, Hobart EHT Fast Charger Network Project
  what_happened: At multiple ARENA-funded sites, staff turnover at site host organisations
    disrupted or nullified progress on site agreements. In one case a national shopping
    chain manager who had agreed in principle to host a charger left and was replaced
    by someone who refused to proceed on any terms. In two other cases incoming managers
    required re-negotiation of previously agreed terms, with one agreement taking
    a full year beyond the originally agreed draft to execute and another still unsigned
    at the time of the report.
  lesson_learnt: Site host agreements for EV charging infrastructure should be formalised
    — or at minimum documented in a binding heads-of-agreement — before grant funding
    is accepted; relying on informal understandings with a named individual is high-risk
    because personnel turnover can reset or terminate negotiations entirely.
