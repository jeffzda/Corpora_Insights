  project_name: Electric Highway Tasmania, Hobart EHT Fast Charger Network Project
  what_happened: EHT identified that deploying large-scale charging sites ahead of
    proven demand results in accumulated losses, potential pressure on site hosts
    to reallocate parking bays, risk of equipment obsolescence before utilisation
    reaches viable levels, and unrealistic user expectations — all undermining network
    economics.
  lesson_learnt: Stage EV charging site capacity to match demonstrated demand growth
    rather than deploying full scale upfront — oversized early sites accumulate losses,
    risk equipment obsolescence before demand materialises, and may prompt operators
    to raise prices to recover costs, damaging network adoption dynamics.
