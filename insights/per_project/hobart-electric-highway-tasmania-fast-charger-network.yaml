  source_title: 'Electric Highway Tasmania – Lessons Learnt Report #1'
  publish_date: 2023-01
  project_name: Electric Highway Tasmania, Hobart EHT Fast Charger Network Project
  what_happened: ARENA doubled the grant funding for Greater Hobart in a single round,
    effectively doubling the public fast-charging capacity being deployed by two grant
    recipients simultaneously. EHT's revenue model had been calibrated to a lower
    supply level, and the oversupply relative to existing demand extended the period
    of operating losses before sites became cash-flow positive beyond what had been
    budgeted.
  lesson_learnt: When a funding body significantly increases grant allocations in
    a single round, proponents should reassess their revenue and cash-flow forecasts
    before accepting the expanded funding — doubling supply without a corresponding
    increase in near-term demand can materially worsen the early operating economics
    of charging infrastructure.
