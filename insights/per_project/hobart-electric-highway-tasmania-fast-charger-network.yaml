- record_id: ARENA-DLV-36963
  source_title: Insights from ARENA's Public Charging Projects
  publish_date: 2024-06
  project_name: Hobart Electric Highway Tasmania Fast Charger Network
  what_happened: EHT analysed two commercialisation strategies — economies of opportunity
    (low-cost, small sites) and economies of scale (large sites) — and found both
    carry distinct risks. Small sites have higher per-charger operating costs and
    poorer user experience; large sites risk being over-built if demand does not grow.
    EHT could not find a simple way to plan staged capacity expansion with power authorities
    over a 5–10 year horizon, and switchboard manufacturers were unfamiliar with designs
    capable of capacity increases greater than 200–300%.
  lesson_learnt: Design charging sites with a mixed strategy — seek economical sites
    with strong demand characteristics and physical scope for incremental expansion;
    build in staging from the outset and confirm with power authorities and switchboard
    manufacturers that future capacity uplift beyond 200–300% is technically and commercially
    feasible before committing.
