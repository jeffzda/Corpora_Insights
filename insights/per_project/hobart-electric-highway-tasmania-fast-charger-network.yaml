  source_title: 'Electric Highway Tasmania – Lessons Learnt Report #2'
  publish_date: 2023-01
  project_name: Electric Highway Tasmania, Hobart EHT Fast Charger Network Project
  what_happened: EHT's modelling indicated that at full EV fleet penetration, Tasmania
    would require approximately 500–1,000 fast charging bays at 125–250 sites, with
    the long-run share of public DC fast charging estimated at 2–5% of total EV electricity
    consumption. By end of 2023, roughly one quarter to one half of all sites ever
    required would already be in service, suggesting early overbuilding risk is low
    but that site selection decisions made now will be long-lived.
  lesson_learnt: Develop explicit long-run capacity models early — even tentative
    statewide forecasts help avoid both chronic underinvestment and costly overbuilding.
    Make the foundation assumptions (charging share, utilisation rate, average charger
    power) explicit and revisable so they can be updated as real-world data accumulates
    each year.
