- record_id: ARENA-DLV-48357
  source_title: 'Electric Highway Tasmania – Lessons Learnt Report #3'
  publish_date: 2023-01
  project_name: Electric Highway Tasmania, Hobart EHT Fast Charger Network Project
  what_happened: EHT assessed that demand charges on electricity supply represent
    a potentially crippling cost for EV charging sites that lack sufficient average
    throughput to support their peak demand, and that starting on low-voltage supply
    before upgrading to medium voltage as scale warrants is a viable cost-management
    strategy.
  lesson_learnt: Structure early-stage EV charging sites to operate on low-voltage
    grid supply to avoid demand charges — demand charges become viable only when average
    throughput is high enough to support peak delivery, and a staged LV-to-MV upgrade
    pathway can defer this cost until site utilisation justifies it.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: commercial expansion
  lifecycle_phase: operations
  proponent_type: project developer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: EHT adopted a staged supply strategy — beginning with LV grid
    supply at low-volume sites and planning upgrade to medium voltage only when scale
    warrants it, to avoid demand charges crippling economics at low utilisation.
  transferability: moderate
  delay_magnitude: null
  technology_domain: EV
  source_pages: &id031
  - 3
  evidence_excerpt: Demand charges are a potentially crippling cost if there is not
    a high enough average demand to support the peak delivered. Growing capacity with
    demand is a strategy to avoid demand chargers initially, then upgrading to medium
    voltage supply as the scale warrants it.
