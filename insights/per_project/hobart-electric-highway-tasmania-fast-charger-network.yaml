- record_id: ARENA-DLV-8451
  source_title: 'Electric Highway Tasmania – Lessons Learnt Report #1'
  publish_date: 2023-01
  project_name: Electric Highway Tasmania, Hobart EHT Fast Charger Network Project
  what_happened: Installation of ARENA-funded EV fast charging sites coincided with
    the peak of the COVID-19 outbreak, border closures, and state lockdowns, resulting
    in at least 20 identifiable instances where a person with COVID caused a direct
    delay of a week or more to one or more sites, with many more indirect delays through
    supply chains, transport, and personnel availability.
  lesson_learnt: Build substantial schedule contingency into EV charging rollout programs
    — pandemic-related disruptions cascade across supply, personnel, and installation
    activities in ways that are not predictable and cannot be fully mitigated through
    proactive planning.
  issue_severity: major
  project_type: transport electrification
