- record_id: ARENA-DLV-8457
  source_title: 'Electric Highway Tasmania – Lessons Learnt Report #1'
  publish_date: 2023-01
  project_name: Electric Highway Tasmania, Hobart EHT Fast Charger Network Project
  what_happened: At one site, a location agreed with the site host prior to grant
    application was later found to be on a leased portion of the property. Formalising
    the site agreement post-funding approval revealed that locating the charger there
    would require amending a decades-old lease on highly favourable terms, which the
    site host was unwilling to do. A new location had to be identified and agreed,
    contributing to an approximately six-month delay when combined with a concurrent
    staff change.
  lesson_learnt: Before locking in a preferred site location for a grant application,
    verify the full ownership and leasing status of the specific area to be used —
    informal agreement-in-principle with the occupier is not sufficient if the parcel
    is subject to a third-party lease that would require amendment.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: demonstration
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: stakeholder/land/community
  failure_mode: poor scoping
  outcome_class: delayed but recoverable
  secondary_failure_mode: coordination & stakeholders
  intervention_note: A new location on the property acceptable to both parties was
    identified and agreed upon, allowing the site to proceed after approximately six
    months of combined delay.
  transferability: moderate
  delay_magnitude: 3-12 months
  technology_domain: EV
  source_pages: &id007
  - 4
  evidence_excerpt: When the grant was approved, we sought to finalise the site agreement
    and it was only then noted that the location we had agreed on was actually a part
    of the property that was leased... This, combined with a change in personnel during
    the process resulting in a delay of about six months.
