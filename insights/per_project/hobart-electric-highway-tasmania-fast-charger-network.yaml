- record_id: ARENA-DLV-8458
  source_title: 'Electric Highway Tasmania – Lessons Learnt Report #1'
  publish_date: 2023-01
  project_name: Electric Highway Tasmania, Hobart EHT Fast Charger Network Project
  what_happened: 'Charger delivery times escalated dramatically over the project period:
    at the time of the grant application the quoted lead time was approximately 12
    weeks; by the time EHT ordered, quoted lead time had grown to 15 weeks; actual
    delivery took 30 weeks; and by early 2023, new orders from the same manufacturer
    were quoted at 36–40 weeks to the Australian warehouse.'
  lesson_learnt: EV charger procurement schedules must account for rapidly extending
    lead times — order as early as possible after funding confirmation rather than
    waiting for other project elements to be resolved, as each delay in ordering compounds
    the lead-time blowout and quoted times at application can be less than half of
    actual delivery time by the time the order is placed.
