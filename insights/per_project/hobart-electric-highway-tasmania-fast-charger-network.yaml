  project_name: Electric Highway Tasmania, Hobart EHT Fast Charger Network Project
  what_happened: EHT found it difficult to engage engineering consultants for small,
    one-off civil design tasks at remote locations, as most consultants had backlogs
    from existing or larger local clients. One non-ARENA site took nearly three months
    to find a civil designer willing to take on the project.
  lesson_learnt: For EV charging rollouts involving small sites in regional or remote
    locations, identify and pre-qualify civil design consultants before funding is
    confirmed — the small scale and geographic isolation of individual jobs makes
    them unattractive to consultants under high demand, causing multi-month delays.
