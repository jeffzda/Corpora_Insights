  what_happened: EHT found that average charging rates across its network were approximately
    70% of nameplate charger capacity, and that this ratio declines as maximum charger
    capacity increases. This real-world charging efficiency gap was a material input
    to capacity planning that is often not accounted for when using nameplate specifications
    alone.
