- record_id: ARENA-DLV-8454
  source_title: 'Electric Highway Tasmania – Lessons Learnt Report #1'
  publish_date: 2023-01
  project_name: Electric Highway Tasmania, Hobart EHT Fast Charger Network Project
  what_happened: On at least four occasions across different suppliers, components
    for switchboards, charger stands, and other parts that previously had four-to-six-week
    delivery times were found to be out of stock or subject to multi-month lead times
    when orders were placed, causing installation delays. Spare parts for charger
    repair were also severely affected, with some EV chargers operated by others reported
    to be out of service for up to nine months due to parts unavailability.
  lesson_learnt: EV charging projects should pre-order or hold buffer stock of critical
    components — including switchboard parts and charger spares — well before they
    are needed, as global supply chain disruptions can extend delivery times from
    weeks to many months; do not rely on historical supplier lead times as a planning
    baseline.
  issue_severity: major
  project_type: transport electrification
  project_scale_band: demonstration
  lifecycle_phase: procurement
  proponent_type: project developer
  delay_category: procurement/supply chain
  failure_mode: execution & logistics
  outcome_class: delayed but recoverable
  secondary_failure_mode: null
  intervention_note: EHT sought to hold stock of critical spare parts for chargers,
    communications, and other installed equipment to mitigate future outages, though
    an order placed in May 2022 remained unfulfilled in full as of January 2023.
  transferability: broad
  delay_magnitude: 3-12 months
  technology_domain: EV
  source_pages: &id004
  - 3
  evidence_excerpt: This occurred on at least four occasions from different suppliers
    so it was not a case of one or two poorly performing companies... we are aware
    of some EV chargers – operated by others – that have been out of service for up
    to nine months due to inability to obtain the required parts.
