  outcome_class: delayed but recoverable
  secondary_failure_mode: null
  intervention_note: EHT re-engaged with incoming managers and re-negotiated previously
    agreed terms; one agreement was eventually signed one year after the original
    draft, with minor changes; another remained unsigned at the report date.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: EV
