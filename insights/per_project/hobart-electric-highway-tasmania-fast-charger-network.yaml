  source_title: 'Electric Highway Tasmania – Lessons Learnt Report #1'
  publish_date: 2023-01
  project_name: Electric Highway Tasmania, Hobart EHT Fast Charger Network Project
  what_happened: The combined effect of COVID, geopolitical disruption, labour and
    parts shortages, staff turnover at site hosts, and cascading contractor scheduling
    issues meant that ARENA-funded sites did not progress as predictably as EHT's
    earlier non-ARENA sites, despite EHT having relevant prior experience. ARENA adjusted
    milestone dates to accommodate the revised schedule after confirming that many
    other grant recipients were experiencing the same issues.
  lesson_learnt: Even experienced EV charging operators with a proven track record
    should allow ample contingency time in ARENA-funded project schedules and ensure
    contract flexibility — the document explicitly advises not to sign contracts with
    inflexible deadlines or unrealistic delay penalties, as external disruptions beyond
    the proponent's control are common across the portfolio.
