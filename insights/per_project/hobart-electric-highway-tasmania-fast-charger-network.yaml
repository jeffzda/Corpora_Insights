  source_title: 'Electric Highway Tasmania – Lessons Learnt Report #2'
  publish_date: 2023-01
  project_name: Electric Highway Tasmania, Hobart EHT Fast Charger Network Project
  what_happened: EHT identified that multi-bay sites reduce queuing probability and
    wait times, benefit from capital and operating economies of scale, and that queuing
    theory shows diminishing returns beyond approximately eight bays per site in the
    Tasmanian geographic context. Single-bay sites were found to be commercially marginal
    in lower-demand locations.
  lesson_learnt: Design EV fast charging sites with a minimum of two bays wherever
    commercially feasible — single-bay sites are vulnerable to full utilisation events
    with no fallback and are less commercially viable. In the Tasmanian context, beyond
    approximately eight bays per site, scale benefits plateau and additional convenience
    value from distributed sites may outweigh further concentration.
