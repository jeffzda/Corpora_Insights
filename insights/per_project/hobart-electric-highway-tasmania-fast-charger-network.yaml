  project_type: transport electrification
  project_scale_band: demonstration
  lifecycle_phase: construction/installation
  proponent_type: project developer
  delay_category: construction/installation
  failure_mode: execution & logistics
  outcome_class: delayed but recoverable
  secondary_failure_mode: coordination & stakeholders
  intervention_note: Several contractors increased apprenticeship uptake, but this
    was acknowledged as a multi-year measure with no near-term impact on available
    capacity.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: EV
  source_pages: &id003
  - 2
  - 3
  evidence_excerpt: Contractors have been subject to increasing demand but have been
    unable to recruit suitably qualified electricians even from interstate. Although
    several have increased apprenticeship uptake, this will take years before it adds
    measurably to the pool of capable electricians. This is expected to be an ongoing
    issue for some years.
