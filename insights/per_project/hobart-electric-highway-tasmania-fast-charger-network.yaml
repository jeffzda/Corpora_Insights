- record_id: ARENA-DLV-8453
  source_title: 'Electric Highway Tasmania – Lessons Learnt Report #1'
  publish_date: 2023-01
  project_name: Electric Highway Tasmania, Hobart EHT Fast Charger Network Project
  what_happened: A shortage of skilled electricians in Tasmania during 2021–2022,
    compounded by a surge in demand for solar and EV-related electrical work following
    a change in federal and state government policy, made it difficult for EHT's contractors
    to recruit suitably qualified staff even from interstate, holding back EV charger
    installations.
  lesson_learnt: In regions with constrained electrician supply, EV charging project
    schedules should be built around realistic contractor availability — including
    lead times for booking suitably skilled tradespeople — rather than assumed availability;
    the structural labour shortage is expected to persist for years as apprenticeship
    pipelines are long.
