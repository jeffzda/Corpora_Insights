- record_id: ARENA-DLV-48354
  source_title: 'Electric Highway Tasmania – Lessons Learnt Report #3'
  publish_date: 2023-01
  project_name: Electric Highway Tasmania, Hobart EHT Fast Charger Network Project
  what_happened: EHT found that switchboard designs cannot easily accommodate the
    ten-to-twentyfold increases in charging capacity needed as sites scale, requiring
    replacement of main breakers and leaving early hardware oversized or obsolete,
    resulting in unavoidable capital waste even with modular design.
  lesson_learnt: Design site electrical infrastructure with a modular, forward-looking
    layout that anticipates future capacity at least two upgrade stages ahead — switchboard
    components sized only for initial demand will require costly replacement as the
    site scales, and some hardware waste is unavoidable but can be minimised with
    deliberate upfront design.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: commercial expansion
  lifecycle_phase: development/design
  proponent_type: project developer
