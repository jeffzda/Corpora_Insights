- record_id: ARENA-DLV-8452
  source_title: 'Electric Highway Tasmania – Lessons Learnt Report #1'
  publish_date: 2023-01
  project_name: Electric Highway Tasmania, Hobart EHT Fast Charger Network Project
  what_happened: EV charger equipment ordered from a European manufacturer in November
    2021, scheduled for delivery in late March 2022, was delayed when the Russia/Ukraine
    conflict disrupted the ship's planned route through Kaliningrad; the shipment
    eventually arrived at the warehouse in late June 2022, roughly three months late.
  lesson_learnt: When sourcing EV charging equipment from European manufacturers,
    avoid shipment routes through geopolitically sensitive transit points and build
    at least three months of additional buffer into delivery schedules to account
    for force majeure logistics disruptions.
