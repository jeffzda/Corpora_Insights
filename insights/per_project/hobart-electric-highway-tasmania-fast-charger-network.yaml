- record_id: ARENA-DLV-22303
  source_title: 'Electric Highway Tasmania – Lessons Learnt Report #2'
  publish_date: 2023-01
  project_name: Electric Highway Tasmania, Hobart EHT Fast Charger Network Project
  what_happened: EHT's staged network development strategy — first establishing skeleton
    coverage at ~150 km spacing, then filling gaps to ~50 km, then adding capacity
    as demand grows — proved effective at pre-empting demand and keeping queuing below
    5% on average across the network until late 2022.
  lesson_learnt: A phased build-out strategy (skeleton coverage first, gap-fill second,
    capacity augmentation third) can successfully pre-empt EV demand and maintain
    user confidence without overbuilding. Future EV charging network developers should
    explicitly structure rollout in stages tied to demonstrated demand thresholds
    rather than building to ultimate capacity upfront.
  issue_severity: none
  project_type: transport electrification
  project_scale_band: first commercial/FOAK
