  what_happened: EHT found that rapidly evolving charging technology — including dynamic
    power allocation, cooled cables, 800V vehicle charging, and emerging induction
    and battery-buffering options — means that specific site and electrical requirements
    for future chargers cannot be reliably anticipated when laying out sites today,
    creating a risk of misfit between physical infrastructure and future equipment.
  lesson_learnt: Design EV charging sites for technology flexibility rather than optimising
    for current equipment specifications — charging hardware is evolving rapidly (dynamic
    power allocation, 800V systems, induction) and infrastructure locked to today's
    requirements may be incompatible with cost-effective future upgrades.
