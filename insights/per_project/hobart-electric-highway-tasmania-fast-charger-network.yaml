  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: EHT adopted modular site designs and attempted to size bus bars
    and other elements for anticipated future demand, accepting that some early hardware
    would be outgrown.
  transferability: moderate
  delay_magnitude: null
  technology_domain: EV
  source_pages: &id028
  - 3
  evidence_excerpt: Switchboard manufacturers are not accustomed to making designs
    that can accommodate a ten or twenty fold increases in stages. Breakers are available
    that can be varied in capacity but usually only by a factor of 2 or 3. This requires
    replacement of main breakers as the site grows, but the scale of bus bars and
    other elements must anticipate the future demand and would be well oversized for
    the initial demand. Some of this can be managed with modular design but a certain
    element of 'waste' is inevitable as early hardware is outgrown even with best
