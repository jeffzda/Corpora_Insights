    — a level of energy literacy that does not currently exist at scale — before customers
    can meaningfully engage with or support active market participation models.
  lesson_learnt: Proponents planning community battery or DER aggregation deployments
    at scale must invest in building customer energy literacy as a prerequisite; without
    it, customer buy-in for active participation models will not be achievable and
    roll-out will be constrained.
