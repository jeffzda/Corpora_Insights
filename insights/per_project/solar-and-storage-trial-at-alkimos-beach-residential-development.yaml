  what_happened: 72% of trial participants were satisfied or very satisfied with ABEST,
    with satisfaction primarily driven by lower energy bills. Synergy data confirmed
    that approximately 80% of participants were better off financially on the trial
    compared to the standard A1 tariff. There was overwhelming support for the trial
    to continue beyond its scheduled May 2021 end date.
  lesson_learnt: Financial benefit (lower bills) is the dominant driver of customer
    satisfaction in community battery trials; trials that demonstrably deliver bill
    savings achieve high participant satisfaction and strong support for continuation,
    suggesting that quantified financial outcomes — not just environmental or technology
    narratives — should be the primary metric for trial success communication.
