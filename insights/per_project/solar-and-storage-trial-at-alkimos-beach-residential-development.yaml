  what_happened: The regulatory framework in the Western Australian Wholesale Energy
    Market (WEM) did not explicitly accommodate battery storage system participation
    in the Reserve Capacity Mechanism, creating insurmountable risks and limitations
    that prevented the CESS from participating in capacity markets during the trial.
  lesson_learnt: Community battery projects should be leveraged to inform and expedite
    electricity market reform. At the time of deployment, WEM frameworks did not accommodate
    community batteries in all market elements — project teams should actively engage
    with market reform processes to ensure future projects can access the full value
    stack.
