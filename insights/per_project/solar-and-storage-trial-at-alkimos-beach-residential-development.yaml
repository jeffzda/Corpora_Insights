  project_name: Alkimos Beach Energy Storage Trial (ABEST)
  what_happened: The CESS battery was set up with a fixed 'set and forget' charge
    and discharge schedule established during installation that could not be changed
    remotely, limiting value realisation from the asset.
  lesson_learnt: Community batteries should be equipped with smart controllers enabling
    dynamic remote dispatch from the outset. A fixed charge/discharge cycle forgoes
    significant value that could otherwise be captured through optimised dispatch
    responding to market and network signals.
