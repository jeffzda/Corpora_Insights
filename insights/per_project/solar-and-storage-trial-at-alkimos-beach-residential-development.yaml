  what_happened: Uncertainty about whether the trial would continue beyond its 2021
    end date was a barrier to new participants joining. Focus group participants who
    had not yet joined the trial stated they would need more certainty about the trial's
    future and ongoing management before signing up.
  lesson_learnt: Uncertainty about trial continuation actively suppresses new enrolments
    in multi-year community energy trials; proponents should communicate a clear forward
    commitment (or decision timeline) about trial extension as early as possible to
    avoid a self-reinforcing decline in participation as the end date approaches.
