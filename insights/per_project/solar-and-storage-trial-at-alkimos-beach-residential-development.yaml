- record_id: ARENA-DLV-7257
  source_title: Alkimos Beach Energy Storage Trial Customer Insights 2019
  publish_date: '2019'
  project_name: Alkimos Beach Energy Storage Trial (ABEST)
  what_happened: The primary factor in solar PV system purchase decisions among trial
    participants was price (33%), followed by right size for the house (27%). Focus
    group participants reported that some salespeople recommended the largest system
    possible rather than the most appropriate system, and that some participants ended
    up with systems too small to benefit optimally from the community battery tariff.
  lesson_learnt: When designing community battery trials that depend on solar PV export
    to generate customer credits, proponents should provide guidance — or a list of
    vetted installers familiar with the trial structure — to help residents select
    appropriately sized PV systems, rather than leaving sizing decisions entirely
    to retail salespeople whose incentives may not align with trial outcomes.
