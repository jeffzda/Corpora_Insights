- record_id: ARENA-DLV-7254
  source_title: Alkimos Beach Energy Storage Trial Customer Insights 2019
  publish_date: '2019'
  project_name: Alkimos Beach Energy Storage Trial (ABEST)
  what_happened: 'The Synergy Smart Response (SSR) demand-response program, co-delivered
    as part of ABEST, was not well known or understood even among trial participants:
    only 20% of those on the ABEST trial had heard of the SSR program, and 60% had
    not. The trial aimed to recruit 10–15 customers but only achieved eight due to
    air conditioner technical eligibility constraints.'
  lesson_learnt: Demand-response sub-programs embedded within a broader trial require
    their own dedicated communication effort and eligibility pre-screening; bundling
    them within a larger program without distinct promotion results in very low uptake,
    compounded further when technical eligibility criteria are not communicated upfront.
