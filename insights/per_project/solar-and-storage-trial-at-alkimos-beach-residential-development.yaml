  evidence_excerpt: Since 2018, Synergy along with project partner WPC is trialling
    a community-based, virtual electricity storage solution called PowerBank. Now,
    in its third phase, there are a total of 12 community batteries in Perth metropolitan
    and regional suburbs participating in the PowerBank 3 trial. The trial allows
    for the integration of a utility scale battery into an already established major
    metropolitan network and leverages many of the learnings from the ABEST trial.
