  what_happened: Approximately 5% of ABEST participants would have been better off
    on the standard A1 tariff rather than the Peak Demand Saver tariff, because their
    solar PV systems were too small to generate sufficient credits to offset peak
    period charges — a mismatch that was not identified before enrolment.
  lesson_learnt: Community battery trials using time-of-use tariffs should implement
    a pre-enrolment eligibility or suitability check — including minimum solar PV
    system size thresholds — to avoid enrolling households who will be financially
    worse off, which damages participant satisfaction and trial credibility.
