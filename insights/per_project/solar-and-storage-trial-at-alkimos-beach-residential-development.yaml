  project_name: Alkimos Beach Energy Storage Trial (ABEST)
  what_happened: 64% of trial participants reported that their energy use had not
    changed as a result of being on the trial. Participants cited difficulty changing
    habits, lack of practical guidance, and insufficient feedback on how behaviour
    changes would translate to bill savings as reasons for not adjusting behaviour.
  lesson_learnt: Behaviour change to exploit time-of-use tariffs does not occur automatically
    with enrolment; trials must provide personalised, actionable guidance — including
    realistic case studies with cost impacts for different household and solar system
    types — to convert customer interest into bill-optimising behaviour.
