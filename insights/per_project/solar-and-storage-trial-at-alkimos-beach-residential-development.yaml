  source_title: Spotlight Interview with Synergy for Insights
  publish_date: 2021-08
  project_name: Alkimos Beach Energy Storage Trial (ABEST)
  what_happened: The five-year trial operated in a rapidly evolving market environment
    — including a 1,600% increase in large-scale renewable generation and 51% increase
    in rooftop solar PV in WA over just three years — as well as rapid technology
    advancement (e.g. appliances gaining built-in wi-fi where connectivity had previously
    been a challenge during the trial). The project's original scope could not fully
    anticipate these shifts.
  lesson_learnt: Build explicit flexibility into trial project scopes to allow investigation
    focus to be adjusted as the market and technology landscape evolves — a rigid
    scope in a fast-moving sector risks the trial becoming misaligned with the most
    pressing issues before it concludes.
  issue_severity: minor
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: close-out/post-project review
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Synergy adapted the trial's focus over the five-year period in
    line with market shifts, and has incorporated flexible scope provisions and ongoing
    customer communication into subsequent projects.
  transferability: broad
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id025
  - 3
  evidence_excerpt: Throughout the ABEST and even more so today, the project serves
    as a reminder of just how quickly the market is evolving and how far the industry
    has come in such a short space of time... Being able to adapt in line with these
    shifts, adjust the focus of an investigation accordingly, and speak to customers
    about how we are doing that along the way – is crucial not only for Synergy but
    for how industry considers its approach to future trial and energy investment.
