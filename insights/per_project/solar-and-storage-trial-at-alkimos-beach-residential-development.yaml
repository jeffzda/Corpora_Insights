  evidence_excerpt: A key learning point derived from pairing the newly created Peak
    Demand Saver Plan (PDS) with the virtual battery offering was that it did not
    encourage participant behaviour to reduce peak household consumption. This led
    to the conclusion that virtual battery products are best for customers who export
    in the middle of the day and consume in peak times.
