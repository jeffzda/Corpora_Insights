- record_id: ARENA-DLV-21901
  source_title: Spotlight Interview with Synergy for Insights
  publish_date: 2021-08
  project_name: Alkimos Beach Energy Storage Trial (ABEST)
  what_happened: At the time of the trial's launch in 2016, Advanced Metering Infrastructure
    (AMI) was not available in Western Australia, so the project relied on manual
    meter reads at approximately 60-day billing intervals. This limited the granularity
    and accuracy of customer energy consumption data available for analysis throughout
    the trial. AMI rollout in WA did not commence until 2020.
  lesson_learnt: Future DER and community battery trials should be designed assuming
    high-resolution customer metering data will be needed — plan for AMI or equivalent
    sub-interval data from the outset, as billing-cycle manual reads are insufficient
    for meaningful DER integration analysis.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: data/validation/testing
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: The project team worked with available billing-period data as
    a proxy, thoroughly examining it to extract useful insights, while noting the
    limitation for future projects.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: DER
  source_pages: &id023
  - 2
  - 3
  evidence_excerpt: The data that was available, often obtained through manual reads
    of participants' electricity meter and at the end of each billing period – approximately
    every 60 days – was thoroughly examined. This information quickly became a key
    element used to inform the project's ongoing analysis. Access to customer data
    outside of these periods was challenging and the granularity and accuracy of the
    information was less sophisticated than what we can be gained today. The roll
    out of AMI did not commence in WA until 2020.
