- record_id: ARENA-DLV-68408
  source_title: Alkimos Beach Energy Storage Trial Final Report
  publish_date: 2021-07
  project_name: Alkimos Beach Energy Storage Trial (ABEST)
  what_happened: The trial launched in April 2016, coinciding with a colder, wetter,
    and more overcast winter (1.3°C lower than 2015), which caused a 7% increase in
    energy use and a decrease in solar generation across Perth, reducing participant
    savings and causing a number of participants to leave the trial and generate negative
    community sentiment.
  lesson_learnt: Launch community battery and solar-linked retail products in spring
    or summer rather than autumn or winter — solar generation is at its highest in
    warmer months, maximising early participant savings and preventing the bill shock
    and negative sentiment that winter launches can produce. Initial negative experiences
    are difficult to recover from and can undermine trial recruitment.
