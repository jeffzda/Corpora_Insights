  what_happened: 27% of trial participants disagreed that they received enough information
    at the start of the trial to understand how it worked, and 20% disagreed that
    they received sufficient information during the trial to maximise savings. One
    participant reported never having anyone to speak to on a regular basis about
    how to get the most out of the trial.
