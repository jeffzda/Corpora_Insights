  source_title: Alkimos Beach Energy Storage Trial Final Report
  publish_date: 2021-07
  project_name: Alkimos Beach Energy Storage Trial (ABEST)
  what_happened: No regulatory precedent or policy framework existed for the construction
    and operation of a community energy storage system, making approvals processes
    unfamiliar to all parties and creating obstacles across building, environmental,
    planning, and safety domains.
  lesson_learnt: For novel infrastructure types such as community batteries, engage
    planning stakeholders and regulatory authorities early — ideally before a site
    is selected — as planning processes vary across regions, decision-makers are unlikely
    to be familiar with the proposal, and no policy frameworks exist to guide approvals.
    Visual aids such as animations proved highly effective in accelerating approvals.
