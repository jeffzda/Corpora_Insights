- record_id: ARENA-DLV-7255
  source_title: Alkimos Beach Energy Storage Trial Customer Insights 2019
  publish_date: '2019'
  project_name: Alkimos Beach Energy Storage Trial (ABEST)
  what_happened: Without cost information, most residents (41%) preferred owning their
    own home battery over accessing the community battery (31%). Once relative costs
    were disclosed — community battery access at $11/month versus approximately $200/month
    for a home battery — preference for the community battery rose to 55%, with 87%
    of current trial participants preferring it.
  lesson_learnt: Consumer preference for community battery over individual battery
    storage is highly sensitive to cost transparency; marketing for community battery
    schemes should lead with concrete cost comparisons rather than technology benefits,
    as uninformed customers default to a preference for individual ownership.
