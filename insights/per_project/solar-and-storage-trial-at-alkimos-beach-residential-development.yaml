  evidence_excerpt: The main obstacle for the CESS was that no precedent existed for
    the construction and operation of a CESS. Planning processes and approvals vary
    across regions and parties are unlikely to be familiar with this type of proposal.
    New types of proposals such as community batteries have not been contemplated
    and there are also no policy frameworks to guide decision-making.
