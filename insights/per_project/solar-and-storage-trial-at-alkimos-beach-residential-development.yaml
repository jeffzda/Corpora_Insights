  source_title: Alkimos Beach Energy Storage Trial Customer Insights 2019
  publish_date: '2019'
  project_name: Alkimos Beach Energy Storage Trial (ABEST)
  what_happened: 40% of trial participants did not understand how the Peak Demand
    Saver (PDS) tariff worked — the pricing structure they were enrolled on — and
    27% had not even heard of it. This limited their ability to shift behaviour and
    optimise savings under the trial.
  lesson_learnt: Enrolling customers in a time-of-use tariff without ensuring they
    understand its mechanics undermines both customer outcomes and trial objectives;
    future trials should provide clear, plain-language tariff explainers with household-specific
    examples at sign-up and reinforce them during the trial.
