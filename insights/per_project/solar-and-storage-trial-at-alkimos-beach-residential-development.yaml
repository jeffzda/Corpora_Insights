- record_id: ARENA-DLV-7251
  source_title: Alkimos Beach Energy Storage Trial Customer Insights 2019
  publish_date: '2019'
  project_name: Alkimos Beach Energy Storage Trial (ABEST)
  what_happened: Despite multiple marketing campaigns by Synergy, Lendlease and DevelopmentWA,
    25% of surveyed Alkimos Beach residents remained unaware of the ABEST trial. Of
    those aware, 60% had never participated, leaving the trial well short of its initial
    recruitment aspirations until late in the trial period.
  lesson_learnt: Ongoing, regular and targeted communication is required throughout
    a community energy trial — a single launch event and periodic correspondence leaves
    a significant proportion of the target population unaware; new residents arriving
    after initial campaigns are particularly likely to be missed and need a dedicated
    onboarding touchpoint.
  issue_severity: moderate
  project_type: storage
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: coordination & stakeholders
  outcome_class: partial success
  secondary_failure_mode: null
  intervention_note: Following the research focus group in October 2018, one new customer
    signed up and Synergy began direct conversations with a further 30 potentially
    interested residents.
  transferability: broad
  delay_magnitude: null
  technology_domain: battery storage
