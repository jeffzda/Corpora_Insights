  source_title: Alkimos Beach Energy Storage Trial Final Report
  publish_date: 2021-07
  project_name: Alkimos Beach Energy Storage Trial (ABEST)
  what_happened: The Peak Demand Saver (PDS) virtual battery product did not encourage
    participants to actively reduce their peak household electricity consumption;
    it primarily enabled them to offset peak costs using solar credits rather than
    shifting behaviour.
  lesson_learnt: Virtual battery products paired with ToU tariffs are best suited
    to customers who export solar during the day and consume during peak times. They
    do not inherently drive behavioural change to reduce peak consumption — if demand
    reduction is the goal, different tariff structures or incentive mechanisms need
    to be explored.
