  source_title: Spotlight Interview with Synergy for Insights
  publish_date: 2021-08
  project_name: Alkimos Beach Energy Storage Trial (ABEST)
  what_happened: The ABEST trialled a novel energy servicing system that virtually
    connected individual household solar PV systems directly to a community battery,
    bypassing the electricity meter — a configuration with no existing guidelines,
    policy or regulation. This required significant technical investigation to determine
    how to physically install and operate the battery while ensuring correct interaction
    with existing infrastructure.
  lesson_learnt: When deploying a first-of-kind DER configuration without applicable
    regulatory guidelines, establish technical working groups with the network operator
    early in the project to map all technical requirements and interdependencies before
    installation — this reduces rework and supports ongoing operational clarity.
