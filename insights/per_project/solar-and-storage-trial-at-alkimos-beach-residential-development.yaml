  source_title: Alkimos Beach Energy Storage Trial Final Report
  publish_date: 2021-07
  project_name: Alkimos Beach Energy Storage Trial (ABEST)
  what_happened: The ABEST trial's learnings directly informed and were leveraged
    by Synergy's subsequent PowerBank community battery trial program, which by report
    date had scaled to 12 community batteries across Perth metropolitan and regional
    suburbs in its third phase.
  lesson_learnt: First-of-kind community energy storage demonstrations generate transferable
    delivery knowledge that can be directly applied to scale-up programs. Build explicit
    knowledge transfer mechanisms into trial design so that lessons can be systematically
    adopted in subsequent larger deployments.
