- record_id: ARENA-DLV-14985
  source_title: 'Looking Forward: Barriers, Risks and Rewards of the Australian Geothermal
    Sector to 2020 and 2030'
  publish_date: 2014-06
  project_name: Australian Geothermal Sector – Electricity Demand Weakness Threat
  what_happened: Forward projections of electricity demand in Australia were repeatedly
    revised downward, with many estimates converging around 1 per cent annual growth
    to 2020 and 2030 — significantly below long-run GDP growth of 3 per cent per year
    — reducing the need for new dispatchable generation capacity and further deteriorating
    the commercial case for geothermal electricity.
  lesson_learnt: Market entry timing for new generation technologies must account
    for demand trajectory as well as LCOE — even a technology approaching cost competitiveness
    can be commercially unviable if demand growth is insufficient to require new capacity;
    portfolio managers should stress-test technology investment cases against low-demand
    scenarios and prioritise market niches (off-grid, specialised industrial) where
    demand exists independently of NEM growth.
