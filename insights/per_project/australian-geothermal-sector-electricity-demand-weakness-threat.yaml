  evidence_excerpt: A projected electricity demand increase of about 1 per cent per
    year is notable because it would be substantially below the long-run growth rate
    in GDP of 3 per cent per year... At least until 2020 it appears there is no demand
    to add additional dispatchable power generating capacity. Indeed, a number of
    plants have been taken out of operation and more may follow to 2020 depending
    what happens following the review of the Renewable Energy Target.
