  project_name: Queensland Energy Conservation and Demand Management Program
  what_happened: In 2009 the Queensland Government committed $44.7 million to a DM programme implemented with Energex and Ergon Energy, targeting 40 MW of peak demand reduction and $120 million in expected
    infrastructure savings. The programme is credited with making Queensland's distribution network businesses the leaders in network DM in Australia.
  lesson_learnt: State government co-investment in DM programmes — delivered in collaboration with network businesses and with clearly defined peak demand reduction targets — can build lasting institutional
    capability that persists beyond the programme itself; Queensland's programme demonstrates that targeted co-funding transforms network business DM culture.
