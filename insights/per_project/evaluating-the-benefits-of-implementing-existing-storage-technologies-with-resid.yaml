  evidence_excerpt: With PV systems installed without battery storage, it can be seen that there was no effect in reducing the network peak load. No significant reduction in evening peak grid electricity
    consumption was observed when compared to the base case scenario. With installation of storage batteries in individual households, a reduction of approximately 17% in peak demand was observed.
