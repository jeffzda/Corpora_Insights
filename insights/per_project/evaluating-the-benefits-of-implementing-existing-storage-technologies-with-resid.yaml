- record_id: ARENA-DLV-72244
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects - First Edition Results'
  publish_date: '2015'
  project_name: Evaluating the benefits of implementing existing storage technologies with residential PV rooftop systems
  what_happened: A UNSW modelling study of Sydney residential households found that rooftop solar PV installed without battery storage had no measurable effect on reducing evening network peak load, while
    adding battery storage delivered approximately a 17% reduction in peak demand and enabled increased self-consumption.
  lesson_learnt: PV alone does not reduce network evening peak demand for residential working consumers — battery storage must be co-deployed with rooftop PV to achieve meaningful peak demand reduction
    and enable network augmentation deferral.
