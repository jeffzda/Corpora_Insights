  publish_date: 2018-01
  project_name: RayGen PV Ultra Pilot Demonstration Facility, Newbridge
  what_happened: Tight manufacturing tolerances on the PV Ultra system required precision
    manufacturing and skilled labour, increasing time and cost from suppliers. Designs
    that were not sufficiently error-tolerant added difficulty and expense to the
    supply and assembly process.
  lesson_learnt: Design for error tolerance from the outset — systems that accommodate
    assembly variation and contemplate real-world manufacturing conditions reduce
    time and cost from suppliers compared to designs requiring precision skilled labour
    at every step.
