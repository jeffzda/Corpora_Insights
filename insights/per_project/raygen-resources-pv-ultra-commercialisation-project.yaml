- record_id: ARENA-DLV-50255
  source_title: 'RayGen''s PV Ultra: Expanding The Global Solar Market Beyond Daylight
    Power'
  publish_date: 2018-01
  project_name: RayGen PV Ultra Pilot Demonstration Facility, Newbridge
  what_happened: Once an actual build was completed and a confirmed baseline case
    established, detailed sensitivity analysis revealed that substantial cost reductions
    — approximately 30% — could be realised through consolidation of certain sub-systems
    including the mast, cooling system, receiver and inverter. This could not have
    been identified without the real build data.
  lesson_learnt: Prioritise completing an actual physical build before finalising
    scale-up cost models — theoretical scaling assumptions are insufficient; real
    build data enables sensitivity analysis that can reveal cost reduction pathways
    (in this case ~30%) that would otherwise remain hidden.
  issue_severity: none
  project_type: generation
  project_scale_band: pilot
  lifecycle_phase: close-out/post-project review
  proponent_type: technology vendor
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: follow-on scale-up enabled
  secondary_failure_mode: null
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id005
  - 7
  evidence_excerpt: While it is well known that 'scaling up' can reduce cost, having
    an 'actual build' with a confirmed baseline case provides the means to perform
    a detailed sensitivity analysis which has revealed that substantial cost savings
    can be realised through consolidation of certain sub-systems. Scaling up of the
    mast, cooling system, receiver and inverter can realise a 30% cost reduction while
    still using the same modules, heliostats and control system.
