  publish_date: 2018-01
  project_name: RayGen PV Ultra Pilot Demonstration Facility, Newbridge
  what_happened: Adverse weather conditions — wind, rain and temperature — disrupted
    site construction, creating unsafe or suboptimal working environments and increasing
    construction cost and schedule uncertainty.
  lesson_learnt: Maximise prefabrication and minimise on-site skilled labour requirements
    — weather-driven disruption to site work is unavoidable, so designs that shift
    work off-site reduce cost exposure and improve schedule certainty for construction
    of novel solar installations.
