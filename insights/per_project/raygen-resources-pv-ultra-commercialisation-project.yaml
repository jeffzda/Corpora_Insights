  secondary_failure_mode: null
  intervention_note: RayGen adopted a design philosophy of maximum prefabrication
    and minimum on-site finesse and skilled labour to reduce weather exposure risk
    in subsequent builds.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id003
  - 6
  - 7
  evidence_excerpt: The weather is unpredictable and site construction time can be
    heavily influenced by wind, rain and temperature which result in unsafe or a less
    than optimum working environment. The product should have a maximum degree of
    prefabrication and a minimum degree of on-site finesse and skilled labour requirement.
    This reduces cost and ensures greater certainty of cost for the installed product.
