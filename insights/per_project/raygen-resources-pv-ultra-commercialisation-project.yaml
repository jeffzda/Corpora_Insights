  source_title: 'RayGen''s PV Ultra: Expanding The Global Solar Market Beyond Daylight
    Power'
  publish_date: 2018-01
  project_name: RayGen PV Ultra Pilot Demonstration Facility, Newbridge
  what_happened: Parts count for on-site erection and connection was identified as
    a cost driver. Excess component count added cost through consolidated logistics
    complexity and reduced assembly speed.
  lesson_learnt: Minimise parts count for on-site erection and connection during the
    design phase — consolidation and appropriate scaling of systems and subsystems
    directly reduces installation cost and complexity, particularly for novel hardware-intensive
    solar technologies.
