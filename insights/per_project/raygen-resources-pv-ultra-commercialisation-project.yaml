  project_name: RayGen PV Ultra Newbridge Expansion Project
  what_happened: Following the successful 200kW pilot, RayGen proceeded with a 0.5MW
    expansion at Newbridge funded jointly by ARENA and the Victorian State Government
    (New Energy Jobs Fund). The expansion included two new PV Ultra power towers,
    technology design development, and a manufacturing capacity upgrade from 8MW p.a.
    to 25MW p.a. Commissioning was still underway at time of writing (January 2018).
  lesson_learnt: Pilot projects that successfully demonstrate technology at small
    scale and generate rigorous performance data are well-positioned to attract co-funding
    from both federal and state government programs for scale-up — document and publicise
    pilot results to support multi-source funding applications.
