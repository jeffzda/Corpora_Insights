- record_id: ARENA-DLV-50256
  source_title: 'RayGen''s PV Ultra: Expanding The Global Solar Market Beyond Daylight
    Power'
  publish_date: 2018-01
  project_name: RayGen PV Ultra Pilot Demonstration Facility, Newbridge
  what_happened: The Newbridge pilot was co-located with an agribusiness partner,
    which provided commercial value and an industrial partner relationship. However,
    trucking activity at the site produced substantial dust that reduced average plant
    output, an operational impact not anticipated at the design stage.
  lesson_learnt: Assess local site-specific factors — vegetation, industry activity,
    dust sources, rivers and hills — as part of siting decisions, not just macro factors
    like solar resource and latitude; co-location with industrial partners can introduce
    ongoing O&M issues such as dust loading that directly reduce energy yield.
  issue_severity: moderate
  project_type: generation
  project_scale_band: pilot
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Heliostat parking and washing strategies were under development
    at time of writing to minimise dust-related output losses.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id006
  - 7
  evidence_excerpt: Plant siting is important. Apart from macro-factors such as latitude,
    elevation, temperature, windspeed and solar resource, local factors such as vegetation,
    rivers, hills and industry can have an influence on project delivery and O&M.
    For example, while the current Pilot is co-located with an excellent industrial
    partner, trucking activity produces substantial dust which can reduce the average
    output of the plant.
