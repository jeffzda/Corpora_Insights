  project_name: RayGen PV Ultra Pilot Demonstration Facility, Newbridge
  what_happened: Component suppliers unfamiliar with optics or photovoltaics were
    initially engaged for the innovative PV Ultra system, creating quality and performance
    risks during supply and manufacturing phases. Screening and education of suppliers
    was required to achieve satisfactory results.
  lesson_learnt: Screen suppliers specifically for capability with optics and photovoltaics
    before engagement — suppliers unfamiliar with these domains will require targeted
    education and training before they can deliver to specification on novel concentrated
    PV systems.
