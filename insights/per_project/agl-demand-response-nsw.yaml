- record_id: ARENA-DLV-42317
  source_title: Evaluation of ARENA's 2017-2020 Demand Response Portfolio
  publish_date: 2021-06
  project_name: AGL Demand Response (NSW)
  what_happened: AGL reported that ARENA staff turnover over the course of the three-year
    program introduced inefficiencies in project coordination, as continuity of knowledge
    and relationships was disrupted when ARENA personnel changed.
  lesson_learnt: Maintain stable ARENA account management across multi-year funded
    programs — staff turnover disrupts institutional knowledge and relationship continuity,
    and is a recurring source of coordination inefficiency in long-duration portfolios.
