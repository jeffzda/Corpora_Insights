- record_id: ARENA-DLV-42318
  source_title: Evaluation of ARENA's 2017-2020 Demand Response Portfolio
  publish_date: 2021-06
  project_name: AGL Demand Response (NSW)
  what_happened: Public milestone reports for the AGL project were reportedly published
    up to 12–18 months after the end of the relevant project year, with the reasons
    for delay unclear to the funding recipient.
  lesson_learnt: Set and enforce a maximum publication timeline for milestone reports
    (e.g. within 60 days of submission sign-off) and communicate reasons for any delays
    to funding recipients — delays of 12–18 months undermine public value of knowledge
    sharing and frustrate recipients.
  issue_severity: minor
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: government/public-sector body
  delay_category: internal governance/resourcing
