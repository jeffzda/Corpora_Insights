- record_id: ARENA-DLV-42316
  source_title: Evaluation of ARENA's 2017-2020 Demand Response Portfolio
  publish_date: 2021-06
  project_name: AGL Demand Response (NSW)
  what_happened: AGL's residential DR program grew from an initial 750 customers to
    approximately 50,000 participants, and C&I DR and behavioural DR programs both
    transitioned to business-as-usual activities following ARENA funding, demonstrating
    successful commercialisation of both segments.
  lesson_learnt: Fund residential DR programs with realistic expectations of slow
    initial uptake but significant scaling potential — AGL's program grew from 750
    to 50,000 customers, demonstrating that ARENA-funded trials can catalyse mass-market
    residential DR adoption even when initial numbers appear modest.
