- record_id: ARENA-DLV-42315
  source_title: Evaluation of ARENA's 2017-2020 Demand Response Portfolio
  publish_date: 2021-06
  project_name: AGL Demand Response (NSW)
  what_happened: AGL scored its demand response technology at TRL 9 (proven operational)
    at project commencement, but encountered multiple technical issues when integrating
    Greensync site monitoring equipment at customer sites, suggesting the pre-project
    TRL assessment was overly optimistic.
  lesson_learnt: Conduct rigorous pre-project technology readiness assessments with
    on-site validation before assigning TRL scores — self-assessed TRL 9 ratings that
    are not independently verified can mask integration risks that only emerge during
    deployment and testing.
