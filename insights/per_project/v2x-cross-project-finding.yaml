- record_id: ARENA-DLV-29565
  source_title: DEIP - DEIP Dive - Event Summary 2023
  publish_date: 2023-07
  project_name: V2X (cross-project finding)
  what_happened: The high cost of bidirectional chargers relative to standard EV chargers
    was identified as a barrier to V2X adoption, attributed to the combination of
    hybrid inverter technology (two-way power conversion and galvanic isolation) plus
    associated R&D and marketing costs.
  lesson_learnt: Business cases for V2X deployment must account for the significant
    cost premium of bidirectional chargers, which reflects genuine technological complexity
    (two-way conversion, galvanic isolation) rather than market inefficiency — cost
    reduction pathways depend on R&D investment and volume scale, not simply on increased
    competition.
