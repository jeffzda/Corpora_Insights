- record_id: ARENA-DLV-29564
  source_title: DEIP - DEIP Dive - Event Summary 2023
  publish_date: 2023-07
  project_name: V2X (cross-project finding)
  what_happened: Panel experts at the 2023 DEIP Dive projected 2025 as the likely
    go-live date for CCS-based V2X in Australia, contingent on testing standards,
    commercial availability and vehicle OEM readiness aligning simultaneously, with
    a rapid-acceleration tipping point expected once these conditions converge.
  lesson_learnt: V2X-dependent projects should not proceed on a timeline assumption
    that any single readiness condition (standards, OEM availability, grid tariffs)
    will arrive ahead of the others — the go-live depends on the simultaneous convergence
    of all three, and delay in any one element defers the whole ecosystem; project
    plans should include trigger-based gating rather than fixed dates.
  issue_severity: minor
