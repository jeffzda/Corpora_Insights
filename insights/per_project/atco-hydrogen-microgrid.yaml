- record_id: ARENA-DLV-19410
  source_title: 'Clean Energy Innovation Hub - ATCO H2 Microgrid: 2018/ARP008 Project
    Results and Lessons Learnt'
  publish_date: 2019-12
  project_name: ATCO Clean Energy Innovation Hub (CEIH)
  what_happened: ATCO scoped the CEIH to include a structured supplier outreach programme
    to source diverse equipment from multiple vendors (gas engine/turbine, inverter/controller,
    PV, battery, and electrolyser suppliers) with the explicit aim of building long-term
    supply chain relationships alongside technical testing.
  lesson_learnt: Treat a demonstration project's equipment procurement as an opportunity
    to build strategic supply-chain relationships, not merely to source components
    — engaging multiple competing suppliers across each technology category simultaneously
    generates market intelligence and partnership options that are difficult to develop
    through sequential procurement after commercial deployment begins.
