- record_id: ARENA-DLV-19403
  source_title: 'Clean Energy Innovation Hub - ATCO H2 Microgrid: 2018/ARP008 Project
    Results and Lessons Learnt'
  publish_date: 2019-12
  project_name: ATCO Clean Energy Innovation Hub (CEIH)
  what_happened: During stress testing of the hydrogen blending system, a gross flow
    rate reduction of 83% (from 30 m³/h to 5 m³/h) caused the hydrogen blend concentration
    to spike transiently from a target of 5% to 18% H2 for approximately two minutes
    before recovering to the target value within ten minutes.
  lesson_learnt: Design hydrogen blending control systems to account for large transient
    flow disturbances — gas chromatograph cycle times create a measurement lag that
    can allow blend concentrations to overshoot safety thresholds during sudden demand
    changes; safety interlocks should be set with sufficient margin to accommodate
    the worst-case GC update interval.
  issue_severity: minor
  project_type: multi-technology/hybrid
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: network business
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated integration
  intervention_note: The system recovered autonomously to the target blend within
    approximately 10 minutes; the GC safety interlock was configured to close all
    hydrogen valves if H2 vol% reached 20%, providing a margin above the observed
    18% peak.
  transferability: narrow
  delay_magnitude: null
  technology_domain: hydrogen
  source_pages: &id003
  - 12
  evidence_excerpt: System 'stress' testing of gross non-typical changes to the flow
    rate from 30m3/h down 5m3/h (83% flow decrease), saw the steady state 5 ± 0.1%
    H2 gas blend temporarily increase to 18% H2 for a 2-minute GC cycle time period
    update, before decreasing back to the steady state target value within approximately
    10 minutes.
  confidence_note: null
