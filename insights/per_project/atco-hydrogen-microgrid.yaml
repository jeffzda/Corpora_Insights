- record_id: ARENA-DLV-19409
  source_title: 'Clean Energy Innovation Hub - ATCO H2 Microgrid: 2018/ARP008 Project
    Results and Lessons Learnt'
  publish_date: 2019-12
  project_name: ATCO Clean Energy Innovation Hub (CEIH)
  what_happened: ATCO built the CEIH as a deliberate scale-up from its earlier 2016
    Vasse residential Hybrid Energy System demonstration, using the prior project's
    operational insights into natural gas back-up generation and power intermittency
    as a foundation for the commercial-scale hydrogen microgrid design.
  lesson_learnt: Structured technology stepping — running a small residential demonstration
    before scaling to commercial — materially reduces delivery risk on novel multi-technology
    projects; project developers should plan an explicit capability-building stage
    at sub-commercial scale before committing to a full commercial demonstration.
