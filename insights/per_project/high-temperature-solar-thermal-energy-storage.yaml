- record_id: ARENA-DLV-10808
  source_title: High Temperature Solar Thermal Energy Storage via Manganese-Oxide
    Based Redox Cycling Report
  publish_date: 2019-05
  project_name: High Temperature Solar Thermal Energy Storage via Manganese-Oxide
    Based Redox Cycling
  what_happened: Despite achieving a higher LCOE than the state-of-the-art molten
    salt reference plant in the baseline design, the Fe67 system demonstrated lower
    predicted costs for both the receiver and storage units — attributed to the simplicity
    of the receiver design, the low cost of the Fe67 storage material, and a low-cost
    refractory-lined tank concept. These partial cost advantages were insufficient
    to offset the high ORHX and particle transport costs.
  lesson_learnt: Novel thermochemical storage systems can achieve genuine cost advantages
    in specific subsystems (receiver, storage material, tanks) even where overall
    system cost remains uncompetitive; design development programmes should isolate
    and protect these cost-advantaged subsystems while targeting cost reduction efforts
    specifically at the high-cost components (ORHX, particle transport) to improve
    overall competitiveness.
