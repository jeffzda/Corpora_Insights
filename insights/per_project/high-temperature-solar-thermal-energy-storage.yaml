- record_id: ARENA-DLV-10803
  source_title: High Temperature Solar Thermal Energy Storage via Manganese-Oxide
    Based Redox Cycling Report
  publish_date: 2019-05
  project_name: High Temperature Solar Thermal Energy Storage via Manganese-Oxide
    Based Redox Cycling
  what_happened: Hot exhaust gases exiting the system at 243°C were found to carry
    an exergy content of 20.8 MW (for a 75 MWe system) that was not fully recovered
    in the baseline design, representing an unrealised efficiency improvement opportunity.
    The high gas outlet temperature was attributed to a pinch-point limitation in
    the HRSG where the gas cooling curve diverges from the steam heating curve.
  lesson_learnt: High-temperature thermochemical CSP system designs should explicitly
    incorporate feedwater preheating or other heat recovery pathways for HRSG exhaust
    streams — the pinch-point constraint in the HRSG should be addressed through optimised
    heat exchanger design to capture available exergy and improve overall solar-to-electric
    efficiency.
