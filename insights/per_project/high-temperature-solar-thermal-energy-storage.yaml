- record_id: ARENA-DLV-10807
  source_title: High Temperature Solar Thermal Energy Storage via Manganese-Oxide
    Based Redox Cycling Report
  publish_date: 2019-05
  project_name: High Temperature Solar Thermal Energy Storage via Manganese-Oxide
    Based Redox Cycling
  what_happened: The project changed its primary storage material during execution
    — from the originally scoped manganese oxide (Mn2O3) to a mixed iron-manganese
    oxide spinel (Fe,Mn)2O3 with a Fe:Mn ratio of 2:1 (Fe67) — following collaborative
    research between ANU and the University of Colorado that identified superior performance
    characteristics in the mixed oxide.
  lesson_learnt: Research projects investigating thermochemical storage materials
    should build in formal material selection review gates that allow for substitution
    of the baseline material if collaborative research identifies superior alternatives;
    locking in a specific material in the project scope without review provisions
    risks foregoing better-performing options discovered mid-project.
