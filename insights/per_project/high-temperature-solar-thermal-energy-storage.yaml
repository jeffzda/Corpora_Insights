- record_id: ARENA-DLV-10804
  source_title: High Temperature Solar Thermal Energy Storage via Manganese-Oxide
    Based Redox Cycling Report
  publish_date: 2019-05
  project_name: High Temperature Solar Thermal Energy Storage via Manganese-Oxide
    Based Redox Cycling
  what_happened: The project found that heliostat field optical efficiency drops sharply
    at field fringes — from ~80% near the tower to below 40% at the fringe — making
    additional thermal capacity at the field boundary more than twice as expensive
    per unit as capacity near the tower. This constrained feasible field size to approximately
    300 MWth, limiting the achievable solar concentration ratio and hence receiver
    operating temperature.
  lesson_learnt: Solar field sizing for high-concentration CSP applications must account
    for rapidly declining marginal optical efficiency at field fringes; investment
    in fringe heliostats delivers less than half the thermal capacity per dollar compared
    to near-tower heliostats, so field design optimisation should prioritise concentration
    ratio over raw thermal aperture.
