- record_id: ARENA-DLV-10801
  source_title: High Temperature Solar Thermal Energy Storage via Manganese-Oxide
    Based Redox Cycling Report
  publish_date: 2019-05
  project_name: High Temperature Solar Thermal Energy Storage via Manganese-Oxide
    Based Redox Cycling
  what_happened: A techno-economic analysis of the Fe67 iron-manganese oxide redox
    thermochemical storage system produced an LCOE estimate of 224 AUD/MWh — approximately
    8% higher than the current state-of-the-art molten salt reference plant — driven
    primarily by the high cost of the oxidation reactor/heat exchanger (~$159M extra)
    and the bucket elevator particle transport system (~$78M extra).
  lesson_learnt: When designing high-temperature thermochemical storage systems, the
    oxidation reactor/heat exchanger and particle transport infrastructure represent
    the dominant cost drivers that must be addressed early in the design process —
    a 50% reduction in ORHX costs alone could bring LCOE below the molten salt state-of-the-art,
    making these components the priority targets for value engineering.
