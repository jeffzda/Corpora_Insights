  source_title: High Temperature Solar Thermal Energy Storage via Manganese-Oxide
    Based Redox Cycling Report
  publish_date: 2019-05
  project_name: High Temperature Solar Thermal Energy Storage via Manganese-Oxide
    Based Redox Cycling
  what_happened: Current state-of-the-art surround heliostat fields with CPC secondary
    concentrators were found to limit receiver operating temperature to approximately
    1,300°C, constraining storage temperature to ~1,200°C and power cycle temperature
    to ~1,100°C — below the ~1,300°C needed to fully exploit combined-cycle efficiency
    benefits. This limitation reduced achievable power cycle efficiency gains.
  lesson_learnt: Future high-temperature thermochemical CSP designs should target
    substantially higher solar concentration ratios than current state-of-the-art
    heliostat fields can deliver; without achieving receiver flux of approximately
    3 MW/m² at the aperture, the full efficiency advantage of combined-cycle power
    blocks over conventional steam cycles cannot be realised.
