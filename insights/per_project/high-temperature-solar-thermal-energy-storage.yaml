  what_happened: The project concluded that the Fe67 iron-manganese oxide thermochemical
    storage technology remains entirely undemonstrated at any relevant scale, and
    that demonstrating its predicted performance would require a substantial scale-up
    effort to approximately 100 kW or above — well beyond the scope of this initial
    feasibility study.
  lesson_learnt: Techno-economic analyses of novel thermochemical storage materials
    should be accompanied by a clear scale-up roadmap with explicit demonstration
    milestones; feasibility-stage LCOE estimates for undemonstrated technologies carry
    high uncertainty and should not be used for investment decisions without at least
    pilot-scale experimental validation at ~100 kW or above.
