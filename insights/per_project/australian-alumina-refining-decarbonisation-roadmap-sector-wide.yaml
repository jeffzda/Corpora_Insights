- record_id: ARENA-DLV-69211
  source_title: A Roadmap for Decarbonising Australian Alumina Refining
  publish_date: 2022-11
  project_name: Australian Alumina Refining Decarbonisation Roadmap (Sector-Wide)
  what_happened: Workshop participants identified that competition for skilled labour
    (engineering, construction, and transition-related skills) across multiple sectors
    simultaneously pursuing decarbonisation represented a material barrier to implementation
    timing, with skills in high demand creating labour shortages.
  lesson_learnt: Industrial decarbonisation programs should begin workforce planning
    and early engagement with specialist contractors well ahead of construction, because
    simultaneous decarbonisation activity across multiple heavy industries creates
    sector-wide skilled labour shortages that cannot be resolved at short notice —
    projects that wait until procurement stage to engage the labour market risk delays
    and cost escalation.
