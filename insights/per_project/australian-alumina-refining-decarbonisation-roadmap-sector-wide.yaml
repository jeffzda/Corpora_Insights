  what_happened: Trials and demonstrations of emerging low-emissions technologies
    for alumina refining were identified as inherently capital-intensive and complex,
    with a higher risk of cost overruns and schedule delays than conventional industrial
    projects. The capital intensity of alumina refining infrastructure and the complexity
    of integrating new technologies into operating refineries compound these risks.
  lesson_learnt: Budget contingencies for first-of-a-kind industrial decarbonisation
    demonstration projects in alumina refining should be set higher than for conventional
    industrial projects — the capital-intensive nature of refinery integration, combined
    with the early TRL of the technologies, creates elevated cost overrun and schedule
    delay risk that standard contingency allowances will not cover.
