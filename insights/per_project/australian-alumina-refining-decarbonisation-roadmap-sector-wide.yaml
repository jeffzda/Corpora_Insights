  what_happened: Workshop participants identified that long-term grid-based electrical
    storage requirements for alumina refineries would need to span 1–2 months to cover
    seasonal electricity scarcity periods (wet/dry season transitions in Queensland
    and spring/autumn shoulder seasons in WA), and that short-term storage of less
    than 8 hours would also be needed — requiring gigawatt-scale off-site storage
    infrastructure not yet in existence.
  lesson_learnt: Industrial electrification projects in process-intensive industries
    with continuous heat requirements should quantify both short-term (sub-8-hour)
    and long-term (seasonal, 1–2 month) storage needs during feasibility, rather than
    assuming that grid firming or standard battery storage will be sufficient — seasonal
    storage requirements at the scale needed for alumina refining will require off-site,
    gigawatt-scale infrastructure development that must be planned as a separate,
    coordinated ecosystem initiative.
