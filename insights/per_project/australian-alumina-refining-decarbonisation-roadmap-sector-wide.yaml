- record_id: ARENA-DLV-69205
  source_title: A Roadmap for Decarbonising Australian Alumina Refining
  publish_date: 2022-11
  project_name: Australian Alumina Refining Decarbonisation Roadmap (Sector-Wide)
  what_happened: Electric calcination was assessed at TRL 4 at the time of the Roadmap
    — the lowest technology readiness of all four Key Decarbonisation Technologies
    — with high capital intensity and a requirement for large-scale firm renewable
    electricity, meaning no near-term commercial deployment was feasible.
  lesson_learnt: Electric calcination for alumina refining should be planned as a
    medium-term (post-2030) investment only; project developers and funders allocating
    capital before 2030 should treat it as R&D/demonstration spend rather than commercial
    deployment, and business cases must explicitly account for TRL 4 technical risk
    and the dependency on firm renewable electricity supply infrastructure that does
    not yet exist at required scale.
