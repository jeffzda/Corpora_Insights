  what_happened: 'The Roadmap found that replacing fossil fuel boilers with MVR at
    low-temperature Australian refineries would increase grid electricity demand in
    two ways simultaneously: to power the MVR equipment itself, and to replace electricity
    previously generated by on-site cogeneration units that used waste steam from
    the fossil fuel boilers — creating a step-change increase in grid electricity
    dependency.'
