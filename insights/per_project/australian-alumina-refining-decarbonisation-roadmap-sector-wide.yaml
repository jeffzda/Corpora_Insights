- record_id: ARENA-DLV-69227
  source_title: A Roadmap for Decarbonising Australian Alumina Refining
  publish_date: 2022-11
  project_name: Australian Alumina Refining Decarbonisation Roadmap (Sector-Wide)
  what_happened: The Roadmap found that increasing capital intensity in the alumina
    refining industry (rising from $0.27 per dollar of wages invested in plant capital
    in 2016 to $0.36 in 2021–22) was driving greater reliance on external financing,
    and that financial institutions' decarbonisation commitments (through frameworks
    like PCAF) were beginning to constrain capital access for emissions-intensive
    operations.
  lesson_learnt: Industrial operators in emissions-intensive sectors should proactively
    engage with lenders to understand how financed emissions policies will affect
    their cost of capital and loan covenants — in the absence of a clear decarbonisation
    roadmap, the rising capital intensity of alumina refining combined with lender
    net-zero commitments creates a risk of constrained access to capital that can
    delay or prevent decarbonisation investment.
  issue_severity: moderate
  project_type: industrial decarbonisation
