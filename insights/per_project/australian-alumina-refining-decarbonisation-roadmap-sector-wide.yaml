  publish_date: 2022-11
  project_name: Australian Alumina Refining Decarbonisation Roadmap (Sector-Wide)
  what_happened: MVR technology for alumina refining had reached TRL 7–8 for low temperature
    applications but only TRL 4–5 for high temperature applications at the time of
    the Roadmap, meaning it was not yet commercially proven for high-temperature refineries
    and required further demonstrations before full-scale deployment.
  lesson_learnt: Technology maturity assessments for industrial decarbonisation projects
    must distinguish between sub-variants of the same technology (e.g. low vs. high
    temperature MVR) — deploying a technology proven at one operating condition into
    a different operating envelope requires separate demonstration, and planning timelines
    should not assume transferability between conditions without evidence.
