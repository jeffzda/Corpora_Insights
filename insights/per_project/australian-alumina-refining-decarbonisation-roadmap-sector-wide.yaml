  source_title: A Roadmap for Decarbonising Australian Alumina Refining
  publish_date: 2022-11
  project_name: Australian Alumina Refining Decarbonisation Roadmap (Sector-Wide)
  what_happened: All four Key Decarbonisation Technologies (MVR, electric boilers,
    hydrogen calcination, electric calcination) require 3–5 GW of new firmed renewable
    electricity supply across the industry at full-scale deployment, an amount comparable
    to the energy transition of a small Australian state. This infrastructure does
    not currently exist, and its absence is a primary barrier to technology deployment.
  lesson_learnt: Industrial decarbonisation projects that depend on large-scale renewable
    electricity supply cannot be planned in isolation from energy market and transmission
    infrastructure investment — project developers should engage with grid planners,
    regulators, and the NEM/WEM market bodies early to ensure that the required electricity
    supply and transmission infrastructure is included in long-term network planning.
