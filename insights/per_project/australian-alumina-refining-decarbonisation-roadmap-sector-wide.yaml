  project_name: Australian Alumina Refining Decarbonisation Roadmap (Sector-Wide)
  what_happened: Renewable hydrogen for calcination was identified as not currently
    cost-competitive or available at the required scale, with hydrogen needing to
    be below $2/kg to be viable. The industry's proximity to proposed hydrogen hubs
    was identified as potentially improving cost competitiveness, but large external
    infrastructure development was required before hydrogen calcination could be deployed.
  lesson_learnt: Projects planning to use renewable hydrogen as a feedstock or fuel
    should not assume hydrogen supply availability or cost-competitiveness at the
    time of design — project feasibility should be explicitly contingent on the development
    of nearby hydrogen hub infrastructure, and offtake agreements or hub participation
    should be secured before committing to hydrogen-dependent technology configurations.
