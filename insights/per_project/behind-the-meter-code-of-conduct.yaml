- record_id: ARENA-DLV-52520
  source_title: ARENA's Virtual Power Plant Knowledge Sharing Workshop Summary
  publish_date: 2019-03
  project_name: Behind-the-Meter Code of Conduct
  what_happened: Consumer protections under the National Energy Consumer Framework
    were predicated on sales of energy in the NEM and did not capture behind-the-meter
    products and services including VPPs, leaving VPP customers without formal consumer
    protection.
  lesson_learnt: When deploying VPP or behind-the-meter products, proponents should
    not assume that standard energy consumer protections apply — the NECF gap for
    BTM services means customer contracts and program terms must explicitly address
    key consumer risks (exit fees, override rights, battery degradation, data privacy)
    that regulated retailers must cover by law.
