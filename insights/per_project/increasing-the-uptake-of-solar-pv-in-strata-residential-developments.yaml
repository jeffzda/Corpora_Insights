    Gum Valley (WGV)
  what_happened: The commercial-scale feed-in-tariff (FiT) applicable to the body
    corporate as a commercial-scale customer was 0 c/kWh, meaning a large volume of
    surplus solar electricity was exported to the grid at no value. This represented
    a significant lost revenue opportunity and reduced the financial attractiveness
    of the model.
  lesson_learnt: Size solar/battery systems to minimise grid export or develop market
    mechanisms (P2P trading between buildings, market trading arrangements) to monetise
    surplus generation — the 0 c/kWh commercial FiT means any export to the grid is
    lost revenue, directly undermining investment returns for strata solar/battery
    systems in Western Australia.
