- record_id: ARENA-DLV-24516
  source_title: 'Lessons learned: Deployment of the solar storage sharing governance
    model at the White Gum Valley'
  publish_date: 2021-02
  project_name: Deployment of the Solar Storage Sharing Governance Model at White
    Gum Valley (WGV)
  what_happened: ARENA's OPEX funding covered the operation of the solar/battery assets
    for only three years per site under the grant, meaning that after the project
    concluded the ongoing OPEX (estimated at $8,000 per site per year by the engineering
    consultant, or approximately $300 per year for batteries plus panel cleaning costs
    per Curtin's estimate) would need to be covered by strata councils — whose capacity
    and willingness to fund this was not tested within the project period.
  lesson_learnt: Grant-funded demonstration projects for shared strata solar/battery
    systems should ensure the governance and financial model for long-term OPEX is
    operationally tested and embedded with the strata body corporate before the grant-funded
    operating period concludes — otherwise ongoing maintenance funding is left to
    a strata body with no prior experience of managing it.
