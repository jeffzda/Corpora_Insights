- record_id: ARENA-DLV-24504
  source_title: 'Lessons learned: Deployment of the solar storage sharing governance
    model at the White Gum Valley'
  publish_date: 2021-02
  project_name: Deployment of the Solar Storage Sharing Governance Model at White
    Gum Valley (WGV)
  what_happened: The initial strata manager at the Gen Y development, despite being
    fully aware of the governance model and participating in its design, reverted
    to a business-as-usual (BAU) approach at the first AGM — simply dividing the cost
    of grid-sourced energy equally across the three dwellings without charging for
    or allocating solar/battery consumption. One resident consumed the majority of
    the solar/battery energy but paid no more than others.
  lesson_learnt: Contractual or governance mechanisms must be established to prevent
    strata managers from defaulting to BAU electricity management — participation
    in governance model design meetings does not guarantee implementation. Require
    strata managers to formally commit to the governance model prior to settlement,
    and include the governance model as a binding term of the strata management agreement.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: research organisation/university
  delay_category: internal governance/resourcing
  failure_mode: coordination & stakeholders
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: After one month of BAU operation, the research team used the
    real-world cost comparison to persuade residents; the owners' council voted to
    replace the strata manager with one willing to implement the governance model.
  transferability: broad
  delay_magnitude: 1-3 months
  technology_domain: battery storage
  source_pages: &id035
  - 29
  - 30
  evidence_excerpt: Although the initial strata manager was fully aware of the research
