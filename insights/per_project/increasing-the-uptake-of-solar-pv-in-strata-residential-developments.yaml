  what_happened: The Strata Titles Act 1985 and Strata Titles General Regulations
    1996 were successfully used as the legal vehicle to enable shared ownership of
    solar PV and battery assets across three medium-density residential developments,
    providing a replicable and legally validated governance framework for Australia.
