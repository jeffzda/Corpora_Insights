- record_id: ARENA-DLV-24517
  source_title: 'Lessons learned: Deployment of the solar storage sharing governance
    model at the White Gum Valley'
  publish_date: 2021-02
  project_name: Deployment of the Solar Storage Sharing Governance Model at White
    Gum Valley (WGV)
  what_happened: The governance model's equitable P2P electricity allocation and billing
    system — where residents receive a unit-entitlement share of onsite generation
    and are rewarded for consuming less than their allocation — was successfully demonstrated
    as financially superior to BAU equal bill-splitting, which unfairly penalised
    low-consumption residents and rewarded heavy users.
  lesson_learnt: Shared solar/battery governance models must implement unit-entitlement-based
    allocation and P2P trading rather than equal bill-splitting — BAU equal division
    of electricity bills was demonstrated to be inequitable and failed to align resident
    behaviour with the renewable asset's value, while the governance model created
    measurable financial fairness and behavioural incentives.
