  what_happened: 'In the Western Australian Wholesale Electricity Market (WEM), strata
    residents were found to be prohibited from trading electricity through the network
    to third parties due to two specific regulatory barriers: Synergy''s exclusive
    franchise over customers consuming less than 50 MWh per annum, and Western Power''s
    self-imposed restriction of one user per network connection point (NMI).'
  lesson_learnt: Strata solar-storage projects in WA must design their business model
    around behind-the-meter trading only until through-the-meter regulatory barriers
    are removed — proponents should monitor Western Power's Access Arrangement revision
    and WEM reforms, and avoid business cases that depend on through-the-meter revenue
    in the short term.
