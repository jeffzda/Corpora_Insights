- record_id: ARENA-DLV-58227
  source_title: Increasing the Uptake of Solar PV and Battery Storage in Strata Residential
    Developments
  publish_date: 2021-01
  project_name: White Gum Valley (WGV) Shared Solar PV and Battery Storage Project
  what_happened: SHAC residents were unable to benefit from discounted electricity
    as originally anticipated because Access Housing, as the system owner operating
    under a rental tenure model, was bound by Synergy's tariff regulations and could
    not pass on the expected electricity cost savings.
  lesson_learnt: In social/affordable housing strata developments, the electricity
    pricing and tariff framework applicable to the owning entity must be confirmed
    with the retailer and regulator before designing the commercial model — tariff
    regulatory constraints on non-owner-occupier structures can prevent the key consumer
    benefit (lower electricity costs) from being delivered.
