  what_happened: Despite one quarter of all Australian homes having rooftop solar
    by 2018, solar uptake in medium-density strata housing remained very low across
    all states — the top medium-density postcodes in NSW, QLD, VIC and WA all showed
    minimal solar penetration relative to total dwelling counts, demonstrating that
    the strata barrier had effectively excluded apartment residents from the solar
    transition.
  lesson_learnt: Programs seeking to increase solar uptake in medium-density housing
    cannot rely on organic market adoption — the strata governance barrier is structural
    and will not self-resolve; targeted policy intervention, open-source governance
    models, and tailored financing products are all required to unlock this market
    segment.
