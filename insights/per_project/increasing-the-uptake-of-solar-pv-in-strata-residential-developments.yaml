  what_happened: Analysis of Australian cities found that between 25% and 47% of CBD
    buildings meet the height and zoning criteria for adoption of shared strata solar-storage
    — with Melbourne at 47%, Perth at 31%, Adelaide at 30% and Darwin at 25% — demonstrating
