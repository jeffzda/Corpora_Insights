  what_happened: The NPV of both Evermore (−$28,669) and SHAC (−$97,796) were negative
    without ARENA grant funding, as the engineering designs were costed in 2015 before
    battery technology became financially viable (from 2016 onward); Gen Y alone had
    a positive NPV of $13,965.
  lesson_learnt: For early-stage demonstration projects involving battery storage,
    financial viability assessments should reflect current technology cost curves
    rather than prices at initial design; ARENA or similar grant funding is a necessary
    precondition for commercial viability in first-mover strata battery projects,
    and this dependency should be explicitly modelled in NPV analysis.
