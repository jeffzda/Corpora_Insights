  source_title: Increasing the Uptake of Solar PV and Battery Storage in Strata Residential
    Developments
  publish_date: 2021-01
  project_name: White Gum Valley (WGV) Shared Solar PV and Battery Storage Project
  what_happened: Self-sufficiency rates across all three WGV sites were sub-optimal
    because PV export control was not well managed (particularly at Gen Y and Evermore)
    and battery dispatch was not optimised for periods of higher consumption, resulting
    in unnecessary grid imports.
  lesson_learnt: Shared solar-battery systems for strata should include optimised
    dispatch control strategies — specifically, better PV export control and battery
    scheduling limited to high-consumption periods — and future projects should investigate
    day-ahead forecasting to further improve self-sufficiency and network peak smoothing.
