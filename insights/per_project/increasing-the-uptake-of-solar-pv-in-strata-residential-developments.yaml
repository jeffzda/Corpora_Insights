  project_name: White Gum Valley Project
  what_happened: Residents were largely unaware of the governance structure, the financial
    settlement model, and the peer-to-peer (P2P) energy trading capability of the
    WGV system. For many residents, the CUSP researcher interview was the first time
    they became aware these features existed, despite the information being available
    via the internet and printed literature.
  lesson_learnt: Passive information provision (websites, printed literature) is insufficient
    to ensure residents understand complex shared energy systems — future projects
    should implement a structured, active engagement and education program including
    workshops, regular communications, and hands-on demonstrations timed from commissioning
    through the first 12 months of operation.
