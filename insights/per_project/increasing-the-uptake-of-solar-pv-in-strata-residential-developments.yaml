  publish_date: 2021-02
  project_name: Deployment of the Solar Storage Sharing Governance Model at White
    Gum Valley (WGV)
  what_happened: Strata management companies across the WGV sites showed resistance
    to adopting the solar/storage governance model, preferring set-and-forget BAU
    electricity management (equal bill splitting or sub-metering at residential tariff
    despite bulk electricity being purchased at reduced rates). The BAU approach created
    inequitable outcomes and failed to capture the value of the solar/storage assets
    for residents.
  lesson_learnt: Strata management companies are a structural bottleneck for shared
    solar/battery governance model deployment — their default BAU approaches are incompatible
    with equitable solar/battery allocation. Select strata managers with demonstrated
    willingness to operate the model before development sales commence, and ensure
    the governance model is embedded in the strata management contract, not just communicated
    at design meetings.
