  source_title: White Gum Valley Project Market Acceptance Report
  publish_date: 2018-12
  project_name: White Gum Valley Project
  what_happened: Two of the three WGV developments (SHAC and Evermore) returned a
    negative NPV without ARENA funding — SHAC at –$97,796 and Evermore at –$28,670
    — meaning shared solar-battery systems at this scale were not commercially viable
    without grant support at the time of the project.
  lesson_learnt: Shared solar-battery systems in medium-to-high-density strata are
    not yet commercially self-sustaining without subsidy — future proponents should
    conduct detailed NPV analysis inclusive of all costs early in development, and
    engage property developers to understand what investment triggers (beyond NPV)
    such as planning compliance, market differentiation, and energy ratings could
    make the proposition viable.
