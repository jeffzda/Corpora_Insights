  what_happened: There was no existing Australian model or framework for installing,
    managing, and operating shared solar PV and battery assets in medium/high-density
    residential buildings prior to this project, which was identified as a key barrier
    to uptake of renewables in the apartment sector.
  lesson_learnt: The absence of a clear governance framework — not technology cost
    or performance — was the primary barrier to solar/battery uptake in Australian
    strata residential developments. Future policy and program design should prioritise
    developing and distributing open-source governance frameworks as an enabler, rather
    than focusing solely on technology cost reduction.
