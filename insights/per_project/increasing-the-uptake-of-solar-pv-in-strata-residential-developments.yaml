- record_id: ARENA-DLV-12201
  source_title: White Gum Valley Project Market Acceptance Report
  publish_date: 2018-12
  project_name: White Gum Valley Project
  what_happened: The SHAC and Evermore developments required larger battery systems
    and inverters that were not on the Clean Energy Council's approved list for AS
    4777 compliance. Western Power could not allow grid connection until the equipment
    was certified, causing significant delays — the SHAC development did not have
    an operational solar-battery system until more than a year after the apartments
    were constructed.
  lesson_learnt: Source all hardware (PV systems, inverters and batteries) from equipment
    pre-certified to AS 4777 and the CEC approved list. Where non-certified hardware
    is required, factor in at least 6–12 months for the certification process — testing
    of large inverters had to be conducted in Europe as no Australian laboratory could
    run the necessary tests.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: research organisation/university
  delay_category: commissioning/integration
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: poor scoping
  intervention_note: Testing was conducted in Europe, and after CEC required a further
    review from an Australian laboratory, both the SHAC and Evermore battery systems
    were ultimately added to the approved list, enabling grid connection.
  transferability: broad
  delay_magnitude: 1-3 years
  technology_domain: battery storage
  source_pages: &id001
  - 16
  evidence_excerpt: Issues with compliance became apparent as the SHAC and Evermore
    projects required larger battery systems and inverters, which were not on the
    CEC's approved list. As a result, there were significant delays, as Western Power
    was not able to allow connection of the SHAC and Evermore batteries and inverters
    to the network until the equipment was deemed compliant with AS 4777... This process
    caused considerable delays, particularly for the SHAC development which did not
    have an operational solar-battery system until more than a year after the apartments
    were constructed.
