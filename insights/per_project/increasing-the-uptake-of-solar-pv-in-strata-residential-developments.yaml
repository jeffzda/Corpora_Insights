  what_happened: Legal analysis found that in all Australian jurisdictions, a strata
    company can only act on powers explicitly granted in its governing documentation
    (by-laws, articles, constitution), meaning an existing strata body without appropriate
    powers written in cannot implement a shared DER project without first amending
    its documentation — requiring a majority vote or special resolution.
  lesson_learnt: Before commencing procurement or installation for a shared solar-storage
    project in an existing strata development, verify that the strata company's governing
    documents explicitly authorise it to acquire infrastructure, act as or contract
    with an electricity retailer, and recover costs from residents — amending documentation
    requires a majority or special resolution and adds time to the pre-construction
    phase.
