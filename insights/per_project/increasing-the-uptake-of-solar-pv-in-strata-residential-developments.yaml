  what_happened: No stakeholder was assigned responsibility for informing and educating
    residents about the governance model, financial settlement system, or P2P trading
    platform; as a result, many residents remained unaware of the trading capability
    throughout the project and could not benefit from it.
  lesson_learnt: In multi-stakeholder shared energy projects, responsibility for resident
    education and ongoing communications must be explicitly assigned to a single named
    party before go-live — in the absence of clear assignment, no party will assume
