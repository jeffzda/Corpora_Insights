  publish_date: 2021-01
  project_name: White Gum Valley (WGV) Shared Solar PV and Battery Storage Project
  what_happened: The WGV governance model was validated by legal experts (Jackson
    McDonald and McCullough Robertson) as viable under Australian commercial, strata,
    and electricity regulation, including for NEM jurisdictions; however, the Strata
    Titles Act differs across states and territories, meaning the model requires jurisdiction-specific
    adaptation and further work is needed for community titling and embedded network
    operator rulings.
  lesson_learnt: Legal validation of a strata solar-battery governance model should
    be obtained for each jurisdiction separately before deployment; the Strata Titles
    Act, electricity licensing, and embedded network rules vary sufficiently between
    states and territories that a model validated in WA cannot be assumed to transfer
    directly to other markets.
