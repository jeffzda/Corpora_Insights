- record_id: ARENA-DLV-58207
  source_title: Increasing the Uptake of Solar PV and Battery Storage in Strata Residential
    Developments
  publish_date: 2021-01
  project_name: White Gum Valley (WGV) Shared Solar PV and Battery Storage Project
  what_happened: 'The Strata Titles Act creates a split incentive in strata developments:
    developers who bear the capital cost of solar PV and battery storage do not benefit
    from reduced energy costs, while tenants who benefit from lower energy costs have
    no incentive to invest in immobile infrastructure they cannot take with them when
    they move.'
  lesson_learnt: Shared solar-battery deployments in strata developments must address
    the developer–tenant split incentive at the policy and commercial structure level
    before proceeding — governance models that assign cost recovery through strata
    levies or sinking funds, or that create direct developer benefits (e.g. higher
    rental yield, property premium), are needed to make the investment viable without
    grant support.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: concept/feasibility
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: commercial & market
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: coordination & stakeholders
  intervention_note: The WGV governance model was designed to address this by having
    the strata management body manage the system as common property, with energy costs
    offset against strata levies.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id055
  - 22
  evidence_excerpt: Thus there is a split incentive where development owners are less
    likely to invest in renewables than renters, as it is the tenants who enjoy the
    benefits of reduced energy costs. However, tenants are also less likely to invest
    in immobile technologies like solar PV, as they are unable to take this investment
    with them when they inevitably move on.
