- record_id: ARENA-DLV-58230
  source_title: Increasing the Uptake of Solar PV and Battery Storage in Strata Residential
    Developments
  publish_date: 2021-01
  project_name: White Gum Valley (WGV) Shared Solar PV and Battery Storage Project
  what_happened: Roof space constraints in medium-density apartment buildings are
    a primary physical barrier to solar PV deployment; high-rise buildings above five
    storeys have a floor-to-roof ratio that allows only minimal generation relative
    to total building consumption, and additional roof fixtures (air conditioning,
    lift housings, safety harnesses) further reduce available panel area.
  lesson_learnt: Shared solar-battery governance models should target buildings of
    four storeys or fewer, where the roof-to-floor-space ratio is sufficient for meaningful
    generation; above five storeys the physical contribution of rooftop PV becomes
    negligible relative to building consumption and the business case deteriorates
    sharply.
