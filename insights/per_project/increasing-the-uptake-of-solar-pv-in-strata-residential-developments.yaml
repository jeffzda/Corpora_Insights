- record_id: ARENA-DLV-12204
  source_title: White Gum Valley Project Market Acceptance Report
  publish_date: 2018-12
  project_name: White Gum Valley Project
  what_happened: Strata managers administering the energy trading and billing systems
    found the financial settlement and energy allocation process too complex and did
    not always fully understand the methodology, meaning the financial settlement
    system was not consistently used to allocate energy across apartments.
  lesson_learnt: Commissioning of shared solar-battery projects should include hands-on
    training with strata managers (or whichever party will administer electricity
    billing/trading) covering at least one complete billing cycle, supported by prescriptive
    and easy-to-follow operating instructions — inadequate handover resulted in the
    settlement system not being properly operated.
