- record_id: ARENA-DLV-12202
  source_title: White Gum Valley Project Market Acceptance Report
  publish_date: 2018-12
  project_name: White Gum Valley Project
  what_happened: Securing AS 4777 certification proved problematic because the proposed
    inverters were too large for any laboratory in Australia to run the necessary
    tests, requiring testing to be conducted in Europe. Even after European tests
    proved positive, the CEC still required further review from an Australian laboratory
    before adding the systems to its approved list.
  lesson_learnt: When specifying large-scale battery inverters for Australian projects,
    verify at design stage whether the equipment can be tested by an Australian laboratory
    — if not, budget time and cost for overseas testing plus a subsequent domestic
    CEC review, which together can consume over a year.
