  publish_date: 2021-01
  project_name: White Gum Valley (WGV) Shared Solar PV and Battery Storage Project
  what_happened: The SHAC renewable energy system was undersized relative to actual
    occupancy and energy use patterns; most SHAC residents (artists) stayed home more
    than a typical household, resulting in higher daytime electricity consumption
    and greater reliance on grid imports compared to the other two sites.
  lesson_learnt: System sizing for shared solar-battery in social or affordable housing
    must account for atypical occupancy patterns (e.g. home-based workers or artists)
    rather than standard residential benchmarks — occupancy assumptions that differ
    from typical households will result in systematic underperformance of self-sufficiency.
