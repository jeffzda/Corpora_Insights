  publish_date: 2018-10
  project_name: White Gum Valley (WGV) Housing Project – Shared Solar Battery Storage
    Governance
  what_happened: The split incentive and principal-agent problem in shared residential
    developments prevented solar PV and battery storage uptake in strata housing —
    owners bear the cost of installation but tenants capture the energy savings, making
    investment economically irrational without a governance framework to resolve this.
  lesson_learnt: Strata solar-storage projects must explicitly address the split incentive
    and principal-agent problem at design stage — the governance model must allocate
    costs and benefits between owners and tenants in a way that makes investment rational
    for both parties, or uptake will not occur.
