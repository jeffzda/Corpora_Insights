  what_happened: Residents across all three developments had a poor understanding
    of how their solar and battery storage systems worked and were largely unaware
    of the governance structure, energy allocation methodology, and P2P trading capability,
    because information was not proactively provided to them.
  lesson_learnt: Resident education must be a structured, ongoing program with frequent
    touch points throughout the project — making information available on websites
    or in printed literature is insufficient, as residents will not seek it out; demonstrating
