  publish_date: 2021-02
  project_name: Deployment of the Solar Storage Sharing Governance Model at White
    Gum Valley (WGV)
  what_happened: The project was funded and quoted in 2015–2016 when integrated battery/solar
    technology was not yet commercially viable (as shown by ARENA's Technology Forward
    Curve). The negative NPV outcomes for SHAC and Evermore (before ARENA contribution)
    were in large part a function of being deployed before the technology cost curve
    reached commercial viability, rather than solely a result of project management
    failures.
  lesson_learnt: Timing of investment in emerging energy technologies relative to
    the technology cost curve materially affects financial viability — projects deploying
    battery/solar systems before the technology forward curve reaches commercial viability
    should expect negative standalone NPVs and should justify investment primarily
    on demonstration value and knowledge generation rather than commercial returns.
