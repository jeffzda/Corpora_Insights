  publish_date: 2021-01
  project_name: White Gum Valley (WGV) Shared Solar PV and Battery Storage Project
  what_happened: Residents' energy use was heavily shaped by fixed daily routines
    (work, cooking, hygiene) that concentrated demand in morning and evening peaks
    outside solar generation hours, limiting the residents' ability to self-consume
    solar directly and reinforcing the need for battery storage to bridge the gap.
  lesson_learnt: Battery storage dispatch strategies for residential strata must be
    designed around fixed household practice patterns rather than assumed flexible
    demand — the interlocked nature of daily routines means demand-shifting is unlikely
    without direct, personalised guidance to residents on the optimal timing of high-energy
    appliances.
