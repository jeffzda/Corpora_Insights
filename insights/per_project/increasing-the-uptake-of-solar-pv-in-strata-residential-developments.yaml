  what_happened: In New South Wales, a developer in the initial period after development
    of a strata scheme cannot cause the owners' corporation to incur a debt — meaning
    a developer-led embedded network arrangement requiring the strata body to make
    payments to an electricity provider cannot be established during this period,
    and common property cannot be altered without a strata development contract.
  lesson_learnt: In NSW, developers must not structure strata solar-storage contracts
    so that the owners' corporation incurs a debt or common property is altered during
    the initial post-development period — instead, delay financial obligations until
    the initial period has passed or structure the arrangement as a strata development
    contract to avoid the legal constraint.
