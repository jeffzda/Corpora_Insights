  what_happened: At the SHAC site, actual project management costs exceeded the quoted
    figure by 93% ($25,107 vs $13,000 quoted) and engineering design costs exceeded
    the quote by 17% ($19,936 vs $17,000). The battery/inverter system cost more than
    doubled from quote to final ($217,600 vs $98,215), contributing to a total project
    cost of $364,085 against an original quote of $229,805 — a 58% overrun.
  lesson_learnt: For first-of-type shared solar/battery installations, allow substantial
    contingency for project management and equipment costs — SHAC's total CAPEX exceeded
    the original quote by 58%, driven by unforeseen approval, firmware, and installation
    coordination issues. Quoted costs from 2015–2016 for novel systems should be treated
    as lower-bound estimates.
