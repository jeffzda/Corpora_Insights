  what_happened: Tax analysis by the ATO found that for owner-occupiers, energy payments
    that offset electricity costs are not assessable income — but if the solar system
    generates more than the household consumes and the excess is sold, the payments
    received become assessable income and the system may be deemed a business activity,
    with the threshold linked to system size relative to household consumption.
  lesson_learnt: Owner-occupiers participating in strata solar-storage schemes should
    size their system to avoid consistently generating more electricity than they
    consume — oversizing relative to household need creates a risk that energy payments
    will be treated as assessable income and that the ATO may deem the activity a
    business, with associated tax obligations.
