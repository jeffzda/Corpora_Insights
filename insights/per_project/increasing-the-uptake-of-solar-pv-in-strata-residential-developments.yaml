  project_name: White Gum Valley (WGV) Shared Solar PV and Battery Storage Project
  what_happened: 'The EV car-sharing scheme at SHAC failed to gain resident uptake:
    the pricing ($10/hour plus a $500 deposit held for one week) was perceived as
    prohibitively expensive, no residents leased the EV for the duration of the trial,
    and one attempt resulted in a negative experience. Additionally, the car-share
    operator''s technology was not fully developed for the EV context (alert system
    for low battery not working) and the East Coast-based operator provided slow communications.'
  lesson_learnt: EV car-sharing components of shared energy trials require prior engagement
    with end-users to set appropriate pricing, and operator selection should favour
    parties with demonstrated EV-specific platform capability and local operational
    presence — pricing and technology barriers that discourage first use can permanently
    suppress uptake in a small residential trial.
