- record_id: ARENA-DLV-53203
  source_title: Alcoa - Renewable Powered Electric Calcination Pilot - Lessons Learnt
    Report 1
  publish_date: 2024-11
  project_name: Alcoa Renewable Powered Electric Calcination Pilot (ECP)
  what_happened: Integration of the novel electric calciner with the existing brownfields
    calciner at Pinjarra revealed unforeseen engineering requirements through design
    reviews and HAZOP studies, including additional pressure and temperature instruments,
    control philosophy modifications, bespoke high-temperature nickel alloy pipework,
    overseas factory acceptance testing of novel heating elements, and additional
    equipment to manage ignition risk from gas migration. These changes required modification
    of multiple key documents and had material impacts on cost and schedule.
  lesson_learnt: In a brownfields setting, early-stage novel technology projects must
    carry sufficient time and cost allowance for design recycle beyond a normal project
    contingency, and equal consideration must be given to how novel equipment design
    will interact with the existing operational plant — HAZOPs and design reviews
    in this project revealed scope that materially impacted both cost and schedule.
