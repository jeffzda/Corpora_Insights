  project_name: Alcoa Renewable Powered Electric Calcination Pilot (ECP)
  what_happened: A contractor submitted a variation claim for installation of an analogue-to-digital
    conversion card that was free-issued to them, because the specific timing of installation
    was not called out in the scope. Alcoa successfully rejected the variation by
    demonstrating the intended outcome was clearly implied by the free issue of the
    equipment.
  lesson_learnt: Ensure scope clarity in contractor agreements by conveying the intent
    of the scope rather than every procedural detail — this enables rejection of spurious
    variations while leaving contractors free to choose optimal construction methods.
