- record_id: ARENA-DLV-53205
  source_title: Alcoa - Renewable Powered Electric Calcination Pilot - Lessons Learnt
    Report 1
  publish_date: 2024-11
  project_name: Alcoa Renewable Powered Electric Calcination Pilot (ECP)
  what_happened: Quality issues on electrical engineering deliverables — including
    incompatible instrument and I/O card selections and incorrectly labelled cables
    in engineering drawings that did not match the cable schedule — required multiple
    additional design cycles and remediation. Poor change management practices meant
    that when individual issues were addressed, downstream knock-on effects were not
    fully traced, compounding the problem and delaying engineering completion.
  lesson_learnt: When electrical engineering quality is at risk due to resource shortages,
    place an owner's electrical engineer in the contractor's office to review work-in-progress
    deliverables before formal issue and to manage the full downstream impact of each
    change — reactive point fixes without tracing knock-on effects will cause compounding
    delays to engineering completion.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: pilot
  lifecycle_phase: development/design
  proponent_type: industrial operator
  delay_category: internal governance/resourcing
  failure_mode: execution & logistics
  outcome_class: re-scoped/adapted
  secondary_failure_mode: coordination & stakeholders
  intervention_note: Alcoa embedded an owner's electrical engineer in the contractor's
    office to review work-in-progress deliverables and manage the full impact of each
    identified change.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: industrial renewables
  source_pages: &id010
  - 9
  - 10
  evidence_excerpt: Mostly evident in the electrical space of the engineering contractor,
    these quality issues were primarily driven by availability and retention of senior
    and experienced electrical engineers. After identification, Alcoa mitigated the
    impact as much as possible by placing an Owners electrical engineer in the engineering
    contractor office to (a) advise on quality prior to submission (work in progress
    deliverables) and (b) work with the team on implementation of the full impact
    of each change identified through reviews.
  confidence_note: secondary_failure_mode of governance/coordination failure reflects
    the explicit poor change management description — upstream cause was resource
    shortage but the delivery mechanism was change management breakdown.
