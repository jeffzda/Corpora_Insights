  publish_date: '2025-02-27'
  project_name: Alcoa Renewable Powered Electric Calcination Pilot (ECP)
  what_happened: When approximately 50 temperature and pressure instruments were found
    to be incompatible with the supplied cabling, the project team avoided a schedule
    impact by reversing the standard activity sequencing — installing cabling before
    instruments — while the incompatibility was resolved, rather than halting all
    work.
  lesson_learnt: Put agile team structures in place before construction begins so
    that when issues arise, sequencing can be flexed and teams can pivot to alternative
    tasks — avoid creating a single point of responsibility for issue resolution and
    instead manage problems collectively.
