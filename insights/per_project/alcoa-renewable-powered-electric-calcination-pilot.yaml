- record_id: ARENA-DLV-53206
  source_title: Alcoa - Renewable Powered Electric Calcination Pilot - Lessons Learnt
    Report 1
  publish_date: 2024-11
  project_name: Alcoa Renewable Powered Electric Calcination Pilot (ECP)
  what_happened: Global supply chain disruption originating from the COVID-19 pandemic
    caused shortages of PLCs, valves, instruments, temperature elements and electrical
    components. A heating element ordered in October 2023 with an expected delivery
    of May 2024 was delayed to March 2025 — a 10-month delay — because the supplier
    prioritised large-volume existing customers over Alcoa's bespoke single-unit order,
    impacting a key project milestone.
  lesson_learnt: For novel technology projects with bespoke, low-volume equipment
    orders, engage suppliers as early as possible to secure a firm manufacturing slot
    — suppliers will deprioritise single-unit orders in favour of high-volume customers,
    and without early commitment, delays of six months or more are likely. Budget
    for incentives to secure manufacturing slots and identify alternate suppliers
    as contingency; also consider ordering project spare parts early to serve dual
    purpose as commissioning or operational spares.
  issue_severity: major
  project_type: industrial decarbonisation
  project_scale_band: pilot
  lifecycle_phase: procurement
  proponent_type: industrial operator
  delay_category: procurement/supply chain
  failure_mode: execution & logistics
  outcome_class: delayed but recoverable
  secondary_failure_mode: null
  intervention_note: Alcoa sourced PLCs from lower-priority internal projects to partially
    offset the shortage, and secured a spare heating element from an alternate supplier
    to maintain progress until the original order is fulfilled.
  transferability: broad
  delay_magnitude: 3-12 months
  technology_domain: industrial renewables
  source_pages: &id011
  - 10
  - 11
  evidence_excerpt: Ordered in October 2023 and originally expected to arrive in May
    2024, delivery is now anticipated to occur in March 2025. This had a knock-on
    impact to a key project milestone (all long lead items on site). Alcoa mitigated
    this by securing a spare type of heater from alternate supplier that will be utilised
    until the original order can be fulfilled.
  confidence_note: delay_magnitude of 3–12 months derived from October 2023 order
    date with original May 2024 expected delivery revised to March 2025 — approximately
    10 months slippage on that line item.
