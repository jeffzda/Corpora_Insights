  publish_date: '2025-02-27'
  project_name: Alcoa Renewable Powered Electric Calcination Pilot (ECP)
  what_happened: Alcoa's standard procurement practice of breaking construction work
    into smaller packages to minimise unit costs had previously led to interface issues
    and increased owner costs. For the ECP project, the procurement strategy was revised
    to use a single provider from fabrication through to installation, maintaining
    accountability and consistency throughout.
  lesson_learnt: For FOAK or novel technology projects, use a single provider from
    fabrication through to installation to minimise contractor interfaces — splitting
    packages into the smallest cost units is only appropriate for well-known, off-the-shelf
    equipment with proven vendors.
