  what_happened: A widespread skills shortage in the electrical engineering field,
    driven by the high volume of concurrent electrification and decarbonisation projects
    across multiple industries, caused the engineering contractor to struggle to attract
    and retain qualified electrical engineers, resulting in project delays during
    recruitment negotiations.
  lesson_learnt: With the electrical engineering labour market overheated due to simultaneous
    decarbonisation programs across industries, future projects should proactively
    develop financial and non-financial strategies to attract and retain senior electrical
    engineers early — waiting until recruitment becomes a project-critical issue will
    result in schedule delays.
