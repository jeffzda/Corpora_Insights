- record_id: ARENA-DLV-21857
  source_title: Alcoa Renewable Powered Electric Calcination Pilot Lessons Learnt
    Report 2
  publish_date: '2025-02-27'
  project_name: Alcoa Renewable Powered Electric Calcination Pilot (ECP)
  what_happened: The ECP team embedded site operations personnel directly into the
    project team from an early stage, enabling early identification of operational
    conflicts, building site operator familiarity with the FOAK technology ahead of
    handover, and facilitating dry commissioning knowledge transfer. Research cited
    in the document indicates projects without integrated teams experience cost growth
    of 5–25% compared to those that adopt this approach.
  lesson_learnt: Establish a single integrated team between project and operations
    from the outset — embedding operations staff into the project team goes beyond
    standard HAZOP participation and reduces the risk of cost growth (estimated at
    5–25% by IPA research) by ensuring operational issues are identified early and
    ownership transfers smoothly.
