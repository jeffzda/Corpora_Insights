  source_title: Residential Solar and Storage Program Final Report
  publish_date: '2019-07-05'
  project_name: Residential Solar and Storage Program
  what_happened: Event 5 (3 February 2019) saw batteries only charged to a maximum
    of 83.9% SOC on the dispatch day — the lowest pre-dispatch charge level recorded
    across all seven events — resulting in the lowest average energy discharged (5.34
    kWh per battery versus 6.7 kWh average across the season).
  lesson_learnt: On consecutive hot days, residual overnight discharge reduces battery
    SOC available for the following day's dispatch — the algorithm must actively recharge
    batteries from the grid overnight between multi-day heat events to maintain dispatch
    readiness, not rely solely on the following day's solar generation.
