    deployment — adding systems progressively to constrained substations — can deliver
    proportional augmentation deferral, unlike traditional capital-intensive augmentation
    which requires large upfront investment in excess capacity.
  lesson_learnt: Position battery storage to regulators and asset planners as an incrementally
    scalable capacity solution rather than a replacement for traditional augmentation
    — the ability to progressively add capacity as demand growth becomes certain is
