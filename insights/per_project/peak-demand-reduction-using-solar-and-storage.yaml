  what_happened: The battery storage systems (9.8 kWh / 5 kW) provided only approximately
    3 hours of full-power discharge, meaning the peak load reduction window had to
    be predicted within a 3-hour window to achieve the full rated reduction; batteries
    could exhaust stored energy during a peak event if dispatch timing was misaligned.
  lesson_learnt: Battery sizing for network peak reduction must explicitly account
    for both usable energy capacity (kWh) and peak power output (kW) — a system with
    insufficient energy-to-power ratio risks exhausting stored energy mid-event; specify
    dispatch windows that match the available storage duration, or size for a longer
    window at reduced power output.
