- record_id: ARENA-DLV-47504
  source_title: Residential Solar and Storage Program Final Report
  publish_date: '2019-07-05'
  project_name: Residential Solar and Storage Program
  what_happened: Customers were initially hesitant to grant United Energy control
    of their solar and storage systems for network support events, concerned about
    losing control of an asset installed on their property.
  lesson_learnt: Customer hesitation to yield asset control can be overcome by clearly
    explaining the limited frequency of network dispatch events (4–5 events per year
    on days above 35°C) and guaranteeing reimbursement when batteries are charged
    from the grid for network support — these assurances materially increased customer
    willingness to participate.
  issue_severity: minor
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: stakeholder/land/community
  failure_mode: coordination & stakeholders
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: UE briefed customers that network support events would occur
    only 4–5 times per year above 35°C and that customers would be reimbursed for
    grid charging during those events, resolving hesitation.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages:
  - 30
  - 35
  evidence_excerpt: 'Initially, there was hesitation by customers to provide control
    of the Solar and Storage systems to UE. However, customers were briefed on the
    following: UE would be deploying the Solar and Storage Systems for provision of
    network support on peak demand days. Network support on peak demand days would
    be required only when temperatures exceeded 35oC and such events would be limited
    to between 4 and 5 per year. Customers would be reimbursed when the batteries
    were charged from the grid to provide network support on peak demand days.'
