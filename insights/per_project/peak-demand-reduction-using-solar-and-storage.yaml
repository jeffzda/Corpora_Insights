  what_happened: 'Battery storage viability as a network augmentation alternative
    was found to be highly context-dependent: high-cost augmentation scenarios (e.g.
    long rural lines or expensive underground cable replacement) favour storage, whereas
    low-cost network solutions reduce its attractiveness.'
  lesson_learnt: Storage as a network augmentation alternative must be evaluated on
    a case-by-case basis — sites with low-cost augmentation options (e.g. simple transformer
    tap changes) are unlikely to be viable, while sites with expensive augmentation
    (e.g. long rural line replacement, costly underground cable replacement) offer
    much stronger economics.
