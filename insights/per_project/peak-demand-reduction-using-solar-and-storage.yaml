  publish_date: '2018-02-28'
  project_name: United Energy Residential Solar and Storage Program
  what_happened: Traditional network augmentation solutions are capital intensive
    and available only in large capacity increments, leading to over-sizing relative
    to near-term demand and creating a risk of stranded assets where demand growth
    slows or is uncertain.
  lesson_learnt: Where future peak demand growth is uncertain, incremental deployment
    of residential solar-plus-storage offers a more prudent and cost-effective alternative
    to lump-sum network augmentation — batteries can be added progressively as demand
    grows, avoiding premature capital commitment and stranded asset risk.
