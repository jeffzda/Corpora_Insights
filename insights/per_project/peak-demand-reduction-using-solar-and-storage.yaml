  what_happened: Dispatch events on 6, 18, and 19 January 2018 (40–41°C days) with
    five Solar and Storage systems at a constrained substation achieved a 7–8% reduction
    in peak demand, which — at a 1% per annum demand growth rate — would defer augmentation
