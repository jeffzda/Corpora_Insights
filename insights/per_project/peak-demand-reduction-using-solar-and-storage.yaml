  source_title: Residential Solar and Storage Program Final Report
  publish_date: '2019-07-05'
  project_name: Residential Solar and Storage Program
  what_happened: The default control algorithm charged batteries only from excess
    solar PV generation, meaning batteries were not at 100% state of charge at the
    start of dispatch events — batteries started dispatch events at roughly 86–91%
    SOC rather than 100%, reducing available network support capacity.
  lesson_learnt: The dispatch algorithm for network-support battery programs must
    be configured to supplement solar charging with grid charging ahead of forecast
    high-temperature events — a solar-only default charging algorithm will consistently
    undercharge batteries before peak demand events and reduce the network benefit
    delivered.
  issue_severity: moderate
  project_type: DER/customer-side
