  publish_date: '2018-02-28'
  project_name: United Energy Residential Solar and Storage Program
  what_happened: Battery storage dispatch for peak reduction needed to cover 3–5 hours
    to be effective for typical residential network peak periods; the selected 9.8
    kWh / 5 kW systems provided only 3 hours at full output, and networks combining
    demand reductions from multiple sources staged in time windows was identified
    as the workaround for shorter dispatch periods.
  lesson_learnt: When specifying battery storage for network demand management, target
    systems that can sustain dispatch for 3–5 hours to cover the full residential
    evening peak window; where shorter-duration systems must be used, plan to combine
    multiple demand reduction sources staged sequentially across the peak window.
