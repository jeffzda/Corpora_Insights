- record_id: ARENA-DLV-52202
  source_title: Barcaldine Solar Farm Knowledge Sharing Report
  publish_date: 2022-05
  project_name: Barcaldine Solar Farm
  what_happened: The Voltage Control Strategy (VCS) for integrating the solar farm's
    output into the existing grid was not defined until three months before plant
    connection, leaving insufficient time for a normal design process and creating
    integration difficulties during commissioning.
  lesson_learnt: The Voltage Control Strategy must be developed and simulated during
    project development — not immediately before connection — to allow adequate design
    time and prevent commissioning delays and cost increases.
