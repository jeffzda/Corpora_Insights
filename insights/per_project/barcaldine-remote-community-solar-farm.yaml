  what_happened: The Barcaldine Solar Farm's interconnection construction required
    building assets that would be owned by the NSP (Ergon Energy) as Contestable Works,
    including two new 22 kV underground feeders and upgrades to existing substation
    protection and control systems. Managing the NSP's requirements and coordinating
    construction across both parties was identified as a critical delivery risk.
  lesson_learnt: Include all Contestable Asset tasks in the Connection Agreement from
    the outset, and establish a weekly coordination meeting between the NSP and EPC
    contractor from the earliest project stage — both measures were found essential
    to timely delivery of interconnection works.
