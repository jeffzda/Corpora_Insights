- record_id: ARENA-DLV-52206
  source_title: Barcaldine Solar Farm Knowledge Sharing Report
  publish_date: 2022-05
  project_name: Barcaldine Solar Farm
  what_happened: The original PSSE grid connection model stated a 20 ms delay between
    metering and Power Plant Controller (PPC) data acquisition, which proved nearly
    impossible to achieve due to hardware limitations. This was discovered during
    hot commissioning and required the model to be updated with real measured delays
    and a new set of dynamic parameters.
  lesson_learnt: The inverter, PPC, and metering system should be tested together
    in a hardware laboratory before commissioning to confirm actual PSSE parameters
    — including communication delays — using a simulated grid impedance matching the
    point of connection; relying on manufacturer-stated or default parameters for
    weak-grid voltage control applications risks unexpected behaviour during commissioning.
  issue_severity: moderate
  project_type: generation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: commissioning/integration
  proponent_type: project developer
  delay_category: commissioning/integration
  failure_mode: unvalidated technical assumptions
  outcome_class: delayed but recoverable
  secondary_failure_mode: unvalidated integration
  intervention_note: During hot commissioning, the PSSE model was updated with real
    laboratory-measured delays and a new set of dynamic parameters was tested to achieve
    the dynamic response required by the Generator Performance Standards.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id006
