- record_id: ARENA-DLV-52201
  source_title: Barcaldine Solar Farm Knowledge Sharing Report
  publish_date: 2022-05
  project_name: Barcaldine Solar Farm
  what_happened: During commissioning, the Barcaldine Solar Farm was found unable
    to meet Voltage and Reactive Power Control standards because a Q-limit had not
    been set. The plant experienced four unexpected trip events between August 2020
    and June 2021, was directed to shut down on 18 August 2021, and was not reinstated
    until 22 October 2021 — a forced outage of approximately two months.
  lesson_learnt: Define a Voltage Control Strategy early in project development and
    include Q-limiters and control architecture in the Connection Agreement — failure
    to do so led to repeated trips, a two-month enforced shutdown, and ongoing rectification
    works.
  issue_severity: major
  project_type: generation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: commissioning/integration
  proponent_type: project developer
  delay_category: commissioning/integration
  failure_mode: unvalidated integration
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: O&M contractor adjusted logic and control system settings in
    the remote telemetry units, and a ramp was applied to inverter Q output to enable
    soft transition of voltage control between the solar farm and the substation.
  transferability: broad
  delay_magnitude: 1-3 months
  technology_domain: solar PV
