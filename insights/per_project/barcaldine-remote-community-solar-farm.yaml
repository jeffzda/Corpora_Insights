- record_id: ARENA-DLV-52204
  source_title: Barcaldine Solar Farm Knowledge Sharing Report
  publish_date: 2022-05
  project_name: Barcaldine Solar Farm
  what_happened: The Barcaldine Solar Farm — the first solar generator in Australia
    designed to control distribution network voltage — experienced flicker emissions
    caused by DC voltage fluctuations from the inverter MPPT algorithm interacting
    with the weak grid, particularly during winter and low-irradiance periods.
  lesson_learnt: When connecting a solar farm to a weak grid, the inverter MPPT algorithm
    should be simulated in a laboratory with site-representative parameters before
    deployment, and inverter suppliers should provide a default MPPT setting profile
    for weak-grid environments to mitigate flicker.
  issue_severity: moderate
  project_type: generation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: commissioning/integration
  proponent_type: project developer
  delay_category: null
  failure_mode: unvalidated integration
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id004
  - 9
  evidence_excerpt: DC voltage fluctuations is able to create small Q fluctuations,
    that when applied to a weak grid can cause a high level of flicker emissions.
    Those fluctuation on the DC voltage and the flickers, will be higher in periods
    of maximum activity for the MPPT of the inverters, which is winter and days with
    poor irradiance.
  confidence_note: null
