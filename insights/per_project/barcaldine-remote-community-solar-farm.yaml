- record_id: ARENA-DLV-52205
  source_title: Barcaldine Solar Farm Knowledge Sharing Report
  publish_date: 2022-05
  project_name: Barcaldine Solar Farm
  what_happened: The inverter sizing and DC field design did not adequately account
    for the effect of high ambient temperatures on PV module DC voltage, which reduced
    the inverters' reactive power capacity — particularly in the capacitive zone —
    below the required ±3.95 MVAr at full power.
  lesson_learnt: During inverter and DC field sizing, conduct a detailed study of
    PV module temperatures under maximum ambient conditions to ensure the array Vmpp
    remains above the minimum DC voltage needed to deliver the required reactive power
    — this factor is commonly overlooked relative to the better-known inverter current
    de-rating effect.
  issue_severity: moderate
  project_type: generation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: project developer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: EPC contractor performed a detailed environmental conditions
    and de-rating study using BOM data, determining a minimum 620 VDC requirement
    and driving selection of 2150 kVA inverters to deliver 2000 kW plus required reactive
    power.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id005
  - 10
  evidence_excerpt: The design of the Solar Farm, and more specifically during the
    sizing and rating of the inverters and the DC solar field, is extremely important
    take into account the maximum ambient temperature that will limit the Q capacity...
    the point b) is not the case, and is the factor that will drive the AC voltage
    of the inverter.
  confidence_note: null
