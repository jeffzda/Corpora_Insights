- record_id: ARENA-DLV-36562
  source_title: Analysis of Solar PV Hybrid Energy Irrigation Trial at Bundaberg
  publish_date: 2020-06
  project_name: Adapting Renewable Energy Concepts to Irrigated Sugar Cane Production
    at Bundaberg
  what_happened: The HES economic viability on smaller production areas (below approximately
    40 ha) was found to be marginal when assessed on energy savings alone. For a 20
    ha farm, payback on energy savings alone was 20.3 years. The lower economic return
    on smaller areas may be further worsened by geographic variability in capital
    costs driven by construction regulations (e.g. wind force ratings) and market-driven
    component pricing.
  lesson_learnt: HES investment for solar irrigation pumping is unlikely to be economically
    viable on farms below approximately 40 ha when assessed on energy savings alone
    — for smaller operations, grid-connected Solar PV with feed-in tariff combined
    with conventional efficiency measures is likely to be more cost-effective than
    a full HES.
