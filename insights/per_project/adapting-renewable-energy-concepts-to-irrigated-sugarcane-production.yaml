- record_id: ARENA-DLV-36558
  source_title: Analysis of Solar PV Hybrid Energy Irrigation Trial at Bundaberg
  publish_date: 2020-06
  project_name: Adapting Renewable Energy Concepts to Irrigated Sugar Cane Production
    at Bundaberg
  what_happened: The existing travelling gun irrigation system operated at mean pump
    discharge pressure of 911 kPa — significantly exceeding the system's actual distribution
    demand of approximately 700 kPa — resulting in mean energy demand of 41 kWh/h.
    Inclusion of a VFD (ECODRIVE) in the HES trial reduced discharge pressure to 700
    kPa and hourly energy demand from 39 kWh/h to approximately 29 kWh/h, a 26% reduction
    attributable solely to the VFD.
  lesson_learnt: Including a Variable Frequency Drive in irrigation pump upgrades
    is a high-value, low-risk efficiency measure that can reduce hourly energy demand
    by approximately 26% before any renewable energy contribution — VFD savings should
    be evaluated and captured separately from solar PV savings in HES business cases.
