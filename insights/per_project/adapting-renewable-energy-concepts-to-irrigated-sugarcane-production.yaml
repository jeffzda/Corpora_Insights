  project_name: Adapting Renewable Energy Concepts to Irrigated Sugar Cane Production
    at Bundaberg
  what_happened: Desktop scenario analysis showed that lateral move irrigation combined
    with an HES achieved zero deficit days per irrigation cycle and potential yields
    of 126 tc/ha (at 100% mean rainfall), compared to 90 tc/ha for the trial travelling
    gun site with 9.3 deficit days per cycle and 94 tc/ha for the best-option travelling
    gun site with 4.8 deficit days per cycle — while using less total energy per tonne
    of cane.
  lesson_learnt: For irrigators considering an HES investment, a simultaneous transition
    to low-pressure lateral move irrigation is the highest-value configuration — eliminating
    deficit days between irrigation cycles substantially increases yields and reduces
    energy cost per tonne of cane, providing the fastest payback on combined HES and
    irrigation infrastructure capital.
