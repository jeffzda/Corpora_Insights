- record_id: ARENA-DLV-36551
  source_title: Analysis of Solar PV Hybrid Energy Irrigation Trial at Bundaberg
  publish_date: 2020-06
  project_name: Adapting Renewable Energy Concepts to Irrigated Sugar Cane Production
    at Bundaberg
  what_happened: A solar-grid Hybrid Energy System (HES) was trialled on a sugarcane
    and peanut farm at Bundaberg from February 2018 to May 2020. The system achieved
    a 76% reduction in grid energy demand compared to the pre-trial benchmark (from
    39 kWh/h to 9.4 kWh/h), combining a 30% saving from the new motor and VFD and
    a 46% contribution from Solar PV, with only 24% of energy drawn from the grid.
  lesson_learnt: A solar-grid HES combining Solar PV with a Variable Frequency Drive
    (VFD) can deliver substantial grid energy reductions (up to 76%) for agricultural
    irrigation pumping — but the full benefit is only realised when the supply capacity
    of the HES is matched to the delivery capacity of the irrigation application method
    and the crop water demand schedule.
