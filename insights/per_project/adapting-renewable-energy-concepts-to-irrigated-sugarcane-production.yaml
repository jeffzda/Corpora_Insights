  evidence_excerpt: It was common for the selected location to experience cumulus
    cloud development from mid-morning during the summer months. With little chance
    of rain this caused intermittent solar radiation and energy production loss in
    the solar PV system with minimal reduction in daily crop water demand, thus creating
    increased demand from the energy grid for irrigation.
