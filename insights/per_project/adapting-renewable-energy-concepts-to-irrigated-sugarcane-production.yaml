- record_id: ARENA-DLV-36557
  source_title: Analysis of Solar PV Hybrid Energy Irrigation Trial at Bundaberg
  publish_date: 2020-06
  project_name: Adapting Renewable Energy Concepts to Irrigated Sugar Cane Production
    at Bundaberg
  what_happened: The trial farm's irregular boundary and division by a cane railway
    line created non-uniform irrigation travel path lengths, adding nine extra days
    to each 23-day irrigation cycle beyond the 14 days the applied water could sustain
    crop growth. This resulted in a potential nine days of crop stress per irrigation
    cycle, directly reducing yield potential.
  lesson_learnt: Farm layout suitability must be rigorously assessed before committing
    to a travelling gun HES trial — non-uniform travel path lengths caused by farm
    boundaries or infrastructure can extend irrigation cycles beyond agronomically
    acceptable limits, creating unavoidable crop stress that limits the yield benefits
    the HES is intended to enable.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: community/local body
  delay_category: null
  failure_mode: poor scoping
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: The desktop study compared the trial farm layout against an idealised
    uniform-boundary farm layout, quantifying the yield and energy efficiency gains
    achievable with better farm design.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id007
  - 33
  - 40
  evidence_excerpt: Under the current farm irrigation plan each irrigation cycle applies
    approximately 70 mm which is sufficient to maintain steady crop growth for approximately
    14 days across the main crop growth period... However the farm layout adds an
    additional nine days to the irrigation cycle, making it a 23 day total cycle.
    This leads to a potential 9 days of crop stress over each irrigation cycle.
