- record_id: ARENA-DLV-36553
  source_title: Analysis of Solar PV Hybrid Energy Irrigation Trial at Bundaberg
  publish_date: 2020-06
  project_name: Adapting Renewable Energy Concepts to Irrigated Sugar Cane Production
    at Bundaberg
  what_happened: Mid-day cumulus cloud development in the Bundaberg coastal location
    regularly caused intermittent solar radiation loss during summer months without
    accompanying rainfall, creating increased demand on the grid for irrigation while
    crop water demand remained unchanged. This was a persistent pattern throughout
    the trial period.
  lesson_learnt: When siting solar irrigation systems in coastal Queensland, designers
    must account for regular mid-day cumulus cloud development that reduces solar
    generation without reducing crop water demand — this creates consistent grid supplementation
    requirements that must be built into system design and economic modelling.
