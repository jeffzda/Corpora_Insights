  what_happened: The payback period for the HES on energy savings alone was 16 years
    based on average annual system utilisation at the trial farm, making energy-cost
    reduction alone an insufficient economic justification. When yield gains from
    improved irrigation capacity were included, payback improved substantially — to
    2.7 years for a 50 ha farm combining energy savings and productivity gain.
  lesson_learnt: Business cases for agricultural solar-grid HES irrigation systems
    must incorporate crop yield improvement benefits, not just energy cost savings
    — on farms below approximately 40 ha, energy savings alone will not achieve acceptable
    payback periods and the productivity gain from more reliable irrigation scheduling
    is the primary economic driver of adoption.
