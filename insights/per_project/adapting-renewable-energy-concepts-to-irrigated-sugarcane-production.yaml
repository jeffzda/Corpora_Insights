    at Bundaberg
  what_happened: During the trial, water use was only 60–70% of the annual allocation
    despite drought conditions and high apparent irrigation demand. The travelling
    gun application efficiency factor of 0.75 (versus 0.9 for lateral move systems),
    combined with farm layout constraints that extended irrigation cycles, prevented
    delivery of full water allocation when crops needed it most.
  lesson_learnt: Irrigation system application efficiency is a binding constraint
    on HES benefit realisation — where the field application method cannot deliver
    required water volumes within agronomically critical timeframes, energy savings
    from Solar PV do not translate into yield improvement, and the HES business case
    is materially weakened.
