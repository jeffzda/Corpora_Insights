- record_id: ARENA-DLV-36556
  source_title: Analysis of Solar PV Hybrid Energy Irrigation Trial at Bundaberg
  publish_date: 2020-06
  project_name: Adapting Renewable Energy Concepts to Irrigated Sugar Cane Production
    at Bundaberg
  what_happened: Excessive rainfall in spring 2017 (before trial commencement) caused
    prolonged subsoil waterlogging, which combined with subsequent drought conditions
    led to the rise of dryland salinity. A significant portion of the irrigation area
    became unsuitable for sugarcane without an extensive soil amelioration program,
    preventing new sugarcane planting in time to generate income in 2020 and necessitating
    a switch to peanut production on affected areas.
  lesson_learnt: Pre-trial site assessment for agricultural renewable energy demonstrations
    should include soil health and drainage risk evaluation — antecedent weather events
    can create latent soil degradation risks (such as salinity) that constrain trial
    operations and income generation independent of the renewable energy system being
    tested.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
