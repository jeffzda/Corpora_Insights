  what_happened: Operator skill in managing the HES improved substantially over the
    trial period. Solar utilisation as a percentage of available sunshine hours rose
    from 29% in the first period (February–July 2018) to a maximum of 68% by July–December
    2019, representing a more than doubling of effective solar utilisation as operators
    learned the system.
  lesson_learnt: Plan for a significant operator learning curve when commissioning
    solar-grid HES irrigation systems — early-period solar utilisation may be substantially
    below system potential, and training or mentoring programs should be budgeted
    to accelerate skill development and maximise return on the capital investment.
