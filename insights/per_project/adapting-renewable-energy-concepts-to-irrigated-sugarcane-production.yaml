- record_id: ARENA-DLV-36566
  source_title: Analysis of Solar PV Hybrid Energy Irrigation Trial at Bundaberg
  publish_date: 2020-06
  project_name: Adapting Renewable Energy Concepts to Irrigated Sugar Cane Production
    at Bundaberg
  what_happened: The solar HES trial demonstrated that when operating at minimal daily
    hours (4–6 hours), approximately 80% of energy supply came from solar PV. At 10
    hours per day, the solar fraction dropped to 65%, and energy supply from solar
    ceased to increase beyond 10 hours (at which point the sun had set and all additional
    demand was met from the grid).
  lesson_learnt: When sizing a solar irrigation HES, the daily pumping hours relative
    to available solar hours is the key design variable determining solar fraction
    — systems requiring more than 10 hours of daily operation will have a declining
    solar fraction and must rely increasingly on grid or other backup supply, which
    should be explicitly modelled in feasibility studies.
