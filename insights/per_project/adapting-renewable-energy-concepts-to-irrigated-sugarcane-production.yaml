- record_id: ARENA-DLV-36554
  source_title: Analysis of Solar PV Hybrid Energy Irrigation Trial at Bundaberg
  publish_date: 2020-06
  project_name: Adapting Renewable Energy Concepts to Irrigated Sugar Cane Production
    at Bundaberg
  what_happened: Storm damage in late January to early March 2020 caused earth protection
    diode failures in four strings of the solar array (approximately 20 kW out of
    81.6 kW), reducing system capacity to 62 kW. Replacement parts were on back-order
    and the system operated in degraded mode for 393 pumping hours, consuming an additional
    2,454 kWh of grid supply (an increase of 6.24 kWh per hour of pumping).
  lesson_learnt: Solar PV systems used for agricultural irrigation should hold critical
    spare parts (particularly protection diodes and string-level components) on-site
    or with a short lead time — back-order delays during the peak irrigation season
    directly increase grid energy costs and reduce the economic case for the HES.
