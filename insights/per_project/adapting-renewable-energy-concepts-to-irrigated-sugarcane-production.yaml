  what_happened: The solar fraction of total pump energy supply was higher on the
    trial site (59%) than on the better-designed scenarios 2 and 3 (53%) because the
    irregular travel path lengths on the trial farm limited night-time operating hours,
    concentrating pumping in daytime solar hours. This was an unintended benefit of
    a design limitation.
  lesson_learnt: When evaluating Solar PV irrigation HES performance, the ratio of
    daytime to night-time pumping hours materially affects solar utilisation fraction
    — farm configurations that naturally concentrate pumping in daytime hours will
    appear to deliver higher solar fractions, and this must be factored into cross-site
    performance comparisons and technology selection.
