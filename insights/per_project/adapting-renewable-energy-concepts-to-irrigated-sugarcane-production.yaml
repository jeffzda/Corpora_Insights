- record_id: ARENA-DLV-36567
  source_title: Analysis of Solar PV Hybrid Energy Irrigation Trial at Bundaberg
  publish_date: 2020-06
  project_name: Adapting Renewable Energy Concepts to Irrigated Sugar Cane Production
    at Bundaberg
  what_happened: Reducing grid energy cost through Solar PV irrigation pumping was
    demonstrated to provide no improvement to sugarcane farm viability unless the
    irrigation system also had sufficient application efficiency and scheduling capacity
    to deliver crop water requirements in a timely manner. The trial showed that energy
    cost reduction alone, without matching irrigation delivery capacity, was insufficient
    to reverse the productivity and viability challenges of the sugarcane industry.
  lesson_learnt: A Solar PV investment decision for agricultural irrigation must be
    preceded by a comprehensive review of farm soil type, operational layout, irrigation
    distribution capacity, and application efficiency — adding solar energy without
    addressing irrigation delivery constraints will reduce energy costs but will not
    improve crop viability or return on investment.
