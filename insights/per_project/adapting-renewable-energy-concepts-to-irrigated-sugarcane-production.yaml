  source_title: Analysis of Solar PV Hybrid Energy Irrigation Trial at Bundaberg
  publish_date: 2020-06
  project_name: Adapting Renewable Energy Concepts to Irrigated Sugar Cane Production
    at Bundaberg
  what_happened: The solar trial period (February 2018–May 2020) coincided with the
    most challenging weather period many Bundaberg farmers could recall, including
    a drought declaration from May 2019, rainfall well below the long-term average
    throughout 2019, and historically variable seasonal conditions. These external
    factors constrained trial outcomes independent of HES performance.
  lesson_learnt: Agricultural renewable energy trials should be designed to run across
    multiple seasons spanning a range of weather conditions, or should include a desktop
    modelling component to normalise results to long-term average conditions — trial
    periods coinciding with extreme weather events (drought or flood) will produce
    skewed economic assessments that may overstate or understate typical HES performance.
