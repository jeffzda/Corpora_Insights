- record_id: ARENA-DLV-29552
  source_title: DEIP - DEIP Dive - Event Summary 2023
  publish_date: 2023-07
  project_name: Origin EV Smart Charging Trial
  what_happened: The Origin EV Smart Charging Trial identified that standardisation
    of the smart charging ecosystem — covering both hardware and software — is a priority
    issue affecting the performance of smart charging products, and that there is
    a narrow window of opportunity to inform consumers of the benefits of smart chargers
    before habits are set.
  lesson_learnt: Smart charging trials and early commercial deployments should prioritise
    ecosystem standardisation across hardware and software, and should invest early
    in consumer education campaigns, as the window to shape consumer expectations
    before charging habits are established is limited.
