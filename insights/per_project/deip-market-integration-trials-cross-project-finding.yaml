- record_id: ARENA-DLV-29568
  source_title: DEIP - DEIP Dive - Event Summary 2023
  publish_date: 2023-07
  project_name: DEIP Market Integration Trials (cross-project finding)
  what_happened: Across the DEIP market integration trials, C&I consumers showed growing
    interest in the wholesale demand response mechanism but expressed concern about
    downstream impacts on their assets and customer base, with a parallel trend toward
    dynamic connection arrangements.
  lesson_learnt: Demand response programs targeting C&I consumers should explicitly
    address asset impact and customer-continuity risk in their value proposition —
    C&I reticence is not primarily about price but about operational risk, and projects
    that fail to model and communicate these impacts will struggle to recruit and
    retain C&I participants.
