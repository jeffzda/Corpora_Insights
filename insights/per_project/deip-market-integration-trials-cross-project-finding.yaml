- record_id: ARENA-DLV-29567
  source_title: DEIP - DEIP Dive - Event Summary 2023
  publish_date: 2023-07
  project_name: DEIP Market Integration Trials (cross-project finding)
  what_happened: Across multiple DEIP market integration trials, the panel identified
    that mandatory changes for VPP consumers represent a considerable risk to trust
    and transparency unless accompanied by education and a carefully managed conversation
    about balancing network and consumer needs.
  lesson_learnt: VPP and DER aggregation programs should treat consumer trust as a
    delivery-critical resource — mandatory dispatch or control changes imposed without
    prior education campaigns risk eroding participation and consent, which can undermine
    trial validity and future commercial scale-up. Education must precede, not follow,
    mandatory control mechanisms.
