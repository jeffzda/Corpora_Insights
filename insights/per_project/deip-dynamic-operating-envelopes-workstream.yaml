  source_title: 'DEIP Dynamic Operating Envelopes Workstream: Outcomes Report'
  publish_date: 2022-03
  project_name: DEIP Dynamic Operating Envelopes Workstream
  what_happened: The Working Group found that designing DOE programs solely to solve
    a technical network management problem — without framing benefits from a consumer-outcomes
    perspective — risks failing to achieve the social licence necessary for customer
    uptake, potentially limiting the program's ability to deliver system benefits.
  lesson_learnt: DER and network management programs should be framed and communicated
    from a consumer-outcomes perspective from inception — programs perceived by customers
    as purely a network management tool (fixing a grid problem by constraining their
    assets) will face greater resistance than those that are co-designed around customer
    values including financial benefit, sustainability motivations, and control.
