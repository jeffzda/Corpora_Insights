  proponent_type: network business
  delay_category: commissioning/integration
  failure_mode: unvalidated integration
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: The DEIP DER Integration API Technical Working Group spent 18
    months developing CSIP-AUS v1.0 (published August 2021), a localised implementation
    guide extending IEEE 2030.5 CSIP to add site-level and group-limit concepts for
    the Australian context.
  transferability: moderate
  delay_magnitude: 1-3 years
  technology_domain: DER
  source_pages: &id002
  - 28
  evidence_excerpt: The lack of site level management is one of the reasons why identical
    IEEE 2030.5 CSIP adoption is not possible to enable DOEs within the Australian
    context. This was the basis for the DER Integration Application Programming Interface
