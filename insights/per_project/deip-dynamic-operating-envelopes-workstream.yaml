- record_id: ARENA-DLV-46606
  source_title: 'DEIP Dynamic Operating Envelopes Workstream: Outcomes Report'
  publish_date: 2022-03
  project_name: DEIP Dynamic Operating Envelopes Workstream
  what_happened: Across DOE trials and stakeholder consultation, it was found that
    the absence of accessible, affordable dispute resolution for consumers interacting
    with new energy technology — including DOE-enabled solar systems — represents
    a systemic gap, with customers facing high-friction escalation paths and organisations
    'passing the buck' when issues arise.
  lesson_learnt: Before scaling DOE programs, regulators and program designers should
    confirm that accessible dispute resolution pathways exist for customers — the
    absence of fit-for-purpose ombudsman coverage for new energy technology was identified
    as a material barrier to social licence and should be resolved proactively, not
    reactively.
