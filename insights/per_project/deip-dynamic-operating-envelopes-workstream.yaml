- record_id: ARENA-DLV-46607
  source_title: 'DEIP Dynamic Operating Envelopes Workstream: Outcomes Report'
  publish_date: 2022-03
  project_name: DEIP Dynamic Operating Envelopes Workstream
  what_happened: Stakeholder consultation found that DOE non-compliance in trials
    was frequently associated with on-site configuration issues caused by equipment
    OEMs and installers rather than by customers themselves, yet under the current
    framework customers are the legally responsible party for DOE compliance.
  lesson_learnt: When designing compliance frameworks for DER programs involving third-party
    devices and installers, ensure that responsibility for compliance is assigned
    to the party best placed to manage it — placing legal compliance risk on customers
    for installer or OEM configuration errors creates unfair outcomes and weakens
    the compliance regime.
