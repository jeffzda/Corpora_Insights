  project_name: DEIP Dynamic Operating Envelopes Workstream
  what_happened: The CutlerMerz review found that most DNSPs were considering 5-minute
    intervals and 24-hour forecasting periods for DOE deployment, but no nationally
    consistent framework for constraint forecasting existed — creating a risk that
    inconsistent forecasting approaches would increase integration costs and complexities
    for market participants such as aggregators providing FCAS, RERT and wholesale
    demand response.
  lesson_learnt: Before scaling DOE deployment across multiple DNSPs, a nationally
    consistent constraint forecasting framework should be agreed — aggregators and
    retailers cannot efficiently hedge or dispatch against DOE-constrained resources
    without advance notice, and inconsistent forecast horizons and intervals across
    networks create material market integration barriers.
