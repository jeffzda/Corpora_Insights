  source_title: 'DEIP Dynamic Operating Envelopes Workstream: Outcomes Report'
  publish_date: 2022-03
  project_name: DEIP Dynamic Operating Envelopes Workstream
  what_happened: Consultation found that longer DOE interval periods (e.g. 30 minutes)
    would limit a DNSP's ability to respond to emergency system security instructions
    from AEMO within the required 15-minute window, potentially forcing more costly
    interventions such as feeder-level generation shedding in lieu of targeted export
    curtailment.
  lesson_learnt: DOE interval duration is a system security parameter, not merely
    a market efficiency setting — DNSPs should implement or plan to transition to
    5-minute intervals to preserve their ability to respond to AEMO system security
    directions within required timeframes and avoid being forced into blunter, more
    costly network interventions.
