  source_title: 'DEIP Dynamic Operating Envelopes Workstream: Outcomes Report'
  publish_date: 2022-03
  project_name: DEIP Dynamic Operating Envelopes Workstream
  what_happened: The Working Group found that a reliable internet connection is necessary
    for DER devices to receive DOE signals, and that loss of communications would
    require devices to revert to conservative static export limits — but research
    into how often compliance issues and connection losses actually occur had not
    yet been completed at the time of reporting.
  lesson_learnt: Before scaling DOE deployment, program designers should quantify
    the frequency and duration of communications failures and their impact on customer
    benefit — the gap between expected dynamic exports and actual curtailed output
    during communication outages is a material customer harm that should be documented
    and addressed in connection agreement design.
