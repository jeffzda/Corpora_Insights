- record_id: ARENA-DLV-46602
  source_title: 'DEIP Dynamic Operating Envelopes Workstream: Outcomes Report'
  publish_date: 2022-03
  project_name: DEIP Dynamic Operating Envelopes Workstream
  what_happened: Early DOE trials in Australia found that the international IEEE 2030.5
    CSIP standard, developed for the California Rule 21 context, lacked a concept
    of 'site' or point of connection and did not support group limits across multiple
    NMIs — both features fundamental to the Australian network context — making direct
    adoption impossible.
  lesson_learnt: Before adopting an international communications standard for DER
    integration, verify it supports the specific architectural concepts required in
    your jurisdiction (e.g. site-level metering, group limits); expect to develop
    a local implementation profile (as DEIP did with CSIP-AUS) rather than assuming
    direct adoption will suffice.
