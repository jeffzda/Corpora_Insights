- record_id: ARENA-DLV-46601
  source_title: 'DEIP Dynamic Operating Envelopes Workstream: Outcomes Report'
  publish_date: 2022-03
  project_name: DEIP Dynamic Operating Envelopes Workstream
  what_happened: Static export limits, set conservatively for worst-case network conditions
    occurring only 1–5% of the year, were found to excessively curtail customer solar
    exports for the remaining 95–99% of the time, creating a systemic barrier to DER
    integration that DOE trials were designed to address.
  lesson_learnt: When designing network access frameworks for DER, static worst-case
    limits impose disproportionate curtailment — dynamic operating envelopes that
    vary limits in real time can double effective customer connection capacity without
    network augmentation and should be considered early in DER integration planning.
  issue_severity: major
  project_type: network/grid
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: development/design
  proponent_type: network business
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: DNSPs developed dynamic operating envelope trials (SAPN, AusNet,
    Energy Queensland) replacing static limits with dynamically calculated per-customer
    export allowances updated in near-real time.
  transferability: broad
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id001
  - 18
  evidence_excerpt: Network limits have historically been based on an estimate of
    diversified maximum or minimum demand conditions that may only occur on the network
    for 1-5% of the year. This means that customers are constrained further than what
    the physical limits of the system require for the remainder of the time.
