- record_id: ARENA-DLV-46610
  source_title: 'DEIP Dynamic Operating Envelopes Workstream: Outcomes Report'
  publish_date: 2022-03
  project_name: DEIP Dynamic Operating Envelopes Workstream
  what_happened: Stakeholder consultation revealed that DOE programs risk limited
    customer uptake if consumers lack awareness of their current static export limits
    — customers unaware of their constraints may not perceive the benefit of a dynamic
    offer, and existing customers in SA who were more exposed to information about
    constraints still expressed scepticism, suggesting information provision alone
    is insufficient.
  lesson_learnt: Program designers should not assume customers understand their current
    network limitations before presenting a dynamic alternative — baseline consumer
    awareness research should precede DOE rollout design, and communication must go
    beyond informational framing to address values-based trust concerns and the perceived
    loss of control over customer-owned assets.
