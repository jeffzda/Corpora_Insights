- record_id: ARENA-DLV-46608
  source_title: 'DEIP Dynamic Operating Envelopes Workstream: Outcomes Report'
  publish_date: 2022-03
  project_name: DEIP Dynamic Operating Envelopes Workstream
  what_happened: The ENEA Smarter Homes for Distributed Energy study found that behind-the-meter
    (BTM) device interoperability was a material barrier to customers receiving the
    full potential benefit of DOEs — while HEMS products capable of responding to
    DOEs existed, device-to-device communication between multiple BTM devices (solar,
    battery, EV, water heater) used proprietary or non-standardised protocols that
    limited orchestration capability.
  lesson_learnt: When designing DOE or DER integration programs involving multi-device
    residential sites, BTM interoperability constraints should be assessed early —
    the absence of open BTM device standards limits HEMS market development and means
    customers with complex BTM configurations cannot realise full DOE benefits without
    additional gateways or system-specific solutions.
