  source_title: 'DEIP Dynamic Operating Envelopes Workstream: Outcomes Report'
  publish_date: 2022-03
  project_name: DEIP Dynamic Operating Envelopes Workstream
  what_happened: Stakeholder consultation found that adopting a national communications
    standard for DOEs too early risks locking in a specification later found unsuitable,
    while waiting too long reduces the ability of customers to access DOE benefits
    — at time of reporting, DNSPs were already diverging in their implementation approaches
    creating potential fragmentation risk.
  lesson_learnt: For national DER integration standards, timing of standardisation
    is critical — adopt too early and risk stranding investment in an unsuitable specification;
    adopt too late and allow fragmentation that increases costs for OEMs and limits
    consumer choice; the standard should take effect 'on the earliest date after it
    is agreed that does not materially impact competition outcomes.'
