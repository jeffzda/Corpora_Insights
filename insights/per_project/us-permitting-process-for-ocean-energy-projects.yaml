- record_id: ARENA-DLV-50023
  source_title: Ocean Energy Report by Seanergy and Ernst and Young
  publish_date: 2016-06
  project_name: US Permitting Process for Ocean Energy Projects
  what_happened: The complexity, duration and cost of the US permitting and licensing
    process was identified as a major barrier restraining ocean energy project developers
    from applying for permits. Despite the Water Power Programme dedicating resources
    in 2015 to better inform regulatory bodies, the permitting process continued to
    deter developers.
  lesson_learnt: US ocean energy project developers should budget significant time
    and cost for the permitting and licensing process, and engage regulatory bodies
    early with dedicated resources; the complexity of multi-agency marine permitting
    in the US is a structural barrier that cannot be resolved by technology developers
    alone and requires sustained government coordination effort.
