- record_id: ARENA-DLV-14962
  source_title: 'Looking Forward: Barriers, Risks and Rewards of the Australian Geothermal
    Sector to 2020 and 2030'
  publish_date: 2014-06
  project_name: Australian Geothermal Sector – Pre-competitive Data Gap
  what_happened: The absence of systematic pre-competitive resource characterisation
    data — particularly temperature at depth and permeability mapping — across most
    of Australia meant that geothermal explorers could not reliably identify prospective
    resources without drilling, concentrating risk at the highest-cost phase of project
    development.
  lesson_learnt: Government-funded pre-competitive geothermal data collection (temperature
    logging of existing oil/gas/mineral wells, 3-D seismic, heat-flow surveys) should
    precede any commercial demonstration funding, as it is the most cost-effective
    mechanism to reduce early-stage resource risk and improve investor confidence
    across a broad region.
