  evidence_excerpt: The major technical barriers to further development in the Australian
    geothermal sector are pre-competitive data and methods to increase the likelihood
    of drilling geothermal wells in a prospective resource, and the methods to enhance
    the flow rate from reservoirs... Incomplete characterisation of sub-surface formations
    dramatically complicates the process of assessing prospective areas of hot (greater
    than 150°C) rock that have the right characteristics to allow high flow rates
    to be achieved.
