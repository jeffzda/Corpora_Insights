- record_id: ARENA-DLV-49655
  source_title: 'Gannawarra Energy Storage System Operational Report #1 and #2'
  publish_date: '2020'
  project_name: Gannawarra Energy Storage System (GESS)
  what_happened: GESS was not registered for contingency FCAS services during the
    reporting period (to February 2020), despite the facility being physically capable
    of providing them. Registration was delayed because it was deprioritised pending
    resolution of post-contingent voltage oscillation constraints and confirmation
    of droop settings and interfacility communications protocols.
  lesson_learnt: Contingency FCAS registration requires resolution of post-contingent
    voltage behaviour, droop settings, and interfacility communications protocols
    before AEMO will approve the registration change — plan these technical confirmations
    into the commissioning schedule to avoid deferring a significant revenue stream
    post-operations commencement.
