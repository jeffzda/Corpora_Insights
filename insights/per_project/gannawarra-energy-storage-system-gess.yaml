  failure_mode: regulatory & approvals
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated integration
  intervention_note: Edify proposed dynamic classification — scheduled when ESS can
    provide sufficient MW coverage, semi-scheduled otherwise — through the AEMO EGES
    consultation process.
  transferability: broad
  delay_magnitude: null
  technology_domain: hybrid systems
