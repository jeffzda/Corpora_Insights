  evidence_excerpt: 'Although the shared network infrastructure does introduce an
    operational constraint on GESS, it does so with two broad benefits that could
    not be achieved with a physically separate grid connection: 1. Reduced cost of
    the overall connection due to the use of a common transformer, switching, cabling
    and connection to Powercor''s network via the GSF network; and 2. A physical ability
    for GESS to capture generation from GSF during periods of wider network curtailment.'
