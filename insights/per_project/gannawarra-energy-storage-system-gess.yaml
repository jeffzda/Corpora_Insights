    construction contracts include robust step-in rights, parent company guarantees
    or performance bonds sufficient to cover contractor insolvency — and maintain
    sufficient internal capability to take over site management if required, as the
    developer may need to directly engage replacement contractors and site supervisors
    to complete works.
