  what_happened: GESS used a novel long-term Battery Storage Services Agreement (BSSA)
    with EnergyAustralia under which EnergyAustralia received full operational rights
    over the battery (charge/discharge decisions in energy and FCAS markets) in exchange
    for fixed payments to GESS. This structure was chosen after evaluating four alternative
    revenue models because it placed market optimisation responsibility with a single
    party best equipped to manage market risks within a diversified portfolio.
  lesson_learnt: For standalone or co-located battery projects seeking bankable revenue,
    a long-term fixed-capacity-payment BSSA that transfers full operational rights
    to a counterparty with a diversified energy portfolio provides cashflow certainty
    for the project owner while enabling optimal market value extraction — this model
    addresses both bankability and efficient value capture requirements simultaneously.
