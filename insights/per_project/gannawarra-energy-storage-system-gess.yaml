- record_id: ARENA-DLV-69720
  source_title: 'Gannawarra Energy Storage System: Project Summary Report'
  publish_date: 2019-07
  project_name: Gannawarra Energy Storage System (GESS)
  what_happened: The shared 50MW substation connection between GESS and GSF created
    an operational constraint requiring battery dispatch to be secondary to solar
    farm dispatch at all times. While this limited battery flexibility, the shared
    connection reduced overall project connection costs and provided the physical
    ability for GESS to capture GSF generation during network curtailment events.
  lesson_learnt: When designing co-located battery-solar projects, a shared substation
    connection offers significant cost savings and curtailment-capture capability,
    but the dispatch priority framework and resulting operational constraints on the
    battery must be fully modelled in the business case before financial close — particularly
    the impact on FCAS and energy market optimisation opportunities.
  issue_severity: minor
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: project developer
