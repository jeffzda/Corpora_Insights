- record_id: ARENA-DLV-49658
  source_title: 'Gannawarra Energy Storage System Operational Report #1 and #2'
  publish_date: '2020'
  project_name: Gannawarra Energy Storage System (GESS)
  what_happened: GESS demonstrated that coordinated stacking of energy arbitrage and
    regulation FCAS revenues significantly amplifies the value of each battery cycle.
    A cycle can be extended 4–5 times in value by bidding into FCAS markets compared
    to energy alone, and raise FCAS participation while charging can offset or eliminate
    charging costs.
  lesson_learnt: Battery operators should actively stack regulation FCAS participation
    with energy arbitrage from commissioning — concurrent FCAS participation can materially
    improve effective charging costs and amplify per-cycle revenue, and the two services
    are operationally compatible even under shared connection point constraints.
