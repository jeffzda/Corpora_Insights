- record_id: ARENA-DLV-59303
  source_title: Gannawarra Energy Storage System Operational Report 3 and 4
  publish_date: '2021'
  project_name: Gannawarra Energy Storage System (GESS)
  what_happened: Co-locating GESS with the Gannawarra Solar Farm (GSF) via a shared
    50MW connection meant that GESS discharge capacity was constrained by GSF's output,
    limiting the battery's ability to fully utilise connection headroom and maximise
    revenue during high-price periods. GSF's priority dispatch through the shared
    connection also reduced the avoided TUoS payment GESS received compared to what
    a standalone distribution-connected battery would have received.
  lesson_learnt: When co-locating a battery retrofit with a pre-existing solar farm
    on a shared connection, carefully model the operational constraints that the shared
    connection will impose on the battery — particularly if the solar asset has priority
    dispatch. These constraints can materially limit battery revenue and reduce avoided
    network payments compared to a standalone configuration.
  issue_severity: major
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: GESS partially mitigated DUOS charges by prioritising charging
    during solar hours (avoiding grid draw) and accessing avoided TUoS payments, while
    still running a reduced 10MW overnight charge to capture morning price peaks despite
    the charge impost.
  transferability: broad
  delay_magnitude: null
  technology_domain: battery storage
  source_pages:
  - 18
  - 22
  - 23
  - 24
  evidence_excerpt: The combined connection point of GSF and GESS has a rating of
    50MW to which GSF has priority access. Whilst the shared grid connection point
    and capacity was efficient from a design perspective, it does mean that GESS is
    effectively constrained to utilising headroom in this connection point from unutilised
    solar output, which therefore requires accurate real-time knowledge of GSF's output
    and what headroom is available for GESS.
