  outcome_class: successful demonstration
  secondary_failure_mode: poor scoping
  intervention_note: Edify successfully created and registered the Gannawarra Solar
    Farm Network to facilitate the shared connection arrangement, becoming one of
    very few energy companies to have developed a registered network of this type.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: battery storage
