  source_title: Gannawarra Energy Storage System Operational Report 3 and 4
  publish_date: '2021'
  project_name: Gannawarra Energy Storage System (GESS)
  what_happened: Distribution-connected GESS incurred monthly DUOS charges of approximately
    $50,000, arising because the network tariff class applied (Subtransmission) is
    designed for subtransmission customers rather than generators, resulting in high
    fixed and demand charges that created sub-optimal trading decisions and asset
    underutilisation.
  lesson_learnt: Batteries connecting to the distribution network face significant
    demand-based network charges that can constrain trading decisions and reduce asset
    utilisation. Project economics should account for the specific tariff class that
    will apply post-connection — and where feasible, transmission-connected configurations
    should be evaluated, as Victorian transmission-connected storage is not subject
    to equivalent charges.
