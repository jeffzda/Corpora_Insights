- record_id: ARENA-DLV-69718
  source_title: 'Gannawarra Energy Storage System: Project Summary Report'
  publish_date: 2019-07
  project_name: Gannawarra Energy Storage System (GESS)
  what_happened: Network tariffs (DUOS charges) applied by Powercor to all load drawn
    through its network created a commercial incentive for GESS to charge during solar
    hours only, resulting in perverse market outcomes — notably the creation of additional
    daytime load during periods when operational demand is already higher, rather
    than enabling more efficient overnight charging.
  lesson_learnt: The application of standard distribution network tariffs to battery
    market customers creates perverse dispatch incentives; project developers should
    model tariff structures carefully in the business case and advocate for a standardised,
    NEM-wide approach to network tariffs for battery storage to avoid sub-optimal
    charging behaviour driven by tariff design rather than market signals.
