- record_id: ARENA-DLV-69714
  source_title: 'Gannawarra Energy Storage System: Project Summary Report'
  publish_date: 2019-07
  project_name: Gannawarra Energy Storage System (GESS)
  what_happened: GESS adopted a multi-contract procurement model (separate battery
    supply agreement and balance of plant installation contract) rather than a single
    turnkey EPC, because the cost premium for a full risk wrap under a turnkey EPC
    was not viable — the relative cost weighting towards the battery OEM meant only
    the OEM could take on full project risk, and using a non-solar EPC contractor
    would have introduced inter-project risk with GSF.
  lesson_learnt: For battery projects co-located with an existing solar farm, a multi-contract
    model (battery supply + BOP installation by the incumbent solar EPC) can deliver
    meaningful cost and risk advantages over a turnkey EPC — but requires clear responsibility
    matrices and a well-articulated, enforceable Coordination Deed to manage the resulting
    interface risks.
  issue_severity: none
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: procurement
  proponent_type: project developer
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: Implemented a Coordination Deed between battery supplier (Tesla)
    and BOP contractor (RCR) to define interface responsibilities and joint programming.
  transferability: moderate
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id035
  - 27
  - 28
  evidence_excerpt: The adopted multi-contract solution requires greater sponsor management
    than a typical turnkey EPC contract as there are multiple accountable parties.
    However, this separation also allows better monitoring of the performance of individual
    contractors than under a single wrap. The key to a successful implementation of
    this approach is having a clear responsibility matrix and a well-articulated and
    exhaustive Coordination Deed that is enforceable under the contracts.
