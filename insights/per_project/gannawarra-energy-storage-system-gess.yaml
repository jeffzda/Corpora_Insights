  source_title: 'Gannawarra Energy Storage System: Project Summary Report'
  publish_date: 2019-07
  project_name: Gannawarra Energy Storage System (GESS)
  what_happened: Powercor was unable to provide bilateral ICCP communication paths
    through its network to AEMO datacentres. Without an ICCP link, GESS could not
    access AGC dispatch from AEMO and could not provide high-fidelity regulation FCAS
    services. Establishing a direct ICCP link via AEMO proved to be a first for AEMO
    and a complicated, time-consuming process.
  lesson_learnt: Battery developers should confirm early in development whether the
    connecting NSP can provide ICCP bilateral communication paths to AEMO; if not,
    plan for a direct ICCP link via AEMO — but factor in significant additional time
    and complexity as this had never been done before at GESS. Using AEMO's ICCP vendor
    is recommended where the NSP cannot provide bilateral paths.
