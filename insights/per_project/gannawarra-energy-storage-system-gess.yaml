  project_name: Gannawarra Energy Storage System (GESS)
  what_happened: A harmonic filter (two 7.5MVA units) had to be installed at GESS
    to ensure that the combined operation of GESS and GSF would not breach power quality
    limits across a broad set of network conditions previously defined in the GSF
    connection application and GPS negotiation. This was an additional technical and
    cost requirement arising specifically from the battery retrofit configuration.
  lesson_learnt: Developers of battery retrofit projects co-located with existing
    generators should commission power quality modelling at an early stage — the combined
    harmonic profile of the battery inverters and the existing asset may require additional
    harmonic filtering equipment not anticipated in early cost estimates.
