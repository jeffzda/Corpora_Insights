- record_id: ARENA-DLV-59313
  source_title: Gannawarra Energy Storage System Operational Report 3 and 4
  publish_date: '2021'
  project_name: Gannawarra Energy Storage System (GESS)
  what_happened: The novel long-term Battery Storage Services Agreement (BSSA) between
    GESS ProjectCo and EnergyAustralia — under which EnergyAustralia received full
    operational rights and all market revenues in exchange for fixed payments to the
    project company — was successfully structured and operated over two years, providing
    project equity investors with a contracted return while exposing EnergyAustralia
    to market upside and downside.
  lesson_learnt: A long-term services agreement that separates operational rights
    and market revenues from the project company — giving the operator full trading
    control in exchange for fixed availability payments — can be a viable commercial
    structure for utility-scale battery storage. This approach allows a project developer
    to achieve bankable contracted returns while enabling a sophisticated operator
    to maximise value through active trading.
