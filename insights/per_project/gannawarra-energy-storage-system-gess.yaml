  source_title: Gannawarra Energy Storage System Final Report
  publish_date: 2021-11
  project_name: Gannawarra Energy Storage System (GESS)
  what_happened: GESS required creation and registration of a novel network entity
    (the Gannawarra Solar Farm Network) to enable the connection arrangement for co-located
    GSF and GESS assets sharing a single 50MVA substation. This was an unprecedented
    structural requirement that Edify identified as one of the many novel challenges
    overcome in delivering Australia's first integrated utility-scale solar and battery
    system.
  lesson_learnt: When retrofitting battery storage to an existing solar farm, proponents
    should engage early with AEMO and legal/regulatory advisers on how the co-location
    arrangement will be classified under the National Electricity Rules — the need
    to establish a private registered network was novel and could have delayed the
    project if not addressed with a solutions-focused approach from all parties.
