  project_name: Gannawarra Energy Storage System (GESS)
  what_happened: The commissioning notifiable exemption (for systems below 5MW) allowed
    only one 2.75MW block to operate at a time, requiring firmware upgrades to be
    completed individually for each block rather than across the whole system in a
    single iteration. This activity was completed remotely from the US, making scheduling
    difficult.
  lesson_learnt: Regulators and project developers should seek arrangements that permit
    the full system to operate during commissioning with a safeguarded export limit
    (e.g. no more than 5MW) rather than block-by-block activation — this would allow
    communications testing and firmware upgrades to be completed in a single pass
    and avoid the compounding scheduling burden of remote OEM support.
