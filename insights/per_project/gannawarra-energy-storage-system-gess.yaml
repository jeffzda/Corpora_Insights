- record_id: ARENA-DLV-69705
  source_title: 'Gannawarra Energy Storage System: Project Summary Report'
  publish_date: 2019-07
  project_name: Gannawarra Energy Storage System (GESS)
  what_happened: Where a co-located ESS is coupled with a renewable asset behind a
    single point of connection, the combined system's scheduled classification is
    difficult to maintain when the ESS is full, empty, or offline — in those states
    it cannot manage fluctuations in renewable output, imposing an unmanageable compliance
    risk burden on the combined system.
  lesson_learnt: Developers of hybrid battery-renewable systems should engage regulators
    early on the case for dynamic (state-dependent) classification — applying scheduled
    status only when the ESS can provide adequate coverage — to avoid an inflexible
    compliance risk that could impede investment in combined systems.
