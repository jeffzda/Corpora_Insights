- record_id: ARENA-DLV-69703
  source_title: 'Gannawarra Energy Storage System: Project Summary Report'
  publish_date: 2019-07
  project_name: Gannawarra Energy Storage System (GESS)
  what_happened: Registering a network to enable the GESS connection arrangement required
    GSF's project SPV to become an NSP, a role for which it lacked natural capability
    or capacity. This required individual negotiations with the connecting NSP and
    the AER for Chapter 5 exemptions, with no standardised process or template agreements,
    creating inconsistency risk across the NEM and giving rise to complex commercial
    arrangements around prudential requirements, import tariffs and avoided TUOS payments.
  lesson_learnt: Battery retrofit projects that require creation of a registered network
    should anticipate lengthy, bespoke negotiations with the NSP and AER for Chapter
    5 exemptions; advocate for standardised template agreements and a clear rubber-stamping
    process to reduce transaction costs and improve consistency.
  issue_severity: moderate
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: approvals/regulatory
