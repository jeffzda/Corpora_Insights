- record_id: ARENA-DLV-69702
  source_title: 'Gannawarra Energy Storage System: Project Summary Report'
  publish_date: 2019-07
  project_name: Gannawarra Energy Storage System (GESS)
  what_happened: NER rules require the connection point to be located as close to
    the physical point of common coupling with the NSP as possible, placing it on
    the HV side of dedicated substations. This arrangement prevents future assets
    from easily connecting into those substations in a retrofit arrangement without
    triggering complex changes including GPS renegotiation, meter movements and redetermination
    of MLFs/DLFs — creating material risk to the standing asset and an impediment
    to investment.
  lesson_learnt: For new-build renewables where future battery retrofit is contemplated,
    design the connection point on the MV side of the substation from the outset and
    establish clear network creation guidelines upfront — this avoids the need for
    a full GPS renegotiation when the battery is added and removes a major investment
    barrier.
