- record_id: ARENA-DLV-8305
  source_title: Gannawarra Energy Storage System Final Report
  publish_date: 2021-11
  project_name: Gannawarra Energy Storage System (GESS)
  what_happened: Regulation FCAS revenue significantly exceeded business case expectations
    during GESS's first two years of operation, becoming the dominant revenue source
    at 65% of total revenues. However, energy and FCAS prices tracked materially lower
    in the second 12-month period compared to the first, and the project now faces
    significant FCAS market competition from the Victorian Big Battery in shallow
    markets.
  lesson_learnt: Battery revenue business cases should not rely on early-period FCAS
    price levels persisting — regulatory FCAS markets are shallow and competition
    from new entrants (e.g. larger batteries) can materially compress prices; model
    a range of market depth scenarios and longer time horizons (10+ years) before
    concluding on business case viability.
