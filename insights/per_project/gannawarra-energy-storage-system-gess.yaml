  source_title: 'Gannawarra Energy Storage System Operational Report #1 and #2'
  publish_date: '2020'
  project_name: Gannawarra Energy Storage System (GESS)
  what_happened: The DUOS tariff class applied to the shared GSF/GESS network connection
    was reclassified from the Large Low Voltage (LLV) tariff (which applied to GSF
    alone with minimal load) to the Subtransmission (ST) tariff class — a tariff normally
    reserved for sub-transmission customers rather than generators — due to GESS introducing
    significant load via grid charging.
  lesson_learnt: Adding battery storage to an existing solar farm connection can trigger
    a tariff reclassification to a more expensive network tariff class — developers
    should explicitly investigate how the DNO will classify the combined facility's
    network tariff before committing to a co-location design.
