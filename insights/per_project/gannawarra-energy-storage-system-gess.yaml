- record_id: ARENA-DLV-8308
  source_title: Gannawarra Energy Storage System Final Report
  publish_date: 2021-11
  project_name: Gannawarra Energy Storage System (GESS)
  what_happened: Despite incurring DUOS charges on grid-sourced overnight charging,
    GESS's operational analysis found it was still economically optimal to run a lower-capacity
    (10MW) overnight charge, because overnight prices were the lowest of the day and
    the resulting available state-of-charge enabled capture of morning peak prices
    — demonstrating that DUOS charges do not necessarily eliminate overnight charging
    but do alter optimal dispatch sizing.
  lesson_learnt: When modelling dispatch strategy for distribution-connected batteries
    facing DUOS charges, do not assume overnight charging is unviable — compare the
    DUOS cost against the marginal value of having additional state-of-charge available
    for morning peaks, as lower overnight grid prices may still support a reduced-capacity
    overnight charge in net terms.
  issue_severity: minor
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: project developer
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: EnergyAustralia restricted overnight charging to 10MW and offset
    the DUOS cost using raise regulation FCAS services during the charging period.
  transferability: moderate
  delay_magnitude: null
  technology_domain: battery storage
  source_pages:
  - 21
  - 24
  evidence_excerpt: EnergyAustralia performed analysis to assess the merits of charging
    outside of solar hours and found there are diminishing returns past a 10MW yearly
    demand charge. Therefore, overnight GESS is typically charged between ~12:00-06:00
    AEST offsetting this charge with raise regulation services (where stopping or
    reducing a charge is the equivalent of delivering a raise product).
