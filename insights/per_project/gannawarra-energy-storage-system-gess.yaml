  project_name: Gannawarra Energy Storage System (GESS)
  what_happened: Onerous network tariff charges (DUOS) applied to any energy drawn
    through the Powercor network combined with restrictions on energy exports during
    solar hours created conditions in which some commissioning tests — particularly
    those requiring rapid charge/discharge cycles — were very difficult to complete.
    Charging was limited to solar hours and rates dependent on solar output, and the
    battery could not always be charged or discharged at the required rate.
  lesson_learnt: Battery commissioning plans should be developed with full awareness
    of network tariff structures and export constraints — close coordination between
    commissioning and trading teams, and careful scheduling of charge/discharge tests
    within the available operational window, is essential to completing performance
    tests on time.
