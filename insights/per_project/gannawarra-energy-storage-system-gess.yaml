  source_title: 'ARENA Insights Spotlight: Gannawarra Energy Storage System (GESS)'
  publish_date: 2019-04
  project_name: Gannawarra Energy Storage System (GESS)
  what_happened: Battery sizing was constrained by export limits at the existing solar
    farm site, resulting in a 25 MW / 50 MWh system selected as the commercial optimum
    rather than the technically largest feasible option.
  lesson_learnt: Battery sizing for co-located storage projects must be optimised
    against site-specific export constraints, grant funding levels, and commercial
    revenue streams rather than technical capacity alone — there is no one-size-fits-all
    answer and oversizing relative to export limits destroys commercial value.
