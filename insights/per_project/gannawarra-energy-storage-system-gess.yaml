- record_id: ARENA-DLV-59304
  source_title: Gannawarra Energy Storage System Operational Report 3 and 4
  publish_date: '2021'
  project_name: Gannawarra Energy Storage System (GESS)
  what_happened: Inaccurate solar generation forecasts reduced the efficiency of GESS
    dispatch on at least one material occasion (1 March 2019), causing the battery
    to miss high-price export windows because available headroom in the shared connection
    could not be accurately estimated in real time. The bidding system lacked a direct
    feed of the solar farm forecast to limit battery generation offers prior to each
    dispatch interval.
  lesson_learnt: For co-located battery and solar systems sharing a connection, accurate
    real-time and near-term solar forecasts must feed directly into the battery's
    bidding and dispatch system. Without this integration, the battery cannot reliably
    exploit connection headroom during high-price periods, resulting in lost revenue.
  issue_severity: moderate
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: unvalidated integration
  outcome_class: partial success
  secondary_failure_mode: data & measurement
  intervention_note: EnergyAustralia planned an upgrade to its EnergyOffer bidding
    system to allow a direct feed of the solar farm forecast to limit battery generation
    offers prior to each dispatch interval, and to optimise load offers by charging
    only when the solar farm is producing.
  transferability: moderate
  delay_magnitude: null
  technology_domain: battery storage
  source_pages:
  - 21
  - 22
  - 23
  - 24
  evidence_excerpt: One issue that was highlighted on 1 March 2019 was the inaccuracy
    of the solar forecast used by AEMO, which reduced the efficiency of GESS's dispatch.
    On that day, there was around 10MW of battery capacity which could have been dispatched
    at the Maximum Pricing Cap, but GESS's output was inadvertently restricted due
    to inaccurate forecasting of GSF... This came at an opportunity cost of ~$150,000
    of lost revenues on this particular day. These inaccuracies should be improved
    with the introduction of more sophisticated self-forecasting.
