  source_title: 'Gannawarra Energy Storage System: Project Summary Report'
  publish_date: 2019-07
  project_name: Gannawarra Energy Storage System (GESS)
  what_happened: Semi-dispatch caps under NEM rules are applied at an individual asset's
    connection point, which meant that a co-located battery registered as an independent
    generating unit could not capture curtailed energy from the solar farm during
    constraint events — blocking a key business case scenario for the retrofit battery.
  lesson_learnt: Battery developers whose business case relies on capturing curtailed
    renewable energy should verify whether the regulatory framework permits a semi-dispatch
    cap to be applied at the network-to-network connection point rather than the individual
    asset level — if not, advocate for rule changes before financial close as this
    can fundamentally undermine the battery's revenue case.
