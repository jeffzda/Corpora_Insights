  outcome_class: delayed but recoverable
  secondary_failure_mode: coordination & stakeholders
  intervention_note: Ashurst provided legal and regulatory advice; Edify negotiated
    directly with Powercor and the AER to obtain required Chapter 5 exemptions and
    establish the network-to-network connection agreement.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
