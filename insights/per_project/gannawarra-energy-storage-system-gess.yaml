  source_title: Gannawarra Energy Storage System Final Report
  publish_date: 2021-11
  project_name: Gannawarra Energy Storage System (GESS)
  what_happened: GESS's marginal loss factor (MLF) for generation declined from 1.0070
    in FY2018-19 to 0.9643 in FY2019-20 and 0.9793 in FY2020-21, meaning the effective
    revenue from energy dispatch was reduced relative to the Regional Reference Node,
    representing an unanticipated financial impact on EnergyAustralia's revenue position
    from market settlement.
  lesson_learnt: Battery project business cases should stress-test MLF trajectories
    — MLFs for distribution-connected assets in Victoria have shown material year-on-year
    variation, and a generation MLF falling below 1.0 directly reduces settlement
    revenue; conservative MLF assumptions or periodic re-forecasting should be built
    into financial models.
