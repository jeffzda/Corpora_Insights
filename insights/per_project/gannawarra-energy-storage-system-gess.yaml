- record_id: ARENA-DLV-69704
  source_title: 'Gannawarra Energy Storage System: Project Summary Report'
  publish_date: 2019-07
  project_name: Gannawarra Energy Storage System (GESS)
  what_happened: GESS was classified as a scheduled generator, which prevented it
    from operating in a sub-5-minute 'firming mode' in response to real-time fluctuations
    in GSF output. Any departure from its scheduled dispatch at sub-5-minute granularity
    would constitute a non-compliance breach, meaning the firming attributes of the
    battery could not be fully utilised in the energy market and would have to be
    procured via more expensive FCAS markets.
  lesson_learnt: Co-located battery developers should anticipate that the scheduled
    classification of ESS under current NER rules prevents real-time firming operation
    at sub-5-minute granularity; engage AEMO and advocate for regulatory reform (e.g.
    a 'quasi-scheduled' classification) to unlock this value — it materially affects
    the business case for co-located battery and renewable systems.
  issue_severity: major
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: project developer
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: commercial & market
  intervention_note: Edify submitted to AEMO's Emerging Generation and Energy Storage
    consultation proposing a 'quasi-scheduled' classification to permit joint offers
    and allow ESS to depart from scheduled dispatch within defined bounds for firming
    purposes.
  transferability: broad
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id025
  - 22
  - 23
  evidence_excerpt: The application of the scheduled classification limits this 'firming
    mode' operation of the ESS as departures from a scheduled dispatch at a sub 5-minute
    dispatch interval granularity would result in a non-compliance breach direction.
  confidence_note: null
