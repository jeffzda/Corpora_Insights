  what_happened: 'Automated bidding tools were assessed during year two of GESS operations
    and found to have material limitations: demand and supply forecasts can deviate
    significantly (particularly with high renewables penetration), forced outages
    and late bidding can cause sub-optimal state-of-charge management, and FCAS price
    forecasts are insufficiently accurate to rely on for automated cycling decisions.
    EnergyAustralia continued to use human bidding informed by automated tools rather
    than full automation.'
  lesson_learnt: Full autobidding for battery storage assets operating in energy and
    FCAS markets is not yet reliable enough to replace human trading judgement. A
    hybrid model — human bidding decisions informed by automated tools — is more robust,
    with automation applied selectively (e.g. SOC limit triggers, availability bid
    updates) where forecast accuracy is sufficient.
