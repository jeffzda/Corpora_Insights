- record_id: ARENA-DLV-69715
  source_title: 'Gannawarra Energy Storage System: Project Summary Report'
  publish_date: 2019-07
  project_name: Gannawarra Energy Storage System (GESS)
  what_happened: Under GESS's split procurement model, battery supplier guarantees
    were defined at the inverter terminals rather than at the project's connection
    point, while the GPS is evaluated at the point of connection. This mismatch created
    a gap in guarantee coverage for Generator Performance Standard compliance and
    for maximum power and round-trip efficiency measurements across the balance of
    plant.
  lesson_learnt: When using a multi-contract battery procurement model, explicitly
    align battery supplier performance guarantees (GPS compliance, maximum power,
    round-trip efficiency, liquidated damages) with the functional evaluation points
    of the project — either guarantee performance to the point of connection, or clearly
    define BOP loss allowances in the BOP contract to bridge the gap.
  issue_severity: minor
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: procurement
  proponent_type: project developer
  delay_category: null
  failure_mode: unvalidated integration
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: Specified that BOP installation contract include allowances for
    maximum balance of plant losses to bridge the gap between inverter-terminal and
    connection-point guarantee points.
  transferability: moderate
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id036
  - 29
  - 30
  evidence_excerpt: The GPS of the facility is evaluated at the point of connection.
    However, the battery supplier will typically seek to guarantee compliance at the
