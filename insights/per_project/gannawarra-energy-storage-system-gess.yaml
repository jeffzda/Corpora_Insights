  source_title: Gannawarra Energy Storage System Operational Report 3 and 4
  publish_date: '2021'
  project_name: Gannawarra Energy Storage System (GESS)
  what_happened: 'GESS demonstrated that stacked participation in both energy and
    FCAS markets is viable and valuable for battery storage: FCAS operates as an enablement
    market where the battery is paid on enablement without physical dispatch, with
    actual FCAS dispatch being 5–10 times less than energy dispatch. This preserved
    cycling budget while still generating revenue, enabling the battery to stack value
    across multiple services simultaneously.'
  lesson_learnt: 'Battery storage business cases should explicitly model FCAS as an
    enablement-based revenue stream that preserves cycling capacity: because FCAS
    dispatch is typically 5–10 times less than energy dispatch, stacking FCAS alongside
    energy arbitrage generates additional revenue with minimal incremental degradation.
    This stacking approach is a structural advantage of battery storage and should
    be a baseline assumption in NEM business cases.'
