  project_name: Gannawarra Energy Storage System (GESS)
  what_happened: EnergyAustralia chose to operate GESS using human trading insight
    rather than automated bidding. This was a deliberate design decision driven by
    a desire to learn how the battery performs flexibly and to tune any future automation,
    and because automated bidding produces sub-optimal results in volatile or uncertain
    market conditions.
