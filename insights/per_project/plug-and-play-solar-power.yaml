  - 16
  evidence_excerpt: There does appear to be something of a knee-point in both the
    PV-penetration and generator-start curves around 140kWh – further increasing the
    battery size beyond this appears to have a substantially reduced impact on these
    metrics. The real system has been designed to minimise both diesel operation and
    capital costs in terms of battery sizing. This has resulted in a smaller than
    typical battery.
