  publish_date: '2017-03-10'
  project_name: Plug and Play Solar Project
  what_happened: Laboratory and in-field testing phases at CSIRO REIF (Newcastle)
    and NREL (Colorado) were identified as critical prerequisites before real-world
    deployment, enabling hardware/software debugging and the development of a body
    of knowledge for system operation that directly supported successful field deployments
    at Weipa and Port Hedland.
  lesson_learnt: For complex hardware-software integrated systems deployed in remote
    or operational environments, phased testing through laboratory then external test
    facility then field deployment provides essential debugging and knowledge-building
    that reduces risk at each subsequent stage; skipping intermediate testing phases
    would likely increase the risk of field deployment failure.
