- record_id: ARENA-DLV-61253
  source_title: Plug and Play Solar Project Results
  publish_date: '2017-03-10'
  project_name: Plug and Play Solar Project
  what_happened: Pre-curtailment of PV output to reduce fast ramp events increased
    diesel fuel consumption by only 0.7% (from 3,000 kL to 3,021 kL) while eliminating
    all ramp events beyond the response capabilities of the genset, demonstrating
    that the stability benefit of ramp optimisation does not come at a meaningful
    fuel cost penalty.
  lesson_learnt: Optimising for grid stability through PV pre-curtailment does not
    necessarily reduce fuel savings — the diesel cost of ramp mitigation at Weipa
    was less than 1%, making stability and fuel-efficiency goals compatible rather
    than competing in solar-diesel hybrid systems.
