- record_id: ARENA-DLV-61263
  source_title: Plug and Play Solar Project Results
  publish_date: '2017-03-10'
  project_name: Plug and Play Solar Project
  what_happened: The project's skycam forecasting algorithm used only a 1-minute-ahead
    forecast horizon trained on the first half of a 4-month dataset, with the second
    half used for validation — a relatively short training window that may limit generalisability
    across seasons or atypical weather patterns.
  lesson_learnt: When training machine learning forecasting models on operational
    data from remote sites, ensure training datasets cover sufficient seasonal and
    meteorological variability — a 2-month training window may not capture enough
    cloud pattern diversity to generalise well across all conditions, and longer data
    collection periods or multi-site training should be planned from the outset.
  issue_severity: minor
