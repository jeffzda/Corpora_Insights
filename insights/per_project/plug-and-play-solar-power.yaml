- record_id: ARENA-DLV-61255
  source_title: Plug and Play Solar Project Results
  publish_date: '2017-03-10'
  project_name: Plug and Play Solar Project
  what_happened: Battery sizing analysis at the Port Hedland (Meta Maya) site showed
    that the actual 76.8 kWh battery was smaller than optimal — simulations indicated
    a 140 kWh battery represented a knee-point, reducing generator starts from 444
    to 96 and fuel consumption from 4,214 L to 2,439 L, while further increases beyond
    140 kWh yielded diminishing returns.
  lesson_learnt: Battery sizing in solar-diesel hybrid systems should be validated
    post-deployment against real operational data — the Meta Maya site was designed
    to minimise capital cost with a smaller-than-typical battery, but modelling showed
    a 140 kWh battery (vs 77 kWh actual) would have reduced generator starts by 78%
    and fuel consumption by 42%, representing the economic optimum before diminishing
    returns set in.
  issue_severity: moderate
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Post-deployment simulation analysis using collected operational
    data identified the 140 kWh knee-point; findings were documented to inform future
    system sizing decisions as battery costs continue to fall.
  transferability: moderate
  delay_magnitude: null
  technology_domain: battery storage
  source_pages:
