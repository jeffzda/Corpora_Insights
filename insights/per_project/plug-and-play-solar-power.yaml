- record_id: ARENA-DLV-61264
  source_title: Plug and Play Solar Project Results
  publish_date: '2017-03-10'
  project_name: Plug and Play Solar Project
  what_happened: The ramp-rate reduction algorithm at Weipa produced a slight increase
    in upward solar ramps because the algorithm did not implement upward ramp rate
    limits — however, these remained within the response capabilities of a single
    generator and were identified as easily correctable in future development.
  lesson_learnt: Control algorithms for solar ramp management should include both
    upward and downward ramp rate constraints from the outset — omitting upward ramp
    limits in the initial implementation created a secondary ramp issue that, while
    minor in this case, could be problematic at sites with less generator headroom.
