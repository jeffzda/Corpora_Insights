- record_id: ARENA-DLV-61252
  source_title: Plug and Play Solar Project Results
  publish_date: '2017-03-10'
  project_name: Plug and Play Solar Project
  what_happened: The ramp-rate reduction algorithm was configured to be conservative
    — preferring ramp mitigation over maximising solar output — which caused it to
    curtail more PV power than necessary during smaller-than-predicted ramp events,
    as demonstrated in a specific 15:22 event at Weipa.
  lesson_learnt: Ramp-rate reduction algorithm conservatism settings create a trade-off
    between ramp mitigation reliability and maximising solar energy yield; operators
    should tune these settings to site-specific conditions rather than applying a
    single default configuration, as over-conservative settings unnecessarily spill
    solar generation.
  issue_severity: minor
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: research organisation/university
  delay_category: null
