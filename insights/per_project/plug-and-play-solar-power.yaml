  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Algorithm settings were identified as adjustable to suit particular
    sites; the document notes the results presented represent only one of a range
    of customisable settings.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id002
  - 13
  evidence_excerpt: The second event (at 15:22) was smaller than expected by the forecast,
    which meant that the inverter setpoint was reduced earlier than necessary, successfully
    avoiding the fast ramp event, but curtailing more power than necessary. This is
    caused by the algorithm having settings causing it to tend toward being more conservative
    – preferring ramp mitigation over maximising solar energy output. These settings
    can be adjusted to suit a particular site.
