  project_name: Plug and Play Solar Project
  what_happened: The diesel fuel estimation algorithm used to evaluate control modifications
    over-estimated actual fuel consumption by 5.5% (3,800 kL estimated vs 3,600 kL
    actual) when validated against real fuel data supplied by Rio Tinto at the Weipa
    site.
  lesson_learnt: Manufacturer fuel consumption curves provide only a broad estimation
    of actual dynamic diesel operation; when real operational fuel data is available
    from site operators, validate estimation algorithms against it before using them
    to assess control modifications — an unvalidated algorithm may misrepresent the
    true benefit of proposed changes.
