  what_happened: An independent market analysis by Navigant Consulting projected that
    solar forecasting technologies for microgrids could generate cumulative diesel
    fuel savings exceeding $330 million in Australia by 2025 under a moderate impact
    scenario, with $660 million under an aggressive scenario, providing a quantified
    commercial rationale for the technology.
  lesson_learnt: Commissioning independent market analysis to quantify the addressable
    commercial value of a research technology — expressed in fuel savings and diesel
    displacement rather than technical metrics — substantially strengthens the case
    for commercialisation and helps secure follow-on investment; this is particularly
    valuable for RAPS technologies where cost-of-supply data is readily available.
