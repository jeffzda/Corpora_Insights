  what_happened: The project developed an interface between the HOMER energy modelling
    platform and the OpenDSS power-flow software, enabling automated translation of
    HOMER outputs into OpenDSS — a process previously done manually — thereby accelerating
    the transition from high-level planning to detailed network modelling.
  lesson_learnt: Developing automated interfacing between high-level energy system
    planning tools (e.g. HOMER) and detailed power-flow modelling platforms (e.g.
    OpenDSS) can substantially reduce the time and labour required for network design
    studies in hybrid renewable systems; this integration capability should be considered
    a reusable infrastructure investment for organisations conducting repeated planning
    studies.
