  source_title: Plug and Play Solar Project Results
  publish_date: '2017-03-10'
  project_name: Plug and Play Solar Project
  what_happened: During field trials at Weipa, the skycam-based solar forecasting
    and ramp-rate reduction algorithm reduced high ramp rate events in diesel generators
    by 97% (from 490 to 13 events over the test period), achieved with only an 18%
    curtailment in solar energy production and less than 1% increase in diesel fuel
    consumption.
  lesson_learnt: Skycam-based short-term solar forecasting combined with pre-emptive
    PV curtailment can reduce high generator ramp rate events by over 97% at a minimal
    fuel cost penalty (<1%), making it a viable stability management tool for solar-diesel
    hybrid remote area power systems.
