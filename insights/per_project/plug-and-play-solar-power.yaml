- record_id: ARENA-DLV-61258
  source_title: Plug and Play Solar Project Results
  publish_date: '2017-03-10'
  project_name: Plug and Play Solar Project
  what_happened: At both the Weipa and Port Hedland field sites, the operational nature
    of the grids prevented CSIRO from fully controlling them during trials, meaning
    the team could not run controlled experiments and instead had to rely on post-hoc
    data analysis to generate predictions of outcomes.
  lesson_learnt: When deploying prototype control systems at operational commercial
    sites, researchers should negotiate clearly defined test windows or fallback simulation
    rights at the outset — inability to control the grid at either test site meant
    that performance results could only be modelled from collected data rather than
    demonstrated in controlled conditions, limiting the evidentiary strength of the
    findings.
