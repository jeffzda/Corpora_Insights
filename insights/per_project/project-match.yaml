  what_happened: Some inverter manufacturers could only communicate with approximately
    15% of their Australian fleet due to limited internet connectivity of installed
    devices, and others could not estimate what proportion of their fleet was internet-connected;
    this severely constrained the ability to remotely correct non-compliant grid code
    settings across the fleet.
  lesson_learnt: Internet connectivity should be treated as a prerequisite for remote
    compliance management of DER — where manufacturers cannot reach the majority of
    their fleet, remote correction of non-compliant settings is not viable at scale;
    connectivity requirements should be embedded in connection standards.
