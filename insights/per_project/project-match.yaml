  failure_mode: regulatory & approvals
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: execution & logistics
  intervention_note: AEMO initiated a proposal to review AS/NZS4777.2:2020 to remove
    legacy grid codes; four manufacturers also undertook remote updates to correct
    non-compliant inverters, raising the estimated correct grid-code rate from 37%
    to approximately 45% of Q1 2022 installations.
  transferability: broad
  delay_magnitude: null
  technology_domain: DER
  source_pages:
