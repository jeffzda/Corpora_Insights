- record_id: ARENA-DLV-48028
  source_title: Project Match Knowledge Sharing Report 2021-2022
  publish_date: 2022-09
  project_name: Project MATCH
  what_happened: The current upscaling method for DPV disconnection requires a minimum
    sample size per manufacturer/standard category and assigns all sites that do not
    fit defined categories to an 'other' group; when the 'other' category comprised
    approximately 30% of the raw dataset for some events, the reliability of upscaled
    estimates was materially compromised.
  lesson_learnt: DPV disconnection upscaling methods that rely on fixed predictor
    categories become unreliable when a large fraction of the sample falls in the
    'other' category — regression-based approaches such as generalised linear models
    that can handle unseen predictor combinations provide greater robustness and should
    replace bucket-based methods.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: A generalised linear model (GLM) approach is being developed
    to replace the bucket-based method, enabling estimates for unseen predictor combinations
    and addressing sample biases more flexibly.
  transferability: narrow
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id037
