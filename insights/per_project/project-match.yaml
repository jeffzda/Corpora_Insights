  source_title: Project Match Knowledge Sharing Report 2021-2022
  publish_date: 2022-09
  project_name: Project MATCH
  what_happened: A manufacturer identified that DPV sites with third-party monitoring
    are less likely to be internet-connected to the manufacturer's own monitoring
    system, meaning they typically do not receive firmware updates; this was confirmed
    when inverters from OEM P in third-party monitored datasets did not show improved
    behaviour after a remote ride-through firmware update that reached 95% of the
    total fleet.
  lesson_learnt: Third-party monitored DER datasets systematically under-represent
    internet-connected inverters that have received manufacturer firmware updates,
    making them non-representative of the broader fleet's current behaviour — this
    bias must be explicitly acknowledged when interpreting compliance and disturbance
    response analysis.
