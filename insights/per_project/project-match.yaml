- record_id: ARENA-DLV-40413
  source_title: UNSW - Project MATCH - Knowledge Sharing Report 2
  publish_date: 2023-12
  project_name: Project MATCH
  what_happened: The phase(s) experiencing voltage dips at high-voltage transmission
    level directly determine which phases experience dips in the distribution network,
    meaning that similar transmission-level disturbances can impact materially different
    populations of single-phase DER depending on which phase is affected.
  lesson_learnt: Fleet-level DER disturbance response estimates must account for phase-specific
    impacts — a single transmission-level event affecting different phases can produce
    very different aggregate DER disconnection outcomes depending on the phase distribution
    of the installed fleet.
