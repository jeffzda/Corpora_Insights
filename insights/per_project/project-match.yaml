- record_id: ARENA-DLV-48015
  source_title: Project Match Knowledge Sharing Report 2021-2022
  publish_date: 2022-09
  project_name: Project MATCH
  what_happened: Several large international inverter manufacturers could not track
    their Australian fleet by country of installation and required manual serial number
    lookups; when serial numbers from the DER Register were provided, only 52.8% were
    valid (e.g. 4,871 valid matches from 9,227 supplied serial numbers for one manufacturer),
    severely limiting the ability to assess or correct non-compliant inverters remotely.
  lesson_learnt: Accurate serial number recording at installation is essential for
    remote fleet management and compliance enforcement — the DER Register must enforce
    valid serial number entry, and manufacturers need country-level fleet visibility;
    without both, a large proportion of installed DER is invisible to compliance remediation
    programs.
