  what_happened: VPP operators were not given explicit guidance on how to align mismatched
    site-level timestamps before aggregating FCAS responses; analysis found at least
    four and likely seven or more VPPs were using truncation or rounding, which produces
    duplicate or missing observations and materially affects aggregate response profiles.
  lesson_learnt: Provide explicit instructions to VPP operators on timestamp alignment
    methodology for FCAS aggregation — truncation and rounding introduce systematic
    errors, while linear interpolation produces significantly more accurate aggregate
    profiles and should be the mandated standard.
