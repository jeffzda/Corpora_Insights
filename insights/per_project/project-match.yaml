- record_id: ARENA-DLV-48024
  source_title: Project Match Knowledge Sharing Report 2021-2022
  publish_date: 2022-09
  project_name: Project MATCH
  what_happened: Collecting valuable DER datasets from industry stakeholders required
    extremely active and ongoing engagement; many organisations expressed willingness
    to support the project but could not justify resources to improve monitoring capabilities
    (e.g. sub-60-second data granularity) because there was no clear business case
    or regulatory driver compelling expenditure.
  lesson_learnt: Research projects requiring industry-provided DER datasets should
    identify and advocate for regulatory data requirements early — voluntary data
    provision without a business case is unreliable and resource-intensive to sustain;
    regulatory mandates for minimum data granularity and sharing are necessary to
    support ongoing system security analysis.
