- record_id: ARENA-DLV-48021
  source_title: Project Match Knowledge Sharing Report 2021-2022
  publish_date: 2022-09
  project_name: Project MATCH
  what_happened: The Clopper-Pearson method used to quantify uncertainty in upscaled
    DPV disconnection estimates produced very wide confidence intervals — in some
    cases a range of up to 40% between upper and lower bounds — because the asymmetric
    interval widths for each manufacturer/standard category are summed, and uncertainty
    grows rapidly as additional predictor variables are added.
  lesson_learnt: When quantifying uncertainty in upscaled DER fleet estimates with
    multiple predictor categories, the Clopper-Pearson interval method produces unacceptably
    wide bounds due to additive asymmetry — bootstrapping or other resampling methods
    should be used instead to generate tighter, empirically-derived confidence intervals.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: operations
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: data & measurement
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: A bootstrapping method was developed and integrated into DERDAT,
    replacing the Clopper-Pearson interval summation approach and producing substantially
    tighter confidence bounds.
  transferability: moderate
  delay_magnitude: null
  technology_domain: DER
  source_pages:
