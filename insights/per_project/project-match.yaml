  project_name: Project MATCH
  what_happened: 'The Clean Energy Regulator (CER) register — used as the ''source
    of truth'' for the installed DPV population — has several known limitations: replacement
    rates may not be fully captured, there can be up to a one-year delay between installation
    and registration, and coverage is expected to decline as the SRES subsidy approaches
    its 2030 end date.'
  lesson_learnt: Do not rely solely on the CER register as the DPV population denominator
    for compliance or security studies — validate against AEMO's DER register and
    account for known lags and gaps, particularly for replacement systems and post-2030
    installations.
