  what_happened: The reactive, event-driven nature of Project MATCH's workplan — adapting
    to system events and emerging compliance data as they occurred — made scheduling
    and progress planning within the project difficult to manage and led to competing
    priorities between pre-planned and emerging activities.
  lesson_learnt: Research projects operating in a reactive mode (responding to unscheduled
    events) should establish a formal stocktake and prioritisation process at the
    commencement of each new activity — without this, emerging activities can displace
    planned work without explicit assessment of their value relative to project objectives.
