- record_id: ARENA-DLV-48013
  source_title: Project Match Knowledge Sharing Report 2021-2022
  publish_date: 2022-09
  project_name: Project MATCH
  what_happened: Despite the South Australian Voltage Disturbance Ride-Through (VDRT)
    requirement being introduced to reduce sympathetic DPV disconnections, inverters
    compliant with the VDRT standard disconnected at rates equal to or higher than
    2015-standard inverters during the 24 January 2021 (24% vs 20%) and 12 March 2021
    (20% vs 19%) events in South Australia.
  lesson_learnt: Performance standard testing regimes must account for the full range
    of disturbance phenomena that occur during real events — the VDRT tested for undervoltage
    sag ride-through but phase angle jumps (30–60°) present in both events appear
    to have caused disconnections that the standard did not address, rendering the
    VDRT ineffective under real-world conditions.
