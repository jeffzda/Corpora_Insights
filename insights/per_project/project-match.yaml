  source_title: UNSW - Project MATCH - Knowledge Sharing Report 2
  publish_date: 2023-12
  project_name: Project MATCH
  what_happened: Project MATCH found that different 'types' of compliance with the
    2020 Standard (pre-install, grid code selection at install, and ongoing in-field
    compliance) require different datasets and assessment methods, and that non-compliance
    with one type (e.g. Volt-VAr settings) does not necessarily indicate non-compliance
    with another (e.g. disturbance ride-through).
  lesson_learnt: When using compliance data to inform policy or regulatory decisions,
    clearly specify which 'type' of compliance is being measured — conflating Volt-VAr
    compliance (relevant to DNSPs) with ride-through compliance (relevant to AEMO/system
    security) can lead to misallocation of regulatory effort and incorrect risk assessments.
