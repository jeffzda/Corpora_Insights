  secondary_failure_mode: coordination & stakeholders
  intervention_note: The VPP FCAS tool was developed to support linear interpolation
    as the preferred timestamp alignment method, and numerical experiments confirmed
    it produced significantly lower error than truncation or rounding.
  transferability: moderate
