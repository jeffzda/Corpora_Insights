  - 47
  evidence_excerpt: Combining the information supplied by the manufacturers the remote
    inverter surveying, with market share data from the Clean Energy Regulator (CER),
    it is estimated that 37% of the fleet in the NEM is configured with the correct
    AS/NZS4777.2:2020 grid code at the time of installation. With the majority selecting
    the 2015 standard options... This highlights that most manufacturers have retained
    the old standards in their menu options, and installers are preferencing selection
    of these older standards during the installation process, leading to poor compliance
    to the 2020 Standard grid code.
