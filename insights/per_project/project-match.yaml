- record_id: ARENA-DLV-11854
  source_title: 'UNSW Sydney: Project MATCH Lessons Learnt Report 1'
  publish_date: '2021-09-24'
  project_name: Project MATCH (Monitoring and Analysis Toolbox for Compliance in a
    High DER future)
  what_happened: Analysis of multiple data sources including Solar Analytics data
    and NSP voltage condition datasets enabled cross-validation of observed DER behaviours
    during disturbance events in 2021, supporting more robust conclusions about the
    causes of DER disconnections than any single dataset could provide.
  lesson_learnt: Data-driven DER analysis projects should plan to integrate multiple
    complementary data sources from the outset — cross-referencing datasets from different
    sources (e.g. aggregator platforms, NSP voltage data, operational datasets) improves
    confidence in findings and helps distinguish genuine DER non-compliance from local
    network conditions.
