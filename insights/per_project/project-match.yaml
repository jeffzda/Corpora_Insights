  project_name: Project MATCH
  what_happened: During the 23 June 2022 South Australia power system oscillations
    event, one battery manufacturer observed that 95% of their fleet disconnected
    — caused by an external device that is a typical part of their installation configuration,
    not by the disturbance itself.
  lesson_learnt: Standard installation accessories and external devices (not the inverter
    or battery itself) can cause mass fleet disconnections during disturbance events
    — compliance testing and disturbance analysis must account for the full installation
    configuration, not only the primary DER equipment.
