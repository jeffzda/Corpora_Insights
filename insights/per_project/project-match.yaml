  - 63
  evidence_excerpt: 'Categories must have a minimum number of sites: The current upscaling
    method is only effective for well-defined categories and may have a large number
    of sites in the ''other'' category. There are often cases where there are insufficient
    samples for each of the categories to undertake meaningful upscaling. For example
    in the 5 March 2022 event, the ''other'' category was approximately 30% of the
    raw data set.'
