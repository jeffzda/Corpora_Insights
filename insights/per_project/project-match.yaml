- record_id: ARENA-DLV-40416
  source_title: UNSW - Project MATCH - Knowledge Sharing Report 2
  publish_date: 2023-12
  project_name: Project MATCH
  what_happened: The original DERDAT upscaling method could only accommodate a limited
    number of predictor variables because each additional predictor subdivided the
    dataset into smaller buckets, many of which fell below the minimum sample size
    threshold required for valid upscaling.
  lesson_learnt: Use a Generalised Linear Model (GLM) rather than a bucket-based upscaling
    method when predictor combinations are sparse — GLMs apply minimum sample thresholds
    per predictor rather than per combination, allowing more variables (e.g. system
    capacity, geographic zone) to be included without fragmenting the sample below
    validity thresholds.
  issue_severity: minor
  project_type: software/data/digital
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: operations
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: A GLM upscaling method was developed and integrated into DERDAT,
    with system capacity and geographic location added as new predictor options; cross-validation
    confirmed the four-predictor GLM had lower RMSE than the original bucket method.
  transferability: moderate
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id011
  - 27
  - 33
  evidence_excerpt: 'There is a limit to the number of predictors that can be used:
    With more predictors there is a smaller sample of sites with that specific set/combination
    of categories... A minimum number of sites is still applied per predictor but
    not per unique combination of predictors. Effectively the data does not need to
    be divided into as many buckets, so more predictors can be used, likely improving
    accuracy.'
