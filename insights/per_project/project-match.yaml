  project_name: Project MATCH
  what_happened: Site-to-site clock drift across VPP participants caused the reported
    time of the frequency nadir during the 25 May 2021 Callide disturbance to vary
    by 3–4 seconds between sites, corrupting VPP FCAS response aggregations because
    no minimum clock accuracy requirement exists for VPP sites.
  lesson_learnt: VPP operators and AEMO should require minimum clock accuracy standards
    (or GPS synchronisation) for individual VPP sites providing FCAS — in the absence
    of such requirements, clock drift can corrupt aggregated response profiles by
    several seconds, undermining FCAS delivery assessment.
