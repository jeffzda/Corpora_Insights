- record_id: ARENA-DLV-48014
  source_title: Project Match Knowledge Sharing Report 2021-2022
  publish_date: 2022-09
  project_name: Project MATCH
  what_happened: Following the introduction of AS/NZS4777.2:2020 on 18 December 2021,
    only 37% of inverters installed in Q1 2022 were configured with the correct 2020
    grid code at the time of installation; the majority were being configured with
    the legacy 2015 standard settings because manufacturers retained legacy options
    in their menus and installers defaulted to them.
  lesson_learnt: New mandatory performance standards for inverters will not achieve
    intended compliance rates if legacy grid code options remain available in installer
    menus — regulatory frameworks should require removal of superseded settings from
    product menus at the time a new standard becomes mandatory, not years later.
  issue_severity: major
  project_type: software/data/digital
