  what_happened: Voltage measurements at specific points in the transmission system
    were found not to be necessarily indicative of downstream distribution network
    voltages during disturbance events, due to complexities in network topology and
    local load/generation response.
  lesson_learnt: Transmission-level voltage measurements should not be assumed to
    represent distribution-level conditions at DER connection points — for compliance
    assessment purposes, use the most conservative assumption that the most extreme
    transmission dip could plausibly occur in the distribution network, pending further
    investigation of disturbance permeation.
