  project_name: Project MATCH
  what_happened: The original frequency trigger threshold was set at ±0.15 Hz but
    comparison with AEMO's high-speed frequency monitoring revealed the Wattwatchers
    devices produce noisier, lower-precision frequency measurements, causing false
    negatives under the original threshold; the correct threshold was found through
    trial and error to be +0.13/−0.14 Hz.
  lesson_learnt: Calibrate event trigger thresholds using a direct comparison between
    the monitoring device's measurements and a high-precision reference source — consumer-grade
    monitoring hardware typically has lower precision than utility-grade instruments,
    so thresholds derived from standards or reference systems may not translate directly.
  issue_severity: minor
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
