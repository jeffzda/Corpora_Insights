  source_title: UNSW - Project MATCH - Knowledge Sharing Report 2
  publish_date: 2023-12
  project_name: Project MATCH
  what_happened: Inverter OEMs took resource-intensive voluntary actions to improve
    2020 Standard compliance rates following engagement by the Project MATCH team,
    despite having no clear regulatory obligation or direct commercial incentive to
    do so in a competitive market.
  lesson_learnt: OEMs will act voluntarily on compliance when presented with credible,
    data-backed evidence of systemic risk — but sustainable compliance improvement
    requires a regulatory framework that makes responsibilities and incentives explicit,
    rather than depending on repeated goodwill-based engagement.
