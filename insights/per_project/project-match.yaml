  what_happened: Voltage triggers were initially configured to capture data only at
    devices that individually detected a voltage event; analysis found this made fleet-wide
    event assessment impractical because sites that did not see the disturbance were
    excluded, yet their data was needed to contextualise the response of affected
    sites.
  lesson_learnt: Configure voltage event triggers to capture data from all devices
    in a region when a threshold proportion of devices detect an event — understanding
    the spatial distribution of a disturbance requires data from both affected and
    unaffected sites, not just those that individually triggered.
