  what_happened: During validation of the Solar Analytics frequency trigger, a bottlenecking
    issue was identified when frequency events triggered data collection across multiple
    NEM regions simultaneously — the volume of records per second exceeded the throughput
    limit of the Solar Analytics cloud infrastructure, causing incomplete data capture.
  lesson_learnt: When designing distributed IoT data collection systems that must
    respond to simultaneous multi-region events, validate back-end infrastructure
    throughput under worst-case load conditions before deployment — capacity bottlenecks
    during multi-region events can result in data gaps exactly when high-quality event
    data is most critical.
