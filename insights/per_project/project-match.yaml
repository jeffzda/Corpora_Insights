  intervention_note: The frequency threshold was adjusted from ±0.15 Hz to +0.13/−0.14
    Hz after comparative analysis of Solar Analytics and AEMO frequency data, successfully
    reducing false negatives while retaining relevant event capture.
  transferability: moderate
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id025
  - 41
  evidence_excerpt: The frequency data collected by WW devices has a lower precision
    and tends to be noisy compared to AEMO's high-speed frequency monitoring. The
    analysis showed that the original thresholds selected +/- 0.15Hz, a number of
    false negatives were detected. Through trial and error, it was identified that
    by changing the frequency threshold to +0.13/-0.14Hz, it successfully prevented
    most of the potential false negatives while sufficiently capturing the relevant
    frequency events.
