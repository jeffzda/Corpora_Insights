- record_id: ARENA-DLV-48029
  source_title: Project Match Knowledge Sharing Report 2021-2022
  publish_date: 2022-09
  project_name: Project MATCH
  what_happened: Analysis of over-frequency events found that only approximately 50%
    of post-2015 standard inverters demonstrated frequency-watt curtailment as required,
    and of those that did, a further subset curtailed insufficiently to be compliant;
    compliance rates also differed significantly between manufacturers.
  lesson_learnt: In-field compliance with the frequency-watt response requirements
    of AS/NZS4777.2:2015 is substantially lower than assumed — AEMO and regulators
    should not assume that installation to a particular standard guarantees the associated
    response behaviour, as manufacturer-specific implementation differences result
    in compliance rates that can vary dramatically by OEM.
