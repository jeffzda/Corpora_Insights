- record_id: ARENA-DLV-48022
  source_title: Project Match Knowledge Sharing Report 2021-2022
  publish_date: 2022-09
  project_name: Project MATCH
  what_happened: Error codes obtained from one inverter manufacturer during the 25
    May 2021 event showed a clear spike at the time of the event but could not be
    used to determine the specific trigger, type of response, or whether the event
    was transmission- or locally-caused; the same generic codes (e.g. 'grid failure')
    also appeared frequently throughout the day, making them unreliable as event validators.
  lesson_learnt: Inverter error codes in their current form are insufficient for DER
    disturbance analysis — codes need to be standardised across manufacturers, made
    specific enough to identify the triggering parameter (voltage, frequency, RoCoF,
    phase angle), and must be accompanied by time-series energy data to be analytically
    useful.
