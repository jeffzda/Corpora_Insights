  source_title: Project Match Knowledge Sharing Report 2021-2022
  publish_date: 2022-09
  project_name: Project MATCH
  what_happened: Balancing the need for transparency about project findings with protection
    of the competitive interests of data providers who share proprietary fleet data
    was an ongoing challenge throughout the project, requiring careful management
    of how results were reported in aggregate and how individual organisations were
    identified.
  lesson_learnt: Research projects relying on commercially sensitive industry data
    should establish explicit data confidentiality protocols with providers at the
    outset — de-identification of findings and aggregate-only reporting must be agreed
    before data is received to maintain long-term data sharing relationships and avoid
    constraining publication of results.
