- record_id: ARENA-DLV-48019
  source_title: Project Match Knowledge Sharing Report 2021-2022
  publish_date: 2022-09
  project_name: Project MATCH
  what_happened: All three DER monitoring datasets (Solar Analytics, Tesla, EQL-Luceo)
    contained inherent sample biases in location, installation standard, site capacity,
    and manufacturer representation relative to the true NEM fleet distribution from
    the CER dataset; these biases distort raw disconnection estimates and must be
    corrected through statistical upscaling before fleet-level inferences can be made.
  lesson_learnt: Where universal DER visibility is unavailable, invest in robust statistical
    upscaling methods (e.g. generalised linear models with bootstrapped confidence
    intervals) and make sampling biases and error bounds explicit in all outputs —
    raw sample percentages without upscaling can materially misrepresent fleet-level
    behaviour.
