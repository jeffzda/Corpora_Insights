- record_id: ARENA-DLV-48026
  source_title: Project Match Knowledge Sharing Report 2021-2022
  publish_date: 2022-09
  project_name: Project MATCH
  what_happened: Data storage for the project's large granular time-series datasets
    (typically 5–10 GB per dataset covering tens of thousands of sites) was identified
    as a significant financial barrier; staff downloaded raw data individually from
    CloudStor and performed analysis independently rather than from a central database,
    limiting efficiency and collaboration.
  lesson_learnt: Research projects handling large-scale DER time-series datasets should
    budget explicitly for centralised data warehousing infrastructure from project
    inception — distributed ad hoc storage and analysis workflows are inefficient
    at scale and create data management risks that compound as dataset volumes grow.
