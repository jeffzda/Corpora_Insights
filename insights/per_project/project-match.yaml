- record_id: ARENA-DLV-40403
  source_title: UNSW - Project MATCH - Knowledge Sharing Report 2
  publish_date: 2023-12
  project_name: Project MATCH
  what_happened: Project MATCH could not assess voltage ride-through (including multiple
    voltage dips) or phase angle jump ride-through compliance using available DER
    operational datasets because voltage disturbance events occur over ~200ms while
    most voltage datasets are captured at 5-10s resolution, and waveform data required
    for phase angle jump analysis is absent.
  lesson_learnt: Future projects aiming to assess inverter behaviour during disturbances
    should formally scope very high resolution (waveform) monitoring in the distribution
    network from the outset — the absence of this data creates a critical gap in understanding
    how disturbances manifest and whether inverters are behaving to standard.
