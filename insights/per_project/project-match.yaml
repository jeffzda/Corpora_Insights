  what_happened: The original frequency trigger had a 20-minute re-trigger delay to
    prevent duplicate data capture; because the data buffer is 10 minutes and burst
    mode lasts only 7 minutes, this created a potential 3-minute gap during long or
    sequential disturbances where event data could be missed entirely.
  lesson_learnt: When configuring event-triggered data collection, ensure the re-trigger
    delay is shorter than the buffer plus burst window — a delay longer than the recording
    window creates gaps in coverage during prolonged or sequential grid disturbances.
