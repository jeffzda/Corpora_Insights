  what_happened: Progress on DER integration improvements — including improving compliance
    rates with the 2020 Standard — relied heavily on goodwill, cooperation and voluntary
    actions by industry stakeholders due to the absence of clear governance arrangements
    for DER technical standards and compliance monitoring.
  lesson_learnt: Without clear regulatory assignment of responsibility for DER compliance
    monitoring and enforcement, industry progress depends on goodwill and is fragile
    — advocate for and participate in the development of formal DER governance frameworks
    that assign roles, fund compliance monitoring, and create enforceable pathways
    for engaging OEMs.
