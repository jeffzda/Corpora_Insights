    systems that respond to dynamic operating envelopes and unlock distributed energy'
  publish_date: 2022-02
  project_name: Smarter Homes for Distributed Energy (HEMS/DOE Readiness Study)
  what_happened: The HEMS market in Australia reached an early level of commercialisation
    but no HEMS provider had successfully scaled beyond niche markets (primarily households
    with batteries), with barriers to mass deployment remaining primarily commercial
    rather than technical.
  lesson_learnt: Projects deploying HEMS at scale should expect commercial barriers
    — including low value propositions for customers on flat tariffs, high equipment
    costs, and limited revenue stacking — to be the primary constraint on uptake,
    not technical readiness; business model design and tariff access should be addressed
    in project scoping.
