  publish_date: 2022-02
  project_name: Smarter Homes for Distributed Energy (HEMS/DOE Readiness Study)
  what_happened: The use of proprietary communication protocols by DER OEMs created
    closed on-site ecosystems, preventing HEMS providers from achieving optimal local
    control of customer assets and increasing integration costs; even where open standards
    were used, high levels of proprietary interpretation by OEMs led to variable implementation
    and persistent interoperability barriers.
  lesson_learnt: DER projects that rely on HEMS orchestrating multiple customer assets
    should conduct device-level interoperability assessments at procurement — proprietary
    protocols and non-standard OEM implementations of open standards frequently prevent
    full control, forcing HEMS to fall back to binary on/off switching and reducing
    the value that can be unlocked.
