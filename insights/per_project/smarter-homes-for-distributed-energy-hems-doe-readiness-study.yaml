  what_happened: HEMS technology for residential customers was assessed at Technology
    Readiness Level 8 (system completed and qualified through test and demonstration),
    but had not yet reached TRL 9 (proven through successful operations) because IEEE
    2030.5 capabilities had not been successfully demonstrated across all HEMS products
    in the evolving DOE operational environment.
  lesson_learnt: Projects that assume HEMS products are commercially and technically
    deployment-ready for DOE environments should verify IEEE 2030.5 compliance specifically
    in the target DNSP's implementation (CSIP-AUS) — not all HEMS providers had successfully
    demonstrated this capability at the time of the study, and nominal TRL 8 status
    does not guarantee operational readiness for DOE compliance.
