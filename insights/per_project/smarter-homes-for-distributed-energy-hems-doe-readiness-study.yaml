- record_id: ARENA-DLV-67268
  source_title: 'Smarter Homes for Distributed Energy: Towards home energy management
    systems that respond to dynamic operating envelopes and unlock distributed energy'
  publish_date: 2022-02
  project_name: Smarter Homes for Distributed Energy (HEMS/DOE Readiness Study)
  what_happened: The hierarchy of responses when HEMS signals from market participation
    (e.g. pre-dispatch FCAS commitments) conflict with DOE instructions from a DNSP
    had not been defined, creating a risk that aggregators could face compliance failures
    if their committed market dispatch position contradicted a DOE issued by the local
    DNSP.
  lesson_learnt: Projects or programs combining VPP/FCAS market participation with
    DOE compliance should not proceed to commercial operation without a defined signal
    hierarchy — the unresolved interaction between pre-dispatch market commitments
    and real-time DOE constraints is a compliance risk that needs to be resolved in
    system design and contractual terms before customer enrolment.
