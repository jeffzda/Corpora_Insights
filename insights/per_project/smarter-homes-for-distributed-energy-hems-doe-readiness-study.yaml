- record_id: ARENA-DLV-67258
  source_title: 'Smarter Homes for Distributed Energy: Towards home energy management
    systems that respond to dynamic operating envelopes and unlock distributed energy'
  publish_date: 2022-02
  project_name: Smarter Homes for Distributed Energy (HEMS/DOE Readiness Study)
  what_happened: Responsibility for compliance with dynamic operating envelopes had
    not been clearly defined in regulation or contracts at the time of the study,
    creating uncertainty about whether the customer, HEMS service provider, or aggregator
    bore liability for DOE breaches, and how enforcement would work.
  lesson_learnt: DER programs deploying DOEs should not proceed to customer rollout
    without first establishing clear contractual allocation of compliance responsibility
    and a defined enforcement mechanism — ambiguity in who is liable for DOE breaches
    creates consumer protection risks and could expose customers to penalties for
    breaches driven by their service provider's actions.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: approvals/contracting
  proponent_type: technology vendor
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: coordination & stakeholders
  intervention_note: Legal analysis by Allens recommended developing a bespoke regulatory
    framework that balances consumer obligations, DNSP enforcement needs, and the
    role of HEMS providers, with clear consumer education about compliance obligations.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: DER
  source_pages: &id008
  - 56
