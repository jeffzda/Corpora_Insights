  publish_date: 2022-02
  project_name: Smarter Homes for Distributed Energy (HEMS/DOE Readiness Study)
  what_happened: The value proposition of HEMS was found to be relatively low for
    residential customers on flat tariffs, because key value streams such as tariff
    arbitrage require time-of-use or demand tariffs to be commercially meaningful;
    the absence of cost-reflective retail tariffs was a structural barrier to HEMS
    uptake at scale.
  lesson_learnt: HEMS deployment programs targeting broad residential uptake should
    assess the tariff structures of the target customer base before projecting adoption
    rates — customers on flat tariffs receive materially lower HEMS value, meaning
    program benefits will be concentrated among customers with time-of-use or demand
    pricing; advocacy for cost-reflective tariff reform may be a necessary enabling
    condition.
