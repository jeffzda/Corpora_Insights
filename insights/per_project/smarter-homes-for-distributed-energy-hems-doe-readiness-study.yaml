  what_happened: HEMS providers across Australia were actively managing cyber security,
    but no mandatory minimum requirements for managing cyber security for distributed
    energy resources existed in the Australian electricity market at the time of the
    study; guidelines for interoperability standards did not cover the aggregator-to-customer-asset
    link, creating a potential consumer protection and power system security gap.
  lesson_learnt: Projects deploying cloud-connected HEMS or aggregator-managed DER
    should not rely on voluntary cyber security practices alone — the absence of mandatory
    minimum requirements means cyber security quality varies across providers, creating
    portfolio-level risk; projects should specify minimum cyber security standards
    (e.g. ISO/IEC 27001, penetration testing cadence) as a contract requirement.
