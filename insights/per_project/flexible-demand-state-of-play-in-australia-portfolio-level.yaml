  project_name: Flexible Demand – State of Play in Australia (portfolio-level)
  what_happened: Piloting of smart charging for commercial and government EV fleets
    has lagged well behind household EV pilots; fleets were a component of two pilots
    but no performance data was generated by either, leaving commercial fleet flexible
    demand essentially untested.
  lesson_learnt: Future ARENA FD investment should prioritise commercial and government
    fleet EV smart charging pilots with defined performance measurement frameworks
    — the absence of fleet charging performance data is a material gap in the evidence
    base for a load segment with large potential, and past pilots failed to generate
    usable data from fleet components.
