- record_id: ARENA-DLV-51499
  source_title: UTS - Flexible Demand State of Play in Australia - Report
  publish_date: 2024-05
  project_name: Flexible Demand – State of Play in Australia (portfolio-level)
  what_happened: International jurisdictions with capacity payment mechanisms have
    consistently higher demand response participation (5–11% of peak demand) than
    Australia, where capacity payments are limited in the NEM and the only policy
    with a clear scaling pathway for FD is the NSW Peak Demand Reduction Scheme.
  lesson_learnt: Scaling flexible demand beyond small-scale pilots in the NEM requires
    revenue certainty mechanisms such as capacity payments — international evidence
    consistently shows that jurisdictions with capacity markets attract the most demand
    response participation, and the current absence of this mechanism is a primary
    structural barrier to investment in FD assets and aggregation platforms in Australia.
