- record_id: ARENA-DLV-51451
  source_title: UTS - Flexible Demand State of Play in Australia - Report
  publish_date: 2024-05
  project_name: Flexible Demand – State of Play in Australia (portfolio-level)
  what_happened: The Wholesale Demand Response Mechanism (WDRM) has been in operation
    for over four years but only one participant (Enel X) has registered, with 65.3
    MW of capacity equating to just 0.2% of peak demand — far below the 5–11% seen
    in leading international jurisdictions. Baseline methodologies for measurement
    exclude up to 80% of loads and the residential sector is excluded entirely.
  lesson_learnt: When market access mechanisms for flexible demand are tied to a single
    eligibility pathway that itself has extremely low participation, the result is
    a near-complete blockage of new entrants; portfolio managers and policy designers
    should ensure alternative pathways or direct eligibility routes exist for FD in
    capacity and long-term contracts schemes.
