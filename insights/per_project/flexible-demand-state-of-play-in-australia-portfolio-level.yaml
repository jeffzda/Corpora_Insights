- record_id: ARENA-DLV-51494
  source_title: UTS - Flexible Demand State of Play in Australia - Report
  publish_date: 2024-05
  project_name: Flexible Demand – State of Play in Australia (portfolio-level)
  what_happened: A consistent finding across flexible demand consumer research is
    that trial populations are heavily skewed toward demographically unrepresentative
    groups — predominantly men aged 50 and over who are highly technology-engaged
    — because the target technologies are at early adoption stages with in-built demographic
    bias.
  lesson_learnt: Flexible demand pilot results derived from early adopter populations
    cannot be extrapolated to mass-market deployment without adjustment — future pilots
    targeting scale should deliberately recruit participants from broader demographic
    groups and apply correction factors when using early adopter data for market sizing
    or value estimation.
