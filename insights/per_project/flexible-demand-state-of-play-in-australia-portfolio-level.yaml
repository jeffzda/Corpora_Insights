  what_happened: Modelling by NERA Economic Consulting found that flexible demand
    achieves savings of $3–18 billion to 2042, with the highest benefits ($8–18 billion)
    in scenarios with high distributed energy resources, but a comprehensive evaluation
    of the current value of FD or its full potential does not yet exist.
  lesson_learnt: Investment decisions for FD programs should be informed by scenario-specific
    benefit modelling rather than a single headline figure — the order-of-magnitude
    difference between baseline ($1–6 billion) and high-DER ($8–18 billion) scenarios
    shows that FD value is highly dependent on the broader energy transition pathway,
    and network benefits are not yet captured in the most comprehensive models.
