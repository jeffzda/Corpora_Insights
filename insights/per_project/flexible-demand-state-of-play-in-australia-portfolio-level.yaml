  source_title: UTS - Flexible Demand State of Play in Australia - Report
  publish_date: 2024-05
  project_name: Flexible Demand – State of Play in Australia (portfolio-level)
  what_happened: The Demand Management Incentive Scheme (DMIS) was capped at 1% of
    distribution network allowable revenue equating to around $1 billion of available
    investment, but only $3 million of projects were funded between 2017 and 2022
    — less than 0.3% of available funds utilised.
  lesson_learnt: Financial incentive schemes for network demand management are insufficient
    on their own to drive uptake; the DMIS experience shows that a funding mechanism
    without complementary regulatory drivers, simplified application pathways, or
    clear commercial models will be largely unused even when substantial capital is
    available.
