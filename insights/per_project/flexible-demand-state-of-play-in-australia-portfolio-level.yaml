- record_id: ARENA-DLV-51495
  source_title: UTS - Flexible Demand State of Play in Australia - Report
  publish_date: 2024-05
  project_name: Flexible Demand – State of Play in Australia (portfolio-level)
  what_happened: Most flexible demand pilots across the ARENA portfolio are focused
    on value-pairing (combining two types of service and revenue), while the portfolio
    retrospective found barriers to combining more than two value-streams; combining
    RERT with network revenue is treated as 'double-dipping' and some loads are inherently
    unsuited to particular value-streams.
  lesson_learnt: FD program designers should not assume value-stacking across more
    than two revenue streams is viable under current rules — 'double-dipping' concerns
    between RERT and network services create real barriers, and some load types are
    technically incompatible with certain value streams; business cases should be
    built around the two most accessible value-streams for each load type and regulatory
    reform advocated for broader stacking.
