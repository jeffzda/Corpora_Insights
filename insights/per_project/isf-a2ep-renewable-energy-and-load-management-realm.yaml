- record_id: ARENA-DLV-53882
  source_title: Demand Flexibility Portfolio Retrospective Analysis Report
  publish_date: 2023-07
  project_name: ISF & A2EP Renewable Energy and Load Management (REALM)
  what_happened: The REALM feasibility assessments across C&I sites (big-box retail,
    cold store, food manufacturing) found that retail tariffs did not reflect the
    value of demand flexibility; without tariffs that incorporated the value of external
    market and network services, developing a financially viable business case for
    on-site TES and demand flexibility technologies was not possible.
  lesson_learnt: C&I demand flexibility projects that rely solely on bill reduction
    through on-site generation and load shaping — without accessing external value
    streams or cost-reflective tariffs — will consistently struggle to meet commercial
    return thresholds; project design must incorporate explicit value stream access
    or tariff reform as a prerequisite for viability.
