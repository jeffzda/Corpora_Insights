- record_id: ARENA-DLV-57203
  source_title: 'Large-Scale Solar in Australia: The Past, Present and Future'
  publish_date: 2016-07
  project_name: ARENA Large Scale Solar Competitive Funding Round
  what_happened: By mid-2016 the Australian debt market had materially improved for
    large-scale solar, with PPA debt service cover ratios as low as 1.25x being offered,
    merchant debt products available from major banks, significant international lender
    interest, and longer tenor and amortisation periods reducing refinancing risk.
    This was identified as a primary driver of falling project costs.
  lesson_learnt: Debt market maturation — including lower DSCRs, merchant debt products,
    international capital, and longer tenors — can be a primary cost-reduction lever
    for utility-scale solar. Project developers and programme managers should actively
    cultivate both domestic and international debt market participants early in programme
    development to accelerate cost compression.
