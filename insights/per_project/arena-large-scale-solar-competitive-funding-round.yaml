- record_id: ARENA-DLV-57205
  source_title: 'Large-Scale Solar in Australia: The Past, Present and Future'
  publish_date: 2016-07
  project_name: ARENA Large Scale Solar Competitive Funding Round
  what_happened: By mid-2016 the large-scale solar EPC and supply chain market in
    Australia had matured to the point where construction companies had become the
    dominant winning bidders in the EPC market, supply chains had developed familiarity
    with solar project processes, and the broader ecosystem of advisors, regulators,
    communities, and DNSPs had gained substantially increased exposure and experience.
  lesson_learnt: 'Market maturation — construction-specialist EPC bidders, supply
    chain familiarity, and informed regulators and communities — meaningfully reduces
    delivery risk for subsequent projects. Programme managers scaling up solar deployment
    should expect and plan for this maturation effect: early-mover projects absorb
    higher delivery risk and cost, which reduces for later projects in the same programme
    cycle.'
