- record_id: ARENA-DLV-57204
  source_title: 'Large-Scale Solar in Australia: The Past, Present and Future'
  publish_date: 2016-07
  project_name: ARENA Large Scale Solar Competitive Funding Round
  what_happened: By mid-2016, single-axis tracking systems were beginning to show
    superior value for money compared to fixed-tilt systems as EPC pricing firmed,
    with tracking outperforming fixed-tilt in funding percentage of capital costs
    at comparable EPC price points in some areas. The relationship between AC:DC sizing,
    fixed vs tracking configuration, marginal loss factors, and time-of-day pricing
    was identified as a key system optimisation lever.
  lesson_learnt: Single-axis tracking should be evaluated against fixed-tilt on a
    value-for-money basis — not assumed inferior — particularly where time-of-day
    pricing rewards afternoon generation. System optimisation decisions (AC:DC ratio,
    tracking vs fixed, MLF and DLF, module quality) should be assessed location-specifically
    rather than applying a single default configuration.
