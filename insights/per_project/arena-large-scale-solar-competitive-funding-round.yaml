- record_id: ARENA-DLV-57201
  source_title: 'Large-Scale Solar in Australia: The Past, Present and Future'
  publish_date: 2016-07
  project_name: ARENA Large Scale Solar Competitive Funding Round
  what_happened: Across 20 projects reaching Full Application stage in the ARENA Large
    Scale Solar Competitive Funding Round, the average ARENA grant ask fell by 33%
    between the Expression of Interest and Full Application phases, indicating competitive
    discipline and cost improvement during the application process.
  lesson_learnt: A competitive multi-stage funding process with EOI and full-application
    phases drives meaningful reductions in grant ask — approximately one-third — as
    proponents refine designs and compete for limited grant funds. Programme designers
    should anticipate this compression and not anchor on EOI-stage grant requests
    when sizing programme budgets.
