- record_id: ARENA-DLV-57202
  source_title: 'Large-Scale Solar in Australia: The Past, Present and Future'
  publish_date: 2016-07
  project_name: ARENA Large Scale Solar Competitive Funding Round
  what_happened: As of mid-2016, solar PV projects in Australia still required a grant
    of approximately $0.20–$0.40 per installed watt DC to bridge the gap between project
    capital cost and the amount of commercial debt and equity the project revenue
    could support, while CST projects required $0.90–$2.00 per watt. Onshore wind
    required no grant subsidy.
  lesson_learnt: When structuring funding programmes for utility-scale solar, expect
    a residual commerciality gap of $0.20–$0.40/W for solar PV and up to $2.00/W for
    CST that grant funding must bridge. This gap should be explicitly modelled in
    programme design rather than assumed to close without subsidy support.
