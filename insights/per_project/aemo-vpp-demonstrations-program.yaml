- record_id: ARENA-DLV-52515
  source_title: ARENA's Virtual Power Plant Knowledge Sharing Workshop Summary
  publish_date: 2019-03
  project_name: AEMO VPP Demonstrations Program
  what_happened: VPP cloud-to-cloud communication and control technology was at the
    cutting edge globally at the time of the workshop, with teething issues expected
    that needed to be resolved before the technology could be considered proven, reliable,
    and secure.
  lesson_learnt: Plan explicitly for commissioning and integration risk in VPP deployments
    — cloud-to-cloud control technology is globally novel, and 'teething issues' should
    be anticipated, resourced for, and resolved through structured demonstration programs
    before relying on the technology for system security services.
