- record_id: ARENA-DLV-52514
  source_title: ARENA's Virtual Power Plant Knowledge Sharing Workshop Summary
  publish_date: 2019-03
  project_name: AEMO VPP Demonstrations Program
  what_happened: The existing regulatory framework in Australia was described as outdated
    and as stifling VPP 'value stack' innovation (combining energy, FCAS, and network
    support), and VPP operations were invisible to AEMO, presenting potential system
    security risks as VPP penetration grew.
  lesson_learnt: VPP programs must be designed with operational visibility to the
    system operator (AEMO) from the outset — operating VPPs outside system operator
    sight creates system security risks and prevents full value stack participation;
    regulatory framework changes should be pursued in parallel with technical deployment.
