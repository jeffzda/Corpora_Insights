  publish_date: 2019-09
  project_name: 'High-Efficiency Silicon-Perovskite Tandem Cells and Modules: Demonstration
    and Commercial Evaluation'
  what_happened: Perovskite cell stability and durability remained an open challenge
    throughout the project. The techno-economic analysis assumed module lifetime and
    degradation rates matching standard crystalline silicon modules, an assumption
    not yet validated for perovskite-silicon tandem technology.
  lesson_learnt: Do not assume perovskite module lifetime parity with crystalline
    silicon in techno-economic models until validated by long-term outdoor testing;
    future projects must treat durability and lifetime improvement as a core deliverable,
    not an ancillary concern, as unresolved lifetime uncertainty directly undermines
    commercial viability conclusions.
