- record_id: ARENA-DLV-59708
  source_title: 'High-Efficiency Silicon-Perovskite Tandem Cells and Modules: Demonstration
    and Commercial Evaluation'
  publish_date: 2019-09
  project_name: 'High-Efficiency Silicon-Perovskite Tandem Cells and Modules: Demonstration
    and Commercial Evaluation'
  what_happened: Techno-economic analysis identified several high-cost material items
    — including spiro-OMeTAD hole transport layer, PCBM, lead iodide, and TiO2 paste
    for mesoporous TiO2 — as significant cost barriers that would need to be replaced
    or reduced for the technology to achieve commercial viability.
  lesson_learnt: Identify and prioritise replacement of high-cost materials (e.g.,
    spiro-OMeTAD, PCBM) early in the R&D roadmap; switching to cheaper alternatives
    such as SnO2-only processing can simultaneously reduce cost and enable larger-area
    fabrication without sacrificing cell performance.
