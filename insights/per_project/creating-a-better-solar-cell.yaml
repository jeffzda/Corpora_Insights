- record_id: ARENA-DLV-59702
  source_title: 'High-Efficiency Silicon-Perovskite Tandem Cells and Modules: Demonstration
    and Commercial Evaluation'
  publish_date: 2019-09
  project_name: 'High-Efficiency Silicon-Perovskite Tandem Cells and Modules: Demonstration
    and Commercial Evaluation'
  what_happened: Techno-economic analysis based on lab-demonstrated fabrication processes
    found that tandem cell efficiency targets above 35% on commercial 6-inch square
    silicon wafers are required for cost competitiveness — well above the highest
    efficiency demonstrated anywhere in the world at project completion.
  lesson_learnt: Future projects should prioritise cost reduction pathways (low-cost
    materials, scalable manufacturing with lower material utilisation) alongside efficiency
    improvements, because efficiency targets required for commercial viability significantly
    exceed what is currently achievable in the lab. Scaling up to commercial cell
    sizes while maintaining efficiency is non-trivial and must be treated as a distinct
    workstream.
