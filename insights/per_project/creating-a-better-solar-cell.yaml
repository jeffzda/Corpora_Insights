- record_id: ARENA-DLV-59705
  source_title: 'High-Efficiency Silicon-Perovskite Tandem Cells and Modules: Demonstration
    and Commercial Evaluation'
  publish_date: 2019-09
  project_name: 'High-Efficiency Silicon-Perovskite Tandem Cells and Modules: Demonstration
    and Commercial Evaluation'
  what_happened: Monolithic (2-terminal) silicon-perovskite tandem integration with
    homo-junction silicon bottom cells — which represent ~90% of the global PV market
    — was a major unsolved problem at project start. The project demonstrated multiple
    low-cost interfacing approaches achieving efficiencies up to 23% on 4 cm² and
    22% on 16 cm², using homo-junction silicon cells compatible with established industry
    processes.
  lesson_learnt: When targeting commercial-scale tandem technology, prioritise integration
    approaches compatible with the dominant industrial substrate (homo-junction silicon)
    rather than optimising for laboratory heterojunction cells — compatibility with
    existing manufacturing infrastructure is a prerequisite for commercial relevance.
