  what_happened: The multi-institutional collaborative structure of the project (UNSW,
    ANU, Monash, and others) enabled knowledge sharing through research exchanges,
    hands-on training, and joint demonstrations, and generated spin-off follow-on
    projects including further ARENA-funded work and ARC-funded projects across multiple
    institutions.
  lesson_learnt: Structuring early-stage R&D as a multi-institutional collaboration
    with explicit knowledge-sharing mechanisms (exchanges, visits, hands-on training)
    accelerates capability building across the sector and increases the probability
    of follow-on investment and spin-off projects.
