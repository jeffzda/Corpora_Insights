  project_name: 'High-Efficiency Silicon-Perovskite Tandem Cells and Modules: Demonstration
    and Commercial Evaluation'
  what_happened: The project successfully developed low-cost polyisobutylene (PIB)-based
    encapsulation methods that passed all IEC61215:2016 accelerated stress tests (thermal
    cycling, damp heat, humidity freeze), with some cells exceeding requirements by
    800 hours of damp heat and 20 humidity freeze cycles.
  lesson_learnt: PIB-based encapsulation adapted from OLED technology is an effective
    and low-cost approach for perovskite cell protection that meets industry-standard
    PV module qualification tests — future projects should adopt this approach rather
    than developing new encapsulation schemes from scratch.
