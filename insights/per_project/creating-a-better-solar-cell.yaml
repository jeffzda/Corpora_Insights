  what_happened: The materials budget was underestimated in the project proposal.
    R&D work proved highly material-intensive, resulting in the allocated budget for
    materials being insufficient.
  lesson_learnt: For R&D projects involving novel cell fabrication, substantially
    increase the materials budget at the proposal stage — lab-based R&D consumes materials
    at a rate that is routinely underestimated.
