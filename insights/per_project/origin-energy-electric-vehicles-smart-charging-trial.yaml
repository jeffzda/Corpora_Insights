  publish_date: 2022-05
  project_name: Origin EV Smart Charging Trial
  what_happened: In Experiment 2, Origin took direct control of participant chargers
    with a combined fixed (25c/day) and variable (10c/kWh) incentive structure, achieving
    a 24% reduction in peak charging compared to baseline and a further 4% reduction
    versus incentive-only Experiment 1. Participants also valued the app override
    functionality, which allowed them to reclaim control when needed.
  lesson_learnt: Retailer-controlled EV charging with an override option outperforms
    incentive-only approaches for peak curtailment and is likely more reliable at
    scale with less-engaged customers — the 'plug and forget' convenience factor drives
    compliance. Retaining a customer override is important for trust and acceptance.
