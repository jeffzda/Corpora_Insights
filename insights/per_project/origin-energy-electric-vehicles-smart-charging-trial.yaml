  source_title: Origin Energy Smart Charging Trial - Final report
  publish_date: '2023-08-28'
  project_name: Origin Energy Smart Charging Trial
  what_happened: Residential participants offered free chargers as part of the trial
    were less responsive to installation logistics than paying customers, and some
    withdrew when unexpected variation costs arose even when those costs were small
    relative to the subsidy value.
  lesson_learnt: When subsidising charger installations for trials, anticipate that
    participants receiving free equipment will be less motivated to progress installation
    promptly. Minimise participant-facing variation costs entirely, or frame cost
    transparency upfront — even small unexpected costs can cause withdrawal from a
    free-charger program.
