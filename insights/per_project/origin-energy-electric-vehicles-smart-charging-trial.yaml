- record_id: ARENA-DLV-47602
  source_title: Origin Energy Smart Charging Trial - Final report
  publish_date: '2023-08-28'
  project_name: Origin Energy Smart Charging Trial
  what_happened: Trial participants were predominantly early adopters who were already
    actively optimising their charging behaviour to maximise solar self-consumption
    and exploit time-of-use tariffs, meaning the baseline charging profile showed
    less peak demand than would be expected in a mass-market scenario.
  lesson_learnt: When designing EV smart charging trials, avoid recruiting exclusively
    from early-adopter cohorts — their pre-optimised baseline reduces the measurable
    value of smart charging and underestimates peak demand impacts relative to mass-market
    scenarios. Use CSIRO or equivalent convenience charging profiles as the counterfactual
    baseline to produce commercially representative value estimates.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: poor scoping
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Origin replaced the trial baseline with CSIRO's Convenience charging
    profile to estimate value under mass-uptake conditions, producing a value of $170
    p.a. compared to $76 p.a. against the trial baseline.
  transferability: broad
  delay_magnitude: null
  technology_domain: EV
  source_pages:
  - 7
  - 8
  - 27
  evidence_excerpt: The Trial participants were from the early adopter cohort and
    were highly engaged in managing their energy and charging consumptions. The Baseline
    charging profile already reflected a level of optimisation by Trial participants
    with large proportion of the charging already done during the midday period to
    maximise solar consumption and overnight period to take advantage of existing
    time of use tariffs. Therefore the difference wholesale energy cost and TOU network
    costs of the Baseline charging profile and the profiles under Experiments 1 and
    2 were less what would be expected under charging profiles where more of the charging
    would be undertaken during the peak period (mass market uptake).
