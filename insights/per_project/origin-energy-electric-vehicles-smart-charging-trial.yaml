  what_happened: Providing an override/opt-out function in the Origin mobile app was
    valued by participants during Experiment 2, giving them control when immediate
    charging was needed, and this feature contributed to the high acceptance rate
    of automated curtailment.
  lesson_learnt: Automated smart charging curtailment programs must include a simple,
    accessible opt-out mechanism — customer choice and perceived control are critical
    to acceptance of managed charging, and offering override capability increases
    overall programme enrolment and retention without materially reducing grid benefits
    given the very low observed opt-out rate (~2%).
