  project_name: Origin Energy Smart Charging Trial
  what_happened: One participant with a PHEV opted out of smart charging curtailment
    108 times because their vehicle-native charging scheduler conflicted with the
    trial's curtailment window — the vehicle's BMS would not resume smart charging
    if the vehicle schedule was enabled, forcing the driver to manually opt out repeatedly.
  lesson_learnt: Vehicle BMS scheduling features in certain EV models can override
    or prevent third-party smart charging commands — compatibility testing with specific
    vehicle makes and models should be completed before enrolling those vehicles in
    smart charging programs, and participants should be advised to disable vehicle
    schedulers.
