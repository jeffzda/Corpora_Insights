  what_happened: Fleet business participants had a significantly longer decision-making
    process than residential participants due to the need for approvals across multiple
    stakeholders (sustainability managers, facilities managers, procurement), and
    only 10 of 30 business customers opted into smart charging, citing concern that
    curtailment events could affect fleet operational requirements.
  lesson_learnt: For fleet EV smart charging programs, multi-stakeholder approval
    processes significantly slow enrolment and smart charging uptake — identify and
    engage the operational decision-maker (not just sustainability leads) early, and
    design fleet smart charging schedules that are explicitly linked to fleet booking
    systems to address operational availability concerns.
