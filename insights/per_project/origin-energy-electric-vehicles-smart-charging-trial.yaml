- record_id: ARENA-DLV-15701
  source_title: Origin Energy Electric Vehicles Smart Charging Trial Lessons Learnt
    2
  publish_date: 2022-05
  project_name: Origin EV Smart Charging Trial
  what_happened: COVID-19 lockdowns across multiple states disrupted charger installation
    schedules and charging behaviour throughout the trial. Commercial installations
    proved significantly more complex than residential ones, requiring navigation
    of site load management concerns, infrastructure upgrade decisions, and multi-stakeholder
    corporate approval processes, all of which extended lead times.
  lesson_learnt: Plan for substantially longer lead times for commercial EV charger
    installations compared to residential — corporate sign-off processes, load management
    assessments, and infrastructure upgrade decisions involve multiple stakeholders
    and are further compounded by external disruptions such as COVID-19 lockdowns.
