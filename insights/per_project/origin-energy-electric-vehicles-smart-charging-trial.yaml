- record_id: ARENA-DLV-15706
  source_title: Origin Energy Electric Vehicles Smart Charging Trial Lessons Learnt
    2
  publish_date: 2022-05
  project_name: Origin EV Smart Charging Trial
  what_happened: All six network demand response peak events identified under a paper
    arrangement with Powercor/Citipower/United Energy (occurring between November
    2021 and February 2022, 4pm–8pm) fell entirely within the window already being
    managed by Origin's smart charging curtailment programme, requiring no additional
    customer communication or intervention.
  lesson_learnt: Well-designed smart charging curtailment windows can passively satisfy
    network peak event requirements without additional customer engagement — however,
    the paper-based coordination mechanism used here will not scale; formalised interoperability
    standards between networks, aggregators, and retailers should be developed before
    commercial rollout.
