  source_title: Origin Energy Smart Charging Trial - Final report
  publish_date: '2023-08-28'
  project_name: Origin Energy Smart Charging Trial
  what_happened: Convincing customers to choose a smart charger over a basic charger,
    enrol in a smart charging incentive program, and then participate in specific
    curtailment events represents a three-step conversion challenge — in the trial,
    participants had to be offered a free charger to participate in the first place,
    raising questions about commercial uptake without subsidies.
  lesson_learnt: Commercial smart charging programs face a three-stage adoption barrier
    (smart charger purchase → program enrolment → curtailment participation) that
    subsidies can temporarily bridge but not permanently solve — product design should
    collapse these steps by bundling smart chargers with energy plans and making smart
    charging the default opt-out rather than opt-in.
