  project_name: Origin Energy Smart Charging Trial
  what_happened: Ausgrid's modelling found that coincident responses to smart charging
    price signals could create a secondary local peak demand after the traditional
    evening peak period, partially offsetting the network benefit of curtailing the
    primary peak.
  lesson_learnt: Smart charging tariff and curtailment designs must account for coincident
    load rebound — when large numbers of EVs respond simultaneously to the same price
    signal, a new secondary peak can form immediately after the curtailment window.
    Staggered scheduling, randomised delay, or locational price differentiation should
    be considered in scaled deployments.
