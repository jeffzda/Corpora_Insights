- record_id: ARENA-DLV-15702
  source_title: Origin Energy Electric Vehicles Smart Charging Trial Lessons Learnt
    2
  publish_date: 2022-05
  project_name: Origin EV Smart Charging Trial
  what_happened: In Experiment 1, a variable monetary incentive of 10c/kWh for charging
    during off-peak windows (10am–3pm and 9pm–5am) successfully shifted participant
    charging behaviour — off-peak charging increased from 70% to 90% of sessions,
    with peak-period charging falling from 30% to 10% of total charging.
  lesson_learnt: Financial incentives are highly effective at shifting engaged EV
    trial participants away from peak charging periods; a 10c/kWh reward reduced peak
    charging by 20 percentage points. However, the effectiveness for less-engaged,
    mass-market EV adopters should be re-evaluated before assuming the same response
    at scale.
