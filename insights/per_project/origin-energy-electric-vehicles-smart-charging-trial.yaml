  project_name: Origin Energy Smart Charging Trial
  what_happened: Increased wholesale energy market volatility during Experiments 1
    and 2 elevated prices during midday and overnight charging periods beyond what
    was expected, reducing the calculated wholesale energy savings from shifting charging
    out of the evening peak.
  lesson_learnt: Smart charging value calculations are sensitive to wholesale market
    volatility — value estimates based on stable price periods will overstate savings
    during volatile market conditions. Business cases should include scenario analysis
    across market volatility assumptions, and long-term smart charging products should
    use network tariff savings as a more stable value anchor.
