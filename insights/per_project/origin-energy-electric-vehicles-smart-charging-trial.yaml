  source_title: Origin Energy Smart Charging Trial - Final report
  publish_date: '2023-08-28'
  project_name: Origin Energy Smart Charging Trial
  what_happened: The smart charging ecosystem involved multiple communication standards
    and protocols between chargers, networks, and vehicles, with state- and network-level
    variation in requirements and vague metering requirements, making it complex and
    costly to maintain a commercialised multi-party model.
  lesson_learnt: Industry-wide standardisation of smart charging communication protocols
    (analogous to the IoT Matter standard) is a prerequisite for cost-effective scaled
    deployment — proponents building commercial smart charging programs should advocate
    for and adopt open interoperability standards (e.g. OCPP) and engage with regulators
    early on metering requirements to avoid costly bespoke integrations.
