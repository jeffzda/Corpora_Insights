  project_name: Origin EV Smart Charging Trial
  what_happened: Residential trial participants exhibited three distinct personas
    (Tinkerer, Evangelist, Gets me from A to B) with significantly different engagement
    levels, energy literacy, and requirements for smart charging interfaces, confirming
    there is no single viable product design for all EV customer segments.
  lesson_learnt: Commercial EV smart charging propositions must be segmented by customer
    persona; the 'Gets me from A to B' mass-market segment requires minimal configuration,
    automated optimisation, and no reliance on app engagement, while 'Tinkerer' segments
    require granular control — a single interface design will fail to serve both.
