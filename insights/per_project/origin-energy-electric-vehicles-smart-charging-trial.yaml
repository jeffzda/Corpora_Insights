  what_happened: After Experiment 1 incentives ended, participants continued to charge
    predominantly during the previously incentivised off-peak periods, suggesting
    that charging behaviour had become habitual. Origin did not test how long these
    habits would persist in the absence of incentives.
  lesson_learnt: Monetary incentives can create durable behavioural change in EV charging
    patterns beyond the incentive period itself — future programmes should test the
    longevity of habit formation and consider whether a short incentive phase could
    replace ongoing subsidy.
