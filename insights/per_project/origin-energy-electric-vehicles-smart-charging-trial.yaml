  source_title: Origin EV Smart Charging Trial Interim Report
  publish_date: 2021-06
  project_name: Origin EV Smart Charging Trial
  what_happened: The EV smart charging technology ecosystem became fragmented at scale
    — controlling a small group of chargers was straightforward, but scaling introduced
    significant cost and complexity due to varying data formats, collection frequencies,
    and platform requirements across stakeholders.
  lesson_learnt: EV smart charging programmes targeting aggregation at scale should
    advocate for standardised data collection and communication protocols across the
    ecosystem before deploying at volume; the per-unit cost and complexity of custom
    integrations rises non-linearly with charger numbers and stakeholder diversity.
