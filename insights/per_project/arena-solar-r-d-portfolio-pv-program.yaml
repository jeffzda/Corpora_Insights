- record_id: ARENA-DLV-40359
  source_title: 'In The Spotlight: Australian Solar Energy R&D Outcomes and Achievements
    in a Global Context'
  publish_date: 2018-07
  project_name: ARENA Solar R&D Portfolio (PV Program)
  what_happened: Australia produced world-leading PV specialists through its research
    programs, but without local manufacturing or deployment industry opportunities,
    the majority of these experts went overseas for industrial employment, taking
    their expertise and industry relationships with them.
  lesson_learnt: Investment in research talent must be paired with domestic industry
    development opportunities to retain skilled researchers in Australia — without
    local employment pathways in manufacturing or deployment, training world-class
    PV specialists effectively subsidises international industry rather than building
    durable national capability.
