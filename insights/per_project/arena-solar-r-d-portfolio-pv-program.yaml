- record_id: ARENA-DLV-40361
  source_title: 'In The Spotlight: Australian Solar Energy R&D Outcomes and Achievements
    in a Global Context'
  publish_date: 2018-07
  project_name: ARENA Solar R&D Portfolio (PV Program)
  what_happened: Australia had not developed standardised procedures for commercial-scale
    PV systems by the time of this report, keeping soft costs (permitting and approvals)
    high and the large-scale PV market proportionally smaller than equivalent overseas
    markets, despite having developed standardised connection agreements for small
    systems a decade earlier.
  lesson_learnt: Regulatory standardisation for commercial-scale PV connection and
    approval processes is a necessary complement to technology cost reductions — the
    absence of standardised procedures for commercial-scale systems keeps soft costs
    disproportionately high and constrains deployment even when module costs are internationally
    competitive.
  issue_severity: moderate
  project_type: generation
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: approvals/contracting
  proponent_type: research organisation/university
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: policy/market influence only
  secondary_failure_mode: null
  intervention_note: Recent auctions by ARENA and State Governments achieved prices
    below AUD 0.06/kWh, indicating that deployment experience is being developed and
    finance risk factors can be reduced with government guarantees.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id003
  - 83
  evidence_excerpt: Australia has yet to develop standardised procedures for commercial-scale
    systems and, though growing, these remain a significantly lower proportion of
    overall systems than in equivalent sized PV markets worldwide... higher costs
    of capital and immature deployment procedures playing a major role.
