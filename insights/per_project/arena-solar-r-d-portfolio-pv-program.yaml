- record_id: ARENA-DLV-40360
  source_title: 'In The Spotlight: Australian Solar Energy R&D Outcomes and Achievements
    in a Global Context'
  publish_date: 2018-07
  project_name: ARENA Solar R&D Portfolio (PV Program)
  what_happened: Prolonged political uncertainty around the Renewable Energy Target
    (RET) after 2013 caused the large-scale PV market to stall, with many businesses
    failing and investors pulling out, despite continuing price decreases in solar
    PV.
  lesson_learnt: Long-term policy stability is a critical enabler of renewable energy
    investment independent of technology cost — even when PV costs are falling rapidly,
    policy uncertainty can override commercial signals and cause market stagnation;
    R&D program designers should account for policy risk as a primary deployment barrier
    when planning commercialisation pathways.
  issue_severity: major
  project_type: generation
