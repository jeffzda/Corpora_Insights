- record_id: ARENA-DLV-40371
  source_title: 'In The Spotlight: Australian Solar Energy R&D Outcomes and Achievements
    in a Global Context'
  publish_date: 2018-07
  project_name: ARENA Solar R&D Portfolio (PV Program)
  what_happened: Australia's UNSW-developed PERC cell was projected to be used in
    over 60% of commercial solar cells globally by the time of the report, representing
    a direct translation of Australian fundamental PV research (developed with sustained
    ASI/ARENA funding) into dominance of the global commercial market within approximately
    a decade of the key research breakthroughs.
  lesson_learnt: Sustained Australian investment in fundamental silicon PV research
    at UNSW and ANU, focused on commercially relevant mainstream technologies rather
    than niche applications, enabled Australian technology to dominate the global
    commercial PV market — programs targeting PV innovation should maintain focus
    on improvements to dominant market technologies where Australian researchers hold
    a competitive advantage, as this maximises global impact and consumer benefit.
  issue_severity: none
  project_type: generation
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: close-out/post-project review
  proponent_type: research organisation/university
