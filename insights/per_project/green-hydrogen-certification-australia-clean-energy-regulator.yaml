- record_id: ARENA-DLV-69016
  source_title: ARENA Insights Forum Session Summaries and Key Points
  publish_date: 2022-11
  project_name: Green hydrogen certification (Australia — Clean Energy Regulator)
  what_happened: The Clean Energy Regulator was developing an Australian Guarantee
    of Origin scheme for green hydrogen, targeting legislation by end of 2023 and
    certificate issuance by early 2024. Complex issues emerged including treatment
    of upstream emissions and risk of gaming, and the scheme needed to be consistent
    with multiple international standards to enable trade.
  lesson_learnt: Green hydrogen project proponents should engage with the emerging
    Australian Guarantee of Origin scheme early — the scheme's integrity requirements
    (upstream emissions accounting, anti-gaming provisions) and international consistency
    requirements will affect project design, monitoring systems, and commercial terms,
    and late engagement risks stranded compliance costs.
