- record_id: ARENA-DLV-63851
  source_title: Review of Connection Feasibility on the UQ Gatton 3.3MW Photovoltaic
    Array
  publish_date: null
  project_name: UQ Gatton 3.3 MW Photovoltaic Array
  what_happened: Energex (the NSP) expressed concerns about connecting the proposed
    3.3 MW PV array at 11 kV and preferred a 33 kV connection, which would have cost
    significantly more due to transformer and ancillary infrastructure requirements.
    UQ commissioned a feasibility study that demonstrated the 11 kV connection would
    have small and manageable network impacts, making it technically viable and substantially
    cheaper.
  lesson_learnt: When a network service provider raises concerns about a preferred
    connection voltage, commission a targeted technical feasibility study covering
    transient voltage regulation, steady-state voltage, power factor, harmonics, and
    flicker — this can demonstrate that the lower-cost connection option is viable
    and avoid the significant additional cost of a higher-voltage connection.
  issue_severity: moderate
  project_type: generation
  project_scale_band: pilot
  lifecycle_phase: approvals/contracting
  proponent_type: research organisation/university
  delay_category: grid connection/system studies
  failure_mode: regulatory & approvals
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: UQ commissioned an independent connection feasibility study covering
    multiple network impact scenarios, which demonstrated that the 11 kV connection
    was technically acceptable and could be further improved by inclusion of battery
    storage units.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id001
  - 1
  evidence_excerpt: A connection feasibility study demonstrated that connection of
    the proposed 3.3 MW Gatton photovoltaic (PV) array at 11 kV will not have significant
    technical impacts to the network, and will be significantly cheaper than connection
    at 33 kV.
  confidence_note: issue_severity rated moderate — no schedule delay was quantified
    but the NSP preference for 33 kV would have imposed significant cost variance;
    resolved through feasibility study before design was frozen.
