- record_id: ARENA-DLV-63852
  source_title: Review of Connection Feasibility on the UQ Gatton 3.3MW Photovoltaic
    Array
  publish_date: null
  project_name: UQ Gatton 3.3 MW Photovoltaic Array
  what_happened: The feasibility study identified that battery storage units, included
    as part of the broader EIF Gatton project, could provide additional network performance
    improvements beyond the PV array alone, supporting the case for 11 kV connection.
  lesson_learnt: For medium-scale solar PV projects connecting to distribution networks,
    co-located battery storage can materially strengthen the technical case for a
    lower-cost connection point by improving network performance metrics — factor
    this into connection feasibility studies from the outset.
