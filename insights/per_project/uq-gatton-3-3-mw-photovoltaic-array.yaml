  publish_date: null
  project_name: UQ Gatton 3.3 MW Photovoltaic Array
  what_happened: The Gatton project established a collaboration between UQ and Energex
    to study distribution network impacts from medium-scale solar PV systems, positioned
    as a model for future medium-scale projects connecting into the distribution network.
  lesson_learnt: Proactively structuring a research collaboration with the network
    service provider during a connection feasibility process can convert an adversarial
    NSP concern into an ongoing knowledge-sharing arrangement, generating learning
    applicable to future medium-scale solar PV grid connections.
