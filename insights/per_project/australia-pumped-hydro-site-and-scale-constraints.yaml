- record_id: ARENA-DLV-16276
  source_title: Energy Storage Study
  publish_date: 2015-07
  project_name: Australia — Pumped Hydro Site and Scale Constraints
  what_happened: No large-scale pumped hydro facilities had been built in Australia
    within the last 30 years as of 2015. PHS deployment was severely constrained by
    geographic and environmental site requirements, long development timelines (>6
    years), lengthy approvals processes, and the need for very large scale (100+ MW)
    to achieve cost efficiency.
  lesson_learnt: Pumped hydro development in Australia faces structural site scarcity
    and multi-year approvals processes that make it unsuitable as a near-term storage
    solution; ARENA investment in PHS is unlikely to yield meaningful technology or
    commercial progress and should instead focus on emerging storage technologies
    with more accessible deployment pathways.
