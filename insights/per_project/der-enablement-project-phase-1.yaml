- record_id: ARENA-DLV-9123
  source_title: State of DER Technology Integration Report
  publish_date: 2021-02
  project_name: DER Enablement Project (Phase 1)
  what_happened: The Renew DER Enablement Project Phase 1 found that voltage adjustment at the LV transformer level is likely to be the most cost-effective first step for addressing voltage rise and increasing
    hosting capacity in typical networks. However, the project also concluded that much more detailed bottom-up modelling is required before conclusions are robust enough to guide detailed DER enablement
    proposals.
  lesson_learnt: LV transformer tap adjustment is a strong first-step candidate for cost-effective voltage management in high-DER networks, but planners should commission detailed network-specific modelling
    before committing to remediation strategies — high-level studies cannot reliably determine the cost-benefit balance for specific networks or quantify the interaction effects between solutions.
