- record_id: ARENA-DLV-20731
  source_title: Demand Response Short Notice RERT Trial Year 3 Report
  publish_date: 2021-10
  project_name: DR SN RERT Trial — small commercial sector BDR potential
  what_happened: Multiple trial participants initiated BDR programs for small business
    customers during the trial, including EnergyAustralia's Business PowerResponse
    (102 customers in the December 2020 test) and Powershop's CYP small business extension;
    early results were positive but measurement issues similar to those encountered
    in the residential sector were identified as needing resolution.
  lesson_learnt: The small commercial sector is an underexplored but viable DR participant
    class; BDR program designs developed for residential customers can be adapted
    for small business customers and may achieve positive early results, but baseline
    measurement issues (particularly for variable-schedule small businesses) must
    be resolved before this segment can be reliably included in contracted DR portfolios.
