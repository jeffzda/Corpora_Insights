  evidence_excerpt: The trial has sparked interest in the DR capabilities of the small
    commercial sector. As noted, several of the participants have initiated DR programs
    for small commercial customers — a sector that has only very rarely been included
    in DR program design and implementation efforts. These efforts are in their early
    days and have primarily involved BDR designs, which, as noted above, have posed
    some material measurement issues in the residential sector that will need to be
    investigated further in this sector as well.
