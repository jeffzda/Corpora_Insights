- record_id: ARENA-DLV-53856
  source_title: Demand Flexibility Portfolio Retrospective Analysis Report
  publish_date: 2023-07
  project_name: ActewAGL REVS / AGL EV Orchestration Trial
  what_happened: 'The AS/NZS 4777 inverter standard proved a major impediment to bidirectional
    EV charging: it classified V2G chargers as stationary battery inverters requiring
    an earthing point that EVs do not have, necessitating charger hardware modifications
    that then failed electromagnetic compatibility (EMC) tests, adding cost, complexity,
    delay, and aesthetic issues. AGL ultimately abandoned the V2G component.'
  lesson_learnt: The AS/NZS 4777 standard is not fit for purpose for bidirectional
    EV chargers; regulators and project developers should prioritise reform of this
    standard — or adopt an equivalent of the UK's G99 approach — before V2G projects
    are structured around FCAS or export revenue streams, otherwise compliance efforts
    will consume project budgets and timelines.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: approvals/contracting
  proponent_type: utility/energy retailer
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Analysis by ANU's Battery Storage and Grid Integration Program
    recommended extension of AS4777.2:2020 to directly apply to bidirectional chargers;
    ActewAGL pursued V2G despite challenges while AGL terminated that component.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: EV
  source_pages: &id002
  - 23
  - 47
  evidence_excerpt: The technical standard classes bidirectional EV chargers as a
    multiple model inverter as if it was connected to a stationary battery energy
    storage system. The standard requires that a battery is connected to an earthing
    point but with EVs, there is no need for one… Modifications to rectify the situation
    led to further issues with high frequency noise which meant it failed the Electromagnetic
    Compatibility (EMC) test.
  confidence_note: 'project_type reconciled to ''DER/customer-side'' from: DER/customer-side
    (36/49), transport electrification (12/49), industrial decarbonisation (1/49)'
