- record_id: ARENA-DLV-53855
  source_title: Demand Flexibility Portfolio Retrospective Analysis Report
  publish_date: 2023-07
  project_name: ActewAGL REVS / AGL EV Orchestration Trial
  what_happened: FCAS revenue was not generated in either the AGL or ActewAGL EV trials
    because of supply chain delays and certification/standards issues with bidirectional
    chargers, leading to delayed response times or insufficient aggregated volume
    to qualify for FCAS.
  lesson_learnt: EV projects targeting FCAS revenue streams should not assume bidirectional
    charger supply and certification timelines at the outset; supply chain and standards
    compliance pathways for V2G chargers should be fully mapped and contingency-planned
    before FCAS participation is included in business cases.
