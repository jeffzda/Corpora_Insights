- record_id: ARENA-DLV-70802
  source_title: Grid Forming Battery Webinar 23 July 2025
  publish_date: 2025-07
  project_name: Hornsdale Power Reserve Expansion (HPRX) / Wallgrove Grid Battery
    (WGB)
  what_happened: HPRX and WGB both elected to connect first in grid-following (GFL)
    mode and then undergo a NER cl 5.3.9 process to switch to GFM operation, in order
    to mitigate commercial impact from the expected longer GFM commissioning process.
    However, the 'no less onerous' requirement under the NER at the time meant the
    new GFM performance standards had to be at least as stringent as the GFL standards,
    creating additional challenges with NER cl S5.2.5.5.
  lesson_learnt: Connecting first in GFL mode to protect commercial operations while
    planning a subsequent GFM upgrade is a viable risk-mitigation strategy, but the
    'no less onerous' NER requirement for the 5.3.9 process previously created regulatory
    friction — this constraint has since been removed by rule change, making direct
    GFM connection less risky for newer projects.
