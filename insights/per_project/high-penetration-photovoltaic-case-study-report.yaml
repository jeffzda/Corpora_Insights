- record_id: ARENA-DLV-72255
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects - First Edition Results'
  publish_date: '2015'
  project_name: High Penetration Photovoltaic Case Study Report
  what_happened: NREL analysis of four US utility-scale solar PV projects (1.2–10MW) found that pre-installation impact studies enabled all four projects to be integrated without operational problems, with
    planned mitigation measures (reclosers, capacitor bank settings, inverter reactive power control) proving sufficient so that no emergency interventions were required post-commissioning.
  lesson_learnt: Thorough pre-installation network impact studies for utility-scale PV — including modelling voltage, power quality, and protection — allow targeted, low-cost mitigation measures to be designed
    upfront, avoiding post-commissioning operational problems; projects should not defer impact studies until after connection application.
