  evidence_excerpt: The projects required different technical solutions ranging from adding re-closers; controlling a small island system; modifying capacitor bank controller settings; planning a range
    of mitigation measures (voltage regulators, configure inverters, install an additional power factor controller) if high voltages became a problem. In the event the results of the studies were successful
    in that the PV was incorporated with no problems.
