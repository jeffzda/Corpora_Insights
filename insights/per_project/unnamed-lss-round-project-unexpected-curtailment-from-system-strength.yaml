- record_id: ARENA-DLV-15463
  source_title: 'The Generator Operations Series: Large-Scale Solar Operations'
  publish_date: 2021-05
  project_name: Unnamed LSS Round Project (unexpected curtailment from system strength)
  what_happened: One LSS Round Project experienced unexpected and ongoing curtailment
    due to AEMO applying constraints related to poor system strength in a neighbouring
    region, with the sponsor expecting the curtailment to continue without a clear
    mitigation pathway.
  lesson_learnt: System strength issues in adjacent network regions can impose curtailment
    on solar projects with no direct contribution to the problem and no available
    self-help remedies — project risk assessments and revenue forecasts should explicitly
    include scenarios where regional system strength constraints result in prolonged
    involuntary curtailment.
