  source_title: Insights From The Portfolio of Projects Funded Under The Regional
    Australia's Renewables Program
  publish_date: 2017-03
  project_name: Karratha Airport Solar PV and Battery Project
  what_happened: The Karratha Airport fringe-of-grid project required the inclusion
    of cloud predictive forecasting technology and ramp rate control as explicit requirements
    imposed by the network operator, driving a more complex multi-technology system
    than a simple solar-plus-battery installation.
  lesson_learnt: For fringe-of-grid solar projects, network operator technical requirements
    — including ramp rate control and generation forecasting — should be confirmed
    before design finalisation, as these requirements can mandate additional technologies
    that materially increase system complexity and cost.
