  project_name: Darlington Point Energy Storage System (DPESS)
  what_happened: Inverter supplier selection for DPESS was made early in the development
    process because grid-forming controls and associated power system models needed
    to be available before connection studies could commence — at the time, only three
    suppliers were considered sufficiently advanced to be viable.
  lesson_learnt: For grid-connected BESS projects using grid-forming inverters, make
    inverter supplier selection earlier than for conventional projects — the availability
    of mature grid-forming controls and validated power system models is a prerequisite
    for commencing connection studies, and selecting an inadequately advanced supplier
    creates a critical path risk to the connection timeline.
