- record_id: ARENA-DLV-25702
  source_title: Edify Energy - Darlington Point Energy Storage System - Lessons Learnt
    Report
  publish_date: '2024-04-04'
  project_name: Darlington Point Energy Storage System
  what_happened: Because precedent GPS clauses for grid forming inverters did not
    exist at the time of DPESS's connection application, NSP and AEMO personnel required
    additional due diligence time to become familiar with the grid forming inverter
    models and their tunable parameters, extending the connection process.
  lesson_learnt: The overall connection timeline for grid forming BESS is similar
    to grid following BESS, but the primary schedule risk is the additional due diligence
    time required for NSPs and AEMO to gain familiarity with new inverter models —
    proponents should budget for this and engage early to share model documentation
    ahead of formal submission.
  issue_severity: minor
  project_type: storage
  project_scale_band: first commercial/FOAK
