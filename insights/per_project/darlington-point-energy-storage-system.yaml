- record_id: ARENA-DLV-34717
  source_title: 'Edify - Darlington Point Energy Storage System - Flagship Report:
    System Strength Remediation'
  publish_date: '2025-12-02'
  project_name: Darlington Point Energy Storage System (DPESS)
  what_happened: DPESS demonstrated that a 150MW grid forming BESS (RES combined)
    provided equivalent network stabilisation to a 150MVA synchronous condenser under
    a network fault at zero pre-fault export, including maintaining stable solar farm
    operation under very low system strength conditions (SCR ~1.27), whereas a 125MVA
    syncon was insufficient to prevent instability.
  lesson_learnt: BESS projects with grid-forming inverters can competitively displace
    synchronous condensers and STATCOMs for network stability services — proponents
    should proactively engage TNSPs on non-network alternative frameworks (such as
    the RIT-T process) to capture the commercial value of grid-forming capabilities
    through Network Support Agreements alongside energy market revenues.
