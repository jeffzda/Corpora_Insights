- record_id: ARENA-DLV-16505
  source_title: Edify - Darlington Point Energy Storage System - Operations Report
    4
  publish_date: '2026-01-05'
  project_name: Darlington Point Energy Storage System
  what_happened: Planned network outages requested by Transgrid in April (8–16 April)
    and September (16–26 September) 2025 significantly reduced the BESS capacity factor
    in those months, with April recording only 3.7% discharge capacity factor versus
    a Year 2 benchmark of approximately 7.5%.
  lesson_learnt: Network outages requested by the NSP can significantly depress BESS
    revenue and availability metrics; financial models and availability KPI regimes
    should explicitly account for planned outage periods driven by network operator
    requirements, and BSSA or offtake agreements should define how these periods are
    treated for performance measurement purposes.
  issue_severity: moderate
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: project developer
  delay_category: no material delay stated
