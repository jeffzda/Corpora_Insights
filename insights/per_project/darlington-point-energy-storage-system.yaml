- record_id: ARENA-DLV-65201
  source_title: Darlington Point Energy Storage System Lessons Learnt Report 1
  publish_date: '2023-03-20'
  project_name: Darlington Point Energy Storage System
  what_happened: DPESS was one of the first projects to progress through the grid
    connection application process using inverters in grid-forming mode. The existing
    Generator Performance Standard (GPS) templates — adapted from grid-following inverter
    templates, which were themselves adapted from thermal generator templates — were
    poorly suited to assessing grid-forming inverter-based generators, causing friction
    in the connection application process.
  lesson_learnt: GPS template limits derived from thermal generator norms can prevent
    technically superior grid-forming inverter configurations from being accepted.
    Proponents should present modelling evidence of superior network outcomes and
    actively seek flexibility from network engineers at AEMO and the NSP to approve
    settings outside inherited template norms.
  issue_severity: moderate
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: grid connection/system studies
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Edify demonstrated to Transgrid and AEMO that the non-compliant
    settling times for shallow faults had immaterial network impact, and agreement
    was reached on an alternative GPS specification and assessment framework that
    preserved grid forming performance.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages:
