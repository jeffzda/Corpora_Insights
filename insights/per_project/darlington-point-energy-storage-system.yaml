  source_title: Edify - Darlington Point Energy Storage System - Operations Report
    4
  publish_date: '2026-01-05'
  project_name: Darlington Point Energy Storage System
  what_happened: With FCAS market value declining over the reporting period, EnergyAustralia
    as operator shifted the BESS dispatch strategy toward energy arbitrage, increasing
    state-of-charge during low-price midday periods and discharging during morning
    and evening peaks, resulting in decreased FCAS enablement alongside higher energy
    arbitrage margins.
  lesson_learnt: BESS operational strategy must be dynamic — as FCAS market value
    declines relative to energy arbitrage spreads, operators should be structured
    to shift dispatch strategy accordingly. Long-term Battery Storage Services Agreements
    should grant the offtaker sufficient operational flexibility to optimise across
    both revenue streams rather than locking in a fixed dispatch profile.
