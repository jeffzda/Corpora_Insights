  publish_date: '2023-03-20'
  project_name: Darlington Point Energy Storage System
  what_happened: During the connection application due diligence process, discussions
    risked going off-track because reviewers lacked a shared baseline understanding
    of how grid-forming inverter performance differs from grid-following inverter
    performance. Edify Energy held a briefing at the start of the process to establish
    this baseline and consistently referenced it throughout subsequent conversations.
  lesson_learnt: For novel inverter technologies, hold a structured briefing with
    the NSP and AEMO at the start of the connection application process to establish
    a shared understanding of grid-forming versus grid-following performance differences
    — this prevents scope creep and tangential discussions during technical review.
