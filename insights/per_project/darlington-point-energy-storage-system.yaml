  what_happened: Operational data from three real network events in 2025 confirmed
    that DPESS provided near-instantaneous reactive power responses (no discernible
    delay at 10ms data intervals), phase-independent voltage responses, and synthetic
    inertia consistent with model predictions — validating that the grid forming commissioning
    process and PSCAD model benchmarking were reliable.
  lesson_learnt: Real network event data is the most reliable method for validating
    grid forming inverter performance post-commissioning — operators should ensure
    high-speed data recording systems are in place from first energisation and should
    proactively share event recordings with AEMO to build industry-wide confidence
    in the technology.
