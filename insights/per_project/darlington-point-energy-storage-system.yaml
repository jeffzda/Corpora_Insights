  what_happened: DPESS was initially registered in early 2023 as both a Scheduled
    Generator and Scheduled Load (two NMIs), the prevailing arrangement for BESS at
    the time. AEMO subsequently created a new bidirectional unit (BDU) classification
    and required all pre-June 2024 grid-scale BESSs to transition by March 2025, which
    DPESS completed successfully and seamlessly.
  lesson_learnt: New BESS projects should register under the BDU classification from
    the outset rather than legacy dual-registration — the BDU framework (single dispatch
    unit, single NMI, 20 price bands) is now the standard and the transition, while
    manageable, adds administrative overhead that can be avoided by registering correctly
    initially.
