  publish_date: '2025-10-30'
  project_name: Darlington Point Energy Storage System (DPESS)
  what_happened: A pre-construction condition of the development approval required
    endorsement of a fire safety study by the NSW Department of Planning and Environment
    (DPE), which referred it to Fire Rescue NSW. As DPESS was the first large-scale
    BESS that Fire Rescue NSW had been consulted on, the approval of the fire safety
    study took longer than expected, threatening the construction commencement schedule.
  lesson_learnt: Engage fire safety authorities (such as Fire Rescue NSW) early in
    the approvals process for large-scale BESS projects — as a novel technology class,
    fire safety review can take significantly longer than expected, and early engagement
    reduces the risk of pre-construction condition delays holding up site mobilisation.
  issue_severity: moderate
