  what_happened: DPESS adopted a turnkey EPC contract model with Tesla as principal
    contractor, but during execution found that the interface between the BESS and
    balance of plant was far simpler and cleaner than anticipated, leading Edify to
    conclude that a split contract model would be preferable for future projects.
