- record_id: ARENA-DLV-66061
  source_title: 'Edify Energy - Darlington Point Energy Storage System - Operations
    Report #1'
  publish_date: 2024-09
  project_name: Darlington Point Energy Storage System
  what_happened: DPESS was offline for unrelated operational reasons at the time of
    the 13 February 2024 major network disturbance, meaning the system strength response
    during a critical real-world event could only be assessed indirectly via the co-located
    RESS2 facility rather than DPESS itself.
  lesson_learnt: BESS availability during high-impact network events is critical for
    both commercial performance and demonstration objectives — operational availability
    protocols should prioritise minimising planned or unplanned outages during periods
    of elevated system stress, and co-located sister facilities with identical settings
    can serve as valuable proxy evidence when the primary asset is offline.
  issue_severity: minor
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: project developer
  delay_category: null
  failure_mode: execution & logistics
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The response of the co-located RESS2 facility, which has identical
    grid-forming inverter settings, was used as a proxy to assess DPESS's expected
    performance during the event.
  transferability: moderate
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id047
