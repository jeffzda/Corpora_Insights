- record_id: ARENA-DLV-34704
  source_title: 'Edify - Darlington Point Energy Storage System - Flagship Report:
    System Strength Remediation'
  publish_date: '2025-12-02'
  project_name: Darlington Point Energy Storage System (DPESS)
  what_happened: Standard NEM commissioning hold point tests, which are based on setpoint
    changes at the Power Plant Controller level, were found to be ineffective at testing
    grid forming inverter capabilities because grid forming controls operate at the
    inverter terminal level and respond to actual voltage rather than PPC setpoint
    changes.
  lesson_learnt: Conventional NEM commissioning test programs cannot validate grid
    forming inverter capabilities — project teams should supplement standard hold
    point tests with Hardware-in-the-Loop (HIL) testing and plan to validate grid
    forming performance through real network event data rather than relying solely
    on the standard commissioning program.
  issue_severity: moderate
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: commissioning/integration
  proponent_type: project developer
  delay_category: commissioning/integration
  failure_mode: unvalidated integration
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: The project team accepted the limitation as necessary and instead
    validated grid forming performance by reviewing responses to actual network events
    post-commissioning; HIL testing was recommended for future projects.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id027
  - 34
  evidence_excerpt: As the tests are only changing the setpoints in the PPC and not
    the actual voltage at the inverter terminals the majority of the tests will not
    effectively test the grid forming capabilities... The most valuable testing of
    grid forming inverters is therefore undertaken by reviewing responses to actual
    network events.
  confidence_note: Issue severity rated moderate because the limitation affected the
    completeness of commissioning validation, though it did not prevent commercial
    operation.
