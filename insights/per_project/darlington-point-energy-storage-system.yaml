  publish_date: '2024-04-04'
  project_name: Darlington Point Energy Storage System
  what_happened: DPESS was among the first BESS projects to negotiate Generator Performance
    Standards (GPS) for grid forming inverters with Transgrid and AEMO. Because no
    agreed GPS clauses existed for grid forming inverter performance, it took several
    months to reach agreement on the wording of clause 5.2.5.5, as grid forming inverter
    fault response characteristics do not align with existing asynchronous machine
    performance standards.
  lesson_learnt: When connecting grid-forming inverters for the first time in a jurisdiction,
    engage early and collaboratively with the TNSP and AEMO on GPS negotiation — the
    novel tuning requirements and decision-making process can become a schedule risk,
    but can be resolved by agreeing a 'best for network' assessment approach rather
    than strict automatic access standard compliance.
