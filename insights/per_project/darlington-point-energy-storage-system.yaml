    and unexpected increase in BESS supply price due to a spike in battery-grade lithium
    carbonate prices from under 150,000 Chinese yuan to more than 400,000 Chinese
    yuan in late 2022 and early 2023.
  lesson_learnt: Lock in BESS supply pricing or include robust commodity price adjustment
    mechanisms before contract execution — lithium carbonate price volatility can
    cause material late-stage cost increases, and managing this risk through price
    hedging, indexation clauses, or earlier contract execution should be a key consideration
    for future projects.
