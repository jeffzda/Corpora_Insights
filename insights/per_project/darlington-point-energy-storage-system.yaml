  project_name: Darlington Point Energy Storage System
  what_happened: Availability during the first six months of commercial operation
    averaged 93.3%, which was below expectations. December 2024 recorded the lowest
    availability at 80.1%. Early teething issues with communications between site
    devices were identified as the cause.
  lesson_learnt: Budget for and expect a teething-issues period in the first six months
    of BESS commercial operations; resolution of initial technical issues in early
    operations can be expected to substantially improve availability in subsequent
    periods, so operational KPIs should be assessed on a trailing rather than point-in-time
    basis.
