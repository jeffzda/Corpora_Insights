  what_happened: During the 11 April 2025 high ROCOF event caused by the trip of Wellington
    North Solar Farm (281MW), DPESS and the adjacent RESS1 and RESS2 projects provided
    measurable synthetic inertia responses, with RESS1 additionally providing sustained
    primary frequency response due to its FCAS enablement, while RESS2 and DPESS (not
    enabled in any markets) provided inertial response only.
  lesson_learnt: Grid forming BESS provides synthetic inertia regardless of market
    enablement, but sustained primary frequency response requires specific FCAS enablement
    — operators and network planners should not assume all BESS will provide frequency
    droop response and should distinguish between inertial (always-on) and droop (market-dependent)
    contributions when assessing grid frequency support.
