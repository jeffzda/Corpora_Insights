  source_title: 'Edify - Darlington Point Energy Storage System - Flagship Report:
    System Strength Remediation'
  publish_date: '2025-12-02'
  project_name: Darlington Point Energy Storage System (DPESS)
  what_happened: Edify identified that fast-acting voltage control (reactive power)
    provided by grid forming BESS plays a more critical role in enabling new renewable
    connections in the NEM than inertia provision, as no instances were observed where
    high ROCOF had limited new renewable connections, whereas insufficient system
    strength (voltage stability) had been a primary constraint.
  lesson_learnt: When assessing the value proposition of grid forming BESS for system
    strength, prioritise its fast voltage control and reactive power capabilities
    over inertia provision — these are the features most likely to remove connection
    constraints for renewable generators in the near term, and project economics and
    network service agreements should be structured accordingly.
