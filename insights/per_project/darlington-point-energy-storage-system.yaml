  source_title: Public Project Knowledge Sharing Report - Darlington Point Energy
    Storage System (DPESS)
  publish_date: '2025-10-30'
  project_name: Darlington Point Energy Storage System (DPESS)
  what_happened: DPESS main equipment deliveries were staged so that each Megapack
    unit was lifted directly from the delivery truck to its foundation in a single
    lift without intermediate storage, with crane setup positions allowing up to 12
    Megapacks to be delivered and installed from a single crane position per day.
  lesson_learnt: Plan delivery sequencing and crane setup positions for BESS equipment
    installation before finalising site layout — designing for direct truck-to-foundation
    lifts eliminates the need for laydown areas (which are often constrained on co-located
    solar/BESS sites) and allows sustained delivery rates of up to 12 units per crane
    setup per day.
