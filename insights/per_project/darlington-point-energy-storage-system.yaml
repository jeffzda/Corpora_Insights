  project_name: Darlington Point Energy Storage System
  what_happened: During the major 13 February 2024 network disturbance (loss of ~2,690
    MW caused by 500 kV tower failures), the co-located RESS2 BESS with identical
    grid-forming inverter settings to DPESS responded to voltage disturbances within
    less than 20 ms across multiple disturbance events while continuing normal operation.
  lesson_learnt: Grid-forming BESS with advanced inverters can provide near-instantaneous
    voltage and frequency response (sub-20 ms) during major network disturbances and
    ride through severe events — this performance validates grid-forming technology
    as a viable system strength solution and provides reference-class evidence for
    future grid-forming BESS projects.
