  publish_date: '2024-04-04'
  project_name: Darlington Point Energy Storage System
  what_happened: During commissioning testing, the grid forming inverters' inherent
    phase-imbalance correction response caused false triggering of the current transformer
    (CT) failure detection system, which used negative sequence current monitoring
    — a method designed for grid following plants that do not actively correct phase
    imbalance.
  lesson_learnt: Negative sequence current monitoring is unsuitable as a CT failure
    detection method for grid forming BESS because the inverters' active phase-balancing
    response generates negative sequence currents under normal high-imbalance network
    conditions — alternative CT failure detection methods based on phase current comparison
    must be specified at design stage.
