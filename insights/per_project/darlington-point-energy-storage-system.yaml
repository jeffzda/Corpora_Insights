- record_id: ARENA-DLV-34707
  source_title: 'Edify - Darlington Point Energy Storage System - Flagship Report:
    System Strength Remediation'
  publish_date: '2025-12-02'
  project_name: Darlington Point Energy Storage System (DPESS)
  what_happened: Simulations and operational data showed that when the BESS was operating
    at full export prior to a network fault, its current capacity was effectively
    consumed by the pre-fault operating point, severely reducing its ability to provide
    fault current and stabilise the local network — equivalent to a much smaller synchronous
    condenser.
  lesson_learnt: Grid forming BESS system strength contribution is highly dependent
    on pre-fault operating state — network operators and project developers must account
    for the operating range of a BESS when relying on it for system strength services,
    and should not assume it provides the same stabilising capability at full export
    as it does at idle or partial output.
  issue_severity: moderate
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: project developer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: DPESS entered a Network Support Agreement with Transgrid that
    relies only on fast-acting voltage control (reactive power), which the plant can
    provide at any operating state, thereby sidestepping the active power current
    limit constraint.
  transferability: broad
  delay_magnitude: null
  technology_domain: battery storage
  source_pages:
