    solution because it assessed that batteries would need to be coupled with a STATCOM
    and would therefore always be more expensive than a STATCOM alone, before Edify
    proposed a non-network battery model that could earn energy market revenue to
    offset network service costs.
  lesson_learnt: Network operators may systematically undervalue battery solutions
    for system strength if they evaluate them only as dedicated network assets rather
    than as dual-purpose commercial assets — project developers should explicitly
    model the combined energy market and network service revenue case when engaging
    TNSPs on system strength alternatives to synchronous plant.
