- record_id: ARENA-DLV-16504
  source_title: Edify - Darlington Point Energy Storage System - Operations Report
    4
  publish_date: '2026-01-05'
  project_name: Darlington Point Energy Storage System
  what_happened: The all-inclusive round-trip efficiency (RTE) at the point of connection
    — incorporating all balance-of-plant and standby losses — was 85% over the six-month
    period, while a dedicated charge/discharge test excluding standby losses returned
    an RTE of 89.78%, demonstrating a material gap between operational and test RTE.
  lesson_learnt: All-inclusive RTE measured at the point of connection — including
    BoP and standby losses — is materially lower than RTE from dedicated charge/discharge
    tests that exclude these losses; project models and offtake agreements should
    clearly distinguish between test-based and operational RTE metrics to avoid misaligned
    performance expectations.
  issue_severity: minor
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: project developer
