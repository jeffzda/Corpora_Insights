  publish_date: '2025-12-02'
  project_name: Darlington Point Energy Storage System (DPESS)
  what_happened: Hardware-in-the-Loop (HIL) testing was identified as significantly
    more valuable for validating grid forming inverter controls than software-based
    models (PSS®E or PSCAD), because it connects actual inverter controllers to a
    grid simulator and avoids uncertainties inherent in software representations,
    but only limited HIL testing was required under the NEM commissioning process
    at the time.
  lesson_learnt: Future grid forming BESS projects should proactively include HIL
    testing in their commissioning plan to validate grid forming functionalities that
    cannot be tested on-grid — this is particularly important as networks increasingly
    depend on these capabilities for grid stability and regulators are likely to require
    it.
