  what_happened: As FCAS market value declined, EnergyAustralia shifted DPESS operational
    strategy toward energy arbitrage, maintaining higher state of charge during low-price
    periods for discharge during peak demand. This resulted in FCAS enablement rates
    falling significantly from an average above 93% in the prior period (April–September
    2024) to much lower rates across most FCAS products in October 2024–March 2025.
  lesson_learnt: BESS dispatch strategies must be actively reoptimised as market conditions
    evolve; a fixed FCAS-first strategy can destroy value when FCAS prices decline
    and energy arbitrage spreads widen, so operators require flexibility to shift
    between revenue streams dynamically.
