  what_happened: DPESS used a temporary notifiable exemption from registration to
    energise the facility before inverters were connected, allowing on-site preparation
    work to proceed while the R1 modelling due diligence with AEMO was still ongoing.
  lesson_learnt: Use AEMO's notifiable exemption mechanism to energise a BESS facility
    before full registration is complete — this allows civil and electrical works
    to progress and auxiliary systems to be powered up while the R1 modelling review
    is finalised, reducing overall commissioning duration. Note that AEMO does not
    permit hold-point testing under a notifiable exemption.
