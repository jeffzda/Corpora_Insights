  publish_date: '2025-12-02'
  project_name: Darlington Point Energy Storage System (DPESS)
  what_happened: 'Grid forming inverter tuning required balancing competing constraints:
    lighter mechanical dynamic settings worsened post-fault-clearance damping and
    stability, while heavier mechanical dynamic settings worsened stability after
    severe frequency disturbances, requiring iterative negotiation of tuning parameters
    during the GPS process.'
  lesson_learnt: Grid forming inverter tuning involves fundamental trade-offs between
    fault clearance damping and frequency disturbance stability that cannot be resolved
    by simply tightening one parameter — project teams should budget for iterative
    tuning and modelling cycles during GPS negotiation and should document the trade-off
    rationale for regulator engagement.
