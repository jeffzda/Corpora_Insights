- record_id: ARENA-DLV-25706
  source_title: Edify Energy - Darlington Point Energy Storage System - Lessons Learnt
    Report
  publish_date: '2024-04-04'
  project_name: Darlington Point Energy Storage System
  what_happened: During commercial operations, DPESS grid forming controls produced
    no detectable difference in active power dispatch behaviour, market participation,
    FCAS registration, or compliance outcomes compared to what would be expected from
    a grid following BESS. Grid forming control responses were dominated by reactive
    power and were very small relative to frequency droop control actions.
  lesson_learnt: The connection process, timeline, and market operations for grid-forming
    BESS projects are substantially the same as for grid-following projects — the
    incremental complexity is manageable and diminishes as precedent is established,
    meaning project schedules and commercial models need not carry material additional
    risk premiums for grid-forming technology relative to grid-following.
