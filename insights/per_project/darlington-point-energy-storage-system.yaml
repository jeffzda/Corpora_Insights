- record_id: ARENA-DLV-34713
  source_title: 'Edify - Darlington Point Energy Storage System - Flagship Report:
    System Strength Remediation'
  publish_date: '2025-12-02'
  project_name: Darlington Point Energy Storage System (DPESS)
  what_happened: Simulations demonstrated that grid following inverters in weak grid
    conditions exhibited poor stability both during and after network faults, requiring
    retuning to reduce network support, whereas grid forming inverters provided significantly
    more reactive current and better voltage support during the same faults, though
    with a slower post-fault recovery with oscillations lasting up to 3 seconds.
  lesson_learnt: In weak grid locations, grid forming inverters provide substantially
    better fault support than grid following inverters but require careful tuning
    to manage post-fault oscillations — proponents connecting to weak grids should
    specifically model and negotiate GPS based on grid forming operation rather than
    assuming grid following standards apply.
