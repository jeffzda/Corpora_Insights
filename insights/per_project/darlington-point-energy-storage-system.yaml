  project_scale_band: first commercial/FOAK
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: coordination & stakeholders
  intervention_note: Edify negotiated with DPE to allow the fire safety study condition
    to be satisfied after construction commenced but before the batteries were energised,
    allowing the project to proceed while the fire safety study was revised and endorsed
    without requiring any layout changes.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id010
  - 25
  evidence_excerpt: It was the first large scale BESS which Fire Rescue NSW had been
    consulted on and so the approval of the fire safety study took longer than expected.
