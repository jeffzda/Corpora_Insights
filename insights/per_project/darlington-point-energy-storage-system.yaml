  publish_date: '2025-12-02'
  project_name: Darlington Point Energy Storage System (DPESS)
  what_happened: Three co-located BESS projects (DPESS, RESS1, RESS2) with separate
    financially responsible market participants each required a separate point of
    connection to the transmission network, which was resolved by engaging Transgrid
    to build, own and operate a 132/33kV substation as a Designated Network Asset
    providing three 33kV connection points off a shared transformer.
  lesson_learnt: Co-located BESS projects with separate market participants require
    individual connection points, which can significantly increase connection infrastructure
    costs and complexity — proponents should investigate the Designated Network Asset
    (DNA) mechanism early in development as a cost-sharing structure for shared substation
    infrastructure.
