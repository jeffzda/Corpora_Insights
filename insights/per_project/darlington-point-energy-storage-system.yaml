  publish_date: '2025-12-02'
  project_name: Darlington Point Energy Storage System (DPESS)
  what_happened: DPESS successfully entered a Network Support Agreement (NSA) with
    Transgrid in July 2024 under which it provides network stability services (fast-acting
    voltage control), increasing the permitted flow on the 330kV Line 63 by over one
    third compared to the previous constrained limit and reducing curtailment of renewable
    energy in NSW.
  lesson_learnt: Grid forming BESS can provide contracted network support services
    to TNSPs that are commercially competitive with synchronous condensers and STATCOM
    solutions when the BESS can also earn energy market revenue — proponents should
    proactively engage TNSPs about non-network battery solutions during the RIT-T
    process as an alternative to network infrastructure.
