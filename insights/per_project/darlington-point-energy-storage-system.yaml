  - 10
  evidence_excerpt: The reason the capacity factor is lower in September is due to
    the planned network outage requested by Transgrid between the 20th and 28th of
    September. These events had a significant impact on the capacity factor because
    the assumption for capacity factor calculation is one cycle per day. However,
    during the outage periods, the site was limited to 0MW, resulting in no generation
    and a lower capacity factor for those days.
