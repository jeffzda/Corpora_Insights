    systems (such as Tesla Megapack), a split procurement model separating the battery/conversion
    system from balance of plant is workable and preferred — the interface risk that
    justifies a turnkey EPC premium is lower than typically assumed, and the split
    model reduces cost while retaining manageable coordination complexity.
