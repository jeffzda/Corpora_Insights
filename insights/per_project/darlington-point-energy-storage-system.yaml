    within 6 months of submitting Connection Application deliverables, with only one
    major revision required, demonstrating that grid-forming inverter-based storage
    can be connected to the transmission network under the existing regulatory framework
    despite template limitations.
  lesson_learnt: Despite GPS template inadequacies, grid-forming BESS projects can
    achieve connection approval within 6 months under the existing framework when
    proponents invest in early education of network parties, OEM involvement, and
    early agreement on advanced-inverter-specific performance clauses — particularly
    clause S5.2.5.5.
