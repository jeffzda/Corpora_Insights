    — because the additional SCADA points required for these markets had not been
    included in the initial SCADA list agreed with AEMO, as that list was finalised
    before the 1s FCAS market design was complete.
  lesson_learnt: When configuring SCADA lists with AEMO for new BESS projects, explicitly
    check for any emerging or recently introduced market products (such as new FCAS
    sub-categories) that may require additional SCADA points not covered by the baseline
    list — late addition of SCADA points causes material delay to market participation.
