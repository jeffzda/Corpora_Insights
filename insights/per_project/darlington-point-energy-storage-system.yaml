  evidence_excerpt: The total imported energy over this same period was 7,367MWh resulting
    in a total round-trip efficiency (RTE) of 85%. It is noted that this is an all-inclusive
    RTE at the point of connection and includes all BoP losses as well as standby
    losses when the BESS may be idle. RTE is generally tested via a bespoke charge
    and discharge test which excludes these standby losses resulting in a higher RTE.
