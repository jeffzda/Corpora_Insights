    Agreement (BSSA) with EnergyAustralia, which transferred all operational dispatch
    rights and market revenue exposure to EnergyAustralia in exchange for fixed payments
    to the project. This arrangement insulated the project from market price volatility
    while allowing EnergyAustralia to optimise dispatch across energy and FCAS markets.
