    responding appropriately to demand changes — a sign of fixed-load operation rather
    than demand-following control.
  lesson_learnt: Flat hourly gas consumption profiles in the face of variable process
    demand are a diagnostic signal of poor demand-following control — investigate
    and upgrade control logic for gas equipment to modulate output in response to
    actual process demand, as this typically delivers measurable gas savings.
