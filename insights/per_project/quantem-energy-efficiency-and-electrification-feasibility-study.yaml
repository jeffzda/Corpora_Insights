  source_title: Quantem Energy Efficiency and Electrification Feasibility Study -
    Public Report
  publish_date: 2024-12
  project_name: Quantem Gas Efficiency and Electrification Study
  what_happened: None of the four assessed Quantem sites had sufficient electrical
    infrastructure to support electrification of process heating, making all direct
    electrification pathways financially unviable without significant prior electrical
    infrastructure investment.
  lesson_learnt: Before scoping electrification of industrial process heating, assess
    existing electrical infrastructure capacity early — inadequate infrastructure
    at all sites blocked viable electrification business cases and must be costed
    as a prerequisite, not an afterthought.
