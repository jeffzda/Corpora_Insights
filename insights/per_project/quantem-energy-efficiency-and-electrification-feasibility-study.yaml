  what_happened: The Hot Water System (HWS) at West Melbourne Site 1 was operating
    at only 46% of the time under 600 kW demand — 20% of its designed capacity — resulting
    in reduced operational efficiency of 77%, because the system was oversized relative
    to actual demand.
  lesson_learnt: When designing or replacing process heating systems at industrial
    sites, size equipment to actual demand profiles rather than peak design capacity
    — systems chronically operating far below design capacity suffer efficiency penalties;
    modular or staged systems better match variable demand.
