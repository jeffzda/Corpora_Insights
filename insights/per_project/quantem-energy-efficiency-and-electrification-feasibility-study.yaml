  project_name: Quantem Gas Efficiency and Electrification Study
  what_happened: 'Data availability and accuracy were identified as a key challenge
    across all four sites: existing meter readings required validation, historical
    data periods were too short to represent all operating conditions, operations
    were non-steady and non-continuous, and data volumes were large.'
  lesson_learnt: Industrial energy feasibility studies require sub-metering installation
    and a minimum period of continuous data collection before analysis — short or
    incomplete historical datasets undermine the accuracy of energy savings estimates
    and should be flagged as a risk at project inception.
