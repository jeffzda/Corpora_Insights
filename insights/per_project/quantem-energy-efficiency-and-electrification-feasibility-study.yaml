  publish_date: 2024-12
  project_name: Quantem Gas Efficiency and Electrification Study
  what_happened: Onsite solar PV generation was assessed across all four Quantem sites
    but found impractical due to severely limited roof and ground-mount area; the
    small installed capacity already in place was negligible relative to site load.
  lesson_learnt: For bulk liquid storage terminals with dense tank layouts and limited
    roof area, onsite solar PV is unlikely to make a material contribution to decarbonisation
    — screen available installation area early in feasibility to avoid investing engineering
    effort in an option that cannot scale to meet site load.
