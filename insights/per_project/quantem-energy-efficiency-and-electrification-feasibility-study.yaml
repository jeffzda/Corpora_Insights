  source_title: Quantem Energy Efficiency and Electrification Feasibility Study -
    Public Report
  publish_date: 2024-12
  project_name: Quantem Gas Efficiency and Electrification Study
  what_happened: Battery energy storage systems (BESS) were assessed at all four sites
    but found non-viable due to low baseline electricity consumption, absence of onsite
    renewable generation, inadequate electrical infrastructure, and hazardous area
    classification complications.
  lesson_learnt: BESS viability at industrial sites depends on co-presence of adequate
    electrical infrastructure, meaningful onsite renewable generation, and sufficient
    baseload — assess these preconditions before scoping BESS, and flag BESS as a
    future option contingent on electrification proceeding.
