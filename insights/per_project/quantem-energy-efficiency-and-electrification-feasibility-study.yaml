  what_happened: The steam-to-hot-water conversion with heat pump electrification
    project had a payback period of 110 years and negative NPV of -$26.6M, making
    it financially unviable despite being the recommended long-term decarbonisation
    pathway, because the capital cost ($28.5M) far exceeded the annual savings ($258K).
  lesson_learnt: Steam-to-hot-water conversion with heat pump electrification is technically
    the most viable decarbonisation pathway for bulk liquid storage heating but currently
    has an extremely long payback — this type of project should be planned as a long-term
    asset renewal programme timed to coincide with end-of-life replacement of aging
    steam coils and infrastructure, rather than justified on standalone financial
    returns.
