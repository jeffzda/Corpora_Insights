- record_id: ARENA-DLV-30423
  source_title: Quantem Energy Efficiency and Electrification Feasibility Study -
    Public Report
  publish_date: 2024-12
  project_name: Quantem Gas Efficiency and Electrification Study
  what_happened: Electric immersion and heat-tracing tank heating technologies, while
    proven at smaller tank sizes (20–100 kL), were found impractical at Quantem sites
    because tanks were significantly larger than typical industry sizes and uninsulated,
    and the COP of approximately 1 resulted in increased operating costs.
  lesson_learnt: Electric tank heating via immersion heaters or heat tracing is only
    viable for small, insulated tanks — for large, uninsulated bulk liquid storage
    tanks the combination of high electricity costs, low COP, and the need for hazardous
    area compliant equipment makes this approach uneconomic; heat pump solutions with
    steam-to-hot-water conversion are preferable for large tank farms.
