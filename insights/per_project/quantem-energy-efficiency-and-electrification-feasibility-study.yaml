- record_id: ARENA-DLV-30408
  source_title: Quantem Energy Efficiency and Electrification Feasibility Study -
    Public Report
  publish_date: 2024-12
  project_name: Quantem Gas Efficiency and Electrification Study
  what_happened: Manual control of tank heating valves at West Melbourne (operators
    manually opening and closing steam valves) was identified as causing excessive
    heating and incurring unnecessary labour costs, with estimated efficiency gains
    of approximately 15% achievable through automation.
  lesson_learnt: Manual valve operation for tank heating in bulk liquid storage facilities
    causes measurable energy waste — automating tank heating control should be prioritised
