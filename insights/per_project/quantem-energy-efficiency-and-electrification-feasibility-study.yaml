  what_happened: At West Melbourne Site 2, steam for tank heating was supplied from
    Site 4 via a long inter-site pipeline, causing condensation losses and pressure
    drop in transit; as a result only one tank was using steam and the rest had no
    heating despite the system being designed to serve them.
  lesson_learnt: Long-distance steam distribution between sites is inherently inefficient
    — condensation losses and pressure drop over distance degrade the system to the
    point of practical failure; localised heat generation or conversion to a more
    easily transported heat transfer fluid (e.g. hot water) should be evaluated for
    any inter-site steam supply arrangement.
