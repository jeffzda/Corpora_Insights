  source_title: Quantem Energy Efficiency and Electrification Feasibility Study -
    Public Report
  publish_date: 2024-12
  project_name: Quantem Gas Efficiency and Electrification Study
  what_happened: Thermal oxidiser operation control was identified as the highest-value
    single gas efficiency opportunity at one site, with potential gas savings of 13,356
    GJ/year (8.4% site energy reduction), a payback of 0.3 years, NPV of $1.59M, and
    IRR of 328%, because oxidisers were not loaded optimally.
  lesson_farnt: Operational control optimisation of thermal oxidisers — ensuring they
    follow actual vapour load rather than running at high flame without load — delivers
    the fastest and largest gas savings at bulk liquid storage terminals and should
    be the first engineering priority.
