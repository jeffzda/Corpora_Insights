- record_id: ARENA-DLV-30402
  source_title: Quantem Energy Efficiency and Electrification Feasibility Study -
    Public Report
  publish_date: 2024-12
  project_name: Quantem Gas Efficiency and Electrification Study
  what_happened: Direct electrification of process heating via electric steam boilers,
    electric thermal oil heaters, and electric tank heaters produced negative cost
    savings (i.e. cost increases) at all sites, with NPVs ranging from -$4M to -$25M,
    because electricity costs are several times higher than natural gas and the COP
    of these devices is approximately 1.
  lesson_learnt: Direct electric substitution for gas process heating in industrial
    settings is unlikely to be cost-positive at current energy prices — evaluate heat
    pumps (COP 3–5) as the preferred electrification route where low-grade waste heat
    or air-source potential exists, and include electricity demand charges in the
    business case.
  issue_severity: major
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: industrial operator
  delay_category: null
  failure_mode: commercial & market
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Study recommended conversion of steam systems to hot water followed
    by heat pump installation as the most economically viable electrification pathway,
    leveraging high COP values.
  transferability: broad
  delay_magnitude: null
  technology_domain: industrial renewables
  source_pages: &id002
  - 8
  - 11
  - 12
  - 13
  evidence_excerpt: Electrification is attractive pathway for decarbonisation as the
    grid is gradually getting decarbonised. However, the CAPEX for electrification
    is hard to justify as there is generally no energy cost savings for electric steam
    boiler and thermal oil heaters as electricity price is a few times higher primary
    fuel such as natural gas.
