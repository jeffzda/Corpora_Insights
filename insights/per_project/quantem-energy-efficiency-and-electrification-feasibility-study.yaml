  evidence_excerpt: The hourly interval data were also analysed, and the result is
    showing the hourly average gas consumption is consistent. The cause for this phenomenon
    can be inappropriate capacity response to demand changes by gas equipment's control
    and/or constant loading (less likely). This indicates opportunities for improvement
    of gas efficiency by improving operational control of the gas equipment to follow
