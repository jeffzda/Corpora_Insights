- record_id: ARENA-DLV-20715
  source_title: Demand Response Short Notice RERT Trial Year 3 Report
  publish_date: 2021-10
  project_name: DR SN RERT Trial — AGL C&I API-based near-real-time metering
  what_happened: In Year 3, AGL replaced a proprietary hardware metering system with an Application Programming Interface (API) provided by meter data providers to deliver near-real-time meter data for
    C&I DR monitoring, finding it significantly simpler to deploy and lower cost as it used existing market metering equipment and communications.
  lesson_learnt: Where market metering infrastructure already exists at C&I sites, API-based data access can replace purpose-built monitoring hardware, dramatically reducing installation cost and complexity
    for DR program operators; program designers should assess existing metering data access channels before specifying new hardware.
