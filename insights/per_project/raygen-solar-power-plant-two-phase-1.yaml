- record_id: ARENA-DLV-52303
  source_title: RayGen, Solar Power Plant Two Phase 1 - Milestone 2 Lessons Learnt
    Report
  publish_date: 2025-02
  project_name: 'RayGen Solar Power Plant Two: Phase 1'
  what_happened: RayGen commenced design and build of an Automated Heliostat Assembly
    Line in parallel with finalising the heliostat product design and component tooling,
    in order to compress the timeline to commercial-scale delivery. Late findings
    from product validation testing and tooling development triggered product design
    changes that had to be retrofitted into the already-in-progress automated assembly
    line, causing greater cost and schedule impact than if product design had been
    finalised first.
  lesson_learnt: Carefully assess product design maturity before starting automated
    assembly line design — running both in parallel can compress the schedule but
    generates rework costs and timing impacts when late design changes flow into a
    complex automated line. Mitigate by establishing immediate feedback loops between
    validation and line design teams, and by selecting a highly competent third-party
    assembly line supplier capable of managing late changes.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: construction/installation
  failure_mode: poor scoping
  outcome_class: delayed but recoverable
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Once first off-tool parts were received, validation was conducted
    in parallel with the assembly line build; design changes were immediately fed
    back to the third-party supplier, whose competence was critical to successfully
    absorbing the late changes with no ongoing negative implications.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id003
  - 7
  evidence_excerpt: Making changes to a complex automated production line had a greater
    impact to cost and timing than if the product design was finalised in advance
    of designing the automated line... The chosen approach has still resulted in a
    quicker completion than if a more sequential approach was taken albeit with some
    impact to the original schedule.
  confidence_note: secondary_failure_mode of cost overrun inferred from 'greater impact
    to cost' language; delay_magnitude not quantified as no duration is stated.
