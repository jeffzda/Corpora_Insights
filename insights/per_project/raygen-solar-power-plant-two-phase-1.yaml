- record_id: ARENA-DLV-52302
  source_title: RayGen, Solar Power Plant Two Phase 1 - Milestone 2 Lessons Learnt
    Report
  publish_date: 2025-02
  project_name: 'RayGen Solar Power Plant Two: Phase 1'
  what_happened: RayGen scaled up PV-Ultra module manufacturing capacity to 170 MW
    p.a. using bespoke and adapted commercial automation equipment. Commercially available
    equipment had to be used in non-standard ways to produce RayGen's unique modules,
    requiring hardware and software modifications that could only be resolved through
    close collaboration with OEMs and local distributors, including remote support
    and on-site visits to Australia.
  lesson_learnt: When deploying bespoke or adapted automation equipment for novel
    manufacturing, select automation partners with genuine OEM-level capability and
    maintain close, ongoing collaboration throughout commissioning — the complexity
    and cost risk of delivering high-reliability bespoke systems on time and to budget
    should not be underestimated, particularly where processes transition from manual
    to fully automated.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: first commercial/FOAK
  lifecycle_phase: commissioning/integration
  proponent_type: technology vendor
  delay_category: commissioning/integration
  failure_mode: unvalidated integration
  outcome_class: delayed but recoverable
  secondary_failure_mode: execution & logistics
  intervention_note: Worked closely with OEMs and local distributors through remote
    and on-site support to resolve hardware and software issues and fully commission
    the equipment.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id002
  - 6
  evidence_excerpt: The closeness of interactions between process development and
    equipment selection was underestimated at the commencement of the project, particularly
    where the largest step change occurred between previously manual to fully automated
    processes.
