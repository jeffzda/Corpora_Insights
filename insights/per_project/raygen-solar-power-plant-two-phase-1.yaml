- record_id: ARENA-DLV-52301
  source_title: RayGen, Solar Power Plant Two Phase 1 - Milestone 2 Lessons Learnt
    Report
  publish_date: 2025-02
  project_name: 'RayGen Solar Power Plant Two: Phase 1'
  what_happened: During FEED for SPP2, RayGen directly collaborated with strategic
    deployment partner SLB, a FEED consultant, and key process equipment suppliers
    to optimise plant design, access global supply chains, and reduce costs. This
    multi-party collaboration brought in specialised expertise in CFD, materials engineering,
    lifecycle testing, and system engineering that RayGen did not hold internally.
  lesson_learnt: Engage key technology partners and equipment suppliers directly during
    FEED — direct collaboration enables design optimisation, cost reduction, and access
    to global supply chains that would not be achievable through arms-length procurement
    alone. A modular, collaboratively developed FEED design also substantially reduces
    time and cost for future project deployments.
