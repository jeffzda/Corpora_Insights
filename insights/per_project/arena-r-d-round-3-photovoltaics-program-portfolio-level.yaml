- record_id: ARENA-DLV-48116
  source_title: ARENA-Funded Cutting Edge Research in Photovoltaics
  publish_date: 2019-09
  project_name: ARENA R&D Round 3 Photovoltaics Program (portfolio-level)
  what_happened: ARENA's third R&D funding round structured $29.2 million across 20 projects to pursue four linked outcome areas (efficiency improvement, cost reduction, novel materials, new applications).
    Close collaboration between universities and industry partners was identified as critical for identifying real commercial manufacturing problems and directing research towards solving them, with multiple
    projects demonstrating early commercial interest or industry co-design.
  lesson_learnt: Structuring PV R&D funding around a portfolio of complementary outcome areas (efficiency, cost, materials, applications) with mandatory industry partnership requirements generates a pipeline
    from fundamental research through to commercial translation — programs that require industry co-investment or co-design from grant award are more likely to generate outcomes that address real manufacturing
    barriers.
