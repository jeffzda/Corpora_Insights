- record_id: ARENA-DLV-9142
  source_title: State of DER Technology Integration Report
  publish_date: 2021-02
  project_name: Townsville Community Scale Battery Storage Project
  what_happened: Yurika identified that existing market participant categories were
    not suitable for sub-5MW battery systems wishing to participate in wholesale energy
    and ancillary services markets, and that tariff structures did not provide adequate
    incentives for DER technologies that can provide network benefits. These were
    identified as key barriers to BAU adoption.
  lesson_learnt: Sub-5MW community batteries face regulatory misfit in market participant
    categories designed for larger generators — project proponents should engage with
    AEMO and regulators during the project to develop appropriate market access pathways
    rather than discovering the barrier at commissioning when commercial expectations
    are set.
  issue_severity: moderate
  project_type: storage
  project_scale_band: first commercial/FOAK
