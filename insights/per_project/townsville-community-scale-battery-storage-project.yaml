- record_id: ARENA-DLV-9141
  source_title: State of DER Technology Integration Report
  publish_date: 2021-02
  project_name: Townsville Community Scale Battery Storage Project
  what_happened: The Townsville Community Scale Battery (4MW/8MWh), Queensland's first
    community scale grid-connected BESS, completed site construction and electrical
    installation in under 4 months from commencement, with HV network connection achieved
    by February 2020. However, battery commissioning was still in progress at mid-2020
    with full operation anticipated later in 2020.
  lesson_learnt: Community-scale battery civil and electrical installation can be
    delivered rapidly (under 4 months) when local resources are mobilised effectively,
    but the commissioning and operational integration phase for BESS with novel market
    participation capabilities (FCAS, wholesale arbitrage, network support) requires
    additional time beyond civil completion and should not be underestimated in project
    schedules.
  issue_severity: minor
