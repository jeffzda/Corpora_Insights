- record_id: ARENA-DLV-14954
  source_title: 'Looking Forward: Barriers, Risks and Rewards of the Australian Geothermal
    Sector to 2020 and 2030'
  publish_date: 2014-06
  project_name: Geodynamics Ltd – Innamincka Deeps Project (1 MWe Pilot)
  what_happened: After more than a decade of activity, Geodynamics ran a 1 MWe pilot
    plant from April to October 2013, achieving availability exceeding 75 per cent
    and a maximum flow rate of approximately 40 kg/s from a single well — the highest
    recorded from an EGS well in a conductive setting in Australia — but still well
    below the 80–100 kg/s required for commercial viability.
  lesson_learnt: Demonstrating proof of concept at pilot scale in EGS does not automatically
    translate to commercial viability; the gap between demonstrated flow rates (~40
    kg/s) and commercially required flow rates (~80–100 kg/s) remains the primary
    technical barrier and must be explicitly addressed before proceeding to commercial-scale
    investment.
