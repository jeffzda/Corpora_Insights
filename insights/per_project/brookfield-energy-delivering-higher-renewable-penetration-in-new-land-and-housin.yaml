- record_id: ARENA-DLV-52055
  source_title: ARENA Distributed Energy Resources Projects
  publish_date: 2019-03
  project_name: Brookfield Energy Delivering higher renewable penetration in new land
    and housing developments through off-grid microgrids
  what_happened: A feasibility study for an off-grid microgrid found that existing
    modelling tools lacked the automation needed for effective microgrid design, and
    that a proprietary smart grid communications system for utilities was required
    — gaps not apparent at the outset.
  lesson_learnt: Microgrid feasibility studies should assess the adequacy of available
    modelling tools and communications infrastructure before committing to a design
    approach — existing software packages may lack sufficient automation, requiring
    custom development that adds cost and time.
