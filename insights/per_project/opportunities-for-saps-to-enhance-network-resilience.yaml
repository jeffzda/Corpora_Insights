- record_id: ARENA-DLV-71557
  source_title: Opportunities for Stand-Alone Power Systems to Enhance Network Resilience
  publish_date: 2020-10
  project_name: Opportunities for SAPS to Enhance Network Resilience
  what_happened: The regulatory review identified that the current definition of 'distribution
    service' in the NER prevented DNSPs from recovering regulated revenue for SAPS
    investments, because SAPS assets are not physically connected to the distribution
    system and therefore did not meet the statutory definition. This created material
    cost-recovery uncertainty that deterred DNSP investment in SAPS.
  lesson_learnt: The cost-recovery barrier arising from the NER definition of 'distribution
    service' was a foundational regulatory obstacle to DNSP-led SAPS deployment. Project
    proponents and policy advocates should ensure that definitional coverage of SAPS
    assets is explicitly confirmed in regulatory determinations before committing
    to SAPS-based delivery programs.
