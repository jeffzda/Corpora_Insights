- record_id: ARENA-DLV-71552
  source_title: Opportunities for Stand-Alone Power Systems to Enhance Network Resilience
  publish_date: 2020-10
  project_name: Opportunities for SAPS to Enhance Network Resilience
  what_happened: Case Study 2 modelling showed that providing individual isolated
    SAPS to 60 geographically dispersed customers produced a positive NPV of $3.2M
    — a better outcome than the town-scale islanded SAPS — because lower capital costs
    were required while the same network benefit of decommissioning the HV feeder
    was realised.
  lesson_learnt: Individual SAPS for dispersed rural customers offer a stronger business
    case than township-scale SAPS because capital costs scale with load while network
    benefits (avoided feeder maintenance, rebuild, and vegetation management) remain
    constant. Where a town anchor does not exist, individual SAPS should be the preferred
    option for evaluation.
