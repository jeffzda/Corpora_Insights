- record_id: ARENA-DLV-71556
  source_title: Opportunities for Stand-Alone Power Systems to Enhance Network Resilience
  publish_date: 2020-10
  project_name: Opportunities for SAPS to Enhance Network Resilience
  what_happened: The regulatory review found there is no fit-for-purpose method, endorsed
    by the AER, for valuing long-duration localised outages caused by natural hazard
    events. The AER's proposed WALDO VCR framework was discontinued after stakeholders
    identified that it failed to account for relevant social costs, consumer preferences,
    and the likelihood that economic impacts grow (rather than diminish) with outage
    duration.
  lesson_learnt: Network businesses preparing SAPS resilience business cases cannot
    rely on any current AER-sanctioned VCR methodology for long-duration localised
    outages — this gap materially understates the benefits of resilience investments.
    Stakeholders and regulators should prioritise developing a fit-for-purpose localised
    long-duration outage valuation methodology before SAPS business cases can be robustly
    approved.
