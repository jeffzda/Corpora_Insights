  what_happened: 'Case Study 3 sensitivity analysis revealed a counterintuitive finding:
    more existing customer-owned solar PV within the SAPS boundary worsens the overall
    islandable SAPS business case, because existing solar lowers SAPS capital cost
    but does not generate additional benefits attributable to the SAPS investment.'
  lesson_learnt: When sizing and costing islandable SAPS, existing behind-the-meter
    DER should not be treated as a straightforward benefit — while it reduces required
    SAPS capacity and capital cost, it simultaneously removes the attributable benefit
    of that capacity from the business case. Business case models must distinguish
    between new DER benefits and pre-existing DER contributions.
