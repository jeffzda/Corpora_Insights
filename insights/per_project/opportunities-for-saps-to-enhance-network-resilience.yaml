  what_happened: Cost pass-through applications by Australian DNSPs for natural hazard
    event damage increased sharply, with four applications totalling $74 million in
    eligible costs (and $125 million in actual costs) submitted in 2020 alone, compared
    to one application in 2015 ($43.2M by Ausgrid). The report identified this trend
    as likely to continue and worsen.
  lesson_learnt: The cost pass-through mechanism is not a sustainable long-term resilience
    strategy — its increasing use signals that current regulatory settings over-rely
    on recovery mechanisms and under-incentivise proactive mitigation. Policymakers
    and network planners should treat the escalating frequency of pass-through applications
    as a leading indicator that proactive investment in SAPS and other resilience
    measures needs to be unlocked urgently.
