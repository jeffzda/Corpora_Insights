  source_title: Opportunities for Stand-Alone Power Systems to Enhance Network Resilience
  publish_date: 2020-10
  project_name: Opportunities for SAPS to Enhance Network Resilience
  what_happened: Case Study 3 modelling of an islandable power system (supplying 45%
    of town load during outages only, with the HV feeder retained) produced a negative
    NPV of -$3.3M, because while system costs were lower than a fully islanded SAPS,
    the feeder still had to be maintained, eliminating the largest avoided-cost benefit.
  lesson_learnt: An islandable SAPS that retains the HV feeder cannot realise avoided
    network rebuild and maintenance benefits — the primary source of value in islanded
    configurations — making its business case weaker than expected despite lower capital
    cost. Planners should not assume a partial islandable solution is automatically
    more cost-effective than full islanding.
