  project_name: Opportunities for SAPS to Enhance Network Resilience
  what_happened: The report identified that islandable SAPS in Case Study 3 could
    theoretically generate revenue from battery services such as FCAS, but noted it
    was unclear how these benefits could be realised given the small size and fringe-of-grid
    nature of the SAPS.
  lesson_learnt: Battery ancillary service revenue streams (e.g. FCAS) that appear
    in SAPS business case models may not be practically accessible for small, remote,
    or fringe-of-grid systems. Business case developers should verify market access
    and metering/registration pathways for ancillary services before including these
    revenue streams in SAPS NPV calculations.
