  project_name: Opportunities for SAPS to Enhance Network Resilience
  what_happened: The report identified that de-energisation (proactively switching
    off network lines during extreme fire weather) is available only to SA Power Networks
    in Australia. While de-energisation reduces bushfire ignition risk, it creates
    extended outages with significant community impact when no backup supply (such
    as a SAPS or community battery with V2G) exists.
  lesson_learnt: Any expansion of de-energisation powers to additional DNSPs must
    be paired with backup supply options for affected communities — without this,
    de-energisation simply substitutes ignition risk with supply deprivation risk.
    SAPS, community batteries, and V2G-capable EVs should be assessed as complementary
    investments wherever de-energisation is contemplated.
