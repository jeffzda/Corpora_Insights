- record_id: ARENA-DLV-71558
  source_title: Opportunities for Stand-Alone Power Systems to Enhance Network Resilience
  publish_date: 2020-10
  project_name: Opportunities for SAPS to Enhance Network Resilience
  what_happened: The regulatory review found that consumer protections under the National
    Energy Customer Framework (NECF) were generally not available to SAPS customers
    in most NEM jurisdictions, because the NECF only applies to customers connected
    to the interconnected national grid. This was identified as a key barrier to customer
    acceptance and DNSP uptake of SAPS.
  lesson_learnt: Transitioning customers to SAPS without equivalent consumer protections
    creates a significant regulatory risk and acceptance barrier. Network businesses
    and policymakers should not pursue SAPS deployment programs at scale until jurisdictional
    consumer protection coverage is explicitly extended to SAPS customers.
