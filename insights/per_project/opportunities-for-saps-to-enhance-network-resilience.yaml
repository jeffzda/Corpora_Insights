  source_title: Opportunities for Stand-Alone Power Systems to Enhance Network Resilience
  publish_date: 2020-10
  project_name: Opportunities for SAPS to Enhance Network Resilience
  what_happened: The report identified that DNSP ring-fencing rules create ambiguity
    about whether DNSPs can own and control SAPS generation assets. Under the AEMC's
    proposed framework, DNSPs would generally need AER waivers to provide generation
    services within SAPS, and network businesses raised concerns that the waiver process
    was itself a burden likely to impede SAPS uptake.
  lesson_learnt: Ring-fencing requirements designed for conventional grid assets can
    inadvertently obstruct SAPS deployment where generation is an integral component
    of the supply service. Regulators should create SAPS-specific exemptions or streamlined
    waiver pathways to avoid administrative barriers impeding network investment in
    remote or bushfire-prone area resilience.
