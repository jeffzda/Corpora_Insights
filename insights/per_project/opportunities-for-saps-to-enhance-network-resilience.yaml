- record_id: ARENA-DLV-71576
  source_title: Opportunities for Stand-Alone Power Systems to Enhance Network Resilience
  publish_date: 2020-10
  project_name: Opportunities for SAPS to Enhance Network Resilience
  what_happened: The regulatory review found that SAPS regulatory arrangements in
    Australia were fragmented by jurisdiction with no national framework, and the
    level of regulation varied significantly. Queensland was the only jurisdiction
    applying NECF and NER provisions to SAPS; other jurisdictions had partial or no
    applicable protections.
  lesson_learnt: The lack of a national SAPS regulatory framework prior to the AEMC
    review created highly uneven investor and consumer certainty across jurisdictions.
    Future SAPS proponents operating in non-QLD jurisdictions should map applicable
    consumer protections, service classification rules, and cost-recovery pathways
    at the outset of project development rather than assuming national framework equivalence.
  issue_severity: moderate
  project_type: network/grid
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: approvals/contracting
  proponent_type: network business
  delay_category: approvals/regulatory
