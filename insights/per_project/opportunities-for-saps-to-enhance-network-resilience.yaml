- record_id: ARENA-DLV-71554
  source_title: Opportunities for Stand-Alone Power Systems to Enhance Network Resilience
  publish_date: 2020-10
  project_name: Opportunities for SAPS to Enhance Network Resilience
  what_happened: Case Study 4 modelling showed that an individual SAPS for a single
    remote customer supplied by a dedicated 5km HV feeder in heavily vegetated bushfire-prone
    country produced a positive NPV of $0.8M even without any resilience benefits,
    driven primarily by avoided vegetation management opex and avoided feeder replacement
    costs.
  lesson_learnt: Individual SAPS for single remote customers with dedicated HV feeders
    traversing heavily vegetated areas can be economically justified purely on standard
    network cost grounds, before any resilience premium is added. Network planners
    should prioritise these customers first when assessing SAPS rollout candidates,
    particularly where vegetation management opex is high.
