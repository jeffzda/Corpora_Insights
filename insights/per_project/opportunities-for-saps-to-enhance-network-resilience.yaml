- record_id: ARENA-DLV-71555
  source_title: Opportunities for Stand-Alone Power Systems to Enhance Network Resilience
  publish_date: 2020-10
  project_name: Opportunities for SAPS to Enhance Network Resilience
  what_happened: Modelling across all case studies showed that if the annual probability
    of a major bushfire impacting a bushfire-prone town increases from 4% to approximately
    8% or more — a scenario considered plausible before 2050 under climate projections
    — then a compelling resilience-based business case for SAPS exists for both islanded
    and islandable remote town configurations.
  lesson_learnt: SAPS business case assessments for remote towns in bushfire-prone
    areas should incorporate climate-adjusted bushfire probability scenarios rather
    than relying solely on historical rates. At ~8% annual probability, town-scale
    SAPS transitions from negative to positive NPV, and climate trajectories suggest
    this threshold could be crossed before 2050.
