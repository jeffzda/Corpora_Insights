  what_happened: The report found that in emergency events only DNSP staff (not third-party
    generation operators) are authorised to enter affected areas to restore power.
    Under the AEMC's proposed model requiring third-party ownership of SAPS generation
    assets, restoring power after a natural disaster would require DNSP staff to accompany
    third-party operators, creating coordination complexity that could delay emergency
    supply restoration.
  lesson_learnt: The proposed separation of SAPS generation ownership (third party)
    from network operation (DNSP) creates an emergency-response coordination risk
    that must be resolved before large-scale SAPS deployment in disaster-prone areas.
    Delivery models for resilience-based SAPS should explicitly define emergency access
    and operational authority before commissioning.
