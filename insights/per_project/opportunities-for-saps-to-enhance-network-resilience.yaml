  what_happened: The regulatory review found there is no agreed industry methodology
    for assigning probabilities to natural hazard events when constructing SAPS resilience
    business cases, creating a barrier to AER acceptance of such business cases. Two
    projects underway (ESCI and Project IGNIS) were expected to partially address
    this in 2021 but had not yet produced applicable guidance at time of writing.
  lesson_learnt: Without standardised, AER-endorsed natural hazard probability methodologies,
    network businesses cannot robustly justify resilience-based SAPS investments.
    Until the ESCI and IGNIS projects deliver outputs and the AER publishes guidance,
    network businesses should document their probabilistic assumptions transparently
    and align with best available peer-reviewed science to maximise the defensibility
    of SAPS business cases.
