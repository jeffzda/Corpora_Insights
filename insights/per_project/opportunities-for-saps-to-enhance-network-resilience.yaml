- record_id: ARENA-DLV-71559
  source_title: Opportunities for Stand-Alone Power Systems to Enhance Network Resilience
  publish_date: 2020-10
  project_name: Opportunities for SAPS to Enhance Network Resilience
  what_happened: The STPIS regime was found to incentivise reliability (average SAIDI/SAIFI)
    but not resilience — it does not measure or reward the speed with which networks
    recover from Major Event Days (MEDs). As extreme weather events increase in frequency,
    the 2.5 beta MED threshold becomes increasingly distorted, and networks near but
    not exceeding the threshold face STPIS penalties despite responding to climate-driven
    events.
  lesson_learnt: Regulators should not conflate reliability and resilience performance
    incentives. The STPIS Beta 2.5 methodology needs reform to reflect increasing
    frequency and severity of MEDs and to include a recovery-speed metric; until this
    is done, DNSPs face perverse financial exposure for climate-driven outages that
    fall just below the MED exclusion threshold.
