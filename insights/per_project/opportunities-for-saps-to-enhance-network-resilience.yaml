- record_id: ARENA-DLV-71574
  source_title: Opportunities for Stand-Alone Power Systems to Enhance Network Resilience
  publish_date: 2020-10
  project_name: Opportunities for SAPS to Enhance Network Resilience
  what_happened: The modelling assumed a 100% diesel SAPS was not a viable option
    for remote town supply despite potentially being lowest cost, because of community
    acceptance concerns and practical logistics of supplying diesel to an isolated
    community during and after a natural hazard event (including storage capacity
    and transport access constraints).
  lesson_learnt: Diesel-only SAPS solutions for remote community resilience are constrained
    by logistics and community acceptance even where they represent the lowest capital
    cost option. Project designers should assume a solar-battery-diesel hybrid configuration
    as the base case for remote resilience SAPS and explicitly assess diesel supply
    chain risk during post-event scenarios as part of business case development.
