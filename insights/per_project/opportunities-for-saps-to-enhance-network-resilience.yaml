  what_happened: Sensitivity analysis of Case Study 1 (islanded remote town) showed
    that the business case NPV is most sensitive to bushfire probability and HV feeder
    rebuild costs. At the high end of plausible estimates for both variables, a positive
    NPV is achievable, but no single parameter threshold guarantees a positive case
    — only certain combinations do.
  lesson_learnt: SAPS business cases for remote towns are highly sensitive to a small
    number of site-specific variables, particularly bushfire probability and feeder
    rebuild cost. Business case assessors should run multi-variable sensitivity analysis
    rather than single-parameter analysis, as positive NPV requires favourable combinations
    across several inputs simultaneously.
