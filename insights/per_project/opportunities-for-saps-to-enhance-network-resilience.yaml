  source_title: Opportunities for Stand-Alone Power Systems to Enhance Network Resilience
  publish_date: 2020-10
  project_name: Opportunities for SAPS to Enhance Network Resilience
  what_happened: 'The report identified that a possible staged implementation pathway
    exists: provision of an islandable SAPS to a remote town as a first step, with
    transition to a fully islanded SAPS at the end of the network''s asset life or
    following destruction of the HV feeder by a natural hazard event.'
  lesson_learnt: A staged islandable-to-islanded transition may offer a more financially
    and operationally tractable deployment pathway than immediate full islanding for
    remote towns. Network planners should assess whether installing an islandable
    SAPS now, sized for partial load, could serve as a foundation for full islanding
    at the feeder's end-of-life — capturing earlier resilience benefits while deferring
    the full capital outlay.
