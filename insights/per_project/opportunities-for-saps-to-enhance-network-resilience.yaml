- record_id: ARENA-DLV-71551
  source_title: Opportunities for Stand-Alone Power Systems to Enhance Network Resilience
  publish_date: 2020-10
  project_name: Opportunities for SAPS to Enhance Network Resilience
  what_happened: Modelling of four hypothetical case studies found that the business
    case for isolating a remote town of ~500 customers via a fully islanded SAPS (Case
    Study 1) was negative at a net present value of -$8.6M, based on a 4% annual probability
    of a major bushfire event impacting the town.
  lesson_learnt: A fully islanded SAPS for a remote town is unlikely to be economically
    justified under current bushfire probabilities — the business case only becomes
    positive at a bushfire probability of ~7.6% per year or higher. Network planners
    should therefore reserve this approach for towns with the most extreme combinations
    of remoteness, aging feeders, and high bushfire exposure.
