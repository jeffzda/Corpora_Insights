  what_happened: Since 2019, global insurance markets have significantly withdrawn
    bushfire risk coverage for Australian DNSPs, resulting in substantially higher
    premiums, reduced scope of coverage, and growing reliance on AER cost pass-through
    applications as the primary risk management mechanism. Multiple DNSPs (AusNet,
    SAPN, Jemena, Endeavour Energy) raised this as a material regulatory issue in
    their regulatory proposals.
  lesson_learnt: Insurance market withdrawal from climate-driven natural hazard risks
    is accelerating, forcing DNSPs toward a reactive cost-recovery model (pass-through
    applications) rather than proactive resilience investment. Network businesses
    and their regulators should treat declining insurance availability as a signal
    to recalibrate efficient risk allocation and invest in proactive mitigation such
    as SAPS before self-insurance becomes the only remaining backstop.
