  source_title: Fairwater Living Lab Residential Heat Pump Study Annual Public Report
  publish_date: 2022-06
  project_name: Fairwater Living Laboratory
  what_happened: Urban heat island analysis found that Fairwater's light-coloured
    roofs (albedo ~0.24 vs ~0.12 for mature residential areas) compensated for very
    low vegetation cover (~0% trees at time of study) to produce surface urban heat
    island (SUHI) values comparable to the more vegetated but darker Blacktown residential
    area, delivering a 3–4°C surface temperature cooling effect.
  lesson_learnt: Light-coloured roofs can substitute for the cooling effect of mature
    trees in new residential precincts where tree planting has not yet matured; developers
    of greenfield sites should specify high-albedo roofing as a mandatory standard
    to offset the urban heat island penalty of low vegetation during the early years
    of a development.
