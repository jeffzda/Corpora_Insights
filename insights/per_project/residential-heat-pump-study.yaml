  what_happened: Outdoor park usage at Fairwater fell sharply when temperatures exceeded
    30°C, with minimal activity observed on summer days above that threshold. Activity
    was concentrated in the 7–11am and 5–10pm windows, and maximum visitor counts
    during summer weeks did not exceed 27–30% of the local Fairwater population.
  lesson_learnt: Outdoor community amenities in hot-climate precincts will be substantially
    underutilised in summer unless designed to mitigate heat stress; shading structures
    (trees, awnings, pergolas), water play features, and water fountains should be
    integrated from the outset to extend the usable temperature range and support
    the health and wellbeing outcomes that justify the land allocation.
