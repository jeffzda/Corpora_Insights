  what_happened: The study was unable to determine whether GSHP systems reduced waste
    heat contribution to the surface urban heat island effect, as the study design
    lacked on-ground air and surface temperature measurements at multiple sites with
    varying tree cover and albedo to build a proper predictive model.
  lesson_learnt: Future GSHP urban heat island studies should be designed with co-located
    reference and treatment site pairs at the same geographical setting, combined
    with on-ground air and surface temperature measurements, to isolate secondary
    SUHI influences such as waste heat reduction from GSHP; satellite-only analysis
    with a single site is insufficient for this purpose.
