  what_happened: The study found that 68% of Fairwater residents reported being more
    physically active since moving to the precinct, with 80%+ reporting improved health.
    The design and proximity of walkways and parklands to homes were the primary factors
    cited for increased physical activity, reinforcing that built environment design
    directly influences resident health outcomes.
  lesson_learnt: Allocating meaningful open space in master-planned precincts and
    designing walkways and parklands within easy walking distance of homes produces
    measurable health and wellbeing benefits for residents; developers and planners
    should treat accessible green amenity as a core performance metric alongside energy
    and environmental targets.
