  project_name: Fairwater Living Laboratory
  what_happened: Network benefits from GSHP-driven peak demand reduction (deferral
    of network augmentation, avoided RERT costs, reduced demand exceedance charges)
    were found to be greater than the direct electricity cost savings to individual
    residents. A single RERT event saving was calculated at $323 per home; deferral
    of network augmentation ranged from $347–$2,773 per home depending on location
    within the network.
  lesson_learnt: The commercial case for GSHP in residential precincts is stronger
    at the network level than at the individual household level; property developers
    and policymakers should negotiate with distribution network service providers
    to ensure network benefits are shared with developers and residents to improve
    the financial viability of GSHP deployment.
