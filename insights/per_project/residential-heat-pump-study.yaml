  what_happened: The current configuration of smart metering in Australia obscures
    the solar PV contribution (the 'solar shadow'), making it very difficult to conduct
    meaningful analysis of energy consumption patterns for solar homes using standard
    network meter data. The study had to exclude solar homes from key comparative
    analyses.
  lesson_learnt: Future residential energy studies and network planning tools require
    detailed end-use sub-metering that separates solar generation, battery, and consumption
    flows; the solar shadow in current smart meter configurations prevents meaningful
    research on solar households and should be addressed through meter configuration
    standards before large-scale residential renewable deployments.
