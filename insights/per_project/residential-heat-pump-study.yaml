- record_id: ARENA-DLV-54356
  source_title: Fairwater Living Lab Residential Heat Pump Study Annual Public Report
  publish_date: 2022-06
  project_name: Fairwater Living Laboratory
  what_happened: Installing larger solar PV systems did not increase the amount of
    solar energy used on-site. Analysis showed that households with large PV capacities
    achieved lower self-consumption ratios and higher grid export, because peak solar
    generation occurred in the middle of the day when household energy demand was
    lowest.
  lesson_learnt: For residential households with GSHP or high morning/evening demand
    peaks, oversizing the solar PV system is counterproductive; a better strategy
    is to match a smaller PV system with battery storage, or to automate appliances
    to shift load to solar generation hours, rather than simply maximising installed
    PV capacity.
