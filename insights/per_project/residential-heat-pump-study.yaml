  what_happened: A significant absence of adequate monitored benchmarks for residential
    air-conditioning energy consumption in Australia was identified, making it difficult
    to isolate the contribution of GSHP versus building envelope and behavioural factors.
    The study was unable to survey conditioned floor area from de-identified smart
    meter data, meaning energy comparisons were conservative.
  lesson_learnt: Australia lacks standardised sub-metered energy benchmarks for residential
    air-conditioning end-uses; future living laboratory studies should mandate collection
    of conditioned floor area, demographic data, and appliance sub-metering alongside
    smart meter data to enable meaningful comparative analysis and reduce confounding
    factors.
