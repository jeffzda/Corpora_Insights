  source_title: Fairwater Living Lab Residential Heat Pump Study Annual Public Report
  publish_date: 2022-06
  project_name: Fairwater Living Laboratory
  what_happened: Despite Fairwater being marketed as a sustainable transport precinct
    and having below-average car ownership (1.2 per household vs Sydney metro average
    of 1.7), 52% of residents used private or shared cars as their primary transport
    mode. Residents cited the 1.6km distance to Blacktown Train Station as too far
    to walk and sought better bus connectivity.
  lesson_learnt: Sustainable transport intentions in master-planned precincts fail
    to change travel behaviour unless public transport connectivity is genuinely convenient;
    developers must collaborate with local and state government to deliver bus links
    to nearby rail stations before occupation, as building the precinct without functional
    last-mile connections entrenches car dependency.
