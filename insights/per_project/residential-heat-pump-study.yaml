  source_title: Fairwater Living Lab Residential Heat Pump Study Annual Public Report
  publish_date: 2022-06
  project_name: Fairwater Living Laboratory
  what_happened: Ground source heat pump (GSHP) air-conditioning installed at precinct
    scale across 800 homes at Fairwater consumed 21% less electrical energy (normalised
    for house size) than comparable homes with conventional reverse-cycle air-conditioning
    in North Kellyville over a 24-month study period.
  lesson_learnt: GSHP air-conditioning delivers a measurable ~21% reduction in household
    electricity consumption compared to conventional reverse-cycle systems in Australian
    residential settings; this benefit is best realised when deployed at precinct
    scale where economies of scale reduce installation cost to approximately 1.2%
    of construction cost.
