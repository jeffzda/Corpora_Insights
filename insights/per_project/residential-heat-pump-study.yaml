- record_id: ARENA-DLV-54358
  source_title: Fairwater Living Lab Residential Heat Pump Study Annual Public Report
  publish_date: 2022-06
  project_name: Fairwater Living Laboratory
  what_happened: Seamless ducted integration of GSHP air-conditioning — indistinguishable
    from conventional systems by residents — led to over-reliance on AC year-round,
    with standby power for the always-energised system representing 7% of total electricity
    consumption and 18% of AC energy.
  lesson_learnt: Designing high-efficiency AC as a seamless, always-on system removes
