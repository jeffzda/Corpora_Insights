- record_id: ARENA-DLV-54370
  source_title: Fairwater Living Lab Residential Heat Pump Study Annual Public Report
  publish_date: 2022-06
  project_name: Fairwater Living Laboratory
  what_happened: The study found that synchronisation of occupant routines across
    the Fairwater precinct — particularly turning on AC when returning home in the
    late afternoon — produced significant aggregated peak demand events that exposed
    the distribution network to high load, despite each individual home's demand being
    relatively modest.
  lesson_learnt: Precinct-level energy planning must model demand aggregation from
    synchronised occupant routines, not just individual household peaks; load management
    strategies (automated pre-conditioning, time-of-use tariffs, home energy management
    systems) should be designed into precinct infrastructure to flatten the aggregated
    demand profile created by common daily behaviour patterns.
