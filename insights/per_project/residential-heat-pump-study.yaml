  project_name: Fairwater Living Laboratory
  what_happened: Residents reported using a range of non-energy-intensive strategies
    to maintain thermal comfort — adjusting clothing, using fans, adjusting food and
    drink, and opening/closing blinds — ranking the GeoAir system only 4th on average
    across both summer and winter, indicating that passive and low-energy strategies
    remain the first resort for most occupants.
  lesson_learnt: Occupants naturally prefer low-energy comfort strategies before activating
    GSHP systems; designers should reinforce this hierarchy through home design features
    (ceiling fans, operable shading, cross-ventilation) and user interfaces that make
    passive strategies more convenient and visible, to maximise the fraction of comfort
    hours achieved without mechanical conditioning.
