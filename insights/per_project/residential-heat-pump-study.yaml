- record_id: ARENA-DLV-54355
  source_title: Fairwater Living Lab Residential Heat Pump Study Annual Public Report
  publish_date: 2022-06
  project_name: Fairwater Living Laboratory
  what_happened: Self-consumption (fraction of generated solar used on-site) and self-sufficiency
    (fraction of consumption supplied by solar) for solar PV homes at Fairwater were
    almost always below 50%. This was driven by oversized PV systems relative to on-site
    demand, high electricity usage during non-sunshine hours, and absence of on-site
    battery storage.
  lesson_learnt: Solar PV systems in residential settings should be sized to maximise
    self-consumption rather than maximise generation capacity; installing larger systems
    does not increase the proportion of solar energy used on-site and without battery
    storage, oversized systems primarily export surplus to the grid, contributing
    to the duck curve.
