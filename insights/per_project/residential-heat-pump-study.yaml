    engagement and data collection over a three-year period by leveraging Frasers
    Property's existing community liaison personnel, who maintained ongoing relationships
    with residents. This enabled access to occupants for surveys, monitoring, and
    feedback studies at a scale and depth not previously achieved in an Australian
    residential setting.
