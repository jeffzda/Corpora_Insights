  what_happened: At Fairwater, around 30% of study households reported dissatisfaction
    with thermal conditions in summer and winter when air-conditioning was not in
    use, even though homes met the 2014 National Construction Code requirements. Residents
    showed reluctance to open windows due to noise, dust, and security concerns, limiting
    passive cooling strategies.
  lesson_learnt: NCC-compliant building envelopes do not guarantee occupant thermal
    comfort in the absence of active conditioning in hot climates; future residential
    developments should increase stringency for building envelope performance and
    air-tightness beyond code minimum, and design for passive strategies (fly screens,
    shading devices, ceiling fans) that address the specific barriers — noise, dust,
    security — that discourage occupants from using natural ventilation.
