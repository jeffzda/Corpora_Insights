- record_id: ARENA-DLV-54352
  source_title: Fairwater Living Lab Residential Heat Pump Study Annual Public Report
  publish_date: 2022-06
  project_name: Fairwater Living Laboratory
  what_happened: GSHP systems reduced the rate at which demand increased with extreme
    temperatures compared to conventional air-conditioning, with demand growth per
    degree of deviation from comfortable temperatures dropping from 6–11% (conventional)
    to 4.5–9% in hot weather, and from 3.5–9% to 2–6% in cold weather. The compounding
    nature of this difference meant savings at 42°C were more than triple those at
    30°C.
  lesson_learnt: GSHP air-conditioning provides disproportionately larger network
    benefits during extreme temperature events; planners and network service providers
    should model GSHP's compounding demand-reduction effect when assessing network
    augmentation deferral value, particularly in regions like Western Sydney experiencing
    increasing frequency of extreme heat.
