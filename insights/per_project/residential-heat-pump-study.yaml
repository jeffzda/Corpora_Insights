  what_happened: GSHP installation at Fairwater cost approximately $5,000 more per
    home than conventional reverse-cycle air-conditioning, representing only 1.2%
    of average construction cost of a 3-bedroom home. This cost was only achievable
    because the system was installed at precinct scale integrated into the developer's
    workflow from project inception.
