  what_happened: 'The study found that solar PV generation and air-conditioning demand
    were temporally misaligned: in winter, GSHP demand peaked in the morning and late
    afternoon when solar was not generating, resulting in these high-demand periods
    being fully serviced by the distribution network despite sufficient daily solar
    generation capacity to theoretically meet AC demand.'
