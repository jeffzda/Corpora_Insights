  source_title: Fairwater Living Lab Residential Heat Pump Study Annual Public Report
  publish_date: 2022-06
  project_name: Fairwater Living Laboratory
  what_happened: The study design used a comparison between Fairwater and the separate
    suburb of North Kellyville rather than a controlled split within a single development,
    introducing potential confounding from demographic differences, unknown rates
    of other heating systems, and occupancy variation that could not be eliminated.
  lesson_learnt: Future GSHP residential trials should use a single development site
    with approximately equal proportions of GSHP, alternative heat pump, and conventional
    AC homes, each with sub-metered end-use data, to provide a clean baseline-and-treatment
    comparison that eliminates geographic and demographic confounding inherent in
    cross-suburb studies.
