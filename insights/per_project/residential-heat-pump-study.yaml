  project_name: Fairwater Living Laboratory
  what_happened: For homes transitioning to all-electric (removing gas cooktops and
    hot water), modelling showed that under the current level of electricity consumption
    seen in solar PV homes and current NSW grid emission factors, the existing PV
    configuration would barely break even energetically, leaving no surplus capacity
    for EVs or other emerging loads.
  lesson_learnt: Full residential electrification pathways must be modelled holistically
    at the time of PV system design; sizing PV only against current loads without
    accounting for future electrification of gas appliances and EV charging will leave
    homes grid-dependent and undermine net-zero objectives, requiring costly system
    upgrades later.
