- record_id: ARENA-DLV-8953
  source_title: Coober Pedy Renewable Hybrid Project – Lessons Learned Report
  publish_date: '2023-01-31'
  project_name: Coober Pedy Renewable Hybrid Project
  what_happened: Local contractors could not take on large lump-sum work packages
    (e.g., wind turbine foundations, full power station refurbishment) due to capability
    constraints, limiting local labour utilisation when work was structured as large
    single packages.
  lesson_learnt: Break large work packages into discrete, smaller components tailored
    to local contractor capabilities and be flexible in allocating packages — this
    approach enabled approximately 17% of site-based labour hours to be provided by
    local personnel on a remote, technically complex hybrid project.
