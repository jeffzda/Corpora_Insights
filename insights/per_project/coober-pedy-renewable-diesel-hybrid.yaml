- record_id: ARENA-DLV-8951
  source_title: Coober Pedy Renewable Hybrid Project – Lessons Learned Report
  publish_date: '2023-01-31'
  project_name: Coober Pedy Renewable Hybrid Project
  what_happened: Negotiating contracts across five key stakeholders (EDL, ARENA, SAG,
    DCCP, suppliers) proved complex because parties initially lacked common baseline
    assumptions on diesel prices, LGCs, inflation, and the renewable energy fraction,
    requiring additional alignment work before execution.
  lesson_learnt: Before executing contracts for multi-stakeholder hybrid projects
    with novel commercial structures, explicitly agree and document common baseline
    assumptions for all material commercial variables (fuel prices, certificate values,
    inflation, performance guarantees) to ensure equitable outcomes and avoid renegotiation.
  issue_severity: moderate
