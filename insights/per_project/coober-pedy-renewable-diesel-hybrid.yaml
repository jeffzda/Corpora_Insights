  source_title: Coober Pedy Renewable Hybrid Project – Lessons Learned Report
  publish_date: '2023-01-31'
  project_name: Coober Pedy Renewable Hybrid Project
  what_happened: Under a split-contractor model, individual HAZOP sessions were conducted
    per supplier scope rather than as an integrated cross-contractor session, creating
    risk that interface-level hazards between systems would not be holistically identified.
  lesson_learnt: When using a split-contractor delivery model on a hybrid project,
    mandate a common integrated HAZOP across all relevant parties rather than scope-by-scope
    HAZOPs — interface-only HAZOPs are more complex and risk missing hazards that
    only emerge at the intersections of multiple contractor systems.
