- record_id: ARENA-DLV-60314
  source_title: Coober Pedy Hybrid Renewable Project Second Year Performance Report
  publish_date: '2019'
  project_name: Coober Pedy Hybrid Renewable Project
  what_happened: Solar output was curtailed for 54% of daytime periods in FY19 (up
    from 39% in FY18), as solar is preferentially curtailed over wind due to its ability
    to respond to setpoint changes within seconds. Performance ratio measurement is
    therefore biased toward non-curtailed periods (mornings, evenings, winter), likely
    overestimating true annual uncurtailed PR.
  lesson_learnt: In hybrid systems where solar is preferentially curtailed, performance
    ratio calculations restricted to non-curtailed periods will overestimate annual
    solar performance — performance assessment methodology should explicitly account
    for the selection bias introduced by curtailment patterns.
  issue_severity: minor
  project_type: multi-technology/hybrid
