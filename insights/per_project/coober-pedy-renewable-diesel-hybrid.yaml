  failure_mode: coordination & stakeholders
  outcome_class: delayed but recoverable
  secondary_failure_mode: commercial & market
  intervention_note: EDL worked to establish agreed common baseline assumptions across
    all parties before contract execution, ultimately securing aligned long-term commercial
    terms.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: hybrid systems
  source_pages: &id001
  - 6
  evidence_excerpt: To ensure that the process resulted in equitable outcomes for
    all parties, common baseline assumptions needed to be agreed for key items such
    as diesel prices, large scale generation certificates (LGCs), inflation and the
    renewable energy fraction / guarantee.
