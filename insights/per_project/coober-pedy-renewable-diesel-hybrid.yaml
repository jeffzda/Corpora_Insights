  project_name: Coober Pedy Hybrid Renewable Project
  what_happened: The project achieved zero-diesel operations (ZDO) for 52% of time
    in FY2019, meeting the design target of >50%, and maintained an unplanned outage
    record better than the pre-hybrid diesel-only baseline (2 outages totalling 0.52
    hours in FY19 vs a pre-hybrid average of 4.3 outages and 2.9 hours per year).
  lesson_learnt: A well-designed advanced hybrid control system with appropriate enabling
    technologies (DUPS, BESS, dynamic resistors) can achieve high renewable penetration
    in a remote off-grid setting without sacrificing power reliability — the combination
    of enabling technologies provides effective system-level redundancy even without
    individual component redundancy.
