  project_name: Coober Pedy Hybrid Renewable Project
  what_happened: The solar resource during the feasibility study was estimated using
    satellite-based data with no site-based monitoring available, and actual FY19
    GHI irradiance was 8% above design estimates. The three on-site irradiance measurement
    devices installed at commissioning delivered high-quality data (99.4% availability)
    validating actual performance.
  lesson_learnt: For remote solar projects where site-based measurement data is unavailable
    at feasibility, satellite-derived irradiance estimates should be treated as indicative
    — install site-specific irradiance monitoring early (ideally during site investigation)
    to reduce resource uncertainty and support accurate performance benchmarking post-commissioning.
