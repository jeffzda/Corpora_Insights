  source_title: Coober Pedy Renewable Hybrid Project – Lessons Learned Report
  publish_date: '2023-01-31'
  project_name: Coober Pedy Renewable Hybrid Project
  what_happened: Subcontractor staff were absent from critical design reviews for
    the BESS and PV inverters, due to contractor pushback and EDL's limited prior
    knowledge of the detailed systems, resulting in technical gaps that required rework
    on site.
  lesson_learnt: Explicitly define in EPC contracts the design review requirements
    including which personnel and subcontractors must attend each review — failure
    to include subcontractors at critical reviews leads to technical gaps and on-site
    rework, particularly for BESS and inverter interfaces.
