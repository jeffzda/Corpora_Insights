  source_title: Coober Pedy Hybrid Renewable Project Second Year Performance Report
  publish_date: '2019'
  project_name: Coober Pedy Hybrid Renewable Project
  what_happened: The hybrid control system required a tuning period during the initial
    three-month settling period (July–September 2017) to achieve stable and robust
    operation. No further changes were made to control logic during FY19, but ongoing
    review was flagged to assess whether further fine-tuning could increase RE utilisation.
  lesson_learnt: Advanced hybrid control systems for off-grid renewable projects should
    budget for a dedicated settling/tuning period after commissioning — control logic
    optimisation is an iterative process and initial commercial operations targets
    should reflect reduced penetration during this period.
