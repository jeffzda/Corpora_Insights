  secondary_failure_mode: null
  intervention_note: EDL, Senvion, and UGL broke large packages into discrete components,
    allowing local contractors and labourers to provide services, labour, and materials
    on a satisfactory basis.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hybrid systems
  source_pages: &id003
