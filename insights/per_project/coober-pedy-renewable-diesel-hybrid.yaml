- record_id: ARENA-DLV-8956
  source_title: Coober Pedy Renewable Hybrid Project – Lessons Learned Report
  publish_date: '2023-01-31'
  project_name: Coober Pedy Renewable Hybrid Project
  what_happened: Responsibility for developing the overall control system architecture
    was initially assigned to the balance-of-plant contractor, but during delivery
    it became clear the BoP contractor lacked full visibility over all work packages,
    creating coordination risks across all sub-contractors on communication protocols,
    interface points, hardware, and physical locations.
  lesson_learnt: Assign overall control system architecture responsibility to a single
    party that has full visibility and control over all project components — on a
    hybrid project, the project owner is best placed to develop and implement this
    architecture, and this responsibility must be clearly defined at the start of
    delivery to mitigate schedule risk.
  issue_severity: moderate
  project_type: multi-technology/hybrid
  project_scale_band: first commercial/FOAK
  lifecycle_phase: construction/installation
  proponent_type: project developer
  delay_category: commissioning/integration
  failure_mode: coordination & stakeholders
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated integration
  intervention_note: EDL took on control system architecture responsibility internally,
    ensuring all sub-contractors conformed to a single architecture and providing
    greater control over this critical component, mitigating potential schedule risks.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hybrid systems
  source_pages: &id006
  - 8
  evidence_excerpt: By EDL taking on this responsibility and developing the control
    system architecture internally, we could ensure all sub-contractors conformed
    to it. Ultimately, it meant we had greater control over this critical component
    of the project and mitigated potential schedule risks.
