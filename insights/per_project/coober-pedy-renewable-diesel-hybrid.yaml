  source_title: Coober Pedy Hybrid Renewable Project Second Year Performance Report
  publish_date: '2019'
  project_name: Coober Pedy Hybrid Renewable Project
  what_happened: Solar PV availability was approximately 91% against the 95% design
    expectation, primarily due to the two inverter stack failures. Despite below-design
    availability, the overall renewable energy contribution was not materially impacted
    because wind generation was available to compensate during both outage periods.
  lesson_learnt: For remote hybrid projects, inverter warranty coverage is essential
    but insufficient on its own — the logistics of getting technicians and parts to
    remote sites means even warranty-covered failures take weeks to resolve; plan
    for extended outage durations and hold critical spare parts on-site.
  issue_severity: moderate
