  publish_date: '2013-03-20'
  project_name: 'Biofuel from Microalgae: Efficient Separation, Processing and Utilisation
    of Algal Biomass'
  what_happened: The economic assessment produced a broad range of potential returns
    on investment depending on process and external market factors, and identified
    the market price of protein feed co-product as one of the most important variables
    — yet no defined market for algal protein feed existed, leaving the economic case
    highly uncertain.
  lesson_learnt: When biodiesel economics depend critically on co-product revenue
    (e.g. protein feed), the absence of an established market for that co-product
    must be treated as a primary project risk; future projects should conduct market
    analysis for co-products before committing to a process design that relies on
    them for viability.
