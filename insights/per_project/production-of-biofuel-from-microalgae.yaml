- record_id: ARENA-DLV-59456
  source_title: 'Biofuel from Microalgae: Efficient Separation, Processing and Utilisation
    of Algal Biomass'
  publish_date: '2013-03-20'
  project_name: 'Biofuel from Microalgae: Efficient Separation, Processing and Utilisation
    of Algal Biomass'
  what_happened: The marginal economic assessment concluded that the viability of
    the microalgal biodiesel process is highly dependent on external market factors,
    and that in the short term the process would require production of a higher-value
    co-product such as omega-3 fatty acids to be commercially viable — a co-product
    pathway the project had not been designed to optimise.
  lesson_learnt: Early-stage biofuel R&D projects with marginal economics should explicitly
    design for high-value co-product pathways (e.g. omega-3s) from the outset, rather
    than treating them as post-hoc modifications, as the co-product premium may be
    the primary commercial enabler at current commodity prices.
  issue_severity: major
  project_type: null
  project_scale_band: demonstration
  lifecycle_phase: concept/feasibility
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: commercial & market
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: The report noted that the process had been designed such that
    it could be modified to include omega-3 production, and recommended this as the
    priority pathway for future development.
  transferability: moderate
