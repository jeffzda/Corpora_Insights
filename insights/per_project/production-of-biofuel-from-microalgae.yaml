- record_id: ARENA-DLV-59455
  source_title: 'Biofuel from Microalgae: Efficient Separation, Processing and Utilisation
    of Algal Biomass'
  publish_date: '2013-03-20'
  project_name: 'Biofuel from Microalgae: Efficient Separation, Processing and Utilisation
    of Algal Biomass'
  what_happened: The project found that the flow properties (rheology) of the algal
    biomass paste vary with species and significantly affect process efficiency, and
    that the process could handle 20–25% w/w solids — higher than the original 15–20%
    design target — reducing volumes and improving efficiency.
  lesson_learnt: When designing microalgal processing systems, characterise the flow
    properties of the biomass paste for the specific species to be used — paste rheology
    varies between species and directly affects achievable solids concentration and
    process efficiency, and targeting higher solids concentrations than conventional
    assumptions can substantially reduce processing volumes.
