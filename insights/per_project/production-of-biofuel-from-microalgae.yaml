- record_id: ARENA-DLV-59451
  source_title: 'Biofuel from Microalgae: Efficient Separation, Processing and Utilisation
    of Algal Biomass'
  publish_date: '2013-03-20'
  project_name: 'Biofuel from Microalgae: Efficient Separation, Processing and Utilisation
    of Algal Biomass'
  what_happened: At project outset there was no clear method available for downstream
    processing of microalgal biomass that was ready for commercial-scale implementation,
    and insufficient information to evaluate the economics of such a process. The
    project developed and demonstrated a lab-scale two-step cell disruption and wet
    hexane extraction process, but concluded that further refinement, scale-up, and
    additional R&D would be required before commercial viability could be established.
  lesson_learnt: For early-stage bioenergy R&D projects, explicitly scope the gap
    between lab/pilot demonstration and commercial readiness at the outset — marginal
    economics and unresolved scale-up challenges mean a successful lab demonstration
    does not translate directly to commercial deployment without multiple further
    R&D and demonstration stages.
