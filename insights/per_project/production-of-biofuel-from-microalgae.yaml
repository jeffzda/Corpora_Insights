- record_id: ARENA-DLV-59454
  source_title: 'Biofuel from Microalgae: Efficient Separation, Processing and Utilisation
    of Algal Biomass'
  publish_date: '2013-03-20'
  project_name: 'Biofuel from Microalgae: Efficient Separation, Processing and Utilisation
    of Algal Biomass'
  what_happened: The project demonstrated that cell disruption is a necessary step
    to achieve effective lipid extraction from wet algal paste, and developed a low-cost
    two-stage cell disruption method that was found to be highly effective and reliable,
    representing a significant reduction in processing costs.
  lesson_learnt: Cell disruption is a non-negotiable prerequisite for efficient lipid
    extraction from wet microalgal paste; future process designs should incorporate
    a low-cost two-stage mechanical disruption method rather than relying on solvent
    alone, to maximise yield and reduce overall processing cost.
