- record_id: ARENA-DLV-59453
  source_title: 'Biofuel from Microalgae: Efficient Separation, Processing and Utilisation
    of Algal Biomass'
  publish_date: '2013-03-20'
  project_name: 'Biofuel from Microalgae: Efficient Separation, Processing and Utilisation
    of Algal Biomass'
  what_happened: Heat-driven drying technologies such as spray drying were found to
    require too much energy to be feasible for de-lipidated algal biomass. Solar drying
    was identified as a more sustainable alternative but the rate of drying and handling
    the stickiness of the paste remained unresolved technical challenges at project
    close.
  lesson_learnt: Drying is a critical and often underestimated processing step in
    microalgal biofuel pathways — energy-intensive drying technologies will make the
    process uneconomic, and solar drying alternatives require dedicated R&D into paste
    handling and drying rate before they can be confidently specified for scale-up.
