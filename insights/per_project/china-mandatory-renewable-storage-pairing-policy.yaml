- record_id: ARENA-DLV-16268
  source_title: Energy Storage Study
  publish_date: 2015-07
  project_name: China Mandatory Renewable-Storage Pairing Policy
  what_happened: China implemented a policy directive requiring intermittent generators
    to pair their installations with energy storage as a grid-connection requirement,
    sized at 14% of installed generation capacity. The policy was assessed as potentially
    expensive and inefficient due to its untargeted nature and the risk of unutilised
    storage capacity where storage did not add economic value.
  lesson_learnt: Mandatory across-the-board storage pairing requirements can result
    in widespread uneconomic storage installations; targeted approaches that identify
    where storage delivers the highest marginal value are more efficient than blanket
    mandates applied to all renewable generators regardless of grid context.
