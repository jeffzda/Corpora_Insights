  evidence_excerpt: The policy of mandatory pairing of generation systems with storage
    appears ambitious, expensive and potentially inefficient due to the untargeted
    nature of the rollout and a risk of unutilised storage capacity. It is noted that
    for most systems, the installation of storage will deliver very poor economic
    returns as the storage system may not provide additional revenue for the generator.
