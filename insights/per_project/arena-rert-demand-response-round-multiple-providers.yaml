  evidence_excerpt: One of the learnings observed by almost all RERT participants
    was that they needed to be significantly 'over-contracted' to meet demand flexibility
    targets. Buffers of 20-30 per cent were observed as necessary to meet contractual
    requirements. Consequently, diversity in demand portfolios beyond large customers
    and across sectors is essential for delivery of demand flexibility contractual
    requirements.
