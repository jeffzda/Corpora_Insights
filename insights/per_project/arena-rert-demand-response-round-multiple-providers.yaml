- record_id: ARENA-DLV-53862
  source_title: Demand Flexibility Portfolio Retrospective Analysis Report
  publish_date: 2023-07
  project_name: ARENA RERT Demand Response Round (multiple providers)
  what_happened: All RERT participants reported 'below-target' results in early periods
    due to unexpected site issues (fire, staffing turnover, holiday periods, operational
    conflicts), and found they needed to over-contract by 20–30% buffers above their
    contractual targets to meet delivery requirements.
  lesson_learnt: Demand flexibility aggregators targeting contractual RERT commitments
    should over-contract their portfolio by at least 20–30% and actively diversify
    across sectors and customer sizes; operational disruptions are sufficiently frequent
    and varied that a lean portfolio will systematically under-deliver against contractual
    obligations.
