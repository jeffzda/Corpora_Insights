- record_id: ARENA-DLV-30316
  source_title: Project Converge - Final Report
  publish_date: 2024-05
  project_name: Project Converge
  what_happened: Technology performance issues with behind-the-meter DER devices —
    including inverter underperformance, inadvertent internet disconnections, and
    network supply quality problems — often went undetected for extended periods by
    both householders and organisations. One householder described taking a year to
    learn the normal pattern of their battery's behaviour, indicating long lag times
    before anomalies are identified. Another identified a network issue only because
    she had been watching her CER closely.
  lesson_learnt: DER grid-integration programs must include systematic, interval-based
    technology performance monitoring — covering inverter function, connectivity,
    and network supply quality — with clear organisational responsibility for acting
    on alerts. Relying on householders to self-report or detect faults is unreliable
    and results in prolonged, undetected underperformance.
