- record_id: ARENA-DLV-26454
  source_title: Project Converge - Final Technical Report
  publish_date: 2024-03
  project_name: Project Converge
  what_happened: Envelope compliance violations occurred regularly during the trials.
    Aggregators provided point-value reservation forecasts 15 minutes ahead of each
    dispatch interval rather than interval (uncertainty-bounded) forecasts, meaning
    the SOE engine calculated envelopes without any awareness of forecast uncertainty.
    Customers were consequently exposed to envelopes they could not physically comply
    with.
  lesson_learnt: Aggregators should provide reservation forecasts as uncertainty intervals
    rather than point values — interval forecasts allow the SOE engine to set envelopes
    that account for forecast error, significantly reducing non-compliant envelope
    violations; mandating or incentivising interval reservations should be built into
    future SOE/DOE trial designs.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated integration
  intervention_note: The Converge API was designed to accept interval reservations
    and the SOE engine could factor uncertainty into envelope calculations, but aggregators
    elected not to use this functionality during the trials.
  transferability: moderate
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id039
  - 24
