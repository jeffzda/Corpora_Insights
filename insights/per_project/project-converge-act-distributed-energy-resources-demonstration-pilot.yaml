- record_id: ARENA-DLV-9654
  source_title: 'Social Science Report 1: Intermediary Insights on Dynamic and Shaped
    Operating Envelopes'
  publish_date: 2023-05
  project_name: Project Converge
  what_happened: DOEs were found to still be based on worst-case scenario calculations
    in many cases due to high unpredictability in energy use, resulting in DOE limits
    that were smaller than actual network capacity — meaning the technology's primary
    benefit of improving capacity utilisation was not being fully realised in practice.
  lesson_learnt: When deploying DOE systems, invest in improving forecast accuracy
    and real-time data inputs; conservative worst-case allocation undermines the core
    value proposition of DOEs over static envelopes and may reduce stakeholder support
    for the technology.
