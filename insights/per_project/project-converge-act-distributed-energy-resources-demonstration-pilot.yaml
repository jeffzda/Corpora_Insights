  source_title: 'Shaped Operating Envelopes: Technical Design and Implementation Report'
  publish_date: 2023-02
  project_name: Project Converge
  what_happened: The concentration of controllable DER across the trial network was
    too low and too dispersed for the live trials to demonstrate the intended use
    cases effectively; few residential customers with rooftop solar were equipped
    or connected for on-call curtailment, and battery systems ready for control were
    similarly sparse and geographically spread.
  lesson_learnt: DER trial design should assess the minimum density and connectivity
    of controllable DER required to demonstrate each use case before committing to
    specific trial feeders and customer cohorts — a low and dispersed controllable
    DER base will prevent observable network impacts and limit the trial's ability
    to validate the technology's core value proposition.
