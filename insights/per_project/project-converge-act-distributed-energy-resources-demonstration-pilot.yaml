  source_title: 'Shaped Operating Envelopes: Technical Design and Implementation Report'
  publish_date: 2023-02
  project_name: Project Converge
  what_happened: 'The SOE economic benefit over DOE was negligible at low DER penetration
    (P33B0: 33% PV) but increased significantly at high penetration levels (P80B40:
    80% PV, 40% battery), with the SOE gain percentage rising materially as DER density
    increased, demonstrating that the additional complexity of SOEs over simpler DOEs
    only becomes economically justified at higher penetration levels.'
  lesson_learnt: When selecting between DOE and SOE frameworks for network capacity
    management, consider current DER penetration levels — SOEs deliver negligible
    economic benefit over DOEs at low penetration but become materially superior at
    high penetration, so a staged transition from DOE to SOE as DER uptake grows is
    preferable to immediate SOE deployment in low-penetration areas.
