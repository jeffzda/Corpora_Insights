  source_title: Project Converge - Final Report
  publish_date: 2024-05
  project_name: Project Converge
  what_happened: One aggregator's recruitment for the householder interview component
    of the social research generated strong responses (200+ email invitations sent
    with reasonable uptake), while the other aggregator sent an unknown but small
    number of invitations and received only three responses. This asymmetry meant
    the majority of householder interview participants came from one aggregator, limiting
    the representativeness of findings across both aggregator models.
  lesson_learnt: When designing multi-aggregator trials with embedded social research,
    negotiate minimum recruitment contribution commitments from each aggregator as
    part of the project agreement. Uneven recruitment effort across partners skews
    qualitative findings and reduces the ability to compare outcomes across different
    commercial models.
