  what_happened: The RT RIT-D toolbox analysis of ACT MV-LV feeders showed that recruiting
    DER owners to provide voltage regulation services is dramatically more cost-effective
    than installing OLTC transformers. In the most demanding scenario (P33B5EV5),
    DER recruitment over 30 years costs AUD 27,250 NPV versus AUD 1,962,000 for OLTC
    transformer installation — an avoided cost of AUD 1,934,750.
  lesson_learnt: DSOs should use real-time RIT-D analysis tools to quantify DER-based
    network support against traditional augmentation costs before committing to network
    investment — the analysis shows DER recruitment can be more than 70 times cheaper
    than OLTC transformer installation in NPV terms, and DER owners can be recruited
    far faster than network augmentation can be delivered.
