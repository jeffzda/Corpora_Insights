  what_happened: Because the Converge trial was structured as a niche test rather
    than a commercial deployment, certain key system elements — including changes
    to participant retail contracts, participation in energy markets, and connection
    agreements — could not be modified as part of the project. This constrained the
    extent to which SOE interactions with market participation could be tested.
