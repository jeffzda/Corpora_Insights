- record_id: ARENA-DLV-28855
  source_title: Project Converge ACT - Distributed Energy Resources Pilot - Final
    knowledge sharing report
  publish_date: 2024-03
  project_name: Project Converge ACT
  what_happened: Onboarding the two aggregators required lengthy, bespoke negotiation
    of network support contracts. There was no existing standard framework governing
    the DNSP–aggregator relationship for SOEs, making each agreement time-consuming
    and unique to the trial.
  lesson_learnt: Before scaling SOEs or similar DNSP–aggregator coordination mechanisms,
    industry must develop standardised contractual and operational frameworks for
    the DNSP–aggregator relationship; bespoke trial agreements are not a credible
