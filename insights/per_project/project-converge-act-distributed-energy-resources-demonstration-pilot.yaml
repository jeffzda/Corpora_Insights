  source_title: Project Converge - Final Knowledge Sharing - Public Webinar
  publish_date: 2024-03
  project_name: Project Converge
  what_happened: Offline simulations showed that under current DER penetration (25%
    PV / 2% battery), Fixed Operating Envelopes (FOEs) produce thousands of violations
    and transformer overloads reaching up to 300% of rated capacity, with violations
    worsening significantly at medium (40% PV / 20% battery) and high (60% PV / 40%
    battery) DER penetration.
  lesson_learnt: Network planners should treat Fixed Operating Envelopes as inadequate
    for DER penetration levels above 25% PV — simulation evidence from Converge demonstrates
    that FOEs produce escalating voltage violations and transformer overloads at medium
    and high DER scenarios, making dynamic or shaped envelopes a necessary investment
    as DER penetration grows.
