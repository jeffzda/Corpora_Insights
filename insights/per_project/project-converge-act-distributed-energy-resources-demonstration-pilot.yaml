  what_happened: Reliable phasing data for LV distribution network customers was unavailable,
    forcing the project to adopt a simplified balanced single-phase equivalent network
    model rather than the full three-phase model. This reduced modelling accuracy
    for LV network behaviour.
  lesson_learnt: The absence of reliable LV phasing data is a known systemic issue
    in Australian distribution networks that limits the accuracy of power flow models
    underpinning SOEs and DOEs — DSOs should prioritise capturing and maintaining
    LV phasing data as a foundational data infrastructure investment to support future
    DER orchestration programs.
