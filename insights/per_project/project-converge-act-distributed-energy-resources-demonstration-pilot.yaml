  what_happened: The Converge trial confirmed that self-consumption is the primary
    reason battery owners purchase and retain home battery systems, and this value
    directly conflicted with the SOE engine's ability to dispatch network support.
    The strong alignment of the 'includes zero' design decision with participant values
    was validated by social research.
  lesson_learnt: DER grid services trials must explicitly account for the self-consumption
    preference of battery owners when scoping grid benefit expectations; algorithms
    that override self-consumption will face consumer resistance and reduced uptake,
    requiring either consumer incentives or alternative technical approaches.
