- record_id: ARENA-DLV-30305
  source_title: Project Converge - Final Report
  publish_date: 2024-05
  project_name: Project Converge
  what_happened: 'The two aggregators participating in the Converge trial used substantially
    different approaches to engage their customers: one used an opt-in model and the
    other an opt-out model. They also used different payment structures — one paid
    $1/kWh of battery behaviour change (median payment ~$2.55), while the other paid
    a flat $200 regardless of actual response. This resulted in highly variable financial
    outcomes and levels of participant engagement across the trial.'
  lesson_learnt: Where multiple aggregators are involved in a grid-integration trial,
    standardise the minimum conditions of participation (opt-in vs opt-out approach
    and remuneration structure) or explicitly design the variation as a comparative
    experiment with adequate sample sizes in each arm. Uncoordinated variation makes
