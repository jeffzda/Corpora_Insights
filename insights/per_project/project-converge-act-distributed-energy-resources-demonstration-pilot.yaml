    should document the cybersecurity architecture choices that are trial-specific
    and would not scale to direct device-to-server communication — IP whitelisting
    of known aggregator ranges is not a viable production control at scale and must
    be replaced by a more robust approach before any commercial deployment involving
    direct device connectivity.
