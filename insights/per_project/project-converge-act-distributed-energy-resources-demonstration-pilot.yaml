  source_title: Project Converge - Final Report
  publish_date: 2024-05
  project_name: Project Converge
  what_happened: Householders with existing, longer-term aggregator relationships
    were relatively comfortable with the addition of SOE functionality to their existing
    aggregation service, in part because the SOE impact on their batteries was small
    and because they had already developed trust in their aggregator over time. In
    contrast, householders without an existing aggregator relationship viewed the
    requirement to establish a new relationship as a significant barrier to SOE participation.
  lesson_learnt: New grid-integration features (such as SOEs) are most readily accepted
    when layered onto existing, trusted consumer relationships rather than requiring
    consumers to establish new organisational relationships. Deployment strategies
    should prioritise integration into existing aggregation products for current VPP
    participants before seeking to onboard new participants.
