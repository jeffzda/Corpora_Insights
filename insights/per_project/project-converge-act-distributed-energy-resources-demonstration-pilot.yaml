  source_title: Project Converge - Final Report
  publish_date: 2024-05
  project_name: Project Converge
  what_happened: 'Householders consistently expressed concern about data privacy and
    cyber security in the context of SOE and aggregator relationships. Specific concerns
    included: the volume of personal energy data shared with multiple organisations;
    the risk of hackers accessing home energy assets through aggregator platforms;
    and the real-world impact of service outages (e.g. the Optus outage preventing
    EV charging) as evidence of integrated system fragility.'
  lesson_learnt: 'Data privacy and cyber security are substantive participation barriers
    for DER trials, not merely theoretical concerns. Trial design and consumer communications
    must explicitly address: what personal data is collected, who it is shared with,
    how it is protected, and what happens in the event of a breach or outage. Unaddressed,
    these concerns will suppress participation, particularly among households not
    yet enrolled in aggregation services.'
