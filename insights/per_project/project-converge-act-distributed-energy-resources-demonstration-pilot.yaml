- record_id: ARENA-DLV-9660
  source_title: 'Social Science Report 1: Intermediary Insights on Dynamic and Shaped
    Operating Envelopes'
  publish_date: 2023-05
  project_name: Project Converge
  what_happened: The Converge team explicitly adopted a 'good enough' co-optimisation
    approach with SOEs rather than seeking mathematically optimal solutions, because
    acquiring the complete data sets required for full co-optimisation was identified
    as impractical across multiple prior projects.
  lesson_learnt: For DER orchestration projects, design for 'good enough' optimisation
    from the outset rather than mathematical optimality — the data collection and
    computation requirements for full co-optimisation are prohibitive in practice,
    and an 80–90% efficient solution that can be implemented is more valuable than
    a theoretically optimal one that cannot.
