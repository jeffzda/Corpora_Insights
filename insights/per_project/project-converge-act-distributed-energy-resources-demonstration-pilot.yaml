- record_id: ARENA-DLV-30313
  source_title: Project Converge - Final Report
  publish_date: 2024-05
  project_name: Project Converge
  what_happened: Aggregator algorithms used to manage consumer DER in VPPs and SOEs
    are built around price and financial value of energy interchange, which can systematically
    misrepresent or ignore broader householder values such as self-sufficiency, emergency
    preparedness, and community contribution. Householders reported intuiting this
    misalignment, and the CONSORT trial was cited as a prior example where purely
    financial optimisation conflicted with consumer values.
  lesson_learnt: Aggregation algorithms must be designed with explicit non-financial
    value parameters (e.g. self-consumption floors, emergency reserve, community contribution)
    that are disclosed to and configurable by consumers. Assuming price-based optimisation
    adequately represents consumer preferences is a recurring design failure across
    DER trials and undermines long-term consumer trust in aggregation services.
