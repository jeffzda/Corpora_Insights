  what_happened: Current regulation does not provide incentives for DSOs to prioritise
    DER-based network support over network augmentation, nor does it support aggregator
    business models for providing network support services. The project found this
    regulatory gap to be a fundamental barrier to commercial deployment of SOEs, regardless
    of their demonstrated technical and economic superiority.
  lesson_learnt: Regulatory reform is a prerequisite for SOE deployment at scale —
    without regulation that incentivises DSOs to use DERs as a least-cost alternative
    to network augmentation, DSOs will continue to favour augmentation because their
    business model and regulatory obligations push them in that direction; policymakers
    should develop specific regulatory instruments to govern market-interacting DSO
    functions.
