  what_happened: Obtaining sufficient NMI-level granular data from aggregators on
    individual DER system behaviour proved challenging during implementation; the
    report notes that other comparable projects were unable to obtain sufficiently
    granular information to proceed with their intended approaches.
  lesson_learnt: Projects relying on NMI-level DER telemetry from aggregators should
    establish data-sharing agreements and validate data availability and granularity
    before finalising technical design — aggregated fleet bids at NEM-region level
    are insufficient for distribution-level network impact prediction, and this data
    gap has caused comparable projects to stall.
