  project_name: Project Converge ACT
  what_happened: Inaccurate load forecasts by aggregators were a main cause of envelope
    non-compliance by participants in the Converge trial, particularly when participants
    were generating. Forecast errors were visible in trial data where actual behaviour
    diverged significantly from forecasts even in the absence of network support dispatch.
  lesson_learnt: To reduce envelope non-compliance in SOE or DOE deployments, invest
    in higher-quality disaggregated behind-the-meter metering (especially for batteries
    and solar generation separately) and ensure forecast uncertainty is translated
    into envelope design to give participants compliant headroom.
