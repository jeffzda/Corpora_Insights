  source_title: Project Converge - Final Report
  publish_date: 2024-05
  project_name: Project Converge
  what_happened: Householders consistently raised social equity concerns about SOE
    and DOE design — including equitable capacity allocation between participants
    with different system sizes, network locations, and vulnerabilities, as well as
    concerns about disadvantaging non-DER-owning households. These equity dimensions
    had not been explicitly incorporated into the SOE algorithm as built.
  lesson_learnt: Social equity considerations must be explicitly scoped and, where
    feasible, built into algorithm design and capacity allocation rules from the outset
    of grid-integration technology development — not treated as a post-deployment
    concern. Early co-design with diverse consumer groups, including those without
    DER, is necessary to identify and respond to equity risks.
