- record_id: ARENA-DLV-35151
  source_title: 'Shaped Operating Envelopes: Technical Design and Implementation Report'
  publish_date: 2023-02
  project_name: Project Converge
  what_happened: Trial scope was constrained because neither participating aggregator
    (Reposit Power and Evergen) directly participated in the wholesale energy market
    in a way that required per-feeder or per-NMI bids, meaning the full SOE optimisation
    capability — which relies on granular aggregator bid data disaggregated to feeder
    or DER category level — could not be demonstrated as designed.
  lesson_learnt: When designing DER market trials that depend on aggregator wholesale
    market participation, confirm at the outset that participating aggregators can
    provide sufficiently granular bid data at feeder or NMI level — regional-only
    bids materially reduce the flexibility and demonstrable benefit of network-aware
    optimisation frameworks like SOEs.
