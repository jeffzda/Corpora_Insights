  what_happened: The Denial of Service cybersecurity risk for the SOE utility server
    was managed in the project by restricting communications to a small number of
    aggregators with known IP address ranges and applying IP whitelisting — a control
    that is viable for an aggregator-mediated trial but would need significant modification
    for a production system communicating directly with many end devices.
