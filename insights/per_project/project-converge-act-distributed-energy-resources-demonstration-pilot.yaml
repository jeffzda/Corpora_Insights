- record_id: ARENA-DLV-30318
  source_title: Project Converge - Final Report
  publish_date: 2024-05
  project_name: Project Converge
  what_happened: The Converge trial was conducted without changing participant retail
    tariffs or connection agreements; participants remained on standard retail tariffs
    throughout. This meant the modelled scenario of fully market-responsive VPP participation
    (which would produce significantly greater SOE benefits) could not be tested,
    leaving the longer-term operational and commercial model for SOEs undefined.
  lesson_learnt: Trials of VPP and operating envelope technologies should, where possible,
    include at least one arm in which participants are on time-of-use or market-responsive
    tariffs. Constraining all participants to standard retail tariffs prevents testing
    the full value proposition and leaves commercial scalability assumptions unverified.
