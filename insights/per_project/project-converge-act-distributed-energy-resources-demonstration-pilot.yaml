    a single feeder, uncontrollable rooftop solar generation was the dominant driver
    of voltage violations during midday hours, and the available flexible DER capacity
    (batteries and controllable loads) was insufficient and poorly timed to curtail
    excess solar generation when needed most. The peak network support offer was misaligned
    with peak voltage events.
  lesson_learnt: For SOEs to manage solar-driven overvoltage events effectively, a
    critical mass of flexible, dispatchable DER capacity (batteries, controllable
    loads) must be available and offering into network support at the times of solar
    peak output — trials should assess DER flexibility profile alignment with network
    constraint timing before designing network support mechanisms.
