- record_id: ARENA-DLV-25955
  source_title: Project Converge ACT - Distributed Energy Resources Demo Pilot - Technical
    Report 2 Economic Benefits
  publish_date: 2024-03
  project_name: Project Converge ACT
  what_happened: The enforced zero-point constraint in the Converge API — requiring
    operating envelopes to always include zero (i.e., the lower bound cannot go above
    zero and the upper bound cannot go below zero) — meant that the enforceable network
    support capacity was typically an order of magnitude less than the raw offers
    provided by participants, severely limiting the SOE engine's ability to dispatch
    network support.
  lesson_learnt: Future SOE/DOE API implementations should allow envelopes to cross
    the zero connection-point boundary, or implement a separate 'network support'
    category, to enable the full raw network support capacity of DER participants
    to be dispatched — the current zero-point constraint design can reduce enforceable
    capacity by approximately an order of magnitude.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated integration
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: Simulation analysis showed that removing the zero-point crossing
    constraint (allowing raw offers to be enforced) would provide a larger network
    response, though the improvement during peak voltage events was still modest due
    to insufficient flexible curtailment capacity.
  transferability: moderate
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id023
  - 23
