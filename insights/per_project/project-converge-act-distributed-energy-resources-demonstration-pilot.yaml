  what_happened: The Converge project team required specialists from batteries, computer
    programming, network innovation, customer engagement, and social research — with
    the team spanning a university, a network, an IT innovation company, and aggregation
    services. Intermediaries noted that the breadth of skills needed were rarely found
    together and that such people would be difficult to replace.
  lesson_learnt: Multi-disciplinary innovation teams for DER orchestration projects
    must be scoped and recruited early and treated as a long-term investment — the
    specific combination of technical, regulatory, commercial, and social skills required
    is rare in the market, and losing key personnel mid-project carries high replacement
    cost and schedule risk.
