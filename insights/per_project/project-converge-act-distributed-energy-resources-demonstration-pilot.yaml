- record_id: ARENA-DLV-25954
  source_title: Project Converge ACT - Distributed Energy Resources Demo Pilot - Technical
    Report 2 Economic Benefits
  publish_date: 2024-03
  project_name: Project Converge ACT
  what_happened: Envelope compliance was imperfect during trials because aggregators
    forecast customer connection point power 15 minutes or more in advance, leading
    to significant reservation errors. The SOE engine calculated envelopes based on
    these point forecasts without any uncertainty margin, meaning customers were sometimes
    assigned envelopes they could not physically comply with.
  lesson_learnt: Aggregators should provide reservation forecasts as intervals (ranges)
    rather than point values to allow the SOE engine to account for forecasting uncertainty
    — point-only forecasts expose customers to envelopes they cannot physically comply
    with and undermine the reliability of network support dispatch.
