- record_id: ARENA-DLV-25951
  source_title: Project Converge ACT - Distributed Energy Resources Demo Pilot - Technical
    Report 2 Economic Benefits
  publish_date: 2024-03
  project_name: Project Converge ACT
  what_happened: Fixed operating envelopes (FOEs), representing current DSO practice
    of fixed import/export limits at the customer connection point, caused significant
    transformer overloads and voltage violations at both LV and MV levels in offline
    simulations, particularly at higher DER penetration scenarios (P40B20 and P60B40).
    SOEs and DOEs eliminated these violations entirely under the same scenarios.
  lesson_learnt: Current fixed import/export limits at the customer connection point
    are unsuitable for ensuring distribution network security at higher DER penetration
    levels — DSOs should plan to transition to dynamic envelope approaches (DOEs or
    SOEs) before DER penetration reaches levels that fixed limits cannot manage.
