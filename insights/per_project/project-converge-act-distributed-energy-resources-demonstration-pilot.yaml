    relationship and more receptive to adding SOE functionality than newly onboarded
    customers. This longer tenure had allowed them to build trust through observed
    benefits from the aggregation relationship.
  lesson_learnt: DER grid-integration features are most efficiently deployed through
    mature aggregator customer relationships. Where possible, prioritise rollout to
    established VPP participants with multi-year aggregator relationships, as these
