  what_happened: The Converge API enforced a zero-point constraint on operating envelopes
    (lower bound must not exceed zero; upper bound must not fall below zero), which
    limited the enforceable network support capacity to roughly one order of magnitude
    less than the raw offers provided by participants. Battery operators optimising
    for self-consumption kept connection point power near zero, further reducing enforceable
    capacity.
  lesson_learnt: The zero-point constraint on operating envelopes substantially limits
    the network support capacity that can be dispatched — future API and SOE implementations
    should consider a more flexible envelope definition or a separate 'network support'
    category to enable fuller utilisation of raw participant offers, particularly
    for battery-equipped customers operating near zero net power.
