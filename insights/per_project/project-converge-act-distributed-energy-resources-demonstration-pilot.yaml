  source_title: 'Shaped Operating Envelopes: Technical Design and Implementation Report'
  publish_date: 2023-02
  project_name: Project Converge
  what_happened: Simulations demonstrated that Fixed Operating Envelopes (FOEs) —
    the current industry practice of fixed per-phase export and import limits — caused
    significant transformer overloads and voltage violations in scenarios with 60%
    and 80% PV penetration, while both DOE and SOE frameworks maintained network secure
    operation across all DER penetration scenarios tested.
  lesson_learnt: Distribution networks planning for DER penetration above approximately
    33% of customers should not rely on fixed operating envelopes for network security
    management — simulation evidence from a real ACT feeder shows FOEs produce hundreds
    of thousands of voltage and thermal violations at 60%+ PV penetration, while dynamic
    envelope approaches eliminate these violations entirely.
