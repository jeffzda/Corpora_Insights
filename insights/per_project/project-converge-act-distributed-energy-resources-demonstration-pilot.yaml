  source_title: Project Converge ACT - Distributed Energy Resources Pilot - Final
    knowledge sharing report
  publish_date: 2024-03
  project_name: Project Converge ACT
  what_happened: With only ~1% penetration of SOE-controlled devices on real feeders
    in the ACT, the live trial produced no measurable change in actual network performance,
    even though the SOE engine was procuring network support correctly.
  lesson_learnt: DER grid-management trials require a minimum critical penetration
    of controlled devices on targeted feeders to produce measurable network outcomes;
    design trial feeder selection and participant concentration to achieve at least
    ~30% penetration on specific feeders rather than spreading participants thinly
    across a distribution area.
