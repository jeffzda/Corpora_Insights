  what_happened: The trial tested SOE network support response by creating artificially
    tight voltage and thermal limits across five feeders simultaneously, and also
    tested SOEs with greater DER penetration by artificially mapping all participants
    to single feeders — demonstrating that the SOE platform could induce and detect
    network support responses under stress conditions.
  lesson_learnt: Future SOE and DOE trials should include stress-testing phases using
    artificially constrained limits to validate network support responsiveness before
    relying on the system for real network management; testing voltage and thermal
    limits separately provides cleaner evidence of system response capabilities.
