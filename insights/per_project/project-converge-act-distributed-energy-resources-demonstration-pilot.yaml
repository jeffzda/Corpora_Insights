- record_id: ARENA-DLV-30327
  source_title: Project Converge - Final Report
  publish_date: 2024-05
  project_name: Project Converge
  what_happened: 'The SOE design did not have a well-defined or tested implementation
    pathway at the point of trial completion. Key uncertainties included: whether
    SOEs would be applied as a condition of connection, through network support contracts,
    or embedded in aggregation products; whether participation would be mandatory
    or voluntary; and how SOEs would interact with market participation. Two aggregators
    applied SOEs through substantially different product structures during the trial.'
  lesson_learnt: For novel grid-integration technologies, define and test at least
    one complete end-to-end implementation pathway — including commercial model, contractual
    basis, and participant obligations — before attempting to scale. Leaving implementation
    details undefined at the end of a niche trial transfers unresolved design risk
    to the scaling phase where changes are more costly.
