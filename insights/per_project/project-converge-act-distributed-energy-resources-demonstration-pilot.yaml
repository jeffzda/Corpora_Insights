  project_name: Project Converge
  what_happened: Stakeholders and householders consistently identified that consumer-facing
    communications about SOEs and DOEs were inadequate and inaccessible. Technical
    terminology (e.g. 'fixed operating envelopes', 'dynamic operating envelopes',
    'shaped operating envelopes') was widely found to be incomprehensible to householders,
    and no single organisation had taken clear responsibility for developing or delivering
    consumer-appropriate messaging.
  lesson_learnt: For novel grid-integration technologies, develop a coordinated, multi-organisation
    communications plan using plain language and value-based framing before consumer-facing
    deployment. Assign clear responsibility for consumer communications across the
    intermediary landscape and test messaging with target consumers; do not rely on
    technical terminology to reach the mass market.
