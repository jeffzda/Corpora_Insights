  source_title: 'Social Science Report 1: Intermediary Insights on Dynamic and Shaped
    Operating Envelopes'
  publish_date: 2023-05
  project_name: Project Converge
  what_happened: Intermediaries reported that DOE-related data on network conditions
    was frequently incomplete or unavailable, and that technology in real end-user
    environments was not always performing as expected or calculated — meaning operational
    DOE systems were making decisions on unreliable data.
  lesson_learnt: Do not assume network data completeness when designing or deploying
    DOE systems — build in data validation layers and real-world monitoring from the
    outset, as field conditions routinely diverge from modelled assumptions.
