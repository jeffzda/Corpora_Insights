- record_id: ARENA-DLV-30317
  source_title: Project Converge - Final Report
  publish_date: 2024-05
  project_name: Project Converge
  what_happened: No single organisation was identified as having clear responsibility
    for consumer protection and care as operating envelopes are deployed. Neither
    aggregators, networks, retailers, nor regulators had an explicitly defined role
    in independently monitoring consumer impacts or advocating for consumer interests
    within the SOE framework. This gap was consistently raised by stakeholders as
    a risk.
  lesson_learnt: Before scaling operating envelope or grid-integration technologies,
    the regulatory and industry framework must define which organisation(s) hold responsibility
    for consumer protection, impact monitoring, and dispute resolution. Leaving this
    undefined at the niche stage means it will remain undefined at scale, with potential
    for serious consumer harm.
