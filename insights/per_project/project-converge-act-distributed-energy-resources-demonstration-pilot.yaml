  what_happened: The RT RIT-D toolbox demonstrated that using DER owners to provide
    voltage regulation services can avoid installation of MV/LV OLTC transformers.
    In the most extreme scenario modelled (P33B5EV5), 9 OLTC transformers (AUD 1,962,000
    installation cost) could be avoided at a 30-year NPV DER cost of only AUD 27,250
    — an avoided cost of approximately AUD 1.93 million.
  lesson_learnt: DER-based network support can be dramatically more cost-effective
    than traditional network augmentation (OLTC transformers) — DSOs and policymakers
    should use tools such as RT RIT-D to quantify this trade-off and develop regulatory
    frameworks that incentivise DSOs to recruit DER owners rather than default to
    network augmentation.
