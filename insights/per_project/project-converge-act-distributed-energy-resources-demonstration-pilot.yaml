  what_happened: In Trials 1 and 2, the small number of participating customers on
    each feeder (7–23 per feeder) meant the SOE engine could not bring feeder voltages
    or transformer loading back within limits — it dispatched all available network
    support but the physical impact was negligible. The engine operated in an 'all
    or nothing' manner with no proportional response.
  lesson_learnt: SOEs can only maintain network security if enough controllable DER
    capacity is available; a minimum threshold of controllable DER penetration per
    feeder must be established before deploying SOEs for network support — below this
    threshold the SOE system dispatches all available capacity but cannot resolve
    constraint violations.
