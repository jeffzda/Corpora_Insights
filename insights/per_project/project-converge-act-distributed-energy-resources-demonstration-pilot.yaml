  publish_date: 2024-03
  project_name: Project Converge ACT
  what_happened: During live trials, the actual DER penetration on trial feeders was
    approximately 1% of customers — far below the concentration needed for SOEs to
    materially correct network constraint violations. With only 12–23 participants
    per feeder, network support offers were insufficient to bring voltages or transformer
    loading back within limits, and the SOE engine operated in an 'all or nothing'
    manner.
  lesson_learnt: SOE and DOE trials require a minimum critical mass of controllable
    DER participants on target feeders to demonstrate network support effectiveness
    — trials with ~1% DER participation cannot validate network-level outcomes, and
    future demonstrations should prioritise feeders with higher DER concentrations
    or use synthetic participant augmentation from the outset.
