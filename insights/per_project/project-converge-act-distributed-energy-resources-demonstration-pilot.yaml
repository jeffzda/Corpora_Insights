- record_id: ARENA-DLV-9655
  source_title: 'Social Science Report 1: Intermediary Insights on Dynamic and Shaped
    Operating Envelopes'
  publish_date: 2023-05
  project_name: Project Converge
  what_happened: Intermediaries raised concern that some networks were using DOE limits
    as a 'throttling mechanism' to address overvoltage problems — effectively using
    DOEs as a substitute for procuring network services — rather than restricting
    DOEs to their intended function of maintaining safe operating envelopes.
  lesson_learnt: Establish clear governance boundaries before deploying DOEs that
    define what network problems DOEs may and may not be used to solve — networks
    using DOEs to address overvoltage without compensating DER owners conflates network
    service procurement with operating envelope management and creates unfair outcomes
    for asset owners.
