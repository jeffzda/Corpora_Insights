- record_id: ARENA-DLV-26469
  source_title: Project Converge - Final Technical Report
  publish_date: 2024-03
  project_name: Project Converge
  what_happened: In offline simulations with perfect controllability and forecast
    assumptions, both SOEs and DOEs achieved complete network security across all
    DER scenarios. However, in real-world live trials, imperfect DER controllability
    and forecast errors prevented the same level of performance, indicating a material
    gap between simulation and live results.
  lesson_learnt: SOE/DOE network security results from offline simulations with perfect
    control and forecast assumptions are not directly transferable to real-world performance
    — live trial assessments must account for partial controllability of the DER fleet
    and forecast errors; design changes such as separate metering for DER and household
    loads and weather-based PV prediction should be considered to close this gap.
  issue_severity: moderate
  project_type: software/data/digital
