  what_happened: Network data quality issues — including missing network parameters,
    inaccurate customer connection point and phase information, and uncertain transformer
    tap positions — were encountered when processing Evoenergy's network dataset for
    use in SOE optimal power flow calculations. Issues had to be audited and fixed
    or worked around before the SOE engine could operate.
  lesson_learnt: High-quality, CIM-compliant network data with accurate customer connection
    phasing, line impedances, and transformer tap settings is a prerequisite for running
    SOE or DOE optimal power flow calculations — DSOs should invest in network data
    quality improvement programs before deploying envelope-based DER management systems.
