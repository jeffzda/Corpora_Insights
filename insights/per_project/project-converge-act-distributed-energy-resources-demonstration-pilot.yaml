  source_title: 'Social Science Report 1: Intermediary Insights on Dynamic and Shaped
    Operating Envelopes'
  publish_date: 2023-05
  project_name: Project Converge
  what_happened: Different states were developing incompatible DOE solutions, creating
    a fragmented national landscape. Intermediaries warned this inconsistency would
    make it difficult to attract technology vendors to adapt their products for Australia,
    given the country's small market size, and would hinder skills development and
    national scaling.
  lesson_learnt: Pursue national standardisation of DOE communications standards and
    application frameworks before widespread rollout — Australia's small market means
    technology vendors require national-scale consistency to justify product adaptation,
    and fragmented state-based approaches will raise costs and slow deployment.
