  what_happened: Stakeholders questioned whether battery-owning households are the
    optimal target cohort for maximising grid impact through SOEs, raising the hypothesis
    that solar-only households (without batteries) might offer greater network benefit.
    This was linked to the finding that the self-consumption design constraint — primarily
    relevant to battery owners — significantly limited SOE performance.
  lesson_learnt: Before scaling operating envelope technologies, evaluate the relative
    grid benefit achievable across different consumer cohorts (battery+solar, solar-only,
    EV owners, commercial premises) and target rollout to the cohort offering the
    best cost-per-unit-of-grid-benefit ratio. Do not assume that the cohort most engaged
    in aggregation services is the cohort with the greatest network impact potential.
