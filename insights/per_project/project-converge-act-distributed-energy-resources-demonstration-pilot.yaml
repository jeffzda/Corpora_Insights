  source_title: 'Social Science Report 1: Intermediary Insights on Dynamic and Shaped
    Operating Envelopes'
  publish_date: 2023-05
  project_name: Project Converge
  what_happened: Intermediaries raised concern that DOE rollout in Australia risked
    creating significant infrastructure inequality because of the expensive hardware
    and inverter technology required to participate in DOE systems, with very little
    social equity analysis having been conducted prior to or during early deployments.
  lesson_learnt: Before scaling DOE or SOE programs, conduct explicit social equity
    assessments — the cost of participation hardware risks excluding lower-income
    households and creating a two-tier system that will be difficult to remedy after
    infrastructure choices are locked in.
