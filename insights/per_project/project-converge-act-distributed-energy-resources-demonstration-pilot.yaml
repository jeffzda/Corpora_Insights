  what_happened: Householders — even self-described highly engaged and technically
    educated participants — struggled to fully understand the implications of SOE
    participation during interviews and workshops. Many identified that the high cognitive
    burden required to understand SOEs would exclude a large proportion of the population
    from meaningfully participating.
  lesson_learnt: The complexity burden placed on consumers by emerging grid-integration
    technologies such as SOEs is a real barrier to participation at scale. Technology
    designers and deployment teams should conduct usability and comprehension testing
    with representative consumer groups early in the design process, and simplify
    or modularise the consumer-facing proposition accordingly.
