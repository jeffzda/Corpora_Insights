  what_happened: Intermediaries from DOE trials observed that impacts and reactions
    of householders were routinely underestimated by innovation teams before direct
    engagement — including reactions to communications, contracts, installation processes,
    technology noises, and ongoing costs — suggesting that consumer experience considerations
    were not being adequately built into trial design.
  lesson_learnt: Build consumer experience design into DER trial and DOE deployment
    plans from the earliest stage, covering communications, contracts, installation,
    and ongoing interaction — evidence from prior pilots confirms that householder
    reactions are consistently underestimated until direct engagement occurs, and
    late-stage discovery of consumer concerns causes costly redesign.
