  what_happened: The SOE concept was poorly understood by most intermediaries at the
    time of interviews because it was still being defined by the Converge design team
    and had not been reviewed by a wider specialist community. The term 'shaped' specifically
    misled several interviewees and did not intuitively convey the solution's features.
  lesson_learnt: Resolve core definitions and terminology for novel solutions before
    conducting stakeholder consultations — presenting a work-in-progress concept to
    intermediaries generated confusion and made it impossible for them to assess the
    solution's merit, wasting engagement opportunities and skewing feedback.
