  project_name: Project Converge ACT
  what_happened: A core assumption underlying SOEs — that aggregators derived their
    market bids by aggregating individual DER device capabilities — proved incorrect.
    Neither participating aggregator was an energy retailer (FRMP) and neither built
    bids from individual device-level capabilities, so they could not state how each
    device should bid into the SOE engine.
  lesson_learnt: Before designing a DER coordination algorithm that relies on aggregator
    bid disaggregation, confirm with aggregators how they actually construct their
    market bids — if bids are not device-level, the algorithm's market-shaping capability
    will be absent and the trial scope will need to be reframed.
