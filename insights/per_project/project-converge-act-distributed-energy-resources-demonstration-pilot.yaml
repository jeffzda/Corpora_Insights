  project_name: Project Converge
  what_happened: The two aggregators (Reposit Power and Evergen) used different payment
    structures for the trials — one paid per kWh dispatched, the other paid a flat
    rate for the whole trial. The SOE optimisation engine factored in these differences,
    resulting in materially different dispatch patterns and total network support
    quantities between the two aggregators.
  lesson_learnt: Network support payment structure directly influences the distribution
    of dispatch events across participating DER owners — DSOs and trial designers
    should carefully consider payment mechanism design before commencing SOE trials,
    as per-kWh pricing better incentivises individual dispatch events while flat fees
    may result in uneven or suboptimal network support delivery.
