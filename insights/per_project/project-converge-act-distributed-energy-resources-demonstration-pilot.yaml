  project_name: Project Converge
  what_happened: Householders with batteries and solar who are increasingly self-sufficient
    in energy expressed a growing disinclination to remain grid-connected, particularly
    when confronted with operating envelope constraints or demand management obligations.
    Some explicitly stated that descriptions of operating envelopes made them want
    to go off-grid.
  lesson_learnt: Operating envelope and demand management programs that are perceived
    as reducing consumer autonomy risk accelerating grid defection by the prosumer
    households most needed for distributed network support. Program design should
    frame consumer obligations positively and ensure self-consumption and energy independence
    are protected sufficiently to maintain grid connection incentives.
