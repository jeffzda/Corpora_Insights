    Operating Envelopes'
  publish_date: 2023-05
  project_name: Project Converge
  what_happened: DOEs were being applied only to new and replacement solar installations
    at the time of the report; intermediaries noted that without extension to existing
    DER installations, DOEs would have limited network impact, but older technology
    was technically incompatible with DOE systems.
  lesson_learnt: Plan a technology upgrade or retrofit pathway for existing DER installations
    early in DOE programme design — limiting DOEs to new installations creates a long
    tail before sufficient network penetration is achieved to deliver material congestion
    management benefits.
