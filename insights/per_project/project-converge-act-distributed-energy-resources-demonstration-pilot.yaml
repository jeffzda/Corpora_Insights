  source_title: Project Converge - Final Report
  publish_date: 2024-05
  project_name: Project Converge
  what_happened: Householders reported significant distrust of energy industry organisations
    including retailers, installers, and aggregators, primarily on the basis that
    commercial interests were perceived as opposed to customer interests. Distrust
    was mentioned 14 times across householder interviews compared with trust mentioned
    only twice. Prior negative experiences (e.g. an installer advising a consumer
    not to read a contract) were cited as reasons to distrust subsequent organisations.
  lesson_learnt: Distrust of energy industry actors is a systemic barrier to consumer
    participation in grid-integration programs. Programs deploying SOEs or similar
    technologies must invest in trust-building measures — including transparent communication,
    demonstrable responsiveness to consumer concerns, and separating commercial messaging
    from factual product explanation — before attempting broad consumer recruitment.
