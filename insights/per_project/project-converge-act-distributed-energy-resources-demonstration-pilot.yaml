- record_id: ARENA-DLV-28857
  source_title: Project Converge ACT - Distributed Energy Resources Pilot - Final
    knowledge sharing report
  publish_date: 2024-03
  project_name: Project Converge ACT
  what_happened: Aggregators in the Converge trial provided point forecasts of customer
    consumption rather than confidence intervals (ranges), contrary to the SOE design
    assumption. Aggregator load forecasting systems were not designed to produce confidence
    intervals, which undermined the intended uncertainty-handling capability of the
    SOE engine.
  lesson_learnt: When designing DER coordination platforms that rely on probabilistic
    aggregator inputs, verify upfront whether aggregators' systems can produce the
    required forecast format (range vs. point); if not, either redesign the algorithm
    to accept point forecasts or fund aggregator system upgrades before the trial
    begins.
