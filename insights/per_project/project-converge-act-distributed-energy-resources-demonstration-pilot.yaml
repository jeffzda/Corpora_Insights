  what_happened: Householders broadly conceptualised having their preferences incorporated
    into SOEs far more expansively than industry designers intended — expecting the
    technology to respond to values including equity, environmental stewardship, community
    contribution, and data privacy, not just financial optimisation. This gap between
    consumer expectations and the actual scope of SOE preference incorporation is
    a source of potential misunderstanding, disappointment, and erosion of trust.
  lesson_learnt: When communicating to consumers that a technology 'incorporates your
    preferences', be explicit and specific about which preferences are incorporated,
    by what mechanism, and what the boundaries are. Broad or vague messaging about
    consumer-centricity in grid-integration technologies will generate expectations
    that the technology cannot meet, leading to distrust when the gap becomes apparent.
