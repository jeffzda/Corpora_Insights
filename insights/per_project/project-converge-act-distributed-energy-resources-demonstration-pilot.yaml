  source_title: Project Converge - Final Report
  publish_date: 2024-05
  project_name: Project Converge
  what_happened: Solar installers were identified as a key consumer-facing intermediary
    for DER grid integration, yet they were found to be under-resourced, under-represented
    in industry data, and at risk of being overwhelmed by customer queries about operating
    envelope compliance. A stakeholder warned that installers facing an avalanche
    of customer complaints about DOE/SOE impacts might resort to non-compliant system
    configurations rather than manage the workload.
  lesson_learnt: Industry rollout plans for operating envelopes and other grid-integration
    technologies must explicitly address installer capacity, training, and customer
    communication support. Failing to resource the installer channel risks both non-compliance
    with technical standards and consumer dissatisfaction being managed (poorly) by
    the wrong intermediary.
