    equity, affordability, environmental stewardship, and community values — creating
    a significant expectation gap that, if unaddressed, could undermine trust and
    participation.
  lesson_learnt: Before communicating to consumers that their 'preferences will be
    reflected' in a DER coordination technology, clearly define and disclose the specific
    and limited set of preferences the algorithm can actually incorporate; failure
    to do so creates fertile ground for misunderstanding, disappointment, and distrust.
