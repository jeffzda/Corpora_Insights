    40% battery). This highlights that LV network monitoring and modelling is the
    critical first layer of concern for DER integration, not the MV network.'
  lesson_learnt: DSOs planning for DER integration at scale must prioritise LV network
    modelling and monitoring — voltage violations emerge at LV level well before they
    reach MV networks, and models that only cover MV will miss the earliest and most
    frequent constraint violations; planning tools and operating envelope systems
    must cover the full MV-LV network hierarchy.
