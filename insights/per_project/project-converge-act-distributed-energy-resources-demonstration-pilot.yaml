- record_id: ARENA-DLV-30301
  source_title: Project Converge - Final Report
  publish_date: 2024-05
  project_name: Project Converge
  what_happened: The self-consumption constraint built into the SOE algorithm — requiring
    that household batteries always be allowed to self-consume before any network
    support action — reduced the amount of network support the algorithm could procure
    by nearly an order of magnitude. Aggregators were offering capacity bids that
    would result in participants not self-consuming, but the algorithm could only
    accept approximately 10% of the total capacity bid.
  lesson_learnt: Design teams must explicitly model the trade-off between embedding
    consumer values (such as self-consumption priority) in an algorithm and the resulting
    reduction in technical network benefit. Where self-consumption is protected by
    design, expected grid support outcomes should be recalibrated accordingly before
    setting stakeholder performance expectations.
