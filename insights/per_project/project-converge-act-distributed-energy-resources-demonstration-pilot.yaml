  what_happened: Offline simulations showed that SOEs unlock more DER capacity for
    energy and FCAS markets than DOEs across all DER penetration scenarios, with the
    performance gap widening significantly at high DER penetration (P60B40). The gain
    was modest at current penetration levels (P25B2) but became substantial at 40–60%
    PV penetration with 20–40% battery penetration.
  lesson_learnt: SOEs outperform DOEs in unlocking DER market value, but the advantage
    only becomes significant at high DER penetration levels — DOEs may be an adequate
    near-term solution, and a planned transition to SOEs should be triggered by DER
    penetration thresholds rather than implemented immediately.
