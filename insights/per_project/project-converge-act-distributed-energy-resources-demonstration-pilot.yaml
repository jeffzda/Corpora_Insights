- record_id: ARENA-DLV-9651
  source_title: 'Social Science Report 1: Intermediary Insights on Dynamic and Shaped
    Operating Envelopes'
  publish_date: 2023-05
  project_name: Project Converge
  what_happened: DOE specialist knowledge was found to be held by only one to a few
    people per organisation across Australia, with no systemic education programs
    in place to transfer in-depth knowledge at scale. The pool of intermediaries capable
    of designing, deploying, and operating DOE/SOE solutions was described as a small
    group nationally.
  lesson_learnt: Before scaling DOE or any novel DER orchestration technology, proponents
    and funders must invest in targeted workforce development programs — the current
    specialist knowledge base is too narrow to support widespread deployment, and
    upskilling at pace will require deliberate government and funding body intervention.
