  project_name: Project Converge ACT
  what_happened: The Converge trial was implemented under a network support agreement
    model rather than as part of standard flexible export connection agreements or
    PV connection standards used in operational DOE schemes. This structural difference
    meant the trial was not representative of how operational SOEs would be deployed,
    limiting the generalisability of consumer participation findings.
  lesson_learnt: Design DER trials to mirror the regulatory and contractual structure
    of the intended operational deployment as closely as possible; implementing a
    trial under a bespoke network support agreement rather than through standard connection
    terms creates a participation context that does not reflect future conditions
    and limits what can be concluded about scalability.
