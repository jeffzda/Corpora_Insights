  project_name: Project Converge ACT
  what_happened: An equity consideration was designed into the SOE capacity allocation
    engine but was abandoned early in testing because requiring similar envelopes
    across all participants caused significantly more constraint — participants with
    smaller envelopes (due to network constraints) caused over-constraint for all
    other participants.
  lesson_learnt: Equity objectives embedded directly into capacity allocation algorithms
    can produce perverse outcomes; test equity constraints in simulation before live
    deployment and consider whether equity is better addressed through policy or product
    design rather than within the allocation engine itself.
