- record_id: ARENA-DLV-26451
  source_title: Project Converge - Final Technical Report
  publish_date: 2024-03
  project_name: Project Converge
  what_happened: Fixed operating envelopes (fixed import/export limits at the customer
    connection point), which represent current DSO practice, caused significant transformer
    overloads and voltage violations at both LV and MV levels in offline simulations,
    particularly at higher DER penetration scenarios (P40B20 and P60B40). SOEs and
    DOEs eliminated these violations entirely.
  lesson_learnt: Current DSO practices of fixed import and export limits at the customer
    connection point are unsuitable for ensuring distribution network security at
    higher DER penetration levels — dynamic approaches such as SOEs or DOEs are necessary
    to avoid significant network augmentation investment.
