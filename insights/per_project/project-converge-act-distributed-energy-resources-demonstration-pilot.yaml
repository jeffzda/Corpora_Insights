  what_happened: The SOE economic gains over DOE were found to be higher on days with
    high wholesale price volatility (e.g., day 21 in the February 2022 simulation),
    because high-volatility conditions provide better opportunities for aggregators
    to orchestrate DER to maximise profits, and the SOE approach's observability over
    aggregator bid intentions allowed it to exploit these opportunities within network
    limits while DOE could not.
  lesson_learnt: When evaluating the business case for SOEs over simpler DOEs, weight
    the analysis toward high-price-volatility scenarios — average-day economic comparisons
    will understate the value differential, and the most significant economic benefits
    materialise precisely during the high-stress conditions where network management
    and market optimisation interact most.
