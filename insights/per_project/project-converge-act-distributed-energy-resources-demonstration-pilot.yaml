  what_happened: Intermediaries cautioned that highly optimised network operation
    enabled by SOEs could have unintended negative physical consequences for network
    infrastructure — for example, transformers that normally cool during lightly loaded
    periods might be run near capacity continuously, raising questions about long-term
    asset health.
  lesson_learnt: Before deploying SOEs or any optimisation solution that significantly
    increases network utilisation, commission engineering assessments of infrastructure
    thermal and longevity impacts under sustained high-utilisation conditions — optimisation
    benefits may be partially offset by accelerated asset degradation.
