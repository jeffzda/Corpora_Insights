  source_title: Project Converge - Final Report
  publish_date: 2024-05
  project_name: Project Converge
  what_happened: Householders described undertaking extended personal learning journeys
    — often spanning more than a year — after installing DER, to understand how their
    devices behaved and to shift energy use patterns. Many stated that after this
    learning period they had made all feasible changes and could not increase their
    flexibility further. This has direct implications for demand management and SOE
    participation assumptions about flexible load.
  lesson_learnt: Demand flexibility models for DER programs should not assume that
    long-term DER owners have significant remaining flexibility headroom. After the
    initial learning period, many households reach a stable energy use pattern that
    represents their effective flexibility ceiling. Aggregate flexibility estimates
    should be calibrated to account for this saturation effect in mature DER cohorts.
