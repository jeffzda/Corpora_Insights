  project_name: Project Converge
  what_happened: In Trial 3, even when all 1001 participants were synthetically mapped
    to a single feeder, the available solar generation was largely uncontrollable
    (no curtailment possible) and peaked at exactly the time voltage violations were
    most severe (midday). The network support response from batteries and controllable
    loads was misaligned in time — the largest offers were available at times when
    they were least needed.
  lesson_learnt: The mix of controllable DER types matters as much as the total capacity
    — a portfolio dominated by uncurtailable solar with insufficient battery storage
    or flexible load will be unable to provide meaningful voltage support at the critical
    midday peak; future SOE programs should target recruitment of DER owners with
    battery storage or flexible loads capable of responding during solar generation
    peaks.
