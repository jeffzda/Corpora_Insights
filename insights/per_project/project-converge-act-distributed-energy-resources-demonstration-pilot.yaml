    making each component of delivery bespoke and time-consuming — from aggregator
    agreements to data sharing arrangements. The trial's complexity was therefore
    substantially higher than a mature operational deployment would face.
  lesson_learnt: Before trialling novel DNSP–aggregator coordination technologies
    at scale, the industry should develop standardised implementation frameworks covering
    data exchange, contractual templates, and operational protocols; without these,
    trial complexity and cost will be disproportionately high and findings will be
    difficult to generalise.
