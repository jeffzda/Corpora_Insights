- record_id: ARENA-DLV-70815
  source_title: Grid Forming Battery Webinar 23 July 2025
  publish_date: 2025-07
  project_name: ARENA Grid-Forming Battery Portfolio (all projects)
  what_happened: There is currently no inertia market in the NEM, and the AEMC's June
    2025 draft determination proposed not to introduce one. The commercial value of
    inertia can only be captured through bilateral network support service agreements
    with an NSP, which creates uncertainty and limits revenue visibility for GFM BESS
    projects.
  lesson_learnt: In the absence of a formal inertia market, GFM BESS proponents must
    negotiate bilateral NSP agreements to capture the commercial value of synthetic
    inertia — project developers should engage with TNSPs early in the development
    phase to test appetite for and structure of such agreements, and model conservative
    revenue scenarios given the absence of a liquid market.
