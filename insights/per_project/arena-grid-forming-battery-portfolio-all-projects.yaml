- record_id: ARENA-DLV-70801
  source_title: Grid Forming Battery Webinar 23 July 2025
  publish_date: 2025-07
  project_name: ARENA Grid-Forming Battery Portfolio (all projects)
  what_happened: NER clause S5.2.5.5 (reactive current settling time) was cited as
    a key grid connection challenge across all four ARENA-funded GFM BESS projects,
    and both WGB and DPESS explicitly reported that further increasing plant inertia
    was infeasible due to constraints imposed by this clause. HPRX's inertial capacity
    was limited to 2,070 MWs of available 3,000 MWs primarily for the same reason.
  lesson_learnt: NER cl S5.2.5.5 reactive current settling time requirements directly
    constrain the inertial response that GFM BESS can be configured to provide — project
    teams should account for this regulatory ceiling early in design and engage with
    AEMO and NSPs to negotiate performance standards that reflect the holistic capabilities
    of GFM technology.
  issue_severity: major
  project_type: storage
  project_scale_band: utility/large-scale
