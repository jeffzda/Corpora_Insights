- record_id: ARENA-DLV-70807
  source_title: Grid Forming Battery Webinar 23 July 2025
  publish_date: 2025-07
  project_name: ARENA Grid-Forming Battery Portfolio (all projects)
  what_happened: Across all projects, the inertial response provided by GFM BESS was
    found to not be a like-for-like substitution for synchronous machines — key differences
    include OEM-specific variation in inertial response magnitude, dependency on active
    power headroom, and saturation at 1.2–1.3 per unit output compared to much higher
    limits for synchronous machines.
  lesson_learnt: GFM BESS synthetic inertia should not be assumed equivalent to synchronous
    machine inertia in system planning — project designers and system planners must
    account for OEM-specific inertial response characteristics, headroom constraints,
    and saturation limits when sizing GFM plant to meet inertia requirements.
