- record_id: ARENA-DLV-70819
  source_title: Grid Forming Battery Webinar 23 July 2025
  publish_date: 2025-07
  project_name: ARENA Grid-Forming Battery Portfolio (all projects)
  what_happened: Proponents across all four projects identified trade-offs between
    providing strong inertial response and effectively responding to voltage disturbances,
    particularly in weak grid areas, as well as the impact of headroom constraints
    and control architecture interactions on the inertial response available at any
    given time.
  lesson_learnt: GFM BESS project design must explicitly manage the trade-off between
    inertial response configuration and voltage disturbance response, especially in
    weak grid locations — system designers should conduct detailed small-signal and
    wide-area network studies during the design phase to optimise the control parameter
    settings for the specific network context rather than using default OEM configurations.
