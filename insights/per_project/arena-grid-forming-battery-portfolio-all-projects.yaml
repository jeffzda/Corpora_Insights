- record_id: ARENA-DLV-70816
  source_title: Grid Forming Battery Webinar 23 July 2025
  publish_date: 2025-07
  project_name: ARENA Grid-Forming Battery Portfolio (all projects)
  what_happened: Variation in GFM inverter implementations across OEMs means that
    inertial response characteristics, control architecture, and behaviour under grid
    disturbances differ materially between manufacturers, creating challenges for
    consistent specification, regulatory compliance, and network service contracting.
  lesson_learnt: The lack of standardisation across GFM OEM implementations creates
    uncertainty in project specification and regulatory compliance — proponents should
    require OEMs to provide detailed capability documentation against emerging standards
    (e.g. AEMO's Voluntary Specification) during procurement, and advocate for harmonised
    GFM standards to reduce project-level negotiation burden.
