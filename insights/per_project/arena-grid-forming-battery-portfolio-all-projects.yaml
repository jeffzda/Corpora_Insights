  failure_mode: regulatory & approvals
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Subsequent rule changes (April 2023 and May 2025) removed the
    reactive current settling time requirement from the Minimum Access Standard, reducing
    the constraint for future projects.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: battery storage
