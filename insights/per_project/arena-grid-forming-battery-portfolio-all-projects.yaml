- record_id: ARENA-DLV-70818
  source_title: Grid Forming Battery Webinar 23 July 2025
  publish_date: 2025-07
  project_name: ARENA Grid-Forming Battery Portfolio (all projects)
  what_happened: 'Key reforms between 2023 and 2025 progressively removed barriers
    to GFM BESS grid connection: the April 2023 rule change removed reactive current
    settling time from the Minimum Access Standard; the June 2024 change allowed GPS
    renegotiation under the 5.3.9 process to the lesser of current or existing standards;
    and the May 2025 Package 1 explicitly recognised that existing access standards
    may disincentivise beneficial grid-forming responses.'
  lesson_learnt: The regulatory environment for GFM BESS connection has materially
    improved since the first-wave projects — teams planning GFM projects should assess
    connection requirements under the updated NER standards rather than relying on
    lessons from HPRX or WGB, which were subject to significantly more onerous requirements,
    and should monitor the impact of May 2025 Package 1 changes as they are tested
    by new connections.
