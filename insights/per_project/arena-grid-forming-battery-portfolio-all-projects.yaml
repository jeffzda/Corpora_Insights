- record_id: ARENA-DLV-70817
  source_title: Grid Forming Battery Webinar 23 July 2025
  publish_date: 2025-07
  project_name: ARENA Grid-Forming Battery Portfolio (all projects)
  what_happened: Industry analysis (2024 Vysus Report commissioned by AEMO) found
    that only approximately 10% of installed IBR generation capacity needs to be GFM
    to achieve material system benefits, and the SSIAG framework has been structured
    to incentivise GFM adoption through the ability to self-remediate and avoid system
    strength charges.
  lesson_learnt: The SSIAG self-remediation framework creates a clear commercial incentive
    for new BESS projects to adopt GFM technology to avoid system strength charges
    — project developers should assess their likely system strength charge exposure
    early in development and evaluate GFM adoption as a cost-effective mitigation,
    particularly for DC-coupled hybrid solar-plus-storage projects.
