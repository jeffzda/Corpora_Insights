  what_happened: Measurement instrumentation and transducer accuracy were identified
    as having significant impacts on post-connection harmonic compliance assessment
    outcomes, with no prescriptive guidance existing in Australian standards on required
    transducer accuracy levels — meaning that REG plants could be assessed as non-compliant
    due to measurement artefacts rather than genuine emissions.
  lesson_learnt: REG proponents facing post-connection harmonic compliance assessments
    should verify the accuracy class of measurement transducers being used by the
    NSP — transducer errors can materially affect measured harmonic spectra and lead
    to incorrect non-compliance findings; prescriptive guidance on transducer accuracy
    requirements by voltage level does not currently exist in Australian standards
    and should be negotiated contractually.
