  source_title: University of Wollongong - Impact and Management of Harmonic Distortion
    for Large Renewable Generators - Project Summary
  publish_date: '2022'
  project_name: Impact and Management of Harmonic Distortion for Large Renewable Generators
  what_happened: Current Australian practice arithmetically sums harmonic emissions
    from multiple identical inverters within a renewable energy plant (i.e. assumes
    worst-case in-phase addition), but measured data from a real REG installation
    showed the actual total harmonic emissions were substantially lower than the arithmetic
    sum due to diversity between sources.
  lesson_learnt: REG proponents should challenge arithmetic summation assumptions
    in pre-connection harmonic assessments — measured diversity between identical
    inverters means worst-case summation systematically overstates plant emissions,
    often driving unnecessary mitigation requirements that field measurements subsequently
    show to be unwarranted.
