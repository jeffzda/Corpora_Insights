- record_id: ARENA-DLV-21062
  source_title: Harmonic Study – Large Renewable Energy Generators Final Report
  publish_date: 2022-05
  project_name: Harmonic Study – Large Renewable Energy Generators
  what_happened: Network harmonic impedance data provided to REG proponents for pre-connection
    studies varied significantly in approach across NSPs — ranging from a single impedance
    value (which cannot represent resonance) to impedance polygons of varying scope
    and weighting — with no consistent prescriptive methodology, resulting in assessments
    that may be overly conservative or miss critical resonance conditions.
  lesson_learnt: REG proponents should explicitly request the basis and scope of network
    impedance data from NSPs, including the range of operating scenarios modelled
    and whether resonance conditions and reactive plant status are included; a single
    impedance value scaled linearly with harmonic order cannot detect resonance and
    should be treated as inadequate for compliance studies.
