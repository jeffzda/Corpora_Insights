- record_id: ARENA-DLV-21057
  source_title: Harmonic Study – Large Renewable Energy Generators Final Report
  publish_date: 2022-05
  project_name: Harmonic Study – Large Renewable Energy Generators
  what_happened: A simplified network study found that applying harmonic filters at
    the PCC of each emitting plant required a total filter rating of 760 kVAr to manage
    12th harmonic non-compliance, whereas a single network-located filter at the point
    of resonance achieved the same outcome with only 20 kVAr — a 98% reduction in
    required reactive plant.
  lesson_learnt: Where network resonance is the root cause of harmonic non-compliance,
    mitigation placed at the network resonance point is dramatically more efficient
    than plant-level PCC filtering; NSPs and proponents should evaluate network-led
    (centralised) mitigation options before requiring individual plant filters, particularly
    in REZ-type networks with long lines.
  issue_severity: major
  project_type: generation
  project_scale_band: utility/large-scale
  lifecycle_phase: commissioning/integration
  proponent_type: project developer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Optimised mitigation study demonstrated that a single 20 kVAr
    filter at the network resonance point reduced 12th harmonic voltage to below planning
    levels across all busbars, versus 760 kVAr of distributed plant-level filters
    required under current practice.
  transferability: moderate
  delay_magnitude: null
  technology_domain: grid/system stability
  source_pages: &id007
  - 75
  - 84
  evidence_excerpt: A revision to the existing approach was then considered, in which
    mitigation was instead connected directly to the point of the network where the
    harmonic voltage magnitude was highest. The required filter size required was
    20 kVAr, (noting that the sum total for the PCC filter solution, provided in Table
    5.3 was 760 kVAr). The centralised filter option results in 98 % less reactive
    power being connected to the network.
