  source_title: Harmonic Study – Large Renewable Energy Generators Final Report
  publish_date: 2022-05
  project_name: Harmonic Study – Large Renewable Energy Generators
  what_happened: The cost of passive harmonic filters required under current pre-connection
    compliance processes was found to be material — described as potentially up to
    several million dollars for a large solar or wind farm — with additional cost
    and delay risk if retrofitted post-commissioning.
  lesson_learnt: Budget contingency for large REG projects should explicitly include
    harmonic filter costs, and developers should pursue pre-connection clarity on
    emission allocation methodology to avoid expensive post-commissioning retrofit;
    retrofit is consistently more expensive than integration at design stage and may
    require plant shutdown.
