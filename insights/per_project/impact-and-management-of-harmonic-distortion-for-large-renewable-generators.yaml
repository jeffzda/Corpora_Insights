- record_id: ARENA-DLV-21055
  source_title: Harmonic Study – Large Renewable Energy Generators Final Report
  publish_date: 2022-05
  project_name: Harmonic Study – Large Renewable Energy Generators
  what_happened: Field measurements from a single wind farm feeder containing eight
    identical inverters showed that for even harmonic orders (2nd, 4th and above)
    and most non-characteristic orders, the arithmetic sum of individual generator
    emissions exceeded the collector group minimum measurement threshold while the
    actual measured collector current was consistently below that threshold — indicating
    near-complete cancellation for significant measurement periods.
  lesson_learnt: For non-characteristic and even harmonic orders, the assumption of
    no phase-angle diversity between identical inverters is particularly pessimistic;
    pre-connection studies should apply at minimum the IEC summation law exponents
    (α>1), not arithmetic summation, especially for these orders — doing so may eliminate
    the need for harmonic filtering entirely.
