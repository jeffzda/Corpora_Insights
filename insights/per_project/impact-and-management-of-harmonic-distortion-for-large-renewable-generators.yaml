  what_happened: The fixed harmonic allocation methodology, while simpler to apply,
    allocates between 9% and 26% of the emission limit that the network forecast methodology
    would assign to the same connection, meaning REG proponents connecting under a
    fixed-allocation jurisdiction face significantly tighter limits and a far higher
    likelihood of being required to install costly harmonic filters.
  lesson_learnt: REG developers should determine which allocation methodology applies
    in their jurisdiction at the earliest stage of connection planning — the choice
    of methodology can alter the allocated emission limit by up to an order of magnitude
