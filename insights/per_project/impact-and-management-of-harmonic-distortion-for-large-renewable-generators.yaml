- record_id: ARENA-DLV-40105
  source_title: University of Wollongong - Impact and Management of Harmonic Distortion
    for Large Renewable Generators - Project Summary
  publish_date: '2022'
  project_name: Impact and Management of Harmonic Distortion for Large Renewable Generators
  what_happened: Modelling of high-REG-penetration networks identified that harmonic
    levels commonly exceed maximum allowable levels in remote areas due to remote
    resonance — a phenomenon where connecting infrastructure (cables, transformers,
    capacitor banks) alters network impedance and amplifies distortion levels far
    from the source.
  lesson_learnt: REG projects in remote or long-feeder network locations should explicitly
    assess remote resonance risk during pre-connection design — infrastructure upgrades
    associated with REG connection can amplify harmonic distortion at distant nodes,
    potentially triggering compliance failures or mitigation requirements for installations
    unrelated to the new connection.
