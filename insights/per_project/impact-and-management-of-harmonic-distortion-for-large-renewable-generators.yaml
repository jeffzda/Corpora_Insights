  what_happened: Review of Australian harmonic emission allocation practices found
    that the most commonly applied network forecast allocation methodology is likely
    too conservative, resulting in widespread requirements for harmonic mitigation
    equipment to be installed by renewable energy generator proponents even as measured
    harmonic distortion levels have been declining across the network.
  lesson_learnt: REG proponents and network operators should be aware that existing
    harmonic allocation methodologies are likely over-conservative and may be mandating
    costly mitigation (potentially millions of dollars per site) that measurement
    data suggests is unnecessary — independent verification of allocation outputs
    against measured trends should be conducted before committing to mitigation investment.
