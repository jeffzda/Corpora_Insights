  publish_date: '2022'
  project_name: Impact and Management of Harmonic Distortion for Large Renewable Generators
  what_happened: Non-compliance with harmonic emission limits at the post-connection
    stage can require plant shutdown and retrofit installation of harmonic filters,
    representing a major operational and financial risk that existing compliance assessment
    frameworks do not adequately prevent due to inaccurate pre-connection modelling.
  lesson_learnt: REG project financiers and operators should treat post-connection
    harmonic non-compliance as a material project risk requiring explicit contingency
    — the combination of inaccurate pre-connection modelling and inconsistent NSP
    compliance assessment methodologies means that plants approved for connection
    can subsequently be found non-compliant, requiring costly retrofit and potentially
    curtailment or outage periods.
