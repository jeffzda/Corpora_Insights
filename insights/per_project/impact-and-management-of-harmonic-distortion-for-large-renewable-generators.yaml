  source_title: Harmonic Study – Large Renewable Energy Generators Final Report
  publish_date: 2022-05
  project_name: Harmonic Study – Large Renewable Energy Generators
  what_happened: Plant-level PCC harmonic filtering installed across multiple REG
    plants to address 12th harmonic non-compliance caused a 250% amplification of
    15th harmonic voltage at one busbar — demonstrating that piecemeal plant-level
    mitigation can create new resonance problems at other harmonic orders.
  lesson_learnt: Before specifying plant-level harmonic filters, the cumulative impact
    of multiple filters on network resonant frequencies must be modelled; installing
    filters individually without a whole-of-network view is likely to shift resonances
    and create new non-compliance at other harmonic orders, compounding the management
    problem.
