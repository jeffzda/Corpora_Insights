  what_happened: Pre-connection harmonic compliance modelling of inverter-based resources
    was found to be inaccurate, with multiple cases identified by project partners
    where modelling indicated mitigation was required but post-connection field measurements
    showed filtering was unnecessary — meaning proponents installed costly harmonic
    filters that served no practical purpose.
  lesson_learnt: REG proponents required to install harmonic filters based solely
    on pre-connection modelling should negotiate a post-connection measurement period
    before finalising mitigation commitments — evidence shows pre-connection modelling
    systematically overstates emissions from inverter-based resources, and post-connection
    measurement may demonstrate that installed mitigation is unnecessary.
