  project_name: Impact and Management of Harmonic Distortion for Large Renewable Generators
  what_happened: Australian Standard AS/NZS 61000.3.6 was found to be insufficient
    for compliance assessment in the complexity of situations encountered in practice,
    leading individual network operators to develop their own bespoke compliance assessment
    methodologies that vary markedly between jurisdictions — creating inconsistency
    and conservative outcomes for REG proponents.
  lesson_learnt: REG developers operating across multiple jurisdictions must account
    for materially different harmonic compliance assessment methodologies in each
    NSP's area — the absence of a nationally consistent standard means that identical
    plant configurations may face different mitigation requirements in different states,
    and early engagement with the relevant NSP to understand their specific methodology
    is essential.
