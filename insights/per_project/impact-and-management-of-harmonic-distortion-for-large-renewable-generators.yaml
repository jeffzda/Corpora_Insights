  source_title: Harmonic Study – Large Renewable Energy Generators Final Report
  publish_date: 2022-05
  project_name: Harmonic Study – Large Renewable Energy Generators
  what_happened: The project found that there are no agreed guidelines for generic
    harmonic modelling of combined power electronic equipment, and that OEM data provided
    for pre-connection studies is often limited, inconsistently generated and not
    accompanied by information on the network conditions under which the model is
    valid — forcing consultants to make assumptions that introduce unquantifiable
    error.
  lesson_learnt: 'When commissioning pre-connection harmonic studies, proponents should
    insist that OEM-supplied harmonic models include: the network conditions (SCR,
    voltage, background distortion) under which they were derived, the modelling approach
    used (e.g. Norton equivalent derivation), and sensitivity results across at least
    three operating scenarios; absence of this information should be treated as a
    data quality flag requiring escalation to the NSP.'
