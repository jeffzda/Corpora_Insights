  what_happened: Retirement of synchronous generators, projected to reach 63% of existing
    synchronous capacity lost from the NEM by 2040 per AEMO's ISP, will remove the
    low-impedance harmonic damping they provide — progressively increasing network
    harmonic impedance and reducing harmonic absorption capacity for all future REG
    connections.
