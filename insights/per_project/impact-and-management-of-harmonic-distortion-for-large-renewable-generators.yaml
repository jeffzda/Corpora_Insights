- record_id: ARENA-DLV-21051
  source_title: Harmonic Study – Large Renewable Energy Generators Final Report
  publish_date: 2022-05
  project_name: Harmonic Study – Large Renewable Energy Generators
  what_happened: Existing harmonic emission limit allocation methodologies applied
    in Australian networks were found to be not fit for purpose for large-scale REG
    connections — creating significant technical, financial and administrative barriers
    to renewable energy deployment in the NEM.
  lesson_learnt: Network operators and REG proponents should recognise that the current
    IEC-based allocation framework, while the best available, contains substantial
    limitations when applied to networks with long feeders, high REG penetration and
    future uncertainty; blind application without engineering judgement will result
    in over-conservative emission limits and unnecessary mitigation costs.
