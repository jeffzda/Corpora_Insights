  project_name: Harmonic Study – Large Renewable Energy Generators
  what_happened: Harmonic non-compliance across all eight REG connection stages in
    the full network study was restricted to non-characteristic (even, non-6k±1) harmonic
    orders — attributed to the combination of network resonances aligned with these
    orders and comparatively lower harmonic voltage planning levels for even harmonics,
    both of which are exacerbated by REG inverter emissions.
  lesson_learnt: REG project developers and NSPs should pay particular attention to
    non-characteristic (even and triplen) harmonic orders during connection studies
    for networks with long feeders or existing capacitive plant, as planning levels
    are lower for these orders and REG inverters actively emit them — the combination
    creates non-compliance risk that traditional characteristic-order-focused assessments
    will miss.
