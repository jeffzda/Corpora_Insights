  source_title: Harmonic Study – Large Renewable Energy Generators Final Report
  publish_date: 2022-05
  project_name: Harmonic Study – Large Renewable Energy Generators
  what_happened: OEM-supplied harmonic emission models for inverters are typically
    based on a single set of network operating conditions, with the OEM determining
    those conditions — yet harmonic emissions of power electronic devices have been
    shown to vary significantly with background harmonic voltage, fundamental voltage
    magnitude, network unbalance and inverter operating set-point; this mismatch causes
    both over- and under-estimation in compliance studies.
  lesson_learnt: Proponents undertaking pre-connection harmonic studies should request
    multi-condition harmonic emission models from inverter OEMs (covering the range
    of expected network conditions), and should document the network conditions under
    which OEM-supplied models were validated; reliance on a single emission spectrum
    from an undisclosed test condition introduces unquantifiable error into compliance
    assessments.
