  source_title: Harmonic Study – Large Renewable Energy Generators Final Report
  publish_date: 2022-05
  project_name: Harmonic Study – Large Renewable Energy Generators
  what_happened: Long underground and submarine reticulation cables within large REG
    plants introduce significant capacitance that shifts network harmonic resonant
    frequencies to lower, more problematic values — an effect that is more pronounced
    in weaker networks and can create resonances coinciding with harmonic orders at
    which planning limits are lower.
  lesson_learnt: Pre-connection harmonic studies for wind and solar farms must include
    full RLC modelling of internal reticulation cable networks, not simplified inductive-only
    models; omitting cable capacitance will miss resonance conditions that can cause
    planning level exceedances even when all plants appear compliant under inductive
    assumptions.
