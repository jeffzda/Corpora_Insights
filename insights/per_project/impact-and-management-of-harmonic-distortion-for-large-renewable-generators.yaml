  project_name: Harmonic Study – Large Renewable Energy Generators
  what_happened: 'Harmonic impedance polygons used for pre-connection compliance studies
    were found to have several limitations including: lack of weighting for likely
    operating scenarios, exclusion of committed (not yet connected) installations,
    and potential omission of reactive plant; the least-likely high-impedance scenarios
    often drove compliance outcomes, increasing the probability of over-designing
    mitigation.'
  lesson_learnt: When reviewing harmonic impedance polygons provided by an NSP, proponents
    should query whether committed installations, reactive plant service status and
    the likelihood weighting of scenarios have been accounted for; arbitrary exclusion
    of the top 5% of impedance values without reviewing whether those scenarios are
    operationally representative is not conservative and should be challenged.
