- record_id: ARENA-DLV-21054
  source_title: Harmonic Study – Large Renewable Energy Generators Final Report
  publish_date: 2022-05
  project_name: Harmonic Study – Large Renewable Energy Generators
  what_happened: The current practice of arithmetically summing harmonic emissions
    from identical inverters within a REG plant (i.e. assuming zero diversity, α=1
    for all harmonic orders) was demonstrated through field measurements to be highly
    pessimistic — actual measured collector-group harmonic current was frequently
    far lower than the arithmetic sum, with some harmonic orders showing near-complete
    cancellation.
  lesson_learnt: Pre-connection compliance studies for solar and wind farms should
    not default to arithmetic summation (α=1) of harmonic emissions from identical
    inverters; diversity exists at all harmonic orders and increases with frequency
    — applying default summation law exponents or, better, empirically validated diversity
    factors will reduce over-estimation and avoid unnecessary mitigation requirements.
  issue_severity: major
  project_type: generation
  project_scale_band: utility/large-scale
  lifecycle_phase: development/design
  proponent_type: project developer
  delay_category: approvals/regulatory
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Case study using field measurements from an operating REG demonstrated
    that diversity exists; research team recommended further measurement campaigns
    across different technologies and network conditions to validate appropriate α
    values.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: wind
  source_pages: &id004
  - 48
  - 57
  - 60
  evidence_excerpt: The present practice of assuming no diversity between such sources
    for the purposes of undertaking harmonic modelling and pre-connection compliance
    assessment studies is capable of leading to significant error. The implications
    of this error include requirement for harmonic mitigation to be installed that
    is not required once commissioning of the plant is complete as well as inappropriately
    designed mitigation, resulting in increased costs for the proponent.
  confidence_note: technology_domain set to wind as the case study was a wind farm;
    finding also applies to solar PV.
