  what_happened: Monitoring data from Dutch NSPs showed that substations near newly
    commissioned large offshore wind farms (Gemini, Westermeerwind, Eneco Luchterduinen,
    Borssele) experienced stable or declining Total Harmonic Distortion (THD) levels,
    with a spike observed during commissioning periods attributed to inverter controller
    modifications.
  lesson_learnt: Commissioning of large REG plants should include a temporary enhanced
    harmonic monitoring regime at nearby network substations, as THD spikes during
    inverter controller tuning are common and may trigger compliance concerns; these
    spikes typically resolve once commissioning is complete and should not automatically
    be treated as a permanent performance issue.
