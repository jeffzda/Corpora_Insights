- record_id: ARENA-DLV-21052
  source_title: Harmonic Study – Large Renewable Energy Generators Final Report
  publish_date: 2022-05
  project_name: Harmonic Study – Large Renewable Energy Generators
  what_happened: Pre-connection harmonic compliance assessment processes in Australia
    commonly require REG proponents to install passive harmonic filters before connection
    is approved, due to conservative assumptions in emission modelling — even when
    post-connection measurements subsequently show filtering is unnecessary.
  lesson_learnt: Pre-connection compliance assessment should not automatically require
    mitigation based on worst-case modelling assumptions; proponents and NSPs should
    insist on evidence-based, technically robust compliance methodologies, and should
    seek conditional (Stage 3) connections where modelling uncertainty is high, to
    avoid costly over-mitigation.
