- record_id: ARENA-DLV-21061
  source_title: Harmonic Study – Large Renewable Energy Generators Final Report
  publish_date: 2022-05
  project_name: Harmonic Study – Large Renewable Energy Generators
  what_happened: The Australian Standard AS/NZS 61000.3.6 and the National Electricity
    Rules reference only the 2001 version of IEC TR 61000-3-6, which has since been
    updated; the normative reference to an outdated Technical Report — itself a document
    that failed to achieve international consensus — has created regulatory lock-in
    to a methodology that is known to be insufficient for networks with high REG penetration.
  lesson_learnt: Regulatory and standards frameworks referencing harmonic management
    documents should be reviewed and updated to reflect the current state of knowledge;
    proponents and NSPs should flag reliance on the 2001 version of AS/NZS 61000.3.6
    in connection negotiations and seek application of the 2012 version and supplementary
    ENA guidance as a minimum.
