  what_happened: The IEEE fixed allocation methodology, when applied to a long-feeder
    network scenario, allocated only 41% of the harmonic current emission limit that
    the IEC method would allocate; for a generator connection specifically, the IEEE
    method allocated just 9% of the IEC limit — a result of the IEEE's blanket restriction
    requiring all generators to receive the lowest allowable emission limit regardless
    of network strength.
  lesson_learnt: The IEEE Std 519 fixed allocation methodology should not be used
    as the primary allocation framework for large REG connections to Australian networks,
    particularly in networks with long feeders — it is excessively conservative for
    generators and will almost certainly require mitigation that would not be triggered
    under the IEC methodology; proponents connecting to networks where IEEE-based
    methodologies are applied should seek to negotiate IEC-based allocation.
