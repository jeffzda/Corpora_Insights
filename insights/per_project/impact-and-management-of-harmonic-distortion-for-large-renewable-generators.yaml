- record_id: ARENA-DLV-21056
  source_title: Harmonic Study – Large Renewable Energy Generators Final Report
  publish_date: 2022-05
  project_name: Harmonic Study – Large Renewable Energy Generators
  what_happened: Modelling of a proposed Australian Renewable Energy Zone (REZ) with
    up to 4 GW of REG penetration showed that harmonic non-compliance was restricted
    to remote busbars in Zone 5, located approximately 200 km from the nearest REG
    plant, due to remote resonance — not at the connection points of the emitting
    plants.
  lesson_learnt: Harmonic compliance assessments for REG connections in REZ-type networks
    must extend beyond the point of connection to evaluate remote resonance effects;
    the current practice of assessing only at the PCC will miss the actual points
    of non-compliance, leading to either false confidence or misdirected mitigation.
