- record_id: ARENA-DLV-58768
  source_title: Lake Bonney Project Summary
  publish_date: '2020'
  project_name: Lake Bonney BESS
  what_happened: An EPC contract structure was selected for delivery of the BESS,
    with Tesla as EPC contractor and CPP as principal subcontractor. This simplified
    performance guarantee measurement, removed interface risk between battery and
    BoP works, and consolidated counterparty management — though Infigen noted the
    EPC structure may be less appropriate if battery equipment costs fall materially.
  lesson_learnt: An EPC structure is well-suited to BESS projects where battery equipment
    costs dominate total project value — the risk premium for subcontracted works
    is a small fraction of contract value and the simplification of performance guarantees
    and interface risk management outweighs the premium. Revisit this structure as
    battery equipment costs fall, as the risk premium may become a material portion
    of total cost.
