- record_id: ARENA-DLV-33705
  source_title: Lake Bonney BESS - Final KS Report
  publish_date: 2023-02
  project_name: Lake Bonney BESS
  what_happened: During vendor evaluation, Iberdrola Australia found significant inconsistency
    in how battery system parameters were reported across different Li-ion proposals,
    including differences in energy cycle definitions, depth-of-discharge allowances,
    and the measurement point for rated parameters. This required additional diligence
    to correctly compare proposals and risked incorrect valuations being passed into
    the business case.
  lesson_learnt: 'When procuring battery systems, require all suppliers to report
    parameters against a common set of definitions — specifically: energy cycle definition
    (including regulation services cycling), usable versus gross storage capacity
    (DoD-adjusted), and the measurement point (inverter AC terminals vs. grid connection
    point). Without this, proposals cannot be directly compared and a developer may
    over- or under-value a bid.'
  issue_severity: minor
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: procurement
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: Iberdrola Australia applied additional diligence in normalising
    each proposal to a consistent parameter basis before passing information into
    project valuation.
  transferability: broad
  delay_magnitude: null
  technology_domain: battery storage
  source_pages:
  - 30
  - 38
  evidence_excerpt: A key takeaway from comparing the different technical capabilities
    of proposed systems was that there was little cohesiveness in how the parameters
