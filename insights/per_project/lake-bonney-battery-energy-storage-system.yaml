  what_happened: The BESS required a temporary frequency deadband agreed with AEMO
    during the period when the mandatory PFR 6-point droop curve functionality was
    being developed by Tesla. Once the OEM completed development and implemented the
    6-point droop, the BESS could respond to narrow deviations with a higher droop
    coefficient to limit additional cycling while maintaining the agreed 1.7% droop
    from a wider deadband.
  lesson_learnt: When configuring a BESS for mandatory PFR compliance, check whether
    the OEM's firmware supports a 6-point droop curve before commissioning — this
    functionality allows the battery to respond to narrow frequency deviations with
    a higher droop coefficient to limit battery cycling while meeting the agreed droop
    setting from a wider deadband, and its absence requires a temporary agreed configuration
    with AEMO.
