- record_id: ARENA-DLV-33713
  source_title: Lake Bonney BESS - Final KS Report
  publish_date: 2023-02
  project_name: Lake Bonney BESS
  what_happened: During the 31 January 2020 SA separation event, AEMO constrained
    the Lake Bonney BESS in the energy and regulation FCAS markets so that it could
    reserve power and energy storage capacity for contingency FCAS. This meant the
    BESS was not available to physically hedge Iberdrola Australia's contract exposure
    or to reduce LBWF's CPF exposure through regulation FCAS participation during
    the islanding event.
  lesson_learnt: A co-located BESS cannot be relied upon to hedge portfolio energy
    or regulation FCAS exposure during an SA islanding event — AEMO will likely constrain
    the BESS to contingency FCAS reserve. CPF exposure management must therefore be
    addressed prospectively through BESS configuration (e.g. frequency deadband tightening)
    in the weeks before potential separation events, not reactively during them.
