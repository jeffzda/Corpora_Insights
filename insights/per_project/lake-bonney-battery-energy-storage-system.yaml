  what_happened: 'The Lake Bonney BESS project demonstrated that co-locating a BESS
    with an existing wind farm on land already owned by the proponent delivered meaningful
    development advantages: no landowner negotiations, avoided cost of a new HV transformer,
    simpler brownfield development approval, and the potential for behind-the-meter
    charging.'
  lesson_learnt: Co-location of a BESS at an existing wind farm owned by the proponent
    can significantly reduce development cost and timeline — particularly by avoiding
    landowner negotiations, minimising grid augmentation costs, and simplifying development
    approvals. However, this advantage must be weighed against the system strength
    and FSSIA risks introduced by connecting into a potentially weak part of the grid.
