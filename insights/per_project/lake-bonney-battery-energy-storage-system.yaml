  source_title: 'Lake Bonney Operational Report #1'
  publish_date: '2020'
  project_name: Lake Bonney BESS
  what_happened: During a high-price energy event on 19 December 2019, Tesla's AutoBidder
    software indicated the BESS should begin dispatching before 18:00, but a human
    operator overrode this decision and conserved state of charge, correctly anticipating
    an unforecasted high-price event. The BESS discharged throughout the most valuable
    hour at $14,700/MWh, capturing significantly more revenue than the automated strategy
    would have.
  lesson_learnt: Do not rely solely on automated bidding software for dispatch decisions
    — a human operator with market experience can interpret pre-dispatch price signals
    probabilistically and make 'least regret' decisions that automated systems miss,
    particularly when pre-dispatch prices are not reflective of likely outcomes.
