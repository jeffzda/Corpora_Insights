  what_happened: The Lake Bonney BESS project that began exploring storage in 2015
    could not be developed without grant funding, primarily due to high capital costs,
    lack of market signals, and uncertainty around FCAS market integration. The combination
    of the SA Government RTF ($5M) and ARENA Advancing Renewables Program ($5M) made
    the business case viable in 2018.
