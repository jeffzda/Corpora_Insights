- record_id: ARENA-DLV-33702
  source_title: Lake Bonney BESS - Final KS Report
  publish_date: 2023-02
  project_name: Lake Bonney BESS
  what_happened: The FSSIA process required Iberdrola Australia to obtain updated
    simulation models from the OEMs of the existing Lake Bonney Wind Farm units so
    they were compatible with both the state-wide and site-specific PSCAD models.
    It was unclear what the course of action would have been if the wind farm was
    owned by a separate entity or if OEM cooperation could not be secured, creating
    a project risk that was not adequately anticipated.
  lesson_learnt: When connecting a new generator to a brownfield site, account for
    the risk that legacy models of co-located or nearby generators may have shortcomings
    that block FSSIA completion — applicants have no control over third-party model
    quality and the resolution process can add months to the schedule. Engage the
    system model developer (e.g. Manitoba Hydro) early and ensure confidentiality
    arrangements are in place before the FSSIA begins.
