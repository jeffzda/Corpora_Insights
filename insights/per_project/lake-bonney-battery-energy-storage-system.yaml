    without grant co-funding — revenue uncertainty (particularly over long-term FCAS
    pricing) and high capital costs required external support to meet investment criteria.
    Revenue models for battery projects must explicitly address FCAS market participation,
    as FCAS accounted for 70% of the revised revenue forecast.
