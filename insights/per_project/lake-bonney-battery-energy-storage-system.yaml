  source_title: Lake Bonney Project Summary
  publish_date: '2020'
  project_name: Lake Bonney BESS
  what_happened: Brownfield construction at the LBWF site required the BESS bench
    to be located on the ridge side rather than the top, due to wind turbine exclusion
    zones and underground cable constraints, increasing the volume of bulk earthworks.
    The resulting bench location also happened to contain high-concentration subsurface
    limestone, compounding earthwork difficulty.
  lesson_learnt: Brownfield BESS sites impose placement constraints from existing
    infrastructure (turbine exclusion zones, underground cables) that can force a
    non-optimal bench location and increase earthwork volumes and cost. Detailed site
    constraint mapping — including exclusion zones and cable routes — should be completed
    before finalising the BESS layout to ensure civil cost estimates reflect actual
    earthwork volumes.
