  what_happened: The shift from 30-minute to 5-minute (dispatch interval) energy settlement
    — pending in the NEM during the reporting period — was identified as likely to
    materially change the revenue opportunity for battery storage by removing uncertainty
    in trading interval prices and creating clearer price signals, while also introducing
    new risks around missed single-interval price spikes.
  lesson_learnt: 'BESS operators should model both the upside and downside of 5-minute
    settlement reform: clearer price signals and increased volatility may expand arbitrage
    opportunities, but missing a single dispatch interval spike under 5-minute settlement
    forfeits that value entirely, unlike under 30-minute settlement where adjacent
    intervals can partially offset the miss.'
