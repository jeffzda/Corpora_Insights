  project_name: Lake Bonney BESS
  what_happened: During the first three months of 5-minute settlement (October–December
    2021), Lake Bonney BESS achieved substantially lower energy charging revenues
    than an optimally dispatched energy-only battery model ($0.12/kW vs $12.03/kW),
    primarily because of difficulty forecasting negative prices in real time and instances
    of the battery charging at above-cap (>$300/MWh) prices. The BESS also missed
    some extreme high-price discharge events due to maintenance outages and high portfolio
    generation levels.
  lesson_learnt: Under 5-minute settlement, a BESS co-optimised across energy and
    FCAS markets will underperform an energy-only optimal benchmark primarily due
    to real-time negative price forecasting difficulty and state-of-charge management
    constraints — focus operational improvements on negative price forecasting capability
    and ensure maintenance outages are not scheduled during periods of elevated volatility
    risk.
