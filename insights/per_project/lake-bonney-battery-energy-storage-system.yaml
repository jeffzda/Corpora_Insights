- record_id: ARENA-DLV-67851
  source_title: 'Operational Report #2 – Lake Bonney BESS'
  publish_date: '2021'
  project_name: Lake Bonney BESS
  what_happened: During the second half of 2020, limited price volatility in the SA
    region of the NEM (only five dispatch intervals above $1,000/MWh in the energy
    market across Q3 and Q4, compared with 34 in Q1) significantly reduced revenue
    available to the Lake Bonney BESS relative to the first reporting period.
  lesson_learnt: Battery storage revenue is highly sensitive to market price volatility;
    proponents should model revenue scenarios across low-volatility market conditions
    and not rely on high-spike periods to underpin business cases — regulation FCAS
    markets provided more stable revenue (62% of total) and buffered against energy
    market volatility.
