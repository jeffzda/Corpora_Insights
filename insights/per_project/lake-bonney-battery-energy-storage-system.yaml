  source_title: 'Lake Bonney Operational Report #1'
  publish_date: '2020'
  project_name: Lake Bonney BESS
  what_happened: Energy arbitrage revenue for the Lake Bonney BESS was highly concentrated
    on a small number of extreme price events — almost half of total energy revenue
    for the seven-month reporting period was earned during a single high-price event
    on 19 December 2019. In months without significant price volatility, energy arbitrage
    revenue was negligible.
  lesson_learnt: A purely energy arbitrage strategy is unlikely to generate consistent
    revenue for a 2-hour BESS in the SA NEM — the 50% PoE daily price spread is typically
    insufficient to cover round-trip efficiency losses and MLF differences; FCAS market
    participation should be the primary revenue strategy, with arbitrage treated as
    an opportunistic supplement.
