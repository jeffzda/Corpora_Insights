  what_happened: The ESCOSA licence process for the Lake Bonney BESS was noted to
    have a compressed timeline between finalisation of pre-requisite agreements and
    targeted energisation, relative to large-scale wind or solar farms. Although the
    licence did not ultimately delay energisation (other project issues caused more
    significant delays), the mismatch between the process structure and the BESS project
    timeline was identified as a potential future risk.
