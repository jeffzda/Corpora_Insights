- record_id: ARENA-DLV-33716
  source_title: Lake Bonney BESS - Final KS Report
  publish_date: 2023-02
  project_name: Lake Bonney BESS
  what_happened: An FCAS trapezium stranding issue was identified during operations
    where the BESS registered an initial MW value outside the ±25MW range, preventing
    it from dispatching into the FCAS markets in the subsequent dispatch interval.
    This was a previously unrecognised technical risk with commercial implications
    for BESS revenue, and is considered to be of greatest risk to battery systems
    given the amount of time they operate at rated capacity while providing FCAS.
  lesson_learnt: FCAS trapezium stranding — where a BESS registers an initial dispatch
    interval MW value outside its FCAS capacity band and is excluded from the next
    interval's FCAS dispatch — is a material commercial risk for utility-scale batteries
    operating close to rated capacity; identify this risk during commissioning and
    implement a data recording or control logic fix in collaboration with AEMO and
    the NSP before going live in FCAS markets.
  issue_severity: moderate
  project_type: storage
  project_scale_band: first commercial/FOAK
