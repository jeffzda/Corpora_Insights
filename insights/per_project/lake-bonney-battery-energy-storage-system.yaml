  source_title: Lake Bonney Project Summary
  publish_date: '2020'
  project_name: Lake Bonney BESS
  what_happened: Grid connection energisation was delayed by approximately 8 months
    (forecast February 2019, achieved October 2019) due to difficulties completing
    the Full System Strength Impact Assessment (FSSIA) and GPS negotiations, with
    multiple iterations of PSSe/PSCAD models required to resolve non-compliances identified
    by AEMO and ElectraNet.
  lesson_learnt: Assess system strength at the proposed connection point before finalising
    site selection — the FSSIA process was underestimated at project inception and
    became the single largest source of schedule delay, preventing revenue generation
    for the duration of the delay. Projects at weak-grid brownfield sites should budget
    12+ months for grid connection studies.
