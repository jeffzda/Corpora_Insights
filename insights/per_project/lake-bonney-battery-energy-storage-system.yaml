  evidence_excerpt: A key reason for this is the value of a human operator being able
    to interpret the price signals seen in AEMO's pre-dispatch prices (which the AutoBidder
    relies upon to optimise its bidding strategy) and assess the probabilistic outcome
    of those prices being realised. A human operator is also well placed to make 'least
    regret' decisions... The potential downside in conserving the BESS' state of charge
    and potentially missing out on a $379/MWh energy price is minimal compared to
    the potential upside of capturing an energy price at $14,700/MWh.
