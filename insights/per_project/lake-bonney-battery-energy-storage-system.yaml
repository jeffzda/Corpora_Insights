  what_happened: 'Lake Bonney BESS actual revenues over the first two years of operations
    substantially exceeded the financial model provided to ARENA in September 2018:
    total actual revenues were $20.4m versus $8.7m modelled (a 133% outperformance).
    Year 1 contingency FCAS revenues alone were $8.1m actual versus $0.9m modelled,
    largely driven by the February 2020 SA separation event. Regulation FCAS revenues
    also substantially exceeded modelled expectations.'
  lesson_learnt: Pre-FID revenue models for utility-scale BESS in the NEM should apply
    wide uncertainty ranges around contingency FCAS revenues — extreme and infrequent
    system events (such as regional separation) can generate revenues several times
    larger than modelled expectations in a single month, and the BESS' value as a
    portfolio hedge against such events may be systematically underestimated in standalone
    battery valuations.
