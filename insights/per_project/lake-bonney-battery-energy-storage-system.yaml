  project_name: Lake Bonney BESS
  what_happened: As distributed rooftop PV grew in South Australia, it increasingly
    influenced operational demand and created price volatility conditions that were
    difficult to forecast in real time. The BESS was at risk of missing negative price
    charging opportunities or being caught with sub-optimal state of charge during
    sudden demand changes driven by cloud cover over Adelaide.
  lesson_learnt: For BESS operators in markets with high distributed PV penetration,
    supplement AEMO's operational demand forecasts with independent real-time weather
    monitoring (e.g. satellite cloud cover tracking, local gas turbine team updates)
    — distributed PV-driven demand changes are a leading cause of unforecast price
    volatility and missed BESS dispatch opportunities.
