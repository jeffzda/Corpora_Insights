  source_title: Lake Bonney Project Summary
  publish_date: '2020'
  project_name: Lake Bonney BESS
  what_happened: The new GPS requirements introduced by AEMC rule change (Rule 2018-10,
    effective 5 October 2018) applied to Lake Bonney BESS because the GPS could not
    be agreed before 1 February 2019 due to modelling issues, requiring GPS modifications.
    In practice the impact was limited as SA's ESCOSA technical requirements already
    incorporated most of the new standards.
  lesson_learnt: Connection applications submitted before a GPS rule change transitional
    deadline may still be caught by the new requirements if modelling delays prevent
    agreement of GPS within the transitional period — budget for the possibility that
    new technical performance standards will apply and engage AEMO early to understand
    transition risk for projects with complex modelling requirements.
