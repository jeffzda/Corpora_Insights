  project_name: Lake Bonney BESS
  what_happened: Due to competing production priorities at Tesla's Gigafactory, only
    approximately 200 of the 300 required Powerpack units could be delivered in time
    for the originally planned energisation, resulting in a staged deployment — an
    initial 25MW/33MWh configuration followed by full 52MWh capacity in Q1 2019.
  lesson_learnt: When battery OEM supply comes from a single factory serving global
    demand, build staged delivery contingency into the contract and schedule from
    the outset — supplier production constraints can prevent delivery of the full
    energy capacity at energisation. Confirm factory allocation and delivery schedule
    as early as possible, and assess whether a staged deployment is commercially acceptable
    before contract execution.
