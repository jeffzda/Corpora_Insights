  what_happened: The introduction of mandatory Primary Frequency Response (PFR) from
    September 2020 significantly tightened the NEM frequency distribution, reducing
    the number of frequency deviations outside the Normal Operating Frequency Band
    (NOFB) and thereby reducing the number of physical contingency FCAS responses
    provided by Lake Bonney BESS. This also reduced the potential CPF management benefit
    from tight deadband operation identified in the CPF trial.
  lesson_learnt: The commercial value of BESS-based CPF management for co-located
    wind farms has been materially eroded by the introduction of mandatory PFR, which
    tightened NEM frequency distribution and reduced the frequency deviation opportunities
    the BESS needs to earn positive factors — this revenue stream should not be relied
    upon in post-PFR business cases without current market analysis.
