- record_id: ARENA-DLV-58778
  source_title: Lake Bonney Project Summary
  publish_date: '2020'
  project_name: Lake Bonney BESS
  what_happened: Connecting the substation extension busbar required an outage that
    reduced LBWF generation capacity by 135MW. Planned outages of the Mayurra substation
    occur only every 3–6 months and are controlled by ElectraNet. On this project
    the grid connection delays inadvertently aligned physical connection works with
    a scheduled outage, avoiding an unplanned outage cost. However, the LBWF outage
    duration was extended by the connection works.
  lesson_learnt: At the outset of project scheduling, identify the frequency and timing
    of planned network outages required for connection works and plan construction
    activities accordingly. If grid connection delays are unlikely to push works past
    the next scheduled outage, the costs of an unplanned outage (estimated at $75,000/day
    for 135MW) will likely exceed the cost of any schedule delay. Include this outage
    cost explicitly in financial models.
