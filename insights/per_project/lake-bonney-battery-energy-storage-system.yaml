  source_title: Lake Bonney BESS - Final KS Report
  publish_date: 2023-02
  project_name: Lake Bonney BESS
  what_happened: The Lake Bonney BESS business case was developed and assessed as
    an integrated component of Iberdrola Australia's broader South Australian generation
    and customer portfolio, rather than as a standalone asset. This approach led to
    a favourable investment decision despite long-term standalone revenue uncertainty,
    as portfolio hedge benefits (e.g. FCAS cost offsets for LBWF) and diversification
    across nine spot markets provided value that a standalone BESS analysis would
    not have captured.
  lesson_learnt: Evaluate utility-scale BESS investments as portfolio assets rather
    than standalone projects — co-located BESS provides a physical hedge against FCAS
    market costs for associated wind farms, and portfolio diversification across energy
    and FCAS markets can justify investment even where standalone revenue projections
    are uncertain.
