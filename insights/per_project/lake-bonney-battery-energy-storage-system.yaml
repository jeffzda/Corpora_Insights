  publish_date: 2023-02
  project_name: Lake Bonney BESS
  what_happened: A CPF management trial conducted over two weeks in August 2020 demonstrated
    that tightening the BESS frequency deadband from ±0.15Hz to ±0.035Hz allowed the
    BESS to accumulate large positive LNEF/RNEF factors, improving the combined Lake
    Bonney market participant CPF by 39 over an indicative 28-day period — equivalent
    to a 31–100% reduction (averaging 65%) in CPF recovery cost exposure. The additional
    energy throughput due to tighter deadbands was 5.16 MWh/day (~37 additional cycles
    per year).
  lesson_learnt: Pre-investment CPF modelling for BESS co-located with wind farms
    can be validated through short operational trials; tightening frequency deadbands
    is an effective strategy to accumulate positive LNEF/RNEF values and offset wind
    farm CPF exposure, but the ongoing commercial value depends on shifting market
    factors including frequency distribution, FCAS prices, and energy price variance
    that must be continuously monitored.
