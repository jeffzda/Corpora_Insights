  what_happened: Long-term battery revenue modelling at Lake Bonney BESS relied on
    linear program (LP) dispatch models whose accuracy was constrained by the quality
    of price forecasts used as inputs. Despite the LP correctly reflecting battery
    dispatch mechanics, the inherent uncertainty of long-term NEM price forecasts
    limited the reliability of project valuations.
  lesson_learnt: Battery revenue modelling using LP dispatch models is technically
    sound for replicating NEM co-optimisation, but long-term project valuations remain
    highly sensitive to price forecast quality — decision-makers should apply scenario
    ranges and sensitivity analysis rather than relying on point estimates, and acknowledge
    that forecast uncertainty is the binding constraint on valuation accuracy.
