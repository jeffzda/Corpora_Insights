    were subject to an administered price cap of $300/MW/h after the cumulative price
    threshold was breached in the Raise 6 Seconds market at 07:25 on 1 February 2020.
    This cap was in place until 4 February 2020, limiting maximum settlement prices
    across all eight FCAS markets.
