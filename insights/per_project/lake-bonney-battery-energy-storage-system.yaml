- record_id: ARENA-DLV-33718
  source_title: Lake Bonney BESS - Final KS Report
  publish_date: 2023-02
  project_name: Lake Bonney BESS
  what_happened: Iberdrola Australia found that relying solely on Tesla's AutoBidder
    software for BESS dispatch optimisation left value on the table in volatile market
    conditions. Human operators were able to interpret pre-dispatch price signals
    probabilistically and make 'least regret' decisions — such as conserving state
    of charge for potential $14,700/MWh events rather than discharging at $379/MWh
    — that the automated system could not replicate.
  lesson_learnt: Do not rely solely on automated bidding software for BESS dispatch
    in a volatile NEM environment — human operator oversight adds material value by
    interpreting pre-dispatch price signals probabilistically and making asymmetric
    'least regret' decisions that automated systems optimising on current signals
    cannot replicate.
  issue_severity: none
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: no major failure stated
