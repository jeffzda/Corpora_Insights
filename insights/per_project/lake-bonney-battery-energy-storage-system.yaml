  source_title: Lake Bonney Project Summary
  publish_date: '2020'
  project_name: Lake Bonney BESS
  what_happened: Because the Lake Bonney BESS is connected behind the same point as
    LBWF stages 2 and 3, connecting the BESS 'behind the meter' to capture curtailed
    wind generation would have required reopening the LBWF GPS and registration, which
    Infigen assessed as too high a risk. The behind-the-meter charging option was
    therefore not implemented at commissioning.
  lesson_learnt: Avoid configurations that require reopening an existing generator's
    GPS unless the commercial benefit clearly justifies the risk — in a weak-grid
    area, reopening a GPS can trigger a new round of system strength assessments.
    If behind-the-meter BESS charging is a targeted benefit of co-location, assess
    and resolve the GPS implications during the development phase before the connection
    design is finalised.
