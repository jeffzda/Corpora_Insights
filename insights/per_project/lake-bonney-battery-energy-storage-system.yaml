- record_id: ARENA-DLV-33704
  source_title: Lake Bonney BESS - Final KS Report
  publish_date: 2023-02
  project_name: Lake Bonney BESS
  what_happened: The original development approval submission assumed the site layout
    and equipment dimensions would remain fixed, as micro-siting variability typical
    of wind turbines was not expected to apply to a BESS. Design optimisation during
    development subsequently altered the project layout, requiring a variation to
    the development plan consent.
  lesson_learnt: Submit development applications for BESS projects using conservative
    (larger) site dimensions to allow for design optimisation without triggering a
    variation to consent. Unlike wind turbine micro-siting, BESS layout changes are
    driven by design refinement and are likely, so building in buffer dimensions at
    application stage avoids the time and cost of a variation.
  issue_severity: minor
  project_type: storage
