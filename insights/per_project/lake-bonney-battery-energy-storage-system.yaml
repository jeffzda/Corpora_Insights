- record_id: ARENA-DLV-67859
  source_title: 'Operational Report #2 – Lake Bonney BESS'
  publish_date: '2021'
  project_name: Lake Bonney BESS
  what_happened: The market participant registration for the Lake Bonney BESS was
    required to be identical to that of the Lake Bonney Wind Farm (both under Lake
    Bonney Wind Power Pty Ltd) in order for the BESS's positive CPF contributions
    to offset the wind farm's negative CPF and benefit the combined market participant.
    This structural requirement was a necessary condition for the CPF management strategy
    to work and had to be identified and implemented before the trial.
  lesson_learnt: When co-locating a BESS with a wind farm to manage the wind farm's
    Causer Pays Factor exposure, ensure the BESS and wind farm are registered under
    the same NEM market participant — misaligned registrations will prevent positive
    BESS CPF contributions from offsetting negative wind farm factors, nullifying
    the CPF management strategy.
  issue_severity: minor
