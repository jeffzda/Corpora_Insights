    the BESS could reduce wind farm CPF exposure, the associated cost savings were
    not monitored on an ongoing basis, and post-mandatory PFR implementation, CPF
    benefits became a by-product of the standard PFR configuration rather than an
    actively managed revenue stream.
  lesson_learnt: CPF management via BESS should not be modelled as a discrete, reliably-captured
    revenue line in battery project business cases — the benefit depends on market
    conditions that change materially (such as mandatory PFR), and the mechanism by
    which savings accrue to the portfolio (reduced reimbursement costs vs. direct
    revenue) makes ongoing measurement and attribution difficult.
