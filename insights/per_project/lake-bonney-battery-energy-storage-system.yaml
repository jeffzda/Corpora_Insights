  project_name: Lake Bonney BESS
  what_happened: The Lake Bonney BESS used a wrapped EPC contract structure where
    performance guarantees (including energy retention) were provided at the grid
    point of connection from a single counterparty (Tesla). This approach consolidated
    performance risk under one party and ensured that the operational regime was designed
    around maintaining warranty provisions.
  lesson_learnt: Procure utility-scale BESS under a wrapped EPC structure with performance
    and energy retention guarantees provided at the grid point of connection by a
    single counterparty — this simplifies accountability, reduces interface risk between
    inverter OEM and balance-of-plant, and ensures warranty provisions can be maintained
    through operational regime design.
