  source_title: Lake Bonney Project Summary
  publish_date: '2020'
  project_name: Lake Bonney BESS
  what_happened: 'Revenue model construction for the Lake Bonney BESS identified two
    operating costs specific to battery projects that could be easily overlooked in
    financial modelling: LGC surrender obligations (due to round-trip losses making
    the BESS a net consumer of energy) and wind farm outage costs during energisation
    and commissioning testing (one transformer taken offline reduced LBWF capacity
    by 135MW).'
  lesson_learnt: Battery project financial models must account for LGC surrender costs
    arising from round-trip efficiency losses, and for the cost of outages to co-located
    generators during energisation and commissioning. An estimated cost of $75,000
    per day for a 135MW outage illustrates the materiality — these costs should be
    explicitly modelled, not left as unquantified risks.
