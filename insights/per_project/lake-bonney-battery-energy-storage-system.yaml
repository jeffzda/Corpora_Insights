  what_happened: Battery packs shipped pre-charged were left waiting for an extended
    period due to energisation delays, causing state of charge to approach minimum
    healthy levels. A trickle charge had to be supplied to maintain battery cell health
    prior to energisation.
  lesson_learnt: When energisation delays are likely — particularly on projects with
    complex grid connection processes — include provisions for maintaining battery
    pack state of charge during storage. This requires power supply infrastructure
    to be available at the site before energisation and should be budgeted as a contingency
    cost.
