  source_title: Lake Bonney Project Summary
  publish_date: '2020'
  project_name: Lake Bonney BESS
  what_happened: During initial geotechnical studies for the substation extension,
    an unidentified Telstra cable and wind farm fibre optic communication and protection
    cables were discovered in the construction area, requiring relocation before earthworks
    could proceed. This delayed commencement of earthworks by approximately 2 weeks.
  lesson_earnt: Conduct proactive underground service identification — including exploratory
    works in the substation extension area — during the project development phase
    rather than relying on as-built drawings alone. This allows time to contract relocation
    works and incorporate them into the project schedule before construction commences.
  lesson_learnt: Conduct proactive underground service identification — including
    exploratory works in the substation extension area — during the project development
    phase rather than relying on as-built drawings alone. This allows time to contract
    relocation works and incorporate them into the project schedule before construction
    commences.
