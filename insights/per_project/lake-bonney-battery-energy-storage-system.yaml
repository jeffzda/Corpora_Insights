- record_id: ARENA-DLV-33701
  source_title: Lake Bonney BESS - Final KS Report
  publish_date: 2023-02
  project_name: Lake Bonney BESS
  what_happened: The system strength shortfall at the Lake Bonney wind farm point
    of connection was not adequately assessed during site selection. A Full System
    Strength Impact Assessment (FSSIA) was required and its timeline impact was underestimated,
    as the FSSIA process and modelling capabilities had only come into practice in
    July 2018. This prevented the project from achieving commercial operation on schedule
    and delayed revenue generation.
  lesson_learnt: Battery revenue models should be calibrated against observed dispatch
    data from comparable operating assets — early models overestimated arbitrage and
    underestimated FCAS revenue. Use linear program dispatch models incorporating
    NEM co-optimisation constraints, and apply FCAS price forecasts not just energy
    price forecasts. Note that long-term FCAS price certainty is low, making battery
    valuations inherently uncertain.
  issue_severity: major
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: concept/feasibility
  proponent_type: utility/energy retailer
  delay_category: grid connection/system studies
  failure_mode: poor scoping
  outcome_class: delayed but recoverable
  secondary_failure_mode: regulatory & approvals
  intervention_note: Revised the dispatch model to reflect HPR's observed FCAS-heavy
    dispatch profile; developed linear program models for ongoing performance benchmarking
    and future project valuation.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages:
  - 37
  - 41
  - 42
  evidence_excerpt: A major consideration that was overlooked in the site selection
    of the Lake Bonney BESS during this period was the system strength of the grid
    at the LBWF point of connection. When the original connection enquiry for the
    Lake Bonney BESS was undertaken, it indicated that there was a shortfall in system
    strength in the area and a Full System Strength Impact Assessment (FSSIA) may
    be required. The impact that the FSSIA would have on the project timeline was
    underestimated at the time with the process and modelling capabilities to fulfil
    the assessment not fully understood, only coming into practice in July 2018. While
    these delays did not add significant capital costs, they did prevent the project
    from generating revenue because of the late achievement of commercial operation.
  confidence_note: Canonical record merged from 2 source records across 2 document(s).
