- record_id: ARENA-DLV-58770
  source_title: Lake Bonney Project Summary
  publish_date: '2020'
  project_name: Lake Bonney BESS
  what_happened: AEMO had not provided clear guidance on allowable droop settings
    for BESS contingency FCAS registration prior to January 2019. Different BESS installations
    in the NEM registered vastly different proportions of nameplate capacity in contingency
    FCAS markets (0–100%), creating significant uncertainty in revenue modelling for
    new projects.
  lesson_learnt: Obtain explicit written confirmation from AEMO of the allowable droop
    setting and registerable contingency FCAS capacity for a specific BESS installation
    before finalising the revenue model — the difference between a 0.7% and 1.7% droop
    setting translates to a large difference in registered capacity and therefore
    revenue. Conservative assumptions (40% of nameplate) should be used as a base
    case until clarity is obtained.
