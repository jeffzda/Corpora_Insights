- record_id: ARENA-DLV-43856
  source_title: 'Lake Bonney Operational Report #1'
  publish_date: '2020'
  project_name: Lake Bonney BESS
  what_happened: During the 31 January 2020 SA islanding event, Lake Bonney BESS was
    constrained from participating in the regulation FCAS markets, preventing it from
    earning sufficient regulation revenue to offset the Lake Bonney market participant's
    Causer Pays Factor (CPF) reimbursement costs. The CPF used for reimbursement calculations
    was determined weeks before the event and could not be adjusted retroactively.
  lesson_learnt: CPF exposure cannot be reliably hedged through active regulation
    FCAS market participation alone — BESS operators should proactively configure
    the BESS to minimise CPF at the time it is calculated (e.g. via frequency response
    configuration), rather than depending on the ability to hedge it later through
    market participation that may be constrained during high-price events.
