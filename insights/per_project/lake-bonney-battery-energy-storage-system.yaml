  source_title: Lake Bonney BESS - Final KS Report
  publish_date: 2023-02
  project_name: Lake Bonney BESS
  what_happened: Modelling of 5-minute settlement (5MS) revenue uplift for energy-only
    battery systems showed a 29% increase in revenue for a 1-hour storage system versus
    30-minute settlement, but only a 9% increase for a 4-hour storage system. The
    additional flexibility provided by 5MS for state-of-charge management during prolonged
    high-price events is less valuable for longer-duration batteries that can simply
    discharge throughout the entire event under either settlement regime.
  lesson_learnt: Project developers and investors evaluating the economics of longer-duration
    battery storage should not assume that 5MS benefits scale with storage size —
    the revenue uplift from 5MS is disproportionately captured by shorter-duration
    batteries, and longer-duration storage economics should be assessed independently
    of 5MS flexibility benefits.
