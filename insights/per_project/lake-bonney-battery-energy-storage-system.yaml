- record_id: ARENA-DLV-43852
  source_title: 'Lake Bonney Operational Report #1'
  publish_date: '2020'
  project_name: Lake Bonney BESS
  what_happened: During the 31 January 2020 SA separation event, Lake Bonney BESS
    continued tracking its AGC signal while system frequency was outside the Normal
    Operating Frequency Band (NOFB). This was not the preferred AEMO configuration
    — AEMO's preference is that the AGC setpoint be frozen when frequency moves outside
    the NOFB, with the contingency droop response applied supplementary. Infigen was
    unaware of this requirement prior to the event.
  lesson_learnt: Before commissioning a utility-scale BESS for NEM operation, confirm
    AGC control logic behaviour during frequency excursion events with AEMO — specifically
    whether the AGC setpoint should be frozen when frequency exits the NOFB; this
    configuration is not automatically implemented and requires explicit discussion
    with the market operator.
