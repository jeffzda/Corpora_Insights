  project_name: Lake Bonney BESS
  what_happened: AEMO registration for the Lake Bonney BESS as both a generator and
    a load proved more complex than anticipated due to the novelty of the battery
    category — including uncertainties around aggregation of individual units and
    allowable ramp rates — and the difficulty of finalising SCADA points lists, deploying
    into AEMO's pre-production environment, and setting up data sharing agreements
    across Infigen's asset portfolio.
  lesson_learnt: Allow at least three months for AEMO registration for a new BESS,
    and begin the SCADA points list finalisation process as early as the asset is
    sufficiently built to support end-to-end testing. For batteries, engage AEMO early
    on registration category (generator and/or load), aggregation methodology, and
    allowable ramp rates, as these were unresolved novel questions at the time of
    the Lake Bonney BESS registration.
