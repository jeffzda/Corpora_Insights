  evidence_excerpt: Under 5-minute settlement rules, it has become increasingly important
    to ensure that high Energy prices are captured within each dispatch interval as
    the increased arbitrage opportunities are no longer averaged out over a full 30-minute
    trading interval. To ensure that the maximum value of Energy market volatility
    can be captured by the Lake Bonney BESS, continual improvements have been made
    to the bidding strategies managed by the Operational Control Centre.
