    rather than as standalone assets — a regulatory change that reduces BESS FCAS
    revenue may simultaneously reduce FCAS costs for co-located wind assets, so the
    net portfolio impact can be neutral or positive. Standalone battery revenue models
    that ignore portfolio interactions will mis-value the asset.
