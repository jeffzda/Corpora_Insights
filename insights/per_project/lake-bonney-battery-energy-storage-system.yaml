  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: Infigen ensured both Lake Bonney BESS and LBWF were registered
    under the same NEM market participant (Lake Bonney Wind Power Pty Ltd) prior to
    commencing the CPF trial.
  transferability: narrow
  delay_magnitude: null
  technology_domain: battery storage
