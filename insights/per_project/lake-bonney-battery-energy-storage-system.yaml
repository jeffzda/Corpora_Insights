  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: poor scoping
  intervention_note: Infigen engaged Manitoba Hydro (the SA system model developer)
    under a confidentiality agreement to investigate root causes; ElectraNet subsequently
    engaged Manitoba Hydro directly to resolve issues related to other market participants.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages:
  - 4
  - 41
