- record_id: ARENA-DLV-58754
  source_title: Lake Bonney Project Summary
  publish_date: '2020'
  project_name: Lake Bonney BESS
  what_happened: GPS negotiations with AEMO and ElectraNet were forecast to be agreed
    by October 2018 but were not finalised until September 2019 — an 11-month delay.
    Key issues included difficulty meeting the automatic access standard for reactive
    capability due to a lower-rated inverter model, ambiguity in short circuit ratio
    definitions, and disputes over whether modelling results represented real issues
    or modelling artefacts.
  lesson_learnt: Confirm inverter specifications — particularly reactive capability
    — before the GPS is submitted, as a reduction in inverter rating during procurement
    can prevent compliance with the automatic access standard and extend GPS negotiations
    by many months. Engage AEMO and the NSP early to agree SCR definitions and modelling
    interpretation standards before formal studies begin.
