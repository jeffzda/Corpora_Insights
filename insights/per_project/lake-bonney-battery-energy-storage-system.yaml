  project_name: Lake Bonney BESS
  what_happened: ElectraNet's requirement to have an executed Transmission Connection
    Agreement (TCA) before undertaking works on site was not fully understood during
    project development and was not reflected in the construction schedule. Grid modelling
    delays extended the time before the TCA could be executed, creating a dependency
    that disrupted construction sequencing.
  lesson_learnt: Understand all pre-conditions required before a network service provider
    will execute a connection agreement and integrate these dependencies explicitly
    into the project schedule — particularly when construction works are needed prior
    to finalisation of Generator Performance Standards and the FSSIA.
