  project_name: Lake Bonney BESS
  what_happened: The CPF management trial also increased the average daily energy
    throughput of Lake Bonney BESS by 5.16MWh (approximately 37 additional cycles
    per year) due to the tightened frequency deadbands, introducing an additional
    cycling cost that must be weighed against the CPF benefit when evaluating the
    strategy's net commercial value.
  lesson_learnt: CPF management via tightened frequency deadbands involves a real
    cycling cost that reduces battery life and foregone FCAS/energy revenue — operators
    must compare the cost of additional cycles against CPF recovery savings on an
    ongoing basis, particularly as market conditions (FCAS prices, energy price spreads,
    frequency distribution) shift; Infigen's validated CPF model provides a replicable
    framework for this assessment.
