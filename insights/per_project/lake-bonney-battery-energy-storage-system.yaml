  what_happened: Regulation FCAS markets were the dominant revenue stream for Lake
    Bonney BESS during the second half of 2020, contributing 62% of total revenues,
    while contingency FCAS contributed 22% and energy market revenue contributed 16%.
    This revenue mix differed materially from expectations based on market conditions
    in the first half of 2020 when contingency FCAS prices were more volatile.
  lesson_learnt: Regulation FCAS provides a more stable revenue base for BESS than
    contingency FCAS or energy arbitrage in low-volatility market periods; BESS business
    cases and operating strategies should weight regulation FCAS as a reliable baseline
    revenue source and treat contingency FCAS and energy arbitrage as opportunistic
    upside dependent on market conditions.
