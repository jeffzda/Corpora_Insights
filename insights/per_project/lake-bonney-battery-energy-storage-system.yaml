  what_happened: AEMO's minimum allowable droop setting for BESS contingency FCAS
    registration is fixed at 1.7% regardless of battery capacity, with no published
    guidance on circumstances under which an alternative limit might be approved.
    This constrains the registerable contingency FCAS capacity of the battery and
    limits revenue certainty for project development.
  lesson_learnt: When developing the business case for a utility-scale BESS, note
    that AEMO's 1.7% minimum droop setting caps effective contingency FCAS registration
    capacity — seek early engagement with AEMO on any alternative droop limit approval
    pathway and factor the constraint into revenue projections rather than assuming
    full registration capacity is achievable.
