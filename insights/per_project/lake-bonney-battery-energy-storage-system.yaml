    on a 35MW regulation FCAS local procurement constraint in South Australia. In
    October 2018, AEMO removed this constraint, eliminating a portion of the projected
    revenue for a standalone battery project. The project's portfolio context (offsetting
    FCAS costs for the co-located wind farm) partially mitigated this impact, but
    the assumption was no longer valid.
