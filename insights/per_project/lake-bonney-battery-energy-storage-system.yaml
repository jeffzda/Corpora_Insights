  what_happened: Because GPS negotiations and FSSIA were still ongoing when substation
    construction works needed to commence, ElectraNet declined to undertake site works
    without an executed Transmission Connection Agreement (TCA), creating a coordination
    conflict that had not been anticipated in the project schedule.
  lesson_learnt: Understand and schedule all contractual pre-conditions for each counterparty's
    works — ElectraNet's requirement for an executed TCA before commencing site works
    was not reflected in the original project schedule. For future projects where
    grid studies may be delayed, plan for the possibility of construction works being
    required before a TCA is executed, and establish contractual fallback mechanisms
    in advance.
