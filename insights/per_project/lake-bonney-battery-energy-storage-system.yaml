  source_title: Lake Bonney Operational Report 3 and 4
  publish_date: '2022'
  project_name: Lake Bonney Battery Energy Storage System (BESS)
  what_happened: The shift to 5-minute settlement caused renewable generators in SA
    to change their bidding behaviour — moving away from floor bids of -$1,000/MWh
    (previously risk-managed by 30-minute averaging) to bids reflecting short-run
    marginal costs of approximately -$40/MWh, which reduced the magnitude of negative
    price events and therefore the revenue available to batteries from charging during
    these periods.
  lesson_learnt: Under 5MS, BESS operators must implement standing bids in higher
    price bands to ensure the dispatch engine considers the battery for high-price
    dispatch intervals even when pre-dispatch prices do not signal a spike — continual
    improvement of bidding strategies is required as participant behaviour under the
    new regime evolves.
  issue_severity: minor
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: commercial & market
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Iberdrola Australia implemented standing bid offers in higher
    energy market price bands to ensure NEMDE considers Lake Bonney BESS dispatch
    during high-price intervals regardless of pre-dispatch forecasts.
  transferability: broad
  delay_magnitude: null
  technology_domain: battery storage
  source_pages:
