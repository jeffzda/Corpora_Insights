  source_title: Lake Bonney Project Summary
  publish_date: '2020'
  project_name: Lake Bonney BESS
  what_happened: ElectraNet introduced a Coordination Deed requirement late in TCA
    negotiations — a document aggregating emission obligations (harmonic distortion,
    voltage unbalance, voltage fluctuation) across all four generators connected to
    Mayurra substation. This was a condition precedent to TCA execution but was not
    flagged or detailed until very late in the process.
  lesson_learnt: When connecting to a substation shared with other generators, investigate
    whether a Coordination Deed or similar aggregated emissions obligation instrument
    will be required as a condition precedent to the TCA — this can impose obligations
    above NER requirements and link asset sale decisions to third-party coordination.
    Raise this with the NSP early in TCA negotiations rather than allowing it to emerge
    as a late-stage condition.
