- record_id: ARENA-DLV-58771
  source_title: Lake Bonney Project Summary
  publish_date: '2020'
  project_name: Lake Bonney BESS
  what_happened: The Lake Bonney BESS is connected to the same 33/132kV transformer
    as 135MW of LBWF capacity. The transformer had no spare capacity under normal
    conditions when LBWF was at full output, preventing simultaneous battery discharge
    and full wind farm operation. A transformer overload rating was negotiated with
    ElectraNet to allow a 10-minute overload to 156.1MVA specifically for contingency
    FCAS responses when grid frequency falls below 49.85Hz.
  lesson_learnt: When co-locating a BESS at an existing wind farm, assess transformer
    capacity constraints at the design stage and model their impact on battery dispatch
    and contingency FCAS registration. Where a transformer constraint limits BESS
    output, engage the NSP early to negotiate an overload rating for short-duration
    contingency responses — this can enable full FCAS registration without requiring
    transformer augmentation.
