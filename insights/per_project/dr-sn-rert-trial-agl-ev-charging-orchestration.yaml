  project_name: DR SN RERT Trial — AGL EV charging orchestration
  what_happened: In Year 3, AGL successfully demonstrated that home charging of privately-owned EVs could be controlled to avoid system peaks, leading AGL to apply for and receive ARENA funding for a much
    larger EV charging orchestration trial announced in November 2020.
  lesson_learnt: EV home charging presents a controllable and scalable DR resource that customers appear more willing to accept than HVAC control; demonstrating EV charging orchestration in a small DR trial
    can provide sufficient evidence to justify and access funding for a larger, more comprehensive follow-on program.
