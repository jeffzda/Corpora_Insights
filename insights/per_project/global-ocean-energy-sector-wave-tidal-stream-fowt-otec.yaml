- record_id: ARENA-DLV-50001
  source_title: Ocean Energy Report by Seanergy and Ernst and Young
  publish_date: 2016-06
  project_name: Global Ocean Energy Sector (wave, tidal stream, FOWT, OTEC)
  what_happened: Strong technical challenges resulting from the difficulty of working
    in an offshore environment slowed the expected pace of ocean energy development
    over several years prior to 2016, raising uncertainties for commercial deployment
    in the medium term. Most ocean energy technologies remained at early testing stage
    despite years of R&D investment.
  lesson_learnt: Project schedules and commercialisation timelines for offshore energy
    technologies should incorporate substantial contingency for the additional technical
    complexity of the marine environment; developers and funders should not assume
    that onshore or nearshore timelines will transfer to open-ocean deployments.
