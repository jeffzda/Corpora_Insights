- record_id: ARENA-DLV-50026
  source_title: Ocean Energy Report by Seanergy and Ernst and Young
  publish_date: 2016-06
  project_name: Proposed Changes to ARENA Funding Model (2016)
  what_happened: In March 2016, the Federal Government announced a new EUR 893 m Clean
    Energy Innovation Fund to commence in July 2016, to be run by ARENA and CEFC,
    shifting from grants to equity and debt investment with projects required to repay
    loans at an interest rate 1% above the government's long-term borrowing rate.
    This was identified as likely to impact the domestic ocean energy market.
  lesson_learnt: A shift from grant-based to loan-based public funding for first-of-kind
    ocean energy technologies increases the financing burden on technology developers
    at a stage where revenue streams are not yet established; funders considering
    this transition should assess whether the technology maturity and revenue certainty
    of target projects is sufficient to service debt obligations before applying loan
    structures.
