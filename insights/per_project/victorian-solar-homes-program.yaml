  source_title: ARENA's Virtual Power Plant Knowledge Sharing Workshop Summary
  publish_date: 2019-03
  project_name: Victorian Solar Homes Program
  what_happened: The Victorian Solar Homes Program ($1.24 billion over 10 years) identified
    product supply constraints as a key issue for the battery component, alongside
    the need for future-proofing standards and DER hosting capacity data.
  lesson_learnt: Large-scale government battery programs should address product supply
    constraints, DER hosting capacity data, and future-proofing standards in program
    design — failure to secure supply and grid capacity information will delay rollout
    and reduce program effectiveness.
