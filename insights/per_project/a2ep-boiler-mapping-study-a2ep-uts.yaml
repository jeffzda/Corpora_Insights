- record_id: ARENA-DLV-2570
  source_title: 'ARENA Insights Hot Decarbonisation Webinar: Renewable Heat and Energy
    Efficiency at Industrial Facilities'
  publish_date: 2024-10
  project_name: A2EP Boiler Mapping Study (A2EP / UTS)
  what_happened: A national boiler mapping study across 78 industrial sites and 180
    burners/boilers found that almost 40% of burners are due for replacement or major
    overhaul within the next five years, representing a near-term window to transition
    to renewable heat technologies rather than like-for-like replacement of gas equipment.
  lesson_learnt: Industrial decarbonisation programmes should target the ~40% of industrial
    burners due for replacement within five years — asset replacement cycles create
    the lowest-cost opportunity to switch to renewable heat, and policy and project
    pipelines should be timed to coincide with these windows.
