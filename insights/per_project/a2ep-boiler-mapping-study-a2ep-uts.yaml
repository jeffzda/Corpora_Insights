- record_id: ARENA-DLV-2572
  source_title: 'ARENA Insights Hot Decarbonisation Webinar: Renewable Heat and Energy
    Efficiency at Industrial Facilities'
  publish_date: 2024-10
  project_name: A2EP Boiler Mapping Study (A2EP / UTS)
  what_happened: Among industrial sites that knew their decarbonisation pathway, electrification
    was the most commonly expected approach (34% of burners), followed by biogas (10%),
    biomass (20%), and bio-gas/hydrogen (1%), while 35% of respondents did not know
    their decarbonisation pathway.
  lesson_learnt: Electrification is the dominant expected decarbonisation pathway
    for industrial heat in Australia, but a large proportion of industrial operators
    have not yet identified a pathway — programme design should address this awareness
    gap and support operators in assessing electrification viability for their specific
    temperature requirements.
