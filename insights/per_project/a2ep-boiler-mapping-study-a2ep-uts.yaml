- record_id: ARENA-DLV-2571
  source_title: 'ARENA Insights Hot Decarbonisation Webinar: Renewable Heat and Energy
    Efficiency at Industrial Facilities'
  publish_date: 2024-10
  project_name: A2EP Boiler Mapping Study (A2EP / UTS)
  what_happened: The boiler mapping study found significant data gaps for several
    high-emitting sectors including wood, bricks, cement, steel, oil and gas, and
    chemicals, meaning the national picture of industrial heat demand and decarbonisation
    potential remains incomplete for these industries.
  lesson_learnt: Industrial heat decarbonisation planning is hampered by data gaps
    in key sectors — targeted data collection programmes for wood, bricks, cement,
    steel, oil and gas, and chemicals are needed before sector-level decarbonisation
    pathways can be reliably assessed.
