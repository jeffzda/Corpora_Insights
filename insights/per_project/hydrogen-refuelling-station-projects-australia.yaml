  source_title: ARENA Insights Forum Session Summaries and Key Points
  publish_date: 2022-11
  project_name: Hydrogen Refuelling Station projects (Australia)
  what_happened: Development approvals for HRS projects were found to be difficult
    and lengthy because no established regulatory process exists for this technology
    type in Australia. Each project effectively had to navigate approvals without
    a standard pathway.
  lesson_learnt: Allow substantial contingency time for development approvals on first-of-type
    hydrogen refuelling stations — there is no established approvals process in Australia
    and each project must educate regulators and build community acceptance from scratch,
    making approvals timelines highly unpredictable.
