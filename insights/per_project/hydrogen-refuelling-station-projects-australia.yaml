- record_id: ARENA-DLV-69007
  source_title: ARENA Insights Forum Session Summaries and Key Points
  publish_date: 2022-11
  project_name: Hydrogen Refuelling Station projects (Australia)
  what_happened: HRS projects found that the key commercial challenge was refuelling
    consecutive vehicles economically and safely. 'Peakiness' of demand — concentrated
    refuelling events — was identified as one of the most difficult operational and
    commercial challenges.
  lesson_learnt: Model demand peakiness explicitly during HRS design — concentrated
    refuelling events drive storage sizing, compression capacity, and safety system
    requirements, and underestimating peak demand patterns leads to either operational
    failure or over-capitalisation.
