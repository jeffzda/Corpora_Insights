- record_id: ARENA-DLV-69005
  source_title: ARENA Insights Forum Session Summaries and Key Points
  publish_date: 2022-11
  project_name: Hydrogen Refuelling Station projects (Australia)
  what_happened: HRS projects relied on a global supply chain that was significantly
    disrupted by the war in Ukraine. Key components — electrolyser (Vietnam), compressors
    (US), high-pressure storage vessels (Germany), and low-pressure buffer tank (Australia)
    — were all sourced internationally, increasing procurement risk and lead time
    uncertainty.
  lesson_learnt: Map the full international supply chain for HRS components early
    in project development and build contingency for geopolitical disruption — the
    multi-country sourcing of critical components (electrolyser, compressors, pressure
    vessels) creates significant schedule vulnerability to global supply chain shocks.
  issue_severity: major
  project_type: enabling infrastructure
  project_scale_band: first commercial/FOAK
