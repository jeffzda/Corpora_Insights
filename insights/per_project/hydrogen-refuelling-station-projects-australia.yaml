- record_id: ARENA-DLV-69004
  source_title: ARENA Insights Forum Session Summaries and Key Points
  publish_date: 2022-11
  project_name: Hydrogen Refuelling Station projects (Australia)
  what_happened: A small budget was initially allocated for electricity supply works,
    but high fault levels on-site triggered an unforeseen requirement for a dedicated
    33kV supply and associated civil and electrical works, substantially increasing
    project cost.
  lesson_learnt: Conduct detailed electrical network fault level assessments before
    finalising budgets for hydrogen projects — unexpected fault levels can trigger
    requirements for dedicated high-voltage supply infrastructure that materially
    exceed initial electrical cost allowances.
