- record_id: ARENA-DLV-69010
  source_title: ARENA Insights Forum Session Summaries and Key Points
  publish_date: 2022-11
  project_name: Hydrogen Refuelling Station projects (Australia)
  what_happened: HRS projects found that while the electrolyser itself represented
    approximately 50% of project cost, the balance-of-plant — dispensers, storage,
    pipeline, and electrical connections — required significant engineering effort
    and was not straightforward to integrate.
  lesson_learnt: Do not treat electrolyser procurement as equivalent to project delivery
    — balance-of-plant integration (dispensers, storage, pipeline, electrical connections)
    is technically complex, represents ~50% of project cost, and requires dedicated
    engineering resourcing to make the whole system work.
  issue_severity: moderate
  project_type: enabling infrastructure
  project_scale_band: first commercial/FOAK
  lifecycle_phase: construction/installation
  proponent_type: project developer
  delay_category: commissioning/integration
