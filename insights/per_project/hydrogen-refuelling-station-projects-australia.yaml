- record_id: ARENA-DLV-69002
  source_title: ARENA Insights Forum Session Summaries and Key Points
  publish_date: 2022-11
  project_name: Hydrogen Refuelling Station projects (Australia)
  what_happened: Engineering capacity for hydrogen refuelling station (HRS) projects
    was identified as a significant constraint in Australia, with limited specialist
    engineers available domestically. Projects were found to benefit materially from
    early involvement of an owner's engineer.
  lesson_learnt: Appoint an owner's engineer at the earliest stage of HRS development
    — domestic engineering capacity for hydrogen projects is limited in Australia
    and late engagement leads to gaps in technical oversight and project risk management.
  issue_severity: moderate
  project_type: enabling infrastructure
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: project developer
  delay_category: internal governance/resourcing
  failure_mode: coordination & stakeholders
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Projects that engaged an owner's engineer early reported better
    management of technical complexity across the full system (electrolyser, dispensers,
    storage, pipeline, electrical connections).
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages: &id001
