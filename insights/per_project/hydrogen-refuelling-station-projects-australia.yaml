  source_title: ARENA Insights Forum Session Summaries and Key Points
  publish_date: 2022-11
  project_name: Hydrogen Refuelling Station projects (Australia)
  what_happened: HRS projects found that for early-stage hydrogen infrastructure,
    community and regulator perception of safety was more important than technical
    compliance alone. Site selection for early projects needed to account for perception
    risk as well as operational suitability.
  lesson_learnt: For early hydrogen refuelling projects, prioritise site selection
    that minimises perception risk — community and regulator confidence in safety
    is more important than technical compliance thresholds alone, and negative perception
    at an early project can set back the broader technology's social licence.
