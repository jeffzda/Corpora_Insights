  project_name: Hydrogen Refuelling Station projects (Australia)
  what_happened: International OEMs supplying equipment for Australian HRS projects
    were unaware of relevant mandatory Australian standards and regulatory requirements,
    creating compliance gaps that required repeated communication to resolve.
  lesson_learnt: Do not assume international OEMs are familiar with Australian mandatory
    standards — requirements must be carefully and repeatedly communicated to international
    suppliers throughout procurement and installation to avoid compliance failures.
