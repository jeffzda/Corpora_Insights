- record_id: ARENA-DLV-68251
  source_title: Evaluation of ARENA's transport strategic priority
  publish_date: 2024-11
  project_name: Realising Electric Vehicle-to-Grid Services (REVS)
  what_happened: The REVS project demonstrated proof of feasibility for V2G technology
    in Australia, progressing TRL from 4 to 7 and delivering 10 published reports.
    However, one stakeholder interview revealed that the published reports led to
    an adverse decision to pursue the technology commercially, and multiple barriers
    to commercial implementation remain.
  lesson_learnt: Demonstrating feasibility and publishing comprehensive research reports
    does not guarantee commercial uptake — findings that surface barriers (regulatory,
    technical, economic) can discourage as well as inform potential adopters. V2G
    project teams should pair research outputs with targeted engagement to ensure
    findings are interpreted constructively and remaining barriers are actively addressed
    alongside publication.
