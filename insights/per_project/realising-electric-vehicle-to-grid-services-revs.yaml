- record_id: ARENA-DLV-51468
  source_title: UTS - Flexible Demand State of Play in Australia - Report
  publish_date: 2024-05
  project_name: Realising Electric Vehicle-to-Grid Services (REVS)
  what_happened: The REVS pilot was ultimately unable to deliver FCAS from its 51-vehicle
    ACT Government EV fleet, primarily because certification of the bidirectional
    charger against the Australian technical standard AS4777.2:2020 was extremely
    difficult — the standard requires an earthing point that EVs do not provide, requiring
    the charger to be modified and then re-tested for Electromagnetic Compatibility
    compliance.
  lesson_learnt: V2G FCAS pilots using Australian-certified bidirectional chargers
    must plan for extended charger certification timelines — the AS4777.2:2020 standard
    contains earthing requirements fundamentally incompatible with EV architecture,
    requiring bespoke engineering solutions; the standard should be updated to include
    a dedicated bidirectional charger category before future pilots rely on it.
  issue_severity: critical
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: network business
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: The charger was modified to comply with AS4777.2:2020 earthing
    requirements and re-tested for Electromagnetic Compatibility; Wallback Quasar
    became the first and only bidirectional charger certified against AS4777.2:2020
    as a result, though FCAS delivery was not achieved.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: EV
  source_pages:
  - 37
  evidence_excerpt: Certification of the charger against the technical standard (AS4777.2:2020)
    was very difficult and delayed the project. The fundamental problem is that the
    standard requires an earthing point whereas EVs do not provide any connection
    to the ground. The charger was modified to comply but then also the Electromagnetic
    Compatibility test. Wallback Quasar became the first and only bidirectional charger
    certified against AS4777.2:2020.
