- record_id: ARENA-DLV-68252
  source_title: Evaluation of ARENA's transport strategic priority
  publish_date: 2024-11
  project_name: Realising Electric Vehicle-to-Grid Services (REVS)
  what_happened: The REVS project introduced the first bi-directional charger approved
    for use in Australia and catalysed a rewrite of Australian Standards governing
    inverters used in solar and battery systems, with rewrites expected to be finalised
    by end of 2024. In February 2024, 16 V2G-capable fleet vehicles fed power back
    into the grid during a major power emergency.
  lesson_learnt: Innovation-stage V2G projects can generate regulatory reform as a
    key outcome beyond technology demonstration — proponents should explicitly track
    and document regulatory barrier identification and engage standards bodies as
    part of the project scope to maximise this pathway to commercialisation.
