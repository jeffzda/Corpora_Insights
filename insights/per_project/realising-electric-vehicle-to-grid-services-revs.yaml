- record_id: ARENA-DLV-51470
  source_title: UTS - Flexible Demand State of Play in Australia - Report
  publish_date: 2024-05
  project_name: Realising Electric Vehicle-to-Grid Services (REVS)
  what_happened: The REVS pilot experienced complexities and delays in its set-up
    phase including procurement delays that caused EVs to be allocated to other customers,
    bespoke site approvals with technical challenges at each location, and a finding
    that hard-wired internet connections were required for adequate charging speeds.
  lesson_learnt: V2G fleet pilots should treat infrastructure procurement, site approval,
    and connectivity requirements as long-lead activities requiring early resolution
    — each of these independently caused delays in REVS, and their combined effect
    will be magnified at scale unless standardised site assessment and approval processes
    are established upfront.
