- record_id: ARENA-DLV-4155
  source_title: Brighte Electrify 2515 Community Pilot - Lessons Learnt Report 1
  publish_date: 2024-11
  project_name: Electrify 2515 Community Pilot
  what_happened: The industry term 'HEMS' (Home Energy Management System) was found
    to be unfamiliar to the general public during community engagement and initial
    conversations with potential participants, creating a communication barrier for
    recruitment.
  lesson_learnt: Use consumer-accessible language rather than industry jargon when
    communicating about new energy technologies — terms like 'smart energy device'
    (with a phone icon) communicate function more effectively than acronyms like 'HEMS';
    this principle extends to other technologies such as 'virtual power plants'.
