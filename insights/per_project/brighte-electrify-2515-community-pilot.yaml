  what_happened: Many already all-electric homes participating in the pilot were not
    optimised to consume their own solar generation. Of 13 homes with pre-existing
    electric hot water systems, eight (61%) were not scheduled or controlled to run
    during the solar generation window. Some homes were participating in a virtual
    power plant but had not configured their hot water system to optimise solar self-consumption.
  lesson_learnt: Installing electric appliances and HEMS does not automatically deliver
    demand flexibility or solar optimisation — installers require training and incentives
    to configure whole-home optimisation as part of the installation process. Programs
    should include mandatory HEMS configuration checks as part of site close-out to
    ensure installed systems are actually delivering flexibility value.
