- record_id: ARENA-DLV-4153
  source_title: Brighte Electrify 2515 Community Pilot - Lessons Learnt Report 1
  publish_date: 2024-11
  project_name: Electrify 2515 Community Pilot
  what_happened: Households in the Expression of Interest survey identified confusion,
    lack of knowledge, and distrust of non-independent sources as the third most common
    barrier to electrification, behind cost and renting status; participants described
    the process of installing new technologies as complex, with many decision points
    and vendors.
  lesson_learnt: Provide trusted, independent, simplified decision support for households
    considering electrification — complexity and distrust of vested-interest sources
    are structural barriers that slow uptake; non-profits, consumer advocates, or
    government bodies are better placed to fill this role than industry.
