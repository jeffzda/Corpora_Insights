  what_happened: During the initial 10-home trial, some participants reported in post-installation
    questionnaires wanting more personal contact throughout the electrification process,
    indicating that the original participant journey design was insufficiently supported
    for the complexity of multi-appliance upgrades.
  lesson_learnt: Multi-appliance electrification programs should include structured
    human touchpoints throughout the participant journey — not just at application
    and installation — because the cognitive and logistical burden is high. Identify
