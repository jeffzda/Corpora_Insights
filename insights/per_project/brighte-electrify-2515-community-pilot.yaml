- record_id: ARENA-DLV-4156
  source_title: Brighte Electrify 2515 Community Pilot - Lessons Learnt Report 1
  publish_date: 2024-11
  project_name: Electrify 2515 Community Pilot
  what_happened: A market review found that most HEMS devices are capable of monitoring
    only, not load control. Of three devices trialled with both monitoring and control,
    each had a different constellation of appliance integrations and inconsistent
    communications protocols (RS485, Modbus, WiFi), requiring bilateral integrations
    that are labour-intensive to establish and limiting interoperability.
  lesson_learnt: Before deploying HEMS at scale, audit the specific integration compatibility
    of each device with the existing appliance mix on site — inconsistent communications
    protocols mean interoperability cannot be assumed, and unleveraged integrations
    severely limit demand flexibility and household/network value.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: pilot
  lifecycle_phase: commissioning/integration
  proponent_type: technology vendor
  delay_category: commissioning/integration
  failure_mode: unvalidated integration
  outcome_class: knowledge generated despite setback
