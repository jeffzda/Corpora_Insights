  source_title: Brighte Electrify 2515 Community Pilot - Lessons Learnt Report 1
  publish_date: 2024-11
  project_name: Electrify 2515 Community Pilot
  what_happened: When retrofitting HEMS onto existing solar and battery systems, installers
    needed 'installer-level' access credentials to enable communications between the
    HEMS and the original appliance, requiring them to contact the original installer
    or manufacturer — a step not anticipated in pre-installation planning.
  lesson_learnt: When planning HEMS retrofits, identify in advance which existing
    appliances require 'installer access' to enable communications integration, and
    factor in lead time to obtain credentials from original installers or manufacturers
    — failure to do so extends on-site time and may block key integrations.
