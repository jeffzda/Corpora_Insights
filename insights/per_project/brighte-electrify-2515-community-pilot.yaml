  what_happened: Battery interest was the highest of any upgrade among the 609 applicants
    (approximately 70% requested a battery), but only 31% of the 16 Stage 1 battery
    applicants who were invited proceeded to installation. Participants who declined
    explicitly cited upfront cost as the primary obstacle.
  lesson_learnt: High consumer interest in home batteries does not translate to installation
    without addressing upfront cost barriers — subsidies must be substantial and clearly
    communicated to convert interest into action. Stacking state and federal rebates
    (as the NSW and Federal governments have since announced) appears to be the mechanism
    needed to unlock latent demand.
