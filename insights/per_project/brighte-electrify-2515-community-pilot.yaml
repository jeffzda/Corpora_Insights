- record_id: ARENA-DLV-4151
  source_title: Brighte Electrify 2515 Community Pilot - Lessons Learnt Report 1
  publish_date: 2024-11
  project_name: Electrify 2515 Community Pilot
  what_happened: Two years of sustained volunteer-led community engagement prior to
    the pilot receiving ARENA funding — including local branding, buyers guides, solar
    rollout programs, and EV open days — produced over 250 formal applications within
    weeks of launch, far exceeding the 50 places needed for Milestone 3.
  lesson_learnt: Invest in long-term, locally-led community engagement well before
    a pilot launches — sustained pre-project campaigns build trust and awareness that
    translates directly into strong recruitment and a 'neighbourhood effect' that
    propagates participation organically.
