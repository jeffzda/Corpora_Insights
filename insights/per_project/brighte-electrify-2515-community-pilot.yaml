  publish_date: 2025-08
  project_name: Electrify 2515 Community Pilot
  what_happened: The pilot cohort was heavily skewed toward owner-occupiers (98% vs
    80% local census average) and had substantially higher rates of existing rooftop
    solar (80% vs 40% local average) and home batteries (25% vs 1% national average),
    indicating that Stage 1 participants were self-selected early adopters rather
    than a representative cross-section of the community.
  lesson_learnt: Early cohorts in community electrification pilots will over-represent
    already-engaged owner-occupiers with existing renewable assets — findings from
    Stage 1 should be interpreted with this selection bias in mind, and Stage 2 must
    deliberately target underrepresented groups to generate insights applicable to
    the mainstream electrification market.
