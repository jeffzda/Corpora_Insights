- record_id: ARENA-DLV-4157
  source_title: Brighte Electrify 2515 Community Pilot - Lessons Learnt Report 1
  publish_date: 2024-11
  project_name: Electrify 2515 Community Pilot
  what_happened: Smart home appliances (including home batteries) with cloud-based
    control architectures were found to preclude or restrict integration with HEMS,
    limiting the pilot's ability to achieve full load control and optimisation at
    those sites.
  lesson_learnt: Specify local-control-capable appliances for HEMS-integrated deployments
    — cloud-based control architectures in batteries and other smart devices block
    or restrict HEMS integration; advocate for standards mandating local control configurations
    to future-proof household energy systems.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: pilot
