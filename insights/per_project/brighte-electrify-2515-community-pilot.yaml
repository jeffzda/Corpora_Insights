- record_id: ARENA-DLV-4160
  source_title: Brighte Electrify 2515 Community Pilot - Lessons Learnt Report 1
  publish_date: 2024-11
  project_name: Electrify 2515 Community Pilot
  what_happened: Quotes for HEMS supply and installation across the ten trial sites
    showed a range of more than $2,000 between the lowest and highest quotes, with
    an average accepted quote of approximately $1,800 (excluding GST), reflecting
    both site variability and an immature, unstable pricing market.
  lesson_learnt: Budget significant contingency for HEMS installation costs in early-stage
    pilots — the market is immature and pricing is highly variable; combining HEMS
    installation with other planned site visits (e.g. maintenance) can reduce per-visit
    costs and help drive price convergence as the market matures.
