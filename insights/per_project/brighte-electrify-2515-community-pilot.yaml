- record_id: ARENA-DLV-67355
  source_title: Brighte - Electrify 2515 Community Pilot - Customer Insights Report
    1
  publish_date: 2025-08
  project_name: Electrify 2515 Community Pilot
  what_happened: Induction cooktop upgrades proved significantly more complex and
    costly than other gas-to-electric upgrades. Complications included benchtop cutout
    mismatches, extended high-current cable runs, gas pipe removal, and in some cases
    the need for three separate specialists (electrician, plumber, and stone cutter).
    One participant ultimately retained their gas cooktop because the cabling solution
    required holes in the wall.
  lesson_learnt: Induction cooktop upgrades should be pre-scoped using a structured
    triage process before quoting — kitchen-specific constraints (benchtop dimensions,
    existing cut-out size, cable ratings, gas configuration) frequently drive costs
    above online retail estimates and can result in failed upgrades. A self-assessment
    triage tool shared with both households and installers before site visits reduces
    surprises and aborted installations.
