- record_id: ARENA-DLV-67357
  source_title: Brighte - Electrify 2515 Community Pilot - Customer Insights Report
    1
  publish_date: 2025-08
  project_name: Electrify 2515 Community Pilot
  what_happened: The residential electrification installer market was found to be
    at an early stage of development. Few plumbers actively install or promote heat
    pumps; most default to like-for-like gas replacement. Solar installers were diversifying
    into broader electrification but had no standard business model, with some using
    subcontracting arrangements and others building in-house capability. Installers
    operating through multiple subcontractors experienced communication and on-site
    logistical complications.
  lesson_learnt: Electrification programs should actively onboard and train installers
    rather than assuming a ready market exists — plumbers in particular require targeted
    engagement since many still default to gas like-for-like replacements. Programs
    should also anticipate coordination failures in multi-subcontractor installation
    models and consider facilitating a single-installer model to reduce complexity
    for households.
