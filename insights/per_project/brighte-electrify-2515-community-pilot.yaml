- record_id: ARENA-DLV-31006
  source_title: Brighte - Electrify 2515 Community Pilot - Lessons Learnt Report 2
  publish_date: 2025-06
  project_name: Electrify 2515 Community Pilot
  what_happened: Households undertaking multiple appliance upgrades simultaneously
    took up to 111 days (63 days on average) from process start to completion, with
    the most time-consuming segments being obtaining and deciding between quotes (~16
    days combined) and arranging and completing installation (~25 days). HEMS-only
    upgrades averaged under 30 days.
  lesson_learnt: Plan for multi-appliance electrification upgrades to take up to three
    months end-to-end; accelerate the process by pre-sharing household information
    with installers to reduce quoting time and streamlining quote comparison tools
    to speed household decision-making.
