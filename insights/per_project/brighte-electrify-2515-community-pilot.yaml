- record_id: ARENA-DLV-31005
  source_title: Brighte - Electrify 2515 Community Pilot - Lessons Learnt Report 2
  publish_date: 2025-06
  project_name: Electrify 2515 Community Pilot
  what_happened: Installer guidance issued prior to each cohort (10 and 50 homes)
    needed to be highly explicit and prescriptive — covering itemised quote formats,
    HEMS installation objectives, checklists, and media guidelines — to achieve consistent
    installation standards and data quality across multiple installers.
  lesson_learnt: In subsidised multi-installer programs, guidance to installers must
    be explicit and prescriptive rather than principles-based; itemised checklists
    and detailed training delivered to on-site tradespeople (not just business owners)
    are necessary to achieve consistent installation standards and reliable data collection.
