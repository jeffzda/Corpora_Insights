    HEMS and coordinating all major energy appliances in a home as a system, despite
    being experienced with individual appliance controls; not conducting pre-installation
    site inspections led to unexpected site characteristics and longer installation
    times in several cases.
  lesson_learnt: HEMS installers require both generic training on household energy
    optimisation objectives and product-specific commissioning training; conduct pre-installation
    site inspections (or at minimum collect detailed appliance nameplate information)
    to avoid unexpected configurations that extend on-site time.
