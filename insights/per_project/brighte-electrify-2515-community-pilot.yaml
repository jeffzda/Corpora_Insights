  what_happened: Many installers were unfamiliar with HEMS and required close guidance
    from the pilot team to configure them correctly to deliver demand flexibility
    value. Optimising all relevant home appliances through a HEMS was found to be
    complex, and there was little direct financial incentive for installers to invest
    the time needed for whole-home optimisation.
  lesson_learnt: HEMS functionality will not be fully realised without deliberate
    installer training on configuration and without a financial incentive structure
    that rewards whole-home optimisation — programs should design explicit payment
    or recognition mechanisms for installers who correctly configure demand flexibility,
    rather than assuming this occurs as a natural by-product of HEMS installation.
