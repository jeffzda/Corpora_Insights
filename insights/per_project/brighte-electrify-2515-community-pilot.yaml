  publish_date: 2025-08
  project_name: Electrify 2515 Community Pilot
  what_happened: Upfront costs remained a significant barrier to household electrification
    despite subsidies being available. In post-installation questionnaires, 70% of
    participants reported they would not have upgraded all their appliances within
    two years without the pilot's financial incentives.
  lesson_learnt: Subsidies are necessary but insufficient on their own — the critical
    intervention point is influencing household decisions at or near end-of-life appliance
    replacement, paired with clear consumer education about long-term cost savings.
    Concessional loans and lifetime cost labelling (e.g. 15-year capital and operating
    cost stickers) at point of sale could be more effective than broad upfront subsidies
    alone.
