- record_id: ARENA-DLV-67360
  source_title: Brighte - Electrify 2515 Community Pilot - Customer Insights Report
    1
  publish_date: 2025-08
  project_name: Electrify 2515 Community Pilot
  what_happened: 'The pilot cohort had very low representation of renters and strata
    residents relative to their actual presence in the local population: only 1 of
    60 participants (2%) was a landlord or renter, against a local census figure of
    20%, and only 3 (5%) were apartment residents despite 8% local prevalence. Renters
    and strata residents face structural barriers to accessing electrification programs.'
  lesson_learnt: Community electrification pilots will systematically under-represent
    renters and strata residents unless active targeted recruitment is built into
    the program design from the outset — standard open recruitment defaults to owner-occupiers.
    Dedicated outreach through property agents with tailored messaging is needed to
    reach these cohorts.
