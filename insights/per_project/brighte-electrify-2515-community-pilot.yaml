- record_id: ARENA-DLV-67356
  source_title: Brighte - Electrify 2515 Community Pilot - Customer Insights Report
    1
  publish_date: 2025-08
  project_name: Electrify 2515 Community Pilot
  what_happened: The median installed cost of induction cooktops in Stage 1 was $3,390,
    higher than many participants anticipated based on publicly available retail website
    pricing. Costs were elevated by installation complexity (benchtop cutting, extended
    cable runs, gas removal) and the pilot's operational requirement that cooktops
    be sourced through installers rather than directly from retailers, preventing
    households from accessing retail specials.
  lesson_learnt: Online retail price estimates for induction cooktops are systematically
    misleading because they assume like-for-like replacement and exclude gas removal,
    cabling, and benchtop work — programs should proactively educate participants
    about realistic total installed costs before quoting. Where possible, allow households
    to source appliances directly from retailers to access competitive pricing and
    maintain participant trust.
