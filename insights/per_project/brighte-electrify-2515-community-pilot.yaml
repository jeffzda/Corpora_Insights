- record_id: ARENA-DLV-31008
  source_title: Brighte - Electrify 2515 Community Pilot - Lessons Learnt Report 2
  publish_date: 2025-06
  project_name: Electrify 2515 Community Pilot
  what_happened: Only 8 of 60 HEMS-equipped homes in Stage 1 achieved HEMS control
    of their hot water system, far below the project objective. The primary technical
    barrier was that heat pump manufacturers do not permit relay-based (simple on/off)
    control of their units, and very few heat pumps can communicate directly with
    HEMS devices for sophisticated scheduling.
  lesson_learnt: Before specifying HEMS control of heat pump hot water as a programme
    objective, verify that the target heat pump products support the required control
    interface — relay-based control is blocked by most manufacturers, and direct HEMS
    communication is available on very few units, effectively preventing HEMS-managed
    scheduling for the majority of heat pump installations.
