  evidence_excerpt: The third most common reason reported for not having installed
    an electric appliance already was not knowing how to go about it, being confused
    or unaware (cost and renting were most common reasons). Respondents expressed
    a lack of trust in installers, government and others who they do not perceive
    as independent.
