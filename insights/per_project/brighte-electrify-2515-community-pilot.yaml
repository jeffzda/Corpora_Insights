- record_id: ARENA-DLV-31007
  source_title: Brighte - Electrify 2515 Community Pilot - Lessons Learnt Report 2
  publish_date: 2025-06
  project_name: Electrify 2515 Community Pilot
  what_happened: Of 81 participants offered a place in Stage 1, 74% completed their
    installation; 14% deferred to Stage 2; 12% withdrew — citing financial reasons
    (6), installation complications (1), privacy concerns (2), and plans to sell their
    home (2). Combined with the removal of battery subsidies, this implies a need
    for additional recruitment to meet the 500-household deployment target.
  lesson_learnt: When planning large-scale residential electrification rollouts, apply
    a realistic attrition rate (~26% based on this pilot) to recruitment targets —
    at 74% retention, achieving 500 completions requires recruiting approximately
    680 households, and under-represented demographics such as landlords and apartment
    residents require tailored recruitment approaches.
