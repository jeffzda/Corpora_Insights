  project_name: Electrify 2515 Community Pilot
  what_happened: Home Energy Management Systems (HEMS) had a high average installed
    cost of over $2,000 for the initial 10 homes when installed as standalone site
    visits. In the subsequent 50-home cohort, co-installation with other appliances
    reduced the median HEMS cost to approximately $1,650. Installer familiarity also
    reduced on-site installation time between the two cohorts.
  lesson_learnt: HEMS installation costs can be materially reduced by co-installing
    them alongside other appliances rather than as standalone site visits — programs
    should schedule HEMS installation to coincide with other upgrade work wherever
    possible. Installer learning curves also reduce installation time and cost over
    the course of a program, so early cohorts should be treated as training investments.
