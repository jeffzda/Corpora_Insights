  source_title: Brighte - Electrify 2515 Community Pilot - Customer Insights Report
    1
  publish_date: 2025-08
  project_name: Electrify 2515 Community Pilot
  what_happened: Households showed strong preferences for a single installer to manage
    all their upgrades, with 74% of pilot participants choosing to use one provider
    for multiple appliances. However, single-installer models relying on subcontractors
    sometimes produced communication failures and on-site logistical complications,
    while installers offering in-house services often limited product choice to one
    or two brands.
  lesson_learnt: There is an inherent trade-off between customer convenience (single
    installer, one invoice) and appliance choice and quality (specialist sub-trades,
    competitive products) — programs should facilitate a 'one-stop-shop' model while
    maintaining product range, and should evaluate subcontractor coordination protocols
    carefully before scaling.
