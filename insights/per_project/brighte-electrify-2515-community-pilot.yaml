- record_id: ARENA-DLV-67363
  source_title: Brighte - Electrify 2515 Community Pilot - Customer Insights Report
    1
  publish_date: 2025-08
  project_name: Electrify 2515 Community Pilot
  what_happened: Many installers, particularly those without a solar background, were
    not familiar with the economic or environmental case for electrification and were
    not advising households holistically across appliances, monitoring, and demand
    flexibility. No dedicated plumbers were identified for Stage 1, and the pilot
    found only one locally available plumber committed to heat pump installations
    for Stage 2.
  lesson_learnt: The scarcity of plumbers willing to install and advocate for heat
    pumps is a critical bottleneck for residential electrification at scale — programs
    cannot assume sufficient installer supply and should budget for active trade engagement
    and education campaigns, including pre-recorded training materials to reduce the
    cost of upskilling at scale.
