- record_id: ARENA-DLV-72265
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: '2014'
  project_name: Large Embedded Generation Project (Project ID 301)
  what_happened: Ausgrid undertook protection reviews, relay setting modifications,
    and implemented financial incentive contracts with an existing large embedded
    generator to improve its reliability as a network support option. Despite improvements
    in peak-season reliability, it was not possible to conclusively demonstrate that
    modifications improved fault ride-through capability during network disturbances.
  lesson_learnt: Parallel-connected embedded generators installed for non-network
    purposes may trip at critical network disturbance moments due to protection and
    anti-islanding settings — financial incentives and protection modifications can
    improve reliability but may not resolve fundamental fault ride-through limitations;
    careful protection system review and settings adjustment should be a precondition
    before relying on embedded generation for network support.
