- record_id: ARENA-DLV-68258
  source_title: Evaluation of ARENA's transport strategic priority
  publish_date: 2024-11
  project_name: National Ultrafast EV Charging Infrastructure Network (Evie Networks)
  what_happened: High demand tariffs applied by distribution networks were identified
    as a significant barrier to cost-effective ultra-fast charging, with these tariff
    costs ultimately passed on to consumers. Evie Networks recommended demand tariff
    reform to maintain charging affordability.
  lesson_learnt: Network demand tariffs are a material and persistent cost driver
    for ultra-fast charging infrastructure that is passed to end consumers — proponents
    deploying public fast charging should engage regulators and distributors early
    on tariff structures, and ARENA-funded projects should document this barrier systematically
    to build the evidence base for tariff reform.
