- record_id: ARENA-DLV-68257
  source_title: Evaluation of ARENA's transport strategic priority
  publish_date: 2024-11
  project_name: National Ultrafast EV Charging Infrastructure Network (Evie Networks)
  what_happened: Evie Networks deployed 42 ultra-fast charging sites nationally, representing
    an 18% increase in public fast-charging sites in Australia. Without ARENA funding,
    Evie Networks stated the project would have taken at least 6 more years to implement,
    and under pure market forces would have taken even longer.
  lesson_learnt: Public ultrafast charging infrastructure deployment faces a significant
    market timing failure — private investment alone is insufficient to deploy at
    the pace required to support EV adoption, and grant co-investment can accelerate
    deployment timelines by approximately 6 years, validating ARENA's role in bridging
    the infrastructure gap.
