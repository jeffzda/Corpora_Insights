- record_id: ARENA-DLV-47057
  source_title: Australian Concentrating Solar Thermal Industry Roadmap
  publish_date: 2018-08
  project_name: Sundrop Farms CST CHP Project
  what_happened: The Sundrop Farms CHP project near Port Augusta demonstrated commercial viability of a smaller, bespoke CST system through multiple revenue streams (electricity, heat for desalination,
    food production), but little was published about the project's commercial and technical outcomes, limiting knowledge transfer to the broader CST sector and potential investors.
  lesson_learnt: Commercially successful demonstration projects in novel technology sectors should be required to publish detailed technical and commercial performance data — the Sundrop Farms project's
    limited publication of outcomes meant its proof-of-concept value to financiers, developers and potential off-takers was substantially diminished, slowing broader sector development.
