- record_id: ARENA-DLV-70902
  source_title: Develop Lithium Sulphur Batteries for Large Scale Electrical Energy Storage - Public Dissemination Report
  publish_date: 2018-10
  project_name: Develop Lithium-Sulfur Batteries for Large-Scale Electrical Energy Storage (2014/RND106)
  what_happened: The project maintained structured quarterly meetings across all partners, prioritised open sharing of problems and outputs, and required academic team members to attend hands-on workshops
    at the industry partner's (DLG Power Battery) manufacturing facilities in China. This structured collaboration mechanism enabled the project to meet its goals within the targeted timeframe.
  lesson_learnt: For multi-partner R&D consortia spanning academic and industrial organisations, establish a regular cadence of joint meetings with explicit norms for sharing problems — not just results
    — and require academic researchers to participate in hands-on sessions at industrial partner sites to ensure academic work stays practically grounded.
