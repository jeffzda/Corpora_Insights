- record_id: ARENA-DLV-70903
  source_title: Develop Lithium Sulphur Batteries for Large Scale Electrical Energy Storage - Public Dissemination Report
  publish_date: 2018-10
  project_name: Develop Lithium-Sulfur Batteries for Large-Scale Electrical Energy Storage (2014/RND106)
  what_happened: Bridging academic research to commercial-scale production was identified as a significant challenge. Direct involvement of an industry partner with hands-on experience in industry-scale
    battery production and marketing (DLG Power Battery) enabled the team to use production-grade equipment and apply practical design constraints from the outset, resulting in commercially sized pouch
    cells (10×5 cm) with validated electrochemical performance.
  lesson_learnt: To translate R&D outcomes toward commercialisation, embed an industry partner with production-scale manufacturing capability and market experience as an active participant from project
    inception — not as a late-stage reviewer — so that practical constraints shape materials selection and cell design from the beginning.
  issue_severity: none
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
