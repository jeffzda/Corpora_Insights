- record_id: ARENA-DLV-70901
  source_title: Develop Lithium Sulphur Batteries for Large Scale Electrical Energy Storage - Public Dissemination Report
  publish_date: 2018-10
  project_name: Develop Lithium-Sulfur Batteries for Large-Scale Electrical Energy Storage (2014/RND106)
  what_happened: UTS assembled a consortium including DLG Power Battery (China) and KERI to develop commercial-size lithium-sulphur pouch cells. Access to DLG's state-of-the-art battery manufacturing facilities
    and expertise was essential to fabricating and electrochemically testing industry-scale cells, which the academic team could not have achieved independently.
  lesson_learnt: When an R&D project targets commercial-scale fabrication, select industry partners whose manufacturing facilities and domain expertise directly fill capability gaps the academic team cannot
    provide — the consortium structure should be defined by complementary capability, not convenience.
