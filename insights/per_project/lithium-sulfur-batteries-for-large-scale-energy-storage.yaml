- record_id: ARENA-DLV-70904
  source_title: Develop Lithium Sulphur Batteries for Large Scale Electrical Energy Storage - Public Dissemination Report
  publish_date: 2018-10
  project_name: Develop Lithium-Sulfur Batteries for Large-Scale Electrical Energy Storage (2014/RND106)
  what_happened: The project's detailed but flexible project plan allowed the team to pursue novel materials discoveries and new research directions that emerged during the project, without compromising
    delivery of the primary goal (commercial-size lithium-sulphur battery fabrication). This flexibility enabled several additional publications and advances beyond the original scope.
  lesson_learnt: R&D project plans should be detailed enough to ensure primary goals are delivered, but deliberately flexible enough to accommodate and exploit unforeseen findings — defining the project
    too narrowly will cause the team to abandon valuable emerging opportunities that could enhance the project's overall impact.
  issue_severity: none
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: concept/feasibility
  proponent_type: research organisation/university
  delay_category: null
