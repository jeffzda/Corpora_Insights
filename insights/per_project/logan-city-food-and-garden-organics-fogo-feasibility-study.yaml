  what_happened: The study identified that any long-term viable food organics or garden
    organics supply arrangement would require a dedicated FOGO contracts and business
    development manager to manage commercial waste contracts, pre-processed green
    waste transfers, and supply consistency — a staffing resource requirement not
    initially anticipated in the concept.
  lesson_learnt: When designing a waste-to-energy facility reliant on third-party
    feedstock supply, include a dedicated commercial/contracts management role in
    the operating model from the outset — managing contract compliance, supply consistency,
    and avoiding stockpiling or under-supply requires sustained specialist resource
    that is typically underestimated at the feasibility stage.
