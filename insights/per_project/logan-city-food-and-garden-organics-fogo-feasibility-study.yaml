  source_title: Logan City Council FOGO Feasibility Study Final Public Study Report
  publish_date: 2024-08
  project_name: Logan City Council FOGO Feasibility Study
  what_happened: The LCA demonstrated that the combined AD-plus-gasification process
    achieves the highest energy yield from FOGO by accessing different fractions of
    volatile solids matter in sequence — food organics are best suited to AD (high
    moisture) while garden organics are better suited to gasification after drying
    (high calorific value, structural stability) — a finding that informed the technology
    selection rationale.
  lesson_learnt: For mixed organic waste streams, a sequential AD-then-gasification
    process outperforms either technology in isolation by targeting each feedstock
    fraction's strengths — match feedstock characteristics (moisture, calorific value,
    particle structure) to the appropriate thermal or biological process to maximise
    energy yield and minimise waste.
