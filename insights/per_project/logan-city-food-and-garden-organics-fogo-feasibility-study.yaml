  what_happened: Initial discussions with potential commercial food organics (FO)
    feedstock suppliers revealed that suppliers required more detailed feedstock specifications
    (e.g. liquid waste vs. homogeneous solid waste) before they could commit, and
    that managing supply consistency to meet process demand would be a critical ongoing
    challenge.
  lesson_learnt: Secure feedstock specifications and conduct early supplier engagement
    before progressing to detailed design of a commercial food organics AD facility
    — suppliers cannot commit to volumes or form without precise input specifications,
    and failure to lock in consistent supply undermines both process efficiency and
    financial viability.
