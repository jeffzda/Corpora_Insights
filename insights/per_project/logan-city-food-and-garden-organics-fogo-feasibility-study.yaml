- record_id: ARENA-DLV-22855
  source_title: Logan City Council - FOGO Feasibility Study - Lessons Learnt Report
  publish_date: 2024-08
  project_name: Logan City Council FOGO Feasibility Study
  what_happened: The feasibility study established that all FOGO feedstock must be
    dried to 90% dry solids (≤10% moisture content) before gasification. Residual
    moisture lowers hearth temperature, promotes tar formation in the offgas, and
    can cause fouling in the hearth and oxidiser, as well as degrading biochar quality.
    Whether FOGO feedstock can be economically dried to this specification was not
    confirmed during the study.
  lesson_learnt: Any project proposing to gasify wet organic feedstocks must include
    a drying trial to confirm that the 90% dry solids specification can be met cost-effectively
    before committing to capital expenditure on gasification infrastructure.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: concept/feasibility
  proponent_type: government/public-sector body
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The study recommended that the drying requirement be verified
    via a physical trial before any future project proceeds.
  transferability: narrow
  delay_magnitude: null
  technology_domain: bioenergy
  source_pages: &id016
  - 6
  evidence_excerpt: It was assumed that all material must be dried to 90% dry solids
    prior to gasification. If material is not properly dried, the residual moisture
    content tends to lower the temperature at the top of the hearth. This may cause
    issues with tar formation in the offgas. The requirement of drying feedstock material
    to 90% dry solids would need to be verified via a trial.
