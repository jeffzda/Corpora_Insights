  source_title: Logan City Council - FOGO Feasibility Study - Lessons Learnt Report
  publish_date: 2024-08
  project_name: Logan City Council FOGO Feasibility Study
  what_happened: Financial analysis of the FOGO-to-energy concept at Loganholme WWTP
    produced a significantly unfavourable NPV (between -$66 million and -$81 million)
    for both scenarios analysed, with a payback period exceeding 30 years. Only significant
    third-party funding (68–100%) would result in a neutral NPV, indicating the project
    is not commercially viable under current conditions.
  lesson_learnt: Before committing to detailed feasibility design for waste-to-energy
    integration projects, conduct early-stage financial screening — if NPV is deeply
    negative and requires near-total external subsidy, redesign the scope (e.g. increase
    feedstock volumes, stage capital, or integrate with existing infrastructure) before
    advancing to full feasibility.
