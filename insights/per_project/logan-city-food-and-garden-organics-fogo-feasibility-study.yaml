- record_id: ARENA-DLV-22854
  source_title: Logan City Council - FOGO Feasibility Study - Lessons Learnt Report
  publish_date: 2024-08
  project_name: Logan City Council FOGO Feasibility Study
  what_happened: 'The gasification equipment at Loganholme imposes strict feedstock
    particle size requirements: particles must be between 3 mm and 45 mm in length
    and no more than 12 mm thick. Particles outside these ranges risk spontaneous
    combustion in biochar, choking the feed metering system, short-circuiting the
    hearth, or being carried into the thermal oxidiser, increasing emission control
    demands. These requirements were not confirmed as achievable for FOGO feedstocks
    at the outset of the feasibility study.'
  lesson_learnt: Before committing to gasification of a novel feedstock such as garden
    organics, validate that the feedstock can be reliably pre-processed to meet the
    gasifier's physical specifications (particle size, thickness, dust fraction) through
    a bench or pilot trial — failure to meet specifications creates spontaneous combustion
    risk and choke hazards that are unacceptable in an operational facility.
  issue_severity: major
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: concept/feasibility
  proponent_type: government/public-sector body
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The study recommended a dedicated pre-processing trial to verify
    whether Logan's green waste can meet gasifier feedstock specifications before
    any further design investment.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: bioenergy
  source_pages:
  - 5
  - 6
  - 14
  evidence_excerpt: 'Based on the advice from the manufacturer of the gasification
    equipment currently in use at Loganholme, gasification feedstock requires the
    following properties for effective operation of the gasification facility: 1.
    Particles more than 12mm thick may not be fully carbonised. 2. Particles longer
    than 45mm present a risk of choking the feed metering system. 3. Particles below
    3mm can short circuit the hearth. Future projects would need to include a trial
    to determine the feasibility of pre-processing feedstock to meet these specifications.'
