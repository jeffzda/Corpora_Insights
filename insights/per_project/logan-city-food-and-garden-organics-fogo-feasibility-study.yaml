- record_id: ARENA-DLV-22852
  source_title: Logan City Council - FOGO Feasibility Study - Lessons Learnt Report
  publish_date: 2024-08
  project_name: Logan City Council FOGO Feasibility Study
  what_happened: Laboratory testing at the University of Queensland found that food
    organics (FO) alone can cause acidic overloading of anaerobic digesters, and that
    100% garden organics (GO) is poorly digestible and would require extremely large
    digesters at prohibitive capital cost. A 50% FO / 50% GO blend was identified
    as the optimal ratio for stable digestion, limited residual production, and reasonable
    methane yields.
  lesson_learnt: For biogas projects incorporating FOGO feedstocks, design around
    a 50% FO / 50% GO co-digestion blend — pure FO risks acidic overloading and pure
    GO demands oversized, uneconomic digesters; the blended ratio delivers stability
    and manageable methane yields.
