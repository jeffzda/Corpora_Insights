- record_id: ARENA-DLV-22853
  source_title: Logan City Council - FOGO Feasibility Study - Lessons Learnt Report
  publish_date: 2024-08
  project_name: Logan City Council FOGO Feasibility Study
  what_happened: The study found that extracting food organics (FO) from a mixed general
    waste stream is not financially viable, requiring numerous costly separation techniques
    that are rarely applied in practice. Source separation through dedicated FO or
    combined FOGO collection services is the preferred model but introduces additional
    challenges in servicing arrangements and increased collection and processing costs.
    The separation process was also technically challenging due to contamination levels
    and quality inconsistencies.
  lesson_learnt: Future waste-to-energy projects should exclude residential FO sourced
    from mixed waste streams as a feedstock until source separation and volume aggregation
    of residential FO — or separation of FO from a combined FOGO stream — is technically
    and financially proven.
