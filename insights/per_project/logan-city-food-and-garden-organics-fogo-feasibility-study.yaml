- record_id: ARENA-DLV-3056
  source_title: Logan City Council FOGO Feasibility Study Final Public Study Report
  publish_date: 2024-08
  project_name: Logan City Council FOGO Feasibility Study
  what_happened: The study determined that physical separation of food organics (FO)
    from garden organics (GO) in a mixed FOGO stream is not currently technically
    viable, and that source-separated residential FO collection is also not viable
    for Logan City Council due to contamination risks, vermin issues, low per-household
    volumes (1–2 kg/week), and collection service economics.
  lesson_learnt: Councils assessing FOGO waste diversion should not assume residential
    FO can serve as a reliable AD feedstock without first resolving source-separation
    technology and collection economics — commercial FO is a more consistent and immediately
    viable feedstock and should be prioritised for concept design.
