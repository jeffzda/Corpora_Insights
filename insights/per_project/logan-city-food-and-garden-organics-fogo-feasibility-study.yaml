  what_happened: The study found that actual biomethane potential (BMP) test results
    were lower than literature values, likely due to the specific composition of locally
    sourced FOGO feedstocks. This discrepancy has direct implications for methane
    yield assumptions used in financial modelling of biogas projects.
  lesson_learnt: Do not rely on published literature BMP values when sizing anaerobic
    digestion infrastructure — conduct site-specific BMP testing using representative
    local feedstock samples before finalising design parameters and financial models,
    as local composition can materially reduce expected methane yields.
