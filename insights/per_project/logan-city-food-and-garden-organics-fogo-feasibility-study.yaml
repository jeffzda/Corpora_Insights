  evidence_excerpt: The BMP results confirmed that food organics are generally digestible
    but can cause acidic overloading of the digestors. The digestion of food organics
    is likely more stable in combination with GO. A 50%FO:50%GO ratio is thought to
    be ideal since it is stable and produces limited residual (which would need a
    management strategy). Higher GO fractions are not justified.
