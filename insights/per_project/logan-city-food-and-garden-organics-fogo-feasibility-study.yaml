- record_id: ARENA-DLV-3051
  source_title: Logan City Council FOGO Feasibility Study Final Public Study Report
  publish_date: 2024-08
  project_name: Logan City Council FOGO Feasibility Study
  what_happened: The NPV cost analysis for the FOGO concept facility returned a highly
    negative 30-year NPV for both Stage 1 and Stage 4 scenarios, with significant
    CAPEX grant funding required (100% for Stage 1, 68% for Stage 4) just to reach
    NPV neutrality, meaning neither scenario is commercially viable without substantial
    external subsidy.
  lesson_learnt: For waste-to-energy feasibility studies involving novel feedstock
    integration at existing facilities, conduct NPV sensitivity analysis early and
    across multiple scale/staging scenarios — a single negative NPV result across
    all tested scenarios indicates the concept requires fundamental redesign or additional
    revenue streams before progressing to detailed design.
