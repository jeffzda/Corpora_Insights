  what_happened: The feasibility study concluded that current policy and regulatory
    drivers for diverting organic waste from landfill are insufficient to justify
    the cost implications for residents, and that the project concept is not financially
    viable without significant regulatory change such as legislated waste reduction
    targets or mandatory FOGO collection requirements.
  lesson_learnt: Waste-to-energy feasibility studies for council-owned facilities
    should explicitly model the regulatory upside scenario — current financial non-viability
    driven by weak waste diversion incentives may be reversed by foreseeable policy
    changes, and framing findings in this way supports a 'ready to activate' position
    rather than project abandonment.
