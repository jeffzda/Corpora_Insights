- record_id: ARENA-DLV-61001
  source_title: Development of Stable Electrodes for Perovskite Solar Cells Final
    Report
  publish_date: 2021-11
  project_name: Development of Stable Electrodes for Perovskite Solar Cells
  what_happened: The project developed gold-free electrode alternatives for perovskite
    solar cells, achieving certified 19% efficiency with a bismuth/silver metal layer
    stack (versus 21% for gold-contact cells) and demonstrating stability under damp-heat
    and thermal cycling conditions. The project ran from December 2017 to March 2022,
    a period notably longer than the November 2021 published date suggests.
  lesson_learnt: Gold-free electrode approaches (metal layer stacks and carbon electrodes)
    can achieve near-parity efficiency with gold contacts at a fraction of the cost
    (1–6% of gold electrode cost), making them viable pathways for perovskite commercialisation
    — but further stability testing and fabrication process development remain prerequisites
    before industrial application.
