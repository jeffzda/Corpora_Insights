- record_id: ARENA-DLV-61003
  source_title: Development of Stable Electrodes for Perovskite Solar Cells Final
    Report
  publish_date: 2021-11
  project_name: Development of Stable Electrodes for Perovskite Solar Cells
  what_happened: The bismuth/silver metal layer stack electrode achieved a cost of
    4–6% of a gold electrode, and the carbon electrode achieved 1–2% of the cost of
    gold, while both demonstrated acceptable efficiency and stability performance
    in laboratory testing.
  lesson_learnt: Carbon and bismuth/silver layer stack electrodes offer dramatic cost
    reductions (to 1–6% of gold electrode cost) for perovskite cells without proportionate
    efficiency penalties, and should be prioritised for scale-up pathways — though
    industrial fabrication processes for these configurations require further development
    before commercial deployment.
