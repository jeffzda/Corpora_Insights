- record_id: ARENA-DLV-69551
  source_title: Development of Stable Electrodes for Perovskite Solar Cells Project
    Results and Lessons Learnt
  publish_date: '2019-08-07'
  project_name: Development of Stable Electrodes for Perovskite Solar Cells
  what_happened: Stability testing created a throughput bottleneck during the project
    because equipment limitations prevented measurement of multiple cells in parallel
    — stability measurements could only be taken sequentially after high efficiency
    results had been achieved.
  lesson_learnt: Stability testing equipment capable of measuring multiple cells in
    parallel must be treated as standard laboratory infrastructure for perovskite
    solar cell projects — sequential testing creates bottlenecks that slow development
    cycles now that stability is as important as efficiency.
  issue_severity: moderate
  project_type: null
  project_scale_band: lab/bench
