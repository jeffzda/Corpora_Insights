- record_id: ARENA-DLV-61004
  source_title: Development of Stable Electrodes for Perovskite Solar Cells Final
    Report
  publish_date: 2021-11
  project_name: Development of Stable Electrodes for Perovskite Solar Cells
  what_happened: Despite the project's technical successes, the report identified
    that further improvements to stability and extended stability testing remain outstanding
    challenges for the newly developed contact structures before they can be considered
    ready for commercialisation.
  lesson_learnt: Research projects demonstrating promising laboratory-scale electrode
    performance should plan for a dedicated extended stability testing phase (beyond
    standard damp-heat and thermal cycling) as a distinct project stage before any
    transition to industrial fabrication — stability gaps identified at close-out
    represent the primary remaining barrier to commercialisation for perovskite electrode
    technologies.
