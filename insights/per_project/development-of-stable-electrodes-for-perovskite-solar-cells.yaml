  delay_category: data/validation/testing
  failure_mode: execution & logistics
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: Purchase of dedicated parallel stability testing equipment was
    planned to eliminate the bottleneck for subsequent testing phases.
  transferability: narrow
