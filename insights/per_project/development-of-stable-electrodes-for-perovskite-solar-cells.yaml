- record_id: ARENA-DLV-61002
  source_title: Development of Stable Electrodes for Perovskite Solar Cells Final
    Report
  publish_date: 2021-11
  project_name: Development of Stable Electrodes for Perovskite Solar Cells
  what_happened: Gold electrodes — the dominant rear electrode material for high-efficiency
    perovskite solar cells — were found to be prohibitively expensive and prone to
    diffusing into the perovskite active layer, causing cell degradation. Silver electrodes,
    while high-performing, degraded rapidly when exposed to iodide ions present in
    most perovskite materials, limiting their viability.
  lesson_learnt: When selecting electrode materials for perovskite solar cells, both
    cost and chemical compatibility with iodide-containing active layers must be evaluated
    early — gold is cost-prohibitive at scale and silver degrades rapidly in iodide
    environments, making neither suitable as a long-term commercial electrode without
    protective barrier layers.
  issue_severity: moderate
  project_type: generation
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: A thin barrier metal layer was introduced between the perovskite
    active layer and the high-conductivity metal layer to prevent ion diffusion and
    chemical degradation.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id002
  - 3
  evidence_excerpt: Gold is by far the most common rear electrode material for perovskite
    cells, but it is prohibitively expensive, and can also diffuse into the perovskite
    active layer, leading to cell degradation. High efficiencies have also been achieved
    with silver electrodes, but they rapidly degrade when exposed to iodide ions that
    are present in most perovskite photovoltaic materials.
