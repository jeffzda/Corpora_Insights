- record_id: ARENA-DLV-25916
  source_title: Review of ARENA's Reliability Portfolio
  publish_date: 2020-01
  project_name: Fulcrum3D CloudCAM Project
  what_happened: Fulcrum3D's CloudCAM short-term cloud movement forecasting technology, initially developed for fringe-of-grid solar applications, achieved commercial third-party sales and installation.
    Deployment at Ti-Tree and Kalkarindji power stations reduced battery usage by approximately 30% and increased average solar yield by 4–5%. The technology's commercial model was found to be dependent
    on causer-pays FCAS market arrangements that penalise generators for rapid output changes.
  lesson_learnt: Short-term solar forecasting technologies can achieve commercial viability and deliver quantifiable system benefits, but their business models are structurally dependent on market arrangements
    that penalise output volatility; project proponents and funders should assess market rule dependencies as part of commercialisation planning.
