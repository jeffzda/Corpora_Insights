- record_id: ARENA-DLV-25913
  source_title: Review of ARENA's Reliability Portfolio
  publish_date: 2020-01
  project_name: NOJA Power Intelligent Switchgear Project
  what_happened: NOJA Power's smart switchgear demonstration project faced concerns
    about potential installation delays due to storms and bushfires. The project also
    identified the lack of a standard regulatory approach across Australian states
    as a key inhibitor to connecting mid-scale renewable energy generators to the
    grid.
  lesson_learnt: Installation programs for grid-connected devices across multiple
    distribution networks face weather-related schedule risk and cross-jurisdictional
    regulatory fragmentation; projects should build weather contingency into installation
    schedules and proactively engage with state regulators to identify jurisdictional
    differences before installation commences.
