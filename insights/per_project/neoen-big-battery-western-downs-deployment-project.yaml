- record_id: ARENA-DLV-63118
  source_title: Neoen - Western Downs BESS Deployment - Development Report Milestone
    2
  publish_date: 2024-10
  project_name: Western Downs Battery Energy Storage System (WDBESS)
  what_happened: GFM inverters operating in GFM mode after transition from GFL may
    alter the generating system's harmonic emission and immunity profile, potentially
    triggering the need for harmonic filters. Some GFM inverters have internal active
    filtering functionality which may obviate the need for external filters, making
    this a relevant differentiator during inverter OEM selection.
  lesson_learnt: When transitioning a BESS from GFL to GFM, assess the impact on harmonic
    emission and immunity profiles before finalising the GFM design — if the change
    materially alters harmonic performance, harmonic filters may be required, adding
    cost and schedule; specify whether the candidate inverter OEM provides internal
    active filtering capability as part of the technical evaluation.
  issue_severity: major
  project_type: storage
  project_scale_band: utility/large-scale
  lifecycle_phase: development/design
  proponent_type: project developer
  delay_category: commissioning/integration
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Neoen is investigating whether software tuning of Tesla's active
    filtering parameters can eliminate the need for a physical filter; if not, a retrofitted
    harmonic filter will be required despite the site layout and procurement challenges.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages:
  - 8
  - 9
  - 17
  evidence_excerpt: Especially where a BESS is existing as a GFL BESS, it is important
    that the change from GLF to GFM does not significantly alter the generating system's
    harmonic emission and immunity which could potentially trigger the need for harmonic
    filters. Some advanced inverters may have internal active filtering functionality
    which may be a technical consideration when selecting an advanced inverter.
