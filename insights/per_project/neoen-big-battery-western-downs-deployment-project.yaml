- record_id: ARENA-DLV-41154
  source_title: Neoen - Western Downs BESS - Lessons Learnt Report 3
  publish_date: 2024-06
  project_name: Western Downs Battery Energy Storage System (WDBESS)
  what_happened: The NER inertia definition was changed mid-project (December 2024,
    NER v218) during the 5.3.9 transition process, after financial commitments had
    already been made. The original definition excluded electromagnetically non-coupled
    devices (i.e. batteries) from inertia provisions, meaning GFM BESS could provide
    synthetic inertia without a corresponding reduction in FCAS eligibility. The updated
    definition removes this exclusion, reducing FCAS revenue below what was forecast
    at project commencement.
  lesson_learnt: The absence of a NER category for GFM inverters operating in synchronous
    machine mode is a systemic barrier affecting all future GFM BESS projects — proponents,
    industry bodies and regulators should advocate for NER updates to define appropriate
    performance standards and GPS criteria for GFM inverters to reduce connection
    approval delays across the sector.
  issue_severity: major
  project_type: storage
  project_scale_band: utility/large-scale
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: re-scoped/adapted
  secondary_failure_mode: commercial & market
  intervention_note: Project is awaiting AEMO's final position on synthetic inertia
    treatment in FCAS registration; Neoen has flagged that future GFM projects will
    explicitly model anticipated FCAS enablement loss before proceeding.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages:
  - 7
  - 8
  - 11
  - 25
  evidence_excerpt: Based on experiences with other GFM BESS projects, NER clause
    S5.2.5.5 will likely be a point of contention for the WDBESS 5.3.9 process and
    due diligence review. NER clause S5.2.5.5 (response to disturbances following
    contingency events) specifies a reactive current settling time 'of no greater
    than 70 milliseconds' for asynchronous generating systems, which is set for inverter
    (as asynchronous generating systems) in GFL mode.
  confidence_note: This record captures the regulatory change risk dimension of the
    FCAS issue as a distinct lesson from ARENA-DLV-41151, which covers the AEMO registration
    negotiation. Both are grounded in the same NER v218 event but have different actionable
    implications. Canonical record merged from 3 source records across 2 document(s).
