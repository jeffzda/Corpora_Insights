- record_id: ARENA-DLV-50851
  source_title: Neoen - Big Battery (Western Downs) Deployment Project - Lessons Learnt
    Report 2
  publish_date: 2024-12
  project_name: Western Downs Battery Energy Storage System (WDBESS)
  what_happened: During the NER 5.3.9 transition process from grid-following (GFL)
    to grid-forming (GFM) mode, power quality studies revealed that inverter harmonic
    emissions changed significantly between the two operating modes. Concurrently,
    Powerlink released a new power quality assessment methodology for IBR in January
    2024 and provided revised harmonic emission allocations and polygon data in August
    2024 — approximately three months after the 5.3.9 studies commenced — resulting
    in timeline extensions and a finding that the 14th harmonic order potentially
    exceeds its allocation under some contingency scenarios.
  lesson_learnt: Future projects planning a GFL-to-GFM transition should build allowances
    into project budget, schedule, and physical site design for harmonic filters at
    33kV from the outset — including space in the HV switchyard, electrical coupling,
    SCADA integration, and procurement lead time — because NSP harmonic allocations
    and assessment methodologies can change mid-process and are not shared in advance,
    making retrofitting costly and disruptive.
  issue_severity: major
  project_type: storage
  project_scale_band: utility/large-scale
  lifecycle_phase: commissioning/integration
  proponent_type: project developer
  delay_category: commissioning/integration
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: regulatory & approvals
  intervention_note: 'Neoen is pursuing parallel mitigation paths: negotiating an
    increased harmonic allocation with Powerlink (conditional on future remediation
    obligations) and investigating tuning of Tesla''s active filtering parameters
    to reduce the exceeding harmonic emissions, while monitoring harmonics before
    and after GFM commissioning to determine whether a physical filter is ultimately
    required.'
  transferability: broad
  delay_magnitude: 3-12 months
  technology_domain: battery storage
  source_pages:
