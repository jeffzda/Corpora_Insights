  evidence_excerpt: Inverters with GFM capability can allow the system strength to
    be completely self-remediated, or where not possible, significantly reduce the
    SSC which would be payable for a GFL BESS. This provides a potential option to
    developers as future BESS projects could employ GFM to avoid (or minimise) paying
    SSC and may also incentivise prospective solar or wind generators to include GFM
