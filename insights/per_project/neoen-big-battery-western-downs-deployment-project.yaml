  - 10
  - 11
  evidence_excerpt: The power quality studies required as part of the 5.3.9 process
    identified that the harmonic emissions profile from the inverters changed when
    operating in grid forming compared with grid following mode, resulting in a different
    harmonic profile. This coupled with a recent change in assessment methodology,
    harmonic emission allocations and harmonic polygon data from Powerlink has resulted
    in a potential exceedance of allocation for a single harmonic order.
  confidence_note: delay_magnitude assessed as 3–12 months based on the stated ~3-month
    extension after Powerlink's revised data was provided in August 2024; final delay
