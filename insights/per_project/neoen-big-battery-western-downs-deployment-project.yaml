  what_happened: The WDBESS obtained grid connection approval and commenced commercial
    operations in grid-following (GFL) mode first, deferring the transition to grid-forming
    (GFM) mode via a subsequent NER clause 5.3.9 process, rather than pursuing GFM
    from the outset. This was a deliberate risk mitigation strategy because GFM approval
    processes are new to AEMO and NSPs and carry significant schedule risk.
