- record_id: ARENA-DLV-63107
  source_title: Neoen - Western Downs BESS Deployment - Development Report Milestone
    2
  publish_date: 2024-10
  project_name: Western Downs Battery Energy Storage System (WDBESS)
  what_happened: 'The EPC tender and connection application process for BESS projects
    are coupled in an inefficient way: because the connection application package
    is specific to the combination of Power Plant Controller (PPC) and inverter, and
    EPC contractors commonly mandate their own PPC solutions, the connection application
    cannot be finalised until the successful EPC tenderer has been selected. This
    serialises two processes that could otherwise proceed in parallel.'
  lesson_learnt: To enable parallel progress on EPC tender and grid connection application,
    project proponents should explore whether EPC contractors can accept the inverter
    OEM's native PPC — if EPCs were comfortable with this approach, the connection
    application could proceed concurrently with the tender process, reducing overall
    schedule; currently this is not common practice due to limited EPC contractor
    options.
  issue_severity: moderate
  project_type: storage
  project_scale_band: utility/large-scale
  lifecycle_phase: procurement
  proponent_type: project developer
  delay_category: procurement/supply chain
  failure_mode: coordination & stakeholders
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated integration
  intervention_note: In the case of WDBESS, the PPC and inverters are from the same
    OEM (Tesla), which resolved the integration complexity for this project.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id007
  - 19
  - 20
  evidence_excerpt: This means that a package cannot be finalised for a project until
    the combination of PPC and inverter has been determined. If EPC contractors mandate
    the use of different PPCs during a tender process, then the connection application
    cannot be finalised until the successful tenderer has been selected. If EPCs were
    able to get comfortable with inverter OEMs native PPCs, this would lead to a more
    comparable EPC tender process and one in which the connection application process
    could proceed in parallel to the tender.
