  what_happened: GFM inverter projects carry considerable additional costs compared
    to GFL BESS, including higher inverter costs for advanced features such as overload
    capability, added costs for grid connection approval, installation and commissioning
    complexity, and costs associated with the 5.3.9 transition process — while revenue
    benefits remain largely theoretical or non-existent in the current NEM.
  lesson_learnt: Project proponents planning GFM BESS projects should explicitly budget
    for the additional costs of GFM above a GFL baseline — including inverter premium,
    grid connection approval complexity, and 5.3.9 transition costs — and should not
    assume these will be offset by GFM-specific revenue streams in the near term without
    grant support or a clear pathway to market mechanisms.
