- record_id: ARENA-DLV-41153
  source_title: Neoen - Western Downs BESS - Lessons Learnt Report 3
  publish_date: 2024-06
  project_name: Western Downs Battery Energy Storage System (WDBESS)
  what_happened: WDBESS was initially designed and registered with inverters operating
    in grid following mode (GFL) before transitioning to GFM, a deliberate staging
    decision taken to accelerate the grid connection process given that GFM technology
    was relatively new and perceived to carry higher connection approval risk. The
    first stage achieved registration ahead of schedule and was energised in May 2024;
    the GFM transition and capacity expansion to 255MW/510MWh completed in May 2025.
  lesson_learnt: Staging a large-scale BESS project by registering first in GFL mode
    and transitioning to GFM later can materially accelerate initial energisation
    where GFM connection approval risk is high — but project teams must explicitly
    plan and budget for the 5.3.9 transition process, including its regulatory, harmonic,
    and FCAS implications, before committing to this approach.
  issue_severity: minor
  project_type: storage
  project_scale_band: utility/large-scale
  lifecycle_phase: development/design
  proponent_type: project developer
  delay_category: no material delay stated
  failure_mode: no major failure stated
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: null
