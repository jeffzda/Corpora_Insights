- record_id: ARENA-DLV-41151
  source_title: Neoen - Western Downs BESS - Lessons Learnt Report 3
  publish_date: 2024-06
  project_name: Western Downs Battery Energy Storage System (WDBESS)
  what_happened: Following the GFM transition (5.3.9 process), AEMO informed WDBESS
    it could not register the full Very Fast Raise and Lower FCAS capacity (+55MW)
    as expected, because AEMO's updated interpretation of the Market Ancillary Services
    Specification treated the plant's synthetic inertia response as offsetting its
    FCAS enablement. An interim agreement was reached registering 5MW less than the
    calculated response. The issue was compounded in December 2024 when NER v218 updated
    the definition of inertia to explicitly include battery-provided inertia, formalising
    the reduction in FCAS enablement for GFM BESS projects.
  lesson_learnt: Future GFM BESS projects, including those transitioning from GFL
    to GFM, must account for a reduction in FCAS enablement and associated revenue
    loss caused by the synthetic inertia the plant provides — the NER v218 inertia
    definition change makes this reduction a regulatory reality that must be incorporated
    into pre-investment financial modelling and business case assumptions.
  issue_severity: moderate
