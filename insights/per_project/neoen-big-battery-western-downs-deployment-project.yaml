  publish_date: 2024-10
  project_name: Western Downs Battery Energy Storage System (WDBESS)
  what_happened: When selecting an inverter OEM for a GFM BESS project, the ideal
    approach is to choose an OEM with an established local NEM market presence and
    a strong track record registering and commissioning their inverter models in the
    NEM. However, because GFM technology is evolving rapidly, it is not always practical
    to find an OEM meeting this standard — creating a tension between technological
    capability and market experience.
  lesson_learnt: For GFM BESS projects, prioritise inverter OEMs with demonstrated
    NEM registration and commissioning track record and the capability to support
    GPS negotiation, model development, hold point testing and commissioning — an
    OEM that can operate in microgrid or off-grid scenarios, or in international jurisdictions
    with FFR requirements, is likely to have the expertise needed for Australian GFM
    implementation.
