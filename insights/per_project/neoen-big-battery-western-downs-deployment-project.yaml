  evidence_excerpt: This approach was taken to increase the speed of the connection
    process as many other similar projects were going through the same process at
    the time. Conversely due to the relatively new grid forming technology there was
    a perceived risk of project delays should the grid forming control logic that
    was assumed at the start cause complications during the connections process. As
    a result, BESS achieved registration ahead of schedule and has been energised
    at the end of May 2024.
