  what_happened: The split-scope EPC delivery model for WDBESS assigned Tesla as EPC
    for batteries and inverters (including 20-year O&M and NEM bidding responsibilities
    under an LTSA and Market Participation Deed) and UGL as EPC for Balance of Plant
    and HV substation works. This arrangement was adopted to manage the distinct technical
    specialisms of inverter and civil/electrical BoP delivery.
  lesson_learnt: For utility-scale BESS projects, a split-scope EPC model separating
    battery/inverter delivery (with long-term LTSA and market participation obligations
    held by the OEM) from BoP and HV substation delivery can reduce integration risk
    by aligning contractual accountability with technical specialism — however, this
    requires careful coordination at the interface between the two EPC packages.
