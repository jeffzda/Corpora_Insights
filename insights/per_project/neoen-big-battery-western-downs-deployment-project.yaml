- record_id: ARENA-DLV-63120
  source_title: Neoen - Western Downs BESS Deployment - Development Report Milestone
    2
  publish_date: 2024-10
  project_name: Western Downs Battery Energy Storage System (WDBESS)
  what_happened: System Strength Charges (SSC) were not a consideration for WDBESS
    because the relevant rule change had not been finalised at the time of inverter
    selection or GPS application. However, future BESS projects will face a regulatory
    environment where GFM capability can be used to self-remediate system strength
    impacts and avoid or significantly reduce SSC — a financial incentive that did
    not exist for WDBESS.
  lesson_learnt: Future BESS projects in system strength constrained areas should
    evaluate GFM as a mechanism for self-remediating system strength impacts under
    the NER's Efficient Management of System Strength rules — the ability to avoid
    or reduce System Strength Charges may justify the additional cost of GFM implementation
    without relying on grant funding.
