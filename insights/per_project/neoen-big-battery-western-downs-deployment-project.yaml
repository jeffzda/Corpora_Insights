  project_name: Western Downs Battery Energy Storage System (WDBESS)
  what_happened: For WDBESS Stage 2, Neoen plans to commence GFM from the beginning
    of grid connection modelling activities rather than repeating the GFL-first approach
    used in Stage 1, with GFM COD expected in 2026. The learnings from Stage 1's 5.3.9
    process — including replicating settings and applying knowledge gained — are expected
    to enable GFM COD to be achieved in a single step.
  lesson_learnt: Organisations developing multiple GFM BESS projects at the same or
    electrically similar connection points can expect the second project's GFM approval
    process to be materially faster by replicating Stage 1 settings and model configurations
    — document GFM settings, model outputs and approval negotiation outcomes thoroughly
    during Stage 1 to accelerate Stage 2.
