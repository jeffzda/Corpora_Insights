  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: An interim agreement was reached with AEMO to register a FCAS
    value 5MW lower than the calculated response while AEMO continues its internal
    policy review on the treatment of synthetic inertia.
  transferability: broad
