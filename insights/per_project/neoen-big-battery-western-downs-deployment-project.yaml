  delay_category: grid connection/system studies
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: data & measurement
  intervention_note: Neoen flagged to ARENA that the process of establishing harmonic
    allocations is opaque and not shared with applicants, and has flagged this as
    an industry-wide issue warranting regulatory attention.
  transferability: broad
  delay_magnitude: 3-12 months
  technology_domain: battery storage
  source_pages: &id002
  - 7
  - 8
  evidence_excerpt: It should be noted that it is very difficult to predict how the
    harmonic allocations and polygon data from the Network Service Providers (NSPs)
    may change. The process of establishing harmonic emissions allocations is not
    public and not shared with the applicants. Until data is provided by the NPS it
    is impossible to undertake early power quality assessment with a good degree of
    certainty.
