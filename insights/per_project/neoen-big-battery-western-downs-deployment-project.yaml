- record_id: ARENA-DLV-63108
  source_title: Neoen - Western Downs BESS Deployment - Development Report Milestone
    2
  publish_date: 2024-10
  project_name: Western Downs Battery Energy Storage System (WDBESS)
  what_happened: GFM inverters operating in a faster control loop than GFL inverters
    supply different fault currents under fault conditions, necessitating redesign
    of protection settings within the generating system's electrical Balance of Plant.
    This protection redesign obligation must be addressed as part of the GFL-to-GFM
    transition and can be partially mitigated by tuning the GFM inverter's characteristic
    operation.
  lesson_learnt: When transitioning a BESS from GFL to GFM, proponents must review
    and likely redesign protection and arc-flash settings in the electrical BoP —
    the faster GFM control loop changes fault current characteristics significantly,
    and this should be scoped and budgeted early in the 5.3.9 process.
  issue_severity: moderate
  project_type: storage
  project_scale_band: utility/large-scale
  lifecycle_phase: development/design
  proponent_type: project developer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: The WDBESS design considers tuning the GFM inverter's characteristic
    operation to somewhat mitigate the impact on protection settings.
  transferability: moderate
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id008
  - 17
  - 18
  evidence_excerpt: Since the GFM inverter is typically operating on a much faster
    control loop than a GFL inverter, current supplied under fault conditions can
    vary significantly and necessitate re-design of protection settings within the
    generating system's electrical BoP. The impact of such change may be possible
    to somewhat mitigate where the characteristic operation of the GFM inverter can
    be tuned.
