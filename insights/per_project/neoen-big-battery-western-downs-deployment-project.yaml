- record_id: ARENA-DLV-50852
  source_title: Neoen - Big Battery (Western Downs) Deployment Project - Lessons Learnt
    Report 2
  publish_date: 2024-12
  project_name: Western Downs Battery Energy Storage System (WDBESS)
  what_happened: NSP harmonic emission allocations and polygon data are not made public
    and are not shared with applicants until partway through the connection studies
    process; Powerlink provided updated allocations and polygon data approximately
    three months after the 5.3.9 grid connection studies began, making early power
    quality assessment with meaningful certainty impossible.
  lesson_learnt: Project teams should not assume that harmonic allocations received
    at initial connection will remain valid through a GFM transition — NSP methodology
    and allocation data can change without notice, and projects should build schedule
    and budget contingency for late-stage revisions to harmonic data from the NSP.
  issue_severity: moderate
  project_type: storage
  project_scale_band: utility/large-scale
  lifecycle_phase: approvals/contracting
