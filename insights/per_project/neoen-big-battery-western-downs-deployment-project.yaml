  project_name: Western Downs Battery Energy Storage System (WDBESS)
  what_happened: At the time of inverter selection for WDBESS, there was no market
    mechanism in the NEM to value GFM services, meaning there was no financial incentive
    for project proponents to deploy GFM inverters. Grant funding from ARENA was required
    to make the business case viable and to incentivise deployment of advanced inverter
    technology.
  lesson_learnt: Until NEM market mechanisms are developed to monetise GFM services
    (such as an inertia ancillary services market or system strength charges), grant
    funding or other incentives will remain essential to enable GFM BESS deployment
    — project proponents should factor the absence of a GFM revenue stream into their
    business case and actively seek grant support.
