- record_id: ARENA-DLV-63119
  source_title: Neoen - Western Downs BESS Deployment - Development Report Milestone
    2
  publish_date: 2024-10
  project_name: Western Downs Battery Energy Storage System (WDBESS)
  what_happened: NER requirements for frequency control must be delivered via the
    Power Plant Controller (PPC) rather than natively via the inverter terminals,
    which imposes communication delay constraints. Real-world communication delays
    between the PPC and inverter at both software and hardware levels must be understood
    from project outset, as the PPC-based control path is inherently slower than native
    inverter terminal control.
  lesson_learnt: GFM BESS project designs must account for NER frequency control requirements
    being delivered through the PPC rather than via native inverter terminal control
    — controller communication and full cycle response times must be characterised
    and validated from the outset, as the regulatory requirement imposes a slower
    control path that may constrain performance in frequency response markets.
