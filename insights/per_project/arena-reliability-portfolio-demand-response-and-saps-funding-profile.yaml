- record_id: ARENA-DLV-25928
  source_title: Review of ARENA's Reliability Portfolio
  publish_date: 2020-01
  project_name: ARENA Reliability Portfolio — Demand Response and SAPS Funding Profile
  what_happened: The portfolio funding analysis showed that contributions toward most
    reliability needs — prediction and performance, dispatchability, third-party interactions,
    and technology integration — had been declining since 2017 and were expected to
    continue declining, while demand management and SAPS projects maintained their
    contribution levels due to existing committed funding. This created a projected
    gap in coverage of multiple reliability needs in the near term.
  lesson_learnt: Portfolio managers should actively monitor and project the future
    funding profile across reliability needs and initiate new funding rounds before
    a significant gap in coverage materialises, rather than waiting for funded projects
    to conclude before identifying the next funding priority.
