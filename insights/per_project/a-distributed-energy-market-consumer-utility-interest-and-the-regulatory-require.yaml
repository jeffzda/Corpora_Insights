- record_id: ARENA-DLV-72202
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: 2015-12
  project_name: 'A Distributed Energy Market: Consumer & Utility Interest, and the
    Regulatory Requirements'
  what_happened: The project found that current network tariff structures disadvantage
    low-energy users and low-income households, and that higher fixed charges for
    PV customers — a commonly proposed response to distributed energy uptake — would
    worsen customer equity rather than improve cost-reflectivity.
  lesson_learnt: Network tariff reform should use a fixed daily charge based on each
    customer's monthly demand peak rather than blanket higher fixed charges; this
    approach makes each customer's contribution to network costs more proportional
    to their actual network impact and avoids penalising low-income or low-energy
    households.
  issue_severity: moderate
  project_type: enabling infrastructure
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: concept/feasibility
  proponent_type: research organisation/university
