- record_id: ARENA-DLV-72201
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: 2015-12
  project_name: 'A Distributed Energy Market: Consumer & Utility Interest, and the
    Regulatory Requirements'
  what_happened: A research project using focus groups, public surveys, and industry
    interviews found that existing policy instruments — including information campaigns,
    minimum energy performance standards, house energy rating schemes, feed-in tariffs,
    and white certificate schemes — were insufficient to effectively integrate distributed
    energy into the Australian electricity market.
  lesson_learnt: Incremental policy instruments alone are insufficient to drive distributed
    energy integration; a regulatory framework enabling equal competition between
    supply-side and demand-side options at all levels, combined with Integrated Resource
    Planning in network planning, is required to unlock distributed energy's contribution
    to least-cost energy services.
