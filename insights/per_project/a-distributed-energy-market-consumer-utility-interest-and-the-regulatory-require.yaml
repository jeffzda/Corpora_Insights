  evidence_excerpt: A proportion of network costs could be paid through a fixed daily
    charge based on a customer's monthly demand peak, making each customer's contribution
    to network costs more related to their impact. This approach is preferable to
    current suggestions of higher fixed charges for all customers, or specifically
    for PV customers, which would disadvantage low energy users and low-income households
    while also making price signals less cost‐reflective.
