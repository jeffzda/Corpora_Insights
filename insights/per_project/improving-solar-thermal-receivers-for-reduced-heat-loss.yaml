  evidence_excerpt: Although the bladed receiver design developed within the project
    was predicted to have a significant performance saving, it was estimated that
    the increased cost of the receiver would outweigh the benefits of the increased
    performance. A key reason for this was the fact that the overall receiver extent
    (aperture size) could not be greatly reduced because otherwise light from the
    furthest heliostats would be 'spilled', causing efficiency to be lost.
