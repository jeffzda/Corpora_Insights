- record_id: ARENA-DLV-57553
  source_title: Bladed Receivers with Active Airflow Control (BRAAC) Project results
    and lessons learnt
  publish_date: 2019-07
  project_name: Bladed Receivers with Active Airflow Control (BRAAC)
  what_happened: During on-sun testing at the CSIRO Newcastle facility, instrument
    cabling was exposed to unexpectedly intense spilled flux, requiring additional
    shielding to be added during the testing phase.
  lesson_learnt: When designing and commissioning high-temperature receiver test rigs,
    explicitly account for 'spilled' flux reaching areas outside the primary receiver
    target — instrument cabling and other peripheral components need shielding assessed
    against worst-case spillage, not only nominal operating conditions.
