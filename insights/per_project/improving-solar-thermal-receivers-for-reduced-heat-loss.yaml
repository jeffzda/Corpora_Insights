- record_id: ARENA-DLV-57551
  source_title: Bladed Receivers with Active Airflow Control (BRAAC) Project results
    and lessons learnt
  publish_date: 2019-07
  project_name: Bladed Receivers with Active Airflow Control (BRAAC)
  what_happened: The bladed receiver design achieved a modelled efficiency of 94.1%
    versus 91.7% for the best-possible flat receiver, but cost-benefit analysis found
    the performance gains were outweighed by the higher receiver cost. Optical constraints
    on the aperture size prevented the receiver from being reduced sufficiently in
    size, making it more expensive than anticipated.
  lesson_learnt: Early-stage cost-benefit analysis must be revisited as design constraints
    become clearer during the project — initial estimates that assumed significant
    aperture size reductions proved inaccurate once optical spillage constraints were
    understood, rendering the concept commercially unviable as designed. An intermediate
    design optimising for both cost and performance should be scoped explicitly.
  issue_severity: major
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: development/design
