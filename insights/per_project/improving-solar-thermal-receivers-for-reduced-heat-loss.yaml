  publish_date: 2019-07
  project_name: Bladed Receivers with Active Airflow Control (BRAAC)
  what_happened: The receiver module built and tested at the CSIRO facility was extremely
    complex, resulting in a long design period that created time pressure during the
    testing phase and limited the team's ability to fully characterise performance
    gains from the bladed design.
  lesson_learnt: Prioritise simplicity in experimental hardware design — a complex
    prototype extends the design period, compresses testing time, and reduces the
    precision and completeness of results that can be obtained. Simplicity in design
    also translates to cost savings in the final product.
