- record_id: ARENA-DLV-57557
  source_title: Bladed Receivers with Active Airflow Control (BRAAC) Project results
    and lessons learnt
  publish_date: 2019-07
  project_name: Bladed Receivers with Active Airflow Control (BRAAC)
  what_happened: The project scope covered only receiver design and not concentrator
    (optical) design, resulting in receiver and heliostat field designs being developed
    in isolation. This decoupling meant that key optical constraints on aperture size
    — which ultimately undermined the cost case for the bladed receiver — were not
    fully integrated into receiver design optimisation.
  lesson_learnt: Receiver and concentrator (optical) designs are tightly coupled and
    must be developed in parallel with an explicit focus on minimising system cost
    — scoping only the receiver in isolation risks missing interactions that determine
    whether performance improvements translate to cost reductions at the system level.
  issue_severity: major
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: concept/feasibility
