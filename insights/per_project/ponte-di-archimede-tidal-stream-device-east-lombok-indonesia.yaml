- record_id: ARENA-DLV-50009
  source_title: Ocean Energy Report by Seanergy and Ernst and Young
  publish_date: 2016-06
  project_name: Ponte di Archimede Tidal Stream Device, East Lombok, Indonesia
  what_happened: Ponte di Archimede SpA (Italy) in partnership with PT Walinusal had
    a 0.18 MW tidal stream platform built and on site at East Lombok island, Indonesia,
    but deployment at sea was stalled while waiting for a budget to proceed.
  lesson_learnt: Technology developers entering emerging markets for tidal or wave
    energy should secure full project funding including deployment costs before mobilising
    equipment to site; a device that is built and on site but cannot be deployed due
    to budget shortfall ties up capital and creates project uncertainty that can deter
    further investment.
