- record_id: ARENA-DLV-51493
  source_title: UTS - Flexible Demand State of Play in Australia - Report
  publish_date: 2024-05
  project_name: Enel X – Backup Boost
  what_happened: Existing retail contracts for some commercial sites in the Enel X
    Backup Boost program either required retailer consent to participate in demand
    response or explicitly prohibited backup generator use for anything other than
    emergency purposes, preventing participation.
  lesson_learnt: Before enrolling commercial sites in demand response programs using
    backup generation assets, check existing retail contract terms — clauses that
    require retailer consent for demand response or restrict generator use to emergencies
    are common and will prevent participation without renegotiation; program designers
    should develop standard contractual templates that accommodate demand response
    use cases.
