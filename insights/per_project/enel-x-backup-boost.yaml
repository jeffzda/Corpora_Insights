- record_id: ARENA-DLV-51492
  source_title: UTS - Flexible Demand State of Play in Australia - Report
  publish_date: 2024-05
  project_name: Enel X – Backup Boost
  what_happened: In the Enel X Backup Boost trial of commercial backup generators
    and batteries as demand response resources, not all recruited sites proved suitable
    or feasible — some generators were too old or poorly maintained, network connection
    costs were prohibitively high at some sites, and existing retail contracts explicitly
    prohibited backup generator use for purposes other than emergency.
  lesson_learnt: Commercial site qualification for backup generator demand response
    programs requires upfront technical and commercial screening against generator
    age/condition, network connection costs, and existing retail contract terms —
    failure to screen for these factors leads to significant wasted recruitment effort
    and pipeline attrition.
