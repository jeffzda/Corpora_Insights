- record_id: ARENA-DLV-48109
  source_title: ARENA-Funded Cutting Edge Research in Photovoltaics
  publish_date: 2019-09
  project_name: Advanced Si Solar Cells by DESIJN (Deposited Si Junctions) (2017/RND016)
  what_happened: The team fabricated a 23% efficient p-type cell using a heavily boron-doped poly-Si layer deposited by a low-cost sputtering method with in-situ doping. This approach had distinct cost
    and safety advantages over standard poly-Si contact methods and was assessed as having potential for transfer to Jinko Solar's production lines.
  lesson_learnt: Sputtering with in-situ doping is a viable low-cost and safer alternative to standard poly-Si contact formation methods for passivated contact solar cells; when designing R&D programs targeting
    manufacturing cost reduction, include explicit assessment of deposition method safety and cost alongside efficiency metrics from the outset.
