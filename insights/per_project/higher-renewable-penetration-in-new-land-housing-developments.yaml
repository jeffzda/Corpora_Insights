- record_id: ARENA-DLV-12055
  source_title: Delivering Higher Renewable Penetration in New Land & Housing Developments
    Through Edge-of-Grid Microgrids
  publish_date: 2016-09
  project_name: Huntlee Energy Utility
  what_happened: Available microgrid modelling tools (HOMER Pro and Siemens SIMPSON)
    were found to be highly labour-intensive for long-horizon greenfield development
    projects, requiring manual data entry for each modelling year and unable to automatically
    carry forward assets installed in prior years, making 30-year modelling extremely
    time-consuming.
  lesson_learnt: Project teams modelling multi-decade microgrids should budget significant
    additional time and resources for the modelling phase, and should advocate for
    or develop automated modelling tools that accept price and load escalators and
    model multi-year asset staging — existing commercial tools are not fit for purpose
    for this application.
