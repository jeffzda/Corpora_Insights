  what_happened: Cessnock City Council expressed strong support for the Huntlee Energy
    concept but raised a concern about being required to purchase non-contestable
    energy supplies from Huntlee Energy Retail. Legal advice confirmed that council
    facilities would not be denied Ausgrid access and could contest the utility's
    services, but would need to fund Ausgrid lead-in works to their facilities.
  lesson_learnt: Community microgrid proponents should engage local councils early
    and proactively address concerns about monopoly supply obligations — councils
    serving community facilities will be sensitive to procurement lock-in and require
    clear evidence that competitive access or alternative supply options remain available
    to them.
