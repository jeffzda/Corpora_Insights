- record_id: ARENA-DLV-12053
  source_title: Delivering Higher Renewable Penetration in New Land & Housing Developments
    Through Edge-of-Grid Microgrids
  publish_date: 2016-09
  project_name: Huntlee Energy Utility
  what_happened: The project found that the microgrid financial model showed a positive
    result but was not bankable without government support due to high sensitivity
    variables including battery costs, regulatory uncertainty, and the risk premium
    associated with being a first-of-a-kind project requiring contractual guarantees
    to the developer and community.
  lesson_learnt: FOAK community microgrid projects are unlikely to be privately financeable
    without government co-investment — the combination of battery price uncertainty,
    regulatory ambiguity, and contractual risk premiums demanded by developers and
    communities creates a financing gap that public support must bridge for the first
    projects in a new market.
  issue_severity: major
  project_type: multi-technology/hybrid
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: project developer
  delay_category: financing/commercial close
  failure_mode: commercial & market
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: The project proposed a hybrid co-operative/investor (multi-user
    local ownership) model to spread risk and attract private capital, and identified
    government support as a prerequisite for the first project.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hybrid systems
  source_pages: &id003
