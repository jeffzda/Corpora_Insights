  source_title: Delivering Higher Renewable Penetration in New Land & Housing Developments
    Through Edge-of-Grid Microgrids
  publish_date: 2016-09
  project_name: Huntlee Energy Utility
  what_happened: The project found that the maximised reliability microgrid network
    design achieved SAIDI performance approximately one-fifth that of the minimised
    cost design (average 20.4 min/a vs 95 min/a), while maintaining similar interruption
    frequency (SAIFI). The minimised cost design produced maximum SAIDI values of
    238.4 min/a — three times worse than Ausgrid's actual performance.
  lesson_learnt: Edge-of-grid microgrid proponents must not select a minimised-cost
    network design if reliability performance comparable to the incumbent distributor
    is required — the reliability penalty is severe, with worst-case unavailability
    up to 15 times higher than best-case in a minimised design. A maximised reliability
    design can achieve SAIDI of approximately one-third of the incumbent distributor's
    actual performance.
