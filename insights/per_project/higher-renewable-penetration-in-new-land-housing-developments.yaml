- record_id: ARENA-DLV-12057
  source_title: Delivering Higher Renewable Penetration in New Land & Housing Developments
    Through Edge-of-Grid Microgrids
  publish_date: 2016-09
  project_name: Huntlee Energy Utility
  what_happened: Market research with prospective Huntlee residents found strong customer
    acceptance of the community microgrid concept. No respondents wanted to opt out,
    and customers were attracted by price savings, the cooperative dividend structure,
    innovation, and not having to maintain their own equipment. Price was identified
    as the key acceptance driver.
  lesson_learnt: Community microgrid proponents can expect strong customer acceptance
    in greenfield residential developments provided the product is positioned around
    price competitiveness and community ownership — cooperative dividend structures
    and freedom from equipment maintenance responsibility are significant positive
    differentiators. Conduct market research early to confirm and refine these positioning
    elements.
