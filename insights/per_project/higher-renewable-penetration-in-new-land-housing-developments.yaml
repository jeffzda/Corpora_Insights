  project_name: Huntlee Energy Utility
  what_happened: The project found that the regulatory and commercial development
    of a large-scale community microgrid was highly iterative, with technical, commercial,
    and regulatory workstreams deeply interdependent — new learnings in one area frequently
    required rework in others, and no existing technical, regulatory, or commercial
    frameworks entirely captured the intent of the proposed project.
  lesson_learnt: Teams developing novel community microgrid projects should plan for
    an iterative, non-linear development process with tightly coupled technical, commercial,
    and regulatory workstreams — sequential phase-gate approaches are inadequate and
    the absence of precedent means significant rework cycles should be budgeted from
    the outset.
