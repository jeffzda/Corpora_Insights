- record_id: ARENA-DLV-12052
  source_title: Delivering Higher Renewable Penetration in New Land & Housing Developments
    Through Edge-of-Grid Microgrids
  publish_date: 2016-09
  project_name: Huntlee Energy Utility
  what_happened: The project determined that battery storage was less commercially
    viable than anticipated at the time of study. Battery prices in the short term
    were higher than modelled thresholds for economic deployment, and managing solar
    spill through diverse load profiles proved more important than early battery deployment.
  lesson_learnt: Do not size battery storage based on current pricing when modelling
    a long-horizon project — battery economics improve significantly over a 5-year
    horizon, and near-term solar spill management through load profile diversity can
    substitute for battery investment until prices fall to commercially viable levels.
