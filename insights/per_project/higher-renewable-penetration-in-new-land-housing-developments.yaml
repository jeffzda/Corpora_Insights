  evidence_excerpt: 'By year 2025 it became cheaper to add solar and batteries rather
    than gas and diesel generation. This was a critical point as it not only reduces
    the levelised cost of energy, but reduces all the gas price volatility risk. At
    this point key prices had reached: Gas: 106% of base... PV CAPEX: 67% of base...
    Battery CAPEX: 49% of base.'
