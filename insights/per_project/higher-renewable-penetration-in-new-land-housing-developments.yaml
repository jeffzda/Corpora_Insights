- record_id: ARENA-DLV-12062
  source_title: Delivering Higher Renewable Penetration in New Land & Housing Developments
    Through Edge-of-Grid Microgrids
  publish_date: 2016-09
  project_name: Huntlee Energy Utility
  what_happened: The project found that by year 2025 in the modelled scenario, solar
    and batteries become cheaper than gas and diesel generation for the Huntlee microgrid.
    This crossover point reduced levelised cost of energy and eliminated gas price
    volatility risk from the generation mix, with PV CAPEX reaching 67% of base, battery
    CAPEX reaching 49% of base, and battery BoP CAPEX reaching 58% of base by that
    point.
  lesson_learnt: Long-horizon microgrid financial models should plan for a gas-to-solar-plus-battery
    transition point around the mid-2020s — designing the system architecture for
    modularity that accommodates increasing battery and solar penetration over time,
    rather than locking in gas-dominant configurations, will significantly improve
    long-run economics and reduce commodity risk.
  issue_severity: none
