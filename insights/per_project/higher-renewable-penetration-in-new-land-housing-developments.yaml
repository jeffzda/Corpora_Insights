  evidence_excerpt: To have a functioning competitive market, technical standards
    must be implemented to support common interfaces and communications. These standards
    must be open enough to allow a variety of business models and end user flexibility.
    Engineering specifications (such as IEEE 1547), the communications requirements,
    information exchange and monitoring, control and telemetry requirements are critical.
