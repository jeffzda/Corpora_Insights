  source_title: Delivering Higher Renewable Penetration in New Land & Housing Developments
    Through Edge-of-Grid Microgrids
  publish_date: 2016-09
  project_name: Huntlee Energy Utility
  what_happened: The project identified that there are no common technical standards
    for microgrids in Australia, and that the lack of technical standards for interfaces
    and communications is a barrier to widespread microgrid deployment and competitive
    market development.
  lesson_learnt: Microgrid proponents engaging with regulators should advocate for
    the establishment of common technical standards covering interfaces, communications,
    information exchange, monitoring, control, and telemetry — the absence of such
    standards is a systemic barrier that individual projects cannot resolve alone
    and that limits market scalability.
  issue_severity: moderate
  project_type: multi-technology/hybrid
  project_scale_band: demonstration
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: BEA identified the UK IDNO regulatory framework as a starting
    point for Australian regulatory reform and recommended specific standards (e.g.
    IEEE 1547) as a basis for technical standards development.
  transferability: broad
  delay_magnitude: null
  technology_domain: hybrid systems
  source_pages: &id010
