- record_id: ARENA-DLV-12056
  source_title: Delivering Higher Renewable Penetration in New Land & Housing Developments
    Through Edge-of-Grid Microgrids
  publish_date: 2016-09
  project_name: Huntlee Energy Utility
  what_happened: Home builders, who are a critical link in the supply chain for implementing
    home energy solutions in land subdivisions, were found to require deep and extensive
    engagement for customisation of home energy packages. Initial engagement indicated
    this would be a major exercise, and the modelling ultimately showed that the benefits
    of tailored home energy solutions did not outweigh the cost and difficulty of
    compelling home builders to participate at the project's early stage.
  lesson_learnt: In land subdivision developments where the developer sells lots to
    independent home builders, proponents should not rely on home builders as a delivery
    channel for home energy solutions without a dedicated and early engagement programme
    — the supply chain friction is significant and the economic case for mandated
    participation may not stack up. Focus control system compatibility requirements
    on builders rather than prescribing specific products.
  issue_severity: moderate
  project_type: multi-technology/hybrid
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: project developer
  delay_category: stakeholder/land/community
  failure_mode: coordination & stakeholders
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: The project scaled back prescriptive home energy solution requirements
    and instead focused on ensuring home systems installed were compatible with the
    microgrid control system; an 'innovation home' was planned to demonstrate best
    practice to builders.
