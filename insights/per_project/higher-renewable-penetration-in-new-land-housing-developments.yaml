  publish_date: 2016-09
  project_name: Huntlee Energy Utility
  what_happened: The project found that gas generators would initially serve up to
    70% of total load in the Huntlee microgrid, making the project highly sensitive
    to gas price. Frontier Economics' gas price forecasting was identified as a critical
    modelling uncertainty due to the impact of LNG exports on domestic gas markets
    making prices harder to forecast.
  lesson_learnt: Microgrid financial models with significant gas generation components
    should treat gas price as a high-sensitivity variable requiring scenario analysis,
    particularly in eastern Australia where LNG export development has linked domestic
    prices to international markets — sensitivity testing should cover a wide range
    of gas price scenarios and the generation mix should be designed to reduce gas
    dependence over the project life.
