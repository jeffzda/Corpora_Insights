- record_id: ARENA-DLV-12054
  source_title: Delivering Higher Renewable Penetration in New Land & Housing Developments
    Through Edge-of-Grid Microgrids
  publish_date: 2016-09
  project_name: Huntlee Energy Utility
  what_happened: The NBN was constructed as a closed network that cannot carry metering
    and utility communications data, meaning a dedicated proprietary communications
    network with associated trenching and approvals had to be planned for the Huntlee
    smart microgrid, adding significant cost and complexity.
  lesson_learnt: Microgrid proponents in greenfield developments should not assume
    that NBN infrastructure can serve as the communications backbone for smart metering
    and telemetry — a dedicated fibre or equivalent network must be scoped, costed,
    and approved separately, and early engagement with NBN Co and local authorities
    on shared infrastructure use is essential.
