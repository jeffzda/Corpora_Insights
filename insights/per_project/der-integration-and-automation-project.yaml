  source_title: DER Integration and Automation Project Final Report
  publish_date: null
  project_name: DER Integration and Automation Project
  what_happened: The project identified that DER group membership in the DERMS must
    be updated dynamically as the distribution network is reconfigured (e.g., when
    a resource moves from one feeder to another), but no mechanism existed in the
    current implementation to automate this membership update.
  lesson_learnt: Production DER management systems must implement dynamic DER group
    membership update mechanisms driven by network reconfiguration events — static
    group membership will cause constraint-management errors whenever the network
    topology changes, which is a routine operational occurrence for DNSPs.
  issue_severity: minor
