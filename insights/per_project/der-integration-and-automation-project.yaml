    on the selected feeder; a simplified algorithm using load curves derived from
    smart meter historical data was substituted.
  lesson_learnt: In high-DER-penetration networks, raw feeder current data is an inadequate
    input for DERMS forecast engines — smart meter historical data or equivalent granular
    consumption records must be secured before model deployment to avoid degraded
    forecast quality and constraint-management accuracy.
