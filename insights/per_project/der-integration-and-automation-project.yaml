- record_id: ARENA-DLV-46202
  source_title: DER Integration and Automation Project Final Report
  publish_date: null
  project_name: DER Integration and Automation Project
  what_happened: A race condition was identified in which a change to a DER group's
    planned schedule between DERMS sending a dispatch request and deX generating a
    response could result in deX requesting an incorrect power delta that would not
    fully resolve the detected grid constraint, requiring multiple iterations.
  lesson_learnt: Multi-platform DER orchestration architectures must implement correlation
    IDs between exchanged schedule messages so that each platform can confirm it is
    responding to the correct request version — without this, race conditions under
    dynamic schedule updates will require multiple constraint-resolution iterations
    and reduce reliability.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: network business
  delay_category: commissioning/integration
  failure_mode: unvalidated integration
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The issue was mitigated for the current project by using one-hour
    time resolution schedules, which made race conditions unlikely in practice; a
    full fix via correlation IDs was deferred to a next project phase.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: DER
  source_pages: &id002
  - 44
  - 45
  evidence_excerpt: The race condition can be prevented if the IoT hub communicates
    to deX knows which planned schedule is considered by EcoStruxure DERMS for resolving
    detected problem. To use adequate planned schedule of DER group, deX needs additional
    information, e.g., correlation Id of exchanged messages.
  confidence_note: null
