  source_title: DER Integration and Automation Project Final Report
  publish_date: null
  project_name: DER Integration and Automation Project
  what_happened: The DERMS architecture assigned each DER to a single DER group, meaning
    a single DER resource could not simultaneously contribute to resolving multiple
    co-located network issues (e.g., both a transformer overload and a feeder voltage
    violation), limiting the value that individual DER assets could provide.
  lesson_learnt: DER group management systems should be designed for non-exclusivity
    from the outset — allowing a DER to be a member of multiple groups simultaneously
    enables it to contribute to resolving more than one network constraint and maximises
    the utilisation value of each asset.
