- record_id: ARENA-DLV-46208
  source_title: DER Integration and Automation Project Final Report
  publish_date: null
  project_name: DER Integration and Automation Project
  what_happened: Network systems were not provided with visibility of the capacity
    of contracts available through the deX Evaluation Engine; when DERMS issued a
    constraint-resolution request that exceeded available contract capacity, the Evaluation
    Engine refused it and returned an unchanged DER flexibility schedule with no explicit
    rejection signal.
  lesson_learnt: Network management systems should be given visibility of DER contract
    capacities held by the market platform so that constraint-resolution requests
    are sized within deliverable bounds; additionally, the architecture must explicitly
    handle and communicate contract-capacity refusals rather than returning an unchanged
    schedule, which is indistinguishable from other failure conditions.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: network business
  delay_category: null
  failure_mode: unvalidated integration
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: 'Identified as a design requirement for production implementation:
    expose contract capacity data from the market platform to the network management
    system, and implement explicit accept/reject messaging between platforms.'
  transferability: moderate
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id008
  - 47
  - 48
  evidence_excerpt: In the implementation of this solution, network systems have not
    been provided with visibility over the capacities of the contracts available to
    resolve the network issue. This means that when a network issue arises, network
    systems may request a service response that exceeds the capacities of the contracts.
    This would result in a refusal of the requested schedule by the Evaluation Engine,
    which would be communicated back to network systems as unchanged DER flexibility
    schedule.
