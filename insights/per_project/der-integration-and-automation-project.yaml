  project_name: DER Integration and Automation Project
  what_happened: The network model used in the DERMS pilot required manual fine-tuning
    by the vendor (Schneider Electric) because the GIS data quality was insufficient
    to produce logically consistent load-flow results; the tuning changes were not
    tracked back to the GIS, leaving a persistent divergence between the pilot model
    and the production GIS.
  lesson_learnt: Before deploying model-based DERMS functionality, DNSPs should conduct
    a dedicated GIS data quality audit and remediation exercise; model corrections
    made during vendor tuning must be formally tracked back to the GIS to avoid a
    persistent divergence that will need to be reconciled before any production deployment.
