- record_id: ARENA-DLV-46206
  source_title: DER Integration and Automation Project Final Report
  publish_date: null
  project_name: DER Integration and Automation Project
  what_happened: During use case execution it was found that even when DERMS issued
    a requested schedule within the stated flexibility limits of a DER group, the
    service could not be delivered because the available energy for the day had already
    been exhausted; DERMS received an unchanged schedule with no indication of why
    the request was refused.
  lesson_learnt: Network management systems need visibility of available energy (not
    just instantaneous power flexibility limits) per DER group so that constraint-resolution
    requests are sized to what is actually deliverable — without energy state information,
    DERMS cannot distinguish a refused request due to insufficient energy from other
    failure modes.
