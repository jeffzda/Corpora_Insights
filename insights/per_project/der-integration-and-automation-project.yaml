- record_id: ARENA-DLV-46205
  source_title: DER Integration and Automation Project Final Report
  publish_date: null
  project_name: DER Integration and Automation Project
  what_happened: When DERMS sent a requested schedule to deX and the IoT Hub polled
    deX before the new schedule had been generated, the hub passed back the old (unchanged)
    schedule to DERMS, causing DERMS to re-send the same request — potentially confusing
    deX into treating it as an additional new request.
  lesson_learnt: IoT Hub polling logic in multi-platform DER orchestration should
    use an ID-increment or event-driven publish mechanism rather than fixed-interval
    polling, so that DERMS only receives a response once deX has actually generated
    updated schedules — reducing spurious re-requests and platform confusion.
  issue_severity: minor
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: network business
  delay_category: null
  failure_mode: unvalidated integration
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Identified that the deX bridge API already supports a 'last ID'
    mechanism allowing the client to retrieve only schedules generated after a given
    ID; adopting this would eliminate the stale-poll issue.
  transferability: moderate
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id005
  - 46
  - 47
  evidence_excerpt: The current configuration has the IoT Hub polling deX each 15
    minutes, and passes everything through to DERMS, regardless of whether the schedules
    have changed. So, in case that the schedules are still not changed, IoT Hub will
    collect old results and send them to DERMS.
