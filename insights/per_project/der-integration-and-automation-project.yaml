- record_id: ARENA-DLV-46219
  source_title: DER Integration and Automation Project Final Report
  publish_date: null
  project_name: DER Integration and Automation Project
  what_happened: The project identified that a polling/publishing model — where data
    is exchanged between the network management system and the market platform only
    when data is ready — is needed, rather than the fixed-interval polling used in
    this implementation, which transmitted stale data and caused redundant processing.
  lesson_learnt: Fixed-interval polling between DERMS and DER market platforms generates
    unnecessary data traffic, stale schedule transmissions, and redundant constraint-resolution
    attempts; a publish-on-change (event-driven) data exchange model should be the
    target architecture for production DER orchestration integrations.
