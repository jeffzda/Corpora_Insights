  project_name: DER Integration and Automation Project
  what_happened: Large DER group flexibility schedule payloads from deX were too large
    to transmit as a single packet; deX split them into multiple messages, and the
    IoT Hub had to merge them before forwarding to DERMS, adding integration complexity
    and a potential point of message-assembly failure.
  lesson_learnt: When integrating DER market platforms with network management systems
    via an IoT Hub, design and test message-size handling from the outset — large
    flexibility schedule payloads will likely exceed single-packet limits, requiring
    explicit splitting and merging logic in the hub that must be validated as a first-class
    integration requirement.
