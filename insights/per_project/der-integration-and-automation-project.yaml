  what_happened: The original project design included a merit-order approach to DER
    curtailment where customers would be curtailed in price sequence; during detailed
    design this was changed to a 'pain sharing' approach that curtails all DER customers
    equally, because the merit-order method raised equity-of-access concerns.
  lesson_learnt: When designing DER curtailment logic for DNSP constraint management,
    evaluate equity-of-access implications at the outset — a merit-order approach
    may be technically optimal but politically and regulatorily unacceptable, requiring
    redesign if not addressed early.
