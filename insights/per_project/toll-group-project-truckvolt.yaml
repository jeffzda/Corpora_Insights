- record_id: ARENA-DLV-58019
  source_title: Toll Group - Project Truckvolt - Infrastructure Design Report
  publish_date: 2025-10
  project_name: Project Truckvolt
  what_happened: Installation works across nine customer-owned sites with varied safety
    protocols required close coordination with customer teams and tailored installation
    plans for each site, with a formal Toll representative assigned authority over
    each work zone and a Work Authorisation Form required before works commenced.
  lesson_learnt: When installing infrastructure on customer-owned sites, formally
    assign a named representative with authority over the work zone at each site and
    require execution of a Work Authorisation Form — clear accountability structures
    prevent safety lapses arising from ambiguity about who controls the work zone
    in complex multi-party environments.
