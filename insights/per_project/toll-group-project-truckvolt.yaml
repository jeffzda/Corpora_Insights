  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Partnered with Volvo to access their Electric Range Simulation
    (ERS) tool, enabling accurate energy consumption modelling and scenario planning
    for charging infrastructure placement and top-up charging opportunities.
  transferability: broad
  delay_magnitude: null
  technology_domain: EV
