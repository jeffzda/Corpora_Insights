- record_id: ARENA-DLV-6956
  source_title: Toll Group - Project Truckvolt - Lessons Learnt Report
  publish_date: '2025-09-29'
  project_name: Project Truckvolt
  what_happened: Reduced payload capacity resulting from operating under CML/GML rather
    than HML conditions meant BEVs could not fully replace diesel vehicles on high-load
    routes, requiring retention of ICE vehicles to cover lost capacity — estimated
    at one ICE vehicle per two to three BEVs deployed.
  lesson_learnt: Total cost of ownership models for heavy BEV fleets must include
    the ongoing cost of retaining ICE vehicles to cover payload shortfalls — approximately
    one ICE unit per two to three BEVs — including registration, insurance, depreciation,
    fuel, and maintenance, until regulatory barriers to full payload access are resolved.
