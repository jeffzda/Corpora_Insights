  source_title: Toll Group - Project Truckvolt - Lessons Learnt Report
  publish_date: '2025-09-29'
  project_name: Project Truckvolt
  what_happened: Across nine deployment sites with six customers in three states,
    the charging infrastructure approval process was non-linear and required repeated
    design amendments — stakeholders including customers, property teams, landlords,
    insurers, town planners, fire engineers, and emergency services all imposed varying
    requirements, causing significant back-and-forth with charging infrastructure
    installers.
  lesson_learnt: For multi-site BEV charging infrastructure deployments, map all approval
    stakeholders (customer, property/landlord, insurer, town planner, fire engineer,
    emergency services) at each site before finalising infrastructure design — design
    must accommodate the most stringent requirements across all parties, and iterative
    redesign cycles should be budgeted for as a default.
