- record_id: ARENA-DLV-6958
  source_title: Toll Group - Project Truckvolt - Lessons Learnt Report
  publish_date: '2025-09-29'
  project_name: Project Truckvolt
  what_happened: Where BEVs were deployed to transport packaged dangerous goods (forklift
    gas cylinders) at and near Major Hazardous Facilities, extensive multi-party risk
    assessments were required, covering BEV fire risk during charging, emergency response,
    and site-specific hazard interactions — adding significant time and cost to deployment
    preparation.
  lesson_learnt: For BEV deployments at or near Major Hazardous Facilities, plan for
    extensive multi-party risk assessment processes involving HSE teams, third-party
    consultants, fire engineers, and emergency services — select OEMs with robust
