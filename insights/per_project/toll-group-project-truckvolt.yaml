  project_name: Project Truckvolt
  what_happened: In Western Australia, NHVR exemptions allowing higher axle weights
    for BEVs do not apply, meaning all BEV heavy vehicles must operate at diesel-equivalent
    weights regardless of BEV-specific mass allowances available in eastern states.
  lesson_learnt: When planning BEV heavy vehicle deployments in Western Australia,
    do not assume NHVR HML exemptions apply — WA operates under its own framework
    and BEVs must run at standard diesel weights, materially reducing payload and
    operational viability compared to eastern state deployments.
