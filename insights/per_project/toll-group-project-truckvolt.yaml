- record_id: ARENA-DLV-6957
  source_title: Toll Group - Project Truckvolt - Lessons Learnt Report
  publish_date: '2025-09-29'
  project_name: Project Truckvolt
  what_happened: The project's initial scope included deploying two prime movers to
    transport bulk dangerous goods (flammable gases) using BEVs, but this was found
    to be impermissible because BEVs do not conform to AS 2809, which governs tank
    vehicles transporting flammable gases — resulting in a scope change before deployment.
  lesson_learnt: Do not assume BEVs can substitute for diesel vehicles in bulk dangerous
    goods (flammable gas tank vehicle) operations — BEVs are currently out of scope
    for AS 2809 compliance, making their use for bulk DG transport impermissible;
    verify DG regulatory pathway before including such routes in BEV deployment scope.
  issue_severity: major
  project_type: transport electrification
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: fleet/logistics operator
  delay_category: approvals/regulatory
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: regulatory & approvals
  intervention_note: Removed bulk DG transport from the BEV deployment scope; retained
    packaged DG transport (forklift gas cylinders under class 2) which is permissible
    under current regulations, supported by extensive risk assessments.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: EV
  source_pages: &id007
