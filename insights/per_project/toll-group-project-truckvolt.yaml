  source_title: Toll Group - Project Truckvolt - Infrastructure Design Report
  publish_date: 2025-10
  project_name: Project Truckvolt
  what_happened: Toll evaluated Charging as a Service (CaaS) versus direct procurement
    and ownership of charging infrastructure; CaaS was found to be higher cost over
    the long term and was rejected in favour of Toll and its project partners directly
    owning and maintaining the chargers, with asset ownership transferred to customers
    for units on their sites.
  lesson_learnt: For multi-site fleet charging deployments where infrastructure will
    be co-located with customers, evaluate both CaaS and direct ownership models —
    direct procurement can reduce long-term cost but requires a clear asset ownership
    and maintenance governance model, particularly where the deploying organisation
    is not the site leaseholder; transferring ownership to the site leaseholder simplifies
    commercial arrangements.
