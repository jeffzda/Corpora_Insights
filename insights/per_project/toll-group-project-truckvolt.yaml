  what_happened: At project outset, Volvo was the only OEM marketing heavy rigid and
    prime mover EVs in Australia, with Daimler's eActros models pending but unreleased;
    regulatory requirements for right-hand-drive compliance and Australian Design
    Rule (ADR) certification constrained vehicle choice to a single supplier for the
    project.
  lesson_learnt: When scoping heavy BEV fleet projects in Australia, account for the
    very limited OEM availability — ADR certification and right-hand-drive conversion
    requirements mean competing models may not be market-ready for years; single-supplier
    dependency should be identified as a procurement risk early and factored into
    vehicle selection and contract strategy.
