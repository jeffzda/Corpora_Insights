  what_happened: Installations at sites operating on a 24/7 basis were particularly
    challenging because there were very limited windows for power shutdowns required
    to complete hardware installation, and scheduling works out of business hours
    incurred higher costs due to penalty rates.
  lesson_learnt: For 24/7 operational sites, budget explicitly for after-hours installation
    work including penalty rates — identify shutdown window constraints during site
    scoping and incorporate contingency for out-of-hours costs to avoid budget shortfalls
    and disruption to customer operations during the installation phase.
