  what_happened: The absence of consistent national legislation governing BEV and
    charging infrastructure installation led to unforeseen additional costs across
    multiple sites, including fire engineer reports, soil testing, third-party certifications,
    town planning approvals, and brigade reports — each site requiring a bespoke process.
