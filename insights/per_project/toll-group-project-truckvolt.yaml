- record_id: ARENA-DLV-6951
  source_title: Toll Group - Project Truckvolt - Lessons Learnt Report
  publish_date: '2025-09-29'
  project_name: Project Truckvolt
  what_happened: Without access to an accurate route simulation tool early in the
    project, it was difficult to determine whether BEVs were operationally viable
    on specific routes, assess actual energy consumption, or correctly size charging
    infrastructure requirements before committing to deployments.
  lesson_learnt: Use an accurate route planning and energy simulation tool (such as
    Volvo's ERS) at the very start of project scoping — before committing to vehicle
    or infrastructure procurement — to determine BEV suitability, actual energy consumption,
    and charging infrastructure sizing for each specific route and application.
