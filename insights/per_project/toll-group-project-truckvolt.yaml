  project_name: Project Truckvolt
  what_happened: Queensland required formal NHVR network access applications for BEV
    heavy vehicles, and approval delays extended to 2–3 months, compared to NSW and
    Victoria where BEVs can operate under GML without a permit.
  lesson_learnt: When deploying heavy BEVs in Queensland, factor in 2–3 months for
    NHVR network access approvals via TMR — unlike NSW and Victoria, Queensland requires
    a formal application and does not grant automatic access under GML conditions.
