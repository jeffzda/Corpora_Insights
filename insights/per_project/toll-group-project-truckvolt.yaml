- record_id: ARENA-DLV-6955
  source_title: Toll Group - Project Truckvolt - Lessons Learnt Report
  publish_date: '2025-09-29'
  project_name: Project Truckvolt
  what_happened: The higher tare weight of BEVs combined with council rejection of
    8-tonne steer axle loads made heavy BEVs incompatible with entire council regions,
    effectively excluding those areas from BEV deployment even where NHVR approval
    had been obtained.
  lesson_learnt: Conduct council-level road and axle load compatibility checks before
    selecting routes and committing BEV assets — council rejection of 8t steer axle
    limits can render heavy BEVs entirely incompatible with a region, since higher
    BEV tare weights will exceed 7t once loaded.
