- record_id: ARENA-DLV-6953
  source_title: Toll Group - Project Truckvolt - Lessons Learnt Report
  publish_date: '2025-09-29'
  project_name: Project Truckvolt
  what_happened: Council-level road access permits for last-mile delivery destinations
    cost approximately $91 per route address and took over three months in some cases
    with no clear timeline, creating significant cost and schedule uncertainty for
    BEV deployments with multi-stop route trucks.
  lesson_learnt: Budget for council road access permits at ~$91 per route address
    and allow more than three months for approvals — the process is unclear, costly,
    and time-consuming; consider whether operating under CML/GML (reduced payload)
    is more practical than pursuing HML permits for each address.
  issue_severity: major
  project_type: transport electrification
  project_scale_band: first commercial/FOAK
  lifecycle_phase: approvals/contracting
  proponent_type: fleet/logistics operator
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: coordination & stakeholders
  intervention_note: Opted to operate under CML/GML (concessional or general mass
    limits) rather than applying for HML permits in complex council jurisdictions,
    accepting reduced payload to avoid permit delays.
  transferability: moderate
  delay_magnitude: 3-12 months
  technology_domain: EV
  source_pages: &id003
  - 7
  - 8
  evidence_excerpt: Generally, the claim is 30 days for a response to grant access
    or reject, we have however seen this extend beyond 3 months and our engineering
    team have been required to follow up multiple times with no clear timeline given
    for an answer on the request.
