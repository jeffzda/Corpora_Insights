- record_id: ARENA-DLV-72308
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects - First Edition Results'
  publish_date: '2014'
  project_name: The National Feeder Taxonomy Study
  what_happened: CSIRO and Ausgrid, working with 11 of 16 Australian DNSPs, produced the first publicly accessible nationally representative set of 19 distribution network models capturing the full diversity
    of Australian electricity feeders, from urban underground systems to remote single-wire earth-return networks.
  lesson_learnt: Building a shared, publicly accessible national feeder taxonomy through multi-DNSP collaboration resolves a critical data gap that had previously prevented rigorous national assessment
    of DER integration impacts and smart grid trial transferability — future policy and trial design should draw on such a taxonomy before extrapolating results.
