  evidence_excerpt: Working cooperatively with 11 distribution network service providers from across Australia as part of the Smart Grid, Smart City programme, CSIRO and AusGrid produced, for the first
    time, a succinct and publically accessible set of network models that effectively capture the diversity of Australia's electricity distribution networks... The work underlines the unique context of
    Australian electricity systems, explores regional differences in network construction and provides a mechanism for assessing the transferability of existing trials.
