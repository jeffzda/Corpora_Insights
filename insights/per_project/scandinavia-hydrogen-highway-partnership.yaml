  project_name: Scandinavia Hydrogen Highway Partnership
  what_happened: The Scandinavia Hydrogen Highway Partnership used a triple helix arrangement between industry, academia and multiple levels of government across Nordic countries to pool resources, leverage
    regional policy mechanisms, and accelerate deployment of hydrogen refuelling infrastructure.
  lesson_learnt: A triple helix partnership structure (industry, academia, government) at a cross-jurisdictional level is effective for hydrogen infrastructure programs — it pools limited resources, shares
    risk, leverages complementary policy mechanisms across jurisdictions, and accelerates deployment beyond what single-jurisdiction programs can achieve.
