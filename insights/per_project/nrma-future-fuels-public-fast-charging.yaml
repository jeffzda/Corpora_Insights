- record_id: ARENA-DLV-50351
  source_title: Chargefox Future Fuels Metro Fast Charging Project Results and Lessons
    Learnt
  publish_date: 2022-11
  project_name: Chargefox Future Fuels Metro Fast Charging
  what_happened: Site Licence Agreement negotiations were protracted and, in some
    cases, failed entirely. Letters of Intent obtained at proposal stage were non-binding
    and several site owners had moved on by the time ARENA approval was received.
    One major property group (Vicinity) rescinded its original agreement due to disagreement
    over rent per parking bay, and competitive pressure had significantly raised market
    rates since the project was first proposed.
  lesson_learnt: Secure stronger, more binding commitments from property groups at
    the EOI phase — non-binding Letters of Intent proved insufficient to keep site
    owners engaged through the ARENA approval process, resulting in lost sites and
    protracted renegotiation. Ensure rent offered per parking bay reflects current
    competitive market rates at the time of contracting.
