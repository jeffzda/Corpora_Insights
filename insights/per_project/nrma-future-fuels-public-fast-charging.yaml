  what_happened: Site assessments for high-specification charging locations revealed
    complex challenges including crown land negotiations, floodplain impacts, and
    unrecorded underground utilities that were not apparent until detailed assessment,
    resulting in significant delays and budget adjustments.
  lesson_learnt: Conduct thorough, specialist-led site assessments during the initial
    planning phase — issues such as crown land status, floodplain constraints, and
    unrecorded underground utilities only surfaced at detailed design stage, causing
    significant delays that earlier investigation would have avoided. Engage local
    governments and specialists before design is finalised.
