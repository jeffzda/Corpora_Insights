- record_id: ARENA-DLV-50352
  source_title: Chargefox Future Fuels Metro Fast Charging Project Results and Lessons
    Learnt
  publish_date: 2022-11
  project_name: Chargefox Future Fuels Metro Fast Charging
  what_happened: Site acquisition was complicated by misalignment between umbrella
    property group executive strategy and local site owner/operator needs. Local owners
    expressed interest in hosting EV chargers but were blocked by corporate levels
    that had no clear EV strategy or undefined responsibility for it, causing protracted
    delays while the correct decision-maker was identified.
  lesson_learnt: Screen prospective sites early for the degree of independence the
    local site owner has from the umbrella property group, and identify who holds
    executive responsibility for EV strategy at the corporate level before investing
    significant negotiation effort — unresolved corporate governance at the property
    group repeatedly blocked site agreements that had local support.
