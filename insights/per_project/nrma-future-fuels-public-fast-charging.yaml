- record_id: ARENA-DLV-50353
  source_title: Chargefox Future Fuels Metro Fast Charging Project Results and Lessons
    Learnt
  publish_date: 2022-11
  project_name: Chargefox Future Fuels Metro Fast Charging
  what_happened: During site inspections and build planning, multi-party switchboard
    access requirements from individual stores, property groups, and site operators
    required segregated meetings with individual stakeholders, leading to protracted
    coordination. This resulted in Chargefox having to use alternative switchboards
    with longer cable runs, which is the single largest variable cost driver for site
    build.
  lesson_learnt: Conduct upfront multi-party alignment on switchboard access and electrical
    requirements — failure to align all parties (site owner, property group, preferred
    electrician, EV charger contractor) simultaneously forces sequential meetings
    and pushes cable runs to sub-optimal switchboards, materially increasing build
    costs.
  issue_severity: moderate
  project_type: transport electrification
