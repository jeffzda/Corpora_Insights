- record_id: ARENA-DLV-50354
  source_title: Chargefox Future Fuels Metro Fast Charging Project Results and Lessons
    Learnt
  publish_date: 2022-11
  project_name: Chargefox Future Fuels Metro Fast Charging
  what_happened: The plug type ratio (CHAdeMO vs. CCS2) agreed in the project agreement
    with ARENA did not adequately reflect the rapid market shift toward CCS2. By 2021,
    CHAdeMO vehicles represented only approximately 5.9% of new EV sales in Australia,
    producing a CCS2:CHAdeMO ratio of roughly 9:1 on the road, making the originally
    agreed ratio of charger plug types potentially misaligned with actual demand.
  lesson_learnt: EV charging infrastructure projects should continuously monitor EV
    sales data and forecast plug standard adoption trends before locking in charger
    specifications — the rapid obsolescence of CHAdeMO demonstrates that plug ratios
    agreed at proposal stage can become misaligned with market reality by the time
    infrastructure is installed.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: commercial expansion
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: commercial & market
  intervention_note: Chargefox recommended purchasing chargers capable of simple plug-type
    switching, allocating budget for plug replacement assessed in 3–5 year windows,
    and improving market forecasting of charging standards before specifying sites.
  transferability: moderate
  delay_magnitude: null
  technology_domain: EV
  source_pages: &id009
  - 7
  - 8
  evidence_excerpt: 'Adoption rates of the CCS2 EV plug charging standard have increased
    while adopters of the CHAdeMO plug charging standard... have become laggards in
    the industry... now puts the ratio of CCS2 to CHAdeMO cars on the road to roughly
    9 : 1... approximate % CHAdeMO 5.9%'
  confidence_note: issue_severity set to moderate rather than minor because the misalignment
    affects the fundamental utility of the installed infrastructure across all 16
