- record_id: ARENA-DLV-14960
  source_title: 'Looking Forward: Barriers, Risks and Rewards of the Australian Geothermal
    Sector to 2020 and 2030'
  publish_date: 2014-06
  project_name: Australian Geothermal Sector – EGS Flow Rate Gap
  what_happened: The maximum flow rate demonstrated from an EGS well in a conductive
    geothermal setting in Australia was approximately 40 kg/s, while commercially
    required flow rates are 80–100 kg/s, representing a factor-of-two gap that directly
    determines LCOE competitiveness and for which no demonstrated pathway to close
    exists in Australian conditions.
  lesson_learnt: Flow rate per well is the single most important technical variable
    for geothermal LCOE — project funding decisions should be gated on credible evidence
    that the target flow rate is achievable in the specific geological setting, rather
    than extrapolating from international analogues or proponent modelling, because
    assumptions about undemonstrated flow rates have been the primary source of commercial
    failure in Australian EGS projects.
