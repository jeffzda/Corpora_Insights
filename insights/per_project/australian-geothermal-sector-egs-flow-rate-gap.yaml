  evidence_excerpt: By far the most important technical variable in terms of LCOE
    is the flow rate... The flow rates used in the base scenarios of 100 kg/s for
    natural reservoirs and 80 kg/s for EGS Reservoirs represent the flow rates that
    the industry has been aiming for over the last 10 to 15 years. These flow rates
    have yet to be demonstrated in Australia... The maximum flow rate achieved in
    a closed loop was 18 kg/s... The maximum production flow rate achieved at this
    project was around 40 kg/s.
