  source_title: Intellihub Demand Flexibility Platform Lessons Learnt Report 2
  publish_date: 2024-01
  project_name: Intellihub Demand Flexibility Platform
  what_happened: CER device registration at scale proved challenging because there
    are currently no common approaches for device registration in CER standards such
    as IEEE 2030.5, and achieving 100% first-attempt registration success rates was
    not possible due to variability in OEM and installer processes.
  lesson_learnt: In the absence of standardised CER registration processes, platform
    operators must build explicit failure-detection, data-amendment, and retry workflows
    into the registration pipeline from the outset — first-attempt success rates below
    100% are the expected baseline, not an exception.
