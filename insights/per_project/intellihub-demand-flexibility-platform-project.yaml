- record_id: ARENA-DLV-66553
  source_title: Intellihub Demand Flexibility Platform Knowledge Sharing Report 1
  publish_date: 2023-07
  project_name: Intellihub Demand Flexibility Platform
  what_happened: The industry's existing approach to hot water load control relies
    on legacy Audio Frequency Load Control (AFLC) technology operated by DNSPs, which
    controls devices at a whole-zone level without reference to wholesale market conditions
    and requires maintenance of ageing substation transmitters — creating a significant
    barrier to market-responsive flexible load management.
  lesson_learnt: Projects targeting hot water as a flexible load asset should plan
    for displacement of entrenched AFLC infrastructure — the transition from zone-level
    DNSP-controlled AFLC to individual smart-meter-based control is a prerequisite
    for market-responsive operation, and engaging DNSPs early on the transition pathway
    is critical to unlocking the asset class.
