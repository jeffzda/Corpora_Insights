  what_happened: Consumer adoption of flexible demand technologies was constrained
    by lack of technical awareness, complexity of tariff and demand response programs,
    and reluctance to cede device control to third parties, with particular barriers
    for renters, low-income households, and rural consumers with limited internet
    connectivity.
