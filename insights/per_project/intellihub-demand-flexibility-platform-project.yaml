- record_id: ARENA-DLV-67401
  source_title: Intellihub Demand Flexibility Platform Lessons Learnt Report 2
  publish_date: 2024-01
  project_name: Intellihub Demand Flexibility Platform
  what_happened: Despite CSIP-AUS being developed as a common standard for CER device
    integration, inconsistent implementation across OEMs meant that uniform equipment
    behaviour was not achieved — some OEMs only partially implemented the standard
    and relied on the deX platform to fill compliance gaps.
  lesson_learnt: Do not assume that a published interoperability standard will produce
    uniform device behaviour at deployment time — plan for OEM-specific compliance
    gaps and build aggregation-layer compensating logic to bridge partial implementations.
