  source_title: Intellihub Demand Flexibility Platform Project - Lessons Learnt Report
    3
  publish_date: 2025-01
  project_name: Intellihub Demand Flexibility Platform Project
  what_happened: Cybersecurity risks in interconnected flexible demand systems were
    identified as a material challenge, with interconnected CER platforms vulnerable
    to threats affecting system integrity and data privacy, requiring alignment with
    frameworks such as the Australian Energy Sector Cyber Security Framework (AESCSF).
  lesson_learnt: CER aggregation platforms must embed cybersecurity architecture —
    including Public Key Infrastructure (PKI) and compliance with the AESCSF — from
    the outset of platform design rather than retrofitting it; cybersecurity requirements
    embedded in the supply chain (as Intellihub did for meters and connected devices)
    provide stronger end-to-end protection than application-layer-only approaches.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: commercial expansion
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: null
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: PKI was set up in the manufacturing supply chain to support end-to-end
    security, covering not just DER but any device or meter connected to the platform.
  transferability: moderate
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id005
  - 17
  - 21
  evidence_excerpt: PKI has been setup to support end-to-end security in this pathway,
    this have been set up in the manufacturing supply chain, not just for DER but
    for any device or meter connected into the platform... interconnected systems
    are vulnerable to cybersecurity risks, raising concerns about system integrity
    and data privacy.
  confidence_note: Failure mode rated as design assumption failure — the lesson is
    that cybersecurity must be designed in from the start rather than assumed; the
    intervention note draws on the meter connectivity section (page 17) which provides
