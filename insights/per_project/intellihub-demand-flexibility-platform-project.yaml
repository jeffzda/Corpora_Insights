  project_name: Intellihub Demand Flexibility Platform
  what_happened: The platform adopted a dual connectivity architecture — OEM cloud
    API integration and direct Intellihub meter backhaul — to accommodate devices
    with and without existing cloud connectivity, with the OEM cloud pathway designated
    as the primary route for the majority of devices due to lower cost and greater
    scalability.
  lesson_learnt: DER platform designs should offer multiple connectivity pathways
    rather than mandating a single approach — devices without existing cloud connectivity
    (or in areas with poor broadband) require a fallback pathway such as meter backhaul,
    and designing this in from the outset avoids costly retrofitting when edge cases
    emerge at scale.
