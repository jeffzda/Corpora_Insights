- record_id: ARENA-DLV-67404
  source_title: Intellihub Demand Flexibility Platform Lessons Learnt Report 2
  publish_date: 2024-01
  project_name: Intellihub Demand Flexibility Platform
  what_happened: Consumer home internet connections introduced variable latency and
    communication failures that left CER device status in an unknown state within
    the deX platform, affecting the reliability of telemetry collection and control
    command delivery across a portion of the fleet.
  lesson_learnt: Design distributed CER control platforms to operate under an eventual
    consistency model from the outset — assume a persistent fraction of the device
    fleet will have unknown state at any moment due to residential internet variability,
    and provision statistical dispatch response models accordingly.
