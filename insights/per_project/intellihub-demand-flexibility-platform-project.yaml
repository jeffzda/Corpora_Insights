  source_title: Intellihub Demand Flexibility Platform Knowledge Sharing Report 1
  publish_date: 2023-07
  project_name: Intellihub Demand Flexibility Platform
  what_happened: Analysis of wholesale energy cost savings from demand flexibility
    across different device types found that the value of flexible operations varies
    significantly by device type, with daily EV charging optimisation delivering substantially
    higher annual savings ($631 NEM average) than hot water ($130), pool pumps ($151),
    or weekly EV charging ($139).
  lesson_learnt: When designing a CER flexibility platform targeting multiple device
    types, prioritise integration of high-value devices first — daily EV charging
    delivers roughly 5x the wholesale cost savings of hot water or pool pumps, so
    sequencing device integration by value-to-customer can accelerate commercial uptake
    and retailer adoption.
