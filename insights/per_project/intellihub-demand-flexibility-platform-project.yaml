- record_id: ARENA-DLV-67411
  source_title: Intellihub Demand Flexibility Platform Lessons Learnt Report 2
  publish_date: 2024-01
  project_name: Intellihub Demand Flexibility Platform
  what_happened: Modelling of solar curtailment strategies across four NEM states
    showed that net curtailment under zero-threshold and dynamic strategies generated
    meaningful annual savings for retailers (up to $370/year for SA, 4–7kW inverters
    under dynamic curtailment), while scheduled gross curtailment produced net losses
    in most states due to foregone export revenue and increased grid import costs.
  lesson_learnt: Retailers designing solar VPP curtailment products should favour
    dynamic or zero-threshold net curtailment strategies over fixed-schedule gross
    curtailment — schedule-based gross curtailment produces net losses in most NEM
    states and inverter size categories, while dynamic curtailment consistently captures
    the highest savings across states.
