- record_id: ARENA-DLV-67413
  source_title: Intellihub Demand Flexibility Platform Lessons Learnt Report 2
  publish_date: 2024-01
  project_name: Intellihub Demand Flexibility Platform
  what_happened: Ambiguity in the CSIP-AUS compliance testing and certification process
    — still being finalised as of March 2024 — resulted in different OEMs implementing
    the standard and passing tests in materially different ways, particularly for
    dynamic telemetry post rates, undermining the goal of interoperability.
  lesson_learnt: Standards bodies and certifying organisations should resolve certification
    process ambiguity before mandating compliance deadlines — when OEMs can pass the
    same certification test with different implementations, the resulting installed
    base will not be interoperable, defeating the standard's purpose.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: first commercial/FOAK
  lifecycle_phase: approvals/contracting
  proponent_type: technology vendor
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated integration
  intervention_note: Intellihub and GreenSync committed to working with the industry,
    OEMs, the standards committee, and certifying organisations to improve the CSIP-AUS
    compliance process.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: DER
  source_pages: &id027
  - 14
  evidence_excerpt: 'As we work with OEMs to gain full CSIP-AUS compliance in March
    2024, we are seeing some ambiguity with regards to the process of testing and
    certification. As a result, different OEMs will implement the standard and pass
    tests in a different manner. For example: Dynamic telemetry post rates are in
    some cases implemented for a given period (then reverting to the default of 5
    minutes), or in other cases it will automatically revert to default after some
    time period.'
  confidence_note: lifecycle_phase assigned as approvals/contracting because the issue
    concerns standards certification processes rather than operational deployment;
    delay_category approvals/regulatory reflects the regulatory/standards process
    being incomplete.
