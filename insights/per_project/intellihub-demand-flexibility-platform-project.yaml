  source_title: Intellihub Demand Flexibility Platform Knowledge Sharing Report 1
  publish_date: 2023-07
  project_name: Intellihub Demand Flexibility Platform
  what_happened: The vast majority of CER in Australia remained 'inflexible' at the
    time of the project — unable to be aggregated into VPPs at scale — due to the
    cost and complexity of integrating multiple device types and manufacturers, despite
    gigawatts of installed capacity that could theoretically provide demand flexibility
    services.
  lesson_learnt: The primary barrier to CER flexibility at scale is not device availability
    but integration cost and complexity — projects and policy interventions targeting
    CER flexibility should focus on reducing the cost of multi-OEM, multi-device-type
    integration rather than increasing device deployment, as the installed base already
    substantially exceeds what can be practically aggregated.
