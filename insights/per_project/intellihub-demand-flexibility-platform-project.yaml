- record_id: ARENA-DLV-66554
  source_title: Intellihub Demand Flexibility Platform Knowledge Sharing Report 1
  publish_date: 2023-07
  project_name: Intellihub Demand Flexibility Platform
  what_happened: The industry faced a structural 'many-to-many' integration problem
    — VPP operators needing to connect to multiple device types and OEMs required
    a separate point-to-point integration for each combination, making scalable CER
    aggregation prohibitively costly and complex prior to the deX platform being available
    as a central integration layer.
  lesson_learnt: CER aggregation platforms that attempt to scale through direct OEM-by-OEM
    integrations will face prohibitive cost and complexity barriers — a central API
    aggregation layer that abstracts OEM and device-type heterogeneity is a prerequisite
    for commercial-scale VPP deployment, and this infrastructure should be treated
    as shared industry infrastructure rather than built independently by each aggregator.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: commercial expansion
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: null
  failure_mode: unvalidated integration
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Adopted the deX platform as a central integration layer that
    presents heterogeneous CER across device types and OEMs as homogeneous, enabling
    VPP operators to access all devices through a single API integration.
  transferability: broad
  delay_magnitude: null
  technology_domain: DER
  source_pages:
  - 7
  - 8
  - 19
  evidence_excerpt: With deX acting as a central integration point for OEMS, VPP aggregators,
    ADMS and DERMS it solves the 'many to many' problem for CER by reducing the number
    of point-to-point integrations... De-risks project delivery and reduces ongoing
    API maintenance by reducing the number of point-to-point integrations between
    OEMs, VPP platforms and DERMS systems.
  confidence_note: issue_severity major reflects that this structural barrier was
    preventing any commercial-scale CER aggregation across the industry, not just
    a project-level friction. Canonical record merged from 2 source records across
    2 document(s).
