- record_id: ARENA-DLV-67414
  source_title: Intellihub Demand Flexibility Platform Lessons Learnt Report 2
  publish_date: 2024-01
  project_name: Intellihub Demand Flexibility Platform
  what_happened: Hot water system registration proved materially simpler than solar
    PV CER registration because fewer parties are involved, revenue metering processes
    are more mature, and load control tariffs associated with the NMI provide an existing
    system of record for these devices.
  lesson_learnt: When sequencing CER device type onboarding for a VPP aggregation
    platform, prioritise device types with existing NMI-linked tariff structures and
    mature metering processes (such as controlled-load hot water systems) before tackling
    device types with immature registration ecosystems — this allows platform capability
    to be demonstrated at scale while higher-complexity device types are resolved.
