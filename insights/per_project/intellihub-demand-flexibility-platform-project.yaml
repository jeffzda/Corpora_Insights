  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated integration
  intervention_note: Intellihub replaced AFLC receivers as part of its smart meter
    rollout, providing load control functionality through the smart meter as a business-as-usual
    activity and integrating meter head-end systems with the deX platform.
  transferability: moderate
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id010
