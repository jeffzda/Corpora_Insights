  source_title: Intellihub Demand Flexibility Platform Lessons Learnt Report 2
  publish_date: 2024-01
  project_name: Intellihub Demand Flexibility Platform
  what_happened: Data correctness errors were the most common cause of CER registration
    failure, with the most frequent errors being an invalid or incorrect NMI for the
    site location, an NMI not present in the vendor cloud platform, or a device serial
    number not present in the vendor cloud platform.
  lesson_learnt: CER registration pipelines should implement upfront data validation
    of NMI and serial number against the relevant vendor cloud platform before submitting
    a registration request — catching these errors at intake avoids downstream retry
    cycles and reduces remediation complexity.
