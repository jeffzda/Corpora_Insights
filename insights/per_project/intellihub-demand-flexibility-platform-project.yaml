  what_happened: Inconsistency across vendor cloud platforms in how registration is
    handled — including differences in whether vendors validate NMI and site information
    or confirm device cloud connectivity at point of registration — created different
    failure modes for each vendor integration, making resolution processes more complex.
  lesson_learnt: When integrating with multiple OEM cloud platforms, document the
    specific registration behaviour of each vendor (including what validation they
    do or do not perform at point of registration) and build vendor-specific resolution
    pathways — a single generic remediation process will not cover the variation encountered
    in practice.
