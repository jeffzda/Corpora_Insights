- record_id: ARENA-DLV-21610
  source_title: 'Ekistica - ARENA Grid-Forming Battery Portfolio Series: Update Report'
  publish_date: 2025-10
  project_name: Mortlake BESS
  what_happened: Origin Energy and AEMO had a dispute over the reactive current rise
    time calculation methodology — Origin calculated based on positive sequence current
    only, while AEMO assessed using total reactive current including both positive
    and negative sequence components — which needed to be resolved before the connection
    could progress.
  lesson_learnt: Confirm with AEMO upfront which reactive current measurement convention
    (positive sequence vs. total reactive current) will be applied to GPS compliance
    assessment to avoid mid-process disputes; the May 2025 NER rule change now clarifies
    that reactive current rise and commencement times refer to positive sequence current
    only.
  issue_severity: moderate
  project_type: storage
  project_scale_band: utility/large-scale
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: grid connection/system studies
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: null
  intervention_note: The AEMC's May 2025 rule change (Improving the NEM Access Standards
    Package 1) clarified that reactive current rise and commencement times are measured
    using positive sequence current only.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id003
  - 20
  - 31
  evidence_excerpt: Origin reported discrepancies between reactive current rise time
    calculation methodologies where they calculated based on the positive sequence
    component whereas AEMO assessed this using the total reactive current (which includes
    both positive and negative components).
  confidence_note: 'proponent_type reconciled to ''project developer'' from: project
    developer (22/29), utility/energy retailer (7/29)'
