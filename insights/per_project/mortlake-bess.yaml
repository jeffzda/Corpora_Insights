- record_id: ARENA-DLV-21609
  source_title: 'Ekistica - ARENA Grid-Forming Battery Portfolio Series: Update Report'
  publish_date: 2025-10
  project_name: Mortlake BESS
  what_happened: During firmware updates at Mortlake BESS, the OEM provided insufficiently
    detailed information about new functionalities introduced, resulting in AEMO limiting
    the settings that could be used, constraining the project's GFM capability.
  lesson_learnt: Require OEMs to provide comprehensive changelogs and technical documentation
    for all firmware updates before deployment; inadequate documentation of new functionalities
    can result in regulators limiting permissible settings and constraining operational
