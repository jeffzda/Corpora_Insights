- record_id: ARENA-DLV-21608
  source_title: 'Ekistica - ARENA Grid-Forming Battery Portfolio Series: Update Report'
  publish_date: 2025-10
  project_name: Mortlake BESS
  what_happened: At Mortlake BESS, the original technical memorandum provided by the
    selected OEM was insufficiently detailed, causing the modelling engineer to make
    incorrect assumptions, resulting in rework and delays during the GPS connection
    process.
  lesson_learnt: Require OEMs to provide a sufficiently detailed technical manual
    before commencing GPS modelling; inadequate OEM documentation forces trial-and-error
    tuning approaches that significantly increase both time and cost — contractually
    mandate documentation standards at OEM engagement.
  issue_severity: major
  project_type: storage
  project_scale_band: utility/large-scale
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: grid connection/system studies
  failure_mode: poor scoping
  outcome_class: delayed but recoverable
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: null
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id001
  - 24
  evidence_excerpt: Grid connection modelling is highly specialized and labour-intensive.
    Each setting update requires at least two weeks for full verification as hundreds
    of tests must be reviewed against performance standards. Without a clear technical
    manual being provided by the OEM, the modelling engineer is forced to use trial
    and error to determine the most suitable settings, which significantly increases
    both time and cost associated with conducting the modelling.
