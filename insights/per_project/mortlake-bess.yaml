- record_id: ARENA-DLV-21623
  source_title: 'Ekistica - ARENA Grid-Forming Battery Portfolio Series: Update Report'
  publish_date: 2025-10
  project_name: Mortlake BESS
  what_happened: During Mortlake BESS GPS modelling, an excessive active power drop
    during unbalanced faults was identified; AEMO expressed concern that this could
    threaten power system frequency stability, requiring efforts to mitigate it and
    revealing a trade-off between improved reactive power output and reduced active
    power output during fault conditions.
  lesson_learnt: Model active power behaviour during unbalanced fault conditions explicitly
    as part of GFM BESS GPS compliance assessment; anticipate AEMO scrutiny of active
    power drops during unbalanced faults and quantify the trade-off between reactive
    power output and active power retention early in the tuning process.
  issue_severity: moderate
  project_type: storage
  project_scale_band: utility/large-scale
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: grid connection/system studies
  failure_mode: unvalidated technical assumptions
  outcome_class: delayed but recoverable
  secondary_failure_mode: regulatory & approvals
  intervention_note: Origin made tuning adjustments to mitigate the active power drop
    during unbalanced faults; the May 2025 NER rule change specifying control objectives
    for unbalanced faults should clarify control priorities for future projects.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id005
  - 31
  evidence_excerpt: Origin (Mortlake BESS) brought up an issue of significant drop
    in active power output during unbalanced faults. With AEMO believing excessive
    active power drops could threaten power system frequency stability, efforts were
    made to mitigate this. They noted a trade-off between improved reactive power
    output and reduced active power output during faults.
  confidence_note: 'proponent_type reconciled to ''project developer'' from: project
    developer (22/29), utility/energy retailer (7/29)'
