- record_id: ARENA-DLV-21611
  source_title: 'Ekistica - ARENA Grid-Forming Battery Portfolio Series: Update Report'
  publish_date: 2025-10
  project_name: Mortlake BESS
  what_happened: Origin Energy was required to install harmonic filters at Mortlake
    BESS due to harmonic issues with the existing high-voltage grid that were not
    identified until full GPS modelling was underway, adding unanticipated scope and
    cost.
  lesson_learnt: Proponents should request that AEMO and NSPs proactively share existing
    network harmonic data at the connection point before commencing GPS modelling;
    harmonic issues discovered only during full modelling add late-stage scope, cost,
    and delay that could be avoided with earlier network-level visibility.
