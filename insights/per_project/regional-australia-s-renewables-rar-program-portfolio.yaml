  publish_date: 2017-03
  project_name: Regional Australia's Renewables (RAR) Program Portfolio
  what_happened: Total project costs across the RAR portfolio varied significantly
    not only by technology mix but also by the degree of required upgrades to existing
    electrical infrastructure to accommodate renewables — a cost driver that was not
    always visible in headline $/W comparisons.
