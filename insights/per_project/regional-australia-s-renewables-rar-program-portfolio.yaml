- record_id: ARENA-DLV-4755
  source_title: Insights From The Portfolio of Projects Funded Under The Regional
    Australia's Renewables Program
  publish_date: 2017-03
  project_name: Regional Australia's Renewables (RAR) Program Portfolio
  what_happened: Several RAR projects encountered existing commercial arrangements
    at the site that needed renegotiation before renewable integration could proceed,
    and in some cases investment cost structures were not properly shared, creating
    split incentives between project parties.
  lesson_learnt: Before committing to technical design for remote or off-grid renewable
    integration, proponents should audit all existing commercial contracts and cost-sharing
    arrangements — pre-existing agreements can create split incentives that block
    or delay project progress and must be restructured early.
