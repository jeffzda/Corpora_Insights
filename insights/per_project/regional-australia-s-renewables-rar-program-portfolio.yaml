- record_id: ARENA-DLV-4768
  source_title: Insights From The Portfolio of Projects Funded Under The Regional
    Australia's Renewables Program
  publish_date: 2017-03
  project_name: Regional Australia's Renewables (RAR) Program Portfolio
  what_happened: The RAR Program received 72 applications but approved only 18 (25%),
    and of those 18, four were subsequently discontinued — yielding 14 active projects,
    meaning only 19% of applications resulted in a live project. The high attrition
    rate suggests significant barriers at both the funding-approval and project-delivery
    stages.
  lesson_learnt: Remote and off-grid renewable programs should expect high pre-approval
    and post-approval attrition — programme administrators should invest in pre-application
    support and early-stage feasibility funding to improve the quality and viability
    of applications, and in delivery support to reduce post-approval discontinuations.
