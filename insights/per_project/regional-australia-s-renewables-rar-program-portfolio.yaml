- record_id: ARENA-DLV-4762
  source_title: Insights From The Portfolio of Projects Funded Under The Regional
    Australia's Renewables Program
  publish_date: 2017-03
  project_name: Regional Australia's Renewables (RAR) Program Portfolio
  what_happened: The expectation for reliability, security, and risk tolerance in
    off-grid power supply is fundamentally different from on-grid contexts, and these
    different expectations were not fully accounted for in initial project scoping
    across multiple RAR projects.
  lesson_learnt: Off-grid renewable project proponents must explicitly define and
    negotiate the reliability and security standards expected by the off-grid community
    or operator at the outset — these are substantially higher and more complex than
    on-grid equivalents and have significant design, cost, and contract implications.
