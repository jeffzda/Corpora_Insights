- record_id: ARENA-DLV-4756
  source_title: Insights From The Portfolio of Projects Funded Under The Regional
    Australia's Renewables Program
  publish_date: 2017-03
  project_name: Regional Australia's Renewables (RAR) Program Portfolio
  what_happened: Projects initially scoped as straightforward additions of modular
    renewable technologies to existing off-grid infrastructure consistently required
    deeper investigation of energy use and supply, and a reassessment of how risks
    change when new elements are added — indicating systematic underestimation of
    integration complexity at the concept stage.
  lesson_learnt: Do not treat the addition of renewables to existing off-grid infrastructure
    as a modular bolt-on — integration changes the risk profile of the whole system
    and requires comprehensive analysis of energy flows, control interfaces, and risk
    redistribution before design is finalised.
