- record_id: ARENA-DLV-4754
  source_title: Insights From The Portfolio of Projects Funded Under The Regional
    Australia's Renewables Program
  publish_date: 2017-03
  project_name: Regional Australia's Renewables (RAR) Program Portfolio
  what_happened: The bespoke, one-of-a-kind nature of off-grid renewable projects
    resulted in higher actual and perceived risks, which combined with limited supply
    chain depth and low market participant knowledge drove costs substantially above
    grid-connected equivalents — a phenomenon the document terms the 'remoteness premium'.
  lesson_learnt: Proponents and funders of off-grid renewable projects should explicitly
    budget for a 'remoteness premium' covering bespoke engineering costs, supply chain
    constraints, limited competitive tension among suppliers, and risk pricing — these
    factors are systemic and not resolvable by project-level optimisation alone.
