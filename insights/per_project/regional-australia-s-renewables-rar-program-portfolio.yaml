- record_id: ARENA-DLV-4753
  source_title: Insights From The Portfolio of Projects Funded Under The Regional
    Australia's Renewables Program
  publish_date: 2017-03
  project_name: Regional Australia's Renewables (RAR) Program Portfolio
  what_happened: Projects targeting higher renewable energy fractions required more
    enabling technologies working in concert — up to six different technologies —
    resulting in materially higher cost per watt of renewable generating capacity
    compared to simpler single-technology deployments.
  lesson_learnt: When scoping high-renewable-fraction remote or off-grid projects,
    proponents should budget for multiple enabling technologies (storage, flywheels,
    dynamic resistors, control systems) and expect significantly higher $/W costs
    than single-technology equivalents — the cost premium is real and should be quantified
    during feasibility.
