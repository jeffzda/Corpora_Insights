  source_title: Summary of ARENA Funded Hydrogen R&D Projects
  publish_date: 2023-04
  project_name: Macquarie University – Biological Hydrogen Production
  what_happened: The biological hydrogen production project at Macquarie University successfully demonstrated a 1000-fold improvement in hydrogen production rate at 20 L bioreactor scale and subsequently
    spun out into a start-up company (Hydgene Renewables) to pursue commercialisation.
  lesson_learnt: Structuring an exit pathway for R&D projects — including provisions for spin-out company formation — is a highly effective mechanism for advancing hydrogen technologies from laboratory
    to commercialisation; the Hydgene spin-out was enabled by clear IP ownership and a compelling demonstrated result.
