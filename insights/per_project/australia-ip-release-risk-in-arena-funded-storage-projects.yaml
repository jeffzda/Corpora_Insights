- record_id: ARENA-DLV-16275
  source_title: Energy Storage Study
  publish_date: 2015-07
  project_name: Australia — IP Release Risk in ARENA-Funded Storage Projects
  what_happened: Stakeholder consultation (C19) identified that projects receiving
    ARENA support risked being required to release intellectual property as part of
    knowledge-sharing obligations, which deterred some proponents from seeking ARENA
    funding or from sharing commercially sensitive design and operational learnings.
  lesson_learnt: Knowledge-sharing obligations in ARENA funding agreements must be
    carefully scoped to balance genuine knowledge dissemination with IP protection
    — one mechanism is to incorporate a research institute as co-recipient of grant
    funding, allowing knowledge to be developed and disseminated without requiring
    proponents to expose commercially sensitive IP.
