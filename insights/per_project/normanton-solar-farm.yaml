  project_name: Normanton Solar Farm
  what_happened: The Normanton proponent incurred a large expense on consultants to
    prepare the ARENA funding application, and the project was assessed as unviable
    without ARENA grant support given the high costs of supply in the extremely remote
    location (700 km transmission line with 35–50% losses).
  lesson_learnt: Small proponents in very remote FOG areas should budget explicitly
    for application preparation costs and recognise that ARENA or equivalent grant
    support may be a prerequisite for viability — early engagement with ARENA on eligibility
    and application requirements can reduce consultant expenditure.
