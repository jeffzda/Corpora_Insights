- record_id: ARENA-DLV-1253
  source_title: Normanton Solar Farm Grid Connection Report
  publish_date: '2021-03-31'
  project_name: Normanton Solar Farm
  what_happened: Large-scale solar farms connecting to the North Queensland transmission
    network in 2017–2018 (Ross River 140 MW, Clare 150 MW, Haughton Stage 1 100 MW,
    Kidston Stage 1 50 MW) caused the MLF at Ross Substation to fall from above 1.0
    to 0.9650, eroding the commercial viability of existing smaller generators already
    connected to the same network without any action by those smaller generators.
  lesson_learnt: Fringe-of-grid or remote solar project financials are highly exposed
    to MLF changes caused by unrelated large-scale generation connecting nearby —
    developers should monitor regional generation pipeline and incorporate MLF sensitivity
    analysis as a standing part of ongoing commercial review.
