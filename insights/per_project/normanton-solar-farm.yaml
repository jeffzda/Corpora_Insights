- record_id: ARENA-DLV-14666
  source_title: 'Lessons From the Fringes: Australian Fringe-Of-Grid Projects in ARENA''s
    Portfolio'
  publish_date: 2018-06
  project_name: Normanton Solar Farm
  what_happened: At the Normanton remote site, standard shipping container return
    logistics required containers to be returned within five days — a timeline unworkable
    for the remote location — so the project team sold the containers in town instead.
  lesson_learnt: Remote FOG project logistics plans should account for non-standard
    container and equipment disposal or storage terms — standard return windows of
    five days are unworkable at remote sites and alternative arrangements (e.g., on-site
    sale or storage) must be negotiated or budgeted in advance.
