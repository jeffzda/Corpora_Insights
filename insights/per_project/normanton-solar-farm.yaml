- record_id: ARENA-DLV-1252
  source_title: Normanton Solar Farm Grid Connection Report
  publish_date: '2021-03-31'
  project_name: Normanton Solar Farm
  what_happened: The Normanton Solar Farm, being less than 10 MW capacity (4.5 MWac),
    was ineligible for an Individually Calculated Customer (ICC) Distribution Loss
    Factor and was instead assigned the averaged tariff-class DLF. An investigation
    into obtaining an ICC DLF was pursued by the NSF proponents in 2013 but no definitive
    resolution was provided by Ergon Energy, leaving the project on the less favourable
    average DLF.
  lesson_learnt: For sub-10 MW generators connecting in remote sections of the distribution
    network, engage the DNSP early in project development to understand whether an
    ICC DLF pathway is accessible and commercially justified — the average tariff-class
    DLF may materially understate or overstate the true commercial benefit of the
    connection.
  issue_severity: moderate
