- record_id: ARENA-DLV-1251
  source_title: Normanton Solar Farm Grid Connection Report
  publish_date: '2021-03-31'
  project_name: Normanton Solar Farm
  what_happened: The total loss factor applicable to the Normanton Solar Farm fell
    from 1.247 in 2012/13 to 1.040 in 2020/21 — a reduction driven primarily by the
    connection of large-scale solar farms to the North Queensland transmission network
    in 2017–2018, which markedly reduced the MLF at Ross Substation from 1.1006 to
    0.9650. This caused project revenue to fall by approximately 16.5% over the nine-year
    period since commissioning.
  lesson_learnt: Fringe-of-grid generators in regions experiencing rapid renewable
    energy build-out face material revenue risk from MLF deterioration driven by other
    generators' connections — project financial models must stress-test loss factor
    trajectories, not just baseline conditions at time of connection.
