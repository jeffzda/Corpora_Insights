- record_id: ARENA-DLV-1255
  source_title: Normanton Solar Farm Grid Connection Report
  publish_date: '2021-03-31'
  project_name: Normanton Solar Farm
  what_happened: With the Ross Substation MLF now below 1.0, the report concludes
    that the North Queensland transmission network is no longer commercially attractive
    for new large-scale generation connections until regional load growth recovers,
    leaving only a narrow positive revenue margin (~4%) for fringe-of-grid generators
    that benefit from a DLF above 1.0.
  lesson_learnt: Developers assessing new generation connections in regions with MLF
    below 1.0 should treat the region as commercially marginal until load growth recovers
    — only generators that can benefit from a favourable DLF (i.e. fringe-of-grid,
    >10 MW to access ICC DLF) are likely to achieve positive revenue margins.
