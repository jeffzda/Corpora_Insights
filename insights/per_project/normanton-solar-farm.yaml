  source_title: Normanton Solar Farm Grid Connection Report
  publish_date: '2021-03-31'
  project_name: Normanton Solar Farm
  what_happened: The Normanton Solar Farm (4.5 MWac) successfully demonstrated that
    a correctly sized fringe-of-grid solar generator can materially reduce network
    losses on the sub-transmission network by supplying local distribution load during
    the midday peak, as evidenced by a large decrease in 66 kV sub-transmission demand
    during solar generation hours.
  lesson_learnt: Sizing a fringe-of-grid solar farm to match local distribution network
    demand is an effective strategy for reducing sub-transmission losses — project
    developers and network planners should use this as a design principle for remote
    community generation projects.
