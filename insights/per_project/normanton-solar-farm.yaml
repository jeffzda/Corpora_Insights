  publish_date: 2018-06
  project_name: Normanton Solar Farm
  what_happened: The Normanton Solar Farm proponent — a small individual developer
    — was unable to secure project finance independently and was required to enter
    into a partnership with a larger industry player (Canadian Solar) to make the
    project financially viable.
  lesson_learnt: Small individual proponents in remote FOG areas face significant
    financing barriers and should plan for partnership with a larger industry player
    from the outset — attempting to finance independently is likely to delay or prevent
    project delivery.
