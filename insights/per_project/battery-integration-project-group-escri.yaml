- record_id: ARENA-DLV-25909
  source_title: Review of ARENA's Reliability Portfolio
  publish_date: 2020-01
  project_name: Battery Integration Project Group (ESCRI)
  what_happened: The AER explicitly stated that the regulatory treatment of ESCRI
    (South Australia's Energy Storage for Commercial Renewable Integration project)
    would not set precedent for cost allocation, registration, or TUOS charges for
    future battery storage projects, meaning that lessons from the project's regulatory
    engagement did not automatically flow to subsequent projects.
  lesson_learnt: When a regulator declines to set precedent from a demonstration project,
    the sector loses the compounding value of that project's regulatory learning;
    ARENA should consider funding targeted regulatory engagement processes alongside
    battery storage demonstrations to ensure learnings are codified into rules.
