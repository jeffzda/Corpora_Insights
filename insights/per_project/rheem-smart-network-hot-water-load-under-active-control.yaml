- record_id: ARENA-DLV-51471
  source_title: UTS - Flexible Demand State of Play in Australia - Report
  publish_date: 2024-05
  project_name: Rheem – Smart Network (Hot Water Load Under Active Control)
  what_happened: In the Rheem Smart Network trial, equipment resellers and installers
    were able to sell hot water hardware but could not manage the retail energy contract,
    tariff changes, and meter exchange at the point of sale, while energy retailers
    struggled to deliver the required volume of hardware sales — creating a gap in
    the sales channel that limited participant recruitment.
  lesson_learnt: Hot water flexible demand deployments require a sales channel that
    can handle both the hardware transaction and the retail energy contracting process;
    these functions must be explicitly allocated to capable partners and supported
    with training, as the mismatch between installer competencies and retailer sales
    capabilities was a primary barrier to recruitment at scale.
