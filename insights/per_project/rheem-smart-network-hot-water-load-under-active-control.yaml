- record_id: ARENA-DLV-51472
  source_title: UTS - Flexible Demand State of Play in Australia - Report
  publish_date: 2024-05
  project_name: Rheem – Smart Network (Hot Water Load Under Active Control)
  what_happened: Energy efficiency certificate schemes that included heat pump hot
    water systems but excluded smart electric hot water systems reduced market demand
    for the latter, creating difficulties for the Rheem trial in recruiting participants
    for the smart electric hot water component.
  lesson_learnt: When designing energy efficiency incentive schemes, avoid creating
    technology hierarchies that inadvertently suppress demand for flexible devices
    — the exclusion of smart electric hot water systems while subsidising heat pumps
    reduced the commercial case for the more flexible technology and should inform
    future scheme design to balance efficiency and flexibility objectives.
