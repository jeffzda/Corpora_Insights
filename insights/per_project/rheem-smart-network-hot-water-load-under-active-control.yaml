- record_id: ARENA-DLV-51473
  source_title: UTS - Flexible Demand State of Play in Australia - Report
  publish_date: 2024-05
  project_name: Rheem – Smart Network (Hot Water Load Under Active Control)
  what_happened: The lack of interoperability technical standards between devices
    in the Rheem trial meant that unorchestrated devices competed with the hot water
    system for surplus solar, negating the network service and causing detrimental
    financial impacts on consumers and the network.
  lesson_learnt: Whole-of-home orchestration is required for hot water flexible demand
    to reliably deliver network services — deploying a hot water VPP without controlling
    co-located solar, batteries and other flexible loads means those devices will
    compete for the same surplus solar and undermine contracted network services;
    interoperability standards must be in place before commercial deployment.
