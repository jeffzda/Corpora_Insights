  what_happened: Boral Timber spent over a decade reviewing alternative biomass conversion
    technologies before identifying the MECC process, and used a structured Merit
    Assessment Criteria framework to evaluate the MECC process against seven financial
    and non-financial parameters tailored to the hardwood sawmill context.
  lesson_learnt: Developing a bespoke, multi-criteria assessment framework before
    committing to a specific conversion technology — covering products, value creation,
    scalability, financial return, rural suitability, social responsibility and technology
    maturity — provides a defensible, systematic basis for technology selection in
    biomass project development and helps avoid premature lock-in to a single technology
    pathway.
