- record_id: ARENA-DLV-52606
  source_title: Hardwood Residue Bio-Refinery Feasibility Study
  publish_date: 2019-07
  project_name: Hardwood Residue Bio-Refinery Feasibility Study
  what_happened: The definition of 'Renewable Diesel' was still in draft determination
    status at the time of the feasibility study's completion (expected to be gazetted
    October 2019), meaning the excise treatment for renewable diesel — and whether
    it would receive equivalent treatment to biodiesel — was unresolved and represented
    a material commercial risk to the project's financial model.
  lesson_learnt: When building a business case for a novel renewable fuel, do not
    assume favourable excise or tax treatment will be in place at project commissioning
    — track the regulatory determination process actively and model scenarios where
    full excise equivalence is not granted, as an adverse determination could materially
    alter project financial viability.
