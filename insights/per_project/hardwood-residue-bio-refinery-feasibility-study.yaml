- record_id: ARENA-DLV-52612
  source_title: Hardwood Residue Bio-Refinery Feasibility Study
  publish_date: 2019-07
  project_name: Hardwood Residue Bio-Refinery Feasibility Study
  what_happened: The feedstock preparation specification for the MECC plant required
    bone-dry (0% moisture content) biomass with particle size under 3mm, whereas all
    three sawmill residue streams (woodchip, sawdust, shavings) had moisture contents
    of 10–40% and woodchip particle sizes of approximately 20mm, requiring a pelletisation
    pre-processing step as a material handling and preparation solution.
  lesson_learnt: When evaluating a novel biomass conversion process, verify the feedstock
    specification (moisture content and particle size) against actual residue stream
    characteristics early in feasibility — a large gap between as-received feedstock
    and process input specifications indicates a pre-processing step is required,
    which adds capital cost, operational complexity and a separate technology risk
    that must be scoped and costed independently.
  issue_severity: minor
  project_type: industrial decarbonisation
  project_scale_band: pilot
  lifecycle_phase: concept/feasibility
  proponent_type: industrial operator
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Pelletisation was identified as the most cost-effective method
    to pre-process and transport biomass to meet MECC feedstock specifications, and
    a dedicated pellet plant (Site 1) was incorporated into the two-site project design.
  transferability: moderate
  delay_magnitude: null
  technology_domain: bioenergy
  source_pages: &id011
  - 12
  - 13
  evidence_excerpt: The feedstock specification for the MECC plant requires biomass
    to be pre-processed to bone dry (0%) moisture content and particle size <3mm.
    The Herons Creek sawmill produces three separate sawmill residue feedstocks with
    different sizes and moisture contents... It is intended that the biomass will
    be converted to pellets as the most cost effective way to store and transport
    biomass to the MECC site.
