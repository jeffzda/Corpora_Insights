  publish_date: 2019-07
  project_name: Hardwood Residue Bio-Refinery Feasibility Study
  what_happened: The MECC process produces raw renewable diesel with a sulphur content
    of 1,938 ppm, well above the standard for transport-grade diesel, requiring a
    post-treatment desulphurisation step before the product can enter the Australian
    fuel market.
  lesson_learnt: For novel biomass-to-fuel processes, identify mandatory post-treatment
    requirements (such as desulphurisation) early in feasibility — if a fit-for-scale
    desulphurisation solution is not commercially available at construction time,
    a fallback offtake strategy to existing petrochemical processors should be planned
    as a contingency.
