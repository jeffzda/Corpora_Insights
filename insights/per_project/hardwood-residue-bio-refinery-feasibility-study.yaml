- record_id: ARENA-DLV-52601
  source_title: Hardwood Residue Bio-Refinery Feasibility Study
  publish_date: 2019-07
  project_name: Hardwood Residue Bio-Refinery Feasibility Study
  what_happened: The pilot plant energy balance conducted during the feasibility study
    was of limited use because the pilot plant lacked industry-benchmark heat recovery
    systems, used a diesel engine rather than an electric motor to drive the reactor
    turbine, and employed a thermally inefficient heating system for moisture removal.
  lesson_learnt: When designing pilot plant trials for feasibility studies, ensure
    the pilot plant configuration is sufficiently representative of the intended full-scale
    design — energy balance data from a non-representative pilot will not be usable
    for bankable engineering estimates and will need to be deferred to detailed design.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: pilot
  lifecycle_phase: concept/feasibility
  proponent_type: industrial operator
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: The energy balance was deferred to the final engineering design
    stage should the project proceed beyond feasibility.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: bioenergy
  source_pages: &id001
  - 7
  evidence_excerpt: 'The results were of limited use for the following reasons: a)
    the pilot plant was not constructed with industry benchmark heat recovery systems,
    b) the reactor turbine in the pilot plant is driven by a diesel engine rather
    than an electric motor, c) the pilot plant''s mixing system uses a thermally inefficient
    heating system to remove the humidity water from the biomass. Further development
    of the Energy Balance will be calculated during the final engineering design should
    the project proceed beyond this stage of Feasibility.'
