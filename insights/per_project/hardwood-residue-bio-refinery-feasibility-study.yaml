  what_happened: The MECC plant would be among the first of its kind in NSW (potentially
    the first worldwide), and the planning review found there was limited regulatory
    precedent for how government agencies would characterise and assess the facility,
    creating uncertainty about the planning pathway and assessment requirements ahead
    of the next project stage.
  lesson_learnt: For novel industrial processes with no regulatory precedent, engage
    directly with the relevant planning and environment agencies at the site selection
    stage — do not assume a planning characterisation or pathway; confirm it with
    agencies before committing to a site, as the characterisation determines permissibility,
    assessment level and approval timeline.
