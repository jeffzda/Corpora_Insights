  what_happened: The Renewable Bituminous Product (RBP) from the MECC process was
    only tested at laboratory scale during the feasibility study; a full-scale product
    development plan including plant trials, road trials, stability trials and technical
    specification development had not been undertaken, leaving the product's suitability
    for the asphalt industry unconfirmed.
  lesson_learnt: For a novel biorefinery co-product such as renewable bitumen, laboratory-scale
    compatibility testing is insufficient to secure an offtake agreement — a staged
    product development programme including road and stability trials must be scoped
    and funded before the product offtake strategy can be confirmed, and this should
    be planned as a parallel workstream to engineering design.
