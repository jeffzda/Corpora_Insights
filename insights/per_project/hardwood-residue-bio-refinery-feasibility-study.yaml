- record_id: ARENA-DLV-52607
  source_title: Hardwood Residue Bio-Refinery Feasibility Study
  publish_date: 2019-07
  project_name: Hardwood Residue Bio-Refinery Feasibility Study
  what_happened: The two-site project configuration (pellet plant at Site 1, MECC
    biorefinery at Site 2) was identified as the most economic model during preliminary
    engineering design, but final site selection and regulatory approvals were estimated
    to take 18 to 24 months, followed by a further 18 months for EPC and 6 months
    for commissioning and ramp-up — placing commercialisation approximately 3.5 to
    4 years away from feasibility completion.
  lesson_learnt: For biorefinery projects requiring both rural feedstock preparation
    and industrially zoned liquid processing, a two-site configuration can optimise
    economics, but site selection should be progressed in parallel with feasibility
    engineering design rather than deferred — unconfirmed site locations at feasibility
    close-out leave planning characterisation, environmental licensing, land availability
    and infrastructure costs as unresolved risks that will drive the longest-lead
    activities in the next project phase.
  issue_severity: minor
  project_type: industrial decarbonisation
  project_scale_band: pilot
  lifecycle_phase: concept/feasibility
  proponent_type: industrial operator
  delay_category: approvals/regulatory
  failure_mode: no major failure stated
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The next project stage was defined as site selection, final design
    and regulatory approvals, estimated at 18–24 months.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: bioenergy
  source_pages:
