- record_id: ARENA-DLV-52611
  source_title: Hardwood Residue Bio-Refinery Feasibility Study
  publish_date: 2019-07
  project_name: Hardwood Residue Bio-Refinery Feasibility Study
  what_happened: The geographic dispersal of the hardwood forest estate, combined
    with the relatively small biomass volumes from any single sawmill, was identified
    as a scalability constraint that ruled out many established larger-scale biomass
    conversion technologies and drove the selection of a technology operable at approximately
    50,000 tpa.
  lesson_learnt: For hardwood sawmill or similarly dispersed biomass feedstock projects,
    assess available feedstock volumes at realistic catchment distances before shortlisting
    conversion technologies — technologies designed for large centralised feedstock
    aggregations (e.g. softwood, sugar cane) are likely to be uneconomic and inappropriate;
    technology selection must be anchored to the actual feedstock concentration and
    transport economics of the specific feedstock type.
