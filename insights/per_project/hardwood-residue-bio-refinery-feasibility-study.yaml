- record_id: ARENA-DLV-52603
  source_title: Hardwood Residue Bio-Refinery Feasibility Study
  publish_date: 2019-07
  project_name: Hardwood Residue Bio-Refinery Feasibility Study
  what_happened: All pilot plant trial work was conducted exclusively on Blackbutt
    (Eucalyptus pilularis) sawmill residues; the performance of other hardwood species
    in terms of yield and capacity had not been determined at feasibility completion,
    representing a residual technical risk for a full-scale facility that would process
    multiple species.
  lesson_learnt: Where a biomass conversion process may receive feedstock from multiple
    species, feasibility-stage trials should test the range of intended feedstocks
    rather than a single representative species — unvalidated species variation becomes
    a residual technical risk that must be carried into detailed design and may affect
    yield assumptions underpinning the business case.
