  what_happened: The project adopted a staged gated-funding approval process — with
    separate gates for pre-feasibility, feasibility, final design/site selection/regulatory
    approval, and construction/commissioning — as a deliberate risk management strategy
    to prevent over-commitment of capital before key uncertainties were resolved.
  lesson_learnt: For first-of-a-kind industrial energy projects, structuring capital
    commitment through gated approvals — with each gate resolving a defined set of
    technical, regulatory and commercial uncertainties before the next tranche is
    committed — is an effective mechanism to limit downside exposure; this structure
    should be agreed with all capital providers (including grant funders) at the outset.
