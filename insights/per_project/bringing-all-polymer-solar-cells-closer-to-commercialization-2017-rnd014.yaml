- record_id: ARENA-DLV-48111
  source_title: ARENA-Funded Cutting Edge Research in Photovoltaics
  publish_date: 2019-09
  project_name: Bringing all-polymer solar cells closer to commercialization (2017/RND014)
  what_happened: Polymer solar cells face commercialisation barriers from lower efficiency and poor stability. The team demonstrated that blade-coating — a technique compatible with industrial coating conditions
    — can produce large-area polymer cells with efficiencies comparable to laboratory spin-coating methods. A novel 'time-resolved microwave conductivity' characterisation technique was also developed that
    significantly reduces the time required to evaluate new polymer materials without fabricating complete devices.
  lesson_learnt: When developing organic PV technologies for scale-up, prioritise deposition methods (such as blade-coating) that are directly compatible with industrial coating equipment from early in
    the R&D cycle; also invest in rapid screening tools (such as time-resolved microwave conductivity) to compress the material development cycle, as these have high leverage across the full materials pipeline.
