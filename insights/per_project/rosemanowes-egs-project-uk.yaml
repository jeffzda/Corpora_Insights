  evidence_excerpt: At Rosemanowes, it appears that every action to the reservoir
    was irreversible. In particular, pumping too hard at too high a pressure caused
    irreversible rock movements while applying too high a pressure for too long started
    to drive short circuits, as well as pathways for losses, to the far field... while
    the sand proppant was successfully emplaced and significantly reduced the water
    losses and increased the permeability, it also worsened the short circuiting and
    lowered the flow temperature into the production borehole even further.
