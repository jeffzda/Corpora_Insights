- record_id: ARENA-DLV-14970
  source_title: 'Looking Forward: Barriers, Risks and Rewards of the Australian Geothermal
    Sector to 2020 and 2030'
  publish_date: 2014-06
  project_name: Rosemanowes EGS Project (UK)
  what_happened: At the Rosemanowes Phase 2A EGS experiment, hydraulic stimulation
    produced fractures that grew downward rather than toward the production well,
    consistent with the in-situ stress regime; placement of proppants in the near-wellbore
    area of the production well successfully reduced water losses and increased permeability
    but worsened short-circuiting, lowering produced fluid temperature further.
  lesson_learnt: Every intervention in an EGS reservoir appears to be largely irreversible
    — pumping at too high a pressure, applying pressure for too long, or placing proppants
    near the production well can all initiate or worsen thermal short circuits that
    cannot be undone; stimulation parameters must be conservative and incremental,
    with real-time microseismic monitoring guiding decisions.
