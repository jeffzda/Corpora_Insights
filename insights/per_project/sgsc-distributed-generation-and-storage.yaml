  evidence_excerpt: In the field trial, it was observed that the distributed storage
    devices were scheduled to discharge between 4 pm and 9 pm, which was probably
    too wide a time range and diluted the peak shaving effect of the batteries. There
    is a risk that the battery charging cycles will create a new peak demand spike,
    if a larger number of batteries are installed.
