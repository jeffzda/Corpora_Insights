- record_id: ARENA-DLV-72294
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: '2015'
  project_name: 'SGSC: Distributed Generation and Storage'
  what_happened: The SGSC trial found that PV distributed generation in its current
    configuration had negligible impact on peak shaving, while fuel cell distributed
    generation reduced peak demand in a reliable and predictable manner, and wind
    turbine generation was not reliable or predictable enough to reduce peak load.
  lesson_warnt: PV generation alone should not be relied upon for network peak demand
    reduction — its generation profile does not align with evening peaks; dispatchable
    technologies such as fuel cells or storage are required for reliable peak shaving.
  lesson_learnt: PV generation alone should not be relied upon for network peak demand
    reduction — its generation profile does not align with evening peaks; dispatchable
    technologies such as fuel cells or storage are required for reliable peak shaving.
