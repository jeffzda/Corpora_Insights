- record_id: ARENA-DLV-72292
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: '2015'
  project_name: 'SGSC: Distributed Generation and Storage'
  what_happened: Ausgrid's SGSC distributed storage field trial found that batteries
    scheduled to discharge across too wide a time window (4–9pm) diluted the peak-shaving
    effect, and that battery charging cycles created a risk of generating a new peak
    demand spike if deployed at scale.
  lesson_learnt: Distributed battery storage dispatch windows must be tightly tuned
    to actual peak tariff periods — scheduling discharge across a broad window dilutes
    peak shaving benefit and risks creating secondary demand peaks from simultaneous
    charging.
