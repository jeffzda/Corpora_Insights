- record_id: ARENA-DLV-72293
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: '2015'
  project_name: 'SGSC: Distributed Generation and Storage'
  what_happened: The SGSC distributed storage trial found that battery systems designed
    to float-charge when fully charged consumed approximately 300W continuously during
    non-discharge periods, adding costs rather than reducing them and requiring careful
    alignment of discharge patterns with tariff periods.
  lesson_learnt: Battery system float power consumption during non-discharge periods
    is a hidden cost that must be factored into dispatch algorithms — discharge schedules
    must be tightly aligned with peak tariff windows to avoid float losses eroding
    economic benefit.
  issue_severity: moderate
  project_type: storage
  project_scale_band: demonstration
  lifecycle_phase: operations
