  evidence_excerpt: The design of the batteries means that, once charged, they must
    operate in a float mode which consumes roughly 300 W of power, until discharged.
    This battery 'float' power consumption during non-discharge periods add costs
    rather than reduce cost.
  confidence_note: Published 2015 — technical performance benchmarks for battery storage
