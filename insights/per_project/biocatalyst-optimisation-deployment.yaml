- record_id: ARENA-DLV-2101
  source_title: Biocatalyst Optimization for Efficient Production of Biofuels
  publish_date: 2021-03
  project_name: Biocatalyst optimisation for efficient production of biofuels from
    non-food biomass and deployment through a global partner corporation
  what_happened: The COVID-19 pandemic prevented planned full-scale trials at an operating
    second-generation bioethanol facility during the third year of the project. MicroBioGen
    instead secured real-world hydrolyzates from a full-scale operation and used these
    as the basis for laboratory benchmarking.
  lesson_learnt: When full-scale trials are blocked by external disruption (e.g. pandemic),
    securing authentic process materials (real hydrolyzates from operating facilities)
    for laboratory benchmarking can serve as a credible substitute — provided the
    technology has a demonstrated history of laboratory-to-scale accuracy.
