- record_id: ARENA-DLV-2104
  source_title: Biocatalyst Optimization for Efficient Production of Biofuels
  publish_date: 2021-03
  project_name: Biocatalyst optimisation for efficient production of biofuels from
    non-food biomass and deployment through a global partner corporation
  what_happened: MicroBioGen demonstrated that laboratory fermentations using only
    20 grams of material could accurately replicate full-scale fermentations of up
    to 4 million litres — a scale-up factor of 200 billion — based on validated 1G
    biofuels programs. This track record underpinned confidence in 2G laboratory results
    in the absence of full-scale trials.
  lesson_learnt: For biocatalyst development projects, establishing a rigorous laboratory-to-full-scale
    correlation in earlier program phases significantly de-risks scale-up validation
    in later phases — particularly when full-scale trials are unavailable. Document
    and publish this correlation explicitly so it can underpin credibility with funders
    and partners.
