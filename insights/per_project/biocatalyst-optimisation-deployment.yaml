- record_id: ARENA-DLV-2102
  source_title: Biocatalyst Optimization for Efficient Production of Biofuels
  publish_date: 2021-03
  project_name: Biocatalyst optimisation for efficient production of biofuels from
    non-food biomass and deployment through a global partner corporation
  what_happened: Over 15 years and approximately A$30M in cumulative R&D investment
    (including A$8M from ARENA over 3.5 years), MicroBioGen successfully optimised
    a second-generation yeast biocatalyst that achieved 97–99% of 13 Technical Success
    Criteria, compared to 66–83% for the commercial benchmark strain.
  lesson_learnt: Deep biotechnology optimisation for industrial-scale deployment requires
    sustained multi-phase public funding over many years; a single grant is insufficient
    — each successive program built on prior government-supported work to reach a
    commercially viable outcome.
