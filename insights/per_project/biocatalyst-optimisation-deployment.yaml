  what_happened: An independent peer-reviewed Life Cycle Analysis (LCA) conducted
    by Lifecycles and reviewed by an independent expert showed the optimised biocatalyst
    delivers a 29% reduction in CO2, 11% decline in fossil energy use, and a 240%
    decrease in land use compared to the commercial benchmark biocatalyst.
