- record_id: ARENA-DLV-2105
  source_title: Biocatalyst Optimization for Efficient Production of Biofuels
  publish_date: 2021-03
  project_name: Biocatalyst optimisation for efficient production of biofuels from
    non-food biomass and deployment through a global partner corporation
  what_happened: The ARENA-funded program identified that second-generation (2G) bioethanol
    currently has significantly higher costs than first-generation (1G) and produces
    few valuable by-products, creating a commercial viability gap. The optimised biocatalyst
    addressed this by enabling high-value single-cell protein as a co-product, estimated
    to reduce effective operating costs by up to 25%.
  lesson_learnt: For emerging industrial bioenergy technologies competing against
    mature first-generation processes, commercial viability depends on generating
    high-value co-products alongside the primary fuel output — designing the biocatalyst
    and process flow to capture co-product revenue streams should be a primary optimisation
    objective, not an afterthought.
