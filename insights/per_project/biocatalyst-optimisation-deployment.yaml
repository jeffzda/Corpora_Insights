  project_name: Biocatalyst optimisation for efficient production of biofuels from
    non-food biomass and deployment through a global partner corporation
  what_happened: The market analysis conducted during the program identified that
    the Californian Low Carbon Fuel Standard (LCFS) represents the most commercially
    attractive export market for Australian-produced lignocellulosic ethanol, and
    that Australia currently lacks an equivalent policy mechanism to drive domestic
    biofuel market penetration.
  lesson_learnt: Technology readiness alone is insufficient to commercialise advanced
    biofuels in Australia — project proponents and government should concurrently
    develop biofuel mandate or LCFS-style policy frameworks to create the market conditions
    needed for commercial deployment, as demonstrated by successful international
    models.
