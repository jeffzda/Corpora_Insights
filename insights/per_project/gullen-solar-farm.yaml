- record_id: ARENA-DLV-44860
  source_title: Co-Location of Large-Scale Wind and Solar Farms - Learnings from Development
    and Construction
  publish_date: 2020-01
  project_name: Gullen Solar Farm
  what_happened: Integrating the solar farm into the existing wind farm SCADA system
    required the wind turbine OEM (Goldwind) to code bespoke functionality in Beijing.
    While this was achieved, it is ordinarily difficult and expensive to engage a
    wind turbine OEM — who has no financial interest in a co-located solar farm —
    to modify their proprietary SCADA system. SCADA integration complexity, time and
    costs had not been adequately forecast in the development phase.
  lesson_learnt: In feasibility and development phases of a co-located project, place
    significant focus on SCADA and control system integration to properly forecast
    complexity, time and cost. Engaging the wind turbine OEM to modify their SCADA
    for a solar farm is expensive and contractually difficult; a standalone SCADA
    system for the co-located solar farm, or contracting the OEM to deliver the entire
    co-located plant, should be evaluated as alternative approaches.
