- record_id: ARENA-DLV-44870
  source_title: Co-Location of Large-Scale Wind and Solar Farms - Learnings from Development
    and Construction
  publish_date: 2020-01
  project_name: Gullen Solar Farm
  what_happened: The AEMO registration process for the brownfield co-located solar
    farm required modifying the existing wind farm registration. This process exposed
    the existing revenue-generating wind farm to potential operational constraints
    during the R2 testing and registration process of the combined plant. In practice,
    no restrictive hold points were applied to the wind farm during R2 testing for
    this project, but the risk is material for larger co-located additions.
  lesson_learnt: When co-locating additional generation at a brownfield site, ensure
    the registration and R2 testing framework does not expose the existing compliant
    generator to operational constraints. Developers should negotiate with AEMO that,
    if the co-located addition is found non-compliant, the rectification is to constrain
    the new plant rather than the existing generator. This protection is critical
    where the existing plant is under project finance obligations.
  issue_severity: minor
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: project developer
  delay_category: commissioning/integration
  failure_mode: regulatory & approvals
  outcome_class: successful demonstration
  secondary_failure_mode: coordination & stakeholders
  intervention_note: No restrictive hold points were applied to GRWF during R2 testing;
    R2 testing was performed with negligible lost generation from either farm, facilitated
    by the solar farm's small capacity relative to the wind farm.
  transferability: moderate
  delay_magnitude: null
  technology_domain: hybrid systems
  source_pages: &id020
  - 19
  evidence_excerpt: If brownfield co-located generation facilities are to be attractive
    to developers, it is important that the existing facility is not exposed to risk
    during the registration and R2 testing process of the combined plant… If the combined
    plant or the co-located generator are found not to be NER or GPS compliant, it
    would seem an appropriate rectification measure to return to the situation where
    only the original generator was online, that is constrain the new plant being
    installed.
