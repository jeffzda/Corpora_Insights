  outcome_class: delayed but recoverable
  secondary_failure_mode: poor scoping
  intervention_note: Agreement was reached with AEMO to register the solar farm at
    a reduced capacity of 9.17MW in August 2017, allowing first generation on 1 September
    2017 — two weeks late against the EPC contract but within the ARENA Funding Agreement
    timescales.
  transferability: moderate
