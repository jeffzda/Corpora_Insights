- record_id: ARENA-DLV-44859
  source_title: Co-Location of Large-Scale Wind and Solar Farms - Learnings from Development
    and Construction
  publish_date: 2020-01
  project_name: Gullen Solar Farm
  what_happened: The NER requires each individual generating unit to be NER-compliant
    independently, meaning one co-located technology cannot compensate for deficiencies
    in the other. This also meant a battery or capacitor bank could not be used to
    satisfy inverter headroom requirements for s5.2.5.4, as compliance must be achieved
    at the individual inverter level. This constraint reduced several anticipated
    cost advantages of co-location.
  lesson_learnt: 'Do not assume co-location allows one renewable technology to compensate
    for NER/GPS non-compliance in another. The NER requires individual generating
    unit compliance. This has direct implications for co-location business cases:
    reactive plant cost savings may not materialise, and technology-level compliance
    must be verified independently for each generation type within the co-located
    facility.'
  issue_severity: moderate
