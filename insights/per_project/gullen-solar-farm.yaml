- record_id: ARENA-DLV-44865
  source_title: Co-Location of Large-Scale Wind and Solar Farms - Learnings from Development
    and Construction
  publish_date: 2020-01
  project_name: Gullen Solar Farm
  what_happened: Approximately 10% of driven piles reached refusal before design depth,
    requiring additional testing and design work. Most achieved sufficient pull-out
    resistance at the as-driven depth; a small proportion required drilling and concreting.
    Piles that were cut off short were field-treated with galvanised paint to maintain
    corrosion protection.
  lesson_learnt: In solar farm pile design, assume a portion of driven piles (around
    10% based on this project) will reach refusal before design depth due to subsurface
    rock. Design should include a clear protocol for testing pull-out resistance at
    refusal depth, an approved remediation approach (drill and concrete) for piles
    that fail pull-out testing, and a corrosion protection procedure for cut-off pile
    heads — all agreed with the framing supplier before construction begins to preserve
    structural and warranty integrity.
