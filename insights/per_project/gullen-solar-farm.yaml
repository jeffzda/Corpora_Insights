- record_id: ARENA-DLV-44856
  source_title: Co-Location of Large-Scale Wind and Solar Farms - Learnings from Development
    and Construction
  publish_date: 2020-01
  project_name: Gullen Solar Farm
  what_happened: AEMO's internal systems were incapable of issuing combined dispatch
    limits to a co-located wind and solar generator behind a single connection point.
    This constraint was not identified during feasibility discussions with AEMO or
    during early registration engagement. It was only disclosed in May 2017, late
    in the registration process, after the wind farm Power Plant Controller had already
    been modified without provision for receiving two separate dispatch signals.
  lesson_learnt: Verify AEMO's dispatch system capability for hybrid/co-located generators
    — specifically whether AWEFS and ASEFS dispatch signals can be combined — before
    finalising control system design. Do not assume early AEMO consultation covers
    all operational system constraints; separate AEMO teams are responsible for GPS
    review and dispatch system architecture and may not coordinate. Design plant control
    systems to accommodate dual dispatch signals as a default for co-located wind-solar
    configurations.
  issue_severity: major
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: project developer
  delay_category: commissioning/integration
  failure_mode: unvalidated integration
  outcome_class: re-scoped/adapted
  secondary_failure_mode: coordination & stakeholders
  intervention_note: A solution was developed where both the solar farm and wind farm
    dispatch signals are managed through the wind farm control system; the design
    retains the ability to revert to a single combined dispatch point if AEMO upgrades
    its systems in future.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hybrid systems
  source_pages: &id006
  - 18
  - 19
  evidence_excerpt: Late in the registration process, in May 2017, AEMO advised that
    they intended to send two separate sets of power dispatch signals to the co-located
    plant… AEMO was resource constrained at the time, and separate teams were responsible
    for due diligence of the GPS compared to those responsible for the dispatch limits.
