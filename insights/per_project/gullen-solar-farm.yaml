- record_id: ARENA-DLV-44857
  source_title: Co-Location of Large-Scale Wind and Solar Farms - Learnings from Development
    and Construction
  publish_date: 2020-01
  project_name: Gullen Solar Farm
  what_happened: AEMO's registration process for adding the solar farm to the existing
    wind farm registration took considerably longer than originally programmed, contributing
    to commissioning delays. AEMO was handling a high volume of registration requests
    and its Onboarding team processing times were a significant factor.
  lesson_learnt: Schedule significantly more time for AEMO registration when modifying
    an existing generator registration to include a co-located generator. AEMO workload
    has increased substantially; registration timelines that were acceptable in earlier
    market conditions are no longer reliable. Build registration duration risk into
    both the EPC contract milestones and the project financial model.
  issue_severity: moderate
  project_type: generation
