- record_id: ARENA-DLV-44875
  source_title: Co-Location of Large-Scale Wind and Solar Farms - Learnings from Development
    and Construction
  publish_date: 2020-01
  project_name: Gullen Solar Farm
  what_happened: Analysis of combined wind and solar generation output at Gullen Range
    showed that while the solar farm's generation was complementary to the wind farm
    on a monthly basis (solar peaks when wind is lowest), the 10MW solar farm was
    far too small relative to the 73MW wind farm to materially address month-to-month
    or diurnal intermittency. Even a modelled 100MW solar farm would still show considerable
    monthly output deviation.
  lesson_learnt: When sizing a co-located solar farm to reduce wind farm intermittency,
    the required solar capacity is substantially larger than may be initially assumed.
    At this site, a solar farm an order of magnitude larger than installed (approximately
    100MW vs 10MW) would still not resolve monthly intermittency. Intermittency reduction
    should not be the primary business case driver for small-scale co-location projects.
