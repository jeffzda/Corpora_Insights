  what_happened: The EPC contractor indicated during early construction that the panel
    supplier (Yingli) would supply a slightly different panel than originally specified
    at tender, with reduced glass thickness. An independent QA assessment was commissioned
    at the Chinese manufacturing facility. Panels were accepted and installed, with
    additional microcracking checks performed during installation; tests passed without
    issue.
  lesson_learnt: Include contractual provisions for independent factory QA inspection
    of PV panels at the manufacturing facility when the supplier substitutes a panel
    variant from the tendered specification. Even where a substitute panel is assessed
    as fit for purpose over project lifetime, reduced specification parameters (such
    as glass thickness) warrant specific commissioning checks (e.g. microcracking
    assessment) and should be documented for warranty purposes.
