  outcome_class: delayed but recoverable
  secondary_failure_mode: coordination & stakeholders
  intervention_note: Specialist switching plans were written to work around the malfunctioning
    switchgear; approximately half the wind farm was returned to service the following
    lunchtime and the remainder the following morning.
  transferability: moderate
  delay_magnitude: <1 month
