  source_title: Co-Location of Large-Scale Wind and Solar Farms - Learnings from Operation
  publish_date: '2020-05-29'
  project_name: Gullen Solar Farm
  what_happened: Fault-finding for AEMO data signals was more complex than on a standalone
    facility because a signal had to pass through four separate systems (solar farm
    → wind farm SCADA → substation SCADA → Transgrid → AEMO), each managed by a different
    party, making it necessary to contact multiple organisations to trace the source
    of any signal fault.
  lesson_learnt: Co-located projects sharing data pathways through multiple third-party
    systems should map the full signal chain and establish clear fault-escalation
    contacts for each segment before commissioning, to reduce diagnostic time when
    data issues arise.
