- record_id: ARENA-DLV-44854
  source_title: Co-Location of Large-Scale Wind and Solar Farms - Learnings from Development
    and Construction
  publish_date: 2020-01
  project_name: Gullen Solar Farm
  what_happened: Community consultation prior to the Development Application identified
    that the originally preferred solar farm site was unacceptable to nearby residents.
    The site was relocated, requiring environmental and archaeological assessments
    to be repeated at the new location, which delayed DA submission and increased
    development costs.
  lesson_learnt: Conduct substantive community consultation on site selection as early
    as feasible, before committing to environmental and archaeological survey expenditure
    at a specific location. While earlier consultation carries the risk of discussing
    sites not yet fully assessed for feasibility, the cost and delay of relocating
    after surveys have been completed is greater — and early community buy-in materially
    reduces construction and operational friction.
