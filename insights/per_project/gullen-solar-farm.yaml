  source_title: Co-Location of Large-Scale Wind and Solar Farms - Learnings from Operation
  publish_date: '2020-05-29'
  project_name: Gullen Solar Farm
  what_happened: Q1 2020 generation was materially below forecast due to a combination
    of reduced solar irradiation (attributed to bushfire smoke in January and February
    2020) and a seven-day substation outage at the end of March — external events
    outside the project's control that nonetheless significantly affected quarterly
    performance.
  lesson_learnt: Solar farm energy yield assessments and investor reporting should
    explicitly flag the vulnerability of quarterly performance to low-probability
    external events such as regional bushfire smoke and shared-infrastructure outages;
    these are not systematic underperformance signals and should be disaggregated
    from structural forecast deviation.
