  what_happened: PV module shipping delays and time spent optimising the piling process
    contributed to a construction schedule lag of 7% by March 2017, though this was
    recovered to 3% by June 2017 and mechanical completion was achieved on schedule
    for commissioning.
  lesson_learnt: Schedule and contingency planning for utility-scale solar construction
    should account for PV module shipment delays from overseas suppliers and the time
    needed to optimise piling methodologies on-site, particularly where geotechnical
    conditions require adaptation. Early geotechnical investigation reduces piling
    risk.
