- record_id: ARENA-DLV-44855
  source_title: Co-Location of Large-Scale Wind and Solar Farms - Learnings from Development
    and Construction
  publish_date: 2020-01
  project_name: Gullen Solar Farm
  what_happened: Revenue metering of the co-located solar farm presented significant
    NER compliance issues. AEMO initially indicated agreement to registering a 33kV
    'on-market' meter with a losses algorithm, but during the formal registration
    process reversed this position, concluding the approach was not acceptable under
    the NER due to algorithm complexity. An alternative 'off-market' settlement arrangement
    had to be designed and implemented.
  lesson_learnt: Revenue metering arrangements for co-located generators sharing a
    single NSP connection point must be thoroughly resolved at feasibility stage —
    AEMO's position on NEM-registrability of sub-connection-point meters can change
    between early consultation and formal registration. If co-located plants have
    separate PPA arrangements or separate financiers, off-market settlement workarounds
    may not be viable, so a standalone connection point per generator may be required,
    negating significant cost savings.
  issue_severity: major
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: project developer
  delay_category: grid connection/system studies
  failure_mode: regulatory & approvals
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Plus ES (formerly Ausgrid) was engaged as Meter Data Provider
    to design an off-market generation segregation algorithm using the 33kV solar
    farm feeder meter; on-market settlement proceeds at the 330kV connection point
    as a hybrid plant with weekly revenue transfer from NGRWF to GSF.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id005
