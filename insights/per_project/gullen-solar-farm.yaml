  - 33
  evidence_excerpt: The NER's require that individual generating units must be NER
    compliant, as well as the entire plant behind the connection point. Therefore,
    co-location is not a way of using one renewable energy technology to compensate
    for deficiencies in another technology… it is not a valid assumption to presume
    co-location will result in cost savings on reactive plant, as the NER requires
    individual generating units to be NER compliant on a standalone basis.
