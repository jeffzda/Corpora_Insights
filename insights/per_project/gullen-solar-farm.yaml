  source_title: Co-Location of Large-Scale Wind and Solar Farms - Learnings from Development
    and Construction
  publish_date: 2020-01
  project_name: Gullen Solar Farm
  what_happened: Late in AEMO's review of the project's grid studies, AEMO raised
    a concern with the solar farm's compliance with GPS clause s5.2.5.4 (continuous
    uninterrupted operation requirement) for the solar inverters. This was raised
    when construction was almost complete and inverters were ready for energisation.
    As a result, the plant was registered at reduced capacity (9.17MW instead of 10MW)
    and operated at that level for approximately 12 months while a retrofit solution
    was developed.
  lesson_learnt: Confirm solar inverter compliance with GPS clause s5.2.5.4 (10% headroom
    for continuous uninterrupted operation) early in the design process, before equipment
    is procured and installed. This requirement means solar inverters need spare current
    capacity headroom that may not be included in standard equipment specifications.
    Discovering non-compliance after installation severely limits rectification options
    and can result in 12+ months of constrained capacity.
