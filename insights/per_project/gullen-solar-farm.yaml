- record_id: ARENA-DLV-44863
  source_title: Co-Location of Large-Scale Wind and Solar Farms - Learnings from Development
    and Construction
  publish_date: 2020-01
  project_name: Gullen Solar Farm
  what_happened: The EPC contractor (DBJV) underestimated the time required to discharge
    pre-construction conditions of consent, particularly those requiring documentation
    approved by the Office of Environmental Heritage and Water NSW. Separately, registration
    of an easement for the underground cable by NSW Land Registry Services was delayed
    by plan issues. By March 2017, DBJV's reporting showed a 7% lag in on-site progress.
  lesson_learnt: EPC contractors and developers should allocate realistic timeframes
    — and not rely on pre-mobilisation assumptions — for discharging conditions of
    consent that require third-party agency approvals (particularly Heritage and Water
    agencies) and for land registry processes such as easement registration. Where
    possible, negotiate with council to allow enabling works to proceed while final
    conditions are discharged, to mitigate the schedule impact.
