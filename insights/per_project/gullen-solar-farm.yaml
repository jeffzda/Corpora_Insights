  what_happened: PCB (inverter/transformer) faults were the dominant source of unscheduled
    solar farm downtime. Inverter component failures required specialist technicians
    and sometimes parts on order, meaning that despite short on-site repair times,
    the lead time to commence repair created comparatively long outage periods.
  lesson_learnt: Solar farm O&M plans should maintain a stock of critical inverter
    components on-site or establish rapid-supply agreements with the PCB manufacturer,
    as lead times for parts — rather than repair complexity — are the primary driver
    of inverter-related generation loss.
