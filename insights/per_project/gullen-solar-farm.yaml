  secondary_failure_mode: null
  intervention_note: DBJV and Gullen Solar agreed with council to allow some enabling
    works to proceed while final conditions were being discharged, which successfully
    mitigated the delays; by June 2017 the program lag had been reduced from 7% to
    3%.
