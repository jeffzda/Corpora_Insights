  publish_date: 2020-01
  project_name: Gullen Solar Farm
  what_happened: Financing for the merchant solar farm (no PPA) was achieved by extending
    the existing project finance debt facility of the co-located wind farm, using
    GRWF's free cash flows as a guarantee. This approach reduced due diligence requirements,
    enabled a lower interest rate, and allowed the usual share and asset mortgage
    requirement for the solar farm to be waived.
  lesson_learnt: Merchant solar projects that cannot access standard project finance
    on viable terms may be financeable by co-locating with an existing wind farm under
    the same ownership and extending that plant's existing debt facility. This approach
    requires common ownership, common financiers, and healthy existing plant cash
    flows; it becomes less viable as the solar-to-wind capacity ratio increases.
