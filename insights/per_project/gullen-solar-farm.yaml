  project_name: Gullen Solar Farm
  what_happened: Grid connection and SCADA costs in the financial model were significantly
    underestimated. Goldwind SCADA integration fees were approximately double the
    modelled value. No allowance had been made in the financial model for AEMO and
    Transgrid due diligence costs during registration, nor for wind farm O&M contractor
    time during connection and commissioning works.
  lesson_learnt: 'Financial models for co-located solar farms must explicitly include:
    wind turbine OEM SCADA integration fees (which can be double preliminary estimates),
    AEMO registration due diligence costs, network operator (Transgrid/TNSP) due diligence
    costs, and the incumbent wind farm WOM contractor''s time during connection and
    commissioning. These costs are routinely omitted and collectively material.'
