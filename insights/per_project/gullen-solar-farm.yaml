  source_title: Co-Location of Large-Scale Wind and Solar Farms - Learnings from Operation
  publish_date: '2020-05-29'
  project_name: Gullen Solar Farm
  what_happened: Accumulation of bird faeces on solar panels during extended dry weather
    periods caused localised hot spotting and potential panel damage. The north-facing
    slope chosen for the farm — which improved energy yield and allowed tighter panel
    spacing — made manual cleaning more difficult due to gradient and undulation,
    and precluded conventional tractor-based or automated cleaning solutions.
  lesson_learnt: Solar farm designs on sloped terrain should explicitly assess cleaning
    access and panel soiling risks (including bird faeces) at the design stage; the
    row spacing and access widths required for cleaning equipment should be factored
    into the layout before finalising panel spacing decisions.
