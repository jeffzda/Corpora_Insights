  publish_date: 2020-01
  project_name: Gullen Solar Farm
  what_happened: The co-located solar farm's EPC contractor (DBJV) and the wind farm's
    operations and maintenance contractor (Goldwind Australia) were separate entities.
    This created contractual interface complexity including shared facility use, availability
    warranty boundaries, ownership of pre-existing switchgear used by the solar farm,
    and the effect of additional solar farm load on the wind farm's existing transformer
    warranty.
  lesson_learnt: 'For brownfield co-location projects, identify and contractually
    resolve all interfaces between the solar farm EPC contract and the existing plant
    WOM contract in the development phase. Key items include: shared facility costs,
    outage liability, responsibility for pre-existing shared equipment, and warranty
    implications of increased transformer loading. Modifying an existing WOM contract
    is difficult if the incumbent contractor does not benefit from the new plant.'
