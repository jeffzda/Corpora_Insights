  source_title: Co-Location of Large-Scale Wind and Solar Farms - Learnings from Operation
  publish_date: '2020-05-29'
  project_name: Gullen Solar Farm
  what_happened: High voltage switching of the 33kV breaker connecting the solar farm
    to the wind farm substation was not covered in the wind farm O&M contract and
    had to be performed as additional services by Goldwind. Insufficient involvement
    of the wind farm operations team at the design stage led to inefficiencies in
    plant isolation procedures.
  lesson_learnt: Design of a co-located solar farm should consider the existing high
    voltage switching and isolation procedures of the wind farm at an early stage,
    so that procurement can specify which equipment must be lockout-capable; the wind
    farm operations team should be involved in design review before equipment is procured.
