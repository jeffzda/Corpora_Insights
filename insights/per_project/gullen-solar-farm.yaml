  lifecycle_phase: development/design
  proponent_type: project developer
  delay_category: stakeholder/land/community
  failure_mode: coordination & stakeholders
  outcome_class: delayed but recoverable
  secondary_failure_mode: null
  intervention_note: The alternative site was accepted by the community; the project
    subsequently experienced no community complaints related to the solar farm location
    and enjoyed strong community support throughout construction and operation.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id004
  - 9
  - 31
  evidence_excerpt: The change in site location resulted in delays to submission of
    the application, but this was offset by greater community support… Moving the
    solar farm site delayed the project and increased the development costs, as environmental
