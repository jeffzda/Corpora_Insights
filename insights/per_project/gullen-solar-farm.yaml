  project_name: Gullen Solar Farm
  what_happened: For GSF, a shared server between the solar farm and wind farm SCADA
    was initially assumed but was found unmanageable in terms of user permissions,
    requiring an additional dedicated server for the solar farm to be procured as
    a variation. Additionally, 4G communications to the solar farm meter had not been
    adequately scoped in the EPC contract, also requiring a variation.
  lesson_learnt: When co-locating a solar farm with an existing wind farm and sharing
    SCADA and communications infrastructure, explicitly scope out the communications
    and permissions architecture — including whether a shared or dedicated server
    is appropriate and how metering communications will be provided — before EPC contract
    execution. Under-scoping these items leads to contract variations and additional
    cost.
