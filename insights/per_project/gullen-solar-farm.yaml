- record_id: ARENA-DLV-44852
  source_title: Co-Location of Large-Scale Wind and Solar Farms - Learnings from Development
    and Construction
  publish_date: 2020-01
  project_name: Gullen Solar Farm
  what_happened: Because the JRPP approved only the preferred tenderer's specific
    design, the developer lost contractual leverage with both the EPC contractor and
    its subcontractors, as there was effectively no competitive alternative once approval
    was locked to one design. This created risk of higher project costs through increased
    margins or unavoidable price increases with no design flexibility to offset them.
  lesson_learnt: When a JRPP development approval locks in one tenderer's design,
    developers lose bargaining power in EPC contracting. Procurement processes for
    projects going through JRPP should be structured to preserve design flexibility
    or accept that reduced contractual leverage will likely increase project cost.
