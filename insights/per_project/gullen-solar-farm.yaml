  publish_date: 2020-01
  project_name: Gullen Solar Farm
  what_happened: An Owner's Site Representative with prior solar and wind farm experience
    was retained full-time on site, separate from the Owner's Engineer contract. This
    was particularly valuable because the EPC contractor (DBJV) had limited large-scale
    solar experience, and the full-time presence helped fill knowledge gaps and identify
    issues early, even though the role carried very limited formal powers to direct
    the contractor.
  lesson_learnt: Appoint a full-time, experienced Owner's Site Representative — separate
    from the Owner's Engineer — especially when the EPC contractor lacks large-scale
    solar experience. The value of an experienced on-site presence in identifying
    and informally resolving issues exceeds the cost, even where the role has limited
    formal contractual authority.
