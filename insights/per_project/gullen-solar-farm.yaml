- record_id: ARENA-DLV-44871
  source_title: Co-Location of Large-Scale Wind and Solar Farms - Learnings from Development
    and Construction
  publish_date: 2020-01
  project_name: Gullen Solar Farm
  what_happened: The solar farm's settlement price consistently traded below the NSW
    Average Regional Reference Price, consistent with the solar 'duck curve' effect,
    and was below the average RRP in all periods observed. However, it exceeded the
    forecast price used in the financial model at ARENA Financial Close in both 2018
    and 2019.
  lesson_learnt: Merchant solar farms should model settlement price at a discount
    to the average Regional Reference Price to reflect the solar generation profile's
    correlation with peak solar periods when prices are suppressed. Financial models
    that use average RRP without a solar-specific discount are likely to overestimate
    revenue in markets with growing solar penetration.
