- record_id: ARENA-DLV-44868
  source_title: Co-Location of Large-Scale Wind and Solar Farms - Learnings from Development
    and Construction
  publish_date: 2020-01
  project_name: Gullen Solar Farm
  what_happened: Co-locating the 10MW solar farm with the existing 73MW Gullen Range
    Wind Farm generated grid connection cost savings of approximately $4.5 million
    by using the existing 33/330kV substation, switchgear, and grid connection infrastructure.
    Total actual grid connection cost was $1,035,895 against an estimated standalone
    connection cost of approximately $5,515,000 for a 66kV-connected solar farm.
  lesson_learnt: Co-location with an existing wind farm offers very significant grid
    connection cost savings — approximately 80% in this case — by utilising existing
    substation infrastructure, transformers, and connection agreements. These savings
    are the dominant financial benefit of co-location and should be central to the
    business case. However, the savings depend on the co-located plant being small
    relative to existing infrastructure capacity and on compatible ownership and financing
    structures.
