  what_happened: Merchant power prices in February and March 2020 fell dramatically
    below the financial model's assumed price, attributed primarily to the COVID-19
    pandemic and associated demand reduction, exposing the merchant revenue risk of
    operating without a PPA.
  lesson_learnt: Solar farms operating on a fully merchant basis are exposed to revenue
    volatility from demand shocks and should model downside price scenarios; the COVID-19
    experience demonstrates that black swan demand events can rapidly push settlement
    prices below financial model assumptions.
