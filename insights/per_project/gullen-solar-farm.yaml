  project_name: Gullen Solar Farm
  what_happened: Sheep grazing was introduced inside the solar farm array after adequate
    revegetation, and proved effective at controlling grass height at a lower cost
    than mechanical mowing, which costs approximately $20,000 per cut for the site.
    Additional CAPEX was required upfront to protect combiner boxes, but this was
    justified by ongoing savings.
  lesson_learnt: Sheep grazing is a cost-effective grass management strategy for solar
    farms and should be investigated during design; modest additional CAPEX to protect
    combiner boxes and other low-level equipment is warranted given the ongoing savings
    over mechanical mowing, though site suitability must be assessed individually.
