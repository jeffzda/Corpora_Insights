- record_id: ARENA-DLV-44853
  source_title: Co-Location of Large-Scale Wind and Solar Farms - Learnings from Development
    and Construction
  publish_date: 2020-01
  project_name: Gullen Solar Farm
  what_happened: JRPP conditions of consent were prescriptive and difficult to modify
    after approval. An example was the export cable route, where a minor micro-siting
    change to avoid expensive and risky steep rocky terrain was identified during
    construction but could not be implemented without a formal JRPP Development Approval
    modification, which ULSC could not grant unilaterally.
  lesson_learnt: Prescriptive JRPP conditions of consent cannot be varied by the local
    council and require a formal JRPP modification process that is slow and infrequent.
    Developers should identify potential micro-siting risks during development and
    seek planning conditions that allow engineering flexibility within defined environmental
    survey bounds, rather than locking in precise routes or layouts.
  issue_severity: moderate
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: The cable was installed over the steep rocky terrain as no modification
    pathway was available within the construction timeframe.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id003
  - 11
  evidence_excerpt: ULSC (who administered the consent once approved) could not allow
    this micro-siting without a modification to the Development Approval by the JRPP,
    so the cable was installed over the steep rocky terrain. This is an example of
    inflexible planning conditions preventing the minimisation of impacts.
