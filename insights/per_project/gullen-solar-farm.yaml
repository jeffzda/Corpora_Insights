  publish_date: 2020-01
  project_name: Gullen Solar Farm
  what_happened: During road construction required as a condition of consent, the
    EPC contractor (DBJV) and Gullen Solar chose to contract the public road upgrade
    separately and directly to a local contractor familiar with ULSC procedures, rather
    than through the EPC contract. This allowed road works to commence while EPC contract
    negotiations were finalised. The road works were completed approximately two weeks
    behind schedule but without community complaints.
  lesson_learnt: Where conditions of consent require public infrastructure works (such
    as road upgrades) before construction, consider contracting these works directly
    and separately from the main EPC contract to avoid delaying the critical path
    while EPC commercial negotiations continue. Using a contractor with established
    relationships with the relevant local council can facilitate faster council approvals
    for the enabling works.
