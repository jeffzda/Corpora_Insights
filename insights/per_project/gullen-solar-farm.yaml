  publish_date: 2020-01
  project_name: Gullen Solar Farm
  what_happened: During connection of the new 33kV solar farm export cable to the
    existing wind farm switchboard, a set of switchgear malfunctioned when the wind
    farm was being restarted. Approximately half the wind farm was offline until the
    following lunchtime, with the remainder restored the following morning, resulting
    in 2,249 wind turbine outage hours across 73 turbines.
  lesson_learnt: Define and contractually formalise the interfaces between a solar
    farm EPC contractor and the existing wind farm operations and maintenance contractor
    before construction commences, including minimum notice periods for outage requests,
    qualification and induction requirements for substation access, and clear allocation
    of responsibility for pre-existing plant components used during co-located connection
    works. Switchboard connection activities carry risk of disrupting existing plant
    revenue.
