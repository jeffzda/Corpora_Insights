- record_id: ARENA-DLV-44916
  source_title: Co-Location of Large-Scale Wind and Solar Farms - Learnings from Operation
  publish_date: '2020-05-29'
  project_name: Gullen Solar Farm
  what_happened: Analysis of two years of operational data showed that co-location
    of the 10 MW solar farm with the 165 MW wind farm reduced intermittency on a seasonal
    basis (solar peaks offset wind troughs), but was not effective at reducing diurnal
    intermittency — on average daily basis, the solar farm marginally increased deviation
    from maximum output rather than smoothing it.
  lesson_learnt: Proponents should not assume co-located wind and solar will reduce
    diurnal intermittency; seasonal complementarity may be strong but daily output
    correlation is influenced by local weather patterns, and the relative scale of
    solar to wind is a key factor — at Gullen the solar farm was too small relative
    to the wind farm to meaningfully smooth daily output.
