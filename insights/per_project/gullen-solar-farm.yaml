  source_title: Co-Location of Large-Scale Wind and Solar Farms - Learnings from Operation
  publish_date: '2020-05-29'
  project_name: Gullen Solar Farm
  what_happened: Integrating the solar farm into the existing wind farm's proprietary
    Goldwind SCADA system reduced upfront construction costs but created ongoing operational
    limitations — some data channels could only be downloaded one day at a time, certain
    useful features (e.g. PCB fault colour coding) could not be implemented, and further
    adjustments required Goldwind's team in China whose priority was improving wind
    products, not supporting a one-off co-located solar farm.
  lesson_learnt: Future co-located wind and solar projects should carefully weigh
    the SCADA integration cost savings against operational limitations; detailed scopes
    of work covering all interfaces and contractual links between all parties should
    be prepared before committing to a shared proprietary system.
