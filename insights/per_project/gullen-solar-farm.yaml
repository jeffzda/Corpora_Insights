  project_name: Gullen Solar Farm
  what_happened: There was no contractual link between Goldwind (responsible for wind
    farm SCADA) and Balance Energy Solutions (responsible for solar farm equipment),
    meaning issues requiring co-operation between the two parties — such as incorrect
    data scaling or data unavailability — were slow to resolve due to the bespoke
    nature of the arrangement.
  lesson_learnt: When co-locating assets with different O&M contractors, ensure contracts
    include explicit interface obligations and escalation pathways between all parties;
    the absence of a contractual link between the wind SCADA provider and the solar
    O&M contractor made resolving data issues unnecessarily slow.
