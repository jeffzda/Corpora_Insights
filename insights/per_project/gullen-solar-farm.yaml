- record_id: ARENA-DLV-44851
  source_title: Co-Location of Large-Scale Wind and Solar Farms - Learnings from Development
    and Construction
  publish_date: 2020-01
  project_name: Gullen Solar Farm
  what_happened: The Joint Regional Planning Panel (JRPP) required a higher level
    of detailed design information than the NSW Department of Planning (DPIE) requires
    for State Significant Developments, including exact size, location and layout
    of PV panels, before granting development approval. This occurred despite the
    application being prepared to State Significant standard.
  lesson_learnt: Before committing to a JRPP development pathway for a renewable energy
    project, developers should allow additional time for determination, provide more
    detail than expected, attempt ongoing engagement with the JRPP, and design a procurement
    process where elevated design detail is available upfront — even if this increases
    total project cost. Additional CAPEX should be budgeted to accommodate inflexible
    planning conditions.
  issue_severity: major
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: poor scoping
  intervention_note: The preferred EPC tenderer had already completed an above-normal
    level of design work, allowing the additional JRPP-requested detail to be quickly
    supplied; approval was granted at the subsequent JRPP meeting on 22 June 2016.
  transferability: moderate
  delay_magnitude: 3-12 months
  technology_domain: solar PV
  source_pages: &id001
  - 9
  - 10
  - 11
  - 12
  evidence_excerpt: It became apparent during the determination of GSF that the JRPP
    had a greater requirement for detailed design information than required by the
    DPIE. In the case of GSF, this design information was available and could be provided,
    however, this approach had subsequent effects for the project and has repercussions
    for other similar sized projects in NSW.
  confidence_note: Delay magnitude not precisely quantified; estimated 3–12 months
    based on DA submission December 2015 and approval June 2016.
