  - 18
  evidence_excerpt: During registration, it became apparent that AEMO was no longer
    supportive of this approach because it was not acceptable under the National Electricity
    Rules (NER). AEMO noted concerns with the complexity of the algorithm. AEMO concluded
    they would not register the solar farm meter 'on-market' within the NEM.
