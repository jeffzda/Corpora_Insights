- record_id: ARENA-DLV-44920
  source_title: Co-Location of Large-Scale Wind and Solar Farms - Learnings from Operation
  publish_date: '2020-05-29'
  project_name: Gullen Solar Farm
  what_happened: The Gullen Range site had available headroom in its grid connection,
    allowing both the wind farm and the co-located solar farm to operate at full capacity
    simultaneously — a configuration that reduces the effective cost of grid connection
    for the solar farm and is not available at all potential co-location sites.
  lesson_learnt: When evaluating wind farm sites for solar co-location, the presence
    of spare grid connection capacity that allows simultaneous full output from both
    technologies is a key financial enabler; sites without this headroom will face
    curtailment or additional grid upgrade costs that should be factored into the
    co-location business case.
