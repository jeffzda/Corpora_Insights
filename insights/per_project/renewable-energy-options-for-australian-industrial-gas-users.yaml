- record_id: ARENA-DLV-12029
  source_title: Renewable Energy Options for Australian Industrial Gas Users
  publish_date: 2015-09
  project_name: Renewable Energy Options for Australian Industrial Gas Users
  what_happened: A waste-to-energy plant in Germany experienced a shortage of waste
    feedstock following its technical success, because combined improvements in recycling
    reduced the volume of waste available, leading to increased energy costs from
    the need to transport waste from much greater distances — an unforeseen systemic
    risk.
  lesson_learnt: Bioenergy and waste-to-energy project proponents should model long-term
    feedstock availability scenarios including the effect of increasing recycling
    rates and competing uses for waste streams; apparent zero-cost waste streams can
    become costly to source as markets for those materials develop or as policy drives
    diversion.
