  what_happened: 'Geothermal hot sedimentary aquifer systems were found to have a
    strong minimum economic threshold: below approximately 170,000 GJ/year of annual
    demand, the capital cost of a well pair could not be amortised economically, while
    above this threshold the LCOE became highly competitive with gas even at moderate
    depths.'
  lesson_learnt: Geothermal direct-use projects should only be pursued by industrial
    gas users with very large, continuous low-temperature heat demands (above ~170,000
    GJ/year); probabilistic resource assessment by specialist hydrogeological consultants
    is essential before any capital commitment given the uncertainty in aquifer depth,
    temperature and flow rate.
