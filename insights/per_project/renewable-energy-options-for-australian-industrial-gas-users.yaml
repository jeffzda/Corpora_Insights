- record_id: ARENA-DLV-12006
  source_title: Renewable Energy Options for Australian Industrial Gas Users
  publish_date: 2015-09
  project_name: Renewable Energy Options for Australian Industrial Gas Users
  what_happened: Small and micro industrial businesses required payback periods of
    one to three years (IRR 30–100%) before investing in renewable energy technology,
    while larger businesses could accept four to five years (IRR ~20%), with only
    strategically motivated companies accepting longer paybacks; this created a structural
    mismatch with the typical payback periods of solar thermal and biomass systems.
  lesson_learnt: Renewable heat business cases targeting small and medium industrial
    users must be structured to achieve payback periods under three years to be actionable;
    where this is not achievable, third-party financing or energy-as-a-service structures
    are required to shift the capital risk away from the industrial operator.
