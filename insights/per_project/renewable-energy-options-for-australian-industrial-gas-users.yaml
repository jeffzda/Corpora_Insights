  project_name: Renewable Energy Options for Australian Industrial Gas Users
  what_happened: Biomass boiler projects were found to be economically viable primarily
    where a zero- or negative-cost waste biomass resource was available on-site or
    within a few kilometres; projects relying on purchased biomass or long-distance
    transport of feedstock were generally uncompetitive with gas at 2014 prices.
  lesson_learnt: Biomass heat projects should only proceed where a co-located or very
    local waste feedstock stream is available at zero or near-zero cost; projects
    based on purchased pellets or long-haul feedstock supply will struggle to compete
    with gas unless gas prices rise substantially above $10/GJ.
