- record_id: ARENA-DLV-12002
  source_title: Renewable Energy Options for Australian Industrial Gas Users
  publish_date: 2015-09
  project_name: Renewable Energy Options for Australian Industrial Gas Users
  what_happened: The supply chain for solar thermal components above 100°C and for
    industrial biomass systems in Australia was found to be immature, with most equipment
    needing to be imported, limiting the ability of industrial gas users to procure
    and deploy renewable heat solutions.
  lesson_learnt: Projects deploying solar thermal concentrators or biomass boilers
    in Australia should anticipate long lead times and import logistics for equipment
    above 100°C; proponents should engage specialist international suppliers early
    and factor supply-chain development costs into project budgets.
