- record_id: ARENA-DLV-12014
  source_title: Renewable Energy Options for Australian Industrial Gas Users
  publish_date: 2015-09
  project_name: Renewable Energy Options for Australian Industrial Gas Users
  what_happened: Heat pump systems for industrial process heat below 100°C were found
    to be economically competitive with gas where the ratio of electricity cost to
    gas cost was sufficiently low (i.e. electricity price divided by COP was less
    than gas price divided by boiler efficiency), but the economics were extremely
    sensitive to this ratio and to COP uncertainty.
  lesson_learnt: 'Heat pump viability for industrial gas substitution should be assessed
    using the simple test: (electricity price $/GJ) / COP < (gas price $/GJ) / boiler
    efficiency; given COP uncertainty of ±20%, detailed site-specific measurement
    of available waste heat sources and achievable delivery temperatures is essential
    before committing capital.'
