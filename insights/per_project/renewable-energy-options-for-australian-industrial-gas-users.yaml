  source_title: Renewable Energy Options for Australian Industrial Gas Users
  publish_date: 2015-09
  project_name: Renewable Energy Options for Australian Industrial Gas Users
  what_happened: Standalone PV-powered heat pump systems were found to have significantly
    higher LCOEs than solar thermal systems at equivalent temperatures due to the
    low capacity factor of the PV array constraining heat pump utilisation, making
    them generally uncompetitive with solar thermal for industrial process heat applications.
  lesson_learnt: PV-driven heat pump systems are not competitive with solar thermal
    for industrial process heat applications unless the industrial site already has
    a large PV system planned for electricity supply or has simultaneous heating,
    cooling and electricity needs that justify the hybrid approach; grid-connected
    heat pumps with behind-the-meter PV are more economically attractive.
