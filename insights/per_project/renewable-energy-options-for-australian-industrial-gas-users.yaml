- record_id: ARENA-DLV-12005
  source_title: Renewable Energy Options for Australian Industrial Gas Users
  publish_date: 2015-09
  project_name: Renewable Energy Options for Australian Industrial Gas Users
  what_happened: Industrial gas users overwhelmingly cited business continuity and
    market risk as primary barriers to adopting renewable energy, citing examples
    such as a glass furnace failure costing $100 million and six months of downtime,
    and loss of supermarket shelf presence due to even brief supply interruptions.
  lesson_learnt: Renewable heat proposals for industrial gas users must explicitly
    address continuity of supply, including retaining existing gas capability as backup
    during and after commissioning; failure to demonstrate reliability equivalent
    to the gas-fired baseline will disqualify the proposal regardless of economic
    merit.
