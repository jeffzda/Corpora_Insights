- record_id: ARENA-DLV-12030
  source_title: Renewable Energy Options for Australian Industrial Gas Users
  publish_date: 2015-09
  project_name: Renewable Energy Options for Australian Industrial Gas Users
  what_happened: Solar thermal system cost and performance modelling revealed that
    the levelised cost of process heat was highly sensitive to the assumed operating
    temperature, with capital cost increasing approximately linearly with temperature
    and capacity factor dropping sharply above 200°C due to reduced collector efficiency,
    creating a compounding cost penalty at higher temperatures.
  lesson_learnt: Solar thermal system designers should investigate whether the actual
    end-use temperature of an industrial process is lower than the temperature of
    the steam/water working fluid currently produced by the gas boiler, as downsizing
    the target temperature can substantially reduce solar collector cost and improve
    LCOE; this analysis should be part of the initial feasibility screening.
