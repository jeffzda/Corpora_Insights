- record_id: ARENA-DLV-12026
  source_title: Renewable Energy Options for Australian Industrial Gas Users
  publish_date: 2015-09
  project_name: Renewable Energy Options for Australian Industrial Gas Users
  what_happened: Market support programs for solar water heaters in Australia resulted
    in rising installed costs rather than falling costs, in contrast to PV where prices
    fell sharply, illustrating that market support does not automatically drive cost
    reduction in industries with limited competition, skills constraints, or restrictive
    standards.
  lesson_learnt: Renewable heat market support programs should be designed with explicit
    cost-reduction mechanisms such as competitive procurement, technology-neutral
    standards review, and supply chain development funding; subsidising demand alone
    without addressing supply-side competition and capability can lock in high costs
    rather than reduce them.
