  what_happened: The study found that approximately 50–100 PJ per year of the 412
    PJ consumed by industrial gas users could be viably displaced by renewable energy
    technologies at 2014 gas prices, representing potential annual gas cost savings
    of $450–$900 million, but this potential was constrained by lack of awareness,
    immature supply chains, and high perceived technology risk.
  lesson_learnt: Government and industry programs targeting renewable heat should
    focus on improving market awareness through highly visible pilot installations,
    developing local supply chains, and introducing third-party financing models;
    without these enabling conditions the economically viable 50–100 PJ/year opportunity
    will remain largely unrealised.
