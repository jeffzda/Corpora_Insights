- record_id: ARENA-DLV-12003
  source_title: Renewable Energy Options for Australian Industrial Gas Users
  publish_date: 2015-09
  project_name: Renewable Energy Options for Australian Industrial Gas Users
  what_happened: Industrial gas users with block-tariff gas contracts found that partial
    renewable substitution reduced consumption into a lower-priced tariff block, making
    the marginal cost of remaining gas purchases lower and eroding the economic case
    for partial renewable displacement.
  lesson_learnt: 'Before investing in partial renewable heat substitution, industrial
    gas users should audit their gas tariff structure carefully: block-declining tariffs
    mean that reducing but not eliminating gas use may only displace the cheapest
    marginal units of gas, significantly reducing the financial return on the renewable
    investment.'
