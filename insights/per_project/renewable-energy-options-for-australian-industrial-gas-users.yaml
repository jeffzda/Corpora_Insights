- record_id: ARENA-DLV-12025
  source_title: Renewable Energy Options for Australian Industrial Gas Users
  publish_date: 2015-09
  project_name: Renewable Energy Options for Australian Industrial Gas Users
  what_happened: The California Solar Water Heating and Efficiency Act, which provided
    $34 million per year in commercial solar water heating grants starting in 2010,
    had achieved only 7% of its target of 22.6 million therms per year by 2013, partly
    due to a 20% fall in gas prices reducing the economic incentive and lower-than-projected
    falls in renewable system prices.
  lesson_learnt: Capital subsidy programs for industrial renewable heat are highly
    sensitive to gas price movements; program designers should build in price-responsive
    grant structures or technology-neutral support mechanisms rather than fixed dollar
    amounts, and should regularly review uptake targets against prevailing fuel price
    conditions.
