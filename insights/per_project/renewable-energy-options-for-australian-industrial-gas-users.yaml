  what_happened: The best solar resources in Australia (inland areas) were found to
    be in reverse spatial correlation with the concentration of industrial gas users
    (coastal and peri-urban), limiting the applicability of high-performance concentrating
    solar thermal systems for the majority of mass-market industrial gas users.
  lesson_learnt: Solar thermal project feasibility assessments for industrial gas
    users should account for the inverse relationship between solar resource and user
    location in Australia; coastal and peri-urban locations still have above-average
    solar resources by world standards and can support flat plate and evacuated tube
    systems, but concentrating systems are better suited to regional and inland users.
