  what_happened: Industrial gas users in the food and beverage sector, which accounted
    for 51% of mass-market gas consumption in Australia, used gas primarily at temperatures
    below 250°C (boiling, pasteurising, drying, CIP), making them the most technically
    and commercially suitable target for near-term solar thermal and biomass heat
    substitution.
