  what_happened: Highly detailed gas consumption data disaggregated by location, temperature
    of use, and industry sub-sector was found to be largely unavailable in Australia,
    limiting the precision with which renewable energy potential could be assessed
    and requiring significant assumptions and cross-referencing of multiple imperfect
    data sources.
  lesson_learnt: Future industrial renewable energy studies and investment programs
    would benefit substantially from improved mandatory reporting of gas consumption
    by temperature of use and process type under schemes such as NGERS; ARENA and
    government agencies should advocate for enhanced data collection to improve the
    quality of future feasibility assessments.
