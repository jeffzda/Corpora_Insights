- record_id: ARENA-DLV-12004
  source_title: Renewable Energy Options for Australian Industrial Gas Users
  publish_date: 2015-09
  project_name: Renewable Energy Options for Australian Industrial Gas Users
  what_happened: When industrial gas users reduced consumption under existing long-term
    gas contracts, contract provisions including take-or-pay clauses, price redetermination
    rights, and maximum daily quantity reductions exposed them to unfavourable contract
    renegotiation, potentially wiping out fuel cost savings from renewable substitution.
  lesson_learnt: Before implementing renewable heat solutions, industrial gas users
    must thoroughly review their gas supply contracts for take-or-pay, price redetermination,
    and maximum daily quantity clauses; legal and commercial advice should be sought
    to model the net contractual impact of reduced offtake before committing to renewable
    investment.
