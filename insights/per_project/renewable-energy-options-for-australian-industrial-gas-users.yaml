  what_happened: Australia had no established domestic supply chain for industrial
    wood pellets as at 2015, with only two early-stage pellet production facilities
    totalling 375,000 tonnes per year, both oriented toward export rather than domestic
    use, limiting biomass boiler deployment for industrial gas substitution.
  lesson_learnt: Biomass heat projects relying on wood pellets in Australia face significant
    supply chain risk given the absence of a domestic distribution network; project
    developers should assess proximity to the Albany or Queensland pellet facilities
    and model transport cost sensitivity, as delivered costs could add $0.3–$0.8/GJ
    per 15–70 km.
