- record_id: ARENA-DLV-12001
  source_title: Renewable Energy Options for Australian Industrial Gas Users
  publish_date: 2015-09
  project_name: Renewable Energy Options for Australian Industrial Gas Users
  what_happened: Industrial gas users in Australia demonstrated very high technical
    risk aversion toward renewable energy substitution, requiring 20–30 proven prior
    installations before considering adoption, and strongly preferring third-party
    energy-as-a-service models over owning and operating new technology.
  lesson_learnt: Renewable energy solution providers targeting industrial gas users
    must demonstrate a substantial track record of proven installations (stakeholders
    cited 20–30 worldwide) and should consider offering energy-as-a-service or leasing
    models to remove the capital and operational risk burden from the industrial user.
