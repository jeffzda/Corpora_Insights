- record_id: ARENA-DLV-12007
  source_title: Renewable Energy Options for Australian Industrial Gas Users
  publish_date: 2015-09
  project_name: Renewable Energy Options for Australian Industrial Gas Users
  what_happened: Solar thermal systems for process heat below approximately 150°C
    were found to be cost-competitive with gas at 2014–2015 prices across a broad
    range of system sizes and Australian locations, while systems above 250°C were
    not competitive even under projected higher gas prices.
  lesson_learnt: Investment cases for solar thermal industrial heat should be focused
    on applications below 150°C, particularly in locations with reasonable solar resources;
    applications above 250°C require further technology cost reductions and should
    not be pursued as near-term commercial investments without additional policy support.
