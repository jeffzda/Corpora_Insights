- record_id: ARENA-DLV-12028
  source_title: Renewable Energy Options for Australian Industrial Gas Users
  publish_date: 2015-09
  project_name: Renewable Energy Options for Australian Industrial Gas Users
  what_happened: Biomass gasification systems faced strict feedstock quality requirements
    (moisture content, particle size distribution) that limited fuel flexibility compared
    to combustion systems, and despite multiple demonstration plants globally for
    gas engine and turbine applications, no organisation had successfully commercialised
    this pathway over the preceding 20 years due to tar condensation and gas cleaning
    challenges.
  lesson_learnt: Project proponents considering biomass gasification for industrial
    gas substitution should treat it as a high-risk option for applications requiring
    clean syngas (e.g. gas engines or turbines); combustion systems are significantly
    more mature and flexible and should be the default choice unless a specific syngas
    application justifies the additional complexity and risk.
