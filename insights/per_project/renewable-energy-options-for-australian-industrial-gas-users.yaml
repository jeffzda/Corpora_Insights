- record_id: ARENA-DLV-12017
  source_title: Renewable Energy Options for Australian Industrial Gas Users
  publish_date: 2015-09
  project_name: Renewable Energy Options for Australian Industrial Gas Users
  what_happened: The majority of Australian industrial gas users (mass market customers)
    were found to pay gas prices significantly higher than wholesale due to distribution
    network charges, yet faced steeper renewable technology costs at smaller system
    sizes due to power-law capital cost scaling, meaning neither large nor small users
    had a clearly superior economic position for renewable investment.
  lesson_learnt: Economic screening tools for renewable heat should account for the
    combined effect of user-size-dependent gas prices (higher for small users) and
    size-dependent renewable capital costs (also higher for small users on a per-unit
    basis); these effects broadly offset each other and no single user size category
    has a structural advantage without site-specific analysis.
