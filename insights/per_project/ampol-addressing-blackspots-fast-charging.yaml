  source_title: Addressing Black Spots Fast Charging Program Lessons Learnt
  publish_date: 2022-03
  project_name: Addressing Black Spots Fast Charging Program
  what_happened: Site selection for fast charging stations required understanding
    network capacity constraints early, as sites that appeared commercially viable
    were later found to have insufficient network capacity to support fast chargers,
    requiring rework of the site selection process.
  lesson_learnt: Engage network providers at the outset of site selection — before
    commercial screening is finalised — to determine available network capacity and
    avoid investing in sites that cannot be practically connected without costly augmentation.
