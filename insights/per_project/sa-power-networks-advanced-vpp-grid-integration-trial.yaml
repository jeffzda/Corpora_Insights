- record_id: ARENA-DLV-46603
  source_title: 'DEIP Dynamic Operating Envelopes Workstream: Outcomes Report'
  publish_date: 2022-03
  project_name: SA Power Networks Advanced VPP Grid Integration Trial
  what_happened: The SAPN Advanced VPP Grid Integration Trial (2019–2021) implemented a simplified IEEE 2030.5 'lite' API — not the full CSIP standard — to exchange real-time network constraint data with
    the Tesla SA VPP, demonstrating that time-varying and locational export limits could enable DER to be hosted at higher penetration levels, particularly distributed storage conducting arbitrage.
  lesson_learnt: A simplified, pragmatic API implementation can be sufficient for a first DOE trial and generate valuable proof-of-concept data; knowledge gained from such an interim standard should be
    systematically transferred into the emerging national standard (as SAPN's learnings were incorporated into CSIP-AUS) to avoid stranded technical investment.
