  evidence_excerpt: Lengthy, expensive customer acquisition processes were identified
    as a recurring theme through almost most C&I, EV and residential projects reviewed
    in this study. There were common reports of long lead times, multiple site visits
    and bespoke negotiations. Demand flexibility requires a 'long and technical sales
    cycle' with 'extensive customer education and lengthy approvals associated with
    a 'novel' program. Customer acquisition was nominated as the 'major cost' of demand
    flexibility by a leading provider.
