- record_id: ARENA-DLV-53865
  source_title: Demand Flexibility Portfolio Retrospective Analysis Report
  publish_date: 2023-07
  project_name: ARENA Demand Flexibility Portfolio — C&I and Residential Projects
    (multiple)
  what_happened: Customer acquisition was consistently identified as the major cost
    of demand flexibility programs across nearly all C&I, EV, and residential projects,
    characterised by long lead times, multiple site visits, bespoke negotiations,
    and extensive customer education requirements for what participants perceived
    as a novel and complex program.
  lesson_learnt: Customer acquisition costs must be treated as the primary cost driver
    in demand flexibility program design — not a secondary consideration; programs
    should front-load incentives, simplify sign-up processes, digitise sales interactions,
    and budget acquisition costs as a central line item before sizing pilot ambitions.
