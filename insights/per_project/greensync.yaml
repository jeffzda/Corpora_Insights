- record_id: ARENA-DLV-1805
  source_title: ARENA Insights Forum November 2018 DER Summary
  publish_date: 2019-04
  project_name: GreenSync
  what_happened: GreenSync, an Australian energy-tech start-up, identified that smaller
    companies lack the resources to participate in extended multi-year policy consultation
    processes, meaning start-up perspectives and innovations are systematically underrepresented
    in energy policy development.
  lesson_learnt: Policy consultation and programme design processes that run over
    multi-year horizons structurally exclude smaller start-ups who cannot sustain
    participation; ARENA and industry bodies should provide targeted, time-efficient
    engagement mechanisms to ensure small innovators can contribute to policy shaping.
