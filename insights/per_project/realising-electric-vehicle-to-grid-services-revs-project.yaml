  what_happened: Increasing charger capacity from 7 kW to 15 kW in modelling raised
    the estimated 60-second raise FCAS revenue per vehicle from approximately $2,600
    to $5,604, demonstrating a strong relationship between charger power rating and
    FCAS revenue potential.
  lesson_learnt: Charger power rating is a key design lever for V2G FCAS business
    cases — upgrading from 7 kW to 15 kW AC chargers more than doubles modelled 60-second
    contingency raise revenue per vehicle and should be evaluated as a cost-effective
    investment for fleet operators targeting FCAS markets.
