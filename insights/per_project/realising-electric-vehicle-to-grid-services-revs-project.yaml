- record_id: ARENA-DLV-51562
  source_title: ARENA - Vehicle to Grid - Insights Final Report
  publish_date: 2024-02
  project_name: Realising Electric Vehicle-to-Grid Services (REVS) Project
  what_happened: The regulation FCAS market offered the highest potential revenue
    per vehicle (up to ~$12,000 raise, ~$9,000 lower) but was excluded from the trial
    due to concerns that frequent charge/discharge cycling would accelerate battery
    degradation and reduce the viability of the use case.
  lesson_learnt: Regulation FCAS participation by EVs should be approached with caution
    and supported by battery degradation modelling before inclusion in a V2G business
    case — the revenue ceiling is attractive but the cycling impact is a material
    risk that could erode net returns, particularly as V2G market saturation increases.
