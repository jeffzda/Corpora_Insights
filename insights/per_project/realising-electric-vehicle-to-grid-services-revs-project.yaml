- record_id: ARENA-DLV-51561
  source_title: ARENA - Vehicle to Grid - Insights Final Report
  publish_date: 2024-02
  project_name: Realising Electric Vehicle-to-Grid Services (REVS) Project
  what_happened: During peak charging periods, average charger power was approximately
    5.5 kW rather than the 7 kW maximum, because vehicle battery management systems
    reduced charging rates when SOC fell outside the 20–80% range, and many vehicles
    arrived with high SOC due to limited daily driving.
  lesson_learnt: V2G capacity modelling should not assume chargers operate at rated
    power — EV battery management systems constrain charge rates at high and low SOC,
    and fleets with limited daily mileage will systematically under-utilise charger
    capacity, reducing effective FCAS bid capacity.
