  source_title: ARENA - Vehicle to Grid - Insights Final Report
  publish_date: 2024-02
  project_name: Realising Electric Vehicle-to-Grid Services (REVS) Project
  what_happened: Future growth in V2G adoption could saturate the FCAS market with
    available capacity from EV batteries and other consumer energy resources, potentially
    depressing FCAS prices and reducing the revenue case for EV owners, particularly
    in the context of increased battery wear.
  lesson_learnt: V2G FCAS business cases should be stress-tested against market saturation
    scenarios — as V2G scales, FCAS prices may fall materially, and fleet operators
    who adopted V2G on the basis of 2022 revenue levels may face eroded returns, particularly
    in the regulation market where battery wear is also a concern.
