  source_title: ARENA - Vehicle to Grid - Insights Final Report
  publish_date: 2024-02
  project_name: Realising Electric Vehicle-to-Grid Services (REVS) Project
  what_happened: Total energy discharged from trial vehicles over the full year was
    only 0.146 MWh, representing approximately 0.79% of the 18.4 MWh imported for
    charging, confirming that contingency FCAS events drew minimally on vehicle batteries.
