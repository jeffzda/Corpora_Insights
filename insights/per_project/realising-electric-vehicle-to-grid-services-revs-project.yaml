- record_id: ARENA-DLV-51558
  source_title: ARENA - Vehicle to Grid - Insights Final Report
  publish_date: 2024-02
  project_name: Realising Electric Vehicle-to-Grid Services (REVS) Project
  what_happened: Behind-the-meter V2G technology was legally prohibited from participating
    in the 6-second contingency FCAS market during the trial period due to ramping
    constraints in AS/NZS 4777.2:2020, despite EVs being technically capable of the
    required response times.
  lesson_learnt: Regulatory standards constraining behind-the-meter inverter ramping
    rates represent a binding ceiling on V2G revenue potential — proponents should
    engage with standards bodies early to flag V2G-specific constraints in AS/NZS
    4777.2 and advocate for targeted amendments before project design is finalised.
