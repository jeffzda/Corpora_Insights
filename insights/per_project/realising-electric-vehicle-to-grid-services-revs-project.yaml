- record_id: ARENA-DLV-51555
  source_title: ARENA - Vehicle to Grid - Insights Final Report
  publish_date: 2024-02
  project_name: Realising Electric Vehicle-to-Grid Services (REVS) Project
  what_happened: More than half of discharging sessions commenced when vehicle state
    of charge was above 90%, meaning vehicles were often fully charged when FCAS raise
    services were needed, with limited headroom to absorb energy for FCAS lower participation.
  lesson_learnt: Implement active SOC management to cap charging below 96% for FCAS
    lower market participation — vehicles arriving fully charged have no spare capacity
    to absorb, eliminating revenue potential from the lower frequency market unless
    charging behaviour is actively managed.
