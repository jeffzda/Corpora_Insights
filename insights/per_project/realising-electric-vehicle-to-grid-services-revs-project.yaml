  source_title: ARENA - Vehicle to Grid - Insights Final Report
  publish_date: 2024-02
  project_name: Realising Electric Vehicle-to-Grid Services (REVS) Project
  what_happened: Of 51 chargers deployed across 11 sites, data was available for only
    38 chargers and discharge data for only 29, due to installation delays and progressive
    commissioning throughout 2022 that left many chargers recording data for only
    a few months.
  lesson_learnt: Plan charger installation timelines to allow a full data-collection
    period before trial end — staggered commissioning across a year-long trial substantially
    reduced the dataset and reliability of discharge behaviour insights.
