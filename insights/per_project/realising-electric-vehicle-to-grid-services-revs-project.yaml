- record_id: ARENA-DLV-51554
  source_title: ARENA - Vehicle to Grid - Insights Final Report
  publish_date: 2024-02
  project_name: Realising Electric Vehicle-to-Grid Services (REVS) Project
  what_happened: Trial data was recorded only when vehicles were actively charging
    or discharging, meaning the system could not distinguish between vehicles that
    were unplugged and those that were connected but idle, creating a gap in availability
    data.
  lesson_learnt: Instrument V2G trials to capture plug-in state continuously, not
    only during active charge or discharge events — the inability to distinguish idle-connected
    from unplugged vehicles creates a material gap in availability data needed for
    FCAS capacity modelling.
