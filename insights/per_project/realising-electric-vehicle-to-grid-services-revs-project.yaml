  project_name: Realising Electric Vehicle-to-Grid Services (REVS) Project
  what_happened: The REVS project was the first instance of a vehicle fleet supplying
    FCAS to the NEM. Trial analysis showed that a vehicle participating in the NSW
    FCAS raise regulation market could have earned approximately $12,000 in 2022,
