  publish_date: 2024-02
  project_name: Realising Electric Vehicle-to-Grid Services (REVS) Project
  what_happened: Low-voltage (LV) embedded generator sites required additional grid
    protection and load balancing measures compared to micro-generator sites, creating
    further delays to data collection and complicating charger installation at those
    buildings.
