  source_title: ARENA - Vehicle to Grid - Insights Final Report
  publish_date: 2024-02
  project_name: Realising Electric Vehicle-to-Grid Services (REVS) Project
  what_happened: Only 22 of 51 trial vehicles participated in the booking system,
    and average vehicle usage among those was only 12%, requiring a significant amount
    of estimation of vehicle availability for FCAS capacity modelling.
