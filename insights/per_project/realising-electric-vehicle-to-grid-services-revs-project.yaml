- record_id: ARENA-DLV-51559
  source_title: ARENA - Vehicle to Grid - Insights Final Report
  publish_date: 2024-02
  project_name: Realising Electric Vehicle-to-Grid Services (REVS) Project
  what_happened: FCAS grid events were most frequent between 2pm and 5pm on weekdays,
    but trial commercial vehicles were in heaviest use during standard business hours
    (8am–5pm), creating a misalignment between peak grid service demand and peak vehicle
    availability for FCAS raise services.
  lesson_learnt: Commercial fleet V2G projects targeting FCAS raise services face
    a structural availability conflict during business hours — project design should
    target fleet segments with after-hours or non-standard operating patterns, or
    implement incentive structures that align vehicle return times with peak FCAS
    price windows.
