- record_id: ARENA-DLV-45507
  source_title: ARENA Insights Forum Presentation Summaries & Key Points – DER Stream
  publish_date: 2019-06
  project_name: VPP Industry – General (ARENA Insights Forum DER Stream)
  what_happened: Across multiple VPP projects presented at the forum, communication
    barriers between retailers, installers, and customers were identified as a persistent
    major challenge, particularly in explaining how VPPs add value to pre-existing
    rooftop PV systems.
  lesson_learnt: Develop clear, targeted communication strategies for each stakeholder
    group — installers, retailers, and customers — before commencing VPP sales and
    installation, as communication failures at any link in this chain undermine customer
    trust and program participation.
