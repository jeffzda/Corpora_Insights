- record_id: ARENA-DLV-45508
  source_title: ARENA Insights Forum Presentation Summaries & Key Points – DER Stream
  publish_date: 2019-06
  project_name: VPP Industry – General (ARENA Insights Forum DER Stream)
  what_happened: Panel discussion at the forum identified that installers, as the
    most frequent household contact point, play a critical intermediary role between
    networks, retailers, and customers, and that poor installation processes directly
    erode customer trust in VPPs.
  lesson_learnt: Invest in installer training and process standardisation — installers
    are the primary trust-building touchpoint with customers, and unreliable installation
    experiences create lasting negative perceptions of VPP participation that are
    difficult to reverse.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: construction/installation
