- record_id: ARENA-DLV-46502
  source_title: Launch of a Photothermal Absorption Spectrometer for Cost Reduction
    in Photovoltaic Materials Lessons Learnt
  publish_date: null
  project_name: Launch of a Photothermal Absorption Spectrometer for Cost Reduction
    in Photovoltaic Materials
  what_happened: The team discovered the Australian Postgraduate Research Intern (APR.Intern)
    program — which would have allowed a PhD student to explore medical/diagnostic
    applications of the AURA PDS in parallel — only after most of the project had
    concluded, precluding a simultaneous second application stream.
  lesson_learnt: Before commencing a research commercialisation project, systematically
    survey all available government and institutional support programs (including
    PhD internship schemes such as APR.Intern) — discovering this program late meant
    a parallel application-development stream could not be pursued, reducing the breadth
    of commercial outcomes achievable within the project timeline.
  issue_severity: minor
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: concept/feasibility
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: poor scoping
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: Team identified APR.Intern as a mechanism to recruit a PhD student
    to explore the medical diagnostics application going forward, intending to act
    on this post-project.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id002
  - 7
  evidence_excerpt: Our key learning from this would be to discover it sooner. Had
    we known about this program earlier we could have two streams of potential applications
    running alongside one another.
  confidence_note: lifecycle_phase set to concept/feasibility because the missed action
    should have occurred at project inception; the document frames it as an upfront
    research gap.
