- record_id: ARENA-DLV-46501
  source_title: Launch of a Photothermal Absorption Spectrometer for Cost Reduction
    in Photovoltaic Materials Lessons Learnt
  publish_date: null
  project_name: Launch of a Photothermal Absorption Spectrometer for Cost Reduction
    in Photovoltaic Materials
  what_happened: The project team at Open Instruments/UNSW did not engage with startup
    incubator programs (such as UNSW Founders Program, Cicada Innovations, MTPConnect)
    until mid-to-late in the project, missing earlier networking, mentorship, and
    application-diversification opportunities.
  lesson_learnt: Research and engage with startup incubator programs (e.g. university
    entrepreneurship programs, innovation hubs, industry connector organisations)
    at the outset of a commercialisation project — late engagement meant networking
    links and new application streams (including a medical diagnostics avenue) were
    identified only near project end rather than being developed in parallel.
