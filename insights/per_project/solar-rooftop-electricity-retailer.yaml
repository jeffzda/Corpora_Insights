- record_id: ARENA-DLV-55105
  source_title: 'DC Solar Rooftop Electricity Retailer Report #2'
  publish_date: 2019-02
  project_name: DC Power Co Solar-Focused Energy Retail Business
  what_happened: Broad market changes — including Alinta's entry into Queensland and
    Victoria with very low retail prices and new AEMC regulatory requirements obliging
    retailers to warn customers of price changes — substantially worsened the competitive
    environment for DC Power Co's initial retail offering in the months before and
    after its launch.
  lesson_learnt: New entrant energy retailers should monitor and stress-test their
    business model against plausible regulatory and competitive market changes during
    the development phase — external market shifts can negate a value proposition
    that appeared viable at the time of design.
