- record_id: ARENA-DLV-55106
  source_title: 'DC Solar Rooftop Electricity Retailer Report #2'
  publish_date: 2019-02
  project_name: DC Power Co Solar-Focused Energy Retail Business
  what_happened: DC Power Co evaluated three paths to establishing a retail business
    (obtaining licences, merging with an existing retailer, and white-labelling) and
    selected white-labelling. Obtaining a retail licence, particularly in Victoria
    via the Essential Services Commission, was assessed as too protracted and uncertain
    for a new entrant to bear.
  lesson_learnt: For an innovative new entrant energy retailer without an established
    balance sheet, white-labelling via an existing licensed retailer is a faster and
    lower-risk path to market than pursuing a retail licence — the Victorian licensing
    process in particular was assessed as protracted and highly uncertain.
