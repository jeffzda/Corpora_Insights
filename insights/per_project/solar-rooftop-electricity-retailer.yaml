  publish_date: 2019-02
  project_name: DC Power Co Solar-Focused Energy Retail Business
  what_happened: Between April and August 2018, DC Power Co was unable to access CSF
    funds due to restrictions within the ARENA Funding Agreement, resulting in an
    inability to commit to office leases, no spend on marketing or communications,
    failure to deliver promised investor energy insights, and delays in recruiting
    key hires.
  lesson_learnt: Ensure funding agreement terms permit timely drawdown of capital
    after a successful CSF campaign — restrictions that prevent access to raised funds
    in the immediate post-campaign period will stall all downstream activities including
    staffing, marketing, and product delivery.
