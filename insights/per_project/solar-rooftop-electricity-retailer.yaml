- record_id: ARENA-DLV-55103
  source_title: 'DC Solar Rooftop Electricity Retailer Report #2'
  publish_date: 2019-02
  project_name: DC Power Co Solar-Focused Energy Retail Business
  what_happened: DC Power Co's initial retail price offering exceeded the sharpest
    market prices because its small, solar-focused customer portfolio resulted in
    a relatively expensive hedged electricity price input compared to incumbent gentailers,
    and its market entry coincided with the high point of the annual retail price
    curve.
  lesson_learnt: A new solar-focused retailer entering the market with a small customer
    portfolio should anticipate an uncompetitive cost-to-serve position relative to
    gentailers and either time market entry away from the annual price peak or build
    in a non-price value proposition strong enough to offset the price disadvantage
    from day one.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: project developer
  delay_category: null
  failure_mode: commercial & market
  outcome_class: partial success
  secondary_failure_mode: null
  intervention_note: DC Power Co set a transparent fixed feed-in-tariff of 15c/kWh
    and a fixed $10/month service charge to differentiate on simplicity and fairness
    rather than competing directly on headline price.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id003
  - 4
  - 5
  evidence_excerpt: This presented a challenge for DC Power Co, as it was unlikely
    to be able to offer lowest retail prices from the outset, while its customer portfolio
    was small and solar focussed resulting in a relatively expensive hedged electricity
    price input versus incumbent retailers. This is a common problem for new retailers
    as they enter the market. DC Power Co was further hampered in this regard by the
    timing of its market entry, which was at the high point of the annual retail price
    curve.
