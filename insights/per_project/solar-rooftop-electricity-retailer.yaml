  evidence_excerpt: In August 2017, Alinta entered into a joint venture with CS Energy
    to enter the South East Queensland retail electricity market, and then in January
    2018 Alinta acquired Loy Yang B in Victoria... The presence of such low prices,
    particularly in Victoria, made the price competitiveness of DC Power Co's initial
    retail offering more challenging... In September 2018, the AEMC made a rule change
    obliging retailers to warn customers prior to energy price changes, while the
    Victorian government offered consumers $50 simply to visit a price comparator
