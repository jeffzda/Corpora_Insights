  project_name: DEIP DER Market Integration Trials (portfolio-level finding)
  what_happened: The report identified that many functions being tested by the DER
    market integration trials must go through regulatory pathways before commercial
    implementation, but that some trials were not adequately designed to generate
    evidence that would inform or satisfy those specific regulatory pathways, risking
    that trial learnings could not be directly applied to advance reforms.
  lesson_learnt: Design DER trials from the outset with explicit mapping to the regulatory
    reform pathways their outcomes will need to traverse — engaging market bodies
    early to identify specific evidence gaps in reform processes ensures trial learnings
    are directly usable, rather than generating findings that cannot be implemented
    due to unresolved regulatory feasibility.
