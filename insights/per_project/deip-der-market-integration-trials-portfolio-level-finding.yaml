- record_id: ARENA-DLV-50578
  source_title: DEIP Market Integration Trials Summary Report 1.0
  publish_date: 2022-09
  project_name: DEIP DER Market Integration Trials (portfolio-level finding)
  what_happened: The report identified that managing potential capacity conflicts
    between market services and network services — where the same DER fleet could
    be simultaneously dispatched for incompatible services — is a systemic challenge
    requiring structural solutions such as time separation of procurement, single-entity
    dispatch, or pre-agreed priority hierarchies.
  lesson_learnt: Before enrolling a DER fleet in both network support and wholesale
    market services, establish a documented capacity conflict resolution mechanism
    agreed by all parties — options include maintaining time separation between service
    procurement, routing all dispatch through a single coordinating entity, or defining
    contractual service priority hierarchies.
