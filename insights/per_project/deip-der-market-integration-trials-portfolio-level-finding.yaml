  what_happened: The report found that social science research in trials was typically
    used to understand consumer experience retrospectively through interviews with
    participants, but that more proactive social science and consumer research techniques
    (e.g. experimental design, conjoint analysis) could test and identify optimal
    consumer product designs faster and at lower cost than multi-year in-field deployments.
  lesson_learnt: Integrate active social science research methods — such as experimental
    consumer studies and choice modelling — into trial design before field deployment
    rather than relying solely on post-deployment interviews; these techniques can
    identify optimal information formats, value propositions, and product attributes
    in months rather than years and at a fraction of the cost of in-field iteration.
