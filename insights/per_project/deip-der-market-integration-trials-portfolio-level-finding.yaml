- record_id: ARENA-DLV-50577
  source_title: DEIP Market Integration Trials Summary Report 1.0
  publish_date: 2022-09
  project_name: DEIP DER Market Integration Trials (portfolio-level finding)
  what_happened: 'The report identified that sub-metering is a systemic barrier to
    DER market participation: at sites where active DER (e.g. batteries) co-exist
    with passive loads, energy flows at the connection point combine both, making
    it difficult to reliably deliver accurate market responses. The Flexible Trading
    Arrangements rule change was proposed to address this by allowing active DER to
    be metered separately.'
  lesson_learnt: At sites with both active DER and uncontrolled loads, connection-point
    metering alone will prevent accurate market participation — DER market integration
    programs should either require sub-metering as a condition of participation or
    engage with the FTA regulatory pathway before assuming connection-point bids are
    feasible.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: network business
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: null
  transferability: broad
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id008
  - 11
  evidence_excerpt: 'Sub-Metering: Many commercial and residential settings host both
    active DER that can reliably respond to market signals, as well as passive loads.
    This means that energy flows at the connection point are a combination of both
    active DER and passive loads, making it difficult to reliably deliver an accurate
