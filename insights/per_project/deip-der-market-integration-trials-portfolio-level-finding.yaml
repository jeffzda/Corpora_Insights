- record_id: ARENA-DLV-50575
  source_title: DEIP Market Integration Trials Summary Report 1.0
  publish_date: 2022-09
  project_name: DEIP DER Market Integration Trials (portfolio-level finding)
  what_happened: The report found that dynamic operating envelopes (DOEs) involve
    an inherent trade-off between simpler uniform envelopes — which are fairer and
    cheaper to implement — and more sophisticated envelopes based on inverter size,
    forecast exports, or bid cost, which are more efficient in aggregate but create
    equity concerns among DER owners.
  lesson_learnt: When designing DOE allocation methodologies for DER integration programs,
    explicitly resolve the fairness-versus-efficiency trade-off in the program design
    phase and communicate the chosen approach to consumers before deployment — equity
    concerns about differentiated envelopes will create consumer dissatisfaction and
    trust issues if not addressed proactively.
