- record_id: ARENA-DLV-13353
  source_title: Module Design for Lowering Field Operating Temperature Project Results
  publish_date: 2021-03
  project_name: Module Design for Lowering Field Operating Temperature and Improved
    Yield Study
  what_happened: The desktop modelling study successfully scoped and prioritised module
    cooling technologies — identifying vortex generators and glass texturing as the
    leading approaches — before any field testing was conducted, and directly enabled
    a second experimental stage of work to be designed and funded.
  lesson_learnt: Desktop studies are an effective and low-cost way to filter and prioritise
    technology options before committing to expensive field trials; modelling first
    to identify the most promising approaches focuses experimental scope and reduces
    the risk of investing in field tests for approaches with limited potential.
  issue_severity: none
  project_type: null
  project_scale_band: lab/bench
  lifecycle_phase: concept/feasibility
  proponent_type: research organisation/university
