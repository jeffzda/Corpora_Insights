  project_name: Module Design for Lowering Field Operating Temperature and Improved
    Yield Study
  what_happened: A desktop modelling study at UNSW was initiated after cross-sector
    interest emerged at an industry forum, but the team reflected that they could
    have acted sooner on that interest to accelerate effort and outcomes.
  lesson_learnt: Initiate programs of work with a desktop study early — cross-sector
    interest generated at an industry forum motivated greater investment, but acting
    sooner on that signal could have accelerated both outcomes and industry engagement.
    Consider desktop studies as a deliberate first step to frame research questions
    and attract ARENA and industry co-investment.
