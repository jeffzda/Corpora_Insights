- record_id: ARENA-DLV-13352
  source_title: Module Design for Lowering Field Operating Temperature Project Results
  publish_date: 2021-03
  project_name: Module Design for Lowering Field Operating Temperature and Improved
    Yield Study
  what_happened: When scaling the vortex generator simulation from a sub-module 'slice'
    to a full-size module, lateral flow effects that could reduce cooling effectiveness
    were identified — these had not been anticipated in the initial stage of the research
    and required development of a new simulation method to manage the increased computational
    demands.
  lesson_learnt: When modelling module-level thermal or fluid-dynamic effects, validate
    sub-module slice simulations against full-size module simulations before drawing
    conclusions — lateral flow at full scale can materially affect results and may
    require a distinct simulation methodology.
  issue_severity: minor
  project_type: null
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: A new simulation method was developed in the second stage of
    the desktop study to manage the computational demands for a full-size module,
    confirming a 2–3°C cooling benefit from vortex generators.
  transferability: narrow
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id002
  - 5
  evidence_excerpt: Simulating a full-size module allows for lateral flow which could
    reduce the effectiveness of vortex generators. This was not anticipated in the
    initial stage of the research which only investigated a 'slice' of the module
    (sub-module). A new simulation method was developed in the second stage of the
    desktop study to manage the computational demands the for a full-size module.
  confidence_note: delay_category of data/validation/testing is used here as the issue
    arose during modelling/testing work; this is a technical research finding rather
