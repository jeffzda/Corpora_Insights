- record_id: ARENA-DLV-9135
  source_title: State of DER Technology Integration Report
  publish_date: 2021-02
  project_name: Expanded Network Visibility Initiative (ENVI)
  what_happened: The ENVI project demonstrated that widespread adoption of offline distribution system state estimation (DSSE) faces no technology barriers, but does require changes to internal IT systems,
    data quality reviews, and modifications to internal DNSP processes. Real-time DSSE adoption is constrained by the limited availability of real-time field device data, as existing devices and communications
    were not established with real-time requirements in mind.
  lesson_learnt: DSSE is technically ready for BAU adoption by DNSPs but its deployment is gated by internal IT and process readiness rather than technology maturity — projects seeking to scale up network
    visibility should include dedicated IT integration and data quality workstreams, and should plan for real-time deployment to follow offline deployment as a second phase once data infrastructure is upgraded.
