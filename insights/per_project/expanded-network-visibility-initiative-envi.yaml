  evidence_excerpt: The progress so far has made it clear that there is no barrier to widespread adoption of offline DSSE, but that this requires changes to internal IT systems, data quality reviews and,
    modifications to internal processes. The DSSE functions equally as well on real-time data but the availability of real-time data state-wide is more limited as existing field devices, communications
    and data retrieval processes were not established with this real-time capability as a requirement.
