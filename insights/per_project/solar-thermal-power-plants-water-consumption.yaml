- record_id: ARENA-DLV-72026
  source_title: Australian Energy Resource Assessment – Second edition, 2014
  publish_date: '2014'
  project_name: Solar Thermal Power Plants (Water Consumption)
  what_happened: Solar thermal electricity generation plants using wet-cooling towers
    require significant water for steam condensation and mirror washing, creating
    a resource conflict in Australia's arid high-insolation regions where the best
    solar resources coincide with water scarcity. Dry cooling is available but reduces
    steam cycle efficiency by approximately 10 per cent.
  lesson_learnt: Solar thermal project developers in arid locations must account for
    water availability constraints at the site-selection stage — the efficiency penalty
    of dry cooling (~10%) should be explicitly modelled in LCOE projections, and projects
    in water-scarce regions should default to dry-cooling design assumptions rather
    than treating water as a free input.
  issue_severity: moderate
  project_type: generation
  project_scale_band: utility/large-scale
  lifecycle_phase: development/design
  proponent_type: project developer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Dry cooling towers can eliminate most water consumption, though
    at an approximately 10 per cent efficiency penalty; advanced Brayton thermodynamic
    cycles using point-focus technologies offer a water-free alternative under development.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar thermal
