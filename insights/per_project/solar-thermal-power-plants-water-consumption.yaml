  evidence_excerpt: Most solar thermal electricity generation systems require water
    for steam production and this water use affects the efficiency of the system...
    It is possible to use 'dry cooling' towers, which eliminate most of the water
    consumption, but this reduces the efficiency of the steam cycle by approximately
    10 per cent.
