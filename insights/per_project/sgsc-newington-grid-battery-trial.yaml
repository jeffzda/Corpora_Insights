  publish_date: '2015'
  project_name: 'SGSC: Newington Grid Battery Trial'
  what_happened: The Ausgrid Newington grid battery trial commenced in October 2013
    as a follow-on from the Smart Grid Smart City project, which had experienced difficulties
    securing a suitable site location within its project timeframe, causing the battery
    trial component to be separated into a standalone project.
  lesson_learnt: Securing suitable site locations for grid-connected battery trials
    should be resolved early in project planning — the SGSC program's inability to
    secure a site within its timeframe required a separate follow-on project, adding
    project management overhead and deferring findings.
