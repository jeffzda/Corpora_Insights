  source_title: Market Analysis of Opportunities in Australia for Anaerobic Digestion
    Deployment
  publish_date: 2017-11
  project_name: Goulburn Bioenergy Project
  what_happened: With a limited number of AD projects installed in Australia as at
    2017, the supply chain for covered anaerobic lagoon and biogas cogeneration systems
    lacked depth and confidence, contributing to higher capital costs and limiting
    the market's ability to drive down costs through competition and volume.
  lesson_learnt: Building supply chain depth and contractor confidence is a prerequisite
    for cost reduction in the Australian biogas market — early projects should document
    and share detailed capital cost data, and developers should invest in supplier
    development to create a competitive tender market rather than relying on single-source
    procurement.
