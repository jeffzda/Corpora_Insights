- record_id: ARENA-DLV-17805
  source_title: Market Analysis of Opportunities in Australia for Anaerobic Digestion
    Deployment
  publish_date: 2017-11
  project_name: Goulburn Bioenergy Project
  what_happened: Anaerobic digestion projects at egg farms and chicken broiler farms
    lacked approved Emissions Reduction Fund (ERF) methodologies as at 2017, preventing
    these projects from generating Australian Carbon Credit Units (ACCUs) and materially
    weakening their business cases — no AD projects had been deployed at broiler operations,
    and only one at an egg farm.
  lesson_learnt: Before committing to an anaerobic digestion project at egg farms
    or broiler operations, confirm whether an ERF methodology covering the relevant
    waste stream has been gazetted — without ACCU revenue, the business case may not
    stack up at commercially deployable scale; monitor ERF methodology development
    as a trigger for market entry.
