- record_id: ARENA-DLV-17813
  source_title: Market Analysis of Opportunities in Australia for Anaerobic Digestion
    Deployment
  publish_date: 2017-11
  project_name: Goulburn Bioenergy Project
  what_happened: The Goulburn Bioenergy Project was designed to demonstrate dual-fuelling
    of a biogas engine with both biogas and mains gas, providing redundancy so the
    site could maintain power supply during periods of low biogas production or grid
    outages — directly addressing energy security concerns prevalent among agribusinesses
    at fringe-of-grid locations.
  lesson_learnt: Industrial biogas projects in Australia typically require stacking
    multiple revenue and support mechanisms — LGCs, ACCUs, and a long-term energy
    offtake — to be financially viable; the ARENA grant was the catalyst that enabled
    the project to proceed, suggesting that without concessional capital grant support,
    the project economics would not have cleared investment hurdles.
