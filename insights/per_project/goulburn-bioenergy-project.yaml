- record_id: ARENA-DLV-17826
  source_title: Market Analysis of Opportunities in Australia for Anaerobic Digestion
    Deployment
  publish_date: 2017-11
  project_name: Goulburn Bioenergy Project
  what_happened: Piggeries with low on-site electricity loads had a significant proportion
    of potential biogas electricity output available for grid export, but this export
    revenue was uncertain because the network operator's willingness to accept export
    and the commercial terms from retailers were both unpredictable, making it difficult
    to underwrite the export revenue stream in project finance.
  lesson_learnt: For biogas projects at low-electricity-load sites (e.g. piggeries),
    treat grid export revenue as contingent rather than base-case — structure project
    finance to be viable without export revenue, and treat export as upside to be
    unlocked after network and retail agreements are secured; failure to do so risks
    project viability if either approval is refused.
