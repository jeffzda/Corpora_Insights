  publish_date: 2017-11
  project_name: Goulburn Bioenergy Project
  what_happened: Geotechnical conditions — specifically high water tables and poor
    soil/rock conditions — constrained the maximum lagoon depth for covered anaerobic
    lagoon designs, requiring geotextile fabric liner protection in some soil types,
    adding cost and design complexity not present in standard CAL benchmarks.
  lesson_learnt: Commission a geotechnical investigation before finalising covered
    anaerobic lagoon sizing and cost estimates — water table depth determines maximum
    lagoon depth and therefore total footprint, and unexpected rock conditions or
    high water tables can add significant cost to liner installation that will not
    be captured in published reference-class cost data.
