  publish_date: 2017-11
  project_name: Goulburn Bioenergy Project
  what_happened: 'Exporting surplus biogas electricity to the grid from agribusiness
    sites (particularly piggeries with low on-site load) required clearing two sequential
    approval hurdles: first obtaining network operator approval, then separately reaching
    a commercial agreement with a retailer to be paid for the exported energy.'
  lesson_learnt: Project developers should not assume grid export revenue is readily
    accessible — plan for two distinct approval processes (network connection and
    retail offtake agreement) and assess early whether the network operator in the
    relevant jurisdiction imposes restrictive export limits that could undermine the
    business case.
