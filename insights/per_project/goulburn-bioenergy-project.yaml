  publish_date: 2017-11
  project_name: Goulburn Bioenergy Project
  what_happened: Network energy charges for large agribusiness electricity users varied
    from less than 1 c/kWh (Energex, QLD) to almost 5 c/kWh (SA Power Networks), and
    network demand charges and tariff structures varied so substantially across jurisdictions
    that the financial benefit of on-site biogas generation could differ dramatically
    between otherwise similar projects in different states.
  lesson_learnt: Biogas project financial models must use site-specific network tariff
    data rather than national averages — the five-fold variation in network energy
    charges across NEM jurisdictions can make or break the business case; always obtain
    the actual network tariff schedule for the specific connection point before committing
    to a feasibility study.
