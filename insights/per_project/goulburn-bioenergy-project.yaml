  source_title: Market Analysis of Opportunities in Australia for Anaerobic Digestion
    Deployment
  publish_date: 2017-11
  project_name: Goulburn Bioenergy Project
  what_happened: Cold climate conditions were identified as a material technical risk
    for covered anaerobic lagoon performance, as anaerobic digestion works best near
    body temperature and cold temperatures reduce biogas yield — this was mitigable
    through digester heating (e.g. using waste heat from biogas engines) or insulated
    covers but added capital and operating cost.
  lesson_learnt: In cooler Australian climate zones, include digester heating or insulation
    in the project design and budget from the outset — unheated digesters in southern
    or elevated-altitude sites will underperform against standard biogas yield estimates,
    leading to shortfalls against the modelled business case.
