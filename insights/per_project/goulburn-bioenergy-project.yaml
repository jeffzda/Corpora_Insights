- record_id: ARENA-DLV-59204
  source_title: Biogas Opportunities for Australia
  publish_date: 2019-03
  project_name: Goulburn Bioenergy Project
  what_happened: ReNu Energy commissioned a bioenergy plant at the Southern Meats
    abattoir in February 2018 under a build-own-operate-maintain (BOOM) model, with
    a 20-year power purchase agreement with the abattoir. The project received A$2.1
    million in ARENA grant funding and A$5.75 million total capital investment. The
    plant supplies approximately 4,200 MWh annually, reducing the abattoir's electricity
    bill by over 50 per cent.
  lesson_learnt: A BOOM model with a long-term PPA (20 years) can make industrial
    biogas projects bankable by transferring technology and operational risk to the
    developer — project proponents targeting abattoir or food-processing clients should
    consider BOOM/BOOS structures to overcome host-site capital aversion.
