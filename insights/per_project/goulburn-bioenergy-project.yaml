  source_title: Market Analysis of Opportunities in Australia for Anaerobic Digestion
    Deployment
  publish_date: 2017-11
  project_name: Goulburn Bioenergy Project
  what_happened: 'High-strength organic waste from milk and dairy processing was identified
    as both an opportunity and a risk for AD project revenues: dairy processors had
    strong incentives to reclaim organics in wastewater (improving their own efficiency),
    meaning site efficiency improvements could progressively reduce the organic loading
    available to the biogas plant and shrink the AD revenue stream over time.'
  lesson_learnt: At milk and dairy processing sites, assess the trajectory of the
    customer's wastewater treatment improvement program before committing to a covered
    anaerobic lagoon design — if the site is actively reducing organic discharge to
    trade waste, the biogas resource may decline materially over the project's operational
    life, undermining the long-term business case.
