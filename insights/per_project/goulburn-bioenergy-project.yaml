  what_happened: Existing site infrastructure (transformers, main switchboards) at
    agribusiness sites was often old, and an AD project could either benefit from
    the business case (capital must be spent anyway) or be harmed by it (the project
    'brings forward' an infrastructure upgrade cost not otherwise budgeted), affecting
    project economics in ways not captured in standard cost benchmarks.
  lesson_learnt: Conduct an electrical infrastructure audit early in feasibility —
    the age and condition of existing transformers and switchboards directly affects
    project economics; an aging switchboard can either strengthen or destroy the business
    case depending on whether the upgrade was already planned, and this should be
    modelled explicitly.
