  source_title: Market Analysis of Opportunities in Australia for Anaerobic Digestion
    Deployment
  publish_date: 2017-11
  project_name: Goulburn Bioenergy Project
  what_happened: Cattle feedlot sites in Australia had no anaerobic digestion projects
    deployed as at 2017, due to existing feedlot design making manure collection for
    biogas production difficult and due to variable head counts — despite the largest
    single-site feedlot housing up to ~56,000 head, far exceeding the scale of other
    viable AD feedstocks.
  lesson_learnt: Feedlot biogas projects require purpose-designed manure collection
    infrastructure that is not present in most existing Australian feedlots — new
    greenfield feedlots or major brownfield redesigns are the viable entry point;
    retrofitting existing feedlot designs is not commercially feasible in the near
    term.
