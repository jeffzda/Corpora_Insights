- record_id: ARENA-DLV-17822
  source_title: Market Analysis of Opportunities in Australia for Anaerobic Digestion
    Deployment
  publish_date: 2017-11
  project_name: Goulburn Bioenergy Project
  what_happened: Feedstock availability for mixed-waste anaerobic digestion projects
    was identified as often seasonal, and logistics costs limited the viable feedstock
    catchment radius — both factors could result in actual throughput being materially
    lower than design capacity, reducing revenue from electricity generation, LGCs,
    ACCUs, and avoided waste levies.
  lesson_learnt: For mixed-waste AD projects, conduct a feedstock availability study
    that accounts for seasonality and maximum economic transport radius before committing
    to a design capacity — overstating achievable throughput is a common financial
    modelling error that leads to underperforming plants and unfunded operating cost
    gaps.
