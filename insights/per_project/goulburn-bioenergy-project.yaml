- record_id: ARENA-DLV-17801
  source_title: Market Analysis of Opportunities in Australia for Anaerobic Digestion
    Deployment
  publish_date: 2017-11
  project_name: Goulburn Bioenergy Project
  what_happened: Australia's biogas market was significantly less developed than comparable
    international jurisdictions in 2017, with only ~242 biogas plants (dominated by
    landfill and sewage applications) and approximately 27 GWh/year from agricultural
    digesters — versus a far larger potential market estimated at ~$816 million across
    agribusiness sectors.
  lesson_learnt: Developers entering the Australian biogas market should treat it
    as an immature market requiring education-led commercialisation — reference-class
    data from European or North American deployments will overstate likely uptake
    rates and technology readiness in the Australian agribusiness context.
