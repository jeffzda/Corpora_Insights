  what_happened: Soil nutrient loading from digestate irrigation was identified as
    a site-specific constraint — while digestate contains beneficial nitrogen, phosphorous,
    and potassium, over-application can damage agricultural productivity, and poor
    soil conditions may prevent irrigation entirely, limiting or eliminating the digestate
    revenue stream assumed in the business case.
  lesson_learnt: Assess soil conditions and agronomic nutrient loading limits for
    digestate irrigation as part of site feasibility — if the land area available
    cannot absorb the digestate nutrient load, the operator will incur additional
    digestate disposal costs or lose the fertiliser revenue stream, both of which
    can swing the business case materially.
