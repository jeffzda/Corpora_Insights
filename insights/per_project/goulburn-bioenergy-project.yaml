- record_id: ARENA-DLV-17806
  source_title: Market Analysis of Opportunities in Australia for Anaerobic Digestion
    Deployment
  publish_date: 2017-11
  project_name: Goulburn Bioenergy Project
  what_happened: Only 2 covered anaerobic ponds existed on dairy farms in Australia
    as at 2017, despite 6,128 registered dairy farms, primarily because the majority
    of Australian dairies are pasture-based and do not collect manure — making anaerobic
    digestion technically impractical at most sites without a fundamental change in
    farm management practice.
  lesson_learnt: Dairy biogas projects should be targeted exclusively at shedded (feedlot-style)
    dairies where manure collection is a standard operational practice — pasture-based
    dairies are not viable candidates regardless of herd size, and site visits to
    confirm management type are essential before investing in feasibility studies.
