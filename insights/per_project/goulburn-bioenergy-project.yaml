  what_happened: Anaerobic digestion business cases were described as multi-faceted
    and complex, requiring project proponents to simultaneously model energy requirements,
    electricity costs, LGC revenue, ACCU revenue, capital costs, operating costs,
    compliance obligations, and the heat vs. electricity decision — presenting a material
    barrier to uptake, particularly for agribusinesses for whom waste management is
    a low-priority compliance activity.
  lesson_learnt: The complexity of the AD business case is itself a delivery risk
    — proponents should develop a standardised financial model template covering all
    revenue streams (electricity displacement, LGCs, ACCUs, avoided waste levies,
    digestate value) before approaching customers, as failure to present a coherent
    integrated case is a common reason projects do not proceed past feasibility.
