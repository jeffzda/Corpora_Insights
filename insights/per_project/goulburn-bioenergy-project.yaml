- record_id: ARENA-DLV-17814
  source_title: Market Analysis of Opportunities in Australia for Anaerobic Digestion
    Deployment
  publish_date: 2017-11
  project_name: Goulburn Bioenergy Project
  what_happened: The financial viability of mixed-waste anaerobic digestion projects
    in Australia was found to be highly jurisdiction-dependent because waste levies
    varied enormously between states — NSW had a waste levy of $138.20/tonne making
    avoidance highly valuable, while other states had no levy, making the avoided
    waste levy benefit (the largest single component of the NSW mixed-waste business
    case) unavailable.
  lesson_learnt: For mixed-waste AD projects, assess state waste levy structures before
    shortlisting sites — the NSW metropolitan levy ($138.20/tonne in 2017) made mixed-waste
    AD potentially viable there while the absence of equivalent levies in other states
    may make identical projects unviable; do not apply a single national business
    case model.
