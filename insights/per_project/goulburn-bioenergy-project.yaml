- record_id: ARENA-DLV-17804
  source_title: Market Analysis of Opportunities in Australia for Anaerobic Digestion
    Deployment
  publish_date: 2017-11
  project_name: Goulburn Bioenergy Project
  what_happened: Network connection requirements for biogas embedded generators varied
    substantially across Australian distribution network jurisdictions — the threshold
    for being classified as a 'Negotiated Connection' was 5 kW in the Energex network
    but 30 kW in the Essential Energy network, triggering different processes, timelines,
    and information requirements for each project.
  lesson_learnt: For distributed biogas projects, assess the specific network operator's
    connection classification thresholds, technical standards, and application processes
    at the earliest feasibility stage — these vary materially across jurisdictions
    and can significantly affect project cost, timeline, and the viability of grid
    export revenue.
