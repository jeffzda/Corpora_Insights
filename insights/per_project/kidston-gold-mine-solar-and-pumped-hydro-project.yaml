- record_id: ARENA-DLV-71072
  source_title: Hybrid Power Generation for Australian Off-Grid Mines
  publish_date: 2018-06
  project_name: Kidston Gold Mine Solar and Pumped Hydro Project
  what_happened: Genex Power developed a 50 MWAC solar PV project at the former Kidston gold mine site, leveraging legacy mine infrastructure (roads, water supply, substation, 185 km of 132 kV power lines,
    camp accommodation) and prior approvals to reduce capital costs and accelerate delivery.
  lesson_learnt: Former mine sites can offer substantial cost and schedule advantages for renewable energy projects — legacy infrastructure (roads, grid connections, water, accommodation, permits) can be
    repurposed directly, materially reducing CAPEX and shortening approvals timelines compared to greenfield sites.
