  evidence_excerpt: Locating the power station at a former mine has resulted in a lower power station CAPEX being achieved through the use of legacy mine infrastructure such as camp accommodation, water
    supply and infrastructure (Copperfield Dam), a substation, access roads and 185 km of power lines (132 kV) that connect the site to the grid. Licencing and permit requirements also benefited from approval
    processes previously undertaken for the mine.
