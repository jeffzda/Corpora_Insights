- record_id: ARENA-DLV-37932
  source_title: Hydrogen Communities & H2City Tool
  publish_date: 2019-06
  project_name: Hydrogen Communities (cross-cutting finding)
  what_happened: Australia had key gaps in safety standards for hydrogen appliances
    in three areas — device safety and design, device installation, and gas composition
    (purity, odorant) — as identified at the Standards Australia Hydrogen Standards
    Forum in October 2018, with Standards Australia recognising benefits of adopting
    or aligning with international standards.
  lesson_learnt: Australian hydrogen appliance and network projects cannot rely on
    a complete domestic standards framework — project proponents must identify applicable
    gaps in Australian standards early, engage with Standards Australia's international
    alignment process, and plan for case-by-case safety testing and regulatory approval
    as a project phase.
