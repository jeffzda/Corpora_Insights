  project_name: Hydrogen Communities (cross-cutting finding)
  what_happened: The review of global hydrogen projects found that most projects and
    initiatives required government incentives and/or policy direction, and that partnerships
    across industry, government and universities were the dominant delivery model
    — with partnerships enabling pooling of resources, expertise and risk.
  lesson_learnt: Hydrogen community conversion projects should be structured as multi-party
    partnerships spanning industry, government and research institutions from the
    outset — this structure is the norm across successful global programs and provides
    access to pooled resources, shared risk and complementary expertise that no single
    proponent can replicate.
