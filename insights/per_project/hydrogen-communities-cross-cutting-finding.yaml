  what_happened: A review of global hydrogen projects found that existing gas network
    pipelines can be leveraged to store and transport hydrogen, reducing overall supply
    chain costs, and that co-locating production with demand points reduces transport
    costs for smaller, more localised communities.
  lesson_learnt: Leverage existing gas pipeline networks for hydrogen transport and
