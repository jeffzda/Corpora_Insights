- record_id: ARENA-DLV-37923
  source_title: Hydrogen Communities & H2City Tool
  publish_date: 2019-06
  project_name: Hydrogen Communities (cross-cutting finding)
  what_happened: A cross-cutting review of global and Australian hydrogen community
    case studies found that hydrogen production facilities represent one of the largest
    costs across the supply chain at current cost levels, and that production economics
    improve with economies of scale as demand increases.
  lesson_learnt: Production facility sizing should account for expected demand growth
    trajectory, not just initial demand — building at a scale that can accommodate
    future demand growth improves production economics and reduces the levelised cost
    of hydrogen, which is currently a dominant supply chain cost driver.
