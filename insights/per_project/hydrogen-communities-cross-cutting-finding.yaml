  source_title: Hydrogen Communities & H2City Tool
  publish_date: 2019-06
  project_name: Hydrogen Communities (cross-cutting finding)
  what_happened: A review of global hydrogen community projects found that all hydrogen
    production methods (electrolysis, SMR, coal gasification) require significant
    quantities of water, and that Australia's status as one of the most water-stressed
    regions in the world means long-term water cost and availability is a material
    project risk.
  lesson_learnt: Water availability and cost must be explicitly assessed as a binding
    constraint in the site selection and feasibility phase for any Australian hydrogen
    production project — given Australia's water stress profile, projects that fail
    to secure long-term water access risk both operational viability and cost escalation.
