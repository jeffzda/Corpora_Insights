- record_id: ARENA-DLV-37934
  source_title: Hydrogen Communities & H2City Tool
  publish_date: 2019-06
  project_name: Hydrogen Communities (cross-cutting finding)
  what_happened: The cross-cutting review found that hydrogen blending above 20% into
    gas networks causes pipe embrittlement where hydrogen attacks pipeline materials,
    with risk increasing at higher pressures in transmission networks — requiring
    specific materials of construction for concentrations above this threshold.
  lesson_learnt: For hydrogen network conversion projects targeting blends above 20%,
    conduct a detailed materials assessment of existing pipeline stock before committing
    to design — hydrogen embrittlement of steel pipelines at concentrations above
    20% is a material technical constraint that drives significant infrastructure
    replacement cost and limits conversion options.
