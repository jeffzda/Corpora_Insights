- record_id: ARENA-DLV-37928
  source_title: Hydrogen Communities & H2City Tool
  publish_date: 2019-06
  project_name: Hydrogen Communities (cross-cutting finding)
  what_happened: The regulatory analysis found that large-scale hydrogen conversion
    projects face an unresolved cost recovery challenge under Australian gas regulation
    — the National Gas Rules do not straightforwardly allow regulated gas businesses
    to pass conversion costs through to customers without a carbon price or explicit
    regulatory obligation.
  lesson_learnt: Project proponents planning large-scale hydrogen network conversion
    must resolve the cost recovery mechanism before committing to investment — in
    the absence of a carbon price or explicit regulatory mandate, existing rules make
    it very difficult to recover conversion expenditure through regulated tariffs,
    potentially leaving the project commercially non-viable.
