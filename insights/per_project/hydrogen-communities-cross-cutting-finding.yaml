- record_id: ARENA-DLV-37929
  source_title: Hydrogen Communities & H2City Tool
  publish_date: 2019-06
  project_name: Hydrogen Communities (cross-cutting finding)
  what_happened: The regulatory analysis identified that vertical integration restrictions
    under the NGL — which prevent covered pipeline operators from also producing or
    retailing gas — create coordination challenges for hydrogen supply chain projects,
    as the optimal hydrogen project structure may require a single entity to manage
    production, transport and supply.
  lesson_learnt: Hydrogen supply chain projects that require vertical integration
    across production, transport and retail must assess jurisdiction-specific NGL
    coverage status and licensing arrangements early — covered pipeline operators
    face legal constraints on vertical integration that may require regulatory exemptions
    or bespoke commercial structures to achieve effective supply chain coordination.
  issue_severity: moderate
  project_type: network/grid
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: approvals/contracting
  proponent_type: network business
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: coordination & stakeholders
  intervention_note: Uncovered pipelines and private networks are not subject to NGL
