- record_id: ARENA-DLV-37931
  source_title: Hydrogen Communities & H2City Tool
  publish_date: 2019-06
  project_name: Hydrogen Communities (cross-cutting finding)
  what_happened: Australia had only two hydrogen refuelling stations trialled as of
    2019, creating a critical infrastructure gap for mobility-sector hydrogen applications,
    while global projects in California, Germany and Scandinavia demonstrated that
    strategically placed refuelling networks are a prerequisite for FCEV market development.
  lesson_learnt: Australia's near-absence of hydrogen refuelling infrastructure (two
    stations trialled by 2019) means mobility-sector hydrogen projects must include
    dedicated refuelling infrastructure as a project component — the chicken-and-egg
    problem of vehicles requiring stations and stations requiring vehicle demand must
    be resolved through coordinated co-deployment funded by government at the program
    level.
  issue_severity: major
  project_type: network/grid
