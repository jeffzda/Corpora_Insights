- record_id: ARENA-DLV-37927
  source_title: Hydrogen Communities & H2City Tool
  publish_date: 2019-06
  project_name: Hydrogen Communities (cross-cutting finding)
  what_happened: The regulatory analysis found that existing Australian gas regulations
    (National Gas Law) contain no explicit prohibition on hydrogen injection up to
    10% concentration, treating such blends as natural gas, but that blends above
    10% fall outside the NGL framework, leaving hydrogen networks in a regulatory
    gap.
  lesson_learnt: Australian hydrogen gas network projects targeting blends above 10%
    must anticipate a regulatory framework gap — existing NGL provisions do not cover
    these blends, requiring project proponents to engage with national and state regulators
    early to establish bespoke arrangements before construction, as no standard pathway
    exists.
  issue_severity: moderate
  project_type: network/grid
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: approvals/contracting
  proponent_type: network business
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: CSIRO suggested extending the definition of gas in the NGL to
    include hydrogen and creating a dedicated agency to coordinate reforms across
    levels of government.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages: &id005
  - 58
  - 72
  evidence_excerpt: A pipeline or network transporting hydrogen at a concentration
    of more than 10 per cent would not be captured under the NGL, as this blend of
    hydrogen/natural gas does not meet the definition of natural gas under the legislation.
    Without any amendments to the current regulatory framework, this would leave a
    hydrogen network in a sense largely unregulated from an economic efficiency perspective.
