  source_title: Hydrogen Communities & H2City Tool
  publish_date: 2019-06
  project_name: Hydrogen Communities (cross-cutting finding)
  what_happened: A University of Queensland survey (funded by ARENA) found that 81%
    of Australians had a neutral association with hydrogen as an energy source, 13%
    had a negative association (bomb, explosion), and only 3% had a positive association
    — with safety being the top community concern around hydrogen technologies.
  lesson_learnt: Community engagement and education programs for hydrogen projects
    must specifically address safety perceptions — the dominant public association
    with hydrogen is negative (explosion/bomb risk) rather than positive (clean energy),
    and this must be directly countered with factual safety messaging before and during
    project rollout to achieve social licence.
