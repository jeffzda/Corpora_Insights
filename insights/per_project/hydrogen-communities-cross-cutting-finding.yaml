- record_id: ARENA-DLV-37933
  source_title: Hydrogen Communities & H2City Tool
  publish_date: 2019-06
  project_name: Hydrogen Communities (cross-cutting finding)
  what_happened: The H2City Tool was developed with over 200 input variables and three
    operating modes (simplified, advanced, clean) to screen communities for hydrogen
    conversion suitability, but was explicitly designed as a high-level pre-screening
    tool only — requiring users to have basic energy sector knowledge and undertake
    further detailed analysis on any opportunity identified.
  lesson_learnt: Early-stage hydrogen community feasibility tools must be calibrated
    as pre-screening instruments, not investment decision models — design for users
    who have basic energy sector knowledge but limit reliance on the tool's pre-populated
    assumptions for investment decisions, and build in explicit prompts to progress
    to detailed analysis.
