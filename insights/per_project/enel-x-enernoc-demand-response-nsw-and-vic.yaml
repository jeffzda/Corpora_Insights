- record_id: ARENA-DLV-42322
  source_title: Evaluation of ARENA's 2017-2020 Demand Response Portfolio
  publish_date: 2021-06
  project_name: Enel X (EnerNOC) Demand Response (NSW and VIC)
  what_happened: Enel X reported that ARENA provided insufficient feedback and guidance
    on the type of content expected in knowledge sharing reports, reducing the value
    of reports as the project progressed and creating uncertainty about what ARENA
    wanted to learn from the program.
  lesson_learnt: Provide explicit guidance to funding recipients on the expected content,
    structure, and quality of knowledge sharing reports at the start of a program,
    and update guidance as the program evolves — without this, recipients default
    to what is easiest to report rather than what is most useful to the portfolio.
