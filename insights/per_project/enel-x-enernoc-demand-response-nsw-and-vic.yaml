- record_id: ARENA-DLV-42321
  source_title: Evaluation of ARENA's 2017-2020 Demand Response Portfolio
  publish_date: 2021-06
  project_name: Enel X (EnerNOC) Demand Response (NSW and VIC)
  what_happened: Enel X's two projects (NSW and VIC) received no private sector co-investment
    — the NSW project was split equally between ARENA and NSW Government funding,
    and the VIC project was 100% ARENA-funded — meaning both projects failed to meet
    ARENA's leverage performance targets.
  lesson_learnt: Screen prospective funding recipients for private co-investment capacity
    before awarding grants, and set minimum leverage thresholds in funding conditions
    — projects fully funded by public money represent a missed opportunity to leverage
    private sector risk capital and reduce the public funding burden.
