  delay_category: procurement/supply chain
  failure_mode: execution & logistics
  outcome_class: delayed but recoverable
  secondary_failure_mode: coordination & stakeholders
  intervention_note: A shift in the supply arrangement with the OEM improved delivery
    timelines, with the long-established OEM relationship enabling better collaboration,
    visibility, and responsiveness throughout the project.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: EV
