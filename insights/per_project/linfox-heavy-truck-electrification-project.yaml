- record_id: ARENA-DLV-64802
  source_title: Linfox - Heavy Truck Electrification Project - Lessons Learnt Report
    1
  publish_date: 2025-05
  project_name: Linfox Heavy Truck Electrification Project
  what_happened: The North Laverton distribution centre initially lacked sufficient
    grid capacity to support both operational demands and the planned electric fleet;
    the local DNSP only increased electricity supply in November 2024, and a portion
    of the rooftop solar system remained curtailed due to ongoing DNSP infrastructure
    upgrades.
  lesson_learnt: Incorporate EV charging infrastructure into the design of sustainable
    buildings and distribution centres from the outset — early design considerations
    enable futureproofing and strategic deployment of heavy-duty electric fleets,
    avoiding costly retrofits.
  issue_severity: major
  project_type: transport electrification
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: fleet/logistics operator
  delay_category: grid connection/system studies
  failure_mode: regulatory & approvals
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Linfox applied early for a second transformer and maintained
    clear communication with the DNSP about long-term electrification plans, helping
    secure installation timelines ahead of typical lead times.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: EV
