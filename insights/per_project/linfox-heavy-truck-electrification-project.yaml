- record_id: ARENA-DLV-64805
  source_title: Linfox - Heavy Truck Electrification Project - Lessons Learnt Report
    1
  publish_date: 2025-05
  project_name: Linfox Heavy Truck Electrification Project
  what_happened: EV charger procurement faced extended lead times due to international
    supply chains, with EV charging partners located overseas creating longer production
    schedules and international shipping logistics that impacted delivery timelines.
  lesson_learnt: Allow spare capacity within EV charging infrastructure to provide
    operational resilience and a buffer against long procurement lead times for parts
    and equipment — faults or delays in replacements must not hinder fleet operations.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: first commercial/FOAK
  lifecycle_phase: procurement
  proponent_type: fleet/logistics operator
  delay_category: procurement/supply chain
  failure_mode: execution & logistics
  outcome_class: delayed but recoverable
  secondary_failure_mode: null
  intervention_note: Linfox adopted a strategy of allowing spare capacity within the
    EV charging infrastructure to maintain operational resilience and buffer against
    long international procurement lead times.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: EV
  source_pages: &id002
  - 7
  evidence_excerpt: Collaborating with EV partners located on the other side of the
    world can lead to extended lead times, driven by longer production schedules and
    international shipping logistics. These factors can impact delivery timelines
    and require careful planning and early engagement.
