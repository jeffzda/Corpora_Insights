- record_id: ARENA-DLV-54911
  source_title: ARENA Insights Green Steel Webinar
  publish_date: 2024-05
  project_name: ARENA Iron and Steel R&D Program
  what_happened: ARENA committed $24.6 million to 21 iron and steel R&D projects across 17 recipients, leveraging $103 million in total project investment (a ratio of approximately 1:4.2 public to total).
    The portfolio spanned DRI process development, electrochemical reduction, blast furnace optimisation, beneficiation, and slag valorisation, with grants ranging from $1.3–5 million.
  lesson_learnt: A portfolio approach to novel ironmaking R&D — funding multiple technology pathways simultaneously at $1–5M grant scale rather than concentrating funding in a single technology — achieves
    higher leverage ratios and hedges against the risk that any single technology pathway fails to reach commercial viability.
