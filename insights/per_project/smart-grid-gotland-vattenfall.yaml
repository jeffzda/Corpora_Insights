- record_id: ARENA-DLV-72301
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects - First Edition Results'
  publish_date: '2015'
  project_name: Smart Grid Gotland (Vattenfall)
  what_happened: Vattenfall's Smart Grid Gotland project (AUD 22M) trialled demand response with ~2,000 customers using spot price signals linked to wind production, alongside battery storage and static
    VAr compensation to increase wind hosting capacity by 5MW. The retail component was run entirely on a commercial basis without subsidies and without informing participants they were in a trial.
  lesson_learnt: Running demand response customer trials on a fully commercial basis — without subsidies or explicit trial disclosure — provides the most realistic evidence of consumer price responsiveness
    to wind-linked spot pricing and reduces observer-effect bias in trial results.
