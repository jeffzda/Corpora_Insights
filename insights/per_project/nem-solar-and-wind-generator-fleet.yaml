- record_id: ARENA-DLV-59255
  source_title: 'The Generator Operations Series: Negative Pricing and Bidding Behaviour
    on the NEM'
  publish_date: 2021-09
  project_name: NEM Solar and Wind Generator Fleet
  what_happened: Automated bidding software used by VRE generators was found in some
    cases to not be properly integrated with dispatch offers, preventing appropriate
    ramping across a dispatch interval. This created system security concerns and
    contributed to market bodies' scrutiny of semi-scheduled generator behaviour.
  lesson_learnt: When procuring or commissioning automated bidding software, project
    operators must verify that the system is fully integrated with AEMO dispatch offer
    protocols and correctly handles ramping requirements across dispatch intervals
    — partial integration creates both compliance risk and system security exposure.
