- record_id: ARENA-DLV-59257
  source_title: 'The Generator Operations Series: Negative Pricing and Bidding Behaviour
    on the NEM'
  publish_date: 2021-09
  project_name: NEM Solar and Wind Generator Fleet
  what_happened: Late rebidding (rebids submitted less than 15 minutes prior to dispatch)
    by generators was found to cause wholesale market price shocks for large industrial
    users, reduce transparency of spot prices, inflate cap contract and hedge product
    prices, and ultimately pass costs to consumers. Ernst & Young estimated that deliberate
    late rebidding added approximately $8/MWh to the price of cap contracts in Queensland
    in Q4 2014 and $7/MWh in Q1 2015.
  lesson_learnt: Project operators using dynamic bidding strategies should be aware
    that deliberately late rebidding carries regulatory and reputational risk — the
    AEMC has documented its market distortion effects and regulators are actively
    scrutinising this behaviour; bidding systems should be designed to rebid as early
    as possible once the decision to shift capacity is made.
  issue_severity: moderate
  project_type: generation
  project_scale_band: utility/large-scale
  lifecycle_phase: operations
  proponent_type: project developer
  delay_category: null
  failure_mode: regulatory & approvals
  outcome_class: policy/market influence only
  secondary_failure_mode: commercial & market
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id004
  - 9
  - 10
  evidence_excerpt: Research undertaken by Ernst & Young in 2015 indicates that some
    participants are paying a premium on contract market products in order to manage
    the price volatility that arises from deliberately late rebidding. This is estimated
    to have added around eight dollars per megawatt hour to the price of caps in Queensland
    in the final quarter of 2014, and around seven dollars per megawatt hour in the
    first quarter of 2015.
  confidence_note: This evidence pre-dates the document's primary analysis period;
    included because it is cited explicitly in the document as context for ongoing
    regulatory concern about rebidding practices.
