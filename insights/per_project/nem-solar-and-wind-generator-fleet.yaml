- record_id: ARENA-DLV-59256
  source_title: 'The Generator Operations Series: Negative Pricing and Bidding Behaviour
    on the NEM'
  publish_date: 2021-09
  project_name: NEM Solar and Wind Generator Fleet
  what_happened: The transition from 30-minute to 5-minute settlement periods (scheduled
    October 2021) was found to materially alter the commercial logic of bidding strategies.
    Under 30-minute settlement, dynamic bidding was necessary to avoid being dispatched
    in 30-minute intervals that average to negative even if individual 5-minute intervals
    are positive. Under 5-minute settlement, a fixed strategy set at the minimum acceptable
    price becomes equally effective for avoiding negative dispatch — but dynamic strategies
    remain valuable for managing FCAS costs.
  lesson_learnt: Revenue models and bidding strategy designs for new VRE projects
    must be calibrated to the 5-minute settlement regime — assumptions about the value
    of dynamic bidding inherited from the 30-minute settlement era overstate the operational
    complexity required for negative price avoidance, while potentially undervaluing
    dynamic capability for FCAS optimisation.
  issue_severity: moderate
  project_type: generation
  project_scale_band: utility/large-scale
  lifecycle_phase: operations
  proponent_type: project developer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: commercial & market
  intervention_note: Market design change — settlement period aligned to 5-minute
    dispatch from October 2021, removing the 30-minute averaging incentive that drove
    the pile-in effect and distorted revenue for flexible vs. inflexible generators.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id003
  - 15
  - 20
  - 22
  evidence_excerpt: Once 5-minute settlement commences, fixed strategies set at the
    minimum price a generator is willing to pay will be equally as effective at preventing
    dispatch in negative price intervals. Nevertheless, dynamic bidding strategies
    can enable generators to minimise costs overall by considering other factors such
    as FCAS costs.
  confidence_note: issue_severity moderate — this is a forward-looking design assumption
    risk rather than a documented failure; the document treats it as a significant
    commercial implication.
