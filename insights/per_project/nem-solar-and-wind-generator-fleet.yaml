- record_id: ARENA-DLV-59258
  source_title: 'The Generator Operations Series: Negative Pricing and Bidding Behaviour
    on the NEM'
  publish_date: 2021-09
  project_name: NEM Solar and Wind Generator Fleet
  what_happened: One generator from ARENA's LSS portfolio was required to always bid
    at least 1 MW in their minimum price band to ensure compliance with reactive power
    supply requirements set out in their Generator Performance Standards (GPS). This
    operational constraint meant their monthly bidding classification could appear
    to deviate from their primary strategy, potentially causing misclassification
    in market analyses.
  lesson_learnt: Generator Performance Standards can impose persistent, non-discretionary
    constraints on bidding structure that may conflict with revenue-optimising strategies
    — project teams should ensure GPS obligations relating to reactive power and minimum
    dispatch requirements are fully reflected in their automated bidding software
    configuration from commissioning.
