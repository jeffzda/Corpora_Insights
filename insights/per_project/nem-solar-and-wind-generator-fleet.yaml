- record_id: ARENA-DLV-59253
  source_title: 'The Generator Operations Series: Negative Pricing and Bidding Behaviour
    on the NEM'
  publish_date: 2021-09
  project_name: NEM Solar and Wind Generator Fleet
  what_happened: Over 35 per cent of grid-scale solar and wind farms on the NEM adopted
    automated bidding software within the two years prior to mid-2021, driven by the
    need to avoid negative pricing, minimise curtailment, manage FCAS cost allocations,
    and ensure PPA and regulatory compliance. Automated bidding software has been
    reported to increase net revenue by over 10 per cent in some cases.
  lesson_learnt: New utility-scale solar and wind projects should budget for and procure
    automated bidding software as a standard operational tool rather than treating
    it as optional — the revenue uplift and curtailment reduction justify the cost,
    and manual bidding is increasingly inadequate in high-VRE markets.
