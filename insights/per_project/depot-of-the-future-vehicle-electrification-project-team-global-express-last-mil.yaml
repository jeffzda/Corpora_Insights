- record_id: ARENA-DLV-28109
  source_title: Insights from Freight Transport Electrification Across Port, Express Parcels & Last-Mile Deliveries
  publish_date: '2025-08-05'
  project_name: Depot of the Future Vehicle Electrification Project (Team Global Express); Last Mile Delivery Vehicle Electrification Project (ANC)
  what_happened: Across all depot AC charging sites (7–22 kW), vehicles were left plugged in overnight and on weekends in an idle (not charging) state after reaching full charge. This extended idle plug-in
    time represents a significant untapped window for V2G services.
  lesson_learnt: Overnight and weekend idle plug-in time at depot AC chargers constitutes a strong V2G opportunity for freight fleets — future charging infrastructure planning should include V2G-capable
    hardware and tariff structures that enable vehicles to discharge during high-value grid events while parked.
