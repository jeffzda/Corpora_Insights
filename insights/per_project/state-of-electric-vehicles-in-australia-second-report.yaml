  publish_date: 2018-06
  project_name: State of Electric Vehicles in Australia (Second Report)
  what_happened: Victoria had the highest electricity grid emissions intensity in
    Australia (1,080 g CO2/kWh in 2016 due to brown coal generation), making it the
    only state where an average grid-charged EV emitted more than an average ICE vehicle
    (209 g CO2/km vs. 182 g CO2/km national ICE average) — a finding that complicated
    EV value propositions in the state with the highest cumulative EV sales.
  lesson_learnt: EV deployment projects and communications in high-emissions-intensity
    grid regions must account for the grid mix when making emissions claims — in Victoria
    in 2016, an average grid-charged EV was marginally worse than an average ICE vehicle
    on tailpipe-equivalent emissions, and programs that rely on blanket 'zero emissions'
    messaging risk credibility loss and consumer backlash in coal-heavy grids.
