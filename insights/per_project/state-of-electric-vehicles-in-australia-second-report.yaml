  what_happened: Survey respondents ranked purchase cost subsidies (68%), public charging
    infrastructure provision (68%), and home charging installation subsidies (67%)
    as the top three policy measures that would encourage EV purchase — yet at the
    federal level in 2018, no direct vehicle purchase subsidy and no federal overarching
    EV policy existed.
