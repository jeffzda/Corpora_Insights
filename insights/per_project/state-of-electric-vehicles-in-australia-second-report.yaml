  what_happened: Melbourne Water's detailed analysis found the operating life cycle
    of electric vehicles is expected to be more than double that of internal combustion
    engine vehicles, and estimated cost savings of approximately $2,000–$3,000 per
    vehicle per year in maintenance and fuel.
