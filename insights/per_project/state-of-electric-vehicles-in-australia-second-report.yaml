  publish_date: 2018-06
  project_name: State of Electric Vehicles in Australia (Second Report)
  what_happened: A consumer expert and long-term EV owner reported that when attempting
    to purchase their first EV in 2013, dealership staff actively discouraged the
    purchase ('Why would you want to buy an electric vehicle when there are plenty
    of better petrol options?') and admitted ignorance of the vehicle ('We can't help
    you because we don't know anything about the car you want') — a pattern confirmed
    as common among EV consumers researched subsequently.
  lesson_learnt: EV deployment and trial programs must include dealer and sales channel
    training as a core component — inadequately trained dealership staff actively
    impede sales at the point of purchase, and this barrier persists regardless of
    product quality or consumer motivation; programs that bypass dealer education
    risk significant conversion losses.
