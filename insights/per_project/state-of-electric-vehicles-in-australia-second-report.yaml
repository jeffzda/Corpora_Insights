- record_id: ARENA-DLV-16864
  source_title: 'The State of Electric Vehicles in Australia – Second Report: Driving
    Momentum in Electric Mobility'
  publish_date: 2018-06
  project_name: State of Electric Vehicles in Australia (Second Report)
  what_happened: The second-hand EV market in Australia was negligible in 2018 despite
    growing new vehicle sales; policy, research, and pilot projects had focused almost
    entirely on the new vehicle market, leaving residual value uncertainty as a structural
    barrier that increased effective leasing costs and reduced manufacturer confidence
    to commit supply.
  lesson_learnt: EV deployment programs and policy design should include explicit
    measures to develop the second-hand market alongside new vehicle programs — without
    a functioning used-EV market, residual values remain uncertain, leasing costs
    stay high, and manufacturers have weaker incentives to increase supply; addressing
    this gap requires information, certification standards, and possibly warranty
    support for second-hand EVs.
