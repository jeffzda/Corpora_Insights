- record_id: ARENA-DLV-16863
  source_title: 'The State of Electric Vehicles in Australia – Second Report: Driving
    Momentum in Electric Mobility'
  publish_date: 2018-06
  project_name: State of Electric Vehicles in Australia (Second Report)
  what_happened: Australia lacked federal light vehicle CO2 emissions standards in
    2018, making it one of the few remaining developed countries without such standards;
    the Ministerial Forum on Vehicle Emissions was considering their introduction
    but had not implemented them, while such standards already covered over 80 per
    cent of the global automotive market.
  lesson_learnt: EV market development programs operating without a federal CO2 emissions
    standard backdrop face a structurally weaker policy environment — project proponents
    should account for Australia's absence of vehicle emissions standards when forecasting
    EV market growth, manufacturer supply commitments, and model availability timelines,
    as these are materially constrained without regulatory pull.
