  source_title: 'The State of Electric Vehicles in Australia – Second Report: Driving
    Momentum in Electric Mobility'
  publish_date: 2018-06
  project_name: State of Electric Vehicles in Australia (Second Report)
  what_happened: In 2017, 19 of the 23 electric vehicle models available in Australia
    were priced above $60,000, and growth in sales was concentrated in the luxury
    segment; the previous year's report had speculated that limited affordable model
    availability contributed to the 2016 sales decline, and 2017 data confirmed that
    sustained mass-market growth requires more sub-$60,000 models.
  lesson_learnt: Project developers and policy-makers seeking broad EV uptake should
    not rely on luxury-segment sales growth as a proxy for mass-market penetration
    — accessible price-point model availability is a prerequisite, and procurement
    or incentive programs should be designed around the sub-$60,000 segment to drive
    volume.
