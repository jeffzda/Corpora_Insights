  publish_date: 2018-06
  project_name: State of Electric Vehicles in Australia (Second Report)
  what_happened: Consumer survey of 1,086 respondents in Victoria, NSW and ACT found
    that 43 per cent would not consider buying an EV, citing range anxiety, high purchase
    cost relative to ICE vehicles, technology reliability concerns, and limited charging
    access as the main barriers — with limited change from the previous year's survey,
    indicating persistent knowledge and confidence gaps.
  lesson_learnt: EV deployment programs targeting consumer uptake must directly address
    range anxiety, upfront cost, and reliability perceptions through trial programs
    and real-world data dissemination — survey results showed that consumer attitudes
    had not shifted materially in 12 months despite market growth, indicating that
    market data alone does not close consumer knowledge gaps.
