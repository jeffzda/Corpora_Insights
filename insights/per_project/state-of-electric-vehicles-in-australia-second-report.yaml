  what_happened: In Australia in 2017, public charging infrastructure expanded 64
    per cent (from 476 to 783 locations), with the ratio of DC to AC chargers remaining
    at approximately 90 per cent AC; no single national data repository existed for
    charging infrastructure, requiring the report to rely on crowdsourced data from
    PlugShare.
