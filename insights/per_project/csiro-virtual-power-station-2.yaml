- record_id: ARENA-DLV-9958
  source_title: 'Empowered Consumers: Distributed Energy Resources Portfolio Update'
  publish_date: '2018'
  project_name: CSIRO Virtual Power Station 2
  what_happened: The CSIRO VPS2 project was limited to individual connection points
    and modelled impacts on distribution operations, with no real-world demonstration
    in distribution network operations completed. Further field demonstration was
    identified as required.
  lesson_learnt: Control technology for distributed virtual power stations requires
    field demonstration within live distribution network operations before conclusions
    about real-world performance can be drawn — modelled impacts and single connection-point
    testing are insufficient to validate distribution-level operational performance.
  issue_severity: moderate
