- record_id: ARENA-DLV-9957
  source_title: 'Empowered Consumers: Distributed Energy Resources Portfolio Update'
  publish_date: '2018'
  project_name: CSIRO Virtual Power Station 2
  what_happened: The CSIRO VPS2 project used a single communication channel for receiving
    demand response signals, which enabled simple group control of air-conditioners
    but disabled the ability to control individual air-conditioning loads independently.
  lesson_learnt: Design demand response communication architectures to support granular,
    individual device control from the outset — a single-channel approach limits responsiveness
    and precludes optimised dispatch; infrastructure capable of addressing individual
    loads is necessary for full DER orchestration capability.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: Continued development of communications infrastructure for the
    core control technology was identified as required to provide more granular control
    of all devices.
  transferability: broad
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id001
  - 4
  evidence_excerpt: A single communication channel was used on hardware for receiving
    the demand response signal from the network to enable remote control of air-conditioning
    units. This provided simple control for a group of air-conditioners, but disabled
    control of individual air-conditioning loads.
