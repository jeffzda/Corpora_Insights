- record_id: ARENA-DLV-9959
  source_title: 'Empowered Consumers: Distributed Energy Resources Portfolio Update'
  publish_date: '2018'
  project_name: CSIRO Virtual Power Station 2
  what_happened: The VPS2 project identified that incentive schemes and approaches
    were required to ensure sufficient uptake of fully compliant inverters, storage,
    and controls, implying that voluntary adoption of compliant devices was insufficient
    without financial incentives.
  lesson_learnt: Do not rely on voluntary adoption of compliant DER hardware — incentive
    schemes are necessary to drive sufficient uptake of inverters, storage, and control
    systems that meet the technical standards required for coordinated DER dispatch
    programmes.
  issue_severity: moderate
  project_type: DER/customer-side
