- record_id: ARENA-DLV-14662
  source_title: 'Lessons From the Fringes: Australian Fringe-Of-Grid Projects in ARENA''s
    Portfolio'
  publish_date: 2018-06
  project_name: Lakeland Solar and Storage
  what_happened: The inverter provider for the Lakeland BESS underestimated the modelling
    complexity of the system, creating integration and commissioning challenges that
    added time to the project and reinforced the need to work closely with the DNSP
    and AEMO from the outset.
  lesson_learnt: Do not rely on inverter providers to independently scope the full
    modelling complexity of a utility-scale PV-BESS system in a FOG region — engage
    DNSP and AEMO early and budget for extended BESS commissioning hold points, including
    the possibility of operating without BESS during commissioning.
  issue_severity: moderate
  project_type: generation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: commissioning/integration
  proponent_type: project developer
  delay_category: commissioning/integration
  failure_mode: unvalidated integration
  outcome_class: delayed but recoverable
  secondary_failure_mode: coordination & stakeholders
  intervention_note: Document emphasises importance of working closely with DNSP and
    AEMO from outset and being prepared to operate without BESS during hold points.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hybrid systems
  source_pages: &id005
  - 12
  evidence_excerpt: Modelling complexity underestimated by inverter provider... Emphasises
    importance to work closely with DNSP and AEMO from outset and allow more time,
    especially as BESS commissioning adds time – should be prepared to operate without
    BESS (re hold points).
  confidence_note: 'project_type reconciled to ''generation'' from: generation (23/29),
    multi-technology/hybrid (6/29)'
