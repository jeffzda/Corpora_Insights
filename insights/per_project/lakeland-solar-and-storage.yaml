- record_id: ARENA-DLV-14658
  source_title: 'Lessons From the Fringes: Australian Fringe-Of-Grid Projects in ARENA''s
    Portfolio'
  publish_date: 2018-06
  project_name: Lakeland Solar and Storage
  what_happened: At the Lakeland project (13.3 MWDC solar PV / 1.4 MW / 5.3 MWh BESS),
    heavy rainfall caused an 8-week construction delay because the chosen skid-based
    battery solution was too heavy to use the local roads under wet conditions; a
    modular (non-skid) solution would have been more suitable.
  lesson_learnt: For remote FOG projects with limited road access, specify modular
    rather than skid-based equipment solutions — skid units can be too heavy for wet-season
    roads, causing multi-week construction delays that cascade into insurance and
    commissioning cost overruns.
  issue_severity: moderate
  project_type: generation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: construction/installation
  proponent_type: project developer
  delay_category: construction/installation
  failure_mode: unvalidated technical assumptions
  outcome_class: delayed but recoverable
  secondary_failure_mode: poor scoping
  intervention_note: null
  transferability: moderate
  delay_magnitude: 1-3 months
  technology_domain: hybrid systems
  source_pages: &id001
  - 12
  evidence_excerpt: Modular rather than skid solution generally most suitable for
    remote area; heavy rainfall saw 8-week delay as skids too heavy to use roads.
  confidence_note: 'project_type reconciled to ''generation'' from: generation (23/29),
    multi-technology/hybrid (6/29)'
