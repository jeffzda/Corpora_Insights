- record_id: ARENA-DLV-14659
  source_title: 'Lessons From the Fringes: Australian Fringe-Of-Grid Projects in ARENA''s
    Portfolio'
  publish_date: 2018-06
  project_name: Lakeland Solar and Storage
  what_happened: Lakeland could not source qualified electrical staff locally and
    had to fly workers in from Sydney and Brisbane, resulting in higher labour costs
    and scheduling delays. The unmanned site also presented an operational risk, illustrated
    by an air conditioning failure that tripped the entire BESS but would have required
    only a button-press to rectify had personnel been on site.
  lesson_learnt: Remote FOG project budgets must account for fly-in/fly-out electrical
    labour costs, and operational staffing plans should ensure on-site personnel presence
    to avoid trivial faults escalating into prolonged system outages — unmanned remote
    BESS sites are a material operational risk.
  issue_severity: moderate
  project_type: generation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: project developer
  delay_category: internal governance/resourcing
