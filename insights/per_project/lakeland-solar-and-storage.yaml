- record_id: ARENA-DLV-14660
  source_title: 'Lessons From the Fringes: Australian Fringe-Of-Grid Projects in ARENA''s
    Portfolio'
  publish_date: 2018-06
  project_name: Lakeland Solar and Storage
  what_happened: A geotechnical study for the Lakeland project was found to be inaccurate,
    understating the amount of rock on site and failing to identify all rock types
    present, leading to unforeseen construction costs and effort.
  lesson_learnt: Geotechnical studies for remote FOG sites should be comprehensive
    and independently verified before design freeze — inaccurate rock characterisation
    is a common source of unbudgeted construction cost in remote locations where mobilising
    additional equipment is expensive.
