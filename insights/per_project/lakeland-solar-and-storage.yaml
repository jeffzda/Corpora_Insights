- record_id: ARENA-DLV-14661
  source_title: 'Lessons From the Fringes: Australian Fringe-Of-Grid Projects in ARENA''s
    Portfolio'
  publish_date: 2018-06
  project_name: Lakeland Solar and Storage
  what_happened: Lakeland incurred unforeseen costs including Energy Import Network
    Charges, AEMO market fees, additional audit fees, and revenue loss from MLF adjustment,
    none of which were fully anticipated at the time of financial close; insurance
    costs were also higher than expected due to the longer construction period.
  lesson_learnt: FOG project financial models should explicitly provision for Energy
    Import Network Charges, AEMO market fees, MLF adjustment revenue impacts, and
    insurance extension costs — these are recurring unforeseen cost items across FOG
    projects that are typically under-budgeted by first-time proponents.
