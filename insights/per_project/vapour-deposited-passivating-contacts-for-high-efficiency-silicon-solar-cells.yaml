- record_id: ARENA-DLV-55052
  source_title: Vapour Deposited Passivating Contacts for High Efficiency Silicon
    Solar Cells
  publish_date: 2022-09
  project_name: Physical Vapour Deposited Passivating Contacts for High Efficiency
    Silicon Solar Cells
  what_happened: Overseas sputter target deliveries were delayed by multiple logistics
    failures — including incorrect shipping addresses, delivery to wrong addresses,
    low manufacturer priority, and COVID-19 disruptions to postal subcontractors —
    with the longest delay reaching approximately eight months for a single parcel.
  lesson_learnt: When procuring specialist materials from overseas for time-critical
    research projects, build significant logistics buffer into the project schedule,
    implement daily parcel tracking from dispatch, and avoid delivery companies known
    to change subcontractors — delays of up to eight months from logistics failures
    alone can derail project milestones.
  issue_severity: major
  project_type: null
  project_scale_band: lab/bench
  lifecycle_phase: procurement
  proponent_type: research organisation/university
  delay_category: procurement/supply chain
  failure_mode: execution & logistics
  outcome_class: delayed but recoverable
  secondary_failure_mode: null
  intervention_note: Team implemented parcel tracking and physical collection efforts
    to locate and retrieve misdirected parcels; certain delivery companies identified
    for avoidance in future.
  transferability: moderate
  delay_magnitude: 3-12 months
  technology_domain: solar PV
  source_pages: &id002
  - 9
  evidence_excerpt: It took us several weeks to find and collect some of the parcels
    with the longest being around eight months. COVID-19 also contributed to the slow
    postal service also as many delivery services changed their subcontractors during
    this time.
