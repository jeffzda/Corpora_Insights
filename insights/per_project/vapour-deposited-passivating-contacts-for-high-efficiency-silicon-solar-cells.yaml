- record_id: ARENA-DLV-55053
  source_title: Vapour Deposited Passivating Contacts for High Efficiency Silicon
    Solar Cells
  publish_date: 2022-09
  project_name: Physical Vapour Deposited Passivating Contacts for High Efficiency
    Silicon Solar Cells
  what_happened: Several purchased sputter targets did not meet the doping concentration
    specifications promised by manufacturers, making it difficult to fabricate in-situ
    doped n+ polySi films with sufficient dopant levels for good contact and passivation
    quality.
  lesson_learnt: Before purchasing specialist sputter targets — especially in small
    research quantities — request manufacturer-measured characterisation data confirming
    key parameters such as doping concentration; guaranteed specifications are rarely
    achievable for small orders but measured data provides meaningful quality assurance
    and prevents wasted experimental effort.
  issue_severity: moderate
  project_type: null
  project_scale_band: lab/bench
  lifecycle_phase: procurement
  proponent_type: research organisation/university
  delay_category: procurement/supply chain
  failure_mode: unvalidated technical assumptions
  outcome_class: delayed but recoverable
  secondary_failure_mode: execution & logistics
  intervention_note: Multiple sputter targets from various companies were tested to
    identify those meeting required characteristics; the project eventually achieved
    the passivation targets using qualifying targets.
  transferability: narrow
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id003
  - 9
  evidence_excerpt: The project had difficulties in purchasing in-situ doped n+ polySi
    films that have sufficient dopants for good contacts and high passivation quality.
    One of the main reasons is that, for some of the sputter targets, the characteristics,
    such as the doping concentration, are not as promised by the target manufacturer.
  confidence_note: issue_severity set to moderate as the problem required testing
    multiple alternative suppliers but did not halt the project entirely.
