- record_id: ARENA-DLV-55051
  source_title: Vapour Deposited Passivating Contacts for High Efficiency Silicon
    Solar Cells
  publish_date: 2022-09
  project_name: Physical Vapour Deposited Passivating Contacts for High Efficiency
    Silicon Solar Cells
  what_happened: COVID-19-related lab shutdowns caused both high-temperature annealing
    tube furnaces to fail simultaneously upon reopening. Replacement parts had to
    be shipped from the US, resulting in significant delays to solar cell fabrication
    and reproduction of high-performance polySi passivating contacts.
  lesson_learnt: Research projects relying on critical single-point-of-failure equipment
    should maintain backup parts on-site and develop contingency experiment plans
    — when two tube furnaces failed concurrently and parts required lengthy international
    shipping, the project suffered significant schedule delay that could have been
    partially mitigated with pre-positioned spares.
  issue_severity: major
