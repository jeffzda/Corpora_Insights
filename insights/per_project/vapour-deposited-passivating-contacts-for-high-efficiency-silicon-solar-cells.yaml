- record_id: ARENA-DLV-55054
  source_title: Vapour Deposited Passivating Contacts for High Efficiency Silicon
    Solar Cells
  publish_date: 2022-09
  project_name: Physical Vapour Deposited Passivating Contacts for High Efficiency
    Silicon Solar Cells
  what_happened: Importing POCl3 chemical source into Australia required extensive
    administrative approvals that consumed months and significantly slowed a key doping
    optimisation workstream. Australian import regulations for non-standard chemicals
    had become increasingly complex, with some import companies refusing small research
    orders due to the administrative burden.
  lesson_learnt: Place orders for regulated chemicals requiring Australian Government
    import approval before the project starts — approval processes can take months
    to years, and import companies routinely reject small research quantities due
    to administrative burden; coordinating combined orders across multiple Australian
    universities may reduce per-project overhead.
  issue_severity: major
  project_type: null
  project_scale_band: lab/bench
  lifecycle_phase: approvals/contracting
  proponent_type: research organisation/university
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: poor scoping
  intervention_note: Forms were eventually completed and approval obtained, allowing
    the POCl3 diffusion method to be tested; the document notes that combining orders
    with other Australian universities is a potential future mitigation.
  transferability: moderate
  delay_magnitude: 3-12 months
  technology_domain: solar PV
  source_pages: &id004
  - 9
  - 10
  evidence_excerpt: In Australia, the processes for importing products out of norm
    became more and more complicated over the years and require many administrative
    roadblocks, resulting in months or even years until delivery. In this project,
    completing the forms, having the approval to import POCl3 source was very time
    consuming, which significantly slowed down the project progress.
  confidence_note: delay_magnitude set to 3–12 months based on document stating 'months
    or even years' but describing the project impact as 'significantly slowed' rather
    than halted for years; conservative lower-bound applied.
