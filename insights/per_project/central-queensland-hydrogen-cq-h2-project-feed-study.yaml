  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: CQ-H2 sought to mitigate the timing mismatch by contracting with
    an energy supplier with a larger renewable energy portfolio, reducing exposure
    to the risks of directly developing, permitting, constructing and operating over
    2,000 MW of renewable energy.
  transferability: broad
  delay_magnitude: null
