  publish_date: 2025-10
  project_name: Central Queensland Hydrogen Project (CQ-H2)
  what_happened: CQ-H2's operational model required 24/7 operations with scheduled
    maintenance shutdowns lasting several weeks. The project recognised that OEM long-term
    service agreements for electrolysers and compressors would be critical from commissioning
    through operations, and planned for OEM representatives to be embedded in commissioning
    teams and for factory acceptance testing and hands-on training before installation.
  lesson_learnt: For first-of-a-kind large-scale hydrogen facilities, operators should
    secure OEM long-term service agreements for electrolysers and compressors from
    commissioning commencement, and require OEMs to embed representatives in commissioning
    teams — the absence of local operating precedent means OEM support is essential
    for reliable ramp-up and ongoing operations.
