  project_name: Central Queensland Hydrogen Project (CQ-H2)
  what_happened: Large-scale hydrogen production requires significant water inputs;
    conventional alkaline electrolyser cooling via cooling towers is water-intensive.
    CQ-H2 adopted a closed-circuit cooling system for electrolysers and compressors
    in consultation with OEMs, reducing water demand by approximately 58% compared
    to a conventional cooling solution (from 16 L/kg to 14 L/kg of hydrogen gas with
    further rectifier cooling improvements).
  lesson_learnt: Proponents should consider closed-circuit air-cooled systems rather
    than conventional cooling towers for electrolyser and compressor cooling — developed
    in consultation with OEMs — to substantially reduce raw water demand and demonstrate
    responsible water stewardship, particularly in water-constrained regions.
