  what_happened: As a first-of-a-kind large-scale hydrogen facility in Australia,
    CQ-H2 recognised that a new workforce with specialised skills would need to be
    built from scratch. The project identified a risk of unplanned resource diversion
    away from local businesses in regional Gladstone if workforce planning and training
    programs were not developed during FEED.
  lesson_learnt: Proponents of large hydrogen projects in regional areas should develop
    training, education, and workforce plans during the FEED Study — given the novel
    nature of hydrogen facilities, the absence of an existing skilled workforce pool
    creates a risk of resource diversion from local businesses, which must be addressed
    proactively through community labour protocols.
