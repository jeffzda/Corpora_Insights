  what_happened: CQ-H2's FEED Study identified that connection to the Powerlink 275
    kV transmission network at 760 MW full Phase 1 load required a new transmission
    line to Larcom Creek substation and an upgrade of the Calvale to Calliope River
    transmission line — large capital-intensive augmentations that fell under a regulatory
    framework better suited to incremental expansions.
  lesson_learnt: Early and sustained engagement with transmission network operators
    is critical for large hydrogen projects requiring significant grid augmentation
    — proponents should initiate connection discussions before FEED commencement and
    negotiate risk-sharing arrangements with the network owner to avoid being stranded
    by capital-intensive upgrade requirements.
