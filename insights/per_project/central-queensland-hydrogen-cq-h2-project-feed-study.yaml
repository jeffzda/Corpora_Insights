  project_name: Central Queensland Hydrogen Project (CQ-H2)
  what_happened: The CQ-H2 Project was discontinued in June 2025 after completing
    a FEED Study between May 2023 and June 2025. The project had reached an advanced
    Class 4 design definition for the hydrogen production facility and hydrogen gas
    pipeline but did not proceed to Final Investment Decision.
  lesson_learnt: Large-scale first-of-a-kind hydrogen projects face fundamental commercial
    viability challenges that FEED-level investment alone cannot resolve — proponents
    should establish clear go/no-go commercial criteria (offtake commitment, hydrogen
    price, funding access) before committing to full FEED expenditure.
