    areas with large construction workforces risk diverting labour and housing resources
    away from existing local businesses and communities. The project developed social
    impact assessment processes, community engagement campaigns, and planned social
    impact management frameworks to address this.
  lesson_learnt: Large hydrogen construction projects in regional areas should conduct
    social impact assessments and develop social impact management plans during FEED
    — the concentration of a large construction workforce in a regional centre creates
    risks around housing, accommodation, community health and safety, and local amenity
    that require early identification and mitigation.
