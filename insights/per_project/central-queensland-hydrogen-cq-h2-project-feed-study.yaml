  what_happened: The mismatch in minimum turndown rates between the hydrogen production
    facility (10–15%) and downstream offtake facilities — ammonia synthesis (~30%)
    and hydrogen liquefaction (~50%) — required dedicated gaseous hydrogen storage
    to buffer supply and maintain steady offtake operations under variable renewable
    energy input.
  lesson_learnt: Proponents integrating hydrogen production with ammonia synthesis
    or liquefaction offtake must account for mismatched turndown rates by incorporating
    adequate buffer storage; pipeline line-pack storage is an effective and cost-efficient
    solution for this purpose.
