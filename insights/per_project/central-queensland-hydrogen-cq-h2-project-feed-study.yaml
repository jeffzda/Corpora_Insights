- record_id: ARENA-DLV-51957
  source_title: Stanwell - Central Queensland Hydrogen (CQ-H2) Project FEED study
    - Public FEED Summary Report
  publish_date: 2025-10
  project_name: Central Queensland Hydrogen Project (CQ-H2)
  what_happened: Market engagement with major global construction contractors revealed
    very limited appetite for a single EPC contractor to assume design, construction,
    and performance risk for a first-of-a-kind large-scale renewable hydrogen development,
    leading CQ-H2 to adopt an EPCM contracting model instead.
  lesson_learnt: Proponents of large, complex, first-of-a-kind hydrogen projects should
    not assume a traditional single EPC model is available; market engagement is likely
    to reveal limited contractor appetite for that model, and an EPCM arrangement
