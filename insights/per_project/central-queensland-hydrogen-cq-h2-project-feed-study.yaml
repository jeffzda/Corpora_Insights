  publish_date: 2025-10
  project_name: Central Queensland Hydrogen Project (CQ-H2)
  what_happened: Renewable energy project developers — particularly wind farm developers
    — required financial commitments from CQ-H2 prior to the hydrogen project's FID
    date due to the long lead times involved in developing wind projects, creating
    a timing mismatch between energy supply commitments and the hydrogen FID.
  lesson_learnt: Hydrogen project proponents should consider partnering with energy
    suppliers that have a large existing portfolio of renewable energy projects, rather
    than developing renewable energy directly, to manage the timing mismatch between
    renewable energy financial commitments and hydrogen FID.
