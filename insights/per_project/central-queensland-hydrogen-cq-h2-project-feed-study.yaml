- record_id: ARENA-DLV-51952
  source_title: Stanwell - Central Queensland Hydrogen (CQ-H2) Project FEED study
    - Public FEED Summary Report
  publish_date: 2025-10
  project_name: Central Queensland Hydrogen Project (CQ-H2)
  what_happened: Securing an offtaker during the FEED Study was identified as a key
    challenge because offtakers were generally unwilling to commit financially during
    the development phase of the project. CQ-H2 maintained two offtake pathways —
    supply to an ammonia plant and supply to a Japanese liquefied hydrogen offtaker
    — to manage this risk.
  lesson_learnt: Proponents should progress multiple offtake pathways during the FEED
    Study as a way of de-risking offtake uncertainty, given that offtakers are typically
    unwilling to commit financially during the development phase of large hydrogen
    projects.
