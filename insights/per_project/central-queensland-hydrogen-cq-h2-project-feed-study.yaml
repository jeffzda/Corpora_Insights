  publish_date: 2025-10
  project_name: Central Queensland Hydrogen Project (CQ-H2)
  what_happened: Electrolyser membrane degradation at approximately 1% per year increases
    electricity consumption incrementally over the facility's life. CQ-H2 developed
    an optimised membrane replacement regime — capping average fleet degradation at
    5% through four replacement cycles rather than following the OEM-recommended end-of-life
    replacement every 10 years — estimated to save approximately $250 million over
    the project life.
  lesson_learnt: Proponents should optimise electrolyser membrane replacement schedules
    based on fleet-level degradation modelling rather than simply following OEM end-of-life
    recommendations — capping average degradation at 5% rather than replacing at ~10-year
    intervals is estimated to save approximately $250 million over a 30-year project
    life through reduced energy costs.
