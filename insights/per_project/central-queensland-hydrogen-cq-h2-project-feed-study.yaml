  publish_date: 2025-10
  project_name: Central Queensland Hydrogen Project (CQ-H2)
  what_happened: CQ-H2 was planned as a staged project with an ultimate scale of 1,200
    tpd hydrogen and 2,880 MW of electrolysers, with Phase 1 at 200 tpd/720 MW. The
    financial model was based on a $7.39/kg hydrogen production price over the first
    15 years — without grant funding, concessional funding, or the Hydrogen Production
    Tax Incentive — indicating that government support mechanisms were necessary for
    commercial viability.
  lesson_learnt: At current CAPEX and energy cost levels, large-scale renewable hydrogen
    projects in Australia are likely to require multiple forms of government support
    (grants, concessional finance, production tax incentives) to achieve commercial
    viability — proponents should model hydrogen price with and without these mechanisms
    and engage with policy processes to ensure they are accessible at the time of
    FID.
