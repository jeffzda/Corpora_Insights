  what_happened: A trade-off study evaluating a broad range of gaseous hydrogen storage
    alternatives — including fixed vessels at various pressures, multi-element gas
    containers, and pipeline line-pack — determined that pipeline packing was the
    safest and most cost-effective storage solution for Phase 1, meeting the full
    45-tonne storage requirement at only 68 barg rather than the 350 barg required
    for high-pressure vessels.
  lesson_learnt: Proponents should consider pipeline storage (line-pack) as the preferred
    means of storing gaseous hydrogen in integrated supply chains — it offers lower
    operating pressure, fewer leak points, acceptable fatigue life under frequent
    pressure cycling, and lower installed cost compared to fixed-vessel alternatives.
