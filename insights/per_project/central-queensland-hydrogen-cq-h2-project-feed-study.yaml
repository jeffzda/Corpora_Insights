  publish_date: 2025-10
  project_name: Central Queensland Hydrogen Project (CQ-H2)
  what_happened: The current regulatory regime governing access to transmission and
    water infrastructure was found to suit incremental capacity expansions but is
    poorly suited to large, complex first-mover hydrogen projects requiring substantial
    infrastructure augmentation. Risk-sharing arrangements between proponents and
    infrastructure owners were absent, creating a barrier to foundation customer arrangements.
  lesson_learnt: Proponents of large hydrogen projects should endeavour to negotiate
    infrastructure access terms that appropriately share risk and cost with foundation
    customers; where this is not possible, policy or regulatory changes may be required
    to enable first-mover projects dependent on capital-intensive infrastructure augmentations.
