  publish_date: 2025-10
  project_name: Central Queensland Hydrogen Project (CQ-H2)
  what_happened: Renewable energy costs represent approximately 60% of the levelised
    cost of hydrogen for CQ-H2, making energy price the single largest driver of hydrogen
    production cost. The optimised hydrogen production price of $7.39/kg (real, 2024)
    did not incorporate grant funding, concessional funding, or the Hydrogen Production
    Tax Incentive.
  lesson_learnt: Proponents should undertake detailed modelling to optimise hydrogen
    production load given the importance of energy load flexibility — curtailing load
    when spot prices are high and increasing it when prices are low — as energy cost
    dominates the levelised cost of hydrogen at approximately 60%.
