  project_name: Central Queensland Hydrogen Project (CQ-H2)
  what_happened: CQ-H2's total Phase 1 capital cost estimate reached $3,041 million
    (hydrogen production facility and pipeline only), with a 12% contingency ($320
    million) included based on a detailed cost risk analysis using Monte Carlo simulation
    and schedule risk analysis. The estimate was prepared at an advanced Class 4 level
    using material take-offs and OEM equipment pricing rather than factoring.
  lesson_learnt: Large-scale first-of-a-kind hydrogen projects require robust cost
    estimating methodology — CQ-H2 used a Class 4 estimate with detailed material
    take-offs and OEM equipment pricing rather than factoring, yielding a 12% contingency;
    proponents should plan for a FEED refresh to achieve Class 3 accuracy (-15% to
    +10%) before seeking financial close.
