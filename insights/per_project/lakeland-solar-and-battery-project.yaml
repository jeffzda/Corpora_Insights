- record_id: ARENA-DLV-4767
  source_title: Insights From The Portfolio of Projects Funded Under The Regional Australia's Renewables Program
  publish_date: 2017-03
  project_name: Lakeland Solar and Battery Project
  what_happened: The Lakeland fringe-of-grid project deployed 13 MW of solar PV with a 1.4 MW / 5.3 MWh battery system designed to provide both grid support and stand-alone operation capability — a dual-mode
    design that required the battery to serve network services and islanding functions simultaneously.
  lesson_learnt: Fringe-of-grid battery systems designed to serve both grid support and stand-alone operation must have control systems and contractual arrangements that explicitly govern mode-switching
    — dual-purpose battery assets create technical and commercial complexity that must be addressed in design and offtake agreements.
