- record_id: ARENA-DLV-25911
  source_title: Review of ARENA's Reliability Portfolio
  publish_date: 2020-01
  project_name: deX Decentralised Energy Exchange (GreenSync)
  what_happened: ARENA's early-stage funding of the deX platform enabled GreenSync to develop what became a globally competitive DER coordination platform. Without the initial ARENA grant, the platform
    would not have progressed from concept to commercial product. It was subsequently deployed by Simply Energy in its VPPx project and utilised by SA Power Networks.
  lesson_learnt: Early-stage grant funding for digital platform concepts in the DER coordination space can have outsized leverage — enabling progression from idea to globally competitive commercial product
    — when the funding gap between concept and commercial viability is the primary barrier.
