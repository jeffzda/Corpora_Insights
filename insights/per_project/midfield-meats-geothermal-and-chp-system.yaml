- record_id: ARENA-DLV-11012
  source_title: Renewable Energy Options for Industrial Process Heat
  publish_date: 2019-08
  project_name: Midfield Meats Geothermal and CHP System
  what_happened: Midfield Meats abattoir in Warrnambool, VIC, integrated a geothermal bore (drilled to 700 m) with a natural gas CHP plant to supply hot water and reduce reliance on mains water, natural
    gas and grid electricity. The primary driver for the bore was water supply, not heat — the economics of heat alone would not have supported the capital cost of the bore, but water economics did. The
    CHP plant was financed and owned by a third-party energy performance contractor.
  lesson_learnt: Geothermal heat projects in regional industrial settings are most viable when combined with another primary driver such as water security — developers should assess multi-benefit stacking
    (water + heat + electricity) to build a viable business case for bore capital costs.
