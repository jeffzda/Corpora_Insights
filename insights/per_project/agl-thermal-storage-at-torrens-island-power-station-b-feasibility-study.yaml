  evidence_excerpt: A key finding of this Project was that the TES cannot be integrated
    with the current boilers. The boilers at the TIPS B are designed with a furnace
    to combust gas and transfer heat through radiative, conduction and convection
    heat transfer processes, with radiative being the largest component. Heat transfer
    from the TES largely occurs due to conduction and convection, with little to no
    radiative heat being transferred via radiation given that there is no high temperature
    combustion taking place. As a result, the boilers are not suitable to transfer
    heat from the TES into the working fluid (steam). Consequently, installation of
    HRSGs is required for TES to be integrated into an existing thermal power station.
  confidence_note: Technology domain set to 'battery storage' as the closest available
    value; TES is a thermal storage technology not perfectly mapped to any single
    allowed value. project_scale_band set to 'demonstration' as the project was a
    desktop feasibility study with no commercial revenue stream established.
