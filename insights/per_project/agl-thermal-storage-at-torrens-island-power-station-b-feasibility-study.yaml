- record_id: ARENA-DLV-53451
  source_title: Knowledge Sharing Report for the AGL Thermal Storage at Torrens Island
    Power Station B Feasibility Study
  publish_date: 2024-03
  project_name: AGL Thermal Storage at Torrens Island B Power Station Feasibility
    Study (Project Calor)
  what_happened: The feasibility study found that thermal energy storage (TES) could
    not be integrated with the existing boilers at TIPS B. The boilers transfer heat
    primarily through radiation, while TES heat transfer relies on conduction and
    convection, making the existing boilers unsuitable. This required replacing all
    four boilers with Heat Recovery Steam Generators (HRSGs) despite the project being
    designed to replace only one of four 200MW gas-fired generation units.
  lesson_learnt: When evaluating TES retrofit into an existing thermal power station,
    do not assume existing boilers can be reused — the fundamental difference in heat
    transfer mechanisms (radiation vs. convection/conduction) necessitates full boiler
    replacement with HRSGs, which significantly increases capital cost and development
    complexity beyond initial assumptions.
  issue_severity: major
  project_type: storage
