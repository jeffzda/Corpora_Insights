    points were available at TIPS B, the additional transformer and switchboard infrastructure
    required represented a significant capital cost and engineering scope.'
  lesson_learnt: TES charging infrastructure at utility scale requires extensive high-voltage
    electrical integration work (including large transformers and switchboards) that
    should be scoped and costed explicitly early in feasibility — the availability
    of existing HV connection points does not eliminate the need for substantial new
    MV/LV electrical equipment.
