- record_id: ARENA-DLV-53454
  source_title: Knowledge Sharing Report for the AGL Thermal Storage at Torrens Island
    Power Station B Feasibility Study
  publish_date: 2024-03
  project_name: AGL Thermal Storage at Torrens Island B Power Station Feasibility
    Study (Project Calor)
  what_happened: The project found that integrating TES into TIPS B was technically
    feasible but commercially unviable. Capital cost estimates ranged from $1B to
    $1.2B (inclusive of 30% contingency) for a 1,600 MWh electrical-equivalent system,
    equating to a levelised cost of storage (LCOS) of $220–$320/MWh. The original
    hypothesis — that leveraging existing infrastructure would reduce capital cost
    — was not borne out, as significant new plant (HRSGs, transformers, switchboards)
    was required.
  lesson_learnt: Feasibility studies for TES retrofits into gas power stations should
    not assume that existing infrastructure reuse will deliver cost savings competitive
    with alternative storage technologies — the need to install HRSGs and substantial
    electrical infrastructure can result in capital costs of $1B+ and LCOS above $220/MWh,
    undermining commercial viability.
