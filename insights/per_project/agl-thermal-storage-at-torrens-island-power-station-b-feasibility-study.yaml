    industrial process heat as an alternative or complementary value stream from the
    outset — the technology's high heat storage efficiency (99% charge-discharge)
    makes it far more suitable for industrial decarbonisation than for electricity
    generation via steam turbine, and this pathway may determine commercial viability.
