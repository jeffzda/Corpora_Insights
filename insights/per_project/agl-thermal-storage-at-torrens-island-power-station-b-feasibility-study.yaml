- record_id: ARENA-DLV-53462
  source_title: Knowledge Sharing Report for the AGL Thermal Storage at Torrens Island
    Power Station B Feasibility Study
  publish_date: 2024-03
  project_name: AGL Thermal Storage at Torrens Island B Power Station Feasibility
    Study (Project Calor)
  what_happened: The closed-loop heat transfer cycle used by MGA Thermal achieved
    approximately 87–88% HRSG efficiency compared to 83% for Kraftblock's open-loop
    design. The open-loop design was chosen by Kraftblock to allow greater depth of
    discharge and reduce storage volume, but the efficiency gain from the closed-loop
    cycle outweighed this benefit, resulting in MGA Thermal requiring less total gross
    storage volume (5,000 MWh vs 7,467 MWh for Kraftblock).
  lesson_learnt: For TES systems integrated with steam generation, a closed-loop heat
    transfer fluid cycle (e.g. recycled inert gas) provides materially higher HRSG
    efficiency (~87% vs ~83%) and lower total storage volume requirements compared
    to open-loop designs — the capital cost savings from reduced storage volume in
    a closed-loop design can offset the higher auxiliary power draw from the gas recirculation
    system.
