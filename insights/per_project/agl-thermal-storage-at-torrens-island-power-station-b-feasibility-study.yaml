  what_happened: Installing TES at TIPS B would require a footprint of 18,330–25,000
    m², requiring the complete demolition of all four existing boilers even though
    the TES was designed to replace only one of four gas-fired generation units. This
    made the project effectively incompatible with continuing to operate the remaining
    three generation units during or after TES installation.
  lesson_learnt: A TES retrofit designed to replace a single generation unit at an
    existing thermal power station may require demolition of all existing boilers
    to provide sufficient footprint, rendering the remaining units inoperable — this
    critical site constraint should be assessed at the earliest stage of feasibility
    to determine whether phased or partial replacement is viable.
