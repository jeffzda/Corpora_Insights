- record_id: ARENA-DLV-53452
  source_title: Knowledge Sharing Report for the AGL Thermal Storage at Torrens Island
    Power Station B Feasibility Study
  publish_date: 2024-03
  project_name: AGL Thermal Storage at Torrens Island B Power Station Feasibility
    Study (Project Calor)
  what_happened: The overall round-trip efficiency (RTE) of integrating TES into the
    existing TIPS B steam turbine was estimated at only 37% (Kraftblock) to 40% (MGA
    Thermal), driven primarily by the inherent inefficiency of the Rankine cycle steam
    turbine (~45% efficient). This low RTE meant the TES had to store 5,000–7,467
    MWh of gross thermal energy to deliver 1,600 MWh of electrical output, massively
    increasing the required scale and capital cost of the system.
  lesson_learnt: The hypothesis that leveraging existing thermal power station infrastructure
    (particularly steam turbines) would reduce TES costs relative to greenfield storage
    should be tested rigorously early in feasibility — the low Rankine cycle efficiency
    (~45%) dominates overall RTE and forces a disproportionate increase in storage
    volume and capital cost, potentially eliminating the cost advantage over alternative
    storage technologies.
