  what_happened: The study found that the maximum achievable output temperature of
    the heat transfer fluid from the TES is a critical parameter determining which
    industrial sectors can use the stored heat. MGA Thermal's current technology addresses
    heat requirements up to 750°C, with development underway for very high temperature
    (above 650°C) applications such as alumina calcination, iron and steel, and cement
    production.
