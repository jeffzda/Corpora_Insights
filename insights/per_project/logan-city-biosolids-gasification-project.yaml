  what_happened: Carbon monoxide (CO) concentrations exceeded or approached the 125
    mg/Nm³ limit during several runs, particularly when throughput was increased.
    CO exceedances were associated with inadequate turbulent mixing in the thermal
    oxidiser and high particulate loads at elevated feed rates.
  lesson_learnt: CO slip in biosolids gasification oxidisers is strongly linked to
    inadequate turbulent mixing and high particulate loads; address by installing
    a swirl vane at the oxidiser inlet, a directional secondary air nozzle, and a
    deflector baffle at the outlet — and specify an electrostatic precipitator to
    control particulates at full-scale throughput.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: government/public-sector body
  delay_category: commissioning/integration
