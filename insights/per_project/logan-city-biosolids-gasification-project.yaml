- record_id: ARENA-DLV-29056
  source_title: Delivering the Design for Australia's First Biosolids Gasification
    Facility
  publish_date: 2022-03
  project_name: Loganholme Wastewater Treatment Plant Gasification Facility Demonstration
    Project
  what_happened: The drying and gasification processes were delivered under separate
    subcontracts, creating a critical interface dependency where the particle size
    distribution and dryness from the dryers had to meet strict requirements for the
    gasification process to function correctly. The conveyance systems between these
    processes were a key integration risk.
  lesson_learnt: When a first-of-kind facility is split across multiple subcontracts
    with tight process interface requirements, define and contractually specify the
    interface performance parameters (particle size distribution, moisture content)
    before finalising subcontract boundaries — and use a shared 3D model to coordinate
    conveyance design across subcontractors.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: approvals/contracting
