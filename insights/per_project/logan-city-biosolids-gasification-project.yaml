  publish_date: 2021-03
  project_name: Loganholme Wastewater Treatment Plant Biosolids Gasification Demonstration
    Plant
  what_happened: The heat balance on Source 1 biosolids (lower calorific value due
    to stockpile degradation) was inadequate — the radiant heat exchanger on the thermal
    oxidiser had to be partially disabled to maintain adequate oxidiser temperatures.
    The heat balance on Source 2 biosolids (representative of Loganholme material)
    confirmed that forecast heat recovery of 1.5 MW at design rate exceeds the 1.4
    MW requirement, but the design margin is less than 10% and is sensitive to dewatering
    performance.
  lesson_learnt: Conduct heat balance trials only with fresh feedstock representative
    of the intended full-scale supply; a design margin of less than 10% on heat recovery
    is insufficient given sensitivity to dewatering performance variability — add
    a condensing heat exchanger downstream of the main flue gas heat exchanger to
    achieve at least 20% margin.
