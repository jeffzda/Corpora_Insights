  project_name: Loganholme WWTP Gasification Facility Demonstration Project
  what_happened: The full-scale facility achieved 82% average destruction of microplastics,
    a significant improvement over the 60% average achieved in the demonstration plant.
    The improvement was attributed to particle size optimisation from the belt dryers
    producing a crumb form rather than the sludge/drum dryers and paddle dryers used
    in the demonstration plant.
  lesson_learnt: Dryer technology selection materially affects downstream gasification
    performance for microplastic destruction — belt dryers producing a uniform crumb
    feedstock (3–10 mm) rather than paddle or drum dryers yield significantly higher
    microplastic destruction rates (82% vs 60%), and this parameter should be explicitly
    modelled and specified at the design stage.
