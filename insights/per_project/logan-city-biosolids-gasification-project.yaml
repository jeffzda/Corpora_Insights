- record_id: ARENA-DLV-64869
  source_title: 'Loganholme Wastewater Treatment Plant: Biosolids Gasification Demonstration
    Plant (PBE-075)'
  publish_date: 2021-03
  project_name: Loganholme Wastewater Treatment Plant Biosolids Gasification Demonstration
    Plant
  what_happened: 'Biosolids from Source 1 and Source 2 (both sourced from Victorian
    WWTPs) contained PFAS concentrations that exceeded Queensland trigger values for
    soil application (Source 1 average: 0.173 mg/kg PFOS+PFHxS; Source 2 average:
    0.367 mg/kg PFOS+PFHxS). Following gasification, biochar PFAS concentrations were
    below 0.005 mg/kg or non-detectable, demonstrating 94% overall PFAS destruction
    across the mass balance.'
  lesson_learnt: Biosolids gasification effectively destroys PFAS to below soil application
    trigger values (94% overall destruction confirmed by mass balance); this makes
    gasification a technically viable solution for biosolids that would otherwise
    be excluded from land application under Queensland's End of Waste Code for Biosolids,
    and should be highlighted in regulatory engagement for full-scale facility approvals.
  issue_severity: none
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: government/public-sector body
  delay_category: null
