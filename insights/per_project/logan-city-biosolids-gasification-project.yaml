  publish_date: 2021-03
  project_name: Loganholme Wastewater Treatment Plant Biosolids Gasification Demonstration
    Plant
  what_happened: The absorption scrubber was unable to handle the dust loads generated
    by biosolids gasification (estimated 4–10 times higher than plant-derived biomass).
    It had to be upgraded mid-trial with a venturi stage, which improved emissions
    performance but reduced induced-draft fan flow capacity by 15%, directly limiting
    the achievable biosolids feed rate.
  lesson_learnt: Biosolids generate dust loadings far exceeding those of plant-derived
    biomass; size the scrubber and ID fan for biosolids-specific particulate loads
    from the outset, and include a high-pressure-drop venturi plus a downstream PM2.5
    capture device rather than relying on a barrier filter that will require impractically
    frequent servicing.
