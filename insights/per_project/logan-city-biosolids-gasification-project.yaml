  what_happened: The common access platform in the dryer building was a complex multi-function
    element — simultaneously serving as a walkway, piping corridor, and structural
    support for equipment including a bucket elevator, screeners, and belt conveyor.
    Structural design could not be finalised until all vendor equipment details were
    available, creating a design dependency bottleneck.
  lesson_learnt: In multi-vendor process facilities, identify structural elements
    with cross-vendor dependencies early and explicitly manage them as long-lead design
    items — do not allow structural design to be blocked by late vendor information,
    as this can hold up construction sequencing.
