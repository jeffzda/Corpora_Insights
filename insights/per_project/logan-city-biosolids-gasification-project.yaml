  what_happened: All Australian state legislation was silent on requirements for reuse
    of char generated from biosolids in agriculture, creating a regulatory gap that
    required Logan City Council to pioneer the development of an End of Waste (EoW)
    code for biochar to enable the agricultural reuse pathway that underpins the project's
    carbon sequestration value.
  lesson_learnt: Biosolids gasification projects intending to reuse biochar in agriculture
    must account for the absence of any applicable state regulatory framework — proponents
    should engage early with regulators to develop an End of Waste pathway, as this
    approval process is not routine and represents a significant additional workload
    not typical of conventional biosolids disposal projects.
