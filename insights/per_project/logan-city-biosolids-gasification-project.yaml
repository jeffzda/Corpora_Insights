  publish_date: '2024-08-23'
  project_name: Loganholme WWTP Gasification Facility Demonstration Project
  what_happened: The gasification facility achieved partial compliance with the Environmental
    Authority (EA) air emission conditions. Most parameters were within limits, but
    challenges remained with online CEMS monitoring of CO and NOx, and with demonstrating
    compliance with PFAS stack destruction requirements (measured PFAS stack emissions
    of 145.50 mg/Nm3 against a percentage destruction obligation rather than a concentration
    limit). Mercury stack emissions (0.06 mg/Nm3) marginally exceeded the 0.05 mg/Nm3
    limit.
  lesson_learnt: Biosolids gasification facilities processing PFAS-contaminated feedstocks
    face novel and evolving air quality compliance obligations that cannot be resolved
    simply by meeting concentration limits — proof of PFAS percentage destruction
    across the thermal oxidiser requires dedicated stack-to-hearth duct mass-balance
    monitoring. Engage the regulator early and continuously to agree monitoring protocols
    before commissioning, and build in backup thermal capacity (diesel burner) for
    oxidiser stability.
