  delay_category: null
  failure_mode: unvalidated integration
  outcome_class: successful demonstration
  secondary_failure_mode: poor scoping
  intervention_note: Vendor-supplied 3D designs were incorporated into an integrated
    3D model to coordinate conveyance systems across subcontract boundaries and protect
    product integrity throughout the process.
  transferability: moderate
  delay_magnitude: null
  technology_domain: bioenergy
  source_pages: &id006
  - 10
  evidence_excerpt: The drying and gasification processes were delivered under separate
    subcontracts, with the particle size distribution produced from the dryers having
    to meet strict requirements to assist the performance of the gasification process.
    The conveyance systems played a big factor in this integration with the products
    integrity being protected throughout the process, utilising 3D designs from vendors
    to enable an integrated 3D model.
