  publish_date: '2024-08-23'
  project_name: Loganholme WWTP Gasification Facility Demonstration Project
  what_happened: Facility reliability during the first year of commissioning and optimisation
    was lower than planned. The initial approach of applying limited redundancy —
    similar to a standard dewatering plant — proved incorrect for a gasification production
    facility. Unexpected component replacements and higher personnel requirements
    drove the first-year maintenance cost to $1.2 million, the single largest operating
    cost item.
  lesson_learnt: A biosolids gasification facility must be engineered and resourced
    as a continuous production plant, not a dewatering facility — limited redundancy
    assumptions will result in high unplanned downtime, unexpected component failures,
    and significantly elevated first-year maintenance costs. Build in redundant equipment
    and critical spare parts from the design stage.
