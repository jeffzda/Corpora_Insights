  publish_date: '2024-08-23'
  project_name: Loganholme WWTP Gasification Facility Demonstration Project
  what_happened: The original business case for gasification was developed when haulage
    costs for 34,000 tonnes per annum of dewatered biosolids to agricultural land
    300 km away were approximately $1.8 million per annum. Between 2019 and the time
    of reporting, haulage costs increased by 300% to a projected $5.4 million by mid-2024,
    fundamentally changing the economics in favour of on-site treatment.
  lesson_learnt: Business cases for biosolids gasification (and similar waste-to-energy
    projects displacing long-haul logistics) are highly sensitive to transport cost
    escalation — a 300% haulage cost increase over five years at Loganholme validated
    the gasification investment well beyond original forecasts. Project developers
    and funders should explicitly model haulage cost escalation scenarios when assessing
    the economics of on-site treatment alternatives.
