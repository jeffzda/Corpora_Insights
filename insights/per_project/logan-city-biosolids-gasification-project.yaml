  what_happened: The first-year operating cost of the full-scale gasification facility
    was $3,723,000, dominated by maintenance ($1,200,000, 32%), LPG ($500,000, 13%),
    biosolids haulage during offline periods ($590,000, 16%), and polymer ($415,000,
    11%). This compares against a projected haulage-only cost of $5.4 million per
    annum for conventional biosolids management.
  lesson_learnt: First-year operating costs for a FOAK biosolids gasification facility
    will be materially higher than steady-state projections due to maintenance, unplanned
    downtime and residual haulage costs during offline periods — budget accordingly
    with a contingency for maintenance and spare parts in Year 1, and assess financial
    viability against the full lifecycle trajectory rather than first-year costs.
