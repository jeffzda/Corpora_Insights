  source_title: 'Loganholme Wastewater Treatment Plant: Biosolids Gasification Demonstration
    Plant (PBE-075)'
  publish_date: 2021-03
  project_name: Loganholme Wastewater Treatment Plant Biosolids Gasification Demonstration
    Plant
  what_happened: Bulk feed handling via a modified grain silo was abandoned early
    in the trials due to blockages. A steeper-angled transfer hopper was found to
    be more suitable. Long-distance road transport of biosolids (over 3,000 km) increased
    the dust fraction in already degraded material, exacerbating feed handling problems.
  lesson_learnt: For biosolids gasification plants, minimise product handling and
    storage to reduce fines generation; avoid bulk silo designs in favour of steeper-angled
    hoppers, and account for dust fraction increase caused by long-distance transport
    when specifying feed systems for demonstration plants sourcing materials remotely.
