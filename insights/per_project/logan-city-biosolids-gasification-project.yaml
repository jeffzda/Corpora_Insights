- record_id: ARENA-DLV-64877
  source_title: 'Loganholme Wastewater Treatment Plant: Biosolids Gasification Demonstration
    Plant (PBE-075)'
  publish_date: 2021-03
  project_name: Loganholme Wastewater Treatment Plant Biosolids Gasification Demonstration
    Plant
  what_happened: The throughput of the demonstration plant was capped below its maximum
    continuous rate of 650 kg/hr throughout the trial program to maintain compliance
    with air emission limits. The maximum processing rate achieved was 600 kg/hr,
    and most reliability runs were conducted at 85% of design feed rate (480 kg/hr).
    Increasing throughput above this level caused CO and particulate exceedances.
  lesson_learnt: Throughput-linked emissions interactions (CO and particulates increasing
    with feed rate) must be designed out before attempting full-capacity reliability
    testing; specify particulate control equipment (ESP) and oxidiser turbulence improvements
    upfront so that reliability runs can be conducted at or above design throughput
    without emissions exceedances compromising test validity.
