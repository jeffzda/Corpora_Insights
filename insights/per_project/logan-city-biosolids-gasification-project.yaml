- record_id: ARENA-DLV-29053
  source_title: Delivering the Design for Australia's First Biosolids Gasification
    Facility
  publish_date: 2022-03
  project_name: Loganholme Wastewater Treatment Plant Gasification Facility Demonstration
    Project
  what_happened: Achieving the correct heat balance between the gasification process
    and the drying process was critical to the facility functioning without diesel
    fuel supplementation. The calorific value of biosolids had to be sufficient to
    sustain gasification and simultaneously provide heat energy for the belt dryers
    — a tightly coupled design dependency that could not be fully resolved until commissioning.
  lesson_learnt: For integrated heat-recovery process facilities, model and validate
    the heat balance with actual feedstock data before finalising equipment selection
    — an unvalidated heat balance is a single point of failure that affects every
    downstream design decision.
  issue_severity: major
  project_type: industrial decarbonisation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: government/public-sector body
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: Centrifuge trials and gasification demonstration plant trials
    were used to characterise feedstock properties and validate the heat balance before
    finalising the dryer and gasification equipment design.
  transferability: moderate
  delay_magnitude: null
  technology_domain: bioenergy
  source_pages: &id003
  - 10
  evidence_excerpt: 'Heat Balance: Was critical to the facility functioning in its
    entirety. The biosolids had to provide appropriate calorific value to permit the
    gasification facility to operate without being supplemented with diesel fuel.'
