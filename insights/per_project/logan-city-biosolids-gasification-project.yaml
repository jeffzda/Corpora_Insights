  publish_date: '2024-08-23'
  project_name: Loganholme WWTP Gasification Facility Demonstration Project
  what_happened: The full-scale gasification facility was designed to achieve heat-energy
    neutral operations by capturing waste heat from gasification to drive the thermal
    belt dryers. In practice, the calorific value of the biosolids (average 17.3 MJ/kg)
    was too low to achieve full heat neutrality, requiring supplementary LPG heating
    to cover approximately 20% of the heat demand, costing $250,000–$500,000 per annum.
  lesson_learnt: Do not assume heat neutrality in biosolids gasification without first
    characterising the actual calorific value of site-specific biosolids under operational
    conditions — a lower-than-designed calorific value will require supplementary
    fuel, adding significant ongoing operating cost. The calorific value should be
    measured and stress-tested in the design phase to size heat recovery systems and
    model worst-case LPG dependency.
