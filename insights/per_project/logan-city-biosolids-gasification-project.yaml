    O2 and visual inspection of the swirl pattern suggested that turbulent mixing
    was less than desired. Therefore, a swirl vane was installed at the oxidiser inlet
    and a directional nozzle implemented for the secondary air inlet. This reduced
    the carbon monoxide slip; however, it was evident that further reduction in short
    circuiting was necessary as higher feed rates were required.
