  project_name: Loganholme WWTP Gasification Facility Demonstration Project
  what_happened: The biochar produced by the full-scale facility was classified as
    Grade C (Restricted Use 2) under the EoW Code for Biosolids due to elevated Zinc
    (1,248.96 mg/kg vs 700 mg/kg Grade B limit) and Copper (389.19 mg/kg vs 375 mg/kg
    Grade B limit) concentrations, which were concentrated approximately 2.3× and
    1.8× respectively relative to input biosolids during gasification.
  lesson_learnt: Gasification concentrates trace metals in the biochar residue — for
    biosolids with elevated Zn and Cu (common in domestic wastewater), project biochar
    metal concentrations from demonstration-plant data before assuming Grade A or
    B classification. A Grade C outcome limits marketability to agricultural, forestry
    and rehabilitation uses only and restricts the commercialisation potential until
    a dedicated EoW Code for Biochar is finalised.
