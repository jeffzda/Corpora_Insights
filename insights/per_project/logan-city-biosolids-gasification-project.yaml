  what_happened: The centrifuge dewatering performance had a significant impact on
    the overall heat balance. The dryness of dewatered biosolids was not fully predictable
    at design stage, requiring site-based portable centrifuge trials and a contingency
    design approach to ensure performance could be achieved before commissioning.
  lesson_learnt: Conduct site-specific dewatering trials using the actual sludge stream
    and representative centrifuge equipment before fixing heat balance assumptions
    in design — feedstock dryness variability can cascade through to gasification
    performance and must be characterised with real data, not literature values.
