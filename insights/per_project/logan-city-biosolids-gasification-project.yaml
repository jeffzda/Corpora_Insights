  what_happened: Additional insulation was retrofitted to hot and cold water tanks,
    exposed ducts, pipe flanges, and dryer heat exchanger housings during the commissioning
    and optimisation phase after it was identified that heat losses were reducing
    the efficiency of the heat recovery circuit.
  lesson_learnt: Heat loss from exposed pipework, tanks and heat exchanger housings
    in biosolids gasification facilities is a material contributor to heat balance
    shortfalls — comprehensive thermal insulation of all hot-circuit components should
    be specified at design stage rather than retrofitted during commissioning, as
    the Loganholme experience shows this is a predictable gap.
