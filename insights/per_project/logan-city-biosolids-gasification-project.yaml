  what_happened: The radiant heat exchanger integrated into the thermal oxidiser removed
    excessive heat when processing the lower-calorific-value Source 1 biosolids, but
    performed according to design on the higher-calorific-value Source 2 biosolids,
    recovering approximately 360 kW at 85% of design feed rate against a design target
    of 400 kW at 100%.
  lesson_learnt: Heat recovery equipment in biosolids gasification facilities must
    be sized and commissioned against feedstock with calorific value representative
    of the intended full-scale supply; testing on degraded or low-volatile-solid feedstock
    will understate heat recovery performance and may require disabling recovery components,
    giving misleading design signals.
