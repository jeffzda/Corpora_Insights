  what_happened: Operating costs for the gasification facility were dominated by chemical
    additive consumption for emissions control and equipment protection, supplementary
    gas usage for heat, and operations and maintenance costs — indicating that opex
    drivers were more complex and costly than a simple energy-from-waste model would
    suggest.
  lesson_learnt: Business cases for biosolids gasification should explicitly model
    chemical additive costs (including magnesium hydroxide for scrubbing), supplementary
    fuel costs, and O&M costs as primary opex drivers — these can dominate the cost
    structure and materially affect commercial viability assessments.
