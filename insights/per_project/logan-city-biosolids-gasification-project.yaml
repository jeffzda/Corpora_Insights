  source_title: 'Loganholme Wastewater Treatment Plant: Biosolids Gasification Demonstration
    Plant (PBE-075)'
  publish_date: 2021-03
  project_name: Loganholme Wastewater Treatment Plant Biosolids Gasification Demonstration
    Plant
  what_happened: Initial SOx dosing used hydrated lime, which caused consistent blockages
    in the dosing system and fouling of the wet scrubber with insoluble calcium compounds.
    The chemical agent was changed to magnesium hydroxide (Mg(OH)₂), which eliminated
    blockages, prevented scrubber precipitation, and achieved compliance with SOx
    limits with no start-up spikes.
  lesson_learnt: Use magnesium hydroxide rather than hydrated lime for SOx control
    in biosolids gasification scrubbers; lime causes handling blockages in weather-exposed
    environments and accumulates insoluble precipitates in wet scrubbers, while Mg(OH)₂
    slurry avoids both problems and performs reliably across the full operating range
    including start-up.
