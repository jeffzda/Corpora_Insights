  source_title: 'Loganholme Wastewater Treatment Plant: Biosolids Gasification Demonstration
    Plant (PBE-075)'
  publish_date: 2021-03
  project_name: Loganholme Wastewater Treatment Plant Biosolids Gasification Demonstration
    Plant
  what_happened: Source 2 biosolids were pelletised with large, dense particles (8–10
    mm spheres). This large, dense pellet format resulted in incomplete carbonisation
    in the hearth, with some biochar samples showing residual PFAS detection and lower
    microplastic destruction rates (43% vs 63% for Source 1) compared to the smaller
    Source 1 crumb material.
  lesson_learnt: Pelletised biosolids with large, dense particle geometries are not
    fully carbonised in a rotary hearth gasifier, leading to PFAS carryover and reduced
    microplastic destruction; specify belt dryers for the full-scale facility to produce
    a uniform crumb within the 3–10 mm optimum size range, and avoid drum dryers whose
    pelletised output is incompatible with full gasification.
