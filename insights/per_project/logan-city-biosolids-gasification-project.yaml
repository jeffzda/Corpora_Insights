  what_happened: The control system was identified as a major design challenge. The
    gasification facility required a complex integrated control system encompassing
    the drying control system (with embedded dryer controller), multiple conveyance
    interfaces, process interlocks, equipment fault responses, sludge diversions,
    and safety protocols — a domino-effect interlock design not typical in wastewater
    treatment.
  lesson_learnt: For novel integrated process facilities, treat the control and interlock
    system as a primary design deliverable from the outset rather than a late-stage
    integration task — the complexity of cross-system interlocks and fault propagation
    logic in FOAK facilities consistently exceeds early estimates.
