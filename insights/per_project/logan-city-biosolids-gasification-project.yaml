  what_happened: Initial chemical dosing rates for urea (NOx control) and magnesium
    hydroxide (SOx control) were higher than ultimately required. Through monitoring
    and optimisation testing since the demonstration plant trials, dosing rates were
    reduced — urea from 4.5% w/w to 3.075% w/w and Mg(OH)2 from 2% w/w to 1.5% w/w
    — generating annual savings of $160,000–$200,000.
