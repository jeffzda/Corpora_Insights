    Victorian EPA Statutory Approval (R26 Assessment), and notification to NSW EPA
    as a transit state. During COVID-19, additional documentation — NSW Border Pass,
    Queensland Border Pass, and Letters of Exemption — also had to be obtained for
    each transport run.
