  project_name: Loganholme Gasification Facility
  what_happened: The LCA demonstrated that biosolids gasification with on-site solar
    reduces total lifecycle GHG emissions by 54% (from 1.627 to 0.741 tCO2-e per tonne
    of dry biosolids) compared to conventional land application, with the solar farm
    contributing a fossil emission credit of 48,180 tCO2-e over 20 years — making
    the solar integration a material factor in the project's net emissions outcome.
  lesson_learnt: Co-locating a solar farm with a biosolids gasification facility materially
    improves the lifecycle GHG performance of the overall system; project developers
    should incorporate renewable electricity generation into facility design from
    the outset, as it converts a high grid-power-draw process (704 kWh/dry tonne)
    into a net emissions benefit.
