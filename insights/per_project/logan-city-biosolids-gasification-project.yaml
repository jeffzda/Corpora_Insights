- record_id: ARENA-DLV-64879
  source_title: 'Loganholme Wastewater Treatment Plant: Biosolids Gasification Demonstration
    Plant (PBE-075)'
  publish_date: 2021-03
  project_name: Loganholme Wastewater Treatment Plant Biosolids Gasification Demonstration
    Plant
  what_happened: Biochar from the full-scale Loganholme gasification facility is predicted
    to have a value of at least $265/tonne for agricultural reuse (based on phosphorus,
    potassium, and fixed carbon content) but only $40/tonne as an energy source. However,
    the predicted Nickel concentration in Loganholme char (~31 mg/kg) is projected
    to exceed the 270 mg/kg Restricted Use 2 limit under Queensland's End of Waste
    Code for Biosolids, potentially blocking direct broad-acre agricultural reuse.
  lesson_learnt: Conduct regulatory pre-assessment of biochar product quality against
    the End of Waste Code before committing to an agricultural reuse revenue stream
    in project business cases; if heavy metal concentrations are likely to exceed
    direct land-application limits, explore blended fertiliser market pathways and
    engage with regulators early to develop a dedicated End of Waste Code for Biochar,
    which does not currently exist in Queensland.
  issue_severity: moderate
  project_type: industrial decarbonisation
