  what_happened: The demonstration plant was designed with two thermal oxidisers to
    increase retention time for POP destruction. Air emission measurements taken between
    the two oxidisers during trials showed the second oxidiser was not necessary —
    it contributed more to heat loss than heat gain and provided no meaningful additional
    function.
  lesson_learnt: Validate thermal oxidiser configuration requirements during early
    trial runs by measuring emissions between stages; for biosolids gasification at
    the temperatures and residence times demonstrated (800–850 °C, 2 seconds), a single
    oxidiser is sufficient for >99% organic destruction, and a second unit adds cost
    and heat loss without benefit.
