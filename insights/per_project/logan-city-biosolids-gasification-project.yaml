  what_happened: An electrostatic precipitator for fine particulate control was not
    included in the initial design but was added after demonstration trial results
    identified the need. Similarly, lime for SOx control was initially included then
    replaced with Mg(OH)2 following demonstration trial experience — both changes
    represent scope additions or substitutions driven by trial evidence rather than
    initial design.
  lesson_learnt: Structure demonstration trials to explicitly test emissions control
    scenarios before finalising design scope — late addition of major emissions control
    equipment (e.g. electrostatic precipitators) after design freeze represents a
    significant scope and cost risk that can be avoided with trial-informed design.
