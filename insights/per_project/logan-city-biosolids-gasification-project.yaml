  what_happened: The Source 1 biosolids received for the demonstration plant had a
    particle size of less than 5 mm — below the optimum 3–10 mm specification — because
    the batch was several months old and had degraded during third-party storage.
    The hearth had to be retrofitted to accommodate the smaller particles, which in
    turn affected airflow.
  lesson_learnt: When sourcing feedstock for gasification demonstration plants from
    third parties, verify freshness and particle size at dispatch, not just on arrival;
    aged or stockpiled material can degrade below specification, requiring hardware
    retrofits that compromise airflow and test validity.
