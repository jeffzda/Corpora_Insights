  outcome_class: re-scoped/adapted
  secondary_failure_mode: execution & logistics
  intervention_note: A swirl vane was installed at the oxidiser inlet and a directional
    nozzle added to the secondary air inlet; a deflector baffle was also added in
    an October trial, both of which reduced CO slip sufficiently — these solutions
    will be replicated on the full-scale facility.
  transferability: narrow
  delay_magnitude: not quantified
  technology_domain: bioenergy
