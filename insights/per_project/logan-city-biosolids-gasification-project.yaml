- record_id: ARENA-DLV-29051
  source_title: Delivering the Design for Australia's First Biosolids Gasification
    Facility
  publish_date: 2022-03
  project_name: Loganholme Wastewater Treatment Plant Gasification Facility Demonstration
    Project
  what_happened: The project required designing and constructing Australia's first
    biosolids gasification facility, integrating individually proven technologies
    from different industries into a novel process. Many critical design decisions
    had to be made early without the design being fully locked down, due to the magnitude
    of unknowns and project scheduling constraints.
  lesson_learnt: For FOAK integrated process facilities, front-load process trials
    and major equipment selection as early as possible so critical dimensions and
    layouts can be established before detailed design begins — deferring these decisions
    forces premature design lock-in and increases rework risk.
  issue_severity: major
  project_type: industrial decarbonisation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: government/public-sector body
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: successful demonstration
  secondary_failure_mode: poor scoping
  intervention_note: Risk was reduced by undertaking dewatering trials using a portable
    centrifuge and detailed trials on dried biosolids using a pilot gasification plant
    before finalising the design.
  transferability: moderate
  delay_magnitude: null
  technology_domain: bioenergy
  source_pages: &id001
  - 6
  evidence_excerpt: Ideally process trials and the selection of major equipment would
    be conducted early in the design process so that critical dimensions and layouts
    can be established and developed throughout the detailed design period. Due to
    the magnitude of 'unknowns' and project scheduling, many decisions had to be made
    early, without the design being fully 'locked down'.
