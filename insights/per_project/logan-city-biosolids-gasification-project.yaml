- record_id: ARENA-DLV-64876
  source_title: 'Loganholme Wastewater Treatment Plant: Biosolids Gasification Demonstration
    Plant (PBE-075)'
  publish_date: 2021-03
  project_name: Loganholme Wastewater Treatment Plant Biosolids Gasification Demonstration
    Plant
  what_happened: The demonstration plant was required to be sourced with biosolids
    dried to 90% dry weight from interstate (Victoria) because no dried biosolids
    were available locally at Loganholme WWTP. This created feedstock supply complexity,
    interstate regulatory approvals requirements, and introduced material quality
    variability (degraded Source 1 batches) that would not exist in a continuous full-scale
    facility.
  lesson_learnt: When designing a demonstration plant for a continuous process technology
    (such as biosolids gasification), the absence of an on-site drying stage means
    feedstock must be sourced externally, introducing supply chain, regulatory, and
    quality variability risks not present in the full-scale design; document these
    differences explicitly so lessons from the demonstration are correctly weighted
    when assessing full-scale risk.
