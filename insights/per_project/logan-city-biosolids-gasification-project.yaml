- record_id: ARENA-DLV-29064
  source_title: Delivering the Design for Australia's First Biosolids Gasification
    Facility
  publish_date: 2022-03
  project_name: Loganholme Wastewater Treatment Plant Gasification Facility Demonstration
    Project
  what_happened: The biochar product from gasification of biosolids had no established
    end-of-waste code in Queensland at the time of design, leaving the market pathway,
    storage requirements, and quality assurance arrangements uncertain. Logan Water
    was working with the Queensland environmental authority to develop an end-of-waste
    code for biochar in parallel with facility design and construction.
  lesson_learnt: Projects commercialising novel residue products (such as biochar
    from gasification) should map the regulatory pathway for product classification
    early in development and engage regulators proactively — the absence of a dedicated
