- record_id: ARENA-DLV-64858
  source_title: 'Loganholme Wastewater Treatment Plant: Biosolids Gasification Demonstration
    Plant (PBE-075)'
  publish_date: 2021-03
  project_name: Loganholme Wastewater Treatment Plant Biosolids Gasification Demonstration
    Plant
  what_happened: The online Continuous Emissions Monitoring System (CEMS) installed
    by Aquagas experienced repeated blockages due to high moisture content in the
    flue gas, rendering it unreliable throughout the trial program. An internal workaround
    (gravity-head drain in place of the peristaltic pump) provided partial functionality
    but was unsuitable for permanent use. An external NATA-accredited provider had
    to be engaged for a number of runs.
  lesson_learnt: When selecting CEMS equipment for biosolids gasification or similar
    high-moisture combustion applications, specify extractive monitoring systems with
    all components heated above dew point to avoid blockage issues — the demonstration
    plant experience allowed the correct unit to be specified for the full-scale facility
    before construction.
