  publish_date: 2021-03
  project_name: Loganholme Wastewater Treatment Plant Biosolids Gasification Demonstration
    Plant
  what_happened: Gasification of biosolids concentrates heavy metals (particularly
    Zn, Cu, Cr, Pb, Ni) in the resulting biochar by approximately 50%, because water
    and volatile solids are removed during carbonisation while non-volatile metals
    are retained. Biochar from both Source 1 and Source 2 was classified as Grade
    C under Queensland's End of Waste Code for Biosolids due to elevated Zn and Cu
    levels, restricting its use to Restricted Use 2 (agriculture, forestry, site rehabilitation).
  lesson_learnt: Account for ~50% concentration increase of non-volatile heavy metals
    when predicting biochar quality from gasification; biochar from urban biosolids
    will typically be classified at a lower grade than the input biosolids under Queensland's
    End of Waste Code, which may affect the commercial value and permissible uses
    — engage regulators early to explore market pathways including blended fertiliser
    products and establish an End of Waste Code for Biochar.
