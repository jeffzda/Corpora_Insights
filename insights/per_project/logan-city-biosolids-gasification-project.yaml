  what_happened: The heat recovery steam boiler achieved only 51–66% heat recovery
    efficiency (against an intended >80%) due to lower-than-expected flue gas inlet
    temperatures (~600 °C vs intended 800 °C) and progressive fouling of heat transfer
    surfaces. Soot blowing could only be performed during shutdown or start-up, limiting
    its effectiveness during extended runs.
  lesson_learnt: Steam boilers are not well suited to the low-temperature, high-moisture
    flue gas conditions of biosolids gasification; specify a hot-water heat recovery
    unit with online compressed-air soot blowing instead, and include a downstream
    condensing heat exchanger to raise design margin for the heat balance to at least
    20%.
