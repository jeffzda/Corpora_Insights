    location (moving to after the oxidiser inlet) and dosing rates across multiple
    trial runs, consumption was reduced to approximately 20 litres per dry tonne.
  lesson_learnt: Urea injection location is critical for NOx control efficiency in
    biosolids gasification; injecting after the oxidiser inlet rather than before
    it can halve or better the required dosing rate, yielding significant operating
    cost savings at full scale — budget conservatively at commissioning and expect
    substantial optimisation during trials.
