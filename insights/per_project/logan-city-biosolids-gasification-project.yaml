- record_id: ARENA-DLV-29052
  source_title: Delivering the Design for Australia's First Biosolids Gasification
    Facility
  publish_date: 2022-03
  project_name: Loganholme Wastewater Treatment Plant Gasification Facility Demonstration
    Project
  what_happened: The gasification demonstration plant was run using dried biosolids
    sourced from different treatment plants (not Loganholme itself) because it was
    unfeasible to dry the sludge at Loganholme to the required 90% dry solids standard
    at the time of trials. This introduced uncertainty about whether trial results
    would be representative of the permanent facility's feedstock.
  lesson_learnt: When demonstration trials must use feedstock from a different source
    than the intended facility, explicitly document and quantify the compositional
    differences and build contingency into design parameters — dosing rates and performance
    assumptions derived from surrogate feedstocks may not translate directly to the
    operational plant.
