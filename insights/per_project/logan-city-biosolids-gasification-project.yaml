  what_happened: Design requirements under engineering codes and safety standards
    not normally applied to the wastewater industry were encountered during the project.
    The gasification process introduced engineering code requirements from other industrial
    sectors (e.g. pressure vessels, hazardous gas handling) that the design team had
    to apply in an unfamiliar context.
