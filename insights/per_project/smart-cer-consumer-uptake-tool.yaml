  what_happened: The Tool's economic recommendation algorithm, calibrated against
    tens of thousands of real customers, achieved a median discrepancy of only -0.92%
    between Tool-predicted and actual annual savings, demonstrating that high-level
    household inputs (e.g., daily energy usage) can produce accurate CER economic
    assessments without 5-minute resolution data.
  lesson_learnt: Accurate CER economic assessments for consumer decision-making do
    not require high-resolution metering data at the recommendation stage — well-calibrated
    algorithms using basic household inputs can achieve sub-1% median error against
    actuals, enabling lightweight tools to reach a broad audience without mandating
    smart meter access.
