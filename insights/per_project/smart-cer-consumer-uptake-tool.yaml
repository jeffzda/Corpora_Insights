- record_id: ARENA-DLV-19314
  source_title: Solar Analytics - Smart CER Consumer Uptake Tool - 2024 Technical
    Report
  publish_date: 2024-05
  project_name: Smart CER Consumer Uptake Tool Project
  what_happened: Pursuing smart meter control via Meter Data Agents (e.g., Intellihub)
    required integration and approval from both the MDA and the energy retailer, and
    involved significant bureaucracy around permissions, customer detail sharing,
    and inter-party consent — with the added constraint that any agreement only covers
    customers served by the specific consenting parties.
  lesson_learnt: Projects seeking to control residential loads via smart meter infrastructure
    should anticipate a lengthy multi-party approval process involving MDAs, energy
    retailers, and potentially DNSPs — scope and timeline estimates should treat this
    pathway as high-risk and include a fallback strategy based on direct device API
    control.
