- record_id: ARENA-DLV-8355
  source_title: Solar Analytics 'Smart CER Consumer Uptake Tool' 2023 Technical Report
  publish_date: '2023-09-20'
  project_name: Smart CER Consumer Uptake Tool Project
  what_happened: DNSP inverter size and export limits relevant to new CER installations
    were found to be routinely ignored or not considered during actual system installation
    by retailers, with no reported issues — suggesting a gap between regulatory/network
    constraints as documented and as enforced in practice.
  lesson_learnt: Consumer advisory tools that incorporate DNSP technical constraints
    (inverter size limits, export limits) should note that these constraints may not
    be enforced in practice; tool designers should validate whether incorporating
    strict DNSP limits will make recommendations overly conservative relative to what
    installers and network operators actually implement on the ground.
