    preventing its use for real-time flexible control of CER loads despite providing
    useful tariff and consumption data for recommendations.
  lesson_learnt: Projects designing real-time demand response or load optimisation
    services should not rely on CDR smart meter data as the control signal — the 24-hour
    data lag makes it unsuitable for real-time dispatch; direct device API integration
    is currently the only viable path for real-time control.
