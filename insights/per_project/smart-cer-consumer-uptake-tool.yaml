  source_title: Solar Analytics - Smart CER Consumer Uptake Tool - 2024 Technical
    Report
  publish_date: 2024-05
  project_name: Smart CER Consumer Uptake Tool Project
  what_happened: When integrating with Reclaim Energy heat pumps, Solar Analytics
    found that the OEM did not store customer contact information, making it unexpectedly
    difficult to reach customers and obtain consent for data access and control despite
    the technical integration itself being straightforward.
  lesson_learnt: When integrating with CER OEM hardware for remote control or data
    access, proponents should confirm upfront whether the OEM retains customer contact
    and consent records; if not, an independent consent-acquisition workflow must
    be designed before any meaningful scale of customer recruitment is possible.
