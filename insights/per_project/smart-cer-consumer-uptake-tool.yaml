- record_id: ARENA-DLV-8351
  source_title: Solar Analytics 'Smart CER Consumer Uptake Tool' 2023 Technical Report
  publish_date: '2023-09-20'
  project_name: Smart CER Consumer Uptake Tool Project
  what_happened: Maintaining accurate CER financial recommendations proved difficult
    because rebate information, DNSP inverter size limits, and export limits are fragmented
    across government, local council, and DNSP sources, frequently conflicting and
    constantly changing (e.g., gas connection fees, new-financial-year rebates).
  lesson_learnt: A centralised database of rebates and DNSP constraints on new and
    existing CER installations would dramatically improve the ability to accurately
    estimate CER costs, financial returns, and uptake; without it, teams building
    consumer advisory tools must continuously scrape and reconcile conflicting sources,
    creating ongoing maintenance burden.
