  source_title: Solar Analytics - Smart CER Consumer Uptake Tool - 2024 Technical
    Report
  publish_date: 2024-05
  project_name: Smart CER Consumer Uptake Tool Project
  what_happened: Regulatory and market structure barriers prevented Solar Analytics
    and consumers from directly controlling Controlled Load meters to shift hot water
    loads to daytime solar periods — the Meter Data Agent only responds to the incumbent
    energy retailer, and no retailer offered a matching tariff product despite a DNSP
    (Endeavour Energy) creating an enabling 'Off Peak Plus' tariff in mid-2023.
  lesson_learnt: Third-party CER aggregators and demand response programs should not
    rely on controlled load meter control as a near-term pathway — market rules assign
    exclusive control to the incumbent energy retailer, and regulatory reform to change
    this is uncertain and likely years away; plan product designs around alternatives
    such as direct device API control.
