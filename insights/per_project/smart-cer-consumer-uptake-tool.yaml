- record_id: ARENA-DLV-8352
  source_title: Solar Analytics 'Smart CER Consumer Uptake Tool' 2023 Technical Report
  publish_date: '2023-09-20'
  project_name: Smart CER Consumer Uptake Tool Project
  what_happened: Testing of a sophisticated optimisation control algorithm for heat
    pump operation — which schedules operation based on household load, PV generation,
    and energy plan — showed it saved on average only $61/year (~5–10% of energy bill)
    and delivered only marginally more value than a simple seasonal timer ($51/year,
    ~85% of the savings), while being significantly more complex and expensive to
    implement.
  lesson_learnt: 'For residential heat pump scheduling, a simple seasonal timer (summer:
    11am–3pm; winter: 9am–4pm) captures ~85% of the financial benefit of a full optimisation
    algorithm at a fraction of the software, hardware, and operational complexity;
    teams should default to the simpler approach unless the marginal benefit of full
    optimisation can be justified.'
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: technology vendor
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Solar Analytics ran parallel simulations with a simple timer
    on 100 real systems to quantify the performance gap, then concluded that the timer
    approach is the preferred strategy for future deployments.
  transferability: moderate
  delay_magnitude: null
  technology_domain: DER
  source_pages:
  - 17
  - 18
  - 19
  - 27
  - 28
  - 29
  evidence_excerpt: On Solar Analytics' existing fleet of 100 customers with heat
    pumps, the control algorithm could save on average $61 per year... additional
    experiments were run to simulate running heat pumps on a simple timer (e.g., between
    11am - 3pm) and these simulations could produce up to 85% of the savings from
    the control algorithm ($51 on average), but without the overhead of complex control
    algorithms, the need to forecast load and PV data, or the need to purchase expensive
    hardware.
  confidence_note: 'secondary_failure_mode: design assumption failure is primary because
    the algorithm design assumed optimisation would deliver meaningful incremental
    value over a timer; technical underperformance captures the outcome of the algorithm
    itself. Canonical record merged from 2 source records across 2 document(s).'
