- record_id: ARENA-DLV-19308
  source_title: Solar Analytics - Smart CER Consumer Uptake Tool - 2024 Technical
    Report
  publish_date: 2024-05
  project_name: Smart CER Consumer Uptake Tool Project
  what_happened: Only approximately 10% of the Tool's 100,000+ users fully completed
    all steps and chose an action, despite there being no significant difference in
    predicted savings between completers and non-completers, indicating user drop-off
    was driven by UX and incomplete CER options rather than financial relevance.
  lesson_learnt: Consumer-facing digital CER tools should instrument and monitor user
    flow at each step from launch; a 90% drop-off before completion signals that friction
    in the user journey (length, complexity, or decision points) is the primary barrier
    to converting interest into action, and should be treated as a priority design
    problem.
