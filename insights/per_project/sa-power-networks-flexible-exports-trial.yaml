- record_id: ARENA-DLV-51474
  source_title: UTS - Flexible Demand State of Play in Australia - Report
  publish_date: 2024-05
  project_name: SA Power Networks – Flexible Exports Trial
  what_happened: The SAPN Flexible Exports Trial successfully demonstrated flexible
    export connection offers and the technology was subsequently adopted as a standard
    SAPN connection offer; South Australian regulations now require all new or upgraded
    systems to be capable of participating in flexible exports.
  lesson_learnt: A well-designed flexible export trial that produces a functioning
    standard (CSIP-AUS) and demonstrates clear network benefit can drive regulatory
    change — the SAPN Flexible Exports Trial shows that pilots with a deliberate standards-development
    work stream can accelerate regulatory adoption and achieve durable policy outcomes
    beyond the pilot itself.
