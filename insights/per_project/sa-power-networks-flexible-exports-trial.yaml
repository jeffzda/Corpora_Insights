- record_id: ARENA-DLV-51500
  source_title: UTS - Flexible Demand State of Play in Australia - Report
  publish_date: 2024-05
  project_name: SA Power Networks – Flexible Exports Trial
  what_happened: The SAPN Flexible Exports Trial produced a draft specification for
    an Australian Common Smart Inverter Profile (CSIP-AUS based on IEEE 2030.5) submitted
    to the national DER API Technical Working Group in 2021; this was subsequently
    converted into a Standards Australia handbook (SA HB 218 CSIP-AUS) now supporting
    flexible export rollouts across three states.
  lesson_learnt: Pilot projects that include a deliberate standards development workstream
    can produce industry-wide standards that outlast and outscale the pilot itself
    — the CSIP-AUS outcome from the Flexible Exports Trial demonstrates that allocating
    pilot resources to standards submission has disproportionate leverage on system-wide
    deployment.
