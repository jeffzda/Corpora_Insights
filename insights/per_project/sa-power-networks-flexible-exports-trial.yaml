- record_id: ARENA-DLV-51477
  source_title: UTS - Flexible Demand State of Play in Australia - Report
  publish_date: 2024-05
  project_name: SA Power Networks – Flexible Exports Trial
  what_happened: Initial customer awareness of the flexible exports offer was low;
    a mail-out was unsuccessful in raising awareness, while targeted social media
    messaging yielded stronger results. Messaging framing was also found to matter
    — offers needed to be understood as enabling higher exports rather than imposing
    a limitation.
  lesson_learnt: Consumer awareness campaigns for flexible export offers should use
    targeted social media rather than mail-outs, and messaging must be carefully framed
    as an improvement in export capability rather than a restriction — misframing
    the offer as a 'limit' will deter uptake even when the economic benefit is positive
    for customers.
