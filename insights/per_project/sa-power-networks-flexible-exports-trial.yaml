- record_id: ARENA-DLV-51475
  source_title: UTS - Flexible Demand State of Play in Australia - Report
  publish_date: 2024-05
  project_name: SA Power Networks – Flexible Exports Trial
  what_happened: Some solar installers in the SAPN Flexible Exports Trial were not
    attracted to the flexible exports offer because they had developed workarounds
    for export constraints (upselling batteries, sizing for no export, or ignoring
    constraints), reducing installer engagement and customer access to the offer.
  lesson_learnt: Installer incentives must be explicitly aligned with flexible export
    programs — installers who have built business models around export constraint
    workarounds have a financial disincentive to recommend flexible exports; programs
    should provide installer training, commercial incentives, and a clear value proposition
    that makes flexible export preferable to workaround sales.
