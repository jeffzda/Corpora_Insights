- record_id: ARENA-DLV-51476
  source_title: UTS - Flexible Demand State of Play in Australia - Report
  publish_date: 2024-05
  project_name: SA Power Networks – Flexible Exports Trial
  what_happened: As one of five DNSPs in Victoria, AusNet found it very difficult
    to engage solar installers effectively as part of a relatively small-scale trial,
    with many adopting a 'wait and see' approach; some customers could not find a
    willing installer.
  lesson_learnt: Multi-DNSP flexible export roll-outs require national coordination
    and regulatory certainty before installers will engage at scale — a single DNSP
    can mobilise its installer base directly, but a fragmented multi-DNSP environment
    with no overarching framework produces installer inaction; a national framework
    is a prerequisite for scale.
