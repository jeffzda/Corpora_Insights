- record_id: ARENA-DLV-45651
  source_title: Pollination - Community Energy Report
  publish_date: 2024-07
  project_name: Community Energy (Australia - sector-wide)
  what_happened: Grid-connected community-scale battery projects frequently returned
    negative or sub-threshold internal rates of return across most Australian states
    when modelled at published capital costs, with development costs fixed at $800,000
    and no FCAS participation. Only under optimistic CAPEX and low development cost
    assumptions in select jurisdictions did returns approach or exceed the 4.47% risk-free
    rate.
  lesson_learnt: Before committing to a grid-connected community battery, proponents
    should model IRR under realistic published CAPEX ($1,100–$4,900/kWh) and development
    cost assumptions for their jurisdiction — negative or sub-risk-free returns are
    the base case for most configurations, not an edge case.
