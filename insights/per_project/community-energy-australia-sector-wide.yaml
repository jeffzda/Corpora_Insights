  project_name: Community Energy (Australia - sector-wide)
  what_happened: For remote diesel-dependent communities, the economics of local renewable
    energy investments are distorted because utilities compare project costs against
    subsidised diesel prices (with a fuel tax credit of 49.6 cents per litre — more
    than 25% of wholesale diesel cost) rather than the full unsubsidised cost.
  lesson_learnt: Economic assessments of renewable energy projects for remote diesel-dependent
    communities should be evaluated against the unsubsidised cost of diesel supply
    (including transport, generator capital costs, and the full excise credit value)
    — assessments benchmarked only against the subsidised utility diesel price will
    systematically understate the economic case for local renewables.
