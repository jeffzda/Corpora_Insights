  source_title: Pollination - Community Energy Report
  publish_date: 2024-07
  project_name: Community Energy (Australia - sector-wide)
  what_happened: Government grant programs for community energy have historically
    been ad hoc and short-term, misaligned with the lengthy project development cycles
    of community energy projects (which can span many years). Decision criteria for
    funding schemes have not always recognised the full spectrum of community benefits,
    and some programs lacked benefit-sharing assurances for community members.
  lesson_learnt: Government grant programs for community energy should be designed
    with multi-year funding certainty aligned to project development timelines, evaluation
    criteria that capture non-financial community benefits, and benefit-sharing guardrails
    — short-term or narrowly scoped programs are poorly matched to the realities of
    community project development.
