- record_id: ARENA-DLV-45667
  source_title: Pollination - Community Energy Report
  publish_date: 2024-07
  project_name: Community Energy (Australia - sector-wide)
  what_happened: Information asymmetries between distributors and community proponents
    mean that distributors retain knowledge of where specific battery configurations
    could reduce grid spend, while community groups lack access to this data. This
    was raised as a key topic in the Ring-Fencing Waiver decision that allowed distributors
    to own and operate distribution-connected batteries.
  lesson_learnt: Community battery proponents should formally request grid-hosting-capacity
    data and location-specific network constraint information from their distributor
    during project planning — information asymmetries that remain unchallenged leave
    distribution network value unrealised and can disadvantage community-led projects
    relative to distributor-owned alternatives.
  issue_severity: moderate
