  source_title: Pollination - Community Energy Report
  publish_date: 2024-07
  project_name: Community Energy (Australia - sector-wide)
  what_happened: Peak average distribution network utilisation across the NEM was
    only 42% in 2022, yet distribution network charges accounted for approximately
    40% of a residential customer's energy bill, with the distribution network services
    component representing 73–78% of total network charges. This underutilisation
    creates a case for behind-the-meter and local battery assets to defer or avoid
    network augmentation.
  lesson_learnt: Community energy projects that can demonstrably shave peak demand
    in a constrained distribution zone can generate network deferral value — proponents
    should quantify and formally present the avoided network augmentation benefit
    to their distributor as part of a co-design negotiation to secure favourable tariff
    treatment.
