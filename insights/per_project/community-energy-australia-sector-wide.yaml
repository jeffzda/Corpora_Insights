  source_title: Pollination - Community Energy Report
  publish_date: 2024-07
  project_name: Community Energy (Australia - sector-wide)
  what_happened: First Nations communities accessing capital for community energy
    projects face structural barriers including limited intergenerational asset accumulation,
    atypical land rights that banks find difficult to value as collateral, and limited
    access to incentive programs. Indigenous communities are also 15% more likely
    than non-Indigenous communities to be underserved by energy supply protections.
  lesson_learnt: Funders and program designers supporting First Nations community
    energy must address the collateral and capital access gap through dedicated loan
    guarantee mechanisms or equity de-risking instruments — standard commercial financing
    pathways are structurally inaccessible to most First Nations communities and cannot
    be assumed to apply.
