  source_title: Pollination - Community Energy Report
  publish_date: 2024-07
  project_name: Community Energy (Australia - sector-wide)
  what_happened: Community energy projects that operate as merchant participants in
    the wholesale electricity market must register with AEMO, carrying financial and
    legal obligations, and are exposed to the full volatility of wholesale prices.
    Utility-scale assets are expected to access earnings protections under the Expanded
    Capacity Investment Scheme, creating an uneven playing field.
  lesson_learnt: Community energy projects with grid-exported electricity should seek
    to partner with a registered market participant (retailer or aggregator) to manage
    AEMO obligations and market risk — self-managed merchant participation is disproportionately
    burdensome relative to project scale and exposes community investors to risks
    they cannot easily price or absorb.
