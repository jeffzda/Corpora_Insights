- record_id: ARENA-DLV-45671
  source_title: Pollination - Community Energy Report
  publish_date: 2024-07
  project_name: Community Energy (Australia - sector-wide)
  what_happened: Community energy proponents reported difficulty accessing capital
    beyond the ~$1 million threshold, with debt financing typically unavailable to
    community groups lacking adequate security. Most communities cannot offer banks
    collateral other than the earning potential of the project itself, and equity
    raising under the Corporations Act imposes significant administrative and legal
    costs.
  lesson_learnt: Community energy projects requiring more than approximately $1 million
    in capital should seek loan guarantee support or de-risking mechanisms from government
    or a creditworthy sponsor before approaching lenders — the absence of tangible
    security is a structural barrier that cannot be resolved through project quality
    alone.
