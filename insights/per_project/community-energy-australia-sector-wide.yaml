  source_title: Pollination - Community Energy Report
  publish_date: 2024-07
  project_name: Community Energy (Australia - sector-wide)
  what_happened: Community-scale assets below 30 MW are generally ineligible for the
    Commonwealth Capacity Investment Scheme, and those below a typical commercial
    threshold cannot secure offtake agreements from energy retailers, leaving them
    fully exposed to volatile wholesale electricity pricing without hedging options.
  lesson_learnt: Community energy project proponents must plan for unhedged wholesale
    price exposure; without access to the Capacity Investment Scheme or a PPA, revenue
    volatility can threaten project viability and investor returns — co-location with
    an anchor off-taker or aggregation to utility scale are the primary mitigants.
