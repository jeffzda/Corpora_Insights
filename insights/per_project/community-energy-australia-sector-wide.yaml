- record_id: ARENA-DLV-45666
  source_title: Pollination - Community Energy Report
  publish_date: 2024-07
  project_name: Community Energy (Australia - sector-wide)
  what_happened: The economic dispatch objectives of community-scale batteries (optimising
    wholesale market arbitrage) frequently conflict with the optimal timing for distribution
    network services such as peak smoothing and voltage support, creating a co-optimisation
    problem that community groups are typically ill-equipped to resolve.
  lesson_learnt: Community battery projects should be designed with co-optimisation
    of market and network dispatch objectives from the outset — agreeing an asset
    override arrangement with the distributor before construction can unlock distribution
    network value that would otherwise be lost and improve overall project returns.
