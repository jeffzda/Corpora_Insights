  project_name: Community Energy (Australia - sector-wide)
  what_happened: OPEX for a single low-voltage-connected community battery system
    was estimated at approximately $17,000 per annum (including administration, IT
    operations, metering, system maintenance, insurance, and site maintenance), which
    represents a disproportionately large share of revenue for smaller battery projects
    and erodes returns.
  lesson_farnt: Community battery financial models must include full OPEX of approximately
    $17,000 per annum for a standalone system — projects that omit or underestimate
    ongoing operating costs will overstate returns, and aggregating multiple batteries
    under a shared operating structure is essential to make per-unit OPEX manageable.
