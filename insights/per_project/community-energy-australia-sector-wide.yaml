  what_happened: Community energy projects that pioneered new technologies or configurations
    in an earlier era generated large positive peer effects and built public support
    for the energy transition. However, the report finds it difficult to conclude
    whether future community energy projects will replicate these peer effects, given
    that the market and technology landscape has changed substantially.
  lesson_learnt: The social licence and peer-effect value of community energy projects
    is context-dependent and should not be assumed to be replicable — program designers
    should separately evaluate the social capital objectives of community energy investments
