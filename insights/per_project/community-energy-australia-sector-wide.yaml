  source_title: Pollination - Community Energy Report
  publish_date: 2024-07
  project_name: Community Energy (Australia - sector-wide)
  what_happened: Community-scale, distribution-connected assets face significant scale
    diseconomies relative to utility-scale equivalents. Lazard's 2023 analysis estimated
    community-scale solar LCOE at USD49–USD185/MWh versus USD24–USD96/MWh for utility-scale
    solar, and the gap widens as utility-scale projects grow larger.
  lesson_learnt: Project proponents and funders should explicitly account for community-scale
    cost diseconomies in feasibility studies — the LCOE penalty relative to utility-scale
    can exceed 2x and erodes the economic case for decarbonisation investment on a
    cost-per-tonne basis.
