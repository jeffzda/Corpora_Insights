- record_id: ARENA-DLV-45665
  source_title: Pollination - Community Energy Report
  publish_date: 2024-07
  project_name: Community Energy (Australia - sector-wide)
  what_happened: Distribution network operator tariff structures for community batteries
    vary significantly across distribution zones, with some offering two-way pricing
    that supports project economics and others not yet fully compensating batteries
    for the value they provide. The pricing structures can also be exposed to change
    after a few years, adding investment uncertainty.
  lesson_learnt: Community battery proponents should obtain written, multi-year tariff
    certainty from their distributor before committing to a project — the wide variation
    in tariff structures across zones and risk of post-project tariff changes can
    materially alter financial returns and should be modelled as a sensitivity.
