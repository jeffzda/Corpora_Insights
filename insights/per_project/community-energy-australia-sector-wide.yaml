- record_id: ARENA-DLV-45668
  source_title: Pollination - Community Energy Report
  publish_date: 2024-07
  project_name: Community Energy (Australia - sector-wide)
  what_happened: Community-led energy projects are rarely invited to participate as
    alternatives to distribution network expansion because the Regulatory Investment
    Test for Distribution (RIT-D) only triggers a public request for proposals when
    forecast expansion expenditure exceeds $6 million, a threshold well above the
    typical community battery scale, and the proposal window is typically open for
    only a short period.
  lesson_learnt: Community energy groups seeking to offer network deferral solutions
    should monitor distributor capital expenditure plans proactively and engage before
    the formal RIT-D process opens — by the time a public RFP is issued, the response
    window is short and may exclude groups that are not already prepared with a detailed
    proposal.
