  what_happened: Community energy projects raised nearly 20,000 volunteer hours over
    the 2022–23 reporting period (estimated at ~$900,000 in-kind value), with volunteer
    fatigue identified as a key impediment. The 2021 Census recorded a 19% decline
    in Australians volunteering since 2016, and the oversight of operating projects
    can demand significant volunteer time extending over two decades.
  lesson_learnt: Community energy projects with anticipated development and operational
    lifespans of 20+ years should establish paid succession roles or transition to
    professional asset operators before volunteer fatigue sets in — relying solely
    on volunteer commitment is a structural risk that worsens as projects mature.
