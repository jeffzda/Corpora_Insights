- record_id: ARENA-DLV-45652
  source_title: Pollination - Community Energy Report
  publish_date: 2024-07
  project_name: Community Energy (Australia - sector-wide)
  what_happened: FCAS revenue was found to be a critical determinant of community
    battery project viability, but community-scale batteries must be at least 1 MW
    as a standalone asset, or 5 MW on an aggregated basis, to qualify for FCAS participation
    — a threshold most community projects cannot meet independently.
  lesson_learnt: Community battery proponents should plan for aggregation across multiple
    battery units from the outset if they wish to access FCAS revenue; standalone
    sub-1 MW batteries are effectively excluded from this important revenue stream
    and will face substantially weaker economics.
