  project_name: Community Energy (Australia - sector-wide)
  what_happened: Grid connection processes imposed significant cost and schedule burdens
    on community energy projects. Hepburn Wind incurred an unforeseen $300,000 in
    additional costs and $600,000 in lost revenue from grid connection complications
    during initial months of operation. For New England Wind, grid connection accounted
    for approximately 18% of upfront capital costs.
  lesson_learnt: Grid connection costs and complications should be treated as a major
    line item and risk in community energy project feasibility — budget for connection
    to represent up to 18% of capital costs and set aside contingency for operational
    revenue losses during connection commissioning.
