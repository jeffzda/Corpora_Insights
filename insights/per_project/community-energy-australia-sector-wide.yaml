  project_name: Community Energy (Australia - sector-wide)
  what_happened: Stand-Alone Power Systems (SAPS) assessed in a 2020 Cutler Merz study
    for Energy Networks Australia showed negative Net Present Values for both islanded
    and islandable SAPS configurations even after accounting for avoided unserved
    energy, post-hazard rebuild, and regulated valuation. Only individual household-scale
    SAPS showed a positive NPV.
  lesson_learnt: Community-scale islanded or islandable SAPS projects for remote grid
    resilience should not be assumed to be economically positive under standard cost-benefit
    analysis — the case for these configurations depends on the value placed on avoided
    impacts to human life and quality of life, which traditional NPV frameworks struggle
    to capture, and proponents should use qualitative resilience arguments to supplement
    financial analysis.
