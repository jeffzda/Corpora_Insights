  source_title: Pollination - Community Energy Report
  publish_date: 2024-07
  project_name: Community Energy (Australia - sector-wide)
  what_happened: Community battery capital costs varied widely across assessed Australian
    projects, from $432/kWh (Totally Renewable Yackandandah microgrid sites) to $4,900/kWh
    (Phillip Island Neighbourhood Battery Cowes site), with the CSIRO 2023–24 average
    storage capital cost estimate at approximately $1,000/kWh. This wide range reflects
    disparate technology choices and absence of economies of scale.
  lesson_learnt: Community battery feasibility studies should benchmark CAPEX against
    the full range of $432–$4,900/kWh observed in comparable Australian projects and
    conduct sensitivity analysis across this range — use of a single point estimate
    (even the CSIRO average) risks significantly underestimating or overestimating
    project costs.
