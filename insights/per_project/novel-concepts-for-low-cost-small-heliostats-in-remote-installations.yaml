- record_id: ARENA-DLV-17552
  source_title: Novel Concepts for Low Cost Small Heliostats in Remote Installations
    Project Results and lessons learnt
  publish_date: '2018'
  project_name: Novel Concepts for Low Cost Small Heliostats in Remote Installations
  what_happened: Wind load data used in the project (Peterka 1992, with Pfahl 2011
    corrections) was developed for large thin azimuth-elevation heliostats and was
    not fully accurate for the CSIRO heliostat design, and uniform wind load assumptions
    across sites ignored cyclonic regions, introducing uncertainty into structural
    and cost calculations.
  lesson_learnt: When adapting existing wind load literature to a novel heliostat
    geometry, verify that the reference data is applicable to the specific structural
    form and planform behaviour; site-specific wind data collection should begin as
    early as feasibility stage to reduce conservatism in structural safety factors
    and foundation costs.
  issue_severity: moderate
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: CSIRO proceeded with a conservative foundation and structural
    design approach and deferred site-specific optimisation to later stages when application
    boundary conditions would be better defined.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar thermal
  source_pages: &id001
  - 8
  evidence_excerpt: This data is for large, thin azimuth-elevation heliostats, which
    is not entirely accurate for the CSIRO design as the structure of the CSIRO heliostat
    would produce significant drag, and the planform of the heliostat changes when
    the heliostat rolls about the secondary axis. It was assumed that all sites had
    the same wind loads (which ignored impact of cyclonic regions).
  confidence_note: null
