- record_id: ARENA-DLV-17553
  source_title: Novel Concepts for Low Cost Small Heliostats in Remote Installations
    Project Results and lessons learnt
  publish_date: '2018'
  project_name: Novel Concepts for Low Cost Small Heliostats in Remote Installations
  what_happened: There is no single optimum heliostat design applicable to all sites
    because each site has unique wind and soil conditions, resulting in conservative
    costings and safety factors being applied until exact site conditions are known,
    which makes it difficult for technology licensees to submit competitive commercial
    offers.
  lesson_learnt: Generic heliostat design exercises that do not fix site-specific
    parameters (field size, location, wind profile, soil type) will encounter too
    many variables to yield actionable engineering outcomes; future projects should
    define boundary conditions — including location and receiver type — before commencing
    detailed design and costing work.
