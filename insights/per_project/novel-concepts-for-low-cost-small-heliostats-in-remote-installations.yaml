- record_id: ARENA-DLV-17556
  source_title: Novel Concepts for Low Cost Small Heliostats in Remote Installations
    Project Results and lessons learnt
  publish_date: '2018'
  project_name: Novel Concepts for Low Cost Small Heliostats in Remote Installations
  what_happened: CSIRO developed and prototype-tested a camera array calibration system
    capable of calibrating multiple small heliostats simultaneously at distances up
    to 1.6km, demonstrating that this technology could enable commercial-scale small
    heliostat fields and significantly reduce commissioning time.
  lesson_learnt: A multi-heliostat simultaneous camera array calibration system represents
    a viable pathway to unlocking the optical efficiency advantages of small heliostats
    at commercial scale; future commercial solar thermal projects should consider
    integrating such a system into tower design (e.g. via a Lambertian target on the
    tower) as a low-risk way to reduce commissioning duration and accelerate revenue
    commencement.
