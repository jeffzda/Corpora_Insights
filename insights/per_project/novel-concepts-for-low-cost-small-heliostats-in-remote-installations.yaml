- record_id: ARENA-DLV-17555
  source_title: Novel Concepts for Low Cost Small Heliostats in Remote Installations
    Project Results and lessons learnt
  publish_date: '2018'
  project_name: Novel Concepts for Low Cost Small Heliostats in Remote Installations
  what_happened: CSIRO partnered with automotive component manufacturer DCI to apply
    Design for Manufacture and Assembly (DFMA) methods to the heliostat design, resulting
    in the version 4 heliostat that achieved a further 25% reduction in component
    costs on top of the 50–60% cost reduction from economies of scale modelled for
    high-volume version 3 production.
  lesson_learnt: Engaging an experienced automotive-sector manufacturing partner early
    in heliostat design to apply DFMA principles can yield substantial cost reductions
    (25% additional component cost reduction in this case) beyond what economies of
    scale alone provide; this approach is transferable to other solar thermal hardware
    development programmes.
