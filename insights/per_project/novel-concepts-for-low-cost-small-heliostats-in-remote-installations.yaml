- record_id: ARENA-DLV-17557
  source_title: Novel Concepts for Low Cost Small Heliostats in Remote Installations
    Project Results and lessons learnt
  publish_date: '2018'
  project_name: Novel Concepts for Low Cost Small Heliostats in Remote Installations
  what_happened: The relationship between wind-induced elastic deformation of heliostats
    during operation and resulting energy yield loss was identified as a key knowledge
    gap, meaning the cost-benefit trade-off between additional structural stiffness
    and energy performance cannot currently be quantified with confidence for commercial
    design decisions.
  lesson_learnt: Commercial heliostat structural design optimisation requires quantified
    data on the energy yield penalty from wind-induced tracking error; future projects
    should include instrumented field measurements to characterise this relationship,
    rather than relying on conservative structural assumptions that inflate capital
    costs.
  issue_severity: minor
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
