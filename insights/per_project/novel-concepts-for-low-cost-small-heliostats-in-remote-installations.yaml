- record_id: ARENA-DLV-17554
  source_title: Novel Concepts for Low Cost Small Heliostats in Remote Installations
    Project Results and lessons learnt
  publish_date: '2018'
  project_name: Novel Concepts for Low Cost Small Heliostats in Remote Installations
  what_happened: The novel direct drive linear actuator concept was proven in principle
    — demonstrating a one-moving-part, zero-wear mechanism using magnetic fields —
    but precision was insufficient for heliostat pointing control due to material
    and manufacturing limitations, meaning it could not be used for its primary intended
    application.
  lesson_learnt: When developing a novel actuator for high-precision solar tracking,
    verify that achievable manufacturing tolerances and material properties can meet
    the required control resolution before committing to heliostat integration; alternative
    lower-precision applications (e.g. PV tracking) should be identified early as
    fallback value pathways.
  issue_severity: moderate
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: CSIRO pivoted to investigating alternative applications for the
    actuator concept, such as solar PV tracking, where lower precision requirements
    may be acceptable.
  transferability: narrow
  delay_magnitude: null
  technology_domain: solar thermal
