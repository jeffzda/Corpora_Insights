  what_happened: The Reposit feed-in management (export limit) experiment demonstrated
    that remote export limits could be reliably implemented, with the export kept
    below the set limit 97.58% of the time and a maximum deviation of only 1.29kW
    across 8 weeks of data from two properties. The system also allowed remote adjustment
    of export limits without requiring physical inverter reprogramming.
  lesson_learnt: Cloud-based DER controllers with remotely adjustable export limits
    are a more operationally flexible alternative to hard-coded inverter export limits
    — the ability to change limits remotely as network conditions change avoids the
    need for physical site visits and can also serve as a customer engagement tool
    by offering periodic reviews of export entitlements.
