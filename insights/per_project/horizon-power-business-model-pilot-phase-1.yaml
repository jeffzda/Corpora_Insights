- record_id: ARENA-DLV-28808
  source_title: Carnarvon DER Trials Technical Report 2
  publish_date: 2021-05
  project_name: Carnarvon Distributed Energy Resource (DER) Trials
  what_happened: VPP control experiments using the Reposit system found that several
    VPP experiments failed to keep within the required 10% average of the setpoint.
    Unmanaged solar at some sites within the VPP prevented setpoints from being achieved.
    Additionally, after final control signals when experiments concluded, the ramp
    rate reached up to 88.78% of nominal capacity per minute — far exceeding the allowable
    16.66% limit — apparently due to the Reposit controller using an exponential decay
    approach.
  lesson_learnt: VPP control systems used for network management in isolated microgrids
    must be tested for setpoint accuracy and ramp rate compliance under all operational
    states including post-curtailment release — unmanaged DER within a VPP fleet will
    systematically undermine setpoint accuracy, and ramp rate exceedances during VPP
    release can pose system stability risks in isolated networks.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: network business
  delay_category: null
