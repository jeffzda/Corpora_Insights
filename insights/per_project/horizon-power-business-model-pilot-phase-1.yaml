- record_id: ARENA-DLV-28813
  source_title: Carnarvon DER Trials Technical Report 2
  publish_date: 2021-05
  project_name: Carnarvon Distributed Energy Resource (DER) Trials
  what_happened: PowerFactory simulation studies of the Mungullah Power Station demonstrated
    that PV cloud-shading induced power ramping does not threaten frequency regulation
    provided spinning reserve is available and reverse power flow is avoided. However,
    at installed PV capacities above approximately 7–7.3MW, cloud-induced power ramps
    exceed the ability of the power station to start the next gas engine generator
    (3-minute start time) within the spinning reserve margin, creating a potential
    generation shortfall.
  lesson_learnt: Isolated power system operators must identify the installed PV capacity
    threshold above which cloud-induced ramp rates exceed the generator start time
    capability — for Carnarvon this is approximately 7MW — and must implement solar
    forecasting with proactive PV feed-in management before this threshold is reached
    to prevent generation shortfalls that cannot be covered by spinning reserve alone.
