  project_name: Carnarvon DER Trials
  what_happened: Some existing solar PV customers declined to participate in battery
    augmentation trials because they were reliant on premium feed-in tariff income
    and did not want battery dispatch to reduce their midday export, even after the
    project explained future economic benefits.
  lesson_learnt: Customers receiving premium feed-in tariffs are strongly motivated
    to maximise export and are unlikely to voluntarily participate in battery storage
    trials that reduce their export income; project design should account for this
    resistance, consider financial reimbursement mechanisms, or target participants
    who are not on premium tariffs.
