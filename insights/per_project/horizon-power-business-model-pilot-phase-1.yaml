- record_id: ARENA-DLV-28809
  source_title: Carnarvon DER Trials Technical Report 2
  publish_date: 2021-05
  project_name: Carnarvon Distributed Energy Resource (DER) Trials
  what_happened: Loss of communications experiments on the Reposit VPP system found
    that when communication was lost upstream from the Reposit Box (between the box
    and the network), default setpoints were correctly reached. However, when communication
    failed downstream between the Reposit Box and the inverter (e.g. disconnected
    Ethernet cable), the fallback behaviour was not guaranteed for all inverters,
    posing a risk of uncontrolled DER export.
  lesson_learnt: In VPP architectures for isolated network management, the communications
    link between the DER controller and the inverter (downstream of the control box)
    is the most operationally critical failure point — physical hardening of this
    link (e.g. conduit installation, tamper-resistant connections) is essential to
    ensure reliable feed-in management and prevent uncontrolled export during communication
    outages.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: network business
  delay_category: null
  failure_mode: unvalidated integration
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: execution & logistics
  intervention_note: Recommendations were made to mandate communications cable installation
    in conduit to prevent accidental disconnection, and to require DER systems to
    be feed-in manageable at all times or disconnectable by Horizon Power. The issue
    is also addressed in new requirements under DR AS/NZS 4777.2:2020.
  transferability: moderate
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id006
  - 56
  evidence_excerpt: The trial showed that the default setpoints were reached in case
    of communication loss upstream from the Reposit Box or secure gateway device at
    the customer property. This was however not the case for all inverters, once onsite
    communication failure occurred downstream from the Reposit Box to the inverter
    (e.g. a disconnection of the Ethernet cable between the Reposit Box and the inverter).
  confidence_note: null
