- record_id: ARENA-DLV-28822
  source_title: Carnarvon DER Trials Technical Report 2
  publish_date: 2021-05
  project_name: Carnarvon Distributed Energy Resource (DER) Trials
  what_happened: Inverter trip events caused by mass rapid PV loss (e.g. cloud events
    or inverter trip cascades) were found to generate ramp rates as high as 42 kW/s
    in some cases, and typically around 15 kW/s — orders of magnitude higher than
    normal cloud-induced ramp rates (~0.66 kW/s over 300 seconds) and significantly
    higher than the gas generator load-following capability. Mass inverter trip events
    therefore pose a substantially greater threat to system stability than cloud shading
    alone.
  lesson_learnt: Inverter trip events in high-PV isolated networks can generate power
    ramp rates up to 60 times higher than normal cloud-induced ramps and represent
    a larger stability threat than cloud shading — system protection and spinning
    reserve strategies must be specifically designed to handle inverter trip-induced
    ramps, not just cloud shading ramps, and inverter settings compliance is therefore
    directly linked to system stability.
