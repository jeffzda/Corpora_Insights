  intervention_note: A second phase shift (moving meter number 9 from Phase C to Phase
    A) was undertaken following the unexpected voltage rise on Phase C, which reduced
    the Phase C maximum from 257V to 254.5V while maintaining Phase A stability.
  transferability: moderate
