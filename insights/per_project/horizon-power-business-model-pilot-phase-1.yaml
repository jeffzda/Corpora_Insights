  project_name: Carnarvon Distributed Energy Resource (DER) Trials
  what_happened: The WobaS all-sky imager nowcasting system, tested at five sites
    in Europe, was assessed for suitability in Carnarvon. Carnarvon's lower latitude
    (24.9°S vs up to 37.1°N for European sites) results in higher average solar elevation
    angles and fewer cloudy days (14–24 sunny days per month vs 10–18 at PSA), leading
    to an expectation of lower forecast uncertainties than observed at the European
    test sites, with MAD expected well below 100 W/m² for DNI and below 60 W/m² for
    GHI at a 10-minute forecast horizon.
  lesson_learnt: All-sky imager nowcasting systems developed and tested in European
    climates are expected to perform better in lower-latitude Australian locations
    such as Carnarvon due to higher solar elevation angles and lower cloud prevalence
    — utilities in northern and central Australia considering sky camera-based forecasting
    can expect performance superior to European benchmarks and should not be deterred
    by European accuracy figures when evaluating the technology.
