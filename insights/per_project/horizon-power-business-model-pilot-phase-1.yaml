  project_name: Carnarvon Distributed Energy Resource (DER) Trials
  what_happened: Horizon Power's existing hosting capacity methodology focused on
    system-level impacts (spinning reserve, generator loading, start times) and did
    not include LV network-level voltage constraints. Voltage studies conducted as
    part of the Carnarvon DER Trials confirmed voltage rise issues in some LV networks
    that increase with PV penetration, demonstrating that the existing hosting capacity
    approach underestimates LV network constraints and may permit more PV connections
    than the local network can physically support.
  lesson_learnt: Hosting capacity methodologies for remote and isolated networks must
    incorporate an LV network perspective using stochastic analysis — system-level-only
    approaches will underestimate voltage rise constraints at end-of-line LV nodes,
    leading to over-permitting of PV connections and resulting in voltage exceedances
    and inverter trip events that degrade system reliability.
