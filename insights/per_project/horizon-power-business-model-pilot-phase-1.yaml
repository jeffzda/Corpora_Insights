- record_id: ARENA-DLV-28825
  source_title: Carnarvon DER Trials Technical Report 2
  publish_date: 2021-05
  project_name: Carnarvon Distributed Energy Resource (DER) Trials
  what_happened: A predictive analytics model for LV feeder demand in Carnarvon successfully
    produced models with ≤10% MAPE for 51% of service connection points, but could
    not produce reliable models for 55% of LV feeders (covering 40% of total load),
    which serve irregular industrial loads (salt production, water pumping, mining)
    with non-weather-correlated consumption patterns. These loads require fundamentally
    different modelling approaches.
  lesson_learnt: Standard weather-correlated demand forecasting models cannot reliably
    predict irregular industrial loads in remote microgrids — utilities must segment
    their load portfolios by demand driver before applying forecasting approaches,
    and must invest in supplementary data sources (e.g. operational schedules, tidal
    data, shipping schedules) or alternative modelling methods for non-weather-correlated
    loads that may represent a disproportionate share of total system load.
