  evidence_excerpt: objective social science is complicated when the participant is
    gifted assets that will, by their very nature, alter their attitudes or behaviour
    around energy consumption. Care should be exercised if social science is a project
    objective to ensure that the pool of participants can contribute unbiased observations
    through well-designed questionnaires. Analysis of behavioural change requires
    a 'before and after' data set that spans at least one year to capture the influence
    of DER on energy use behaviour during seasonal variation. Also, Feed-in tariff
    or pricing signals should be applied to complement the research objectives.
