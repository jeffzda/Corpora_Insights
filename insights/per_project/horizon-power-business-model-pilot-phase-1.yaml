  what_happened: The software development team successfully applied Agile methodologies
    — Kanban boards, Design Thinking, and Lean canvases — in combination with JIRA
    and Confluence tooling, producing a flexible DER monitor and control software
    stack well-suited to large-scale data collection, research partner data sharing,
    and DER system control.
