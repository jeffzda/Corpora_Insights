  what_happened: Analysis of cloud-induced PV fluctuation factors in Carnarvon demonstrated
    that the diversity factor is strongly dependent on the measurement time interval
    — lower for shorter intervals (30 seconds) and higher for longer intervals (5
    minutes) — a dependency not captured in Horizon Power's previous fixed-value hosting
    capacity parameters.
