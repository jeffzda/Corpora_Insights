- record_id: ARENA-DLV-64607
  source_title: Carnarvon DER Trials End of Project Lessons Learnt
  publish_date: 2021-07
  project_name: Carnarvon DER Trials
  what_happened: Running a competition to gift ten PV/battery systems to customers
    proved unexpectedly legally complex in Western Australia, requiring a probity
    auditor to avoid triggering gaming licence requirements; gifting DER assets to
    customers as a government entity also created administrative complications.
  lesson_learnt: Avoid using competitions to gift DER systems to trial participants
    in Western Australia — the legal complexity around gaming licences and public-entity
    gifting obligations requires probity processes that add burden; explore simpler
    participant recruitment mechanisms such as direct selection or subsidised purchase.
