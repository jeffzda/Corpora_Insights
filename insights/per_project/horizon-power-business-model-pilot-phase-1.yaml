  what_happened: Horizon Power's existing hosting capacity determination methodology
    used a PV fluctuation factor of 0.49 (based on diversity factor and output fluctuation
    factor both assumed at 0.7), but empirical measurement from the Carnarvon trial
    showed the actual fluctuation factor due to cloud events was only 0.39 for a 5-minute
    interval and 0.17 for a 30-second interval — materially lower than the assumed
    value.
  lesson_learnt: Hosting capacity estimates for isolated microgrids based on assumed
    fluctuation factors without empirical data are likely to be conservative; deploying
    network-wide PV monitoring to measure actual fluctuation factors can reveal additional
    available hosting capacity, as demonstrated when Carnarvon released additional
    capacity in June 2019 following measured values below the previously assumed factor.
