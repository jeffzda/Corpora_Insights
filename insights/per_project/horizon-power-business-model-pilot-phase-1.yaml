    have data quality validation processes in place from commissioning, including
    automated detection of gaps, duplicates, and corruption — missing data rates of
    16–17% in sub-metering systems are unacceptable for operational reserve management
    and real-time control applications, and backup data retrieval paths should be
    configured before trials commence.
