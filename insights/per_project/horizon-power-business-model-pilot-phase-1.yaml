  what_happened: The Grid Credits experiment using the Reposit system found a consistent
    5–12% difference between the power specified in the dispatch command and the actual
    exported power, with exported power lower than specified. The cause was unknown
    at the time of the experiment. Both the Reposit system and Wattwatcher measurement
    devices were also noted as unlikely to meet the metrological requirements of standard
    electrical metering apparatus.
  lesson_learnt: Before deploying grid credit or ancillary service reward schemes
    based on DER dispatch, utilities must resolve measurement accuracy gaps — non-standard
    DER monitoring devices (such as Reposit and Wattwatcher) do not meet the metrological
    standards required for financial settlements, and industry acceptance of these
    devices for payment purposes must be established before customer reward programs
    can be offered with confidence.
