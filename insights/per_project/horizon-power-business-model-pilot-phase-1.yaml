  evidence_excerpt: The constrained k-means algorithm was found to achieve phase identification
    with high accuracy. Overall, the results from this study have shown that phase
    identification enables the balancing of DER in the network, improving the outlook
    for hosting capacity by reducing the peak voltage events that can cause inverter
    trips. The original phase label as listed shows that all meters were arbitrarily
    recorded as being connected to phase A, which was correct only some of the time.
