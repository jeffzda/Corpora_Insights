- record_id: ARENA-DLV-28806
  source_title: Carnarvon DER Trials Technical Report 2
  publish_date: 2021-05
  project_name: Carnarvon Distributed Energy Resource (DER) Trials
  what_happened: Phase rebalancing of single-phase DER on the Gibson Street Feeder
    was demonstrated through physical phase changes of two meters. Moving a high-current
    single-phase DER from Phase A to Phase C reduced the maximum Phase A voltage from
    259.7V to 253.3V, but unexpectedly increased Phase C maximum voltage from 247.5V
    to 257V. A subsequent shift of another meter reduced Phase C back to 254.5V while
    keeping Phase A stable.
  lesson_learnt: Phase rebalancing of single-phase DER can reduce over-voltage on
    congested phases but may shift the voltage rise problem to the receiving phase
    — iterative, incremental rebalancing guided by voltage heat maps and current data
    is required, and each phase shift must be assessed for its impact on the receiving
    phase before implementation.
  issue_severity: minor
  project_type: DER/customer-side
