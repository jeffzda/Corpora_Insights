- record_id: ARENA-DLV-28805
  source_title: Carnarvon DER Trials Technical Report 2
  publish_date: 2021-05
  project_name: Carnarvon Distributed Energy Resource (DER) Trials
  what_happened: A constrained k-means clustering algorithm applied to synchronised
    1-minute AMI meter data across 2,600 meters in Carnarvon successfully identified
    the network phase of single-phase PV systems with 99.6% agreement across three
    sample periods for the whole town, and 100% accuracy on the Gibson Street Feeder
    (validated by field inspection). Original phase label records were incorrect in
    many cases — all 14 single-phase meters on the Gibson Street Feeder were recorded
    as Phase A when only some were actually on Phase A.
  lesson_learnt: Existing phase label records in utility databases may be systematically
    incorrect for single-phase meters — applying constrained k-means clustering to
    synchronised AMI voltage data is a practical, high-accuracy method to identify
    actual network phase connections, enabling phase rebalancing to reduce over-voltage
    events and increase DER hosting capacity without physical network augmentation.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: null
  failure_mode: data & measurement
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: A constrained k-means algorithm was applied to 30 days of 1-minute
    AMI voltage data; results were validated by field inspection with a linesman and
    used to guide physical phase rebalancing of single-phase DER connections.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id002
  - 8
