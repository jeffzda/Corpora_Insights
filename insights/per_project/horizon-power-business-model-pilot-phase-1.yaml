  evidence_excerpt: Horizon Power's existing methodologies to calculate renewable
    energy hosting capacity have primarily focused on system-level impacts, i.e. impacts
    related to spinning reserve and generator loading capability, generator start
    times and generator step load capabilities. The voltage studies performed as part
    of the Carnarvon DER Trials have confirmed that voltage rise issues exist in some
    LV networks and will increase as PV penetration rises. Hence, to determine hosting
    capacity in remote networks, an approach is required which includes the LV distribution
    network perspective and considers adverse impacts at a local level as well as
    at the system level.
