  source_title: Carnarvon DER Trials End of Project Lessons Learnt
  publish_date: 2021-07
  project_name: Carnarvon DER Trials
  what_happened: Transparent communication with customers about exactly what data
    was collected, the collection period, and how it would be used resulted in no
    customer complaints, and providing app-based visibility of system performance
    created a positive win-win dynamic that supported participant retention.
  lesson_learnt: For behind-the-meter data collection and control trials, be explicit
    with participants about what data is collected, for how long, and how it will
    be used — transparency and providing customers with tangible visibility tools
    (such as monitoring apps) prevents complaints and supports sustained participation.
