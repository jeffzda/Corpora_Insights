  secondary_failure_mode: regulatory & approvals
  intervention_note: Horizon Power initiated a structured inverter audit program and
    is using results to improve DER connection approval processes, with recommendations
    to require installer-provided evidence of compliant installation and to implement
    ongoing audit processes as business-as-usual practice.
