- record_id: ARENA-DLV-40570
  source_title: 'Horizon Power Carnarvon DER Lessons Learnt #1'
  publish_date: null
  project_name: Carnarvon DER Trials
  what_happened: The project identified that as inverter penetration increases, primary
    response curves will activate more frequently, and installers lack the knowledge
    and communication skills to explain to customers why their system output may be
    curtailed at certain times; incorrect inverter settings at time of installation
    were also identified as a systemic risk to network stability.
  lesson_learnt: The solar installation industry requires structured education on
    inverter primary response curve settings and their network management role — network
    operators should provide clear, easily accessible inverter setting specifications
    to installers and retailers to ensure correct configuration at installation, and
    installers must be equipped to communicate export curtailment to customers as
    a network condition rather than a system fault.
