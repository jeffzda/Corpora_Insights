  source_title: 'Horizon Power Carnarvon DER Lessons Learnt #1'
  publish_date: null
  project_name: Carnarvon DER Trials
  what_happened: Installing over 160 3/4G-connected IoT devices in a regional town
    over a short period caused unforeseen network connectivity issues; the local telecoms
    network struggled to handle the sudden increase in data activity, with connection
    drops occurring in favour of voice calls, causing devices to switch to distant
    towers and lose internet connectivity.
  lesson_learnt: Before deploying large numbers of 3/4G IoT devices in a regional
    area, conduct an analysis of local telecoms bandwidth availability and network
    capacity — a sudden mass deployment can saturate the local network and cause persistent
    data gaps; range extender antennae and firmware supporting tower-switching without
    data loss should be specified upfront.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: construction/installation
  proponent_type: network business
  delay_category: commissioning/integration
  failure_mode: unvalidated technical assumptions
  outcome_class: delayed but recoverable
  secondary_failure_mode: data & measurement
  intervention_note: Installed range extender antennae on affected Solar Analytics/Wattwatchers
    devices and applied a firmware update enabling seamless tower switching without
    data loss.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: DER
  source_pages:
  - 8
  - 10
  evidence_excerpt: Installing over one hundred and sixty 3/4G connected devices in
    a regional/rural town over a matter of weeks caused unforeseen network connectivity
    issues... the local telecoms network has struggled to manage the sudden increase
    in data activity. Connection drop in favour of voice calls causes data devices
    to switch to distant towers with lower signal strength, subsequently losing internet
    connectivity and thus data.
