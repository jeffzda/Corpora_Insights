  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: network business
  delay_category: construction/installation
  failure_mode: poor scoping
  outcome_class: delayed but recoverable
  secondary_failure_mode: null
  intervention_note: Trenching was carried out to run Ethernet cables from the Reposit
    Box at the dwelling to the meter box at the property boundary, enabling the net
    flow management current transformer to function correctly.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: DER
  source_pages:
