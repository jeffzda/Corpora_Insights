- record_id: ARENA-DLV-28804
  source_title: Carnarvon DER Trials Technical Report 2
  publish_date: 2021-05
  project_name: Carnarvon Distributed Energy Resource (DER) Trials
  what_happened: LV network voltage studies across two networks in Carnarvon found
    that sites at the end of network branches (more than 600 metres from the transformer)
    experienced repeated over-voltage events above 257V, with some exceeding 260V,
    causing multiple inverter trips per day. Sites close to the transformer experienced
    comparatively stable voltages. Cloud events exacerbated voltage swings by rapidly
    changing PV output.
  lesson_learnt: When designing or assessing hosting capacity for LV networks with
    high PV penetration, voltage rise at end-of-line nodes must be explicitly modelled,
    as sites far from the transformer are disproportionately affected by over-voltage
    events that cause inverter trips, which in turn destabilise network output — voltage
    mitigation measures must be network-segment specific rather than system-wide.
