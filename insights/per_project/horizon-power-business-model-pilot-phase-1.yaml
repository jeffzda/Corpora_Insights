  source_title: Horizon Power Carnarvon DER Trials Technical Report
  publish_date: 2020-03
  project_name: Carnarvon Distributed Energy Resources (DER) Trials
  what_happened: Widespread synchronised inverter tripping events — not cloud-induced
    fluctuations — were found to cause the largest aggregate PV output variations
    on the Carnarvon network. The maximum event on 16 December 2017 saw 41 inverters
    trip simultaneously, causing a 209 kW (60%) drop in aggregate PV output within
    60 seconds.
  lesson_learnt: When assessing PV hosting capacity in isolated microgrids, inverter
    tripping events must be identified and characterised separately from cloud-induced
    fluctuations — they produce faster and larger power ramps (53% in 60 seconds versus
    27% for cloud events) and pose a distinct and more severe stability risk that
    requires dedicated root-cause investigation.
