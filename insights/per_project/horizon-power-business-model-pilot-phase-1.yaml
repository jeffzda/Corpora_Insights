  project_name: Carnarvon Distributed Energy Resource (DER) Trials
  what_happened: Carnarvon was the first regional WA town to reach Horizon Power's
    solar PV hosting capacity limits in 2011, driven by large commercial PV system
    uptake (typically 10–30 kW). Repeated updates to hosting capacity methodology
    between 2009 and 2019 — incorporating renewable energy smoothing, fluctuation
    factors, generator performance analysis, SCADA feed-in management, and DER trial
    learnings — progressively released additional hosting capacity that had been constrained
    by earlier, more conservative methodologies.
  lesson_learnt: Hosting capacity limits in isolated networks should be treated as
    living parameters updated regularly as new technical data, operational experience,
    and DER management capabilities become available — conservative initial limits
    set without operational data will unnecessarily constrain renewable energy connections,
    and a structured program of trials and methodological updates can systematically
    release additional capacity over time.
