  source_title: Carnarvon DER Trials End of Project Lessons Learnt
  publish_date: 2021-07
  project_name: Carnarvon DER Trials
  what_happened: Lessons learnt in the Carnarvon DER trials directly influenced the
    2019 release of Horizon Power's DER Connection Technical Requirements and supported
    the subsequent release of 10 MW of DER hosting capacity across the Horizon Power
    service area.
  lesson_learnt: Technology trials in live microgrid environments can generate evidence
    that directly informs regulatory and technical connection standards — budget for
    knowledge transfer activities to network policy teams and build explicit linkages
    between trial outputs and standards review processes to maximise policy impact.
