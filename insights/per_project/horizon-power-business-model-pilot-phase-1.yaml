- record_id: ARENA-DLV-45301
  source_title: Horizon Power Carnarvon DER Trials Technical Report
  publish_date: 2020-03
  project_name: Carnarvon Distributed Energy Resources (DER) Trials
  what_happened: Standard metering infrastructure (AMI) in Carnarvon was found to
    be inadequate for project-specific DER analysis because meters were not time-synchronised
    with one another and sample rates varied between 5 and 15 minutes, making time-sensitive
    parameters such as peak load inaccurate.
  lesson_learnt: Do not rely on AMI billing meters for DER analysis in microgrid trials
    — lack of time synchronisation across devices and variable sample rates (5–15
    minutes) render time-sensitive parameters unreliable. Deploy dedicated, time-stamped,
    high-resolution monitoring devices (e.g. Wattwatchers at 5-second intervals) from
    the outset.
