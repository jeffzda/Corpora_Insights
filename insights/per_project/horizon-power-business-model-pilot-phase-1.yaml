  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: Horizon Power commenced analysis of power quality response modes
    and phase balancing to mitigate voltage rise, and initiated an inverter settings
    audit on affected networks.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id001
  - 7
  - 30
  - 31
  - 35
  evidence_excerpt: Site A2 and A8 went above 255V, and Site A4 went beyond 260V,
    in some instances. Sites A5 and A7 are located close to (i.e. less than 100 meters
    from) the transformer while Site A2, A4 and A8 are at the end of the network branches
    (located more than 600 meters from the transformer). Inverter trips were observed
