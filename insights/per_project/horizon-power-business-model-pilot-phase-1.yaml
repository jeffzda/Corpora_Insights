  what_happened: Battery control experiments demonstrated that direct dispatch of
    behind-the-meter batteries via the Reposit system was effective, with charge/discharge
    rate error between 0.28% and 3.35% in all but one case. However, batteries did
    not ramp at the stipulated solar generation ramp rate — instead they jumped to
    the commanded state within 10–60 seconds. In one instance, an error of 13.33%
    occurred due to a customer load coming online concurrently.
  lesson_learnt: Behind-the-meter battery dispatch via VPP controllers is operationally
    effective for load shifting and peak shaving, but control algorithms must account
    for the fact that batteries respond with step changes rather than ramp rates designed
    for solar generation — and concurrent customer load behaviour can compromise control
    accuracy, so grid credit or ancillary service schemes must accommodate this variability
    in dispatch accuracy.
