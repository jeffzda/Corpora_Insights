  source_title: Carnarvon DER Trials End of Project Lessons Learnt
  publish_date: 2021-07
  project_name: Carnarvon DER Trials
  what_happened: The Reposit Box fail-safe feature — custom-designed for the trials
    — automatically ramped DER output to zero export upon loss of internet connectivity,
    protecting the network from uncontrolled high-penetration DER events and also
    incentivising customers to maintain their internet connections.
  lesson_learnt: Design DER control systems with explicit fail-safe behaviour on communications
    loss — ramping to zero export on connectivity loss protects network stability
    in high-penetration environments and creates a natural customer incentive to maintain
    connectivity.
