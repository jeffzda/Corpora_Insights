- record_id: ARENA-DLV-28807
  source_title: Carnarvon DER Trials Technical Report 2
  publish_date: 2021-05
  project_name: Carnarvon Distributed Energy Resource (DER) Trials
  what_happened: A series of experiments testing Volt-VAr response mode activation
    on inverters comprising 35% of DER on the Gibson Street Feeder found no significant
    reduction in network-level voltage, despite inverters responding as expected and
    absorbing reactive power according to settings. It was subsequently identified
    that legacy inverters without Volt-VAr capability (which had previously been tripping
    under high voltage) remained online and continued to drive voltage up to levels
    just below the previous trip threshold, masking the Volt-VAr effect.
  lesson_learnt: Volt-VAr response mode is only effective at managing voltage rise
    on an LV network section if a sufficiently large proportion of systems on that
    section have the capability enabled — in mixed networks with legacy non-Volt-VAr
    inverters, partial Volt-VAr deployment may be ineffective or its effect masked
    by the behaviour of non-participating inverters, requiring careful population
    assessment before deployment.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: network business
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: The Gibson Street transformer tap was lowered by one tap position
    in late September 2019; however, this also did not produce the expected reduction
    in maximum voltages, for similar reasons related to previously-tripping inverters
    now remaining online.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id004
  - 61
  evidence_excerpt: No significant change in network voltage due to the activation
    or varied configurations of Volt-VAr response mode within the inverters was observed.
    It seemed that the effect of the Volt-VAr response led to fewer PV inverters without
    Volt-VAr capability tripping off. These inverters (without Volt-VAr capability)
    stayed on and then pushed the voltage up to a voltage slightly lower than previous
    that made it unclear the Volt-VAr was having an effect when it in fact was.
  confidence_note: The failure mode is primarily design assumption failure (assumption
    that partial Volt-VAr deployment would be sufficient). Technical underperformance
    is secondary — inverters absorbed reactive power as specified but the network-level
    outcome was not achieved.
