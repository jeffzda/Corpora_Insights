- record_id: ARENA-DLV-64623
  source_title: Carnarvon DER Trials End of Project Lessons Learnt
  publish_date: 2021-07
  project_name: Carnarvon DER Trials
  what_happened: Customers with existing solar PV systems but no previous visibility
    of their system performance engaged highly with the Solar Analytics monitoring
    app once provided with smart monitors, using it to identify shading, panel soiling,
    and inverter failures.
  lesson_learnt: Providing customers with real-time visibility of their DER system
    performance through smart monitoring apps is a low-cost engagement tool that drives
    behavioural change and helps participants identify faults — include monitoring
    dashboards as a standard feature of customer-facing DER trials.
  issue_severity: none
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: no material delay stated
  failure_mode: no major failure stated
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: null
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id046
  - 8
  evidence_excerpt: Many had no previous visibility of their system performance, most
    of which were more than six years old. Having visibility of their energy production
    enabled them to see the impact of shading and dirt build up on panels. One customer
    discovered one of his inverters had failed.
