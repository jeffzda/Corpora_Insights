  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: network business
  delay_category: commissioning/integration
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: The project switched from inverter upgrades to battery and inverter
    augmentation of the existing PV systems, avoiding the wiring standard trigger
    and preserving participants' feed-in tariff eligibility.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: DER
  source_pages:
  - 7
  - 8
  evidence_excerpt: The original intention was to offer the customers with existing
    solar PV systems an inverter upgrade; however, the age of the existing systems
    meant that they all had inverters with transformers. The switch to a transformer-less
    inverter was complicated by the requirement to upgrade PV module wiring to the
    latest standard, which in turn equated to a system upgrade substantial enough
    to render the customers ineligible for continued participation in the premium
    feed-in tariff scheme.
