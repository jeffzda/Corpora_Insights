- record_id: ARENA-DLV-28802
  source_title: Carnarvon DER Trials Technical Report 2
  publish_date: 2021-05
  project_name: Carnarvon Distributed Energy Resource (DER) Trials
  what_happened: Inverter audit results revealed that the most common reasons for
    failure were incorrect passive anti-islanding settings, incorrect inverter response
    mode settings (Volt-Watt, Volt-VAr, Hz-Watt), and missing or incorrect frequency
    and voltage reconnect parameters. For post-July 2019 systems, 34 out of 135 audited
    did not meet FiM requirements, with some installers showing zero FiM compliance,
    indicating they were entirely unaware of the requirements.
  lesson_learnt: Network operators must establish mandatory installer compliance verification
    processes at the time of PV system connection — including photographic evidence
    of settings and post-installation audits — because relying on installer self-compliance
    without accountability leads to widespread non-compliance, as demonstrated by
    a 98.5% non-compliant rate in Carnarvon. Installer awareness programs targeting
    those operating across different network jurisdictions are also essential.
  issue_severity: major
