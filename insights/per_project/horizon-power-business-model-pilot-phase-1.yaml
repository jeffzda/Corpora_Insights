  what_happened: Horizon Power concentrated the majority of new DER installations
    and system upgrades onto a single LV feeder (Gibson Street) that already had moderately
    high PV penetration, deliberately creating a high-penetration environment where
    solar PV production regularly exceeded combined feeder load at midday.
