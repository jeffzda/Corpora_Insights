  what_happened: Customer internet connection availability for VPP control via Reposit
    boxes across 17 devices achieved 98% availability over approximately one month,
    with three instances of outages exceeding 24 hours (38, 102 and 274 hours). Excluding
    these outlier outages, average availability was 99%. Average data usage was 321
    MB per month per device, considered acceptable for remote network cost environments.
  lesson_learnt: Customer internet connections are generally sufficient for DER VPP
    control in remote settings (98–99% availability, acceptable data volumes), but
    extended outage events can occur and the fallback setpoint mechanism is critical
    for network safety — utilities must configure default setpoints that prevent reverse
    power flow before relying on customer internet for DER management, and should
    not upgrade to dedicated communications networks based on availability concerns
    alone.
