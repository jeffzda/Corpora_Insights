  source_title: Horizon Power Carnarvon DER Trials Technical Report
  publish_date: 2020-03
  project_name: Carnarvon Distributed Energy Resources (DER) Trials
  what_happened: 'Widespread inverter tripping events were found to be too easily
    triggered on the Carnarvon network, with the report noting a regulatory dimension:
    inverters appear to be configured with protection settings suited to grid-connected
    (non-islanded) networks rather than the isolated microgrid context, and actual
    islanding events did not occur in practice because simultaneous load-matching
    coincidence is very unlikely.'
  lesson_learnt: Inverter protection settings appropriate for mainland grid-connected
    installations may be overly sensitive in isolated microgrid contexts — network
    operators deploying DER in remote microgrids should work with inverter manufacturers
    and regulators to review and calibrate protection settings for isolated network
    characteristics, reducing unnecessary tripping without compromising safety.
