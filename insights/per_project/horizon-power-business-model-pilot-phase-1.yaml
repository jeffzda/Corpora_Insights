  - 59
  evidence_excerpt: Response time, ramp rates and how accurately the system achieves
    the desired setting or setpoint are recurring themes in a number of the experiments
    involving VPPs and are important considerations from a system control point of
    view. Of importance was that VPPs behave in the desired manner, which is the net
    export power adjusts to a Reposit node setpoint within 5 minutes. Experiments
    on VPP Configuration and Control and the Feed in Management (Export Limit) demonstrated
    the Reposit product as an attractive solution to DER issues from the prosumer
    and network operator perspective.
