- record_id: ARENA-DLV-28816
  source_title: Carnarvon DER Trials Technical Report 2
  publish_date: 2021-05
  project_name: Carnarvon Distributed Energy Resource (DER) Trials
  what_happened: Prior to the Carnarvon DER Trials, Horizon Power worked with IBM
    to develop a predictive analytics model for PV generation and demand forecasting.
    The IBM Deep Thunder weather model achieved a MAPE of 12.4% for PV generation
    overall, but this degraded to 24.1% on cloudy days due to difficulty predicting
    the timing of cloud cover. Additionally, the model was trained on metered net
    data (generation minus demand) rather than disaggregated generation data, which
    further reduced accuracy for PV prediction.
  lesson_learnt: Weather-model-based day-ahead PV generation forecasts for isolated
    microgrids are inadequate on cloudy days due to difficulties in predicting cloud
    timing and intensity — sky camera-based nowcasting systems and disaggregated generation/demand
    metering are required inputs for reliable short-term PV forecasting in isolated
    network control applications.
