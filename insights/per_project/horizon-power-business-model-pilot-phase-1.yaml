    penetration must use time-interval-specific diversity factors aligned with generator
    start times (e.g. diesel ~30 seconds, gas ~3 minutes) rather than a single fixed
    value — using a single factor risks either over-restricting hosting capacity or
    under-estimating required spinning reserve.
