- record_id: ARENA-DLV-28826
  source_title: Carnarvon DER Trials Technical Report 2
  publish_date: 2021-05
  project_name: Carnarvon Distributed Energy Resource (DER) Trials
  what_happened: The Carnarvon DER Trials found that response time, ramp rates, and
    setpoint accuracy were recurring issues across multiple VPP experiments. The critical
    requirement — that net export power adjusts to a Reposit node setpoint within
    5 minutes — was generally met, and the Reposit system demonstrated capability
    for both individual and aggregated DER control including load shifting, peak shaving,
    and feed-in management from the network operator's perspective.
  lesson_learnt: VPP platforms intended for network management in isolated microgrids
    must be evaluated specifically against three operational metrics — latency (response
    time), ramp rate compliance, and setpoint accuracy — under multiple control scenarios
    including post-curtailment release, since performance on these metrics determines
    whether the VPP can reliably substitute for centralised spinning reserve management.
  issue_severity: minor
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: network business
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id021
  - 8
  - 53
