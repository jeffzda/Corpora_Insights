  project_name: Carnarvon DER Trials
  what_happened: Social science objectives were compromised because participants were
    gifted DER assets, inherently altering their attitudes and behaviours around energy
    consumption; data did not span a full seasonal cycle, and feed-in tariff pricing
    signals were not applied to complement the research.
  lesson_learnt: If social science is a project objective alongside technical trials,
    ensure participants can provide unbiased observations by designing questionnaires
    carefully, collecting 'before and after' datasets spanning at least one year to
    capture seasonal variation, and applying feed-in tariff or pricing signals that
    align with research objectives — do not gift assets to social science participants.
