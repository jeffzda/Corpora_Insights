  evidence_excerpt: Semi-rural properties very often have their dwelling distant from
    the meter box, in some cases over 50m... Trenching was required to accommodate
    an ethernet cable running from the location of the Reposit Box in the distribution
    centre at the dwelling, to the meter box on the boundary of the property... The
    trenching was an unforeseen complexity which further delayed the installation
    of several DER systems.
