  source_title: 'Horizon Power Carnarvon DER Lessons Learnt #1'
  publish_date: null
  project_name: Carnarvon DER Trials
  what_happened: The planned inverter upgrade for customers with existing legacy PV
    systems could not proceed as designed because the legacy inverters contained transformers,
    and switching to transformerless inverters triggered a requirement to upgrade
    PV module wiring to current standards — a change substantial enough to make customers
    ineligible for the premium feed-in tariff scheme.
  lesson_learnt: Before designing legacy PV system upgrades for DER trials, check
    whether the upgrade pathway will affect participants' eligibility for existing
    feed-in tariff schemes; a seemingly minor inverter change can trigger broader
    wiring upgrade obligations that disqualify customers from premium tariffs and
    make them unwilling to participate.
