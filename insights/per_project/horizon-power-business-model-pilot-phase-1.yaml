  what_happened: 'Horizon Power''s LV network voltage standard (240 V ±6%, range 225.6–254.4
    V) is more conservative than both the Australian standard AS60038 (230 V, -6%/+10%,
    range 216.2–253 V) and the international standard IEC60038 (230 V, ±10%, range
    207–253 V), resulting in a substantially inflated count of apparent ''low voltage
    events'': 834 under Horizon Power''s standard versus only 103 under IEC60038.'
  lesson_learnt: When reporting voltage compliance events in DER trials on isolated
    networks, explicitly state which voltage standard is applied and test results
    against multiple standards — applying a conservative in-house standard without
    cross-referencing to AS/IEC benchmarks can significantly overstate low-voltage
    risk and distort network intervention decisions.
