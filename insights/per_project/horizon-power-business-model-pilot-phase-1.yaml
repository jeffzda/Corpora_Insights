  evidence_excerpt: In the event of a loss of internet connection, the Reposit boxes
    use a feature which was custom designed for the trials, which reduces the solar
    PV output and ramps the DER slowly to zero export. This reduces the impact of
    uncontrolled DER on the network, which could foreseeably cause problems in a high
    penetration DER environment. It also provides an incentive to customers to ensure
    an internet connection is available for the Reposit Box.
