  source_title: Horizon Power Carnarvon DER Trials Technical Report
  publish_date: 2020-03
  project_name: Carnarvon Distributed Energy Resources (DER) Trials
  what_happened: On the Gibson Street LV feeder — deliberately selected as a high-penetration
    DER test environment — both high voltage events (during midday PV export) and
    low voltage events (during evening peak load) were observed, making a simple transformer
    tap adjustment an inadequate solution because lowering the tap to fix voltage
    rise would worsen low voltage at peak load times.
  lesson_learnt: LV feeders with both significant PV export and high evening loads
    cannot be managed by a single transformer tap adjustment; more sophisticated solutions
    such as inverter voltage response modes, online tap-changing transformers, or
    line drop compensation are required — and feeder-specific monitoring is essential
    to identify which feeders face this combined condition.
