- record_id: ARENA-DLV-40562
  source_title: 'Horizon Power Carnarvon DER Lessons Learnt #1'
  publish_date: null
  project_name: Carnarvon DER Trials
  what_happened: 'The choice of a semi-rural distribution feeder with properties having
    dwellings located far from meter boxes (sometimes over 50 m) and intermediate
    loads (sheds, bore pumps) between the meter and dwelling created an unforeseen
    design and installation complexity: ethernet cable trenching was required to connect
    the Reposit Box at the dwelling to the current transformer at the meter box, further
    delaying several installations.'
  lesson_learnt: When selecting a distribution feeder for DER control trials requiring
    net feed-in management, assess property configurations early — semi-rural properties
    with dwellings distant from meter boxes and intermediate loads will require additional
    civil works (trenching) that add cost and delay; urban or peri-urban feeders with
    standard property layouts are preferable unless rural conditions are essential
    to the research.
