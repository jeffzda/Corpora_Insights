  source_title: Carnarvon DER Trials Technical Report 2
  publish_date: 2021-05
  project_name: Carnarvon Distributed Energy Resource (DER) Trials
  what_happened: A hypothetical spinning reserve scenario demonstrated that combining
    short-term solar forecasting (10-minute prediction horizon) with PV feed-in management
    via VPP allows proactive ramping of managed PV before cloud events, keeping generator
    loading between 62–84% and spinning reserve within 1.1–3.4MW throughout a cloud
    event, compared to the existing strategy which required unplanned sequential generator
    starts and generator loadings dropping to 42%.
  lesson_learnt: Integrating short-term solar forecasting (with prediction horizon
    greater than generator start time) with VPP-based PV feed-in management enables
    proactive spinning reserve adjustment in isolated microgrids with high PV penetration
    — this combination avoids reactive generator starts during cloud events and enables
    fuel savings during sustained clear weather, and should be designed into operational
    control systems before PV penetration reaches critical thresholds.
