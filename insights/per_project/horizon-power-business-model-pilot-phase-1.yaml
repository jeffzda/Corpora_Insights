  secondary_failure_mode: technical underperformance
  intervention_note: Reposit was notified of the setpoint accuracy issue; further
    investigation and experimentation was planned pending rectification by the vendor.
  transferability: moderate
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id005
