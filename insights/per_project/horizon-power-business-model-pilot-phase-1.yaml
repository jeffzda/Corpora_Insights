  source_title: Carnarvon DER Trials Technical Report 2
  publish_date: 2021-05
  project_name: Carnarvon Distributed Energy Resource (DER) Trials
  what_happened: Analysis of unmasked load data from Wattwatcher-equipped trial participants
    in Carnarvon revealed that fluctuations in net load between 7:30 and 16:30 were
    dominated by cloud-induced PV generation fluctuations rather than true load variability.
    The largest unmasked loads occurred in summer months around midday, suggesting
    consumers proactively use PV-generated power when available. This finding was
    only possible because the Wattwatcher devices recorded both gross PV generation
    and net import/export simultaneously.
  lesson_learnt: Net metering alone is insufficient for understanding true customer
    load behaviour in high-PV networks — gross generation and net import/export monitoring
    at the premises level is required to unmask actual load profiles, which is essential
    for accurate spinning reserve calculations, cloud event impact assessment, and
    demand forecasting in isolated microgrids with high PV penetration.
