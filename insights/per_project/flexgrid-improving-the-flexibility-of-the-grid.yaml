- record_id: ARENA-DLV-72246
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects - First Edition Results'
  publish_date: '2015'
  project_name: FLEXGRID – Improving the flexibility of the grid
  what_happened: Red Eléctrica de España demonstrated two complementary technologies — real-time thermal rating (RTTR) of power lines and an Overhead Line Controller (OLC) — to increase wind integration
    by enabling dynamic line ratings and active power flow control. The project achieved 40% higher average additional wind power integration and avoided up to 24 GWh/year of redispatch generation.
  lesson_learnt: Combining dynamic line rating with active power flow control can substantially increase renewable hosting capacity on existing transmission infrastructure without building new lines — transmission
    planners facing renewable curtailment should evaluate these technologies as lower-cost alternatives to network augmentation.
