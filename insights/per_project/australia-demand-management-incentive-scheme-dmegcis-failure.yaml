- record_id: ARENA-DLV-16270
  source_title: Energy Storage Study
  publish_date: 2015-07
  project_name: Australia — Demand Management Incentive Scheme (DMEGCIS) Failure
  what_happened: The Demand Management and Embedded Generation Connection Incentive
    Scheme (DMEGCIS), designed to incentivise NSPs to pursue non-network solutions
    including energy storage, was found by the AER and DNSPs to have not effectively
    met its goals. It was described as administratively heavy and costly, with two
    rule change requests pending to reform it.
  lesson_learnt: Demand management incentive schemes for NSPs must be simple to administer
    and offer genuine cost recovery plus profitability to change procurement behaviour
    — administratively complex schemes with pure cost-recovery focus will not induce
    NSPs to adopt non-network alternatives including energy storage.
