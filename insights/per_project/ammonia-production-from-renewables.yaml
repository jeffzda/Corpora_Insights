- record_id: ARENA-DLV-19454
  source_title: Ammonia Production from Renewables Midterm Activity July 2020
  publish_date: 2020-07
  project_name: Ammonia Production from Renewables R&D Project (Monash University)
  what_happened: The project team identified intense global competition in electrochemical
    ammonia synthesis, with ARPA-E in the US and other government funding agencies
    supporting multiple international competitors, creating time pressure to demonstrate
    the technology's distinctive value proposition at commercially relevant scales.
  lesson_learnt: For deep-tech R&D projects in globally competitive spaces, the window
    to demonstrate a distinctive value proposition at commercially relevant scale
    is time-limited — project plans should explicitly account for international competitive
    dynamics and target scale-up demonstrations before competitor technologies consolidate
    market position.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: commercial & market
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Formation of Jupiter Ionics as a spin-out vehicle was partly
    motivated by the need to accelerate commercialisation and attract strategic investors
    to maintain competitive pace.
  transferability: moderate
  delay_magnitude: null
  technology_domain: hydrogen
  source_pages: &id004
  - 12
  evidence_excerpt: we are mindful that this is a competitive space globally, with
    ARPA-E in the US and other government funding agencies supporting multiple international
    competitors. With the global market for Green Ammonia gaining increasing recognition,
    time will be of the essence as we seek to demonstrate the distinctive value proposition
    of our technology in operation at commercially-relevant scales.
  confidence_note: failure_mode rated commercial/demand failure as the risk is loss
    of competitive position rather than a technical failure; issue_severity moderate
