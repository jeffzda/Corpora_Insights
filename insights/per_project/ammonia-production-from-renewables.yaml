- record_id: ARENA-DLV-19452
  source_title: Ammonia Production from Renewables Midterm Activity July 2020
  publish_date: 2020-07
  project_name: Ammonia Production from Renewables R&D Project (Monash University)
  what_happened: The project achieved an ammonia generation rate of more than 0.6
    g h-1 m-2 at 60–70% faradaic efficiency, exceeding Milestone 2.3 target of ≥0.5
    g h-1 m-2, and also achieved an order-of-magnitude higher improvement than planned
    for catalyst performance (Milestone 2.1), advancing the technology from TRL 2
    toward TRL 4.
  lesson_learnt: Combining redox-mediated electroreduction with optimised aprotic
    electrolyte systems can deliver order-of-magnitude performance gains over planned
    targets in lab-scale nitrogen reduction — iterative optimisation of electrolyte
    chemistry and cell design simultaneously can unlock non-linear performance improvements.
  issue_severity: none
  project_type: industrial decarbonisation
