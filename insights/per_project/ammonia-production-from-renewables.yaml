- record_id: ARENA-DLV-19453
  source_title: Ammonia Production from Renewables Midterm Activity July 2020
  publish_date: 2020-07
  project_name: Ammonia Production from Renewables R&D Project (Monash University)
  what_happened: Monash University initiated a commercialisation pathway in June 2020
    by commissioning an external business development consultant, receiving commercialisation
    advice in August 2020, and proceeding to establish a spin-out company (Jupiter
    Ionics Pty Ltd) with initial seed investment from Melbourne-based investors, targeting
    operational status by March 2021.
  lesson_learnt: For university-led R&D projects approaching TRL 4, proactively engaging
    an external commercialisation consultant early — before project completion — can
    accelerate the transition to a spin-out vehicle and attract seed investment while
    ARENA-funded work is still generating IP and momentum.
