- record_id: ARENA-DLV-23911
  source_title: Australia's Off-Grid Clean Energy Market Research Paper
  publish_date: '2014-10-08'
  project_name: Coral Bay Wind-Diesel Hybrid Power Station
  what_happened: The Coral Bay wind turbines were designed to be tilted down in the event of extreme wind events such as cyclones — a design feature required for coastal Pilbara locations exposed to cyclonic
    conditions approximately seven times per decade.
  lesson_learnt: Wind turbines in cyclone-prone remote areas (such as coastal Pilbara sites) must be specifically designed for cyclone resilience — tiltable turbines or cyclone-rated designs are required
    and while more expensive, many remain competitive with diesel generation costs.
