  evidence_excerpt: The town sources 45 per cent of energy from the wind turbines. Wind generation routinely exceeds 90 per cent of the town's requirements... The wind energy input saves approximately 500kL
    of diesel per year, which formed the basis for the project business case. In addition, the flywheel energy storage reduced the need to run an extra diesel unit for spinning reserve, allowing additional
    maintenance cost savings.
