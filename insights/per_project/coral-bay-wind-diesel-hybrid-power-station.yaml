- record_id: ARENA-DLV-23910
  source_title: Australia's Off-Grid Clean Energy Market Research Paper
  publish_date: '2014-10-08'
  project_name: Coral Bay Wind-Diesel Hybrid Power Station
  what_happened: A wind-diesel hybrid system was installed at Coral Bay in 2007 for $12 million (total system), integrating three 275kW wind turbines and a 500kW flywheel with seven low-load diesel generators.
    The system provides 45% of community energy from wind, with wind routinely exceeding 90% of instantaneous demand.
  lesson_learnt: Low-load diesel generators combined with flywheel energy storage and a micro-grid controller are an effective configuration for high-penetration wind-diesel hybrid systems in remote communities
    — the Coral Bay system achieved 45% annual wind energy penetration and saved approximately 500kL of diesel per year while also reducing spinning reserve requirements.
