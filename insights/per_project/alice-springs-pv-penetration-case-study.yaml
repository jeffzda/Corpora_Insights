- record_id: ARENA-DLV-48559
  source_title: 'Alice Springs: A Case Study of Increasing Levels of PV Penetration
    in an Electricity Supply System'
  publish_date: 2011-06
  project_name: Alice Springs PV Penetration Case Study
  what_happened: The Alice Solar City program funded smart meters with interval data
    logging for all 277 residential and 35 commercial PV systems installed under the
    program, capturing gross load consumption and PV output separately. The 183 residential
    systems installed outside the program received only simple consumption meters
    without interval data capability, creating an uneven monitoring dataset across
    the network and limiting P&W's ability to analyse actual PV performance and penetration
    effects.
  lesson_learnt: Standardise metering requirements across all grid-connected PV installations
    — not just program-funded ones — to ensure a complete and consistent dataset for
    network monitoring and analysis; retrospectively upgrading metering on non-program
    systems is costly, and the gap in data quality directly limits a utility's ability
    to identify and respond to emerging PV penetration issues.
  issue_severity: minor
  project_type: network/grid
  project_scale_band: utility/large-scale
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: null
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: P&W assessed the feasibility of using smart meters already installed
    at ASC and larger commercial PV system premises to log voltage data alongside
    billing data, and planned to install meters on high-penetration distribution transformers
    to supplement the gaps in customer-level data.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id006
  - 23
  - 24
  - 39
  evidence_excerpt: The 183 residential PV systems installed outside the ASC program
    typically receive utility meters that are configured as simple consumption meters
    that measure total PV system output and total load consumption separately but
    are not configured to measure interval data or support in-house energy displays...
    These different approaches to metering and monitoring obviously result in different
    levels of energy data being available for these PV systems and their associated
    households, for monitoring and analysis purposes.
