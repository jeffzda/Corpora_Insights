- record_id: ARENA-DLV-48556
  source_title: 'Alice Springs: A Case Study of Increasing Levels of PV Penetration
    in an Electricity Supply System'
  publish_date: 2011-06
  project_name: Alice Springs PV Penetration Case Study
  what_happened: Despite a significant increase in PV systems connected to the Alice
    Springs LV network — reaching up to 31% PV power/load ratio at the distribution
    transformer level on the highest-penetration transformer — P&W had not experienced
    any PV-related LV voltage management problems as at the time of the report. However
    P&W recognised this as a latent risk and initiated a targeted voltage study on
    the highest-concentration section of the network in conjunction with Charles Darwin
    University.
  lesson_learnt: Proactively commission a distribution-level voltage study on the
    highest-PV-concentration circuits before voltage problems emerge, rather than
    waiting for customer complaints — this gives network planners time to identify
    and implement mitigation (e.g. lowering nominal LV voltage from 240V to 230V)
    before penetration reaches critical levels.
