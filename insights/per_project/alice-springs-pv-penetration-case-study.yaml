  source_title: 'Alice Springs: A Case Study of Increasing Levels of PV Penetration
    in an Electricity Supply System'
  publish_date: 2011-06
  project_name: Alice Springs PV Penetration Case Study
  what_happened: With the 1MW Uterne PV system due for connection in mid-2011, P&W
    identified that PV peak power penetration at the system level would rise to approximately
    8% of winter midday load — roughly 50% higher than existing penetration — and
    that spinning reserve requirements during midday hours would need to be reviewed
    to account for potential rapid loss of up to 2.5MW of PV generation.
  lesson_learnt: Network operators should conduct a formal spinning reserve review
    before connecting any single PV system large enough to materially shift system-level
    PV penetration, as the step-change in instantaneous generation exposure may require
    revised generator dispatch arrangements.
