- record_id: ARENA-DLV-48564
  source_title: 'Alice Springs: A Case Study of Increasing Levels of PV Penetration
    in an Electricity Supply System'
  publish_date: 2011-06
  project_name: Alice Springs PV Penetration Case Study
  what_happened: P&W assessed reverse power flow, network fault protection impacts,
    PV islanding, and harmonic injection from PV inverters as potential integration
    issues, and determined that at current and near-term PV penetration levels none
    of these represented a concern on the Alice network. P&W attributed the absence
    of harmonic issues to the good quality inverters installed, rather than to low
    penetration alone.
  lesson_learnt: Utilities integrating PV at moderate penetration levels on small
    grids should systematically assess and document all canonical high-penetration
    risk categories — including reverse power flow, fault protection, islanding and
    harmonics — even when current penetration levels are low, to establish a baseline
    and prioritise future monitoring as penetration grows; inverter quality specification
    at connection approval is an effective pre-emptive control for harmonics.
