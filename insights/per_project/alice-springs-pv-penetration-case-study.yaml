  what_happened: At the time of the case study, no collated information existed on
    actual PV power output and energy delivered across all systems on the Alice network,
    meaning PV penetration figures at the system level could only be estimated using
    assumed output factors rather than measured data. P&W identified this as a gap
    in its ability to monitor and manage PV penetration effects.
  lesson_learnt: Network operators should establish a mechanism to collate actual
    PV power and energy output data from all connected systems — not just program-funded
    or large systems — before penetration levels reach the point where active management
    is required; relying on estimated output factors for penetration assessments limits
    the precision of operational decision-making.
