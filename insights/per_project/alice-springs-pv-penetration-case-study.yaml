- record_id: ARENA-DLV-48561
  source_title: 'Alice Springs: A Case Study of Increasing Levels of PV Penetration
    in an Electricity Supply System'
  publish_date: 2011-06
  project_name: Alice Springs PV Penetration Case Study
  what_happened: P&W found that in the Alice Springs isolated network, PV peak power
    penetration was higher in winter (5.3% of midday load) than summer (4.3%) despite
    lower absolute PV output in winter, because winter midday system load (26MW average)
    is substantially lower than summer midday load (40MW average). This counter-intuitive
    relationship between seasonal load profile and effective PV penetration was identified
    as an important planning consideration for small autonomous grids.
  lesson_learnt: On small isolated networks with pronounced seasonal load variation,
    utilities should assess PV penetration against minimum seasonal load conditions
    (not peak load) to identify the binding constraint — effective PV penetration
    can be significantly higher in low-demand seasons even when absolute PV output
    is lower, and this drives spinning reserve, voltage and frequency management requirements.
