  source_title: 'Alice Springs: A Case Study of Increasing Levels of PV Penetration
    in an Electricity Supply System'
  publish_date: 2011-06
  project_name: Alice Springs PV Penetration Case Study
  what_happened: The Alice Solar City program — one of seven Australian Government
    Solar Cities — drove a rapid increase in PV connections from 2 systems before
    2008 to 528 systems (2.1MWp) by April 2011, through a combination of direct financial
    incentives, a community support framework, and government-funded iconic showcase
    installations. The program generated significant community momentum for PV adoption,
    but was scheduled to end in mid-2013 with no confirmed successor mechanism.
  lesson_learnt: Government-funded solar city or similar aggregated deployment programs
    can rapidly accelerate PV penetration on isolated networks, but utilities need
    to develop long-term integration management plans that extend beyond the program
    horizon — relying on ongoing program funding as the primary driver of PV growth
    creates planning uncertainty for network operators who must manage the cumulative
    penetration impact.
