- record_id: ARENA-DLV-48563
  source_title: 'Alice Springs: A Case Study of Increasing Levels of PV Penetration
    in an Electricity Supply System'
  publish_date: 2011-06
  project_name: Alice Springs PV Penetration Case Study
  what_happened: P&W, which does not own or control grid-connected PV inverters on
    its network, identified that as PV penetration grows, the need for system-wide
    inverter setting changes (e.g. frequency trip, voltage trip, reactive power) will
    become more frequent and operationally significant. The existing model — directing
    individual owners or installers to manually update inverter settings — is inefficient,
    unverifiable and unlikely to achieve full compliance across a large fleet.
  lesson_learnt: Future grid codes and standards (e.g. AS 4777) should require grid-connected
    PV inverters to support remote interrogation and control by the network operator,
    enabling efficient network-wide setting changes without reliance on installer-mediated
    manual updates — this becomes a critical operational requirement as fleet sizes
    grow to hundreds or thousands of units.
  issue_severity: moderate
  project_type: network/grid
  project_scale_band: utility/large-scale
  lifecycle_phase: operations
  proponent_type: network business
