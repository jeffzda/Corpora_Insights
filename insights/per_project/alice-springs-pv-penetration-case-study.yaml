- record_id: ARENA-DLV-48562
  source_title: 'Alice Springs: A Case Study of Increasing Levels of PV Penetration
    in an Electricity Supply System'
  publish_date: 2011-06
  project_name: Alice Springs PV Penetration Case Study
  what_happened: P&W's distribution of PV capacity across the Alice network was relatively
    even, with no single distribution transformer having more than 18 residential
    PV systems connected and with the three large iconic/showcase systems located
    at physically distant points on the network. P&W found this geographic spread
    helped buffer the system-level impact of passing clouds on aggregate PV output
    and reduced localised voltage and penetration concerns.
  lesson_learnt: When planning PV deployment across a distribution network, utilities
    and program managers should actively manage the geographic distribution of both
    small distributed systems and large centralised systems to avoid concentrations
    that amplify cloud-induced intermittency effects and localised voltage problems
    — a single 1MW system has a materially greater intermittency impact on the central
    generation system than 500 dispersed 2kW systems of equivalent aggregate capacity.
