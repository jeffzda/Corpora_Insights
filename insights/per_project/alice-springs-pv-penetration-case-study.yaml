- record_id: ARENA-DLV-48558
  source_title: 'Alice Springs: A Case Study of Increasing Levels of PV Penetration
    in an Electricity Supply System'
  publish_date: 2011-06
  project_name: Alice Springs PV Penetration Case Study
  what_happened: P&W observed that when PV systems nearing the output capacity of
    a commercial site's load operate in unity-power-factor (real power only) mode
    — as required by P&W's standard connection rules — the customer's net demand drawn
    from the network during sunny midday periods could consist almost entirely of
    reactive power. P&W identified this as a potential network reactive power management
    problem at higher PV penetration levels.
  lesson_learnt: Network operators should assess reactive power implications of PV
    systems before penetration levels rise, particularly for commercial customers
    where PV capacity may approach site load — requiring larger systems to provide
    reactive power support (or installing power factor correction) addresses the issue
    at the point of connection rather than retrospectively.
  issue_severity: minor
  project_type: network/grid
  project_scale_band: utility/large-scale
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: P&W required a 100kW PV system to install a 60 kVAr power factor
    correction unit (~$6,000) to maintain power factor above 0.85, and made reactive
    power provision a specific requirement in the Uterne 1MW power purchase agreement.
  transferability: moderate
