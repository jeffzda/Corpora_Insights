- record_id: ARENA-DLV-48551
  source_title: 'Alice Springs: A Case Study of Increasing Levels of PV Penetration
    in an Electricity Supply System'
  publish_date: 2011-06
  project_name: Alice Springs PV Penetration Case Study
  what_happened: During several system frequency drop events in 2010, PV inverters
    on the Alice Springs network tripped offline when frequency fell below 49.9Hz
    — the default European grid-connection trip setting programmed into the inverters
    at manufacture. With close to 2MW of installed PV capacity, the sudden loss of
    approximately 1MW of PV generation caused a rapid increase in net load on the
    central generators, worsening the frequency event.
  lesson_learnt: In small autonomous grids with wide frequency operating ranges, PV
    inverter low-frequency trip settings must be configured to local grid requirements,
    not imported default settings. For the Alice Springs network, P&W set the requirement
    to 46Hz (below the last load-shedding threshold of 47Hz) to keep PV systems online
    during frequency events — utilities operating small grids should specify and verify
    inverter trip settings at connection, not after an incident.
  issue_severity: moderate
  project_type: network/grid
  project_scale_band: utility/large-scale
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated integration
  intervention_note: For Solar City PV systems, P&W coordinated with the ASC project
    and contracted installers to progressively update settings during 12-monthly service
    inspections; no equivalent verification mechanism existed for non-Solar-City systems.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages:
  - 33
  - 34
  - 35
  evidence_excerpt: After investigating the events P&W came to the conclusion that
    this sudden 1MW rise in load was due to the PV systems on the network dropping
    out once the system frequency fell below the PV inverters' low-frequency trip
    setting of 49.9Hz. PV system inverters connected to the Alice Springs network
    prior to that time had been programmed with frequency trip settings of 50Hz +/-
    0.1Hz which it is understood were the default settings programmed into the inverters
    during manufacture in line with European grid-connection requirements.
