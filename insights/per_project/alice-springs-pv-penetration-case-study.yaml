- record_id: ARENA-DLV-48554
  source_title: 'Alice Springs: A Case Study of Increasing Levels of PV Penetration
    in an Electricity Supply System'
  publish_date: 2011-06
  project_name: Alice Springs PV Penetration Case Study
  what_happened: With close to 2MW of distributed PV installed across the Alice Springs
    network, P&W began observing cloud-induced fluctuations in system net load of
    the order of 1MW over periods of minutes. While not yet causing material operational
    problems, the effect was large enough to be visible on the system net load profile
    and raised concern about spinning reserve adequacy as PV penetration grows — particularly
    with the pending connection of the 1MW Uterne single-site system.
  lesson_learnt: As PV penetration on small isolated grids increases, utilities must
    proactively review spinning reserve requirements to account for rapid MW-scale
    PV power swings caused by clouds, particularly when large single-site systems
    are added — distributed PV arrays buffer this effect better than a single large
    array of equivalent capacity.
