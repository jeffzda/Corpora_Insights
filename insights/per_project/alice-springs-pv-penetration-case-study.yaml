- record_id: ARENA-DLV-48557
  source_title: 'Alice Springs: A Case Study of Increasing Levels of PV Penetration
    in an Electricity Supply System'
  publish_date: 2011-06
  project_name: Alice Springs PV Penetration Case Study
  what_happened: P&W identified that reducing the nominal LV system voltage from 240V
    to 230V — an industry-wide transition already underway in Australia — would provide
    an additional 10V of headroom below the 253V upper voltage limit, directly reducing
    the risk of PV-induced overvoltage events on the LV network. P&W treated management
    of PV-related voltage rise as an additional incentive to accelerate this transition.
  lesson_learnt: Network operators planning for increasing PV penetration should accelerate
    the transition from 240V to 230V nominal LV voltage, as the additional headroom
    this creates below the 253V upper limit directly reduces the risk of PV-induced
    overvoltage and defers the need for more costly network interventions.
