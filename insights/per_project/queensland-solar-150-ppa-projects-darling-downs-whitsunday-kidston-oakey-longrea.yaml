- record_id: ARENA-DLV-10307
  source_title: 'The Generator Operations Series: Forecasts vs Actuals from the LSS
    Projects'
  publish_date: 2022-04
  project_name: Queensland Solar 150 PPA Projects (Darling Downs, Whitsunday, Kidston,
    Oakey, Longreach, Collinsville)
  what_happened: Six LSS projects holding Queensland Government Solar 150 contracts-for-difference
    stopped exporting during periods of negative spot pricing even when nearby projects
    continued to generate and when the LGC value would have justified continued export,
    indicating that PPA terms required curtailment during negative price events —
    a risk not anticipated at the time of contracting.
  lesson_learnt: Offtake agreements with contract-for-difference structures should
    be explicitly reviewed for curtailment obligations during negative pricing periods
    before signing; the Solar 150 PPAs were structured when utility solar penetration
    in Queensland was low, and sponsors did not anticipate that negative pricing would
    become a material operational constraint affecting generation volumes and revenue.
