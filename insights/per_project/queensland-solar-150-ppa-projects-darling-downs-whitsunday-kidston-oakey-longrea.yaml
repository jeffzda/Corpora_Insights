  evidence_excerpt: Analysis of NEM generation data reveals that projects with the
    Solar 150 PPA stop exporting during periods of negative pricing. This happens
    even when the LGC value would justify exporting, and when nearby projects continue
    to generate... This risk of curtailment may not have been anticipated by the sponsors
    at the time of bidding to ARENA due to the low penetration of utility solar in
    Queensland at the time.
