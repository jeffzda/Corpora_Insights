- record_id: ARENA-DLV-2960
  source_title: Large-Scale Battery Storage Knowledge Sharing Report
  publish_date: 2019-09
  project_name: ESCRI-SA
  what_happened: The ESCRI-SA battery operator reported that the system struggles
    to capture significant arbitrage value due to the limited energy storage capacity
    (8 MWh) of the system relative to its 30 MW power rating.
  lesson_learnt: LSBS systems with low energy-to-power ratios (short duration) are
    poorly suited to capturing wholesale energy arbitrage revenue; project developers
    should calibrate energy storage capacity to the intended revenue streams and not
    rely on arbitrage as a material income source for short-duration systems.
