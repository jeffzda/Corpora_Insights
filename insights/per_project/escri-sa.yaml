- record_id: ARENA-DLV-2979
  source_title: Large-Scale Battery Storage Knowledge Sharing Report
  publish_date: 2019-09
  project_name: ESCRI-SA
  what_happened: ESCRI-SA became the first grid-connected Australian battery to operate
    in voltage source mode as a virtual synchronous generator while grid-connected
    (grid-forming), demonstrating simulated inertia, improved voltage stability, and
    system strength through fault current provision — capabilities not previously
    available from LSBS in Australia.
  lesson_learnt: Voltage source (grid-forming) inverter configurations offer materially
    superior system security capabilities — including simulated inertia, voltage stability,
    and fault current contribution recognised by AEMO — compared to standard current
    source inverters; developers in weak grid areas or with system security obligations
    should evaluate grid-forming inverter options as part of technology selection.
  issue_severity: none
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: commissioning/integration
  proponent_type: project developer
  delay_category: no material delay stated
  failure_mode: no major failure stated
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id003
  - 10
  - 11
  evidence_excerpt: 'The ESCRI-SA project is also the first LSBS project in Australia
    to operate in voltage source mode as a virtual synchronous generator while grid
    connected (this capability is sometimes known as grid-forming). Benefits provided
    through this operating mode as compared to traditional current source inverters
    are: simulated inertia and improved voltage stability through the very fast response
    capability of voltage source inverters... system strength through provision of
    fault current.'
