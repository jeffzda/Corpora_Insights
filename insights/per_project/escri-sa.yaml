- record_id: ARENA-DLV-2953
  source_title: Large-Scale Battery Storage Knowledge Sharing Report
  publish_date: 2019-09
  project_name: ESCRI-SA
  what_happened: Integration of the Wattle Point Wind Farm for islanded operation
    was identified as a major risk for the ESCRI-SA project and caused issues during
    commissioning, including difficulties with the transition from grid-connected
    to islanded operation; the system was ultimately successfully integrated.
  lesson_learnt: Seamless islanding integration with co-located wind farms is a high-complexity
    commissioning challenge requiring early identification as a major risk; GPS modelling,
    system strength, protection system operation, and control system integration all
    need to be resolved before commissioning, as these issues are not trivial and
    can delay the achievement of intended services.
