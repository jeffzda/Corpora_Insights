- record_id: ARENA-DLV-65957
  source_title: Pooled Energy ARENA Report
  publish_date: 2021-05
  project_name: Pooled Energy Demand Management and Modulation Project
  what_happened: In May 2021, an unusually high number of high-pricing events (368
    events, versus 11 in January 2021) caused swimming pools to be disabled for 125
    hours total, resulting in 6 instances where Pooled Energy had to manually intervene
    to ensure pools ran for minimum biological safety run-times. No automated rules
    existed to handle this scenario.
  lesson_learnt: Demand response control systems for loads with safety or quality
    constraints must include automated minimum-runtime protection rules — relying
    on manual intervention to override price-triggered shutdowns is not scalable and
    creates operational risk when high-pricing events cluster unexpectedly.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: Pooled Energy manually intervened on 6 occasions to ensure pools
    met minimum run-time; future development work was identified to create automated
    rules for short-running of swimming pools.
  transferability: moderate
  delay_magnitude: null
  technology_domain: demand response
  source_pages: &id007
  - 22
  - 23
  evidence_excerpt: As a result of the high number of high-pricing events in May 2021,
    there were 6 events in which Pooled Energy manually intervened to ensure swimming
    pools ran despite the high price of electricity... Currently there are no automated
    rules/responses that perform this task. Future development work is required to
    create rules for the short-running of swimming pools.
