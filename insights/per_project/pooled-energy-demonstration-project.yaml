  what_happened: Registering sodium bromide as a swimming pool chemical with the APVMA
    took almost three years and cost approximately $100,000. The initial application
    was not accepted, and a second regulator (Poisons Scheduling Board under NSW Department
    of Health) added a further six months of consideration time.
