  project_name: Pooled Energy Demand Management and Modulation Project
  what_happened: Pooled Energy found poor customer compliance with maintenance notifications
    sent via SMS, as customers were time-poor, some notifications required purchasing
    chemicals, and excessive notifications led to notification fatigue.
  lesson_learnt: Maintenance notification regimes for residential DER subscribers
    should be rationalised to remove non-critical alerts, bundle actions into scheduled
    batches, time notifications to improve compliance (avoiding weekends, public holidays,
    bad weather), and integrate purchase links directly into notifications requiring
    consumable purchases — excessive or poorly timed notifications cause fatigue and
    low compliance.
