    alert to a passive indicator within the mobile app.
  transferability: broad
  delay_magnitude: null
  technology_domain: demand response
  source_pages: &id005
  - 19
  evidence_excerpt: A number of customers interpreted this as meaning a fault in the
    pool. The mode of communication – an alert appearing on their phone – generated
