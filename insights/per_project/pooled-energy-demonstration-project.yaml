- record_id: ARENA-DLV-65958
  source_title: Pooled Energy ARENA Report
  publish_date: 2021-05
  project_name: Pooled Energy Demand Management and Modulation Project
  what_happened: Pooled Energy's original sensor control approach using instantaneous
    ORP sensor readings suffered from calibration drift, causing unreliable bromine-level
    inference and requiring a redesign of the sensing and control logic.
  lesson_learnt: Chemical sensor control systems for remote pool management should
    use differential or machine-learning-based approaches rather than absolute instantaneous
    sensor values — calibration drift in ORP sensors makes limit-control based on
    raw values unreliable at fleet scale.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Replaced instantaneous ORP limit-control with a differential
    ORP read combined with machine learning to eliminate calibration drift effects,
    producing a control mechanism robust to sensor failures.
  transferability: narrow
  delay_magnitude: not quantified
  technology_domain: demand response
  source_pages: &id008
  - 22
  evidence_excerpt: The original concept was to do limit control of bromine levels
    based on the instantaneous value of an Oxidation-Reduction Potential (ORP) sensor
    from which bromine levels were inferred. We have improved on this using a differential
    read of the ORP sensor and machine learning, which eliminates calibration drift.
  confidence_note: null
