- record_id: ARENA-DLV-65954
  source_title: Pooled Energy ARENA Report
  publish_date: 2021-05
  project_name: Pooled Energy Demand Management and Modulation Project
  what_happened: The Draft Market Ancillary Services Specification (MASS) required
    FCAS metering equipment to be installed at the household electricity meter by
    a licensed electrician, making FCAS participation commercially unviable for Pooled
    Energy's residential pool aggregation model.
  lesson_learnt: DER aggregators targeting FCAS markets should assess metering requirements
    under the draft MASS before committing to FCAS as a revenue stream — device-level
    metering (at the controller) may be technically equivalent but is not currently
    accepted, and engaging the regulator via submissions is necessary to change this.
