  project_name: Pooled Energy Demand Management and Modulation Project
  what_happened: During a load shedding event, 236 of 1,577 pool controllers (approximately
    15%) failed to respond to the load shedding request due to internet connectivity
    problems, limiting effective demand response participation.
  lesson_learnt: DER aggregators should treat communications uptime as a core technical
    performance metric — a 15% connectivity failure rate during demand response events
    materially reduces available load and should be targeted for systematic improvement
    before offering firm capacity to grid operators.
