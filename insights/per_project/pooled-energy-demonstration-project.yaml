- record_id: ARENA-DLV-65963
  source_title: Pooled Energy ARENA Report
  publish_date: 2021-05
  project_name: Pooled Energy Demand Management and Modulation Project
  what_happened: Pooled Energy found that conventional demand management propositions
    that frame consumer participation as a minor inconvenience compensated by payment
    were unattractive; instead, framing the offering around intrinsic consumer benefits
    (better pool quality, convenience, cost savings) proved necessary to acquire customers
    at scale.
  lesson_learnt: Residential demand response aggregation businesses should lead with
    intrinsic consumer benefits rather than grid service compensation — customers
    who join for pool quality and convenience are easier to acquire, more likely to
    stay, and provide demand response as a by-product rather than as the primary transaction.
