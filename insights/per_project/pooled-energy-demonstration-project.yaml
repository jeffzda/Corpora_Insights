  source_title: Pooled Energy ARENA Report
  publish_date: 2021-05
  project_name: Pooled Energy Demand Management and Modulation Project
  what_happened: Pooled Energy pools suffered from persistent 'black spot' algae growth
    for a period, causing significant customer complaints and expensive remediation.
    The cause — elevated phosphate levels acting as a micronutrient for algae — was
    not identified in the original chemistry design.
  lesson_learnt: Novel pool chemistry regimes should include phosphate management
    as a baseline design element — black spot algae requires phosphate as a micronutrient
    and its growth is largely preventable through phosphate suppression, which was
    not incorporated until after customer problems emerged.
