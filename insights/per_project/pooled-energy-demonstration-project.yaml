- record_id: ARENA-DLV-65955
  source_title: Pooled Energy ARENA Report
  publish_date: 2021-05
  project_name: Pooled Energy Demand Management and Modulation Project
  what_happened: During a load shedding event, Pooled Energy sent an SMS and push-notification
    alert to customers reading 'Plan temporarily disabled due to high grid demand.'
    A number of customers interpreted this as a fault in their pool and complained,
    even though no technical issues occurred.
  lesson_learnt: Active push notifications about demand response events can generate
    customer complaints by being interpreted as faults — use passive in-app indicators
    rather than alert-style notifications to communicate planned load shedding to
    residential DER customers.
  issue_severity: minor
  project_type: DER/customer-side
