  evidence_excerpt: Most of the MLF forecasts used by the proponents assume few if
    any changes to their MLF over the project lifespan, although 2 projects assume
    a drop in their MLF by year 20 of operation.
  confidence_note: Classified moderate severity because static MLF assumptions in
    financial models can materially misrepresent long-run project economics as renewable
    penetration increases; the document does not quantify the revenue impact but the
