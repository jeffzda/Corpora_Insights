- record_id: ARENA-DLV-66155
  source_title: 'ARENA''s Large-Scale Solar Program: A look at Levelised Cost of Energy'
  publish_date: 2018-12
  project_name: ARENA Large-Scale Solar Program
  what_happened: ARENA applied a fixed 10% discount rate across all twelve LSS projects
    for LCOE calculation purposes. Sensitivity analysis showed that at r=0% the median
    LCOE is AU$54/MWh, rising to AU$108/MWh at r=10% and AU$144/MWh at r=15%, meaning
    the same projects appear to have very different cost profiles depending on the
    discount rate used.
  lesson_learnt: When benchmarking Australian solar LCOE against international projects
    or other analyses, the discount rate used must be explicitly stated and matched;
    comparisons using different discount rates — or the industry convention of zero-discounting
    future energy generation — are not meaningful and can materially misrepresent
    relative cost competitiveness.
  issue_severity: minor
  project_type: generation
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: development/design
  proponent_type: project developer
  delay_category: null
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: null
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id005
  - 4
  - 5
  evidence_excerpt: The discount rate used to determine the LCOE is particularly important
    when benchmarking Australian PV projects with projects in different countries...
    the median LCOE drops to 54 AU$/MWh at r = 0% and increases to 144 AU$/MWh at
    r = 15%, highlighting the importance of stating, and understanding, the employed
    discount rates when comparing LCOE values for projects in different locations.
  confidence_note: Classified as data quality/measurement failure — the issue is methodological
    inconsistency in how LCOE is reported and compared across contexts rather than
    a project delivery failure per se. Could also be framed as design assumption failure.
