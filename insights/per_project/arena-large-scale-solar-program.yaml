- record_id: ARENA-DLV-66153
  source_title: 'ARENA''s Large-Scale Solar Program: A look at Levelised Cost of Energy'
  publish_date: 2018-12
  project_name: ARENA Large-Scale Solar Program
  what_happened: Most LSS project proponents assumed static or near-static MLF values
    across the 25-year project life in their financial models, with only two projects
    assuming a reduction in MLF by year 20, despite MLF values being recalculated
    annually by AEMO and subject to change as the grid evolves.
  lesson_learnt: Solar project financial models should stress-test revenue projections
    against plausible MLF deterioration scenarios over the project life — assuming
    a static MLF in high-penetration renewable zones materially overstates long-run
    revenue and understates financial risk.
  issue_severity: moderate
  project_type: generation
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: development/design
