  source_pages: &id001
  - 2
  evidence_excerpt: Analysis of both the LCOE spreadsheets and the financial models
    shows that proponents report and interpret costs differently across projects.
    These inconsistencies make it difficult at this stage to accurately compare which
    line-item costs contribute what amount to a project's lifetime cost - for example,
    how and where piling costs are recorded, or whether PV module costs are recorded
    with, or without, transport to site.
  confidence_note: Classified as data quality/measurement failure — the issue is inconsistent
    reporting methodology rather than a technical delivery failure, but it materially
    undermines portfolio-level cost benchmarking.
