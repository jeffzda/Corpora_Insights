- record_id: ARENA-DLV-66152
  source_title: 'ARENA''s Large-Scale Solar Program: A look at Levelised Cost of Energy'
  publish_date: 2018-12
  project_name: ARENA Large-Scale Solar Program
  what_happened: Across the twelve LSS projects, OPEX as a proportion of LCOE showed
    a much larger spread than CAPEX (OPEX ranging from 9% to 21% of LCOE), which the
    analysis attributed to limited long-term market experience in operating and maintaining
    utility-scale solar farms in Australia.
  lesson_learnt: OPEX assumptions in Australian utility-scale solar financial models
    carry substantially more uncertainty than CAPEX assumptions; project developers
    and funders should apply wider contingency ranges to O&M cost forecasts and treat
    OPEX benchmarks from other markets with caution.
