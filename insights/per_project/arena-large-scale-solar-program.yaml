- record_id: ARENA-DLV-66151
  source_title: 'ARENA''s Large-Scale Solar Program: A look at Levelised Cost of Energy'
  publish_date: 2018-12
  project_name: ARENA Large-Scale Solar Program
  what_happened: Analysis of LCOE spreadsheets and financial models across all twelve
    LSS projects revealed that proponents reported and interpreted costs differently
    — for example, piling costs were recorded inconsistently, and PV module costs
    were recorded with or without transport to site — making meaningful line-item
    cost comparison across projects impossible.
  lesson_learnt: Program-level grant requirements should mandate a standardised cost
    taxonomy and line-item reporting structure from the outset; without this, cross-project
    benchmarking of individual cost drivers is unreliable even when proponents use
    a common LCOE calculator.
  issue_severity: moderate
