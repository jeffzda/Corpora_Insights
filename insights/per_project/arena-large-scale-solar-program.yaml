- record_id: ARENA-DLV-66154
  source_title: 'ARENA''s Large-Scale Solar Program: A look at Levelised Cost of Energy'
  publish_date: 2018-12
  project_name: ARENA Large-Scale Solar Program
  what_happened: Most LSS projects determined energy yield for the first year only
    and then applied a fixed DC module degradation rate in financial models, rather
    than modelling annual AC energy yield for each year as recommended by international
    best practice. The DC:AC oversizing effect — which reduces observed AC degradation
    in early years through inverter clipping — was not captured in most financial
    models.
  lesson_learnt: Solar project financial models should calculate annual AC energy
    yield for each year of operation rather than applying a fixed DC degradation rate
    to first-year output; the latter approach fails to capture inverter clipping effects
    and can misstate long-run generation and revenue forecasts.
  issue_severity: minor
  project_type: generation
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: development/design
  proponent_type: project developer
