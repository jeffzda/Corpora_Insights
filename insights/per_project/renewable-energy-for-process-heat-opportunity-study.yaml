- record_id: ARENA-DLV-46314
  source_title: Renewable Energy for Process Heat Opportunity Study
  publish_date: 2020-05
  project_name: Simplot Australia – Renewable Process Heat Feasibility
  what_happened: 'At Simplot''s Devonport vegetable processing plant, the existing
    natural gas boiler was nearing end of life, creating a commercial trigger to evaluate
    renewable alternatives. A two-stage proposal was developed: immediate heat pump
    installation to recover refrigeration waste heat ($1.3–$1.8 million, long payback),
    followed by biomass boiler replacement of the gas boiler at end of life ($5.2
    million versus $4.8 million for a like-for-like gas replacement, with $300k annual
    benefit).'
  lesson_learnt: End-of-life boiler replacement creates the strongest commercial case
    for renewable process heat — when a site's boiler is within 3–5 years of replacement,
    frame the renewable option as a like-for-like replacement cost comparison rather
    than a standalone capital expenditure; at Simplot the incremental cost of biomass
    over gas was only $400k for $300k/year in annual benefit.
