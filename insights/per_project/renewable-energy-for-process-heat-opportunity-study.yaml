- record_id: ARENA-DLV-46305
  source_title: Renewable Energy for Process Heat Opportunity Study
  publish_date: 2020-05
  project_name: Renewable Energy for Process Heat Opportunity Study – Phase 1
  what_happened: Consultants conducting the feasibility studies lacked sufficient
    knowledge of process integration and pinch analysis techniques, limiting their
    ability to optimise renewable process heat solutions. A supplementary workshop
    and mentoring programme were required to address this gap.
  lesson_learnt: Ensure engineering consultants engaged for industrial process heat
    feasibility studies have demonstrated competency in process integration and pinch
    analysis before engagement; if not, budget for structured upskilling before studies
    commence.
