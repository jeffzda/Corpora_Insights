  source_title: Renewable Energy for Process Heat Opportunity Study
  publish_date: 2020-05
  project_name: Renewable Energy for Process Heat Opportunity Study – Phase 1
  what_happened: Lack of metering and data at participating industrial sites was identified
    as the biggest challenge for engineering consultants conducting the pre-feasibility
    and feasibility studies, impeding accurate assessment of process heat demand and
    technology sizing.
  lesson_learnt: Before commissioning process heat feasibility studies at industrial
    sites, confirm that adequate metering and process data are available or can be
    collected; lack of data is the single largest constraint on study quality and
