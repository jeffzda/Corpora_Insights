- record_id: ARENA-DLV-46318
  source_title: Renewable Energy for Process Heat Opportunity Study
  publish_date: 2020-05
  project_name: Simplot Australia – Renewable Process Heat Feasibility
  what_happened: At Simplot's Devonport plant, the limited supply of warm water from
    the existing gas boiler was constraining freezer tunnel defrost cycles, extending
    shutdown times beyond the minimum necessary and reducing the available operating
    window for processing local vegetables during peak season.
  lesson_learnt: When scoping renewable process heat proposals at food processing
    sites, quantify productivity constraints caused by current heat supply limitations
    (e.g. extended defrost cycles) — these productivity benefits can materially improve
    the business case and should be included in the financial model alongside direct
    energy cost savings.
