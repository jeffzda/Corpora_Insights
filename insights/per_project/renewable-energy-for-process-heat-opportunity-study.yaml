- record_id: ARENA-DLV-46312
  source_title: Renewable Energy for Process Heat Opportunity Study
  publish_date: 2020-05
  project_name: Lion – Beer, Spirits and Wine – Renewable Process Heat Feasibility
  what_happened: A feasibility study at Lion's West End Brewery in Adelaide found
    that replacing most of the existing 2×10 MW gas boiler steam supply with two large-scale
    CO2 heat pumps (totalling ~707 kWe electrical input, ~2,343 kWt thermal output)
    was technically feasible with a 4.4-year payback and net energy savings exceeding
    43,000 GJ/year (32% of site total), but the proposal could not replace wort boiling
    above 100°C due to high capital costs for that application.
  lesson_learnt: For brewery decarbonisation, CO2 heat pumps are commercially viable
    for most heating duties below 100°C but cannot economically replace wort boiling
    at current capital costs — design proposals around displacing the bulk of boiler
    duty while retaining a single gas boiler or biogas unit for high-temperature and
    peak loads.
