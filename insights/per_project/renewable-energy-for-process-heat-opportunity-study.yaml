- record_id: ARENA-DLV-46302
  source_title: Renewable Energy for Process Heat Opportunity Study
  publish_date: 2020-05
  project_name: Renewable Energy for Process Heat Opportunity Study – Phase 1
  what_happened: Short payback period requirements (less than 3 years) and conservative
    attitudes towards innovative solutions were identified as a significant barrier
    to uptake of renewable process heating alternatives across participating businesses.
  lesson_learnt: When assessing industrial decarbonisation opportunities, explicitly
    identify whether the target business applies a sub-3-year payback hurdle rate;
    if so, the commercial case for renewable process heat will almost always fail
    unless sustainability objectives are used to justify a longer threshold.
