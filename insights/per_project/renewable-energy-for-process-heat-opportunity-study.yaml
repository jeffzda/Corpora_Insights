- record_id: ARENA-DLV-46307
  source_title: Renewable Energy for Process Heat Opportunity Study
  publish_date: 2020-05
  project_name: Renewable Energy for Process Heat Opportunity Study – Phase 1
  what_happened: Understanding site-specific process heat flows and the exact temperatures
    required for desired outcomes proved essential; studies that did not conduct mass
    energy balance analysis at the pre-feasibility stage, or that failed to differentiate
    between utility demand and process demand, produced less reliable outputs.
  lesson_learnt: Mandate mass energy balance analysis and explicit differentiation
    between utility demand and process demand at the pre-feasibility stage of any
    industrial process heat study — without this, technology sizing and commercial
    estimates will be unreliable.
  issue_severity: moderate
