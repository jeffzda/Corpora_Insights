- record_id: ARENA-DLV-46317
  source_title: Renewable Energy for Process Heat Opportunity Study
  publish_date: 2020-05
  project_name: Lion – Beer, Spirits and Wine – Renewable Process Heat Feasibility
  what_happened: Lion's West End Brewery operated a centralised dual-boiler steam
    system designed for large uniform batches that performed poorly under the modern
    craft beer market's shift to smaller, more variable batches, resulting in low
    system efficiency and poor utilisation. This operational mismatch was the primary
    driver for investigating electrified heat pump alternatives.
  lesson_learnt: Centralised steam systems designed for high-volume uniform production
    are poorly suited to variable batch manufacturing — when a site's production profile
    has shifted toward smaller batches, the system efficiency argument for electrified
    distributed heat pump technology is strongest and should be the primary framing
    in a business case.
