- record_id: ARENA-DLV-46308
  source_title: Renewable Energy for Process Heat Opportunity Study
  publish_date: 2020-05
  project_name: Renewable Energy for Process Heat Opportunity Study – Phase 1
  what_happened: Local equipment suppliers for renewable process heat technologies
    (particularly large-scale heat pumps) were found to be at the thin end of a long
    international supply chain, with some overseas suppliers declining to enter the
    Australian market due to its perceived small size and geographic remoteness.
  lesson_learnt: When planning renewable process heat projects in Australia, conduct
    early supply chain mapping to confirm that shortlisted equipment is actually available
    in-country; overseas suppliers of large industrial heat pumps may not service
    the Australian market, requiring procurement via long international supply chains
    or technology substitution.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: procurement
  proponent_type: research organisation/university
  delay_category: procurement/supply chain
  failure_mode: execution & logistics
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: A2EP commenced direct engagement with overseas suppliers to increase
    the range of renewable process heating technologies available in Australia and
    to demonstrate the potential size of the Australian market.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: industrial renewables
  source_pages: &id008
  - 13
  evidence_excerpt: Local equipment suppliers are at the thin end of a long supply
    chain and not all on-market options are available in Australia. Some overseas
