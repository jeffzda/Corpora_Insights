- record_id: ARENA-DLV-46304
  source_title: Renewable Energy for Process Heat Opportunity Study
  publish_date: 2020-05
  project_name: Renewable Energy for Process Heat Opportunity Study – Phase 1
  what_happened: Retrofitting renewable process heat technologies proved to be more
    complex than expected at large operational manufacturing sites, where incremental
    changes to specific processes were typically all that was feasible rather than
    whole-of-site system changes.
  lesson_learnt: For large operational sites, scope feasibility studies around incremental
    process-specific interventions rather than whole-of-site redesigns; retain whole-of-site
    replacement as a greenfield or end-of-life scenario.
