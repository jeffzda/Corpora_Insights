  project_name: Renewable Energy for Process Heat Opportunity Study – Phase 1
  what_happened: Consultants did not have a clear view of participating sites' longer-term
    energy and production plans, resource constraints, and decarbonisation goals at
    the outset of feasibility studies, which limited their ability to optimise recommended
    solutions.
