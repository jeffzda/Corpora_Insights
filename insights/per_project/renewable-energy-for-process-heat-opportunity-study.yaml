  source_title: Renewable Energy for Process Heat Opportunity Study
  publish_date: 2020-05
  project_name: McCain Foods – Renewable Process Heat Feasibility
  what_happened: A feasibility study at McCain Foods' Ballarat plant identified that
    installing a high-temperature heat pump (HTHP) to recover waste heat from the
    refrigeration system for boiler feed-water preheating was technically feasible
    at ~$1.5 million capital cost, but the simple payback was approximately 7 years
    — longer than typical corporate hurdle rates — and the proposal required further
    integration with other energy efficiency projects before a final investment decision
    could be made.
  lesson_learnt: Where a renewable process heat proposal has a payback exceeding 5–7
    years and depends on integration with other energy efficiency projects under development,
    plan for an additional scoping phase before investment decision rather than presenting
    it as a standalone ready-to-invest proposal.
