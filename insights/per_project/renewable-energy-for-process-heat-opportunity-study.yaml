- record_id: ARENA-DLV-46301
  source_title: Renewable Energy for Process Heat Opportunity Study
  publish_date: 2020-05
  project_name: Renewable Energy for Process Heat Opportunity Study – Phase 1
  what_happened: Renewably powered alternatives to fossil-fuelled process heating
    were found to be technically feasible and close to or actually commercially viable
    across 10 pre-feasibility and 4 full feasibility studies, but only where businesses
    accepted payback periods of 4+ years or existing equipment was at end of life.
    No final investment decisions had been made at time of writing.
  lesson_learnt: Target sites where equipment is at end of life or where businesses
    have sustainability-driven flexibility on payback thresholds — these conditions
    are the primary determinants of commercial viability for renewable process heat
    retrofits.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: concept/feasibility
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: commercial & market
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: A second phase of the program was designed to test greenfield
    sites, which were expected to be more commercially attractive.
  transferability: broad
  delay_magnitude: null
  technology_domain: industrial renewables
  source_pages: &id001
  - 4
  - 12
  - 13
  evidence_excerpt: The Opportunity Study established that renewably powered alternatives
    to fossil-fuelled process heating are technically feasible and close to, if not
    actually, commercially viable, particularly if businesses are willing to accept
    paybacks of 4+ years or existing equipment is at its end of life and requires
    replacement. Greenfield sites are expected to be more commercially attractive.
  confidence_note: issue_severity set to moderate — no investment was made, but the
    finding is a study-level commercial viability constraint rather than a project
    failure per se.
