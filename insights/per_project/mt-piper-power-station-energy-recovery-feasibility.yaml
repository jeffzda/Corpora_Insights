- record_id: ARENA-DLV-68851
  source_title: Mt Piper Energy Recovery Project - Knowledge Sharing Report
  publish_date: 2018-03
  project_name: Mt Piper Energy Recovery Project
  what_happened: The feasibility study concluded that the project was financially
    viable only at 27 MWe (200,000 t/a RDF), not at the originally assessed 14 MWe
    size, because costs were significantly higher than initially anticipated. The
    project capacity was doubled to reach financial viability.
  lesson_learnt: For hybrid energy-from-waste projects, minimum scale is critical
    to financial viability — initial cost estimates should be stress-tested early
    against scale sensitivity, as a project that is not viable at the originally scoped
    size may require a significant capacity increase to secure financing.
  issue_severity: major
  project_type: multi-technology/hybrid
  project_scale_band: first commercial/FOAK
  lifecycle_phase: concept/feasibility
  proponent_type: utility/energy retailer
  delay_category: financing/commercial close
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: The project capacity was doubled from 14 MWe to 27 MWe, at which
    point financial modelling confirmed viability at current costs and long-term market
    trends.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: bioenergy
  source_pages: &id001
