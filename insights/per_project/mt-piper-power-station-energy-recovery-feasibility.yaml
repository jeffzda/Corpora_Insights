  source_title: Mt Piper Energy Recovery Project - Knowledge Sharing Report
  publish_date: 2018-03
  project_name: Mt Piper Energy Recovery Project
  what_happened: The Life Cycle Assessment conducted by Edge Environment found that
    energy recovery from RDF has a lower environmental impact than coal-fired electricity
    generation across all assessed impact categories, including a 110% improvement
    on climate change and 93% reduction in fossil fuel energy use, providing a strong
    evidence base for the project's environmental credentials.
  lesson_learnt: Commissioning an independent LCA during the feasibility phase of
    an energy-from-waste project generates credible, publishable environmental benefit
    data that can support both stakeholder engagement and regulatory approval processes
    — this evidence is particularly valuable for first-of-kind projects where community
    and regulator familiarity with the technology is low.
