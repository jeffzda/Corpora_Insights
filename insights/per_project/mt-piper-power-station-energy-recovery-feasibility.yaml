- record_id: ARENA-DLV-68861
  source_title: Mt Piper Energy Recovery Project - Knowledge Sharing Report
  publish_date: 2018-03
  project_name: Mt Piper Energy Recovery Project
  what_happened: The feasibility study found that a dedicated, separately permitted
    RDF boiler was technically superior to direct co-firing of RDF in the existing
    coal boiler, because co-firing would have required significant modifications to
    fuel handling, mills, furnace, boiler and flue gas treatment, and would have resulted
    in less efficient steam conversion and reliability risks to existing plant.
  lesson_learnt: When hybridising an existing coal-fired power station with a waste-derived
    or biomass fuel, a dedicated side-stream boiler is technically preferable to direct
    co-firing — it avoids costly modifications to the host boiler, isolates reliability
    risks, allows separate environmental permitting, and preserves existing ash reuse
    approvals.
