- record_id: ARENA-DLV-68862
  source_title: Mt Piper Energy Recovery Project - Knowledge Sharing Report
  publish_date: 2018-03
  project_name: Mt Piper Energy Recovery Project
  what_happened: The EPC contracting strategy was identified in the risk register
    as a key risk, specifically the challenge of achieving appropriate EPC terms including
    performance guarantees and plant reliability warranties from technology providers
    for a first-of-kind application in Australia.
  lesson_learnt: For first-of-kind energy-from-waste projects in Australia, EPC terms
    — particularly performance guarantees and reliability warranties — should be negotiated
    early and in parallel with technology selection, as overseas suppliers may not
    offer the same contractual terms they provide in mature markets and this represents
    a material project risk.
