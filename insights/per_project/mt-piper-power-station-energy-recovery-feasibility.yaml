  project_name: Mt Piper Energy Recovery Project
  what_happened: The project identified that securing an Environmental Impact Statement
    (EIS) approval under NSW State Significant Development provisions was the critical
    path item for the next development phase, with EIS preparation anticipated to
    take until mid-2018 and requiring assessment of more than 15 discrete environmental
    and planning topics.
  lesson_learnt: For energy-from-waste projects in NSW, the SSD/EIS approval pathway
    should be recognised as the critical path from feasibility to final investment
    decision — proponents should initiate SEARs requests and EIS preparation as early
    as possible to avoid it becoming a bottleneck, and should resource the process
    to address the full range of DPE-required assessment topics.
