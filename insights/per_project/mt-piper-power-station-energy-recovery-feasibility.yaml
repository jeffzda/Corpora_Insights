- record_id: ARENA-DLV-68852
  source_title: Mt Piper Energy Recovery Project - Knowledge Sharing Report
  publish_date: 2018-03
  project_name: Mt Piper Energy Recovery Project
  what_happened: Co-locating the RDF boiler at an existing brownfield power station
    (Mt Piper) significantly reduced capital expenditure by enabling reuse of the
    existing turbine, generator, grid connection, land, workforce, and ancillary infrastructure,
    compared to a standalone greenfield EfW facility.
  lesson_learnt: Siting energy-from-waste or hybrid renewable projects at existing
    power stations substantially reduces capex and opex — the existing turbine, grid
    connection, workforce and land should be counted as material financial inputs
    during feasibility to correctly assess the business case relative to greenfield
    alternatives.
