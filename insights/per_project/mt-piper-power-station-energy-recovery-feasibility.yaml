- record_id: ARENA-DLV-68856
  source_title: Mt Piper Energy Recovery Project - Knowledge Sharing Report
  publish_date: 2018-03
  project_name: Mt Piper Energy Recovery Project
  what_happened: The risk assessment identified that variance in the volume or quality
    of RDF delivered to the plant — either during commissioning or operations — posed
    a material risk to project viability, given that the fuel is sourced from a heterogeneous
    waste stream whose composition may change over the project's life.
  lesson_learnt: Energy-from-waste projects relying on refuse-derived fuel should
    design for fuel flexibility from the outset and contract for diversity of supply
    sources, realistic fuel supply profiles, and on-site buffer storage to manage
    the inherent variability of a waste-derived feedstock over a multi-decade asset
    life.
