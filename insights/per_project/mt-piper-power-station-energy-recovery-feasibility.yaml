- record_id: ARENA-DLV-68859
  source_title: Mt Piper Energy Recovery Project - Knowledge Sharing Report
  publish_date: 2018-03
  project_name: Mt Piper Energy Recovery Project
  what_happened: A transport study by Lycopodium assessed both truck and rail options
    for delivering 200,000 t/a of RDF from Western Sydney to Mt Piper (approximately
    100 km). Rail was found to be less cost-effective at this scale because the best
    available rail option still required trucking from Bathurst (over 50 km) to the
    power station.
  lesson_learnt: For energy-from-waste projects requiring large-volume fuel transport
    in Australia, conduct a mode-specific transport study early — rail may appear
    attractive but the absence of direct rail access to the site can make intermodal
    solutions more expensive than trucking, particularly at sub-million-tonne annual
    volumes.
