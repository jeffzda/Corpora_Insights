- record_id: ARENA-DLV-68864
  source_title: Mt Piper Energy Recovery Project - Knowledge Sharing Report
  publish_date: 2018-03
  project_name: Mt Piper Energy Recovery Project
  what_happened: The project schedule indicated that the plant could be in operation
    within three years of the end of the feasibility phase, but achieving this required
    careful management of interfaces between the approvals and design teams and early
    appointment of the technology provider and dedicated project teams to keep critical
    path activities on track.
  lesson_learnt: For hybrid energy-from-waste projects proceeding through a multi-stage
    approvals and design process, early appointment of the technology provider and
    owners' project team is essential to keep the critical path (EIS/approvals and
    engineering design) running in parallel rather than sequentially — failing to
    do so risks extending the development phase well beyond three years.
