  what_happened: The risk assessment identified regulatory uncertainty around the
    volume of Large Generation Certificates (LGCs) the facility could produce from
    the biomass fraction of RDF as a key risk, given the need to measure the biomass
    fraction and apply the Clean Energy Regulator's established methodology.
  lesson_learnt: For energy-from-waste projects seeking LGCs from a mixed-fuel stream,
    engage the Clean Energy Regulator early in the development phase to confirm the
    measurement methodology and LGC volume basis — regulatory uncertainty about certificate
    volumes can materially affect the financial model and financing terms.
