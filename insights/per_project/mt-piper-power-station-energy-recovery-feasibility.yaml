- record_id: ARENA-DLV-68855
  source_title: Mt Piper Energy Recovery Project - Knowledge Sharing Report
  publish_date: 2018-03
  project_name: Mt Piper Energy Recovery Project
  what_happened: Community and stakeholder consultation conducted during the feasibility
    phase revealed that RDF was an unfamiliar concept to many stakeholders, and that
    community concerns centred on air emissions and transport impacts. The EPA also
    signalled it would require a high standard of compliance evidence.
  lesson_learnt: For first-of-kind energy-from-waste projects in Australia, budget
    additional time and resources for stakeholder education about RDF as a concept
    before seeking approvals — community unfamiliarity with the technology creates
    a higher evidentiary and consultation burden, and the EPA is likely to apply rigorous
    compliance standards given the novelty of the application.
  issue_severity: moderate
  project_type: multi-technology/hybrid
  project_scale_band: first commercial/FOAK
  lifecycle_phase: approvals/contracting
  proponent_type: utility/energy retailer
  delay_category: stakeholder/land/community
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: coordination & stakeholders
  intervention_note: A Stakeholder Engagement Plan was prepared, the Community Reference
    Group was briefed from February 2017, and an updated plan was committed for the
    next phase; consultation was extended to cover local and state government, regulators,
    and the community.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: bioenergy
