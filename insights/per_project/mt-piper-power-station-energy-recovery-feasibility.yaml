  project_name: Mt Piper Energy Recovery Project
  what_happened: Capital cost estimates obtained during the feasibility study were
    found to be highly variable between technology suppliers and were sensitive to
    movements in exchange rates and commodity prices, introducing significant uncertainty
    into the financial model.
  lesson_learnt: When procuring novel combustion or energy-from-waste technologies
    with few domestic reference points, obtain multiple supplier cost estimates early
    and apply exchange-rate and commodity-price sensitivity analysis to the financial
    model — cost variability between suppliers can be material and should be treated
    as a key risk rather than a point estimate.
