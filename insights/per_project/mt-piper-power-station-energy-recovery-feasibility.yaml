- record_id: ARENA-DLV-68860
  source_title: Mt Piper Energy Recovery Project - Knowledge Sharing Report
  publish_date: 2018-03
  project_name: Mt Piper Energy Recovery Project
  what_happened: Structural barriers to energy-from-waste project development in Australia
    — including low or non-existent landfill levies in some jurisdictions, large geographic
    distances limiting waste aggregation economies of scale, and the absence of district
    heating markets or specific EfW support mechanisms — were identified as key reasons
    why EfW uptake in Australia significantly lags Europe.
  lesson_learnt: Energy-from-waste project developers in Australia must design their
    business model around jurisdictional landfill levy structures and waste aggregation
    economics rather than assuming the European policy environment — projects are
    most viable where high landfill levies (such as in NSW) create a strong gate-fee
    revenue base and where sufficient waste volumes can be aggregated within an economic
    catchment.
  issue_severity: moderate
  project_type: multi-technology/hybrid
  project_scale_band: first commercial/FOAK
  lifecycle_phase: concept/feasibility
  proponent_type: utility/energy retailer
  delay_category: financing/commercial close
  failure_mode: commercial & market
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: The project was structured to exploit the NSW landfill levy as
    a gate-fee revenue driver, and the joint venture with Re.Group was formed to aggregate
    sufficient RDF supply from within an economic catchment of over 800,000 t/a.
  transferability: moderate
  delay_magnitude: null
  technology_domain: bioenergy
  source_pages: &id010
  - 9
  - 10
  evidence_excerpt: Large geographic distances meaning that it is often difficult
    to aggregate sufficient waste to support the economies of scale required... Low
    or non-existent landfill levies mean that it is often cheaper to send unrecyclable
    waste to landfill and this discourages investment in technologies and projects
    to reuse, recycle or convert waste into fuel.
