- record_id: ARENA-DLV-20705
  source_title: Demand Response Short Notice RERT Trial Year 3 Report
  publish_date: 2021-10
  project_name: DR SN RERT Trial — South Australia shortfall
  what_happened: In Years 2 and 3 of the trial, delivered DR capacity in South Australia
    fell short of contracted volumes, with only two participants active in that state;
    in Period 5 the shortfall was approximately 2.6 MW (14%) and in Period 6 approximately
    1.1 MW (6%).
  lesson_learnt: DR portfolios relying on very few participants in a single jurisdiction
    are vulnerable to under-delivery; increasing the number of participants and diversifying
    the customer base within each state improves reliability of aggregate delivery
    against contracted volumes.
