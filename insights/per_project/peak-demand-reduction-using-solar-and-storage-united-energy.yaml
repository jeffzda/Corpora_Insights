- record_id: ARENA-DLV-64421
  source_title: Distributed Energy Resources (DER) Integration Project Contribution Assessment
  publish_date: 2019-03
  project_name: Peak Demand Reduction Using Solar and Storage (United Energy)
  what_happened: United Energy's project ($0.45m, commenced July 2017) identified 10 constrained distribution substations and tested whether solar and storage systems (42 units across substations) were
    more economic than traditional network augmentation. Initial testing demonstrated solar and storage could reduce peak demand when temperatures exceeded 35°C, with batteries pre-charged using grid energy
    reimbursed to customers during peak events.
  lesson_farnt: Testing DER as an alternative to network augmentation requires pre-identification of specific constrained substations and a direct cost comparison methodology — projects should be designed
    around specific projected constraints to produce decision-relevant evidence for network businesses rather than general capability demonstrations.
  lesson_learnt: Testing DER as an alternative to network augmentation requires pre-identification of specific constrained substations and a direct cost comparison methodology — projects should be designed
    around specific projected constraints to produce decision-relevant evidence for network businesses rather than general capability demonstrations.
