  evidence_excerpt: 10 constrained distribution substations have been identified by UE as being constrained, with the project testing whether solar and storage is more economic than traditional augmentation.
    Analysis revealed the need for a total of 42 solar storage systems across constrained substations to be tested over summer 2018/2019. 27 units have already been commissioned, with initial testing demonstrating
    the potential for solar and storage to reduce peak demand when controlled on peak demand days where temperatures exceed 35oC.
