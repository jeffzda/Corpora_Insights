- record_id: ARENA-DLV-50961
  source_title: Repurposing Existing Generators as Synchronous Condensers
  publish_date: 2023-06
  project_name: Liddell PS Synchronous Condenser Conversion (Case Study)
  what_happened: Active demolition of Liddell Power Station, once underway, creates
    a hard deadline after which synchronous condenser conversion becomes physically
    impossible — the demolition progress was identified as directly reducing AGL's
    willingness to consider the project even after the commercial case improved following
    Transgrid's system strength EOI.
  lesson_learnt: TNSPs and SSSPs must engage potential service providers before demolition
    of retiring generators commences; once demolition is underway, conversion options
    are progressively foreclosed and the window for lower-cost repurposing closes
    irreversibly.
