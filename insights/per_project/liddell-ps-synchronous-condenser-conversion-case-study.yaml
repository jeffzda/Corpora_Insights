  outcome_class: discontinued/not progressed
  secondary_failure_mode: regulatory & approvals
  intervention_note: Following Transgrid's system strength EOI in December 2022, AGL
    indicated willingness to revisit conversion for the right commercial terms, though
    demolition progress reduces the window of opportunity.
