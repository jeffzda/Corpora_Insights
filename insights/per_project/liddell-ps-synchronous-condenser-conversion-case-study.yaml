- record_id: ARENA-DLV-50960
  source_title: Repurposing Existing Generators as Synchronous Condensers
  publish_date: 2023-06
  project_name: Liddell PS Synchronous Condenser Conversion (Case Study)
  what_happened: AGL investigated converting Liddell Power Station to a synchronous
    condenser but concluded the project was not commercial because there was no clear
    revenue stream for the services the SC would provide, including losses and auxiliary
    energy consumption. AGL subsequently decided to demolish the power station, which
    is now underway, further complicating any reversal of that decision.
  lesson_learnt: The absence of a defined commercial framework for system strength
    and inertia services — including clear recovery of losses, auxiliary energy costs,
    and availability payments — is sufficient to prevent asset owners from proceeding
    with conversion projects; procurement frameworks must be established before, not
    after, asset owners are expected to invest in feasibility studies.
  issue_severity: major
  project_type: network/grid
  project_scale_band: utility/large-scale
  lifecycle_phase: concept/feasibility
  proponent_type: utility/energy retailer
  delay_category: financing/commercial close
