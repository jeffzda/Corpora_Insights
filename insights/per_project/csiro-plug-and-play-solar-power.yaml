- record_id: ARENA-DLV-52060
  source_title: ARENA Distributed Energy Resources Projects
  publish_date: 2019-03
  project_name: CSIRO Plug and play solar power
  what_happened: A grid management system for remote area power supply using sky cameras and short-term solar forecasting algorithms was developed and demonstrated, achieving a reduction in diesel generator
    ramp rate events and resulting in reduced maintenance costs and financial savings.
  lesson_learnt: Integrating sky-camera-based solar forecasting with dispatch scheduling for RAPS systems can materially reduce diesel generator cycling and maintenance costs — this approach should be considered
    for remote diesel-solar hybrid systems to improve reliability and economics.
