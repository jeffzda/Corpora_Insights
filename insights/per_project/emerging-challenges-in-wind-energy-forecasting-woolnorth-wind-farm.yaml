- record_id: ARENA-DLV-72241
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects - First Edition Results'
  publish_date: '2014'
  project_name: Emerging Challenges in Wind Energy Forecasting - Woolnorth Wind Farm
  what_happened: A study comparing wind prediction model accuracy at Woolnorth wind farm in Tasmania found that a larger number of turbine-mounted anemometers of lower individual accuracy outperformed a
    smaller number of high-accuracy meteorological towers for producing high-quality wind energy forecasting data.
  lesson_learnt: Wind energy forecasting infrastructure should prioritise measurement density over individual sensor accuracy — a greater number of turbine-mounted anemometers distributed across the site
    produces better forecasting data than fewer high-accuracy met towers, at potentially lower cost.
