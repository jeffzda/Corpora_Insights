- record_id: ARENA-DLV-56254
  source_title: Repurposing Existing Hydropower Assets for the Future Electricity
    Market
  publish_date: 2020-10
  project_name: Tarraleah Hydropower Scheme Feasibility Study
  what_happened: The feasibility study found that the IEA's definition of plant flexibility
    — specifically capacity factor across varying timeframes (daily to yearly) — was
    a more useful metric for characterising revenue potential than traditional measures
    such as energy production (GWh), flexible capacity (MW), ancillary services (per
    unit), and storage (MWh) separately.
  lesson_learnt: When assessing repurposing options for hydropower in a future high-VRE
    market, use capacity factor across multiple timeframes (daily to annual) as the
    primary revenue proxy rather than individual energy/capacity/ancillary metrics
    — this captures the combined value of energy, flexibility, and storage in a single
    comparable measure.
  issue_severity: minor
  project_type: generation
  project_scale_band: utility/large-scale
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Adopted IEA (2018) capacity factor across timeframes metric as
    the primary flexibility assessment tool for the feasibility study options comparison.
  transferability: moderate
  delay_magnitude: null
  technology_domain: pumped hydro
  source_pages: &id004
  - 52
  - 53
  evidence_excerpt: Work completed as part of the feasibility study has found that
    these measures are difficult to distinguish and not overly useful in characterising
    the revenue potential of a hydropower scheme in a future energy market. Hydro
    Tasmania has found that the IEA (2018) definitions of plant flexibility, particularly
    the scheme's capacity factor over varying timeframes (daily-yearly), is a more
    comprehensive indication of the revenue potential from a future energy market.
