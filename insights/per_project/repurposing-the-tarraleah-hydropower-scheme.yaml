  what_happened: The Tarraleah headpond storages (No. 1 and No. 2 Ponds) were assessed
    as providing only a few hours of peaking duration, requiring upgrade works that
    would necessitate scheme outages and result in production losses. This limited
    the short-term dispatchable capacity available without the No. 3 conveyance.
