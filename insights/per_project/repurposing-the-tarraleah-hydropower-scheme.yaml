- record_id: ARENA-DLV-56255
  source_title: Repurposing Existing Hydropower Assets for the Future Electricity
    Market
  publish_date: 2020-10
  project_name: Tarraleah Hydropower Scheme Feasibility Study
  what_happened: The feasibility study determined that staging and deferring investment
    decisions as late as possible was essential given rapid NEM transformation. Asset
    management typically operates within a 5–10 year window while market transformation
    spans 20–30 years, making early commitment to full redevelopment highly risky.
  lesson_learnt: When planning long-lead-time hydropower repurposing investments,
    explicitly design for maximum flexibility in project development and delivery
    — stage investment tranches so that capacity additions can be deferred until market
    signals (particularly interconnection and VRE penetration milestones) are clearer,
    minimising risk of over- or under-investment.
  issue_severity: moderate
  project_type: generation
  project_scale_band: utility/large-scale
