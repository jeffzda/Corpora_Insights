- record_id: ARENA-DLV-56253
  source_title: Repurposing Existing Hydropower Assets for the Future Electricity
    Market
  publish_date: 2020-10
  project_name: Tarraleah Hydropower Scheme Feasibility Study
  what_happened: The feasibility study found that certainty, timing, and extent of
    market access — specifically further Bass Strait interconnection via Marinus Link
    — was the most important and challenging determinant of the investment case for
    repurposing, yet this was outside Hydro Tasmania's control. Without interconnection
    certainty, the commercial feasibility of full scheme redevelopment could not be
    confirmed.
  lesson_learnt: For hydropower repurposing projects in Tasmania (and analogous isolated
    systems), investment decisions must be explicitly sequenced against external interconnection
    milestones — building in maximum staging and deferral optionality is essential
    to avoid over- or under-investment in advance of market access certainty.
  issue_severity: major
  project_type: generation
  project_scale_band: utility/large-scale
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: financing/commercial close
  failure_mode: commercial & market
  outcome_class: delayed but recoverable
  secondary_failure_mode: null
  intervention_note: Hydro Tasmania elected to continue monitoring market conditions
    and regularly reviewing feasibility of redevelopment as clearer signals on Marinus
    Link emerge, while maintaining the existing scheme in safe and reliable operation.
  transferability: narrow
  delay_magnitude: not quantified
  technology_domain: pumped hydro
  source_pages: &id003
  - 51
  - 52
  evidence_excerpt: Without certainty over key investment drivers including further
    interconnection, it is not possible to confirm the commercial feasibility for
    repurposing the scheme. In this context, Hydro Tasmania plans to continue to monitor
    the market conditions, regularly reviewing the feasibility of redeveloping the
    scheme as clearer market signals emerge over time.
  confidence_note: delay_category set to financing/commercial close as the blockage
    is an inability to close a viable business case, though the underlying cause is
    regulatory/infrastructure (interconnection). transferability set narrow given
    the Tasmanian interconnection-specific context.
