- record_id: ARENA-DLV-56263
  source_title: Repurposing Existing Hydropower Assets for the Future Electricity
    Market
  publish_date: 2020-10
  project_name: Tarraleah Hydropower Scheme Feasibility Study
  what_happened: International case study evidence (EPRI 2017, Osage Power Plant USA)
    documented that flexible operation of hydropower — including frequent start/stop
    cycling — causes premature deterioration of turbines, generators, gates, valves,
    and circuit breakers through increased vibration, dynamic stress, thermal stress,
    and fatigue life reduction.
  lesson_learnt: When repurposing baseload hydropower for flexible market operation,
    quantify the increased O&M cost and reduced asset life resulting from flexible
    duty cycles — design new or refurbished machines explicitly for the intended flexible
    operating regime to avoid premature deterioration that erodes the economic case.
