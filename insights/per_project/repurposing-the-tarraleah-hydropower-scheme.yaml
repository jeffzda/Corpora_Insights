  what_happened: The feasibility study identified that ancillary services markets
    in the NEM are 'thin' — once sufficient supply exists, prices typically collapse
    — and that ancillary service revenue was assessed as not a major value driver
    under current market arrangements, though potentially a low-cost by-product of
    flexible dispatchable hydropower.
