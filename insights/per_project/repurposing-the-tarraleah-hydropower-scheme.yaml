- record_id: ARENA-DLV-56252
  source_title: Repurposing Existing Hydropower Assets for the Future Electricity
    Market
  publish_date: 2020-10
  project_name: Tarraleah Hydropower Scheme Feasibility Study
  what_happened: The Tarraleah scheme's inflexible baseload operation — constrained
    by manually operated open canals requiring many hours to start up or shut down
    — meant the station effectively ran at 100% utilisation with near-zero operational
    flexibility, putting future revenues at risk as the station would generate in
    direct competition with wind and solar.
  lesson_learnt: Existing hydropower schemes operated as inflexible baseload using
    open canal conveyances face structural revenue risk in a high-VRE future market;
    replacing open-surface conveyances with closed-conduit systems is a key enabler
    of the flexible dispatch required to compete in that market.
  issue_severity: major
  project_type: generation
  project_scale_band: utility/large-scale
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: commercial & market
  intervention_note: Feasibility study developed No. 3 conveyance option (closed-conduit
    replacement of No. 1 and No. 2 canals) as the primary enabler of flexible dispatch,
    with staged investment aligned to market and asset risk drivers.
  transferability: moderate
  delay_magnitude: null
  technology_domain: pumped hydro
  source_pages: &id002
  - 31
  - 37
  - 38
  evidence_excerpt: Due to conveyance limitations (capacity and ability to change
    load), the station effectively runs at 100% utilisation (but only 0.8 capacity
    factor) to minimise spill of water from Lake King William. In the future, this
    would put revenue at risk as the station would be generating in direct competition
    with wind and solar resources.
  confidence_note: technology_domain classified as pumped hydro as closest available
    value; asset is conventional run-of-river hydro but no dedicated taxonomy value
