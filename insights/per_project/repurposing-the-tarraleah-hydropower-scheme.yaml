  secondary_failure_mode: null
  intervention_note: Hydro Tasmania conducted a pre-feasibility study followed by
    a full feasibility study (co-funded with ARENA at $2.5 million each) to assess
    repurposing options, leading to development of four redevelopment scenarios versus
    refurbishment.
  transferability: moderate
  delay_magnitude: null
  technology_domain: pumped hydro
  source_pages: &id001
