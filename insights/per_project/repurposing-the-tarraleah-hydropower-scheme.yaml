  source_title: Repurposing Existing Hydropower Assets for the Future Electricity
    Market
  publish_date: 2020-10
  project_name: Tarraleah Hydropower Scheme Feasibility Study
  what_happened: The Tarraleah No. 1 Canal, originally designed for 25 cumecs, was
    limited to approximately 20 cumecs when clean due to biofouling from algal growth,
    and further reduced in practice. The No. 2 Canal was limited to 8.5 cumecs against
    its original design capacity. Both conveyances required manual operation with
    many hours for start-up and shut-down.
  lesson_learnt: Hydropower civil conveyance assets (open canals and flumes) are subject
    to biofouling-driven capacity degradation over time that is difficult to manage;
    asset owners should quantify the gap between design and current capacity as part
    of flexibility assessments and consider this when evaluating whether refurbishment
    or replacement better serves future market needs.
