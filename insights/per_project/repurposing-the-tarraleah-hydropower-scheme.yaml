  what_happened: The feasibility study explicitly noted that decommissioning of the
    Tarraleah scheme would reduce inflows to Liapootah power station downstream and
    impact the optimal operation of the entire Derwent cascade system, making decommissioning
    a strategically unattractive option despite its low capital cost.
  lesson_learnt: For hydropower schemes that are hydraulically integrated into a multi-station
    cascade, decommissioning one scheme creates negative operational externalities
    on downstream stations — the cascade-wide revenue and operational impact must
    be explicitly modelled in any decommissioning assessment, not just the costs of
    the decommissioned asset in isolation.
