  - 37
  evidence_excerpt: The Tarraleah Power Station Pelton machines, which are mostly
    original 1930s and 1940s equipment, are nearing end of life and likely to require
    replacement around the mid-2020s. The Tarraleah No. 1 Canal is nearing end of
    life and requires significant expenditure to maintain. Due to its design and location
    (constructed on a steep hillside), it is also at an elevated risk of failure from
    landslips.
