  what_happened: The feasibility study found that civil asset risk management was
    the most challenging aspect of hydropower asset management, particularly for long
    conveyance assets. The complexity, length (~30 km), and variable foundation conditions
    of the canal system made risk difficult to quantify, monitor, and mitigate effectively.
  lesson_learnt: Civil asset risk for long hydropower conveyances (canals, flumes,
    unlined tunnels) is inherently difficult to quantify and monitor — asset owners
    should treat these as high-uncertainty risk items requiring conservative end-of-life
    assumptions and early consideration of replacement, especially where failure could
    result in total loss of station output.
