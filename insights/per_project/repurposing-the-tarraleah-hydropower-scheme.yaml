  what_happened: Hydro Tasmania's 'Water 2 Wire' approach was used to identify that
    the current maximum station output of the Tarraleah scheme was approximately 85
    MW against a rated 90 MW, with the gap attributable to specific constraining assets
    (canals, forebay spillway, hilltop pipelines, penstocks), each with an associated
    cost to eliminate the constraint.
