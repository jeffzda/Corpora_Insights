  what_happened: International case study (St. Anton, South Tyrol) showed that converting
    a baseload hydropower plant to flexible operation requires management of transient
    fluid pressures in headrace, surge tanks, and tailraces — unmanaged headrace transients
    can cause damaging high pressures, and tailrace transients can cause environmental
    issues.
  lesson_learnt: When converting baseload hydropower to flexible operation, hydraulic
    transient management — including surge tank placement, penstock pressure rise
    limits, and downstream tailrace reservoir provision — must be addressed in the
    repurposing design to avoid both structural damage and environmental non-compliance.
