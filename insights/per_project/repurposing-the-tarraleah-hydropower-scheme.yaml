- record_id: ARENA-DLV-56251
  source_title: Repurposing Existing Hydropower Assets for the Future Electricity
    Market
  publish_date: 2020-10
  project_name: Tarraleah Hydropower Scheme Feasibility Study
  what_happened: The Tarraleah scheme's existing conveyance system (No. 1 and No.
    2 canals, totalling ~30 km) was found to be operating at elevated and increasing
    asset risk due to age and original design, with No. 1 Canal at particular risk
    of failure from landslips. The machines were assessed as nearing end of life and
    requiring replacement around the mid-2020s.
  lesson_learnt: For ageing hydropower assets with long civil conveyances, asset risk
    trajectories and end-of-life timing should be assessed early and mapped against
    future market conditions — the convergence of civil asset end-of-life and market
    transformation creates a once-in-a-generation opportunity to repurpose rather
    than simply refurbish.
  issue_severity: major
