  what_happened: The long pressure conveyance option for Tarraleah (direct tunnel
    from Lake King William to a new power station) was screened out in the pre-feasibility
    study due to very high upfront CAPEX, high geotechnical risk during long tunnel
    construction, and the requirement to make a capacity commitment well in advance
    of market transformation.
  lesson_learnt: Long direct tunnel options for hydropower repurposing, while providing
    the highest revenue exposure, carry compounded risk from geotechnical uncertainty
    and early capital commitment requirements — these options should only be pursued
    where interconnection and market timing are sufficiently certain to justify the
    irreversible upfront investment.
