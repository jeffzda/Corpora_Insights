  what_happened: Participants who had invested in solar panels, home energy management
    apps, or efficient appliances found that the demand response program did not integrate
    with or recognise their existing energy management efforts. Low-energy households
    that had already reduced their baseline consumption were structurally unable to
    earn meaningful rewards, creating a perceived unfairness in the reward system.
