  what_happened: All three retailers in the trial used exclusively monetary, individually
    calculated rewards tied to household-level performance at each event. This design
    did not align with the collectivist preferences of the majority of Australian
    consumers and failed to appeal to participants motivated by community contribution,
    recognition, or long-term energy outcomes.
  lesson_hearnt: Introduce non-monetary and collective reward options — such as community
    cause contributions, VIP status, or rewards for friends and family — to complement
    monetary incentives and align with the collectivist preferences of the majority
    of Australian consumers.
