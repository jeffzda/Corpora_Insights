  source_title: Demand Response Consumer Insights Report
  publish_date: 2018-05
  project_name: ARENA Demand Response Trial (Residential)
  what_happened: Participants who were motivated by environmental or community goals
    rationalised their individual demand response participation as a contribution
    to broader societal outcomes (grid stability, climate change mitigation), even
    though the program's design was individualistic. However, post-event communications
    did not reinforce this collective impact, leaving participants without information
    on what the combined effort achieved.
  lesson_learnt: Close the loop on collective impact after every event — provide participants
    with aggregate figures (total kWh reduced, number of households, equivalent grid
    capacity relieved) to validate their broader-purpose motivation and sustain engagement
    among collectivist participants.
