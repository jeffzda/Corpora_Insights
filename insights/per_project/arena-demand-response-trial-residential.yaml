- record_id: ARENA-DLV-45704
  source_title: Demand Response Consumer Insights Report
  publish_date: 2018-05
  project_name: ARENA Demand Response Trial (Residential)
  what_happened: The short, event-based design of the demand response program did
    not align with participants' primary motivation of managing long-term energy costs
    and cost-of-living pressures. The modest per-event financial incentives were dwarfed
    by participants' broader concerns about quarterly energy bills, causing many to
    perceive the program as low-value relative to effort required.
  lesson_learnt: Design demand response programs to connect explicitly to participants'
    long-term energy cost management goals — short-event incentives alone are insufficient
    to sustain engagement; link participation to ongoing energy literacy, bill savings,
    and broader cost-of-living benefits.
