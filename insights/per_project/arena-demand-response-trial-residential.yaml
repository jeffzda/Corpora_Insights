- record_id: ARENA-DLV-45703
  source_title: Demand Response Consumer Insights Report
  publish_date: 2018-05
  project_name: ARENA Demand Response Trial (Residential)
  what_happened: Participants with low baseline energy consumption (the 'Low-Energy
    Langs' persona) were unable to meet demand response reduction targets despite
    genuine effort, because they had little discretionary load to shed. The program's
    baseline approach meant these participants were told they 'didn't participate'
    even when they had made meaningful effort, causing frustration and perceived unfairness.
  lesson_learnt: Reward structures and participation measurement should account for
    low-energy households — programs that measure outputs (reduction against baseline)
    systematically disadvantage already-efficient households; consider input-based
    or effort-recognition approaches for this segment.
