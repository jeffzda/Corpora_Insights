- record_id: ARENA-DLV-45706
  source_title: Demand Response Consumer Insights Report
  publish_date: 2018-05
  project_name: ARENA Demand Response Trial (Residential)
  what_happened: There was a significant misalignment between participants' perception
    of their own participation (inputs — what they actively did) and the program's
    measurement of reduction (outputs — kWh saved against a baseline). Some participants
    who reduced energy were told they did not participate; others were rewarded when
    they felt they should not have been, generating distrust in the system.
  lesson_learnt: Clearly communicate to participants how their contribution is measured
    before and after events; consider supplementing or replacing output-based (baseline
    comparison) measurement with input-based recognition to reduce perceived unfairness
    and distrust, particularly for low-energy and already-efficient households.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: government/public-sector body
