- record_id: ARENA-DLV-45707
  source_title: Demand Response Consumer Insights Report
  publish_date: 2018-05
  project_name: ARENA Demand Response Trial (Residential)
  what_happened: Participants expressed a strong desire for clear, timely feedback
    after demand response events — both immediate individual feedback (live usage,
    confirmation of participation) and delayed collective feedback (overall impact
    of the event). The existing program provided limited post-event communication,
    leaving participants uncertain about whether their effort made a difference.
  lesson_learnt: Build a multi-layered feedback architecture covering immediate individual
    feedback (live usage during event), delayed individual feedback (bill credit confirmation,
    participation acknowledgement), and delayed collective feedback (total event impact,
    grid stabilisation outcome) to satisfy the full range of participant motivations.
