- record_id: ARENA-DLV-45716
  source_title: Demand Response Consumer Insights Report
  publish_date: 2018-05
  project_name: ARENA Demand Response Trial (Residential)
  what_happened: The learning effect observed during the trial — where participants
    applied energy management habits to their daily lives beyond event periods — was
    identified as a structural long-term risk to the program's effectiveness. As households
    become more energy efficient over time, their capacity to reduce further during
    events shrinks, potentially rendering the program ineffective at scale over multiple
    years.
  lesson_learnt: Treat the learning-induced reduction in event-period elasticity as
    a known structural dynamic when forecasting multi-year demand response program
    effectiveness; plan for participant renewal, recruitment of new higher-energy
    households, and evolution toward controlled-load or automated approaches to maintain
    aggregate impact.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: government/public-sector body
