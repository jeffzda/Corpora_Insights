- record_id: ARENA-DLV-45719
  source_title: Demand Response Consumer Insights Report
  publish_date: 2018-05
  project_name: ARENA Demand Response Trial (Residential)
  what_happened: Participants who were called to demand response events on days that
    were not the hottest of the season were confused about the purpose of the event
    and questioned their understanding of the program. This timing mismatch undermined
    participant confidence in the program's rationale and reduced their sense of significance
    in participating.
  lesson_learnt: Provide clear contextual explanations when events are called outside
    of extreme weather conditions — if participants cannot independently verify the
    reason for an event, they will question the program's credibility; consider including
    real-time grid status information in event notifications.
