  evidence_excerpt: There were two distinct mental models for participation in a demand
    response activity. For some they framed their energy use abstractly in terms of
    what the house was using compared to normal (so if they weren't home that meant
    'participating' was easy), for others it was about taking active steps to reduce
    energy usage (so if they weren't home, participating was impossible).
