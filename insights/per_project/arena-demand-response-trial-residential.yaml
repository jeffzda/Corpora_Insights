- record_id: ARENA-DLV-45713
  source_title: Demand Response Consumer Insights Report
  publish_date: 2018-05
  project_name: ARENA Demand Response Trial (Residential)
  what_happened: Participants did not trust retailer-generated energy data and comparison
    figures, particularly when the data did not clearly match their own experience
    or bills. This distrust was amplified for households with solar PV, who could
    not easily reconcile generation and consumption data. The opacity of the baseline
    calculation methodology further eroded confidence in the reward system.
  lesson_learnt: Publish clear, plain-language explanations of how baselines and reduction
    calculations are made, and provide participants with appliance-level or activity-level
    breakdowns where possible; without trusted data, participants will disengage from
    reward systems and question program integrity.
