- record_id: ARENA-DLV-45710
  source_title: Demand Response Consumer Insights Report
  publish_date: 2018-05
  project_name: ARENA Demand Response Trial (Residential)
  what_happened: Household daily routines — including cooking, childcare, entertaining
    guests, and temperature management in poorly insulated homes — were the primary
    barriers to reducing energy during demand response events, often overriding participants'
    willingness to participate. Families with young children, elderly members, or
    guests consistently deprioritised participation to maintain household comfort
    and care obligations.
  lesson_learnt: Program design should acknowledge and accommodate household life-stage
    and physical constraints; consider offering opt-out mechanisms for specific household
    circumstances, and tailor event timing and reduction expectations to household
    composition data where available.
