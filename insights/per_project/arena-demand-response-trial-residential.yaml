  project_name: ARENA Demand Response Trial (Residential)
  what_happened: The program's communication and standard advice about reducing energy
    during events — focusing on turning off air-conditioners and pool pumps — was
    perceived as irrelevant and patronising by low-energy participants who did not
    use those appliances. This reduced engagement among precisely the environmentally
    motivated participants most inclined to sign up.
