- record_id: ARENA-DLV-45701
  source_title: Demand Response Consumer Insights Report
  publish_date: 2018-05
  project_name: ARENA Demand Response Trial (Residential)
  what_happened: The demand response trial recruited participants predominantly from
    individualist cultural segments (vertical and horizontal individualists), while
    horizontal collectivists — who make up 52% of the Australian population — were
    vastly underrepresented (30% of participants vs 52% of population). Program messaging
    emphasised individual action, individual rewards, and performance-based attribution,
    which did not resonate with the collectivist majority.
  lesson_learnt: Design demand response program messaging and reward structures to
    appeal to collectivist motivations — emphasising community contribution, group
    harmony, and shared outcomes — to recruit from the majority of the Australian
    population rather than the minority individualist segment.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: government/public-sector body
