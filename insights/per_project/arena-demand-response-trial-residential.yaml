  - 9
  evidence_excerpt: Vertical individualists are overrepresented (20% of participants
    vs 8% in population), as well as horizontal individualists (23% versus 16%). Horizontal
    collectivists are vastly underrepresented (30% vs 52%).
  confidence_note: issue_severity set to moderate — the mismatch did not cause program
    failure but materially limited uptake breadth and is the central finding of the
    research.
