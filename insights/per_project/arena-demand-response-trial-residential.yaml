  source_title: Demand Response Consumer Insights Report
  publish_date: 2018-05
  project_name: ARENA Demand Response Trial (Residential)
  what_happened: 80% of surveyed Australians had no prior knowledge of demand response
    before being shown an explanatory graphic, indicating that awareness of the concept
    was negligible in the general population at the time of the trial.
  lesson_learnt: Do not assume baseline consumer awareness of demand response; programs
    must invest in foundational concept education before sign-up messaging, rather
    than assuming participants understand why their behaviour matters.
