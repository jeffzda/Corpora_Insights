  source_title: Demand Response Consumer Insights Report
  publish_date: 2018-05
  project_name: ARENA Demand Response Trial (Residential)
  what_happened: The AEMO/ARENA trial used demand response as a 'last resort' mechanism,
    resulting in very few events being called each summer. This low event frequency
    left many participants expecting to be called upon more often, created confusion
    about the program's purpose, and reduced ongoing engagement and word-of-mouth
    promotion.
  lesson_learnt: Clearly communicate the 'last resort' positioning of behavioural
    demand response events during onboarding so participants calibrate their expectations
    appropriately; supplement low event frequency with regular between-event engagement
    to maintain awareness and motivation.
