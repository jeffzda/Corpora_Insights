- record_id: ARENA-DLV-45717
  source_title: Demand Response Consumer Insights Report
  publish_date: 2018-05
  project_name: ARENA Demand Response Trial (Residential)
  what_happened: Financial rewards were consistently ranked as the top trigger for
    initial sign-up across both likely and unlikely enrolees, suggesting that a sign-up
    incentive is an effective mechanism to drive recruitment regardless of the participant's
    underlying motivation. However, 'doing the right thing for the environment' was
    the top ongoing motivator for those most likely to enrol, indicating motivational
    divergence between recruitment and sustained engagement.
  lesson_learnt: Use financial sign-up incentives as the primary recruitment mechanism,
    but quickly pivot post-enrolment communications to environmental and community
    contribution framing — the triggers that drive sign-up are different from those
    that sustain participation among the most engaged segments.
