- record_id: ARENA-DLV-45705
  source_title: Demand Response Consumer Insights Report
  publish_date: 2018-05
  project_name: ARENA Demand Response Trial (Residential)
  what_happened: Demand response events had very low prominence in participants' daily
    lives. Many participants forgot about the program between events, and the person
    who registered was often the only household member aware of it. Long gaps between
    events and infrequent communication contributed to participants losing recollection
    of program objectives and their motivations to participate.
  lesson_learnt: Maintain regular between-event communication touchpoints to sustain
    participant awareness and motivation; design onboarding to involve the whole household,
    not just the registered participant, and use interim engagement (tips, updates,
    progress summaries) to bridge the gap between events.
