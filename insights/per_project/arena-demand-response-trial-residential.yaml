- record_id: ARENA-DLV-45720
  source_title: Demand Response Consumer Insights Report
  publish_date: 2018-05
  project_name: ARENA Demand Response Trial (Residential)
  what_happened: Participants across all retailer programs expressed two distinct
    mental models for what 'participating' meant — one framed around absolute household
    usage (being away from home counted as participating) and one framed around active
    effort to reduce (being away from home meant not participating). The program's
    measurement system aligned with only one model, generating systematic confusion
    and reward disputes.
  lesson_learnt: Establish and clearly communicate a single, plain-language definition
    of what constitutes 'participation' before participants enrol, and ensure the
    measurement methodology aligns with the intuitive meaning most participants will
    apply — ambiguity in this definition erodes trust and reward legitimacy.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
