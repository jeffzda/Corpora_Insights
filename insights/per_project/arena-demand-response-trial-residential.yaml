- record_id: ARENA-DLV-45718
  source_title: Demand Response Consumer Insights Report
  publish_date: 2018-05
  project_name: ARENA Demand Response Trial (Residential)
  what_happened: Design workshops with participants revealed that sweepstake-style
    rewards were unpopular in their standard framing, but participant reception shifted
    positively when sweepstakes were reframed as contributing to a community program
    or energy sector benefit. This indicated that framing and contextualisation of
    rewards, not just their monetary value, materially affects participant valuation.
  lesson_learnt: When designing reward mechanisms for demand response programs, invest
    in how rewards are framed and explained — contextualising even low-probability
    rewards (e.g. sweepstakes) within the energy sector or community benefit narrative
    can significantly improve their perceived value and acceptability.
