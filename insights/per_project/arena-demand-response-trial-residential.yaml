  - 47
  - 64
  evidence_excerpt: I turned off the air conditioner and sat outside with my partner
    during the time, but they say I didn't participate. There is a significant misalignment
    between the users' perception of participation (input) and the measurement of
    their reduction (output). Applying a baseline approach to individual households
    is challenging, regardless of the methodology used, as many factors will affect
    their day-to-day energy use.
  confidence_note: issue_severity elevated to major because the measurement misalignment
