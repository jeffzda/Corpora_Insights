- record_id: ARENA-DLV-70804
  source_title: Grid Forming Battery Webinar 23 July 2025
  publish_date: 2025-07
  project_name: Broken Hill Battery Energy Storage System (BHBESS)
  what_happened: During the BHBESS grid connection process, modelling discrepancies
    arose that required regular detailed meetings with the OEM (Fluence Energy), Transgrid,
    and AEMO to resolve. Intellectual property restrictions on inverter control behaviour
    were a recurring hurdle in gaining full transparency into inverter models.
  lesson_learnt: OEM intellectual property restrictions on inverter control behaviour
    are a recurring barrier to accurate GFM modelling — proponents should negotiate
    model transparency requirements with OEMs contractually before project commitment,
    and establish structured multi-party technical working groups with the OEM, NSP,
    and AEMO early in the connection process.
