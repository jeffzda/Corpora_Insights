- record_id: ARENA-DLV-70808
  source_title: Grid Forming Battery Webinar 23 July 2025
  publish_date: 2025-07
  project_name: Broken Hill Battery Energy Storage System (BHBESS)
  what_happened: During an October 2024 islanding event in the Broken Hill area after
    disconnection of the X2 transmission line, BHBESS was able to continue operating
    in a limited fixed load/fixed generation mode under very low short circuit ratio
    (SCR) conditions, supporting local gas turbines. A grid-following BESS likely
    could not have operated under the same conditions.
  lesson_learnt: GFM BESS provides a demonstrable operational advantage in islanding
    or very weak grid scenarios that GFL BESS cannot replicate — this real-world validation
    supports the case for GFM deployment in remote or weakly connected network areas
    where grid resilience during islanding events is a design requirement.
