- record_id: ARENA-DLV-70809
  source_title: Grid Forming Battery Webinar 23 July 2025
  publish_date: 2025-07
  project_name: Broken Hill Battery Energy Storage System (BHBESS)
  what_happened: EMT digital simulation modelling by AGL and partners found that when
    BHBESS provides reactive power to the grid, it increases grid hosting capacity
    by freeing up existing Static VAR Compensators (SVCs) to regulate grid voltage,
    demonstrating a measurable capacity unlock benefit beyond direct inertia provision.
  lesson_learnt: GFM BESS reactive power provision can materially increase grid hosting
    capacity for additional generation by relieving SVC headroom — this benefit should
    be quantified and included in project business cases and RIT-T assessments for
    BESS in constrained network areas.
  issue_severity: none
