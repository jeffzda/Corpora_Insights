- record_id: ARENA-DLV-70805
  source_title: Grid Forming Battery Webinar 23 July 2025
  publish_date: 2025-07
  project_name: Broken Hill Battery Energy Storage System (BHBESS)
  what_happened: AGL used hardware-in-the-loop (HIL) testing and real-time digital
    simulation modelling during the BHBESS connection process and found these methodologies
    improved predictability of BESS behaviour under weak grid conditions, suggesting
    the standard connection process was insufficient for weak-grid GFM deployments.
  lesson_learnt: For GFM BESS connecting into weak grid areas, standard connection
    testing methodologies are insufficient — incorporate HIL testing and real-time
    EMT digital simulations into the connection process to improve predictability
    and reduce modelling discrepancies with the NSP and AEMO.
