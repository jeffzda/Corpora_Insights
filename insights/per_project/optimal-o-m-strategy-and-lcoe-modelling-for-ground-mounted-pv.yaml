- record_id: ARENA-DLV-60255
  source_title: UNSW - Optimal O&M-strategy and LCOE-modelling for Ground-mounted
    PV - R&D Interim Report
  publish_date: 2024-07
  project_name: Optimal O&M-strategy and LCOE-modelling for Ground-mounted PV
  what_happened: Current industry-standard degradation modelling assumes a linear
    annual degradation rate based on module warranty, with no differentiation by module
    technology or climate. The project developed a first-principles degradation modelling
    framework that calculates degradation at each timestep as a function of operating
    temperature, relative humidity, and UV exposure, capturing non-linear effects
    and geographic variation.
  lesson_learnt: Linear warranty-based degradation assumptions used in standard yield
    models are inadequate for harsh-climate or high-UV locations and for emerging
    module technologies — developers should use physics-based degradation models that
    account for local operating conditions and module bill of materials to accurately
    forecast lifetime performance and LCOE.
