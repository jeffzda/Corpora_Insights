- record_id: ARENA-DLV-60256
  source_title: UNSW - Optimal O&M-strategy and LCOE-modelling for Ground-mounted
    PV - R&D Interim Report
  publish_date: 2024-07
  project_name: Optimal O&M-strategy and LCOE-modelling for Ground-mounted PV
  what_happened: Industry-standard simulation software (PVSyst, SAM, pvlib) does not
    adjust cell or module temperature during inverter clipping or grid curtailment
    events, on the assumption that temperature effects are inconsequential when plant
    output is already limited. The project demonstrated that clipping and curtailment
    significantly increase module operating temperatures — particularly for SAT systems
    — and accelerate degradation, an effect not previously visible to developers.
  lesson_learnt: Developers and asset owners with high DC:AC ratios or operating in
    high-curtailment NEM regions should not rely on standard simulation tools for
    degradation forecasting — clipping and curtailment-driven temperature increases,
    invisible in standard software, materially accelerate module degradation and should
    be quantified using physics-based thermal and degradation models when comparing
    mounting system options or setting DC:AC ratios.
  issue_severity: major
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Developed custom Python scripts using the high-precision thermal
    model and advanced degradation framework to simulate module temperature and lifetime
    degradation under clipping and curtailment scenarios across multiple NEM locations;
    began work on a mitigation algorithm to reduce excess degradation for high DC:AC
    ratio plants.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id006
  - 16
  - 17
  - 18
  evidence_excerpt: During periods of inverter clipping or curtailment, the electrical
    power produced by modules in a solar plant is reduced, which can significantly
    increase the operating temperature of the modules... This assumption is reflected
    in standard simulation software (e.g., PVSyst, SAM, pvlib), which does not adjust
    the cell or module temperature based on clipping at the inverter. However, there
    can be important implications for module degradation.
