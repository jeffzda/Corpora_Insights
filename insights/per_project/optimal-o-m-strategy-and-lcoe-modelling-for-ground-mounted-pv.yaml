- record_id: ARENA-DLV-60254
  source_title: UNSW - Optimal O&M-strategy and LCOE-modelling for Ground-mounted
    PV - R&D Interim Report
  publish_date: 2024-07
  project_name: Optimal O&M-strategy and LCOE-modelling for Ground-mounted PV
  what_happened: The project found that modules mounted on the 5B MAVERICK East-West
    system operate at lower temperatures than those on single-axis tracker (SAT) systems,
    despite having similar heat transfer coefficients, because of reduced plane-of-array
    irradiance — implying lower degradation rates for MAVERICK-mounted modules.
  lesson_learnt: When comparing mounting system options for utility-scale solar, developers
    should account for the operating temperature differential between East-West (MAVERICK-type)
    and SAT systems — lower module temperatures in East-West configurations translate
    to meaningfully lower degradation rates over plant lifetime, an advantage not
    captured in standard yield modelling tools.
