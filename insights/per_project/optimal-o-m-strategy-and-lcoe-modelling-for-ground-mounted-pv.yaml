  - 20
  evidence_excerpt: errors in simulated I-V curves were reduced from 10% to less than
    2%... The first key result of this work was that for the correct choice of parameters,
    the 'standard' single diode model implemented in PVSyst can accurately track the
    illumination and temperature dependence of the maximum power. However, consequently,
    it can no longer accurately predict the rest of the I-V curve, and particularly
    the open-circuit voltage.
  confidence_note: issue_severity set to major given that a 10% I-V simulation error
