- record_id: ARENA-DLV-60258
  source_title: UNSW - Optimal O&M-strategy and LCOE-modelling for Ground-mounted
    PV - R&D Interim Report
  publish_date: 2024-07
  project_name: Optimal O&M-strategy and LCOE-modelling for Ground-mounted PV
  what_happened: The standard single-diode model used universally in industry yield
    simulation software (PVSyst, SAM) cannot accurately simulate the full I-V curve
    of ultra-high efficiency solar cells (>26% efficiency, e.g. n-TOPCon and HJT devices)
    because it cannot jointly describe standard and intrinsic recombination. Fitting
    errors in simulated I-V curves were up to 10% with the standard model; the project's
    adjusted model incorporating intrinsic recombination reduced errors to below 2%.
  lesson_learnt: Yield and bankability assessments for projects using next-generation
    high-efficiency modules (n-TOPCon, HJT, >26% efficiency) should not rely on standard
    single-diode model fitting in PVSyst or SAM without adjustment for intrinsic recombination
    — errors of up to 10% in I-V curve simulation can propagate into inaccurate energy
    yield and financial forecasts.
  issue_severity: major
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: Developed an adjusted single-diode fitting procedure that explicitly
    calculates and subtracts intrinsic (Auger and radiative) recombination currents
    before fitting, reducing I-V curve simulation errors from ~10% to below 2% across
    all operating conditions.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id008
