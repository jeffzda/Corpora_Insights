- record_id: ARENA-DLV-60253
  source_title: UNSW - Optimal O&M-strategy and LCOE-modelling for Ground-mounted
    PV - R&D Interim Report
  publish_date: 2024-07
  project_name: Optimal O&M-strategy and LCOE-modelling for Ground-mounted PV
  what_happened: Industry-standard thermal models (simple linear relationships between
    plane-of-array irradiance and ambient temperature) produced significant temperature
    prediction errors for the 5B MAVERICK system when default coefficients were applied.
    The project's high-precision thermal model — incorporating radiative heat transfer
    with the sky-dome and transient effects — reduced temperature prediction error
    by 36.6%, achieving an RMSE below 2°C.
  lesson_learnt: Default thermal model coefficients from industry-standard software
    should not be applied to novel mounting systems such as the 5B MAVERICK without
    site-specific calibration; incorporating radiative and transient effects reduces
    temperature prediction error by over 35% and materially improves yield simulation
    accuracy.
