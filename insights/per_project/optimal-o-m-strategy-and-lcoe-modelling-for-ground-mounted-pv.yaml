  publish_date: 2024-07
  project_name: Optimal O&M-strategy and LCOE-modelling for Ground-mounted PV
  what_happened: O&M costs for the 5B MAVERICK ground-mounted PV system were initially
    estimated at $10/kWp/year in 2022. Detailed cost modelling revised this to $9.33/kWp/year
    at GW scale, then reduced it further to $7.44/kWp/year through introduction of
    an automated vegetation management mower and a MAV-level module replacement strategy.
  lesson_learnt: O&M practices optimised for MW-scale solar plants should not be directly
    transferred to GW-scale deployments — automation (e.g. purpose-built mowers) and
    system-level replacement strategies (replacing at the MAVERICK block level rather
    than individual modules) unlock material cost reductions that are only economically
    viable at scale.
