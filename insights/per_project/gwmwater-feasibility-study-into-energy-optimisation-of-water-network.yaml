- record_id: ARENA-DLV-24203
  source_title: GWMWater Feasibility Study into Energy Optimisation of Water Network
    - Lessons Learnt Report
  publish_date: '2024-10-02'
  project_name: Dimboola-to-Nhill Urban Water Supply Pipeline Optimisation Project
  what_happened: GWMWater's SCADA system is physically separate from its corporate
    IT network for security reasons, which created barriers to integrating cloud-based
    data analytics platforms that most market-ready energy optimisation tools are
    built for.
  lesson_learnt: Water utilities with air-gapped or remote SCADA systems should plan
    for the development of data connectors to bridge operational and cloud-based analytics
    environments — this architecture challenge should be scoped and costed early in
    any energy optimisation project, as it is not a standard integration pathway.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: pilot
  lifecycle_phase: development/design
  proponent_type: government/public-sector body
  delay_category: commissioning/integration
  failure_mode: unvalidated integration
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: A clear solution for maintaining SCADA security while connecting
    remote SCADA to a cloud-based platform was demonstrated, using data connectors
    rather than migrating to a cloud-based SCADA system.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: industrial renewables
  source_pages: &id003
  - 6
  - 7
  evidence_excerpt: Physical separation decreases the ease with which cloud-based
    data analytics platforms can be integrated... GWMWater is unlikely to adopt a
    cloud-based SCADA system in the near future given the significant security benefits
    of its current remote system, but data connectors can be developed.
  confidence_note: delay_category assigned as commissioning/integration because the
    integration barrier was encountered during solution development and pilot design,
    not operational deployment.
