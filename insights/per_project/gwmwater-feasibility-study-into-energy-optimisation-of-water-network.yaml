  project_name: Dimboola-to-Nhill Urban Water Supply Pipeline Optimisation Project
  what_happened: Energy and electricity data streams were found to be incomplete or
    non-existent within GWMWater's SCADA system, because energy management in the
    water industry has historically been performed at a high level using billing data
    rather than real-time instrumentation.
  lesson_learnt: Water utilities initiating energy optimisation projects should audit
    the completeness of energy and electricity data streams within SCADA before commencing
    analytics development — gaps are common because real-time energy metering has
    not traditionally been a priority, and retrofitting data streams adds complexity
    and cost.
