  source_title: GWMWater Feasibility Study into Energy Optimisation of Water Network
    - Lessons Learnt Report
  publish_date: '2024-10-02'
  project_name: Dimboola-to-Nhill Urban Water Supply Pipeline Optimisation Project
  what_happened: GWMWater chose market-available software products over bespoke development
    for its data analytics platform, prioritising ongoing ICT support, regular updates,
    and cross-organisational scalability over customisation.
  lesson_learnt: For industrial energy optimisation projects in the water sector,
    prefer market-ready platforms over bespoke software — they reduce development
    risk, enable vendor support, allow scalability across the network, and support
    value-stacking across business areas (e.g. asset management, water treatment,
    network planning) that can justify licensing costs.
