- record_id: ARENA-DLV-24205
  source_title: GWMWater Feasibility Study into Energy Optimisation of Water Network
    - Lessons Learnt Report
  publish_date: '2024-10-02'
  project_name: Dimboola-to-Nhill Urban Water Supply Pipeline Optimisation Project
  what_happened: Data availability across GWMWater's network was inconsistent because
    sites were installed and commissioned at different times by different contractors
    using evolving specifications, making standardised analytics difficult to deploy.
  lesson_learnt: Water utilities should not expect uniform data availability across
    legacy networks — a network data overhaul is rarely justifiable as a standalone
    capital project, so energy optimisation programs should plan to validate and develop
    data streams incrementally on an as-needs basis, while standardising metering
    requirements for all new infrastructure going forward.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: pilot
  lifecycle_phase: development/design
  proponent_type: government/public-sector body
  delay_category: data/validation/testing
  failure_mode: data & measurement
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: GWMWater adopted a strategy of validating data on an as-needs
    basis for the pilot, while simultaneously pursuing standardisation of electricity
    metering for all future infrastructure projects to progressively build data availability.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: industrial renewables
  source_pages: &id005
  - 7
  - 8
  evidence_excerpt: Sites are installed, commissioned and connected at different times
    by different contractors, using specifications that evolve over time. This leads
    to discrepancies that impede the roll-out of standardised analytics... A network
    data overhaul is unlikely to be commercially justified by an individual capital
    project.
