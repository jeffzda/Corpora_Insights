- record_id: ARENA-DLV-24207
  source_title: GWMWater Feasibility Study into Energy Optimisation of Water Network
    - Lessons Learnt Report
  publish_date: '2024-10-02'
  project_name: Dimboola-to-Nhill Urban Water Supply Pipeline Optimisation Project
  what_happened: Phase 1 identified several energy efficiency opportunities on the
    network, but the majority — including bleed-back reduction between pressure zones
    and additional bypass pipelines — required new physical infrastructure and were
    therefore out of scope for a data-driven optimisation pilot.
  lesson_learnt: Energy optimisation feasibility studies for water networks should
    distinguish early between data-driven efficiency gains and infrastructure-dependent
    gains — many efficiency opportunities will require capital works that cannot be
    addressed within a software/analytics project scope, and scoping this boundary
    explicitly prevents wasted investigation effort.
  issue_severity: minor
  project_type: industrial decarbonisation
  project_scale_band: pilot
  lifecycle_phase: concept/feasibility
  proponent_type: government/public-sector body
  delay_category: null
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Phase 2 was refocused onto pump scheduling and run-time optimisation
    — opportunities addressable through data and controls without new infrastructure.
  transferability: moderate
  delay_magnitude: null
  technology_domain: industrial renewables
