- record_id: ARENA-DLV-24208
  source_title: GWMWater Feasibility Study into Energy Optimisation of Water Network
    - Lessons Learnt Report
  publish_date: '2024-10-02'
  project_name: Dimboola-to-Nhill Urban Water Supply Pipeline Optimisation Project
  what_happened: Phase 1 identified pump scheduling and run-time optimisation as a
    viable, network-scalable energy efficiency opportunity — large pumps at Nhill
    were operating frequently for short high-flow periods, when lower-flow, longer-duration
    operation would reduce friction losses and start-up energy, and allow pumps to
    run closer to their best-efficiency points.
  lesson_learnt: Water utilities should prioritise pump scheduling optimisation as
    a first-pass energy efficiency measure — running pumps less frequently at lower
    speeds for longer durations reduces friction losses (which scale with the cube
    of flow velocity), start-up losses, and improves motor efficiency, and this approach
    is scalable across any network site where pumps feed directly into storages.
