- record_id: ARENA-DLV-39102
  source_title: Development of Renewable Energy Zones in the NEM
  publish_date: 2020-01
  project_name: Development of Renewable Energy Zones in the NEM
  what_happened: In the NW-VIC REZ, the combination of a single-circuit 220 kV radial
    network topology and severe existing system strength and thermal constraint issues
    meant that zero additional VRE capacity could be connected without network or
    technology intervention.
  lesson_learnt: Brownfield radial network REZs with existing system strength deficits
    require transmission network augmentation as the foundational solution — technology-only
    solutions cannot cost-effectively unlock meaningful new hosting capacity in such
    constrained topologies.
