- record_id: ARENA-DLV-39112
  source_title: Development of Renewable Energy Zones in the NEM
  publish_date: 2020-01
  project_name: Development of Renewable Energy Zones in the NEM
  what_happened: Battery-based technology solutions in the NEM lacked defined commercial
    models to value their network services (system strength, thermal capacity relief)
    alongside energy arbitrage, FCAS and cap contract revenues, limiting confidence
    in business cases and deterring investment in shared REZ infrastructure.
  lesson_learnt: Demonstration projects and commercial model development are needed
    to quantify the network service value of battery-based solutions in REZs — without
    demonstrated revenue stacking models, commercial deployment of batteries as shared
    REZ infrastructure will not proceed at the required pace.
