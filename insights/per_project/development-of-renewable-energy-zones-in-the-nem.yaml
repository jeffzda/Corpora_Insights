- record_id: ARENA-DLV-39104
  source_title: Development of Renewable Energy Zones in the NEM
  publish_date: 2020-01
  project_name: Development of Renewable Energy Zones in the NEM
  what_happened: Modelling found that network augmentation ('poles and wires') was
    the most effective standalone solution in both REZs, enabling approximately 3
    GW of new hosting capacity in CW-NSW and 3.1 GW in NW-VIC — significantly more
    than any single technology solution.
  lesson_learnt: Network augmentation should be the backbone of REZ development planning;
    technology solutions are complementary and can unlock near-term capacity but cannot
    substitute for transmission build at the scale required to replace retiring coal
    capacity.
