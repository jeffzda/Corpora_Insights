  project_name: Development of Renewable Energy Zones in the NEM
  what_happened: The Regulatory Investment Test for Transmission (RIT-T) was identified
    by multiple stakeholders as a key regulatory barrier to REZ development because
    proactive transmission build ahead of firm generator commitments risked being
    deemed 'speculative' by the AER and failing regulatory approval.
  lesson_learnt: The RIT-T in its unamended form is not suitable for approving proactive
    REZ transmission investment — either the RIT-T must be amended to integrate ISP
    planning outcomes, or alternative approval pathways (dedicated connection assets,
    state-based levers) must be used to avoid multi-year regulatory delays.
