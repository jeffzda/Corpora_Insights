- record_id: ARENA-DLV-39107
  source_title: Development of Renewable Energy Zones in the NEM
  publish_date: 2020-01
  project_name: Development of Renewable Energy Zones in the NEM
  what_happened: The connection application and approval process, combined with PPA
    and other commercial arrangements, created a competitive landscape that incentivised
    speed over efficiency and acted as a barrier to information sharing and developer
    collaboration within REZs.
  lesson_learnt: The current connection process structurally discourages the coordination
    needed for efficient REZ development — developers racing to secure connection
    priority will not voluntarily share information or collaborate on shared infrastructure;
    deliberate commercial or regulatory mechanisms are needed to overcome this.
