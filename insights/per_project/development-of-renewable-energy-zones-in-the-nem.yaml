- record_id: ARENA-DLV-39113
  source_title: Development of Renewable Energy Zones in the NEM
  publish_date: 2020-01
  project_name: Development of Renewable Energy Zones in the NEM
  what_happened: SSSC ('smart wire') technology was found to be cost-competitive in
    CW-NSW at $39/kW of additional VRE capacity but delivered only 21 MW of additional
    capacity in NW-VIC at $714/kW, reflecting its dependence on network topology and
    an identified limitation during fault conditions in existing implementations.
  lesson_learnt: SSSC technology is highly topology-dependent and most applicable
    to meshed networks; in radial networks with severe system strength issues it is
    largely ineffective and existing implementations have fault-condition limitations
    that must be resolved before deployment — suitability assessment must precede
    investment.
