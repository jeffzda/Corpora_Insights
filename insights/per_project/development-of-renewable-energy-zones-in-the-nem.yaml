  source_title: Development of Renewable Energy Zones in the NEM
  publish_date: 2020-01
  project_name: Development of Renewable Energy Zones in the NEM
  what_happened: Grid-forming inverter technology capabilities were not well defined
    in the market at the time of the study, requiring the modelling to assume a specific
    capability (setting local grid voltage) and run two separate scenarios for system
    strength impact, introducing significant uncertainty into cost and performance
    estimates.
  lesson_learnt: Grid-forming inverter specifications and system strength contributions
    are not yet standardised — project planners should not rely on assumed grid-forming
    capabilities in connection studies without verification with specific technology
    suppliers, and should conduct sensitivity modelling to bound the uncertainty.
