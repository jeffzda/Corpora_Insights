- record_id: ARENA-DLV-39105
  source_title: Development of Renewable Energy Zones in the NEM
  publish_date: 2020-01
  project_name: Development of Renewable Energy Zones in the NEM
  what_happened: Coordinated (strategically sized and located) deployment of technology
    solutions was found to deliver substantially lower cost per kW of VRE capacity
    unlocked compared to uncoordinated ('do no harm') deployment at individual connection
    points.
  lesson_learnt: REZ technology solutions should be planned and deployed at the zone
    level rather than project by project — coordinated placement and sizing can materially
    reduce the cost of unlocking connection capacity and is a key enabler for efficient
    REZ development.
