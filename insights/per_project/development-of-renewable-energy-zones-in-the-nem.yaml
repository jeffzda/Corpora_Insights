- record_id: ARENA-DLV-39111
  source_title: Development of Renewable Energy Zones in the NEM
  publish_date: 2020-01
  project_name: Development of Renewable Energy Zones in the NEM
  what_happened: Coordinated grid-forming BESS in NW-VIC was modelled at $655/kW of
    additional VRE capacity unlocked (standard scenario) versus $332/kW with 200%
    fault contribution — compared to $65/kW in CW-NSW — demonstrating that the same
    technology can be orders of magnitude more or less cost-effective depending on
    network topology and system strength context.
  lesson_learnt: Technology solution costs per kW of unlocked capacity vary dramatically
    between REZs depending on network topology — cost benchmarks from one REZ should
    not be transferred to another without conducting site-specific network modelling;
    a 'one size fits all' approach is explicitly unsuitable.
