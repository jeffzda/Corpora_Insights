- record_id: ARENA-DLV-39108
  source_title: Development of Renewable Energy Zones in the NEM
  publish_date: 2020-01
  project_name: Development of Renewable Energy Zones in the NEM
  what_happened: The open access regime in the NEM introduced a 'free rider' problem
    that acted as a key barrier to coordinated deployment of scaled, shared technology
    solutions within REZs — individual developers had no incentive to fund shared
    infrastructure that others could benefit from without contributing.
  lesson_learnt: Open access regimes without cost-sharing mechanisms prevent efficient
    deployment of shared REZ infrastructure — commercial or regulatory solutions must
    allocate costs and benefits of shared technology solutions to participating developers
    before coordinated deployment can occur.
