  source_title: Development of Renewable Energy Zones in the NEM
  publish_date: 2020-01
  project_name: Development of Renewable Energy Zones in the NEM
  what_happened: In the CW-NSW REZ, despite a more favourable meshed 132 kV network
    topology adjacent to a 330 kV strong grid, available connection capacity without
    intervention was only 216 MW against almost 15 GW of total VRE potential across
    the two REZs.
  lesson_learnt: Even greenfield REZs with relatively favourable network topologies
    face a large gap between resource potential and available connection capacity
    — proactive technology and network solutions must be planned well in advance of
    generation build-out to avoid stranded or curtailed investment.
