- record_id: ARENA-DLV-39101
  source_title: Development of Renewable Energy Zones in the NEM
  publish_date: 2020-01
  project_name: Development of Renewable Energy Zones in the NEM
  what_happened: The current NEM regulatory framework and network development approach
    were not designed to support REZ development or to mitigate technical challenges
    of integrating high penetrations of variable renewable energy, creating systemic
    barriers to efficient REZ build-out.
  lesson_learnt: REZ development at scale requires deliberate regulatory reform —
    the existing framework creates structural barriers including competitive connection
    incentives that favour speed over efficiency, free-rider problems under open access,
    and a RIT-T process that treats proactive transmission build as speculative.
