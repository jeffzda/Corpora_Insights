- record_id: ARENA-DLV-39106
  source_title: Development of Renewable Energy Zones in the NEM
  publish_date: 2020-01
  project_name: Development of Renewable Energy Zones in the NEM
  what_happened: Grid-following BESS was found to reduce system strength and therefore
    could not be deployed in the NW-VIC REZ where system strength was already critically
    deficient, despite being a cost-competitive solution in CW-NSW at $39/kW.
  lesson_learnt: Grid-following BESS must not be deployed in REZs with poor system
    strength — it actively degrades system strength and is incompatible with radial,
    weak-grid environments; grid-forming inverter technology or synchronous condensers
    must be used instead.
