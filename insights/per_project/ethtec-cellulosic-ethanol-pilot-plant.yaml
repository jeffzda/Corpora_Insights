  what_happened: The study found that gaining access to fibre in highly competitive
    plantation regions (Green Triangle, Tasmania, WA Albany) is described as 'not
    a simple pursuit' due to entrenched relationships between landowners, tree owners
    and processors, and demand for woodchips consistently exceeding supply in these
    regions. This commercial and relationship barrier is distinct from the raw availability
    or price question.
  lesson_learnt: Even in regions with the highest feedstock availability and accessibility
    scores, new entrants to the cellulosic ethanol industry will face entrenched commercial
    relationships between existing forest owners, processors, and export buyers; early
    engagement with major plantation owners (e.g. New Forests, Hancock Group) and
    woodchipping entities (e.g. ABP, APEC, Midway) before project financial close
    is essential to secure supply commitments.
