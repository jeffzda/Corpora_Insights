- record_id: ARENA-DLV-32251
  source_title: Ethtec - Cellulosic Ethanol Pilot Plant - Cellulosic Feedstock Availability
    in Australia and Asian Markets Report
  publish_date: 2024-08
  project_name: Ethtec Cellulosic Ethanol Pilot Plant
  what_happened: A desk study commissioned to assess lignocellulosic feedstock availability
    for the Ethtec cellulosic ethanol pilot plant found a substantial and persistent
    gap between theoretical feedstock 'availability' and what is practically, commercially,
    and sustainably 'accessible' — with ARENA's own Bioenergy Roadmap modelling assuming
    on average only 45% of theoretical potential could be accessed.
  lesson_learnt: Cellulosic ethanol project developers must not use theoretical biomass
    availability figures for project planning — accessible supply is typically a fraction
    of available supply due to collection logistics, competing uses, price, and supply
    chain costs; project feasibility assessments should apply an accessibility discount
    (ARENA modelling used ~45%) rather than treating availability as supply.
