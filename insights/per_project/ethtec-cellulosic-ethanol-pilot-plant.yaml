  what_happened: The Hunter Pilot Biorefinery was sited in Muswellbrook, NSW — a coal-mining
    community within a Renewable Energy Zone — and received strongly positive responses
    from local community, industry, and government groups, with significant interest
    in retraining and workforce transition from the mining sector.
  lesson_learnt: Locating bioenergy pilot facilities in coal-transition regions can
    generate strong community and government support by aligning with workforce transition
    narratives; proponents should actively engage local mining companies, training
    institutions (TAFE, universities), and state agencies early to build a pipeline
    of skilled workers and to explore feedstock supply opportunities.
