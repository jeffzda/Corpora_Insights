- record_id: ARENA-DLV-32256
  source_title: Ethtec - Cellulosic Ethanol Pilot Plant - Cellulosic Feedstock Availability
    in Australia and Asian Markets Report
  publish_date: 2024-08
  project_name: Ethtec Cellulosic Ethanol Pilot Plant
  what_happened: The Asia-Pacific hardwood woodchip supply-demand analysis projected
    a deficit growing from 2.3 million BDMT in 2023 to a base case of 7.6 million
    BDMT by 2026, driven by new Chinese pulp and paper capacity. This structural deficit
    will drive up hardwood woodchip prices globally, directly increasing the cost
    of any Australian domestic feedstock sourced from plantations supplying the export
    market.
  lesson_learnt: Project developers planning cellulosic ethanol facilities should
    anticipate ongoing upward pressure on feedstock prices from the Asian woodchip
    deficit; project economics should be stress-tested against woodchip prices materially
    above current levels, and feedstock strategies that rely on residues and waste
    streams (less exposed to export pricing) will be more cost-resilient than strategies
    based on pulpwood.
