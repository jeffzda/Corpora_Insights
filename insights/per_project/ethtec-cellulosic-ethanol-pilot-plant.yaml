  what_happened: China's 2020 ban on imports of Australian forest log products caused
    a significant decline in Australian hardwood pulpwood production, as shown in
    the production data. The ban has since been lifted, but the event demonstrated
    how international trade policy can abruptly reduce domestic feedstock availability
    and disrupt supply assumptions for any domestic bioenergy facility relying on
    plantation pulpwood.
  lesson_learnt: Cellulosic ethanol developers sourcing feedstock from export-oriented
    plantations face supply volatility linked to international trade policy; feedstock
    supply agreements should include provisions for domestic supply-demand shifts
    driven by export market changes, and feasibility assessments should stress-test
    feedstock security under scenarios of export market disruption.
