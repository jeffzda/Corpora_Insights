  project_name: Ethtec Cellulosic Ethanol Pilot Plant
  what_happened: Woodchip screening fines (approximately 3% of woodchip mass, largely
    undersize woodchips) generated at centralised processing sites are currently a
    disposal problem — often dumped to landfill — with limited market options. These
    fines were identified as a potentially ideal low-cost feedstock for a cellulosic
    ethanol facility, particularly in northeast Tasmania where multiple chipping plants
    with screens are co-located at Bell Bay.
  lesson_learnt: Cellulosic ethanol developers should evaluate woodchip screening
    fines as a near-zero-cost feedstock opportunity, particularly in regions with
    concentrated chipping operations (e.g. Bell Bay, Tasmania); these residues are
    currently a liability for processors and could be secured at very low or no stumpage
    cost, provided the facility is located within economic haulage distance.
