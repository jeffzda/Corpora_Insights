  publish_date: 2024-08
  project_name: Ethtec Cellulosic Ethanol Pilot Plant
  what_happened: Cereal straw is not widely used in Australia for bioenergy despite
    being a potential feedstock with low moisture content. No-till farming is commonly
    practised to retain and build soil carbon levels, and there are concerns that
    harvesting cereal straw may consume more energy than it generates as bioenergy.
    There are no known examples of straw or crop stubble used as fuel in Australia.
  lesson_learnt: Cellulosic ethanol developers should not assume cereal straw will
    be available as a low-cost Australian feedstock — no-till farming norms and soil
    carbon retention practices create strong agronomic barriers to straw collection,
    and the energy balance of collection in Australian conditions may be unfavourable;
    feasibility assessments should exclude cereal straw unless there is a specific
    regional context where disposal costs make it available.
