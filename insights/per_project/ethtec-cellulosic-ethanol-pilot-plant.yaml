- record_id: ARENA-DLV-32252
  source_title: Ethtec - Cellulosic Ethanol Pilot Plant - Cellulosic Feedstock Availability
    in Australia and Asian Markets Report
  publish_date: 2024-08
  project_name: Ethtec Cellulosic Ethanol Pilot Plant
  what_happened: The accessibility modelling found that to secure an average of 150,000
    GMT per year of hardwood pulpwood across the three largest NPI regions, a project
    would need to access 5.7% of available supply — 2.3 times the base case accessibility
    of 2.5% — because export market demand consistently outbids domestic users. For
    softwood pulpwood thinning residues, achieving 150,000 GMT would require 91% accessibility,
    described as 'seemingly impossible'.
  lesson_learnt: Cellulosic ethanol facilities planning to source commercial pulpwood
    as a primary feedstock will face severe competition from established export woodchip
    markets; base-case accessible volumes from any single furnish type in any region
    are well below the 150,000 GMT pa threshold typically required for commercial
    viability, and project developers should plan for a diversified multi-furnish
    strategy rather than reliance on any single feedstock.
