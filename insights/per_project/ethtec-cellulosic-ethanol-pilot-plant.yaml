  what_happened: Sawmill residues (bark, sawdust, shavings, woodchips from softwood
    sawmills) have high availability (approximately 2.1 million GMT/year nationally)
    but low accessibility because demand from wood-based panel manufacturers and co-firing
    for sawmill energy is strong, leaving little uncommitted volume for a new buyer
    such as a cellulosic ethanol facility.
  lesson_learnt: Despite high theoretical availability, sawmill residues have strong
    incumbent competing uses (wood-based panels, co-firing) that will limit accessibility;
    cellulosic ethanol developers should expect to pay a market price for sawmill
    residues rather than assuming waste-stream pricing, and should enter early commercial
    discussions with large sawmillers (e.g. AKD, Timberlink) to assess uncommitted
    volumes before including this stream in project economics.
