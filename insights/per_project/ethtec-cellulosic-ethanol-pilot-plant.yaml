  what_happened: 'Cotton gin trash (CGT) was identified as a near-zero-cost feedstock
    opportunity: it is produced and concentrated at specific gin locations (some generating
    up to 100,000 t per season), its direct reapplication to farms is strongly discouraged
    due to pathogen and pesticide contamination risks, and a hypothetical gin-trash-to-ethanol
    plant at Narrabri NSW returned a positive NPV with IRR of 9% and payback in year
    12 of 25. However, variable processing costs for CGT are almost 2.5 times those
    of molasses, wheat, or sorghum.'
  lesson_learnt: Cotton gin trash is a potentially viable low-cost feedstock for cellulosic
    ethanol given its zero stumpage price and concentrated supply at gins, but project
    economics must account for high variable processing costs (approximately 2.5x
    conventional feedstocks) and seasonal supply; developers should co-locate with
    or near gin operations in the Namoi Valley (NSW) or central Queensland to minimise
    haulage costs.
