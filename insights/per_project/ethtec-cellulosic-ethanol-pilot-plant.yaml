  publish_date: 2024-08
  project_name: Ethtec Cellulosic Ethanol Pilot Plant
  what_happened: Over 200,000 hectares of Australian hardwood plantation area reverted
    from plantation to agriculture over the decade to 2022 (from ~973,000 ha in 2010
    to ~711,000 ha in 2022), driven by highest-and-best-use conversions where forestry
    was no longer economic. This reduced the total potential hardwood pulpwood and
    residue availability for any future domestic bioenergy offtake.
  lesson_learnt: Project developers planning cellulosic ethanol facilities with a
    long-term hardwood feedstock dependency should note that the Australian hardwood
    plantation estate has contracted substantially and will likely continue to decline
    in some regions; long-term offtake agreements or site selection near stable softwood
    plantation regions (Green Triangle, Murray Valley) will provide more secure supply
    than reliance on hardwood estates.
