- record_id: ARENA-DLV-54651
  source_title: Ethtec Cellulosic Ethanol Pilot Plant Lessons Learnt Report 1
  publish_date: 2024-11
  project_name: Ethtec Cellulosic Ethanol Pilot Plant (Hunter Pilot Biorefinery)
  what_happened: Construction of the Hunter Pilot Biorefinery commenced just before
    the COVID-19 pandemic, resulting in wholesale site shutdowns, labour shortages,
    supply chain disruptions, and increased labour costs. The project was bound by
    a fixed-budget NSW Government funding agreement with no mechanism to request additional
    or contingency funding, meaning all overruns had to be absorbed within the original
    budget envelope.
  lesson_learnt: Fixed funding agreements with no contingency or adjustment mechanism
    severely limit a project's ability to respond to extraordinary external shocks
    such as a pandemic. Future projects — particularly those involving government
    co-funding — should negotiate contingency allowances or budget adjustment provisions
    at the outset, especially when the external environment is uncertain.
