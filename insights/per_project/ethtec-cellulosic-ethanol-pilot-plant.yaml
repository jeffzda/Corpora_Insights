  what_happened: Benchmarking assays comparing Ethtec-developed yeast strains against
    third-party organisms (Saccharomyces cerevisiae, Scheffersomyces stipitis) in
    the proprietary Ethtec sugars solution confirmed that Ethtec strains performed
    best in this specific fermentation environment, validating the organism selection
    for scale-up.
  lesson_learnt: Careful selection of the fermentation microorganism is critical for
    successful production outcomes; benchmarking candidate strains in the actual production
    media — not a standard growth medium — should be performed before committing to
    scale-up, as performance in a proprietary or process-specific medium may differ
    substantially from published data.
