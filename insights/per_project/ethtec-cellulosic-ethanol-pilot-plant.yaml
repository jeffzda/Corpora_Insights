  what_happened: The Murray Valley (NSW) was identified as a region with a projected
    future peak in softwood thinnings and sawmill residues in approximately 10–15
    years and 20–25 years respectively, driven by extensive softwood plantations replanted
    after the 2020 fires covering hundreds of thousands of hectares. However, the
    region's distance from ports makes international export of pulpwood and residues
    marginal, creating a domestic opportunity.
  lesson_learnt: The 2020 fire-replant cohort in the Murray Valley will create a significant
    future feedstock opportunity for a domestically sited cellulosic ethanol facility
    in approximately 10–15 years; developers with long planning horizons should factor
    this into site selection and offtake planning, as the region's distance from ports
    provides a structural advantage for domestic bioenergy uses over export competition.
