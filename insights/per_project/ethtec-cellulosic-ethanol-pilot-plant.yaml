  what_happened: Carbon farming plantations registered under the Australian Emissions
    Reduction Fund (ERF) create a permanence obligation (25 or 100 years) that locks
    land into forestry use. Under Schedule 4, plantations transition to permanent
    forests and all pulpwood and residue availability is eliminated. Forest residues
    included in ACCU calculations cannot be removed, potentially reducing accessible
    feedstock from carbon-registered stands.
  lesson_learnt: Cellulosic ethanol developers sourcing feedstock from carbon-registered
    plantation forests must verify ERF schedule status before contracting supply —
    Schedule 4 (permanent forest) and forests with residues included in ACCU calculations
    will have zero accessible residues; developers should focus procurement on Schedule
    1 and 3 forests and require disclosure of ERF registration status as part of supply
    due diligence.
