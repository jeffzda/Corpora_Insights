  project_name: Ethtec Cellulosic Ethanol Pilot Plant
  what_happened: The Ethtec process was described as not feedstock-specific — able
    to process multiple types of lignocellulosic material simultaneously. This technological
    flexibility was identified as a strategic delivery advantage, improving accessibility
    to a wider range of furnish types and enhancing project economics by enabling
    opportunistic sourcing of multiple lower-cost residue streams that individually
    are insufficient for commercial scale.
  lesson_learnt: Cellulosic ethanol developers should explicitly design for feedstock
    flexibility — the ability to process multiple furnish types simultaneously significantly
    expands accessible supply, reduces dependence on any single feedstock stream,
    and improves resilience to supply disruptions or price spikes in any one residue
    category; this flexibility should be documented and quantified as part of project
    feasibility.
