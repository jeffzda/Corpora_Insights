  what_happened: Sugarcane residues (bagasse and trash) are available in large quantities
    in concentrated areas with good access to existing infrastructure, making them
    attractive feedstocks. However, bagasse is already heavily utilised for cogeneration
    at mills, and retaining trash in the field provides strong agronomic benefits
    (soil carbon, nutrient retention, reduced fertiliser use), creating significant
    competition that limits accessible volumes for third-party bioenergy use.
  lesson_learnt: Sugarcane residues should be assessed carefully for actual uncommitted
    volumes rather than total production — bagasse is largely committed to mill energy,
    and trash retention provides documented agronomic returns of up to 28% yield improvement
    in ratoon crops; feedstock contracts should be negotiated directly with mills,
    clarifying which fractions are genuinely surplus to mill requirements.
