- record_id: ARENA-DLV-32253
  source_title: Ethtec - Cellulosic Ethanol Pilot Plant - Cellulosic Feedstock Availability
    in Australia and Asian Markets Report
  publish_date: 2024-08
  project_name: Ethtec Cellulosic Ethanol Pilot Plant
  what_happened: Australian hardwood woodchip prices are set at export parity, with
    the delivered capacity-to-pay parity price estimated at approximately $103/GMT
    — placing both hardwood and softwood pulpwood in the 'High' price category (>$100/GMT
    delivered). This means a domestic cellulosic ethanol facility must compete directly
    with export buyers paying world prices, making pulpwood an expensive and contested
    feedstock.
  lesson_learnt: Bioenergy and cellulosic ethanol developers in Australia should assume
    feedstock costs for commercial pulpwood will be set at export parity (~$100–$103/GMT
    delivered), not at a discount; forest residues (~$57/GMT delivered) and sawmill
    residues (~$45/GMT delivered) offer significantly lower-cost feedstock options
    and should be prioritised in project economics.
