- record_id: ARENA-DLV-54656
  source_title: Ethtec Cellulosic Ethanol Pilot Plant Lessons Learnt Report 1
  publish_date: 2024-11
  project_name: Ethtec Cellulosic Ethanol Pilot Plant (Hunter Pilot Biorefinery)
  what_happened: The Ethtec process was designed to accept mixed and varied lignocellulosic
    feedstocks (wheat straw, sugarcane bagasse, cotton gin trash, forestry off-cuts,
    municipal green waste, etc.), overcoming the single-feedstock dependency that
    limits other cellulosic ethanol technologies and enabling siting in regions with
    mixed rather than concentrated feedstock supply.
  lesson_learnt: Designing bioenergy processes to be feedstock-agnostic substantially
    increases the geographic viability of commercial deployment; project developers
    should assess feedstock flexibility as a key risk-mitigation factor when evaluating
    process routes for regions lacking a single dominant biomass supply.
  issue_severity: none
  project_type: industrial decarbonisation
  project_scale_band: pilot
  lifecycle_phase: concept/feasibility
  proponent_type: project developer
  delay_category: null
