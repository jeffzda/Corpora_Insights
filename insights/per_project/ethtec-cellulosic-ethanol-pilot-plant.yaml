  project_name: Ethtec Cellulosic Ethanol Pilot Plant
  what_happened: Forest residues (harvest and processing waste) require that wood
    or woody waste be dried to approximately 40% moisture content before accumulation
    and transport to a biomass production centre — lower than the typical export woodchip
    moisture content of 40–53%. This introduces double-handling requirements and changes
    to standard forest operations, adding logistics cost that is absent from normal
    commercial forestry.
  lesson_learnt: Cellulosic ethanol developers planning to use forest residues must
    account for moisture management costs (drying, double handling, field storage)
    not present in standard forestry operations; delivered residue cost estimates
    should include these steps, and facility siting near regions with favourable drying
    conditions or existing infrastructure will reduce this cost.
