  publish_date: 2024-08
  project_name: Ethtec Cellulosic Ethanol Pilot Plant
  what_happened: Oil mallee plantations in southwest Western Australia were identified
    as a potential lignocellulosic feedstock source, but bioenergy production hopes
    for mallee have not materialised to the level anticipated, and an efficient system
    to harvest, process, and transport oil mallee has not been established, limiting
    the economic viability of this feedstock option.
  lesson_learnt: Purpose-grown energy crops such as oil mallee should not be treated
    as a secure or low-cost feedstock for cellulosic ethanol without a demonstrated,
    economically viable harvest-process-transport chain; developers should require
    proof-of-concept harvest operations and cost data before including mallee in project
    feedstock plans, noting that biomass yields of 50 GMT/ha at age 4–5 years would
    require ~3,000 ha of plantation to supply 150,000 GMT/year.
