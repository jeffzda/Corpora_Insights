- record_id: ARENA-DLV-53874
  source_title: Demand Flexibility Portfolio Retrospective Analysis Report
  publish_date: 2023-07
  project_name: ARENA RERT Demand Response Round (AGL, Enel X, Flow Power, EnergyAustralia, Powershop)
  what_happened: The ARENA/AEMO RERT funding round successfully moved demand flexibility from a 'fringe' product to a mainstream capability in less than four years, with AGL building a 215 MW demand response
    portfolio, Enel X registering 66 MW in the WDR mechanism, and Flow Power developing a combined PPA-demand flexibility product that influenced the corporate PPA sector.
  lesson_learnt: Co-funding arrangements between ARENA and AEMO, structured around a specific high-certainty revenue mechanism (RERT availability payments), successfully enabled a new market segment to
    develop the operational capability, customer portfolios, and industry confidence needed to expand into adjacent value streams. Similar co-funding models could accelerate demand flexibility in network
    and wholesale markets.
