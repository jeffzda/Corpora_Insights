- record_id: ARENA-DLV-54251
  source_title: Hysata 'Capillary-fed' Electrolyser Commercial-Scale Demonstration
    Project – Lessons Learned Report September 2025
  publish_date: 2025-09
  project_name: Hysata Capillary-fed Electrolyser Commercial-Scale Demonstration Project
  what_happened: The planned demonstration site at Stanwell Corporation's Future Energy
    Innovation and Training Hub (FEITH) in Queensland was cancelled after the Queensland
    State Government announced in early 2025 it would halt all investment in hydrogen,
    causing Stanwell to withdraw as host partner. Hysata had anticipated this risk
    and maintained parallel discussions with alternative demonstration partners, enabling
    a rapid pivot to a new location with minimal disruption.
  lesson_learnt: Maintain relationships with multiple potential demonstration partners
    in parallel from the outset of a project — when a government-policy-driven partner
    withdrawal occurred, pre-prepared contingency plans allowed Hysata to pivot quickly
    with only minor project impact. Assess policy risks to partners early and formalise
    alternative location agreements during project planning.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: approvals/contracting
  proponent_type: technology vendor
  delay_category: stakeholder/land/community
  failure_mode: coordination & stakeholders
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Hysata activated pre-prepared contingency partner relationships,
    rapidly identified a new demonstration location, and revised project scope — the
    change had only minor impacts on the overall project.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages: &id001
  - 4
  - 5
  evidence_excerpt: When Hysata entered into the agreement with Stanwell, we understood
    and prepared for the risk that government policy shifts could influence Stanwell's
    involvement. For this reason, we maintained multiple discussions with other potential
    demonstration partners from the outset. Our decision to pursue several contingency
    options was supported when Stanwell signalled a 12-month delay to the FEITH site
    build. As a result, when Stanwell withdrew, these plans could be implemented quickly.
    The change in partner had only minor impacts on the project.
  confidence_note: issue_severity set to moderate because the host-site cancellation
    required rescope and partner change, though Hysata's preparation limited actual
    disruption; lifecycle_phase is approvals/contracting as the event relates to partner/site
    agreements rather than construction.
