  what_happened: Hysata built a diverse pipeline of prospective commercial partnerships
    across hard-to-abate sectors beyond its primary Stanwell collaboration, enabling
    it to prioritise projects by customer timeline and technology readiness and anticipate
    market shifts.
  lesson_learnt: Technology providers pursuing commercialisation should actively build
    and maintain a diverse customer pipeline in parallel with demonstration activities
    — relying on a single partnership creates single-point-of-failure risk for the
    commercialisation pathway, whereas a broad pipeline allows project prioritisation
    and rapid initiation as opportunities mature.
