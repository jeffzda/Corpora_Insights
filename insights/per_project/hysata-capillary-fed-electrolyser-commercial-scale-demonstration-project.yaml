- record_id: ARENA-DLV-61952
  source_title: Hysata 'Capillary-fed' Electrolyser Commercial-Scale Demonstration
    Project - Lessons Learnt Report
  publish_date: 2024-10
  project_name: Hysata Capillary-fed Electrolyser Commercial-Scale Demonstration Project
  what_happened: Hysata found that engaging with a broad cohort of customers — including
    strategic investors — allowed the company to distinguish between universally applicable
    core product requirements and niche requirements that only a subset of customers
    need, informing a modular product architecture decision.
  lesson_learnt: When developing a technology product for a diverse customer base,
    systematically survey multiple customers to separate core requirements from niche
    ones — niche requirements such as fuel-cell-grade hydrogen purity or high delivery
    pressure are better addressed as modular add-ons than built into the core system,
    preserving scalability and cost-effectiveness.
  issue_severity: none
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: Hysata engaged strategic investors and a wide cohort of customers
    to collect technical and market feedback, using this to define a standard core
    product and a modular add-on architecture.
  transferability: moderate
  delay_magnitude: null
  technology_domain: hydrogen
  source_pages: &id004
  - 3
  - 4
  evidence_excerpt: If certain technical requirements—such as higher delivery pressures
    or fuel-cell-grade hydrogen purity—are unique to only a subset of customers, it
    may be more economical to address them through an 'add on' or centralised equipment
    that sits in customer scope, as opposed to adding complexity into the core electrolyser
    system.
  confidence_note: null
