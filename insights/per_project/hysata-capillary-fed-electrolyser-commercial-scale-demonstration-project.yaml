  publish_date: 2024-10
  project_name: Hysata Capillary-fed Electrolyser Commercial-Scale Demonstration Project
  what_happened: Hysata's collaboration with Stanwell Corporation as an early commercial
    partner provided critical input into electrolyser design, including key technical
    parameters such as system boundaries, hydrogen delivery pressure, and purity level,
    shaping product refinement to meet real-world operational requirements before
    finalising the technology for demonstration.
  lesson_learnt: Establish early commercial partnerships before finalising technology
    design — customer-specific technical requirements (delivery pressure, purity,
    system boundaries) are best captured through ongoing co-development rather than
    retrofitted after design freeze. Structure feedback loops through regular meetings
    and site visits to keep product development aligned with market needs.
