- record_id: ARENA-DLV-54252
  source_title: Hysata 'Capillary-fed' Electrolyser Commercial-Scale Demonstration
    Project – Lessons Learned Report September 2025
  publish_date: 2025-09
  project_name: Hysata Capillary-fed Electrolyser Commercial-Scale Demonstration Project
  what_happened: Hysata adopted a modular system design for its commercial-scale electrolyser
    demonstration, pairing a single full-scale stack array module with a full-scale
    balance of stack (BOS), rather than building a one-off large system. This approach
    reduced bill of materials, civil works, and EPC costs, shortened installation
    and commissioning timelines, and produced commercially relevant performance data
    directly applicable to customer procurement decisions.
  lesson_learnt: Build modularity into product and demonstration design from the outset
    — demonstrating one full-scale module with a full-scale BOS reduces EPC costs
    and deployment timelines while generating performance data that directly matches
    what customers will procure at scale, and provides a credible and clear pathway
    to gigawatt-scale deployment without redesigning the core system.
  issue_severity: none
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: no material delay stated
  failure_mode: no major failure stated
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: hydrogen
  source_pages: &id002
  - 6
  - 7
  evidence_excerpt: 'By constructing demonstrations around one stack array module
    coupled with a full-scale BOS, Hysata can generate performance data directly relevant
    to what customers will procure at scale, while minimising the costs and complexity
    of the demonstration itself… Cost-effective demonstrations: Reduced bill of materials,
    a smaller physical footprint, and lower civil works and EPC costs. Faster deployment:
    Shorter installation and commissioning times compared with larger one-off builds.'
  confidence_note: transferability set to moderate rather than broad because the modular-design
    insight is most directly applicable to technology vendors and OEMs building first-of-kind
    demonstrators; less directly applicable to, e.g., network or DER projects.
