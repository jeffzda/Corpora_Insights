- record_id: ARENA-DLV-40604
  source_title: ARENA Electrical Infrastructure Roundtable
  publish_date: '2025-06-25'
  project_name: Western Power Access and Queuing Policy (AQP) / Critical Projects
    Framework
  what_happened: Under the existing Access and Queuing Policy (AQP), a first-in-first-served
    queue of 236 projects had accumulated by May 2024 with no mechanism to distinguish
    credible projects from inactive ones; approximately 68% of projects were assessed
    as 'zombies' unlikely to progress, yet they blocked resources and capacity for
    viable projects, with only ~5–7% of projects ever reaching execution.
  lesson_learnt: A first-in-first-served connection queue without a readiness or credibility
    filter creates a 'zombie project' problem that blocks viable projects from accessing
    network capacity and developer resources; network businesses should implement
    a structured readiness framework that prioritises projects demonstrating financial,
    organisational, and land access readiness.
  issue_severity: major
  project_type: network/grid
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: approvals/contracting
  proponent_type: network business
  delay_category: approvals/regulatory
  failure_mode: coordination & stakeholders
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Western Power implemented the Critical Projects Framework alongside
    the MCCP, requiring projects to demonstrate strategic alignment and customer readiness
    (including land access, procurement, financial readiness, and a Director-signed
    Readiness Declaration) to receive 'Connection Ready' priority status.
