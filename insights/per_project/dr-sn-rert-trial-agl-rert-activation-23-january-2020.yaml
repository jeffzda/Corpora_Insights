- record_id: ARENA-DLV-20703
  source_title: Demand Response Short Notice RERT Trial Year 3 Report
  publish_date: 2021-10
  project_name: DR SN RERT Trial — AGL RERT Activation (23 January 2020)
  what_happened: During the 23 January 2020 RERT activation — at the height of the
    bushfires — AGL found that available DR capacity was only about half of its contracted
    volume, as critical-infrastructure customers were in emergency response mode,
    a shopping centre declined due to air quality, and another shopping centre was
    open for late Thursday trading which impeded HVAC load reduction.
  lesson_learnt: Portfolio managers should account for variable customer operating
    schedules and emergency-driven unavailability when sizing contracted DR capacity;
    the standard '10 of 10' baseline methodology does not accommodate businesses with
    variable schedules, and portfolio design should include sufficient over-recruitment
    to absorb simultaneous unavailability of multiple customers.
