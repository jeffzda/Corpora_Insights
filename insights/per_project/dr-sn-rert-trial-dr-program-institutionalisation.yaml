- record_id: ARENA-DLV-20732
  source_title: Demand Response Short Notice RERT Trial Year 3 Report
  publish_date: 2021-10
  project_name: DR SN RERT Trial — DR program institutionalisation
  what_happened: Lessons learned across the three-year trial caused multiple participants to transition DR from a peripheral or trial activity to business as usual, including interest in using DR to manage
    minimum operational demand conditions and localised over-voltage conditions, indicating DR's potential role in future system services beyond RERT.
  lesson_learnt: A multi-year funded DR trial can accelerate the commercialisation of DR capabilities and shift participant business models so that DR becomes a core service rather than a trial activity;
    ARENA funding that requires participants to deliver and report across multiple years creates the institutional learning necessary for permanent market participation.
