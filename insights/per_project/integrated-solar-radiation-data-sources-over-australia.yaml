- record_id: ARENA-DLV-70603
  source_title: Integrated Solar Radiation Data Sources over Australia
  publish_date: 2015-08
  project_name: Integrated Solar Radiation Data Sources over Australia (ISRDSA)
  what_happened: The scarcity and higher complexity of direct normal irradiance (DNI)
    observations compared to global horizontal irradiance (GHI) meant that more project
    time was spent cleaning and interpreting DNI data than planned, and a full analysis
    of DNI — particularly for high-resolution (1-minute) time series — could not be
    completed satisfactorily within the project.
  lesson_learnt: Future projects analysing both GHI and DNI should allocate additional
    resources specifically for DNI work, or focus initially on GHI only and transfer
    methods to DNI in a subsequent phase — underestimating the complexity of DNI data
    relative to GHI leads to incomplete analysis deliverables.
