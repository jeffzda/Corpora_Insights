  what_happened: Solar radiation data collected from non-Bureau ground station networks
    (agriculture, research institutes, commercial companies) was highly variable in
    quality, requiring substantially more effort than anticipated to quality-control
    and assure before it could be used in the project.
  lesson_learnt: When planning projects that aggregate solar radiation data from multiple
    heterogeneous sources, explicitly budget for the time and resources required for
    quality control and assurance — the effort to clean and catalogue non-primary-network
    data should not be underestimated, even when the data appears abundant.
