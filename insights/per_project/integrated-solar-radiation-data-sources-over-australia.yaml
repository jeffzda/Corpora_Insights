  what_happened: The agreement between CSIRO and NREL (a subcontractor) was not signed
    until early 2015, approximately 2.5 years after the project commenced in September
    2012, causing delays in project execution.
  lesson_learnt: When engaging international subcontractors, circulate terms and conditions
    ahead of the planned exchange of contracts to iron out potential legal issues
