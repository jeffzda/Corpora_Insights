- record_id: ARENA-DLV-70608
  source_title: Integrated Solar Radiation Data Sources over Australia
  publish_date: 2015-08
  project_name: Integrated Solar Radiation Data Sources over Australia (ISRDSA)
  what_happened: Stakeholder workshops held at project start and midpoint revealed
    strong industry demand for more accurate solar resource assessment data, and feedback
    directly shaped the project's research programme — including the decision to acquire
    the longest available historical Bureau station data and set up a 34-year CCAM
    model run.
  lesson_learnt: Holding stakeholder workshops early in a solar data or resource assessment
    research project and using the feedback to reprioritise tasks improves relevance
    to industry needs; the investment in workshops that include government agencies,
    network operators and regulators pays dividends in research programme alignment
    and subsequent industry uptake.
