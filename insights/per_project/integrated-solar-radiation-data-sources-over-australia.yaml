- record_id: ARENA-DLV-70607
  source_title: Integrated Solar Radiation Data Sources over Australia
  publish_date: 2015-08
  project_name: Integrated Solar Radiation Data Sources over Australia (ISRDSA)
  what_happened: Satellite-derived solar radiation data was found to be more susceptible
    to temporal inconsistencies (due to reliance on a limited stream of satellite
    observations) than the CCAM atmospheric model, potentially introducing systematic
    errors into P90 interannual variability calculations used for project finance.
  lesson_learnt: For solar project P90 calculations, consider supplementing or replacing
    satellite-derived reference data with atmospheric model outputs such as CCAM,
    which are constrained by a broader set of observations and are less subject to
    calibration drift — particularly for inland Australian sites where CCAM performs
    comparably to satellite data.
  issue_severity: minor
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: concept/feasibility
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: The 34-year CCAM model run (1979–2012) was used as a long-term
    reference for P90 calculations, providing pre-satellite-era data (1979–1989) to
    better characterise interannual variability.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id007
  - 23
  evidence_excerpt: Crucially, the reference dataset needs to be consistent over time.
    Systematic changes or drifts in the reference data due to calibration or instrumentation
    can introduce large unspecified errors in the P90 estimates. As shown in the previous
