- record_id: ARENA-DLV-70606
  source_title: Integrated Solar Radiation Data Sources over Australia
  publish_date: 2015-08
  project_name: Integrated Solar Radiation Data Sources over Australia (ISRDSA)
  what_happened: Spatial interpolation of satellite bias-correction regression models
    over large distances (up to 700+ km between stations) produced RMSE improvements
    at most sites but increased absolute bias at one-third of locations, making the
    technique unreliable for solar resource estimation at sites far from ground stations.
  lesson_learnt: Satellite bias-correction methods calibrated to ground stations should
    not be applied operationally in regions far from the nearest measurement station
    — interpolating regression functions across different climate zones introduces
    bias risks that can undermine long-term mean resource estimates critical for project
    finance.
