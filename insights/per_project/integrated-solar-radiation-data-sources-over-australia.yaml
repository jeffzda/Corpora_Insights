- record_id: ARENA-DLV-70605
  source_title: Integrated Solar Radiation Data Sources over Australia
  publish_date: 2015-08
  project_name: Integrated Solar Radiation Data Sources over Australia (ISRDSA)
  what_happened: The project found that Australia's ground-based solar radiation monitoring
    network is sparse and often insufficient for solar project finance and due diligence,
    with the closest pair of Bureau stations approximately 300 km apart and three
    stations more than 700 km from the nearest other station.
  lesson_learnt: Solar project developers and financiers should account for the large
    gaps in Australia's ground monitoring network when planning resource assessment
    campaigns — satellite and model data alone may be insufficient for bankable P90
    estimates, and additional short-term on-site measurement campaigns strategically
    placed relative to existing stations can materially reduce resource uncertainty.
