  what_happened: Participation in IEA Task 46 and the European COST Action WIRE enabled
    the project team to benchmark their solar radiation tools against worldwide standards
    and access international expertise, which demonstrably improved the quality and
    international relevance of the research outputs.
  lesson_learnt: For solar resource assessment research projects, actively embedding
    the project team in relevant international working groups (such as IEA tasks)
    from the outset provides benchmarking opportunities and access to analogous work
    that would be difficult to replicate domestically, improving the calibre of outputs
    without proportional additional cost.
