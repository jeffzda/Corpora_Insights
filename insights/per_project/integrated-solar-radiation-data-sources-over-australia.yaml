  what_happened: The key barrier to realising the project's benefits at project completion
    was the lack of a sustainable delivery and dissemination mechanism for the solar
    radiation data; the project had to initiate discussions with the AREMI project
    to provide public access through an existing web portal rather than having a purpose-built
    data delivery channel.
  lesson_learnt: Research projects generating novel data products should plan the
    data delivery and dissemination pathway from the outset — identifying or establishing
    a sustainable public-access portal before project completion avoids the situation
    where valuable data assets remain inaccessible to industry and government after
    project close.
