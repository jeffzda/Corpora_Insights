- record_id: ARENA-DLV-72028
  source_title: Australian Energy Resource Assessment – Second edition, 2014
  publish_date: '2014'
  project_name: Derby Tidal Energy Project (Western Australia)
  what_happened: A proposed 5 MW tidal energy plant at Derby, Western Australia —
    one of the highest-tidal-range locations in Australia — was set aside after assessment
    found that high grid-connection costs and potential environmental impacts to sensitive
    wetlands made the project unviable despite the exceptional tidal resource.
  lesson_learnt: Exceptional tidal resource quality alone is insufficient to justify
    project development — grid connection costs and environmental sensitivity of tidal
    range sites (particularly macro-tidal estuaries with wetland habitats) must be
    assessed together with resource quality at the site screening stage, as these
    factors can independently render otherwise attractive sites unviable.
