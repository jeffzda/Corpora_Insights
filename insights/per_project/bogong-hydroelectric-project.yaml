- record_id: ARENA-DLV-72017
  source_title: Australian Energy Resource Assessment - Second edition, 2014
  publish_date: '2014'
  project_name: Bogong Hydroelectric Project
  what_happened: The Bogong hydroelectric project (140 MW power station, 6.9 km tunnel, headworks and 220 kV transmission line) commenced construction in 2006 and was commissioned in late 2009 at a total
    cost of approximately A$234 million, providing a reference-class cost benchmark of approximately A$1.67 million per MW for a new-build large hydro project with dedicated transmission infrastructure.
  lesson_learnt: For new-build hydroelectric projects requiring tunnelling and dedicated transmission, budget a reference-class capital cost of approximately A$1.67 million/MW (2009 dollars) based on the
    Bogong project — but note that building on an existing dam (as at Ord River, A$2.5 million/MW for 30 MW) can substantially increase per-MW cost at smaller scales, while Snowy-era large schemes achieved
    much lower per-MW costs over multi-decade programmes.
