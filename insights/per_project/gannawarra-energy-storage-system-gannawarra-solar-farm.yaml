- record_id: ARENA-DLV-57351
  source_title: 'The Generator Operations Series Report Six: Unlocking Curtailed Solar
    Energy on the NEM through Storage'
  publish_date: 2022-11
  project_name: Gannawarra Energy Storage System / Gannawarra Solar Farm
  what_happened: When the Gannawarra Energy Storage System was commissioned behind
    the same connection point as Gannawarra Solar Farm, the project developers found
    there was no formal regulatory pathway to guarantee curtailment mitigation — network
    constraints were applied at the individual generator level rather than the connection
    point, meaning the solar farm could not exceed a dispatch cap even if the co-located
    BESS was absorbing the excess energy.
  lesson_learnt: Before committing to a co-located solar-plus-storage project under
    the pre-IRP NER framework, developers must confirm whether aggregate conformance
    at the connection point is available — without it, the battery cannot absorb curtailed
    solar energy during binding network constraint events, eliminating a core revenue
    stream and undermining the project's business case.
  issue_severity: major
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: commissioning/integration
  proponent_type: project developer
