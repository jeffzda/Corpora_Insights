  evidence_excerpt: At the time when the Gannawarra Energy Storage System was commissioned
    behind the same connection point as Gannawarra Solar Farm, the project developers
    explicitly recognised that there was 'no formal pathway to guarantee curtailment
    mitigation'… this constraint would be applied at the generator level, rather than
    at the connection point, meaning that energy from the solar farm could not exceed
    the cap even if the BESS was absorbing all energy above the cap.
