- record_id: ARENA-DLV-64114
  source_title: Summary of ARENA Funded Hydrogen R&D Projects
  publish_date: 2023-04
  project_name: University of Melbourne – Hydrogen Fuelled Reciprocating Engines
  what_happened: The hydrogen engine project found that the ASTM octane rating method
    is not suitable for providing meaningful ratings for hydrogen-rich fuels in combustion
    engines, revealing a regulatory and standards gap that could impede commercialisation
    of hydrogen-fuelled engine technology.
  lesson_learnt: Projects developing hydrogen utilisation technologies should proactively
    engage with standards bodies to identify gaps in existing rating or testing methodologies
    — the absence of a suitable octane rating standard for hydrogen-rich fuels is
    a commercialisation barrier that requires industry-level resolution before market
    deployment.
