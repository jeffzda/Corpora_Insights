  project_name: Community Models for Deploying and Operating Distributed Energy Resources
  what_happened: DNSP ring-fencing rules under the NER prevented DNSP-owned community
    batteries from accessing contestable market services (energy and FCAS markets),
    limiting the revenue streams available to DNSP-owned assets and disincentivising
    DNSPs from investing in batteries over traditional network infrastructure.
  lesson_learnt: Project developers considering DNSP ownership models for community
    batteries must account for ring-fencing restrictions that prohibit DNSPs from
    accessing energy and FCAS markets — third-party leasing arrangements or regulatory
    waivers must be structured in advance to unlock full value stack.
