  what_happened: The analysis identified that virtual net metering was not modelled,
    meaning customers without solar PV could access cheaper battery energy ahead of
    solar PV owners who charged the battery — a fairness and gaming risk that would
    need to be resolved through virtual net metering protocols before commercial deployment.
  lesson_learnt: Community battery schemes allowing all customers to purchase from
    shared storage must implement virtual net metering to prevent gaming and ensure
    equitable access; project developers should resolve metering and attribution rules
    during design, not after deployment, to avoid customer disputes and revenue leakage.
