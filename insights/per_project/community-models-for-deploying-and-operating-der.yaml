    can provide — including fast frequency response, synthetic inertia, system strength,
    emissions reduction, and resilience — are not yet priced or rewarded in the NEM,
    limiting the financial viability of community battery business cases.
  lesson_learnt: Community battery business cases should not rely on unpriced services
    to reach financial viability — proponents should model conservative revenue scenarios
    based only on currently remunerated services, and engage with AEMC/ESB market
    design processes to advocate for future service payment mechanisms.
