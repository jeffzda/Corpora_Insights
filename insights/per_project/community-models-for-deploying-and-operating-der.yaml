  source_title: Implementing Community-Scale Batteries
  publish_date: 2020-12
  project_name: Community Models for Deploying and Operating DER
  what_happened: The research found that applying two-way network tariffs (charging
    both exports and imports for LUoS and DUOS) discourages batteries and customers
    from exporting upstream and improves network hosting capacity, while improving
    fairness by charging solar customers for using the network to generate revenue.
  lesson_learnt: Network tariff design for community batteries should move toward
    two-way (import and export) LUoS and DUOS charging — this simultaneously improves
    hosting capacity outcomes and distributes network cost recovery more equitably
    between solar and non-solar customers.
