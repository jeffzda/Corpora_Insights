- record_id: ARENA-DLV-65424
  source_title: Stakeholder Views on the Potential Role of Community Scale Storage
    in Australia
  publish_date: '2020'
  project_name: Community Models for Deploying and Operating Distributed Energy Resources
  what_happened: Network ownership models for community batteries offer advantages
    including lower cost of capital (via the Regulated Asset Base) and safety expertise,
    but participants noted that RAB-based financing creates risk for consumers because
    there is no mechanism to remove underutilised assets from the RAB, and networks
    may not optimise the battery with other customer-owned DER.
  lesson_learnt: When evaluating network ownership models for community batteries,
    project and policy designers must weigh lower cost of capital against the risk
    of consumer cost socialisation through the RAB and suboptimal DER aggregation
    — consumer advocate involvement in model design and regulatory oversight is needed
    to protect non-participating consumers.
