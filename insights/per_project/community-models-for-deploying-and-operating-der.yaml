  publish_date: 2020-12
  project_name: Community Models for Deploying and Operating Distributed Energy Resources
  what_happened: The project identified that proposed changes to network tariff structures
    — particularly localised pricing sub-regions via LUOS — risk creating new cross-subsidies
    between customer groups, potentially disadvantaging customers not participating
    in battery schemes, with insufficient research conducted on distributional impacts
    before implementation.
  lesson_learnt: Before implementing localised network tariff structures for community
    batteries, proponents and regulators must conduct customer segmentation analysis
    to verify that non-participating customers are not cross-subsidising participants
    — this equity analysis should be a formal gate in any DNSP tariff reform process.
