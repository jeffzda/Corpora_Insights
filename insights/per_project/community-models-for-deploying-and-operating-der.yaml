  source_title: Stakeholder Views on the Potential Role of Community Scale Storage
    in Australia
  publish_date: '2020'
  project_name: Community Models for Deploying and Operating Distributed Energy Resources
  what_happened: Community energy groups among project partners identified cost as
    the primary and essentially only barrier to their participation in community storage,
    with high capital costs of batteries and network charges (not regulatory or governance
    barriers) being the binding constraints for community-owned models.
  lesson_learnt: For community energy group-led battery projects, capital cost reduction
    and network charge reform are the primary enablers — grant and subsidy program
    design should specifically target these constraints rather than assuming governance
    or regulatory barriers are the primary hurdle for community proponents.
