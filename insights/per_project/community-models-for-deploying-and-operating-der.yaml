  what_happened: Participants noted that smart meters and a robust accounting system
    capable of tracking individual PV owners' contributions to a shared battery are
    technically and legally complex, because storage operators currently cannot credibly
    represent to customers that energy drawn from the battery at night is specifically
    their own solar generation — creating legal and commercial uncertainty around
    renewable claims.
  lesson_learnt: Community battery projects relying on a solar self-consumption narrative
    must resolve the metering and accounting challenge — project design should include
    smart metering infrastructure and legal review of renewable energy claims before
    marketing participation to PV owners, to avoid consumer protection and regulatory
    risk.
