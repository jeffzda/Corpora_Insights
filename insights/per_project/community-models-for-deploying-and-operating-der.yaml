  what_happened: The game-theory optimised tariff model (LEM3) maximised battery operator
    revenue and minimised customer energy costs, but resulted in local and remote
    grid prices that were almost identical, limiting its practical differentiation
    value compared to simpler LEM1/LEM2 approaches.
