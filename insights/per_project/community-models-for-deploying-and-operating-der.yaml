  what_happened: Indigenous community members in the Broome focus group had direct,
    hands-on experience maintaining solar and battery systems in remote communities
    and strongly preferred community battery models that provided local employment
    for maintenance, used simple and transparent governance, and were designed with
    community capacity and readiness in mind — including longer lead times and more
    support for communities with governance challenges.
  lesson_learnt: Community battery projects in remote and Indigenous community contexts
    must be designed to build local capacity for maintenance and governance, provide
    employment pathways for community members, and allow for longer lead times and
    greater support where community readiness is lower — these factors are not optional
    and should be costed into project design.
