  publish_date: 2020-12
  project_name: Community Models for Deploying and Operating DER
  what_happened: Modelling found that third-party owned community battery models are
    likely to be financially viable under current energy and FCAS market prices, but
    DNSP-owned models are not financially viable without either adding battery costs
    to the Revenue Asset Base (RAB) or leasing a significant proportion of the battery
    to a third party for market participation.
  lesson_learnt: DNSP-owned community battery projects should plan for a hybrid leasing
    arrangement — allocating a material share of battery capacity to a licensed third-party
    retailer for market participation — as pure network-service operation is unlikely
    to achieve financial viability without RAB treatment.
