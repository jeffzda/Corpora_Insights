- record_id: ARENA-DLV-43405
  source_title: Implementing Community-Scale Batteries
  publish_date: 2020-12
  project_name: Community Models for Deploying and Operating DER
  what_happened: Analysis of tariff structures found that Business-As-Usual (BAU)
    tariffs provide limited scope for tuning community battery operation toward local
    network or customer needs; under BAU, the battery pursues remote energy market
    arbitrage regardless of local network conditions, which can create new periods
    of large reverse power flows.
  lesson_learnt: Design community battery control strategies around differentiated
    local tariffs (LUoS) rather than BAU tariffs — BAU operation defaults to remote
    market arbitrage and can actively worsen local network conditions such as reverse
    power flows.
  issue_severity: moderate
  project_type: storage
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: Introduction of differentiated local energy transport tariffs
    (LEM1/LUoS) was found to effectively bias battery operation toward local charging
    and discharging priorities.
  transferability: moderate
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id041
  - 10
  evidence_excerpt: BAU tariffs provide limited scope for tuning the operation of
    the community-scale battery. This greatly restricts the impacts that the battery
    has on the servicing of local customer and network needs. Under financial operation
    the battery will pursue the arbitrage value in the remote energy tariff with no
    regard for local network or customers conditions. Such operation may have positive
    impacts... But it may also have negative impacts such as creating new periods
    of large reverse power flows.
