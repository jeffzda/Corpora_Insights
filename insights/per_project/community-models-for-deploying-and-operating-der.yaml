  what_happened: The research found that network charges are a major barrier to community-scale
    battery deployment because energy flows between customers and the battery are
    levied network charges twice — once when the battery imports energy and again
    when customers import energy from the battery.
  lesson_learnt: Community battery business cases must account for double network
    charging on energy flows as a structural cost barrier; proponents should engage
    with their DNSP early to understand whether a LUoS tariff or equivalent charge
    reduction can be negotiated or sought through regulatory channels before committing
    to a project structure.
