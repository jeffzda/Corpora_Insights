  publish_date: null
  project_name: Community Models for Deploying and Operating Distributed Energy Resources
    (Jacka ACT Case Study)
  what_happened: Analysis found that DNSP-owned community batteries are unlikely to
    be financially viable because networks are excluded from buying and selling energy
    in the NEM and FCAS markets, removing the two largest revenue streams available
    to third-party operators.
  lesson_learnt: Before pursuing a DNSP-owned community battery model in an NEM jurisdiction,
    confirm whether the network can access energy and FCAS market revenues — if not,
    financial viability will require either RAB treatment of battery costs or a leasing
    arrangement with a licensed retailer. The ownership model must be determined before
    business case development.
