  what_happened: Ring-fencing rules, which legally separate regulated network businesses
    from competitive retail activities, were raised by multiple participants as a
    barrier to network participation in community battery business models — preventing
    networks from earning arbitrage revenue. However, several participants also believed
    ring-fencing was more perceived than real, with conservative organisational culture
    being the larger barrier.
  lesson_learnt: Before treating ring-fencing as an insurmountable barrier, project
    teams should test what is actually permissible under current rules — participants
    noted that networks and retailers have not fully explored work-arounds within
    the existing framework, and conservative institutional culture may be the real
    constraint rather than formal regulation.
