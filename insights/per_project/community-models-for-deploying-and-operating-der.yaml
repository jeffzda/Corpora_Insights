- record_id: ARENA-DLV-49107
  source_title: 'Operating a Community-Scale Battery: Electricity Tariffs to Maximise
    Customer and Network Benefits'
  publish_date: '2019'
  project_name: Community Models for Deploying and Operating DER
  what_happened: Current Australian network rules (NER clause 6.1.4) explicitly prohibit
    charging distribution use-of-system (DUOS) fees on energy exports, meaning an
    in-front-of-the-meter community battery operator is charged network tariffs on
    both energy imported into and exported from the battery, but cannot pass export
    charges to solar generators. This creates a structural financial disincentive
    for the battery to charge from local solar.
  lesson_learnt: Community battery project developers should be aware that existing
    NER export charging rules constrain tariff design options and may require regulatory
    reform — specifically amendment of NER clause 6.1.4 — before full local energy
    model benefits can be realised.
