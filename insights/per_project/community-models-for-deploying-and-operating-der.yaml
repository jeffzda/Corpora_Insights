  publish_date: 2020-12
  project_name: Community Models for Deploying and Operating Distributed Energy Resources
  what_happened: The NEM market registration framework for battery storage was found
    to be unclear and ambiguous — community-scale batteries registered as Small Generation
    Aggregators (SGAs) could not provide FCAS, required two separate DUIDs creating
    inefficient bidding behaviour, and FCAS bids below 1MW were not permitted.
  lesson_learnt: Community battery projects planning to generate revenue from FCAS
    markets must either register separately as a Market Ancillary Services Provider
    or advocate for SGA framework expansion — project developers should map all required
    market registrations before finalising the business case, as the current framework
    imposes material constraints on small battery participants.
