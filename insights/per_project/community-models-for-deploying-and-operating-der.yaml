  what_happened: In the Jacka ACT case study, high rooftop solar PV penetration (every
    residence mandated to host 5kW) was projected to cause significant reverse power
    flows from LV to 11kV HV networks, creating voltage, thermal overload, harmonic,
    and load balancing challenges for the local DNSP (Evoenergy).
  lesson_learnt: New residential developments mandating high levels of rooftop solar
    PV should assess distribution network impacts early and include community battery
    or other storage solutions in their network planning, as grid upgrade costs may
    otherwise be required to manage reverse power flows at scale.
