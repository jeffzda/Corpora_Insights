  what_happened: Householders across all eight focus groups expressed strong distrust
    of large energy retailers and were unwilling to accept retailer-owned or operated
    community batteries, while simultaneously recognising that direct citizen ownership
    and operation presented practical governance challenges — leaving local councils,
    not-for-profit retailers and institutions such as nursing homes as the preferred
    ownership models.
