  source_title: Stakeholder Views on the Potential Role of Community Scale Storage
    in Australia
  publish_date: '2020'
  project_name: Community Models for Deploying and Operating Distributed Energy Resources
  what_happened: Energy sector professionals and householders identified that there
    is no single viable model for community batteries — the optimal model depends
    on local context including network constraints, community composition (solar vs
    non-solar owners), geography, community governance capacity, and the primary objectives
    of the battery — meaning no 'one size fits all' approach is workable.
  lesson_learnt: Program designers and project proponents should resist defaulting
    to a single community battery model — early project development should include
    a context assessment covering network constraints, community profile, governance
    capacity and primary battery objectives before selecting a business model, since
    model selection has direct implications for who benefits and what regulatory barriers
    apply.
