  what_happened: The study demonstrated that relatively small changes in price signals
    — such as removing the overnight off-peak rate or doubling the remote transport
    tariff — produced large changes in BESS operation, in one case causing reverse
    power flows of over 100 kW and in another suppressing reverse power flows to near
    zero.
