  publish_date: 2020-12
  project_name: Community Models for Deploying and Operating Distributed Energy Resources
  what_happened: The research found that FCAS bids under the NEM must be greater than
    1MW, and the fastest FCAS response window (4 seconds for regulation, 6 seconds
    for contingency) does not take full advantage of battery capabilities, meaning
    the speed and flexibility benefits of community-scale batteries are not fully
    valued or monetised.
  lesson_learnt: Community battery projects targeting FCAS revenue should verify that
    their battery capacity meets the 1MW minimum bid threshold and plan for the possibility
    that battery speed advantages will not be compensated under current market rules
    — advocacy for sub-1MW FCAS and faster response market products should be factored
    into long-term revenue planning.
