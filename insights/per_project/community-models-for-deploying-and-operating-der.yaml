- record_id: ARENA-DLV-17401
  source_title: 'Community Batteries: A Cost/Benefit Analysis'
  publish_date: null
  project_name: Community Models for Deploying and Operating Distributed Energy Resources
    (Jacka ACT Case Study)
  what_happened: Modelling of a community battery under standard DUoS pricing (business-as-usual
    energy transport costs) showed the battery was barely utilised — only responding
    to a few price spikes — because the energy transport cost is double-charged (once
    to charge and once to discharge the battery), creating a strong financial disincentive
    for local energy exchange.
  lesson_learnt: Under current NEM rules with standard DUoS pricing, community batteries
    cannot be financially motivated to perform local solar energy time-shifting; a
    reduced local energy transport cost (Local Use of Service, LUoS) is a prerequisite
    for viable community battery operation. Project developers should model transport
    cost structures before assuming community battery use cases are economically feasible.
  issue_severity: major
