    separates the agents responsible for delivering market and non-market services,
    making it operationally complex for a single community battery to simultaneously
    serve both a retailer (for energy market services) and a DNSP (for network support
    services) under service contracts.
  lesson_learnt: Community battery operators should design service contracts and control
    systems to explicitly manage the priority ordering and conflict resolution between
    DNSP network service obligations and retailer market service instructions — the
    current regulatory separation of these roles means this governance structure must
    be established contractually before commissioning.
