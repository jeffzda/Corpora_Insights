  project_name: Community Models for Deploying and Operating Distributed Energy Resources
    (Jacka ACT Case Study)
  what_happened: The analysis found that FCAS market revenues represent a large component
    of estimated community battery revenue, but FCAS prices in 2018 may not persist
    — with an AECOM/ARENA report projecting FCAS prices could fall to 10% of 2018
    values by 2040, which would significantly erode projected business case viability.
  lesson_learnt: Community battery business cases that rely heavily on FCAS revenue
    are exposed to significant market risk as storage capacity increases on the NEM;
    project developers should stress-test their financial models against declining
    FCAS prices and avoid over-reliance on this revenue stream for long-term viability.
