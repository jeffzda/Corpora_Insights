- record_id: ARENA-DLV-65421
  source_title: Stakeholder Views on the Potential Role of Community Scale Storage
    in Australia
  publish_date: '2020'
  project_name: Community Models for Deploying and Operating Distributed Energy Resources
  what_happened: Multiple participants and project partner network organisations noted
    that policy uncertainty at the federal level — including uncertainty over wholesale
    market design, retailer reliability obligations and ancillary services market
    structure — was deterring incumbents from investing in community storage because
    the rate of return could not be forecast with confidence.
  lesson_learnt: Community battery projects that depend on incumbent network or retailer
    investment are unlikely to proceed without greater policy certainty on market
    design — project developers should target contexts where the investment case is
    driven by local network constraints or local government carbon targets, which
    are less exposed to federal policy uncertainty, rather than building business
    cases that depend on uncertain wholesale market revenues.
