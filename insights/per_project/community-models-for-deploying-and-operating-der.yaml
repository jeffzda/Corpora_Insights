- record_id: ARENA-DLV-49102
  source_title: 'Operating a Community-Scale Battery: Electricity Tariffs to Maximise
    Customer and Network Benefits'
  publish_date: '2019'
  project_name: Community Models for Deploying and Operating DER
  what_happened: When the community-scale BESS was operated under BAU tariffs and
    discharged based on remote arbitrage signals, it created new periods of large
    reverse power flows out of the local network when local demand was low — a perverse
    network outcome not present without the battery.
  lesson_learnt: A community-scale BESS operated purely on financial/arbitrage signals
    under BAU tariffs can worsen network conditions by creating reverse power flows;
    operators and network businesses should not assume a community battery improves
    network performance without appropriate tariff design.
