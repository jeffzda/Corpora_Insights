  publish_date: '2019'
  project_name: Community Models for Deploying and Operating DER
  what_happened: The study found that setting import and export local energy prices
    asymmetrically (i.e. not equal) would allow a BESS to generate revenue by continuously
    cycling — charging and discharging in the same tariff period — without providing
    genuine energy or network value, a perverse incentive created by tariff design.
  lesson_learnt: Local energy tariff frameworks for community batteries must enforce
    symmetric import and export prices to avoid perverse incentives for continuous
    battery cycling that generates operator revenue without customer or network benefit;
    this constraint should be embedded in any Local Energy Model design.
