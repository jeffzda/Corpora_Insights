  project_name: Community Models for Deploying and Operating Distributed Energy Resources
  what_happened: The project identified that community battery feasibility is widely
    considered to hinge on the ability to stack multiple services simultaneously,
    but that no established regulatory or technical framework existed in the NEM to
    support and reward multi-service operation for community-scale assets.
  lesson_learnt: Community battery project developers must design for value-stacking
    from the outset — no single revenue stream is likely to be sufficient, and the
    technical control system, market registrations, and DNSP service contracts must
    all be aligned to enable simultaneous delivery of energy arbitrage, FCAS, and
    network support services.
