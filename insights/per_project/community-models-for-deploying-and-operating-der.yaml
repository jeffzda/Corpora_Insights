  what_happened: Participants noted that community batteries installed in Greenfield
    sites (new developments) would be substantially easier to implement than retrofitting
    storage into existing infrastructure, with several also identifying institutional
    settings such as retirement villages, hospitals and schools as particularly suitable
    deployment contexts.
