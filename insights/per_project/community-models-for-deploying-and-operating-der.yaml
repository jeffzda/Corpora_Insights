- record_id: ARENA-DLV-49111
  source_title: 'Operating a Community-Scale Battery: Electricity Tariffs to Maximise
    Customer and Network Benefits'
  publish_date: '2019'
  project_name: Community Models for Deploying and Operating DER
  what_happened: The LEM2 model — which reduced both local energy and transport tariffs
    — produced the same energy flow outcomes as LEM1 (reduced transport tariffs only)
    but with higher BESS operator revenue for capacities above 200 kWh. However, the
    additional degree of freedom from setting local energy tariffs was found to be
    of limited practical use under the constraints imposed for fairness and to avoid
    perverse incentives.
  lesson_learnt: Adding local energy price differentiation on top of local transport
    tariff reductions (LEM2 vs LEM1) adds complexity without proportionate benefit
    under standard fairness constraints; community battery tariff designers should
    start with transport tariff differentiation alone before attempting co-optimisation
    of energy and transport tariffs.
