  what_happened: The modelling identified that several network services provided by
    community batteries — including backup power, network upgrade deferral, congestion
    relief, and resource adequacy — cannot currently be monetised, even though stakeholder
    research confirmed these are among the most valued benefits for householders and
    networks.
  lesson_learnt: Community battery business cases will be incomplete and understate
    true value until payment mechanisms for non-market network services (backup power,
    network upgrade deferral, congestion relief, resource adequacy) are established
    with DNSPs; project developers and policymakers should prioritise developing contractual
    frameworks for these services to unlock the full value stack.
