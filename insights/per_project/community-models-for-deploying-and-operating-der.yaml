  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Modelling adopted a discounted local energy transport cost (LUoS
    at $0.00/kWh) for all subsequent calculations, noting that regulatory sandboxing
    arrangements may allow networks to flexibly permit discounted DUoS in the interim.
  transferability: broad
  delay_magnitude: null
  technology_domain: battery storage
