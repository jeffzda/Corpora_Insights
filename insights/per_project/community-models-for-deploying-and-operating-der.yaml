- record_id: ARENA-DLV-49101
  source_title: 'Operating a Community-Scale Battery: Electricity Tariffs to Maximise
    Customer and Network Benefits'
  publish_date: '2019'
  project_name: Community Models for Deploying and Operating DER
  what_happened: Under business-as-usual (BAU) tariffs, a community-scale BESS did
    not charge from locally generated solar energy. Instead, it pursued remote grid
    arbitrage — charging during off-peak periods and discharging during peak tariff
    periods — with no regard for local network or customer conditions.
  lesson_learnt: BAU tariffs structurally disincentivise community-scale BESS from
    charging local solar energy; operators designing community battery business models
    must account for this tariff misalignment and advocate for or implement differentiated
    local tariffs to realise local energy benefits.
