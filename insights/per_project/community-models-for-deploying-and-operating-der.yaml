  source_title: Stakeholder Views on the Potential Role of Community Scale Storage
    in Australia
  publish_date: '2020'
  project_name: Community Models for Deploying and Operating Distributed Energy Resources
  what_happened: Network participants identified that the double-charging of Distribution
    Use of System (DUOS) charges each time a community battery is used — because DUOS
    was designed for consumers not generator/storage devices — creates a significant
    barrier to the economic viability of community storage models.
  lesson_learnt: Community battery business models must account for double DUOS charging
    under current tariff structures; proponents should explicitly model this cost
    and engage with regulators and networks about tariff reform as part of project
    development, since without resolution this barrier limits community batteries
    to niche deployments.
