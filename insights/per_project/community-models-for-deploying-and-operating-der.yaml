  publish_date: '2020'
  project_name: Community Models for Deploying and Operating Distributed Energy Resources
  what_happened: Energy sector professionals and householders identified that the
    current Australian regulatory framework does not support community-scale storage
    well, because storage assets seeking to access multiple value streams (network,
    retail, wholesale) cross the artificial boundaries between regulated and competitive
    market segments, creating compounding barriers to viability.
  lesson_learnt: Regulatory reform enabling storage to access value streams across
    network, retail and wholesale segments is a prerequisite for community battery
    viability — project proponents should map applicable regulatory barriers before
    committing to a business model, and engage regulators early to clarify what is
    permissible within existing rules versus what requires rule changes.
