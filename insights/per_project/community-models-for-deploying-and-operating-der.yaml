  what_happened: Modelling confirmed that third-party owned community battery models
    are financially viable under current energy and FCAS market prices, with the community
    (not-for-profit) model generating the highest customer savings while still allowing
    the battery owner to earn comparable revenue to the for-profit model from energy
    arbitrage and FCAS.
