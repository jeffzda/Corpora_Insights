  what_happened: Energy sector professionals and project partners identified that
    community battery economics do not currently stack up in front-of-meter settings,
    with network charges plus battery costs being the primary financial barriers,
    and that batteries generally need to be aggregated to at least 1 MW to participate
    in the FCAS market and access that component of the value stack.
