  project_name: Community Models for Deploying and Operating DER
  what_happened: A community-scale BESS (modelled as a shared in-front-of-the-meter
    asset) demonstrated substantially greater network hosting capacity for rooftop
    solar PV compared to an equivalent total capacity of behind-the-meter residential
    batteries. Peak export power was reduced to near zero until installed solar capacity
    reached approximately 275 kW, versus a ~50 kW reduction with BTM batteries regardless
    of solar capacity.
  lesson_learnt: Community-scale BESS outperforms equivalent distributed BTM battery
    capacity at managing solar export peaks because it can direct its entire capacity
    to the worst aggregate peaks; network planners should factor this hosting capacity
    advantage into assessments of community battery projects versus residential battery
    programs.
