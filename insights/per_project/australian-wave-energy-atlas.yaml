- record_id: ARENA-DLV-64957
  source_title: The Australian Wave Energy Atlas Project Overview and Final Report
  publish_date: 2018-02
  project_name: Australian Wave Energy Atlas (AWavEA)
  what_happened: Early field deployments recorded a consistently larger wave height
    on the north side of the WEC array compared to the south side. The team could
    not initially determine whether this was an instrumental bias or natural variability.
  lesson_learnt: Include an instrument-swapping protocol between deployments in field
    experimental designs to rule out positional instrument bias — without swapping
    positions, distinguishing instrumental bias from genuine spatial variability in
    the wave field is impossible.
  issue_severity: minor
