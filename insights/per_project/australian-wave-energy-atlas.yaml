  what_happened: The wave resource assessment lacked in-situ directional wave observations
    for a large portion of the southern Australian coastline (between Esperance, WA
    and Eden, NSW) — the region identified as having an internationally attractive
    wave energy resource — forcing complete reliance on model output for directional
    characterisation in this region.
  lesson_learnt: Prioritise establishing in-situ directional wave observation networks
    in high-value resource regions before or alongside resource assessments — gaps
    in observational coverage in the most prospective areas force reliance on unvalidated
    model output for directionally dependent device siting.
