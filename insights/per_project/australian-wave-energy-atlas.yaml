  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: The array of five CSIRO Nortek AWACs was re-arranged to cover
    all strategic locations, minimising uncertainty from instrument type variation.
  transferability: narrow
  delay_magnitude: null
  technology_domain: other
  source_pages: &id005
