  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Instrument positions were swapped between deployments; results
    confirmed no instrumental bias, attributing the observed asymmetry to natural
    wave field variability.
  transferability: narrow
  delay_magnitude: not quantified
  technology_domain: other
  source_pages: &id007
