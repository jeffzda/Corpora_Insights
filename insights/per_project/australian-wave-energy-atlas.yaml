- record_id: ARENA-DLV-64955
  source_title: The Australian Wave Energy Atlas Project Overview and Final Report
  publish_date: 2018-02
  project_name: Australian Wave Energy Atlas (AWavEA)
  what_happened: The field program used a mix of RDI ADCP and Nortek AWAC instruments,
    which introduced variability in the wave field measurements due to the different
    processing methods for each instrument type.
  lesson_learnt: Standardise instrument types within a field measurement array for
    wave energy studies — mixing instrument types with different processing methods
    introduces measurement variability that complicates attribution of observed effects
    to the phenomena under study.
  issue_severity: moderate
