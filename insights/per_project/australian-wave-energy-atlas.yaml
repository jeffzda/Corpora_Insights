  evidence_excerpt: Having a mix of RDI ADCPs and Nortek AWAC ADCPs added some variability
    due to the different processing methods for each instrument type. To address this
    problem, the array of five CSIRO Nortek AWACs were re-arranged to cover all strategic
    locations with an aim to minimise the uncertainty introduced by variations in
