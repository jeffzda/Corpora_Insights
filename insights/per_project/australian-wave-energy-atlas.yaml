  what_happened: Prior to the AWavEA project, the absence of credible, independent,
    and industry-neutral wave resource data was identified as a key limitation constraining
    growth of Australia's wave energy industry. Existing resource assessments did
    not adequately capture the spatial distribution of Australia's resource.
