- record_id: ARENA-DLV-64958
  source_title: The Australian Wave Energy Atlas Project Overview and Final Report
  publish_date: 2018-02
  project_name: Australian Wave Energy Atlas (AWavEA)
  what_happened: Numerical simulations of the Garden Island field study using the
    SNL-SWAN model and the industry-supplied power matrix for the CETO-5 WEC did not
    adequately reproduce observed changes in the wave spectrum; the industry-supplied
    power matrix is based on bulk statistics suited for operational performance, not
    spectral wave modelling.
  lesson_learnt: Do not use an industry-supplied bulk-statistics power matrix directly
    in spectral wave models for environmental impact assessment — develop an observation-based
    power matrix instead, as the bulk matrix misrepresents discrete-frequency wave
    shoaling processes and mid- to far-field WEC impacts.
  issue_severity: moderate
  project_type: enabling infrastructure
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: data & measurement
  intervention_note: An observation-based power matrix was created and substituted
    for the industry-supplied matrix; simulations using it more closely matched observed
    wave spectrum changes, at least in the wind-sea band.
