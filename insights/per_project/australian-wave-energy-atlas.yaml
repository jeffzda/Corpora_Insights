- record_id: ARENA-DLV-64954
  source_title: The Australian Wave Energy Atlas Project Overview and Final Report
  publish_date: 2018-02
  project_name: Australian Wave Energy Atlas (AWavEA)
  what_happened: During field deployments at Garden Island, acoustic Doppler current
    profilers (AWACs) were mounted on gimbals to keep them vertical on uneven seabed.
    After the first recovery it was discovered that the gimbals caused the instruments
    to continuously tilt with the current, rendering the directional spectra erroneous.
  lesson_learnt: Do not use gimbals when mounting AWACs on seafloor frames for wave
    directional data collection — gimbals cause continuous instrument tilt with current
    flow, corrupting directional spectra. Cable-tie or rigidly fix the instrument
    instead.
  issue_severity: moderate
  project_type: enabling infrastructure
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: research organisation/university
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: data & measurement
  intervention_note: Gimbals were cable-tied in later deployments to fix instrument
    orientation, resolving the directional spectra errors.
  transferability: narrow
  delay_magnitude: not quantified
  technology_domain: other
  source_pages: &id004
  - 18
  evidence_excerpt: The AWACs were mounted on gimbals on their frames (Figure 6),
    to allow them to remain vertical, even if the frame was not flat on the bottom.
    It became clear after the first recovery that the gimbals caused the instrument
    to tilt continuously following the current causing the directional spectra to
    be erroneous. This was corrected in later deployments by cable-tying the gimbals.
    In any future construction of frames for AWACs for data collection, we recommend
    avoiding the use of gimbals.
