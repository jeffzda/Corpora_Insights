  project_name: Australian Wave Energy Atlas (AWavEA)
  what_happened: An extra field deployment was required to understand natural variability
    across the Garden Island site and distinguish it from WEC effects. This additional
    deployment was not in the original plan, was conducted after WEC recovery, and
    took place in a different season, limiting direct comparability.
  lesson_learnt: Build control deployments into the original experimental design for
    WEC field studies — at minimum, include one deployment to measure natural variability
    with WECs operating and one with WECs not operating; retrofitting these after
    recovery limits temporal and seasonal comparability.
