  source_title: The Australian Wave Energy Atlas Project Overview and Final Report
  publish_date: 2018-02
  project_name: Australian Wave Energy Atlas (AWavEA)
  what_happened: The AWavEA portal was required to manage a very large spatial dataset
    (>20 TB) with fast user-facing query times, while publishing data through NationalMap
    infrastructure that has no single controlling authority. A novel metadata-catalogue-driven
    approach was developed to meet these requirements.
  lesson_learnt: For scientific data portals serving large datasets (>20 TB) through
    shared infrastructure, a metadata-catalogue approach that fully describes data
    and analysis operations at request time — rather than pre-caching — can deliver
    sub-10-second query responses and ensure data currency without duplication.
