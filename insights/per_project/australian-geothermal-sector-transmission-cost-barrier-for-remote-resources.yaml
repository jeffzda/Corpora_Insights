- record_id: ARENA-DLV-14964
  source_title: 'Looking Forward: Barriers, Risks and Rewards of the Australian Geothermal
    Sector to 2020 and 2030'
  publish_date: 2014-06
  project_name: Australian Geothermal Sector – Transmission Cost Barrier for Remote
    Resources
  what_happened: Geothermal resources in locations such as the Cooper Basin face additional
    capital costs for transmission connection to the grid, estimated at $23–$148/MWh
    depending on plant scale, adding materially to an already uncompetitive LCOE and
    making grid-connected utility-scale geothermal power commercially impossible without
    very large subsidies.
  lesson_learnt: Remote geothermal projects targeting grid electricity markets must
    include realistic transmission cost estimates in LCOE calculations — for a 50
    MW plant in the Cooper Basin these costs alone exceed $77/MWh, which combined
    with generation LCOE of $170–$300/MWh makes the combined cost 3–4× the wholesale
    electricity price; off-grid or direct-heat applications should be prioritised
    where transmission costs cannot be justified.
