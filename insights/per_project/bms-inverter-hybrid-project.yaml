- record_id: ARENA-DLV-69105
  source_title: BMS-Inverter Hybrid Project Public Report
  publish_date: 2020-03
  project_name: Relectrify BMS+Inverter Project
  what_happened: Prior to volume commercial deployment, Relectrify identified that
    its BMS+Inverter technology requires formal certification, and discussions with
    a leading global certifications organisation revealed minor design aspects that
    need adjustment to ease the certification process; timing of certification has
    not yet been resolved.
  lesson_learnt: Engage a certification body early in the technology development cycle
    — identifying required design adjustments only during pre-commercialisation discussions
    can delay market entry; certification requirements should be integrated into product
    design from the outset rather than treated as a late-stage step.
  issue_severity: minor
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: approvals/contracting
  proponent_type: technology vendor
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: poor scoping
  intervention_note: Engaged a leading global certifications organisation to identify
    design adjustments needed; Relectrify is considering optimal timing to obtain
    certifications within its project pipeline prioritisation.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id005
  - 5
  evidence_excerpt: In-depth discussions with a leading global certifications organisation
    have helped to highlight minor aspects of Relectrify's BMS+Inverter design that
    may need to be adjusted to ease the certification process. Relectrify is presently
    considering the optimal time to obtain certain certifications, which will need
    to be incorporated into the prioritisation of Relectrify's rapidly growing project
    pipeline.
  confidence_note: null
