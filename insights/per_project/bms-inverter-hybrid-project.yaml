- record_id: ARENA-DLV-69104
  source_title: BMS-Inverter Hybrid Project Public Report
  publish_date: 2020-03
  project_name: Relectrify BMS+Inverter Project
  what_happened: Relectrify's BMS+Inverter technology successfully demonstrated single-
    and three-phase prototype systems using second-life Nissan Leaf battery modules,
    achieving efficiency in line with market-leading new battery products and harmonic
    distortion well below the 5% grid compliance threshold.
  lesson_learnt: Combining BMS and inverter functions into a single power electronics
    architecture can achieve grid-compliant performance with second-life batteries
    at the demonstration scale — this approach is viable for progression to commercial
    pilots and warrants certification planning early in the commercialisation pathway.
  issue_severity: none
