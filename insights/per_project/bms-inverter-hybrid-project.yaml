- record_id: ARENA-DLV-69102
  source_title: BMS-Inverter Hybrid Project Public Report
  publish_date: 2020-03
  project_name: Relectrify BMS+Inverter Project
  what_happened: When a full enclosure was used, internal temperature rose above the
    optimal range after several days of operation because acrylic panels chosen for
    display purposes were less thermally conductive than steel, undermining the passive
    cooling design.
  lesson_learnt: Material selection for enclosure panels must account for thermal
    conductivity — substituting steel with acrylic for aesthetic reasons negated the
    passive cooling design and required a full enclosure redesign with active fan
    cooling.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: technology vendor
  delay_category: commissioning/integration
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Redesigned the enclosure to improve cooling and added fans with
    active control to ensure cells operate within the optimal thermal range.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id002
  - 6
  evidence_excerpt: Temperature rose above the optimal range with a full enclosure
    after several days. We used acrylic panels instead of steel ones for better display.
    However, it was less thermally conductive and prevented the effectiveness of the
    passive cooling design. We redesigned the enclosure to improve cooling and added
    fans with active control to make sure that the cells will always run within the
    optimal condition.
  confidence_note: null
