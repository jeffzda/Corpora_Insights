- record_id: ARENA-DLV-69103
  source_title: BMS-Inverter Hybrid Project Public Report
  publish_date: 2020-03
  project_name: Relectrify BMS+Inverter Project
  what_happened: Air freight costs for deploying BMS+Inverter hardware internationally
    proved expensive, and customs and lead-time complications added friction to early
    deployments.
  lesson_learnt: Plan deployments well in advance using a mature, stable product to
    enable sea freight and/or in-country manufacturing — air freight for hardware-intensive
    energy technology is costly, slow to scale, and introduces customs complications
    that erode commercial viability.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: procurement/supply chain
  failure_mode: execution & logistics
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Identified need to establish a contract manufacturer in target
    deployment countries and to investigate sea freight logistics including packaging
    and lead-times.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id003
  - 6
  evidence_excerpt: Air freight costs are expensive. Future deployments should ideally
    be planned well in advance (with mature/stable product) to be able to use sea
    freight and/or manufacture in-country to avoid these costs/delays/customs etc.
  confidence_note: null
