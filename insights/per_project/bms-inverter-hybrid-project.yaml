  publish_date: 2020-03
  project_name: Relectrify BMS+Inverter Project
  what_happened: BMS+Inverter printed circuit boards were damaged in transit to a
    customer during deployment, requiring redesign of the PCB and improvements to
    packing methods.
  lesson_learnt: Identify structural pressure points in PCB design before deployment
    and improve packaging to withstand transit loads — damage discovered after shipment
    requires rework and delays follow-on deployment.
