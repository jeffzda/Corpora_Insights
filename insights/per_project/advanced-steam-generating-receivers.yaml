  what_happened: The project attracted unexpected interest from regional Australian
    small and medium enterprises seeking low-cost steam generation alternatives as
    fuel costs escalated, demonstrating an unanticipated commercial demand pathway
    for small solar trough concentrator systems beyond the original utility-scale
    CSP focus.
