- record_id: ARENA-DLV-56053
  source_title: Design and Operation of Pilot Scale Solar Supercritical Systems
  publish_date: '2014-07-29'
  project_name: Advanced Steam Generating Receivers for High-Concentration Solar Collectors
  what_happened: Modelling and experimental work showed that geothermal sources are
    unsuitable for hybridisation with solar thermal tower superheater systems targeting
    conditions comparable to fossil-fuelled power stations, because the maximum saturated
    steam pressure achievable from geothermal is limited to approximately 2–2.5 MPa.
  lesson_learnt: Do not design solar-geothermal hybrid steam systems targeting fossil-fuel-equivalent
    turbine conditions — geothermal steam pressure is limited to approximately 2–2.5
    MPa, making it non-optimal when coupled with a solar thermal tower superheater;
    organic Rankine or mixed fluid cycles remain the appropriate application for geothermal
    heat sources.
  issue_severity: moderate
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Modelling pivoted to examine solar-solar hybrid configurations
    (e.g. trough or linear Fresnel coupled with tower superheater), which showed more
    promise with estimated LCOE values of 20–25c/kWh.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar thermal
  source_pages:
  - 5
  evidence_excerpt: Outcomes from this work showed that geothermal sources were unsuitable
    for use in a steam power system designed to operate at the temperatures and pressure
    comparable to traditional fossil fuelled power stations. The maximum pressure
    of saturated steam able to be generated was limited to approximately 2-2.5MPa,
    resulting in a non-optimal system when connected to a solar thermal tower system
    with a superheater.
