- record_id: ARENA-DLV-56057
  source_title: Design and Operation of Pilot Scale Solar Supercritical Systems
  publish_date: '2014-07-29'
  project_name: Advanced Steam Generating Receivers for High-Concentration Solar Collectors
  what_happened: The CSIRO heliostat control system — using small heliostats capable
    of fine-grained adjustment of solar flux pattern on the receiver — was identified
    as the pivotal enabling technology that allowed the experimental system to operate
    safely at supercritical conditions and run close to material design limits.
  lesson_learnt: High-precision flux control is a prerequisite for CSP receiver systems
    targeting supercritical steam conditions; projects that rely on conventional large-heliostat
    fields with coarser flux control should not assume they can replicate supercritical
    operating conditions without comparable control capability.
  issue_severity: none
  project_type: generation
