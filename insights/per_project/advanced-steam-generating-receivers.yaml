  source_title: Generating Receivers for High-Concentration Solar Collector
  publish_date: '2014-07-29'
  project_name: Advanced Steam Generating Receivers for High-Concentration Solar Collectors
  what_happened: The project successfully demonstrated subcritical and supercritical
    steam generation using concentrating solar thermal technology at world-record
    conditions (23MPa, 570°C), proving that once-through boiler designs are suitable
    for solar thermal receivers operating across a wide range of conditions.
  lesson_learnt: Once-through boiler designs combined with fine-resolution heliostat
    control systems enable solar thermal receivers to achieve steam conditions comparable
    to state-of-the-art fossil-fuelled power stations — eliminating the steam drum
    and enabling real-time adjustment of heat flux is critical to reaching supercritical
    operating conditions.
