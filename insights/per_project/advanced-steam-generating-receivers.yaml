- record_id: ARENA-DLV-24706
  source_title: Generating Receivers for High-Concentration Solar Collector
  publish_date: '2014-07-29'
  project_name: Advanced Steam Generating Receivers for High-Concentration Solar Collectors
  what_happened: The project demonstrated that moving CSP operation to higher steam
    temperatures and pressures (supercritical conditions) can boost electricity output
    by 20–30% for the same solar collector capital investment, substantially reducing
    LCOE compared to then-current commercial CSP plants operating below 30% thermal
    efficiency.
  lesson_learnt: Future CSP project business cases should be modelled against supercritical
    steam cycles rather than the subcritical baseline used by all commercial plants
    at the time — the 20–30% electricity output uplift from supercritical operation
    translates directly to lower LCOE for the same collector capital cost, improving
    project economics materially.
  issue_severity: none
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: concept/feasibility
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar thermal
  source_pages:
  - 3
  - 6
  evidence_excerpt: Typical subcritical power stations have thermal efficiencies of
    approximately 35%, while supercritical power cycles can have thermal efficiencies
    above 40%. This means that if a concentrating solar thermal power station could
    operate with supercritical steam the electricity output could be boosted by 20-30%,
    providing a substantial increase in sellable electricity for the same capital
    investment, resulting in a significant reduction in Levelised Cost of Energy (LCOE).
