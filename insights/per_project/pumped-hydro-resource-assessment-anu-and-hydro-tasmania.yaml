- record_id: ARENA-DLV-25920
  source_title: Review of ARENA's Reliability Portfolio
  publish_date: 2020-01
  project_name: Pumped Hydro Resource Assessment (ANU and Hydro Tasmania)
  what_happened: The ANU Australia-wide pumped hydro atlas and Hydro Tasmania's Tasmanian concept study collectively identified approximately 2,000 potential pumped hydro sites in Tasmania. These resource
    assessments were completed at 100% of milestones but were assessed as providing limited technical, social or economic analysis of identified sites, reducing their direct contribution to project development.
  lesson_learnt: High-level resource atlases for pumped hydro have limited standalone delivery value unless accompanied by site-specific social, environmental and technical feasibility analysis; ARENA should
    structure resource assessment grants to include a pathway to site-level analysis for the highest-priority identified sites.
