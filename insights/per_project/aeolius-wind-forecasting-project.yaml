  publish_date: 2019-10
  project_name: Aeolius Wind Systems Wind Forecasting Demonstration Project
  what_happened: The project found that turbine wake behaviour under unstable atmospheric
    conditions at Macarthur was not fully characterised, as such conditions amplify
    the downstream reach of wakes and cause greater-than-expected reductions in power
    output. High-frequency sensors required for this investigation were not available
    within the current project scope.
  lesson_learnt: Plan for high-frequency atmospheric sensors when deploying lidar
    at windfarms where unstable boundary layer conditions are likely — without them,
    wake behaviour under conditions that most strongly degrade power output cannot
    be quantified, leaving a significant knowledge gap for forecasting model development.
