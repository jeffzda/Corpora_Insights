- record_id: ARENA-DLV-28706
  source_title: Aeolius Wind Systems Wind Forecasting Demonstration Project Lessons
    Learnt 1
  publish_date: 2019-10
  project_name: Aeolius Wind Systems Wind Forecasting Demonstration Project
  what_happened: The project identified that current industry-standard computer-based
    wake models used in wind energy resource assessment are unreliable due to difficulty
    in modelling complex meteorological and topographical processes, leading to inaccurate
    turbine micro-siting and maintenance cost overruns at greenfield developments.
  lesson_learnt: Do not rely solely on licensed third-party wake models for turbine
    micro-siting decisions at greenfield sites — these models are notoriously unreliable;
    supplement with lidar-based field characterisation where possible to reduce the
    risk of incorrect turbine positioning and consequent maintenance cost overruns.
