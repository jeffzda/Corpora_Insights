- record_id: ARENA-DLV-58051
  source_title: 'Aeolius Wind Systems Wind Forecasting Demonstration Project Lessons
    Learnt Report #4'
  publish_date: '2024'
  project_name: Aeolius Wind Systems Wind Forecasting Demonstration Project
  what_happened: Construction of two purpose-built Doppler lidar systems in the USA
    was significantly delayed due to COVID-19 supply chain disruptions, including
    long delays sourcing critical electro-optical components from US aerospace and
    defence sector manufacturers, restricted access to advanced laboratory facilities,
    and the unplanned retirement of a senior software engineer due to ill health.
  lesson_learnt: Manufacturers of high-tech systems should not rely on just-in-time
    delivery for essential components — sourcing from multiple suppliers and maintaining
    an in-house inventory reduces vulnerability to supply chain disruption. Over-reliance
    on specialised facilities or third-party expertise for construction of bespoke
    instruments is a high risk that should be addressed through a formal risk management
    strategy.
