- record_id: ARENA-DLV-26255
  source_title: Aeolius Wind Systems Wind Forecasting Demonstration Project Lessons
    Learnt 2
  publish_date: 2020-04
  project_name: Aeolius Wind Systems Wind Forecasting Demonstration Project
  what_happened: Measurement range of the short-range scanning Doppler lidar at Warradarge
    fluctuated significantly over the 24-hour diurnal cycle, attributed to changes
    in aerosol concentration levels, creating unpredictable gaps in upstream wind
    field observation capability.
  lesson_learnt: Aerosol-driven diurnal variability in lidar measurement range must
    be characterised at a candidate site before committing to lidar-based forecasting
    deployment; sites with high daytime atmospheric turbulence or variable aerosol
    loading may require higher-powered instruments or hybrid approaches to maintain
    forecast continuity.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Further investigations were initiated to better understand the
    aerosol concentration challenge, and multiple measurement strategies were planned
    for the next trial stage to address lidar range limitations.
  transferability: moderate
  delay_magnitude: null
  technology_domain: wind
  source_pages: &id001
  - 3
  evidence_excerpt: Measurement range was observed to fluctuate significantly over
    the 24-hr diurnal cycle at the Warradarge site, presumably as a result of changes
    in aerosol concentration levels. This has implications to the deployment of this
    class of scanning lidar in short-range forecasting applications under the environmental
    conditions experienced on site.
