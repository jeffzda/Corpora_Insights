  source_title: Aeolius Wind Forecasting Demonstration Project - Lessons Learnt Report
    4a
  publish_date: 2025-02
  project_name: Aeolius Wind Systems Wind Forecasting Demonstration Project
  what_happened: Power supply to one of the scanning LiDARs at Macarthur Wind Farm
    was provided via a cable to a 240V outlet in a nearby wind turbine. Wind farm
    maintenance technicians performing routine turbine maintenance occasionally switched
    off this supply, causing the LiDAR to shut down and disrupting the entire forecasting
    system.
  lesson_learnt: Never rely solely on incidental power outlets within wind turbines
    for LiDAR power supply — integrate a dedicated backup power source (e.g. hybrid
    solar PV/battery system) from the outset to prevent unscheduled shutdowns caused
    by routine turbine maintenance activities.
