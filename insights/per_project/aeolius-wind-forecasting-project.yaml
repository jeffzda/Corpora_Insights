  publish_date: '2024'
  project_name: Aeolius Wind Systems Wind Forecasting Demonstration Project
  what_happened: The knowledge base and skill base in Australia for long-range scanning
    Doppler lidar in wind energy forecasting applications is in its infancy, with
    no transparency regarding the forecast skill of commercial lidar products' data
    post-processing pipelines and no industry guidelines for installation, commissioning,
    operation, or technical certification.
  lesson_learnt: The absence of Best Practice Guidelines for lidar wind forecasting
    is a barrier to industry uptake — developing such guidelines through an industry
    working group (modelled on IEA lidar resource assessment guidelines) would accelerate
    technology adoption and reduce project delivery risk for future deployments.
