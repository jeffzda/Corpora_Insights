- record_id: ARENA-DLV-58052
  source_title: 'Aeolius Wind Systems Wind Forecasting Demonstration Project Lessons
    Learnt Report #4'
  publish_date: '2024'
  project_name: Aeolius Wind Systems Wind Forecasting Demonstration Project
  what_happened: The first Doppler lidar system (System 1) was damaged during shipping
    from the USA to Australia after the purpose-built packing crate was mishandled
    — laid on its side — causing the laser transceiver to separate from its mountings,
    severing optical cables and damaging other components. The transceiver had to
    be returned to the USA for repair as the required facilities were unavailable
    in Australia, incurring both time delay and budget impact.
  lesson_learnt: Delicate high-tech instruments shipped internationally require trusted
    freight agents with strict cargo-handling protocols, trained operators, and Chain
    of Custody documentation at every stage; accelerometers should be fixed to crates
    to record shock events and signal to handlers that the goods require careful treatment.
