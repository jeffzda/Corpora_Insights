  source_title: Aeolius Wind Systems Wind Forecasting Demonstration Project Lessons
    Learnt 2
  publish_date: 2020-04
  project_name: Aeolius Wind Systems Wind Forecasting Demonstration Project
  what_happened: The project identified a significant knowledge gap in understanding
    the causal atmospheric factors — such as atmospheric stability, turbulence intensity,
    surface roughness, wind shear, direction and velocity — that drive random fluctuations
    in wind flow, which directly undermine the performance of neural network forecasters
    at turning points.
  lesson_learnt: A collaborative research effort between local and international researchers
    already working on atmospheric turbulence characterisation is the most cost-effective
    pathway to closing the knowledge gap that limits neural network wind forecaster
    skill; future wind forecasting projects should budget for and formalise such research
    partnerships before entering operational trials.
