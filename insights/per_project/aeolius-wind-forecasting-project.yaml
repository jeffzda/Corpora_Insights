  evidence_excerpt: The short range scanning Doppler lidar provided capacity to map
    windfield in high spatial resolution (100m) at Macarthur windfarm with a consistent
    range of 3 km, sometimes longer when atmospheric aerosol loadings are heavier.
    The maximum distance where data of sufficient quality and quantity could be obtained
    to derive vector wind fields using AWS proprietary data post processing strategies
    was approximately 2.5 km. The range capability provided opportunities to evaluate
    the performance of a limited number of turbines which fell within the horizontal
    scanning plane (6 in the case of this deployment).
