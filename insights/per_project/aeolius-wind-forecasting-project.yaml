- record_id: ARENA-DLV-26253
  source_title: Aeolius Wind Systems Wind Forecasting Demonstration Project Lessons
    Learnt 2
  publish_date: 2020-04
  project_name: Aeolius Wind Systems Wind Forecasting Demonstration Project
  what_happened: Machine learning model performance was degraded by data gaps caused
    by communications outages within the Macarthur Windfarm SCADA and telecommunications
    systems, requiring assumptions to be made about power output from individual turbines
    and introducing further forecast uncertainty.
  lesson_learnt: Data infrastructure reliability — particularly SCADA and telecommunications
    continuity — is a prerequisite for operational ML forecasting. Future deployments
    should audit communications reliability at prospective sites before committing
    to ML-based forecasting trials, and design data-gap imputation strategies in advance.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: data/validation/testing
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Assumptions were made on individual turbine power output to fill
    gaps, though this introduced additional uncertainty rather than resolving the
    underlying data quality issue.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: wind
  source_pages:
  - 3
  - 4
  evidence_excerpt: Technical problems were encountered with the available data sets
    that adversely affect the skill of the models. In some instances, data was unavailable
    due to communications outages within the windfarm. Here assumptions must be made
    on the power output from individual wind turbines to obtain the overall forecast.
