  what_happened: 'LiDAR platform stability during scanning was identified as a material
    issue: vibrations and shifts in instrument orientation cause the laser beam to
    be directed to incorrect locations in space, resulting in suboptimal data collection
    and reduced measurement repeatability — particularly critical for long-range measurements
    of 5 km or more.'
  lesson_learnt: Ensure LiDAR mounting platforms are mechanically stable and include
    orientation monitoring — vibration-induced pointing drift at long ranges (5 km+)
    materially degrades measurement accuracy and must be actively managed through
    instrument orientation checks and regular recalibration.
