- record_id: ARENA-DLV-28703
  source_title: Aeolius Wind Systems Wind Forecasting Demonstration Project Lessons
    Learnt 1
  publish_date: 2019-10
  project_name: Aeolius Wind Systems Wind Forecasting Demonstration Project
  what_happened: The short-range lidar achieved a consistent useful range of approximately
    2.5 km for deriving vector wind fields at Macarthur windfarm, enabling evaluation
    of only 6 turbines within the horizontal scanning plane — limiting the scope of
    wake behaviour analysis across the full farm.
  lesson_learnt: When planning lidar-based wind monitoring at large windfarms, ensure
    hardware range capability (beyond 6 km recommended) is matched to the number of
    turbines that need to be assessed; a 2.5 km effective range restricts evaluation
    to a small subset of turbines and constrains the representativeness of wake analysis.
