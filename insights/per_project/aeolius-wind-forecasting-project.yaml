- record_id: ARENA-DLV-45459
  source_title: Aeolius Wind Forecasting Demonstration Project - Lessons Learnt Report
    4a
  publish_date: 2025-02
  project_name: Aeolius Wind Systems Wind Forecasting Demonstration Project
  what_happened: Four machine learning models evaluated on data from Macarthur and
    Hallett Hill wind farms successfully predicted the general trend of the five-minute-ahead
    wind field but failed to accurately capture short-duration 'turning points' —
    transitions in wind speed (deviating ≥50%) and direction (≥20 degrees) from the
    prevailing trend. Model performance was found to be comparable to the existing
    AEMO forecaster, providing no material improvement.
  lesson_learnt: Machine learning models trained on historical time-series data consistently
    fail at turning points (rapid ramp events), which are precisely the moments of
    highest operational value. Future development must prioritise custom metrics that
    weight turning points more heavily in training, and incorporate atmospheric variables
    such as stability, turbulence intensity, and wind shear to improve predictive
    skill at these critical junctures.
  issue_severity: major
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: data & measurement
  intervention_note: The Dual Doppler LiDAR strategy was refocused specifically on
    detecting turning points (ramp-up/ramp-down transitions); ML model retraining
    using upstream LiDAR data rather than turbine anemometer data was identified as
    the required corrective pathway.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: wind
  source_pages:
  - 1
  - 2
  - 3
  - 14
  evidence_excerpt: The forecast models were successful in predicting the broad trend
    in the incoming wind field in the 5minute ahead time frame, however failed to
    capture the turning points with the required level of accuracy. It was concluded
    that further model development is required to improve forecast skills to allow
    the use of these tools in operational settings.
  confidence_note: Canonical record merged from 3 source records across 3 document(s).
