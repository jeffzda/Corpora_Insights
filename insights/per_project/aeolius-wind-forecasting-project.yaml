- record_id: ARENA-DLV-45460
  source_title: Aeolius Wind Forecasting Demonstration Project - Lessons Learnt Report
    4a
  publish_date: 2025-02
  project_name: Aeolius Wind Systems Wind Forecasting Demonstration Project
  what_happened: 'Machine learning forecast models were trained using time series
    data from anemometers mounted on wind turbines. In retrospect, this was identified
    as a fundamental data source error: turbine-mounted sensors measure wind at the
    turbine location rather than upstream, so they cannot capture the upstream wind
    field dynamics that drive forecast skill for approaching events.'
  lesson_learnt: Train wind forecast machine learning models on upstream wind field
    data (e.g. from scanning LiDAR) rather than turbine-mounted anemometer data —
    anemometers measure wind at the wrong location for predicting incoming changes,
    which limits model skill regardless of algorithmic sophistication.
  issue_severity: major
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The project pivoted to training models using LiDAR-derived upstream
    wind field data, with the expectation that this will also reduce long-term dependence
    on the LiDAR instrument once the model is trained.
  transferability: moderate
  delay_magnitude: null
  technology_domain: wind
  source_pages:
  - 2
  - 15
  evidence_excerpt: The source of time series data used to train the four machine-learning
    models was sourced from anemometers mounted on wind turbines. In hindsight, it
    is unsurprising that the model skill was limited, as the data was collected in
    the wrong location. The relevant consideration is the wind field dynamics upstream
    of the wind farm, not the historical trend at the turbines.
  confidence_note: Canonical record merged from 2 source records across 2 document(s).
