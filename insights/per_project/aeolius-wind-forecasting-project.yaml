- record_id: ARENA-DLV-45452
  source_title: Aeolius Wind Forecasting Demonstration Project - Lessons Learnt Report
    4a
  publish_date: 2025-02
  project_name: Aeolius Wind Systems Wind Forecasting Demonstration Project
  what_happened: 'LiDAR scanning speed was found to be a critical hardware parameter:
    if scanning is too slow, fast-moving wind features such as gusts can pass through
    the forecast domain before being recorded, rendering the five-minute-ahead forecast
    ineffective. Trade-offs between scanning speed, spatial resolution, and data management
    strategies were identified during the initial fibre LiDAR deployment.'
  lesson_learnt: Specify minimum scanning speed requirements before procuring LiDAR
    hardware for wind forecasting — insufficient scanning speed allows fast-moving
    wind features to pass through the measurement domain undetected, directly degrading
    forecast skill.
