  what_happened: Weak telecommunications signal strength at the rural LiDAR sites
    at Macarthur Wind Farm caused delays in commissioning and operating the forecasting
    system. Standard mobile or fixed communications infrastructure was insufficient
    for reliable real-time data transfer and scan synchronisation between the two
    LiDAR units.
