- record_id: ARENA-DLV-26254
  source_title: Aeolius Wind Systems Wind Forecasting Demonstration Project Lessons
    Learnt 2
  publish_date: 2020-04
  project_name: Aeolius Wind Systems Wind Forecasting Demonstration Project
  what_happened: A short-range (2–5 km) scanning Doppler lidar trialled at Warradarge
    Windfarm in Western Australia was found unsuitable for five-minute ahead power
    forecasting due to limited range, low scanning speed, and low data availability
    beyond 2.5 km across the full 24-hour diurnal cycle — including during daytime
    high-turbulence periods and under rain and fog conditions.
  lesson_learnt: Short-range scanning Doppler lidar (2–5 km class) is not fit for
    purpose as a standalone wind power forecasting instrument under typical Australian
    windfarm environmental conditions; the technology class should not be selected
    for operational forecasting applications without first confirming that measurement
    range exceeds minimum upstream detection requirements across the full diurnal
    cycle and in adverse weather.
  issue_severity: major
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The project team identified that a higher-powered lidar class
    combined with advanced signal processing could address the range and availability
    limitations; a dual Doppler demonstration using high-powered lidar technology
    was scheduled for late 2020 at Macarthur Windfarm.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: wind
  source_pages:
  - 2
  - 3
  - 4
  evidence_excerpt: The initial results suggest that this technology is unsuitable
    for the application due to limited range, low scanning speed, and low data availability
    at range beyond 2.5 km across the entire 24hr cycle. It is likely that there will
    be significant period where forecaster will be 'blind' to changes in upstream
    flow conditions, especially during the daytime where there are high levels of
    atmospheric turbulence, or under rain and fog.
