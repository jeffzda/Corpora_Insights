  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: The Dual Doppler LiDAR strategy was refocused to detect this
    class of meteorological events upstream of the wind farm, with strategic upstream
    positioning identified as likely to address this gap.
  transferability: narrow
  delay_magnitude: null
  technology_domain: wind
