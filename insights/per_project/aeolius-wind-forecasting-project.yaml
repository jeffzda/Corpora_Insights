- record_id: ARENA-DLV-45458
  source_title: Aeolius Wind Forecasting Demonstration Project - Lessons Learnt Report
    4a
  publish_date: 2025-02
  project_name: Aeolius Wind Systems Wind Forecasting Demonstration Project
  what_happened: Site selection for the Dual Doppler LiDAR configuration at Macarthur
    Wind Farm was highly constrained by the wind farm's large size (550 ha), 140 turbines
    arranged in a narrow north–south orientation, and flat terrain. The final siting
    resulted in scan overlap covering only approximately two-thirds of the wind farm
    area, with the remaining third requiring reconstruction from single-Doppler returns
    using an advanced algorithm.
  lesson_learnt: For Dual Doppler LiDAR deployments at large wind farms, conduct a
    thorough multi-criteria siting assessment (measurement range, elevation, line-of-sight,
    scan overlap, wake dynamics) before installation — post-installation sensitivity
    testing may still be required to determine whether repositioning is necessary
    to achieve adequate forecast skill.
