- record_id: ARENA-DLV-45451
  source_title: Aeolius Wind Forecasting Demonstration Project - Lessons Learnt Report
    4a
  publish_date: 2025-02
  project_name: Aeolius Wind Systems Wind Forecasting Demonstration Project
  what_happened: Commercial scanning LiDAR products vary significantly in measurement
    range, scanning speed, and pointing accuracy. The project found that a minimum
    measurement range of 4–6 km is required at Macarthur Wind Farm to provide redundancy
    during adverse winter weather conditions (fog, light rain) that attenuate the
    laser beam and degrade return signals.
  lesson_learnt: When selecting a scanning LiDAR for wind forecasting, require a minimum
    measurement range of 4–6 km and specify a target range measurement frequency of
    95% at 5 km in every calendar month — LiDAR manufacturers' standard technical
    data sheets are insufficient to assess fitness for purpose in site-specific conditions.
