- record_id: ARENA-DLV-36060
  source_title: Southern Oil Refining Renewable Fuels Pilot Plant - Knowledge Sharing
    Report
  publish_date: 2018-10
  project_name: Southern Oil Refining Renewable Fuels Pilot Plant
  what_happened: Lab work showed that unstable renewable feeds with high olefin content
    have a propensity for coking on heater surfaces; standard heat flux designs used
    in fossil fuel refining were found to be unsuitable for these feeds.
  lesson_learnt: When designing hydrotreaters for renewable crude feeds, specify low
    heat flux across all heaters to reduce coking risk from unstable, highly olefinic
    feeds — standard fossil-fuel heat flux assumptions do not apply to renewable crudes
    and will result in coking and fouling.
