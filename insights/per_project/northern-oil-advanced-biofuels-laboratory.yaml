  source_title: Southern Oil Refining Renewable Fuels Pilot Plant - Knowledge Sharing
    Report
  publish_date: 2018-10
  project_name: Southern Oil Refining Renewable Fuels Pilot Plant
  what_happened: Laboratory testing at the Northern Oil Advanced Biofuels Laboratory
    found that fractionation of Biological Crude Oil caused sugars to caramelise and
    form toffee-like deposits in the reboiler at temperatures above 160°C, preventing
    standard atmospheric fractionation.
  lesson_learnt: When fractionating biological gas oils derived from agricultural
    or mixed-stream waste, run the fractionation column under vacuum to lower the
    operating temperature below the caramelisation point of sugars (~160°C); standard
    atmospheric fractionation will foul the reboiler.
