- record_id: ARENA-DLV-36061
  source_title: Southern Oil Refining Renewable Fuels Pilot Plant - Knowledge Sharing
    Report
  publish_date: 2018-10
  project_name: Southern Oil Refining Renewable Fuels Pilot Plant
  what_happened: 'The project identified that a geographic misalignment exists between
    where diesel is produced or imported in Australia (coastal metro locations) and
    where it is primarily consumed (regional areas: mines, farms, long-haul transport
    corridors), creating an economic opportunity for regionally sited renewable fuel
    refineries to compete with imported and metro-refined diesel.'
  lesson_learnt: Site renewable fuel refineries near regional consumption centres
    (mining, agricultural, long-haul transport hubs) rather than defaulting to coastal
    metro locations — modelling shows cost-competitive windows exist around regional
    cities such as Gladstone and Wagga Wagga where proximity to both waste feedstock
    and fuel consumers can offset refinery scale disadvantages.
