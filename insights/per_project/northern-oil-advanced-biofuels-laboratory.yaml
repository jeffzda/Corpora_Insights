- record_id: ARENA-DLV-36052
  source_title: Southern Oil Refining Renewable Fuels Pilot Plant - Knowledge Sharing
    Report
  publish_date: 2018-10
  project_name: Southern Oil Refining Renewable Fuels Pilot Plant
  what_happened: Laboratory testing found that Cracked Gas Oil (CGO), produced from
    pyrolysis of heavy waste oils and solid waste, was prone to re-polymerisation
    during fractionation due to its highly olefinic nature, generating solids and
    slurries that created processing difficulties.
  lesson_learnt: Process Cracked Gas Oil as close to the time of manufacture as possible
    to minimise re-polymerisation; delays between crude production and refining increase
    the risk of solid and slurry formation that can foul fractionation equipment.
