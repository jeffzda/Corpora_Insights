- record_id: ARENA-DLV-36062
  source_title: Southern Oil Refining Renewable Fuels Pilot Plant - Knowledge Sharing
    Report
  publish_date: 2018-10
  project_name: Southern Oil Refining Renewable Fuels Pilot Plant
  what_happened: The project found that trace metals in renewable crude feedstocks
    would poison downstream hydrotreating catalysts if not removed first; this required
    the inclusion of dedicated guard beds upstream of all main reactor systems — a
    design feature not required in standard fossil fuel hydrotreating at comparable
    scales.
  lesson_learnt: Include dedicated guard beds (demetallisation reactors) upstream
    of all hydrotreating catalyst systems when processing renewable crudes — trace
    metals from diverse waste feedstocks will poison hydrotreating catalysts and cause
    premature catalyst failure if not removed in a dedicated pre-treatment step.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: pilot
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Pilot plant design incorporated four guard beds (VE-001 A/B/C/D)
    in lead/lag configuration upstream of all main reactor systems to remove metals
    and other catalyst poisons.
  transferability: moderate
  delay_magnitude: null
  technology_domain: bioenergy
  source_pages: &id012
  - 28
  - 32
  evidence_excerpt: Metals may be present from many different sources and in most
    cases will be of concern for catalytic treatment processes. Consistent low levels
    of contaminates may be addressed with suitable de-poisoning stages but highly
    variable levels of metals present would be of major concern... VE-001 A/B/C/D
    Guard beds Removes metals and other impurities detrimental to downstream catalyst.
