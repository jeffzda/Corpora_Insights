- record_id: ARENA-DLV-36053
  source_title: Southern Oil Refining Renewable Fuels Pilot Plant - Knowledge Sharing
    Report
  publish_date: 2018-10
  project_name: Southern Oil Refining Renewable Fuels Pilot Plant
  what_happened: Lab-scale testing demonstrated that renewable crude feedstocks are
    highly variable across three distinct crude types (LGO, CGO, BGO), each requiring
    different refining pathways; this variability could not be managed by a standard
    fixed-configuration hydrotreater.
  lesson_learnt: Design renewable fuel refineries with large buffer/surge capacity
    and a recirculation loop from the clean side back to feed — this normalises feedstock
    variability across crude types and maintains hydrogen availability, which is critical
    for hydrotreating variable renewable feeds.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: pilot
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Pilot plant design incorporated large buffering capacities and
    a recirculation of product back to feed to normalise variability and improve hydrogen
    dissolution into the liquid background.
  transferability: moderate
  delay_magnitude: null
  technology_domain: bioenergy
  source_pages: &id003
  - 2
  - 28
  evidence_excerpt: The main differentiating feature of this refinery to fossil fuel
    plants is the use of large buffering capacities and a recirculation of product
    back to feed. This allows any major changes in the oil, and the variation between
    the crudes themselves, to be normalised in the large buffer. This design allows
    a larger background of liquid for hydrogen to dissolve into. The availability
    of hydrogen in renewable fuel hydrotreating is of high importance.
  confidence_note: null
