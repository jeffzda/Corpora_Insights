- record_id: ARENA-DLV-36056
  source_title: Southern Oil Refining Renewable Fuels Pilot Plant - Knowledge Sharing
    Report
  publish_date: 2018-10
  project_name: Southern Oil Refining Renewable Fuels Pilot Plant
  what_happened: The project identified that no major renewable fuel refinery existed
    in Australia as of 2018, and that the absence of a refiner — the keystone connecting
    feedstock suppliers and end users — was the primary gap preventing development
    of a domestic renewable fuels industry, despite adequate waste feedstock supply
    and commercial demand.
  lesson_learnt: In nascent industrial value chains, identify and target the keystone
    bottleneck — in renewable fuels, this is the refiner; without a functioning refinery,
    feedstock suppliers have no buyer and end-users have no product, so public investment
    should prioritise the missing link in the chain rather than the endpoints.
  issue_severity: major
  project_type: industrial decarbonisation
  project_scale_band: pilot
  lifecycle_phase: concept/feasibility
  proponent_type: technology vendor
  delay_category: null
  failure_mode: commercial & market
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: SOR designed the pilot plant specifically to prove refinery feasibility
    and fill the identified industry gap, taking a whole-of-value-chain approach.
  transferability: moderate
  delay_magnitude: null
  technology_domain: bioenergy
  source_pages: &id006
  - 15
  - 16
  evidence_excerpt: The refiner sits as the keystone in the main production chain.
    Without the refiner, the renewable crude producer has no-one to sell their product
    to, and the end user has no-one to buy their product from... To date no one has
    trialed a complete value chain approach to renewable fuels, which means that no
    one has understood the synergies that can come from having an integrated chain.
