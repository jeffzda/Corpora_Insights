  project_name: Southern Oil Refining Renewable Fuels Pilot Plant
  what_happened: Laboratory-scale findings showed that renewable fuel hydrotreating
    requires approximately three times more hydrogen than fossil fuel refining, making
    hydrogen a major cost driver that could not be assumed to scale linearly from
    lab to pilot or commercial operations.
  lesson_learnt: Budget hydrogen costs at approximately three times the rate of fossil
    fuel refining when modelling renewable fuel refinery economics; hydrogen supply
    and cost is a primary sensitivity and must be explicitly validated at each scale-up
    step.
