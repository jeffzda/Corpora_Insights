- record_id: ARENA-DLV-36055
  source_title: Southern Oil Refining Renewable Fuels Pilot Plant - Knowledge Sharing
    Report
  publish_date: 2018-10
  project_name: Southern Oil Refining Renewable Fuels Pilot Plant
  what_happened: Economic modelling for a 340 ML/a renewable fuels refinery showed
    a capital payback period of approximately 13 years without government support
    — too long to be commercially attractive — but applying excise relief reduced
    the payback to approximately 4 years, bringing it within normal commercial return
    expectations.
  lesson_learnt: Excise relief is the single most critical policy lever for enabling
    first-commercial-scale renewable diesel investment in Australia; without it, capital
    payback periods are approximately 13 years, but with it the payback reduces to
    approximately 4 years and the investment becomes commercially viable.
