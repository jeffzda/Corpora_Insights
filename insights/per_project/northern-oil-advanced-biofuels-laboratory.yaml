- record_id: ARENA-DLV-36058
  source_title: Southern Oil Refining Renewable Fuels Pilot Plant - Knowledge Sharing
    Report
  publish_date: 2018-10
  project_name: Southern Oil Refining Renewable Fuels Pilot Plant
  what_happened: The project found that renewable fuel produced from waste feedstocks
    must be cost competitive with fossil diesel and of identical quality (drop-in)
    to achieve market acceptance; the low market acceptance of E10 ethanol blended
    fuel even at lower price points demonstrated that quality parity is non-negotiable,
    not aspirational.
  lesson_learnt: Design renewable fuel projects from the outset to produce a 100%
    drop-in product that is indistinguishable from fossil fuel in both cost and performance
    — partial substitutes or blended fuels at lower price points (as demonstrated
