  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: SOR identified excise relief (similar to that applied to ethanol
    and biodiesel) as the policy intervention required, and is working with State
    and Federal Governments to advocate for this.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: bioenergy
