- record_id: ARENA-DLV-36059
  source_title: Southern Oil Refining Renewable Fuels Pilot Plant - Knowledge Sharing
    Report
  publish_date: 2018-10
  project_name: Southern Oil Refining Renewable Fuels Pilot Plant
  what_happened: The project found that renewable fuels produced from waste feedstocks
    require end-use approval from Original Equipment Manufacturers (OEMs) — including
    laboratory certification, laboratory engine testing, and live engine trials —
    before fleet operators would accept the fuel, as commercial transport operators
    require OEM warranty coverage against the fuel.
  lesson_learnt: Begin OEM end-use approval processes (laboratory certification, engine
    testing, live trials) in parallel with pilot plant construction — commercial fleet
    operators will not adopt a new fuel without OEM warranty coverage, and the approval
    chain is lengthy; treating it as a post-production step will delay commercialisation.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: pilot
  lifecycle_phase: approvals/contracting
  proponent_type: technology vendor
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: coordination & stakeholders
  intervention_note: SOR identified the end-use approval chain as one of three value
    chains requiring parallel development and committed to working with OEMs through
    this process.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: bioenergy
  source_pages: &id009
  - 15
  - 16
  evidence_excerpt: The end use approval chain covers the steps required to allow
    for the fuel to be burnt in an engine. This includes laboratory certification,
    laboratory engine testing and live trials in engines. This work must be done with
    an Original Equipment Manufacturer (OEM), with the intention of the OEM arriving
    at a stage where they will warrant their engines against the use of the fuel.
    Companies that depend on the reliable operation of these engines require this
