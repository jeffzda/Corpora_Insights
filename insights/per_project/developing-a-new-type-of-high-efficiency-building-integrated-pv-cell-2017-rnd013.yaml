- record_id: ARENA-DLV-48114
  source_title: ARENA-Funded Cutting Edge Research in Photovoltaics
  publish_date: 2019-09
  project_name: Developing a New Type of High Efficiency Building Integrated PV Cell (2017/RND013)
  what_happened: The project successfully developed semi-transparent perovskite solar cells with 15% efficiency and 10% average visible transmittance using a hole transporting layer (VNPB) derived from
    OLED technology. The team was collaborating with industry partner CSR Viridian to integrate the cells into commercial window framing systems for real-world testing.
  lesson_learnt: For building-integrated PV applications, combining transparent PV research with a commercial glazing or construction industry partner from the outset enables simultaneous optimisation of
    the solar cell for building integration constraints (transparency, framing compatibility) rather than retrofitting after cell development — this materially accelerates the path to real-world application.
