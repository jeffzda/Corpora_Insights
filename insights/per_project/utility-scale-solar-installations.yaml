- record_id: ARENA-DLV-67804
  source_title: Establishing the Social Licence to Operate Large Scale Solar Facilities
    in Australia
  publish_date: '2015'
  project_name: Establishing the Social Licence to Operate Large Scale Solar Facilities
    in Australia
  what_happened: Research across 15 focus groups and 1,197 survey respondents found
    that Australians have very low knowledge of large-scale solar facilities specifically
    (only 12% know 'a fair amount' or more), yet first impressions upon seeing images
    were almost universally positive — indicating that information gaps, not hostility,
    are the primary barrier to social licence.
  lesson_learnt: Because the Australian public has low knowledge of large-scale solar
    facilities but positive default sentiment, early-stage community communications
    should prioritise filling information gaps with images and accessible facts rather
    than managing opposition — the absence of information is the main risk to social
    licence, not inherent community resistance.
