  what_happened: Research identified that community concern about local environmental
    impacts of large-scale solar (flora, fauna, ecosystem disruption during construction)
    was widespread but almost always expressed as uncertainty or questions rather
    than grounded objection, indicating that communities were willing to accept some
    localised disruption if net environmental benefit was clearly communicated.
  lesson_learnt: Developers should communicate local environmental impacts — both
    short-term disruption and long-term rehabilitation — explicitly and early, addressing
    both the construction footprint and ongoing operations; communities that perceive
    information gaps on local environmental impacts tend to assume the worst, while
    those given clear information show tolerance for trade-offs.
