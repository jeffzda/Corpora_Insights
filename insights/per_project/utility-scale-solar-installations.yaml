  what_happened: Research found that community concern about reliability and efficiency
    of large-scale solar is the dominant latent barrier to social licence — more than
    a quarter of Australians neither agreed nor disagreed that solar can provide a
    consistent electricity supply, and efficiency questions underpinned most other
    objections including visual and land-use concerns.
  lesson_learnt: Addressing reliability and efficiency first in community communications
    is strategically important because demonstrating these attributes causes communities
    to discount or overlook other concerns (visual impact, land use) — if efficiency
    and reliability can be demonstrated, other drawbacks are willing to be overlooked.
