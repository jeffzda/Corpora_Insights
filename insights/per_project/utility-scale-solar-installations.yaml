  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: In one town, council negotiated with the contractor to locate
    the labour camp in town rather than on-site, successfully directing construction
    worker spending into local businesses.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id002
