  what_happened: Research found that Australians' attitudes towards large-scale solar
    are closely anchored to their experiences with domestic rooftop solar, including
    both positive perceptions (familiarity, safety, reliability) and negative ones
    (confusion about financial returns, frustration with installation processes, concerns
    about energy-in versus energy-out). Negative domestic experiences did not, however,
    transfer to large-scale facilities where the financial stakes were not personal.
  lesson_learnt: Developers can leverage widespread domestic solar familiarity to
    build credibility for large-scale PV projects by drawing explicit analogies to
    household panels — but should avoid framing that invites community members to
    apply personal financial disappointments with domestic solar to their assessment
    of large-scale projects.
