  what_happened: Research found that smaller regional communities showed higher engagement
    and stronger social licence for solar projects than larger communities, evidenced
    by greater attendance at community meetings in smaller towns, and that economic
    benefits had proportionally larger impact in smaller towns where the local economy
    was more affected by construction employment.
  lesson_learnt: Community engagement intensity and economic communication should
    be scaled to community size — in small regional towns, even a modest number of
    construction jobs represents a significant local economic event, and this heightened
    economic sensitivity can be leveraged to build strong social licence if managed
    proactively.
