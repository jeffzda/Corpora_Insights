- record_id: ARENA-DLV-67801
  source_title: Establishing the Social Licence to Operate Large Scale Solar Facilities
    in Australia
  publish_date: '2015'
  project_name: Establishing the Social Licence to Operate Large Scale Solar Facilities
    in Australia
  what_happened: Community members living near large-scale solar facilities under
    construction were largely unaware of any engagement activities undertaken during
    the planning phase, yet this did not translate into opposition — support remained
    strong among local residents, particularly due to anticipated economic benefits
    during construction.
  lesson_learnt: Absence of formal engagement during planning does not automatically
    generate opposition for large-scale solar projects, but active engagement around
    employment and contracting opportunities is critical — unmanaged expectations
    in this area did generate measurable community frustration.
