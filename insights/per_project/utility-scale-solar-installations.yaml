  what_happened: Focus groups in communities near large-scale solar facilities found
    that most community stakeholders (beyond adjacent landowners and local government)
    were not informed about the project during its planning phase, obtaining information
    primarily through word of mouth and mainstream media rather than direct developer
    engagement.
