  what_happened: Survey experiments showed that exposing respondents to images and
    factual information about large-scale solar facilities reduced the proportion
    agreeing the facilities have a negative visual impact from 30% to between 19–23%,
    demonstrating that visual concern is primarily driven by lack of exposure rather
    than informed objection.
  lesson_learnt: Project developers should use images of the facility or similar facilities
    from the very outset of community engagement — providing visual information proactively
    reduces perceived visual impact concerns and pre-empts the speculation that fills
    information voids, including for non-PV technologies such as CSP towers.
