  publish_date: '2015'
  project_name: Establishing the Social Licence to Operate Large Scale Solar Facilities
    in Australia
  what_happened: Research found that community concern about large-scale solar facilities
    generating enough energy to justify the land area used was a recurring issue across
    focus groups, typically framed as uncertainty rather than objection — communities
    found technical metrics (hectares, megawatts) difficult to interpret and defaulted
    to speculation about whether the facility was 'worth it'.
  lesson_learnt: Developers should communicate facility size and output using relatable
    analogies (e.g. football fields for area; equivalent households powered for output)
    rather than technical units alone — in the absence of accessible size-to-output
    comparisons, communities speculate negatively about land-use efficiency, which
    can undermine support even where no real objection exists.
