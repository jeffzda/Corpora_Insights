  publish_date: '2015'
  project_name: Establishing the Social Licence to Operate Large Scale Solar Facilities
    in Australia
  what_happened: Community members near large-scale solar facilities consistently
    held the misconception that the presence of a local facility would reduce their
    household electricity prices, analogising from domestic solar feed-in tariffs
    — a misconception that arose across all communities included in the research.
  lesson_learnt: Developers should proactively communicate that local energy prices
    will not be reduced by a nearby large-scale solar facility, and provide a clear
    rationale; in the absence of this information community members will form and
    spread inaccurate expectations that can later damage trust.
