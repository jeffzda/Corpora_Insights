- record_id: ARENA-DLV-67802
  source_title: Establishing the Social Licence to Operate Large Scale Solar Facilities
    in Australia
  publish_date: '2015'
  project_name: Establishing the Social Licence to Operate Large Scale Solar Facilities
    in Australia
  what_happened: In communities hosting large-scale solar facilities under construction,
    local residents and businesses expressed frustration when employment and contracting
    opportunities were not actively communicated or when locally procurable goods
    (e.g. food supplies for worker camps) were sourced from outside the region despite
    local availability.
  lesson_learnt: Project developers must proactively push employment and contracting
    information into local communities via local employment agencies and media — passive
    advertising alone is insufficient, and procurement decisions perceived to bypass
    local suppliers can erode community support even when overall project sentiment
    is positive.
