- record_id: ARENA-DLV-9145
  source_title: State of DER Technology Integration Report
  publish_date: 2021-02
  project_name: Updated Standards for Demand Response from Residential Loads (AS 4755)
  what_happened: A Consultation Regulation Impact Statement on residential demand
    response capabilities was published in 2013 and received generally positive public
    consultation feedback, but was not progressed further or submitted to the COAG
    Energy Council for decision. The work had to be restarted in December 2018 when
    COAG agreed to revisit and reconsider the proposal — a gap of approximately 5
    years.
  lesson_learnt: Standards work that receives a positive consultation response but
    is not formally progressed to implementation can create a 5+ year delay — project
    sponsors and regulators should ensure that successful consultation outcomes are
    followed by explicit commitment to progress to mandatory implementation, with
    a named lead agency and timeline, to avoid the work being abandoned.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: programmatic/portfolio-level
