  evidence_excerpt: A Consultation Regulation Impact Statement (RIS) on a similar
    proposal was published in 2013. Although this proposal received a generally positive
    response during public consultations at the time (incorporated in a draft Decision
    RIS in 2014), this was not progressed further nor submitted to the COAG Energy
    Council for decision. In December 2018, the COAG Energy Council agreed that the
    previous work undertaken in 2013/14 should be revisited, updated and reconsidered
    for regulation.
