  secondary_failure_mode: coordination & stakeholders
  intervention_note: In December 2018, COAG Energy Council agreed to revisit the 2013/14
    work through the GEMS process, with South Australia as Project Lead on behalf
    of the E3 Program; mandatory implementation timelines were set with air conditioners
    required to comply by June 2023.
