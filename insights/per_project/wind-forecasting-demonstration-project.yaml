  evidence_excerpt: Historical analysis of vertical scan data from the LIDAR has shown
    the occurrence of nocturnal boundary layer phenomena known as Low-Level Jets (LLJs)
    at Mount Mercer. During otherwise still nights, it is possible to see an injection
