- record_id: ARENA-DLV-43651
  source_title: Meridian Energy Australia Wind Forecasting Demonstration Project Lessons
    Learnt 2
  publish_date: 2020-04
  project_name: Meridian Energy Australia Wind Forecasting Demonstration Project
  what_happened: On a 44-degree day (31 January 2020), the Mt Mercer Wind Farm produced
    near-zero power output despite high winds because internal turbine temperature
    sensors triggered automatic shut-down. The wind power forecast did not account
    for this cut-out temperature behaviour, causing a significant forecast error.
  lesson_learnt: Wind power forecasts should incorporate a high-temperature check
    against each turbine's cut-out temperature threshold — failure to do so caused
    near-zero output during a high-wind, high-temperature event and a major forecast
    error.
