- record_id: ARENA-DLV-43652
  source_title: Meridian Energy Australia Wind Forecasting Demonstration Project Lessons
    Learnt 2
  publish_date: 2020-04
  project_name: Meridian Energy Australia Wind Forecasting Demonstration Project
  what_happened: The first LIDAR-based forecasting algorithm performed well when wind
    speed changed in magnitude but not direction. On days when a cold front caused
    rapid simultaneous changes in both wind speed and direction, the dynamic scanning
    technique could not capture the change fast enough, producing undesirable forecast
    errors.
  lesson_learnt: LIDAR-based wind forecasting algorithms must be designed to handle
    rapid simultaneous changes in both wind speed and direction associated with cold-front
    passage in south-east Australia — algorithms that handle magnitude changes only
    will produce significant errors under frontal conditions.
