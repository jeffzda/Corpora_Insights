- record_id: ARENA-DLV-43656
  source_title: Meridian Energy Australia Wind Forecasting Demonstration Project Lessons
    Learnt 2
  publish_date: 2020-04
  project_name: Meridian Energy Australia Wind Forecasting Demonstration Project
  what_happened: A PhD student on the project analysed 2.5 years of archival wind
    power data from Mt Mercer Wind Farm and identified the dominant meteorological
    drivers of wind power ramps. Cold fronts and post-frontal conditions accounted
    for the largest number of ramp events; high turbulence intensity (associated with
    a destabilised atmospheric boundary layer) was the second-largest driver.
  lesson_learnt: Wind farm operators should analyse historical power data to identify
    site-specific meteorological drivers of power ramps before developing forecasting
    algorithms — at Mt Mercer, cold fronts and high turbulence intensity drove the
    majority of ramps, and targeting these conditions in forecast design is the logical
    first step in improving ramp prediction.
