  what_happened: Analysis of the published LIDAR dataset revealed that spatially coherent
    patches of elevated wind speed (gusts) can be extracted from wind field data using
    background correction signal processing, a capability not previously documented
    for this dataset.
  lesson_learnt: Projects measuring the incoming wind field should apply signal processing
    (background correction) to LIDAR velocity field data to detect spatially coherent
    flow phenomena such as gusts — these features are not directly visible in raw
    data without this processing step.
