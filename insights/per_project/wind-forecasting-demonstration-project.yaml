  publish_date: '2022-09-16'
  project_name: Meridian Energy Mount Mercer Wind Power Forecasting – Extended Forecasting
    Project
  what_happened: The SCADA data logging mechanism was poorly understood at the outset
    of the project; a mid-dataset SCADA system upgrade on 28 November 2019 changed
    data logging frequency from 20–40 second intervals to 5–10 second intervals for
    turbine data, and from 20–40 seconds to 1–2 seconds for total power output, requiring
    substantial pre-processing effort to reconcile the two data regimes.
  lesson_learnt: When using SCADA data spanning a system upgrade, explicitly document
    and account for the change in logging frequency and data structure before beginning
    analysis — the two regimes require separate pre-processing pipelines and failure
    to do so will produce unreliable merged datasets.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: data/validation/testing
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Data was resampled at a uniform 10-second interval, with duplicate
    readings removed and missing values linearly interpolated over a maximum one-minute
    threshold; separate pre-processing was applied to the two data frequency regimes.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: wind
  source_pages: &id037
