- record_id: ARENA-DLV-51802
  source_title: Meridian Energy Australia Wind Forecasting Demonstration Project Lessons
    Learnt 4
  publish_date: 2021-03
  project_name: Meridian Energy Australia Wind Forecasting Demonstration Project
  what_happened: On certain 'peculiar days', the self-forecast had lower error than
    AWEFS yet generated a worse (positive) causer pays factor, because the larger
    AWEFS forecast error happened to stabilise grid frequency when raise or lower
    ancillary services were needed. The more accurate self-forecast, by minimising
    deviation from the linear dispatch trajectory, did not provide this grid-stabilising
    effect and therefore resulted in higher causer pays charges on those days.
  lesson_learnt: Wind farm operators should be aware that the causer pays cost recovery
    mechanism may not financially reward the most accurate forecast — reduced Regulation
    FCAS costs are more closely tied to having the sign of the forecast error align
    with the current need for raise or lower services, meaning higher-error forecasts
    can sometimes be more financially beneficial.
