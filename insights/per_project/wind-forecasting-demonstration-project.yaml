- record_id: ARENA-DLV-21756
  source_title: Meridian Extended Forecasting Project Report
  publish_date: '2022-09-16'
  project_name: Meridian Energy Mount Mercer Wind Power Forecasting – Extended Forecasting
    Project
  what_happened: Cross-correlation analysis showed that wind propagation time lags
    between closely spaced turbines (400 m apart) occur at 70–160 seconds, which is
    much shorter than the 370-second (6 minutes 10 seconds) AEMO forecast submission
    horizon required; consequently, lagged signals from nearby turbines were not directly
    useful as predictive features for the required forecast horizon.
  lesson_learnt: When designing features for wind farm power forecasting, verify that
    the physical time scales of turbine-to-turbine wind propagation are compatible
    with the required forecast horizon before including lagged upstream turbine signals;
    for sub-10-minute AEMO submission horizons, cross-correlation peaks from nearby
    turbines will typically occur at lags far shorter than the prediction window,
    limiting their direct utility.
  issue_severity: minor
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Analysis shifted focus to turbines further apart, whose cross-correlation
    peaks occurred at time scales closer to the 370-second prediction horizon, and
    to inter-cluster variability features as indirect indicators of changing wind
    conditions.
  transferability: narrow
  delay_magnitude: null
  technology_domain: wind
  source_pages: &id041
  - 9
  - 10
  evidence_excerpt: In figure 3.2.1 (a), the optimal time lags occur at 70 seconds
    and 160 seconds which is much earlier than prediction 370 seconds into the future.
    The peaks for wind turbines further apart are smaller, but they are of similar
    time scales to the prediction timeframe for this task.
