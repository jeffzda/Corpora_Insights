- record_id: ARENA-DLV-0255
  source_title: The Electricity System Benefits of Improved, Short-Term Wind Generation
    Forecasts
  publish_date: '2022-09-16'
  project_name: Wind Forecasting Demonstration Project
  what_happened: Modelling at 61% VRE penetration showed that wind and solar generators
    delivered approximately 50% and 80% respectively of their energy at prices below
    $60/MWh, while remaining heavily reliant on infrequent high-price scarcity events
    for the majority of their revenue — a revenue concentration risk that worsens
    with higher forecast error.
  lesson_learnt: Wind and solar project developers in high-VRE systems should stress-test
    their revenue models against scenarios where scarcity price events are fewer or
    absent — the revenue profile at high VRE penetration is structurally skewed toward
    rare high-price events, and this concentration risk is compounded by poor forecast
    accuracy which further reduces wind IRRs.
