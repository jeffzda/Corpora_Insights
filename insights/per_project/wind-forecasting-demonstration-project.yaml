  project_name: Meridian Energy Australia Wind Forecasting Demonstration Project
  what_happened: Two LIDAR-based forecasting strategies — a physically-based pipeline
    and a deep learning (Convolutional Neural Network) approach — achieved equivalent
    forecasting skill, but the physical approach required substantially more real-time
    computation due to filtering, wind field reconstruction, and scan integrity checks
    that are unnecessary in the data-driven approach.
  lesson_learnt: When selecting a LIDAR-based forecasting strategy, carefully evaluate
    operational computation costs; deep learning approaches can achieve comparable
    accuracy while significantly reducing real-time processing overhead by shifting
    computation-intensive steps to the model training phase.
