- record_id: ARENA-DLV-0254
  source_title: The Electricity System Benefits of Improved, Short-Term Wind Generation
    Forecasts
  publish_date: '2022-09-16'
  project_name: Wind Forecasting Demonstration Project
  what_happened: Modelling showed that higher wind forecast errors cause increased
    scheduling of thermal plant and energy storage to maintain system reliability,
    which in turn increases renewable curtailment because thermal and storage capacity
    is more available to displace wind output. This effect is amplified at 61% VRE
    relative to 30% VRE.
  lesson_learnt: Developers and system operators planning high-VRE systems should
    account for the indirect cost of poor wind forecasting on renewable curtailment
    rates — forecast error effectively undermines the utilisation of installed renewable
    capacity and transfers revenue from wind generators to thermal and storage plant
    through increased scarcity pricing events.
