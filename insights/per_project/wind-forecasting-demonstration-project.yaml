  source_title: Meridian Energy Australia Wind Forecasting Demonstration Project Lessons
    Learnt 5
  publish_date: 2021-09
  project_name: Mt. Millar Wind Farm Wind Forecasting Demonstration Project
  what_happened: LIDAR data analysis found that wind gusts smaller than 1 km propagate
    at approximately the mean wind speed, while gusts larger than 1 km propagate faster
    than the mean wind speed, attributed to vertical stretching into higher-altitude
    faster wind layers.
  lesson_learnt: Projects measuring the incoming wind field for forecasting purposes
    must account for size-dependent gust propagation velocities — smaller gusts travel
    at mean wind speed while larger gusts exceed it, so a single advection velocity
    assumption will introduce systematic forecast error.
