- record_id: ARENA-DLV-17652
  source_title: Meridian Energy Australia Wind Forecasting Demonstration Project Lessons
    Learnt 6
  publish_date: 2022-02
  project_name: Meridian Energy Australia Wind Forecasting Demonstration Project
  what_happened: A month-based (seasonal) train-test data split for machine-learning
    wind forecasts produced noticeably better forecast skill than a naïve chronological
    data-chunk split. The seasonal split yielded a 6.85% improvement over persistence
    versus 5.57% for the naïve split, indicating that seasonal wind patterns materially
    affect model training quality.
  lesson_learnt: Machine-learning wind forecasting models should use month-based (seasonal)
    train-test data splits rather than naïve chronological splits — splitting data
    by month exposes the model to diverse seasonal patterns during training and produces
    meaningfully better forecasts, particularly for wind resources with pronounced
    seasonal variability.
  issue_severity: minor
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Adopted a per-month data split strategy, exposing the model to
    seasonal patterns in training and improving outperformance of persistence from
    5.57% to 6.85%.
  transferability: moderate
  delay_magnitude: null
  technology_domain: wind
  source_pages: &id007
  - 3
  - 4
  evidence_excerpt: the relative performance increase for 18 clusters in Figures 1
    and 3 correspond to a 6.85% and a 5.57% increase over persistence, respectively...
    the seasonal split outperformed the naïve split, suggests that this forecastability
    can be improved by accounting for season-related wind changes.
  confidence_note: failure_mode coded as design assumption failure because the initial
