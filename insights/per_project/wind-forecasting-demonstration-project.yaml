- record_id: ARENA-DLV-51808
  source_title: Meridian Energy Australia Wind Forecasting Demonstration Project Lessons
    Learnt 4
  publish_date: 2021-03
  project_name: Meridian Energy Australia Wind Forecasting Demonstration Project
  what_happened: Testing of the 24-hour ahead forecasting system showed that operational
    setup choices — including how frequently forecast runs are executed (once daily,
    every 6 hours, or every hour) and the time of day forecasts are projected — had
    significant impacts on forecast accuracy and consistency. More frequent runs improved
    accuracy in the first few hours of the forecast horizon where observed site data
    was incorporated, but provided no benefit beyond that window.
  lesson_learnt: Projects developing longer-horizon forecasting systems should carefully
    analyse the impact of operational setup parameters (run frequency, projection
    time) on accuracy and consistency, and balance operational constraints against
    strategic aims — more frequent runs only improve accuracy within the first few
    hours of the forecast horizon when current observations are incorporated.
