- record_id: ARENA-DLV-36404
  source_title: Meridian Energy Australia Wind Forecasting Demonstration Project Lessons
    Learnt 5
  publish_date: 2021-09
  project_name: Mt. Millar Wind Farm Wind Forecasting Demonstration Project
  what_happened: When preparing to deploy the Mt. Millar wind farm five-minute ahead
    self-forecast via AEMO's MP5F API, the team found that a statistical forecasting
    approach — identified as most accurate for Mt. Millar and Mt. Mercer — was insufficient
    due to frequent generation limits imposed by local distribution line thermal constraints
    and volatile generation pricing, requiring a switch to a machine-learning based
    approach despite its lower technical accuracy.
  lesson_learnt: Wind and solar farm forecast design must be bespoke to each site's
    regional network constraints and generation limitations — local distribution thermal
    limits and volatile pricing can override the choice of technically superior forecasting
    methods, requiring a machine-learning approach capable of handling those operational
    constraints even at some cost to raw accuracy.
