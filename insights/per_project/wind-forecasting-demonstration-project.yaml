- record_id: ARENA-DLV-0252
  source_title: The Electricity System Benefits of Improved, Short-Term Wind Generation
    Forecasts
  publish_date: '2022-09-16'
  project_name: Wind Forecasting Demonstration Project
  what_happened: Modelling found that in systems with greater than 30% VRE penetration,
    improved short-term wind forecasts could reduce average market prices by 5 $/MWh
    or more, representing approximately $200M or more in annual consumer savings —
    an amount estimated to far exceed the cost of implementing improved forecasting
    systems.
  lesson_learnt: When evaluating the business case for improved wind forecasting infrastructure,
    the primary beneficiary is energy consumers via lower average prices, not wind
    generators themselves; this asymmetry means investment decisions should not be
    left to individual wind project developers and instead warrant system-operator-level
    or regulatory mandates.
