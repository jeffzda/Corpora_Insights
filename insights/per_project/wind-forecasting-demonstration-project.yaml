- record_id: ARENA-DLV-0253
  source_title: The Electricity System Benefits of Improved, Short-Term Wind Generation
    Forecasts
  publish_date: '2022-09-16'
  project_name: Wind Forecasting Demonstration Project
  what_happened: Modelling demonstrated that poor wind forecast accuracy at 61% VRE
    penetration significantly increases the probability of Rate of Change of Frequency
    (RoCoF) exceeding 1 Hz/s — a threshold associated with loss of frequency control
    — due to reduced online synchronous inertia combined with greater forecast-driven
    generation imbalances. At 30% VRE, RoCoF risk was small regardless of forecast
    accuracy.
  lesson_learnt: Grid integration projects targeting high VRE penetration (above ~61%
    by annual energy) should explicitly model the interaction between wind forecast
    accuracy and system inertia when assessing system security risk — forecast improvement
    programmes become a system security measure, not just a market efficiency measure,
    at these penetration levels.
