- record_id: ARENA-DLV-43653
  source_title: Meridian Energy Australia Wind Forecasting Demonstration Project Lessons
    Learnt 2
  publish_date: 2020-04
  project_name: Meridian Energy Australia Wind Forecasting Demonstration Project
  what_happened: When the wind farm was operating in constrained mode and close to
    the semi-dispatch cap, a persistence-based self-forecast effectively became a
    constrained forecast rather than an Unconstrained Intermittent Generation Forecast
    (UIGF). This created a risk of NEMDE cycling between applying and removing the
    semi-dispatch cap, potentially causing large power swings and increased forecast
    errors.
  lesson_learnt: Self-forecasters using persistence-based or statistically lagged
    models must switch to an alternate model that does not use previous power values
    when the farm is constrained and operating near the constrained cap — this requires
    developing two parallel self-forecast models, one for unconstrained and one for
    constrained operation.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Meridian identified the need to develop a second self-forecast
    model (without previous power values) to be employed during constrained operation.
  transferability: moderate
  delay_magnitude: null
  technology_domain: wind
  source_pages: &id049
  - 2
  evidence_excerpt: participants should switch from the persistence model to an alternate
    model (without previous power values), should the farm be both constrained and
    operating close to the constrained cap value... potentially resulting in large
    power swings and increased forecast errors. We encountered a situation similar
    to this in our self-forecasts.
  confidence_note: transferability set to moderate — directly relevant to any NEM
