- record_id: ARENA-DLV-17653
  source_title: Meridian Energy Australia Wind Forecasting Demonstration Project Lessons
    Learnt 6
  publish_date: 2022-02
  project_name: Meridian Energy Australia Wind Forecasting Demonstration Project
  what_happened: Cross-correlation analysis of wind turbine power generation at Mt.
    Mercer found that correlations between turbines break down rapidly with distance
    beyond approximately 1 km, with some wider-spaced turbine pairs producing illogical
    negative-time optimal coherence values. This indicates wind does not propagate
    through the farm following Taylor's Frozen Turbulence Hypothesis and power signals
    become uncorrelated with increasing distance.
  lesson_learnt: Wind forecasting projects should not rely on upstream turbine power
    data to improve downstream turbine forecasts at distances greater than ~1 km —
    the cross-correlation between turbines degrades and becomes unreliable beyond
    this range, suggesting wind propagation effects invalidate simple turbulence-advection
    assumptions at farm scale.
