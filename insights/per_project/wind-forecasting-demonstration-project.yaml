  source_title: Meridian Energy Australia Wind Forecasting Demonstration Project Lessons
    Learnt 5
  publish_date: 2021-09
  project_name: Mt. Millar Wind Farm Wind Forecasting Demonstration Project
  what_happened: Market modelling using the Melbourne Energy Institute's electricity
    market model showed that larger wind forecast errors lead to greater wind curtailment,
    lower returns to wind generators, increased hours of unserved energy, and higher
    system greenhouse gas emissions. At wind penetration levels above 50% by annual
    energy, the negative effects of forecast error are amplified.
  lesson_learnt: 'Invest in improved short-term wind generation self-forecasting:
    better forecast accuracy reduces renewable curtailment, improves generator financial
    returns, and enhances system security and scheduling efficiency — effects that
    become more pronounced at high wind penetration levels.'
