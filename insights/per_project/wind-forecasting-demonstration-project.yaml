  what_happened: LIDARs measure only the 'along-the-beam' wind velocity component,
    requiring post-processing to reconstruct the full wind field, which constitutes
    a structural obstacle to real-time LIDAR applications in wind forecasting.
  lesson_learnt: Design LIDAR-based wind forecasting systems with explicit post-processing
    pipelines to reconstruct the wind field from along-the-beam measurements — this
    processing step is non-optional and its latency must be accounted for in real-time
    forecasting architectures.
