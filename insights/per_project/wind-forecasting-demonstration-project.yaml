  publish_date: 2020-09
  project_name: Meridian Energy Australia Wind Forecasting Demonstration Project
  what_happened: LIDAR-based wind forecast accuracy at Mount Mercer wind farm was
    found to be highly sensitive to the methodology used to extrapolate wind vectors
    to hub height, particularly in moderately complex topography where the LIDAR sampling
    altitude varies significantly across sectors.
  lesson_learnt: Forecasters using a scanning-head LIDAR should aim to probe the incoming
    wind field as close as possible to hub height, and hub-height extrapolation must
    account for atmospheric stability conditions and surrounding topography to achieve
    adequate forecast accuracy.
