- record_id: ARENA-DLV-21755
  source_title: Meridian Extended Forecasting Project Report
  publish_date: '2022-09-16'
  project_name: Meridian Energy Mount Mercer Wind Power Forecasting – Extended Forecasting
    Project
  what_happened: Clustering wind turbines by instantaneous power output (using k-means
    and hierarchical algorithms) did not reveal meaningful physical groupings related
    to wind direction — cluster labels were highly similar regardless of wind direction,
    with average NMI scores of 0.5 and above — because the approach ignored time lags
    and therefore wind propagation effects across the farm.
  lesson_learnt: Clustering wind turbines by instantaneous power alone is insufficient
    for capturing wind propagation dynamics; use time-series-aware clustering methods
    (such as k-shape) that account for lagged cross-correlations between turbines,
    stratified by wind direction, to obtain physically meaningful groupings for forecasting.
  issue_severity: minor
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The k-shape clustering algorithm, which accounts for time dependencies
    via normalised cross-correlation, was adopted as an alternative and successfully
    captured wind direction dependence across time periods.
  transferability: narrow
  delay_magnitude: null
  technology_domain: wind
  source_pages: &id040
  - 9
  - 11
  evidence_excerpt: We did not find strong evidence for a relationship between instantaneous
    power and wind direction. As this analysis did not account for time lags and therefore
    wind propagation through the form, we investigated lagged power values in 3.2
    onwards... pairs that shared the same wind direction had significantly larger
    normalised mutual information (NMI) scores compared to the average NMI over all
    pairs of cluster labels.
