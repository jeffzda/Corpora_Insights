- record_id: ARENA-DLV-21753
  source_title: Meridian Extended Forecasting Project Report
  publish_date: '2022-09-16'
  project_name: Meridian Energy Mount Mercer Wind Power Forecasting – Extended Forecasting
    Project
  what_happened: Initial ML models using basic features (lagged power, wind speed,
    wind speed cubed) with a naive chronological train/test split achieved only 2%
    RMSE improvement over the persistence model — a result insufficient to justify
    operational deployment — primarily because the one-year dataset created seasonally
    unbalanced training and test sets.
  lesson_learnt: A one-year dataset for wind forecasting is likely to produce seasonally
    unbalanced train/test splits under chronological splitting; projects should either
    collect multi-year data or use stratified sampling across time periods before
    committing to model evaluation, otherwise reported improvements over the persistence
    baseline will be misleadingly small.
  issue_severity: moderate
