- record_id: ARENA-DLV-0251
  source_title: The Electricity System Benefits of Improved, Short-Term Wind Generation
    Forecasts
  publish_date: '2022-09-16'
  project_name: Wind Forecasting Demonstration Project
  what_happened: Modelling of the NEM showed that short-term wind forecast errors
    have negligible market impact below approximately 30% VRE penetration by annual
    energy, because demand forecast uncertainty dominates operational uncertainty
    at that level. Above 30% VRE, wind forecast errors become the primary driver of
    operational uncertainty and begin to materially degrade market performance.
  lesson_learnt: System planners and project developers should treat the 30% VRE-by-annual-energy
    threshold as a trigger point for investing in improved wind forecasting capability
    — below this level, demand forecasting improvements offer greater operational
    benefit; above it, wind forecast accuracy becomes the dominant lever for reducing
    system costs and improving reliability.
