- record_id: ARENA-DLV-51807
  source_title: Meridian Energy Australia Wind Forecasting Demonstration Project Lessons
    Learnt 4
  publish_date: 2021-03
  project_name: Meridian Energy Australia Wind Forecasting Demonstration Project
  what_happened: In October 2020, the Bureau of Meteorology upgraded its ACCESS-VT
    model from APS2 to APS3, introducing widespread structural changes including altered
    file formats, new and removed meteorological variables, changed file and variable
    names, modified model topography, and changed timestamp recording. This required
    substantial rework of the code used to download, read, and process BoM data, and
    invalidated forecast models trained on pre-upgrade data, necessitating a moving-window
    training approach from October 2020 onwards.
  lesson_learnt: Projects relying on externally sourced meteorological or other data
    streams should closely monitor upstream provider upgrades — significant structural
    changes can invalidate trained models and require substantial code rework, and
    a moving-window training approach may be needed to manage the transition to new
    data formats.
