  source_title: 'Meridian Energy Australia - Wind Forecasting Demonstration Project
    Lessons Learnt Report #1'
  publish_date: 2019-10
  project_name: Meridian Energy Australia Wind Forecasting Demonstration Project
  what_happened: The project found that simple machine learning approaches performed
    no better than statistical methods when given only on-site farm data, indicating
    a skill cap on this class of forecasting techniques and suggesting that deep learning
    combined with off-farm data is likely essential to materially improve forecasting
    performance.
  lesson_learnt: Do not expect simple machine learning models trained solely on on-site
    wind farm data to outperform statistical methods — to substantially increase forecasting
    skill caps, projects must incorporate deep learning approaches and off-farm data
    sources.
