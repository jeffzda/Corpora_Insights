  evidence_excerpt: 'In selecting the forecasting algorithm there are two competing
    ideas: precision (low error in the forecast, important for implementation of an
    algorithm) and accuracy (higher rate of zero error, important for minimising FCAS
    payments)... in practise it may be better to allow for lower precision in favour
