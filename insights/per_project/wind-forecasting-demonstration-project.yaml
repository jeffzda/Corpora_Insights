- record_id: ARENA-DLV-21754
  source_title: Meridian Extended Forecasting Project Report
  publish_date: '2022-09-16'
  project_name: Meridian Energy Mount Mercer Wind Power Forecasting – Extended Forecasting
    Project
  what_happened: Inter-cluster variability features (variance, min-max difference,
    entropy, and sum of absolute differences between clusters as a percentage of total
    wind farm output) proved more informative than basic turbine-level or met mast
    features alone, lifting RMSE improvement over the persistence model from 2% to
    5–6% when combined with an improved train/test split.
  lesson_learnt: For short-horizon wind farm power forecasting, features that capture
    spatial variability across turbine clusters — rather than individual turbine or
    single-point met mast readings — are key to outperforming persistence; include
    inter-cluster dispersion metrics as standard features in any ML forecasting model
    for multi-turbine wind farms.
