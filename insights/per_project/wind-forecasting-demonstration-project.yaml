  source_title: Meridian Energy Australia Wind Forecasting Demonstration Project Lessons
    Learnt 2
  publish_date: 2020-04
  project_name: Meridian Energy Australia Wind Forecasting Demonstration Project
  what_happened: LIDAR data availability at Mt Mercer was found to be restricted not
    only by heavy rain (reported in the previous lessons learnt report) but also by
    heavy fog, which scatters the light beam sufficiently to render measurements unavailable.
    Separately, the project confirmed that moderate-to-heavy smoke from nearby fires
    in late 2019 did not inhibit LIDAR wind speed measurements at 10+ km range.
  lesson_learnt: Projects using LIDAR for wind forecasting must account for data unavailability
    during both heavy rain and heavy fog; however, smoke at moderate-to-heavy levels
    does not appear to impede measurement range, which is useful for planning data-availability
    assumptions in fire-prone regions.
