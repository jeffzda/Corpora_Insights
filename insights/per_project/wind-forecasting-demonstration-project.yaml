- record_id: ARENA-DLV-21010
  source_title: 'Meridian Energy Australia - Wind Forecasting Demonstration Project
    Lessons Learnt Report #1'
  publish_date: 2019-10
  project_name: Meridian Energy Australia Wind Forecasting Demonstration Project
  what_happened: The project identified a fundamental trade-off between forecasting
    precision (low error) and accuracy (high rate of zero error) when selecting the
    forecasting algorithm, with each optimising for different commercial objectives
    — precision for algorithm implementation and accuracy for minimising FCAS payments.
  lesson_learnt: When selecting a wind forecasting algorithm, explicitly define whether
    minimising FCAS payments (favouring accuracy/zero-error rate) or minimising average
    error (favouring precision) is the primary objective — in practice, allow for
    lower precision in favour of higher accuracy to reduce market costs.
  issue_severity: minor
  project_type: software/data/digital
  project_scale_band: demonstration
