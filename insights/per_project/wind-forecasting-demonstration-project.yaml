  intervention_note: Reconfigured LIDAR to a physical resolution of at least 75m to
    avoid scanning range ambiguity errors.
  transferability: narrow
  delay_magnitude: null
  technology_domain: wind
  source_pages: &id028
  - 3
  evidence_excerpt: The LIDAR tends to produce erroneous measurements when scanning
    with high physical resolution (<50 m) due to a weather dependent phenomenon referred
    to as 'scanning range ambiguity'... In order to avoid ambiguity, it is advised
    to setup up the LIDAR with a physical resolution of a least 75 m.
