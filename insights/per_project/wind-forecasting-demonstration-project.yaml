  what_happened: LIDAR-based forecasts at Mount Mercer performed very poorly during
    frontal passage events — precisely the periods when accurate forecasts were most
    needed — because rain associated with fronts degraded LIDAR data availability
    and visibility.
  lesson_learnt: Forecasters using LIDAR should plan for poor forecast performance
    during rain events and frontal passages; however, the progressive decrease in
    LIDAR clear vision range may be usable as a leading indicator of upcoming wind
    power ramps, offering a partial mitigation.
