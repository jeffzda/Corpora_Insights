- record_id: ARENA-DLV-17651
  source_title: Meridian Energy Australia Wind Forecasting Demonstration Project Lessons
    Learnt 6
  publish_date: 2022-02
  project_name: Meridian Energy Australia Wind Forecasting Demonstration Project
  what_happened: Sub-dividing the Mt. Mercer wind farm into increasing numbers of
    wind turbine clusters improved forecast accuracy only up to 18 clusters, beyond
    which no further accuracy gain was observed. The improvement from 1 to 18 clusters
    reduced RMSE from 5.28 MW to 5.14 MW and MAE from 3.14 to 3.08 MW — approximately
    1.9% improvement for a significant increase in model complexity.
  lesson_learnt: Forecasters should weigh the marginal accuracy benefit (~1.9%) of
    sub-cluster wind forecasting against the substantial increase in complexity (1
    to 18+ data streams); beyond 18 clusters no further accuracy gain is achieved,
    favouring simpler single-stream approaches for live forecasting unless minimal
    error is the overriding priority.
