- record_id: ARENA-DLV-21013
  source_title: 'Meridian Energy Australia - Wind Forecasting Demonstration Project
    Lessons Learnt Report #1'
  publish_date: 2019-10
  project_name: Meridian Energy Australia Wind Forecasting Demonstration Project
  what_happened: The LIDAR produced erroneous measurements when configured with high
    physical resolution (less than 50m) due to a weather-dependent 'scanning range
    ambiguity' phenomenon, where the backscattered signal from a previous pulse exceeded
    the current pulse signal.
  lesson_learnt: Configure LIDAR physical resolution at 75m or greater to avoid scanning
    range ambiguity errors — configurations below 50m produce unreliable measurements
    under weather-dependent conditions and will corrupt forecasting datasets.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: utility/energy retailer
