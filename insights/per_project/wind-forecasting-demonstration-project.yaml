- record_id: ARENA-DLV-51809
  source_title: Meridian Energy Australia Wind Forecasting Demonstration Project Lessons
    Learnt 4
  publish_date: 2021-03
  project_name: Meridian Energy Australia Wind Forecasting Demonstration Project
  what_happened: LIDAR vertical scan data from Mt Mercer revealed the occurrence of
    nocturnal boundary layer Low-Level Jets (LLJs) at 300–500m above the surface,
    which injected strong winds from the upper atmosphere during otherwise still nights
    and caused concurrent increases in power output that would not be predicted by
    standard forecasting approaches.
  lesson_learnt: Wind farm projects should be aware of site-specific nocturnal boundary
    layer phenomena such as Low-Level Jets, which can cause unexpected increases in
    power output during otherwise still nights — LIDAR vertical scanning is an effective
    tool for identifying these phenomena and their power output impacts.
