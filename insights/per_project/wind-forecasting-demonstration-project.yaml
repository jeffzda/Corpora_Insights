  project_name: Meridian Energy Australia Wind Forecasting Demonstration Project
  what_happened: From 12 March 2020, a secondary forecast targeted at the 370-second
    submission window closure was introduced alongside the primary 390-second forecast;
    this improved MAE improvement over AWEFS from 9% to 16% and RMSE improvement from
    7% to 16% without a major change in forecasting approach.
