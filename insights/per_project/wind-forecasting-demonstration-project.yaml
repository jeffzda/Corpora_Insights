  source_title: Meridian Extended Forecasting Project Report
  publish_date: '2022-09-16'
  project_name: Meridian Energy Mount Mercer Wind Power Forecasting – Extended Forecasting
    Project
  what_happened: Eight turbine clusters was identified as the modelling 'sweet point'
    — providing enough spatial averaging to reduce forecast error while retaining
    enough granularity to capture small power fluctuations that fewer clusters would
    average out — achieving 5.2–6.2% RMSE improvement over persistence depending on
    train/test split method.
  lesson_learnt: For wind farm forecasting models using cluster-based features, benchmark
    a range of cluster counts (not just 2–4) to find the optimal trade-off between
    noise attenuation and spatial resolution; for a 64-turbine farm of this configuration,
    8 clusters was the empirically determined optimum.
