- record_id: ARENA-DLV-51806
  source_title: Meridian Energy Australia Wind Forecasting Demonstration Project Lessons
    Learnt 4
  publish_date: 2021-03
  project_name: Meridian Energy Australia Wind Forecasting Demonstration Project
  what_happened: Further review of the causer pays savings methodology revealed that
    AEMO's published FCAS files provide step values rather than linear interpolation
    between forecasts, whereas the causer pays procedure requires calculating 4-second
    deviations from a linear trajectory between dispatch targets. The project's code
    had to be adapted to reconstruct the linear trajectory from the step-value data
    before assessment could be correctly undertaken.
  lesson_learnt: Projects using AEMO's published FCAS causer pays files must adapt
    the raw step-value data to reconstruct a linear trajectory between dispatch targets
    before calculating 4-second deviations — the raw files do not provide the linear
    interpolation required by the causer pays procedure.
