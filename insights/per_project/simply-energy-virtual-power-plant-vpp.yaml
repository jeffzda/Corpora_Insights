  what_happened: After the initial $5,100 subsidy offers were exhausted, Simply Energy
    launched reduced subsidy offers ($2,550 and $1,275). Monthly sign-ups dropped
    sharply from ~190 to ~45 per month (May–July 2020), with the reduced offers proving
    uncompetitive against rival VPP offers in the South Australian market that provided
    comparable discounts paid upfront.
