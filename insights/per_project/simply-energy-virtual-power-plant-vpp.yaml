- record_id: ARENA-DLV-23504
  source_title: Simply Energy VPPx – Stage 2 Knowledge Sharing Report
  publish_date: 2020-02
  project_name: Simply Energy VPPx
  what_happened: Simply Energy found that retaining control of the VPP sales conversation
    through its own call centre — rather than relying on third-party installers to
    explain VPP details and close the sale — was important to achieving successful
    sales conversions. When installers were treated as competitors in Stage 1, they
    were less cooperative; removing Simply Energy from direct battery sales eliminated
    competitive tension and improved installer referral quality.
  lesson_learnt: In a VPP referral model, the aggregator should control the VPP sales
    conversation directly (e.g. via a dedicated call centre) and avoid relying on
    installers to communicate complex VPP product details — installers are most effective
    as referral sources, not closers, and they cooperate more readily when the aggregator
    is not competing with them on battery sales.
  issue_severity: minor
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: coordination & stakeholders
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: Simply Energy funnelled all installer referrals through its own
    call centre and withdrew from direct battery sales, eliminating competitive tension
    with installers and ensuring VPP product messaging quality.
  transferability: moderate
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id003
