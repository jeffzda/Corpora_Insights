  project_name: Simply Energy VPPx
  what_happened: The VPPx fleet was unable to access FCAS market value throughout
    Stage 2 because the fleet size remained below the minimum 1 MW of firm dispatchable
    capacity required for FCAS market participation. Additionally, export limits at
    individual sites were expected to require a fleet of approximately 3 times nameplate
    capacity to reliably meet the FCAS minimum threshold.
  lesson_learnt: VPP developers targeting FCAS markets should plan for fleet sizes
    significantly larger than the nominal 1 MW threshold — export constraints at individual
    sites mean that 3x nameplate capacity may be required, and the fleet integration
    lag (12–16 weeks per customer) means FCAS access should not be assumed in programme
    timelines until well after sales milestones are met.
