  project_name: Simply Energy VPPx
  what_happened: During the trial, VPP benefit credits of up to $7 per day were applied
    to customer invoices and transferred to bank accounts when balances exceeded $50,
    creating frequent manual money-movement obligations for customer operations teams.
    An attempted self-service payout mechanism placed too much burden on customers
    and was abandoned.
  lesson_learnt: Design benefit payment structures for VPP products to minimise back-office
    processing — prefer a single upfront payment with a clawback clause, or low monthly
    credits, rather than frequent small credit transfers that require repeated manual
    bank transfers.
