  project_name: Simply Energy VPPx
  what_happened: The dispersed geographic distribution of VPPx batteries across the
    network prevented the fleet from accessing network services value streams, as
    no constrained network node had sufficient ESS penetration to deliver meaningful
    network support. The limited fleet size also meant only approximately $2,500 in
    total wholesale market cost offset was achieved over four months of market participation.
  lesson_learnt: VPP programmes seeking to unlock network services value should target
    concentrated recruitment in specific network constrained areas rather than dispersed
    geographic enrolment — geographic dispersion optimises market diversity but forecloses
    network service revenue streams that require local ESS density.
