  what_happened: Sonnen battery systems, which were excluded from the final $1,000
    bonus upfront payment offer (due to the added cost and complication of needing
    a VPP enablement device — a 'droplet' — to integrate them into the Simply Energy
    VPP), saw no increase in sales during the final offer period, whereas Tesla and
    Eguana systems (which were eligible) experienced an immediate lift.
  lesson_learnt: Battery systems requiring additional integration hardware or software
    complexity to participate in a VPP impose a cost and operational burden that reduces
    their commercial attractiveness for VPP fleet inclusion — assess integration requirements
    and total cost of inclusion per battery type before committing to a multi-brand
    VPP fleet strategy.
