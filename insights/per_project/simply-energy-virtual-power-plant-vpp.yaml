- record_id: ARENA-DLV-23501
  source_title: Simply Energy VPPx – Stage 2 Knowledge Sharing Report
  publish_date: 2020-02
  project_name: Simply Energy VPPx
  what_happened: In Stage 1, Simply Energy's initial S.M.A.R.T Storage offer achieved
    only 42 sales from 1,137 leads (3.7% conversion), as the complex bundled product
    — requiring customers to purchase a Tesla Powerwall and sign a 5-year electricity
    plan — proved too expensive and difficult to communicate. The product was subsequently
    redesigned as a 'BYO model' in Stage 2, achieving a 56.2% conversion rate and
    478 total sales.
  lesson_learnt: VPP customer recruitment programmes should plan for lower-than-expected
    conversion rates due to the complexity of selling a technical product, competing
    government subsidies, and installation supply chain constraints — build in extended
    timelines and flexible product design from the outset.
  issue_severity: major
