- record_id: ARENA-DLV-58457
  source_title: Simply Energy VPPx – Lessons Learnt Report
  publish_date: 2022-12
  project_name: Simply Energy VPPx
  what_happened: When Simply Energy submitted updated FCAS plant lists to AEMO as
    its VPP customer base changed, multiple sites were found to still be registered
    to other aggregators' FCAS fleets even though those customers had switched to
    Simply Energy. No established process existed requiring departing aggregators
    to relinquish FCAS plant entitlements, delaying Simply Energy's ability to earn
    FCAS revenues from its expanded fleet.
  lesson_learnt: Advocate for — and anticipate regulatory gaps around — FCAS deregistration
    obligations when customers switch VPP operators. The absence of a mandatory relinquishment
    process for FCAS-registered plant means an aggregator's fleet capacity and revenue
    may be constrained by the inaction of competitor aggregators.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: coordination & stakeholders
  intervention_note: Simply Energy flagged the issue to AEMO and advocated for a portfolio
    management tool and a revised fee model to facilitate timely deregistration and
    re-registration of NMIs.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id057
  - 10
