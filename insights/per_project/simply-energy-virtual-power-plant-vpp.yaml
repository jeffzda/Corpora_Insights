  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Simply Energy replaced the S.M.A.R.T Storage offer with a 'BYO
    Model' that separated the battery sale (handled by accredited installers) from
    the electricity and VPP participation offer, simplifying the sales process and
    enabling customers to stack SA HBS and VPP subsidies.
