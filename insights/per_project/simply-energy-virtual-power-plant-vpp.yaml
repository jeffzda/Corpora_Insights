  project_name: Simply Energy VPPx
  what_happened: Tesla Powerwall systems dominated the VPPx fleet, comprising over
    70% of installed batteries, driven by competitive subsidy levels, brand reputation,
    and VPP compatibility. Tesla tripled the number of Powerwall Certified Installers
    in SA over the project period to meet demand and ensure geographical coverage.
    Only Tesla Powerwall systems met AEMO's requirements for FCAS registration, limiting
    the FCAS-capable fleet to 4MW out of a total 6MW VPP.
  lesson_learnt: Brand reputation becomes the dominant deciding factor at the point
    of battery purchase even when it rated lower during research — VPP programs offering
    multiple battery brands should anticipate that one dominant brand (currently Tesla
    Powerwall) will disproportionately shape fleet composition unless subsidies actively
    favour alternatives.
