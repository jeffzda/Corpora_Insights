  source_title: Simply Energy VPPx – Stage 2 Knowledge Sharing Report
  publish_date: 2020-02
  project_name: Simply Energy VPPx
  what_happened: The Tesla Powerwall's reactive power dispatch test showed that the
    device prioritises real power dispatch over reactive power requests, meaning that
    only approximately half of the total reactive power dispatch demand from the fleet
    was met during the aggregated reactive power test. This is a manufacturer design
    choice that limits the VPP's ability to provide voltage support services.
  lesson_learnt: VPP operators seeking to offer network voltage support services via
    reactive power dispatch should verify manufacturer priority settings for real
    versus reactive power before onboarding a battery type — devices that prioritise
    real power will systematically underperform reactive power dispatch targets, limiting
    network service value.
