- record_id: ARENA-DLV-58459
  source_title: Simply Energy VPPx – Lessons Learnt Report
  publish_date: 2022-12
  project_name: Simply Energy VPPx
  what_happened: Proposed amendments to the Market Ancillary Service Specification
    (MASS) to accommodate two new very-fast FCAS markets raised the risk that future
    compliance requirements could become too stringent or misaligned with international
    markets, potentially reducing VPP operator participation and eroding the customer
    benefits underpinning the commercial VPP model.
  lesson_learnt: VPP operators providing residential FCAS services should actively
    monitor and provide feedback on MASS rule change consultations — rule changes
    that are out of step with international markets or that impose overly stringent
    requirements on existing participants can materially undermine the revenue case
    for residential VPP programs.
