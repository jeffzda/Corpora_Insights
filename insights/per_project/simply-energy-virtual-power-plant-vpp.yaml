  what_happened: Static, uniform export limits (5kVA per site) were identified as
    the dominant constraint on VPP dispatch, accounting for 63% of constrained power.
    These limits are set irrespective of local network conditions, preventing the
    VPP from utilising available capacity even when the network could support higher
    exports at specific times and locations.
  lesson_learnt: Static per-customer export limits are the single largest barrier
    to VPP dispatch efficiency — VPP programs should actively engage DNSPs to pilot
    dynamic export limits (operating envelopes) that allow higher exports when and
    where the network can support them, as this can relieve dispatch bottlenecks even
    during solar generation periods.
