- record_id: ARENA-DLV-58458
  source_title: Simply Energy VPPx – Lessons Learnt Report
  publish_date: 2022-12
  project_name: Simply Energy VPPx
  what_happened: Each update to the FCAS fleet register — including changes triggered
    by ordinary customer churn — required payment of a $2,175 fee to AEMO, creating
    a financial disincentive for smaller aggregators to keep fleet lists accurate
    and timely. The same level of verification and testing was required for fleet
    capacity increases using identical technology as for initial registration.
  lesson_learnt: The per-update AEMO FCAS fee structure ($2,175 per change) creates
    a systemic disincentive for smaller VPP aggregators to maintain accurate fleet
    registers — advocate for an annual flat-fee model and for reduced testing requirements
    when fleet expansions use unchanged technology, to lower the ongoing cost of operating
    a residential VPP at scale.
