  source_title: Simply Energy VPPx – Stage 3 Knowledge Sharing Report
  publish_date: 2021-08
  project_name: Simply Energy VPPx
  what_happened: For FCAS market registration, AEMO required a fleet-wide frequency
    injection test or narrowing of the frequency deadband. Manufacturers indicated
    a frequency injection test was not possible, requiring reliance on real-world
    frequency events. A further issue was that AEMO's fast FCAS service specification
    required 50ms metering at each connection point (costing >$14,000 each off-the-shelf),
    making participation in fast FCAS markets economically unviable for residential
    DER aggregations.
  lesson_learnt: AEMO's MASS v6.0 metering requirements for fast FCAS are designed
    for thermal generators and are disproportionately costly for residential DER aggregations
    — regulators should allow 1-second granularity metering verification for residential-scale
    DERs to enable cost-effective participation in fast FCAS markets.
