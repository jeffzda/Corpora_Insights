  what_happened: Customer research revealed that only 16% of respondents were comfortable
    with Simply Energy controlling their battery, only 28% found the VPP product appealing,
    and 50% found the website overwhelming, indicating that VPP product communications
    were failing to build trust or clearly convey value. Simply Energy subsequently
    overhauled its VPPx webpage and simplified product messaging.
