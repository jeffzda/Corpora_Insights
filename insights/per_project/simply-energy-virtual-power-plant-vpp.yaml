  project_name: Simply Energy VPPx
  what_happened: AEMO's FCAS market registration process required that only NMIs registered
    with AEMO for frequency response count toward the registered fleet capacity. As
    customers churn, registered NMIs cannot be replaced on a one-for-one basis without
    full re-registration of the fleet, causing registered FCAS capacity to decline
    over time as customers exit the program.
  lesson_learnt: VPP operators bidding into FCAS markets should account for customer
    churn reducing registered capacity over time — the current AEMO re-registration
    process for DER FCAS fleets imposes a disproportionate burden and should be streamlined
    to allow like-for-like NMI substitution.
