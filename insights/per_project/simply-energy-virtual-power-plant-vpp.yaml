- record_id: ARENA-DLV-23525
  source_title: Simply Energy VPPx – Stage 2 Knowledge Sharing Report
  publish_date: 2020-02
  project_name: Simply Energy VPPx
  what_happened: Individual battery tests demonstrated that peak power discharge was
    limited to 3–4 kW rather than the nominal 5 kW capacity due to either network-imposed
    export limitations or grid voltage exceeding 253V. Seasonal variation tests across
    12 months confirmed that export constraints and over-voltage conditions vary significantly
    by season, with the worst constraints occurring during high solar generation periods.
  lesson_learnt: VPP dispatch capacity modelling must account for seasonal variation
    in grid voltage and solar export coincidence — nameplate battery capacity is systematically
    unavailable during peak solar generation periods when export limits and over-voltage
    conditions are most active, meaning dispatch capacity should be modelled on constrained
    rather than rated output.
