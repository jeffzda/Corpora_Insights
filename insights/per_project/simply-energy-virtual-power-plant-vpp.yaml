  project_name: Simply Energy VPPx
  what_happened: 'Customer survey data identified that cost factors dominated all
    stages of the residential battery purchasing decision: the top triggers for purchase
    were savings on energy bills and availability of government subsidy; the top research
    considerations were available subsidies and cost of the energy solution; and five
    of the top six barriers to purchase were cost-related (cost of battery, loss of
    premium feed-in-tariff, ROI, cost of solar, amount of subsidy).'
  lesson_learnt: Financial incentives (subsidy level and bill savings) are the overwhelmingly
    dominant driver of residential battery and VPP adoption — program designers should
    prioritise subsidy adequacy and transparency of financial returns over technology
    or brand messaging; environmental motivations are a secondary driver for approximately
    one quarter of customers.
