  project_name: Simply Energy VPPx
  what_happened: 'Simply Energy applied differentiated subsidy levels based on inverter
    size and battery type — higher subsidies for 5kVA systems (Tesla, LG Chem, Eguana)
    and lower subsidies for ≤3.3kVA systems (Sonnen, Varta) — to steer the composition
    of the VPP fleet toward higher-value assets. The approach was effective: Tesla
    Powerwalls (5kVA) came to represent over 70% of installed batteries.'
  lesson_learnt: Differentiating VPP incentive payments by the technical value of
    each asset type (e.g. inverter size, dispatch capability) is an effective mechanism
    for VPP operators to optimise fleet composition — build this differentiation into
    offer design from the outset rather than retrofitting it.
