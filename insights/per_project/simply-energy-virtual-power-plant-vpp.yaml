  source_title: Simply Energy VPPx – Stage 2 Knowledge Sharing Report
  publish_date: 2020-02
  project_name: Simply Energy VPPx
  what_happened: Home batteries offering FCAS services cannot simultaneously be available
    for normal VPP dispatch, requiring the aggregator to choose between revenue streams
    in advance based on market forecasts. The window for FCAS value extraction is
    often small and unpredictable, increasing the difficulty of optimal dispatch scheduling.
  lesson_learnt: VPP operators must develop sophisticated forecasting and market intelligence
    capabilities to determine in advance whether to commit fleet assets to FCAS, wholesale
    market dispatch, or network services — failure to manage this trade-off will result
    in systematic under-capture of available value across all revenue streams.
