  project_name: Simply Energy VPPx
  what_happened: The deX development team, under time pressure to demonstrate proof-of-concept
    for each module, identified after the fact that they had built test use cases
    and then developed frameworks around them, rather than first identifying multiple
    use cases and building a standardised framework to support development and future
    functionality. This approach limited the reusability and efficiency of the development
    process.
  lesson_learnt: Digital platform development under time-constrained proof-of-concept
    conditions should invest upfront in identifying multiple use cases and designing
    a standardised framework before building individual modules — framework-first
    development is more efficient than retrofitting a framework around completed use-case
    implementations.
