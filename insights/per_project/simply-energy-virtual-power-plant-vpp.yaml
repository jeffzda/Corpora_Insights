- record_id: ARENA-DLV-23507
  source_title: Simply Energy VPPx – Stage 2 Knowledge Sharing Report
  publish_date: 2020-02
  project_name: Simply Energy VPPx
  what_happened: In Stage 1, Simply Energy managed battery installations directly
    and encountered significant challenges including installer availability, issues
    with existing solar installations, and the need for site inspections. In Stage
    2, by adopting the BYO model, Simply Energy transferred all installation responsibility
    to third-party installers, but found that customers still associated installation
    problems with Simply Energy when it had provided the installer referral.
  lesson_learnt: Residential battery VPP programmes should pre-contract installation
    capacity before launching sales campaigns; installer supply chains are constrained
    by the dominant new-solar market and can be further disrupted by concurrent government
    subsidy programmes, creating bottlenecks that directly limit installation throughput.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: construction/installation
  proponent_type: utility/energy retailer
  delay_category: construction/installation
  failure_mode: coordination & stakeholders
  outcome_class: delayed but recoverable
  secondary_failure_mode: null
  intervention_note: Simply Energy implemented close monitoring of third-party installer
    performance and provided direct support to customers on transfer processes, VPP
    credit commencement, and meter requirements.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages:
