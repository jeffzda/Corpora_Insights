  source_title: Simply Energy VPPx – Stage 2 Knowledge Sharing Report
  publish_date: 2020-02
  project_name: Simply Energy VPPx
  what_happened: VPPx demonstrated that static site export limits set by the DNSP
    are the primary constraint on VPP dispatch effectiveness and that the deX platform's
    dynamic connection agreement capability could theoretically enable DNSPs to vary
    export limits in real time based on local network conditions. This functionality
    was identified as a key development priority but was not yet operational during
    Stage 2.
  lesson_learnt: Dynamic connection agreements — where the DNSP can vary individual
    site export limits based on real-time network conditions — represent the most
    impactful single reform to unlock VPP dispatch value; VPP developers and DNSPs
    should jointly prioritise their development and the deX platform architecture
    already provides a technical pathway to implement them.
