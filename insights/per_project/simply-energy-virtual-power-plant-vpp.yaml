  what_happened: Simply Energy was required to acquire a generation licence in South
    Australia for the VPPx project. An exemption was requested in October 2019, granted
    until June 2021, and later extended to June 2023. Simply Energy argued the existing
    licensing framework is inappropriate for VPPs because VPPs consist of multiple
    geographically unrelated connection points, each with individual connection agreements.
  lesson_learnt: VPP proponents should anticipate generation licensing requirements
    and seek exemptions early — the current licensing framework was designed for centralised
    plant and does not fit the distributed architecture of a VPP, creating unnecessary
    regulatory overhead and cost that reduces value passed to customers.
