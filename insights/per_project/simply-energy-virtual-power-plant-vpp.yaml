  source_title: Simply Energy VPPx – Stage 2 Knowledge Sharing Report
  publish_date: 2020-02
  project_name: Simply Energy VPPx
  what_happened: Simply Energy was unable to access the South Australian Home Battery
    Scheme (HBS) subsidy directly because it was not a CEC-accredited Solar Retailer.
    Access to the HBS subsidy through a network of accredited installer partners proved
    to be the critical factor in making the VPP offer commercially competitive, with
    installer referrals becoming the largest lead source (43%) and the most effective
    conversion channel.
  lesson_learnt: VPP aggregators who are not CEC-accredited retailers should build
    a network of accredited installer partners to access government battery subsidies
    — the ability to stack a government subsidy with a VPP access credit was the primary
    driver of competitive advantage and customer acquisition in this market.
