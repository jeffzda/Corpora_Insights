  what_happened: When the subsidised trial period ended in March 2022, Simply Energy
    needed to transition approximately 1,300 customers onto a new unsubsidised VPP
    product. The original plan required customers to actively sign up to a new offer
    online or over the phone, which proved too burdensome and risked high churn.
  lesson_learnt: Design the subsidy-exit transition so that customers do not need
    to take any active steps to remain on the program — send an abridged variation
    notice rather than requiring re-enrolment. Minimising customer effort at transition
    is critical to retaining the fleet built during a subsidised pilot.
