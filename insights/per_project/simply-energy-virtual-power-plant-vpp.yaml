  project_name: Simply Energy VPPx
  what_happened: FCAS participation requires high-speed metering at 50ms or less per
    ESS under MASS requirements, which is uneconomical when applied to each individual
    residential ESS in a VPP. Simply Energy navigated this by reaching an agreement
    with the AEMO VPP Demonstrations Program requiring only one high-speed meter per
    region with one-second data capability for the aggregation.
  lesson_learnt: VPP developers planning FCAS participation should engage AEMO early
    to understand metering concessions available through the VPP Demonstrations Program
    — individual ESS high-speed metering requirements are commercially unviable at
    scale, and programme-level metering agreements can resolve this barrier.
