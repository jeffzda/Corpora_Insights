- record_id: ARENA-DLV-23520
  source_title: Simply Energy VPPx – Stage 2 Knowledge Sharing Report
  publish_date: 2020-02
  project_name: Simply Energy VPPx
  what_happened: The role of Distributed Market Operator (DMO) was effectively played
    by the VPPx project consortium for the purpose of testing DSO contracting and
    mediation rules, revealing that the DMO and DSO roles are distinct (one having
    financial responsibility, the other responsible for physical system integrity),
    and that the DSO providing both operating envelopes and contracting for services
    creates a potential conflict of interest.
  lesson_learnt: Industry and regulatory frameworks for DER markets should clearly
    separate the DSO and DMO roles and establish mechanisms to manage the conflict
    of interest that arises when a DSO both constrains market activity and contracts
    to procure services from that market — an independent DMO or regulatory oversight
    may be required.
