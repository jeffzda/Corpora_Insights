- record_id: ARENA-DLV-43960
  source_title: Simply Energy VPPx – Lessons Learnt Report
  publish_date: 2020-10
  project_name: Simply Energy VPPx
  what_happened: The Simply Energy VPP offer competed directly with other VPP programs
    and battery subsidy offers in the South Australian market. When the reduced subsidy
    offer ($2,550) was launched in May 2020, it proved uncompetitive against rival
    VPP offers for Tesla Powerwall 2 systems that provided comparable discounts paid
    upfront rather than as monthly credits, contributing to the sharp sales decline.
  lesson_learnt: In a market with multiple competing VPP and battery subsidy offers,
    the payment structure matters as much as the total subsidy quantum — customers
    prefer upfront payments over equivalent value delivered as monthly credits; future
    VPP offers should consider upfront or accelerated payment structures to remain
    competitive.
