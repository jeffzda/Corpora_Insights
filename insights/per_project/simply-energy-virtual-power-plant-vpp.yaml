- record_id: ARENA-DLV-43953
  source_title: Simply Energy VPPx – Lessons Learnt Report
  publish_date: 2020-10
  project_name: Simply Energy VPPx
  what_happened: The imminent reduction in the SA HBS subsidy (announced 6 March 2020,
    effective 14 April 2020) triggered a 140% increase in average monthly VPP sales
    — from ~80 per month to ~190 per month — fully exhausting the 1,200 allocated
    VPP offers by end of March and generating a waiting list of 250 additional customers.
    The threat of losing a benefit proved a far greater demand driver than the initial
    announcement of the same benefit had been over the preceding year.
  lesson_learnt: The imminent withdrawal of a subsidy or benefit is a far more powerful
    demand trigger than its initial announcement — VPP and DER program designers should
    anticipate demand spikes ahead of subsidy reductions and build capacity buffers
    or waitlist management processes accordingly.
