- record_id: ARENA-DLV-23511
  source_title: Simply Energy VPPx – Stage 2 Knowledge Sharing Report
  publish_date: 2020-02
  project_name: Simply Energy VPPx
  what_happened: During a wholesale market dispatch event on 31 July 2019, some VPP
    fleet batteries recharged to a backup setting that differed from the agreed VPP
    setting after being dispatched. This caused immediate grid draw post-event as
    the sub-aggregator recharged batteries to the agreed setting. Customers on one
    battery type could manually alter backup reserve percentages via an app, which
    was contractually prohibited but practically unenforceable.
  lesson_learnt: VPP operators must design for — and technically enforce — consistent
    battery state-of-charge settings; contractual prohibitions on customer-side setting
    changes are insufficient without technical controls, and customer-controlled backup
    reserve settings can cause post-dispatch grid draw that, at scale, could create
    'flip-flop' market instability.
