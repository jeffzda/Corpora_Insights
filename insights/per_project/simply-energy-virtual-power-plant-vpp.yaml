  source_title: Simply Energy VPPx – Stage 3 Knowledge Sharing Report
  publish_date: 2021-08
  project_name: Simply Energy VPPx
  what_happened: Voltage measurements taken during VPP dispatch events showed that
    discharging during peak solar generation periods (10am, 2pm) caused average fleet
    voltage to rise to or exceed 250 volts, constraining battery discharge. By 6pm,
    when solar generation had declined and demand increased, starting voltages were
    240–242V and dispatch was most efficient (75% of nameplate capacity).
  lesson_learnt: VPP dispatch scheduling should prioritise evening windows (around
    6pm) when network voltage is lowest and dispatch efficiency is highest; daytime
    dispatches coinciding with peak solar export create voltage rise that constrains
    battery output and reduces effective VPP capacity.
