  source_title: Simply Energy VPPx – Stage 3 Knowledge Sharing Report
  publish_date: 2021-08
  project_name: Simply Energy VPPx
  what_happened: The VPPx project successfully registered for and traded in all six
    contingency FCAS markets from October 2020, generating approximately $483,000
    in FCAS revenue to end of June 2021. However, FCAS revenues were highly volatile
    — typically $16k–$25k per four-week period but spiking to ~$145k in March 2021
    during network outages. Opportunities to extract value from wholesale energy markets
    were found to be limited because FCAS availability must be removed from market
    offers to participate in the wholesale market.
  lesson_learnt: FCAS is the primary viable revenue stream for residential VPPs in
    the NEM — wholesale energy market participation creates a structural conflict
    with FCAS availability that limits its value; VPP operators should focus commercial
    strategy on FCAS while planning for revenue volatility driven by network events.
