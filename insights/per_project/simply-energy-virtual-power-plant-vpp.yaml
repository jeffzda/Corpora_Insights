- record_id: ARENA-DLV-23506
  source_title: Simply Energy VPPx – Stage 2 Knowledge Sharing Report
  publish_date: 2020-02
  project_name: Simply Energy VPPx
  what_happened: As at end of December 2019, Simply Energy had 432 VPP offer sales,
    but only 262 had confirmed installations and only 151 had been integrated into
    the VPP fleet. The typical timeframe from sale to VPP integration was 12–16 weeks,
    with 10 weeks on average between sign-up and battery installation, and a further
    1–2 weeks between installation and VPP integration. Delays were driven by installer
    backlog and battery availability.
  lesson_learnt: VPP programme managers should plan for a 12–16 week lag between customer
    sale and VPP fleet integration; this pipeline delay means that fleet size will
    significantly lag sales numbers in the short term, affecting the schedule for
    market participation tests and milestone reporting.
