- record_id: ARENA-DLV-23514
  source_title: Simply Energy VPPx – Stage 2 Knowledge Sharing Report
  publish_date: 2020-02
  project_name: Simply Energy VPPx
  what_happened: The VPP control software used by the aggregator (GreenSync's VPP
    software) was primarily designed for Commercial and Industrial fleets with smaller
    DER counts, and proved more limited in processing the large data volumes from
    a growing residential DER fleet than the deX platform itself. As fleet size grew,
    the data processing limitations of the aggregator-side VPP software became a bottleneck.
  lesson_learnt: VPP aggregators scaling from C&I to residential fleets should validate
    that their VPP control software can handle the higher DER count and data volumes
    of residential deployments before scaling — C&I-designed software may require
    significant re-engineering or replacement to support large residential fleets.
