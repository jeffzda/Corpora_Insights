  source_title: Simply Energy VPPx – Stage 3 Knowledge Sharing Report
  publish_date: 2021-08
  project_name: Simply Energy VPPx
  what_happened: Dispatch testing across four quarters and three times of day showed
    an average fleet dispatch effectiveness of only 61% of nameplate capacity. At
    10am dispatch effectiveness was 48% on average, rising to 61% at 2pm and 75% at
    6pm. The primary technical constraints limiting dispatch were static export limits
    (accounting for 63% of constrained power) and excessive grid voltage during solar
    generation periods.
  lesson_learnt: Static site export limits — set without accounting for co-located
    battery storage — are the dominant constraint on VPP dispatch effectiveness; VPP
    operators should engage DNSPs early to understand export limit settings at target
    sites and advocate for dynamic export limits, as a significantly larger fleet
    (up to 3x nameplate capacity) may be needed to meet FCAS minimum requirements.
