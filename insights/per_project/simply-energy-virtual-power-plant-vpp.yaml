  project_name: Simply Energy VPPx
  what_happened: The SA Government's Smarter Homes legislation (effective 28 September
    2020) placed additional technical requirements on inverters and introduced a Relevant
    Agent framework. The implications for VPPx were minor — inverters were deemed
    compliant and a Relevant Agent was nominated for all post-September 2020 installations.
    However, the project noted that emergency voltage raise measures used to curtail
    passive solar PV would also reduce battery inverter output capacity, creating
    unintended interactions with VPP operation.
  lesson_learnt: VPP operators should engage with state government emergency power
    system interventions (such as emergency voltage raise or solar curtailment schemes)
    to ensure these measures account for VPP capabilities and do not inadvertently
    constrain VPP battery output — VPPs can constructively respond to curtailment
    requests rather than simply tripping generation.
