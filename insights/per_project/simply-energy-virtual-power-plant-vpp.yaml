  what_happened: Voltage rise observed at the inverter during VPP dispatch was found
    to partly arise from impedance in the customer's service main and household wiring,
    meaning it does not fully manifest at the network connection point. SAPN's rollout
    of line drop compensation upgrades to 140 zone substations (completed Q4 2020–Q1
    2021) was expected to reduce downstream voltage rise but had not yet been re-tested
    at VPP sites.
