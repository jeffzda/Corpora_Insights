  what_happened: Registering the VPP fleet with AEMO for FCAS participation required
    multiple application forms, extensive documentation, and real-time fleet capability
    testing that could only be completed when a live grid frequency disturbance of
    sufficient magnitude occurred. The fleet capability testing process alone lasted
    several weeks while waiting for a qualifying frequency event.
  lesson_learnt: Plan for AEMO FCAS fleet registration to be a multi-week process
    requiring real-time frequency disturbance events that cannot be simulated — build
    this into project schedules and budget for the testing and documentation overhead
    before expecting to earn FCAS revenues.
