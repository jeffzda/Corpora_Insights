- record_id: ARENA-DLV-18103
  source_title: Solcast Nowcasting Lessons Learnt Report 3
  publish_date: 2020-09
  project_name: Solcast Nowcasting for Solar Farms and the Australian Energy Sector
  what_happened: Operational experience across eight solar farms revealed that spurious
    SCADA data (missing, stuck, old, or inconsistent measurements), sky-imager contamination
    from dust, birds, and insects, and AEMO API authentication failures are the most
    common real-time issues degrading forecast system performance and stability.
  lesson_learnt: Future solar forecasting projects must build automated real-time
    monitoring for at least three failure modes — spurious SCADA data, sky-imager
    contamination, and API authentication failures — and must retain the ability to
    quickly suppress forecasts when spurious input data requires external intervention.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: null
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated integration
  intervention_note: Solcast implemented a multi-input ensemble forecasting approach
    with real-time error checking and data validation to exclude spurious sky-imager
    outputs from the forecast blend.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages:
  - 3
  - 4
  - 5
  evidence_excerpt: The most common issue is dirt residue on lens caused by rain or
    wind, but Solcast has also encountered insects crawling over the lens, birds landing
    on them, and residue from bird droppings. These issues are easily rectified by
    periodically wiping the lens, but can cause well-designed algorithms to produce
    significant forecasting errors even under completely clear skies by misidentifying
    local foreign objects as cloud cover.
