- record_id: ARENA-DLV-58604
  source_title: Solcast Nowcasting Lessons Learnt Report 2
  publish_date: 2020-04
  project_name: Solcast Nowcasting for Solar Farms and the Australian Energy Sector
  what_happened: Solcast found that sky-imager inputs add meaningful accuracy improvement
    only within the 0–30 minute forecasting horizon; beyond 30 minutes, sky-imager
    data added little value to the ensemble relative to satellite and SCADA inputs
    alone.
  lesson_learnt: When designing short-term solar forecasting systems, sky-imager investment
    is only justified for sub-30-minute forecasting horizons — for longer horizons,
    satellite nowcasting combined with SCADA reweighting is sufficient and avoids
    the maintenance and reliability burden of on-site sky-imager hardware.
