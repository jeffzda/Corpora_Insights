- record_id: ARENA-DLV-58605
  source_title: Solcast Nowcasting Lessons Learnt Report 2
  publish_date: 2020-04
  project_name: Solcast Nowcasting for Solar Farms and the Australian Energy Sector
  what_happened: Solcast demonstrated that centralising complex forecasting computation
    in cloud-hosted servers while deploying low-cost configurable on-site hardware
    reduced forecast improvement iteration time and increased the speed of hardware
    and algorithm upgrades across all eight deployed solar farms.
  lesson_learnt: Solar forecasting deployments should centralise modelling infrastructure
    in cloud-hosted systems and minimise on-site computational hardware — this architecture
    enables rapid algorithm iteration, easier upgrades, and faster deployment across
    multiple sites without site-by-site intervention.
