  failure_mode: design assumption failure
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: Adopted a three-component ensemble forecasting architecture blending
    satellite nowcasting, SCADA data reweighting, and sky-imager inputs, demonstrating
    reduced errors compared with ASEFS at all eight solar farms.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages:
  - 2
  - 3
  evidence_excerpt: The Project demonstrated sky-imager technology can improve forecast
    accuracy over the short-term, but that an ensemble forecasting approach considering
