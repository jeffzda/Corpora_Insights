- record_id: ARENA-DLV-18102
  source_title: Solcast Nowcasting Lessons Learnt Report 3
  publish_date: 2020-09
  project_name: Solcast Nowcasting for Solar Farms and the Australian Energy Sector
  what_happened: The project found that AEMO's use of HTTP response codes is not always
    consistent with industry convention, with insufficient delineation between client
    errors (4xx) and server errors (5xx), and between successful (2xx) and late submissions
    — causing downstream monitoring and reliability metric issues for participants.
  lesson_learnt: Future projects submitting forecasts to the AEMO API should maintain
    detailed audit logs of API response codes for each dispatch interval and DUID,
    to accurately diagnose why forecasts are classified as 'DIS_EXCLUDED_MISSING_LATE_SF'
    and to distinguish system faults from network interruptions or AEMO-side issues.
