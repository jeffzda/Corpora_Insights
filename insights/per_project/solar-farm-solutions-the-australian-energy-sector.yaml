- record_id: ARENA-DLV-18101
  source_title: Solcast Nowcasting Lessons Learnt Report 3
  publish_date: 2020-09
  project_name: Solcast Nowcasting for Solar Farms and the Australian Energy Sector
  what_happened: The project found that forecast accuracy improvement relative to
    ASEFS is not a reliable proxy for estimating FCAS cost savings, because a MW deviation
    may not impact the power system negatively and can in fact be beneficial depending
    on system frequency. Multiplying forecast accuracy improvement by regulation costs
    does not produce accurate FCAS savings estimates.
  lesson_learnt: Do not assume forecast accuracy gain relative to ASEFS is a suitable
    proxy for FCAS savings — develop a dedicated FCAS simulation tool and engage closely
    with AEMO to understand the causer pays calculation methodology before estimating
    financial benefits of self-forecasting.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Developed an in-house FCAS simulation model that can reproduce
    AEMO's published MPF data, reducing the forecast algorithm iteration cycle from
    10+ weeks to minutes.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id001
  - 3
  - 4
  evidence_excerpt: Approaches that use forecast accuracy as a proxy for reductions
    in FCAS fees are therefore not robust and are not likely to produce accurate estimates
    of FCAS savings.
