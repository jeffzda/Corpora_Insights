- record_id: ARENA-DLV-58603
  source_title: Solcast Nowcasting Lessons Learnt Report 2
  publish_date: 2020-04
  project_name: Solcast Nowcasting for Solar Farms and the Australian Energy Sector
  what_happened: Solcast demonstrated that an ensemble forecasting approach combining
    satellite cloud nowcasting, real-time SCADA data, and sky-imager inputs produced
    lower forecasting errors than ASEFS (persistence-based forecasting) at all eight
    solar farms in the project, achieving AEMO accreditation for dispatch at six of
    the eight farms within the reporting period.
  lesson_learnt: For 5-minute-ahead NEM self-forecasting, an ensemble approach blending
    satellite nowcasting, SCADA reweighting, and sky-imager inputs outperforms persistence-based
    systems — this architecture should be the default design choice for solar farms
    seeking AEMO accreditation and reduced FCAS Causer Pays fees.
  issue_severity: minor
  project_type: software/data/digital
