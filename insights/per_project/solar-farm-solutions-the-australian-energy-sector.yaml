- record_id: ARENA-DLV-44703
  source_title: Solcast Nowcasting Lessons Learned Report 1
  publish_date: 2019-10
  project_name: Solcast nowcasting solutions for solar farms and the Australian energy
    sector
  what_happened: Historical solar farm power output data (1-minute resolution) was
    found on multiple occasions to contain large sections of unusable data caused
    by commissioning artefacts and spurious measurement errors, resulting in lower-than-expected
    model tuning effectiveness and forecast accuracy.
  lesson_learnt: Do not rely solely on historical SCADA data for model tuning — develop
    capability to tune using live SCADA measurements and build automated data quality
    control to detect and process spurious artefacts, as historical data quality from
    operational farms is frequently worse than anticipated.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: data/validation/testing
  failure_mode: data & measurement
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Solcast internally developed automated data quality control capability
    to detect and process spurious artefacts, added live SCADA measurement tuning
    to reduce dependence on historical data, and developed additional forecasting
    models to improve accuracy during morning and afternoon ramp periods.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id005
  - 2
  evidence_excerpt: Historical data (1 minute history of solar farm power output)
    was found on several occasions to have large sections of unusable data, due to
    commissioning phases, or spurious artefacts in the data... As the portion of bad
    data received was greater than expected, the impact of model tuning on forecast
    accuracy was lower than expected.
  confidence_note: lifecycle_phase set to operations as the data quality issue arose
