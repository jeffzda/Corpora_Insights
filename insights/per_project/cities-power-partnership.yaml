- record_id: ARENA-DLV-18603
  source_title: 'ARENA Insights Spotlight: The Cities Power Partnership'
  publish_date: 2019-08
  project_name: Bogie Bulk Buy (Strathbogie Shire)
  what_happened: Strathbogie Shire, a small rural council with limited resources,
    ran a solar bulk buy initiative (the Bogie Bulk Buy). The Cities Power Partnership
    provided media and communications support including a video that was viewed by
    hundreds of thousands of people, which increased local support and enabled Strathbogie
    to promote the model to surrounding councils. Six other Victorian councils subsequently
    adopted the Bogie Bulk Buy model.
  lesson_learnt: Small councils with limited resources can dramatically extend the
    reach of local clean energy initiatives through targeted communications support
    and profiling — media amplification of a small council's solar bulk buy drove
    adoption of the model across six neighbouring councils and catalysed plans for
    a battery bulk buy.
  issue_severity: minor
