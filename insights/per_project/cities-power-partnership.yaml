  evidence_excerpt: Many ARENA funded clean energy transition projects build tangible,
    first-of-its-kind assets. The Cities Power Partnership is different as it is building
    an intangible asset – an educated network of communities which share and create
    knowledge. Our program is set up so that councils interested in a new clean energy
    project can easily connect with other councils who have spearheaded a similar
    project.
  confidence_note: lifecycle_phase set to concept/feasibility as this record describes
