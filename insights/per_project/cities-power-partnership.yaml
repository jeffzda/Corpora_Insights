- record_id: ARENA-DLV-27304
  source_title: 'ARENA Insights Spotlight: Local Champions in the Cities Power Partnership'
  publish_date: 2019-08
  project_name: Strathbogie Shire Council — Cities Power Partnership participation
  what_happened: Strathbogie Shire Council, as a small rural municipality, found that
    the resource gap between rural and metropolitan councils created distinct challenges
    in the clean energy transition, which were not addressed until the council was
    able to articulate them through the Cities Power Partnership.
  lesson_learnt: Rural and small councils face structurally different resource constraints
    to metropolitan councils in delivering clean energy projects; joining a peer network
    that provides expert support and space to articulate these differences enables
    more appropriate, tailored solutions to be developed.
  issue_severity: minor
  project_type: DER/customer-side
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: concept/feasibility
  proponent_type: government/public-sector body
  delay_category: null
  failure_mode: coordination & stakeholders
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Joined the Cities Power Partnership to access expert support
    and peer networks, which enabled the council to articulate rural-specific challenges
    and develop appropriate solutions such as the Bogie Bulk Buy.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id006
  - 2
  evidence_excerpt: We are only two hours from Melbourne, but in many ways we are
    light-years apart when it comes to comparing metro and rural Council resources,
    and the diversity of issues we deal with across the clean energy transition. Joining
    the Climate Council's Cities Power Partnership provides expert support, and through
    working with the team, we have had the opportunity to articulate these differences
    and appropriate solutions, like the Bogie Bulk Buy.
  confidence_note: failure_mode set to resource/capability shortfall reflecting the
    structural resource gap described; issue_severity minor as the program participation
    resolved the gap.
