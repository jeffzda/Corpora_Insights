  source_title: 'ARENA Insights Spotlight: Local Champions in the Cities Power Partnership'
  publish_date: 2019-08
  project_name: Strathbogie Shire Council — Cities Power Partnership participation
  what_happened: Strathbogie Shire Council found that participation in the Cities
    Power Partnership engaged elected councillors and built internal political support
    for clean energy projects, including through activities such as electric vehicle
    test drives that converted councillors into advocates.
  lesson_learnt: Structured peer programs like the Cities Power Partnership can be
    used to build elected-member buy-in for clean energy projects — activities that
    give councillors direct experience with new technologies are particularly effective
    in converting sceptics into advocates.
