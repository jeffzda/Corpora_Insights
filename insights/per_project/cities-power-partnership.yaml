  evidence_excerpt: We helped to promote and celebrate the Bogie Bulk Buy, the council's
    solar bulk buy initiative, with media and communications support including shooting
    a video on the program which was viewed by hundreds of thousands of people across
    Australia and internationally. This profiling helped Strathbogie Shire increase
    local support for the solar bulk buy, which they then leveraged to take the model
    for the solar bulk buy to surrounding councils. So far six other Victorian councils
    have adopted the Bogie Bulk Buy model.
