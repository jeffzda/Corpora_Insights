  source_title: 'ARENA Insights Spotlight: The Cities Power Partnership'
  publish_date: 2019-08
  project_name: Cities Power Partnership
  what_happened: Member councils consistently identified peer-to-peer knowledge sharing
    with other councils working on similar projects as one of the most valuable aspects
    of the Cities Power Partnership program, leading to the development of a dedicated
    Knowledge Sharing hub built in partnership with emissions tracking platform Aziliy.
  lesson_learnt: When designing council clean energy support programs, prioritise
    structured peer knowledge-sharing infrastructure from the outset — councils place
    high value on connecting with peers who have direct experience of similar projects,
    and a dedicated platform enables this at scale.
