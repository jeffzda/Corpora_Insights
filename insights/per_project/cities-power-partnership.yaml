  publish_date: 2019-08
  project_name: Cities Power Partnership
  what_happened: Regional clusters of councils in the same area joined the Cities
    Power Partnership together, using collective participation to advance regional
    clean energy solutions rather than acting individually.
  lesson_learnt: Design council clean energy programs to cultivate regional 'hotspot'
    clustering — councils operating together in the same region achieve greater impact
    on emission reduction and clean energy projects than isolated individual council
    engagement.
