- record_id: ARENA-DLV-18604
  source_title: 'ARENA Insights Spotlight: The Cities Power Partnership'
  publish_date: 2019-08
  project_name: Cities Power Partnership
  what_happened: The Cities Power Partnership was structured as an intangible-asset
    program — building an educated, knowledge-sharing network of councils — rather
    than funding discrete physical assets, enabling members to learn from councils
    that had already delivered similar projects and avoid duplicating effort.
  lesson_learnt: ARENA-funded programs targeting council-level clean energy adoption
    can achieve broad portfolio impact by investing in network and knowledge infrastructure
    rather than only funding individual physical assets — this prevents each council
    from having to 'reinvent the wheel' on projects others have already delivered.
  issue_severity: none
  project_type: null
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: concept/feasibility
  proponent_type: government/public-sector body
