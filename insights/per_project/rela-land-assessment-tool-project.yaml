  source_title: RELA Land Assessment Tool Project - Interim Knowledge Sharing Report
  publish_date: 2025-09
  project_name: RELA Assess 2.0
  what_happened: Developing a land suitability model for wind turbine placement proved
    significantly more complex than initially anticipated, requiring a shift from
    a simple wind-speed heuristic to a simulation-based algorithm that iteratively
    places turbines while respecting multiple overlapping spatial constraints.
  lesson_learnt: Do not underestimate the analytical complexity of turbine placement
    modelling — invest in sophisticated backend analytics from the outset rather than
    starting with simplistic heuristics that will require substantial rework to deliver
    genuinely valuable insights.
