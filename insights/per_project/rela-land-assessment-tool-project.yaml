  source_title: RELA Land Assessment Tool Project - Interim Knowledge Sharing Report
  publish_date: 2025-09
  project_name: RELA Assess 2.0
  what_happened: Early UX design discussions revealed that two fundamentally different
    use cases existed — a desktop-first experience for detailed assessment authoring
    and a mobile-first experience for viewing and sharing results — which had not
    been adequately distinguished in initial design planning.
  lesson_learnt: Explicitly design for distinct use cases and user contexts from the
    outset of UX development — a tool used to author detailed assessments at a desk
    requires a fundamentally different interface from one used to share results socially
    on a mobile device.
  issue_severity: minor
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: null
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Adopted a 'pub test' design philosophy as a core UX principle,
    designing a mobile-first viewing and sharing experience alongside a separate desktop-first
    authoring experience.
  transferability: broad
  delay_magnitude: null
  technology_domain: other
  source_pages: &id007
  - 14
  evidence_excerpt: 'A key insight from early design discussions was the need to design
    for two distinct use cases: a desktop-first experience for the detailed authoring
    of an assessment, and a mobile-first experience for viewing and sharing the results.
    This ''pub test'' design philosophy, enabling a landowner to easily show their
    results to a neighbour, has become a core principle of the UX design.'
