  outcome_class: knowledge generated despite setback
  secondary_failure_mode: coordination & stakeholders
  intervention_note: Developed the Assess 2.0 platform as a free, publicly accessible,
    data-driven tool to provide independent land assessments, operationalising Free,
    Prior, and Informed Consent (FPIC) for land agreements.
  transferability: broad
  delay_magnitude: null
  technology_domain: other
  source_pages: &id011
  - 3
  evidence_excerpt: The project's core purpose is to resolve the significant information
    asymmetry between landholders and developers, which has been identified as one
    of the key barriers to achieving social licence for the coexistence of food &
    energy production on regional land... The project has confirmed that the central
    challenge is as much socio-political as it is technical, the building of trust
    being paramount.
