- record_id: ARENA-DLV-59411
  source_title: RELA Land Assessment Tool Project - Interim Knowledge Sharing Report
  publish_date: 2025-09
  project_name: RELA Assess 2.0
  what_happened: Information asymmetry between landholders and renewable energy developers
    was identified as a key structural barrier to social licence and land access,
    with landholders unable to independently assess the value and potential of their
    own land in the context of renewable energy proposals.
  lesson_learnt: Addressing information asymmetry between landholders and developers
    is as much a socio-political challenge as a technical one — tools designed to
    resolve it must build trust and be perceived as genuinely independent and fact-based
    by both parties to be effective.
  issue_severity: major
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: concept/feasibility
  proponent_type: technology vendor
  delay_category: null
