  what_happened: The RISB technology commercialisation strategy is structured as a
    licensing model targeting TRL 5 readiness after laboratory and benchtop validation,
    with pilot-scale trials (TRL 6/7) contingent on securing industry co-investment,
    and an initial focus on Australia before international expansion.
  lesson_learnt: For low-capital retrofit decarbonisation technologies targeting the
    existing BF-BOF steelmaking route, a licensing commercialisation pathway — sequenced
    through LCA/TEA de-risking before seeking industry co-investment for pilot trials
    — reduces the capital barrier for early adopters and provides a credible pathway
    from TRL 4/5 to TRL 7 without requiring greenfield infrastructure.
