- record_id: ARENA-DLV-0702
  source_title: 'UNSW, Blast Furnace Innovations: Integrating New Injections and Burdens
    for Sustainable, Low-Carbon Ironmaking Project - Core Research Midpoint Technical
    Report'
  publish_date: 2025-12
  project_name: 'UNSW Blast Furnace Innovations: Sustainable, Low-Carbon Ironmaking
    Project'
  what_happened: The 3D transient CFD blast furnace model — described as the first
    capable of simultaneously capturing both temporal and spatial features at industrial
    scale — presented major numerical and computational challenges, with computation
    potentially exceeding several hundred hours per case and requiring high stability
    over long physical simulation times.
  lesson_learnt: When developing first-of-kind transient multi-phase CFD models at
    industrial scale, plan for computation times potentially exceeding several hundred
    hours per case and build in dedicated numerical stability treatments (implicit
    time-stepping, adaptive meshing, simplified particle-shape representation) from
    the outset rather than retrofitting them after stability failures emerge.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Implemented implicit time-stepping, adaptive meshing, and simplified
    particle-shape representation to achieve both numerical stability and computational
    efficiency in long transient simulations.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: industrial renewables
  source_pages: &id002
  - 15
  evidence_excerpt: This is the first BF CFD model capable of simultaneously capturing
    both temporal and spatial features at an industrial scale. Simulating such a large,
    multiphase reactor with fully coupled flow, heat transfer, and chemical reactions
    presented major numerical and computational challenges. The complex transient
    solution process required high stability over long physical times, with computation
    potentially exceeding several hundred hours per case.
