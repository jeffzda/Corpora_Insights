  intervention_note: Implemented implicit time-stepping, coarse-graining, and simplified
    particle geometry, reducing simulation runtime by over an order of magnitude while
    preserving particle-scale accuracy.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: industrial renewables
