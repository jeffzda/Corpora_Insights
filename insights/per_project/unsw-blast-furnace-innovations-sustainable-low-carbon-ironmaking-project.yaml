  evidence_excerpt: To balance precision and computational cost, implicit time-stepping,
    coarse-graining, and simplified particle geometry were introduced. These reduced
    simulation time by over an order of magnitude while maintaining fidelity, establishing
    a practical workflow for industrial-scale predictive modelling.
