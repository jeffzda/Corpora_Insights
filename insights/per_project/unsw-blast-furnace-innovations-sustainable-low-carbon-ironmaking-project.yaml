  source_title: 'UNSW, Blast Furnace Innovations: Integrating New Injections and Burdens
    for Sustainable, Low-Carbon Ironmaking Project - Core Research Midpoint Technical
    Report'
  publish_date: 2025-12
  project_name: 'UNSW Blast Furnace Innovations: Sustainable, Low-Carbon Ironmaking
    Project'
  what_happened: Developing an industrial-scale reactive CFD-DEM model capable of
    simulating coupled gas–solid flow, heat transfer, and chemical reactions at furnace
    scale placed extreme demands on computational resources and numerical stability,
    with runtimes that were initially impractical for iterative scenario testing.
  lesson_learnt: For industrial-scale multi-physics simulation models in R&D projects,
    introduce coarse-graining, implicit time-stepping, and simplified particle geometry
    early in model design — these techniques reduced simulation time by over an order
    of magnitude while maintaining fidelity and made iterative scenario testing feasible
    within project timeframes.
