    Project'
  what_happened: Integrating heterogeneous simulation, experimental, and operational
    datasets into the machine learning model introduced data inconsistency and model
    uncertainty, threatening the physical validity and generalisability of predictions.
  lesson_learnt: When training ML models on mixed simulation, experimental, and operational
    data in industrial R&D projects, embed thermodynamic and kinetic constraints as
    physics-informed features from the outset — this ensures physically consistent
    and generalisable predictions and prevents data inconsistency from undermining
    model reliability.
