  publish_date: 2025-12
  project_name: 'UNSW Blast Furnace Innovations: Sustainable, Low-Carbon Ironmaking
    Project'
  what_happened: The Heat and Mass Balance (HMB) model development was constrained
    by limited public data for new injection conditions (hydrogen-rich gas, biochar),
    requiring estimation of key parameters such as reserve-zone temperature and chemical
    efficiency without full experimental datasets.
  lesson_learnt: When modelling novel injection conditions for which public data is
    scarce, adopt a flexible equilibrium–kinetic framework calibrated with empirical
    data rather than waiting for complete experimental datasets — this approach enabled
    prediction of feasible operating windows and CO₂-saving potential and kept the
    project on schedule.
