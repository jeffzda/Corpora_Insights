- record_id: ARENA-DLV-45006
  source_title: Network Hosting Capacity Projects Progress Report (Year One)
  publish_date: 2020-03
  project_name: 'Jemena Electricity Networks: Demonstration of Three Dynamic Grid-Side
    Technologies'
  what_happened: Before proceeding to field installation of pole-mounted phase-switching
    devices, Jemena and partners completed bench testing to assess the effect of phase-shifting
    operation on common household appliances, specifically the impact of momentary
    power loss across the switching cycle.
  lesson_learnt: Bench testing of grid-side switching devices for their impact on
    household appliances is a necessary step before field deployment — it provides
    evidence of safety and acceptability to regulators, councils, and residents, and
    should be built into the project schedule for any technology that introduces momentary
    supply interruptions to residential customers.
