- record_id: ARENA-DLV-72007
  source_title: Australian Energy Resource Assessment — Second Edition, 2014
  publish_date: '2014'
  project_name: Australian Geothermal Sector — Grid Connection Impediment
  what_happened: Several of Australia's most prospective high-temperature geothermal
    resources (notably in the Cooper Basin) are located remote from existing electricity
    transmission infrastructure, creating a major cost barrier to grid-connected electricity
    generation that has impeded commercial development.
  lesson_learnt: Remote geothermal projects should evaluate off-grid and co-location
    market strategies (e.g. mine sites, data centres) as a lower-cost path to early
    commercialisation rather than attempting grid connection from remote locations,
    as transmission costs can render otherwise viable resources uneconomic.
  issue_severity: major
  project_type: generation
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: concept/feasibility
  proponent_type: project developer
  delay_category: grid connection/system studies
  failure_mode: commercial & market
  outcome_class: partial success
  secondary_failure_mode: poor scoping
  intervention_note: The National Electricity Market rules include a Scale Efficient
    Network Extension (SENE) framework providing commercial incentives for network
    businesses to build assets to efficient scale for generation clusters, which may
    assist geothermal projects; Geodynamics also investigated co-locating a large
    data centre at Innamincka to avoid transmission costs.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: other
  source_pages:
  - 234
  - 235
  evidence_excerpt: An impediment to the development of some of Australia's geothermal
    resources for geothermal electricity generation is the distance of some of the
    resources from existing transmission lines or consumption centres... The added
    cost of transmission infrastructure is likely to make electricity generation for
    supply into the NEM uneconomic in the near future.
  confidence_note: This is a structural sector-level finding rather than a single
    project delivery event, but has clear delivery implications for project developers
    selecting geothermal development strategies.; Published 2014 — commercial viability
    and demand conditions may be superseded by subsequent developments in this rapidly
    evolving field.
