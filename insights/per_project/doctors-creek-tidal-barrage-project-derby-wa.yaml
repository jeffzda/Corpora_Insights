- record_id: ARENA-DLV-23923
  source_title: Australia's Off-Grid Clean Energy Market Research Paper
  publish_date: '2014-10-08'
  project_name: Doctors Creek Tidal Barrage Project (Derby, WA)
  what_happened: A 48MW tidal barrage project investigated in the 1990s near Derby,
    WA was abandoned due to environmental concerns and cost overruns. In 2004 a diesel
    power plant was built to meet local electricity needs instead.
  lesson_learnt: Tidal barrage projects face high environmental impact risks and cost
    uncertainty that have historically led to abandonment — developers should complete
    detailed environmental assessment and cost validation before proceeding beyond
    concept stage, as these two factors caused the Doctors Creek project to be abandoned
    after significant development investment.
