- record_id: ARENA-DLV-39476
  source_title: NEV Power – Smart Grid Project Lessons Learned Report (2)
  publish_date: 2022-09
  project_name: Narara Ecovillage Smart Grid Project
  what_happened: Ausgrid's network tariffs did not reflect the value of NEV Power's
    community battery services to the network, and the tariff structure was not reduced
    to account for significantly lower grid usage as the community became more self-sufficient.
    Ausgrid has subsequently acknowledged that historic network tariffs provide incorrect
    price signals and embarked on three trials including dynamic network pricing,
    residential trial tariffs and community battery trials.
  lesson_learnt: Community embedded networks that reduce grid demand substantially
    should engage network operators proactively on tariff reform from the outset —
    standard network tariffs designed for passive load customers penalise low-consumption
    net-exporting communities and will not self-correct; formal participation in utility
    trials (e.g. dynamic pricing, community battery trials) is the most direct path
    to fairer pricing.
