  source_title: NEV Power – Smart Grid Project Lessons Learned Report (2)
  publish_date: 2022-09
  project_name: Narara Ecovillage Smart Grid Project
  what_happened: Development of some home lots took longer than planned due to changes
    in individual household circumstances after lot purchase, with each change adding
    approximately two years to the build time. One lot changed hands three times.
    This slowed the growth of the customer base and exacerbated the financial viability
    problem from a low customer count.
  lesson_learnt: Community title housing developments should model conservative lot
    buildout timescales that account for lot resales and changes in household circumstances
    — each ownership change can add two years to the build timeline, delaying the
    customer base growth that community energy infrastructure depends on for financial
    viability.
