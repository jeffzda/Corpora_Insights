- record_id: ARENA-DLV-39458
  source_title: NEV Power – Smart Grid Project Lessons Learned Report (2)
  publish_date: 2022-09
  project_name: Narara Ecovillage Smart Grid Project
  what_happened: NEV Power's energy retailer (Shell) declined to renew its supply
    contract, leaving the community embedded network without a retailer. As a net
    power generator exporting approximately seven times its imported energy, the community
    could not find a suitable retailer able or willing to handle this profile.
  lesson_learnt: Communities developing embedded networks with high solar penetration
    should secure a long-term retailer agreement early and model the scenario where
    the retailer exits — a net-exporting community profile is unattractive to standard
    retailers and finding a replacement can threaten operational continuity.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: community/local body
  delay_category: financing/commercial close
  failure_mode: commercial & market
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: NEV Power is actively seeking a new retailer and investigating
    VPP participation to generate battery revenue as an alternative income stream.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id005
  - 10
  - 19
  evidence_excerpt: The operating margin for each kWh supplied to customers is currently
    between 7.5c and 12c. That may reduce as the current energy retailer, Shell, has
    declined to renew the contract... The community is also struggling to find a retailer
    for the site.
