- record_id: ARENA-DLV-39469
  source_title: NEV Power – Smart Grid Project Lessons Learned Report (2)
  publish_date: 2022-09
  project_name: Narara Ecovillage Smart Grid Project
  what_happened: The community smart grid is a large net power exporter — exporting
    approximately seven times the annual kWh it imports from the Ausgrid network.
    This profile, combined with minimal on-site energy consumption, means the embedded
    network revenue model based on energy sales to customers is not viable, as most
    customers are net exporters and the operating margin per kWh is very thin.
  lesson_learnt: Community smart grid business models must account for the scenario
    where high solar penetration and energy-efficient homes turn the community into
    a net exporter — revenue models dependent on energy sales margins collapse in
    this case, and alternative revenue streams (battery services, VPP, grid support
    payments) must be planned from the outset.
