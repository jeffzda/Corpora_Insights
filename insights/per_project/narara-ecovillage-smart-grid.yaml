- record_id: ARENA-DLV-44557
  source_title: Narara Ecovillage Smart Grid Project Lessons Learnt
  publish_date: 2020-10
  project_name: Narara Ecovillage Smart Grid Project
  what_happened: Personnel changes at both Ausgrid and the Ecovillage meant that original
    grid connection conversations and agreements had to be restarted. The Ecovillage
    was seeking bespoke innovation support but was directed through Ausgrid's standard
    Major Connections process, creating misalignment and large delays in re-engaging
    with the right internal teams.
  lesson_learnt: When engaging a network operator on a novel embedded generation project,
    identify and maintain contact with the innovation or new technology team rather
    than relying solely on standard connections processes — personnel turnover can
    destroy institutional memory, and the standard process may not accommodate bespoke
    technical solutions.
