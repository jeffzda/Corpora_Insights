  what_happened: WiFi-based metering proved unreliable because it was not always available
    — households lacked WiFi, routers were turned off, or passwords were changed.
    LoRaWAN was deployed as a replacement but the RAK brand hardware experienced reliability
    issues and data dropouts that were still being resolved at the time of the report.
  lesson_learnt: Do not rely on household WiFi for smart meter data collection in
    community settings — deploy a dedicated low-power wide-area network (e.g. LoRaWAN)
    from the outset, and validate hardware reliability with the supplier before full
    deployment as some hardware brands have known dropout issues.
