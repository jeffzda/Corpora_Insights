- record_id: ARENA-DLV-39461
  source_title: NEV Power – Smart Grid Project Lessons Learned Report (2)
  publish_date: 2022-09
  project_name: Narara Ecovillage Smart Grid Project
  what_happened: 'NEV Power connected to Ausgrid as a high voltage (11kV) customer.
    In retrospect, this created unnecessary cost and complexity: HV connection tariffs
    were high, HV maintenance required specialised skills, the OLTC transformer became
    largely redundant once the battery was installed, and the community ultimately
    only consumed approximately 30kVA of supply. Battery grid-forming inverters can
    now control voltage, making LV connection the better option.'
  lesson_learnt: Community embedded networks should connect at low voltage, not high
    voltage — the additional cost, technical complexity, specialised maintenance requirements
    and high network tariffs of an HV connection are not justified for community-scale
    generation; modern battery inverters can manage voltage without an OLTC transformer.
