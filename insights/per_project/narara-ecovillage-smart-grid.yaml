- record_id: ARENA-DLV-39457
  source_title: NEV Power – Smart Grid Project Lessons Learned Report (2)
  publish_date: 2022-09
  project_name: Narara Ecovillage Smart Grid Project
  what_happened: Higher operating and maintenance costs from the high voltage connection,
    specialised skills requirements and high network tariffs were compounded by an
    initially low customer base. NEV Power operated at a loss of over $52,000 per
    annum before depreciation with 51 customers, and projected losses of $12,000 per
    annum at its full projected base of 105 households.
  lesson_learnt: A community embedded network operating via a high voltage connection
    requires a customer base of at least 300–1,000 homes to be financially viable
    — the fixed costs of HV connection, specialised maintenance and regulatory compliance
    are too high for a base of 50–100 homes, regardless of energy margins.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: community/local body
  delay_category: null
  failure_mode: commercial & market
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: NEV Power is pursuing battery demand response revenue and a VPP
    contract to close the revenue gap, and is seeking a new retailer following Shell's
    withdrawal.
  transferability: moderate
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id004
  - 10
  evidence_excerpt: Fifty-one customers provide an operating revenue of $16,830 to
    cover all the fixed costs of running the embedded network. Despite no paid employees
    NEV Power are still operating at a loss of over $52k per annum before depreciation.
    On reaching the projected final customer base of 105 households, losses will be
    $12k per annum.
