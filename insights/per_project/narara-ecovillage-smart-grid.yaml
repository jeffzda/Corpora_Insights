- record_id: ARENA-DLV-39479
  source_title: NEV Power – Smart Grid Project Lessons Learned Report (2)
  publish_date: 2022-09
  project_name: Narara Ecovillage Smart Grid Project
  what_happened: The centralised community battery enabled the village to maintain
    power during grid outages (islanding capability), balance loads across households
    with different solar orientations and shading profiles, and support EV charging
    from excess solar. These resilience and aggregation benefits are not available
    from individual home-by-home battery systems at the same efficiency.
  lesson_learnt: Community battery systems deliver meaningful resilience and aggregation
    benefits over home-by-home batteries — particularly islanding during outages,
    utilisation of shared solar from shaded or absent households, and centralised
    maintenance — and should be considered as a complement to, not replacement for,
    individual home batteries in community settings.
