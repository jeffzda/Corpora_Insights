- record_id: ARENA-DLV-39462
  source_title: NEV Power – Smart Grid Project Lessons Learned Report (2)
  publish_date: 2022-09
  project_name: Narara Ecovillage Smart Grid Project
  what_happened: The OLTC transformer was installed by NEV Power to manage voltage
    from high solar export, but Ausgrid had no prior experience using OLTC transformers
    for urban kiosk distribution substations. The transformer has subsequently been
    largely superseded by the community battery's grid-forming inverter capability,
    which performs the same voltage management function at lower cost.
  lesson_learnt: Smart grid transformers for voltage management should be installed
    and operated by the network utility rather than the community — utilities lack
    experience with community-operated OLTC units, and battery grid-forming inverters
    now deliver equivalent voltage control at lower cost, making the OLTC approach
    obsolete for new projects.
