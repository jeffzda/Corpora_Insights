  project_name: Narara Ecovillage Smart Grid Project
  what_happened: The Ecovillage, relying primarily on member volunteers with general
    electrical engineering and solar skills, lacked the specific industry knowledge
    required to progress grid protection designs through Ausgrid's approval process.
    Detailed electrical engineering drawings were required even at the conceptual
    stage, beyond internal capability.
  lesson_learnt: Volunteer-led or community-run energy projects should engage paid
    third-party specialists with network-specific expertise from the start of grid
    connection design — attempting to save costs by deferring specialist engagement
    until implementation will stall approval processes and cost more time than the
    savings justify.
