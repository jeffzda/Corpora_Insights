- record_id: ARENA-DLV-39454
  source_title: NEV Power – Smart Grid Project Lessons Learned Report (2)
  publish_date: 2022-09
  project_name: Narara Ecovillage Smart Grid Project
  what_happened: The use of different consultants for power circuits and the smart
    grid created issues and delays for connection approvals and commissioning of HV
    equipment and metering. Co-ordination of services across water/sewer, electrical,
    NBN and civil also proved difficult, and late changes to connection arrangements
    combined with equipment lead times risked delayed payments to the head contractor.
  lesson_learnt: Anticipate community resistance to wireless and control infrastructure
    in member-governed communities — plan communication campaigns early and have alternative
    technical solutions ready (e.g. LoRaWAN instead of WiFi) to maintain project momentum
    when members object to specific technologies.
