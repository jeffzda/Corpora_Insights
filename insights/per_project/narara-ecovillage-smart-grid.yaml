  source_title: Narara Ecovillage Smart Grid Project Lessons Learnt
  publish_date: 2020-10
  project_name: Narara Ecovillage Smart Grid Project
  what_happened: Battery storage quotes received by the Ecovillage were found to be
    prohibitively expensive and did not reflect reported market price reductions of
    up to 50%. The project team concluded that standard procurement approaches would
    not yield a cost-effective battery solution, and alternative financing and technical
    approaches were still being explored at the time of the report.
  lesson_learnt: Community-scale battery storage projects should expect quoted prices
    to include risk premiums when network integration design is unresolved — finalise
    grid integration design before seeking battery procurement quotes, and explore
    alternative financing models (research partnerships, second-life EV batteries,
    crowdfunding) when standard quotes are unaffordable.
