- record_id: ARENA-DLV-39453
  source_title: NEV Power – Smart Grid Project Lessons Learned Report (2)
  publish_date: 2022-09
  project_name: Narara Ecovillage Smart Grid Project
  what_happened: New safety standards for HV equipment and inverters changed during
    construction of specialised equipment. Retrofitting design changes to equipment
    already under manufacture resulted in manufacturers refusing to bear the cost,
    creating unforeseen project expense.
  lesson_learnt: For projects using emerging or specialised HV and inverter technology,
    allow explicit contingency for in-flight standard changes and negotiate contractual
    cost-sharing for design retrofits before equipment manufacture commences — manufacturers
    will not absorb these costs voluntarily.
