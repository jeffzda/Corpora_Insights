  what_happened: Demand control of distributed energy resources (DER) had not yet
    been implemented across the majority of NEV homes at the time of the report. The
    smart grid controls and demand management capability remained in early stages,
    with only manual SLACK and SMS alerts for low battery levels rather than automated
    appliance control.
  lesson_learnt: DER control and automated demand management should be scoped and
    contracted as part of the initial smart grid deployment, not deferred — without
    automated appliance control across the majority of homes, the theoretical demand
    management benefits of a community smart grid cannot be realised and community
    battery optimisation remains manual and volunteer-dependent.
