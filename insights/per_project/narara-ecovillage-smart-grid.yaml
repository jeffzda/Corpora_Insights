- record_id: ARENA-DLV-39456
  source_title: NEV Power – Smart Grid Project Lessons Learned Report (2)
  publish_date: 2022-09
  project_name: Narara Ecovillage Smart Grid Project
  what_happened: Unforeseen extra costs arose from installing the on-load tap changing
    (OLTC) transformer, smart grid controls, loss-of-grid protection and the community
    battery. Under embedded network regulations focused on commercial suppliers, these
    costs could not be passed through to customers, creating a feasibility challenge
    for the community-scale project.
  lesson_learnt: Community-scale embedded network projects should model the full cost
    of HV connection infrastructure (OLTC transformer, grid protection, smart controls)
    before committing — current regulations prevent passing these costs to customers,
    making financial viability dependent on scale or additional revenue streams unavailable
    to most communities.
