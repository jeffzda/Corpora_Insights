  what_happened: A permanent backup diesel generator was found to be necessary to
    allow full use of battery capacity while still providing backup power during extended
    grid outages, but was not included in the original system design. A warranted
    biodiesel generator was unavailable, so an offset diesel generator was selected
    instead.
