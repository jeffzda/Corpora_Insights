  project_name: Narara Ecovillage Smart Grid Project
  what_happened: Ausgrid's nameplate rating restrictions set a total inverter connection
    limit of 1,000 kVA for the NEV site without assessment at a more granular level.
    This blanket limit constrained the project's ability to optimise the connection
    economics through hybrid inverters, driving the project toward a less economically
    efficient configuration.
  lesson_learnt: When seeking network connection approval for community-scale solar
    and battery systems, challenge blanket inverter capacity limits and request granular
    assessment — aggregate nameplate limits applied without site-specific analysis
    can force sub-optimal configurations that significantly reduce economic performance.
