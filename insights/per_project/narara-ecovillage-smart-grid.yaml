- record_id: ARENA-DLV-39455
  source_title: NEV Power – Smart Grid Project Lessons Learned Report (2)
  publish_date: 2022-09
  project_name: Narara Ecovillage Smart Grid Project
  what_happened: An owner's engineer was not engaged for the battery procurement and
    tender process. The complexity and variety of options, combined with a requirement
    for tried-and-tested technology, caused a number of solutions to be discarded
    during tendering. Only four suitable suppliers were found at the required community
    battery size, as most vendors focused on home batteries or large-scale systems.
  lesson_learnt: Engage an owner's engineer specifically for community-scale battery
    procurement — without specialist procurement support, the design-and-construct
    tender process for an intermediate-scale battery is very difficult to navigate,
    with few suppliers and high risk of selecting unsuitable technology.
  issue_severity: moderate
  project_type: DER/customer-side
