  source_title: NEV Power – Smart Grid Project Lessons Learned Report (2)
  publish_date: 2022-09
  project_name: Narara Ecovillage Smart Grid Project
  what_happened: Running the embedded network relied heavily on volunteer resources
    throughout development and operations. This created difficulty in finding good
    consultants, slowed response to action items, made governance decisions slow,
    and meant the project could not pay for all input time. The skillset required
    was described as beyond most communities.
  lesson_learnt: Community-scale embedded network projects should not rely primarily
    on volunteer labour for technical and operational functions — the skills required
    for HV connection management, regulatory compliance and billing are at utility
    level, and the volunteer model creates bottlenecks, governance fragility and reputational
    risk with suppliers who perceive the community as a small and slow counterparty.
