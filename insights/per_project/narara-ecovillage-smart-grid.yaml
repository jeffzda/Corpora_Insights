  source_title: NEV Power – Smart Grid Project Lessons Learned Report (2)
  publish_date: 2022-09
  project_name: Narara Ecovillage Smart Grid Project
  what_happened: NEV Power initially rejected a web-based customer management and
    billing system and instead used Excel spreadsheets for records management. Five
    years later, the manual approach proved clumsy and error-prone, requiring a full
    evaluation of external software vendors and significant remediation effort.
  lesson_learnt: Community embedded networks should adopt a purpose-built customer
    management and billing platform from the outset, even with a small initial customer
    base — the time and effort cost of maintaining manual spreadsheet solutions far
    exceeds early software licensing costs, and retrofitting to a new system later
    is disruptive.
