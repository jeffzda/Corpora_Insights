  what_happened: Latent site conditions including undefined water courses (creeks,
    riparian zones) were discovered during construction, requiring special regulatory
    measures and additional work on bushfire asset protection, riparian zones, and
    stormwater detention. This increased cost and caused delays.
  lesson_learnt: Conduct thorough pre-construction site investigations including hydrological
    and environmental assessments to identify latent conditions early — undiscovered
    site features such as water courses can trigger regulatory obligations that add
    cost and delay to greenfield community energy developments.
