  what_happened: Incorporating a community vision for renewable energy and zero-carbon
    building standards into the co-operative's by-laws from inception attracted like-minded
    members and created high community acceptance of the smart grid. Community energy
    forums, daily automated battery status reports to the members' messaging channel
    and shared visibility of generation data were effective in motivating demand management
    behaviour.
  lesson_learnt: Embed renewable energy and building performance standards into community
    governance documents (by-laws, title conditions) before construction begins —
    this self-selects for aligned members, reduces resistance to smart grid infrastructure,
    and creates the social contract needed for effective voluntary demand management.
