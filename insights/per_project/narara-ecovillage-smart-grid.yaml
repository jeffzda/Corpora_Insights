  project_name: Narara Ecovillage Smart Grid Project
  what_happened: The NEV community's high solar penetration and energy-efficient homes
    resulted in the village exporting approximately seven times its annual imported
    energy. This outcome — a net-generating community with very high self-sufficiency
    — demonstrates that combined zero-carbon building standards, minimum solar requirements
    and community battery storage can enable a community to become carbon-positive.
  lesson_learnt: Combining mandatory minimum solar installation per household, high
    NatHERS building standards (7+ stars) and a centralised community battery can
    transform a residential community into a net energy generator — this model is
    replicable and directly applicable to new housing developments as NatHERS 7-star
    becomes the national standard from 2023.
