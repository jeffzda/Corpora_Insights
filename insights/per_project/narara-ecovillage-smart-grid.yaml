  project_name: Narara Ecovillage Smart Grid Project
  what_happened: Valley shading at the Narara Ecovillage site made west-facing solar
    panels more attractive than conventional north-facing orientation, enabling generation
    later in the afternoon when direct sunlight access to north-facing panels is lost.
    However, getting community members to adopt west-facing orientation proved difficult.
  lesson_learnt: Site-specific shading analysis should inform solar panel orientation
    requirements in building standards for community developments — site topography
    can make non-standard orientations (e.g. west-facing) significantly more valuable,
    but this must be mandated or strongly incentivised in building standards as individual
    builders will default to conventional north-facing.
