  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: The project explored alternative approaches including partnerships
    with research organisations, use of recycled EV batteries, crowdfunding/carbon
    offset schemes, and philanthropic support to find a cost-effective battery solution.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
