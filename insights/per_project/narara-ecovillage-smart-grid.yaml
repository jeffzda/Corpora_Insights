  lifecycle_phase: procurement
  proponent_type: community/local body
  delay_category: procurement/supply chain
  failure_mode: execution & logistics
  outcome_class: delayed but recoverable
  secondary_failure_mode: poor scoping
  intervention_note: Ultimately procured from one of only four available suppliers,
    with volunteer technical expertise filling the owner's engineer role retrospectively.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id002
  - 8
  - 30
  evidence_excerpt: In retrospect an owner's engineer was needed for the battery procurement
    and tender process given the complexity and variety of options... It was also
    hard to find suppliers and installers for a community battery size given their
    focus on home batteries or large-scale systems.
