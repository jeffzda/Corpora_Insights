  project_name: Narara Ecovillage Smart Grid Project
  what_happened: A council amalgamation mid-project replaced Gosford City Council
    with Central Coast Council. Newly appointed staff were unfamiliar with the project's
    unusual features — including WICA water provisions, community title arrangements,
    and a Voluntary Planning Agreement — requiring extensive re-education and causing
    material delays to development approvals.
  lesson_learnt: When a project spans a local government restructure or election cycle,
    proactively brief incoming council staff and elected members from scratch — institutional
    memory cannot be assumed and re-engagement with new decision-makers can add significant
    delays to development approvals.
