- record_id: ARENA-DLV-39485
  source_title: NEV Power – Smart Grid Project Lessons Learned Report (2)
  publish_date: 2022-09
  project_name: Narara Ecovillage Smart Grid Project
  what_happened: There is currently no regulatory framework ('playbook') for operating
    a community smart grid of the type developed at Narara Ecovillage — no guide for
    how to deliver a community smart grid, no utility connection guide for communities,
    and no standard connection process between the home-owner (limited interaction)
    and major business customer levels.
  lesson_learnt: National standards bodies and regulators should develop a consolidated
    community smart grid connection and operation playbook — the gap between residential
    and commercial connection processes is a material barrier that forces community
    projects to expend disproportionate resources navigating undefined regulatory
    territory.
