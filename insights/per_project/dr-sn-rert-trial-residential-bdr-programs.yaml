- record_id: ARENA-DLV-20706
  source_title: Demand Response Short Notice RERT Trial Year 3 Report
  publish_date: 2021-10
  project_name: DR SN RERT Trial — Residential BDR programs
  what_happened: All three participants offering residential behavioural demand response (BDR) programs significantly expanded them in Year 3 — AGL grew from 750 to over 8,000 participants (then to 50,000
    by 2020-21), EnergyAustralia reached 380,000 customers via opt-out design, and Powershop maintained strong participation rates — with all three electing to continue programs beyond the trial.
  lesson_learnt: BDR programs that allow customers to retain full control of their appliances, require no hardware installation, and offer modest financial incentives achieve high recruitment and retention
    rates; moving to an opt-out model dramatically increases participation scale and can make the program financially sustainable without large per-customer incentives.
