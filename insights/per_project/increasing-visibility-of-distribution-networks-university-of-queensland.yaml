- record_id: ARENA-DLV-64416
  source_title: Distributed Energy Resources (DER) Integration Project Contribution Assessment
  publish_date: 2019-03
  project_name: Increasing Visibility of Distribution Networks (University of Queensland)
  what_happened: The University of Queensland's project ($1.19m, commenced December 2017) was developing a State Estimation Algorithm to give DNSPs increased visibility of MV network operating state and
    enable accurate power flow studies on new solar connections, trialling across seven feeders at three DNSPs (Energex, United Energy, TasNetworks).
  lesson_learnt: State estimation algorithms that extend network visibility to the MV and LV level can improve the accuracy of DER connection assessments and reduce the need for conservative export restrictions
    — multi-DNSP trials across diverse network types are important to validate transferability of the approach before broader adoption.
