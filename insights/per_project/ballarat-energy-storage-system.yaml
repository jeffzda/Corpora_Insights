- record_id: ARENA-DLV-2959
  source_title: Large-Scale Battery Storage Knowledge Sharing Report
  publish_date: 2019-09
  project_name: Ballarat Energy Storage System
  what_happened: The BESS auxiliary load is connected via a single revenue meter and
    the system operates exclusive of auxiliaries while revenue settlement is inclusive
    of auxiliaries, creating a mismatch between measured performance and commercial
    settlement that required management.
  lesson_learnt: Auxiliary power metering and settlement arrangements for stand-alone
    LSBS should be clarified and explicitly designed into the metering configuration
    before commissioning — failure to account for parasitic auxiliary loads in revenue
    metering can create ongoing commercial discrepancies between measured system output
    and market settlement.
  issue_severity: minor
  project_type: storage
