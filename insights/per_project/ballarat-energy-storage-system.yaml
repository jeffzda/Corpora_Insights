- record_id: ARENA-DLV-2957
  source_title: Large-Scale Battery Storage Knowledge Sharing Report
  publish_date: 2019-09
  project_name: Ballarat Energy Storage System
  what_happened: The BESS was the first stand-alone battery system to connect to the
    grid in Victoria, requiring GPS negotiations to establish new precedents with
    AEMO for a stand-alone battery configuration, including negotiation of ramp rate
    settings and R2 testing requirements for a system operating as both generator
    and load.
  lesson_learnt: Stand-alone battery projects in Australia must expect to negotiate
    GPS precedents with AEMO, including ramp rate settings, testing requirements and
    operating modes that have not previously been applied to batteries; engaging AEMO
    early and proactively to resolve these novel regulatory interpretations can reduce
    delay in the registration and commissioning process.
  issue_severity: moderate
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: grid connection/system studies
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: null
  intervention_note: AEMO's MASS tool was negotiated for the battery to operate with
    a three-second ramp rate; R2 testing requirements were developed and refined for
    the stand-alone battery configuration.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id001
  - 13
  - 14
  evidence_excerpt: Generator Performance Standards (GPS) applied to the BESS project
    as a stand-alone battery system were refined with AEMO through the GPS negotiation
    and registration process deployment, which added complexity to the GPS negotiations.
    The project therefore had to establish a GPS precedent to be able to connect to
    the grid.
