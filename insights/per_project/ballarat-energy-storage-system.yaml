- record_id: ARENA-DLV-2958
  source_title: Large-Scale Battery Storage Knowledge Sharing Report
  publish_date: 2019-09
  project_name: Ballarat Energy Storage System
  what_happened: The BESS system would trip if state of charge dipped below 3%, a
    behaviour discovered during early operations; Fluence used the event as an opportunity
    to update its training regime and SOC management software.
  lesson_learnt: SOC management software and operator training should be validated
    against operational edge cases (such as low-SOC trip thresholds) before commercial
    operation; deficiencies in these areas discovered post-commissioning can be remedied
    but require software updates and retraining that interrupt normal operations.
  issue_severity: minor
