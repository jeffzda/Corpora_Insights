- record_id: ARENA-DLV-2981
  source_title: Large-Scale Battery Storage Knowledge Sharing Report
  publish_date: 2019-09
  project_name: Ballarat Energy Storage System
  what_happened: The BESS was the first LSBS project in Australia built by an Australian
    EPC company (Fluence using local contracting capability), demonstrating that domestic
    engineering, procurement and construction expertise for LSBS has begun to develop
    within the Australian market.
  lesson_learnt: The development of domestic EPC capability for LSBS (as demonstrated
    by Ballarat) reduces reliance on international contractors and builds local skills
    that future Australian projects can leverage; project proponents should consider
    using and supporting Australian EPC firms to develop the local supply chain and
    reduce delivery risk for future projects.
  issue_severity: none
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: construction/installation
  proponent_type: project developer
