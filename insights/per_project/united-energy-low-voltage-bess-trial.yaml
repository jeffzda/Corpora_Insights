  source_title: UTS - Flexible Demand State of Play in Australia - Report
  publish_date: 2024-05
  project_name: United Energy – Low Voltage BESS Trial
  what_happened: The United Energy pole-mounted BESS trial found significant time
    and cost associated with on-site testing during installation, and identified upfront
    challenges in streamlining project management and governance.
  lesson_learnt: Pole-mounted BESS deployment programs should negotiate optimal engagement
    with installation service providers during the design phase — site testing requirements
    discovered during installation added significant cost and time; pre-agreed testing
    protocols and streamlined governance structures should be established before works
    commence.
