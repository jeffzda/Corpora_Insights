- record_id: ARENA-DLV-51482
  source_title: UTS - Flexible Demand State of Play in Australia - Report
  publish_date: 2024-05
  project_name: United Energy – Low Voltage BESS Trial
  what_happened: The United Energy BESS trial identified limited Australian standards
    for fire risk and cybersecurity in pole-mounted BESS, necessitating engagement
    of offshore providers for IEC 62351/IEC 61850/IEC 2030.5 integration.
  lesson_learnt: Gaps in Australian fire risk and cybersecurity standards for distribution-connected
    BESS force reliance on offshore integration providers, adding cost and complexity;
    projects in this space should engage with Standards Australia early and budget
    for the additional integration work required until national standards are established.
