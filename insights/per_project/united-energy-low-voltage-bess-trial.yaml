- record_id: ARENA-DLV-51483
  source_title: UTS - Flexible Demand State of Play in Australia - Report
  publish_date: 2024-05
  project_name: United Energy – Low Voltage BESS Trial
  what_happened: The United Energy BESS trial encountered challenges reaching households
    in culturally and linguistically diverse areas and needed to explore partnerships
    with local councils to improve community engagement.
  lesson_learnt: Infrastructure projects in culturally and linguistically diverse
    communities require tailored community engagement strategies and local intermediaries
    such as councils — standard communications approaches are insufficient and failure
    to plan for this early will delay site access and community acceptance.
