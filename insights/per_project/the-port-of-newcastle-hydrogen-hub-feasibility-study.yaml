  source_title: Macquarie Group - Newcastle Green Hydrogen Hub - Public Feasibility
    Report
  publish_date: 2023-08
  project_name: Port of Newcastle Green Hydrogen Hub
  what_happened: The feasibility study found that the Ausgrid 132kV connection point
    (originally preferred for early-stage cost reasons) had immediate capacity constraints,
    and that direct connection to the Transgrid 330kV line was the preferred option,
    opening up approximately 700MW of capacity and providing infrastructure savings
    in expansion phases.
  lesson_learnt: Early-stage hydrogen projects should assess grid connection capacity
    at both the pilot and full-scale sizes before selecting a connection point — a
    cheaper early-stage connection option may impose binding capacity constraints
    that prevent cost-effective expansion.
