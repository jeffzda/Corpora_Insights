- record_id: ARENA-DLV-29851
  source_title: Macquarie Group - Newcastle Green Hydrogen Hub - Public Feasibility
    Report
  publish_date: 2023-08
  project_name: Port of Newcastle Green Hydrogen Hub
  what_happened: The Project Sponsors decided not to progress to Stage 2 of the feasibility
    study after Stage 1 revealed that the project was not commercially viable without
    substantially increased government support, driven by the introduction of the
    US Inflation Reduction Act (IRA), significant electricity price increases, and
    cost inflation from COVID and the war in Ukraine.
  lesson_learnt: Green hydrogen export projects in Australia should stress-test commercial
    viability against major international policy shifts (e.g. IRA-style subsidies
    in competing markets) before committing to development expenditure — such shifts
    can fundamentally alter the green premium assumption that underpins project economics.
  issue_severity: critical
  project_type: industrial decarbonisation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: concept/feasibility
