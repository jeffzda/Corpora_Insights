  evidence_excerpt: 'These factors have meant that: 1) the amount of concessional
    finance required for the Project to reach a Financial Close has increased significantly;
    and 2) the horizon for scale up of the project has become uncertain as without
    Government subsidy it is unlikely to be able to compete with the global market.
    Given the above, the Project Sponsors have decided not to progress to stage 2
    of the Feasibility Study.'
