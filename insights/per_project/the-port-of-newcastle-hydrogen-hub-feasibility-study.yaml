- record_id: ARENA-DLV-29855
  source_title: Macquarie Group - Newcastle Green Hydrogen Hub - Public Feasibility
    Report
  publish_date: 2023-08
  project_name: Port of Newcastle Green Hydrogen Hub
  what_happened: The feasibility study identified that the originally preferred site
    (Walsh Point) had significant constraints — inadequate separation from residential
    areas, constrained land and utilities capacity limited to 250MW, inability to
    scale beyond Phase 1, and cumulative hazard risk — and was replaced by the KIWEF
    site as the preferred location.
  lesson_learnt: Site selection for large-scale green hydrogen and ammonia projects
    should evaluate scalability constraints, residential separation, hazard risk,
    and grid access at the earliest concept stage — a site that appears suitable for
    a pilot plant may be fundamentally unable to support the full-scale expansion
    needed for project economics to work.
