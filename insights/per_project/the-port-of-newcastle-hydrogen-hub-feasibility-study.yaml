- record_id: ARENA-DLV-29866
  source_title: Macquarie Group - Newcastle Green Hydrogen Hub - Public Feasibility
    Report
  publish_date: 2023-08
  project_name: Port of Newcastle Green Hydrogen Hub
  what_happened: The feasibility study found that the electrolyser should be designed
    to operate flexibly — turning off during high electricity price periods (excluding
    approximately 20% of the day on average) — requiring hydrogen storage to maintain
    continuous ammonia synthesis, adding capital cost but enabling the plant to avoid
    peak electricity pricing.
  lesson_learnt: Green hydrogen plants producing ammonia should incorporate hydrogen
    storage to decouple electrolyser operation from ammonia synthesis — flexible electrolyser
    dispatch (80% utilisation targeting off-peak power) requires buffer storage to
    maintain continuous downstream production and this cost must be included in feasibility
    capex estimates.
