  source_title: Macquarie Group - Newcastle Green Hydrogen Hub - Public Feasibility
    Report
  publish_date: 2023-08
  project_name: Port of Newcastle Green Hydrogen Hub
  what_happened: 'The feasibility study demonstrated strong economies of scale in
    green hydrogen and ammonia production: scaling from 44MW to 1GW reduced LCOH from
    AUD 10.6/kg to AUD 4.6/kg and LCOA from AUD 3,155/tonne to AUD 1,227/tonne, with
    the capex component of LCOH falling from AUD 3.4/kg to AUD 1.6/kg.'
  lesson_learnt: Reference-class cost estimates for green hydrogen projects should
    not be extrapolated linearly from pilot-scale data — economies of scale are very
    significant, and a 1GW plant has less than half the per-unit production cost of
    a 44MW plant; project developers and funders should model both scales before making
    sizing decisions.
