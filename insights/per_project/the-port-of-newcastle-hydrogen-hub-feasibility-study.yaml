- record_id: ARENA-DLV-29868
  source_title: Macquarie Group - Newcastle Green Hydrogen Hub - Public Feasibility
    Report
  publish_date: 2023-08
  project_name: Port of Newcastle Green Hydrogen Hub
  what_happened: The feasibility study found that PEM electrolysers would be more
    flexible than alkaline technology for ancillary market participation (FCAS, demand
    response, voltage control), which has implications for revenue modelling and technology
    selection in projects where grid services revenue is a meaningful component of
    the business case.
  lesson_learnt: When building a green hydrogen business case that includes ancillary
    services revenue, technology selection (PEM vs alkaline) should be assessed against
    the ramp rate requirements of target ancillary markets — PEM's superior flexibility
    may justify a cost premium where FCAS or demand response revenue is material to
    project economics.
