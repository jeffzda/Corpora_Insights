- record_id: ARENA-DLV-29869
  source_title: Macquarie Group - Newcastle Green Hydrogen Hub - Public Feasibility
    Report
  publish_date: 2023-08
  project_name: Port of Newcastle Green Hydrogen Hub
  what_happened: The feasibility study identified that Australia's heavy reliance
    on imported nitrogen fertiliser (~74% of total usage as of 2020) and expected
    domestic supply shortages after 2022 due to closure of a large domestic plant
    represented a near-term domestic offtake opportunity for green ammonia, with potential
    short-term demand of 100kt pa growing to 570kt pa long-term in Eastern Australia.
  lesson_learnt: Green hydrogen and ammonia projects at port locations with existing
    fertiliser distribution infrastructure should prioritise domestic fertiliser offtake
    as the earliest commercially viable demand pathway — import substitution demand
    exists now, unlike export markets which require a green premium to emerge.
