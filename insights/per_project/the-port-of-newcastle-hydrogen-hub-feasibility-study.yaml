  project_name: Port of Newcastle Green Hydrogen Hub
  what_happened: The feasibility study identified that a desalination plant was considered
    for the pilot plant's water supply but was discarded due to the prohibitive cost
    of seawater intake/outfall infrastructure and the extensive environmental permits
    required, with the project instead relying on potable water from Hunter Water
    Corporation and recycled water from Water Utilities Australia.
  lesson_learnt: Green hydrogen projects should assess water supply options early
    in feasibility and not assume desalination is a cost-effective fallback — seawater
    intake/outfall infrastructure and associated environmental permitting costs can
    be prohibitive at pilot scale, making access to existing potable or recycled water
    networks a critical site selection criterion.
