  publish_date: 2023-08
  project_name: Port of Newcastle Green Hydrogen Hub
  what_happened: The feasibility study found that electricity cost (AUD/MWh) is the
    dominant operational driver of LCOH, with every AUD 10/MWh change in power price
    shifting the LCOH by AUD 0.6/kg (5.7%) and LCOA by AUD 134/tonne (4.2%), making
    power price risk the single most important sensitivity in green hydrogen project
    economics.
  lesson_learnt: Green hydrogen project financial models should treat electricity
    cost as the primary sensitivity variable and stress-test at a wide range of power
    prices — a AUD 10/MWh movement alone shifts LCOH by nearly 6%, and the difference
    between a AUD 45/MWh and AUD 90/MWh assumption can determine whether a project
    is viable.
