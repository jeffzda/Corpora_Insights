- record_id: ARENA-DLV-29854
  source_title: Macquarie Group - Newcastle Green Hydrogen Hub - Public Feasibility
    Report
  publish_date: 2023-08
  project_name: Port of Newcastle Green Hydrogen Hub
  what_happened: The feasibility study found that a ~40MW pilot electrolyser plant
    had a very high levelised cost of hydrogen (AUD 10.6/kg) driven by a high proportion
    of fixed and scalable costs, making it uneconomic at the pilot scale originally
    envisaged; a plant above ~150MW was identified as required to achieve significantly
    lower per-unit production costs.
  lesson_learnt: Green hydrogen and ammonia projects should be sized well above the
    pilot scale (~40MW) from the outset to capture economies of scale — fixed and
    scalable cost structures mean small plants carry disproportionately high per-unit
    production costs that cannot be offset by concessional funding alone.
