- record_id: ARENA-DLV-29852
  source_title: Macquarie Group - Newcastle Green Hydrogen Hub - Public Feasibility
    Report
  publish_date: 2023-08
  project_name: Port of Newcastle Green Hydrogen Hub
  what_happened: The electricity cost assumption of AUD 45/MWh used at the start of
    the feasibility study in H2 2021 proved materially incorrect; by the time Stage
    1 was completed, electricity futures indicated costs significantly above this
    level, creating a major gap in project economics that the study could not bridge.
  lesson_learnt: Hydrogen project feasibility studies should model a wide range of
    electricity price scenarios from inception and avoid locking a single low-cost
    power assumption into the base case — the gap between AUD 45/MWh target and actual
    prevailing costs was a primary driver of the project's non-progression.
