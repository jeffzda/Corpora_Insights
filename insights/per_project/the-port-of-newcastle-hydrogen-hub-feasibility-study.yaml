  publish_date: 2023-08
  project_name: Port of Newcastle Green Hydrogen Hub
  what_happened: The US Inflation Reduction Act, enacted in August 2022 during the
    feasibility study period, materially altered the international competitive landscape
    for green hydrogen and ammonia exports by enabling US producers to offer product
    at prices competitive with grey hydrogen, removing the anticipated green premium
    from export markets.
  lesson_learnt: Australian green hydrogen projects targeting export markets must
    monitor and model the impact of international subsidy regimes (particularly the
    US IRA) when assessing commercial viability — the absence of an equivalent domestic
    support framework leaves Australian producers exposed to being undercut in export
    markets.
