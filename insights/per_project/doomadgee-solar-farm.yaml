- record_id: ARENA-DLV-72236
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects - First Edition Results'
  publish_date: '2014'
  project_name: Doomadgee Solar Farm
  what_happened: Ergon Energy successfully designed and deployed a solar farm for the off-grid town of Doomadgee achieving 50% instantaneous solar penetration in a diesel mini-grid with a 10-year payback,
    by developing advanced control algorithms to maximise efficiency while maintaining adequate spinning reserve. Integration was completed in-house to build replicable capability across other isolated
    systems.
  lesson_learnt: For diesel-solar hybrid isolated grid projects, develop and own the integration in-house rather than outsourcing — keeping integration capability internal builds replicable knowledge that
    can be transferred across multiple isolated system sites, reducing design risk and cost for subsequent deployments.
