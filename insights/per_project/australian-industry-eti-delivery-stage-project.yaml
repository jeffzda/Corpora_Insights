  source_title: 'Setting Up Industrial Regions for Net Zero: Phase 2 Report'
  publish_date: 2022-06
  project_name: Australian Industry Energy Transitions Initiative – Hunter Focus
  what_happened: Aluminium smelting at Tomago (Australia's largest aluminium smelter,
    38 percent of domestic production) requires continuous, firm, low-cost electricity
    at 51 GJ per tonne of aluminium. Although renewable energy technologies are mature
    and commercially available, the analysis found that providing constant and reliable
    supply of variable renewable energy for large continuous-process energy users
    such as aluminium smelters is still not commercially viable.
  lesson_learnt: For large industrial continuous-process loads (aluminium smelting
    and similar), the renewable energy transition cannot be accomplished through standard
    variable renewable energy (VRE) procurement — it requires an integrated system
    solution combining large-scale VRE, dedicated battery storage, and potentially
    demand response capability. Projects serving such loads should cost and design
    for the full firmed energy system, not just the generation component.
