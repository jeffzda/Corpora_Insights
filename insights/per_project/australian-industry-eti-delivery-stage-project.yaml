- record_id: ARENA-DLV-28305
  source_title: 'Setting Up Industrial Regions for Net Zero: Phase 2 Report'
  publish_date: 2022-06
  project_name: WesCEF (CSBP) – Kwinana Nitric Acid Ammonium Nitrate Abatement
  what_happened: Wesfarmers Chemicals, Energy and Fertilisers (WesCEF) installed abatement
    catalysts in CSBP's Nitric Acid Ammonium Nitrate plants in 2012, reducing scope
    1 emissions intensity from approximately 1.5 tCO2e/t to 0.25 tCO2e/t ammonium
    nitrate — a 40 percent reduction in FY2020 emissions equivalent to avoiding over
    700,000 tCO2e. This performance subsequently underpinned Australia's first sustainability-linked
    loan (2020) and sustainability-linked bonds (2021) totalling over A$1.6 billion.
  lesson_learnt: Demonstrated, quantified emissions reductions from industrial abatement
    projects can directly unlock novel sustainability-linked financing instruments
    at scale — project developers should design monitoring and reporting systems for
    abatement projects with future sustainability financing in mind, as verified performance
    data is the critical enabler.
