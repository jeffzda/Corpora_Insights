- record_id: ARENA-DLV-28307
  source_title: 'Setting Up Industrial Regions for Net Zero: Phase 2 Report'
  publish_date: 2022-06
  project_name: Australian Industry Energy Transitions Initiative – Pilbara Focus
  what_happened: Pilbara hematite iron ore — which dominates Australian iron ore supply
    and underpins proposed green steel export industries — cannot be used in existing
    hydrogen direct reduced iron (DRI) processes, which require very high iron concentrations.
    This technical incompatibility was identified as a fundamental barrier to the
    commercialisation of green steel production from Pilbara ore, requiring separate
    R&D investment in ore processing techniques before green steel DRI routes become
    viable at scale.
  lesson_learnt: Projects planning to use hydrogen DRI steelmaking with Pilbara hematite
    ores face a technology gap that is independent of hydrogen cost or renewable energy
    availability — early-stage green steel projects in Australia must include ore
    pre-processing R&D as a critical path item and should not assume international
    DRI technology will be directly applicable to Australian feedstocks.
  issue_severity: major
  project_type: industrial decarbonisation
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: development/design
  proponent_type: industrial operator
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: BlueScope Steel and Rio Tinto announced an MOU in 2021 to research
    low-emissions processes using Pilbara iron ore, including green hydrogen direct
    reduction of Pilbara hematite followed by electric arc furnace melting.
  transferability: narrow
  delay_magnitude: not quantified
