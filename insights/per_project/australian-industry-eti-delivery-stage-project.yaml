  what_happened: 'The report found that the transition to net zero for Australian
    heavy industry involves simultaneous shifts across at least eight dimensions:
    corporate strategy, technology R&D and deployment, demand and market development,
    business models and finance, infrastructure, regulation and policy, and workforce
    skills — and that industrial stakeholders attempting to address these as separate
    workstreams without coordination are encountering compounding delays and misalignment.'
  lesson_learnt: Industrial decarbonisation projects that treat technology deployment
    as the primary challenge while addressing commercial, regulatory, workforce and
    infrastructure dimensions sequentially will face compounding delays — program
    managers should plan for parallel workstreams across all system dimensions from
    project inception, accepting that some workstreams (particularly regulation and
    workforce) have long lead times that cannot be compressed.
