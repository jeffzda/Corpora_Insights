  what_happened: The report identified that mature nitrous oxide abatement solutions
    for ammonium nitrate production exist at TRL 8-9, but deployment is constrained
    because without a carbon price or penalty on non-energy emissions, reducing these
    emissions delivers no economic return for producers — making them commercially
    irrational despite high technical readiness.
  lesson_learnt: High technology readiness does not guarantee commercial deployment
    for process emissions abatement that has no direct productivity or energy cost
    benefit — projects targeting non-energy industrial emissions (particularly N2O)
    should plan for blended finance or government co-investment from the outset, as
    the commercial case will not close without a carbon pricing signal or targeted
    subsidy.
