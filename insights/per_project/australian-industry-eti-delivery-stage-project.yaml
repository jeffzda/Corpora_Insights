  what_happened: The report identified that heavy industry organisations are traditionally
    highly competitive, which constrains the transparency needed for effective collaboration,
    and that few established models and frameworks for multi-stakeholder collaboration
    exist in Australian industrial regions. This was identified as a structural barrier
    to coordinating shared infrastructure, energy supply and technology development
    across all regions studied.
  lesson_learnt: The absence of established multi-stakeholder collaboration models
    is a delivery risk for large industrial decarbonisation programs — government
    program design should require multiple industry partners and explicitly fund the
    governance and coordination costs of collaboration (not just the capital works),
    as the transaction costs of building new collaboration structures are substantial
    and often underestimated.
