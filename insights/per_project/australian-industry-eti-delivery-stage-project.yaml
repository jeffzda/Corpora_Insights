  source_title: 'Setting Up Industrial Regions for Net Zero: Phase 2 Report'
  publish_date: 2022-06
  project_name: Australian Industry Energy Transitions Initiative – Hunter Focus
  what_happened: The Hunter region lacks a joint heavy industry leadership group equivalent
    to Kwinana's Industries Council, despite having numerous existing networks (Chamber
    of Commerce, university partnerships, hydrogen working groups). The report identified
    this gap as a critical barrier to coordinated decarbonisation, noting that without
    a single heavy industry leadership forum, efforts remain fragmented across multiple
    bilateral and sector-specific connections.
  lesson_learnt: The absence of a formal joint heavy industry leadership body in a
    region — even where bilateral collaboration and sector networks are active — is
    a structural barrier to coordinating the multi-stakeholder infrastructure, energy
    and technology investments needed for decarbonisation at scale. Regions and programs
    targeting industrial cluster decarbonisation should prioritise establishing such
    a body as a precondition, not a downstream outcome.
