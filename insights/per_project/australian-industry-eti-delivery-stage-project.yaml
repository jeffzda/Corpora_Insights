- record_id: ARENA-DLV-28303
  source_title: 'Setting Up Industrial Regions for Net Zero: Phase 2 Report'
  publish_date: 2022-06
  project_name: Australian Industry Energy Transitions Initiative – Kwinana Focus
  what_happened: Despite Kwinana having at least six existing grey hydrogen users
    (produced via steam methane reforming) that could theoretically provide a ready
    domestic market for green hydrogen, the cost differential between grey and green
    hydrogen was found to be too large for existing users to switch without policy
    intervention — making organic demand development insufficient to underpin investment.
  lesson_learnt: Existing grey hydrogen demand does not automatically translate to
    green hydrogen offtake — the green premium gap is too large for market-led conversion.
    Developers of green hydrogen projects in industrial precincts should plan for
    policy-supported demand creation (e.g. hydrogen obligations, contracts for difference)
    from the outset rather than assuming incumbent users will transition on commercial
    terms alone.
