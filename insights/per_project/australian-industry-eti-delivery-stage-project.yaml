- record_id: ARENA-DLV-28302
  source_title: 'Setting Up Industrial Regions for Net Zero: Phase 2 Report'
  publish_date: 2022-06
  project_name: Australian Industry Energy Transitions Initiative – Kwinana Focus
  what_happened: The Kwinana Strategic Industrial Area faces a binding land constraint
    that prevents on-site renewable energy generation at the scale needed for decarbonisation,
    requiring all large-scale renewable electricity to be delivered via transmission
    infrastructure from outside the precinct. Analysis found that increased electricity
    demand of 4.8–9.7 TWh would likely create transmission and distribution capacity
    constraints that no single user could afford to resolve.
  lesson_learnt: Industrial precincts in urban or land-constrained settings cannot
    rely on behind-the-meter renewable generation to meet decarbonisation needs —
    proponents must engage network operators and government early to plan coordinated
    transmission investment, and project feasibility assessments should explicitly
    account for grid capacity constraints as a first-order risk.
  issue_severity: major
  project_type: industrial decarbonisation
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: concept/feasibility
  proponent_type: industrial operator
  delay_category: grid connection/system studies
  failure_mode: poor scoping
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: coordination & stakeholders
  intervention_note: The report recommends a coordinated approach by industry and
    Western Power (the network operator) to address grid constraints collectively
    rather than through single-user investment.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: grid/system stability
  source_pages: &id002
