- record_id: ARENA-DLV-28304
  source_title: 'Setting Up Industrial Regions for Net Zero: Phase 2 Report'
  publish_date: 2022-06
  project_name: Australian Industry Energy Transitions Initiative – Kwinana Focus
  what_happened: The Kwinana Industries Council (KIC), a long-standing industry association,
    developed a Carbon Reduction Plan for the Kwinana Industrial Area without government
    support, leveraging more than 170 symbiotic material and energy exchanges between
    precinct members. This established collaboration infrastructure was identified
    as a significant structural advantage for decarbonisation planning compared to
    other regions.
  lesson_learnt: Pre-existing formal industry collaboration structures (such as a
    dedicated industry council with established material exchange programs) substantially
    reduce the transaction costs of coordinating multi-stakeholder decarbonisation
    projects — regions and project proponents seeking to develop industrial cluster
    decarbonisation should invest early in formalising collaboration governance rather
    than attempting to coordinate from scratch at the project stage.
