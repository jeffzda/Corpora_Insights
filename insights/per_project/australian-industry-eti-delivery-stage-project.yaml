  source_title: 'Setting Up Industrial Regions for Net Zero: Phase 2 Report'
  publish_date: 2022-06
  project_name: Orica – Kooragang Island Decarbonisation Project
  what_happened: Orica deployed a A$37 million project to install EnviNOx® tertiary
    nitrous oxide catalyst abatement technology across three nitric acid plants at
    Kooragang Island, Newcastle, financed through a A$25 million CEFC loan and A$13
    million NSW government grant. The technology is designed to eliminate at least
    567,000 tCO2e per year (48 percent of site emissions) and deliver at least 4.7
    MtCO2e cumulative reduction by 2030.
  lesson_learnt: Proven industrial emissions abatement technologies with high capital
    cost but no direct commercial return (such as nitrous oxide catalysts) can be
    unlocked through blended public finance structures combining concessional debt
    and capital grants — project developers facing similar 'no economic return without
    a carbon price' barriers should pursue CEFC debt alongside state government grant
    co-funding as a viable delivery model.
