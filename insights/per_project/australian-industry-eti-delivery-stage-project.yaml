  what_happened: APA Group, with A$300k WA government support and research partners
    at the Future Fuels CRC and Wollongong University, launched a A$3 million pilot
    project to convert 43 km of the Parmelia Gas Pipeline into Australia's first 100
    percent hydrogen-ready transmission pipeline. The three-phase project involves
    laboratory material embrittlement testing, safe operating guideline development,
    and full-scale on-site testing.
  lesson_learnt: Converting existing gas transmission pipelines to hydrogen service
    requires a structured multi-phase R&D program addressing material embrittlement
    before any operational conversion — proponents should sequence laboratory testing
    before field testing and develop new safe operating procedures as a distinct deliverable,
    not an afterthought.
