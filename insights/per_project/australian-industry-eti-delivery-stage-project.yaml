  what_happened: Analysis across all five regions found that the many diverse government
    programs aimed at industrial cluster decarbonisation (hydrogen hubs, clean manufacturing
    precincts, minerals research programs) across federal and state levels are individually
    welcome but collectively overwhelming for industry to navigate, with companies
    spending significant time understanding the support landscape rather than deploying
    capital.
  lesson_learnt: The proliferation of overlapping federal and state decarbonisation
    programs creates navigation burden that can delay or discourage industrial investment
    — program designers should consider co-designing a central navigation support
    service (analogous to Sweden's Transition Boost program) to reduce friction for
    proponents, and should actively harmonise program requirements and timelines across
    jurisdictions.
