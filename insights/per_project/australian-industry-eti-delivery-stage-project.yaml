  what_happened: The report found that developing early hydrogen demand and supply
    together — through aggregated offtake, government procurement and feed-in mechanisms
    — is the critical near-term enabling action for hydrogen market development, noting
    that fostering early demand is critical over the next decade to unlock cost reductions
    and develop a feasible scale-up trajectory.
  lesson_learnt: Green hydrogen projects cannot be financed on the basis of future
    market demand alone — they require committed offtake agreements or government-backed
    demand instruments (procurement, feed-in tariffs, contracts for difference) from
    project inception. Project developers should not proceed to investment decision
    without a credible demand side in place, and government co-investors should treat
    demand aggregation as a program design requirement rather than a market outcome.
