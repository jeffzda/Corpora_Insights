  source_title: 'Setting Up Industrial Regions for Net Zero: Phase 2 Report'
  publish_date: 2022-06
  project_name: Australian Industry Energy Transitions Initiative – Pilbara Focus
  what_happened: Mobile haulage (diesel trucks and trains) accounts for more than
    60 percent of scope 1 and 2 emissions from Pilbara iron ore mining operations.
    Battery electric vehicles (BEV) and hydrogen fuel cell electric vehicles (FCEV)
    capable of replacing current 140–400 tonne mining haul trucks were found to be
    not yet commercially available at the required scale, with concerns about battery
    size, charging infrastructure and uncertain green hydrogen costs.
  lesson_learnt: Mining haulage decarbonisation in the Pilbara cannot be delivered
    through procurement of commercially available technology — it requires collaborative
    R&D with original equipment manufacturers (OEMs). Projects targeting scope 1 emissions
    reductions in large-scale mining should treat haulage decarbonisation as a medium-to-long-term
    technology development program, not a near-term procurement exercise.
