  source_title: 'Setting Up Industrial Regions for Net Zero: Phase 2 Report'
  publish_date: 2022-06
  project_name: Australian Industry Energy Transitions Initiative – Cross-Regional
    Findings
  what_happened: The report found that the scale of renewable energy investment required
    for industrial decarbonisation across the five regions (A$53–100 billion, 68–126
    TWh) significantly exceeds what can be driven by project-by-project commercial
    decisions, and that system plans (AEMO's ISP, WA's WOSP) were not yet planning
    for industrial decarbonisation demand at the required scale or in line with 1.5°C
    scenarios.
  lesson_learnt: Industrial decarbonisation projects in NEM and SWIS-connected regions
    depend on network infrastructure and system planning that is outside proponents'
    direct control — project developers should engage with ISP and WOSP processes
    early to ensure industrial demand scenarios are incorporated, as the absence of
    planned transmission capacity can become a project-blocking constraint years into
    development.
  issue_severity: major
