- record_id: ARENA-DLV-28301
  source_title: 'Setting Up Industrial Regions for Net Zero: Phase 2 Report'
  publish_date: 2022-06
  project_name: Australian Industry Energy Transitions Initiative – Phase 2
  what_happened: Analysis across five Australian industrial regions (Pilbara, Kwinana,
    Hunter, Illawarra, Gladstone) found that 88 percent of identified abatement potential
    (70 MtCO2e) is technically achievable using proven or commercially available technologies,
    but the cost differential between green hydrogen and grey hydrogen remains a primary
    barrier to investment without policy support.
  lesson_learnt: Technology readiness is not the binding constraint for industrial
    decarbonisation in these regions — commercial viability and policy incentives
    are. Project developers and funders should not wait for further technology maturation
    before planning; instead, focus investment on demand-side policy instruments and
    offtake agreements that close the green premium gap.
