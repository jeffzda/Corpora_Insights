- record_id: ARENA-DLV-72259
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects - First Edition Results'
  publish_date: '2014'
  project_name: Isernia Smart Grid Project (Project ID 167)
  what_happened: Enel Distribuzione deployed a smart grid project in Isernia, Italy, addressing reverse flow and overvoltage conditions caused by high wind and PV penetration on MV feeders. The project
    implemented innovative voltage regulation, new protection strategies, distributed generator monitoring/control, and smart meters for 8,000 customers, and was reported as successful in achieving its
    objectives.
  lesson_learnt: Active network management combining reactive/active power control, advanced protection, broadband communications, and distributed generator monitoring can successfully address reverse power
    flow and overvoltage caused by high DER penetration on MV networks — interfaces and protocols should conform to international standards to enable wider replication.
