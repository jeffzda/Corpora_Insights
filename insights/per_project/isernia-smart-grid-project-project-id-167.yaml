  evidence_excerpt: Interfaces and protocols respect international standards but they should be standardized to be widely used. The energy monitoring kit has been distributed to 5000 customers to date,
    which is a high uptake rate (about 25%). Acceptance (measured by surveys) is very high. There has been an efficiency gain of >4%.
  confidence_note: Project is in Italy — transferability marked moderate as direct regulatory applicability to Australia requires adaptation.
