- record_id: ARENA-DLV-60813
  source_title: QUT Hydrogen Process Research & Development - End of Activity Report
  publish_date: 2025-06
  project_name: QUT H2Xport Project (Hydrogen Process R&D)
  what_happened: Queensland was the first Australian jurisdiction to adopt a Hydrogen
    Safety Code of Practice. The code had been in stakeholder consultation for over
    a year before it came into effect, yet the project team was caught off-guard because
    commissioning had not been completed before the notification date — despite procurement
    and installation already being finalised.
  lesson_learnt: Track emerging regulatory codes from the point they enter stakeholder
    consultation, not just from their notification or commencement date; if a relevant
    code is in consultation, treat its future requirements as a live risk and target
    commissioning completion before the code takes effect to avoid retrospective application.
  issue_severity: major
  project_type: multi-technology/hybrid
  project_scale_band: pilot
  lifecycle_phase: approvals/contracting
  proponent_type: research organisation/university
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: poor scoping
  intervention_note: Discussion with the regulator clarified the retrospective application
    threshold; the team redesigned operations to comply with the applicable Type B
    device pathway and discontinued compressed hydrogen offtake.
  transferability: moderate
  delay_magnitude: 1-3 years
  technology_domain: hydrogen
  source_pages: &id017
  - 8
  evidence_excerpt: This code had been in circulation for stakeholder consultation
    for over a year before it came into effect. The timing was challenging as by the
    time notification was received all procurement and installation had been completed
    for the project but the gas plant had not been commissioned. Subsequent discussion
    with the regulator revealed that had the plant been commissioned before the code
    notification date its provisions would not have applied retrospectively.
  confidence_note: This record captures the regulatory monitoring/timing lesson specifically;
    ARENA-DLV-60802 captures the cost and delay impact. The two records are complementary
    rather than duplicative.
