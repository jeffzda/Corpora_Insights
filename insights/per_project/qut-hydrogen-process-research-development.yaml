- record_id: ARENA-DLV-60801
  source_title: QUT Hydrogen Process Research & Development - End of Activity Report
  publish_date: 2025-06
  project_name: QUT H2Xport Project (Hydrogen Process R&D)
  what_happened: The COVID-19 pandemic disrupted supply chains, procurement, equipment
    deliveries, on-site engineering presence, and staffing, causing significant project
    delays. No contractual provision had been made for a Force Majeure event in either
    supplier/services contracts or the ARENA agreement.
  lesson_learnt: Include Force Majeure provisions in all equipment supplier, services,
    and funder agreements before project commencement; when an unplanned disruptive
    event occurs, convene the steering committee promptly, re-prioritise activities
    by executability, renegotiate contracts with key stakeholders, and rebalance scope
    and budget before proceeding.
  issue_severity: major
  project_type: multi-technology/hybrid
  project_scale_band: pilot
  lifecycle_phase: procurement
  proponent_type: research organisation/university
  delay_category: procurement/supply chain
  failure_mode: execution & logistics
  outcome_class: delayed but recoverable
  secondary_failure_mode: coordination & stakeholders
  intervention_note: Project activities were re-assessed and prioritised in order
    of executability; the steering committee was convened and contracts were renegotiated
    with key stakeholders to rebalance scope and schedule.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: hydrogen
