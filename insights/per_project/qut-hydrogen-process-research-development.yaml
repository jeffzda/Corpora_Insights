  source_title: QUT Hydrogen Process R&D Project Mid-Term Activity Report
  publish_date: 2021-04
  project_name: H2Xport Project (QUT Hydrogen Process R&D Project)
  what_happened: The rapid growth in demand for green hydrogen caused many original
    equipment manufacturers (OEMs) to shift focus toward large-scale markets, reducing
    available product choice at pilot plant scale during the project procurement phase.
  lesson_learnt: Hydrogen pilot plant projects should not assume equipment availability
    at intermediate scale — OEM attention to large-scale markets can eliminate pilot-scale
    product options mid-project, so procurement planning should identify alternative
    vendors and modular options early.
