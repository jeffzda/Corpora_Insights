  what_happened: Very few electrolyser and battery vendors offered components capable
    of receiving DC power directly at the time of procurement, limiting system efficiency
    options for the pilot plant and reflecting a broader gap in the Australian hydrogen
    equipment market.
  lesson_learnt: Projects integrating electrolysers with DC renewable generation sources
    should investigate DC-direct electrolyser availability early in design — the market
    gap identified here (only one vendor offering DC-direct capability at low-end)
