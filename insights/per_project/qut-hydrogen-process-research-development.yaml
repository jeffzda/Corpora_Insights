- record_id: ARENA-DLV-60802
  source_title: QUT Hydrogen Process Research & Development - End of Activity Report
  publish_date: 2025-06
  project_name: QUT H2Xport Project (Hydrogen Process R&D)
  what_happened: Queensland introduced a Hydrogen Safety Code of Practice in August
    2023 while the pilot plant's gas system remained uncommissioned due to COVID-related
    delays. Because commissioning had not occurred before the code's notification
    date, its provisions applied retrospectively, requiring either 'operating plant'
    status for hydrogen used as a third-party fuel or a Type B gas device certification
    for internal fuel cell consumption — neither of which had budgetary provision.
    The project incurred approximately AUD 0.5 million in additional costs and a one-year
    delay.
  lesson_learnt: Monitor regulatory change pipelines closely and commission plant
    components before new codes take effect where possible; budget explicitly for
    hazardous area design, audit, and Type B device certification when hydrogen is
    involved, and maintain consistent engagement with the relevant regulator (O&G
    inspector, RSHQ) throughout the project lifecycle.
  issue_severity: major
  project_type: multi-technology/hybrid
  project_scale_band: pilot
  lifecycle_phase: commissioning/integration
