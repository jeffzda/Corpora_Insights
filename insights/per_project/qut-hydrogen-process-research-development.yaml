  outcome_class: delayed but recoverable
  secondary_failure_mode: null
  intervention_note: The compressed hydrogen offtake (refueling) option was discarded
    in favour of the fuel cell (Type B device) option to manage elevated operational
    risk, allowing commissioning to proceed under the new regulatory framework after
    compliance activities were completed.
