- record_id: ARENA-DLV-47755
  source_title: QUT Hydrogen Process R&D Project Mid-Term Activity Report
  publish_date: 2021-04
  project_name: H2Xport Project (QUT Hydrogen Process R&D Project)
  what_happened: The power industry's default preference for AC-based microgrid components
    — even where DC generation is available — results in built-in conversion efficiency
    losses for hybrid renewable hydrogen plants, a structural market constraint encountered
    during pilot plant design.
  lesson_learnt: Hybrid renewable hydrogen plant designers should explicitly evaluate
    DC-direct architectures rather than accepting AC conversion losses as a default
    — the assumption that DC components are more expensive above certain power ratings
    has not been adequately tested and may not hold.
  issue_severity: minor
  project_type: multi-technology/hybrid
  project_scale_band: pilot
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: hydrogen
  source_pages: &id003
  - 7
  evidence_excerpt: The perception of higher capital cost for DC components – above
    particular power ratings – appears to be untested. Thus, AC conversion losses
    will be 'built-in' to hybrid renewable energy (including hydrogen) plants until
    supply volume and cost of DC components are reduced.
  confidence_note: issue_severity set to minor as this is a design-stage market constraint
    observation rather than a discrete delivery failure; no schedule or cost impact
