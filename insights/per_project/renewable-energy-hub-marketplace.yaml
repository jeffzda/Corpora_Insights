    NEM, competition in the relatively shallow FCAS markets would reduce FCAS prices,
    while the ongoing deployment of renewables would simultaneously increase the need
    for load shifting and firming, shifting revenue dependence away from FCAS toward
    energy arbitrage products such as Virtual Storage.
