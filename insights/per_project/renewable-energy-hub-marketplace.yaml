  what_happened: FY21 forward electricity prices dropped significantly below previously
    forecast levels during the COVID-19 period due to a combination of low spot electricity
    and gas prices, increased renewables penetration, and pandemic-related demand
    uncertainty, creating earnings headwinds for merchant operators and potentially
    dampening new contract market development.
  lesson_learnt: When developing new energy financial products, anticipate that a
    significant downward shift in forward electricity prices — driven by renewables
    penetration or macro shocks — will reduce merchant operator appetite to contract
    forward revenue, creating a challenging environment for building liquidity in
    new hedge products; project timelines and market adoption milestones should reflect
    this sensitivity.
