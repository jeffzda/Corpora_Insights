- record_id: ARENA-DLV-50103
  source_title: Renewable Energy Hub Contract Performance
  publish_date: 2020-11
  project_name: 'Renewable Energy Hub: A Wholesale Renewable Energy Firming Marketplace
    Demonstration Project'
  what_happened: Markets for Solar Shape contracts became subdued in Q2 2020 as declining
    spot prices driven by record deployment of rooftop and utility-scale solar caused
    price cannibalisation during daytime hours, reducing both the value of the product
    to sellers and retailers' incentive to hedge, with South Australia recording negative
    average monthly prices in September 2020.
  lesson_learnt: New renewable energy hedge contracts targeting solar generation periods
    are structurally exposed to the same price cannibalisation dynamic that makes
    solar generation less profitable — designers should anticipate cyclical low-liquidity
    periods and communicate to participants that product value is expected to recover
    as coal retirements tighten daytime prices.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: null
  failure_mode: commercial & market
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Renewable Energy Hub committed to continuing to track relative
    values of its contracts to standard contracts as the project progresses, and identified
    relative value calculation as a key feature of the Hub digital platform.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages:
  - 7
  - 8
  - 9
  - 26
  - 29
  - 30
  evidence_excerpt: Markets in the Solar Shape contract have remained subdued over
    Q2 of 2020. The decline in spot prices during the day, driven by the ongoing record
    deployment of solar (both utility scale and rooftop) and resulting price cannibalisation
    has dampened interest in hedging forward this contract shape for many participants.
    An interesting lesson from the Project has been the shift in market interest from
    the Solar Shape to the Super Peak contract, perhaps reflecting the growing value
    of balancing or firming resources alongside the ongoing deployment of solar PV.
