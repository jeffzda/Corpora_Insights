  what_happened: The initial Virtual Storage contract design used fixed time periods
    for charge and discharge legs, but market feedback revealed this produced insufficient
    price spread between the low and high price periods, rendering the product commercially
    unattractive; REH redesigned the settlement methodology to a 'Heads & Tails' approach
    that selects the four lowest and four highest half-hourly prices of each day.
  lesson_learnt: For new financial energy products targeting storage operators, early
    and ongoing engagement with a Market Advisory Group is essential — product name,
    duration options, and settlement methodology all required revision after initial
    design, and iterating before first transaction is far less costly than post-launch
    redesign.
