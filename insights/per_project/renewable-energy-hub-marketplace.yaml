  source_title: Renewable Energy Hub Lessons Learnt Report 1
  publish_date: 2020-03
  project_name: Renewable Energy Hub
  what_happened: The project identified that the role and contracting requirements
    for grid-connected battery storage are likely to bifurcate — with lithium-ion
    batteries suited to fast-response frequency/security services (seconds timescale)
    and flow batteries or similar chemistries better suited to deep daily charge-discharge
    cycles for evening peak cover — requiring different contract structures for each
    use case.
  lesson_learnt: Battery storage project developers and financiers should not assume
    a single contract template will suit all battery use cases — the appropriate hedge
    contract structure depends on the battery chemistry and the market service being
    provided, and projects targeting REZ co-location will require purpose-designed
    contracts that differ from those underwriting frequency control services.
