  source_title: Renewable Energy Hub Final Report
  publish_date: 2021-04
  project_name: 'Renewable Energy Hub: A Wholesale Renewable Energy Firming Marketplace
    Demonstration Project'
  what_happened: The project team initially planned to launch all new hedge contracts
    simultaneously to stimulate trading activity, but market stakeholders advised
    that a gradual, sequential release was necessary to allow counterparties to build
    familiarity and slowly grow transaction volume.
  lesson_learnt: When introducing genuinely novel financial instruments to a market,
    resist launching all products simultaneously — a staged release allows counterparties
    to build familiarity and confidence with each product before the next is introduced,
    which ultimately drives higher cumulative transaction volumes.
