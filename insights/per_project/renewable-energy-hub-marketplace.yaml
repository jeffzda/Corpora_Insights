  source_title: Renewable Energy Hub Final Report
  publish_date: 2021-04
  project_name: 'Renewable Energy Hub: A Wholesale Renewable Energy Firming Marketplace
    Demonstration Project'
  what_happened: New renewable energy hedge contracts tended to trade over near-term
    time horizons during the project, whereas project finance requirements demand
    long-term revenue contracting certainty — at project close, negotiations with
    wind, solar, and battery storage developers to use the contracts as the basis
    for longer-term project finance agreements were still ongoing.
  lesson_learnt: Demonstration-scale financial market innovation projects may not
    generate the long-term trading horizon needed to satisfy project finance requirements
    within the project timeframe — proponents should plan for a post-project commercialisation
    phase to extend contract tenors and close project finance-grade agreements.
