- record_id: ARENA-DLV-38103
  source_title: Renewable Energy Hub Lessons Learnt Report 1
  publish_date: 2020-03
  project_name: Renewable Energy Hub
  what_happened: Consultations with over 40 potential platform users identified contract
    evaluation uncertainty as the primary barrier to adoption — specifically, the
    inability to rapidly calculate relative contract values in a live market context
    and assess historical and forecast performance of new hedge products.
  lesson_learnt: When building a digital marketplace for novel financial products,
    prioritise contract evaluation and price discovery tools as core platform features
    before launch — the inability of participants to value new products is the primary
    adoption barrier, and a platform that does not address this will fail to generate
    liquidity regardless of product design quality.
