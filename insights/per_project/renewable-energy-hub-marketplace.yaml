  evidence_excerpt: REH has been challenged by divergent views in contract valuation
    by market participants. This divergence results in wide 'spreads' between bids
    (buyers) and offers (sellers). Throughout a trading day these spreads may stay
    as wide as $10. A key driver of these wide spreads is a divergence in views between
    buyers and sellers as to the 'cap value' captured by the solar products.
