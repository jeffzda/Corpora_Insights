- record_id: ARENA-DLV-38105
  source_title: Renewable Energy Hub Lessons Learnt Report 1
  publish_date: 2020-03
  project_name: Renewable Energy Hub
  what_happened: The standard NEM hedge contract market (baseload, peak, off-peak
    swaps, caps) did not accommodate the variable output profiles of renewable energy
    generators, leaving solar and wind generators exposed to unfavourable contract
    positions during hours they are not producing — a structural gap that the project
    was established to address.
  lesson_learnt: New entrant renewable generators face a fundamental commercial risk
    management gap in the existing hedge contract market — profile-matched financial
    products (shaped to actual generation profiles) are a prerequisite for enabling
    VRE generators to participate in the contract market on commercially rational
    terms, and developing such products requires deliberate market infrastructure
    investment separate from the generation project itself.
  issue_severity: major
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: concept/feasibility
  proponent_type: technology vendor
  delay_category: null
  failure_mode: commercial & market
  outcome_class: follow-on scale-up enabled
  secondary_failure_mode: null
  intervention_note: Renewable Energy Hub designed and launched Solar Shape, Inverse
    Solar Shape, and Super Peak contracts as profile-matched alternatives to flat
    baseload/peak swaps, with a digital platform to facilitate price discovery and
    valuation.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id002
  - 3
  - 17
  evidence_excerpt: This makes sense for traditional non-variable power generation,
    including coal generators, that can pump out energy at any time, because the strike
    price is flat across the day. However, it doesn't work for renewables because
    they are exposed to unfavorable swaps or caps at times of the day that they aren't
    producing power at all.
  confidence_note: failure_mode set to regulatory misfit as the gap is structural/market
    design — the existing market framework did not accommodate VRE. secondary_failure_mode
