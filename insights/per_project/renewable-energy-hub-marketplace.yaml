- record_id: ARENA-DLV-50104
  source_title: Renewable Energy Hub Contract Performance
  publish_date: 2020-11
  project_name: 'Renewable Energy Hub: A Wholesale Renewable Energy Firming Marketplace
    Demonstration Project'
  what_happened: Wide bid/offer spreads of up to $10 persisted in Solar Shape contract
    markets because buyers and sellers held divergent views on the 'cap value' embedded
    in the product — sellers priced in the probability of high price events (>$300/MWh)
    while buyers preferred to purchase separate cap products and did not want to pay
    for cap value within the swap strike price.
  lesson_learnt: When designing new shaped energy contracts, explicitly separate cap
    value from swap value in the product structure from the outset — divergent buyer/seller
    views on embedded optionality will widen bid/offer spreads and suppress liquidity
    until the ambiguity is resolved through a dedicated product variant (e.g. a sub-$300
    version).
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: null
  failure_mode: commercial & market
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: REH created Solar Shape and Inverse Solar <$300 product variants
    that exclude cap value, making it easier for participants to close bid/offer spreads;
    pilot trades in these variants were under discussion at time of report.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages:
