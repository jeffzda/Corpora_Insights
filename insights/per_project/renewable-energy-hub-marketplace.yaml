  what_happened: The Solar Shape contract experienced declining utilisation during
    the project period because the ongoing deployment of solar PV was suppressing
    and stabilising daytime prices, reducing the need to hedge those periods — the
    very market dynamic the contract was designed for had been eroded by market evolution.
  lesson_learnt: Financial hedging products for VRE must be designed with awareness
    that the underlying market dynamics they address can shift significantly during
    and after the project period — a product solving today's market problem may become
    less relevant as VRE penetration increases, and developers should anticipate natural
    demand cycles across their product suite.
