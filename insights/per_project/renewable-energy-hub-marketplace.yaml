  publish_date: 2021-04
  project_name: 'Renewable Energy Hub: A Wholesale Renewable Energy Firming Marketplace
    Demonstration Project'
  what_happened: Counterparties required substantial lead time to obtain internal
    new product approvals (risk and trading limits), develop accounting procedures
    for mark-to-market valuation, and establish requisite settlement processes before
    they could trade the new hedge contracts.
  lesson_learnt: When designing a novel financial product for energy market participants,
    build in sufficient time and supporting tools for counterparties to complete internal
    approval workflows — risk limits, mark-to-market accounting, and settlement processes
    are non-trivial internal hurdles that materially slow adoption and should be anticipated
    in project timelines.
