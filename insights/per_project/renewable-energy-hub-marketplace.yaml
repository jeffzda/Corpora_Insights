  source_title: Renewable Energy Hub Contract Performance
  publish_date: 2020-11
  project_name: 'Renewable Energy Hub: A Wholesale Renewable Energy Firming Marketplace
    Demonstration Project'
  what_happened: The Solar Shape contract had not traded at all in Queensland or South
    Australia despite strong uptake in Victoria and NSW — Queensland's rapidly changing
    intra-day duck-curve price profile provided no incentive for buyers to hedge a
    solar shape, while South Australia historically suffered from low liquidity across
    all contract markets.
  lesson_learnt: When designing VRE-shaped hedge contracts, assess regional spot price
    dynamics before targeting each NEM region — regions with pronounced intra-day
    price inversion (e.g. duck-curve markets like Queensland) reduce buyer incentive
    to hedge solar shape, requiring either product adaptation or market timing aligned
    to coal retirement-driven price recovery.
