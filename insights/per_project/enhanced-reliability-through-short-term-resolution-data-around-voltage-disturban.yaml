- record_id: ARENA-DLV-9116
  source_title: State of DER Technology Integration Report
  publish_date: 2021-02
  project_name: Enhanced Reliability through Short Term Resolution Data around Voltage
    Disturbances
  what_happened: The Solar Analytics project experienced a hardware feasibility study
    that ran several months behind schedule, attributed partly to bushfire and COVID-19
    impacts and partly to the difficulty of long-term planning in technology start-ups.
    Firmware changes and integration also ran slightly behind schedule. A variation
    was under negotiation to extend the project to December 2020.
  lesson_learnt: Technology start-up proponents have inherent capacity constraints
    for long-term planning that can cause schedule slippage independent of external
    events — programme managers should build additional schedule contingency for start-up-led
    projects and consider milestone structures that allow scope adjustment rather
    than only time extensions.
