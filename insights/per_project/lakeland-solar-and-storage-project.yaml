- record_id: ARENA-DLV-1313
  source_title: ARENA Insights Forum Presentation Summaries & Key Points – Large-Scale
    Projects Stream
  publish_date: '2019-06-25'
  project_name: Lakeland Solar and Storage Project
  what_happened: During connection studies, commissioning and generation phases of
    the Lakeland Solar and Storage Project, three different dynamic models for the
    plant had to be created and trialled. Due to a lack of PSCAD and PSSE modelling
    resources in Australia, the models had to be sent to Canada for development.
  lesson_learnt: Identify the availability of PSCAD and PSSE modelling expertise early
    in project development — the absence of local modelling resources in Australia
    can add significant cost, time and coordination complexity to connection studies,
    as demonstrated when Lakeland was forced to send models to Canada.
  issue_severity: major
  project_type: storage
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: project developer
  delay_category: grid connection/system studies
  failure_mode: coordination & stakeholders
  outcome_class: delayed but recoverable
  secondary_failure_mode: execution & logistics
  intervention_note: Models were sent to Canada for development due to lack of local
    PSCAD/PSSE modelling resources in Australia.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hybrid systems
  source_pages: &id001
  - 4
  evidence_excerpt: Creating and trialling three different dynamic models for the
    plant through the course of conducting connection studies, negotiation of GPS,
    commissioning and generation. Due to a lack of modelling resources in Australia,
    the PSCAD and PSSE models had to be sent to Canada to be created.
