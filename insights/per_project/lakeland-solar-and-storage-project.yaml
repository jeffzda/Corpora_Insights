- record_id: ARENA-DLV-1317
  source_title: ARENA Insights Forum Presentation Summaries & Key Points – Large-Scale
    Projects Stream
  publish_date: '2019-06-25'
  project_name: Lakeland Solar and Storage Project
  what_happened: The Lakeland project was designed to seamlessly island the township
    of Lakeland in the event of a grid outage, but due to the configuration of the
    battery system, seamless islanding could not be achieved. The project was still
    trialling solutions to this problem at the time of the forum.
  lesson_learnt: Validate islanding capability against the actual battery configuration
    before finalising grid connection agreements and community commitments — design
    assumptions about seamless islanding may not be achievable with the as-built battery
    configuration, and resolving this after commissioning is both technically complex
    and reputationally costly.
  issue_severity: major
  project_type: storage
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: project developer
  delay_category: commissioning/integration
  failure_mode: unvalidated integration
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Lakeland was trialling different solutions to achieve seamless
    islanding at the time of the forum.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hybrid systems
  source_pages: &id005
  - 4
  evidence_excerpt: The project was expected to have the ability to seamlessly island
    the township of Lakeland, in case the grid goes down. However, due to the configuration
    of the battery, the islanding cannot occur seamlessly. Lakeland is trialling different
    solutions to overcome this issue.
  confidence_note: 'project_scale_band reconciled to ''demonstration'' from: demonstration
    (11/26), utility/large-scale (8/26), first commercial/FOAK (5/26), programmatic/portfolio-level
    (2/26)'
