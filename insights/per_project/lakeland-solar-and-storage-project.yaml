- record_id: ARENA-DLV-1314
  source_title: ARENA Insights Forum Presentation Summaries & Key Points – Large-Scale
    Projects Stream
  publish_date: '2019-06-25'
  project_name: Lakeland Solar and Storage Project
  what_happened: With no on-site technician at Lakeland, remote monitoring was essential.
    If a problem was not quickly or correctly identified, the entire plant could potentially
    be offline for several days.
  lesson_learnt: For remote solar-plus-storage projects without on-site staff, invest
    in comprehensive remote monitoring and visibility of all equipment — failure to
    rapidly identify faults in a remote location can result in multi-day full-plant
    outages with significant energy supply and commercial consequences.
