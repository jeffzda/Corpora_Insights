- record_id: ARENA-DLV-1316
  source_title: ARENA Insights Forum Presentation Summaries & Key Points – Large-Scale
    Projects Stream
  publish_date: '2019-06-25'
  project_name: Lakeland Solar and Storage Project
  what_happened: Panel cleaning frequency at Lakeland was not initially optimised
    using a cost-benefit analysis, as the appropriate cleaning interval varies significantly
    between sites depending on rainfall, dust and pollution levels.
  lesson_learnt: Determine panel cleaning frequency using a site-specific cost-benefit
    analysis rather than applying a standard schedule — rainfall, dust and pollution
    vary substantially between sites and directly affect the optimal cleaning interval
    and its contribution to O&M cost.
  issue_severity: minor
  project_type: storage
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: project developer
