  evidence_excerpt: To operate efficiently a wave energy converter must be tuned to
    the modal wave energy conditions, but also designed and engineered to withstand
    extreme energy conditions. This poses a significant challenge because it is the
    lower energy levels that produce the normal output, but the capital cost is driven
    by the design standard necessary to withstand extreme waves.
