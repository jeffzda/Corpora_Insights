- record_id: ARENA-DLV-72030
  source_title: Australian Energy Resource Assessment – Second edition, 2014
  publish_date: '2014'
  project_name: Wave Energy Converter Design (General — Storm vs. Normal Operation)
  what_happened: 'Wave energy converters face a fundamental design tension: the device
    must be tuned to modal (typical) wave conditions to maximise energy capture, but
    the capital cost is driven by the structural standard required to survive extreme
    storm conditions. This tension has resulted in high capital costs relative to
    energy output and is a primary reason wave energy remains commercially unproven.'
  lesson_learnt: Wave energy converter design programmes should explicitly quantify
    and communicate the storm-survival capital cost premium early in development —
    projects that underestimate this premium will face cost escalation at engineering
    design phase; design trade-off analysis between survival loads and performance
    optimisation should be a standard deliverable of pre-FEED work.
