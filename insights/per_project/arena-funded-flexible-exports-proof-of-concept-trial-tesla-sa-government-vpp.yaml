  source_title: Regulatory Distributed Energy Integration Program (DEIP) Dive Workshop
  publish_date: 2019-06
  project_name: ARENA-funded Flexible Exports Proof-of-Concept Trial (Tesla/SA Government VPP)
  what_happened: SA Power Networks commenced an ARENA-funded $2.1 million proof-of-concept trial implementing flexible (dynamic) export limits in conjunction with the Tesla/South Australian Government Virtual
    Power Plant, to test real-time network capacity management ahead of a planned broader rollout by 2021.
  lesson_learnt: Proof-of-concept trials with real VPP assets are a necessary precursor to rolling out dynamic export frameworks at scale — they allow the technical integration between the DNSP control
    system and distributed assets to be validated before committing to full regulatory and capital programs.
