  what_happened: The exploration module did not test the Obsidian software in a true
    'greenfields' exploration context over a region with poor data coverage or no
    previous drilling. All validation was conducted in areas with pre-existing petroleum
    wells and established geological understanding.
  lesson_learnt: Software tools for geothermal exploration should be validated in
    genuine data-sparse greenfield settings before commercial deployment — outputs
    in well-characterised areas may not reflect real-world performance where prior
    data is limited and uncertainty distributions will be broad.
