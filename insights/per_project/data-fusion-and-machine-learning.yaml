  source_title: Data Fusion and Machine Learning for Geothermal Target Exploration
    and Characterisation Tool
  publish_date: '2014-06-30'
  project_name: Data Fusion and Machine Learning for Geothermal Target Exploration
    and Characterisation
  what_happened: The characterisation module fell short of its objective to fully
    characterise reservoir porosity, fracture geometry, susceptibility and compliance,
    primarily because only one geophysical dataset (MT) was available for inferring
    reservoir characteristics, with other potentially useful datasets either unavailable
    or beyond the project scope to incorporate.
  lesson_learnt: Geothermal reservoir characterisation objectives requiring data fusion
    are only achievable if multiple independent geophysical datasets are actually
    available — project scopes should confirm data availability before committing
    to ambitious multi-sensor characterisation objectives, or explicitly plan for
    new data acquisition campaigns.
