- record_id: ARENA-DLV-71104
  source_title: Data Fusion and Machine Learning for Geothermal Target Exploration
    and Characterisation Tool
  publish_date: '2014-06-30'
  project_name: Data Fusion and Machine Learning for Geothermal Target Exploration
    and Characterisation
  what_happened: Collating numerous disparate geophysical data sources into a common
    format readable by the inference engine was an early and time-consuming difficulty.
    Sourcing reliable rock property data to constrain the inversions was also challenging,
    and the project depended on a dataset that coincidentally came out of confidentiality
    during the measure.
  lesson_learnt: Data integration and curation — formatting, error-checking, coordinate
    reprojection, and sourcing multi-property rock measurements on the same samples
    — is a major hidden cost in geophysical software projects; future projects should
    allocate dedicated resourcing for data preparation and not assume data will be
    available in usable form.
