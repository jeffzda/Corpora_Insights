  publish_date: '2014-06-30'
  project_name: Data Fusion and Machine Learning for Geothermal Target Exploration
    and Characterisation
  what_happened: Existing open-source software tools for processing and interpreting
    magnetotelluric (MT) data were found to be outdated, incomplete, composed of patchwork
    code from multiple generations, and difficult to integrate into the project's
    software. This required the team to spend considerable unplanned time updating,
    reproducing and extending existing MT codes.
  lesson_learnt: Projects building on existing open-source geophysical software should
    conduct a rigorous code audit at the outset — open-source libraries in niche scientific
    domains are frequently outdated and poorly integrated, and the effort to refactor
    or rebuild them should be explicitly scoped and budgeted.
