  what_happened: A key finding of the exploration module was that the Obsidian inversion
    process attains maximum value when constrained by suites of measured rock property
    values on the same rock samples — when density, magnetic susceptibility, electrical
    resistivity, sonic velocity, thermal conductivity and other properties can all
    be determined on the same samples, correlations between properties greatly improve
    joint inversion quality.
  lesson_learnt: Geological agencies and geothermal explorers should systematically
    measure the full suite of physical rock properties on the same core samples and
    release those measurements publicly — co-located multi-property rock measurements
    substantially improve the quality of probabilistic joint inversions and reduce
    exploration risk.
