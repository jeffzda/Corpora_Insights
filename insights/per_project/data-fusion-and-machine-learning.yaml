- record_id: ARENA-DLV-71101
  source_title: Data Fusion and Machine Learning for Geothermal Target Exploration
    and Characterisation Tool
  publish_date: '2014-06-30'
  project_name: Data Fusion and Machine Learning for Geothermal Target Exploration
    and Characterisation
  what_happened: NICTA successfully developed and validated the 'Obsidian' open-source
    probabilistic geophysical inversion software, completing the exploration module
    by running data fusion inversions over the Habanero Geothermal Project area and
    the Moomba gas field region. Predictions from the novel Bayesian inference engine
    were consistent with actual drilling results and independent conventional inversion
    outputs.
  lesson_learnt: Bayesian joint inversion of multiple geophysical datasets can produce
    probabilistic subsurface predictions that match conventional methods while adding
    explicit risk quantification — geothermal explorers should adopt probabilistic
    modelling frameworks to support investment decision-making rather than relying
    solely on deterministic 'best estimate' inversions.
