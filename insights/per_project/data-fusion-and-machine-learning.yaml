- record_id: ARENA-DLV-71115
  source_title: Data Fusion and Machine Learning for Geothermal Target Exploration
    and Characterisation Tool
  publish_date: '2014-06-30'
  project_name: Data Fusion and Machine Learning for Geothermal Target Exploration
    and Characterisation
  what_happened: The characterisation module demonstrated that magnetotelluric (MT)
    data, when jointly inverted with other geophysical datasets, can provide directional
    information about electrical resistivity anisotropy in fractured rock reservoirs
    — a capability not previously demonstrated with open-source software. MT signals
    associated with fracture networks are subtle, however, and joint inversion using
    other data is essential to separate signal from noise.
  lesson_learnt: MT surveys should be included in pre-drilling geothermal data acquisition
    programs and interpreted jointly with gravity, magnetics and seismic data rather
    than in isolation — standalone MT interpretation cannot reliably detect fracture
    network orientation, but joint inversion significantly improves characterisation
