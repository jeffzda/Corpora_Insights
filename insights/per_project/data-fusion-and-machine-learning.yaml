  what_happened: Industry and researchers working with real geophysical data were
    found to provide data in inconsistent formats, with missing or erroneous values,
    and without central indexes of available datasets. The project team sometimes
    found it difficult to discover what data was held by agencies if they didn't already
    know what to look for.
  lesson_learnt: Agencies holding geophysical data should maintain central indexes
    of all data in their possession and enforce open, well-documented data formats
    with quality controls — fragmented, undiscoverable, poorly formatted data repositories
    impose significant hidden costs on research and exploration projects that depend
    on data fusion.
