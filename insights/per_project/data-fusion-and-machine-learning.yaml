- record_id: ARENA-DLV-71108
  source_title: Data Fusion and Machine Learning for Geothermal Target Exploration
    and Characterisation Tool
  publish_date: '2014-06-30'
  project_name: Data Fusion and Machine Learning for Geothermal Target Exploration
    and Characterisation
  what_happened: The software was originally scoped as a plug-in to an existing (likely
    proprietary) geophysics application, but the team elected to build a standalone
    application accepting CSV input instead, significantly increasing interoperability
    and functionality.
