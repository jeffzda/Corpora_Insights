- record_id: ARENA-DLV-2630
  source_title: ARENA Insights Forum November 2024 - Accelerating Zero-Emissions Heavy
    Transport
  publish_date: 2024-11
  project_name: Drive to Zero / Global MOU
  what_happened: The forum presented evidence that industry coalitions advocating
    in support of ambitious regulation have the strongest impact on rulemaking, and
    that not adopting supply-side regulations will increase transportation costs for
    companies in the mid- and long-term — citing CARB analysis showing California's
    Advanced Clean Trucks regulation delivered -$5.9 billion in net costs to truck
    transportation between 2020 and 2040.
  lesson_learnt: Fleet operators and industry associations should actively support
    supply-side regulations rather than opposing them — CARB analysis demonstrates
    that binding clean truck regulations reduce long-term transportation costs compared
    to business-as-usual, and industry coalitions that communicate this economic benefit
    have demonstrably influenced rulemaking outcomes.
  issue_severity: major
  project_type: transport electrification
