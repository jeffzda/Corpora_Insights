  source_title: ARENA Insights Forum November 2024 - Accelerating Zero-Emissions Heavy
    Transport
  publish_date: 2024-11
  project_name: Drive to Zero / Global MOU
  what_happened: Analysis by Nijsse et al. (2024) cited in the forum found that sales
    mandates are the only policy mechanism that puts trucks on track to reduce emissions
    in line with the Paris Agreement, by reallocating investment from fossil fuels
    to clean technologies, driving innovation and cost reduction, and increasing demand.
  lesson_learnt: For fleet electrification programs seeking systemic impact, advocacy
    for binding supply-side sales mandates should be prioritised over voluntary targets
    — mandates are evidenced as the only mechanism that generates the investment reallocation
    needed to achieve Paris-aligned emission reductions in heavy transport.
