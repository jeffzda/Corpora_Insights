- record_id: ARENA-DLV-64108
  source_title: Summary of ARENA Funded Hydrogen R&D Projects
  publish_date: 2023-04
  project_name: CSIRO – Hydrogen to Ammonia
  what_happened: A CSIRO-led project identified that scaling hydrogen and hydrogen
    carrier technologies to commercial viability requires a consortium of strategic
    investors and end-users, which was absent during the R&D phase and limited the
    ability to strengthen the business case for scale-up.
  lesson_learnt: For hydrogen carrier projects targeting commercial scale-up, actively
    form a consortium of strategic and professional investors alongside identified
    end-users during the R&D phase — waiting until technology demonstration is complete
    to seek this alignment significantly weakens the business case and delays the
    pathway to commercialisation.
