- record_id: ARENA-DLV-72302
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects - First Edition Results'
  publish_date: '2015'
  project_name: Smart Country (RWE Deutschland AG)
  what_happened: RWE deployed prototype mobile MV/LV voltage regulators, electronic sectionalisers, and biogas cogeneration units along a 40km 20kV line in rural Germany where wind and PV generation exceeded
    consumption. The biogas facility was controlled to provide effective storage of 3.2MWh(e) by modulating cogenerator output to offset local PV and wind variability.
  lesson_learnt: Biogas cogeneration with controllable output can function as effective dispatchable storage (~3.2MWh(e)) to offset PV and wind variability on weak rural networks — rural network operators
    should consider existing agricultural biogas assets as a low-cost balancing resource before investing in purpose-built storage.
