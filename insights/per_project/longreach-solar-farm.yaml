- record_id: ARENA-DLV-14673
  source_title: 'Lessons From the Fringes: Australian Fringe-Of-Grid Projects in ARENA''s
    Portfolio'
  publish_date: 2018-06
  project_name: Longreach Solar Farm
  what_happened: Construction at Longreach was delayed due to the EPC's late selection
    of the switchroom, which caused a procurement delay; the delay was partially offset
    by air-freighting the switchroom to accelerate manufacture, but insurance extensions
    were still required.
  lesson_learnt: EPC contracts for remote FOG solar projects should mandate early
    procurement of long-lead items such as switchrooms — late selection by the EPC
    creates schedule risk that air freight can partially mitigate but rarely fully
    offset, and insurance extension costs will still be incurred.
