  source_title: 'Lessons From the Fringes: Australian Fringe-Of-Grid Projects in ARENA''s
    Portfolio'
  publish_date: 2018-06
  project_name: Longreach Solar Farm
  what_happened: Longreach Solar Farm modelled and considered the impact of neighbouring
    generators (particularly Barcaldine Solar Farm) before construction, resulting
    in accurate forecasts including MLF projections, with no unexpected issues from
    generator interaction.
  lesson_learnt: Proactively modelling the cumulative network impact of all existing
    and planned neighbouring generators before finalising FOG solar project design
    and financial models leads to more accurate MLF forecasts and avoids the revenue
    surprises experienced by projects that did not conduct this analysis.
