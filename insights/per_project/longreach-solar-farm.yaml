- record_id: ARENA-DLV-14672
  source_title: 'Lessons From the Fringes: Australian Fringe-Of-Grid Projects in ARENA''s
    Portfolio'
  publish_date: 2018-06
  project_name: Longreach Solar Farm
  what_happened: Longreach experienced local sourcing challenges for specialty equipment
    and labour, particularly during contingency (unexpected) events; however, pre-identifying
    and pre-approving local civil and electrical contractors from Longreach and Winton
    before construction began effectively mitigated these challenges.
  lesson_learnt: For remote FOG projects, identify and pre-approve local contractors
    and equipment hire sources before construction commences — this preparation is
    critical for managing unexpected events where remote logistics make reactive sourcing
    costly and slow.
