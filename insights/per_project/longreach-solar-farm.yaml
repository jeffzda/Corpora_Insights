  source_title: 'Lessons From the Fringes: Australian Fringe-Of-Grid Projects in ARENA''s
    Portfolio'
  publish_date: 2018-06
  project_name: Longreach Solar Farm
  what_happened: National Electricity Rules (NER) rule changes during the Longreach
    project had implications for the approach agreed in the connection agreement,
    impacting both the construction and design phases and requiring rework.
  lesson_learnt: FOG solar projects with extended development timelines should build
    regulatory change risk into connection agreements and design documentation — NER
    rule changes can invalidate agreed connection approaches mid-project, triggering
    redesign and construction rework if not anticipated.
