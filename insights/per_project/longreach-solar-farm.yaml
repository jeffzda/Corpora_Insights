  project_name: Longreach Solar Farm
  what_happened: Ergon Energy's metering provision scope required revision during
    the Longreach project because the NSP was unable to deliver revenue metering and
    related services as originally agreed in the connection arrangement.
  lesson_learnt: Do not assume the NSP will deliver all metering services specified
    at connection agreement stage — independently verify the NSP's capability and
    commitment to provide revenue metering before finalising construction and commissioning
    schedules, as scope revisions can cause costly delays.
