- record_id: ARENA-DLV-14670
  source_title: 'Lessons From the Fringes: Australian Fringe-Of-Grid Projects in ARENA''s
    Portfolio'
  publish_date: 2018-06
  project_name: Longreach Solar Farm
  what_happened: Longreach Solar Farm's output was curtailed due to the transformer
    size limit at the shared substation with Barcaldine Solar Farm, with curtailment
    most pronounced in winter when local demand is lowest. The project team was investigating
    whether transformer capacity could be enlarged.
  lesson_learnt: Where a new FOG solar farm shares substation infrastructure with
    an existing generator, transformer capacity must be sized for the combined maximum
    output of all connected generators — undersizing leads to curtailment, particularly
    in low-demand periods, eroding revenue.
