  evidence_excerpt: The two‐year research project has transferred CSIRO technology
    from the laboratory to the real world. The project team have developed a commercially‐feasible
    prototype system and gained a significant and valuable understanding of many practical
    aspects of residential integration... The establishment of strong networks and
    relationships between CSIRO, GWA and Ergon Energy staff and the creation of a
    core project development team including CSIRO research staff, GWA technical staff
    and Ergon Energy engineers.
  confidence_note: issue_severity set to none as the successful technology transfer
