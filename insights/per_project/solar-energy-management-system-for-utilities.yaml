- record_id: ARENA-DLV-62401
  source_title: 'Solar Energy Management for Utilities - Final Report: Project Results
    and Lessons Learnt'
  publish_date: 2014-06
  project_name: Solar Energy Management for Utilities (3-A020)
  what_happened: Prototype solar desiccant air conditioner units deployed at three
    residential trial sites in Townsville and Magnetic Island experienced significant
    reliability and performance issues with commercial components, requiring substantial
    unplanned travel by the project team and an international manufacturer visit to
    resolve a component performance fault.
  lesson_learnt: When deploying prototype systems at geographically remote trial sites,
    pre-qualify commercial components for reliability before installation and establish
    a local technical support presence — remote fault resolution for overseas-sourced
    equipment created disproportionate travel cost, delays, and data analysis constraints.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: research organisation/university
  delay_category: commissioning/integration
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: execution & logistics
  intervention_note: An overseas manufacturer travelled to Australia to resolve the
    commercial component performance issue on-site, enabling partial system operation
    and performance data collection.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: other
  source_pages:
  - 6
  evidence_excerpt: Significant challenges regarding the reliability and performance
    of commercial components were experienced during this project. These challenges
    were compounded by i) the distance between the project team and the trial sites
    and ii) equipment sourced from overseas which contributed to significant equipment
    supply, fault identification and resolution and communication challenges. Significant
    extra project team travel to the trial sites was required in addition to the travel
    to Australia by a manufacturer to resolve a commercial component performance issue.
