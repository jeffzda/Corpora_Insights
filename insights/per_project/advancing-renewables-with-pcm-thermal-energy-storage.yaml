  source_title: Glaciem - PCM Thermal Energy Storage Project - Lessons Learnt Report
    3
  publish_date: '2024-05-13'
  project_name: Advancing Renewables with PCM Thermal Energy Storage
  what_happened: The Reef HQ site had a zero export limit on its electricity contract,
    meaning excess solar PV generation caused progressive disconnection of solar inverters
    in banks, wasting renewable energy and effectively stranding the existing 206
    kW solar PV asset. Prior to the TES/ACFA installation, the site could not utilise
    all renewable electricity generated during high solar irradiance periods.
  lesson_learnt: Sites with zero-export electricity contracts and large solar PV systems
    are strong candidates for thermal energy storage — TES can absorb excess generation
    that would otherwise be curtailed, improving the economics of the existing solar
    asset and enabling additional PV capacity to be installed.
