  source_title: Glaciem - PCM Thermal Energy Storage Project - Lessons Learnt Report
    3
  publish_date: '2024-05-13'
  project_name: Advancing Renewables with PCM Thermal Energy Storage
  what_happened: The Montague site required a novel engineering design to address
    a fundamental mismatch between constant hot water heating demand for fruit processing
    and seasonal refrigeration cooling loads that varied significantly between summer
    and winter, with the risk that TES units could freeze solid by Thursday in winter
    during the production week.
  lesson_learnt: For industrial processes with asymmetric seasonal heating and cooling
    profiles, TES sizing and control logic must account for worst-case weekly accumulation
    scenarios — an airside evaporator or false load acting as an overflow valve for
    excess stored energy is a low-cost safeguard that prevents TES from becoming a
    constraint rather than an enabler.
  issue_severity: moderate
  project_type: multi-technology/hybrid
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: technology vendor
