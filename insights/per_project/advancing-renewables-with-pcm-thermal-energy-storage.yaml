  what_happened: The ACFA optimisation required prediction of whether the site would
    be importing or exporting energy to determine electricity value, but predicting
    other site electrical loads with sufficient accuracy proved infeasible in some
    cases.
  lesson_learnt: When optimising thermal storage dispatch, if other site loads are
    large enough that the site rarely exports, use only the import price to simplify
    the optimisation — if the import/export price difference is small, inaccurate
    load forecasts will not materially impact cost savings.
