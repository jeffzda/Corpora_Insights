  project_name: Advancing Renewables with PCM Thermal Energy Storage (Reef HQ Aquarium)
  what_happened: The PCM TES system demonstrated a discharge COP of 40–70, with a
    recorded instance of delivering 166.3 kW of cooling using only 2.4 kW of pumping
    power (COP of 69). On a sample day (14 August 2022), TES charging avoided up to
    330 kWh of grid electricity import that would have been required had the solar
    PV shut down, in addition to demand charge savings.
  lesson_learnt: PCM thermal energy storage systems can deliver cooling at exceptionally
    high discharge efficiency (COP 40–70) because only pumping power is required during
    discharge. For commercial facilities with large cooling loads and zero-export
    solar constraints, PCM TES offers a high-efficiency mechanism to shift solar generation
    into cooling services, with measurable demand charge and energy cost benefits
    that should be quantified in feasibility assessments.
