- record_id: ARENA-DLV-8251
  source_title: Advancing Renewables with PCM Thermal Energy Storage Case Study
  publish_date: '2022-03-24'
  project_name: Advancing Renewables with PCM Thermal Energy Storage
  what_happened: The ACFA control system was configured using only the MSB-F switchboard
    data (representing ~10% of total site load) rather than whole-site peak demand
    data, causing it to operate in intermediate mode rather than discharge mode during
    whole-site peak demand events, leaving demand charge savings unrealised.
  lesson_learnt: Control algorithms for demand-response thermal storage must be configured
    using whole-site demand data, not a single sub-board; optimising against a partial
    load proxy will cause the system to miss peak demand reduction opportunities and
    forgo the largest category of cost savings.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: partial success
  secondary_failure_mode: poor scoping
  intervention_note: The case study identifies that integrating whole-site peak demand
    data into ACFA would resolve the suboptimal control behaviour, but this had not
    yet been implemented at the time of publication.
  transferability: moderate
  delay_magnitude: null
  technology_domain: other
  source_pages: &id030
  - 20
  - 21
  evidence_excerpt: due to the limited data of the peak demand profile for the whole
    site, it was assumed that MSB-F is the total electricity used for the purposes
    of setting up ACFA. Therefore, ACFA set the status of TES on the intermediate
    mode during the predicted peak demand of MSB-F switchboard. This meant a minimised
    interaction with the grid (no import or export) and so ACFA managed the system
    based on the internal resources, PV and TES. This control strategy may not be
    optimal as the peak demand from the whole site is the base for the calculation
    of peak demand charges.
  confidence_note: null
  source_url: https://arena.gov.au/knowledge-bank/advancing-renewables-with-pcm-thermal-energy-storage-case-study/
