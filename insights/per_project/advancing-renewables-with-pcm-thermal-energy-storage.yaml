- record_id: ARENA-DLV-41502
  source_title: Glaciem - PCM Thermal Energy Storage Project - Final Report
  publish_date: '2024-05-22'
  project_name: Advancing Renewables with PCM Thermal Energy Storage
  what_happened: The Commercial Research Agreement (CRA) with UniSA did not include
    an explicit obligation for UniSA to complete deliverables, only a 'best efforts'
    provision for variations. When the CRA term expired with deliverables incomplete,
    there was no contractual mechanism to compel completion or negotiate an extension,
    leaving the project without the key software product.
  lesson_learnt: Ensure research partner contracts explicitly require completion of
    defined deliverables — not merely best-efforts participation — and include provisions
    covering what happens if the term expires before deliverables are complete. A
    time-limited effort-based CRA is inadequate for projects where a specific commercial
    output is required.
