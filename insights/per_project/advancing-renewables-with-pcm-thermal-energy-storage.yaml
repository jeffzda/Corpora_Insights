  publish_date: '2024-05-13'
  project_name: Advancing Renewables with PCM Thermal Energy Storage
  what_happened: At the Montague site, COVID-19 restrictions in China prevented the
    originally specified Chinese manufacturer from confirming build and shipment dates
    for the TES tanks, creating a serious risk to project delivery timelines.
  lesson_learnt: Do not rely on a single overseas supplier for critical long-lead
    items — identify local manufacturing alternatives at the procurement planning
    stage so that geopolitical or pandemic-related supply disruptions can be absorbed
    without schedule collapse.
