  failure_mode: unvalidated integration
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Reading flow from the installed chilled water flow meter as the
    control input, or using a differential pressure sensor instead of a pressure transducer,
    resolves the variable flow issue.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: other
  source_pages: &id080
  - 4
  - 5
  evidence_excerpt: When the Glaciem chiller is in parallel with the site's current
    chiller circulating chilled water to and from the same points that the existing
    secondary loop pump is circulating water, the operation of the existing pump impacts
    the pressure at the suction of Glaciem pump. As a result, the discharge pressure
    can vary and following a setpoint ends in a variable chilled water flow. Best
    is to read the flow from the recently installed chilled water flow meter and use
