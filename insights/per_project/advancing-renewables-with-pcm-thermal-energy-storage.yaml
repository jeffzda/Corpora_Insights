  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: An airside evaporator was added to the system design to serve
    as a controlled false load, preventing the TES from freezing solid when cooling
    loads were low but the heat pump continued generating cold.
  transferability: narrow
  delay_magnitude: null
  technology_domain: other
  source_pages: &id018
  - 20
  evidence_excerpt: Engineering analysis of the cooling and heating processes at the
    new facility, highlighted the potential that even though the two TES units would
    be totally discharged over the weekend under certain conditions the two TES units
    had the potential to turn into complete blocks of ice by Thursday seriously impacting
    the heat pump ability to produce hot water towards the end of the week in winter.
    This was overcome by the addition of a small airside evaporator that could be
    engaged if the control system calculated the possibility of this event occurring.
