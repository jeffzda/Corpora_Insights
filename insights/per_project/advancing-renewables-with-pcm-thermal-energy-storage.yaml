  what_happened: UniSA management treated the Commercial Research Agreement (CRA)
    as an effort-based obligation rather than an outcomes-based deliverable contract.
    Project management of UniSA's deliverables was left to project-level resources
    who lacked project management skills, creating governance failures that were only
    partially addressed when a project manager was added — who also lacked relevant
    software development experience.
  lesson_learnt: When contracting with a university partner for software development
    deliverables, ensure the agreement is explicitly outcomes-based with clear deliverable
    completion obligations — 'best efforts' provisions are insufficient. Require the
    partner to appoint a project manager with demonstrated commercial software project
    management experience as a contract condition.
