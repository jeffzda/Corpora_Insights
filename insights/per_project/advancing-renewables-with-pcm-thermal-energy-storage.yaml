  what_happened: Winery operators investigated adding electrical battery storage alongside
    solar PV but found it economically unviable due to high installed cost, short
    lifespan, and the inefficiency of converting stored electrical energy back to
    thermal energy via vapour compression to service cooling loads — a double conversion
    penalty that TES avoids by storing thermal energy directly.
  lesson_learnt: For industrial facilities where the dominant energy load is cooling
    or refrigeration, electrical battery storage is a poor fit due to the double conversion
    penalty (electrical → mechanical → thermal); TES should be evaluated as the primary
    storage technology for cooling loads, with electrical batteries reserved for power
    continuity applications such as control systems and pumps.
