  what_happened: The document identifies that both the Ocean Park (WA) and Reef HQ
    (QLD) TES deployments in the aquarium sector required government loans or grants
    to proceed, and explicitly states that TES technologies require ongoing policy
    support and demonstration project funding to achieve broader industry uptake.
  lesson_learnt: PCM thermal energy storage projects in commercial facilities are
    not yet self-funding on commercial terms alone — government financial support
    (loans, grants, or demonstration funding) is a necessary enabler for first deployments;
    project teams should build a policy and grant funding strategy into project development
    from the outset rather than relying on commercial IRR alone.
