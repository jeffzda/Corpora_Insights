  project_name: Advancing Renewables with PCM Thermal Energy Storage
  what_happened: Actual net energy cost savings from the TES and ACFA system over
    approximately 10 months (March–December 2021) were $10,436, compared to a theoretical
    maximum of $11,940 — $1,527 in potential savings during negative import price
    periods were not captured because the TES lacked sufficient remaining storage
    capacity.
  lesson_learnt: Ensure thermal storage capacity is sized to absorb energy during
    negative-price periods as well as discharge during high-price events; limited
    headroom at low or negative prices directly reduces arbitrage capture and leaves
    money on the table.
