  project_name: Advancing Renewables with PCM Thermal Energy Storage (ARENA Project)
  what_happened: The document identifies that grid export limits imposed by electricity
    providers — introduced because more solar PV connecting to the grid creates balance
    and stability concerns — reduce the return-on-investment for solar PV owners and
    create a structural driver for on-site energy storage adoption across commercial
    and industrial sites.
  lesson_learnt: Projects designing commercial-scale solar PV systems for facilities
    with continuous loads should account for grid export restrictions at the outset
    — curtailment risk directly reduces PV revenue and ROI, and must be mitigated
    through on-site storage sizing rather than treated as a residual risk after installation.
