  project_name: Advancing Renewables with PCM Thermal Energy Storage
  what_happened: Integration of the Glaciem PCM TES systems into existing operational
    sites (Pernod Ricard Winemakers and Reef HQ) was complicated by the sites' year-round
    operational requirements. Extended shutdowns of existing refrigeration systems
    were not feasible because downstream processes depended on continuous cooling.
  lesson_learnt: When integrating new thermal energy storage into existing operational
    food or industrial process sites, plan for multiple short scheduled shutdowns
    rather than a single extended installation outage — continuous downstream process
    reliance typically makes extended shutdowns impractical and must be factored into
    the installation programme from the outset.
