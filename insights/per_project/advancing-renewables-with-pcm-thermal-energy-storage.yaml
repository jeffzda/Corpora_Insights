    product, and ACFA was not deployed at Montague, preventing financial benefit analysis
    at that site.
  lesson_learnt: CRA agreements with university partners must include explicit provisions
    for the scenario where the term expires with deliverables incomplete — including
    an obligation to complete, a dispute resolution mechanism, and an obligation not
    to abandon the project without a managed handover. Without these provisions, a
    partner can walk away with no legal remedy available.
