  project_name: Advancing Renewables with PCM Thermal Energy Storage
  what_happened: The COVID-19 pandemic caused significant supply chain disruptions
    and travel restrictions across all three project sites, which were not anticipated
    in the project's risk management plan. These disruptions delayed installation
    and commissioning activities throughout the project.
  lesson_learnt: COVID-19 and similar systemic disruptions will not appear in standard
    risk registers — build explicit supply chain contingency and agile project management
    methodology into the risk management plan from the outset so the team has sanctioned
    flexibility to adapt when disruptions occur.
