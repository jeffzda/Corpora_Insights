  what_happened: The supply chain disruption caused by COVID-19 led Glaciem to shift
    manufacturing of PCM TES units from China to Australia for the Montague site and
    to subsequently source all components and manufacturing wholly in Australia. Despite
    this reshoring, capital equipment costs only increased by 4% — below what inflation
    alone would have implied.
