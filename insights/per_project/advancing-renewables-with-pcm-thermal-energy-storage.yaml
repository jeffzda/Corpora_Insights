  what_happened: Glaciem proposed integrating a 1.2 MWh latent heat PCM thermal energy
    storage unit (Thermcold DYN420) with the existing chilled water and HVAC-R systems
    at Reef HQ, targeting on-site storage of up to 75% of solar PV generation, controlled
    via a cloud-based optimisation algorithm (ACFA) updating a dynamic schedule every
    30 minutes linked to tariff structure and PV forecasting.
