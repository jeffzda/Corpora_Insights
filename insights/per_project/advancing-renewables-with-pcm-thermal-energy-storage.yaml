  what_happened: The ACFA cloud-based control system was successfully integrated with
    Reef HQ's existing Building Management System (BMS) via a proxy PLC, enabling
    dynamic 30-minute schedule updates that maximised on-site solar self-consumption
    and prevented PV curtailment. Monitored data confirmed accurate predictions of
    grid electrical power and on-site thermal load.
  lesson_learnt: A cloud-based forecasting and control algorithm can be practically
    integrated into an existing commercial BMS via a proxy PLC interface without replacing
    legacy control infrastructure. This architecture — offsite forecasting server
    communicating a schedule to an onsite PLC — is a transferable pattern for retrofit
    thermal storage control at commercial and institutional facilities.
