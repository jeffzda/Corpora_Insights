- record_id: ARENA-DLV-54712
  source_title: Advancing Renewables with PCM Thermal Energy Storage Lessons Learnt
    1
  publish_date: '2021-10-29'
  project_name: Advancing Renewables with PCM Thermal Energy Storage Project (2019/ARP025)
  what_happened: When the Glaciem chiller was installed in parallel with an existing
    site chiller sharing the same chilled water loop, the existing secondary loop
    pump's operation affected suction pressure at the Glaciem pump, causing variable
    discharge pressure and unstable chilled water flow when following a setpoint.
  lesson_learnt: When integrating a new chiller in parallel with an existing chiller
    on a shared secondary loop, use chilled water flow meter readings as the control
    input rather than a pressure transducer — alternatively, install a differential
    pressure sensor — to avoid variable flow caused by interference between pumps.
  issue_severity: moderate
