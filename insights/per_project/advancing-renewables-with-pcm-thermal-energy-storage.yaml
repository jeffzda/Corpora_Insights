  what_happened: Underestimating thermal load in the ACFA resulted in the system melting
    all stored ice while electricity prices were still high, eliminating the stored
    buffer and the cost-saving benefit of the storage asset.
  lesson_learnt: In load forecasting for thermal storage dispatch, deliberately bias
    toward overestimating load rather than underestimating — the downside of overestimation
    (unused store capacity) is less costly than underestimation (store depleted during
    high-price periods).
