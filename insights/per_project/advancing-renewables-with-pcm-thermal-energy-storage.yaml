  source_title: Glaciem - PCM Thermal Energy Storage Project - Lessons Learnt Report
    3
  publish_date: '2024-05-13'
  project_name: Advancing Renewables with PCM Thermal Energy Storage
  what_happened: Post-commissioning service and maintenance of the CO2 heat pump at
    Reef HQ was severely hampered by a lack of locally qualified technicians in regional
    Queensland. Although CO2 systems are common in capital cities, the Reef HQ installation
    was the first CO2 heat pump in Northern Queensland, and local service providers
    struggled to diagnose and rectify faults even after significant training.
  lesson_learnt: Before deploying novel refrigerant technology in regional areas,
    assess local technician capability and establish a training and support programme
    — or plan for the technology provider to deliver ongoing service directly, as
    relying on local incumbents unfamiliar with the technology creates operational
    reliability risk.
  issue_severity: moderate
  project_type: multi-technology/hybrid
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: null
  failure_mode: execution & logistics
  outcome_class: partial success
  secondary_failure_mode: coordination & stakeholders
  intervention_note: Significant training was provided to local service personnel,
    though this did not fully resolve the capability gap.
  transferability: moderate
  delay_magnitude: null
  technology_domain: other
  source_pages: &id007
  - 12
  evidence_excerpt: By far the biggest challenge in the project has been the ongoing
    service and maintenance of the integrated plant... CO2 systems are common in capital
    cities in Australia, they are extremely rare in regional areas. The CO2 heat pump
    was the first to be installed in Northern Queensland. Local service and maintenance
    providers struggled in diagnosing and rectifying faults even after a significant
    amount of training was given to local personnel.
