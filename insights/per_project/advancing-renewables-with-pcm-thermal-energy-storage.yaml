  failure_mode: execution & logistics
  outcome_class: delayed but recoverable
  secondary_failure_mode: null
  intervention_note: Glaciem made the decision to manufacture the TES units locally
    in Adelaide, sourcing all components from Australia, avoiding the overseas supply
    chain constraint entirely.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: other
  source_pages: &id002
  - 20
  evidence_excerpt: Originally the TES tanks were sourced from China. Due to COVID
    restrictions in China the Chinese manufacture were not able to confirm when these
    units could be built and shipped. This potentially would have significant implication
    on the project delivery dates. Therefore Glaciem made the decision to manufacture
    the TES units locally in Adelaide sourcing all components from Australia.
