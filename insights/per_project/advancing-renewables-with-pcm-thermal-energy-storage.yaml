- record_id: ARENA-DLV-4055
  source_title: Glaciem - PCM Thermal Energy Storage Project - Lessons Learnt Report
    3
  publish_date: '2024-05-13'
  project_name: Advancing Renewables with PCM Thermal Energy Storage
  what_happened: Post-commissioning service and maintenance of the integrated PCM
    TES and ACFA system at PRW was problematic because site service providers lacked
    experience with the specialised equipment. Faults in the existing ammonia chiller
    were initially wrongly attributed to the new TES/ACFA integration.
  lesson_learnt: The HVAC-R sector has a significant skills gap in servicing novel
    thermal storage and advanced control systems — technology providers should bring
    service and maintenance capability in-house rather than rely on third-party incumbents
    who may misdiagnose faults and damage confidence in new technology.
  issue_severity: moderate
  project_type: multi-technology/hybrid
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: null
  failure_mode: coordination & stakeholders
  outcome_class: partial success
  secondary_failure_mode: execution & logistics
  intervention_note: Glaciem attended site and worked through issues with the incumbent
    service provider, demonstrating that faults were pre-existing ammonia chiller
    component failures unrelated to the TES/ACFA system.
  transferability: moderate
  delay_magnitude: null
  technology_domain: other
  source_pages: &id005
  - 7
  evidence_excerpt: By far the biggest challenge in the project has been the ongoing
    service and maintenance of the integrated plant. We feel this challenge is mainly
    due to the skill shortage and lack experience in the HVAC-R sector. Any system
    issues with the ammonia chiller we originally were blamed on the integration of
    the new TES/ACFA system.
