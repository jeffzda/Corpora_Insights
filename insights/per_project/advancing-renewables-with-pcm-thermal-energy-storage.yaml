- record_id: ARENA-DLV-65008
  source_title: Advancing Renewables with PCM Thermal Energy Storage ReefHQ White
    Paper
  publish_date: 2023-03
  project_name: Advancing Renewables with PCM Thermal Energy Storage (ARENA Project)
  what_happened: The document notes that many industrial operators (including aquariums)
    investigated adding electrical battery storage alongside solar PV but found it
    not economically viable due to high installed cost and relatively short lifespan,
    particularly because electrical batteries are not designed for the repeated high-power
    draw of refrigeration compressors.
  lesson_learnt: When evaluating storage options for facilities with large, continuous
    HVAC-R loads, do not default to electrical battery storage — the power conversion
    penalty (battery → electricity → mechanical compression) and battery cycle life
    under compressor load profiles make lithium-ion batteries uneconomic; thermal
    energy storage directly at the cooling medium avoids these conversion losses and
    better matches the load profile.
