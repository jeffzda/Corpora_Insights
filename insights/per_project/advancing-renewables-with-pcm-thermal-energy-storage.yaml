    and can partially offset supply chain risk from global disruptions, with capital
    cost increases that may be modest relative to the supply chain resilience gained.
    Projects procuring specialised thermal storage equipment should evaluate domestic
    manufacturing options as a supply chain risk mitigation strategy.
