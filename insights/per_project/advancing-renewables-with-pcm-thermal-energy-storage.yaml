- record_id: ARENA-DLV-36651
  source_title: Glaciem - PCM Thermal Energy Storage Project - Case Study Report
  publish_date: '2024-05-20'
  project_name: Advancing Renewables with PCM Thermal Energy Storage (Reef HQ Aquarium)
  what_happened: Reef HQ Aquarium operated under a zero-export electricity contract,
    meaning excess solar PV generation could not be exported to the grid. When renewable
    generation exceeded site load, solar inverters were progressively disconnected
    in ~50 kW banks, and if export still occurred, the entire PV system was disconnected
    within 3 seconds. This rendered a 206 kW rooftop solar installation (the largest
    in North Queensland at installation) a partially stranded asset and made expanding
    PV capacity unviable.
  lesson_learnt: Sites with zero-export grid contracts cannot fully utilise large
    solar PV installations without an on-site energy storage or demand-flexibility
    buffer. Before installing significant rooftop solar at a commercial facility,
