- record_id: ARENA-DLV-54708
  source_title: Advancing Renewables with PCM Thermal Energy Storage Lessons Learnt
    1
  publish_date: '2021-10-29'
  project_name: Advancing Renewables with PCM Thermal Energy Storage Project (2019/ARP025)
  what_happened: The Advanced Control Forecasting Algorithm (ACFA) struggled to optimally
    manage electricity demand charges based on annual peak demand because it is impossible
    to predict which half-hour period during the year will set the annual demand charge,
    creating a conflict between cost minimisation and demand management strategies.
  lesson_learnt: 'For sites with annual peak demand charges, implement a hybrid control
    strategy: default to minimising energy costs, and switch to demand management
    mode only during periods of high risk of setting the annual demand peak — this
    avoids the trade-off between under-storing thermal energy and managing unpredictable
    demand peaks.'
  issue_severity: moderate
  project_type: storage
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: 'A practical hybrid strategy was developed: minimise energy costs
    as default, switch to demand management only when there is a high risk of setting
    the annual demand peak.'
  transferability: moderate
  delay_magnitude: null
  technology_domain: other
  source_pages: &id076
  - 4
  evidence_excerpt: Electricity charges based on annual peak demand are difficult
    to handle, because we cannot predict which half-hour period during the year will
    determine the demand charge. If we are running a strategy designed to minimise
    the contribution to a possible peak demand charge, then we may not store as much
    thermal energy as we would if we were just minimising energy costs. A practical
    way to overcome this dilemma is to minimise energy costs as the default strategy,
    and switch to a demand management strategy only during periods when there is a
    high risk of setting the annual demand peak.
