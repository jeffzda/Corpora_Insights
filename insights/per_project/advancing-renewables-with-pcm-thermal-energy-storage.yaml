  what_happened: A mid-project tariff change (from Low Voltage Maximum Demand monthly
    charges to a Large Business Annual Demand Tariff from 1 July 2020) materially
    altered the balance of energy versus network charges, shifting the dominant cost
    component from energy arbitrage (NEM RRP) to network/demand charges, and requiring
    reassessment of the optimal ACFA control strategy.
  lesson_learnt: Monitor and anticipate tariff structure changes throughout a project's
    operating life; a shift from energy-dominated to demand-dominated tariffs can
    fundamentally alter the economics and optimal control logic of a thermal storage
    system, requiring algorithm reconfiguration rather than just parameter updates.
