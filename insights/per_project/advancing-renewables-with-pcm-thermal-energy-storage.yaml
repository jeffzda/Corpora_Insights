  publish_date: '2024-05-22'
  project_name: Advancing Renewables with PCM Thermal Energy Storage
  what_happened: Early PCM TES control systems scheduled charge/discharge only around
    day/night or peak/off-peak tariffs, which proved inadequate as commercial-scale
    PV adoption, demand-based tariffs, PPA wholesale exposure, and regional PV demand
    management schemes transformed the economics of PCM TES systems.
  lesson_learnt: Control system design for thermal storage must be scoped to handle
    demand (kVA) charges, wholesale market exposure, PPA structures, and regional
    PV export constraints from the outset — control systems designed only for simple
    time-of-use tariffs become commercially obsolete as market and network conditions
    evolve.
