    TES sized to capture the majority of on-site PV generation — combined with a dynamic
    control algorithm that integrates tariff signals and weather forecasting — can
    address the self-consumption gap that PV-only installations leave; the 30-minute
    schedule update cycle is a practical design parameter for matching thermal inertia
    with market price volatility.
