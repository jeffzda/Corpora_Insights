  project_name: Advancing Renewables with PCM Thermal Energy Storage
  what_happened: Across all three project sites, the single most unforeseen technical
    challenge after commissioning was the lack of suitably trained technicians to
    carry out ongoing service and maintenance of the specialised PCM TES and heat
    pump equipment, creating operational reliability risks.
  lesson_learnt: For novel HVAC-R technologies, technology providers should bring
    service and maintenance capability in-house as a standard part of the commercial
    model rather than relying on third-party service providers — the skills gap in
    the sector means incumbent service providers cannot reliably maintain specialist
    equipment, and this risk should be planned for before commissioning.
