  what_happened: The installed TES was undersized relative to the site's optimal configuration
    — analysis indicated the refrigeration capacity and TES storage should be doubled
    to fully capture available savings, with the undersizing limiting charge/discharge
    power capacity by up to a factor of two.
  lesson_learnt: Size thermal energy storage systems based on a full arbitrage and
    peak-demand analysis before procurement; an undersized TES (by up to 2×) constrains
    the algorithm's ability to charge during negative-price periods and discharge
    during peak events, directly capping achievable savings.
