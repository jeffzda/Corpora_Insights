- record_id: ARENA-DLV-4054
  source_title: Glaciem - PCM Thermal Energy Storage Project - Lessons Learnt Report
    3
  publish_date: '2024-05-13'
  project_name: Advancing Renewables with PCM Thermal Energy Storage
  what_happened: Integration of the ACFA cloud-control system with PRW's existing
    SCADA and IT infrastructure proved extremely challenging due to PRW's strict IT
    security protocols, and the age of existing control systems caused communication
    protocol incompatibilities — the ammonia chiller's Mitsubishi PLC could not communicate
    with the new system.
  lesson_learnt: Before finalising control system design, conduct a detailed IT security
    and communications protocol audit with the site's IT department — legacy PLCs
    and strict security policies are common in industrial sites and can require hardware
    replacement or custom protocol bridging that must be scoped and budgeted upfront.
  issue_severity: moderate
  project_type: multi-technology/hybrid
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: technology vendor
  delay_category: commissioning/integration
  failure_mode: unvalidated integration
  outcome_class: delayed but recoverable
  secondary_failure_mode: poor scoping
  intervention_note: Close collaboration with PRW's IT department and UniSA resolved
    the network architecture compliance issues; the incompatible Mitsubishi PLC was
    replaced with a new Schneider PLC to enable communications.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: other
  source_pages: &id004
  - 7
  evidence_excerpt: PRW have strict IT security protocols and designing the network
    architecture that complied with the security protocols was extremely challenging...
    The age of some of the exiting control systems also proved challenging with regards
    to communication protocols in particular the ammonia chiller Mitsubishi PLC. This
    was overcome by replacing the PLC with a new Schnieder PLC.
