- record_id: ARENA-DLV-4056
  source_title: Glaciem - PCM Thermal Energy Storage Project - Lessons Learnt Report
    3
  publish_date: '2024-05-13'
  project_name: Advancing Renewables with PCM Thermal Energy Storage
  what_happened: Integration of the ACFA system with Reef HQ's existing Building Management
    System (BMS) was complicated by the site's strict federal-government IT security
    protocols and by the fact that the legacy BMS only supported BACnet protocols
    while all new systems used MODBUS.
  lesson_learnt: When integrating new energy management systems into government-operated
    facilities, anticipate strict IT security requirements and legacy protocol mismatches
    early in design — specify a protocol translation device (e.g. proxy PLC) as a
    standard integration component and factor IT security review time into the commissioning
    schedule.
  issue_severity: moderate
  project_type: multi-technology/hybrid
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: technology vendor
  delay_category: commissioning/integration
  failure_mode: unvalidated integration
  outcome_class: delayed but recoverable
  secondary_failure_mode: regulatory & approvals
  intervention_note: A proxy PLC was installed to convert between BACnet (legacy BMS)
    and MODBUS (new systems); close collaboration with Reef HQ's IT department and
    UniSA resolved the network architecture compliance issues.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: other
  source_pages: &id006
  - 11
  evidence_excerpt: Reef HQ being a Federal Government funded institution have strict
    IT security protocols and designing the network architecture that complied with
    the security protocols was extremely challenging... The communication with the
    site BMS was overcome by installing an additional proxy PLC which enabled BACnet
    communication protocols to be converted to MODBUS.
