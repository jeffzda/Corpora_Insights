  source_title: Glaciem - PCM Thermal Energy Storage Project - Final Report
  publish_date: '2024-05-22'
  project_name: Advancing Renewables with PCM Thermal Energy Storage
  what_happened: Reef HQ Aquarium had a zero-export electricity contract that prevented
    it from exporting excess solar PV generation to the grid, making additional PV
    installation unviable and leaving the existing 206 kW solar asset partially stranded.
    Installation of a 1.2 MWh PCM TES system with ACFA resolved this by storing excess
    generation as thermal energy, enabling an additional 50 kW of PV to be installed
    and avoiding solar PV curtailment.
  lesson_learnt: Sites with zero-export electricity contracts can unlock stranded
    solar PV value and enable further PV investment by coupling thermal energy storage
    with ACFA control — the TES absorbs excess generation that would otherwise trigger
    curtailment, converting it to high-COP cooling when discharged.
