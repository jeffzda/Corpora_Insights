- record_id: ARENA-DLV-4053
  source_title: Glaciem - PCM Thermal Energy Storage Project - Lessons Learnt Report
    3
  publish_date: '2024-05-13'
  project_name: Advancing Renewables with PCM Thermal Energy Storage
  what_happened: Integration of the PCM TES and ACFA system into the continuously
    operating Fridge 9 ammonia plant at Pernod Ricard Winemakers (PRW) was constrained
    because the plant could not be shut down for extended periods without disrupting
    downstream processes.
  lesson_learnt: When retrofitting energy storage or control systems into year-round
    industrial processes, plan for multiple short planned shutdowns rather than a
    single extended outage — coordinate each shutdown window with operations well
    in advance to avoid downstream production impacts.
  issue_severity: moderate
  project_type: multi-technology/hybrid
  project_scale_band: demonstration
  lifecycle_phase: construction/installation
  proponent_type: technology vendor
  delay_category: construction/installation
  failure_mode: coordination & stakeholders
  outcome_class: delayed but recoverable
  secondary_failure_mode: poor scoping
  intervention_note: The team organised several small planned shutdowns to install
    isolating valves in key locations of Fridge 9, avoiding any single extended outage.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: other
  source_pages: &id003
  - 7
  evidence_excerpt: The Fridge 9 plant operates year-round, providing process cooling
    for packing areas, barrel storage and air conditioning for the auditorium, this
    meant the shutting down of Fridge 9 for any extended period of time was not possible.
    This was overcome by organising several small shutdowns to install isolating valves
    in key locations of Fridge 9.
  confidence_note: null
