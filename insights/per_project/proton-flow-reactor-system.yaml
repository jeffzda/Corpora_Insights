- record_id: ARENA-DLV-51654
  source_title: Proton Flow Reactor System End of Activity Report
  publish_date: '2022-01-18'
  project_name: 'RMIT University Melbourne Hydrogen Storage and Transport R&D Project:
    A proton flow reactor system for electrical energy storage and bulk export of
    hydrogenated carbon-based material'
  what_happened: A nearly three-fold increase in gravimetric hydrogen storage capacity
    in ACPR was achieved during the project — from 0.8 wt% to 2.23 wt% — by heating
    the cell to ~70°C, using a thinner titanium gas diffusion layer, and suppressing
    hydrogen gas evolution during charging.
  lesson_learnt: Relatively low-cost design modifications (temperature, GDL thickness,
    metal contact suppression) can yield step-change improvements in hydrogen storage
    capacity; early-stage R&D programs should systematically test such parametric
    variations before investing in material synthesis optimisation.
