  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: A commercialisation roadmap was developed in consultation with
    RMIT IP Commercialisation and an industry partner, with initial focus on technology
    development and prototyping.
  transferability: moderate
  delay_magnitude: null
  technology_domain: hydrogen
  source_pages: &id012
  - 12
  evidence_excerpt: There is still a long way to progress from the small-scale experimental
    systems that have been built and tested, to large-scale commercial systems, particularly
    a system that could store hydrogen in a carbon-based material in bulk and then
    export this in tankers to overseas locations. The central technological challenge
    facing PFR system technology is thus to prove that this scale-up is both technically
    and economically feasible.
