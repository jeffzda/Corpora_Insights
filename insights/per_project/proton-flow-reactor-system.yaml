    (at $195/kg) being by far the dominant cost driver.
  lesson_learnt: Early-stage simulation modelling should identify dominant cost drivers
    explicitly — in this case carbon powder cost — so that future R&D targets are
    quantitatively grounded and resource allocation is directed at the factors that
    will most determine commercial viability.
