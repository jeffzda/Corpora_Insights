  project_name: 'RMIT University Melbourne Hydrogen Storage and Transport R&D Project:
    A proton flow reactor system for electrical energy storage and bulk export of
    hydrogenated carbon-based material'
  what_happened: COVID-19 lockdowns in Victoria during 2020 and 2021 significantly
    restricted access to RMIT laboratories, reducing the volume of experimental work
    completed and preventing many identified design improvements from being pursued
    as far as originally planned.
  lesson_learnt: For R&D projects with laboratory-dependent workstreams, maintain
    parallel non-experimental workstreams (modelling, simulation, theoretical analysis)
    so that milestone obligations can still be met when physical access is suspended
    — RMIT achieved Milestone 2 on schedule by pivoting to theoretical and computer
    simulation work during the lab closure.
