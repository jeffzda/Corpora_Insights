- record_id: ARENA-DLV-51661
  source_title: Proton Flow Reactor System End of Activity Report
  publish_date: '2022-01-18'
  project_name: 'RMIT University Melbourne Hydrogen Storage and Transport R&D Project:
    A proton flow reactor system for electrical energy storage and bulk export of
    hydrogenated carbon-based material'
  what_happened: The project identified that a major scale-up gap remains between
    the small-scale experimental systems built and tested (TRL 4) and the very large-scale
    commercial systems required — particularly for bulk hydrogenated carbon storage
    and tanker export — with no pathway to bridge this gap within the funded project.
  lesson_learnt: ARENA-funded early-stage R&D projects for novel hydrogen export technologies
    should explicitly scope and resource a follow-on demonstration and scale-up stage
    before project close, as the gap between lab-scale proof-of-concept and commercially
    relevant scale is typically the highest-risk transition and cannot be assumed
    to be self-funding.
