  what_happened: Green fuels producers (including sustainable aviation fuel and green
    methanol developers) were identified as the most commercially promising offtake
    pathway because they require green credentials, can pay a green premium, and require
    volumes matching EGH2 production capacity. However, schedule misalignment between
    the EGH2 project and downstream green fuel developer projects, combined with project-on-project
    risk, prevented agreement during FEED.
  lesson_learnt: When targeting green fuel producers as hydrogen offtakers, begin
    parallel FID alignment discussions early — both projects must reach FID at approximately
    the same time, and the interdependent risk profile requires structured co-development
    agreements to manage project-on-project exposure.
