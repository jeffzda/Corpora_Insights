- record_id: ARENA-DLV-68351
  source_title: Edify - Green Hydrogen Project - Final Report
  publish_date: '2025-06-30'
  project_name: Edify Green Hydrogen Project
  what_happened: CAPEX estimates escalated 45% from the original HyGATE application
    (2022) to the final FEED (June 2025), rising from a baseline to $220–$290M, driven
    by inflation, unfavourable foreign exchange, design scope additions (notably solar
    field expansion from 21 MWp to 35 MWp), and failure of anticipated electrolyser
    cost reductions to materialise.
  lesson_learnt: Early-stage cost estimates for green hydrogen projects should apply
    significant contingency for inflation, FOREX exposure on imported equipment, and
    scope growth — industry-wide cost reduction forecasts have not been realised and
    should not be used as the basis for financial modelling or investment decisions.
  issue_severity: major
  project_type: industrial decarbonisation
