  project_name: Edify Green Hydrogen Project
  what_happened: Heavy rail was identified as the most technically and commercially
    promising near-term hydrogen application due to site proximity to the Mt Isa rail
    corridor, high energy consumption on long routes, and ability to integrate hydrogen
    fuel cells in parallel with existing diesel-electric operations. However, rail
    operators' near-term focus on BESS locomotive rollout means real demand for hydrogen
    fuel is likely several years away.
  lesson_learnt: For green hydrogen projects near major freight rail corridors, engage
    rail operators early as a medium-term offtake pathway but do not depend on rail
    demand for initial project viability — operators are currently prioritising BESS
    locomotive rollout for routes under 700 km, and hydrogen offtake is realistically
    a 5+ year horizon.
