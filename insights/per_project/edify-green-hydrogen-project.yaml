- record_id: ARENA-DLV-68354
  source_title: Edify - Green Hydrogen Project - Final Report
  publish_date: '2025-06-30'
  project_name: Edify Green Hydrogen Project
  what_happened: 'The project faced a ''chicken and egg'' commercial development problem:
    potential offtakers required price certainty and project maturity (DA, environmental
    approvals, feasibility studies) before committing, while project development investment
    required offtake certainty. No binding agreement was reached during the FEED.'
  lesson_learnt: Green hydrogen developers must plan explicitly for the chicken-and-egg
    problem — either by securing anchor offtakers through co-development arrangements,
    or by staging development investment to minimise sunk cost exposure before offtake
    is confirmed.
