  what_happened: The Hydrogen Production Tax Incentive (HPTI) of $2/kg for 10 years
    could not be included in the base-case financial model due to eligibility uncertainties,
    particularly regarding compliance with the Guarantee of Origin Scheme and applicability
    to trust-based project company structures.
