- record_id: ARENA-DLV-68357
  source_title: Edify - Green Hydrogen Project - Final Report
  publish_date: '2025-06-30'
  project_name: Edify Green Hydrogen Project
  what_happened: Increasing BESS capacity beyond the minimum required for off-grid
    island mode stability did not reduce LCOH in the solar-only configuration, because
    the additional capital cost offset any incremental hydrogen production gains.
    In a grid-connected scenario, BESS benefits peaked at approximately 30 MWh for
    a 35 MWp solar array.
  lesson_learnt: For solar-only hydrogen plants, BESS should be sized for grid stability
    and production smoothing only — oversizing for production extension does not improve
    LCOH in off-grid configurations; a grid connection is the preferred lever for
    increasing production.
  issue_severity: minor
  project_type: industrial decarbonisation
  project_scale_band: first commercial/FOAK
