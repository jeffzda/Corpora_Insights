- record_id: ARENA-DLV-68377
  source_title: Edify - Green Hydrogen Project - Final Report
  publish_date: '2025-06-30'
  project_name: Edify Green Hydrogen Project
  what_happened: Ammonia production offtakers showed immediate demand and volumes
    matching or exceeding EGH2 capacity, and technical feasibility was confirmed;
    however, the green ammonia cost (approximately 2x import cost) and inability of
    offtakers to sign take-or-pay agreements due to demand variability made this pathway
    commercially unviable at current pricing.
  lesson_learnt: Ammonia is a technically viable but currently uneconomic offtake
    pathway for small-scale green hydrogen projects — developers should model ammonia
    as a future option contingent on cost reduction and carbon pricing, and should
    verify take-or-pay contract feasibility with offtakers before allocating FEED
    effort to ammonia-optimised plant configurations.
