  project_name: Edify Green Hydrogen Project
  what_happened: The CAPEX cost distribution for the EGH2 project was spread across
    multiple items with no single dominant cost driver. This was identified as a structural
    characteristic of hydrogen plants that requires a portfolio-wide cost reduction
    approach rather than targeting any single system.
  lesson_learnt: Cost reduction strategies for green hydrogen projects must be systemic
    and multi-item — there is no single large cost lever; meaningful LCOH improvement
    requires simultaneous optimisation across electrolyser, solar, compression, civil,
    electrical, and owner cost components.
