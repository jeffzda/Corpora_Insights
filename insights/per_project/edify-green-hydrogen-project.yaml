- record_id: ARENA-DLV-68356
  source_title: Edify - Green Hydrogen Project - Final Report
  publish_date: '2025-06-30'
  project_name: Edify Green Hydrogen Project
  what_happened: The optimal solar PV capacity was found to be 35 MWp — significantly
    larger than the preliminary design of 21 MWp. The increase was the single biggest
    contributor to CAPEX growth and arose because early-stage calculations had not
    fully captured plant auxiliary loads, electrolyser operating profiles, and updated
    panel pricing.
  lesson_learnt: Solar field sizing for off-grid hydrogen production should not be
    locked in at feasibility stage — conduct a formal optimisation using detailed
    electrolyser specifications, auxiliary load profiles, and current panel pricing
    during FEED, as preliminary estimates can undersize by 30–40%.
