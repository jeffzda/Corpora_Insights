  what_happened: The marine sector engagement found no hydrogen or methanol-ready
    vessels near Townsville, limited operator mandates to invest in green fuels, and
    green methanol costs approximately 3x higher than diesel — making maritime an
    unviable near-term offtake sector for EGH2.
  lesson_learnt: Maritime is unlikely to be a viable near-term offtake pathway for
    green hydrogen or methanol projects in regional Australian ports — vessel fuel
    conversion costs, limited green mandates, and a cost gap of approximately 3x relative
    to diesel eliminate near-term commercial viability without significant regulatory
    intervention.
