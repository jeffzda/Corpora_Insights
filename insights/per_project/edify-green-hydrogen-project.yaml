- record_id: ARENA-DLV-68352
  source_title: Edify - Green Hydrogen Project - Final Report
  publish_date: '2025-06-30'
  project_name: Edify Green Hydrogen Project
  what_happened: Anticipated downward pricing trends for key electrolyser and hydrogen
    plant equipment did not eventuate between 2022 and 2025. OEMs had not achieved
    step-change cost reductions because the anticipated large increase in demand had
    not materialised, leaving no projects achieving the scale required to justify
    production automation investment.
  lesson_learnt: Do not model project economics on published electrolyser cost-reduction
    trajectories — these forecasts are contingent on large demand step-changes that
    have not occurred; use market-validated current pricing from OEM engagement during
    FEED.
