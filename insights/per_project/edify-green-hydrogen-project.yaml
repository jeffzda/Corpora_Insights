- record_id: ARENA-DLV-68353
  source_title: Edify - Green Hydrogen Project - Final Report
  publish_date: '2025-06-30'
  project_name: Edify Green Hydrogen Project
  what_happened: Extensive offtaker engagement across maritime, rail, mobility, process
    heat, ammonia, and green fuels sectors failed to secure any offtake agreement
    during the FEED period. Nearly all potential offtakers were unable or unwilling
    to pay a green premium, with the LCOH of $26–$33/kg far exceeding conventional
    fuel costs.
  lesson_learnt: Green hydrogen projects at this scale and cost point cannot assume
    offtake will follow supply — developers must treat offtaker identification and
    willingness-to-pay verification as the critical path activity, and should not
    progress to FEED without at least a conditional offtake signal from a creditworthy
    counterparty.
