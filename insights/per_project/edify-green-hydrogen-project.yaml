  source_title: Edify - Green Hydrogen Project - Final Report
  publish_date: '2025-06-30'
  project_name: Edify Green Hydrogen Project
  what_happened: OPEX for the EGH2 project is disproportionately high relative to
    hydrogen production because the minimum O&M staffing and maintenance cost is largely
    fixed regardless of plant scale. A plant with 2–3 times the production capacity
    would have a comparable O&M team and only slightly higher preventative maintenance
    costs, materially improving the LCOH.
  lesson_learnt: Green hydrogen plants at 17–18 MW electrolyser scale face structurally
    high OPEX per kg due to fixed O&M staffing costs — developers should evaluate
    whether scale-up to 2–3x capacity is feasible before proceeding to FID, as the
    fixed-cost burden disproportionately penalises small-scale projects.
