  publish_date: '2025-06-30'
  project_name: Edify Green Hydrogen Project
  what_happened: A preliminary grid connection enquiry to Ergon Energy indicated that
    a 1.5 MVA / 11 kV connection for overnight essential loads and a larger 15 MVA
    / 66 kV connection for production increase were both potentially feasible, but
    a detailed connection study had not been completed and substation augmentation
    might be required for the 66 kV option.
  lesson_learnt: Initiate grid connection studies early for hydrogen projects even
    where primary power is from on-site renewables — the grid connection capacity
    directly determines maximum hydrogen production and offtake flexibility, and augmentation
    requirements can materially affect CAPEX and schedule.
