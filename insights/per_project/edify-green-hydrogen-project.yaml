  what_happened: Wet (evaporative) cooling was found to have lower CAPEX (approximately
    $1.5M less) and lower energy demand than dry cooling, but its high water consumption
    and consequent expensive off-site wastewater disposal — due to the absence of
    a public wastewater network — resulted in higher OPEX that outweighed the capital
    saving.
  lesson_learnt: For hydrogen projects in regional or greenfield locations without
    public wastewater infrastructure, evaluate total cost of ownership for cooling
    systems before defaulting to the apparently lower-CAPEX wet cooling option — wastewater
    disposal costs can make dry cooling the lower lifecycle-cost choice.
