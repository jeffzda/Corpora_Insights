  what_happened: Edify, a company with extensive experience in solar and BESS project
    development, had no prior experience in process-based gas infrastructure projects
    before commencing EGH2. This capability gap required significant learning investment
    during FEED, including HAZOP workshops, dangerous goods and regulatory compliance
    registers, and process engineering deliverables not previously required for its
    portfolio.
  lesson_learnt: Renewable energy developers entering green hydrogen must plan for
    a substantial capability uplift in process engineering, gas safety regulation,
    and operational risk management — the delivery competencies for process gas infrastructure
    are materially different from those for solar and BESS projects.
