  what_happened: Process heat and furnace applications were found commercially unviable
    as hydrogen offtake pathways because green hydrogen costs are far above natural
    gas prices and potential offtakers expressed zero willingness to pay a green premium,
    despite technical feasibility of blending up to 15% hydrogen without equipment
    modification.
