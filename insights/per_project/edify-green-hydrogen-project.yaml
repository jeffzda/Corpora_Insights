  source_title: Edify - Green Hydrogen Project - Final Report
  publish_date: '2025-06-30'
  project_name: Edify Green Hydrogen Project
  what_happened: Electrolyser stack lifetime estimates provided by the OEM are conservative
    contractual values not based on a full operational dataset at 80,000 hours. In
    the solar-only base case with daily shutdowns, stack replacement is projected
    every 6.5 years rather than the 8–9 years typical of 24-hour operation, materially
    affecting OPEX and LCOH.
  lesson_learnt: Do not rely solely on OEM-provided EOH contractual estimates for
    stack replacement scheduling in LCOH models — actual stack lifetime under variable
    solar operation with daily shutdowns is likely better than contractual estimates,
    but this uncertainty should be explicitly modelled as a sensitivity in the financial
    model.
