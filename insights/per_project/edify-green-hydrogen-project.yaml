- record_id: ARENA-DLV-68376
  source_title: Edify - Green Hydrogen Project - Final Report
  publish_date: '2025-06-30'
  project_name: Edify Green Hydrogen Project
  what_happened: The solar-only production profile produces highly variable daily
    output (worst-case 1 T/day, weekly average ranging from 2.14 to 3.57 T/day) that
    closely follows solar irradiance. This variability is optimal for LCOH but creates
    a supply reliability problem for most industrial offtakers who require stable,
    predictable hydrogen supply.
  lesson_farnt: Variable solar-driven hydrogen production profiles should be explicitly
    disclosed to potential offtakers at the earliest engagement stage — many industrial
    offtakers require stable supply and will not accept variable delivery, meaning
    a grid connection or large buffer storage must be costed into the project to serve
    these markets.
  lesson_learnt: Variable solar-driven hydrogen production profiles should be disclosed
    to potential offtakers at the earliest engagement stage — many industrial offtakers
    require stable supply and will not accept variable delivery, meaning a grid connection
    or large buffer storage must be costed into the project to serve these markets.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: project developer
  delay_category: null
