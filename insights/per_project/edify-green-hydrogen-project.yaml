- record_id: ARENA-DLV-68355
  source_title: Edify - Green Hydrogen Project - Final Report
  publish_date: '2025-06-30'
  project_name: Edify Green Hydrogen Project
  what_happened: Foreign exchange movements significantly increased CAPEX because
    a large proportion of equipment (electrolysers, compressors) is procured from
    Europe and the US, and the Australian dollar weakened materially over the 32-month
    period between original and final estimates.
  lesson_learnt: For green hydrogen projects with high imported equipment content,
    FOREX risk must be explicitly quantified and hedged or buffered in financial models
    — a weaker AUD can materially inflate CAPEX independent of equipment price trends.
