- record_id: ARENA-DLV-27006
  source_title: Insights from Smart Charging Trials Data (Update)
  publish_date: '2023-08-02'
  project_name: Electric Vehicle Orchestration Trial (AGL)
  what_happened: When AGL introduced a morning smart charging control period in Phase
    2, there was no observable increase in post-morning-period demand — customers
    delayed charging to overnight rather than rebounding immediately after the morning
    control window ended.
  lesson_learnt: Morning smart charging control periods do not generate an immediate
    post-event rebound in the way evening periods do — customers defer to overnight
    charging rather than charge immediately after morning control ends, which reduces
    the risk of a rebound peak and improves the effectiveness of morning demand management.
  issue_severity: none
  project_type: transport electrification
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
