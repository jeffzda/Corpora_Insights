- record_id: ARENA-DLV-27005
  source_title: Insights from Smart Charging Trials Data (Update)
  publish_date: '2023-08-02'
  project_name: Electric Vehicle Orchestration Trial (AGL)
  what_happened: AGL's smart charging trial demonstrated that consistent daily price
    signals resulted in significant voluntary demand shifting, with evening consumption
    during the controlled period declining progressively over the trial period, indicating
    increasing customer compliance and lower opt-out rates over time.
  lesson_learnt: Consistent, repeated price signals are effective at driving sustained
    EV smart charging behaviour change — compliance improves progressively over the
    trial period even without increasing incentive levels, suggesting that customer
    familiarity with the program is a key adoption driver.
