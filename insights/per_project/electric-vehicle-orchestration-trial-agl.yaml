- record_id: ARENA-DLV-27004
  source_title: Insights from Smart Charging Trials Data (Update)
  publish_date: '2023-08-02'
  project_name: Electric Vehicle Orchestration Trial (AGL)
  what_happened: AGL conducted a second unmanaged baseline data collection in 2023
    to address concerns that the original 2021 baseline was contaminated by COVID-19
    lockdowns. Results showed minimal difference in charge time profiles between 2021
    and 2023, though average daily consumption per vehicle increased from 5.02 kWh/day
    during lockdowns to 5.68 kWh/day post-lockdowns.
  lesson_learnt: COVID-19 lockdowns did not materially distort EV charging time patterns,
    though they modestly suppressed daily consumption volumes — future trial designs
    can treat lockdown-period baseline data as representative of charging time behaviour,
    while flagging potential understatement of consumption volumes.
  issue_severity: minor
  project_type: transport electrification
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: AGL re-collected unmanaged baseline charging data during early
    2023 to provide a COVID-free reference period for comparison.
  transferability: moderate
  delay_magnitude: null
  technology_domain: EV
  source_pages: &id001
  - 19
  evidence_excerpt: Results show minimal difference in charge times during and after
    lockdowns. Suggests that charge time behaviours are robust against changes in
    frequency of vehicle usage. Average daily EV consumption per vehicle varied during
    and post lockdowns with 5.02 kWh per day during 2021 lockdowns, 5.68 kWh per day
    in 2023.
