- record_id: ARENA-DLV-27022
  source_title: Insights from Smart Charging Trials Data (Update)
  publish_date: '2023-08-02'
  project_name: Electric Vehicle Orchestration Trial (AGL)
  what_happened: 7 kW charger customers in the AGL trial were highly responsive to
    smart charging control events with minimal opt-out, while 22 kW charger customers
    (predominantly business customers) showed responsiveness to the evening event
    but minimal morning-period response, partly because morning charging under unmanaged
    conditions was already low for this group.
  lesson_learnt: Smart charging program design should differentiate between 7 kW residential
    and 22 kW business/commercial chargers — 7 kW charger customers represent the
    most reliable source of residential demand flexibility, while 22 kW customers
    require tailored approaches that account for their already-low morning load.
  issue_severity: none
  project_type: transport electrification
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: no major failure stated
