- record_id: ARENA-DLV-27021
  source_title: Insights from Smart Charging Trials Data (Update)
  publish_date: '2023-08-02'
  project_name: Electric Vehicle Orchestration Trial (AGL)
  what_happened: AGL's trial design aligned smart charging control periods to retail
    tariff peak and shoulder periods across all states, with state-specific start/end
    times varying by up to 30 minutes — this approach was intended to reduce split
    incentives between network and retail signals for consumers.
  lesson_learnt: Aligning smart charging control periods to the retail tariffs customers
    are already exposed to reduces conflicting signals and improves voluntary participation
    — program designers should map the control window to the customer's existing peak
    tariff exposure rather than imposing a separate schedule.
  issue_severity: none
  project_type: transport electrification
