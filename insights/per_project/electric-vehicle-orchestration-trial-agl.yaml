- record_id: ARENA-DLV-27007
  source_title: Insights from Smart Charging Trials Data (Update)
  publish_date: '2023-08-02'
  project_name: Electric Vehicle Orchestration Trial (AGL)
  what_happened: AGL's evening smart charging control period produced a rebound effect
    — demand immediately after the evening control window was materially higher than
    in the unmanaged baseline, indicating that load was shifted to just outside the
    controlled window rather than genuinely reduced.
  lesson_learnt: Evening smart charging control periods should be designed with awareness
    that demand rebounds sharply in the period immediately after the control window
    closes — program designers should either extend the window or use time-of-use
    pricing to reduce post-event spikes.
  issue_severity: moderate
  project_type: transport electrification
