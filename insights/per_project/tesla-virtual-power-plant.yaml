  project_name: South Australia Virtual Power Plant (SAVPP) Phase 3A
  what_happened: Deployment experience accumulated during Phase 2 (1,000 systems)
    directly enabled capability-building for Phase 3A deployment, with 500 systems
    installed at the time of this report and a further 2,500 planned. The phased deployment
    approach allowed iterative learning that is expected to support significant scaling
