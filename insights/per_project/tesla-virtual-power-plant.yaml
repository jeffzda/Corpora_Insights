  publish_date: 2021-08
  project_name: South Australia Virtual Power Plant (SAVPP) Phase 3A
  what_happened: When Powerwall inverters provide volt-var voltage support, this function
    takes priority over all other services including customer self-consumption, FCAS,
    virtual inertia and wholesale market participation. Operating under the most aggressive
    droop curve (Curve C) can require up to 100% of Powerwall's rated output for voltage
    support, curtailing all other inverter functions and incurring opportunity costs
    for customers and the VPP operator.
  lesson_learnt: VPP operators trialling aggressive volt-var curves must quantify
    the opportunity cost of voltage support curtailing other revenue streams (FCAS,
    wholesale, self-consumption) before committing to network service contracts —
    the full cost/benefit trade-off across all services must be understood to avoid
    unexpectedly undermining project economics.
