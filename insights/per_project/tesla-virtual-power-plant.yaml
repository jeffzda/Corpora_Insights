  what_happened: Preliminary volt-var inverter control trials conducted in collaboration
    with SA Power Networks (SAPN) in February 2021 showed that custom droop curves
    (stricter than SAPN's standard TS129 settings) produced strong performance in
    drawing measured voltages at Powerwall inverter terminals towards the 230V deadband,
    though feeder-level results remained inconclusive due to limited sample sizes.
  lesson_learnt: Custom volt-var curves applied to aggregated residential inverters
    can demonstrably improve localised voltage management beyond standard network
    connection settings — proponents should design trials with sufficient site numbers
    from the outset to generate statistically robust feeder-level conclusions, as
    inverter-terminal results alone are insufficient for monetisation decisions.
