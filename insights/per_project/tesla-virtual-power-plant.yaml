- record_id: ARENA-DLV-52154
  source_title: Tesla Virtual Power Plant Lessons Learnt Report 2 (SA VPP Phase 3A,
    Milestone 3)
  publish_date: 2022-08
  project_name: South Australia Virtual Power Plant Phase 3A
  what_happened: Notch Testing 3 was conducted during winter months, meaning network
    voltages were lower than they would be in spring or summer, preventing a definitive
    assessment of whether the ~1V reduction achieved would be sufficient to constitute
    a commercially valuable network service.
  lesson_learnt: Schedule voltage support field trials for spring or summer peak-voltage
    periods rather than winter; results obtained during low-voltage seasons cannot
    be used to establish a network service value stream because the voltage headroom
    available is unrepresentative.
