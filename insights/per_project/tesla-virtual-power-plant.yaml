- record_id: ARENA-DLV-52155
  source_title: Tesla Virtual Power Plant Lessons Learnt Report 2 (SA VPP Phase 3A,
    Milestone 3)
  publish_date: 2022-08
  project_name: South Australia Virtual Power Plant Phase 3A
  what_happened: Testing identified that the most aggressive Volt-VAr curve (Curve
    C) was most effective at reducing network voltage but also causes all real-power
    functions — including household solar supply and inertia support — to cease during
    activation, creating a direct trade-off between voltage service provision and
    other grid and customer services.
  lesson_learnt: When designing VPP dispatch logic for voltage support, explicitly
    model the opportunity cost of reactive power prioritisation against real-power
    services (customer load supply, FCAS, inertia); deploying maximum VAr curves without
    co-optimisation logic may undermine the VPP's overall value stack.
