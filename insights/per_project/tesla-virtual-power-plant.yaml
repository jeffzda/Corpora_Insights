- record_id: ARENA-DLV-52153
  source_title: Tesla Virtual Power Plant Lessons Learnt Report 2 (SA VPP Phase 3A,
    Milestone 3)
  publish_date: 2022-08
  project_name: South Australia Virtual Power Plant Phase 3A
  what_happened: Notch Testing 3 on three high-penetration feeders (25 Powerwalls
    total) showed a ~1V voltage reduction on two of three feeders, confirming that
    higher battery penetration improves voltage support effectiveness. However, one
    feeder's results were invalidated by a real-power change on the control Powerwall,
    and another was confounded by declining solar generation during testing.
  lesson_learnt: Use passive control Powerwalls that are locked from any real-power
    changes during the test window, and monitor solar irradiance in real time; any
    uncontrolled real-power event on a control device or solar drop during the test
    period should trigger rescheduling rather than accepting confounded data.
