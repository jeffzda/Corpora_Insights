  publish_date: 2022-08
  project_name: South Australia Virtual Power Plant Phase 3A
  what_happened: Tesla's Opticaster software was tested against SAPN's new Residential
    Time of Use Plus (RToU+) tariff across 100 VPP sites, demonstrating that the software
    could adapt dispatch to shorter but more expensive peak windows. Financial performance
    between RToU and RToU+ sites was found to be comparable, confirming that time-of-use
    tariff structures return positive financial results for Powerwall-equipped VPP
    customers.
  lesson_learnt: VPP dispatch software that can ingest and respond to updated network
    tariff structures in near-real time enables customers to capture value from new
    pricing signals without manual intervention; proponents should ensure their software
    stack is designed for tariff-agnostic co-optimisation to remain competitive as
    network pricing evolves.
