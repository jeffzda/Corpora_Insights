- record_id: ARENA-DLV-52151
  source_title: Tesla Virtual Power Plant Lessons Learnt Report 2 (SA VPP Phase 3A,
    Milestone 3)
  publish_date: 2022-08
  project_name: South Australia Virtual Power Plant Phase 3A
  what_happened: Notch Testing 2 for voltage support on 20 fleet sites produced mixed
    daytime results and inconclusive night-time results. Night-time tests were invalidated
    by natural voltage rise, and feeder-level voltage change was not clearly observable
    despite inverter-level reactive power sinking being confirmed.
  lesson_learnt: Design voltage support trials to avoid night-time test windows where
    natural voltage rise masks VAr response signals; schedule testing during solar
    hours when voltage instability is highest and the signal-to-noise ratio is most
    favourable.
