- record_id: ARENA-DLV-42779
  source_title: Evaluation of ARENA's VPP Portfolio
  publish_date: 2021-06
  project_name: Tesla Virtual Power Plant
  what_happened: In the Tesla VPP project, battery hardware costs comprised approximately
    86% of total project costs. The project leverage was 1:6.83 — substantially above
    ARENA's 1:2 to 1:3 target — largely because Tesla's commercial investment in hardware
    dominated the project budget, and the primary technology was commercially mature
    at project commencement.
  lesson_learnt: When the dominant project cost is commercially mature hardware (rather
    than novel software or platform development), the leverage ratio will mechanically
    appear high even though ARENA funding is not driving innovation; assess funding
    appropriateness by examining what the ARENA contribution is specifically enabling,
    not just the total leverage ratio.
