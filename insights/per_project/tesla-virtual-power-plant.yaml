  what_happened: Tesla struggled to obtain insurance from Australian insurers for
    centrally-owned, geographically dispersed residential solar and storage assets,
    which was a prerequisite for securing bank financing (CEFC) and reaching financial
    close. Local insurers had little appetite for this risk, particularly following
    bushfires, droughts and COVID, forcing Tesla to engage a global insurance provider.
  lesson_learnt: Australian insurers lack frameworks for insuring third-party-owned
    distributed renewable assets — future VPP proponents seeking bank finance should
    anticipate this gap early and engage global insurance markets rather than relying
    on local providers, as local appetite is insufficient for this asset class.
