  lesson_learnt: Structuring large-scale DER rollouts in discrete phases with knowledge
    transfer between phases materially reduces deployment risk — capability built
    in earlier phases directly accelerates throughput in subsequent phases, and phased
    scaling should be the default approach for VPP programs targeting tens of thousands
    of sites.
