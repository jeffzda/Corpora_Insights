- record_id: ARENA-DLV-16472
  source_title: Flexible Hot Water Webinar
  publish_date: 2024-12
  project_name: Domestic Hot Water Flexibility – UTS-ISF Market Overview
  what_happened: ISF analysis found that under BAU, NEM consumers face aggregate hot
    water costs of $8.7 billion in 2040 (63% from gas), while phasing out gas hot
    water would save consumers $4.7–6.7 billion annually by 2040, with gas DHW users
    paying $660–960 more per year than electric DHW users by 2040.
  lesson_learnt: The consumer financial case for electrifying hot water is compelling
    and growing — by 2040 gas hot water users will pay $660–960 more per year than
    electric users; proponents and policymakers should use this evidence to accelerate
    consumer-facing electrification programs.
