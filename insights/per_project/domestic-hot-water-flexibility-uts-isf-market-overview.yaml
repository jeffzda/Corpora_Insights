- record_id: ARENA-DLV-16473
  source_title: Flexible Hot Water Webinar
  publish_date: 2024-12
  project_name: Domestic Hot Water Flexibility – UTS-ISF Market Overview
  what_happened: ISF analysis identified that decarbonisation and electrification
    of hot water pathways are hindered by multiple simultaneous barriers including
    a fragmented market, outdated policy frameworks, physical installation constraints,
    and technical complexities, requiring an integrated multi-stakeholder response.
  lesson_learnt: No single intervention is sufficient to decarbonise or flex hot water
    at scale — the combination of fragmented market structures, outdated plumbing
    and building codes, and technical complexity means that only an integrated approach
    involving policy, standards, tariffs, and industry coordination will succeed.
