- record_id: ARENA-DLV-16471
  source_title: Flexible Hot Water Webinar
  publish_date: 2024-12
  project_name: Domestic Hot Water Flexibility – UTS-ISF Market Overview
  what_happened: ISF modelling found that under a Business as Usual scenario with
    no forced gas DHW phase-out, flexible demand capacity from hot water reaches only
    9 GW (19 GWh/day) by 2040 — 2.7x less than the 24 GW (50 GWh/day) achievable under
    a Highly Flexible scenario.
  lesson_learnt: Without active policy intervention to phase out gas hot water and
    mandate electrification, the flexible demand opportunity from domestic hot water
    will be largely unrealised — decarbonisation policy and electrification targets
    are prerequisite enabling conditions for flexible hot water at scale.
