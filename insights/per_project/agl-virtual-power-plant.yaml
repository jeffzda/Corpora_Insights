  project_name: Virtual Power Plant in South Australia (SA-VPP)
  what_happened: AGL chose an AC front-coupled battery architecture for the SA-VPP
    to avoid triggering compliance requirements of AS/NZS 5033:2014 on existing solar
    PV systems; DC-coupled systems would have required retrofitting rooftop isolators,
    re-stringing arrays, or replacing solar inverters at unpredictable cost.
  lesson_learnt: For retrofit residential ESS programs, AC-coupled architectures significantly
    reduce installation cost and complexity by eliminating the need to modify existing
    solar PV systems — evaluate this design choice explicitly at program design stage
    rather than discovering modification costs during deployment.
