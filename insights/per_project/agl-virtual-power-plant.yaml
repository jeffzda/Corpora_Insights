- record_id: ARENA-DLV-69619
  source_title: Virtual Power Plant in South Australia - Final Milestone Report
  publish_date: 2020-10
  project_name: Virtual Power Plant in South Australia (VPP-SA)
  what_happened: Notch testing across 764 VPP-SA assets demonstrated that the voltage
    response to real and reactive power dispatches varied by a factor of five to seven
    across the fleet, with higher-impedance network locations being significantly
    more responsive; many devices had negligible voltage impact due to network characteristics
    or their position in the circuit.
  lesson_learnt: Do not assume uniform voltage management effectiveness from blanket
    Volt-VAr and Volt-Watt mandates across a DER fleet — network impedance characteristics
    vary widely within a single DNSP region, and devices on low-impedance networks
    provide negligible voltage support while incurring the same customer value impact;
    targeted deployment of reactive power modes on high-impedance sites is more efficient.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: AGL conducted reactive power and active power notch tests at
    3:30am on 764 assets to measure per-site voltage sensitivity and inferred network
    impedance, providing evidence for regulatory submissions on targeted versus blanket
    power quality mode application.
  transferability: moderate
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id029
