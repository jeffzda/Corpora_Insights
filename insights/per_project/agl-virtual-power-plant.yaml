  source_title: Virtual Power Plant in South Australia - Final Milestone Report
  publish_date: 2020-10
  project_name: Virtual Power Plant in South Australia (VPP-SA)
  what_happened: Phase mapping on LV circuits was historically poorly documented by
    SAPN, limiting AGL's ability to measure the per-phase impact of BESS orchestration
    events at the distribution transformer and to optimise phase-level deployment
    of batteries for voltage management services.
  lesson_learnt: Request or develop phase mapping of LV circuits before deploying
    BESS for network services — poor phase documentation is a systemic limitation
    of most DNSPs that prevents effective phase-level measurement and optimisation
    of DER-based voltage and thermal management, and should be raised as a data-sharing
    requirement in DNSP engagement.
