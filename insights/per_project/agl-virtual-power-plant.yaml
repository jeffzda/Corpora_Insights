- record_id: ARENA-DLV-69605
  source_title: Virtual Power Plant in South Australia - Final Milestone Report
  publish_date: 2020-10
  project_name: Virtual Power Plant in South Australia (VPP-SA)
  what_happened: The allowable site voltage rise limits under the revised AS4777.1
    (2016) meant that in some instances customers required sub-mains upgrades because
    battery installation location options were limited relative to the switchboard,
    adding cost and complexity to installations.
  lesson_warnt: Assess site voltage rise compliance requirements and sub-mains upgrade
    risk during pre-installation site inspection — newer hardware with flexible mounting
    options (wall and ground-mounted) can reduce the frequency of costly sub-mains
    upgrades and should be evaluated when selecting hardware for retrofit ESS programs.
  lesson_learnt: Assess site voltage rise compliance requirements and sub-mains upgrade
    risk during pre-installation site inspection — newer hardware with flexible mounting
    options (wall and ground-mounted) can reduce the frequency of costly sub-mains
    upgrades and should be evaluated when selecting hardware for retrofit ESS programs.
