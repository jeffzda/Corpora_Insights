  what_happened: The AGL VPP project demonstrated that cloud-based API interfaces
    can control a diverse fleet of residential batteries — an approach novel at the
    time, when most VPP programs relied on a physical gateway device installed at
    each site — and AGL has since incorporated VPPs into its business-as-usual offering.
