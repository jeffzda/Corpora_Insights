  what_happened: Achieving 1,000 battery sales required sustained effort over nearly
    three years because eligibility criteria — requiring sufficient excess solar,
    non-premium feed-in tariff status, home ownership, five-year residency commitment,
    and suitable installation location — substantially narrowed the eligible customer
    pool.
  lesson_learnt: 'Design VPP customer eligibility criteria carefully before launch:
    each criterion compounds to reduce the eligible pool dramatically; on a typical
    circuit with 40% solar penetration, the sellable cohort could be as low as 5–10
    customers, so marketing budgets and timelines must reflect realistic conversion
    funnels, not headline addressable markets.'
