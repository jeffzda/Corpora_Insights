- record_id: ARENA-DLV-69625
  source_title: Virtual Power Plant in South Australia - Final Milestone Report
  publish_date: 2020-10
  project_name: Virtual Power Plant in South Australia (VPP-SA)
  what_happened: Orchestration events that discharge customer BESS during VPP dispatches
    can reduce customer solar self-consumption savings; the net customer billing impact
    may take up to 24 hours to fully realise and depends on whether the battery recovers
    its charge from solar the following day (brought-forward exports) or must draw
    from the grid (foregone self-consumption).
  lesson_learnt: VPP operators must implement unit-level counterfactual billing impact
    calculations for every orchestration event — fleet-level aggregate powerflow is
    not a valid proxy for customer impact, and the full impact may not be quantifiable
    until up to 24 hours after the event; customer transparency on event impacts is
    an essential consumer protection obligation.
  issue_severity: minor
  project_type: DER/customer-side
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: AGL developed a counterfactual methodology for calculating per-unit
    customer billing impact and was building customer-facing tools in AGL's app and
    MyAccount portal to provide transparency on orchestration event impacts.
  transferability: broad
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id035
  - 21
  - 22
  - 55
  evidence_excerpt: The net impact of an orchestration event to customer value cannot
    be calculated until the costs of foregone self-consumption and/or brought forward
    exports have been realised. In some cases, these costs may only be realised days
    after the event has concluded... customer impacts of orchestration events is a
    complex calculation that needs to be performed at unit level rather than at a
    fleet level.
  confidence_note: null
