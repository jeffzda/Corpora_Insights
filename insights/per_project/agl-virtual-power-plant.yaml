  source_title: Virtual Power Plant in South Australia - Final Milestone Report
  publish_date: 2020-10
  project_name: Virtual Power Plant in South Australia (VPP-SA)
  what_happened: Battery solar utilisation was constrained in both summer (batteries
    too often full due to high solar generation) and winter (insufficient solar generation),
    resulting in broadly similar seasonal solar-to-load offset via battery of approximately
    7 kWh/day across all seasons — limiting the incremental value of batteries for
    solar self-consumption optimisation.
  lesson_warnt: null
  lesson_learnt: When projecting customer payback periods for residential BESS, account
    for seasonal utilisation constraints at both ends — summer excess solar and winter
    solar deficit can converge to produce similar but lower-than-expected cycling,
    and customer load profiles must be modelled individually rather than using average
    assumptions.
