  project_name: Virtual Power Plant in South Australia (SA-VPP)
  what_happened: A large proportion of prospective customers were unaware that adding
    storage would disqualify them from the PFiT, and many did not understand the mechanism
    by which battery storage generates financial savings, suggesting a widespread
    consumer knowledge gap about storage economics.
  lesson_learnt: Screen VPP participants for feed-in tariff eligibility early in the
    sales process — customers unwilling to forgo premium feed-in tariffs represent
    a substantial disqualifying factor (35% attrition in this trial) and should be
    filtered at the top of the recruitment funnel to avoid wasted sales effort.
