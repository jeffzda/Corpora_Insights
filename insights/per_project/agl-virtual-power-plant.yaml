  source_title: Virtual Power Plant in South Australia - Final Milestone Report
  publish_date: 2020-10
  project_name: Virtual Power Plant in South Australia (VPP-SA)
  what_happened: Under standard flat retail tariffs, orchestration events that discharge
    customer batteries for VPP purposes had a net subtractive impact on individual
    customer energy bills; customers' benefit in the VPP-SA program was provided entirely
    through the upfront battery purchase subsidy rather than through ongoing orchestration
    payments.
  lesson_learnt: On flat retail tariffs, VPP orchestration events typically cost customers
    money — future VPP programs must either ensure customers receive ongoing financial
    remuneration for orchestration participation or are on tariffs where orchestration
    events create net savings, and should clearly communicate billing impacts to build
    and maintain customer trust.
