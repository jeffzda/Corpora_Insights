  what_happened: A granular operational data platform built from program commencement
    proved invaluable for identifying hardware, metering, and connectivity issues
    at individual sites and for informing discussions on network voltages and their
    impact on DER performance throughout the four-year program.
  lesson_learnt: Invest in a granular per-device operational data ingestion platform
    from day one of a DER fleet program — retrospective data collection cannot substitute
    for continuous site-level monitoring, and the data asset becomes increasingly
    valuable for fleet optimisation, performance diagnostics, regulatory evidence,
    and customer-facing reporting as the program scales.
