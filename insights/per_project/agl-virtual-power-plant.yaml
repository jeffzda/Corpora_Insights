  source_title: 'Empowered Consumers: Distributed Energy Resources Portfolio Update'
  publish_date: '2018'
  project_name: AGL Virtual Power Plant
  what_happened: During Stage 2 extended dispatch events, maintaining a consistent
    power export target across the VPP fleet proved complex due to high grid voltage,
    battery state-of-charge variations, variability in solar production, and household
    load differences across sites. Battery inverter disconnections continued to have
    a significant impact.
  lesson_learnt: VPP fleet control systems must account for simultaneous variability
    in grid voltage, individual battery state of charge, solar generation, and household
    load — consistent aggregate power export targets cannot be reliably held without
    robust site-level feedback and control logic that handles these compounding factors.
