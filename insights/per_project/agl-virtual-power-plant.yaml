  what_happened: Quality management of field-based battery installations remained
    a challenge throughout the program; in particular, installation and commissioning
    of metering devices was difficult to diagnose without clear test and commissioning
    protocols, and only 7 of 23 installation teams were responsible for 80% of successful
    installations.
  lesson_learnt: 'Residential battery installation quality is highly dependent on
    installer capability: vet teams rigorously before scale-up, dedicate specific
    teams to each hardware type, require hands-on training beyond online vendor accreditation,
    and maintain clear commissioning protocols for metering devices — the skewed distribution
    of output (80% from 7 of 23 teams) shows that underperforming teams should be
    removed early rather than retained for overflow capacity.'
