- record_id: ARENA-DLV-69617
  source_title: Virtual Power Plant in South Australia - Final Milestone Report
  publish_date: 2020-10
  project_name: Virtual Power Plant in South Australia (VPP-SA)
  what_happened: Grid voltages across the South Australian LV network sat persistently
    at the upper end of the allowable range throughout the year; in spring, approximately
    40% of the Tesla fleet experienced voltages in excess of the 253V upper limit,
    constraining DER operation and triggering power quality response modes.
  lesson_learnt: VPP programs in Australian LV networks should expect persistent high-voltage
    conditions as the operational baseline — design dispatch strategies, availability
    calculations, and customer value estimates accounting for Volt-VAr and Volt-Watt
    mode curtailment, and engage DNSPs early on voltage management to understand which
    circuits have the least headroom.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: AGL conducted detailed voltage notch testing across 764 assets
    to quantify real and reactive power voltage sensitivity, informing regulatory
    submissions advocating for voltage management reform and dynamic export limits.
  transferability: broad
  delay_magnitude: null
  technology_domain: battery storage
