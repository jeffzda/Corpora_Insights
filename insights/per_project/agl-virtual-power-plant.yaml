- record_id: ARENA-DLV-69631
  source_title: Virtual Power Plant in South Australia - Final Milestone Report
  publish_date: 2020-10
  project_name: Virtual Power Plant in South Australia (VPP-SA)
  what_happened: The regulatory investment test for distribution (RIT-D) threshold
    of $6M was identified as a structural barrier to non-network solutions from VPPs,
    because most LV augmentation projects that exceed this threshold require many
    MW/MWh of storage concentrated in one area — a scale difficult for a single aggregator
    to achieve from residential behind-the-meter assets.
  lesson_learnt: The RIT-D threshold is a binding constraint on VPP network services
    commercialisation — advocate for a reduction in the RIT-D threshold (e.g. from
    $6M to $1M as proposed by the Australian Energy Council) as a priority regulatory
    reform; without it, most LV network service opportunities will remain below the
    required competitive tender scale.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: approvals/regulatory
