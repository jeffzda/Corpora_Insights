- record_id: ARENA-DLV-69618
  source_title: Virtual Power Plant in South Australia - Final Milestone Report
  publish_date: 2020-10
  project_name: Virtual Power Plant in South Australia (VPP-SA)
  what_happened: High grid voltages caused Volt-VAr and Volt-Watt modes to be invoked
    frequently, curtailing real power output from battery inverters and reducing the
    ability of the VPP fleet to participate in FCAS contingency events — in some cases
    high site voltages during a FCAS discharge caused voltages to rise above 258V,
    triggering complete BESS disconnection.
  lesson_learnt: Power quality response modes (Volt-VAr and Volt-Watt) can directly
    conflict with and curtail FCAS contingency service delivery from behind-the-meter
    BESS — VPP operators should seek regulatory clarification on whether these modes
    should be suspended during FCAS events, and bid FCAS availability conservatively
    to account for voltage-induced curtailment.
