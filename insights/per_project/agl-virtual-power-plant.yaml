  what_happened: Work-at-height safety compliance was an ongoing challenge among residential
    battery installers, particularly small businesses and sole traders who tended
    to cut corners on fall protection during short rooftop visits, creating high-potential
    safety incidents.
  lesson_learnt: Do not assume residential installers will self-manage work-at-height
    safety on short rooftop visits — implement formal HSE audit programs, empower
    field technical staff to stop work for unsafe practices, and reinforce requirements
    continuously; brief visits are where corner-cutting is most likely.
