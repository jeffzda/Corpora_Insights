- record_id: ARENA-DLV-22104
  source_title: Virtual Power Plant in South Australia - Stage 1 & 2 Reports
  publish_date: '2017-07-31'
  project_name: Virtual Power Plant in South Australia (SA-VPP)
  what_happened: SAPN's service and installation rules capped single-phase embedded
    generation at 10 kVA (subsequently reduced to 5 kVA under AS4777.2:2015), meaning
    any customer with existing solar plus the 5 kW Sunverge inverter would breach
    the export limit without active export limiting.
  lesson_learnt: Before selecting hardware for a distributed storage programme, verify
    the combined inverter export capacity of the storage unit plus any co-located
    solar against the local DNSP's connection rules — breaching export limits can
    block installations or require software mitigations that need regulator acceptance.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: AGL implemented an export limiting function through the Sunverge
    control software and demonstrated to SAPN that it could reliably cap site export
    to the required limit; export limiting now ships as standard with all units.
  transferability: moderate
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id003
  - 22
  evidence_excerpt: This export limit was subsequently reduced to 5 kVa after the
    current version of AS4777.2:2015 came into effect. This rule posed a challenge
    as when combined with the Schneider 5 kW inverter in the Sunverge energy storage
    system, any capacity of associated solar would exceed the 5kVA limit imposed by
    SAPN without some form of export limiting functionality.
  confidence_note: null
