  what_happened: Hyper-local targeted sales campaigns to deploy batteries in specific
    network zones identified by SAPN were constrained by very small eligible customer
    pools; on a typical low-voltage circuit of 100 customers with 40% solar penetration,
    the viable sales target within the remaining eligible cohort could be as low as
    a handful of customers.
