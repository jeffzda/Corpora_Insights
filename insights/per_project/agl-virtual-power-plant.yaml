  outcome_class: policy/market influence only
  secondary_failure_mode: null
  intervention_note: AGL supported the rule change proposal by the Australian Energy
    Council to reduce the RIT-D threshold from $6M to $1M.
  transferability: broad
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id040
  - 60
  evidence_excerpt: The RIT-D threshold (i.e. threshold whereby the network is required
    to go to market to invite responses from non-network solution providers) is currently
    set at $6M. This threshold is set too high as typically augmentation projects
    that exceed this threshold require many MW/MWh of controllable storage in a concentrated
    area to defer the network solution making critical mass for a single aggregator
    very difficult to achieve.
