  source_title: Virtual Power Plant in South Australia - Final Milestone Report
  publish_date: 2020-10
  project_name: Virtual Power Plant in South Australia (VPP-SA)
  what_happened: Under the VPP-SA subsidised pricing ($3,500 incl. GST), customers
    could expect an average ~9-year payback on a flat tariff; under the SA Home Battery
    Scheme market pricing ($5,499), the expected payback extended to ~15 years, indicating
    that without subsidy, residential battery economics remain unattractive for most
    customers.
  lesson_learnt: Without significant government subsidy or a solar sponge/TOU tariff,
    residential battery paybacks of 12–15 years make standalone BESS commercially
    unattractive for most households — VPP business cases must not assume subsidy-free
    uptake at scale, and should model the sensitivity of customer recruitment to price
    point explicitly.
