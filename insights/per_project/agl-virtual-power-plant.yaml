  what_happened: During a wholesale dispatch event on 30 January 2020, the VPP was
    dispatched during early high-price intervals but energy prices then moved significantly
    higher (to $11,200/MWh and $12,217/MWh) in subsequent intervals that were not
    predicted by pre-dispatch price forecasts, meaning the fleet had already partially
    depleted state of charge and missed the highest-value intervals.
