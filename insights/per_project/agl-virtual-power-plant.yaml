  what_happened: LV network constraint data held by DNSPs was not publicly available
    through standard planning publications, meaning VPP aggregators had no market-facing
    mechanism to identify or assess non-network service opportunities except through
    direct bilateral engagement with individual DNSPs.
  lesson_learnt: Policymakers and regulators should require DNSPs to publish LV network
    constraint data (including power and energy required to defer augmentation and
    associated deferral values) as part of Distribution Annual Planning Reports —
    without this, competitive markets for non-network solutions cannot form, and VPP
    network services value remains locked to bilateral negotiations.
