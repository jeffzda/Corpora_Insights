  source_title: Virtual Power Plant in South Australia - Final Milestone Report
  publish_date: 2020-10
  project_name: Virtual Power Plant in South Australia (VPP-SA)
  what_happened: Peak demand management testing demonstrated that a defined sub-fleet
    of 60 co-located BESS could manage aggregate demand at an LV substation, but devices
    needed to be reserved for the service — including in the lead-up period to retain
    sufficient state of charge — preventing them from simultaneously participating
    in other value-generating markets such as FCAS or wholesale dispatch.
  lesson_learnt: Network peak demand management from VPPs requires dedicating a device
    sub-fleet not just during the peak event but in the hours before it to maintain
    state of charge availability — co-optimisation algorithms that allow devices to
    participate in multiple markets will require explicit treatment of this reservation
    requirement, and greater fleet penetration reduces per-device impact.
