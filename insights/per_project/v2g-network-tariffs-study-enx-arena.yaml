  - 40
  - 41
  - 76
  evidence_excerpt: The network export incentive must be greater that $1/kWh to offset
    the import incentive created by the wholesale market during a MFP event... Setting
    network prices against worst case and rare coincidences of wholesale market and
    local network conditions creates costs to networks.
