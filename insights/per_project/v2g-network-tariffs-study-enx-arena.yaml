- record_id: ARENA-DLV-49007
  source_title: ARENA - Vehicle to Grid - Network tariffs report
  publish_date: '2024-02-22'
  project_name: V2G Network Tariffs Study (enX/ARENA)
  what_happened: The wholesale electricity market floor price (MFP) of -$1,000/MWh
    created a risk that V2G assets would switch into charge mode during local critical
    network peak events if the spot market simultaneously fell to the MFP, counteracting
    network peak reduction. To ensure a firm V2G response, dynamic network pricing
    had to be set at $1.20/kWh — above the $1.00/kWh minimum needed to offset the
    MFP — inflating network costs.
  lesson_learnt: When designing dynamic network tariffs for V2G, the peak price must
    exceed the retail equivalent of the wholesale market floor price to guarantee
    a firm discharge response; the AEMC Reliability Panel should formally assess the
    MFP's implications for DER and local network operation, and contract-for-difference
    stop-loss arrangements should be explored to reduce the required peak price and
    lower network costs.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: regulatory & approvals
  intervention_note: An 'insurance approach' was adopted, setting the dynamic peak
    price at $1.20/kWh to ensure the export incentive prevailed over any countervailing
    MFP wholesale spot price signal of -$1.00/kWh.
  transferability: moderate
  delay_magnitude: null
  technology_domain: EV
  source_pages: &id007
