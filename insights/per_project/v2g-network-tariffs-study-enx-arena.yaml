- record_id: ARENA-DLV-49016
  source_title: ARENA - Vehicle to Grid - Network tariffs report
  publish_date: '2024-02-22'
  project_name: V2G Network Tariffs Study (enX/ARENA)
  what_happened: The NER regulatory framework for network tariffs requires compliance
    with pricing principles assessed on a per-network basis, without an explicit AER
    mandate for national consistency, and allows only a 2% side-constraint on revenue
    rebalancing between tariff classes per year. This slows the pace of tariff reform
    and prevents rapid adoption of leading-practice tariff innovations across the
    NEM.
  lesson_learnt: Tariff reform processes need to be accelerated — the current 5-year
    regulatory cycle with 2% annual side constraints is too slow to respond to rapid
    DER technology uptake, and regulators should explore faster pathways (e.g., expanded
    trial tariff provisions) to implement technology-aware dynamic pricing within
    current regulatory control periods.
