- record_id: ARENA-DLV-49024
  source_title: ARENA - Vehicle to Grid - Network tariffs report
  publish_date: '2024-02-22'
  project_name: V2G Network Tariffs Study (enX/ARENA)
  what_happened: By 2022, the NEM's regulatory framework for network tariffs had been
    in operation for eight years since the 2014 Distribution Network Pricing Arrangements
    rule, yet nearly three-quarters of residential customers remained on non-cost-reflective
    tariffs. The study attributed slow progress in part to the revenue cap control
    mechanism applying to all standard control services, which reduces DNSP incentives
    to drive more efficient tariff uptake.
  lesson_learnt: Regulatory bodies should consider shifting distribution networks
    from revenue caps to weighted average price caps (WAPCs) as V2G and price-responsive
    DER becomes mainstream — under revenue caps, DNSPs have reduced incentives to
    promote cost-reflective tariff adoption because revenues are guaranteed regardless
    of how customers are priced.
