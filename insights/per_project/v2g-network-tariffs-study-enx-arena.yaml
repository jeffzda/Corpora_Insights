- record_id: ARENA-DLV-49004
  source_title: ARENA - Vehicle to Grid - Network tariffs report
  publish_date: '2024-02-22'
  project_name: V2G Network Tariffs Study (enX/ARENA)
  what_happened: Dynamic network pricing scenarios (s3 and s6) both achieved the highest
    critical peak reduction (2.54 MW, 6.29%) and the lowest customer electricity bills,
    because the dynamic charge/reward applied only during verified critical peak periods,
    eliminating variable network charges at all other times and thereby reducing transaction
    costs for spot market participation.
  lesson_learnt: Dynamic network tariffs should be structured to apply variable charges
    only during critical peak periods and set at zero otherwise — this eliminates
    transaction costs that otherwise suppress spot market arbitrage and amplifies
    the combined benefit of dynamic network pricing and spot passthrough for V2G customers.
