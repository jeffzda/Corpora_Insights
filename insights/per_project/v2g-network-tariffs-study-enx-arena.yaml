  source_title: ARENA - Vehicle to Grid - Network tariffs report
  publish_date: '2024-02-22'
  project_name: V2G Network Tariffs Study (enX/ARENA)
  what_happened: Ausgrid's current bidirectional network support tariff (EA025+EA029)
    modelling showed net earnings to the network from V2G customers over a year, suggesting
    slight over-recovery of variable costs relative to LRMC. The study identified
    that residual costs had been partially included in export rewards, driving additional
    battery cycling not justified by network need.
  lesson_learnt: Bidirectional network support tariff design should base export charges
    and rewards solely on LRMC of exports and exclude residual cost recovery from
    variable export tariff components — including residual costs inflates tariff attractiveness,
    drives excess battery cycling, and results in over-recovery from V2G customers
    relative to the network value they provide.
