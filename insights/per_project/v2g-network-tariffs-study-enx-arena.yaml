  what_happened: Current NER export pricing rules prohibit DNSPs from charging for
    exports below a 'basic export level' until 2034, which Ausgrid estimated removes
    the price signal from approximately 70% of exports driving its future network
    costs. This structural regulatory constraint limits the ability to implement fully
    symmetrical LRMC-based bidirectional tariffs that are theoretically optimal for
    V2G.
  lesson_learnt: V2G tariff designers must account for the NER constraint that prevents
    symmetrical LRMC-based export charging below the basic export level until 2034
    — this limits the range of cost-reflective bidirectional tariff structures available
    and should be factored into regulatory proposals and trial design for the current
    regulatory period.
