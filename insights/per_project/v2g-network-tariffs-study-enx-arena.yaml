- record_id: ARENA-DLV-49002
  source_title: ARENA - Vehicle to Grid - Network tariffs report
  publish_date: '2024-02-22'
  project_name: V2G Network Tariffs Study (enX/ARENA)
  what_happened: Modelling showed that bidirectional time-of-use (ToU) network tariffs
    (scenario 2) produced only a 0.9 MW (2.23%) peak demand reduction — marginally
    better than unidirectional ToU — because the fixed schedule over- or under-incentivises
    discharge throughout the year regardless of actual grid conditions, and the flat
    retail feed-in tariff reinforces off-peak discharging.
  lesson_learnt: Bidirectional ToU network tariffs are unlikely to support efficient
    V2G outcomes at scale — their fixed schedule structure means they must over-compensate
    discharges year-round to achieve critical-peak response, making them unaffordable
    to networks or under-rewarding to customers; treat them as a transitional step
    toward dynamic pricing rather than a destination.
