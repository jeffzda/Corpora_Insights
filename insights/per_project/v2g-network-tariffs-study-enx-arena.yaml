  source_title: ARENA - Vehicle to Grid - Network tariffs report
  publish_date: '2024-02-22'
  project_name: V2G Network Tariffs Study (enX/ARENA)
  what_happened: Modelling found that dynamic network pricing with spot passthrough
    (s6) reduced all variable network charges to near zero outside critical peak periods
    for the Ausgrid network, directly reducing the 'transaction cost tax' on wholesale
    market arbitrage and enabling the economy user — the smallest load profile modelled
    — to achieve net annual revenue of $95 after paying for all household electricity
    and EV charging.
  lesson_learnt: Dynamic network tariff design should explicitly aim to minimise variable
    network charges outside of critical peak periods to zero — this is not merely
    a design choice but a material driver of customer economics, particularly for
    smaller users who would otherwise be priced out of V2G financial viability.
