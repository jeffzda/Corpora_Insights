  source_title: ARENA - Vehicle to Grid - Network tariffs report
  publish_date: '2024-02-22'
  project_name: V2G Network Tariffs Study (enX/ARENA)
  what_happened: V2G was financially superior to smart charging for all customers
    under all six modelled scenarios, with average annual savings of $550 per household
    and payback periods ranging from 2.6 to 21.2 years depending on customer type
    and tariff. Under the best tariff configuration (s6, dynamic network + spot passthrough),
    payback fell below 4 years for all user types, and one economy user achieved net
    annual revenue of $95.
  lesson_learnt: V2G can be financially attractive to diverse EV owner types without
    cost subsidies when tariffs are cost-reflective; ARENA-funded V2G pilots should
    prioritise dynamic network plus spot passthrough tariff structures and target
    high-usage residential customers to maximise both customer uptake and demonstrated
    network value.
