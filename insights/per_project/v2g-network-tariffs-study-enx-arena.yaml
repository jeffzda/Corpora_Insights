- record_id: ARENA-DLV-49008
  source_title: ARENA - Vehicle to Grid - Network tariffs report
  publish_date: '2024-02-22'
  project_name: V2G Network Tariffs Study (enX/ARENA)
  what_happened: All modelled V2G tariff scenarios delivered critical peak demand
    reduction at a cost below Ausgrid's estimated long run marginal cost (LRMC) of
    network expansion ($42.80/kW annualised), with dynamic tariff scenarios (s3, s6)
    resulting in net payments to customers of approximately $39/kW — confirming that
    V2G can defer network augmentation cost-effectively.
  lesson_learnt: Network businesses should use LRMC as the primary cost benchmark
    when evaluating V2G tariff structures — all tested arrangements, including dynamic
    and ToU bidirectional tariffs, delivered peak demand reduction below the cost
    of network augmentation, validating the economic case for V2G network support
    tariffs.
