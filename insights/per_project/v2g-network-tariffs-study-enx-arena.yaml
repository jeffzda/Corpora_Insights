- record_id: ARENA-DLV-49006
  source_title: ARENA - Vehicle to Grid - Network tariffs report
  publish_date: '2024-02-22'
  project_name: V2G Network Tariffs Study (enX/ARENA)
  what_happened: During initial V2G modelling under spot passthrough tariffs, EV charging
    rebounded sharply after high-price discharge events, creating secondary peaks
    that threatened substation capacity limits — at 20% V2G penetration these secondary
    peaks reached Metford substation capacity limits.
  lesson_learnt: V2G trial and program design must include dynamic operating envelopes
    (DOEs) or equivalent import/export controls to prevent rebound charging from creating
    secondary peaks, especially as penetration approaches 10–20%; relying solely on
    price signals is insufficient to guarantee grid stability under high V2G uptake.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated integration
  intervention_note: Dynamic operating envelopes (DOEs) were simulated across all
    modelling scenarios with import limits tightening proportionally once substation
    load exceeded 60% of rated firm capacity, effectively mitigating adverse secondary
    peak outcomes.
  transferability: broad
  delay_magnitude: null
  technology_domain: EV
