- record_id: ARENA-DLV-49001
  source_title: ARENA - Vehicle to Grid - Network tariffs report
  publish_date: '2024-02-22'
  project_name: V2G Network Tariffs Study (enX/ARENA)
  what_happened: Modelling of six network and retail tariff combinations for V2G at
    10% residential penetration found that dynamic network tariffs combined with spot
    price passthrough (scenario 6) delivered the greatest critical peak demand reduction
    (2.54 MW, 6.29% of substation firm capacity) and the best customer financial outcome
    (net weekly earnings of $5.54 per customer) among all scenarios tested.
  lesson_learnt: Design V2G tariff frameworks around dynamic network pricing plus
    spot passthrough rather than time-of-use arrangements — this combination simultaneously
    maximises peak demand mitigation and customer savings, and should be the target
    architecture for future V2G tariff trials and regulatory proposals.
