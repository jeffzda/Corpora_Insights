- record_id: ARENA-DLV-49003
  source_title: ARENA - Vehicle to Grid - Network tariffs report
  publish_date: '2024-02-22'
  project_name: V2G Network Tariffs Study (enX/ARENA)
  what_happened: Unidirectional ToU network tariffs combined with ToU retail pricing
    (scenario 1) delivered the weakest V2G grid performance — only 0.6 MW (1.48%)
    critical peak reduction — because flat feed-in tariffs incentivised daytime self-consumption
    discharge regardless of grid conditions, and the network tariff provided no export
    reward during critical peaks.
  lesson_learnt: Standard unidirectional ToU network tariffs with flat feed-in tariff
    retail products should not be relied upon to deliver meaningful V2G grid services;
    project teams and policymakers should avoid designing V2G programs around these
    structures and prioritise bidirectional or dynamic pricing from the outset.
