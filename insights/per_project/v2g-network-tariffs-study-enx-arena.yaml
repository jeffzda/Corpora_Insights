  project_name: V2G Network Tariffs Study (enX/ARENA)
  what_happened: 'The study found that V2G customer outcomes vary significantly by
    household load profile: economy users had the lowest savings under most scenarios
    (e.g., $118/yr additional savings over smart charging under s2) while high-consumption
    sponge users achieved up to $960/yr. Payback periods for economy users ranged
    from 3.3 to 21.2 years compared to 2.6 to 7.2 years for sponge users.'
