  what_happened: Legacy retailer billing systems were identified as a material barrier
    to the pass-through of dynamic and complex network tariffs. Ausgrid's current
    billing system, for example, cannot pair a customer demand measure (kW) with a
    usage charge (c/kWh), limiting its ability to offer innovative tariffs to retailers
    and therefore to end customers.
