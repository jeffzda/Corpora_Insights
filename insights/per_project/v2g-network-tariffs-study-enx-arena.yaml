  what_happened: Only 25.73% of residential NEM customers were on a cost-reflective
    network tariff as at 30 June 2022 — an increase of approximately 9% from the prior
    year — due to slow meter rollout, retailer reluctance to pass through complex
    tariffs, and legacy billing system constraints. Retailers were found to commonly
    shield customers from network price signals with flat or fixed retail products.
  lesson_learnt: Network tariff reform must be paired with mandatory or incentivised
    retailer pass-through of cost-reflective price signals and investment in billing
    system capability — without retail-level transmission of dynamic network prices,
    the distribution-level tariff innovations modelled in this study will not reach
