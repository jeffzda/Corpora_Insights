- record_id: ARENA-DLV-45014
  source_title: Network Hosting Capacity Projects Progress Report (Year One)
  publish_date: 2020-03
  project_name: 'Dynamic Limits: Distributed Energy Resources Feasibility Study'
  what_happened: A general technical feasibility study found that dynamic distributed control of DER operating envelopes on radial feeders could increase DER hosting capacity by up to six times compared
    to the status quo, without requiring network augmentation and with only minimal curtailment.
  lesson_learnt: Dynamic operating envelope approaches using distributed control — rather than network augmentation or fixed export limits — represent a high-leverage option for increasing DER hosting capacity;
    feasibility studies for constrained feeders should include this approach as a baseline comparator before committing to infrastructure augmentation.
