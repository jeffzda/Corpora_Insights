  project_name: Generating Renewable Energy from Almond Waste
  what_happened: Analysis showed that a large-scale grid-export gasification option
    (Option 3, 1,923 kW) required a feed-in tariff of at least 18.3 c/kWh to break
    even, compared to the 5 c/kWh wholesale rate used in the model, making grid export
    financially unviable under prevailing market conditions.
  lesson_learnt: Industrial bioenergy projects targeting grid export require a secured
    power purchase agreement at well above wholesale spot price to be viable — do
    not proceed to investment without a contracted offtake at a rate that supports
    the business case.
