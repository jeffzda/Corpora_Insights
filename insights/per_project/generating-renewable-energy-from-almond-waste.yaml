  what_happened: Only a fraction of available almond hull and shell waste (less than
    10–20%) would be needed to meet on-site electricity demand at hulling and shelling
    facilities, meaning large volumes of feedstock would remain unused if the plant
    is sized to on-site demand — creating a potential surplus-feedstock supply challenge
    or opportunity.
  lesson_learnt: For agricultural waste-to-energy projects, quantify the feedstock
    surplus early and identify secondary markets or uses (briquetting, pelletising,
    composting, export) before committing to plant sizing — the waste surplus is both
    a risk (storage, combustion) and a potential revenue opportunity.
