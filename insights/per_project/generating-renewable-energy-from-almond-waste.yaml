- record_id: ARENA-DLV-48051
  source_title: Generating Renewable Energy from Almond Waste Final Report
  publish_date: '2013'
  project_name: Generating Renewable Energy from Almond Waste
  what_happened: Economic analysis of biomass gasification for the almond industry
    found that only a small-scale 100 kW system (Option 1) produced a positive return
    (BCR 1.28, NPV $0.527M), while larger systems sized to meet peak demand (550 kW,
    BCR 0.47) or use all waste (1,923 kW, BCR 0.44) were financially unviable under
    the modelled assumptions.
  lesson_learnt: Right-size bioenergy plant to average demand rather than peak or
    total waste availability — capital costs for larger systems cannot be offset by
    electricity savings or feed-in tariff revenue, and only the smallest configuration
    generates a positive return.
