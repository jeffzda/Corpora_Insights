  what_happened: No commercially operating examples of almond hull and shell gasification
    could be identified anywhere in the world; suppliers from Europe, the US, India,
    China and South Africa were confident the feedstock would work but none could
    cite proven operating examples, indicating the technology readiness for this specific
    feedstock was undemonstrated.
  lesson_learnt: Before committing capital to a gasification plant using a novel agricultural
    feedstock, conduct physical pilot trials to confirm conversion performance — supplier
    confidence without proven operating examples is insufficient basis for investment.
