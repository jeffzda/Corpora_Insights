  what_happened: 'The proportion of electricity consumed during peak tariff periods
    was a significant driver of financial outcomes for the small-scale gasification
    option: operations using 89% peak electricity achieved BCR 1.52, while those using
    only 48% peak electricity fell to BCR 1.05, approaching financial non-viability.'
