- record_id: ARENA-DLV-48066
  source_title: Generating Renewable Energy from Almond Waste Final Report
  publish_date: '2013'
  project_name: Generating Renewable Energy from Almond Waste
  what_happened: The financial analysis assumed a 50% grant from the Clean Technology
    Investment Program; sensitivity analysis showed the grant had a significant effect
    on the magnitude of NPV outcomes, though it did not change the overall direction
    (Option 1 remained positive, Options 2 and 3 remained negative with or without
    the grant).
  lesson_learnt: Do not use the availability of a capital grant as the primary justification
    for a bioenergy investment — a project that only stacks up with 50% grant co-funding
    is marginal and may not proceed if grant programs change; the underlying commercial
    case must be tested without grant support.
