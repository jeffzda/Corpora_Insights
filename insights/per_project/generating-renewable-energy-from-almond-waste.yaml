  source_title: Generating Renewable Energy from Almond Waste Final Report
  publish_date: '2013'
  project_name: Generating Renewable Energy from Almond Waste
  what_happened: The study identified that rising electricity tariffs — particularly
    peak demand charges — represented the greatest financial risk to the almond industry
    at farm gate, with electricity price increases modelled at 7.9% per year for the
    first three years having a significant positive effect on the viability of on-site
    generation.
  lesson_learnt: For agricultural renewable energy projects dependent on avoided grid
    electricity costs, model electricity price escalation scenarios carefully and
    consider the sensitivity of the business case to tariff structure changes — rising
    electricity prices materially improve investment returns.
