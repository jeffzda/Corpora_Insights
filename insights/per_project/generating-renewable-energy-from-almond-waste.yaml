  source_title: Generating Renewable Energy from Almond Waste Final Report
  publish_date: '2013'
  project_name: Generating Renewable Energy from Almond Waste
  what_happened: The study found that the existing revenue stream from selling almond
    hull and shell as stockfeed (at $23/tonne) was highly variable due to distance
    from feedlots and competition from cheaper grain, leaving hullers and shellers
    with stockpiles that could spontaneously combust, reducing the effective value
    of the base case and creating a latent incentive for energy conversion.
  lesson_learnt: When assessing the business case for waste-to-energy conversion,
    account for the true variability and risk of existing waste disposal revenue —
    where the incumbent revenue stream is unreliable, the comparative economics of
    bioenergy investment improve materially.
