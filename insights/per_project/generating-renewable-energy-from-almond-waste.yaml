  source_title: Generating Renewable Energy from Almond Waste Final Report
  publish_date: '2013'
  project_name: Generating Renewable Energy from Almond Waste
  what_happened: The study concluded that a one-size-fits-all industry solution for
    bioenergy from almond waste was not viable; site-specific factors including energy
    efficiency, demand profile, feedstock volume, and value placed on by-products
    (biochar, ash) would determine the optimal technology and scale at each location.
  lesson_learnt: Do not design a single bioenergy solution for an agricultural industry
    — mandate site-by-site feasibility studies that account for individual energy
    demand profiles, efficiency levels, and by-product value before any investment
    commitment.
