- record_id: ARENA-DLV-48055
  source_title: Generating Renewable Energy from Almond Waste Final Report
  publish_date: '2013'
  project_name: Generating Renewable Energy from Almond Waste
  what_happened: Electricity cost for on-farm irrigation pumping dominated the almond
    industry's energy footprint, ranging from 630–3,890 kWh per tonne of kernel compared
    to 58–176 kWh/t for hulling/shelling and 87–99 kWh/t for processing, making on-farm
    electricity the principal cost and carbon risk for the industry.
  lesson_learnt: When assessing renewable energy investment opportunities across an
    agricultural supply chain, target the highest-consumption activity first — on-farm
    irrigation pumping dominates energy cost and carbon footprint and offers the greatest
    return from renewable energy offset.
