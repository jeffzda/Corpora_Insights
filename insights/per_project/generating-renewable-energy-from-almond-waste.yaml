  source_title: Generating Renewable Energy from Almond Waste Final Report
  publish_date: '2013'
  project_name: Generating Renewable Energy from Almond Waste
  what_happened: 'The financial viability of a 100 kW gasification system (Option
    1) was highly sensitive to site-level energy efficiency: a more efficient operation
    requiring only a 50 kW plant achieved a BCR of 2.31, while a less efficient operation
    requiring a 225 kW plant produced a negative BCR of 0.71, turning a viable project
    into an unviable one.'
  lesson_learnt: Conduct a detailed site-specific energy efficiency audit before sizing
    a bioenergy system — over-sizing the plant due to poor energy efficiency destroys
    the business case, while first improving efficiency and then right-sizing the
    plant can double the benefit-cost ratio.
