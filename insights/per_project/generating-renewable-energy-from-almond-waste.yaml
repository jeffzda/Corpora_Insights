  what_happened: The study noted that small-to-medium gasification systems (25–100
    kW) had only recently become commercially available, whereas historically only
    systems of 1 MW or more had been commercially viable, indicating a structural
    change in technology accessibility that created new opportunities for smaller
    agricultural operators.
  lesson_learnt: Monitor the rapid evolution of small-scale gasification system availability
    when assessing bioenergy options for small industrial operators — the commercial
    viability threshold has shifted significantly downward and earlier feasibility
    assessments may underestimate options available to small-scale sites.
