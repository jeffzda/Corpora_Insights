- record_id: ARENA-DLV-16255
  source_title: Energy Storage Study
  publish_date: 2015-07
  project_name: Smart Grid, Smart City — Residential Battery Trials (Newcastle and
    Scone)
  what_happened: Field trials of 5 kW / 10 kWh zinc-bromide flow batteries in households
    across Newcastle and Scone showed battery storage had a significant impact on
    evening peak demand. However, automatic off-peak hot water systems activated very
    late at night, creating a more severe demand peak that the batteries did not reduce.
  lesson_learnt: When designing residential demand management trials, account for
    all controllable loads including off-peak hot water systems — uncontrolled legacy
    appliances can shift or amplify demand peaks and undermine the battery's contribution
    to peak reduction.
