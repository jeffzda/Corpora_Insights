- record_id: ARENA-DLV-51467
  source_title: UTS - Flexible Demand State of Play in Australia - Report
  publish_date: 2024-05
  project_name: PLUS ES – South Australia Demand Flexibility Trial
  what_happened: Third-party control devices (timers, diverters, home energy management
    systems) wired to controlled load hot water circuits by some participants interfered
    with centralised orchestration strategies in the PLUS ES trial, and solar thermal
    systems with auxiliary electric heating created additional complications.
  lesson_learnt: Centralised hot water load orchestration programs must identify and
    screen out premises with third-party control devices on controlled load circuits
    during enrolment — these devices create conflict with central dispatch and can
    cause unexpected disconnection or negate the network service being contracted.
  issue_severity: minor
