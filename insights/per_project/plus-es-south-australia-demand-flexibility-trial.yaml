- record_id: ARENA-DLV-51466
  source_title: UTS - Flexible Demand State of Play in Australia - Report
  publish_date: 2024-05
  project_name: PLUS ES – South Australia Demand Flexibility Trial
  what_happened: Across South Australia, NSW, Queensland and Victoria, approximately
    25% of controlled load circuits in the PLUS ES hot water trial had no load connected,
    substantially reducing the effective pool of dispatchable load available.
  lesson_learnt: Before designing hot water flexible demand programs around controlled
    load circuits, conduct audits of circuit activation status — approximately 25%
    of CL circuits nationally have no active load, meaning the effective addressable
    pool is materially smaller than the nominal connected base.
