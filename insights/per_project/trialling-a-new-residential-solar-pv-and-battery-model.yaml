  source_title: Residential Solar PV + Battery (Hybrid Energy Service) Pilot
  publish_date: 2017-06
  project_name: Hybrid Energy Service Pilot
  what_happened: The 33-unit residential solar PV and battery pilot achieved only
    55% system availability on average over the one-year operational period, driven
    by a 45% downtime rate caused by installation deficiencies, hardware failures,
    and supply chain delays.
  lesson_learnt: For residential BESS pilots, supply chain management and installation
    quality control are the dominant determinants of customer value — target a minimum
    95% system availability before commercial deployment, and do not launch without
    rigorous contractor training and performance specifications in place.
