- record_id: ARENA-DLV-47180
  source_title: Residential Solar PV + Battery (Hybrid Energy Service) Pilot
  publish_date: 2017-06
  project_name: Hybrid Energy Service Pilot
  what_happened: The standard HE System design was not compatible with customers who
    had three-phase supply or large loads (air conditioners, hot water) on off-peak
    tariffs, reducing the amount of grid consumption the system could offset and therefore
    the achievable bill savings for high-consumption customers.
  lesson_learnt: Residential BESS product design must account for network supply type
    (single vs. three-phase) and the tariff structure of large loads before qualifying
    customers — targeting high-consumption customers without assessing whether the
    system architecture can engage their dominant loads will result in lower-than-modelled
    savings.
