    customers had access to backup power for the seven-day outage, but three systems
    were physically damaged by the cyclone; conflicting instructions from Ergon Energy
    Retail and Ergon Energy Network regarding system operation during temporary network
    generation deployment created confusion and customer dissatisfaction.
  lesson_learnt: An end-to-end severe weather protocol for grid-connected residential
    BESS must be developed before deployment — including pre-charging procedures,
    consistent customer communications, and a pre-positioned qualified technician
    response — because inconsistent network and retailer instructions during extended
    outages both endanger customers and destroy trust in the product.
