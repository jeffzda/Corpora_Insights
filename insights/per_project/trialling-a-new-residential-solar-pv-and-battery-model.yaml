  what_happened: All 33 HE Systems required replacement of at least one component
    during the pilot, with failures spanning Solar Charge Controllers, battery modules,
    battery management systems, control boards, modems, cabling and one inverter;
    lengthy delays in contractor fault rectification were the primary driver of the
