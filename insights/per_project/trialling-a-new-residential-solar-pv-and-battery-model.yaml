  what_happened: On-going software licence fees and operation and maintenance costs
    were high relative to the monthly participation fee recoverable from customers,
    making it difficult to achieve Ergon Energy Retail's required rate of return even
    when the system was operational.
  lesson_learnt: Ongoing operational cost structure (software licences, O&M fees)
    for residential BESS services must be modelled against recoverable customer fees
    before commercial launch — if these costs are material relative to revenue, the
    system must either achieve significantly higher availability or the cost model
    must be restructured (e.g. via a PPA that captures energy value rather than a
    flat fee).
