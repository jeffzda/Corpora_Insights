    Response events, reducing the commercial value of using the battery fleet for
    arbitrage and ancillary services.
  lesson_learnt: Manual Demand Response dispatch is inadequate for realising the market
    value of an aggregated BESS fleet — integrate aggregated controls with trading
    or VPP platforms via available APIs so systems discharge automatically when threshold
    wholesale price levels are reached.
