    94% of real-time load measurements fell within only ±30% error, inverter measurements
    had a fixed ±300W error at all power levels, and current transformers were incorrectly
    placed during installation, rendering data unsuitable for verified performance
    analysis.'
  lesson_learnt: Revenue-grade (NMI-approved digital) metering should be specified
    and installed on all electricity flows relevant to customer value from the outset
    of any BESS pilot — relying on inverter-internal metering with ±30% error makes
    it impossible to verify savings, optimise control or defend commercial claims
    to customers.
