  source_title: Residential Solar PV + Battery (Hybrid Energy Service) Pilot
  publish_date: 2017-06
  project_name: Hybrid Energy Service Pilot
  what_happened: The fixed monthly participation fee business model proved unworkable
    because system downtime meant fee recovery was approximately 50% of plan, overall
    costs were higher than budgeted, and customers faced unacceptable uncertainty
    about savings — making the entire business model ineffective.
  lesson_learnt: A fixed-fee pricing model is unsuitable for early-stage residential
    BESS services where system availability cannot be guaranteed; a Power Purchase
    Agreement (PPA) model where customers pay only for energy actually delivered is
    more appropriate and limits customer financial risk.
