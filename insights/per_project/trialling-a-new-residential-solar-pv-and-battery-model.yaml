  what_happened: The Ergon Energy Network connection standard at the time required
    a technical assessment for inverters ≥5kVA; two of 33 units were connected with
    a partial export limit of 3.5kVA and all inverters had to operate at Fixed Power
    Factor 0.9 lagging, reducing solar PV generation value and VPP/Demand Response
    capacity.
