  publish_date: 2024-10
  project_name: Electrode Boiler Installation — MVM, New Zealand
  what_happened: MVM's electrode boiler project to replace lignite-fired heat with
    a 20 MW/40 bar electric boiler required significant additional infrastructure
    including high voltage cables (33 kV) and four transformers across two sites,
    in addition to the boiler itself — the infrastructure upgrades were a substantial
    component of the project scope.
  lesson_learnt: High-pressure electrode boiler projects require extensive grid infrastructure
    upgrades — including HV cables and multiple transformers — that must be scoped
    and costed at feasibility stage; these infrastructure requirements can be the
    critical path and a significant proportion of total project cost.
