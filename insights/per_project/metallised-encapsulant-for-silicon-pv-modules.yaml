- record_id: ARENA-DLV-0657
  source_title: 'Investigate Metallised Encapsulant for Silicon PV Modules: A Path
    to Reduced LCOE for PV'
  publish_date: '2019-08-28'
  project_name: Investigate Metallised Encapsulant for Silicon PV Modules
  what_happened: Misalignment of light-redirecting films (LRFs) relative to flat interconnection
    ribbons was found to reduce current enhancement and, at larger incident angles,
    produce a net current reduction compared to modules without LRFs — meaning practical
    application tolerances could negate or reverse the intended optical benefit.
  lesson_learnt: Optical enhancement technologies that require precise alignment to
    ribbon or conductor geometry should be assessed with realistic manufacturing alignment
    tolerances built into simulations — even modest misalignment can convert a positive
    photocurrent gain into a net loss at high angles of incidence, undermining annual
    energy yield.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: ME technology was identified as avoiding this alignment issue
    entirely, as light-accepting surfaces can be directly patterned onto the ME conductors
    without requiring a separate alignment step.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id007
  - 8
  - 9
  evidence_excerpt: A key result from our project to date has highlighted that any
    misalignment of the LRFs to the flat interconnection ribbons reduces the current
    enhancement of the applied film and can result in a larger current reduction for
    larger incident light angles.
