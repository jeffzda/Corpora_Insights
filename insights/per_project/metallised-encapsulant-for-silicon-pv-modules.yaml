  publish_date: '2019-08-28'
  project_name: Investigate Metallised Encapsulant for Silicon PV Modules
  what_happened: Joint ownership of IP between multiple research institutes proved
    impractical when industrial partners required access to the technology IP, forcing
    the project to create two separate classes of IP — one owned solely by UNSW (technology
    development IP) and one permitting joint ownership (non-ME fabrication IP) — adding
    complexity and time to negotiations.
  lesson_learnt: Before finalising a multi-partner research collaboration that includes
    industrial partners with IP access rights, determine upfront whether joint ownership
    is legally and commercially feasible; if industrial partners require licensed
    access, single-institution ownership of core technology IP may be necessary and
    a two-class IP structure should be designed early rather than negotiated reactively.
