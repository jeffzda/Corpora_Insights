- record_id: ARENA-DLV-0656
  source_title: 'Investigate Metallised Encapsulant for Silicon PV Modules: A Path
    to Reduced LCOE for PV'
  publish_date: '2019-08-28'
  project_name: Investigate Metallised Encapsulant for Silicon PV Modules
  what_happened: Light-redirecting films (LRFs) applied to flat interconnection ribbons
    were found to increase module photocurrent at normal incidence (>2.5% enhancement)
    but reduce photocurrent at larger angles of incidence (>50°), meaning their net
    annual electricity yield benefit depends on geographic location and module orientation
    — a finding not apparent from standard test condition (STC) measurements alone.
  lesson_learnt: Module light-trapping strategies, including add-on optical films,
    must be evaluated against annual electricity yield under realistic field illumination
    angles rather than solely under normal-incidence standard test conditions — STC
    efficiency gains can overstate or even reverse real-world energy yield benefits
    depending on installation latitude and orientation.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Developed the Angular Matrix Framework (AMF) optical simulation
    tool to evaluate electricity yield at all angles of incidence and geographical
    locations, enabling identification of optimal LRF geometries and module orientations.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id006
