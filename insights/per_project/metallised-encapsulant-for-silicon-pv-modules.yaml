  source_title: 'Investigate Metallised Encapsulant for Silicon PV Modules: A Path
    to Reduced LCOE for PV'
  publish_date: '2019-08-28'
  project_name: Investigate Metallised Encapsulant for Silicon PV Modules
  what_happened: Collaborative research agreements with five partners (two research
    institutes and three industrial partners) were not finalised until more than a
    year after the ARENA Funding Agreement was signed, due to complex IP ownership
    negotiations. This delayed progress toward Milestone 2 deliverables and meant
    module fabrication activities could not commence with partner materials until
    December 2018.
  lesson_learnt: When structuring multi-partner R&D projects that will generate IP,
    allocate substantial schedule contingency for contract negotiation and discuss
    IP ownership terms explicitly with all partners before submitting the Expression
    of Interest — complex IP structures (e.g., two classes of ownership) will extend
    negotiations significantly and can delay project milestones by more than a year.
