- record_id: ARENA-DLV-0654
  source_title: 'Investigate Metallised Encapsulant for Silicon PV Modules: A Path
    to Reduced LCOE for PV'
  publish_date: '2019-08-28'
  project_name: Investigate Metallised Encapsulant for Silicon PV Modules
  what_happened: Optical simulations using only a one-dimensional angular distribution
    for the light source produced AOY (Annual Optical Yield) deviations of nearly
    3% compared to the two-dimensional optimum case, which is on the same order of
    magnitude as the geometric improvements being evaluated. This means one-dimensional
    light source modelling was insufficient to reliably discriminate between module
    design variants.
  lesson_learnt: Solar module optical modelling for energy yield assessment must use
    a two-dimensional (azimuth and elevation) angular distribution for the realistic
    light source — using a one-dimensional source can introduce ~3% AOY error, masking
    the performance differences between module designs that are typically only a few
    percent.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: data/validation/testing
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Adopted two-dimensional angular and spectrally resolved light
    sources as the standard for all subsequent energy yield modelling, combined with
    two-dimensional ray tracing simulations as the defined optimum case.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id004
  - 17
  - 18
  evidence_excerpt: We find, that considering two-dimensional incident angles of the
    light source has substantial impact on the resulting AOY. Considering only a one-dimensional
    light source can lead to nearly 3% deviation of the optical yield. This is significant
    as geometric improvements are typically on the same order of magnitude.
  confidence_note: issue_severity set to moderate because the error magnitude (3%)
    is material enough to invalidate design comparisons, though it is a methodological
    finding rather than a project delivery failure per se.
