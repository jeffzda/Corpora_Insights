- record_id: ARENA-DLV-0655
  source_title: 'Investigate Metallised Encapsulant for Silicon PV Modules: A Path
    to Reduced LCOE for PV'
  publish_date: '2019-08-28'
  project_name: Investigate Metallised Encapsulant for Silicon PV Modules
  what_happened: Initial project design assumed that high aspect ratio conductors
    in the metallised encapsulant would be beneficial by reducing shading and improving
    electricity yield; however, thermomechanical stress simulations demonstrated that
    such conductors induce significant stress in silicon wafers, potentially leading
    to microcracks and reduced module durability, requiring a fundamental redesign
    toward flatter conductors.
  lesson_learnt: When designing novel cell interconnection geometries for PV modules,
    thermomechanical stress modelling should be conducted in parallel with optical/electrical
    yield modelling from the outset — geometric choices that improve optical performance
    (e.g., high aspect ratio conductors) can simultaneously introduce stress concentrations
    that compromise durability, and this trade-off is not apparent without integrated
    simulation.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Project redirected toward lower aspect ratio conductors with
    surface structuring optimised for light redirection, combining optical performance
    with reduced stress — a design approach supported by both optical and finite element
    thermomechanical modelling.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id005
  - 3
  - 11
  evidence_excerpt: Although initially, it had been conceived that high aspect ratio
    conductors would be beneficial as they would reduce shading and hence improve
    electricity yield, it has been demonstrated that such conductors can induce significant
    stress in the silicon cells of the module which could lead to microcracks and
    reduced module durability.
  confidence_note: null
