- record_id: ARENA-DLV-47060
  source_title: Australian Concentrating Solar Thermal Industry Roadmap
  publish_date: 2018-08
  project_name: Australian CST Sector (sector-level)
  what_happened: Modelling found that ancillary service revenues (FCAS) under existing
    market rules were insufficient to provide a meaningful value stream to CST generators
    or to materially influence investment decisions, despite CST's inherent capability
    to provide inertia, FCAS and fast frequency response services that the system
    increasingly needs as coal generation retires.
  lesson_learnt: Developers of synchronous dispatchable technologies (CST, hydro)
    should not rely on ancillary service revenues as a material component of their
    investment case under current NEM rules — these revenues are insufficient to drive
    investment decisions, and projects require a primary revenue mechanism (PPA, capacity
    payment, or network savings transfer) to be commercially viable.
