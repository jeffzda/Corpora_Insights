- record_id: ARENA-DLV-50553
  source_title: DEIP Market Integration Trials Summary Report 1.0
  publish_date: 2022-09
  project_name: AEMO VPP Demonstrations
  what_happened: The AEMO VPP Demonstrations found that small battery VPPs were highly
    effective at providing contingency FCAS under trial specification, but identified
    that firmware upgrades without robust testing caused device performance degradation
    that could go unnoticed.
  lesson_learnt: Develop robust firmware upgrade testing and governance processes
    before deploying DER in market services — performance degradation introduced by
    firmware updates can go undetected and compromise ongoing compliance with market
    performance standards.
