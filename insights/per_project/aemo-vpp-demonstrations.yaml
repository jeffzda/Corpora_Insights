- record_id: ARENA-DLV-50554
  source_title: DEIP Market Integration Trials Summary Report 1.0
  publish_date: 2022-09
  project_name: AEMO VPP Demonstrations
  what_happened: The AEMO VPP Demonstrations identified that processes for registering
    and updating participant portfolios with AEMO were burdensome given the dynamic
    nature of DER portfolios changing over time, and that AEMO had insufficient operational
    and planning visibility of price-responsive DER in cost-effective and standardised
    ways.
  lesson_learnt: Future DER market integration programs should streamline portfolio
    registration and update processes with the market operator from the outset, and
    invest in standardised, cost-effective visibility mechanisms so that growing price-responsive
    DER fleets can be tracked operationally without manual overhead.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
