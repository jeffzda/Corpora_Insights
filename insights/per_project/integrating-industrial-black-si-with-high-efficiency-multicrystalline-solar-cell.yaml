- record_id: ARENA-DLV-48104
  source_title: ARENA-Funded Cutting Edge Research in Photovoltaics
  publish_date: 2019-09
  project_name: Integrating industrial black Si with high efficiency multicrystalline
    solar cells (2017/RND009)
  what_happened: More aggressive black Si texturing techniques — which offer superior
    optical performance — had not been integrated into commercial solar cell production
    lines due to process complexity and insufficient knowledge of the correlation
    between opto-electronic surface properties and device performance. The project
    was addressing this knowledge gap from both the manufacturing process side and
    the materials characterisation side simultaneously.
  lesson_learnt: When translating advanced surface texturing techniques from lab to
    production, explicitly characterise the performance-property relationships (texture
    uniformity, optical scattering, electrical junction location) before attempting
    process integration — the lack of this characterisation is the primary barrier
    to commercial adoption of high-performance black Si.
