- record_id: ARENA-DLV-48609
  source_title: Monash University, Low-Cost, Robust, High-Activity Water Splitting
    Electrodes Final Report
  publish_date: 2022-11
  project_name: Low-cost, Robust, High-Activity Water Splitting Electrodes R&D Project
  what_happened: The project demonstrated that translating flame spray pyrolysis fabrication
    to electrocatalysts for hydrogen production is technically challenging due to
    the subtle effects of deposition conditions on catalytic activity, and that standard
    application methods (drop-casting, screen-printing) lead to imperfect catalyst
    morphology with significant unutilised catalyst mass.
  lesson_learnt: Scaling established industrial flame synthesis processes to electrocatalyst
    fabrication requires dedicated R&D investment in deposition condition optimisation
    and morphology control — the process does not transfer directly from commodity
    nanoparticle production; roll-to-roll direct deposition should be evaluated as
    the preferred scale-up approach over post-deposition application methods.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: internal governance/resourcing
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: The team developed a roll-to-roll direct deposition technology
    that combines scalable flame synthesis with fine control over catalyst film morphology,
    mass and porosity, achieving efficient catalyst utilisation with less than 200
    nm thickness and approximately 0.6 g m⁻² material cost.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hydrogen
