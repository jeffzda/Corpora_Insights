  publish_date: 2022-11
  project_name: Low-cost, Robust, High-Activity Water Splitting Electrodes R&D Project
  what_happened: The project identified that advancing the technology from TRL 5 to
    TRL 8–9 and CRL 1 requires scale-up to larger device sizes and further detailed
    techno-economic analysis, representing a significant gap between the current research
    outcomes and commercial readiness.
  lesson_learnt: ARENA R&D projects in hydrogen electrolysis should plan explicitly
    for the TRL 5–9 gap at project inception; securing a defined pathway and follow-on
    funding commitment for device scale-up and CRL progression before project close-out
    reduces the risk of technology stalling between research and commercialisation.
