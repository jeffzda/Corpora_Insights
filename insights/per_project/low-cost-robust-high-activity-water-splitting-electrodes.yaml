    revealed that large Australian industry players (AGL, Woodside, WesCEF) were still
    at an exploration and techno-economic analysis stage, while more ambitious start-up
    activities were targeting actual water electrolysis plant creation. Industry feedback
    also signalled that development of a complete electrolyser device — not just catalysts
    — is critical for commercial uptake.
  lesson_learnt: R&D projects in the hydrogen electrolysis space should engage with
    industry on techno-economic analysis as a primary output — not a secondary one
    — since large Australian industrial players are in the evaluation phase and need
    substantive economic evidence to progress internal decision-making rather than
    materials performance data alone.
