  what_happened: The techno-economic analysis conducted with AGL identified that the
    cost of water electrolysis devices — significantly affected by electrode prices
    — is a more significant parameter than energy efficiency in determining the cost-competitiveness
    of electrolytic hydrogen production.
  lesson_learnt: When assessing green hydrogen production pathways, prioritise reducing
    electrode and electrolyser capital cost over maximising energy efficiency — TEA
    modelling across three Australian use cases showed device cost dominates over
    efficiency in determining commercial viability, which should shape R&D investment
    priorities.
