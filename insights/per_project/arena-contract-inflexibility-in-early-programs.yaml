- record_id: ARENA-DLV-15835
  source_title: Evaluation of ARENA's Impact and Effectiveness
  publish_date: 2019-11
  project_name: ARENA — contract inflexibility in early programs
  what_happened: Evaluations of the RAR and ABIR programs found that the process for
    varying contracts for anything other than minor changes was lengthy due to a lack
    of flexibility. This created significant friction during program delivery when
    projects needed to adapt to changed circumstances.
  lesson_learnt: Funding agreements for demonstration and deployment projects in emerging
    technology areas should include pre-agreed variation pathways for foreseeable
    change scenarios (technology substitution, market changes, timeline adjustments)
    — inflexible contracts in rapidly evolving technology markets create administrative
    bottlenecks that delay project adaptation and threaten delivery.
