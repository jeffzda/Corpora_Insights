  evidence_excerpt: The costs of drilling are the largest contributor to the overall
    capital costs of geothermal projects in Australia. Drilling costs have increased
    rapidly over the last decade, primarily as a result of increases in the price
    of oil and gas and exploration activity that this has generated... The Australian
    drilling services sector is relatively small, with only 13 land-based rigs capable
    of drilling to the depth required for geothermal energy development, compared
    to over 1000 drilling rigs in the United States.
