- record_id: ARENA-DLV-14958
  source_title: 'Looking Forward: Barriers, Risks and Rewards of the Australian Geothermal
    Sector to 2020 and 2030'
  publish_date: 2014-06
  project_name: Australian Geothermal Sector – Drilling Cost Barrier
  what_happened: Drilling costs were identified as the largest contributor to capital
    costs for Australian geothermal projects, having increased rapidly over the preceding
    decade due to oil and gas price increases and exploration activity, with only
    13 land-based rigs capable of drilling to geothermal depths in Australia compared
    to over 1,000 in the United States.
  lesson_learnt: Geothermal project proponents and funders in Australia should account
    for the high volatility and structural elevation of drilling costs driven by the
    oil and gas sector; cost reduction pathways depend primarily on growth of the
    unconventional gas drilling market in Australia rather than geothermal-specific
    initiatives, and this dependency should be explicit in project business cases.
