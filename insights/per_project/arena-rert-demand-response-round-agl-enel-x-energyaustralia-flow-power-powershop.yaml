  evidence_excerpt: Participants in the RERT funding round reported that customers
    already on 'critical peak' network tariffs with Ausnet (Victoria) did not participate
    in RERT because they would face financial penalties even if they missed just 1
    or 2 events… There was also uncertainty about AEMO's interpretation of dual participation
    which led aggregators and businesses to prioritise network demand response participation
    ahead of RERT.
