  secondary_failure_mode: coordination & stakeholders
  intervention_note: 'A protocol was developed (via the Tesla/AEMO collaboration)
    for the FCAS/wholesale conflict: wholesale price signals were prioritised when
    frequency was within normal band, and FCAS response was prioritised otherwise.
    No equivalent resolution was achieved for RERT/network tariff conflicts.'
  transferability: moderate
