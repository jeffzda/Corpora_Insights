- record_id: ARENA-DLV-53861
  source_title: Demand Flexibility Portfolio Retrospective Analysis Report
  publish_date: 2023-07
  project_name: ARENA RERT Demand Response Round (AGL, Enel X, EnergyAustralia, Flow
    Power, Powershop, Zen Ecosystems)
  what_happened: Customers enrolled in 'critical peak' network tariffs with Ausnet
    in Victoria could not participate in RERT because reducing demand for a network
    event lowered their intra-day RERT baseline calculation, removing the financial
    incentive to respond; separately, uncertainty about AEMO's interpretation of dual
    RERT/FCAS eligibility led aggregators to prioritise one value stream over the
    other.
  lesson_learnt: Conflicts between value streams (RERT vs. network critical peak tariffs;
    RERT vs. FCAS) can effectively exclude significant portions of a customer portfolio
    from participating in one or more streams; program designers must map regulatory
    interactions between value streams before recruiting customers and seek explicit
    written clarification from AEMO on dual-registration eligibility.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: demonstration
