  source_title: ARENA Insights Forum Presentation Summaries & Key Points – Large-Scale Projects Stream
  publish_date: '2019-06-25'
  project_name: Coober Pedy Hybrid Grid
  what_happened: The Coober Pedy hybrid grid, incorporating wind, solar and battery technologies, achieved higher reliability than the previous diesel-only system, countering a widespread misconception
    that hybrid renewable grids are inherently less reliable than diesel-supported grids.
  lesson_learnt: Challenge the assumption that hybrid renewable grids are less reliable than diesel systems — demonstrated evidence from Coober Pedy shows the opposite outcome is achievable, and this misconception
    should be proactively addressed during community and stakeholder engagement for new remote hybrid projects.
