- record_id: ARENA-DLV-58809
  source_title: 'DER Customer Insights: The Customer Journey'
  publish_date: 2020-07
  project_name: Ergon Energy Residential Solar PV + Battery (Hybrid Energy Service)
    Pilot
  what_happened: Ergon Energy's Hybrid Energy Service Pilot found that 50% of post-installation
    issues could have been avoided through better documentation, training, and establishment
    of clear end-to-end processes for contractors.
  lesson_learnt: Invest in installer documentation, training, and clearly defined
    end-to-end contractor processes before deployment — Ergon's experience shows this
    can halve post-installation support burden, reducing costs and improving customer
    satisfaction.
