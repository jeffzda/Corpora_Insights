- record_id: ARENA-DLV-58810
  source_title: 'DER Customer Insights: The Customer Journey'
  publish_date: 2020-07
  project_name: Ergon Energy Residential Solar PV + Battery (Hybrid Energy Service)
    Pilot
  what_happened: Ergon Energy identified that stringent supply chain management was
    critical to delivering a positive consumer experience and cost-effective service
    in its hybrid energy system trial across Toowoomba, Cannonvale, and Townsville.
  lesson_learnt: For DER programs covering large or dispersed geographies, rigorously
    pre-qualify and actively manage the supply chain — stretched supply chains that
    are slow to respond to customer issues are a significant driver of poor customer
    experience.
