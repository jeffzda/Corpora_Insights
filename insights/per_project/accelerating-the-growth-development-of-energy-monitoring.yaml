- record_id: ARENA-DLV-8812
  source_title: Accelerating the Growth Development of Energy Monitoring Report
  publish_date: 2021-11
  project_name: Accelerating the Growth Development of Energy Monitoring for Solar
    Households and Small Businesses
  what_happened: The Shared Solar trial identified that the Consumer Data Right (CDR),
    once implemented, would be necessary to enable low-cost digital sign-up by giving
    third parties access to smart meter data, and that locational pricing would be
    needed to make local energy sharing financially meaningful. Without these reforms,
    commercial launch was not viable.
  lesson_learnt: Peer-to-peer and shared solar products that depend on CDR or locational
    pricing should not be progressed to commercial scale until those regulatory mechanisms
    are in place — treat their absence as a go/no-go gate, not a risk to manage, and
    use the interim period to build platform readiness rather than attempting early
    commercial launch.
