- record_id: ARENA-DLV-8810
  source_title: Accelerating the Growth Development of Energy Monitoring Report
  publish_date: 2021-11
  project_name: Accelerating the Growth Development of Energy Monitoring for Solar
    Households and Small Businesses
  what_happened: 'Network operators expressed strong interest in DER monitoring data
    but were structurally unable to engage rapidly: they operate on year-long budget
    cycles requiring senior management approval, need internal technical resources
    to connect to data streams, and cannot adequately scope data use cases without
    first exploring the data — creating a chicken-and-egg problem.'
  lesson_learnt: When designing data-sharing programs for regulated network businesses,
    structure initial data access as a low-commitment, exploratory offering with no
    internal resource requirement — network operators cannot scope value without first
    seeing data, but cannot obtain budget approval without first scoping value.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: approvals/contracting
  proponent_type: technology vendor
  delay_category: internal governance/resourcing
  failure_mode: coordination & stakeholders
  outcome_class: partial success
  secondary_failure_mode: poor scoping
  intervention_note: Solar Analytics led an industry-wide initiative resulting in
    the DER Visibility and Monitoring Best Practice Guide to establish common data
    formats and requirements, lowering the barrier to network operator engagement.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: grid/system stability
  source_pages: &id007
  - 16
  - 17
  evidence_excerpt: Network operators are heavily regulated organisations that require
    significant planning and review to implement new projects... It is challenging
    to thoroughly scope out the project without first being able to explore that data
    and spend the time required to understand how it could be beneficially utilised.
    Hence, somewhat of a chicken and egg situation.
