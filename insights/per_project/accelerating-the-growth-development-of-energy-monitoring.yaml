  project_name: Accelerating the Growth Development of Energy Monitoring for Solar
    Households and Small Businesses
  what_happened: Historical low-voltage solar data was successfully shared with 14
    universities and research institutions, which readily used and analysed the data.
    The five Victorian network operators were less interested because they already
    had access to smart meter data covering nearly all sites, making the Solar Analytics
    dataset comparatively less attractive despite being more granular and real-time.
  lesson_learnt: Before developing DER data products for network operators, assess
    the existing smart meter data landscape in each jurisdiction — operators with
    near-universal smart meter coverage have materially lower appetite for third-party
    monitoring datasets, and product positioning must address this gap.
