  source_title: Accelerating the Growth Development of Energy Monitoring Report
  publish_date: 2021-11
  project_name: Accelerating the Growth Development of Energy Monitoring for Solar
    Households and Small Businesses
  what_happened: The Energy Plan Optimiser showed that residential solar customers
    could save over $400 p.a. by switching to the best available retail electricity
    plan, but the best offer changed monthly or faster in competitive states, requiring
    continuous market comparison.
  lesson_learnt: Automated, ongoing retail plan monitoring is essential in competitive
    energy markets — the optimal plan changes monthly or faster, so a one-time recommendation
    at installation rapidly loses value; build continuous comparison and alert functionality
    into any energy management product.
