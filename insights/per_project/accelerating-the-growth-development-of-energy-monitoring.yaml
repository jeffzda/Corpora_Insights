  project_name: Accelerating the Growth Development of Energy Monitoring for Solar
    Households and Small Businesses
  what_happened: Residential solar customers who monitored both generation and consumption
    were able to shift loads (hot water, air conditioning, pool pumps) to daytime,
    saving up to $350 p.a., though savings were highly variable across customer segments
    based on ability and inclination to shift loads.
  lesson_learnt: Load-shifting savings from solar monitoring are real but highly variable
    — segment customers by their capacity and willingness to shift loads before projecting
    demand-response benefits, and do not use maximum savings figures as representative
    averages.
