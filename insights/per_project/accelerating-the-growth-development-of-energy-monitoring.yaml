- record_id: ARENA-DLV-8806
  source_title: Accelerating the Growth Development of Energy Monitoring Report
  publish_date: 2021-11
  project_name: Accelerating the Growth Development of Energy Monitoring for Solar
    Households and Small Businesses
  what_happened: 'The Shared Solar peer-to-peer energy trading platform was trialled
    with a small community cohort but failed to achieve sufficient engagement or a
    viable business model, and was discontinued. Two key barriers were identified:
    the value proposition was technically difficult to convey and take-up effort was
    high; and the cost of dedicated hardware, combined with current network tariff
    structures that provide negligible savings from local sharing, made the economics
    unworkable.'
  lesson_learnt: Peer-to-peer energy trading platforms are not commercially viable
    under current Australian network tariff structures and without consumer data access
    mechanisms such as CDR — do not commit to a commercial launch until locational
    pricing and low-friction data access are available, as these are structural prerequisites,
    not implementation details.
