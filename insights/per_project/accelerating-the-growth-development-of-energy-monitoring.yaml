- record_id: ARENA-DLV-8809
  source_title: Accelerating the Growth Development of Energy Monitoring Report
  publish_date: 2021-11
  project_name: Accelerating the Growth Development of Energy Monitoring for Solar
    Households and Small Businesses
  what_happened: Sharing live API data with network operators proved more challenging
    than sharing historical data, due to additional security and access requirements
    on the network operators' side. Issues included data consistency problems such
    as new sites being added mid-stream, communications faults causing site data loss,
    shading impacts, and time zone accounting errors.
  lesson_learnt: When delivering live data products to regulated network operators,
    account for their security review requirements and data consistency expectations
    from the outset — extend API retrieval windows to match their existing systems
    (e.g. 48-hour windows), and document handling of dynamic site lists, communications
    faults, shading, and time zones before going live.
