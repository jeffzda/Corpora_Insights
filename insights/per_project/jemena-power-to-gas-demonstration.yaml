  failure_mode: commercial & market
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: regulatory & approvals
  intervention_note: Jemena worked with GreenPower to trial a Renewable Gas Guarantee
    of Origin (RGGO) scheme as an additional revenue stream not initially identified
    in the business case.
  transferability: broad
  delay_magnitude: null
  technology_domain: hydrogen
  source_pages: &id030
  - 33
  - 34
  evidence_excerpt: Large scale renewable hydrogen from electrolysis is not yet commercially
    viable due to the relatively high cost of the electrolyser at the early stages
    of market development... it is currently difficult to commercialise hydrogen projects
