- record_id: ARENA-DLV-14529
  source_title: Jemena - Power to Gas Demonstration - Lessons Learned and Final Report
  publish_date: '2023-10-27'
  project_name: Western Sydney Green Hydrogen Hub (WSGHH)
  what_happened: Large-scale renewable hydrogen from electrolysis was not commercially
    viable at the time of the project due to high electrolyser costs and the absence
    of established hydrogen demand. The project identified that policy mechanisms
    — including time-of-use emission reporting, renewable gas certification and renewable
    gas targets, and load-matched renewable PPAs — would be necessary to commercialise
    future hydrogen projects.
  lesson_learnt: Design hydrogen demonstration projects to explicitly evaluate and
    document the policy mechanisms needed for commercial scale-up — without supportive
    policies such as renewable gas certification, green targets, and load-matched
    PPAs, the commercial case for scaling hydrogen projects cannot be established
    from demonstration results alone.
  issue_severity: moderate
  project_type: enabling infrastructure
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: network business
