- record_id: ARENA-DLV-14504
  source_title: Jemena - Power to Gas Demonstration - Lessons Learned and Final Report
  publish_date: '2023-10-27'
  project_name: Western Sydney Green Hydrogen Hub (WSGHH)
  what_happened: Jemena procured a 500 kW electrolyser that was downrated from a standard
    1 MW platform by fitting a smaller stack. During procurement, it was identified
    that a 500 kW system would cost almost the same as the standard 1 MW platform.
    The downrated configuration was associated with subsequent system reliability
    issues believed to be linked to the reduced energy consumption of the package.
  lesson_learnt: Avoid downrating standard equipment platforms to reach a target capacity
    — procuring a downrated electrolyser at near-equivalent cost to the standard platform
    introduced reliability issues; assess whether purchasing the standard platform
    is preferable to a non-standard downrated variant, particularly where off-take
    demand may materialise during the project.
