- record_id: ARENA-DLV-14509
  source_title: Jemena - Power to Gas Demonstration - Lessons Learned and Final Report
  publish_date: '2023-10-27'
  project_name: Western Sydney Green Hydrogen Hub (WSGHH)
  what_happened: Electrical technicians were not confident of the compliance status
    of the electrolyser's ATEX-rated equipment against Australian Standards (IECEx/AS
    3000) once the facility was operational, due to lack of documentation access and
    unfamiliarity with European certification processes. An internal review of both
    documented processes and installed plant was required. Similar compliance uncertainty
    was understood to have occurred at other electrolyser facilities in Australia.
  lesson_learnt: Require all international equipment vendors to demonstrate explicit
    compliance with Australian Standards (including AS 3000) at procurement — do not
    assume ATEX or IECEx certification is equivalent or sufficient; request full hazardous
    area compliance documentation before equipment is accepted, and ensure local electrical
    technicians can verify compliance status without relying on overseas vendor input.
