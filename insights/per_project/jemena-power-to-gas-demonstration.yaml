- record_id: ARENA-DLV-14510
  source_title: Jemena - Power to Gas Demonstration - Lessons Learned and Final Report
  publish_date: '2023-10-27'
  project_name: Western Sydney Green Hydrogen Hub (WSGHH)
  what_happened: During commissioning, pipeline cleaning debris was blown through
    an isolation valve during purging operations, scoring the soft seat and creating
    a small but unresolvable hydrogen leak. The primary isolation valve was fully
    welded into the pipeline, making repair impossible without full pipeline depressurisation
    and purging. The leak was accepted until the next planned depressurisation event.
  lesson_learnt: Install a sacrificial throttling valve downstream of primary isolation
    valves on hydrogen pipelines to control gas flow during cleaning and purging —
    using the primary isolation valve itself to control flow during pigging allows
    debris to score the seat, and if the valve body is fully welded, repair requires
    full pipeline depressurisation, causing significant operational disruption.
  issue_severity: moderate
  project_type: null
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: The leak was accepted as manageable with no identified hazard
    until the pipeline was next depressurised; the document notes a sacrificial throttling
    valve should have been installed downstream.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages:
  - 13
  - 14
  - 18
  - 19
  evidence_excerpt: This issue could have been prevented with a sacrificial throttling
    valve installed downstream to the isolation valve, which was used throughout the
    cleaning and purging processes to control the gas flow out of the pipe and is
    the suspected cause of the damage.
