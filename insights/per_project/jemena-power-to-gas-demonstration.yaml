- record_id: ARENA-DLV-13202
  source_title: Jemena - Power to Gas Demonstration - Project technical report
  publish_date: 2023-10
  project_name: Western Sydney Green Hydrogen Hub (WSGHH)
  what_happened: Cross-contamination sensors monitoring hydrogen and oxygen in the
    electrolyser output streams triggered repeated shutdowns during testing because
    they required monthly calibration that was not initially identified as a maintenance
    requirement.
  lesson_learnt: Hydrogen/oxygen cross-contamination sensors in PEM electrolyser packages
    require monthly calibration; failing to schedule this maintenance causes repeated
    nuisance shutdowns — specify calibration frequency in the O&M plan before commissioning
    and consider alternative sensor suppliers if the issue persists.
