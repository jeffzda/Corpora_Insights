- record_id: ARENA-DLV-14501
  source_title: Jemena - Power to Gas Demonstration - Lessons Learned and Final Report
  publish_date: '2023-10-27'
  project_name: Western Sydney Green Hydrogen Hub (WSGHH)
  what_happened: The existing regulatory framework did not include hydrogen as a defined
    gas under the NSW Gas Supply Act 1996, requiring Jemena to work with NSW DPIE
    to amend the Gas Supply (Safety and Network Management) Regulation before the
    facility could legally inject hydrogen into the gas distribution network. The
    regulatory amendment was not achieved until December 2020, and the first distributor's
    licence for hydrogen was not granted until June 2021.
  lesson_learnt: Future hydrogen injection projects should anticipate that national
    regulatory frameworks (NGL, National Gas Rules, gas quality standards) still do
    not fully accommodate hydrogen and build regulatory change management as a formal
    workstream — national-level gaps in the definition of 'gas' and hydrogen impurity
    limits mean project-specific regulatory solutions may be required in each jurisdiction.
