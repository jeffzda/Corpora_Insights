  evidence_excerpt: The efficiency during the test was observed to fluctuate around
    an average of 55.5 kWh/kg of hydrogen, or 60.2 %. It was also observed that the
    average efficiency of the electrolyser rose to a maximum of 54.2 kWh/kg or 61.6
    % at a load level of 60 %... the rapid ramping capabilities of the PEM electrolyser
    were also observed... at a rate of approximately 4.5 % per minute... the most
    rapid change of the entire test was observed of approximately 25 % per minute.
