  source_title: Jemena - Power to Gas Demonstration - Lessons Learned and Final Report
  publish_date: '2023-10-27'
  project_name: Western Sydney Green Hydrogen Hub (WSGHH)
  what_happened: The project incorporated an extensive and novel pipeline cleaning
    regime — running 67 foam pigs through the 20" steel buffer store pipeline before
    achieving clean conditions — to reach a hydrogen purity of 99.97% required for
    fuel cell applications. This was the first such cleaning methodology developed
    for carbon steel pipelines in Australia at this purity specification.
  lesson_learnt: Plan for extensive pipeline cleaning campaigns when targeting fuel
    cell-grade hydrogen purity (≥99.97%) from carbon steel pipelines — the WSGHH required
    67 foam pig passes plus nitrogen purging and near-vacuum preparation; this methodology
    should be adopted as standard practice and referenced in future pipeline specifications
    for high-purity hydrogen projects.
