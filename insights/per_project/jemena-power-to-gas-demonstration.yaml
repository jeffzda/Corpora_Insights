  source_title: Jemena - Power to Gas Demonstration - Lessons Learned and Final Report
  publish_date: '2023-10-27'
  project_name: Western Sydney Green Hydrogen Hub (WSGHH)
  what_happened: The WSGHH project was constructed in approximately three months with
    minimal disruptions despite major rain events. This was attributed to the significant
    pre-mobilisation planning between Jemena, WASCO, and GPA, and the ability to coordinate
    sub-contractors effectively. The project team also identified that switching from
    concrete to steel piles saved approximately three weeks in the schedule and significant
    budget.
  lesson_learnt: Invest in detailed pre-mobilisation planning and coordination between
    the project manager, principal contractor, and design consultant — at the WSGHH
    this enabled three-month construction completion despite adverse weather; additionally,
    evaluate alternative foundation systems (e.g., steel vs concrete piles) during
    design as they can yield significant schedule and cost savings.
