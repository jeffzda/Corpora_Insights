- record_id: ARENA-DLV-14524
  source_title: Jemena - Power to Gas Demonstration - Lessons Learned and Final Report
  publish_date: '2023-10-27'
  project_name: Western Sydney Green Hydrogen Hub (WSGHH)
  what_happened: The WSGHH was the first project to inject hydrogen directly into
    Australia's main gas network, using a low-cost 'hot tap' branch connection with
    regulated hydrogen flowrate rather than withdrawing the full gas stream into an
    above-ground blending skid. The methodology was validated through testing and
    consolidated into Standards Australia guideline HB 225.
  lesson_learnt: Use direct in-line hot tap injection with a regulated hydrogen flowrate
    as the preferred low-cost blending method for hydrogen injection into existing
    natural gas steel pipelines — this approach avoids expensive above-ground blending
    skids and has been validated at the WSGHH and codified in Standards Australia
    HB 225.
