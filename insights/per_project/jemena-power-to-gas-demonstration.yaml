- record_id: ARENA-DLV-13204
  source_title: Jemena - Power to Gas Demonstration - Project technical report
  publish_date: 2023-10
  project_name: Western Sydney Green Hydrogen Hub (WSGHH)
  what_happened: The combined effect of the electrolyser diode fault, the cross-contamination
    sensor faults, and hydrogen buffer store leaks caused the WSGHH facility to be
    out of operation for a total of four months during 2022, substantially disrupting
    the testing program.
  lesson_learnt: For first-of-kind hydrogen demonstration facilities, build substantial
    contingency into the testing schedule — multiple concurrent equipment faults (power
    electronics, sensors, pipework seals) can cumulatively cause multi-month outages
    even when each fault appears individually manageable.
