  project_name: Western Sydney Green Hydrogen Hub (WSGHH)
  what_happened: The WSGHH required greater-than-anticipated resourcing for integration
    activities across multiple business areas (Jemena, Zinfra, and external parties).
    The lessons learned workshop identified that adequate allowances for integration
    resourcing time and specialised maintenance equipment had not been fully provisioned,
    and that resource funding should correspond to the nature and complexity of novel
    projects.
  lesson_learnt: Provision adequate resource budgets and resourcing time — scaled
    to the complexity of novel technology integration — at the outset of first-of-kind
    hydrogen projects; underestimating integration resource requirements results in
    compressed timelines for handover activities and gaps in specialised maintenance
    equipment in the maintenance program.
