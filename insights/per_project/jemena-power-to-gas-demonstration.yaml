- record_id: ARENA-DLV-14518
  source_title: Jemena - Power to Gas Demonstration - Lessons Learned and Final Report
  publish_date: '2023-10-27'
  project_name: Western Sydney Green Hydrogen Hub (WSGHH)
  what_happened: The electrolyser market accessible to Australian hydrogen project
    developers in 2017 consisted of 10–15 vendors; by 2022 this had grown to over
    30, but vendors were increasingly focusing on large-scale orders. This trend means
    that buyers seeking small-scale electrolyser solutions face a progressively reduced
    vendor base, even as total market participants grow.
  lesson_learnt: Account for electrolyser vendor market dynamics during project planning
    — as vendors shift focus to large-scale orders, small-scale project developers
    may face a shrinking effective market; engage vendors early, and consider whether
    a slightly larger electrolyser order is feasible to remain attractive to vendors
    with minimum order thresholds.
