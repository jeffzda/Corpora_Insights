- record_id: ARENA-DLV-14511
  source_title: Jemena - Power to Gas Demonstration - Lessons Learned and Final Report
  publish_date: '2023-10-27'
  project_name: Western Sydney Green Hydrogen Hub (WSGHH)
  what_happened: A check valve in the pipework between the electrolyser and main gas
    panel exhibited persistent chattering during electrolyser operation. The root
    cause was not determined — possible causes included pulsing flows from the electrolyser
    or incorrect sizing and harmonics. The issue remained unresolved at the time of
    reporting.
  lesson_learnt: Size check valves in hydrogen electrolyser pipework by modelling
    expected pulsing flow characteristics from the electrolyser under all load conditions,
    rather than relying on standard gas industry sizing rules — PEM electrolysers
    may produce flow pulsations that cause check valve chatter and acoustic issues
    not anticipated in conventional gas designs.
