  source_title: Jemena - Power to Gas Demonstration - Lessons Learned and Final Report
  publish_date: '2023-10-27'
  project_name: Western Sydney Green Hydrogen Hub (WSGHH)
  what_happened: The WSGHH facility incorporated safety into the project governance
    from the outset, with the project manager and project engineer personally stewarding
    safety supported by a dedicated HSE advisor. Regular drug and alcohol testing
    was conducted throughout the project with no positive results; weekly site inspections
    and audits were maintained; and early engagement with sub-contractors aligned
    safety protocols before construction commenced.
  lesson_learnt: Assign safety stewardship ownership to senior project roles (PM and
    PE) rather than delegating it solely to an HSE advisor — direct senior presence
    on site builds mutual respect and enables peer-reinforced safety culture with
    contractors and subcontractors; formalise this expectation in the statement of
    work before contract award.
