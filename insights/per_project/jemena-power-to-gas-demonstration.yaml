- record_id: ARENA-DLV-14508
  source_title: Jemena - Power to Gas Demonstration - Lessons Learned and Final Report
  publish_date: '2023-10-27'
  project_name: Western Sydney Green Hydrogen Hub (WSGHH)
  what_happened: During a planned full-load emergency stop from the control room,
    the electrolyser's air compressor fitting sheared off on restart because all air-operated
    valves closed simultaneously during the e-stop, creating a pressure spike. The
    failure was attributed to poor workmanship on the fitting and highlighted that
    sub-system interactions during emergency procedures had not been fully considered.
  lesson_learnt: Model the pressure transients and mechanical loads imposed on all
    sub-systems — including air compressors and fittings — during emergency stop sequences;
    do not assume that only primary plant components need to be stress-tested for
    e-stop scenarios, as simultaneous valve closure can create destructive pressure
    spikes in auxiliary systems.
