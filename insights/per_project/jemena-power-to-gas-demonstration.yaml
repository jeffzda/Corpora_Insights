- record_id: ARENA-DLV-14505
  source_title: Jemena - Power to Gas Demonstration - Lessons Learned and Final Report
  publish_date: '2023-10-27'
  project_name: Western Sydney Green Hydrogen Hub (WSGHH)
  what_happened: The electrolyser's human-machine interface was configured so that
    only key alarms and conditions were communicated to the remote central PLC/SCADA
    system. In the event of an operational error, the remote system could not receive
    full error detail, requiring an operator to travel to site to resolve the issue
    — a design limitation that impacted operational efficiency.
  lesson_learnt: Design SCADA and remote monitoring systems for hydrogen electrolysers
    to provide full diagnostic visibility at the central control room, not just key
    alarms — limiting remote error detail to key alarms forces on-site attendance
    for every fault event and materially reduces the operational efficiency of remotely
    managed facilities.
