- record_id: ARENA-DLV-14502
  source_title: Jemena - Power to Gas Demonstration - Lessons Learned and Final Report
  publish_date: '2023-10-27'
  project_name: Western Sydney Green Hydrogen Hub (WSGHH)
  what_happened: Planning approvals for the WSGHH were evaluated late in the project
    development cycle — the project team identified that planning requirements should
    have been assessed earlier, prior to detailed design. The development consent
    was lodged with NSW state planning authorities rather than proceeding under the
    existing Gas Supply Act exemption, adding complexity and time to the approvals
    process.
  lesson_learnt: Evaluate planning and development consent requirements before commencing
    detailed design on novel infrastructure projects — late identification of approval
    pathways can force redesign, add cost, and delay the schedule; include realistic
    cost and time estimates for complex approval processes in early project phase
    planning.
