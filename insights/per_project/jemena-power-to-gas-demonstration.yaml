  what_happened: Procurement of hydrogen-specific services and equipment was challenging
    due to the lack of established suppliers and specialists in Australia. None of
    the five vendors that submitted compliant tenders for the electrolyser had previously
    installed an electrolyser in Australia at the time of procurement. COVID-19 further
    disrupted supply chains, prevented factory acceptance tests, and restricted site
    access.
