- record_id: ARENA-DLV-14528
  source_title: Jemena - Power to Gas Demonstration - Lessons Learned and Final Report
  publish_date: '2023-10-27'
  project_name: Western Sydney Green Hydrogen Hub (WSGHH)
  what_happened: The WSGHH chose a grid-connected 100% renewable PPA power supply
    model rather than behind-the-meter (BtM) solar, primarily due to the five-year
    demonstration period limiting capital cost recovery and the desire for higher
    electrolyser utilisation. Analysis showed BtM solar would have offered up to 10%
    efficiency improvement via DC-to-DC connection but would have limited electrolyser
    utilisation to approximately 17% of capacity aligned to solar production.
  lesson_learnt: Assess both grid-connected PPA and behind-the-meter solar supply
    options for electrolyser projects, accounting for utilisation rate trade-offs
    — BtM solar offers up to 10% efficiency gain via DC-to-DC coupling but constrains
    utilisation to ~17% (solar hours only); grid connection with a renewable PPA enables
    higher utilisation and access to demand response revenues, which may outweigh
    efficiency gains at small project scales.
