- record_id: ARENA-DLV-14526
  source_title: Jemena - Power to Gas Demonstration - Lessons Learned and Final Report
  publish_date: '2023-10-27'
  project_name: Western Sydney Green Hydrogen Hub (WSGHH)
  what_happened: The WSGHH project demonstrated that a 500 kW PEM electrolyser could
    achieve an average system efficiency of approximately 60% (55.5 kWh/kg), with
    peak efficiency of 61.6% at 60% load. The electrolyser also demonstrated rapid
    ramping capability of 4.5% per minute when loading and 25% per minute when de-loading,
    supporting demand response and grid-firming applications.
  lesson_learnt: PEM electrolysers do not achieve maximum efficiency at full load
    — peak efficiency occurs at partial load (60% at the WSGHH), and their rapid ramping
    capability (4.5% per minute up, 25% per minute down) makes them well-suited for
    demand response and variable renewable integration; project teams should size
    and dispatch electrolysers to operate at the efficiency sweet spot rather than
    at rated capacity.
  issue_severity: none
  project_type: null
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: network business
