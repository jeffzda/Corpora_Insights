- record_id: ARENA-DLV-14507
  source_title: Jemena - Power to Gas Demonstration - Lessons Learned and Final Report
  publish_date: '2023-10-27'
  project_name: Western Sydney Green Hydrogen Hub (WSGHH)
  what_happened: During early operations, one of the three thyristor diodes in the
    electrolyser package overheated during a full-load test on a warm night, causing
    the electrolyser to trip and fail to restart. A replacement diode was installed,
    but overheating issues persisted and were still under investigation at the time
    of reporting.
  lesson_learnt: Test electrolyser thermal management systems under realistic worst-case
    ambient conditions (high ambient temperature at full load) before commercial hand-over
    — diode overheating linked to the downrated platform caused unplanned outages
    during early operations and required ongoing OEM investigation; thermal de-rating
    curves and ambient temperature limits should be confirmed with the OEM during
    design.
  issue_severity: major
  project_type: null
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: network business
