- record_id: ARENA-DLV-14513
  source_title: Jemena - Power to Gas Demonstration - Lessons Learned and Final Report
  publish_date: '2023-10-27'
  project_name: Western Sydney Green Hydrogen Hub (WSGHH)
  what_happened: Jemena integrated the WSGHH facility fully within its existing gas
    distribution network licence and operational control framework (including Zinfra
    operations), rather than outsourcing operations to a third-party OEM or specialist
    operator as many comparable demonstration projects had done. This required all
    existing safety procedures, training, permitting and work instructions to be reviewed
    and updated for hydrogen-specific risks before operations could commence.
  lesson_learnt: Deciding to operate a hydrogen facility within an existing regulated
    gas network licence framework — rather than outsourcing to an OEM — requires substantial
    pre-operational effort to amend safety cases, develop hydrogen-specific training,
    permitting and work instructions; however, this investment significantly simplifies
    the integration of future hydrogen assets into the business.
