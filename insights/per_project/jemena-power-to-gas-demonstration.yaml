  what_happened: Procurement of the electrolyser identified that specifications, performance
    characteristics, and system definitions varied significantly between vendors,
    making direct cost and performance comparisons difficult. Inconsistencies included
    units of measurement, nominal ratings (stack vs system level), and performance
    definitions (energy in vs hydrogen out).
  lesson_learnt: Develop or adopt a standardised electrolyser product specification
    template for Australian procurements that requires vendors to express performance
    in consistent metrics (system-level, standardised units, energy-in vs hydrogen-out)
    — without this, comparative evaluation of bids is unreliable and tender assessment
    requires significant additional analytical effort.
