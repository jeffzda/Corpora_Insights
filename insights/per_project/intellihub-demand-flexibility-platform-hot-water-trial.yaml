- record_id: ARENA-DLV-16465
  source_title: Flexible Hot Water Webinar
  publish_date: 2024-12
  project_name: Intellihub Demand Flexibility Platform – Hot Water Trial
  what_happened: The limited availability of flexible tariffs in the NEM restricted
    the ability of the Intellihub platform to deliver greater consumer and system
    benefits from hot water load control, as the technical capability to optimise
    load timing outpaced available tariff structures.
  lesson_learnt: Tariff reform must keep pace with smart meter and load control technology
    capability — accelerating the development of flexible tariffs that reward hot
    water load shifting is a prerequisite for realising the full consumer and system
    value of hot water flexibility.
