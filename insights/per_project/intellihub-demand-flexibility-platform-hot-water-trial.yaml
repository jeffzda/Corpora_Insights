- record_id: ARENA-DLV-16466
  source_title: Flexible Hot Water Webinar
  publish_date: 2024-12
  project_name: Intellihub Demand Flexibility Platform – Hot Water Trial
  what_happened: Each retailer was required to negotiate separately with every network
    operator to enable hot water load control, creating a complex and time-consuming
    bilateral engagement process that impeded scaling.
  lesson_learnt: The requirement for bilateral retailer-network negotiations for each
    load control arrangement is a major barrier to scale — establish centralised coordination
    to facilitate multi-party agreements between retailers and networks simultaneously.
