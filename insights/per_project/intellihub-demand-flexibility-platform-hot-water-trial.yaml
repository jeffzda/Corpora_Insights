  outcome_class: knowledge generated despite setback
  secondary_failure_mode: coordination & stakeholders
  intervention_note: Intellihub recommended promoting industry standardisation for
    randomisation tariffs and reviewing current standards and regulations to maximise
    effectiveness during accelerated rollout.
  transferability: broad
