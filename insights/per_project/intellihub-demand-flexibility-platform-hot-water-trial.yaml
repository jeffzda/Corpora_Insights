- record_id: ARENA-DLV-16467
  source_title: Flexible Hot Water Webinar
  publish_date: 2024-12
  project_name: Intellihub Demand Flexibility Platform – Hot Water Trial
  what_happened: Varying standards across network operators for controlled load hot
    water implementation created inefficiencies and compliance burdens, while reliance
    on external network assets limited innovation and adoption of flexible solutions.
  lesson_learnt: Network-by-network variation in controlled load standards creates
    unnecessary compliance overhead and stifles innovation — industry standardisation
    of randomisation rules, control protocols, and tariff structures across DNSPs
    is required to enable efficient national rollout.
