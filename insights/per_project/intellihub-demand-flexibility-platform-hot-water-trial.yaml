- record_id: ARENA-DLV-16468
  source_title: Flexible Hot Water Webinar
  publish_date: 2024-12
  project_name: Intellihub Demand Flexibility Platform – Hot Water Trial
  what_happened: Intellihub's platform reached 376MW+ of aggregated load across 110,000+
    CER devices and was on track to double the original target of 100,000 devices
    to 200,000, driven by strong demand from retailers seeking wholesale cost reduction
    and from networks exploring flexible control as a more performant alternative
    to ripple control.
  lesson_learnt: When a flexible demand platform demonstrates clear financial value
    to both retailers and network operators, adoption can exceed targets significantly
    — early alignment of platform design with retailer wholesale cost reduction and
    network security of supply use cases drives strong uptake.
