- record_id: ARENA-DLV-16469
  source_title: Flexible Hot Water Webinar
  publish_date: 2024-12
  project_name: Intellihub Demand Flexibility Platform – Hot Water Trial
  what_happened: Analysis of hot water load shifting found annualised financial savings
    exceeding $100 per household in most NEM regions (NSW $120, QLD $166, SA $203,
    VIC $125, TAS $35) through wholesale price arbitrage alone, with potential for
    additional savings through advanced optimisation.
  lesson_learnt: Hot water load flexibility delivers material and quantifiable consumer
    bill savings through wholesale price arbitrage in most NEM regions — this financial
    case should be used to underpin consumer incentive design and retailer product
    propositions for flexible hot water programs.
