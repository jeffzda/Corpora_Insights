- record_id: ARENA-DLV-52066
  source_title: ARENA Distributed Energy Resources Projects
  publish_date: 2019-03
  project_name: Reposit Power Intelligent storage for Australia's grid using GridCredits
  what_happened: The GridCredits pilot demonstrated residential battery storage participating in wholesale energy, network, and ancillary services markets, with charge/discharge logic tailored to individual
    household usage patterns using tariff, load/solar, and weather data.
  lesson_learnt: Household battery systems can participate effectively across multiple market streams (energy, network, ancillary services) when control logic is personalised to usage patterns and informed
    by real-time tariff and forecast data — generic dispatch strategies will underperform relative to adaptive, data-driven approaches.
