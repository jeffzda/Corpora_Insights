- record_id: ARENA-DLV-15503
  source_title: Overcoming the Fundamental Performance Limitations of Commercial Solar
    Cells - Final Report
  publish_date: 2015-06
  project_name: ARENA 1-082 Overcoming the Fundamental Performance Limitations of
    Commercial Solar Cells
  what_happened: Attempts to incorporate advanced hydrogenation processes into conventional
    screen-printed solar cells caused bulk minority carrier lifetimes to fall by more
    than an order of magnitude (from ~1 ms to <100 µs) during the firing of screen-printed
    contacts, rendering the passivation ineffective for that cell architecture.
  lesson_learnt: Advanced hydrogenation techniques that deliver large efficiency gains
    in plated-contact cell architectures may be fundamentally incompatible with screen-printed
    contact firing — verify process compatibility with the target cell architecture
    before committing to it as an efficiency improvement pathway.
