- record_id: ARENA-DLV-14351
  source_title: Performance Limitations for Standard Commercial Solar Cells
  publish_date: null
  project_name: Overcoming the fundamental performance limitations of commercial solar
    cells
  what_happened: A structured analysis of commercial solar cell performance limitations
    identified three dominant loss mechanisms (rear aluminium contacts, low-quality
    silicon wafers, and screen-printed front contacts), and solutions were developed
    and implemented for all three, achieving new world record efficiencies and securing
    multiple patents.
  lesson_learnt: Systematically characterising and ranking performance loss mechanisms
    before designing solutions — rather than pursuing incremental improvements — can
    unlock step-change efficiency gains and IP outcomes that would not emerge from
    unfocused R&D.
