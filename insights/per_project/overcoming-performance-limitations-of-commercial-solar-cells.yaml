  what_happened: The project identified a range of residual knowledge gaps — particularly
    around fully exploiting new hydrogenation technology, integrating plating advances
    into commercial manufacturing, and developing new rear surface contact designs
    — that were insufficiently addressed within the original project scope, necessitating
    a funded follow-on project (ARENA RND068) commencing July 2015.
