  what_happened: A research project developed novel techniques for controlling the
    charge state of hydrogen atoms diffused into silicon, enabling far more effective
    passivation of crystallographic defects and contaminant-related performance losses
    in solar cells. High-intensity light was used to control hydrogen charge states,
    yielding demonstrated improvements in wafer quality within seconds of processing.
