- record_id: ARENA-DLV-15501
  source_title: Overcoming the Fundamental Performance Limitations of Commercial Solar
    Cells - Final Report
  publish_date: 2015-06
  project_name: ARENA 1-082 Overcoming the Fundamental Performance Limitations of
    Commercial Solar Cells
  what_happened: The absence of commercially available large-scale plating tools was
    identified as the key factor limiting commercialisation of Pluto and related cell
    technologies requiring plated copper contacts. The project had to design, develop,
    and manufacture bespoke plating baths (constructed in China by Kuttler) before
    large-scale manufacturing could proceed.
  lesson_learnt: When a novel cell technology requires plated contacts, do not assume
    suitable commercial manufacturing tools exist — budget time and resources to co-develop
    tooling in parallel with cell technology, or commercialisation will stall regardless
    of cell performance achievements.
