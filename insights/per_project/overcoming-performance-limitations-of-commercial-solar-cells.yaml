  source_title: The Value and Importance of the Solar Industrial Research Facility
  publish_date: null
  project_name: Overcoming the fundamental performance limitations of commercial solar
    cells
  what_happened: The SIRF facility model — based on donated commercial tools from
    industry partners and tool manufacturers — successfully attracted high-value equipment
    at minimal cost to UNSW, enabling the establishment of a $15 million purpose-built
    facility primarily through industry in-kind contributions.
  lesson_learnt: Research facilities targeting industrial relevance can substantially
    reduce capital costs by positioning their technology agenda to align with industry
    partners' interests, enabling tool donations in exchange for collaborative research
    access and technology development — a viable model for reducing upfront infrastructure
    funding requirements.
