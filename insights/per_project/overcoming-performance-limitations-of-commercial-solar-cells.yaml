- record_id: ARENA-DLV-69954
  source_title: The Value and Importance of the Solar Industrial Research Facility
  publish_date: null
  project_name: Overcoming the fundamental performance limitations of commercial solar
    cells
  what_happened: The transition from screen-printed metallisation to plated cell metallisation
    in large-scale solar manufacturing was projected by the International Technology
    Roadmap for Photovoltaics to take 5–10 years, partly due to the lack of suitable
    commercial plating tools. UNSW developed plating technology and fabricated commercial-scale
    plating baths in SIRF to accelerate implementation at Suntech.
  lesson_learnt: Where a technology transition is constrained by the absence of suitable
    commercial tooling, developing and validating the tooling in parallel with the
    technology — as UNSW did by designing and constructing plating baths suitable
    for large-scale manufacturing within SIRF — can materially accelerate industry
    adoption.
