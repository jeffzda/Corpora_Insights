- record_id: ARENA-DLV-15505
  source_title: Overcoming the Fundamental Performance Limitations of Commercial Solar
    Cells - Final Report
  publish_date: 2015-06
  project_name: ARENA 1-082 Overcoming the Fundamental Performance Limitations of
    Commercial Solar Cells
  what_happened: The project successfully used a Solar Industrial Research Facility
    (SIRF) co-located at UNSW to bridge the gap between laboratory cell development
    and commercial manufacturing — enabling pilot production, technology transfer
    to Suntech, and independent verification of world-record results using commercial-scale
    tools.
  lesson_learnt: A dedicated intermediate-scale research facility (SIRF model) that
    can run full-sized commercial production equipment is essential for de-risking
    the transition from lab-proven cell technology to commercial manufacturing — without
    it, results achieved on hand-crafted lab cells cannot be credibly demonstrated
    at commercial scale to industry partners.
