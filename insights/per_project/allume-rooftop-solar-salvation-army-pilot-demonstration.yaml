- record_id: ARENA-DLV-42652
  source_title: Allume Rooftop Solar Final Report
  publish_date: '2021-10-01'
  project_name: Allume Rooftop Solar Salvation Army Pilot Demonstration Project
  what_happened: Only one of four commercial tenants at the Glenorchy pilot site signed
    on to the consumption-based on-selling PPA. The other tenants declined because
    their electricity was managed centrally at head office level, because aggregated
    bulk purchasing gave them competitive grid tariffs, and because Aurora's SME Time
    of Use tariffs were lower than 20c/kWh, making the solar PPA insufficiently attractive.
  lesson_learnt: On-selling PPA models for multi-tenant commercial buildings are most
    viable in markets with high SME electricity tariffs; before deploying, validate
    that the target tenants' effective grid tariff leaves sufficient margin for a
    competitive solar PPA — and confirm that local site staff have authority to sign
    up without head-office approval.
