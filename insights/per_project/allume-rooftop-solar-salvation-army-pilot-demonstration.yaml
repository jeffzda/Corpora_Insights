- record_id: ARENA-DLV-42655
  source_title: Allume Rooftop Solar Final Report
  publish_date: '2021-10-01'
  project_name: Allume Rooftop Solar Salvation Army Pilot Demonstration Project
  what_happened: The workaround of running two SolShare 35 units in parallel — necessitated
    by both the unavailability of the commercial-grade product and the duplicative
    metering requirement — roughly doubled the number of meters, inverters, and cable
    runs, resulting in installation costs that were not commercially viable for replication
    or scale.
  lesson_learnt: When a technology workaround multiplies the number of hardware components,
    quantify the full installed cost impact before proceeding — doubled cable runs,
    meters, and inverters can make an otherwise viable model uneconomic and should
    trigger a go/no-go review rather than proceeding to pilot.
