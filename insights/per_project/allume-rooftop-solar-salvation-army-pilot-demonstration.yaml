- record_id: ARENA-DLV-42656
  source_title: Allume Rooftop Solar Final Report
  publish_date: '2021-10-01'
  project_name: Allume Rooftop Solar Salvation Army Pilot Demonstration Project
  what_happened: The Salvation Army underwent internal organisational changes during
    the project that moved management of energy projects on the Tasmanian property
    portfolio from Hobart to Melbourne under a national asset management structure.
    This meant the pilot lost buy-in from the new interstate decision-makers and struggled
    for attention against nationally scoped energy projects.
  lesson_learnt: Secure contractual commitment and sign-off at the highest practical
    organisational level at project outset — not just local buy-in — so that internal
    restructuring within a partner organisation does not strand the project without
    an engaged decision-maker; formal agreements spanning multiple levels of the partner's
    hierarchy can preserve momentum through organisational change.
