- record_id: ARENA-DLV-42660
  source_title: Allume Rooftop Solar Final Report
  publish_date: '2021-10-01'
  project_name: Allume Rooftop Solar Salvation Army Pilot Demonstration Project
  what_happened: Australia's National Measurement Institute pattern approval requirements
    for metering were identified as a regulatory barrier that prevented the SolShare
    — which has revenue-grade metering accuracy and modern app/web-based data access
    — from being used as the sole meter, forcing costly duplication. The report notes
    that a review of Australia's Measurement Laws was underway at the time of publication.
  lesson_learnt: Proponents deploying smart energy devices with integrated metering
    should actively monitor and engage with the NMI measurement law review process;
    regulatory reform that recognises app- and web-based data access as equivalent
    to physical interface requirements could eliminate duplicative hardware costs
    and unlock scalability for shared solar and similar DER models.
