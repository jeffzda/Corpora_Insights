  project_name: Allume Rooftop Solar Salvation Army Pilot Demonstration Project
  what_happened: The higher-capacity commercial-grade SolShare product intended for
    C&I sites did not eventuate because prototypes failed to meet electromagnetic
    emissions standards and remained under development, forcing the project to use
    two residential-grade SolShare 35 units wired in parallel as a workaround.
  lesson_learnt: Do not design a commercial deployment around a product that has not
    yet achieved regulatory certification; confirm electromagnetic compliance and
    pattern approval for all key hardware before project commitments are made, as
    a late pivot to a workaround solution can substantially increase cost and complexity.
