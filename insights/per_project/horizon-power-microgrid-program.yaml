- record_id: ARENA-DLV-1801
  source_title: ARENA Insights Forum November 2018 DER Summary
  publish_date: 2019-04
  project_name: Horizon Power Microgrid Program
  what_happened: 'Horizon Power, managing 38 microgrids across Western Australia,
    identified four persistent challenge categories in DER integration: systems engineering
    (e.g. solar smoothing remaining cost-prohibitive), operational practice (e.g.
    feed-in management for high RE feed-in rates), commercial models (e.g. customer
    choice), and legislative issues (e.g. data collection and management).'
  lesson_learnt: DER integration at scale across distributed microgrids surfaces challenges
    across all four dimensions — technical, operational, commercial, and regulatory
    — simultaneously; project teams should plan for multi-domain complexity rather
    than treating each challenge in isolation.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: null
  failure_mode: poor scoping
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated integration
  intervention_note: Horizon Power developed a systems blueprint for each microgrid
    assessing ongoing business models and establishing development pathways toward
    a decentralised DER-led energy future.
  transferability: broad
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id001
