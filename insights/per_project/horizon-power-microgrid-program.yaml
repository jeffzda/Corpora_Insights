- record_id: ARENA-DLV-1802
  source_title: ARENA Insights Forum November 2018 DER Summary
  publish_date: 2019-04
  project_name: Horizon Power Microgrid Program
  what_happened: Horizon Power's experience managing 38 separate microgrids demonstrated
    that the challenges of integrating high penetrations of DER into isolated networks
    are likely to be replicated at NEM scale as the main grid becomes increasingly
    decentralised.
  lesson_learnt: Lessons from isolated microgrid operations — particularly around
    feed-in management, voltage control, and DER orchestration — should be actively
    harvested and applied to NEM planning, as the NEM will face structurally similar
    challenges at larger scale.
