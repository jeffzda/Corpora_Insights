  evidence_excerpt: Challenges currently identified can be broadly grouped into systems
    engineering (e.g. solar smoothing remains cost-prohibitive to many households),
    operational practice (e.g. feed-in management needed to control high renewable
    energy (RE) feed-in rates), commercial models (e.g. customer choice), and legislative
    challenges (e.g. data collection, use and management).
