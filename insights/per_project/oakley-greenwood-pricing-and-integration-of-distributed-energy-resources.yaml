- record_id: ARENA-DLV-45008
  source_title: Network Hosting Capacity Projects Progress Report (Year One)
  publish_date: 2020-03
  project_name: 'Oakley Greenwood: Pricing and Integration of Distributed Energy Resources'
  what_happened: A review of the National Electricity Rules and NEM regulatory framework
    found that minor rule changes would be needed to implement alternative, more cost-reflective
    DER pricing structures, indicating that current rules do not adequately accommodate
    the pricing mechanisms needed to maximise DER value.
  lesson_learnt: DER pricing reform projects should identify specific NER changes
    required early in the study and engage the AER and AEMC as part of the research
    process — without concurrent regulatory engagement, technically sound alternative
    pricing structures may have limited implementation pathways regardless of their
    cost-benefit merit.
