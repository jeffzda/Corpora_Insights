  project_name: Biological Hydrogen Production
  what_happened: CRISPR gene editing technology, while ultimately successfully applied
    and optimised for the project's bacterial strains, was described as still considered
    a premature technology for some bacterial applications at the time of the project,
    requiring significant optimisation effort before high-precision targeted gene
    edits could be reliably achieved.
  lesson_learnt: When selecting genome editing tools for novel bacterial strains,
    project plans should include explicit time and resource contingency for technology
    optimisation — applying CRISPR to non-model bacterial organisms may require substantial
    parameter optimisation before it is fit for purpose, and assuming out-of-the-box
    applicability will underestimate effort.
