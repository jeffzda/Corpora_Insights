  what_happened: Establishing robust and accurate hydrogen measurement protocols was
    a key challenge at project commencement, requiring development of bespoke sealed
    containers, gas sampling methods, and gas chromatography procedures before reliable
    characterisation of bacterial strain modifications could proceed.
  lesson_learnt: For biological hydrogen research projects, establishing reliable,
    real-time hydrogen measurement protocols should be treated as a foundational prerequisite
    before strain engineering work begins — the absence of such protocols at commencement
    delayed productive characterisation of the relationship between genetic modifications
    and hydrogen output.
