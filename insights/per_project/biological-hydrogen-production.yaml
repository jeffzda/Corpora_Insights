  source_title: Biological Hydrogen Production Final Activity Report
  publish_date: '2022-10-31'
  project_name: Biological Hydrogen Production (ARENA Project 2018/RND003)
  what_happened: Scale-up of the bacterial fermentation system beyond 25 L per single
    batch was blocked by regulatory requirements — growing more than 25 L of genetically
    modified organisms in a single container requires OGTR-certified Physical Containment
    Level 2 (PC2) large-scale facilities, which were not widely available and only
    recently became accessible via a commercial contract facility.
  lesson_learnt: Projects involving genetically modified organisms must map OGTR regulatory
    thresholds (e.g. the 25 L single-container limit triggering PC2 large-scale certification)
    into their scale-up pathway early in project design — failure to do so can create
    a hard regulatory ceiling that blocks progression to pilot scale and requires
    external facility arrangements not available within the project's own infrastructure.
  issue_severity: major
  project_type: manufacturing/supply chain
  project_scale_band: lab/bench
  lifecycle_phase: approvals/contracting
