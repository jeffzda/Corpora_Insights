    as part of a Business Research and Innovation Initiative (BRII) Grant scheme feasibility
    trial in early 2021 found that a cost of hydrogen approaching $2-3/kg is achievable
    by further additional improvements to our current engineered strains. This low
    cost can be achieved by increasing the yield from glucose to five mole of H2 per
    mole of glucose, increasing the rate of hydrogen production to 20 L per hr per
    L of culture, and scaling the system to process several tonnes of biomass per
    day.
