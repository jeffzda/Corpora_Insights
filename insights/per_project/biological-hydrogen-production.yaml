  what_happened: The majority of the 49.1 grams (601 L) of hydrogen produced during
    the project was vented for safety reasons rather than captured and used, because
    the project's safety management strategy prioritised controlled release over collection
    at the rates achieved.
  lesson_learnt: As biological hydrogen production rates scale up, hydrogen safety
    management strategies (venting vs. capture) should be designed in advance to avoid
    systematically discarding product — projects achieving higher-than-expected production
    rates can face a safety infrastructure gap where collection and utilisation systems
    are not ready to handle output volumes, wasting the primary output.
