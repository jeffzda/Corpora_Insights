  source_title: Biological Hydrogen Production Final Activity Report
  publish_date: '2022-10-31'
  project_name: Biological Hydrogen Production (ARENA Project 2018/RND003)
  what_happened: At project close, demonstration of pilot-scale scalability remained
    an unresolved challenge — the project had only reached 20 L laboratory bioreactor
    scale, and a pilot-scale plant capable of producing tens of thousands of litres
    of hydrogen per day had not been built or tested, representing the primary remaining
    barrier to commercial deployment.
  lesson_learnt: ARENA-funded biological hydrogen R&D projects at lab/bench scale
    should explicitly define the scale-up demonstration pathway required for commercial
    viability as a project output, and plan follow-on funding to bridge the lab-to-pilot
    gap before the primary grant concludes — leaving pilot demonstration to post-project
    activities significantly extends the time to commercialisation and increases the
    risk that follow-on investment will not materialise.
