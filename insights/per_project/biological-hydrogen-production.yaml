  source_title: Biological Hydrogen Production Final Activity Report
  publish_date: '2022-10-31'
  project_name: Biological Hydrogen Production (ARENA Project 2018/RND003)
  what_happened: The project successfully scaled bacterial fermentation from 2 mL
    bench volumes to a 20 L laboratory bioreactor and achieved hydrogen production
    rates approximately 10-fold above the original milestone target (6 L/hr/L culture
    vs. 700 mL/hr/L target), and yields of 25% of theoretical maximum vs. a 20% target
    — demonstrating that iterative synthetic biology optimisation can substantially
    exceed initial performance targets.
  lesson_learnt: In biological hydrogen R&D projects, rate and yield optimisation
    may progress at significantly different speeds — project milestone design should
    allow for this asymmetry, and intermediate milestones should be set for both metrics
    independently to avoid misleading headline performance claims that obscure remaining
    gaps.
