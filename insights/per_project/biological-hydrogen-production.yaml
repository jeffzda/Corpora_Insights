  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: poor scoping
  intervention_note: A commercial contract PC2 large-scale facility that only recently
    became available was identified as the pathway to grow the quantities of cells
    required for further commercial development.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages: &id003
  - 7
  evidence_excerpt: The primary reason for this is that additional regulatory approval
    is required when more than 25 L of genetically modified cells are grown in a single
    container. To grow these larger culture volumes to generate sufficient quantities
    of biocatalyst requires growth in a OGTR certified Physical Containment Level
    2 (PC2) large scale facility. The majority of these facilities are bespoke facilities
    and only recently has a commercial contract facility become available which can
    grow the quantities of cells required for further commercial development of our
    system.
