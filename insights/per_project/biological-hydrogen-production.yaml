- record_id: ARENA-DLV-69457
  source_title: Biological Hydrogen Production Final Activity Report
  publish_date: '2022-10-31'
  project_name: Biological Hydrogen Production (ARENA Project 2018/RND003)
  what_happened: Technoeconomic modelling conducted by the spin-out company HydGene
    Renewables as part of a separate BRII feasibility trial found that a hydrogen
    production cost of $2–3/kg is achievable only after further strain improvements
    — specifically increasing yield to 5 mol H₂/mol glucose, increasing rate to 20
    L/hr/L culture, scaling to process several tonnes of biomass per day, and using
    low-cost biomass feedstocks — none of which had been demonstrated at project close.
  lesson_learnt: Early-stage biological hydrogen R&D projects should conduct technoeconomic
    modelling to define the specific performance thresholds (rate, yield, scale, feedstock
    cost) required to reach commercial viability, and use these as forward milestones
    for follow-on funding — this prevents commercialisation planning from being decoupled
    from technical performance gaps.
