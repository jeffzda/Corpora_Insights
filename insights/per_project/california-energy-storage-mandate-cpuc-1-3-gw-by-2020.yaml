- record_id: ARENA-DLV-16269
  source_title: Energy Storage Study
  publish_date: 2015-07
  project_name: California Energy Storage Mandate (CPUC 1.3 GW by 2020)
  what_happened: California's Public Utilities Commission passed a 1.3 GW storage
    mandate in 2013 requiring the state's three largest investor-owned utilities to
    install storage across transmission, distribution and end-user market segments,
    with flexibility to shift allocations between segments. The mandate attracted
    criticism for over-weighting the transmission sector where commentators argued
    the value of storage was lower than at the household level.
  lesson_learnt: Storage mandate design that places the largest obligation on transmission-level
    deployment may miss the higher marginal value available at the distribution and
    end-user level; mandates should be designed to direct storage toward the segments
    where it provides the greatest system value, with flexibility for NSPs to reallocate
    targets as evidence accumulates.
