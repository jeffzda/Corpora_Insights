- record_id: ARENA-DLV-37002
  source_title: V2X.au Summary Report – Opportunities and Challenges for Bidirectional
    Charging in Australia
  publish_date: '2023-06-30'
  project_name: V2X.au
  what_happened: Australia has not standardised many key aspects of EVSE design (e.g.,
    CCS and its dependent standards, or smart grid requirements), meaning there is
    no definitive 'Australian specification' for EVSE. This is perceived by international
    OEMs as a significant impediment to local market entry, resulting in Australia
    likely lagging other markets in V2G-capable product supply, competition, and price
    reduction.
  lesson_learnt: The absence of a clear, consolidated national EVSE specification
    increases risk and cost for international OEMs entering the Australian market
    — government should publish a definitive Australian EVSE specification to reduce
    barriers to market entry and accelerate V2G product availability.
