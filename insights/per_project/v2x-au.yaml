- record_id: ARENA-DLV-37006
  source_title: V2X.au Summary Report – Opportunities and Challenges for Bidirectional
    Charging in Australia
  publish_date: '2023-06-30'
  project_name: V2X.au
  what_happened: Australia has not actively participated in international standards
    development and product certification processes for EVSE, meaning Australian-specific
    requirements have not been adequately incorporated into global standards. As a
    result, Australia is at risk of being left behind in the early stages of global
    V2G growth.
  lesson_learnt: Government and network businesses should take a more active role
    in international standards development bodies (e.g., ISO, IEC, CharIN) and product
    certification processes to ensure Australian requirements are reflected in global
    standards — passive adoption of international standards without prior engagement
    leads to misalignment with local regulatory requirements.
