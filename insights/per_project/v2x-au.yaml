  source_title: V2X.au Summary Report – Opportunities and Challenges for Bidirectional
    Charging in Australia
  publish_date: '2023-06-30'
  project_name: V2X.au
  what_happened: V2G-capable charging systems classify as embedded generating units
    under Chapter 5A of the National Electricity Rules, with no specific national
    V2G requirements developed. DNSPs may layer in additional unique requirements
    for V2G at point of connection until effective national frameworks are developed,
    creating inconsistency across jurisdictions.
  lesson_learnt: The absence of specific national V2G connection requirements creates
    a risk of inconsistent DNSP-level requirements being imposed on early projects
    — national frameworks should be developed proactively to avoid a patchwork of
    local connection rules that increase project costs and uncertainty.
