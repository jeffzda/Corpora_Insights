- record_id: ARENA-DLV-37012
  source_title: V2X.au Summary Report – Opportunities and Challenges for Bidirectional
    Charging in Australia
  publish_date: '2023-06-30'
  project_name: V2X.au
  what_happened: Dynamic pricing for V2G creates a risk of highly coincident response
    from multiple customer devices (across multiple GW of potential V2G capacity),
    creating risks to system security within distribution networks and potentially
    at the transmission scale. Existing electricity retailing arrangements may not
    be well suited to managing dynamic loads separately settled in the market.
  lesson_learnt: As V2G scales to multi-GW levels, coordinated charging and discharging
    responses to price signals will create system security risks — technical standards
    for ramp rates and market participation frameworks (such as the AEMO Scheduled
    Lite mechanism and IRP category) must be designed and in place before mass market
    V2G deployment.
