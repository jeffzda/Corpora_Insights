  publish_date: '2023-06-30'
  project_name: V2X.au
  what_happened: Consumer benefits from dynamic pricing in V2G are not evenly spread
    and are highly sensitive to a customer's load shape, with some customer types
    (particularly high-consumption 'Mega' users) capturing substantially more value
    than others (particularly 'Economy' users). In some cases, dynamic pricing disadvantages
    certain customer types relative to ToU tariffs.
  lesson_learnt: V2G business models and tariff designs should not assume uniform
    consumer benefit from dynamic pricing — trials and commercial programmes should
    allow customers to opt in or out of dynamic arrangements, and separately registered
    EVSE circuit loads should be considered to protect customers from adverse outcomes
    under dynamic settlement.
