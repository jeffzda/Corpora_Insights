  what_happened: The majority of the 117 international V2G trials tracked by V2G Hub
    used RNM Alliance vehicles with the CHAdeMO connection standard, but the industry
    is shifting to CCS-based V2G. There are at least 11 CCS-based trials covering
    over 350 charge points, but experience with the CSS/ISO 15118-20 stack remains
    limited globally and in Australia.
  lesson_learnt: CCS-based V2G trials are needed to build industry alignment around
    ISO 15118-20, inform product design, and develop understanding of customer preferences
    — projects using legacy CHAdeMO vehicles will not generate the learnings needed
    for the next generation of V2G deployment.
