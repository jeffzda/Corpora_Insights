    found that smart charging is always cost-beneficial compared to convenience charging,
    and V2G with dynamic pricing is highly preferable for some users in all jurisdictions,
    with average net benefits of V2G compared to smart charging ranging from $1,161
    (QLD) to over $6,728 (NSW) NPV over 10 years.
  lesson_learnt: Smart charging should be the minimum standard for all new EV installations,
    as it is universally cost-beneficial — V2G with dynamic pricing can deliver substantial
    additional value, particularly in jurisdictions with bidirectional network tariffs,
    but the magnitude is highly sensitive to tariff design and customer load shape.
