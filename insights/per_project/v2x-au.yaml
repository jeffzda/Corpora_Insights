- record_id: ARENA-DLV-37024
  source_title: V2X.au Summary Report – Opportunities and Challenges for Bidirectional
    Charging in Australia
  publish_date: '2023-06-30'
  project_name: V2X.au
  what_happened: The international shift from CHAdeMO to CCS as the dominant V2G connection
    standard is causing a gap in the international trial database, with a potential
    saturation of CHAdeMO-based trials visible from 2020 onwards and CCS-based trials
    still being registered. This transition creates a period of reduced knowledge
    generation from large-scale trials globally.
  lesson_learnt: Projects investing in CHAdeMO-based V2G infrastructure now face rapid
    technology obsolescence — new V2G investments should specify CCS/ISO 15118-20
    compatible infrastructure to ensure alignment with the global market direction
    and avoid stranded assets.
