- record_id: ARENA-DLV-37020
  source_title: V2X.au Summary Report – Opportunities and Challenges for Bidirectional
    Charging in Australia
  publish_date: '2023-06-30'
  project_name: V2X.au
  what_happened: Vehicle availability assumptions were identified as a potentially
    key driver of V2G customer cashflows in the modelling, with significant uncertainty
    about real-world plug-in behaviour. The modelling assumed vehicles disconnected
    from 6AM–6PM weekdays, but evidence from UK Project Scurus found 75% of V2G trial
    customers with incentives plugged in after every trip.
  lesson_learnt: Vehicle availability is a critical and highly uncertain modelling
    variable for V2G business cases — trials and modelling studies should treat availability
    as a key sensitivity and design incentive structures to maximise plug-in frequency,
    as availability assumptions can materially shift the financial case for V2G.
