- record_id: ARENA-DLV-37021
  source_title: V2X.au Summary Report – Opportunities and Challenges for Bidirectional
    Charging in Australia
  publish_date: '2023-06-30'
  project_name: V2X.au
  what_happened: The near-term capital cost premium for enabling V2G (DC V2G) is estimated
    at approximately $25,000/MWh, or 6% of current large-scale battery storage costs
    (~$400,000/MWh), based on a $1,500 price premium for an installed V2G-capable
    EVSE over a standard charger. At scale, DC-AC bidirectional chargers are projected
    to be available for around $3,500 (plus installation) by 2026.
  lesson_learnt: The marginal cost of enabling V2G at the EVSE level is very low relative
    to standalone grid-scale storage — business cases and policy frameworks should
    reflect the true marginal cost of V2G enablement (the EVSE premium only, not the
    full battery cost) rather than treating it as equivalent to a standalone battery
    investment.
