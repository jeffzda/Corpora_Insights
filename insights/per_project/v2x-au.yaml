  what_happened: Network tariffs in Australia vary significantly across jurisdictions
    and many are not designed to support bidirectional power flows. Modelling showed
    that the choice of network tariff arrangement can make or break the financial
    case for V2G, with bidirectional network support tariffs (such as those trialled
    by Ausgrid and SAPN) producing markedly superior outcomes for V2G customers.
  lesson_learnt: Network tariff design is a critical enabler or inhibitor of V2G value
    — networks should collaborate to develop more V2G-supportive tariffs, particularly
    bidirectional network support tariffs, to signal national coherence to international
    supply chain stakeholders and unlock customer value.
