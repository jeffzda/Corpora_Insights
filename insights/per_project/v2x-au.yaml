- record_id: ARENA-DLV-37022
  source_title: V2X.au Summary Report – Opportunities and Challenges for Bidirectional
    Charging in Australia
  publish_date: '2023-06-30'
  project_name: V2X.au
  what_happened: EV battery warranty concerns related to V2G usage were identified
    by DNSPs as one of the current challenges for V2G deployment, reflecting uncertainty
    among network operators and customers about whether V2G cycling will accelerate
    battery degradation and void manufacturer warranties.
  lesson_learnt: Battery warranty terms represent a market barrier to V2G adoption
    — early trials should explicitly track battery degradation under V2G cycling and
    negotiate with OEMs to provide warranty coverage for V2G use, as unresolved warranty
    uncertainty will deter consumer uptake even after technical and regulatory barriers
    are addressed.
