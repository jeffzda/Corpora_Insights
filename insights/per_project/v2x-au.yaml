- record_id: ARENA-DLV-37004
  source_title: V2X.au Summary Report – Opportunities and Challenges for Bidirectional
    Charging in Australia
  publish_date: '2023-06-30'
  project_name: V2X.au
  what_happened: ISO 15118 (the CCS communication standard essential for V2G) and
    CCS itself are not formal requirements in Australia, meaning there is no mandated
    pathway for V2G-capable vehicle or EVSE certification. The standard is not required
    locally despite being the apparent market direction, leaving OEMs uncertain about
    compliance pathways.
  lesson_learnt: Formalise CCS and ISO 15118 as requirements in Australian standards
    to provide OEMs with a definitive, investable certification pathway — voluntary
    market direction without regulatory formalisation creates uncertainty that deters
    international supply chain participants.
