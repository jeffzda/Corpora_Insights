- record_id: ARENA-DLV-37005
  source_title: V2X.au Summary Report – Opportunities and Challenges for Bidirectional
    Charging in Australia
  publish_date: '2023-06-30'
  project_name: V2X.au
  what_happened: OCPP version 2.1, required for standardised V2G interoperability,
    had not yet been finalised at time of reporting. OCPP is not a requirement in
    Australia (with only South Australia requiring OCPP 1.6 V2 or higher by 1 July
    2024), and existing OCPP does not provide for Australian-specific use cases such
    as dynamic tariffs, dynamic export limits, or FCAS enablement.
  lesson_learnt: Australia's reliance on a global protocol (OCPP) that does not yet
    address local market requirements creates a gap that will require bridging through
    local protocols such as Modbus — projects deploying V2G infrastructure should
    plan for local protocol compatibility until OCPP 2.1 is finalised and adopted
    nationally.
