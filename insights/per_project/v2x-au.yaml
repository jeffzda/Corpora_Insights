- record_id: ARENA-DLV-37018
  source_title: V2X.au Summary Report – Opportunities and Challenges for Bidirectional
    Charging in Australia
  publish_date: '2023-06-30'
  project_name: V2X.au
  what_happened: Static export limits applied at residential sites (set at 5 kW in
    the modelling) constrain both solar and V2G export capacity and were found to
    significantly affect the value of V2G. Current static export limits, designed
    to manage peak solar generation, risk over-limiting V2G export at times of peak
    demand.
  lesson_learnt: Export limits designed for solar management should not be applied
    uniformly to V2G — DNSPs should ensure export limits use daily-shaped or dynamic
    (DOE-based) profiles so that V2G (and stationary batteries) can export at times
    of peak demand without being constrained by daytime solar management settings.
