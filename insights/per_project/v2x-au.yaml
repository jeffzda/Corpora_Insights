- record_id: ARENA-DLV-37015
  source_title: V2X.au Summary Report – Opportunities and Challenges for Bidirectional
    Charging in Australia
  publish_date: '2023-06-30'
  project_name: V2X.au
  what_happened: The supply of V2G-capable vehicles in Australia has been entirely
    dependent on global automaker decisions regarding timing of V2G capability activation,
    and is shaped by automakers' perception of Australia's policy and regulatory environment.
    The complex and opaque standards and certification framework makes Australia one
    of the hardest developed economies for international OEMs to enter.
  lesson_learnt: International OEM investment decisions about V2G capability activation
    are directly shaped by the perceived ease of market entry — Australia's complex
    certification environment acts as a supply-side barrier that will delay the availability
    of V2G-capable vehicles regardless of domestic demand; simplifying standards and
    certification is therefore a precondition for supply chain development.
