- record_id: ARENA-DLV-37003
  source_title: V2X.au Summary Report – Opportunities and Challenges for Bidirectional
    Charging in Australia
  publish_date: '2023-06-30'
  project_name: V2X.au
  what_happened: Australia lacks dedicated testing facilities for local or international
    OEMs to debug smart and bidirectional EVSE against Australian use cases or to
    perform certification testing against relevant standards. Other major markets
    (UK, EU, Korea, India) provide access to test pre-commercial EV and EVSE for free
    as an industry development measure, whereas no equivalent facility exists in Australia.
  lesson_learnt: The absence of dedicated EVSE test and certification infrastructure
    in Australia creates a structural barrier to V2G market entry — government and
    network businesses should fund establishment of free-access test labs modelled
    on facilities such as ElaadNL to accelerate product homologation.
