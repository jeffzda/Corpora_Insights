- record_id: ARENA-DLV-37001
  source_title: V2X.au Summary Report – Opportunities and Challenges for Bidirectional
    Charging in Australia
  publish_date: '2023-06-30'
  project_name: V2X.au
  what_happened: AS/NZS 4777.2:2020 is being interpreted by the Clean Energy Council
    as requiring IEC 62109-1 and IEC 62109-2 (and potentially AS/NZS 5139) for bidirectional
    EVSE, even though the standard was designed to facilitate V2G. This interpretation
    means V2G EVSE cannot obtain a CEC Approved Inverter listing, blocking grid-connected
    deployment in Australia.
  lesson_learnt: Regulatory ambiguity in inverter standard interpretation can completely
    block product commercialisation — the CEC should adopt a more permissive interpretation
    of AS/NZS 4777.2:2020 reflecting its original intention while the standard is
    revised, and government should actively manage the standards pipeline to prevent
    certification bottlenecks.
  issue_severity: major
  project_type: transport electrification
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: approvals/contracting
  proponent_type: government/public-sector body
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: null
  intervention_note: The report recommends the Clean Energy Council agree to a more
    permissive interpretation of the standard immediately, while the standard is being
    revised.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: EV
  source_pages: &id001
  - 6
  evidence_excerpt: AS/NZS 4777.2:2020 was designed to facilitate V2G, however it
    is currently being interpreted by the CEC as requiring IEC 62109-1 and IEC 62109-2
    for bidirectional EVSE. There is also an interpretation that AS/NZS 5139 conformance
    is required for bidirectional EVSE. These issues mean that V2G EVSE cannot get
    CEC Approved Inverter listing at this time.
