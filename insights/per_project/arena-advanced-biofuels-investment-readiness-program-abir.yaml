- record_id: ARENA-DLV-15810
  source_title: Evaluation of ARENA's Impact and Effectiveness
  publish_date: 2019-11
  project_name: ARENA Advanced Biofuels Investment Readiness Program (ABIR)
  what_happened: All three ABIR projects found that converting biomass (including
    algae) to biofuels was not commercially viable unless economic benefit could be
    realised through co-products. The market context changed markedly between project
    commencement and conclusion, notably through an unexpected fall in fossil crude
    oil prices, fundamentally undermining project economics.
  lesson_learnt: Pre-commercial biofuel projects should explicitly model downside
    fossil fuel price scenarios in their business cases — the ABIR experience shows
    that crude oil price movements can render biofuel economics non-viable even when
    the conversion technology itself advances as planned.
