- record_id: ARENA-DLV-15811
  source_title: Evaluation of ARENA's Impact and Effectiveness
  publish_date: 2019-11
  project_name: ARENA Advanced Biofuels Investment Readiness Program (ABIR)
  what_happened: The ABIR program criteria were found to have been somewhat restrictive,
    resulting in projects being omitted that might otherwise have achieved the program's
    overarching objective. Approximately $5 million of the total funding was unallocated
    and returned to ARENA's consolidated fund.
  lesson_learnt: Program eligibility criteria should be designed with sufficient flexibility
    to accommodate co-production benefit pathways — overly narrow criteria in the
    ABIR case excluded viable projects and left funding unallocated.
