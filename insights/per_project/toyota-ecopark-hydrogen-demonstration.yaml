  what_happened: The cost per kilogram of hydrogen produced at the Ecopark facility
    was found to be highly sensitive to utilisation and the proportion of renewable
    energy used. At 60 kg/day for 250 days/year, cost was $20.93/kg; at 30 kg/day
    for 150 days/year, cost rose to $53.25/kg. With 100% solar at 60 kg/day for 250
    days/year, cost fell below $15/kg.
  lesson_learnt: When modelling hydrogen production costs, treat utilisation rate
    and renewable energy fraction as the two dominant cost drivers — low utilisation
    dramatically increases unit cost (over 2.5x from 60 kg/day to 30 kg/day scenarios),
    and maximising renewable energy input, including through Power Purchase Agreements,
    is the most effective lever for achieving sub-$15/kg costs.
