- record_id: ARENA-DLV-33306
  source_title: Toyota Australia Ecopark Hydrogen Demonstration Public Technical and
    Financial Feasibility Report
  publish_date: 2022-11
  project_name: Toyota Australia Ecopark Hydrogen Demonstration Project
  what_happened: During days with ambient temperature above 35°C, the hydrogen refueller
    failed to achieve a full tank fill on the first attempt, requiring two or three
    attempts. The cause was chilled gas warming in pipework between the chiller and
    dispenser; the temperature sensor at the dispenser automatically aborted refuelling
    when it detected warmed gas. The equipment was originally sourced from overseas
    and was not specified for Australian ambient temperature conditions.
  lesson_learnt: When procuring hydrogen refuelling equipment from overseas suppliers,
    specify Australian environmental conditions explicitly — including high ambient
    temperatures above 35°C — so suppliers can verify equipment performance under
    local conditions. Failure to do so may result in equipment that does not meet
    operational requirements in Australian summer conditions without post-delivery
    modification.
  issue_severity: moderate
  project_type: null
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: manufacturer/OEM
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Feedback provided to the supplier; the refueller was adjusted
    to allow first-time refuelling on high ambient temperature days. The OEM incorporated
    the changes for future Australian deployments. Full testing was scheduled for
    the 2022/2023 summer.
  transferability: moderate
  delay_magnitude: null
  technology_domain: hydrogen
