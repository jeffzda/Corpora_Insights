  what_happened: The electrolyser power consumption per kilogram of hydrogen varied
    significantly with production run size. Smaller production runs resulted in higher
    power consumption per kg (up to 77.79 kWh/kg) compared to larger runs, because
    the full start-up procedure is completed regardless of total hydrogen produced
    and standby mode still draws power for water circulation and cooling.
  lesson_learnt: Optimise electrolyser dispatch scheduling to maximise run length
    — short production runs incur disproportionately high energy costs per kg due
    to fixed start-up loads and standby base consumption. Operating at sustained higher
    output (rather than frequent short cycles) materially reduces the power ratio
    and therefore the cost per kg.
