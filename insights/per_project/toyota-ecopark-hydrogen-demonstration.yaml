  project_name: Toyota Australia Ecopark Hydrogen Demonstration Project
  what_happened: During commissioning, the ionic compressor in the refueller suffered
    a major component failure caused by hydrogen embrittlement, resulting in an ionic
    fluid leak. The root cause was a material change by a sub-tier supplier that was
    not communicated to the OEM, making the part vulnerable to failure under pressure
    change cycles. Replacement OEM parts had to be delivered from overseas.
  lesson_learnt: Require OEMs to enforce material change notification obligations
    through their supply chains for hydrogen-service components — an undisclosed sub-tier
    material change caused hydrogen embrittlement and compressor failure during commissioning.
    Locally sourced temporary parts should be identified in advance for critical components
    to minimise downtime when overseas parts are required.
