- record_id: ARENA-DLV-33307
  source_title: Toyota Australia Ecopark Hydrogen Demonstration Public Technical and
    Financial Feasibility Report
  publish_date: 2022-11
  project_name: Toyota Australia Ecopark Hydrogen Demonstration Project
  what_happened: In March 2022, the electrolyser failed a pressure test during start-up,
    indicating a fault that rendered it unable to generate hydrogen. The cause was
    identified as plastic particle contaminants in the electrolyser water system,
    likely originating from water transfer pipes within the unit, possibly due to
    insufficient cleaning and purging during installation and commissioning. A major
    component required replacement, built and extensively tested in the UK before
    shipping to Australia.
  lesson_learnt: Ensure thorough cleaning and purging of electrolyser water systems
    during installation and commissioning — contamination from internal pipework (e.g.
    plastic particles) can cause major component failure requiring months of downtime.
    Specify cleaning/purging procedures explicitly in commissioning protocols with
    the OEM.
  issue_severity: major
  project_type: null
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: manufacturer/OEM
  delay_category: commissioning/integration
  failure_mode: execution & logistics
  outcome_class: delayed but recoverable
  secondary_failure_mode: null
  intervention_note: Tube trailers of hydrogen from an external gas supplier were
    used to maintain supply to FCEV customers while the electrolyser was offline;
    the external connection point had been incorporated into the original facility
    design specifically to cover such eventualities.
  transferability: moderate
  delay_magnitude: 3-12 months
  technology_domain: hydrogen
  source_pages: &id007
  - 15
  evidence_excerpt: The cause of the failure was determined to be contaminants (plastic
    particles) in the electrolyser water system. The likely source of the plastic
    particles relates to the water transfer pipes within the electrolyser. It is possible
    additional cleaning/purging was required during the installation and commissioning
    process. The OEM required a significant amount of time (months) to replace the
    component.
