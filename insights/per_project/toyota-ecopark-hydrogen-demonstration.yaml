- record_id: ARENA-DLV-33304
  source_title: Toyota Australia Ecopark Hydrogen Demonstration Public Technical and
    Financial Feasibility Report
  publish_date: 2022-11
  project_name: Toyota Australia Ecopark Hydrogen Demonstration Project
  what_happened: Overseas hydrogen equipment suppliers were not designing to Australian
    standards (IECEx), instead supplying equipment certified to ATEX (European standard).
    Where suppliers used ATEX certification, Australian compliance required independent
    verification by component at the importer's cost, potentially increasing project
    cost and timeline.
  lesson_learnt: Specify IECEx certification (not ATEX) as a mandatory requirement
    in all procurement documentation and supplier contracts for hydrogen equipment
    — many European and US suppliers default to ATEX, and post-procurement independent
    verification to achieve Australian IECEx compliance adds cost and delay. Identify
    this at design sign-off stage to avoid it entirely.
  issue_severity: moderate
  project_type: null
  project_scale_band: demonstration
  lifecycle_phase: procurement
  proponent_type: manufacturer/OEM
  delay_category: approvals/regulatory
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: regulatory & approvals
  intervention_note: Toyota identified the IECEx vs ATEX issue at design sign-off
    stage and specified IECEx requirements in procurement to avoid post-delivery compliance
    costs.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages: &id004
  - 13
  - 17
  evidence_excerpt: Australia accepts IECEx wiring standard, however many overseas
    manufacturers adopt ATEX certification. Whilst many components are dual certified
    to both IECEx & ATEX, equipment must be certified to IECEx in order to be activated
    and operated in Australia... By calling our IECEx at the design sign off stage,
    these costs can be avoided.
  confidence_note: null
