  what_happened: During commissioning, an OEM firmware update that was not checked
    for compatibility was automatically rolled out to the electrolyser controller
    overnight, causing a control component to cease operation. The OEM could not roll
    back the update and had to airfreight replacement components from the UK.
  lesson_farnt: Require OEMs to implement change control procedures for firmware updates
    on commissioned hydrogen equipment — an untested overnight firmware update rendered
    the electrolyser control system inoperable and required airfreighting of replacement
    components from the UK. Firmware updates should be approved and tested in a staging
    environment before deployment to operational equipment.
