  publish_date: 2022-11
  project_name: Toyota Australia Ecopark Hydrogen Demonstration Project
  what_happened: The hydrogen facility capacity (up to 80 kg/day production, ~170
    kg storage) significantly exceeded actual customer demand during the reporting
    period, with the facility dispensing approximately 20 kg of hydrogen per week.
    Demand was constrained by the small number of leased vehicles and usage patterns,
    resulting in capacity factors of 4–8%.
  lesson_learnt: For first hydrogen refuelling demonstrations, size production and
    storage capacity to meet a realistic near-term vehicle fleet projection rather
    than theoretical maximum demand — low initial utilisation (4–8% capacity factor)
    is likely when vehicle numbers and customer density are limited. Cost per kg of
    hydrogen is highly sensitive to utilisation, so low demand substantially increases
    unit costs.
