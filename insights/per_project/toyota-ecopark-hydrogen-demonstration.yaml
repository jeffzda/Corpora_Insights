  what_happened: The COVID-19 pandemic severely disrupted installation and commissioning
    stages. Overseas suppliers experienced parts and labour shortages, shipping durations
    increased, and local site preparation was impacted by Victorian lockdown restrictions.
    The original plan for a single coordinated delivery, installation and commissioning
    was abandoned in favour of staged delivery, which required multiple site mobilisations,
    increasing cost.
  lesson_learnt: For projects reliant on overseas-sourced equipment, plan for staged
    delivery and installation as a contingency against supply chain disruption — single-window
    coordinated delivery is vulnerable to external shocks. Multiple site mobilisations
    will increase cost, so contingency budgets should reflect this risk.
