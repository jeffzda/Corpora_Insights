- record_id: ARENA-DLV-61612
  source_title: Demand Management Incentives Review
  publish_date: 2017-06
  project_name: NSW Energy Savings Fund
  what_happened: The NSW Energy Savings Fund, established in 2005, allocated $40 million per annum over five years for DM incentives. In its first two years, $29 million was allocated, delivering estimated
    savings of 189,000 MWh per annum at $15/MWh and 46,560 kW per annum of demand reduction at an estimated cost of $61/kW per annum, delivered via competitive reverse auctions.
  lesson_learnt: Competitive reverse auction mechanisms for DM procurement are effective at delivering cost-efficient demand reduction outcomes; the NSW Energy Savings Fund achieved demand reduction at
    $61/kW per annum — below the modelled DMIP breakeven range — demonstrating that well-designed competitive DM procurement can deliver strong value for money.
