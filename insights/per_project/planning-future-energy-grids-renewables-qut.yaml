  project_name: 'Planning Future Energy Grids: Renewables (QUT)'
  what_happened: QUT developed world-first planning and modelling tools for flexible network planning to accommodate increasing penetration of fluctuating and distributed generation. The planning tool demonstrated
    significant network savings potential in case studies on urban networks in Townsville and rural SWER systems within the Ergon Energy network.
  lesson_learnt: Investing in flexible network planning tools that explicitly model distributed and intermittent generation scenarios can unlock significant network cost savings — such tools should be developed
    in partnership with network operators to ensure applicability to real network configurations.
