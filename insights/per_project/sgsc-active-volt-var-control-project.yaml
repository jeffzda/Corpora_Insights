- record_id: ARENA-DLV-72291
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: '2015'
  project_name: 'SGSC: Active Volt-Var Control Project'
  what_happened: The SGSC Active Volt-Var Control project found that the geographical
    reach of AVVC deployment was constrained by 3G communications availability, with
    future rollout of 4G defining which distribution areas could access the technology.
  lesson_learnt: Communications infrastructure availability (3G/4G coverage) is a
    binding constraint on the geographic footprint of automated network control technologies
    — map communications coverage before planning AVVC or similar smart grid rollouts
    to avoid deployment gaps.
  issue_severity: minor
  project_type: network/grid
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: null
  failure_mode: poor scoping
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: grid/system stability
  source_pages: &id002
  - 521
  evidence_excerpt: The selection of current control feeders relies on availability
    of 3G communications to provide the communications infrastructure. In the future,
    the reach and footprint of 4G communications provided by AusGrid (and 3G fills
    by Telcos) will potentially define the areas that are able to use AVVC.
