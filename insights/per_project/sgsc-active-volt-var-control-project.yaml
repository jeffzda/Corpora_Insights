- record_id: ARENA-DLV-72290
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: '2015'
  project_name: 'SGSC: Active Volt-Var Control Project'
  what_happened: Ausgrid's AUD 100M Smart Grid Smart City Active Volt-Var Control
    project found that STATCOM technology is effective at suppressing voltage fluctuation
    from intermittent renewable sources but that automatic control algorithms require
    an extended advisory-mode trust-building period before network operators can rely
    on them.
  lesson_learnt: Automated voltage control algorithms (AVVC) should be run in advisory
    mode for an extended period before autonomous operation — system operators need
    time to build trust in automatic control systems before handing over network management
    decisions.
