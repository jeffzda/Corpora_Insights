- record_id: ARENA-DLV-16464
  source_title: Flexible Hot Water Webinar
  publish_date: 2024-12
  project_name: United Energy Hot Water Load Control Trial
  what_happened: United Energy's trial showed that load shifted to the 11am–3pm window
    did not fully match the actual solar generation curve, indicating room to improve
    schedule alignment with solar output.
  lesson_learnt: Initial fixed-window load control schedules will not optimally track
    the solar generation curve — iterative schedule refinement or dynamic control
    is needed to maximise the solar-soak benefit and grid value of hot water flexibility.
  issue_severity: minor
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
