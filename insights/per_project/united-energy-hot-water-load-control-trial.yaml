- record_id: ARENA-DLV-16461
  source_title: Flexible Hot Water Webinar
  publish_date: 2024-12
  project_name: United Energy Hot Water Load Control Trial
  what_happened: Shifting all nighttime hot water load to the day resulted in some
    customers experiencing a shortfall of hot water in the morning, indicating the
    initial schedule design did not adequately account for peak morning demand.
  lesson_learnt: Full overnight-to-daytime load shift for hot water creates morning
    hot water shortfalls for some customers — scheduling must preserve a minimum overnight
    heating allocation to cover morning demand, particularly for households with early
    morning peak usage.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
