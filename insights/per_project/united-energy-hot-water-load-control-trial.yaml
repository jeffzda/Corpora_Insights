- record_id: ARENA-DLV-16462
  source_title: Flexible Hot Water Webinar
  publish_date: 2024-12
  project_name: United Energy Hot Water Load Control Trial
  what_happened: Obtaining a reliable dataset for the trial was challenging due to
    multiple confounding factors including weather variation, network changes, change
    in tenancy, holidays, relatives moving in, and Airbnb use affecting individual
    household load profiles.
  lesson_learnt: Hot water trial datasets are susceptible to numerous household-level
    confounders — build data cleaning and anomaly detection protocols into trial design
    from the outset to isolate genuine load response from lifestyle and tenancy changes.
