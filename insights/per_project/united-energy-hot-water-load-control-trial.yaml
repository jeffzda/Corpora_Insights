- record_id: ARENA-DLV-16463
  source_title: Flexible Hot Water Webinar
  publish_date: 2024-12
  project_name: United Energy Hot Water Load Control Trial
  what_happened: The United Energy trial demonstrated that daytime load increase and
    voltage reduction were observable at the Distribution Sub Station level and below
    when hot water load was shifted to daytime periods, confirming hot water load
    control can deliver voltage regulation services.
  lesson_learnt: Hot water load shifting to daytime solar periods produces measurable
    voltage regulation benefits at DSS level and below — network businesses should
    incorporate this capability into their flexible demand value propositions and
    network planning.
