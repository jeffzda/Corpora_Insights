  what_happened: Analysis of the OpEN Initiative's position paper found that all four
    proposed DSO framework models have lower benefits than costs until very high DER
    uptake scenarios are reached across the entire network — meaning large upfront
    investment in whole-network DER management platforms is not yet economically justified.
  lesson_learnt: DER management platforms for distribution networks should be designed
    for step-wise, targeted rollout beginning only in areas already experiencing or
    imminently approaching DER saturation — whole-of-network upfront investment is
    not economically justified at current DER penetration levels. Prioritise deployment
    where network augmentation capex would otherwise be required, delivering immediate
    cost avoidance to justify the scheme.
