  source_title: Role of Decentralised Control for Managing Network Constraints for
    DER
  publish_date: 2020-08
  project_name: Dynamic Limits DDL Control Scheme Feasibility Study
  what_happened: Feasibility analysis found that integration of the DDL Control Scheme
    with existing DNSP SCADA and Distribution Management Systems presents a significant
    implementation challenge, with LV network visibility remaining almost entirely
    absent from existing DNSP systems — rural DNSPs typically have no remote visibility
    of distribution substation conditions beyond MDI recorders requiring physical
    site visits.
  lesson_learnt: Any DER control scheme requiring integration with existing DNSP SCADA
    and DMS must develop a data integration plan as an early project step — the gap
    between existing system capabilities and the data requirements of dynamic DER
    management is large, particularly for rural DNSPs. Integration should proceed
    in a step-wise manner beginning with small-scope trials to test integration pathways
    before broader rollout.
