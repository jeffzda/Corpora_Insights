- record_id: ARENA-DLV-41801
  source_title: Role of Decentralised Control for Managing Network Constraints for
    DER
  publish_date: 2020-08
  project_name: Dynamic Limits DDL Control Scheme Feasibility Study
  what_happened: Stakeholder consultation with DNSPs revealed that only a fraction
    of new DER installations are audited for compliance with AS4777.2 Power Quality
    Response Modes, and of those audited, only a fraction were found to be compliant
    with DNSP configuration requirements.
  lesson_learnt: Do not rely on AS4777.2 PQ Response Modes as a mechanism for managing
    network constraints or unlocking DER hosting capacity — recruitment is optional,
    compliance is poorly enforced, and default activation thresholds are too high
    to provide meaningful relief under typical Australian supply voltages. Any DER
    management scheme must include enforceable compliance mechanisms from the outset.
