- record_id: ARENA-DLV-41805
  source_title: Role of Decentralised Control for Managing Network Constraints for
    DER
  publish_date: 2020-08
  project_name: Dynamic Limits DDL Control Scheme Feasibility Study
  what_happened: Site-specific modelling of the Brimbin village scenario found that
    replacing the existing three-phase 25kVA transformer with a single-phase 25kVA
    unit, combined with dynamic curtailment, would allow each house to install 15kW
    solar (500% of the 3kW static limit) with only 12% annual energy curtailment.
  lesson_learnt: Three-phase distribution transformers supplying small numbers of
    single-phase customers impose per-winding thermal limits that are one-third of
    the total transformer rating, severely restricting DER hosting capacity per customer.
    Replacing three-phase transformers with single-phase units at locations with small
    customer groups and high DER potential is a cost-effective lever for dramatically
    increasing hosting capacity before deploying dynamic control schemes.
