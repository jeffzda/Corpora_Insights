  - 29
  evidence_excerpt: As it currently stands, with typically high average supply voltage
    and the default Response Mode points set at 250V, the degree of constraint relief
    achieved above 250V will be minimal. Until this is rectified, the PQ Response
    Modes are relegated to the role of a backstop rather than a tool that can be used
    either to manage network constraints or unlock further DER hosting capacity.
