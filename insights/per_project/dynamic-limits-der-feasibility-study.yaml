- record_id: ARENA-DLV-41814
  source_title: Role of Decentralised Control for Managing Network Constraints for
    DER
  publish_date: 2020-08
  project_name: Dynamic Limits DDL Control Scheme Feasibility Study
  what_happened: General feasibility modelling for a typical rural supply scenario
    (group of four cottages on a shared 25kVA transformer) showed that applying dynamic
    DER export limit control allows DER installation size to be tripled while requiring
    curtailment of only approximately 12% of potential annual energy output, compared
    to zero curtailment under the static limit at one-third the size.
  lesson_learnt: Dynamic DER export limit control can increase network-hosting DER
    capacity by at least 120% to over 400% above static limit outcomes for typical
    rural supply scenarios, with minimal energy curtailment (circa 12%). This makes
    dynamic limits schemes economically attractive alternatives to network augmentation
    capex in areas approaching DER saturation under static limit regimes.
