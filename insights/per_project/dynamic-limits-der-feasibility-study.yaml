- record_id: ARENA-DLV-41817
  source_title: Role of Decentralised Control for Managing Network Constraints for
    DER
  publish_date: 2020-08
  project_name: Dynamic Limits DDL Control Scheme Feasibility Study
  what_happened: The Newport Review (commissioned as part of the OpEN Initiative)
    identified that centralised DER control platforms directing serial information
    flows through multiple organisations and systems create Latency Cascading — excessive
    cumulative delays that prevent fast real-time control responses. This was confirmed
    as a structural barrier to using centralised control for local network constraint
    management.
  lesson_learnt: Avoid architectures that route real-time network constraint data
    serially through multiple organisations or systems — each hop adds latency that
    prevents the fast control loop responses needed for local constraint management.
    Use point-to-multipoint data broadcasting to all authorised subscribers simultaneously,
    and place enforcement of local network constraints in edge controllers at the
    DER installation rather than in centralised platforms.
  issue_severity: major
  project_type: network/grid
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: development/design
  proponent_type: network business
  delay_category: null
  failure_mode: unvalidated integration
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: The DDL Control Scheme uses a point-to-multipoint ONDP data broker
    that broadcasts network state data to all authorised subscribers simultaneously,
    and places the enforcement logic in the edge DER Controller, eliminating serial
    communication chains.
  transferability: moderate
  delay_magnitude: null
  technology_domain: DER
