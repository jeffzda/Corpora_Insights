  publish_date: 2020-08
  project_name: Dynamic Limits DDL Control Scheme Feasibility Study
  what_happened: Feasibility analysis found that existing network modelling tools
    (PSS SINCAL, PowerFactory) are not capable of adequately modelling the impact
    of dynamic DER limits on network operating states, limiting the ability of DNSPs
    and DSOs to anticipate how dynamic DER control schemes will affect extreme network
    operating conditions.
  lesson_learnt: Project developers and DNSPs planning dynamic DER control scheme
    trials or deployments should not assume that standard network modelling tools
    (PSS SINCAL, PowerFactory) can adequately represent dynamic DER limit effects
    — additional modelling tool development or bespoke Python-based load flow tools
    may be required for site-specific feasibility assessments.
