- record_id: ARENA-DLV-41808
  source_title: Role of Decentralised Control for Managing Network Constraints for
    DER
  publish_date: 2020-08
  project_name: Dynamic Limits DDL Control Scheme Feasibility Study
  what_happened: Essential Energy's network includes approximately 140,000 distribution
    substations, none of which have LV network models available. Any centralised DER
    control platform relying on state estimation or constraint engines to manage DER
    on LV networks would require models for all of these substations — a requirement
    that is economically unviable for rural and remote networks with low revenue per
    km.
  lesson_learnt: For rural and remote DNSPs, centralised DER control approaches requiring
    network models are not economically viable — the cost of building and maintaining
    models for tens of thousands of LV substations is prohibitive relative to available
    revenue. Design DER control schemes for rural networks around direct measurement
    of constraint locations rather than model-based state estimation.
