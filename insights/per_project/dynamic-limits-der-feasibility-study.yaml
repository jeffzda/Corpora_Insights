- record_id: ARENA-DLV-41807
  source_title: Role of Decentralised Control for Managing Network Constraints for
    DER
  publish_date: 2020-08
  project_name: Dynamic Limits DDL Control Scheme Feasibility Study
  what_happened: Modelling of a single rural house on a long LV supply demonstrated
    that the existing 3kW rural static limit could be replaced with a 10kW system
    with negligible curtailment (<1%), and a 15kW system with only 8.1% annual energy
    curtailment — delivering 25,404kWh annually versus 5,526kWh under the static limit.
  lesson_learnt: For single rural customers on long LV supplies, dynamic DER limit
    control can increase annual solar energy delivery by up to 360% compared to the
    standard 3kW static rural limit, with only 8.1% curtailment at 15kW installed
    capacity. This gain is contingent on the average supply voltage being correctly
    set at or near 230V nominal — without that, available hosting headroom is reduced.
