  secondary_failure_mode: poor scoping
  intervention_note: The DDL Control Scheme incorporates a 'fingerprinting' algorithm
    in the DER Controller that maintains dynamic curtailment using historic operating
    profiles when communications are lost, reverting to static limits only after extended
    outage.
