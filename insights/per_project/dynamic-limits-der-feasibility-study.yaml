- record_id: ARENA-DLV-41820
  source_title: Role of Decentralised Control for Managing Network Constraints for
    DER
  publish_date: 2020-08
  project_name: Dynamic Limits DDL Control Scheme Feasibility Study
  what_happened: Feasibility analysis found that increasing DER hosting capacity on
    LV networks through dynamic control schemes also increases Triplen Harmonic currents
    (third and odd multiples) from DER inverters, which are additive in neutral conductors
    and can drive neutral voltage rise — exacerbating 'shocks and tingles' hazards
    from existing broken neutral or faulty neutral connection issues on rural networks.
  lesson_learnt: Projects increasing DER hosting capacity on LV distribution networks
    should assess the potential for increased Triplen Harmonic currents to worsen
    neutral voltage rise and associated electrical safety hazards — this safety risk
    is not addressed by dynamic limit control schemes and requires separate investigation,
    potentially including upgrades to neutral conductor capacity at affected sites.
  issue_severity: moderate
  project_type: network/grid
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: development/design
  proponent_type: network business
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id020
  - 71
  evidence_excerpt: Third harmonics (and all Triplen Harmonics) arising from the use
    of DER inverters will increase if larger DER capacities are facilitated by dynamic
    control schemes. These Triplen Harmonics are additive in the neutral conductor
    and will drive higher neutral voltage rise issues associated with 'shocks and
    tingles'. The DDL Control Scheme does not currently include special provisions
    for detecting and alerting for increases in neutral rise voltages arising from
    increased DER capacities.
