- record_id: ARENA-DLV-41804
  source_title: Role of Decentralised Control for Managing Network Constraints for
    DER
  publish_date: 2020-08
  project_name: Dynamic Limits DDL Control Scheme Feasibility Study
  what_happened: Site-specific modelling of four rural houses on a shared 25kVA transformer
    at Brimbin on the Kundle Kundle feeder found that the existing 3kW rural static
    DER export limit restricts total installed capacity to 12kW — approximately half
    the transformer's available thermal capacity — with no dynamic management of actual
    operating conditions.
  lesson_learnt: Static DER export limits on rural networks are inherently conservative
    and significantly under-utilise available network capacity for most of the year.
    Applying dynamic curtailment in place of static limits can increase allowable
    DER installation sizes to 8kW per house (266% of the 3kW static limit) for two
    houses and 4kW (133%) for two sharing a transformer winding, without any dynamic
    curtailment platform being required — simply by correcting transformer tap settings.
  issue_severity: moderate
  project_type: network/grid
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: development/design
  proponent_type: network business
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: Modelling shows a 2.5% reduction in transformer tap settings
    (6V on 240V base) relieves the voltage constraint for the most constrained house,
    and substituting a single-phase 25kVA transformer for the three-phase unit eliminates
    per-winding capacity sharing constraints entirely.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id004
  - 83
  evidence_excerpt: The existing 3kW static limit applied to DER on rural houses could
    be increased to 8kW for two of the houses (an increase to 266% of the static limit)
    and 4kW for two that share a common transformer winding (an increase to 133% of
    the static limit), without any dynamic curtailment scheme being needed.
