- record_id: ARENA-DLV-41819
  source_title: Role of Decentralised Control for Managing Network Constraints for
    DER
  publish_date: 2020-08
  project_name: Dynamic Limits DDL Control Scheme Feasibility Study
  what_happened: Stakeholder consultation identified that integrating smart meter
    data as a third-party data source for DER control purposes is not straightforward
    — smart meters typically only consider loads at their specific installation, take
    averages over variable time periods, are not necessarily time-synchronised with
    each other, and have sampling frequencies too low for near-real-time DER constraint
    management.
  lesson_learnt: Do not assume smart meter data can substitute for dedicated network
    sensors in DER management schemes — smart meter data limitations (installation-level
    view only, variable averaging periods, lack of time synchronisation, insufficient
    sampling frequency) make it unsuitable for near-real-time network constraint management
    without significant additional investment to address these issues.
