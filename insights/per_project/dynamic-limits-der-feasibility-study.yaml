- record_id: ARENA-DLV-41802
  source_title: Role of Decentralised Control for Managing Network Constraints for
    DER
  publish_date: 2020-08
  project_name: Dynamic Limits DDL Control Scheme Feasibility Study
  what_happened: Analysis of AS4777.2 default Volt-Watt and Volt-Var response voltage
    thresholds (V3 = 250V, V4 = 265V) found that these default set points are far
    above the voltages at which DER hosting capacity constraints actually occur on
    Australian networks, where average supply voltages already sit in the upper allowable
    range (240–250V).
  lesson_learnt: The default AS4777.2 PQ Response Mode set points must be actively
    reconfigured by DNSPs to lower activation voltages — leaving default settings
    means the modes activate only after allowable voltage ranges are already significantly
    exceeded, providing negligible constraint relief. For PQ Response Modes to be
    useful, average supply voltages must also be reduced closer to 230V nominal.
  issue_severity: major
  project_type: network/grid
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: commissioning/integration
  proponent_type: network business
