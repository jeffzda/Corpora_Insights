  publish_date: 2020-08
  project_name: Dynamic Limits DDL Control Scheme Feasibility Study
  what_happened: Stakeholder consultation identified that current DNSP revenue models
    provide only very limited financial incentives (e.g. the Demand Management Incentive
    Scheme) for improving DER hosting capacity and deferring network augmentation.
    Deferring network upgrades through dynamic DER management reduces revenues linked
    to asset values under current regulatory arrangements.
  lesson_learnt: DNSP regulatory revenue models that link revenue to asset value actively
    disincentivise dynamic DER management schemes that defer network augmentation.
    Policy makers and project developers proposing DER hosting capacity solutions
    should engage with regulatory reform of DNSP revenue models alongside technical
    implementation — without revenue model reform, financial incentives for DNSPs
    to deploy dynamic management schemes remain weak.
