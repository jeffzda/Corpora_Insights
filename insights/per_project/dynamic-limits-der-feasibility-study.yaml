- record_id: ARENA-DLV-41812
  source_title: Role of Decentralised Control for Managing Network Constraints for
    DER
  publish_date: 2020-08
  project_name: Dynamic Limits DDL Control Scheme Feasibility Study
  what_happened: Stakeholder consultation identified significant cybersecurity concerns
    about deploying IoT-based DER control schemes on electricity distribution networks,
    including risks from DDoS attacks, interception of over-the-air updates, and unauthorised
    device access. Consumer-grade IoT implementations were noted as having a poor
    cybersecurity reputation.
  lesson_learnt: DER control schemes using networked edge controllers must be implemented
    on industrial-grade IIoT platforms, not consumer-grade IoT infrastructure — the
    cybersecurity requirements of grid-connected control systems are fundamentally
    different. Conduct a critical assessment of IIoT platform cybersecurity provisions
    before selecting a platform, and require that cyber security measures are fully
    specified and reviewed prior to implementation, not retrofitted.
