- record_id: ARENA-DLV-41806
  source_title: Role of Decentralised Control for Managing Network Constraints for
    DER
  publish_date: 2020-08
  project_name: Dynamic Limits DDL Control Scheme Feasibility Study
  what_happened: Site-specific modelling of the Walgett Pilliga 22kV feeder found
    that a DNSP-imposed 3% Voltage Change Limit rule for DER installations restricted
    a hypothetical large DER site to 1.01MW, despite the feeder being able to accommodate
    between 1.2MW and 2.25MW under dynamic curtailment control — a 123% capacity increase
    over the rule-based limit.
  lesson_learnt: The 3% voltage change rule, while addressing a legitimate power quality
    concern, can limit DER capacity to sizes that do not require curtailment at all
    under a dynamic limits regime, removing all value from dynamic control schemes
    at affected sites. The rule should be reassessed for low-penetration networks
    and sites where fast local DER controllers can maintain exports within the 3%
    limit through combined load control and generator curtailment.
