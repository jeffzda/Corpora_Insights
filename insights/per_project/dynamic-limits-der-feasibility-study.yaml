  publish_date: 2020-08
  project_name: Dynamic Limits DDL Control Scheme Feasibility Study
  what_happened: Stakeholder consultation revealed that DNSPs have limited resources
    for monitoring and inspecting physical DER installations for compliance, with
    the high volume of smaller installations typically audited only across a small
    sample. Accessing inverter configuration settings requires the original installing
    electrician to be present, making systematic compliance checking impractical.
  lesson_learnt: Any scheme implementing dynamic operating envelopes for DER must
    include automated, remote compliance monitoring from the outset — resource-constrained
    DNSPs cannot rely on physical audits to enforce configuration requirements at
    scale. Build compliance verification into the scheme architecture (e.g. via intelligent
    edge controllers that continuously report operating behaviour) rather than treating
    it as an add-on.
