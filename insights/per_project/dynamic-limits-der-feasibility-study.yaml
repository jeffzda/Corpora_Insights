- record_id: ARENA-DLV-41809
  source_title: Role of Decentralised Control for Managing Network Constraints for
    DER
  publish_date: 2020-08
  project_name: Dynamic Limits DDL Control Scheme Feasibility Study
  what_happened: Stakeholder consultation identified that rural and remote network
    customers in areas without 3G/4G coverage would be excluded from DER control schemes
    requiring continuous communications. The DDL Control Scheme specifically encountered
    this 'last mile' problem when assessing deployment to Essential Energy's rural
    and remote network footprint.
  lesson_learnt: DER control schemes targeting rural and remote networks must be designed
    to operate autonomously when communications are unavailable or intermittent —
    schemes requiring continuous connectivity to a central platform will fail to serve
    the customers in the most constrained parts of rural networks. Evaluate 'last
    mile' communications options (e.g. LoRa) early and ensure the chosen solution
    also serves other DNSP data needs to justify the investment.
