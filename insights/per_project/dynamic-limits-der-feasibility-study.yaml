- record_id: ARENA-DLV-41816
  source_title: Role of Decentralised Control for Managing Network Constraints for
    DER
  publish_date: 2020-08
  project_name: Dynamic Limits DDL Control Scheme Feasibility Study
  what_happened: Feasibility analysis and stakeholder consultation found that the
    use of state estimation and constraint engine approaches to determine network
    operating envelopes creates vendor lock-in because only the vendor understands
    the estimation methodology, and the technique cannot be independently verified
    without direct measurement — which if available would make the estimation redundant.
  lesson_learnt: When procuring DER management platforms for rural and remote networks,
    prefer approaches based on direct measurement of constraint locations over state
    estimation or model-based constraint engines — estimation techniques are not transparent,
    create vendor dependency, and cannot be verified without the measurement infrastructure
    that would make them unnecessary. Prioritise verifiable, open-specification control
    architectures.
