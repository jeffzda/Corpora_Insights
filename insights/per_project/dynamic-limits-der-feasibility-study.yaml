- record_id: ARENA-DLV-41803
  source_title: Role of Decentralised Control for Managing Network Constraints for
    DER
  publish_date: 2020-08
  project_name: Dynamic Limits DDL Control Scheme Feasibility Study
  what_happened: Network analysis found that many Australian customers are supplied
    at average voltages of 240–250V — well above the 230V nominal — reducing available
    voltage headroom for DER exports to as little as 3V before the upper 253V limit
    is reached. DNSPs are not obliged to intervene unless voltages exceed 253V, meaning
    the problem is systemic and unaddressed.
  lesson_learnt: Before deploying dynamic DER control schemes, DNSPs should reduce
    average supply voltages to closer to 230V nominal through transformer tap setting
    adjustments and voltage regulator reprogramming. High average supply voltages
    are the primary limiting factor on DER hosting capacity on LV networks and reduce
    or eliminate the benefit of any dynamic limits platform.
  issue_severity: major
  project_type: network/grid
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: Report recommends DNSPs adopt +6% (244V) rather than +10% (253V)
    as the network investment trigger for reducing average supply voltages, and implement
    or revise tapping zone schemes targeting 230V nominal for the majority of customers.
  transferability: broad
  delay_magnitude: null
  technology_domain: grid/system stability
  source_pages: &id003
  - 23
  - 24
  - 94
  evidence_excerpt: A customer who receives an average supply voltage around 250V
    would have only 3V of headroom in export before their DER installation becomes
    voltage constrained, but the DNSP would not be obliged to change anything to improve
    that. A site like this would have minimal opportunity to export.
