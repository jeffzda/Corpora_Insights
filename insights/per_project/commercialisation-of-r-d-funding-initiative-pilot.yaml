  what_happened: The $100k maximum grant and one-year project length were found to
    be too restrictive — successful recipients reported that larger grants would have
    enabled increased field testing, customer testing, software development, and FTE
    commitments; and several projects required extensions due to the short timeframe.
  lesson_learnt: For R&D commercialisation grants at the prototype stage, increase
