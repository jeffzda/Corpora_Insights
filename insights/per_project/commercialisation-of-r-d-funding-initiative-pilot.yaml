  project_name: Commercialisation of R&D Funding Initiative Pilot
  what_happened: After project completion, successfully developed prototypes faced
    a funding gap — they were not yet at a stage to attract private investment or
    qualify for ARENA's Advancing Renewables Program, leaving no clear pathway to
    scale-up and commercial deployment.
  lesson_learnt: Design R&D commercialisation grant programs with a defined follow-on
    pathway — either include stage-gated funds for scale-up within the original grant,
    or provide structured follow-on support (e.g., networking events, invitation to
    A-Lab) to prevent successfully prototyped technologies from stalling at the valley
    of death.
