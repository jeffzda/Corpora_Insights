  publish_date: 2020-07
  project_name: Commercialisation of R&D Funding Initiative Pilot
  what_happened: The majority of project costs across all five funded projects were
    salary expenditure, and recipients identified salary commitment and FTE availability
    as the biggest hurdle — few senior researchers were willing to step back from
    their regular academic roles to commit to commercialisation activities.
  lesson_learnt: Structure early-stage R&D commercialisation funding as a fellowship
    scheme targeting post-doctoral or early career researchers, rather than as project
    grants, to better align with academic sector incentives and reduce the friction
    of committing senior personnel time.
