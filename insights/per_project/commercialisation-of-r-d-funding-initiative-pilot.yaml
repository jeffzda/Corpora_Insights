  source_title: Commercialisation of R&D Funding Initiative Pilot Initial Evaluation
  publish_date: 2020-07
  project_name: Commercialisation of R&D Funding Initiative Pilot
  what_happened: The total ARENA resources required to run the Initiative were much
    higher than those typically used to run R&D funding rounds when measured as a
    ratio to total grants awarded — $514,682 in grants required 0.1 Analyst FTE, 0.2
    Manager FTE, 0.1 Director FTE plus $11,000 in facilitation costs.
  lesson_learnt: When designing a new grant program at this stage of development,
    account for the disproportionate administrative overhead relative to grant quantum
    — future rounds should increase the expected grant request per project (to ~$200k)
    to improve the resource-to-grant ratio and overall efficiency.
