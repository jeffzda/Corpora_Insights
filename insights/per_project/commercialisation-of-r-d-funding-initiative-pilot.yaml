- record_id: ARENA-DLV-66967
  source_title: Commercialisation of R&D Funding Initiative Pilot Initial Evaluation
  publish_date: 2020-07
  project_name: Commercialisation of R&D Funding Initiative Pilot
  what_happened: The commercialisation of renewable energy R&D remained under-supported
    by national government programs — no other program filled the translation gap
    between R&D and commercial development, and commercial investment was absent at
    this stage — creating a structural market failure that ARENA's initiative partially
    addressed.
