  publish_date: 2021-09
  project_name: Heterocontact-Polysilicon Hybrid IBC Solar Cell (2020/RND013)
  what_happened: A heavy phosphorus gettering layer was implemented during cell fabrication
    to address the risk of bulk lifetime degradation from metal impurities within
    the silicon bulk.
  lesson_learnt: Incorporate a heavy phosphorus gettering step in the IBC cell fabrication
    process to maintain bulk carrier lifetime by removing metal impurities — this
    is a process design decision with direct impact on cell electrical performance.
