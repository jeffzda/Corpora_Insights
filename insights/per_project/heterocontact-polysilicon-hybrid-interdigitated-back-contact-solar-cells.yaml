  evidence_excerpt: The series resistance (Rseries) of the cell as measured using
    the double-light method is 5.1 Ωcm², which is a key factor in the measured final
    fill factor and overall efficiency of the prototype cells... This is higher [than]
    industrial standards, and is likely due to the slow pace at which the device progress
    through the fabrication sequences which takes weeks rather than in a span of hours
    in an industrial setting. The amount of time elapsed between processing allows
    degradation of films due to oxidation and humidity.
  confidence_note: project_type classified as manufacturing/supply chain because the
