  publish_date: 2024-03
  project_name: Heterocontact-Polysilicon Hybrid IBC Solar Cell (2020/RND013)
  what_happened: The project successfully developed and demonstrated a MoOx/n+ poly-Si
    recombination junction contact stack achieving contact resistivity below 1 mΩcm²
    and implied-VOC of approximately 720 mV, validating the core materials science
    hypothesis of the Hybrid IBC cell concept at the component level even though full-cell
    efficiency was limited by fabrication process constraints.
  lesson_learnt: In novel cell architecture R&D projects, structuring the programme
    so that individual contact stacks and sub-cells are characterised and validated
    independently before full cell integration provides reliable evidence of technology
    potential even when full-cell results are degraded by fabrication process immaturity
    — this allows differentiation between material limits and process limits.
