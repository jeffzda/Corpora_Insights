- record_id: ARENA-DLV-0151
  source_title: Public Dissemination Report - Heterocontact-Polysilicon Hybrid IBC
    Solar Cell
  publish_date: 2024-03
  project_name: Heterocontact-Polysilicon Hybrid IBC Solar Cell (2020/RND013)
  what_happened: The prototype Hybrid IBC cell achieved a measured efficiency of 14.04%,
    substantially below the 18.48% pseudo-efficiency (which excludes series resistance
    losses) and well below the simulated potential of 25%. The primary cause was high
    series resistance exceeding 5 Ωcm², attributed to film degradation from oxidation
    and humidity during the slow laboratory fabrication sequence that took weeks rather
    than hours.
  lesson_learnt: When fabricating prototype cells in a laboratory setting, allow for
    significant efficiency gap between contact-test results and full-cell results
    caused by inter-step oxidation and film degradation — either compress the fabrication
    timeline or implement inert storage between steps. Report pseudo-efficiency alongside
    measured efficiency to clearly communicate the recoverable portion of the gap.
  issue_severity: major
  project_type: manufacturing/supply chain
  project_scale_band: lab/bench
  lifecycle_phase: commissioning/integration
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: execution & logistics
  intervention_note: The team used pseudo-FF and pseudo-efficiency analysis to quantify
    the resistive loss component, confirming 18.48% was achievable once series resistance
    is eliminated, and mapped a roadmap of incremental improvements to reach 25%.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
