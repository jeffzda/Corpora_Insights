  publish_date: 2024-03
  project_name: Heterocontact-Polysilicon Hybrid IBC Solar Cell (2020/RND013)
  what_happened: The thermal evaporation process used to deposit metal-oxide (MoOx)
    layers at laboratory scale delivered high consistency and accuracy but is low-throughput
    and high-cost, making it impractical for industrial-scale production. No industrial-compatible
    deposition process for MoOx was demonstrated within the project scope.
  lesson_learnt: Solar cell R&D projects incorporating novel metal-oxide contact layers
    should include a parallel workstream to validate a high-throughput deposition
    method (e.g. ALD or sputtering) alongside the laboratory process — otherwise the
    project concludes with a proven material but an unvalidated manufacturing route,
    requiring a separate follow-on project before commercialisation can proceed.
