- record_id: ARENA-DLV-0152
  source_title: Public Dissemination Report - Heterocontact-Polysilicon Hybrid IBC
    Solar Cell
  publish_date: 2024-03
  project_name: Heterocontact-Polysilicon Hybrid IBC Solar Cell (2020/RND013)
  what_happened: Polysilicon patterning was identified as the single largest unresolved
    barrier to industrialisation of the Hybrid IBC cell design. Photolithography used
    in the laboratory prototype is economically impractical at scale, and alternative
    approaches (selective ink-jet doping/etching, laser doping/ablation) remain under
    development and have not yet been demonstrated for doped polysilicon structures.
  lesson_learnt: For R&D projects developing novel cell architectures that rely on
    polysilicon patterning, do not defer industrialisation pathway assessment for
    patterning to post-prototype — the absence of a cost-effective patterning solution
    at project completion is the primary commercial viability risk and should be scoped
    as a parallel workstream from project inception.
