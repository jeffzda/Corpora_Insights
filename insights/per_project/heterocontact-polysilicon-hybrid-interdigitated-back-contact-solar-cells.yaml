  evidence_excerpt: While polysilicon patterning is feasible in laboratory settings
    and for prototype cell development, employing photolithography and etching for
    this purpose is considered economically impractical for large-scale production...
    The largest unknown cost of the final cell fabrication process will therefore
    depend heavily on the polysilicon patterning process which is currently yet to
    be determined, and is likely the biggest factor in the commercial viability of
