- record_id: ARENA-DLV-0154
  source_title: Public Dissemination Report - Heterocontact-Polysilicon Hybrid IBC
    Solar Cell
  publish_date: 2024-03
  project_name: Heterocontact-Polysilicon Hybrid IBC Solar Cell (2020/RND013)
  what_happened: Prototype cells exhibited significant non-ideal recombination attributable
    to imprecise alignment in the patterning process and poorly managed doping profiles
    at the boundaries of the doped polysilicon layer. This was identified as a discrete
    loss mechanism contributing approximately 2.53 percentage points of efficiency
    gap between the prototype and the simulated optimum.
  lesson_learnt: IBC cell prototypes using polysilicon patterning should include dedicated
    test structures to characterise junction boundary recombination before full cell
    fabrication — patterning alignment errors and boundary doping profiles are difficult
    to detect at the cell level and can account for multi-percentage-point efficiency
    penalties that are misattributed to other loss mechanisms.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: lab/bench
  lifecycle_phase: commissioning/integration
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: data & measurement
  intervention_note: The roadmap identifies resolving non-ideal recombination through
    optimised patterning alignment and controlled doping profiles at polysilicon boundaries
    as the second-largest efficiency improvement step after series resistance reduction.
  transferability: narrow
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id004
  - 13
  evidence_excerpt: 'Resolved non-ideal recombination: The prototype cells demonstrated
    significant level of non-ideal recombination. Addressing this involves optimising
    the patterning process, particularly ensuring accurate alignment, and managing
    the doping profiles and junction depths along the boundaries of the doped polysilicon
    layer. Resolving non-ideal recombination will add another 2.53% to the cell efficiency.'
  confidence_note: null
