  what_happened: The project identified that progression of the Hybrid IBC technology
    from laboratory prototype to pilot scale requires long-term stability testing,
    accelerated aging tests, and field trials that were outside the scope of the current
    project, and that this progression depends on strong industry partnership and
    industry funding not yet secured.
