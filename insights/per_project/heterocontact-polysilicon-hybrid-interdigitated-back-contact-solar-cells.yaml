  publish_date: 2024-03
  project_name: Heterocontact-Polysilicon Hybrid IBC Solar Cell (2020/RND013)
  what_happened: The prototype cells had low shunt resistance, causing fill-factor
    losses and overall power reduction in the device. This was linked to inadequate
    contact isolation and misalignment of dielectric layers, contributing approximately
    0.88 percentage points of efficiency loss.
  lesson_learnt: In laboratory IBC cell fabrication using shadow-mask metallisation,
    invest in alignment verification tooling and characterise shunt resistance on
    test structures before full cell metallisation — low shunt resistance from misalignment
    is a fabrication quality issue that is costly to diagnose after the full cell
    is completed.
