- record_id: ARENA-DLV-12902
  source_title: Heterocontact-Polysilicon Hybrid IBC Solar Cell Lessons Learnt
  publish_date: 2021-09
  project_name: Heterocontact-Polysilicon Hybrid IBC Solar Cell (2020/RND013)
  what_happened: During thermal metal evaporation, bowing of the shadow mask degraded
    the resolution of evaporated metal and MoOx features, requiring a physical fix
    to achieve acceptable fabrication quality.
  lesson_learnt: Attach front and rear magnets between the shadow mask and silicon
    solar cell during thermal metal evaporation to prevent shadow mask bowing — this
    directly improves the resolution of evaporated metal and MoOx features and is
    a simple, low-cost process improvement for IBC cell fabrication using shadow masks.
  issue_severity: minor
