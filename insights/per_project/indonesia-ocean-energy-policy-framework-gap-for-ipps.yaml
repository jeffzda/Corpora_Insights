- record_id: ARENA-DLV-50022
  source_title: Ocean Energy Report by Seanergy and Ernst and Young
  publish_date: 2016-06
  project_name: Indonesia Ocean Energy — Policy Framework Gap for IPPs
  what_happened: In Indonesia, despite having one of the world's largest ocean energy
    potentials, the government had not designed a feed-in tariff to incentivise independent
    power producers (IPPs) to develop bankable ocean energy projects with a fair return
    on investment, while fossil fuel prices remained highly subsidised (oil subsidies
    representing 15% of the national budget).
  lesson_learnt: In markets where fossil fuels are heavily subsidised and no feed-in
    tariff exists for ocean energy IPPs, project developers cannot create bankable
    business cases regardless of the quality of the resource; market entry strategy
    should include advocacy for policy reform or should wait until a viable tariff
    mechanism is in place.
