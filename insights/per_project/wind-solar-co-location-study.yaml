  source_title: Wind-Solar Co-Location Study
  publish_date: 2016-03
  project_name: Wind-Solar Co-Location Study
  what_happened: 'The study identified curtailment risk as a key development challenge
    for co-location: the network connection agreement''s transfer capacity cap can
    force curtailment of solar (or wind) generation when both assets generate simultaneously,
    and the relationship between solar farm size and curtailment is non-linear and
    site-specific.'
  lesson_learnt: Conduct a site-specific curtailment analysis using concurrent historical
    wind generation and modelled solar generation data before finalising solar farm
    sizing — the curtailment-to-capacity relationship is non-linear and varies significantly
    by site, so generic rules of thumb will not reliably optimise sizing.
