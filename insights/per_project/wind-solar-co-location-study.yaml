  source_title: Wind-Solar Co-Location Study
  publish_date: 2016-03
  project_name: Wind-Solar Co-Location Study
  what_happened: The study found that co-location projects may benefit from a staged
    development approach — first constructing the wind farm under the LRET scheme,
    then adding solar later — because large-scale wind was more commercially viable
    than solar in 2016, and developers could preserve the option for future solar
    addition without committing capital upfront.
  lesson_learnt: Design wind farm substations and grid connection agreements with
    future solar co-location in mind — even if solar is not commercially viable at
    initial financial close, reserving electrical capacity and land for a future solar
    stage avoids costly retrofitting and preserves optionality as solar costs decline.
