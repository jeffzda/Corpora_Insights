  source_title: Wind-Solar Co-Location Study
  publish_date: 2016-03
  project_name: Wind-Solar Co-Location Study
  what_happened: The study found that pairing wind and solar generation in regions
    dominated by a single technology (e.g. wind-heavy South Australia) creates a 'firming
    effect' — reducing intermittency at the connection point, improving capacity factor,
    and potentially mitigating network constraints.
  lesson_learnt: Co-located wind-solar projects in single-technology-dominated grid
    regions offer a firming benefit that can improve PPA terms and reduce volume risk
    — developers should explicitly quantify and market this firming value in offtake
    negotiations as a differentiator from standalone renewable projects.
