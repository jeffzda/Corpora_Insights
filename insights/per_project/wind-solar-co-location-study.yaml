  what_happened: 'The existing grid connection agreement at a wind farm was identified
    as a key enabler for brownfield co-location: understanding the connection capacity
    limits allows appropriate solar sizing, and amendments to existing agreements
    are often minor, delivering significant cost and schedule advantage over a new
    standalone connection.'
  lesson_learnt: Before sizing a co-located solar farm, obtain the exact grid connection
    agreement capacity and any technical headroom data from the wind farm operator
    — the connection agreement defines the binding curtailment constraint and determines
    the maximum solar size achievable without a new or substantially amended connection.
