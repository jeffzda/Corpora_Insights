  source_title: Wind-Solar Co-Location Study
  publish_date: 2016-03
  project_name: Wind-Solar Co-Location Study
  what_happened: Wind farms in Victoria (Waubra, Oaklands Hill) appeared to support
    larger relative solar co-location sizes (38% and 48% of wind capacity) not because
    of beneficial anti-correlation but because of low existing capacity factors and/or
    poor solar resource — factors that reduce curtailment without improving revenue.
  lesson_warnt: Do not interpret high allowable solar penetration at a wind farm as
    evidence of a good co-location opportunity — always assess solar resource quality
    and wind farm capacity factor independently, as high allowable penetration may
    simply reflect a low-performing wind asset or poor solar resource reducing curtailment
    mechanically.
  lesson_learnt: Do not interpret high allowable solar penetration at a wind farm
    as evidence of a good co-location opportunity — always assess solar resource quality
    and wind farm capacity factor independently, as high allowable penetration may
    simply reflect a low-performing wind asset or poor solar resource reducing curtailment
    mechanically.
