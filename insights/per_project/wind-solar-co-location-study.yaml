  what_happened: Western Australian wind farms (Emu Downs, Alinta, Collgar) demonstrated
    notably lower average daytime generation than eastern-state wind farms, providing
    substantially more headroom for co-located solar and yielding higher combined
    revenue indices due to superior solar resource and higher wholesale market prices.
