  what_happened: Many of the best-identified greenfield co-location sites across Australia
    are remote from the transmission network or are connected to weak parts of the
    network, limiting their near-term commercial viability despite strong combined
    wind-solar resources.
  lesson_learnt: Network proximity is a binding constraint for greenfield wind-solar
    co-location; developers and policy makers should assess transmission access before
    committing to greenfield site selection, and NSPs and government should consider
    targeted network investment to unlock high-resource regions.
