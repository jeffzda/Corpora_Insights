  project_name: Wind-Solar Co-Location Study
  what_happened: The study's financial ranking of existing wind farm co-location sites
    was heavily influenced by state-based wholesale electricity spot prices, which
    are inherently volatile — results from a 12-month window ending August 2015 drove
    WA's top-ranked status, yet this price advantage could reverse with market changes.
  lesson_learnt: Do not base co-location investment decisions solely on short-period
    historical spot prices — use long-run price projections or contracted PPA rates,
    and conduct sensitivity analysis on wholesale price assumptions, as market price
    volatility can reverse the ranking of states and sites over a project's life.
