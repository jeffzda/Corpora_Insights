    generation profiles, illustrating that site-specific wind characteristics rather
    than regional averages drive co-location curtailment outcomes.
  lesson_learnt: Use site-specific historical generation data rather than regional
    wind profiles when modelling curtailment for a co-location project — proximate
    wind farms can have substantially different diurnal profiles due to local Weibull
    characteristics and turbulence, leading to materially different optimal solar
    sizing outcomes.
