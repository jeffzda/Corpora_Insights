  what_happened: The study found that wind turbines are typically sited on ridge lines
    at higher elevations while optimal solar sites require flatter, cleared land at
    lower elevations — often with competing agricultural uses — creating a land-use
    conflict that limits the directly usable co-location area at many existing wind
    farm sites.
  lesson_learnt: Conduct a detailed GIS land suitability assessment at an early stage
    of brownfield co-location feasibility — the footprint of viable solar land within
    a wind farm lease may be substantially smaller than the total lease area due to
    terrain constraints, and a dispersed or constrained solar site reduces constructability
    and raises civil costs.
