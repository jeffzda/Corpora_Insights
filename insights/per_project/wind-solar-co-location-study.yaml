    ranking was taken from a single year's published values and would change as the
    power system evolves — particularly as a new large generation facility at a node
    would reduce the observed MLF, reducing revenue relative to the initial assessment.
  lesson_learnt: When modelling co-location revenue, apply forward-looking MLF sensitivity
    analysis rather than using current published values — the addition of substantial
    generation capacity near a node typically reduces the MLF, and a project sized
    on current MLF may underperform revenue forecasts once operating.
