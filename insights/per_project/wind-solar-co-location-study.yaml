- record_id: ARENA-DLV-52951
  source_title: Wind-Solar Co-Location Study
  publish_date: 2016-03
  project_name: Wind-Solar Co-Location Study
  what_happened: Analysis of 10 existing Australian wind farms found that solar farms
    sized between 25% and 49% of each wind farm's capacity would result in no more
    than 5% curtailment of solar output, with 414 MW of solar technically co-locatable
    across the 10 sites.
  lesson_learnt: When sizing a co-located solar farm at an existing wind farm, target
    a solar-to-wind capacity ratio of 25–49% to stay within 5% curtailment — this
    threshold is broadly achievable across diverse Australian geographies while preserving
    the LCOE savings from co-location (estimated at 3–13% CAPEX).
