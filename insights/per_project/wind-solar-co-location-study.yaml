- record_id: ARENA-DLV-52952
  source_title: Wind-Solar Co-Location Study
  publish_date: 2016-03
  project_name: Wind-Solar Co-Location Study
  what_happened: Grid connection infrastructure sharing was identified as the single
    largest source of CAPEX savings in wind-solar co-location, with AECOM estimating
    total CAPEX savings of 3–13% and OPEX savings of 3–16% for a co-located solar
    farm relative to a standalone solar farm connected to a pre-existing substation.
  lesson_learnt: Co-locating solar at an existing wind farm delivers material cost
    reductions — primarily through shared grid connection infrastructure — that improve
    project competitiveness; developers should quantify these savings early in feasibility
    to correctly frame the business case.
