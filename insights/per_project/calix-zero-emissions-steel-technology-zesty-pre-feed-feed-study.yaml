  what_happened: The reactor tube installation strategy for the demonstration plant
    remained undecided at FEED completion, with two options (single prefabricated
    tube delivered to site vs. sectional tube welded at ground level) requiring a
    transport feasibility evaluation dependent on road access, transport envelope,
    and local regulations at the final site.
  lesson_learnt: For tall-tower industrial plants with large prefabricated components,
    conduct the transport feasibility and road access evaluation early in detailed
    design — the outcome directly determines construction methodology and cost, and
    is site-specific; deferring this decision beyond site confirmation can delay procurement
    of long-lead structural items.
