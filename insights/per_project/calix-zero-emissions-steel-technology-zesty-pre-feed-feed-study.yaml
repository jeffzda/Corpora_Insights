  what_happened: Reducing the H2 stoichiometric ratio from 2:1 to 1.5:1 positively
    impacted material recovery without reducing the reduction degree, but a further
    reduction to 1.2:1 resulted in a materially diminished reduction degree.
  lesson_learnt: A H2 stoichiometric ratio of 1.5:1 represents a more efficient operating
    point than 2:1 for goethite/hematite ores in the ZESTY pilot reactor — this finding
    should inform hydrogen consumption assumptions in the FEED study and techno-economic
    modelling, where hydrogen cost is the dominant operating cost driver.
