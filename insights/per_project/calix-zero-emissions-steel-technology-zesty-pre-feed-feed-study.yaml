  publish_date: 2023-11
  project_name: ZESTY (Zero Emissions Steel Technology) ARENA Project
  what_happened: 'A strong inverse correlation was identified between reduction degree
    and material recovery as a function of particle size distribution (PSD): finer
    feed materials achieved higher reduction degrees but lower collection efficiency
    due to elutriation of ultrafine particles below 100 µm at high gas velocities.'
  lesson_learnt: Particle size distribution is a fundamental design parameter with
    a direct trade-off between reduction efficiency and material recovery — process
    design must explicitly optimise the PSD specification to balance these competing
    outcomes, particularly for ores with high fine fractions.
