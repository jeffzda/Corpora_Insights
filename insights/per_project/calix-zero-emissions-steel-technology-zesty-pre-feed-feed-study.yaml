  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Ongoing R&D was directed specifically at developing a direct
    reduction process that eliminates the pre-oxidation stage to reduce both capital
    and operating costs; this was identified as a priority workstream for the FEED
    study.
  transferability: moderate
