  evidence_excerpt: The materials recovery from previous campaign was consistently
    low due to the entrainment of fine particles in the off-gas. Figure 1 addresses
    this, a cyclone and baghouse were installed at the exhaust outlet to separate
    and return the elutriated particles to the process for improved materials recovery...
    the material recovery results for the HG57 ore from earlier campaign and recent
    results with the G0109 ore... provide an early indication of the positive effect
    of the cyclone and baghouse modification whereby the materials recovery efficiency
    increase from 38 % to 51%.
