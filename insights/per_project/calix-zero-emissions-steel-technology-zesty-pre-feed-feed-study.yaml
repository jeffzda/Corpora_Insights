  source_title: Calix Zesty Tech - Zero Emissions Iron and Steel - Pre-Feed Report
    Demo
  publish_date: 2023-09
  project_name: Calix ZESTY Zero Emissions Iron and Steel Demonstration Plant
  what_happened: The magnetite ore flowsheet requires a pre-oxidation stage (converting
    magnetite to haematite before hydrogen reduction) that the haematite/goethite
    flowsheet does not, adding a second reactor, additional electric furnace, hot
    pan conveyor, and associated equipment — materially increasing capital cost and
    plant footprint relative to a single-ore design.
  lesson_learnt: When designing hydrogen direct reduction plants to process magnetite
    feedstocks, budget for a pre-oxidation stage and associated second reactor train
    unless pilot testing can confirm a direct reduction pathway — the additional capital
    and operating cost of pre-oxidation is significant and should be included in early
    cost estimates to avoid budget surprises during FEED.
