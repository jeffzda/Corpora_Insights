  what_happened: Site selection for the 30,000 TPA ZESTY demonstration plant had not
    been finalised at the time of the KS5 report, with further commercial negotiations
    required. The technical and techno-economic analysis identified South Australia
    (particularly Port Augusta) as the preferred location due to access to renewable
    energy, proximity to iron ore, and existing infrastructure.
  lesson_learnt: When site selection remains unresolved at FEED stage, designing to
    the most demanding site conditions (e.g. Pilbara cyclone and temperature conditions)
    and maintaining a generic, flexible design prevents the FEED from being invalidated
    by a site change — but adds cost conservatism that should be explicitly acknowledged
    in the cost estimate.
