  publish_date: '2024-04-30'
  project_name: Calix ZESTY (Zero Emissions Steel Technology) Demonstration Plant
  what_happened: Green hydrogen prices not falling to economically viable levels (~AUD$3/kg
    target vs. AUD$5.5–$6.2/kg modelled) was identified as a key risk applicable to
    all hydrogen-based reduction technologies, not just ZESTY. The project's techno-economic
    viability depends on hydrogen price reductions over the demonstration plant lifetime.
  lesson_learnt: Hydrogen direct reduction projects must explicitly model sensitivity
    to hydrogen price trajectories and document the price threshold below which the
    project becomes commercially competitive — at AUD$5.5–$6.2/kg the ZESTY process
    is close to competitive with conventional HBI, but viability for mainstream adoption
    requires prices approaching AUD$3/kg, which should be presented as a milestone
    in the investment case.
