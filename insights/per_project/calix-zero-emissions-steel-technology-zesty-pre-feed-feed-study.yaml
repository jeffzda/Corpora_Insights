- record_id: ARENA-DLV-1955
  source_title: Calix Zesty Tech 'Zero Emissions Iron and Steel - KS5 Pilot Plant
    Study Report
  publish_date: 2023-11
  project_name: ZESTY (Zero Emissions Steel Technology) ARENA Project
  what_happened: Fine particles captured in the baghouse and cyclone showed significantly
    lower reduction degrees (26–37 mol%) compared to the bulk product sample (89 mol%),
    indicating early elutriation and shortened residence time for the finest fractions.
    These particles also had higher specific surface area, confirming they did not
    sinter.
  lesson_learnt: Installation of cyclone and baghouse systems alone is insufficient
    to resolve elutriation losses at higher throughput — fine-tuning of gas flow rates
    and milling/crushing processes is required to further improve material recovery,
    and this trade-off between throughput and collection efficiency must be characterised
    before scaling up.
