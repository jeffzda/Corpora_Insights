  project_name: ZESTY (Zero Emissions Steel Technology) ARENA Project
  what_happened: Analysis found that generating hydrogen at the renewable energy source
    is more cost-effective than transmitting electricity to a site and producing hydrogen
    there. Hydrogen pipelines were found to be up to three times more cost-effective
    than powerlines for similar distances, and consuming energy before transport and
    storage can reduce hydrogen prices for consumers by around 30%.
  lesson_learnt: For green hydrogen industrial projects, co-locating electrolysis
    with the renewable energy source — rather than transmitting electricity — is strongly
    preferred from a cost perspective; where existing electricity infrastructure must
    be used, a Power Purchase Agreement with explicit accounting for transmission
    charges (estimated at $15–25/MWh) is recommended.
