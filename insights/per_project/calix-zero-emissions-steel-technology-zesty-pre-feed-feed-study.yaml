  what_happened: Pilot plant test results at Calix's Bacchus Marsh R&D facility showed
    that material recovery — particularly at higher gas flows and finer particle size
    distributions — was the limiting performance factor, rather than metallisation
    rate. This finding directly influenced mill circuit design selection and process
    condition trade-offs in the FEED.
  lesson_learnt: Pilot plant programs for flash calcination-type processes should
    specifically test material recovery performance across the full range of planned
    gas flows and particle size distributions before FEED — recovery losses at the
    extremes of the operating window can be the binding constraint on equipment sizing
    and process economics, not the primary reaction performance metric.
