  publish_date: '2024-04-30'
  project_name: Calix ZESTY (Zero Emissions Steel Technology) Demonstration Plant
  what_happened: The demonstration plant was deliberately designed for broad ore-type
    flexibility — capable of receiving, storing, and processing a wide range of ore
    types from multiple Australian and global suppliers — rather than being optimised
    for a single ore type. This design choice increased capital cost but was essential
    to the toll-processing commercial model and the industry-wide qualification purpose
    of the plant.
  lesson_learnt: When a demonstration plant serves an industry-qualification purpose
    (testing multiple partners' feedstocks), design for maximum feedstock flexibility
    from the outset — the incremental capital cost of flexible feed handling and wide
    operating windows is justified by the commercial value of enabling multiple offtake
    and ore supply relationships, and avoids costly retrofits when new ore types are
    introduced.
