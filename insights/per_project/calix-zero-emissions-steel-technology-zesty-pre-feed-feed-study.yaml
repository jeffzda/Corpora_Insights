  project_name: Calix ZESTY (Zero Emissions Steel Technology) Demonstration Plant
  what_happened: The ZESTY demonstration plant FEED study found that the levelised
    cost of HBI (AUD$632–$802/tonne Fe) is competitive with zero-carbon or carbon-adjusted
    iron products (AUD$762–$1,295/tonne) even at small demonstration scale, before
    any carbon price is applied, based on electricity prices of AUD$36–$48/MWh plus
    transmission costs.
  lesson_learnt: Techno-economic feasibility studies for hydrogen-based DRI technologies
    should include a comparison against carbon-adjusted costs of conventional iron
    production, not only against current unabated costs — this framing can demonstrate
    near-term economic competitiveness at demonstration scale even before full cost
    reduction pathways are realised, which is important for securing investment and
    offtake partner interest.
