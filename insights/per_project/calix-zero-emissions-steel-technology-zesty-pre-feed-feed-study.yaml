  what_happened: ZESTY's compatibility with low-grade iron ore fines and ultra-fines
    (processing without pelletisation or sintering) was identified as a key commercial
    differentiator versus incumbent shaft-furnace DRI technologies (MIDREX, HYL, HYBRIT),
    which require high-crush-strength pellet/sinter-grade feedstock incompatible with
    declining Australian ore quality.
  lesson_learnt: Industrial decarbonisation technology selection for Australian iron
    ore processing should explicitly evaluate feedstock compatibility with the declining
    quality of Australian iron ore — technologies requiring pelletisation or sintering
    of fines introduce additional capital cost, energy consumption, and carbon intensity
    that may offset decarbonisation benefits and reduce commercial viability in the
    Australian context.
