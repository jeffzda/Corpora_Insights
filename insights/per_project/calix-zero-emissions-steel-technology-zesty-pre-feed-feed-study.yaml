- record_id: ARENA-DLV-1953
  source_title: Calix Zesty Tech 'Zero Emissions Iron and Steel - KS5 Pilot Plant
    Study Report
  publish_date: 2023-11
  project_name: ZESTY (Zero Emissions Steel Technology) ARENA Project
  what_happened: At 1050°C, product aggregation and fusion were observed in the pilot
    plant, with clumps forming and adhering to the reactor wall. Collection efficiency
    declined at this temperature, theorised to result from material adhering to the
    reactor wall and subsequently detaching as fused clumps.
  lesson_learnt: Operating temperature is a critical parameter with a distinct upper
    limit — temperatures above 1000°C risk product aggregation, wall adhesion, and
    reduced collection efficiency; process design should target 950–1000°C for goethite/hematite
    ores to balance reduction degree and material recovery.
