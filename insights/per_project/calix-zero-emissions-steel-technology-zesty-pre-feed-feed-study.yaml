  what_happened: The FEED study identified that civil works, construction and installation
    is the single largest cost category at 30% of CAPEX (Scenario 1, without electrolyser),
    followed by engineering services at 14% and electrical/instrumentation/control
    at 12%. The process package itself represents only 5% of CAPEX.
  lesson_learnt: For greenfield industrial demonstration plants, balance-of-plant
    costs (civil, construction, electrical, engineering) typically dominate CAPEX
    and collectively represent over half of total project cost — cost reduction efforts
    focused solely on process equipment will have limited impact; construction methodology,
    site selection, and engineering efficiency are the primary CAPEX levers.
