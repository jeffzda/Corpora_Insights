  project_name: Calix ZESTY Zero Emissions Iron and Steel Demonstration Plant
  what_happened: The H-DRI fine powder produced by the ZESTY process exhibits significant
    reactivity upon leaving the reactor, requiring mandatory passivation or carburisation
    before safe handling, storage, or downstream processing — an integration requirement
    that adds post-processing equipment (passivation/carburisation unit, briquetting
    press, or smelter) to the plant scope and cost base.
  lesson_learnt: When designing hydrogen direct reduction processes producing fine
    powder DRI, include passivation or carburisation handling systems as mandatory
    scope items from pre-FEED onwards — the high reactivity of H-DRI fine product
    means post-processing is not optional and its omission from early cost estimates
    will understate total project capital.
