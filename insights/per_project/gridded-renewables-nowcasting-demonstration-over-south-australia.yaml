- record_id: ARENA-DLV-7751
  source_title: Gridded Renewables Nowcasting Demonstration over SA Public Report
  publish_date: '2022-06-30'
  project_name: Gridded Renewables Nowcasting Demonstration over South Australia
  what_happened: Bureau of Meteorology ground-station irradiance data used as truth
    data for cloud detection algorithm development was available with a delay of 6
    months to 2 years behind present time, unlike equivalent US networks which provide
    near-real-time or next-day access. This severely limited the data's use for operational
    validation and iterative model improvement.
  lesson_learnt: When developing satellite-based solar forecasting algorithms for
    Australia, do not rely on BoM pyranometer data for near-real-time validation —
    plan alternative truth-data strategies from the outset, as Australian ground-station
    data lags by 6 months to 2 years.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: data/validation/testing
  failure_mode: data & measurement
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: The team developed a generalised cloud-category algorithm that
    reduced reliance on spatially sparse weather stations for calibration, lowering
    risk of overfitting and poor out-of-sample performance.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id004
