- record_id: ARENA-DLV-7757
  source_title: Gridded Renewables Nowcasting Demonstration over SA Public Report
  publish_date: '2022-06-30'
  project_name: Gridded Renewables Nowcasting Demonstration over South Australia
  what_happened: Installed capacity data for rooftop solar PV systems in the 100kW–30MW
    range showed meaningful variance across the four data sources consulted (SAPN,
    Clean Energy Regulator, Australian PV Institute, AEMO), due to the CER omitting
    this category and differing data update intervals creating lag discrepancies.
    No single authoritative source existed for this system-size range.
  lesson_learnt: DER-focused forecasting projects should not rely on a single installed-capacity
    data source for medium-scale PV systems (100kW–30MW); instead, assemble a composite
    dataset from multiple sources organised by system-size bin, selecting the most
    current and internally consistent source for each bin.
  issue_severity: minor
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: data/validation/testing
  failure_mode: data & measurement
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: The project selected a single best data source for each system-size
    bin based on data age, difference from internal modelling, and accessibility,
    then applied daily updates with a historical trend — producing a robust representative
    dataset.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages:
