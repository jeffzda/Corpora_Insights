  secondary_failure_mode: coordination & stakeholders
  intervention_note: The project attempted post-hoc normalisation of results across
    partners but found residual discrepancies due to differing evaluation periods;
    the lesson was codified as recommendations for future projects.
  transferability: broad
  delay_magnitude: not quantified
