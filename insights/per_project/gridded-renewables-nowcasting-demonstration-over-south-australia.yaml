  project_name: Gridded Renewable Nowcasting Demonstration over South Australia
  what_happened: Bulk analysis of forecast accuracy across all days failed to demonstrate
    the nowcasting system's substantive improvement over existing solutions (e.g.
    ASEFS2), because the system's greatest gains were on significant weather days
    with fast-moving cloud cover — a pattern obscured by aggregate error metrics.
  lesson_learnt: Evaluate forecasting improvements by isolating high-impact weather
    events rather than relying solely on aggregate error scores across all days —
    overall metrics can mask material performance gains on the days that matter most
    for grid operations.
