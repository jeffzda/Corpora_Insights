  what_happened: During the evaluation period, AEMO's intended wind nowcast use-case
    — predicting high-wind speed turbine shutdown events — could not be validated
    because no wind farms approached cut-out wind thresholds during the positive Southern
    Annular Mode weather pattern over the 2021/22 summer, which directed cold fronts
    south of the mainland.
  lesson_learnt: When designing evaluation frameworks for forecast demonstration projects,
    identify high-impact weather events that may not occur in a single season and
    supplement live evaluation with historical case studies covering the target extreme-event
    scenarios to ensure the technology's value in those conditions can be assessed.
