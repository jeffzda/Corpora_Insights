  what_happened: Significant scoping work was required to design a data transfer architecture
    capable of passing operational data feeds from AEMO's internal systems to Solcast
    — data that had not previously been shared externally. The choice of file transfer
    protocol (HTTP vs FTP) had direct flow-on effects for partner system integration.
  lesson_learnt: Before committing to a data transfer protocol for a multi-partner
    data project, engage all partner organisations to understand their existing system
    requirements — particularly when interfacing with AEMO, whose operational systems
    require robustness and may mandate legacy protocols such as FTP.
