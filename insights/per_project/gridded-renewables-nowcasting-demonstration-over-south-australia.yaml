  what_happened: Weather station pyranometer data used for cloud detection validation
    was prone to fouling from dust and snow, requiring additional quality control
    checks that were time-consuming to perform, meaning recent measurement data was
    frequently unavailable for validation. Unlike operational data feeds, there was
    no background fallback source available for this truth data.
  lesson_learnt: When pyranometer data is used as ground truth for algorithm validation,
    prioritise early sourcing of historical data to maximise archive overlap, and
    focus quality control effort on high-importance scenarios first — this maximises
    the value of the limited periods of clean data available.
