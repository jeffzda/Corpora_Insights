    cloud event can obscure all rooftop solar sites within the same 30–60 minute window
    and cause a ramp equivalent to a large coal power plant becoming suddenly unavailable
    for a few hours.
  lesson_learnt: Project developers and grid operators in regions with highly geographically
    concentrated solar portfolios should treat single-cloud-event ramping as a systemic
    grid security risk, not an edge case — localised high-resolution nowcasting is
    necessary, not optional, to maintain supply-demand balance at high renewable penetration.
