- record_id: ARENA-DLV-7752
  source_title: Gridded Renewables Nowcasting Demonstration over SA Public Report
  publish_date: '2022-06-30'
  project_name: Gridded Renewables Nowcasting Demonstration over South Australia
  what_happened: The sparse spatial distribution of Australia's 24 BoM pyranometer
    stations — many no longer operative or with short measurement histories — made
    it impossible to source ground truth data representative of the full range of
    cloud conditions across Australia. The probability of any 10km x 10km area containing
    a measurement site was less than 0.03%, while cloud optical depth can vary substantially
    over 2–5km scales.
  lesson_learnt: Future projects developing solar forecasting systems for large spatial
    areas like Australia should design a generalised algorithm that captures a wide
    range of cloud behaviours rather than calibrating against specific station locations,
    to avoid over-fitting and poor performance at sites without nearby ground stations.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: data/validation/testing
  failure_mode: data & measurement
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Broad cloud categories based on primary forcing mechanisms were
    identified and targeted with a generalised algorithm that performed well across
    all categories, reducing reliance on individual station data.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id005
