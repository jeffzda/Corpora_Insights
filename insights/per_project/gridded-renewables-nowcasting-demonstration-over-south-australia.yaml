- record_id: ARENA-DLV-7755
  source_title: Gridded Renewables Nowcasting Demonstration over SA Public Report
  publish_date: '2022-06-30'
  project_name: Gridded Renewables Nowcasting Demonstration over South Australia
  what_happened: SCADA data from wind farms contained frequent 'stuck' measurements
    — values remaining exactly identical to previous readings for hours or even days.
    The data quality flag supplied with the SCADA feed did not reliably identify all
    spurious measurements. Solar farm irradiance data also exhibited issues including
    incorrect averaging of multiple pyranometers, early-morning shading of tilted
    sensors, and stuck measurements.
  lesson_learnt: Projects ingesting operational SCADA and sensor data should assume
    data quality issues are present across all feeds and build dedicated quality control
    algorithms — including physics-based plausibility checks — with automatic fallback
    to an alternative background data source to ensure continuous system operation.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: technology vendor
  delay_category: data/validation/testing
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: A physics-based quality control algorithm was developed to detect
    spurious measurements (e.g. irradiance cannot exceed zero at night; wind speed
    cannot remain exactly constant), with spurious data replaced by a background data
    feed from an alternative source.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id008
  - 25
  evidence_excerpt: SCADA data from wind farms was found to contain the most occurrences
    of poor data quality. These typically were found in the form of 'stuck' measurements,
    where measurement values would remain exactly identical to previous measurement
    values for periods of hours and even days. This data was supplied with a data
    quality field, but it was found that this tag whilst useful, did not always correctly
    identify spurious measurement data.
