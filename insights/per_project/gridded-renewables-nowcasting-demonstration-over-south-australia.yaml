  source_title: Gridded Renewable Nowcasting Demonstration Lessons Learnt 3
  publish_date: 2021-03
  project_name: Gridded Renewable Nowcasting Demonstration over South Australia
  what_happened: Project partners evaluated forecast performance using inconsistent
    metrics and evaluation periods — AEMO used a MAE approach while Tesla Forecasting
    used RMSE, and evaluation periods differed between partners — making cross-comparison
    of results unreliable and at times contradictory.
  lesson_learnt: Before commencing forecast trials with multiple partners, align all
    partners on a single agreed evaluation metric and a common evaluation period;
    failure to do so produces incomparable results that undermine demonstration credibility
    and delay conclusions.
