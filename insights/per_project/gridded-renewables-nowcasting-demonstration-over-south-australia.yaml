- record_id: ARENA-DLV-7753
  source_title: Gridded Renewables Nowcasting Demonstration over SA Public Report
  publish_date: '2022-06-30'
  project_name: Gridded Renewables Nowcasting Demonstration over South Australia
  what_happened: The project went through multiple database design cycles before selecting
    a final architecture. The first prototype was a fully custom database built from
    scratch; this was abandoned after the wider team identified it would be difficult
    and time-consuming to build and maintain. Multiple managed database solutions
    (Cassandra, Mongo, Timescale, Redshift, Aurora) were then prototyped with real
    data. The total effort in design, prototyping, and testing was roughly equivalent
    to the time taken to build the final solution.
  lesson_learnt: Small software engineering teams should adopt a 'buy before build'
    preference for non-core infrastructure — custom code creates ongoing maintenance
    liabilities; prototype with real data before committing to any solution, and weigh
    managed-solution costs against build time and testing overhead of custom builds.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: internal governance/resourcing
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: execution & logistics
  intervention_note: The project selected Amazon Aurora as its managed database solution
    after stress-testing multiple alternatives with real data, reducing long-term
    maintenance complexity.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: other
  source_pages: &id006
  - 23
  evidence_excerpt: The effort required in design, prototyping, and testing was significant,
    roughly the same time investment as building the final solution... For small software
    engineering teams and organisations, buy before you build should be the preference
