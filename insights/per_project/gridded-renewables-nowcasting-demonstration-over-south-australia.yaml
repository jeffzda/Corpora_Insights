- record_id: ARENA-DLV-8051
  source_title: Gridded Renewable Nowcasting Demonstration Lessons Learnt 2
  publish_date: 2020-09
  project_name: Gridded Renewable Nowcasting Demonstration over South Australia
  what_happened: Solcast identified through engagement with AEMO's 2020 Integrated
    System Plan and project participants that grid operators and networks require
    a holistic, high-quality, rapidly-updating, granular intra-day weather nowcasting
    system — not just solar forecasting — to manage high renewable penetration, but
    the project scope was limited to utility wind, utility solar, rooftop PV and precipitation
    nowcasts in South Australia.
  lesson_learnt: When building forecasting systems for grid operators, scope the solution
    holistically to include all weather parameters driving generation, demand, and
    network risk — not just solar irradiance. Grid operators have identified comprehensive
    weather nowcasting as a prerequisite for orchestrating high renewable penetration,
    and projects scoped too narrowly will leave this need unmet.
