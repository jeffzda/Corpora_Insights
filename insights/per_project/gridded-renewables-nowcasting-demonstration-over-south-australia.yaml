  what_happened: Solcast designed the forecasting system's infrastructure using scalable
    cloud compute and storage (Amazon Web Services) to enable future expansion across
    Australia and internationally, accepting higher short-term design and operational
    complexity in exchange for long-term scalability and reduced need for structural
    overhaul.
  lesson_learnt: Design forecasting infrastructure for future scalability from the
    outset — using scalable cloud resources reduces upfront capex and allows the system
    to grow spatially and parametrically without structural overhaul, though it brings
    increased design time and operational support burden in the short term. Future
    projects should plan explicitly for how new modules will integrate into existing
    infrastructure.
