- record_id: ARENA-DLV-8054
  source_title: Gridded Renewable Nowcasting Demonstration Lessons Learnt 2
  publish_date: 2020-09
  project_name: Gridded Renewable Nowcasting Demonstration over South Australia
  what_happened: In developing the precipitation nowcasting algorithm, Solcast found
    that standard prediction metrics used during model training inherently favour
    accurate prediction of frequent low-intensity rainfall events and systematically
    underpredict rare but high-intensity events — a class imbalance problem that degraded
    the model's ability to capture the most operationally significant precipitation
    episodes.
  lesson_learnt: When training meteorological or energy forecasting models on imbalanced
    datasets where high-impact events are rare, standard loss metrics will underweight
    those events. Apply alternative sampling approaches (e.g. oversampling high-value
    events) to increase their relative representation in training, ensuring the model
    predicts operationally critical extremes without sacrificing overall accuracy.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Applied an alternate sampling approach to increase the relative
    distribution of high-intensity rainfall events in the training dataset, improving
    model prediction of those events while retaining standard evaluation metrics.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id017
  - 5
  evidence_excerpt: The imbalanced distribution of intense rainfall events can make
    them difficult to capture when training a model to predict a numeric value, as
    standard prediction metrics will often favour accurate prediction of the more
    numerous, low priority values. Using an alternate sampling approach to increase
    the relative distribution of these high values events can increase the propensity
    of the model to predict those events while still using standard metrics.
  confidence_note: transferability rated moderate — the class-imbalance sampling lesson
    applies broadly to any ML-based forecasting project dealing with rare high-impact
    events, but is most directly relevant to weather/energy forecasting contexts.
  source_url: https://arena.gov.au/knowledge-bank/gridded-renewable-nowcasting-demonstration-lessons-learnt-2/
