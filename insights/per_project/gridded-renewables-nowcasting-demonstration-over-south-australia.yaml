  what_happened: The initial 'sidecar' containerisation approach for on-demand power
    modelling failed at scale — when tested under large traffic loads, sidecar containers
    dramatically reduced available compute resources and degraded cluster health and
    API response times, making the configuration unviable.
  lesson_learnt: Prototype cloud hosting architectures for forecast systems under
    realistic peak-load conditions before committing to a configuration — an approach
    that performs adequately at small-to-medium traffic can fail entirely under production-scale
    loads.
