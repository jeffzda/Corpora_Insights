  evidence_excerpt: For an arbitrarily chosen 10km x 10km square land area, the likelihood
    of such a site being present is less than 0.03%... Future projects developing
    a system for a large spatial area such as Australia should consider using a more
    generalised solution that captures a wide range of cloud behaviours.
