  source_title: Gridded Renewables Nowcasting Demonstration over SA Public Report
  publish_date: '2022-06-30'
  project_name: Gridded Renewables Nowcasting Demonstration over South Australia
  what_happened: The nowcasting system successfully predicted a morning cloud front
    on 13 January 2021 that caused an unforeseen ~325 MW ramp in grid demand over
    one hour, with spot prices reaching $1,000/MWh at 10:00 and 10:05. Traditional
    NWP day-ahead models predicted the general clearing event but the timing and magnitude
    were significantly less accurate than the Solcast +1hr and +2hr nowcasts, which
    reduced nRMSE by 52% and 15% respectively.
  lesson_learnt: Nowcasting systems that update from satellite imagery every 5–10
    minutes can predict cloud-front timing and magnitude substantially better than
    four-per-day NWP models in the 1–2 hour horizon, translating directly to avoided
    high-price dispatch events — this use-case should be a primary value proposition
    when engaging market operators as evaluation partners.
