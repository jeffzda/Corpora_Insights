- record_id: ARENA-DLV-7758
  source_title: Gridded Renewables Nowcasting Demonstration over SA Public Report
  publish_date: '2022-06-30'
  project_name: Gridded Renewables Nowcasting Demonstration over South Australia
  what_happened: Despite attempts to coordinate comparable evaluation results across
    project partners, each partner recorded differing outcomes when comparing the
    new nowcast data with their existing operational forecasts. Differences arose
    because partners evaluated over different time periods and used different error
    metrics (e.g. AEMO used MAE while TESLA Forecast used RMSE). A single weather
    event lasting 1–2 days was sufficient to produce conflicting conclusions depending
    on whether it fell within a given partner's evaluation window.
  lesson_learnt: Multi-partner forecast evaluation programs must agree upfront on
    a single common evaluation metric and a common evaluation period — even a 1–2
    day weather event included in one partner's window but not another's can produce
    directly contradictory results that undermine cross-partner comparison.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: null
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: coordination & stakeholders
  intervention_note: Post-hoc normalisation of metrics was attempted but results still
    differed owing to differences in evaluation period; the project recommends establishing
    common metrics and periods contractually at the project outset.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id010
  - 27
  - 28
  evidence_excerpt: A primary example was conflicting results in value-add for demand
    forecasts. Whereas AEMO leveraged a MAE approach, TESLA Forecasting implemented
    an RMSE based evaluation. This made cross comparison difficult. When attempts
    to normalise these comparisons were undertaken, results were found to differ,
    owing to a small difference in the period used for evaluation.
