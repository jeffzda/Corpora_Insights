  source_title: Gridded Renewables Nowcasting Demonstration over SA Public Report
  publish_date: '2022-06-30'
  project_name: Gridded Renewables Nowcasting Demonstration over South Australia
  what_happened: At the start of a key milestone period, Solcast was running duplicate
    modelling logic across two separate codebases — one offline (Python/MATLAB on
    own servers) and one on-demand (C# on API servers) — creating maintenance and
    update complexity. Migrating to AWS Lambda serverless functions introduced new
    challenges around cost optimisation (charges based on request count and duration)
    and the need for dedicated developmental testing environments.
  lesson_learnt: Software-focused projects with operational delivery outcomes should
    establish CI/CD testing pipelines (e.g. GitLab CI/CD) and infrastructure-as-code
    tooling (e.g. AWS CloudFormation) from the outset to manage algorithm changes
    safely across environments and avoid duplicated codebases.
