  project_name: Gridded Renewable Nowcasting Demonstration over South Australia
  what_happened: AWS Lambda pricing based on request count and duration created a
    cost optimisation challenge — algorithms needed to be tuned to run as quickly
    as possible to avoid excessive charges from long-running compute jobs.
  lesson_learnt: When adopting serverless cloud compute (e.g. AWS Lambda) for operational
    forecast systems, build cost modelling and algorithm runtime optimisation into
    the architecture design phase — pricing structures based on request duration can
    produce unexpectedly high costs if algorithms are not optimised before deployment.
