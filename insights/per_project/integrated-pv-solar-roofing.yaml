- record_id: ARENA-DLV-26652
  source_title: Integrated Solar PV Roofing – Project Results and Lessons Learnt
  publish_date: 2015-12
  project_name: Low Cost Building Integrated Photovoltaics (BIPV) for Australian Residential
    and Commercial/Industrial Rooftop Power Generation
  what_happened: Rapid price reductions in conventional rooftop PV over the project's
    three-year duration far exceeded original estimates, with fully installed costs
    falling well below $0.50/W, making it extremely difficult for the BIPV product
    to close the cost gap against incumbent technology.
  lesson_learnt: BIPV development programs must build in a technology-agnostic pivot
    mechanism and regularly reassess the cost trajectory of competing incumbent technologies
    — a fixed technology commitment made at project commencement can be rendered uncompetitive
    by market movements within the project timeline.
