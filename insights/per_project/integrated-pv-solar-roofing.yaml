- record_id: ARENA-DLV-26658
  source_title: Integrated Solar PV Roofing – Project Results and Lessons Learnt
  publish_date: 2015-12
  project_name: Low Cost Building Integrated Photovoltaics (BIPV) for Australian Residential
    and Commercial/Industrial Rooftop Power Generation
  what_happened: Attempting to influence flexible thin film PV suppliers — who were
    themselves at an early commercialisation stage — to tailor their technology for
    BlueScope's BIPV product proved very difficult, as those suppliers were prioritising
    their own commercial survival and volume growth over collaborative product development.
  lesson_learnt: Avoid building a product development program around a dependency
    on a nascent component supplier's roadmap — early-stage suppliers facing their
    own commercialisation pressures will not reliably co-develop; instead, seek suppliers
    with demonstrated manufacturing scale or build contractual alignment mechanisms
    before committing to a technology direction.
