- record_id: ARENA-DLV-26657
  source_title: Integrated Solar PV Roofing – Project Results and Lessons Learnt
  publish_date: 2015-12
  project_name: Low Cost Building Integrated Photovoltaics (BIPV) for Australian Residential
    and Commercial/Industrial Rooftop Power Generation
  what_happened: BlueScope successfully designed and installed three in-market BIPV
    prototype systems — two horizontal residential and one BIPV-Thermal in both residential
    and commercial applications — using existing roofing supply chain participants
    and in-factory integration processes, demonstrating technical feasibility of steel-based
    BIPV in Australian conditions.
  lesson_learnt: Leveraging an established manufacturing and installation supply chain
    to deliver prototypes reduces costs and builds real-world capability in the channel
    — developing installation guidelines and involving roll-formers, roof fixers,
    and electrical contractors in trials is an effective way to de-risk commercial
    scale-up.
