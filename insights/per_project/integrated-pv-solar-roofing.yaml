- record_id: ARENA-DLV-26653
  source_title: Integrated Solar PV Roofing – Project Results and Lessons Learnt
  publish_date: 2015-12
  project_name: Low Cost Building Integrated Photovoltaics (BIPV) for Australian Residential
    and Commercial/Industrial Rooftop Power Generation
  what_happened: Because the roofing profile design was locked in around the form
    factor of flexible thin film PV modules before market consolidation occurred,
    BlueScope was forced to continue developing profiles optimised for a technology
    whose cost and performance had not met projections, rather than pivoting to more
    competitive alternatives.
  lesson_learnt: When building a product design around a nascent component technology,
    maintain supplier diversity and design flexibility from the outset — concentrating
    on a single emerging technology family whose manufacturers are still in early
    commercialisation creates critical single-point-of-failure risk if that market
    contracts.
