- record_id: ARENA-DLV-26656
  source_title: Integrated Solar PV Roofing – Project Results and Lessons Learnt
  publish_date: 2015-12
  project_name: Low Cost Building Integrated Photovoltaics (BIPV) for Australian Residential
    and Commercial/Industrial Rooftop Power Generation
  what_happened: Rooftop PV in Australia is predominantly installed as a retrofit
    after-build product, and BIPV requires a purchase decision at the point of construction
    — a fundamentally different buying behaviour that limited demand, even though
    BIPV offers advantages in aesthetics and convenience.
  lesson_learnt: BIPV market entry strategies must explicitly address the retrofit-vs-newbuild
    purchasing behaviour gap — product positioning, sales channel design, and builder
    incentives need to shift the decision point from post-build to design-and-construct,
    otherwise intrinsic product advantages will not translate to adoption.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: manufacturer/OEM
  delay_category: null
  failure_mode: commercial & market
