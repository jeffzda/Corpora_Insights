  secondary_failure_mode: null
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id002
  - 9
  evidence_excerpt: BIPV… forces a buying decision at the point of build, with a product
    that is broadly thought of as an after build (retrofit) product. Of the 1.4 million
    households who've installed rooftop PV, we believe only a small percentage of
    these were installed during the new build process. This dynamic may change with
    time but remains a hurdle which marketing and product positioning strategies will
    need to overcome to drive adoption.
