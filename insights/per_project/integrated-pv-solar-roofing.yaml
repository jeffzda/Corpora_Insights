- record_id: ARENA-DLV-26654
  source_title: Integrated Solar PV Roofing – Project Results and Lessons Learnt
  publish_date: 2015-12
  project_name: Low Cost Building Integrated Photovoltaics (BIPV) for Australian Residential
    and Commercial/Industrial Rooftop Power Generation
  what_happened: BIPV specification for commercial buildings required alignment across
    a large number of decision-makers (client, developer, architect, ESD consultant,
    engineers, builder, and subcontractors), and each party expressed reluctance to
    be first to adopt an unproven product, stalling market entry. Two prospective
    prototype installations were pursued to detailed design stage but ultimately not
    implemented.
  lesson_learnt: For complex multi-functional building products like BIPV, engage
    the full chain of specifiers and decision-makers — including architect, ESD consultant,
    and builder — from early concept stage, not after prototype development; each
    actor's 'first-mover reluctance' compounds and can block market entry entirely
    if not addressed with independently validated evidence and credible design tools.
  issue_severity: major
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: approvals/contracting
  proponent_type: manufacturer/OEM
  delay_category: stakeholder/land/community
  failure_mode: coordination & stakeholders
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: commercial & market
  intervention_note: BlueScope subsequently mapped decision-making processes by building
    segment and developed tools (payback estimator, design guide) to equip specifiers
    with the information needed to incorporate the system.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages:
  - 13
  - 14
  evidence_excerpt: Due to the complexity of this product, now containing both energy
    generation and thermal energy functionality… there are more decision makers required
    in the specification process, as it affects more than just the roof design. BlueScope
    has learnt that if a product includes structural, energy generation and mechanical
    services features the system needs to be specified early in the project such that
    major changes to the building are not necessary later in the design process.
