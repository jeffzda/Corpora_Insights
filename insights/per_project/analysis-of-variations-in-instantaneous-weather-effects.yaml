- record_id: ARENA-DLV-43355
  source_title: Investigating the Impact of Solar Variability on Grid Stability
  publish_date: 2015-03
  project_name: Investigating the Impact of Solar Variability on Grid Stability
  what_happened: Wind data collected across the nine monitoring stations was ultimately
    disregarded from the final analysis because wind speed and direction proved unreliable
    as a predictor of cloud movement and its impact on PV irradiance variability,
    despite being a stated data collection objective.
  lesson_learnt: Research projects investigating cloud-driven PV variability should
    not rely on anemometer-based wind data as a proxy for cloud movement prediction
    — local wind observations at network scale introduce too many uncertainties to
    reliably model cloud impacts on distributed irradiance, and resource effort may
    be better directed to irradiance network density.
