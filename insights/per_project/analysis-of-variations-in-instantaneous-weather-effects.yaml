- record_id: ARENA-DLV-43351
  source_title: Investigating the Impact of Solar Variability on Grid Stability
  publish_date: 2015-03
  project_name: Investigating the Impact of Solar Variability on Grid Stability
  what_happened: Research conducted on the Alice Springs grid demonstrated empirically
    that geographically dispersed PV installations can be integrated at high penetration
    levels — potentially exceeding 60% of demand — without materially increasing grid
    variability beyond levels already accommodated by the network's inherent load
    variance.
  lesson_learnt: When planning high-penetration PV integration into isolated or regional
    grids, prioritise geographic dispersion across multiple sites rather than centralised
    large-scale installations — the research shows that nine dispersed 1.1MW arrays
    produce variance no greater than the grid's existing baseline variability, while
    a single 10MW array produces four times the variance.
