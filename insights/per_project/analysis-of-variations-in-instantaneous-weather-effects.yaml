- record_id: ARENA-DLV-43353
  source_title: Investigating the Impact of Solar Variability on Grid Stability
  publish_date: 2015-03
  project_name: Investigating the Impact of Solar Variability on Grid Stability
  what_happened: The project found that the Alice Springs grid already experiences
    significant inherent load variability unrelated to PV — step changes up to 2MW
    per minute under normal operation — contradicting the common assumption that grids
    are inherently stable before PV is added.
  lesson_learnt: Network planners and PV integration analysts should characterise
    the grid's existing inherent demand variability before attributing stability concerns
    to PV — the Alice Springs data shows that existing load variance is substantial,
    and PV variability at reasonable penetration levels may not materially exceed
    what the spinning reserve already accommodates.
