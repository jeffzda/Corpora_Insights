- record_id: ARENA-DLV-43354
  source_title: Investigating the Impact of Solar Variability on Grid Stability
  publish_date: 2015-03
  project_name: Investigating the Impact of Solar Variability on Grid Stability
  what_happened: Point-source pyranometers were found to overestimate irradiance variability
    compared to the actual output of a large-area PV array, because a real PV plant
    (200m×200m for 1MW; 500m×500m for 10MW) inherently smooths local irradiance fluctuations
    across its physical extent — a dispersion effect not captured by point-source
    instrumentation.
  lesson_learnt: When modelling PV grid integration risk using pyranometer data, analysts
    should apply a downward correction to variability estimates to account for the
    spatial smoothing inherent in large-area arrays — point-source irradiance data
    systematically overstates variability, making assessments based on it overly pessimistic.
