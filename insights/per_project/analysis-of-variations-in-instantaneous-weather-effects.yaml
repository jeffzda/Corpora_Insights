- record_id: ARENA-DLV-43352
  source_title: Investigating the Impact of Solar Variability on Grid Stability
  publish_date: 2015-03
  project_name: Investigating the Impact of Solar Variability on Grid Stability
  what_happened: The study found that the number of spatially dispersed PV sites is
    a more decisive factor in reducing grid variability than the geographic distance
    between those sites — inner five-site clusters at 5km radius showed only marginally
    more variability than outer five-site clusters spread over a 10–15km radius (nine
    times the area).
  lesson_learnt: When designing dispersed PV configurations to manage grid variability,
    prioritise increasing the number of sites over maximising separation distance
    — the marginal benefit of greater separation is modest compared to the benefit
    of additional sites, and reasonable spatial dispersion (3–5km in Alice Springs
    conditions) is sufficient to capture most of the smoothing effect.
