- record_id: ARENA-DLV-43358
  source_title: Investigating the Impact of Solar Variability on Grid Stability
  publish_date: 2015-03
  project_name: Investigating the Impact of Solar Variability on Grid Stability
  what_happened: The study found that the optimal separation distance required to
    achieve full spatial diversity benefits from distributed PV is dependent on local
    wind speeds — in Alice Springs (moderate wind speeds) the effective separation
    was found to be 3–5km, with the implication that higher-wind coastal locations
    may require greater distances.
  lesson_learnt: When specifying minimum separation distances for dispersed PV configurations,
    planners should calibrate requirements against local average wind speeds — the
    Alice Springs finding of 3–5km is specific to its wind regime, and coastal or
    high-wind sites are likely to require greater separation to achieve equivalent
    smoothing of irradiance variability.
