- record_id: ARENA-DLV-43357
  source_title: Investigating the Impact of Solar Variability on Grid Stability
  publish_date: 2015-03
  project_name: Investigating the Impact of Solar Variability on Grid Stability
  what_happened: The Alice Springs grid had already imposed restrictions on PV connection
    — residential systems capped at 4.5kWp and commercial systems capped to prevent
    any export — due to observed voltage rise issues at local substations and feeders,
    even with only ~4MW of installed PV capacity representing approximately 8% peak
    penetration.
  lesson_learnt: Network planners integrating distributed PV should treat voltage
    rise at the substation and feeder level as a binding constraint that may be reached
    well before network-wide variability becomes a stability concern — localised network
    impacts can impose effective penetration limits before system-level spinning reserve
    is challenged.
