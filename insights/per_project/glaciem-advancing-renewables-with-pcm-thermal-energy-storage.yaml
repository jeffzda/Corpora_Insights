- record_id: ARENA-DLV-53885
  source_title: Demand Flexibility Portfolio Retrospective Analysis Report
  publish_date: 2023-07
  project_name: Glaciem Advancing Renewables with PCM Thermal Energy Storage
  what_happened: The Glaciem project demonstrated that integration of phase-change material thermal energy storage (TES) with solar PV and an Advanced Control and Forecasting Algorithm (ACFA) enabled a
    cold-store site to save $2,300 in energy costs over 6 hours of a peak price event, with peak events above $0.5/kWh delivering $6,331 in savings and arbitrage savings of $6,164.
  lesson_learnt: Phase-change material TES integrated with spot pricing signals and PV can deliver commercially significant peak demand cost savings at cold-store and refrigeration sites; this is a viable
    near-term demand flexibility pathway for industrial refrigeration that does not require regulatory reform and can be pursued under existing tariff structures.
