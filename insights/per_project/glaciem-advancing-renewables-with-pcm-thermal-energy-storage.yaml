  evidence_excerpt: With the integration of the advanced control and forecasting algorithm (ACFA), PV and TES, the site can save $2,300 in energy costs over 6 hours of peak price event. The ACFA control
    signals to charge the TES when the import prices are low or negative and discharge the TES during the peak demands from the grid. Peak events that have electricity prices over $0.5/kWh provides savings
    of $6,331 whilst arbitrage savings (when electricity prices are below $0.5/kWh) contribute $6,164.
