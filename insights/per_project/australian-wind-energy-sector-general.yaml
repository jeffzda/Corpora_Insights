- record_id: ARENA-DLV-72019
  source_title: Australian Energy Resource Assessment - Second edition, 2014
  publish_date: '2014'
  project_name: Australian wind energy sector (general)
  what_happened: Wind energy approval timelines in Australia varied widely depending
    on jurisdictional requirements and complexity; the document notes the approval
    stage 'can vary widely' and that social and environmental objections (noise, aesthetics,
    bird impacts) led several state governments to introduce setback restrictions,
    adding regulatory complexity to project development.
  lesson_learnt: Wind farm development programmes should build substantial schedule
    contingency for the approvals stage and conduct early community and environmental
    assessment — state-level setback rules and noise/visual/wildlife objections have
    introduced material and unpredictable approval delays, and proponents who treat
    approvals as a formulaic process risk significant schedule slippage.
  issue_severity: moderate
  project_type: generation
  project_scale_band: utility/large-scale
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: coordination & stakeholders
  intervention_note: The Clean Energy Council (2013) developed best practice guidelines
    for wind energy project implementation to help proponents navigate the development
    and approval process.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: wind
  source_pages: &id002
  - 266
  - 269
  evidence_excerpt: The length of the approval stage can vary widely, depending on
    the relevant authorities' requirements and the complexity of the approval process...
    These concerns have led several state governments to introduce restriction on
    wind farms being built within close proximity of residential or environmentally
    sensitive areas.
  confidence_note: secondary_failure_mode uses stakeholder/land/community which is
    a delay_category value, not a failure_mode value — mapped to governance/coordination
    failure as the closest failure_mode; however community opposition is the substantive
    mechanism so noting the boundary. Left as secondary note.
