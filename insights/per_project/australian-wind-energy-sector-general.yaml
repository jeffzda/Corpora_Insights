- record_id: ARENA-DLV-72020
  source_title: Australian Energy Resource Assessment - Second edition, 2014
  publish_date: '2014'
  project_name: Australian wind energy sector (general)
  what_happened: Wind energy capital costs increased from approximately 2003 through
    the latter half of the 2000s, driven by rising commodity and raw material prices,
    increased labour costs, higher manufacturing costs, and turbine up-scaling — reversing
    a decade of LCOE reductions despite continued performance improvements, before
    declining again as manufacturing shifted to lower-cost centres in China and India.
  lesson_learnt: Wind farm capital cost forecasts should not assume a linear downward
    trend — the 2003–2010 period demonstrated that commodity price cycles and supply
    chain constraints can drive sustained multi-year cost increases even in a maturing
    technology; project budgets should include commodity price escalation scenarios
    and procurement timing strategies to manage this risk.
  issue_severity: moderate
  project_type: generation
  project_scale_band: utility/large-scale
  lifecycle_phase: procurement
  proponent_type: project developer
  delay_category: procurement/supply chain
  failure_mode: commercial & market
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: null
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: wind
  source_pages: &id003
  - 266
  evidence_excerpt: Beginning in about 2003 and continuing through the latter half
    of the past decade, wind power capital costs increased, driven by rising commodity
    and raw materials prices, increased labour costs, higher manufacturing costs and
    turbine up-scaling, which pushed LCOE of wind upward in spite of continued performance
    improvements.
  confidence_note: This is a sector-level observation rather than a single project
    event; included because it provides a reference-class cost risk pattern directly
    relevant to project delivery budgeting. issue_severity moderate because the cost
    increase affected an entire generation of projects but was ultimately resolved
    through supply chain diversification.
