- record_id: ARENA-DLV-72018
  source_title: Australian Energy Resource Assessment - Second edition, 2014
  publish_date: '2014'
  project_name: Australian wind energy sector (general)
  what_happened: Grid constraints — lack of transmission capacity or availability
    — emerged as a limiting factor for wind energy development in areas with high
    wind resources but remote from existing infrastructure, with the area of good
    wind resources (≥7 m/s) reducing from approximately 600,000 km² to approximately
    3,300 km² when constrained to within 100 km of the existing 66 kV+ transmission
    grid.
  lesson_learnt: Wind farm site selection must treat proximity to existing high-voltage
    transmission as a primary filter — the 180-fold reduction in accessible high-quality
    wind resource area when applying a 100 km grid proximity constraint demonstrates
    that transmission access, not wind resource quality, is the binding constraint
    for most prospective Australian wind sites.
  issue_severity: moderate
  project_type: generation
  project_scale_band: utility/large-scale
  lifecycle_phase: development/design
  proponent_type: project developer
  delay_category: grid connection/system studies
  failure_mode: poor scoping
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The AEMC (2009) recommended development of connection 'hubs'
    or scale-efficient network extensions to improve access to remote renewable resources.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: wind
  source_pages: &id001
  - 269
  evidence_excerpt: This is demonstrated by the significant reduction of the area
    with good wind resources (7 m/s and greater shown in figure 9.16) from about 600
    000 km2 to about 3300 km2 when constrained to within 100 km of the existing electricity
    transmission grid (66 kV and greater).
  confidence_note: failure_mode design assumption failure applied because prospective
    developers who model resource quality without grid proximity as a constraint will
    reach materially incorrect conclusions about developable area.
