  evidence_excerpt: CSIRO has experienced some very high levels of funding in the
    period up to 2014 but it has fallen quite rapidly since then. This may present
    a challenge to that organisation. Helping to mitigate this apparent effect, CSIRO
    does have relatively large internal funding (compared to universities) to work
    with as well as ongoing involvement in ASTRI. Also, large amounts of the initial
    funding have contributed to major investment in facilities and laboratories that
    will serve for many years going forward.
