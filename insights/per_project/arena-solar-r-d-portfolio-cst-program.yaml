- record_id: ARENA-DLV-40357
  source_title: 'In The Spotlight: Australian Solar Energy R&D Outcomes and Achievements
    in a Global Context'
  publish_date: 2018-07
  project_name: ARENA Solar R&D Portfolio (CST Program)
  what_happened: CST R&D funding peaked at end of 2014 and declined in subsequent
    years, with most funded projects completed or scheduled for completion by 2018.
    The consequence of this declining funding trajectory, in the absence of a clear
    path to CST deployment in Australia, was a risk of a large number of newly trained
    PhD graduates and post-docs unable to continue their work in Australia and under-utilised
    research facilities.
  lesson_learnt: When structuring large R&D programs with significant facility investment,
    front-loading capital expenditure on durable research infrastructure can partially
    buffer organisations against subsequent funding reductions — future program designers
    should sequence funding to build physical infrastructure early so that reduced
    operating budgets can still generate research output from established facilities.
  issue_severity: major
  project_type: generation
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: operations
  proponent_type: research organisation/university
  delay_category: financing/commercial close
  failure_mode: commercial & market
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: CSIRO's earlier funding had contributed to major investment in
    facilities and laboratories that will serve for many years going forward, partially
    mitigating the impact of declining operational funding.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar thermal
  source_pages:
