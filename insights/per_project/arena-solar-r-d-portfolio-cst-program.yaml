- record_id: ARENA-DLV-40356
  source_title: 'In The Spotlight: Australian Solar Energy R&D Outcomes and Achievements
    in a Global Context'
  publish_date: 2018-07
  project_name: ARENA Solar R&D Portfolio (CST Program)
  what_happened: Despite over a decade of sustained R&D investment and the establishment
    of world-competitive CST research capability in Australia, Australia failed to
    complete construction of any utility-scale CST plant. Several supported companies
    ran into financial difficulties, and other companies with CST interests concluded
    the technology was unlikely to generate expected commercial returns in the current
    environment.
  lesson_learnt: R&D investment alone is insufficient to progress CST to commercial
    deployment in Australia — the absence of a commercial CST market (driven by RET
    design that does not differentiate by time of generation, dominance of coal, and
    lack of policy mechanisms recognising flexibility value) means that research outcomes
    cannot translate to deployment without complementary market and policy reform.
