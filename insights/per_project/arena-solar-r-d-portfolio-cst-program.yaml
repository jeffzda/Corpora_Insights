- record_id: ARENA-DLV-40374
  source_title: 'In The Spotlight: Australian Solar Energy R&D Outcomes and Achievements
    in a Global Context'
  publish_date: 2018-07
  project_name: ARENA Solar R&D Portfolio (CST Program)
  what_happened: The CST sector in Australia lacked standardised deployment procedures
    and large-scale commercial projects at the time of the report. The cost gap between
    realistic income streams and annualised costs was closing, but wind and PV were
    forecast to be the main beneficiaries of the RET under its current rules. The
    inherent utility-scale nature of CST (requiring significant capital) compounded
    financing challenges.
  lesson_learnt: CST deployment in Australia requires a specific market mechanism
    that values time-of-generation and dispatchability — the current RET structure,
    which treats all renewable generation equivalently regardless of when it is delivered,
    systematically disadvantages storage-capable technologies like CST in favour of
    lowest-LCOE variable generation technologies.
  issue_severity: major
  project_type: generation
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: approvals/contracting
  proponent_type: research organisation/university
  delay_category: financing/commercial close
