  evidence_excerpt: Despite the strong support for CST R&D over recent years, Australia
    has failed to complete construction of a utility-scale plant... No technology
    or time of generation differentiation in the Renewable Energy Target, to reflect
    the real time value of energy supply linked to energy demand, such that the lowest
    LCOE technology (wind) dominates. Early mover CST project failures, resulting
    in an adverse perception about the role and capability of CST as a cost effective
    component of a future energy supply.
