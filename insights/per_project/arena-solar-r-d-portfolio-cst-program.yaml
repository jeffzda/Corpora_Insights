- record_id: ARENA-DLV-40358
  source_title: 'In The Spotlight: Australian Solar Energy R&D Outcomes and Achievements
    in a Global Context'
  publish_date: 2018-07
  project_name: ARENA Solar R&D Portfolio (CST Program)
  what_happened: In the absence of utility-scale CST deployment in Australia, large
    international CST companies had only a small presence in the country, making it
    difficult for research groups to form meaningful commercial partnerships. This
    limited the translation of Australian CST research into commercial outcomes.
  lesson_learnt: For emerging technologies without a local deployment market, R&D
    programs should proactively create structured pathways for international industry
    engagement (e.g. co-funding arrangements with global developers) rather than relying
    on industry to self-select into partnerships — absence of a local market will
    otherwise prevent commercial knowledge exchange even where the research is world-competitive.
  issue_severity: major
  project_type: generation
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: commercial & market
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: coordination & stakeholders
  intervention_note: A notable exception was Abengoa Solar, which partnered with CSIRO
    for two key projects, giving CSIRO's work direct input into a leading international
    commercial CST developer.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar thermal
  source_pages: &id001
  - 87
  evidence_excerpt: In the absence of a clear path to deployment of CST in Australia,
    the large international CST companies have had only a small presence here. Consequently,
    it has been hard for the various research groups to form meaningful commercial
    partnerships. A notable exception was Abengoa Solar, which partnered with CSIRO
    for two key projects.
