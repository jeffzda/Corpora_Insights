  evidence_excerpt: 'This project seeks to de-risk key aspects of hydrogen direct
    reduced ironmaking as applied to Australian Pilbara ores via: experiments to improve
    understanding of fluidised bed reactor kinetics and the prevention of particle
    sticking, developing novel fluidised bed reactor designs for improved control
    of temperature and residence times, analysing the end-to-end process technoeconomics
    including for alternative ores, seeking least-cost pathways, evaluating a safe
    shipping method for lower-grade hot briquetted iron (HBI), and developing a novel
    smelting process adapted to these ores.'
