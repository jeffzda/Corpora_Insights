  project_name: De-risking large-scale Australian fine-ore hydrogen ironmaking
  what_happened: Significantly contrasting reduction kinetics data were obtained from
    three partner institutions (ANU, UN, SUT) using different reactor types and measurement
    methods, creating uncertainty about which results reflect true large-scale behaviour
    and requiring additional investigation to reconcile.
  lesson_learnt: When distributing experimental work across multiple institutions
    in a consortium research project, align measurement methods and instrument calibration
    protocols early — divergent results from different setups can consume significant
    milestone time in reconciliation rather than advancing design.
