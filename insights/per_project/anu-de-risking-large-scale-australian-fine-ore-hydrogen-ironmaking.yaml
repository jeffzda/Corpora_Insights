- record_id: ARENA-DLV-60551
  source_title: ANU - De-risking large-scale Australian fine-ore hydrogen ironmaking
    - poster
  publish_date: 2024-05
  project_name: De-risking large-scale Australian fine-ore hydrogen ironmaking
  what_happened: A research and development project was initiated in March 2024 to
    address key technical barriers to hydrogen direct reduced ironmaking using Australian
    Pilbara ores, including particle sticking in fluidised bed reactors, novel reactor
    design, technoeconomic optimisation, safe HBI shipping, and novel smelting process
    development.
  lesson_learnt: Hydrogen DRI applied to Australian fine ores faces distinct technical
    barriers — particle sticking, ore-specific kinetics, and HBI shipping safety —
    that require targeted experimental R&D and pre-feasibility study before commercial
    scale-up can be responsibly pursued.
  issue_severity: none
  project_type: industrial decarbonisation
  project_scale_band: pilot
  lifecycle_phase: concept/feasibility
  proponent_type: research organisation/university
