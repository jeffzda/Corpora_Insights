  publish_date: 2025-11
  project_name: De-risking large-scale Australian fine-ore hydrogen ironmaking
  what_happened: Establishing hydrogen experimental facilities in a university context
    required extensive HAZOP studies, gas sensing equipment, fume cupboards, hydrostatic
    and pressurised gas testing, and compliance assessments — all of which took considerable
    time and introduced delays to planned experimental campaigns.
  lesson_learnt: Budget significant time and resources for safety commissioning of
    hydrogen research facilities in university settings — HAZOP studies, intrinsic
    safety measures, engineering controls, and equipment compliance assessments must
    all be completed before testing can proceed and cannot be fast-tracked.
