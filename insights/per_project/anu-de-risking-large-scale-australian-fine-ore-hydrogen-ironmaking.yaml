- record_id: ARENA-DLV-18903
  source_title: ANU - De-risking large-scale Australian fine-ore hydrogen ironmaking
    - Core Research Interim Report
  publish_date: 2025-11
  project_name: De-risking large-scale Australian fine-ore hydrogen ironmaking
  what_happened: Conventional crucible TGA testing of iron ore reduction was found
    to be unreliable due to strong bed-mass dependency and a diffusion barrier from
    water vapour accumulating in the freeboard above the sample, producing results
    that could not be directly compared with fluidised bed reactor conditions.
  lesson_learnt: Do not rely on conventional crucible TGA as a proxy for fluidised
    bed reduction behaviour — water vapour accumulation in the freeboard systematically
    depresses measured kinetics; support ore samples on an unreactive substrate such
    as alumina to eliminate the freeboard effect, or apply explicit compensation.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: data & measurement
  intervention_note: ANU quantified bed-mass dependency down to very small sample
    sizes and identified that supporting ore on an alumina substrate eliminates the
    freeboard diffusion barrier.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages: &id003
  - 10
  - 13
  evidence_excerpt: Conventional TGA testing of iron ore reduction is highly challenging.
    ANU has quantified bed mass dependency down to very small sample sizes, and also
    identified a diffusion barrier associated with the TGA 'freeboard'... which is
    eliminated by supporting the ore sample on an unreactive substrate such as alumina.
  confidence_note: null
