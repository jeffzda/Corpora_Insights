  publish_date: 2025-11
  project_name: De-risking large-scale Australian fine-ore hydrogen ironmaking
  what_happened: Low-temperature reduction of a Pilbara iron ore at Victoria University
    of Wellington produced successfully reduced material but the product was highly
    pyrophoric, revealing an additional safety and handling hazard not anticipated
    in the low-temperature reduction strategy.
  lesson_learnt: Low-temperature hydrogen reduction of iron ore may yield highly pyrophoric
    DRI — assess pyrophoricity risk explicitly before adopting low-temperature reduction
    as a design strategy, as it introduces materials handling and safety challenges
    beyond those of conventional higher-temperature reduction.
