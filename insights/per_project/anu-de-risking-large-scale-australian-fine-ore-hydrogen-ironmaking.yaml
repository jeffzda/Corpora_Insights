  publish_date: 2025-11
  project_name: De-risking large-scale Australian fine-ore hydrogen ironmaking
  what_happened: Technoeconomic analysis confirmed that the cost of green steel from
    hydrogen ironmaking is dominated by upstream electricity and hydrogen production
    costs, which are outside the scope of the project, meaning the project's targeted
    10% cost reduction is sensitive to assumed energy price scenarios beyond the team's
    control.
  lesson_learnt: When scoping technoeconomic targets for hydrogen-based industrial
    processes, explicitly bound the analysis to costs within the project's control
    and define the range of upstream energy price scenarios upfront — a project-level
    cost reduction target expressed as a percentage of total cost will be difficult
    to interpret if the dominant cost driver (green electricity/hydrogen) is out of
    scope and highly variable.
