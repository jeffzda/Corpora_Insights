  proponent_type: project developer
  delay_category: null
  failure_mode: poor scoping
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: execution & logistics
  intervention_note: ARENA developed the RAR Data Specification as a mandatory best-practice
    guide requiring consistent monitoring data from all proponents, making monitoring
    a contractual requirement rather than a discretionary line item.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
