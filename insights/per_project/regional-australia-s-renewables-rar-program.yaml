- record_id: ARENA-DLV-7504
  source_title: 'ARENA''s Remote and Regional Projects: Data Specification to Benefit
    Financial and Operational Yields'
  publish_date: 2017-03
  project_name: Regional Australia's Renewables (RAR) Program
  what_happened: The document describes a scenario in which inverters suffer intermittent
    and then complete failure at year 15 due to termite infestation, a failure mode
    that measurement uncertainty and poor O&M practices obscure until it causes catastrophic
    loss of generation.
  lesson_learnt: Monitor all balance-of-system components — not just the renewable
    generation technology — and ensure O&M practices are calibrated to detect anomalous
    behaviour early; at remote off-grid sites the margin for error is lower because
    failure can cascade into blackouts with serious financial repercussions.
  issue_severity: major
  project_type: generation
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: operations
  proponent_type: project developer
  delay_category: null
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: execution & logistics
  intervention_note: The RAR Data Specification requires monitoring of all equipment
    in the generation mix — not only renewable energy technologies — so O&M teams
    receive timely signals of untoward behaviour before complete failure occurs.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id004
  - 6
  - 7
  evidence_excerpt: monitoring of systems should help the operations & management
    (O&M) team pick up any untoward behaviour on the system (such as scenario 3) and
    anticipate remedies rather respond to a failure.
  confidence_note: Transferability rated moderate rather than broad because the termite/remote-site
