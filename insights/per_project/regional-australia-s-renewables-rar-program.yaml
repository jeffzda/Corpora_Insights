  evidence_excerpt: Given the remote location of off-grid projects, the additional
    remoteness premium(s) and likely supply chain challenges, the ability to identify
    issues sooner is more important compared to a 'simple' grid-connected renewable
    energy project where spares and trained personnel may be much more easily sourced.
