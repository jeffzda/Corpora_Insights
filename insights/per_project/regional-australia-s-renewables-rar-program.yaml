- record_id: ARENA-DLV-7505
  source_title: 'ARENA''s Remote and Regional Projects: Data Specification to Benefit
    Financial and Operational Yields'
  publish_date: 2017-03
  project_name: Regional Australia's Renewables (RAR) Program
  what_happened: 'Remote and off-grid renewable projects in the RAR portfolio face
    a heightened risk profile compared to grid-connected projects: supply chain challenges
    and remoteness premiums mean that detecting and resolving operational issues takes
    longer, amplifying the financial impact of any underperformance or equipment failure.'
  lesson_learnt: For remote and off-grid projects, invest more — not less — in monitoring
    and data infrastructure relative to grid-connected equivalents, because the cost
    and time to mobilise remediation is substantially higher and the consequences
    of undetected failure (including blackout cascades) are more severe.
