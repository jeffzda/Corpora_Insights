- record_id: ARENA-DLV-7502
  source_title: 'ARENA''s Remote and Regional Projects: Data Specification to Benefit
    Financial and Operational Yields'
  publish_date: 2017-03
  project_name: Regional Australia's Renewables (RAR) Program
  what_happened: Solar PV systems in the RAR portfolio were found to potentially underperform
    against initial modelling without detection, because output-only measurement (kWh
    delivered) cannot distinguish between a poor-resource year and a poorly performing
    system without a concurrent irradiance reference measurement.
  lesson_learnt: Always instrument the weather input (plane-of-array irradiance via
    pyranometer) alongside energy output — measuring output alone cannot confirm whether
    a system is performing to specification, and undetected underperformance compounds
    across a 25+ year asset life.
  issue_severity: moderate
  project_type: generation
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: operations
  proponent_type: project developer
  delay_category: null
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: The RAR Data Specification mandates installation of a pyranometer
    in the plane of the array and a global horizontal irradiance sensor as a backup,
    enabling Performance Ratio calculation and reliable detection of underperformance.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id002
  - 4
  evidence_excerpt: if it happens to be a very sunny year with an under-performing
    system, the output may approximate the value expected... but the amount that should
    have been produced is not known... this can only be known if the reference irradiance
    has been measured.
