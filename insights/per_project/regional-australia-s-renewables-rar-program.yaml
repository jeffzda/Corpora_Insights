  project_name: Regional Australia's Renewables (RAR) Program
  what_happened: The RAR Data Specification was developed through an iterative, collaborative
    process with the RAR project portfolio and reference to international best practice,
    evolving through ten iterations to become a living modular guide applicable across
    diverse remote renewable project configurations.
  lesson_learnt: A portfolio-level data specification, developed iteratively with
    active projects and regularly updated, is an effective mechanism for lifting monitoring
    standards across a diverse set of proponents — a single static standard issued
    at program inception would not have accommodated the range of technologies and
    contexts encountered.
