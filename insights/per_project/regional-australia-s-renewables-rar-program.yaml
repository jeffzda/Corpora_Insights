- record_id: ARENA-DLV-7503
  source_title: 'ARENA''s Remote and Regional Projects: Data Specification to Benefit
    Financial and Operational Yields'
  publish_date: 2017-03
  project_name: Regional Australia's Renewables (RAR) Program
  what_happened: The document illustrates a scenario in which a PV system suffers
    aggressive module degradation at -2% per year (versus a modelled -0.5%) that goes
    undetected and unacted upon, resulting in a negative internal rate of return by
    mid-asset life.
  lesson_learnt: Without performance monitoring data, a proponent cannot identify
    aggressive degradation early enough to make a valid warranty claim or take corrective
    action — monitoring must be in place from commissioning to protect both warranty
    rights and financial returns.
