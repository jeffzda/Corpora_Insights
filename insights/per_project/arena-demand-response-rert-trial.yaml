- record_id: ARENA-DLV-15825
  source_title: Evaluation of ARENA's Impact and Effectiveness
  publish_date: 2019-11
  project_name: ARENA Demand Response RERT Trial
  what_happened: ARENA provided $28.55 million to 10 projects to trial demand response delivery within 10 or 60 minutes of AEMO request. Year 1 exceeded the combined contracted capacity target of 143 MW
    and directly informed the reinstatement of the long-notice RERT scheme and the AEMC's draft determination for a Wholesale Demand Response mechanism in July 2019.
  lesson_learnt: Structured demand response trials with AEMO as a co-design partner can generate the operational evidence needed to change market rules — the RERT trial model (competitive round plus real
    dispatch conditions) should be the template for future regulatory proof-of-concept programs.
