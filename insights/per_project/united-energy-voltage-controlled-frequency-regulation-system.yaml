    sensitive to market price volatility driven by infrequent separation events —
    the business case should be stress-tested against low-price quarters and should
    not rely on sustained high FCAS prices, with operating strategy (e.g. targeting
    peak-price half-hours only) calibrated against maintenance cost thresholds.
