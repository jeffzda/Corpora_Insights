  what_happened: When large quantities of data were transferred via ICCP after the
    protocol cutover, the NAP application took longer than 3 minutes to process the
    data, threatening the 5-minute FCAS dispatch window.
  lesson_learnt: After migrating to a new inter-application protocol, validate bulk-data
    processing performance under realistic load conditions — ICCP bulk transfers caused
    NAP processing times exceeding 3 minutes, requiring a configuration change (transaction
    limit reduced from 500 to 50) as an interim fix pending a permanent database performance
    review.
