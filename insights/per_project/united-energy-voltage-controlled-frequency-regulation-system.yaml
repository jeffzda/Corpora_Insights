  source_title: Voltage Controlled Frequency Regulation System – Final Report
  publish_date: '2020-11-24'
  project_name: Voltage Controlled Frequency Regulation System (VCFRS)
  what_happened: After an over-frequency event during FCAS dispatch cleared and the
    relay threshold of 3 was no longer met, controlled zone substations failed to
    revert to Demand Reduction mode as expected — they remained in Enabled state,
    including the DVMApplication and Demand Reduction digital points.
  lesson_learnt: Test post-event state reversion logic explicitly, including scenarios
    where triggering relay counts drop below threshold mid-dispatch — failure of stations
    to revert to the correct prior state after a transient event is a non-obvious
    defect that only manifests under specific sequential trigger conditions.
