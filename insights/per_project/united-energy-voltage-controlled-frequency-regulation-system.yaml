  what_happened: The NAP application started sending voltage recommendations approximately
    2 minutes late after receiving Demand Reduction statuses from the SCADA application,
    further compressing the available time window for completing tap changes within
    the 5-minute FCAS response requirement.
  lesson_learnt: Measure and budget each latency component in the FCAS dispatch chain
    (SCADA trigger → NAP processing → recommendation dispatch → tap change completion)
    from the design phase — a 2-minute NAP recommendation delay was only discovered
    through operational testing and required code enhancements to both NAP and SCADA
    to resolve.
