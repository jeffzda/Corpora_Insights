  what_happened: 'The on-load tap changer (OLTC) maintenance cost structure imposes
    a minimum daily revenue threshold of $17/day (quarterly: ~$1,552) for FCAS participation
    to be cost-neutral, based on a cap of 25,000 tap operations over a 4-year maintenance
    cycle and an assumed $1 per tap change maintenance cost.'
