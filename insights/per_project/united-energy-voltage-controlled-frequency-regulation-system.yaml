  project_name: Voltage Controlled Frequency Regulation System (VCFRS)
  what_happened: After restarting the DVM application driver during an active under-frequency
    event, the application lost its count of frequency relay triggers and did not
    re-evaluate the under-frequency condition until a new event arrived, leaving stations
    in Enabled rather than Demand Reduction mode.
