  what_happened: 'Business case analysis showed that projected FCAS revenues for Q2
    and Q3 2020 (R5M: $1,521 and $539 respectively) fell below the minimum $1,552
    per quarter threshold needed to recoup on-load tap changer maintenance costs,
    primarily due to a decline in R5M market prices driven by the absence of power
    system separation events and lower energy prices.'
