- record_id: ARENA-DLV-42356
  source_title: Voltage Controlled Frequency Regulation System – Final Report
  publish_date: '2020-11-24'
  project_name: Voltage Controlled Frequency Regulation System (VCFRS)
  what_happened: A software defect caused the DVM application to revert all controlled
    zone substations from 'Demand Reduction' mode back to V99% mode when an over-frequency
    event was received during an active FCAS dispatch period, instead of holding the
    demand-reduction state for the full 10-minute period.
  lesson_learnt: For frequency-response control software, explicitly define and test
    state-machine logic for all edge-case trigger sequences (e.g. over-frequency received
    during an active under-frequency dispatch) — the unhandled condition caused premature
    termination of FCAS dispatch and required a code fix to enforce mode persistence
    for the full dispatch window.
  issue_severity: moderate
  project_type: network/grid
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: network business
  delay_category: commissioning/integration
  failure_mode: unvalidated integration
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: DVM application logic was updated so that once in Demand Reduction
    mode due to an under-frequency trigger, all controlled stations remain in that
    mode for the full 10-minute FCAS period regardless of subsequent over/under-frequency
    relay signals.
  transferability: narrow
  delay_magnitude: not quantified
  technology_domain: demand response
  source_pages: &id004
  - 36
  evidence_excerpt: While the DVM application was running in the 'Demand Reduction'
    mode, due to receiving an under-frequency event, when it received an over-frequency
    event during the FCAS period, it reverted all of the controlled stations from
    the 'Demand Reduction' to V99% mode... Resolution implemented. Defect is rectified
    now.
