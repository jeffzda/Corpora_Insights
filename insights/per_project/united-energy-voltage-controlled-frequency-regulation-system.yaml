  what_happened: The VCFRS scheme's FCAS revenue potential is concentrated in infrequent
    high-price events driven by power system separation (e.g. the 31 January 2020
    SA separation event produced R5M prices of $11,150/MWh/h), while routine dispatch
    at normal market prices generated revenue well below the maintenance cost threshold.
  lesson_learnt: A voltage-based FCAS scheme's business case should be structured
    around selective dispatch targeting high-price separation events with potential
    revenues up to 10 times the base strategy, rather than daily dispatch at average
    prices — perfect-foresight strategies during sustained high-price periods can
    justify the maintenance cost uplift even if routine dispatch cannot.
