- record_id: ARENA-DLV-42351
  source_title: Voltage Controlled Frequency Regulation System – Final Report
  publish_date: '2020-11-24'
  project_name: Voltage Controlled Frequency Regulation System (VCFRS)
  what_happened: The initial SCADA–NAP interface used the OSI PI protocol, which introduced
    a baseline lag of approximately 12 seconds between the SCADA and NAP applications,
    rising to over 30 seconds during periods of high data traffic. This latency was
    incompatible with the 5-minute response time required for delayed contingency
    FCAS delivery.
  lesson_learnt: When designing a distributed demand-response FCAS system, specify
    the inter-application communications protocol (e.g. ICCP over OSI PI) at the outset
    — OSI PI introduced lags of 12–30+ seconds that threatened the core 5-minute response
    requirement and required a mid-project protocol replacement.
  issue_severity: major
  project_type: network/grid
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: network business
  delay_category: commissioning/integration
  failure_mode: unvalidated integration
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Replaced the OSI PI interface with an ICCP two-way link between
    SCADA and NAP, reducing round-trip latency and enabling the 5-minute FCAS response
    time requirement to be met.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: demand response
  source_pages:
  - 8
  - 40
  - 41
  - 42
  evidence_excerpt: Initially control changes and network configurations were loaded
    into the NAP application from the SCADA application via the OSI PI interface.
    The lag between the SCADA and NAP applications was around 12 seconds. However,
    at times of high data traffic this increased to in excess of 30 seconds. Therefore,
    the decision was made to change from OSI PI to ICCP as the interface to receive
    network updates from the SCADA application.
