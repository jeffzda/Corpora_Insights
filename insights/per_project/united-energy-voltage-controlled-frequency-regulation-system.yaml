    a risk that the 5-minute FCAS response window could not be met consistently across
    all zone substations.
  lesson_learnt: Measure end-to-end recommendation-to-action latency at individual
    RTU level, not just aggregate, and size application worker threads to handle worst-case
    concurrency — slow back-indication from some RTUs caused dvmproc completion times
    exceeding 2 minutes, resolved by increasing DVM worker threads from 3 to 10.
