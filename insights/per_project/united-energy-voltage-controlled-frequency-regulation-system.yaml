  source_title: Voltage Controlled Frequency Regulation System – Final Report
  publish_date: '2020-11-24'
  project_name: Voltage Controlled Frequency Regulation System (VCFRS)
  what_happened: The DVM application's state was not preserved correctly when the
    DVM driver was restarted — all Station DVM Status and Trans DVM Mode digital points
    were initially set to Disabled on restart, which could disrupt active FCAS or
    demand-reduction operations.
  lesson_learnt: Define explicit startup state behaviour for all control application
    digital points before deployment in a live network environment — initially restarting
    the DVM driver set all station status points to Disabled, potentially interrupting
    active FCAS dispatch; the resolution (retaining previous state on restart) required
    a specific code change and should be a standard design requirement.
