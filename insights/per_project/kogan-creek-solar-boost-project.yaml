- record_id: ARENA-DLV-30002
  source_title: Kogan Creek Solar Boost Final Report
  publish_date: '2016-09-05'
  project_name: Kogan Creek Power Station Solar Boost Project
  what_happened: The immaturity of AREVA Solar's global 'least cost' supply chain
    caused significant delays, coordination difficulties, and rework during the initial
    stages of construction. Design changes delayed fabrication; manufacturing across
    geographically diverse factories made quality monitoring difficult, resulting
    in rework both overseas and in Australia.
  lesson_learnt: For first-of-a-kind solar thermal projects, avoid a globally dispersed
    'least cost' supply chain model — the coordination overhead and quality monitoring
    failures associated with immature, multi-country supply chains for novel technology
    reliably produce delays and rework that offset any procurement cost savings.
  issue_severity: major
  project_type: generation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: procurement
  proponent_type: utility/energy retailer
  delay_category: procurement/supply chain
  failure_mode: execution & logistics
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated integration
  intervention_note: Late in the project, the team shifted from a just-in-time delivery
    model to early delivery with significant equipment held on site in advance of
    the construction schedule to decouple off-site issues from on-site erection, though
    AREVA Solar did not resume construction so the effectiveness of this change was
    never tested.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar thermal
  source_pages: &id002
