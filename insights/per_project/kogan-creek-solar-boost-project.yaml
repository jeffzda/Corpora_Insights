  proponent_type: utility/energy retailer
  delay_category: construction/installation
  failure_mode: coordination & stakeholders
  outcome_class: discontinued/not progressed
  secondary_failure_mode: commercial & market
  intervention_note: CS Energy reviewed multiple alternative completion options and
    secured a licence to AREVA Solar's IP, but no viable completion path was identified;
    the project was formally terminated in March 2016.
  transferability: moderate
  delay_magnitude: '>3 years'
  technology_domain: solar thermal
