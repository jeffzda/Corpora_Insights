  project_name: Kogan Creek Power Station Solar Boost Project
  what_happened: AREVA Solar split the construction work package into separate civil,
    mechanical, and electrical contracts, and separately awarded the civil and mechanical
    designs, while the electrical design was handled by the electrical construction
    company. This fragmentation created work coordination inefficiencies and Federal
    Safety Commission compliance issues, requiring a larger AREVA Solar management
    workforce to coordinate the packages.
  lesson_learnt: Splitting EPC construction into separate civil, mechanical, and electrical
    contracts for a novel technology deployment increases coordination overhead and
    compliance risk — where possible, a single design-and-construct contract or tightly
    integrated multi-party model with clear interface management should be preferred.
