  project_name: Kogan Creek Power Station Solar Boost Project
  what_happened: Transport costs were a significant cost driver for the project, partly
    because the v1.3+ reflector design was not optimised for transport — there was
    no design trade-off between on-site versus factory fabrication or for efficient
    stacking and packing of equipment for freight to the regional location.
  lesson_learnt: For solar thermal projects at regional or remote locations, explicitly
    optimise reflector and equipment design for transport at the design stage — choosing
    between on-site fabrication and factory pre-assembly, and designing for efficient
    stacking and transport packing, can materially reduce freight costs that are a
    key cost driver.
