  source_title: Kogan Creek Solar Boost Final Report
  publish_date: '2016-09-05'
  project_name: Kogan Creek Power Station Solar Boost Project
  what_happened: 'The selection of the Kogan Creek Power Station site was assessed
    as valid by the completed project work: the site had high solar insolation, flat
    land adjacent to the power station, spare turbine capacity, and a reasonable match
    between asset lives. However, integration risks related to turbine response to
    solar transients remained unvalidated because the project was never completed.'
  lesson_learnt: Site selection for solar hybrid additions requires assessing five
    factors — solar insolation, land flatness and proximity, spare turbine swallow
    capacity, environmental factors, and matched asset lives — and the validated Kogan
    Creek methodology provides a reusable checklist for future hybrid project site
    selection.
