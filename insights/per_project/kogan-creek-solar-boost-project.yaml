- record_id: ARENA-DLV-30007
  source_title: Kogan Creek Solar Boost Final Report
  publish_date: '2016-09-05'
  project_name: Kogan Creek Power Station Solar Boost Project
  what_happened: 'The temperature measurement system within the boiler receiver was
    unreliable: physical RTD measurements were unstable due to tube expansion and
    restricted cavity space, access for repairs was difficult, and the system represented
    a significant potential failure point for ongoing operations.'
  lesson_learnt: For solar steam generator receivers, specify dual-head RTDs mounted
    in thermowells, design cabling for sacrificial failure that preserves the RTD,
    and consider indirect temperature proxies (e.g. tube expansion measurement or
    thermal modelling) to reduce capital and O&M costs — the v1.3+ RTD arrangement
    was not maintainable in service.
