- record_id: ARENA-DLV-30004
  source_title: Kogan Creek Solar Boost Final Report
  publish_date: '2016-09-05'
  project_name: Kogan Creek Power Station Solar Boost Project
  what_happened: The majority of economiser boiler tubes rapidly corroded both before
    and after installation. The tubes used a proprietary 'Solonyx' coating developed
    by AREVA Solar, which AREVA discontinued shortly after the production run for
    this project. Superheater tubes using conventional nickel plating were not affected.
  lesson_learnt: Avoid specifying proprietary coatings or materials that have not
    been proven in comparable field conditions and for which the supplier has no long-term
    commitment — AREVA's rapid discontinuation of the Solonyx coating following the
    production run indicates it was not commercially mature, and the corrosion failure
    could have been avoided by requiring commercially available, third-party certified
    coatings from the outset.
