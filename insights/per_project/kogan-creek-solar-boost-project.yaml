- record_id: ARENA-DLV-30013
  source_title: Kogan Creek Solar Boost Final Report
  publish_date: '2016-09-05'
  project_name: Kogan Creek Power Station Solar Boost Project
  what_happened: The project delivery contract and funding model did not adequately
    account for the early-stage nature of the CLFR technology, the technology provider's
    limited commercial experience, and the construction cost risks associated with
    a first-of-a-kind deployment. The EPC model placed reliance on a single contractor
    who was simultaneously the technology developer, creating a single point of failure.
  lesson_learnt: For new technology projects where the EPC contractor is also the
    technology developer, the funding and delivery model must explicitly address what
    happens if the technology provider withdraws — the Solar Boost model had no viable
    fallback when AREVA Solar exited the CSP market, and the proponent was left holding
    stranded assets with no path to completion.
  issue_severity: critical
  project_type: generation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: approvals/contracting
  proponent_type: utility/energy retailer
  delay_category: financing/commercial close
  failure_mode: coordination & stakeholders
  outcome_class: discontinued/not progressed
  secondary_failure_mode: commercial & market
  intervention_note: CS Energy secured a licence to AREVA Solar's intellectual property
    rights in the v1.3+ technology as a contingency measure, but this did not provide
    a viable completion path in the absence of the technology provider's technical
    capability.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: solar thermal
  source_pages: &id013
  - 5
