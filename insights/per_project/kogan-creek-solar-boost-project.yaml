- record_id: ARENA-DLV-30006
  source_title: Kogan Creek Solar Boost Final Report
  publish_date: '2016-09-05'
  project_name: Kogan Creek Power Station Solar Boost Project
  what_happened: The v1.3+ CLFR technology deployed a 'two half' boiler design — two
    separate boilers per receiver with common external piping and valves — which created
    control challenges in balancing flow and temperature in each half and maintaining
    stable steam flows without flow choking and resultant overtemperatures.
  lesson_learnt: The 'two half' boiler tube design in AREVA Solar v1.3+ CLFR technology
    creates inherent flow and temperature control instability — future deployments
    of CLFR technology should require the single-superheater-tube architecture used
    in the v2 design, which addresses this control problem.
  issue_severity: moderate
  project_type: generation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: AREVA Solar's v2 design resolved this issue by using one central,
    larger superheater tube rather than two separate boiler halves.
  transferability: narrow
  delay_magnitude: null
  technology_domain: solar thermal
  source_pages: &id006
  - 11
  - 12
  evidence_excerpt: The supplied design had the boiler tubes in two separate halves
    – effectively two separate boilers per receiver; with common boiler external piping
    and valves, rather than a single superheater tube. This 'two half' design resulted
    in control challenges to balance the flow and temperature in each 'half' and maintain
    stable steam flows from each 'half' without choking the flow in one half with
    resultant over temperatures caused by the low flow. AREVA Solar's v2 design has
    addressed this issue.
