  what_happened: 'A significant integration risk was not identified until after the
    original project risk assessment: the impact on the Kogan Creek steam turbine
    from a sudden reduction in solar steam flow caused by rapidly moving clouds. This
    issue heightened CS Energy''s concerns about the safety and reliability of integrating
    the solar thermal addition with the existing coal-fired power station.'
  lesson_learnt: For solar thermal hybrid additions to existing plant, the risk assessment
    must explicitly model rapid solar irradiance transient events (e.g. cloud shadows)
    and their effect on the host plant's turbine — this risk emerged post-design approval
    and added material uncertainty to integration viability.
