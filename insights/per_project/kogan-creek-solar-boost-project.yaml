  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: No resolution was implemented — AREVA Solar subsequently switched
    to a commercially available third-party coating for other projects, but the Kogan
    Creek tubes were already installed and corroded.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar thermal
  source_pages: &id004
  - 11
  evidence_excerpt: The majority of the economiser boiler tubes rapidly rusted both
    pre and post-installation. These economiser boiler tubes were 'Solonyx' coated
