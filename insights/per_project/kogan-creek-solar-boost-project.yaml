  publish_date: 2018-08
  project_name: Kogan Creek Solar Boost Project
  what_happened: The 44 MWe (125 MWth) Kogan Creek CST project in Queensland was not
    successful, with the document citing technical and contractual difficulties as
    the cause of failure, though it is acknowledged to have contributed valuable learnings.
  lesson_learnt: Technical and contractual risks should be explicitly stress-tested
    and allocated before committing to novel CST integration projects at commercial
    scale — Kogan Creek's failure on both dimensions suggests that neither the technical
    integration nor the contract structure was sufficiently robust for a first-of-kind
    deployment.
