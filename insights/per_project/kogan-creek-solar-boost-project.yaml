- record_id: ARENA-DLV-30012
  source_title: Kogan Creek Solar Boost Final Report
  publish_date: '2016-09-05'
  project_name: Kogan Creek Power Station Solar Boost Project
  what_happened: The project's commercial viability was eroded by the rapid and unanticipated
    decline in solar PV costs between project conception in 2009 and project execution.
    When conceived, solar thermal LCOE was comparable to solar PV; by 2016, solar
    PV had significantly undercut solar thermal on cost, eliminating the commercial
    case for the technology without thermal storage.
  lesson_learnt: Projects with long development-to-construction timelines in rapidly
    evolving technology markets must explicitly reassess commercial viability against
    evolving competing technology costs at each major decision gate — the solar PV
    cost reduction trajectory was observable well before project termination and should
    have triggered an earlier strategic review.
