- record_id: ARENA-DLV-30001
  source_title: Kogan Creek Solar Boost Final Report
  publish_date: '2016-09-05'
  project_name: Kogan Creek Power Station Solar Boost Project
  what_happened: The Solar Boost project was discontinued on 18 March 2016 after construction
    stalled. AREVA Solar suspended site works in January 2013, the mechanical erection
    subcontractor demobilised mid-contract, and AREVA's parent announced its exit
    from the concentrated solar power business in August 2014. The project could not
    be commercially deployed without substantial further financial investment with
    no prospect of a positive return.
  lesson_learnt: When the EPC contractor is the sole technology provider for a first-of-a-kind
    commercial solar thermal project, the proponent must explicitly assess and monitor
    the contractor's financial and strategic commitment to the technology — AREVA's
    corporate decision to exit the CSP market rendered completion impossible and left
    the proponent with no viable path to recovery.
  issue_severity: critical
  project_type: generation
