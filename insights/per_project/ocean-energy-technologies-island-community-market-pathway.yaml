- record_id: ARENA-DLV-50016
  source_title: Ocean Energy Report by Seanergy and Ernst and Young
  publish_date: 2016-06
  project_name: Ocean Energy Technologies — Island Community Market Pathway
  what_happened: Multiple industry experts quoted in the report identified island communities with high electricity costs (EUR 200–510/MWh in French overseas territories; comparable diesel generation costs
    in Indonesia and the Philippines) as the primary near-term commercial pathway for ocean energy technologies, because costs are high enough to make ocean energy competitive without subsidy.
  lesson_learnt: Ocean energy project developers should prioritise island markets with high electricity costs as their primary commercial target before attempting to compete in mainland grid markets; the
    cost gap between island diesel generation and ocean energy is currently small enough to support bankable projects, whereas mainland markets require further LCOE reductions that may not occur for a decade.
