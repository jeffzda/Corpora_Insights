- record_id: ARENA-DLV-11015
  source_title: Renewable Energy Options for Industrial Process Heat
  publish_date: 2019-08
  project_name: Visy Waste to Energy CHP Plant, Campbellfield VIC
  what_happened: Although overseas facilities operating similar waste-to-energy systems
    existed, lessons from those facilities did not always translate directly to the
    Visy Campbellfield site due to unique aspects of each facility's technology and
    integration with the waste chain.
  lesson_learnt: Overseas case studies for novel industrial energy systems provide
    valuable reference points but cannot be directly replicated — site-specific integration
    challenges, waste stream characteristics, and regulatory contexts mean each first-of-a-kind
    project requires independent detailed design.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: industrial operator
