- record_id: ARENA-DLV-11014
  source_title: Renewable Energy Options for Industrial Process Heat
  publish_date: 2019-08
  project_name: Visy Waste to Energy CHP Plant, Campbellfield VIC
  what_happened: Visy's waste-to-energy CHP plant at Coolaroo, Campbellfield (first
    of its kind in Australia, commissioned 2011) cost approximately $50 million and
    generated a lower return on investment than normal for Visy. The project faced
    significant technical challenges in removing metals and PVC from the waste stream
    and involved bespoke design risks from assembling the system from conventional
    components outside a turnkey arrangement. The primary economic drivers were landfill
    charge reduction, then natural gas displacement, with electricity generation only
    a minor driver.
  lesson_learnt: Waste-to-energy CHP projects assembled from conventional components
    on a 'for project' basis introduce bespoke design risk — engaging someone with
    prior overseas experience in similar systems is a key risk mitigation, and the
    business case must be built on avoided disposal costs rather than energy value
    alone.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: construction/installation
  proponent_type: industrial operator
  delay_category: commissioning/integration
  failure_mode: unvalidated integration
  outcome_class: successful demonstration
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Brought in someone with previous overseas experience in similar
    facilities to manage bespoke design risks; major thermal equipment (boiler and
    feed) delivered as turnkey item while other components assembled in-house.
  transferability: moderate
  delay_magnitude: null
  technology_domain: bioenergy
