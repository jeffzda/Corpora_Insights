  project_name: UNSW – Waste Biomass to Renewable Hydrogen
  what_happened: The UNSW waste biomass reforming project achieved up to 15% greater energy efficiency than commercial electrolysers and demonstrated a 95% waste sugar recovery rate, leading to a follow-on
    collaboration with Rio Tinto to integrate the reactor with an organic waste management process.
  lesson_learnt: Hydrogen production projects using waste biomass feedstocks should actively engage with industrial waste producers (e.g. mining, agriculture) as potential early-stage partners — the dual
    value proposition of waste processing and hydrogen production creates a stronger commercialisation narrative than hydrogen alone.
