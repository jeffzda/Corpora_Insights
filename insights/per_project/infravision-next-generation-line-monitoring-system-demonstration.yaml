  publish_date: 2025-01
  project_name: TL-39 Next-Gen Dynamic Line Monitoring Trial
  what_happened: High wind conditions caused unexpected oscillations in sensor units,
    which introduced excessive noise in LiDAR point cloud data, undermining the reliability
    of the dynamic line rating model.
  lesson_learnt: Integrate a tuned mass damper into sensor hardware and implement
    point-cloud software filtering for stability thresholds — oscillation-induced
    LiDAR noise in high winds will otherwise render sag data unreliable for DLR calculations.
