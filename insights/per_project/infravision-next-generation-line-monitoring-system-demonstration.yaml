- record_id: ARENA-DLV-31355
  source_title: Infravision - Next Generation Line Monitoring System Demonstration
    Project - Knowledge Sharing Report
  publish_date: 2025-01
  project_name: TL-39 Next-Gen Dynamic Line Monitoring Trial
  what_happened: Movement of the overhead earth wire caused positioning inconsistencies
    and misalignments in sensor readings, reducing the accuracy of sag measurements
    derived from ground-based GPS reference points.
  lesson_learnt: Use static GPS points (RTK) directly on the sensor unit rather than
    ground-based measurements to eliminate errors caused by overhead earth wire movement
    — ground-based reference points are unreliable for LiDAR calibration on dynamic
    overhead lines.
  issue_severity: moderate
  project_type: network/grid
