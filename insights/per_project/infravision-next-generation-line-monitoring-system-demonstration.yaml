  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: The sensor form factor was redesigned from a linear/square profile
    to a spherical design, incorporating elements aligned with standard industry marker
    balls, which reduced rocking and improved sag measurement accuracy by 10–30%.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: grid/system stability
  source_pages:
