  what_happened: LiDAR sensors on spans with dense vegetation or tall trees produced
    inaccurate ground clearance measurements because tree canopies partially blocked
    or scattered laser pulses, creating risk of miscalculating sag and tension data
    critical for DLR safety assessments.
