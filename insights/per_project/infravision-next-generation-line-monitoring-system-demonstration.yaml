  evidence_excerpt: Movement of the overhead earth wire introduced inconsistencies
    in positioning, leading to misalignments in sensor readings. The solution has
    since involved transitioning to static GPS points directly on the sensor unit
    utilising RTK, reducing dependency on fluctuating ground-based measurements due
    to the OHEW movement.
