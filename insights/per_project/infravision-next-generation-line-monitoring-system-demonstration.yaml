- record_id: ARENA-DLV-31357
  source_title: Infravision - Next Generation Line Monitoring System Demonstration
    Project - Knowledge Sharing Report
  publish_date: 2025-01
  project_name: TL-39 Next-Gen Dynamic Line Monitoring Trial
  what_happened: Intermittent 4G connectivity and sensor outages disrupted data transfer
    and storage, reducing system availability and affecting the reliability of conductor
    temperature monitoring across the feeder.
  lesson_learnt: Specify and test communications infrastructure — including SIM card
    provider, packet size, and timestamp intervals — before committing to a deployment
    architecture; public dynamic IP services provide insufficient reliability for
    remote transmission line monitoring.
  issue_severity: moderate
  project_type: network/grid
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: data/validation/testing
  failure_mode: data & measurement
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: SIM card provider was changed from a public dynamic IP service
    to Telstra's M2M network for fixed bandwidth; timestamp intervals were halved;
    and a node-to-gateway solution was scoped for development, increasing availability
    by 10–20%.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: grid/system stability
  source_pages: &id005
  - 11
  - 26
  evidence_excerpt: Communication challenges also impacted system reliability, as
    intermittent connectivity and sensor outages disrupted data transfer and storage
    and overall affecting the system reliability of addressing conductor temperature
    of the feeder. Sim card provider was changed from an original public dynamic IP
    service to Telstra's M2M network for fixed/ known bandwidth capabilities. In conjunction
    with packet size monitoring we were effectively able to increase our availability
    to 10-20%.
