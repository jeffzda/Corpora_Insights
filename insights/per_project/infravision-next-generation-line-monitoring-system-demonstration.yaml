  project_name: TL-39 Next-Gen Dynamic Line Monitoring Trial
  what_happened: The Infravision TNSP heat balance model produced different conductor
    temperature estimates from Transgrid's model due to differing emissivity, absorptivity,
    and elevation factors, requiring calibration to align the two approaches.
  lesson_learnt: Obtain and match the TNSP's specific heat balance equation parameters
    — including emissivity, absorptivity, and elevation/air density factors — before
    conducting DLR validation; undisclosed differences in these parameters will produce
    systematic conductor temperature discrepancies that undermine rating comparisons.
