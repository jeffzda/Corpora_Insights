  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: null
  project_name: Business Model Implementation Project
  what_happened: Ergon Energy recognised that the potential for solar PV and battery
    storage to become cheaper than grid connection could trigger a customer exodus,
    and responded by creating a Network Optimisation division and a Channel Partnerships
    team to systematically incorporate demand management into network planning as
    an equal alternative to traditional network augmentation.
  lesson_learnt: Distribution networks facing DER-driven customer defection risk must
    restructure their internal organisation — specifically creating dedicated teams
    to engage demand management service providers and to embed non-network solutions
    as equal alternatives in network planning — before the threat materialises.
