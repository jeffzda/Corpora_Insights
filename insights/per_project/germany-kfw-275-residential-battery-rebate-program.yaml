  evidence_excerpt: The importance of safety in residential applications; there have
    been unconfirmed accounts of multiple house fires in Germany caused by batteries
    installed under the KfW 275 residential storage rebate program. Batteries are
    high energy sources and it is most important that they are manufactured and installed
    such that the safety of home-owners is not compromised.
