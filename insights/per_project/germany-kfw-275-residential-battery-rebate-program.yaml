- record_id: ARENA-DLV-16263
  source_title: Energy Storage Study
  publish_date: 2015-07
  project_name: Germany KfW 275 Residential Battery Rebate Program
  what_happened: Germany's KfW 275 residential battery rebate program, which provided
    grants of up to 30% of investment for household battery storage paired with solar
    PV, was associated with unconfirmed accounts of multiple house fires. The program
    required recipients to allow DNSPs to remotely control the battery system.
  lesson_learnt: Residential battery incentive programs must prioritise safety standards
    and installer accreditation before or concurrent with rollout — overly generous
    rebates that drive rapid uptake before safety frameworks are established can create
    fire risk and reputational damage; requiring DNSP remote control of subsidised
    batteries is an effective mechanism to capture network value.
