- record_id: ARENA-DLV-23653
  source_title: A Low Emission Biofuel Technology
  publish_date: 2019-03
  project_name: A Low Emission Biofuel Technology
  what_happened: The 20 L/hr bio-oil hydrotreatment demonstration plant was successfully
    designed, constructed, installed, commissioned and operated, advancing the hydrotreatment
    technology TRL from TRL 5 to TRL 7 overall with some aspects reaching TRL 8. Biofuel
    products met the majority of Australian fuel quality standards for petrol and
    diesel.
  lesson_learnt: Bio-oil hydrotreatment at demonstration scale (20 L/hr) can produce
    biofuels meeting most existing Australian fuel quality standards; however, future
    standards should be updated to account for unique characteristics of biofuels
    from lignocellulosic biomass, such as the presence of oxygen-containing functional
    groups.
