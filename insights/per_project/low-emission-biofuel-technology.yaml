- record_id: ARENA-DLV-23651
  source_title: A Low Emission Biofuel Technology
  publish_date: 2019-03
  project_name: A Low Emission Biofuel Technology
  what_happened: The hydrotreatment demonstration plant required large amounts of
    hydrogen, making standard laboratory cylinders inadequate. The project team evaluated
    two supply options — bulk hydrogen tube trailers and on-site hydrogen generation
    — and chose on-site generation due to safety concerns about storing large volumes
    of hydrogen.
  lesson_learnt: 'For R&D or demonstration projects involving large-scale hydrotreatment,
    plan hydrogen supply strategy early: on-site hydrogen generation minimises stored
    hydrogen inventory and reduces safety risk compared with bulk tube trailer storage,
    though it requires continuous operator attention during trials.'
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: internal governance/resourcing
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Installed an on-site hydrogen generator and multi-stage compressor
    to produce high-pressure hydrogen, eliminating the need to store large quantities
    of hydrogen on site.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages: &id001
