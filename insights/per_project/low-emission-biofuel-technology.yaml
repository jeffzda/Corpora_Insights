  - 18
  evidence_excerpt: Common hydrogen cylinders for general laboratory use would no
    longer be adequate. An alternative means of hydrogen supply is required... Finally,
    we decided to choose the second option by installing an on-site hydrogen generator.
  confidence_note: delay_category assigned as internal governance/resourcing because
