- record_id: ARENA-DLV-23655
  source_title: A Low Emission Biofuel Technology
  publish_date: 2019-03
  project_name: A Low Emission Biofuel Technology
  what_happened: The project ran from July 2014 to March 2019 (approximately 57 months)
    and successfully met all stated objectives across three inter-related technology
    components, creating five patents or patent applications and producing 19 peer-reviewed
    publications.
  lesson_learnt: Structuring a multi-component bioenergy demonstration project around
    inter-related technology modules (pyrolysis, hydrotreatment, biocarbon) and combining
    IP protection with active knowledge dissemination (publications, conferences,
    government engagement) is an effective strategy for advancing multiple TRL steps
    simultaneously while preserving commercialisation pathways.
