- record_id: ARENA-DLV-23652
  source_title: A Low Emission Biofuel Technology
  publish_date: 2019-03
  project_name: A Low Emission Biofuel Technology
  what_happened: The 100 kg/hr grinding pyrolysis demonstration plant was successfully
    designed, constructed, commissioned and operated, scaling the technology from
    ~15 kg/hr (proven prior to project) to 100 kg/hr and advancing the TRL from overall
    TRL 5 to TRL 7 with some aspects reaching TRL 8.
  lesson_learnt: Scaling grinding pyrolysis technology by approximately 6–7x within
    a single project phase is achievable while advancing TRL from 5 to 7; accepting
    a wide range of feedstock particle sizes in the same batch (microns to centimetres)
    reduces feedstock preparation costs and broadens commercial applicability.
