- record_id: ARENA-DLV-23654
  source_title: A Low Emission Biofuel Technology
  publish_date: 2019-03
  project_name: A Low Emission Biofuel Technology
  what_happened: Existing Australian fuel quality standards did not fully accommodate
    the characteristics of biofuels derived from non-food lignocellulosic biomass,
    such as the presence of oxygen-containing functional groups, creating a regulatory
    gap for commercialisation of the hydrotreatment outputs.
  lesson_learnt: Projects producing novel biofuels from lignocellulosic biomass should
    proactively engage with standards bodies early, as existing fuel quality standards
    may not accommodate unique biofuel characteristics; engaging regulators during
    the demonstration phase can help shape future standards and reduce commercialisation
    barriers.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: research organisation/university
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The project team noted that future Australian biofuel standards
    should consider unique characteristics of biofuels, including the presence of
    oxygen-containing functional groups, and positioned the project outcomes to inform
    standard formulation.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: bioenergy
  source_pages: &id004
  - 11
  - 12
  evidence_excerpt: The future Australian biofuel standards should consider the unique
    characteristics of biofuels. For example, the presence of oxygen-containing functional
    groups should be encouraged.
  confidence_note: issue_severity set to moderate as the regulatory gap is a meaningful
    commercialisation barrier but did not prevent project completion.
