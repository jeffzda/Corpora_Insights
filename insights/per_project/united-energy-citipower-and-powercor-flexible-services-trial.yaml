  publish_date: '2025-02-07'
  project_name: Flexible Services Program
  what_happened: Customer uptake risk for the Flexible Exports Trial was anticipated
    to be high due to falling feed-in tariff values and the growing incentive to self-consume
    solar; however, survey results showed 87% of customers joined to export more solar
    and 60% rated exporting unused solar as 'very important', with only 3% citing
    the financial incentive as their primary reason.
  lesson_learnt: Do not assume that declining feed-in tariff rates eliminate customer
    motivation for flexible export participation — constrained customers place high
    intrinsic value on their solar export potential independent of tariff rates, and
    releasing an existing export constraint is a stronger incentive than financial
    payments alone.
