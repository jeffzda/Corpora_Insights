  - 7
  - 9
  evidence_excerpt: Solar retailers & installers have suggested to customers with
    controlled load to rewire their hot water load to main meter. This would justify
    solar retailers & installers to sell larger system. Customers replaced their electrical
    hot water unit with gas unit, either as part of equipment failure or knockdown
    rebuilds. Typically, distributors are not notified when this occurs.
