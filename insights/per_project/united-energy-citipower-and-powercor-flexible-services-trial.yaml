- record_id: ARENA-DLV-29503
  source_title: 'Flexible Services Program: Lessons Learnt'
  publish_date: null
  project_name: Flexible Services Program
  what_happened: An internal pilot of hot water load shifting found no significant
    impact on customers' hot water supply under various load-shifting scenarios, but
    could not determine financial bill impacts due to insufficient data points and
    uncontrolled variables including occupancy changes, appliance changes, and weather
    variability.
  lesson_learnt: Design consumer impact pilots for demand flexibility trials with
    sufficient participant numbers and controlled baseline conditions to enable statistical
    conclusions on bill impacts — small pilots with multivariate consumption drivers
    will not yield defensible financial impact assessments.
