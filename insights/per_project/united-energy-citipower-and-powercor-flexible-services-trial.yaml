  what_happened: Retailer engagement on the hot water load shifting strategy revealed
    that retailers are concerned about wholesale market price exposure from daytime
    load shifting and prefer a strategy that provides load predictability with minimal
    impact to their customers and operations.
  lesson_learnt: Engage electricity retailers early when designing hot water load
    control strategies — retailers have direct wholesale market risk exposure from
    load shifting and their preference for predictability should shape the shifting
    schedule design before the strategy is locked in.
