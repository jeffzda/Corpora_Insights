  project_name: Flexible Services Program
  what_happened: Solar non-compliance — customers exceeding their approved export
    limits — was identified as a persistent obstacle to DER optimisation and reduced
    available hosting capacity for Flexible Export trial customers and new connections.
  lesson_learnt: Solar non-compliance with approved export limits is a material and
    ongoing barrier to DER programme delivery — DNSPs should track non-compliant installations
    and consider whether flexible export participation can be used as a pathway to
    bring non-compliant customers into compliance, while acknowledging network constraints
    may prevent this in some areas.
