  project_name: Flexible Services Program
  what_happened: A legal and regulatory review found that the current framework provides
    sufficient flexibility for DNSPs to change controlled load switching periods without
    amending tariff structures, pricing proposals, contracts, or policies, removing
    a perceived regulatory barrier to daytime load shifting.
  lesson_learnt: Before assuming regulatory changes are needed to enable hot water
    load shifting, conduct a review of Tariff Structure Statements, pricing proposals,
    standard connection agreements, and controlled load policies — existing frameworks
    may already permit the required operational changes.
