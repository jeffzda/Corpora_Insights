  failure_mode: data & measurement
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Conducted a desktop assessment using smart meter data to quantify
    actual controllable load and reframed the trial scope accordingly.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: demand response
  source_pages:
