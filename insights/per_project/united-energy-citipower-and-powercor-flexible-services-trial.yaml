  project_name: Flexible Services Program
  what_happened: Establishing a reliable energy consumption baseline for assessing
    customer bill impacts from load shifting proved difficult because many external
    factors — building tenancy changes, behavioural changes, equipment degradation,
    and weather variation — were outside the program's control.
  lesson_learnt: Design HWLC trials with a larger sample size and longer duration
    specifically to reduce the error margin from uncontrolled external factors when
    establishing bill impact baselines — a group of ~30 per cohort is statistically
    insufficient for rigorous financial impact measurement.
