    Australia Ltd and United Energy Services Pty Ltd - Advancing Renewables Program
    Milestone Two'
  publish_date: '2025-02-07'
  project_name: Flexible Services Program
  what_happened: A national framework for CSIP-Aus implementation in Australia was
    found to be absent, creating inconsistency in implementation among stakeholders
    and complicating interoperability between DNSPs and OEMs; this resulted in Energy
    Networks Australia taking a leading role in defining Public Key Infrastructure
    and product testing.
  lesson_learnt: The absence of a national CSIP-Aus framework is a systemic risk for
    all DNSP LV DERMS deployments — projects should engage with ENA and the CSIP-Aus
    working group to contribute to and leverage emerging national standards, rather
    than developing bespoke PKI and testing processes independently.
