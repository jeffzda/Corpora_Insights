  publish_date: '2025-02-07'
  project_name: Flexible Services Program
  what_happened: In the HWLC trial, zero customers voluntarily opted in to daytime
    load shifting despite being invited, while only one customer opted out when notified.
    Customers with controlled loads accepted shifting when mandated but showed no
    voluntary engagement.
  lesson_learnt: Do not rely on opt-in mechanisms to build demand-response participation
    for hot water load shifting — nearly two-thirds of opt-in customers opened the
    email but less than 4% clicked through and zero enrolled. Mandatory shifting with
    proactive notification achieves participation while generating the highest customer
    engagement.
