  project_name: Flexible Services Program
  what_happened: The Flexible Exports Trial attracted poor response from solar installers
    when seeking installation pricing, because the trial size of 100 geographically
    dispersed residential customers presented low commercial value to installers.
  lesson_learnt: When procuring installation services for small, dispersed DER trials,
    a broad outreach to the general installer market will yield poor response rates
    — target larger installer organisations with demonstrated capacity for ad-hoc,
    geographically dispersed work, or aggregate trials to reach a commercially viable
    volume.
