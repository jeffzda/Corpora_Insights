- record_id: ARENA-DLV-29502
  source_title: 'Flexible Services Program: Lessons Learnt'
  publish_date: null
  project_name: Flexible Services Program
  what_happened: 'Two specific causes were identified for the loss of controllable
    hot water loads from the trial base: solar retailers and installers had advised
    customers to rewire hot water loads to the main meter (to justify selling larger
    solar systems), and customers had replaced electric hot water units with gas units
    without notifying the distributor.'
  lesson_learnt: DNSPs should establish notification mechanisms and data-matching
    processes to capture when customers rewire or replace electric hot water units
    — the current absence of such processes means controlled load registers become
    inaccurate over time, undermining demand-flexibility programs.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: development/design
