  source_title: Demand Response Short Notice RERT Trial Year 2 Report
  publish_date: 2020-09
  project_name: Demand Response Short Notice RERT Trial
  what_happened: AGL's residential BDR program (Peak Energy Rewards) found that 41%
    of Year 2 outcomes were false positives — customers who reported doing nothing
    to reduce consumption but whose test results indicated they had reduced relative
    to baseline — while 25% of customers attempted to reduce but did not earn a reward.
    Approximately 30% of participants had rooftop PV systems.
  lesson_learnt: Baseline methods for residential BDR programs are highly susceptible
    to false positive and false negative errors when participants have high rooftop
    PV penetration — program designers must account for PV in baseline calculation
    design or risk systematically misstating DR delivery.
