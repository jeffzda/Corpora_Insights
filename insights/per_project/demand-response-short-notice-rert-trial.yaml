  what_happened: Powershop's research found that customers who sign up to BDR programs
    are already more power-conscious and therefore less able to make large reductions,
    while less engaged customers remain apathetic and difficult to reach — creating
    a structural ceiling on BDR program growth.
  lesson_learnt: Self-selection bias in BDR recruitment limits program growth potential
    — proponents should design opt-out or 'surprise' engagement strategies targeting
    non-enrolled customers rather than relying solely on opt-in recruitment, which
    progressively exhausts the most responsive customer segments.
