  project_name: Demand Response Short Notice RERT Trial
  what_happened: Several participants noted that financial incentives and subsidised
    equipment were considerable drivers of customer participation in the RERT trial,
    and expressed concern that recruitment would face additional barriers without
    such subsidies. They also noted uncertainty where the RERT program interacts with
    other DR applications such as AusNet Services' Critical Peak Day network tariff.
  lesson_learnt: DR program participation is substantially driven by financial incentives
    and subsidised equipment — program designers transitioning from subsidised trials
    to commercial market operation should anticipate a material drop in participation
    rates and plan for incentive structures that partially replicate these drivers,
    while ensuring clear regulatory demarcation between the RERT and other DR mechanisms.
