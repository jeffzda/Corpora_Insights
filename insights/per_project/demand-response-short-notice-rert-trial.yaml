  source_title: Demand Response Short Notice RERT Trial Year 2 Report
  publish_date: 2020-09
  project_name: Demand Response Short Notice RERT Trial
  what_happened: DR aggregators consistently over-recruited capacity relative to contracted
    levels (approximately 117–119% overall across periods) as a standard risk management
    practice, reflecting the structural uncertainty of end-customer availability and
    variable load at the time of events.
  lesson_learnt: DR program designers should budget for and formalise over-recruitment
    buffers of at least 15–20% above contracted capacity to reliably meet delivery
    obligations, given that end-customers cannot be guaranteed to deliver their committed
    load reduction on any given occasion.
