  what_happened: EnergyAustralia's VPP program experienced only modest growth and
    remained relatively small despite garnering more customer interest than the load
    control program. Key barriers included high battery storage system costs, compatibility
    issues between battery storage systems and inverters causing inverters to go offline,
    and expensive aggregation platforms needed to accommodate multiple battery and
    inverter types.
  lesson_learnt: VPP programs aggregating residential BTM batteries face compounding
    technical and cost barriers — battery-inverter compatibility failures, multi-vendor
    aggregation platform costs, and high customer acquisition costs collectively constrain
    program scale; proponents should standardise on a limited set of compatible hardware
    configurations before attempting large-scale VPP deployment.
