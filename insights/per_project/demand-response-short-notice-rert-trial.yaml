- record_id: ARENA-DLV-16905
  source_title: Demand Response Short Notice RERT Trial Year 2 Report
  publish_date: 2020-09
  project_name: Demand Response Short Notice RERT Trial
  what_happened: Portfolios with 10-minute notification periods exceeded contracted
    DR volume in both testing periods, while 60-minute notification portfolios failed
    to meet contracted volume in Testing Period 1, primarily due to underperformance
    of C&I portfolios on the longer notification window.
  lesson_learnt: C&I customers operating on 60-minute notification periods carry higher
    delivery risk than those on 10-minute automated notification — program designers
    should recognise notification period as a key reliability variable and not assume
    longer notification times improve reliability for C&I customers.
