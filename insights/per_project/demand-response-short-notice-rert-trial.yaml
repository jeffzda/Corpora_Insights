  what_happened: Both AGL and EnergyAustralia found that C&I customers strongly resist
    allowing external parties to remotely control loads within their operations, with
    EnergyAustralia's entire C&I portfolio dispatched through manual processes. Both
    identified near real-time metering data as a key enabler, requiring involvement
    of Metering Data Providers.
  lesson_learnt: C&I DR programs must be designed around manual dispatch as the default,
    since most customers will not accept external load control — proponents should
    invest in near real-time metering visibility for both the aggregator and the customer
    as this is the primary lever available to improve manual dispatch performance.
