  source_title: Demand Response Short Notice RERT Trial Year 2 Report
  publish_date: 2020-09
  project_name: Demand Response Short Notice RERT Trial
  what_happened: South Australia experienced under-recruitment in both periods of
    Year 2 (67.2% and 91.7% of contracted levels), driven by a contracted level increase
    for one participant that was not matched by recruitment, resulting in a delivery
    shortfall in Period 1 of approximately 1.4 MW.
  lesson_learnt: When contracted capacity targets are increased between program periods,
    recruitment targets must be updated simultaneously — a lag between contracting
    and recruitment creates delivery risk, particularly in smaller or tighter state-level
    markets.
