  source_title: Demand Response Short Notice RERT Trial Year 2 Report
  publish_date: 2020-09
  project_name: Demand Response Short Notice RERT Trial
  what_happened: Intercast & Forge, a South Australian foundry providing DR from its
    own operations by shutting down furnaces, consistently exceeded contracted capacity
    across all periods it was called upon, but in Year 1 Period 2 chose not to curtail
    operations for commercial reasons despite initially accepting the request.
  lesson_learnt: Single-site industrial DR providers that self-curtail face inherent
    commercial conflict-of-interest risks — program administrators should design contracts
    with clear penalty or notification provisions for last-minute refusals, and should
    not rely solely on industrial self-curtailment as a reliable DR source without
    commercial commitment mechanisms.
