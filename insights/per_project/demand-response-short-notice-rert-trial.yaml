  publish_date: 2020-09
  project_name: Demand Response Short Notice RERT Trial
  what_happened: In Year 2, participants collectively delivered more DR capacity than
    contracted in both testing periods — 110.4% of contracted in Period 1 (192.2 MW
    vs 174.0 MW) and 132.9% in Period 2 (233.8 MW vs 176 MW), a significant improvement
    over Year 1 when only 5 of 10 portfolios met or exceeded contracted capacity in
    Period 1.
