  source_title: Demand Response Short Notice RERT Trial Year 2 Report
  publish_date: 2020-09
  project_name: Demand Response Short Notice RERT Trial
  what_happened: Residential DR portfolios consistently under-delivered against contracted
    capacity in both testing periods (84.0% in Period 1 and 84.3% in Period 2), while
    C&I portfolios over-delivered (113.8% and 138.7% respectively). Residential portfolios
    represented only approximately 5% of total recruited DR capacity.
  lesson_learnt: Residential demand response is structurally less reliable than C&I
    — program designers should weight contracted capacity heavily toward C&I customers
    and treat residential contribution as a supplementary buffer rather than a dependable
    core.
