  what_happened: Flow Power observed in Year 1 that customers tend to provide one-third
    to one-half of their maximum demand during test activations, and responded by
    implementing very significant over-recruitment in Year 2, resulting in consistently
    delivering materially more MW than contracted.
  lesson_learnt: C&I DR aggregators should calibrate over-recruitment targets using
    observed actual-to-maximum-demand delivery ratios from live activations, not theoretical
    customer commitments — a default expectation that customers will deliver 33–50%
