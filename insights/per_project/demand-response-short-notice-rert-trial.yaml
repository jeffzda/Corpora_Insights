  source_title: Demand Response Short Notice RERT Trial Year 2 Report
  publish_date: 2020-09
  project_name: Demand Response Short Notice RERT Trial
  what_happened: AGL's trial of direct load control of air conditioners under AS4755
    found that many compatible models required additional hardware, installation was
    complex and costly, a significant number of units did not respond correctly to
    remote control commands, and the standard provided no customer opt-out capability.
    Of 123 original expressions of interest, only 45 homes had compatible equipment.
    AGL concluded retrofitting under AS4755 is not viable and discontinued the program.
  lesson_learnt: Retrofitting direct load control to existing residential air conditioning
    equipment under AS4755 is not currently viable for DR programs — the standard
    lacks opt-out provisions, compatibility rates are low, hardware costs are high,
    and command execution is unreliable; proponents should avoid this pathway until
    the standard and equipment ecosystem mature.
