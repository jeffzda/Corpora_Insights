- record_id: ARENA-DLV-16934
  source_title: Demand Response Short Notice RERT Trial Year 2 Report
  publish_date: 2020-09
  project_name: Demand Response Short Notice RERT Trial
  what_happened: The 10-of-10 baselining method remained problematic for loads lacking
    high consistency throughout Year 2, as it was in Year 1. Participants flagged
    its unsuitability for variable or weather-sensitive loads, and the issue required
    ongoing attention through the trial. The AEMC formally acknowledged the trial's
    findings and committed to reflecting baselining improvements in the Wholesale
    Demand Response Mechanism.
  lesson_learnt: No single baseline methodology is suitable for all DR load types
    — program administrators must either adopt multiple approved baseline methods
    or build in a process for participants to develop and have accepted alternative
    approaches before the program commences, rather than attempting to resolve methodology
    disputes during live program operations.
