  project_name: Demand Response Short Notice RERT Trial
  what_happened: AGL observed that the pool of suitable new C&I customers available
    for DR recruitment was diminishing, potentially because a high proportion of eligible
    C&I loads in NSW had already been contracted by AGL or other participants. Single-shift
    businesses operating on normal business hours also presented reliability challenges
    since RERT events typically occur in the late afternoon to early evening.
  lesson_learnt: C&I DR market saturation is a real constraint in mature trial jurisdictions
    — proponents should map existing contracted loads across all aggregators before
    setting recruitment targets, and should explicitly exclude single-shift businesses
    whose operational hours preclude reliable late-afternoon event response.
