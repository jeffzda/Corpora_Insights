  source_title: Demand Response Short Notice RERT Trial Year 2 Report
  publish_date: 2020-09
  project_name: Demand Response Short Notice RERT Trial
  what_happened: EnergyAustralia found that large C&I businesses joined the RERT program
    primarily for business continuity reasons rather than grid stability motivations,
    while smaller C&I customers (especially those for whom energy is not a significant
    input cost) were more reluctant to join and required simple, non-obligatory, opt-out-capable
    program designs.
  lesson_learnt: C&I DR recruitment messaging must be tailored by business size and
    energy intensity — large businesses respond to business continuity framing; smaller
    businesses with low energy cost share require zero-obligation, opt-out-capable
    designs; grid stability arguments are not effective selling points for either
    segment.
