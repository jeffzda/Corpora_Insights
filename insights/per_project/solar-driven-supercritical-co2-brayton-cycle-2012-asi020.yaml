- record_id: ARENA-DLV-40351
  source_title: 'In The Spotlight: Australian Solar Energy R&D Outcomes and Achievements
    in a Global Context'
  publish_date: 2018-07
  project_name: Solar-driven Supercritical CO2 Brayton Cycle (2012/ASI020)
  what_happened: During on-sun operation of the sCO2 flow loop at CSIRO's solar tower
    facility, traditional seal materials in reciprocating pump seals and valve seats
    deteriorated at an advanced rate under the conditions required for sCO2 power
    cycle operation, resulting in short life spans for these components.
  lesson_learnt: Seal and valve seat material compatibility with supercritical CO2
    must be specifically validated before finalising component selection for sCO2
    systems — standard carbon-based seal materials deteriorate rapidly under sCO2
    operating conditions and require dedicated materials development in partnership
    with pump manufacturers.
