- record_id: ARENA-DLV-72270
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: '2015'
  project_name: SA Power Networks Tariff Modelling Project (Project ID 305)
  what_happened: SA Power Networks modelled four network tariff scenarios over a 20-year
    forecast period and found that energy-based tariffs (Inclining Block Tariff and
    Time of Use) over-signal the value of embedded generation and drive a 'death spiral'
    of increasing cross-subsidy and network prices, while maximum demand tariffs moderated
    this effect.
  lesson_learnt: Network tariffs based on maximum demand lead to reduced cross-subsidy,
    more efficient DER investment choices, and more sustainable network price paths
    compared to energy-based tariffs such as IBT or TOU — regulators and network businesses
    should consider transitioning to demand-based tariff structures as DER penetration
    increases.
