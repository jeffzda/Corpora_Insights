  source_title: Lessons Learnt - Whitsunday Solar Farm Securing Project Funding
  publish_date: 2017-10
  project_name: Whitsunday Solar Farm
  what_happened: The relatively immature large-scale solar market in Australia at
    the time of the project meant there was limited information available for long-term
    O&M cost estimates and availability assumptions, creating uncertainty in the financial
    model used for debt sizing.
  lesson_learnt: Commission an independent review of long-term O&M cost and availability
    assumptions for large-scale solar before commencing project financing — the lack
    of established benchmarks in an immature market creates model uncertainty that
    financing parties will penalise through more conservative debt sizing and higher
    pricing.
