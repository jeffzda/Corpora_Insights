  source_title: Lessons Learnt - Whitsunday Solar Farm Securing Project Funding
  publish_date: 2017-10
  project_name: Whitsunday Solar Farm
  what_happened: The Marginal Loss Factor (MLF) was identified as a project variable
    with significant financial impact, but there was no established market norm for
    MLF forecasting methodology or choice of consultant, leading to risk that different
    financing parties would not accept the MLF forecasts.
  lesson_learnt: Conduct preliminary MLF modelling before commencing the financing
    process to assess project viability, and select a 'bankable' consultant whose
    MLF methodology is acceptable to all financing parties — disagreement over MLF
    forecasts during financing can materially affect financial model outputs and jeopardise
    financial close.
