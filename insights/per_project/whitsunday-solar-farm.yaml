  project_name: Whitsunday Solar Farm
  what_happened: Deviations in technical performance assumptions during the financing
    process caused significant uncertainty and risk for financing parties, as the
    financial model is highly dependent on technical performance signed off by the
    Independent Technical Adviser.
  lesson_learnt: Undertake preliminary yield analysis before commencing the financing
    process to determine possible yield ranges and lock down technical performance
    assumptions — deviations in technical performance during financing create uncertainty
    with financing parties and risk delaying or disrupting financial close.
