  what_happened: Due diligence reports were frequently issued as 'point in time' reports
    rather than final-form documents, resulting in excessive re-writing and additional
    questions from financing parties — increasing transaction cost and extending the
    time to financial close.
  lesson_learnt: Advisers should write due diligence reports in final form from the
    outset, using square brackets for unresolved positions, rather than issuing point-in-time
    reports — the latter generate substantially more rework, additional queries from
    financing parties, and higher advisory fees.
