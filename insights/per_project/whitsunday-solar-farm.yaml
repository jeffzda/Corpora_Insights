- record_id: ARENA-DLV-4620
  source_title: Lessons Learnt - Whitsunday Solar Farm Securing Project Funding
  publish_date: 2017-10
  project_name: Whitsunday Solar Farm
  what_happened: The project achieved a loan maturity of approximately 19 years from
    financial close — the first time CBA had lent on such a long-term basis to an
    Australian renewable energy project — demonstrating that long-tenor non-recourse
    debt for solar PV was achievable in Australia.
  lesson_learnt: Long-tenor non-recourse project finance (approximately 19 years)
    for utility-scale solar PV in Australia is achievable with appropriate structural
    innovation — sponsors pursuing long-term debt should use this transaction as a
    benchmark and be prepared to engage both domestic and international lenders to
    form an appropriate club.
