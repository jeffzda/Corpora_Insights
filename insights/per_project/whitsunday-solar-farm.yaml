  what_happened: The financing process demonstrated that lender-proposed structures
    tended to reflect lender preferences rather than sponsor strategy, requiring sponsors
    to assert their own term sheet from the outset to protect hold/exit strategies
    and risk appetite.
  lesson_learnt: Sponsors should define their 'go/no go' parameters and prepare their
    own term sheet before engaging lenders — financing structures proposed by lenders
    will reflect lender preferences, and allowing lenders to set structural parameters
    risks misalignment with sponsor strategy and risk appetite.
