  source_title: Lessons Learnt - Whitsunday Solar Farm Securing Project Funding
  publish_date: 2017-10
  project_name: Whitsunday Solar Farm
  what_happened: The project employed an N-1 financing structure, where each lender
    in the club had credit approval to fund the transaction without one other lender
    present, materially reducing deliverability risk at financial close.
  lesson_learnt: Run the debt financing process on an N-1 basis — requiring each lender
    in a club to have standalone credit approval to fund the transaction without one
    club member significantly reduces the risk of financial close failing due to a
    single lender withdrawing.
