- record_id: ARENA-DLV-4618
  source_title: Lessons Learnt - Whitsunday Solar Farm Securing Project Funding
  publish_date: 2017-10
  project_name: Whitsunday Solar Farm
  what_happened: Sensitivity analysis required by financing parties for technical
    variables (as opposed to commercial variables) often required additional input
    from the Independent Technical Adviser because the technical due diligence reports
    did not include upper and lower ranges of key variables.
  lesson_learnt: Include upper and lower ranges of key technical variables in the
    technical due diligence report from the outset — this directly supports sensitivity
    analysis required by financing parties and avoids costly and time-consuming supplementary
    requests to the Independent Technical Adviser during the financing process.
