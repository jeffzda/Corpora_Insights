  source_title: Lessons Learnt - Whitsunday Solar Farm Securing Project Funding
  publish_date: 2017-10
  project_name: Whitsunday Solar Farm
  what_happened: Different financing parties had different expectations of appropriate
    contingency levels for large-scale solar projects, reflecting differing risk profiles
    and limited precedent transactions, creating friction in the debt sizing process.
  lesson_learnt: Commission a risk analysis to quantify cost overrun risk and determine
    an appropriate contingency level before commencing financing — differing contingency
    expectations between financing parties reflect the immaturity of the large-scale
    solar market and can be resolved with independent, evidence-based quantification.
