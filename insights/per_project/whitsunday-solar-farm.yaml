- record_id: ARENA-DLV-4602
  source_title: Lessons Learnt - Whitsunday Solar Farm Securing Project Funding
  publish_date: 2017-10
  project_name: Whitsunday Solar Farm
  what_happened: The Whitsunday Solar Farm received ARENA grant funding but was financed
    as part of a three-project portfolio, creating a structural mismatch where ARENA
    funding requirements applied only at the individual project level while debt covenants
    operated at the portfolio level.
  lesson_learnt: Where ARENA grant funding applies to only one project within a portfolio
    financing, sponsors must proactively plan the integration of ARENA requirements
    with lender requirements early — misalignment of obligations and conditions precedent
    between ARENA and project financiers adds significant complexity and risk of delay
    to financial close.
  issue_severity: moderate
  project_type: generation
  project_scale_band: utility/large-scale
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: financing/commercial close
  failure_mode: coordination & stakeholders
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: A more complex regime was developed to differentiate between
    obligations that applied only at the project level versus portfolio level, and
    the different sign-off expectations of ARENA and project financiers were carefully
    managed in parallel.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages:
  - 9
  - 10
  - 11
  evidence_excerpt: Where there is ARENA funding and debt funding, a plan for the
    integration of the ARENA funding requirements to the Projects vis a vis the lenders
    funding requirements needs to be well co-ordinated to achieve Financial Close.
    This is more critical where the financing is a portfolio basis but the ARENA funding
    is limited to one of the projects in the portfolio.
