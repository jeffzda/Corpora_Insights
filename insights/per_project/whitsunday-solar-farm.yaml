  source_title: Lessons Learnt - Whitsunday Solar Farm Securing Project Funding
  publish_date: 2017-10
  project_name: Whitsunday Solar Farm
  what_happened: Policy uncertainty around the wholesale market, LRET and any clean
    energy target post-2020 was identified as a material constraint on sponsors' and
    lenders' ability to structure and price long-term project finance for renewable
    energy assets.
  lesson_learnt: Long-term policy certainty post-2020 — particularly through long-tenor
    offtake mechanisms such as one-way contracts for difference — is a prerequisite
    for reducing the cost of capital for renewable energy project finance; sponsors
    should engage with policy processes and factor policy risk explicitly into financing
    timelines.
