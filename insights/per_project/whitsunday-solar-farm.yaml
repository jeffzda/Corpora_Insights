  source_title: Lessons Learnt - Whitsunday Solar Farm Securing Project Funding
  publish_date: 2017-10
  project_name: Whitsunday Solar Farm
  what_happened: A disproportionate amount of time, cost and energy was spent negotiating
    Direct Agreements — which provide lenders with cure and step-in rights — because
    there were no standardised templates, and counterparties frequently attempted
    to use the Direct Agreement to re-allocate the risk position already agreed in
    principal transaction documents.
  lesson_learnt: The industry should develop standardised Direct Agreement templates
    to reduce the cost and time burden of negotiating lender cure and step-in rights;
    absent such standards, sponsors should anticipate that Direct Agreement negotiation
    will consume disproportionate transaction cost relative to its significance.
