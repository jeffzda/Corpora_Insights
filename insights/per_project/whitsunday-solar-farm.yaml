- record_id: ARENA-DLV-4608
  source_title: Lessons Learnt - Whitsunday Solar Farm Securing Project Funding
  publish_date: 2017-10
  project_name: Whitsunday Solar Farm
  what_happened: Australian lenders regularly referenced Australian market practice
    even when those same lenders had international experience, resulting in more conservative
    terms than international precedents — including higher DSCR thresholds, shorter
    cash sweep triggers, higher arrangement fees, and more restrictive equity cure
    treatment.
  lesson_learnt: Borrowers should understand both international and domestic project
    finance norms before entering negotiations — Australian market practice is materially
    more conservative than international standards on key metrics (e.g. DSCR 1.3x/1.95x
    vs 1.2x/1.8x, arrangement fees 1.5–2% vs 1–1.75%), and familiarity with international
    precedents enables sponsors to negotiate improved terms.
  issue_severity: moderate
  project_type: generation
  project_scale_band: utility/large-scale
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: financing/commercial close
  failure_mode: commercial & market
  outcome_class: successful demonstration
  secondary_failure_mode: coordination & stakeholders
  intervention_note: The project team drew on international market precedents and
    adopted international best-practice structural elements (e.g. equity cure mechanics
    treated as revenue rather than prepayment) to reduce the 'local market premium'
    applied by sponsors.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id006
  - 11
  - 12
  evidence_excerpt: Lenders regularly refer to Australian market practice (even where
    those same lenders have international experience financing renewable energy projects)...
    Adopting international 'best practice' e.g. equity cure mechanics. Specifically,
    equity cure revenues considered for covenant testing can significantly reduce
    the required equity insertion and has a less penalising effect on equity.
