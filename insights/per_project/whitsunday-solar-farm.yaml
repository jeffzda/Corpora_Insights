- record_id: ARENA-DLV-4619
  source_title: Lessons Learnt - Whitsunday Solar Farm Securing Project Funding
  publish_date: 2017-10
  project_name: Whitsunday Solar Farm
  what_happened: International lenders were overrepresented in transactions with significant
    merchant exposure because Australian domestic lenders had a low appetite for long-maturity
    lending, limiting competition and keeping financing costs higher than they would
    otherwise be.
  lesson_learnt: Portfolio managers and market bodies should work to increase competition
    among domestic lenders for partly-merchant renewable energy debt — the current
    overreliance on international lenders for merchant-exposed deals reduces competition
    and sustains higher financing costs; CEFC can play a catalytic role by supporting
    and encouraging competition.
