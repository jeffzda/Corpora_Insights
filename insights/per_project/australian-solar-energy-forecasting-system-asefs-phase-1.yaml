  project_name: Australian Solar Energy Forecasting System (ASEFS) – Phase 1
  what_happened: CSIRO and partners successfully delivered, installed and commissioned the first operational solar energy production forecasting system (ASEFS) into the live AEMO market system by the target
    date of 2 May 2014, covering forecasting timeframes from 5 minutes to 2 years for large-scale PV and solar-thermal plants.
  lesson_learnt: Integrating a solar energy forecasting system into the national electricity market operator's live systems before solar capacity reaches curtailment-triggering levels is essential — without
    such systems, wind and solar generation face increasing curtailment that undermines financial viability.
