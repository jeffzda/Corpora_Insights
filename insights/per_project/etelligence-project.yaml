- record_id: ARENA-DLV-72243
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects - First Edition Results'
  publish_date: '2015'
  project_name: eTelligence Project
  what_happened: The eTelligence Project in Cuxhaven, Germany demonstrated a regional electricity marketplace integrating 650 households with dynamic tariffs, real-time feedback, and a virtual power plant
    operating continuously for one year. Households reduced electricity consumption by an average of 11% with real-time visualisation, and time-variable tariffs achieved load transfers of up to 30%.
  lesson_learnt: Combining dynamic pricing, real-time consumption feedback, and ICT-enabled local energy marketplaces can achieve significant demand response and load shifting — projects designing consumer
    engagement programs should consider integrating price signals with real-time visibility tools rather than deploying either in isolation.
