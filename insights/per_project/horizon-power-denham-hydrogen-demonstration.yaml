  project_name: Denham Hydrogen Demonstration Project
  what_happened: The fuel cell with inverter and solar PV system was found to be unable
    to serve as the sole energy source for the power system because neither can act
    as the voltage reference (isochronous source) or load-follow like a generator
    or BESS. The fuel cell's mechanical limitations mean it cannot supply rapid load
    fluctuations, limiting it to base load supply without voltage and frequency support
    capability.
  lesson_learnt: Hydrogen fuel cell systems with inverters cannot replace synchronous
    generators or BESS as the isochronous source in a microgrid — design any hydrogen-integrated
    microgrid to retain a voltage reference source (diesel generator or BESS) for
    frequency and voltage support; do not assume a fuel cell can fully displace thermal
    generation without additional storage or generation.
