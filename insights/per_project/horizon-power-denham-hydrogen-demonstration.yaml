  secondary_failure_mode: unvalidated integration
  intervention_note: Horizon Power consolidated procurement into a single full-scope
    contract to leverage equipment supplier-installer relationships, reducing interface
    risk despite limiting contractor options.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages: &id002
