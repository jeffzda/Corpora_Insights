- record_id: ARENA-DLV-39551
  source_title: Horizon Power Denham Hydrogen Demonstration Lessons Learnt 1 & 2
  publish_date: 2023-03
  project_name: Denham Hydrogen Demonstration Project
  what_happened: The initial budget estimate for the project was lower than pricing
    indicated by EOI responses, with a significant range of pricing across responses.
    Equipment sizing, particularly the solar farm, was also underestimated, requiring
    compromises to system sizing and energy outcome expectations to align with budget.
  lesson_learnt: Before procurement, validate budget estimates and equipment sizing
    (especially solar farm sizing relative to hydrogen output) against market pricing
    — initial underestimation forced scope compromises. Engage the market early via
    EOI to calibrate expectations before committing to energy output and budget targets.
  issue_severity: major
