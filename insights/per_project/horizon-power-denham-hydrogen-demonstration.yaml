  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Horizon Power engaged an engineering consultant to act as owner's
    engineer and a subject matter expert to complete ignition consequence modelling
    and analysis where gaps in the EPC contractor's deliverables were identified.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages: &id003
