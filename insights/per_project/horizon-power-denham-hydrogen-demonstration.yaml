- record_id: ARENA-DLV-39563
  source_title: Horizon Power Denham Hydrogen Demonstration Lessons Learnt 1 & 2
  publish_date: 2023-03
  project_name: Denham Hydrogen Demonstration Project
  what_happened: Hydrogen regulations in Western Australia had not kept pace with
    the technology at the time of project development. The Gas Standards Act 1972
    framework was not designed for self-produced hydrogen; the definition of 'consumer'
    did not cover on-site electrolysis for own use. No formal Type B appliance approval
    process existed for hydrogen fuel cells in WA, and DMIRS had no hydrogen-specific
    inspectors, accepted standards, or installation guidelines.
  lesson_learnt: Hydrogen projects in Australia must conduct early engagement with
    the relevant state regulator (e.g. DMIRS in WA) to identify gaps in existing legislative
    frameworks — regulations may not cover self-produced hydrogen or hydrogen fuel
    cell Type B appliances, requiring a risk-based compliance approach and documentation
    of due diligence in the absence of formal approval pathways.
  issue_severity: major
  project_type: multi-technology/hybrid
  project_scale_band: demonstration
  lifecycle_phase: approvals/contracting
  proponent_type: utility/energy retailer
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: null
  intervention_note: In the absence of hydrogen-specific regulations, DMIRS accepted
    a risk-based approach using equivalent international standards (HAZID, HAZOP,
    risk assessments, design reviews). Horizon Power documented its due diligence
    process throughout project development.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages: &id013
  - 16
