- record_id: ARENA-DLV-39553
  source_title: Horizon Power Denham Hydrogen Demonstration Lessons Learnt 1 & 2
  publish_date: 2023-03
  project_name: Denham Hydrogen Demonstration Project
  what_happened: Horizon Power wrote the technical specification as a modified hybrid
    diesel/solar/BESS power station specification with performance-based requirements
    rather than prescriptive hydrogen-specific requirements. During design, it became
    clear that Horizon Power lacked general hydrogen experience, process engineering
    capability, and fire/safety risk management knowledge for gas plant and hazardous
    area design.
  lesson_learnt: Where a client organisation has a hydrogen skills gap, the technical
    specification must be developed with specialist input before procurement begins
    — a performance-based specification adapted from a non-hydrogen template is insufficient
    to set and align expectations on design deliverables, HAZOP requirements, and
    O&M documentation for hydrogen systems.
