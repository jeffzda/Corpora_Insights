  delay_category: procurement/supply chain
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Horizon Power proceeded to a Restricted RFT process and entered
    into an Early Works Agreement to order long-lead items in parallel with contract
    documentation and the Financial Investment Decision process.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: hydrogen
