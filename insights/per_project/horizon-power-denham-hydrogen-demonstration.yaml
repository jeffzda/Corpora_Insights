- record_id: ARENA-DLV-39556
  source_title: Horizon Power Denham Hydrogen Demonstration Lessons Learnt 1 & 2
  publish_date: 2023-03
  project_name: Denham Hydrogen Demonstration Project
  what_happened: Denham's cyclone-prone coastal environment and high summer temperatures
    were detailed in the specification but their implications for equipment selection
    were not adequately understood during initial design. Standard off-the-shelf products
    required modification to meet cyclone rating, and the initial design did not adequately
    allow for cooling of the electrolyser and fuel cell containers, necessitating
    a larger evaporative cooling tower system than originally planned.
  lesson_learnt: For remote microgrid hydrogen projects in harsh environments, ensure
    the contractor explicitly works through the implications of stated environmental
    conditions for equipment selection during design — listing conditions in the specification
    is insufficient if neither client nor contractor has experience with how those
    conditions affect hydrogen equipment performance and cooling requirements.
  issue_severity: moderate
  project_type: multi-technology/hybrid
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: construction/installation
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: The design was revised to include a larger evaporative cooling
    tower system to adequately manage heat loads from the electrolyser and fuel cell
    containers under local conditions.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages: &id006
  - 7
  - 8
  evidence_excerpt: The initial design did not adequately allow for the cooling and
    operation of the electrolyser and fuel cell containers, and this resulted in the
    need for a larger evaporative cooling tower system.
