- record_id: ARENA-DLV-39552
  source_title: Horizon Power Denham Hydrogen Demonstration Lessons Learnt 1 & 2
  publish_date: 2023-03
  project_name: Denham Hydrogen Demonstration Project
  what_happened: At the time of EOI in early 2020, no companies in Australia could
    be identified that had completed a renewable hydrogen facility using hydrogen
    directly for electricity generation via a fuel cell in a power system. EPC contractor
    experience in end-to-end hydrogen system integration was absent, limiting contractor
    options due to commercial agreements between hydrogen equipment manufacturers
    and their Australian representatives.
  lesson_learnt: When procuring for a novel hydrogen system, anticipate that no Australian
    EPC contractor will have demonstrated end-to-end integration experience — procurement
    strategy must account for limited contractor options, and synergies of a single
    full-scope contract should be weighed against the risk of concentration with an
    inexperienced single party.
