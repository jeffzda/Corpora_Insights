  failure_mode: unvalidated integration
  outcome_class: delayed but recoverable
  secondary_failure_mode: execution & logistics
  intervention_note: The contractor and subcontractor expanded their resource base
    throughout the design phase, building skills as the project progressed, though
    backfill remained constrained by specialist skill sets.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages: &id004
