  source_title: Horizon Power Denham Hydrogen Demonstration Lessons Learnt 1 & 2
  publish_date: 2023-03
  project_name: Denham Hydrogen Demonstration Project
  what_happened: The immaturity of the hydrogen industry made it difficult to establish
    training, qualification, and competency requirements for personnel who will operate
    and maintain the plant. Major maintenance is expected to require OEM-trained personnel,
    making local upskilling infeasible due to complexity, warranty terms, and frequency
    requirements.
  lesson_learnt: For remote hydrogen facilities, plan for ongoing O&M contracts with
    OEM vendors or their representatives from the outset — local upskilling to full
    maintenance competency is not feasible given complexity and warranty requirements,
    and this dependency must be secured in initial contract negotiations.
