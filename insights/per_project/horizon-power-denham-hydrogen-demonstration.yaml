  delay_category: approvals/regulatory
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: regulatory & approvals
  intervention_note: A leach drain system was designed and procured for the site,
    with environmental approvals obtained to manage wastewater from the cooling system.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hydrogen
