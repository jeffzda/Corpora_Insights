- record_id: ARENA-DLV-39560
  source_title: Horizon Power Denham Hydrogen Demonstration Lessons Learnt 1 & 2
  publish_date: 2023-03
  project_name: Denham Hydrogen Demonstration Project
  what_happened: The electrolyser requires a minimum 30-minute run time after an 8-minute
    start-up at 70–100% load to cycle dryers and produce specification-quality gas.
    Solar farm output could drop below the electrolyser's minimum load during cloud
    events, risking repeated stops and starts, out-of-specification gas production,
    and inefficient use of the hydrogen energy system. The original contract was awarded
    on the basis that a BESS would not be required.
  lesson_learnt: Hydrogen electrolysers connected to intermittent solar require a
    control strategy that accounts for minimum run-time and start-up power requirements
    — an 'energy banking' dispatch algorithm or a BESS must be included in system
    design to prevent repeated starts/stops during cloud events that degrade gas quality
    and reduce electrolyser life.
  issue_severity: major
  project_type: multi-technology/hybrid
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: commissioning/integration
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: A 'solar banking' and 'interval banking' dispatch control algorithm
    was developed so the electrolyser only starts when sufficient banked renewable
    energy ensures completion of the start-up sequence, avoiding stops and starts
    during scattered cloudy days.
  transferability: broad
  delay_magnitude: not quantified
