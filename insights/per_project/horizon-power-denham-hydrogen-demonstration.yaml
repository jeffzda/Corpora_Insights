  what_happened: After design development, it became apparent that a BESS — which
    had been explicitly excluded from the original contract scope — would likely be
    beneficial or necessary for any future hydrogen system relying heavily on intermittent
    renewables, to power electrolyser start-up cycles and provide smoothing and operational
    reserve. The project was already committed to a non-BESS approach and explored
    alternative control solutions.
  lesson_learnt: Future hydrogen-from-renewables systems should include a BESS with
    sufficient capacity to power several electrolyser start-up cycles and provide
    renewable smoothing and operational reserve — omitting BESS from the original
    scope constrains design options and may force complex compensating control strategies
    that do not fully resolve the underlying intermittency problem.
