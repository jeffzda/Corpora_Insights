- record_id: ARENA-DLV-39557
  source_title: Horizon Power Denham Hydrogen Demonstration Lessons Learnt 1 & 2
  publish_date: 2023-03
  project_name: Denham Hydrogen Demonstration Project
  what_happened: The requirement for a water cooling tower system was not understood
    at an early design stage, leading to underestimation of potable water requirements
    and underestimation of wastewater volumes. Denham has only two reticulated water
    supplies (drinking quality and saline), making water a scarce resource. The wastewater
    issue required installation of a leach drain system and associated environmental
    approvals because the power station site had no sewerage connection.
  lesson_learnt: For remote hydrogen sites, explicitly assess water availability (potable
    supply capacity), wastewater disposal infrastructure, and sewerage connections
    during feasibility — the cooling tower water demand and wastewater volumes for
    hydrogen equipment are easily underestimated and can trigger additional approvals
    and infrastructure requirements in water-scarce locations.
  issue_severity: moderate
  project_type: multi-technology/hybrid
  project_scale_band: demonstration
  lifecycle_phase: development/design
