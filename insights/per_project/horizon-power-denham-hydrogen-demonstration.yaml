- record_id: ARENA-DLV-65369
  source_title: Denham Hydrogen Demonstration Project Construction and Commissioning
    Report
  publish_date: 2024-05
  project_name: Denham Hydrogen Demonstration Project
  what_happened: PEM electrolysers demonstrated a controlled step response from 35%
    to 100% load (and vice versa) within 10 seconds during commissioning, with ramp
    rates of 24.7 kW/s up and 30.9 kW/s down. This performance closely matched the
    rate of change of the dedicated solar farm during cloud events, exceeding initial
    expectations and demonstrating the electrolysers' potential as controlled loads
    for grid management.
