  publish_date: 2024-05
  project_name: Denham Hydrogen Demonstration Project
  what_happened: The NEL PEM electrolysers were originally designed for on-demand
    hydrogen generation (filling a tank to a set pressure), not for dynamically following
    an intermittent solar input. Their operational constraints — including 8-minute
    startup sequences, 30-minute minimum run times, and ramp rate limits — were incompatible
    with the project's solar-dispatch use case, requiring development of novel dispatch
    control algorithms.
  lesson_learnt: When specifying electrolysers for solar-coupled operation, confirm
    that the OEM's control design supports variable-input dispatch — standard OEM
    firmware assumes stable input or on-demand output; solar-following applications
    require bespoke dispatch algorithms and should be scoped and costed explicitly.
  issue_severity: moderate
  project_type: storage
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: commissioning/integration
  failure_mode: unvalidated technical assumptions
  outcome_class: delayed but recoverable
  secondary_failure_mode: unvalidated integration
  intervention_note: The team developed three custom control strategies (dispatch
    limits with interval averaging, interbanking, and solar banking) which, when commissioned,
    demonstrated that non-solar energy consumed by the electrolysers was less than
    0.02% of total electrolyser consumption over the test period.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages: &id025
