  what_happened: Integrating the fuel cell (PowerCell PS-100) with its DC-DC converter
    and a grid-interfacing inverter proved highly complex because no prior record
    existed of these three components operating together. The initial virtual generator
    mode (VGM) approach was unsuccessful, requiring substantial rework, alternative
    solution testing, and engagement with manufacturers before a workable direct conversion
    mode was identified.
  lesson_learnt: When integrating novel combinations of fuel cell, DC-DC converter,
    and grid inverter, do not assume that control modes proven in other applications
    (e.g. BESS virtual generator mode) will transfer — verify compatibility through
    testing with all three components together at the earliest opportunity, and consider
    manufacturer-packaged solutions with pre-tested integrated control systems to
    reduce bespoke integration risk.
