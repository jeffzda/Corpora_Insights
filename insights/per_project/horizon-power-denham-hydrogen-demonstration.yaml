  what_happened: The electrolyser load of 360kW was proportionally high relative to
    the Denham town maximum load of approximately 1,650kW, creating power system stability
    risks. Using large renewable systems to supply the electrolyser required high
    operating reserve, and spinning reserve on diesel/gas generators needed to increase
    to mitigate outage risks if the electrolyser tripped.
  lesson_learnt: When sizing an electrolyser for a small remote microgrid, assess
    the proportional impact of the electrolyser load relative to total system load
    — a high ratio requires increased spinning reserve on backup generators and may
    necessitate a BESS for renewable smoothing and operating reserve to maintain system
    stability.
