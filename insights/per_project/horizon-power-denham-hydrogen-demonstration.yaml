- record_id: ARENA-DLV-39554
  source_title: Horizon Power Denham Hydrogen Demonstration Lessons Learnt 1 & 2
  publish_date: 2023-03
  project_name: Denham Hydrogen Demonstration Project
  what_happened: The EPC contractor subcontracted hydrogen equipment supply and design
    to a company with experience in individual equipment packages but limited experience
    in integrating the full suite of packages. Combined inexperience of Horizon Power,
    the lead contractor, and the subcontractor resulted in design and engineering
    deliverables going through more iterations than expected, causing significant
    timing delays. COVID-related lockdowns and illness also impacted resourcing, compounding
    delays.
  lesson_learnt: For hydrogen EPC contracts, explicitly assess contractor and subcontractor
    capability across all required engineering disciplines (process, control systems,
    integration) before award — insufficient multidiscipline integration experience
    will cause design iteration cycles that substantially delay the project. Include
    O&M vendor contracts as part of initial contract negotiations given the specialised
    maintenance requirements.
