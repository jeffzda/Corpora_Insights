- record_id: ARENA-DLV-42789
  source_title: Evaluation of ARENA's VPP Portfolio
  publish_date: 2021-06
  project_name: Ergon New Residential Solar PV and Battery Model
  what_happened: The Ergon project cost per MW ($5,292,929/MW including hardware)
    was approximately 6.4 times the large-scale battery benchmark of $827,000/MW,
    the worst cost-efficiency outcome in the portfolio, driven by high hardware and
    ongoing system costs for a small 33-system trial.
  lesson_learnt: Small-scale residential solar-battery service model trials with utility
    ownership of hardware will have very high per-MW costs compared to large-scale
    battery benchmarks; set cost-per-MW benchmarks that are appropriate to the trial
    scale and model (e.g. per-customer service economics) rather than comparing to
    utility-scale benchmarks.
  issue_severity: moderate
  project_type: null
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: government/public-sector body
  delay_category: null
  failure_mode: poor scoping
