  - 79
  evidence_excerpt: The benchmark used was the cost to deploy a large-scale battery
    at $827,000/MW. The cost effectiveness of the project was well in excess of the
    benchmark. With project hardware included, the project costs were $5,292,929 compared
    to the benchmark.
