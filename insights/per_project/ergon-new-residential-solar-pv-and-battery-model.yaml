- record_id: ARENA-DLV-42788
  source_title: Evaluation of ARENA's VPP Portfolio
  publish_date: 2021-06
  project_name: Ergon New Residential Solar PV and Battery Model
  what_happened: 'The Ergon Retail solar PV and battery model pilot was discontinued
    after project completion: batteries were removed from customers'' premises because
    of concerns over system reliability, high ongoing costs, limited customer savings,
    and unsatisfactory customer experience. The pilot did not prove commercially viable.'
  lesson_learnt: Before scaling a utility-owned solar-and-battery service model for
    residential customers, conduct rigorous analysis of ongoing maintenance costs,
    system reliability in field conditions, and customer savings versus service fee
    design; a model that cannot demonstrate customer savings and reliable service
    in a trial will not achieve commercial uptake.
