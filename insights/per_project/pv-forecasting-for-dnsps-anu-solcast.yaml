- record_id: ARENA-DLV-49156
  source_title: Solar Forecasting for Low Voltage Network Operators
  publish_date: 2018-09
  project_name: PV Forecasting for DNSPs (ANU/Solcast)
  what_happened: The low voltage network was designed as a passive, radial, unidirectional
    system with minimal remote monitoring or control capability. The rapid uptake
    of rooftop PV introduced bidirectional power flows and voltage management challenges
    that the existing passive architecture was structurally unequipped to handle.
  lesson_learnt: Distribution networks designed for unidirectional passive operation
    require active management infrastructure (remote monitoring, controllable devices,
    automation) before high PV penetration levels can be safely accommodated; regulators
    and network businesses should plan LV network modernisation investment ahead of,
    not in response to, PV penetration thresholds being reached.
  issue_severity: major
  project_type: network/grid
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: DNSPs deployed interim measures including feeder uprating, line
    drop compensators, export limits, capacity limits, and grid reference voltage
    reduction to manage high-PV impacts within existing passive network architecture.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id006
  - 5
  - 7
  evidence_excerpt: The low voltage network of a distribution system is generally
    passive. Unlike the higher voltage networks, there are very few remotely controllable
    components on the LV network and even less automation. Beyond a certain level
    of PV penetration in a local area, the LV network is not able to operate within
    its required levels of reliability. Information alone is not sufficient to support
    the further penetration of PV.
