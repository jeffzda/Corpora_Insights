- record_id: ARENA-DLV-49152
  source_title: Solar Forecasting for Low Voltage Network Operators
  publish_date: 2018-09
  project_name: PV Forecasting for DNSPs (ANU/Solcast)
  what_happened: The ANU/Solcast project successfully delivered short-term PV generation
    forecasts ('nowcasts') to DNSPs, but DNSPs lacked the remotely controllable or
    automated network infrastructure needed to act on those forecasts in real time,
    rendering the operational value of transient cloud cover predictions minimal at
    the time of deployment.
  lesson_learnt: Forecasting capability alone does not deliver operational value —
    invest in the controllable network infrastructure (remotely operable devices,
    smart inverters, grid storage) in parallel with forecast tool development; otherwise
    the forecast output has no actionable pathway and the investment in prediction
    capability is premature for operational use.
  issue_severity: moderate
  project_type: network/grid
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: null
  failure_mode: unvalidated integration
  outcome_class: partial success
  secondary_failure_mode: poor scoping
  intervention_note: The project refocused the near-term value proposition onto load
    flow modelling and planning inputs rather than real-time operational response,
    where data could be used immediately without requiring new controllable infrastructure.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id002
  - 7
  - 9
  evidence_excerpt: While the ANU project may be able to inform the DNSPs that unacceptable
    voltage fluctuations may be occurring, there is little that the DNSPs can do at
    present to mitigate these conditions... DNSPs currently lack the ability to proactively
    respond. Significant investment, as well as some changes in regulations and customer
    attitudes are likely to also be required. Until these investments and associated
    changes in regulation and customer attitudes are made the value of forecasts of
    fluctuations of PV generation due to transient cloud cover is likely to be of
    minimal value to the DNSPs at the operational level.
  confidence_note: null
