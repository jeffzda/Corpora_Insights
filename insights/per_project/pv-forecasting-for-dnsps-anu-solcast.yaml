- record_id: ARENA-DLV-49154
  source_title: Solar Forecasting for Low Voltage Network Operators
  publish_date: 2018-09
  project_name: PV Forecasting for DNSPs (ANU/Solcast)
  what_happened: High PV penetration on low voltage feeders masked the underlying
    native customer load, creating a risk that network capacity could be insufficient
    to meet aggregate demand during periods of extended cloud cover or sudden loss
    of PV generation, with DNSPs unable to detect the risk through conventional metering.
  lesson_learnt: Network planning for high-PV feeders must account for the 'hidden
    load' risk — when PV is supplying most local demand, the recorded grid draw understates
    true customer load; a rapid loss of PV generation (e.g. extended cloud) can then
    cause feeder overload. Load flow studies should incorporate PV generation estimates
    to stress-test worst-case scenarios.
  issue_severity: major
  project_type: network/grid
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: The ANU project data provides historical PV generation estimates
    that can be incorporated into load flow studies to replace assumptions and properly
    account for native load under high-PV conditions.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id004
  - 6
  evidence_excerpt: In situations of extreme and extensive cloud conditions, where
    there is little or no PV generation, all of the load will need to be supplied
    from the grid. In these circumstances there is a risk that the feeder will be
    overloaded, and an outage may occur.
