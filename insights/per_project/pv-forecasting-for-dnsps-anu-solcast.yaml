- record_id: ARENA-DLV-49151
  source_title: Solar Forecasting for Low Voltage Network Operators
  publish_date: 2018-09
  project_name: PV Forecasting for DNSPs (ANU/Solcast)
  what_happened: Net metering on rooftop PV installations meant DNSPs had no visibility
    of actual PV generation — only net import/export was measured — leaving a fundamental
    data gap in load flow modelling and network planning as PV penetration increased.
  lesson_learnt: Design network data collection systems to capture gross PV generation
    separately from net metering data; the absence of this information forces DNSPs
    to rely on assumptions in load flow studies, reducing planning accuracy at high
    PV penetration levels.
  issue_severity: major
  project_type: network/grid
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: null
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: The ANU/Solcast project developed a system generating PV output
    estimates every 10 minutes by mapping installed PV capacity and network connectivity
    to satellite-derived cloud cover data, providing DNSPs with a historical and near-real-time
    PV generation database.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id001
  - 6
  evidence_excerpt: DNSPs do not know how much electricity was generated by PV systems
    within their network in the past, how much those systems are currently generating,
    or how much they are likely to generate – and when they are likely to generate
    it – in the future. This lack of visibility and consequent lack of information
    complicates and reduces the accuracy of the load flow modelling and other considerations
    that go into the DNSP's forecasting and planning.
  confidence_note: 'project_scale_band reconciled to ''demonstration'' from: demonstration
