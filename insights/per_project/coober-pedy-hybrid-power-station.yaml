  evidence_excerpt: Less than three months after commissioning, the power station achieved a 35 hour period where power was generated solely by renewables with no need for diesel generation. From 1 July
    2017 to 31 December 2017 the plant delivered reliable electricity while saving one million litres of diesel by running without diesel generation for over 1,300 hours.
