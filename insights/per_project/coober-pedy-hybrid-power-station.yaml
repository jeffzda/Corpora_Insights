- record_id: ARENA-DLV-71073
  source_title: Hybrid Power Generation for Australian Off-Grid Mines
  publish_date: 2018-06
  project_name: Coober Pedy Hybrid Power Station
  what_happened: EDL's Coober Pedy power station was hybridised in 2017 using a multi-source configuration (wind, PV, diesel, battery storage and dynamic resistors), achieving a renewable energy fraction
    of 70% under a 20-year PPA. Within three months of commissioning, the system operated for 35 continuous hours on renewables alone, and saved one million litres of diesel in its first six months of operation.
  lesson_wahrnt: null
  lesson_learnt: A well-designed multi-technology hybrid system with enabling technologies (battery smoothing, dynamic resistors) can achieve very high renewable energy fractions (70%) in an off-grid context
    — the Coober Pedy project demonstrates that rapid achievement of milestone performance (35-hour diesel-free operation within 3 months) is achievable with thorough integration design.
