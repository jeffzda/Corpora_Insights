  what_happened: Research and development activities within the project were substantially
    hampered by data integrity and data readiness issues — including data losses,
    network configuration changes, incorrect asset installations, and lack of data
    definitions — preventing research outputs from being deployed as operational technology.
  lesson_learnt: Establish a well-designed Data Governance Framework early in any
    project generating large or sensitive datasets — data integrity issues encountered
    mid-project significantly impaired the ability to convert research outputs into
    operational components and should be anticipated and mitigated at project design
    stage.
