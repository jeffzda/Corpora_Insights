- record_id: ARENA-DLV-3654
  source_title: Indra Monash Smart Energy City Final Report
  publish_date: 2022-03
  project_name: Indra Monash Smart Energy City
  what_happened: A cybersecurity assessment of the Monash microgrid identified specific
    cybersecurity requirements unique to energy systems that differ from general IT
    frameworks, and the process of developing and implementing a Cybersecurity Assessment
    Framework revealed gaps in standard organisational practice when applied to digitalised
    energy systems.
  lesson_learnt: Conduct a cybersecurity assessment specific to energy system requirements
    at the outset of microgrid or DER projects — generic IT frameworks do not address
    the unique exposure of network- and internet-connected energy components, and
    the NIST SP1800-32-aligned framework developed here is a transferable starting
    resource.
