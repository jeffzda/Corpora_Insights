- record_id: ARENA-DLV-42773
  source_title: Evaluation of ARENA's VPP Portfolio
  publish_date: 2021-06
  project_name: Indra Monash Smart City
  what_happened: The Indra Monash project did not achieve its objective of building
    a forecasting and optimisation tool for asset control to maximise the VPP value
    stack by the time of evaluation, and no clear line of sight to commercialisation
    of the product was identified, meaning CRI progression could not be demonstrated.
  lesson_learnt: When funding research-led VPP projects that combine a university
    research partner with a technology vendor, set clear milestone-linked deliverables
    for both technical outputs (e.g. software functionality) and commercial readiness
    evidence; otherwise research development timelines can leave commercial objectives
    unresolved at project end.
