- record_id: ARENA-DLV-3651
  source_title: Indra Monash Smart Energy City Final Report
  publish_date: 2022-03
  project_name: Indra Monash Smart Energy City
  what_happened: The project encountered significant technology integration challenges
    because several selected solutions were early-stage or still in development, leading
    to unanticipated development effort, changes to technical architecture, and delays
    that were not planned for at the outset.
  lesson_learnt: Assess technology maturity and operational readiness of all selected
    solutions before finalising project design — engaging nascent technologies without
    accounting for their development state creates unplanned integration work and
    schedule delays that can substantially affect project execution.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: commissioning/integration
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated integration
  intervention_note: The project adapted the transactive component from a market mechanism
    to a contract mechanism while retaining the original technical architecture, enabling
    project objectives to be met despite the integration challenges.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: DER
  source_pages: &id001
  - 6
  - 7
  evidence_excerpt: The Smart Energy City project faced significant issues overcoming
    technology hurdles associated with the integration and maturity of solutions that
    resulted in significant additional development requirements and changes to the
    technical architecture to ensure that the project stayed true to its objectives.
    These issues most often presented where the project engaged early-stage nascent
    technology. As this is a developing field, some products were still in the development
    phase, which led to delays in some areas of the project as the time to further
    develop these was not anticipated.
