  project_name: Indra Monash Smart Energy City
  what_happened: The project found that regulatory barriers — including restrictions
    on networks considering microgrids and Stand Alone Power Systems — and uniform
    network tariffs that disincentivise self-generation in high-cost-to-serve locations
    remain significant structural obstacles to microgrid deployment beyond the Monash
    campus context.
  lesson_learnt: Future microgrid projects should anticipate and explicitly address
    regulatory barriers and tariff structures that may undermine the business case
    — engaging with regulators on SAPS frameworks and advocating for cost-reflective
    tariffs should be factored into project development planning.
