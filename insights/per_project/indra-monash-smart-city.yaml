- record_id: ARENA-DLV-3657
  source_title: Indra Monash Smart Energy City Final Report
  publish_date: 2022-03
  project_name: Indra Monash Smart Energy City
  what_happened: At project outset, several energy-related value streams the microgrid
    was designed to access (including contingency FCAS, voltage network services,
    and peer-to-pool trading) were not yet commercially accessible, remaining at simulation
    stage only during the project period due to immature markets.
  lesson_learnt: When building a microgrid business case, distinguish between value
    streams that are commercially accessible now and those dependent on market maturity
    — designing a project around nascent value streams (e.g. network services, peer-to-pool)
    creates revenue risk if those markets do not mature within the project timeline.
  issue_severity: moderate
  project_type: DER/customer-side
