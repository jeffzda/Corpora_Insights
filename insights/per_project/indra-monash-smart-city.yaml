- record_id: ARENA-DLV-3656
  source_title: Indra Monash Smart Energy City Final Report
  publish_date: 2022-03
  project_name: Indra Monash Smart Energy City
  what_happened: Integration of brownfield building assets and existing DER into the
    microgrid proved challenging and cost-inhibitive due to inconsistent and unknown
    legacy control systems already deployed in commercial buildings, despite relatively
    low hardware and software costs for the microgrid platform itself.
  lesson_learnt: Budget specifically for brownfield asset integration when deploying
    microgrids in existing commercial precincts — the cost and complexity of integrating
    legacy control systems can substantially exceed hardware and software costs, and
    should be assessed asset-by-asset before project budget is set.
