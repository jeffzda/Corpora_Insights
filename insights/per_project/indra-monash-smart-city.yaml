  proponent_type: research organisation/university
  delay_category: null
  failure_mode: commercial & market
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The project pivoted to focus on accessible value streams (peak
    demand management, DR contracts, export limitation contracts) while continuing
    to simulate and develop the less mature streams.
  transferability: broad
