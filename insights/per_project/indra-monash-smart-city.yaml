- record_id: ARENA-DLV-3660
  source_title: Indra Monash Smart Energy City Final Report
  publish_date: 2022-03
  project_name: Indra Monash Smart Energy City
  what_happened: The microgrid project found that residential and small customer applications
    are significantly harder to commercialise than large precinct deployments due
    to the number of parties involved, modest individual load, and more stringent
    consumer protection frameworks, leading to a conclusion that large precincts are
    the most attractive near-term commercial target.
  lesson_learnt: Target large precincts, commercial offices, and resilience-focused
    residential precincts as priority microgrid deployment contexts — these offer
    the scale, simplified counterparty structure, and infrastructure economies that
    make the business case viable; small customer and fragmented residential contexts
    require further regulatory and cost reduction progress before they become practical.
