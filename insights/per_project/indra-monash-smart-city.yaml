- record_id: ARENA-DLV-42774
  source_title: Evaluation of ARENA's VPP Portfolio
  publish_date: 2021-06
  project_name: Indra Monash Smart City
  what_happened: The Indra Monash project experienced high ARENA project manager turnover
    during the delivery period, which was noted by the funding recipient as a challenge,
    though ARENA's flexibility in contract adjustments was cited as offsetting this.
  lesson_learnt: Minimise project manager turnover on ARENA's side during funded project
    delivery; where turnover is unavoidable, ensure thorough handover documentation
    so that continuity of relationship and project understanding is maintained for
    the funding recipient.
