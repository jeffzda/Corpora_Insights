  secondary_failure_mode: null
  intervention_note: A Cybersecurity Assessment Framework (Guide and Workbook) was
    developed and updated against NIST SP1800-32 guidelines and made available as
    a public resource for future projects.
  transferability: broad
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id004
