- record_id: ARENA-DLV-20712
  source_title: Demand Response Short Notice RERT Trial Year 3 Report
  publish_date: 2021-10
  project_name: DR SN RERT Trial — EnergyAustralia Smart Isolation Switch and Controlled
    Load Circuit programs
  what_happened: EnergyAustralia's Smart Isolation Switch program (for controlling
    water heaters, pool pumps and air conditioners) attracted very few customers despite
    being provided at no cost to the customer and was abandoned; the Controlled Load
    Circuit program was also discontinued after suffering from low customer interest
    and installation costs that could not be recouped.
  lesson_learnt: Residential direct load control programs that require hardware installation
    — even at no cost to the customer — face significant adoption barriers because
    customers are reluctant to cede control of appliances; program designers should
    not assume that financial neutrality on installation costs will overcome customer
    reluctance to allow external control of equipment.
