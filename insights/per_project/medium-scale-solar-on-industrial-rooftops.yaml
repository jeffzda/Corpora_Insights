  what_happened: When EPCT sought a fixed-price EPC contract for the rooftop solar
    installation, no medium or large-scale construction companies were operating in
    the rooftop solar sector; those willing to participate planned to subcontract
    to rooftop installers and charge a premium for oversight, which would have rendered
    the project uneconomic.
  lesson_learnt: For medium-scale rooftop solar projects, avoid seeking a fixed-price
    EPC from general construction contractors — the rooftop solar market lacks established
    EPC contractors at this scale, and those willing to tender will subcontract to
    specialist rooftop installers while charging a significant premium; directly appointing
    experienced rooftop solar installers reduces cost and often improves quality.
