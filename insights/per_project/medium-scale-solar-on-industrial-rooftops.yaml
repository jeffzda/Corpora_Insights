- record_id: ARENA-DLV-41970
  source_title: EPC Technology Smarter Energy Feasibility Study
  publish_date: '2018-07-24'
  project_name: G.James Glass and Aluminium - Medium Scale Solar on Industrial Roof-Tops
  what_happened: EPCT observed that revenues from BESS (energy arbitrage, ancillary
    services) were highly uncertain and that benefits may not necessarily accrue to
    the project proponent under the then-current market and network tariff structures,
    undermining the commercial case for co-located battery storage.
  lesson_learnt: BESS revenue streams from ancillary services and energy arbitrage
    are locationally neutral and subject to significant market uncertainty; do not
    rely on these as primary commercial drivers in project financial models — focus
    the commercial case for BESS on confirmed demand charge reduction benefits, which
    are site-specific and more predictable.
