  what_happened: EPCT initially sought to have all Eagle Farm sites assessed on a
    feeder-by-feeder basis rather than site-by-site, expecting this would maximise
    permitted export volumes; in hindsight this caused delays in the Energex assessment
    process, although EPCT noted it may have been necessary to achieve the final technical
    outcome.
  lesson_learnt: When seeking DNSP connection approval for multiple co-located distributed
    generation sites, consider the trade-off between feeder-level assessment (which
    may unlock higher export limits but extends approval timelines) and site-by-site
    assessment (which is faster but may yield lower approved export capacity); engage
    the DNSP early to determine which assessment pathway is preferred.
