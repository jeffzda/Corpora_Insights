  what_happened: EPCT's proposed reactive power compensation approach using dedicated
    STATCOMs was superseded during the design phase by the discovery that the selected
    SMA Core1 inverters contained equivalent STATCOM functionality and could operate
    in all four quadrants, eliminating the need for separate STATCOM hardware.
  lesson_learnt: Defer finalising ancillary equipment specifications (e.g. reactive
    compensation hardware) until inverter technology selection is complete — inverter-integrated
    reactive power capability may eliminate the need for separate STATCOMs, reducing
    capital cost and system complexity.
