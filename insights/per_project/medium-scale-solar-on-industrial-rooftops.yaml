  source_title: EPC Technology Smarter Energy Feasibility Study
  publish_date: '2018-07-24'
  project_name: G.James Glass and Aluminium - Medium Scale Solar on Industrial Roof-Tops
  what_happened: At some Eagle Farm sites, the maximum permitted export capacity was
    constrained by transformer capacity, requiring the solar system size to be reduced
    — because installing a larger system that would be permanently curtailed was deemed
    uneconomic.
  lesson_learnt: Transformer capacity at the point of connection is a hard constraint
    on export-enabled rooftop solar system size; where upgrading an existing transformer
    is commercially infeasible, system size should be reduced to match the export
    limit — do not oversize a system that will face permanent curtailment, as this
    destroys return on investment.
