  what_happened: EPCT's analysis showed that in area-constrained rooftop scenarios,
    reducing panel tilt by approximately 5 degrees reduces specific yield by up to
    5% but increases system capacity by approximately 40%, resulting in a net 35%
    increase in total energy production and improved ROI through amortisation of fixed
    costs over a larger base.
  lesson_learnt: For area-constrained industrial rooftop solar, optimise system design
    by reducing tilt angle to increase panel density — the capacity and energy production
    gains from packing more panels at lower tilt substantially outweigh the modest
    per-panel yield reduction, improving overall financial returns.
