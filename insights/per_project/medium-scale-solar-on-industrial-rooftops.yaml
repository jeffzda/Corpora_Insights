- record_id: ARENA-DLV-41951
  source_title: EPC Technology Smarter Energy Feasibility Study
  publish_date: '2018-07-24'
  project_name: G.James Glass and Aluminium - Medium Scale Solar on Industrial Roof-Tops
  what_happened: At the outset of the project (late 2016), network requirements mandating
    zero-export devices effectively limited commercial and industrial rooftop solar
    installations to approximately the peak on-site load, severely constraining the
    market for medium-scale rooftop solar.
  lesson_learnt: Network zero-export requirements are a primary barrier to medium-scale
    industrial rooftop solar; projects targeting export-enabled connections must plan
    from the outset to engage the DNSP technically and develop solutions that address
    protection coordination, voltage control, and reverse power flow — simply applying
    for a connection under standard conditions will result in rejection or severe
    size constraints.
  issue_severity: major
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: concept/feasibility
  proponent_type: project developer
  delay_category: grid connection/system studies
  failure_mode: regulatory & approvals
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated integration
  intervention_note: EPCT developed a multi-technology solution (inverter-based reactive
    power control, BESS ramp-rate management, Power Plant Controllers) that directly
    addressed each Energex stability concern, ultimately securing 5,150 kW of export
    capacity across the sites.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id001
  - 5
  - 6
  evidence_excerpt: At the initiation of the Project, solar installations on industrial
    roof tops were generally limited in scale by the local network owner requiring
    a zero-export device to be installed. This limited the scale of systems that could
    be constructed on large industrial roof-spaces to approximately the peak energy
    load on that site.
