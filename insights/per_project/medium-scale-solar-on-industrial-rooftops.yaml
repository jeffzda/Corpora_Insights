    issues with private companies accessing equipment on public land and noted regulations
    were designed only for government-owned network companies.
  lesson_learnt: In Queensland, regulations governing distribution network infrastructure
    on public land are designed for government-owned entities and create material
    uncertainty for private distributed energy developers; engage with DEWS early
    to understand licensing requirements and design solutions (such as behind-the-meter
    configurations) that avoid the need for a distribution licence or dedicated feeder
    on public land.
