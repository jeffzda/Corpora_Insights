- record_id: ARENA-DLV-72012
  source_title: Australian Energy Resource Assessment — Second Edition, 2014
  publish_date: '2014'
  project_name: Small-Scale Hydroelectricity — Australia
  what_happened: Small-scale hydroelectricity systems in Australia have encountered
    difficulty obtaining environmental approval due to uncertainty regarding their
    impact on aquatic fauna, constraining the development of what is otherwise identified
    as the main source of future hydroelectricity growth in Australia.
  lesson_learnt: Small hydro project developers in Australia should invest early in
    fish-impact assessments and engage with the regulatory process for environmental
    approval — uncertainty about impacts on native fish species has been a recurring
    approval barrier; ARENA-supported research into turbine impacts on Australian
    fish species may provide evidence to de-risk future approval processes.
