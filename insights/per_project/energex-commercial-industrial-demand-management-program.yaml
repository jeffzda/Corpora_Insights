  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects - First Edition Results'
  publish_date: '2014'
  project_name: Energex Commercial & Industrial Demand Management Program
  what_happened: Energex's C&I demand management program, initially piloted from 2007, evolved from trials of multiple delivery models into a business-as-usual program achieving planned demand reduction
    targets, with the key enabler being targeted customer recruitment in specific network areas facing medium-term investment pressure rather than broad rollout.
  lesson_warnt: Target demand management programs to specific network areas where capital investment is expected in the medium term rather than deploying broadly — focusing DM recruitment on constrained
    areas improves the cost-effectiveness of avoided investment and creates measurable network benefit.
