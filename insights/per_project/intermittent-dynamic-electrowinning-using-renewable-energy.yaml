  what_happened: The solar resource data showed a significant anomaly in August —
    a deviation from the expected monthly diurnal profile — and the cause could not
    be determined from the available data. The report flagged it as potentially a
    shading issue, sustained poor weather, morning fog, or a time-stamping error in
    the monitoring equipment.
  lesson_learnt: Install redundant data validation mechanisms (cross-checking against
    nearby BOM stations at daily resolution) throughout the monitoring campaign rather
    than only at analysis time; unexplained monthly anomalies in a short-duration
    campaign cannot be resolved retrospectively and may introduce bias into long-term
    resource estimates.
