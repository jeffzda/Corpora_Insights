- record_id: ARENA-DLV-19801
  source_title: Phase 2 - Resource Assessment Report (Butcherbird Renewable Energy
    Resource Review)
  publish_date: 2021-09
  project_name: Butcherbird Renewable Energy Project (Element 25)
  what_happened: The SODAR wind measurement campaign collected only approximately
    15 months of data (462 days) before this resource assessment was conducted. SODAR
    data availability declined sharply with height — from 86% at 100 m to 21% at 200
    m — leaving significant uncertainty in wind resource estimates at prospective
    hub heights above 100 m.
  lesson_learnt: For wind resource assessments supporting commercial investment decisions,
    plan a monitoring campaign of at least 2–3 years and verify that data availability
    at the intended hub height exceeds 85% quality thresholds before committing to
    resource estimates; short campaigns with degraded high-altitude data materially
    increase uncertainty in bankable wind yield assessments.
  issue_severity: moderate
  project_type: industrial decarbonisation
