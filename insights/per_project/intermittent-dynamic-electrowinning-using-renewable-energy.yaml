  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Report recommended continuing the data collection campaign and
    applying power-law wind shear extrapolation from the reliable 100 m dataset as
    an interim approach for preliminary modelling.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: wind
