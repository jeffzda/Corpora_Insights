  publish_date: 2021-09
  project_name: Butcherbird Renewable Energy Project (Element 25)
  what_happened: Wind speed extrapolation from the reliable 100 m SODAR data to higher
    hub heights (up to 160 m) using wind shear calculations showed a reasonable fit
    but produced an outlier in September, attributed to averaging effects driven by
    low data availability at 160 m. The report noted that wind shear calculations
    can vary with elevation, season, temperature, terrain, and atmospheric stability,
    requiring monthly shear profiles rather than a single annual value.
  lesson_learnt: When extrapolating wind speed to hub heights where measured data
    availability is below 50%, apply monthly wind shear profiles rather than a single
    annual shear exponent, and validate the extrapolation against the best-quality
    measured heights; a single shear value introduces seasonal bias that will systematically
    misrepresent the wind resource in certain months, affecting P50/P90 yield estimates.
