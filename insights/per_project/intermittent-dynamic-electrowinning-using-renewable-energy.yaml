- record_id: ARENA-DLV-34658
  source_title: Phase 3 - Full Scale Test Work Report
  publish_date: 2021-10
  project_name: Pilot Studies for Intermittent Dynamic Electrowinning using Renewable
    Energy
  what_happened: The 24-hour electrowinning test produced an EMM deposit with unexplained
    black regions around its edges, a current efficiency of only 43% (compared to
    84% for the 4-hour test), and an energy consumption of 9.89 kWh/kg — substantially
    worse than Phase 1 and 2 results — and the project was halted before the cause
    could be investigated further.
  lesson_learnt: In pilot electrowinning programs, anomalous deposit quality outcomes
    (black regions, low current efficiency) from extended-duration tests should be
    investigated and resolved before the program is concluded; halting a project while
    key technical questions remain open leaves process viability unconfirmed and diminishes
    the value of prior investment.
