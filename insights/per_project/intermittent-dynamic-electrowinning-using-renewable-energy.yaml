  what_happened: The pyranometer was installed on a horizontal surface and collected
    Global Horizontal Irradiance only. The report noted that soiling of the solar
    monitoring equipment in the Pilbara environment could affect data quality, and
    recommended cleaning every second day — a maintenance requirement not explicitly
    planned for in the initial deployment.
  lesson_learnt: In remote arid environments such as the Pilbara, include a formal
    soiling management and cleaning schedule in the resource monitoring plan at the
    time of instrument deployment; retrospective identification of soiling as a data
    quality risk (after data collection has begun) means that affected historical
    data periods cannot be corrected, introducing bias into the irradiance record
    that propagates into energy yield estimates.
