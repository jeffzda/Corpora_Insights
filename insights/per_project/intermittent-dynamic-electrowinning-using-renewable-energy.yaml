- record_id: ARENA-DLV-19806
  source_title: Phase 2 - Resource Assessment Report (Butcherbird Renewable Energy
    Resource Review)
  publish_date: 2021-09
  project_name: Butcherbird Renewable Energy Project (Element 25)
  what_happened: The wind resource assessment relied on a single SODAR unit positioned
    at one location within the proposed renewables area for the full monitoring period.
    This meant the wind profile across the broader site remained uncharacterised,
    introducing intra-site layout uncertainty that would affect turbine positioning
    and wake-loss estimates in any subsequent energy yield assessment.
  lesson_learnt: For greenfield wind projects where turbine layout has not yet been
    fixed, plan periodic relocation of the SODAR unit (every 3–6 months) across the
    proposed renewables area once it has been validated against a fixed met mast;
    this builds a site-wide wind map without the cost of multiple permanent towers
    and materially reduces layout uncertainty.
  issue_severity: minor
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: concept/feasibility
  proponent_type: industrial operator
  delay_category: null
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: Report explicitly recommended relocating the SODAR to other parts
    of the site at 3–6 month intervals once correlated against a met mast, to develop
    a site-wide wind profile.
  transferability: moderate
  delay_magnitude: null
  technology_domain: wind
  source_pages: &id006
  - 24
  evidence_excerpt: Relocating the SODAR to another part of the site at regular intervals
    (3-6 months). Increases the wind profile across the site, and once the SODAR is
    correlated to the met mast allows for an overall wind map of the site to be approximated,
    which reduces the intra site layout uncertainty.
