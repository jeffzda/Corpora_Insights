  source_title: Phase 3 - Full Scale Test Work Report
  publish_date: 2021-10
  project_name: Pilot Studies for Intermittent Dynamic Electrowinning using Renewable
    Energy
  what_happened: Successive electrowinning plating cycles on the same stainless steel
    cathode without adequate polishing between cycles resulted in a progressive and
    visible deterioration in EMM deposit quality, a finding first observed in Phases
    1 and 2 that drove the entire cathode pre-treatment workstream in Phase 3.
  lesson_learnt: For electrowinning pilot programs targeting multi-cycle cathode reuse,
    cathode surface maintenance methodology (pre-treatment and polishing) must be
    developed and validated concurrently with the electrowinning process — failure
    to do so risks deposit quality degradation that invalidates process performance
    data and requires costly additional research phases.
  issue_severity: moderate
  project_type: industrial decarbonisation
