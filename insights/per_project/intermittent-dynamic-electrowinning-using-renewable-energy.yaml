- record_id: ARENA-DLV-19805
  source_title: Phase 2 - Resource Assessment Report (Butcherbird Renewable Energy
    Resource Review)
  publish_date: 2021-09
  project_name: Butcherbird Renewable Energy Project (Element 25)
  what_happened: Modelling using NREL System Advisor Model showed that single-axis
    solar tracking would deliver 31% more annual energy output than a fixed horizontal
    installation at the Butcherbird site, compared to only 7% from fixed tilt at 20
    degrees. The resource assessment was initially based on Global Horizontal Irradiance,
    which understates the energy available to a tracking or tilted system.
  lesson_learnt: For remote industrial renewable energy projects in mid-latitude locations
    such as the Pilbara, default resource assessments based on GHI on a horizontal
    plane substantially understate the energy available to a tracked system — include
    single-axis tracking sensitivity analysis early in feasibility to avoid undersizing
    the generation component of the business case.
