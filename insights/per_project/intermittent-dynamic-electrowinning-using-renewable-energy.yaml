  what_happened: The MERRA2 reanalysis dataset at the Butcherbird location had only
    7 years of data available at the time of the study, below the 10–20 year baseline
    typically used for wind resource correlation. This limited the long-term mean
    correction that could be applied to the short on-site dataset, increasing residual
    uncertainty in the wind yield estimate.
  lesson_learnt: Before committing to a reanalysis dataset for wind resource long-term
    correction, verify the length and completeness of the reanalysis record at the
    project location; where the reanalysis record is shorter than 10 years, explicitly
    quantify and disclose the additional uncertainty introduced into bankable wind
    yield estimates.
