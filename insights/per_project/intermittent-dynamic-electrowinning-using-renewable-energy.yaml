- record_id: ARENA-DLV-19803
  source_title: Phase 2 - Resource Assessment Report (Butcherbird Renewable Energy
    Resource Review)
  publish_date: 2021-09
  project_name: Butcherbird Renewable Energy Project (Element 25)
  what_happened: Correlation of the on-site solar data against the long-term (30-year)
    Illgararie BOM dataset produced a poor R² of 0.49 when compared on a raw monthly
    basis, but improved to R² of 0.925 when the comparison was limited to the matching
    measurement period. The discrepancy arose because comparing one year of on-site
    data against a 30-year long-term average introduced seasonal and inter-annual
    bias.
  lesson_learnt: When correlating short-duration on-site measurements against long-term
    reference datasets, always match the comparison period to the same timestamps
    as the collected data before drawing conclusions about site representativeness;
    direct long-term-vs-short-term comparisons will systematically understate correlation
    and mislead resource quality assessments.
