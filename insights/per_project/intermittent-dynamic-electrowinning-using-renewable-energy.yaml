- record_id: ARENA-DLV-19808
  source_title: Phase 2 - Resource Assessment Report (Butcherbird Renewable Energy
    Resource Review)
  publish_date: 2021-09
  project_name: Butcherbird Renewable Energy Project (Element 25)
  what_happened: The Butcherbird site, located in the Pilbara, recorded average diurnal
    temperatures approaching 35–40°C. The resource assessment flagged that most commercially
    available wind turbines and solar inverters have derating profiles that activate
    between 40–45°C, which would reduce effective capacity during the hottest periods
    — a risk not captured in standard resource assessments based on climate averages.
  lesson_learnt: For renewable energy projects in hot climates such as the Pilbara,
    explicitly mandate high-temperature tolerance specifications during turbine and
    inverter procurement — standard equipment derating above 40–45°C can materially
    reduce effective capacity during peak temperature periods and should be modelled
    as part of the energy yield assessment rather than addressed during procurement.
  issue_severity: minor
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: industrial operator
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Report recommended addressing derating risk through appropriate
    system definition during the tender process, mandating high-temperature tolerance
    in technical specifications.
  transferability: moderate
  delay_magnitude: null
  technology_domain: hybrid systems
