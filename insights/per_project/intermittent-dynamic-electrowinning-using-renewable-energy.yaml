  project_name: Butcherbird Renewable Energy Project (Element 25)
  what_happened: Wind turbulence intensity measurements from the SODAR indicated that
    the Butcherbird site falls in the lower turbulence range (14.0% at 100 m), placing
    it in IEC Class II–IV. However, the report explicitly flagged that limited data
    quantity at higher wind speeds meant turbulence intensity results should be treated
    as indicative only, with uncertainty that could only be resolved through multi-year
    data collection.
  lesson_learnt: Turbulence intensity estimates derived from SODAR campaigns shorter
    than two years should not be used as the sole basis for wind turbine class selection;
    the low frequency of high-wind-speed events in a short dataset introduces material
    uncertainty in the turbulence intensity metric, which directly affects structural
    load calculations and OEM warranty validity — plan for multi-year measurement
    or supplementary cup-anemometer tower data before finalising turbine class specifications.
