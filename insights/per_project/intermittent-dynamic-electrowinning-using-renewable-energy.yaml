  project_name: Butcherbird Renewable Energy Project (Element 25)
  what_happened: The resource assessment identified seasonal complementarity between
    the wind and solar resources at Butcherbird — wind speeds were higher during cooler
    months when solar irradiance was lower, partially compensating for the seasonal
    reduction in solar generation. This pattern was identified as a potential system
    design advantage for a hybrid wind-solar plant.
  lesson_learnt: In feasibility assessments for remote hybrid renewable energy systems,
    explicitly analyse seasonal wind-solar complementarity using measured data before
    finalising the technology mix and capacity ratio; sites with anti-correlated seasonal
    profiles can achieve higher overall capacity factors with a smaller combined installed
    capacity than a single-technology approach, reducing levelised cost of energy
    for the industrial load.
