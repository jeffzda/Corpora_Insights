- record_id: ARENA-DLV-19807
  source_title: Phase 2 - Resource Assessment Report (Butcherbird Renewable Energy
    Resource Review)
  publish_date: 2021-09
  project_name: Butcherbird Renewable Energy Project (Element 25)
  what_happened: The resource assessment identified a consistent morning dip in wind
    speed before the solar resource became available, most pronounced in autumn and
    winter months. Simulation modelling indicated that a standalone wind-plus-solar
    hybrid system could not achieve continuous supply without a third dispatchable
    generation source, with approximately 5% of annual energy needing to come from
    conventional generation even under a favourable resource scenario.
  lesson_learnt: For remote industrial loads requiring continuous power supply, a
    wind-solar hybrid resource assessment must explicitly model the temporal gap between
    wind availability and solar availability — particularly the pre-dawn wind dip
    — and include a dispatchable backup component (gas, diesel, battery, or hydrogen)
    in the system design from the outset; failing to account for this gap will result
    in system redesign after the resource study.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: concept/feasibility
  proponent_type: industrial operator
  delay_category: null
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: VICE Engineering developed a simulation using one year of measured
    data against an assumed 80 MW fixed load, demonstrating the residual conventional
    generation requirement and identifying gas reciprocating engine or hydrogen-fuelled
    generation as dispatchable options.
  transferability: moderate
  delay_magnitude: null
  technology_domain: hybrid systems
  source_pages: &id007
  - 22
  - 23
  evidence_excerpt: The wind resource shows a dip in the early morning before the
    solar resource is available. It is likely that an alternative generator, such
    as a gas reciprocating engine or a diesel engine may be required to cover shortfalls
    at certain times... To be able to provide a consistent power output a third power
    supply will be required.
