    studies, confirm that the averaging interval and sampling rate are appropriate
    for the intended analysis purpose; a 10-minute average is adequate for energy
    yield assessment but insufficient for turbine structural load characterisation
    or short-duration ramp-rate studies — the latter require sub-minute or 1-second
    resolution data from a complementary instrument.
