  evidence_excerpt: reducing metal/Si interface areas to lower contact recombination
    losses in screen-printed solar cells must be done in a way without triggering
    excessive increases in resistive losses, which requires careful evaluation to
    balance reductions in contact recombination losses and increases in resistive
    losses.
