- record_id: ARENA-DLV-14203
  source_title: Next-Gen Selective-Emitters for Commercial PERC and TOPCon Solar Panels
    Report
  publish_date: 2023-03
  project_name: Next-Generation Selective-Emitters for Commercial PERC and TOPCon
    Solar Panels
  what_happened: 'The project identified a fundamental trade-off in low-area contact
    design: reducing metal/Si interface areas lowers contact recombination losses
    but simultaneously increases resistive losses due to elevated contact resistance
    and spreading resistance at localised contact regions, creating a design optimisation
    constraint not fully anticipated at project outset.'
  lesson_learnt: Any future project modifying contacting pattern geometry to reduce
    recombination losses must simultaneously model resistive loss penalties — a systemic
    multi-loss optimisation approach is required, as reducing interface area without
    achieving sufficiently low contact resistivity will yield no net efficiency gain.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Spreading resistance contribution was separated from measured
    contact resistance using Quokka 3 simulation, enabling quantified trade-off analysis
    and informing optimised contact geometry design.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id001
