- record_id: ARENA-DLV-14202
  source_title: Next-Gen Selective-Emitters for Commercial PERC and TOPCon Solar Panels
    Report
  publish_date: 2023-03
  project_name: Next-Generation Selective-Emitters for Commercial PERC and TOPCon
    Solar Panels
  what_happened: Root-cause investigation of the NFT Ag contact formation failure
    revealed that the low density of Ag crystallites at metal/Si interfaces was due
    to the special low-reactivity glass frit system used in NFT pastes — a system
    intentionally designed to avoid fire-through of SiNx layers, which simultaneously
    prevents effective Ag crystallite formation on the silicon surface.
  lesson_learnt: When adopting screen-printing paste materials for unconventional
    contact formation roles (e.g. NFT Ag pastes forming direct metal/Si contacts),
    verify contact formation feasibility early in the experimental phase — the glass
    frit chemistry of NFT pastes is fundamentally unsuited to Ag crystallite formation,
    and this constraint will block efficiency gains until paste chemistry is reformulated.
  issue_severity: major
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Switched to conventional fire-through (FT) Ag pastes on the same
    laser-doped surface, achieving contact resistivity of 0.5 mΩ.cm2 and confirming
    the issue was paste-specific, not process-specific; the low-area selective contact
    design was pursued instead.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
