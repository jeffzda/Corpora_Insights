- record_id: ARENA-DLV-14206
  source_title: Next-Gen Selective-Emitters for Commercial PERC and TOPCon Solar Panels
    Report
  publish_date: 2023-03
  project_name: Next-Generation Selective-Emitters for Commercial PERC and TOPCon
    Solar Panels
  what_happened: A key knowledge gap was identified regarding how to achieve lower
    contact resistivity with current LDSE technology and industrial Ag pastes. Two
    candidate approaches — improving glass frit reactivity or forming more heavily
    doped LDSE regions — were found to carry their own efficiency trade-offs (increased
    surface/Auger recombination), leaving no resolved pathway to low contact resistivity
    within current material constraints.
  lesson_learnt: Future projects developing screen-printed contacts with reduced interface
    areas should treat contact resistivity reduction as an independent parallel research
    track — the interaction between glass frit chemistry, laser doping intensity,
    and recombination losses creates interdependencies that cannot be resolved by
    optimising any single variable in isolation.
