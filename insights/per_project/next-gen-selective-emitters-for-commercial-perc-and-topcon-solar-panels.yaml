  evidence_excerpt: the formation of Ag crystallites on the silicon surface is closely
    related to the direct reaction between Ag+ ions dissolved in the glass layer and
    the silicon surface, such a low density of Ag crystallites formed with NFT Ag
    pastes could be largely attributed to the special glass frit system of them.
