- record_id: ARENA-DLV-14204
  source_title: Next-Gen Selective-Emitters for Commercial PERC and TOPCon Solar Panels
    Report
  publish_date: 2023-03
  project_name: Next-Generation Selective-Emitters for Commercial PERC and TOPCon
    Solar Panels
  what_happened: The low-area selective contact design (as distinct from the blocked
    low-area laser-doped contact approach) was successfully demonstrated on PERC solar
    cells, achieving up to 12 mV improvement in open-circuit voltage and more than
    0.3%abs efficiency gain compared to conventional contacting designs, confirming
    reduced metal/Si interface area as an effective efficiency lever.
  lesson_learnt: Reducing metal/Si interface areas via the low-area selective contact
    scheme is a technically validated route to meaningful PERC efficiency improvement;
    projects targeting >24% screen-printed PERC efficiency should include this contact
    geometry as a candidate design, particularly where conventional paste chemistries
    are retained.
