    this bespoke model update needs to be reflected in the on-site controller by a
    corresponding one-off update to the controller firmware. Developing updated firmware
    on this legacy platform (no longer supported) will cause significant delays and
    will require substantial resources (capital and personnel) of the Original Equipment
    Manufacturer (OEM).
