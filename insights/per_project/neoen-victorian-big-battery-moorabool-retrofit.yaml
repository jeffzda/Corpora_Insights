  project_name: Victorian Big Battery (VBB) GFM Retrofit
  what_happened: The VBB GFM retrofit project, originally scoped with assumptions
    of minimal hardware changes and straightforward regulatory transition, encountered
    multiple compounding issues during the 5.3.9 approval process — including bespoke
    firmware requirements, new metering hardware, arc flash protection upgrades, and
    NER version mismatches — reflecting a systemic pattern in which legacy BESS sites
    face disproportionate remediation burden when seeking to add GFM capabilities
    under evolved regulatory frameworks.
  lesson_learnt: Industry and regulators should recognise that legacy BESS assets
    face a structural disadvantage when upgrading to GFM under evolved NER frameworks
    — the cumulative risk of hardware shortcomings, firmware obsolescence, and NER
    version gaps may deter owners from upgrading to provide grid-supporting services.
    ARENA, AEMO and NSPs should consider developing dedicated GFM retrofit pathways
    that reduce unnecessary compliance burden on legacy assets with otherwise sound
    performance.
