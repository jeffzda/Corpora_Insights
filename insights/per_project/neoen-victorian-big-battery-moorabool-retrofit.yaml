  evidence_excerpt: Legacy sites pose a problem in that as regulations and expectations
    evolve with newer projects in the National Electricity Market (NEM), legacy hardware
    and site design may struggle to comply. This can manifest itself as a hardware
    shortcoming that are not unearthed until detailed investigation into product capabilities
    are required from the OEM, for capability that was not considered in the initial
    scoping phase of a project due to different design requirements for the product.
