- record_id: ARENA-DLV-48703
  source_title: Neoen - Victorian Big Battery - Lessons Learnt 3
  publish_date: 2025-06
  project_name: Victorian Big Battery
  what_happened: To minimise modelling variables and project timeline during the GFM
    5.3.9 transition, VBB adopted inertia settings derived from Hornsdale Power Reserve
    (HPR) rather than deriving site-specific optimal settings. These settings may
    not be optimal for VBB's different grid connection point, as they were a compromise
    between maximising inertia and minimising power recovery and reactive settling
    times at HPR's connection point.
  lesson_learnt: Do not transfer inertia settings from one GFM site to another without
    undertaking site-specific wide area studies — settings optimised for one connection
    point may not be optimal elsewhere. Future GFM projects should engage AEMO/NSP
    and the inverter OEM to model a wide range of inertia parameters in a wide area
    study to determine the most suitable site-specific settings.
  issue_severity: moderate
  project_type: storage
  project_scale_band: utility/large-scale
  lifecycle_phase: development/design
  proponent_type: project developer
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: delayed but recoverable
  secondary_failure_mode: data & measurement
  intervention_note: Adopted HPR settings as a pragmatic compromise given the strong
    connection point at Moorabool Terminal Station; flagged the need for wide area
    PSCAD analysis by AEMO/NSP for future projects.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages:
  - 7
  - 8
  - 11
  evidence_excerpt: It was decided prior to commencement of the project, that in the
    interest of reducing the number of modelling variables required to review and
    given the similarities between HPR and VBB, the initial studies on the plant would
    simply use the final inertia settings for GFM deployed at HPR. The downside with
    this approach is that the parameters may not be optimal for a different grid connection
    point.
