- record_id: ARENA-DLV-48701
  source_title: Neoen - Victorian Big Battery - Lessons Learnt 3
  publish_date: 2025-06
  project_name: Victorian Big Battery
  what_happened: When retrofitting Grid Forming Mode (GFM) capabilities onto VBB's
    legacy Tesla Megapack platform, Tesla's OEM resources were increasingly allocated
    to newer products and larger projects, resulting in minor delays to the firmware
    upgrade works for VBB's legacy product. Standard incentive structures for advancing
    legacy products were insufficient to align OEM resourcing priorities with the
    project's needs.
  lesson_learnt: When planning upgrades to legacy battery storage sites, ensure sufficient
    budget scope and incentive structures are in place to secure OEM resourcing —
    account for competing demands on the OEM from newer products and larger projects,
    and engage early to understand resourcing constraints before commencing the upgrade
    program.
