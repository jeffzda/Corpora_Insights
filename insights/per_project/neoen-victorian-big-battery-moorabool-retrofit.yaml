- record_id: ARENA-DLV-67008
  source_title: Neoen Victorian Big Battery (Moorabool) Retrofit Lessons Learnt Report
    2
  publish_date: 2024-12
  project_name: Victorian Big Battery (VBB) GFM Retrofit
  what_happened: The VBB 5.3.9 GPS submission proposed removing the reactive current
    settling time requirement on the basis that GFM inverter output behaves like a
    synchronous machine. However, the NER currently classifies VBB as an asynchronous
    generating system and specifies a reactive current settling time of no greater
    than 70ms. In November 2024, AEMO notified that settling time requirements must
    meet NER version 198 since the parameter is being altered from the original GPS,
    creating unresolved compliance tension with Tesla's legacy GFM models.
  lesson_learnt: When retrofitting GFM capability, proponents must account for the
    regulatory gap where the NER has no GPS framework recognising the synchronous-machine-like
    behaviour of GFM inverters — the 70ms reactive current settling time for asynchronous
    systems will be imposed even though GFM inverters inherently cannot meet it at
    the connection point. Engage AEMO early to seek a regulatory pathway that recognises
    GFM-specific performance characteristics before finalising the 5.3.9 submission.
  issue_severity: major
  project_type: storage
  project_scale_band: utility/large-scale
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: As of December 2024 AEMO had issued an updated Issues Tracker
    requiring NER v198 compliance; Neoen and Tesla were continuing to work through
    the implication for legacy firmware, with resolution expected in the lead-up to
    the 5.3.10 letter.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages:
  - 11
  - 12
  - 14
  - 15
  - 17
  evidence_excerpt: NER specifies a reactive current settling time 'of no greater
    than 70 milliseconds' for asynchronous generating systems, which was applicable
    for VBB inverters in grid-following mode. However, with the GFM added, the fault
    response of the VBB should not be strictly classified under 'asynchronous' generating
    unit, since the behaviour is similar to a synchronous machine although the hardware
    is asynchronous. Presently, there is no such section in the NER or provisions
    in the GPS to recognise this category.
