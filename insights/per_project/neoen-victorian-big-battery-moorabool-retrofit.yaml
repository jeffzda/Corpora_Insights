  evidence_excerpt: When the project was initially put forward, it was intended that
    no new hardware or physical changes would be required, however in order to manage
    faults and arc flash risks, this will not be achievable... the fault contribution
    from these inverters does not necessarily stop when the network is disconnected
    (as was the situation with grid following inverters).
