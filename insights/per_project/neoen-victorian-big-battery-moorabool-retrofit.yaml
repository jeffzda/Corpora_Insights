- record_id: ARENA-DLV-67007
  source_title: Neoen Victorian Big Battery (Moorabool) Retrofit Lessons Learnt Report
    2
  publish_date: 2024-12
  project_name: Victorian Big Battery (VBB) GFM Retrofit
  what_happened: Enabling GFM at VBB required frequency control to be moved from individual
    inverters to the site Power Plant Controller (PPC), necessitating installation
    of two new SEL735 meters inside AusNet's Moorabool Terminal Station. The original
    project scope had assumed no new hardware would be required. Additionally, running
    both old and new metering systems in parallel during hold-point testing created
    competition for existing communication paths between the terminal station and
    the VBB site, introducing further integration complexity.
  lesson_learnt: When scoping a GFM retrofit on a legacy site, do not assume the control
    system architecture can remain unchanged — the transition of frequency control
    to a site controller typically requires new metering infrastructure in the NSP's
    terminal station, and the communications and SCADA implications of running parallel
    metering systems during phased commissioning must be engineered in advance rather
    than discovered during installation.
  issue_severity: moderate
  project_type: storage
  project_scale_band: utility/large-scale
  lifecycle_phase: commissioning/integration
  proponent_type: project developer
  delay_category: commissioning/integration
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated integration
  intervention_note: Neoen engaged AusNet to install temporary ethernet switches at
    the terminal station to allow all four relays to operate simultaneously during
    testing; Tesla investigated operating in grid-following mode via the new SEL735
    meter to reduce changeover disruption. A work order for new meter installation
    was received.
