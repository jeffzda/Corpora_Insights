- record_id: ARENA-DLV-48702
  source_title: Neoen - Victorian Big Battery - Lessons Learnt 3
  publish_date: 2025-06
  project_name: Victorian Big Battery
  what_happened: AEMO required VBB to complete power system modelling in both PSSE
    version 35 and the newly released version 37 during the GFM upgrade process. This
    dual-version requirement was not anticipated in the initial project planning,
    necessitating development of new models by Tesla and resulting in unanticipated
    time, resource demand, delays to project milestones, and increased operational
    costs.
  lesson_learnt: During grid connection upgrade processes, proactively engage with
    AEMO at the planning stage to identify any current or anticipated modelling software
    version transition requirements — budget contingency for dual-framework modelling
    obligations, which can arise unexpectedly during PSSE version transitions and
    impose significant rework and schedule impact.
