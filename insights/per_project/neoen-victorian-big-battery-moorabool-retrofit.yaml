- record_id: ARENA-DLV-31051
  source_title: Neoen Victorian Big Battery (Moorabool) Retrofit Lessons Learnt Report
    1
  publish_date: 2024-11
  project_name: Victorian Big Battery (Moorabool) Retrofit
  what_happened: When retrofitting Grid Forming Mode (GFM) capability to the VBB,
    the protection and arc-flash settings required comprehensive revision because
    GFM inverters continue contributing fault current after the network is disconnected
    — unlike grid-following inverters — increasing incident energy from arc faults.
    Hardware changes including a hard-wired inter-trip scheme were required, contrary
    to the original project assumption that no new hardware or physical changes would
    be needed.
  lesson_learnt: Design BESS with GFM inverters from the outset rather than retrofitting;
    when retrofitting is unavoidable, study the fault contribution and arc-flash implications
    before finalising the protection scheme — GFM's sustained fault contribution will
    require relay settings, time delays, over-current configuration, and potentially
    new inter-trip hardware to be redesigned, especially at legacy sites with established
    protection systems.
  issue_severity: major
  project_type: storage
  project_scale_band: utility/large-scale
  lifecycle_phase: development/design
  proponent_type: project developer
  delay_category: construction/installation
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: A hard-wired inter-trip scheme was incorporated into the protection
    circuit to cease inverter operation when a protection element operates in the
    33kV relays; relay pickup values, time delays, and over-current settings were
    all reviewed and optimised for GFM; arc flash protection upgrade design was approved
    by AEMO and installation works commenced.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages:
