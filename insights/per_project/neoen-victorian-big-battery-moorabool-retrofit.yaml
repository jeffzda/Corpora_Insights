- record_id: ARENA-DLV-67003
  source_title: Neoen Victorian Big Battery (Moorabool) Retrofit Lessons Learnt Report
    2
  publish_date: 2024-12
  project_name: Victorian Big Battery (VBB) GFM Retrofit
  what_happened: When VBB submitted its 5.3.9 application to upgrade to GFM, the plant's
    capabilities were assessed against the current NER version (v.203) rather than
    the version (v.155) under which VBB was originally commissioned in 2021. The updated
    NER requires performance measurement at the connection point rather than inverter
    terminals, creating new technical compliance obligations for metering and control
    loops not anticipated during original design, with potential impacts on FCAS performance.
  lesson_learnt: Before proceeding with a 5.3.9 GFM upgrade on a legacy BESS, conduct
    a preliminary gap analysis comparing the current NER version against the version
    under which the original GPS was certified — if significant gaps exist, fully
    cost the remediation before committing to the upgrade, as unexpected compliance
    obligations can drive substantial rework and cost.
  issue_severity: major
  project_type: storage
  project_scale_band: utility/large-scale
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: poor scoping
  intervention_note: Neoen identified the gap and is now undertaking metering and
    control loop changes to achieve compliance; full impact on FCAS performance still
    under review as of December 2024.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages:
  - 9
  - 10
  - 12
  - 13
  evidence_excerpt: The 5.3.9 process has resulted in certain capabilities of the
    VBB plant being assessed against the latest updated version of the NER at the
    time that the 5.3.9 application was made (v.203), rather than the version applied
    to the original Generator Performance Standard (GPS) (v.155)... The evaluation
    of the BESS against the new NER terms introduces risk for legacy facilities who
    may seek to upgrade to GFM capabilities.
