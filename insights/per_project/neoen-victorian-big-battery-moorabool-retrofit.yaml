- record_id: ARENA-DLV-48708
  source_title: Neoen - Victorian Big Battery - Lessons Learnt 3
  publish_date: 2025-06
  project_name: Victorian Big Battery
  what_happened: During the first iterative review of VBB's 5.3.9 application package,
    the NSP requested a new full grid study incorporating additional network scenarios
    not agreed at the outset — specifically two additional committed generators and
    additional charge/discharge scenarios. This rework caused delays to the 5.3.9
    process, compounded by difficulties in obtaining the additional required data
    (RUGs) and by the original modelling team having moved on to other projects.
  lesson_learnt: When preparing a 5.3.9 grid connection application, build explicit
    contingency for additional modelling scenarios being requested mid-process — the
    rapid rollout of new generators during Australia's energy transition means the
    network may have changed materially since the original application package was
    assembled. Maintain dedicated modelling resource availability through to NSP/AEMO
    final approval, not just initial submission.
