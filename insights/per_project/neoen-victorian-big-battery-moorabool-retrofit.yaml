- record_id: ARENA-DLV-67005
  source_title: Neoen Victorian Big Battery (Moorabool) Retrofit Lessons Learnt Report
    2
  publish_date: 2024-12
  project_name: Victorian Big Battery (VBB) GFM Retrofit
  what_happened: During modelling studies for the 5.3.9 GFM transition, the NSP determined
    that VBB's legacy controller firmware could not deliver the required reactive
    current (Iq) injection at the connection point in GFM mode without causing a prohibited
    drop in active power. This arose because NER performance is now measured at the
    connection point (not inverter terminals) and the high impedance between VBB's
    500V inverter terminals and the connection point required a higher k-factor than
    the legacy platform could support. Tesla delivered a bespoke, once-off firmware
    and controller model update — the only instance of this change across all Tesla
    sites — causing unforeseen delays to the 5.3.9 process.
  lesson_learnt: When planning a GFM retrofit on legacy BESS hardware, verify early
    whether the existing controller firmware can meet current NER reactive current
    injection requirements measured at the connection point — a gap here can force
    bespoke, resource-intensive OEM firmware development on an end-of-life platform,
    causing significant delays and cost. Do not assume that performance achieved at
    the inverter terminals will translate to compliance at the connection point.
  issue_severity: major
  project_type: storage
  project_scale_band: utility/large-scale
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: grid connection/system studies
  failure_mode: unvalidated technical assumptions
  outcome_class: delayed but recoverable
  secondary_failure_mode: unvalidated integration
  intervention_note: Tesla delivered a once-off update to the in-situ VBB controller
    model and is developing a corresponding one-off firmware update for the legacy
    platform, while Neoen is also engaging with NSP and AEMO to seek leniency to avoid
    requiring full legacy firmware upgrades.
