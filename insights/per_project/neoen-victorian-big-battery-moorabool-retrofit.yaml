- record_id: ARENA-DLV-48704
  source_title: Neoen - Victorian Big Battery - Lessons Learnt 3
  publish_date: 2025-06
  project_name: Victorian Big Battery
  what_happened: VBB's Tesla inverters demonstrated stable GFM operation only down
    to a Short Circuit Ratio (SCR) of 1.5, falling short of the theoretical expectation
    that GFM inverters should operate at SCR of zero (fully islanded). AEMO's voluntary
    GFM specification implies the inverter should maintain stable operation during
    very weak grid conditions including after disconnection of the last synchronous
    generator, which the current hardware cannot fully meet.
  lesson_learnt: Before committing to GFM specifications and regulatory performance
    standards, require the inverter OEM to provide tested documentation confirming
    stable operation at very low SCR levels — ideally at SCR equal to zero — as this
    is becoming an increasingly critical requirement for GFM inverters and the gap
    between theoretical capability and demonstrated performance can create compliance
    risk.
  issue_severity: moderate
  project_type: storage
  project_scale_band: utility/large-scale
  lifecycle_phase: commissioning/integration
  proponent_type: project developer
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Inverter performance at SCR of 1.5 was verified through modelling
    as part of the 5.3.9 process and was approved with receipt of the 5.3.10 letter;
    GPS for VBB is likely to prohibit operation during islanding events.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages:
  - 8
  - 9
  - 12
  evidence_excerpt: The VBB OEM indicated that their inverters have demonstrated stable
    operation down to an SCR of 1.5. While this is generally considered a weak SCR
    level, it is not an SCR of zero and thus may be outside the anticipated performance
    described in the voluntary specification.
