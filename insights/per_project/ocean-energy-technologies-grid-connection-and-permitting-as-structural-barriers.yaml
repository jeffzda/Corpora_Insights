- record_id: ARENA-DLV-50018
  source_title: Ocean Energy Report by Seanergy and Ernst and Young
  publish_date: 2016-06
  project_name: Ocean Energy Technologies — Grid Connection and Permitting as Structural
    Barriers
  what_happened: Across multiple countries and technologies, high investment costs
    and specific technical difficulties such as grid connection and permitting for
    offshore systems were identified as substantial barriers preventing ocean energy
    from reaching commercial development, requiring specific policy support and empirical
    technical data from full-scale demonstrators.
  lesson_learnt: Grid connection and permitting for offshore ocean energy devices
    should be treated as long-lead items requiring dedicated resources and early engagement
    with regulators; these are consistently identified as structural barriers across
    all ocean energy technology types and geographies, and cannot be resolved through
    technology improvement alone.
