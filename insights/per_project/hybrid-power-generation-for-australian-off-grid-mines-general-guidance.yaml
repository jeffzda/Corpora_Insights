  project_name: Hybrid Power Generation for Australian Off-Grid Mines (General Guidance)
  what_happened: For brownfield mine sites, investigations of hybrid power generation
    options initiated less than one to three years before intended implementation
    were found to increase risk and reduce confidence in viability assessments.
  lesson_learnt: Brownfield hybrid power generation investigations should be initiated
    one to three years before intended implementation to allow adequate time for resource
    data collection, options studies, approvals, and viability assessments — shorter
    lead times materially increase delivery risk.
