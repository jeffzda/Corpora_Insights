  publish_date: 2018-06
  project_name: Hybrid Power Generation for Australian Off-Grid Mines (General Guidance)
  what_happened: Wind turbines were found to be unlikely to be economically viable
    for mines with a Life of Mine of 3–15 years due to limited salvage value or redeployment
    options, contrasting with PV which can be redeployed and therefore achieves viability
    at shorter mine lives.
  lesson_learnt: For mines with a Life of Mine under 15 years, wind turbines are generally
    not economically viable due to limited salvage or redeployment value — PV should
    be preferred in such cases, particularly where redeployable modular systems are
    available.
