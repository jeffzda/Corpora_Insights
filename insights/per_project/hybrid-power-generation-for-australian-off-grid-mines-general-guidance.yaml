- record_id: ARENA-DLV-71056
  source_title: Hybrid Power Generation for Australian Off-Grid Mines
  publish_date: 2018-06
  project_name: Hybrid Power Generation for Australian Off-Grid Mines (General Guidance)
  what_happened: Attempts to integrate hybrid power generation at advanced mine development
    phases (beyond pre-feasibility) were found to encounter obstacles including early
    contractor engagement restricting scope changes, insufficient weather data for
    renewable resource assessment, and constrained timeframes for approvals or environmental
    studies causing project delays.
  lesson_learnt: A hybrid power generation options study should be initiated no later
    than the pre-feasibility study phase of a greenfield mine — late integration encounters
    scope-lock from early contractor commitments, inadequate site weather data, and
    compressed approvals timelines that cause delays.
