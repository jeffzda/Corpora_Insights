    in 20-foot containers) were identified as an emerging commercial model in Australia
    that addresses the short Life of Mine constraint by enabling PV assets to be redeployed
    across multiple sites, though warranty coverage for relocated modules presented
    a residual risk.
  lesson_learnt: For mines with short Life of Mine where conventional PV is not economically
