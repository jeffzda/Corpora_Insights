- record_id: ARENA-DLV-71066
  source_title: Hybrid Power Generation for Australian Off-Grid Mines
  publish_date: 2018-06
  project_name: Hybrid Power Generation for Australian Off-Grid Mines (General Guidance)
  what_happened: Australian mainstream financing for off-grid hybrid power generation
    projects with a Life of Mine less than 10 years was found to be challenging to
    obtain, as financiers seek certainty, creditworthiness, and profitable terms with
    limited stranded asset risk.
  lesson_learnt: For off-grid mines with a Life of Mine under 10 years, mainstream
    Australian project finance for hybrid power generation is unlikely to be available
    — alternative structures such as owner-operated, lease, or PPA with an IPP should
    be evaluated, or foreign investors with different risk appetites should be engaged.
  issue_severity: moderate
