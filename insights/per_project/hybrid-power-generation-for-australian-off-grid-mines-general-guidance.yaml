- record_id: ARENA-DLV-71084
  source_title: Hybrid Power Generation for Australian Off-Grid Mines
  publish_date: 2018-06
  project_name: Hybrid Power Generation for Australian Off-Grid Mines (General Guidance)
  what_happened: PV performance ratio guarantees were found to be susceptible to contention
    over curtailment calculation methodology — curtailment is not directly measurable
    but calculated under certain conditions, and contracts that do not explicitly
    define the treatment of curtailment events (e.g. from thermal generator synchronisation
    or minimum load factors) create disputes over performance compliance.
  lesson_learnt: PV performance guarantee contracts must explicitly define how curtailment
    events are treated in performance ratio calculations — ambiguous curtailment clauses
    (particularly for events caused by thermal generator minimum load factors or synchronisation)
    create contractual disputes that can be avoided with precise contract drafting.
