- record_id: ARENA-DLV-71065
  source_title: Hybrid Power Generation for Australian Off-Grid Mines
  publish_date: 2018-06
  project_name: Hybrid Power Generation for Australian Off-Grid Mines (General Guidance)
  what_happened: Commercial agreements with IPPs were found to place restrictions
    on achieving optimal technical outcomes for hybrid power generation, with conflicting
    commercial interests between separate PPA contracts leading to less efficient
    system design and higher costs to the mine.
  lesson_learnt: Commercial agreements for hybrid mine power should be structured
    to not restrict technical design and should allow modification over time — where
    a mine already has a PPA with an IPP, it is preferable for that same IPP to contract
    additional renewable supply rather than the mine entering two separate contracts,
    to avoid conflicting interests and inefficient design.
