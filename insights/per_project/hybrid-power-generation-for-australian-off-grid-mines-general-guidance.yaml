- record_id: ARENA-DLV-71062
  source_title: Hybrid Power Generation for Australian Off-Grid Mines
  publish_date: 2018-06
  project_name: Hybrid Power Generation for Australian Off-Grid Mines (General Guidance)
  what_happened: Financial modelling for hybrid power generation projects was found
    to be subject to systematic bias depending on the industry background of the model
    author, with renewable energy practitioners using discount rates of 3–5% versus
    mining industry practitioners using 10–15%, and contingency rates of 2–5% versus
    5–30% respectively.
  lesson_learnt: When reviewing or producing financial models for hybrid mine power,
    explicitly state and challenge the discount rate and contingency assumptions —
    renewable industry defaults (3–5% discount, 2–5% contingency) can materially overstate
    project attractiveness relative to mining industry norms (10–15% discount, 5–30%
    contingency).
