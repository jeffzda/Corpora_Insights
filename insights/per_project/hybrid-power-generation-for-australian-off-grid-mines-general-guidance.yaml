- record_id: ARENA-DLV-71063
  source_title: Hybrid Power Generation for Australian Off-Grid Mines
  publish_date: 2018-06
  project_name: Hybrid Power Generation for Australian Off-Grid Mines (General Guidance)
  what_happened: Fossil fuel price forecasting for hybrid power generation business
    cases was found to be unreliable due to significant price volatility over the
    preceding decade, with the choice of diesel price per litre varying between mine
    company and renewable energy company assumptions (e.g. $0.65/L vs $1.00/L), materially
    affecting offset cost calculations.
  lesson_learnt: Business cases for hybrid mine power must clearly define and agree
    the diesel price basis before calculating offset savings — the difference between
    a mine company's assumed price ($0.65/L) and a renewable energy company's assumption
    ($1.00/L) can substantially alter the economic case, and sensitivity analysis
    across a realistic price range is essential.
