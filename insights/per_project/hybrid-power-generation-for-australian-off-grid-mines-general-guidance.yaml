  project_name: Hybrid Power Generation for Australian Off-Grid Mines (General Guidance)
  what_happened: Wind turbine noise exceedance was identified as a liability risk
    that, if not remedied within the defect liability period, creates ongoing liability
    for the life of the project, with liquidated damages calculated against projected
    versus actual output for the full curtailment period.
  lesson_learnt: Wind turbine siting for mine applications requires pre-installation
    noise baseline studies and third-party consultant verification — turbines should
    generally be sited at least 1–2 km from receptors, and noise curtailment risks
    must be contractually managed with clearly defined liability caps to avoid open-ended
    project-life exposure.
