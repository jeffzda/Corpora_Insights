- record_id: ARENA-DLV-71076
  source_title: Hybrid Power Generation for Australian Off-Grid Mines
  publish_date: 2018-06
  project_name: Hybrid Power Generation for Australian Off-Grid Mines (General Guidance)
  what_happened: Power curtailment of renewable generation was identified as a systemic
    risk in hybrid systems where synchronous generators have minimum load factors,
    meaning that as renewable generation increases it may be curtailed rather than
    offsetting fossil fuel use, undermining the economic case for renewables.
  lesson_learnt: Hybrid power system design must account for synchronous generator
    minimum load factors — if these constrain renewable dispatch, the economic case
    for the renewable component may be undermined through curtailment; load sizing
    and unit commitment strategy must be designed to maximise actual renewable utilisation,
    not just installed capacity.
