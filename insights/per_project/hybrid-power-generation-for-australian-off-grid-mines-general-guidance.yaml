- record_id: ARENA-DLV-71064
  source_title: Hybrid Power Generation for Australian Off-Grid Mines
  publish_date: 2018-06
  project_name: Hybrid Power Generation for Australian Off-Grid Mines (General Guidance)
  what_happened: LCOE was identified as a commonly misapplied metric for comparing
    hybrid power generation options at mine sites, with underlying assumptions (asset
    life vs Life of Mine, scope of included costs, discount rate, energy yield) rendering
    cross-project comparisons misleading.
  lesson_learnt: Do not rely on published generic LCOE benchmarks to assess hybrid
    power viability at a specific mine — LCOE is only valid when calculated using
    site-specific inputs (actual Life of Mine, actual energy yield, agreed cost scope
    and discount rate); generic values are systematically misleading for off-grid
    hybrid applications.
