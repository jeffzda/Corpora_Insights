  what_happened: In hybrid systems combining reciprocating engines with PV, the protection
    system was found to require two separate fault protection settings (daytime and
    night-time) because fault levels change when irradiance is low, a design complexity
    not present in single-fuel power stations.
  lesson_learnt: PV-diesel hybrid protection systems require dual fault protection
    setting groups (day and night) to account for the reduction in fault current contribution
    at low irradiance — failing to design for this results in either nuisance tripping
    during daytime operation or inadequate protection at night.
