- record_id: ARENA-DLV-71082
  source_title: Hybrid Power Generation for Australian Off-Grid Mines
  publish_date: 2018-06
  project_name: Hybrid Power Generation for Australian Off-Grid Mines (General Guidance)
  what_happened: The use of an overly conservative exceedance probability (e.g. P90
    or P95) for energy yield forecasting in hybrid mine power financial models was
    found to systematically undervalue solar and wind potential, while P90 and P50
    values converge for curtailed systems, reducing the risk-mitigation value of conservative
    assumptions.
  lesson_learnt: Select exceedance probability inputs for financial models deliberately
    and consistently with the financing context — banks should use P90, equity investors
    P50/P75; for curtailed systems the distinction between P50 and P90 narrows significantly
    and an overly conservative P90 input may understate the project's returns without
    providing meaningful additional risk coverage.
