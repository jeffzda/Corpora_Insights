  what_happened: BlueScope was appointed as the Manager of the joint venture on behalf
    of all five equal-equity participants, selected on the basis of its prior operating
    experience with ESF technology (including two ESFs at New Zealand Steel), rather
    than rotating or shared management responsibility.
