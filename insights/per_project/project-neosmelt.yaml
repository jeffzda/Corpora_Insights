- record_id: ARENA-DLV-39707
  source_title: 'Insights Spotlight: the NeoSmelt joint venture'
  publish_date: '2025-12-17'
  project_name: NeoSmelt Joint Venture
  what_happened: NeoSmelt developed a formal IP Management Plan to systematically
    capture IP contributed, used, and developed at each stage, with clear ownership
    and rights mapped to the various JVA and supplier agreements, and day-to-day management
    responsibility vested in the Manager with guidance from the IP Subcommittee.
  lesson_learnt: Create an IP Management Plan at the outset of a multi-party consortium
    that maps contributed, generated, and licensed IP at each project stage — without
    this, IP ownership disputes are likely to emerge at the point of commercialisation
    or proliferation when the stakes are highest and renegotiation is most difficult.
