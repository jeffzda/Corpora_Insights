- record_id: ARENA-DLV-60953
  source_title: BlueScope - NeoSmelt - Lessons Learnt Report 1
  publish_date: 2025-10
  project_name: Project NeoSmelt (Pre-FID Activities)
  what_happened: 'The project team faced a design trade-off in determining the appropriate
    scale for the ESF pilot plant: a facility too large would limit feedstock flexibility
    and testing modes, while one too small would fail to demonstrate the commercial
    concept or generate the data needed to design a commercial-scale ESF.'
  lesson_learnt: For pilot plants targeting industrial decarbonisation, explicitly
    scope the scale to balance two competing requirements — large enough to demonstrate
    the commercial concept and generate commercial-scale design data, yet small enough
    to retain flexibility for testing varied raw material inputs and operating modes;
    resolve this trade-off through a detailed study before progressing detailed design.
  issue_severity: minor
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: concept/feasibility
  proponent_type: industrial operator
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: A detailed study was performed to determine the commercial-scale
    attributes that must be demonstrated in the pilot, resulting in selection of a
    30–40 ktpa ESF capacity as the appropriate pilot scale.
  transferability: moderate
  delay_magnitude: null
  technology_domain: industrial renewables
  source_pages: &id012
  - 8
  evidence_excerpt: It is imperative to ensure that the scale of the pilot facility
    is large enough to allow for demonstration of the commercial concept yet small
    enough to allow for flexibility in the testing a wide range of raw material inputs.
    The most appropriate scale for the ESF was chosen to have a capacity of 30-40ktpa
    (dependent on raw material inputs).
  confidence_note: issue_severity coded minor as the trade-off was resolved through
    a design study without evidence of material delay or cost impact; outcome_class
    coded successful demonstration as the scoping decision was reached satisfactorily.
