- record_id: ARENA-DLV-39706
  source_title: 'Insights Spotlight: the NeoSmelt joint venture'
  publish_date: '2025-12-17'
  project_name: NeoSmelt Joint Venture
  what_happened: The consortium negotiated IP rights and obligations into the Joint
    Venture Agreement and separately into agreements with key technology/equipment
    suppliers (Tenova for DRI and Hatch for ESF), with considerable effort directed
    at ensuring those supplier agreements did not restrict NeoSmelt's technology proliferation
    objectives.
  lesson_learnt: When entering a multi-party consortium with technology proliferation
    goals, negotiate IP clauses in technology supplier contracts simultaneously with
    the JVA — supplier IP restrictions can silently undermine the consortium's proliferation
    objective if addressed only after the JVA is finalised.
