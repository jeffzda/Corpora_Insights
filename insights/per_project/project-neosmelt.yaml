- record_id: ARENA-DLV-39703
  source_title: 'Insights Spotlight: the NeoSmelt joint venture'
  publish_date: '2025-12-17'
  project_name: NeoSmelt Joint Venture
  what_happened: The NeoSmelt consortium established a multi-layered governance structure
    comprising an Operating Committee (one representative per participant), plus Technical
    and IP Subcommittees, plus multiple working groups with cross-participant membership
    — all operating alongside the appointed Manager (BlueScope).
  lesson_learnt: For large multi-party industrial joint ventures, build layered governance
    from the outset — an Operating Committee for oversight, specialist subcommittees
    for technical and IP matters, and working groups for cross-cutting issues — so
    that all participants have structured input and visibility without collapsing
    decision-making into an unwieldy plenary process.
