- record_id: ARENA-DLV-39701
  source_title: 'Insights Spotlight: the NeoSmelt joint venture'
  publish_date: '2025-12-17'
  project_name: NeoSmelt Joint Venture
  what_happened: Five large industrial organisations (BlueScope, BHP, Rio Tinto, Woodside,
    Mitsui Iron Ore Development) formed an equal-equity joint venture to pursue a
    DRI-ESF pilot plant, after each party had been separately investigating the same
    technology and independently concluded that pilot-scale testing was beyond the
    capability, cost, and risk appetite of any single organisation.
  lesson_learnt: When a technology challenge exceeds the financial and technical capacity
    of any single organisation, a formal equal-equity joint venture with a clearly
    appointed manager can unlock projects that would otherwise not proceed — but this
    requires parties to consolidate prior independent work rather than duplicate it.
