- record_id: ARENA-DLV-39705
  source_title: 'Insights Spotlight: the NeoSmelt joint venture'
  publish_date: '2025-12-17'
  project_name: NeoSmelt Joint Venture
  what_happened: NeoSmelt deliberately adopted a technology proliferation objective
    — intending to share operational performance outcomes and IP generated by the
    pilot broadly — rather than the more common approach of protecting and licensing
    IP for commercial return. This objective then directly shaped every aspect of
    the consortium's IP management framework.
  lesson_learnt: Define the IP commercialisation objective (proliferation vs. licensing
    for return) before establishing the JVA and supplier agreements — this decision
    cascades through every IP rights clause with technology suppliers and internal
    IP management protocols, and is far more difficult to restructure once agreements
    are in place.
