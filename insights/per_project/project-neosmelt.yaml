  delay_category: data/validation/testing
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: data & measurement
  intervention_note: Contractors were engaged to undertake more fulsome Preliminary
    Site Investigations (PSI) prior to site selection, providing geotechnical calibration,
    environmental mapping, and utility connection identification sufficient to progress
    design.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: industrial renewables
