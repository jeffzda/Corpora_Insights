- record_id: ARENA-DLV-60951
  source_title: BlueScope - NeoSmelt - Lessons Learnt Report 1
  publish_date: 2025-10
  project_name: Project NeoSmelt (Pre-FID Activities)
  what_happened: Desktop-based location assessment studies completed during pre-feasibility
    proved insufficient to understand the full risk profile of candidate sites, leaving
    geotechnical information gaps that blocked engineering design progression and
    site layout work.
  lesson_learnt: Do not rely on desktop studies alone for site selection — engage
    contractors to undertake a Preliminary Site Investigation (PSI) before finalising
    the pilot facility location, to obtain current geotechnical data, identify areas
    of avoidance/exclusion, and provide the certainty needed to progress engineering
    design and utility connection tie-in points.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: demonstration
