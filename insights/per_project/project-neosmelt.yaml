- record_id: ARENA-DLV-60952
  source_title: BlueScope - NeoSmelt - Lessons Learnt Report 1
  publish_date: 2025-10
  project_name: Project NeoSmelt (Pre-FID Activities)
  what_happened: During pre-feasibility, a review of DRI technologies found that all
    mature direct reduction technologies (Shaft Furnace, Rotary Kiln, Rotary Hearth
    Furnace, Fluidised Bed) operate at scales far exceeding the NeoSmelt pilot requirement
    of 30–40 ktpa DRI output, meaning no off-the-shelf solution existed and a bespoke
    design was required.
  lesson_learnt: When sizing a pilot plant for an industrial decarbonisation process,
    verify early whether mature commercial technologies are available at the required
    scale — if not, plan for bespoke supplier engagement and custom design from the
    outset rather than assuming a standard technology can be adapted.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: concept/feasibility
  proponent_type: industrial operator
  delay_category: null
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: A multi-criteria assessment was conducted across five DRI technology
    options; Shaft Furnace was selected as most suitable and a supplier will be engaged
    to design a bespoke unit to meet NeoSmelt's scale requirements.
  transferability: moderate
  delay_magnitude: null
  technology_domain: industrial renewables
  source_pages: &id011
  - 7
  evidence_excerpt: The scale of the mature direct reduction technologies far exceeds
    the need for NeoSmelt, therefore the solution is to engage a supplier to design
    a bespoke DRI to meet the NeoSmelt requirements. Mature direct reduction technologies
    are of a scale which far exceeds the need of the NeoSmelt pilot (often producing
    greater than 250ktpa).
  confidence_note: issue_severity coded moderate because the scale mismatch required
