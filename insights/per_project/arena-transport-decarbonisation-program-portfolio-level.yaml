- record_id: ARENA-DLV-68267
  source_title: Evaluation of ARENA's transport strategic priority
  publish_date: 2024-11
  project_name: ARENA Transport Decarbonisation Program (portfolio-level)
  what_happened: Multiple stakeholders reported that ARENA's knowledge sharing reports
    had mixed usefulness — some derived value, while others found the content difficult
    to understand or apply. An industry roundtable participant suggested reports should
    extrapolate how large-scale successes could be applied to smaller-scale businesses.
    One stakeholder also noted concerns about the consistency and quality of knowledge
    sharing reports.
  lesson_learnt: Knowledge sharing reports are not delivering consistent value to
    industry — ARENA should co-design report formats with intended readers, include
    practical application guidance for smaller-scale businesses, and ensure quality
    and consistency standards across mandatory and self-published reports to maximise
    the portfolio-level return on knowledge sharing investment.
