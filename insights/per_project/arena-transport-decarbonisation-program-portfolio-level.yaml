- record_id: ARENA-DLV-68266
  source_title: Evaluation of ARENA's transport strategic priority
  publish_date: 2024-11
  project_name: ARENA Transport Decarbonisation Program (portfolio-level)
  what_happened: Across the portfolio of 8 evaluated projects, multiple stakeholders
    found ARENA's funding application process laborious and complex, with the administrative
    burden acting as a potential barrier to entry for smaller organisations. Some
    stakeholders experienced ARENA decision-making delays of up to two months. Feedback
    consistently recommended calibrating application requirements and reporting obligations
    to grant/project size.
  lesson_learnt: ARENA's funding process requirements are disproportionate for smaller-scale
    innovation projects — calibrating application complexity, reporting requirements,
    and milestone rigidity to the size and nature of the grant would lower the barrier
    to entry for startups and small firms and improve the program's reach into the
    most innovative parts of the market.
