- record_id: ARENA-DLV-68270
  source_title: Evaluation of ARENA's transport strategic priority
  publish_date: 2024-11
  project_name: ARENA Transport Decarbonisation Program (portfolio-level)
  what_happened: Stakeholders across the evaluation expressed that ARENA's commercialisation-stage
    EV charging and fleet projects have not closed the commercialisation gap — further
    grant funding and broader government initiatives are still required. The current
    funding programs have improved commercial readiness but have not created self-sustaining
    markets for key EV technologies.
  lesson_learnt: A single round of ARENA commercialisation funding is insufficient
    to fully bridge the gap to market self-sustainability for EV fleets and charging
    infrastructure — future program design should plan for multi-round funding support
    and actively coordinate with broader government programs (incentives, standards,
    tariff reform) to avoid a 'grant cliff' where projects stall after ARENA funding
    ends.
