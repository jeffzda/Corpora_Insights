- record_id: ARENA-DLV-68268
  source_title: Evaluation of ARENA's transport strategic priority
  publish_date: 2024-11
  project_name: ARENA Transport Decarbonisation Program (portfolio-level)
  what_happened: Industry and community groups were found to lack widespread awareness
    of ARENA-funded transport projects and their outcomes. Roundtable participants
    were often unfamiliar with specific projects, and some were unclear on how ARENA
    determines which projects receive funding.
  lesson_learnt: ARENA's impact on the EV industry is being constrained by low awareness
    among potential beneficiaries and collaborators — ARENA should develop a proactive
    outreach strategy targeting industry bodies and community groups, and increase
    transparency around funding program design and project selection criteria to build
    broader trust and enable knowledge reuse.
