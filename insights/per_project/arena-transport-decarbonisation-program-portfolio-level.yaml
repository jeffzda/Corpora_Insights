- record_id: ARENA-DLV-68269
  source_title: Evaluation of ARENA's transport strategic priority
  publish_date: 2024-11
  project_name: ARENA Transport Decarbonisation Program (portfolio-level)
  what_happened: Across the evaluated portfolio, stakeholders consistently reported
    that without ARENA funding several projects would not have proceeded at all or
    would have been delayed by 2–6 years. Private sector companies within ARENA-funded
    projects invested a larger proportion of funds than ARENA in most cases, demonstrating
    market interest alongside the funding gap.
  lesson_learnt: ARENA grant funding functions as a critical catalyst rather than
    a subsidy for well-developed projects — the absence of funding leads to multi-year
    delays or project abandonment, not just marginal deferral. Portfolio managers
    should assess counterfactual timelines explicitly when evaluating grant additionality,
    as the leverage effect on private investment is a primary measure of program impact.
