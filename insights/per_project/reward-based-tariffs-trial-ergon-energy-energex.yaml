- record_id: ARENA-DLV-72289
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects - First Edition Results'
  publish_date: '2015'
  project_name: Reward Based Tariffs Trial (Ergon Energy / Energex)
  what_happened: A trial of 3,700 residential customers across Cairns, Toowoomba and Brisbane tested time-of-use and dynamic peak pricing tariffs. All groups reduced consumption by 17–23% during 4–8pm event
    periods compared to a control group, with 71% of participants finding it easy to respond and low-income participants demonstrating comparable or greater kilowatt reductions than other groups.
  lesson_learnt: Dynamic peak pricing and capacity-based demand response tariffs achieve consistent 17–23% peak reductions across residential customer segments including low-income households — trial evidence
    supports broad deployment of event-based pricing as a network peak deferral tool.
