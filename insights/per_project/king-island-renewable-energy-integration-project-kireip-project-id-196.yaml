- record_id: ARENA-DLV-72261
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: '2014'
  project_name: King Island Renewable Energy Integration Project (KIREIP) (Project
    ID 196)
  what_happened: KIREIP found that while B20 and B100 tallow-based biodiesel were
    technically viable in conventional diesel generators, the current fuel excise
    regime makes use of blends above B20 completely uneconomic compared to mineral
    diesel.
  lesson_farnt: Technical viability of biodiesel blends above 20% in diesel generators
    does not translate to commercial viability under current Australian excise arrangements
    — projects relying on biodiesel above B20 as a backup fuel should not assume regulatory
    or fiscal parity with mineral diesel without confirming excise treatment.
  lesson_learnt: Technical viability of biodiesel blends above 20% in diesel generators
    does not translate to commercial viability under current Australian excise arrangements
    — projects relying on biodiesel above B20 as a backup fuel should not assume regulatory
    or fiscal parity with mineral diesel without confirming excise treatment.
