- record_id: ARENA-DLV-72260
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: '2014'
  project_name: King Island Renewable Energy Integration Project (KIREIP) (Project
    ID 196)
  what_happened: Hydro Tasmania's KIREIP project successfully achieved sustained operation
    of the King Island isolated grid on 100% renewable energy using a mix of enabling
    technologies including flywheels, synchronous condensers, dynamic resistors, and
    demand side management, increasing average renewable penetration from 33% to 65%
    and achieving over 150 hours of zero diesel operation.
  lesson_learnt: A carefully staged commissioning and test plan that progressively
    demonstrates new technology capabilities — without risking customer supply — is
    essential when integrating untried technology mixes in isolated grids; the KIREIP
    technology mix (flywheels, synchronous condensers, DSM, wind) is directly applicable
    to similar remote grids worldwide relying on diesel fuel.
