  source_title: DEIP Market Integration Trials Summary Report 3.0
  publish_date: '2026-01-27'
  project_name: DEIP Market Integration Trials (cross-trial finding)
  what_happened: Consumer research across Project EDGE, Project Symphony, and Project
    Converge consistently found that financial benefit was the primary driver of VPP
    participation decisions, but existing VPP products often could not offer sufficiently
    compelling incentives because trader costs were too high relative to available
    revenue from single market streams.
  lesson_learnt: Increasing VPP consumer uptake requires both enabling value stacking
    across multiple revenue streams and reducing trader integration costs through
    standardisation — these are complementary levers that together determine the financial
    incentive a trader can credibly offer consumers.
