  project_name: DEIP Market Integration Trials (cross-trial finding)
  what_happened: All trials identified that heterogeneous, point-to-point data integration
    between traders, DSOs, and market operators was costly and complex; a consistent
    finding was that a centralised data hub with standardised, authenticated data
    sharing would significantly reduce integration costs and improve data accessibility
    across the ecosystem.
  lesson_learnt: DER market integration programs should design for a centralised data
    hub from the outset rather than building point-to-point integrations that are
    expensive to maintain and scale — governance arrangements for such hubs must be
    agreed before implementation to avoid delays in progress.
