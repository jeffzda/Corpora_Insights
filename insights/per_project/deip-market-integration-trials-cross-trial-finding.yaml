  source_title: DEIP Market Integration Trials Summary Report 3.0
  publish_date: '2026-01-27'
  project_name: DEIP Market Integration Trials (cross-trial finding)
  what_happened: All market integration trials found that governance arrangements
    for shared services such as data exchanges and common standards had not been established
    before trials commenced, creating uncertainty that slowed progress on implementing
    shared infrastructure and standards.
  lesson_learnt: Governance bodies and processes for ongoing development and operation
    of shared DER services — including data exchanges and communication standards
    — must be formalised before these services are built, not after; absence of agreed
    governance is a primary barrier to industry confidence and investment in shared
    infrastructure.
