  source_title: DEIP Market Integration Trials Summary Report 3.0
  publish_date: '2026-01-27'
  project_name: DEIP Market Integration Trials (cross-trial finding)
  what_happened: Across all four market integration trials, co-optimisation of energy
    market bids and dynamic operating envelopes outside the trader was explored but
    found to be infeasible — it would require traders to bid on a per-household scale,
    which they do not do; instead traders manage bids at the portfolio level.
  lesson_learnt: Policy and trial designs that assume per-household bid granularity
    for co-optimisation of market and network dispatch are not feasible with current
    trader operations — near-term DER integration programs should delegate co-optimisation
    complexity to traders at the portfolio level and design incentives accordingly.
