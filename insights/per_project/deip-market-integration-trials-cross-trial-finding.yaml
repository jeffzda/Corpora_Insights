- record_id: ARENA-DLV-68329
  source_title: DEIP Market Integration Trials Summary Report 3.0
  publish_date: '2026-01-27'
  project_name: DEIP Market Integration Trials (cross-trial finding)
  what_happened: Across all trials, current network regulations were found not to
    provide appropriate incentives for DSOs to prefer DER over traditional network
    augmentation, even where DER was demonstrably the more cost-effective solution;
    existing AER performance metrics were shown to penalise networks that successfully
    flatten peak demand using DER.
  lesson_learnt: Regulations governing network performance measurement and investment
    must be reformed before DSOs will voluntarily prefer DER network services over
    traditional augmentation — existing AER metrics that assess utilisation against
    peak demand can perversely penalise effective DER integration and must be updated
    to reflect DSO objectives.
