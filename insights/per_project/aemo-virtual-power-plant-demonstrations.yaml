  what_happened: The flexible exports trial with Energy Locals, Tesla, SAPN, and CSIRO
    demonstrated that dynamic export limits (replacing a fixed 5 kW/phase limit) could
    enable VPP sites to export more than double the standard limit and provided 24-hour
    network-aware export forecasts. The system enabled more than 1 MW of additional
    dispatch capacity during certain conditions across approximately 900 sites.
