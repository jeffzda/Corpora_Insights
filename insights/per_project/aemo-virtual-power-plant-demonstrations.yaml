  what_happened: The SAPN Advanced VPP Grid Integration trial demonstrated that enabling
    flexible export limits (dynamic operating envelopes) allowed VPP sites to export
    up to 10 kW rather than the standard 5 kW cap during periods of available network
    capacity, while voltage remained within bounds. This simultaneously improved FCAS
    delivery capability and consumer value.
  lesson_learnt: Dynamic operating envelopes sent by DNSPs to VPP aggregators can
    unlock additional FCAS capacity and consumer export value in high-DER areas —
    future VPP deployments in constrained distribution networks should prioritise
    establishing DOE exchange mechanisms with the local DNSP before programme launch
    rather than treating it as a future enhancement.
