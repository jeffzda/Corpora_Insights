  what_happened: Many VPP participants operated with excessive caution during the
    on-market demonstration because real financial clawback rules applied if FCAS
    delivery fell short of enabled targets. This cautious approach may have restricted
    the extent of 'learning by doing' that could otherwise have been achieved.
  lesson_learnt: When running on-market DER demonstrations where real FCAS clawback
    rules apply, programme designers should consider safe-harbour or limited-liability
    provisions for participants during the learning phase — commercial risk aversion
    suppresses experimental behaviour and reduces the breadth of learning generated.
