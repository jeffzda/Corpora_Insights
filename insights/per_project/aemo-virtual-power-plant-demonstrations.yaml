  what_happened: Under normal energy price conditions ($0–$300/MWh), VPP charging
    and discharging behaviour was primarily driven by household self-consumption optimisation
    rather than market price signals. VPPs only exhibited price-responsive behaviour
    at extreme price outcomes (very high or very negative prices).
  lesson_learnt: Do not assume VPPs will respond to typical wholesale energy price
    signals — VPP dispatch logic optimised for household self-consumption will not
    change behaviour within the normal $0–$300/MWh price range, limiting their contribution
    to energy market efficiency unless explicit price-responsive control logic is
    implemented.
