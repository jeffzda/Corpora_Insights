  project_name: AEMO Virtual Power Plant Demonstrations
  what_happened: sonnen's switched-controller VPP successfully met its 1 MW FCAS enablement
    obligation during the Callide C3 and C4 generator trip on 13 January 2021, demonstrating
    that dynamically adjustable frequency deviation trigger settings can produce a
    proportional aggregate VPP response from individual switching devices.
  lesson_learnt: Switched-controller VPPs can reliably deliver contingency FCAS if
    frequency deviation trigger settings are dynamically adjusted across the fleet
    — this design approach enables proportional aggregate response without requiring
    each device to implement a continuous proportional controller, expanding the hardware
    types compatible with FCAS markets.
