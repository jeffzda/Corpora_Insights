  what_happened: The National Electricity Rules were not written with the bi-directional
    capability of VPPs in mind, requiring AEMO to put in place Interim Arrangements
    for FCAS from DER to allow export from load connection points — a workaround that
    does not constitute a permanent regulatory fix.
