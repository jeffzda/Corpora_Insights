- record_id: ARENA-DLV-40515
  source_title: AEMO Virtual Power Plant Demonstrations Knowledge Sharing Report 2
  publish_date: 2020-07
  project_name: AEMO Virtual Power Plant Demonstrations
  what_happened: Raise FCAS services for the Energy Locals VPP were typically enabled
    at maximum capacity (2 MW), indicating batteries were rarely so discharged that
    a 2 MW raise response could not be achieved. However, lower FCAS enablement varied
    significantly across operating regimes — particularly the afternoon period — raising
    questions about whether this was seasonal or a VPP-specific pattern.
  lesson_learnt: VPP demonstrations should run for at least one full year across multiple
    operators and technology types before drawing conclusions about FCAS enablement
    patterns — short-window observations cannot distinguish seasonal behaviour from
    operator strategy changes, limiting their value for market design and scheduling
    rule development.
