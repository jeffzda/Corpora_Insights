  what_happened: VPP forecast analysis (1–7 May 2020 sample) found that VPP load and
    generation forecasts could be up to 40% different from actuals at the 1-hour-ahead
    horizon, with daytime charging and evening peak generation the hardest periods
    to forecast accurately.
  lesson_learnt: VPP operators should invest in collaborative forecast improvement
    with solar forecast providers and AEMO, particularly for daytime and evening peak
    periods — these are the most critical for system security and also the periods
    of highest forecast error, meaning unimproved forecasting could undermine both
    VPP scheduling and power system reliability.
