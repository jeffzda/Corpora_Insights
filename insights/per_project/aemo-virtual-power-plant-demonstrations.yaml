- record_id: ARENA-DLV-40505
  source_title: AEMO Virtual Power Plant Demonstrations Knowledge Sharing Report 2
  publish_date: 2020-07
  project_name: AEMO Virtual Power Plant Demonstrations
  what_happened: When the Energy Locals VPP simultaneously responded to a high energy
    price signal and a lower contingency FCAS event, the two responses were in opposing
    directions. The net power measurement made it impossible to distinguish FCAS delivery
    from the energy response, appearing as FCAS under-delivery and risking a settlement
    clawback.
  lesson_learnt: VPPs value-stacking energy and FCAS markets must implement control
    logic that prioritises contingency FCAS delivery when frequency is outside the
    normal operating band — responding to conflicting energy price signals during
    a frequency excursion risks apparent FCAS under-delivery and triggering settlement
    clawbacks.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: government/public-sector body
  delay_category: null
  failure_mode: integration failure
  outcome_class: re-scoped/adapted
  secondary_failure_mode: technical underperformance
  intervention_note: 'Energy Locals proposed and AEMO accepted a new verification
    method: the VPP responds to energy price signals only within the normal operating
    frequency band, prioritises FCAS during excursions, and uses a 5-second pre-excursion
    baseline to calculate and verify the FCAS response.'
  transferability: moderate
  delay_magnitude: null
  technology_domain: battery storage
