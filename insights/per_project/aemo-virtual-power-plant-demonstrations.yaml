  source_title: AEMO NEM Virtual Power Plant Demonstrations Knowledge Sharing Report
    4
  publish_date: 2021-09
  project_name: AEMO NEM Virtual Power Plant Demonstrations
  what_happened: Distribution network constraints — particularly local power quality
    issues (high voltage) in areas with high rooftop PV penetration — were identified
    by both AGL and Simply Energy as limiting VPP performance and FCAS delivery capability
    in South Australia, because volt/var and volt/watt inverter responses reduced
    available real power output.
  lesson_learnt: VPP operators in high-PV areas must account for distribution network
    voltage constraints when sizing their FCAS bids — local overvoltage conditions
    can trigger autonomous inverter derating that reduces effective fleet capacity
    below the bid amount, requiring additional conservative buffers or dynamic operating
    envelopes from the DNSP.
