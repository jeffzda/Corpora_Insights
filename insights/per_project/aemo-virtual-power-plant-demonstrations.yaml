  what_happened: During the record South Australian minimum demand event on 11 October
    2020, forecast errors for the Energy Locals (Tesla) VPP ranged from 9% to 25%
    for 1-hour and day-ahead forecasts, and reached 42% (~4.6 MW) for the 12-hour
    ahead forecast, reflecting the highly dynamic price-responsive behaviour of the
    VPP fleet.
