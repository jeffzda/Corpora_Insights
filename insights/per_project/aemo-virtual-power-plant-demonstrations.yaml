  what_happened: Wholesale Demand Response access for VPPs was limited to large customers
    (generally >100 MWh or >40 MWh in Victoria), effectively excluding the residential-scale
    aggregated portfolios characteristic of VPPs from this value stream.
  lesson_learnt: Demonstration programs for residential VPPs should identify all relevant
    market value streams early in design and map them against eligibility thresholds
    — the WDR large-customer threshold structurally excludes residential VPPs from
    this revenue stream, and rule changes need to be initiated in parallel with the
    demonstration rather than after.
