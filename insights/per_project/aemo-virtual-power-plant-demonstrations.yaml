  source_title: Evaluation of ARENA's VPP Portfolio
  publish_date: 2021-06
  project_name: AEMO Virtual Power Plant Demonstrations
  what_happened: The AEMO VPP Demonstrations project validated VPP capability to participate
    in FCAS markets, provided AEMO visibility of VPP response to market events, and
    informed the development of the MASS. However, the project achieved only partial
    progression of TRL (starting from TRL 7) and CRI (starting from CRI 2), with no
    clear frontrunner commercial model identified.
  lesson_learnt: When structuring a market-operator-led VPP demonstration, build explicit
    pathways from trial outcomes to regulatory change (e.g. specification updates)
    and ensure that commercial model validation is a co-equal objective alongside
    technical performance testing, otherwise TRL and CRI progression will stall.
