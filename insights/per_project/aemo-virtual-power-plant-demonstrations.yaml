  project_name: AEMO Virtual Power Plant Demonstrations
  what_happened: The AEMO project required a minimum capacity of 1 MW for VPP operators
    to participate in FCAS markets, creating an early-stage entry barrier that could
    slow market development for small or nascent VPP aggregators.
  lesson_learnt: When designing VPP market access trials, consider whether minimum
    capacity thresholds act as an unintended barrier to entry for smaller or emerging
    aggregators, and explore whether staged or tiered participation thresholds would
    better support early commercial development.
