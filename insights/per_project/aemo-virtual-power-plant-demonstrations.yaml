- record_id: ARENA-DLV-10754
  source_title: AEMO Virtual Power Plant Demonstration Knowledge Sharing Report 1
  publish_date: 2020-03
  project_name: AEMO Virtual Power Plant Demonstration
  what_happened: The VPP Demonstration's synchronous API design performed well for
    small payloads but was identified as a scalability constraint — as payload size
    increases, API response times degrade, risking timeouts, network errors, and unsatisfactory
    user experience when the VPP fleet grows.
  lesson_learnt: Synchronous API architectures suitable for demonstration-scale VPP
    deployments are not fit for production-scale fleets; future VPP platforms should
    implement bundling, transaction limits per request, and streaming for large data
    volumes to ensure scalability from pilot to commercial operation.
