- record_id: ARENA-DLV-55253
  source_title: AEMO NEM Virtual Power Plant Demonstrations Knowledge Sharing Report
    4
  publish_date: 2021-09
  project_name: AEMO NEM Virtual Power Plant Demonstrations
  what_happened: During the South Australia separation event on 28 January 2020, the
    Energy Locals (Tesla) SA VPP under-delivered contingency FCAS Lower service because
    batteries that should have been charging (to deliver the lower FCAS response)
    were instead discharging in response to a coincident high energy spot price.
  lesson_learnt: VPP value-stacking algorithms must be designed so that contingency
    FCAS delivery is automatically prioritised over energy spot price responses when
    system frequency moves outside the normal operating band — failing to implement
    this hierarchy causes under-delivery and potential financial clawback.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: government/public-sector body
  delay_category: null
  failure_mode: unvalidated integration
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: 'A new value-stacking method was implemented: energy price responses
    are prohibited when frequency is detected outside the normal operating frequency
    band, ensuring FCAS delivery takes precedence.'
  transferability: moderate
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id040
  - 31
  evidence_excerpt: Under-delivery occurred during a high frequency event that coincided
    with a high energy spot price. Batteries that should have been charging to deliver
    an FCAS lower service were discharging in response to the high energy price. New
    method to value stacking implemented. When the frequency is within the NOFB, the
    VPP may respond to energy price signals. However, the VPP will prioritise the
    delivery of contingency FCAS when the frequency is outside the NOFB.
