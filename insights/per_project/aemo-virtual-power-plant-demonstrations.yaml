- record_id: ARENA-DLV-61719
  source_title: AEMO Virtual Power Plant Demonstrations Knowledge Sharing Report 3
  publish_date: 2021-02
  project_name: AEMO Virtual Power Plant Demonstrations
  what_happened: The VPP demonstrations onboarding process was designed as a bespoke,
    manually intensive solution that did not leverage concurrent processing or automation,
    creating unnecessary friction for participants and AEMO alike. A new portfolio
    management platform was subsequently planned to address WDR and aggregated ancillary
    service loads in a unified, automated way.
  lesson_learnt: Demonstration programs should be designed with a clear pathway to
    a production-grade operational platform from the outset — bespoke manual solutions
    built for demonstration purposes create technical debt and participant friction
    that must be re-engineered for ongoing market participation, delaying the transition
    to enduring arrangements.
