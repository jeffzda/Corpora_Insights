  what_happened: VPPs bidding in FCAS markets at very low price bands have already
    begun displacing traditional coal-fired generation providers in some markets,
    with VPP FCAS market share growing from 0.6% to 3% between April 2020 and April
    2021, and average FCAS enablement increasing from 2 MW to 14 MW over the same
    period.
