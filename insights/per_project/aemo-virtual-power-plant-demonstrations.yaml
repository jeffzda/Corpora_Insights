  publish_date: 2021-09
  project_name: AEMO NEM Virtual Power Plant Demonstrations
  what_happened: 'An important data interpretation issue was identified in the SAPN
    trial: voltage measurements received via the API were taken at the battery inverter
    inside the consumer premises, not at the network connection point, meaning that
    high export conditions could raise voltage within the premises while the LV network
    and neighbouring supplies remained compliant.'
  lesson_learnt: When using inverter-level voltage telemetry to assess network compliance,
    the impedance of consumers' on-site wiring must be explicitly accounted for —
    measurements at the battery inverter can overstate apparent network voltage stress
    during export events, leading to incorrect constraint signals.
