- record_id: ARENA-DLV-10752
  source_title: AEMO Virtual Power Plant Demonstration Knowledge Sharing Report 1
  publish_date: 2020-03
  project_name: AEMO Virtual Power Plant Demonstration
  what_happened: AEMO's existing regulatory framework classified load connection points
    as ancillary services loads only on the import side, preventing DER behind load
    connection points from providing FCAS through export — effectively excluding VPPs
    from FCAS markets until interim arrangements were published in December 2019.
  lesson_learnt: Regulatory frameworks designed for traditional generation assets
    can inadvertently exclude DER and VPP aggregators from ancillary services markets;
    early regulatory assessment and proactive engagement with the market operator
    to develop interim arrangements is necessary before VPP participants can access
    full revenue streams.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: approvals/contracting
  proponent_type: government/public-sector body
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: AEMO developed and published Interim Arrangements for FCAS from
    DER in December 2019, recognising bi-directional operation of load connection
    points to deliver FCAS and enabling VPPs to provide frequency services as both
    generation and load.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: DER
  source_pages: &id001
  - 14
  evidence_excerpt: AEMO's general approach (before the VPP Demonstrations) has been
    to treat an application for approval to classify a load as an ancillary services
    load with respect to the import side of the connection point only... As a result
    of this approach, only Market Generators have been eligible to provide ancillary
    services through export to the grid.
