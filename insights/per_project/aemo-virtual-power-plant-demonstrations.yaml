  source_title: AEMO Virtual Power Plant Demonstrations Knowledge Sharing Report 3
  publish_date: 2021-02
  project_name: AEMO Virtual Power Plant Demonstrations
  what_happened: VPP participants prioritised fleet availability for FCAS markets
    over other value streams, resulting in highly divergent normalised earnings —
    Energy Locals (Tesla) earned $56,309/MW versus AGL's $27,668/MW for the same period
    — making accurate AEMO forecasting of aggregate VPP behaviour increasingly difficult.
  lesson_learnt: As VPPs scale, different price-response behaviours across aggregators
    will make supply-demand forecasting materially harder in the absence of scheduling
    obligations; demonstration programs should explicitly investigate the forecasting
    implications of divergent VPP market strategies before scaling, and planners should
    not assume uniform VPP behaviour.
