  what_happened: Prior to the VPP Demonstrations, AEMO's FCAS classification approach
    did not allow load connection points to have net exports recognised for Raise
    FCAS, requiring VPPs to register as two separate market participants for their
    load and generation capabilities. This was identified early in the project as
    a structural barrier to VPP participation.
  lesson_learnt: Market frameworks for VPPs should explicitly accommodate bi-directional
    connection points from the outset — requiring separate registrations for load
    and generation creates unnecessary complexity and cost for VPP operators and delays
    their ability to stack FCAS services.
