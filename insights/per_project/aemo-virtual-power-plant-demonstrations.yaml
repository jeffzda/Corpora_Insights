  publish_date: '2021-09-10'
  project_name: AEMO VPP Demonstrations
  what_happened: After more than one year of VPP participation, 30% of consumers had
    moved to a 'set and forget' mode with minimal engagement, while 41% remained emotionally
    involved; this polarisation meant that a large proportion of consumers were difficult
    to reach with ongoing communications and validation.
  lesson_learnt: Plan for engagement polarisation over time in VPP programs — develop
    differentiated retention strategies for highly engaged and disengaged consumers,
    including automated personalised reporting and push notifications to re-engage
    consumers who have drifted into set-and-forget mode.
