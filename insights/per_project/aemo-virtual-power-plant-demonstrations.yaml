  intervention_note: Tesla recommended that total registered capacity be based on
    nameplate capacity of aggregated assets with bids submitted based on available
    capacity during each dispatch period.
  transferability: broad
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id005
  - 18
  evidence_excerpt: Under the current approach, VPPs register the amount of capacity
    that they are able to demonstrate they can provide as per the results of the VPP
    wide test. This is managed in 1MW increments as per the National Electricity Rules
    (NER). This will not be directly equal to the nameplate capacity as available
