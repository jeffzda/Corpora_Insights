- record_id: ARENA-DLV-55267
  source_title: AEMO NEM Virtual Power Plant Demonstrations Knowledge Sharing Report
    4
  publish_date: 2021-09
  project_name: AEMO NEM Virtual Power Plant Demonstrations
  what_happened: Participants and prospective participants reported that the cost
    of developing and maintaining the required APIs was a significant barrier to entry
    and reduced the return on investment for participating VPP operators. The API
    overhead, combined with the 1 MW minimum portfolio requirement, prevented smaller
    operators and alternative technology types (EVs, hot water systems) from joining
    the Demonstrations.
  lesson_learnt: Future VPP demonstration programmes should minimise mandatory API
    and data-exchange requirements and reduce minimum portfolio size thresholds —
    high technical compliance costs disproportionately exclude smaller operators and
    emerging technology types from participating, limiting the breadth of evidence
    generated.
