  project_name: AEMO Virtual Power Plant Demonstration
  what_happened: The SA VPP demonstrated that aggregated residential battery storage
    could reliably respond to contingency FCAS events — including two major grid separation
    events and a large generator trip — delivering rapid frequency response (within
    seconds) and earning $225,000 over its first four months of operation, with 59%
    of revenue concentrated in five contingency events.
  lesson_learnt: VPP revenue from contingency FCAS is highly concentrated in a small
    number of major power system events — project proponents and consumers should
    be aware that average daily revenues ($761/day excluding major events) are substantially
    lower than peak event revenues ($50,000–$60,000/day), and business models must
    account for this volatility.
