  what_happened: The 50 ms metering requirement at every NMI for Fast FCAS (6-second
    service) under the existing MASS was identified as a barrier to entry for residential
    VPPs, since most residential battery systems capture data at lower resolution.
    AEMO developed an alternative FCAS specification allowing 1-second per-site metering
    supplemented by a single high-speed meter per region.
  lesson_learnt: Regulatory specifications for FCAS verification developed for large
    centralised generators can unintentionally exclude distributed residential resources
    — when designing participation frameworks for DER, measurement and verification
    requirements should be assessed against realistic residential device capabilities
    and calibrated using international benchmarks such as the UK FFR and Netherlands
    FCR arrangements.
