  project_name: AEMO NEM Virtual Power Plant Demonstrations
  what_happened: The VPP Demonstrations revealed that AEMO's existing operational
    forecasting was experiencing degradation in accuracy during periods of price volatility
    because price-responsive VPP and demand-side resources were operating without
    any visibility or reporting obligations to AEMO — a gap that will worsen as VPP
    capacity grows.
  lesson_learnt: Operational visibility frameworks for VPPs must be established before
    VPP capacity reaches material regional thresholds — waiting until VPPs are large
    enough to be required to participate in central dispatch creates an interim period
    during which system security forecasting is materially compromised.
