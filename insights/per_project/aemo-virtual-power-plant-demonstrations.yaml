  what_happened: All eight VPPs in the trial primarily operated to maximise household
    self-consumption rather than to respond to wholesale energy price signals. Response
    to extreme prices (>$10,000/MWh) was inconsistent — only three of seven VPPs responded
    at all, and the most reactive VPP only responded around 39% of the time at those
    prices.
  lesson_learnt: Integrated system planning models should not assume VPPs will respond
    reliably to wholesale price signals — actual behaviour is dominated by household
    self-consumption algorithms and customer contract constraints, producing price
    response rates well below modelled assumptions, particularly for extreme price
    events.
