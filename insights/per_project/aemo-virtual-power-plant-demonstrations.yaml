- record_id: ARENA-DLV-59667
  source_title: Virtual Power Plant Demonstrations Consumer Insights Report
  publish_date: '2021-09-10'
  project_name: AEMO VPP Demonstrations
  what_happened: The mild summer climate during the 2020–21 survey period (South Australia
    recorded its coolest summer since 2001–02, NSW and Victoria reported wet and cool
    conditions) reduced solar PV generation potential and electricity demand, limiting
    VPP dispatch events and constraining the financial benefits consumers could observe
    during the study window.
  lesson_learnt: Design VPP demonstration evaluation periods to span multiple seasonal
    cycles — a single mild summer can materially suppress observable financial and
    operational benefits, understating the technology's value and leading to consumer
    dissatisfaction that may not be representative of typical performance.
