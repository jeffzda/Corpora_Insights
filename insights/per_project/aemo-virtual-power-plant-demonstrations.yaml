  source_title: AEMO Virtual Power Plant Demonstrations Knowledge Sharing Report 2
  publish_date: 2020-07
  project_name: AEMO Virtual Power Plant Demonstrations
  what_happened: VPP batteries were observed to become fully charged early on sunny
    days, meaning VPP controlled load rapidly reduced before DPV generation peaked
    and minimum grid demand occurred. This meant the VPP could not assist in absorbing
    the rapid decline in minimum grid load — a power system security concern.
  lesson_learnt: VPP control strategies must account for the risk of premature full
    charge on high-solar days — if batteries are fully charged when solar generation
    peaks and minimum demand occurs, the VPP loses its ability to provide demand absorption
    precisely when the grid most needs it; control schemes should reserve charging
    headroom for system-critical periods.
