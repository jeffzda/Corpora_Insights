  project_name: AEMO Virtual Power Plant Demonstrations
  what_happened: Telemetry data analysis for March 2020 showed that 5–8% of required
    data from VPP households was consistently missing at any given time, with some
    interruptions lasting between half a day and four days, caused by weak internet
    connections, 3G network shutdown, modem disconnections, and data-pipeline API
    gateway overload.
  lesson_learnt: VPP operators and system designers must treat household communication
    reliability as a hard engineering constraint — plan for 5–8% continuous data loss
    from household modems and design dispatch, bidding, and FCAS verification systems
    that remain valid under this level of missing telemetry.
