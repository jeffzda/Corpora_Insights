  source_title: AEMO Virtual Power Plant Demonstrations Knowledge Sharing Report 2
  publish_date: 2020-07
  project_name: AEMO Virtual Power Plant Demonstrations
  what_happened: Communication dropouts from household modems — while not impeding
    locally-detected FCAS delivery — were found to reduce VPP operators' visibility
    of fleet state of charge, potentially limiting the FCAS capacity they were willing
    to offer. If VPPs were to be scheduled for energy dispatch in future, the same
    dropouts would prevent delivery of market dispatch instructions, as these are
    not locally detected.
  lesson_learnt: Before VPPs participate in centrally-dispatched energy markets, regulators
    and operators must resolve how communication unreliability will be handled — FCAS
    can be delivered locally without a network connection, but energy market dispatch
    instructions cannot, meaning the same 5–8% dropout rate that is tolerable for
    FCAS becomes a delivery compliance risk for scheduled energy.
