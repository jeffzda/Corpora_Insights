  what_happened: Volt-Watt and Volt-Var power quality response modes in residential
    inverters were found to significantly curtail real power output during large FCAS
    discharge events when grid voltages were already elevated (~250 V). Under TS129,
    a 5 kW inverter's real power would be curtailed to approximately 3.7 kW at 255
    V, materially reducing the available real power for frequency control services.
  lesson_learnt: VPP operators and regulators must account for the interaction between
    Volt-Watt/Volt-Var curtailment and FCAS delivery capability — residential inverter
    power quality response modes can substantially reduce available FCAS capacity
    during exactly the high-stress grid conditions when FCAS is most needed, and current
    standards may need revision to define a primacy hierarchy for inverter responses.
