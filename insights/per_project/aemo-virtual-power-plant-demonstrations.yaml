  intervention_note: SAPN's Advanced VPP Grid Integration trial tested dynamic operating
    envelopes (flexible export limits) sent to the VPP to signal available local network
    capacity; this allowed the VPP to adjust bids to reflect real constraints and
    enabled exports up to 10 kW when capacity permitted.
