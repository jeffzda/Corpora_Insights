  publish_date: 2021-09
  project_name: AEMO NEM Virtual Power Plant Demonstrations
  what_happened: 'The VPP Demonstrations confirmed that DER cyber security risks are
    materially different from those of the bulk energy system: DER devices use consumer
    internet, open protocols, and public networks rather than closed proprietary systems,
    creating a larger and more accessible attack surface. However, no formal regulations
    in Australia mandated cyber security controls for VPP/aggregator entities at the
    time of the trial.'
  lesson_learnt: Future DER/VPP programme designers should not assume that voluntary
    cyber security frameworks provide sufficient protection at scale — the open, internet-connected
    architecture of residential DER creates systemic cyber risks that require mandatory
    baseline controls, particularly for aggregators whose compromise could simultaneously
    affect thousands of devices.
