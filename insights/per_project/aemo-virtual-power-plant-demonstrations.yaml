  source_title: AEMO Virtual Power Plant Demonstrations Knowledge Sharing Report 3
  publish_date: 2021-02
  project_name: AEMO Virtual Power Plant Demonstrations
  what_happened: As VPPs grow in size and market materiality, their highly price-responsive
    and volatile collective behaviour risks degrading AEMO's central forecasting accuracy,
    potentially causing large power swings on the network and jeopardising system
    security in the absence of scheduling obligations or operational visibility requirements.
  lesson_learnt: Regulatory frameworks for aggregated DER must include visibility,
    forecastability and eventually dispatchability obligations that scale with VPP
    size — the demonstration showed that voluntary data sharing is insufficient at
    scale, and that a 'Scheduled Light' or equivalent threshold-based scheduling mechanism
    is needed before VPPs reach hundreds of megawatts.
