  project_name: AEMO Virtual Power Plant Demonstrations
  what_happened: Consumer research across 470 surveys and 23 interviews found that
    72% of VPP consumers did not have any hardware installed before joining the VPP,
    and that 42% were primarily motivated by bill savings and 19% by government subsidies,
    indicating consumer participation is heavily dependent on financial incentives
    and hardware access programs.
  lesson_learnt: VPP consumer recruitment strategies must offer compelling financial
    value propositions — bill savings and subsidised hardware are the dominant drivers
    of participation; programs that rely on environmental or community benefits alone
    will attract only a narrow early-adopter cohort and will not scale without competitive
    commercial offers.
