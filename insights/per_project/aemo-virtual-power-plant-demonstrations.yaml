- record_id: ARENA-DLV-10756
  source_title: AEMO Virtual Power Plant Demonstration Knowledge Sharing Report 1
  publish_date: 2020-03
  project_name: AEMO Virtual Power Plant Demonstration
  what_happened: Under NER rules, VPP registered capacity was managed in 1 MW increments
    based on demonstrated capacity from VPP-wide fleet tests, rather than the nameplate
    capacity of aggregated assets, which did not accurately reflect real available
    capacity during dispatch periods.
  lesson_learnt: VPP registration frameworks that tie registered capacity to fleet
    test results rather than nameplate capacity with dynamic bid adjustments are misaligned
    with how aggregated DER actually operates; registration rules should allow nameplate-based
    registration with bids submitted based on real-time state-of-charge and load profiles.
  issue_severity: moderate
  project_type: DER/customer-side
