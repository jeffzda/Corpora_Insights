    at providing contingency FCAS, responding to several major power system events
    including the Kogan Creek trip (748 MW), multiple South Australia separation events,
    and the Callide C3/C4 trips (826 MW combined), growing FCAS market share from
    0.6% in April 2020 to 3% in April 2021.
