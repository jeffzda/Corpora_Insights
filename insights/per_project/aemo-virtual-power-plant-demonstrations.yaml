  what_happened: VPP reliance on household technology and public telecommunications
    networks for communication was identified as posing a cyber security risk. AEMO's
    cyber security questionnaire assessed prospective participants' maturity but the
    limited participation base meant that risks from new entrants and start-ups had
    not yet been stress-tested.
  lesson_learnt: VPP programs must treat household-to-operator communications over
    public telecom networks as a potential cyber attack surface — prospective participants
    should be assessed against minimum cyber security standards before enrolment,
    and a minimum technical standard should be mandated consistently across the NEM
    to avoid a fragmented security baseline as the industry scales.
