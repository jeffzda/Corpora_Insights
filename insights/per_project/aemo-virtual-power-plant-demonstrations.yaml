  what_happened: The VPP Demonstrations operated only in contingency FCAS markets.
    Technical barriers — specifically the need to respond to AEMO's AGC signal via
    SCADA — prevented residential VPPs from participating in regulation FCAS markets,
    which provide more continuous and predictable revenue streams.
  lesson_learnt: Programme designers targeting VPP revenue diversification should
    assess technical barriers to regulation FCAS participation early — SCADA-based
    AGC communication requirements are incompatible with internet-connected residential
    VPPs, and alternative communication pathways need to be developed before regulation
    FCAS can become a viable VPP revenue stream.
