  project_name: AEMO Virtual Power Plant Demonstrations
  what_happened: The Small Generator Aggregator (SGA) participant category, the primary
    NER pathway for non-retailer VPPs to access wholesale energy markets, is not bi-directional,
    explicitly prohibits FCAS provision, and requires a separate connection point
    for each generating system — making it structurally unsuitable for VPP operation.
  lesson_learnt: Before deploying VPP aggregation projects at scale, proponents should
    map all intended market participation pathways against NER participant categories
    early — the SGA category contains three structural barriers that prevent VPPs
    from operating commercially, requiring rule changes that take considerable time.
