- record_id: ARENA-DLV-10751
  source_title: AEMO Virtual Power Plant Demonstration Knowledge Sharing Report 1
  publish_date: 2020-03
  project_name: AEMO Virtual Power Plant Demonstration
  what_happened: The SA VPP under-delivered contingency FCAS during the 16 November
    2019 Victoria–South Australia regional separation event, providing only 828 kW
    (83%) of the 1 MW bid, because fewer systems than expected had the correct frequency
    support settings enabled.
  lesson_learnt: VPP operators must implement pre-enrollment verification that all
    enrolled assets have correct frequency support settings configured — misconfigured
    settings caused an 17% FCAS under-delivery during a major contingency event. Daily
    automated checks on all systems are recommended to ensure ongoing compliance with
    configuration requirements.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: government/public-sector body
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: execution & logistics
  intervention_note: Tesla remotely reconfigured non-compliant systems immediately
    after the event was identified and introduced daily checks on all systems to ensure
    correct frequency/power settings going forward.
  transferability: broad
  delay_magnitude: null
  technology_domain: battery storage
  source_pages:
  - 8
  - 31
  evidence_excerpt: Energy Locals and Tesla realised that fewer systems than expected
    had the appropriate frequency support settings enabled. This led to fewer individual
    units responding as part of the VPP to deliver a reduced fast lower FCAS aggregate
    response; this equated to 83% of the expected response, or 828 kilowatts (kW)
    rather than 1 MW bid.
