  source_title: AEMO Virtual Power Plant Demonstrations Knowledge Sharing Report 3
  publish_date: 2021-02
  project_name: AEMO Virtual Power Plant Demonstrations
  what_happened: VPP forecasting accuracy was best when the fleet operated in household
    self-consumption mode and deteriorated significantly when responding dynamically
    to market signals, with challenges compounded by the highly dynamic nature of
    VPP responsiveness.
  lesson_learnt: VPP operators and system planners should distinguish between self-consumption
    operating mode (where forecasting is reliable) and market-responsive operating
    mode (where forecast errors are large) when designing operational visibility frameworks
    — treating all VPP operating states as equally forecastable will underestimate
    system risk.
