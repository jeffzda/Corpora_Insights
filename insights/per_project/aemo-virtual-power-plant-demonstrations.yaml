  what_happened: VPP revenue was found to be strongly correlated with the occurrence
    of power system events, responsiveness to market signals, and participation across
    multiple contingency FCAS markets — participants who enrolled in all six contingency
    FCAS markets and maintained high fleet availability earned significantly more
    revenue per MW than those who did not.
  lesson_learnt: VPP business cases should be designed around participation in all
    available contingency FCAS markets (all six raise/lower services) with high fleet
    availability, as revenue is event-driven and participation breadth is the primary
    lever within operator control — narrower market participation substantially reduces
    revenue potential and weakens the consumer value proposition.
