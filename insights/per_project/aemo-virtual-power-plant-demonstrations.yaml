- record_id: ARENA-DLV-10757
  source_title: AEMO Virtual Power Plant Demonstration Knowledge Sharing Report 1
  publish_date: 2020-03
  project_name: AEMO Virtual Power Plant Demonstration
  what_happened: The registration process required a VPP-wide fleet test every time
    a VPP registration was updated — including for simple capacity updates under scenario
    4 — adding delays to registration updates and hampering scalability, particularly
    because frequency excursion events often did not last long enough to collect meaningful
    test data.
  lesson_learnt: Requiring a full VPP-wide fleet test for every registration update,
    including simple capacity additions using the same technology, creates disproportionate
    administrative burden and delays scalability; regulators should allow simplified
    registration pathways (API-based NMI updates plus fleet-wide configuration checks)
    for capacity-only updates with ex post compliance data provided instead.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: approvals/contracting
  proponent_type: government/public-sector body
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Tesla recommended that scenario 4 updates (capacity only, same
    technology) use an API-based NMI list update plus fleet-wide configuration test
    plus ex post compliance data, removing the requirement for a full VPP-wide test.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id006
  - 18
  evidence_excerpt: The current registration approach requires a VPP wide fleet test
    every time a VPP registration is updated... This adds delays to registration updates
