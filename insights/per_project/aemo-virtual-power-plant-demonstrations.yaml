  source_title: AEMO NEM Virtual Power Plant Demonstrations Knowledge Sharing Report
    4
  publish_date: 2021-09
  project_name: AEMO NEM Virtual Power Plant Demonstrations
  what_happened: VPP gross operational data (separately capturing battery charge/discharge
    and PV generation) was more valuable to AEMO than net connection point flow data
    because the net data obscured behind-the-meter activity — for example, battery
    charging could appear as low PV generation in net data, masking the true state
    of the distribution system.
  lesson_learnt: Future VPP data specifications should require gross rather than net
    operational data from aggregators — net connection-point flow data conflates battery
    activity with generation and load, making it impossible to accurately forecast
    grid conditions or manage distribution network constraints.
