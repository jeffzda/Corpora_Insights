  publish_date: 2021-09
  project_name: AEMO NEM Virtual Power Plant Demonstrations
  what_happened: VPP FCAS forecast accuracy did not improve with decreased lead time
    — errors remained at approximately 12% at both 5-minute and 24-hour ahead horizons.
    This behaviour is unlike large-scale solar where forecast accuracy improves substantially
    at shorter lead times, meaning VPPs cannot be relied upon to self-correct forecasts
    in the pre-dispatch timeframe.
  lesson_learnt: Do not assume VPP charge/discharge forecasts will approach the accuracy
    of large-scale generation forecasts — VPP forecast errors are 3–6 times higher
    at all forecast horizons due to complex household-first operating algorithms,
    and systems that rely on VPP forecasts for operational decision-making must be
    designed to tolerate this level of inaccuracy.
