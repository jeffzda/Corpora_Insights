- record_id: ARENA-DLV-52009
  source_title: ARENA Short Term Forecasting Funding Round Evaluation
  publish_date: 2021-10
  project_name: ARENA Short-Term Self-Forecasting Trial
  what_happened: Market participants with multiple Dispatchable Unit Identifiers (DUIDs)
    experienced additional complexity integrating with AEMO's API platform, requiring
