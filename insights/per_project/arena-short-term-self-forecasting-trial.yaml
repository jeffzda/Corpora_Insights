  what_happened: Poor quality or missing SCADA data — including missing or incorrect
    data mapping, data dropout, and low resolution historical data — was identified
    as a significant barrier to improving solar forecast accuracy across multiple
    participants.
  lesson_learnt: Establish high-resolution historical SCADA data capture and robust
    data quality filtering before deploying a solar forecasting model — missing, incorrect,
    or low-resolution training data directly degrades forecast accuracy and is one
    of the most demanding aspects of solar forecasting.
