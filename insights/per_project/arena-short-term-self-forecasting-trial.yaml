  source_title: ARENA Short Term Forecasting Funding Round Evaluation
  publish_date: 2021-10
  project_name: ARENA Short-Term Self-Forecasting Trial
  what_happened: Sky cameras used for solar forecasting without self-cleaning devices
    showed significantly reduced forecast effectiveness due to atmospheric contamination
    (dust and bird droppings), while cameras with self-cleaning devices improved forecast
    performance by 20–30% relative to those without.
  lesson_learnt: Specify self-cleaning devices on sky cameras used for solar forecasting
    — atmospheric contamination is a persistent operational issue in Australian conditions,
    and self-cleaning devices have been shown to improve forecast performance by 20–30%
    relative to unprotected cameras.
