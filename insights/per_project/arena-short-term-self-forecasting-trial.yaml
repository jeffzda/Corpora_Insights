- record_id: ARENA-DLV-52013
  source_title: ARENA Short Term Forecasting Funding Round Evaluation
  publish_date: 2021-10
  project_name: ARENA Short-Term Self-Forecasting Trial
  what_happened: Several participants found that a single forecasting model was insufficient
    to consistently outperform AWEFS/ASEFS across all operating conditions, especially
    following constraint periods when generation output changes rapidly; those using
    only a single model struggled to maintain accuracy.
  lesson_learnt: Deploy an ensemble of multiple forecast models rather than a single
    model — a combination that switches between normal operation, constraint-period,
    and post-constraint-recovery modes consistently outperformed AWEFS/ASEFS, whereas
    a single-model approach was less reliable across all conditions.
