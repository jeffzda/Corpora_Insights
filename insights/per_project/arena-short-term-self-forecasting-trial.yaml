  publish_date: 2021-10
  project_name: ARENA Short-Term Self-Forecasting Trial
  what_happened: Telecommunications network outages at remote sites disrupted data
    connections and compromised forecast quality or prevented timely forecast submission
    for some trial participants, as remote connection was not always available where
    LIDAR forecasters were installed.
  lesson_learnt: Design self-forecasting systems at remote sites with redundant telecommunications
    and local data buffering — simultaneous telco outages can prevent forecast submission
    and degrade quality, and existing AWEFS/ASEFS backup is the only fallback, which
    undermines the purpose of self-forecasting.
