  project_name: ARENA Short-Term Self-Forecasting Trial
  what_happened: Password expiry and reset processes caused operational delays for
    several trial participants — passwords expired without adequate notification,
    and the reset process was administratively burdensome, resulting in missed forecast
    submissions.
