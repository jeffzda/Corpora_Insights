  source_title: ARENA Short Term Forecasting Funding Round Evaluation
  publish_date: 2021-10
  project_name: ARENA Short-Term Self-Forecasting Trial
  what_happened: The trial showed that a slight intentional forecast bias — not necessarily
    the most accurate forecast — can result in lower FCAS costs; some participants
    developed optimisation models to calculate the bias that minimises FCAS charges
    rather than minimising forecast error per se.
  lesson_learnt: When optimising a self-forecasting system for FCAS cost reduction,
    target FCAS cost minimisation rather than raw forecast accuracy minimisation —
    a deliberate slight underestimate of generation capability can reduce causer-pays
    charges by enabling the generator to provide regulation raise capacity, and some
    participants developed dedicated models to compute this optimal bias.
