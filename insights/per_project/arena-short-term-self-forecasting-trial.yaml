- record_id: ARENA-DLV-52002
  source_title: ARENA Short Term Forecasting Funding Round Evaluation
  publish_date: 2021-10
  project_name: ARENA Short-Term Self-Forecasting Trial
  what_happened: Trial participants who were not registered market participants could
    not communicate directly with AEMO regarding the MP5F API connection — all communications
    had to be routed through the market participant, creating barriers when there
    were conflicting priorities between the market participant and the trial forecaster.
  lesson_learnt: Before commencing an AEMO API integration project as a non-market-participant,
    establish clear communication and escalation protocols with the registered market
    participant — AEMO's API registration process only recognises registered market
    participants, and conflicting priorities between parties can block progress.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: government/public-sector body
  delay_category: commissioning/integration
  failure_mode: coordination & stakeholders
  outcome_class: delayed but recoverable
  secondary_failure_mode: regulatory & approvals
  intervention_note: AEMO subsequently worked with the industry to improve the start-up
    process and streamlined administrative procedures for new participants.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: grid/system stability
  source_pages: &id002
  - 25
  evidence_excerpt: AEMO's API registration process only recongises market participants
    who are registered in the dispatch system. Any communication with AEMO relating
    the API connection must go through market participants. This caused communication
    problems for the trial participants, who were not market participants. It is a
    particular issue, if there are conflicting priorities between the market participants
    and trial forecaster.
