  what_happened: Self-forecast accuracy gains over ASEFS were significantly higher
    on clear-sky days but were diminished on days with highly variable cloud cover;
    sites near bodies of water and in the sub-tropics of Queensland saw lower FCAS
    cost reductions compared with sites in NSW and Victoria.
