- record_id: ARENA-DLV-52011
  source_title: ARENA Short Term Forecasting Funding Round Evaluation
  publish_date: 2021-10
  project_name: ARENA Short-Term Self-Forecasting Trial
  what_happened: AEMO's API required forecast capacity to be stored as an integer
    and always rounded down, meaning a generator with a rated capacity of 120.8 MW
    could only submit forecasts up to 120 MW — forecasts at or near full capacity
    were rejected if they exceeded the registered integer maximum.
  lesson_learnt: Check the integer-rounding rule in AEMO's API registration before
    configuring forecasting algorithms — the requirement to round down registered
    capacity to the nearest MW creates an inherent ceiling error at full capacity
    that causes forecast rejections if not accounted for in algorithm design.
