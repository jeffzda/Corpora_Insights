- record_id: ARENA-DLV-52001
  source_title: ARENA Short Term Forecasting Funding Round Evaluation
  publish_date: 2021-10
  project_name: ARENA Short-Term Self-Forecasting Trial
  what_happened: Of 28 generating units in the trial, 16 passed AEMO's initial assessment
    at the minimum 8-week period, while six required double that time (16 weeks) to
    meet the assessment criteria, causing unexpected operational costs and delays
    for those participants.
  lesson_learnt: Allocate contingency time in the project plan for the AEMO initial
    assessment process — failure at the 8-week mark extends assessment by a further
    8 weeks, which can substantially delay accreditation and the ability to use self-forecasts
    in dispatch.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: government/public-sector body
  delay_category: commissioning/integration
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: poor scoping
  intervention_note: AEMO extended the assessment window week-by-week up to 16 weeks,
    allowing participants additional time to meet reliability and performance criteria
    before accreditation.
  transferability: moderate
  delay_magnitude: 1-3 months
  technology_domain: solar PV
  source_pages: &id001
  - 25
  evidence_excerpt: Of the 28 generating units, 16 passed the AEMO assessment at the
    minimum period of eight weeks, whilst six of the remaining units required double
    this time to meet the assessment criteria. Such a significant delay in meeting
    the initial assessment requirements may result in unexpected operational costs
    for participants.
  confidence_note: technology_domain set to solar PV but trial covered both wind and
    solar; issue applies to both — confidence moderate on this field.
