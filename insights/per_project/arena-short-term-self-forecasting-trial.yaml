- record_id: ARENA-DLV-52005
  source_title: ARENA Short Term Forecasting Funding Round Evaluation
  publish_date: 2021-10
  project_name: ARENA Short-Term Self-Forecasting Trial
  what_happened: AEMO's production server was at times too slow to process submitted
    forecasts, resulting in delays of up to 12 seconds and missed dispatch intervals,
    particularly when forecasts were submitted close to gate closure.
  lesson_learnt: Submit self-forecasts well ahead of the gate closure deadline rather
    than at the last moment — server processing delays of up to 12 seconds were observed
    under load, causing dispatch intervals to be missed when submissions were made
    close to the deadline.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: government/public-sector body
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: delayed but recoverable
  secondary_failure_mode: data & measurement
  intervention_note: One participant submitted two forecasts 30 seconds apart so that
    if the later submission missed the gate close, the first would still be lodged,
    improving reliability to over 95%.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: grid/system stability
  source_pages: &id005
  - 27
  - 29
  evidence_excerpt: It was reported that the production server was, at times, too
    slow to process the submitted forecast. Delays of up to 12 seconds were observed
    and dispatch intervals missed as a result. It appears that the probability of
    such a delay increases when submitting a forecast close to the deadline.
