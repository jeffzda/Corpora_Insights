- record_id: ARENA-DLV-52029
  source_title: ARENA Short Term Forecasting Funding Round Evaluation
  publish_date: 2021-10
  project_name: ARENA Short-Term Self-Forecasting Trial
  what_happened: Some control systems were unable to ramp plant output fast enough
    to meet the dispatch target within one period when a generation cap was lifted,
    resulting in causer-pays charges even where forecasting was accurate.
  lesson_learnt: When evaluating FCAS savings from self-forecasting, account for plant
    ramp-rate limitations — if the control system cannot ramp to the dispatch target
    within one 5-minute period after a cap is lifted, causer-pays charges will be
    incurred regardless of forecast accuracy.
