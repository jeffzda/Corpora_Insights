  project_name: ARENA Short-Term Self-Forecasting Trial
  what_happened: Trial participants who had previous experience dealing with AEMO
    encountered fewer administrative and data connectivity issues when implementing
    their self-forecasting projects compared with those without prior AEMO experience.
  lesson_learnt: Consider engaging personnel or partners with prior AEMO API and registration
    experience when initiating a self-forecasting project — prior AEMO experience
    materially reduces administrative and data connectivity friction during implementation.
