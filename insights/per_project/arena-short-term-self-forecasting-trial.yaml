- record_id: ARENA-DLV-52028
  source_title: ARENA Short Term Forecasting Funding Round Evaluation
  publish_date: 2021-10
  project_name: ARENA Short-Term Self-Forecasting Trial
  what_happened: Redis cache problems with the AEMO API caused some forecast submissions
    to be dropped; while participants could switch to another set of valid credentials
    to restore submissions, this resulted in missing submissions during the window
    before the workaround was applied.
  lesson_learnt: Build credential-switching failover into the API submission system
    for AEMO's MP5F platform — Redis cache issues have caused dropped submissions,
    and the ability to automatically switch to an alternative valid credential set
    can restore submissions with minimal gaps.
