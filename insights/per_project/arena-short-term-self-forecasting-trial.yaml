- record_id: ARENA-DLV-52026
  source_title: ARENA Short Term Forecasting Funding Round Evaluation
  publish_date: 2021-10
  project_name: ARENA Short-Term Self-Forecasting Trial
  what_happened: Modelling wind turbines individually and then aggregating forecasts
    did not improve accuracy compared with grouping turbines; wind turbine layout
    (whether turbines shadow each other) significantly influenced whether wind direction
    needed to be emphasised in the forecast model.
  lesson_learnt: Model wind farm turbines in groups rather than individually — individual
    turbine modelling adds computational complexity without improving aggregate accuracy,
    and the appropriate emphasis on wind direction in the model should reflect whether
    turbines shadow each other given the farm layout.
