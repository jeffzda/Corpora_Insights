- record_id: ARENA-DLV-52006
  source_title: ARENA Short Term Forecasting Funding Round Evaluation
  publish_date: 2021-10
  project_name: ARENA Short-Term Self-Forecasting Trial
  what_happened: Sky cameras ordered from overseas were not immediately suitable for
    Australian conditions — images were overexposed due to the brightness of the Australian
    sky, and high temperatures impacted hardware reliability, requiring physical modifications
    (added vents and fan-cooled power supplies) and causing project delays.
  lesson_learnt: When procuring sky camera or other solar forecasting hardware from
    overseas suppliers, specify and test for Australian sky brightness and temperature
    conditions before deployment — lenses and cooling systems designed for European
    climates can fail under Australian conditions and require costly retrofit modifications.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: procurement
  proponent_type: government/public-sector body
  delay_category: procurement/supply chain
  failure_mode: unvalidated technical assumptions
  outcome_class: delayed but recoverable
  secondary_failure_mode: execution & logistics
  intervention_note: Participants added vents and additional fan-cooled power supplies
    to the sky camera units to address overheating and reliability issues in Australian
    conditions.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id006
  - 26
  - 39
  evidence_excerpt: Technical challenges associated with sky cameras, that were ordered
    with filters for use in daylight hours and tested in the UK prior to delivery.
    However, the lens filter is not suitable for Australia. Images captured from the
    solar camera were overexposed due to the brightness of the Australian sky. Also,
    Australia's high temperatures impacted reliability. To address the issue, it was
    required to add vents and additional fan cooler power supplies. These problems
    added to the project delay.
