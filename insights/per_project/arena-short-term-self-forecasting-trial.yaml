- record_id: ARENA-DLV-52024
  source_title: ARENA Short Term Forecasting Funding Round Evaluation
  publish_date: 2021-10
  project_name: ARENA Short-Term Self-Forecasting Trial
  what_happened: Analysis across seven trial participants over 111,000 dispatch periods
    found that aggregating multiple small reductions in individual generator forecast
    errors reduced the overall coincident forecast error by 42% compared with non-coincident
    (additive) errors, indicating that portfolio-wide rollout of self-forecasting
    would provide disproportionately large system stability benefits.
  lesson_learnt: Prioritise industry-wide rollout of self-forecasting rather than
    optimising individual generators in isolation — the coincident error reduction
    effect means aggregate forecast accuracy improves by approximately double what
    individual improvements alone would suggest, generating greater system stability
    benefits.
