- record_id: ARENA-DLV-52027
  source_title: ARENA Short Term Forecasting Funding Round Evaluation
  publish_date: 2021-10
  project_name: ARENA Short-Term Self-Forecasting Trial
  what_happened: Solar forecast performance was significantly degraded during morning
    and afternoon ramp periods (sunrise/sunset), with ASEFS errors exceeding 5 MW
    throughout these ramps; better modelling of diffuse irradiance was identified
    as delivering material accuracy improvements during these periods.
  lesson_learnt: Explicitly model diffuse irradiance and low-sun-angle conditions
    in solar forecasting systems — ASEFS and basic models produce persistent errors
    exceeding 5 MW during morning and afternoon ramps on large solar farms, and improved
    diffuse irradiance modelling has been shown to materially reduce these errors.
