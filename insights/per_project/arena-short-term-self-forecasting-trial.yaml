- record_id: ARENA-DLV-52017
  source_title: ARENA Short Term Forecasting Funding Round Evaluation
  publish_date: 2021-10
  project_name: ARENA Short-Term Self-Forecasting Trial
  what_happened: Cloud-based Global Operating Systems (GOS) used by some wind and
    solar farms as plant monitoring platforms were found to be incompatible with self-forecasting
    because they are not designed for real-time controls and lack robust continuous
    communications capability.
  lesson_learnt: Do not use cloud-based GOS plant monitoring systems as the primary
    data integration pathway for self-forecasting — they are not designed for real-time
    controls and can lose connectivity without disrupting plant monitoring but will
    disrupt forecast submissions; SCADA-based onsite integration with a dedicated
