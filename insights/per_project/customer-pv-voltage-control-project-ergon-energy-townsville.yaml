- record_id: ARENA-DLV-72233
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: '2014'
  project_name: Customer PV Voltage Control Project - Ergon Energy Townsville
  what_happened: Ergon Energy identified that localised high concentrations of rooftop
    PV were causing significant and widespread voltage management problems on its
    network in Townsville, with operational tools to mitigate the problem effectively
    limited to restricting PV system size or number, or requiring customer-funded
    network augmentation.
  lesson_learnt: Distribution networks with high localised PV concentrations face
    voltage management constraints that cannot be resolved by restriction alone —
    proactively test inverter-based reactive power (VAR) control as a lower-cost mitigation
    before defaulting to network augmentation or PV connection refusal.
