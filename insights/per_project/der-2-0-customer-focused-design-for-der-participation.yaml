  what_happened: During program design, the team identified that without a shared
    definitional baseline for key terms (e.g. what 'FCAS access' means, what annual
    value figures are assumed), team members inadvertently designed against different
    assumptions, creating alignment risk.
  lesson_learnt: Before commencing multi-workstream program or product design with
    a cross-disciplinary team, establish a shared language glossary and explicit agreement
    on key numerical assumptions (e.g. market value estimates, technical capability
    definitions) — ambiguity in foundational terms leads to design inconsistency that
    can only be corrected through costly rework.
