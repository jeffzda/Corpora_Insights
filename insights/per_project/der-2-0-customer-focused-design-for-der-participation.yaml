  source_title: Customer Segmentation Research and Design for Orchestration Programs
  publish_date: 2021-04
  project_name: 'DER 2.0: Customer focused design for DER participation'
  what_happened: The project identified that community energy storage developments,
    while beneficial to the grid, could act as a barrier to individual household battery
    adoption for Community Builder segment customers — as they may choose community
    energy storage over purchasing their own household battery system.
  lesson_learnt: Program designers targeting Community Builder segments should monitor
    the emergence of community energy storage offerings as a potential substitute
    that could cannibalise individual battery adoption in this segment — and consider
    whether their program can accommodate or integrate community storage participation
    to avoid losing this customer cohort.
