- record_id: ARENA-DLV-31327
  source_title: Customer Segmentation Research and Design for Orchestration Programs
  publish_date: 2021-04
  project_name: 'DER 2.0: Customer focused design for DER participation'
  what_happened: The Independence Seeker segment comprised the largest single group
    in the survey sample at 30%, yet was characterised as traditionally hard to capture
    in orchestration programs due to a perceived misalignment between the control
    requirements of standard VPP programs and the independence values of this segment.
  lesson_learnt: Independence Seekers — the largest single customer segment (~30%
    of solar owners) — are not inherently opposed to orchestration; they are opposed
    to orchestration that removes their sense of control during critical moments.
    Programs designed to enhance their household energy resilience (e.g. ensuring
    the battery is charged before a storm or outage) can successfully recruit this
    segment by reframing orchestration as a service that increases rather than diminishes
    their control.
