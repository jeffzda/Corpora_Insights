  source_title: Customer Segmentation Research and Design for Orchestration Programs
  publish_date: 2021-04
  project_name: 'DER 2.0: Customer focused design for DER participation'
  what_happened: The 'Build' orchestration program (targeting Green Champions and
    Community Builders via community-focused FCAS participation) required a minimum
    of 1 MW of battery capacity in a state before it could participate in FCAS markets,
    equivalent to approximately 200–400 customer battery systems, representing a significant
    scale threshold before the program becomes viable.
  lesson_learnt: Community-focused aggregated battery orchestration programs targeting
    FCAS markets must plan for a minimum scale of ~200–400 residential batteries (1
    MW) before market participation is possible; program economics require upfront
    investment from the operator with a clear scaling strategy, as per-customer costs
    decrease with scale but upfront establishment costs of $150,000–$350,000 must
    be absorbed before break-even.
