- record_id: ARENA-DLV-31328
  source_title: Customer Segmentation Research and Design for Orchestration Programs
  publish_date: 2021-04
  project_name: 'DER 2.0: Customer focused design for DER participation'
  what_happened: The Grow orchestration program's product complexity feasibility assessment
    identified that customers would approach this innovative program with low prior
    understanding and no existing mental models in energy to relate it to — creating
    an ongoing customer education and satisfaction management challenge that the program
    team identified as a key delivery risk.
  lesson_learnt: When launching innovative orchestration programs without market precedent,
    anticipate a customer education burden from day one — budget for and design customer
    communication that balances sufficient information to build understanding with
    enough simplicity to avoid overwhelming customers, as this tension between complexity
    and accessibility is a core ongoing operational challenge, not a one-time onboarding
    task.
