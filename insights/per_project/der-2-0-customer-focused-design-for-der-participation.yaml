  what_happened: The project found that a pure literature-and-survey approach to customer
    segmentation produced 'two-dimensional' segment profiles, but only became sufficiently
    nuanced and actionable ('three-dimensional') when qualitative interviews with
    35+ industry experts and customers were combined with the quantitative survey
    and theoretical literature review.
  lesson_learnt: Customer segmentation for DER program design requires a multi-layered
    research methodology — combining theoretical literature distillation, extensive
    qualitative expert interviews, and a targeted quantitative survey — as any single
    method alone produces profiles too shallow to drive meaningfully differentiated
    program design.
