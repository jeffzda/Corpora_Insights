- record_id: ARENA-DLV-31303
  source_title: Customer Segmentation Research and Design for Orchestration Programs
  publish_date: 2021-04
  project_name: 'DER 2.0: Customer focused design for DER participation'
  what_happened: The project team found that program designers were projecting their
    own values and mental models onto customer segments during orchestration program
    design, risking outcomes that reflected team member assumptions rather than actual
    customer needs.
  lesson_learnt: Assign team members to design orchestration programs for customer
    segments they can directly relate to or have experience with; if this is not possible,
    establish a formal mechanism to challenge assumptions that cannot be traced back
    to customer research, to prevent values projection distorting program design.
