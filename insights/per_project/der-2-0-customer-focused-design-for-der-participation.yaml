  what_happened: The Pragmatist segment — representing approximately 29% of the survey
    sample and characterised by trust-based, financially-motivated decision-making
    and a 'plug and play' expectation — was identified as the largest potential mass-market
    segment for battery adoption but also the most resistant to complex or novel program
    structures.
  lesson_learnt: To unlock mass-market battery adoption, orchestration programs must
    offer a credible 'set and forget' option for Pragmatist customers — a fixed-bill
    or simplified financial model with no ongoing engagement requirement, delivered
    through a trusted provider — as this segment represents ~29% of solar owners and
    is the gateway to mainstream adoption but will not engage with complex or unfamiliar
    program structures.
