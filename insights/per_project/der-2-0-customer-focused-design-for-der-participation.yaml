  outcome_class: knowledge generated despite setback
  secondary_failure_mode: commercial & market
  intervention_note: UPowr designed the 'Protect' orchestration program specifically
    to give Independence Seekers battery pre-charging ahead of grid instability events,
    framing orchestration as 'being in control' rather than 'having control taken
    away'.
  transferability: moderate
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id008
  - 44
  evidence_excerpt: Our analysis of orchestration programs in-market shows that even
    the lowest 'touch' plans, presumably aimed at Independence Seekers, ask these
    consumers to cede valued control and independence during the highest risk periods
    of energy security (such as RERT or load shedding events). Arguably it is during
    these periods of uncertainty that Independence Seekers are least comfortable to
    do so. This misalignment between the requirements of the orchestration programs
    on offer and the values/motivations of Independence Seekers could partly explain
    the low adoption to date.
