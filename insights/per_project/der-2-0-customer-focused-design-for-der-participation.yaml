- record_id: ARENA-DLV-31329
  source_title: Customer Segmentation Research and Design for Orchestration Programs
  publish_date: 2021-04
  project_name: 'DER 2.0: Customer focused design for DER participation'
  what_happened: The rise of wholesale-exposed energy plans was identified as a growing
    regulatory concern around consumer protections, with potential gaps or lack of
    guidelines that regulators would need to address — particularly relevant for the
    Grow orchestration program which exposed residential customers to real-time wholesale
    prices.
  lesson_learnt: Orchestration programs offering wholesale price exposure to residential
    customers should proactively engage with regulators on consumer protection frameworks
    before launch, as the regulatory gap creates delivery risk; targeting customer
    segments with demonstrated capacity to understand and accept wholesale market
    risk (e.g. Techies, Movers and Shakers) can mitigate both regulatory concern and
    consumer harm risk.
