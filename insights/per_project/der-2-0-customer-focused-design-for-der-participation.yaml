- record_id: ARENA-DLV-31313
  source_title: Customer Segmentation Research and Design for Orchestration Programs
  publish_date: 2021-04
  project_name: 'DER 2.0: Customer focused design for DER participation'
  what_happened: Analysis of existing orchestration programs revealed that even the
    lowest-touch plans aimed at Independence Seekers required customers to cede control
    of their batteries during the highest-risk periods (e.g. RERT, load shedding events)
    — precisely the moments when Independence Seekers are least comfortable doing
    so. This structural misalignment was identified as a key driver of low participation
    from this segment.
  lesson_learnt: When designing orchestration programs for customers who value control
    and energy independence (Independence Seekers), avoid structuring programs that
    require relinquishing battery control during grid stress events — instead, design
    programs (such as the 'Protect' model) that enhance the customer's sense of control
    during those events by ensuring the battery is fully charged when needed.
