  source_title: Customer Segmentation Research and Design for Orchestration Programs
  publish_date: 2021-04
  project_name: 'DER 2.0: Customer focused design for DER participation'
  what_happened: The 'Grow' orchestration program (wholesale and FCAS market participation
    for Techies, Movers and Shakers, and Pragmatists) required a licensed energy retailer
    as a mandatory delivery partner because of wholesale market exposure requirements;
    this dependency was identified as a commercial challenge in securing the necessary
    technical and retail partnerships.
  lesson_learnt: Orchestration programs that include wholesale market exposure cannot
    be delivered without a licensed energy retailer as a delivery partner — program
    designers should secure this partnership before finalising program design, as
    the requirement constrains partner options and adds commercial complexity that
    can delay or prevent delivery.
