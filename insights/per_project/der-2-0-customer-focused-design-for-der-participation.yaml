- record_id: ARENA-DLV-31306
  source_title: Customer Segmentation Research and Design for Orchestration Programs
  publish_date: 2021-04
  project_name: 'DER 2.0: Customer focused design for DER participation'
  what_happened: Customer surveys risk a disconnect between stated and revealed preferences
    — respondents may express values (e.g. altruism) that do not reflect their actual
    behaviour. The project identified this risk and designed a mechanism within the
    survey to test for this gap.
  lesson_learnt: Embed a behavioural reveal mechanism in customer research surveys
    — for example, offering a choice between a personal financial incentive and a
    charitable donation, with charity options mapped to distinct values — to test
    whether stated preferences align with actual behaviour and improve the validity
    of customer segmentation.
  issue_severity: minor
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: Included an incentive choice in the survey — either enter a draw
    to win a $50 gift card or choose a charity donation — with charity options mapped
    to different values (environment, family, community/fairness) to reveal actual
    motivational priorities.
  transferability: broad
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id002
  - 49
  evidence_excerpt: we chose to include a subtle mechanism within the survey design
    that could show if there was a disconnect between how people think and how people
    behave. We did this by making the incentive a choice – either enter a draw to
    win a $50 gift card, or choose a charity for a donation to be made too.
