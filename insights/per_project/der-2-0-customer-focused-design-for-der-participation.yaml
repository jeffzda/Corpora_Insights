- record_id: ARENA-DLV-31322
  source_title: Customer Segmentation Research and Design for Orchestration Programs
  publish_date: 2021-04
  project_name: 'DER 2.0: Customer focused design for DER participation'
  what_happened: The 'Build' orchestration program design found that existing community-oriented
    messaging in the VPP industry used 'community' superficially — referring to the
    broader electricity grid rather than a defined, identity-based community — which
    lacked the parameters and belonging that Community Builder and Green Champion
    segments require to be motivated.
  lesson_learnt: Community-themed orchestration programs will not resonate with Community
    Builder and Green Champion segments unless they provide genuine community infrastructure
    — a defined group identity, participant interaction, and member-directed value
    allocation — rather than using 'community' as a marketing label for what is essentially
    an individual financial reward program.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
