  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Used Loom to record modular background videos (45+ minutes of
    content split across 7-8 short videos) enabling team members to get up to speed
    within days without live meeting overhead.
  transferability: broad
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id003
  - 49
  evidence_excerpt: our project lead was able to record a number of videos (45 minutes
    + split across 7-8 short videos) that provided the information the project team
