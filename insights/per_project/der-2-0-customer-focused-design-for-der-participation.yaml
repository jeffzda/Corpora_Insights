- record_id: ARENA-DLV-31323
  source_title: Customer Segmentation Research and Design for Orchestration Programs
  publish_date: 2021-04
  project_name: 'DER 2.0: Customer focused design for DER participation'
  what_happened: The pulse-check survey found that almost 70% of battery system owners
    surveyed were not currently participating in any VPP plan, and those who were
    had only entered after installing the battery — indicating that the point of battery
    sale is currently not being used as the primary VPP enrolment opportunity.
  lesson_learnt: Battery orchestration program uptake can be significantly improved
    by bundling the orchestration program offer with the battery purchase decision
    at the point of sale, rather than relying on post-installation recruitment — the
    battery sale is the highest-leverage moment for orchestration enrolment and should
    be the primary channel for program acquisition.
