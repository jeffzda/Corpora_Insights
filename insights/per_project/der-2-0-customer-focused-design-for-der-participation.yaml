  what_happened: A review of the Bruny Island Battery Trial (prior ARENA-funded research)
    found that installers were critical intermediaries in DER adoption — functioning
    as knowledge brokers who could either enhance or obstruct the installation process
    — and that their role was becoming increasingly complex as the DER landscape evolved,
    creating business risks for installers.
  lesson_learnt: Installers are a pivotal delivery actor in residential DER programs
    and should be treated as knowledge brokers, not just technical contractors — program
    designers must invest in installer training, clear messaging tools, and business
    model support for installers, as installer behaviour has an outsized effect on
    customer experience and ultimately on program adoption rates.
