- record_id: ARENA-DLV-31307
  source_title: Customer Segmentation Research and Design for Orchestration Programs
  publish_date: 2021-04
  project_name: 'DER 2.0: Customer focused design for DER participation'
  what_happened: Onboarding a remote, cross-organisational project team across 17
    time zones created challenges in knowledge transfer and team alignment, particularly
    given time pressure and the fact that most team members were not existing UPowr
    employees and had varying energy knowledge levels.
  lesson_learnt: For remote, time-pressured project teams requiring rapid knowledge
    transfer, use asynchronous video tools (such as Loom) to deliver background content
    in modular short-form videos rather than live meetings — this reduces 'Zoom fatigue',
    allows team members to absorb information at their own pace, and achieves team
    alignment faster than equivalent hours of videoconferencing.
