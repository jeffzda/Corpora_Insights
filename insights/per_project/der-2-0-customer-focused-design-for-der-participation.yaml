  what_happened: Prior ARENA-funded research (ThinkPlace Demand Response Customer
    Insights Report) found that three-quarters of Australians are collectivist in
    orientation, yet the dominant industry messaging around demand response and orchestration
    programs was framed around individual action, personal rewards, and individual
    financial returns — directly mismatching the majority of the potential customer
    base.
  lesson_learnt: Energy program communications should default to collectivist framing
    — emphasising community benefit, shared outcomes, and 'doing the right thing'
    — rather than exclusively individual financial framing, as the majority of Australian
    energy customers are collectivist and are more likely to enrol when community
    benefit is the primary motivation presented.
