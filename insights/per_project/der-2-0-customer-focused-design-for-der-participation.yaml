- record_id: ARENA-DLV-31305
  source_title: Customer Segmentation Research and Design for Orchestration Programs
  publish_date: 2021-04
  project_name: 'DER 2.0: Customer focused design for DER participation'
  what_happened: Paid social media advertising was found to be ineffective for driving
    survey completions because the survey was too complex to be integrated into the
    advertising platform's native survey format (e.g. Facebook's ad framework). Organic
    sharing — including a boost from ARENA's own social media channels — was far more
    effective.
  lesson_learnt: When running digital surveys targeting two distinct audiences via
    social media, consolidate into a single survey link with logic branching rather
    than separate surveys — separate links create uncontrollable audience routing
    risk, while a single unified link with decision trees maintains audience integrity
    and simplifies the user experience.
  issue_severity: minor
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: null
  failure_mode: execution & logistics
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Integrated the two surveys into a single survey link with logic
    jumps and conditions so respondents were routed to the correct question set based
    on whether they were solar-only or solar-plus-battery owners.
  transferability: moderate
  delay_magnitude: null
  technology_domain: DER
  source_pages:
  - 48
  - 49
  evidence_excerpt: We found organic social media sharing, along with direct asks
    to be the most effective way of getting people to complete the survey. Even though
    a reward was offered clearly in the visual posts, we found paid advertising on
    social media to not be as effective, likely due to the survey not being integrated
    into the ad... ARENA organically sharing our social media post on the survey provided
    a key boost.
