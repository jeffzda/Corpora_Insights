- record_id: ARENA-DLV-31308
  source_title: Customer Segmentation Research and Design for Orchestration Programs
  publish_date: 2021-04
  project_name: 'DER 2.0: Customer focused design for DER participation'
  what_happened: The project team trialled a weekly cadence for orchestration program
    design work, where team members contributed approximately one day per week. This
    approach provided reflection time but disrupted delivery flow, and skill gaps
    emerged because each team member was only responsible for one program rather than
    sharing expertise across all three.
  lesson_learnt: When designing multiple related products in parallel with a part-time
    distributed team, consider condensing design into an intensive dedicated period
    (e.g. two full weeks) so skills are shared fluidly across all workstreams — the
    weekly cadence approach risks siloed expertise and interrupted flow, though it
    does provide useful reflection time and reduces groupthink.
  issue_severity: minor
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: null
  failure_mode: execution & logistics
  outcome_class: partial success
  secondary_failure_mode: coordination & stakeholders
  intervention_note: Mitigated skill gaps by ensuring skills were shared across the
    team and by holding weekly cross-team feedback discussions on program design progress.
  transferability: moderate
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id004
  - 49
  - 50
  evidence_excerpt: For the delivery of the program design, we took the approach of
    delivering key activities on a week by week basis... Where this approach brought
    the benefit of allowing people space to reflect, it also brought challenges in
    terms of dedicated 'flow' of delivery... not each team member had the same set
    of skills. Where one team member was a FCAS specialist, another team member was
    a sales specialist.
