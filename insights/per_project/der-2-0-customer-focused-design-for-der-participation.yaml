  intervention_note: The Build program was designed with a genuine community ecosystem
    where financial rewards are pooled for community-directed outcomes and participants
    can interact through a shared platform, rather than receiving individual bill
    credits.
  transferability: moderate
  delay_magnitude: null
  technology_domain: battery storage
