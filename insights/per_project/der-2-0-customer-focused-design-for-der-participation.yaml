- record_id: ARENA-DLV-31312
  source_title: Customer Segmentation Research and Design for Orchestration Programs
  publish_date: 2021-04
  project_name: 'DER 2.0: Customer focused design for DER participation'
  what_happened: The majority of existing Australian VPP and orchestration programs
    reviewed (21 programs, Appendix 7) positioned themselves primarily around financial
    value ('bargain focused'), with few offering community-focused, resilience-focused,
    or innovation-focused value propositions, and limited personalisation of messaging
    to specific customer types.
  lesson_learnt: Program designers and energy retailers entering the VPP market should
    differentiate on non-financial value propositions — resilience, community impact,
    and innovation — as the existing market is saturated with financially-framed offers;
    customers motivated by control, community, or environmental impact are systematically
    underserved and represent an addressable gap.
