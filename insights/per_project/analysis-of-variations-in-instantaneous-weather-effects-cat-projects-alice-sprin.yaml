  evidence_excerpt: The data and the discussions presented to date shows very clearly that this variability in irradiance and therefore PV generation can be strongly mitigated against by dispersing PV generation
    across such a network. The most effective way to disperse this PV generation is through increasing the quantity of PV sites that are connected into the network. These sites must be spatially dispersed
    to achieve this effect but it should be recognised that as long as there is reasonable spatial dispersion then by far the most important determinant in reducing the variability of PV generation is to
    increase the total number of sites.
