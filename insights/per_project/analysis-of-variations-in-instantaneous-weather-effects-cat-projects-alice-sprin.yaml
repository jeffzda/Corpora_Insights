- record_id: ARENA-DLV-72228
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects - First Edition Results'
  publish_date: null
  project_name: Analysis of Variations in Instantaneous Weather Effects (CAT Projects / Alice Springs)
  what_happened: A study using nine solar monitoring stations across a 30km diameter area of the Alice Springs grid found that dispersing PV generation across a greater number of spatially separated sites
    — rather than concentrating it — is the most effective way to mitigate PV output variability caused by localised weather effects, enabling higher PV penetration without energy storage.
  lesson_learnt: To maximise PV penetration without storage in isolated grids, prioritise increasing the number of spatially dispersed PV connection sites over increasing capacity at existing sites — spatial
    distribution is the primary determinant of reducing generation variability from cloud effects.
