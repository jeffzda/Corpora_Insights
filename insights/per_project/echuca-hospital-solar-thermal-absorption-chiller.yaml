- record_id: ARENA-DLV-11016
  source_title: Renewable Energy Options for Industrial Process Heat
  publish_date: 2019-08
  project_name: Echuca Hospital Solar Thermal Absorption Chiller
  what_happened: A solar thermal-driven absorption chiller was commissioned at Echuca Hospital in regional VIC in March 2011, providing space cooling and reducing electricity use by 1,373 MWh/year. The
    total project cost was $2.2 million. The primary economic driver was not energy cost savings but the avoidance of approximately $1 million in electricity infrastructure upgrades that would otherwise
    have been required due to hospital expansion. The system performed so well that a second system was subsequently funded with ARENA support.
  lesson_learnt: Solar thermal systems for industrial or commercial cooling can be justified primarily on infrastructure deferral value rather than marginal energy cost savings — the business case should
    incorporate avoided network upgrade costs as the primary financial driver.
