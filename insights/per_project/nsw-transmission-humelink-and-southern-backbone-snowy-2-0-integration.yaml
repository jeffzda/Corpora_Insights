- record_id: ARENA-DLV-40612
  source_title: ARENA Electrical Infrastructure Roundtable
  publish_date: '2025-06-25'
  project_name: NSW Transmission – HumeLink and Southern Backbone (Snowy 2.0 Integration)
  what_happened: The Snowy 2.0 pumped hydro project is forecast to contribute 350
    GWh of long-duration energy storage to NSW from approximately 2028–29, but the
    ability to dispatch that stored energy to Sydney during peak demand periods is
    contingent on delivery of the new 500 kV southern transmission backbone — specifically
    HumeLink and the Sydney Ring South augmentation.
  lesson_learnt: Long-duration storage assets are only as useful as the transmission
    infrastructure needed to dispatch their energy to demand centres; transmission
    and storage projects must be co-planned and co-scheduled so that storage assets
    are not stranded by transmission constraints at the time of their commissioning.
