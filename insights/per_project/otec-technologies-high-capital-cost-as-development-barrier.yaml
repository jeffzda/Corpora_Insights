- record_id: ARENA-DLV-50013
  source_title: Ocean Energy Report by Seanergy and Ernst and Young
  publish_date: 2016-06
  project_name: OTEC Technologies — High Capital Cost as Development Barrier
  what_happened: OTEC technologies, including the 10 MW NEMO project in Martinique,
    require CAPEX of approximately EUR 26,250/kW at first-array stage — the highest
    of any ocean energy technology — making large public grants a necessity and limiting
    the number of viable project developers. High up-front capital requirements have
    restricted OTEC development despite its high capacity factor (up to 92%).
  lesson_learnt: OTEC project business cases require large public grant support as
    a first condition of financial close due to extreme CAPEX intensity; developers
    should not pursue OTEC projects without securing substantial public co-funding
    first, and funders should assess whether economies of scale are achievable within
    the project scope before committing.
