- record_id: ARENA-DLV-9147
  source_title: State of DER Technology Integration Report
  publish_date: 2021-02
  project_name: Western Power Community Batteries
  what_happened: Western Power identified that the major challenge in the community
    battery project was developing a business model that could realise benefits from
    all value streams and positively involve all stakeholders simultaneously — network,
    generator, retailer, customer and community — including how to optimise battery
    operations to maximise total value.
  lesson_learnt: Community battery projects with multiple stakeholders and value streams
    require a dedicated business model design workstream — technical deployment is
    insufficient on its own, and the optimisation of dispatch between competing use
    cases (network support, wholesale arbitrage, customer product) requires explicit
    modelling and commercial agreement between all parties.
  issue_severity: moderate
  project_type: storage
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: null
  failure_mode: coordination & stakeholders
