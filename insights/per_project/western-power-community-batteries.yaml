- record_id: ARENA-DLV-9146
  source_title: State of DER Technology Integration Report
  publish_date: 2021-02
  project_name: Western Power Community Batteries
  what_happened: 'Western Power''s community battery programme successfully demonstrated
    multiple value streams from a single 420 kWh community battery: network deferral
    (distribution transformer upgrade avoided), wholesale market participation, and
    a customer-facing storage product. By mid-2020, Western Power had 10 batteries
    installed with plans to reach 13 batteries totalling approximately 6 MWh by end
    of June 2020.'
  lesson_learnt: Community batteries that stack network deferral, wholesale market
    and customer retail value streams can achieve a positive business case where single-stream
    models may not — project teams should assess all available value streams from
    the outset and design operational dispatch strategies that can access multiple
    revenue sources simultaneously.
