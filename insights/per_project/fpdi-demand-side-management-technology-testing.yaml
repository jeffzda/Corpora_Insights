  evidence_excerpt: To date the applicable standards for solar PV, commercial-scale
    embedded generation and DSM options have made an assumption of low penetration
    which has led to simplistic operating characteristics becoming the norm. Although
    equipment generally has to meet the relevant Australian Standards, DNSPs have
    a lack of confidence in quality control frameworks. In regional areas where there
    are greater operational constraints and 'weaker' networks, a lack of performance
    information can lead to onerous technical solutions for grid connection.
