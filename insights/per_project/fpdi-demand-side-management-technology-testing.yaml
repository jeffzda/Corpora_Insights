- record_id: ARENA-DLV-72247
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: '2015'
  project_name: 'FPDI: Demand Side Management Technology Testing'
  what_happened: The Clean Energy Council identified that applicable Australian standards
    for solar PV and DSM inverter equipment had been designed assuming low penetration,
    leading to simplistic operating characteristics becoming the norm. DNSPs had low
    confidence in quality control frameworks, and the lack of performance data under
    varied network conditions led to onerous technical connection requirements in
    regional areas.
  lesson_learnt: Standards and quality control frameworks for inverter-based systems
    must be updated to reflect high-penetration operating conditions — DNSPs should
    not be expected to accept new operating characteristics without a domestic testing
    and compliance framework that gives them confidence in equipment performance under
    real network stress conditions.
  issue_severity: moderate
  project_type: DER/customer-side
