- record_id: ARENA-DLV-42319
  source_title: Evaluation of ARENA's 2017-2020 Demand Response Portfolio
  publish_date: 2021-06
  project_name: EnergyAustralia Demand Response (NSW and VIC/SA)
  what_happened: EnergyAustralia began the program using Greensync monitoring devices
    for C&I sites but subsequently discontinued them; it then pivoted to assessing
    software-based demand monitoring approaches that do not require hardware installation,
    reflecting a mid-project technology pivot driven by implementation difficulties.
  lesson_learnt: Pilot C&I monitoring hardware at a small number of sites before committing
    to fleet-scale deployment — EnergyAustralia's experience with Greensync devices
    highlights the risk of deploying unvalidated monitoring hardware across a full
    C&I portfolio, necessitating a disruptive mid-project technology pivot.
