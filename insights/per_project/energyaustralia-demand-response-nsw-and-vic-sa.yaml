- record_id: ARENA-DLV-42320
  source_title: Evaluation of ARENA's 2017-2020 Demand Response Portfolio
  publish_date: 2021-06
  project_name: EnergyAustralia Demand Response (NSW and VIC/SA)
  what_happened: Prior to ARENA funding, EnergyAustralia had discussed demand response
    internally as part of a DER strategic objective but had not progressed to a standalone
    DR program; the structured ARENA funding with project certainty enabled EnergyAustralia
    to trial DR products, leading to the C&I offering transitioning to BAU at broader
    scale.
  lesson_learnt: ARENA funding provides organisational commitment and internal approval
    pathways that unlock demand response programs that would otherwise remain as internal
    strategic discussions — the structured three-year commitment with milestone deliverables
    is a key mechanism for catalysing commercial deployment.
