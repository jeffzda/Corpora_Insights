- record_id: ARENA-DLV-29566
  source_title: DEIP - DEIP Dive - Event Summary 2023
  publish_date: 2023-07
  project_name: Project Converge (Evoenergy)
  what_happened: Project Converge is developing a real-time investment decision framework to improve transparency on DER/CER location and network constraints, and is moving toward merit-order-based allocation
    of dynamic operating envelopes (DOEs) to optimise network investment decisions.
  lesson_learnt: Distribution network planners integrating high DER/CER penetration should develop real-time visibility tools that map DER/CER location against network constraints before network investment
    decisions are made — Project Converge's merit-order DOE allocation approach offers a replicable framework for deferring or targeting network augmentation.
  issue_severity: none
