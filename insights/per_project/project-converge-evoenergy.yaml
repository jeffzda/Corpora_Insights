- record_id: ARENA-DLV-29558
  source_title: DEIP - DEIP Dive - Event Summary 2023
  publish_date: 2023-07
  project_name: Project Converge (Evoenergy)
  what_happened: Project Converge used a combined opt-in and opt-out consumer recruitment model, resulting in one-third of consumers opting in and two-thirds being automatically included with the option
    to opt out, significantly increasing overall trial participation compared to opt-in only approaches.
  lesson_learnt: DER/CER trials should consider combining opt-in and opt-out recruitment models — Project Converge's approach demonstrated that default inclusion with opt-out materially increases participation
    rates, which is important for generating statistically meaningful results at scale.
