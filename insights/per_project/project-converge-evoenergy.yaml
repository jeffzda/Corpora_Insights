- record_id: ARENA-DLV-29561
  source_title: DEIP - DEIP Dive - Event Summary 2023
  publish_date: 2023-07
  project_name: Project Converge (Evoenergy)
  what_happened: Project Converge observed that shaped operating envelopes (SOEs) have not been noticed by consumers in practice, while the project team predicts SOEs will be critical to supporting the
    equitable roll-out of DER/CER at scale.
  lesson_learnt: SOEs and similar network control mechanisms can be deployed with minimal consumer awareness, which reduces adoption friction — however, projects should not rely on invisibility as a substitute
    for a consumer equity framework, as the equitable distribution of SOE constraints will require explicit policy design as deployment scales.
