  publish_date: 2015-05
  project_name: Novel Texture Processes for the Latest Industrial Wafer and Advanced
    Cell Concepts
  what_happened: The project scope shifted early from testing novel texturing for
    advanced cell concepts (all-rear-contact cells, thin wafers) to processes that
    could be implemented quickly into manufacturing lines, in response to competitive
    pressure in the PV module market.
  lesson_learnt: When market conditions change rapidly during a research project,
    early rescoping toward near-term manufacturing applicability can maximise the
    commercial relevance of outcomes — but the original advanced-concept objectives
    may be deferred or abandoned.
