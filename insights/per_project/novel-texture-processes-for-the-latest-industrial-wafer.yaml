- record_id: ARENA-DLV-8902
  source_title: Novel Texture Processes for The Latest Wafer and Advanced Cell Concepts
  publish_date: 2015-05
  project_name: Novel Texture Processes for the Latest Industrial Wafer and Advanced
    Cell Concepts
  what_happened: Diamond-wire sawn multicrystalline wafers achieved equivalent optical
    performance to slurry-sawn wafers when combined with plasma texturing, but pilot
    line cell efficiencies still lagged the state-of-the-art process by at least 0.6%
    absolute due to unresolved issues with material quality and contact printing.
  lesson_learnt: Achieving equivalent optical performance for diamond-wire sawn wafers
    does not guarantee equivalent cell efficiency — material quality and contact printing
    compatibility must be resolved independently before the technology is ready for
    full manufacturing integration.
