- record_id: ARENA-DLV-8901
  source_title: Novel Texture Processes for The Latest Wafer and Advanced Cell Concepts
  publish_date: 2015-05
  project_name: Novel Texture Processes for the Latest Industrial Wafer and Advanced
    Cell Concepts
  what_happened: The project successfully developed plasma texturing processes for
    multicrystalline silicon wafers that achieved a 3% relative (0.5% absolute) efficiency
    improvement over the state-of-the-art acid-etch process, and demonstrated compatibility
    with a Suntech production line with best cells performing within ~0.3% absolute
    efficiency of the control group.
  lesson_learnt: Plasma texturing of multicrystalline wafers can be introduced into
    manufacturing without significant barriers — pilot results suggest downstream
    process optimisation is likely to deliver the full 0.5% absolute efficiency gain
    demonstrated in controlled conditions, representing a cost improvement of approximately
    A$0.04/W.
