- record_id: ARENA-DLV-8905
  source_title: Novel Texture Processes for The Latest Wafer and Advanced Cell Concepts
  publish_date: 2015-05
  project_name: Novel Texture Processes for the Latest Industrial Wafer and Advanced
    Cell Concepts
  what_happened: A collaborative R&D structure bringing together a PV module manufacturer
    (Suntech R&D Australia), a production tool supplier (Roth & Rau) and a research
    institute (Fraunhofer ISE) enabled each partner to contribute prior learning,
    equipment, IP and analytical capability, avoiding unnecessary replication and
    accelerating process development.
  lesson_learnt: Structure manufacturing-oriented R&D collaborations to include equipment
    manufacturers, cell/module manufacturers, and research institutes simultaneously
    — prior information sharing during planning avoids replicating known failures,
    and multi-party analysis of unexpected results reduces the risk of false conclusions
    driving wasted experimental runs.
