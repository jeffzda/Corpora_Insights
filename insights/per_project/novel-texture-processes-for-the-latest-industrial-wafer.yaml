- record_id: ARENA-DLV-8904
  source_title: Novel Texture Processes for The Latest Wafer and Advanced Cell Concepts
  publish_date: 2015-05
  project_name: Novel Texture Processes for the Latest Industrial Wafer and Advanced
    Cell Concepts
  what_happened: The Silicon Nitride Scanner (SiNS) prototype tool was successfully
    implemented as a pseudo in-line tool on a Suntech production line, scanning over
    1,000 points per wafer in approximately one second and automatically identifying
    process-related variations in SiN coatings — replacing slow, manual ellipsometer
    measurements.
  lesson_learnt: Developing automated in-line characterisation tools within a manufacturing
    R&D project — rather than as a standalone effort — allows real production environments
    to validate speed, reliability and data utility before full integration, de-risking
    subsequent investment in a fully integrated tool.
