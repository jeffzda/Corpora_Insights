- record_id: ARENA-DLV-14972
  source_title: 'Looking Forward: Barriers, Risks and Rewards of the Australian Geothermal
    Sector to 2020 and 2030'
  publish_date: 2014-06
  project_name: Soultz-sous-Forêts EGS Project (France/Germany)
  what_happened: The Soultz EGS project encountered directional control difficulties,
    lost circulation, and a stuck pipe during drilling of the first well (GPK1 in
    1987), running over budget; however over subsequent phases the project demonstrated
    that large fractured volumes can be created repeatedly in rock with pre-existing
    natural fractures, and a 1.5 MW demonstration plant operated for five years from
    2008 with little to no temperature decline in production.
  lesson_learnt: EGS projects in the Rhine Graben setting demonstrate that stimulating
    natural fracture systems at lower pressures — rather than creating entirely new
    tensile fractures — is more effective and predictable; projects should characterise
    the pre-existing natural fracture system as a primary exploration activity rather
    than assuming fractures can be created from scratch.
  issue_severity: moderate
  project_type: generation
