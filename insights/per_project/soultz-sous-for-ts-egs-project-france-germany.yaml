  evidence_excerpt: In 1987 the first well, GPK1, was drilled to 2002 m depth. The
    drilling was difficult with directional control, lost circulation and a stuck
    pipe presenting the primary problems. Consequently, the project ran over budget...
    In 2008 a 1.5 MW demonstration plant was constructed and tested at the Soultz
    project... During the more than 10 years of testing and the five years of plant
    operation there has been little to no temperature drop in the production flow.
