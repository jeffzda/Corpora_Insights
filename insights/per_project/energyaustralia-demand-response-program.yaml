  source_title: Demand Response Trial Test 6 December 2020
  publish_date: 2020-12
  project_name: ARENA Demand Response Trial – Residential BDR (PowerResponse)
  what_happened: Post-event surveys across more than 20,000 residential responses
    showed NPS remained consistently positive throughout the trial; 94% of AT6 participants
    knew what changes to make in their home, and 94% said they would participate in
    future events.
  lesson_learnt: Sustained education and engagement communications are effective at
    maintaining high participant confidence and willingness to re-participate in demand
    response — a near-constant 94% action-confidence rate over 18 months indicates
    that onboarding communications can be standardised and are sufficient without
    continuous re-education.
