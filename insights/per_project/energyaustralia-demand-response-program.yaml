  what_happened: The standard 10-day average baseline methodology did not adequately
    represent consumption for all periods — for example, Friday afternoon at retail
    shopping centres — potentially misrepresenting the delivered curtailment for some
    customer types.
  lesson_learnt: Validate the 10-day average baseline methodology against each customer
    type before programme launch — it is not universally applicable and can misrepresent
    delivered curtailment for customer segments with atypical weekly consumption profiles
    (e.g. retail shopping centres on Friday afternoons).
