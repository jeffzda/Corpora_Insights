- record_id: ARENA-DLV-22664
  source_title: Demand Response Trial Test 5 June 2020
  publish_date: 2020-06
  project_name: ARENA Demand Response Trial – C&I Segment
  what_happened: A low-cost non-invasive CT-based metering solution trialled for C&I
    DR monitoring was found to be unreliable at heavy-industry sites due to electromagnetic
    interference from high-voltage equipment, proximity constraints for the receiver
    unit, incompatible CT sizing, and zero-value data errors below 10% of rated current.
    EnergyAustralia is removing the devices from the field.
  lesson_learnt: Low-cost CT metering solutions designed for general use are not suitable
    for heavy-industry C&I DR monitoring; validate metering technology against the
    electromagnetic environment, switchboard configuration, and current range of target
    sites before procurement and deployment.
