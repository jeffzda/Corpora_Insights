  - 26
  evidence_excerpt: Under some circumstances, using biofuel requires pre-heating due
    to viscosity requirements for engine combustion (for example, 2 hrs notice) Whilst
    the generator can still operate on standard diesel with short notice, the complication
    impacts on the intent of converting to biofuel in the first place and therefore
    reduces the value of using biofuel generators as emergency back-up or for demand
    response user cases.
