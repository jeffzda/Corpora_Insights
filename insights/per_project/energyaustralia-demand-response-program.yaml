- record_id: ARENA-DLV-7807
  source_title: Demand Response Trial Test 6 December 2020
  publish_date: 2020-12
  project_name: ARENA Demand Response Trial – Residential BDR (PowerResponse)
  what_happened: EnergyAustralia developed 'event flex' capability — the ability to
    lengthen or shorten a demand response event once underway — but held back from
    deploying it because the customer experience implications (variable reward earning
    potential and changed planning behaviour) were not yet fully understood.
  lesson_learnt: Build event-flex capability early but do not deploy it until the
    customer experience of variable event duration has been fully tested — unexpected
    shortening or lengthening of events affects customer reward expectations and operational
    planning, and deploying it prematurely risks eroding participant trust before
    the program is established at scale.
  issue_severity: none
  project_type: DER/customer-side
  project_scale_band: commercial expansion
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: demand response
  source_pages: &id007
  - 18
  evidence_excerpt: We have built the capability and it is ready to use now, but we
    want to ensure we understand the customer experience more fully before applying
    event flex once an event has started. Event flex will impact the customers' potential
    for earning more or less rewards, (depending on whether the event is lengthened
    or shortened) and effect how the customer might plan for an event.
  confidence_note: null
