- record_id: ARENA-DLV-22675
  source_title: Demand Response Trial Test 5 June 2020
  publish_date: 2020-06
  project_name: ARENA Demand Response Trial – LCD Program
  what_happened: The LCD customer monitoring portal, which allowed customers to view
    real-time usage across up to six circuits, was accessed by very few customers
    regularly, indicating customers did not perceive value in monitoring beyond event
    participation. Plans to increase portal uptake were abandoned due to high install
    and operational costs.
  lesson_learnt: Real-time circuit-level monitoring portals add cost and complexity
    to LCD programs but deliver little perceived value to customers who are motivated
    only by event incentives; program design should avoid bundling monitoring features
    unless there is demonstrated customer demand, and should focus investment on the
    event activation mechanism instead.
