  project_name: ARENA Demand Response Trial – Business BDR (Business PowerResponse)
  what_happened: In the AT6 business BDR test, the original CAISO baseline methodology
    produced unfavourable and inaccurate curtailment results for a multi-site customer
    because sites had no solar, resulting in negative baselines for some sites; the
    participation rate calculated was 35% (9 of 26 sites) under the original methodology
    versus 81% (21 of 26 sites) under a corrected methodology excluding negative adjustments.
  lesson_learnt: Baseline calculation methodologies designed for solar-equipped residential
    customers should not be directly applied to commercial sites without solar — the
    'morning of adjustment' offset must be constrained to positive values only for
    non-solar sites, or curtailment will be systematically under-reported and customer
    rewards will be inaccurate, undermining participant trust.
