- record_id: ARENA-DLV-29971
  source_title: Demand Response Trial Test 4 December 2019
  publish_date: 2019-12
  project_name: ARENA Demand Response Trial
  what_happened: VPP customer research identified that $20 event reward payments were
    perceived as negligible and insufficient to motivate participation, while $50
    per event was considered more meaningful but still needed to be framed as additional
    to feed-in tariffs and not at the expense of the customer's own energy supply.
  lesson_learnt: VPP event reward payments must be set substantially above token amounts
    — $20 per event was seen as negligible by battery-owning customers; rewards in
    the $40–$50 range with no lock-in contracts were found to be the threshold for
    generating genuine participation interest.
