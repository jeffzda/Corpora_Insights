- record_id: ARENA-DLV-44968
  source_title: Demand Response Project Performance June 2019
  publish_date: 2019-06
  project_name: EnergyAustralia Demand Response Project
  what_happened: Solar customers' DR contribution was disproportionately affected
    by weather conditions on event days — on a rainy test day in NSW, solar customers
    (66% of MM participants) produced 97.5% of total MM load reduction because unusual
    weather inflated their adjusted baseline, while on hot days solar customers exported
    less and drew more from the grid.
  lesson_learnt: Solar customer DR contributions are highly weather-dependent and
    can be misleadingly large or small depending on conditions on the event day relative
    to baseline days — baseline methodologies and reserve commitments should not assume
    consistent solar customer contribution across different weather scenarios.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
