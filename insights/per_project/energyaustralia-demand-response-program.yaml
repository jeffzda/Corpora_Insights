  what_happened: EnergyAustralia's previous C&I monitoring solution was discontinued
    during the trial period with no immediate replacement in place; many larger customers
    had in-house monitoring systems and did not require an immediate replacement,
    but EnergyAustralia was actively investigating alternatives.
  lesson_learnt: Reliance on a single third-party monitoring solution for C&I demand
    response creates a programme continuity risk when that solution is discontinued
    — proponents should maintain visibility of vendor roadmaps and plan for monitoring
    technology transitions well in advance, ideally requiring customers to have or
    install hardware-agnostic in-house monitoring as a condition of participation.
