  source_title: Demand Response Trial Test 5 June 2020
  publish_date: 2020-06
  project_name: ARENA Demand Response Trial – C&I Segment
  what_happened: EnergyAustralia deployed a proprietary C&I VPP software platform
    for remote monitoring and automated event activation across a large portion of
    its C&I portfolio. Some customers experienced inadvertent operation of site equipment,
    others preferred manual 'call and drop' activation, and the trading desk encountered
    integration issues with BAU processes. EnergyAustralia discontinued the platform.
  lesson_learnt: Automated remote control platforms for C&I DR face adoption barriers
    from customers concerned about third-party control of operational equipment; a
    hybrid offering combining automated monitoring with manual activation ('call and
    drop') is likely to achieve broader C&I participation while retaining operational
    control for sensitive sites.
