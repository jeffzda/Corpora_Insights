  source_title: Demand Response Trial Test 5 June 2020
  publish_date: 2020-06
  project_name: ARENA Demand Response Trial – Activation Test 5
  what_happened: In the 30 January 2020 mass market event, customers split into a
    long-notice group (24 hours + 4 hours prior) and a short-notice group (30 minutes
    prior) achieved almost identical response rates (~40% each), with the long-notice
    group delivering only 4.7% more load than the short-notice group.
  lesson_learnt: Advance notice of demand response events has minimal material impact
    on participation rates or load delivered; program design can use short-notice
    activation without significant loss of response, simplifying operational dispatch
    processes.
