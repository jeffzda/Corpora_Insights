  source_title: Demand Response Trial Test 5 June 2020
  publish_date: 2020-06
  project_name: ARENA Demand Response Trial – LCD Program
  what_happened: Customer research and testing for LCD products found that customers
    sought simpler, easier-to-understand devices, and that the complexity of the smart
    isolation switch — requiring professional installation into the switchboard and
    granting third-party control over household circuits — was a significant adoption
    barrier.
  lesson_learnt: Load control device propositions that require professional switchboard
    installation and third-party circuit control face fundamental customer acceptance
    barriers; product development should prioritise 'plug and play' devices that customers
    can self-install and understand intuitively, reducing both cost and perceived
    risk.
