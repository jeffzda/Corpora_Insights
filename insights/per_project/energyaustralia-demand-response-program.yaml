  publish_date: 2020-12
  project_name: ARENA Demand Response Trial – Business BDR (Business PowerResponse)
  what_happened: COVID-19 restrictions delayed the launch of the Business PowerResponse
    SME trial; the offer was initially limited to multi-site customers at launch on
    28 May 2020, and was only broadened to SME customers from 2 September 2020.
  lesson_learnt: Pandemic-related access restrictions can prevent standard SME enrolment
    processes (site visits, in-person meetings) and force a staged launch starting
    with remotely-manageable multi-site customers — contingency recruitment strategies
    for non-visit-based enrolment should be built into demand response program design
    from the outset.
