  what_happened: Switching from group-level dispatch targets to individual inverter-level
    commands for VPP batteries during the 29 August event — incorporating local weather
    conditions and individual load usage — enabled 81% battery utilisation, whereas
    the previous group-target approach had resulted in sub-optimal battery charging.
