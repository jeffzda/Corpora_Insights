  what_happened: EnergyAustralia partnered with distribution network business Jemena
    to co-deliver a behavioural demand response trial ('Energy Saving Rewards Program')
    in north-west Melbourne, targeting network-constrained feeders. The partnership
    demonstrated a model where a retailer and network operator collaborate to reduce
    duplication of DR programs and simplify customer participation.
  lesson_learnt: Retailer–network partnerships for co-delivered DR programs can eliminate
    duplication, address 'double payment' risks, and simplify the customer proposition;
    however, governance arrangements for triggering events based on network versus
    market needs, and for identifying customers enrolled in multiple DR programs,
    must be explicitly resolved before launch.
