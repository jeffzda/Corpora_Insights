- record_id: ARENA-DLV-44970
  source_title: Demand Response Project Performance June 2019
  publish_date: 2019-06
  project_name: EnergyAustralia Demand Response Project
  what_happened: C&I customers were observed responding to high spot prices by going
    offline and providing MW capacity to the grid without being formally called under
    the RERT mechanism, indicating that price signals can drive DR behaviour independently
    of programme activation.
  lesson_learnt: High spot price signals can independently trigger C&I DR behaviour
    outside formal programme dispatch — DR programme designers should account for
    this 'self-dispatch' effect when measuring programme-attributable delivery versus
    market-driven load response.
