- record_id: ARENA-DLV-7803
  source_title: Demand Response Trial Test 6 December 2020
  publish_date: 2020-12
  project_name: ARENA Demand Response Trial – Residential BDR (PowerResponse)
  what_happened: Early residential BDR incentive offers were financially unsustainable
    at scale; EnergyAustralia closed all earlier offers and migrated all customers
    onto a single standard offer ($1 for any reduction plus $2/kWh reduced) before
    scaling to 380,000 subscribers.
  lesson_learnt: Design the customer incentive structure for the target scale before
    mass enrolment — lucrative early offers that attract initial participants can
    become financially unviable at volume and require disruptive migration; a single
    standardised offer simplifies operations and enables like-for-like performance
    comparison across the customer base.
