- record_id: ARENA-DLV-22660
  source_title: Demand Response Trial Test 5 June 2020
  publish_date: 2020-06
  project_name: ARENA Demand Response Trial – VPP Program
  what_happened: During VPP DR events, batteries were pre-charged to ~99% and all
    devices began discharging simultaneously at event start, causing the entire VPP
    fleet to be fully discharged within approximately 1.5 hours — well before the
    end of a 2-hour event window.
  lesson_learnt: VPP dispatch strategies must stagger battery discharge start times
    and calibrate release rates based on battery size, solar output, average usage,
    and event duration; simultaneous full-fleet discharge results in premature exhaustion
    of reserve and cannot sustain response across the full event window.
