  source_title: Demand Response Trial Test 4 December 2019
  publish_date: 2019-12
  project_name: ARENA Demand Response Trial
  what_happened: In the VIC/SA Activation Test 4 (AT4), mass market (MM) customers
    as a whole consumed a net 0.3 MW more than their adjusted baseline, resulting
    in a negative contribution of -302 kW from MM BDR, while C&I customers delivered
    58.9 MW and dominated total delivery.
  lesson_learnt: Mass market BDR cohorts cannot reliably be counted on to deliver
    positive reserve on mild weather days; C&I customers should be treated as the
    primary delivery mechanism for MW-scale demand response events, with MM BDR providing
    incremental uplift only when weather conditions are favourable.
