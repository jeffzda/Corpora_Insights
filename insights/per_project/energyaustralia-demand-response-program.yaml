- record_id: ARENA-DLV-7804
  source_title: Demand Response Trial Test 6 December 2020
  publish_date: 2020-12
  project_name: ARENA Demand Response Trial – Residential BDR (PowerResponse)
  what_happened: In the 25 November large-scale residential BDR event with ~98,330
    customers invited, only 6.2% opted out when an opt-out link was included in the
    pre-event warning SMS — the first time an opt-out link was included in the warning
    message.
  lesson_learnt: Including an opt-out link directly in the pre-event warning SMS does
    not materially increase opt-out rates; it is good practice for transparency and
    customer trust, and the low opt-out rate (6.2%) suggests customers understand
    and accept the program even when their first contact is via the warning SMS rather
    than prior onboarding emails.
