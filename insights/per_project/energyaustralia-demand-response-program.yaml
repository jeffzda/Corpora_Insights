  source_title: Demand Response Trial Test 5 June 2020
  publish_date: 2020-06
  project_name: ARENA Demand Response Trial – VPP Program
  what_happened: Approximately 40% of Redback Smart Hybrid Systems scheduled to operate
    during December 2019 and January 2020 VPP events were precluded from participating
    because they were either located in bushfire-affected postcodes or had inverters
    that were offline.
  lesson_hearnt: VPP dispatch planning must account for a material proportion (~60%)
    of scheduled devices being unavailable on any given event day due to geographic
    disruption (e.g. natural disaster exclusion zones) or device connectivity issues;
    reliability buffers and over-scheduling should be built into VPP event dispatch
    to ensure aggregate reserve targets are met.
  lesson_learnt: VPP dispatch planning must account for a material proportion of scheduled
    devices being unavailable on any event day due to geographic disruption or device
    connectivity issues; reliability buffers and over-scheduling should be built into
    VPP dispatch to ensure aggregate reserve targets are met.
