- record_id: ARENA-DLV-32515
  source_title: Demand Response Project Performance January 2019
  publish_date: 2019-01
  project_name: EnergyAustralia Demand Response Project
  what_happened: During the November 2018 NSW test, unusual weather (torrential rain)
    caused solar customers to draw more from the grid than on prior days, inflating
    their adjusted baseline and resulting in a larger calculated load curtailment
    — with 97.5% of total Mass Market load attributed to solar customers who made
    up ~66% of participants.
  lesson_learnt: Weather-driven baseline distortion is a material risk for DR measurement
    in solar-heavy Mass Market portfolios — unusual weather that increases grid dependency
    for solar customers inflates the adjusted baseline and overstates delivered curtailment;
    baseline methodology must account for this or results will be unreliable.
