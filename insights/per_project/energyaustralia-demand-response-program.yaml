  source_title: Demand Response Project Performance June 2019
  publish_date: 2019-06
  project_name: EnergyAustralia Demand Response Project
  what_happened: Residential mass market customers indicated a preference for being
    communicated with via email or SMS and wanted personalised post-event feedback
    on their individual performance and rewards earned, rather than generic programme-level
    communications.
  lesson_learnt: Design DR customer communication protocols to include personalised
    post-event performance and reward summaries delivered via email or SMS — generic
    communications are insufficient to maintain engagement and programme loyalty among
    mass market residential participants.
