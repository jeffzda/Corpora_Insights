  source_title: Demand Response Trial Test 4 December 2019
  publish_date: 2019-12
  project_name: ARENA Demand Response Trial
  what_happened: In the NSW AT4, standard BDR MM customers delivered a net -12.1 kW
    (negative contribution), while Premium BDR customers — who had access to near
    real-time consumption data — delivered 26.5 kW; on a performing-customers-only
    basis, premium customers averaged 0.44 kW load reduction per customer, 41% higher
    than standard customers at 0.31 kW.
  lesson_learnt: Providing customers with near real-time consumption visibility during
    a demand response event materially improves curtailment performance — premium
    platform customers outperformed standard BDR customers by 41% per customer, suggesting
    real-time feedback should be a design feature for future DR propositions.
