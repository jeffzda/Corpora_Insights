  project_name: ARENA Demand Response Trial – Circuit Level Control Device (CLCD)
    Trial
  what_happened: Many CLCD-eligible pool pump customers also had solar panels and
    typically ran their pool pumps during solar generation hours — the same time solar
    production exceeded home consumption — meaning pool pumps were often not operating
    during DR events, severely limiting the LCD's demand response contribution.
  lesson_learnt: When selecting controllable loads for LCD programs, check whether
    targeted loads are likely to be operating during peak DR event windows; solar
    self-consumption behaviour can displace controllable loads (e.g. pool pumps) away
    from afternoon peak periods, undermining DR availability.
