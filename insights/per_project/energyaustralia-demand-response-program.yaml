  what_happened: COVID-19 business closures and economic uncertainty from March 2020
    slowed C&I DR recruitment, as business leaders became unwilling to commit to new
    processes and products despite clear benefits and minimal cost, and EnergyAustralia's
    contact centre capacity was temporarily reduced by stay-at-home orders.
  lesson_learnt: External economic shocks (such as a pandemic) can significantly disrupt
    C&I DR recruitment pipelines; program timelines should include contingency for
    externally-driven customer reluctance and reduced contact-centre capacity, and
    recruitment pipelines should be diversified across digital and in-person channels
    to maintain resilience.
