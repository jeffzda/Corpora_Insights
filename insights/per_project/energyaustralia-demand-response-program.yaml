- record_id: ARENA-DLV-22659
  source_title: Demand Response Trial Test 5 June 2020
  publish_date: 2020-06
  project_name: ARENA Demand Response Trial – LCD Program
  what_happened: EnergyAustralia's customer eligibility data did not include key fields
    (e.g. air-conditioner make and model, electric hot water system type) required
    to identify potential LCD customers, reducing the addressable market by up to
    90% once LCD eligibility criteria were applied.
  lesson_learnt: Before designing an LCD or hardware-based DR program, verify that
    the required customer eligibility attributes are captured in existing customer
