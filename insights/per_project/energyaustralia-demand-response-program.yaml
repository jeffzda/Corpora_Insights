  publish_date: 2019-06
  project_name: EnergyAustralia Demand Response Project
  what_happened: During the 24 January 2019 extreme heat event in Melbourne (40.8°C),
    3,890 mass market residential customers failed to respond to DR notifications
    and consumed 2.9 MW above their adjusted baseline, offsetting the 2.5 MW curtailment
    achieved by the 4,405 customers who did respond — resulting in a net portfolio
    demand 371.6 kW above the adjusted baseline.
