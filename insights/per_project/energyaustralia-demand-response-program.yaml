  source_title: Demand Response Trial Test 4 December 2019
  publish_date: 2019-12
  project_name: ARENA Demand Response Trial
  what_happened: LCD devices installed on pool pump circuits provided little or no
    demand response benefit during events because the majority of customers who also
    had rooftop solar ran their pool pumps in the middle of the day, while DR events
    typically occur in the late afternoon or early evening when pool pumps were already
    off.
  lesson_learnt: When selecting appliances for load control DR programs, verify that
    the target appliance is actually running at the time of likely DR events — pool
    pumps operated by solar customers during midday generation do not provide controllable
    load during the late-afternoon peak when events are most needed.
