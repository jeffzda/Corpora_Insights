  source_title: Demand Response Trial Test 6 December 2020
  publish_date: 2020-12
  project_name: ARENA Demand Response Trial – VPP (Bring Your Own Battery)
  what_happened: EnergyAustralia tested multiple VPP customer offer structures over
    the course of the program; higher upfront incentives ($650–$1,000) were the primary
    driver for converting new battery purchasers to VPP sign-ups, while for existing
    battery owners (BYOB) a per-event reward ($20–$40) was the main driver, with a
    $250 upfront subsidy proving less effective at converting new battery sales.
  lesson_learnt: VPP offer design must be differentiated by customer segment — battery
    purchasers require a substantial upfront subsidy ($650+) to convert to VPP enrolment
    at point of sale, while existing battery owners are primarily motivated by per-event
    payments; applying a one-size offer across both segments results in sub-optimal
    conversion in at least one segment.
