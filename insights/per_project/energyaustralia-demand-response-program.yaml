  what_happened: The mass market DR software platform experienced localisation failures
    related to time zones and daylight saving time adjustments — the software provider
    had not adjusted for Australian time zone settings, causing errors in event timing
    and performance calculations.
  lesson_learnt: When procuring offshore DR software platforms, explicitly verify
    and contractually require that the platform correctly handles Australian time
    zones and daylight saving transitions before deployment — these localisation issues
    are not automatically addressed by international vendors.
