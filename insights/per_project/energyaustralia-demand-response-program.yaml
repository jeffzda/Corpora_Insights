  source_title: Demand Response Trial Test 4 December 2019
  publish_date: 2019-12
  project_name: ARENA Demand Response Trial
  what_happened: Three out of four BDR customers surveyed indicated they would like
    to receive more information and tips on how to reduce energy consumption during
    a demand response event, and a significant proportion required education before
    recruitment to understand why the program was needed and how to participate.
  lesson_learnt: DR programs that rely on voluntary behavioural change must invest
    heavily in customer education before and during recruitment — without it, customers
    cannot understand the program's purpose or know what actions to take, limiting
    both sign-up rates and event performance.
