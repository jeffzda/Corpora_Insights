- record_id: ARENA-DLV-22663
  source_title: Demand Response Trial Test 5 June 2020
  publish_date: 2020-06
  project_name: ARENA Demand Response Trial – C&I Segment
  what_happened: EnergyAustralia offered C&I customer MWs into AEMO's Short Notice
    RERT mechanism on five occasions during summer 2019–20. In all five instances,
    AEMO contracted the MWs but did not dispatch them, leaving C&I customers committed
    and unable to operate normally while receiving no activation payment or market
    benefit.
  lesson_learnt: When contracting C&I customers into reserve mechanisms such as SN
    RERT, clearly communicate to customers the probability of non-dispatch and the
    operational constraints of being contracted but not called; non-dispatch at scale
    creates poor customer outcomes and risks eroding willingness to participate in
    future events.
