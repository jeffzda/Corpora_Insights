- record_id: ARENA-DLV-29954
  source_title: Demand Response Trial Test 4 December 2019
  publish_date: 2019-12
  project_name: ARENA Demand Response Trial
  what_happened: During the 29 August 2019 DR event, operational constraints meant
    the pre-event SMS notification was sent only one hour before the event rather
    than the standard lead time, resulting in lower customer satisfaction (lower Net
    Promoter Score) compared to other events, despite 51% of invited customers still
    responding and reducing usage.
  lesson_learnt: Adequate notification lead time is critical to BDR customer satisfaction
    and meaningful participation — short-notice events depress NPS even when headline
    response rates remain acceptable; operational processes must protect the notification
    window and avoid same-hour dispatches.
