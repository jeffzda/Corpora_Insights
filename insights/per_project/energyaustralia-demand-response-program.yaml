  what_happened: The CAISO 10-of-10 baseline methodology was found to be unsuitable
    for households with solar PV, as unusual weather conditions artificially inflated
    the adjusted baseline, leading to overstated curtailment calculations. The platform
    also lacked the ability to handle net-negative customer loads.
  lesson_learnt: Do not rely on the CAISO 10-of-10 baseline methodology for mass market
    DR programmes that include solar customers or that operate in highly weather-sensitive
    conditions — develop or adopt a methodology that accounts for solar generation
    variability and weather-driven demand shifts.
