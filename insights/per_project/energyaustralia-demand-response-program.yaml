  source_title: Demand Response Trial Test 6 December 2020
  publish_date: 2020-12
  project_name: ARENA Demand Response Trial – C&I
  what_happened: COVID-19 prevented EnergyAustralia representatives from visiting
    C&I sites or holding in-person meetings, making C&I demand response recruitment
    more challenging during the trial period; one legacy customer was also lost to
    an aggregator offering a larger (though not guaranteed) return.
  lesson_learnt: C&I demand response recruitment is heavily dependent on in-person
    site engagement, and virtual-only engagement during COVID-19 restrictions constrained
    the ability to add new customers — proponents should develop remote-first site
    assessment and recruitment processes as a standing capability, not a pandemic
    contingency, and should monitor competitor aggregator offers to ensure retention
    of high-value customers.
