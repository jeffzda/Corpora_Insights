  source_title: Demand Response Project Performance June 2019
  publish_date: 2019-06
  project_name: EnergyAustralia Demand Response Project
  what_happened: Biofuel generators required up to two hours of pre-heating due to
    viscosity requirements before they could operate on biofuel; while the generator
    could still run on standard diesel with short notice, this constraint undermined
    the value proposition of converting to biofuel for emergency DR use cases.
  lesson_learnt: Do not assume biofuel generators can substitute for diesel in short-notice
    DR applications without pre-heating provisions — viscosity requirements impose
    approximately 2 hours of pre-heating time that is incompatible with emergency
    reserve activation timescales, undermining the rationale for biofuel conversion
    in this use case.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
