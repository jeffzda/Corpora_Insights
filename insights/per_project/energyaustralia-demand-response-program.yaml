  what_happened: In the 10 November business BDR test event, Victorian SME participation
    was notably lower than NSW (45% vs 83%) because many Victorian businesses were
    only re-commencing operations following COVID-19 lockdowns, distorting the event's
    overall performance results.
  lesson_learnt: External economic disruptions such as COVID-19 lockdowns can severely
    depress commercial demand response performance in affected regions — when scheduling
    test events, proponents should verify that target customer cohorts are operating
    at normal capacity and, where possible, stagger or separate results by operational
    status to avoid conflating structural performance with external disruption effects.
