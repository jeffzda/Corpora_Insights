  what_happened: The Mass Market DR software platform had issues with negative baseline
    values and uncapped Morning of Adjustment calculations, and the platform's cap
    and floor on the adjustment factor was incompatible with the ARENA DR specification's
    symmetric additive adjustment methodology, requiring system changes.
  lesson_learnt: When specifying DR software platforms for programmes involving solar
    PV customers, ensure the platform supports net-negative baseline values and that
    the adjustment factor methodology matches the programme specification (e.g. symmetric
    additive) before go-live — mismatches require post-deployment system changes that
    affect measurement integrity.
