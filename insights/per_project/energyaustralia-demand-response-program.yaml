- record_id: ARENA-DLV-22656
  source_title: Demand Response Trial Test 5 June 2020
  publish_date: 2020-06
  project_name: ARENA Demand Response Trial – Circuit Level Control Device (CLCD)
    Trial
  what_happened: The Circuit Level Control Device (CLCD) trial was fully implemented
    with 40 devices deployed but has now been discontinued and devices are being decommissioned.
    Key barriers included difficulty identifying eligible customers from available
    data, costly installation errors requiring rework, resource-intensive installer
    recruitment and training, and an unviable commercial model driven by high install
    costs and subscription fees.
  lesson_learnt: LCD programs based on circuit-level devices face compounding commercial
    barriers — high per-install costs (>$300), costly rework from switchboard complexity,
    ongoing subscription platform costs, and a narrow eligible customer base — making
    commercialisation unviable without a fundamentally different product and channel
    design.
