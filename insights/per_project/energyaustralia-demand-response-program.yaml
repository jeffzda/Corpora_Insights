- record_id: ARENA-DLV-22654
  source_title: Demand Response Trial Test 5 June 2020
  publish_date: 2020-06
  project_name: ARENA Demand Response Trial – Activation Test 5
  what_happened: The CAISO10 baseline methodology produced inaccurate reward calculations
    for solar BDR customers when solar generation was high during baseline measurement
    periods but low during the event itself (e.g. due to bushfire smoke haze on 30–31
    January 2020), causing some customers who curtailed load to receive lower-than-expected
    or no rewards.
  lesson_learnt: Standard CAISO10 baselines are not reliable for solar customers on
    days where solar output diverges significantly between the baseline and event
    periods; program designers should develop a solar-adjusted baseline methodology
    or apply a correction factor to avoid customer dissatisfaction and inequitable
    reward outcomes.
