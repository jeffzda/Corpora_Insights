- record_id: ARENA-DLV-7806
  source_title: Demand Response Trial Test 6 December 2020
  publish_date: 2020-12
  project_name: ARENA Demand Response Trial – Residential BDR (PowerResponse)
  what_happened: Only 47.8% of AT6 survey respondents knew they had received an incentive
    for participation; those aware of the incentive had an NPS of +64 versus +45 overall,
    while those who knew they did not receive an incentive still recorded a neutral
    NPS of +4.
  lesson_learnt: Incentive awareness significantly amplifies participant sentiment
    (NPS +64 vs +45 overall), but the program retains broadly neutral sentiment even
    among non-recipients — proponents should invest in post-event reward confirmation
    communications to convert neutral participants into advocates, as awareness rather
    than payment amount appears to drive the sentiment uplift.
