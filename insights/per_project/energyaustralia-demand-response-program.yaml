  source_title: Demand Response Trial Test 5 June 2020
  publish_date: 2020-06
  project_name: ARENA Demand Response Trial – Circuit Level Control Device (CLCD)
    Trial
  what_happened: Installer inaccuracies during CLCD installation — caused by switchboard
    complexity and variation — led to incorrect circuit monitoring configurations,
    requiring costly re-visits to reconfigure devices and ensure accurate monitoring.
  lesson_learnt: Where hardware installation involves variable site conditions (e.g.
    residential switchboards), installer error rates and rework costs must be explicitly
    costed into the business case; remote pre-configuration tools or standardised
    installation guides can reduce reconfiguration visits.
