  source_title: Demand Response Trial Test 6 December 2020
  publish_date: 2020-12
  project_name: ARENA Demand Response Trial – Residential BDR (PowerResponse)
  what_happened: EnergyAustralia scaled its residential BDR program from approximately
    25,000 customers in May 2020 to over 380,000 subscriptions by end of December
    2020, with fewer than 20,000 customers unsubscribing or becoming ineligible over
    that period.
  lesson_learnt: Scaling a residential demand response program by more than 15× in
    six months is achievable when eligibility criteria are straightforward (smart
    meter, no life-support, mobile and email contact) and participation is fully voluntary
    with easy opt-out — proponents should design for mass enrolment from the outset
    rather than retrofitting scale.
