- record_id: ARENA-DLV-44957
  source_title: Demand Response Project Performance June 2019
  publish_date: 2019-06
  project_name: EnergyAustralia Demand Response Project
  what_happened: The Load Control Device (LCD) customer proposition was insufficiently
    refined, with messaging that did not focus on low-lifestyle-impact use cases such
    as pool pumps, and the aggregation and fleet management software lacked the capability
    to onboard and operate at the planned scale.
  lesson_learnt: LCD propositions must be crafted around low-impact, relatable use
    cases (e.g. pool pumps) and backed by fleet management software capable of operating
    at target scale before customer recruitment begins — capability gaps in either
    dimension will prevent planned enrolment numbers from being achieved.
