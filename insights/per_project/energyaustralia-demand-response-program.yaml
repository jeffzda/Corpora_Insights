  source_title: Demand Response Trial Test 6 December 2020
  publish_date: 2020-12
  project_name: ARENA Demand Response Trial – C&I
  what_happened: Only one C&I customer had an automated demand response process; all
    other contracted C&I customers delivered demand response through manual curtailment,
    with many having developed site-specific internal processes aligned to their OHS
    requirements.
  lesson_learnt: Manual curtailment processes, built around site-specific OHS requirements,
    are a viable and reliable delivery mechanism for C&I demand response — proponents
    should not assume automation is a prerequisite for consistent C&I performance,
    but should invest in helping customers formalise and document their manual DR
    procedures to ensure reliability across staff turnover and event scenarios.
