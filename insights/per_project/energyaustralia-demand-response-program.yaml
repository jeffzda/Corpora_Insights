  project_name: EnergyAustralia Demand Response Project
  what_happened: Commercial and Industrial customers contributed all or most of the
    reserve capacity across tests, while Mass Market customers remained a minor contributor,
    highlighting an imbalance in the portfolio composition that limits resilience
    and scalability.
  lesson_learnt: DR portfolio designers should not rely predominantly on C&I customers
    to deliver reserve capacity — the programme demonstrated that Mass Market customers
    require further engagement, education, and tailored incentives before they can
    contribute meaningfully at scale, and this should be planned for from the outset
    rather than discovered at programme maturity.
