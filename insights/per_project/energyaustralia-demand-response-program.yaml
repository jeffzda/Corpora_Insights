  source_title: Demand Response Trial Test 4 December 2019
  publish_date: 2019-12
  project_name: ARENA Demand Response Trial
  what_happened: During the 29 August 2019 VPP market event, Victorian and South Australian
    sites were grouped together in the dispatch portal; when a real-time price event
    required region-specific dispatch signals, the cross-state grouping prevented
    optimal dispatch and EnergyAustralia identified the need for separate regional
    group structures.
  lesson_learnt: VPP dispatch portal group structures must reflect regulatory and
    pricing region boundaries — grouping customers across different NEM regions in
    the same dispatch group prevents effective real-time price response; set up separate
    groups by region before conducting spot-market-triggered events.
