    their pool pump to run at the end of the day specifically to maximise financial
    rewards from LCD DR event participation, rather than genuinely shifting load in
    response to grid needs.
  lesson_learnt: LCD and BDR incentive structures must be designed to prevent gaming
    — if customers can pre-shift load to maximise reward eligibility without delivering
    genuine grid benefit, the incentive design needs revision (e.g. dynamic baselines,
    event timing variation) to ensure rewards are tied to actual load reduction.
