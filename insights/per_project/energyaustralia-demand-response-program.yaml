  source_title: Demand Response Trial Test 5 June 2020
  publish_date: 2020-06
  project_name: ARENA Demand Response Trial – BDR Program
  what_happened: Customer research revealed that financial incentives for BDR create
    equity issues because lower-usage households may not qualify for the reward thresholds,
    risking disappointment and disengagement from the program.
  lesson_learnt: Incentive structures for mass-market DR programs must account for
    lower-usage households who may be excluded from financial reward thresholds; tiered
    or proportional reward designs are preferable to flat thresholds that systematically
    exclude lower-usage participants.
