- record_id: ARENA-DLV-45851
  source_title: Optimisation of Central Receivers for Advanced Power Cycles - Project
    results and lessons learnt
  publish_date: 2017-07
  project_name: Optimisation of Central Receivers for Advanced Power Cycles
  what_happened: Software specialists and the Workspace workflow management framework
    were only brought into the project in the last two years of a ~five-year project.
    Prior to that, code was developed as a text-based research tool, then crudely
    ported to become a Workspace plugin, limiting the quality and professionalism
    of the public software release.
  lesson_learnt: Engage IT/software specialists experienced in workflow management
    systems (e.g. CSIRO Workspace) and establish clear code style guidelines from
    the project outset — late integration of software specialists forces an inefficient
    'port' of research code and reduces time available to develop the user interface
    critical for communicating results to non-specialist audiences.
