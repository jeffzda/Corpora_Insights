- record_id: ARENA-DLV-45856
  source_title: Optimisation of Central Receivers for Advanced Power Cycles - Project
    results and lessons learnt
  publish_date: 2017-07
  project_name: Optimisation of Central Receivers for Advanced Power Cycles
  what_happened: 'Post-project, ongoing costs and effort are required for: maintenance
    of the heliostat test device at Forbes, continued data collection from the accelerated
    mirror reflectivity test at NREL (consumables and labour), and periodic software
    updates and technical support for the publicly released software packages — none
    of which were fully scoped within the project budget.'
  lesson_learnt: Research projects that produce publicly released software and long-running
    physical test programmes must explicitly budget and plan for post-project maintenance,
    data collection, and user support — failure to do so risks the outputs becoming
    obsolete or inaccessible shortly after project completion.
