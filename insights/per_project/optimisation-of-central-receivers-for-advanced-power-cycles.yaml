- record_id: ARENA-DLV-45855
  source_title: Optimisation of Central Receivers for Advanced Power Cycles - Project
    results and lessons learnt
  publish_date: 2017-07
  project_name: Optimisation of Central Receivers for Advanced Power Cycles
  what_happened: CSIRO's own Heliosim ray tracing software was selected over candidate
    third-party packages (Tonatiuh, Soltrace, Tiesol) because internal access to source
    code, familiarity with complex receiver geometries such as cavity receivers, and
    superior computational performance outweighed any advantage of using established
    external tools.
  lesson_learnt: When selecting ray tracing software for integrated CSP modelling,
    prioritise access to source code and ability to handle complex geometries over
    familiarity with widely-used third-party tools — internal tools with modifiable
    source code enable the performance tuning and geometry flexibility that complex
    receiver optimisation requires.
