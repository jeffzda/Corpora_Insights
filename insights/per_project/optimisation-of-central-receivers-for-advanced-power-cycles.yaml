- record_id: ARENA-DLV-45853
  source_title: Optimisation of Central Receivers for Advanced Power Cycles - Project
    results and lessons learnt
  publish_date: 2017-07
  project_name: Optimisation of Central Receivers for Advanced Power Cycles
  what_happened: No facet shape degradation was detected over the life of CSIRO's
    Solar Field 2 (multiple years of data), and NREL's longer-term accelerated mirror
    exposure tests similarly showed no notable changes in mirror slope error and reflectivity,
    leading the project to abandon planned component longevity analyses.
  lesson_learnt: Do not assume mirror slope error and reflectivity will degrade significantly
    over the project timeframe when scoping component longevity work — empirical data
    from both field monitoring and accelerated tests may show negligible degradation,
    freeing resources for other modelling priorities.
