- record_id: ARENA-DLV-45854
  source_title: Optimisation of Central Receivers for Advanced Power Cycles - Project
    results and lessons learnt
  publish_date: 2017-07
  project_name: Optimisation of Central Receivers for Advanced Power Cycles
  what_happened: The project successfully demonstrated that combining GPU-accelerated
    ray tracing with CFD-based convective cooling simulation and heliostat field layout
    optimisation in a single integrated model (Heliosim-ICRSM) is technically feasible
    and produces a capability not available in other existing CSP modelling packages.
  lesson_learnt: Integrating ray tracing, CFD and cost modelling into a single workflow
    from the outset — rather than coupling separate tools post-hoc — delivers a uniquely
    comprehensive optimisation capability for high-temperature CSP system design;
    future CSP R&D projects should consider this architecture.
  issue_severity: none
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar thermal
  source_pages: &id004
  - 6
  - 10
  evidence_excerpt: Heliosim-ICRSM provides a unique and comprehensive modelling capability
    not available in other existing CSP modelling packages. Models for the generation
    of 3D meshes describing both external and cavity receiver concepts, ray tracing
    of heliostat field optics, heliostat field layout optimisation, receiver heat
    transfer analysis including CFD simulation of convective cooling losses, material
    stress estimation and annual system simulation analysis are all available and
    can be utilised in an integrated way.
