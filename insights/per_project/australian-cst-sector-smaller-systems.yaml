  evidence_excerpt: Furthermore, the deployment of smaller CST systems in the distribution network will have a beneficial impact on the future deployment of large-scale systems in the transmission network
    from 2030. These smaller systems will demonstrate a good technical and commercial understanding of CST technology, grow Australia's capability and capacity to build and deploy CST systems and importantly,
    lower the technology cost and financing risk associated with CST systems.
