- record_id: ARENA-DLV-47061
  source_title: Australian Concentrating Solar Thermal Industry Roadmap
  publish_date: 2018-08
  project_name: Australian CST Sector — Smaller Systems
  what_happened: Early deployment of smaller CST systems (1–30 MW) in fringe-of-grid and off-grid locations was identified as the critical pathway to reducing technical and financial risk for subsequent
    large-scale (>100 MW) transmission-connected systems, because it would build local industry capability, demonstrate commercial structures, and lower lender risk premiums before large-scale deployment
    was required post-2030.
  lesson_learnt: For FOAK technology sectors, deliberately sequencing early deployment at smaller scale in lower-risk applications (fringe-of-grid, off-grid) before scaling to utility scale is a lower-risk
    and lower-cost pathway — it builds industry capability, establishes proven commercial structures, and reduces the risk premium that lenders will demand for large-scale projects, making the subsequent
    scale-up faster and cheaper.
