  evidence_excerpt: 'Very little is known about how fault current limiting is designed
    and implemented, as it is proprietary to the OEM, and the design is still evolving...
    the most recent current limiting methodologies can be categorized as follows,
    along with their advantages and challenges: Mode Switching (MS)... Current Saturation
    (CS)... Threshold Virtual Impedance (TVI or VI)... Voltage Saturation (VS).'
  confidence_note: issue_severity set to moderate — the issue was resolved through
