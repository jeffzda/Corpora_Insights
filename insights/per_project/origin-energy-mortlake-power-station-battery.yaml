- record_id: ARENA-DLV-67152
  source_title: Origin Energy - Mortlake Power Station Battery Project - Lessons Learnt
    Report No.1
  publish_date: 2024-05
  project_name: Mortlake Power Station Battery Project
  what_happened: The inverter OEM (SMA) provided only a technical memorandum covering
    basic grid-forming model algorithms rather than a comprehensive technical manual.
    The memorandum failed to clarify that two control modes (inertia mode and droop
    mode) within the grid-forming functionality are mutually exclusive, causing the
    modelling engineer to make incorrect initial assumptions and delaying the GPS
    modelling exercise by approximately one month.
  lesson_learnt: When selecting inverter OEMs for grid-forming BESS projects, prioritise
    transparency and maturity of technical models; insufficient OEM documentation
    forces trial-and-error modelling, as each setting update requires at least two
    weeks for full verification across hundreds of tests, compounding time and cost
    impacts. Where full technical manuals are not available, proactively engage OEMs
    to extract necessary detail before modelling commences.
  issue_severity: moderate
  project_type: storage
  project_scale_band: utility/large-scale
  lifecycle_phase: approvals/contracting
  proponent_type: utility/energy retailer
  delay_category: grid connection/system studies
  failure_mode: unvalidated technical assumptions
  outcome_class: delayed but recoverable
  secondary_failure_mode: poor scoping
  intervention_note: The modelling engineer identified the mutual exclusivity of the
    two GFM control modes through trial and error, ultimately resolving the incorrect
    assumptions and completing the GPS modelling, albeit approximately one month late.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages:
  - 8
  - 25
  evidence_excerpt: Original Equipment Manufacturer's ability to provide a full suite
    of the necessary technical detail at an early stage to allow for timely completion
    of GPS models associated with connection applications. Improved efficiency of
    model tuning process and in the reduction of timeline of preparing acceptable
    GPS modelling based on Grid forming basis.
  confidence_note: transferability assessed as moderate rather than broad because
