- record_id: ARENA-DLV-45551
  source_title: Origin Energy Mortlake Power Station Battery - Lessons Learnt Report
    No. 2
  publish_date: 2024-11
  project_name: Mortlake Power Station Battery Project
  what_happened: During the Mortlake BESS connection application and AEMO Due Diligence
    review, the Grid Forming (GFM) inverter's Virtual Impedance (VI) mode exhibited
    overlapping entry and exit criteria, causing retriggering and mode-sticking instability
    — particularly in weak grid conditions with low Short Circuit Ratios. The inverter
    oscillated between entering and exiting VI mode during fault ride-through, or
    in some scenarios remained permanently stuck in VI mode after a fault cleared.
  lesson_learnt: GFM inverter designs must use mutually exclusive, non-overlapping
    criteria for entering and exiting Virtual Impedance mode — overlapping thresholds
    cause retriggering or permanent mode-sticking in weak grids. Future projects should
    require vendors to demonstrate that VI entry/exit logic is robust across weak-system
    scenarios (low SCR, extended voltage excursions) before finalising the connection
    model.
  issue_severity: major
  project_type: storage
  project_scale_band: utility/large-scale
  lifecycle_phase: approvals/contracting
  proponent_type: utility/energy retailer
  delay_category: grid connection/system studies
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated integration
  intervention_note: Control parameters were adjusted and inverter settings fine-tuned
    through iterative testing to resolve VI retriggering and sticking issues, ultimately
    achieving model freeze required for connection approval.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages:
  - 6
  - 7
  - 8
  - 25
  evidence_excerpt: 'The overlapping criteria for entering and exiting Virtual Impedance
    (VI) mode can lead to several potential consequences: VI Mode Retriggering: Overlapping
    criteria can cause the inverter to oscillate between entering and exiting VI mode,
    leading to instability during faults... VI Mode Transitioning: Due to unclear
    criteria for entering and exiting VI mode, the inverter may enter VI mode and
    fail to exit.'
  confidence_note: delay_category set to commissioning/integration as the issue manifested
    during connection model validation (AEMO Due Diligence), which precedes physical
