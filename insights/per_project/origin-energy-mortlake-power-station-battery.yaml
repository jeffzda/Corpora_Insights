- record_id: ARENA-DLV-67151
  source_title: Origin Energy - Mortlake Power Station Battery Project - Lessons Learnt
    Report No.1
  publish_date: 2024-05
  project_name: Mortlake Power Station Battery Project
  what_happened: During GPS model development for the 300MW/650MWh BESS project, harmonic
    filters were first modelled on the BESS side of the connection but did not resolve
    harmonic concerns within the HV grid. Investigation determined that harmonic issues
    were inherent in the existing 500kV HV grid, requiring harmonic filters to be
    sized on the HV grid connection side — a cost and scope not anticipated at capital
    approval.
  lesson_learnt: Unrecognised harmonic issues in the existing HV grid are not detected
    until full GPS modelling is underway, which typically occurs after capital expenditure
    approval and equipment selection. Projects should proactively assess existing
    grid harmonic conditions and budget contingency for HV-side harmonic filters before
    capital approval, as the cost of grid-scale harmonic filters is magnitudes higher
    than generator-side equivalents and can threaten project viability.
  issue_severity: major
  project_type: storage
  project_scale_band: utility/large-scale
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: grid connection/system studies
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Harmonic filters were resized and specified for the HV grid connection
    side of the development to directly address the existing HV grid harmonic issues.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages:
  - 6
  - 7
  - 25
  evidence_excerpt: During the GPS model development for the Project harmonics were
    determined to be a connection issue of concern. Initially harmonic filters were
    modelled on the BESS side of the connection prior to 33kV to 500kV transformation,
    however this did not resolve the harmonic concerns within the HV Grid. It was
    thus determined, as the harmonic issues were inherent issues within the existing
    HV Grid, that harmonic filters were required to be sized on the HV side of the
    connection to deal directly with the existing HV Grid issues.
