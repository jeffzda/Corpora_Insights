    — the additional upfront cost (~$1M construction) and modestly longer GPS timeframe
    (~3 months) is typically offset within the first year by avoided system strength
    charges ($2–3M/yr) and additional revenue streams, making GFM economically superior
    for projects connecting into weak grid locations.
