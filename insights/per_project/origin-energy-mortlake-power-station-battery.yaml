    time and specialist resources for GPS clause negotiation — the absence of widely
    accepted GFM performance standards for clauses S5.2.5.5 (contingency response),
    S5.2.5.8 (protection/islanding), and S5.2.5.13 (voltage/reactive control) substantially
    increases assessment complexity and negotiation duration compared with grid-following
    projects.
