- record_id: ARENA-DLV-7102
  source_title: Origin Energy - Mortlake Power Station Battery - Lessons Learnt Report
    3
  publish_date: 2025-03
  project_name: Mortlake Power Station Battery Project
  what_happened: During an active connection application period, AEMO released SSIAG
    v2.2 in July 2024 (superseding v2.1 which was current at the time of initial submission
    in Q1 2024) and subsequently published four technical note updates to the System
    Strength Quantity (SSQ) methodology between June 2024 and February 2025. These
    updates required the project team to revise their simulation approach to remain
    aligned with the latest interpretation, adding effort and pressure to already
    tight delivery timelines. The technical notes were not widely circulated or accompanied
    by extended lead times, making them easy to miss.
  lesson_learnt: Developers should dedicate internal resources or processes to actively
    monitor all regulatory and technical publications from AEMO — including technical
    notes and minor updates, not just formal guideline revisions — throughout the
    connection process; supplementary clarifications such as technical notes can influence
    compliance expectations without prominent circulation, and early engagement during
    draft consultation phases reduces the risk of last-minute rework and schedule
    disruption.
  issue_severity: moderate
