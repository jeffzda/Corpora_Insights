  what_happened: An early decision was made to switch the Mortlake BESS from grid-following
    (GFL) to grid-forming (GFM) inverter operation, avoiding system strength connection
    charges of $2–3 million per annum. The GFM option carried an additional construction
    cost of $1 million and a longer nominal GPS timeframe (20 months vs 17 months)
    but eliminated annual system strength charges and opened additional revenue streams
    including SRAS and TNSP system strength supply contracts.
