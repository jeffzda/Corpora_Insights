- record_id: ARENA-DLV-45552
  source_title: Origin Energy Mortlake Power Station Battery - Lessons Learnt Report
    No. 2
  publish_date: 2024-11
  project_name: Mortlake Power Station Battery Project
  what_happened: During AEMO's Due Diligence review of the Mortlake BESS connection
    application, a newly added reactive power prioritization mode in the GFM inverter
    firmware caused active power output to drop significantly more than expected under
    unbalanced fault conditions. The connection assessment team disabled the reactive
    power prioritization mode because it was newly developed and considered insufficiently
    mature, accepting reduced reactive power performance to restore acceptable active
    power behaviour.
  lesson_learnt: New inverter firmware functionalities — such as reactive power prioritization
    — must be comprehensively tested across the full range of fault scenarios before
    inclusion in a connection model submission; immature features can introduce unexpected
    trade-offs (in this case, improved reactive power at the cost of excessive active
    power drop) that require removal under regulatory scrutiny. Standardising current
    limiting methods across the industry would reduce project-by-project integration
    risk.
  issue_severity: major
  project_type: storage
  project_scale_band: utility/large-scale
  lifecycle_phase: approvals/contracting
