- record_id: ARENA-DLV-7101
  source_title: Origin Energy - Mortlake Power Station Battery - Lessons Learnt Report
    3
  publish_date: 2025-03
  project_name: Mortlake Power Station Battery Project
  what_happened: During the Generator Performance Standard (GPS) submission process,
    AEMO's due diligence review flagged non-compliance with reactive current rise
    time requirements (NER S5.2.5.5) because Origin's studies used only positive sequence
    reactive current (Iq_poc_pos), while AEMO's assessment used total reactive current
    including both positive and negative sequence components (Iq_poc). The differing
    methodologies produced higher calculated rise times during unbalanced fault conditions,
    leading to an initial finding of non-compliance.
  lesson_learnt: Projects deploying GFM inverters should not assume that fault current
    limiting behaviour is standardised or fully mature — each OEM implements a proprietary
    approach with distinct stability trade-offs. Connection assessments must probe
    the specific current limiting methodology in depth and budget additional time
    for iterative model validation, as industry convergence on best practice has not
    yet occurred.
  issue_severity: moderate
  project_type: storage
  project_scale_band: utility/large-scale
  lifecycle_phase: approvals/contracting
  proponent_type: utility/energy retailer
  delay_category: grid connection/system studies
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: coordination & stakeholders
  intervention_note: Technical discussions between Origin, AEMO, and technical consultants
    led AEMO to acknowledge that positive sequence reactive current was the more appropriate
    methodology for unbalanced faults; methodologies were aligned and the GPS assessment
    proceeded without major rework.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages:
