  publish_date: null
  project_name: Europcar Electric Vehicle Infrastructure Project
  what_happened: Deployment contractors experienced busy periods towards the end of
    the calendar year, creating resource availability risks. Delays in upstream phases
    (approvals, DNSP engagement, hardware) flowed through to contractor scheduling
    conflicts.
  lesson_learnt: Keep deployment contractors updated with the latest delivery schedules
    from the outset — this allows them to reserve resources for the project and reduces
    the risk of delays when upstream phases overrun. Negotiate flexible contract terms
    to accommodate the schedule changes that are common in EV infrastructure deployment.
