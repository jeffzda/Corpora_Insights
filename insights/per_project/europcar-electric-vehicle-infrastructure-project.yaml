  project_name: Europcar Electric Vehicle Infrastructure Project
  what_happened: Europcar encountered a fragmented regulatory environment across states,
    with insufficient harmonisation of EV-related regulations and standards between
    jurisdictions and operators. This was identified as a significant structural barrier
    to scaling EV market development in Australia.
  lesson_learnt: Fleet operators rolling out EVs nationally should map state-by-state
    regulatory and operational differences early in planning — the absence of harmonised
    standards across Australian jurisdictions creates material barriers that cannot
    be solved at the project level and may require policy engagement or bespoke solutions
    per state.
