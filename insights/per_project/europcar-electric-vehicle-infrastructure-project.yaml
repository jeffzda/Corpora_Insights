  project_name: Europcar Electric Vehicle Infrastructure Project
  what_happened: Airport sites required both an Airport Building Control (ABC) permit
    and a works permit, with the approval process estimated to take 4–8 weeks per
    site. Larger airports required up to 9 months and smaller airports up to 5 months
    for approvals.
  lesson_learnt: Allocate at least 9 months for large airport approvals and 5 months
    for smaller ones — airport approval processes fall under both federal and local
    authorities and frequently face hurdles. Establish a relationship with the airport
    approvals team early to improve communication and avoid extensions.
