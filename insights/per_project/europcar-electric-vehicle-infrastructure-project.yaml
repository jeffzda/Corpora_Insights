  project_name: Europcar Electric Vehicle Infrastructure Project
  what_happened: Site visits at higher-complexity sites required data logging in addition
    to visual inspection, and needed to be conducted by experienced certified electricians
    to reliably assess electrical infrastructure, site layout, compliance, and future
    expansion capacity.
  lesson_learnt: Always use an experienced certified electrician for EV charger site
    visits — complex variables including supply capacity, cabling condition, switchboard
    configuration, and compliance requirements cannot be reliably assessed by non-specialist
    personnel. For complex sites, supplement visual inspection with at least 7 days
    of power logging.
