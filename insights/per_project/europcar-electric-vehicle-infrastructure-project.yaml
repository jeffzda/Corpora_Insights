  what_happened: DC charger installations consistently required engagement with the
    DNSP for capacity upgrades, unlike AC charger deployments where capacity upgrades
    were rarely needed. At Campbellfield, a capacity upgrade was requested for a 124kW
    DC unit but costs were deemed too substantial to justify, requiring load management
    as the fallback solution.
  lesson_learnt: Assume DC charger installations will require DNSP capacity upgrade
    engagement and budget accordingly — costs can be substantial and may not be justified,
    requiring load management as an alternative. AC charger deployments typically
