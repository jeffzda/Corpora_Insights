    response when CPMS remote diagnosis is insufficient — at Melbourne Airport, a
    pre-existing contractor relationship allowed a technician to arrive on-site within
    one hour, restoring full capacity without major operational disruption.
  issue_severity: minor
  project_type: transport electrification
