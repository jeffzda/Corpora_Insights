- record_id: ARENA-DLV-34052
  source_title: Europcar - Electric Vehicle Infrastructure Project - Lessons Learnt
    Report 1
  publish_date: 2024-12
  project_name: Europcar Electric Vehicle Infrastructure Project
  what_happened: EV chargers at Europcar stations were connected to general electrical
    panels without sub-metering, making it impossible to isolate charger electricity
    consumption from other station loads (lighting, refrigeration, washing bays).
    This prevented accurate reporting of electricity costs to ARENA and made cost
    attribution for the project reliant on rough estimates.
  lesson_learnt: Install dedicated sub-meters on EV chargers at the time of installation
    — connecting chargers to shared electrical panels without sub-metering makes it
    impossible to accurately attribute electricity costs to the EV programme or satisfy
    funder reporting requirements.
