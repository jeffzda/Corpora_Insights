  outcome_class: delayed but recoverable
  secondary_failure_mode: poor scoping
  intervention_note: Ampol built its own warehousing system to ensure charger components
    remained available and did not become critical path items in project delivery.
  transferability: broad
  delay_magnitude: 1-3 months
  technology_domain: EV
  source_pages: &id003
