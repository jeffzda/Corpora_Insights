  source_title: Europcar - Electric Vehicle Infrastructure Project - Infrastructure
    and Design Report
  publish_date: null
  project_name: Europcar Electric Vehicle Infrastructure Project
  what_happened: Hardware procurement lead times for EV charging components varied
    significantly — AC units in stock in Australia could be delivered in 1–2 weeks,
    but out-of-stock units required up to 2 months. Ancillary components such as pedestals
    and 4G modems were frequently overlooked in planning, creating unexpected delays.
  lesson_learnt: Plan procurement lead times for all components — not just the chargers
    themselves — including pedestals and 4G modems. To prevent hardware from becoming
    the critical path, complete equipment selection ahead of deployment and consider
    building a local warehousing buffer for fast-moving components.
