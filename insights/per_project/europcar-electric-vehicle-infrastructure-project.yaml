  source_title: Europcar - Electric Vehicle Infrastructure Project - Infrastructure
    and Design Report
  publish_date: null
  project_name: Europcar Electric Vehicle Infrastructure Project
  what_happened: OEM warranty terms typically specified that the warranty period commenced
    on delivery rather than installation, creating a gap in warranty coverage passed
    on to the end customer — a risk absorbed by the CPO.
  lesson_learnt: Negotiate OEM warranty terms to commence from installation date rather
    than delivery date — standard terms that start on delivery leave the CPO exposed
    to warranty gap risk, particularly when there is a significant lag between equipment
    delivery and site deployment.
  issue_severity: minor
  project_type: transport electrification
  project_scale_band: commercial expansion
  lifecycle_phase: procurement
  proponent_type: fleet/logistics operator
  delay_category: null
  failure_mode: coordination & stakeholders
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Warranties negotiated to start upon installation rather than
    delivery to close the gap in coverage passed to the end customer.
  transferability: broad
  delay_magnitude: null
  technology_domain: EV
  source_pages: &id004
  - 11
  evidence_excerpt: Standard terms usually state that the warranty starts upon delivery
    of the charger, which is typically earlier than the deployment date. When passing
    the warranty on to the end customer, there is a gap in the warranty period between
    what the OEM supplies and what is supplied to the end customer, leaving the risk
    of that gap with the CPO. Warranties can be agreed to start upon installation.
