  publish_date: '2024-10-31'
  project_name: Closing the Loop on Red Meat Processing Energy and Emissions
  what_happened: The Full Electrification scenario required a net increase in grid
    electricity consumption of 5,330 MWh per year (a 35% increase on baseline), driven
    primarily by the thermal energy storage system (8,804 MWh) and electric boilers
    (3,265 MWh), partially offset by 6,739 MWh from solar. Under current Victorian
    grid emissions accounting this scenario resulted in a net increase of 3,650 tCO2-e
    from the TES alone, despite replacing natural gas use.
  lesson_learnt: Full electrification scenarios in industrial settings can increase
    rather than decrease reported emissions under current grid accounting if electricity
    consumption increases substantially; project proponents should model both current-year
    and forward-year emissions trajectories given the rapidly declining Victorian
    grid emissions factor, as projects that appear emissions-negative today may be
    clearly positive by 2029–2030.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: concept/feasibility
  proponent_type: industrial operator
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: The study noted that because TES charging occurs during high
    solar penetration periods, actual emissions factors are likely lower than the
    grid average; Scope 2 emissions for Victoria are forecast to reduce by 98.7% by
    2035.
  transferability: broad
  delay_magnitude: null
  technology_domain: grid/system stability
