- record_id: ARENA-DLV-11953
  source_title: G & K O'Connor - Closing the Loop on Red Meat Processing Energy and
    Emissions - Lessons Learnt Report
  publish_date: 2024-05
  project_name: Closing the Loop on Red Meat Processing Energy and Emissions
  what_happened: The challenge of integrating metering data with operational data
    held in multiple different systems added significant complexity to the Milestone
    1 rollout, as no single system collected or analysed energy data across the site
    prior to the project.
  lesson_learnt: When deploying energy monitoring systems at facilities with fragmented
    operational data systems, budget explicitly for data integration work — the effort
    to reconcile metering data with existing operational data platforms is frequently
    underestimated and can be a major source of schedule delay.
