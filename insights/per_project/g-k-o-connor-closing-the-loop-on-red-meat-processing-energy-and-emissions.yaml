- record_id: ARENA-DLV-11952
  source_title: G & K O'Connor - Closing the Loop on Red Meat Processing Energy and
    Emissions - Lessons Learnt Report
  publish_date: 2024-05
  project_name: Closing the Loop on Red Meat Processing Energy and Emissions
  what_happened: Prior to the project, the O'Connor facility had no site-wide communications
    network, no centralised PLC for metering in the main plant, different PLC systems
    across the render and wastewater treatment plants, manually read meters with no
    automated data collection, and a manual weighbridge system relying on paper dockets
    — meaning there was no integrated energy data baseline whatsoever.
  lesson_learnt: Industrial facilities without baseline metering infrastructure should
    treat communications network installation, PLC standardisation, and automated
    meter reading as prerequisite workstreams to be scoped and funded separately before
    attempting a whole-of-site energy monitoring rollout — bundling these into a single
    milestone significantly underestimates delivery complexity.
