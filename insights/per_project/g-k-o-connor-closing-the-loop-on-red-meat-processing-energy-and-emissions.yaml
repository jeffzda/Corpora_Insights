  what_happened: The biogas feasibility study found that the BAU wastewater treatment
    upgrade scenario (dosed DAF + BNR) had an annual OPEX of $2.3M — two to three
    times that of CAL-based scenarios — primarily driven by K100 category DAF sludge
    disposal costs of $1.09M per year. The nearest EPA-approved K100 receival facility
    is three hours distant.
  lesson_learnt: When evaluating wastewater treatment upgrades at red meat processing
    facilities, K100 sludge disposal costs can dominate operating expenditure and
    make chemically-dosed DAF options financially unviable; proponents should quantify
    sludge disposal costs and availability of licensed receival facilities as a primary
    screening criterion before detailed design.
