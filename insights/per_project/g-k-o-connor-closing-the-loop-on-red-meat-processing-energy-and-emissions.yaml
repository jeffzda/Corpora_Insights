  what_happened: The solar study identified that the main plant rooftop solar (1,265
    kW) had no available roof space for additional panels, and the rendering plant
    and cold store rooftops could accommodate only 300 kW and 600 kW respectively.
    Achieving the larger solar scenarios (up to 9.7 MW) required ground-mounted single-axis
    tracking arrays on approximately 9 hectares of site land, which is a substantial
    land use commitment for a peri-urban processing facility.
