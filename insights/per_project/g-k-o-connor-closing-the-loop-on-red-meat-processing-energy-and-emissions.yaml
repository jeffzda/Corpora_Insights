  what_happened: The efficiency-led decarbonisation scenario showed that production
    volume changes have nearly double the impact on savings and NPV compared with
    other scenarios, because a greater proportion of its savings are from energy consumed
    directly as a result of production activity. A 25% increase in production increased
    Efficiency Led NPV more steeply than Solar Led, Biogas Led or Full Electrification.
