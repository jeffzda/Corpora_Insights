  project_name: Closing the Loop on Red Meat Processing Energy and Emissions
  what_happened: The study found that selling carbon certificates (VEECs, ACCUs, LGCs)
    generated by energy projects is an important contributor to project viability,
    but noted that certificates sold cannot be used to offset GKO's own emissions
    — only retired certificates count toward the generator's emissions claims. This
    distinction was identified as important for corporate emissions accounting.
  lesson_learnt: Project proponents earning energy efficiency or renewable energy
    certificates should understand that selling certificates transfers the associated
    emissions reduction claim to the buyer; organisations reporting against emissions
    targets should retire rather than sell certificates if they wish to count the
    reduction in their own inventory.
