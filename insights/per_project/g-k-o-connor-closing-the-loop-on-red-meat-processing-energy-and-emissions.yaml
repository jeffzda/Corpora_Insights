  publish_date: '2024-10-31'
  project_name: Closing the Loop on Red Meat Processing Energy and Emissions
  what_happened: Electrification projects for the site were assessed as financially
    unattractive at current gas-to-electricity price ratios, with the multi-stage
    ammonia heat pump for the abattoir showing a simple payback of 21.5 years and
    the CO2 heat pump for the render plant showing 15.6 years, before certificates.
  lesson_learnt: At current Australian gas-to-electricity price ratios, process heat
    electrification using heat pumps is unlikely to meet industrial investment hurdles
    without grant support or a significant increase in gas prices; sensitivity analysis
    should be central to business case development for these technologies.
