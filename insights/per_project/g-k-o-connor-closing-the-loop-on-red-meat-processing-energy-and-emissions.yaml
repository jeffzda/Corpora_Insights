  what_happened: GKO had no agreed internal cost of carbon applied to financial decisions
    at the time of the study. The study found this was a barrier to business-case
    approval for projects with paybacks above the company's 5-year hurdle rate, and
    recommended implementing an internal carbon price aligned with ACCU market forecasts
    (~$66/ACCU average over 7 years) to strengthen the case for energy efficiency
    and electrification investments.
  lesson_learnt: Industrial operators without an internal carbon price will systematically
    under-invest in decarbonisation projects — projects that fail a 5-year payback
    test on energy savings alone may clear the hurdle when a forward carbon cost is
    incorporated; adopting an internal carbon price aligned with ACCU or CBAM trajectories
    is a prerequisite for rational decarbonisation investment planning.
