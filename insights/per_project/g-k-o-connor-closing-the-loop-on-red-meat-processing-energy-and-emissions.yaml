  project_name: Closing the Loop on Red Meat Processing Energy and Emissions
  what_happened: The SW30 CAL biogas scenario — which assumes reliable incorporation
    of 70% of render plant stickwater into meat meal product — was found to be the
    most financially attractive biogas option (simple payback 3.7 years) but carries
    significant technical risk. At time of report, the ability to consistently incorporate
    70% stickwater into meat meal had not been proven following recent render plant
    upgrades.
  lesson_learnt: Financial models for CAL biogas projects in red meat processing should
    be stress-tested against stickwater incorporation reliability; the SW30 scenario
    is sensitive to a single operational assumption, and failure to achieve it risks
    both wastewater system non-compliance and loss of the meal revenue that underpins
    the business case.
