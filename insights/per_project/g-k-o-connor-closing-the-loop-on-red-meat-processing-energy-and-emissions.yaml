  what_happened: The biomass boiler option demonstrated the strongest financial case
    of any single technology in the study — $3M capital cost, 5.1-year simple payback
    and 1.9-year payback including certificates — but was excluded from the Solar
    Led and Biogas Led scenarios because those scenarios focused on different technology
    pathways, and was included only in the Efficiency Led scenario.
  lesson_learnt: Biomass boilers replacing end-of-life gas boilers at industrial sites
    with steam demand represent a low-incremental-cost, commercially mature decarbonisation
    option that warrants inclusion in any feasibility roadmap when natural gas boilers
    are due for replacement; the marginal cost framing (upgrade cost above a like-for-like
    replacement) dramatically improves the apparent payback.
