  what_happened: There is no current commercial or regulatory requirement for GKO
    to transition away from natural gas, and the study concluded that regulation and/or
    customer requirements would be the key driver of change for privately owned red
    meat processors given the highly competitive nature of the sector. Without external
    pressure, the business case for many projects did not meet the company's 5-year
    payback hurdle.
  lesson_learnt: In the absence of regulatory or customer-driven carbon requirements,
    privately owned food processors are unlikely to invest in decarbonisation projects
    beyond short payback efficiency measures; ARENA and industry bodies should factor
    this into program design, targeting co-funding to close the gap between commercial
    payback thresholds and the longer paybacks typical of electrification and fuel-switching
    projects.
