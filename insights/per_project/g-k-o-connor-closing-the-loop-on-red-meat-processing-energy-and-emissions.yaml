  project_name: Closing the Loop on Red Meat Processing Energy and Emissions
  what_happened: The existing 6 MW Maxitherm steam boiler at the rendering plant was
    found to be near end-of-life and requiring replacement within approximately 18
    months. The feasibility study identified this as the optimal opportunity to specify
    a replacement boiler capable of co-firing with biogas, but the cost of boiler
    replacement was not included in the financial analysis.
  lesson_learnt: End-of-life boiler replacement is the lowest-cost moment to specify
    co-firing capability for biogas; project teams should align decarbonisation feasibility
    studies with known asset replacement cycles so that marginal costs of upgrade
    are captured rather than full replacement costs.
