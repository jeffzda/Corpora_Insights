- record_id: ARENA-DLV-4905
  source_title: G & K O'Connor - Closing the Loop on Red Meat Processing Energy and
    Emissions - Integrated Scenarios & Roadmap - Final Report
  publish_date: '2024-10-31'
  project_name: Closing the Loop on Red Meat Processing Energy and Emissions
  what_happened: Proposed electrification projects (heat pumps and electric boilers)
    requiring a minimum of 600 kVA were found to be infeasible on existing electrical
    infrastructure. Analysis confirmed no additional electrical capacity was available
    on the abattoir main switchboard, and multiple transformers were already at or
    near rated capacity, requiring major infrastructure upgrade before electrification
    could proceed.
  lesson_learnt: Electrical supply capacity constraints are a primary barrier to industrial
    electrification; proponents should commission an electrical infrastructure assessment
    early in feasibility studies to identify upgrade costs and timelines, as these
    can materially change the business case.
