  publish_date: 2024-05
  project_name: Closing the Loop on Red Meat Processing Energy and Emissions
  what_happened: Milestone 1 (metering and monitoring system installation) took longer
    than expected to complete, originally anticipated by end of 2023 but delayed due
    to the complexity of retrofitting into an existing facility with equipment of
    varying ages, no site-wide communications network, multiple incompatible PLC systems,
    and no existing automated meter reading or centralised data storage.
  lesson_learnt: Before scoping a metering and monitoring retrofit at an existing
    industrial facility, conduct a detailed audit of existing automation infrastructure,
    communications networks, PLC systems, and data storage — the absence of these
    foundations will substantially increase complexity and delivery time beyond initial
    estimates.
