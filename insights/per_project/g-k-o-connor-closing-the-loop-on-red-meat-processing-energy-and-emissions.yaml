  publish_date: '2024-10-31'
  project_name: Closing the Loop on Red Meat Processing Energy and Emissions
  what_happened: Battery energy storage systems (BESS) evaluated for optimising on-site
    renewable energy generation were found to be uneconomic across all scenarios.
    Thermal energy storage (heat bricks) was identified as more valuable than electrical
    storage for this industrial site but remains largely uncommercialised in Australia,
    with only one known installation at time of study.
  lesson_learnt: For industrial sites with significant process heat demand, thermal
    energy storage will generally deliver better returns than electrical BESS; however,
    thermal storage technologies such as heat bricks are not yet widely commercialised
    in Australia and carry technology-readiness risk.
