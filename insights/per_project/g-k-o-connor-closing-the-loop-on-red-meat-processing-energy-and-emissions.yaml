  source_title: G & K O'Connor - Closing the Loop on Red Meat Processing Energy and
    Emissions - Integrated Scenarios & Roadmap - Final Report
  publish_date: '2024-10-31'
  project_name: Closing the Loop on Red Meat Processing Energy and Emissions
  what_happened: The solar feasibility study found that Battery Energy Storage Systems
    combined with solar were not economic for the rendering plant and cold store NMIs
    across multiple scenarios, due to high capital costs relative to incremental cost
    savings. All excess solar electricity was more effectively utilised by electric
    boilers or heat pumps than stored in BESS.
  lesson_learnt: At current BESS capital costs, industrial sites with significant
    process heat demand should route excess solar electricity to thermal loads (electric
    boilers or heat pumps) rather than investing in BESS; BESS only becomes competitive
    where no thermal absorption pathway exists or where demand charge reduction is
    a primary driver.
  issue_severity: minor
  project_type: industrial decarbonisation
  project_scale_band: demonstration
