  evidence_excerpt: The recommended scenario for GKO to pursue is the Efficiency Led
    scenario, as it represents the most appealing payback and highest NPV. This scenario
    prioritises energy efficiency projects to be completed before electrification
    of process heat in order to reduce the amount of energy needed, thereby reducing
    the size and cost of electrified process heat solutions.
