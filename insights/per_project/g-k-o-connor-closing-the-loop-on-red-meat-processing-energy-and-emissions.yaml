  project_name: Closing the Loop on Red Meat Processing Energy and Emissions
  what_happened: Once the metering and monitoring system was successfully installed,
    it immediately provided operational insights including data to inform sizing decisions
    for new equipment such as a replacement boiler for the render plant, and raised
    staff awareness of energy and water consumption patterns across the site.
  lesson_learnt: Even where installation of a metering and monitoring system is complex
    and delayed, the operational value delivered upon completion — including equipment
    sizing insights, energy KPI tracking, and staff awareness uplift — justifies the
    investment and is an essential prerequisite to any subsequent decarbonisation
    program at a brownfield industrial facility.
