  publish_date: '2024-10-31'
  project_name: Closing the Loop on Red Meat Processing Energy and Emissions
  what_happened: Very high total nitrogen concentrations in the raw wastewater at
    the Pakenham facility (600 mg/L TN for grain-fed cattle) — approximately 80% originating
    from the render plant — materially reduced biogas yields from the CAL by requiring
    high raw feed bypass fractions (20–35%) to achieve downstream nitrogen removal,
    and significantly increased BNR system aeration power requirements.
  lesson_learnt: Facilities processing high proportions of grain-fed or Wagyu cattle
    should measure TN/COD ratios in raw wastewater early in CAL feasibility studies,
    as unusually high nitrogen loads require large raw feed bypass fractions that
    substantially reduce biogas production and increase downstream treatment costs
    compared to industry benchmarks.
