    under current accounting methodology despite replacing natural gas use. The average
    electricity price paid for charging was 1.3c/kWh including network charges.
  lesson_learnt: Grid-connected thermal energy storage (heat bricks) arbitraging spot
    electricity prices can reduce energy costs substantially but currently delivers
    poor financial returns at industrial scale due to high capital costs; the technology's
    carbon accounting treatment under current methodology may also count as an emissions
    increase, requiring careful structuring of any ARENA grant application.
