  what_happened: The heat recovery from sterilisation wastewater project was assessed
    and found to have a very high complexity rating due to adverse impacts on biological
    wastewater treatment — removing heat from the effluent would slow reaction rates,
    potentially alter plant microbial composition and approximately double the required
    size of the biological treatment system. The project was explicitly marked 'Do
    not proceed'.
  lesson_learnt: Heat recovery from hot wastewater streams at meat processing plants
    is technically feasible but can have severe negative interactions with downstream
    biological treatment; the wastewater treatment system design must be assessed
    holistically before any waste heat extraction is contemplated, as the cost of
    treatment plant expansion may far outweigh energy savings.
