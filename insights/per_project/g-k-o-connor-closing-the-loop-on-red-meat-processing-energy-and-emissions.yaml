- record_id: ARENA-DLV-4901
  source_title: G & K O'Connor - Closing the Loop on Red Meat Processing Energy and
    Emissions - Integrated Scenarios & Roadmap - Final Report
  publish_date: '2024-10-31'
  project_name: Closing the Loop on Red Meat Processing Energy and Emissions
  what_happened: A feasibility study across four decarbonisation scenarios found that
    there is no single clear technical or financial solution to transform GKO's operations
    to low/no emissions energy. The Efficiency Led scenario was recommended as it
    delivers the most appealing payback (4.5 years including certificates) and highest
    NPV ($15.7M), despite delivering less total carbon reduction than Full Electrification.
  lesson_learnt: For industrial operators pursuing decarbonisation, prioritise energy
    efficiency projects before major electrification investments — reducing energy
    demand first lowers the size, cost and risk of downstream electrification, and
    typically yields the best business case.
