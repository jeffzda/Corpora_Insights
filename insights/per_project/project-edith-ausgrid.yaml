  source_title: DEIP - DEIP Dive - Event Summary 2023
  publish_date: 2023-07
  project_name: Project Edith (Ausgrid)
  what_happened: Project Edith's dynamic network pricing model, which uses time- and
    location-specific incentives, identified a tension between efficiency, equity,
    and transparency — the project is actively working to avoid burdening consumers
    with excess information or the network with operational complexity as it scales
    toward 1,000 consumers by 2024.
  lesson_learnt: Dynamic network pricing schemes must be designed with explicit equity
    and simplicity constraints from the start — the risk of information overload for
    consumers and operational complexity for networks grows with scale and should
    be stress-tested during the pilot phase before commercial roll-out.
