  source_title: Summary of ARENA Funded Hydrogen R&D Projects
  publish_date: 2023-04
  project_name: CSIRO – Solar Thermochemical Hydrogen
  what_happened: The CSIRO solar thermochemical hydrogen project generated commercialisation interest from three Japanese companies but requires further detailed engineering design to scale up to kilowatt
    scale before a pre-commercial system can be offered, indicating the technology is not yet investment-ready without additional development.
  lesson_learnt: Solar thermochemical hydrogen projects should plan for an explicit kilowatt-scale engineering design phase between laboratory demonstration and pre-commercial offering — Japanese industrial
    partners, a key market for Australian hydrogen, require this level of system maturity before progressing commercial discussions.
