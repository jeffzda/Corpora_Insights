- record_id: ARENA-DLV-39654
  source_title: UNSW - Machine Learning Applications for Utility-Scale Photovoltaics
    R&D Interim Report
  publish_date: '2024-05-15'
  project_name: Machine Learning Applications for Utility-Scale Photovoltaics
  what_happened: Analysis of 952 PV sites across Australia found that median annual
    performance degradation rates were similar across PV-specific climate temperature
    zones T4 and T5, which together account for the majority of Australian utility-scale
    PV installations, despite significant regional variation in climate and environmental
    conditions.
  lesson_learnt: When estimating degradation rates for Australian utility-scale PV
    projects across the dominant T4 and T5 climate zones, a common median degradation
    assumption is statistically supportable — project developers and asset managers
    need not apply large regional corrections for sites in these zones, though appropriate
    data preprocessing and filtering remain essential for accurate rate calculation.
