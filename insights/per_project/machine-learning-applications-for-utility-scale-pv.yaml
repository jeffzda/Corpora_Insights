  what_happened: A site-specific soiling model using only freely available remote
    satellite data was developed and validated against real-world plant measurements,
    achieving agreement within 1%, and a soiling map of Australia was generated showing
    strong regional patterns.
  lesson_learnt: Utility-scale PV plant operators can use satellite-derived soiling
    models to reliably estimate site-specific soiling rates (within 1% of ground-truth)
    without deploying dedicated on-site soiling measurement equipment — this approach
    is particularly valuable for optimising cleaning schedules and reducing O&M costs
    at remote sites where instrumentation is costly.
