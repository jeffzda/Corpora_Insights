- record_id: ARENA-DLV-39651
  source_title: UNSW - Machine Learning Applications for Utility-Scale Photovoltaics
    R&D Interim Report
  publish_date: '2024-05-15'
  project_name: Machine Learning Applications for Utility-Scale Photovoltaics
  what_happened: PVsyst modelling software — the industry standard for utility-scale
    PV performance simulation — was found to be unsuitable for real-time, intra-hourly
    performance assessment. Comparison against 5-minute measured data from an Australian
    utility-scale PV plant showed hourly errors exceeding 20% of nominal AC capacity
    during variable irradiance conditions, with approximately 5% of residuals lying
    beyond two standard deviations from the mean.
  lesson_learnt: Do not use PVsyst digital twins for real-time or sub-hourly performance
    monitoring of utility-scale PV plants — its minimum 1-hour time step produces
    errors exceeding 20% during cloud-variable conditions, masking soiling and degradation
    signals. Reserve PVsyst for monthly-to-yearly aggregate performance projections,
    where cumulative error is below 1%, and develop more advanced digital-twin models
    for high-resolution fault detection.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: data & measurement
  intervention_note: The team identified the fundamental sampling-rate mismatch between
    PVsyst (1-hour minimum time step) and plant instrumentation (5-minute intervals)
    and concluded that more advanced digital-twin models are required for intra-hourly
    use cases.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id001
  - 7
  - 8
  evidence_excerpt: PVsyst models face challenges in accurately predicting intra-daily
    data, with error > 20% for sub-hourly intervals... Approximately 5% of residuals
    lie further than 2 standard deviations away from the frequency histogram mean,
    which corresponds to an error greater than 20% of the PV plant's nominal AC capacity.
  confidence_note: 'issue_severity rated moderate: the finding constrains a planned
    platform feature (real-time monitoring) but does not prevent long-term performance
    assessment; it redirects rather than terminates the research approach.'
