- record_id: ARENA-DLV-39652
  source_title: UNSW - Machine Learning Applications for Utility-Scale Photovoltaics
    R&D Interim Report
  publish_date: '2024-05-15'
  project_name: Machine Learning Applications for Utility-Scale Photovoltaics
  what_happened: PVsyst digital twins were validated as accurate for long-term aggregate
    performance projection, with cumulative annual error of only 0.4% of annual yield
    at a utility-scale Australian PV plant, confirming their suitability for monthly-to-yearly
    performance benchmarking.
  lesson_learnt: PVsyst-based digital twins are reliable for monthly-to-yearly utility-scale
    PV performance projection (cumulative error below 1%) and can be confidently used
    for long-term energy yield assessments and degradation trending over extended
    periods; project teams should not discard PVsyst for these use cases based on
    its intra-hourly limitations.
