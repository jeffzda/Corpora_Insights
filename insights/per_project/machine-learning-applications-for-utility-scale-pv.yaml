- record_id: ARENA-DLV-39653
  source_title: UNSW - Machine Learning Applications for Utility-Scale Photovoltaics
    R&D Interim Report
  publish_date: '2024-05-15'
  project_name: Machine Learning Applications for Utility-Scale Photovoltaics
  what_happened: Post-mortem examination of silicon heterojunction (SHJ) modules installed
    in 2007 and retrieved after a decade of field operation identified hydrogen loss
    from the amorphous silicon surface passivation layer as the primary degradation
    mechanism, manifesting as decreased open-circuit voltage and increased first-diode
    recombination current density.
  lesson_learnt: For SHJ and other high-efficiency PV technologies relying on amorphous
    silicon passivation (including TOPCon), plan for gradual hydrogen migration as
    a key long-term degradation risk — post-mortem characterisation programmes should
    include dynamic secondary ion mass spectroscopy of passivation layers to identify
    this mechanism early and inform module lifetime warranty assumptions.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The research team applied a detailed post-mortem suite including
    photoluminescence imaging, Suns-VOC measurements, and dynamic secondary ion mass
    spectroscopy to isolate hydrogen depletion in passivation layers as the root cause,
    providing a methodology transferable to TOPCon devices.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id003
  - 10
  - 11
  evidence_excerpt: There is a clear reduction of passivation layer hydrogen content
    for fielded modules compared to un-fielded control modules... Thus, the gradual
    loss and/or diffusion of hydrogen away from amorphous silicon regions of SHJ layers
    is a key mechanism behind the observed decrease in SHJ module voltages in the
    field.
  confidence_note: project_scale_band set to demonstration as the post-mortem work
    is laboratory-based R&D generating evidence rather than a commercial deployment;
    technology_domain solar PV covers SHJ modules.
