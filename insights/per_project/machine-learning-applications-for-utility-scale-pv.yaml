  what_happened: Degradation rate calculations from multiple commonly-used statistical
    models converged to similar values when sufficient data preprocessing and filtering
    was applied, demonstrating that preprocessing methodology is a more important
    determinant of calculated degradation rates than the choice of statistical model.
  lesson_learnt: When calculating PV plant degradation rates, invest rigorously in
    data preprocessing and filtering before selecting a statistical model — the choice
    of model matters less than the quality of preprocessing, and inconsistent preprocessing
    is a primary source of divergent degradation rate estimates across studies.
