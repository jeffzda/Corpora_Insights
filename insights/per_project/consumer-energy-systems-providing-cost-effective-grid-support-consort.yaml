- record_id: ARENA-DLV-9122
  source_title: State of DER Technology Integration Report
  publish_date: 2021-02
  project_name: Consumer Energy Systems Providing Cost-Effective Grid Support (CONSORT)
  what_happened: The CONSORT project identified that adoption of over-restrictive
    static export limits on DER as a way of avoiding network issues would limit the
    usefulness of the NAC approach, as the NAC platform's value proposition depends
    on DER being able to operate flexibly within dynamically computed network constraints
    rather than being hard-limited.
  lesson_learnt: Static export limits imposed as a precautionary measure actively
    undermine the potential of network-aware DER coordination platforms — network
    operators should consider dynamic operating envelopes as the preferred long-term
    mechanism, as they allow both network protection and maximum DER value to be delivered
    simultaneously.
