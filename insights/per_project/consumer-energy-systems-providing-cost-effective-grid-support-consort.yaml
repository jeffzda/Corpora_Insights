- record_id: ARENA-DLV-9121
  source_title: State of DER Technology Integration Report
  publish_date: 2021-02
  project_name: Consumer Energy Systems Providing Cost-Effective Grid Support (CONSORT)
  what_happened: The CONSORT Bruny Island Battery Trial successfully demonstrated
    an automated Network Aware Coordination (NAC) platform that coordinated residential
    battery systems to adhere to and alleviate distribution network constraints, achieving
    approximately 33% reduction in diesel consumption over all trial peaks using a
    maximum of 34 installed battery/PV systems.
  lesson_learnt: Distributed, network-aware coordination of residential batteries
    can provide meaningful network support services at small scale — the key enabling
    capability is explicit network modelling in the control platform (not just device-level
    control), combined with standardised APIs for DER aggregation and data exchange,
    which are prerequisites for scaling this approach.
