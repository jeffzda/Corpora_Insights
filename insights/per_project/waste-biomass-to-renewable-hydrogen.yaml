  what_happened: The biomass preconditioning process required sulfuric acid (pH 1–3)
    at 120–150°C within the BPR, presenting a significant hazard and a barrier to
    commercial deployment due to the difficulty of safely handling volumes of hot,
    concentrated acid.
  lesson_learnt: Design solar-thermal biomass reactors to operate under neutral or
    solid-acid-catalyst conditions from the outset — reliance on liquid mineral acids
    at high temperature is a safety and commercialisation barrier that requires resolution
    before scale-up.
