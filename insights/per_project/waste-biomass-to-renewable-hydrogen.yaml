- record_id: ARENA-DLV-47804
  source_title: Waste Biomass to Renewable Hydrogen Midterm Activity December 2020
  publish_date: 2020-12
  project_name: Waste Biomass to Renewable Hydrogen
  what_happened: The laboratory-scale BPR achieved only approximately 17% yield of
    the target product 5-HMF from sucrose under optimal conditions (150°C, 0.05 M
    sulphuric acid). This low conversion efficiency means that the combined BPR-FEC
    tandem system, when scaled to 1 L FEC capacity, produced only 18.1 mL of hydrogen
    per litre of 0.1 M sucrose solution — a modest output that highlights the challenge
    of achieving commercially viable yields through the current process chemistry.
  lesson_learnt: At TRL3-4, the biomass-to-hydrogen conversion yield is too low for
    commercial viability — future development phases must prioritise improving BPR
    conversion yield, as the FEC subsystem performance is currently constrained by
    the limited quality and quantity of feedstock delivered by the BPR. Catalyst and
    process optimisation for the BPR should be a primary focus before scale-up.
  issue_severity: moderate
  project_type: null
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Development of new TiO2-ZrO2 composite catalyst for the BPR is
    underway as part of the next phase to improve conversion yield.
  transferability: narrow
  delay_magnitude: null
  technology_domain: hydrogen
  source_pages: &id017
  - 8
  evidence_excerpt: coupling the performance of the BPR (~17% yield (0.034 M) from
    100 mL of 0.1 M sucrose solution) and the FEC (~26.6 mL of hydrogen from 50 mL
    of a 10 mM 5-HMF solution) and scaling the FEC system to 1L capacity sees an output
    of 18.1 mL of hydrogen produced per 1 L of 0.1 M sucrose solution.
  confidence_note: Rated moderate rather than minor because the yield gap is substantial
    and directly constrains the commercialisation pathway, though it is expected at
    TRL3-4.
