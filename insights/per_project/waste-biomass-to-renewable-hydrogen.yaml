  lifecycle_phase: commissioning/integration
  proponent_type: research organisation/university
  delay_category: commissioning/integration
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Adapted the electrocatalytic array design so NiMo precursor solution
    was passed through the cathodic compartment of the prototype cell and 1M KOH through
    the anodic compartment, imposing a uniform in-situ coating on the larger electrode.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages: &id004
  - 19
