- record_id: ARENA-DLV-14052
  source_title: Waste Biomass to Renewable Hydrogen End of Activity Report
  publish_date: 2022-12
  project_name: Waste Biomass to Renewable Hydrogen (UNSW / ARENA 2018/RND015)
  what_happened: Differential thermal expansion between the borosilicate glass evacuated
    tube (expansion coefficient 3.3 × 10⁻⁶ K⁻¹) and stainless-steel components (17.2
    × 10⁻⁶ K⁻¹) in the BPR created a risk of glass breakage when exposed to outdoor
    temperature fluctuations, threatening both safety and ongoing operational integrity.
  lesson_learnt: When coupling glass and metal components in an outdoor solar-thermal
    reactor, account for differential thermal expansion coefficients at the design
    stage — redesigned compliant gaskets/O-rings between dissimilar materials are
    required to absorb expansion and prevent thermal-shock breakage.
  issue_severity: moderate
  project_type: null
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Added redesigned Teflon gaskets/O-rings/aluminium fin between
    the evacuated solar tube and stainless-steel components to absorb differential
    thermal expansion; stainless-steel inner vessel ensures fluid containment if the
    outer glass breaks; a spill tray was installed below the reactor.
  transferability: moderate
  delay_magnitude: null
  technology_domain: hydrogen
  source_pages: &id002
  - 19
  evidence_excerpt: The glass has a lower thermal expansion coefficient (3.3 x 10-6
    K-1) compared to stainless-steel (17.2 x 10-6 K-1). The different degrees of thermal
    expansion of the different material can lead to glass breakage when exposed to
    environmental elements over time and the accompanying temperature fluctuations
    … Breakage could lead to release of reaction fluid (sulfuric acid at pH 1-3) which
    is a significant hazard.
