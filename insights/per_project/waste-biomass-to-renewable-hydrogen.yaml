- record_id: ARENA-DLV-14054
  source_title: Waste Biomass to Renewable Hydrogen End of Activity Report
  publish_date: 2022-12
  project_name: Waste Biomass to Renewable Hydrogen (UNSW / ARENA 2018/RND015)
  what_happened: Scaling up the NiMo-coated nickel foam electrodes from laboratory
    size (up to 3 × 3 cm²) to prototype size (~8 × 8 cm²) via standard electrodeposition
    produced a non-uniform catalyst coating, which degraded electrode performance
    in the flow electrolyser cell.
  lesson_learnt: Electrodeposition coating processes optimised at small electrode
    sizes do not translate directly to larger scales — the coating procedure must
    be re-engineered for prototype-scale electrodes, for example by using the cell
    itself as the deposition vessel to impose a more uniform coating.
