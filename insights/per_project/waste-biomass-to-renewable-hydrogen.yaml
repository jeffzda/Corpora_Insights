  source_title: Waste Biomass to Renewable Hydrogen End of Activity Report
  publish_date: 2022-12
  project_name: Waste Biomass to Renewable Hydrogen (UNSW / ARENA 2018/RND015)
  what_happened: CFD modelling of the BPR showed that extending reaction time beyond
    the optimal window is counterproductive for 5-HMF yield, as 5-HMF conversion to
    levulinic acid (LA) becomes more prevalent once glucose/fructose feedstock is
    depleted — a finding that was not obvious from experimental data alone.
  lesson_learnt: For solar-thermal biomass reactors targeting intermediate reaction
    products, use validated CFD models to define optimal reaction time windows and
    operating strategies before committing to hardware design — experimental data
    alone may not reveal yield-time trade-offs driven by competing reaction pathways.
