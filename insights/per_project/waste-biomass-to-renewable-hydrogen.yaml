- record_id: ARENA-DLV-47801
  source_title: Waste Biomass to Renewable Hydrogen Midterm Activity December 2020
  publish_date: 2020-12
  project_name: Waste Biomass to Renewable Hydrogen
  what_happened: During laboratory-scale BPR testing, the heating and cooling transients
    of the reactor caused the biomass conversion reaction to begin before the target
    temperature was reached and to continue after removal from the oven. This introduced
    uncontrolled reaction time at sub-optimal temperatures, affecting yield measurement
    accuracy and process control.
  lesson_learnt: When scaling up from laboratory to pilot-scale solar-collector BPR
    systems, heating and cooling transient effects on reaction progress must be explicitly
    integrated into the computational model — the larger solution volume and different
    solar heating system will amplify these effects significantly compared to the
    lab-scale oven setup.
  issue_severity: moderate
  project_type: null
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Cooling time was shortened and the reaction quenched by placing
    the hot BPR in cold water upon removal from the oven.
  transferability: moderate
  delay_magnitude: null
  technology_domain: hydrogen
  source_pages: &id015
  - 5
  evidence_excerpt: the reaction will start at some time prior to the BPR reaching
    the reaction temperature and continue for some time following removal of the BPR
    from the oven... the cooling time was shortened (and the reaction quenched) by
    placing the hot BPR in cold water upon removal from the oven. The implications
    of this, while not too significant for the small laboratory-scale BPR, will be
    more significant for the scaled-up BPR arising from the larger solution volume
    to be heated and the different heating system (solar collector).
  confidence_note: issue_severity rated moderate rather than minor because the finding
    directly affects scale-up design requirements and modelling assumptions, not merely
    a lab inconvenience.
