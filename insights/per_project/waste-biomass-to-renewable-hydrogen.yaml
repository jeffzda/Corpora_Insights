- record_id: ARENA-DLV-14055
  source_title: Waste Biomass to Renewable Hydrogen End of Activity Report
  publish_date: 2022-12
  project_name: Waste Biomass to Renewable Hydrogen (UNSW / ARENA 2018/RND015)
  what_happened: Scaling the flow electrolyser cell from small (≤3 × 3 cm²) to large
    (8 × 8 cm²) increased the pressure drop across inlet and outlet by more than 100
    kPa; combined with vigorous hydrogen bubble release, this promoted electrolyte
    leakage during long-term operation, causing short-circuiting, metal corrosion,
    and a safety hazard.
  lesson_learnt: Pressure management and sealing design must be explicitly re-engineered
    when scaling up flow electrolyser cells — pressure drops rise non-linearly with
    cell size and standard gasket arrangements suitable for bench-scale cells will
    leak under prototype operating conditions.
  issue_severity: moderate
  project_type: null
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: research organisation/university
  delay_category: commissioning/integration
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Redesigned the FEC with optimised flow channel geometry to reduce
    pressure drop, custom silicone gaskets sandwiched between electrodes and graphite
    plates, and a revised eight-bolt compression array to securely seal the cell.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages: &id005
  - 20
  evidence_excerpt: Compared to small-size FECs (i.e., 1.0 × 1.0, 2.0 × 2.0, 3.0 ×
    3.0cm2), the pressure drop across the inlet and outlet of a large-size FEC (8.0
    × 8.0cm2) during operation is greater, increasing by more than 100 kPa. The high
    pressure within the larger FEC in conjunction with the vigorous hydrogen bubble
    release can promote electrolyte leakage especially during long-term operation.
  confidence_note: null
