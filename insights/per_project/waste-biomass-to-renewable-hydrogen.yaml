- record_id: ARENA-DLV-14056
  source_title: Waste Biomass to Renewable Hydrogen End of Activity Report
  publish_date: 2022-12
  project_name: Waste Biomass to Renewable Hydrogen (UNSW / ARENA 2018/RND015)
  what_happened: Early system testing used a clean control sugar solution, but real-world
    waste biomass streams contain suspended solids, bacteria, colouring agents, preservatives
    (e.g., phosphoric acid), and mineral salts that had not been accounted for in
    the upstream BPR and FEC design, threatening long-term operability.
  lesson_learnt: Research prototypes for waste-stream processing should be tested
    with realistic feedstocks — not control solutions — as early as possible; upstream
    pre-treatment (e.g., activated charcoal, ultrafiltration, and reverse osmosis)
    must be designed into the system from the outset rather than added reactively.
