  source_title: Waste Biomass to Renewable Hydrogen End of Activity Report
  publish_date: 2022-12
  project_name: Waste Biomass to Renewable Hydrogen (UNSW / ARENA 2018/RND015)
  what_happened: The presence of inorganic ions (e.g., phosphates, calcium, sodium,
    chloride) in the waste feed stream was not fully characterised for its effect
    on FEC performance — their positive (increased conductivity) or negative (scaling)
    impact remained unresolved at project close-out.
  lesson_learnt: Inorganic ion management must be explicitly addressed in the pre-treatment
    design of waste-stream electrochemical systems — both beneficial (conductivity)
    and detrimental (scaling, fouling) effects of mineral species on electrolyser
    performance should be characterised experimentally before moving to pilot scale.
