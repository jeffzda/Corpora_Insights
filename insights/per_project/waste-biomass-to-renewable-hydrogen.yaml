- record_id: ARENA-DLV-47802
  source_title: Waste Biomass to Renewable Hydrogen Midterm Activity December 2020
  publish_date: 2020-12
  project_name: Waste Biomass to Renewable Hydrogen
  what_happened: 'A pH incompatibility was discovered between the BPR and FEC subsystems:
    the BPR effluent is acidic (pH < 7) due to sulphuric acid used in biomass conditioning,
    while the FEC electrocatalyst requires alkaline conditions (pH > 7) to function
    effectively. This integration mismatch creates a risk of electrocatalyst degradation
    and diminished FEC performance when the two subsystems are coupled.'
  lesson_learnt: When designing tandem electrochemical process systems, operating
    condition compatibility — particularly pH — across subsystem interfaces must be
    verified before subsystems are developed independently. Discovering pH incompatibility
    at the integration stage forces either additional process steps (pH adjustment),
    catalyst redesign, or feedstock chemistry changes, all of which add cost and schedule
    risk.
  issue_severity: major
  project_type: null
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: research organisation/university
  delay_category: commissioning/integration
  failure_mode: unvalidated integration
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Integrated a pre-conditioning reservoir between the BPR and FEC
    to alkalify the BPR outlet to pH 14 and reduce its temperature to a level safe
    for the FEC; identified future opportunity to recover BPR waste heat to pre-heat
    the FEC feed and improve solar-to-hydrogen efficiency.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages:
  - 5
  - 6
  - 21
  evidence_excerpt: Hydrogen extraction from 5-HMF within the FEC system currently
    functions well under an alkaline environment (pH > 7). Using sulphuric acid for
    biomass conditioning in the BPR means the effluent from the BPR system (which
    becomes the feed-stock for the FEC system) is currently acidic (pH < 7). Problems
    will likely arise regarding electrocatalyst stability (and diminished FEC performance)
    due to acidic nature of the BPR effluent.
  confidence_note: issue_severity rated major because this is a fundamental system
    integration incompatibility requiring one of three substantive technical redesign
    paths, not a minor tuning issue. Canonical record merged from 2 source records
    across 2 document(s).
