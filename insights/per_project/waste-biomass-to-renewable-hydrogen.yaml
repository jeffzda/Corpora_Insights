- record_id: ARENA-DLV-14058
  source_title: Waste Biomass to Renewable Hydrogen End of Activity Report
  publish_date: 2022-12
  project_name: Waste Biomass to Renewable Hydrogen (UNSW / ARENA 2018/RND015)
  what_happened: Gas bubble coalescence in the FEC flow channels caused blockages
    that degraded electrical conductivity and reduced electrolysis efficiency, a problem
    that worsened at higher electrode performance levels; the root cause required
    both material development and structural optimisation of the FEC.
  lesson_learnt: Bubble management must be addressed as a first-class design objective
    in flow electrolyser cells — CFD modelling of bubble dynamics before physical
    build can identify optimal flow channel geometry to balance bubble removal efficiency
    against pressure drop and avoid efficiency-limiting blockages.
