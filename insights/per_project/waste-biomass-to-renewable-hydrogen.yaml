- record_id: ARENA-DLV-14051
  source_title: Waste Biomass to Renewable Hydrogen End of Activity Report
  publish_date: 2022-12
  project_name: Waste Biomass to Renewable Hydrogen (UNSW / ARENA 2018/RND015)
  what_happened: The solar-thermal biomass pretreatment reactor (BPR) operated at
    120–150°C and 1–6 Bar internal pressure, which exceeded the tolerance of the evacuated
    glass tube fittings and seals, creating a risk of rupture and release of sulfuric
    acid (pH 1–3).
  lesson_learnt: When repurposing commercial solar thermal evacuated tubes as pressurised
    reactors, verify that all fittings, seals, and containment can handle both elevated
    pressure and temperature — failing to do so creates significant chemical hazard
    and requires costly redesign mid-project.
  issue_severity: moderate
  project_type: null
  project_scale_band: demonstration
  lifecycle_phase: construction/installation
  proponent_type: research organisation/university
  delay_category: commissioning/integration
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Reconfigured the BPR to contain a C20 stainless-steel vessel
    within the evacuated glass tube so reaction fluid is fully contained, and fitted
    a pressure release valve to ensure operational safety.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages: &id001
  - 19
  evidence_excerpt: Fittings and seals must be able to accommodate the increased operating
    pressure and temperature. The solar thermal BPR is an evacuated solar tube … less
    tolerant to pressure (internal pressure limit is 10 Bar). Rupture of seals/fittings
    or breakage of glass could lead to release of the reaction fluid (sulfuric acid
    at pH 1-3) which is a significant hazard.
