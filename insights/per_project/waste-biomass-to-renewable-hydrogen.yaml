- record_id: ARENA-DLV-47803
  source_title: Waste Biomass to Renewable Hydrogen Midterm Activity December 2020
  publish_date: 2020-12
  project_name: Waste Biomass to Renewable Hydrogen
  what_happened: At mid-term, the project successfully developed and validated a CFD
    computational model for the laboratory-scale BPR, coupling kinetic reaction modelling
    with fluid dynamics simulation. This allowed prediction of 5-HMF yield under varying
    temperature, sucrose concentration, and acid concentration conditions, and was
    validated against experimental data.
  lesson_learnt: Investing in validated computational modelling early in the laboratory
    phase provides a cost-effective tool for evaluating reactor design variations
    and operating conditions before committing to physical scale-up — reducing the
    number of expensive experimental iterations required at prototype stage.
