- record_id: ARENA-DLV-47805
  source_title: Waste Biomass to Renewable Hydrogen Midterm Activity December 2020
  publish_date: 2020-12
  project_name: Waste Biomass to Renewable Hydrogen
  what_happened: Melbourne Water independently contacted the project team after discovering
    the project on the ARENA website and expressed willingness to provide real municipal
    waste sludge samples as a future biomass feedstock. This unsolicited industry
    engagement occurred at a stage when the project was still using sucrose as a control
    biomass.
  lesson_learnt: Publishing project details on the ARENA website can attract unsolicited
    but commercially relevant industry partners — research teams should be prepared
    to engage potential end-users and feedstock providers early, as these relationships
    can shape the transition from synthetic control feedstocks to real-world biomass
    streams and accelerate the path to demonstration scale.
