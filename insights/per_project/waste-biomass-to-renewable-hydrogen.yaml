  source_title: Waste Biomass to Renewable Hydrogen End of Activity Report
  publish_date: 2022-12
  project_name: Waste Biomass to Renewable Hydrogen (UNSW / ARENA 2018/RND015)
  what_happened: Adding CdTe photovoltaic cells to the reflective wings of the BPR's
    concentrated parabolic collector enabled recovery of UV/visible spectrum solar
    energy that would otherwise be wasted by the solar-thermal unit (which predominantly
    uses infrared), reducing system footprint and providing electrical power for the
    FEC and pumps.
  lesson_learnt: In solar-thermal systems, spectral splitting between PV and thermal
    collection — using PV cells on reflective components to capture UV/visible light
    while thermal components capture infrared — can significantly improve overall
    solar utilisation and reduce system footprint; this approach is worth evaluating
    at the design stage of any solar-driven process.
