  evidence_excerpt: The prototype FEC system employs larger-sized Ni foam electrodes
    (~8.0 × 8.0 cm2) in the unit whereby obtaining a uniform coating of the NiMo alloy
    at this scale proved to be far more challenging. A non-uniform coating of the
    NiMo alloy had a negative impact on electrode performance.
