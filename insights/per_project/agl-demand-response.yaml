  what_happened: No C&I participants in the AGL program allowed remote automated dispatch
    of their loads; all DR activation was manual, driven by participant concerns about
    operational complexity, site safety, production commitments, risk management,
    and customer service impacts.
  lesson_learnt: Assume C&I DR participants will resist remote automated dispatch
    — manual activation is the norm in first commercial programs; aggregators should
    design programs around manual notification and participant-controlled curtailment,
    and build the business case for automation only after establishing trust through
    manual operation.
