  source_title: AGL NSW Demand Response Final Report
  publish_date: 2021-05
  project_name: AGL NSW Demand Response Project
  what_happened: During the January 2020 bushfire crisis, a large portion of AGL's
    C&I RERT portfolio was unavailable for DR because critical infrastructure participants
    (water utilities, telecommunications companies) were engaged in emergency response
    — AGL had to reduce declared availability from 20MW to 12MW, and the delivered
    result of 4.38MW average across the event was well below this.
  lesson_learnt: C&I DR portfolios containing critical services infrastructure (water
    utilities, telcos) are exposed to correlated availability risk during emergency
    events — precisely when RERT is most likely to be called, these loads are least
    available. DR aggregators must account for this double-jeopardy effect by limiting
    critical services as a proportion of total portfolio capacity and maintaining
    additional buffer from non-critical loads.
