  what_happened: Large curtailable C&I loads capable of sustaining a four-hour continuous
    outage were difficult to recruit, and specifically commercial (non-industrial)
    curtailable loads of attractive size without generators were hard to identify.
    AGL consequently focused on smaller commercial DR sources.
  lesson_learnt: C&I DR program designers should not assume that large, generator-free
