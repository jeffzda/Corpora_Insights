  what_happened: 'There was a significant discrepancy between customers'' self-reported
    event participation and measured participation: 62% of end-of-summer survey respondents
    self-reported participating in all four events, but only 40% had a measured energy
    reduction for all four events according to the baseline.'
  lesson_learnt: Self-reported participation data from residential DR participants
    substantially overstates actual measured response — program evaluations must not
    rely on survey-based participation claims and should clearly distinguish between
    customers' intention to act and verifiable load reduction in reporting and program
    design.
