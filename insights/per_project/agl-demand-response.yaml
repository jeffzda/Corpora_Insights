- record_id: ARENA-DLV-1112
  source_title: NSW Demand Response Report October 2019
  publish_date: 2019-10
  project_name: AGL NSW Demand Response Project
  what_happened: Air conditioner controlled load events produced a demand spike at
    the end of both test events as units ramped up to recover temperature setpoints
    simultaneously after being released from DR control, creating a rebound peak on
    the local network.
  lesson_learnt: Direct load control programs for thermostatically controlled appliances
    must include a staggered or ramped release strategy to prevent rebound peaks at
    event conclusion — simultaneous re-energisation of a fleet of air conditioners
    creates a new demand peak that can negate the network benefit of the original
    DR event.
