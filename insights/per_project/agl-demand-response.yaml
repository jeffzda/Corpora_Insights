  source_title: AGL NSW Demand Response Final Report
  publish_date: 2021-05
  project_name: AGL NSW Demand Response Project
  what_happened: Retrofitting Demand Response Enabling Devices (DREDs) to existing
    residential air conditioners under AS4755 proved commercially unviable — only
    45 of 123 initial expressions of interest proceeded to installation, installation
    required repeated site visits, compatibility was poor across makes and models,
    and air conditioner responses to control commands were inconsistent and erratic.
  lesson_learnt: The AS4755 DRED mechanism for retrofitting demand response control
    to existing residential air conditioners is not commercially viable — the bespoke
    installation complexity, high cost, inconsistent compliance across brands, absence
    of feedback from air conditioner to controller, and lack of local override make
    it unsuitable for large-scale DR deployment. Future air conditioner DR programs
    should use manufacturer-native Wi-Fi or API-based control platforms instead.
