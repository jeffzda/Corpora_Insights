  what_happened: Provision of near-real-time in-event feedback via a monitoring portal
    in Year 2 improved DR performance by approximately 30% for engaged users, but
    the cost of providing near-real-time metering data was high and portal engagement
    declined over events (20–40% of participants engaged, declining over time).
  lesson_learnt: Near-real-time customer feedback during DR events positively affects
    performance, but the incremental benefit does not justify the cost under current
    NEM metering infrastructure — aggregators should evaluate whether the performance
    uplift of ~30% covers the additional metering data cost before including it in
    a commercial program.
