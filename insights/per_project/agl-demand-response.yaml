- record_id: ARENA-DLV-30460
  source_title: NSW Demand Response Report September 2018
  publish_date: 2018-09
  project_name: NSW Demand Response Trial
  what_happened: Of 123 enrolments in the Managed For You Air Conditioner program,
    only 58 were confirmed and 45 proceeded to final installation. Approximately 40%
    of signed-up customers had air conditioners incompatible with Australian Standard
    AS4755. A further 10% of registrations were abandoned because customers could
    not locate or provide the required model number information.
  lesson_learnt: Before recruiting customers to a DRED-based air conditioner DR program,
    proponents should develop a simple remote or self-service air conditioner model
    verification tool — the difficulty of customers locating nameplate information
    (often on inaccessible outdoor units) caused significant drop-off and onboarding
    cost.
