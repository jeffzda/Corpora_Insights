- record_id: ARENA-DLV-1105
  source_title: NSW Demand Response Report October 2019
  publish_date: 2019-10
  project_name: AGL NSW Demand Response Project
  what_happened: The cost of operating the near-real-time metering data pipeline and
    in-event customer feedback portal was significant; AGL noted this cost would need
    to be recovered in any commercial program and that, combined with the incentive
    payment structure, the cost of residential behavioural DR was already high relative
    to wholesale spot prices.
  lesson_learnt: Before deploying real-time customer feedback infrastructure in a
    residential DR program, model the full cost stack including near-real-time data
    provision — the cost of this infrastructure may be uneconomic relative to the
    wholesale market value of the demand reduction achieved, and must be addressed
    before commercial deployment.
