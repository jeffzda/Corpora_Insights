  what_happened: The C&I portfolio showed significant seasonal variation in DR capacity
    — shopping centre and HVAC-heavy loads that delivered strong results in summer
    (hot weather) reduced by a factor of approximately four during the June 2018 winter
    test, as cooling loads were minimal and centres were winding down HVAC systems
    near closing time.
  lesson_learnt: C&I DR portfolio capacity is not seasonally stable — aggregators
    must actively rebalance portfolio composition between summer and winter, and should
    not assume summer test results will hold in winter. Loads dominated by HVAC are
    particularly volatile and may contribute near-zero DR outside peak cooling periods.
