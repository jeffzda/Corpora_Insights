  proponent_type: utility/energy retailer
  delay_category: procurement/supply chain
  failure_mode: poor scoping
  outcome_class: partial success
  secondary_failure_mode: execution & logistics
  intervention_note: AGL ran multiple staggered EDM recruitment rounds and a re-targeting
    campaign to build sufficient buffer into the registration pool, ultimately achieving
    3,500 participants despite the meter installation failures.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: DER
  source_pages: &id001
