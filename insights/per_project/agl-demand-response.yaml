  what_happened: Shopping centre loads performed very poorly during the 23 January
    2020 event, contributing a negative DR result averaging -3.19MW across the event,
    worsening to -5.53MW by the final interval — partly due to the AEMO baseline penalising
    Thursday evening loads against a Monday–Wednesday closing time baseline.
  lesson_learnt: Shopping centres with different closing times on different days of
    the week are systematically mis-baselined by the AEMO RERT formula for Thursday
    evening events — aggregators should identify and exclude or flag participants
    whose load pattern creates structural baseline errors on the days most likely
    to see RERT events.
