- record_id: ARENA-DLV-1103
  source_title: NSW Demand Response Report October 2019
  publish_date: 2019-10
  project_name: AGL NSW Demand Response Project
  what_happened: Solar customers (30% of the Year 2 cohort) created systematic inaccuracies
    in the load forecasting and baseline methodology; variable solar irradiance during
    events caused both false negatives (customers penalised despite genuine reduction
    effort) and false positives (customers rewarded for apparent reduction that was
    actually solar output variation), generating customer dissatisfaction.
  lesson_learnt: Exclude net-metered solar customers from behavioural DR programs
    or develop a separate gross-metering baseline methodology before scaling — net
    metering makes it impossible to distinguish DR effort from solar output variation,
    undermining reward accuracy and customer trust.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: The issue was identified but not resolved during Year 2; the
    document notes it could be addressed by separate gross metering for solar output,
    but the majority of NSW residential solar metering is net metering.
  transferability: broad
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id003
  - 13
  evidence_excerpt: Unfortunately, the introduction of solar into the forecasting/baseline
    equation adds another layer of uncertainty, as solar irradiance at the time of
    the event may be different to forecast on a macro or micro geographical basis.
    Solar output from a residential array can vary significantly throughout the day
    and this variation can overwhelm the DR efforts of the participants, leading to
    customer dissatisfaction if their efforts are not rewarded.
  confidence_note: null
