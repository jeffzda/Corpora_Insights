  source_title: AGL NSW Demand Response Final Report
  publish_date: 2021-05
  project_name: AGL NSW Demand Response Project
  what_happened: Industrial sites that used production suspension as their DR mechanism
    showed higher uncertainty as DR loads — several withdrew from tests on short notice
    due to production order deadlines, and one industrial load intermittently underperformed
    because its fluctuating process load baselined at 2–3MW despite delivering a 4MW
    instantaneous reduction.
  lesson_learnt: Industrial loads that deliver DR through production curtailment carry
    higher non-performance risk than continuous process loads — aggregators should
    model production schedule conflicts explicitly, discount industrial curtailment
    capacity for availability calculations, and supplement with more reliable process
    loads to hedge against last-minute withdrawals.
