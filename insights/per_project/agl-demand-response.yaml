- record_id: ARENA-DLV-69281
  source_title: AGL NSW Demand Response Final Report
  publish_date: 2021-05
  project_name: AGL NSW Demand Response Project
  what_happened: Increasing deployment of behind-the-meter DER assets (batteries in
    VPPs, remotely controlled air conditioners, disconnectable rooftop solar) is creating
    measurement interference with residential behavioural DR — these assets can be
    dispatched by other parties during a DR event, causing double-counting, baseline
    errors, and customer payment disputes.
  lesson_learnt: As behind-the-meter DER proliferates, residential behavioural DR
    programs face growing baseline accuracy problems from concurrent dispatch of the
    same assets by multiple parties — program designers should establish DER registry
    checks, develop protocols to detect and exclude double-counted DR, and advocate
    for coordinated dispatch frameworks to prevent conflicting signals to shared customer
    assets.
  issue_severity: moderate
