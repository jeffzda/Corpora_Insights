  what_happened: Net metering of residential solar PV meant that variations in solar
    output during DR events could not be distinguished from genuine demand reductions,
    causing customers with solar to receive incorrect rewards and leading to dissatisfaction.
  lesson_learnt: Net metering is incompatible with accurate residential DR measurement
    for solar households — programs should either exclude net-metered solar customers,
    use separate gross metering for solar output, or accept significant measurement
    error and design incentive structures accordingly. This problem will worsen as
    rooftop solar penetration increases.
