- record_id: ARENA-DLV-30461
  source_title: NSW Demand Response Report September 2018
  publish_date: 2018-09
  project_name: NSW Demand Response Trial
  what_happened: Retrofitting existing residential air conditioners with DREDs under
    Australian Standard AS4755 proved far more complex and time-consuming than anticipated.
    Issues included lack of plug-and-play compliance, non-standardised OEM adapter
    parts across and within brands, incomplete DRM implementation by some OEMs, and
    unclear installation instructions. Installation time per site significantly exceeded
    planning estimates.
  lesson_learnt: Retrofitting DREDs to existing residential air conditioners is not
    commercially viable at scale under current Australian Standards — future programs
    seeking automated AC load control should target new appliances with factory-integrated
    DR capability rather than relying on field retrofitting.
