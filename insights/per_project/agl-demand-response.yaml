  what_happened: The deep learning algorithm used in Year 2 to set individual customer
    DR targets was computationally expensive, required many hours to run for 3,500
    customers, needed localised weather forecast data, and could not scale to the
    8,000-customer Year 3 cohort — it was discontinued and replaced with a simpler
    percentile method.
