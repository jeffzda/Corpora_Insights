  what_happened: Shopping centres in the C&I portfolio contributed a significantly
    negative demand response result (average -3.19MW, worsening to -5.53MW) during
    the 23 January 2020 event due to a combination of baseline methodology problems,
    extended event duration in heatwave conditions, and possible SMS delivery failures.
