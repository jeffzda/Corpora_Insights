  what_happened: Events 2 and 5 of the EV trial were scheduled before 5:00pm; Event
    2 had only one vehicle present and Event 5 had zero vehicles, confirming that
    the charging fleet was not yet home during those windows and making effective
    demand response impossible at those times.
