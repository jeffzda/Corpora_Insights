  what_happened: Customer resistance to hardware installation and SCADA integration
    — primarily due to perceived cybersecurity risk and reluctance to dedicate site
    technical resources — prevented successful deployment of DR monitoring equipment
    at a number of sites, limiting the reach of the monitoring solution.
