- record_id: ARENA-DLV-1104
  source_title: NSW Demand Response Report October 2019
  publish_date: 2019-10
  project_name: AGL NSW Demand Response Project
  what_happened: The deep learning baseline methodology used to set individual targets
    ahead of events introduced additional forecasting error; post-event analysis found
    25% false negatives (customer reduced load but not rewarded) and 41% false positives
    (customer did not reduce but was rewarded) across program events.
  lesson_learnt: Pre-event forecast baselines for individual target-setting introduce
    material measurement error — a post-event anchoring baseline using actual consumption
    data will almost always be more accurate; where real-time feedback requires pre-event
    forecasts, design the reward structure to be tolerant of forecast error or communicate
    the uncertainty to customers.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Post-event portfolio performance analysis was separately performed
    using the more accurate anchoring baseline method from Year 1, allowing programme-level
    results to be validated even where individual customer rewards contained errors.
  transferability: broad
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id004
  - 14
  - 15
  evidence_excerpt: Post event survey results across the program suggested that there
    was a 25% occurrence of false negatives (customer tried to reduce but was not
    rewarded) and 41% of false positives (customer did nothing but was rewarded anyway).
