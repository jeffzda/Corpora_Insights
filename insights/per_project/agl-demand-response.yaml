  what_happened: Simultaneous restart of deferred EV charging at the end of DR events
    created a coincident demand peak at the local network and system level, observed
    during the trial.
  lesson_learnt: EV DR programs must implement staggered or managed charge resumption
    strategies after event end — releasing all deferred EV charging simultaneously
    creates a new coincident demand peak that could offset the DR benefit, particularly
    at scale.
