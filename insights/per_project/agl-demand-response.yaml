  source_title: AGL NSW Demand Response Final Report
  publish_date: 2021-05
  project_name: AGL NSW Demand Response Project
  what_happened: RERT events consistently occur in the 4:30pm–7:30pm window, which
    disqualifies single-shift industrial loads, most office and commercial buildings,
    and shopping centres on non-late-night trading days — these loads significantly
    reduce or cease operation during this period.
  lesson_learnt: Aggregators building C&I DR portfolios for RERT should pre-screen
    loads for operational hours matching the 4:30pm–7:30pm event window — single-shift
    industrial, standard office and non-late-trading retail loads are structurally
    unsuitable and will underperform or be unavailable during actual events.
