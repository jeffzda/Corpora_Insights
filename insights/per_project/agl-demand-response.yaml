- record_id: ARENA-DLV-30470
  source_title: NSW Demand Response Report September 2018
  publish_date: 2018-09
  project_name: NSW Demand Response Trial
  what_happened: The AEMO baseline calculation methodology was found to systematically
    undervalue DR contributions from temperature-sensitive loads and intermittent
    or fluctuating loads, disadvantaging these participants relative to flat, constant
    loads despite their genuine and valuable DR contribution.
  lesson_learnt: The AEMO SN RERT baseline methodology is not fit for purpose for
    temperature-sensitive or intermittent loads — aggregators building DR portfolios
    with these load types should engage AEMO early to flag baseline limitations and
    provide supporting data, and should not assume payment will reflect actual DR
    contribution from variable loads.
