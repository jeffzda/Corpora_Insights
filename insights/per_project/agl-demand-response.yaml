  what_happened: The top 20% of participants delivered 80% of demand reduction in
    the behavioural program; 30% of participants who indicated they would participate
    either did not reduce load or increased consumption, suggesting a highly skewed
    contribution distribution.
  lesson_learnt: Residential behavioural DR portfolios exhibit a highly concentrated
    performance distribution — the top quintile delivers the majority of reduction;
    portfolio sizing and reliability assessments should weight heavily-performing
    participants and discount the long tail, rather than applying uniform per-customer
    reduction assumptions.
