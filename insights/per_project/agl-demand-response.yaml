- record_id: ARENA-DLV-1106
  source_title: NSW Demand Response Report October 2019
  publish_date: 2019-10
  project_name: AGL NSW Demand Response Project
  what_happened: In-event customer engagement with the monitoring portal declined
    over the summer program, with only 20–40% of event participants accessing it;
    while participants who did engage showed higher DR performance, it was unclear
    whether portal use caused better performance or simply reflected a more engaged
    customer cohort.
  lesson_learnt: Real-time feedback portals should not be assumed to drive incremental
    DR performance — engagement drops over time and the performance uplift seen among
    portal users may reflect selection bias rather than a causal effect; pilot designs
    should include a randomised holdout to isolate the portal's impact.
