- record_id: ARENA-DLV-30451
  source_title: NSW Demand Response Report September 2018
  publish_date: 2018-09
  project_name: NSW Demand Response Trial
  what_happened: The behavioural demand response (Peak Energy Rewards) program recruited
    750 residential customers and successfully ran four Peak Events from January to
    April 2018, achieving an average aggregate demand response of up to 0.67 MW. The
    program demonstrated that extreme temperature days (39°C) produced almost double
    the demand reduction of moderately hot days (32–33°C) with similar participation
    rates.
  lesson_learnt: Behavioural demand response from residential customers is meaningful
    but highly temperature-sensitive — a portfolio relying on behavioural DR should
    expect near-zero contribution during mild conditions and should not size commitments
    based solely on peak-summer performance data.
