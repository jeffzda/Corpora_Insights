  what_happened: The EV Managed For You program successfully demonstrated remote charge
    curtailment in a single event on 24 July 2018. Seven of 14 participants (50%)
    had their charging deferred, delivering a 30 kW load reduction. EV owners showed
    83% primary motivation of grid impact management, 100% comfort with charging being
    managed, and 100% willingness to recommend the program.
  lesson_learnt: EV home charging is a large, deferrable, and owner-accepted DR resource
    — future DR programs should prioritise EV charging management as a high-value,
    low-customer-friction load, while ensuring the app or control interface is reliable
