  what_happened: Post-event data collection for non-AGL retail C&I customers was a
    significant manual burden. Metering data arrived in multiple incompatible formats
    from different meter data providers (MDPs); some MDPs refused to provide data
    for DR programs at all; and acquiring data even with signed customer authorities
    required substantial time and resources.
  lesson_learnt: C&I DR programs involving non-retail customers must plan for significant
    data acquisition burden — proponents should negotiate data access agreements with
    MDPs before contracting customers, and design data ingestion pipelines that can
    handle heterogeneous formats from the outset rather than relying on manual processes.
