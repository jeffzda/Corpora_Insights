  what_happened: The trial cohort was unintentionally skewed towards progressive energy
    users; approximately 50% already had solar PV installed. This occurred because
    smart meter eligibility requirements naturally selected for solar owners who require
    smart meters for feed-in tariff access.
  lesson_learnt: Smart-meter eligibility criteria for DR trials will disproportionately
    recruit solar-owning, energy-engaged customers — trial results should be interpreted
    with caution as they will not reflect the broader residential population; future
    recruitment should consider stratified sampling to ensure representativeness.
