- record_id: ARENA-DLV-1124
  source_title: NSW Demand Response Report October 2019
  publish_date: 2019-10
  project_name: AGL NSW Demand Response Project
  what_happened: RERT event timing is concentrated in the 4:00pm–8:00pm window, which
    excluded a large proportion of prospective C&I loads that operate only on business
    hours, single industrial shifts, or shopping hours; this materially limited the
    addressable C&I market for the NSW RERT program.
  lesson_learnt: When building a C&I DR portfolio for RERT or evening-peak services,
    screen out sites that cannot demonstrate load availability after 4:00pm — single-shift,
    business-hours, and standard retail operations are structurally unavailable for
    the highest-probability event window and inflate apparent portfolio size without
    contributing to reliable capacity.
