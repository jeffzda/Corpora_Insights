- record_id: ARENA-DLV-1107
  source_title: NSW Demand Response Report October 2019
  publish_date: 2019-10
  project_name: AGL NSW Demand Response Project
  what_happened: Load reduction in the residential behavioural program was strongly
    correlated with ambient temperature; the result on a 40°C day was more than three
    times that on a 26°C day, and participation rates fell from 63% to 54% across
    the summer, contributing to lower total load reduction toward the end of the program.
  lesson_learnt: Residential behavioural DR portfolios are heavily weather-dependent
    — forecast available capacity using temperature-adjusted participation models,
    and do not rely on declared program size as a reliable indicator of actual dispatchable
    capacity on mild days.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: partial success
  secondary_failure_mode: poor scoping
  intervention_note: null
  transferability: broad
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id007
  - 11
  evidence_excerpt: There is a strong correlation between load reduction and temperature.
    The result for Event 2 (40° day) is more than three times the result for Event
    5 (26° day). This, together with the 3:00pm – 5:00pm timing of those events (when
    cooking loads are unlikely), suggests that the majority of the load being reduced
    on hot days is air conditioning.
