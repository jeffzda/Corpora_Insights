  what_happened: On-site installation of dedicated DR monitoring hardware at C&I sites
    was frequently resource-intensive, time-consuming, and uneconomic for smaller
    sites; customer cybersecurity concerns and reluctance to provide technical staff
    assistance further complicated installations.
