- record_id: ARENA-DLV-69282
  source_title: AGL NSW Demand Response Final Report
  publish_date: 2021-05
  project_name: AGL NSW Demand Response Project
  what_happened: During the 23 January 2020 RERT event, AEMO experienced a technical
    configuration problem that prevented AGL from initially receiving the event extension
    message — the issue was resolved through direct phone communication between AEMO
    and AGL.
  lesson_learnt: RERT dispatch systems should include redundant out-of-band communication
    channels (e.g. direct phone escalation protocols) as a backup for platform-based
    messaging — configuration failures in the market operator's platform can prevent
    timely receipt of event instructions during precisely the high-stress conditions
    when resilience matters most.
