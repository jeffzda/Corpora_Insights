  source_title: NSW Demand Response Report October 2019
  publish_date: 2019-10
  project_name: AGL NSW Demand Response Project
  what_happened: The deep learning algorithm used to generate individual load forecasts
    and targets for the residential behavioural program required substantial computing
    power and significant manual analyst effort, requiring the event countdown to
    begin 48 hours in advance, constraining the number of events that could be called
    and the responsiveness of the program.
  lesson_learnt: Automate and reduce the manual processing burden of pre-event forecasting
    before scaling a real-time behavioural DR program — a 48-hour lead time requirement
    driven by manual computing steps limits event frequency and responsiveness; this
    is a scalability constraint that must be resolved before commercial deployment.
