  source_title: NSW Demand Response Report September 2018
  publish_date: 2018-09
  project_name: NSW Demand Response Trial
  what_happened: Recruiting residential customers to the Managed For You (device control)
    program proved significantly harder than recruiting to the behavioural program,
    despite the Managed For You program offering a $300 upfront incentive compared
    to $50 for the behavioural program. Customers were reluctant to cede control of
    their devices.
  lesson_learnt: Financial incentives alone do not overcome customer reluctance to
    surrender device control in automated DR programs — the loss of autonomy is a
    primary barrier that must be addressed through program design (e.g., opt-out mechanisms,
    transparent control rules) rather than simply increasing the incentive value.
