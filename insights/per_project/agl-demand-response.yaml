  source_title: NSW Demand Response Report September 2018
  publish_date: 2018-09
  project_name: NSW Demand Response Trial
  what_happened: Most C&I organisations contacted had not previously participated
    in a DR program, though almost all were aware of it. Continued education was identified
    as necessary to grow the pool of future DR providers, with some participants motivated
    by ARENA program association and community benefit rather than purely financial
    incentives.
  lesson_learnt: C&I DR market development requires ongoing education and awareness
    programs alongside financial incentives — awareness of DR does not translate automatically
    to participation willingness, and program association with credible institutions
    (e.g., ARENA, government) can be a meaningful differentiator in recruiting non-commercially
    motivated participants such as government-owned bodies.
