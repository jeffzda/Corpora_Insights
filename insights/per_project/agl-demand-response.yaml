  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: AGL developed an in-house anchoring baseline that averaged temperature-adjusted
    usage over five weeks; this outperformed the AEMO RERT formula for residential
    loads but still produced false positives and negatives.
