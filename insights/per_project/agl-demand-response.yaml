  project_name: AGL NSW Demand Response Project
  what_happened: The EV controlled charging trial successfully deferred or curtailed
    charging load across five events with no customer opt-outs, delivering average
    reductions of up to 3.6 kW per vehicle; customer satisfaction ranged from 90–100%
    and all survey respondents said they would recommend the program.
  lesson_learnt: Residential EV charging is a high-quality DR resource — load deferral
    is highly controllable, invisible to customers when the event window is correctly
    timed (after expected return-home time), and generates very high customer satisfaction;
