  source_title: AGL NSW Demand Response Final Report
  publish_date: 2021-05
  project_name: AGL NSW Demand Response Project
  what_happened: Air conditioners in the DRED trial frequently executed commands incorrectly
    — units commanded to 75% consumption mode instead dropped to 0% or 50%, customer
    comfort was compromised in some cases, and no feedback mechanism existed to confirm
    command execution. A rebound demand spike occurred at event end as air conditioners
    ramped back up.
  lesson_learnt: AS4755-compliant air conditioners do not reliably execute DR control
    commands, provide no feedback confirming command execution, and create post-event
    rebound peaks — do not rely on this standard for demand response; use platforms
    with two-way communication and status confirmation instead.
