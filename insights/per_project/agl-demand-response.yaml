- record_id: ARENA-DLV-1102
  source_title: NSW Demand Response Report October 2019
  publish_date: 2019-10
  project_name: AGL NSW Demand Response Project
  what_happened: Low smart meter penetration in NSW was identified as a fundamental
    barrier to scaling residential behavioural demand response; the program was constrained
    to customers who already had, or could receive, a smart meter, limiting the addressable
    population.
  lesson_learnt: Residential behavioural DR programs are fundamentally constrained
    by smart meter penetration — program designers should assess the metered customer
    base in the target region before committing to scale targets, as low penetration
    will cap program size and increase per-participant recruitment cost.
