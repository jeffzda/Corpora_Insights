- record_id: ARENA-DLV-69265
  source_title: AGL NSW Demand Response Final Report
  publish_date: 2021-05
  project_name: AGL NSW Demand Response Project
  what_happened: The AEMO RERT baseline formula systematically under-measured demand
    response from air-conditioning and intermittent industrial loads — the 10-day
    averaging discounted high AC loads on peak days, and the same-day adjustment factor
    was calculated too early to capture peak AC operation, resulting in DR being under-credited.
  lesson_learnt: Aggregators should conduct a detailed baseline compatibility review
    for each prospective C&I participant before contracting — loads that are temperature-sensitive
    (e.g. HVAC-heavy sites) or intermittent will be systematically under-credited
    under the AEMO RERT baseline, making them poor portfolio choices unless the Wholesale
    DR Mechanism's multi-baseline provisions can be used.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: policy/market influence only
  secondary_failure_mode: data & measurement
  intervention_note: AGL modified its C&I recruitment process to include a detailed
    baseline review prior to sign-up. AGL also provided research and data to AEMO
    and ARENA which contributed to the multi-baseline provisions in the NEM Wholesale
    Demand Response Mechanism.
  transferability: moderate
  delay_magnitude: null
  technology_domain: demand response
  source_pages: &id077
  - 68
  - 69
  evidence_excerpt: The AEMO baseline works well for flat and/or highly predictable
    loads, but discounts DR sourced from temperature sensitive loads and intermittent
    or fluctuating loads... AGL altered its approach to recruiting customers to include
    a detailed baseline review prior to sign-up to ensure that the customer load profile
    was compatible with the AEMO baseline.
