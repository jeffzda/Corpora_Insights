  what_happened: Monetary incentives for the behavioural DR program were modest (average
    $12 per customer across four events) and many participants regarded them as insignificant,
    yet overall program satisfaction remained high (85%) and 90% said they would recommend
    the program. Customers were primarily motivated by community benefit and energy
    awareness rather than financial reward.
  lesson_learnt: Residential behavioural DR programs do not need large financial incentives
    to sustain participation — community benefit and environmental motivations can
    carry the program, though the reward structure must still be perceived as fair
    and transparent or it risks disengagement.
