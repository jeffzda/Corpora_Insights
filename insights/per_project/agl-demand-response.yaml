  source_title: NSW Demand Response Report October 2019
  publish_date: 2019-10
  project_name: AGL NSW Demand Response Project
  what_happened: The C&I DR portfolio underperformed its 17 MW target in the November
    2018 AEMO test, delivering only 12.4 MW, due to a combination of a major water
    utility site being offline for unscheduled maintenance, an intermittent industrial
    load baselining poorly, a site withdrawing to meet customer orders, weather-sensitive
    loads underperforming on a mild day, and a rural water utility affected by water
    restrictions.
  lesson_learnt: C&I DR portfolios require approximately 30% over-subscription relative
    to target capacity to reliably meet dispatch commitments — individual site unavailability
    for maintenance, commercial, weather, or operational reasons is routine and will
    regularly cause shortfalls in an exactly-subscribed portfolio.
