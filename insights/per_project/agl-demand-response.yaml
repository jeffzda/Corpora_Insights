- record_id: ARENA-DLV-1111
  source_title: NSW Demand Response Report October 2019
  publish_date: 2019-10
  project_name: AGL NSW Demand Response Project
  what_happened: AS4755 provides no local override or opt-out capability at the air
    conditioner unit itself; customers who wished to opt out of an event after it
    had started were required to telephone the electricity company, which AGL identified
    as a significant customer experience shortcoming and an operational bottleneck.
  lesson_learnt: Any controlled load DR program involving direct appliance control
    must include a simple local override capability at the appliance — the absence
    of this in AS4755 is a fundamental design flaw that creates customer dissatisfaction
    and operational burden; this requirement should be a non-negotiable specification
    criterion when selecting control technology.
