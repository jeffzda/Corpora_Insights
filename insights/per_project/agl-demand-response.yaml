  what_happened: Installing hardware-based DR monitoring equipment on C&I sites encountered
    widespread resistance from customers (cybersecurity concerns, reluctance to provide
    technical resources) and was uneconomic for smaller or geographically dispersed
    sites; the hardware solution was discontinued in Year 3.
  lesson_learnt: Dedicated DR monitoring hardware is not viable for most C&I sites
    — aggregators should instead use near-real-time meter data APIs from Meter Data
    Providers, which leverage existing market metering infrastructure, are significantly
    cheaper, and require no intrusive on-site installation work beyond the meter panel.
