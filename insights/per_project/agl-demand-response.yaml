  source_title: NSW Demand Response Report October 2019
  publish_date: 2019-10
  project_name: AGL NSW Demand Response Project
  what_happened: C&I DR recruitment in Year 2 became increasingly difficult as the
    pool of suitable NSW loads diminished; multiple competing ARENA-sponsored programs,
    retailer curtailment agreements, and FCAS aggregators had already contracted most
    of the accessible C&I load, and many remaining sites were excluded by incompatible
    operating hours or AEMO baseline issues.
  lesson_learnt: In concentrated regional markets, multiple concurrent DR programs
    will rapidly exhaust the available pool of suitable C&I loads — program designers
    and funders should assess market saturation before setting portfolio targets,
    and expect recruitment success rates to fall sharply in the second year of operation.
