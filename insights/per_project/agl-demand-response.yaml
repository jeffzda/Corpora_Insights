- record_id: ARENA-DLV-30457
  source_title: NSW Demand Response Report September 2018
  publish_date: 2018-09
  project_name: NSW Demand Response Trial
  what_happened: AGL's residential baseline methodology produced both false positives
    (detecting reductions where none occurred) and false negatives (missing genuine
    reductions, including customers who left the house early to avoid the event).
    A variable temperature-adjusted baseline also introduced complexity that confused
    some customers about the link between their actions and their financial reward.
  lesson_learnt: Variable, temperature-adjusted baseline methodologies for residential
    DR improve accuracy for solar and non-solar households but introduce customer
    confusion — any DR program using such baselines should invest in clear, simplified
    reward communication so customers understand why rewards vary between events.
  issue_severity: minor
