  source_title: NSW Demand Response Report November 2020
  publish_date: 2020-11
  project_name: AGL NSW Demand Response Project
  what_happened: During the January 2020 bushfire crisis, multiple C&I demand response
    participants were operating in emergency response mode and could not participate
    in RERT activations. AGL reduced its declared availability from 20MW to 12MW before
    the 23 January event, and the actual demand response delivered (average 4.38MW)
    was well below even the reduced declaration.
  lesson_learnt: Demand response portfolios that include critical infrastructure loads
    such as water utilities and telecommunications providers carry a material risk
    of underperformance during regional emergencies — portfolio designers should stress-test
    availability assumptions against emergency scenarios and avoid over-reliance on
    these participant types for firm capacity commitments.
