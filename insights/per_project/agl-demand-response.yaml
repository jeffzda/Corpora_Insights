    were not always the same person, meaning event notifications did not always reach
    the person responsible for reducing consumption.'
  lesson_learnt: DR program communication design must explicitly capture and separately
    record the mobile contact for the person responsible for load reduction — it cannot
    be assumed that the account holder and the active program participant share the
    same contact details.
