  source_title: AGL NSW Demand Response Final Report
  publish_date: 2021-05
  project_name: AGL NSW Demand Response Project
  what_happened: Participant performance in the C&I portfolio was more consistent
    and reliable at sites with low staff turnover and well-practised DR procedures;
    new site personnel frequently did not know how to respond to dispatch instructions,
    and in some cases site contact details had changed without AGL being notified.
  lesson_learnt: C&I DR aggregators should institutionalise training protocols for
    participant site personnel as a standard contract requirement — new staff at participant
    sites should be trained in DR procedures upon appointment, contact lists should
    be reviewed and updated at least semi-annually, and retraining should be triggered
    by any personnel change in the DR coordinator role.
