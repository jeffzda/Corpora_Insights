- record_id: ARENA-DLV-1101
  source_title: NSW Demand Response Report October 2019
  publish_date: 2019-10
  project_name: AGL NSW Demand Response Project
  what_happened: Smart meter installation for the residential behavioural DR program
    had an 800-installation failure rate (35%) out of 2,300 planned installations,
    primarily due to access problems at apartments and multi-unit dwellings, reducing
    the final participant cohort from a target of ~4,300 to just over 3,500.
  lesson_learnt: Plan for high failure rates in smart meter installation campaigns
    targeting multi-unit dwellings — access problems at apartments caused a 35% failure
    rate; pre-screen the address mix and build contingency into recruitment targets
    accordingly.
  issue_severity: moderate
  project_type: DER/customer-side
