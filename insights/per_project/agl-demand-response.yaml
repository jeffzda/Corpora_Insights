  what_happened: A water utility participant that was off-line for maintenance during
    the November 2018 AEMO test did not communicate its maintenance outage to AGL
    prior to the test being scheduled, contributing to a portfolio shortfall of 12.4MW
    against a target of 17MW.
  lesson_learnt: C&I DR aggregators must establish mandatory outage notification protocols
    with all portfolio participants — planned maintenance that reduces DR capability
    should be communicated to the aggregator in advance so that availability declarations
    to AEMO can be adjusted and alternative cover arranged before a test or dispatch.
