- record_id: ARENA-DLV-30468
  source_title: NSW Demand Response Report September 2018
  publish_date: 2018-09
  project_name: NSW Demand Response Trial
  what_happened: 'Deployment of DR monitoring hardware at C&I sites encountered multiple
    barriers: cybersecurity concerns from customers, unwillingness to provide technical
    staff for installation, impracticality of installing hardware across geographically
    dispersed multi-site operations, and hardware costs exceeding the value delivered
    by smaller sites. As a result, many sites operated without installed hardware.'
  lesson_learnt: C&I DR hardware deployment faces systematic barriers beyond technical
    complexity — cybersecurity concerns and customer unwillingness to dedicate internal
    technical resources are primary blockers; program design should default to non-invasive,
    software-based monitoring approaches wherever possible and reserve hardware installation
    for high-value sites where the economics are favourable.
