  source_title: NSW Demand Response Report September 2018
  publish_date: 2018-09
  project_name: NSW Demand Response Trial
  what_happened: Deferring EV charging to the end of a DR event caused all deferred
    charging to commence simultaneously, creating a coincident load spike that had
    the potential to be larger than the original peak the DR event was designed to
    manage.
  lesson_learnt: EV DR programs that defer rather than curtail charging must implement
    staggered recharging strategies — simultaneous recommencement at event end creates
    a rebound peak that can exceed the original load, negating the grid benefit of
    the event.
