  source_title: NSW Demand Response Report September 2018
  publish_date: 2018-09
  project_name: NSW Demand Response Trial
  what_happened: Industrial customers that participate in DR by suspending production
    were assessed as having a high degree of unreliability, as the cost of non-production
    during a DR event (including reputational and customer loss risk) typically far
    exceeds DR dispatch payments.
  lesson_learnt: Industrial production-suspension DR should be treated as low-reliability
    capacity in portfolio planning — the commercial cost of non-production to industrial
    businesses will frequently override DR participation regardless of dispatch payment
    levels, and portfolios relying on such participants should carry significant reliability
    haircuts.
