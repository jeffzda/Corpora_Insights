  source_title: NSW Demand Response Report September 2018
  publish_date: 2018-09
  project_name: NSW Demand Response Trial
  what_happened: The June 2018 AEMO test revealed a fourfold reduction in shopping
    centre portfolio DR performance compared to the February test, caused by cool
    weather reducing HVAC load and by the test timing coinciding with centre closing
    hours when HVAC systems were naturally winding down, compressing the measurable
    curtailment window.
  lesson_learnt: Shopping centre and HVAC-dominated DR portfolios carry significant
    seasonal and time-of-day performance risk — a 20 MW summer portfolio may deliver
    near zero in winter or late-afternoon test windows; aggregators must plan distinct
    summer and winter portfolios and avoid scheduling tests or dispatches when HVAC
    loads are naturally declining.
