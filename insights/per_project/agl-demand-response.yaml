  project_name: AGL NSW Demand Response Project
  what_happened: Multiple below-target C&I portfolio test results occurred over the
    program due to individual participant under-performance or withdrawal; the portfolio
    as contracted did not consistently meet the declared availability without a buffer.
  lesson_learnt: C&I DR portfolios require approximately 30% over-contracting relative
    to declared availability to reliably meet performance targets under all conditions
    — alternatively, size the portfolio so that loss of the largest one or two participants
    is covered by the remaining contracted capacity.
