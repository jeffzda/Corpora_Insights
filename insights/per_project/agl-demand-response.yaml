- record_id: ARENA-DLV-69252
  source_title: AGL NSW Demand Response Final Report
  publish_date: 2021-05
  project_name: AGL NSW Demand Response Project
  what_happened: Baseline measurement of residential demand response produced false
    positives (customers rewarded for non-action) and false negatives (customers not
    rewarded despite genuine action), causing customer dissatisfaction and undermining
    program integrity.
  lesson_learnt: Residential DR baseline methodologies are inherently imprecise and
    produce variable rewards for the same behaviour across events — programs should
    educate customers about this variability upfront and design incentive structures
    that are tolerant of baseline error, such as fixed-payment targets rather than
    per-kWh payments.
