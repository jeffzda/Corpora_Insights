- record_id: ARENA-DLV-1758
  source_title: NSW Demand Response Report November 2020
  publish_date: 2020-11
  project_name: AGL NSW Demand Response Project
  what_happened: AEMO's RERT baseline methodology systematically under-measured demand
    response from shopping centres with variable weekday closing times. A Thursday
    evening event was baselined against earlier-closing Monday–Wednesday days, causing
    the shopping centre contribution to appear negative even when load was genuinely
    shed.
  lesson_learnt: AEMO's RERT baseline calculation does not adequately account for
    day-of-week variation in commercial operating patterns; aggregators should proactively
    identify sites with structural baseline mismatches before enrolling them in portfolios
    and either exclude such sites from evening/weekend events or seek baseline methodology
    adjustments from AEMO.
