  source_title: NSW Demand Response Report September 2018
  publish_date: 2018-09
  project_name: NSW Demand Response Trial
  what_happened: The second AEMO test (28 March 2018) achieved only 15.39 MW against
    a declared availability of 17 MW, approximately 2 MW short of target. The primary
    cause was a water utility that over-performed in the first test but underperformed
    in the second, and an industrial customer that withdrew at pre-notice due to a
    production backlog.
  lesson_learnt: C&I DR portfolio declarations should not be based on a single test
    or peak performance — water utility loads can vary by ±30% depending on operational
    processes on the day, and industrial customers face production pressures that
    will cause event withdrawal; portfolio managers must apply conservative performance
    factors and maintain headroom above declared availability.
