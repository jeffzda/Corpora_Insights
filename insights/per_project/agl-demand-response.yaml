  what_happened: Low smart meter penetration in NSW (~15%) and a high failure rate
    of meter installations (35% of attempted installs failed, predominantly due to
    access problems in apartments and multi-unit dwellings) constrained the scalability
    of the residential DR program.
  lesson_learnt: Smart meter penetration is the binding constraint on residential
    DR scale in NSW — program designers should assess smart meter coverage in target
    geographies before committing to participant targets, and budget for significant
    installation failure rates (up to 35%) in areas with multi-unit dwellings. Victoria,
    with near-100% penetration, is currently the only state where large-scale rollout
    is feasible without field replacements.
