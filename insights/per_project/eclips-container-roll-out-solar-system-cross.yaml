  evidence_excerpt: The performance of batteries, particularly Lithium Ion, seriously
    degrade in high operating temperatures, and safety limits on charging systems
    often prevent charging once the batteries reach a certain operating temperature.
    When installed inside a shipping container, these operating temperature limits
    can be reached very quickly, even with modified ventilation. Active air conditioning
    is often the only way to adequately manage this.
