  what_happened: The Australian Standard AS/NZS1170.2:2011 was found to lack sufficient
    clarity regarding requirements for ground-mounted PV arrays, requiring ECLIPS
    to engage an independent structural engineering company to validate design calculations
    and provide structural certification for wind regions A–D.
  lesson_learnt: Do not rely solely on AS/NZS1170.2:2011 for wind load design of ground-mount
    PV arrays — the standard lacks specific guidance for this application, so engage
    an independent structural engineer early to validate wind action calculations
    and provide certification, particularly for projects in higher wind regions.
