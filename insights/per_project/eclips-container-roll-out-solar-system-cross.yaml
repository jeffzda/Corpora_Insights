- record_id: ARENA-DLV-33809
  source_title: Container Roll Out Solar System - CROSS Project Final Report
  publish_date: 2018-05
  project_name: Container Roll-Out Solar System (CROSS)
  what_happened: When designing the CROSS for relocation, ECLIPS identified that containerised
    BoC components — including batteries installed in shipping containers — often
    cannot be relocated without disassembling fitted components, particularly batteries,
    even when marketed as container-based solutions. Active air-conditioning was found
    to be the only reliable way to manage lithium-ion battery operating temperatures
    inside shipping containers.
  lesson_learnt: Do not assume a BoC solution is relocatable simply because it is
    fitted in a shipping container — verify that internal loads are adequately restrained
    per National Load Restraint Guidelines, that active temperature management is
    in place for lithium-ion batteries, and that manufacturer warranties survive relocation
    before integrating any BoC into a mobile hybrid system.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: manufacturer/OEM
