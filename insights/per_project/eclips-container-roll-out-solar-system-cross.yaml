- record_id: ARENA-DLV-33804
  source_title: Container Roll Out Solar System - CROSS Project Final Report
  publish_date: 2018-05
  project_name: Container Roll-Out Solar System (CROSS)
  what_happened: Partner companies supplying Balance of Circuit (BoC) components —
    particularly batteries — were unable to relocate their container-based solutions
    as readily as the CROSS itself, because batteries generally need to be uninstalled
    from racks before the containers can be transported. This undermined the end-to-end
    relocatability of the hybrid power system.
  lesson_learnt: When designing a relocatable solar or hybrid power system, verify
    that all BoC and ESS partner solutions share the same mobility characteristics
    as the generation equipment — a supply chain is only as relocatable as its least-mobile
    component, and this must be a partner selection criterion from the outset.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: manufacturer/OEM
  delay_category: null
  failure_mode: unvalidated integration
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Recommendation issued that partner companies modify BoC/ESS solutions
    to enable transportation without removing and repackaging batteries before containers
    are moved.
  transferability: moderate
  delay_magnitude: null
  technology_domain: hybrid systems
  source_pages: &id004
  - 26
  evidence_excerpt: Although the CROSS can be rapidly deployed and relocated, ECLIPS's
    partner companies and suppliers of Balance of Circuit (BoC) components, such as
    batteries, may not be as easy to relocate in their existing container solutions.
