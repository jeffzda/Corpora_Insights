- record_id: ARENA-DLV-33813
  source_title: Container Roll Out Solar System - CROSS Project Final Report
  publish_date: 2018-05
  project_name: Container Roll-Out Solar System (CROSS)
  what_happened: ECLIPS developed a lower-cost CROSS variant without integrated torsion
    springs to address market demand from customers who require logistics and surface-mount
    benefits but do not need frequent relocation. This variant requires external MHE
    to raise and lower arrays but retains the core logistics performance.
  lesson_learnt: Develop tiered product variants — a full-featured version for high-mobility
    customers and a lower-cost version with reduced functionality for customers whose
    primary need is surface-mounting without ground penetration — to avoid pricing
    out segments of the addressable market that don't need the full specification.
  issue_severity: minor
