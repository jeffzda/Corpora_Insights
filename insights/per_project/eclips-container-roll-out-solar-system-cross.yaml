- record_id: ARENA-DLV-33812
  source_title: Container Roll Out Solar System - CROSS Project Final Report
  publish_date: 2018-05
  project_name: Container Roll-Out Solar System (CROSS)
  what_happened: ECLIPS used a metrics-based formal scoring process — weighting criteria
    by criticality and scoring variants across technical, management, and sales staff
    — to select between competing design variants. This approach gave company owners
    confidence in the investment decision to pivot from CROWS-PV to CROSS.
  lesson_learnt: Use a formal weighted-scoring decision tool when selecting between
    competing design variants in a DDT&E project — involving technical, management
    and sales perspectives in the scoring process builds internal alignment and gives
    leadership confidence in design investment decisions, particularly when pivoting
    away from an originally preferred concept.
