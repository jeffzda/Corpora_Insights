- record_id: ARENA-DLV-33806
  source_title: Container Roll Out Solar System - CROSS Project Final Report
  publish_date: 2018-05
  project_name: Container Roll-Out Solar System (CROSS)
  what_happened: Some customers compared CROSS against traditional fixed-array solutions
    on purchase price per watt (a capital expense) and ignored relocation costs (an
    operating expense), leading them to select traditional systems even in cases where
    CROSS offered a lower LCOE over the project life.
  lesson_learnt: When selling relocatable solar solutions, present a full LCOE analysis
    that explicitly incorporates multiple moves and compares total life-cycle cost
    — customers who evaluate only capital cost per watt will systematically undervalue
    relocatability and select lower-capex fixed alternatives even when total cost
    of ownership favours the relocatable product.
  issue_severity: minor
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: manufacturer/OEM
  delay_category: null
  failure_mode: commercial & market
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: ECLIPS identified the need to better communicate the business
    case for relocatable solutions to clients, including LCOE analysis that incorporates
    multiple moves.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id006
