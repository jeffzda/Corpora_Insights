  evidence_excerpt: Many of the projects ECLIPS has submitted proposals and quotes
    for do not have requirements for frequent relocation of the arrays... ECLIPS have
    developed a basic CROSS design for a lower cost that retains the logistics performance
    characteristics. One difference in the low-cost CROSS version is that the torsion
    springs that provide integrated mechanical assistance for raising and lowering
