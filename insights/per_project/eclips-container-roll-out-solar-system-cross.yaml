  what_happened: ECLIPS engaged an independent Chinese engineering consultancy to
    perform quality inspections during all fabrication stages in China, including
    materials sampling, weld inspection and functional performance checks. This approach,
    combined with on-site attendance by ECLIPS engineers, produced quality outcomes
    and managed fabrication costs effectively.
