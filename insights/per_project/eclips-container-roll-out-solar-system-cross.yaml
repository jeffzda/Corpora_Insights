  source_title: Container Roll Out Solar System - CROSS Project Final Report
  publish_date: 2018-05
  project_name: Container Roll-Out Solar System (CROSS)
  what_happened: ECLIPS took a passive approach to CROSS sales before the Demonstration
    Day — the product was not advertised on the website and no active sales effort
    was made — because customers were reluctant to purchase a product not yet built
    or tested. After the successful public demonstration on 12 April 2018, enquiry
    volume and quote requests increased significantly.
  lesson_learnt: For novel hardware products, delay active sales and marketing until
    a physical prototype has been publicly demonstrated — customer reluctance to engage
    with unbuilt products means pre-demonstration sales effort yields little return,
    while a live demonstration rapidly generates credible commercial interest.
