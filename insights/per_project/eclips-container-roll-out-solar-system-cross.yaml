- record_id: ARENA-DLV-33805
  source_title: Container Roll Out Solar System - CROSS Project Final Report
  publish_date: 2018-05
  project_name: Container Roll-Out Solar System (CROSS)
  what_happened: Customer requests to integrate ESS/BoC components directly into the
    CROSS or onto a skid below it were found to be cost-prohibitive for small quantities.
    Commercial-off-the-shelf (COTS) ESS containers were assessed as more cost-effective
    and scalable, provided they shared equivalent mobility characteristics with the
    CROSS.
  lesson_learnt: Resist custom integration of ESS/BoC into a relocatable solar platform
    for small-volume deployments — COTS ESS containers are more cost-effective and
    scalable; focus instead on ensuring the chosen COTS ESS can be relocated without
    major battery repackaging.
  issue_severity: minor
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: manufacturer/OEM
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: ECLIPS concluded that an enclosed ESS container with air-conditioning
    remains the most cost-effective and scalable BoC solution, assuming ESS containers
    can be relocated without major battery repackaging.
  transferability: moderate
  delay_magnitude: null
  technology_domain: hybrid systems
