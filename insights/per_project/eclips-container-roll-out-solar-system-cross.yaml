  what_happened: 55% of all CROSS enquiries requested full turn-key solutions including
    installation and commissioning, and most post-Demonstration Day enquiries came
    from project integrators wanting to buy product rather than power. ECLIPS's primary
    operating model of selling or leasing product to power providers did not fully
    match the dominant customer requirement for a single point of contact for technical
    and contractual delivery.
  lesson_learnt: Hardware manufacturers entering the energy sector should develop
    or partner to offer full turn-key technical solutions — the majority of remote
    power customers require a single contractual and technical point of contact regardless
    of project size, and an equipment-only offering will limit addressable market.
