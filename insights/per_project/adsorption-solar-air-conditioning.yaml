  publish_date: null
  project_name: Adsorption Solar Air Conditioning
  what_happened: Ergon Energy trialled solar-assisted space cooling via Zeolite-based
    adsorption chillers at a site in Blackall, Queensland. Analysis showed the technology
    was not economical and not suitable for remote and regional locations at the current
    stage of development, despite demonstrating reduced kVA and kWh load.
  lesson_learnt: Adsorption solar cooling technology was found to be uneconomical
    for remote and regional Australian locations at current cost levels — project
    developers should not rely on this technology for demand reduction business cases
    until cost reductions are demonstrated.
