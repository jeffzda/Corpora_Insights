  what_happened: The apartment building customer segment proved highly challenging,
    with only two apartment buildings in the City of Sydney area progressing to solar
    installation by end of program. Key barriers included the need for Owners Corporation
    decisions, special body corporate levies, strata approval processes, and the complexity
