  delay_category: null
  failure_mode: no major failure stated
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: Ausgrid expanded the number of market providers in Canterbury-Bankstown
    from two to five during the program, doubling the program area and increasing
    competition, which correlated with increased sales activity.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id007
  - 75
  evidence_excerpt: The competition introduced in the Canterbury-Bankstown program
    area with multiple market providers appeared to deliver better results than the
    single provider area. However, given the challenging nature of the City of Sydney
    area for installing rooftop solar it is unknown whether this was more an outcome
    of the area rather than the approach. Nevertheless, a multiple provider solution
