  what_happened: Contract negotiations with project funding partners and market providers
    took far longer than expected. The first market provider contract was executed
    in December 2018, approximately six months after the originally planned July 2018
    execution date, with contracts for the remaining four initial market providers
    executed in the first half of calendar year 2019.
