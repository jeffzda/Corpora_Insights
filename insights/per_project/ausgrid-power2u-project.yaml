- record_id: ARENA-DLV-41356
  source_title: Ausgrid Power2U Demand Management for Replacement Needs Report
  publish_date: 2021-04
  project_name: Power2U (P2U) Solar and Lighting Incentive Program
  what_happened: The solar incentive program achieved an estimated 40–75% additionality
    (approximately 1,300–2,400 kW above business-as-usual), but when applied to the
    Mascot zone substation use-case the capacity-density achieved (0.09–0.19 kW per
    business customer) was insufficient on its own, meeting only the lower bounds
    of the demand management requirement and covering at most 12% of the energy reduction
    needed.
  lesson_learnt: Financial incentive programs for permanent demand reduction (solar
    PV) can be cost-effective at approximately $300/kW all-in, but are unlikely to
    meet the full scale of a replacement-driven network need in isolation — program
    designers should plan for blended portfolios combining solar with other demand
    management solutions to fill the gap, particularly for high-consequence replacement
    assets with large energy reduction requirements.
