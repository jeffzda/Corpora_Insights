- record_id: ARENA-DLV-41365
  source_title: Ausgrid Power2U Demand Management for Replacement Needs Report
  publish_date: 2021-04
  project_name: Power2U (P2U) Solar and Lighting Incentive Program
  what_happened: '80% of business solar installations by count (and 70% by capacity)
    were concentrated in just six ANZSIC industry classifications: Manufacturing,
    Wholesale Trade, Professional/Scientific/Technical Services, Construction, Other
    Services, and Financial & Insurance Services, despite these six industries accounting
    for only around 47% of businesses in the program areas.'
  lesson_learnt: Demand management solar programs targeting business customers should
    segment and prioritise marketing effort by ANZSIC industry type — manufacturing,
    construction, and wholesale trade businesses consistently show higher solar uptake,
    likely due to larger roof footprints and owner-occupied premises; targeting these
