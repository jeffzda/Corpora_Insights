  project_name: Power2U (P2U) Solar and Lighting Incentive Program
  what_happened: The program used a 'deeming' measurement and verification methodology
    for both solar (based on rated panel capacity and standard generation factors)
    and efficient lighting (based on NSW ESS deemed savings methodology), which provided
    sufficient certainty of demand reduction for program purposes while minimising
    administrative burden on market providers and Ausgrid.
  lesson_learnt: Where established deeming methodologies exist for demand reduction
    technologies (e.g. solar PV capacity-based generation factors, NSW ESS lighting
    deemed savings), adopt these in preference to bespoke metered measurement and
    verification — deeming methods reduce program administration cost, enable faster
    payment processing, and leverage existing accreditation infrastructure, making
    incentive programs more scalable.
