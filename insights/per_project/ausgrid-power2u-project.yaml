  project_name: Power2U (P2U) Solar and Lighting Incentive Program
  what_happened: Identifying and reaching the actual decision-maker within commercial
    businesses was consistently identified as a major challenge across multiple market
    providers throughout the program. Gatekeepers blocked access, contacts lacked
    authority to approve solar purchases, and many C&I decision-makers were located
    outside the program area (e.g. at head offices).
  lesson_learnt: Commercial solar programs should specifically develop strategies
    to identify and access decision-makers — sales approaches that cannot reach the
    person with capital expenditure authority are ineffective regardless of incentive
    level; this is particularly acute for multi-site businesses and commercial tenants
    where the decision-maker may be geographically remote from the site.
