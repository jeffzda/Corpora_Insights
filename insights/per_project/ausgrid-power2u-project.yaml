  evidence_excerpt: An alternative to the selected market provider approach was considered
    during the initial development of the program which would have involved setting
    up an accreditation scheme and opening the program up to any providers who satisfied
    accreditation requirements. The complexity, costs and overheads involved in this
    alternative structure for a program of this size and duration was not considered
    practical.
