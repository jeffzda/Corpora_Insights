  source_title: Ausgrid Power2U Demand Management for Replacement Needs Report
  publish_date: 2021-04
  project_name: Power2U (P2U) Solar and Lighting Incentive Program
  what_happened: The program budget allocation model gave each market provider an
    initial funding cap with additional amounts accessible upon exhaustion, intended
    to motivate early activity. However, the structure meant providers with no up-front
    marketing budget had to self-fund initial customer acquisition before any payment
    could be triggered, which influenced the pace and scale of marketing investment.
  lesson_learnt: Program funding structures for market-led demand management should
    clearly separate provider remuneration (paid on delivery) from program marketing
    support (potentially provided up-front) — tiered funding caps with additional
    tranches accessible on performance can motivate activity, but only if providers
    have sufficient financial capacity to invest in marketing before first payment;
    consider whether a small initial marketing contribution improves overall program
    uptake.
