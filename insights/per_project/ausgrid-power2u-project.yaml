  source_title: Ausgrid Power2U Demand Management for Replacement Needs Report
  publish_date: 2021-04
  project_name: Power2U (P2U) Solar and Lighting Incentive Program
  what_happened: A significant proportion of business customers with eligible roof
    space opted for 99 kW solar systems rather than larger systems that would have
    better matched their roof area and energy consumption, in order to access Small-scale
    Technology Certificate (STC) point-of-sale discounts. Systems above 100 kW require
    annual Large-scale Generation Certificate (LGC) creation and trading, creating
    additional administrative burden and market price risk.
  lesson_learnt: The 100 kW STC/LGC threshold creates an artificial barrier to optimal
    solar system sizing for C&I customers — program designers and policy makers should
    account for this threshold when estimating potential demand reduction from incentive
    programs targeting larger commercial customers, as it systematically caps installations
    below the economically optimal size.
