  source_title: Ausgrid Power2U Demand Management for Replacement Needs Report
  publish_date: 2021-04
  project_name: Power2U (P2U) Solar and Lighting Incentive Program
  what_happened: Face-to-face meetings consistently achieved the highest sales conversion
    rates (5–33% response rates) compared to all other marketing channels, while broad-brush
    approaches such as letterbox drops, Google AdWords, and mass cold-calling produced
    low or negligible returns. Phone calling generated leads at approximately $160
    per lead versus $18–$42 per lead for social media geo-targeting.
  lesson_learnt: For commercial solar demand management programs, face-to-face engagement
    is the most effective sales conversion method despite its higher cost per contact
    — prioritise direct meetings with qualified decision-makers over mass marketing
    channels; use lower-cost social media campaigns primarily for early-stage awareness
    and lead generation, then convert through direct engagement.
