  project_name: Power2U (P2U) Solar and Lighting Incentive Program
  what_happened: The $180/kW incentive rate initially applied in the City of Sydney
    area failed to generate material solar sales activity, whereas the $250/kW rate
    applied in the Canterbury-Bankstown area produced substantially more sales. The
    City of Sydney incentive was later increased to $250/kW mid-program.
  lesson_learnt: Incentive levels for solar demand management programs must be set
    at a threshold that customers perceive as materially reducing payback periods
    — $180/kW was insufficient to motivate business customers to act, while $250/kW
    (enabling ~2–3 year paybacks) was effective; calibrate incentive rates to target
    payback thresholds before program launch.
