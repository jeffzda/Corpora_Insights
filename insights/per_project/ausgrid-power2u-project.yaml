  what_happened: Residential solar sales achieved only minimal results throughout
    the program, despite multiple market providers deploying marketing campaigns in
    Canterbury-Bankstown and City of Sydney residential areas. Residential sales accounted
    for only around 5% of total solar capacity sold.
  lesson_learnt: Demand management incentive programs targeting residential solar
    in competitive urban markets face significant barriers — high market competition
    from low-cost solar providers and customer fatigue from competing offers limit
    additionality; programs should focus marketing effort and resources on the commercial/business
    segment where incentive impact is larger and transaction costs per kW are lower.
