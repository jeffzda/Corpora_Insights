  what_happened: Business customers targeting payback periods of 2–3 years or better
    were receptive to the $250/kW incentive, while those facing paybacks over 5 years
    were not. The incentive was most effective when combined with a fixed program
    close date, which motivated undecided customers to commit.
  lesson_learnt: Structure demand management incentive programs with a clearly communicated
    fixed end date — the combination of a material incentive (sufficient to achieve
    payback targets of 2–3 years) and an imminent deadline is more effective at converting
    undecided commercial customers than an open-ended offer alone.
