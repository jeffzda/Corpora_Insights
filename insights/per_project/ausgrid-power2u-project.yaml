  publish_date: 2021-04
  project_name: Power2U (P2U) Solar and Lighting Incentive Program
  what_happened: Ausgrid considered but rejected an open accreditation scheme (allowing
    any qualifying provider to participate) in favour of a closed selection of named
    market providers, citing the complexity, cost and overhead of the accreditation
    model as impractical for a program of this size and duration. The closed model
    required managing a small number of provider relationships but limited breadth
    of customer reach.
  lesson_learnt: For short-duration, geographically focused demand management programs,
    a closed multi-provider selection model is more practical than an open accreditation
    scheme — however, program designers should assess whether the transaction cost
    and overhead trade-off changes for larger programs or those targeting mass-market
    residential segments, where an open accreditation model may better serve scale
    objectives.
