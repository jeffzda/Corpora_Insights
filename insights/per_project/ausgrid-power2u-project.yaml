- record_id: ARENA-DLV-41358
  source_title: Ausgrid Power2U Demand Management for Replacement Needs Report
  publish_date: 2021-04
  project_name: Power2U (P2U) Solar and Lighting Incentive Program
  what_happened: The renter customer segment — both residential and commercial — generated
    effectively no solar sales throughout the program despite a dedicated provider
    (SunTenants) operating exclusively in the Enmore/Newtown area with a $250/kW incentive.
    The fundamental barrier was the split-incentive problem where landlords bear the
    capital cost but tenants receive the energy bill benefit.
  lesson_learnt: Incentive-only approaches are insufficient to overcome split-incentive
    barriers for solar in tenanted properties — landlords will not invest in solar
    at typical incentive levels when they do not receive the energy bill benefit;
    programs should either specifically design alternative mechanisms (e.g. mandated
