  source_title: Ausgrid Power2U Demand Management for Replacement Needs Report
  publish_date: 2021-04
  project_name: Power2U (P2U) Solar and Lighting Incentive Program
  what_happened: Around 90% of Ausgrid's capital expenditure forecast over the next
    5–10 years is replacement/retirement-driven rather than demand-growth-driven,
    yet at the time of the program there were few if any examples of demand management
    being successfully used to defer replacement-driven network investment, leaving
    a significant evidence gap in the industry.
  lesson_learnt: Demand management programs designed to address network replacement
    needs require different solution portfolios than those addressing demand growth
    — replacement needs require longer-duration reductions (up to 200–400 hours per
    year versus ~40 hours for peak-load management) that are less suited to demand
    response and better suited to permanent reduction technologies such as solar PV
    and energy efficiency; network businesses should develop and test blended DM portfolios
    specifically calibrated to replacement-need characteristics.
