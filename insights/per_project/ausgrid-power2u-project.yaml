  what_happened: The program areas were deliberately chosen not to coincide with an
    imminent network need but instead to have characteristics transferable to areas
    where future replacement needs would arise. This design choice meant the program
    could not directly validate its outputs against a live network deferral decision.
  lesson_learnt: When designing demand management trials, there is a trade-off between
    running the program where the network need is imminent (maximising direct applicability)
    versus running in a transferable area (maximising learning breadth) — if the trial
    area does not have an imminent network need, explicitly plan for a separate application
    study that translates trial results to the target network asset, as direct validation
    will not be possible.
