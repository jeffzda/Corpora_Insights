  source_title: Ausgrid Power2U Demand Management for Replacement Needs Report
  publish_date: 2021-04
  project_name: Power2U (P2U) Solar and Lighting Incentive Program
  what_happened: Commercial tenants in leased premises were consistently unable to
    take up the solar offer due to short remaining lease terms, the need for landlord
    permission, complexity of multi-tenant sites, and difficulty locating building
    owners who were often outside the program area. This affected both solar and efficient
    lighting offers.
  lesson_learnt: Leased commercial premises are a structurally difficult segment for
    solar demand management programs — short leases, absentee landlords, and multi-tenancy
    approval processes create barriers that incentive-only structures cannot overcome;
    program scope should either exclude leased commercial premises or develop specific
    alternative instruments (e.g. direct landlord engagement, lease incentive provisions)
    before including this segment.
