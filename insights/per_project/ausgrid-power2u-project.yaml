  what_happened: The schools segment produced encouraging but slow results — only
    4 of 24 schools completed solar installations by end of March 2021, with 6 still
    in the tendering or grant approval pipeline. The primary bottleneck was the lengthy
    NSW Department of Education funding and tendering process, not the willingness
    of schools to participate.
