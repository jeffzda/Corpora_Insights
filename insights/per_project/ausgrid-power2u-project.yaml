  source_title: Ausgrid Power2U Demand Management for Replacement Needs Report
  publish_date: 2021-04
  project_name: Power2U (P2U) Solar and Lighting Incentive Program
  what_happened: Multiple competing market providers in the Canterbury-Bankstown area
    produced substantially better solar sales outcomes than the single exclusive provider
    model used in the City of Sydney area. The Canterbury-Bankstown area accounted
    for around two-thirds of total solar sales by capacity.
  lesson_learnt: Engage multiple competing providers in a defined demand management
    program area rather than awarding exclusivity to a single provider — competition
    motivates providers to sharpen pricing, broaden product offerings, and increase
    sales effort, resulting in higher volumes of customer conversions.
