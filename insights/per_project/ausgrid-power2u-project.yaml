  source_title: Ausgrid Power2U Demand Management for Replacement Needs Report
  publish_date: 2021-04
  project_name: Power2U (P2U) Solar and Lighting Incentive Program
  what_happened: Accurately quantifying the additionality of solar installations stimulated
    by the program was highly challenging due to year-to-year variability in historical
    installation rates at local area levels, incomplete FY2020/21 data at report publication,
    COVID-19 counterfactual uncertainty, and the difficulty of extrapolating state
    or national trends to the small geographies relevant to network replacement needs.
  lesson_learnt: Establish robust pre-program measurement and verification baselines
    and additionality methodologies before commencing demand management incentive
    programs — relying on post-hoc analysis of historical trends at feeder or suburb
    scale introduces significant uncertainty that undermines cost-benefit assessments
    and program credibility; consider reference area comparators and longer pre-program
    data windows.
