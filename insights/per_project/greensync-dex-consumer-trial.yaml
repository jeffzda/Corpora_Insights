  what_happened: GreenSync's deX Consumer Insights analysis found that personalised email timing significantly affected response rates, with 8am Sunday outperforming evening and weekday send times, indicating
    that communication channel and timing decisions have measurable impacts on customer acquisition outcomes.
  lesson_learnt: Test and optimise the timing and personalisation of customer communications — in at least one DER trial, sending emails at 8am Sunday substantially outperformed other times, with direct
    implications for lead generation and conversion rates.
