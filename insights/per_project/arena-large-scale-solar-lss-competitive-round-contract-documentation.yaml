  failure_mode: coordination & stakeholders
  outcome_class: delayed but recoverable
  secondary_failure_mode: null
  intervention_note: ARENA subsequently extended streamlined R&D-style contracts across
    all programs and committed to upfront market engagement before releasing documents
    to participants.
