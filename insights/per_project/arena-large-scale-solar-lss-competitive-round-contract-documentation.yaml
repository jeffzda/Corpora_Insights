- record_id: ARENA-DLV-15806
  source_title: Evaluation of ARENA's Impact and Effectiveness
  publish_date: 2019-11
  project_name: ARENA Large-Scale Solar (LSS) Competitive Round — contract documentation
  what_happened: LSS participants reported significant rework because ARENA prepared
    and amended the documents necessary to support the agreed contracting framework
    late in the process. The LSS contract template exceeded 200 pages and was regarded
    as overly complex and conservative.
  lesson_learnt: For large competitive rounds, prepare and stress-test contract documentation
    before the round launches — late preparation and amendment of complex financing
    documents forces proponents to rework already-completed work and extends time-to-financial-close.
