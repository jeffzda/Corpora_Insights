- record_id: ARENA-DLV-20724
  source_title: Demand Response Short Notice RERT Trial Year 3 Report
  publish_date: 2021-10
  project_name: DR SN RERT Trial — critical infrastructure sector DR unavailability
    during emergencies
  what_happened: Industries with high regulatory and environmental compliance requirements
    — including telecommunications, water utilities, and wastewater services — were
    found to face particular difficulties providing DR during periods of drought,
    bushfire, or other emergencies, reducing portfolio reliability at precisely the
    times when RERT activations are most likely.
  lesson_learnt: DR aggregators should explicitly identify and flag regulated critical
    infrastructure customers in their portfolios and apply conservative derate factors
    to their capacity during high-risk periods; RERT portfolio designs should not
    count on critical infrastructure DR capacity during emergency conditions.
