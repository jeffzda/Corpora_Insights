  project_name: Ecoult UltraBattery Distributed Solar PV Support and UltraBattery
    for RAPS
  what_happened: Testing of the UltraBattery for remote area power supply and distributed
    grid applications found that standardisation around a common interface could reduce
    the effort required to integrate batteries into energy systems.
  lesson_learnt: Adopting standardised interfaces for battery-energy-system integration
    significantly reduces integration effort — projects should seek or advocate for
    interface standardisation early in the design phase to avoid bespoke integration
    work.
