- record_id: ARENA-DLV-56601
  source_title: 'Lessons Learnt: Hydrogenated Bifacial PERL Silicon PV Cells with
    Laser Doping and Plated Contacts'
  publish_date: '2019-08-28'
  project_name: Hydrogenated Bifacial PERL Silicon PV Cells with Laser Doping and
    Plated Contacts
  what_happened: During cell fabrication trials, applying the advanced hydrogenation
    process after copper plating caused the copper contacts to peel off the silicon
    surface due to the differing thermal expansion coefficients of silicon and copper,
    reducing fill factor and cell efficiency. The team determined that hydrogenation
    must be applied before copper deposition — either before or after laser doping,
    or during nickel sintering.
  lesson_learnt: For solar cells with plated contacts, apply advanced hydrogenation
    before copper deposition — not after. Applying it post-copper plating causes contact
    delamination due to thermal expansion mismatch between silicon and copper. Schedule
    hydrogenation before laser doping, after laser doping, or during nickel sintering
    instead.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Tested hydrogenation at multiple stages of cell fabrication (before
    laser doping, after laser doping, after nickel plating, after copper plating)
    and identified that applying it before copper deposition successfully passivates
    defects and eliminates LID losses to less than 1.5% relative without damaging
    contacts.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id005
  - 6
  - 7
  evidence_excerpt: Applying hydrogenation after copper plating will affect the contacts
    causing them to peel off silicon, reducing fill factor and hence cell efficiency.
  confidence_note: project_scale_band assigned as lab/bench — the document describes
    laboratory cell fabrication and integration of technologies at research scale
    with no commercial production context.
