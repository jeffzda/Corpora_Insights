    cell device with 19.8% efficiency — below the target trajectory toward 25% PERL
    efficiency but demonstrating successful integration of all three technologies
    for the first time.
  lesson_learnt: Integration of multiple novel cell technologies (laser doping, hydrogenation,
    plating) into a single device is achievable at lab scale but initial efficiency
    will be below the optimised individual-technology ceiling; plan for an iterative
    optimisation phase after first successful integration before targeting efficiency
    milestones.
