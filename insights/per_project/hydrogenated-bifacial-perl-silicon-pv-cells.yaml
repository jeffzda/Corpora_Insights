  secondary_failure_mode: null
  intervention_note: Project team identified that sustainability concerns around silver
    consumption in screen-printing remain a long-term driver for industry transition
    to plating, and developed a scalable industrial bifacial plating tool to lower
    barriers when industry readiness improves.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
