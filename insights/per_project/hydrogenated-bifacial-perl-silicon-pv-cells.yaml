  source_title: Hydrogenated Bifacial PERL Silicon PV Cells Public Dissemination Report
  publish_date: 2022-11
  project_name: Hydrogenated Bifacial PERL Silicon PV Cells with Laser Doping and
    Plated Contacts
  what_happened: The project discovered that HF pre-treatment of laser doped silicon
    surfaces prior to plating plays a critical role in plated contact quality, and
    that appropriate HF pre-treatment can compensate for non-ideal laser conditions
    — enabling a wider range of laser types (including cheaper green lasers) to achieve
    good plating results.
  lesson_learnt: Future projects adopting plated contacts for solar cells need not
    be restricted to specific laser types; careful optimisation of HF pre-treatment
    conditions before plating can achieve high-quality contacts across a range of
    laser doping conditions, potentially reducing entry cost barriers for manufacturers.
