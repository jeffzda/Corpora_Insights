    Plated Contacts
  what_happened: The UV laser used for laser doping failed and could not be repaired
    in the later stages of the project. The only available alternative (a green wavelength
    laser) initially produced inferior plated contacts, causing significant project
    delay before a workaround was found.
  lesson_learnt: Projects relying on a single laser tool for a critical process step
    should plan for equipment failure contingencies early. When a UV laser is unavailable,
    appropriate HF pre-treatment conditions applied before plating can enable green
    wavelength lasers to achieve equivalent plated contact quality — reducing both
    equipment dependency and upfront cost barriers.
