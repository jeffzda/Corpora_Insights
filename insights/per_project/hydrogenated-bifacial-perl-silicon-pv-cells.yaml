- record_id: ARENA-DLV-15653
  source_title: Hydrogenated Bifacial PERL Silicon PV Cells Public Dissemination Report
  publish_date: 2022-11
  project_name: Hydrogenated Bifacial PERL Silicon PV Cells with Laser Doping and
    Plated Contacts
  what_happened: Despite successful technical integration of the three technologies
    and achievement of 23% cell efficiency, industry uptake of the plated contact
    PERL technology was constrained by continuous improvements in competing screen-printing
    paste technology, which reduced the relative advantage of plating and made industry
    less willing to transition.
  lesson_learnt: R&D projects targeting incremental efficiency or cost improvements
    over incumbent technologies face commercial adoption risk if the incumbent technology
    continues to improve during the project period. Project planning should assess
    the trajectory of competing technologies and build in commercial viability checkpoints,
    not just technical milestones.
