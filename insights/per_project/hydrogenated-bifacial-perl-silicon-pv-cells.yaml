- record_id: ARENA-DLV-56602
  source_title: 'Lessons Learnt: Hydrogenated Bifacial PERL Silicon PV Cells with
    Laser Doping and Plated Contacts'
  publish_date: '2019-08-28'
  project_name: Hydrogenated Bifacial PERL Silicon PV Cells with Laser Doping and
    Plated Contacts
  what_happened: The project identified that advanced hydrogenation and nickel sintering
    are currently two separate processing steps, representing an efficiency gap and
    additional cost in the cell fabrication sequence. The team identified the potential
    to combine these into a single step but had not yet developed the combined process
    within the first 18-month stage.
  lesson_learnt: Investigate combining advanced hydrogenation with nickel sintering
    into a single processing step — eliminating one fabrication step reduces cost
    and complexity for plated-contact solar cells, and preliminary evidence suggests
    it is technically feasible.
  issue_severity: minor
  project_type: manufacturing/supply chain
  project_scale_band: lab/bench
