- record_id: ARENA-DLV-63352
  source_title: Hydrogenated Bifacial Perl Silicon PV Cells with Laser Doping and
    Plated Contacts
  publish_date: 2021-12
  project_name: Hydrogenated Bifacial PERL Silicon PV Cells with Laser Doping and
    Plated Contacts
  what_happened: The project successfully demonstrated that advanced hydrogenation,
    originally developed for screen-printed cells, can be adapted to bifacial PERL
    cells with laser doping and plated contacts, achieving less than 1% relative efficiency
    loss due to light-induced degradation (LID) under industry-standard light soaking.
  lesson_learnt: Advanced hydrogenation processes developed for screen-printed cells
    can be transferred to plated-contact bifacial PERL architectures with appropriate
    process-step integration, effectively passivating both laser-induced defects and
    LID to well within industry tolerance.
