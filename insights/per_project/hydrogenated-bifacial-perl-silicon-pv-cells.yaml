- record_id: ARENA-DLV-63351
  source_title: Hydrogenated Bifacial Perl Silicon PV Cells with Laser Doping and
    Plated Contacts
  publish_date: 2021-12
  project_name: Hydrogenated Bifacial PERL Silicon PV Cells with Laser Doping and
    Plated Contacts
  what_happened: During development of plated bifacial PERL solar cells, the team
    discovered that laser doping process parameters (focus, power, wavelength, doping
    time) critically determine plated contact quality — non-uniform laser doping surfaces
    caused problems including poor adhesion, ghost plating, and high contact resistance.
  lesson_learnt: Carefully select laser doping parameters (focus, power, wavelength,
    doping time) before commencing plating, and apply different plating strategies
    for different laser-doped surfaces — a uniform laser doping surface is prerequisite
    for reliable metal deposition and high cell efficiency.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Systematically studied key laser doping parameters and developed
    a baseline procedure for laser doping and plating to avoid poor adhesion, ghost
    plating, and high contact resistance.
  transferability: moderate
