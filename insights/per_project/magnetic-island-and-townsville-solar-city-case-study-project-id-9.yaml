- record_id: ARENA-DLV-72266
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: '2014'
  project_name: Magnetic Island and Townsville Solar City Case Study (Project ID 9)
  what_happened: Analysis of Ergon Energy's network on Magnetic Island and Townsville
    found that voltage management was the primary power quality issue arising from
    high PV penetration; issues were successfully resolved through network balancing,
    adjustment, and minor augmentation. Other concerns such as reverse power flow,
    power factor distortion, harmonics, and islanding were not found to be of significant
    concern.
  lesson_learnt: Voltage management is the dominant power quality issue arising from
    high residential PV penetration on distribution networks — early detection tests,
    correct inverter settings, and engagement with installers can resolve most issues
    without major augmentation; reverse power flow, harmonics, and islanding are less
    likely to be the primary concern at moderate penetration levels.
