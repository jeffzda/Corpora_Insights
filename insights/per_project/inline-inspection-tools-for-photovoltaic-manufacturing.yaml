- record_id: ARENA-DLV-0451
  source_title: BT Imaging Final Report
  publish_date: '2014-05-30'
  project_name: BT Imaging iLS-L2 and LIS-B1 Product Development
  what_happened: BT Imaging completed development and general release of both the
    LIS-B1 (block tool) and iLS-L2 (crack tool) for photovoltaic silicon wafer and
    cell manufacturers, meeting all customer-specified performance requirements across
    a three-year project.
  lesson_learnt: Anchoring product specifications to a concrete customer payback threshold
    (under 12 months for manufacturing capital equipment) provides a clear, testable
    design target that aligns development effort with commercial viability from the
    outset.
