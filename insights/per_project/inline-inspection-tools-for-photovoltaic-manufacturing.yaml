  project_name: BT Imaging iLS-L2 and LIS-B1 Product Development
  what_happened: During development of the iLS-L2 crack detection tool, BT Imaging
    produced a hardware platform that proved adaptable to multiple distinct product
    applications beyond the original scope, yielding several unexpected spin-off products.
  lesson_learnt: When developing novel hardware platforms for niche industrial applications,
    build in early assessment of platform generalisability — unexpected spin-off product
    opportunities can emerge and represent significant additional commercial value
    not captured in the original project business case.
