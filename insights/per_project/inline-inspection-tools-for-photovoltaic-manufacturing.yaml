- record_id: ARENA-DLV-0453
  source_title: BT Imaging Final Report
  publish_date: '2014-05-30'
  project_name: BT Imaging iLS-L2 and LIS-B1 Product Development
  what_happened: General release of both tools required alpha and beta customer trials
    followed by substantial prototype revisions before final design was confirmed,
    indicating that initial prototypes did not fully satisfy commercial deployment
    requirements without iteration.
  lesson_learnt: For capital equipment products targeting manufacturing customers,
    budget explicitly for multiple prototype revision cycles driven by alpha and beta
    customer trials — this iteration is a necessary and predictable part of the development
    lifecycle, not a failure, and should be scoped into timeline and cost plans from
    the start.
  issue_severity: minor
  project_type: manufacturing/supply chain
  project_scale_band: first commercial/FOAK
  lifecycle_phase: commissioning/integration
  proponent_type: technology vendor
  delay_category: data/validation/testing
  failure_mode: poor scoping
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: Prototype revisions were incorporated through structured alpha
