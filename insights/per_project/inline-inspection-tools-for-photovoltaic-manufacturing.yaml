- record_id: ARENA-DLV-0454
  source_title: BT Imaging Final Report
  publish_date: '2014-05-30'
  project_name: BT Imaging iLS-L2 and LIS-B1 Product Development
  what_happened: Following successful product development and general release, the
    project identified that achieving commercial scale would require a separate sales
    and marketing phase, including key customer trials and full line deployment, which
    were outside the funded project scope.
  lesson_learnt: For manufacturing equipment product development projects, the funded
    R&D scope should be clearly distinguished from the subsequent commercialisation
    phase — sales traction, customer line trials, and full deployment require dedicated
    resources and timelines that are separate from and follow on from development
    completion.
  issue_severity: minor
  project_type: manufacturing/supply chain
