  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects - First Edition Results'
  publish_date: '2014'
  project_name: Impacts of PV, AC, and Other Technologies and Tariffs on Consumer Costs (Project ID 113)
  what_happened: APVI modelling found that under a Time of Use (TOU) tariff, DNSPs receive 23% less income than under a standard tariff, and that TOU tariffs result in the highest costs for other customers
    under revenue cap regulation — worse than demand charge tariffs.
  lesson_learnt: Tariff design choices have significant cross-customer cost implications — demand charge tariffs produce better equity outcomes for non-installing customers than TOU tariffs under revenue
    cap regulation; policymakers and regulators should account for these distributional effects when designing tariff structures for high-DER networks.
