- record_id: ARENA-DLV-64404
  source_title: Distributed Energy Resources (DER) Integration Project Contribution
    Assessment
  publish_date: 2019-03
  project_name: ARENA DER Integration Portfolio
  what_happened: Knowledge sharing reports from ARENA-funded DER projects were designed
    to capture lessons learned in a broad, general manner. In most cases they were
    not well targeted to specific audience groups or segments of the industry, contributing
    to low unique page views and low knowledge bank download counts (1–67 downloads
    per project).
  lesson_learnt: ARENA should require projects to curate knowledge sharing outputs
    for specific audience groups (e.g. DNSPs, retailers, regulators, customers) rather
    than producing generic lessons-learned reports — audience-targeted content increases
    relevance, uptake and downstream policy impact.
