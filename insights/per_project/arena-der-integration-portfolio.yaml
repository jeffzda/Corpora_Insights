  what_happened: The DER portfolio had no projects specifically targeting small-to-medium
    enterprises (SMEs). All customer-facing projects were focused on residential customers
    or, in a smaller number of cases, commercial and industrial (C&I) customers. SMEs
    represented a complete gap in customer type coverage.
