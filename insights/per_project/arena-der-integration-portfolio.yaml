  source_title: Distributed Energy Resources (DER) Integration Project Contribution
    Assessment
  publish_date: 2019-03
  project_name: ARENA DER Integration Portfolio
  what_happened: Across 10 projects that aimed to provide cost comparison of hosting
    capacity methods, 9 had not progressed far enough at the time of assessment to
    complete the economic analysis. This created a large gap between current and forecast
    contribution toward Strategic Outcome 2 (lower-cost ways to increase hosting capacity).
  lesson_learnt: Projects that include cost comparison as a deliverable should ensure
    economic analysis milestones are sequenced early enough to be completed before
    knowledge sharing closes — late-stage economic deliverables frequently remain
    incomplete at assessment time, understating portfolio value.
