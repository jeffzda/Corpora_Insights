  source_title: Distributed Energy Resources (DER) Integration Project Contribution
    Assessment
  publish_date: 2019-03
  project_name: ARENA DER Integration Portfolio
  what_happened: No project in the assessed portfolio of 28 DER integration projects
    demonstrated the ability for DER to directly participate in the NEM wholesale
    market. All wholesale demonstrations involved indirect participation through retailers'
    hedging positions. Regulatory and technical requirements for direct DER participation
    remained unresolved.
  lesson_learnt: Future DER funding should include projects that specifically simulate
    or trial direct participation in wholesale energy markets, including baselining
    techniques and measurement and verification approaches, to close the gap between
    indirect retail-mediated access and direct market participation.
