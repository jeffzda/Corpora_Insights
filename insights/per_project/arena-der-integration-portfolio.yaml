  what_happened: VPP projects in the portfolio demonstrated orchestration primarily
    focused on customer bill optimisation and network services. Only three projects
    had demonstrated or intended to demonstrate participation in FCAS markets, and
    four in network services, reflecting a gap in multi-value-stream orchestration
    at operational scale.
  lesson_learnt: VPP projects that target only one or two value streams (typically
    bill optimisation) are less effective at demonstrating the full orchestration
    outcome — future VPP projects should be explicitly designed to access wholesale,
    FCAS and network services simultaneously to demonstrate true multi-value-stream
    optimisation.
