  what_happened: Early VPP projects within the assessed portfolio reported on customer
    recruitment issues, installation problems, and equipment failures that limited
    orchestration capability, but these learnings were not systematically captured
    in a form accessible to subsequent VPP project teams — each new VPP project appeared
    to rediscover some of the same challenges.
