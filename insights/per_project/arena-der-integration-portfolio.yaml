- record_id: ARENA-DLV-64428
  source_title: Distributed Energy Resources (DER) Integration Project Contribution
    Assessment
  publish_date: 2019-03
  project_name: ARENA DER Integration Portfolio
  what_happened: The assessed portfolio included only modelling studies for hosting
    capacity outcomes at the DNSP or NEM level. Real-time physical demonstrations
    of network-scale hosting capacity management — including operating the supply-demand
    balance under high solar penetration with little direct control of either side
    — had not been attempted, and stakeholders (including AEMO) identified this as
    a key unresolved engineering challenge.
  lesson_learnt: Future DER funding should include projects that specifically tackle
    complex system engineering challenges at regional scale — including supply-demand
    balance with low direct control, protection relay impacts from reduced fault current,
    and managing cloud-driven variability at NEM scale — as these cannot be resolved
    through substation-level pilots alone.
