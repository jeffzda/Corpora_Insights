    Assessment
  publish_date: 2019-03
  project_name: ARENA DER Integration Portfolio
  what_happened: No project in the assessed portfolio demonstrated DER direct participation
    in FCAS markets. Future portfolio contribution towards the System Security Services
    outcome was heavily dependent on a single project — Simply Energy's VPPx — which
    aimed to be the first VPP to directly access the FCAS market.
  lesson_learnt: Portfolio concentration risk for a critical strategic outcome on
