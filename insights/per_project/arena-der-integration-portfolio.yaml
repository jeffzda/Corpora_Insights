- record_id: ARENA-DLV-64401
  source_title: Distributed Energy Resources (DER) Integration Project Contribution
    Assessment
  publish_date: 2019-03
  project_name: ARENA DER Integration Portfolio
  what_happened: Across the assessed portfolio of 28 DER integration projects, the
    portfolio was consistently stronger at informing strategic outcomes than at demonstrating
    them. Several projects were research studies rather than physical trials, and
    others demonstrated unrelated outcomes that incidentally informed strategic outcomes
    without producing direct demonstrations.
  lesson_learnt: When designing DER funding rounds, distinguish clearly between knowledge-generating
    research studies and physical demonstration trials — a portfolio weighted toward
    research will inform but not demonstrate strategic outcomes, leaving gaps that
    require subsequent, separately funded demonstration projects.
