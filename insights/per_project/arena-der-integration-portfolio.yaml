  outcome_class: partial success
  secondary_failure_mode: null
  intervention_note: MHC recommended curating content for specific audience groups
    and tracking web statistics and download data on a regular basis to identify content
    of interest.
  transferability: broad
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id004
