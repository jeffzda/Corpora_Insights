- record_id: ARENA-DLV-64434
  source_title: Distributed Energy Resources (DER) Integration Project Contribution
    Assessment
  publish_date: 2019-03
  project_name: ARENA DER Integration Portfolio
  what_happened: Preliminary feed-in tariff barriers (loss of premium FiT) were identified
    across multiple projects as a material barrier to customer participation in DER
    programs including VPPs. Customers receiving premium feed-in tariffs were unwilling
    to participate in demand response or VPP programs that could disrupt or jeopardise
    their tariff entitlements.
  lesson_learnt: Premium feed-in tariff legacy arrangements create structural barriers
    to DER program participation that cannot be overcome through customer engagement
    alone — project designers should assess the proportion of target customers on
    PFIT-equivalent arrangements and either exclude them from trials or work with
    retailers to design participation models that preserve tariff entitlements.
