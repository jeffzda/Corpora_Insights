  source_title: Distributed Energy Resources (DER) Integration Project Contribution
    Assessment
  publish_date: 2019-03
  project_name: ARENA DER Integration Portfolio
  what_happened: Closed projects within the DER portfolio had previously encountered
    hosting capacity issues (voltage rise, export limits, intermittency) and identified
    possible solutions, but few went on to demonstrate those solutions. Current demonstrated
    contribution toward hosting capacity outcomes 1–3 and 5 was assessed as low.
  lesson_learnt: Early DER projects that identify hosting capacity problems should
    be designed from the outset with a pathway to demonstration — discovery-only projects
    produce knowledge but leave critical gaps in the portfolio's ability to prove
    solutions work at scale.
