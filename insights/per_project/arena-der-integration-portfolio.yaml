- record_id: ARENA-DLV-64405
  source_title: Distributed Energy Resources (DER) Integration Project Contribution
    Assessment
  publish_date: 2019-03
  project_name: ARENA DER Integration Portfolio
  what_happened: ARENA had no mechanism to obtain information from project proponents
    after a project met its final milestone and closed. This limited ARENA's ability
    to track the ongoing commercial viability and real-world impact of DER integration
    solutions beyond the funded project period.
  lesson_learnt: Funding agreements should include requirements or incentives for
    project proponents to provide post-closure updates to ARENA, enabling tracking
    of commercialisation progress and downstream impacts that occur after formal project
    completion.
