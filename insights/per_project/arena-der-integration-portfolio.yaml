  source_title: Distributed Energy Resources (DER) Integration Project Contribution
    Assessment
  publish_date: 2019-03
  project_name: ARENA DER Integration Portfolio
  what_happened: Web analytics showed that unique page views for most DER projects
    were between 500 and 1,000, which was generally higher than the median of 225
    views across 330 ARENA-funded projects. However, this comparison was confounded
    by the fact that the 18-month measurement window did not account for project completion
    dates, meaning completed projects would naturally show lower views regardless
    of report quality.
  lesson_learnt: Web view metrics should be normalised to account for project completion
    dates and active status before using them to compare knowledge sharing effectiveness
    across the portfolio — raw view counts disadvantage completed projects and overstate
    the relative performance of recently active ones.
