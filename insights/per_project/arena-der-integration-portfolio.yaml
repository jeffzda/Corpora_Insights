  what_happened: The majority of DER deployment projects in the portfolio (28 assessed)
    were designed at relatively small scale — generally fewer than 100 customers or
    fewer than 100 DER assets — resulting in DER fleets typically under 1MW. This
    limited the ability to demonstrate commercial feasibility or provide data relevant
    to AEMO at the transmission interface.
