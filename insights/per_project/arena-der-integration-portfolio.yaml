  source_title: Distributed Energy Resources (DER) Integration Project Contribution
    Assessment
  publish_date: 2019-03
  project_name: ARENA DER Integration Portfolio
  what_happened: The assessed DER portfolio was funded between 2014 and 2017 under
    previous strategic priorities (Integrating Renewables and Grids), not under the
    current DER Strategic Outcomes. As active projects were generally larger in scale
    and funded more recently, forecast contributions were consistently higher than
    current contributions across all 10 strategic outcomes.
  lesson_learnt: Portfolio assessment against newly developed strategic outcomes will
    systematically understate current performance when older projects were funded
    under earlier priorities — ARENA should plan for a 2–4 year lag between strategic
    outcome definition and portfolio-level evidence of demonstrated contribution,
    and use this lag to identify gaps for next-round funding.
