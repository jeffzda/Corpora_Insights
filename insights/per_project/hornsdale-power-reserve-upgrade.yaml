  what_happened: Without a market mechanism (Inertia Ancillary Services market) or
    other cost-minimising framework, there is no financial incentive for large-scale
    BESS operators to provide synthetic inertia beyond bilateral TNSP agreements.
    This means the system is maintained at minimum safe inertia levels, maximising
    FCAS requirements and overall system frequency control costs.
  lesson_learnt: Demonstrating technical capability ahead of regulatory reform is
    a necessary precondition for market recognition — BESS developers should actively
    trial and document synthetic inertia performance so that evidence is available
    to inform future IAS market design, rather than waiting for market frameworks
    to be established first.
