  source_title: Hornsdale Power Reserve Expansion Final Project Report
  publish_date: '2024-08-07'
  project_name: Hornsdale Power Reserve Expansion (HPRX)
  what_happened: The maximum inertia achievable at HPR under the VMM implementation
    was constrained below the originally proposed 3,000MWs because higher H constants
    caused reactive current rise and settling times after contingency events to exceed
    acceptable limits under NER clause S5.2.5.5, requiring a compromise H constant
    to be selected.
  lesson_learnt: BESS virtual inertia capability is constrained not only by battery
    capacity but by post-fault reactive current settling time requirements under NER
    S5.2.5.5 — carry out sensitivity modelling of post-fault dynamic behaviour across
    the full range of candidate H constants before lodging a GPS settings change request,
    to avoid setting a target that cannot be achieved within NER compliance limits.
