  what_happened: HPR's FCAS performance during H1 2023 demonstrated that VMM's inertial
    response to rate-of-change-of-frequency (RoCoF) occurs prior to the conventional
    frequency droop response, resulting in initial performance exceeding the minimum
    required response under the MASS verification tool.
  lesson_learnt: BESS equipped with VMM or similar synthetic inertia capabilities
    can provide FCAS response that exceeds minimum compliance thresholds by responding
    to RoCoF before the frequency droop activates. This additive response mechanism
    should be explicitly characterised during commissioning and included in market
    registration studies to maximise registered FCAS capacity.
