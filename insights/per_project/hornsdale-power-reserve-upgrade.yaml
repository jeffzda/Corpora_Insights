- record_id: ARENA-DLV-62308
  source_title: HPRX Virtual Machine Mode (VMM) Modelled vs Actual Report
  publish_date: 2023-02
  project_name: Hornsdale Power Reserve Expansion (HPRX)
  what_happened: Inverter-based resources such as BESS operating in VMM have a physical
    overload rating limitation of 1.2pu, compared to 5–10pu for synchronous machines.
    This means that during transient grid events an inverter operating in VMM will
    saturate (reach maximum output) earlier than a synchronous machine with the same
    nominal inertial constant, producing a different transient response profile.
  lesson_learnt: When comparing BESS virtual inertia to synchronous machine inertia,
    account for the saturation limit of inverters (1.2pu vs 5–10pu for synchronous
    machines) — the effective inertial contribution during large transients will diverge
    from model predictions at high RoCoF events and this limitation must be disclosed
    in regulatory submissions and communicated to system operators.
  issue_severity: minor
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Inertia settings were selected to optimise performance within
    the inverter's physical constraints, and the saturation behaviour was explicitly
    acknowledged in the modelling and regulatory documentation.
  transferability: broad
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id102
  - 7
  - 8
  evidence_excerpt: Synchronous machines have typical overload ratings of 5-10pu,
    whereas for Tesla's inverter this value is limited to 1.2pu. Thus, the transient
    response to a grid disturbance for an inverter operating with VMM, compared with
    a synchronous machine with the same inertial constant, will differ. Transient
    current will saturate (reach maximum output) at a lower value during the inverter
    response, and this is a physical limitation of the types of internal components
    used within inverter-based generators.
