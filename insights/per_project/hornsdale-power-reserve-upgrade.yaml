  - 23
  evidence_excerpt: In the case of traditional synchronous generators, the amount
    of inertia available is inherently linked to the mass and velocity of the rotating
    elements, whereas in an inverter the amount of inertia available is limited to
    the available power between the maximum output limit and the current active power
    output. As the active power setpoint increases, the inertia contribution from
    an inverter starts to reduce due to lower available headroom before the plant
    hits its maximum operating limit.
