  lifecycle_phase: close-out/post-project review
  proponent_type: utility/energy retailer
  delay_category: commissioning/integration
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: ElectraNet worked with Neoen and Tesla to implement a SET1/SET2
    control philosophy enabling fully redundant failover pathways, and the BESS firmware
    was updated to support bidirectional WAPS signals.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id028
