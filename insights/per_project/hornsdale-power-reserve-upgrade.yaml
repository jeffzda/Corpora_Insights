- record_id: ARENA-DLV-62303
  source_title: HPRX Virtual Machine Mode (VMM) Modelled vs Actual Report
  publish_date: 2023-02
  project_name: Hornsdale Power Reserve Expansion (HPRX)
  what_happened: Modelling of VMM behaviour showed that damping inertia and associated
    parameters are equally as important as the H constant value itself — the effective
    H constant differed significantly from the raw H constant setting (e.g. H constant
    of 1 yielded an effective H of 11.02 MW.s/MVA). This meant that any change to
    the selected inertia constant after the 5.3.9 submission commenced would require
    considerable rework of modelling.
  lesson_learnt: When specifying virtual inertia settings for a BESS, finalise the
    full parameter set (including damping inertia and associated parameters, not just
    the H constant) before initiating the 5.3.9 connection alteration process — post-submission
    changes require substantial modelling rework.
  issue_severity: moderate
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
