  source_title: 'NEOEN ''HPRX'' Operations Public Report #1'
  publish_date: 2023-02
  project_name: Hornsdale Power Reserve Expansion (HPRX)
  what_happened: On 12 November 2022, a severe storm caused physical damage to the
    VIC-SA interconnector and tripped Tailem Bend 275kV transmission lines, islanding
    South Australia from the NEM for approximately one week. HPR absorbed ~90MW of
    over-supply and responded to more than 600 frequency excursions outside the Normal
    Operating Frequency Band during the islanding period.
  lesson_learnt: A large-scale BESS with VMM and FCAS capability can serve as a critical
    grid stabilisation asset during extended islanding events — proponents and grid
    operators should pre-establish protocols for activating Fast Frequency Response
    services and adjusting energy/FCAS bid limits to reserve battery capacity for
    frequency support during emergency system separation.
