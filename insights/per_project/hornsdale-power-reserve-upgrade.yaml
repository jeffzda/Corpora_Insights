    (IAS) market continues to be delayed, with draft determinations now expected 27
    June 2025 and market commencement estimated circa 2028–2029.
  lesson_learnt: Technology capability can significantly lead market and regulatory
    frameworks — projects demonstrating novel grid services such as synthetic inertia
    should anticipate multi-year regulatory lag before commercial compensation is
    available, and should structure business cases to remain viable on existing market
    revenue streams (e.g. FCAS) during that interval.
