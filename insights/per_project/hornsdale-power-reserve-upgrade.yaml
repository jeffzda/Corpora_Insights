  source_title: 'NEOEN ''HPRX'' Operations Public Report #1'
  publish_date: 2023-02
  project_name: Hornsdale Power Reserve Expansion (HPRX)
  what_happened: During VMM hold-point testing, an anomaly was observed in data recorded
    at the 275kV meter that was not present at the HPR inverter meter. Investigation
    identified the cause as 'sympathetic inrush' — an electromagnetic phenomenon occurring
    when an unenergised transformer is switched into service while parallel transformers
    are already in operation.
  lesson_learnt: When using transformer energisation to create a controlled grid disturbance
    for commissioning tests, project teams should account for sympathetic inrush effects
    that can introduce anomalies in metering data at the disturbance source which
    do not appear at the asset under test — understand the physical relationship between
    the test asset and the adjacent transformer before designing the test.
  issue_severity: minor
