  what_happened: During the major NEM grid event on 13 February 2024 (Moorabool-Sydenham
    500kV line trip causing cascading generator losses), HPR's grid-forming VMM provided
    reactive power support that responded prior to the peak magnitude of the voltage
    disturbance — a response speed not achievable by grid-following inverters.
  lesson_learnt: Grid-forming inverter capability (VMM) enables reactive power response
    ahead of peak voltage disturbance, providing superior voltage support compared
    to grid-following systems; this should be specified as a requirement for BESS
    providing system strength services in weak or high-renewable grids.
