  project_name: Hornsdale Power Reserve Expansion (HPRX) – Virtual Machine Mode
  what_happened: At the time of the project, no market existed for inertia services
    in the NEM, meaning the project delivered no direct commercial revenue from VMM
    operation and the economic case was supported entirely by grant funding rather
    than market revenues.
  lesson_learnt: Developers considering BESS projects that provide virtual inertia
    should note that no inertia market exists in the NEM as of the project's conclusion
    — the AEMC has introduced Very Fast FCAS as the closest market proxy, but projects
    should not assume inertia service revenues will materialise and should structure
    business cases around available ancillary services markets (e.g. Very Fast FCAS)
    rather than speculative inertia payments.
