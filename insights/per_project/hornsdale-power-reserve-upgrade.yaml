  source_title: HPRX Virtual Machine Mode (VMM) Modelled vs Actual Report
  publish_date: 2023-02
  project_name: Hornsdale Power Reserve Expansion (HPRX)
  what_happened: The NER 5.3.9 connection alteration process for implementing Virtual
    Machine Mode (VMM) on a 150MW BESS required a staged regulatory approval pathway
    — including desktop scoping with AEMO, laboratory bench testing at a Tesla US
    facility, provision of high-resolution waveform data, and a limited dual-inverter
    trial before full-scale approval was granted. The process took from late 2020
    through to July 2022 before VMM was permanently enabled at full scale.
  lesson_learnt: For novel BESS operating modes requiring a 5.3.9 connection alteration,
    plan for a multi-stage regulatory validation process (lab testing → limited field
    trial → full-scale submission) and engage AEMO and the NSP early — the HPR process
    has now established a replicable pathway that subsequent BESS projects can follow.
