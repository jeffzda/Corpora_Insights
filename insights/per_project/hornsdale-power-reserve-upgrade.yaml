  what_happened: The dependability of virtual inertia from inverter-based BESS varies
    from facility to facility depending on each asset's active power setpoint and
    operational dispatch patterns, meaning aggregated inertia from multiple BESS assets
    cannot be assumed to be consistently available across the NEM.
