  what_happened: The inertia contribution from VMM-enabled BESS inverters diminishes
    as the active power setpoint increases toward maximum output, because available
    headroom for additional power injection is reduced — unlike synchronous generators
    where inertia is fixed by rotor mass regardless of operating point.
  lesson_learnt: BESS providing synthetic inertia (VMM) must maintain sufficient active
    power headroom below maximum output to deliver contracted inertia responses —
    operational dispatch strategies should reserve a headroom buffer, and this constraint
    should be communicated clearly to market operators assessing BESS inertia dependability.
