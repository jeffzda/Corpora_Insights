- record_id: ARENA-DLV-65513
  source_title: Neoen - Hornsdale Power Reserve Upgrade - Project Summary Report
  publish_date: 2023-12
  project_name: Hornsdale Power Reserve Expansion (HPRX) – Virtual Machine Mode
  what_happened: The VMM inertia constant selection required any change to trigger
    a complete re-submission of modelling to AEMO — a single H constant had to be
    fixed before the 5.3.9 submission could proceed, forcing preliminary studies across
    three H constant settings (VMM1, VMM2, VMM3) to be completed and shared with stakeholders
    before a final value was selected.
  lesson_learnt: When submitting a 5.3.9 connection alteration for a novel BESS operating
    mode, any parameter that triggers a complete re-modelling requirement must be
    locked in before submission — conduct preliminary parametric studies early and
    secure stakeholder alignment on the final value before committing to the submission
    package to avoid costly resubmissions.
