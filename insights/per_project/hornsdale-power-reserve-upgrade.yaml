    VRE penetration, the cost of frequency control services escalates significantly
    as synchronous inertia declines — project developers in such regions should assess
    whether BESS with synthetic inertia capability can substitute for costly synchronous
    plant and reduce system-wide frequency control costs as a project value proposition.
