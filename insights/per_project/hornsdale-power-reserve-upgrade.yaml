- record_id: ARENA-DLV-65510
  source_title: Neoen - Hornsdale Power Reserve Upgrade - Project Summary Report
  publish_date: 2023-12
  project_name: Hornsdale Power Reserve Expansion (HPRX) – Virtual Machine Mode
  what_happened: The inertia contribution of VMM-enabled inverters is constrained
    by available headroom between current active power output and maximum operating
    limit — as active power setpoint increases, the inertia contribution reduces,
    unlike synchronous generators where inertia is inherently linked to rotating mass
    and velocity.
  lesson_learnt: When designing BESS dispatch strategies for assets providing virtual
    inertia services, account for the headroom constraint — the inertia contribution
    degrades as the battery is dispatched toward its maximum limit, and operational
    protocols must reserve sufficient headroom to guarantee the contracted inertia
    response under credible dispatch scenarios.
  issue_severity: moderate
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
