  what_happened: Event-triggered metering using SEL-735 power quality meters installed
    on trial inverters was unreliable — settings that were too sensitive filled the
    meter cache with nuisance data, while settings that were not sensitive enough
    missed real events, resulting in poor event capture during the dual inverter trial.
