  what_happened: The evolving complexity of grid connection and 5.3.9 studies — driven
    by new generators being added to the SA network throughout the project's lifespan
    — required repeated updates to the model base-case provided by ElectraNet, each
    addition taking significant time to incorporate and extending the 5.3.9 works
    beyond original plans.
