  what_happened: Mandatory Primary Frequency Response (PFR) was introduced in 2020,
    requiring all dispatched scheduled and semi-scheduled generators to automatically
    respond to frequency deviations. While this improved system frequency stability
    (contributing to lower FCAS requirements from 2021), it also imposed continuous
    active power adjustments on BESS assets dispatched above 0MW, increasing battery
    cycling and wear.
  lesson_learnt: Mandatory PFR obligations imposed on BESS assets increase battery
    cycling and accelerate degradation — BESS developers should model the operational
    impact of mandatory PFR on battery life and warranty conditions at the design
    stage, and negotiate appropriate degradation provisions in offtake or ancillary
    service agreements.
