  publish_date: 2023-10
  project_name: Hornsdale Power Reserve Expansion (HPRX)
  what_happened: The AEMC introduced the Very Fast Frequency Control Ancillary Service
    (VFFCAS) — a new 1-second contingency FCAS market — commencing 9 October 2023,
    which simultaneously opens new revenue streams for fast-responding inverter-based
    assets and removes the existing 'multiplier effect' that allowed providers to
    register in 6-second contingency FCAS markets at levels significantly above 100%
    of nominal capacity.
  lesson_learnt: Regulatory changes to FCAS market rules can materially alter the
    commercial position of operating BESS assets — both creating new opportunities
    and removing existing revenue advantages. BESS operators should actively monitor
    AEMC rule-making processes and complete required studies and market resubmissions
    well ahead of implementation dates to preserve registered capacity and maintain
    revenue continuity.
  issue_severity: moderate
  project_type: storage
  project_scale_band: utility/large-scale
  lifecycle_phase: operations
  proponent_type: project developer
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: re-scoped/adapted
  secondary_failure_mode: commercial & market
  intervention_note: HPR completed the necessary studies and made the required submissions
    to AEMO ahead of the VFFCAS commencement date, with registered capacities expected
    to be 85MW across all contingency markets.
  transferability: broad
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id004
  - 14
  - 15
  - 16
  evidence_excerpt: With the introduction of VFFCAS, the registered contingency FCAS
    capacity of all providers will be capped to the active power response across the
    relevant measurement windows, effectively removing the ability to 'bias' the 6-second
    markets... The introduction of VFFCAS will introduce new revenue streams but will
    remove the past benefits of the ability to 'bias' the 6-second markets.
