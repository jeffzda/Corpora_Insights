  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: A compromise H constant was selected that balanced inertia maximisation
    against interconnector post-fault recovery compliance, delivering ~2,070MWs rather
    than the originally envisaged 3,000MWs.
  transferability: moderate
  delay_magnitude: null
  technology_domain: battery storage
