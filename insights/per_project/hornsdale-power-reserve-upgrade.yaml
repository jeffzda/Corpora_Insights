  project_name: Hornsdale Power Reserve Expansion (HPRX)
  what_happened: No inertia market exists in the NEM as at H1 2024; HPR provides synthetic
    inertia through VMM using headroom within FCAS market participation but receives
    no direct revenue for inertia services despite AEMO identifying an inertia shortfall
    requiring 6,000 MWs in South Australia.
  lesson_learnt: BESS projects implementing synthetic inertia capability should not
    rely on inertia market revenues in their business case until at least 2027–2028
    when an Inertial Ancillary Services market is earliest expected; developers should
    structure revenue models around FCAS markets and ensure VMM can be co-optimised
    with FCAS participation.
