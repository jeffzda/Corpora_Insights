    plant and high VRE penetration — resulted in FCAS costs that were particularly
    elevated in SA due to limited synchronous generation, weak interconnection, and
    reliance on a small pool of high-priced local FCAS providers. This structural
    cost problem motivated the HPRX investment in VMM synthetic inertia capability.
