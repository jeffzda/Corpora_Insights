  source_title: Neoen - Hornsdale Power Reserve Upgrade - HPRX Market Report
  publish_date: 2023-12
  project_name: Hornsdale Power Reserve Expansion (HPRX)
  what_happened: At the time of the HPRX Enhanced FCAS trial, the MASS v7 did not
    explicitly recognise faster-than-6-second responses from large-scale BESS. HPR
    could respond in less than 6 seconds but could only benefit indirectly through
    a 'biased ramp' multiplier effect, which was later abolished with the introduction
    of MASS v8 and Very Fast FCAS (1 second) markets in October 2023.
  lesson_learnt: Market rules that fail to explicitly recognise fast-responding technologies
    create a revenue gap that limits investment signals — BESS developers should proactively
    demonstrate faster-than-required response capabilities and engage with MASS review
    processes to ensure market specifications evolve to capture the full value of
    their technology's performance.
