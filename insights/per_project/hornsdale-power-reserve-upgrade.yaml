  project_name: Hornsdale Power Reserve Expansion (HPRX)
  what_happened: Virtual Machine Mode (VMM) was implemented on 22 July 2022 and remained
    continuously in service throughout H2 2023, with performance consistent with expectations
    and no adverse impacts detected. VMM demonstrated grid-forming behaviour by responding
    to Rate of Change of Frequency (ROCOF) ahead of frequency deviation, providing
    a more stabilising effect than a conventional grid-following response.
  lesson_learnt: Grid-forming inverter modes such as VMM can be operated continuously
    at utility scale without adverse grid impacts, and their leading response to ROCOF
    delivers a measurably superior stabilising effect compared to grid-following operation
    — future BESS deployments should consider VMM or equivalent grid-forming capability
    as a standard offering.
