  source_title: Hornsdale Power Reserve Virtual Machine Mode Testing Summary Report
  publish_date: 2022-03
  project_name: Hornsdale Power Reserve Expansion (HPRX) – Virtual Machine Mode
  what_happened: Tesla inverters operating in VMM have a maximum overload rating of
    only 1.2 pu, compared with 5–10 pu for synchronous machines, meaning the transient
    current saturates at a lower value during grid disturbances — a fundamental hardware
    constraint that differentiates inverter-based virtual inertia from synchronous
    machine inertia.
  lesson_learnt: When comparing VMM-enabled BESS inertia with synchronous machine
    inertia, account for inverter current saturation limits (1.2 pu vs 5–10 pu for
    synchronous machines) — models and regulatory assessments that treat the responses
    as equivalent at the same H constant will overstate BESS inertial contribution
    during severe disturbances.
