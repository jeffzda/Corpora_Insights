  project_name: Hornsdale Power Reserve Expansion (HPRX)
  what_happened: During the 3 April 2024 Eraring Power Station trip (~1,000 MW lost),
    HPR's VMM active power response peaked prior to the maximum frequency deviation
    because VMM responds to RoCoF rather than frequency deviation, causing the battery
    to lead frequency changes rather than lag them — providing a more stabilising
    effect than a grid-following response.
  lesson_learnt: VMM/grid-forming BESS responses that act on RoCoF rather than frequency
    deviation systematically exceed grid-following FCAS compliance requirements during
    high-RoCoF events; regulatory compliance frameworks that assume grid-following
    behaviour will understate the stabilisation benefit delivered by grid-forming
    assets and should be updated.
