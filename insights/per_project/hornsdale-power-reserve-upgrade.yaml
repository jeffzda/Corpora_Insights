  source_title: Hornsdale Power Reserve Expansion Final Project Report
  publish_date: '2024-08-07'
  project_name: Hornsdale Power Reserve Expansion (HPRX)
  what_happened: 'The upgrade from SIPS to WAPS required two major additional workstreams
    not originally required under the SIPS: (1) full redundancy of the HPR control
    system (SMC and RTAC), which had not previously been redundant despite the SIPS
    having two redundant communication paths; and (2) a bidirectional (charge and
    discharge) response capability replacing the prior discharge-only response.'
  lesson_learnt: When upgrading a BESS from a legacy network protection scheme (SIPS)
    to an enhanced scheme (WAPS), anticipate requirements for full control system
    redundancy and bidirectional response capability as likely preconditions — scoping
    only the communication and software elements without assessing hardware redundancy
    can lead to significant additional site works.
