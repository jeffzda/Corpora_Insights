  source_title: Neoen - Hornsdale Power Reserve Upgrade - HPRX Market Report
  publish_date: 2023-12
  project_name: Hornsdale Power Reserve Expansion (HPRX)
  what_happened: The HPRX project successfully demonstrated that large-scale BESS
    equipped with Tesla's Virtual Machine Mode (VMM) can provide synthetic inertia
    by responding proportionally to the Rate of Change of Frequency (RoCoF), closely
    mimicking the inertial response of synchronous machines. VMM-enabled inverters
    reached peak output before the frequency nadir, effectively mitigating high RoCoF
    during contingency events.
  lesson_learnt: Large-scale BESS with grid-forming inverter technology (VMM) can
    provide synthetic inertia services that closely emulate synchronous machine behaviour
    — project teams developing BESS should consider grid-forming capability as a design
    requirement where the host network faces declining synchronous inertia, as this
    capability reduces FCAS requirements and improves system stability at minimal
    additional cost.
