- record_id: ARENA-DLV-1657
  source_title: Hornsdale Power Reserve Virtual Machine Mode Testing Summary Report
  publish_date: 2022-03
  project_name: Hornsdale Power Reserve Expansion (HPRX) – Virtual Machine Mode
  what_happened: When assessing the inertia delivered by a VMM-enabled inverter, focusing
    solely on the inertia constant H was found to be insufficient — the damping inertia
    and associated parameters (damping D, P follower time constant Td, and grid nominal
    frequency F) were found to be equally important contributors to the total inertial
    response.
  lesson_learnt: For VMM-enabled BESS, specify and assess both the rotor inertia constant
    H and the damping inertia parameters (D, Td, F) when characterising inertial response
    — the H constant alone does not capture the full inertial contribution, and studies
    or regulatory submissions based only on H will understate or misrepresent the
    total response.
  issue_severity: minor
