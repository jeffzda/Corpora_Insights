  source_title: Neoen - Hornsdale Power Reserve Expansion - HPRX Operations Report
    H1 2023
  publish_date: 2023-10
  project_name: Hornsdale Power Reserve Expansion (HPRX)
  what_happened: AEMO analysis established that the inertia contribution from an inverter-based
    BESS diminishes as the active power setpoint approaches maximum capacity, because
    available headroom shrinks — unlike synchronous generators where inertia is inherently
    linked to rotating mass and is not constrained by output headroom.
  lesson_learnt: 'BESS projects offering virtual inertia services must explicitly
    account for the headroom constraint: as active power setpoint approaches 1 per
    unit, the inertial response is greatly diminished. Operators should reserve sufficient
    output headroom — HPR operates below 0.53pu to maintain meaningful inertial capability
    — and this headroom requirement should be factored into dispatch strategy and
    market registration.'
