    full-scale hold-point testing, and monitored operational period — provides the
    progressive evidence base required to satisfy AEMO/TNSP confidence for approving
    novel BESS operating modes on critical grid assets; this pathway is now available
    as a reference for subsequent BESS projects seeking to implement grid-forming
    capabilities.
