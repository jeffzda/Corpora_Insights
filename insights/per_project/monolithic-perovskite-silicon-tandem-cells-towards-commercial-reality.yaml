  source_title: 'Monolithic Perovskite-Silicon Tandem Cells: Towards Commercial Reality
    - Project Results and Lessons Learnt 2'
  publish_date: 2022-03
  project_name: 'Monolithic Perovskite-Silicon Tandem Cells: Towards Commercial Reality'
  what_happened: The project successfully demonstrated a two-way collaborative model
    between ANU researchers and Jinko Solar, enabling silicon cells to be fabricated
    by Jinko to a modified design and shipped to ANU for perovskite deposition, resulting
    in tandem cells achieving 27.6% efficiency on a 1cm² cell and 24.6% on a 4cm²
    cell.
  lesson_learnt: Embedding a commercial manufacturing partner (such as a solar cell
    OEM) directly into a research project from design through fabrication enables
    research outputs to be validated on industrially relevant substrates — this collaboration
    model shortened the path to commercial transferability and should be replicated
    for other pre-commercial solar technology development programmes.
