- record_id: ARENA-DLV-65702
  source_title: 'Monolithic Perovskite-Silicon Tandem Cells: Towards Commercial Reality
    - Project Results and Lessons Learnt 2'
  publish_date: 2022-03
  project_name: 'Monolithic Perovskite-Silicon Tandem Cells: Towards Commercial Reality'
  what_happened: The project identified that the interface between the nickel oxide
    transport layer and the perovskite film was the dominant source of energy losses
    limiting cell efficiency, requiring an additional investigation and remediation
    step not originally anticipated.
  lesson_learnt: Systematic loss-attribution experiments should be conducted early
    in perovskite device development to isolate dominant efficiency limiters — in
    this project, identifying the nickel oxide/perovskite interface as the primary
    loss site enabled a targeted polymer interlayer solution that delivered significant
    efficiency gains, and this diagnostic approach is applicable across perovskite
    architectures.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: Introduced a long-chain organic polymer interlayer at the nickel
    oxide/perovskite interface, producing a more uniform film thickness that reduced
    energy losses and improved efficiency.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id002
  - 4
  evidence_excerpt: identified the interface between one of the transport layers (consisting
    of nickel oxide) and the perovskite film... long-chain organic polymers could
    provide the greatest performance improvement, which we showed to be due to the
    influence of the polymer chain length on the thickness of the film.
