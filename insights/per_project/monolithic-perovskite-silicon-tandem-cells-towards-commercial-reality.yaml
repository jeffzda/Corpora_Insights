  publish_date: 2022-03
  project_name: 'Monolithic Perovskite-Silicon Tandem Cells: Towards Commercial Reality'
  what_happened: The project demonstrated a measurable efficiency drop between small-area
    (1cm², 27.6%) and larger-area (4cm², 24.6%) perovskite-silicon tandem cells, quantifying
    the scale-up penalty at approximately 3 percentage points under ANU lab conditions.
  lesson_learnt: Scale-up from 1cm² to 4cm² tandem cells incurs a material efficiency
    penalty (~3 percentage points in this project) that should be explicitly budgeted
    for in performance forecasts — programmes should test at multiple cell areas from
    early stages and not extrapolate small-area results to module-scale performance
    without dedicated large-area fabrication and measurement work.
