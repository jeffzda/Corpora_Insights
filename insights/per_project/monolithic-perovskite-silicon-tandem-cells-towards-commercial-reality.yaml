  secondary_failure_mode: null
  intervention_note: Implemented inorganic transport layers deposited by appropriate
    methods, obtaining dense films almost entirely free of local imperfections, which
    in combination with a compact perovskite film significantly improved fabrication
    reliability.
  transferability: moderate
