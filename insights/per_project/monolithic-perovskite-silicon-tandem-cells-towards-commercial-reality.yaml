- record_id: ARENA-DLV-65701
  source_title: 'Monolithic Perovskite-Silicon Tandem Cells: Towards Commercial Reality
    - Project Results and Lessons Learnt 2'
  publish_date: 2022-03
  project_name: 'Monolithic Perovskite-Silicon Tandem Cells: Towards Commercial Reality'
  what_happened: Initial cell fabrication processes on commercial silicon wafers produced
    low reliability — approximately half of fabricated cells displayed efficiencies
    below 20% due to shunt paths forming from imperfections in the perovskite film
    and transport layers deposited over the rough silicon surface.
  lesson_learnt: When depositing perovskite films on rough commercial silicon surfaces,
    prioritise inorganic transport layers deposited by methods that produce dense,
    defect-free films — this was the critical intervention that lifted fabrication
    yield from ~50% to near-full reliability and is directly transferable to other
    perovskite device architectures.
  issue_severity: moderate
