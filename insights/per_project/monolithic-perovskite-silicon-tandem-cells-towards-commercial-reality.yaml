- record_id: ARENA-DLV-65703
  source_title: 'Monolithic Perovskite-Silicon Tandem Cells: Towards Commercial Reality
    - Project Results and Lessons Learnt 2'
  publish_date: 2022-03
  project_name: 'Monolithic Perovskite-Silicon Tandem Cells: Towards Commercial Reality'
  what_happened: Prior laboratory-stage work on perovskite-silicon tandems had universally
    used expensive, specially polished silicon wafers rather than mass-produced commercial
    wafers, creating a fundamental barrier to commercialisation that this project
    was designed to address.
  lesson_learnt: R&D programmes targeting commercial deployment should be designed
    from the outset around commercially available substrates and fabrication processes
    rather than laboratory-optimised materials — the cost and incompatibility of lab-grade
    silicon wafers with commercial manufacturing was a known barrier that required
    a dedicated project to resolve, and earlier engagement with manufacturers would
    accelerate this transition.
