  what_happened: The project demonstrated that high-efficiency perovskite-silicon
    tandem cells could be fabricated on the naturally rough, textured surface of commercial
    silicon cells without the polishing step that would otherwise be required, addressing
    a key cost barrier to commercialisation.
  lesson_learnt: Processes that can accommodate the rough texture of commercial silicon
    surfaces are a prerequisite for cost-competitive tandem solar cell manufacturing
    — demonstrating deposition of continuous perovskite films over unpolished surfaces
    without efficiency penalty is a critical milestone that future programmes should
    build on rather than reverting to polished substrates for convenience.
