- record_id: ARENA-DLV-72033
  source_title: Australian Energy Resource Assessment – Second edition, 2014
  publish_date: '2014'
  project_name: Global Biofuel Production (2012 Stall)
  what_happened: Global biofuel production growth stalled in 2012 despite a decade
    of steady growth, as extreme weather conditions reduced feedstock production volumes
    and drove up feedstock prices. The feedstock cost sensitivity of first-generation
    biofuels (sugar and starch-based) was exposed as a material commercial risk when
    agricultural yields were disrupted.
  lesson_learnt: First-generation biofuel projects dependent on food-crop feedstocks
    carry inherent feedstock price and supply volume risk driven by agricultural weather
    events; project feasibility and commercial structures should model feedstock price
    volatility scenarios explicitly and consider contractual mechanisms (e.g. price-linked
    offtake, feedstock diversification) to manage this exposure.
