- record_id: ARENA-DLV-45015
  source_title: Network Hosting Capacity Projects Progress Report (Year One)
  publish_date: 2020-03
  project_name: 'University of Tasmania: Optimal DER Scheduling for Frequency Stability'
  what_happened: Detailed modelling of inverter-interfaced DER (PV, batteries, EVs,
    heat pumps, and resistive loads) demonstrated that these resources can provide
    fast frequency responses with less frequency deviation and smaller settling time
    than conventional generation, particularly in systems with decreasing physical
    inertia — but the network-constrained bidding optimisation software, while implemented,
    required further development before it was fit for market integration testing.
  lesson_learnt: Inverter-based DER can technically substitute for synchronous inertia
    in frequency response, but translating this into market-ready optimisation software
    requires considerably more development time than the modelling itself — projects
    aiming to demonstrate DER participation in FCAS markets should separate the modelling
    milestone from the market integration software milestone and allocate additional
    development contingency for the latter.
