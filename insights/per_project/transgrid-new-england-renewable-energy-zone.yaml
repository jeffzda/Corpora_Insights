  what_happened: Following the non-binding bids phase, it became clear that progressing
    directly to binding bids was not feasible because of unresolved uncertainties
    in property acquisition, project approvals, AEMC rule changes, GPS studies, MLF
    studies, and FID coordination. Lumea introduced an unplanned 'Development Phase'
    estimated at 12–18 months.
  lesson_learnt: When structuring a novel competitive transmission capacity model,
    plan for a collaborative development phase between non-binding and binding bids
    — attempting to move directly to binding bids without resolving technical design,
    regulatory, property, and risk-allocation uncertainties will result in heavily
    caveated bids that cannot be confidently evaluated.
