- record_id: ARENA-DLV-43916
  source_title: Lumea RFC Process Report 2
  publish_date: 2021-06
  project_name: New England Connection Capacity Auction (NECCA) / New England Transmission
    Infrastructure (NETI)
  what_happened: Proponents broadly supported inclusion of a sunset clause in capacity
    agreements requiring the return of access rights if project development milestones
    were not met, but were concerned about losing security if a sunset clause was
    triggered by events outside their control — such as delays caused by Lumea.
  lesson_learnt: Sunset clauses in capacity agreements for unregulated transmission
    must be carefully structured so they apply only to developer-caused delays — if
    the sunset can be triggered by the infrastructure developer's own delays, proponents
    will not accept security at risk, and the clause will become a deal-breaker rather
    than a useful discipline mechanism.
