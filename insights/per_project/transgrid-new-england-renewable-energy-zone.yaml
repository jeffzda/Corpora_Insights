  source_title: Lumea New England Renewable Energy Zone Final Report
  publish_date: 2021-07
  project_name: NECCA (New England Connection Capacity Auction)
  what_happened: Lumea developed and tested a novel market-based auction model (NECCA)
    to fund enabling transmission infrastructure for the New England REZ. The EOI
    phase received 23 submissions totalling 6,900 MW and the RFC phase received 7
    compliant bids totalling 2.6 GW — approximately 1.4 times oversubscribed — confirming
    strong market demand for the commercial model.
  lesson_learnt: 'A market-based auction model for privately funded transmission infrastructure
    is viable and can attract strong developer interest: the NECCA EOI/RFC process
    confirmed that renewable energy developers will co-invest in enabling network
    infrastructure in exchange for firm capacity rights, providing a replicable commercial
    template for other REZ developments.'
