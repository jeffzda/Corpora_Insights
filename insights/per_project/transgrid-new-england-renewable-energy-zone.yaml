  what_happened: Proponents indicated that slippage in the NETI development and construction
    timeline was a significant contracting risk because many of their PPAs contained
    sunset dates with liquidated damages clauses, meaning delays to transmission delivery
    directly threatened their offtake agreements.
  lesson_learnt: Unregulated transmission infrastructure developers must treat construction
    schedule certainty as a commercial commitment to connected generators — PPA sunset
    dates with liquidated damages mean that any transmission delay translates directly
    into proponent financial liability; the NETI must be project-managed to tighter
    delivery standards than regulated transmission assets.
