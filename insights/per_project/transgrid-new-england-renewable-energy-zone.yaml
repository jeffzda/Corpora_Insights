  what_happened: Four of the eighteen EOI submissions were non-conforming — proponents
    had submitted projects that could not directly connect to the NETI and instead
    required traversal of the shared grid, contrary to the intent of the EOI framework.
  lesson_learnt: For novel transmission access processes, EOI eligibility criteria
    should explicitly and unambiguously specify physical connection requirements;
    without this, a material proportion of submissions will be non-conforming and
    require separate evaluation treatment.
