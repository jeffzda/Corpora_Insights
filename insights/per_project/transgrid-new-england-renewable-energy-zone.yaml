- record_id: ARENA-DLV-43908
  source_title: Lumea RFC Process Report 2
  publish_date: 2021-06
  project_name: New England Connection Capacity Auction (NECCA) / New England Transmission
    Infrastructure (NETI)
  what_happened: The non-binding bid stage was structured with limited direct technical
    engagement between proponents and Lumea's technical resources, relying primarily
    on the Capacity Allocation Advisor as intermediary. Proponents specifically requested
    the ability to pose technical questions directly to Lumea during the bidding process.
  lesson_learnt: In a novel infrastructure auction process, make key technical resources
    from the infrastructure developer directly accessible to proponents during the
    bid development phase — routing all engagement through a financial advisor creates
    information gaps on technical matters that undermine bid quality and proponent
    confidence.
