  what_happened: 'The proposed batching of Generator Performance Standards (GPS) applications
    for multiple generators simultaneously connecting to the NETI was identified as
    a risk: when multiple connections are processed together, attribution of compliance
    issues to individual generators becomes ambiguous, creating risk allocation disputes.'
  lesson_learnt: When facilitating batched or simultaneous generator connections to
    shared transmission infrastructure, project developers should establish clear
    contractual provisions for GPS risk allocation between generators before connection
    enquiries are made — ambiguity over which generator contributes to a compliance
    issue can stall connection approvals for all participants.
