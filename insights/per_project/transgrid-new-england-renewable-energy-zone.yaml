  what_happened: The NECCA model routes transmission infrastructure outside the regulated
    asset base, avoiding the Regulatory Investment Test for Transmission (RIT-T) and
    associated regulatory approval processes. This enabled faster development timelines
    compared to regulated network augmentation.
  lesson_learnt: Structuring enabling transmission infrastructure as a merchant (non-regulated)
    asset rather than a regulated network augmentation can significantly accelerate
    development timelines by avoiding the RIT-T process — however, this trade-off
    requires accepting the absence of compulsory acquisition powers and increased
    commercial risk for the infrastructure developer.
