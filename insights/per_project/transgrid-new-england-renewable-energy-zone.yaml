- record_id: ARENA-DLV-1607
  source_title: TransGrid Services – New England Connection Capacity Auction - Knowledge
    Sharing Report – 1 EOI Phase
  publish_date: '2020-09-08'
  project_name: New England Connection Capacity Auction (NECCA)
  what_happened: The current NEM regulatory framework — based on individual generator
    connections to existing regulated transmission infrastructure — provides minimal
    scope to coordinate generation and transmission investment, making REZ development
    cumbersome and slow through conventional regulatory processes such as the RIT-T.
  lesson_learnt: Projects seeking to develop Renewable Energy Zones through conventional
    regulatory pathways face structural timing mismatches with the pace of the energy
    transition; commercial non-regulated models that bypass the RIT-T process can
    move materially faster and should be tested where a suitable transmission easement
    exists.
  issue_severity: major
  project_type: network/grid
  project_scale_band: first commercial/FOAK
  lifecycle_phase: concept/feasibility
  proponent_type: network business
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: TransGrid Services designed the NECCA as a commercial, non-regulated
    model to bypass RIT-T constraints and test market-based co-investment in transmission
    and generation.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: grid/system stability
  source_pages: &id005
  - 4
  evidence_excerpt: REZs are slow to develop through the conventional regulatory processes
    because current frameworks do not adequately anticipate the scale and speed of
    the energy transformation at hand.
