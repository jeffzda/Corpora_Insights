  what_happened: Proponents concluded that Battery Energy Storage Systems (BESS) should
    be owned and operated directly by individual generators rather than shared across
    NECCA participants, because batteries would be deployed primarily for individual
    profit-seeking (energy arbitrage, FCAS) and agreeing shared commercial arrangements
    across multiple proponents was considered impractical.
  lesson_learnt: When designing shared transmission infrastructure connecting multiple
    renewable generators, do not attempt to pool BESS as a shared asset — the profit-seeking
    nature of battery dispatch makes multi-party commercial arrangements unworkable;
    structure BESS as individual generator assets while planning shared access to
    the transmission infrastructure.
