  evidence_excerpt: The quality of the ore matters - many ore mined and exported by
    Australia is hematite, which is well suited to BF/BOF, but less suitable for DRI/EAF.
    There's an opportunity for Australia to either expand magnetite ore mining or
    to develop new technologies to process hematite ore (e.g., HDRI-Melter-BOF).
