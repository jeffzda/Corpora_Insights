- record_id: ARENA-DLV-69017
  source_title: ARENA Insights Forum Session Summaries and Key Points
  publish_date: 2022-11
  project_name: Green steel initiatives — Australian ore quality (Rio Tinto / BlueScope
    / Calix)
  what_happened: Australian iron ore exports are predominantly hematite, which is
    well-suited to the legacy BF-BOF steelmaking pathway but less suitable for the
    emerging DRI/EAF low-carbon pathway. This creates a structural mismatch between
    Australia's primary ore export product and the global steel industry's decarbonisation
    trajectory.
  lesson_learnt: Australian green steel project developers and investors should assess
    ore grade compatibility with DRI/EAF pathways at the concept stage — hematite
    ore requires either premium pricing, new processing technology (e.g. HDRI-Melter-BOF),
    or a shift to magnetite ore mining to be viable in a low-carbon steel industry.
