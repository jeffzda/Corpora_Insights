  publish_date: 2025-04
  project_name: CER Data Exchange Industry Co-Design
  what_happened: The co-design process identified that the CER Data Exchange could
    leverage the Industry Data Exchange (IDX) and Identity and Access Management (IDAM)
    capabilities already being built under the Market Interface Technology Enhancement
    (MITE) project, reducing incremental implementation costs.
  lesson_learnt: Before scoping new digital infrastructure, audit related programs
    already funded and in delivery — building on existing authentication, access control,
    and data exchange foundations already under development can materially reduce
    costs and avoid duplication.
