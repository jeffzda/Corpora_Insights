  what_happened: The CER Data Exchange implementation timeline was deliberately aligned
    with three concurrent regulatory and market reforms — the IPRR Rule Change, the
    MITE project go-live, and the National CER Roadmap — to ensure the platform would
    be available when those reforms required it.
  lesson_learnt: Digital infrastructure programs that underpin regulatory reform must
    explicitly map their delivery timeline to dependent regulatory milestones — deploying
    ahead of or after a linked rule change wastes investment or leaves the rule change
    unoperationalisable.
