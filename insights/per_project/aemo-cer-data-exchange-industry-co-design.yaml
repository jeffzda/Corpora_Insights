  what_happened: DNSPs were at different stages of maturity in developing and implementing
    dynamic operating envelopes and dynamic network limits, and there was no standardised
    data format between DNSPs for sharing this information more broadly, presenting
    a significant barrier to the Efficient Sharing of Network Limits use case.
  lesson_learnt: Before designing a multi-party data sharing platform for network
