  source_title: AEMO CER Data Exchange Industry Co-Design - Knowledge Sharing Report
  publish_date: 2025-05
  project_name: CER Data Exchange Industry Co-Design
  what_happened: Some stakeholders were not convinced that the co-design process was
    genuinely open to alternative solutions, and there was reluctance by some parties
    to consider broader industry perspectives — creating residual distrust in the
    process even after its conclusion.
  lesson_learnt: Co-design processes must explicitly demonstrate openness to the problem
    and to alternative solutions from the outset — consulting on areas that are already
    decided and non-negotiable will undermine trust and create lasting perceptions
    of a predetermined outcome.
