  what_happened: Legacy data structures in the DER Register contain inconsistencies,
    gaps, and non-standardised formats that could compromise data integrity during
    migration to the new CER Data Exchange framework. Integration with existing DER
    Register processes requires careful planning to maintain operational continuity.
  lesson_learnt: Migrations of energy asset registers from legacy systems to new exchange
    platforms should use rigorous data profiling and cleansing before migration, staged
    migration with comprehensive validation gates, and parallel operation of old and
    new systems — attempting full-cut migration without these measures risks compromising
    data integrity and operational continuity.
