  what_happened: 'Voluntary participation in the flexibility capability discovery
    use case creates a network effect problem: the value of a shared bulletin board
    mechanism increases with adoption, but individual stakeholders may continue using
    existing point-to-point solutions rather than adopting standardised approaches,
    resulting in fragmented and incomplete visibility.'
  lesson_learnt: Voluntary data sharing platforms for energy markets face a network
    effect bootstrapping problem — develop stakeholder-specific value propositions
    and target initial deployment at participants with the clearest pain points rather
    than pursuing simultaneous broad adoption, using case studies and demonstrated
    value to drive organic growth.
