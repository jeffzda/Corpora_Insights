  what_happened: Multiple flexibility service market pathways (wholesale markets,
    FCAS, network support) operate in isolation with minimal coordination, inhibiting
    value stream stacking and cross-market optimisation. Market siloes lead to competing
    signals and potentially conflicting dispatch instructions, reducing overall economic
    value of flexibility resources.
