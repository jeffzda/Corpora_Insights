  what_happened: The divergence-then-convergence cycle — presenting multiple design
    options, facilitating debate, consolidating toward a shared view, and repeating
    — proved effective in building robust, grounded recommendations acceptable to
    industry, but required the project team to repeatedly revisit previously settled
    design decisions as new divergent views emerged.
  lesson_learnt: Structure major reform co-design processes around explicit diverge-converge
    cycles rather than assuming linear progress — stakeholders will relitigate settled
    questions, and anticipating this as a feature rather than a failure keeps the
    process on track and produces more durable outcomes.
