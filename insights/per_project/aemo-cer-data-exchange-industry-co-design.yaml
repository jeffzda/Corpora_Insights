  what_happened: Network limit data schema standardisation across DNSPs requires balancing
    uniformity with accommodation of regional variations. Automated transformation
    processes risk introducing errors if not properly validated, potentially compromising
    operational decisions based on network constraint data.
  lesson_learnt: Automated data transformation from bespoke DNSP schemas to a common
    standard should be validated against source systems in parallel before full transition
    — running a phased transformation approach with parallel validation gates prevents
    errors from compromising operational decisions during the migration period.
