  what_happened: Stakeholders raised concerns throughout the co-design process about
    data quality and consistency across DNSPs, aggregators, and marketplaces, identifying
    it as a fundamental challenge to the CER Data Exchange functioning as intended
    — particularly for telemetry, dispatch signals, and compliance reports.
  lesson_learnt: Address data quality and standardisation requirements as a primary
    design constraint — not an afterthought — when building a multi-party data exchange;
    heterogeneous data standards across participants will propagate into the platform
    and undermine the accuracy and timeliness of outputs regardless of the quality
    of the exchange infrastructure itself.
