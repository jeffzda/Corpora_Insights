    industry alignment on the CER Data Exchange high-level design, required hosting
    three major workshops, 15 EWG meetings, webinars and numerous bilateral meetings
    over nine months — a substantially larger stakeholder investment than a standard
    consultation process.
  lesson_learnt: Co-design reform processes require significantly more resourcing,
    time and stakeholder commitment than standard consultation — project sponsors
    and proponents should plan explicitly for the co-design overhead, including facilitator
    costs, pre-reading production, and the extended timeline required to achieve genuine
    alignment.
