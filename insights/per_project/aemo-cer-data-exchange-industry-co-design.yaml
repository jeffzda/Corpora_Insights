  project_name: CER Data Exchange Industry Co-Design
  what_happened: Through the co-design process, stakeholders expressed a clear preference
    for AEMO to own and operate the CER Data Exchange, favouring this over an independent
    government agency model due to lower setup costs and AEMO's existing expertise
    in operating industry-wide systems.
  lesson_learnt: When designing governance for shared digital infrastructure, leveraging
    an existing market operator's systems and expertise is preferred by industry over
    creating a new independent body — the cost and decision-making efficiency advantages
    outweigh any impartiality benefits of a new entity.
