  publish_date: 2025-04
  project_name: CER Data Exchange Industry Co-Design
  what_happened: Flexibility service providers currently navigate multiple market
    frameworks (FCAS, RERT, FFR, WDRM) and multiple NSPs through disparate registration
    processes, inconsistent data exchange mechanisms, and separate authentication
    requirements for each. This fragmentation disproportionately impacts smaller aggregators
    and new market entrants.
  lesson_learnt: Each market framework and NSP independently developing their own
    flexibility service registration and data exchange processes creates cumulative
    barriers that are particularly prohibitive for smaller providers — establishing
    a common registration standard and standardised APIs early in market development
    prevents lock-in to incompatible frameworks that become progressively more expensive
    to bridge.
