  what_happened: The build, test, and deploy stage (July 2026 to June 2027) was identified
    as the highest cost phase for all industry participants, driven by the cost of
    business logic, data integration, and data processing, with AEMO's largest cost
    occurring during detailed design.
  lesson_learnt: When planning budget and resource allocation for shared digital infrastructure
    programs, the build-test-deploy phase concentrates the largest industry-side costs
    — plan for peak resourcing demand in this window and ensure industry participants
    have confirmed capacity before committing to a delivery timeline.
