- record_id: ARENA-DLV-51022
  source_title: 'AEMO CER Data Exchange Industry Co-Design - Attachment A: High-Level
    Design'
  publish_date: 2025-04
  project_name: CER Data Exchange Industry Co-Design
  what_happened: International data exchange implementations (Elhub in Norway, ENTSO-E
    in EU, SWIFT and UK Open Banking, Singapore MyInfo, Estonia X-Road) provided design
    precedents that shaped the CER Data Exchange architecture, including separation
    of authentication from data transfer, schema enforcement, anomaly detection, and
    support for both synchronous and asynchronous processing.
  lesson_learnt: Designing national energy data exchanges should draw on international
    precedents from both the energy sector and other regulated data exchange domains
    — separating authentication from data transfer (as in European energy hubs), embedding
    schema enforcement and anomaly detection (as in financial sector exchanges), and
    supporting varied processing modes (as in government data exchanges) are proven
    patterns that reduce design risk.
