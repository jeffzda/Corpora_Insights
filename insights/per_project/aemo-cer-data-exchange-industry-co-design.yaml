  publish_date: 2025-04
  project_name: CER Data Exchange Industry Co-Design
  what_happened: Current regulatory frameworks do not fully support an obligation
    for DNSPs to share standardised network limit information, and the evolution toward
    Dynamic Operating Envelopes will require regulatory adaptation. The design must
    therefore begin with voluntary DNSP adoption and plan a staged transition to mandatory
    compliance.
  lesson_learnt: Where regulatory frameworks do not yet mandate data sharing practices,
    digital infrastructure programs should design for voluntary adoption first with
    a clear staged pathway to mandatory compliance — attempting to require participation
    before regulatory obligations are established will delay adoption; designing the
    transition pathway explicitly from the outset reduces later disruption.
