  project_name: CER Data Exchange Industry Co-Design
  what_happened: Network limit data formats, units of measurement, constraint definitions,
    and calculation methodologies vary significantly across DNSPs, creating interoperability
    challenges for market participants operating across multiple distribution network
    areas and preventing consistent approaches to network limit management.
  lesson_learnt: When DNSPs develop network constraint data sharing independently,
    format and definitional inconsistencies accumulate and create progressively larger
    integration barriers for aggregators and retailers — co-designing a common schema
    with DNSPs before deployment is essential, as retrofitting standardisation across
    existing bespoke systems is significantly more costly.
