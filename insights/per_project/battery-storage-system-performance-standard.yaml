- record_id: ARENA-DLV-40903
  source_title: Battery Storage System Performance Standard - Final Project Report
  publish_date: 2020-06
  project_name: Australian Battery Performance Standard (ABPS) Project
  what_happened: Stakeholder disagreement on battery testing pathways, use cases,
    and temperature/humidity profiles could not be resolved before the planned start
    of testing, preventing the initiation of battery testing activities until an additional
    unplanned industry workshop was convened.
  lesson_learnt: Resolve key technical scope decisions — such as testing pathways
    and use cases — through structured consensus workshops with broad industry representation
    before committing to a test schedule; leaving these decisions unresolved causes
    downstream schedule slippage and rework.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: stakeholder/land/community
  failure_mode: coordination & stakeholders
  outcome_class: delayed but recoverable
  secondary_failure_mode: poor scoping
  intervention_note: An additional industry workshop was held at CSIRO Clayton with
    25 participants including manufacturers, utilities and associations; three testing
    options were canvassed via a participant survey and the 13 proposed use cases
    were reduced to two, enabling the project to proceed.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id003
  - 28
  evidence_excerpt: There were different views among the stakeholder members regarding
    the Standard testing protocols, battery energy storage system use cases and temperature
    and humidity profiles that could not be resolved before the initially planned
    start of testing. Without having a broader industry consensus on these aspects,
    project testing could not be initiated... as a result of the additional unplanned
    SRG meeting and relevant preparation required, the start of the testing process
    was delayed relative to the original plan, which required substantial effort to
    get back on track.
