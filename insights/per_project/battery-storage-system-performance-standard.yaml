- record_id: ARENA-DLV-40906
  source_title: Battery Storage System Performance Standard - Final Project Report
  publish_date: 2020-06
  project_name: Australian Battery Performance Standard (ABPS) Project
  what_happened: During battery testing, a range of systems were found not to be performing
    as specified in their datasheets. It took multiple replicate tests to confirm
    that the units were underperforming rather than that there was an issue with the
    test protocols, consuming more time than allocated.
  lesson_learnt: Allocate additional time in battery testing programmes for a discovery
    phase to distinguish genuine unit underperformance from test protocol issues —
    replicate testing is required to reach this conclusion and the time required should
    be explicitly budgeted.
