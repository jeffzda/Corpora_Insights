- record_id: ARENA-DLV-40912
  source_title: Battery Storage System Performance Standard - Final Project Report
  publish_date: 2020-06
  project_name: Australian Battery Performance Standard (ABPS) Project
  what_happened: Battery performance metrics in the Australian residential and small
    commercial market were determined by each manufacturer using independent, non-disclosed
    methodologies, meaning metrics such as capacity, power output, and cycle life
    were not comparable between products and did not reflect real-world performance,
    creating a risk of widespread consumer confidence loss.
  lesson_learnt: The absence of a standardised performance testing and reporting framework
    for battery storage equipment creates material market barriers and consumer-confidence
    risks at scale; ARENA-funded standards development projects addressing this gap
    can enable informed procurement decisions and support broader renewable energy
    deployment.
