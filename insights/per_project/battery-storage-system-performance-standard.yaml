  what_happened: For some battery test objects, it would have been beneficial to involve
    the manufacturer earlier in the experimental design and evaluation phases; the
    absence of manufacturer involvement contributed to challenges with testing batteries
    outside their designed operating modes and interpreting unexpected results.
  lesson_learnt: Engage battery manufacturers early in the experimental design phase
    when their products are to be tested against externally developed protocols; manufacturer
    involvement reduces interface problems with proprietary BMS software and helps
    distinguish unit-level underperformance from protocol design issues — budget for
    this engagement explicitly.
