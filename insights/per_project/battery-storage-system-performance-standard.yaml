  what_happened: COVID-19 government restrictions in mid-March 2020 threatened to
    disrupt battery testing activities at CSIRO facilities due to reduced staffing
    levels. CSIRO was able to complete the majority of testing activities using remote
    operating capability combined with rotating staff on-site under social distancing
    requirements.
