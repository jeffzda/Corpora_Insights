- record_id: ARENA-DLV-40902
  source_title: Battery Storage System Performance Standard - Final Project Report
  publish_date: 2020-06
  project_name: Australian Battery Performance Standard (ABPS) Project
  what_happened: Budget and time for obtaining third-party real-life battery operational
    data were not fully accounted for in initial project planning. Some industry partners
    refused to share data due to commercial sensitivity; others required non-disclosure
    agreements whose negotiation took far longer than anticipated.
  lesson_learnt: When a project requires commercially sensitive third-party data,
    formalise data-sharing arrangements (such as MOUs or NDAs) at project inception
    and allocate explicit time and budget for their negotiation; a model similar to
    the ITP Renewables MOU should be adopted early to avoid bottlenecks during execution.
