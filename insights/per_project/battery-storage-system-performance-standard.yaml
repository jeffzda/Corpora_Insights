  source_title: Battery Storage System Performance Standard - Final Project Report
  publish_date: 2020-06
  project_name: Australian Battery Performance Standard (ABPS) Project
  what_happened: The stakeholder engagement process was more time-intensive than expected.
    SRG members reported being overburdened, survey response rates were low, and the
    Project Consortium had to revise its engagement plan, limiting SRG meetings to
    one per milestone.
  lesson_learnt: Design stakeholder engagement plans with flexible participation levels
    so that industry can engage more if willing but is not overburdened; budget significant
    extra time for one-on-one consultations, which require not only meeting time but
    additional effort to evaluate and reconcile feedback and identify bias.
