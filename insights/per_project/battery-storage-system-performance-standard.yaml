  outcome_class: policy/market influence only
  secondary_failure_mode: regulatory & approvals
  intervention_note: The ABPS and Industry Best Practice Guide were developed and
    submitted to Standards Australia on 21 May 2020 to address the standards gap.
  transferability: broad
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id012
  - 5
  evidence_excerpt: Currently, battery performance is determined by manufacturers,
    each utilising their own methods. Since the performance values are dependent on
    the measurement methodology, even simple metrics such as capacity, power output,
    and cycle life are not comparable between manufacturers... This can lead to situations
    where consumers believe that the systems are suitable for their intended application
    and then find performance and lifetime are well below expectations. A potential
    widespread loss of consumer confidence presents a critical risk for establishing
    a long-term, self-sustaining viable industry.
