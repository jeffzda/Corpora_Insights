- record_id: ARENA-DLV-40905
  source_title: Battery Storage System Performance Standard - Final Project Report
  publish_date: 2020-06
  project_name: Australian Battery Performance Standard (ABPS) Project
  what_happened: During battery testing, several commercial battery systems had onboard
    management software that made it extremely difficult to charge and discharge them
    to specific test profiles outside their designed operating modes, requiring more
    time than expected to design customised testers and electronics.
  lesson_learnt: When planning laboratory testing of commercial battery systems, engage
    manufacturers early in the experimental design phase to identify software and
    hardware constraints; require manufacturers to supply necessary hardware and software
    modifications as a condition of participation to avoid costly delays in developing
    customised test interfaces.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: technology vendor
  delay_category: commissioning/integration
  failure_mode: unvalidated technical assumptions
  outcome_class: delayed but recoverable
  secondary_failure_mode: poor scoping
  intervention_note: The issue was addressed in the Industry Best Practice Guide by
    requiring manufacturers to supply necessary hardware and software modifications
    (if required) to enable testing to be accomplished.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id005
  - 28
  evidence_excerpt: For some systems, the onboard management software and design meant
    that utilising them for purposes outside of what they were designed to do makes
    communication and charging/discharging to specific profiles extremely difficult.
    The Project Consortium understands that this was also discovered by previous ARENA
    projects for the same battery systems. It took longer than expected to design
    customised testers and electronics to enable effective control of the units for
    testing.
  confidence_note: null
