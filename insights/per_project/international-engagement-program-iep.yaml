  project_name: International Engagement Program (IEP)
  what_happened: The IEP's knowledge sharing planning and reporting requirements did
    not provide clear direction on the intended outcomes or target audiences for knowledge
    sharing activities. Each grantee developed their own knowledge sharing plan with
    different approaches, and plans focused on procedural outputs rather than outcomes.
  lesson_learnt: When designing grant programs with knowledge sharing obligations,
