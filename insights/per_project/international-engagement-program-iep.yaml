  secondary_failure_mode: poor scoping
  intervention_note: Almost half of IEP projects renegotiated elements of their agreements
    with ARENA — five projects extended grant timeframes and four redirected travel
    funding to increase domestic knowledge sharing activities.
  transferability: broad
  delay_magnitude: not quantified
