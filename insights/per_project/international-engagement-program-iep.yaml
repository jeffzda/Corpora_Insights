  source_title: International Engagement Program Mid Term Evaluation Report
  publish_date: '2020-07-10'
  project_name: International Engagement Program (IEP)
  what_happened: The IEP application timeline was relatively short, which made it
    difficult for some grantees to coordinate with international stakeholders during
    the application process. Grantees also reported mixed experiences with the application
    form length, with estimates ranging from under 20 hours to approximately 30 hours
    to complete.
  lesson_learnt: For grant programs requiring international coordination, application
    timeframes should be long enough to allow meaningful consultation with overseas
    partners — short windows disadvantage applicants whose project quality depends
    on established international relationships and may favour purely domestic applicants.
