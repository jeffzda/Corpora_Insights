- record_id: ARENA-DLV-11057
  source_title: International Engagement Program Mid Term Evaluation Report
  publish_date: '2020-07-10'
  project_name: International Engagement Program (IEP)
  what_happened: COVID-19 travel restrictions forced IEP international engagement
    activities to move from face-to-face to online delivery. While some grantees found
    online engagement more efficient and accessible, relationship building was identified
    as significantly impaired, and grantees in Australian time zones faced difficulties
    participating in meetings held for European audiences. One project could not engage
    with Pacific island partners due to inadequate internet infrastructure.
  lesson_learnt: Online delivery can maintain technical knowledge exchange but cannot
    fully substitute for face-to-face engagement in relationship-building programs
    — program designs that depend on forming deep international collaborations should
    retain in-person engagement as a core mechanism and treat online delivery as a
    complement, not a replacement.
  issue_severity: moderate
