  source_title: International Engagement Program Mid Term Evaluation Report
  publish_date: '2020-07-10'
  project_name: International Engagement Program (IEP)
  what_happened: The IEP had no formal mechanism for coordinating with other government
    agencies, including DISER, on Australian international engagement activities in
    renewable energy. This created missed opportunities for alignment and coordination
    that would enable more efficient use of resources.
  lesson_learnt: Programs involving Australian participation in international platforms
    should establish formal coordination mechanisms with relevant government departments
    from the outset — informal coordination through annual workshops and ad-hoc reporting
    is insufficient to achieve a whole-of-government approach and results in duplicated
    effort and missed opportunities.
