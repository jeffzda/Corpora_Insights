  source_title: International Engagement Program Mid Term Evaluation Report
  publish_date: '2020-07-10'
  project_name: International Engagement Program (IEP)
  what_happened: The IEP had no mechanism to fund follow-on activities when grantees
    identified promising ideas or opportunities through their international engagement.
    Four grantees and one ARENA staff member identified this as a limitation on the
    program's ability to apply learning and accelerate outcomes.
  lesson_learnt: International engagement programs should include or be linked to
    a pathway for funding promising ideas that emerge from engagement activities —
    without this, the program generates knowledge but lacks the mechanism to convert
    that knowledge into tangible domestic outcomes.
