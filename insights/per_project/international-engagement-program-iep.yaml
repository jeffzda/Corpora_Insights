- record_id: ARENA-DLV-11058
  source_title: International Engagement Program Mid Term Evaluation Report
  publish_date: '2020-07-10'
  project_name: International Engagement Program (IEP)
  what_happened: IEP grantees leveraged an additional $1.5 million in cash and in-kind
    support beyond the $5 million ARENA grant — equivalent to 32% of the program's
    total funding. Interview evidence indicated these figures were conservative, with
    some individual projects reporting a three-fold return on ARENA's initial investment,
    and several projects securing further funding through stronger relationships (e.g.
    i-Hub, Blue Economy CRC, ARC grants).
  lesson_learnt: Structured international engagement funding generates substantial
    leverage — programs of this type should expect and plan for co-investment ratios
    well above 30%, and should track leveraged funding systematically rather than
    relying on application-stage estimates, which are likely to significantly understate
    the true figure.
