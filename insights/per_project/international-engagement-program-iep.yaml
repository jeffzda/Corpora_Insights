  project_name: International Engagement Program (IEP)
  what_happened: The IEP did not include an energy storage project in its portfolio,
    which was identified by an ARENA interviewee as a gap given ARENA's wider investment
    priorities. The 12 projects funded covered solar, hydrogen, ocean energy, hydropower,
    bioenergy, and renewable integration but not dedicated storage.
  lesson_learnt: Portfolio design for international engagement programs should be
    explicitly mapped against current investment priorities at the time of program
    design, with a process to update the portfolio mix if priorities shift — gaps
