- record_id: ARENA-DLV-19501
  source_title: International Engagement Program - Year 1 Summary
  publish_date: 2020-02
  project_name: International Engagement Program (IEP)
  what_happened: 'IEP participants reported recurring difficulties with effective
    international governance, particularly in newly established portfolios, those
    experiencing significant renewed interest, or those with a growing number of participants.
    International representatives and experts were described as time-poor and under-resourced,
    especially for administrative support. '
  lesson_learnt: When designing or joining newly established or rapidly growing international
    collaboration programs, build in dedicated administrative resourcing from the
    outset — time-poor international representatives cannot sustain effective coordination
    without it. Mature, long-established programs are less vulnerable to this failure
    mode.
