- record_id: ARENA-DLV-11065
  source_title: International Engagement Program Mid Term Evaluation Report
  publish_date: '2020-07-10'
  project_name: International Engagement Program (IEP)
  what_happened: IEP grantees created nine new tasks and annexes within their TCPs
    and MI Challenges that aligned with Australian research interests, and six of
    twelve grantees took up formal leadership roles. However, because ARENA provided
    no specific expectations or guidance on how grantees should use international
    forums, it was left entirely to individual grantee discretion to determine what
    was in Australia's best interests.
  lesson_learnt: International engagement programs should provide grantees with explicit
    guidance on how to identify and advocate for Australian interests within international
    forums — without this, grantees exercise individual discretion that may not be
    strategically coordinated, and the program cannot assess whether its shaping activities
    are delivering national benefit.
