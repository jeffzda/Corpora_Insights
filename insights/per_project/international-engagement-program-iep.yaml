- record_id: ARENA-DLV-19502
  source_title: International Engagement Program - Year 1 Summary
  publish_date: 2020-02
  project_name: International Engagement Program (IEP)
  what_happened: Without IEP funding, Australian researchers and experts would not
    have been able to attend key IEA meetings and international Task activities, limiting
    Australia's representation and participation in international renewable energy
    forums. ARENA funding was described as integral to attendance and was directly
    linked to Australia securing Task leadership positions it would not otherwise
    have held.
  lesson_learnt: Dedicated, ring-fenced funding for international engagement is a
    prerequisite for sustained Task leadership and knowledge access — participation
    funding should be secured before committing to leadership roles in international
    programs, as the administrative and travel burden cannot be absorbed within normal
    research or operational budgets.
