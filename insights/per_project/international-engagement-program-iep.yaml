- record_id: ARENA-DLV-11064
  source_title: International Engagement Program Mid Term Evaluation Report
  publish_date: '2020-07-10'
  project_name: International Engagement Program (IEP)
  what_happened: IEP grantees were not required to develop project-level logic models
    as part of their application, in order to minimise administrative burden and preserve
    project flexibility. This unintentionally led to challenges in monitoring and
    reporting on project-level outcomes and made it difficult to assess how individual
    projects contributed to program-level goals.
  lesson_learnt: Reducing application administration by omitting logic model requirements
    creates downstream monitoring problems that outweigh the upfront burden saved
    — a lightweight logic model template aligned to the program logic is a proportionate
    requirement that enables outcome-focused monitoring without constraining project
    flexibility.
  issue_severity: moderate
  project_type: null
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: operations
  proponent_type: government/public-sector body
  delay_category: null
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: data & measurement
  intervention_note: The evaluation developed a revised program logic (Annex 2) with
    stepped-out intermediate outcomes and recommended that ARENA support grantees
    to develop nested project-level logic models.
  transferability: broad
  delay_magnitude: null
  technology_domain: null
  source_pages:
