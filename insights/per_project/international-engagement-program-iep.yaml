- record_id: ARENA-DLV-11052
  source_title: International Engagement Program Mid Term Evaluation Report
  publish_date: '2020-07-10'
  project_name: International Engagement Program (IEP)
  what_happened: IEP reporting processes focused on activity outputs rather than outcomes,
    with no systematic way to track whether knowledge sharing activities were leading
    to desired results. Grantees were unclear on how quarterly survey results were
    being used, and seven of twelve grantees found the quarterly survey too frequent.
  lesson_learnt: Reporting frameworks for knowledge-sharing programs should be designed
    around outcome measures from the outset — output-focused reporting is insufficient
    to demonstrate program effectiveness and creates a gap in evidence that cannot
    be retrospectively filled at evaluation.
