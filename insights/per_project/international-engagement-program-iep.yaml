  project_name: International Engagement Program (IEP)
  what_happened: A change in ARENA project managers during the program led to differences
    in understanding around reporting expectations between grantees and their assigned
    ARENA contact, contributing to confusion and inconsistency in how reporting requirements
    were applied across the portfolio.
  lesson_learnt: Program manager transitions during active grant programs should include
    a structured handover process that explicitly addresses grantee-specific reporting
    expectations — undocumented or informally understood arrangements do not survive
    personnel changes and create avoidable friction for grantees.
