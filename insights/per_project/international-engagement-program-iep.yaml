- record_id: ARENA-DLV-11066
  source_title: International Engagement Program Mid Term Evaluation Report
  publish_date: '2020-07-10'
  project_name: International Engagement Program (IEP)
  what_happened: The IEP's competitive granting approach improved on the previous
    ad-hoc funding model by enabling participation by both the best-qualified experts
    and organisations and the highest-priority technologies. The program enabled Australian
    participation in an additional six international programs and 81% of quarterly
    survey respondents stated the international engagement would not have been possible
    without IEP support.
  lesson_learnt: Competitive, structured grant programs for international engagement
    produce measurably greater additionality than ad-hoc funding — the competitive
    selection mechanism ensures both strategic alignment and quality, while predictable
    multi-year funding enables the level of commitment required for meaningful international
    participation.
