  source_title: International Engagement Program Mid Term Evaluation Report
  publish_date: '2020-07-10'
  project_name: International Engagement Program (IEP)
  what_happened: ARENA provided upfront funding to grantees rather than reimbursement-based
    payments, which was identified by ARENA staff and grantees as a practical enabler
    that helped projects get moving quickly and reduced cash-flow barriers, particularly
    for smaller organisations and industry participants.
  lesson_learnt: Upfront grant payment structures materially improve access for industry
    participants and smaller organisations in international engagement programs —
    reimbursement-based structures disadvantage organisations without the cash reserves
    to fund international travel and participation in advance.
