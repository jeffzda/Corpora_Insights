  source_title: 'Transgrid ''Wallgrove Grid Battery'' Operations Report #1'
  publish_date: 2022-12
  project_name: Wallgrove Grid Battery
  what_happened: The hybrid commercial model combining regulated network funding (for
    inertia and fast frequency response services) with unregulated commercial dispatch
    (FCAS and energy markets) enabled the WGB to maximise battery utilisation, with
    less than 5% of storage capacity reserved for network services. The model allowed
    Transgrid to explore a credible regulatory pathway for large-scale battery storage
    in its AER revenue submission.
  lesson_learnt: A hybrid regulated/commercial revenue model — where network service
    obligations consume a small share of battery capacity and the remainder is commercially
    dispatched — is a viable structure for TNSPs to justify large-scale battery investment
    through regulatory processes while maintaining high market utilisation. This model
    can be replicated by other TNSPs facing similar inertia gaps.
