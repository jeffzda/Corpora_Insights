- record_id: ARENA-DLV-60717
  source_title: 'Transgrid ''Wallgrove Grid Battery'' Operations Report #1'
  publish_date: 2022-12
  project_name: Wallgrove Grid Battery
  what_happened: The co-optimisation constraint between energy, regulation FCAS, and
    contingency FCAS markets meant that providing maximum contingency FCAS (26MW)
    reserved that capacity and limited simultaneous raise regulation FCAS to 24MW
    and lower regulation FCAS to 21MW. This structural constraint reduced the WGB's
    ability to maximise revenue across all services simultaneously.
  lesson_learnt: Battery dispatch optimisation strategies must fully account for co-optimisation
    constraints across energy, regulation FCAS, and contingency FCAS — capacity reserved
    for one service cannot be used for others, and the revenue trade-offs between
    services are dynamic. Dispatch algorithms and operator training should explicitly
    model these interactions to maximise total revenue stack.
  issue_severity: none
