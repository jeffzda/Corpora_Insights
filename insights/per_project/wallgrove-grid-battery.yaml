  source_title: 'Transgrid ''Wallgrove Grid Battery'' Operations Report #1'
  publish_date: 2022-12
  project_name: Wallgrove Grid Battery
  what_happened: The operational round-trip efficiency (RTE) of the WGB measured at
    the 132kV transmission network connection point (inclusive of transformer losses)
    was 83.2% over the first six months of operation. This was lower than the RTE
    test result obtained under controlled test conditions, with the difference attributed
    to auxiliary and standby losses being amplified by ambient operating conditions
    outside standard test ranges.
  lesson_learnt: Operational RTE at the grid connection point for transmission-connected
    batteries will be materially lower than vendor test results due to transformer
    losses and auxiliary/standby losses under real operating conditions — project
    financial models should use operational RTE estimates rather than test-condition
    figures when forecasting energy market revenues.
