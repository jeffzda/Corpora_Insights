- record_id: ARENA-DLV-60704
  source_title: 'Transgrid ''Wallgrove Grid Battery'' Operations Report #1'
  publish_date: 2022-12
  project_name: Wallgrove Grid Battery
  what_happened: A software rounding error caused the WGB to report only 46MW of its
    47MW nameplate charge capacity as available to bid into the regulation FCAS lower
    market. This persisted from commissioning until a software update in May 2022
    — approximately five months — resulting in systematic under-bidding of lower regulation
    FCAS capacity (56.73% of intervals saw enablement at 46MW rather than the correct
    47MW).
  lesson_learnt: Battery management system software should be validated against nameplate
    capacity parameters before commercial operations commence — rounding errors in
    reported available capacity can cause systematic revenue leakage across FCAS markets
    for extended periods without triggering an obvious alarm.
  issue_severity: moderate
  project_type: storage
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: execution & logistics
  intervention_note: A software update was undertaken in May 2022 that corrected the
    reported charge capacity to 47MW; subsequent lower regulation FCAS enablement
    at the full 47MW level increased to 29.5% of intervals in June 2022.
  transferability: moderate
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id003
  - 19
  evidence_excerpt: The cause of this differential was a rounding issue resulting
    in only 46MW of the 47MW in nameplate charge capacity being indicated as available
    to bid into the markets. This led to frequent enablement of lower regulation FCAS
    at 46MW prior to a software update undertaken in May 2022 (56.73 per cent of all
    intervals prior to May 2022 saw lower regulation FCAS enablement at 46MW – consistent
    with expectations for enablement levels in the NP Cap category).
