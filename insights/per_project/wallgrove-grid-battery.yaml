  what_happened: Practical completion of the WGB was delayed beyond the expected date,
    resulting in an increased insurance cost during the operational period as the
    project remained in a pre-practical-completion insurance category for longer than
    planned.
  lesson_learnt: Delays to practical completion certification for grid-scale battery
    projects carry a direct cost in elevated insurance premiums — project teams should
    factor this into delay cost estimates and prioritise achieving practical completion
    milestones to transition to lower-cost operational insurance.
