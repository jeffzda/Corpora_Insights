    market volatility of the reporting period rather than structural differences between
    the assets.
  lesson_learnt: Revenue stack projections for new grid batteries based on historical
    FCAS/energy splits from comparable operating assets should be treated as indicative
    only — periods of sustained energy market volatility can materially shift the
    revenue mix toward energy arbitrage. Financial models should stress-test revenue
    assumptions across a range of market conditions.
