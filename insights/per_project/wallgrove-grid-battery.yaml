  what_happened: Virtual Machine Mode (VMM) for synthetic inertia had not been enabled
    during the first six months of commercial operations (December 2021 – June 2022),
    pending final technical assessments with AEMO, meaning the project's primary innovation
    objective was not yet demonstrable in the reporting period.
