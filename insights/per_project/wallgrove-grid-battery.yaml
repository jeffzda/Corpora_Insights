  what_happened: 'Revenue earned by the WGB was highly seasonal and volatile: January–March
    2022 revenues were low due to mild summer temperatures, high generator availability,
    and low peak demand suppressing price volatility and arbitrage opportunities.
    April–June 2022 revenues were materially higher, driven by sustained energy market
    volatility culminating in the NEM suspension of 15 June 2022.'
  lesson_learnt: Battery revenue projections should model seasonal and weather-driven
    demand variability explicitly — mild summer conditions can suppress arbitrage
    revenue significantly below long-run average expectations, while sustained market
    stress events can produce outsized revenue in a single quarter. Single-year revenue
    forecasts based on average conditions will misrepresent the range of outcomes.
