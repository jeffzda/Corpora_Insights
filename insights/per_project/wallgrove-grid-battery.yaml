  what_happened: A 132kV cable defect was identified and required rectification via
    a planned outage on 19 January 2022, only weeks after commercial operations commenced
    in December 2021. A separate unplanned outage on 11–12 January 2022 was triggered
    by a network disturbance that isolated the WGB, requiring a technician to attend
    site to reclose circuit breakers.
  lesson_learnt: Early-operational defect rectification and network disturbance response
    should be anticipated in availability and maintenance planning for new grid-scale
    battery installations — cable and circuit breaker issues in the first weeks of
    operation are a recurring pattern at first-of-kind deployments and remote-access
    capabilities should be confirmed before go-live.
