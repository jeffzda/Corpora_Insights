- record_id: ARENA-DLV-60705
  source_title: 'Transgrid ''Wallgrove Grid Battery'' Operations Report #1'
  publish_date: 2022-12
  project_name: Wallgrove Grid Battery
  what_happened: SCADA system changes were required after commercial operations commenced,
    necessitating a planned outage of the battery from 16–20 May 2022. To minimise
    customer impact, the SCADA works were bundled with protection relay setting changes
    into a single continuous outage, which accounted for a significant portion of
    the 2.8% planned outage unavailability in the reporting period.
  lesson_learnt: SCADA design and configuration for grid-connected battery projects
    should be finalised before commercial operations — post-commissioning SCADA changes
    require planned outages that reduce availability and incur additional labour costs.
    Where outages are unavoidable, bundling multiple works into a single outage window
    minimises revenue and availability impact.
