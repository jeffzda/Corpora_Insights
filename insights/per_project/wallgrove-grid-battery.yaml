- record_id: ARENA-DLV-60703
  source_title: 'Transgrid ''Wallgrove Grid Battery'' Operations Report #1'
  publish_date: 2022-12
  project_name: Wallgrove Grid Battery
  what_happened: An arc flash risk was identified around the low-voltage circuit breaker
    panels during the design of the WGB. The risk was initially managed by implementing
    an exclusion zone while the WGB was energised, which constrained safe access to
    parts of the site. Protection settings were changed in May 2022 to reduce arcing
    fault clearance time, eliminating the need for the exclusion zone.
  lesson_farnt: Arc flash risk at low-voltage circuit breaker panels should be assessed
    and mitigated during design — not managed post-commissioning via exclusion zones.
    Designing appropriate protection settings upfront avoids operational access constraints
    and reduces safety risk from first energisation.
  lesson_learnt: Arc flash risk at low-voltage circuit breaker panels should be assessed
    and mitigated during design for all battery and grid-connected electrical installations
    — relying on post-commissioning exclusion zones creates ongoing safety and operational
    access constraints that require remediation works during operations.
  issue_severity: moderate
  project_type: storage
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: null
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Protection relay settings were changed in May 2022 to reduce
    arcing fault clearance time, reducing the arc flash risk sufficiently that the
    exclusion zone was removed.
  transferability: broad
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id002
  - 24
  evidence_excerpt: During the design of the WGB an arc flash risk was identified
