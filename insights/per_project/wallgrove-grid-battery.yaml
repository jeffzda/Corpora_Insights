- record_id: ARENA-DLV-60702
  source_title: 'Transgrid ''Wallgrove Grid Battery'' Operations Report #1'
  publish_date: 2022-12
  project_name: Wallgrove Grid Battery
  what_happened: During the NEM market suspension of June 2022, the WGB was discharged
    to a very low state of charge and the site controller automatically disabled AGC
    mode as a protective measure. The over-constrained dispatch price settling above
    $15,100/MWh prevented Iberdrola Australia from recharging the battery via normal
    dispatch, and manual dispatch capability was also ineffective under these conditions.
  lesson_learnt: BESS operational procedures should explicitly address market suspension
    and administered pricing scenarios — control systems and bidding strategies that
    assume normal price-discovery conditions can leave the battery unable to recharge
    during exactly the high-value periods when storage capability is most needed.
  issue_severity: moderate
  project_type: storage
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: commissioning/integration
  failure_mode: unvalidated integration
  outcome_class: delayed but recoverable
  secondary_failure_mode: execution & logistics
  intervention_note: The WGB eventually recharged itself through contingency FCAS
    enablement (which operates independently of AGC), raising SoC to a level at which
    the site controller automatically re-enabled AGC mode.
  transferability: broad
  delay_magnitude: <1 month
  technology_domain: battery storage
  source_pages:
  - 23
  - 27
  evidence_excerpt: Energy constrained generators such as the WGB took drastic measures
    to ensure they were not continuously dispatched and bid their availability out
    of the market... the BESS was unable to charge to increase its storage levels
    to the required amounts for market participation due to the over-constrained dispatch
    price settling above the highest energy load bid that the BESS could provide ($15,100/MWh).
  confidence_note: delay_category set to commissioning/integration as this reflects
    the control-system integration failure mode; the event occurred during operations
    but the root cause is a control logic design issue. Canonical record merged from
    2 source records across 1 document(s).
