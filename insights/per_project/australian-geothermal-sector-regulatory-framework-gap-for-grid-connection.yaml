- record_id: ARENA-DLV-14973
  source_title: 'Looking Forward: Barriers, Risks and Rewards of the Australian Geothermal
    Sector to 2020 and 2030'
  publish_date: 2014-06
  project_name: Australian Geothermal Sector – Regulatory Framework Gap for Grid Connection
  what_happened: The regulatory framework for geothermal energy as a grid-connected
    power provider had not been specifically defined or tested in any Australian jurisdiction
    as of 2014, creating uncertainty around approval processes and timing that adds
    risk and cost to any project attempting to supply power to the national electricity
    market.
  lesson_learnt: Regulatory pathways for novel renewable technologies connecting to
    the grid should be established and tested before commercial demonstration projects
    attempt grid connection — the lack of precedent in Australia for geothermal energy
    development means there is uncertainty around the regulatory approval process
    that could cause unplanned delays and costs.
