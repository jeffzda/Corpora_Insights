- record_id: ARENA-DLV-72253
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects - First Edition Results'
  publish_date: '2015'
  project_name: Hampton Wind Farm
  what_happened: Ecoult demonstrated UltraBattery storage at Hampton Wind Farm (AUD 5M) to constrain the 5-minute ramp rate of wind output to 10% of its raw rate, using energy storage with usable capacity
    equal to only 1/10th of the farm's rated output in kW.
  lesson_learnt: Wind ramp rate control using battery storage is technically achievable with a relatively small storage capacity (1/10th of rated generation capacity in kWh per kW) — projects targeting
    higher renewable penetration in constrained networks should assess ramp rate control as a low-cost integration enabler before pursuing full-output storage.
