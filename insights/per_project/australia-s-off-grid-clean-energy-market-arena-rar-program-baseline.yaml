  source_title: Australia's Off-Grid Clean Energy Market Research Paper
  publish_date: '2014-10-08'
  project_name: Australia's Off-Grid Clean Energy Market (ARENA RAR Program baseline)
  what_happened: Mining companies consistently ranked power reliability and Occupational
    Health & Safety above cost savings, emissions reduction, and fuel security as
    priorities, meaning renewable energy proposals that could not unambiguously demonstrate
    equivalent or better reliability were routinely deprioritised.
  lesson_learnt: When approaching mining sector off-grid renewable projects, lead
    with reliability evidence rather than cost or emissions arguments — mine operators
    will not accept any perceived reduction in power reliability, and the business
    case must demonstrate that the hybrid system meets or exceeds existing reliability
    standards before cost savings are considered.
