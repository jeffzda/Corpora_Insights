  project_name: Australia's Off-Grid Clean Energy Market (ARENA RAR Program baseline)
  what_happened: Short mine life relative to the long payback period of renewable
    energy investments was a significant barrier in the off-grid mining sector, with
    many projects having uncertain lifetimes that made cost recovery calculations
    unfavourable.
  lesson_learnt: For mines with short or uncertain lifetimes, consider portable/modular
    renewable systems that can be relocated at mine closure, or target projects where
    a nearby community can utilise the renewable infrastructure post-mining — ARENA
    focused on projects with a minimum 5-year mine lifetime as a threshold for viable
    renewable investment.
