  project_name: Australia's Off-Grid Clean Energy Market (ARENA RAR Program baseline)
  what_happened: In 2011, Horizon Power was forced to enforce a maximum size limitation
    on renewable energy systems in Exmouth, Carnarvon and Broome after the fluctuating
    output of renewable systems began affecting system stability.
  lesson_learnt: Before proceeding with distributed renewable installations in off-grid
    interconnected systems, assess the network's saturation point for renewables —
    capacity constraints can be hit earlier than expected, requiring control system
    upgrades or storage to maintain system stability.
