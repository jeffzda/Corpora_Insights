  delay_category: procurement/supply chain
  failure_mode: execution & logistics
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Early engagement with suppliers to review and agree quality assurance
    procedures (Factory Acceptance Tests) and careful selection based on track record,
    technical capability and commercial credibility.
  transferability: broad
  delay_magnitude: null
  technology_domain: hybrid systems
  source_pages: &id008
