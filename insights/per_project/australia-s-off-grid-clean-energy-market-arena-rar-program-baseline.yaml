- record_id: ARENA-DLV-23927
  source_title: Australia's Off-Grid Clean Energy Market Research Paper
  publish_date: '2014-10-08'
  project_name: Australia's Off-Grid Clean Energy Market (ARENA RAR Program baseline)
  what_happened: The Build-Own-Operate plus Power Purchase Agreement (BOO+PPA) model
    — the predominant electricity procurement model at remote mine sites — created
    difficulties for integrating new renewable generation due to take-or-pay arrangements,
    and reduced the project owner's ability to control operating practices or include
    load curtailment and storage procedures.
  lesson_learnt: When seeking to add renewable generation to a site with an existing
    BOO+PPA structure, review take-or-pay provisions carefully before project development
    — these terms can make renewable integration contractually complex or commercially
    unviable, and future PPA contracts for off-grid sites should explicitly accommodate
    renewable integration and storage operating procedures.
