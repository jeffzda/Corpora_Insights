  source_title: Australia's Off-Grid Clean Energy Market Research Paper
  publish_date: '2014-10-08'
  project_name: Australia's Off-Grid Clean Energy Market (ARENA RAR Program baseline)
  what_happened: The aggregated diesel fuel consumption across remote Australian communities
    and industrial sites was estimated at over 1.2GW of installed diesel capacity
    with electricity costs of $240–450/MWh in fuel only, creating a viable cost-based
    business case for solar PV hybridisation at low penetration levels without grants
    in some locations.
  lesson_learnt: At low renewable penetration levels (below ~30%), solar PV or wind
    can be hybridised into off-grid diesel systems with minimal integration costs
    and a positive business case where diesel prices exceed approximately $1/L — the
    key commercial threshold analysis should compare LCOE of solar (~$226/MWh in Pilbara)
    against the short-run marginal cost of diesel rather than full system replacement
    costs.
