  source_title: Australia's Off-Grid Clean Energy Market Research Paper
  publish_date: '2014-10-08'
  project_name: Australia's Off-Grid Clean Energy Market (ARENA RAR Program baseline)
  what_happened: Split incentive structures in off-grid industrial/mining contexts
    — where one party installs the generator and another bears the ongoing fuel costs
    — created barriers to renewable energy investment by removing the financial motivation
    for the party who could act to reduce fuel consumption.
  lesson_learnt: Where Power Purchase Agreements or IPP arrangements create split
    incentives around fuel costs, contractual structures must explicitly allocate
    the financial benefit of renewable fuel savings to the party bearing diesel costs
    — take-or-pay PPA terms can make integration of new renewable generation particularly
    difficult.
