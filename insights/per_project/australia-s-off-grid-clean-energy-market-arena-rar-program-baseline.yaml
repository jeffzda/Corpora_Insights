  what_happened: Community acceptance and Aboriginal cultural heritage posed risks
    of major delay or project abandonment for off-grid renewable projects in remote
    communities, particularly those affecting Indigenous land.
  lesson_learnt: Community consultation for projects in remote or Indigenous areas
