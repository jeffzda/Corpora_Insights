  project_name: Australia's Off-Grid Clean Energy Market (ARENA RAR Program baseline)
  what_happened: The diesel generator characteristics of existing remote power stations
    — particularly low-load restrictions, step load capability and ramp rates — directly
    constrained the permissible penetration level of variable renewable generation
    that could be integrated without system instability.
  lesson_learnt: When assessing hybrid integration into existing off-grid diesel plant,
    characterise the genset's low-load performance, step load capability, and ramp
    rates early in feasibility — these characteristics set the ceiling for renewable
    penetration without additional enabling technology, and should also be specified
    when procuring new diesel plant to facilitate higher future renewable penetrations.
