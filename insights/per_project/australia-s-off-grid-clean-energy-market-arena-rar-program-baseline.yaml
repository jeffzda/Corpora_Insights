  what_happened: Land access rights at proposed project sites — including requirements
    for written Commonwealth permission to enter Aboriginal land — were identified
    as a potential source of fines and delays if not secured prior to site entry.
  lesson_learnt: Obtain formal land access rights before entering any project site
    in remote or Aboriginal areas — most councils or state departments have a process
    for this, but for Aboriginal land Commonwealth permission is required; failure
    to secure access prior to entry can result in fines and delay site investigations
    critical to the feasibility process.
