  project_name: Australia's Off-Grid Clean Energy Market (ARENA RAR Program baseline)
  what_happened: The EPC contracting structure for off-grid renewable projects was
    found to require more upfront design and specification work, with novation of
    warranties and supply agreements potentially problematic — yet it provided fixed-price
    cost certainty and transferred performance and interface risk to a single contractor.
  lesson_learnt: For off-grid hybrid projects where cost certainty and integrated
    system performance accountability are paramount, EPC contracts are preferred;
    however project owners must invest heavily in upfront design and specification
    before issuing the contract to ensure the scope is sufficiently defined to avoid
    costly variations.
