  source_title: Australia's Off-Grid Clean Energy Market Research Paper
  publish_date: '2014-10-08'
  project_name: Australia's Off-Grid Clean Energy Market (ARENA RAR Program baseline)
  what_happened: Faulty equipment delivered to remote off-grid sites was identified
    as a significant risk — due to remoteness, delivering replacement equipment can
    result in significant delays and cost overruns that would not occur in accessible
    locations.
  lesson_learnt: Engage with equipment suppliers early to agree Factory Acceptance
    Test procedures and verify test reports and certificates before equipment leaves
    the factory — the cost of faulty equipment delivered to remote sites includes
    not only replacement but also significant transport and schedule delays.
  issue_severity: moderate
  project_type: multi-technology/hybrid
  project_scale_band: programmatic/portfolio-level
