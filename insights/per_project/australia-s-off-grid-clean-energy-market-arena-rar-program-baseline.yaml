- record_id: ARENA-DLV-23901
  source_title: Australia's Off-Grid Clean Energy Market Research Paper
  publish_date: '2014-10-08'
  project_name: Australia's Off-Grid Clean Energy Market (ARENA RAR Program baseline)
  what_happened: The off-grid renewable energy market in Australia was largely undeveloped
    at the time of the study, with only approximately 1% of off-grid electricity generated
    from renewable sources despite over 1.2GW of diesel generation capacity installed.
    The market lacked integration experience, track record, and financier confidence.
  lesson_learnt: Early off-grid renewable projects must bear a cost premium associated
    with the lack of integration experience and track record in Australia — a few
    successful demonstration projects are essential to build market confidence and
    catalyse future commercial deployments.
