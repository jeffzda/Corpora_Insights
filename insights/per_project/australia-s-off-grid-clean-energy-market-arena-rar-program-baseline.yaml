  what_happened: Financing of off-grid renewable energy projects was identified as
    a critical barrier, with financiers requiring verifiable long-term resource data
    and having limited experience with off-grid renewable project risk profiles.
  lesson_learnt: Onsite solar and/or wind measurement campaigns should commence early
    in project development — financiers typically require at least one year of onsite
    resource monitoring, and delays in starting this work can become a critical path
    constraint that defers financial close.
