  project_name: Australia's Off-Grid Clean Energy Market (ARENA RAR Program baseline)
  what_happened: Remote off-grid renewable projects faced a persistent first-mover
    cost premium — early projects bore additional costs from contractors and financiers
    due to the lack of Australian track record in off-grid integration, meaning the
    first projects effectively subsidised future market development.
  lesson_learnt: First-mover off-grid renewable projects should be structured with
    government co-funding to offset the risk premium applied by contractors and financiers
    — once a few successful projects establish a track record, these premiums reduce
    substantially and the commercial case becomes self-sustaining.
