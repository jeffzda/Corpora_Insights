  source_title: Australia's Off-Grid Clean Energy Market Research Paper
  publish_date: '2014-10-08'
  project_name: Australia's Off-Grid Clean Energy Market (ARENA RAR Program baseline)
  what_happened: Community Service Obligations (CSOs) paid to network operators subsidised
    the cost of fossil-fuelled electricity in remote areas, reducing the financial
    incentive for end-users to adopt renewables and creating a split between who bears
    the cost of supply and who benefits from renewable savings.
  lesson_learnt: When structuring off-grid renewable projects in communities receiving
    CSO subsidies, direct the value proposition at the state/territory government
    bearing the subsidy cost rather than the end-user, as the financial benefit of
    cost reduction accrues primarily to the subsidising government.
