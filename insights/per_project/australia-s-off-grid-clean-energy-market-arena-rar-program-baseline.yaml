  what_happened: Development approvals for wind farms were identified as consistently
    more challenging than for solar projects, with requirements for noise assessment,
    ecological impact, visual amenity studies, and risk of strong community opposition
    — the Victorian Government also imposed stricter planning provisions for wind
    farms including dwelling setback requirements.
  lesson_learnt: Wind farm development approval processes are significantly more complex
    and community-sensitive than solar PV — early community consultation, noise and
    ecological studies should be commenced as soon as a site is identified, not after
    technical design is finalised, as community opposition discovered late has historically
    caused major delays or abandonment.
