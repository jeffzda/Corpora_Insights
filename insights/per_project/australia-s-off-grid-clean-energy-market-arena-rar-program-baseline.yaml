- record_id: ARENA-DLV-23903
  source_title: Australia's Off-Grid Clean Energy Market Research Paper
  publish_date: '2014-10-08'
  project_name: Australia's Off-Grid Clean Energy Market (ARENA RAR Program baseline)
  what_happened: The construction and long-term maintenance costs of off-grid renewable
    projects were substantially inflated by remoteness, with skilled labour costs
    particularly high and unplanned maintenance capable of quickly offsetting all
    savings from the renewable system.
  lesson_learnt: Off-grid renewable systems in remote locations must be designed for
    robustness and reliability from the outset, incorporating remote monitoring and
    modular construction to minimise the need for on-site skilled labour — unplanned
    maintenance in very remote areas can rapidly erode project economics.
