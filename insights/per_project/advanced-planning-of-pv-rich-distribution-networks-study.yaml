  source_title: 'Advanced Planning of PV-Rich Distribution Networks – Deliverable
    4: Non-Traditional Solutions'
  publish_date: 2020-08
  project_name: Advanced Planning of PV-Rich Distribution Networks
  what_happened: BES systems fitted with the University of Melbourne's Network Smart
    (NS) controller — which adapts charging proportionally to PV generation throughout
    the entire generation period and ensures full discharge by morning — increased
    hosting capacity to 100% on all feeder types, eliminated voltage violations, reduced
    augmentation requirements by at least 60%, and kept curtailment negligible, while
    adding only 2–4% to household grid dependence compared to OTS controllers.
  lesson_learnt: Advanced battery controllers that spread charging across the full
    PV generation period (rather than charging opportunistically from surplus) can
    substitute for costly network augmentation; DNSPs and governments should create
    pathways — either incentive schemes or mandatory connection standards — to accelerate
    adoption of network-smart battery controllers.
