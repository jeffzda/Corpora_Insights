  source_title: Final Report Advanced Planning of PV-Rich Distribution Networks
  publish_date: 2021-02
  project_name: Advanced Planning of PV-Rich Distribution Networks
  what_happened: The 'Network Smart' battery controller, which proportionally charges
    from PV generation and discharges overnight, was found to be the cheapest complete
    solution for both urban and rural feeders to achieve 60% and 100% PV hosting capacity,
    with urban feeder costs as low as $59,250 and $91,984 (NPV) for CRE21 and HPK11
    respectively at 60% HC.
  lesson_learnt: DNSPs should mandate network-friendly battery connection requirements
    (analogous to inverter standards) in the short-to-medium term so that, as residential
    battery uptake grows, the installed base can deliver significant hosting capacity
    benefits at minimal DNSP cost, particularly in urban feeders.
