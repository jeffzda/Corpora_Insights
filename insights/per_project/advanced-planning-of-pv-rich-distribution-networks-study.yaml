- record_id: ARENA-DLV-17251
  source_title: 'Advanced Planning of PV-Rich Distribution Networks – Deliverable
    4: Non-Traditional Solutions'
  publish_date: 2020-08
  project_name: Advanced Planning of PV-Rich Distribution Networks
  what_happened: Simulation studies across four AusNet Services HV feeders found that
    without any traditional or non-traditional solutions, solar PV hosting capacity
    is limited to approximately 20% penetration — a level expected to have been reached
    on all feeders between 2017 and 2019 — primarily due to voltage rise issues.
  lesson_learnt: DNSPs should monitor customer voltages on HV feeders approaching
    20% solar PV penetration and require detailed network studies before approving
    further connection requests; without proactive intervention, voltage limits become
    the binding constraint at relatively low penetration levels.
