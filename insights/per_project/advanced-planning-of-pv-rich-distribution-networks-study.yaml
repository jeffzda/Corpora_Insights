  source_title: Final Report Advanced Planning of PV-Rich Distribution Networks
  publish_date: 2021-02
  project_name: Advanced Planning of PV-Rich Distribution Networks
  what_happened: Stricter Volt-Watt and Volt-var inverter settings (curtailment starting
    at 1.09 p.u., hard limit at 1.10 p.u.) were found to eliminate all voltage rise
    violations across all feeder types and PV penetrations when homogeneously adopted,
    with only a 1–2% increase in average curtailment compared to VicSet, at no capital
    cost to DNSPs.
  lesson_learnt: DNSPs should pursue adoption of stricter Volt-Watt/Volt-var inverter
    standards beyond VicSet at the earliest opportunity, as the incremental curtailment
    impact on customers is marginal while the network benefit is substantial and the
    solution scales to 100% PV penetration when combined with augmentation.
