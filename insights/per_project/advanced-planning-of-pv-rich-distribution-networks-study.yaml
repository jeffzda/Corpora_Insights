  what_happened: Under a head-to-end PV uptake scenario in urban LV networks, the
    HC estimation model systematically overestimated hosting capacity at penetration
    levels below 70% because the customers with the greatest voltage rise impact (those
    at the far end of feeders) were the last to install PV systems, meaning the model
    was trained without observing the most constraining network conditions.
  lesson_learnt: HC estimation models derived from historical smart meter data are
    vulnerable to systematic overestimation when early PV adopters are disproportionately
    located near the feeder head — DNSPs should apply conservative (upper prediction
    limit) HC estimates in areas where spatial PV uptake patterns are unknown or biased
    toward head-of-feeder customers.
