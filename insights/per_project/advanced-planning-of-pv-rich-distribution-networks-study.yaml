- record_id: ARENA-DLV-55310
  source_title: 'Advanced Planning of PV-Rich Distribution Networks - Deliverable
    2: Innovative Analytical Techniques'
  publish_date: 2019-10
  project_name: Advanced Planning of PV-Rich Distribution Networks
  what_happened: 'The HV capacitor operation model required updating after project
    commencement: capacitors had been modelled with time-based switching but AusNet
    Services confirmed actual operation is voltage-based; both rural HV feeders R1
    and R2 were affected by this modelling assumption error.'
  lesson_learnt: Network element control logic (particularly for reactive power compensation
    devices like HV capacitors) should be verified against current DNSP operating
    practice before building simulation models — assuming time-based switching when
    voltage-based switching is used in practice will produce incorrect voltage profiles
    and invalidate hosting capacity calculations.
