  publish_date: 2020-12
  project_name: Advanced Planning of PV-Rich Distribution Networks
  what_happened: The cost comparison demonstrated that the timing of asset installations
    — driven by which year within the planning horizon transformers and conductors
    must be deployed — has a material effect on NPV rankings between solutions. For
    the rural feeder KLO14 at 60% HC, solution (6) replaced fewer LV transformers
    than solution (3) but at earlier years, resulting in a higher NPV transformer
    cost despite fewer physical assets being replaced.
  lesson_learnt: When comparing investment options for PV hosting capacity, the year
    of required asset installation must be explicitly modelled in NPV calculations
    — a solution requiring fewer assets but earlier installation can be more expensive
    in NPV terms than one requiring more assets installed later; simple asset-count
    comparisons will mislead investment decisions.
