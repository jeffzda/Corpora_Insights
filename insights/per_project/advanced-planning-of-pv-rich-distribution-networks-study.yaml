  what_happened: The future level of PV feed-in tariffs was found to materially affect
    which solution is cheapest for rural feeders at 100% hosting capacity. For SMR8
    at 100% HC, halving the feed-in tariff from 10.2c/kWh to 5.1c/kWh caused the cheapest
    solution to switch from Network Smart Batteries (solution 6) to tailored inverter
    settings (solution 3), because the PV curtailment cost component of solution 3
    dropped from nearly half to less than a quarter of total solution cost.
  lesson_learnt: Distribution network investment decisions that include curtailment
    costs as part of NPV comparisons must include sensitivity analysis on future feed-in
    tariff levels — the optimal solution ranking is sensitive to PV curtailment cost
    assumptions, particularly for rural feeders and high hosting capacity targets
    where curtailment volumes are significant.
