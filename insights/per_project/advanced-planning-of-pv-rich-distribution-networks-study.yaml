  project_name: Advanced Planning of PV-Rich Distribution Networks
  what_happened: Despite the ability to automate PSS Sincal data extraction via Python
    scripting, the team found that manual verification of extracted data remained
    necessary due to the complexity of HV feeder configurations including SWER lines
    and node connection phasing, and that automation of distribution transformer modelling
    from multiple spreadsheets was more error-prone than the core HV extraction.
  lesson_learnt: Automated data extraction from DNSP network model databases should
    always include a manual verification step — complex feeder topologies with SWER
    connections and mixed phasing introduce errors that automated scripts cannot reliably
    detect, and distributing transformer modelling across multiple external spreadsheets
    increases error risk beyond what automation alone can manage.
