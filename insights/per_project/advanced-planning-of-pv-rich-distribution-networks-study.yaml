  what_happened: For the long rural feeder SMR8 at 60% HC, the LV OLTC solution (4)
    required just under 300 OLTC-fitted transformers, with a minimum cost of $20.4
    million (no OpEx) rising to near $70 million with OpEx — compared to $737,490
    for the cheapest alternative — meaning it was between 27× and 95× more expensive
    than the next viable solution.
  lesson_learnt: LV OLTC transformer replacement is particularly uneconomic in long
    rural feeders with many LV substations per customer — the combination of non-retrofittable
    transformers and large numbers of voltage-affected substations creates cost multiples
    that no plausible future OLTC price reduction can bridge; rural network planners
    should exclude this solution from cost-competitive analysis for such feeder types.
