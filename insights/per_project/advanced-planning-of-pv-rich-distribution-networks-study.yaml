  source_title: 'Advanced Planning of PV-Rich Distribution Networks – Deliverable
    4: Non-Traditional Solutions'
  publish_date: 2020-08
  project_name: Advanced Planning of PV-Rich Distribution Networks
  what_happened: 'Two regulatory/incentive pathways were identified to mobilise advanced
    battery controller adoption at scale: (1) direct financial incentives or subsidised
    BES systems with network-smart controllers for households, and (2) mandatory technical
    requirements similar to the Volt-Watt/Volt-var mandate applied to PV inverters.'
  lesson_learnt: Governments and DNSPs seeking to unlock the network benefits of residential
    battery storage should develop explicit policy pathways — either incentive-based
    payments or mandatory connection standards — to drive adoption of advanced (network-smart)
    battery controllers rather than leaving deployment to market forces that favour
    OTS controllers with no network benefit.
