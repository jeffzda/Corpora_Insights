  source_title: 'Advanced Planning of PV-Rich Distribution Networks – Deliverable
    3: Traditional Solutions'
  publish_date: 2020-02
  project_name: Advanced Planning of PV-Rich Distribution Networks
  what_happened: Reducing OLTC and/or off-load tap positions to increase PV hosting
    capacity introduced a risk of excessive voltage drop during unexpected peak demand
    conditions or under future high-demand technologies such as electric vehicles,
    as the same voltage headroom that accommodates PV generation creates deeper voltage
    drops under high load.
  lesson_learnt: Before implementing tap changer adjustments to increase PV hosting
    capacity, DNSPs must assess the network's voltage performance under peak demand
    scenarios and future high-demand loads (e.g., EV charging) — the same tap reduction
    that provides headroom for PV-driven voltage rise can create statutory undervoltage
    conditions under peak demand.
