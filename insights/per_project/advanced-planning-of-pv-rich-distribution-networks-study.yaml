- record_id: ARENA-DLV-44770
  source_title: 'Advanced Planning of PV-Rich Distribution Networks – Deliverable
    3: Traditional Solutions'
  publish_date: 2020-02
  project_name: Advanced Planning of PV-Rich Distribution Networks
  what_happened: The combined Volt-Watt/Volt-var effect caused a counterintuitive
    result in curtailment behaviour — as PV penetration increased from 20% to 100%,
    total curtailment as a percentage of total PV generation did not increase significantly
    (0.05% at 20% to 0.51% at 100% for CRE21), because more PV inverters collectively
    absorbed more reactive power, keeping voltages lower and reducing the need for
    Volt-Watt curtailment per customer.
  lesson_learnt: DNSPs and PV proponents should not assume that curtailment rates
    will increase proportionally with PV penetration when Volt-var is enabled — the
    reactive power pooling effect from large numbers of Volt-var-enabled inverters
    provides a self-compensating voltage management mechanism that keeps individual
    and aggregate curtailment rates low even at very high penetration levels.
