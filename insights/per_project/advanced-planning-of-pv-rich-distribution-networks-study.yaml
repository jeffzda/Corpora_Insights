  what_happened: On the short rural feeder KLO14, OLTC-fitted LV transformers required
    installation on 79% of all LV transformers (553 out of 700) to achieve 100% PV
    hosting capacity — with more than half of installations concentrated at just 20%
    penetration — predominantly on low-rated transformers below 50 kVA.
  lesson_learnt: Short rural networks with large numbers of small-rated transformers
    face a much higher OLTC installation burden than urban networks (up to 79% of
    transformers by 100% penetration); investment programmes for rural networks must
    plan for early, large-scale OLTC deployment and prioritise small-capacity transformer
    replacements.
