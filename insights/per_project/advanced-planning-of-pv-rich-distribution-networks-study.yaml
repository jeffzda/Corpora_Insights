  source_title: 'Advanced Planning of PV-Rich Distribution Networks – Deliverable
    4: Non-Traditional Solutions'
  publish_date: 2020-08
  project_name: Advanced Planning of PV-Rich Distribution Networks
  what_happened: Adjusting off-load tap changers on LV transformers successfully increased
    solar PV hosting capacity from 20% to 40% on urban and short rural feeders by
    reducing voltage issues, but provided limited benefit to long rural feeders with
    SWER connections where voltage rise from solar PV can exceed the tap step magnitude.
  lesson_learnt: Off-load tap changer adjustment is a cost-effective first step to
    increase PV hosting capacity on urban and short rural feeders to ~40%, but long
    rural SWER networks require alternative solutions as voltage rise from PV on SWER
    connections can exceed what tap adjustment can correct.
