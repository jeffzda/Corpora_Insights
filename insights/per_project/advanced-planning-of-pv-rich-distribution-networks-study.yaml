- record_id: ARENA-DLV-44754
  source_title: 'Advanced Planning of PV-Rich Distribution Networks – Deliverable
    3: Traditional Solutions'
  publish_date: 2020-02
  project_name: Advanced Planning of PV-Rich Distribution Networks
  what_happened: The Volt-var function, while effective at reducing voltage rise,
    significantly increased thermal utilisation of low-capacity LV transformers (≤50
    kVA, single-phase) because reactive power absorption increases current flow —
    these transformers became overloaded at much lower PV penetration levels than
    they would without Volt-var enabled.
  lesson_learnt: DNSPs enabling Volt-var on residential PV inverters must include
    transformer thermal capacity as a co-planning constraint — small LV transformers
    (≤50 kVA) will become a congestion bottleneck at relatively low PV penetrations
    and require proactive augmentation planning before this threshold is reached.
