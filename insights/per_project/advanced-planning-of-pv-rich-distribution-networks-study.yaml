  publish_date: 2020-08
  project_name: Advanced Planning of PV-Rich Distribution Networks
  what_happened: The study used a homogeneous modelling assumption — all customers
    with the same inverter settings, all BES at same capacity and controller type
    — whereas in real networks customers will have different technologies, ages, and
    settings installed at different times, with some continuing to operate under older
    standards as new ones are introduced.
  lesson_learnt: Network simulation studies for PV-rich distribution planning should
    include heterogeneous technology scenarios reflecting the actual mix of old and
    new inverter standards and battery controller types; results from homogeneous
    assumptions will overestimate the effectiveness of uniform policy interventions
    such as mandatory settings.
