- record_id: ARENA-DLV-44759
  source_title: 'Advanced Planning of PV-Rich Distribution Networks – Deliverable
    3: Traditional Solutions'
  publish_date: 2020-02
  project_name: Advanced Planning of PV-Rich Distribution Networks
  what_happened: LV transformer augmentation was identified as the most effective
    and targeted use of network augmentation for PV-rich networks — small-capacity
    LV transformers (≤50 kVA, single-phase) were the primary congestion bottleneck
    at penetration levels below 40%, while HV conductors only became an issue above
    80% penetration and LV conductors experienced no congestion in any scenario.
  lesson_learnt: When planning augmentation for PV-rich LV networks, DNSPs should
    prioritise replacement of small-capacity single-phase LV transformers (≤50 kVA)
    first, as these are the assets most likely to become congested at relatively low
    PV penetrations — HV conductor augmentation can generally be deferred until penetration
    exceeds 80%.
