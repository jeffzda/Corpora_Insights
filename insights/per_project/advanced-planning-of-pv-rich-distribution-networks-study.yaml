  what_happened: The study found that DNSPs' current practice of applying simple PV
    penetration limits based on distribution transformer capacity underestimates actual
    hosting capacity due to voltage rise issues in LV networks and aggregated congestion
    in HV networks, and prevents adoption of non-traditional solutions — creating
    unnecessary delays and cost for customers seeking solar connections.
