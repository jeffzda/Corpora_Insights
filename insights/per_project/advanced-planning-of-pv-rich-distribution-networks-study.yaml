  project_name: Advanced Planning of PV-Rich Distribution Networks
  what_happened: Off-the-shelf (OTS) residential battery systems were found to provide
    no meaningful increase in PV hosting capacity because they charge from surplus
    PV and reach full state-of-charge before peak generation, allowing continued grid
    exports and failing to mitigate voltage rise or asset congestion.
  lesson_learnt: Standard off-the-shelf residential battery control strategies should
    not be counted on by DNSPs to increase PV hosting capacity; network-friendly battery
    connection requirements must be mandated to realise grid benefits from residential
    batteries.
