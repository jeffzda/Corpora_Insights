  project_name: Advanced Planning of PV-Rich Distribution Networks
  what_happened: LV OLTC-fitted transformers with adaptive control (using smart meter
    data to dynamically calculate voltage targets), combined with off-load tap adjustment
    and network augmentation, increased hosting capacity to 100% across all four feeder
    types — up from 20–40% with traditional solutions alone — while keeping curtailment
