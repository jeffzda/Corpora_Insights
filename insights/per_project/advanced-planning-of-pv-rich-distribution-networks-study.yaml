  project_name: Advanced Planning of PV-Rich Distribution Networks
  what_happened: Traditional solutions (off-load tap changers and zone substation
    OLTC adjustment combined with augmentation and VicSet) were found effective up
    to 40–60% PV hosting capacity in urban feeders but provided only limited benefit
    in rural feeders, being unable to achieve even 20% hosting capacity on long rural
    feeders such as SMR8.
  lesson_learnt: DNSPs should not assume that traditional voltage management tools
    (tap changers, OLTC adjustment, augmentation) will be sufficient for rural feeders
    at even modest PV penetrations; non-traditional solutions must be evaluated for
