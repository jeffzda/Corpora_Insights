  what_happened: The study demonstrated that a strong negative linear correlation
    (Pearson coefficient –0.94) exists between aggregated active power and maximum
    LV network voltage across urban HV feeders, validating aggregated active power
    as a reliable single input variable for a univariate regression HC estimation
    model.
  lesson_learnt: Future DNSP analytics projects seeking to estimate PV hosting capacity
    from smart meter data can use aggregated active power as a reliable proxy for
    network voltage state — reactive power has negligible correlation with voltage
    and need not be included in the primary estimation model, simplifying implementation.
