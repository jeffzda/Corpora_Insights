- record_id: ARENA-DLV-17252
  source_title: 'Advanced Planning of PV-Rich Distribution Networks – Deliverable
    4: Non-Traditional Solutions'
  publish_date: 2020-08
  project_name: Advanced Planning of PV-Rich Distribution Networks
  what_happened: Enabling both Volt-Watt and Volt-var functions together (using Victorian
    DNSP default settings) was found to keep maximum voltages across all feeders to
    1.12 pu and generation curtailment below 2% at all penetration levels, substantially
    outperforming Volt-Watt alone.
  lesson_learnt: DNSPs across Australia should require both Volt-Watt and Volt-var
    inverter control functions to be enabled with settings equivalent to the Victorian
    DNSP standard; using Volt-Watt alone leads to significant PV curtailment that
    reduces owner profitability, while the combined functions dramatically reduce
    both voltage rise and curtailment.
