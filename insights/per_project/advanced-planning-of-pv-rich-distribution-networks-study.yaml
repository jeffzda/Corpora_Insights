  what_happened: The adaptive OLTC control logic managed both voltage rise during
    peak PV generation and voltage drop during peak load (evening/night) without any
    reconfiguration of settings, demonstrating that the same infrastructure investment
    that addresses today's PV voltage rise problem also provides resilience against
    future voltage drop issues from increased demand technologies such as electric
    vehicles.
  lesson_learnt: LV OLTC-fitted transformers with adaptive control are a future-proof
    infrastructure investment because they handle bidirectional voltage management
    without settings reconfiguration; network planners justifying OLTC investment
    should include avoided future EV-related voltage drop remediation costs in the
    business case.
