    practice; this means the benefits of inverter and battery solutions are likely
    to be lower in the short term than the study results indicate.
  lesson_learnt: DNSP planning studies using homogeneous inverter or battery setting
    assumptions should discount short-term benefits to account for the mixed installed
    base, and implementation timelines should recognise that benefits accrue gradually
    as the fleet turns over.
