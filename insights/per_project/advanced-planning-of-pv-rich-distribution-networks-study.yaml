  publish_date: 2021-02
  project_name: Advanced Planning of PV-Rich Distribution Networks
  what_happened: Hosting capacity studies that model only HV feeders and aggregate
    customers at the distribution transformer level were found to over- or underestimate
    voltage rise impacts because customer-level voltages at LV feeder ends are not
    captured; congestion within LV feeders beyond distribution transformers is also
    missed.
  lesson_learnt: DNSPs conducting PV hosting capacity studies must use integrated
    HV-LV models that explicitly represent LV feeders (or pseudo LV feeders) down
    to individual customer connection points; HV-only models are insufficient for
    quantifying voltage violations or the benefits of voltage management solutions.
