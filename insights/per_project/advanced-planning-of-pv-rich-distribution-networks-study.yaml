- record_id: ARENA-DLV-44765
  source_title: 'Advanced Planning of PV-Rich Distribution Networks – Deliverable
    3: Traditional Solutions'
  publish_date: 2020-02
  project_name: Advanced Planning of PV-Rich Distribution Networks
  what_happened: In active power priority (Watt-priority) mode — the default for commercially
    available residential PV inverters — reactive power absorption capability of inverters
    was constrained to near-zero during peak generation periods (midday), limiting
    the effectiveness of Volt-var control precisely when voltage management is most
    needed.
  lesson_learnt: Network planners modelling the effectiveness of Volt-var for voltage
    management must account for inverter power priority mode — standard Watt-priority
    inverters will have severely limited reactive capability at peak irradiance, and
    benefits of Volt-var assumed under reactive priority or oversized inverter assumptions
    will not be realised with standard equipment unless inverter specifications are
    changed.
