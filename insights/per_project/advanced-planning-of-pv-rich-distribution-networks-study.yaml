    owners (reducing grid imports by at least 80%) but deliver no network hosting
    capacity benefit; regulators and DNSPs developing battery incentive schemes should
    distinguish between customer-value and network-value outcomes and target incentives
    toward advanced controllers rather than standard OTS systems.
