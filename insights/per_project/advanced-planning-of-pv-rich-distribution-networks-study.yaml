  what_happened: Distribution transformer loss parameters (no-load and on-load losses)
    and tap positions were not available in the AusNet Services data, requiring the
    research team to make assumptions for all distribution transformers and adjust
    tap positions based on a peak loading scenario to keep voltages within statutory
    limits.
  lesson_learnt: When developing distribution network models from DNSP-provided data,
    plan for missing transformer loss parameters and actual tap position settings
    — these are rarely included in standard GIS or planning database exports and will
    need to be assumed or estimated, introducing modelling uncertainty that should
    be explicitly documented.
