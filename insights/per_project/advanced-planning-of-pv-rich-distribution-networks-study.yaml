  source_title: 'Advanced Planning of PV-Rich Distribution Networks – Deliverable
    5: Cost Comparison Among Potential Solutions'
  publish_date: 2020-12
  project_name: Advanced Planning of PV-Rich Distribution Networks
  what_happened: The short rural feeder KLO14 required approximately 5km of HV reconductoring
    due to asset congestion as part of any viable complete solution, making it the
    most expensive feeder across all hosting capacity scenarios, with the cheapest
    solution at 60% HC costing $3.7 million — compared to $45,738 for the cheapest
    urban solution at the same hosting capacity target.
  lesson_learnt: HV conductor congestion in rural feeders creates a mandatory and
    expensive augmentation floor that cannot be avoided regardless of which voltage-management
    solution is chosen — planners should identify HV reconductoring requirements early
    in the rural network assessment process as these dominate total solution cost
    and are insensitive to the choice of voltage solution.
