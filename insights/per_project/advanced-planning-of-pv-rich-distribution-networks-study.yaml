  project_name: Advanced Planning of PV-Rich Distribution Networks
  what_happened: Deterministic PV hosting capacity studies that fix PV location, size,
    and irradiance profiles were found to risk significant over- or underestimation
    because actual PV adoption characteristics differ from assumed inputs; uncertainty
    in PV location, size, and demand is inherent in any planning horizon.
  lesson_learnt: DNSPs should account for uncertainty in PV location, system size,
    irradiance, and demand profiles in hosting capacity studies, using at minimum
    uneven penetration distributions and multiple PV system sizes; Monte Carlo simulation
    provides the most robust uncertainty treatment for advanced studies.
