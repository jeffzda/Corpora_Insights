- record_id: ARENA-DLV-17268
  source_title: 'Advanced Planning of PV-Rich Distribution Networks – Deliverable
    4: Non-Traditional Solutions'
  publish_date: 2020-08
  project_name: Advanced Planning of PV-Rich Distribution Networks
  what_happened: Existing zone substation OLTC designs were found to have very few
    tap positions available for voltage reduction (most designed to boost voltage)
    and large deadbands of 2–3%, limiting the granularity and flexibility of dynamic
    voltage target control for managing high-PV scenarios.
  lesson_learnt: Future OLTC procurement specifications should require additional
    taps in the voltage-reduction range and smaller deadbands (finer than 2–3%) to
    enable effective dynamic voltage management as PV penetration increases; retrofitting
    existing OLTCs will not provide adequate control flexibility.
