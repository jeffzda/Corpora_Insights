  source_title: Final Report Advanced Planning of PV-Rich Distribution Networks
  publish_date: 2021-02
  project_name: Advanced Planning of PV-Rich Distribution Networks
  what_happened: OLTC tap-change actions at zone substations were found to reduce
    the accuracy of smart meter-driven PV hosting capacity estimates because voltage
    spikes caused by tap changes appear as outliers in the smart meter voltage data,
    degrading both the regression model accuracy and prediction limits.
  lesson_learnt: When implementing smart meter-driven hosting capacity tools, DNSPs
    should filter or flag voltage data points corresponding to OLTC tap-change events
    before training the regression model, to prevent outlier-induced accuracy degradation.
