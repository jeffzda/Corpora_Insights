  source_title: Final Report Advanced Planning of PV-Rich Distribution Networks
  publish_date: 2021-02
  project_name: Advanced Planning of PV-Rich Distribution Networks
  what_happened: Intelligent dynamic voltage control at zone substation OLTCs — using
    downstream PV generation as a proxy to adjust the voltage target — was found to
    effectively manage LV voltage rise across all feeder types and penetrations, and
    is more practical than stricter inverter settings for DNSPs unable to champion
    new inverter standards, though it is slightly more expensive.
  lesson_learnt: Where stricter inverter standards are not achievable, DNSPs should
    implement dynamic intelligent voltage control at zone substation OLTCs as a cost-effective
    alternative that works on existing assets, reduces voltage rise for all feeder
    types, and can also address future voltage drops from EV charging.
