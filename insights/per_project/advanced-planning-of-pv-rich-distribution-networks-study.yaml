  project_name: Advanced Planning of PV-Rich Distribution Networks
  what_happened: A dynamic voltage target at the zone substation OLTC (reducing target
    voltage in proportion to reverse power flow) effectively created voltage headroom
    and delayed voltage violations until 80% PV penetration on the CRE21 urban feeder,
    while also reducing PV curtailment substantially compared to the business-as-usual
    case.
  lesson_learnt: A dynamic voltage target at the zone substation OLTC is a low-cost,
    software-based intervention that can defer voltage problems and reduce PV curtailment
    up to moderate penetration levels; it should be considered as a near-term, transitional
    measure before more capital-intensive solutions are required, particularly for
    networks with homogeneous downstream feeder characteristics.
