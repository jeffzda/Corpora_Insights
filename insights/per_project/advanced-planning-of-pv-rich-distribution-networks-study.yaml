  what_happened: On the long rural feeder SMR8, OTS BES adoption provided no hosting
    capacity improvement beyond business-as-usual (both remaining at 20% penetration),
    unlike on urban feeders where the combination of off-load taps and OTS BES could
    reach 80%; voltage issues remained the binding constraint even after transformer
    augmentation.
