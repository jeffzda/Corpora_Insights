  what_happened: The Network Smart BES controller increased household grid dependence
    by 2–4 percentage points compared to OTS BES controllers, as it prioritises network
    support (spreading charging) over household self-sufficiency; however, the cost
    of this incremental grid energy import was assessed as considerably lower than
    the capital investment in network augmentation that the NS controller avoided.
  lesson_learnt: When designing network-support battery controller incentives, the
    marginal increase in customer electricity costs from a network-smart controller
    (2–4% higher grid dependence) should be explicitly compared against the avoided
    network augmentation capital expenditure — the customer cost is likely to be far
    smaller than network savings, supporting the business case for incentive or mandated
    schemes.
