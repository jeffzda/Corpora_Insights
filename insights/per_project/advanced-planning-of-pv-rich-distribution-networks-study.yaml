  what_happened: Adjustment of off-load tap changers provided only marginal benefit
    to the long rural feeder R1 (SMR8) with extensive SWER connections — the hosting
    capacity remained at 20% because voltage rise in SWER-connected PV customers exceeded
    the available tap reduction step, and SWER transformer tap capability was inherently
    limited.
