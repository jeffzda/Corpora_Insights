  project_name: Advanced Planning of PV-Rich Distribution Networks
  what_happened: Although OTS battery systems did not benefit the network, they provided
    significant customer financial benefit by reducing household grid energy imports
    by at least 80%, with median annual Grid Dependence Index of 0–2% in summer and
    spring and 18–25% in winter — confirming strong customer value but network neutrality.
