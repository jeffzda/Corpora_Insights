  source_title: 'Advanced Planning of PV-Rich Distribution Networks – Deliverable
    5: Cost Comparison Among Potential Solutions'
  publish_date: 2020-12
  project_name: Advanced Planning of PV-Rich Distribution Networks
  what_happened: Rural feeders have substantially more LV transformers per customer
    than urban feeders (e.g., SMR8 has 765 LV transformers for 3,669 customers versus
    HPK11 with 45 LV transformers for 5,278 customers), meaning that off-load tap
    adjustment costs, LV OLTC installation costs, and augmentation costs all scale
    dramatically worse in rural contexts — making solutions viable for urban feeders
    prohibitively expensive in rural ones.
  lesson_learnt: The ratio of LV transformers to customers is a critical parameter
    for estimating the cost of any voltage-management solution in distribution networks
    with high PV penetration — DNSPs and planners should calculate this ratio early
    in solution screening, as solutions with per-transformer costs (OLTCs, tap adjustments)
    become cost-prohibitive in rural feeders where this ratio is much higher than
    in urban feeders.
