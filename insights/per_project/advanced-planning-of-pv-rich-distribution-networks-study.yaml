  - 53
  evidence_excerpt: While a reduced utilisation level of all assets was observed when
    compared to the BAU case, almost the same performance is observed in terms of
    the number of congestion issues... At 40% PV penetration, 3 out of 79 LV transformers
    (i.e., ~3%) become congested due to PV generation. This number increases further
    as PV penetration increases, with 14 transformers (i.e., ~17%) become overloaded
    at 100% PV penetration.
