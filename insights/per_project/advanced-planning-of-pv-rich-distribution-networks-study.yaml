  project_name: Advanced Planning of PV-Rich Distribution Networks
  what_happened: Network augmentation alone (replacing conductors and transformers)
    was found to be ineffective at resolving voltage rise problems even at low PV
    penetrations, because new conductors have similar impedances to old ones — meaning
    voltage problems persist even after thermal capacity is resolved.
  lesson_learnt: Network augmentation should not be used as a standalone solution
    for voltage compliance in PV-rich distribution networks — it must be combined
    with a voltage-managing solution (inverter settings, OLTCs, or smart batteries);
    planning frameworks that treat augmentation as a complete response to PV-related
    network issues will underestimate residual voltage non-compliance.
