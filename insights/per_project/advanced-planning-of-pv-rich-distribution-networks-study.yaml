  what_happened: The Victorian Volt-Watt and Volt-var (VicSet) inverter settings,
    mandated since December 2019, were found to curtail on average only ~1% of potential
    PV generation across an HV feeder while substantially reducing the number of customers
    experiencing voltage violations compared to the Australian standard (Volt-Watt
    only).
