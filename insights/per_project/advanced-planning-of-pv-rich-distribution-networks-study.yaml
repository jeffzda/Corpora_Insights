  what_happened: LV OLTC-fitted transformers were technically effective in managing
    voltage rise across all feeder types and PV penetrations but were found to be
    prohibitively expensive, particularly for rural feeders, because old transformers
    cannot be retrofitted with OLTCs and many units must be replaced.
  lesson_learnt: LV OLTC-fitted transformers should not be the primary strategy for
    increasing PV hosting capacity given their high cost; they are viable only in
    urban feeders where the number of units per customer is low and where zone substation
    intelligent voltage control is not feasible.
