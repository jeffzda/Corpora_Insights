- record_id: ARENA-DLV-17253
  source_title: 'Advanced Planning of PV-Rich Distribution Networks – Deliverable
    4: Non-Traditional Solutions'
  publish_date: 2020-08
  project_name: Advanced Planning of PV-Rich Distribution Networks
  what_happened: Enabling the Volt-var function increased reactive power absorption
    in LV networks, causing larger currents in conductors and transformers. Low-capacity
    LV transformers became overloaded at penetration levels substantially lower than
    would occur without the Volt-var function enabled.
  lesson_learnt: Network planners enabling Volt-var inverter functions must plan for
    augmentation of low-capacity LV transformers earlier than they would otherwise;
    the reactive power absorbed by the Volt-var function increases thermal loading
    and can trigger transformer overloads at much lower PV penetrations than anticipated.
  issue_severity: moderate
  project_type: network/grid
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: Network augmentation of congested LV transformers was identified
    as the effective remedy and needs to be planned ahead of Volt-var deployment.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id003
  - 4
  - 7
  - 149
  evidence_excerpt: The Volt-var function can exacerbate the thermal utilization of
    assets. The significant amount of reactive power being absorbed results in larger
    currents flowing through conductors and transformers. Most affected are the low-capacity
    LV transformers which become overloaded at relatively low penetration levels;
    at much lower levels than without having the Volt-var function. This can be effectively
    solved by network augmentation which needs to be planned for.
