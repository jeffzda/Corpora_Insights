- record_id: ARENA-DLV-17257
  source_title: 'Advanced Planning of PV-Rich Distribution Networks – Deliverable
    4: Non-Traditional Solutions'
  publish_date: 2020-08
  project_name: Advanced Planning of PV-Rich Distribution Networks
  what_happened: Tailored Volt-var settings, while eliminating voltage problems, did
    not reduce asset congestion — LV transformer overloading occurred from 40% penetration
    onwards and the number increased significantly with penetration (up to 17% of
    transformers congested at 100% penetration on the CRE21 urban feeder).
  lesson_learnt: Tailored inverter settings alone cannot resolve asset congestion;
    network planners must pair any inverter-based voltage solution with a separate
    congestion management strategy (augmentation) as reactive power absorption from
    Volt-var increases transformer loading and overloading begins at moderate penetration
    levels.
  issue_severity: moderate
  project_type: network/grid
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: null
  failure_mode: unvalidated technical assumptions
