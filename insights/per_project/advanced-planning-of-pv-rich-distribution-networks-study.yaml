- record_id: ARENA-DLV-17269
  source_title: 'Advanced Planning of PV-Rich Distribution Networks – Deliverable
    4: Non-Traditional Solutions'
  publish_date: 2020-08
  project_name: Advanced Planning of PV-Rich Distribution Networks
  what_happened: Dynamic zone substation OLTC voltage target is only suitable for
    zone substations where all connected HV feeders have similar demand/generation
    characteristics; on substations serving mixed feeders, reducing voltage to manage
    one feeder's voltage rise risks creating voltage drop violations on another feeder.
  lesson_learnt: Before deploying dynamic voltage target control at a zone substation,
    planners must assess whether all downstream HV feeders have sufficiently similar
    PV and demand profiles; if feeders are heterogeneous, this solution can worsen
    voltage compliance on some feeders while improving others and a more targeted
    LV-level solution should be prioritised.
