- record_id: ARENA-DLV-17254
  source_title: 'Advanced Planning of PV-Rich Distribution Networks – Deliverable
    4: Non-Traditional Solutions'
  publish_date: 2020-08
  project_name: Advanced Planning of PV-Rich Distribution Networks
  what_happened: The Volt-var function, when aggregated across many inverters, significantly
    increased reactive power import at the head of the HV feeder, creating a risk
    that power factor limits at the transmission-distribution interface could be breached.
  lesson_learnt: DNSPs deploying Volt-var at scale should assess power factor implications
    at the transmission-distribution interface and plan capacitor bank installation
    in the sub-transmission network to compensate for the aggregate reactive power
    increase caused by widespread Volt-var operation.
