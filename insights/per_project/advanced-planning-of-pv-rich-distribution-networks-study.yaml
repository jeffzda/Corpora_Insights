  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: Network augmentation (replacement of small LV transformers with
    higher-rated units) was found to effectively resolve Volt-var-induced thermal
    congestion and should be planned concurrently with any Volt-var mandate.
  transferability: broad
  delay_magnitude: null
