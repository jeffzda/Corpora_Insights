- record_id: ARENA-DLV-17262
  source_title: 'Advanced Planning of PV-Rich Distribution Networks – Deliverable
    4: Non-Traditional Solutions'
  publish_date: 2020-08
  project_name: Advanced Planning of PV-Rich Distribution Networks
  what_happened: Off-the-shelf (OTS) residential battery energy storage systems, despite
    widespread customer adoption, provided no material increase in solar PV hosting
    capacity beyond what was achievable with off-load tap adjustment alone; the OTS
    batteries reached full state-of-charge before peak PV generation hours and failed
    to reduce peak exports to the grid.
  lesson_learnt: DNSPs and policymakers should not assume that widespread adoption
    of off-the-shelf residential batteries will significantly increase network hosting
    capacity or reduce peak PV exports; OTS controllers are optimised for bill reduction,
    not network support, and reach full charge too early in the day to absorb midday
    peak generation.
