  what_happened: For the urban feeder CRE21, Network Smart Batteries (solution 6)
    eliminated the need for any network augmentation at both 60% and 100% PV hosting
    capacity, achieving the complete solution at a total NPV cost of only $59,250
    (solely from off-load tap adjustments), because NS batteries managed asset congestion
    and kept voltages within statutory limits without triggering VicSet curtailment.
  lesson_learnt: In well-networked urban feeders, deployment of customer-owned network-smart
    batteries — at zero direct cost to the DNSP — can defer or eliminate the need
    for network augmentation entirely; DNSPs should model NS battery uptake scenarios
    before committing to capital-intensive grid reinforcement programs in high-PV-penetration
    urban areas.
