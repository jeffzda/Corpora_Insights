  what_happened: The PSS Sincal feeder database provided by AusNet Services did not
    include phase connection information (single-phase vs three-phase) for nodes and
    lines, requiring the research team to develop an additional automated algorithm
    (Breadth First Search) to infer phasing from network topology, with manual verification
    still required.
  lesson_learnt: When receiving DNSP network model data for modelling projects, explicitly
    request phase connection information as a separate data item — it is often absent
    from standard database exports and its absence requires significant additional
    processing effort including both algorithmic and manual verification steps.
