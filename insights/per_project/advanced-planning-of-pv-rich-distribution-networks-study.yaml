- record_id: ARENA-DLV-53418
  source_title: 'Advanced Planning of PV-Rich Distribution Networks – Deliverable
    5: Cost Comparison Among Potential Solutions'
  publish_date: 2020-12
  project_name: Advanced Planning of PV-Rich Distribution Networks
  what_happened: The cost comparison methodology used NPV accounting with a 4.83%
    real discount rate (AusNet Services nominal rate of 6.44% minus 1.61% inflation),
    applied to asset costs over multi-decade planning horizons of up to 49 years,
    which meant assets required in later years were substantially discounted — making
    the year of installation a more important cost driver than the number of assets
    in some scenarios.
  lesson_learnt: Long-horizon distribution network investment plans must use NPV accounting
    with explicit real discount rates rather than nominal asset counts or undiscounted
    capital costs — the discount rate effect over 30–49 year planning horizons can
    reverse the cost ranking of solutions that differ primarily in the timing of required
    asset installations rather than the quantity of assets.
