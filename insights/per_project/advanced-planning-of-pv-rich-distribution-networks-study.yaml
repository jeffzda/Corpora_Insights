  project_name: Advanced Planning of PV-Rich Distribution Networks
  what_happened: Worst-case snapshot power flow assessments were found to be insufficient
    for quantifying PV hosting capacity because they do not capture the time-dependent
    performance of solutions, particularly the amount of PV curtailment triggered
    over time; this can misrepresent the customer impact of different solution options.
  lesson_learnt: DNSPs should use time-series simulations at 30-minute resolution
    covering at least 14 consecutive days per season when assessing PV hosting capacity;
    this captures seasonal variation and curtailment accurately with manageable computation
    time, unlike worst-case snapshot approaches.
