  what_happened: In the urban feeder HPK11, congestion of HV conductors emerged at
    80% PV penetration (1 km congested at 131%) and increased significantly at 100%
    penetration (5 km at 164%), a pattern not observed in the smaller urban feeder
    CRE21, indicating that feeder scale and topology drive the onset of HV conductor
    congestion.
  lesson_learnt: HV conductor augmentation for urban feeders should be planned as
    a staged investment triggered at approximately 80% PV penetration rather than
    included in early-stage augmentation programs — at lower penetrations the investment
    is premature, but planning must begin well before this threshold is reached given
    long asset procurement and installation lead times.
