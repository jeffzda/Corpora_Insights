  what_happened: The 5 kVA per-phase export limit imposed by AusNet Services on residential
    PV inverters, combined with the presence of commercial load on HV feeders, significantly
    moderated reverse power flows and thermal utilisation of HV conductors — particularly
    in the urban feeder CRE21 where HV lines remained uncongested up to 80% PV penetration.
  lesson_learnt: DNSPs should recognise that per-phase export limits on residential
    PV inverters (e.g., 5 kVA) provide a significant co-benefit in managing HV feeder
    thermal loading — this effect should be explicitly included in HV feeder capacity
    planning models, as ignoring it will overestimate the need for HV conductor augmentation.
