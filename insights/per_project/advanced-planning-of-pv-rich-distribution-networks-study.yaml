  what_happened: The existing DNSP approach of applying transformer-capacity-based
    PV penetration limits to manage connection requests was found to be an inadequate
    planning tool that could both under- and over-estimate actual network hosting
    capacity, particularly due to voltage issues in LV networks and aggregated congestion
    in HV networks.
  lesson_learnt: DNSPs relying solely on transformer-capacity-based PV penetration
    limits for connection decisions risk creating unnecessary barriers to solar PV
    adoption or allowing connections that cause voltage violations — advanced hosting
    capacity estimation using smart meter data provides a more accurate and network-specific
    alternative that should be incorporated into planning practice.
