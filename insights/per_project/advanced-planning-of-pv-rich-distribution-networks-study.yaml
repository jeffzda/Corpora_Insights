  what_happened: The dynamic zone substation OLTC voltage target approach increased
    network congestion compared to the business-as-usual case because lower voltages
    reduced Volt-Watt curtailment, allowing more PV generation — and therefore more
    reverse power flow and thermal loading — through the network assets.
  lesson_learnt: Dynamic zone substation voltage target control must not be deployed
    in isolation; planners must account for the fact that reducing curtailment via
    voltage headroom increases thermal loading on transformers and conductors, requiring
    a companion congestion management strategy.
