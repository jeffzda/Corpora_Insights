  publish_date: 2019-10
  project_name: Advanced Planning of PV-Rich Distribution Networks
  what_happened: The smart meter-driven HC estimation methodology performed significantly
    better on rural LV networks (accurate HC estimations from 10–20% PV penetration,
    accuracy error <7% across all penetration levels) compared to urban networks (meaningful
    estimations only from 30% penetration, with errors up to 42% at low penetrations),
    due to the lower number of customers and feeders in rural networks producing more
    consistent voltage-power relationships.
  lesson_learnt: DNSPs applying smart meter-driven hosting capacity estimation should
    expect higher accuracy and earlier reliable results in rural LV networks (fewer
    customers, simpler feeder topology) than in urban networks — for urban networks
    with multiple feeders and high customer diversity, meaningful HC estimates should
    not be relied upon below 30% PV penetration.
