  project_name: Advanced Planning of PV-Rich Distribution Networks
  what_happened: The smart meter-driven hosting capacity model was found to require
    a minimum historical increase in PV penetration of 30% (urban feeders) or 20%
    (rural feeders) to produce accurate estimates; applying the model to periods with
    very modest PV penetrations that do not yet cause voltage rise resulted in over-
    or underestimations.
  lesson_learnt: DNSPs using smart meter-driven hosting capacity approaches must track
    cumulative PV installation records per distribution transformer and only apply
    the model once the required minimum PV penetration increase has been observed;
    applying it too early will produce unreliable estimates.
