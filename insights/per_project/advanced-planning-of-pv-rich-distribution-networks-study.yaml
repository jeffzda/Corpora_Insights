- record_id: ARENA-DLV-17256
  source_title: 'Advanced Planning of PV-Rich Distribution Networks – Deliverable
    4: Non-Traditional Solutions'
  publish_date: 2020-08
  project_name: Advanced Planning of PV-Rich Distribution Networks
  what_happened: Tailored (stricter) Volt-Watt and Volt-var inverter settings that
    curtail PV to zero at 1.10 pu fully mitigated all voltage issues across all four
    feeder types and all penetration levels, while adding only approximately 1% additional
    curtailment per penetration step compared to the Victorian default settings —
    totalling no more than 2% curtailment at 100% penetration.
  lesson_learnt: Stricter Volt-Watt settings that curtail to 0% at the statutory voltage
    limit are highly effective at eliminating voltage violations with negligible impact
    on customer generation; the additional curtailment (approximately 1% extra) is
    an acceptable trade-off for full voltage compliance, and DNSPs should consider
    location-specific or customer-specific tailored settings for weak parts of the
    network.
  issue_severity: minor
  project_type: network/grid
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: Stricter Volt-Watt settings (0% generation at 1.10 pu) applied
    uniformly to all inverters; voltage issues fully eliminated with total curtailment
    not exceeding 2% at 100% penetration.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id006
  - 4
  - 147
  evidence_excerpt: A more tailored set of Volt-Watt and Volt-Var settings is proved
    to be highly effective in limiting voltage problems in the network. Regardless
    of PV penetrations ad seasons, the maximum voltage in the network never exceeds
    above 1.10pu. While the curtailment of PV generation was found to be approximately
    1% higher for each penetration when compared to the BAU case (which had approximately
    1% of curtailment), this can still be considered negligible given the significant
    benefits provided (i.e., full mitigation of voltage issues). For example, with
    a 100% PV penetration, the total curtailment never exceeds 2% of the total solar
    PV generation, regardless the type of feeder.
