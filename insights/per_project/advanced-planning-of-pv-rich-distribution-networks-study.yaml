  project_name: Advanced Planning of PV-Rich Distribution Networks
  what_happened: The Volt-var function, when enabled across large numbers of residential
    PV inverters, significantly increased aggregate reactive power import at the head
    of HV feeders, creating a risk that power factor limits at the transmission-distribution
    interface could be breached.
  lesson_learnt: DNSPs mandating Volt-var on residential PV inverters must also plan
    for compensating reactive power at the sub-transmission level — adequate capacitor
    bank capacity in the upstream 66 kV sub-transmission network should be assessed
    and installed ahead of the Volt-var rollout to avoid power factor violations at
    the transmission-distribution interface.
