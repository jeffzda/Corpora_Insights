  source_title: 'Advanced Planning of PV-Rich Distribution Networks – Deliverable
    3: Traditional Solutions'
  publish_date: 2020-02
  project_name: Advanced Planning of PV-Rich Distribution Networks
  what_happened: Network augmentation (conductor and transformer replacement) was
    effective at resolving asset congestion issues but could not improve customer
    voltage compliance because the LV feeder conductors modelled already represented
    the lowest available impedance option, leaving voltage as the persistent hosting
    capacity constraint beyond 40% penetration.
  lesson_learnt: Network augmentation alone cannot increase PV hosting capacity beyond
    approximately 40% penetration where voltage issues dominate — DNSPs planning for
    high PV penetrations must pursue non-traditional solutions (smart inverter control,
    OLTC-fitted transformers, battery storage) as augmentation addresses congestion
    but not the fundamental voltage rise problem.
