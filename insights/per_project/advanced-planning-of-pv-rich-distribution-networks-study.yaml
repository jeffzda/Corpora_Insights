  source_title: Final Report Advanced Planning of PV-Rich Distribution Networks
  publish_date: 2021-02
  project_name: Advanced Planning of PV-Rich Distribution Networks
  what_happened: DNSPs across Australia adopted PV penetration limits based on distribution
    transformer capacity, but the lack of advanced planning approaches led to values
    that under- or over-estimated actual hosting capacity, creating barriers to PV
    adoption through delays and increased cost.
  lesson_learnt: Simple transformer-capacity-based PV penetration limits are inadequate
    for managing voltage rise and HV congestion at scale; DNSPs should invest in advanced
    HV-LV planning models to accurately assess hosting capacity and avoid unnecessary
    connection refusals or under-investment.
