  publish_date: 2020-12
  project_name: Advanced Planning of PV-Rich Distribution Networks
  what_happened: The modelling assumption that every customer with a PV system also
    has a battery (required to simplify NS battery analysis) was acknowledged as unrealistic,
    given that battery adoption lags PV adoption in practice. This simplification
    was necessary to make the analysis tractable but means real-world NS battery benefit
    estimates may be optimistic at intermediate penetration levels.
  lesson_learnt: Cost-benefit modelling of network-smart battery solutions must account
    for the lag between PV adoption and battery adoption — studies that assume co-deployment
    of batteries and PV systems will overestimate the hosting capacity benefits achievable
    from NS batteries at any given point in time, and DNSPs should apply a penetration
    discount when using such models for investment planning.
