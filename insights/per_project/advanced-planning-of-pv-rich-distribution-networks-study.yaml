  evidence_excerpt: In the aggregate, the Volt-var function significantly increases
    the reactive power being imported at the head of the HV feeder. This could potentially
    create issues in maintaining the power factor at the transmission-distribution
    network interface within the allowed limits. Adequate planning of capacitor banks
    in the upstream network (i.e., sub-transmission) might be required to compensate
