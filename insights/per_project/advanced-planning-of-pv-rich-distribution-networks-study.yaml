  project_name: Advanced Planning of PV-Rich Distribution Networks
  what_happened: The initial database of 351 HV feeders from AusNet Services required
    a data-cleaning process to remove feeders with missing information before selection,
    reducing the usable dataset to approximately 300 feeders; smart meter data quality
    and availability information was retained by AusNet Services and could not be
    incorporated into the University of Melbourne's feeder selection analysis.
  lesson_learnt: When structuring university-DNSP research collaborations involving
    network data, negotiate upfront data sharing agreements that include smart meter
    and data quality metadata — retaining this information solely within the DNSP
    prevents the research partner from performing fully informed feeder selection
    and forces reliance on the DNSP's expert judgement as a substitute for systematic
    analysis.
