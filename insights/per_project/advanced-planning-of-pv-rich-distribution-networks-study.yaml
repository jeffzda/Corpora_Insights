- record_id: ARENA-DLV-28358
  source_title: 'Advanced Planning of PV-Rich Distribution Networks - Deliverable
    1: HV-LV Modelling of Selected HV Feeders'
  publish_date: '2019-06-10'
  project_name: Advanced Planning of PV-Rich Distribution Networks
  what_happened: DNSPs across Australia were found to be applying simple transformer-capacity-based
    PV penetration limits that likely under- or over-estimate actual hosting capacity,
    because the limits do not account for voltage rise in LV networks or aggregated
    congestion in HV networks, and assessing non-traditional solutions such as smart
    inverter control or on-load tap changers exceeds the capability of typical DNSP
    planning studies.
  lesson_learnt: DNSP planning workflows that rely solely on transformer-capacity-based
    PV penetration limits should be supplemented with integrated HV-LV hosting capacity
    analysis tools — existing limits create barriers to PV uptake by either blocking
    viable connections or permitting connections that cause network issues, and non-traditional
    solutions cannot be assessed without more sophisticated modelling.
