  publish_date: 2020-08
  project_name: Advanced Planning of PV-Rich Distribution Networks
  what_happened: LV OLTC-fitted transformers in long rural feeders with long SWER
    connections could not fully solve voltage issues at high PV penetration levels
    (>50–60%); voltages remained close to or above the statutory 1.10 pu limit because
    the voltage rise on SWER-connected PV customers exceeded the voltage reduction
    achievable by the OLTC tap step.
  lesson_learnt: OLTC-fitted LV transformers are insufficient on their own for long
    rural SWER networks at high PV penetration; network planners should identify SWER
    connections early and plan supplementary solutions (e.g., network reconfiguration,
    dedicated voltage regulators) as the OLTC tap step magnitude is inherently limited
    relative to SWER voltage rise.
