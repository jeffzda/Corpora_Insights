  what_happened: Tailored Volt-Watt and Volt-Var inverter settings (solution 3) were
    found to operate effectively without requiring off-load tap adjustments of LV
    transformers, but when tap adjustments were included in the complete solution
    cost (as modelled), they added significant expense in rural feeders — up to half
    a million dollars for KLO14 — due to the large number of LV transformers requiring
    individual adjustment.
  lesson_learnt: When deploying tailored inverter settings as a PV hosting capacity
    solution in rural feeders, DNSPs should assess whether off-load tap adjustments
    are truly necessary — the analysis shows tailored settings can work without tap
    changes, and omitting them can reduce solution cost by up to ~$500,000 in short
    rural feeders, although this comes at the cost of slightly increased PV curtailment
    due to higher voltages.
