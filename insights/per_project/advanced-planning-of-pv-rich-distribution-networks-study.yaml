  publish_date: 2020-12
  project_name: Advanced Planning of PV-Rich Distribution Networks
  what_happened: Analysis of seven complete solutions across four HV feeder types
    (urban and rural) found that only three solutions — tailored Volt-Watt/Volt-Var
    settings with augmentation (solution 3), LV OLTC with augmentation (solution 4),
    and Network Smart Batteries with augmentation (solution 6) — could achieve 100%
    PV hosting capacity across all feeder types. Traditional solutions (1 and 2) and
    off-the-shelf battery solution (5) could only achieve up to 60–80% hosting capacity,
    and only on the strongest urban feeder (CRE21).
  lesson_learnt: DNSPs planning for high PV penetrations (beyond 60%) across diverse
    feeder types should not rely on traditional tap-changer solutions or off-the-shelf
    battery systems — only network-smart batteries, tailored inverter settings, or
    LV OLTCs combined with augmentation are capable of achieving 100% hosting capacity
    across both urban and rural feeders.
