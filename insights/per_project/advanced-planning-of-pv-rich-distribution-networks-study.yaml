  project_name: Advanced Planning of PV-Rich Distribution Networks
  what_happened: Adjustment of off-load tap changers on LV distribution transformers
    successfully extended the solar PV hosting capacity of urban (CRE21, HPK11) and
    short rural (KLO14) feeders from 20% to 40% penetration by unlocking additional
    voltage headroom, with curtailment reduced to near-negligible levels (0.04% at
    100% penetration for CRE21).
  lesson_learnt: For urban and short rural HV feeders approaching the 20% PV hosting
    capacity limit, adjusting off-load tap changers on LV transformers is a low-cost
    intervention that can double the effective hosting capacity to 40% penetration
    — DNSPs should exploit this option before committing to more expensive conductor
    or transformer augmentation.
