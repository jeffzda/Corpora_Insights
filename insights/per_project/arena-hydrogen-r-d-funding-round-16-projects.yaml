  proponent_type: research organisation/university
  delay_category: construction/installation
  failure_mode: execution & logistics
  outcome_class: delayed but recoverable
  secondary_failure_mode: null
  intervention_note: Delays and their costs were managed bilaterally between ARENA
    and each project's lead organisation to ensure contracted outcomes retained a
    high prospect of delivery.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages: &id001
