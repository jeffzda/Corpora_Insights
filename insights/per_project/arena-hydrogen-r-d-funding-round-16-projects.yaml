- record_id: ARENA-DLV-46001
  source_title: 'ARENA-Funded Hydrogen R&D Projects: Summary of Mid-Term Reports'
  publish_date: 2021-03
  project_name: ARENA Hydrogen R&D Funding Round (16 projects)
  what_happened: All sixteen hydrogen R&D projects experienced disruption and delays
    caused by COVID-19 restrictions on laboratory access, to varying degrees across
    the portfolio.
  lesson_learnt: R&D project schedules and budgets should include explicit contingency
    for laboratory access disruptions — COVID-19 demonstrated that all projects in
    a portfolio can be simultaneously affected by access restrictions, requiring individual
    delay and cost negotiations with each lead organisation.
