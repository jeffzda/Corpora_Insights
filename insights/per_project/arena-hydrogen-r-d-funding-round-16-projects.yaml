- record_id: ARENA-DLV-46007
  source_title: 'ARENA-Funded Hydrogen R&D Projects: Summary of Mid-Term Reports'
  publish_date: 2021-03
  project_name: ARENA Hydrogen R&D Funding Round (16 projects)
  what_happened: Techno-economic modelling embedded within the R&D projects was identified
    as the mechanism that would underpin business cases for the substantial additional
    investment required to scale technologies from research to commercial readiness;
    however, its utility depends on methodological consistency across projects.
  lesson_learnt: Mandate techno-economic modelling as a deliverable in R&D project
    contracts and specify a common methodology and shared assumptions at the funding
    round level — outputs produced under different assumptions cannot be aggregated
    or compared to support portfolio-level investment decisions or business case development.
  issue_severity: moderate
  project_type: multi-technology/hybrid
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: operations
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: coordination & stakeholders
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: The mid-term report explicitly recommended that ARENA adopt a
    standard approach to techno-economic modelling across the portfolio, particularly
    for calculating LCOH produced or delivered.
  transferability: broad
  delay_magnitude: null
  technology_domain: hydrogen
  source_pages:
  - 6
  evidence_excerpt: Many of the projects incorporate techno-economic modelling to
    predict, within reasonable accuracy limits at this still early stage, likely costs
    of production at commercial scale. Such modelling will underpin business cases
    for the considerable additional investment and time required to complete development
    and demonstration projects that scale-up the technologies to high technology readiness
    levels and move them into readiness for full commercial take-up.
  confidence_note: This record and ARENA-DLV-46002 are related but distinct — DLV-46002
    captures the risk of incompatible models; this record captures the positive role
    of TEM in enabling scale-up business cases and the design implication for funders.
    Considered merging but kept separate as the lessons are actionable at different
    decision points. Canonical record merged from 2 source records across 1 document(s).
