- record_id: ARENA-DLV-46005
  source_title: 'ARENA-Funded Hydrogen R&D Projects: Summary of Mid-Term Reports'
  publish_date: 2021-03
  project_name: ARENA Hydrogen R&D Funding Round (16 projects)
  what_happened: At the time of the mid-term review, currently available electrolysers
    consumed approximately $2.50–$3.00 in electricity alone (at 5 c/kWh) to produce
    one kilogram of hydrogen — already exceeding the government's LETS stretch goal
    of $2/kg before capital, operating costs or profit margin are included, indicating
    that electrolysis-only approaches cannot meet the cost target under current conditions.
  lesson_learnt: Project feasibility assessments for electrolytic hydrogen production
    should account for the electricity cost floor — at 5 c/kWh, electricity alone
    consumes $2.50–$3.00/kg, meaning electrolysis-only pathways cannot achieve the
    $2/kg LETS target without either significantly lower electricity prices or step-change
    efficiency improvements.
  issue_severity: major
  project_type: multi-technology/hybrid
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: concept/feasibility
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The portfolio addressed this by also funding non-electrolytic
    pathways (biological, thermochemical, photocatalytic) and high-efficiency hybrid
    systems that reduce or eliminate the electricity input requirement.
  transferability: moderate
  delay_magnitude: null
  technology_domain: hydrogen
  source_pages: &id003
  - 5
  evidence_excerpt: Currently available electrolysers use approximately $2.50 to $3.00
    in electricity (assuming it can be sourced at 5 c/kWh) to produce a kilogram of
    hydrogen, already well above the LETS target of $2 per kg and before capital,
    operating costs or business profitability are considered.
  confidence_note: 'issue_severity is major because this finding materially reframes
    which technology pathways are viable — electrolysis-only approaches cannot meet
    the policy cost target under stated assumptions.; project_scale_band reconciled
