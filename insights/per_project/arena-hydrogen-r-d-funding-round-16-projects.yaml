- record_id: ARENA-DLV-46006
  source_title: 'ARENA-Funded Hydrogen R&D Projects: Summary of Mid-Term Reports'
  publish_date: 2021-03
  project_name: ARENA Hydrogen R&D Funding Round (16 projects)
  what_happened: Multiple projects across the portfolio incorporated industry partners
    (national and/or international), which the mid-term review identified as a positive
    indicator of commercial interest and a potential pathway to further private investment
    for scale-up.
  lesson_learnt: Structuring R&D funding rounds to require or incentivise industry
    co-investment — evidenced by inclusion of national or international industry partners
    — creates a direct signal of commercial intent and increases the likelihood that
    promising results will attract follow-on private investment for scale-up.
