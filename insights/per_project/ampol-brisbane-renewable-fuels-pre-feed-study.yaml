- record_id: ARENA-DLV-19260
  source_title: Ampol - Brisbane Renewable Fuels Project - Market Context and Interim
    Report
  publish_date: '2025-03-21'
  project_name: Brisbane Renewable Fuels Project
  what_happened: The carbon intensity of Australian-grown canola has been demonstrated
    by CSIRO to be lower than the global default values used under international accounting
    schemes (e.g. EU RED II), due to Australian practices such as no-till farming,
    efficient fertiliser use, and rain-fed systems — but this advantage is not yet
    captured in domestic carbon accounting frameworks.
  lesson_learnt: Australian LCLF project developers should actively engage with policymakers
    and researchers to develop domestic carbon intensity accounting frameworks that
    reflect actual local agricultural practices — defaulting to international (often
    less favourable) global averages will systematically understate the carbon abatement
    value of Australian feedstocks and weaken the project's commercial case.
