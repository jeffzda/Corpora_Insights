- record_id: ARENA-DLV-19257
  source_title: Ampol - Brisbane Renewable Fuels Project - Market Context and Interim
    Report
  publish_date: '2025-03-21'
  project_name: Brisbane Renewable Fuels Project
  what_happened: Australia's biosecurity and quarantine restrictions on oilseed imports
    (particularly soybean and canola) represent a potential supply continuity risk
    for HEFA facilities in scenarios of domestic drought or supply disruption, limiting
    the ability to substitute imported feedstocks.
  lesson_learnt: LCLF project developers relying on oilseed feedstocks must account
    for Australian biosecurity restrictions on oilseed imports when designing supply
    continuity and contingency strategies — regulatory import barriers constrain the
    ability to use international spot markets as a drought or disruption backstop.
