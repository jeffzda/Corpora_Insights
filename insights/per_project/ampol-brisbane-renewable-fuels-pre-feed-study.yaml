  project_name: Brisbane Renewable Fuels Project
  what_happened: Imported HEFA feedstocks were assessed as carrying structural disadvantages
    for a domestic LCLF project — higher logistics costs, higher carbon intensity
    due to transport distances, and limited traceability — relative to locally sourced
    feedstocks.
  lesson_learnt: When evaluating feedstock strategy for LCLF projects, imported feedstocks
    should be treated as a supplementary optionality buffer rather than a baseload
    supply source — domestic feedstocks have inherent cost, carbon intensity, and
    traceability advantages that improve both the investment case and social licence.
