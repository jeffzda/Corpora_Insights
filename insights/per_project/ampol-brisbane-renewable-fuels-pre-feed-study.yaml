- record_id: ARENA-DLV-19251
  source_title: Ampol - Brisbane Renewable Fuels Project - Market Context and Interim
    Report
  publish_date: '2025-03-21'
  project_name: Brisbane Renewable Fuels Project
  what_happened: No SAF projects in Australia had reached Final Investment Decision
    (FID) as of early 2025, with the BRF project itself still in pre-FEED phase, due
    to the absence of government production incentives or demand mandates that would
    bridge the cost gap between SAF and conventional jet fuel.
  lesson_learnt: First-mover SAF projects require both supply-side incentives (e.g.
    production tax credits) and demand-side measures (e.g. blending mandates) before
    a Final Investment Decision is viable — without these, SAF pricing at 2–5× conventional
    jet fuel will prevent the industry from reaching critical mass.
  issue_severity: major
  project_type: industrial decarbonisation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: financing/commercial close
  failure_mode: commercial & market
  outcome_class: delayed but recoverable
  secondary_failure_mode: regulatory & approvals
  intervention_note: Ampol developed preferred policy positions and is actively advocating
    with government stakeholders for demand and supply-side measures, and building
    a coalition of industry support.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: bioenergy
  source_pages: &id001
  - 17
  - 27
  evidence_excerpt: Aside from government grants, currently there is no policy across
    State and Federal governments that supports the establishment of LCLF production
    or demand in Australia. Given the high upfront capital costs of these plants,
    the downstream impact is SAF and RD pricing at multiples of current hydrocarbon
    jet fuel. Without incentive to the producer and / or end user, it is likely that
    this cost differential will prevent critical mass in the market and support a
    self-sustaining industry.
