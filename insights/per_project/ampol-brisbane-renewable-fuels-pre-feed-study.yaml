  publish_date: '2025-03-21'
  project_name: Brisbane Renewable Fuels Project
  what_happened: Co-location of the BRF HEFA plant at the existing Lytton refinery
    enabled significant capital and operational synergies by leveraging existing tanks,
    pipelines, wharf access, hydroprocessing capability, and hydrogen supply, reducing
    the need for greenfield infrastructure investment.
  lesson_earnt: Siting a first-of-kind LCLF facility at an existing refinery with
    compatible hydroprocessing infrastructure materially reduces capex risk and integration
    complexity — project developers should prioritise brownfield co-location over
    greenfield development where feasible.
