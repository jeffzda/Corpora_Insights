- record_id: ARENA-DLV-19253
  source_title: Ampol - Brisbane Renewable Fuels Project - Market Context and Interim
    Report
  publish_date: '2025-03-21'
  project_name: Brisbane Renewable Fuels Project
  what_happened: Ampol conducted a multi-criteria technology pathway assessment over
    approximately 10 years and concluded that HEFA was the only commercially viable
    pathway for BRF, ruling out solid biomass (insufficient technical maturity) and
    ethanol-to-jet (over-reliance on imported feedstock).
  lesson_learnt: For first commercial LCLF projects, technology selection must be
    anchored to Technology Readiness Level and domestic feedstock availability simultaneously
    — pathways with high feedstock potential but low TRL, or high TRL but feedstock
    import dependency, both fail the commercialisation threshold.
  issue_severity: minor
  project_type: industrial decarbonisation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: concept/feasibility
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: Ampol assessed HEFA, ethanol-to-jet, and solid biomass pathways
    against feedstock availability, refinery capex, synergy with existing operations,
    technology maturity, carbon intensity, and end-product pricing before selecting
    HEFA.
  transferability: moderate
  delay_magnitude: null
  technology_domain: bioenergy
  source_pages: &id003
  - 21
  - 22
  evidence_excerpt: This assessment concluded that whilst solid biomass provides the
    highest level of available feedstocks, the lack technical maturity did not meet
    Ampol's commercialisation requirements. Furthermore, ethanol to jet had improved
    technical maturity but lack of available domestic feedstock led to over-reliance
    on imported feedstock.
