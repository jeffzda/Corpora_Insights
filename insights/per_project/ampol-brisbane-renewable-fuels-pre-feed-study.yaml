- record_id: ARENA-DLV-19252
  source_title: Ampol - Brisbane Renewable Fuels Project - Market Context and Interim
    Report
  publish_date: '2025-03-21'
  project_name: Brisbane Renewable Fuels Project
  what_happened: Approximately 70% of Australian canola and more than 80% of Australian
    tallow and used cooking oil are currently exported for processing into LCLF overseas,
    meaning domestic feedstocks required for the BRF facility are not readily available
    under existing market conditions.
  lesson_learnt: Domestic LCLF projects cannot assume feedstock availability from
    local agricultural surpluses — targeted policy and long-term supply agreements
    are necessary to redirect feedstocks away from established export markets toward
    domestic refining.
