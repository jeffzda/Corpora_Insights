- record_id: ARENA-DLV-11040
  source_title: Renewable Energy Options for Industrial Process Heat
  publish_date: 2019-08
  project_name: Radio Frequency Glue Curing for Engineered Wood Products
  what_happened: Danish manufacturer Kallesøe Machinery developed radio-frequency curing equipment that sets adhesives in engineered wood products in 18–26 minutes using 6–11 kWh/m³ of timber, compared
    to up to 8 hours and over 200 kWh/m³ in gas-fired kilns. This represents a greater than 90% reduction in energy demand and over a ten-fold reduction in processing time. The technology is widely used
    in Europe but not yet commonly adopted in Australia.
  lesson_learnt: Radio-frequency glue curing provides over 90% energy reduction and more than 10-fold throughput increase compared to gas-fired curing kilns for engineered wood products — Australian engineered
    wood manufacturers should evaluate RF curing as a near-term electrification opportunity with established international supply chains.
