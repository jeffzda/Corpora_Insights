- record_id: ARENA-DLV-64155
  source_title: Vast - Port Augusta Solar Methanol Project - Lessons Learnt Report
    1
  publish_date: 2025-06
  project_name: Port Augusta Solar Methanol Project
  what_happened: Warranted performance of PEM electrolysers was found during Pre-FEED
    engineering to not match the initially promoted performance, particularly regarding
    turndown range and rate. This extended negotiation timelines, increased engineering
    analysis effort, and cast doubt on the power procurement strategy which depended
    on the electrolysers' warranted turndown capabilities.
  lesson_learnt: Adopt a conservative view on the gap between promoted and warranted
    electrolyser performance from the outset — do not design power procurement strategies
    or plant operating concepts around promoted specifications until warranted performance
    has been confirmed through supplier negotiation, as mismatches can cascade across
    interconnected design and commercial workstreams.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: government/public-sector body
  delay_category: procurement/supply chain
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: execution & logistics
  intervention_note: Project is evaluating alkaline electrolyser units as a potentially
    more reliable and lower-cost alternative to PEM, given that the fixed-price/fixed-volume
    power procurement strategy may not require rapid turndown capability.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages: &id005
  - 10
