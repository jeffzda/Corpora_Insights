- record_id: ARENA-DLV-64152
  source_title: Vast - Port Augusta Solar Methanol Project - Lessons Learnt Report
    1
  publish_date: 2025-06
  project_name: Port Augusta Solar Methanol Project
  what_happened: The sub-scale 7,500 tonne per annum project scope resulted in high
    per-unit capital and operating costs, with processing equipment most expensive
    on a $/MW basis at small scale and an operational workforce requirement similar
    in size to a much larger plant. Potential offtake partners were either too small
    to serve as anchor offtakers or too large for commercial discussions to progress.
  lesson_learnt: Before setting project scope, conduct prudent analysis of the equipment
    supplier market and offtake market — sub-scale scopes can lock in high per-unit
    CapEx and OpEx that undermine project economics, and mismatched offtake demand
    scales can prevent commercial close.
