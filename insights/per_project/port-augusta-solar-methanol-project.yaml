- record_id: ARENA-DLV-64154
  source_title: Vast - Port Augusta Solar Methanol Project - Lessons Learnt Report
    1
  publish_date: 2025-06
  project_name: Port Augusta Solar Methanol Project
  what_happened: The project encountered ambiguity in classifying the carbon intensity
    of CO2 feedstock sourced from Calix's calcination process under Australian carbon
    accounting standards, which are still in development. This created uncertainty
    about the extent to which a green premium could be applied to the lime co-product
    and to the methanol product itself.
  lesson_learnt: Begin carbon intensity assessment work early — particularly in areas
    that do not depend on specific engineering outputs — and map the applicable international,
    EU and Australian carbon accounting standards before committing to a green product
    premium in offtake or commercial negotiations, as standard harmonisation gaps
    can undermine the commercial case.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: government/public-sector body
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: commercial & market
  intervention_note: null
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages: &id004
  - 10
  evidence_excerpt: With the Australian carbon accounting standards still in development,
    this has proven to be a challenge as ambiguity remains around the exact classification
    of the feedstock CO2 and the extent to which a green premium can be labelled and
    applied to their final lime product. Beginning work early on the carbon intensity
    assessment is encouraged for areas that do not require specific engineering outputs.
  confidence_note: No specific delay duration stated; delay_category approvals/regulatory
    applied as the issue is a standards/regulatory classification gap blocking commercial
    certainty.
