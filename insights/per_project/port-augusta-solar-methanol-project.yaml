- record_id: ARENA-DLV-64153
  source_title: Vast - Port Augusta Solar Methanol Project - Lessons Learnt Report
    1
  publish_date: 2025-06
  project_name: Port Augusta Solar Methanol Project
  what_happened: 'Securing offtake partners for green methanol proved harder than
    expected: potential partners either operated at too small a scale to serve as
    anchor offtakers or withdrew due to price sensitivities, and the Australian market
    for green methanol is still forming with limited regulatory support compared to
    North America and Europe.'
  lesson_learnt: Retain flexibility in fuel production technology type and volume
    before fixing project scope — in nascent markets where offtake demand is uncertain
    and evolving, locking into a single fuel type and output volume early reduces
    negotiating options and increases the risk of being unable to secure anchor offtake.
