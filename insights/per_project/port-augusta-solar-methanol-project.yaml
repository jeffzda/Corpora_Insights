- record_id: ARENA-DLV-64151
  source_title: Vast - Port Augusta Solar Methanol Project - Lessons Learnt Report
    1
  publish_date: 2025-06
  project_name: Port Augusta Solar Methanol Project
  what_happened: Retail baseload electricity contracts were found to be too expensive
    and economically unviable for the project. The initial concept of rapidly ramping
    power consumption to exploit spot price arbitrage introduced unacceptable commodity
    price risk, requiring a complex hybrid power procurement strategy to be developed
    during Pre-FEED.
  lesson_learnt: Conclude discussions with all project partners on their commodity
    price risk tolerance before Pre-FEED begins, and adopt a conservative view on
    the proportions of fixed-price, variable-price, fixed-volume and variable-volume
    electricity that will constitute the power procurement strategy — leaving this
    unresolved during Pre-FEED significantly complicates design and commercial decisions.
  issue_severity: major
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: government/public-sector body
  delay_category: financing/commercial close
  failure_mode: commercial & market
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Developed a hybrid power procurement strategy combining fixed-price
    wind PPAs as the base, stacked with a smaller portion of spot market exposure
    to lower the load-weighted average electricity cost to within partner risk tolerance.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages: &id001
  - 7
  evidence_excerpt: Retail baseload electricity contracts were found to be too expensive
    and render the project economically unviable... Future projects should aim to
    conclude discussions with project partners before Pre-FEED on their commodity
    price risk tolerance and prepare to adopt a conservative view regarding the proportions
    of fixed-price, variable-price, fixed-volume and variable-volume electricity that
    will make up the power procurement strategy.
  confidence_note: delay_category set to financing/commercial close as the core issue
    was commercial risk tolerance blocking procurement strategy finalisation; delay_magnitude
    not quantified in the document.
