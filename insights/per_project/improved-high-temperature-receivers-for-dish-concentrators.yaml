- record_id: ARENA-DLV-40202
  source_title: Improved High-Temperature Receivers for Dish Concentrators - Project
    Results and Lessons Learnt
  publish_date: '2015-01-14'
  project_name: Improved High-Temperature Receivers for Dish Concentrators
  what_happened: During receiver testing, the pump used to circulate water through
    the receiver was unable to produce the required flow rates. On one occasion, insufficient
    flow caused a portion of the receiver to melt. There was no time within the project
    schedule to replace the pump, so testing continued with the undersized pump.
  lesson_learnt: Verify that ancillary test infrastructure — particularly pumps and
    flow control equipment — is rated for the full required operating envelope before
    beginning high-flux receiver testing; an undersized pump caused partial receiver
    melt and constrained the testing program, with no time available to rectify the
    equipment before project close.
  issue_severity: major
  project_type: generation
