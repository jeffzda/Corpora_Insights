  publish_date: '2015-01-14'
  project_name: Improved High-Temperature Receivers for Dish Concentrators
  what_happened: The project demonstrated that a well-placed air jet at optimised
    velocity can reduce cavity convective heat loss by 40–70%, validated through both
    numerical and experimental testing. The team planned to incorporate active airflow
    features in future receiver designs.
  lesson_learnt: Active air curtain or airflow control features should be considered
    in future CSP dish receiver designs — experimental and numerical validation confirmed
    a 40–70% reduction in cavity convective heat loss, representing a significant
    performance lever for high-temperature receivers.
