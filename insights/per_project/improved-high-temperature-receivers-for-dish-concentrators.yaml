  source_title: Improved High-Temperature Receivers for Dish Concentrators - Project
    Results and Lessons Learnt
  publish_date: '2015-01-14'
  project_name: Improved High-Temperature Receivers for Dish Concentrators
  what_happened: When preparing to measure the optical performance of the SG4 Big
    Dish prior to receiver testing, a significant number of the original mirror panels
    were found to have been damaged by weather, badly degrading dish performance.
    A large number of panels had to be replaced with a more conservative design before
    testing could proceed.
  lesson_learnt: Inspect and verify the optical condition of the concentrator before
    committing to a receiver testing program — undiscovered mirror panel degradation
    at the SG4 dish required unplanned replacement of a large number of panels and
    would have prevented demonstration of high receiver performance had it not been
    caught.
