  delay_category: commissioning/integration
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: execution & logistics
  intervention_note: Testing proceeded with the existing undersized pump rather than
    replacing it; the team noted the receiver melt risk as a design issue to be addressed
    in any future development phase.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar thermal
  source_pages: &id002
  - 4
  evidence_excerpt: during testing of our receiver, there were some issues with the
