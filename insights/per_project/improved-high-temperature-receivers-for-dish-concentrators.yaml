- record_id: ARENA-DLV-40206
  source_title: Improved High-Temperature Receivers for Dish Concentrators - Project
    Results and Lessons Learnt
  publish_date: '2015-01-14'
  project_name: Improved High-Temperature Receivers for Dish Concentrators
  what_happened: The project found that temperature non-uniformity across the receiver
    surface must be actively exploited in receiver design — lower temperature regions
    should face the environment and higher temperature regions should be sheltered
    deep within a cavity — rather than treating the receiver as isothermal in design
    models.
  lesson_learnt: Do not assume isothermal receiver conditions in CSP dish receiver
    design — actively placing lower-temperature zones at exposed surfaces and higher-temperature
    zones within sheltered cavity positions materially reduces heat losses and improves
    receiver efficiency.
  issue_severity: none
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar thermal
  source_pages: &id006
  - 6
  evidence_excerpt: We found that the variation in temperature on a receiver is something
    that must be actively used to enhance the receiver performance. Lower temperature
    regions should be placed where the receiver is more exposed to the environment,
    and higher temperature regions should be sheltered, preferably deep within a cavity,
    to reduce losses from those regions.
  confidence_note: This is a technical design lesson rather than a delivery lesson;
    included because it has direct implications for future receiver design and development
    decisions.
