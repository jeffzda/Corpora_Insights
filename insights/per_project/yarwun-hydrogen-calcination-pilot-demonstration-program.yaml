  what_happened: The compressor turndown was limited to 50% of rated electrolyser
    output due to cooling requirements at higher compression ratios; below this limit
    the compressor trips, requiring all hydrogen produced to be diverted from the
    compression and storage facility to the blending facility — a design constraint
    that limits operational flexibility during low-output electrolyser operation.
  lesson_learnt: Hydrogen compression systems for batch storage applications have
    inherent turndown limitations driven by heat rejection requirements — design the
    hydrogen routing to provide an alternate low-pressure disposal path (e.g., gas
    blending) for all electrolyser output conditions below the compressor's minimum
    turndown to avoid production curtailment or wasted hydrogen.
