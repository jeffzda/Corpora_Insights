  what_happened: The project required a 2-hour minimum hydrogen trial window to simulate
    and de-risk full-scale operation of hydrogen calcination technology — this minimum
    operating window drove the hydrogen storage sizing (4 tonnes) and the batch compression-storage-let-down
    delivery configuration.
  lesson_learnt: When designing hydrogen calcination proof-of-concept pilots, define
    the minimum trial duration required to simulate full-scale operation early (2
    hours in this case), and use this to back-calculate storage, compression, and
    electrolyser sizing — the trial duration requirement is the key design driver
    and determines the scale and cost of the entire storage system.
