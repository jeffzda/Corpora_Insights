  what_happened: The storage vessels were sized to hold 3,903 kg of hydrogen — 3,320
    kg for a 2-hour trial run and 583 kg as 'stranded mass' required to maintain minimum
    operating pressure (26 barg) in the tanks throughout the trial to ensure stable
    pressure control at the let-down station.
  lesson_learnt: When sizing hydrogen batch storage for pilot calcination trials,
    account for stranded mass — the residual hydrogen needed to maintain minimum regulator
    operating pressure throughout the trial — as a significant fraction (approximately
    15% in this case) of total storage capacity; failure to account for this will
    result in insufficient deliverable hydrogen.
