- record_id: ARENA-DLV-3705
  source_title: Rio Tinto and Sumitomo - Yarwun Hydrogen Calcination Pilot Demonstration
    Program - Lessons Learnt Report
  publish_date: 2025-12
  project_name: Yarwun Hydrogen Calcination Pilot Demonstration Program
  what_happened: The project developed and implemented an integrated safety system
    combining Fire and Gas Detection (FGS) and Safety Instrumented System (SIS) within
    a single Integrated Control and Safety System (ICSS), using 2-out-of-3 voting
    logic for flammable gas detectors, automatic and manual shutdown capabilities,
    coordinated access control, and UPS-backed continuous circuit monitoring for hydrogen
    operations at the Yarwun refinery.
  lesson_learnt: For hydrogen pilot or demonstration projects integrated into operating
    industrial facilities, implement a layered safety architecture combining FGS and
    SIS within a unified ICSS, use voting logic (e.g. 2oo3) to reduce spurious alarms
    while ensuring reliable detection, and ensure all safety systems are backed by
    uninterruptible power supply with continuous fault monitoring — this architecture
    minimises both false shutdowns and hazardous event risk.
  issue_severity: none
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: hydrogen
  source_pages: &id005
  - 6
  - 7
  evidence_excerpt: Flammable gas detectors at potential release points use '2oo3
    voting logic', so automatic shutdown and alarms are triggered only when two out
    of three detectors reach the 10% Lower Flammability Limit (LFL). This reduces
    spurious alarms and ensures reliable action in case of real detection.
  confidence_note: transferability set to moderate rather than broad as the specific
    architecture is most applicable to hydrogen projects with high-pressure storage
    integrated into existing industrial facilities.
