  publish_date: 2025-12
  project_name: Yarwun Hydrogen Calcination Pilot Demonstration Program
  what_happened: Summit Hydrogen Gladstone (SHG) involved the Operations & Maintenance
    (O&M) contractor from an early stage in the project. This early engagement enabled
    the O&M contractor to contribute to operator-based design feedback, critical spare
    parts identification and procurement, advance preparations for regulatory compliance,
    and constructive operational planning discussions with Rio Tinto — improving overall
    operational readiness at commissioning.
  lesson_learnt: Select and engage the O&M contractor early in the project lifecycle
    and facilitate close communication between the O&M contractor, the EPC contractor,
    and the offtaker — early involvement enables design feedback, spare parts planning,
    regulatory preparation, and practical training that materially improves operational
    readiness and reduces commissioning risk.
