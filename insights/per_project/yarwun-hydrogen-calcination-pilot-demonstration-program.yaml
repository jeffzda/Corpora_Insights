  what_happened: Specialty Grayloc connections were specified for all piping classifications
    between Class 300 and 2500 due to their superior certified leakage performance
    at high pressures, which significantly reduced the hazardous area classified zones
    around hydrogen service and provided weight savings of up to 10x compared to standard
    ASME flanges at higher pressure classes.
  lesson_learnt: High-pressure hydrogen piping systems should specify Grayloc or equivalent
    proprietary hub connections for Class 300 to 2500 rather than standard ASME flanges
    — the superior leak tightness certification reduces hazardous area zone extents
    (lowering overall risk and potentially OPEX from gas detection infrastructure)
    and the significant weight saving simplifies structural support requirements.
