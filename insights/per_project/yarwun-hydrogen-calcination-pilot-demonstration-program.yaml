  project_name: Yarwun Hydrogen Calcination Pilot Demonstration Program
  what_happened: When an international electrolyser was purchased from an overseas
    vendor (no suitable domestic supplier existed in early 2023), differences between
    the manufacturing country's design standards and Australian/Queensland safety
    regulations required significant modifications to achieve compliance, resulting
    in increased time and cost and exposing the project to considerable risk.
  lesson_learnt: When procuring electrolysers or other high-pressure equipment from
    international vendors, assess regulatory compliance gaps against Australian Standards
    before finalising vendor selection — differences in design standards can require
    costly post-purchase modifications and schedule risk. The emergence of domestic
    vendors certified to Australian standards would materially reduce this risk.
