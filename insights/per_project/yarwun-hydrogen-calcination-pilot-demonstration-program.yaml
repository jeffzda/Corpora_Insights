- record_id: ARENA-DLV-3702
  source_title: Rio Tinto and Sumitomo - Yarwun Hydrogen Calcination Pilot Demonstration
    Program - Lessons Learnt Report
  publish_date: 2025-12
  project_name: Yarwun Hydrogen Calcination Pilot Demonstration Program
  what_happened: The existing Operator Training Simulator for Calciner 1 had become
    obsolete as a result of plant modifications over time, and operators were being
    trained on the live plant. Prior to hydrogen commissioning, the simulator was
    refreshed and enhanced. Site Acceptance Testing of the updated simulator and subsequent
    use by control room operators identified several control logic errors that, if
    undetected, would have caused multiple calciner trips during live hydrogen commissioning.
  lesson_learnt: Invest in updating or enhancing Operator Training Simulators before
    introducing significant process changes — extended offline simulation runs provide
    a uniquely effective opportunity to identify control logic errors and validate
    system response in ways that standard Site Acceptance Testing alone cannot, reducing
    the risk of process safety trips during live commissioning.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: utility/energy retailer
  delay_category: commissioning/integration
  failure_mode: unvalidated integration
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: execution & logistics
  intervention_note: Refreshed and enhanced the Operator Training Simulator for Calciner
    1; Site Acceptance Testing and extended simulator runs by control room operators
    identified and allowed rectification of control logic issues before live hydrogen
    commissioning.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages: &id002
  - 5
  evidence_excerpt: The Site Acceptance Testing of the Operator Training Simulator
    and subsequent use of the Simulator by Control Room Operators identified several
    issues with the control logic that if not detected would have resulted in several
    Calciner trips during commissioning of hydrogen calcination. Early identification
    and rectification of these control issues avoided process safety trips and production
    disruption during live hydrogen commissioning.
