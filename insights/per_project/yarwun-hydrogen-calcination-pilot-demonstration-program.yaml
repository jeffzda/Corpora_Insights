  secondary_failure_mode: poor scoping
  intervention_note: Operating philosophy was revised to maximise electrolyser operations
    during low-price daytime hours and shut down to avoid evening price peaks, with
    hydrogen calcination trials scheduled every 1–2 weeks to manage costs without
    third-party offtake.
