  what_happened: The third-party offtake arrangement originally envisaged to absorb
    surplus hydrogen production from the electrolyser did not eventuate, requiring
    a fundamental change to the operating model — shifting from continuous 100% electrolyser
    output to daytime-only operation sized around calcination trial frequency to minimise
    electricity costs.
  lesson_learnt: Pilot hydrogen projects that depend on third-party offtake to justify
    continuous electrolyser operation should treat that offtake as at-risk and design
    a fallback operating model — daytime-only batch operation aligned to trial frequency
    — from the outset to avoid costly operational re-planning.
