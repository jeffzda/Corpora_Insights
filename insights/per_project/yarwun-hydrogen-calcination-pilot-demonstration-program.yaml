  what_happened: The design of the hydrogen blending, compression, storage and let-down
    facility was based on the Hydrogen Safety Code of Practice regulated under Queensland's
    Petroleum and Gas (Production and Safety) Act 2004, which is not yet mandated
    for adoption in Australia; the project navigated a mix of international standards
    (NFPA 2, ASME B31.3/B31.12, EIGA/CGA G-5.5) applied with the approval of the Petroleum
    and Gas Inspector.
  lesson_learnt: Australian hydrogen projects operating under Queensland jurisdiction
    must engage the Petroleum and Gas Inspectorate early to agree on applicable codes
    and standards — the absence of a single mandated national hydrogen code means
    that the applicable standard mix must be negotiated with the inspector from the
    outset to avoid design rework.
