- record_id: ARENA-DLV-3701
  source_title: Rio Tinto and Sumitomo - Yarwun Hydrogen Calcination Pilot Demonstration
    Program - Lessons Learnt Report
  publish_date: 2025-12
  project_name: Yarwun Hydrogen Calcination Pilot Demonstration Program
  what_happened: The owner's team lacked dedicated electrical engineering and supervision
    resources, relying instead on borrowed electrical resources from the broader Rio
    Tinto organisation. When commissioning was underway, no electrical supervision
    was available to support troubleshooting or perform isolations. Updated drawings
    were not systematically incorporated into work packs, and outdated drawings remained
    in circulation, leading to rework, quality issues, and commissioning delays.
  lesson_learnt: Embed dedicated electrical engineering and supervision resources
    within the owner's team from project commencement on any complex project with
    high electrical and instrumentation load — reliance on shared or borrowed resources
    creates accountability gaps and directly causes commissioning delays and non-conformances.
