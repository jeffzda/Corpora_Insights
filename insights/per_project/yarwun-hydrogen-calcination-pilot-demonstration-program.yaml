- record_id: ARENA-DLV-5405
  source_title: Rio Tinto and Sumitomo - Yarwun Hydrogen Calcination Demonstration
    Program - Technology & Market Report
  publish_date: '2025'
  project_name: Yarwun Hydrogen Calcination Pilot Demonstration Program
  what_happened: The deliberate design decision to minimise electrolyser size and
    cost — using batch compression-storage-let-down rather than direct continuous
    supply — results in low availability of hydrogen calcination trials by design,
    with trials only possible when storage vessels are full (every 1–2 weeks), and
    the need to refill after each trial limiting trial frequency during commissioning.
  lesson_learnt: Proof-of-concept hydrogen trial designs that minimise electrolyser
    size through batch storage should explicitly account for the low trial availability
    and extended commissioning periods this creates — budgeting additional time for
    commissioning false starts and refill cycles before stable trial conditions can
    be achieved.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: utility/energy retailer
  delay_category: commissioning/integration
  failure_mode: poor scoping
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The design team accepted low availability as a known trade-off
    and built trial scheduling (every 1–2 weeks) around the storage refill cycle;
    commissioning plans allow for multiple false starts before stable conditions are
    achieved.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages: &id010
  - 29
  evidence_excerpt: The need to refill storage again before conducting further trials
    due to the limited storage volume will impact the ability to complete trials at
    the intended frequency during the commissioning process. It is expected that a
    number of trials may be required before stable trial conditions can be achieved
    and valid trial data for the initial conditions can be obtained. Once commissioning
    is complete and routine trial frequency is established, availability of the hydrogen
    calcination trials will be low by design with the trials only operating when the
    storage is full. The fundamental design minimising electrolyser size and cost
    for the proof-of-concept trial has driven low availability.
