  what_happened: Operating the electrolyser at 100% continuous output was identified
    as potentially detrimental to component life based on feedback from other users
    of the same electrolyser model; the commissioning plan was designed to test 100%
    output for 72 continuous hours to establish actual performance rather than assuming
    full-rated operation was sustainable.
