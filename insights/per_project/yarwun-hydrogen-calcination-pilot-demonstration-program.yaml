  source_title: Rio Tinto and Sumitomo - Yarwun Hydrogen Calcination Pilot Demonstration
    Program - Lessons Learnt Report
  publish_date: 2025-12
  project_name: Yarwun Hydrogen Calcination Pilot Demonstration Program
  what_happened: During commissioning of the hydrogen electrolyser, multiple issues
    arose including the need for component replacements. Scheduling vendor representative
    attendance was complicated by the need to arrange international travel. Component
    replacement requirements that were not anticipated in advance threatened to delay
    critical path activities.
  lesson_learnt: When planning the commissioning schedule for hydrogen electrolysers
    or other complex first-of-kind equipment, identify critical path activities early,
    align with overseas vendors ahead of time to maintain scheduling flexibility,
    and proactively procure long-lead and critical spare parts in advance to avoid
    delays when component replacements are required during commissioning.
