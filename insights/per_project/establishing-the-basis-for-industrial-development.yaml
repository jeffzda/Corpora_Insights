  evidence_excerpt: The prevalence of work aimed predominantly at 'novelty' in university
    and even government research laboratories, which helps foster increased publication
    rates, has to date fairly systematically failed to address the lifetime issue
    around PSCs, which is absolutely critical to achieving low LCOE... performance
    figures reported by academia are predominately devoid of any stability testing
    or analysis.
