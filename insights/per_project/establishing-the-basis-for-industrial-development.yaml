- record_id: ARENA-DLV-56952
  source_title: 'Perovskite Solar Cells: Establishing the Basis for Industrial Development'
  publish_date: '2017-01-31'
  project_name: 'Perovskite Solar Cells: Establishing the Basis for Industrial Development'
  what_happened: When Dyesol's $/Wp cost figures were reviewed by an ARENA-selected
    expert at UNSW, several figures were criticised as being lower than data published
    in academic literature. Dyesol's figures were in fact sourced from direct industry
    quotations and established manufacturing costs — more current and accurate than
    academic citations — highlighting that academic literature systematically lags
    actual market costs.
  lesson_learnt: Cost data sourced directly from industry quotations or established
    manufacturing cost bases is more reliable than figures cited in academic literature
    for LCOE modelling; future projects should explicitly prioritise industry-sourced
    cost data and document the provenance of cost inputs to avoid challenge during
    peer review.
