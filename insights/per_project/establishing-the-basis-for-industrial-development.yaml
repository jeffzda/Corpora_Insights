- record_id: ARENA-DLV-56953
  source_title: 'Perovskite Solar Cells: Establishing the Basis for Industrial Development'
  publish_date: '2017-01-31'
  project_name: 'Perovskite Solar Cells: Establishing the Basis for Industrial Development'
  what_happened: Dyesol's analysis found that the widely held belief that silicon-perovskite
    tandem devices represent the easiest commercialisation pathway for perovskite
    technology is likely incorrect. Silicon-perovskite tandems require all the development
    challenges of a perovskite-only device plus additional requirements such as wavelength-dependent
    transparency and interface complexity, making the development pathway substantially
    more demanding.
  lesson_learnt: R&D investment in silicon-perovskite tandems should be preceded by
    — or conditional on — achieving a viable perovskite-only device; funding bodies
    should require detailed cost modelling and process sequence analysis before committing
    to silicon-perovskite tandem development, as the perceived advantages are largely
    unsubstantiated by technical or economic data.
