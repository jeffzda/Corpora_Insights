- record_id: ARENA-DLV-56955
  source_title: 'Perovskite Solar Cells: Establishing the Basis for Industrial Development'
  publish_date: '2017-01-31'
  project_name: 'Perovskite Solar Cells: Establishing the Basis for Industrial Development'
  what_happened: Dyesol was unable to obtain third-party validation of stability and
    durability metrics within Australia due to a lack of suitable domestic testing
    facilities. Efficiency certification also required offshore testing at NewPort
    in the USA, as Australian facilities lacked the processes and expertise to handle
    unfamiliar perovskite PV devices.
  lesson_learnt: Projects developing novel PV technologies in Australia should plan
    for offshore third-party certification of both efficiency and stability/durability
    metrics, as domestic facilities lack the equipment, experience, and adapted testing
    protocols needed for non-mainstream solar cell technologies; building this into
    project timelines and budgets from the outset is essential.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: pilot
  lifecycle_phase: commissioning/integration
  proponent_type: technology vendor
  delay_category: data/validation/testing
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Dyesol engaged NewPort laboratories in the USA, which had considerable
    experience in non-mainstream solar cell certification, to conduct external efficiency
    validation.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id003
  - 15
  evidence_excerpt: While this was not possible for stability/durability metrics due
    to a lack of suitable facilities in Australia, it was, in theory, possible for
