  - 14
  evidence_excerpt: It is commonly believed that silicon-perovskite tandems are the
    technologically 'easiest' form of perovskite technology to industrialise and take
    to market. This, however, is probably more difficult in practice, as the technical
    requirements for a silicon-perovskite tandem include all the needs for a perovskite-only
    device, plus an additional number of challenges not required for a perovskite
    only device such as wavelength dependent transparency and interface complexities.
