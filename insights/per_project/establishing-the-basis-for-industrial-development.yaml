- record_id: ARENA-DLV-56957
  source_title: 'Perovskite Solar Cells: Establishing the Basis for Industrial Development'
  publish_date: '2017-01-31'
  project_name: 'Perovskite Solar Cells: Establishing the Basis for Industrial Development'
  what_happened: Dyesol successfully demonstrated that carbon-based perovskite solar
    cells achieved >10% efficiency consistently across multiple double-digit batches
    of 1 cm² strip cells, passed 1000+ hours of light-soaking stability testing (9.2–9.8%
    relative efficiency loss, within the <10% specification), and received independent
    certification from NewPort laboratories — meeting all key milestones within the
    six-month measure.
  lesson_learnt: Carbon-based perovskite architectures that eliminate expensive organic
    hole transport materials can simultaneously achieve industrially relevant efficiency
    and stability thresholds; validating both parameters together on a batch basis
    (rather than single champion cells) provides a much stronger basis for subsequent
    investment decisions than single-cell academic results.
