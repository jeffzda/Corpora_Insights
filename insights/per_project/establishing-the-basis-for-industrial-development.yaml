  secondary_failure_mode: poor scoping
  intervention_note: Dyesol published 35 knowledge-sharing items and joined ACAP as
    an industrial partner to redirect research community attention toward stability
    and industrialisation priorities.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id004
