- record_id: ARENA-DLV-56951
  source_title: 'Perovskite Solar Cells: Establishing the Basis for Industrial Development'
  publish_date: '2017-01-31'
  project_name: 'Perovskite Solar Cells: Establishing the Basis for Industrial Development'
  what_happened: During LCOE modelling, Dyesol found it difficult to obtain reliable
    non-module (balance of system) cost data for the Australian context. Non-module
    costs had dropped rapidly in the period leading up to the measure, meaning Dyesol's
    conservative estimates were almost certainly higher than costs actually being
    incurred by solar farm developers at the time.
  lesson_learnt: For LCOE assessments of new photovoltaic technologies, non-module
    costs should be standardised across ARENA-funded projects. ARENA should make de-identified
    aggregated BOS cost data from its funded solar farm portfolio available to future
    project proponents to improve the accuracy and comparability of LCOE modelling.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: pilot
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: null
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Dyesol undertook an extensive survey of published BOS costs,
    used the most recent detailed breakdowns available, and applied trend mapping
    to individual cost segments to estimate present and future costs.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id001
  - 11
  - 12
  evidence_excerpt: Non-module costs have dropped extremely rapidly in the period
    leading up to the Measure executed by Dyesol. This led to considerable potential
    for errors in LCOE estimations, particularly as Dyesol took a conservative approach
    to estimating these costs, and, thus, almost certainly used costs which were higher
    than those presently incurred by solar farm developers.
