- record_id: ARENA-DLV-56956
  source_title: 'Perovskite Solar Cells: Establishing the Basis for Industrial Development'
  publish_date: '2017-01-31'
  project_name: 'Perovskite Solar Cells: Establishing the Basis for Industrial Development'
  what_happened: Academic research on perovskite solar cells has predominantly focused
    on novelty and efficiency record claims — typically on tiny spot cells — while
    systematically failing to address stability and durability, which are critical
    to achieving a commercially viable LCOE. Published academic performance figures
    were also found to be devoid of stability testing and based on cell sizes not
    representative of industrial production.
  lesson_learnt: Funders evaluating perovskite or other emerging PV technologies should
    discount academic efficiency claims that are not accompanied by stability data
    at industrially relevant cell sizes; R&D investment strategies should explicitly
    prioritise lifetime/stability work alongside efficiency improvement to ensure
    progress toward commercially viable LCOE.
