  project_type: manufacturing/supply chain
  project_scale_band: pilot
  lifecycle_phase: concept/feasibility
  proponent_type: technology vendor
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Dyesol undertook detailed manufacturability analysis and $/Wp
    economic modelling across PSC embodiments to expose the flawed assumptions underpinning
    the silicon-perovskite tandem narrative.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages:
