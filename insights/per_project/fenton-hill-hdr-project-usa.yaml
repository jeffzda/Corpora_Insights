- record_id: ARENA-DLV-14969
  source_title: 'Looking Forward: Barriers, Risks and Rewards of the Australian Geothermal
    Sector to 2020 and 2030'
  publish_date: 2014-06
  project_name: Fenton Hill HDR Project (USA)
  what_happened: At the Fenton Hill Phase II EGS reservoir (5 km depth, 300°C), fractures
    grew downward at ~45° rather than vertically as in the shallower Phase I system,
    failing to intersect the pre-drilled production well; proppants dissolved at high
    temperatures; and a casing leak caused by thermal stress during stimulation required
    redrilling the production well.
  lesson_learnt: In deep, high-temperature EGS reservoirs, the stress state at depth
    governs fracture growth direction in ways that cannot be reliably predicted before
    drilling; the preferred approach is to stimulate one well, map the resulting acoustic
    emissions cloud, and then drill the second well into the stimulated zone — not
    to pre-drill both wells and attempt to connect them with stimulated fractures.
  issue_severity: major
  project_type: generation
