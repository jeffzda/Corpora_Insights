  evidence_excerpt: For the deeper hotter Phase II reservoir, the stress state was
    not the same at depth so fractures did not grow vertically as they had in the
    Phase I wells. Instead, fractures grew downward more than upward and at about
    a 45° angle from vertical and did not intersect the production well that had already
    been drilled parallel to the injector. Fractures created with high pressures would
    not stay open on their own and proppants dissolved rapidly at the high temperatures
    of the reservoir.
