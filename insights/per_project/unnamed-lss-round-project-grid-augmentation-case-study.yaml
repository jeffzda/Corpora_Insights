- record_id: ARENA-DLV-15461
  source_title: 'The Generator Operations Series: Large-Scale Solar Operations'
  publish_date: 2021-05
  project_name: Unnamed LSS Round Project (grid augmentation case study)
  what_happened: One LSS Round Project experienced ongoing curtailment of approximately
    3 per cent of generation in 2020 since commissioning due to a low-capacity grid
    transformer being saturated by reduced local loads. The asset manager worked with
    the local grid operator to retrofit the transformer with a new cooling system,
    resolving the constraint by end of October 2020. The project owner made a financial
    contribution to the upgrade.
  lesson_learnt: Asset managers should proactively monitor local grid conditions and
    engage the network operator early when curtailment is linked to network infrastructure
    constraints — in this case, close collaboration and a financial contribution to
    a transformer cooling upgrade resolved an ongoing curtailment constraint that
    had persisted since commissioning.
