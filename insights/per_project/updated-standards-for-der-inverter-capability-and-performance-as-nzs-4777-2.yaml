- record_id: ARENA-DLV-9143
  source_title: State of DER Technology Integration Report
  publish_date: 2021-02
  project_name: Updated Standards for DER Inverter Capability and Performance (AS/NZS
    4777.2)
  what_happened: AEMO's work to update AS/NZS 4777.2 proceeded on an accelerated timeline
    that did not follow normal Standards Australia processes, driven by the urgency
    of the mass DPV disconnection risk in South Australia. The revision process was
    expected to be completed by March 2021, approximately 5 years after the need for
    updated standards was identified from system disturbance data.
  lesson_farnt: Standards revision timelines are too slow for fast-moving DER integration
    challenges — AEMO's approach of building an evidence base from field monitoring
    and laboratory testing, combined with wide pre-consultation before formal submission
    to Standards Australia, was necessary to expedite the process, and this model
    should be applied to future urgent standards revisions.
  lesson_learnt: Standards revisions for critical DER integration requirements should
    be initiated early and driven by an evidence-based submission with pre-built industry
    support — the AEMO approach of combining Solar Analytics field data with UNSW
    laboratory testing and extensive pre-consultation before formal Standards Australia
    submission compressed the revision timeline significantly and should be replicated.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: approvals/contracting
  proponent_type: government/public-sector body
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: null
  intervention_note: AEMO submitted proposed changes to Standards Australia in May
    2019 backed by an evidence base from Solar Analytics monitoring data and UNSW
    bench testing; Standards Australia accepted the proposal in June 2019 on an accelerated
    timeline targeting publication by March 2021.
  transferability: broad
  delay_magnitude: 1–3 years
