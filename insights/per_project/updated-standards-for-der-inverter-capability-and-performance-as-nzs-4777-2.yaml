- record_id: ARENA-DLV-9144
  source_title: State of DER Technology Integration Report
  publish_date: 2021-02
  project_name: Updated Standards for DER Inverter Capability and Performance (AS/NZS
    4777.2)
  what_happened: Standards compliance was identified as a significant risk for the
    AS/NZS 4777.2 revision, with AEMO, DNSPs, aggregators and other parties identifying
    it as a major problem today. The compliance issue encompassed OEM device capability
    and factory settings, installation practices, monitoring and auditing, and post-installation
    firmware/settings updates.
  lesson_learnt: Publishing a new standard does not ensure compliance — a comprehensive
    compliance framework covering factory settings, installation practices, monitoring,
    auditing, and firmware update processes must be developed alongside the standard
    itself, as each link in the compliance chain is a potential failure point.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: approvals/contracting
  proponent_type: government/public-sector body
  delay_category: null
  failure_mode: regulatory & approvals
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: coordination & stakeholders
  intervention_note: AEMO was working with industry, the ESB, CER and market bodies
    on compliance uplift; one active focus was using disconnected monitoring data
    sets to identify non-compliance across OEMs and installers.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id002
  - 181
  evidence_excerpt: 'Compliance uplift: has been identified (by AEMO, DNSPs, aggregators
    and other parties) as a significant problem today and, if no action is undertaken,
    a major risk with respect to the adoption and implementation of new DER inverter
    device-level performance requirements. This encompasses several aspects, including:
    OEM device capability and ''factory settings'', installation practices, monitoring
    and auditing of performance, as well as actions taken post installation such as
    firmware/settings updates.'
