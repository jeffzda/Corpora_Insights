- record_id: ARENA-DLV-15813
  source_title: Evaluation of ARENA's Impact and Effectiveness
  publish_date: 2019-11
  project_name: Concentrating Solar Thermal (CST) in Australia — portfolio-level
  what_happened: Despite significant ARENA R&D investment of over $144 million in
    CST, CST represented only 0.02 per cent of cumulative installed capacity in Australia
    by 2018. Previous reviews identified lack of technology or time-of-generation
    incentives, early mover project failures creating adverse perceptions, and no
    clear domestic deployment pathway as key barriers.
  lesson_learnt: Technology-specific R&D investment is insufficient to drive commercial
    deployment when structural market barriers (absence of incentive frameworks, lack
    of a domestic demand signal) remain unaddressed — CST shows that world-class research
    capability does not translate to commercial scale without complementary policy
    instruments.
