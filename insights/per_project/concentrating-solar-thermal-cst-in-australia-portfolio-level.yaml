  evidence_excerpt: 'Despite the strong support for CST R&D over recent years in 2018
    CST represented 0.02 per cent of cumulative installed capacity by fuel type in
    Australia. Previous reviews have identified various factors that might explain
    why Australia has failed to complete construction of a utility-scale plant, including:
    Lack of a technology or time of generation incentives that mitigate the LCOE technology
    advantage of wind and solar PV; Early mover CST project failures, resulting in
    an adverse perception about the role and capability of CST.'
