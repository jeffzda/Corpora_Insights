- record_id: ARENA-DLV-15829
  source_title: Evaluation of ARENA's Impact and Effectiveness
  publish_date: 2019-11
  project_name: ARENA A-Lab (Accelerator Lab) Program
  what_happened: ARENA's A-Lab innovation lab program generated over 300 ideas, funded 26 projects with $84.9 million in funding commitments across 2017–2018, and directly produced major industry programs
    including the Short-Term Solar Forecasting program, the Demand Response pilot, and the Distributed Energy Integration Program (DEIP). The DEIP originated from a single A-Lab Accelerate Workshop attended
    by 60 participants.
  lesson_learnt: Structured cross-sector innovation workshops can originate transformative programs that would not emerge from standard competitive funding rounds — the A-Lab model (idea generation → incubation
    → acceleration) should be used to identify system-level challenges that require collaborative solutions rather than individual project funding.
