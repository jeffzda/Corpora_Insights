- record_id: ARENA-DLV-2573
  source_title: 'ARENA Insights Hot Decarbonisation Webinar: Renewable Heat and Energy Efficiency at Industrial Facilities'
  publish_date: 2024-10
  project_name: Hardwick Meats Heat Pump Installation (Hoctor / Mycom)
  what_happened: Hardwick Meats at Kyneton installed a 1 MW heat pump system designed by Hoctor using Mycom compressors, recovering waste heat from refrigeration systems to produce hot water at 75°C (boosted
    to 82°C with an existing gas boiler), resulting in a reduction in gas usage of over 30,000 GJ and avoided emissions of 883 t CO2-e per annum.
  lesson_learnt: Industrial refrigeration facilities can cost-effectively recover waste heat from existing refrigeration oil coolers using heat pumps to supply process hot water — retaining existing high-efficiency
    gas systems for final temperature uplift above heat pump limits reduces capital cost while maximising gas displacement.
