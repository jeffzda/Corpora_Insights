- record_id: ARENA-DLV-72304
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: '2014'
  project_name: Impact of High Penetration of Solar Photovoltaic Systems on Low Voltage
    Feeder Power Quality
  what_happened: University of Wollongong field monitoring of three LV feeders with
    high solar PV penetration found voltage rise at all sites during periods of significant
    solar generation, and Voltage Total Harmonic Distortion (THD) levels increased
    at six of eight monitor locations during periods of voltage rise.
  lesson_learnt: Field measurement programmes on high-PV-penetration LV feeders should
    monitor both steady-state voltage and harmonic distortion simultaneously — the
    two effects co-occur and interact, and theoretical studies alone are insufficient
    to characterise their magnitude.
