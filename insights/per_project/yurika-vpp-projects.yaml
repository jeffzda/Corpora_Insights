- record_id: ARENA-DLV-1804
  source_title: ARENA Insights Forum November 2018 DER Summary
  publish_date: 2019-04
  project_name: Yurika VPP Projects
  what_happened: Yurika's demand response trials found that customers who were directly engaged and knew their energy use was being monitored were significantly more likely to change their energy use behaviour
    than those who were not directly engaged.
  lesson_learnt: Direct customer engagement — including clear communication that usage is being monitored — is a more effective lever for demand response behaviour change than passive programme enrolment;
    VPP and DR project designers should build explicit engagement and monitoring-awareness touchpoints into programme design.
