- record_id: ARENA-DLV-15819
  source_title: Evaluation of ARENA's Impact and Effectiveness
  publish_date: 2019-11
  project_name: ESCRI Battery (ElectraNet, South Australia)
  what_happened: The 30MW/8MWh ESCRI battery (co-located with the 90MW Wattle Point Wind Farm) was the first grid-connected battery owned by a Network Service Provider and the first to demonstrate both
    regulated and competitive energy market services simultaneously. It also demonstrated fringe-of-grid islanding capability through grid-forming micro-grid operation.
  lesson_learnt: Network-owned grid-scale batteries co-located with wind can simultaneously provide regulated network services, competitive market services, and islanding — this multi-service architecture
    should be considered in the design of storage projects in constrained network locations.
