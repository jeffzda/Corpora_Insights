  what_happened: Revenue forecasting for PHES in the NEM proved highly uncertain due
    to rapid renewable penetration growth, proposed interconnectors, falling battery
    storage costs, volatile wholesale prices, and changing energy policy. FCAS revenue
    was explicitly excluded from the financial model due to regulatory uncertainty,
    further constraining the modelled business case.
