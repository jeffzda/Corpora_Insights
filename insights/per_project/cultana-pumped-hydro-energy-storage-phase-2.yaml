  what_happened: 'Capex costs for Cultana were driven significantly higher than global
    benchmarks by site-specific factors: a long penstock relative to available head,
    large reservoir structures required due to low head, non-ideal site materials
    necessitating reservoir liners, a deep powerhouse below the natural water table,
    and security/access costs associated with operating within an active DoD training
    area.'
  lesson_learnt: PHES capital costs are highly site-specific and bespoke — sites with
    low head, long penstocks, poor native construction materials, high flood risk,
    or access constraints will produce costs materially above global benchmarks. Screening
    candidate sites rigorously against head, penstock length, geology, construction
    material availability, and land access constraints before committing to FEED is
    essential to avoid expensive late-stage cost surprises.
