  what_happened: The Cultana SPHES was the first time a fully competitive EPC market
    sourcing process was conducted in Australia to ascertain true market pricing for
    a PHES project. Three binding lump-sum turnkey EPC proposals were received from
    international consortia, providing genuine market pricing that had not previously
    been available for Australian PHES.
  lesson_learnt: Conducting a competitive EPC tender process — rather than relying
    on pre-feasibility cost estimates or negotiated ECI arrangements — is the only
    reliable method to establish true market pricing for a PHES project in Australia.
    The Cultana process demonstrated that globally published benchmarks significantly
    understated Australian costs; future proponents should run competitive tenders
    early enough to validate financial models before FID.
