  project_name: Cultana Seawater Pumped Hydro Energy Storage (SPHES) Project
  what_happened: Biofouling was assessed as a high risk to the operation of the Cultana
    SPHES facility if seawater were used directly from the Spencer Gulf — the build-up
    of biological matter on submerged surfaces would cause unpredictable component
    lifetimes and expensive management. This was a key factor in the decision to switch
    to a RO desalination system.
  lesson_learnt: Seawater PHES proposals using direct seawater must address biofouling
    risk as a primary technical constraint, not an afterthought. At locations with
    low tidal exchange (such as closed estuaries), biofouling risk is especially acute
    and will likely require either a full desalination pre-treatment system or significantly
    higher-rated materials for all wetted components, with correspondingly higher
    maintenance costs and downtime.
