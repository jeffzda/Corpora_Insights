- record_id: ARENA-DLV-67755
  source_title: Cultana Pumped Hydro Energy Storage Project Phase 2
  publish_date: 2020-09
  project_name: Cultana Seawater Pumped Hydro Energy Storage (SPHES) Project
  what_happened: The advancing approval of the EnergyConnect 800MW SA–NSW interconnector
    materially reduced forecast arbitrage revenue for the Cultana SPHES in energy
    market modelling, contributing to the negative FID. Market modelling indicated
    the SA market could not support two financially viable PHES projects simultaneously.
  lesson_learnt: PHES business cases in constrained regional markets like South Australia
    are highly sensitive to interconnector development — a new interconnector at significant
    capacity relative to total state demand will dampen price volatility and reduce
    arbitrage value. PHES developers should model interconnector scenarios explicitly
    and time FID accordingly.
