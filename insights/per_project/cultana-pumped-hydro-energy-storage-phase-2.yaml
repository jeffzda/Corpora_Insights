  project_name: Cultana Seawater Pumped Hydro Energy Storage (SPHES) Project
  what_happened: The project team switched from an Early Contractor Involvement (ECI)
    delivery model to a full competitive EPC tender model midway through the FEED
    program. This required realignment of FEED deliverables to produce a Reference
    Design and performance specifications suitable for a competitive EPC tender, adding
    time and cost to the development phase.
  lesson_learnt: The contracting strategy — ECI versus EPC — must be decided before
    the FEED program commences, as each requires a different set of FEED deliverables.
    Switching from ECI to EPC mid-FEED requires reorientation of design outputs and
    adds development cost and time. EPC requires a more complete Reference Design
    upfront but provides competitive pricing and clearer governance pathway.
