- record_id: ARENA-DLV-67774
  source_title: Cultana Pumped Hydro Energy Storage Project Phase 2
  publish_date: 2020-09
  project_name: Cultana Seawater Pumped Hydro Energy Storage (SPHES) Project
  what_happened: The Cultana project ran comprehensive FEED including geotechnical
    investigation, flood modelling, reservoir siting, penstock design, powerhouse
    design, PTU selection, grid connection design, water supply design, and environmental
    assessment — producing a full Reference Design suitable for a competitive EPC
    tender within approximately 18 months.
  lesson_learnt: For a first-of-kind PHES project in Australia, an 18-month FEED program
    encompassing all technical disciplines simultaneously — while managing geotechnical
    uncertainty — is achievable but leaves limited time for value engineering. Future
    projects should plan a longer FEED duration or sequence major geotechnical investigations
    ahead of design work to reduce residual risk carried into EPC pricing.
