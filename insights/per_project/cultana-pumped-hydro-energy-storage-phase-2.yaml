  what_happened: Australia lacked a deep domestic hydro power industry capability
    at the time of the project, with expertise concentrated in Tasmanian and NSW state-owned
    generators. This created a thin domestic contractor market and contributed to
    higher-than-expected EPC prices as new entrants applied larger risk premiums.
  lesson_learnt: The shallow Australian hydro/PHES construction market concentrates
    risk premiums in EPC pricing — new entrant contractors and OEMs will price unfamiliarity
    with Australian conditions and regulatory requirements into bids. As the market
    matures and more projects are delivered, competitiveness and execution efficiency
    should improve. Early-mover PHES projects should budget for an Australian market
    premium above international benchmarks.
