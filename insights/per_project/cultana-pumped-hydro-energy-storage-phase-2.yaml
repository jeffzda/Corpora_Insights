- record_id: ARENA-DLV-67754
  source_title: Cultana Pumped Hydro Energy Storage Project Phase 2
  publish_date: 2020-09
  project_name: Cultana Seawater Pumped Hydro Energy Storage (SPHES) Project
  what_happened: The Generator Performance Standards (GPS) study — required to obtain
    a formalised grid connection offer from AEMO — was not completed before FID because
    it requires exact equipment specifications, meaning the main turbine and generator
    supplier must first be selected. This placed the GPS study in a 'chicken-and-egg'
    position relative to FID.
  lesson_learnt: 'The GPS study is a significant barrier and cost item in Australian
    PHES development: it requires final equipment selection before it can proceed,
    yet a grid connection offer cannot be obtained without it. Project timelines and
    procurement strategies must explicitly account for the GPS study sequence — consider
    whether EPC contract bundling of GPS studies is appropriate, given the high expenditure
    incurred at risk before any connection offer is guaranteed.'
  issue_severity: moderate
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: approvals/contracting
  proponent_type: utility/energy retailer
  delay_category: grid connection/system studies
  failure_mode: regulatory & approvals
  outcome_class: discontinued/not progressed
  secondary_failure_mode: poor scoping
  intervention_note: null
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: pumped hydro
  source_pages: &id004
  - 79
  evidence_excerpt: The GPS is an expensive and deep electrical engineering study
    that requires precise electrical equipment parameters requiring the exact make
    and model of the generator to be selected... To get to the point where the GPS
    is complete, significant development expenditure (in the millions of dollars)
    is often incurred. It has also been the practice of project developers to bundle
    the procuring of GPS studies and AEMO Connection Approval together into the services
    to be delivered under the EPC contract. This expenditure is incurred at high risk
    as there is no guarantee of a grid connection offer at the end of the process.
