- record_id: ARENA-DLV-67772
  source_title: Cultana Pumped Hydro Energy Storage Project Phase 2
  publish_date: 2020-09
  project_name: Cultana Seawater Pumped Hydro Energy Storage (SPHES) Project
  what_happened: The project team found that the reference design contained significant
    value engineering opportunities — estimated at $50–$150m — that were not realised
    because FID was not achieved. These included procurement strategy optimisation,
    technical and operational design refinements, and additional site investigations
    that could have reduced contractor contingency.
  lesson_learnt: A FEED reference design should be followed by a structured value
    engineering phase before EPC tender to capture design efficiencies and reduce
    contractor contingency. At Cultana, time constraints in the development program
    meant value engineering was deferred to post-tender, reducing the project's ability
    to close the gap between tendered and acceptable costs before FID. Budget time
    and funding for a dedicated value engineering phase.
