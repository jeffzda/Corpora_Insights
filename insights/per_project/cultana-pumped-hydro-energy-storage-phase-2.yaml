  what_happened: The project identified that PHES has long development lead times,
    increasing development risk compared to modular technologies like batteries. Published
    capital cost estimates by other PHES proponents were found to be lower than actual
    tendered costs, suggesting the broader PHES development pipeline was operating
    on optimistic financial assumptions.
  lesson_learnt: PHES development timelines are long — site identification, qualification,
    environmental approvals, geotechnical investigations, FEED and EPC tendering can
    easily span 3–5 years before FID. This long lead time, combined with rapidly changing
    market conditions, increases the risk that the investment case valid at project
    inception will have materially changed by FID. Project developers should build
    market scenario sensitivity testing across the full development timeline, not
    just at FID.
