  what_happened: During geotechnical investigations in 2018, a previously unmapped
    fault was discovered under the planned lower reservoir location at approximately
    18.5m depth. This required the lower reservoir to be relocated approximately 200m
    to avoid the fault, reducing available head from 220m to 215m and requiring redesign
    of associated structures.
  lesson_learnt: Comprehensive geotechnical site investigation — including deep boreholes
    across all major structure footprints — must be completed before finalising reservoir
    locations. A previously unmapped fault discovered during FEED forced reservoir
    relocation and reduced system head, adding cost and schedule pressure. PHES projects
    should budget for and prioritise subsurface investigation well ahead of reference
    design.
