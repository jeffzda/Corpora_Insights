  project_name: Cultana Seawater Pumped Hydro Energy Storage (SPHES) Project
  what_happened: The project team found that the SA energy market is relatively small,
    and a single PHES project at 225MW/1800MWh scale would represent a material share
    of total market storage — making it difficult for a single offtaker to absorb
    the full output on a long-term basis. This structural market constraint compounded
    the commercial viability challenge.
  lesson_learnt: In small, islanded electricity markets, a single PHES project can
    saturate available arbitrage and capacity value, making long-term offtake agreements
    difficult to structure. Developers should assess market size constraints early
    and consider whether market access via interconnector expansion, or structuring
    the project to provide services to multiple markets, is necessary to support a
    viable business case.
