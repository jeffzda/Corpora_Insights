- record_id: ARENA-DLV-67759
  source_title: Cultana Pumped Hydro Energy Storage Project Phase 2
  publish_date: 2020-09
  project_name: Cultana Seawater Pumped Hydro Energy Storage (SPHES) Project
  what_happened: Direct seawater was evaluated as the working fluid for the PHES system.
    Equipment suppliers indicated that maintenance requirements for direct seawater
    PHES would be approximately twice those of a freshwater system, with higher corrosion-related
    operational risk and uncertain component lifetimes. The project team assessed
    direct seawater as too high risk and switched to an RO desalination approach.
  lesson_learnt: Direct seawater as a PHES working fluid carries materially higher
    operational cost and risk than freshwater, with most suppliers estimating twice
    the maintenance burden. Unless a single-reservoir configuration is available (eliminating
    a lower reservoir and substantially reducing capital cost), the business case
    for seawater over a two-reservoir freshwater/RO system is weak. Future PHES proponents
    near coastlines should assess both configurations but expect freshwater with RO
    treatment to be the preferred outcome.
