  what_happened: 'The project team explicitly noted that PHES and BESS are complementary
    rather than competing technologies: BESS provides short-duration grid stability
    services while PHES provides longer-duration bulk energy storage. However, the
    falling cost of BESS and its simpler siting requirements reduced the immediate
    commercial pressure to develop PHES, contributing to the negative FID environment.'
  lesson_learnt: PHES projects should be positioned as complementary to BESS rather
    than competing with it — but falling BESS costs and simpler deployment reduce
    near-term market urgency for PHES investment, particularly for shorter storage
    durations. Without government policy or market mechanisms that explicitly value
    long-duration storage, bulk inertia, and capacity, PHES projects will struggle
    to achieve FID in competition with BESS on a pure commercial basis.
