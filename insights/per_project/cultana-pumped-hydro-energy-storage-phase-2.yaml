  what_happened: The Department of Defence (DoD) confirmed in August 2020 that it
    could not provide a land lease for the project site, effectively terminating the
    project. This occurred after two years of development expenditure and positive
    early negotiations with DoD throughout 2018–2019.
  lesson_learnt: Secure binding land access agreements — particularly for government-owned
    land — before incurring significant development expenditure. Positive early negotiations
    with a government landholder do not constitute land security; strategic policy
    changes can reverse a previously cooperative position without warning.
