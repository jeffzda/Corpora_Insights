- record_id: ARENA-DLV-67773
  source_title: Cultana Pumped Hydro Energy Storage Project Phase 2
  publish_date: 2020-09
  project_name: Cultana Seawater Pumped Hydro Energy Storage (SPHES) Project
  what_happened: The project required a change from the South Australian Development
    Act 1993 to the PDI Act 2016 mid-development when the PDI Act became operational
    for outback areas and 'Land Not Within a Council Area' on 1 July 2019, requiring
    realignment of the development application to the new legislative framework.
  lesson_learnt: Projects with long development timelines risk legislative framework
    changes mid-approval process. Monitor pending legislative transitions and engage
    proactively with the relevant planning authority to understand how changes will
    affect the approval pathway — at Cultana, the transition from the Development
    Act to the PDI Act required reconfirmation of the approvals pathway and affected
    submission requirements.
