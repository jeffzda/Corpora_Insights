  project_name: Cultana Seawater Pumped Hydro Energy Storage (SPHES) Project
  what_happened: The reference design was developed concurrently with geotechnical
    site investigations rather than sequentially. This meant design assumptions carried
    residual geotechnical risk through to EPC contractors, likely inflating tender
    prices as contractors priced the unknown subsurface risk. The project team identified
    that additional site investigations could have yielded $50–$150m in savings.
  lesson_learnt: For PHES projects, complete comprehensive geotechnical, topographic
    and environmental site investigations before commencing the reference design.
    Concurrent investigation and design leaves residual risk in contractor hands,
    which is priced into EPC bids as contingency. Separating the investigation phase
    from FEED adds time but reduces the risk premium contractors apply to binding
    lump-sum prices.
