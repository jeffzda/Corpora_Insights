- record_id: ARENA-DLV-67757
  source_title: Cultana Pumped Hydro Energy Storage Project Phase 2
  publish_date: 2020-09
  project_name: Cultana Seawater Pumped Hydro Energy Storage (SPHES) Project
  what_happened: The Stage 1 feasibility study proposed using the Spencer Gulf as
    the lower reservoir for a single-reservoir seawater PHES system. During Stage
    2 development, the project team found this configuration was not viable due to
    insufficient tidal exchange in the Spencer Gulf — recycling the same seawater
    daily would compound impacts on marine biota — and an inadequate penstock elevation-to-length
    ratio, requiring a redesign to a two-reservoir freshwater system.
  lesson_learnt: Seawater PHES using the ocean as the lower reservoir requires both
    adequate tidal exchange (to avoid recycling degraded water) and a high penstock
    elevation-to-length ratio. Sites that fail on either criterion will require a
    two-reservoir configuration, which eliminates the primary capital cost advantage
    of a seawater approach. Confirm these site-specific parameters before finalising
    the system concept in feasibility.
  issue_severity: major
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: concept/feasibility
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: The project team assessed a lower reservoir alternative and selected
    a two-reservoir RO freshwater system, which provided lower operational risk and
    comparable capital cost, and reduced marine environmental impacts.
  transferability: narrow
  delay_magnitude: null
  technology_domain: pumped hydro
  source_pages: &id007
  - 22
  - 23
  - 30
  - 31
  evidence_excerpt: Despite the positive conclusions of the earlier KSR, the topography
    of the Cultana site does not present sufficient vertical elevation difference,
    coupled with too much horizontal distance from coast to upper reservoir location
    for a viable one reservoir seawater system, therefore a two reservoir system was
    selected... A viable single-reservoir seawater pumped hydro system needs to be
    located where it can draw seawater and return it from open ocean and/or with sufficient
    current and tidal exchange to ensure there is not just a continuous recycling
    of the same seawater compounding impacts on marine biota.
