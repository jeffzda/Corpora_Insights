    uncertain — multiple simultaneous market changes (interconnectors, battery cost
    declines, renewable growth, policy reform) interact in ways that are difficult
    to model reliably. Proponents should stress-test business cases across a wide
    range of market scenarios and avoid structuring the investment case around FCAS
    revenue given regulatory uncertainty.
