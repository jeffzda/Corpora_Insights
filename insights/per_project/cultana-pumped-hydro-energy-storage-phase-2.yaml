- record_id: ARENA-DLV-67751
  source_title: Cultana Pumped Hydro Energy Storage Project Phase 2
  publish_date: 2020-09
  project_name: Cultana Seawater Pumped Hydro Energy Storage (SPHES) Project
  what_happened: EnergyAustralia took a negative Final Investment Decision (FID) in
    November 2019. The all-inclusive capital cost came in at $790.5m ($3.4m/MW), approximately
    50% higher than the initial feasibility estimate of $477m and well above the globally
    published benchmark of ~$2m/MW.
  lesson_learnt: Pre-feasibility capital cost estimates for PHES projects in Australia
    should be treated with significant caution — published benchmarks of <$2m/MW were
    found to be materially understated once full EPC tender pricing, owner's costs
    and contingency were included. Commission a competitive EPC tender process early
    enough to validate cost assumptions before committing to a project development
    timeline.
  issue_severity: critical
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: discontinued/not progressed
  secondary_failure_mode: commercial & market
  intervention_note: Arup exercised its development transfer right and took the project
    forward independently, but the project was subsequently terminated when DoD declined
    to provide a land lease.
  transferability: broad
  delay_magnitude: null
  technology_domain: pumped hydro
  source_pages: &id001
  - 13
  - 59
  evidence_excerpt: The tendered prices cannot be provided for confidentiality reasons.
    The project teams all-inclusive estimated final cost for the facility based on
    the reference design and EPC tenderers pricing, including contingency and owners'
    expenses was $790.5 million, equivalent to $3.5 million per MW net installed generating
    capacity. This is high in comparison to the benchmark range for PHES projects
    published globally which indicate typically cost in the region of $2 million per
    MW. The Cultana project was therefore indicated to be significantly more expensive
    than was expected during the pre-feasibility stage.
  confidence_note: outcome_class is 'discontinued/not progressed' — the negative FID
    preceded the DoD land denial; both contributed to project termination. secondary_failure_mode
    of commercial/demand failure captures the market revenue uncertainty that compounded
    the cost issue.
