- record_id: ARENA-DLV-67753
  source_title: Cultana Pumped Hydro Energy Storage Project Phase 2
  publish_date: 2020-09
  project_name: Cultana Seawater Pumped Hydro Energy Storage (SPHES) Project
  what_happened: Delays in determining the development approval pathway between State
    and Commonwealth agencies for the DoD site meant the EPBC Act submission requirements
    were not advised until September 2019 — more than 12 months after initial consultation
    commenced in July 2018 — pushing development approval well beyond the FID target
    date of December 2019.
  lesson_learnt: For projects spanning Commonwealth (Defence) and State land, initiate
    joint agency consultation on the approval pathway immediately and formally — do
    not assume parallel processes will self-coordinate. Over 12 months were lost waiting
    for Commonwealth EPBC assessment requirements to be determined, directly preventing
    FID.
