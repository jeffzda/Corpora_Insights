  source_title: Cultana Pumped Hydro Energy Storage Project Phase 2
  publish_date: 2020-09
  project_name: Cultana Seawater Pumped Hydro Energy Storage (SPHES) Project
  what_happened: The project modelled the business case over a 30-year financial horizon,
    consistent with EnergyAustralia's corporate investment hurdle rates. However,
    PHES assets have operational lives of 60–90+ years. This mismatch between the
    private sector investment horizon and the physical asset life created a structural
    barrier to achieving required returns, given the high upfront capital cost.
  lesson_learnt: PHES projects are structurally mismatched with typical private-sector
    investment horizons of 30 years — the combination of high capital cost and long
    payback periods makes them difficult to justify for private investors without
    government support. Future PHES proponents should consider government ownership,
    concessional financing, or capacity payment mechanisms to bridge the investment
    horizon gap, and should explicitly model returns over the full asset life.
