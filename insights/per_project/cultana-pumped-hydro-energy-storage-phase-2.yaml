  secondary_failure_mode: coordination & stakeholders
  intervention_note: The project received Crown Sponsorship from DEM on 9 April 2019
    and a referral was lodged with DoEE on 19 March 2019, but the controlled action
    determination was not received until 21 August 2019, with further assessment requirements
    then adding additional time.
  transferability: moderate
  delay_magnitude: 1-3 years
  technology_domain: pumped hydro
