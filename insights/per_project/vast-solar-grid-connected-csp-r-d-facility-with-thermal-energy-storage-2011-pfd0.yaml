- record_id: ARENA-DLV-40355
  source_title: 'In The Spotlight: Australian Solar Energy R&D Outcomes and Achievements
    in a Global Context'
  publish_date: 2018-07
  project_name: Vast Solar Grid-Connected CSP R&D Facility with Thermal Energy Storage
    (2011/PFD007, 2012/ASI046, 2013/ERP070)
  what_happened: Vast Solar's 6 MWth / 1.1 MWe CST pilot plant at Jemalong, NSW was
    commissioned and grid-connected in 2017 but as of the report date (mid-2018) was
    still undergoing performance and operational testing and optimisation, and had
    not yet demonstrated sufficient reliable continuous operation to support capital
    raising for the planned scale-up to 30 MWe.
  lesson_learnt: For first-of-a-kind CST pilot plants using novel configurations (modular
    sodium-based towers), plan for an extended post-commissioning optimisation period
    before the asset can serve as a credible basis for commercial scale-up — investors
    and financiers require demonstrated reliable continuous operation, not merely
    grid connection.
