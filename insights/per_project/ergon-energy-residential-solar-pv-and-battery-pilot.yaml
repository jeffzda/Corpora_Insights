- record_id: ARENA-DLV-9960
  source_title: 'Empowered Consumers: Distributed Energy Resources Portfolio Update'
  publish_date: '2018'
  project_name: Ergon Energy Residential Solar PV and Battery Pilot
  what_happened: The Ergon Energy Hybrid Energy Service pilot successfully demonstrated
    remote monitoring and operation of 33 solar-plus-battery systems as both individual
    units and an aggregated fleet in real time, and provided backup power during outages.
    However, the business model required further revision to improve financial outcomes
    for all parties.
  lesson_learnt: Residential solar-plus-battery pilots can demonstrate successful
    technical operation including remote aggregated fleet control and backup power,
    but the business model must be validated separately — technical success does not
    automatically translate to financial viability for customers, the retailer, or
    the network.
