- record_id: ARENA-DLV-53876
  source_title: Demand Flexibility Portfolio Retrospective Analysis Report
  publish_date: 2023-07
  project_name: ARENA Demand Flexibility Portfolio — EV Trials (ActewAGL, AGL, Jemena,
    Origin)
  what_happened: EV projects across all four ARENA-funded trials were unable to access
    or monetise external value streams (FCAS, network services, wholesale) due to
    a combination of charging technology limitations, V2G standards issues (AS-4777),
    supply chain delays with bidirectional chargers, and the inability to determine
    vehicle availability in real time for FCAS bidding.
  lesson_learnt: EV demand flexibility projects should not include FCAS, V2G, or network
    service revenue in their business cases until bidirectional charging standards
    are reformed, supply chains for compliant chargers are established, and vehicle
    availability visibility solutions are deployed; time-based tariff trials for unidirectional
    smart charging represent the viable near-term opportunity.
