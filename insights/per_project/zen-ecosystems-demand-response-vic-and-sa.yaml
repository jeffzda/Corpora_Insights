- record_id: ARENA-DLV-42333
  source_title: Evaluation of ARENA's 2017-2020 Demand Response Portfolio
  publish_date: 2021-06
  project_name: Zen Ecosystems Demand Response (VIC and SA)
  what_happened: Zen Ecosystems had successfully deployed its smart connected thermostat
    technology internationally but had not validated it in the Australian context
    before the ARENA trial; the technology failed to produce anticipated DR in Australian
    commercial refrigeration applications, suggesting that international proof-of-concept
    does not guarantee applicability to the local market.
  lesson_learnt: Require applicants with internationally-proven but Australia-untested
    technologies to conduct a local proof-of-concept in the specific target application
    before committing to full trial funding — international deployment experience
    does not substitute for local validation, particularly where building stock, appliance
    types, and operating conditions differ.
