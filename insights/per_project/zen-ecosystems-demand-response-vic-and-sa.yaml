- record_id: ARENA-DLV-42332
  source_title: Evaluation of ARENA's 2017-2020 Demand Response Portfolio
  publish_date: 2021-06
  project_name: Zen Ecosystems Demand Response (VIC and SA)
  what_happened: The Zen Ecosystems project was mutually terminated midway through
    Year 2 after failing to deliver meaningful DR — delivering only 0.01 MW and 0.03
    MW against a 5 MW contract in Year 1 — due to insufficient customer uptake and
    load control devices installed in commercial refrigeration applications failing
    to produce expected demand reductions.
  lesson_learnt: Validate that a technology's DR mechanism actually produces measurable
    load reduction in the target application before scaling — Zen's smart thermostat
    approach failed in commercial refrigeration contexts despite international deployments,
    and early-stage load testing at a handful of sites would have identified this
    before full deployment.
