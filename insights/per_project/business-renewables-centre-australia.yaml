  source_title: 'Corporate Renewable Power Purchase Agreements in Australia: State
    of the Market 2019'
  publish_date: '2019'
  project_name: Corporate PPA Market – Australia (portfolio-level)
  what_happened: Corporate PPA negotiations in Australia most commonly took 6–12 months
    but often extended to 12–18 months, with some deals taking over two years; only
    a small proportion were completed in under six months, and those were typically
    earlier deals between large companies and developers.
  lesson_learnt: Organisations pursuing a Corporate PPA should plan for a negotiation
    timeline of at least 6–12 months and budget internal resourcing accordingly —
    deals under six months are rare and typically confined to large, experienced counterparties
    with established relationships.
