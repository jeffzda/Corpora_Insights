  source_title: Business Renewables Centre Australia Final Report
  publish_date: 2022-03
  project_name: Business Renewables Centre Australia (BRC-A)
  what_happened: A strategic review found that the BRC-A's service delivery model
    was unclear to members, unstructured, and attempting to serve all segments equally
    rather than focusing on its core customer group (energy buyers). Members indicated
    fees were too low and offerings needed simplification.
  lesson_learnt: Intermediary platforms and industry bodies should define a clear,
    segment-specific value proposition and align their revenue base with their primary
    customers from an early stage — attempting to serve all stakeholder groups equally
    without a structured model leads to perceived lack of clarity and underpricing.
  issue_severity: moderate
  project_type: software/data/digital
