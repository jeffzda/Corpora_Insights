  project_name: Business Renewables Centre Australia (BRC-A)
  what_happened: The Retail PPA Guide became the most-accessed resource in the BRC-A
    member portal (ahead of the Deal Structure Primer) during 2020–21, reflecting
    an accelerating market shift toward retail PPAs driven by their perceived lower
    complexity relative to wholesale PPAs.
  lesson_learnt: Resource development programs for industry knowledge platforms should
    track and respond to market shifts in real time — the rapid emergence of retail
    PPAs as the preferred structure for small and mid-sized buyers was not anticipated
    in the original tool development plan, and the Retail PPA Guide was added outside
    the original scope in response to this trend.
