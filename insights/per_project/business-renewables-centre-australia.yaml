  publish_date: '2019'
  project_name: Corporate PPA Market – Australia (portfolio-level)
  what_happened: Derivative accounting treatment of Wholesale PPAs emerged as a significant
    barrier for mid-scale buyers; organisations unfamiliar with mark-to-market accounting
    requirements were deterred from or delayed in executing Wholesale PPA structures,
    contributing to the growth of Retail PPA products as an alternative.
  lesson_learnt: Buyers evaluating Wholesale PPAs must engage their finance and accounting
    teams early to assess derivative accounting treatment implications — failure to
    do so has been identified as a deal-blocking issue, particularly for organisations
    outside the large energy-user segment, and has driven structural innovation toward
    Retail PPAs as a workaround.
