- record_id: ARENA-DLV-2505
  source_title: 'Corporate Renewable Power Purchase Agreements in Australia: State
    of the Market 2019'
  publish_date: '2019'
  project_name: Corporate PPA Market – Australia (portfolio-level)
  what_happened: Changes to marginal loss factors (MLFs) determined by AEMO affected
    project revenues significantly — some projects had MLFs dramatically reduced (e.g.
    the Broken Hill area MLF fell to 0.79 following construction of a large nearby
    generator), creating uncertainty for both existing and prospective PPAs.
  lesson_learnt: PPA buyers and developers should explicitly model marginal loss factor
    scenarios in project financial analysis and include MLF risk allocation clauses
    in PPA terms — MLF reductions are an external regulatory risk that can materially
    impair project revenues without warning and have been identified as a factor slowing
    deal-making across the sector.
