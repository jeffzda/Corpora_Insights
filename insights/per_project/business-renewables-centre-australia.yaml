  what_happened: The BRC-A's initial financial model relied on membership fees from
    developer and service provider members, with energy buyers receiving free access.
    This model did not generate sufficient revenue to sustain the organisation long-term,
    even after exceeding membership targets.
  lesson_learnt: When designing a sustainability-focused membership model, do not
    exclude the primary beneficiary (energy buyers) from fee-bearing membership —
    charge appropriately from the start, as buyers indicate willingness to pay and
    free access undermines long-term financial sustainability.
