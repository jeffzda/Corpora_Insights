- record_id: ARENA-DLV-2509
  source_title: 'Corporate Renewable Power Purchase Agreements in Australia: State
    of the Market 2019'
  publish_date: '2019'
  project_name: Corporate PPA Market – mid-scale buyers
  what_happened: Mid-scale buyers (100 MWh to 50 GWh p.a.) generally lacked the scale
    to be attractive to project developers for new-build Wholesale PPAs, had lower
    risk appetites, and preferred shorter contract terms than the 10+ year minimum
    typically sought by developers, creating a structural mismatch that left a large
    segment of potential buyers unable to access the market directly.
  lesson_learnt: New-build project developers seeking Corporate PPA offtakers should
    either target buyers with loads above ~50 GWh or work through retailers who can
    aggregate mid-scale demand — the structural mismatch between developer minimum
    term requirements (10+ years) and mid-scale buyer preferences means direct negotiations
    with this segment are unlikely to succeed without a retail intermediary.
  issue_severity: moderate
  project_type: generation
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: financing/commercial close
  failure_mode: commercial & market
  outcome_class: re-scoped/adapted
  secondary_failure_mode: coordination & stakeholders
  intervention_note: Retailers developed Retail PPA products to bridge the gap, and
    aggregation models (such as the Victorian Local Government PPA) were established
    to allow mid-scale buyers to participate collectively.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hybrid systems
  source_pages: &id007
  - 19
  evidence_excerpt: Wholesale PPAs are sometimes negotiated with buyers in this range
    – especially with operating projects – but in general they often lack the scale
    to be attractive to a project developer for new projects. The buyers tend to be
    less familiar with the wholesale market and project development. They can have
    lower risk appetites, be less willing or able to enter into long term contracts.
