  publish_date: '2019'
  project_name: Victorian Local Government PPA
  what_happened: The Victorian Greenhouse Alliances aggregated 48 local councils into
    a buyers group to pursue a collective Corporate PPA for 246 GWh p.a. (44% of members'
    combined electricity requirements); individually, each council lacked the scale
    to attract developer interest or negotiate favourable terms.
  lesson_learnt: Mid-scale and small buyers who individually lack sufficient load
    to attract developer interest should consider aggregated buyer groups — the Victorian
    model demonstrates that aggregation can unlock market access, but success depends
    on establishing a clear governance model, allocating resources for a dedicated
    facilitator, agreeing an opt-in recruitment model, and securing independent advisory
    support.
