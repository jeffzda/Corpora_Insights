- record_id: ARENA-DLV-2504
  source_title: 'Corporate Renewable Power Purchase Agreements in Australia: State
    of the Market 2019'
  publish_date: '2019'
  project_name: Corporate PPA Market – Australia (portfolio-level)
  what_happened: There was a marked slowdown in Corporate PPA deal finalisation in
    the first half of 2019, with only five new PPAs announced compared to approximately
    25 in all of 2018; contributing factors included the 2019 Federal Election, project
    delays from grid connection issues and company bankruptcies, changing marginal
    loss factors, and growing uncertainty about future wholesale electricity prices
    for solar farms.
  lesson_learnt: Grid connection delays and adverse marginal loss factor determinations
    can stall not just individual projects but an entire class of offtake transactions
    — buyers and developers should assess grid connection risk and MLF exposure early
    in project evaluation to avoid committing to negotiations that subsequently collapse
    due to project-side viability issues.
