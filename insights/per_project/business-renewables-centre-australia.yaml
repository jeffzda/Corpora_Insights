  what_happened: The BRC-A found that the primary barrier to corporate PPA execution
    in 2019 was a lack of organisational understanding about corporate renewable PPAs
    and a resultant lack of internal support, rather than price or commercial terms.
    Targeted education and information-sharing was found to be the effective intervention.
  lesson_learnt: For nascent renewable procurement markets, the binding constraint
    is knowledge and internal advocacy — targeted buyer education programs (bootcamps,
    primers, peer case studies) are more effective at unlocking deal flow than price
    signals alone, as demonstrated by the 2020 record PPA volume following BRC-A's
    three years of education activity.
