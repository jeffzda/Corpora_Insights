- record_id: ARENA-DLV-2701
  source_title: Metal Assisted Chemical Etching of SLIVERs - Project results and lessons
    learnt
  publish_date: 2018-09
  project_name: Metal Assisted Chemical Etching of SLIVER Solar Cells
  what_happened: The MAE process for etching SLIVER grooves was found to be highly
    sensitive to Au film parameters — specifically thickness, post-deposition heat
    treatment, and etch conditions. When the Au layer was too thin or fragile, it
    fractured during etching, leaving unetched Si sections in the groove. Achieving
    the correct balance between Au thickness and induced porosity proved difficult
    throughout the project.
  lesson_learnt: Future projects using MAE for groove etching or texturing should
    use thicker Au films with heat-treatment-induced porosity under optimised etch
    conditions — the extensive parameter-testing dataset from this project provides
    a reference baseline, reducing the need to repeat this characterisation work from
    scratch.
