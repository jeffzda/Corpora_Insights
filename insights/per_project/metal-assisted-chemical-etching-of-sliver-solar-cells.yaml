- record_id: ARENA-DLV-2706
  source_title: Metal Assisted Chemical Etching of SLIVERs - Project results and lessons
    learnt
  publish_date: 2018-09
  project_name: Metal Assisted Chemical Etching of SLIVER Solar Cells
  what_happened: The conventional SLIVER etching process requires expensive custom-made
    <110> Si wafers due to its crystallographic dependence. The MAE-based approach
    demonstrated in this project successfully used standard <100> Si wafers, which
    are significantly cheaper, removing a materials cost constraint that had limited
    the commercial viability of SLIVER manufacturing.
  lesson_learnt: Future SLIVER manufacturing projects should evaluate MAE as a route
    to using lower-cost <100> Si wafers in place of custom <110> wafers — this project
    demonstrated feasibility at lab scale and the substitution could materially reduce
    input material costs.
