  - 13
  evidence_excerpt: The Au used for MAE was unable to be detected in SLIVERs post-processing
    and indicates that the removal of Au is possible using the methods employed in
    this project. The complete removal of Au is highly desirable as it has the potential
    to greatly reduce solar cell performance if it is present during later high temperature
    process steps.
