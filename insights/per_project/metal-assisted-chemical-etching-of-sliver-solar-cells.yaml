- record_id: ARENA-DLV-2702
  source_title: Metal Assisted Chemical Etching of SLIVERs - Project results and lessons
    learnt
  publish_date: 2018-09
  project_name: Metal Assisted Chemical Etching of SLIVER Solar Cells
  what_happened: The Au thin film catalyst increased in porosity during the MAE etching
    process itself, meaning process control became progressively more difficult as
    etching proceeded. Some process parameters (Au thickness, heat treatment temperature/time)
    were identified that help control etch regularity, but full process robustness
    was not achieved within the project.
  lesson_learnt: When using Au thin films as a MAE catalyst for deep groove etching,
    design for dynamic changes in film porosity during etching — the film properties
    at the start of the etch will not represent conditions mid-process, requiring
    parameter selection that accommodates this drift rather than assuming static catalyst
    behaviour.
