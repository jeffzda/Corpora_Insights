- record_id: ARENA-DLV-2705
  source_title: Metal Assisted Chemical Etching of SLIVERs - Project results and lessons
    learnt
  publish_date: 2018-09
  project_name: Metal Assisted Chemical Etching of SLIVER Solar Cells
  what_happened: Modelling of texture patterns on SLIVER front and rear surfaces using
    PVLighthouse ray tracing software identified that small feature sizes with back-side
    feature angles greater than 60° delivered the most favourable light-trapping outcomes.
    Critically, the modelling also showed that maintaining constant total SLIVER thickness
    is necessary — larger features increase light trapping but waste Si, reducing
    total current per wafer.
  lesson_learnt: When designing texture patterns for thin Si solar cells, optimise
    for current per wafer rather than current per cell area alone — larger surface
    features improve per-cell light trapping but reduce the number of cells per wafer,
    and modelling showed the net optimum for SLIVER cells is small features (5–10µm)
    with rear angles above 60°, yielding a 3.7% current gain over planar equivalents.
  issue_severity: none
  project_type: manufacturing/supply chain
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: follow-on scale-up enabled
  secondary_failure_mode: null
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id005
  - 6
  - 7
  - 11
  - 12
  evidence_excerpt: It was shown that the total SLIVER thickness needed to remain
    constant for there to be significant gains in terms of current output/Si wafer
    i.e. while large feature patterns increase the light trapping in the SLIVER, the
    amount of wasted Si leads to an overall reduction in total current/Si wafer. Small
    feature sizes with back-side feature angles >60° were identified as the most promising
    designs for future synthesis and total current gains of 3.7% per SLIVER wafer
    are predicted.
  confidence_note: outcome_class follow-on scale-up enabled because the explicit next
    step identified is manufacturing SLIVERs with these texture patterns.
