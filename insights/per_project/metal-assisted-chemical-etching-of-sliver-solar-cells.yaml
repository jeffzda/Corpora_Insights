- record_id: ARENA-DLV-2703
  source_title: Metal Assisted Chemical Etching of SLIVERs - Project results and lessons
    learnt
  publish_date: 2018-09
  project_name: Metal Assisted Chemical Etching of SLIVER Solar Cells
  what_happened: MAE was successfully demonstrated to etch SLIVER grooves in a spiral
    pattern through a 650µm-thick wafer, enabling wafer utilisation of greater than
    95% compared to the industry baseline of approximately 81% for conventional straight-line
    etching. This improvement was possible because MAE is not constrained by crystal
    orientation, unlike the conventional SLIVER etch method.
  lesson_learnt: Projects seeking to improve Si wafer utilisation in SLIVER manufacture
    should adopt MAE-based spiral or curved groove etching — the crystal-orientation
    independence of MAE enables non-linear groove geometries that increase usable
    wafer area from ~81% to >95%, with direct material cost implications at scale.
