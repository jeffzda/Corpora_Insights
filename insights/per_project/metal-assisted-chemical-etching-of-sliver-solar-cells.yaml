- record_id: ARENA-DLV-2704
  source_title: Metal Assisted Chemical Etching of SLIVERs - Project results and lessons
    learnt
  publish_date: 2018-09
  project_name: Metal Assisted Chemical Etching of SLIVER Solar Cells
  what_happened: The project demonstrated that Au used as a MAE catalyst could be
    fully removed from SLIVER wafers post-etching using an Aqua Regia acid treatment,
    with photoluminescence testing after a subsequent high-temperature furnace step
    showing no detectable reduction in signal intensity — indicating no residual Au
    contamination.
  lesson_learnt: Au contamination from MAE processing need not be a barrier to solar
    cell device fabrication — an Aqua Regia decontamination step prior to high-temperature
    processing is sufficient to prevent the efficiency degradation that residual Au
    would otherwise cause, and this step should be incorporated as standard in any
    MAE-based SLIVER process flow.
  issue_severity: none
  project_type: manufacturing/supply chain
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: SLIVERs treated with Aqua Regia solution to dissolve Au prior
    to high-temperature furnace step; photoluminescence showed no degradation, confirming
    successful Au removal.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id004
