  source_title: A Roadmap for Decarbonising Australian Alumina Refining
  publish_date: 2022-11
  project_name: Alcoa Mechanical Vapour Recompression (MVR) Demonstration – Wagerup Alumina Refinery
  what_happened: ARENA announced $11.3 million in funding to Alcoa in May 2021 to demonstrate MVR technology at its Wagerup alumina refinery as a first-of-a-kind demonstration in Australia. The $35 million
    project involved a Stage 1 desktop feasibility study and Stage 2 delivery of a 4 MW MVR module, with commissioning planned for 2023.
  lesson_learnt: For first-of-a-kind industrial decarbonisation demonstrations, staging the project into a desktop feasibility phase (Stage 1) before committing to physical construction (Stage 2) reduces
    technical risk and helps validate integration assumptions before capital is committed to equipment procurement.
