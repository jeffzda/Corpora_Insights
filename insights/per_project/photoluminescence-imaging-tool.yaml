  publish_date: 2021-03
  project_name: Prototyping a Photoluminescence Imaging Tool for Testing of Fielded
    Solar Modules
  what_happened: The project required rapid hardware and software prototyping within
    a 1-year timeframe from a university environment not designed for fast commercial
    product cycles, creating procurement and development bottlenecks that threatened
    timely delivery.
  lesson_learnt: When running a short-duration technology development project from
    a university base, engage external professionals and commercial suppliers for
    time-critical components — privately purchasing small items for reimbursement
    and outsourcing specialist tasks (laser cutting, software development) can compress
    cycle times from weeks to days and improve final quality.
