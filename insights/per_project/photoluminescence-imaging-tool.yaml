- record_id: ARENA-DLV-40653
  source_title: 'University of New South Wales Sydney: Prototyping a Photoluminescence
    Imaging Tool for Testing of Fielded Solar Modules - Lessons Learnt Report'
  publish_date: 2021-03
  project_name: Prototyping a Photoluminescence Imaging Tool for Testing of Fielded
    Solar Modules
  what_happened: The team found it more difficult than anticipated to gain access
    to operational utility-scale solar farms for field testing, as farm operators
    receive no direct benefit from hosting researchers and must allocate staff time
    and resources to accommodate visits.
  lesson_learnt: Securing field-testing access to commercial solar farms requires
    strong pre-existing industry networks — proactively build and maintain relationships
    with farm operators and alumni networks well before access is needed, as cold
    approaches are unlikely to succeed.
