- record_id: ARENA-DLV-40654
  source_title: 'University of New South Wales Sydney: Prototyping a Photoluminescence
    Imaging Tool for Testing of Fielded Solar Modules - Lessons Learnt Report'
  publish_date: 2021-03
  project_name: Prototyping a Photoluminescence Imaging Tool for Testing of Fielded
    Solar Modules
  what_happened: Field interactions with solar farm operators revealed that the team's
    technical framing of the PL imaging technology did not match industry priorities
    — operators focused on throughput (panels imaged per hour) rather than imaging
    quality or technical novelty, exposing a gap between research assumptions and
    commercial requirements.
  lesson_learnt: Validate commercial use-case assumptions directly with end users
    early in development — field operators' priorities (throughput, ease of use) can
    differ substantially from research team assumptions (technical capability), and
    early discovery allows technology to be redirected before design is locked in.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: pilot
  lifecycle_phase: operations
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: The team developed two further technological advancements focused
    on faster and easier imaging throughput, filed one provisional patent, and considered
    filing a second — substantially improving commercial viability.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id004
  - 5
  - 6
  evidence_excerpt: 'A typical question that came up when we spoke to personnel at
    the solar farms we visited was: ''How many solar panels can you image per hour
    (or day)?''... There can be a substantial gap between research (and technological
    excitement) and the realities in the commercial world.'
  confidence_note: lifecycle_phase assigned as operations as the insight arose during
    field testing on live plants, not during design.
