  what_happened: The RFI did not explicitly ask for specific project proposals, and
    while some respondents described specific project ideas, most did not — leaving
    unanswered how long it would realistically take suitably qualified companies to
    produce a detailed project proposal for a competitive process.
  lesson_learnt: Before launching a formal CST competitive procurement, ARENA should
    establish a realistic understanding of how long proponents require to develop
    detailed project proposals — insufficient lead time between program announcement
    and proposal submission deadlines risks receiving immature bids from capable developers
    and over-reliance on less-qualified proponents.
