- record_id: ARENA-DLV-8703
  source_title: Synthesis Of Responses To ARENA's RFI On CST Projects
  publish_date: '2017'
  project_name: ARENA 2017 CST RFI Process
  what_happened: Experienced CST respondents identified that regulatory and policy
    uncertainty in Australia — including uncertainty around the RET and broader energy
    and climate policy — represents a significant risk premium applied to CST project
    costs and financing, acting as an immediate barrier to deployment.
  lesson_learnt: Policy and regulatory uncertainty directly inflates CST project financing
    costs through elevated risk premiums — securing long-term policy stability or
    providing indexed PPAs over ~25 years from creditworthy offtakers is a prerequisite
    for making commercial-scale CST projects financeable in Australia.
  issue_severity: major
  project_type: generation
  project_scale_band: utility/large-scale
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: financing/commercial close
  failure_mode: regulatory & approvals
  outcome_class: policy/market influence only
  secondary_failure_mode: commercial & market
  intervention_note: Respondents recommended signing PPA contracts where possible,
    developing projects with relatively short return on investment periods, and structuring
    a Contract for Difference as an alternative to direct PPAs.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar thermal
  source_pages: &id003
  - 20
