- record_id: ARENA-DLV-8724
  source_title: Synthesis Of Responses To ARENA's RFI On CST Projects
  publish_date: '2017'
  project_name: ARENA 2017 CST RFI Process
  what_happened: The RFI found that responses were absent from major technology-agnostic
    global renewable energy project developers, from any Chinese respondents, and
    from most Australian state and territory governments — limiting the completeness
    of market intelligence gathered.
  lesson_learnt: RFI processes for large-scale CST programs should be actively marketed
    to technology-agnostic global renewable energy developers and international markets
    including China — their absence from a market-testing process leaves a material
    gap in understanding of competitive supply capability and true market depth.
