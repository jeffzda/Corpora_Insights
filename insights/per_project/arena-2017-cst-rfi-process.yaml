- record_id: ARENA-DLV-8707
  source_title: Synthesis Of Responses To ARENA's RFI On CST Projects
  publish_date: '2017'
  project_name: ARENA 2017 CST RFI Process
  what_happened: Experienced respondents identified molten salt freezing as a recurring
    technical risk in CST tower plants, arising from cold spots in piping and equipment
    that can cause salt to solidify and block flow paths, with consequent damage and
    operational disruption.
  lesson_learnt: CST plant engineering design must explicitly address salt freeze
    risk — cold spots and hot spots must be mapped and mitigated during detailed design
    based on lessons learnt from prior projects, as post-construction remediation
    of freeze events is costly and disruptive.
