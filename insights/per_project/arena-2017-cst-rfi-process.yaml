- record_id: ARENA-DLV-8704
  source_title: Synthesis Of Responses To ARENA's RFI On CST Projects
  publish_date: '2017'
  project_name: ARENA 2017 CST RFI Process
  what_happened: None of the 31 RFI respondents advocated that CST project developers
    build plants to operate on a merchant basis; all assumed that long-term income
    certainty via some offtake mechanism is required before a commercial-scale CST
    plant can be financed.
  lesson_learnt: Commercial-scale CST projects cannot be financed on a merchant basis
    — any program supporting CST deployment must incorporate a mechanism for long-term
    offtake certainty (indexed PPA, Contract for Difference, or equivalent) as an
    integrated part of the funding structure.
  issue_severity: major
  project_type: generation
  project_scale_band: utility/large-scale
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: financing/commercial close
  failure_mode: commercial & market
  outcome_class: policy/market influence only
  secondary_failure_mode: null
  intervention_note: Respondents recommended a specific action of 200 MW across three
    to four projects of 50 MWe or more, with integrated provision of an offtake agreement
    via a Contract for Difference or other mechanism.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar thermal
  source_pages: &id004
