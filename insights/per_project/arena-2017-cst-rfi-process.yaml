  what_happened: Bird deaths at large tower CST projects in the US were raised as
    an environmental concern by respondents, though follow-up investigation and improved
    mirror field management found deaths were at a level commensurate with bird strikes
    on other man-made structures.
  lesson_learnt: Initial site assessment for CST tower plants must include evaluation
    of potential impacts on sensitive bird species — though evidence suggests deaths
    can be managed to acceptable levels with proper investigation and mirror field
    management, failure to address this upfront can trigger community and regulatory
    opposition that delays approvals.
