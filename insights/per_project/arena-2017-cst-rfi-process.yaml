  source_title: Synthesis Of Responses To ARENA's RFI On CST Projects
  publish_date: '2017'
  project_name: ARENA 2017 CST RFI Process
  what_happened: Cost discovery through the RFI process was limited; major experienced
    companies declined to provide specific LCOE estimates due to competitive sensitivity,
    while the most ambitious (lowest) cost estimates came from smaller, unproven technology
    developers. Of 31 respondents, only 12 offered any LCOE view, yielding an indicative
    2017 range of AUD $124–$154/MWh for large CST plants in Australia.
  lesson_learnt: ARENA-style RFI processes are not an effective mechanism for obtaining
    reliable competitive cost data from major experienced CST developers — a formal
    competitive procurement process is needed to unlock genuine cost disclosure from
    the most capable players, while RFI-stage cost estimates from unproven developers
    should be treated with significant caution.
