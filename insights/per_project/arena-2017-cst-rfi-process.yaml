  source_title: Synthesis Of Responses To ARENA's RFI On CST Projects
  publish_date: '2017'
  project_name: ARENA 2017 CST RFI Process
  what_happened: Respondents noted that steam turbines have reducing efficiency when
    run at part load, creating an operational trade-off for CST plants that operate
    in flexible dispatch mode — switching the turbine off at part-load times may be
    more economically optimal, but incurs energy and time penalties for restarts.
  lesson_learnt: CST dispatch strategies and commercial models must account for steam
    turbine part-load efficiency penalties — flexible dispatch designs that frequently
    cycle or part-load the power block will reduce overall energy generation and incur
    restart penalties that should be quantified in project financial models.
