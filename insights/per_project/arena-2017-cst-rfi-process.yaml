- record_id: ARENA-DLV-8705
  source_title: Synthesis Of Responses To ARENA's RFI On CST Projects
  publish_date: '2017'
  project_name: ARENA 2017 CST RFI Process
  what_happened: CST projects require larger minimum scale than wind or PV (broadly
    >50 MWe) due to steam turbine efficiency scaling, and construction times of approximately
    30 months for tower plus molten salt plants in Australia, compared to 18 months
    achieved for 50 MW trough plants in Spain during the peak construction period.
  lesson_learnt: CST plant sizing below approximately 50 MWe yields substantially
    lower turbine efficiencies and higher LCOEs — project programs should target plants
    of 50 MWe or more, and schedules should allow approximately 30 months for construction
    and commissioning of tower-plus-molten-salt plants in Australia, with the extended
    pre-construction development phase also planned for.
  issue_severity: moderate
  project_type: generation
  project_scale_band: utility/large-scale
  lifecycle_phase: construction/installation
  proponent_type: project developer
  delay_category: construction/installation
  failure_mode: poor scoping
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Experienced companies noted that in Spain, construction times
    were reduced to 18 months for multiple similar 50 MW trough plants built by experienced
    teams; Australian programs should anticipate longer durations for first tower
    projects.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar thermal
  source_pages: &id005
  - 27
  - 32
  evidence_excerpt: For tower plus molten salt plants in Australia at the present
    time, there seems to be a consensus that around 30 months is required... In Spain,
    during the peak of construction where multiple similar 50 MW trough plants were
    built by experienced teams and contractors, construction times from ground breaking
    to grid connection were reduced to 18 months.
  confidence_note: issue_severity set to moderate as this is a planning/scoping insight
    rather than an active failure; delay_magnitude not quantified as it refers to
    expected durations rather than a specific overrun.
