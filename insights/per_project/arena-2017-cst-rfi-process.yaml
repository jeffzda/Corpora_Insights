- record_id: ARENA-DLV-8701
  source_title: Synthesis Of Responses To ARENA's RFI On CST Projects
  publish_date: '2017'
  project_name: ARENA 2017 CST RFI Process
  what_happened: Australia made limited progress in CST deployment prior to 2017,
    with previous support programs attempting to facilitate solar boost projects for
    existing coal-fired power stations rather than standalone CST plants. The Solar
    Flagships program failed to deliver a successful CST project.
  lesson_learnt: Program design matters critically for CST deployment — awarding a
    single project to a single supplier on price alone, with insufficient regard to
    track record, contributed to the failure of the Solar Flagships CST program. Future
    programs should use competitive rounds with multiple projects and robust assessment
    of proponent capability.
