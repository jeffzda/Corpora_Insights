  secondary_failure_mode: null
  intervention_note: 'Specific recommendation: a total capacity of around 200 MW across
    three to four separate projects of 50 MWe or more each, with integrated offtake
    agreements, as the optimal initial program structure.'
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar thermal
  source_pages: &id012
