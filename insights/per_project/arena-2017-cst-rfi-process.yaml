  source_title: Synthesis Of Responses To ARENA's RFI On CST Projects
  publish_date: '2017'
  project_name: ARENA 2017 CST RFI Process
  what_happened: Respondents noted there is an inherent tension in CST project design
    between seeking low technical risk (using proven components and configurations)
    and driving innovation for lower cost — and that tower plants, while currently
    the most effective approach, have relatively few global examples and higher temperature
    operation introduces greater technical challenges.
  lesson_learnt: CST program design must explicitly balance technical risk and cost
    reduction objectives — programs that push unproven technology too early risk project
    failure, while programs that only support proven technology may forgo significant
    cost reduction opportunities; a staged approach with demonstration projects preceding
    commercial-scale deployment is appropriate for new configurations.
