  source_title: Synthesis Of Responses To ARENA's RFI On CST Projects
  publish_date: '2017'
  project_name: ARENA 2017 CST RFI Process
  what_happened: Solar field commissioning was identified by experienced respondents
    as a known technical risk area for CST plants, with issues arising from assembly
    quality defects and inadequate commissioning procedures — particularly given the
    large number of individually-aligned mirror or heliostat elements involved.
  lesson_learnt: CST solar field commissioning should be based on reliable procedures
    derived from lessons learnt from prior projects, with close QA/QC control during
    assembly and systems for early detection of issues — defects found late in commissioning
    are significantly more costly to rectify than those caught during assembly.
