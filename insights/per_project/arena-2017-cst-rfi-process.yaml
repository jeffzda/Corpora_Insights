- record_id: ARENA-DLV-8712
  source_title: Synthesis Of Responses To ARENA's RFI On CST Projects
  publish_date: '2017'
  project_name: ARENA 2017 CST RFI Process
  what_happened: A single competitive round approach to CST procurement was assessed
    by experienced respondents as insufficient for establishing best practice, improving
    local supply chains, or achieving meaningful cost reductions; Spain's track record
    of installing 2.3 GWe between 2007 and 2013 was cited as evidence of what a pipeline
    of projects can achieve.
  lesson_learnt: A pipeline of multiple CST projects — either in parallel or sequentially
    — is required to maximise the benefits of program investment; a single funding
    round will not establish best practice, lower risk margins from lenders, enable
    shared facilities, or develop local supply chains. Australia should structure
    its CST support as a series of funding rounds.
