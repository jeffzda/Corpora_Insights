- record_id: ARENA-DLV-8706
  source_title: Synthesis Of Responses To ARENA's RFI On CST Projects
  publish_date: '2017'
  project_name: ARENA 2017 CST RFI Process
  what_happened: Respondents with large deployment track records identified a lack
    of adequately experienced operators and local support staff as a key operational
    risk for CST plants, particularly given remote site locations and the specialised
    nature of combined solar field, molten salt storage, and steam turbine operations.
  lesson_learnt: Operations staff should be involved during construction and throughout
    commissioning — not just at handover — and training programs should include experienced
    plant operators, plant simulators, and thermal power plant operators to build
    the capability needed for safe and effective CST plant operations from day one.
  issue_severity: moderate
