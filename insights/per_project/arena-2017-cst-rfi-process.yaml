- record_id: ARENA-DLV-8702
  source_title: Synthesis Of Responses To ARENA's RFI On CST Projects
  publish_date: '2017'
  project_name: ARENA 2017 CST RFI Process
  what_happened: CST LCOE is universally acknowledged to be higher than PV or wind
    without storage, and current renewable energy support mechanisms such as Australia's
    RET reward all renewable MWhs equally, providing no additional value for the dispatchability,
    firm capacity, or system stability benefits that CST with thermal storage provides.
  lesson_learnt: Renewable energy support mechanisms that compare technologies solely
    on LCOE will systematically disadvantage CST — future policy design should reward
    dispatchable generation, generation outside sun hours, and grid stability services
    to make CST projects financeable.
  issue_severity: major
  project_type: generation
  project_scale_band: utility/large-scale
  lifecycle_phase: concept/feasibility
  proponent_type: project developer
  delay_category: approvals/regulatory
  failure_mode: commercial & market
  outcome_class: policy/market influence only
  secondary_failure_mode: regulatory & approvals
  intervention_note: Respondents recommended that future policies include Time of
    Day multipliers (as used in South Africa) and reward for generation outside sun
    hours and during peak demand periods.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar thermal
  source_pages: &id002
  - 8
  - 20
  - 24
  evidence_excerpt: A large barrier to deployment has been the comparison of renewable
    technologies on a simple LCOE basis... The electricity market does not adequately
    reward the benefits of CST power generation. These benefits include the synchronous
    generation from a steam turbine as well as the advantages from thermal energy
    storage providing known levels of reliability and security.
  confidence_note: 'project_scale_band reconciled to ''utility/large-scale'' from:
