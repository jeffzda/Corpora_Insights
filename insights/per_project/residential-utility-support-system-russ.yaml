- record_id: ARENA-DLV-72288
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: '2015'
  project_name: Residential Utility Support System (RUSS)
  what_happened: Ergon Energy deployed a residential battery storage device (RUSS)
    across nine customers in Townsville (AUD 495,000) to address voltage regulation
    and capacity issues exacerbated by rooftop PV. The trial found that load shapes
    on all three phases exhibited a large degree of variability due to the inherently
    low customer diversity, with large loads such as irrigation pumps strongly influencing
    phase load.
  lesson_learnt: Distributed battery storage trials on very small customer networks
    (fewer than ~33 customers) will exhibit high load variability that complicates
    voltage regulation conclusions — ensure trial scale is sufficient to achieve load
    diversity before drawing generalisable network management findings.
