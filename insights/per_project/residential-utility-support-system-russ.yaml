  evidence_excerpt: The load shapes on all three phases were observed to exhibit a
    large degree of variability. This high degree of variability was essentially due
    to the inherently low diversity associated with the relatively low number of customers
    (only 33 on this network). The timing of large loads (such as irrigation pumps
    on 2 of the properties) strongly influences the overall load on the phase.
