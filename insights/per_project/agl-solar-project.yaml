  project_name: AGL Energy Solar Project (Nyngan and Broken Hill Solar Plants)
  what_happened: The minimum capacity test procedures used at Nyngan and Broken Hill
    were First Solar's standardised procedures. No industry-wide standard for plant
    acceptance testing existed in Australia, with multiple different methods available
    (laboratory module tests, capacity tests, performance ratio, energy guarantee).
    The test procedure was not agreed and documented in the contract at the outset.
  lesson_learnt: Agree and append the minimum capacity test procedure to the EPC contract
    before construction commences — using First Solar's internal standard was acceptable
    on this project, but the absence of an industry-wide standard creates risk of
    disputes over acceptance criteria; consider advocating for an ARENA-standardised
    capacity test methodology to ensure consistency and fairness across funded projects.
