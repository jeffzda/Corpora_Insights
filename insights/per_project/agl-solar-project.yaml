- record_id: ARENA-DLV-31763
  source_title: AGL Solar Project Final Report
  publish_date: 2019-06
  project_name: AGL Energy Solar Project (Nyngan and Broken Hill Solar Plants)
  what_happened: Local supply chain for utility-scale solar did not exist in Australia
    prior to the Nyngan and Broken Hill projects. Standard structural components (e.g.
    I-Beam posts) used in the USA could not be sourced locally. Foreign suppliers
    were unfamiliar with Australian Standards and export requirements. Local suppliers
    had higher specification expectations (fully engineered rather than performance
    specifications) requiring more upfront resources.
  lesson_learnt: Establish an in-country supply chain as early as possible for utility-scale
    solar projects — work directly with OEMs for critical equipment and collaborate
    with local suppliers to develop compliant products; build additional upfront engineering
    resource into project plans to accommodate the higher specification expectations
    of Australian suppliers.
  issue_severity: moderate
  project_type: generation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: procurement
  proponent_type: utility/energy retailer
  delay_category: procurement/supply chain
  failure_mode: execution & logistics
  outcome_class: follow-on scale-up enabled
  secondary_failure_mode: poor scoping
  intervention_note: First Solar collaborated with Industry Capability Network (ICN)
    to identify local suppliers, established 2-way knowledge sharing sessions between
    US and local suppliers, and worked with IXL to develop structural components locally
    (102,000 tables fabricated at Geelong).
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id027
  - 126
  evidence_excerpt: Local supply chain is non-existent for standard products in foreign
    markets (e.g. I-Beam posts used in the USA could not be sourced in Australia).
    For imported products, foreign suppliers are often unfamiliar with Australia Standards
    and sometimes with export requirements. Imported products increase lead time and
    shipping costs.
