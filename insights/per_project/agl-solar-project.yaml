  project_name: AGL Energy Solar Project (Nyngan and Broken Hill Solar Plants)
  what_happened: Changes to the Generator Performance Standards (GPS) that affected
    inverter protection settings also flowed through to the PVCS protection schemes,
    requiring coordination with third-party PVCS designers to revise and test relay
    protection settings — a significant project impact not anticipated at design stage.
  lesson_learnt: When GPS requirements change during a project, proactively identify
    and manage the downstream impact on PVCS and other third-party-designed protection
    schemes — coordinate with those parties promptly to revise and retest relay settings
    before commissioning.
