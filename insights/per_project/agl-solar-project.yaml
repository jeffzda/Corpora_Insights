  source_title: AGL Solar Project Final Report
  publish_date: 2019-06
  project_name: AGL Energy Solar Project (Nyngan and Broken Hill Solar Plants)
  what_happened: Community engagement for Nyngan and Broken Hill required substantial,
    ongoing effort from early in the project. The two communities had markedly different
    engagement preferences — Nyngan wanted a formal Community Consultative Committee
    (11 members, regular meetings), while Broken Hill preferred informal information
    sessions. Local police were involved in worker inductions at Broken Hill to set
    expectations. Local employment expectations were high and required dedicated management.
  lesson_learnt: Allocate experienced community engagement personnel to regional solar
    projects from the earliest stage, co-ordinate engagement between owner and contractors,
    and adapt the engagement model to each community — formal consultative committees
    suit some communities while others prefer informal sessions; develop a local employment
    participation plan and engage local employment agencies early to match contractor
    needs with local skills.
