- record_id: ARENA-DLV-31780
  source_title: AGL Solar Project Final Report
  publish_date: 2019-06
  project_name: AGL Energy Solar Project (Nyngan and Broken Hill Solar Plants)
  what_happened: The Nyngan and Broken Hill plants were the first large-scale solar
    plants to connect to the NEM. During commissioning, both plants were located in
    remote areas where the grid was sensitive to plant performance, causing GPS compliance
    tests to occasionally conflict with network stability — in some cases tests could
    not be performed at full range and had to be deferred to periods when the network
    was more robust.
  lesson_warnt: For solar plants connecting to remote, sensitive parts of the network,
    take pre-generation power quality measurements to baseline network conditions;
    engage AEMO and the NSP early to understand which GPS compliance tests can be
    performed at full range and which must be modified or deferred — do not attempt
    to finalise the commissioning test plan without this dialogue.
  lesson_learnt: For solar plants connecting to remote, sensitive parts of the network,
    take pre-generation power quality measurements to baseline network conditions;
    engage AEMO and the NSP early to understand which GPS compliance tests can be
    performed at full range and which must be modified or deferred — do not attempt
    to finalise the commissioning test plan without this dialogue.
  issue_severity: moderate
