- record_id: ARENA-DLV-49951
  source_title: Impact of Temperature on Plant Performance and Overhead Line Design
  publish_date: null
  project_name: AGL Energy Solar Project (Nyngan and Broken Hill Solar Plants)
  what_happened: The EPC contractor's initial design for overhead transmission lines
    at the Nyngan Solar Plant conservatively assumed that peak plant output and maximum
    ambient temperature would occur simultaneously. Engineering review identified
    that PV thermal de-rating means these conditions are unlikely to coincide, allowing
    pole heights to be safely reduced with a resulting cost saving.
  lesson_learnt: When designing overhead transmission lines for solar PV projects,
    do not assume peak plant output coincides with maximum ambient temperature — PV
    thermal de-rating means they are unlikely to co-occur, and designs based on this
    combined worst-case condition will result in unnecessarily tall poles and higher
    construction costs.
  issue_severity: minor
  project_type: generation
  project_scale_band: utility/large-scale
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: AGL and its technical consultant reviewed the EPC contractor's
    calculations and demonstrated through further analysis that design pole heights
    could be safely reduced, yielding a small cost saving.
  transferability: broad
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id079
  - 1
  evidence_excerpt: due to the expected thermal de-rating of PV modules with increasing
    temperature, the maximum plant output was unlikely to occur at the same time as
    maximum ambient temperature. As such, it was determined that the design pole heights
    for Nyngan could be safely reduced, resulting in a small cost savings.
  confidence_note: issue_severity rated minor — the design assumption was caught during
    review before construction and the cost saving, while real, is described as small.
