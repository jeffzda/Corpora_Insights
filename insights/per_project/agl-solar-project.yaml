  publish_date: null
  project_name: AGL Energy Solar Project (Nyngan and Broken Hill Solar Plants)
  what_happened: At Nyngan, no clear mapping existed between the inverter PSS/E simulation
    model settings and the actual firmware settings, meaning it was unclear how to
    configure the inverters to match simulation performance. This gap was only discovered
    during commissioning.
  lesson_learnt: Require the inverter manufacturer to submit the complete firmware
    parameter list alongside a map to corresponding PSS/E model settings as part of
    R1 data submission — this ensures consistency between simulation and actual plant
    performance and reduces the risk of late-stage settings adjustments during commissioning.
