- record_id: ARENA-DLV-8551
  source_title: Definition of Project Scope Between Multiple Contractors
  publish_date: null
  project_name: AGL Energy Solar Project (Nyngan and Broken Hill Solar Plants)
  what_happened: AGL engaged separate EPC contractors to deliver the solar plant assets
    and the grid connection assets at each of the Nyngan and Broken Hill project sites,
    creating technical and scheduling interface risks between the two contractors,
    as well as site access, work health and safety, and commercial risks for the site
    owner.
  lesson_learnt: Where feasible, engage a single EPC contractor to cover both solar
    plant and grid connection scopes — splitting scopes across separate EPCs introduces
    technical interface risks, scheduling dependencies, WHS complications, and higher
    legal and consulting costs from negotiating multiple contracts.
  issue_severity: moderate
  project_type: generation
  project_scale_band: utility/large-scale
  lifecycle_phase: approvals/contracting
  proponent_type: utility/energy retailer
  delay_category: construction/installation
  failure_mode: coordination & stakeholders
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated integration
  intervention_note: null
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id001
  - 1
  evidence_excerpt: splitting the scopes in this introduces technical and scheduling
    interfaces, which add to risks during project delivery... there may be site access
    and work health and safety issues with two contractors working on the same site.
    These issues potentially create commercial risks for the site owner. In addition,
    the legal and technical consulting costs of negotiating separate EPC contracts
    are likely to be more significant than negotiating a single contract.
  confidence_note: issue_severity set to moderate as the document describes risk introduction
    and increased costs/complexity rather than a confirmed schedule or cost overrun
    with a magnitude figure. delay_category set to construction/installation as the
    interface and scheduling risks manifest primarily during that phase.
