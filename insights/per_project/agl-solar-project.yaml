  project_name: AGL Energy Solar Project (Nyngan and Broken Hill Solar Plants)
  what_happened: The original GPS Commissioning Plan misinterpreted inverter availability
    at hold points for the staged commissioning of the solar plant — the plan expected
    full reactive power at 50% active power, but with only half of the inverters online,
    the reactive capability was effectively halved.
  lesson_learnt: When developing the GPS Commissioning Plan for a staged solar plant
    (commissioning block by block), explicitly model inverter availability at each
    hold point — assumptions derived from full-plant specifications will overstate
    reactive capability during partial energisation.
