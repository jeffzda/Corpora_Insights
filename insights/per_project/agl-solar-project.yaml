  source_title: Guide to Transmission Easement - Nyngan Solar Plant
  publish_date: null
  project_name: Nyngan Solar Plant (AGL Energy Solar Project)
  what_happened: Roads and Maritime Services (RMS), as the authority for the Barrier
    Highway state road crossing, does not hold a title over state roads, which prevents
    registration of an easement in their favour. The controlling authority for consent
    was Bogan Shire Council, not RMS.
