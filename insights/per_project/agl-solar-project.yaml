- record_id: ARENA-DLV-43701
  source_title: Guide to Local Supply Chain Issues – Nyngan Solar Plant
  publish_date: null
  project_name: AGL Energy Solar Project – Nyngan Solar Plant
  what_happened: Local Australian supply chains for key utility-scale solar components
    (PV modules, inverters, mounting structures, combiner boxes, cables) were largely
    non-existent at the time of the Nyngan Solar Plant construction, forcing reliance
    on imported products and international suppliers unfamiliar with Australian Standards.
  lesson_learnt: When developing utility-scale solar in Australia, project teams should
    anticipate the absence of a local supply chain for both key and enabling components
    — procurement strategies must account for longer lead times, shipping costs, and
    the need to educate foreign suppliers on Australian Standards compliance.
