  what_happened: A section of the 132kV transmission line traversed Crown land (a
    former stock route in NSW), requiring engagement with NSW Crown Lands to address
    environmental and cultural heritage aspects before the easement could be progressed,
    with Essential Energy completing the Crown land registration component using their
    statutory powers.
  lesson_learnt: Where a transmission line easement crosses Crown land, engage NSW
    Crown Lands early to address environmental and cultural heritage requirements,
    and leverage the NSP's statutory powers to complete Crown land registration —
    attempting to register without the NSP's statutory involvement will likely stall
    the process.
