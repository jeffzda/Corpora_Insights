  source_title: Guide to Labour and Accommodation – Nyngan Solar
  publish_date: null
  project_name: AGL Energy Solar Project (Nyngan Solar Plant)
  what_happened: Solar construction skills and knowledge risked becoming concentrated
    in a small fly-in fly-out labour pool rather than being disseminated across regional
    communities, potentially impeding broader uptake and acceptance of large-scale
    solar in Australia.
  lesson_learnt: Proponents of utility-scale solar in regional areas should invest
    in local skills training and supply-chain localisation — concentrating expertise
    in a FIFO pool slows the development of a broader regional solar workforce and
    may impede future project acceptance and uptake.
