  what_happened: The scope of contestable grid augmentation works — including the
    132kV switchyard, transmission line, and reactive plant gifted to Essential Energy
    — was ultimately directed by the NSP rather than the solar plant owner, and the
    whole-life cost of these assets needed to be borne by the project.
  lesson_learnt: Include the whole-life cost of NSP-directed grid augmentation assets
    (switchyard, overhead lines, reactive plant) in the feasibility study — the solar
    plant owner is obligated to fund and construct infrastructure that will be gifted
    to and operated by the NSP.
