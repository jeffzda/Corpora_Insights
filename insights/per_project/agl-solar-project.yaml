  what_happened: IT infrastructure at Nyngan and Broken Hill was embedded in the commissioning
    buildings, which prevented those buildings from being demobilised until alternative
    IT connections could be constructed — a dependency that was not anticipated at
    the outset and added complexity to demobilisation.
  lesson_learnt: Plan for operational-phase IT infrastructure requirements at the
    outset of construction — embedding operational IT in temporary commissioning buildings
    creates a demobilisation dependency that delays site close-out and adds cost;
    install it once in its permanent location.
  issue_severity: minor
  project_type: generation
