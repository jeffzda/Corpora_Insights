  publish_date: 2019-06
  project_name: AGL Energy Solar Project (Nyngan and Broken Hill Solar Plants)
  what_happened: The construction of large-scale solar in Australia required localising
    international (primarily US and European) standard designs to Australian standards,
    codes, and site conditions, involving coordination between international design
    teams and local subject matter experts. Finding Australian expertise and relevant
    standards for utility-scale solar was challenging at the time, as Australian standards
    existed for large-scale infrastructure but were not specifically tailored to large-scale
    solar.
  lesson_learnt: Factor in the time and cost of site-specific design localisation
    (environmental conditions, transport requirements, soil/hydrology) in project
    planning and cost estimates; combine international solar expertise with local
    engineering firms to achieve code-compliant, cost-effective designs — do not assume
    that international standard designs can be applied directly without localisation.
