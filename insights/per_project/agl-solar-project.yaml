  what_happened: Community and local government preferences on accommodation placement
    (within versus outside town boundaries) varied significantly, and local hotel/motel
    operators had mixed views on long-term tenancies, requiring site-specific negotiation
    to balance economic benefit to local businesses against community amenity impacts.
  lesson_learnt: Engage local government early to canvass community and accommodation-operator
    preferences on non-local worker housing — these preferences are site-specific,
    and local government is best placed to represent community views and optimise
    economic benefit while minimising amenity disruption.
