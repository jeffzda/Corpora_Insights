  what_happened: The National Electricity Rules evolved from Version 59 to Version
    75 over the two-year period spanning the Nyngan and Broken Hill projects, and
    performance criteria in the NER in some instances assumed rotating machinery,
    which did not apply to solar PV inverter-based generation.
  lesson_learnt: Track NER version changes actively throughout the project lifecycle
    and assess their impact on GPS requirements — for template-based renewable projects,
    regulatory evolution between sites can require rework, and NER criteria designed
    for rotating machinery may impose inappropriate requirements on solid-state generation.
