- record_id: ARENA-DLV-31786
  source_title: AGL Solar Project Final Report
  publish_date: 2019-06
  project_name: AGL Energy Solar Project (Nyngan and Broken Hill Solar Plants)
  what_happened: Site selection criteria for utility-scale solar in Australia were
    not well documented at the time of Nyngan and Broken Hill. Secondary site selection
    factors — hydrology (flat, flood-prone land), geology (impacts structure cost),
    flora/fauna (affects layout), access to grid (easement time and effort), road
    access (approval/build time), logistics, labour accommodation, and utilities —
    proved to be material delivery considerations that were not all fully anticipated.
  lesson_learnt: 'Utility-scale solar site selection should explicitly evaluate secondary
    criteria beyond solar resource: hydrology and drainage, geology and soil conditions,
    protected flora/fauna, proximity to grid and transmission easement complexity,
    road access approval requirements, logistics infrastructure, local labour availability,
    and utility access — each can have material schedule and cost implications.'
  issue_severity: minor
