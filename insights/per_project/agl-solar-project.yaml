- record_id: ARENA-DLV-31760
  source_title: AGL Solar Project Final Report
  publish_date: 2019-06
  project_name: AGL Energy Solar Project (Nyngan and Broken Hill Solar Plants)
  what_happened: At Nyngan, heavy rainfall during early works activities — grading
    of the site access road and substation bench — rendered areas inaccessible for
    weeks and caused approximately a two-week delay to full-scale site mobilisation.
    The flat topography of the site exacerbated drainage problems. An accelerated
    project schedule had compressed the front end, meaning key enabling works (access
    road upgrades, water supply) were not completed before site mobilisation began.
  lesson_learnt: Prioritise construction of weatherproof access roads at the very
    start of a solar project to avoid delayed or out-of-sequence equipment delivery
    and potential civil rework; build schedule contingency for wet-weather delays
    on flat, poorly-drained sites; ensure early works (access road, water supply)
    are completed before full site mobilisation commences.
