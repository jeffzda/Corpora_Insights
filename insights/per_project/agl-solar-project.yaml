  source_title: AGL Solar Project Final Report
  publish_date: 2019-06
  project_name: AGL Energy Solar Project (Nyngan and Broken Hill Solar Plants)
  what_happened: AGL engaged separate EPC contractors for the solar plant and the
    grid connection assets at each site. This introduced technical and scheduling
    interface risks between the two contractors, potential WH&S complications with
    two contractors on the same site, and additional commercial and legal costs compared
    with a single EPC arrangement.
  lesson_learnt: For future utility-scale solar projects, consider engaging a single
    EPC contractor across both the solar plant and connection works to reduce technical
    interfaces, scheduling risks, and contracting overhead — though this needs to
    be balanced against contractor capability availability in a limited Australian
    market.
