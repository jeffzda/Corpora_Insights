  what_happened: Operations and maintenance at the remote Nyngan and Broken Hill plants
    were complicated by delays in accessing specialist service providers (one-day
    or more travel time), time-zone differences with international equipment suppliers
    causing response lags, and the need for specific SCADA training for O&M staff.
    Equipment calibration and protection equipment service personnel were not available
    from Australian-based providers.
  lesson_learnt: Plant location critically affects maintenance strategy — for remote
    sites, develop a comprehensive spares holding and in-house maintenance capability,
    select O&M service providers during construction to assess their capability, and
    factor in the time and cost of specialist access when planning maintenance programs.
