  source_title: AGL Solar Project Final Report
  publish_date: 2019-06
  project_name: AGL Energy Solar Project (Nyngan and Broken Hill Solar Plants)
  what_happened: Commissioning of the generating system to AEMO requirements was significantly
    delayed at both Nyngan and Broken Hill due to deficiencies in the inverter PSS/E
    model accuracy, failure to account for the power plant controller's interaction
    with the inverter, and inadequate metering for AEMO validation. Multiple iterations
    of inverter model and firmware were required. At Nyngan, AEMO and Essential Energy
    disagreed over several aspects of the GPS Compliance Test Plan, with resolution
    taking over one month, and a low-load period during commissioning required waiting
    several weeks before some tests could be performed.
  lesson_learnt: Understand AEMO commissioning requirements fully before submitting
    GPS work; develop commissioning and GPS compliance test plans in cooperation with
    the NSP at least three months before commissioning, presenting drafts several
    months before that to allow multiple iterations; hold detailed design review meetings
    with the NSP and AEMO during the modelling stage to ensure consistency between
    the GPS and the intended plant design.
