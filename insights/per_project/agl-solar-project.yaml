  source_title: AGL Solar Project Final Report
  publish_date: 2019-06
  project_name: AGL Energy Solar Project (Nyngan and Broken Hill Solar Plants)
  what_happened: Material delivery for the Nyngan Solar Plant involved complex multi-modal
    logistics (modules and tables by rail and road from Port Adelaide; Power Conversion
    Stations from Newcastle; various other components from global and regional locations).
    Early deliveries were hampered by delays to the completion of the access road
    and the deceleration lane on the Barrier Highway. Australian transport and logistics
    costs were estimated to be 30–50% higher than in the USA.
  lesson_learnt: Optimise material delivery routes early — evaluate multiple port
    options and transport modes (road vs. rail) for each equipment category; ensure
    access road and highway infrastructure are completed before bulk deliveries begin;
    and incorporate Australia's structurally higher transport and logistics costs
    (estimated 30–50% above US benchmarks) into project financial models.
