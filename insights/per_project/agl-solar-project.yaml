  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: First Solar organised two-way knowledge-sharing sessions between
    US suppliers and local Australian suppliers (e.g. IXL/OMCO, Ampcontrol/Fibrebond)
    to localise enabling works and build local capability.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id074
  - 1
