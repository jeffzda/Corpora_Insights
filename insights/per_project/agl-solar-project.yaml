- record_id: ARENA-DLV-31758
  source_title: AGL Solar Project Final Report
  publish_date: 2019-06
  project_name: AGL Energy Solar Project (Nyngan and Broken Hill Solar Plants)
  what_happened: AEMO Generator Registration was more time-consuming and complex than
    anticipated because the NER was written around rotating machinery and did not
    accommodate solid-state (inverter-based) generation. Significant education effort
    was required with regulators, NSPs, and suppliers. The NER had evolved from version
    59 to version 75 over the two-year project, and foreign inverter supplier SMA
    provided power modelling for 60 Hz systems rather than Australia's 50 Hz network.
  lesson_learnt: Allow substantial time and dedicated resources to educate all stakeholders
    — regulators, NSPs, and foreign suppliers — about inverter technology and Australian
    regulatory requirements; confirm that all supplier-provided performance data is
    calibrated for Australian network conditions (50 Hz) before use in studies.
  issue_severity: moderate
  project_type: generation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: approvals/contracting
  proponent_type: utility/energy retailer
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: AGL and Jacobs (Owner's Engineer) drew on prior wind farm inverter
    experience to frame registration; directly educated AEMO and NSP technical assessors
    on inverter technology and solar energy implications.
