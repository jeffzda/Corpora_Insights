  source_title: AGL Solar Project Final Report
  publish_date: 2019-06
  project_name: AGL Energy Solar Project (Nyngan and Broken Hill Solar Plants)
  what_happened: The Nyngan site's remote regional location meant that non-local skilled
    labour had to be sourced and accommodated on site, adding cost. The project required
    up to 250 workers at peak construction; local regional labour could not meet the
    full requirement. Sourcing non-local labour also created accommodation pressure
    and community impacts in the small town of Nyngan.
  lesson_learnt: Factor labour availability and accommodation requirements into cost
    estimates and project planning for regional solar projects — if non-local workers
    are needed, budget for accommodation and mess services, engage local government
    early to understand community preferences, and develop a local employment participation
    plan to manage community expectations.
