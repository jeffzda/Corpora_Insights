  what_happened: SCADA commissioning for both plants required coordination across
    a large number of stakeholders (owner, NSP, AEMO, carriers, installation and commissioning
    subcontractors) with a complex I/O list to be agreed among all parties. Using
    the same contractor at both Nyngan and Broken Hill significantly reduced First
    Solar's internal costs as that contractor was already familiar with the design
    and procedures.
  lesson_learnt: Agree the SCADA I/O list among all stakeholders as early as possible
    and maintain consistency in SCADA system design across sites — using the same
    SCADA contractor on sequential projects materially reduces commissioning cost
    and time by eliminating the learning curve.
