  source_title: Defining Communications Requirements for a New Generator
  publish_date: null
  project_name: AGL Energy Solar Project (Broken Hill Solar Plant)
  what_happened: The Broken Hill Solar Plant required significant upgrades to communications
    infrastructure — over 1,700 km of communication bearers — to support compliant
    communications with the NSP (TransGrid) and AEMO. The scope was initially driven
    by the combined needs of both the solar project and the co-located Silverton Wind
    Farm sharing the same connection point, requiring extensive negotiation before
    a reduced package was agreed for the solar project alone.
  lesson_learnt: Define communications infrastructure requirements between the generation
    facility, the NSP, and AEMO early in the connection process — the physical infrastructure
    required to carry signals can be extensive and costly, and must be captured in
    the project financial model and technical specifications issued to the EPC contractor
    before design is finalised.
