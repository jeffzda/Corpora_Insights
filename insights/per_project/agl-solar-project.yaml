  what_happened: Development and approval of the Generator Performance Standards (GPS)
    took approximately 12 months after the first submission to the NSP — about 6 months
    longer than expected — because the NSP required time to understand inverter technology,
    AEMO sought to expand the scope of technical studies to explore dynamic grid support,
    and First Solar's change of inverter required significant rework. Additional direct
    costs to the proponent were approximately $250,000 per site.
  lesson_learnt: Include responsibility for the final technical studies and GPS within
    the EPC contract scope to eliminate the interface between GPS preparers and the
    inverter supplier; engage AEMO early to gain consensus on GPS inputs; and ensure
    the power plant controller and inverter model are finalised as early as possible
    to avoid delays in GPS approval and registration.
