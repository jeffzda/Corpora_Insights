  what_happened: Inverter manufacturers demonstrated limited knowledge of AEMO's registration
    process and model accuracy requirements. Australia's modelling and validation
    process is significantly more rigorous than most overseas markets, leaving inverter
    suppliers unfamiliar with what was required.
  lesson_learnt: Engage local, suitably experienced consulting firms early in the
    project to bridge the knowledge gap between overseas inverter manufacturers and
    AEMO's rigorous modelling and validation requirements — do not rely on inverter
    supplier familiarity with Australian regulatory requirements.
