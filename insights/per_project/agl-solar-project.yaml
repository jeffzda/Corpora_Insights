  project_name: AGL Energy Solar Project (Nyngan and Broken Hill Solar Plants)
  what_happened: Several project milestones for both Nyngan and Broken Hill were certified
    significantly later than their planned milestone dates. For example, Nyngan's
    detailed engineering design review (NY5) was due 31 October 2013 but certified
    17 February 2014 (3.5 months late); the Nyngan connection agreement (NY6) was
    due 30 November 2013 but certified 27 March 2014 (4 months late); Nyngan practical
    completion (NY10) was due 30 June 2015 but certified 29 September 2015 (3 months
    late). For Broken Hill, BH8 (25% posts) was due 31 October 2014 but certified
    11 March 2015 (~4.5 months late).
  lesson_learnt: When setting milestone dates for a first-of-type utility-scale solar
    project in Australia, build substantial contingency into engineering design, connection
    agreement, and construction milestones — reference-class data from Nyngan and
    Broken Hill shows consistent 3–5 month slippage across design, procurement, and
    construction milestones.
