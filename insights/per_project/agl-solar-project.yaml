  project_name: AGL Energy Solar Project (Nyngan Solar Plant)
  what_happened: Finding suitable Australian expertise and applicable standards for
    utility-scale solar was identified as a significant knowledge gap — existing Australian
    expertise and standards were oriented to large-scale infrastructure generally
    and were not directly applicable to utility-scale solar.
  lesson_learnt: Future utility-scale solar projects in Australia should pair international
    experts with experience in large-scale solar delivery with local engineering firms
    experienced in large infrastructure — neither alone is sufficient to navigate
    Australian standards and site conditions at this scale.
