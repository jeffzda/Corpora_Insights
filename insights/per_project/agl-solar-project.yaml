  what_happened: Australia had minimal experience in utility-scale solar delivery
    at the time of Nyngan and Broken Hill. Key areas — module/inverter supply, construction
    management, commissioning, and O&M — relied on international (primarily US) knowledge
    and personnel. Over ten local contractors visited the Nyngan site before tendering
    for Broken Hill to build their capability and confidence.
  lesson_learnt: When delivering a first-of-type project in Australia, explicitly
    plan for international knowledge transfer including site visits for local contractors,
    targeted skills transfer for construction management and commissioning, and local
    staff rotations to international facilities — this accelerates the development
    of domestic capability and reduces unit costs for subsequent projects.
