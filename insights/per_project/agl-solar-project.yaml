- record_id: ARENA-DLV-18651
  source_title: Guide to Labour and Accommodation – Nyngan Solar
  publish_date: null
  project_name: AGL Energy Solar Project (Nyngan Solar Plant)
  what_happened: Construction of the Nyngan Solar Plant required a peak workforce
    of up to 250 people, and the regional location could not supply sufficient skilled
    and unskilled labour locally, necessitating sourcing of non-local workers and
    provision of temporary accommodation and mess facilities.
  lesson_learnt: Project planning and cost estimates for utility-scale solar in regional
    areas must account for non-local labour requirements — factor in quantity and
    duration of non-local workers, transport, local accommodation availability, and
    the cost of temporary accommodation and mess services, which materially increase
    project cost.
  issue_severity: moderate
  project_type: generation
  project_scale_band: utility/large-scale
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: procurement/supply chain
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: execution & logistics
  intervention_note: First Solar conducted a formal subcontractor roadshow in 2013,
    placed advertisements in local news sources, engaged directly at the Nyngan Agricultural
    Show, and ran a competitive tender for temporary accommodation facilities and
    major subcontracting packages.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id002
  - 1
  - 2
  evidence_excerpt: Site locations in regional areas such as Nyngan are not always
    able to meet the full labour requirements and non-local labour must be sourced
    to add to the local workforce.
  confidence_note: issue_severity set to moderate as non-local labour and accommodation
    requirements materially increased project cost but did not prevent delivery; delay_magnitude
    marked not quantified as no schedule impact duration is stated.
