  what_happened: Significant value was demonstrated through upfront logistics planning
    at both Nyngan and Broken Hill — directly staging posts, tables, and other structural
    materials adjacent to the work zones (rather than from a central stores area)
    reduced internal transport movements and improved installation efficiency. At
    Broken Hill the undulating landscape required switching from tele-handlers to
    side-loading forklifts to avoid workers manually handling heavy tables.
  lesson_learnt: Invest in detailed upfront transportation and logistics planning
    for large solar sites, including planning for direct delivery of equipment to
    work zones; adapt material-handling machinery to site topography rather than applying
    a standard approach — this meaningfully reduces installation time and rework.
