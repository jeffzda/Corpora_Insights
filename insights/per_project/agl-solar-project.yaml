- record_id: ARENA-DLV-31751
  source_title: AGL Solar Project Final Report
  publish_date: 2019-06
  project_name: AGL Energy Solar Project (Nyngan and Broken Hill Solar Plants)
  what_happened: Grid connection modelling for the Nyngan and Broken Hill solar plants
    required extensive, iterative technical studies to define Generator Performance
    Standards (GPS). The EPC contractor (First Solar) changed the inverter model after
    AGL had already completed connection studies based on a different inverter, requiring
    the modelling to be redone and causing additional cost and delay in finalising
    connection arrangements.
  lesson_learnt: Definitively select an inverter model before conducting grid connection
    studies — if the EPC contractor changes the inverter after studies are complete,
    all technical modelling must be redone, incurring additional cost and schedule
    delay. Consider including inverter selection and associated GPS modelling within
    the EPC contract scope to eliminate unnecessary interfaces.
  issue_severity: moderate
  project_type: generation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: grid connection/system studies
  failure_mode: unvalidated integration
  outcome_class: delayed but recoverable
  secondary_failure_mode: poor scoping
  intervention_note: AGL engaged a technical consultant to redo the grid modelling
    using the revised inverter characteristics, allowing connection arrangements to
    be finalised.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id015
  - 98
  evidence_excerpt: Unfortunately, First Solar elected to use a different inverter
    than the one that AGL had used in the earlier connection studies. Because the
    performance characteristics of the two inverters were slightly different, AGL
    was required to redo the technical modelling to define plant performance. AGL
    engaged a technical consultant to conduct the grid modelling, and this additional
    modelling incurred extra cost as well as a delay in finalising project connection
    arrangements.
