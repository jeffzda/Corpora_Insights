  what_happened: Local Australian suppliers engaged on the Nyngan Solar Plant were
    unfamiliar with the technical requirements of utility-scale solar farms, and had
    a higher expectation of specification detail — requiring fully engineered design
    specifications rather than performance specifications — which consumed additional
    time and resources early in the project.
  lesson_learnt: When engaging local Australian suppliers for utility-scale solar,
    budget additional time and resources upfront to develop fully engineered design
    specifications; local suppliers are unlikely to accept performance-specification-only
    documents and will require more detailed engineering input than counterparts in
    established solar markets such as the US.
