  source_title: AGL Solar Project Final Report
  publish_date: 2019-06
  project_name: AGL Energy Solar Project (Nyngan and Broken Hill Solar Plants)
  what_happened: The overhead transmission line design for Nyngan initially assumed
    that peak solar plant output would coincide with maximum ambient temperature,
    requiring conservatively tall poles. Further analysis showed that PV module thermal
    de-rating means peak output is unlikely to coincide with maximum temperature,
    allowing design pole heights to be safely reduced with a resulting cost saving.
  lesson_learnt: When designing overhead transmission lines for solar projects, do
    not default to the conservative assumption that peak plant output and maximum
    ambient temperature occur simultaneously — detailed thermal analysis of PV module
    de-rating characteristics can justify reduced pole heights and meaningful construction
    cost savings.
