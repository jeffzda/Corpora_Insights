  source_title: AGL Solar Project Final Report
  publish_date: 2019-06
  project_name: AGL Energy Solar Project (Nyngan and Broken Hill Solar Plants)
  what_happened: 'Operability and maintainability analysis after plant commissioning
    identified several design aspects that impeded O&M access: dust ingress into switchgear
    rooms, inadequate all-weather road access, and underground HV cables between blocks
    and the PVIS that are invisible and difficult to diagnose faults on. The Nyngan
    roller-door PVCS design was found to be inferior to the Broken Hill hinged-door
    design for dust protection.'
  lesson_learnt: Embed O&M requirements into the plant design from the outset — specify
    all-weather road access to equipment, sealed (hinged-door) enclosures for switchgear
    to prevent dust ingress, and consider overhead HV lines between blocks and the
    PVIS rather than underground cables to ease fault identification and maintenance.
