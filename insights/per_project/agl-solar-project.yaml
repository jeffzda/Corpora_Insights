  publish_date: null
  project_name: AGL Energy Solar Project (Nyngan and Broken Hill Solar Plants)
  what_happened: First Solar contracted a local consultant to assist with AEMO commissioning
    compliance, but the full scope of AEMO requirements was not understood in the
    early stages, leading to gaps later. Deficiencies in the inverter PSS/E model
    accuracy — including failure to account for the power plant controller's impact
    on plant response — only became apparent once commissioning began, causing extensive
    delays through multiple iterations of the inverter model and firmware.
  lesson_learnt: Secure a thorough understanding of AEMO's modelling and validation
    requirements before any Generator Performance Standards work is submitted, and
    hold detailed design review meetings with the NSP and AEMO during the modelling
    stage — inverter model deficiencies discovered during commissioning require multiple
    firmware and model iterations that cause extensive schedule delays.
