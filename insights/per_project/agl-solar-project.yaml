  source_title: Grid Connection Modelling to Define Solar Plant Performance Characteristics
  publish_date: null
  project_name: AGL Energy Solar Project (Nyngan and Broken Hill Solar Plants)
  what_happened: AGL Energy faced technically and commercially challenging grid connection
    negotiations with Essential Energy (NSP) for the Nyngan solar plant, requiring
    extensive iterative modelling across multiple connection studies to determine
    the amount and location of additional reactive plant needed to support network
    voltage stability during fault events.
  lesson_learnt: Engage early and often with the relevant NSP to define commercial
    and technical grid connection requirements — defining reactive plant requirements
    through multiple connection studies is time-consuming and iterative, so establishing
    a program of regular meetings with the NSP to review technical study progress
    and commercial arrangements reduces rework and delays.
