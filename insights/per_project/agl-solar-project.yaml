  source_title: AGL Solar Project Final Report
  publish_date: 2019-06
  project_name: AGL Energy Solar Project (Nyngan and Broken Hill Solar Plants)
  what_happened: During civil works at Nyngan, above-average rainfall severely impacted
    construction activities, the schedule, and the budget. The flat site had minimal
    drainage fall, causing materials deliveries, internal transportation, and use
    of heavy tracked equipment and trenchers to be delayed until saturated ground
    dried out. Civil costs at both Nyngan and Broken Hill exceeded $10 million despite
    the civil package representing less than 10% of the total contract price.
  lesson_learnt: Upfront design of mounting structures and layout to suit local topography
    can significantly reduce civil works cost; prioritise weatherproof access roads
    from the start; and recognise that on flat, large-area solar sites, civil costs
    can be material even if a small share of contract value — plan and budget accordingly.
