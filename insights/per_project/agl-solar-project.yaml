  what_happened: The Nyngan and Broken Hill solar plants were the first utility-scale
    solar projects connected to the Australian National Electricity Market (NEM),
    and there was no pool of experienced operators available, nor any third-party
    training providers offering solar plant operator training. First Solar had to
    develop operator training in-house and recruit from construction and commissioning
    personnel.
