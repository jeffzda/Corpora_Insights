  what_happened: The capacity test procedure used at Nyngan and Broken Hill was a
    standardised First Solar procedure, but industry-wide procedures for confirming
    installed capacity of solar plants vary, with multiple methods available (laboratory
    module tests, capacity test, performance ratio, energy guarantee). No Australian
    standard existed at the time.
  lesson_learnt: Agree the minimum capacity test procedure between the owner/developer
    and the Principal Contractor and append it to the contract — industry variation
    in capacity test methods creates ambiguity about what constitutes satisfactory
    performance if not contractually specified.
