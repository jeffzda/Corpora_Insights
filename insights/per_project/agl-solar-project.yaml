  project_name: AGL Energy Solar Project (Nyngan and Broken Hill Solar Plants)
  what_happened: At Nyngan, inverter commissioning revealed that a clear map between
    the inverter PSS/E model settings and the actual firmware settings did not exist,
    meaning it was unclear how to configure the inverters to match simulation performance.
    This created a significant gap between modelled and actual plant behaviour that
    had to be resolved during commissioning.
  lesson_learnt: Require the inverter manufacturer to submit the complete firmware
    parameter list alongside the R1 data, together with a map to corresponding PSS/E
    model settings, before commissioning begins — this ensures consistency between
    simulation and actual plant performance and reduces the risk of needing settings
    adjustments mid-commissioning.
