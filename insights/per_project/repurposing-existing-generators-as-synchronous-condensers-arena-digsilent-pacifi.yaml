- record_id: ARENA-DLV-50956
  source_title: Repurposing Existing Generators as Synchronous Condensers
  publish_date: 2023-06
  project_name: Repurposing Existing Generators as Synchronous Condensers (ARENA/DIgSILENT
    Pacific Study)
  what_happened: Operating a large repurposed synchronous condenser (e.g., a 600 MVA
    unit) incurs electrical losses of 1–2% of rating (6–12 MW) plus auxiliary loads,
    resulting in indicative annual energy costs of approximately AUD $6M at average
    NEM prices of $100/MWh, with exposure to market cap prices potentially reaching
    $150k per hour — a significant commercial risk that asset owners are unwilling
    to bear unhedged.
  lesson_learnt: Commercial arrangements for repurposed synchronous condensers must
    explicitly address energy consumption and market price exposure for losses and
    auxiliary loads — options include pass-through of energy costs to the TNSP, TNSP
    ownership of the asset, or incorporation of SC energy consumption into marginal
    loss factors, as unhedged market exposure at scale is likely to make offers commercially
    unviable.
  issue_severity: major
  project_type: network/grid
  project_scale_band: utility/large-scale
  lifecycle_phase: approvals/contracting
  proponent_type: utility/energy retailer
  delay_category: financing/commercial close
  failure_mode: commercial & market
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: 'Report identifies three management options: pass-through of
    energy costs to TNSP, TNSP ownership of the asset, or incorporation of SC losses
    into marginal loss factors — noting that TNSP-owned SVCs and SCs in South Australia
    already use the marginal loss factor approach.'
  transferability: moderate
