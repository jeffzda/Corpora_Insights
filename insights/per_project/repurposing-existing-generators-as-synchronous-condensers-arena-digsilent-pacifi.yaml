  what_happened: A life-cycle cost analysis (referenced from Wang et al., 2022) found
    that the total cost of ownership for a thermal unit converted to a synchronous
    condenser is lower than a purpose-built SC when the remaining plant life is 15
    or more years, supporting the economic case for repurposing — but this conclusion
    is sensitive to the specific plant context and may not apply universally.
  lesson_learnt: Business cases for generator-to-synchronous-condenser conversion
    should use a life-cycle cost framework that includes the initial investment, conversion
    costs, and ongoing maintenance costs compared against new-build alternatives —
    conversions become more competitive relative to new-build SCs when remaining plant
    life exceeds 15 years, but the urgency to deliver services quickly may justify
    less cost-competitive conversions that offer faster lead times.
