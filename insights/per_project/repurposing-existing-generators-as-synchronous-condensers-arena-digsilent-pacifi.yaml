  project_name: Repurposing Existing Generators as Synchronous Condensers (ARENA/DIgSILENT
    Pacific Study)
  what_happened: AEMO's December 2022 system strength report indicated that approximately
    40 synchronous condensers of 125 MVA each (5,000 MVA total) may be required under
    a 100% renewables scenario, while Transgrid's EOI indicated a need for 20 SCs
    in NSW by 2025 and 29 by 2032–33 — creating large, urgent, and sustained demand
    for synchronous condenser capacity that existing supply chains and new-build timelines
    cannot satisfy.
  lesson_learnt: System strength and inertia service procurement should be treated
    as a long-lead infrastructure challenge requiring immediate action — the scale
    of requirement (40+ SCs nationally) combined with new-build lead times of 30+
    months and growing global demand makes it near-certain that NEM-wide requirements
    cannot be met through new-build SCs alone; repurposing and alternative pathways
    must be pursued in parallel without delay.
