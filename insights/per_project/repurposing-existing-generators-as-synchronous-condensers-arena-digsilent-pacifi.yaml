- record_id: ARENA-DLV-50971
  source_title: Repurposing Existing Generators as Synchronous Condensers
  publish_date: 2023-06
  project_name: Repurposing Existing Generators as Synchronous Condensers (ARENA/DIgSILENT
    Pacific Study)
  what_happened: The absence of a transparent market price or signal for inertia services
    in the NEM means that asset owners cannot assess whether the additional cost of
    retaining or adding inertia (e.g., via de-blading instead of full turbine decoupling,
    or adding a flywheel) is commercially justified, creating a barrier to inertia-maximising
    conversion choices.
  lesson_learnt: TNSPs or AEMO should publish indicative inertia valuations (in AUD/MWs)
    to enable asset owners to evaluate the commercial case for inertia-retaining conversion
    configurations; without this signal, asset owners will default to lower-cost conversion
