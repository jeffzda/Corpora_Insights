- record_id: ARENA-DLV-50957
  source_title: Repurposing Existing Generators as Synchronous Condensers
  publish_date: 2023-06
  project_name: Repurposing Existing Generators as Synchronous Condensers (ARENA/DIgSILENT
    Pacific Study)
  what_happened: Repurposed generators operating as synchronous condensers require
    significantly more intensive ongoing staffing and maintenance than purpose-built
    automated synchronous condensers — including specialist skills for hydrogen cooling,
    turbine shafts, complex lubrication systems, and ageing secondary plant — because
    the converted plant was not designed for SC operation and retains legacy systems.
  lesson_learnt: Operating expenditure for a repurposed synchronous condenser will
    be materially higher than for a purpose-built SC; project proponents must model
    O&M costs including specialist staffing for legacy systems in their business cases
    and contract structures, as the net present value of higher opex may offset capital
    cost savings from conversion versus new-build.
  issue_severity: moderate
  project_type: network/grid
  project_scale_band: utility/large-scale
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Additional capex to automate plant systems can reduce ongoing
    staffing requirements and opex, partially closing the gap with purpose-built SC
    operating costs.
  transferability: moderate
  delay_magnitude: null
  technology_domain: grid/system stability
  source_pages: &id007
  - 17
  - 27
  - 31
  evidence_excerpt: 'The key point is the workforce needed to maintain and operate
    a repurposed SC will be significantly larger and require a broader skill base
    that a purpose-built SC, which is likely to be fully automated with no full-time
    O&M staff... The opex costs, excluding the energy costs, are expected to be significantly
    higher than a purpose-built SC because: The auxiliaries require greater intervention
    on an old power station, More staff is required to maintain and support the older
    auxiliary equipment, and The site will be larger with associated higher costs.'
