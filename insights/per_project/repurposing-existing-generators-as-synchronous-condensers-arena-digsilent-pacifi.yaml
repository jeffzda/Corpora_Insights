- record_id: ARENA-DLV-50954
  source_title: Repurposing Existing Generators as Synchronous Condensers
  publish_date: 2023-06
  project_name: Repurposing Existing Generators as Synchronous Condensers (ARENA/DIgSILENT
    Pacific Study)
  what_happened: Repurposing a steam turbine generator as a synchronous condenser
    by decoupling the turbine reduces inertia to approximately one-third of the combined
    generator-turbine value (e.g., from a 4.5s inertia time constant to approximately
    1.5s), which materially reduces the inertia service the converted plant can deliver.
  lesson_learnt: When planning steam turbine-to-synchronous-condenser conversions,
    the inertia trade-off between decoupling (reduces to ~1/3 of original) and de-blading
    (retains ~75% of original) must be quantified against the contracted inertia requirement
    — the conversion approach chosen directly determines the inertia value of the
    asset.
  issue_severity: moderate
  project_type: network/grid
  project_scale_band: utility/large-scale
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: De-blading the turbine retains approximately 70% of original
    combined inertia (~3.5s versus original 4.5s), offering a better inertia outcome
    than full turbine decoupling where only generator inertia is retained.
  transferability: moderate
  delay_magnitude: null
  technology_domain: grid/system stability
  source_pages: &id004
  - 13
  - 14
  evidence_excerpt: Disconnecting the turbine, the inertia of the generator alone
    is likely to be about one third of the combined generator and turbine... The net
    reduction in inertia from de-blading is thought to be of the order of 30%. So,
    in the example previously, the generator inertia is around 1.5s, the turbine with
    blades is around 3s, and debladed about 2s. The net inertia would reduce from
    4.5s to about 3.5s.
