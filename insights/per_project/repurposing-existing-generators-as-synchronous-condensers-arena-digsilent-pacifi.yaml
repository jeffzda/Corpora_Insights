- record_id: ARENA-DLV-50978
  source_title: Repurposing Existing Generators as Synchronous Condensers
  publish_date: 2023-06
  project_name: Repurposing Existing Generators as Synchronous Condensers (ARENA/DIgSILENT
    Pacific Study)
  what_happened: Contract terms for repurposed synchronous condenser services were
    consistently assessed during stakeholder consultations as needing to be approximately
    10 years to allow capital costs of conversion to be recovered along with a reasonable
    return on investment; shorter contracts would require accelerated cost recovery
    and therefore higher annualised charges.
  lesson_learnt: TNSPs designing procurement contracts for repurposed synchronous
    condensers should plan for contract terms of approximately 10 years — this is
    the minimum duration at which asset owners can recover conversion capital costs
    at commercially viable service prices; shorter contracts will either not attract
