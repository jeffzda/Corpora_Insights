  source_title: Repurposing Existing Generators as Synchronous Condensers
  publish_date: 2023-06
  project_name: Repurposing Existing Generators as Synchronous Condensers (ARENA/DIgSILENT
    Pacific Study)
  what_happened: Purpose-built synchronous condensers are limited in size to approximately
    200–250 MVA by air-cooling capability; larger NEM generators proposed for repurposing
    (e.g., Eraring, Bayswater, Mt Piper at ~770–800 MVA) are several times this size,
    meaning a single repurposed large generator can substitute for five or more purpose-built
    SCs in terms of MVA rating.
  lesson_learnt: When comparing repurposed generators against purpose-built synchronous
    condensers, system planners should assess on a like-for-like MVA basis — a single
    large retiring generator (750+ MVA) may deliver equivalent or greater system strength
    than five 125 MVA purpose-built SCs, substantially reducing the number of sites,
    connection processes, and procurement events required.
