- record_id: ARENA-DLV-50953
  source_title: Repurposing Existing Generators as Synchronous Condensers
  publish_date: 2023-06
  project_name: Repurposing Existing Generators as Synchronous Condensers (ARENA/DIgSILENT
    Pacific Study)
  what_happened: Adding a flywheel to an existing large generator shaft (300–800 MVA)
    for inertia retention requires foundation modifications, new or modified bearings,
    shaft modifications, and bespoke design — with lead times up to 48 months for
    larger units — making retrofitted flywheel installations significantly more complex
    and costly than flywheel additions to purpose-built synchronous condensers.
  lesson_learnt: All new-build synchronous condensers should be specified with flywheels
    at the outset, as the incremental cost is modest (~$91k/100 MWs on a 1,100 MWs
    flywheel); retrofitting a flywheel to an existing large generator is a major engineering
    undertaking with lead times up to 48 months and materially higher per-MWs costs
    due to bespoke design and foundation works.
  issue_severity: major
  project_type: network/grid
  project_scale_band: utility/large-scale
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: construction/installation
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Report recommends that all new-build SCs be fitted with flywheels
    as a standard specification, given the relatively low incremental cost compared
    with retrofit.
  transferability: moderate
  delay_magnitude: 1-3 years
  technology_domain: grid/system stability
  source_pages: &id003
