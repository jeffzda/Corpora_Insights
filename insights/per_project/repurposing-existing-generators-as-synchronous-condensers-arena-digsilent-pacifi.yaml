  what_happened: Asset owners are reluctant to offer repurposed synchronous condenser
    services under contracts that do not include availability payments, given that
    TNSPs may not dispatch the SC continuously and the asset owner will still bear
    standing costs; without an availability payment structure, the commercial case
    for conversion does not close.
  lesson_learnt: Contracts for synchronous condenser services from repurposed generators
    must include both an availability component (to cover capital cost recovery and
    fixed O&M) and a usage component (to cover variable costs); TNSP procurement processes
    that rely solely on usage-based payments will not attract offers from asset owners
    facing significant upfront conversion and ongoing fixed costs.
