  source_title: Repurposing Existing Generators as Synchronous Condensers
  publish_date: 2023-06
  project_name: Repurposing Existing Generators as Synchronous Condensers (ARENA/DIgSILENT
    Pacific Study)
  what_happened: A gas turbine synchronous condenser can switch from SC mode back
    to generator mode only after the SC is disconnected, run down, and restarted using
    the normal generator start procedure — a process that typically takes approximately
    30 minutes, limiting the responsiveness of gas turbine SCs for emergency generation
    dispatch.
  lesson_learnt: System planners and TNSPs procuring gas turbine synchronous condenser
    services should account for the approximately 30-minute mode-switching time from
    SC to generator operation in their security analysis — this is not an instantaneous
    transition and has implications for emergency generation dispatch in the event
    of an unexpected supply shortfall.
