  what_happened: Repurposed generators operating as synchronous condensers at retiring
    coal and gas sites will have higher forced outage rates than purpose-built SCs
    because the rotating plant and connection assets are at or near end of design
    life (typically 30–40 years), increasing the risk of major failures with long
    repair times.
  lesson_learnt: TNSP procurement frameworks for repurposed synchronous condensers
    must include availability incentive mechanisms (rebates on availability payments
    for periods of unavailability) and require asset owners to conduct detailed risk
    assessments including expected cost of failure events — the efficient level of
    service procured must provide redundancy headroom to account for higher forced
    outage rates from aged plant.
