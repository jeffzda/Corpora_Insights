  what_happened: There are no completed precedents for the conversion of large fossil-fuelled
    generators (>100 MVA) to synchronous condensers in Australia, meaning conversion
    costs, lead times, and technical risks are poorly understood and highly uncertain
    for both asset owners and regulators.
  lesson_learnt: Before any generator repurposing project can be offered in a security
    service tender, a site-specific feasibility study costing approximately AUD $250–500k
    and taking 6–12 months is essential — cost estimates cannot be reliably generalised
    across sites even between generators of the same rating and manufacturer.
