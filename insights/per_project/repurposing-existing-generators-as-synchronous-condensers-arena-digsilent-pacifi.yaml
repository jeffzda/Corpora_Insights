  what_happened: OEMs now recommend that every new gas-fired generation project be
    either installed with a synchro-self-synchronising (SSS) clutch or designed with
    sufficient space and shaft provisions to allow future clutch installation, in
    anticipation of potential SC conversion — a design-stage decision that is significantly
    less costly than retrofitting a clutch to an existing machine without such provisions.
  lesson_learnt: All new gas turbine generation projects should be designed to accommodate
    a SSS clutch from the outset — whether installed immediately or reserved for future
    installation — as the incremental design cost at greenfield stage is low and avoiding
    a retrofit avoids the significant civil and mechanical works (3–5m shaft extension,
    foundation modification) required when adding a clutch to an existing machine.
