- record_id: ARENA-DLV-50951
  source_title: Repurposing Existing Generators as Synchronous Condensers
  publish_date: 2023-06
  project_name: Repurposing Existing Generators as Synchronous Condensers (ARENA/DIgSILENT
    Pacific Study)
  what_happened: Global demand for large synchronous condensers (>100 MVA) is driving
    delivery times from approximately 18 months to 30+ months after order placement,
    creating a supply bottleneck that threatens Australia's ability to meet AEMO-declared
    system strength and inertia shortfalls within the next five to ten years.
  lesson_learnt: Procurers of synchronous condensers should not assume historical
    delivery timelines will hold — order placement to delivery is now 30+ months and
    lengthening; procurement planning for grid security services must begin well before
    the service is needed to avoid AEMO-imposed operational constraints.
