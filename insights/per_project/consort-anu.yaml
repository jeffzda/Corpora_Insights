- record_id: ARENA-DLV-64420
  source_title: Distributed Energy Resources (DER) Integration Project Contribution Assessment
  publish_date: 2019-03
  project_name: CONSORT (ANU)
  what_happened: The CONSORT project ($2.89m, commenced January 2016) on Bruny Island deployed up to 35 PV and battery systems using Reposit Power's GridCredits platform to provide network support on the
    constrained undersea cable feeding the island, while a social science component conducted interviews and energy diaries with participants over two years to understand customer experience with DER technology.
  lesson_learnt: Including a longitudinal social research component (interviews, diaries) in DER trials generates customer experience data that is rarely available in technical-only projects — this evidence
    on customer acceptance and preferences is directly transferable to commercial DER offer design for future deployments.
