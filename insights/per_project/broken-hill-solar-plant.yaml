  project_name: Broken Hill Solar Plant
  what_happened: AGL Energy developed the Broken Hill Solar Plant (AUD 150M) as one of Australia's first utility-scale solar projects under the Solar Flagships program, providing practical experience to
    local and state planning agencies, AEMO, investors and financiers with this project type — explicitly reducing perceived risk for subsequent utility-scale solar projects.
  lesson_learnt: The primary delivery value of first-of-type utility-scale solar projects in a new jurisdiction is not just the electricity generated but the institutional learning and risk-familiarity
    they create for regulators, planners, network operators and financiers — this should be explicitly recognised and funded as a public good.
