  evidence_excerpt: Building the first few utility scale projects on the NEM is important to prove that these plants can be developed and implemented at this scale, which will develop investor and financier
    understanding of this market, and reduce their perceived risk of this scale of project. Various stakeholders in the development process (including local and state government planning agencies and the
    network operator AEMO) also gained familiarity with this type of project through implementation of the Broken Hill plant.
