  source_title: Ballarat Battery Energy Storage System Final Report
  publish_date: 2021-10
  project_name: Ballarat Battery Energy Storage System
  what_happened: The SoC restriction limiting the system to a maximum of 75% SoC,
    combined with a contractual maximum average annual SoC of 41% and a maximum of
    14 continuous hours above 50% SoC, constrained the trading strategy and reduced
    availability. Excluding the SoC restriction, system availability would have been
    approximately 97.92% across Contract Years 1 and 2 versus the achieved 89.89%.
  lesson_learnt: Battery system design and operational contracts should explicitly
    model the interaction between OEM-imposed SoC operating limits, cycling constraints,
    and market trading strategies — the Ballarat SoC restrictions reduced availability
    by approximately 8 percentage points and materially constrained the trading optimisation.
