  source_title: 'Ballarat BESS: Knowledge Sharing Report'
  publish_date: '2019-08-07'
  project_name: Ballarat Terminal Station (BATS) BESS
  what_happened: The National Electricity Rules clauses covering reactive power capability,
    active power dispatch, reactive power dispatch, voltage control, power factor
    control, and frequency control were not clearly structured for assets operating
    as both generator and load simultaneously, requiring interpretation and potentially
    requiring future NER review to provide clarity for BESS assets.
  lesson_learnt: BESS projects registered as both generator and load should anticipate
    ambiguity in NER clauses that were drafted for conventional generation only —
    engage early with AEMO on which clauses apply in each operating mode, and advocate
    for NER clarification where dual-mode operation creates compliance uncertainty.
