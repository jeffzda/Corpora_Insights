- record_id: ARENA-DLV-38656
  source_title: Ballarat Battery Energy Storage System Revenue Report
  publish_date: 2021-05
  project_name: Ballarat Battery Energy Storage System
  what_happened: Although the Ballarat System's inverters are technically capable
    of providing Voltage Control Ancillary Services (VCAS), the Ballarat Terminal
    Station location did not require VCAS because it is a relatively strong part of
    the network for voltage control. As a result, this revenue stream was not accessible
    to the project.
  lesson_learnt: Site selection for a BESS targeting VCAS non-market revenue must
    be in a network location where voltage support is actually required — a technically
    capable system located at the wrong node cannot access this revenue stream regardless
    of its inverter capabilities.
