  what_happened: The Ballarat System generated approximately 90% of its market revenue
    from FCAS markets over the first two years of operation, far exceeding the initial
    business case expectations which were primarily built around energy arbitrage.
    FCAS revenue totalled approximately $5.2M in 2019 and $6.3M in 2020 against net
    pre-tax revenues of $6.1M and $6.6M respectively.
