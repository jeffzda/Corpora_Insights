  source_title: Ballarat Battery Energy Storage System Revenue Report
  publish_date: 2021-05
  project_name: Ballarat Battery Energy Storage System
  what_happened: AEMO's NEM market frameworks did not include a Contingency Fast Frequency
    Response (FFR) product at the time of the report. The Ballarat System was technically
    capable of responding in 150 milliseconds but could only access the standard 6-second
    contingency FCAS market, leaving significant potential value unrealised.
  lesson_learnt: Market framework gaps can prevent technically capable BESS assets
    from monetising their fastest response capabilities — project developers and industry
    bodies should engage with AEMO to develop FFR market products, as analogous products
    in Ireland's DS3 program demonstrated payment multiples up to 3x for sub-150ms
    response.
