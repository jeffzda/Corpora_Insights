- record_id: ARENA-DLV-0558
  source_title: 'Ballarat BESS: Knowledge Sharing Report'
  publish_date: '2019-08-07'
  project_name: Ballarat Terminal Station (BATS) BESS
  what_happened: The consortium developed a novel contracting model to accommodate
    multiple funding partners (Victorian Government, ARENA), asset owner (AusNet Services)
    and market intermediary (Energy Australia) within a single contractual wrapper.
    The deregulated market context, BESS performance guarantees new to Australian
    utilities, and non-standard contract structures added significant time pressure.
  lesson_learnt: BESS projects with co-funding from government, an asset owner, and
    an energy retailer require a bespoke contract model to be designed from the outset
    — standard EPC or D&C models are not adequate for wrapping performance guarantees
    across multiple principals; allow additional time in the development programme
