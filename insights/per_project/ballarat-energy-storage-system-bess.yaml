- record_id: ARENA-DLV-0556
  source_title: 'Ballarat BESS: Knowledge Sharing Report'
  publish_date: '2019-08-07'
  project_name: Ballarat Terminal Station (BATS) BESS
  what_happened: Prior to BATS BESS, AEMO's Generator Performance Standards (GPS)
    did not consider the possibility of standalone energy storage assets. The GPS
    framework was designed for rotating machines and did not account for BESS characteristics
    such as variable ramp rates settable down to millisecond range, creating ambiguity
    about which ramp rate settings applied and who was responsible for setting them.
  lesson_learnt: Standalone BESS projects connecting to the transmission network should
    anticipate that GPS frameworks were designed for rotary machines and will require
    interpretation or negotiation with AEMO for static inverter-based systems — engage
    AEMO during design to clarify ramp rate and performance standard requirements
    before finalising system settings.
  issue_severity: moderate
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated integration
  intervention_note: Due to the tight timeframe, elements of registration were completed
    in parallel with financing and construction; AEMO allowed Spotless/Downer to submit
    individual clauses rather than a single submission.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id006
  - 38
  - 51
  evidence_excerpt: Prior to the BATS BESS deployment, the AEMO - GPS standards did
    not consider the possibility of standalone energy storage assets. Due to the nature
    of BESS (-i.e. static inverter vs rotary machines-) there was a confusion regarding
    who sets the BESS system ramp rate. The AEMO rules did not consider that ramp
    rate as a variable for BESS's.
