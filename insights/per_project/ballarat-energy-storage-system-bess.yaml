  project_name: Ballarat Battery Energy Storage System
  what_happened: During early operations, parasitic loads drained battery energy during
    extended periods when the system was not in active use, reducing available state
    of charge and interfering with daily trading operations.
  lesson_learnt: Account for parasitic loads in battery system design and operational
    procedures — idle-period energy drain can deplete SoC below minimum thresholds;
    implement automatic software-based SoC management to prevent parasitic loads from
    interfering with daily dispatch obligations.
