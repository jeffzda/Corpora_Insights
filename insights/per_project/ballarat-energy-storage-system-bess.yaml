    a precautionary and temporary modification (Modification) to system operational
    parameters such that the battery modules in the system did not exceed a maximum
    SoC of 75% of the rated system nameplate. This Modification was recommended by
    Fluence following a safety event at a U.S.-based storage facility... Several steps
    were taken that enabled the SoC restriction to be removed in September 2019 and
    the system returned to normal operations. The impact of the Modification, while
    it was in effect, was reduced availability of the Ballarat System for trading
    purposes relative to the SoC reduction.
