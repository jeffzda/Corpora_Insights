  project_name: Ballarat Terminal Station (BATS) BESS
  what_happened: AEMO's MASS tool for FCAS used a fixed ramp-rate approach prior to
    BATS BESS. Because BESS ramp rates can be set to millisecond-range values based
    on local requirements, the fixed ramp-rate assumption in the tool was incompatible
    with BESS capabilities and had to be resolved with AEMO before FCAS testing could
    be completed.
  lesson_learnt: BESS proponents seeking FCAS registration should engage AEMO on MASS
    tool compatibility before submitting FCAS test plans — the tool's fixed ramp-rate
    assumptions are not suited to BESS and will require negotiated resolution; this
    gap has now been partially addressed through post-BATS BESS AEMO guidance.
