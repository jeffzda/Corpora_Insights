  source_title: 'Ballarat BESS: Knowledge Sharing Report'
  publish_date: '2019-08-07'
  project_name: Ballarat Terminal Station (BATS) BESS
  what_happened: During commissioning and testing, the BESS was required to be bid
    into the NEM market for any generation or load dispatching, with 30-minute targets
    to be scheduled and submitted to Energy Australia and AEMO. This constraint meant
    all testing had to be conducted within market dispatch limits, requiring a dispensation
    from AEMO to allow variances in testing time and sequencing without incurring
    non-compliance.
  lesson_learnt: Commissioning programmes for NEM-registered BESS assets must account
    for the requirement to bid all testing activity into the market — obtain an AEMO
    dispensation to operate in the NEM for commissioning purposes early in the project,
    as failure to do so will constrain testing flexibility and introduce non-compliance
    risk.
