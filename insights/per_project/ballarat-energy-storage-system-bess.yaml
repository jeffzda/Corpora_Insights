- record_id: ARENA-DLV-55968
  source_title: 'Ballarat Battery Energy Storage System Operational Report #1 & #2'
  publish_date: 2020-08
  project_name: Ballarat Battery Energy Storage System
  what_happened: The Ballarat System operated at an average SoC of only 34.1% during
    Contract Year 1, with only 14 periods at above 50% SoC lasting 14–20 hours, reflecting
    the combined effect of contractual SoC constraints, FCAS market participation
    patterns, and the precautionary SoC restriction.
  lesson_learnt: Battery system SoC profiles in real NEM operation can differ significantly
    from design assumptions — average SoC of 34.1% versus a nominal 50% midpoint reflects
    the interaction of contractual limits, safety restrictions, and FCAS market dynamics;
    future projects should model realistic operational SoC distributions rather than
    assuming midpoint operation.
