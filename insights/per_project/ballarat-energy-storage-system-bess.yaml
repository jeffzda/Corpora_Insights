- record_id: ARENA-DLV-42059
  source_title: Ballarat Battery Energy Storage System Operational Report 3 & 4
  publish_date: 2021-05
  project_name: Ballarat Battery Energy Storage System
  what_happened: Multiple categories of unplanned maintenance events occurred during
    Contract Year 2 including controller stoppages, PCS communication timeouts, controller
    software/communications failures, a mains supply protection event, and a single
    damage event during power restoration after a full outage — each taking one or
    more battery cores out of service. The SoC restriction accounted for 7.87% of
    availability loss; other unplanned maintenance contributed an additional ~1.07%.
  lesson_learnt: First-generation grid-scale BESS should be designed and contracted
    with sufficient redundancy across cores and robust remote monitoring to limit
    the impact of controller, PCS, and communication faults — these represent recurring,
    multi-event failure modes in early operations that individually have small availability
    impacts but cumulatively are significant.
