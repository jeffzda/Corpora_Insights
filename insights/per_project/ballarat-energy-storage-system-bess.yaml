- record_id: ARENA-DLV-38654
  source_title: Ballarat Battery Energy Storage System Revenue Report
  publish_date: 2021-05
  project_name: Ballarat Battery Energy Storage System
  what_happened: The consortium investigated expanding the Ballarat System's energy
    capacity from 30 MWh (1-hour) to 60 MWh (2-hour duration). The expansion was found
    to be technically feasible but the capital cost did not justify the incremental
    revenue gain, so it was not pursued.
  lesson_learnt: When evaluating BESS capacity expansions, validate that incremental
    revenue uplift justifies capital cost before committing — a doubling of energy
    capacity may not proportionally increase revenue if the system is already constrained
    by market dispatch patterns or state-of-charge limits.
