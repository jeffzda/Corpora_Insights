  what_happened: The cycling limitation of 260 cycles per year, combined with daily
    SoC management obligations, made it difficult to implement 'set-and-forget' default
    trading offers, requiring active daily trader engagement to optimise returns.
  lesson_learnt: Battery trading operations cannot be effectively automated with default
    offers alone when cycling limits and SoC contractual obligations exist — plan
    for active daily trader involvement and ensure trading systems capture sufficient
    data points for real-time decision support.
