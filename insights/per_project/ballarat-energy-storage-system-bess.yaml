  project_name: Ballarat Battery Energy Storage System
  what_happened: The consortium structure — with AusNet as asset owner bearing technology
    risk, EnergyAustralia as market intermediary bearing price and performance risk,
    and Fluence as the technology provider bearing operational risk — allowed each
    party to manage risks appropriate to their expertise, with financial outcomes
    meeting or exceeding expectations for all parties.
  lesson_learnt: A consortium structure that allocates technology risk to the asset
    owner, market risk to an experienced market intermediary, and operational risk
    to the technology provider can effectively de-risk a first-of-kind battery project
    — the Ballarat structure allowed each party to focus on risks within their competency
    and was judged successful by all parties.
