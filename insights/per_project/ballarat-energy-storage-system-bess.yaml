  project_name: Ballarat Battery Energy Storage System
  what_happened: The Ballarat System's state-of-charge (SoC) was technically constrained
    to maintain an average below 41% over a 12-month period, making it infeasible
    to provide Network Loading Control Ancillary Services (NLCAS) which require guaranteed
    minimum SoC availability at all times.
  lesson_learnt: BESS systems with binding SoC constraints (e.g. first-generation
    lithium-ion systems with average SoC caps) cannot reliably provide NLCAS; future
    systems should assess whether SoC constraints have been removed or relaxed before
    including NLCAS in the revenue stack.
