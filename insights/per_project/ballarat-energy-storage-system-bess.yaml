- record_id: ARENA-DLV-38655
  source_title: Ballarat Battery Energy Storage System Revenue Report
  publish_date: 2021-05
  project_name: Ballarat Battery Energy Storage System
  what_happened: The Ballarat System's connection via a transformer tertiary winding
    capped power output at 40 MVA, precluding any meaningful increase in power capacity.
    Furthermore, increasing power output would have required renegotiating Generator
    Performance Standards (GPS), with the cost of meeting updated technical standards
    likely to exceed any revenue benefit.
  lesson_learnt: Connecting a BESS via an existing transformer tertiary winding reduces
    connection costs but imposes a hard power ceiling; projects should assess whether
    that ceiling constrains future capacity upgrades and factor GPS renegotiation
    costs into expansion business cases.
