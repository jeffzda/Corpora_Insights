  source_title: 'Ballarat BESS: Knowledge Sharing Report'
  publish_date: '2019-08-07'
  project_name: Ballarat Terminal Station (BATS) BESS
  what_happened: AEMO's FCAS Verification Tool User Guide did not address Battery
    Energy Storage Systems prior to BATS BESS, and the Market Ancillary Service Specification
    Verification Tool (MASSVT) was not suited to BESS FCAS testing. The team had to
    work closely with AEMO to navigate a gap in the regulatory framework, resulting
    in AEMO subsequently producing a dedicated guide for registering BESS for FCAS.
  lesson_learnt: Proponents registering a BESS for FCAS markets should verify early
    whether AEMO's MASSVT and FCAS Verification Tool User Guide explicitly cover BESS
    — where gaps exist, direct collaborative engagement with AEMO is needed and should
    be factored into the commissioning timeline.
