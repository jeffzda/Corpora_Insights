- record_id: ARENA-DLV-42051
  source_title: Ballarat Battery Energy Storage System Operational Report 3 & 4
  publish_date: 2021-05
  project_name: Ballarat Battery Energy Storage System
  what_happened: A precautionary State of Charge (SoC) restriction limiting the battery
    to 75% of rated nameplate was imposed in June 2020 following an LG Chem battery
    module recall, reducing system availability and capacity for trading. A similar
    SoC restriction had also occurred in Contract Year 1 between April and September
    2019. Battery module replacement was completed between October and November 2020,
    after which the restriction was removed.
  lesson_learnt: Battery operators should maintain contractual and operational provisions
    for precautionary safety modifications triggered by events at comparable facilities
    elsewhere — the SoC restriction materially reduced availability and revenue for
    approximately 5 months, and the resolution process required multi-party inspection,
    software enhancement, and safety review before normal operations could resume.
  issue_severity: major
