  what_happened: The anti-islanding protection scheme originally commissioned for
    the Ballarat Battery interface equipment was not suitable for the system's network
    application. In Q1 2020, two separate high fault-current disturbances on the upstream
    transmission network caused voltage instability, triggering the anti-islanding
    protection scheme inadvertently and causing multiple unexpected trips of the interface
    equipment.
  lesson_learnt: Anti-islanding protection schemes for transmission-connected batteries
    should be reviewed for sensitivity to upstream network fault currents during design
    — unexpected trips caused by voltage instability on the transmission network required
    a formal AEMO approval process before the protection settings could be corrected.
