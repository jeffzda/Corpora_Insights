  project_name: Ballarat Battery Energy Storage System
  what_happened: The Ballarat System's contracted maximum cycle limit and maximum
    continuous hours above 50% SoC, intended to protect the 15-year performance guarantee,
    constrained the trading strategy and at times made it impossible to hold a high
    SoC between low-price and high-price periods, requiring sub-optimal intraday charge/discharge
    events.
  lesson_learnt: Ensure that trading operators are deeply involved in designing battery
    performance contracts — SoC and cycle constraints negotiated to protect equipment
    longevity can directly constrain revenue optimisation strategies; operators need
    detailed awareness of these constraints to design effective bidding strategies
    around them.
