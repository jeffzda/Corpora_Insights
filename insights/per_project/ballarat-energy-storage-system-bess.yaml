  project_name: Ballarat Terminal Station (BATS) BESS
  what_happened: The unique consortium arrangement involving multiple funding partners
    (Victorian Government, ARENA, AusNet Services, Energy Australia) created a challenging
    contractual and commercial environment. Contracts and funding were contingent
    on the connection application and AEMO acceptance of Generator Performance Standards,
    and the interdependence of all associated agreements and technical assessments
    delayed financial close.
  lesson_learnt: For consortium BESS projects with multiple funding partners, ensure
    that contractual interdependencies between connection applications, GPS acceptance,
    and funding agreements are mapped and sequenced early — circular dependencies
    between technical assessments and funding conditions can substantially delay financial
    close.
