  what_happened: RIT-T processes assessing BESS as an alternative to traditional network
    augmentation (including the NSW-QLD transmission capacity expansion PACR, December
    2019) consistently found that BESS did not provide better customer benefit, partly
    because existing frameworks could not recognise the full value of BESS attributes
    such as faster deployment and greater modularity.
  lesson_learnt: Existing RIT-T frameworks undervalue BESS capabilities (speed to
    market, modularity) relative to traditional network assets; proponents and industry
    should advocate for framework reform so that BESS can compete on equal terms in
    network planning processes.
