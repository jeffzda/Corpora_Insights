  source_title: 'Ballarat Battery Energy Storage System Operational Report #1 & #2'
  publish_date: 2020-08
  project_name: Ballarat Battery Energy Storage System
  what_happened: The multi-party ownership and operating structure of the Ballarat
    System — spanning asset owner (AusNet/Mondo), technology provider (Fluence), market
    intermediary (EnergyAustralia), and balance-of-plant maintainer (AusNet) — created
    coordination complexity, particularly around aligning technical specifications
    with operator requirements and resolving multi-party signal debugging challenges.
  lesson_learnt: In consortium battery projects with multiple parties holding distinct
    operational roles, establish clear alignment between technical specifications
    and future operator requirements during development — misalignment between equipment
    supplier design and operator needs can restrict system functionality and limit
    revenue maximisation from the outset.
