    battery trading — FCAS price forecasts in particular have been shown to be inaccurate,
    and manual trader oversight is needed to manage SoC optimally as intraday market
    conditions deviate from forecasts; auto-bidding is useful for compliance management
    and portfolio coordination but not for full revenue optimisation.
