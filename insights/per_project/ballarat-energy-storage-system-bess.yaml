- record_id: ARENA-DLV-0553
  source_title: 'Ballarat BESS: Knowledge Sharing Report'
  publish_date: '2019-08-07'
  project_name: Ballarat Terminal Station (BATS) BESS
  what_happened: The BESS could not be connected to the transmission network prior
    to registration, but registration could not be completed until AEMO was satisfied
    with testing — a circular dependency. To resolve this, AEMO granted a Notifiable
    Exemption allowing pre-commissioning testing to proceed using temporary power
    supply.
  lesson_learnt: For transmission-connected standalone BESS assets, the registration/connection
    circular dependency ('chicken and egg') must be anticipated and resolved through
    early engagement with AEMO to obtain a Notifiable Exemption before the commissioning
    programme is finalised — failure to plan for this will block the commissioning
    sequence.
