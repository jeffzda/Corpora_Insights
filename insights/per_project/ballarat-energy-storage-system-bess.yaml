  what_happened: Automated bidding approaches were found to be insufficient for optimal
    trading of the Ballarat System due to forecast inaccuracies in both energy and
    FCAS prices, variability introduced by uncontrolled renewables, and the need to
    manage SoC dynamically as market conditions evolved intraday.
