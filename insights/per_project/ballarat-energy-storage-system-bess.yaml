    first two years due to increasing renewable energy penetration, deployment of
    other battery projects in Victoria, AEMO's increase of the minimum FCAS Regulation
    requirement from 130 MW to 220 MW, and pending market reforms including the 2-second
    FCAS market and Primary Frequency Response requirements. This created uncertainty
    about whether sustained high FCAS revenues would persist over the remaining contract
    life.
