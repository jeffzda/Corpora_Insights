  what_happened: BATS BESS adopted a performance contracting model in which the same
    team that developed the concept continued through detail design, GPS and registration,
    planning, construction, community engagement, commissioning, and performance testing.
    This contrasts with traditional specification-and-tender or D&C delivery models
    and delivered verified performance outcomes at practical completion.
  lesson_learnt: A performance contracting model — retaining the same integrated team
    from concept through to commissioning and testing — is well suited to first-of-kind
    BESS projects where commercial certainty of technical outcomes is required by
    multiple funding and offtake partners; this model reduces handover risk and ensures
    performance guarantees are grounded in design realities.
