  what_happened: The Ballarat System, as a 30MW/30MWh (1C) high-power, low-energy
    configuration, generated greater value than a higher-energy (MWh) equivalent would
    have, by capturing high-priced volatile energy market events and maximising FCAS
    market participation. This pattern was consistent across both Contract Year 1
    and Contract Year 2.
