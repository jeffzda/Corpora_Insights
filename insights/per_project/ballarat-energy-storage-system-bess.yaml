  what_happened: A community engagement programme — including an open day at the Warrenheip
    town hall, direct resident visits, monthly newsletters, and a community hotline
    — was developed in collaboration with the Victorian Government during the planning
    phase. Local contractors, labour, logistics, and recycling businesses were engaged
    during construction, converting a specialist infrastructure project into a community
    project with broad local acceptance.
