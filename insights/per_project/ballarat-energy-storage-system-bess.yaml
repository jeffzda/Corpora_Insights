    NEM — approximately 23% less than the 7,311 MWh in Contract Year 1 — because the
    market intermediary shifted operational focus from energy arbitrage toward FCAS
    markets. Battery utilisation fell from 97.9% to approximately 78.5% of the agreed
    energy discharge threshold. Despite lower utilisation, net revenue increased by
    approximately 10%.
