- record_id: ARENA-DLV-38651
  source_title: Ballarat Battery Energy Storage System Revenue Report
  publish_date: 2021-05
  project_name: Ballarat Battery Energy Storage System
  what_happened: After 12 months of operation (December 2018 to December 2019), the
    Ballarat BESS generated $6.07M of revenue, outperforming expectations in FCAS
    markets and meeting expectations in the energy market. However, the consortium
    concluded that without government funding the revenue from market services alone
    would have been insufficient to provide a viable business case.
  lesson_learnt: Revenue stacking across multiple market services (energy, regulation
    FCAS, contingency FCAS) is critical to BESS commercial viability, but at 2018–2019
    cost levels government grant support was still required to make the business case
    work — future projects must also access non-market or non-established revenue
    streams, or rely on further capital cost reductions.
