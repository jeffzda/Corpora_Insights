  what_happened: Over Contract Year 2, over 90% of net revenue ($6.645M) was generated
    from FCAS markets rather than energy arbitrage, despite energy arbitrage being
    the primary original business case for EnergyAustralia. FCAS revenue ($6.257M)
    significantly outperformed energy pool revenue ($654K net of charging costs).
  lesson_learnt: For high-power, low-energy (1C) grid-scale BESS in the NEM, FCAS
    markets — particularly contingency and regulation raise — deliver substantially
    greater revenue than energy arbitrage; project business cases and commercial structures
