- record_id: ARENA-DLV-0574
  source_title: 'Ballarat BESS: Knowledge Sharing Report'
  publish_date: '2019-08-07'
  project_name: Ballarat Terminal Station (BATS) BESS
  what_happened: 'Registering a standalone, unmanned BESS asset owned by AusNet but
    operated by Energy Australia required novel processes: registering an asset owned
    by a separate entity, obtaining an exemption for the registration/connection circular
    dependency, developing an R2 Test Plan for a standalone asset, and producing a
    new AEMO guide for BESS FCAS registration. Strong AEMO collaboration throughout
    was essential.'
  lesson_learnt: Registering a transmission-connected BESS where the asset owner and
    market operator are different entities requires early identification of all novel
    registration pathways — including asset ownership structures, R2 test plan development,
    and FCAS tool gaps — and dedicated, sustained engagement with AEMO from the pre-engineering
    phase through to commissioning completion.
