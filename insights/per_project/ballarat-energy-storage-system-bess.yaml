  project_name: Ballarat Terminal Station (BATS) BESS
  what_happened: Construction was carried out within an operational transmission station,
    requiring work to be segregated from the live network via temporary fencing and
    an Authorised Recipient on site at all times. Concurrent construction and commissioning
    activities with up to 80 workers on a 100 x 50 metre site compounded safety risks
    including excavation, piling, lifting, and concreting operations.
  lesson_learnt: Brownfield BESS installation within an operational transmission station
    requires formal site segregation (temporary fencing, Vicinity Access Permit, Authorised
    Recipient) and explicit management of concurrent construction and commissioning
    activities — these are non-standard requirements compared to greenfield sites
    and must be planned into the project management system.
