  source_title: Ballarat Battery Energy Storage System Final Report
  publish_date: 2021-10
  project_name: Ballarat Battery Energy Storage System
  what_happened: The Ballarat System's 1-hour energy duration meant it could only
    dispatch for a portion of extended high-price events. During a sustained price
    event on 24 January 2019 above $10,000/MWh lasting over 5 hours, the system was
    unable to maintain full output for the entire period, limiting its capacity value.
  lesson_learnt: Understand the implications of energy-to-power ratio on revenue capture
    during sustained high-price events — a 1-hour duration battery cannot participate
    effectively in multi-hour price events and is best positioned as a peak-shaving
    and FCAS asset rather than a firm capacity provider; future projects targeting
    extended volatility capture should consider longer durations.
