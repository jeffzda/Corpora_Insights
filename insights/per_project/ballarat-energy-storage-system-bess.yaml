  source_title: Ballarat Battery Energy Storage System Final Report
  publish_date: 2021-10
  project_name: Ballarat Battery Energy Storage System
  what_happened: Annual performance testing for Contract Year 2 was postponed because
    the practical completion date (December 2018) fell within the constrained outage
    period over summer (December to April). As a result, testing occurred after the
    defined performance guarantee date, meaning module degradation during the intervening
    period could theoretically have affected the measured performance value.
  lesson_learnt: Plan annual performance testing dates carefully with respect to constrained
    network outage windows — postponing testing beyond the performance guarantee date
    introduces ambiguity about whether degradation occurred before or after the contractual
    measurement point, potentially affecting warranty or performance guarantee outcomes.
  issue_severity: minor
  project_type: storage
