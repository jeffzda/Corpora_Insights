- record_id: ARENA-DLV-0552
  source_title: 'Ballarat BESS: Knowledge Sharing Report'
  publish_date: '2019-08-07'
  project_name: Ballarat Terminal Station (BATS) BESS
  what_happened: The Ballarat Transmission Station had previously been operated by
    the State Electricity Commission, and the location of obsolete in-ground assets
    was not clearly defined. Ground penetrating radar surveys revealed control system
    cabling, drainage, hydraulic, septic and operational fibre optic cabling, requiring
    extreme caution during excavation. This delayed site preparation and pushed construction
    into a non-optimal weather window.
  lesson_learnt: For brownfield transmission station sites with legacy infrastructure,
    commission comprehensive ground penetrating radar surveys before finalising the
    construction programme — undocumented in-ground assets are a predictable source
    of construction delay and can shift works into an unfavourable weather window.
