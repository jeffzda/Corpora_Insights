  evidence_excerpt: This technology has been demonstrated to increase the performance of low quality / low cost solar grade silicon wafers to levels similar to those currently being achieved with high purity
    / high cost wafers. Using wafers appropriately pre-processed, this technology can be incorporated into current standard cell manufacturing lines, with minimal equipment change... a global saving of
    some US $7.5b pa is possible.
