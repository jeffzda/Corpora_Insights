- record_id: ARENA-DLV-40366
  source_title: 'In The Spotlight: Australian Solar Energy R&D Outcomes and Achievements in a Global Context'
  publish_date: 2018-07
  project_name: Improving the Efficiency of Low Quality Low Cost Silicon Wafers (ACAP PP1.1, ARENA RND 2017)
  what_happened: The UNSW charge-state controlled hydrogenation process for deactivating boron-oxygen defects in solar-grade silicon was successfully demonstrated, achieving independently verified cell
    efficiency of 21.1% on commercial n-type solar grade wafers (versus 21.9% for co-processed electronic grade material), and attracted 22 industry partners engaged in further development prior to commercial
    adoption.
  lesson_learnt: Process innovations that are compatible with existing manufacturing lines and reduce input material costs (rather than requiring new infrastructure) attract rapid and broad industry uptake
    — when designing PV R&D programs, prioritise innovations that can be retrofitted into current manufacturing processes as these have the shortest commercialisation pathway and highest leverage.
