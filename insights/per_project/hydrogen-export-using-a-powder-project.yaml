- record_id: ARENA-DLV-25054
  source_title: Curtin University 'Hydrogen Export Using a Powder Project' Core Research
    Interim Report
  publish_date: '2025-11-10'
  project_name: Hydrogen Export Using a Powder Project
  what_happened: The hydrolysis reaction rate was found to be strongly temperature-dependent,
    performing optimally at approximately 80 °C, but the 40 °C water bath used in
    experiments limited the system from reaching that temperature promptly, causing
    a delayed peak output and variable reaction dynamics.
  lesson_learnt: Design hydrolysis reactor systems with active temperature control
    capable of sustaining the optimal reaction temperature (approximately 80 °C for
    NaBH4 hydrolysis) throughout the full batch; a passive water bath is insufficient
    at gram scale and above.
