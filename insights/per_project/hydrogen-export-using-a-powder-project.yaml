- record_id: ARENA-DLV-25053
  source_title: Curtin University 'Hydrogen Export Using a Powder Project' Core Research
    Interim Report
  publish_date: '2025-11-10'
  project_name: Hydrogen Export Using a Powder Project
  what_happened: When the Co-Fe-B catalyst was tested at the 0.5 g scale with a large
    volume of sodium borohydride solution, the hydrogen generation rate fell significantly
    short of the previously reported benchmark of 22 L·min⁻¹·gcatalyst⁻¹, achieving
    only 13.6 L·min⁻¹·gcatalyst⁻¹. The discrepancy was attributed to scale-up effects,
    temperature dynamics, and the dilution effect of increasing borate concentration.
  lesson_learnt: Catalyst performance reported at milligram scale in literature cannot
    be assumed to hold at gram scale — validate catalyst hydrogen generation rates
    at each scale increment, and design temperature control systems that can maintain
    optimal reaction temperature throughout the full batch, not just at initiation.
  issue_severity: moderate
  project_type: null
  project_scale_band: pilot
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: The team proceeded with the lower-performing configuration and
    successfully produced 10 g of hydrogen in 39 minutes, meeting the milestone target
    volume if not the rate benchmark; further catalyst development and a flow-through
    reactor are planned for the next milestone.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages: &id003
  - 12
  - 13
  evidence_excerpt: When the powdered catalyst was used with a large volume of sodium
    borohydride, the hydrogen gas flow rate did not reach the previously reported
    rate of 22 L.min−1.gcatalyst−1. Achieving maximum hydrogen output required significant
    activation time, mainly depending on solution temperature. Although the experiment
    used a 40 °C water bath, the highest reaction rate only occurred when the reaction
    temperature reached ≈ 80 °C, limited by heat loss to the bath.
