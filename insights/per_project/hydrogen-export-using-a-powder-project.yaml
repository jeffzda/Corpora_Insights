- record_id: ARENA-DLV-25055
  source_title: Curtin University 'Hydrogen Export Using a Powder Project' Core Research
    Interim Report
  publish_date: '2025-11-10'
  project_name: Hydrogen Export Using a Powder Project
  what_happened: Catalyst longevity for NaBH4 hydrolysis remains inadequately characterised;
    published literature predominantly reports short-cycle performance with degradation
    occurring over time due to borate byproduct accumulation on the catalyst surface,
    and the commercial target of 2–5 years of catalyst life before replacement has
    not yet been demonstrated or validated.
  lesson_learnt: Catalyst lifetime and cyclability must be treated as a primary research
    parameter — not a secondary one — when designing hydrogen generation systems for
    commercial deployment; without validated longevity data, CAPEX and maintenance
    cost projections for commercial plants will be unreliable.
  issue_severity: moderate
  project_type: null
  project_scale_band: pilot
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The team identified that washing the catalyst with pure water
    or weak acid may mitigate borate accumulation and plans further longevity testing;
    regeneration procedures are to be incorporated in next-milestone reactor design.
  transferability: moderate
  delay_magnitude: null
  technology_domain: hydrogen
  source_pages: &id005
  - 11
  evidence_excerpt: Long term use of the catalyst needs to be assessed further with
    many reports mentioning that degradation occurs over time. It is apparent that
    the yield of hydrogen does not decrease but rather the reaction rate. Ideally
    the catalyst should not require replacing for 2 – 5 years. It is anticipated that
    this degradation occurs due to the buildup of the sodium borate byproducts on
    the catalyst over time, although this could be mitigated by washing of the catalyst
    with pure water or weak acid to dissolve the material.
