  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: A flow-through system with close temperature control is planned
    for the next milestone to address this limitation.
  transferability: moderate
  delay_magnitude: null
  technology_domain: hydrogen
  source_pages: &id004
  - 11
  evidence_excerpt: The hydrogen flow rate during the hydrolysis of sodium borohydride
    is dependent on the reaction temperature. The flow rate appears to be optimal
    at 80 °C, while increased temperatures may see the reaction becoming too volatile.
    The development of a flow-through system will allow close control of the reaction
    temperature.
