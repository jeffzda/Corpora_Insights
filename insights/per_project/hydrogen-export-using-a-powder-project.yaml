  what_happened: The electrochemical cell conditions — including electrolyte composition,
    current density, electrode design, and environmental conditions — were found to
    critically affect NaBH4 yield, Faradaic efficiency, and product purity. Small
    variations in these parameters produced significantly different outcomes, creating
    a sensitivity that will complicate scale-up to continuous-flow operation.
  lesson_learnt: For electrochemical synthesis scale-up, systematically map the sensitivity
    of yield and efficiency to all process parameters (electrolyte composition, current
    density, temperature, cell design) at lab scale before committing to a continuous-flow
    design — parameter interactions that are manageable in batch may become uncontrollable
    in continuous operation if not characterised early.
