- record_id: ARENA-DLV-25052
  source_title: Curtin University 'Hydrogen Export Using a Powder Project' Core Research
    Interim Report
  publish_date: '2025-11-10'
  project_name: Hydrogen Export Using a Powder Project
  what_happened: Initial extraction of sodium borohydride from the electrochemical
    cell using published literature methods yielded product with purity below 95%
    and high hygroscopicity due to small particle size, requiring an additional recrystallisation
    step not anticipated in the original process design.
  lesson_learnt: When scaling electrochemical synthesis of powders, budget for additional
    purification and particle engineering steps beyond those described in literature
    — published extraction methods may not meet purity or handling specifications
    at your target scale, particularly for hygroscopic materials.
  issue_severity: moderate
  project_type: null
  project_scale_band: pilot
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: An additional recrystallisation step was introduced to increase
    particle size, improve purity above 95%, and reduce hygroscopicity of the sodium
    borohydride product.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages: &id002
  - 11
  - 13
  evidence_excerpt: These methods allowed the separation of NaBH4, although some methods
    also extracted unwanted by-products that reduced the purity of the final product
    to below 95% and the small particle size of sodium borohydride resulted in high
    moisture absorbance at ambient conditions. Hence, an additional recrystallisation
    step was required to increase purity and particle size and also reduce hygroscopicity.
