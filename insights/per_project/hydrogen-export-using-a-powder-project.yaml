- record_id: ARENA-DLV-25056
  source_title: Curtin University 'Hydrogen Export Using a Powder Project' Core Research
    Interim Report
  publish_date: '2025-11-10'
  project_name: Hydrogen Export Using a Powder Project
  what_happened: Separating pressurised gaseous hydrogen from the aqueous sodium borate
    stream proved to be a non-trivial engineering challenge; at atmospheric pressure
    bubble separation is straightforward, but under high pressure the hydrogen bubbles
    in the mixed gas-liquid stream may be microscopic, making dry high-pressure hydrogen
    collection difficult. High-pressure hydrogen collection at 10 g scale had not
    yet been achieved at the time of the interim report.
  lesson_learnt: Gas-liquid separation under high pressure requires dedicated engineering
    design from the outset — do not assume atmospheric-pressure separation approaches
    will transfer to pressurised systems; engage chemical engineering expertise specifically
    for this step before committing to a high-pressure reactor configuration.
  issue_severity: moderate
  project_type: null
  project_scale_band: pilot
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Engineering considerations for high-pressure gas-liquid separation
    are underway; a stainless steel flow-through reactor is planned for the next milestone
    to enable collection of dry hydrogen under elevated pressure.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages: &id006
  - 11
  evidence_excerpt: While designing the high-pressure flow-through system, it is apparent
    that separating the pressurised gaseous hydrogen from the aqueous stream is not
    straight forward, whilst maintaining dry high pressure hydrogen outputs. Under
    pressure, these hydrogen bubbles in the mixed gas-liquid stream may be microscopic
    and difficult to separate. Engineering considerations for this process are underway
    to allow the collection of dry hydrogen under pressure.
