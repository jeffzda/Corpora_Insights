  source_title: Curtin University 'Hydrogen Export Using a Powder Project' Core Research
    Interim Report
  publish_date: '2025-11-10'
  project_name: Hydrogen Export Using a Powder Project
  what_happened: Published procedures for the direct electrochemical synthesis (direct
    electrosynthesis) of sodium borohydride could not be reproduced by the research
    team, consistent with reports from other groups. The team had to abandon the planned
    direct electrosynthesis route and develop an alternative indirect electrochemical
    method from scratch.
  lesson_learnt: Do not assume published laboratory procedures for electrochemical
    synthesis are reproducible at your facility — validate reproducibility early before
    committing to a process pathway, as failed reproduction of direct electrosynthesis
    methods forced a full pivot to an indirect approach and consumed significant research
    time.
