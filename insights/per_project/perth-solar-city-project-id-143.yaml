- record_id: ARENA-DLV-72278
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: '2015'
  project_name: Perth Solar City (Project ID 143)
  what_happened: The Perth Solar City in-home display trial across 33,365 customers
    showed that providing real-time electricity cost visibility via smart meter-enabled
    in-home displays produced an average 9% reduction in electricity consumption during
    super-peak hours (2–8pm weekdays), rising to 13% when combined with an in-home
    display.
  lesson_learnt: Real-time cost visibility through in-home displays combined with
    smart meters is an effective demand response tool — programs targeting peak demand
    reduction should consider deploying in-home displays alongside smart meters to
    achieve double-digit reductions in super-peak consumption.
  issue_severity: none
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: network business
  delay_category: no material delay stated
  failure_mode: no major failure stated
  outcome_class: successful demonstration
