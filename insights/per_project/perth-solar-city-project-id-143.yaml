- record_id: ARENA-DLV-72277
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: '2015'
  project_name: Perth Solar City (Project ID 143)
  what_happened: The Perth Solar City program (AUD 44.1M, 33,365 customers) found
    through a PV saturation trial that approximately 30% saturation of solar PV systems
    (by transformer size) can result in voltage rise outside compliance limits at
    the customer level, though within appliance tolerance limits.
  lesson_learnt: Network operators should monitor transformer-level PV saturation
    and set connection policies before saturation approaches 30% — beyond this threshold,
    voltage rise outside compliance limits is likely, requiring active management
    or network augmentation even where customer appliances remain within tolerance.
