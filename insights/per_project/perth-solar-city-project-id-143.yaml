  technology_domain: demand response
  source_pages: &id002
  - 458
  evidence_excerpt: The ability to view electricity costs in real-time via an in home
    display, as enabled by a smart meter, provided participants with the capability
    to better manage their electricity use. Analysis shows an average 9% reduction
    in participant electricity consumption during Super-Peak (2pm - 8pm weekdays).
    When combined with an in home display, participants achieved an average 13% reduction
    in electricity consumption during Super-Peak.
