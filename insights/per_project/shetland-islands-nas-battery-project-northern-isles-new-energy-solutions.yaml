  evidence_excerpt: 2 weeks prior to the scheduled date of operation in 2012, there
    was a fire at a NaS installation in Japan. NGK (battery manufacturer in Japan)
    recommended that all NaS battery installations worldwide shut down until the root
    cause of the fire was determined... it was decided that NaS batteries were no
    longer safe enough for the project. A 1 MW, 3MWh valve regulated lead-acid battery
    was selected as an alternative to complete the project.
