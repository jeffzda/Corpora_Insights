- record_id: ARENA-DLV-16253
  source_title: Energy Storage Study
  publish_date: 2015-07
  project_name: Shetland Islands NaS Battery Project (Northern Isles New Energy Solutions)
  what_happened: A 1 MW / 6 MWh NaS battery being constructed on Shetland Islands
    was abandoned two weeks before scheduled operation in 2012, after a fire at a
    NaS installation in Japan led NGK to recommend global shutdown of all NaS batteries.
    Because extinguishing a NaS fire would require cutting power to the whole island,
    the technology was deemed unacceptably risky and a 1 MW / 3 MWh valve-regulated
    lead-acid battery was substituted instead.
  lesson_learnt: Technology safety incidents in one project can trigger global shutdowns
    that affect unrelated deployments — always assess whether a technology failure
    in another jurisdiction could force your project offline, and ensure a viable
    technology substitution path exists before committing to a single technology on
    critical infrastructure.
  issue_severity: major
  project_type: storage
