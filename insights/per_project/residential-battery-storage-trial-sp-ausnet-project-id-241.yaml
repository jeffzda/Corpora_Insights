- record_id: ARENA-DLV-72286
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects - First Edition Results'
  publish_date: '2015'
  project_name: Residential Battery Storage Trial – SP AusNet (Project ID 241)
  what_happened: SP AusNet conducted a residential battery storage trial (AUD 370,000) with 10 customers integrating solar panels, inverters, batteries, metering, and internet-connected energy management
    systems to collect two years of one-second resolution data on demand management capability, using stationary batteries as a proxy for demand-management-enabled EVs.
  lesson_learnt: Using controllable stationary batteries as a proxy for EV batteries in residential trials is a practical way to gather demand management data before EV market penetration occurs — utilities
    should design trials with high-resolution data collection (one-second intervals) to accurately validate DM algorithms and quantify network benefits ahead of mass-market EV or storage deployment.
