- record_id: ARENA-DLV-37905
  source_title: Hydrogen Communities & H2City Tool
  publish_date: 2019-06
  project_name: Liverpool-Manchester Hydrogen Cluster
  what_happened: The Liverpool-Manchester Hydrogen Cluster study found that blending
    hydrogen at 5–20% by volume into the gas network eliminated the need for domestic
    appliance conversion, substantially reducing total project cost compared to a
    100% hydrogen conversion scenario.
  lesson_learnt: Specifying hydrogen blending at 5–20% volume (rather than 100% conversion)
    eliminates domestic appliance conversion costs entirely — this is a major cost
    reduction lever for early-stage hydrogen network projects and significantly reduces
    customer disruption barriers.
