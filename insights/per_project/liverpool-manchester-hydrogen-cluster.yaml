- record_id: ARENA-DLV-37906
  source_title: Hydrogen Communities & H2City Tool
  publish_date: 2019-06
  project_name: Liverpool-Manchester Hydrogen Cluster
  what_happened: The Liverpool-Manchester Hydrogen Cluster study identified that the
    existing gas supply to the region from offshore fields carried long-term feedstock
    risk, as future low-cost and available gas supply for SMR production was not guaranteed.
  lesson_learnt: For hydrogen projects using SMR with fossil gas feedstock, plan for
    feedstock diversification from the outset — single-source gas supply dependency
    creates long-term cost and availability risk that can undermine project economics
    at commercial scale.
  issue_severity: minor
