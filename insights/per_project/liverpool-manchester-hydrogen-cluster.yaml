- record_id: ARENA-DLV-37907
  source_title: Hydrogen Communities & H2City Tool
  publish_date: 2019-06
  project_name: Liverpool-Manchester Hydrogen Cluster
  what_happened: The Liverpool-Manchester Hydrogen Cluster project found that existing
    onshore salt caverns and existing CCS infrastructure could be repurposed for hydrogen
    storage and carbon capture, reducing the need for new asset investment and start-up
    costs.
  lesson_learnt: Assess existing CCS infrastructure and geological storage assets
    (salt caverns, depleted fields) in the project area before scoping new build —
    reusing existing infrastructure for hydrogen storage and carbon capture can substantially
    reduce capital requirements.
  issue_severity: none
