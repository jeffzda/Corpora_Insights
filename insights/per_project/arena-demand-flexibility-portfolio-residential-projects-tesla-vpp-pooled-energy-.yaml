- record_id: ARENA-DLV-53864
  source_title: Demand Flexibility Portfolio Retrospective Analysis Report
  publish_date: 2023-07
  project_name: ARENA Demand Flexibility Portfolio — Residential Projects (Tesla VPP,
    Pooled Energy, multiple)
  what_happened: Multiple residential demand flexibility projects reported that IT
    infrastructure failures — weak internet connections, 3G network shutdowns, and
    disconnected modems — caused significant proportions of enrolled households to
    fail to send data or participate in demand response events. Tesla reported 72%
    of sites lacked appropriate hardware; Pooled Energy reported 236 controllers failed
    in one event due to network connectivity.
  lesson_learnt: Residential demand flexibility projects must audit and where necessary
    upgrade customer IT and connectivity infrastructure before operational launch;
    connectivity failures at 5–72% of sites are a material and predictable risk that
    must be designed into participation rate assumptions and contractual buffers.
