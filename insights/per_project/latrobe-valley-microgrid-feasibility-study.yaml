- record_id: ARENA-DLV-8108
  source_title: Latrobe Valley Microgrid Feasibility Assessment
  publish_date: '2019'
  project_name: Latrobe Valley Microgrid
  what_happened: Modelling of Scenario 1 (where buyers pay no network or market charges
    on LEM volumes) showed that while consumers could save 31–41% and prosumers gain
    53–107%, the participating retailer would incur a 10% financial loss on LEM-traded
    volumes due to unfunded network and market charges.
  lesson_learnt: LEM business models that exempt buyers from network and market charges
    create an unresolved cost-recovery problem for the retailer — any implementation
    of Scenario 1 requires a credible plan for how the retailer recoups unfunded network
    costs, such as product bundling, premium access fees, or margin recovery on residual
    grid sales.
  issue_severity: major
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: concept/feasibility
  proponent_type: technology vendor
