  - 25
  evidence_excerpt: Should data be only available on a significant delay from real-time,
    for example, the processing of marketplace transactions may be delayed accordingly.
    If the third-party data platform provides a lower resolution of data to the Local
    Energy Marketplace, subsequently the Local Energy Marketplace will not be able
    to process settlements on the same period as it would if there was a deployment
    of the TAGe to participants.
