- record_id: ARENA-DLV-8101
  source_title: Latrobe Valley Microgrid Feasibility Assessment
  publish_date: '2019'
  project_name: Latrobe Valley Microgrid
  what_happened: During participant recruitment for the feasibility study, accessing
    energy consumption data proved cumbersome — participants were required to sign
    a legal declaration and complete a lengthy form, creating a significant drop-off
    between expressed interest and completed registrations.
  lesson_learnt: Simplify data consent and collection processes before recruiting
    participants — lengthy forms and legal declarations create a significant gap between
    in-person enthusiasm and completed sign-ups. Digital signatures and streamlined
    forms helped reduce friction but the process remained a barrier.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: data/validation/testing
  failure_mode: data & measurement
  outcome_class: re-scoped/adapted
  secondary_failure_mode: coordination & stakeholders
  intervention_note: Digital signatures were deemed sufficient in place of wet signatures,
    reducing one layer of friction in the data consent process.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: DER
  source_pages: &id001
  - 31
  evidence_excerpt: There was generally a lot of in-person enthusiasm for the project,
    but the flow through to signed forms was a trickle of the interest received. Part
    of that was the process itself being cumbersome.
  confidence_note: null
