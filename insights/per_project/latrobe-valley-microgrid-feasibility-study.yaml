- record_id: ARENA-DLV-8102
  source_title: Latrobe Valley Microgrid Feasibility Assessment
  publish_date: '2019'
  project_name: Latrobe Valley Microgrid
  what_happened: Many participants who completed consent forms failed to provide their
    retail electricity bills, which were required to extract tariff and network charge
    data, resulting in their exclusion from the feasibility modelling dataset.
  lesson_learnt: Design participant data collection as a single integrated step —
    requiring participants to supply both meter data consent and retail bills separately
    led to material data incompleteness. Pre-populating or collecting bill data at
    point of registration would reduce drop-off.
