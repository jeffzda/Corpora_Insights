  source_title: Latrobe Valley Microgrid Feasibility Assessment
  publish_date: '2019'
  project_name: Latrobe Valley Microgrid
  what_happened: The feasibility analysis found that volumetric network charging structures
    — which recover costs from consumption only, not exports — create distorted price
    signals that incentivise solar prosumers to maximise self-consumption rather than
    export to the LEM, undermining LEM liquidity.
  lesson_learnt: LEM platforms operating under volumetric-only network charging will
    face a structural incentive for prosumers to self-consume rather than export —
    advocate for cost-reflective peak demand charges or symmetrical export/import
    tariffs as a regulatory precondition for viable LEM markets, and design LEM value
    propositions accordingly.
