  what_happened: The feasibility analysis found that under 20-year financing terms
    through Environmental Upgrade Agreements (EUAs), all but one of the solar and
    battery proposals assessed became cash-flow positive from day one, but on 15-year
    terms all but one were not cash-flow positive, demonstrating high sensitivity
    to finance term length.
  lesson_learnt: For agricultural and commercial solar-plus-storage projects financed
    through EUAs or similar mechanisms, 20-year terms are materially more viable than
    15-year terms — proponents and financiers should model both scenarios and consider
    that export revenue uncertainty (e.g. LEM vs FiT) further reduces the investable
    case for export-focused installations.
