- record_id: ARENA-DLV-8126
  source_title: Latrobe Valley Microgrid Feasibility Assessment
  publish_date: '2019'
  project_name: Latrobe Valley Microgrid
  what_happened: The feasibility study found that 81 participants agreed to provide
    data, but the usable dataset was reduced to 94 NMIs (out of 124 total) due to
    incomplete data sets — 30 NMIs were excluded from final modelling, reducing the
    representativeness of the results.
  lesson_learnt: Budget for a 20–25% data attrition rate in community energy feasibility
    studies — incomplete participant data sets due to missing bills, missing NMI details,
    or non-provision of consent are predictable and should be accounted for in sample
    size planning and modelling assumptions.
  issue_severity: minor
  project_type: software/data/digital
  project_scale_band: demonstration
