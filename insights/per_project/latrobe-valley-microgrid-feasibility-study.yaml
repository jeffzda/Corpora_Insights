- record_id: ARENA-DLV-8106
  source_title: Latrobe Valley Microgrid Feasibility Assessment
  publish_date: '2019'
  project_name: Latrobe Valley Microgrid
  what_happened: Community survey and engagement showed that Latrobe Valley participants
    strongly supported the local energy marketplace concept but were unwilling to
    pay more for local renewable energy — cost savings were a prerequisite for participation,
    not an optional benefit.
  lesson_learnt: Design local energy market propositions so that participation is
    cost-neutral or reduces bills relative to the retail baseline — in economically
    disadvantaged communities, price savings are a mandatory prerequisite for participation,
    not merely a value-add.
