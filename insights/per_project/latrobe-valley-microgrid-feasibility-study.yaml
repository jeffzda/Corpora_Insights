  publish_date: '2019'
  project_name: Latrobe Valley Microgrid
  what_happened: Third-party data platform integration for the LEM was identified
    as potentially requiring significant development effort, with data resolution,
    latency, and format compatibility all creating risks to marketplace transaction
    processing frequency and accuracy.
  lesson_learnt: When planning LEM deployments using third-party metering data rather
    than proprietary TAGe devices, assess data platform compatibility early — delays
    in data availability or lower resolution data will directly degrade the frequency
    and accuracy of marketplace settlement, which affects participant value and trust
    in the platform.
  issue_severity: minor
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: technology vendor
