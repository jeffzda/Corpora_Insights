- record_id: ARENA-DLV-8107
  source_title: Latrobe Valley Microgrid Feasibility Assessment
  publish_date: '2019'
  project_name: Latrobe Valley Microgrid
  what_happened: The feasibility modelling found that under the most immediately implementable
    regulatory scenario (Scenario 3), a Local Energy Market could deliver 6–12% savings
    for buyers and 18–37% additional revenue for prosumers compared to current retail
    and FiT arrangements, demonstrating commercial viability under existing rules.
  lesson_learnt: Peer-to-peer LEM platforms can deliver meaningful economic benefits
    to both buyers and sellers even under current regulatory constraints — proponents
    should model the immediately implementable scenario alongside more favourable
    future scenarios to demonstrate near-term viability to potential participants
    and retail partners.
