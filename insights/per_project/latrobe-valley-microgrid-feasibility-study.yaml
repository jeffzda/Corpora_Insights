  project_name: Latrobe Valley Microgrid
  what_happened: The LEM billing and settlement platform (TransActiveGrid) tracked
    energy trades but did not process payments — transaction logs had to be exported
    as CSV files and provided to the retail partner for payment processing, creating
    a dependency on retailer integration for any financial settlement.
  lesson_learnt: LEM platform proponents should plan for the billing settlement gap
    between trade tracking and financial settlement — without integrated payment processing,
    the platform depends on the retailer's billing system as a critical dependency,
    which constrains the speed of settlement cycles and the operational independence
    of the platform.
