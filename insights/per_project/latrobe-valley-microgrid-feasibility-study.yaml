- record_id: ARENA-DLV-8104
  source_title: Latrobe Valley Microgrid Feasibility Assessment
  publish_date: '2019'
  project_name: Latrobe Valley Microgrid
  what_happened: Retail bill formats varied significantly across the 16 retailers
    used by feasibility participants, requiring manual cross-referencing with retailer
    websites to reconstruct complete tariff component data — this became one of the
    most time-consuming tasks in the data preparation phase.
  lesson_learnt: Do not assume retail bills will contain sufficient structured tariff
    data for modelling — plan dedicated resources for manual tariff reconstruction
    and consider using standardised retailer data feeds or AEMO metering data systems
    to avoid dependence on retail bill formats.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: data/validation/testing
  failure_mode: data & measurement
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Team referred to retailer websites using participant-specific
    details to reconstruct complete tariff datasets where bill information was insufficient.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: DER
  source_pages: &id004
  - 31
  evidence_excerpt: Even when the bill for each NMI was received there was quite a
    wide variation in the type of information displayed on the bill, and how it was
    displayed. In most cases it was necessary to refer to retailer websites (applying
    details from the participant) to ensure a full data set was received. This task
    became one of the most time-consuming and laborious of the data set collation.
