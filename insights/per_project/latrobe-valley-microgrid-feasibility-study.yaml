- record_id: ARENA-DLV-8123
  source_title: Latrobe Valley Microgrid Feasibility Assessment
  publish_date: '2019'
  project_name: Latrobe Valley Microgrid
  what_happened: The regulatory analysis identified that cost-reflective network pricing
    (TOU and demand charges) introduced under 2016 AEMC rule changes has seen very
    limited uptake in Victoria because it was implemented on an opt-in basis, and
    a Victorian Government Order in Council explicitly prevented opt-out assignment
    to cost-reflective tariffs.
  lesson_learnt: Regulatory reform to network pricing structures is ineffective when
    implemented on an opt-in basis — DER and LEM projects that depend on cost-reflective
    price signals to deliver participant value should not assume widespread customer
    migration to such tariffs, and should advocate for opt-out frameworks as a necessary
    precondition for market effectiveness.
