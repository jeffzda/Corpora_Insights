- record_id: ARENA-DLV-14981
  source_title: 'Looking Forward: Barriers, Risks and Rewards of the Australian Geothermal
    Sector to 2020 and 2030'
  publish_date: 2014-06
  project_name: Australian Geothermal Sector – Exploration Activity Peak and Bust
    Cycle
  what_happened: Exploration licence applications in the Australian geothermal sector
    peaked at 414 in 2010 — an 83-fold increase from five applications in 2002 — driven
    primarily by private investors; by 2014 the sector had collapsed with very little
    activity underway, illustrating a classic speculative boom-and-bust driven by
    unmet technical expectations.
  lesson_learnt: Rapid growth in exploration licence applications for an immature
    technology can signal speculative rather than technically-grounded investment;
    funding agencies should use commercial readiness assessments rather than licence
    application volume as a proxy for sector health, and should avoid scaling up commercial
    demonstration funding during a speculative boom when underlying technical performance
    has not been validated.
