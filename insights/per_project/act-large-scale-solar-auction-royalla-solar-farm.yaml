- record_id: ARENA-DLV-72027
  source_title: Australian Energy Resource Assessment – Second edition, 2014
  publish_date: '2014'
  project_name: ACT Large-Scale Solar Auction (Royalla Solar Farm)
  what_happened: In 2012 the ACT Government completed Australia's first reverse auction for large-scale solar generation capacity. The 40 MW auction process, commencing January 2012, resulted in a single
    successful proponent — FRV Royalla Solar Farm Pty Limited — being awarded a 20 MW contract in September 2012, with only half the auctioned capacity awarded.
  lesson_learnt: Reverse auction mechanisms can be an effective tool for price discovery and competitive allocation of large-scale solar contracts, but auction design must anticipate that bid quality or
    project viability constraints may result in less than the full tendered capacity being awarded; capacity targets should include provisions for partial award outcomes.
