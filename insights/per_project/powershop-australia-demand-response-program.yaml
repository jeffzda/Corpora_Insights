  project_name: Curb Your Power (CYP) - Behavioural Insights Trial
  what_happened: The CYP program required customers to actively opt into the program
    before they could receive peak-demand event notifications, creating a friction
    barrier that prevented willing but inactive customers from participating in grid-relief
    behaviour.
  lesson_learnt: Requiring advance opt-in registration for demand-response programs
    creates a structural friction that excludes customers who are willing and able
    to reduce load but who never complete enrolment; program designers should evaluate
    opt-out or default-enrolment architectures to maximise reachable customer pool.
