  source_title: Powershop Demand Response Program - Project Report – Final Report
    2021
  publish_date: 2021-04
  project_name: Powershop Demand Response Program (Curb Your Power)
  what_happened: The baseline methodology used to measure customer load reduction
    produced false positives and false negatives, meaning customers sometimes received
    no credit despite taking action, or received credit without acting. This undermined
    participant trust and discouraged repeat participation.
  lesson_learnt: Baseline methodology design is critical to sustained engagement in
    residential BDR programs — inaccurate baselines that diverge from participants'
    lived experience will erode repeat participation and undermine program scale.
    Minimising false positives and false negatives must be a primary design objective,
    not an afterthought.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Powershop collaborated with Oakley Greenwood to investigate the
    baselining issues and explore alternative baseline calculation methods for residential
    customers.
  transferability: broad
  delay_magnitude: null
  technology_domain: demand response
  source_pages: &id049
  - 7
  - 8
  evidence_excerpt: The baseline needs to produce as few false positive and false
    negatives as possible for sustained engagement across DR events. Currently, the
    baseline can detract people from participating again as it won't match their lived
    experience (no load reduction measured even when taking action, or load reduction
    measured while doing nothing at all). It could undermine mass participation in
    the system, and discourage recurring participation.
