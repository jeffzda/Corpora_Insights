  what_happened: The most significant technical development investment in the program
    was the 'Curbomatic' system — an internally developed platform that managed fleet
    membership, coordinated and scheduled messaging, calculated baselines and performance,
    and handled AEMO settlement, customer payments, and post-event communications.
  lesson_learnt: The critical technical investment for a residential BDR programme
    is not customer-facing hardware but the backend fleet management and settlement
    system — operators should budget adequately for this system as it underpins all
    operational functions including compliance, customer payments, and performance
    measurement.
