- record_id: ARENA-DLV-20051
  source_title: November 2019 Powershop Demand Response Program
  publish_date: 2019-11
  project_name: Powershop Demand Response Program
  what_happened: During the 29 May 2019 RERT event, the contracted Monash University
    1 MW gas cogeneration facility failed after 45 minutes due to coolant overheating,
    rendering it unavailable for the full 2-hour activation window. The facility had
    also been out of action due to ongoing maintenance prior to the event.
  lesson_learnt: Contracted 'firm' capacity from third-party cogeneration or backup
    generation assets should be subject to pre-event mechanical readiness checks and
    maintenance clearances — relying on a facility with known ongoing maintenance
    issues as a firm capacity resource creates material delivery risk during RERT
    activations.
