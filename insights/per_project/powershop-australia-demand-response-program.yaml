  source_title: Powershop Demand Response Program - Project Report (1 of 7)
  publish_date: 2018-05
  project_name: Powershop Demand Response Program
  what_happened: The optimal conditions for demand response events in the Powershop
    'Curb Your Power' portfolio were identified as days between 30–34°C, with events
    timed around 5pm–8pm (EST), providing an operational basis for event scheduling
    in future seasons.
  lesson_learnt: Behavioural demand response programs should calibrate event timing
    to the load profile of their customer cohort — for a residential retailer portfolio
    in south-east Australia, the highest response is achievable on days between 30–34°C
    around 5–8pm EST; this avoids over-extending into extreme heat days where customer
    welfare concerns may apply.
