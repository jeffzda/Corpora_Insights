- record_id: ARENA-DLV-21201
  source_title: Applying Behavioural Insights to Powershop's Curb Your Power Program
  publish_date: null
  project_name: Curb Your Power (CYP) - Behavioural Insights Trial
  what_happened: A randomised controlled trial tested five communication interventions
    on Powershop customers not yet enrolled in CYP. The 'message by default' (Surprise!)
    condition — which bypassed the opt-in recruitment step entirely and defaulted
    customers into receiving peak-demand SMS notifications — increased the proportion
    of customers receiving peak-demand messages by almost 8-fold compared to business-as-usual,
    and produced a 12.6% reduction in power usage during events.
  lesson_learnt: Removing the opt-in friction of joining a demand-response program
    by defaulting all eligible customers into receiving peak-demand event messages
    is substantially more effective than any recruitment email variant; demand-response
    program designers should consider opt-out rather than opt-in enrolment as a baseline
    design choice.
