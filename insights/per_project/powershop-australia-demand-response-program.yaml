    location, customer type, or usage pattern) and enabling app-based push notifications
    could improve customer participation and performance, but these capabilities had
    not yet been implemented at the time of the report.
  lesson_learnt: Demand response programs should build personalisation and app-based
    notification capability into their platform from the outset rather than retrofitting
    it — bulk SMS to undifferentiated cohorts limits performance optimisation, and
    differentiated messaging to high users or reliable 'curbers' is likely to improve
    response rates.
