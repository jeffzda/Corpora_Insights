- record_id: ARENA-DLV-20901
  source_title: Powershop Demand Response Program - Project Report (1 of 7)
  publish_date: 2018-05
  project_name: Powershop Demand Response Program
  what_happened: The AEMO baseline methodology used to calculate customer demand reductions
    produced systematic errors for the Powershop 'Curb Your Power' program, including
    negative baselines for non-solar customers (where the calculation fell below zero,
    making it impossible to register a reduction), false negatives for customers who
    used more electricity than usual in hours immediately preceding an event, and
    inaccurate baselines for solar customers due to no visibility of behind-the-meter
    PV generation.
  lesson_learnt: Demand response program designers should scrutinise the baseline
    methodology before launch — AEMO's additive-factor approach produced negative
    baselines, false negatives, and solar distortions that understated actual customer
    response; alternative methodologies or solar-adjusted baselines should be tested
    and agreed with the market operator prior to operation.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: data/validation/testing
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Powershop collaborated with Oakley Greenwood to share information
    on alternative baseline methods and used alternative methodologies internally
    to estimate additional uncaptured capacity from solar customers.
  transferability: broad
  delay_magnitude: null
  technology_domain: demand response
  source_pages: &id012
  - 7
  - 8
  - 9
  evidence_excerpt: Due to the calculation having additive factors, there are cases
    where a non-solar customer's baseline can fall below zero. This makes it impossible
    to show a reduction and hit a curb target... Solar customers add an extra level
    of complexity when attempting to calculate a baseline due to weather conditions
    having an impact on what is happening at the meter. There is no visibility around
    the amount of PV generation hence solar production is not taken into account when
    calculating the DR.
  confidence_note: null
