  source_title: Applying Behavioural Insights to Powershop's Curb Your Power Program
  publish_date: null
  project_name: Curb Your Power (CYP) - Behavioural Insights Trial
  what_happened: Among customers already enrolled in CYP, the prize draw variant (offering
    entries into a $5,000 prize draw on top of the standard $10 credit) produced a
    5.7% lower average power usage during peak-demand events compared to BAU, driven
    by a higher proportion of members curbing usage by 50–100%. However, this difference
    was not statistically significant at conventional levels.
