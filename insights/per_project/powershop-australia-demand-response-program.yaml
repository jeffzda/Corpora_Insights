  project_name: Powershop Demand Response Program
  what_happened: SMS notifications to approximately 10,000 customers could take up
    to 20 minutes to fully deliver, meaning that customers receiving messages late
    in the send queue received inadequate notice before the demand response event
    commenced.
  lesson_learnt: For SMS-based demand response programs with large customer cohorts,
    schedule bulk SMS dispatch 10–15 minutes earlier than the intended customer notification
    time to account for send-queue latency across ~10,000 recipients.
