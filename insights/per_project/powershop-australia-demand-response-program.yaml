  source_title: Applying Behavioural Insights to Powershop's Curb Your Power Program
  publish_date: null
  project_name: Curb Your Power (CYP) - Behavioural Insights Trial
  what_happened: The trial found that customers who voluntarily opted into the CYP
    program had average baseline energy usage less than half that of non-enrolled
    customers, and a higher proportion had solar installed, indicating that self-selected
    CYP participants were already low-energy users with limited headroom to reduce
    further during events.
  lesson_learnt: Behavioural demand-response programs relying on voluntary opt-in
    systematically attract customers who are already energy-conscious and have less
    capacity to reduce load during events; to maximise grid relief, programs should
    be designed to reach the broader population of higher-usage customers who would
    not self-select.
