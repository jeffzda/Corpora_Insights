- record_id: ARENA-DLV-5603
  source_title: May 2019 Powershop Demand Response Program
  publish_date: 2019-05
  project_name: Powershop Demand Response Program
  what_happened: On 24 January 2019, AEMO's RERT activation email arrived at 15:32
    with only 58 minutes notice (below the 60-minute contractual minimum), and extended
    the event period by 30 minutes beyond what was stated in the original ITT. Powershop's
    SMS scheduling system could not be reprogrammed in time, resulting in some customers
    not receiving the first SMS until 16:00 (30 minutes after it was sent) due to
    SMS congestion, and the stop-curbing SMS being sent 30 minutes before the actual
    event end.
  lesson_learnt: Demand response aggregators must build scheduling systems with real-time
    flexibility to adapt SMS timing and event parameters after receiving activation
    instructions — rigid pre-scheduled systems cannot accommodate last-minute AEMO
    time-block changes and leave participants under- or mis-informed during events.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: commissioning/integration
  failure_mode: unvalidated integration
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: coordination & stakeholders
  intervention_note: Powershop reprogrammed its system to enable flexible SMS timing
    on the evening of 24 January; by 09:03 on 25 January it rescheduled all messages
    and dispatch within seconds of receiving the revised activation email.
  transferability: moderate
  delay_magnitude: null
  technology_domain: demand response
  source_pages:
  - 12
  - 13
  evidence_excerpt: Powershop only received 58 minutes to activate (rather than the
    60 minutes contractually required). Consequently, CYP customers received their
    first SMS less than 1 hour before the Event. Further, the Event period in the
    ITT did not align with the time block in the RERT activation email. The time block
    in the RERT activation email was 30 min longer. AEMO gave no reason for this time
    change.
