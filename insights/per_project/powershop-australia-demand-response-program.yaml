- record_id: ARENA-DLV-5601
  source_title: May 2019 Powershop Demand Response Program
  publish_date: 2019-05
  project_name: Powershop Demand Response Program
  what_happened: Randomised controlled trial (Trial One) tested four behavioural messaging
    treatments against a business-as-usual control for recruiting customers into the
    Curb Your Power (CYP) demand response program. The 'join the club' and 'choose
    your own adventure' treatments, which added prosocial framing or donation choice,
    achieved markedly lower click-through rates (4–5%) and registration rates (5%)
    compared to the control BAU and prize draw groups (both 10% click-through, 13%
    registration).
  lesson_learnt: Adding prosocial or choice-complexity framing to demand response
    recruitment communications can reduce sign-up rates relative to a simple incentive
    offer — keep recruitment messaging simple and avoid adding complexity that may
    cause customer disengagement.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: commercial & market
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: BIT and Powershop identified that simple BAU and prize-draw communications
    outperformed prosocial treatments; Powershop subsequently adopted a prize draw
    plus $10 credit incentive structure for future seasons.
  transferability: broad
  delay_magnitude: null
  technology_domain: demand response
  source_pages: &id001
  - 7
  evidence_excerpt: From this data, Powershop and BIT identified that the provision
    of a prosocial option did not increase CYP recruitment. These results were reflected
    in the click through rates and overall registration, with both the control BAU
    group and Prize Draw group eDMs soundly outperforming the 'join the club' and
    'choose your own adventure' treatment groups. This suggests that re-framing CYP
    communications in certain ways could potentially reduce rates of recruitment.
    This may be because these conditions added further complexity to CYP, causing
    customers to disengage.
  confidence_note: null
