- record_id: ARENA-DLV-20906
  source_title: Powershop Demand Response Program - Project Report (1 of 7)
  publish_date: 2018-05
  project_name: Powershop Demand Response Program
  what_happened: False negatives were generated for customers who used more electricity
    than usual in the hours immediately preceding a demand response event — the baseline
    calculation showed minimal reduction even when the customer had clearly reduced
    their load during the event window. A survey of non-successful participants found
    9% fell into this category.
  lesson_learnt: Demand response baseline methodologies that rely on pre-event consumption
    periods are systematically biased on event days when pre-event usage is elevated;
    program operators should account for anticipatory load increase in baseline design
    or apply event-day corrections, as up to 9% of participants may be incorrectly
    excluded from rewards.
