- record_id: ARENA-DLV-5605
  source_title: May 2019 Powershop Demand Response Program
  publish_date: 2019-05
  project_name: Powershop Demand Response Program
  what_happened: Powershop's optimised baseline calculation showed that AEMO's standard
    baseline methodology undervalued the residential behavioural demand response program
    by 15–20% depending on event conditions, as evidenced by comparing AEMO's and
    Powershop's baselines across the two January 2019 events (3.23 MW vs 3.90 MW on
    24 Jan; 3.88 MW vs 4.55 MW on 25 Jan).
  lesson_learnt: AEMO's default baseline calculation can systematically undervalue
    residential demand response programs by 15–20%; aggregators should develop and
    document their own optimised baseline methodology to accurately represent the
    capacity they deliver and to avoid being commercially penalised for performance
    that exceeds what the standard methodology measures.
  issue_severity: moderate
