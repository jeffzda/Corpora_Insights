  what_happened: To maintain RCT validity during the BIT trial period, Powershop restricted
    CYP customer recruitment to eDM-only channels, removing digital ads and banner
    placements on monthly account reviews that had previously been used. This constraint
    was acknowledged as potentially limiting total recruitment numbers.
  lesson_learnt: When embedding randomised controlled trials within an operational
    demand response program, the trial design constraints (e.g. single-channel recruitment)
    can directly limit commercial program scale — project teams should model the recruitment
    impact of RCT constraints before committing to trial design, and plan compensatory
    recruitment activities for post-trial seasons.
