- record_id: ARENA-DLV-62363
  source_title: Powershop Demand Response Program - Project Report – Final Report
    2021
  publish_date: 2021-04
  project_name: Powershop Demand Response Program (Curb Your Power)
  what_happened: The BDR program produced consistent but non-fixed load reductions
    from the residential fleet, as participants voluntarily reduced consumption rather
    than responding to automated or contracted switching signals. This structural
    characteristic limits the programme's suitability for applications requiring firm,
    predictable dispatch.
  lesson_learnt: 'BDR programmes should be positioned as a complement to — not a substitute
    for — contracted automatic demand response (e.g., physical load switches) in grid
    reliability frameworks: BDR delivers consistent aggregate reduction but cannot
    guarantee a fixed reduction quantum per event, which affects how it should be
    valued and contracted in market mechanisms.'
  issue_severity: minor
