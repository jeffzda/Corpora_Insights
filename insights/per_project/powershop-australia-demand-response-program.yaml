  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Powershop used alternative baseline methodologies that more accurately
    represented solar customers and estimated additional capacity in the program that
    the standard methodology had missed.
  transferability: broad
  delay_magnitude: null
