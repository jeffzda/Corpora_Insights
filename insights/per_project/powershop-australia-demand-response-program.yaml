  what_happened: The program's commercial viability was constrained by being tied
    to the RERT (Reliable and Emergency Reserve Trader) activation mechanism. The
    infrequency and unpredictability of RERT activations limited the commercial case
    for the BDR program as a standalone revenue stream for the retailer.
