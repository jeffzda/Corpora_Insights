- record_id: ARENA-DLV-20910
  source_title: Powershop Demand Response Program - Project Report (1 of 7)
  publish_date: 2018-05
  project_name: Powershop Demand Response Program
  what_happened: Powershop identified that for solar customers there was no correlation
    between temperature and portfolio load (compared to R²=0.89 for non-solar customers),
    making it impossible to accurately represent available demand response capacity
    for that customer segment without behind-the-meter PV visibility.
  lesson_learnt: Demand response programs should segment solar and non-solar customers
    in capacity estimation and baseline reporting — without behind-the-meter PV generation
    data, solar customer baselines are unreliable and standard temperature-load correlation
    approaches (valid for non-solar customers at R²=0.89) break down entirely for
    solar cohorts.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
