  project_name: Powershop Demand Response Program
  what_happened: A percentage-based curb target was chosen over a raw kWh reduction
    to be inclusive of small-load customers, but this introduced a greater margin
    of error for low-consumption customers, increasing the incidence of false negatives
    and false positives in performance measurement.
