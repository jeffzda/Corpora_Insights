  source_title: Powershop Demand Response Program - Project Report – Final Report
    2021
  publish_date: 2021-04
  project_name: Powershop Demand Response Program (Curb Your Power)
  what_happened: In Year 3 (Summer), demand reduction 'fatigue' was observed in longer
    events — load reduction dropped off significantly in the second hour. Splitting
    fleet activation time over the event duration helped manage this effect.
  lesson_learnt: For BDR events longer than one hour, programme operators should anticipate
    reduction fatigue and design activation sequencing — such as staggering fleet
    contact times — to sustain aggregate load reduction across the full event duration
    rather than concentrating activation at event start.
