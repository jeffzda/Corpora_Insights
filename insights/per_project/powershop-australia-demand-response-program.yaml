  project_name: Powershop Demand Response Program (Curb Your Power)
  what_happened: The program demonstrated that eligibility screening of participating
    sites — particularly to exclude sites with sensitive loads — was necessary to
    maintain safety at scale, and that this screening discipline becomes more critical
    as fleet size grows toward hundreds of thousands of sites.
  lesson_learnt: BDR programme operators must implement rigorous eligibility screening
    to exclude sensitive loads (e.g., medical equipment, life-support) before scaling
    fleet size — safety management processes that are manageable at 10,000 participants
    become critical control points at 100,000+ and must be designed for scale from
    the outset.
