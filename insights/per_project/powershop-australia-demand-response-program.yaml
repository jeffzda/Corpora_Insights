  source_title: November 2018 Powershop Demand Response Program
  publish_date: 2018-11
  project_name: Powershop Demand Response Program
  what_happened: Powershop's winter demand response test (Test 3, 29 May 2018) achieved
    only around 60% of the total reserve provided compared to expectations, as customer
    electricity demand in winter months was much lower than in summer months.
  lesson_learnt: DR program designers should plan for significantly lower demand response
    potential in winter months — seasonal demand profiles materially affect what customers
    can curtail, and program targets, incentive structures, and event timing should
    be calibrated separately for each season.
