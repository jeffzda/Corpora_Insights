- record_id: ARENA-DLV-5602
  source_title: May 2019 Powershop Demand Response Program
  publish_date: 2019-05
  project_name: Powershop Demand Response Program
  what_happened: Trial Two (event performance RCT) found no statistically significant
    differences between treatment groups in average energy usage reduction or Curb
    Target achievement during peak demand events. The 'message by default' (opt-out)
    group — which received unsolicited text messages without requiring prior registration
    — achieved greater power reduction during events than the opt-in control group
    and reached a larger pool of customers.
  lesson_learnt: Opt-in demand response programs create friction that limits both
    participation and depth of reduction during events; an opt-out default that notifies
    all eligible customers of peak demand events can reach a larger pool and deliver
    greater aggregate load reduction than any opt-in incentive variant.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: commercial & market
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Key recommendation adopted was that all households should be
    made aware of peak-demand events by default; Powershop moved to include prize
    draw incentives and acknowledged the value of push notifications to maintain customer
    engagement during events.
  transferability: broad
  delay_magnitude: null
  technology_domain: demand response
  source_pages: &id002
  - 8
  - 9
  evidence_excerpt: The most significant finding from Trial Two was that customers
    who received the peak-demand text messages as part of the 'message by default'
    group used less power than those in the control BAU group. This means that the
    opt-out method was able to reach a larger group of Powershop customers, while
    having a greater impact on reducing power usage during the peak-demand Event.
  confidence_note: null
