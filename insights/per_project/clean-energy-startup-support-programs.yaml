- record_id: ARENA-DLV-43462
  source_title: Clean Energy Project Lessons Learnt Report 1
  publish_date: 2020-08
  project_name: Clean Energy Startup Support Programs Project (EnergyLab)
  what_happened: The reduced availability of early-stage startup funding during COVID-19
    increased competition for capital among clean energy startups, making investment
    readiness a more critical program outcome than in pre-pandemic conditions.
  lesson_learnt: During periods of constrained startup capital markets, acceleration
    programs should increase their focus on investment readiness content and maximise
    structured opportunities for startups to meet and build relationships with potential
    investors — these become higher-priority program components than in normal funding
    environments.
