  project_name: Clean Energy Startup Support Programs Project
  what_happened: Facilitating startup-utility partnership conversations in the Scaleup
    Program took substantially longer than anticipated, with coordinating busy schedules
    between founders and utility representatives creating long lead times, and ongoing
    follow-up required well beyond program graduation.
  lesson_learnt: Programs that aim to broker startup-utility partnerships should budget
    significantly more time than expected for facilitation and follow-up — partnership
    conversations typically extend well beyond the official program period and require
    sustained coordination effort to maintain momentum.
