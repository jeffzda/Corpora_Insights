  project_name: Clean Energy Startup Support Programs Project (EnergyLab)
  what_happened: Clean energy startups supported through EnergyLab's Acceleration
    and Pre-Acceleration programs commonly faced extended commercialisation timelines
    due to the high time, labour, and capital requirements for developing a minimum
    viable product (MVP), given the technically complex nature of their innovations.
  lesson_learnt: Acceleration programs supporting cleantech startups should prioritise
    getting startups to an MVP as rapidly as possible — match mentors to founders
    specifically on MVP development needs at program outset, and partner with relevant
    suppliers to fast-track procurement and reduce costs.
