  what_happened: WICEF participants showed notably mixed receptiveness to the program's
    founder resilience content — some valued it highly while others found it irrelevant
    — resulting in inconsistent impact from this program component across the cohort.
  lesson_learnt: Make founder resilience content optional in entrepreneurship support
    programs — receptiveness varies significantly across participants and mandating
    content that some find irrelevant reduces overall program effectiveness; an opt-in
    model allows those who value it to engage while others focus on more relevant
    content.
