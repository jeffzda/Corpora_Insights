- record_id: ARENA-DLV-23157
  source_title: Clean Energy Project Lessons Learnt Report 3
  publish_date: 2021-02
  project_name: Clean Energy Startup Support Programs Project
  what_happened: The Acceleration Program ran for nine months, but EnergyLab's post-delivery
    assessment concluded that the same outcomes could likely have been achieved in
    six months with some program redesign, representing an inefficient use of time
    and resources.
  lesson_learnt: When designing startup accelerator programs, start with a maximum
    six-month duration and validate whether extensions are truly necessary — a nine-month
    program is unlikely to deliver proportionally greater outcomes and may reduce
    time and resource efficiency.
