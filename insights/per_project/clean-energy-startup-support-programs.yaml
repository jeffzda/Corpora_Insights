  source_title: Clean Energy Project Lessons Learnt Report 1
  publish_date: 2020-08
  project_name: Clean Energy Startup Support Programs Project (EnergyLab)
  what_happened: EnergyLab's shift to virtual mentoring during COVID-19 expanded the
    accessible mentor pool across geographies and time zones and reduced scheduling
    friction, but introduced a risk that mentor-mentee relationships would develop
    more slowly or reach lower depth than in-person relationships due to communication
    quality limitations and inability to arrange site visits.
  lesson_learnt: Virtual mentoring can sustain and in some respects enhance mentor
    access for startups, but program designers should proactively address the depth
    limitation by structuring longer or more frequent one-to-one touchpoints to compensate
    for the absence of informal in-person interaction.
