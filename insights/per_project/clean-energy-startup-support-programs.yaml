    utility partners, EnergyLab found that commercialisation partnerships require
    substantial lead times due to founders' full schedules and the time needed for
    conversations to progress through utilities' organisational processes — meaning
    partnership formation extended well beyond the formal program period.
  lesson_learnt: When designing startup-utility matchmaking programs, plan for commercialisation
    partnerships to take significantly longer than the program duration — factor in
    extended lead times driven by founders' workloads and utilities' internal processes,
    and commit to ongoing post-program engagement to convert introductions into formalised
    partnerships.
