- record_id: ARENA-DLV-43461
  source_title: Clean Energy Project Lessons Learnt Report 1
  publish_date: 2020-08
  project_name: Clean Energy Startup Support Programs Project (EnergyLab)
  what_happened: EnergyLab identified that university-generated IP represents a significant
    potential source of clean energy startup innovation, but lacked a clear model
    for how an accelerator could most effectively facilitate IP transfer from universities
    to startups beyond recruiting ex-researchers as founders.
  lesson_learnt: Accelerator organisations supporting clean energy startups should
    actively cultivate relationships with university research groups and participate
    in cooperative research structures (such as CRCs) to position themselves to identify
    and facilitate IP transfer opportunities before those opportunities are lost to
    other channels.
  issue_severity: minor
  project_type: enabling infrastructure
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: concept/feasibility
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: coordination & stakeholders
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: EnergyLab began cultivating relationships with UTS and University
    of Melbourne and joined the RACE for 2030 CRC as an industry partner to improve
    its positioning for future IP transfer facilitation.
  transferability: moderate
  delay_magnitude: null
  technology_domain: other
  source_pages: &id044
  - 10
  - 11
  evidence_excerpt: University-based research provides the foundational Intellectual
    Property (IP) for a large number of renewable energy startups, and we see great
    potential for accelerators like EnergyLab to help drive its commercialisation.
    Beyond recruiting ex-researchers into our programs as company founders, however,
    it is not yet clear exactly how organisations like EnergyLab could most effectively
    facilitate such IP transfers from universities to startups.
  confidence_note: failure_mode set to governance/coordination failure as the gap
