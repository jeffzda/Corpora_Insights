  project_name: Clean Energy Startup Support Programs Project (EnergyLab)
  what_happened: EnergyLab's Acceleration Program demonstrated that mentoring by renewable
    energy experts and experienced entrepreneurs was among the highest-value components
    of the program, with founders deriving substantial benefit from mentors' expertise,
    advice, and network access across sales, marketing, investment, and clean energy
    entrepreneurship.
