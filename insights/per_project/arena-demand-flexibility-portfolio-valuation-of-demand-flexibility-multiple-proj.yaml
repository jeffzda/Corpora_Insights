- record_id: ARENA-DLV-53886
  source_title: Demand Flexibility Portfolio Retrospective Analysis Report
  publish_date: 2023-07
  project_name: ARENA Demand Flexibility Portfolio — Valuation of Demand Flexibility
    (multiple projects)
  what_happened: Across nearly all ARENA-funded demand flexibility projects, providers
    reported that the high uncertainty and variability in the valuation of demand
    flexibility revenue streams — dependent on weather, market prices, baseline application,
    and resource availability — made it very difficult to construct a compelling business
    case, with one customer stating they 'did not want to have to depend on a grid
    emergency' to earn revenue.
  lesson_learnt: Financial uncertainty is the strongest systemic barrier to demand
    flexibility market growth in Australia; programs should prioritise revenue mechanisms
    with availability payments (like RERT) or capacity mechanisms that provide revenue
    certainty, and advocate for the inclusion of aggregated flexible demand in the
    Capacity Investment Scheme to provide a reliable long-term revenue signal.
