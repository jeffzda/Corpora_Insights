  what_happened: 'The supercritical ORC power plant option (TAS, using R245fa) was
    identified as the best-performing technology for Habanero conditions, offering
    ~6.9 MWe net at 28.8% brine utilisation efficiency and the lowest overall project
    specific CAPEX. However, suppliers providing supercritical proposals were difficult
    to engage: Echogen declined due to resource limitations, Cryostar failed to respond
    in time, Granite/Granex technology was still at early stage, and off-design performance
    data from TAS was not obtained.'
  lesson_learnt: Advanced power cycle technologies (supercritical ORC) can offer meaningful
    performance advantages for HPHT EGS applications but supplier market depth is
    shallow; project timelines must allow sufficient lead time for detailed engagement
    with specialist suppliers, and a detailed process design prepared by a reputable
    consultant should be issued to multiple suppliers to improve the quality and comparability
    of proposals.
