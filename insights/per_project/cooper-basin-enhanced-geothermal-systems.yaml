  source_title: Habanero Geothermal Project Field Development Plan
  publish_date: 2014-10
  project_name: Habanero Geothermal Project
  what_happened: A redesigned well concept for the FDP reduced casing strings from
    three to two, reduced hole size from 8.5 inch to 6 inch in the reservoir section,
    replaced the completion with two fully cemented casing strings, and adopted coiled
    tubing drilling with weighted brine for the fracture section. These changes reduced
    average per-well cost from ~$50 million (Habanero 4) to ~$16.5 million in a five-well
    campaign — a ~70% reduction.
  lesson_learnt: 'Significant EGS well cost reductions are achievable through design
    simplification: eliminating casing strings, reducing hole size, removing completions,
    and switching to coiled tubing drilling with compatible brine for the reservoir
    section all compound to reduce rig size requirements, material costs, and NPT
    risk. Campaign drilling further reduces costs through bulk discounts and learning-curve
    efficiency gains.'
