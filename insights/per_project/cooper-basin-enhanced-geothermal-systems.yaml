- record_id: ARENA-DLV-15373
  source_title: Habanero Geothermal Project Field Development Plan
  publish_date: 2014-10
  project_name: Habanero Geothermal Project
  what_happened: The availability requirement of incumbent gas producers in the Cooper
    Basin (>99% with N+1 spinning reserve) was identified as very difficult to meet
    for a remote EGS project, since transmission line availability in the region is
    only 96–98% due to electrical storms and dust build-up. Building dual redundant
    transmission lines to reach 99–99.9% availability would approximately double transmission
    costs.
  lesson_learnt: Availability expectations of remote industrial power consumers should
    be assessed early in project feasibility; for EGS projects supplying existing
    gas plants with N+1 requirements, single-line transmission limits achievable availability
    to ~96% regardless of plant redundancy investment. Emerging greenfield gas producers
    or satellite stations with lower availability tolerance are better-suited off-take
    partners for first-of-a-kind remote EGS projects.
