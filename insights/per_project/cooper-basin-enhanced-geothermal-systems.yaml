- record_id: ARENA-DLV-15380
  source_title: Habanero Geothermal Project Field Development Plan
  publish_date: 2014-10
  project_name: Habanero Geothermal Project
  what_happened: H2S concentration measurements from Habanero formation brine showed
    values ranging from 0.3 to 96 mg/L depending on the analysis method used. The
    iodometric titration method — used for all the high readings — was found to be
    non-specific for H2S, reacting with other oxidising species. The methylene blue
    method (H2S-specific) consistently returned values of 0.3–15.3 mg/L, with the
    true value assessed at 15.3 mg/L.
  lesson_learnt: Brine chemistry characterisation in EGS wells, particularly for corrosive
    species like H2S, must specify the analytical method used; the iodometric titration
    method is not H2S-specific and will overestimate H2S concentration, leading to
    unnecessarily conservative (and costly) materials specifications. The methylene
    blue method should be used as the primary method for H2S measurement in geothermal
    brines.
