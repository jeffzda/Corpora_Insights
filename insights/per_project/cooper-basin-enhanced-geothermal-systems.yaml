  what_happened: Partial evaporative cooling combined with open flow was investigated
    as a means to increase annual generation by 15–20% (~$1.2 million additional revenue
    for a six-well project). However, analysis of water treatment and waste disposal
    costs revealed additional OPEX of $1.7–$3.3 million per year plus $2.5–$3.5 million
    capital for the treatment plant, resulting in a net financial loss of $0.5–$2.1
    million per year.
  lesson_learnt: Evaporative cooling for remote EGS plants in arid environments requires
    geothermal brine as the water source, which necessitates water treatment and hazardous
    waste disposal systems whose costs typically outweigh the generation revenue gain;
    this option should only be pursued where open-flow, water treatment, and waste
    disposal infrastructure are already required for other operational reasons.
