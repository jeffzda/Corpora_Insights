  what_happened: Reuse of the existing 1 MW HPP plant equipment in a four-well brownfield
    development was investigated but found to deliver minimal capital savings (~$2
    million) while significantly reducing net power output (~30% lower than a new
    packaged plant) due to un-optimised cycle performance. The integration complexity
    also precluded securing performance guarantees from plant suppliers.
  lesson_learnt: 'In small EGS developments, reusing existing power plant equipment
    typically produces a sub-optimal outcome: plant equipment represents only ~35%
    of total project costs, so integration savings are diluted by unchanged brine
    system and project management costs, while the performance penalty of an un-optimised
    cycle materially worsens specific CAPEX and project economics. New packaged plant
    should be favoured unless the reuse case is rigorously quantified.'
