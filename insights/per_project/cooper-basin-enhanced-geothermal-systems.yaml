- record_id: ARENA-DLV-15378
  source_title: Habanero Geothermal Project Field Development Plan
  publish_date: 2014-10
  project_name: Habanero Geothermal Project
  what_happened: Conventional geophysical methods — including magnetic surveys, existing
    2D seismic, and two separate magnetotelluric surveys by Japanese researchers —
    were unable to provide actionable information about the Habanero reservoir geometry
    or the location of productive faults within the granite. Seismic acquisition geometry
    (maximum offset 2,000 m) was found to be unsuitable for in-depth granite analysis.
    No remote sensing technique currently available can reliably image faults within
    the granite.
  lesson_learnt: Greenfield EGS developers should not rely on existing conventional
    geophysical datasets (petroleum seismic, magnetics) to locate productive faults
    in granite; these methods were designed for sedimentary targets and lack the resolution
    needed. Dedicated MT surveys comparing pre- and post-stimulation data (as trialled
    by University of Adelaide at Habanero) may offer future potential, but drilling
    currently remains the only method for confirming fault location and productivity.
