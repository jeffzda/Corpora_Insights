- record_id: ARENA-DLV-15371
  source_title: Habanero Geothermal Project Field Development Plan
  publish_date: 2014-10
  project_name: Habanero Geothermal Project
  what_happened: 'The extremely high brine pressures at Habanero (production at ~360
    barg, reinjection at ~450 barg) ruled out direct flash plant configurations and
    created substantial capital cost premiums across all surface equipment: heat exchangers
    (~25% of plant cost), brine reinjection pumps and seals (at the technical limit
    of proven technology), brine piping (wall thicknesses up to 22 mm), and valves
    (up to 10× the cost of equivalent low-pressure valves). The brine system accounted
    for ~21% of total base project CAPEX.'
  lesson_learnt: 'HPHT EGS brine system costs are a dominant cost driver and should
    be treated as a primary design optimisation target alongside well costs: heat
    exchanger manufacturing offshore (Indian suppliers offered ~50% cost reduction
    over New Zealand fabricators) and careful material selection for brine piping
    (exotic high-Cr steels can reduce wall thickness by 40–50%) are the most impactful
    cost reduction levers available before project sanction.'
