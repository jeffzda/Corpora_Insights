  - 83
  evidence_excerpt: Instead of circulating the cement down the casing and back up
    the annulus the cement was circulated in the opposite direction - down the annulus
    and back up the inside of the casing. This allows retarder concentration to be
    tapered as a function of depth so that all the cement is designed to set up in
    its final placement depth. Through the use of this reverse circulation cement
    methodology, Habanero 4 successfully achieved set cement in the upper portion
    of the production casing.
