- record_id: ARENA-DLV-15356
  source_title: Habanero Geothermal Project Field Development Plan
  publish_date: 2014-10
  project_name: Habanero Geothermal Project
  what_happened: Surface pressure modelling of the Habanero 4 reverse cement job initially
    indicated that the downhole circulation pressure at the casing shoe would approach
    fracture gradient, calling the technical feasibility of the method into question.
    When downhole drilling fluid rheology data (measured at actual downhole temperatures
    and pressures) was used instead of surface-condition values, the predicted circulation
    pressure was significantly reduced, confirming feasibility.
  lesson_learnt: Drilling fluid rheological properties change significantly with temperature
    and pressure in deep HPHT wells; using only surface-measured rheology for downhole
    pressure modelling will give erroneous predictions that can wrongly indicate technical
    infeasibility or allow undetected pressure exceedances — downhole rheology data
    must be obtained and used for all critical operations including fracture drilling
    and cement placement.
