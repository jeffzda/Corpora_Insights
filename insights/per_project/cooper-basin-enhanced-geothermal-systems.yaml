  project_name: Habanero Geothermal Project
  what_happened: Flow-induced localised corrosion was observed in surface piping adjacent
    to the wellhead during the HPP trial, despite corrosion modelling showing low
    general corrosion rates for carbon steel in Habanero brine. High turbulence in
    wellhead equipment was identified as the likely mechanism, removing the normally
    protective passivating iron carbonate layer.
  lesson_learnt: Corrosion modelling for EGS surface piping based on uniform flow
    conditions may not capture flow-induced localised corrosion at high-turbulence
    zones (wellheads, valves, bends); these locations require either alternative metallurgy
    or specific corrosion allowance that exceeds the bulk-flow model predictions,
    and should be inspected on a regular schedule during early operation.
