- record_id: ARENA-DLV-15384
  source_title: Habanero Geothermal Project Field Development Plan
  publish_date: 2014-10
  project_name: Habanero Geothermal Project
  what_happened: Drill pipe inspections on previous Habanero wells found multiple
    instances of substandard drill pipe arriving on site below specification. This
    contributed to vibration issues and drilling problems. The FDP identified that
    larger drill pipe (5½ inch versus standard 4½ inch) significantly reduced vibration
    and improved annular velocity and hole cleaning.
  lesson_learnt: For HPHT EGS drilling campaigns, drill pipe must be verified against
    a minimum inspection standard of DS1 Category 3–5 before arrival on site, and
    larger-diameter pipe (5½ inch) should be specified to minimise vibration, improve
    annular velocity, and reduce the risk of hole-cleaning problems that compromise
    downhole pressure management in critical sections.
