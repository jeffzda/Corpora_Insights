- record_id: ARENA-DLV-15383
  source_title: Habanero Geothermal Project Field Development Plan
  publish_date: 2014-10
  project_name: Habanero Geothermal Project
  what_happened: Directed deviated drilling was evaluated for the Habanero field development
    as a means of reducing rig moves and simplifying brine gathering infrastructure
    by drilling all wells from a single pad. However, MWD and steering equipment can
    only operate to approximately 3,000 m due to temperature limitations, deviated
    wells are incompatible with coiled tubing drilling, and the additional cost per
    deviated well was estimated at $1.5–$2.0 million — exceeding the infrastructure
    savings.
  lesson_learnt: Directional drilling from a single pad is impractical for deep HPHT
    EGS wells due to tool temperature limitations (~3,000 m maximum depth for MWD/steering
    equipment), CT drilling incompatibility with deviation, and increased drag in
    deep Permian sections; individual vertical well pads are the lowest-cost and least
    technically complex approach for Habanero-type reservoirs at current technology
    readiness levels.
