- record_id: ARENA-DLV-15353
  source_title: Habanero Geothermal Project Field Development Plan
  publish_date: 2014-10
  project_name: Habanero Geothermal Project
  what_happened: The Habanero 3 casing failed in April 2009 while the well was being
    used in a closed-loop flow test with Habanero 1. The casing in the top 6 m of
    the well ruptured, with water and steam flowing uncontrolled for approximately
    25 days before the well was brought under control. The failure was caused by caustic
    stress corrosion cracking due to unset cement leaving a high-pH environment in
    the annulus behind the 9-5/8 inch casing, compounded by use of high-tensile-strength
    (150 ksi) material susceptible to cracking, cyclic thermal loading, and tong marks
    as initiation points.
  lesson_learnt: In HPHT geothermal wells, conventional top-down cement placement
    cannot reliably set cement at the surface of long production strings due to the
    retarder quantities required; reverse circulation cementing must be used to guarantee
    set cement from bottom to surface and eliminate the caustic environment that causes
    stress corrosion cracking. Casing material must also be limited to lower-strength
    grades (≤110 ksi) that are resistant to both H2S/CO2 sour service and caustic
    cracking.
  issue_severity: critical
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: project developer
  delay_category: commissioning/integration
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated integration
  intervention_note: For Habanero 4, reverse circulation cementing was adopted to
    ensure set cement at surface, lower-strength TN110SS casing was specified, non-marking
    tong dies were used to eliminate fracture initiation points, and a completion
    was installed to isolate cyclic stimulation loads from the production casing.
