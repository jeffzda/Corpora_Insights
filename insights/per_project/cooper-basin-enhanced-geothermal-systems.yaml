  project_name: Habanero Geothermal Project
  what_happened: Large-volume stimulation of Habanero 4 (34 ML injected over 3 weeks
    in November 2012) caused significant cooling of the reservoir around the well.
    A temperature log before stimulation recorded flowing temperature of 241°C, but
    the temperature at the end of the subsequent 161-day closed-loop test was still
    only 236°C — a 5°C deficit persisting after months of production.
  lesson_learnt: Production wells in an EGS development should not be subjected to
    large-volume stimulations; the cold stimulation water cools the reservoir around
    the well, reducing long-term production temperatures. A local stimulation (~2.5
    ML) is sufficient to improve near-wellbore connection, while extended stimulations
    (30+ ML) should be reserved for injection wells where temperature drawdown is
    less critical.
