  source_title: Habanero Geothermal Project Field Development Plan
  publish_date: 2014-10
  project_name: Habanero Geothermal Project
  what_happened: Capital cost analysis confirmed that EGS wells at Habanero are the
    dominant cost driver, constituting ~56% of total base project CAPEX (~$82.2 million
    of $145.7 million at the generator terminals for a six-well project). On a benchmarked
    basis, the Habanero wells alone cost more than the total installed cost of most
    conventional geothermal projects globally.
  lesson_learnt: For HPHT EGS projects, well cost reduction must be the primary commercial
    focus — not power plant optimisation — since wells represent more than half of
    total project CAPEX and drive LCOE more than any other single factor; technology
    investments that reduce per-well cost (slimmer designs, CT drilling, campaign
    efficiency) have far greater leverage on project viability than equivalent investments
    in plant efficiency.
