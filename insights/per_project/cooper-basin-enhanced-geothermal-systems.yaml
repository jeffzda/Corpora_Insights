- record_id: ARENA-DLV-15374
  source_title: Habanero Geothermal Project Field Development Plan
  publish_date: 2014-10
  project_name: Habanero Geothermal Project
  what_happened: Thermodynamic modelling and comparison of three well layout patterns
    for a six-well development (staggered line drive, triangular 4-spot, rectangular
    5-spot) showed the rectangular 5-spot cooled fastest due to alignment of producers
    and injectors along the maximum permeability orientation, while the triangular
    4-spot delivered the most even temperature behaviour and best long-term extensibility.
    The triangular 4-spot was selected as the recommended layout.
  lesson_learnt: EGS well layout must account for permeability anisotropy and the
    dip direction of the reservoir fault; aligning producers and injectors along the
    principal permeability direction accelerates thermal breakthrough. For extensible
    field development, triangular or grid-based layouts that can be extended without
    requiring massive stimulations of existing wells are preferable to line-drive
    configurations.
