  what_happened: Habanero 2 required four sidetracks while attempting to drill through
    the main granite fracture, with recurring loss/kick situations. A plug placed
    during suspension could not be retrieved, reducing productivity, and wellbore
    stability issues caused the drill string to become stuck on both snubbing-rig
    sidetracks. The well was ultimately suspended and later plugged and abandoned.
