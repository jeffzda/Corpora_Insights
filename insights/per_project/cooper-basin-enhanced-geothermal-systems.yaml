- record_id: ARENA-DLV-15354
  source_title: Habanero Geothermal Project Field Development Plan
  publish_date: 2014-10
  project_name: Habanero Geothermal Project
  what_happened: The reverse circulation cementing technique, developed in response
    to Habanero 3's failure, was successfully applied to Habanero 4 and achieved set
    cement throughout the entire production casing column to surface — a result that
    was unachievable with conventional cementing due to the large retarder quantities
    needed to circulate cement past the 4,000 m casing shoe.
  lesson_learnt: Reverse circulation cementing (pumping down the annulus and back
    up inside the casing) allows retarder concentration to be tapered with depth so
    that cement sets reliably at every depth, including at surface — this is the only
    method that reliably eliminates the unset-cement caustic environment that caused
    the Habanero 3 casing failure, and should be mandatory for deep HPHT geothermal
    production strings.
  issue_severity: none
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: construction/installation
  proponent_type: project developer
  delay_category: no material delay stated
  failure_mode: no major failure stated
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: other
  source_pages: &id004
