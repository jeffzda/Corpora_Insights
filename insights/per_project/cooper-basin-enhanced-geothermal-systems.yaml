  what_happened: Under-balance drilling (UBD) was trialled on Savina 1 (intermediate
    section) and Habanero 2 to improve rate of penetration. On Savina 1, the ROP improvement
    was moderate but the time required to manage and place the kill mud system offset
    any cost savings. The well was subsequently lost when a kick at 3,700 m caused
    the BHA to become stuck while regaining control.
  lesson_learnt: 'UBD is not recommended for HPHT EGS wells in the Cooper Basin: the
    spread-rate premium associated with the kill mud system negates ROP gains, insufficient
    back-pressure during connections risks wellbore collapse (minimum 58 MPa must
    be maintained), and the risk of stuck pipe while controlling kicks is severe in
    an environment where retrieval is difficult.'
