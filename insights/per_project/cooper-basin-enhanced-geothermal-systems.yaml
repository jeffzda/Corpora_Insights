  source_title: Habanero Geothermal Project Field Development Plan
  publish_date: 2014-10
  project_name: Habanero Geothermal Project
  what_happened: The Habanero 4 completion barrier failed to hold pressure during
    flow tests, meaning the well operated through most of the 1 MW pilot trial with
    only one pressure-containing barrier rather than the required two. Significant
    lost time was also experienced during Habanero 4 drilling due to difficulty running
    casing past duracrust, a stuck plug in the BOP, and drilling out excess cement
    after the reverse cement job.
  lesson_learnt: 'HPHT EGS wells should be planned with contingency time for non-productive
    events specific to the formation: duracrust sections are best handled with a small
    low-cost mineral rig pre-set, and cement operations should include detailed planning
    for drill-out of excess reverse-circulated cement. Barrier integrity must be verified
    under the full range of operating temperatures including stimulation cold conditions
    before committing to production operations.'
