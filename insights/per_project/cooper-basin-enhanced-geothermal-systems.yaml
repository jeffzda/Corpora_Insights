- record_id: ARENA-DLV-15358
  source_title: Habanero Geothermal Project Field Development Plan
  publish_date: 2014-10
  project_name: Habanero Geothermal Project
  what_happened: The Habanero reservoir was conclusively found to be a single pre-existing
    fault rather than a stimulable network of fractures. Essentially all fluid flow
    occurs through this one fault; attempts to create permeable fracture networks
    'at will' were unsuccessful. This fundamentally reduced estimates of recoverable
    energy and per-well productivity compared to early project assumptions.
  lesson_learnt: EGS resource assessments in granite should not assume that hydraulic
    stimulation will create new permeable fracture networks; productivity is highly
    dependent on intersecting pre-existing, hydraulically conductive faults. Greenfield
    EGS projects must characterise structural geology at the target depth before committing
    to a well program, recognising that current geophysical methods cannot remotely
    image faults in granite and that drilling remains the only definitive exploration
    tool.
