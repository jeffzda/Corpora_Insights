- record_id: ARENA-DLV-15387
  source_title: Habanero Geothermal Project Field Development Plan
  publish_date: 2014-10
  project_name: Habanero Geothermal Project
  what_happened: Transmission from Habanero to Moomba gas facility (~70 km) was estimated
    to cost ~$19.8 million for a 66 kV line, representing ~12% of total base project
    CAPEX and ~$2.8/kWe of the total specific CAPEX. For smaller 3 MWe and 1 MWe projects,
    transmission costs were disproportionately high, eroding the specific CAPEX advantage
    that smaller projects otherwise offered.
  lesson_learnt: 'Transmission costs for remote renewable energy projects scale poorly
    with project size: the relative transmission cost burden is significantly higher
    for small projects, which substantially limits the economic attractiveness of
    staged or small-scale EGS development. Minimising transmission distance by co-locating
    load and generation, or targeting loads that would otherwise use expensive diesel
    generation, is critical to project viability.'
  issue_severity: moderate
  project_type: generation
