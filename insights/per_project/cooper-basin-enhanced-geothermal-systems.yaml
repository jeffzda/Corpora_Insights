- record_id: ARENA-DLV-15377
  source_title: Habanero Geothermal Project Field Development Plan
  publish_date: 2014-10
  project_name: Habanero Geothermal Project
  what_happened: The Celsius 1 Hot Sedimentary Aquifer exploration well was drilled
    to 2,418 m and wireline logs and DST could not be run due to poor hole conditions
    in the Winton formation. Cement slumped into the Hutton sandstone during completion,
    and a second DST failed mechanically. The DST result indicated insufficient permeability
    thickness (0.98–1.6 mD.ft) for geothermal production, and the well was plugged
    and abandoned.
  lesson_learnt: 'Hot Sedimentary Aquifer targets in Cooper Basin sedimentary sequences
    face dual risks: poor hole stability in shallow formations (e.g. Winton) can prevent
    logging and testing, and cement placement must be designed to prevent slumping
    into target formations; contingency perforating plans should be prepared before
    drilling if primary DST integrity cannot be assured.'
