  project_name: Habanero Geothermal Project
  what_happened: Crews trained for standard petroleum well control procedures repeatedly
    applied responses inappropriate for HPHT EGS wells during Habanero drilling operations.
    The extreme process conditions (overpressured reservoir, narrow pressure window,
    high temperatures) require fundamentally different well control practices than
    those drilled into standard rig crews.
  lesson_learnt: HPHT EGS well operations require dedicated pre-job training in HPHT-specific
    well control practices (including downhole fingerprinting techniques), which must
    be delivered beyond the standard Risk Assessment and DWOP sessions; contingency
    plans for envisaged problems must be pre-developed and communicated to all crew
    members before spudding, as improvised responses during HPHT events are high-risk.
