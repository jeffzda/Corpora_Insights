  project_name: Habanero Geothermal Project
  what_happened: Drilling of Habanero 1 lost approximately 250 m³ (1,600 bbl) of 1,800
    kg/m³ (15 ppg) drilling mud into the Habanero Fault, creating a zone of reduced
    permeability ('mud ring') around Habanero 1. Despite ~33 ML of subsequent stimulation
    water injection, injectivity at Habanero 1 remained at approximately 1 kg/s/MPa
    — significantly lower than the 4–16 kg/s/MPa achieved in Habanero 4 — limiting
    the well to injector-only duty throughout the project.
  lesson_learnt: Loss of weighted drilling fluid into the main EGS reservoir fracture
    during drilling can cause irreversible permeability damage; to protect reservoir
    productivity, the fracture section should be drilled with a compatible fluid (weighted
    brine via coiled tubing) rather than conventional weighted mud, and a contingency
    lost-circulation sealing system should be prepared before drilling through the
    fracture.
