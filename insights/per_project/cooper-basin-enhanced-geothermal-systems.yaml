  source_title: Habanero Geothermal Project Field Development Plan
  publish_date: 2014-10
  project_name: Habanero Geothermal Project
  what_happened: Habanero 4 was drilled successfully through the main fracture without
    significant fluid losses, demonstrating that accurate downhole pressure management
    using SPT fluid modelling (incorporating measured downhole rheology and density)
    combined with a dynamic pressure test at the fracture could reliably keep drilling
    fluid within the narrow pressure window required. It became the most productive
    well drilled in the field, with flow rates above 40 kg/s.
  lesson_learnt: 'Successful drilling through an overpressured EGS granite fracture
    requires: measurement of drilling fluid density and rheology at actual downhole
    temperature and pressure; real-time pressure modelling to calibrate downhole conditions;
    a dynamic pressure test upon fracture penetration to define the allowable operating
    window; and preparation of a contingency lost-circulation pill before drilling
    through the fracture zone.'
