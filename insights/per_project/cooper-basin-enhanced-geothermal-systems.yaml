  source_title: Habanero Geothermal Project Field Development Plan
  publish_date: 2014-10
  project_name: Habanero Geothermal Project
  what_happened: The FDP found that EGS electricity generation at the Habanero resource
    is not commercially competitive with gas-fired generation in the Cooper Basin.
    The estimated specific installed capital cost (~USD $20,000+/kWe) was significantly
    higher than all conventional geothermal benchmarks and most EGS European estimates,
    driven by HPHT well costs (~56% of total CAPEX), high-pressure brine system costs,
    and remote location. The base 6-well, 7 MWe project was estimated to cost ~AUD
    $182 million including contingency.
  lesson_learnt: 'Small-scale HPHT EGS electricity projects in remote locations face
    a fundamental commercial viability challenge: well costs alone typically exceed
    the total installed cost of conventional geothermal projects, and the absence
    of scale economies at 5–10 MWe compounds this disadvantage. Commercial viability
    assessments for EGS should benchmark total specific CAPEX against realistic competing
    generation costs at the project site rather than against grid electricity prices.'
