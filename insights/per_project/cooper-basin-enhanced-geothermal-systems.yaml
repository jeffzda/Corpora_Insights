- record_id: ARENA-DLV-15355
  source_title: Habanero Geothermal Project Field Development Plan
  publish_date: 2014-10
  project_name: Habanero Geothermal Project
  what_happened: 'Completions were installed in multiple Habanero wells as a mitigation
    measure but caused significant problems every time: on Habanero 4, the closed
    annulus volume created large pressure swings as trapped fluid expanded with temperature,
    generating loads larger than those the completion was intended to prevent; the
    polished bore receptacle (PBR) seals — tested at high temperature but not specified
    for low stimulation temperatures — failed during flow testing, causing pressure
    communication between the 7-inch annulus and the production tubing.'
  lesson_learnt: 'Completions in HPHT EGS wells introduce greater risk than they mitigate:
    the closed annulus creates unmanageable pressure build-up, and seal specifications
    must cover the full temperature range including stimulation cold conditions, not
    just production temperatures. For Habanero-type wells, a two-string fully cemented
    design without a completion is the preferred approach.'
