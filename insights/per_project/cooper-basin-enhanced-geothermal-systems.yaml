- record_id: ARENA-DLV-15351
  source_title: Habanero Geothermal Project Field Development Plan
  publish_date: 2014-10
  project_name: Habanero Geothermal Project
  what_happened: Habanero 1, the first EGS well drilled, encountered an unanticipated
    overpressured reservoir fracture at 4,253 m. Attempts to control the influx by
    increasing drilling fluid density caused fluid losses into the main fracture,
    permanently damaging permeability. A total of 241 days were spent on the well
    with 143 days of lost time.
  lesson_learnt: In HPHT EGS wells, the narrow pressure window around an overpressured
    fracture must be characterised before attempting weight-up; failing to do so risks
    permanently damaging reservoir permeability through loss of whole drilling fluid
    into the fracture — this damage proved impossible to fully remediate across subsequent
    wells and stimulations.
