- record_id: ARENA-DLV-1808
  source_title: ARENA Insights Forum November 2018 DER Summary
  publish_date: 2019-04
  project_name: ARENA DER Portfolio (cross-cutting finding)
  what_happened: Forum participants across multiple sessions identified that traditional
    assumptions — that price signals are the primary driver of customer energy behaviour
    — are not well supported by evidence; for example, rising electricity prices had
    not triggered significant retail switching despite expectations.
  lesson_learnt: Project teams designing DER programmes that rely on price signals
    to drive customer participation or behaviour change should validate this assumption
    with behavioural evidence specific to their customer segment before finalising
    programme design — stated preferences and revealed preferences diverge significantly
    in energy markets.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: concept/feasibility
  proponent_type: network business
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: commercial & market
  intervention_note: null
  transferability: broad
  delay_magnitude: null
  technology_domain: demand response
  source_pages: &id002
  - 3
  evidence_excerpt: Traditional thinking is that price signals drive customer behaviour;
    however, there appears to be little evidence to support this (e.g. despite rising
    electricity prices, very few households are switching retailers). One reason is
    that the energy industry has told customers that the market is complex, which
    has subsequently suppressed the market response.
  confidence_note: 'secondary_failure_mode commercial/demand failure included because
    the suppressed market response directly represents a commercial uptake failure
    across DER programmes relying on price-driven participation.; project_scale_band
