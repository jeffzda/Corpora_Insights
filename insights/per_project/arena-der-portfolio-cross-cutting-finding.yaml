- record_id: ARENA-DLV-1807
  source_title: ARENA Insights Forum November 2018 DER Summary
  publish_date: 2019-04
  project_name: ARENA DER Portfolio (cross-cutting finding)
  what_happened: 'Across at least 120 DER-related projects (70 ARENA-funded) trialling
    DER grid integration in Australia, a consistent gap was identified: lessons learnt
    from individual projects were not being systematically shared or built upon across
    the industry, creating duplicated effort and knowledge fragmentation.'
  lesson_learnt: With 70+ ARENA-funded DER projects running concurrently, structured
    knowledge-sharing mechanisms are essential to prevent duplication and compound
    learning; portfolio-level knowledge synthesis (such as DEIP) should be resourced
    as a primary deliverable alongside individual project grants.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: close-out/post-project review
  proponent_type: network business
  delay_category: null
