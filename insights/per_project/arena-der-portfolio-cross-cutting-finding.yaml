  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: ARENA established the Distributed Energy Integration Program
    (DEIP) — a collaboration of 11 organisations — to identify all DER-related projects,
    stakeholders, and information gaps and coordinate knowledge sharing across the
    domestic landscape.
  transferability: broad
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id001
