  evidence_excerpt: There are at least 120 projects, 70 of which are funded by ARENA,
    that are trialling DER integration into the grid. There is an opportunity for
    DEIP and the broader industry to build on the lessons learnt through collaboration
    and information sharing. There is no shortage of interest in DER and the need
    for knowledge sharing.
