- record_id: ARENA-DLV-59219
  source_title: Biogas Opportunities for Australia
  publish_date: 2019-03
  project_name: Australian biogas sector (portfolio-level)
  what_happened: Distance between feedstock sources and biogas plant locations was
    identified as a material barrier to project feasibility in Australia, with greater
    distances increasing feedstock transport costs and reducing project economics.
    The tyranny of distance was particularly acute for co-digestion plants collecting
    feedstock from multiple sources.
  lesson_learnt: Site selection for Australian biogas projects must prioritise minimising
    feedstock transport distance — optimal plant sizing should be determined by feedstock
    availability within a commercially viable radius, not by maximising nameplate
    capacity; co-location with a primary large feedstock source (e.g. WWTP, abattoir,
    piggery) and supplementary feedstocks within short range is the preferred configuration.
  issue_severity: moderate
