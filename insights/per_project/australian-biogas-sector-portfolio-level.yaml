- record_id: ARENA-DLV-59209
  source_title: Biogas Opportunities for Australia
  publish_date: 2019-03
  project_name: Australian biogas sector (portfolio-level)
  what_happened: The Australian biogas industry in 2019 had no operating biomethane
    upgrading and grid injection plants, and no regulatory mechanism for injection
    of biomethane into the gas grid, despite biomethane being technically compatible
    with existing gas network infrastructure. The ERF and RET mechanisms were not
    applicable to biomethane production or grid injection.
  lesson_learnt: Biomethane grid injection projects cannot currently be developed
    in Australia due to the absence of an injection mechanism and supporting regulatory
    framework — proponents considering grid injection should engage with Energy Networks
    Australia and government early to understand the pathway to regulatory enablement
    before committing to project design.
