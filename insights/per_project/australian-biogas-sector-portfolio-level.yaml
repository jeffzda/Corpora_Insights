- record_id: ARENA-DLV-59221
  source_title: Biogas Opportunities for Australia
  publish_date: 2019-03
  project_name: Australian biogas sector (portfolio-level)
  what_happened: Feedstock quality was identified as a key variable affecting anaerobic
    digestion process performance and biogas yield, with feedstock testing before
    project establishment required to confirm actual methane content. Biogas yield
    can vary considerably for the same feedstock type based on dry matter content,
    storage and handling conditions, and reaction with other feedstocks.
  lesson_learnt: Always conduct feedstock testing prior to project design finalisation
    — indicative yield figures from literature are insufficient to size digesters
    and CHP equipment accurately; actual methane content, dry matter content, and
    contamination levels must be confirmed through laboratory analysis of representative
    samples from the specific supply sources.
