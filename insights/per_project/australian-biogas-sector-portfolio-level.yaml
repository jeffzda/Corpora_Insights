- record_id: ARENA-DLV-59213
  source_title: Biogas Opportunities for Australia
  publish_date: 2019-03
  project_name: Australian biogas sector (portfolio-level)
  what_happened: Proactive community engagement was identified by project developers
    as a critical first step for the success of biogas projects in Australia. Although
    few social acceptance issues had been encountered to date (most projects being
    located outside populated areas), developers noted that failure to implement rigorous
    stakeholder engagement plans could result in community opposition and considerable
    difficulties in project development.
  lesson_learnt: Implement structured community engagement plans from the earliest
