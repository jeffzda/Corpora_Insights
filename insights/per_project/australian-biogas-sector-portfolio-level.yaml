  project_name: Australian biogas sector (portfolio-level)
  what_happened: Inconsistent and unclear regulation of digestate across Australian
    states — where it can be classified as waste, biosolid, or compost depending on
    the state and treatment level — was found to prevent project proponents from reliably
    monetising digestate as a commercial product, reducing project revenue and viability.
  lesson_learnt: Digestate revenue should be treated as uncertain in Australian biogas
    project financial models until state-specific regulatory classification is confirmed
    — proponents should obtain written regulatory guidance from the relevant state
    EPA on digestate classification before finalising project design and revenue projections.
