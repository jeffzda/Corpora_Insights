  what_happened: The lack of widespread industry experience with anaerobic digestion
    in Australia — including limited reliable operational data, absence of design
    guidelines, and shortage of experienced operators — resulted in higher development
    and operational risk, particularly around generator sizing (over/under capacity)
    and plant management.
  lesson_learnt: Australian biogas projects should budget for experienced operational
    support, particularly for process monitoring and control during ramp-up — under-sizing
    this resource is a documented failure mode; proponents should consider contractual
    arrangements with international experienced operators for the first 1–2 years
    of operation.
