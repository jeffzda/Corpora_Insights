- record_id: ARENA-DLV-59220
  source_title: Biogas Opportunities for Australia
  publish_date: 2019-03
  project_name: Australian biogas sector (portfolio-level)
  what_happened: The bioCNG and bioLNG produced from biomethane were subject to the
    same excise duty as fossil-origin CNG and LNG under Australian tax law, removing
    any fuel-cost advantage for biomethane-based transport fuels and acting as a barrier
    to development of biomethane vehicle fuel projects.
  lesson_learnt: Biomethane vehicle fuel projects in Australia must factor in excise
    duty on bioCNG and bioLNG as a cost parity barrier — proponents should model transport
    fuel projects on the assumption that excise parity with fossil CNG/LNG will persist
    and only proceed if the project remains viable under that scenario, unless regulatory
    change is secured in advance.
