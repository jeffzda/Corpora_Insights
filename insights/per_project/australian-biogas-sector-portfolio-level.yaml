- record_id: ARENA-DLV-59211
  source_title: Biogas Opportunities for Australia
  publish_date: 2019-03
  project_name: Australian biogas sector (portfolio-level)
  what_happened: Non-uniform waste levies across Australian states (ranging from nil
    in some states to A$141.20/tonne in NSW in 2018–19) created perverse outcomes
    where waste was redirected to lower-levy states rather than being diverted to
    anaerobic digestion, undermining the financial case for biogas projects dependent
    on gate fee revenues.
  lesson_learnt: Biogas projects relying on waste treatment gate fees as a revenue
    stream face material commercial risk from inter-state waste diversion driven by
    levy differentials — proponents should stress-test financial models against scenarios
    where feedstock supply is reduced by interstate competition, and engage early
    with state EPA on anticipated levy trajectory.
