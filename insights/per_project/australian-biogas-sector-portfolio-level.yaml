- record_id: ARENA-DLV-59208
  source_title: Biogas Opportunities for Australia
  publish_date: 2019-03
  project_name: Australian biogas sector (portfolio-level)
  what_happened: Feedstock suppliers in Australia were found to be reluctant to sign
    long-term supply agreements for co-digestion biogas projects, citing concerns
    about supply shortage risk. This was compounded by non-uniform state waste levies
    making it difficult to fix revenues from waste treatment, and by potentially long
    distances between feedstock sources and plant locations increasing transport costs.
  lesson_learnt: Securing long-term feedstock supply contracts is one of the most
    critical and difficult steps in co-digestion biogas project development in Australia
    — proponents should engage potential suppliers early, consider offering higher
    rates for consistent clean feedstock supply (as practised in Denmark), and structure
    agreements that share supply-shortage risk rather than placing it entirely on
    the supplier.
