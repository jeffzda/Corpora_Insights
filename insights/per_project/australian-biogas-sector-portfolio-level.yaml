  source_title: Biogas Opportunities for Australia
  publish_date: 2019-03
  project_name: Australian biogas sector (portfolio-level)
  what_happened: Private financing for Australian biogas projects was found to be
    difficult to secure, with lenders and investors deterred by the combination of
    unproven financial viability, the relative newness of the anaerobic digestion
    sector in Australia, and the complexity of revenue stacking across multiple income
    streams.
  lesson_learnt: Biogas project proponents in Australia should treat private financing
    as a critical path item requiring early and sustained engagement — given lender
    unfamiliarity with the sector, proponents should prepare detailed reference-class
    evidence from comparable overseas or Australian projects and consider CEFC or
    ARENA co-financing to de-risk the first tranche of private debt or equity.
