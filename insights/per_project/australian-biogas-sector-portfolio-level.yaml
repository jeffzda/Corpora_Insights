  project_name: Australian biogas sector (portfolio-level)
  what_happened: Project developers and plant operators across Australia highlighted
    that approval processes for biogas plants — covering local authority planning
    approvals, access to support mechanisms (e.g. ACCUs), and grid connection with
    electricity and gas network operators — are excessively complex and can take several
    years, acting as a strong barrier to sector development.
  lesson_learnt: Biogas project timelines should budget for multi-year approval processes
    across planning, ACCU access, and grid connection — proponents should engage local
    authorities, network operators, and the Clean Energy Regulator concurrently from
    early development, not sequentially, to avoid compounding delays.
