- record_id: ARENA-DLV-59205
  source_title: Biogas Opportunities for Australia
  publish_date: 2019-03
  project_name: Australian biogas sector (portfolio-level)
  what_happened: Biogas project developers across Australia reported that behind-the-meter
    (on-site consumption) projects consistently demonstrate better financial viability
    than grid-export projects, primarily because on-site consumption avoids the complexity
    of securing power purchase agreements and is insulated from LGC price uncertainty
    as the 2020 RET target approaches.
  lesson_learnt: Design biogas projects for maximum on-site energy consumption first
    — behind-the-meter configurations avoid LGC price risk and PPA complexity, producing
    stronger financial cases; only pursue grid export after on-site demand is fully
    served.
