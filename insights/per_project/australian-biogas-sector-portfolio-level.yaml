  what_happened: In 2017, approximately half of all landfill gas collected in Australia
    was being flared rather than used for energy generation, due to insufficient infrastructure
    for conversion to electricity and the lower methane content of landfill gas compared
    to anaerobic digestion biogas.
  lesson_learnt: Landfill gas-to-energy projects must account for lower methane content
    and higher impurity levels compared to purpose-built anaerobic digestion — feasibility
    studies should confirm minimum CH4 content thresholds for the chosen conversion
    technology (CHP or upgrading) before committing to capital expenditure on gas
    utilisation infrastructure.
