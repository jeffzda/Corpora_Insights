- record_id: ARENA-DLV-15827
  source_title: Evaluation of ARENA's Impact and Effectiveness
  publish_date: 2019-11
  project_name: ARENA knowledge sharing — early programs
  what_happened: Knowledge sharing requirements in earlier ARENA funding programs
    (ARP, ABIR, RAR) were found to be complex and not always fit-for-purpose. Reports
    from the DER Integration Project were not being targeted to specific audiences
    or industries, reducing their effectiveness. Multiple evaluations recommended
    simplifying and clarifying KSP objectives.
  lesson_learnt: Knowledge sharing obligations in funding agreements must specify
    the target audience and required format — generic publication requirements produce
    reports that fail to reach or inform the specific market participants who could
    act on the findings.
