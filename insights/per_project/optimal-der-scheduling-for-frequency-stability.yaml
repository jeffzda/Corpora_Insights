  what_happened: Both the consensus and sequential coordination frameworks were demonstrated
    to execute within the 5-minute NEM dispatch interval even for the largest test
    network (Burnie, 2813 buses, 2541 loads with 100% PV and 40% BESS penetration),
    with the MV-LV network-secure consensus framework averaging 7.9 s and the sequential
    framework completing in under 1.19 s (not including communication overhead).
  lesson_learnt: Network-secure DER coordination algorithms are computationally feasible
    within NEM 5-minute dispatch timescales even at very large network scale and high
    DER penetration; communication latency between aggregators and DSO — not computation
    — is likely to be the binding constraint on real-time deployment and should be
    addressed in system architecture design.
