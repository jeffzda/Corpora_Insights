- record_id: ARENA-DLV-38923
  source_title: Optimal DER Scheduling for Frequency Stability Study Report
  publish_date: 2022-02
  project_name: Optimal DER Scheduling for Frequency Stability
  what_happened: The study identified that BESS providing PFC with aggressive droop
    has limited additional benefit in today's high-inertia Australian power system
    because the battery must 'wait' for frequency to deviate sufficiently to elicit
    a response, meaning fast response capability is wasted; the same aggressive droop
    and fast response becomes highly valuable in future low-inertia systems.
  lesson_learnt: Specifying aggressive droop and fast response time for BESS contracted
    for PFC today imposes no operational disadvantage and positions these assets to
    provide disproportionate frequency support value as system inertia declines; system
    procurers should therefore include these parameters in current BESS contracts
    and connection standards as a forward-compatible requirement.
