  source_title: Optimal DER Scheduling for Frequency Stability Study Report
  publish_date: 2022-02
  project_name: Optimal DER Scheduling for Frequency Stability
  what_happened: The study identified that even moderate levels of DER market participation
    (40% of customers with PV, 10% with batteries) produce distribution network constraint
    violations if aggregator bids are not coordinated with the DSO, because wholesale
    market price signals cause synchronised all-or-nothing aggregator bids that push
    network voltages and transformer ratings to their limits.
  lesson_learnt: DER aggregators must coordinate bids with a distribution system operator
    before submitting to wholesale markets even at moderate DER penetrations; absent
    coordination, synchronised market responses will cause LV voltage violations and
    transformer overloads that would result in the aggregator failing to deliver contracted
    FCAS, risking NEM expulsion.
