  project_name: Optimal DER Scheduling for Frequency Stability
  what_happened: The study found that the profit reduction from imposing MV-LV network
    security constraints (versus unconstrained bidding) grows with DER penetration,
    reaching a maximum of 13% profit loss at 100% PV / 40% BESS penetration in Sandy
    Bay, and 10.2% in Burnie, with Sandy Bay exhibiting more binding constraints due
    to a higher number of network violations under unconstrained conditions.
  lesson_learnt: The cost of network security constraints on aggregator profitability
    can be quantified and used directly in business case analysis for distribution
    network upgrades; where the profit lost to network constraints exceeds the annualised
    cost of targeted network reinforcement, upgrade projects can be justified on DER
    enablement grounds alone.
