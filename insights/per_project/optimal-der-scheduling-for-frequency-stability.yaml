- record_id: ARENA-DLV-38903
  source_title: Optimal DER Scheduling for Frequency Stability Study Report
  publish_date: 2022-02
  project_name: Optimal DER Scheduling for Frequency Stability
  what_happened: Simulations showed that reducing BESS inverter response time from
    0.5 s to 0.1 s (while retaining current droop of 0.7%) reduces the required BESS
    capacity to meet FOS limits by approximately 90%, from ~42 GW to ~4.4 GW; further
    reducing the dead-band to 0.015 Hz reduces required capacity to approximately
    8% of total system load (~2.7 GW).
  lesson_learnt: Optimising BESS inverter response time and dead-band settings can
    reduce the aggregate BESS capacity needed to maintain frequency stability by up
    to 90%; specifying these parameters in procurement and connection standards for
    new BESS assets will dramatically reduce the total installed capacity required
    for system frequency support.
