- record_id: ARENA-DLV-38908
  source_title: Optimal DER Scheduling for Frequency Stability Study Report
  publish_date: 2022-02
  project_name: Optimal DER Scheduling for Frequency Stability
  what_happened: Simulations showed that synthetic inertia (SI) becomes essential
    for frequency stability at renewable penetration levels above approximately 95–96%,
    where even fast-responding BESS without SI yields RoCoF of ~1.5 Hz/s (above safe
    threshold); SI with coefficient H=3 reduces RoCoF by approximately 30% and improves
    frequency nadir at these penetration levels.
  lesson_learnt: System planners and BESS aggregators should incorporate synthetic
    inertia control in BESS dispatch strategies as a requirement specifically for
    very high renewable penetration scenarios (>94–95% instantaneous non-synchronous
    generation); below this threshold, optimising BESS response parameters provides
    comparable benefit at lower control complexity.
