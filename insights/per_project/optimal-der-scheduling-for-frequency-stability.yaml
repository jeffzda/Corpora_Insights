  source_title: Optimal DER Scheduling for Frequency Stability Study Report
  publish_date: 2022-02
  project_name: Optimal DER Scheduling for Frequency Stability
  what_happened: The study identified that existing dynamic operating envelope approaches
    (equal allocation and voltage-sensitivity-based allocation) ignore customer and
    aggregator preferences when allocating network capacity, leading to inefficient
    outcomes — particularly when customers are heterogeneous in DER ownership, tariffs,
    and habits — whereas the consensus and sequential frameworks allocate capacity
    based on market value, improving efficiency.
  lesson_learnt: Dynamic operating envelope approaches that allocate network capacity
    without considering customer/aggregator preferences and intentions systematically
    waste network capacity and reduce DER market value; frameworks that factor in
    the economic preferences of participants when allocating operating envelopes will
    be materially superior as customer heterogeneity increases.
