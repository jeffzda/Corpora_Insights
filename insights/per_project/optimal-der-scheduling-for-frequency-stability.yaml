- record_id: ARENA-DLV-38906
  source_title: Optimal DER Scheduling for Frequency Stability Study Report
  publish_date: 2022-02
  project_name: Optimal DER Scheduling for Frequency Stability
  what_happened: Simulations showed that there is currently no mandated open-loop
    response time specification for the frequency-watt function of BESS inverters
    in Australia, with manufacturers selecting response times anywhere between 50
    ms and 3 s, creating significant variability in the frequency support capability
    of installed BESS.
  lesson_learnt: Regulators and standards bodies should mandate a maximum response
    time (≤0.2 s) for the frequency-watt function of BESS inverters; the absence of
    this specification allows manufacturers to install slow-responding units that
    are ineffective for primary frequency control in low-inertia systems.
