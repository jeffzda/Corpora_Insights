  what_happened: The study found that elastic bidding (where aggregators submit bid
    stacks across multiple price bands rather than a single price-taking inelastic
    bid) reduces the profit gap from a perfect-information baseline from 12% (inelastic)
    to 10% (elastic), and that this gap is expected to increase as DER market share
    grows and prices become more volatile and difficult to forecast.
  lesson_learnt: DER aggregators should develop elastic (multi-price-band) bidding
    capability for FCAS and energy markets, particularly as DER penetration increases
    and price forecasting becomes harder; inelastic price-taking bidding strategies
    will increasingly underperform as market price volatility grows with renewables
    penetration.
