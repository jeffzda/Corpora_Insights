  source_title: Optimal DER Scheduling for Frequency Stability Study Report
  publish_date: 2022-02
  project_name: Optimal DER Scheduling for Frequency Stability
  what_happened: Simulations showed that combining and optimising both response time
    and dead-band simultaneously (reducing from 0.5 s/0.15 Hz to 0.1 s/0.015 Hz) reduces
    optimal BESS capacity for FOS compliance by approximately 93%, to approximately
    3% of total system load, whereas reducing only a single parameter is insufficient
    to meet FOS limits at low BESS capacity with current droop settings.
  lesson_learnt: BESS frequency control parameters (response time, dead-band, and
    droop) must be co-optimised together rather than adjusted in isolation; procurement
    specifications and grid codes should set minimum requirements for all three parameters
    simultaneously rather than addressing each independently.
