- record_id: ARENA-DLV-38926
  source_title: Optimal DER Scheduling for Frequency Stability Study Report
  publish_date: 2022-02
  project_name: Optimal DER Scheduling for Frequency Stability
  what_happened: 'The study was constrained to a lumped, network-free approach for
    frequency response simulations and a limited number of distribution network case
    studies, leaving key questions unresolved: impact of transmission network topology,
    inter-area oscillations, diverse DER mixes, unbalanced networks, forecast uncertainty,
    and real pricing mechanisms for aggregators.'
  lesson_learnt: 'Future studies on DER frequency control should extend to include:
    full transmission network models with multiple DER locations; diverse distribution
    network topologies including unbalanced LV networks; robust scheduling optimisation
    under forecast uncertainty (price, demand, generation); and real pricing mechanisms
    for operating envelopes — each of these gaps limits direct applicability of current
    findings to actual network planning.'
