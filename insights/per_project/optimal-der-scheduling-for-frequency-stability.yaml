- record_id: ARENA-DLV-38924
  source_title: Optimal DER Scheduling for Frequency Stability Study Report
  publish_date: 2022-02
  project_name: Optimal DER Scheduling for Frequency Stability
  what_happened: The study identified that currently available frequency-watt control
    in BESS inverters will likely take several years to aggregate enough enabled capacity
    to have a significant system-level benefit, because deployed BESS units were not
    installed with these operational parameters enabled or specified.
  lesson_learnt: Retrofitting or reprogramming existing BESS fleet units to enable
    frequency-watt control should be prioritised by aggregators and system operators;
    without a deliberate programme to activate frequency-watt capability on already-installed
    units, the benefit of installed BESS capacity for frequency support will not materialise
    for years, creating a gap in system frequency capability during the inertia transition.
