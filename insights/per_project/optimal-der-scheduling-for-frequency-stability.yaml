- record_id: ARENA-DLV-38907
  source_title: Optimal DER Scheduling for Frequency Stability Study Report
  publish_date: 2022-02
  project_name: Optimal DER Scheduling for Frequency Stability
  what_happened: Simulations showed that the benefit of adding synthetic inertia (SI)
    control to BESS is strongly dependent on the underlying BESS operational parameters;
    for a slow-responding BESS (0.5 s, 0.15 Hz dead-band), adding SI with coefficient
    6 reduces required BESS capacity by 80%, while for a fast-responding BESS (0.1
    s, 0.015 Hz), the same SI addition reduces required capacity by only about 35%.
  lesson_learnt: Synthetic inertia in BESS control provides the greatest benefit when
    paired with slower-responding BESS configurations and at very high renewable penetration
    (>94%); for fast-responding BESS with optimised parameters, the incremental value
    of synthetic inertia is limited — investment in SI control should be prioritised
    where BESS response parameters cannot otherwise be improved.
