  what_happened: Simulations comparing grid-forming (GFM) and grid-following (GFL)
    BESS inverter control showed that GFM provides significantly better frequency
    nadir and damping performance at high renewable penetration (>86%), but below
    ~86% instantaneous RE penetration the performance difference between GFM and optimised
    GFL (response time <0.1 s) is negligible.
  lesson_learnt: Grid-forming inverter control should be prioritised for BESS deployed
    in systems where instantaneous renewable penetration regularly exceeds 86%; for
    lower penetration scenarios, optimising GFL parameters (response time <0.1 s,
    dead-band <0.07 Hz) achieves near-equivalent frequency performance at lower technology
    cost and complexity.
