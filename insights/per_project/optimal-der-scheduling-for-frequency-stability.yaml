  what_happened: There is no current dead-band standard for GFM inverters in the NEM;
    simulations showed that dead-band selection significantly affects GFM BESS capacity
    requirements, with a 50% reduction in dead-band reducing required GFM BESS capacity
    by approximately 130% at 96% RE penetration.
  lesson_learnt: Standards bodies should urgently establish a dead-band specification
    for GFM inverters before large-scale deployment; without a standard, capacity
    sizing calculations for GFM BESS will be unreliable and actual installed capacity
    may be insufficient to maintain frequency stability.
