  what_happened: Simulations demonstrated that GFM BESS requires roughly constant
    installed capacity to maintain FOS limits across a wide range of RE penetration
    levels (86–96%), whereas GFL BESS capacity requirements grow sharply with increasing
    penetration, because GFM's damping capability is insensitive to penetration level
    while GFL's is not.
  lesson_learnt: GFM-based BESS provides a more future-proof investment for frequency
    support in systems transitioning to high renewables, as its capacity requirement
    does not scale dramatically with increasing penetration; system planners sizing
    BESS for long-lived assets should account for the growing capacity penalty of
    GFL at penetration levels above 86%.
