  project_name: Optimal DER Scheduling for Frequency Stability
  what_happened: The network-free DSO model (no network constraints accounted for)
    produced 15,151 undervoltage and 15,356 overvoltage violations in the LV network
    across five feeders in a single case study day, and 309 MV/LV transformer congestion
    violations, all of which would have caused DER to trip and the aggregator to fail
    its FCAS obligations.
  lesson_learnt: Aggregators bidding into FCAS markets without a distribution-network-aware
    DSO coordination layer face systematic and large-scale network violations at moderate
    DER penetration; LV voltage and transformer thermal limits — not MV limits — are
    the binding constraints, requiring MV-LV (not MV-only) network modelling for effective
    coordination.
