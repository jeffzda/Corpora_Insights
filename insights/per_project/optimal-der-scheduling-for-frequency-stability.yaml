- record_id: ARENA-DLV-38902
  source_title: Optimal DER Scheduling for Frequency Stability Study Report
  publish_date: 2022-02
  project_name: Optimal DER Scheduling for Frequency Stability
  what_happened: Simulations showed that with current AEMO droop (0.7%) and dead-band
    (0.15 Hz) settings and default inverter response time of 0.5 s, the required BESS
    capacity to maintain NEM Frequency Operating Standard limits after a 750 MW contingency
    event in a 97% renewable scenario exceeds 40 GW — more than the total NEM system
    load of 34 GW — making the current parameter settings unworkable for future low-inertia
    systems.
  lesson_learnt: 'Current NEM BESS droop, dead-band, and inverter response time settings
    are incompatible with future high-renewable, low-inertia operation; regulators
    and asset owners should review and tighten these parameters (target: response
    time <0.2 s, dead-band <0.07 Hz, droop 0.3–0.7%) before aggregate BESS capacity
    reaches system-significant levels.'
