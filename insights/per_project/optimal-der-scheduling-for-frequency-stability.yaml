- record_id: ARENA-DLV-38901
  source_title: Optimal DER Scheduling for Frequency Stability Study Report
  publish_date: 2022-02
  project_name: Optimal DER Scheduling for Frequency Stability
  what_happened: Simulations demonstrated that as renewable penetration increases
    beyond 40% in the Queensland system (with PFC provided only by synchronous generators),
    frequency response degrades severely — higher RoCoF, larger frequency excursions,
    increased oscillation, and longer settling times — with over-frequency generator
    shedding triggered above 40% penetration.
  lesson_learnt: As synchronous generation is displaced by renewables, frequency response
    from synchronous generators alone becomes inadequate well before 100% renewable
    penetration; system planners should model frequency response degradation at each
    incremental penetration step and identify the threshold at which additional fast-response
    resources (e.g. BESS/DER) become essential.
  issue_severity: major
  project_type: software/data/digital
