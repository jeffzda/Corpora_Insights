  source_title: Optimal DER Scheduling for Frequency Stability Study Report
  publish_date: 2022-02
  project_name: Optimal DER Scheduling for Frequency Stability
  what_happened: Simulations demonstrated that aggressive BESS droop settings (low
    droop %) paired with slow response times and large dead-bands cause higher frequency
    oscillations and output power saturation at low BESS capacity, potentially introducing
    instability rather than improving frequency response.
  lesson_learnt: When deploying BESS with aggressive droop settings, the power response
    time constant and dead-band must first be reduced to avoid oscillatory instability;
    aggressive droop alone without matching fast response time and small dead-band
    can worsen frequency outcomes compared to default settings.
