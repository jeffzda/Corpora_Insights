- record_id: ARENA-DLV-38925
  source_title: Optimal DER Scheduling for Frequency Stability Study Report
  publish_date: 2022-02
  project_name: Optimal DER Scheduling for Frequency Stability
  what_happened: The study found that the current NEM market structure requires batteries
    to submit separate bids under different identifiers for import and export, adding
    complexity to DER aggregator participation; the sequential framework assumed a
    simplified unified import/export bid — a change AEMO was already considering —
    demonstrating the potential for simplified market participation.
  lesson_learnt: Market rule reforms allowing DER and batteries to submit a single
    unified import/export bid (rather than separate identifiers) would materially
    reduce complexity for aggregators and improve bidding efficiency; ARENA-funded
    projects and market bodies should advocate for this change as a prerequisite for
    effective DER FCAS participation at scale.
