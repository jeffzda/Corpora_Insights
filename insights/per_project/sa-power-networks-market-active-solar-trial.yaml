- record_id: ARENA-DLV-51478
  source_title: UTS - Flexible Demand State of Play in Australia - Report
  publish_date: 2024-05
  project_name: SA Power Networks – Market Active Solar Trial
  what_happened: In the first nine months of the Market Active Solar Trial, 168 customers
    signed up, which was considered a success, but enrolment was constrained by lack
    of awareness, limited compatible technology, up-front costs, additional installation
    time, and a only a 12-month guarantee of flexible exports that reduced perceived
    value.
  lesson_learnt: Flexible export product take-up is constrained by a combination of
    awareness, hardware availability, cost, and contract length barriers — offering
    longer revenue guarantees (beyond 12 months) and ensuring compatible hardware
    is widely available through mainstream retail channels are both important levers
    for increasing enrolment at scale.
