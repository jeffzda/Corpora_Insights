  what_happened: Key challenges were identified across the 10 RERT demand response
    pilot projects in recruiting and retaining small customers, and in establishing
    efficient and permissioned access to meter data.
  lesson_learnt: Demand response programmes targeting small customers face persistent
    barriers in customer recruitment and retention, and in obtaining permissioned
    meter data access — programme designers should build dedicated customer engagement
    and streamlined metering data access pathways into project design from the outset.
