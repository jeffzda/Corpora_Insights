- record_id: ARENA-DLV-45509
  source_title: ARENA Insights Forum Presentation Summaries & Key Points – DER Stream
  publish_date: 2019-06
  project_name: Solar Enablement Initiative – Distribution State Estimation (University
    of Queensland)
  what_happened: Distribution network businesses lacked sufficient visibility of operational
    conditions on their networks, leading them to take conservative approaches to
    assessing and approving DER connections, constraining DER uptake.
  lesson_learnt: Apply state estimation techniques to distribution networks before
    assessing DER connection applications — improved operational visibility allows
    networks to move away from overly conservative connection assessments, enabling
    higher DER penetration without compromising network management.
