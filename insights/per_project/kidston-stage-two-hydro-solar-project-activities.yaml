  project_name: Kidston Pumped Storage Hydro Project (K2-Hydro)
  what_happened: MLF modelling showed that a co-located 270MW solar farm at Kidston
    would cause a declining trend in MLFs over time as increased local generation
    flows south, reducing the net generation MLF for K2-Hydro relative to operation
    without the solar farm.
  lesson_warnt: Co-location of large-scale solar generation with a PSH facility at
    a remote node can materially reduce the PSH project's net generation MLF over
    time — developers evaluating hybrid hub configurations should model the MLF interaction
    between co-located generation and storage assets explicitly, as the combined effect
    can be adverse for PSH revenue.
