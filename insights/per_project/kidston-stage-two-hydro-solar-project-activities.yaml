- record_id: ARENA-DLV-64505
  source_title: Kidston Pumped Storage Hydro Report
  publish_date: 2021-07
  project_name: Kidston Pumped Storage Hydro Project (K2-Hydro)
  what_happened: For PSH, competitive pricing was only available for the specialised
    electromechanical equipment (via a tender process won by ANDRITZ); the balance
    of EPC civil works had no competitive tension because only the incumbent JV was
    engaged through the ECI process.
  lesson_learnt: PSH developers should expect limited price competition for civil
    EPC works given the small pool of capable contractors; mitigate this through open-book
    pricing, pre-agreed contingency and profit margins, and deep familiarity with
    contractor estimating tools — these mechanisms can substitute for market competition
    on FOAK projects.
  issue_severity: moderate
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: procurement/supply chain
  failure_mode: coordination & stakeholders
  outcome_class: re-scoped/adapted
  secondary_failure_mode: execution & logistics
  intervention_note: Lack of price competition was mitigated by the open-book process,
    pre-agreement on contingency and profit margins, and close familiarity of Genex
    personnel with contractor estimating tools and risk philosophies.
  transferability: moderate
  delay_magnitude: null
  technology_domain: pumped hydro
  source_pages: &id005
  - 19
  evidence_excerpt: Whilst competitive pricing was assured for the key equipment supply
    through this tender process, such competitive tension was not available to the
    Project for the balance of the EPC works. However, this lack of price competition
    was largely mitigated by the open book process, pre-agreement on the contingency
    and profit margins in the EPC Contactor's pricing, and the close familiarity of
    Genex personnel with the estimating tools and risk and opportunity philosophies
    of the selected contractors.
