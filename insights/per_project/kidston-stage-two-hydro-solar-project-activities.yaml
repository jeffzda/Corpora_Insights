  project_name: Kidston Pumped Storage Hydro Project (K2-Hydro)
  what_happened: The project required a new 186km 275kV transmission line from Kidston
    to Mt Fox, adding $110.9M (14% of total project cost) to capital expenditure —
    significantly more than projects located closer to the existing transmission network.
