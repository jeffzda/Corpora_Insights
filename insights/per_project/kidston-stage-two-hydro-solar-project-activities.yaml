  source_title: Kidston Pumped Storage Hydro Report
  publish_date: 2021-07
  project_name: Kidston Pumped Storage Hydro Project (K2-Hydro)
  what_happened: Due to the size and complexity of the project, a single EPC contractor
    (McConnell Dowell) was unable to take on the full scope alone; a joint venture
    with John Holland was required. An earlier JV partner (Downer EDI) was replaced
    partway through the ECI process.
  lesson_learnt: For large-scale, complex PSH projects, a single EPC contractor is
    unlikely to have sufficient capacity and complementary skills to take on the full
    scope; plan for a JV structure from the outset and allow for the possibility of
    partner substitution during the ECI phase without assuming this will be cost or
    time neutral.
