  project_name: Kidston Pumped Storage Hydro Project (K2-Hydro)
  what_happened: Lender (NAIF) required a long-term offtake arrangement as a condition
    of maximising debt financing; the project was structured with a high level of
    gearing ($610M debt against $775.5M total cost) supported by a fixed annuity-style
    revenue stream under the ESSA.
  lesson_warnt: PSH projects require a long-term, annuity-style offtake agreement
    to support high gearing ratios necessary for project financing — structure the
    offtake as a fixed availability payment rather than a merchant revenue stream
    to give lenders the revenue certainty they require.
  lesson_learnt: PSH projects require a long-term, annuity-style offtake agreement
    to support the high gearing ratios necessary for project financing — structure
    the offtake as a fixed availability payment rather than a merchant revenue stream
    to give lenders the revenue certainty they require.
