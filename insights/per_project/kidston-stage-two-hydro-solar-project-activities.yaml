- record_id: ARENA-DLV-64506
  source_title: Kidston Pumped Storage Hydro Report
  publish_date: 2021-07
  project_name: Kidston Pumped Storage Hydro Project (K2-Hydro)
  what_happened: Multiple external stakeholders — including EnergyAustralia (offtaker/prospective
    co-owner), J-POWER (strategic investor), NAIF and ARENA (financiers) — all influenced
    the EPC design and scope during the ECI process, resulting in significant time
    and cost delays to the overall financing.
  lesson_learnt: Limit the involvement of external financing and commercial stakeholders
    in EPC design scope decisions during the ECI process; while design input from
    these parties ultimately produced an optimal outcome, the review, refinement and
    re-costing cycles added material time and cost to project development — establish
    a clear design freeze gate before inviting financier due diligence.
