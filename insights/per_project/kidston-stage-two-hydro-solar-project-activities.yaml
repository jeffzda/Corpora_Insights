- record_id: ARENA-DLV-64518
  source_title: Kidston Pumped Storage Hydro Report
  publish_date: 2021-07
  project_name: Kidston Pumped Storage Hydro Project (K2-Hydro)
  what_happened: K2-Hydro's pumping operation acts as a net load on the network, increasing
    MLFs for co-located and nearby solar farms at the three assessed North Queensland
    connection points in all modelled years, with the benefit most pronounced during
    daytime periods when the project absorbs solar-driven excess generation.
  lesson_learnt: PSH projects acting as a load during solar-peak periods improve MLFs
    for co-located and nearby solar generators — this positive network externality
    should be modelled and, where possible, monetised or used to support the commercial
    case for co-location of PSH with solar in remote renewable energy hubs.
