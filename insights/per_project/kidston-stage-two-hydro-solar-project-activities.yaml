  project_name: Kidston Pumped Storage Hydro Project (K2-Hydro)
  what_happened: From a project scale and financing perspective, K2-Hydro took approximately
    seven years from site acquisition (June 2014) to financial close (May 2021), including
    a feasibility study, multiple design iterations, an extended ECI process, offtake
    negotiations, and multi-party financing arrangements.
  lesson_learnt: PSH developers should plan for a development timeline of at least
    six to seven years from site acquisition to financial close on a FOAK project
    in Australia — the combination of complex engineering, limited contractor market,
    multi-party financing, and long offtake negotiations is structurally time-consuming
    and cannot be substantially compressed without parallel-tracking all workstreams
    from the earliest feasibility stage.
