    in all years at all three connection points. From 2021-22 to 2028-29, the Project's
    pumping shifts from overnight to midday when solar generation is at its peak.
    This increased daytime pumping provides a load to the network which decreases
    southerly flows out of North Queensland during those periods in the scenario with
