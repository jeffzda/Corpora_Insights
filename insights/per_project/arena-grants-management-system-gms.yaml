- record_id: ARENA-DLV-15808
  source_title: Evaluation of ARENA's Impact and Effectiveness
  publish_date: 2019-11
  project_name: ARENA Grants Management System (GMS)
  what_happened: ARENA's Grants Management System (GMS) caused ongoing dissatisfaction
    among funding recipients. Experienced users described it as 'clunky and unfriendly'
    compared to other systems, and it was primarily used only through the selection
    process rather than end-to-end, unlike systems used by comparable organisations
    such as the ARC and NHMRC.
  lesson_learnt: Grant management systems for multi-stage innovation funding programs
    should support end-to-end project management, not just applicant screening — partial
    coverage forces manual workarounds that increase administrative burden and reduce
    data quality for portfolio oversight.
