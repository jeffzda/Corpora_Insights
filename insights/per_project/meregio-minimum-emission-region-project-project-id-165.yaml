- record_id: ARENA-DLV-72268
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: '2014'
  project_name: MeRegio (Minimum Emission Region) Project (Project ID 165)
  what_happened: The MeRegio E-Energy project in Germany studied 950 residential customers
    given smart meters with dynamic pricing linked to wholesale market conditions.
    Customers reduced energy demand by 5–10% and shifted flexible loads by about 10%
    in response to price signals; however, only one commercial participant responded
    to price signals and the existing regulatory framework was found insufficient
    to support new business models based on project outcomes.
  lesson_learnt: Dynamic pricing and smart meter transparency can achieve meaningful
    residential demand response (5–10% reduction, 10% load shift), but commercial
    customer uptake of price-responsive behaviour is very limited unless electricity
    is a significant cost factor for them; the regulatory framework must also be adapted
    to enable new business models before trial results can be commercialised.
