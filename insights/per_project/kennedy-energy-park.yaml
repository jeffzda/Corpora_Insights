- record_id: ARENA-DLV-25901
  source_title: Review of ARENA's Reliability Portfolio
  publish_date: 2020-01
  project_name: Kennedy Energy Park
  what_happened: Kennedy Energy Park, a renewable energy hub combining wind, solar
    and large-scale storage in North Queensland, reached financial close in October
    2017 and was expected to be operational in October 2018. By July 2019 the park
    was fully constructed and mechanically complete but had not been able to connect
    to the grid due to significant delays in obtaining grid connection, preventing
    any demonstrative learnings from being drawn.
  lesson_learnt: FOAK hybrid renewable projects that combine wind, solar and storage
    at utility scale should anticipate novel commissioning and testing challenges
    across all technology streams; early engagement with regulators and network operators
    on Generator Performance Standards is essential to avoid extended hold point delays.
  issue_severity: critical
  project_type: multi-technology/hybrid
  project_scale_band: first commercial/FOAK
  lifecycle_phase: commissioning/integration
  proponent_type: project developer
  delay_category: commissioning/integration
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: null
  intervention_note: Formed a Technical Working Group with AEMO and Ergon, progressively
    addressed GPS compliance, hold point testing, and modelling discrepancies through
    staged approvals culminating in 50MW endorsement in March 2024 and commercial
    operation in May 2024.
  transferability: moderate
  delay_magnitude: '>3 years'
  technology_domain: hybrid systems
