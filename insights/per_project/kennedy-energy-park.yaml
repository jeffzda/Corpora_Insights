- record_id: ARENA-DLV-15953
  source_title: Kennedy Energy Park - Construction, Connection and Commissioning Report
  publish_date: 2025-05
  project_name: Kennedy Energy Park
  what_happened: The 50 MW hold point testing completion was delayed 54 months beyond
    the original schedule, finally achieved in Q2 2023, due to cascading GPS compliance
    issues, modelling discrepancies, network availability constraints, and harmonic
    emission concerns encountered during staged hold point testing.
  lesson_learnt: Hold point testing programs for novel hybrid plants should be scoped
    with explicit allowance for multiple test re-runs, regulator review cycles, and
    network outage windows — treating hold point testing as a short verification step
    rather than a multi-year compliance pathway is a critical planning error.
