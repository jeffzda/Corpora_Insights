- record_id: ARENA-DLV-15955
  source_title: Kennedy Energy Park - Construction, Connection and Commissioning Report
  publish_date: 2025-05
  project_name: Kennedy Energy Park
  what_happened: Negotiation of KEP's Negotiated Ongoing Connection Contract (NOCC)
    with Ergon was complex and time-consuming because there was no precedent for connecting
    a wind, solar, and battery storage hybrid in the NEM, and KEP was located at the
    extremities of the distribution grid.
  lesson_learnt: For hybrid projects with no NEM connection precedent, allow significantly
    more time and specialist legal and technical resource for negotiating connection
    contracts — standard connection timelines are not applicable when neither the
    proponent nor the DNSP has a reference case to draw on.
