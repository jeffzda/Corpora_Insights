  source_title: Windlab - Kennedy Energy Park - Equipment Testing Plan Report
  publish_date: '2025-05-28'
  project_name: Kennedy Energy Park
  what_happened: Reliability testing for some wind turbine generators (WTGs) was postponed
    beyond Commercial Operations and was not completed until 1 November 2025 because
    curtailment schemes repeatedly interrupted WTG generation during hold point testing,
    preventing WTGs from demonstrating the required sustained reliable performance.
  lesson_learnt: On projects located in constrained networks, curtailment schemes
    should be identified as a risk to hold point and reliability testing timelines
    before commissioning begins; testing plans should include contingency windows
    or alternative testing protocols that can accommodate periods of curtailment.
