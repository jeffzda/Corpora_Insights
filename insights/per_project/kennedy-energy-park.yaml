- record_id: ARENA-DLV-59761
  source_title: Kennedy Park FinClose Report
  publish_date: 2018-01
  project_name: Kennedy Energy Park
  what_happened: Co-locating wind and solar at Kennedy produced a highly complementary
    generation profile — significantly reduced wind generation during daylight hours
    (when PV is productive) and elevated wind at night (when there is no PV generation).
    This complementarity enabled a predicted combined capacity factor of 73% by an
    equivalent AECOM measure, compared with a range of 45–61% for existing Australian
    wind farms with hypothetical co-located solar.
  lesson_learnt: Site selection for hybrid wind/solar projects should prioritise resource
    complementarity (anti-correlation between wind and solar generation profiles)
    as this materially reduces storage requirements for a given renewable penetration
    level and maximises the energy throughput at a single grid connection point.
