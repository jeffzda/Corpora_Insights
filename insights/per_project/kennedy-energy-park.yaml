  source_title: Kennedy Park FinClose Report
  publish_date: 2018-01
  project_name: Kennedy Energy Park
  what_happened: The grid connection process for Kennedy Energy Park was particularly
    complex and time-consuming, resulting in multiple delays and restarts. The NER
    connection process was designed for conventional generation and did not accommodate
    a hybrid wind/solar/storage facility connecting to a weak distribution network,
    causing repeated stalling of progress.
  lesson_learnt: Set clear objectives, deliverables and timeframes agreed between
    the proponent and DNSP at the time of detailed enquiry — the absence of such a
    framework caused repeated delays and restarts on Kennedy. For hybrid projects,
    the complexity is compounded and early alignment is even more critical.
