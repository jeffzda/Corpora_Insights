  what_happened: 'Kennedy Energy Park''s development approval was obtained under pre-existing
    Queensland planning regulations. Shortly after approval, two significant amendments
    came into effect: the State Wind Farm code (22 July 2016) and the replacement
    of the Sustainable Planning Act 2009 with the Planning Act 2016 (July 2017). Future
    hybrid projects will face a more fragmented approval pathway, potentially requiring
    separate state-level applications for wind and local council applications for
    solar.'
