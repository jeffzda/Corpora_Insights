- record_id: ARENA-DLV-59760
  source_title: Kennedy Park FinClose Report
  publish_date: 2018-01
  project_name: Kennedy Energy Park
  what_happened: A battery energy storage system (BESS) as a standalone merchant plant
    was assessed during the financing process and found to be not financeable given
    the volatility and risk associated with future merchant revenue streams at the
    time of financial close (late 2017).
  lesson_learnt: A standalone merchant BESS is not currently bankable as a project-financed
    asset — battery storage needs to be co-located with contracted revenue-generating
    assets (such as wind or solar under a PPA) or have contracted revenue streams
    to attract project finance.
