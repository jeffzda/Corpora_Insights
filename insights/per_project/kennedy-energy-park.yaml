- record_id: ARENA-DLV-15952
  source_title: Kennedy Energy Park - Construction, Connection and Commissioning Report
  publish_date: 2025-05
  project_name: Kennedy Energy Park
  what_happened: Generator registration, originally expected near construction completion
    in late 2018, was not achieved until June 2021 — a delay of 36 months — due to
    challenges modelling the behaviour of the hybrid generating system and its grid
    impacts, compounded by interactions with the neighbouring Hughenden Solar Farm's
    GPS submission.
  lesson_learnt: For hybrid generating systems, begin generator registration modelling
    and AEMO/DNSP engagement concurrently with construction, not sequentially after
    mechanical completion — modelling complexity for novel hybrid configurations can
    independently add 3+ years to the registration pathway.
