  what_happened: During financial due diligence, the grid connection delay risk was
    identified as the greatest potential schedule risk to the project. The delay contingency
    carried for KEP was large compared with other projects financed by the proponents,
    reflecting the unusual complexity of the hybrid fringe-of-grid connection.
  lesson_learnt: Advance detailed grid connection design as far as practical before
    financial close to reduce delay contingency requirements and de-risk the financing
    timeline — on Kennedy the complexity of the hybrid fringe-of-grid connection made
    this the dominant delay risk and required an unusually large contingency.
