  what_happened: The delays in construction and commissioning generated significant
    additional costs above the original budget, including delay and prolongation claims
    settled with the EPC contractor, REGBA delay damages levied by CS Energy (the
    offtake counterparty), additional costs recovered by Ergon and AEMO related to
    extended hold point testing, interim O&M costs from Vestas, and additional capital
    expenditure for the Vizimax SyncroTeq Plus equipment.
