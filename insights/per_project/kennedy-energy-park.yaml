- record_id: ARENA-DLV-59755
  source_title: Kennedy Park FinClose Report
  publish_date: 2018-01
  project_name: Kennedy Energy Park
  what_happened: A third-party independent assessor used a stability-enabled CFD model
    for wind resource assessment and grossly overestimated the wind resource at the
    northern end of the site (8.095 m/s vs the validated figure of 7.46 m/s — an 8.4%
    error). Had the third-party estimate been accepted, turbines would have been placed
    in non-optimal locations and financial returns would have been materially overstated.
  lesson_learnt: Do not rely solely on pure CFD models (including stability-enabled
    CFD) for wind resource assessment in complex terrain — these models capture only
    a snapshot of atmospheric conditions and can produce large errors. Use models
    that incorporate mesoscale, CFD and statistical components to capture atmospheric
    dynamics more accurately.
  issue_severity: moderate
  project_type: multi-technology/hybrid
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: project developer
