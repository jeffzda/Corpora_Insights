  project_name: Kennedy Energy Park
  what_happened: KEP experienced two non-compliance events (NC2024054 in June 2024
    and NC2025021 in January 2025) where the incoming feeder was tripped by Ergon
    after KEP failed to respond to 0 MW curtailment instructions within the required
    time, in breach of GPS clause S5.2.5.12; both events share a related root cause
    expected to be resolved in July 2025.
