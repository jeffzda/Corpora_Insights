- record_id: ARENA-DLV-15956
  source_title: Kennedy Energy Park - Construction, Connection and Commissioning Report
  publish_date: 2025-05
  project_name: Kennedy Energy Park
  what_happened: A shunt reactor breaker design was rejected by Ergon during the design
    finalisation phase (Q2 2018), and Ergon subsequently issued new Protection Application
    Guides (PAGs) in Q3 2018 that required further design changes, together causing
    the initial energisation date to be postponed from its original schedule to January
    2019.
  lesson_learnt: All key electrical equipment designs — particularly protection and
    switching equipment — must be reviewed and approved by the relevant network provider
    before design freeze; late-stage rejection by the DNSP can cascade into months
    of redesign and delay the entire energisation schedule.
