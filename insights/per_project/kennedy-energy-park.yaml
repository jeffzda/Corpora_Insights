- record_id: ARENA-DLV-59759
  source_title: Kennedy Park FinClose Report
  publish_date: 2018-01
  project_name: Kennedy Energy Park
  what_happened: KEP is located at a fringe-of-grid, network-constrained location
    where distribution loss factors (DLF) are sensitive to other generation in the
    region. The project engaged a consultant to conduct extensive MLF and DLF forecasting
    for the project life, and found that increasing solar relative to wind beyond
    the final configuration would both reduce DLF and increase curtailment, negatively
    impacting project economics.
  lesson_learnt: For fringe-of-grid projects in the NEM, conduct robust MLF and DLF
    forecasting before finalising the wind/solar ratio — the optimal technology mix
    at Kennedy was partially determined by DLF implications, and incorrect sizing
    could materially reduce revenue.
