  what_happened: The 5 MVAr synchronous condenser at KEP was found to play a critical
    role in enabling the hybrid plant to meet Generator Performance Standards — particularly
    fault ride-through — in an area of the grid with relatively low system strength,
    making it an essential enabler of grid compliance rather than an optional ancillary
    component.
