  outcome_class: knowledge generated despite setback
  secondary_failure_mode: data & measurement
  intervention_note: An additional wind monitoring station (239-163) was installed
    at the northern end of the site and measured over four months; both Windlab and
    the third party re-modelled with the new data, confirming Windlab's original lower
    estimate was accurate.
  transferability: moderate
  delay_magnitude: 3-12 months
