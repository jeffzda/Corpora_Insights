  secondary_failure_mode: regulatory & approvals
  intervention_note: KEP submitted its GPS model independently despite the Hughenden
    Solar Farm GPS being outstanding; once the Hughenden model was accepted, KEP updated
    its own models to incorporate the interaction effects.
  transferability: moderate
