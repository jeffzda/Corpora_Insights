- record_id: ARENA-DLV-59752
  source_title: Kennedy Park FinClose Report
  publish_date: 2018-01
  project_name: Kennedy Energy Park
  what_happened: Kennedy Energy Park was the first utility-scale hybrid wind/solar/storage
    project to be project financed anywhere in the world, meaning there was no precedent
    for connection of wind, solar and battery storage at a single connection point
    in the NEM. Generator performance standards under the ongoing connection contract
    required combined simulation modelling of all three technologies, but OEM simulation
    models were each developed for single-technology use only.
  lesson_learnt: Engage a specialist party with proven experience combining multiple
    OEM simulation models and demonstrated capability to tune and optimise the combined
    system to satisfy NER and AEMO generator performance standards — the absence of
    such precedent is a significant risk for any hybrid project seeking grid connection.
