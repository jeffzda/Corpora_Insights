  source_title: Kennedy Park FinClose Report
  publish_date: 2018-01
  project_name: Kennedy Energy Park
  what_happened: Following development approval, multiple changes to layout and configuration
    were required because key design uncertainties had not been resolved at the time
    of the original development application. These included electrical connection
    arrangement, optimal wind/solar sizing, wind resource data coverage, geology,
    and competing regional generation projects.
  lesson_learnt: Front-end load engineering, concept design, layout and grid connection
    studies before lodging a development application — on Kennedy, insufficient resolution
    of these uncertainties at DA stage necessitated later change request amendments
    to conditions, adding time and cost. This risk is amplified for hybrid projects
    if wind and solar components require separate approval streams.
