- record_id: ARENA-DLV-59758
  source_title: Kennedy Park FinClose Report
  publish_date: 2018-01
  project_name: Kennedy Energy Park
  what_happened: The technical and insurance due diligence for Kennedy as a hybrid
    wind/solar/storage project required separate independent energy forecasts for
    solar and wind, plus additional combined analysis incorporating the BESS and hybrid
    control system. The financial due diligence process also involved two lenders
    (CEFC and ARENA) generating hundreds of combined technical due diligence questions,
    partly due to the novel nature of the project and partly due to ARENA's R&D and
    knowledge-sharing requirements.
  lesson_learnt: Hybrid project proponents should expect a more demanding due diligence
    process than single-technology projects — particularly for energy forecasting
    (requiring separate forecasts per technology plus combined analysis) and where
    multiple lenders are involved. However, the overall process is manageable and
    not expected to be a material impediment to future hybrid projects.
  issue_severity: minor
  project_type: multi-technology/hybrid
  project_scale_band: first commercial/FOAK
  lifecycle_phase: approvals/contracting
