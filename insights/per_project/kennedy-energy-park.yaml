    being enabled. The key challenge was managing the control scenario where FCAS
    is activated during a network constraint at KEP.
  lesson_learnt: Projects seeking FCAS registration for a BESS co-located with other
    generation in a constrained network must develop and test control logic for the
    specific scenario of FCAS activation during network constraint before commissioning;
    this interaction should be resolved before commercial operation rather than during
