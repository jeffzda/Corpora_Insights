  what_happened: Across the seven pilot sites, on-site thermal storage options (cold
    tanks, boiler pre-heat, hot water tanks) were consistently cheaper than battery
    storage for delivering load flexibility in combination with solar PV. Costs for
    non-battery thermal storage were sometimes not easily available and were less
    transparent than for battery storage, creating an information barrier that may
    bias decisions toward batteries.
  lesson_learnt: Obtain actual quotes for thermal storage options (cold tanks, boiler
    pre-heat) early in a REALM feasibility study — thermal storage typically outperforms
    battery storage on cost at commercial and industrial sites, but its costs are
    less transparent and often underestimated without site-specific supplier engagement.
