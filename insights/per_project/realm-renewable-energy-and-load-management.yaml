- record_id: ARENA-DLV-61052
  source_title: Renewable Energy & Load Management (REALM) Industry Report
  publish_date: '2017'
  project_name: Renewable Energy and Load Management (REALM) Project
  what_happened: Current retail energy tariffs and network demand charges at all seven
    pilot sites provided blunt or misaligned price signals that did not reflect actual
    wholesale or network peak costs, reducing the financial returns from REALM investments
    to beyond standard commercial benchmarks (typically 12–15% IRR or 5–8 year paybacks)
    and limiting business appetite to invest.
  lesson_learnt: Assess tariff structure before finalising a REALM business case —
    monthly peak demand charges and flat or coarse time-of-use tariffs systematically
    undervalue demand flexibility. Where tariff reform is anticipated, model the business
    case under both current and prospective cost-reflective tariffs to demonstrate
    option value and avoid underselling the investment.
