- record_id: ARENA-DLV-61066
  source_title: Renewable Energy & Load Management (REALM) Industry Report
  publish_date: '2017'
  project_name: REALM Pilot – V&C Foods, Nowra (Greenfield)
  what_happened: The V&C Foods site may require a grid connection capacity upgrade
    due to potential peak loads at the new greenfield cold store. PCM systems were
    identified as an unreliable tool for deferring such an upgrade because PCMs can
    only operate according to the duty cycle of the chillers and cannot reliably control
    non-cooling loads, making them unsuitable for the dispatchable peak reduction
    needed to justify deferring connection upgrades.
  lesson_learnt: Do not rely on PCM thermal storage to defer grid connection capacity
    upgrades — their lack of dispatchability means they cannot reliably cap peak demand
    at a defined level when non-cooling loads are present. A chemical battery or other
    dispatchable storage device is required for this application.
