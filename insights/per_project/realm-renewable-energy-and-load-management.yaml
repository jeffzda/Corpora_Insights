- record_id: ARENA-DLV-61055
  source_title: Renewable Energy & Load Management (REALM) Industry Report
  publish_date: '2017'
  project_name: REALM Pilot – IKEA Tempe, Sydney
  what_happened: IKEA's 1.8 megalitres of existing chilled water storage (equivalent
    to over 320 Tesla 2 batteries, or ~$1.5M of commercial battery storage at $350/kWh)
    was being sub-optimally discharged — finishing in the early afternoon rather than
    being spread across the day. A chiller controls upgrade costing $20,000 with a
    1-year payback resolved this, and when combined with 250 kW of additional solar
    PV achieved a 7-year payback with higher NPV.
  lesson_learnt: Before investing in battery storage, audit existing thermal storage
    assets for optimisation potential — reprogramming chiller controls to spread cold
    water discharge across the full day can deliver equivalent peak-shifting value
    to millions of dollars of battery investment at a fraction of the cost.
