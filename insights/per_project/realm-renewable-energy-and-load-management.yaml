- record_id: ARENA-DLV-61054
  source_title: Renewable Energy & Load Management (REALM) Industry Report
  publish_date: '2017'
  project_name: REALM Pilot – Teys Feedlot, Condamine Queensland
  what_happened: The Teys site had a poor power factor of 0.75 and was not charged
    on a kVA basis under its current tariff, meaning a significant efficiency and
    cost opportunity was being missed. The dominant load — the grain mill — also had
    oversized motors contributing to poor power factor, which the study identified
    as both an energy productivity and demand management opportunity.
  lesson_learnt: Agribusiness operators with daytime-dominated loads should evaluate
    power factor correction and time-of-use tariff options before installing solar
    — poor power factor and suboptimal tariff selection are addressable inefficiencies
    that compound the cost of energy without renewable integration, and modern solar
    PV inverters can provide power factor correction without separate capital investment.
