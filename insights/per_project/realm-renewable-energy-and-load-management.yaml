  what_happened: At the Woolworths Engadine store, none of the modelled combinations
    of additional solar and battery storage produced a positive return under existing
    tariffs, even at battery prices of $500/kWh. The site's existing 100 kW solar
    array was already well-sized relative to daytime load, off-peak tariffs were low,
    and cold storage chillers operated at high capacity around the clock leaving no
    thermal storage flexibility.
  lesson_learnt: Sites with well-sized existing solar, low off-peak tariffs, and continuously
    operating refrigeration loads have limited scope for behind-the-meter REALM —
    battery and additional solar investment will not be financially viable under current
    tariffs. For retail chains with similar profiles, focus should shift to energy
    efficiency and energy market service participation (e.g. RERT, network demand
    management) rather than on-site storage.
