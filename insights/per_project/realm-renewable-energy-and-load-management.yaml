- record_id: ARENA-DLV-61079
  source_title: Renewable Energy & Load Management (REALM) Industry Report
  publish_date: '2017'
  project_name: Renewable Energy and Load Management (REALM) Project
  what_happened: The Goodman Fielder site was charged for peak demand only between
    1–8 PM on weekdays, which meant that very high Monday morning demand spikes (up
    to 200 kVA above normal, caused by cold plant restart after weekend shutdown)
    did not incur demand charges. The tariff structure therefore provided no incentive
    to manage these technically significant but commercially irrelevant peaks.
  lesson_learnt: When assessing demand charge reduction opportunities, map the exact
    timing windows of the applicable demand charge measurement period against the
    site's actual demand profile — peaks outside the measurement window have no financial
    value to manage, and optimisation should be focused solely on peaks within the
    billable window.
