- record_id: ARENA-DLV-27704
  source_title: Renewable Energy & Load Management - for Agribusiness
  publish_date: 2018-10
  project_name: Renewable Energy & Load Management - for Agribusiness (general findings)
  what_happened: Across agribusiness sites assessed, complex REALM strategies involving
    battery storage, significant process storage, and full monitoring and optimisation
    were found to be commercially unattractive under current tariff structures, as
    price signals did not support the business case.
  lesson_learnt: Project developers and agribusiness operators should not rely on
    complex REALM strategies requiring battery storage and full automation being commercially
    viable under standard tariffs — the business case currently depends on accessing
    new revenue streams such as wholesale demand response or network support services,
    which require additional aggregation arrangements and market access work.
