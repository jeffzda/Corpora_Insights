- record_id: ARENA-DLV-61073
  source_title: Renewable Energy & Load Management (REALM) Industry Report
  publish_date: '2017'
  project_name: Renewable Energy and Load Management (REALM) Project
  what_happened: Australia's energy market rules at the time of the study did not
    facilitate direct demand-side bidding into the wholesale market, restricted non-retailer
    aggregator access, and provided no clear mechanism for businesses to receive network
    support payments except on a rare case-by-case basis. This regulatory gap meant
    the full REALM value stack (wholesale, network, FCAS, RERT) was inaccessible to
    most commercial and industrial sites, fundamentally undermining business cases.
  lesson_learnt: REALM and demand flexibility projects funded ahead of enabling market
    rule reforms must be designed with sufficient financial resilience under current
    tariffs alone — do not assume future energy market revenue streams (wholesale
    DR, network support, RERT) will be accessible within the investment horizon without
    specific contracted arrangements or regulatory confirmation.
