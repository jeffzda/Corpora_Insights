  source_title: Renewable Energy & Load Management (REALM) Industry Report
  publish_date: '2017'
  project_name: REALM Pilot – nbn Aggregation Node, Melbourne
  what_happened: The nbn aggregation node had a large, flat load, oversized lead-acid
    UPS batteries, and four backup diesel generators. The existing 100 kW solar PV
    system was a small proportion of total load and no on-site REALM optimisation
    was viable. However, the site was identified as having significant potential for
    energy market demand response services (wholesale, ancillary services, network,
    RERT) if batteries were upgraded from lead-acid to more flexible technologies.
  lesson_yed: Telecommunications and data centre sites with large legacy lead-acid
    UPS batteries have limited on-site REALM potential but significant latent demand
    response value — this value is only unlockable through planned battery replacement
    with lithium-ion, flow, or hybrid battery technologies capable of fast charge/discharge
    cycling.
