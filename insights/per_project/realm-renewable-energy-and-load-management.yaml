  what_happened: At edge-of-grid and fringe-of-grid sites, supply reliability was
    poor and there was potential for grid-disconnection or microgrid operation, but
    without adequate pricing signals or energy market reform, the business case for
    complex off-grid or network support configurations remained unattractive despite
    the technical potential.
