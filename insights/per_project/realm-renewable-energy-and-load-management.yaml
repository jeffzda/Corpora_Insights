  source_title: Renewable Energy & Load Management - for Agribusiness
  publish_date: 2018-10
  project_name: Renewable Energy & Load Management - for Agribusiness (general findings)
  what_happened: At agribusiness sites in areas where grid export of excess solar
    generation was not permitted, the inability to export surplus power to the grid
    eliminated a key revenue stream, reducing the business case for larger solar installations.
  lesson_learnt: In grid-constrained locations where export is restricted, agribusiness
    operators should evaluate on-site fuel substitution strategies — such as using
    excess solar generation for electric pre-heating in gas processes — as an alternative
    to grid export, which can deliver comparable economic value while reducing gas
    costs.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: concept/feasibility
  proponent_type: industrial operator
  delay_category: null
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Identified that supplementing electric power in gas-based processes
    (e.g. electric pre-heat in a gas boiler) during periods of excess generation provides
    a 'virtual export' revenue equivalent where physical export is unavailable.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id004
  - 2
  evidence_excerpt: in some parts of Australia, it is not possible to export power
    to the electricity grid. However, if other fuel sources are being used on-site,
    gas for example, then fuel costs could be reduced by supplementing electric power
    in that process. For example, an electric pre-heat in a gas boiler operating at
    times of excess generation.
