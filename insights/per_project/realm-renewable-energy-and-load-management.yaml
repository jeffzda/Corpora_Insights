- record_id: ARENA-DLV-61069
  source_title: Renewable Energy & Load Management (REALM) Industry Report
  publish_date: '2017'
  project_name: Renewable Energy and Load Management (REALM) Project
  what_happened: At most pilot sites, a systems-optimisation approach — combining
    solar PV, thermal storage, and demand controls — delivered superior financial
    returns compared to evaluating individual technologies in isolation using levelised
    cost or marginal abatement cost methods. At five of seven sites, REALM configurations
    improved the business case for renewable energy relative to solar PV alone.
  lesson_learnt: Use systems-level optimisation modelling (integrating PV, thermal
    storage, battery storage, and demand controls) rather than individual technology
    assessment when developing a REALM or behind-the-meter renewable energy business
    case — technology interdependencies and complementarities are not captured by
    marginal abatement cost or LCOE approaches and can change investment decisions
