  what_happened: Schneider Electric's own internal assessment of chilled water tank
    storage showed an 11-year payback, making it appear unviable. ISF's modelling
    — which also incorporated network demand tariff savings in addition to peak-to-off-peak
    energy arbitrage — reduced this to approximately 6 years for a 500 kl cold tank
    combined with solar PV, changing the investment decision.
