  what_happened: No commercially available demand control software in Australia could
    optimise multiple load types simultaneously in response to multiple external price
    signals (e.g. FCAS, wholesale market prices, and network demand charges) on a
    single site. This technology gap prevented sites from accessing the full value
    stack and was identified as a material barrier to REALM commercialisation.
  lesson_learnt: When planning a multi-revenue-stream REALM project, verify upfront
    whether available demand control software can simultaneously optimise multiple
    loads against multiple price signals — where this capability does not exist, either
    limit the scope to single-revenue-stream optimisation or include software development/customisation
    costs and risk in the project budget.
