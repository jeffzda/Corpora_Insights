- record_id: ARENA-DLV-61051
  source_title: Renewable Energy & Load Management (REALM) Industry Report
  publish_date: '2017'
  project_name: Renewable Energy and Load Management (REALM) Project
  what_happened: Across seven REALM pilot sites, data quality and data management
    were consistently problematic. Issues included faulty building management systems,
    data deleted after short retention periods, and load data that did not net out
    the impact of rooftop solar, making it difficult to understand native energy loads
    and prepare credible business cases.
  lesson_learnt: Before undertaking a REALM or demand-flexibility feasibility assessment,
    sites must audit their data management systems — ensure interval meter data is
    retained for at least one year, that rooftop solar generation is separately metered,
    and that BMS data is accessible and not auto-deleted. Without this baseline, optimisation
    modelling and business case development are severely compromised.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: procurement
  proponent_type: industrial operator
  delay_category: data/validation/testing
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: ISF developed a site-specific optimisation model and resampled
    available load data to one-minute granularity using the Perez cloud model to work
    around data gaps.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: DER
  source_pages:
