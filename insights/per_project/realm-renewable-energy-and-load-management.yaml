- record_id: ARENA-DLV-61071
  source_title: Renewable Energy & Load Management (REALM) Industry Report
  publish_date: '2017'
  project_name: Renewable Energy and Load Management (REALM) Project
  what_happened: Network demand charges at pilot sites were based on maximum demand
    across a full month and frequently did not coincide with actual network or wholesale
    market peak events. This misalignment meant that demand flexibility investments
    could not access the full economic value they could deliver to the grid, and also
    meant that monthly demand charges were sometimes set by brief, high-demand start-up
    events (e.g. Monday morning plant restart at Goodman Fielder) rather than sustained
    operational peaks.
  lesson_learnt: When structuring a demand management business case, identify whether
    the monthly maximum demand tariff is set by operational peaks that load management
    can reliably reduce or by brief anomalous events (e.g. cold-start inrush currents)
    that are harder to control — if the latter, the demand charge savings potential
    may be smaller than headline demand figures suggest.
