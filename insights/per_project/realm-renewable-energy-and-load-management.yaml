- record_id: ARENA-DLV-61053
  source_title: Renewable Energy & Load Management (REALM) Industry Report
  publish_date: '2017'
  project_name: REALM Pilot – Teys Feedlot, Condamine Queensland
  what_happened: At the Teys fringe-of-grid beef feedlot, the existing 300 kW solar
    PV system was unlikely to reduce monthly demand charges because peak demand frequently
    occurred outside solar generation hours. The optimal REALM configuration — 250
    kW additional solar combined with 50 kW boiler pre-heat capacity — achieved a
    6-year simple payback; battery storage only became marginally more cost-effective
    if prices fell to $500/kWh.
  lesson_learnt: At fringe-of-grid sites with dominant daytime process loads, boiler
    pre-heat or hot water thermal storage is typically the cheapest mechanism to capture
    surplus solar PV value; battery storage is not cost-effective at current prices.
    Design solar and storage sizing around the demand charge reset interval, not just
    energy arbitrage.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: programmatic/portfolio-level
