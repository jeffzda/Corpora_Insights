- record_id: ARENA-DLV-27706
  source_title: Renewable Energy & Load Management - for Agribusiness
  publish_date: 2018-10
  project_name: Renewable Energy & Load Management - for Agribusiness (general findings)
  what_happened: Analysis of agribusiness sites found that solar PV panel orientation
    and tracking design is frequently not matched to the facility's actual load profile,
    with operations extending into early morning, evening, or late afternoon periods
    being poorly served by standard north-facing fixed installations.
  lesson_learnt: When designing a new solar installation for an agribusiness with
    non-standard operating hours, the panel orientation and tracking configuration
    should be selected to match the actual load profile — east-west trackers suit
    operations extending into early morning or evening, while west-facing panels better
    serve late-afternoon peaks.
