  project_name: REALM Pilot – V&C Foods, Nowra (Greenfield)
  what_happened: At the V&C Foods greenfield cold store in Nowra, phase change materials
    (PCMs) were not cost-effective under either high ($120,000) or low ($50,000) cost
    scenarios. Even at $50,000 capital cost, the best PCM and solar combination had
    a negative NPV at an 8% discount rate. Battery storage was also not cost-effective
    even at $500/kWh. The optimal solution was solar PV alone at approximately 80
    kW.
  lesson_learnt: Phase change materials are currently not cost-effective for load
    shifting at new cold store sites with high-efficiency chillers — the high COP
    of modern chillers reduces the electrical load deferral benefit of PCMs. PCMs
    may only be viable where existing low-COP chillers, low-cost installation space,
    and an oversized solar array with low-value grid export coincide.
