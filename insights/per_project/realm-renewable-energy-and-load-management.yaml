  source_title: Renewable Energy & Load Management (REALM) Industry Report
  publish_date: '2017'
  project_name: Renewable Energy and Load Management (REALM) Project
  what_happened: The Demand Management Incentive Scheme (DMIS), approved in April
    2018, made approximately $1 billion available for network demand management over
    five years. However, ISF's informal research found that networks were struggling
    to identify projects up to the value of available funding due to limited internal
    knowledge of demand-side implementation, difficulty identifying opportunities,
    insufficient customer relationships, and cost uncertainty.
  lesson_learnt: Funding availability for network demand management does not automatically
    translate into deployable projects — networks require parallel investment in technical
    capability, customer engagement frameworks, and pilot project pipelines to absorb
    available DMIS funding. REALM pilot projects should be positioned to build this
    pipeline proactively.
