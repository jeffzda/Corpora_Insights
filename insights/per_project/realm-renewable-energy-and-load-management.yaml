  project_name: Renewable Energy and Load Management (REALM) Project
  what_happened: At all seven pilot sites — including those with active in-house energy
    management programs — the study identified significant additional energy efficiency
    opportunities not yet implemented. These included variable speed drives, improved
    refrigeration controls, LED lighting, building envelope improvements, heat pumps
    to replace steam/boiler systems, and power factor correction. Energy efficiency
    consistently reduced both total consumption and demand peaks.
  lesson_learnt: Include a systematic energy efficiency audit as the first step in
    any REALM or behind-the-meter renewable energy business case — even sites with
    ongoing energy programs typically have substantial untapped efficiency potential
    that reduces the size and cost of renewable energy and storage investments needed.
