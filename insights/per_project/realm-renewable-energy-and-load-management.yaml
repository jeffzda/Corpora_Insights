  source_title: Renewable Energy & Load Management - for Agribusiness
  publish_date: 2018-10
  project_name: Teys Condamine Feedlot REALM
  what_happened: Analysis of the Teys site found that at prevailing battery prices
    (above $500/kWh), a 50 kW boiler pre-heat using excess solar PV output delivered
    superior financial returns compared to a 100 kW battery storage system, with both
    options generating returns in the order of 15%.
  lesson_learnt: At agribusiness sites with on-site gas boilers, using excess solar
    PV generation for electric boiler pre-heat is a cost-effective load-shifting strategy
    that can outperform battery storage at current prices and also reduces gas cost
    exposure — this option should be evaluated before committing to battery storage.
