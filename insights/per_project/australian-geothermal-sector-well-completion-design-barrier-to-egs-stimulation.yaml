- record_id: ARENA-DLV-14977
  source_title: 'Looking Forward: Barriers, Risks and Rewards of the Australian Geothermal
    Sector to 2020 and 2030'
  publish_date: 2014-06
  project_name: Australian Geothermal Sector – Well Completion Design Barrier to EGS
    Stimulation
  what_happened: The majority of geothermal wells in Australia were completed with
    open-hole or slotted/perforated liners rather than fully cemented casing, making
    it nearly impossible to use packers to isolate zones for targeted multi-stage
    stimulation — a fundamental impediment to applying the multi-zone fracturing techniques
    that had revolutionised unconventional gas production.
  lesson_learnt: EGS well design should incorporate fully cemented casing strings
    with perforation capability to enable multi-zone stimulation — the open-hole completions
    standard in conventional geothermal practice are incompatible with the zonal isolation
    techniques needed to create a pervasive fracture network at commercially required
    flow rates, and this design choice locks in lower technical performance from the
    outset.
