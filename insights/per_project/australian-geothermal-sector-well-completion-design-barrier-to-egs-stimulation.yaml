  evidence_excerpt: The majority of geothermal wells are completed with either an
    open hole (no casing or liner) or with slotted or perforated liners. These completions
    make it nearly impossible to use packers to isolate zones for stimulation. As
    a result, it is difficult to create the pervasive fracture network in the reservoir
    to provide the most efficient extraction of heat over time.
