  evidence_excerpt: EV trials have focused on EV owner end-user innovators and early
    adopters, and predominately been industry-led. Unrepresented groups include disabled
    drivers, regional drivers, apartment dwellers, fleets, and renters… This means
    research being done today on different vehicle usage patterns and driver expectations
    (critical for understanding VGI) will have to be repeated for insights on the
    mass market.
