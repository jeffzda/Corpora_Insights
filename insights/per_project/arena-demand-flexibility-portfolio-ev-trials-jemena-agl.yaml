- record_id: ARENA-DLV-53884
  source_title: Demand Flexibility Portfolio Retrospective Analysis Report
  publish_date: 2023-07
  project_name: ARENA Demand Flexibility Portfolio — EV Trials (Jemena, AGL)
  what_happened: EV demand flexibility trials were disproportionately represented
    by early adopters — predominantly older, technically engaged men — leaving gaps
    in understanding of how less tech-savvy or diverse EV user groups (disabled drivers,
    regional users, renters, fleets, apartment dwellers) would respond to smart charging
    incentives.
  lesson_learnt: EV demand flexibility trials should explicitly include under-represented
    customer segments (renters, regional users, fleets, non-technically engaged users)
    in trial design; results from early-adopter-dominated samples will not generalise
    to the mass market and will require expensive repetition as EV adoption broadens.
