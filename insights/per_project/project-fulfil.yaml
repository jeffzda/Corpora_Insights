  project_name: Project Fulfil (Ecoult/UltraBattery — field installations)
  what_happened: AS4777:2015 requires inverters to shut down when grid voltage exceeds
    255V. Ecoult observed grid voltage frequently exceeding 255V at customer sites,
    causing unnecessary system trips. The standard did not account for energy storage
    systems that may have been actively helping to suppress voltage at the time of
    disconnection.
  lesson_learnt: When deploying battery storage systems on networks with frequent
    voltage excursions, set grid voltage trip settings at the maximum allowable range,
    and engage with the relevant standard-setting process — AS4777 should mandate
    that storage systems cease exporting above 255V rather than fully disconnecting,
    to avoid voltage issues worsening after disconnection.
