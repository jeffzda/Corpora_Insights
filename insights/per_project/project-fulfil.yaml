  what_happened: Testing of integrated BMS/inverter systems revealed that manual testing
    of all possible operating scenarios was impractical and that bugs introduced when
    fixing specific issues would inadvertently affect other operating modes. Developer-led
    testing without independent test execution also allowed systematic gaps.
