- record_id: ARENA-DLV-26909
  source_title: Project Fulfil Lessons Learnt Report
  publish_date: 2020-12
  project_name: Project Fulfil (Ecoult/UltraBattery)
  what_happened: Cells within 12V monoblocs progressively diversified in state during
    cycling in PSoC applications. Because external monitoring only reported the average
    response across the six cells in each monobloc, control algorithms were blind
    to individual cell voltage excursions, leading to unseen secondary reactions and
    accelerated degradation.
  lesson_learnt: For lead-acid PSoC applications, individual cell monitoring and management
    within multi-cell modules is essential — string-level or monobloc-level monitoring
    masks internal cell divergence and makes it impossible to prevent secondary degradation
    reactions.
