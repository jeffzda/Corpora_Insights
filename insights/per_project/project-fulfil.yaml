- record_id: ARENA-DLV-26906
  source_title: Project Fulfil Lessons Learnt Report
  publish_date: 2020-12
  project_name: Project Fulfil (Ecoult/UltraBattery)
  what_happened: Commercialising the UltraFlex system across a wide range of small,
    ad hoc applications with different power profiles created a large field support
    burden. Managing diverse inverter integrations and maintaining field performance
    consumed resources that were needed for the fundamental technical development
    required to achieve performance consistency.
  lesson_learnt: Avoid broad commercialisation across diverse small-system configurations
    before achieving stable, consistent performance — the support overhead of heterogeneous
    field deployments directly competes with the engineering resources needed to complete
    core technology development.
  issue_severity: major
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: internal governance/resourcing
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: execution & logistics
  intervention_note: Business development teams found market segments where customers
    used multiple UltraFlex units in the same application to lessen individual support
    needs, and Ecoult refocused on the 2V system for a single large-volume customer
    commitment.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id006
  - 10
  - 11
  evidence_excerpt: This proved to be a sensible decision from a market positioning
    perspective but resulted in the need to apportion a lot of the available Ecoult
    resource to finding ways to integrate the UltraFlex with inverters, make systems
    work as intended, and to maintain performance in the field for customers. This
    need became a resource soak on Ecoult, conflicting with the parallel effort needed
    to attain the minimum consistent performance level required by the market.
