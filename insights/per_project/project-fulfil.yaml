  source_title: Project Fulfil Lessons Learnt Report
  publish_date: 2020-12
  project_name: Project Fulfil (Ecoult/UltraBattery)
  what_happened: Project Fulfil was mutually terminated without Ecoult achieving its
    goals. The project aimed to commercialise a battery monitoring and management
    system for lead-acid batteries in partial state of charge (PSoC) applications
    but ran out of time and funding to establish the proof of performance and consistency
    required.
  lesson_learnt: The process of evolving from idea to a cost-effective, warrantable
    product with all necessary standards compliance and certification must be the
    dominant priority at each step — commercialisation before sufficient fundamental
    understanding is established creates field support overheads that drain the resources
    needed to complete development.
