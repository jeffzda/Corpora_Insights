  project_name: Project Fulfil (Ecoult/UltraBattery)
  what_happened: Field deployments revealed that system integrators and installers
    working with microgrids integrating multiple generation sources and ad hoc loads
    could not be relied upon to commission systems correctly or follow battery maintenance
    directions. Incorrect system configuration at customer sites caused operational
    failures and battery damage.
  lesson_learnt: Energy storage products for microgrid and remote power applications
    must be self-configuring and self-healing — do not assume integrators will commission
    systems correctly or that end users will follow maintenance instructions, because
    in field conditions with variable climates and ad hoc loads, they often will not.
