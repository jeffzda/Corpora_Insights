  project_name: Project Fulfil (Ecoult/UltraBattery)
  what_happened: Refresh protocols used across UltraBattery deployments were found
    to be insufficient — they did not reliably bring all cells to top of charge or
    correct plate misalignment, resulting in progressive capacity loss and shortened
    battery life across multiple sites.
  lesson_learnt: Develop, validate, and mandate a rigorous refresh protocol that brings
    all cells to top of charge with minimum secondary reactions before deploying a
    battery system commercially — treat any implementation that cannot achieve a good
    refresh (e.g. due to insufficient energy source availability) as a formal project
    risk requiring senior-level approval.
