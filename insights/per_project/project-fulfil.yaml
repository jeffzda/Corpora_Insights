- record_id: ARENA-DLV-26924
  source_title: Project Fulfil Lessons Learnt Report
  publish_date: 2020-12
  project_name: Project Fulfil (Ecoult/UltraBattery)
  what_happened: Ecoult commenced commercialisation of the UltraBattery system without
    sufficient understanding of the frequency, duration, and optimal conditions for
    overcharge maintenance at the individual cell level. This gap was based on trial
    and observation rather than scientific rigour, creating high post-sales support
    costs as the team had to make qualitative adjustments site-by-site.
  lesson_learnt: Before commercialising a lead-acid PSoC battery system, establish
    a scientifically rigorous understanding of overcharge maintenance requirements
    at the cell level — a single manufacturer-specified overcharge practice cannot
    fit all systems or power profiles, and without state-based adaptive control the
    outcome is either over-charge-induced degradation or under-charge-induced sulphation.
  issue_severity: major
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: Ecoult formed a cross-functional Battery Guild with EPM engineers,
    developed a finite element model of the lead-acid cell, and commenced electrochemical
    impedance spectroscopy analysis.
  transferability: narrow
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id024
  - 42
