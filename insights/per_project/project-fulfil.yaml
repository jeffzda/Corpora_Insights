- record_id: ARENA-DLV-26908
  source_title: Project Fulfil Lessons Learnt Report
  publish_date: 2020-12
  project_name: Project Fulfil (Ecoult/UltraBattery)
  what_happened: Lead-acid batteries in PSoC operation require overcharge to be administered
    at the individual cell level — each cell requires a different amount and duration
    of overcharge for optimal maintenance. String-level overcharge using standard
    industry equalization practices was insufficient to maintain cell alignment and
    capacity, and excessive or inadequate overcharge contributed to degradation.
  lesson_learnt: 'For lead-acid systems in PSoC applications, overcharge maintenance
    must be cell-specific: design systems that can administer overcharge individually
    to each cell in the string at the optimum level for that cell, rather than applying
    a uniform string-level equalization charge.'
  issue_severity: major
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Ecoult developed a 2V cell management system (CMS) that bypasses
    current selectively to individually align cells in strings, providing the means
    to administer cell-specific overcharge.
  transferability: narrow
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id008
  - 6
  - 7
  - 8
  evidence_excerpt: The lesson learnt in this is that, as well as the cell being appropriate
    for the application in terms of its resistance to accumulation of sulphation,
    whatever process is needed for overcharge maintenance (regardless of cell type)
    must also be understood and appropriate.
  confidence_note: null
