  project_name: Project Fulfil (Ecoult/UltraBattery)
  what_happened: Software development for the UltraFlex system involved multiple teams
    working on separate integrated components. Inadequate integration management —
    relying only on weekly meetings between team leaders — meant integration points
    were delayed, bugs emerged late, and significant rework was required.
  lesson_learnt: When multiple teams are developing integrated software components,
    mandate scheduled integration sprints (not just team-leader meetings) throughout
    the project; assign a dedicated systems engineer to own the integration process;
    and implement automated regression testing to catch inadvertent cross-team impacts
    early.
