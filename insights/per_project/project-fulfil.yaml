- record_id: ARENA-DLV-26912
  source_title: Project Fulfil Lessons Learnt Report
  publish_date: 2020-12
  project_name: Project Fulfil (Ecoult/UltraBattery)
  what_happened: When upgrading the UltraFlex controller from a FitPC to a Single
    Board Computer (BeagleBone), the new hardware failed electromagnetic compatibility
    (EMC) compliance testing despite the previous version being compliant. Late-stage
    hardware changes required full system-level retesting and caused delays to the
    manufacturing schedule.
  lesson_learnt: Freeze the hardware design as early as possible and begin EMC testing
    at the system level as soon as the design is stable — last-minute design changes
    require full system retesting and can delay manufacturing release; allow explicit
    schedule contingency for EMC rectification at the end of the product delivery
    schedule.
