- record_id: ARENA-DLV-26905
  source_title: Project Fulfil Lessons Learnt Report
  publish_date: 2020-12
  project_name: Project Fulfil (Ecoult/UltraBattery)
  what_happened: Ecoult was structured around commercialising a specific cell chemistry
    (UltraBattery) rather than first defining a user story and then selecting the
    best technology to meet it. This technology-first focus constrained the company's
    ability to pivot when the UltraBattery approach encountered fundamental barriers.
  lesson_learnt: Structure product development around a clearly defined user story
    rather than a specific technology — a technology-first approach locks in assumptions
    that may later prove incorrect and limits pivot options when technical barriers
    emerge.
