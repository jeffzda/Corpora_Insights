- record_id: ARENA-DLV-26904
  source_title: Project Fulfil Lessons Learnt Report
  publish_date: 2020-12
  project_name: Project Fulfil (Ecoult/UltraBattery)
  what_happened: Ecoult's original business plan assumed UltraBattery cell cost could
    be reduced to no more than 1.2× the cost of a standard VRLA cell, but the actual
    EPM cost multiplier reached approximately 2× (Exide cells at 1.4×). This cost
    premium became a commercial showstopper when competing against lithium prices.
  lesson_learnt: Validate cell cost reduction assumptions rigorously and early — if
    the cost premium of a novel cell chemistry against incumbent alternatives cannot
    be compressed to the business-plan target, the entire commercial model is at risk
    regardless of technical performance gains.
