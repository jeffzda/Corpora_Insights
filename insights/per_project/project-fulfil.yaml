- record_id: ARENA-DLV-26925
  source_title: Project Fulfil Lessons Learnt Report
  publish_date: 2020-12
  project_name: Project Fulfil (Ecoult/UltraBattery)
  what_happened: Ecoult moved rapidly toward commercialisation under competitive pressure
    from lithium — driven by concern that delay would cede market incumbency — before
    completing the fundamental understanding needed for consistent performance. Early
    commercial deployments generated high field maintenance overheads that diverted
    resources from completing necessary development, creating a compounding cycle.
  lesson_learnt: Resist competitive pressure to commercialise before achieving a fully
    warrantable product with all necessary compliance and certification — the overhead
    of supporting premature field deployments directly competes with the engineering
    resources needed to close fundamental understanding gaps, and the compounding
    effect can be fatal to the programme.
  issue_severity: critical
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
