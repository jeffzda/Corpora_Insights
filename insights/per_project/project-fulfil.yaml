  source_title: Project Fulfil Lessons Learnt Report
  publish_date: 2020-12
  project_name: Project Fulfil (Ecoult/UltraBattery — external test projects)
  what_happened: Independent test laboratories (IT Power, CSIRO, SANDIA) typically
    wished to test bare batteries without Ecoult's battery management system. Test
    protocols sometimes required features (e.g. power command following) that standard
    inverters did not support, leading Ecoult to build custom control systems. These
    bespoke systems did not incorporate all necessary management technology and produced
    results unrepresentative of the commercial product.
  lesson_learnt: Independent battery tests should be carried out on commercially released
    standard systems — not batteries in custom test configurations; work with test
    laboratories to embed the manufacturer's BMS into the test setup, and equip the
    commercial product with any special test-mode features required, to ensure results
    are representative.
