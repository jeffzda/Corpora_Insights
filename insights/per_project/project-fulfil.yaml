- record_id: ARENA-DLV-26915
  source_title: Project Fulfil Lessons Learnt Report
  publish_date: 2020-12
  project_name: Project Fulfil (Ecoult/UltraBattery — field installations)
  what_happened: At one grid-connected customer site, the battery system was installed
    on a single phase of a three-phase supply to maximise solar self-consumption.
    This caused outages when backed-up loads exceeded inverter capacity, created problems
    with three-phase equipment downstream, and resulted in more frequent grid disconnections
    than anticipated due to power quality issues.
  lesson_learnt: At system design stage, explicitly model backup load requirements
    separately from grid-connect optimisation goals — single-phase battery installations
    on three-phase sites create synchronisation and phase-loss risks for three-phase
    equipment, and backup capacity must be sized for actual load not just primary
    use-case load.
