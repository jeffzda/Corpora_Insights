- record_id: ARENA-DLV-26902
  source_title: Project Fulfil Lessons Learnt Report
  publish_date: 2020-12
  project_name: Project Fulfil (Ecoult/UltraBattery)
  what_happened: Ecoult moved to commercial deployment of the 12V monobloc UltraBattery
    system before understanding that cells inside monoblocs could drift relative to
    each other under the power profiles being serviced, causing inconsistent field
    performance and requiring high levels of ongoing field support.
  lesson_learnt: Do not commercialise a battery architecture before verifying that
    cells within multi-cell modules remain aligned under the intended field power
    profiles — internal cell divergence inside monoblocs is not detectable from external
    monitoring and creates irrecoverable performance degradation in PSoC operation.
  issue_severity: major
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: commissioning/integration
  proponent_type: technology vendor
  delay_category: commissioning/integration
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Ecoult identified the root cause (cell variance inside monoblocs)
    and decided to transition to a 2V architecture with individual cell management
    to reduce support levels.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id002
  - 10
  - 11
  evidence_excerpt: The move to 12V missed the risk that cell behaviour inside the
    monobloc could present inconsistencies in performance depending on aspects of
    how the systems were used. (given high levels of observation and attention 12V
    systems could be coaxed/customized to adequate performance but with high overhead).
  confidence_note: null
