- record_id: ARENA-DLV-26926
  source_title: Project Fulfil Lessons Learnt Report
  publish_date: 2020-12
  project_name: Project Fulfil (Ecoult/UltraBattery)
  what_happened: Ecoult operated as a 100% subsidiary of EPM focused tightly on commercialising
    UltraBattery, which constrained access to external innovation funding and market-opening
    investors. Governance was oriented toward getting the product to market rather
    than assessing technology readiness objectively, and the level of fundamental
    understanding required was not anticipated at the outset.
  lesson_learnt: For innovation programmes at an early technology readiness level,
    governance frameworks should include explicit, objective technology readiness
    assessments at each decision gate — market-entry governance that does not critically
    assess readiness can accelerate a programme toward commercial failure rather than
    commercial success.
  issue_severity: major
  project_type: storage
