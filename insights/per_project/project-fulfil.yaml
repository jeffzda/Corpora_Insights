- record_id: ARENA-DLV-26903
  source_title: Project Fulfil Lessons Learnt Report
  publish_date: 2020-12
  project_name: Project Fulfil (Ecoult/UltraBattery)
  what_happened: 'The verification and validation test of the new 2V UltraBattery
    cell management system failed unexpectedly: cells required up to 90 hours of overcharge
    to restore/sustain capacity under the test cycling pattern, making the system
    unfit for commercial deployment. This blocked the major contract opportunity Ecoult
    had established and ultimately led to discontinuation of Australian operations.'
  lesson_learnt: Before accepting a large commercial contract contingent on a new
    architecture, conduct verification and validation testing early enough that a
    negative result leaves time for further development — a failed V&V test with no
    runway remaining leaves the organisation with no viable path forward.
