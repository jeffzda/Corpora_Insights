  intervention_note: In later stages Ecoult identified that its system engineering
    methods could be applied to lower-cost standard VRLA cells, offering a potential
    pivot, but ran out of time to establish proof of this alternative path.
  transferability: moderate
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id004
