- record_id: ARENA-DLV-63654
  source_title: Advanced High-Efficiency Silicon Solar Cells Final Report
  publish_date: 2022-06
  project_name: Advanced High-Efficiency Silicon Solar Cells (UNSW ALD Passivating
    Contacts)
  what_happened: Density functional theory (DFT) calculations were used to predict
    which dopants would improve the functional properties of transition metal oxides
    (specifically nickel oxide and titanium oxide), and these predictions were validated
    experimentally — aluminium doping of TiO2 and zinc doping of NiO both improved
    conductivity, surface passivation quality, and thermal stability as predicted.
  lesson_learnt: 'Use DFT calculations to pre-screen dopant candidates for transition
    metal oxide contacts before committing to experimental synthesis runs — DFT can
    reliably predict changes in density of states and defect positions for crystalline
    systems, substantially reducing the experimental parameter space. Note: DFT on
    amorphous structures remains challenging and predictions should be validated experimentally
    for amorphous-phase materials.'
  issue_severity: none
  project_type: manufacturing/supply chain
  project_scale_band: pilot
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: null
  transferability: narrow
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id006
  - 12
  evidence_excerpt: We found that density functional theory (DFT) is a great tool
    to predict which dopants will provide the desired change in material properties
    of the transition metal oxides... Amorphous materials are quite different from
    their crystalline counterparts and this has to be taken into account when doing
    DFT calculations. Typical DFT is done on crystalline structures, as performing
    these calculations on amorphous systems is significantly more challenging.
  confidence_note: transferability set to narrow — DFT-guided dopant screening is
    specific to thin-film semiconductor R&D contexts and does not transfer to broader
    ARENA project delivery archetypes.
