  source_pages: &id007
  - 15
  evidence_excerpt: Chemical vapour deposition (CVD) processes like ALD are strongly
    dependent on the chemical nature of the underlying film. This typically results
    in significant differences between initial growth and steady state growth. For
    devices with functional nanoscale thin films, this initial growth can have a significant
    impact on the device performance and thus should be carefully considered when
    optimising devices.
  confidence_note: issue_severity set to minor — described as a knowledge gap and
    design consideration rather than a project-level failure; no delay or cost impact
    stated.
