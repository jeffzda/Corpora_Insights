- record_id: ARENA-DLV-63655
  source_title: Advanced High-Efficiency Silicon Solar Cells Final Report
  publish_date: 2022-06
  project_name: Advanced High-Efficiency Silicon Solar Cells (UNSW ALD Passivating
    Contacts)
  what_happened: CVD/ALD processes were found to exhibit significant differences between
    initial-growth behaviour and steady-state growth behaviour due to sensitivity
    to the chemical nature of the underlying film surface; for nanoscale functional
    films used in solar cell devices, this nucleation-phase variation was found to
    materially affect device performance.
  lesson_learnt: When developing ALD or CVD processes for nanoscale functional layers
    in solar cell devices, explicitly characterise and optimise the initial (nucleation)
    growth phase separately from steady-state growth — differences between the two
    regimes can dominate device performance at thin-film thicknesses and must be managed
    during both process development and scale-up.
  issue_severity: minor
  project_type: manufacturing/supply chain
  project_scale_band: pilot
  lifecycle_phase: development/design
  proponent_type: research organisation/university
