  source_pages: &id005
  - 9
  - 16
  evidence_excerpt: ALD will be the lowest costs process in many circumstances as
    long as the learning rate of manufacturing the precursors at scale are comparable
    to what we have seen for trimethyl aluminum (used for aluminium oxide) and diethyl
    zinc (used for zinc oxide) in the past... ALD MoOx is significantly cheaper than
    p-type doped amorphous silicon in most scenarios that we simulated, as long as
    the solar cells with MoOx would have a similar performance (which is currently
    not yet the case).
