- record_id: ARENA-DLV-41701
  source_title: Advanced High Efficiency Silicon Solar Cells Employing Innovative
    Atomic Scale Engineered Surface and Contact Passivation Layers
  publish_date: '2019-08-28'
  project_name: Advanced High Efficiency Silicon Solar Cells Employing Innovative
    Atomic Scale Engineered Surface and Contact Passivation Layers
  what_happened: Laboratory-scale experiments on bifacial aluminium oxide deposition
    for PERC solar cells were initially designed without the full manufacturing process
    flow in mind, creating challenges when transferring the process to high-volume
    production. The team subsequently redesigned the ALD process from monofacial to
    bifacial deposition, which reduced process complexity, increased throughput, and
    lowered costs while delivering higher cell performance.
  lesson_learnt: Design laboratory experiments from the outset with the final manufacturing
    application in mind — accounting for all process steps and their interdependencies
    in solar cell production avoids costly redesign at the technology transfer stage
    and accelerates commercialisation.
