- record_id: ARENA-DLV-63653
  source_title: Advanced High-Efficiency Silicon Solar Cells Final Report
  publish_date: 2022-06
  project_name: Advanced High-Efficiency Silicon Solar Cells (UNSW ALD Passivating
    Contacts)
  what_happened: A techno-economic analysis using Monte Carlo simulation demonstrated
    that ALD-deposited transition metal oxide films (e.g. MoOx) are cost-competitive
    with or cheaper than PECVD and PVD counterparts across most simulated scenarios,
    provided equivalent device performance can be achieved — a condition not yet met
    at time of reporting.
  lesson_learnt: Conduct techno-economic analysis early in solar cell process development
    to identify whether a lower-cost deposition route is viable before investing in
    full device optimisation — ALD was shown to offer a manufacturing cost advantage
    over PECVD/PVD as long as precursor learning rates follow historical precedents,
    even if device performance parity has not yet been demonstrated.
  issue_severity: none
  project_type: manufacturing/supply chain
  project_scale_band: pilot
  lifecycle_phase: development/design
  proponent_type: research organisation/university
