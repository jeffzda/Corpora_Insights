- record_id: ARENA-DLV-2629
  source_title: ARENA Insights Forum November 2024 - Accelerating Zero-Emissions Heavy
    Transport
  publish_date: 2024-11
  project_name: Team Global Express – Decarbonisation Strategy
  what_happened: 'Team Global Express identified that achieving their decarbonisation
    targets requires a combination of four pillars: efficiency gains (fleet and facility),
    alternative fuels (BEV, hydrogen by end-2030, renewable diesel), renewable energy
    supply (solar, BESS, PPAs), and carbon offsets (ACCUs and LGCs) — with a recognised
    tension between costs increasing and emissions decreasing simultaneously.'
  lesson_learnt: Large fleet operators pursuing decarbonisation should plan for a
    multi-pillar strategy from the outset — no single lever (electrification, renewables,
    or offsets) is sufficient, and the combination will involve rising costs before
    emission reductions materialise, requiring board-level financial commitment and
    long-term planning horizons.
