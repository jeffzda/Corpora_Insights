- record_id: ARENA-DLV-2980
  source_title: Large-Scale Battery Storage Knowledge Sharing Report
  publish_date: 2019-09
  project_name: Lake Bonney Energy Storage System
  what_happened: Infigen developed an innovative approach to reducing Causer Pays
    Factor (CPF) costs across its generation portfolio by reducing the dead band for
    the Lake Bonney battery's contingency FCAS response to within the normal frequency
    operating band (50 ± 0.15 Hz), enabling autonomous frequency support and expected
    CPF cost reductions — a strategy not previously implemented by another LSBS proponent.
  lesson_learnt: Portfolio-scale VRE operators with co-located LSBS can reduce Causer
    Pays costs across their generation portfolio by tightening the battery's FCAS
    dead band settings to provide autonomous frequency support within the normal operating
    band; this approach requires optimisation against additional cycling costs and
    energy losses, and is only financially beneficial when the battery is not enabled
    in the Regulation FCAS market.
  issue_severity: none
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: project developer
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: follow-on scale-up enabled
  secondary_failure_mode: null
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id003
  - 15
  evidence_excerpt: Infigen's innovative solution to reducing its CPF involves reducing
    the dead band for the battery's contingency FCAS response to within the normal
    frequency operating band of 50 ± 0.15 Hz. This will enable it to autonomously
    provide a degree of frequency support within this operating band... is expected
    to reduce its total Causer Pays costs.
