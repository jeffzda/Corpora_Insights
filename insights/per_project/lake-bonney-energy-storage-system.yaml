- record_id: ARENA-DLV-2952
  source_title: Large-Scale Battery Storage Knowledge Sharing Report
  publish_date: 2019-09
  project_name: Lake Bonney Energy Storage System
  what_happened: Lake Bonney was one of the first LSBS projects in South Australia
    required to comply with the new GPS rules (AEMC rule change ERC0222, effective
    October 2018) and ESCOSA technical requirements, requiring development of a PSCAD
    model and a full impact assessment in a weak part of the grid while co-located
    with an existing wind farm.
  lesson_learnt: Projects subject to recently enacted GPS rule changes and state technical
    regulator requirements (such as ESCOSA) should budget additional time and technical
    resources for PSCAD modelling and full impact assessments — especially in weak
    grid locations — as these requirements were unforeseen in their extent and contributed
    materially to commissioning delays.
  issue_severity: major
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: grid connection/system studies
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: poor scoping
  intervention_note: Project developed a PSCAD model and undertook a full GPS and
    FIA process to meet new regulatory requirements.
  transferability: moderate
  delay_magnitude: 3-12 months
  technology_domain: battery storage
  source_pages: &id002
  - 15
  evidence_excerpt: Delay of the connection studies, including Generator Performance
    Standards (GPS), Full Impact Assessment (FIA) and Essential Services Commission
    of South Australia (ESCOSA) application were expected but unforeseen to the extent
    that has been experienced. Lake Bonney was one of the first LSBS in South Australia
    which had to comply with the new GPS rules (AEMC rule change reference ERC0222),
    which came into effect in October 2018, and the ESCOSA technical requirements.
