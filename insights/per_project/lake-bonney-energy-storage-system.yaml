  outcome_class: delayed but recoverable
  secondary_failure_mode: poor scoping
  intervention_note: Project developed a PSCAD model and progressed through the full
    impact assessment process to meet new GPS rules and ESCOSA technical requirements;
    connection approval was pending at time of report.
  transferability: moderate
  delay_magnitude: 3-12 months
  technology_domain: battery storage
