- record_id: ARENA-DLV-2951
  source_title: Large-Scale Battery Storage Knowledge Sharing Report
  publish_date: 2019-09
  project_name: Lake Bonney Energy Storage System
  what_happened: The Lake Bonney battery was fully constructed but unable to reach
    operational status due to delays in the grid connection process, resulting in
    approximately 6 months of delay at the time of reporting.
  lesson_learnt: Grid connection delays for LSBS projects — particularly those co-located
    with existing wind farms in weak grid areas and subject to new GPS rules — should
    be anticipated and buffered into project schedules; the combination of new AEMC
    GPS rules (ERC0222), ESCOSA requirements, PSCAD modelling, and full impact assessment
    in a weak network created compounding delays beyond initial expectations.
  issue_severity: major
