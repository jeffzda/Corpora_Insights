- record_id: ARENA-DLV-19955
  source_title: ARENA Insights Forum Session Summaries & Key Points
  publish_date: 2019-12
  project_name: ATCO Clean Energy Innovation Hub
  what_happened: ATCO's Clean Energy Innovation Hub experienced design and procurement
    misalignment during project development, where equipment was ordered before the
    design was finalised, requiring design changes to accommodate the procured equipment.
  lesson_learnt: Understand and finalise the project design upfront before procuring
    equipment — ordering equipment first and then adapting the design to fit it creates
    rework, delays project progress, and increases cost risk.
  issue_severity: moderate
  project_type: generation
  project_scale_band: programmatic/portfolio-level
