- record_id: ARENA-DLV-19956
  source_title: ARENA Insights Forum Session Summaries & Key Points
  publish_date: 2019-12
  project_name: ATCO Clean Energy Innovation Hub
  what_happened: ATCO identified during project development that organisations entering
    the hydrogen space without a clear understanding of where they sit in the industry
    value chain risk misalignment between project activities and forward strategy.
  lesson_learnt: Organisations entering the hydrogen sector should conduct a rigorous
    assessment of their position in the industry value chain and how it aligns with
    their forward strategy before committing to project development.
