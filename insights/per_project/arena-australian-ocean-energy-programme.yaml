- record_id: ARENA-DLV-50020
  source_title: Ocean Energy Report by Seanergy and Ernst and Young
  publish_date: 2016-06
  project_name: ARENA Australian Ocean Energy Programme
  what_happened: ARENA and Australian Federal and State Governments provided over EUR 29 million in grants to the Australian ocean energy sector over three years (2013–2016), supporting four R&D projects
    and three pre-commercial/commercial technology projects. ARENA's role was explicitly recognised as critical to enabling Carnegie Wave Energy's first-ever debt finance deal with the CEFC.
  lesson_learnt: Public grant funding from a body like ARENA plays a catalytic role in early ocean energy commercialisation that goes beyond direct project support — it signals technology credibility to
    commercial lenders and enables developers to access debt finance that would otherwise be unavailable; funders should account for this leverage effect when assessing the value of grant investments.
