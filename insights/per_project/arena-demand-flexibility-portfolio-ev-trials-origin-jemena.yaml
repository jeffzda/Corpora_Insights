- record_id: ARENA-DLV-53891
  source_title: Demand Flexibility Portfolio Retrospective Analysis Report
  publish_date: 2023-07
  project_name: ARENA Demand Flexibility Portfolio — EV Trials (Origin, Jemena)
  what_happened: EV fleet customers who chose to participate in smart charging trials
    were primarily motivated by sustainability commitments rather than economics;
    conversely, businesses that declined participation cited insufficient economic
    justification for EVs over PHEVs despite lower emissions and maintenance costs.
    Long corporate approval processes and multiple stakeholder sign-offs extended
    lead times significantly.
  lesson_learnt: EV fleet demand flexibility recruitment should segment target organisations
    by sustainability commitment rather than pure economic motivation; sales pitches
    led by economic ROI alone will fail, while targeting organisations with explicit
    EV or net-zero commitments and building in long lead times for corporate approvals
    (often 3–6 months) will yield better outcomes.
