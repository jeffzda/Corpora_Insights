- record_id: ARENA-DLV-47064
  source_title: Australian Concentrating Solar Thermal Industry Roadmap
  publish_date: 2018-08
  project_name: Aurora CST Project (Solar Reserve)
  what_happened: At the time of the Roadmap's publication (August 2018), the 150 MW
    Aurora CST project near Port Augusta — which had a signed PPA with the South Australian
    Government — had not reached financial close despite having government off-take
    support, indicating that even a government-backed PPA was insufficient to unlock
    project financing for a first-of-kind utility-scale CST project in Australia.
  lesson_learnt: A government-backed PPA alone is insufficient to achieve financial
    close for a FOAK utility-scale CST project in Australia — additional risk reduction
    measures (technology risk cover, construction risk guarantees, or concessional
    debt) are likely required to bridge the gap between government off-take commitment
    and lender confidence in an unfamiliar technology.
