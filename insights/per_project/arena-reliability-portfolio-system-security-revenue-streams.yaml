- record_id: ARENA-DLV-25924
  source_title: Review of ARENA's Reliability Portfolio
  publish_date: 2020-01
  project_name: ARENA Reliability Portfolio — System Security Revenue Streams
  what_happened: Across multiple project groups in the portfolio — including battery
    storage, large-scale coordination, and pumped hydro — the absence of clear markets
    or revenue streams for the provision of system security and short-term regulating
    services was identified as a primary barrier to establishing positive business
    cases, with projects able to demonstrate technical capability but unable to secure
    commercial viability.
  lesson_learnt: Demonstration projects for technologies that provide system security
    services (battery storage, pumped hydro, large-scale renewable hubs) should not
    be expected to achieve commercial viability until market mechanisms for system
    security services are established; ARENA should fund parallel market design work
    alongside technical demonstrations to accelerate the development of appropriate
    revenue frameworks.
