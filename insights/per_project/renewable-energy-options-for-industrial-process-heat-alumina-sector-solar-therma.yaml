- record_id: ARENA-DLV-11031
  source_title: Renewable Energy Options for Industrial Process Heat
  publish_date: 2019-08
  project_name: Renewable Energy Options for Industrial Process Heat — Alumina Sector Solar Thermal/MVR Study
  what_happened: An ARENA-funded study led by the University of Adelaide analysed solar thermal and mechanical vapour recompression (MVR) options for the digestion step of alumina refining in southwest
    WA. MVR achieved a COP of 3.3 and could potentially displace up to 12 PJ/year of natural gas with positive IRR achievable depending on electricity prices, while solar thermal with storage showed positive
    IRR only when electricity prices exceeded approximately 7 c/kWh, at which point MVR became less favourable.
  lesson_learnt: For alumina refinery low-temperature heat, MVR is preferred over solar thermal when electricity prices are below approximately 7 c/kWh, while solar thermal with storage is preferred above
    that threshold — renewable heat investment decisions for large industrial sites must be conditioned on electricity price assumptions rather than treating each technology in isolation.
