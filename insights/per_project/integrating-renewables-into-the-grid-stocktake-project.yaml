  source_title: 'Integrating Renewables into the Grid: Stocktake Project'
  publish_date: 2014-08
  project_name: 'Integrating Renewables into the Grid: Stocktake Project'
  what_happened: The stocktake found little evidence of projects that expressly sought
    to engage Australian regulators (AER or Western Australian ERA) directly. Most
    projects that touched on the regulatory environment did so in a cursory or tangential
    way, largely through analytical or desk-based approaches, without seeking direct
    regulator engagement.
  lesson_learnt: Future renewable integration projects seeking regulatory reform should
    actively consult regulators as project participants rather than merely informing
    them of results — international projects that directly engage regulators consistently
    achieve greater policy influence.
