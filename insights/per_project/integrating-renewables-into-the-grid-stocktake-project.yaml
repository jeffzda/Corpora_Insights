  what_happened: The stocktake found that technical objectives (#8–#14) scored slightly
    higher on average relevance to other entities than economic/commercial objectives
    (#1–#7), with projects for quantifiable and context-independent objectives such
    as forecasting (#14) and storing deployment information (#13) achieving the highest
    ratings despite low frequency.
  lesson_learnt: When selecting projects for funding, weight relevance and transferability
    alongside project volume — a small number of highly transferable, quantitatively
    grounded projects in underserved areas will generate more sector-wide value than
    additional projects in already well-covered objective areas.
