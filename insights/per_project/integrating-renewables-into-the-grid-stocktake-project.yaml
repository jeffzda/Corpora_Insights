  source_title: 'Integrating Renewables into the Grid: Stocktake Project'
  publish_date: 2014-08
  project_name: 'Integrating Renewables into the Grid: Stocktake Project'
  what_happened: Energy retailers were notably reluctant to submit their work to the
    stocktake, resulting in a significant underrepresentation of retailer-led projects
    relative to network and research organisation projects. Australian projects were
    sourced from research organisations far more often than from proponents, whereas
    internationally the reverse is true.
  lesson_learnt: Knowledge-sharing programs targeting the energy sector must specifically
    design incentives for retailer participation — commercial imperatives make retailers
    reluctant to share, yet their transition experience is critical for industry-wide
    learning.
