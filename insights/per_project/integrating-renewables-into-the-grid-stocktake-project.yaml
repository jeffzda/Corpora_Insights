  source_title: 'Integrating Renewables into the Grid: Stocktake Project'
  publish_date: 2014-08
  project_name: 'Integrating Renewables into the Grid: Stocktake Project'
  what_happened: Across 176 projects, the most commonly reported results related to
    voltage problems caused by high penetrations of solar PV on existing distribution
    networks. Projects found that PV, if uncontrolled, can create voltage problems
    for the network, but that these problems can be resolved in a variety of ways
    under differing conditions.
  lesson_learnt: Uncontrolled high-penetration solar PV causes voltage problems on
    distribution networks, but multiple proven technical solutions exist — new projects
    should draw on this body of evidence before commissioning new trials on the same
    problem.
