  what_happened: The stocktake found that in Australia, projects were funded by discretionary
    DNSP spend roughly twice as often as by regulatory-approved DNSP spend, while
    internationally the reverse was true. This pattern corresponded with international
    projects generally being larger in scale and more likely to seek or require regulatory
    funding approval.
  lesson_learnt: Larger-scale renewable integration demonstration projects in Australia
    should be structured to qualify for regulator-approved DNSP funding — reliance
    on discretionary spend limits project scale and visibility, and constrains the
    ambition of network-led integration trials.
