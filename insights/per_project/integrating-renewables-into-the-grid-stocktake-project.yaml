  what_happened: Projects addressing regulatory environment and internal business-model
    objectives had the highest rate of transferability limitations due to dependence
    on specific regulatory environments, with 'improving internal practices and processes
    relating to the acceptance of distributed energy resources on the network' (#7)
    showing the highest total incidence of limitations per project (0.91).
