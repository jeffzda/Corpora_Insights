  source_title: 'Integrating Renewables into the Grid: Stocktake Project'
  publish_date: 2014-08
  project_name: 'Integrating Renewables into the Grid: Stocktake Project'
  what_happened: The stocktake found that 44% of projects were still in trial/ongoing
    status and 26% had reached no decision on future direction. Only 18% had proceeded
    to commercialisation, while 12% were discontinued — indicating that the great
    majority of renewable integration projects had not yet generated conclusive commercial
    outcomes.
  lesson_learnt: ARENA should track project progression beyond initial funding rounds
    — with fewer than 1 in 5 projects reaching commercialisation and over 40% still
    undecided, portfolio-level follow-through mechanisms are needed to convert trial
    results into commercial deployment.
