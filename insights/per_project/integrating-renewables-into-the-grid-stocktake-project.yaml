  project_name: 'Integrating Renewables into the Grid: Stocktake Project'
  what_happened: Forty percent of stocktake respondents identified limitations to
    the transferability of their project results to other Australian entities, with
    the most common limitation being dependence on a specific regulatory environment
    (27% of limitations), followed by limits to availability of technology used (17%).
  lesson_learnt: When designing renewable integration projects, explicitly assess
    and document transferability constraints at the outset — particularly regulatory
    dependencies — so that results can be contextualised and applied by other entities
    with appropriate adaptation.
