    renewable integration trials were systematically under-represented in the knowledge
    base, because organisations were unwilling to disclose results that could compromise
    regulatory strategy or competitive position. Many commercially-oriented projects
    were simply not submitted to the stocktake.
  lesson_learnt: ARENA and industry bodies should establish tiered confidentiality
