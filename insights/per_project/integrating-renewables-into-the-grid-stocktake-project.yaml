  project_name: 'Integrating Renewables into the Grid: Stocktake Project'
  what_happened: Queensland was over-represented in the Australian stocktake relative
    to its size, primarily due to strong contributions from Ergon Energy and ENERGEX.
    The Northern Territory and Western Australia were under-represented despite having
    substantial off-grid and fringe-of-grid needs that may have generated many more
    relevant projects.
  lesson_learnt: ARENA knowledge-sharing initiatives should actively target off-grid
    and fringe-of-grid jurisdictions (NT, WA) to capture project experience that is
    currently invisible to the broader sector — passive submission processes will
    systematically under-represent remote and off-grid contexts.
