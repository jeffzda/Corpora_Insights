- record_id: ARENA-DLV-57807
  source_title: 'Integrating Renewables into the Grid: Stocktake Project'
  publish_date: 2014-08
  project_name: 'Integrating Renewables into the Grid: Stocktake Project'
  what_happened: Across the 176 stocktake projects, very few addressed alternative
    electricity pricing approaches (#2) thoroughly, and those that did tended to have
    low relevance scores. Trials of time-of-use, critical peak and cost-reflective
    pricing showed customers were receptive, but an unbridged gap remained between
    findings and actionable reform.
  lesson_learnt: Pricing reform projects should be explicitly designed to produce
    outputs that regulators and policymakers can act on — generating positive trial
    evidence is insufficient if the pathway from evidence to reform is not built into
    the project design.
