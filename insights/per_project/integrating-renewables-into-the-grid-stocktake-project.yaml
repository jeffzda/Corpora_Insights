- record_id: ARENA-DLV-57809
  source_title: 'Integrating Renewables into the Grid: Stocktake Project'
  publish_date: 2014-08
  project_name: 'Integrating Renewables into the Grid: Stocktake Project'
  what_happened: Across the stocktake, projects focused on improving internal practices
    and processes for accepting distributed energy resources on the network (#7) were
    rarely undertaken by DNSPs. With one exception (Ergon Energy's Business Model
    Implementation Project), DNSPs had not rigorously tackled internal, cultural and
    organisational predispositions that disadvantaged distributed energy solutions
    relative to traditional network augmentation.
