- record_id: ARENA-DLV-50021
  source_title: Ocean Energy Report by Seanergy and Ernst and Young
  publish_date: 2016-06
  project_name: Canada — Absence of Commercial-Scale Marine Energy Post-1984
  what_happened: Following the development of Nova Scotia Power's 20 MW Annapolis
    Tidal Power Plant in 1984, no commercial-scale marine energy projects have been
    developed in Canada in over 30 years, despite the country having extensive marine
    resources estimated to satisfy over 25% of Canadian electricity demand.
  lesson_learnt: Market pricing distortions from continued public ownership of electricity
    assets, and the political sensitivity of any changes to historic power costs,
    can suppress commercial ocean energy development for decades even in resource-rich
    countries; developers targeting such markets should assess whether the political
    economy of electricity pricing will support new entrants before investing in project
    development.
