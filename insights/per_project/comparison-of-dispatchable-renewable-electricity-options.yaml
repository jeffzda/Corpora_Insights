  what_happened: The Innamincka Deeps EGS project (Geodynamics) ran in standalone
    mode from June 2013 with availability exceeding 75%, achieving a maximum well
    head temperature of 215°C and a flow rate of 19 kg/s, but generating only approximately
    650 kWe gross — far below commercial scale and with flow rates lower than expected,
    particularly for natural reservoir projects.
  lesson_learnt: EGS project developers must treat flow rate assumptions as the highest-risk
    parameter — all four Australian projects that drilled to reservoir depths found
    temperatures close to expectations but flow rates below expectations, meaning
    temperature data alone is insufficient to validate project economics.
