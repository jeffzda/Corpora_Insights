    study for ARENA)
  what_happened: The study found that battery deployment had been growing at approximately
    40% per year compound growth rate and modelled continued cost reduction, with
    the modular nature of battery cells meaning the cost penalty for small systems
    is less severe but also that economies of scale for very large systems are limited
    compared to other technologies.
  lesson_learnt: Battery project developers should expect continued cost reductions
    (correlated with global deployment growth) but should not count on the same economies
    of scale from increasing project size that PHES or CST can deliver — modularity
    works both ways.
