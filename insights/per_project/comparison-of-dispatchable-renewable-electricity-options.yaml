- record_id: ARENA-DLV-13989
  source_title: Comparison of Dispatchable Renewable Electricity Options
  publish_date: '2018'
  project_name: Comparison of Dispatchable Renewable Electricity Options (ITP/ISF/ITK
    study for ARENA)
  what_happened: The study found that existing coal-fired power stations are reaching
    the end of their economic life, with around 15 GWe of coal plant retirement forecast
    by 2040 in Australia; this creates an opportunity gap but also means that the
    comparable dispatchable option for replacement is gas peaking plant at ~$145/MWh,
    which dispatchable renewable options can already match in cost while avoiding
    fuel and carbon price risks.
  lesson_learnt: Dispatchable renewable project developers should frame their economic
    case against new-build gas costs (~$145/MWh) rather than against coal or against
    VRE alone — at $90–$130/MWh for firm renewable generation, the competitive position
    is already favourable versus gas on cost alone, and the avoided fuel and carbon
    price risk strengthens the case further for long-term offtake negotiations.
