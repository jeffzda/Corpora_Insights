- record_id: ARENA-DLV-13990
  source_title: Comparison of Dispatchable Renewable Electricity Options
  publish_date: '2018'
  project_name: Comparison of Dispatchable Renewable Electricity Options (ITP/ISF/ITK
    study for ARENA)
  what_happened: The UK National Grid procured 200 MW of Enhanced Frequency Response
    (EFR) in 2016 through a competitive tender resulting in eight four-year contracts
    at an average price of £9.44/MW/h, with all winning bids coming from battery solutions
    despite proponents of demand reduction and thermal generation also bidding — delivering
    an estimated saving of £200 million over four years.
  lesson_learnt: Battery storage developers targeting fast frequency response markets
    should note that competitive EFR tenders have resulted in batteries consistently
    winning against demand response and thermal alternatives — developers should ensure
    their control systems can meet 100% active power output within 1 second of registering
    a frequency deviation, as this performance threshold is the key differentiator.
