  source_title: Comparison of Dispatchable Renewable Electricity Options
  publish_date: '2018'
  project_name: Comparison of Dispatchable Renewable Electricity Options (ITP/ISF/ITK
    study for ARENA)
  what_happened: The study found no single technology winner across all timescales
    — PV/wind with batteries, PHES, hydrogen, CST, bioenergy, and geothermal each
    occupy overlapping cost-competitive niches, and at each timescale there are multiple
    options within the general least-cost band.
  lesson_learnt: Technology selection for dispatchable renewable projects should not
    be driven by a presumption that one technology is universally 'best'; project
    developers should evaluate technology fit against the specific duration of dispatch
    required, resource availability, and site conditions before committing to a configuration.
