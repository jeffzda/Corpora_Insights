  what_happened: The ISF study for ACOLA (Rutovitz et al., 2017) found that system
    security requirements (power capacity MW) dominate storage requirements until
    very high VRE penetration (~70%), at which point adequacy (energy capacity MWh)
    becomes the binding constraint; by 2030 in a 50% renewable scenario, modelling
    showed a need for 5 GWh of stored energy for adequacy and 16.8 GW for system security.
  lesson_learnt: Storage project developers and system planners should distinguish
    between power capacity (MW) requirements for system security and energy capacity
    (MWh) requirements for adequacy — at moderate VRE penetrations below ~70%, the
    sizing constraint is power capacity not energy capacity, and projects that optimise
    only for energy will be over-built on storage relative to what the system actually
    needs.
