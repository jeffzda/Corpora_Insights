  what_happened: The study found that a compound growth rate of ~25% per year in installed
    dispatchable renewable capacity would be achievable and would keep pace with projected
    coal plant retirements (~15 GWe by 2040), enabling an orderly energy transition,
    compared to some technologies that have already shown 40% per year global deployment
    growth.
  lesson_learnt: Energy policy and investment should be planned around the achievability
    of ~25% per year compound growth in dispatchable renewable capacity — this is
    well within demonstrated global growth rates for key technologies and is sufficient
    to match coal retirement timelines, but requires consistent policy signals and
    ongoing investment pipelines rather than episodic procurement.
