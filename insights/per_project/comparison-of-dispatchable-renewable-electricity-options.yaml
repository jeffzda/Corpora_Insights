  source_title: Comparison of Dispatchable Renewable Electricity Options
  publish_date: '2018'
  project_name: Comparison of Dispatchable Renewable Electricity Options (ITP/ISF/ITK
    study for ARENA)
  what_happened: The proposed Snowy 2.0 project (2000 MW power, 350,000 MWh storage)
    was identified in the study with an anticipated cost of $3.8–4.5 billion, which
    on a per-MWh basis was much cheaper than other PHES projects because the reservoir
    capacity is very large and already exists; however transmission costs would be
    additional including a 2000 MW line and a 1300 MW interconnector upgrade.
  lesson_learnt: Large PHES projects using existing reservoirs can achieve very low
    per-MWh costs, but project developers and funders must account for substantial
    transmission augmentation costs that can add significantly to the total project
    cost and may require separate regulatory cost-sharing determinations.
  issue_severity: none
