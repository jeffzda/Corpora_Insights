  what_happened: The study identified that establishing a short rotation coppice mallee
    industry for bioenergy combustion plant in Australia has so far been elusive despite
    reasonable economics, with the supply chain establishment problem — developers
    need feedstock supply before building the plant, but suppliers need demand before
    establishing supply — representing a persistent market failure.
  lesson_learnt: Bioenergy project developers targeting purpose-grown energy crops
    should not assume the supply chain will establish itself in response to demand
    — active co-investment in or long-term contracting for feedstock supply chains
    must be part of the project development structure from the outset, potentially
    requiring government co-investment or regulatory support to break the chicken-and-egg
    impasse.
