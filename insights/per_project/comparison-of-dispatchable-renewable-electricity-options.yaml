  what_happened: The study found that hydrogen storage systems are now commercially
    available at scale but are at too early a stage to draw conclusions on the likely
    rate of deployment and cost reduction; hydrogen was identified as the cheapest
    non-biomass option for long-term (seasonal) energy reserve on a $/MWh storage
    capacity basis.
