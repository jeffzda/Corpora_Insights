- record_id: ARENA-DLV-13987
  source_title: Comparison of Dispatchable Renewable Electricity Options
  publish_date: '2018'
  project_name: Comparison of Dispatchable Renewable Electricity Options (ITP/ISF/ITK
    study for ARENA)
  what_happened: The study identified that the South Australian REIPPPP used a differentiated
    tariff with a peaking rate component — applied from 4:30–9:30pm at 270% of the
    base rate — as a mechanism to explicitly value CST dispatchability, and that incorporating
    time-of-use pricing multipliers into renewable energy support mechanisms is a
    viable policy approach to encourage dispatchable generation.
  lesson_learnt: CST and other dispatchable renewable project developers in markets
    with time-of-use or peak pricing support mechanisms should design projects to
    maximise generation during high-value periods rather than maximising total annual
    output — the South African model shows a peak rate at 270% of the base rate is
