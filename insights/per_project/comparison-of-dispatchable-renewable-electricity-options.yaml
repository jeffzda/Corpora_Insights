    periods), underground hydrogen storage is the cheapest non-biomass option at ~$3/MWh
    at 1% utilisation; project developers designing dispatchable systems with a long-term
    reserve component should evaluate hydrogen alongside biomass before defaulting
    to batteries or PHES for this specific function.
