- record_id: ARENA-DLV-13951
  source_title: Comparison of Dispatchable Renewable Electricity Options
  publish_date: '2018'
  project_name: Comparison of Dispatchable Renewable Electricity Options (ITP/ISF/ITK
    study for ARENA)
  what_happened: The study found that at 2017 costs, multiple dispatchable renewable
    electricity options deliver firm power at 1.5–2 times the cost of variable renewable
    energy (VRE) across all timescales from immediate firming to 24+ hours of storage,
    with a general least-cost band of approximately $90–$130/MWh at 6.5% WACC.
  lesson_learnt: Project developers and investors should not assume dispatchable renewable
    generation is prohibitively expensive relative to VRE — at a general least-cost
    band of $90–$130/MWh it is comparable to new-build gas (estimated ~$145/MWh) while
    avoiding fuel and carbon price risks.
