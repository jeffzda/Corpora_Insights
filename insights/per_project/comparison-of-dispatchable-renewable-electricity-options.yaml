  lifecycle_phase: development/design
  proponent_type: government/public-sector body
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Snowy Hydro argued that assigning all transmission costs to the
    PHES project was not reasonable and that a regulated cost-sharing determination
    should be made.
  transferability: moderate
  delay_magnitude: null
  technology_domain: pumped hydro
  source_pages: &id008
