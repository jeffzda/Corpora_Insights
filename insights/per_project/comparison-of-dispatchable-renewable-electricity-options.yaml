  what_happened: The study found that batteries are uncompetitive against PHES, molten
    salt, biogas, and hydrogen for long-term energy reserve (seasonal backup) applications,
    with batteries costing $1,076/MWh at 1% utilisation compared to $3–$68/MWh for
    other options, and this remains the case even with likely cost reductions over
    coming decades.
