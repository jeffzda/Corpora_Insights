  source_title: Comparison of Dispatchable Renewable Electricity Options
  publish_date: '2018'
  project_name: Comparison of Dispatchable Renewable Electricity Options (ITP/ISF/ITK
    study for ARENA)
  what_happened: The study found that for individual standalone energy storage systems
    (e.g. a pump hydro or battery system built to provide firming services to a VRE
    generator), the underlying arbitrage potential drives value but the assumption
    of daily cycling means calculations represent a lower boundary — smart control
    systems responding to real-time prices can substantially improve on this.
  lesson_learnt: Storage project developers modelling revenue should treat simple
    daily price arbitrage models as a conservative lower bound — operational optimisation
    through advanced control and forecasting systems (as demonstrated in projects
    like the Hornsdale Power Reserve) can materially increase revenue relative to
    mechanical cycling models, and this upside should be quantified during feasibility.
