  project_name: Comparison of Dispatchable Renewable Electricity Options (ITP/ISF/ITK
    study for ARENA)
  what_happened: Estimating costs for PHES systems was identified as extremely challenging
    because projects are site-specific and costs vary according to local environmental
    constraints; projects using existing large lakes or rivers as reservoirs reduce
    costs significantly by saving on reservoir construction.
  lesson_learnt: PHES developers should prioritise sites with existing reservoirs
    or large natural water bodies as the lower storage — reservoir construction and
    civil works are the dominant cost variable and can represent over 50% of project
    cost, making greenfield dam construction materially more expensive.
