    reserve capability should not use batteries for this function — at 1% utilisation
    the annualised battery cost is approximately 15–300 times more expensive than
    hydrogen, PHES, biogas or molten salt alternatives, and this relative disadvantage
    is structural rather than likely to be corrected by near-term cost reductions.
