  project_name: Comparison of Dispatchable Renewable Electricity Options (ITP/ISF/ITK
    study for ARENA)
  what_happened: The cost analysis found that battery systems are most cost-competitive
    at storage durations of less than approximately three hours, with the lowest LCOE
    occurring at around half an hour of storage, making them specifically suited to
    smoothing and firming of wind and PV output rather than extended dispatch.
  lesson_learnt: Developers scoping battery-plus-VRE projects should target short-duration
    firming applications (under ~3 hours) to achieve competitive LCOEs; using batteries
    to provide extended strategic dispatch (6+ hours) will result in significantly
    higher costs compared to PHES or CST alternatives.
