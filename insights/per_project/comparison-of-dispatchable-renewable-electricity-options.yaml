  what_happened: The study modelled price arbitrage for electricity storage using
    2016 NEM data and found that with perfect foresight, average price spreads in
    SA were considerably higher than NSW, with five hours of storage in SA in 2016
    generating approximately $18/MWh annual average daily price spread; strategies
    based only on price history achieved around $113/MWh in NSW and $240/MWh in SA
    in revenue per MWh of sold energy.
