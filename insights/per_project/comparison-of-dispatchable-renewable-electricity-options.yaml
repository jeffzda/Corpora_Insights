  what_happened: The study found that all dispatchable renewable generation options
    are capable of providing most or all ancillary services and system security support,
    depending on the characteristics of the final energy conversion subsystem, with
    inverter-based systems (batteries) able to provide synthetic inertia but not synchronous
    generation, while steam and gas turbine systems provide synchronous generation
    with inertia but slower frequency response.
  lesson_learnt: Developers designing dispatchable renewable projects should assess
    ancillary service revenue potential against the final conversion technology choice
    at the concept stage — the ability to earn FCAS and system security revenue varies
    materially by technology and can significantly affect project economics, with
    battery inverters suited to fast frequency response and steam/gas turbines suited
    to inertia and synchronous condenser services.
