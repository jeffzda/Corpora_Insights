  source_title: Comparison of Dispatchable Renewable Electricity Options
  publish_date: '2018'
  project_name: Comparison of Dispatchable Renewable Electricity Options (ITP/ISF/ITK
    study for ARENA)
  what_happened: The study found that a strategically operated dispatchable renewable
    energy system could have an additional long-term energy reserve by adding storage
    kept fully charged for contingency periods at a marginal cost of $60–$70/MWh for
    PHES, molten salt CST, and biogas options, bringing energy cost in extended low-sun/low-wind
