  source_title: Comparison of Dispatchable Renewable Electricity Options
  publish_date: '2018'
  project_name: Comparison of Dispatchable Renewable Electricity Options (ITP/ISF/ITK
    study for ARENA)
  what_happened: The study found that the likely least-cost future electricity system
    is a mix of variable and dispatchable renewable technologies at different durations
    and locations, with the average LCOE of such a system considerably lower than
    dispatchable generation alone — for example, adding 30% dispatchable renewable
    to VRE raises average LCOE from ~$65/MWh to ~$80/MWh.
  lesson_learnt: Policy designers and system planners should avoid mandating high
    fractions of dispatchable generation — the average system cost rises steeply as
    the fraction of dispatchable generation increases, and the optimal mix is likely
    to involve a substantially larger share of VRE with a targeted dispatchable component
    rather than a like-for-like dispatchable replacement for retiring coal capacity.
