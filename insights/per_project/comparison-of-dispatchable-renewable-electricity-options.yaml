  what_happened: The study identified that curtailment and controlled output of wind
    or PV at up to 50% could provide a level of short-term dispatchability at low
    cost — comparable or complementary to adding short-duration batteries to VRE plants
    for firming — though it cannot deliver strategically dispatchable generation.
  lesson_learnt: VRE project developers seeking to provide firming services should
    evaluate deliberate curtailment as a low-cost first option for short-duration
    dispatchability before adding battery storage — curtailment to 50% of capacity
    provides immediate up/down control capability with no additional capital cost,
    though it cannot substitute for strategic multi-hour dispatch.
