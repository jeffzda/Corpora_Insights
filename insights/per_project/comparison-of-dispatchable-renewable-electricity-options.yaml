    study for ARENA)
  what_happened: The study found that PHES combined with wind or PV offers competitive
    and relatively constant LCOE across all storage durations, with particular cost
    advantage beyond six hours of storage, but is the most site-specific of all dispatchable
    options and costs vary greatly between projects depending on geology and head
    height.
  lesson_learnt: PHES project developers must conduct rigorous site-specific cost
    assessment before making investment decisions — generic cost benchmarks for PHES
    have wider uncertainty than other technologies, and the Finkel Review-era estimates
    of $37,000/MWh for dam costs can shift substantially with site conditions.
