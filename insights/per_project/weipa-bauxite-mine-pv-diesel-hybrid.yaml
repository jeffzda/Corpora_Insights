- record_id: ARENA-DLV-71054
  source_title: Hybrid Power Generation for Australian Off-Grid Mines
  publish_date: 2018-06
  project_name: Weipa Bauxite Mine PV-Diesel Hybrid
  what_happened: The Weipa bauxite mine's 1.2 MWAC PV-diesel hybrid facility (6.5%
    renewable power fraction) experienced a six-month ramp-up period after commissioning
    before reaching stable operation.
  lesson_learnt: Even low-penetration PV-diesel hybrid systems require a ramp-up period
    — approximately six months at ~6.5% RPF — so operational performance and financial
    forecasts should not assume immediate full-capacity operation from commissioning
    date.
