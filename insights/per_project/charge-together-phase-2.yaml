    simultaneously before concluding that focusing on a single partner (NRMA) was
    more effective for building a collaborative development process.
  lesson_learnt: Focus on one channel partner when developing a consumer-facing digital
    product — attempting to work across multiple channels simultaneously fragments
    the development process and reduces the quality of collaboration needed to align
    on scope and deliverables.
