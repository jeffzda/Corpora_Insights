- record_id: ARENA-DLV-63712
  source_title: BetterFleet Lessons Learnt
  publish_date: 2020-03
  project_name: Charge Together Phase 2 (BetterFleet)
  what_happened: Organisations with longer-term planning horizons (particularly local
    governments with 5–10 year emissions goals) were more likely to successfully progress
    through fleet electrification transition, while organisations operating on short
    planning cycles tended to evaluate EVs opportunistically without building the
    institutional structures needed for a successful transition.
  lesson_learnt: Screen prospective fleet transition clients for long-term planning
    orientation before investing engagement resources — organisations without multi-year
    emissions targets or planning cycles are unlikely to complete a transition process
    and should be deprioritised in resource allocation.
