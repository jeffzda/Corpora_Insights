  what_happened: 'Data collection was a major challenge: most fleet organisations
    had limited access to usable telematics or operational data, were sensitive about
    sharing GPS data, and had not implemented GPS due to internal privacy concerns,
    leaving fuel card data as the most common available source.'
  lesson_learnt: Fleet EV transition tools must be designed to function with minimal
    data inputs — specifically fuel card data as the baseline — because GPS and telematics
    data are frequently unavailable or withheld due to privacy concerns; do not build
    core value propositions around data that most organisations cannot or will not
    supply.
