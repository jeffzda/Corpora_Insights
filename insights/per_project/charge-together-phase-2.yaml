- record_id: ARENA-DLV-30154
  source_title: EVExperience Lessons Learnt
  publish_date: 2020-03
  project_name: Charge Together Phase 2
  what_happened: Using fixed-price contracting with an agile, evolving scope caused
    significant delivery friction — changing scope mid-sprint led to wasted work,
    resourcing challenges for the contractor, and contractual relationship breakdown.
  lesson_learnt: Do not apply fixed-price contracts to agile software development
    projects with evolving scope — the mismatch between fixed commercial terms and
    iterative scope discovery leads to wasted work and relationship breakdown; instead,
    structure the entire engagement as an end-to-end agile arrangement with scope
    fixed only a week ahead.
  issue_severity: major
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: approvals/contracting
  proponent_type: technology vendor
  delay_category: internal governance/resourcing
  failure_mode: coordination & stakeholders
  outcome_class: re-scoped/adapted
  secondary_failure_mode: execution & logistics
  intervention_note: Adopted a fully agile arrangement with scope fixed only one week
    ahead as the standard end-to-end delivery approach.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: EV
  source_pages: &id004
  - 8
  evidence_excerpt: We had to overcome many challenges trying to do fixed price contracting
    with an agile scope. Especially as there were many 3rd party stakeholders involved
    this process became quite difficult and led to wasted work... The key learning
    from this experience is that the agile arrangement with scope fixed a week ahead
    should be an end to end process throughout delivery.
  confidence_note: null
