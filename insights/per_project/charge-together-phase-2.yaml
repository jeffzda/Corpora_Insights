  what_happened: The program found that a small number of commercially available EVs
    within fleet price thresholds (Hyundai Ioniq, Hyundai Kona, Nissan Leaf, Renault
    Zoe, Renault Kangoo) constrained the platform's ability to offer meaningful substitution
    analysis, as fleet managers focused only on these models when comparing to existing
    fleet choices.
