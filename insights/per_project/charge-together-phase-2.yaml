- record_id: ARENA-DLV-30156
  source_title: EVExperience Lessons Learnt
  publish_date: 2020-03
  project_name: Charge Together Phase 2
  what_happened: Third-party organisations integrating with the EVExperience platform
    preferred an embeddable widget over direct API integration — contrary to the team's
    assumption that partners would build their own front-ends using the APIs.
  lesson_learnt: When building a modular API platform for third-party integrators,
    do not assume partners have the technical capacity or appetite to build their
    own front-ends — design and offer embeddable widgets as the default integration
    path, not raw API access.
