- record_id: ARENA-DLV-30155
  source_title: EVExperience Lessons Learnt
  publish_date: 2020-03
  project_name: Charge Together Phase 2
  what_happened: The team invested significant effort designing a full user account
    and data retention system before realising it was not necessary for Phase 1 —
    the product's immediate goal only required capturing a minimal email address for
    follow-up engagement.
  lesson_learnt: Avoid over-engineering data capture and account management features
    in Phase 1 of a consumer digital product — start with the simplest solution (email
    capture and wish-list email) and defer complex account creation until user demand
    and product-market fit justify the investment.
  issue_severity: minor
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: null
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Descoped user account creation from Phase 1 and replaced it with
    a simple email-capture and wish-list email solution, freeing resources for higher-priority
    features.
  transferability: broad
  delay_magnitude: null
  technology_domain: EV
  source_pages: &id005
  - 8
  - 9
  evidence_excerpt: Initially we thought it was important for us to create an account
    for the user and we put a lot of effort into analysing and solutioning on how
    we could capture and retain user data in a secure way. However, as we worked through
    the scope for Phase 1, we realised that account creation was not necessary as
