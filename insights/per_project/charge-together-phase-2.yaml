  project_name: Charge Together Phase 2
  what_happened: The project team needed to establish a collaborative design process
    with the selected partner (NRMA) to agree on the scope of Phase 1 deliverables,
    recognising that the right scope for the current state of EV market maturity was
    consumer information and engagement rather than a full brokerage model.
  lesson_learnt: Before committing to a scope for Phase 1, establish a collaborative
