  project_name: Charge Together Phase 2 (BetterFleet)
  what_happened: An evangelical or overtly 'pro-EV' tone in platform communications
    was found to be counterproductive with sceptical fleet managers, reducing their
    likelihood of engaging with information and opportunities.
  lesson_learnt: Fleet EV transition platforms and programs should maintain an impartial,
    evidence-based voice — positioning the tool as providing fair comparisons across
    all vehicles rather than promoting EVs will be more effective with the sceptical
    fleet manager audience.
