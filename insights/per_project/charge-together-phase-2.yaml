  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Pivoted to building embeddable widgets that could be placed on
    third-party content pages, which is what partners including NSW Government and
    the EVC actually wanted.
  transferability: moderate
