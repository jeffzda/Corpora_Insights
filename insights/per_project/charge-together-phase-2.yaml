- record_id: ARENA-DLV-30153
  source_title: EVExperience Lessons Learnt
  publish_date: 2020-03
  project_name: Charge Together Phase 2
  what_happened: The limited availability of EVs in the Australian market meant that
    a strict vehicle-matching filter (showing only vehicles that met the user's criteria)
    would return no results for most users, undermining the platform's purpose.
  lesson_learnt: In a nascent EV market with limited vehicle availability, a consumer
    tool that filters to exact matches will fail most users — design the matching
    algorithm to display all available vehicles ranked by suitability score rather
    than applying hard exclusion filters, so users are still educated and engaged
    even when no perfect match exists.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Readjusted the matching algorithm to display all available vehicles
    ranked by weighted score rather than filtering to exact matches, achieving consumer
    education and engagement goals despite limited vehicle supply.
  transferability: moderate
  delay_magnitude: null
  technology_domain: EV
  source_pages: &id003
  - 9
  evidence_excerpt: Initially we had designed the application so that it only showed
    the EVs that fit with the user's criteria - however due to the limited availability
    of EVs in the Australian market and the barriers aforementioned, this limited
    the results with potentially most users getting no suitable vehicles being available.
  confidence_note: null
