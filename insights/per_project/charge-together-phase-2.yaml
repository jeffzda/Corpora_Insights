- record_id: ARENA-DLV-30158
  source_title: EVExperience Lessons Learnt
  publish_date: 2020-03
  project_name: Charge Together Phase 2
  what_happened: EV consumer product commercialisation required going beyond vehicle
    referral revenue to address the full consumer transition journey — encompassing
    home charging equipment, renewable energy switching, insurance, and roadside assistance
    — because the EV lifestyle setup is inherently more complex than a conventional
    vehicle purchase.
  lesson_learnt: When designing commercialisation for an EV consumer platform, structure
    it as a one-stop-shop brokerage across the full EV transition journey (vehicle,
    charger, energy, insurance) rather than a single-product referral model — the
    complexity of the EV lifestyle setup means consumers need and value end-to-end
    support, which also expands the addressable revenue base.
  issue_severity: none
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: follow-on scale-up enabled
  secondary_failure_mode: null
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: EV
  source_pages: &id008
  - 6
  evidence_excerpt: A key lesson around product commercialisation is that it is also
    about simplifying the customer journey for the end user - the electric life can
    initially be more complicated in terms of set up - since the consumer needs to
    not just buy the car but also get access to a charger, and potentially switch
    to renewable energy for charging.
