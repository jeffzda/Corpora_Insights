  project_name: Charge Together Phase 2 (BetterFleet)
  what_happened: Corporate sector engagement was very low compared to local government;
    Australian corporations were largely disengaged from fleet electrification, with
    many having outsourced fleet management to salary packaging arrangements that
    removed emissions from their reporting obligations.
  lesson_learnt: Fleet EV transition programs should prioritise local government and
    public-sector organisations over private corporations in early deployment — corporations'
    shorter planning cycles and salary-packaging structures reduce their motivation
    to engage with fleet electrification platforms.
