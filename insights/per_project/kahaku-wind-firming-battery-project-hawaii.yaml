- record_id: ARENA-DLV-16252
  source_title: Energy Storage Study
  publish_date: 2015-07
  project_name: Kahaku Wind-Firming Battery Project (Hawaii)
  what_happened: A 15 MW battery system paired with a 30 MW wind farm in Hawaii was
    destroyed by fire in 2012 (a second fire following one in 2011). Investigations
    found the Dynapower inverters were insufficiently robust. Battery provider Xtreme
    Power filed for bankruptcy in 2014.
  lesson_learnt: Inverter robustness is a critical failure point for wind-firming
    battery projects; ensure inverter specifications are rigorously validated before
    deployment, and do not underestimate fire risk from battery-inverter integration
    — a single supplier failure can result in total asset loss and project collapse.
