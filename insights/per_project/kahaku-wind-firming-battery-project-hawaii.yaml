  evidence_excerpt: The battery storage system was destroyed in 2012 after a second
    fire (following a previous fire in 2011). Honolulu's fire captain described the
    fire as difficult to control and dangerous, illustrating the potential safety
    hazards broadly associated with storage. Investigations into the cause of the
    fires indicated that the Dynapower inverters were not sufficiently robust. Battery
    provider Xtreme Power filed for bankruptcy in 2014.
