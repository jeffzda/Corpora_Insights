- record_id: ARENA-DLV-25905
  source_title: Review of ARENA's Reliability Portfolio
  publish_date: 2020-01
  project_name: Solar Thermal Feasibility Assessments (Port Augusta and Collinsville)
  what_happened: Two location-specific solar thermal feasibility assessments — the
    Port Augusta Solar Thermal Feasibility Study (Alinta Holdings) and the Collinsville
    coal-to-solar-thermal conversion study (RATCH-Australia) — were terminated after
    proponents found the projects were not commercially viable, adding to the evidence
    that concentrating solar thermal faces excessive capital costs and deployment
    costs under current Australian market conditions.
  lesson_learnt: Feasibility studies that terminate due to non-viability still generate
    valuable negative knowledge for the sector; funder portfolios should treat terminated
    feasibility studies as informative outcomes rather than failures, and use findings
    to calibrate whether demonstration-scale investment is premature.
