  source_title: WALGA - Accelerating the Local Government Transition to BEVs in Western
    Australia - Infrastructure and Design Report
  publish_date: '2025-01-15'
  project_name: Accelerating the Local Government Transition to BEVs in Western Australia
  what_happened: Tritium, the selected DC charger vendor for bulk supply of RTM 75
    units across Local Government sites, entered administration in late February 2024
    — immediately after the official project agreement was signed — rendering the
    specified product inaccessible and requiring urgent procurement of an alternative
    DC charger.
  lesson_learnt: Identify and contract a secondary supplier for critical equipment
    before project commencement — when Tritium went into administration, a pre-identified
    alternative (Schneider EVlink Pro DC) was selected quickly enough to remain within
    project timelines. Having contingency suppliers in place is essential for programmatic
    fleet electrification projects.
