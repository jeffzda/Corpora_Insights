- record_id: ARENA-DLV-44652
  source_title: WALGA - Accelerating the Local Government Transition to BEVs in Western
    Australia - Lessons Learnt Report No 1
  publish_date: 2024-11
  project_name: Accelerating the Local Government Transition to BEVs in Western Australia
  what_happened: One participating Local Government conducted its own separate procurement
    process for EV charger supply and installation rather than using the project's
    awarded tender supplier, because the original Expression of Interest did not mandate
    use of the preferred supplier. This caused delays and caused WALGA to miss a milestone
    on the number of installed chargers.
  lesson_learnt: Mandate the use of a single installation supplier across all participants
    in a multi-party aggregated procurement — allowing participants to source alternatives
    introduces software platform incompatibilities and scheduling complications that
    undermine the efficiency gains of aggregation.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: construction/installation
  proponent_type: government/public-sector body
  delay_category: commissioning/integration
  failure_mode: coordination & stakeholders
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: WALGA recommended implementing a more stringent member agreement
    with participating Local Governments to ensure use of the preferred supplier and
    preserve project funds.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: EV
  source_pages:
  - 3
  - 8
  evidence_excerpt: An issue arose when the Expression of Interest with the Local
    Governments did not mandate the use of the preferred supplier. As a result, one
    Local Government conducted a separate procurement process, causing delays and
    leading WALGA to miss a milestone regarding the number of installed chargers.
