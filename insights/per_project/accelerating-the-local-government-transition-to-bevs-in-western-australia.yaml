  project_name: Accelerating the Local Government Transition to BEVs in Western Australia
  what_happened: Regional and remote Local Governments faced substantially higher
    electrical installation and grid upgrade costs compared to metropolitan counterparts,
    creating a structural equity barrier to EV fleet adoption for smaller and more
    remote councils.
  lesson_learnt: When designing aggregated fleet electrification programs that include
    regional and remote participants, account explicitly for the significantly higher
    installation and grid upgrade costs in regional settings — cost-sharing or tiered
    subsidy structures may be necessary to maintain equitable participation and prevent
    remote councils from being priced out.
