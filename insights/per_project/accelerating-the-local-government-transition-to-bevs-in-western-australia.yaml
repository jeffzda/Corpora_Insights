  project_name: Accelerating the Local Government Transition to BEVs in Western Australia
  what_happened: Staff turnover among Local Government facilities managers, fleet
    coordinators, sustainability officers, and financial personnel led to changes
    in project implementation direction and the need to re-educate incoming staff
    on project requirements, contributing to delays and scope changes across multiple
    sites.
  lesson_learnt: Plan for staff turnover in long-running multi-party programs by developing
    onboarding materials and structured knowledge transfer processes for new participant
    staff — reliance on organisational memory held by individual contacts creates
    recurring re-education overhead and misalignment of project intentions.
