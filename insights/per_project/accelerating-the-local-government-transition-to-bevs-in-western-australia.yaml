  project_name: Accelerating the Local Government Transition to BEVs in Western Australia
  what_happened: Changes to Australian Standards AS/NZS 61439 for switchboard design
    took effect just before the project rollout began, rendering the original solution
    of adding dedicated EV distribution boards or additional circuit breakers to existing
    switchboards non-compliant — switchboards that had been assessed as suitable for
    modification had to be fully replaced instead.
  lesson_learnt: Check the forward schedule of Australian Standards revisions during
    project design — standards changes to AS/NZS 61439 took effect mid-project and
    converted planned low-cost switchboard modifications into full replacements, substantially
    increasing cost and triggering network operator involvement.
