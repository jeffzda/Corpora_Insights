- record_id: ARENA-DLV-44651
  source_title: WALGA - Accelerating the Local Government Transition to BEVs in Western
    Australia - Lessons Learnt Report No 1
  publish_date: 2024-11
  project_name: Accelerating the Local Government Transition to BEVs in Western Australia
  what_happened: Coordinating across 22 Local Governments and multiple State Government
    departments caused schedule overruns because each entity operates on different
    internal timelines. Western Power, for example, allocates over 12 months to complete
    a project, while EV charger installations were expected to proceed within a couple
    of months.
  lesson_learnt: When aggregating multiple local government participants and state-owned
    utilities into a single project, build significantly extended milestones into
    the schedule to accommodate the varying internal timelines of each entity — particularly
    where a network utility (e.g. Western Power) requires 12+ months for approvals
    that the installation team can complete in weeks.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: procurement
  proponent_type: government/public-sector body
  delay_category: procurement/supply chain
  failure_mode: coordination & stakeholders
  outcome_class: delayed but recoverable
  secondary_failure_mode: regulatory & approvals
  intervention_note: Close support from the selected supplier EV Charging Systems
    and equipment vendors enabled alignment of separate orders to preserve bulk pricing
    despite the fragmented procurement process.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: EV
  source_pages:
  - 2
  - 3
  - 5
  - 8
  evidence_excerpt: However, delays were encountered with purchase orders from the
    22 Local Government participants due to the need for individual purchase orders.
    Each Local Government had its own requirements, sign-off approvals, funding pools,
    and allocations for supplementary equipment and works at various stages of readiness.
