  publish_date: '2025-01-15'
  project_name: Accelerating the Local Government Transition to BEVs in Western Australia
  what_happened: Site assessments conducted during project evaluation became outdated
    by the time implementation commenced, due to staff turnover, revised fleet transition
    plans, facility reconfigurations, updated regulatory guidelines, and additional
    electrical loads added after initial load studies — requiring reassessment of
    approximately 70 site locations across 22 Local Governments.
  lesson_learnt: Site assessments for EV charging infrastructure should be treated
    as living documents and refreshed immediately before equipment ordering — conditions
    across multi-participant fleet programs change rapidly enough that assessments
    conducted at funding application stage may be materially obsolete by implementation.
