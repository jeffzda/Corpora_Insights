  publish_date: '2025-01-15'
  project_name: Accelerating the Local Government Transition to BEVs in Western Australia
  what_happened: Increased electrical loads were added to multiple project sites after
    initial load studies were completed, as infrastructure upgrades planned and funded
    separately by Local Governments came to fruition during the ARENA project's scoping
    and assessment phase — electrical capacity assumed available for EV charging was
    no longer available at those sites.
  lesson_learnt: When assessing electrical capacity for EV charging installations
    at multi-department organisations such as local governments, engage facility services
    directly and cross-check all planned infrastructure projects — fleet and sustainability
    teams often have no visibility of electrical upgrade projects proceeding independently
    through capital works pipelines.
