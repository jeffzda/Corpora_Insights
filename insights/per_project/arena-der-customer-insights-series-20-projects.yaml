- record_id: ARENA-DLV-58817
  source_title: 'DER Customer Insights: The Customer Journey'
  publish_date: 2020-07
  project_name: ARENA DER Customer Insights Series (20 projects)
  what_happened: CSIRO's study on householder interest in solar DER found that the
    aesthetics of battery storage equipment — particularly its size and required placement
    on non-combustible surfaces with cement sheeting — were a barrier to uptake among
    prospective DER customers.
  lesson_learnt: Address battery aesthetics and placement requirements explicitly
    in customer communications and product design — physical appearance and intrusive
    installation requirements (cement plinths, wall sheeting) are a genuine barrier
    to DER uptake and should be minimised or framed proactively.
