- record_id: ARENA-DLV-58813
  source_title: 'DER Customer Insights: The Customer Journey'
  publish_date: 2020-07
  project_name: ARENA DER Customer Insights Series (20 projects)
  what_happened: Several DER projects failed to plan for what would happen to customers
    at the conclusion of trials, leaving it unclear how ongoing support would be provided,
    which risked damaging long-term trust in DER technologies and future trial participation.
  lesson_learnt: Plan for end-of-trial customer legacy before deployment begins —
    failing to define how customers will be supported after a trial ends undermines
    trust and risks long-term disengagement from DER, particularly for early adopters
    who have invested in the technology.
