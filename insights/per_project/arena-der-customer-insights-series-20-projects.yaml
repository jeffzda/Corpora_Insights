- record_id: ARENA-DLV-58808
  source_title: 'DER Customer Insights: The Customer Journey'
  publish_date: 2020-07
  project_name: ARENA DER Customer Insights Series (20 projects)
  what_happened: Across multiple DER projects, installer cashflow issues caused significant
    delays to installations, particularly where most installs required some rectification
    work and payment to installers was withheld until rectification was completed.
  lesson_learnt: Structure installer payment terms to avoid cashflow pressure causing
    installation delays — withholding full payment until rectification is complete
    creates a bottleneck when most sites require some form of rework; consider milestone-based
    payment structures instead.
