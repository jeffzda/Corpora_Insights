- record_id: ARENA-DLV-58812
  source_title: 'DER Customer Insights: The Customer Journey'
  publish_date: 2020-07
  project_name: ARENA DER Customer Insights Series (20 projects)
  what_happened: Across multiple DER trials, customers placed a much higher premium
    on backup power and control over their battery systems than project designers
    assumed, and were willing to forgo additional financial benefits to maintain that
    control; only 16% of customers in one project were comfortable with third-party
    control of their DER.
  lesson_learnt: Do not assume customers will accept third-party control of their
    DER in exchange for financial benefits — most early adopters prioritise energy
    independence and backup power over revenue; ownership and control models must
    be designed to reflect this or opt-in rates will be far lower than projected.
  issue_severity: major
  project_type: DER/customer-side
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: operations
  proponent_type: government/public-sector body
  delay_category: null
  failure_mode: commercial & market
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: null
  transferability: broad
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id005
  - 16
  evidence_excerpt: One project said only 16% of their customers were comfortable
    with this, although it was felt that this was addressable if framed in a different
    way. Another said that it expected that if consumers were remunerated well-enough,
    then there would be greater ease over their battery systems being controlled.
    Instead, it was found customers put a much higher premium on back-up power than
    was assumed and were willing to forego the additional financial benefits to maintain
    control.
