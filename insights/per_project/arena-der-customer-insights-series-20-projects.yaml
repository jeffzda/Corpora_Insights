- record_id: ARENA-DLV-58802
  source_title: 'DER Customer Insights: The Customer Journey'
  publish_date: 2020-07
  project_name: ARENA DER Customer Insights Series (20 projects)
  what_happened: In one DER trial, removing jargon ('smart') from offer descriptions
    and replacing it with a simple financial return proposition (e.g. 'earn $5,000
    over 2 years') resulted in a measurable increase in customer acquisition rate.
  lesson_learnt: Frame DER offers as simple, specific financial propositions and avoid
    technical jargon — simplifying messaging directly increased customer acquisition
    rates across multiple trials.
