- record_id: ARENA-DLV-58825
  source_title: 'DER Customer Insights: The Customer Journey'
  publish_date: 2020-07
  project_name: ARENA DER Customer Insights Series (20 projects)
  what_happened: Several DER projects conducted thorough pre-installation eligibility
    checks and site inspections, which were found to speed up recruitment and reduce
    customer acquisition costs; however, unexpected issues still arose in some cases,
    leading to lower-than-expected acquisition rates even where checks were employed.
  lesson_learnt: Conduct thorough pre-installation eligibility and suitability checks
    early in the customer journey to reduce downstream costs and surprises — but build
    contingency into customer acquisition targets and timelines because even rigorous
    pre-checks do not eliminate all unforeseen issues.
