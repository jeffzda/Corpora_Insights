- record_id: ARENA-DLV-58801
  source_title: 'DER Customer Insights: The Customer Journey'
  publish_date: 2020-07
  project_name: ARENA DER Customer Insights Series (20 projects)
  what_happened: Customer acquisition was challenging for the majority of DER projects
    studied, typically resulting in the process taking longer than expected or recruiting
    fewer customers than originally targeted.
  lesson_learnt: Conduct detailed customer research in advance, target communities
    already familiar with energy issues, and set conservative acquisition targets
    — projects that did these things had materially better acquisition outcomes.
