- record_id: ARENA-DLV-58820
  source_title: 'DER Customer Insights: The Customer Journey'
  publish_date: 2020-07
  project_name: ARENA DER Customer Insights Series (20 projects)
  what_happened: Across the DER projects studied, variable installer quality — including
    differing levels of service, ability, knowledge, and technical competence — led
    to inconsistent customer experiences, with some customers receiving materially
    poorer service than others.
  lesson_learnt: Establish minimum competency standards and rigorous installer selection
    criteria before deployment, and actively monitor installer quality during the
    program — variable installer quality is a leading driver of negative customer
    experience in DER rollouts.
