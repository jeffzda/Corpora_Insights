- record_id: ARENA-DLV-58816
  source_title: 'DER Customer Insights: The Customer Journey'
  publish_date: 2020-07
  project_name: ARENA DER Customer Insights Series (20 projects)
  what_happened: Across multiple DER projects, internet connectivity at customer premises
    posed significant installation and operational challenges; projects that gathered
    connectivity details in advance and confirmed 3G/4G coverage prior to site visits
    avoided frustration, additional costs, and delays.
  lesson_learnt: Confirm internet connectivity (including 3G/4G fallback options)
    at each customer site before scheduling the installation visit — proactive connectivity
    checking avoids on-the-day failures, repeat visits, and customer frustration,
    and DER devices should be designed to tolerate frequent connectivity interruptions.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: construction/installation
  proponent_type: government/public-sector body
  delay_category: construction/installation
  failure_mode: execution & logistics
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: Projects gathered internet provider and connection details prior
    to site visits to identify and address connectivity issues in advance of the installer
    visit.
  transferability: broad
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id009
  - 13
  evidence_excerpt: Some projects were aware already of the challenges to set up devices
    and maintain internet connectivity on home networks. Gathering internet provider
