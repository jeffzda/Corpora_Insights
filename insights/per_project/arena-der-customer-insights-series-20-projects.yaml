  source_title: 'DER Customer Insights: The Customer Journey'
  publish_date: 2020-07
  project_name: ARENA DER Customer Insights Series (20 projects)
  what_happened: Multiple DER trials found that designing battery dispatch and optimisation
    algorithms without consumer participation produced systems that could not adapt
    to different customer operational schedules and demands, reducing effectiveness
    and customer satisfaction.
  lesson_learnt: Involve customers in the design and iterative refinement of DER control
    and optimisation algorithms from the outset — algorithms built without customer
    input fail to accommodate diverse usage patterns, undermining both customer satisfaction
    and dispatch performance.
