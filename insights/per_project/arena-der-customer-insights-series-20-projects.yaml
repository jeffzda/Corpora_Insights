  source_title: 'DER Customer Insights: The Customer Journey'
  publish_date: 2020-07
  project_name: ARENA DER Customer Insights Series (20 projects)
  what_happened: Across the DER projects, undefined roles and responsibilities within
    the supply chain led to confusion and an increase in post-installation issues,
    particularly where documentation of processes was absent or incomplete.
  lesson_learnt: Define and document the roles and responsibilities of every supply
    chain actor (installers, support personnel, subcontractors) before project launch
    — absence of clear accountability structures directly increases post-installation
    issue rates and customer complaints.
