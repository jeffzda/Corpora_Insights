  source_title: 'DER Customer Insights: The Customer Journey'
  publish_date: 2020-07
  project_name: ARENA DER Customer Insights Series (20 projects)
  what_happened: Across the twenty DER projects, including installers in the project
    design phase was identified as a practice that improved buy-in, cost estimation,
    planning, and risk management — projects that did not involve installers early
    faced avoidable issues during installation.
  lesson_learnt: Involve installers in the project design phase before procurement
    or customer-facing activity begins — early engagement improves their buy-in, enables
    realistic cost and complexity estimates, and surfaces installation risks before
    they affect customers.
