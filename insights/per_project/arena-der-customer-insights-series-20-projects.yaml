- record_id: ARENA-DLV-58814
  source_title: 'DER Customer Insights: The Customer Journey'
  publish_date: 2020-07
  project_name: ARENA DER Customer Insights Series (20 projects)
  what_happened: Multiple DER trials found that customers strongly preferred fixed/capped
    financial returns over variable rates, even when variable rates offered greater
    potential earnings — one project found a $2/day capped offer more popular than
    a higher variable rate offer.
  lesson_learnt: Design DER customer propositions around certainty rather than maximum
    financial upside — capped, predictable returns outperform higher variable rates
    in customer preference and retention, reflecting that DER early adopters prioritise
    predictability over optimisation.
