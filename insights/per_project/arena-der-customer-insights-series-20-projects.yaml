- record_id: ARENA-DLV-58819
  source_title: 'DER Customer Insights: The Customer Journey'
  publish_date: 2020-07
  project_name: ARENA DER Customer Insights Series (20 projects)
  what_happened: Several DER projects experienced negative customer outcomes — including
    frustration, anxiety, and anger — where the installation process was slow and
    diffuse, with multiple site visits required; repeat visits to fix technical issues
    were a common complaint.
  lesson_learnt: 'Design for single-visit installation: ensure pre-installation checks,
    tools, and materials are sufficient to complete the job in one visit — multi-visit
    installations generate disproportionate negative sentiment and increase cost per
    installation.'
