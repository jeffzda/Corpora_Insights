- record_id: ARENA-DLV-47063
  source_title: Australian Concentrating Solar Thermal Industry Roadmap
  publish_date: 2018-08
  project_name: Australian Solar Thermal Research Institute (ASTRI)
  what_happened: A mid-term review of ASTRI in 2016–17 found it was undertaking world-leading
    research but needed to change to remain relevant — specifically, it lacked sufficient
    engagement with industry and focus on commercially oriented, real-world solutions.
    The review recommended closer industry collaboration and increased focus on commercialisation
    pathways.
  lesson_learnt: Research programs supporting emerging technology sectors should build
    structured industry engagement mechanisms (including industry representatives
    on steering committees) from early stages, not as a corrective measure after mid-term
    review — ASTRI required external review to identify that its research priorities
    were insufficiently aligned with commercial deployment needs.
