  evidence_excerpt: A mid-term review of ASTRI was undertaken in 2016-17. The review
    indicated ASTRI was undertaking world-leading research and had contributed to
    Australian capability and capacity. However, the review also noted that ASTRI
    would need to change if it was to play a key ongoing role in CST in future. The
    need for closer engagement with industry and focus on more commercially oriented,
    real world solutions was highlighted.
