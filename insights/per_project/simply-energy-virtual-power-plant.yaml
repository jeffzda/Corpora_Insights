- record_id: ARENA-DLV-42769
  source_title: Evaluation of ARENA's VPP Portfolio
  publish_date: 2021-06
  project_name: Simply Energy Virtual Power Plant
  what_happened: 'The Simply Energy VPP project was successfully commercialised post-trial:
    the VPP product is now subsidy-free (excluding battery cost), revenues exceed
    operating costs, and Simply Energy grew from 2–3 VPP projects to 15. However,
    the protracted contracting process and high ongoing management burden led Simply
    Energy to become reluctant to lead future ARENA bids.'
  lesson_learnt: Even when a trial achieves its commercial objectives, the administrative
    burden of leading an ARENA-funded project can deter successful recipients from
    applying for future funding; ARENA should consider graduated reporting requirements
    and simplified contracting for follow-on or scale-up projects.
  issue_severity: minor
  project_type: null
  project_scale_band: demonstration
  lifecycle_phase: approvals/contracting
  proponent_type: government/public-sector body
  delay_category: financing/commercial close
  failure_mode: coordination & stakeholders
  outcome_class: follow-on scale-up enabled
  secondary_failure_mode: null
  intervention_note: ARENA was flexible in accommodating changes during delivery,
    including sales model changes, a supplier closure, and shifting funding to a more
    successful product.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: DER
  source_pages: &id002
  - 54
  evidence_excerpt: The time elapsed between when the project was given Board approval
    and the contract was signed was protracted due to long contractual processes on
    ARENA's end. The level of engagement required to meet ARENA's requirements and
    manage the project requires full-time resources to be allocated to the project.
    Simply Energy are reluctant to lead bids in the future due to the time and effort
    needed.
