- record_id: ARENA-DLV-42768
  source_title: Evaluation of ARENA's VPP Portfolio
  publish_date: 2021-06
  project_name: Simply Energy Virtual Power Plant
  what_happened: The Simply Energy VPP project could not properly test an energy marketplace
    model because Simply Energy was the sole VPP participant — additional VPP operators
    and network contracting for services did not materialise, meaning the platform's
    multi-participant value could not be demonstrated.
  lesson_learnt: When a trial depends on participation from multiple independent actors
    (e.g. multiple VPP aggregators in a marketplace), confirm minimum participation
    levels before commencement; if only one participant is available, reframe the
    trial objective to reflect what can actually be tested.
