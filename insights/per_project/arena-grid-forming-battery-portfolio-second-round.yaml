- record_id: ARENA-DLV-21617
  source_title: 'Ekistica - ARENA Grid-Forming Battery Portfolio Series: Update Report'
  publish_date: 2025-10
  project_name: ARENA Grid-Forming Battery Portfolio (Second Round)
  what_happened: Recipients found that without a bilateral TNSP contract for inertia
    services, the default approach for GFM BESS projects is to tune parameters to
    reduce inertia provision, as inertia provision causes battery micro-cycling and
    degradation and, when contracted, limits participation in energy and FCAS markets
    by requiring headroom reservation.
  lesson_learnt: Do not design GFM BESS to maximise inertia provision unless a bilateral
    TNSP inertia contract is in place before financial close; the micro-cycling degradation
    costs and FCAS market displacement are real commercial costs that will not be
    offset by inertia revenue without a formal contract, and parameters should be
    tuned accordingly.
