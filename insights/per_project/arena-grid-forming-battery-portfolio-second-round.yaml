  failure_mode: unvalidated technical assumptions
  outcome_class: delayed but recoverable
  secondary_failure_mode: regulatory & approvals
  intervention_note: Projects adopted prior-project parameters as starting points
    for tuning, conducted parametric sweeps of synthetic inertia and damping constants,
    and presented range-of-parameter modelling to NSPs to expedite GPS negotiation.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id003
