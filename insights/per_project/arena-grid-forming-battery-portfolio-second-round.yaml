- record_id: ARENA-DLV-21602
  source_title: 'Ekistica - ARENA Grid-Forming Battery Portfolio Series: Update Report'
  publish_date: 2025-10
  project_name: ARENA Grid-Forming Battery Portfolio (Second Round)
  what_happened: The prior experience of an OEM in achieving NEM grid connection with
    the same inverter model on a previous project was identified as one of the single
    most important factors in reducing delay and risk during GFM BESS grid connection,
    as mature dynamic models gave AEMO and NSPs high confidence in the inverter's
    performance.
  lesson_learnt: Select a BESS inverter OEM with a proven track record of NEM grid
    connection approvals for that specific inverter model; an OEM with an immature
    or untested dynamic model substantially increases the risk of delay during GPS
    compliance, regardless of whether the inverter is GFM or GFL.
