- record_id: ARENA-DLV-21601
  source_title: 'Ekistica - ARENA Grid-Forming Battery Portfolio Series: Update Report'
  publish_date: 2025-10
  project_name: ARENA Grid-Forming Battery Portfolio (Second Round)
  what_happened: GFM BESS projects in ARENA's second funding round faced delays and
    complications during grid connection because the NER Generator Performance Standards
    were designed for grid-following (GFL) inverters and did not adequately capture
    GFM inverter behaviour, particularly NER clause S5.2.5.5 requirements on reactive
    current rise and settling times.
  lesson_learnt: Project teams connecting GFM BESS must anticipate that NER performance
    standards under clause S5.2.5.5 were designed for GFL inverters and will require
    extensive negotiation with AEMO and NSPs; engage early with AEMO and the NSP on
    GFM-specific interpretation of these clauses to avoid late-stage rework and connection
    delays.
  issue_severity: major
  project_type: storage
  project_scale_band: utility/large-scale
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: grid connection/system studies
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Proponents worked iteratively with AEMO and NSPs on control loop
    tuning and NER interpretation; AEMC subsequently removed reactive current settling
    time from the Automatic Access Standard in May 2025.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id001
  - 9
  - 13
  - 14
  evidence_excerpt: In the second round, the aim of achieving stability under normal
    operation while sacrificing the speed of the inverters during faults posed challenges
    to meet the reactive current rise time requirement specified in the minimum access
    standard of the NER. In negotiations with Transgrid and AEMO at this stage, this
    seemed to become the primary point of contention that delayed the Liddell BESS
    project from receiving the offer to connect for several months.
