  project_name: ARENA Grid-Forming Battery Portfolio (Second Round)
  what_happened: IP confidentiality maintained by GFM inverter OEMs on control architecture
    and algorithms was identified across multiple projects as a recurring challenge
    that impeded modelling accuracy, slowed GPS assessment, and created information
    asymmetry between OEMs on one side and project developers and grid modelling consultants
    on the other.
  lesson_learnt: Require GFM OEMs to provide maximum technically feasible transparency
    on control architecture and model detail as a pre-qualification criterion; OEM
    IP protection on control diagrams and algorithms imposes greater commercial risk
    to customers than the competitive risk to OEMs, as the competitive edge lies in
    practical know-how rather than specific algorithms.
