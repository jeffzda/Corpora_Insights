- record_id: ARENA-DLV-21613
  source_title: 'Ekistica - ARENA Grid-Forming Battery Portfolio Series: Update Report'
  publish_date: 2025-10
  project_name: ARENA Grid-Forming Battery Portfolio (Second Round)
  what_happened: Multiple GFM BESS projects faced a fundamental trade-off between
    tuning inverter parameters to maximise GFM capabilities (particularly inertia
    provision) and meeting NER GPS performance requirements for active power recovery
    and reactive current settling times, requiring extensive and iterative tuning
    exercises.
  lesson_learnt: Budget for an iterative and time-consuming model tuning process when
    deploying GFM BESS; adopt parameters from a prior project with the same inverter
    model as the starting point, conduct parametric sweeps to map trade-offs, and
    prepare upfront modelling showing BESS performance across a range of parameters
    to support NSP negotiations.
