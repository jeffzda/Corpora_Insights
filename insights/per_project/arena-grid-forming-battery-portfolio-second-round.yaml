- record_id: ARENA-DLV-21615
  source_title: 'Ekistica - ARENA Grid-Forming Battery Portfolio Series: Update Report'
  publish_date: 2025-10
  project_name: ARENA Grid-Forming Battery Portfolio (Second Round)
  what_happened: Across multiple GFM BESS projects, the involvement of multiple OEMs
    (inverter, PPC, battery management system from different suppliers) added delays
    in the connection process due to reluctance to share commercially sensitive information
    between parties and the practicalities of information passing through multiple
    organisations.
  lesson_learnt: Minimise the number of OEMs involved in the control system of a GFM
    BESS — ideally use the inverter OEM's native PPC — as multi-OEM arrangements create
    information-sharing barriers and coordination overhead that amplify connection
    process delays, particularly for GFM where the delivery of the GFM response requires
    tight coordination across battery, inverter, and PPC.
