  project_name: ARENA Grid-Forming Battery Portfolio (Second Round)
  what_happened: A skills shortage in the industry relative to the volume of projects
    seeking to connect created specific challenges for GFM BESS connections, as individuals
    with prior GFM experience are scarce and their departure from AEMO or NSPs to
    OEMs or project teams has caused loss of institutional knowledge at regulator/network
    level.
  lesson_learnt: GFM BESS projects should plan for variability in the GFM experience
    of individual AEMO and NSP assessors; where an assessor team has limited GFM experience,
    invest additional effort in education and documentation to support the assessment
    process, and advocate for the assignment of AEMO/NSP staff with prior GFM project
    experience.
