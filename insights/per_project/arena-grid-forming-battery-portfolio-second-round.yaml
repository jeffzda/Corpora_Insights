- record_id: ARENA-DLV-21616
  source_title: 'Ekistica - ARENA Grid-Forming Battery Portfolio Series: Update Report'
  publish_date: 2025-10
  project_name: ARENA Grid-Forming Battery Portfolio (Second Round)
  what_happened: The primary commercial driver for selecting GFM over GFL inverters
    across ARENA-funded projects was avoidance of System Strength Charges (SSC) under
    AEMO's System Strength Impact Assessment Guidelines (SSIAG), rather than any positive
    market payment for GFM services; prior to SSIAG changes there was no market mechanism
    to value GFM services.
  lesson_learnt: GFM BESS investment cases should be primarily anchored on system
    strength charge avoidance under the SSIAG, and increasingly on the ability to
    achieve connection at all in low short-circuit ratio network areas; absence of
    a direct inertia market means projects should not rely on bilateral inertia revenue
    unless a TNSP contract is secured.
