  outcome_class: delayed but recoverable
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Recipients engaged OEMs with prior NEM GFM connection experience
    or demonstrated overseas GFM capability to reduce connection risk.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id002
