  what_happened: The AEMC's May 2025 'Improving the NEM Access Standards Package 1'
    rule change removed the reactive current settling time requirement from the Automatic
    Access Standard, replaced the 'adequately damped' response requirement with 'adequately
    controlled', added commencement time requirements, and explicitly accommodated
    inertial response in the 'continuous uninterrupted operation' definition — changes
    anticipated to materially improve GFM BESS connection processes.
  lesson_learnt: GFM BESS projects using connection enquiries from 21 August 2025
    onwards should design GPS compliance strategies using the updated NER framework,
    which removes the reactive current settling time requirement and accommodates
    inertial response; prior project experience indicating these as showstopper issues
    may no longer apply.
