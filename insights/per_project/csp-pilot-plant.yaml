  source_title: Vast Solar Manufacturing and Other Challenges Report
  publish_date: '2019-03-03'
  project_name: Jemalong CSP Pilot Plant
  what_happened: Australia's lack of industrial CSP supply chain partners — regionally
    and nationally — forced Vast Solar to source most specialist materials and knowledge
    from overseas (primarily Europe and Asia), adding timezone delays, extended shipping
    lead times, prototype fabrication waits, and higher freight costs throughout the
    project.
  lesson_learnt: Australia lacks a domestic industrial supply chain for novel CSP
    and related high-temperature solar technologies; developers must plan for an internationally
    dependent supply chain from the outset, with correspondingly longer procurement
    lead times, higher logistics costs, and dedicated resourcing for international
    supplier management.
