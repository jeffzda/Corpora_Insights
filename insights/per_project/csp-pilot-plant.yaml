  source_title: Vast Solar Financial and Institutional Innovation Report
  publish_date: 2019-03
  project_name: Vast Solar CSP Pilot Plant (Jemalong)
  what_happened: Vast Solar identified that technology delays and setbacks during
    its R&D journey could have been better anticipated and planned for, and that insufficient
    contingency in project budgets and schedules made the financial journey harder
    for all stakeholders.
  lesson_learnt: When developing technology through phased projects over multi-year
