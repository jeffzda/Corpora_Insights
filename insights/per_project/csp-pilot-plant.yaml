- record_id: ARENA-DLV-5908
  source_title: Vast Solar Leadership in the CSP Sector Report
  publish_date: '2019-05-14'
  project_name: SolarFlagship CSP Projects (Queensland)
  what_happened: Two SolarFlagship CSP projects in Queensland were progressed to varying
    degrees with state government support over a 10-year period but ultimately did
    not succeed. Changes in government and personnel led to withdrawal of sustained
    financial and project support, which — combined with technical challenges — undermined
    the projects.
  lesson_learnt: Government-backed CSP demonstration projects require sustained political
    and financial commitment from commencement through to completion — changes in
    government or personnel that withdraw support mid-project will undermine delivery
    regardless of technical merit, and this risk should be explicitly managed in project
    governance structures.
  issue_severity: critical
  project_type: generation
