- record_id: ARENA-DLV-5901
  source_title: Vast Solar Leadership in the CSP Sector Report
  publish_date: '2019-05-14'
  project_name: Jemalong CSP Pilot Plant
  what_happened: A novel low-cost heliostat facet design using a glass, polystyrene
    and steel laminate was incorporated into the Pilot Plant on the expectation it
    would reduce capital costs and lower LCOE. Practical experience determined that
    the laminated facets could not deliver the required optical accuracy or performance,
    rendering LCOE calculations for such a plant meaningless.
  lesson_learnt: Novel low-cost component designs incorporated into first-of-kind
    pilot plants should be validated for optical or performance accuracy before being
    embedded in cost modelling — relying on unproven designs for LCOE projections
    risks invalidating key knowledge-sharing deliverables.
  issue_severity: moderate
