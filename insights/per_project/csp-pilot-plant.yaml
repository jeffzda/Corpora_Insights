  what_happened: The Jemalong site suffered unreliable and very slow internet connectivity
    throughout construction and commissioning. The region is a telecommunications
    blackspot, requiring Vast Solar to design and operate independent IT systems between
    site and Sydney HQ. Multiple interim investments in repeaters, antenna extensions
    and alternative service providers only partially improved connectivity, and the
    issue was ultimately resolved by a costly custom line-of-sight NBN installation.
  lesson_learnt: Before committing to a regional site for a technology-intensive project,
    assess telecommunications infrastructure early and budget for custom connectivity
    solutions — interim fixes (repeaters, signal boosters) are unlikely to be sufficient,
    and a purpose-built solution (e.g. line-of-sight NBN) may be required from the
    outset.
