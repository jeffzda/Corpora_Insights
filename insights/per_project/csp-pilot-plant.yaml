    fire and emergency services personnel, creating a safety knowledge gap that needed
    to be actively managed during pilot plant development and operation. Vast Solar,
    ANU and ACT Fire and Rescue co-organised a Fire Training and Demonstration Day
    in 2016 to address this gap.
