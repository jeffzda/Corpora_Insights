- record_id: ARENA-DLV-66005
  source_title: Vast Solar Manufacturing and Other Challenges Report
  publish_date: '2019-03-03'
  project_name: Jemalong CSP Pilot Plant
  what_happened: Vast Solar faced persistent difficulties sourcing novel and specialist
    materials and components, most of which had to be imported from overseas (Europe,
    Asia). Timezone differences, poor site internet connectivity, and extended freight
    lead times combined to slow construction. Unique items such as specialised sensors
    from Germany or the Netherlands had lead times of 4–6 weeks from Australian retailers,
    and some materials (e.g. high-temperature thermal paste) had no Australian manufacturer,
    importer or retailer at all.
  lesson_learnt: For novel technology construction using internationally sourced components,
    map the full supply chain for each unique material or component before construction
    commences — identify items with no Australian supply and pre-order critical spares;
    standard 'next-day' delivery expectations will not hold in regional Australia
    and lead times of 4–6 weeks or more should be built into the programme.
