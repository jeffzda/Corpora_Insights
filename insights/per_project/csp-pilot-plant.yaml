  what_happened: Glint and glare from heliostat facets and illuminated receivers presented
    a potential hazard to neighbouring residents and to light aircraft using the nearby
    Jemalong airstrip, requiring specific site siting decisions, heliostat tracking
    pattern modifications, and screening tree plantings.
