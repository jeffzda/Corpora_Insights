  what_happened: Vast Solar constructed a 1.1MWe concentrated solar thermal pilot
    plant at a regional location (Jemalong, NSW, ~36km west of Forbes) using sodium
    as the heat transfer fluid — the world's first modular CSP technology of this
    type. Construction ran from late 2013 to late 2016, with grid connection in early
    2017 and final commissioning completed June 2018.
