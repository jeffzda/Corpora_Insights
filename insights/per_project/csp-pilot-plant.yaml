  what_happened: Vast Solar's use of sodium as a heat transfer fluid triggered a technical
    Major Hazards Facility (MHF) classification issue with SafeWork NSW, as no national
    or international standards existed for the safe use of sodium in CSP applications.
  lesson_learnt: When deploying a novel heat transfer fluid or process chemical with
    no existing industry standards, proactively develop in-house safety standards
    and engage the relevant WHS regulator early — regulators may accept formal undertakings
    as a pragmatic resolution to technical compliance gaps, but only if the proponent
    can demonstrate a rigorous safety framework.
