  project_name: Jemalong CSP Pilot Plant
  what_happened: The agreed knowledge-sharing data-sets between ARENA and Vast Solar
    for the Pilot Plant proved partially misaligned with what the project ultimately
    delivered — some initially agreed metrics became less insightful or useful as
    the project evolved and on-ground manufacturing and construction challenges were
    encountered.
  lesson_learnt: For first-of-kind pilot plants, knowledge-sharing data-sets and KPIs
    agreed at the outset should include a formal review mechanism as the project evolves
    — rigid pre-agreed metrics may become irrelevant when unexpected technical challenges
    or breakthroughs change what the project can and does measure.
