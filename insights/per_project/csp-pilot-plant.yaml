  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Vast Solar pivoted to focus on unanticipated performance breakthroughs
    — particularly thermal controllability and transient ride-through — as high-value
    knowledge-sharing outputs in place of the invalidated LCOE data.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar thermal
  source_pages: &id001
