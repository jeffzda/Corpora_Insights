- record_id: ARENA-DLV-5906
  source_title: Vast Solar Leadership in the CSP Sector Report
  publish_date: '2019-05-14'
  project_name: 30MW Jemalong CSP Reference Plant
  what_happened: Vast Solar found that Australian financial and utility markets are
    highly conservative and risk averse toward unproven CSP technology, making commercialisation
    difficult. The company concluded that until CSP technology is proven at Reference
    Plant scale, commercial deployment in Australia would remain challenging, with
    the technology expected to require a further 3–5 years to become cost competitive
    and proven at scale.
  lesson_learnt: For first-of-kind commercial CSP deployment in Australia, developers
    should anticipate significant resistance from conservative financial and utility
    markets and plan for extended commercialisation timelines — technology must be
    demonstrably proven at reference plant scale before bankable financing structures
    become accessible.
