  what_happened: General construction labour sourced through local labour hire companies
    was of variable quality and could not reliably commit to multi-month engagements.
    This forced Vast Solar's already stretched technical supervisory staff to invest
    repetitive time in training and overseeing incoming labourers, particularly for
    the precision-intensive heliostat facet manufacturing and installation tasks.
  lesson_learnt: For novel technology construction requiring sustained precision work
    in regional areas, do not rely solely on local casual labour — plan for high supervisory
    overhead and factor in training costs and turnover, or explore alternative pools
    such as international working holiday visa workers who can commit to extended
    periods.
