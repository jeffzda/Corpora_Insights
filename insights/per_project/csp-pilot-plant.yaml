  what_happened: Regular in-person management meetings between the Sydney HQ-based
    team and the Jemalong site were essential for governance and team morale during
    construction, commissioning and troubleshooting, but required a 5-hour road journey
    or a 2-hour air and car journey per visit, creating ongoing financial and management
    time costs.
