- record_id: ARENA-DLV-5907
  source_title: Vast Solar Leadership in the CSP Sector Report
  publish_date: '2019-05-14'
  project_name: 30MW Jemalong CSP Reference Plant
  what_happened: Vast Solar participated in multiple state and territory EOI and tender
    processes (ACT 2015; South Australia 2015 and 2016) for the 30MW Reference Plant
    while simultaneously developing the Pilot Plant technology. These processes were
    described as time consuming, costly, often novel in approach, and did not always
    deliver an outcome — imposing a significant burden on a small company.
  lesson_learnt: Small technology-developer companies pursuing first commercial CSP
    projects should carefully assess the resource cost of participating in government
    EOI and tender processes — particularly when running in parallel with active technology
    development — as novel procurement processes are often exploratory, do not guarantee
    outcomes, and can consume disproportionate resources relative to the probability
    of success.
