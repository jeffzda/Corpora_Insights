    planning definitions — the State Environmental Planning Policy (Infrastructure)
    2007 excludes 'solar energy systems' using mirrors, meaning the project had to
    be characterised as an 'energy generating works' ancillary to an RD&D facility
    to obtain the appropriate consent pathway.
