  project_name: Jemalong CSP Pilot Plant
  what_happened: Because the Pilot Plant was a small, novel, multi-element project,
    Vast Solar determined it was not suitable for delivery by a contracted engineering
    construction company. Vast Solar instead assumed full responsibility for construction
    project management, labour sourcing, procurement and delivery — significantly
    expanding the company's execution burden beyond its core technology development
    role.
  lesson_learnt: For small-scale novel technology pilots with multiple bespoke elements,
    traditional EPC contracting is unlikely to be viable; project developers should
    plan to self-manage construction and explicitly resource the project management,
    labour and procurement functions that a contractor would otherwise provide — underestimating
    this overhead is a common failure mode.
