  source_title: Vast Solar Leadership in the CSP Sector Report
  publish_date: '2019-05-14'
  project_name: Jemalong CSP Pilot Plant
  what_happened: The Jemalong CSP Pilot Plant successfully demonstrated multi-array
    control, steam generation and grid-connected electricity production — all three
    stated technical objectives — and delivered world-first proof of concept for modular
    CSP with sodium heat transfer fluid. Commissioning was completed in June 2018,
    with first power to the grid delivered in January 2017.
