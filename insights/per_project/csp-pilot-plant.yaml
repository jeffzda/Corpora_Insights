  source_title: Vast Solar Manufacturing and Other Challenges Report
  publish_date: '2019-03-03'
  project_name: Jemalong CSP Pilot Plant
  what_happened: In September 2016, a 1-in-100-year flood event in the Forbes region
    closed all major regional roads for 2–4 weeks. The Pilot Plant site was physically
    unaffected, but the majority of full-time staff and casual labourers could not
    commute to site for several weeks, forcing a shutdown during the final stages
    of construction. The event impacted the overall project budget and delayed completion
    of construction.
  lesson_learnt: For regional construction projects, assess flood risk to access routes
    (not just the site itself) and develop contingency plans — including skeleton
    crew residential arrangements — for extended road closures; flood risk to site
    access can shut down a project even when the physical plant is unaffected.
