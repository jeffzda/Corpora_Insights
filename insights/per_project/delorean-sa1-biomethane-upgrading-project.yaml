  publish_date: '2025-09-23'
  project_name: SA1 Bioenergy Facility
  what_happened: SA1 Salisbury Bioenergy is the first facility in Australia to produce
    mains-grade biomethane and biogenic CO2 from processed commercial and industrial
    organic waste, representing a first-of-kind deployment with no domestic reference
    class for delivery benchmarking.
  lesson_learnt: First-of-kind bioenergy-to-gas-grid projects in Australia have no
    domestic delivery precedent — project teams should draw on international analogues
    for schedule and cost benchmarking and anticipate regulatory and technical pathways
    that have not been established locally.
