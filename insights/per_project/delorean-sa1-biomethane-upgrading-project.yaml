- record_id: ARENA-DLV-31203
  source_title: Delorean - SA1 Biomethane Upgrading - Proof of Concept LCA (Public
    Summary)
  publish_date: '2025-09-23'
  project_name: SA1 Bioenergy Facility
  what_happened: The proof-of-concept LCA was completed pre-commissioning using assumed
    waste composition and tonnage based on contracted feedstock, with a plan to update
    the LCA post-commissioning using operational data to validate and refine findings.
  lesson_learnt: For novel bioenergy facilities, structure the LCA as a two-stage
    process — a proof-of-concept assessment pre-commissioning based on contracted
    feedstock data, followed by an operational update post-commissioning — to progressively
    strengthen the evidence base and validate design-phase environmental assumptions.
