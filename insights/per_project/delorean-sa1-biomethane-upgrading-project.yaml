- record_id: ARENA-DLV-31202
  source_title: Delorean - SA1 Biomethane Upgrading - Proof of Concept LCA (Public
    Summary)
  publish_date: '2025-09-23'
  project_name: SA1 Bioenergy Facility
  what_happened: The proof-of-concept LCA used the WRATE software as its primary modelling
    tool, but WRATE does not fully capture the environmental benefits from biomethane
    injection into the gas grid or CO2 recovery, resulting in a conservative and potentially
    misleading outcome for the abiotic resource depletion category.
  lesson_learnt: When conducting pre-construction LCAs for novel bioenergy-to-grid
    pathways, verify that the selected modelling tool covers all value streams — WRATE
    does not fully capture biomethane injection or CO2 recovery benefits, requiring
    supplementary literature data and risking under-stated environmental performance
    in key impact categories.
