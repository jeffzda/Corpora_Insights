  - 3
  evidence_excerpt: 'Net benefit: ~66 kt CO₂-e improvement, largely due to avoided
    landfill methane and displacement of fossil-based natural gas and CO₂... Landfill
    gas capture rate assumed at 29% (SA average).'
  confidence_note: Record captures a design-phase finding with direct delivery implication
    for project developers structuring revenue from ACCUs — the capture rate assumption
    is a key modelling variable.
