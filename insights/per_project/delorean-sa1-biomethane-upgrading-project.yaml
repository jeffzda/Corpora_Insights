- record_id: ARENA-DLV-31204
  source_title: Delorean - SA1 Biomethane Upgrading - Proof of Concept LCA (Public
    Summary)
  publish_date: '2025-09-23'
  project_name: SA1 Bioenergy Facility
  what_happened: The LCA confirmed that diverting 70,225 tpa of organic waste from
    landfill to anaerobic digestion with biomethane injection delivers approximately
    66 kt CO2-e per year net improvement and a 38% reduction in fossil fuel energy
    use, with the largest benefit driven by avoided landfill methane emissions and
    displacement of fossil-based natural gas and CO2.
  lesson_learnt: The environmental business case for biomethane-from-waste projects
    is dominated by avoided landfill methane rather than renewable gas substitution
    alone — project developers should ensure that landfill gas capture rate assumptions
    (the SA average of 29% was used here) are regionally calibrated, as this assumption
    materially affects the calculated GHG benefit and any associated ACCU revenue
    projections.
  issue_severity: none
  project_type: industrial decarbonisation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: project developer
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: bioenergy
  source_pages: &id004
