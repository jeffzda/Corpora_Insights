  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects - First Edition Results'
  publish_date: null
  project_name: ADINE Project
  what_happened: The ADINE project developed and demonstrated an Active Network Management (ANM) method — including new protection devices, coordinated voltage control, and a STATCOM — across real-life
    distribution network demonstrations in Finland, Ireland and Sweden, showing that coordinated voltage control can triple medium voltage network hosting capacity for wind power in weak distribution networks.
  lesson_learnt: Active Network Management combining automation, ICT and power electronics (including coordinated voltage control and STATCOM) can triple distribution network hosting capacity for wind power
    in weak grids — network operators facing renewable integration constraints should evaluate ANM as an alternative to costly physical reinforcement.
