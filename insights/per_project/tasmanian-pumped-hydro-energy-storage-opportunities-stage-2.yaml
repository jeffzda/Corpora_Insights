  source_title: Battery of the Nation – Pumped Hydro Energy Storage Projects Prefeasibility
    Studies Summary Report
  publish_date: 2019-08
  project_name: Battery of the Nation – PHES Prefeasibility Studies
  what_happened: Several PHES sites (Cethana, Parangana, Lake Echo, Wilmot) involved
    project footprints on Permanent Timber Production Zone Land (PTPZ), which under
    the Forest Management Act 2013 requires revocation by parliamentary approval —
    one of the secondary approvals identified as potentially requiring a parliamentary
    process in addition to standard development approvals.
  lesson_learnt: Where PHES infrastructure crosses Permanent Timber Production Zone
    Land, factor in a parliamentary revocation process as a separate approval pathway
    — this is a non-standard, politically exposed approval that operates on a different
    timeline to environmental and planning approvals, and should be identified and
    initiated early in the development programme.
