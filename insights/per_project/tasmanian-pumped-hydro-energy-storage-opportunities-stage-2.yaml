  project_name: Battery of the Nation – PHES Prefeasibility Studies
  what_happened: All recommended PHES projects were explicitly predicated on the development
    of additional interconnection between Tasmania and Victoria (Marinus Link), with
    the report noting that without increased interconnection the full potential of
    the Tasmanian hydropower system — including new PHES — cannot be unlocked for
    the NEM.
  lesson_learnt: PHES projects dependent on new transmission interconnection carry
    a compounded development risk — the project's commercial viability is contingent
    on a separate, large-scale infrastructure decision outside the proponent's control;
    revenue and investment cases should be stress-tested against scenarios where interconnection
    is delayed or does not proceed.
