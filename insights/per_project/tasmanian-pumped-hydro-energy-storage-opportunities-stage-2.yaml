  what_happened: The prefeasibility studies identified that intake design for PHES
    using existing reservoirs requires deep submergence of intake structures — many
    metres below normal minimum operating level — and that insufficient reservoir
    depth could necessitate major civil works including potential underwater excavation.
  lesson_learnt: Verify reservoir bathymetry and intake submergence requirements before
    selecting an existing reservoir as a PHES lower reservoir — insufficient depth
    for intake structures is a capital-intensive problem that significantly alters
    project cost and schedule, and cannot be assessed reliably from desktop data alone.
