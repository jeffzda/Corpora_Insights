  publish_date: 2019-08
  project_name: Battery of the Nation – PHES Prefeasibility Studies
  what_happened: Bathymetric survey data for existing reservoirs was generally not
    available and was not collected during the prefeasibility studies. Sufficiency
    of reservoir depth for intake structures was assessed by judgement based on known
    reservoir conditions, deferring bathymetric surveys to the feasibility stage.
  lesson_learnt: Bathymetric surveys of existing reservoirs should be commissioned
    early — the depth available for intake submergence is a critical design input,
    and insufficient depth can trigger major civil works (underwater excavation).
    Deferring this to feasibility prolongs uncertainty about a potentially project-defining
    constraint.
