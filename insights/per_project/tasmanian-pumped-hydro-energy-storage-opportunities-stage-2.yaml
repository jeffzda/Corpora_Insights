- record_id: ARENA-DLV-18261
  source_title: Battery of the Nation – Pumped Hydro Energy Storage Projects Prefeasibility
    Studies Summary Report
  publish_date: 2019-08
  project_name: Battery of the Nation – PHES Prefeasibility Studies
  what_happened: Underground geological conditions were identified as the primary
    engineering risk across all Group 1 and Group 2 PHES sites, with risks including
    poor-quality rock, high groundwater inflows, and — specifically for Parangana
    — uncertainty about tertiary sediments through which the vertical shaft must pass.
    Available geological data from historical mining or existing hydropower construction
    was generally insufficient to quantify these risks without site-specific investigation.
  lesson_learnt: Geological field investigation (mapping, test pits, drilling, seismic
    refraction) is a mandatory step before PHES feasibility can meaningfully reduce
    cost estimate uncertainty — desktop review of historical data alone cannot reduce
    ±30% cost estimate accuracy to the level needed for investment decisions, and
    unquantified geological risk is the dominant source of contingency in underground
    civil works.
  issue_severity: moderate
  project_type: storage
  project_scale_band: utility/large-scale
  lifecycle_phase: concept/feasibility
  proponent_type: utility/energy retailer
  delay_category: data/validation/testing
  failure_mode: poor scoping
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: data & measurement
  intervention_note: Each site study recommended a detailed geological investigation
    program during feasibility, including mapping, test pits, drilling, and seismic
    refraction surveys leading to a geotechnical baseline report.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: pumped hydro
  source_pages: &id011
  - 16
  - 18
  - 21
  - 24
  - 27
  - 28
  evidence_excerpt: While many risks cannot be quantified due to a lack of site-specific
    data, a risk assessment was completed based on interpretation of the available
    information. One of the most significant risks for the potential project would
    be if underground works were to encounter poor-quality rock or high inflows of
    water. A detailed geological investigation program would need to be performed
    during a feasibility study, including mapping, test pits, drilling and seismic
    refraction surveys.
  confidence_note: Evidence drawn from multiple site sections; Cethana quoted as representative.
