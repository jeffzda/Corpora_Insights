- record_id: ARENA-DLV-18251
  source_title: Battery of the Nation – Pumped Hydro Energy Storage Projects Prefeasibility
    Studies Summary Report
  publish_date: 2019-08
  project_name: Battery of the Nation – PHES Prefeasibility Studies
  what_happened: Of 14 candidate PHES sites assessed at prefeasibility, six were advanced
    to feasibility, two were classified as lower priority due to high cost, and six
    were eliminated — primarily because they were too small in scale, had no viable
    upper reservoir location identified by LiDAR, or were technically infeasible as
    redevelopments of existing stations.
  lesson_learnt: At prefeasibility, a multi-criteria analysis combining scale, unit
    cost, technical complexity, and environmental/social risk is an effective triage
    mechanism — eliminating sites early on objective grounds reduces wasted effort
    in full feasibility studies. Scale thresholds (contribution to a portfolio target)
    should be an explicit screen at concept stage.
