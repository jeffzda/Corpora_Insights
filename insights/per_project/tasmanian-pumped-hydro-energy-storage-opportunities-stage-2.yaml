  project_name: Battery of the Nation – PHES Prefeasibility Studies
  what_happened: The Cethana Power Station Redevelopment and Tribute Power Station
    Redevelopment options were eliminated from further consideration because technical
    difficulties with existing water conveyances and required submergence depths made
    them unlikely to be cost-effective, even though the sites were otherwise known
    locations with existing infrastructure.
  lesson_learnt: Existing hydropower station redevelopment for PHES conversion is
    not inherently lower-risk than greenfield development — the constraints imposed
    by existing infrastructure (conveyance geometry, submergence requirements, powerhouse
    depth) can create technical difficulties that make redevelopment less cost-effective
    than a purpose-designed PHES scheme at the same site.
