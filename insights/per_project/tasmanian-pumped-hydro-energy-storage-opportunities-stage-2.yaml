  what_happened: The Parangana project was found to have a significant impact on existing
    system operations, or result in severely constrained pumped hydro operations,
    when Lake Parangana is near or above full supply level — a fundamental operational
    constraint arising from the reservoir's limited operating range of 2.44 m.
  lesson_learnt: For PHES projects using an existing reservoir with a narrow operating
    range as the lower reservoir, model the interaction with existing system operations
    before advancing to feasibility — a low operating range can create binding operational
    constraints that reduce the effective utilisation of the PHES asset and undermine
    project economics.
