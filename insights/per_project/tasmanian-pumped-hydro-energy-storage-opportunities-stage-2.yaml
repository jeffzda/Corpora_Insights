  publish_date: 2019-08
  project_name: Battery of the Nation – PHES Prefeasibility Studies
  what_happened: The prefeasibility studies confirmed that the availability and quality
    of existing geological data — typically from historical mining investigations
    or prior hydropower construction — was a key differentiator between sites. The
    Tribute and Wilmot projects benefited from well-understood geology due to sub-parallel
    alignment with existing tunnels, whereas Margaret–Burbury and Lake Echo had considerable
    uncertainty due to limited historical data.
  lesson_learnt: When selecting between PHES candidate sites, weight the availability
    of prior geological investigation data heavily — sites that can be aligned sub-parallel
    to existing tunnels or within previously investigated ground offer materially
    lower geological risk at equivalent or lower cost, and this should be an explicit
    criterion in multi-criteria analysis.
