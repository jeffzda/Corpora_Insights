- record_id: ARENA-DLV-18262
  source_title: Battery of the Nation – Pumped Hydro Energy Storage Projects Prefeasibility
    Studies Summary Report
  publish_date: 2019-08
  project_name: Battery of the Nation – PHES Prefeasibility Studies
  what_happened: The Cethana project's preferred upper reservoir site on the western
    side of Lake Cethana was found to contain highland Poa grassland, listed as threatened
    under the Nature Conservation Act 2002, and potential habitat for the ptunarra
    brown butterfly listed as endangered under the EPBC Act. A butterfly survey in
    March 2019 found no individuals, but a follow-up was recommended for 2020 before
    confirming the site.
  lesson_learnt: For PHES upper reservoir sites, conduct targeted threatened species
    surveys in the correct season before confirming site selection — a single off-season
    survey does not clear the planning risk, and species absence must be confirmed
    in conditions when the species is detectable to avoid design being reopened during
    approvals.
