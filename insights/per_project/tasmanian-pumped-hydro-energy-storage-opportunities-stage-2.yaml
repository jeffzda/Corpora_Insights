  source_title: Battery of the Nation – Pumped Hydro Energy Storage Projects Prefeasibility
    Studies Summary Report
  publish_date: 2019-08
  project_name: Battery of the Nation – PHES Prefeasibility Studies
  what_happened: The total pre-construction development timeline for a large PHES
    project — including feasibility study, EIS, grid connection, reference design,
    approvals process, contractor procurement, and commercial activities — was estimated
    at a combined duration well exceeding five years when individual workstream estimates
    (12–18 months, 18 months, 24 months, 6 months, 18 months, 14 months, 12 months)
    are considered, even with parallel-tracking.
  lesson_learnt: Budget a minimum five-year pre-construction development and approvals
    period for large PHES projects in Australia, even with parallel workstreams —
    the compounding of feasibility, EIS, grid connection, procurement and commercial
    close activities means this class of project cannot be fast-tracked without accepting
    significant delivery risk.
