- record_id: ARENA-DLV-18255
  source_title: Battery of the Nation – Pumped Hydro Energy Storage Projects Prefeasibility
    Studies Summary Report
  publish_date: 2019-08
  project_name: Battery of the Nation – PHES Prefeasibility Studies
  what_happened: The development and approvals pathway for large Tasmanian PHES projects
    was found to involve at least seven distinct primary approval processes (including
    parliamentary approval under the Hydro-electric Corporation Act, EPA environmental
    impact assessment, EPBC Act referral, dam work permit, and national parks authority)
    plus multiple secondary approvals — creating a highly complex, multi-agency approvals
    environment.
  lesson_learnt: For large PHES projects in Tasmania, develop an integrated approvals
    strategy before commencing detailed studies — the number of overlapping State
    and Commonwealth approval processes means sequencing and parallel-tracking decisions
    made early can materially affect total development timeline.
  issue_severity: moderate
  project_type: storage
