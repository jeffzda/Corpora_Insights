- record_id: ARENA-DLV-18259
  source_title: Battery of the Nation – Pumped Hydro Energy Storage Projects Prefeasibility
    Studies Summary Report
  publish_date: 2019-08
  project_name: Battery of the Nation – PHES Prefeasibility Studies
  what_happened: The Margaret–Burbury project involves linking Lake Margaret (upper)
    with Lake Burbury (lower), but Lake Burbury lies in a catchment affected by historical
    mining operations with copper and zinc concentrations exceeding ANZECC guidelines.
    Pumping and transferring water between the reservoirs risks mixing water of different
    pH and heavy metal concentrations, with potential impacts on Lake Margaret and
    the downstream Yolande River.
  lesson_learnt: When linking two existing reservoirs for PHES, conduct early water
    quality compatibility assessment — transferring water between catchments affected
    by historical contamination can create irreversible cross-contamination risks
    that may render a project undeliverable regardless of its engineering merits.
