    is not always a cost-effective approach — where the existing scheme's parameters
    (head, alignment) constrain the new configuration, the duplication strategy may
    produce higher unit costs than a purpose-designed scheme at a different site;
    validate cost competitiveness against greenfield alternatives before committing
    to a duplication approach.
