  source_title: Battery of the Nation – Pumped Hydro Energy Storage Projects Prefeasibility
    Studies Summary Report
  publish_date: 2019-08
  project_name: Battery of the Nation – PHES Prefeasibility Studies
  what_happened: LiDAR survey of the Lake Margaret and Lake Rosebery sites revealed
    that no suitable location for an upper reservoir could be found at either site,
    eliminating both projects from further consideration despite nominal capacities
    of 300 MW and 400 MW respectively.
  lesson_learnt: Conduct LiDAR-based topographic survey before investing in detailed
    prefeasibility work — the absence of a viable upper reservoir site is a fatal
    flaw that cannot be mitigated, and early identification avoids wasted study expenditure
    on otherwise promising projects.
