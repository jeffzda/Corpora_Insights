  secondary_failure_mode: null
  intervention_note: Document recommends developing an approvals strategy as a prerequisite
    to commencing specialist studies.
  transferability: narrow
  delay_magnitude: not quantified
  technology_domain: pumped hydro
  source_pages: &id005
  - 35
  - 36
  evidence_excerpt: One of the most significant activities during the development
    of any infrastructure project is securing project approvals. For a project of
    this scale, significant effort would be required to prepare documentation ahead
    of submission to approval agencies... Prior to commencing this work, a strategy
    for securing approvals must be decided upon.
