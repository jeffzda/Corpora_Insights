  source_title: Battery of the Nation – Pumped Hydro Energy Storage Projects Prefeasibility
    Studies Summary Report
  publish_date: 2019-08
  project_name: Battery of the Nation – PHES Prefeasibility Studies
  what_happened: The Poatina project was identified as carrying considerable technical
    risk due to its high head (812 m), which is at the upper limit of existing multi-stage
    reversible pump-turbine technology with limited suppliers. The alternative of
    ternary sets would add significant cost and no suitable layout had been developed
    for that alternative at prefeasibility stage.
  lesson_learnt: Before advancing a high-head PHES project to feasibility, confirm
    equipment supplier availability and technology readiness for the operating head
    — if the required head is at or above the commercial limit for reversible pump-turbines,
    the project faces both supply chain concentration risk and potential cost escalation
    from the ternary set alternative.
