    Studies Summary Report
  publish_date: 2019-08
  project_name: Battery of the Nation – PHES Prefeasibility Studies
  what_happened: The Poatina project was found to potentially require upgrading the
    existing tailrace canal, re-regulation pond, and Brumbys Creek to handle an emergency
    spill from the new lower reservoir — a requirement identified as a key project
    risk with considerable cost and downstream impact implications that needed confirmation
    before proceeding to feasibility.
  lesson_learnt: For PHES projects that add a new lower reservoir to an existing scheme,
    assess downstream infrastructure capacity for emergency spill scenarios before
    committing to feasibility — the cost and impact of upgrading existing downstream
    conveyances can be a project-deciding risk factor if not identified early.
