  what_happened: The document identified that transferring water between two existing
    reservoirs in different catchments for PHES purposes can have significant environmental
    implications if water quality, endangered species, or invasive species are present
    in one reservoir but not the other — an issue flagged as needing early identification
    in the project development process.
  lesson_learnt: For PHES schemes linking two existing reservoirs from different catchments,
    conduct catchment-level biodiversity and water quality screening before finalising
    the project concept — invasive species or water quality incompatibility between
    catchments can be a fatal constraint that is much cheaper to identify at concept
    than after feasibility investment.
