  what_happened: The Rowallan project's potential footprint was found to include two
    patches of Sphagnum peatland and highland Poa grassland, both threatened under
    the Nature Conservation Act 2002, with Sphagnum peatland also listed as an endangered
    ecological community under the EPBC Act. The proximity of the site to the Tasmanian
    Wilderness World Heritage Area further elevated environmental sensitivity of the
    layout.
  lesson_learnt: Projects sited near World Heritage Areas or with threatened ecological
    communities in the footprint face a compounded approvals risk — both State and
    Commonwealth EPBC triggers may be activated simultaneously, requiring parallel
    rather than sequential regulatory processes; identify all potential EPBC 'matters
    of national environmental significance' at concept stage before finalising site
    layout.
