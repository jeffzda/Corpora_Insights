- record_id: ARENA-DLV-69018
  source_title: ARENA Insights Forum Session Summaries and Key Points
  publish_date: 2022-11
  project_name: Green alumina decarbonisation (Alcoa / Rio Tinto / South 32)
  what_happened: A roadmap for decarbonising Australian alumina refining found that
    no single technology solution applies across all refineries. Different combinations
    of MVR, electric boilers, electric calcination, and hydrogen calcination are required
    depending on each refinery's specific characteristics, and thermal storage is
    a key enabling technology.
  lesson_learnt: Alumina refinery decarbonisation projects must be assessed individually
    rather than through a portfolio-wide technology template — the specific barriers
    and opportunities of each refinery require tailored technology combinations, and
    a one-size-fits-all approach will lead to misallocated investment.
