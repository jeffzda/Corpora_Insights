- record_id: ARENA-DLV-40614
  source_title: ARENA Electrical Infrastructure Roundtable
  publish_date: '2025-06-25'
  project_name: ENTSO-E TYNDP 2024 – Cost of Inaction on Transmission Investment
  what_happened: ENTSO-E modelling found that if Europe stops investing in its power
    system after 2030, the 2040 consequences include 473 TWh of renewable energy curtailed
    annually, 263 TWh of gas-based power generation per year, system instability risk,
    and an EU energy bill rising to 49.5 billion euro per year — versus an investment
    cost of 6 billion euro per year that would instead deliver 13 billion euro per
    year in system cost savings.
  lesson_learnt: Quantified modelling of the cost of inaction on transmission investment
    — including renewable curtailment, fossil fuel lock-in, and system instability
    — provides a powerful planning and policy tool; infrastructure planners in Australia
    should develop and publish equivalent reference-class modelling to support investment
    cases for transmission augmentation.
