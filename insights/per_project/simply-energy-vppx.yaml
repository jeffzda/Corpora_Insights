- record_id: ARENA-DLV-64419
  source_title: Distributed Energy Resources (DER) Integration Project Contribution Assessment
  publish_date: 2019-03
  project_name: Simply Energy VPPx
  what_happened: Simply Energy's VPPx project ($7.7m, commenced March 2018) aimed to establish a 1,200-home solar and battery VPP with 6MW capacity, integrate with the deX distributed energy market platform,
    test the DSO/DMO roles, and directly access the FCAS market — making it the first VPP to attempt direct FCAS market participation while also providing network visibility to SA Power Networks.
  lesson_learnt: First-mover VPP projects attempting direct FCAS market access should plan for significant engagement with AEMO on measurement, verification and bidding infrastructure requirements from
    project inception — the regulatory and technical pathways for direct VPP market participation are not yet established and require co-design with the market operator.
