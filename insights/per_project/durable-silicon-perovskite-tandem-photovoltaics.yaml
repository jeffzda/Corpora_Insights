- record_id: ARENA-DLV-4252
  source_title: Durable Silicon Perovskite Tandem Photovoltaics - Interim Project
    Dissemination Report (including Lessons Learnt)
  publish_date: 2021-10
  project_name: Durable Silicon Perovskite Tandem Photovoltaics
  what_happened: After a comprehensive literature review, anodic bonding was found
    to require temperatures above 200°C and high direct current voltages, making it
    unsuitable as a primary hermetic encapsulation method for perovskite solar cells,
    which are degraded by elevated temperatures.
  lesson_learnt: Anodic bonding should not be pursued as the primary encapsulation
    method for perovskite solar cells due to its >200°C temperature requirement; however,
    it may be viable for forming electrical feedthroughs. Future work should focus
    on optimising anodic bonding for feedthrough applications by examining interlayer
    type, cleaning method, and bonding parameters (voltage, pressure, time, temperature).
  issue_severity: moderate
  project_type: null
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Research pivoted from pursuing anodic bonding as a full encapsulation
    solution to exploring its use specifically for electrical feedthroughs, while
    continuing investigation of alternative polymer-free bonding approaches.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id002
  - 8
  evidence_excerpt: Due to the bonding temperature required to be above 200°C, anodic
    bonding is less desirable for encapsulating perovskite solar cells but possibly
    suitable for forming electrical feedthrough for the purpose of extracting power
    from the encapsulated solar cells.
  confidence_note: issue_severity set to moderate — the finding redirected a work
    package but did not halt the project. failure_mode is design assumption failure
