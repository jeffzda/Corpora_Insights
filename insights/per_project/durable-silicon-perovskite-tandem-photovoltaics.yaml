- record_id: ARENA-DLV-15554
  source_title: Tandem Silicon - Durable Silicon Perovskites Tandem Photovoltaics
    Report
  publish_date: 2023-03
  project_name: Durable Silicon Perovskite Tandem Photovoltaics
  what_happened: Interfacing layers used in Si-perovskite and Si-perovskite quantum
    dot (QD) tandem cells were identified as a primary source of device instability
    during the project, with preliminary stability tests showing unencapsulated tandem
    cells retaining only 70% of initial efficiency after 7 days in ambient storage.
  lesson_learnt: In Si-perovskite and Si-perovskite QD tandem cell development, treat
    interfacing layers as a primary instability risk and systematically trial alternative
    interface materials before advancing to durability testing — interface-driven
    degradation can dominate device lifetime even when the sub-cells individually
    perform adequately.
