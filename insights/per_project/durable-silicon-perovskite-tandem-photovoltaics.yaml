  source_title: Tandem Silicon - Durable Silicon Perovskites Tandem Photovoltaics
    Report
  publish_date: 2023-03
  project_name: Durable Silicon Perovskite Tandem Photovoltaics
  what_happened: Masking tape used for area definition during fabrication of carrier-selective
    layers in low-pH environments degraded in the acidic conditions. Similarly, laboratory
    glassware seals degraded when exposed to the acidic environment created during
    synthesis of perovskite QD precursors.
  lesson_learnt: Select chemically stable masking tape and labware seals rated for
    the specific acidic process environments encountered in perovskite and QD fabrication,
    or redesign processes to eliminate reliance on masking tape — incompatible materials
    can compromise device fabrication and introduce contamination.
