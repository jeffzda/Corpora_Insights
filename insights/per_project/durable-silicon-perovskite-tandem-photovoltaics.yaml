- record_id: ARENA-DLV-15552
  source_title: Tandem Silicon - Durable Silicon Perovskites Tandem Photovoltaics
    Report
  publish_date: 2023-03
  project_name: Durable Silicon Perovskite Tandem Photovoltaics
  what_happened: Developing a direct glass-glass bonding encapsulation method (without
    polymer lamination) required introducing capping layers, edge seals, and desiccating
    materials, some of which risked reacting with the perovskite absorber, carrier-selective
    materials, and metal electrodes. Choice of cover glass also proved critical for
    UV transmission in tandem cell configurations.
  lesson_learnt: When developing polymer-free glass-glass bonding encapsulation for
    perovskite cells, carefully screen all capping layers, edge seals, and desiccating
    materials for chemical compatibility with the perovskite absorber, carrier-selective
    layers, and metal electrodes; also select cover glass that provides high UV transmission
    for tandem configurations.
