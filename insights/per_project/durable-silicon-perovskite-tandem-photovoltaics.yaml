  evidence_excerpt: Sometimes devices are masked (via the use of taping) for area
    definition during the fabrication of carrier-selective layer which can happen
    in low pH environment. The masking tape if chosen inappropriately can degrade
    in the acidic environment. Likewise, the synthesize of perovskite QD precursors
    can create an acidic environment causing laboratory glassware seals to degrade
    if chosen inappropriately.
