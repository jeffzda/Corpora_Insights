  publish_date: 2023-03
  project_name: Durable Silicon Perovskite Tandem Photovoltaics
  what_happened: High-throughput in-situ IV testing inside an inert (oxygen-free)
    environment caused degradation of the LED-based light source, as LEDs degraded
    in the absence of oxygen. The degradation was found to be reversible upon re-exposure
    to oxygen.
  lesson_learnt: Set up separate compartments for the solar simulator (with oxygen
    present) and for the solar cells under test (in an oxygen-free environment) to
    prevent LED degradation during long-duration stability testing.
