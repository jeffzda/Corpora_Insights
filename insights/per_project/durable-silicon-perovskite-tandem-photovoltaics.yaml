  source_title: Tandem Silicon - Durable Silicon Perovskites Tandem Photovoltaics
    Report
  publish_date: 2023-03
  project_name: Durable Silicon Perovskite Tandem Photovoltaics
  what_happened: Laboratory instruments used during the project had software bugs
    that remained unfixed by vendors due to the small user base. Required features
    such as maximum-power-point tracking and automated overnight operation were missing
    from supplied software, with no certainty that the vendor would add them or provide
    interfaces for researchers to do so.
  lesson_learnt: Before purchasing laboratory instruments, request access to source
    code (under NDA if necessary) or confirm that documented hardware interfaces and
    protocols are available — this ensures missing features can be added independently
    without relying on vendor prioritisation; instruments using open-source or openly-interfaced
    software provide the greatest long-term flexibility.
  issue_severity: moderate
  project_type: null
