  publish_date: 2023-03
  project_name: Durable Silicon Perovskite Tandem Photovoltaics
  what_happened: The project identified that improving cell encapsulation alone is
    insufficient for durable perovskite cells; reactive dopants in carrier-selective
    materials, volatile organic components in the perovskite absorber, and reactive
    metal electrodes are independent sources of degradation that must also be addressed.
  lesson_learnt: Reduce reliance on reactive dopants in carrier-selective materials,
    volatile organic components in the perovskite absorber, and reactive metal electrodes
    as a complementary strategy to encapsulation improvement — sole reliance on better
    encapsulation is insufficient for achieving durable perovskite single-junction
    and tandem solar cells.
