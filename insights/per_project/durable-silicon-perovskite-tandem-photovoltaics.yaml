  source_pages: &id009
  - 19
  evidence_excerpt: Laboratory instruments that come with computer software frequently
    have bugs in the software. The user base of laboratory products is so small that
    bugs can remain un-fixed by the manufacturer for several years. Also where features
    are missing in the software (such as maximum-power-point tracking in the equipment
    used to measure solar cells, or the ability for the software to be controlled
    automatically overnight without a human clicking a mouse button), once the instrument
    has been purchased there is no certainty that the instrument vendor will add the
    feature.
  confidence_note: secondary_failure_mode of data quality/measurement failure included
