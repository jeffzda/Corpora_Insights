- record_id: ARENA-DLV-15555
  source_title: Tandem Silicon - Durable Silicon Perovskites Tandem Photovoltaics
    Report
  publish_date: 2023-03
  project_name: Durable Silicon Perovskite Tandem Photovoltaics
  what_happened: The hyperspectral imaging tool used was a microscope-based system
    designed for small-area, high-resolution imaging. When imaging multiple solar
    cells in a sample testing jig, full mapping was required due to the limited field
    of view, and the working distance between the objective lens and sample was less
    than 1 cm, severely restricting the design flexibility of multi-cell testing jigs.
  lesson_learnt: For statistical analysis and uniformity monitoring across multiple
    cells, choose a free-space coupling hyperspectral imaging system rather than a
    microscope-based version — the free-space model allows the field of view to be
    controlled over a broad physical range with an appropriate imaging lens, providing
    greater flexibility in sample jig design despite some sacrifice in spatial resolution.
  issue_severity: minor
  project_type: null
  project_scale_band: lab/bench
  lifecycle_phase: procurement
