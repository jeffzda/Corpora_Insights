  project_name: Durable Silicon Perovskite Tandem Photovoltaics
  what_happened: In a university IT environment, the Windows Update 'pause' feature
    did not work reliably on desktop Windows operating systems, causing computers
    running laboratory equipment software to reboot mid-experiment. This resulted
    in failed long-duration experiments and data loss.
  lesson_learnt: For long-term laboratory experiments requiring continuous data collection,
    avoid equipment that depends on Windows desktop operating system software; instead
    select instruments that operate with a server OS such as Linux or a server version
    of Windows to prevent data loss from automatic OS updates and reboots.
