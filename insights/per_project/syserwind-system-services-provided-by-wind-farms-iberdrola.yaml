- record_id: ARENA-DLV-72297
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: '2015'
  project_name: SYSERWIND – System Services Provided by Wind Farms (Iberdrola)
  what_happened: Iberdrola's SYSERWIND project successfully demonstrated coordinated
    voltage and frequency control across 15 wind farms (>480MW) on a 350km 400kV line
    in Spain, reducing voltage deviation from 9kV to 0.7kV, but found that providing
    upward power reserve services required curtailing a large amount of energy that
    was uneconomic under current market rules.
  lesson_learnt: Wind farms can technically provide secondary frequency and voltage
    control services but require regulatory frameworks and remuneration mechanisms
    that make curtailment for upward reserve provision commercially viable — technology
    readiness without matching market rules prevents deployment.
