- record_id: ARENA-DLV-11062
  source_title: International Engagement Program Mid Term Evaluation Report
  publish_date: '2020-07-10'
  project_name: International Engagement Program (IEP) – Smart Grids MI Challenge (CSIRO)
  what_happened: CSIRO's Smart Grids MI Challenge project used international relationships developed through the IEP — specifically with Danish experts experienced in micro-grid and battery systems — to
    advise a Western Australian pilot using blockchain technology (Power Ledger) to create a Virtual Power Plant. The pilot received $2.5 million from the Australian Government and $5.5 million from research
    and private partners.
  lesson_learnt: International engagement that deliberately targets counterparts with directly applicable operational experience (rather than general subject-matter expertise) generates the highest domestic
    application value — programs should encourage grantees to identify specific knowledge gaps and actively seek out international practitioners who have already solved those problems.
